answer: |-
  The gain knob on the sonar had a specific friction to it, a gritty click-click-click that Mara knew better than the feel of her own front door. She turned it down one notch. The clutter on the screen smoothed out, the static of suspended sediment falling away to reveal the ghost.

  It wasn't a school. Schools were loose aggregations, individual fish reacting to neighbors. This was a solid mass, three hundred meters across, holding a perfect sphere against a four-knot current at eight hundred meters depth.

  "It's defying the thermocline," Elias said. He was leaning over her shoulder, smelling of stale coffee and solder. Elias was the physicalist. To him, the ocean was a plumbing problem. Pressure, temperature, salinity, viscosity. If you knew the variables, you knew the outcome. Agency was a fairy tale you told when the math got too hard.

  "It's not defying anything," Sarah said from the radar station. She was the design stance. She saw evolution as an engineer who never slept. "It's optimizing. Look at the density. They're minimizing surface area to reduce drag. It's a structural solution to a kinetic problem."

  Mara kept her eyes on the green sweep. "It's holding position to watch us."

  "Don't start," Elias sighed. "It's a blob of biomass. It doesn't watch. It reacts to pressure waves from the hull."

  "It turned when we turned," Mara said. "Not immediately. Ten seconds later. Like it processed the data."

  "Latency in the acoustic reflection," Elias countered. "Refraction layers."

  "A ten-second refraction lag?" Mara tapped the console. "And yesterday, when we dropped the CTD probe? It parted. Like Moses. Then closed behind it. That's not hydrodynamics, Elias. That's a gate."

  Sarah swiveled her chair. "It's a defensive formation. Refined over millions of years. The individuals don't know they're doing it, but the selection pressure shaped the behavior. It's a machine. A very complex one. But calling it 'watching' is lazy. It's just executing code."

  "Code implies a programmer," Mara said.

  "Natural selection is the programmer," Sarah shot back. "Blind, but effective."

  Mara zoomed the range. The sphere pulsed. A ripple moved through the center of the mass, outward to the edge, faster than any nerve impulse could travel between individual animals. It looked like a shiver. It looked like a thought.

  She didn't tell them about Dennett. She read that stuff in the bunk at night, the pages illuminated by a red clip light, while the ship groaned around her. *The Intentional Stance.* Treat the system as a rational agent. Attribute beliefs and desires. Predict behavior based on what it *should* do if it wanted to survive.

  If she treated the sphere as a machine (Sarah), it should conserve energy. It should drift with the current.
  If she treated it as matter (Elias), it should succumb to the upwelling.
  If she treated it as an agent (Mara), it should be afraid.

  The alarm on the comms panel chirped. Surface contact.

  "The *Kodiak*," Sarah said, reading the transponder. "Trawler. Setting nets in twenty minutes. Right above us."

  Elias straightened up. "They'll catch the top layer. The sphere will rise with the upwelling tonight. Physics says they're doomed."

  "Design says they should scatter," Sarah said, her fingers flying over her keyboard, modeling the metabolic cost of dispersal. "But they haven't. Why? Maybe the energy cost of scattering is higher than the loss of the top ten percent. Rational trade-off."

  Mara watched the pulse on the screen. The ripple was faster now. "They know the net is coming."

  "They can't know," Elias said. "They detect vibration. They don't conceptualize 'net'."

  "They conceptualize 'trap'," Mara said. "Look."

  She pointed to the bottom of the sphere. It was flattening. Spreading out.

  "If they were just optimizing for drag, they'd stay spherical," Sarah said. "This increases drag. Inefficient."

  "Unless the goal isn't efficiency," Mara said. "Unless the goal is contact."

  The *Kodiak* was a factory ship. If they netted this biomass, it was a payday that would keep the crew in port for a year. If the research team intervened, claimed the area was a protected study zone, the *Kodiak* would have to move. Loss of revenue. Angry calls from the institute. If they didn't intervene, and the sphere was just fish, a species might vanish.

  But Mara had a third fear. If the sphere was what she thought it was—a pattern so complex it had crossed the threshold into agency—then the net wasn't just a harvest. It was a provocation.

  "We need to radio them," Mara said. "Tell them to hold position."

  "On what grounds?" Elias asked. "Hydrographic anomaly? They'll laugh. Say it's fish."

  "On grounds that the fish might fight back," Mara said.

  Sarah laughed, a short, sharp sound. "Fish don't fight nets. They swim into them."

  "This isn't a school," Mara said. "It's a system. And I think it's trying to lure the net down."

  She pointed to the flattening base again. "If I wanted to damage a predator that I couldn't outrun, I wouldn't run. I'd let it grab me. Then I'd drag it. The weight of this mass... if they synchronize a dive while entangled..."

  "The net snaps," Sarah finished. "Or the winch jams. Maybe the prop gets fouled."

  "Or the ship gets pulled under," Elias said, his voice dropping. He was looking at the mass differently now. Not as matter, but as weight. "That's... that's a lot of torque."

  "If we tell them to stop, we lose the season's data," Sarah said. "The *Kodiak* clears the area, we can't deploy the sub. But if you're wrong, Mara, and it's just a school... we've cost a crew their bonus for no reason."

  "If I'm right," Mara said, "and we don't tell them, the *Kodiak* loses its gear. Maybe the ship. And we lose the subject."

  "And if you're wrong about the agency," Elias said quietly. "If it's just currents... then you're attributing a soul to a whirlpool."

  "That's the bet," Mara said.

  She looked at the screen. The sphere was no longer a sphere. It was a hook.

  Dennett wrote that the question isn't whether the system *really* has beliefs. The question is whether the prediction works. If treating it as a believer saves the ship, is the belief real? Or is it just a useful fiction?

  It felt like standing on the edge of a pier in the dark. You can't see the water, only the reflection of the lights. You jump because you trust the water is there. If you hit bottom, the water wasn't real enough. If you float, it was.

  "Radio them," Sarah said suddenly.

  Elias looked at her. "You think it's a trap?"

  "I think the design is too good," Sarah said. "Evolution doesn't make mistakes like this often. A formation that ignores hydrodynamics? That's a specialized tool. You don't evolve a specialized tool unless you use it."

  "It's physics," Elias muttered, but he reached for the mic. "This is *Acalolepta*. We have a submerged hazard. Advise you hold net deployment."

  The silence on the bridge was heavy. The hum of the servers, the slap of water against the hull. On the screen, the hook shape tightened.

  "*Kodiak* copies," the radio crackled. "Holding. But you owe us a drink, *Acalolepta*."

  Mara exhaled. She hadn't realized she was holding her breath.

  They watched for an hour. The *Kodiak* drifted. The sphere below them held its shape. Then, slowly, the mass began to sink. Not drifting. Sinking. Active propulsion. It descended past the thermocline, into the black where the *Kodiak*'s nets couldn't reach.

  "It avoided the capture zone," Sarah said. "Without expending the energy to scatter."

  "It wanted us to see it," Mara said. "It wanted us to stop the trawler."

  "Or," Elias said, turning back to his console, "the upwelling shifted. The current changed direction at 0200 hours. The mass followed the nutrient layer."

  "The current changed ten minutes *after* we radioed," Mara said.

  "Coincidence," Elias said. But he didn't look at her. He looked at the data logs. He was checking the physical variables, trying to find the equation that would dissolve the ghost.

  Sarah was already writing her report. *Adaptive defensive morphology.* She was translating the agency into design. Making it safe. Making it a machine again.

  Mara stayed at the sonar. The screen was dark now, the sphere gone into the deep.

  She felt the liberation of it. She had navigated by a star that might not exist. She had spoken to a mind that might be made of nothing but fish-flesh and instinct, and it had listened. The pattern was real because it had cashed out. The prediction paid off.

  But the lump in her throat remained.

  If Elias found the current shift in the logs tomorrow, if he proved that the physics dictated the move all along, did that make her wrong? Or did it just mean the physical stance was harder to calculate?

  If the agency was just a shortcut for complexity, a compression algorithm for behavior too vast to track atom by atom, then she was just a user interface. She wasn't seeing the world. She was seeing a desktop icon. Click the icon, the file opens. But there is no file. There is only magnetic alignment on a platter.

  She turned the gain knob. Click. Click. Click.

  The static returned. The noise of the ocean. The raw data. It was all there, the truth of the thing, chaotic and meaningless and absolute.

  She turned the gain back. The ghost reappeared. A clean line. A target. A friend.

  "Log it as behavioral avoidance," Sarah called out, not looking up from her screen.

  "Log it as current shear," Elias said.

  Mara typed into the log. *Subject exhibited intent.*

  She hit enter. The text saved. It was now part of the record. A fact.

  Outside, the sea was indifferent. It didn't care if it was matter, machine, or mind. It just was. But inside the bridge, surrounded by the hum of electronics and the glow of screens, they had to choose which world they lived in to get through the night.

  Mara put her hand on the gain knob. She didn't turn it. She let the ghost sit on the screen, real enough to steer by, false enough to haunt her. It would have to be enough.
