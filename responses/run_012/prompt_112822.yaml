answer: |-
  1. Consider a de novo gene that arises in a bacterial lineage through random recombination. It immediately confers a significant survival advantage in the current environment, but it has no ancestral history of selection because it has never existed before. On your account, does this trait possess a biological function the moment it appears, or must it wait until it has been inherited by a subsequent generation?

  **Follow-up:** If you say it must wait for inheritance, you seem to deny function to the very trait instance that is currently sustaining the organism's life. If you say it has a function immediately, you appear to be grounding function in current causal contribution rather than history. How do you avoid sliding into a causal-role account at the point of origin?

  2. Let us shift to a trait fixed in a population purely by genetic drift. Suppose a specific morphological feature in a small island population becomes universal not because it aids survival, but simply due to sampling error, though it happens to be harmless. Later, the environment changes, and this feature becomes advantageous. Does the feature acquire a function only after the environment changes, or did it lack a function entirely during the drift phase?

  **Follow-up:** If you insist it lacked a function during the drift phase, you must accept that two identical traits in identical environments can differ in functional status solely based on their unobservable history. Does this not make function attribution epistemically inaccessible in a way that undermines its utility for working biologists?

  3. Selection acts on whole organisms, yet we ascribe functions to specific traits. Consider a pleiotropic gene that affects both pigment production and immune response. Suppose the lineage was selected for the immune response, but the pigment was a free-rider. Now the environment changes: the immune threat vanishes, but the pigment becomes crucial for camouflage. What is the function of the gene in the new environment?

  **Follow-up:** If you say the function remains the immune response because that is what selected for it historically, you are ascribing a function to an effect that is no longer beneficial. If you say the function switches to camouflage, you are grounding function in current utility. How do you fix the description of the function without referencing current contribution?

  4. Imagine a vestigial organ that was strongly selected for in the ancestral environment but is now useless because that environment no longer exists. The organ is retained in the population simply because there is no cost to removing it. If the organ fails to develop correctly in an individual, is that individual suffering from a malfunction, or do they merely possess a useless trait?

  **Follow-up:** If you claim it is a malfunction, you are invoking a norm grounded in a selective pressure that no longer exists. What is the ontological status of a norm that persists after the conditions that created it have vanished? Does this not render the normativity of function spooky or disconnected from current biological reality?

  5. Take the case of exaptation where a trait is selected for effect A, but later co-opted for effect B, and both effects are now maintained by selection. Think of a protein that originally stabilised cell membranes but now also binds to toxins. Does this trait now have two distinct functions, or does the original selected effect supersede the new one?

  **Follow-up:** If you grant it has two functions, you must explain how we distinguish this from a causal-role account that simply lists all beneficial effects. If you insist on only the original function, you ignore the current selective reality maintaining the trait. Does your account not struggle to track the dynamic nature of trait maintenance over deep time?

  6. In the debate over genomic function, one camp argues that any reproducible biochemical activity counts as function, while your camp demands evidence of selection. Consider a transposable element that replicates within the genome, harming the host organism but successfully spreading itself. Does this element have a function for the organism, for the genome, or for itself?

  **Follow-up:** If you say it has a function for itself, you are committed to the view that the gene is the primary unit of selection and biological individuality. If you say it has no function because it harms the organism, you must explain why its highly organised, selected replicative machinery does not count as functional. Where do you draw the line on biological individuality to save the account?

  7. Turn to synthetic biology. Suppose we design a genetic circuit from scratch and insert it into a bacterium. We then release this bacterium into a bioreactor where it evolves for a thousand generations, maintaining the circuit because it aids survival in that specific tank. Does the circuit acquire a proper biological function, or does it remain an artefact with an intended purpose?

  **Follow-up:** If you say it acquires a biological function, you admit that designer intentions are irrelevant once selection takes over. If you say it remains an artefact, you imply that natural selection and artificial selection are fundamentally different processes regarding function. What is the principled difference between a human designer and a selective environment that makes one confer function and the other not?

  8. Ecologists often speak of the function of a wetland in filtering water or a keystone species in maintaining diversity. These entities do not reproduce as lineages in the way genes or organisms do. Do these ecosystem-level entities have biological functions in your sense, or is this merely metaphorical language?

  **Follow-up:** If you say it is metaphorical, you concede that a vast amount of biological discourse is strictly speaking false or imprecise. If you say it is literal, you must explain what the replicating lineage is that grounds the function. Does extending the account to ecosystems require stretching the notion of selection history until it breaks?

  9. You have likely responded to cases of novel traits by distinguishing between trait tokens and trait types, suggesting the token is new but the type has a history. How do you individuate these types without referencing the very causal roles you claim are distinct from function?

  **Follow-up:** If you type traits by their structure, you risk grouping together traits with different functions. If you type them by their effect, you are defining function in terms of causal role, which collapses your account into the very alternative you oppose. What non-functional criterion do you use to type traits that avoids this circularity?

  10. Return to the vestigial organ case. If we agree that past selection licenses talk of malfunction even when the effect is impossible, what grounds the normativity? Is it a fact about the past, or a projection we make from the present?

  **Follow-up:** If it is a fact about the past, it is difficult to see how it governs present-day evaluation. If it is a projection, then function ascriptions are not objective features of the world but interpretive stances. Are you prepared to accept that function is mind-dependent in this way?

  11. Critics argue that the selected-effects account adds historical baggage without increasing explanatory power. When a physiologist explains how the heart works, they cite its current pumping capacity, not its evolutionary history. What work is the history doing in the explanation of the current trait presence?

  **Follow-up:** If you say the history explains why the trait is here rather than some other trait, you are explaining existence, not activity. But function ascriptions are often used to explain activity. Does your account not conflate the explanation of a trait's origin with the explanation of its current contribution?

  12. Finally, if the causal-role account can handle novelty, drift, and current contribution without historical baggage, and if your account must retreat to trait types and accept epistemic opacity to handle the same cases, what is the decisive advantage that keeps you from adopting the causal-role view?

  **Follow-up:** If your answer is that only your account captures normativity, but you have conceded that norms can persist without current utility and may be grounded in inaccessible history, have you not secured normativity at the cost of making function biologically irrelevant?

  ***

  **Closing Note**

  I believe Question 9 regarding the individuation of trait types is the most likely to misfire. This objection rests on the premise that there is no non-functional way to type traits, but a sophisticated etiological theorist can reasonably reject this by appealing to structural or developmental homology criteria that are independent of function. If she can demonstrate that trait types can be fixed by developmental pathways rather than effects, the charge of circularity loses its force. I would consider the account to survive this objection if she can provide a clear criterion for typing that does not sneak in causal-role assumptions. Conversely, if she is forced to admit that typing relies on what the trait *does* rather than what it *is*, the account fails, as it collapses into the causal-role view it seeks to replace.

  My own confidence is lowest on the synthetic biology line of questioning (Question 7). It is plausible that a defender could argue that artificial selection is a subspecies of natural selection, or that the designer acts as the selective environment, thereby neutralising the distinction. I am not entirely convinced that the origin of the trait (human mind versus blind nature) is philosophically salient for function ascription once the evolutionary process is underway. Evidence that would move me would be a robust argument showing that intentional design introduces a teleology that is structurally distinct from blind selection, such that conflating them obscures more than it reveals. Until then, I remain open to the possibility that the selected-effects account can absorb synthetic cases without damage.
