answer: |-
  Here is the specification for Ruth's theory, broken down into the empirical, methodological, and conceptual burdens she must carry. I have flagged the non-negotiable constraints (hard limits from statistics and data science) separately from the historiographical prejudices (arguments that are often more aesthetic than logical). I have also identified the two requirements that are mutually exclusive, which should serve as the climax of your ambush scene.

  ### I. The Empirical Burden: Which Cases Count?

  To be taken seriously, the theory cannot simply cherry-pick the famous collapses. It requires a structured dataset.

  **1. The Positive Cases (Non-negotiable)**
  The model must accurately retrodict the onset of instability in at least three major agrarian empires that are structurally distinct.
  *   *The Cases:* The Late Roman Republic/Empire, the Ming-Qing transition in China, and the French Ancien Régime are the standard triad.
  *   *The Requirement:* The model must signal 'critical' status 10–20 years *before* the outbreak of violence or fiscal default, using only data available at that time.
  *   *Why:* If the model only 'works' when looking backwards from the known date of collapse, it is curve-fitting, not forecasting.

  **2. The Negative Cases (Non-negotiable)**
  The theory must identify periods where the variables spiked but no collapse occurred, and explain why without ad-hoc rationalisation.
  *   *The Test:* A 'false positive' is more valuable than a hit. If grain prices and elite overproduction peaked in, say, 16th-century Spain or Edo-period Japan, but the state held, the model must account for this.
  *   *Why:* A theory that predicts collapse every time the variables move is useless. It must have a threshold that distinguishes 'stress' from 'failure'.

  **3. The Holdout Case (The Keynote Moment)**
  Ruth needs a prediction for a society not used to build the model.
  *   *The Test:* She should present a forecast for a region where the historical consensus expects stability (or instability) based on traditional narrative history, but her math says the opposite.
  *   *Why:* This demonstrates out-of-sample validity. If she predicts crisis in a 'Golden Age', she forces the audience to choose between their intuition and her arithmetic.

  ### II. The Methodological Burden: Statistics and Data

  This is where the theory is most vulnerable to technical attack.

  **4. Degrees of Freedom (Non-negotiable)**
  Ruth uses three or four variables (grain, wages, elite posts, fiscal slack). She must prove she hasn't used more.
  *   *The Constraint:* If she tweaks the variables until the curve fits, she is overfitting. She must pre-register her variables.
  *   *Why:* With enough parameters, you can fit an elephant. If she adds a fifth variable to explain away a miss, the theory is unfalsifiable.

  **5. Dating Uncertainties (Non-negotiable)**
  Archaeological and economic data from pre-modern states rarely have precise years.
  *   *The Constraint:* If her 'cycle' is 250 years, but the dating error on the collapse is ±50 years, the signal is lost in the noise. She must demonstrate that her data resolution is finer than her predicted cycle.
  *   *Why:* You cannot claim a precise schedule if the events themselves are blurry.

  **6. Spatial Autocorrelation (Prejudice vs. Reality)**
  Critics will argue that empires influence each other (trade, war, plague), meaning they are not independent data points.
  *   *The Prejudice:* Historians often insist every society is unique (aesthetic objection).
  *   *The Reality:* If the Ming collapse and the Roman collapse were both triggered by a hemispheric climate event (e.g., volcanic winter), they are not independent tests of an *internal* cycle.
  *   *Requirement:* She must control for exogenous shocks. If she doesn't, she is modelling the climate, not the state.

  ### III. The Conceptual Burden: Distinctions to Maintain

  Ruth's claim that she "doesn't care why" is her strongest rhetorical shield and her weakest theoretical flank. She must navigate these distinctions carefully.

  **7. Prediction vs. Retrodiction (Non-negotiable)**
  She must distinguish between fitting the past (retrodiction) and forecasting the future (prediction).
  *   *The Trap:* It is trivially easy to make a model that explains the French Revolution perfectly once you know it happened.
  *   *The Requirement:* She must show that the model would have worked *in situ*, without knowledge of the outcome.
  *   *Status:* Non-negotiable. Without this, she is a numerologist, not a scientist.

  **8. Mechanism vs. Correlation (Prejudice)**
  Ruth claims correlation is enough. Her critics will demand mechanism.
  *   *The Prejudice:* Many historians believe that without human agency and narrative causation, there is no history. This is largely aesthetic.
  *   *The Reality:* However, without a causal mechanism, she cannot distinguish a real cycle from a spurious correlation (e.g., the number of storks nesting correlates with birth rates, but storks do not deliver babies).
  *   *Requirement:* She doesn't need a full narrative, but she needs a plausible transmission belt (e.g., how exactly does elite overproduction lead to violence?).

  **9. Aggregate vs. Individual (Prejudice)**
  *   *The Prejudice:* "You can't reduce human suffering to a graph."
  *   *The Reality:* Quantitative history *must* operate on aggregates. She must refuse to collapse this distinction. If she tries to predict what a specific King will do, she fails. She must predict the *probability* of instability in the system.
  *   *Requirement:* She must hold the line that her theory explains the conditions for the fire, not who strikes the match.

  ### IV. The Incompatible Pair (The Ambush Scene)

  Here are the two requirements that cannot be satisfied simultaneously. This is the logical trap your antagonist should spring during the Q&A.

  **Requirement A: Chronometric Precision**
  To claim a "schedule" (e.g., crises arrive every 200–300 years), the timing of the historical crises must be dated with high precision (±5 to 10 years). If the date of the "collapse" is vague, the "schedule" is an illusion.

  **Requirement B: Statistical Power (Sample Size)**
  To claim statistical significance and rule out coincidence, the model needs a large number of independent cases (N > 30 is standard for robust regression; N < 10 is anecdotal).

  **The Conflict:**
  In agrarian history, you cannot have both.
  *   There are only a handful of major agrarian empires that are well-documented enough to satisfy **Requirement A** (Precision). This leaves you with an N of perhaps 5 or 6. This is statistically insignificant.
  *   To satisfy **Requirement B** (Sample Size), Ruth must include lesser-known states or earlier periods. These cases have dating uncertainties of ±50 years or more. This introduces enough noise to destroy **Requirement A** (Precision).

  **The Ambush:**
  When Ruth presents her precise schedule, the antagonist asks for her sample size. If she admits it is small, she is accused of anecdotalism. If she claims a large sample, the antagonist asks for the dating precision on the obscure cases. When she admits the dates are fuzzy, the antagonist demonstrates that the fuzziness is wider than the cycle itself. The 'rhythm' disappears into the error bars.

  ### V. External Constraints

  **1. Statistics on Small N**
  She cannot claim 'p-values' or 'confidence intervals' in the standard sense with fewer than 10 data points. She must use Bayesian methods or acknowledge the uncertainty explicitly. If she uses standard frequentist statistics on five empires, she is mathematically illiterate.

  **2. Demography**
  She infers population pressure from wage data or grain prices. Demographers will object that wages are influenced by institutions (guilds, serfdom), not just population. She must prove her proxies actually measure what she says they measure.

  **3. Archaeology**
  She must acknowledge that 'collapse' is often a gradual process, not an event. If her model predicts a year, but archaeology shows a century of decline, her definition of the target variable is wrong.

  ### VI. Classification of Objections

  *   **Non-negotiable:** Statistical independence, dating resolution vs. cycle length, overfitting (degrees of freedom), out-of-sample prediction.
  *   **Prejudices:** The demand for narrative causation ('why'), the moral objection to quantifying suffering, the insistence on the uniqueness of every historical moment.

  Verdict: The scarcity of independent cases.
