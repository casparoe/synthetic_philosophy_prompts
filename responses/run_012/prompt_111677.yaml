          *   *Idea B:* Mechanism vs. Pure Prediction. She claims "I don't care why." But to distinguish a real cycle from a spurious correlation, you usually need a causal mechanism. If she refuses mechanism, she can't defend against coincidence. If she accepts mechanism, she opens herself to historical critique (agency).
          *   *Selection:* The Dating vs. N problem is more technical and devastating in a Q&A setting. The Mechanism vs. Prediction is more philosophical. Let's go with *Precision of Prediction vs. Robustness of Sample*. To prove it's a "schedule," you need precise dates. To prove it's "statistical," you need many cases. You can't have both in pre-modern history.

  4.  **Refining the Content (British English & Tone):**
      *   Use "programme," "rigour," "centre," "defence," etc.
