          *   *Overfitting:* If you have enough variables, you can fit any curve. She needs to limit degrees of freedom.

      *   *Category 3: Conceptual Distinctions*
          *   *Prediction vs. Retrodiction:* Fitting the past is easy; predicting the future is hard. She claims prediction.
          *   *Mechanism vs. Correlation:* She says she doesn't care "why." But without a mechanism, it's just numerology.
