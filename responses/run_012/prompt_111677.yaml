          *   Need "Near Misses" or "False Alarms." A time the variables spiked but no collapse happened. This is crucial for falsifiability.
          *   Need a "Holdout" case. A society not used to build the model, predicted successfully.
          *   *Fair Test:* Where the "naive story" (great man theory, specific war, weather event) says stability, but the math says collapse (or vice versa).

      *   *Category 2: Methodological Rigour (Statistics & Data)*
