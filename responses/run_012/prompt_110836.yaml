answer: |-
  **Brainstorming Candidate Positions**

  **Transcendent Realism:** Planethood is a mind-independent Form; the IAU failed to track the true essence, making the vote a metaphysical error.
  **Immanent Realism:** Universals exist in things; the IAU misidentified which inherent properties constitute the universal "planet."
  **Trope Theory:** Each body's roundness is a particular; the IAU arbitrarily grouped distinct tropes into a resemblance class.
  **Resemblance Nominalism (Price):** Objects resemble each other objectively; the IAU privileged dynamical resemblance over structural similarity.
  **Predicate Nominalism:** "Planet" is merely a word; the IAU successfully legislated a linguistic convention, making dissenters factually wrong.
  **Cluster-Kind View (Boyd):** Kinds are homeostatic property clusters; the IAU severed the causal link between formation history and current status.
  **Promiscuous Realism (Dupre):** Many valid classifications exist; the IAU illegitimately enforced a monopoly on one legitimate carving of nature.

  Each position predicts a different status for the dissenters: for the Realist, they are martyrs for truth; for the Nominalist, they are confused about language; for the Pluralist, they are defenders of legitimate alternative taxonomies. The episode tests whether classification tracks nature or utility.

  ***

  **Case Analysis: The Metaphysics of Planethood**

  The 2006 demotion of Pluto is not merely a sociological skirmish but a stress test for the problem of universals. When the International Astronomical Union (IAU) voted to define a planet via orbital dominance rather than intrinsic shape, they inadvertently staged a metaphysical experiment. To understand what occurred, we must run the episode through the principal ontological positions.

  For the **Transcendent Realist**, the IAU committed a category error. If "Planet" refers to a Form existing independently of human convention, a vote cannot alter membership. The dissenters who claimed a committee cannot vote a category of nature into existence are correct; the IAU merely failed to perceive the Form. **Immanent Realism** softens this slightly: universals exist in things. Here, the IAU selected one universal complex (roundness plus orbital clearance) over another (roundness alone). The dissenters argue the universal "planet" is inherent in the body's hydrostatic equilibrium, not its neighborhood. The vote was a misreporting of facts present in the instances.

  **Trope Theory** treats each body's roundness as a particular property. "Planet" names a class of these tropes. The IAU dictated which tropes qualify for the class. The dissenters' complaint is that the IAU excluded tropes (Pluto's roundness) that naturally resemble the class prototypes (Earth's roundness) based on an extrinsic rule. **Resemblance Nominalism**, associated with H. H. Price, holds that objects resemble each other objectively. The IAU privileged dynamical resemblance (clearing an orbit) over structural resemblance (being round). The dispute is about which resemblance relation is natural.

  **Predicate Nominalism** offers the steepest contrast. If "planet" is just a label, the IAU succeeded. They stipulated a definition for a term. The dissenters are wrong to claim a fact of the matter exists; there is only utility. **Cluster-Kind Views**, such as Richard Boyd's homeostatic property clusters, suggest kinds are held together by causal mechanisms. The IAU disrupted the cluster. Dissenters argue the homeostasis lies in formation (accretion leading to roundness), not current orbital dynamics. Finally, **Promiscuous Realism**, championed by John Dupre, argues nature admits multiple valid cuttings. The IAU enforced a monopoly. The dissenters are right to demand pluralism: dwarf planets can be planets in one context and not in another.

  Two less obvious readings deepen the analysis. First, consider the thesis from the philosophy of biology that species are individuals—spatiotemporally located historical entities—rather than kinds. If "planet" behaves like a species, it denotes a specific historical lineage segment rather than a class defined by properties. The Ceres precedent supports this: Ceres did not change, but our understanding of its historical context did. However, planets do not reproduce, weakening the individuality thesis. If planets were individuals, the definition would be genealogical, not structural or dynamical. The IAU's mix of criteria suggests "planet" is not a strict individual, but the historical shift from Ceres to Pluto hints that planethood is partly a status within a specific historical narrative of discovery, not just a static property.

  Second, consider **Quantifier Variance**, associated with Eli Hirsch. Is the dispute substantive, or do parties mean different things by "planet"? One party quantifies over "round bodies orbiting the Sun"; the other over "dominant bodies." Both claims could be true in their respective languages. However, the stakes—textbook conventions, funding, public sentiment—suggest it is not merely verbal. It is a disagreement about which carving cuts nature at the joints for *science*. If it were purely verbal, the IAU could have adopted the rival resolution making dwarf planets a subcategory. The defeat of that resolution suggests a fight over ontology, not just semantics.

  Turning the traffic the other direction, the episode fits some positions badly. Strict Realism struggles with the location-dependence of the definition. The prompt notes that an identical body further from the Sun could fail the "cleared neighbourhood" criterion. If planethood is a real universal inherent in the object, how can it vanish based on location? This supports the Nominalist sense that the move from Ceres to Pluto shows a change in conventions. However, Realism fits the intensity of the dissent better; scientists do not riot over dictionary definitions. The record supports neither side exclusively. It illustrates that both readings can accommodate the facts: the Realist sees a missed truth; the Nominalist sees a useful convention. The episode cannot adjudicate between them because the science itself is underdetermined; the data (mass, orbit, shape) is fixed, but the classification is not.

  This case reveals features of universals that usual examples like colours or chemical elements do not. First, the operative criterion is **relational** rather than intrinsic. "Clearing the neighbourhood" is not a property of the body alone but of the body-in-context. This challenges Immanent Realism, which typically locates universals in the substance. Second, the definition is **purpose-relative**. The IAU restricted the definition to our Solar System and kept a separate, mass-based definition for exoplanets. This suggests the kind is instrumental, tailored to specific investigative contexts. Third, a body can enter and leave the category without intrinsic change. If Pluto were moved to Earth's orbit, it might clear it; if Earth were moved to the Kuiper Belt, it might not. Kind membership becomes transient.

  Does this amount to an argument for pluralism? It looks like **Promiscuous Realism** vindicated: the existence of a separate working definition for exoplanets admits multiple valid carvings. However, the IAU's insistence on a single definition for the Solar System looks like pluralism's failure of nerve—an attempt to legislate unity where nature offers variety. The dispute is partly about who has standing to decide, a social fact intruding on a metaphysical one. The vote was carried by a small fraction of the Union's membership. This highlights that kind-making is often an institutional act, not just a discovery.

  Here, the problem of universals is simply silent. Metaphysical theory has nothing useful to say about why institutional authority, textbook conventions, and public sentiment figure in what presents itself as a question about the world. The machinery of universals explains what a kind *is*, not who gets to *name* it. The intensity of the controversy stems from the collision of metaphysical claims with institutional power, a zone traditional metaphysics ignores.

  **Verdict**

  The episode best supports **Promiscuous Realism** tempered by **Pragmatic Conventionalism**. The existence of divergent definitions for Solar System bodies versus exoplanets demonstrates that "planet" is not a single natural kind tracking a unique universal, but a cluster concept adaptable to scientific purpose. The relational criterion and the Ceres precedent confirm that planethood is partly a status conferred by context and convention, not just intrinsic essence.

  For the rival **Immanent Realist** reading to win, it would have to be true that orbital dominance is causally essential to the *nature* of the body in a way that roundness is not. The Realist would need to show that "clearing the neighbourhood" reveals a hidden structural universal that binds Mercury, Earth, and Jupiter together exclusively, despite the location-dependence anomaly. Given the provided fact that Mercury is not in hydrostatic equilibrium yet is counted, while round bodies are not, the intrinsic property view is untenable. The world must be such that relational dynamics constitute the essence of planetary nature more than physical constitution. The evidence suggests otherwise: the body remains round regardless of its orbit. Thus, the realist claim that the IAU discovered a fact of nature fails; they legislated a utility. Pluto's demotion was not a correction of error, but a shift in conceptual scheme.
