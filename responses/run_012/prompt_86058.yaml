      *   *Greedy Reductionism:* This occurs when one insists that the *only* valid explanation is the lower-level one, thereby dissolving the higher-level pattern rather than grounding it.
      *   *Resolution of Tension:* Anti-skyhook demands *grounding* (causal closure). Anti-greedy demands *preservation* (explanatory autonomy). You can have a grounded explanation that stays at the higher level (a crane). You fail if you posit ungrounded order (skyhook) OR if you dissolve the order by jumping levels (greedy).
