      *   *Refining the Tension:* The user asks: "If nothing enters the world except by being built up... it looks as though any higher-level explanation must eventually be cashed out downward."
      *   *My Answer:* "Cashed out" does not mean "eliminated." It means "supervenes on." A crane explanation *acknowledges* the cashing out is possible in principle but insists the *work* is done at the higher level. Greedy reductionism says the work is *only* done at the lower level. Skyhook says the work is done at the higher level *without* the lower level support.

