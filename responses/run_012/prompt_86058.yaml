      *Wait, one nuance on the Colleague's Test:* "Skyhook just in case it could not, even in principle, be given a lower-level mechanism." This defines a skyhook as a *dualist* entity. But in scientific practice, we call something a skyhook when we *haven't* found the mechanism yet, not necessarily when it's impossible. I need to be careful here. The distinction is usually about the *explanatory move*, not the metaphysical impossibility. I will argue the colleague confuses the *error* with the *ontological status*.

