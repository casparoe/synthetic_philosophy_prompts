          *   Ontological reading: Does the entity *actually* have a causal history grounded in lower levels? Skyhooks are magic; cranes are mechanical.
          *   Explanatory reading: Does the explanation *rely* on ungrounded assumptions? A skyhook explanation assumes order without accounting for its origin. A crane explanation shows how order emerges from chaos via intermediate steps.
          *   Tension: An explanation can be ontologically safe (it *is* a crane) but explanatorily premature (treated as a skyhook because we don't know *how* it works yet). Or, an explanation can be ontologically dubious (posits a skyhook) but heuristically useful until a crane is found.
      *   *Greedy Reductionism:*
          *   Claiming $X$ is *nothing but* $Y$ without showing the bridge principles or mechanisms.
          *   Ignoring emergent properties or multiple realizability.
          *   Skipping levels of organization.
      *   *The Core Tension:* Anti-skyhook says "Show me the bottom." Anti-greedy says "Don't just jump to the bottom."
      *   *Resolution:* The anti-skyhook demand is about *possibility* and *grounding* (there *must* be a bottom-up story). The anti-greedy warning is about *practice* and *autonomy* (the bottom-up story might be useless or inaccessible, and the higher-level regularities are real patterns).
