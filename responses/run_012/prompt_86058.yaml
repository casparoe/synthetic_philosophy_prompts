answer: |-
  ### I. The Metaphysics of the Distinction

  To resolve the tension you identify, we must first disentangle the ontological commitment from the explanatory strategy. The confusion arises because the crane/skyhook distinction is often presented as a taxonomy of *things*, when it is more rigorously understood as a taxonomy of *explanatory warrants*.

  **1. What the Distinction Is Between**
  The crane/skyhook distinction is primarily a claim about **explanatory grounding**, which entails an ontological commitment but is not identical to it.

  *   **A Skyhook** is an explanatory posit that treats a higher-level regularity as self-justifying or fundamentally imposed, without acknowledging a debt to lower-level processes. It asserts order without accounting for the cost of that order. Ontologically, it implies that the higher-level feature floats free of the causal closure of the physical base. Explanatorily, it stops the regress of "how is this possible?" by fiat.
  *   **A Crane** is an explanatory posit that treats a higher-level regularity as a stable structure built from below. It acknowledges that the order is derivative but insists that the structure itself does distinct causal work. Ontologically, it commits to the feature being fully constituted by lower-level processes. Explanatorily, it allows us to stop at the higher level *because* we understand it as a stable platform built from below, not because we deny the bottom exists.

  **2. The Resolution of Your Tension**
  You ask: *If everything must be built from below (anti-skyhook), why is it bad to demand the bottom immediately (anti-greedy)?*

  The resolution lies in the difference between **constitution** and **explanation**.
  *   The **anti-skyhook** constraint is metaphysical: It demands that you admit the higher-level pattern is *constituted* by lower-level interactions. You cannot claim the pattern exists independently of the physics.
  *   The **anti-greedy** constraint is methodological: It demands that you admit the higher-level pattern has *explanatory autonomy*. You cannot claim the lower-level description *replaces* the higher-level one.

  A legitimate crane explanation satisfies the anti-skyhook constraint by acknowledging the lower-level grounding, but it violates the greedy reductionist impulse by refusing to dissolve the higher-level pattern into that grounding. The "cash out" you worry about is a promise of *possibility*, not a requirement of *practice*. We know the crane rests on the ground, but we climb the crane to do the work. To demand we stand on the ground to do the work is greedy; to claim the crane floats in the air is skyhookish.

  ### II. Locating Greedy Reductionism

  Greedy reductionism is not the mirror image of the skyhook error; it is an orthogonal failure of **explanatory granularity**.

  *   **Skyhook Error:** Posits a level of organization that is *too independent*. It severs the link to the base. (Failure of Grounding).
  *   **Greedy Reductionism:** Posits a level of organization that is *too eliminative*. It dissolves the link to the function. (Failure of Autonomy).

  **Assessment of Your Colleague's Test**
  Your colleague proposes:
  1.  *Skyhook:* Could not, even in principle, be given a lower-level mechanism.
  2.  *Greedy Reductionism:* Claims to have supplied such a mechanism without actually specifying one.

  **Verdict:** This test is **fundamentally flawed** regarding skyhooks and **incomplete** regarding greedy reductionism.

  *   **Critique of the Skyhook Criterion:** Defining a skyhook by the *impossibility* of a lower-level mechanism turns it into a claim about dualism or magic. In scientific practice, we label an explanation "skyhookish" not because a mechanism is impossible, but because the explainer *ignores* the need for one. A vitalist explanation of life is a skyhook not because life *couldn't* be physical, but because the explanation posits a "vital force" that bypasses physical chemistry. The colleague's test makes skyhooks a matter of metaphysical impossibility, whereas they are actually a matter of explanatory negligence.
  *   **Critique of the Greedy Reductionism Criterion:** Merely failing to specify a mechanism is often just "incomplete science," not greedy reductionism. Greedy reductionism is the *claim* that the specification is unnecessary because the higher-level description is *nothing but* the lower-level one. It is a normative claim about ontology (the higher level doesn't really exist), not just a pragmatic omission.

  **Corrected Location:**
  Greedy reductionism is a failure to recognize **multiple realizability** or **organizational invariance**. It assumes that because $X$ is made of $Y$, explaining $Y$ exhausts the explanation of $X$. A skyhook assumes $X$ explains itself without $Y$. A crane explains $X$ by showing how $Y$ organizes into $X$, then uses $X$ to explain $Z$.

  ### III. Analysis of Cases

  Here I apply the committed reading: A Skyhook denies the debt to the lower level; Greedy Reductionism denies the credit due to the higher level; A Legitimate Crane acknowledges the debt but retains the credit.

  **(a) A persistent social institution is explained by its being functional for the group, with no account of how individual-level processes could generate or maintain it.**
  *   **Verdict:** **Skyhook.**
  *   **Driving Feature:** This is "function without mechanism." It posits a group-level order (the institution) maintained by its utility, but explicitly severs the link to the individual-level actions that must constitute it. It treats the group as an agent with needs independent of the individuals. It fails the anti-skyhook constraint by implying the order sustains itself without a generative base.

  **(b) A cognitive capacity is explained by observing that it is nothing but neurons firing.**
  *   **Verdict:** **Greedy Reductionism.**
  *   **Driving Feature:** This is "constitution treated as elimination." While it is true that the capacity is constituted by neurons, stating it is "nothing but" neurons denies the organizational level where the *capacity* (e.g., memory, recognition) is defined. It satisfies the grounding constraint but violates the autonomy constraint. It offers a lower-level truth that fails to capture the higher-level pattern.

  **(c) A population's traits are said to have changed because the new trait was needed for survival.**
  *   **Verdict:** **Skyhook.**
  *   **Driving Feature:** This is teleology without a selector. Nature does not "need." To say a trait changed *because* it was needed posits a forward-looking causal power. Unless this is shorthand for a specific selection mechanism (differential reproduction), it posits order (adaptation) without a mindless process to pay for it. It hangs the adaptation on a hook of "necessity" rather than building it on a crane of "selection."

  **(d) The clustering of prices in a market is explained by arbitrage, stated entirely at the level of prices and traders.**
  *   **Verdict:** **Legitimate Higher-Level Explanation (Crane).**
  *   **Driving Feature:** This explanation stays at the macro-level (prices/traders) but implies a mechanism (arbitrage) that is grounded in individual actions (traders seeking profit). It does not claim prices float free of traders (not a skyhook), nor does it insist we must model every neuron of every trader to understand the price cluster (not greedy). It identifies a stable, higher-level dynamic that is built from below but operates according to its own regularities.

  **(e) A trait is attributed to a gene for it, where the same sentence might be a crane or a case of greedy reductionism depending on whether the intervening developmental and behavioral machinery is specified.**
  *   **Verdict:** **Context-Dependent (Ambiguous).**
  *   **Driving Feature:** The phrase "gene for X" is a crane if it serves as a placeholder for a known causal chain (Gene $\to$ Protein $\to$ Development $\to$ Trait). It becomes greedy reductionism if it is used to imply that the gene *alone* determines the trait, bypassing the developmental context and environmental interaction. The distinction turns on whether the higher-level complexity (development) is acknowledged as essential (Crane) or dismissed as noise (Greedy).

  ### IV. A Usable Diagnostic for Students

  To distinguish these in a live case, students should not ask "Is this true?" but "What work is this explanation doing, and what is it ignoring?" Provide them with this two-step procedure.

  **Step 1: The Grounding Test (Detecting Skyhooks)**
  Ask: *Does this explanation treat the higher-level pattern as if it generates its own stability?*
  *   **Look for:** Teleological language ("in order to," "needs"), agentification of groups/systems, or causal claims that skip the mechanism of transmission.
  *   **Diagnosis:** If the explanation implies the pattern exists *without* a lower-level engine driving it, it is a **Skyhook**.
  *   **Correction:** Demand the "mindless process." How does the order propagate without a planner?

  **Step 2: The Autonomy Test (Detecting Greedy Reductionism)**
  Ask: *Does this explanation treat the lower-level description as if it makes the higher-level description redundant?*
  *   **Look for:** "Nothing but" claims, dismissal of functional/organizational terms as "folk" talk, or the insistence that a complete lower-level map would explain everything the higher-level theory explains.
  *   **Diagnosis:** If the explanation claims that identifying the parts *eliminates* the need to explain the organization of the parts, it is **Greedy Reductionism**.
  *   **Correction:** Demand the "organizational principle." How do these parts coordinate to produce the pattern that the parts alone do not show?

  **Summary Rule for Students:**
  *   **Skyhook:** Magic (Order from nowhere).
  *   **Greedy Reductionism:** Dust (Nothing but parts).
  *   **Crane:** Machinery (Order from parts, doing work at the level of order).

  ### V. Critique of the Framing

  I must note one instability in your framing that you should expose to your seminar. You present the distinction as if "Crane" and "Skyhook" are stable categories. In the history of science, **today's crane is often yesterday's skyhook.**

  When Darwin proposed natural selection, critics accused him of using a skyhook (how can order arise without a designer?). He provided a crane. However, in many biological explanations today, we use "functional" language that is technically skyhookish (e.g., "the heart beats to pump blood") but is tolerated as shorthand for the evolutionary crane.

  Therefore, the distinction is not merely between *good* and *bad* explanations, but between **provisional** and **completed** explanatory accounts. A skyhook is often a placeholder for a crane we haven't built yet. Greedy reductionism is a refusal to build the crane because we think we already own the ground.

  If your seminar treats the crane/skyhook distinction as a rigid binary, you risk teaching students to dismiss useful heuristic models (which may look skyhookish) rather than pushing them to uncover the mechanisms. The diagnostic above works for *rigorous* analysis, but in discovery, we often climb skyhooks to build cranes. Make sure your students understand that calling something a skyhook is a call to work, not necessarily a verdict of falsehood.
