answer: |-
  **FOR IMMEDIATE RELEASE**

  **THE MUSEUM OF HUMAN UNION ANNOUNCES DEACCESSIONING OF COUNTERFEIT WORKS**

  **GENEVA, October 14, 2024** — The Museum of Human Union today confirmed the full implementation of its Binding Acquisitions and Curatorial Policy, grounded exclusively in the aesthetic theory articulated by Leo Tolstoy in *What Is Art?* Henceforth, the institution recognizes only those objects that function as instruments of emotional infection. Art is defined not by beauty or technical mastery, but by the capacity of one person to deliberately transmit a feeling to others, thereby uniting them in a shared experience. Works that fail to transmit feeling sincerely, clearly, and accessibly to the ordinary person are classified as counterfeit and will be removed from public trust.

  To comply with this standard, the Museum has reviewed its entire holdings. The resulting exhibition, *Exhibition of Non-Transmissive Objects*, opens November 1 and consists of every work deemed incapable of fostering human brotherhood. This includes previously celebrated masterpieces that require specialized education to comprehend, as well as works produced for the exclusive pleasure of the upper classes. While these objects possess historical notoriety, they lack the primary mark of genuine art: the ability to infect the viewer with the artist's feeling without obstruction. Consequently, they will be sold or destroyed to make way for works aligned with the religious consciousness of our time.

  The determination of infectiousness is not made by critics, but by the Museum's Advisory Panel of Ordinary Visitors. Composed of fifty individuals selected for their lack of artistic training, the Panel views each work in isolation. If the majority reports no immediate felt union with the maker, the work is deaccessioned. Their verdict is final. Regarding the Panel's recent decision to remove the museum's entire collection of late-century abstraction, Panel Chair Elena Rostova stated, "We looked at the colors and shapes, but we did not feel what the painter felt. We felt only confusion. Therefore, it is not art."

  Some stakeholders have expressed concern regarding the financial implications of this policy. Trustee Silas Vane noted during the ratification meeting, "We are liquidating assets that secure our endowment based on a metaphysical metric that ignores market value." The Museum administration treats this concern as administrative rather than ethical. Under the new policy, market value is evidence of exclusivity, and exclusivity is evidence of counterfeit status. The loss of capital is accepted as the necessary cost of moral integrity.

  The Museum invites donors to contribute only those works that satisfy the tests of sincerity and universal accessibility. Gifts intended to confer status upon the giver will be refused.

  **About the Museum of Human Union**
  The Museum of Human Union is dedicated to the proposition that art exists to replace violence and isolation with shared feeling. Founded on the principle that true art must be understandable to all, the Museum serves not the cultivated elite, but the whole of humanity. We rank works highest that unite people most universally in the spirit of brotherhood. For more information on our deaccessioning schedule, visit our website.

