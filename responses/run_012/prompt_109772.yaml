  # DIAGNOSTIC TREE: THE APOLOGY OF STATE R

  **Instructions:** Begin at Node 1. Answer each question based on the stipulated case and your own judgment. Follow the arrow corresponding to your answer. If you reach a leaf (boxed text), record the position and stop. If you encounter a note regarding unoccupied logical space, read it before proceeding.

  **Case Stipulation:** State R (present republic) succeeded a Monarchy (overthrown 90 years ago). The Monarchy committed dispossession and massacre 100–120 years ago. R has no institutional continuity beyond the civil service. Victims' descendants remain in R, are poorer, and demand an apology. Opponents cite ancestral insult. Parliament has passed three "regret" resolutions (no "apology"), funded a museum and scholarships. Disadvantages have both historical and current causes.

  ---

  ### NODE 1: Seriality and Status
  **Question:** Regarding the three prior parliamentary resolutions expressing regret: Do these count as failed attempts at an apology, or were they a distinct kind of act (e.g., commemorative statement) that renders a fourth attempt a fresh act rather than a repetition?
  *   **A.** They were failed apologies; a fourth is merely serial repetition. → Go to Node 13 (Refusal).
  *   **B.** They were distinct acts; a fourth resolution would be a fresh performative act. → Go to Node 2.
  *   **C.** They were neither; they belong to a category of "regret" that is neither apology nor non-apology. → Go to Node 2. *(Note: This path treats the prior acts as logically inert regarding the current question.)*

  ### NODE 2: Level of Description
  **Question:** If an apology is issued, is it coherent to apologize for the *type* of act (e.g., "genocide," "dispossession") abstracted from specific tokens, or must the apology refer to specific tokens (e.g., "the massacre at Valley X, 1924") to be valid?
  *   **A.** Only tokens can be apologized for; types are abstractions without moral agency. → Go to Node 3.
  *   **B.** Types can be apologized for; the pattern constitutes the wrong. → Go to Node 3.
  *   **C.** The distinction is irrelevant to the validity of the act. → Go to Node 3.

  ### NODE 3: Agent Metaphysics (Owed)
  **Question:** Given that the Monarchy is gone and R is a republic with a different constitution: Can the present State R literally bear the responsibility of the Monarchy, or is "State Apology" shorthand for the aggregate apologies of living individuals?
  *   **A.** Only individuals bear responsibility; the State is a fiction. → **LEAF 1: INDIVIDUALISM**
  *   **B.** The State can bear responsibility as a corporate agent. → Go to Node 4.
      *(Note: If you chose A, you hold that state apology is either shorthand for facts about persons or a fiction.)*

  ### NODE 4: Addressee and Harm (Addressee)
  **Question:** The original victims are dead. Is the apology directed primarily at the dead (as moral patients), or must it be directed at living descendants to have a recipient?
  *   **A.** Primarily at the dead; descendants are secondary. → Go to Node 5.
  *   **B.** Primarily at living descendants; the dead cannot receive acts. → Go to Node 5.
  *   **C.** At the indefinite public; the specific recipient is the polity itself. → Go to Node 12.

  ### NODE 5: Counterfactual Wrinkle (Non-Identity)
  **Question:** Considering many present citizens (including some descendants) would not exist had the wrong not occurred: Does the fact of their existence negate the claim that they are harmed by the act that preconditioned their birth?
  *   **A.** Yes; existence negates the harm claim regarding pre-existence acts. → **LEAF 2: NON-IDENTITY**
  *   **B.** No; one can be harmed by acts that predate one's existence (e.g., via inheritance of disadvantage). → Go to Node 6.
      *(Note: If you chose A, you hold that the dead cannot be harmed and descendants cannot be wronged by acts predating their existence.)*

  ### NODE 6: Grounds of Responsibility (Owed)
  **Question:** On what basis does R owe an apology? Is it because R *is* the Monarchy (institutional continuity), or because R *holds* the proceeds of the Monarchy (benefit/complicity)?
  *   **A.** Primarily because R is the same agent (institutional continuity). → **LEAF 3: CONTINUITY**
  *   **B.** Primarily because R holds what the wrong produced (benefit/complicity). → **LEAF 4: BENEFIT**
  *   **C.** Both/Other; the ground is settled, proceed to content. → Go to Node 7.
      *(Note on Unoccupied Space: Combinations of A/B with Node 8 leaves are logically possible but unoccupied here to force a priority. A "Continuity-Materialist" position is coherent but must prioritize one commitment for this diagnostic.)*

  ### NODE 7: Persistence of Wrong (Persistence)
  **Question:** The case states disadvantages have current causes (law, policing). Is the apology for the *historical* wrong, or for the *ongoing* structural wrong that originated historically?
  *   **A.** For the historical wrong; the ongoing effects are a separate matter of policy. → Go to Node 8.
  *   **B.** For the ongoing wrong; one cannot apologize for a past act while continuing its effects. → Go to Node 8.
  *   **C.** The distinction is moot; the apology covers the temporal span. → Go to Node 8.

  ### NODE 8: Content and Aptness (Apt)
  **Question:** If Parliament issues words of apology but transfers no resources, is this an *empty* apology, or is the speech act itself the repair?
  *   **A.** Words without resource transfer are not apologies at all. → **LEAF 5: MATERIALISM**
  *   **B.** The speech act constitutes recognition; material repair is separate. → **LEAF 6: RECOGNITION**
  *   **C.** Both are required; proceed to conditions of success. → Go to Node 9.
      *(Note: Leaf 5 holds words unaccompanied by transfer are not apologies. Leaf 6 holds material repair without recognition is not repair.)*

  ### NODE 9: Standing and Dissent (Standing)
  **Question:** A vocal minority of R's citizens oppose the apology. Can an official apologize for citizens who reject the apology, or does their dissent void the standing of the act?
  *   **A.** Dissent voids the standing; the official cannot bind the dissenters. → Go to Node 10.
  *   **B.** Official standing is independent of citizen consent. → Go to Node 10.
  *   **C.** Standing is partial; the apology applies only to the consenting polity. → Go to Node 10.

  ### NODE 10: Uptake and Acceptance (Uptake)
  **Question:** If the descendants reject the apology as insufficient: Is the apology complete as a one-sided act, or does it require acceptance to be felicitous?
  *   **A.** It requires acceptance; rejection renders it incomplete. → Go to Node 13.
  *   **B.** It is complete as a one-sided act; uptake is not required for validity. → Go to Node 11.
  *   **C.** Uptake is required but can be deferred indefinitely. → Go to Node 11.

  ### NODE 11: Temporality and Completion (Persistence/Process)
  **Question:** Is the apology a discrete act with a completion point (once spoken/passed), or is it a standing practice with no completion point?
  *   **A.** It is a standing practice; there is no completion point. → **LEAF 7: PROCESS**
  *   **B.** It is a discrete act; it can be completed. → Go to Node 12.
      *(Note: Leaf 7 holds apology is a standing practice rather than a discrete act.)*

  ### NODE 12: Beneficiary and Purpose (Efficacious)
  **Question:** Who is the primary beneficiary of the apology? Is it the victims (repair), or the apologizer (integrity/community type)?
  *   **A.** The apologizer; the successor community needs to be a certain kind of community. → **LEAF 8: SELF-CONSTITUTION**
  *   **B.** The victims; the purpose is repair/recognition. → Go to Node 13.
  *   **C.** Both equally. → Go to Node 13.
      *(Note: Leaf 8 holds the primary beneficiary is the apologizer, whether because integrity demands it or because the successor community needs to be a certain kind of community.)*

  ### NODE 13: Refusal and Deferral (Uptake/Seriality)
  **Question:** Given the history of failed resolutions and the demand for forgiveness: Should the apology be refused or deferred because a successful apology would be too cheap (releasing the wrongdoer, conscripting forgiveness)?
  *   **A.** Yes; it should be refused/deferred to avoid cheapening the wrong. → **LEAF 9: REFUSAL**
  *   **B.** No; the risk of cheapening does not negate the obligation. → **TERMINAL ERROR** (Return to Node 1; your answers imply an obligation but reject all forms of satisfaction. This combination is unattractive: it asserts a debt that cannot be paid without moral hazard.)
      *(Note: Leaf 9 holds apology should be refused or deferred because a successful apology would be too cheap, releasing the wrongdoer and conscripting the victim's forgiveness.)*

  ---

  ### LEAF SUMMARY

  1.  **INDIVIDUALISM:** Only individuals can bear responsibility or apologize; state apology is shorthand or fiction.
  2.  **NON-IDENTITY:** The dead cannot be harmed and descendants cannot be wronged by acts predating their existence; nothing is owed.
  3.  **CONTINUITY:** Responsibility travels with institutional continuity; R is the same agent as the monarchy.
  4.  **BENEFIT:** Responsibility travels with benefit or complicity; it falls on those who hold what the wrong produced.
  5.  **MATERIALISM:** Words unaccompanied by transfer of resources are not apologies at all.
  6.  **RECOGNITION:** The point of apology is recognition; material repair without recognition is not repair.
  7.  **PROCESS:** Apology is a standing practice with no completion point rather than a discrete act.
  8.  **SELF-CONSTITUTION:** The primary beneficiary is the apologizer (integrity/community type).
  9.  **REFUSAL:** Apology should be refused/deferred because success would be too cheap (releases wrongdoer/conscripts forgiveness).

  ---

  ### NOTE ON UNOCCUPIED LOGICAL SPACE
  *   **Continuity/Benefit + Materialism/Recognition:** The tree forces a choice between *Grounds* (Node 6) and *Content* (Node 8) for the sake of diagnosis. In reality, a "Continuity-Materialist" position is coherent. If you reached Leaf 3 or 4 but believe resources are also required, your primary commitment is to the *source* of obligation, not the *form* of satisfaction.
  *   **Terminal Error (Node 13):** This combination (Obligation exists + All forms rejected) is flagged as unattractive. It posits a debt that is simultaneously real and impossible to discharge without moral injury.

  ---

  ### CLOSING NOTE: STRATEGIC ANSWERING

  Readers often answer **Node 3 (Agent)** and **Node 6 (Grounds)** strategically. A reader committed to **Leaf 2 (Non-Identity)** may answer "Yes" to Node 3 (State can act) to avoid an early exit, only to answer "Yes" to Node 5 (Counterfactual) to reach their desired leaf. This reveals that the *metaphysics of the recipient* is often a more robust barrier for this position than the *metaphysics of the agent*. Similarly, readers seeking **Leaf 9 (Refusal)** may answer Node 1 (Seriality) to frame the act as "repetition" rather than "fresh," ensuring they reach the Refusal node. This instrument does not prevent strategic navigation; rather, it exposes which philosophical hurdles a reader is willing to clear to reach their normative conclusion. If a reader finds themselves at the "Terminal Error," it reveals they have settled on a leaf (Refusal) while maintaining premises (Obligation) that logically preclude it.
