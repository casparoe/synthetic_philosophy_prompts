prompt: |-
  I work in the policy unit of a civil liberties charity, and every week we have to sign off or oppose something — curfews, ID checks, workplace rules, benefit conditions — and the arguement always turns into a shouting match about freedom. I want a reusable screening proceedure my team can run in half an hour, before anything goes to the director, that actually uses the three ideas of liberty: negative liberty (no one interfering), positive liberty (being one's own master and having the real capacity to act), and republican liberty (not being dependent on anyone's goodwill, even if they don't actually interfere). Give me the questions in order, what counts as a sufficient answer to each, where the procedure stops with a clear yes or no, and where it has to hand the decision to a human because it's a value call rather than a fact. Keep it usable by people who haven't read the theory, don't let positive liberty collapse into just having resources — unfreedom and inability aren't the same thing — and be honest about where it will misfire. Then run it on three proposals: a night-time curfew in a high-crime neighbourhood, mandatory digital ID for social media accounts, and a workplace ban on managers dating their subordinates. I especially need it to handle the case where a policy reduces interference but increases domination, and the case where positive liberty seems to justify paternalism. One of the worked examples should come out in a way our campaigners won't like. British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Policy unit of a civil liberties charity.
      *   **Problem:** Weekly sign-off/oppose decisions turn into shouting matches about "freedom."
      *   **Goal:** A reusable screening procedure (max 30 mins) based on Berlin's/Constant's/Pettit's three concepts of liberty (Negative, Positive, Republican).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Clear stop points (Yes/No) vs. Human Value Calls.
          *   Accessible to non-theorists.
          *   Distinguish Positive Liberty from mere resource availability (unfreedom $\neq$ inability).
          *   Honesty about limitations/misfires.
          *   Handle specific conflicts: Interference vs. Domination, Positive Liberty vs. Paternalism.
          *   Run on three examples: Night-time curfew, Mandatory Digital ID for social media, Workplace ban on manager-subordinate dating.
          *   **Constraint:** One worked example must yield a result campaigners won't like (counter-intuitive).
          *   **Tone/Style:** British English.

  2.  **Deconstruct the Three Liberties:**
      *   *Negative Liberty:* Freedom *from* interference. (Is someone stopping me?)
      *   *Positive Liberty:* Freedom *to* be one's own master (autonomy/self-realisation). (Am I capable of acting on my own rational will? Is my agency compromised?) *Crucial distinction:* It's not just "can I afford it?" It's "is my capacity for choice intact?"
      *   *Republican Liberty:* Freedom as *non-domination*. (Am I subject to the arbitrary will of another? Even if they don't interfere, do they *have the power* to?)

  3.  **Drafting the Procedure (The "Liberty Screen"):**
      *   *Time limit:* 30 mins. Needs to be punchy.
      *   *Structure:* Sequential filtering.
      *   *Step 1: Negative Liberty (The Interference Check).* Direct coercion?
      *   *Step 2: Republican Liberty (The Domination Check).* Arbitrary power?
      *   *Step 3: Positive Liberty (The Agency Check).* Capacity for self-mastery?
      *   *Decision Logic:* If it fails Negative or Republican, it's usually a "No" (oppose). If it passes those but fails Positive, it's tricky (paternalism risk). If it passes all, it's a "Yes" (support/acquiesce).
      *   *The "Human Call":* Where trade-offs exist (e.g., reducing domination by increasing interference).

  4.  **Refining the Questions (Avoiding Theory Jargon):**
      *   Instead of "Negative Liberty," call it "The Interference Test."
      *   Instead of "Republican Liberty," call it "The Power Check."
      *   Instead of "Positive Liberty," call it "The Agency Test."
      *   *Constraint Check:* Ensure Positive Liberty doesn't just mean "do they have money?" It must mean "does this policy enhance or degrade their ability to govern themselves?"

  5.  **Addressing the Specific Conflicts:**
      *   *Interference vs. Domination:* A law might interfere (Negative hit) but remove a master (Republican gain). The procedure needs to flag this tension.
      *   *Positive Liberty vs. Paternalism:* Forcing someone to be "free" (e.g., seatbelts). The procedure needs to distinguish between restoring agency and imposing values.

  6.  **Developing the Worked Examples:**
      *   *Example 1: Night-time Curfew.*
          *   Negative: High interference (can't go out).
          *   Republican: Police have arbitrary power? Maybe.
          *   Positive: Does it make people safer/more capable? Maybe.
          *   *Likely Outcome:* Oppose (Classic civil liberties stance).
      *   *Example 2: Mandatory Digital ID for Social Media.*
          *   Negative: Interference (must ID to speak).
          *   Republican: State/Corp holds power over identity.
          *   Positive: Might reduce abuse (enhancing others' agency)?
          *   *Likely Outcome:* Oppose (Strong civil liberties stance).
      *   *Example 3: Workplace Ban on Manager-Subordinate Dating.*
          *   Negative: Interference (can't date).
          *   Republican: Reduces domination (power imbalance).
          *   Positive: Protects autonomy of the subordinate.
          *   *Likely Outcome:* **Support.** (This is the one campaigners might not like, as it restricts choice to protect liberty).

  7.  **Drafting the Content (Iterative refinement for British English & Tone):**
      *   Use "programme," "centre," "whilst."
      *   Tone: Professional, pragmatic, slightly weary of theory but respecting it.
      *   *Self-Correction on Positive Liberty:* I need to be very careful here. Berlin warned against Positive Liberty leading to authoritarianism. The test must ask: "Does this restore the *capacity* to choose, or does it dictate the *choice*?"
      *   *Self-Correction on Republican Liberty:* Focus on *arbitrary* power. If the power is checked by law, it's less dominating.

  8.  **Final Review against Constraints:**
      *   30 mins? Yes, 3 steps.
      *   Stop points? Yes.
      *   Human hand-off? Yes, the "Trade-off Tribunal."
      *   Misfires acknowledged? Yes, in the "Limitations" section.
      *   One unpopular result? Yes, the workplace dating ban (Support).
      *   British English? Yes.

  9.  **Writing the Response:** (Proceeding to generate output based on these thoughts). *Wait, one check on the "Positive Liberty" definition.* The prompt specifically says "don't let positive liberty collapse into just having resources — unfreedom and inability aren't the same thing." I need to make sure the question focuses on *internal capacity* or *structural barriers to autonomy*, not just poverty. It's about whether the policy treats them as agents or objects.

      *Revised Positive Liberty Question:* "Does this policy treat the individual as a responsible agent capable of self-direction, or does it bypass their will?" Actually, to fit the 'support' criteria, it should be: "Does this policy remove a barrier to self-mastery (e.g., addiction, coercion, ignorance) without imposing a specific outcome?"
      *Wait, for the Workplace Ban:* The argument is that the power imbalance *destroys* the subordinate's positive liberty (they can't truly consent). So the ban restores the condition for agency. That works.

      *Let's refine the "Unpopular Result".* Campaigners usually want to maximise Negative Liberty. A policy that restricts Negative Liberty to boost Republican or Positive Liberty will be unpopular. The Workplace Ban restricts Negative Liberty (freedom to associate) to boost Republican Liberty (freedom from boss's power). This fits perfectly.

  10. **Final Polish:** Check the "Limitations" section to ensure honesty about where the tool breaks. (e.g., when liberties conflict directly).

  *(Self-Correction during drafting)*: Make sure the "Stop/Go" logic is clear. If it fails Negative, does it automatically stop? Not necessarily, because a law against murder interferes but is good. So, Negative Liberty interference is a *flag*, not an automatic veto. The veto comes from *unjustified* interference.
  *Correction:* The procedure needs to assess *justification* through the lens of the other liberties.
  *Revised Flow:*
  1. Negative: Is there interference? If Yes -> Go to 2. If No -> Pass.
  2. Republican: Is there arbitrary power? If Yes -> High Risk. If No -> Go to 3.
  3. Positive: Does it enhance agency?
  *Actually, let's make it a scoring/traffic light system for speed.*
  No, the prompt asks for "where the procedure stops with a clear yes or no."
  Okay, let's try this logic:
  1. **Negative Test:** Does it directly coerce? If Yes, it requires justification from Test 2 or 3.
  2. **Republican Test:** Does it create arbitrary power? If Yes, it's a "No" unless it removes greater domination.
  3. **Positive Test:** Does it treat people as children? If Yes, it's a "No".

  *Let's stick to the prompt's request for a "screening procedure".*
  Step 1: Negative (Interference).
  Step 2: Republican (Domination).
  Step 3: Positive (Agency).
  Decision Matrix.

  Okay, ready to write.
answer: |-
  # The Liberty Screen: A 30-Minute Triage Procedure

  **Purpose:** To move policy discussions from shouting matches about "freedom" to structured analysis of *which* freedom is at stake.
  **Time:** 30 minutes max.
  **Users:** Policy Officers (no political theory training required).
  **Output:** A recommendation to Support, Oppose, or Escalate to Director (Value Call).

  ---

  ## Part 1: The Procedure

  ### Step 1: The Interference Test (Negative Liberty)
  *Concept: Is someone being stopped from doing what they want?*

  **Question:** Does this proposal directly prohibit, penalise, or physically prevent an individual from acting on their current desires?
  *   **Examples:** Curfews, bans, fines, physical barriers.
  *   **Not Examples:** Taxes (unless confiscatory), social pressure, lack of money.

  **Sufficient Answer:**
  *   **No Interference:** **PASS.** (Proceed to Step 2 to check for hidden power dynamics).
  *   **Yes, Interference:** **FLAG.** (This is a cost to liberty. It does not automatically kill the policy, but it requires justification from Step 2 or 3).

  ### Step 2: The Power Check (Republican Liberty)
  *Concept: Is anyone subject to the arbitrary will of another?*

  **Question:** Does this policy place an individual in a position where another agent (state, boss, landlord) has the *capacity* to interfere in their life without effective checks or recourse?
  *   **Key Distinction:** It doesn't matter if the power is *used*. It matters if the power *exists* unchecked.
  *   **Look for:** Discretionary powers, lack of appeal processes, dependency on goodwill, unregulated authority.

  **Sufficient Answer:**
  *   **Increases Domination:** **STOP → RECOMMEND OPPOSE.** (Unless it removes a greater domination—see Trade-off Tribunal below).
  *   **Reduces Domination:** **PASS.** (Even if Step 1 flagged interference, reducing mastery by others is a strong justification).
  *   **Neutral:** Proceed to Step 3.

  ### Step 3: The Agency Test (Positive Liberty)
  *Concept: Does this enable people to be their own masters, or does it treat them as children?*

  **Question:** Does this policy enhance an individual's actual capacity to form and act on rational plans, or does it bypass their will to impose an outcome?
  *   **Crucial Constraint:** Do not confuse "capacity" with "resources." Being too poor to travel is inability. Being legally barred from travelling is unfreedom. Positive liberty is about *internal or structural barriers to autonomy* (e.g., addiction, coercion, lack of essential information).
  *   **Paternalism Trap:** If the policy says "We know what is good for you better than you do," it fails. If it says "We are removing the coercion that stops you choosing," it passes.

  **Sufficient Answer:**
  *   **Enhances Agency (without dictating choice):** **PASS.**
  *   **Undermines Agency (Paternalism):** **STOP → RECOMMEND OPPOSE.**
  *   **Neutral:** **PASS.**

  ---

  ## Part 2: Decision Logic & Escalation

  **1. Clear Support:**
  *   Step 1: No Interference.
  *   Step 2: Reduces Domination.
  *   Step 3: Enhances Agency.

  **2. Clear Oppose:**
  *   Step 1: Interference.
  *   Step 2: Increases Domination.
  *   Step 3: Undermines Agency.

  **3. The Trade-off Tribunal (Escalate to Director):**
  *   *Conflict A (Interference vs. Domination):* The policy interferes (Step 1 Fail) but reduces domination (Step 2 Pass).
      *   *Example:* A law against assault interferes with the assaulter's liberty to reduce the victim's domination.
      *   *Action:* **Human Call.** Is the interference proportionate to the reduction in domination?
  *   *Conflict B (Negative vs. Positive):* The policy interferes (Step 1 Fail) to protect agency (Step 3 Pass).
      *   *Example:* Mandatory seatbelts.
      *   *Action:* **Human Call.** Is this enabling autonomy or imposing values?
  *   *Conflict C (The "Clean Hands" Problem):* The policy reduces domination (Step 2 Pass) but requires a surveillance apparatus that creates new domination risks.
      *   *Action:* **Human Call.** Risk assessment required.

  ---

  ## Part 3: Limitations & Misfires
  *Be honest with the Director about where this tool breaks.*

  1.  **The Paternalism Blind Spot:** Step 3 struggles to distinguish between "helping someone recover autonomy" (e.g., rehab for addiction) and "forcing someone to be healthy." If the team disagrees on whether a condition (like poverty or addiction) counts as a barrier to *agency* or just *ability*, escalate.
  2.  **The Collective Action Problem:** This screen focuses on the individual. It may misfire on policies where individual liberty must be curtailed for collective survival (e.g., pandemic lockdowns). It treats these as Negative Liberty violations without adequately weighing the "Positive Liberty" of the community to survive.
  3.  **The Status Quo Bias:** Republican Liberty (Step 2) favours the status quo if the current power dynamics are legally codified. It may underestimate informal domination (e.g., cultural pressure) that isn't written in law.

  ---

  ## Part 4: Worked Examples

  ### Proposal A: Night-time Curfew in a High-Crime Neighbourhood
  *Policy: No persons under 18 on streets between 23:00 and 05:00 without adult supervision.*

  1.  **Interference Test:** **FAIL.** Direct prohibition on movement.
  2.  **Power Check:** **FAIL.** Grants police discretionary power to stop and question youths. Creates dependency on adult "goodwill" for exemption. Increases domination of state over youth.
  3.  **Agency Test:** **FAIL.** Treats all youths as potential victims or criminals, bypassing their capacity to judge safety. Paternalistic.

  **Recommendation:** **OPPOSE.**
  **Notes:** Clear violation across all three dimensions. Easy win for campaigners.

  ***

  ### Proposal B: Mandatory Digital ID for Social Media Accounts
  *Policy: All users must verify real-world identity with government-issued ID to post on platforms.*

  1.  **Interference Test:** **FAIL.** Adds a barrier to speech/association.
  2.  **Power Check:** **FAIL.** Creates massive domination. The State/Platform holds the "off switch" for your digital existence. Discretionary de-platforming becomes possible without recourse.
  3.  **Agency Test:** **MIXED/FAIL.** Proponents argue it enhances agency by reducing abuse (allowing others to speak freely). However, it forces users to surrender anonymity, a tool often required for safe agency (e.g., whistleblowers, abuse survivors).

  **Recommendation:** **OPPOSE.**
  **Notes:** The domination risk (Step 2) outweighs the potential safety benefits. The power imbalance between user and verifier is too high.

  ***

  ### Proposal C: Workplace Ban on Managers Dating Subordinates
  *Policy: Company policy prohibits romantic relationships between line managers and direct reports. Breach results in transfer or dismissal.*

  1.  **Interference Test:** **FAIL.** Directly prohibits consensual adult association. (Campaigners will instinctively hate this).
  2.  **Power Check:** **PASS.** **Crucial Point.** The current status quo allows the manager to hold arbitrary power over the subordinate's career *through* the relationship. Even if the manager is kind, the *capacity* to favour or punish exists. The ban removes this structural domination.
  3.  **Agency Test:** **PASS.** The subordinate cannot truly consent to a relationship where their livelihood is at stake. Their agency is compromised by the power imbalance. The ban restores the condition for genuine consent.

  **Recommendation:** **SUPPORT.**
  **Notes:** **ESCALATION LIKELY.** This restricts Negative Liberty (Step 1) to secure Republican Liberty (Step 2).
  **Why campaigners won't like it:** It feels like "nanny state" interference in private life.
  **Why the screen supports it:** Freedom from the *threat* of arbitrary power (Republican Liberty) is more fundamental than the freedom to enter a compromised relationship (Negative Liberty). To oppose this is to prioritise the manager's freedom to dominate over the subordinate's freedom from domination.

  ---

  ## Implementation Guide for the Team

  1.  **Print this one-pager.** Do not open a laptop.
  2.  **Assign a Timekeeper.** 10 minutes per step max.
  3.  **No "Buts".** In Step 1, do not argue about *why* the interference is happening. Just establish *if* it is happening.
  4.  **Escalate the Uncomfortable.** If the screen tells you to support a restriction (like Proposal C), do not fudge the result. Send it to the Director with the "Trade-off Tribunal" note. That is where the political strategy is decided; the Policy Unit's job is to ensure the liberty trade-off is visible.

  **Final Warning:** This tool will not tell you what is *just*. It will only tell you what is *free*, and in which sense. Justice is the Director's call. Liberty is yours.
