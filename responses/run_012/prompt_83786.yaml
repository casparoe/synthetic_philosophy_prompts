answer: |-
  Good morning. Thank you for coming out in the cold.

  Looking at this space, I know some of you expected a ribbon cutting. Instead, we have a garden growing around a hole. We have benches facing a pedestal that holds nothing but air. We have a new plaque bolted onto the side of the old stone, explaining why the bronze is currently sitting behind the salt shed at the DPW yard. It looks unfinished. It looks like a argument we stopped in the middle of.

  As a history teacher, I spend a lot of time telling students that the past is not a straight line. It is a messy room. Elias Wardwell built half this town. He gave us the library bricks and the hospital wing. He also broke the strike in '94, evicted families in January, and funded groups that made life unbearable for the Polish and Italian neighbors who worked his mills. For a hundred years, the statue told us to remember the library. It asked us to forget the evictions.

  When the Council voted to take the bronze down, people asked me if we were erasing history. I told them no. We were stoping a lie from standing taller than the truth.

  Here is the hard part about stone and metal: you cannot edit them. You can bolt a new plaque onto the base, you can plant flowers around the feet, but you cannot change what is carved into the granite. The original inscription says 1897. It says "Grateful Town." Those words are two feet high. Any correction we add is smaller. It is bolted on. In the hierarchy of attention, carved stone always beats a metal plate. The correction becomes a footnote to the original claim. If we left the statue up, even with a explanation, the bronze would still win. The honor would still outweigh the context.

  So we moved the bronze. But we kept the plinth.

  Some say the empty pedestal is a mistake. I say it is the only honest label left for the man who stood here. We did not remove this statue to erase history, but to stop letting stone lie for us.

  Now, people will ask where the bronze goes. If we melt it down, we pretend the conflict never happened. If we leave it in the DPW yard forever, we treat our own history like trash. If we give it back to the family, it becomes a private heirloom, hidden away from the public record.

  It belongs in the museum. Not on a pedestal, but on the floor. In a museum, a statue is not a hero; it is an artifact. It becomes evidence. There, it can sit next to the strike records and the eviction notices. It can tell the whole story without demanding we worship it.

  To the Wardwell family: your legacy is not solely this bronze. To the descendants of the mill workers: your grief is not solely this stone. To the Mayor and the Council: this garden is not a period at the end of the sentence.

  An empty pedestal is not a blank space; it is a question mark carved in granite. It asks us what we value now, knowing that fifty years from now, someone else might look at this garden and judge us just as hard as we judged Wardwell. They will ask if we built the housing we promised. They will ask if we fixed the schools. They will ask if we treated the new families arriving in Wrenfield better than the old ones treated the Italians and the Poles.

  The bronze is gone. The stone remains. The work is ours.

  Thank you.

  ***

  **Note on Choices**

  I built this speech on **Dave's "Footnote Trap."**

  **Why this idea:** It grounds the speech in the physical reality of the square—the carved stone versus the bolted plaque. It explains *why* the statue had to move without relying on abstract morality. It validates the decision to keep the plinth (as evidence of the original lie) while removing the honor (the bronze). It allows you to speak as a historian dealing with evidence rather than a moralist dealing in judgment.

  **What the "Promise" idea would have forced you to give up:** Using the "Monument as Promise" framework would have forced you to focus almost entirely on the future obligation of the town. While powerful, it risks sounding mushy or preachy ("what promise do we make to our children?"). It would have made it harder to address the specific physical awkwardness of the empty plinth and the bolted plaque. The "Promise" idea looks forward; the "Footnote" idea explains the present configuration. You needed to justify the empty plinth *now*, not just the future garden.

  **Statue Recommendation:** I argued for the **museum**.
  *   **Warehouse:** Implies neglect and shame; leaves the object rotting.
  *   **Melted:** Erases the evidence; prevents future learning.
  *   **Family:** Privatizes public history; removes accountability.
  *   **Museum:** Contextualizes the object as an artifact of a specific time and mindset, stripping it of its honor while preserving its historical value. This is the safest position for a history teacher to take publicly.

  **The Spicy Sentence:** *"We did not remove this statue to erase history, but to stop letting stone lie for us."* This is quotable, defensible, and clarifies the intent without attacking specific individuals in the audience.
