  # Seminar Handout: Week 2
  ## Mapping the Logical Space of the Precautionary Principle

  **Root Commitment:** *In some cases, a lack of decisive evidence about harm should make a difference to what we are permitted to do.*

  ### I. The Decision Tree

  **1. What is the primary normative function of this precautionary commitment?**

  *   **A. To select a specific action or outcome (Decision Rule)**
      *   **1.1. What is the immediate object of the precautionary constraint?**
          *   **i. The Regulatory Framework itself (Meta-Precaution)**
              *   *Position:* **Meta-Precautionary Principle**
              *   *Best tested by:* Stratospheric Aerosol Experiment (choosing the rule for geoengineering).
              *   *Awkward Commitment:* We cannot use precaution to save the planet today, only to design the rules for how we decide tomorrow.
          *   **ii. The Specific Activity or Technology**
              *   **1.2. What level of worry triggers a departure from standard optimization?**
                  *   **i. Statistical Significance or Non-Negligible Probability**
                      *   **1.3. What is the required response to the trigger?**
                          *   **i. Incorporate a Safety Margin into Cost-Benefit Analysis**
                              *   *Position:* **Ordinary CBA with Safety Margin**
                              *   *Best tested by:* Cosmetic Ingredient (weak rodent signal).
                              *   *Awkward Commitment:* We accept the risk of catastrophic ruin if the probability is low enough and the profit high enough.
                          *   **ii. Require Adaptive Management and Monitoring**
                              *   *Position:* **Weak Precautionary Filter**
                              *   *Best tested by:* Deep-Sea Mining (unknown recovery rates).
                              *   *Awkward Commitment:* We permit potential irreversible damage provided we promise to watch it happen and adjust later.
                  *   **ii. Bare Possibility or Plausible Mechanism (without probability)**
                      *   **1.3. What is the required response to the trigger?**
                          *   **i. Impose a Moratorium until Safety is Proven**
                              *   *Position:* **Strong Precautionary Ban**
                              *   *Best tested by:* Gene Drive (cross-species contamination).
                              *   *Awkward Commitment:* We must forego potentially life-saving technologies because we cannot prove a negative.
                          *   **ii. Require Compensation Mechanisms (Liability)**
                              *   *Position:* **Unnamed (Liability Rule Precaution)**
                              *   *Best tested by:* Psychiatric Drug (unknown long-term effects).
                              *   *Awkward Commitment:* We allow harm to occur provided the victims are paid afterwards.

  *   **B. To shape belief formation or inquiry (Epistemic Attitude)**
      *   **1.4. What is the object of epistemic caution?**
          *   **i. The Formation of Belief itself**
              *   *Position:* **Unnamed (Conservative Belief)**
              *   *Best tested by:* Cosmetic Ingredient (interpreting weak signals).
              *   *Awkward Commitment:* We must treat unproven fears as established facts for the purpose of reasoning.
          *   **ii. The Relationship between Research and Deployment**
              *   *Position:* **Epistemic Precaution (Research Yes / Deployment No)**
              *   *Best tested by:* Gene Drive (lab study vs. release).
              *   *Awkward Commitment:* We may fund research into dangers we are forbidden from acting upon.

  *   **C. To allocate procedural responsibilities (Burden Shifting)**
      *   **1.5. Who bears the burden of producing evidence regarding safety?**
          *   **i. The Regulator / Public (Status Quo)**
              *   *Position:* **Unnamed (Anti-Precautionary Proceduralism)**
              *   *Best tested by:* Psychiatric Drug (approval process).
              *   *Awkward Commitment:* We permit activities with unknown risks until the public proves harm has occurred.
          *   **ii. The Proponent of the Activity**
              *   **1.6. What standard of evidence satisfies the burden?**
                  *   **i. Proof of No Net Harm (Risk-Benefit Balance)**
                      *   *Position:* **Weak Burden-Shifting Precaution**
                      *   *Best tested by:* Deep-Sea Mining (licensing).
                      *   *Awkward Commitment:* We permit innovation provided the proponent can argue the benefits outweigh the unquantified risks.
                  *   **ii. Proof of Absolute Safety (No Harm)**
                      *   *Position:* **Strong Burden-Shifting Precaution**
                      *   *Best tested by:* Stratospheric Aerosol (deployment).
                      *   *Awkward Commitment:* We effectively ban all novel technology because proof of absolute safety is logically impossible.

  ***

  ### II. Instructor's Key: Logical Gaps and Overlaps

  **1. Indistinguishable Leaves (Convergence)**
  *   **Weak Precautionary Filter (A.1.ii.1.ii.i) vs. Weak Burden-Shifting (C.ii.1.6.i):**
      *   *Why they blur:* In practice, requiring "Adaptive Management" often entails shifting the burden to the proponent to monitor and report. The outcome (activity proceeds with conditions) is often identical, even if the justification (decision rule vs. procedure) differs.
      *   *Seminar Question:* Does it matter if we call it a "filter" on the action or a "burden" on the actor if the licence conditions are the same?

  **2. Unoccupied or Incoherent Combinations**
  *   **Procedural Branch + Regulator Burden + Strong Ban Remedy:**
      *   *Status:* **Incoherent.**
      *   *Reasoning:* If the Regulator bears the burden of proof (C.i), they must demonstrate harm to restrict action. If the Remedy is a Strong Ban based on uncertainty (A.1.ii.2.i), it requires restriction *without* demonstration of harm. These two nodes contradict one another.
  *   **Epistemic Branch + Restrict Inquiry + Restrict Deployment:**
      *   *Status:* **Unoccupied (Paralysis).**
      *   *Reasoning:* No serious position advocates forbidding both the study of a risk and the use of the technology. This leads to total ignorance and stagnation. The "Epistemic Precaution" leaf (B.ii) occupies the stable middle ground (Study Yes, Deploy No).
  *   **Decision Rule + Bare Possibility + Safety Margin:**
      *   *Status:* **Unattractive/Unexplored.**
      *   *Reasoning:* If the trigger is merely "bare possibility" (which applies to almost anything), a "safety margin" is insufficient to manage the scope of the risk. Usually, bare possibility triggers a Ban (A.1.ii.2.i) or Meta-Review (A.i), not just a margin.

  **3. Case Anchoring Guide**
  *   **Gene Drive:** Best for distinguishing *Strong Ban* (A.1.ii.2.i) from *Epistemic Precaution* (B.ii). Is the worry about the *release* or the *knowledge*?
  *   **Deep-Sea Mining:** Best for distinguishing *Weak Filter* (A.1.ii.1.ii.i) from *Weak Burden* (C.ii.1.6.i). Is the condition on the *seafloor* or the *company's report*?
  *   **Cosmetic Ingredient:** Best for *CBA with Margin* (A.1.ii.1.i.i). At what point does a rodent signal become a "non-negligible probability"?
  *   **Stratospheric Aerosol:** Best for *Meta-Precaution* (A.i) and *Strong Burden* (C.ii.1.6.ii). The cost of reversal makes the *decision procedure* the primary risk.
  *   **Psychiatric Drug:** Best for *Liability Rule* (A.1.ii.2.ii) vs. *Status Quo Proceduralism* (C.i). Do we pay victims later, or require proof of harm now?
