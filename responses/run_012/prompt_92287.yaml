answer: |-
  This is one of the sharpest tensions in private law theory, and it is no accident your professor is hesitant to close the loop. You have identified the friction point between **Corrective Justice** (making the injured party whole) and **Efficiency** (maximizing social wealth).

  You are asking for the philosophical substrate of remedies law. Specifically, you want to know what theory of *practical reason*—what account of how rational agents should treat their past investments—is baked into the black-letter law of contracts.

  Here is the breakdown of the candidate readings, the reconstruction of the current practice, and the counterfactual reconstruction you requested.

  ### I. Candidate Readings: What Could the Law Be Assuming?

  To diagnose the practice, we must first isolate the competing theories of rationality regarding sunk costs that could underlie it.

  1.  **The Strong Econ View (Sunk Costs are Irrelevant):**
      *   *Premise:* Rationality is strictly forward-looking. Resources should flow to their highest valued use. Past expenditure is gone; it cannot be recovered. To continue a project solely because of past investment is the "sunk cost fallacy."
      *   *Implication for Law:* Efficient breach is a virtue. Remedies should be priced exactly at the value of performance to the promisee, allowing the promisor to exit whenever their cost of performance exceeds that price. Reliance is only protected to the extent it induces optimal reliance investment *ex-ante*.

  2.  **The Fuller & Perdue View (Reliance is the Moral Truth):**
      *   *Premise:* The law's moral authority comes from preventing harm caused by induced reliance. Expectation damages are a "fiction" or a proxy because they are easier to administer than proving specific reliance items.
      *   *Implication for Law:* The law *should* be protecting the status quo ante. If we protect expectation, it is only because we assume reliance would have ripened into that expectation. Honoring the "deal" is a way of honoring the reliance that built it.

  3.  **The Planning Agency View (Commitment is Constitutive):**
      *   *Premise:* (Drawing on philosophers like Michael Bratman). Human agency requires long-term planning. To be a rational agent, you must sometimes bind yourself to a course of action *precisely to avoid* recalculating costs at every turn. Ignoring sunk costs can be irrational if it undermines the stability of the plans that constitute your life/projects.
      *   *Implication for Law:* Breach is a failure of agency, not just an economic reallocation. The law should enforce the plan, not just compensate for its failure.

  4.  **The Institutional/Underdetermined View:**
      *   *Premise:* The law does not commit to a theory of rationality. It commits to *predictability*.
      *   *Implication for Law:* The rules are a pragmatic compromise. They use economic language to justify outcomes that feel morally right (Fuller) while allowing commercial flexibility (Econ).

  ### II. Reconstructing the Actual Practice: The Split-Level Theory

  What does the current regime of Expectation Damages + Efficient Breach actually presuppose?

  It presupposes a **Split-Level Theory of Practical Reason**. It does not hold the promisor and the promisee to the same standard of rationality regarding time and investment.

  **1. For the Promisor: Sunk Costs are Irrational.**
  The law explicitly licenses the promisor to ignore what they have already poured into the deal. If I have spent $100k preparing to build your house, but I can sell my labor to someone else for a net gain of $50k after paying you damages, the law tells me I am *rational* to breach. The law treats my past investment as a loss I must absorb to achieve greater social utility. It presupposes that honoring a commitment *because* of past investment is a mistake the law should not indulge. It treats the contract as an option to perform or pay, not a bond of fidelity.

  **2. For the Promisee: Reliance is Rational (but Insured).**
  Conversely, the law treats the promisee's reliance as reasonable and worthy of protection. However, it protects it *via* expectation. Why? Because the law assumes a rational promisee relies *in order to gain the surplus*. The law protects the promisee's forward-looking expectation to encourage their backward-looking reliance.

  **3. Is it Internally Consistent?**
  Functionally, yes. Morally/Philosophically, no.
  The practice is consistent *if* you assume the goal of contract law is **wealth maximization through risk allocation**.
  *   It tells the Promisor: "Don't get emotionally or economically attached to performance; keep looking for better deals."
  *   It tells the Promisee: "Get attached; invest as if the deal is certain, because we will insure your upside."

  The tension you feel comes from the fact that Fuller & Perdue argue the law is about **harm prevention** (a backward-looking moral duty), while Efficient Breach argues the law is about **resource allocation** (a forward-looking economic goal). The current practice papers over this by using Expectation Damages as a universal translator. It pretends that paying the "value of the bargain" satisfies the moral duty of reliance *and* the economic requirement of efficiency.

  **4. What the Practice Needs vs. What Fits.**
  *   **What it Needs:** The practice strictly needs the Promisee to believe their reliance is secure (to induce contracting) and the Promisor to believe they can exit (to induce efficient resource movement). It *needs* the fiction that Expectation = Reliance + Profit.
  *   **What Fits:** Fuller & Perdue fits the *rhetoric* of the courtroom (fairness, making whole). Law & Econ fits the *structure* of the remedy (damages as price).
  *   **The Verdict:** The practice is underdetermined. It does not require you to believe honoring sunk costs is *always* irrational. It only requires you to believe it is irrational *for the promisor in the context of market efficiency*. It is a localized theory of rationality, not a universal one.

  ### III. The Counterfactual: If Honoring Sunk Costs Were Rational

  Now, let's take your suggestion seriously. Suppose we adopt the **Planning Agency View**: that sticking with a project because of past investment is sometimes rational because the investment is constitutive of the project's value, or because stability of commitment is a higher rational good than marginal efficiency.

  If we rebuilt remedies on this view, the landscape of contracts would change radically.

  **1. Specific Performance Becomes the Default.**
  If the commitment itself has value—if the "project" is not just a exchange of value but a shared plan—then money cannot make the promisee whole. The rational thing is to complete the plan.
  *   *Change:* Breach is no longer "efficient"; it is a failure of the legal system. The remedy shifts from damages (substitute) to performance (fulfillment). The promisor cannot "buy out" their obligation simply because a better deal arose, because the obligation was not merely to pay value, but to sustain the joint plan.

  **2. Reliance Damages Supersede Expectation.**
  If the "sunk cost" is evidence of the project's reality (as you suggested), then the loss of that investment is the primary harm, not the loss of the hypothetical profit.
  *   *Change:* Expectation damages assume the profit was the point. A Sunk-Cost-Rational system might argue the *engagement* was the point. Remedies would focus heavily on restoring the reliance expenditure, potentially capped not by the contract price, but by the objective value of the work done. We might see a shift toward *restitution* as the primary remedy, preventing the promisor from walking away with the benefit of the promisee's sunk costs without finishing the job.

  **3. The Death of Efficient Breach.**
  Efficient breach relies on the idea that the promisor's resources belong to the market, not the promisee. If honoring sunk costs is rational, the resources poured into the deal are "locked" to the deal.
  *   *Change:* "Good Faith" performance clauses would be read aggressively. A promisor who breaches to take a better offer would be seen as acting irrationally (violating their own planning agency) and perhaps punitively. We would see punitive damages for "opportunistic breach" become standard, not exceptional.

  **4. Promissory Estoppel Swallows Consideration.**
  If reliance is the rational basis for commitment (because it constitutes the project), then the formality of a bargain (consideration) matters less than the fact of the reliance.
  *   *Change:* The boundary between Contract and Tort blurs. If you induce me to sink costs, you are responsible for those costs regardless of whether we haggled over a price. The "deal" is less important than the "relationship of reliance."

  ### IV. Conclusion: What the Practice Believes

  You asked me to land somewhere. Here is the philosophical verdict.

  The current law of remedies presupposes that **human beings are distinct from their projects.**

  It assumes a thin, liberal theory of the self. In this view, you are a free agent who enters and exits commitments based on current valuations. Your past investments do not bind your future will unless you choose to let them. This is why the law allows efficient breach: it assumes the promisor is sovereign over their labor and capital, and no past promise can enslave them to a losing proposition.

  Simultaneously, it assumes the promisee is **vulnerable and needs insulation from that sovereignty.** It protects the promisee's expectation not because the promise is sacred, but because the promisee needs a stable environment to plan *their* life.

  The unease you feel is the recognition that this view is **alienating.** It treats the contract as a bet on the future, not a bond of the past. It tells the promisor, "What you built together doesn't matter; only the price matters."

  If the law took seriously the idea that honoring sunk costs is rational—that we are defined by our commitments and that abandoning a project because the math changed is a kind of moral or practical failure—the law would look less like a market regulator and more like a guardian of joint enterprises. It would prioritize **Specific Performance** over Damages, and **Fidelity** over **Efficiency**.

  The practice is internally consistent only if you accept that the law's goal is to facilitate *market exchange*, not *human cooperation*. If you believe the latter, the current law of remedies is not just confusing; it is philosophically mistaken. It protects the *value* of the promise while sacrificing the *integrity* of the promising.
