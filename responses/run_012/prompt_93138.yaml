  1. If the present moment is merely a backward-dated story, then what exactly have we been stabilizing for decades, and isn't calling it a construction just a polite way of saying our practice is based on an illusion? The stability you feel is the commitment itself, which is real enough to function, even if the timeline it imposes is edited after the fact (this concedes the illusion point without fully reassuring them that the value of the practice remains intact).

  2. When I sit, the now feels immediate and direct, not like a delayed narrative draft, so why should I trust a lab trick about colored dots over my own direct awareness? The commitment clock works so seamlessly that the editing process is invisible, which is precisely why the illusion of immediacy is so convincing (you are asserting a hidden mechanism against their direct testimony, which risks sounding dogmatic).

  3. If the brain commits to a story, who is aware of that commitment, and doesn't positing a commitment clock just reintroduce the homunculus you claim to avoid? The commitment is a functional event in the system, not a little person watching a screen, so no homunculus is required (functionalists often struggle to explain where the feeling of commitment resides without smuggling in a viewer).

  4. Dennett already covered this with Orwellian and Stalinesque distinctions, so what work is your retro-binding actually doing that those two categories don't? Both those models assume a single objective timeline for experience, whereas retro-binding suggests the timeline itself is generated by the commitment (this relies on a metaphysical claim about time that might be harder to demonstrate than the perceptual effect).

  5. If your theory is right, does preparing for this talk mean you haven't actually experienced writing it yet? I experienced the commitment to the words, not the writing itself, just as you experience the commitment to the present, not the present itself (this risks sounding like a clever paradox that dismisses the reality of your own preparation and undermines your credibility).
