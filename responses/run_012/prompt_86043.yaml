answer: |-
  Good morning. Twenty-two years ago, I sat where you are now. I remember the itch of the new uniform and the absolute certainty that I knew how to fix things. Looking around the room, I see that same look in your eyes. I also see the exec team in the front row, and I see my own intake year sitting quietly at the back. They're not here to clap; they're here to grade me. So, for their sake, I'll try not to swear, and I'll keep this under eight minutes.

  Comms asked me to keep it light. They probably expected me to tell you that the real learning starts now. I'm not going to do that. You've learned plenty. What I want to talk about is the stuff you're going to hate. The protocols. The box-ticking. The things that feel like they get in the way of the work.

  In six months, you'll be out on the road. You'll be tired. You'll have a patient who needs to move, and you'll need to draw up a controlled drug. The rule says two signatures. You're alone with your partner. You know the drug. You know the dose. The fence is there, telling you to wait. Or you'll have a patient refusing transport. The rule says you have to play back the risks until they say them back to you. It feels like script-reading. It feels like bureaucracy. You will look at that rule and think: *This is useless. I can see the ground on the other side. I'm going to take this down.*

  There is wisdom in pausing before you knock something down. Often, a rule exists because someone got hurt when it wasn't there. The reason might not be in the policy document; it might be in the muscle memory of the service. It lives in the practice, not in the paperwork. Sometimes the person who wrote the rule is retired, or gone. So, when you ask "Why is this here?" the answer might be "We don't really know."

  That uncertainty is a trap. It lets the rule-lover say, "Nobody knows, so leave it alone." It lets the rule-hater say, "Nobody knows, so it's pointless." Both are cheating. Both ignore the fact that the fence itself holds the knowledge, even if the blueprint is lost.

  So, don't just ask why it was put there. Ask what happens if you stop. Can you find that out cheaply? Can you find that out reversibly? If skipping the full set of obs before moving a patient saves two minutes, what is the cost if you're wrong? If the cost is catastrophic, the fence stays. If the cost is minor, maybe you test the gate. It is slower than blind obedience, and it is more boring than rebellion. It requires you to treat the rule not as an order, but as a hypothesis.

  You also need to learn to look at the fence and ask who it is protecting. This is the hard part. Some of those rules are there to keep the patient safe. Some are there to protect the service's backside. Sometimes, unfortunately, those are the same thing. Sometimes they aren't. You need to be able to tell the difference. If a rule protects the organisation from liability but adds no value to the patient care, it might still need to be followed, but don't confuse it with clinical wisdom. Trust the institution, but verify the purpose.

  The old hands at the back know that inherited practice stores up knowledge no living person has. That is a reason for care, not a reason for paralysis. You will inherit a system that is imperfect. You will find fences that are rotting and need replacing. You will find gates that were locked for reasons that no longer exist.

  Your job isn't just to follow the path. It's to walk it carefully enough to know where the stones are loose. When you encounter a rule that feels like an obstacle, don't just kick it over. Don't just worship it either. Test it. Respect the history it represents, but measure it against the reality in front of you.

  You are joining a profession that carries a lot of weight. You will carry the weight of other people's worst days. You will carry the weight of the rules we've built to survive those days. Handle both with care.

  Welcome to the service. Look after each other, and look after the patients. I'll see you on the road.
