      *Correction:* If there is no law, there is no *authority* to shoot. Therefore, shooting is murder. Dana is confused here. If the statute isn't law, the officials had no legal cover. They are murderers. Dana thinks "no law to break" means "no law exists to be violated." That's a category error. You don't need a statute to make murder illegal (malum in se). Peter would say the shootings were murder because they violated fundamental rights, not a statute. Dana's argument here is slightly muddled legally, but her point about *reliance* stands.

      *Okay, I need to be precise in the adjudication.*

