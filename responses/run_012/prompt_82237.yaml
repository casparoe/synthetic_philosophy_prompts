answer: |-
  This is a classic jurisprudential deadlock. You have staged a debate between **Legal Positivism** (Dana) and **Procedural Natural Law** (Peter). Dana argues that law is simply what the sovereign enacts, regardless of morality. Peter argues that law has an "inner morality"—if rules aren't public, clear, or stable, they aren't law at all, just force.

  This isn't just academic; it's the exact argument held by H.L.A. Hart and Lon Fuller after World War II regarding "grudge informers." Here is the adjudication of their moves, scored on a scale of **1 (Legally Unsound)** to **10 (Legally Decisive)**, followed by what each is missing.

  ### The Round-by-Round Adjudication

  **Round 1: The Setup**
  *   **Dana:** Convict via retroactive statute. Admit the cost.
      *   **Score: 6/10.**
      *   **Ruling:** intellectually honest, politically dangerous. She is correct that punishing Kolb violates the principle of *nullum crimen sine lege* (no crime without law). By admitting this, she preserves the integrity of the new legal code. However, she proposes a "Bill of Attainder"—legislating punishment for a specific person/act after the fact. This undermines the new government's claim to be a Rule of Law state. It looks like victor's justice.
  *   **Peter:** Declare the old statute void *ab initio* (from the start). Charge ordinary homicide.
      *   **Score: 7/10.**
      *   **Ruling:** This is the standard approach of post-totalitarian transitions (see: post-reunification Germany). It allows the new state to claim continuity with "Law" rather than admitting to a breach. However, it relies on a legal fiction. Everyone knows the statute *was* treated as law at the time. Calling it "not law" now is a semantic trick to avoid the retroactivity problem.

  **Round 2: The Nature of Law**
  *   **Dana:** That's retroactivity with a prettier name. You're giving judges power to void statutes they find repugnant.
      *   **Score: 8/10.**
      *   **Ruling:** Strong point. This is the greatest risk in Peter's approach. If judges can decide a statute "wasn't law" because it was unfair, legal certainty evaporates. Citizens never know if a validly passed law will be honored later. Dana correctly identifies that Peter is asking judges to act as moral philosophers, not jurists.
  *   **Peter:** Law must guide conduct. Public, prospective, clear. The old statute failed this.
      *   **Score: 8/10.**
      *   **Ruling:** Equally strong. This is the "Fullerian" test. A secret rule that changes four times a year cannot guide conduct. If a citizen *cannot* comply with the law because the law is unknowable, punishing them for non-compliance is tyrannical. Peter correctly argues that the old regime didn't just make *bad* law; it failed to make *law* at all.

  **Round 3: The Consequences**
  *   **Dana:** If the old rules weren't law, the officials who shot people broke no law either. Ordinary citizens get no protection. Your "guidance" test is too vague (driver's license example).
      *   **Score: 5/10.**
      *   **Ruling:** Legally muddled. If the authorizing statute is void, the officials had no legal cover for shootings; they committed murder under ordinary laws (which exist in all regimes). So Peter's logic actually *incriminates* the officials more, not less. However, Dana's second point (the driver's license) is a **9/10**. Complex, vague statutes exist in every democracy. If "vagueness" makes a statute void, half the modern legal code collapses. Peter's threshold is too subjective.
  *   **Peter:** Fuzzy at the edges beats exact and wrong at the center. The Receipt: If the statute was law, the state owes him money. If not, it was a bounty for a crime. You can't have it both ways.
      *   **Score: 9/10.**
      *   **Ruling:** Decisive. This is the strongest logical point in the entire argument. The receipt signifies state ratification. If the new court says the old statute was "law," Kolb has a civil claim to his informer's fee (unless explicitly voided). If the court says it was "not law," the payment was a bribe for a crime. The state cannot acknowledge the validity of the act for the purpose of punishment while denying its validity for the purpose of payment. Peter exposes the hypocrisy of the transition.

  ### What Dana Is Missing

  **1. The Legitimacy Trap.**
  Dana thinks honesty about retroactivity protects the Rule of Law. It doesn't. If the new government passes a law saying, "What was legal yesterday is a crime today," they announce themselves as just another regime using law as a weapon. They become the old regime with different uniforms. Peter understands that the *myth* of legal continuity is necessary for the new state to function.

  **2. Malum in Se vs. Malum Prohibitum.**
  Dana treats Kolb's act as *malum prohibitum* (wrong because the law says so). She misses that Peter is arguing the act was *malum in se* (wrong in itself). Homicide and accessory to deportation leading to death are universal crimes. Peter isn't inventing a crime; he's stripping away the *defense* of legal authority. Dana conflates "no statute forbade this" with "no law forbade this."

  **3. The Moral Weight of the Receipt.**
  She doesn't address the receipt. It's the smoking gun. It proves Kolb wasn't just a passive citizen following rules; he was a paid agent of the repression. This moves him from "duress" to "profit." It undermines his claim that he was just a confused citizen trying to stay out of trouble.

  ### What Peter Is Missing

  **1. The Reliance Interest.**
  Peter dismisses the fact that Kolb relied on the rules. In a transition, you have to decide who pays the price for the old regime's sins. Peter puts the whole price on Kolb. But Kolb was a small fish. By making him the test case for "what counts as law," Peter creates a society where no citizen can ever trust that a statute passed today will be valid tomorrow. That creates a different kind of tyranny.

  **2. The Causation Problem.**
  Peter says charge "ordinary homicide." Legally, this is a nightmare. Did Kolb *kill* the couple? He reported them. The Ministry deported them. They died. In many jurisdictions, reporting someone to the authorities, even a corrupt ones, is not the proximate cause of their death unless Kolb knew death was certain. Peter is assuming a causal link that a defense attorney (like Dana) would shred. If Kolb didn't pull the trigger, "accessory" requires intent. Did he intend their death, or just their deportation?

  **3. The "Driver's License" Reality.**
  Dana is right that his test is vague. If "clarity" is a requirement for law, then the U.S. Tax Code is not law. Peter needs a threshold for "extreme injustice," not just "confusing regulation." He risks turning every traffic ticket into a philosophical debate about the nature of law.

  ### What Both of Them Missed

  **1. The Sentencing Mitigation.**
  They are arguing about *conviction*, not *punishment*. In the actual German Border Guard cases, the courts convicted the guards but gave them suspended sentences or probation. The verdict established the principle (Peter's win), but the sentence acknowledged the human reality (Dana's concern). You can declare the act a crime without ruining the life of a low-level actor.

  **2. The Truth Commission Alternative.**
  They assume a criminal trial is the only tool. A Truth and Reconciliation Commission could have subpoenaed Kolb. He would testify under oath, name his handlers, and receive amnesty in exchange for truth. This solves the "receipt" problem (the money is disgorged as part of restitution) without needing a legal fiction about whether the old statute was "law."

  **3. The Audience.**
  They are arguing for the legal record, but trials like this are theater for the public. Dana's approach tells the public: "We are breaking the rules to get him." Peter's approach tells the public: "The rules saved us." Neither addresses the victims' families. The real hinge isn't the statute; it's whether the new state values *justice* (Dana) or *legitimacy* (Peter). In a novel, the tragedy is that they can't have both.

  ### Final Verdict for the Novel

  If you need a winner for the sake of the plot's logic: **Peter wins the legal argument, but Dana wins the moral one.**

  Peter's argument is how modern international law actually works (the Radbruch Formula). Courts *do* declare vile statutes "non-law." But Dana is right that it feels like a cheat. The tension comes from the fact that Peter is technically correct on the jurisprudence, but Dana is correct on the human cost.

  The receipt is your Chekhov's Gun. If Kolb spent the money, Peter wins. If Kolb donated the money or kept it untouched in a drawer, Dana wins (proving he didn't view it as a legitimate transaction). Use that detail to tip the scale.
