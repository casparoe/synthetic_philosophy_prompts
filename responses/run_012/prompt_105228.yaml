  # JOINT STATEMENT ON THE NORMATIVE FORCE OF DUTCH BOOK ARGUMENTS

  **Signatories:**  
  **The Pragmatic Party** (Proponent of Dutch Book Justifications)  
  **The Epistemic Party** (Proponent of Accuracy-Based Justifications)

  **Date:** October 26, 2023  
  **Context:** Adversarial Collaboration on the Foundations of Probabilism

  ---

  ### I. AGREED CLAIMS

  We, the undersigned, affirm the following claims as the common ground of our collaboration. We agree on the mathematical validity of the theorems cited and the structural prerequisites of the arguments, while reserving judgment on their normative interpretation.

  1.  **Mathematical Validity:** We agree that the Dutch Book Theorem (DBT) is mathematically sound: if an agent's betting quotients violate the probability axioms (specifically finite additivity and normalization), there exists a finite set of bets, each acceptable at those quotients, that guarantees a net loss in all possible worlds.
  2.  **Prerequisites of the Argument:** We agree that the DBT presupposes a specific link between credence and action. Specifically, it assumes that for any credence $p$ in proposition $X$, the agent is disposed to accept a bet on $X$ at stakes proportional to $p$ (and typically, on both sides of the bet). It further presupposes that utility is linear in money (or the relevant stake) over the range of the bets.
  3.  **Prima Facie Irrationality of Sure Loss:** We agree that accepting a package of bets that guarantees a loss, *ceteris paribus*, is a defect in practical rationality. We disagree only on whether this defect entails a defect in *epistemic* rationality.
  4.  **The Scope of Standard DBT:** We agree that the standard synchronic Dutch Book argument establishes **Finite Additivity**. It does not, without significant additional premises regarding infinite sets of bets, establish Countable Additivity.
  5.  **The Goal of Formal Epistemology:** We agree that a central goal of our field is to articulate the norms governing partial belief (credence) and that probabilistic coherence is a central candidate for such a norm.

  ---

  ### II. RESIDUAL DISAGREEMENTS

  We acknowledge the following divergences in our interpretation of the agreed claims. Each statement is phrased to reflect the committing party's preferred terminology and normative commitments.

  **1. On the Nature of the Norm**
  *   **The Pragmatic Party:** The Dutch Book argument demonstrates that probabilistic coherence is a constitutive requirement of **practical rationality**. An incoherent agent is practically self-defeating; because credences are functionally defined by their role in guiding choice (including betting), a failure of coherence is a failure of the agent to function as a unified decision-maker.
  *   **The Epistemic Party:** The Dutch Book argument demonstrates at most a constraint on **betting behavior**, not on credences as doxastic states. Because the argument routes through preferences and utilities, it yields a pragmatic consistency condition. A genuine justification of probabilism as an *epistemic* norm must be derived from the aim of belief (truth/accuracy) via dominance arguments, independent of the agent's practical interests.

  **2. On the Link Between Credence and Action**
  *   **The Pragmatic Party:** Credence is constitutively tied to betting dispositions. To have a credence just *is* (in part) to have a specific profile of dispositions to act under uncertainty. Therefore, a Dutch Book against an agent's betting quotients is directly a Dutch Book against their credences.
  *   **The Epistemic Party:** Credence is a representational state that *typically* influences action but is not identical to betting dispositions. An agent may have coherent credences but refuse to bet for non-epistemic reasons (e.g., risk aversion, moral constraints), or have incoherent credences that never manifest in bets. Thus, pragmatic consistency is evidence of, but not identical to, epistemic coherence.

  ---

  ### III. CRUXES AND PRIOR PREDICTIONS

  We identify the following two cruxes as the decisive points of contention. For each, we record our prior predictions regarding the outcome of further inquiry or thought experiments, and we address specific test cases.

  #### Crux 1: The Constitutive Link Between Credence and Disposition
  **Question:** Is a failure of betting coherence necessarily a failure of doxastic coherence, or can credences exist independently of betting dispositions?

  *   **Pragmatic Party Prediction:** We predict that any plausible analysis of "credence" will entail a dispositional component. If an agent lacks the disposition to bet according to their professed credences, they do not genuinely hold those credences.
  *   **Epistemic Party Prediction:** We predict that cases can be constructed where credences are robustly present (e.g., guiding inference, assertion, and confidence) while betting dispositions are absent or altered, severing the necessary link required by the Dutch Book argument.

  **Test Case A: The Incoherent Ascetic (Agent with no betting dispositions)**
  *   *Description:* An agent holds credences that violate the probability axioms (e.g., $P(A) = 0.6, P(\neg A) = 0.6$). However, this agent has a strict moral or practical policy against gambling and possesses *no* dispositions to accept bets whatsoever, even at fair odds.
  *   **Pragmatic Party Assessment:** This case is conceptually unstable. If the agent truly has no disposition to bet under *any* hypothetical scenario where utility is linear and stakes are negligible, they lack the functional role of credence. Alternatively, the Dutch Book argument applies counterfactually: *if* they were to act on their credences in a standard decision context, they would lose. Their incoherence remains a rational defect because their credences commit them to losses in possible worlds where they act.
  *   **Epistemic Party Assessment:** This case severs the link. The agent is doxastically incoherent, but the Dutch Book argument fails to touch them because the pragmatic route is blocked. This proves the DB argument is not a general justification for probabilism, as it cannot condemn the Ascetic without importing extra premises about action. The incoherence must be diagnosed via accuracy, not sure loss.

  **Test Case B: The Imprecise Agent**
  *   *Description:* An agent's doxastic state is represented not by a single function $P$, but by a set of functions $\mathbb{P}$ (imprecise credences). The set $\mathbb{P}$ is coherent (each member is probabilistic), but the agent's betting behavior is indeterminate (they accept bets only if all $P \in \mathbb{P}$ deem them favorable).
  *   **Pragmatic Party Assessment:** Imprecise credences can be accommodated, but they must still avoid a "generalized" Dutch Book (e.g., a book that beats every function in $\mathbb{P}$). If the imprecision is used to evade coherence constraints (e.g., by having vacuous sets), it is irrational. The link between credence and disposition holds, but the disposition is now a range of acceptable odds.
  *   **Epistemic Party Assessment:** This case highlights the superiority of accuracy-based norms. An imprecise agent can be evaluated by whether their set $\mathbb{P}$ is accuracy-dominated. The Dutch Book argument struggles here because it is unclear which "fair betting quotient" to target. This suggests the norm is fundamentally about the representational accuracy of the set $\mathbb{P}$, not the pragmatic consistency of a single betting quotient.

  #### Crux 2: The Requirement of Countable Additivity
  **Question:** Is a failure of Countable Additivity a genuine incoherence, or is Finite Additivity sufficient for rationality?

  *   **Pragmatic Party Prediction:** We predict that Countable Additivity cannot be justified by Dutch Book arguments without invoking infinite bets, which are pragmatically impossible. Therefore, Finite Additivity is the only binding constraint of practical rationality. Countable Additivity is a mathematical convenience, not a rational requirement.
  *   **Epistemic Party Prediction:** We predict that accuracy-dominance arguments (e.g., Predd et al. 2009) successfully establish Countable Additivity as a requirement for epistemic coherence. An agent who is merely finitely additive is vulnerable to strong dominance by a countably additive competitor, making finite additivity epistemically defective.

  **Test Case C: The Infinite Lottery (De Finetti Lottery)**
  *   *Description:* A lottery with countably infinite tickets $\{1, 2, 3, ...\}$. An agent assigns $P(n) = 0$ for each ticket (satisfying Finite Additivity, as any finite sum is 0) but $P(\text{Some ticket wins}) = 1$. This violates Countable Additivity.
  *   **Pragmatic Party Assessment:** The agent cannot be Dutch Booked with a *finite* set of bets. To exploit the violation, the bookie must make a countable infinite number of bets, which cannot be completed in finite time or space. Thus, the agent is practically rational. The violation is a non-issue for decision theory.
  *   **Epistemic Party Assessment:** The agent is epistemically defective. Their credence function is accuracy-dominated. There exists an alternative countably additive function that is guaranteed to be more accurate (or no less accurate in all worlds and more accurate in some). The impossibility of a practical infinite Dutch Book is irrelevant to the epistemic defect.

  ---

  ### IV. ANALYSIS OF VERBAL DISPUTE

  **To the Doctoral Candidate:**

  You asked whether any part of this dispute is verbal. **Yes, a significant portion is verbal**, though it masks substantive disagreements.

  1.  **The Term "Rationality":** The most obvious verbal dispute concerns the scope of the word "rational."
      *   The **Pragmatic Party** uses "rationality" to mean *instrumental efficacy in choice*. For them, if a norm doesn't constrain action, it isn't a rational norm.
      *   The **Epistemic Party** uses "rationality" to include *epistemic propriety*. For them, a belief can be irrational even if it never leads to a bad bet (e.g., a belief formed by crystal ball gazing that happens to be coherent).
      *   *Resolution:* If they agree to distinguish **Practical Rationality** (goal-directed action) from **Epistemic Rationality** (truth-directed belief), the disagreement shrinks. The Pragmatist claims DB proves Practical Rationality requires coherence. The Epistemicist claims DB does not prove Epistemic Rationality requires coherence.

  2.  **The Term "Credence":** There is a deeper verbal dispute regarding the definition of the subject matter.
      *   The **Pragmatic Party** operates with a **Functionalist/Behaviorist** definition of credence. To them, "credence" is defined by its causal role in decision-making. Under this definition, the "Incoherent Ascetic" (Case A) is arguably impossible by definition.
      *   The **Epistemic Party** operates with a **Representationalist** definition of credence. To them, "credence" is a mental state representing likelihood, which *causes* dispositions but is not *constituted* by them.
      *   *Resolution:* If the Pragmatist admits that "Credence*" (Representational) might come apart from "Credence" (Functional), they must concede the DB argument only applies to "Credence" (Functional). If the Epistemicist admits that "Credence" (Representational) is only normatively significant insofar as it guides action, they concede to the Pragmatist.

  3.  **Substantive Core:** Once the terminology is disambiguated, a substantive disagreement remains regarding **Countable Additivity**. This is not verbal. It is a disagreement about whether mathematical idealizations (infinite sets) impose normative constraints on finite agents. The Pragmatist says "No (pragmatically impossible)." The Epistemicist says "Yes (epistemically dominated)." This is a genuine philosophical divergence regarding the idealization of rationality.
