answer: |-
  Here are my comments, following your five questions. I am treating this as a peer review in a seminar context: blunt, focused on argumentative vulnerability, and sensitive to the Kantian interlocutor you mentioned.

  **(1) Reconstruction Faithfulness**
  Your reconstruction of the *Jim* case is stronger than your reconstruction of the *wife* case. You are right that Williams is concerned with identification ("cannot identify as his own action"). That maps well onto Williams's discussion of "ground projects" and the source of agency.

  However, you are importing your own view when you claim the wife case is "useless" to Williams. Williams uses the wife case to establish the *phenomenology* of alienation, which he then ontologizes in the Jim case. If you discard the wife case as merely "deliberative," you lose the bridge between psychological experience and metaphysical critique. Williams argues that the *feeling* of "one thought too many" reveals a truth about the structure of moral demand, not just a quirk of deliberation.
  *Correction:* Don't say the wife case is useless. Say it is the *phenomenological index* of the deeper structural problem found in Jim. A Kantian will press you on why the phenomenology matters if the normative structure is sound. You need the wife case to show that the normative structure *damages* the agent.

  Also, you underplay "negative responsibility" in the Jim case. Williams's point isn't just that Jim can't own the action; it's that utilitarianism makes Jim responsible for the *other's* action (Pedro's) if he refuses. Your "narrative integrity" frame captures the "owning" part but risks missing the "responsibility for outcomes beyond my agency" part, which is half the integrity objection.

  **(2) The Deliberative/Narrative Distinction**
  The distinction earns its keep, but your terminology is risky. "Narrative integrity" invites MacIntyrean or Ricoeurian baggage that isn't in Williams. Williams speaks of "ground projects" and "identity." If you use "narrative," a Kantian will ask if you are reducing morality to a story we tell ourselves.
  *Better phrasing:* Distinguish "Procedural Integrity" (deliberation) from "Constitutive Integrity" (identity).
  *Collapse Point:* The distinction collapses if the utilitarian argues that Constitutive Integrity is just long-term Procedural Integrity. If my "ground projects" are just dispositions optimized for utility over a lifetime, then the utilitarian swallows your distinction. You must argue that ground projects are *pre-conditional* for utility calculation, not inputs *into* it. If they are inputs, they can be traded off. If they are pre-conditions, they cannot. Your draft hints at this ("reasons that are his only in the sense that the calculation came out that way"), but you need to make the *pre-conditional* status explicit to prevent the collapse.

  **(3) Availability vs. Occurrence**
  This is your strongest move, and it is not a dodge. It targets the "esoteric morality" or "Government House Utilitarianism" problem.
  *The Strongest Disposition Reply:* A sophisticated indirect utilitarian (like Hare) will argue: "The truth of the theory does not need to be accessible to the agent for the action to be right. The agent operates on the intuitive level; the theorist operates on the critical level. The 'availability' is only to the theorist."
  *Your Counter:* You must argue that in a seminar context (and in a rational agent), we cannot sustain a split between what is *true* and what is *believed*. If the agent knows utilitarianism is true, the "license" is available *to them*, not just the theorist. If they must suppress the truth to function, the theory is self-effacing in a pathological way.
  *Vulnerability:* The utilitarian will say: "It is not pathological; it is rational ignorance." You need to press why *rational* agents cannot sustain this ignorance without alienation. The "availability" isn't just epistemic; it's normative. The agent knows their love is *provisional*. That provisionality is the alienation, regardless of whether they articulate it.

  **(4) Generalization to Non-Consequentialism**
  This is the danger zone. A Kantian seminar leader will pounce here.
  *The Trap:* If your argument is "any view requiring answerability to a standpoint the agent doesn't occupy destroys integrity," Kantianism is dead. The Categorical Imperative is a standpoint distinct from inclination.
  *The Fix:* You must distinguish between a standpoint of *aggregation* (Utilitarianism) and a standpoint of *rational willing* (Kant). Williams allows that morality makes demands. His objection is to demands that treat the agent's constitutive projects as *contingent data* to be weighed.
  *Refinement:* Do not generalize to "any view." Generalize to "any view that renders the agent's ground projects contingent upon an external calculus." Kantianism (arguably) treats fidelity to projects as a duty derived from *within* the will (autonomy), whereas Utilitarianism treats them as preferences derived from *outside* (heteronomy). If you don't make this cut, your paper proves too much and argues against morality *simpliciter*, which Williams does not do.

  **(5) Weakest Paragraph**
  The final paragraph ("So I want to distinguish...").
  *Why:* It tries to do three things at once: coin new terminology, dismiss the wife case, and generalize the conclusion. It is the pivot point of the paper, but it is currently the least supported.
  *Specific Vulnerability:* The claim that the wife case is "useless" is exegetically fragile and easily attacked. If Williams is wrong about the wife case, does the Jim case stand alone? You need the wife case to show that the *experience* of integrity matters.
  *Recommendation:* Cut the generalization claim at the end. It is a distraction that invites the Kantian objection I noted in (4) without giving you space to defend it. Focus entirely on securing the Constitutive Integrity reading of Jim. Also, soften the "useless" claim to "merely phenomenological preparation."

  **One Obvious Reply You've Ignored:**
  The "Dualism of Practical Reason." A utilitarian might concede that integrity is valuable but argue it is only instrumentally valuable. If sacrificing integrity saves 19 lives, integrity is the thing that must go. Your argument assumes integrity is a *constraint* on action, not a *value* to be maximized. You need to explicitly state that Williams is challenging the consequentialist *structure* of valuation, not just the outcome. If integrity is just another good, Jim should shoot. Williams says Jim *cannot* shoot without ceasing to be Jim. You need to make that "cannot" modal, not axiological.
