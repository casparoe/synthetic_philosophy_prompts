      *   *Uncertainty:* The "cost" of generating the surplus is unknown and borne by specific players.
      *   *Actually, let's look at the "Program Equilibrium" / "Representative" angle which is where SPI is usually defined (Oesterheld et al.).*
      *   *Simpler approach:* Just stick to the payoff matrix uncertainty.
      *   *Game:* Coordination.
      *   *Status Quo:* Play (Out, Out) -> (2, 2).
