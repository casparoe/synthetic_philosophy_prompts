      *   *Safety:* Since Competitive states are *possible*, $S$ is not safe for Alice (in Comp 1) or Bob (in Comp 2).
      *   *Can we rule out ALL joint plans?*
      *   Yes, if for every possible joint plan $J$, there exists at least one possible state of the world $\theta$ and one player $i$ such that $U_i(J, \theta) < U_i(StatusQuo, \theta)$.
