  2.  **Define "Safe Pareto Improvement" (Mental Sandbox):**
      *   Standard Pareto Improvement: $E[U_i(new)] > U_i(status\_quo)$ for all $i$. Usually based on expected utility given beliefs.
      *   Safe Pareto Improvement: $U_i(new, \theta) \ge U_i(status\_quo, \theta)$ for all $i$ and *all* possible states of the world $\theta$ (payoff structures).
      *   *Key distinction:* Ordinary PI relies on *beliefs* about payoffs. SPI relies on *knowledge* of the structure of payoffs, even if the specific values are unknown. It's about avoiding regret in *any* compatible world.
      *   *Context:* This usually comes up in game theory when agents delegate to representatives or programs that play on their behalf, often in the context of bargaining or conflict (e.g., Oesterheld, Conitzer, et al.). The "safety" is about avoiding a situation where you agreed to a deal that turns out to be a sucker's bet because you guessed the wrong payoff matrix.

  3.  **Drafting Example 1: Ordinary PI vs. Unsafe PI:**
      *   *Scenario:* Two companies, A and B, deciding whether to enter a new market or stick to old markets.
      *   *Status Quo:* Both stick to old markets. Payoff = (2, 2).
      *   *Uncertainty:* The new market's profitability is unknown. It could be "Boom" or "Bust".
      *   *Proposal:* Both enter the new market.
      *   *Beliefs:* They think "Boom" is 90% likely.
      *   *Payoffs in Boom:* (5, 5).
      *   *Payoffs in Bust:* (0, 0).
      *   *Analysis:*
          *   Expected Utility of Proposal: $0.9 \times 5 + 0.1 \times 0 = 4.5$.
          *   Status Quo: 2.
          *   $4.5 > 2$. This is an ordinary Pareto Improvement.
          *   *Safety Check:* In the "Bust" state, payoff is 0. Status quo is 2. $0 < 2$.
          *   *Conclusion:* Not safe. If the world turns out to be "Bust", both are worse off than staying put.
      *   *Refinement:* SPI usually implies we don't even know the probabilities, just the *set* of possible games. So, if the set of possible games includes "Bust", the move is unsafe.

