      *   *Is this "near-empty"?* Yes, in high-stakes bargaining where the distribution of gains is uncertain. If I don't know if the deal favors you or me, I can't safely commit to the deal without side payments that are also state-dependent (which might not be feasible).

  5.  **Refining the "Collapse" Argument:**
      *   The structural reason is **conflicting interests over the state-dependent value of the proposal**.
