  **Note on Constraints**

  To maintain the perfect mirror structure without altering punctuation or capitalization between the first and second halves, I avoided end-stops entirely; this allows the lines to flow forward and backward without grammatical fracture. The constraint cost me the ability to use distinguishing language entirely: no ordinals (one, two, first), no demonstratives (this, that), and no spatial markers (left, right, near) could be used. This forced ambiguity into phrases like "the shape alone" (which could mean a singular object or each object in isolation) and "shared design" (which could imply a single universal or a duplicated particular), leaving the reader to decide whether the repetition in the center reveals a second sphere or merely echoes the first.
