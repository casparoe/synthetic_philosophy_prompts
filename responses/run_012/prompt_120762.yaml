  ### Brainstorming Structures

  **1. The Betting Market**
  Participants trade tokens on the proposition "The Specimen has Both." Evidence arrives as market rumors shifting the "price" of Spots or Antennae.
  *   *Pros:* High energy, intuitive sense of "value."
  *   *Cons:* Risk aversion muddies pure credence. Players might hedge rather than update. Hard to enforce the specific Jeffrey update rule without it feeling like a trick.

  **2. The Calibration Lab**
  Participants are technicians calibrating a sensor. The "Specimen" is a reading. Evidence comes from secondary gauges.
  *   *Pros:* Abstract, focuses on mechanism.
  *   *Cons:* Dry. Might disengage writers looking for narrative resonance.

  **3. The Archivist's Dilemma (Selected)**
  Participants are curators verifying a collection. The "Specimen" is a card in a sealed envelope. The "Evidence" is notes from previous curators ("I am 60% sure this has spots").
  *   *Pros:* Fits your novelist context (testimony, documents). Allows for rigid mechanics disguised as cataloging. The "Envelope" creates the necessary epistemic distance.

  ---

  ### The Session Design: The Archivist's Dilemma

  **Concept:**
  Four teams act as archival teams verifying a specimen. They share the same underlying collection (the "Truth") but receive testimony in different orders. They must calculate the probability the specimen possesses "Both" traits. The collision happens when they compare final numbers.

  **Materials:**
  *   **The Collection:** 100 index cards per team (or one master set projected/counted).
      *   *Correlated Deck:* 40 "Both", 40 "Neither", 10 "Spots", 10 "Antennae".
      *   *Uncorrelated Deck:* 25 of each type.
  *   **The Evidence:** Sealed envelopes. Inside is a single card: "Update Credence of [Feature] to [X%]".
  *   **The Ledger:** A worksheet (see Facilitator Sheet) that forces the Jeffrey calculation structure.
  *   **Whiteboard:** Divided into four quadrants for team results.

  **Timeline (75 Minutes):**
  *   **00-10:** Setup & Rules. Distribute decks. Explain the "Ledger" mechanic.
  *   **10-25:** Round 1 (Correlated). Teams 1 & 2 work in silence.
  *   **25-40:** Round 2 (Uncorrelated). Teams 3 & 4 work in silence. (Teams 1 & 2 prepare whiteboard).
  *   **40-55:** The Collision. Reveal numbers. Discuss the discrepancy.
  *   **55-75:** Debrief. Map to epistemology.

  **The Rules of the Ledger (Crucial):**
  To ensure they feel the mechanism rather than just guessing, the Ledger forces them to update the *Joint Probabilities* (the four cells) at every step.
  1.  **Read Evidence:** "Set Credence of Spots to 0.6."
  2.  **Calculate Joints:** Multiply the conditional probabilities (derived from the deck) by the new credence.
  3.  **Renormalize:** Ensure the four cells sum to 1.0.
  4.  **Repeat:** Use the *new* joints to derive *new* conditionals for the second piece of evidence.

  **Uncertainty & Risk:**
  I am unsure if 15 minutes is enough for teams to calculate the intermediate conditionals ($P(S|A)$) from the updated joints without error. The fractions ($6/7$, $16/17$) are the failure point.
  *   *Mitigation:* The Ledger will provide the Base Conditionals ($P_0$). It will explicitly instruct: "For Step 2, you must recalculate conditionals from your Step 1 Joints." I will circulate to catch teams trying to use Base Conditionals for Step 2 (which yields the wrong result).

  **Predictable Failure Points:**
  1.  **The "Hard Evidence" Trap:** A participant will insist, "If the note says 60%, maybe it *is* Spotted." You must enforce that this is a shift in *confidence*, not a revelation of truth.
  2.  **The Static Conditional:** Teams will try to use the original deck correlation ($P(A|S)=0.8$) for the second step. This is the mathematical heart of the error. If they do this, the order effect disappears. You must catch this.
  3.  **The "One True Order" Objection:** Someone will argue the order that matches reality is correct. You must remind them the reality is unknown; they are managing *testimony*.

  ---

  ### Debrief Guide

  **1. The Collision (Whiteboard)**
  *   Write the four results.
  *   Correlated Team 1 (S then A): ~0.69
  *   Correlated Team 2 (A then S): ~0.57
  *   Uncorrelated Teams: ~0.48 (Both)
  *   *Ask:* "Same evidence, same math, different truth. Who is wrong?"

  **2. The Machinery**
  *   **The Partition:** Explain that they updated on the *features* (Spots/Antennae), not the *specimen types*.
  *   **The Rule:** This is **Jeffrey Conditionalization**. Unlike standard Bayes (where evidence is certain, $P(E)=1$), here evidence is uncertain ($P(E)=0.6$).
  *   **Commutativity:** In standard Bayes, order doesn't matter. In Jeffrey, it matters *if* the features are correlated.
  *   **The Control:** Show how the Uncorrelated teams got the same result. Correlation is the engine of the divergence.

  **3. The Philosophical Sting**
  *   **The Objection:** "If I described the experience fully (e.g., 'I saw a blurry spot'), it would be standard evidence in a larger space, and order wouldn't matter."
  *   **The Truth:** Yes. Jeffrey updating is often a shortcut for "I don't know exactly what I saw, only how it shifted my confidence." The 12-point gap is the cost of that thin description.
  *   **For the Novelist:** "You are giving your reader Jeffrey updates. You say 'He seemed guilty' (Credence 0.6), not 'He held the knife' (Certainty 1.0). If you layer these thin descriptions, the order in which you feed them constructs a different reality, even if the facts remain the same."

