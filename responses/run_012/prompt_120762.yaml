  ### Facilitator's Sheet (One Page)

  **WORKSHOP: THE ARCHIVIST'S DILEMMA**
  **Goal:** Demonstrate non-commutativity of uncertain evidence (Jeffrey Conditionalization).
  **Time:** 75 Mins | **People:** 14 (4 Teams of 3-4)

  **SETUP**
  *   **Teams 1 & 2:** Correlated Deck (40 Both, 40 Neither, 10 S, 10 A).
  *   **Teams 3 & 4:** Uncorrelated Deck (25 of each).
  *   **Envelopes:**
      *   Team 1: [1. Set Spots=0.6] $\rightarrow$ [2. Set Antennae=0.8]
      *   Team 2: [1. Set Antennae=0.8] $\rightarrow$ [2. Set Spots=0.6]
      *   Team 3: [1. Set Spots=0.6] $\rightarrow$ [2. Set Antennae=0.8]
      *   Team 4: [1. Set Antennae=0.8] $\rightarrow$ [2. Set Spots=0.6]

  **THE LEDGER (Worksheet Instructions)**
  *   **Step 1:** Calculate new Joint Probabilities.
      *   Formula: $P_{new}(Both) = P_{old}(Both|Feature) \times Credence_{new} + P_{old}(Both|\neg Feature) \times (1-Credence_{new})$.
      *   *Simpler:* $P_{new}(Both) = P_{old}(Feature|Both) \dots$ NO. Use: $P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$.
      *   *Easiest for Players:* Update the 4 cells directly.
          *   $Cell_{new}(Both) = Cell_{old}(Both) \times \frac{Credence_{new}}{Credence_{old}}$ (If Feature is present in cell).
          *   *Wait, simpler:* Just use the conditional formula provided on their sheet.
  *   **Step 2:** **CRITICAL.** Recalculate Conditionals from Step 1 Joints before applying Evidence 2.
      *   $P_{1}(A|S) = P_{1}(S \cap A) / P_{1}(S)$.
      *   If they use Base Conditionals here, the game fails. **Watch for this.**

  **MATH KEY (For You)**
  *   **Correlated Base:** $P(S)=0.5, P(A)=0.5, P(Both)=0.4$. $P(A|S)=0.8$.
  *   **Correlated Result 1 (S then A):** 0.69 (Approx).
  *   **Correlated Result 2 (A then S):** 0.57 (Approx).
  *   **Uncorrelated Base:** $P(S)=0.5, P(A)=0.5, P(Both)=0.25$. $P(A|S)=0.5$.
  *   **Uncorrelated Result:** 0.48 (Both orders).

  **TROUBLESHOOTING**
  *   **"Why aren't we just counting cards?"**
      *   *Answer:* "The envelope tells you how confident to *be*, not what the card *is*. You are simulating a reader's mind, not opening the box."
  *   **"One order must be right."**
      *   *Answer:* "In the absence of the true card, both are rational responses to the testimony provided. The 'truth' of the specimen is irrelevant to the 'truth' of the inference."
  *   **"The math is too hard."**
      *   *Answer:* Allow phone calculators. Focus on the *difference* in results, not the exact decimal. If Team 1 gets >0.65 and Team 2 gets <0.60, the point is made.

  **DEBRIEF PROMPTS**
  1.  "Did the Uncorrelated teams see the split?" (No).
  2.  "What caused the split?" (Correlation + Order).
  3.  "In your novels, when you withhold a fact but imply it, are you giving your readers a Jeffrey Update?"
  4.  "If you change the order of chapters, do you change the 'truth' of the character?"

  **NOTE:** Do not mention "Jeffrey Conditionalization" until the debrief. Call it "The Archivist's Rule."
