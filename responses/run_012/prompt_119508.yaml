      *   *Alibi:* Does the Prince use "Sicily is timeless" to excuse inaction? Yes. Does the novel critique him? Yes, via the ending (the family dies out anyway).
      *   *Resistance:* The Prince's inner life. His astronomy hobby (looking at eternal stars vs. dying earth). His sexual frustration. His death. These aren't structural; they are individual existential moments.
      *   *Scenes:* The landing/news arrival, the dinner with Sedara, the Ball, the death scene, the epilogue (the relic).
      *   *Verdict:* The novel humanizes Braudel. Braudel describes the cage; the novel shows the bird dying inside it.

