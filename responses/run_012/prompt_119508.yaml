      *   *Self-Correction on Braudel:* Braudel isn't just "structures win." He's about how structures limit possibilities. The Prince feels those limits.
      *   *Self-Correction on the Novel:* Does the novel actually believe in the *longue durée*? Yes, the ending suggests the family becomes irrelevant, but Sicily remains. But the *pathos* comes from the individual resistance.

