answer: |-
  Dr. Aris Thorne is a climatologist whose ground project is the uncompromising pursuit of empirical truth, a vocation she views as inherently impartial and serviceable to humanity. She uncovers data confirming a catastrophic tipping point, but releasing it immediately would trigger global market panic, halting funding for the very technologies needed to mitigate the disaster. A utilitarian demand enters not by commanding her to hide the data directly, but by insisting that her *deliberative process* must weigh the consequences of disclosure against the value of truth itself, treating her scientific integrity as just another input in a utility calculus. Aris feels that to even entertain this calculation is to betray her role as a scientist, because her commitment requires that truth dictates action regardless of the outcome, yet the utilitarian insists she cannot act morally unless she adopts the standpoint of a neutral utility-maximizer rather than a truth-seeker.

  Williams would argue that this demand alienates Aris from her own agency by making her a mere channel for the satisfaction of utility, violating her integrity even though her project is impartial. Integrity, for Williams, is about the identification with one's actions and projects; by forcing Aris to step outside her scientific commitments to evaluate them from an external utilitarian standpoint, morality attacks the very source of her motivation and identity. The utilitarian replies that morality is supreme and that deliberation must track the ultimate good; if truth-seeking leads to disaster, the deliberative method prioritizing truth is morally defective. The feature doing the work here is the collision of two impartial authorities: the epistemic authority of science versus the moral authority of utility. If you remove the feature that her project is impartial (e.g., if she wanted to publish merely for personal fame), the case collapses back into the standard integrity objection where personal partiality clashes with moral impartiality. Here, however, Williams shows that integrity protects the agent's deliberative sovereignty even when their project is universally oriented. A utilitarian defender would attack this by arguing that Aris is fetishizing truth; they would claim that vocation is subordinate to morality, and that refusing to deliberate on consequences is not integrity, but moral blindness disguised as professional duty.
