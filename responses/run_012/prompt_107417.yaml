answer: |-
  Here is a disambiguation of the claim "Developers have no right to the city," ordered from the trivial to the radical. Each entry isolates a specific reading, categorizes the claim, assesses its validity, and tests it against your specific dilemma: the conflict between existing residents (the objectors) and future residents (the tenants of the proposed flats).

  ### 1. The Right of Access (The Liberal Reading)
  *   **The Claim:** The city is a public realm. No private actor can restrict physical access to public streets, spaces, or services, nor discriminate against individuals based on class or status while in public space.
  *   **Type of Claim:** Legal entitlement / Civil right.
  *   **Status:** **Platitude.** This is largely encoded in law (public rights of way, equality acts). A gated community that blocks a public thoroughfare violates this; a gated courtyard that is private land does not.
  *   **Commitments:** Commitment to maintaining public rights of way and non-discrimination in public spaces. It does not commit the holder to opposing private development per se, only to ensuring public access is not extinguished.
  *   **Edge Carving:** Attaches to **individuals**. Requires only **presence** (you are there). It is a right to a **place** (access). It is asserted against **private owners** (trespass/blockage) and the **state** (enforcement).
  *   **The Objector Test:** **Fails to support the objection.** The proposed scheme includes an access road (presumably public or adopted). The future residents of the 240 flats have the same right of access as current residents. If this is the only reading, the objectors cannot use it to refuse the development, only to tweak the road layout.

  ### 2. The Right to Procedure (The Consultative Reading)
  *   **The Claim:** Decisions about urban change must be made by those affected by them. Developers (as external capital) have no democratic mandate to impose change without the consent of the existing community.
  *   **Type of Claim:** Claim about who ought to decide (Procedural/Democratic).
  *   **Status:** **Substantive and Defensible,** but currently partially institutionalized. Planning consultations exist to satisfy this. The claim becomes substantive when arguing that current consultation is a "box-ticking" exercise rather than genuine consent.
  *   **Commitments:** Commitment to radical participatory planning. It implies that if the community says "no," the build should not proceed, regardless of national housing targets or private property rights.
  *   **Edge Carving:** Attaches to the **collective** (the "community"). Requires **current inhabitance** (you must be there to be consulted). It is a right to a **process**. It is asserted primarily against the **state** (to enforce stricter consultation) but impacts **private owners** (by delaying/blocking profit).
  *   **The Objector Test:** **Supports the objection, but excludes future residents.** This reading empowers the people in the room (current residents) to veto the scheme. However, it implicitly defines "the city" as "the city as it currently exists and who currently lives in it." It treats the 240 future residents as abstract units of density rather than rights-holders, because they are not yet present to be consulted. It privileges the *status quo* collective over the *potential* collective.

  ### 3. The Right to Stability (The Defensive Reading)
  *   **The Claim:** Existing residents have a moral right to remain in their homes and neighbourhoods without being displaced or having their quality of life materially degraded by speculative development (e.g., loss of light, strain on infrastructure, change in character).
  *   **Type of Claim:** Moral claim / Claim to security.
  *   **Status:** **Substantive,** but in tension with housing need. It is the core of "NIMBY" arguments but grounded in a genuine human need for security and home.
  *   **Commitments:** Commitment to rent controls, security of tenure, and infrastructure-before-density policies. It commits the holder to prioritizing the welfare of current inhabitants over the expansion of the housing stock.
  *   **Edge Carving:** Attaches to **individuals/households**. Requires **tenure** (ownership or tenancy) and **time** (established residence). It is a right to a **place** (security/not being displaced). It is asserted against **private owners** (developers causing nuisance) and the **state** (for failing to protect residents).
  *   **The Objector Test:** **Supports the objection, but highlights the paradox.** This is likely what the woman in the room meant. She claims a right to her current life not be disrupted. However, this reading creates a direct conflict with the future residents. Their "right to stability" (a home) requires the build; the objectors' "right to stability" (their current view/traffic levels) requires the build to stop. This reading resolves the conflict in favour of the *present* over the *future*. It treats the city as a protected habitat for incumbents.

  ### 4. The Right to Use-Value (The Economic Reading)
  *   **The Claim:** Urban space should be produced for social need (living, community, culture) rather than for profit (exchange value). Developers, whose primary fiduciary duty is profit, have no right to prioritize exchange value over use value.
  *   **Type of Claim:** Economic / Moral claim about what a city is for.
  *   **Status:** **Radical but Co-optable.** This is the most common "serious" usage. However, note your observation: the developer's consultant used it. They argued a gated block serves a "use" (living) even if private. This reading is vulnerable to the argument that "market housing is a use."
  *   **Commitments:** Commitment to decommodifying housing. It implies opposition to the 82% private sale units in your scheme, as they are primarily investment vehicles (exchange value). It supports the 18% affordable rent (use value).
  *   **Edge Carving:** Attaches to **collectives** (society/the needy). Requires **need**. It is a claim about **form** (mixed use, non-speculative). It is asserted against **private owners** (capital) and the **state** (for enabling speculation).
  *   **The Objector Test:** **Ambivalent.** If the objectors argue the scheme is *too speculative* (9 storeys for profit, no surgery for need), this supports them. However, if the "use value" is housing for the 240 families who need homes, this reading *demands* the build proceeds. To use this slogan to stop the build, the objectors must argue that *their* use of the neighbourhood (low density, church spire views) outweighs the *future tenants'* use (shelter). This risks defining "use value" as "amenity for the wealthy" rather than "shelter for the needy."

  ### 5. The Right to Appropriation (The Sovereign Reading)
  *   **The Claim:** The inhabitants of the city are the sole legitimate sovereigns of urban space. Private property rights in land are secondary to, or illegitimate against, the collective will of the residents. Developers are merely contractors who build what residents order, not entrepreneurs who decide what is built.
  *   **Type of Claim:** Political / Ontological (Claim about ownership and sovereignty).
  *   **Status:** **Radical / Illegal.** Under current law, this is false. Private landowners *do* have rights. To assert this is to argue for a revolution in property law, not a planning objection.
  *   **Commitments:** Commitment to community land trusts, compulsory purchase at use-value prices, or the abolition of private land ownership. It commits the holder to a position where the "market" has no say, only the "community."
  *   **Edge Carving:** Attaches to the **collective** (the residents). Requires **inhabitance** (but potentially includes the homeless/excluded). It is a right to **form and process**. It is asserted against **private owners** (property rights are voided).
  *   **The Objector Test:** **Supports the objection, but demands consistency.** If the residents claim sovereignty, they must act as a government. They cannot simply say "no"; they must answer "what then?" If they veto the flats, do they provide the housing elsewhere? If they claim the right to decide the city, they assume responsibility for the city's problems (including housing shortages). Most objectors want the *power* of this claim without the *responsibility*. Furthermore, who constitutes the "collective"? If it is only current residents, this is local feudalism. If it includes the regional population needing homes, the vote might go the other way.

  ***

  ### Summary for the Next Meeting

  You asked specifically about the tension regarding the future residents. Here is the plain truth you requested:

  **The slogan, as used by the objectors to refuse the development, relies almost exclusively on Reading 2 (Procedure) and Reading 3 (Stability).**

  Both of these readings define "the city" as **the current population and the current physical environment.**

  *   **If you adopt Reading 1, 4, or 5 consistently,** you run into the problem of the 240 future tenants. They are "inhabitants of the city" (or will be). They have a right to access, a right to use-value (housing), and under Reading 5, they are part of the sovereign collective. To deny them the flats is to deny *their* right to the city.
  *   **To use the slogan to stop the build,** you must implicitly argue that the rights of **existing** residents trump the rights of **potential** residents. You are arguing that the "Right to the City" is a right to **exclusion**—a right to keep the city as it is, for those who are already here.

  **Conclusion:**
  If the woman in the room meant "Developers shouldn't profit from our need for housing" (Reading 4), she is right, but the solution is not necessarily to stop the homes, but to change *who* builds them and *at what cost*.
  If she meant "We have a right to decide what happens on our doorstep" (Reading 2/3), she is asserting a local veto that prioritizes local amenity over regional housing need.

  **The most plausible reading of the slogan in a planning objection is a claim to local sovereignty (Reading 2/3 hybrid) that treats the city as a club for existing members.** It is not a universal human right; it is a territorial claim. If you wish to use it, you must accept that you are arguing that your tenure and presence grant you a veto over others' housing. If you are not prepared to make that exclusionary claim, the slogan cannot logically be used to refuse the scheme.
