prompt: |-
  Hey, I'm a backend engineer with no philosophy training and I'm losing a design argument at work. We shipped an internal triage bot that scores incoming bug reports and drops them into a queue, and engineers are told to work the queue top-down. The score is basically the predicted revenue impact of whoever reported the bug, plus a small bump for how many other users hit the same thing. My tech lead says the bot is just arithmetic, its neutral, and that if management wants us to prioritize paying customers thats a management call, not a design call. Our designer says the bot has politics baked into it and that we should treat the scoring function like a policy document. Someone else on the team said that now that the queue exists we'll definately drift into ignoring free-tier users no matter what anyone intends, and theres nothing we can do about it. I have a vague sense that there's a whole philosophical literature on whether artifacts themselves can have politics, not just the uses people put them to, but I couldn't tell you whats in it. What are the most important implications of that view for our situation? I mostly want to know whether it gives me anything concrete to say in the design review, and whether it makes a difference that the scoring is done by a model we can't fully explain instead of a hand-written formula.

  Could you lay it out as: "Bottom line" (~80 words), "What the view actually claims, and what it doesn't" (~200 words), "The implications that matter for us, most important first" (~400 words), "What I should actually say in the design review" (~150 words).
