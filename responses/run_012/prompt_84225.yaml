  The designer is right: your bot isn't neutral math; it's encoded policy. Technology embodies power structures. Automating prioritization based on revenue hardcodes a class system into your workflow. The unexplainable model obscures accountability. You can't claim neutrality while systematically deprioritizing non-paying users. Treat the scoring function as a policy document requiring explicit review, not just engineering validation. This design locks in values hard to reverse later.

  What the view actually claims, and what it doesn't
  This view, pioneered by philosopher Langdon Winner, doesn't claim software has consciousness or intentions. It argues that technical designs often require or strongly encourage specific social relationships. A bridge built too low for buses (Winner's example) enforces class segregation without a sign saying "no poor people." Similarly, your bot isn't just calculating; it's enforcing a hierarchy where paying customers' time is valued higher than free users'. It doesn't mean management didn't make a choice, but that the *implementation* solidifies that choice into infrastructure. It claims neutrality is impossible when design choices have distributive consequences. The system isn't a passive tool; it's an active gatekeeper. Crucially, it doesn't argue technological determinism—that society is powerless against machines. Rather, it highlights that design choices are policy choices made by engineers. If you build a system that ignores free users, you aren't just reflecting management's will; you are building the mechanism that enforces it, making reversal difficult. The "politics" lies in the affordances and constraints the code imposes on human behavior. This means engineers are inadvertently legislating social order through system architecture.

  The implications that matter for us, most important first
  1. **Hardening Bias:** Your teammate is correct about drift. Once the queue exists, engineers will follow it to optimize metrics. The bot makes ignoring free users the path of least resistance. If the score dictates workflow, the score dictates justice. Over time, the organization forgets *why* free users are deprioritized; it just becomes "how we work." The artifact sustains the policy even if strategy shifts.
  2. **Accountability Obfuscation:** Your tech lead says it's a management call. But by wrapping it in a model, you diffuse responsibility. If the model is unexplainable, no one can audit *why* a free user was deprioritized beyond "the math said so." This creates a moral buffer for engineers and management alike. It allows leadership to claim they care about everyone while the system systematically neglects specific groups effectively.
  3. **Policy vs. Code:** The designer is right to call the scoring function a policy document. Changing a business rule usually requires a meeting; changing a weight in a loss function requires a commit. The latter is harder to audit. You are moving governance from the boardroom to the backend. Code becomes law, but without the legislative process. This reduces transparency for stakeholders.
  4. **The Model Problem:** Using an unexplainable model exacerbates this. A hand-written formula is transparent; you can see the revenue weight. A black box might correlate revenue with zip code or language, introducing significant hidden biases. You cannot claim neutrality while using a system whose decision logic is opaque. The "arithmetic" is not neutral if the inputs are proxies for protected classes.
  5. **The Neutrality Fallacy:** Your tech lead calls it "just arithmetic." But arithmetic requires inputs and weights. Choosing *which* variables count (revenue vs. severity) is a value judgment. By framing it as math, you shield those values from critique. The philosophy warns that claiming technical neutrality is often a political move to protect existing power structures from explicit scrutiny.
  6. **Remediation Cost:** If you decide later that free users matter more, changing culture is hard. Changing a queue algorithm is easier, but if the model is entrenched, retraining is costly. The design locks in the value system. The cost of reversing a political decision embedded in code is significantly higher than reversing a verbal directive. This creates a ratchet toward efficiency over equity.

  What I should actually say in the design review
  Don't argue philosophy; argue risk and maintainability. Say: "Treating this scoring function as pure math hides business risk. If this model systematically ignores a user segment, that's a policy decision that needs explicit sign-off, not implicit engineering implementation. We should document the scoring weights as business rules, not just hyperparameters. Also, using an unexplainable model for prioritization introduces audit risk; if we can't explain why a critical bug was ignored, we're liable. Let's treat the scoring logic as a public policy document that requires product and legal review, not just engineering approval. Finally, acknowledge the drift risk: once this ships, human judgment atrophies. We need a manual override mechanism for high-severity issues regardless of score, ensuring the tool serves us, not vice versa. This protects the company from reputational damage if a high-value free user gets stuck behind paying users."
