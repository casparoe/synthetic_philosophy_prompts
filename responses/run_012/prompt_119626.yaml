prompt: |-
  Okay, I need help untangling something, and I'd rather do it out loud with you than in my own notes. You're a philosopher who works on decision theory and the theory of cooperation — the kind of person who is comfortable with game theory but who actually cares whether the concepts hold together, not just whether the algebra goes through. Please start by brainstorming: restate the setup in your own words, then go case by case and say what you think each of my verdicts is tracking, and only then commit to a principle. Think carefully here — the obvious first pass is probably the standard answer I already know, and I want the version that survives contact with the awkward cases. No citations or reading lists, please; I don't need them and I'd rather you spend the words on the arguement.

  Here's the idea I'm working with. Two parties are in some ongoing interaction where what each gets depends on how they play and on what each of them actually wants — a split of a disputed surplus, a border arrangement, a joint venture, whatever. Call a change to that interaction a safe Pareto improvement (SPI) if it makes us better off than the status quo no matter how the interaction actually gets played out and no matter what the other side's preferences turn out to be, and doesn't leave them worse off either. The whole point is that we're not assuming the interaction settles on any particular equilibrium and not assuming we've guessed their preferences right. I'm using a rough-and-ready version of the notion, so don't fuss over whether my gloss matches the official one — but if my formulation is doing damage, say where.

  Now my gut verdicts, which don't all fit together:

  1. We don't know whether their outside option is weak or strong. We adopt a rule that guarantees us a floor either way. Verdict: yes, that's an SPI, and it's the paradigm case.

  2. Same setup, except the new arrangement leaves us a hair worse off in exactly one scenario: the one where they take some small satisfaction in our not doing well. Verdict: not an SPI. 'Safe' has to mean safe, and I don't want to start granting exemptions for preferences I happen to find distasteful, or the whole idea goes soft.

  3. The change improves our position in every scenario, but only by taking away one of their options — the one they'd have used to threaten us. Verdict: I want to say yes, that's an improvement; but if someone did it to us I'd feel we'd been wronged. This is the one I'm least sure about.

  4. A change that makes us better off in every scenario but leaves them worse off in some. Verdict: fine, it's a safe improvement, but I don't want to call it a Pareto improvement — the word has to be doing work or why is it there.

  5. A change where the list of ways the interaction might go was drawn up after we'd already seen which possibilities would break the improvement. Verdict: not an SPI. Safety has to be checked against a list that wasn't assembled with the answer in view.

  6. Here's my snag, and I'm pretty sure 3 and 4 can't both be right, since 3 also leaves them worse off in some scenarios. But the other snag is this: if the class of scenarios is something I get to specify (5 seems to say it is, as long as I do it in advance), why is it illegitimate in 2 to just leave out the spiteful scenario? Either I'm in charge of the class or I'm not.

  7. Preference change. A change that will reshape what they want, so that by their own future lights they end up worse off than before. Verdict: still an improvement — I don't want the bare possibility of adaptation vetoing everything. Reverse case: they're worse off as things stand, but they'll come to prefer the new arrangement, so by their own eventual lights they're better off. Verdict: not an improvement at all. My grad student says I'm just privileging the present and can't have both. She might be right.

  8. A coin flip that hands one side a big gain and the other a big loss, though the expected value is up for both. Verdict: not an SPI. Safety is supposed to be about each way things might go, not about averages.

  So: what principle gets all of this? If nothing does, give me the cleanest two-candidate version — one that saves more of my verdicts at the price of some complexity, one simpler that has to throw something overboard — and tell me which of my verdicts I should actually give up, and why. State the clauses precisely and tie each clause to the case that forces it, and be honest about which verdict your principle simply can't accommodate. Also tell me whether the principle should treat uncertainty about their preferences and uncertainty about how they'll play as the same kind of uncertainty, since I've been lumping them together and I'm not sure that's legitimate. Then apply your surviving principle to a case I haven't given you: a change that is safe against every scenario in the class, but that we can only get them to agree to if we let them keep believing something false about what we want. And finally, tell me which single case, if it turned out I had the opposite intuition about it, would most embarrass your principle. I definately want to know where the soft spot is.
