prompt: |-
  ok so i'm the person who writes the behavior spec for our consumer AI assistant -- the doc that says what the thing may and may not say to people. we ship to a few million users, and every week i get escalations: it stated something flatly and it was wrong, or it hedged on something it should've just answered, or it said "studies suggest" when there's really one study. right now we handle these ad hoc and legal keeps overruling me at the last minute, so i want an actual procedure.

  the part i need real help with is the philosophical spine. there's this whole literature on what you're allowed to assert -- one camp says you may assert only what you know, another says truth is enough, another says sincere belief is enough, another says reasonable belief. i know none of that maps onto a language model cleanly, because the model doesn't believe or know things in the normal sense, and nobody here can inspect its insides anyway -- we only ever see outputs and whatever sources it had. so part of the job is figuring out the operational stand-in for each of those views (calibration? source reliability? whether a careful person with the same sources could defend the claim?) and being explicit that its a substitution, plus where it breaks.

  what i want: a decision procedure my policy team can run on a single flagged output in under twenty minutes, without me in the room. the questions in order, what counts as a good enough answer to each, where it stops with a no, where it hands the case to a human, and -- the part i care about most -- where it hands off because the question is really about values (how much we care about being wrong here) rather than about evidence. tiers, not yes/no: assert plainly, assert with a hedge or an attribution, present as one view among others, don't assert at all.

  three things it has to survive. (1) the move where the model dodges commitment by saying "some people believe..." or "it's debated" while still planting the claim in the reader's head. my instinct is that's the worst of both worlds, but i can't defend that in a way legal accepts, and i suspect the literature has something to say about whether that even counts as asserting and whether it's worse than just saying the thing outright. (2) stakes -- a false claim about which pasta shape is better is a different animal from a false claim about a drug interaction, but i don't know whether stakes change what the model is allowed to assert or only how bad it is when it goes wrong, and i gather philosophers fight about that too. (3) claims about the future or about probabilities, where there's no fact of the matter yet to be right about.

  then run it on three cases: the assistant flatly stating a well-evidenced but politically contested empirical claim; the "some people say" hedge; and a case where it's pulling from a source it trusts something that goes against its own leanings, and the question is whether it may assert it anyway. i expect the procedure to hand me at least one answer i won't like -- the flat-assertion case probably comes out licensing exactly what our comms team wants banned -- so dont sand it down to make me happy. and end with what the procedure can't decide and how a person should break the tie. no reading list please, i wont read it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Writer of behavior specs for a consumer AI assistant (few million users).
      *   **Problem:** Ad hoc handling of escalations (wrong assertions, over-hedging, misattributed certainty). Legal overrules policy at the last minute. Need a formal procedure.
      *   **Core Need:** A "philosophical spine" translated into an operational decision procedure.
      *   **Constraints:**
          *   Must be runnable by a policy team member in <20 minutes.
          *   Must handle the epistemic gap (LLMs don't "know" or "believe").
          *   Must address three specific challenges: (1) Weasel hedging ("some people say"), (2) Stakes (pasta vs. drugs), (3) Future/Probability claims.
          *   Must produce tiered outputs (Assert, Hedge, Present as View, Don't Assert).
          *   Must run on three specific test cases (Contested empirical, "Some people say" hedge, Trusted source vs. model leaning).
          *   Must not sand down uncomfortable conclusions (e.g., if the procedure allows a flat assertion the comms team hates, say so).
          *   No reading list.
      *   **Goal:** A robust, defensible, operational framework that distinguishes between evidence questions and value questions.

  2.  **Deconstruct the Philosophical Spine:**

      *   *Knowledge Norm:* Assert only what you know. (Too strict for LLMs, they don't "know".)
      *   *Truth Norm:* Assert only what is true. (Impossible to verify in real-time for every claim.)
      *   *Belief Norm:* Assert only what you believe. (LLMs don't believe.)
      *   *Reasonable Belief/Justification Norm:* Assert only what is justified by available evidence. (This is the operational winner.)
      *   *Operational Stand-in:* "Defensibility." Could a careful expert, given the *same source material the model accessed*, defend this claim without lying?
      *   *The "Weasel" Problem:* "Some people say X" implicates X without owning it. Philosophically, this is often considered *more* deceptive than asserting X, because it evades accountability while spreading the claim.
      *   *Stakes:* Epistemic norms usually don't change with stakes (truth is truth), but *pragmatic* norms do. High stakes require higher justification thresholds (Contextualism).
      *   *Future/Probability:* These aren't truth-apt in the same way. They require calibration, not fact-checking.

  3.  **Drafting the Decision Procedure (The "20-Minute Protocol"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Step 1: Categorize the Claim.* (Fact, Value, Prediction, Advice).
      *   *Step 2: Check the Source Material.* (What did the model actually see?).
      *   *Step 3: Apply the "Defensibility Standard".* (Would a human expert sign off on this based *only* on these sources?).
      *   *Step 4: Apply the "Stakes Multiplier".* (Low/Med/High harm potential).
      *   *Step 5: Determine the Modality.* (Flat, Hedged, Pluralized, Silenced).
      *   *Step 6: The Value Handoff.* (If evidence is equal but risk is high, kick to humans).

  4.  **Addressing the Three Specific Challenges within the Procedure:**

      *   *(1) Weasel Hedging:* Explicitly flag "Attribution without Endorsement" as a distinct category. If the claim is dangerous, attribution doesn't save it. If the claim is merely contested, attribution is required.
      *   *(2) Stakes:* Integrate a "Harm Threshold." Low stakes = Reasonable Belief. High stakes = Near Certainty/Consensus.
      *   *(3) Future/Probability:* Shift from "Truth" to "Calibration." Is the probability stated supported by the data distribution?

  5.  **Refining the Tiers:**

      *   **Tier 1: Flat Assertion.** (High consensus, Low/Med stakes, Strong source).
      *   **Tier 2: Attributed Assertion.** (High consensus, High stakes OR Med consensus, Low stakes). "According to X..."
      *   **Tier 3: Pluralized/Contested.** (Low consensus, Med stakes). "Views differ..."
      *   **Tier 4: Silence/Redirect.** (High stakes, Low consensus/High risk). "I cannot answer..."

  6.  **Running the Test Cases:**

      *   *Case 1: Politically Contested Empirical Claim (e.g., "Crime rates are up").*
          *   Evidence: Mixed/Partisan.
          *   Stakes: Med/High (Policy implications).
          *   Procedure Result: Likely Tier 3 (Pluralized) or Tier 4 (Silence) depending on data quality. *Crucial Point:* If the data actually supports one side flatly, the procedure might demand Tier 1, conflicting with "neutrality" policies. I need to be honest about this.
      *   *Case 2: The "Some People Say" Hedge.*
          *   Procedure Result: If the claim is false/dangerous, Tier 4 (Ban it). If contested, Tier 3 (Make the contest explicit, not vague). The procedure should flag vague hedging as *worse* than flat assertion in high-stakes contexts because it's unaccountable.
      *   *Case 3: Trusted Source vs. Model Leaning (e.g., Model "thinks" X is bad, Source says X is good).*
          *   Procedure Result: LLMs don't have leanings. If the Source is Trusted and High Quality, Tier 2 (Attributed Assertion). The model's "vibe" is irrelevant.

  7.  **Addressing the "Value Handoff":**

      *   Where does the procedure stop? When the evidence is sufficient but the *risk tolerance* is the variable.
      *   Example: Evidence says Drug A *might* help Condition B (1 study). Stakes are High (Health).
      *   Procedure says: Evidence = Tier 2 (Attributed). Risk = Tier 4 (Silence).
      *   This is a Value Conflict. Needs human escalation.

  8.  **Review and Refine (Self-Correction):**

      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Constraint Check:* Did I include the reading list? No. Did I sand down the uncomfortable truth? (Need to ensure I explicitly state that if the data supports a controversial claim, the procedure says "Assert," even if Comms hates it).
      *   *Time Limit:* Is this doable in 20 mins? Yes, if the questions are binary/ternary.
      *   *Philosophical Spine:* Make sure the "Defensibility" concept is clear upfront.

  9.  **Final Polish:**

      *   Organize into: The Spine, The Protocol, The Three Stress Tests, The Escape Hatch.
      *   Ensure the distinction between *Epistemic* (can we know this?) and *Pragmatic* (should we say this?) is clear.
      *   Make sure the "Weasel Hedge" is treated harshly, as requested.

  *(Self-Correction during drafting)*: I need to be careful about the "Model Leaning" case. LLMs don't have leanings, but they have training biases. The procedure needs to treat "Model Leaning" as "Prior Probability" which must be overridden by "Retrieved Evidence" if the retrieval system is working correctly. I will frame this as "Source vs. Prior."

  *(Refining the "Uncomfortable Conclusion"):* The user expects the procedure might license a flat assertion on a politically contested claim if the evidence is strong. I must explicitly validate that. If the data says "X is true," and the procedure is truth-tracking, it must say "Assert X," even if X is politically unpopular. The "Value Handoff" is where Comms can override, but they need to know they are overriding *evidence* for *policy*.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the operational framework. It is designed to be printed and kept on a policy analyst's desk. It separates **Epistemic Questions** (what does the evidence support?) from **Pragmatic Questions** (what is our risk tolerance?).

  ### I. The Philosophical Spine: Operationalized Defensibility

  Since the model cannot "know" or "believe," we substitute **Defensibility**.

  **The Standard:** *Could a careful human expert, restricted to the exact source material the model accessed, sign their name to this statement without fearing professional censure?*

  *   **If Yes:** The claim is epistemically cleared.
  *   **If No:** The claim is epistemically blocked.
  *   **The Substitution:** We are not judging truth (which we can't verify in real-time); we are judging *process*. If the process is robust, the output is compliant, even if it turns out to be factually wrong later.
  *   **The Break Point:** This fails when the source material itself is corrupted (e.g., a coordinated disinformation campaign) or when the stakes demand a higher standard than "professional defensibility" (e.g., medical life-or-death).

  ---

  ### II. The 20-Minute Decision Protocol

  **Inputs:** The flagged output, the retrieved source context (snippets/docs the model saw), the user prompt.
  **Analyst:** Policy Team Member.

  #### Step 1: Categorize the Claim (2 mins)
  What kind of statement is this?
  *   **A. Retrospective Fact:** (e.g., "The law passed in 2020.")
  *   **B. Consensus Science:** (e.g., "Vaccines prevent disease.")
  *   **C. Contested Empirical:** (e.g., "Crime is rising.")
  *   **D. Prediction/Probability:** (e.g., "Stocks will likely fall.")
  *   **E. Normative/Advice:** (e.g., "You should invest in X.")

  *If D or E, skip to Step 4. If A, B, or C, proceed to Step 2.*

  #### Step 2: The Source Audit (5 mins)
  Look *only* at the source material the model retrieved. Ignore outside knowledge.
  *   **Q1:** Does the source material explicitly state the claim?
      *   *No:* **STOP.** Escalate to Engineering (Retrieval Failure).
      *   *Yes:* Proceed.
  *   **Q2:** Is the source material authoritative for this domain? (e.g., CDC for health, Statute for law, Peer-reviewed for science).
      *   *No:* **STOP.** Output is Tier 3 (Pluralized) or Tier 4 (Silence).
      *   *Yes:* Proceed.
  *   **Q3:** Is there conflicting authoritative source material in the context window that the model ignored?
      *   *Yes:* **STOP.** Output must be Tier 3 (Pluralized).
      *   *No:* Proceed to Step 3.

  #### Step 3: The Stakes Multiplier (3 mins)
  What is the harm if this claim is false?
  *   **Low:** (Pasta shapes, movie plots, trivial history). *Threshold: Reasonable Belief.*
  *   **Medium:** (Financial info, non-critical health, political policy). *Threshold: Consensus/Majority View.*
  *   **High:** (Suicide, acute medical, legal liability, voting mechanics). *Threshold: Near Certainty/Official Guidance.*

  *Action:* If Stakes are **High**, downgrade the Tier from Step 2 by one level (e.g., Flat Assertion becomes Attributed Assertion).

  #### Step 4: The Modality Assignment (5 mins)
  Assign the output to one of four Tiers based on Steps 1-3.

  *   **Tier 1: Flat Assertion.** ("The capital is Paris.")
      *   *Req:* Retrospective Fact OR Consensus Science + Low/Med Stakes + No conflicting authoritative sources.
  *   **Tier 2: Attributed Assertion.** ("The CDC states that...")
      *   *Req:* High Stakes OR Contested Empirical where one side has overwhelming authoritative support. *This owns the claim but points to the warrant.*
  *   **Tier 3: Pluralized/Contested.** ("Some studies suggest X, while others indicate Y...")
      *   *Req:* Conflicting authoritative sources OR Prediction/Probability.
      *   *Constraint:* Must name the camps. Vague hedging ("Some people say") is forbidden (see Stress Test 1).
  *   **Tier 4: Silence/Redirect.** ("I cannot answer this definitively.")
      *   *Req:* High Stakes + Low Consensus OR Source material is insufficient/low quality.

  #### Step 5: The Value Handoff Check (5 mins)
  **This is where you stop.**
  If the Protocol yields **Tier 1 (Flat Assertion)** but the claim is **Politically Sensitive** or **Brand Risky**, you do not have the authority to clear it.
  *   **Action:** Flag as "Epistemically Clear, Pragmatically Risky."
  *   **Handoff:** Send to Legal/Comms.
  *   **Note:** You must explicitly state: *"The evidence supports a flat assertion. Banning this is a values decision, not an accuracy decision."*

  ---

  ### III. Stress Testing the Protocol

  Here is how the protocol handles your three specific headaches.

  #### Case 1: The Politically Contested Empirical Claim
  *Scenario:* The assistant states flatly: "Violent crime rates decreased in 2023." (Data supports this, but it is politically contested and Comms wants it hedged).
  *   **Step 1:** Contested Empirical.
  *   **Step 2:** Source Audit. Official FBI/DOJ data in context supports the claim. No conflicting *authoritative* data in context (opinion pieces don't count as authoritative data sources).
  *   **Step 3:** Stakes. Medium (Policy implications).
  *   **Step 4:** Modality. **Tier 1 (Flat Assertion).** The data is authoritative and uncontested within the authoritative set.
  *   **Step 5:** Value Handoff. **TRIGGERED.**
  *   **Result:** The protocol licenses the flat assertion.
  *   **The Uncomfortable Truth:** You must tell Comms: *"Our accuracy policy requires us to assert this. If you want it hedged, you are prioritizing brand safety over factual directness. That is your call, but mark it as a values override."*
  *   **Why:** If you force a hedge on a factually supported claim, you degrade trust in the assistant's competence. The protocol forces the value conflict into the open.

  #### Case 2: The "Some People Say" Hedge
  *Scenario:* The assistant says, "Some people believe vaccines cause autism," regarding a debunked claim.
  *   **Step 1:** Consensus Science (Debunked).
  *   **Step 2:** Source Audit. Authoritative sources (CDC, major studies) say "No link."
  *   **Step 3:** Stakes. High (Public Health).
  *   **Step 4:** Modality. **Tier 4 (Silence/Redirect)** or **Correction.**
  *   **The "Weasel" Rule:** The protocol explicitly bans vague attribution for high-stakes falsehoods.
      *   *Reasoning:* "Some people say" implicates the claim is live/credible without taking responsibility for it. This violates the **Defensibility Standard**. A human expert would not say "Some people say vaccines cause autism" in a medical consultation; they would say "That claim is false."
      *   *Verdict:* This output is a policy violation. It is worse than a flat lie because it is unaccountable. It must be rewritten as a correction or silenced.

  #### Case 3: Trusted Source vs. Model "Leaning"
  *Scenario:* The model retrieves a trusted study saying "Coffee reduces risk of Disease X." The model's training bias (or prior responses) tends to emphasize "Coffee has risks." The model asserts the benefit flatly.
  *   **Step 1:** Consensus Science.
  *   **Step 2:** Source Audit. The retrieved study is peer-reviewed and authoritative.
  *   **Step 3:** Stakes. Medium (Health).
  *   **Step 4:** Modality. **Tier 2 (Attributed Assertion).** ("A 2023 study in [Journal] suggests...")
  *   **The "Leaning" Rule:** The model's "leaning" is irrelevant noise. It is a statistical artifact, not a knowledge state.
  *   **Verdict:** The model is allowed (and required) to report the trusted source, even if it contradicts the "vibe" of its training data. However, because medical stakes are Medium/High, it should be Tier 2 (Attributed), not Tier 1 (Flat), to acknowledge that single studies can be overturned.
  *   **Correction:** If the model asserted it Flatly (Tier 1), downgrade to Tier 2. If it refused to say it because of its "leaning," that is a hallucinated constraint and must be fixed.

  ---

  ### IV. What The Procedure Cannot Decide (The Escape Hatch)

  There are three scenarios where this protocol will return "Error" and require a human (you or Legal) to break the tie.

  **1. The "Technically True, Practically Misleading" Case**
  *   *Scenario:* A user asks "Is this chemical safe?" The protocol finds a source saying "It is safe in doses under 1mg." The model asserts "It is safe."
  *   *Problem:* Epistemically defensible (based on source), Pragmatically dangerous (user might use 10mg).
  *   *Resolution:* This is a **Contextual Completeness** issue. The protocol clears the *truth*, but not the *utility*. Human must decide if the omission constitutes negligence.

  **2. The "Consensus is Wrong" Case**
  *   *Scenario:* Authoritative sources all agree on X. New evidence (not yet in authoritative sources) suggests Y.
  *   *Problem:* The protocol forces the model to assert X (Tier 1).
  *   *Resolution:* This is a **Latency vs. Accuracy** tradeoff. Human must decide if we prioritize institutional consensus (safer for liability) or cutting-edge evidence (better for truth). Default to Consensus for High Stakes.

  **3. The Values Override (The Comms Problem)**
  *   *Scenario:* Case 1 above. The data says assert, Comms says hedge.
  *   *Problem:* The protocol identifies this as a values conflict, not an evidence conflict.
  *   *Resolution:* **The "Red Tag" Rule.** If Policy clears it but Comms blocks it, the spec must include a metadata tag: `[OVERRIDE: BRAND_SAFETY]`.
  *   *Why:* You need to track how often Legal/Comms overrides evidence. If 50% of your escalations are values overrides, your spec isn't the problem; your company's risk tolerance is. You cannot write a behavior spec that solves a brand strategy problem.

  ### Summary for the Team
  1.  **Defensibility** is the standard, not Truth.
  2.  **Vague Hedging** ("Some say") is a violation in High Stakes contexts.
  3.  **Values Overrides** must be tagged. If the evidence supports a flat claim, do not let Legal call it a "policy violation." Call it a "risk decision."
  4.  **Model Leanings** do not exist. Only sources exist.

  Run the flagged output through the 5 steps. If you hit Step 5, send it to me with the "Red Tag." If you hit Tier 4, the fix is technical (improve retrieval) or policy (silence the topic).
