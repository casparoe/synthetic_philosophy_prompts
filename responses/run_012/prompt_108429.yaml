      *   *Update Rule 2 (Soft Evidence):* Introduce a likelihood term or factor node representing the constraint, run Belief Propagation (BP) or Variational Message Passing (VMP).
      *   *The "Counterintuitive Result":* In PGM terms, this looks like "d-separation" or "blocking" behavior that violates intuition about dependency. Specifically, the KL projection often preserves the marginal $P(\neg A)$ exactly. In a graphical model, if we constrain a CPT entry, why does the marginal probability of the parent node remain fixed? It looks like the constraint is "local" but the inference treats it as strictly modular in a way that ignores global coupling.

