      *   *Problem:* Standard Bayesian conditioning requires learning $E$ such that $P_{new}(\cdot) = P_{old}(\cdot | E)$. Here, we learn a constraint on the distribution, not an event $E$.
      *   *Proposed Solution 1 (Van Fraassen/ML-style):* Minimize $KL(P_{new} || P_{old})$ subject to $P_{new}(B|A) = q$ and normalization.
      *   *Counterintuitive Result:* In the Judy Benjamin case (specifically the "three armies" or specific quadrant setup), minimizing KL often leaves the probability of the *complement* of $A$ unchanged ($P_{new}(\neg A) = P_{old}(\neg A)$), even though learning about $A$'s internal structure might intuitively shift mass away from or towards $A$ globally. Or, more specifically, it implies that learning "If A then likely B" makes A *less* likely if B is generally unlikely, or leaves $\neg A$ strictly invariant in a way that feels like ignoring the relevance of the constraint.
      *   *Proposed Solution 2 (Jeffrey Conditioning / Generalized Conditioning):* Treat the conditional as soft evidence on the partition.
      *   *Proposed Solution 3 (Desire/Utility based):* Some argue the update depends on *why* you learned it (not purely epistemic).

  3.  **Translate to MLE/PGM/VI Vocabulary:**
      *   *Agent:* Inference engine / Variational posterior approximator.
      *   *Prior:* $P_{\theta}(\mathbf{z})$ (joint distribution over latent variables).
      *   *Information:* A hard constraint on a conditional factor: $Q(z_B | z_A) = \mathcal{C}$.
