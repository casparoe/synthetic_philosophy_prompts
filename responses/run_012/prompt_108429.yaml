prompt: |-
  I am a machine learning engineer who works with probabilistic graphical models and variational inference. I am comfortable with KL divergence, ELBO, constraints on conditional distributions, message passing, and the difference between learning a fact and learning a constraint on a conditional. I have been reading about a family of problems in formal epistemology that are usually grouped under "updating on conditionals" or "probability kinematics," with the Judy Benjamin case as the standard test case. The setup, as I understand it, is something like this: an agent has a joint distribution over a few discrete variables (for example, which quadrant she is in and whether she is on a road), and she receives information that is not a proposition with probability 1 but a constraint on a conditional probability -- for instance, she learns that the conditional probability of being on the road given that she is in the second quadrant is some value, or she learns a conditional of the form "if A then B" without learning A or B outright. The standard Bayesian rule of conditionalization does not apply directly, so people have proposed alternatives: updating by minimizing the KL divergence between the old and new distributions subject to the constraint, updating by a rule that treats the conditional as a kind of soft evidence, and other schemes. The Judy Benjamin case is supposed to show that the KL-minimization method gives counterintuitive results, and there is a long-running debate about which rule is correct.

  Please restate this debate in the vocabulary I actually use. Treat the agent as an inference procedure over a graphical model, the new information as a constraint on a conditional distribution, and the candidate updating rules as different optimization problems or message-passing schemes. Be as faithful as you can: for each philosophical position or proposed rule, say what it looks like in my vocabulary, what the analogue of the "counterintuitive result" is, and what the disagreement is actually about -- a different objective function, a different constraint, a different notion of what counts as the information, or something else. Then give me the residue report: which parts of the philosophical debate translate cleanly into the language of graphical models and variational inference, which parts translate only with distortion, and which parts have no counterpart at all. For the parts that do not translate, tell me whether you think that is because my vocabulary is missing something important or because the philosophical debate is trading on a distinction that is less substantive than it looks.

  I want a verdict, not a survey: at the end, say which of the candidate rules or positions you think is most defensible when translated into my terms, and say what would change your mind -- which argument, formal result, or consideration would lead you to a different verdict, and where your reasoning is most likely to fail. Do not give me a reading list or citations; I want the argument and the translation.
