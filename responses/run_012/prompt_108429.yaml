      *   *The "Judy Benjamin" Effect in VI:* When you solve this Lagrangian, the solution typically scales the rows of the conditional table. For the row $x^*$, it adjusts to match $v$. For rows $x \neq x^*$, it leaves $Q(y|x)$ unchanged. Crucially, the marginal $Q(x)$ often remains $P(x)$.
      *   *Why is this weird?* In a neural net or PGM, if I tell you the output distribution given input $x^*$ has changed, you might expect the prior over inputs $P(x)$ to shift (e.g., if the new conditional makes $x^*$ "more distinctive" or "less likely" in the joint context). But KL minimization says: "Change only what you were told to change, preserve everything else (independence structure) as much as possible."
