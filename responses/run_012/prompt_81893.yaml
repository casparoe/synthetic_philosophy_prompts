answer: |-
  Right, let's have a proper look at this. You and your mate have essentially stumbled into one of the classic rows in twentieth-century philosophy. He's arguing for a kind of infinite regress or coherentism (everything hangs on everything else), and you're arguing for something that sounds like foundationalism (there's a bottom layer). But the specific idea you're reaching for — the "hinge" — comes from Ludwig Wittgenstein's last notes, published as *On Certainty*.

  The reason you're struggling to feel the force of it is that it's counter-intuitive. We want to say, "I'm certain I have hands because I can see them." Wittgenstein says: no, that's backwards. You can only use your eyes to check things *because* you already take for granted that you have hands and that the world is stable.

  Here is the breakdown of what makes these hinges special, why they aren't just dogmatic beliefs, and what happens when the bedrock moves.

  ### 1. Confidence vs. Logical Role
  Your mate thinks you're just describing beliefs you hold very strongly. That's the common misunderstanding. It isn't about the *strength* of your conviction; it's about the *job* the proposition does.

  Think of a door. For the door to swing, it needs hinges. The hinge stays fixed so the door can move. If the hinge moves, the door falls off.
  *   **Ordinary Belief:** "It is raining outside." I can check this. I can be wrong. I can have evidence for it.
  *   **Hinge Certainty:** "The world existed before I was born."

  If you treat "The world existed before I was born" as an ordinary belief, you have to ask: "What evidence do you have?" But any evidence you produce (fossils, memories, history books) *already assumes* the world existed before you were born. You're using the hinge to prove the hinge.

  So, what's special about them is that they are **groundless**. They aren't supported by evidence; they are the framework that allows evidence to count as evidence. If you doubt them, you don't get a deeper truth; you just lose the ability to make sense of anything. As Wittgenstein puts it, if you tried to doubt everything, you wouldn't get as far as doubting anything.

  ### 2. Rules vs. Claims (The "Truth" Bit)
  This is the bit that feels weird. You said people tell you these are like rules, not claims that are true or false. Here's the force of that.

  A claim (a proposition) describes the world. It can be true or false. "The cat is on the mat."
  A rule tells you how to play the game. "The bishop moves diagonally."

  Asking if the bishop's move is "true" is a category mistake. It's not true; it's the rule that lets you play chess. Wittgenstein suggests hinge certainties function like rules. When you say, "I have two hands," you aren't really describing your body; you are laying down a rule for your interactions with the world. You are saying, "In this language game, we do not doubt the existence of hands."

  If you treat it as a fact, you open the door to your mate's scepticism ("How do you *know*?"). If you treat it as a rule, the question "How do you know?" becomes nonsensical. You don't "know" the rules of chess; you just follow them to play the game.

  ### 3. The Awkward Part: Is it just Brute Dogmatism?
  This is the sharpest objection. If these hinges aren't backed by evidence, isn't that just intellectual laziness? Isn't it saying, "I believe this because I say so"?

  The defence against this is that hinges aren't **chosen**. Dogmatism is a stance you take despite evidence. A hinge is a condition of your existence. You don't decide to act as though the world is real; you just *do*. It's animal, not intellectual.

  Wittgenstein calls this a "form of life." It's not that we are stubbornly refusing to doubt; it's that doubting requires a context, and the hinge provides the context. It's not a brute foundation in the sense of a solid rock we found; it's more like the riverbed. The water (our thoughts and doubts) flows over it. We don't hold the riverbed in place; it just holds itself there by the weight of how we live.

  So, it avoids dogmatism because it admits it isn't "knowledge." Knowledge implies the possibility of doubt. Hinges are beyond knowledge and doubt. They are the scaffolding.

  ### 4. When the Bedrock Shifts
  Now, the tricky historical bit. You asked what happens when a hinge stops being a hinge. Can it be wrong?

  Hinges are not eternal. They are historical.
  *   **Example:** For centuries, "The earth is stationary" was a hinge certainty. It wasn't a hypothesis; it was the background against which all motion was measured.
  *   **The Shift:** When Copernicus and Galileo came along, they didn't just provide new evidence. They helped shift the riverbed. "The earth moves" became a new hinge.

  Did the old hinge turn out to be "false"? In a way, yes, but not in the standard sense. It became **unusable**. It stopped doing the job of holding the system together.

  This is where your mate might pounce: "Aha! So it *was* a belief, and it *was* false!"
  The reply is: When it was a hinge, it wasn't functioning as a belief subject to truth tests. It was the yardstick by which things were measured. When the yardstick itself bends, you don't say the measurements were "false"; you say you need a new yardstick.

  So, a hinge doesn't turn out to be wrong like a weather forecast turns out wrong. It gets discarded like an old map when the terrain changes. It loses its status as a hinge.

  ### The Verdict on Your Argument
  Your mate is right that you can *utter* doubts about anything. You can say, "Maybe the world started five minutes ago." But Wittgenstein's point is that this doubt has no **cash value**. It doesn't change how you act, how you investigate, or how you live. A doubt without a consequence isn't a real doubt; it's just noise.

  You are right that there is a bottom, but you need to be careful not to call it "knowledge." It's certainty without knowledge. It's the thing that lets you know other stuff.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:** I am about **85% confident** in this explanation.

  **The Bit I'm Least Sure About:** The precise status of "truth" regarding shifting hinges. There is a genuine tension in Wittgenstein scholarship between whether hinge propositions are *non-truth-apt* (they literally can't be true or false, like commands) or whether they are *empirical propositions that have hardened* into rules.

  I have leaned towards the "non-truth-apt" interpretation (the rule view) because it best answers your worry about dogmatism. However, some philosophers argue that hinges *are* true, just in a different way. If your mate is a stickler for bivalent logic (everything must be true or false), he will reject the "rule" analogy as a get-out clause. That is the weakest point in the defence, because it requires changing the rules of logic to make sense of the philosophy, which feels like cheating to some people.
