answer: |-
  You have put your finger on one of the most uncomfortable joints in the epistemology of mathematics and computer science. You are correct: there is no single, universally agreed-upon word for this specific inference, because it sits in a blind spot between logic, probability, and pragmatics.

  The inference you are describing is the move from **"We have not found a contradiction within resource bounds $R$"** to **"The system is likely consistent."**

  Here is the carving you asked for: the existing concepts that border it, the distinction between when it is respectable and when it is fallacious, and a coined term for the specific phenomenon you've identified.

  ### 1. The Nearest Established Ideas

  There are three existing concepts that circle this idea, but none capture the specific "proof length" worry you have.

  *   **Corroboration (Karl Popper):** In philosophy of science, a theory is never "verified," only "corroborated." It survives attempts at falsification. The mathematicians relying on "no contradictions found in 100 years" are treating ZFC (Zermelo–Fraenkel set theory) like a scientific theory rather than a logical system. They are claiming high corroboration, not truth.
  *   **Bounded Model Checking (Computer Science):** In software verification, we check if a system satisfies a property for all execution paths up to length $k$. If no bug is found, we say the system is "bug-free up to depth $k$." Engineers know this is not a proof of total correctness, but it is often "good enough." The math community is effectively doing **Bounded Consistency Checking** on arithmetic.
  *   **The Argument from Ignorance (*Argumentum ad Ignorantiam*):** This is the logical fallacy version: "It hasn't been proven false, therefore it is true." Your intuition is that the mathematicians are committing a sophisticated version of this fallacy, dressed up in complexity theory.

  ### 2. The Carving: When is this Inference Respectable?

  The inference is not binary; it slides on a spectrum based on the **density of counterexamples**.

  **Case A: Respectable (The "Dense Failure" Zone)**
  *   **Context:** Cryptography, Engineering, Physics.
  *   **Why:** In these domains, if a system were fundamentally broken, we expect the "contradictions" (breaks, crashes, anomalies) to be *dense* in the search space. If RSA were easily factorable, we wouldn't need a proof of length $10^{100}$; we'd find a shortcut. If a bridge is unstable, it falls down under moderate load, not just under a load that requires a trillion symbols to calculate.
  *   **Verdict:** Here, "no failure found" is strong evidence because failures are expected to be **computationally accessible**.

  **Case B: Question-Begging (The "Sparse Failure" Zone)**
  *   **Context:** Foundational Arithmetic, Logic.
  *   **Why:** As you noted, the search space of proofs is infinite. A contradiction could be "hidden" behind a horizon of complexity that human civilization cannot reach before the heat death of the universe. This is supported by **Parikh's Theorem**, which shows that a theory can prove "there exists a number $n$ with property $P$," yet $n$ is so large that no physical representation of it can exist in our universe.
  *   **Verdict:** Here, "no failure found" is weak evidence because failures might be **computationally inaccessible**. Treating this as proof of consistency is a category error: it treats a *necessary truth* (logic) as a *contingent hypothesis* (science).

  **Case C: The Middle Ground (Empirical Mathematics)**
  *   **Context:** Conjectures like Goldbach or Riemann.
  *   **Why:** Checking the first $10^{13}$ cases doesn't prove the conjecture. However, number theorists often assign "probabilities" to conjectures being true based on this data. This is **Probabilistic Heuristics**. It is respectable as a guide for *where to invest research time*, but not as a claim of *truth*.

  ### 3. Coining the Term: "The Argument from Feasible Silence"

  Since no existing term captures the specific tension between *logical possibility* and *physical feasibility of proof*, I propose we call this inference **The Argument from Feasible Silence**.

  **Definition:**
  > The inference that a system is consistent (or a proposition true) based on the absence of counterexamples within the **feasible proof horizon**, ignoring the possibility that valid counterexamples exist beyond the computational or cognitive capacity of the observer.

  **The Edges of the Concept:**

  1.  **The Feasibility Horizon:** This is the maximum length/complexity of a proof or search that can be physically instantiated by the observer (human or computer).
  2.  **The Mute Dog Condition:** The inference is only valid if we have independent reason to believe that *if* a contradiction existed, it would lie *within* the Feasibility Horizon. (Referencing Sherlock Holmes: the dog didn't bark *because* the intruder was known to the dog. If the dog was mute, the silence proves nothing.)
  3.  **The Asymptotic Trap:** The danger arises when confidence approaches 100% as search effort increases, while the actual probability of consistency remains undefined. You can have infinite confidence with zero logical gain.

  ### 4. Why This Bugs You (And Why It Should)

  Your intuition is backed by **Chaitin's Incompleteness Theorem**. Gregory Chaitin showed that for any formal system, there is a constant $L$ such that no specific string of complexity greater than $L$ can be proven to be random within that system.

  Translated to your worry: There is a limit to the complexity of contradictions we can *detect*. If the "bug" in arithmetic requires a proof more complex than $L$, the system will appear consistent forever, even if it is not.

  When mathematicians say, "It's been 100 years, we'd have found it," they are implicitly assuming that **mathematical truth is not cryptographically secure.** They are assuming that if arithmetic were inconsistent, the inconsistency would be "easy" to find.

  That is a metaphysical assumption, not a mathematical one. It is a bet on the elegance of the universe.

  ### Summary

  *   **The Inference:** **The Argument from Feasible Silence.**
  *   **Respectable When:** The domain is contingent (engineering/crypto) and failures are expected to be dense/accessible.
  *   **Question-Begging When:** The domain is necessary (foundational math) and the search space is unbounded, making the "silence" potentially just a lack of reach.
  *   **The Philosophical Cost:** It conflates **Empirical Consistency** (no bugs found *yet*) with **Logical Consistency** (no bugs exist *ever*).

  You are right to be bothered. It is a pragmatic wager masquerading as epistemic security. They are betting that the universe is not malicious enough to hide a contradiction just out of our reach. That might be a good bet, but it is not a proof.
