answer: |-
  ### Examination Question

  **Question 1 (40 Marks)**

  Political theorists often note a transatlantic divergence in the meaning of 'liberal': in the United States, the term typically denotes a left-of-centre, social-democratic position, whereas in continental Europe, it picks out a market-oriented, limited-government stance. Analyze the conceptual coherence of this divergence by determining whether it represents one word with two senses, two words that merely look alike, or a single inherited label that different political coalitions have captured at different times. In your analysis, evaluate the scenario in which an American who calls herself a liberal and a German who calls himself a liberal each assert that 'liberalism is under threat': are they saying the same thing, are they contradicting one another, and is the shared word doing any work at all or is it a historical accident? You must accommodate three awkward items: the Australian Liberal Party, which sits on the centre-right; the German Free Democratic Party, which is liberal in the market sense; and the asymmetry by which 'neoliberal' circulates in European and Latin American political speech almost exclusively as an accusation, while 'liberal' in American political speech functions as an epithet far more often than as a banner. Finally, state whether the term's career in international relations theory, where 'liberalism' names a research programme about cooperation and institutions rather than a domestic political family, is a fourth sense, a mere homonym, or evidence that the whole question is badly posed.

  ***

  ### Model Answer

  1. The divergence is best understood as a contested concept rather than a homonym, where the core value of individual autonomy remains constant while policy prescriptions invert due to differing historical antagonists.
  2. When an American and a German liberal claim liberalism is threatened, they contradict one another on economic policy but agree on the structural necessity of protecting civil liberties against authoritarian encroachment.
  3. The Australian Liberal Party, German FDP, and the pejorative 'neoliberal' demonstrate that the label is a floating signifier captured by coalitions to claim legitimacy, rendering 'neoliberal' an attack on market-capture rather than a distinct doctrine.
  4. International Relations liberalism is not a fourth sense or mere homonym, but an analogical extension of domestic rule-of-law and institutional cooperation applied to the interstate sphere.
  5. Therefore, the question is not badly posed, as the term retains coherence through a shared commitment to limiting arbitrary power, even if specific policy manifestations are mutually exclusive.

  ***

  ### Marking Scheme

  **Total Marks: 40**

  **Point 1: Nature of the Divergence (8 Marks)**
  *   **Allocation:** 8 marks.
  *   **Error costing marks:** Treating the US/Continental split as a mere linguistic accident (homonym) or describing the policy differences without categorizing the conceptual relationship.
  *   **First-class move:** Identifying the structure as a 'contested concept' (or equivalent) where a shared normative core (autonomy/liberty) generates opposing policies depending on the local historical enemy (state power vs. market power).

  **Point 2: The 'Under Threat' Scenario (8 Marks)**
  *   **Allocation:** 8 marks.
  *   **Error costing marks:** Asserting they mean exactly the same thing or that they are talking past each other entirely with no overlap.
  *   **First-class move:** Distinguishing between *policy contradiction* (spending/regulation) and *structural agreement* (defense of open society/pluralism against illiberalism).

  **Point 3: The Awkward Items (Australia, FDP, Neoliberal) (8 Marks)**
  *   **Allocation:** 8 marks.
  *   **Error costing marks:** Cataloguing the parties' positions without explaining *why* they use the label, or treating 'neoliberal' as a coherent self-identification rather than an accusation.
  *   **First-class move:** Analyzing the label as a 'floating signifier' or resource for legitimacy, noting that 'neoliberal' functions as a critique of the *economic capture* of the liberal tradition rather than a separate ideology.

  **Point 4: International Relations Theory (8 Marks)**
  *   **Allocation:** 8 marks.
  *   **Error costing marks:** Dismissing IR liberalism as irrelevant to the definition or classifying it as a completely unrelated homonym.
  *   **First-class move:** Demonstrating the logical link between domestic constitutionalism/institutionalism and the IR focus on international law and cooperation (domestic analogy).

  **Point 5: Final Verdict on Coherence (8 Marks)**
  *   **Allocation:** 8 marks.
  *   **Error costing marks:** Concluding that the term is useless, irredeemably confused, or that the question is indeed badly posed.
  *   **First-class move:** Salvaging conceptual coherence by identifying a higher-order abstraction (e.g., 'limitation of arbitrary power' or 'consent') that unifies the divergent policy wings despite their mutual exclusivity.
