answer: |-
  You've described the obfuscation problem precisely, and it's the main reason we moved from simple debate trees to protocols with explicit cross-examination and commitment phases. The mechanism isn't you checking all twelve steps; it's the honest model pointing to step seven and saying, "This does not follow from six, nor does it imply eight, relative to the original claim." Now the dispute is localized. The dishonest model must defend that specific inference. If they expand, they aren't generating volume to hide; they are exposing the logic to scrutiny. A lie requires more consistency than the truth. If they expand step seven into a sub-debate, the honest model can find a contradiction within *that* expansion much faster than you can read the whole chain. You aren't auditing the whole path; you're auditing the *break*.

  Regarding trust in summaries: you don't trust the summary blindly. You trust the *challenge*. The expansion only happens *if challenged*. The threat of expansion enforces honesty in the summary. If the dishonest model summarizes step seven ambiguously, the honest model calls for expansion on that ambiguity specifically. The dishonest model then faces a dilemma: expand and risk exposing the irrelevance, or refuse and concede the point. The asymmetry you fear—that volume beats clarity—only holds if the judge tries to verify the whole chain. In our protocol, the judge only verifies the *disputed link*, and the honest model's job is to ensure that link is the only thing you need to look at. Does your group's setup allow the honest debater to directly quote and challenge specific sentences from the opponent's transcript, or are they forced to write independent statements?
