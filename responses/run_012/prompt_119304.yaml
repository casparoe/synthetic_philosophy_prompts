  8.  **Review and Formatting:**
      *   Check constraints: Numbered list for agreements. Table for disagreements. Two test cases with predictions. Explicit on second-order boundaries.
      *   Tone check: Needs to sound like a joint statement. "We, the undersigned..."

  9.  **Self-Correction/Nuance during drafting:**
      *   *Supervaluationism and Excluded Middle:* Supervaluationism validates $P \lor \neg P$. Epistemicism validates $P \lor \neg P$. So they agree on the logic. They disagree on Bivalence ($T(P) \lor T(\neg P)$).
      *   *Supervaluationism and Second-Order:* If a supervaluationist says the set of precisifications is vague, they need a logic for *that* vagueness. Often, they stop at first-order for simplicity, but a *committed* one admits higher-order vagueness. I will state that the Supervaluationist denies a sharp second-order boundary, whereas the Epistemicist affirms it. This is a key differentiator.
