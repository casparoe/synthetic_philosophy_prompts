  # JOINT STATEMENT ON THE NATURE OF VAGUENESS
  **Following Adversarial Collaboration between Proponents of Epistemicism and Supervaluationism**

  **Date:** October 26, 2023
  **Signatories:** [The Epistemicist], [The Supervaluationist]

  ### PREAMBLE
  We, the undersigned, acknowledge that decades of debate regarding vagueness have been hindered by terminological confusion and uncharitable reconstruction of opposing arguments. This document records the points of convergence reached through good-faith collaboration, isolates the substantive residual disagreements, and identifies the specific empirical or conceptual cruxes upon which our views turn. We agree that the Sorites paradox reveals a deep tension between classical logic, semantic competence, and the phenomenology of uncertainty.

  ### I. CLAIMS ENDORSED BY BOTH PARTIES
  1.  **The Sorites Inductive Premise:** We agree that the central inductive premise of the Sorites paradox (e.g., "If a man with $n$ hairs is bald, a man with $n+1$ hairs is bald") is not *knowably* true. We further agree that in any valid reconstruction of the paradox, this premise must be rejected or the inference rule restricted to avoid the absurd conclusion.
  2.  **Classical Logic (Excluded Middle):** We agree that the Law of Excluded Middle ($P \lor \neg P$) is valid for vague predicates. It is a theorem in our shared logical framework that for any object $x$, either "$x$ is tall" or "$x$ is not tall" holds.
  3.  **The Role of "Definitely":** We agree that the operator "Definitely" ($D$) functions as a modal operator that creates a buffer zone. For a predicate $F$, there are objects for which $DF$ is true, objects for which $D\neg F$ is true, and objects for which neither is true (borderline cases).
  4.  **Phenomenology of Uncertainty:** We agree that in borderline cases, competent speakers experience a specific type of uncertainty. They are not merely ignorant of a known fact; they are disposed to hesitate, and this hesitation is rational.
  5.  **Bivalence Status:** We agree that the dispute centers on the principle of Bivalence ($\forall P, T(P) \lor T(\neg P)$). One of us affirms it universally; the other denies it for borderline cases.
  6.  **Supervenience:** We agree that semantic facts supervene on facts about usage, environment, and physical history. We disagree only on *how* they supervene (uniquely vs. multiply).

  ### II. RESIDUAL DISAGREEMENTS
  The following table isolates the substantive disagreements. Each statement is phrased to be acceptable to the party endorsing it, without caricaturing the opponent.

  | Topic | The Epistemicist Maintains: | The Supervaluationist Maintains: |
  | :--- | :--- | :--- |
  | **Truth in Borderline Cases** | For any borderline case, the sentence is strictly True or strictly False. Our inability to classify it is purely epistemic. | For any borderline case, the sentence is neither Supertrue nor Superfalse. There is no unique truth value to be known. |
  | **Source of Uncertainty** | The uncertainty is **ignorance**. There is a fact of the matter, but it is cognitively inaccessible due to the "margin for error" principles governing knowledge. | The uncertainty is **indeterminacy**. The language itself has not settled the matter; there is no fact of the matter to be ignorant *of*. |
  | **Second-Order Boundaries** | The boundary between the "Definitely $F$" and the "Borderline $F$" is **sharp**. There is a specific point where knowledge ceases. | The boundary between the "Definitely $F$" and the "Borderline $F$" is **vague**. Higher-order vagueness prevents a sharp cut-off between determinacy and indeterminacy. |
  | **Metaphysical Commitment** | Vagueness is a feature of our *knowledge*, not the world or language. Reality is precise. | Vagueness is a feature of *language* (or representation). Reality may be precise, but our semantic grip on it is not. |

  ### III. CRUXES AND TEST CASES
  We identify two conceptual cruxes. Settling either would compel at least one of us to revise our position. For each crux, we specify a test case and record our predictions in advance.

  #### Crux 1: The Supervenience of Meaning on Use
  **Question:** Does total fixation of communal usage and physical history uniquely determine a semantic extension (extension is fixed but hidden), or can usage underdetermine extension (extension is genuinely multiple)?

  *   **Test Case (a): The Unsettled Community.**
      *   *Description:* A community uses the term "rich." No member has settled, or is disposed to settle, where the line falls. No member would recognize any external fact (e.g., a specific dollar amount) as settling it. Usage is consistent but stops short of a cutoff.
      *   **Epistemicist Prediction:** Case (a) contains a **sharp fact** analogous to Case (b). Micro-physical facts about usage and causal history fix a unique extension, even if speakers cannot access it. Vagueness is relevantly **like (b)**.
      *   **Supervaluationist Prediction:** Case (a) contains **no sharp fact**. The usage genuinely admits multiple admissible precisifications. Vagueness is relevantly **unlike (b)**.

  *   **Test Case (b): The Erased Threshold.**
      *   *Description:* An admissions gate once applied a precise height threshold (e.g., 180.00 cm), fixed by coin flip. The record was erased. Everyone agrees a sharp fact exists but is now unknowable.
      *   **Epistemicist Prediction:** This is a paradigm of **epistemic uncertainty**. Vagueness is this phenomenon generalized.
      *   **Supervaluationist Prediction:** This is a paradigm of **mere ignorance**, distinct from vagueness. In vagueness, no threshold was ever fixed, not even by hidden facts.

  #### Crux 2: The Coherence of Higher-Order Vagueness
  **Question:** Can the boundary between the "definite" and the "borderline" itself be vague without leading to logical incoherence or regress?

  *   **Argument Bearing on Crux:** The "Iterated Definiteness" Argument. If we apply the "Definitely" operator repeatedly ($D, DD, DDD...$), does the series terminate at a sharp boundary, or does it fade out?
  *   **Epistemicist Prediction:** The series terminates at a **sharp boundary**. There is a specific $k$ such that $D^k F$ applies but $D^{k+1} F$ does not. To deny this is to make the logic of "Definitely" incoherent.
  *   **Supervaluationist Prediction:** The series **fades out**. There is no sharp $k$. To assert a sharp boundary at any order is to reintroduce the Sorites vulnerability at that level.

  ### IV. NOTE ON VERBAL DISPUTE
  We acknowledge that a portion of our disagreement is **verbal**, specifically regarding the definition of the predicate "True."

  *   **The Verbal Hinge:** When the Supervaluationist says "Borderline sentences are not True," they mean "not Supertrue" (true on all admissible precisifications). When the Epistemicist says "Borderline sentences are True," they mean "corresponds to the unique actual extension."
  *   **Substantive Core:** However, we agree the dispute is **not merely verbal**. Even if we standardize terminology (e.g., distinguishing "Supertruth" from "Bivalent Truth"), we disagree on the **metaphysics of content**. The Epistemicist asserts there exists a *unique proposition* expressed by a vague sentence that speakers cannot identify. The Supervaluationist asserts there exists a *set of propositions* (precisifications), none of which is uniquely expressed. This is a substantive disagreement about the nature of semantic content, not merely a label.

  ### SIGNATURES

  _________________________
  **The Epistemicist**
  *Commitment: Bivalence holds; Vagueness is Ignorance.*

  _________________________
  **The Supervaluationist**
  *Commitment: Supertruth replaces Truth; Vagueness is Indeterminacy.*
