          2.  Residual Disagreements (table): Wording acceptable to each side.
          3.  Cruxes: Sub-questions where settling one moves a side.
          4.  Test Cases & Predictions: Two specific cases ((a) unsettled community use of "rich", (b) erased precise threshold). Predictions for each side on whether vagueness is like (a) or (b).
          5.  Second-Order Boundaries: Explicit statement on whether the boundary between "definitely" and "borderline" is sharp.
          6.  Verbal Dispute Check: Identify if any part is merely verbal.
      *   **Tone:** Philosophical, precise, collaborative, charitable, yet firm on core commitments.

  2.  **Deconstruct the Philosophical Positions:**

      *   **Epistemicism:**
          *   Vagueness is ignorance.
          *   There is a sharp cutoff (e.g., $n$ grains make a heap, $n+1$ do not).
          *   Bivalence holds (every sentence is true or false).
          *   Excluded Middle holds.
          *   "Definitely $P$" means "$P$ is true and we are in a position to know it" (or similar epistemic modal).
          *   Borderline cases are those where $P$ is true (or false) but unknowable.
          *   Second-order boundaries are also sharp (there's a sharp line between the knowable and the unknowable).

      *   **Supervaluationism:**
          *   Vagueness is semantic indeterminacy.
          *   There is no single sharp cutoff; there are many "precisifications" (admissible sharpenings).
          *   Supertruth = true on all admissible precisifications.
          *   Bivalence *fails* for borderline cases (neither supertrue nor superfalse).
          *   Excluded Middle *holds* (either $P$ or not-$P$ is supertrue, even if neither $P$ nor not-$P$ is supertrue individually? Wait, standard Supervaluationism validates $P \lor \neg P$ but invalidates $T(P) \lor T(\neg P)$). *Correction:* Supervaluationism validates classical logic (including Excluded Middle $P \lor \neg P$) but rejects Bivalence (not every sentence is true or false).
          *   "Definitely $P$" means "$P$ is supertrue" (true on all precisifications).
          *   Borderline cases are those where $P$ is true on some precisifications and false on others.
          *   Second-order boundaries: This is tricky. Standard Supervaluationism often faces the "higher-order vagueness" problem. If the set of admissible precisifications is vague, the boundary between "definitely" and "borderline" is also vague. However, to make the logic work, they often treat the "admissibility" relation as precise *for the sake of the model*, or acknowledge higher-order vagueness. The prompt asks to be explicit. A *committed* supervaluationist usually admits higher-order vagueness (the boundary of "definitely" is *not* sharp). Epistemicists say it *is* sharp.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground. Both agree the Sorites paradox is a serious problem. Both agree classical logic is mostly preserved (though for different reasons). Both agree "definitely" acts as a modal operator. Both agree there is a phenomenology of uncertainty.
      *   *Sorites:* Both agree the inductive premise ("if $n$ is $F$, $n+1$ is $F$") is false (Epistemicist: false because of the cutoff; Supervaluationist: false because there's a counter-case in some precisification) or that the reasoning is invalid (Supervaluationist: failure of deduction preservation). Actually, Supervaluationists usually say the inductive premise is false (on supertruth). Epistemicists say it's false. So they agree it's false.
      *   *Bivalence vs. Excluded Middle:* This is the big split. They can agree on the *logical relations* even if they disagree on the *metaphysical/semantic status*. They can agree that $P \lor \neg P$ is assertible. They can agree that for borderline cases, we cannot know which disjunct holds.
      *   *Borderline/Definitely:* Both agree "Definitely" creates a buffer zone. Both agree borderline cases resist classification.
      *   *Nature of Dispute:* Is the uncertainty semantic or epistemic?

  4.  **Drafting Section 2: Residual Disagreements (Table):**
      *   Need to phrase these so each side nods.
      *   *Truth in Borderline Cases:* Epistemicist: "There is a fact of the matter." Supervaluationist: "There is no unique truth value."
      *   *Source of Ignorance:* Epistemicist: "Cognitive limitation." Supervaluationist: "Semantic indecision."
      *   *Second-Order Vagueness:* Epistemicist: "Sharp boundary between definitely and borderline." Supervaluationist: "No sharp boundary (higher-order vagueness)."

  5.  **Drafting Section 3 & 4: Cruxes and Test Cases:**
      *   *Crux 1: The nature of semantic content.* Is meaning determined by use alone (leading to indeterminacy) or use + external facts (leading to hidden sharpness)?
      *   *Crux 2: Higher-Order Vagueness.* Can we draw a line around the borderline cases?
      *   *Test Case (a) "Rich":* Community has no settled line.
          *   Epistemicist: There is still a sharp line fixed by micro-facts of usage/environment (Williamson's margin for error). It's like (b) but hidden.
          *   Supervaluationist: There is genuinely no line. It's unlike (b). It's semantic indeterminacy.
      *   *Test Case (b) "Erased Threshold":* Precise history, now unknown.
          *   Epistemicist: This is exactly what vagueness is. Vagueness *is* like (b).
          *   Supervaluationist: This is mere ignorance, not vagueness. Vagueness is *unlike* (b).
      *   *Prediction:*
          *   Epistemicist: (a) is relevantly like (b). Both have sharp cutoffs.
          *   Supervaluationist: (a) is relevantly unlike (b). (b) is ignorance, (a) is indeterminacy.

  6.  **Refining the Second-Order Boundary Issue:**
      *   Epistemicist: The boundary between "definitely tall" and "borderline tall" is sharp. (There is a specific height where knowledge stops).
      *   Supervaluationist: The boundary between "supertrue" and "indeterminate" is *not* sharp (unless one adopts a specific technical model that ignores higher-order vagueness, but a *committed* natural language supervaluationist usually acknowledges higher-order vagueness). I need to be careful here. Standard Supervaluationism (Fine) treats the set of precisifications as precise *in the model*, but acknowledges that in reality, the set of admissible precisifications is vague. Let's assume the "committed" supervaluationist accepts higher-order vagueness to distinguish from epistemicism. If they treat the set of precisifications as sharp, they look too much like epistemicists (just modal realism about meanings). So, the disagreement is: Epistemicist says sharp second-order boundary; Supervaluationist says vague second-order boundary.

  7.  **Verbal Dispute Check:**
      *   Is "Truth" the verbal part? Epistemicists use "True" = Bivalent. Supervaluationists use "True" = Supertrue.
