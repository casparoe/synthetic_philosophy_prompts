  # Project Proposal: The Framework Dependence of Quantum Realism

  **Project Title:** Beyond the Wavefunction: Assessing the Psi-Ontic/Epistemic Distinction in Algebraic Quantum Field Theory

  **Applicant Profile:** Retired Experimental Physicist (Neutron Scattering, 30+ years).
  **Project Type:** Conceptual Analysis / Foundational Physics.
  **Expected Output:** A single research paper (4,000–6,000 words) suitable for a workshop proceedings or a specialized journal (e.g., *Studies in History and Philosophy of Modern Physics* or *Foundations of Physics*).

  ---

  ## 1. Executive Summary

  The debate over the ontological status of the quantum state—whether it represents a physical reality (psi-ontic) or an agent's information (psi-epistemic)—is currently stagnating. This stagnation is not due to a lack of no-go theorems, such as the PBR theorem, but rather a stagnation of framework. The vast majority of this literature operates exclusively within Non-Relativistic Quantum Mechanics (NRQM), treating the wavefunction $\psi$ on configuration space as the primary object of analysis.

  This proposal argues that this framework choice is not neutral. It biases the metaphysical debate by presupposing a ontology of particles and separable subsystems that does not survive the transition to relativistic physics. The project proposes to translate the psi-ontic/epistemic question into the language of Algebraic Quantum Field Theory (AQFT). Specifically, it will investigate whether the Reeh-Schlieder theorem and the Type III nature of local von Neumann algebras render the psi-epistemic view incoherent, independent of PBR-type arguments.

  The goal is not to prove a new physical theorem, but to perform a rigorous conceptual mapping. The hypothesis is that the psi-ontic/epistemic distinction is an artifact of the NRQM formalism. In AQFT, the "state" is a global functional on a local algebra, and the vacuum structure entails non-local correlations that undermine the "local knowledge" prerequisite for epistemic interpretations. The project will result in a short, sharp paper arguing that the realism debate must be reformulated or abandoned in the relativistic regime.

  ---

  ## 2. The Core Question

  To avoid the vagueness that plagues foundational discussions, this project is driven by a single, falsifiable research question:

  **Does the algebraic formulation of quantum field theory (AQFT) entail that the quantum state functional $\omega$ cannot be consistently interpreted as representing purely epistemic information about a local physical system, due to the structural properties of the vacuum (specifically the Reeh-Schlieder property)?**

  This question is precise enough to be answered in the negative. If it can be demonstrated that one can construct a consistent psi-epistemic model within the Haag-Kastler axioms that respects Reeh-Schlieder without contradiction, then the hypothesis is false. If, however, the structural features of AQFT (specifically the lack of tensor product factorization for local regions and the cyclicity of the vacuum) logically preclude the separation between "system" and "knowledge of system" required by epistemic views, then the hypothesis holds.

  The project seeks to determine if the move from NRQM to AQFT changes the answer to the realism question from "debatable" to "decided."

  ---

  ## 3. Critical Assessment: A Direct Evaluation of the Premise

  You asked for a definite position on whether this question is well-posed and whether your intuition is correct. Here it is, without hedging.

  **Is the question well-posed?**
  Yes, but with a significant caveat. In NRQM, the "state" is a vector in a Hilbert space. In AQFT, the "state" is a positive linear functional on a $C^*$-algebra of observables. These are mathematically distinct objects. To ask if the AQFT state is "real" in the same sense as the NRQM wavefunction is a category error unless we first define what "real" means for a functional. However, the Harrigan-Spekkens framework for ontological models is sufficiently abstract that it can be mapped onto the algebraic setting. The question is well-posed provided we accept that the "ontic state" in AQFT would correspond to the underlying variables determining the expectation values of the algebra, not a field configuration in the classical sense.

  **Is your intuition correct?**
  You are right to suspect that the NRQM framework biases the debate, but you are likely wrong about *why* AQFT kills the epistemic view. You are focusing on Reeh-Schlieder as a mechanism for "action at a distance" that makes local information impossible. While Reeh-Schlieder is crucial, the deeper killer is the classification of local algebras as **Type III von Neumann algebras**.

  In NRQM, the Hilbert space of a composite system factorizes: $\mathcal{H}_{total} = \mathcal{H}_{A} \otimes \mathcal{H}_{B}$. This factorization is the mathematical backbone of the psi-epistemic view. It allows you to say, "I have information about subsystem A, independent of B." It allows for the definition of a reduced density matrix via a partial trace.

  In AQFT, due to the Reeh-Schlieder theorem and the nature of the vacuum, local algebras associated with bounded spacetime regions are Type III. Type III algebras do not admit a trace operation. You cannot mathematically define a "state of region A" by tracing out region B. There is no clean separation between the system and the environment.

  **The Verdict:** The psi-epistemic view relies on the ability to assign a state to a subsystem that represents an agent's limited knowledge of that subsystem relative to the whole. AQFT removes the mathematical machinery (the partial trace and tensor factorization) required to define that subsystem state rigorously. Therefore, the epistemic view is not just "harder" in AQFT; it is mathematically ill-defined in its standard form.

  However, do not expect this to automatically prove the psi-ontic view. It may simply prove that the dichotomy itself is a artifact of non-relativistic approximations. The likely outcome is not that the state is "real," but that the question "real or information?" presupposes a separation of observer and system that relativistic QFT does not support. This points toward Ontic Structural Realism rather than traditional psi-onticism.

  **Are you making a fuss about a change of clothes?**
  No. In physics, formalism is not clothing; it is bone structure. NRQM allows for a metaphysics of "things with properties." AQFT enforces a metaphysics of "relations and structures." Changing the formalism changes what kinds of ontologies are mathematically permissible. You are not nitpicking; you are identifying a domain error in the current philosophical literature.

  **Why hasn't this been settled?**
  1.  **Technical Barrier:** Most philosophers of physics are trained in NRQM or Quantum Information Theory (qubits). AQFT requires a level of functional analysis (operator algebras, $C^*$-algebras) that is rare in philosophy departments.
  2.  **Physics Disinterest:** Working mathematical physicists generally view ontological debates as distractions. They use AQFT to prove scattering cross-sections or structural theorems, not to argue about realism.
  3.  **The "Effective" Defense:** Proponents of the NRQM debate argue that NRQM is an effective theory and good enough for metaphysics. Your project challenges this by arguing that the metaphysical conclusions drawn from the effective theory are invalidated by the fundamental theory.

  ---

  ## 4. Methodology and Work Plan

  This project must remain bounded. It is easy to get lost in the technicalities of AQFT. Given your background (experimentalist, rusty on operator algebras, slow reading speed), the methodology must prioritize conceptual mapping over mathematical derivation. You are not proving a new theorem; you are interpreting existing ones.

  **Phase 1: Formal Translation (Months 1-3)**
  *   **Goal:** Translate the definitions of "psi-ontic" and "psi-epistemic" from the Harrigan-Spekkens framework (Hilbert space vectors) into the Algebraic framework (states on algebras).
  *   **Task:** Define what an "ontic state" $\lambda$ means in AQFT. Is it a value assignment to the algebra? Is it a hidden variable in a GNS representation?
  *   **Constraint:** Do not attempt to master the full Haag-Kastler axioms. Focus strictly on the definitions of States, Observables, and Local Algebras.
  *   **Risk:** Getting bogged down in the definition of "beables" in QFT.
  *   **Mitigation:** Stick to the standard algebraic definition of a state as a expectation-value functional. Treat the "ontic" claim as the claim that this functional corresponds to a unique physical configuration of the field, and the "epistemic" claim as the claim that multiple physical configurations can yield the same functional.

  **Phase 2: The Reeh-Schlieder Analysis (Months 4-6)**
  *   **Goal:** Rigorously articulate why Reeh-Schlieder undermines the epistemic reading.
  *   **Task:** Analyze the statement: "The vacuum is cyclic for the algebra of observables localized in any bounded region."
  *   **Argument Construction:**
      1.  Epistemic views require that a state assigned to a region represents information *limited* to that region.
      2.  Reeh-Schlieder implies that by acting only on a bounded region, one can approximate *any* global state.
      3.  Therefore, the "local" algebra contains information about the global state.
      4.  Therefore, a "local state" cannot be merely information about "here"; it is inextricably linked to "everywhere."
  *   **Refinement:** Incorporate the Type III argument. The inability to factorize the Hilbert space means there is no mathematical object corresponding to "the state of the local region" independent of the global context.
  *   **Risk:** Confusing "approximating a state" with "creating a state."
  *   **Mitigation:** Focus on the *correlations* inherent in the vacuum state, not the operational ability to create particles. The entanglement is the key, not the scattering.

  **Phase 3: Comparison with PBR (Month 7)**
  *   **Goal:** Contrast this structural argument with the PBR theorem.
  *   **Task:** Show that PBR relies on preparation independence assumptions that are natural in NRQM (tensor products) but problematic in AQFT (due to the lack of tensor products for local regions).
  *   **Argument:** If PBR relies on an assumption (preparation independence) that AQFT shows is fundamentally false for local regions, then PBR's conclusion in the relativistic regime is suspect. Your argument (Reeh-Schlieder/Type III) bypasses PBR's assumptions and attacks the epistemic view directly via the structure of the vacuum.
  *   **Risk:** Misinterpreting the assumptions of PBR.
  *   **Mitigation:** Focus strictly on the "preparation independence" postulate and its algebraic equivalent.

  **Phase 4: Synthesis and Writing (Months 8-9)**
  *   **Goal:** Produce the 4,000–6,000 word paper.
  *   **Task:** Draft, revise, and refine.
  *   **Structure:**
      1.  Introduction: The NRQM bias in foundations.
      2.  The Algebraic State: Definitions and ontology.
      3.  The Reeh-Schlieder Objection: Why local knowledge fails.
      4.  The Type III Objection: Why subsystems don't exist.
      5.  Comparison with PBR: Why structural arguments beat no-go theorems here.
      6.  Conclusion: The dichotomy is an artifact.
  *   **Constraint:** Keep it under 6,000 words. Be ruthless in editing.

  ---

  ## 5. Realistic Scope and Limitations

  **What This Project Is Not:**
  *   It is not a derivation of new operator inequalities.
  *   It is not a history of the Reeh-Schlieder theorem.
  *   It is not a comprehensive review of all psi-ontic/epistemic literature.
  *   It is not a book.

  **Scope Control:**
  To ensure this does not balloon, you must adhere to the following constraints:
  1.  **Ignore Gravity:** Do not bring in General Relativity or Quantum Gravity. Stick to QFT on fixed Minkowski spacetime. Curved spacetime AQFT adds unnecessary complexity (uniqueness of vacuum issues).
  2.  **Ignore Interactions:** You do not need to solve the Yang-Mills existence problem. The structural properties of the algebras (Type III, Reeh-Schlieder) hold for free fields and are expected to hold generally. Work with the free field case as the exemplar.
  3.  **Ignore Measurement Theory:** Do not try to solve the measurement problem. This project is about the *status of the state*, not the *collapse of the state*. Assume standard algebraic measurement theory or bracket it out.
  4.  **No New Math:** If you encounter a mathematical hurdle you cannot clear with existing textbooks, do not try to solve it. Work around it or state it as a limitation. You are a philosopher-interloper here, not a mathematician.

  **Potential Failure Modes:**
  1.  **Mathematical Overload:** You find the operator algebra too dense to parse reliably.
      *   *Contingency:* Pivot to a qualitative analysis of the *implications* of Type III algebras as described in secondary literature, rather than engaging with the primary proofs.
  2.  **The Distinction Holds:** You find that someone has already successfully defined an epistemic model in AQFT (e.g., via local hidden variables).
      *   *Contingency:* The paper becomes a critique of that specific model, showing where it violates relativistic causality or vacuum structure. This is still a successful result.
  3.  **The Question Dissolves:** You conclude that "state" in AQFT is so different from "state" in NRQM that the question is meaningless.
      *   *Contingency:* This is actually a *positive* result. The paper argues for the dissolution of the debate. This is a valid philosophical conclusion.

  **Success Criteria:**
