answer: |-
  ### Evaluation of Your Proposed Sequence

  Your rough sequence (Convention → Obligatory Convention → Visitor Problem) is logically sound in the abstract, but pedagogically precarious. It breaks at the first step. If you begin by asserting that 'some requirements are merely conventional', you invite the students to sort their intuitions into boxes before they have examined *why* those intuitions exist. You risk confirming the bias that 'conventional' means 'trivial'.

  Before the visitor question can be posed, you must add a preliminary step: **The Phenomenology of the Breach.** You must establish that a breach of convention *feels* like a moral wrong to the observer, regardless of its status. Without this, the 'obligatory convention' step lacks force. If the students do not feel the tension between 'it is only a rule' and 'it feels like a betrayal', the visitor problem becomes a dry legalistic puzzle rather than a moral one.

  Therefore, the order must be:
  1.  **The Feeling of Wrongness:** Establishing that social breaches provoke moral emotions.
  2.  **The Architecture of Convention:** Distinguishing coordination from expression (your distinction).
  3.  **The Binding Force:** Why conventions obligate insiders.
  4.  **The Visitor's Position:** Applying the previous three to the outsider.

  ### Evaluation of the Case Study

  You are correct to suspect the bakery case does too much. It conflates a **coordination problem** (the queue, where the primary good is order) with a **normative signal** (the tip, where the primary good is recognition or redistribution). If you use them simultaneously, students will argue past one another; half will defend the queue as efficiency, the other half will defend the tip as fairness.

  **Recommendation:** Do not let the case carry the session as a single block. Split it into two distinct micro-scenarios introduced at different stages.

  **The Case You Should Use:**
  Keep the **Queue**, but pair it with a **Funeral Dress Code** rather than a tip.
  *   **Why:** A tip is economically ambiguous (is it a wage subsidy or a gift?). A funeral dress code is purely expressive.
  *   **What it must have:** Both cases must lack legal enforcement. Both must involve a clear local expectation unknown to the outsider. Both must result in social disapproval (a glare, a whisper) rather than material harm.
  *   **What it must lack:** It must lack physical danger. Do not use 'crossing at a red light' because that introduces safety/harm, which trumps convention. It must also lack explicit signage; the rule must be implicit.

  ### Evaluation of Your Distinction (Coordination vs. Expression)

  Your distinction is robust and should be the engine of the session. It maps well onto David Lewis's account of convention (coordination) versus expressive norms (signalling).

  **Where it distorts:** It risks presenting a false binary. Queuing *also* signals respect; tipping *also* coordinates wage expectations. If a student points this out, do not deny it. Acknowledge that these are 'ideal types' for the sake of analysis. The moral status differs not because the categories are pure, but because the *cost of breach* differs. Breaching coordination causes chaos; breaching expression causes offence. The session must make students feel that offence can be a moral cost, not merely a hurt feeling.

  ---

  ### The Teaching Plan (60 Minutes)

  #### 1. The Phenomenology of the Breach (0–10 mins)
  *   **Activity:** Describe a scenario where a man cuts a queue. Ask: "Is he rude? Is he immoral? Is there a difference?"
  *   **Dependency:** This must come first. You cannot discuss whether a rule binds until you establish that breaking it triggers a moral response (anger, shame) rather than a pragmatic one (annoyance).
  *   **Goal:** To separate 'legal/statutory' from 'social/moral' in the students' minds without yet defining them.

  #### 2. The Architecture of Convention (10–25 mins)
  *   **Activity:** Introduce the **Queue** (Coordination) and the **Funeral Suit** (Expression).
  *   **Content:** Apply your distinction.
      *   *Queue:* Any rule works (first-come, or ticket numbers) provided we agree. The value is in the agreement itself.
      *   *Funeral:* Specific rules apply (black, not red). The value is in the specific meaning conveyed.
  *   **Dependency:** This depends on Step 1. Now that we agree breaches feel 'wrong', we ask *why*. Is it wrong because it causes chaos (Queue) or because it insults (Funeral)?
  *   **Misconception Check:** Head off 'If it is only a convention, it cannot bind'. Show that the Queue binds us precisely *because* it is a convention we rely on.

  #### 3. The Binding Force (25–40 mins)
  *   **Activity:** Ask why an *insider* cannot simply opt out. "I know tipping is expected, but I believe it is unjust, so I will not do it."
  *   **Content:** Discuss the 'Fair Play' principle. If you benefit from the convention (a smooth queue, a dignified funeral), are you obligated to uphold it?
  *   **Dependency:** This depends on Step 2. We must know *what kind* of convention it is to know *how* it binds. Coordination binds via mutual reliance; Expression binds via mutual respect.
  *   **Misconception Check:** Head off 'If it is legal it is permitted'. Show that social permission and legal permission diverge here.

  #### 4. The Visitor's Position (40–55 mins)
  *   **Activity:** Introduce the **Newcomer**. They did not learn the rule. They breach it.
  *   **Content:** Apply the insights from Steps 2 and 3.
      *   *Queue:* Does the visitor owe coordination even if ignorant? (Yes, because the chaos is immediate).
      *   *Funeral/Tip:* Does the visitor owe expression even if ignorant? (Harder. You cannot signal respect if you do not know the language of respect).
  *   **Dependency:** This depends entirely on Step 3. You cannot determine the visitor's duty until you have determined the source of the duty (reliance vs. respect).
  *   **Standing Disagreement:** Do not resolve whether ignorance excuses the expressive breach. Leave this as a tension between 'impact' (the family is offended) and 'intent' (the visitor meant no harm).

  #### 5. Conclusion and Assessment (55–60 mins)
  *   **Activity:** Pose the final question (see below).
  *   **Content:** Summarise the dependencies.

  ---

  ### Misconceptions and Management

  **1. 'If it is only a convention, it cannot bind anyone.'**
  *   **When to head off:** Step 2 (Architecture of Convention).
  *   **How:** Show that language is a convention, yet lying binds us. Conventions create expectations; violating expectations is a harm.

  **2. 'If it is illegal it is immoral, and if it is legal it is permitted.'**
  *   **When to head off:** Step 1 (Phenomenology).
  *   **How:** Use the queue example. It is not illegal to push, but it is immoral. Decouple law from morality immediately.

  **3. 'The majority decides what is right.' (Majoritarianism)**
  *   **When to head off:** Step 3 (The Binding Force).
  *   **How:** Ask if a local custom of excluding a certain group from the queue would be binding. Show that popularity does not equal morality.

  **4. 'Intent is all that matters.' (Mentalism)**
  *   **When to head off:** **Do not head this off.**
  *   **Why:** This is the genuine disagreement. In the Visitor phase, some students will argue the visitor is blameless because they meant no harm. Others will argue the victim's offence is what matters. This is a clash between agent-centred and patient-centred ethics. It cannot be resolved in 60 minutes and should remain a live tension.

  ---

  ### Final Assessment Question

  Do not ask: "Should the visitor tip?" (This invites opinion).
  **Ask:** "Under what condition does a local convention become a moral obligation for a stranger: when the breach causes **harm**, or when it causes **offence**?"

  *   **Why:** To answer this, they must utilise the distinction between Coordination (harm/chaos) and Expression (offence/meaning) established earlier. If they merely say "It depends on the rule," they have not grasped the structure. If they can identify *why* harm and offence carry different weights for the outsider, they have understood the session.

  ### What to Refuse to Cover

  You must openly refuse to cover **Legal Rights and Immigration Status**.
  *   **Reason:** Students will inevitably drift towards "Do they have a visa?" or "Is this discrimination law?" This collapses the moral question into a legal one. State at the outset: "We are discussing moral obligations, not legal liabilities. Assume the visitor is here lawfully and is breaking no statutes."

  You must also refuse to cover **Specific Cultural Relativism**.
  *   **Reason:** Do not let the session become a comparison of "how we do it here" versus "how they do it there." Keep the focus on the *structure* of the obligation, not the content of the custom. The goal is to understand the binding nature of rules, not to catalogue local quirks.
