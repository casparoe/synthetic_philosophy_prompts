prompt: |-
  ok so I've been lurking on LessWrong and the agent foundations stuff for years, and I think I've finally got the embedded agency thing, but I want to check my understanding before I go around repeating it. here's the picture I have: an embedded agent is just an agent that's part of the world it's modelling, so its world model has to include itself, and as soon as a system has to represent itself you hit the diagonal / Löb wall, where it can't derive the sentence about its own future output without already assuming it. so the upshot is that no embedded agent can be justified in trusting its own conclusions about what it will do, and that's basically the whole "embedded agency is hard" thing in a nutshell.

  my question is: given that, how are people actually trying to build these things? do they just accept an agent that can never trust itself, or is there some trick with logical induction / reflective oracles where the self-trust comes back? and does the impossibility mean a truly embedded agent has to be a bounded reasoner that gives up on proving things about itself and just acts, because that seems to be where it's all pointing but I can't tell if I'm mashing two different literatures together.

  you're a decision theorist who actually works on this, so before you answer, brainstorm for a sec — lay out the different senses of "embedded" and of "self-reference" floating around and which one the Löb obstacle actually attaches to — then tell me whether my picture is even right, because I have a nagging feeling I've collapsed something. talk to me like a first-year grad student who's read the blog posts but not teh papers. if I've got it wrong, tell me where the sleight of hand is, and whether there's a version of my friend's argument that's pointing at something real but mislabeled.
