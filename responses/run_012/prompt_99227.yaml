      *   *Check:* Did I address stability of character? Yes, Browning sees it as fragile, Goldhagen as culturally encoded.
      *   *Check:* Did I address the test cases clearly? Ensure the distinction between "initiative" and "orders" is linked back to the theories.
      *   *Nuance:* Goldhagen doesn't say *every* German killed, but that the *culture* made it possible. Browning doesn't say *everyone* kills, but that *most* will under specific pressure.
      *   *Synthesis:* Be careful not to just say "both are right." Explain *how* they fit. Ideology as the fuel, Situation as the spark? Or Ideology as the recruitment, Situation as the retention? The prompt suggests "recruitment and moral erosion." I should use that framing.

  9.  **Final Polish:** Check tone (academic, analytical). Ensure clear headings or structure for readability. (Proceed to generate output based on these thoughts.)

