answer: |-
  Good morning. Fifteen years ago, I walked out of these gates to teach history, and today I stand before you to speak about it. I have sat in these seats myself, looking up at the portrait in the hall, listening to speakers say the word "benefactor" without flinching. This year, the Head asked me not to dig anything up regarding the money that built this place, and I agreed not to, though I suspect that agreement is itself an entry in the ledger I am trying to write. We are here to celebrate, and we are here to account, and I intend to do both in the same breath.

  When we look at this school, we see what was built. But to measure what was built, we must choose what we measure it against. We could imagine nothing was here before, a blank space waiting for order. We could imagine the existing order continuing, the schools and systems that stood before the founders arrived. Or we could measure against the promises made at the time, the intentions declared rather than the outcomes delivered. The verdict on whether this place is a gift or a takeover flips depending on which baseline you choose before a single brick is counted. We celebrate this institution as a beacon of learning, knowing that its light is defined by the shadows it cast elsewhere.

  Consider the ledger itself. In accounting, a credit here balances a debit there, and the sum is zero. But in history, the entries appear twice, in different books held by different hands. A railway built to extract wealth is a debit to the land it crosses even if it is a credit to the port it serves. You cannot total the sum unless you have already decided that the parties may be netted against one another, which is precisely the thing in dispute. We honor the founders who endowed these benches, acknowledging that the comfort we sit on was purchased with costs borne by people who do not sit here.

  Look around you. What you see is a survivor's ledger. The institutions that outlasted the end of empire are disproportionately the ones that could pay for themselves on the ground, while the others faded from the archive. We look at what stands today, but the archive is made of what did not fall. This school survived because it was funded to survive, and that survival shapes the story we tell about what was left behind. We welcome our partners from Kolkata, knowing that the connection between us is made of both the bridges that were built and the ones that were not.

  So, what do I hand to you, the fifteen-year-olds sitting in the front rows? You did not sign the contracts, and you did not ship the indigo. It is tempting to say the past is complicated, or to say you owe a debt for the privileges you enjoy. But neither is true. You cannot pay a bill you did not incur, but you cannot pretend the room you are standing in was built on neutral ground. Obligations of states do not descend on individuals like estate debts, but the distributional residue does.

  You inherit the shape of the world as it was settled, not the bill for the settling. Your task is not to apologize for the ledger, but to read it accurately enough to write the next entry without pretending the ink is invisible. We celebrate this day because this school remains a place where you can learn to read those lines, and we honor the past by ensuring the next chapter is written with eyes open to the cost of the paper. Thank you.

