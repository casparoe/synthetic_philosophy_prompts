answer: |-
  **Decision Tree: The Separateness of Persons Objection**

  **Root:** "You cannot simply add up everyone's good and bad because persons are separate."

  **Node 1:** Is the barrier against aggregation a claim about *what exists* (no super-person holds the total good) or *how we act* (rights/reasons block the trade-off)?
  *   **Branch A (What Exists):** Go to Node 2.
  *   **Branch B (How We Act):** Go to Node 5.

  **Node 2:** Is the boundary between persons morally deeper than the boundary between times in a single life?
  *   **Branch A (Yes, Deeper):** Go to Node 3.
  *   **Branch B (No, Analogous):** Go to Node 4.

  **Node 3:** Does this distinctness forbid transferring a burden from many to one even if the total burden falls (e.g., two people each losing an eye vs. one going blind)?
  *   **Branch A (Yes, Forbids):** **Leaf: Anti-Aggregationist (Kamm/Quinn).**
  *   **Branch B (No, Allows):** **Leaf: [Unnamed/Incoherent]** (Claims persons are distinct but permits treating them as a single vessel for burden-shifting).

  **Node 4:** Does reducing persons to series of experiences justify maximizing the total sum across person-boundaries (e.g., Utility Monster)?
  *   **Branch A (Yes, Justifies):** **Leaf: Reductionist Consequentialist (Parfit/Utilitarian).**
  *   **Branch B (No, Does Not Justify):** **Leaf: [Unnamed/Incoherent]** (Claims persons are merely moments but still forbids maximizing the total sum of moments).

  **Node 5:** Is the barrier an absolute side-constraint on action or a structural feature of practical reason?
  *   **Branch A (Side-Constraint):** Go to Node 6.
  *   **Branch B (Practical Reason):** Go to Node 7.

  **Node 6:** Does this constraint forbid killing one healthy patient to harvest organs for five dying patients?
  *   **Branch A (Yes, Forbids):** Go to Node 8.
  *   **Branch B (No, Allows):** **Leaf: [Unnamed/Incoherent]** (Claims absolute side-constraints but permits the Transplant Case).

  **Node 7:** Does this structure allow an agent to weight her own projects higher without imposing that logic on others?
  *   **Branch A (Yes, Allows):** Go to Node 9.
  *   **Branch B (No, Forbids):** **Leaf: Impartial Consequentialist (Standard Utilitarian).**

  **Node 8:** If boundaries block aggregation, is discounting your own future good over the years the same mistake as sacrificing a stranger?
  *   **Branch A (Yes, Same Mistake):** **Leaf: [Unnamed/Unexplored]** (View treats intrapersonal time like interpersonal space; rarely defended as it undermines prudence).
  *   **Branch B (No, Different Mistake):** **Leaf: Rights-Based Deontologist (Nozick/Rawls).**

  **Node 9:** Does this view forbid aggregating tiny losses across many to prevent one large loss (e.g., Repugnant Conclusion scenarios)?
  *   **Branch A (Yes, Forbids):** **Leaf: Agent-Relative Deontologist (Nagel/Scheffler).**
  *   **Branch B (No, Allows):** **Leaf: [Unnamed/Unexplored]** (Claims agent-relative reasons but permits full aggregation of small losses; tension between structure and outcome).

  **Node 10:** (Cross-Check for Node 4 & 9) Does the view collapse when one person gains massively while many lose slightly (Utility Monster)?
  *   **Branch A (Yes, Collapses/Permits):** **Leaf: Classical Utilitarian.**
  *   **Branch B (No, Blocks):** **Leaf: [Unnamed/Unexplored]** (A view that blocks the Utility Monster but accepts Reductionism about persons is theoretically possible but rarely occupied).

  ***

  ### Analysis of Leaves and Empty Combinations

  **Named Defenders:**
  *   **Anti-Aggregationist (Kamm/Quinn):** Node 3A. Defends the intuition that numbers don't always count when rights/burdens are distinct.
  *   **Reductionist Consequentialist (Parfit):** Node 4A. Argues separateness is shallow; maximization holds across persons and times.
  *   **Rights-Based Deontologist (Nozick/Rawls):** Node 8B. Uses separateness to ground side-constraints; distinguishes sharply between persons and times.
  *   **Agent-Relative Deontologist (Nagel/Scheffler):** Node 9A. Grounds objection in practical reason; allows personal projects but blocks impersonal trade-offs.

  **Unnamed/Empty Leaves:**
  *   **[Unnamed/Incoherent] (Node 3B, 4B, 6B):** These combinations are flagged as **incoherent**. For example, claiming persons are metaphysically distinct (Node 2A) but permitting burden transfers as if they were one entity (Node 3B) contradicts the initial metaphysical claim. Similarly, asserting an absolute side-constraint (Node 5A) but allowing the Transplant Case (Node 6B) negates the definition of the constraint.
  *   **[Unnamed/Unexplored] (Node 8A, 9B, 10B):** These are flagged as **unexplored** rather than strictly incoherent.
      *   *Node 8A:* Treating intrapersonal discounting as morally equivalent to interpersonal sacrifice is logically possible but undermines the concept of prudence; few defend it.
      *   *Node 9B:* An agent-relative view that still permits aggregating small losses is unstable but not impossible; it lacks a prominent defender.
      *   *Node 10B:* A Reductionist view (Node 4A) that blocks the Utility Monster is theoretically open (e.g., prioritarianism) but rarely occupied under the specific label of "Separateness of Persons."

  **Indistinguishable Leaves:**
  *   **Classical Utilitarian (Node 10A) vs. Reductionist Consequentialist (Node 4A):** The tree struggles to separate these fully. Both permit aggregation across persons. The distinction lies in *why* (Node 1: Metaphysical reduction vs. Normative permission), but in practice, both land on similar policy outcomes regarding the Utility Monster.
  *   **Rights-Based (Node 8B) vs. Agent-Relative (Node 9A):** Both forbid the Transplant Case and block aggregation. The tree distinguishes them by foundation (Side-Constraint vs. Practical Reason), but in many concrete cases (like the Transplant), they yield identical verdicts.
