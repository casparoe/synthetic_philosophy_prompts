answer: |-
  ### Example: The "Elite University" Selection (Collider Bias)

  **Variables:**
  *   $X$: Athletic Scholarship Status (Recipient vs. Non-recipient).
  *   $Y$: Academic GPA (High vs. Low).
  *   $Z$: Admission to Elite University (Admitted vs. Rejected).

  **Causal Structure:**
  *   Athletic Ability causes $X$ (Scholarship).
  *   Academic Ability causes $Y$ (GPA).
  *   Admission ($Z$) is granted if a student has High Athletic Ability **OR** High Academic Ability.
  *   Thus, $X$ and $Y$ are both causes of $Z$. $Z$ is a **Common Effect** (or **Collider**) of the variables of interest (or their underlying causes).
  *   In the general population, Athletic Ability and Academic Ability are slightly positively correlated (due to socioeconomic factors, for instance).

  **Direction of Association:**
  *   **Pooled (General Population):** There is a **positive** association between Athletic Scholarship status and GPA. (Students with scholarships tend to come from backgrounds that also support higher GPAs).
  *   **Stratified (Admitted Students Only):** Within the stratum of admitted students ($Z=$ Admitted), there is a **negative** association between Athletic Scholarship status and GPA. (Among those admitted, if you do not have a high GPA, you likely have a scholarship; if you have a high GPA, you likely do not need a scholarship to be admitted).

  **Causal Role of Stratifying Variable ($Z$):**
  *   $Z$ is a **Common Effect** (Collider) of the underlying causes of $X$ and $Y$.

  **Why one comparison is wrong:**
  If the research question is "What is the relationship between athletic talent and academic performance in the student population?", the **stratified comparison is the wrong comparison**. Conditioning on admission ($Z$) induces a spurious negative correlation (selection bias) that does not exist causally in the population. The reversal is an artefact of the partition (conditioning on the collider), not evidence that athletic talent harms academic performance.

  ***

  ### Conceptual Analysis

  **1. Is anything genuinely paradoxical left?**
  Once the causal structure is fixed (represented, for example, by a Directed Acyclic Graph), nothing genuinely paradoxical remains. The label "paradox" survives largely as a piece of folklore or a pedagogical hook. The reversal is a necessary mathematical consequence of the probabilistic dependencies induced by conditioning on a common effect. In causal inference literature (e.g., Pearl, Spirtes), this is distinguished from the classic "confounding" Simpson's Paradox; here, it is often termed **Berkson's Paradox** or **M-Bias**. The "paradox" arises only from the erroneous intuition that associations should remain stable across subpopulations, regardless of *how* those subpopulations are defined (i.e., ignoring whether the stratifying variable is a cause or an effect).

  **2. What settles the choice between pooled and disaggregated comparison?**
  The choice is settled by the **causal structure** in conjunction with the **research question**.
  *   **Causal Structure:** The graph dictates which variables are confounders (require adjustment) and which are colliders (forbid adjustment). In this example, the structure ($X \to Z \leftarrow Y$) dictates that conditioning on $Z$ introduces bias.
  *   **Research Question:** If the question were "What is the relationship between talent and GPA *among students at this specific university*?", then the stratified comparison is correct for that specific subpopulation, though it still does not reflect the causal relationship between talent and GPA. However, for the general causal question, the pooled data (unconditioned on $Z$) is the valid estimator.
  *   **Neither/Both:** It is not settled by statistical significance or sample size alone; a larger sample within the stratum would only estimate the spurious correlation more precisely.

  **3. Would the reversal survive finer measurement or different cuts?**
  If $Z$ is a collider, the reversal would likely **persist or worsen** with finer measurement. Conditioning on a collider induces bias; conditioning *more precisely* on a collider (e.g., stratifying by specific admission scores rather than just Admitted/Rejected) typically strengthens the induced dependency between the causes. Unlike confounding, where finer measurement of the confounder reduces bias, finer measurement of a collider entrenches the selection bias. Cutting $Z$ into a different number of categories does not resolve the issue as long as conditioning occurs on the common effect.

  **4. Implications for the claim that aggregation is illegitimate in general.**
  This example implies that the claim "aggregation is illegitimate in general" is **false**.
  *   **Context Dependence:** Aggregation is illegitimate only when it masks confounding (as in the classic Simpson's case where $Z$ is a Common Cause). Disaggregation (stratification) is illegitimate when it induces collider bias (as in this example) or blocks mediating pathways (when $Z$ is an Intermediate).
  *   **No Universal Rule:** There is no statistical rule that dictates "always stratify" or "always pool." The legitimacy of aggregation depends entirely on the causal role of the variables being aggregated or stratified.
  *   **Conclusion:** Reversals of this kind do not show aggregation to be inherently flawed; they show that **data analysis without causal assumptions is indeterminate.** The paradox highlights the necessity of causal modeling over purely statistical association.
