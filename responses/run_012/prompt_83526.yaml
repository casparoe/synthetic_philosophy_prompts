answer: |-
  # Seminar Handout: Desiderata for a Theory of Performance Legitimacy

  ## I. Scope and Definition
  **Object of Analysis:** *Normative Political Legitimacy.*
  **Definition:** The moral right to rule, generating a content-independent duty of obedience (or at least a permission to coerce) distinct from the power to enforce.

  **Exclusions (Conceptual Boundaries):**
  To avoid category errors, the theory must explicitly distinguish legitimacy from:
  1.  **Stability:** A regime may be durable without being legitimate (e.g., a coercive prison).
  2.  **Legality:** A regime may follow its own positive laws without being legitimate (e.g., a legal dictatorship).
  3.  **Sociological Belief:** A regime may be *believed* to be legitimate without *being* legitimate (e.g., rule based on false propaganda or adaptive preferences).

  ---

  ## II. The Desiderata
  A theory of performance legitimacy must satisfy the following requirements to be considered settled rather than assumed.

  ### 1. The Normative/Sociological Distinction
  *   **Requirement:** The theory must explain why a government's *actual* right to rule differs from the population's *belief* in that right.
  *   **Motivation:** Prevents the collapse of legitimacy into mere propaganda success or "false consciousness." If legitimacy is solely what people believe it is, the performance claim becomes unfalsifiable.
  *   **Status:** **Non-Negotiable.** (Required for the concept of *normative* legitimacy).

  ### 2. The Problem of the Sacrificed Minority (Distributional Scope)
  *   **Requirement:** The theory must specify whether aggregate national success (GDP, security) can justify the systematic sacrifice of a specific, disfavored subgroup (e.g., ethnic minorities, political dissidents, migrant laborers).
  *   **Motivation:** Addresses the case of the "Successful Authoritarian" (e.g., Singapore or Reform-Era China). If legitimacy is derived from the *general* welfare, does the suffering of the few invalidate the claim?
  *   **Status:** **Contested Commitment.** (Liberal theories require immunity for the minority; Utilitarian/Consequentialist theories may permit the sacrifice if the aggregate gain is sufficient).

  ### 3. The Problem of Temporal Decay (Revocability)
  *   **Requirement:** The theory must determine the status of legitimacy when the performance record deteriorates (e.g., economic crash, security failure).
  *   **Motivation:** Addresses the "Authoritarian Bargain." Is legitimacy a one-time grant based on past success, or a continuous lease requiring ongoing delivery? If the latter, does failure automatically trigger a right to revolution, or is there a grace period?
  *   **Status:** **Contested Commitment.** (Contractarian views suggest revocability; Paternalist views may suggest deferred judgment).

  ### 4. The Problem of the Unobservable Counterfactual (Causality)
  *   **Requirement:** The theory must provide a method for attributing prosperity/order to the regime rather than to external factors (e.g., resource booms, global trends, prior institutional groundwork).
  *   **Motivation:** Performance legitimacy rests on the claim: *"Things are better than they would have been without us."* Since the counterfactual (the "without us" scenario) is unobservable, the theory must explain how we verify this causal link.
  *   **Status:** **Non-Negotiable.** (Logical necessity of a causal claim).

  ### 5. The Boundary of Moral Permissibility
  *   **Requirement:** The theory must identify if there are means of delivering performance that are intrinsically illegitimizing, regardless of the outcome.
  *   **Motivation:** Distinguishes legitimacy from mere effectiveness. A regime might deliver prosperity through mass enslavement; the theory must state whether the *source* of the performance taints the legitimacy.
  *   **Status:** **Contested Commitment.** (Deontological theories say yes; Pure Consequentialist theories say no).

  ### 6. The Agency Requirement
  *   **Requirement:** The theory must explain the relationship between performance and political agency. Does delivering prosperity substitute for consent, or does it merely facilitate the conditions for consent?
  *   **Motivation:** Prevents the reduction of citizens to passive beneficiaries (like livestock) rather than political agents.
  *   **Status:** **Contested Commitment.** (Democratic theories require agency; Performance theories often treat agency as secondary to welfare).

  ---

  ## III. Classification of Requirements

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. Normative/Sociological Distinction** | **Non-Negotiable** | Without this, "legitimacy" loses its critical force and becomes synonymous with "stability" or "belief." |
  | **2. Sacrificed Minority** | **Contested** | Depends on whether the theorist prioritizes *aggregate welfare* or *individual rights*. |
  | **3. Temporal Decay** | **Contested** | Depends on whether the theory views legitimacy as *transactional* (ongoing) or *foundational* (historical). |
  | **4. Unobservable Counterfactual** | **Non-Negotiable** | A causal claim cannot be evaluated without addressing the counterfactual, even if it is difficult to measure. |
  | **5. Moral Permissibility** | **Contested** | Depends on the weight given to procedural justice vs. outcome justice. |
  | **6. Agency Requirement** | **Contested** | Depends on whether citizens are viewed as *authors* of the law or *subjects* of administration. |

  ---

  ## IV. The Incompatibility Theorem
  **There is a pair of requirements within this framework that cannot be jointly satisfied.**

  A theory of performance legitimacy cannot simultaneously satisfy **Desideratum 1 (The Normative/Sociological Distinction)** and **Desideratum 4 (The Unobservable Counterfactual)** while maintaining **Action-Guiding Clarity**.

  ### The Conflict
  1.  **To satisfy Desideratum 1:** Legitimacy must depend on the *truth* of the performance claim (the regime *actually* caused the prosperity), not merely the *belief* in that claim. If legitimacy is based on false beliefs, it is sociological, not normative.
  2.  **To satisfy Desideratum 4:** The theory must acknowledge that the core performance claim ("We caused X, otherwise Y would have happened") relies on a counterfactual that is epistemically inaccessible. No observer can verify the "otherwise."
  3.  **The Resulting Dilemma:**
      *   **Option A:** Insist on **Truth**. Since the counterfactual is unknowable, legitimacy becomes unknowable. The theory fails to guide political action (citizens cannot know if they have a duty to obey).
      *   **Option B:** Insist on **Knowability**. Since we cannot know the truth, we must rely on *belief* or *perception* of performance. The theory collapses into Sociological Legitimacy (violating Desideratum 1).

  ### Implication for the Seminar
  Any defense of performance legitimacy must resolve this epistemic gap. It must either:
  *   Admit that legitimacy is partially constituted by belief (modifying Desideratum 1).
  *   Argue that proxy metrics (e.g., growth rates) are sufficient proof of causality (weakening Desideratum 4).
  *   Accept that legitimacy is a metaphysical property unrelated to citizen verification (abandoning Action-Guiding Clarity).

  **Note on the Sacrificed Minority (Desideratum 2):**
  While not logically impossible, satisfying Desideratum 2 (protecting the minority) is incompatible with the **Strong Performance Claim** (that performance *alone* is sufficient for legitimacy). If a regime is successful but sacrifices a group, and the theory declares it illegitimate, then performance was *not* sufficient. If the theory declares it legitimate, it violates standard moral constraints. The theorist must therefore admit that performance is, at best, a *necessary* but not *sufficient* condition, or that "performance" includes rights protection as a metric.
