prompt: |-
  I'm in my third year of a philosophy degree, and this term I'm taking a seminar on moral worth — on what it is for an action to be not merely right or useful but to have the kind of value that makes the agent admirable — and, somewhat to my surprise, I've just been appointed the student member of my college's Beacon Prize committee, which meets this Thursday to choose the recipient of an annual award for "exemplary moral conduct by an undergraduate." Two nominations are before us and the committee is split down the middle. The first is Priya, who during an accident in the chemistry building ran back into a smoke-filled lab and dragged a trapped technician out, badly burning her hands; everyone agrees she saved his life and that she will likely carry the scars for years. Her own account, though, is that she did not really decide anything — "my legs just went" — and she has told a close friend that what she chiefly remembers feeling was dread at how it would look if she, the safety officer of her club, were seen standing outside while someone burned. The second is Daniel, who for two years has run a free weekend tutoring program for the children of university staff, and who, when a landlord moved to evict a family he had never met, spent most of his savings on a lawyer for them. He says he acted because it was simply not acceptable that such a thing should happen, and that he would have done it even if no one ever learned of it; but the eviction was in fact reversed for unrelated reasons before his lawyer accomplished anything, the family says his help changed little, and the tutoring program has, by the numbers, raised no one's grades.

  I've been arguing in seminar for the view — I think it is the one on which an action has moral worth only when the agent is moved by the very considerations that make the action right, rather than by a good-hearted impulse or a general wish to do right — and the committee chair has taken to calling me the inquisitor. Her position is that the Beacon is a beacon and not a tribunal: it should reward whoever produced the most measurable good, full stop, because motives are private, self-reported, and in any case unknowable. The Dean's office, meanwhile, keeps saying the Prize is "for character, not outcomes" without saying what character is or how a committee is supposed to see it. I find I cannot defend my view against two cases our seminar kept returning to: the person who does the right thing while believing it to be wrong, out of sympathy rather than principle, and the person whose good deed is so overdetermined — training, habit, temperament, and a little vanity all pushing the same way — that no single motive can be picked out as the reason. I am also unsure whether the Prize should reward acts or agents.

  Please draft the short written opinion I'll circulate before Thursday's meeting. It should recommend a concrete decision — which nominee, if either, and whether the Prize should be given at all this year — and, more usefully, propose a criterion the committee could apply to future nominations, defended against the obvious objection that any motive-based test turns a prize committee into an inquisition into students' inner lives. Engage the chair's results-only position at its strongest rather than as a caricature, and say plainly what is lost if we reject it. I would much rather have a committed recommendation with reasons I can argue from than a survey of the options.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion piece:

  1.  **Analyze the Request:**
      *   **Role:** Third-year philosophy student, member of the Beacon Prize committee.
      *   **Context:** Seminar on moral worth (Kantian-ish leanings: action has worth if moved by right-making considerations). Committee meeting this Thursday to decide between two nominees (Priya vs. Daniel).
      *   **The Conflict:** Committee split. Chair argues for consequentialism (measurable good, motives are private/unknowable). Dean's office argues for "character" (vague). User argues for moral worth based on motive (specifically, acting *because* it is right), but struggles with counterexamples (accidental right action, overdetermined motives).
      *   **The Task:** Draft a short written opinion to circulate before the meeting.
      *   **Requirements:**
          *   Recommend a concrete decision (Priya, Daniel, Neither, Split?).
          *   Propose a criterion for future nominations.
          *   Defend the motive-based criterion against the "inquisition" objection.
          *   Engage the Chair's results-only position charitably and explain what is lost if rejected.
          *   Tone: Committed, reasoned, philosophical but practical (not just theory), suitable for a committee memo.
          *   Constraint: No survey of options; take a stand.

  2.  **Deconstruct the Cases:**
      *   **Priya:** High impact (saved a life), high cost (burns). *Motive:* Instinctive ("legs just went"), mixed with vanity/fear of reputation ("dread at how it would look").
          *   *Philosophical Assessment:* On a strict Kantian view, acting on instinct or fear of shame lacks moral worth, even if the action is right. However, instinct can be cultivated virtue. The vanity aspect is problematic for "admirability."
      *   **Daniel:** Moderate/Long-term impact (tutoring, legal help). *Motive:* Principle ("simply not acceptable"), claims he would do it anonymously. *Outcome:* Tutoring didn't raise grades; legal help didn't change the eviction outcome (though it was reversed later).
          *   *Philosophical Assessment:* Motive seems aligned with duty/principle. Outcomes are negligible or luck-dependent.
      *   **The Chair's View (Consequentialism):** Priya wins hands down. Life saved > tutoring that didn't work/legal help that wasn't needed. Motives are irrelevant/unknowable.
      *   **The User's View (Moral Worth):** Daniel seems to have the better *motive* (principle vs. instinct/vanity), but the user is worried about the "inquisition" problem and the "overdetermination" problem.

  3.  **Formulate the Recommendation:**
      *   *Decision:* Awarding it to Priya validates luck and instinct over character. Awarding it to Daniel validates principle but ignores the lack of efficacy (and potential ineffectiveness).
      *   *Option A:* Award to Daniel. (Strongest fit for "moral worth" as discussed in seminar).
      *   *Option B:* Award to Neither. (If the bar is too high).
      *   *Option C:* Award to Priya. (If we prioritize the "Beacon" aspect of inspiring others through dramatic action).
      *   *Selection:* I need to take a stand. Given the user's seminar focus on *moral worth* (admirability of the agent), Daniel is the stronger candidate *philosophically*, even if Priya is the hero *narratively*. However, Priya's instinct might be interpreted as cultivated virtue. But her admission of vanity undermines the "admirable character" claim slightly more than Daniel's principled stand.
      *   *Wait, a nuance:* The prompt says the user argues for the view that worth comes from being moved by right-making considerations. Daniel explicitly states this ("simply not acceptable"). Priya admits to instinct and reputation management. Therefore, consistent with the user's seminar position, **Daniel** is the philosophically consistent choice, *provided* we can handle the "inefficacy" objection.
      *   *Alternative:* Split the prize? No, the prompt asks for a concrete decision.
      *   *Better Decision:* Award to **Daniel**, but reframe the justification. Or, perhaps, **withhold the prize this year** to signal that the criteria need work, but that feels like cop-out.
      *   *Best Decision:* Award to **Daniel**. Why? Because the prize is for "exemplary moral conduct," which implies *conduct* rooted in *character*, not just lucky outcomes. Priya's action was heroic, but her *moral worth* is ambiguous due to the motive. Daniel's action was principled, even if luck mitigated the outcome.
      *   *Actually, looking closer at Priya:* "My legs just went." This is often cited in philosophy (e.g., Julia Wolfson on moral luck, or Aristotelian habituation). If her instinct is trained virtue, it counts. But the vanity ("dread at how it would look") is the killer for the "moral worth" argument.
      *   *Looking closer at Daniel:* He acted on principle. The outcomes were nullified by luck. If we punish him for luck, we are consequentialists. If we reward him for the will, we are deontologists (roughly).
      *   *Decision:* I will recommend **Daniel**. It aligns best with the "moral worth" seminar theme and distinguishes the prize from a simple "Good Samaritan" award.

  4.  **Develop the Criterion:**
      *   Need to avoid the "inquisition" (mind-reading).
      *   Solution: Focus on **commitment in the face of cost/counter-pressure**, evidenced by **consistency** and **testimony of alignment with values**, rather than pure introspection.
      *   We can't see the mind, but we can see the *pattern*.
      *   Criterion: "Principled Resilience." Did the agent act because they judged it right, even when it was costly or ineffective?
      *   Addressing the Chair: Acknowledge that outcomes matter for *utility*, but this prize is for *character*. If we ignore motive, we reward luck.

  5.  **Drafting - Section by Section:**
      *   **Header:** To the Committee, From [Name], Re: Beacon Prize Decision & Criteria.
      *   **Opening:** State the recommendation clearly (Daniel).
      *   **Addressing the Chair (Consequentialism):** Acknowledge the strength. Outcomes are visible. Priya saved a life. But, if the prize is for *moral conduct* (agency), luck shouldn't decide. Priya got lucky she was strong enough; Daniel got unlucky his help wasn't needed. We shouldn't punish moral will for bad luck.
      *   **Addressing the Motive/Inquisition Objection:** How do we know motives? We look at **counterfactuals** and **consistency**. Daniel's tutoring is consistent (2 years). Priya's was a one-off instinct mixed with reputation fear. We judge motives by the *structure of the action*, not just the agent's confession.
      *   **The Seminar Connection:** Briefly touch on the "right-making considerations" view without getting bogged down in jargon.
      *   **Future Criterion:** Propose "Alignment of Will and Rightness." Look for evidence that the action flowed from a commitment to the value of the act itself, not just the result or the impulse.
      *   **Closing:** Reiterate the purpose of the Beacon.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is recommending Daniel too harsh on Priya? She burned her hands.
      *   *Fix:* Acknowledge Priya's heroism. She deserves *a* medal, perhaps a University Service Award. But the *Beacon* is specifically for "moral conduct/character." Distinguish the awards.
      *   *Critique:* The user is worried about the "overdetermination" problem (habit + vanity + principle).
      *   *Fix:* Address this in the criterion. We don't need a *pure* motive (which doesn't exist). We need the *dominant* motive to be principled. Daniel's testimony + consistency suggests principle. Priya's testimony suggests instinct + reputation.
      *   *Tone Check:* Needs to sound like a student who knows philosophy but is speaking to administrators and faculty. Respectful but firm.
      *   *Chair's Argument:* Make sure I don't strawman her. She says motives are unknowable. I need to argue they are *inferable* from behavior over time.

  7.  **Final Polish:**
      *   Ensure the distinction between "Right Action" and "Moral Worth" is clear.
      *   Make sure the recommendation is actionable.
      *   Check word count (keep it "short written opinion").

  8.  **Final Decision Logic:**
      *   **Winner:** Daniel.
      *   **Reason:** His action demonstrates *agency* rooted in *principle*, whereas Priya's demonstrates *heroism* rooted in *instinct/reputation*. The prize is for "conduct" (implies agency) and "exemplary" (implies emulation). We can emulate Daniel's commitment; we cannot easily emulate Priya's adrenaline instinct.
      *   **Criterion:** "Principled Commitment amidst Uncertainty."

  *(Self-Correction)*: Wait, if I recommend Daniel, I need to be careful about the "ineffectiveness" of his tutoring. The Chair will hammer that. I need to argue that *trying* to help is the moral bit, not the *grades*.
  *(Refinement)*: Actually, looking at the prompt again, the user is unsure whether to reward acts or agents. The prize is for "conduct by an undergraduate."
  *(Pivot)*: Maybe the boldest move is to **withhold the prize** and propose the new criteria for next year? No, the prompt asks for a recommendation on *which nominee*. Withholding might look like cowardice. I will stick with Daniel but qualify it heavily.
  *(Wait, one more thought)*: Priya's case is the "moral luck" case. Daniel is the "good will" case. If the user is arguing for the "moved by right-making considerations" view (Kantian), Daniel is the only logical choice. Priya explicitly *wasn't* moved by right-making considerations (she said "legs just went" and "dread of looking bad"). To vote Priya would betray the user's seminar position. To vote Daniel validates the seminar position but risks the "ineffectual" critique. I must defend Daniel's ineffectiveness as morally irrelevant to *worth*.

  Okay, let's write.

  *Structure:*
  1. Recommendation (Daniel).
  2. Defense against Chair (Outcomes vs. Agency).
  3. Defense against Inquisition (Inferring Motive).
  4. Proposed Criterion for Future.
  5. Conclusion.

  *Tone:* Academic but decisive.

  *Key Philosophical points to weave in:*
  - Moral Luck (Priya).
  - Good Will/Duty (Daniel).
  - Knowability of Motives (Behavioral evidence).
  - Distinction between Heroism and Moral Worth.

  *Let's go.*
answer: |-
  **TO:** The Beacon Prize Committee
  **FROM:** [Your Name], Student Member
  **DATE:** [Date]
  **SUBJECT:** Recommendation and Criteria for the Beacon Prize

  **Recommendation**
  I recommend that the committee award this year's Beacon Prize to **Daniel**.

  I make this recommendation reluctantly, acknowledging that Priya's actions were undeniably heroic and that her physical sacrifice exceeds anything Daniel has endured. However, the Beacon Prize is designated for "exemplary moral conduct," not "maximum utility" or "bravest act." If we award Priya, we reward a moment of instinct and luck. If we award Daniel, we reward a sustained commitment to principle. Given the Prize's mandate to highlight *character*, Daniel is the stronger candidate.

  **Engaging the Results-Only View**
  The Chair's position—that we should reward measurable good because motives are private—is the strongest alternative view. It offers clarity and avoids the discomfort of judging students' inner lives. We must acknowledge what is lost if we reject it: we lose the ability to distinguish between a lucky outcome and a good will.

  Priya saved a life, which is objectively better than Daniel's tutoring (which raised no grades) or his legal aid (which was rendered unnecessary by luck). But if the Prize is purely consequentialist, it becomes a lottery for opportunity. It rewards those who happen to be standing near a burning building over those who quietly labor against injustice with no guarantee of success. If we adopt the Chair's view, we tell students that moral value lies entirely in the *result*, which is often outside their control. We lose the ability to honor the *attempt* to do right when the world refuses to cooperate. The Beacon should signal that the *will* to do good has value independent of the outcome.

  **The "Inquisition" Objection and Inferable Motives**
  The obvious objection to my view is that it turns the committee into inquisitors, peering into souls we cannot see. The Dean's office warns against this, and rightly so. We cannot know with certainty why anyone acts.

  However, we do not need omniscience to make reasonable inferences. We judge motives not by confession, but by **pattern and cost**.
  1.  **Consistency:** Daniel's tutoring was a two-year commitment, not a singular adrenaline spike. Consistency suggests a value system rather than an impulse.
  2.  **Counterfactuals:** Daniel states he would have acted even if no one knew. While self-reported, this aligns with his low-profile tutoring. Priya explicitly admitted her action was mixed with a dread of reputational damage.
  3.  **Cost vs. Gain:** Daniel spent savings on a case that helped nothing materially. This is "inefficient" behavior unless explained by a commitment to principle. Priya's action, while costly physically, aligned with her role as safety officer (reputation management).

  We are not asking "What were you feeling?" We are asking, "Does the structure of this action suggest it was done *for the sake of the right*?" This is not mind-reading; it is behavioral analysis.

  **Proposed Criterion for Future Nominations**
  To resolve the tension between the Dean's vagueness and the Chair's rigid consequentialism, I propose we adopt the following criterion for "Exemplary Moral Conduct":

  > **The Principle of Principled Resilience:** *The Prize should recognize actions where the agent's commitment to a moral value is the primary explanation for the conduct, evidenced by persistence in the face of ineffectiveness, cost, or lack of recognition.*

  This criterion handles the "overdetermination" problem from our seminar. We do not require a *pure* motive (no vanity, no habit). We require that the moral principle be the *sustaining* reason.
  *   **Priya** fails this test not because she is not brave, but because her own account attributes the action to instinct and reputational fear, not a deliberative commitment to the value of the technician's life.
  *   **Daniel** passes because he acted on principle even when the *outcome* was nullified. He did the right thing *because* it was right, not because it worked.

  **Conclusion**
  If we award Priya, we celebrate a hero, which is fitting for a different award. If we award Daniel, we celebrate a moral agent. The Beacon Prize is meant to be a guide for character. We can all aspire to Daniel's principled commitment; we cannot all aspire to Priya's accidental heroism. Let us award the Prize to the will, not the luck.

  I look forward to discussing this on Thursday.
