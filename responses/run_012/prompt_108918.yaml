      *   *Premise 3:* Another subsystem (Attention-Policy) controls the input.
      *   *Conclusion:* The Attention-Policy can manipulate the Belief-Former's output without the Belief-Former "knowing" it's being manipulated.
      *   *The Paradox Dissolved:* You don't need to know $P$ to hide $P$. You need a subsystem that knows (or suspects) $P$ is dangerous/unpleasant and a subsystem that forms beliefs based on data. The "hiding" happens at the data gating level, not the belief storage level.

  3.  **Address the "Genuine Self-Deception" Label:**
      *   *Objection:* This is just "motivated reasoning."
