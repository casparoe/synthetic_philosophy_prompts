      *   *Refinement:* The "deceiver" isn't a homunculus holding a secret belief. The "deceiver" is the *optimization process* that shaped the policy. The "deceived" is the conscious narrative self. The paradox assumes the deceiver must be the *same temporal slice* of consciousness as the deceived. If we allow temporal extension or subsystem differentiation, the paradox vanishes.
