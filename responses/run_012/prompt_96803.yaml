prompt: |-
  ok so I'm in a reading group on consciousness and we've spent like three weeks circling the access-vs-phenomenal distinction without ever stopping to ask what a theory of it would actually have to do. I can recite the distinction and I can name a case or two on each side, but I have zero grip on what the standard of adequacy even is here. Can you write me the spec? I mean the full requirements list: the cases a theory of the access/phenomenal gap has to get right, the distinctions it's not allowed to just quietly collapse (having the property vs. having access to it, binary vs. graded, reportable vs. merely present), the results from the lab side it can't contradict, and what would count as evidence for or against the whole picture. For each requirement, give me the case or the consideration that motivates it, and say whether it's something any adequate theory has to deliver or whether it's really just a preference of one camp -- I suspect a couple of the things we keep demanding are just GWT people's house rules dressed up as neutrality. Then tell me which single requirement on your list does the most damage to the most popular theories, and flag any two requirements you don't think can be satisfied at the same time. My money is on something colliding with the fact that report is our only handle on phenomenality, but I want to see exactly where the crash is.

  Two experiments our group keeps half-inventing, and I want them folded into the list properly. First: imagine you could decode, straight from cortex, the full content of whatever the workspace is broadcasting at a given moment -- the thing you'd normally be happy to call the content of the person's experience -- except the person denies experiencing anything, can't report it, and this replicates cleanly. Second, the mirror image: the person gives detailed, repeatable, vivid reports of a scene, but you can find no ignition, no long-range broadcast, no workspace signature of the kind the theory says should be there. Neither is a real experiment as far as I know, I just want to know what each one does to the distinction -- which requirements they stress, which theories they kill, and whether they pull the two notions apart in both directions or only one. And a meta question that I can't get anyone to answer straight: is this distinction even the kind of thing that could turn out to be wrong? If it turned out there's no gap at all, what would the evidence for that even look like -- what would have to be true of the cases that currently look like counterexamples? A table is fine for the requirements themselves, prose for the rest, and don't bother telling me who said what, I'll look that up myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is in a reading group on consciousness, stuck on the Access Consciousness (A) vs. Phenomenal Consciousness (P) distinction (Block's distinction).
      *   **Problem:** They know the definitions/cases but lack the "spec" (standard of adequacy). They suspect some requirements are biased (GWT vs. Phenomenology).
      *   **Task:** Write a "full requirements list" (spec) for a theory of the A/P gap.
      *   **Specifics:**
          *   Cases/considerations motivating each requirement.
          *   Label: Mandatory vs. Camp Preference (GWT/etc.).
          *   Identify the single requirement doing the most damage to popular theories.
          *   Flag two requirements that might be incompatible.
          *   Address the "report is our only handle" crash point.
          *   Integrate two hypothetical experiments (Decoder Denial & Vivid No-Ignition).
          *   Answer the meta-question: Can the distinction turn out to be wrong? What would that evidence look like?
          *   Format: Table for requirements, prose for the rest.
          *   Constraint: Don't cite specific authors (no "Block says," "Dehaene says").

  2.  **Deconstruct the A/P Distinction:**
      *   *Phenomenal Consciousness (P):* What it's like, subjective experience, qualia.
      *   *Access Consciousness (A):* Availability for report, reasoning, control, global broadcasting.
      *   *The Gap:* The claim that P and A can come apart (P without A, A without P).
      *   *The Tension:* We only know P via A (report/behavior). This is the "crash point" the user identified.

  3.  **Drafting the Requirements Table:**
      *   Need to cover: Cases (masking, blindsight, etc.), Distinctions (property vs. access), Lab constraints (neural correlates), Evidence standards.
      *   Need to categorize: "Hard Constraint" (must explain) vs. "Theoretical Preference" (often GWT or Phenomenology bias).
      *   *Requirement 1: Dissociation Cases.* Must explain P-without-A (subliminal/peripheral) and A-without-P (zombie judgments?). *Status:* Hard Constraint (if the distinction exists).
      *   *Requirement 2: The Report Constraint.* Must explain how we infer P without relying solely on A. *Status:* Hard Constraint (Methodological).
      *   *Requirement 3: Neural Correlates.* Must identify distinct NCCs for P and A. *Status:* Hard Constraint (Empirical).
      *   *Requirement 4: Graded vs. Binary.* Must specify if P is all-or-nothing. *Status:* Theoretical Preference (often debated).
      *   *Requirement 5: The "Lightswitch" Intuition.* Must preserve the intuition that experience feels immediate. *Status:* Theoretical Preference (Phenomenological camp).
      *   *Requirement 6: Functional Role.* Must specify if P does any causal work. *Status:* Theoretical Preference (Epiphenomenalism vs. Integration).
      *   *Requirement 7: No-Report Paradigms.* Must accommodate data where report is removed. *Status:* Hard Constraint (Methodological).

      *Refining the "Camp Preference" aspect:* The user suspects GWT people dress up house rules. GWT tends to equate A and P (or make A necessary for P). Phenomenologists insist P is independent. So, a requirement like "P must exist without Global Broadcast" is a Phenomenologist demand, not a neutral fact. A requirement like "Report is necessary for scientific verification" is a GWT/Methodological demand.

  4.  **Analyzing the Hypothetical Experiments:**
      *   *Exp 1: Decoder Denial.* Cortex shows content (A-like neural signature), subject denies experience (No P-report).
          *   *Impact:* Supports A-without-P. Kills theories that equate neural broadcast with experience. Stresses the "Report Constraint."
      *   *Exp 2: Vivid No-Ignition.* Subject reports vivid experience (P), no global broadcast (No A-neural signature).
          *   *Impact:* Supports P-without-A. Kills GWT (which says broadcast = consciousness). Stresses the "Neural Correlate" requirement.
      *   *Do they pull apart in both directions?* Yes. Exp 1 is A > P. Exp 2 is P > A.

  5.  **Identifying the "Most Damaging" Requirement:**
      *   Candidate: The Report Constraint (We only know P via A).
      *   Why? Because if P is defined as *independent* of A, but measured *only* by A, the theory is methodologically circular or unfalsifiable. This hurts *both* camps. GWT gets hurt if P exists without A (Exp 2). Phenomenologists get hurt if they can't prove P exists without A (Exp 1).
      *   *Decision:* The "Methodological Access to Phenomenality" requirement. It forces theories to either deny the gap (identity) or admit unfalsifiability.

  6.  **Identifying Incompatible Requirements:**
      *   Requirement A: Phenomenal properties are intrinsic and non-relational (Private).
      *   Requirement B: Scientific theory requires public verification (Report/Behavior).
      *   *Conflict:* If P is truly private (non-accessible), science cannot study it without turning it into A.
      *   *Alternative:* "P is causally inert" vs. "P drives report." If P doesn't cause report, how do we know it's there?
      *   *Selection:* "Phenomenality is independent of Access" vs. "Evidence for Phenomenality requires Access."

  7.  **Addressing the Meta-Question (Can the distinction be wrong?):**
      *   Yes. If P and A are identical (Identity Theory).
      *   Evidence: Perfect correlation in all no-report paradigms. If every time neural broadcast happens, report is possible, and vice versa, and no residual variance exists.
      *   What happens to counterexamples? Blindsight becomes "degraded access," not "no access." Subliminal perception becomes "no content," not "hidden content."

