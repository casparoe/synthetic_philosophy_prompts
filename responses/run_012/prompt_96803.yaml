      *   *Check Constraints:* Did I avoid naming names? Yes. Did I include the two experiments? Yes. Did I answer the meta-question? Yes.
      *   *Self-Correction on "Camp Preference":* Be careful not to validate the user's suspicion too much (that GWT is just bias) but acknowledge it. Some "requirements" are indeed theoretical commitments disguised as data constraints.
      *   *Refining the "Crash Point":* The user thinks the crash is "report is our only handle." I need to confirm this and show *why* it breaks the theories. It breaks the *dissociation* claim specifically.

  9.  **Final Polish:** Check the "Most Damaging" and "Incompatible" sections for clarity. Ensure the hypothetical experiments are woven in logically. (Self-correction: Make sure the table clearly distinguishes between 'Mandatory' and 'Contested/Preference').

  *(Self-Correction during drafting the table)*: I need to make sure I don't just list "Explain Blindsight." I need to list the *requirement* that motivates it, e.g., "Account for dissociation cases."
  *(Self-Correction on Experiments)*: Ensure I explicitly state which theories die. Exp 1 (Decoder Denial) hurts theories that say Neural Broadcast = Experience. Exp 2 (Vivid No-Ignition) hurts GWT.
  *(Self-Correction on Meta)*: Be precise about what "wrong" means. It means the distinction is a conceptual error, not just an empirical falsehood.

