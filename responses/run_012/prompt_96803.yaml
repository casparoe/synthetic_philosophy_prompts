answer: |-
  ### The Spec: Requirements for a Theory of the Access/Phenomenal Gap

  You are right to suspect that much of the debate involves one side treating their theoretical commitments as methodological necessities. Below is the requirements list stripped of the rhetoric.

  | # | Requirement | Motivating Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Dissociation Capacity** | Must explain how *Phenomenal* (P) can exist without *Access* (A) (e.g., peripheral vision, iconic memory) AND how A can exist without P (e.g., blindsight, subliminal priming). | **Mandatory** (If the distinction is real) |
  | **2** | **The Report Constraint** | Must explain how we verify P exists when the only tool we have to verify it is A (report/behavior). If P is defined as independent of A, the method of detection (A) must not constitute the phenomenon. | **Mandatory** (Methodological) |
  | **3** | **Distinct Neural Signatures** | Must identify neural correlates for P that are separable from neural correlates for A (e.g., posterior vs. frontal activity, or local vs. global broadcast). | **Mandatory** (Empirical) |
  | **4** | **No-Report Compatibility** | Must accommodate data from "no-report" paradigms (e.g., eye-tracking, pupil dilation, neural decoding) where the subject does not explicitly report, to avoid conflating the report mechanism with the experience. | **Mandatory** (Methodological) |
  | **5** | **The "Ignition" Condition** | Must specify whether long-range, global neural broadcasting is *necessary* for P. (Does consciousness require workspace ignition?) | **Contested** (GWT Preference) |
  | **6** | **Richness vs. Sparsity** | Must specify if P is rich/dense (we experience more than we can report) or sparse (we only experience what we attend/access). | **Contested** (Phenomenology Preference) |
  | **7** | **Causal Efficacy** | Must specify if P plays a causal role in generating the report of P, or if P is epiphenomenal to the access mechanisms that generate the report. | **Contested** (Metaphysical Preference) |
  | **8** | **Binary vs. Graded** | Must specify if P is an all-or-nothing state (lightswitch) or a graded magnitude (dimmer switch), and if A shares the same structure. | **Contested** (Theoretical Preference) |

  ***

  ### The Hypothetical Experiments

  You asked to fold these into the spec. These are not just thought experiments; they are the stress tests for Requirements #1, #3, and #5.

  **Experiment 1: The Decoder Denial (A without P)**
  *   **The Setup:** You decode specific content (e.g., "face of a dog") from global workspace ignition patterns in the cortex. The subject, via button press, consistently reports "I saw nothing" or "I guessed."
  *   **What it stresses:** This targets **Requirement #2 (Report Constraint)** and **Requirement #5 (Ignition Condition)**.
  *   **The Damage:**
      *   **Kills:** Any theory that equates Global Workspace Ignition *directly* with Phenomenal Experience. If the broadcast is there but the "what it's like" is denied, then broadcast is Access, not Phenomenality.
      *   **The Trap:** To save the theory, proponents must claim the subject is lying or mistaken about their own experience. This violates the first-person authority usually granted in these debates. If you override the subject's report with the decoder, you have redefined P as "what the decoder sees," which collapses P back into a third-person Access measure.
      *   **Direction:** This pulls A and P apart in the direction of **Access > Phenomenal**.

  **Experiment 2: The Vivid No-Ignition (P without A)**
  *   **The Setup:** Subject gives vivid, confident, repeatable reports of a complex scene. fMRI/EEG shows no global ignition, no frontal-parietal broadcast, only local sensory activity.
  *   **What it stresses:** This targets **Requirement #1 (Dissociation)** and **Requirement #5 (Ignition Condition)**.
      *   **The Damage:**
      *   **Kills:** Global Workspace Theory (GWT) in its standard form. GWT posits that ignition *is* the mechanism of conscious access. If vivid experience exists without ignition, then ignition is not necessary for consciousness.
      *   **The Trap:** Proponents must claim the report is "post-hoc confabulation" (the subject didn't really see it, they just guessed well). But if the report is vivid and repeatable, calling it confabulation starts to look like moving the goalposts to protect the theory.
      *   **Direction:** This pulls A and P apart in the direction of **Phenomenal > Access**.

  **Do they pull apart in both directions?**
  Yes. Exp 1 suggests you can have the neural machinery of access without the feeling. Exp 2 suggests you can have the feeling without the neural machinery of access. If *both* results obtained, the distinction would be empirically robust but theoretically catastrophic: P and A would be completely decoupled, making a unified science of consciousness nearly impossible.

  ***

  ### The Crash Point: The Most Damaging Requirement

  The single requirement that does the most damage to the most popular theories is **Requirement #2: The Report Constraint.**

  **Why:** It creates a methodological circle that almost every theory fails to close.
  *   **The Problem:** We define Phenomenal Consciousness (P) as *private* and *intrinsic*. We define Access (A) as *public* and *functional* (report). We claim P and A can dissociate. However, the *only evidence* we ever accept for the presence of P is A (the subject telling us they have P).
  *   **The Damage to GWT:** If GWT says A = P (or A is necessary for P), they struggle with Exp 2 (Vivid No-Ignition). They have to deny the phenomenology based on the neural data, effectively saying "You think you're conscious, but you're not."
  *   **The Damage to Phenomenal-Realists:** If they say P exists without A, they struggle with Exp 1 (Decoder Denial). They have to assert P exists even when the subject says it doesn't, based on... what? If they rely on the decoder, they've turned P into a third-person access variable. If they rely on the subject's denial, they admit P is absent.
  *   **The Crash:** You cannot scientifically validate a dissociation between X and Y if your only measure of X is Y. To prove P exists without A, you need a measure of P that isn't A. We don't have one. Every "no-report" paradigm (pupil dilation, etc.) is still an *access* channel (information available to the experimenter).

  ***

  ### The Incompatible Pair

  The two requirements that cannot be satisfied simultaneously are **Requirement #1 (Dissociation Capacity)** and **Requirement #2 (The Report Constraint).**

  *   **Requirement #1** demands that P can exist independently of A (otherwise there is no gap, just one thing).
  *   **Requirement #2** demands that we only know P exists via A (report/behavior).
  *   **The Conflict:** If you satisfy #1 (P is truly independent), you violate #2 (you can't measure it without turning it into A). If you satisfy #2 (you measure P strictly via report), you violate #1 (you have made P dependent on A for verification).
  *   **Resolution:** Theories resolve this by cheating. They either treat report as a perfect proxy (collapsing the gap) or they treat intuition/philosophy as a proxy (ignoring the measurement problem). There is currently no clean empirical solution.

  ***

  ### Meta-Question: Can the Distinction Turn Out to Be Wrong?

  Yes. The distinction is a theoretical hypothesis, not a brute fact. It can turn out to be wrong in the same way the "phlogiston" distinction turned out to be wrong.

  **What would the evidence look like?**
  For the distinction to be wrong, **Perfect Correlation** would need to hold across all dissociation cases, once measurement noise is accounted for.
  1.  **Blindsight:** Would have to be reclassified as "Degraded Access" rather than "No Access + Experience." The subject isn't experiencing without access; they have weak access they mistrust.
  2.  **Subliminal Perception:** Would have to be reclassified as "No Experience." The processing is happening, but there is no "light on" inside.
  3.  **Change Blindness:** Would have to be reclassified as "No Experience of the unattended item." We don't have a rich phenomenology we lose access to; we simply don't experience what we don't access.

  **The "Identity" Scenario:**
  If it turns out there is no gap, the evidence would show that whenever the neural correlates of Access (global broadcast, report capability) are present, Phenomenality is present, and vice versa. Any apparent case of P-without-A would be shown to rely on a hidden form of A (e.g., a micro-saccade, a latent memory trace). Any apparent case of A-without-P would be shown to be automatic processing without subjective endorsement.

  If this were true, the "Phenomenal" concept would not refer to a separate property, but simply to the *first-person perspective on Access*. The distinction would dissolve into a single natural kind: **Conscious Access.** The reason we feel there is a gap is not because there are two things, but because knowing about a process (Access) feels different from the process itself. That would make the A/P distinction a conceptual error, not an empirical discovery.
