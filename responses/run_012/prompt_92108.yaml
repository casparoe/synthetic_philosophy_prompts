answer: |-
  You and your mate have stumbled onto the "extensional equivalence" problem. It's the biggest headache in contemporary epistemology. Both Pragmatic Encroachment (PE) and Contextualism predict that knowledge ascriptions will fail in high-stakes scenarios, so they usually look identical in practice.

  To pull them apart, you need a scenario where the **Subject's stakes** and the **Attributor's stakes** come apart.

  Standard PE (often called Subject-Sensitive Invariantism) says knowledge depends on the *Subject's* practical situation. Contextualism says the truth of "S knows" depends on the *Attributor's* conversational context (which includes their stakes).

  Here is a case that avoids banks and airports, puts the skin in the game on the *Attributor*, and forces the two theories to give opposite truth values.

  ### The Case: The Forager and the Botanist

  **The Subject (S):** A professional botanist is leading a nature walk. She identifies a mushroom as a Morel. For her, the stakes are low. If she is wrong, she just has to apologize to the tour group and look slightly unprofessional. Her evidence is strong (she's an expert, checked the spore print, etc.), but not absolute (there's a 0.1% chance of a rare genetic mimic).

  **The Attributor (A):** A desperate forager is hiding in the bushes watching the tour. He is starving and has a severe, lethal allergy to the False Morel (the mimic). He plans to eat whatever the botanist identifies. For him, the stakes are life-or-death.

  **The Claim:** The forager turns to his companion and whispers: *"She **knows** that's a Morel."*

  ### How the Theories Diverge

  **1. Pragmatic Encroachment (Subject-Sensitive Invariantism)**
  *   **The Logic:** Knowledge is a function of the *Subject's* justification and the *Subject's* practical environment. The Botanist faces low risk. Her evidence is sufficient for *her* practical needs (giving a tour).
  *   **The Verdict:** The Botanist **does know**.
  *   **The Claim's Truth Value:** **True.** (Even though the Forager would be crazy to act on it, the Botanist genuinely possesses knowledge).

  **2. Contextualism**
  *   **The Logic:** The word "knows" is indexical (like "here" or "tall"). Its semantic content shifts to match the *Attributor's* conversational context. The Forager is in a life-or-death context. Therefore, the standard for "knows" in his mouth is raised to "must rule out lethal possibilities." The Botanist hasn't ruled out the 0.1% mimic chance.
  *   **The Verdict:** The standard for "knows" is too high for the Botanist to meet *in this conversation*.
  *   **The Claim's Truth Value:** **False.** (The Forager cannot truthfully say she "knows" because the word means something stricter in his high-stakes mouth).

  ### Which side does this lean toward?

  This example leans toward **Contextualism**.

  **Here is why:**
  The Pragmatic Encroachment view forces us to accept a kind of "spooky action at a distance." It implies that the Botanist's epistemic state (a fact about her mind, her evidence, and the world) is secure, *unless* a stranger in the bushes decides to bet his life on it. If PE is true, the Forager's hunger literally reaches out and severs the Botanist's knowledge connection to the world, even though she doesn't know he exists.

  That feels metaphysically weird. Knowledge seems like it should be a property of the *Subject*, not something vulnerable to the private gambles of observers.

  Contextualism avoids this weirdness. It says the Botanist's state hasn't changed at all. She still has the same evidence and the same justification. What has changed is the **tool** the Forager is using to describe her. By using the word "knows" in a life-or-death context, he is unconsciously tightening the definition of the word to match his need for certainty. He isn't describing a change in *her*; he is describing a change in *his requirements*.

  **The Knockout Punch:**
  If the Forager says, "She knows," and he eats the mushroom and dies, we want to say he made a mistake.
  *   **PE says:** He spoke the truth ("She knows" is True), but acted irrationally.
  *   **Contextualism says:** He spoke falsely ("She knows" is False in his context), which explains why his action was based on a falsehood.

  It is more intuitive to say the Forager was *wrong* to think she knew (given his stakes) than to say he told the truth but was crazy to trust it. Contextualism captures the intuition that "knows" is a guarantee of safety for action, and that guarantee shifts depending on who is giving it and why.
