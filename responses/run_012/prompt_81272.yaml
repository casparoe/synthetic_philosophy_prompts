prompt: |-
  I'm putting together questions for a small podcast episode, and next week's guest is a political theorist who's just published a book arguing that Rawls's later liberalism is basically his early theology with the theology scraped off. Her line is that the Princeton senior thesis on sin and faith and the short late piece he wrote about his own religion are the key to everything: the anti-Pelagian thing, the idea that you can't save yourself by your own efforts, gets secularized into the rejection of moral desert and the arbitrariness of the natural lottery, and his conviction that belief isn't something you can just decide or be argued into becomes the reason he wants religion kept out of the coercive machinery of the state. I'm sympathetic, but I dont want to hand her a soft interview.

  Give me eight to ten questions, in the order I should ask them, that go after the actual substance instead of letting her restate the thesis. I want at least one on whether the continuities she's pointing to are real continuities or just a family resemblance that gets weaker the more you look at the middle period; one on whether the early theology can survive translation into a secular political doctrine or whether it collapses into something else once grace and sin are off the table; one on whether the burdens of judgment are doing the work original sin used to do, and what's lost if they are; one on the abolitionists and the civil rights movement, since Rawls seems to give religiously grounded political argument a lot more room there than his strict public reason story would suggest, and I want to know what she does with that; one on the proviso and whether it's a genuine accommodation or just a delay; and one on whether a religious citizen who can't come up with a secular translation of her reasons is being asked to shut up, and if so whether that's a real problem or just the cost of living together. For each question, give me the answer she's most likely to give and a follow-up that keeps the pressure on.

  Two more things. First, since I'll be asking these out loud and I don't want to look like an idiot, mark for each question whether the thing it assumes is actually settled among people who work on Rawls or whether it's genuinely contested — especially anything about what he did or didn't believe personally, and anything about the proviso, since I have a feeling that's where the disagreements live. Seperate the two clearly and don't let a contested reading of the early material get presented as if everyone agrees on it. Second, if any of my framing above is itself a contested reading rather than something Rawls scholars would mostly accept, say so up front rather than building questions on it.
