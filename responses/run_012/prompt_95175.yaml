prompt: |-
  Right, so I'm putting together a reading group on expected value fanaticism and I want a ranking I can actually argue with, not a recap of who said what. Quick setup so we're on the same page: expected value theory says take the act with the highest expected value; the fanatic says that means you should be willing to pay any finite cost for a small enough chance of a big enough payoff, and if payoffs can be arbitrarily large then no finite chance of one is ever negligible. Below are the usual repairs. Rank them by how much of the fanatic's conclusion they actually kill — most deflationary first, least last — with a sentence or two each on what's doing the work and what it costs you. Bracket any two you think are level, and flag any two that are the same move in different clothes.

  1. A probability floor: outcomes below some probability (say 10^-30) get treated as impossible and can't drive the expected value.
  2. A bounded utility scale: keep maximising expected value, but cap how good the best outcome can be, or use a utility function that grows logarithmically, so more good stuff always helps but with diminishing punch.
  3. Unbounded but not infinite: no outcome counts as infinitely good, though arbitrarily large finite ones are fine.
  4. Probability weighting: don't plug probabilities in straight, transform them first — overweight middling ones, squash or zero out tiny ones.
  5. A grounding requirement: a tiny probability can only drive action if it's independently checkable, from a theory with a track record or from something you can test, so the mugger's own say-so doesn't count.
  6. Bite the bullet: nothing to repair, the fanatic is right and our intuitions are what's broken.

  Then run all six against three cases and tell me where you'd still be taking the bet: (A) a 1-in-10^40 chance of an outcome better than every human life there's ever been, where the probability comes from a well-tested physical theory; (B) same numbers, but the estimate comes from a stranger who gains if you take the bet; (C) same numbers again, except the good outcome is only good because you took the bet — your taking it is what brings it about, so you can't check the probability independently of deciding.

  Finally, if you had to keep expected value theory recognisable — still additive, still built out of probabilities and utilities — which one would you actually bet on, and whats the thing you'd be most worried you've given up? American English please, and no need to tell me who said what, I want your own reasoning.
