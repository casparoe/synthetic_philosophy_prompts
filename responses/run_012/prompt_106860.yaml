prompt: |-
  I'm a high school student taking a course on the history of mathematics, and I've been reading a translation of an old foundational paper on the theory of sets. There's a passage near the beginning that I can't get past, and I'd like help understanding it. My rough rendering of the passage goes like this: if we take a set of objects and perform an act of abstraction in which we disregard both the particular nature of the individual objects and the order in which they are given, then what remains is a general concept that applies to exactly those sets that can be put into one-to-one correspondence with the original set. The author calls this general concept the cardinal number of the set.

  I understand the one-to-one correspondence part well enough — that's just the idea that two sets have the same size if their members can be paired off. But the abstraction part is opaque to me. Is the cardinal number supposed to be a feature of the set itself, or is it a mental construct produced by the act of abstraction? If it's a mental construct, in what sense is it general? And why is it necessary to disregard the order of the elements if cardinal numbers are only supposed to capture size? My teacher mentioned that this definition was controversial when it was first proposed, but she didn't explain why, and now I'm curious whether the controversy was mathematical or philosophical. I'd like a careful walkthrough of what the passage is claiming, what work the notion of abstraction is doing, and what assumptions about mathematical objects and concepts the author seems to be making. I don't need citations or suggestions for further reading — just an explanation that helps me see why the definition is phrased this way.
