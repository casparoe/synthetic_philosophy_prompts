  ### Adjudication of the Exchange

  **(1) Ana: Partly Right.**
  Ana correctly identifies the standard risk of hybrid views: if moral sentences possess truth-conditional content, they risk collapsing into cognitivism (the view that moral judgments are beliefs about facts). Her point about disagreement is also strong; if two speakers share the same truth-conditional content but differ in commitment, the view struggles to locate the disagreement within the semantics. However, she assumes without argument that "truth-conditional content" must necessarily be "descriptive facts," which Ben challenges in the next turn.

  **(2) Ben: Partly Right.**
  Ben offers a necessary clarification: the truth-conditional layer tracks "commitment-roles" rather than moral facts. This attempts to preserve expressivism by making the practical commitment fundamental. However, his description of this layer as a "representational bookkeeping device" creates ambiguity. If it represents commitment-roles, it is unclear how it functions as *truth-conditional* content in the standard sense without implicitly reifying those roles into facts, leaving Ana's initial worry unresolved.

  **(3) Ana: Clearly Right.**
  Ana presents a decisive dilemma regarding the Frege-Geach problem. If the commitment is part of the meaning, embedded sentences (like antecedents) must express that commitment (raising the question of how one expresses a commitment without asserting it). If the commitment is not part of the meaning, the view loses its expressivist core. This accurately captures the structural tension in the draft's proposal: it cannot easily have it both ways without explaining the mechanism of "hypothetical commitment" semantically.

  **(4) Ben: Partly Right.**
  Ben's appeal to suppositional reasoning is a plausible way to explain validity (modus ponens) within an expressivist framework. He correctly notes that accepting the premises leads to the commitment of the conclusion. However, this explains *validity* (inference) rather than *compositionality* (semantics). He does not explain how the "commitment-role" semantically combines with logical operators, which is the core of Ana's objection in turn (5).

  **(5) Ana: Clearly Right.**
  Ana identifies a critical equivocation in Ben's defense. She notes that Ben slides between treating the truth-conditional layer as ordinary content (which implies cognitivism) and as "commitment-role" content (which lacks standard truth-conditions). Her negation objection is particularly damaging: if the content is invariant, the view struggles to distinguish between internal negation ("Lying is not wrong") and external negation ("It is not the case that lying is wrong"), a standard failure point for expressivist hybrids.

  **(6) Ben: Partly Right.**
  Ben attempts to solve the negation problem by defining negation as a higher-order commitment operator. While this is a coherent theoretical move, it conflicts with the draft's summary claim that the truth-conditional content is *invariant* across contexts. If negation changes the commitment-role, the content is not strictly invariant in the way required for standard truth-functional composition. He preserves the expressivist spirit but strains the semantic machinery described in the summary.

  **(7) Ana: Clearly Right.**
  Ana correctly summarizes the cumulative force of her objections. She highlights that the view lacks a stable definition of "content." If the content is truth-conditional in the ordinary sense, the view is cognitivist; if it is commitment-based, it lacks the compositionality required to solve Frege-Geach. Her conclusion that the proposal is an "unstable hybrid" follows logically from the inconsistencies exposed in the previous turns.

  ***

  ### Central Question: Solution, Cognitivism, or Unstable Hybrid?

  Based on the materials provided, **stratified expressivism is an unstable hybrid.**

  The draft attempts to solve the Frege-Geach problem by splitting moral sentences into two layers: a truth-conditional layer for logic and a commitment layer for practical force. However, the exchange reveals that these layers are not successfully integrated.
  1.  **If the truth-conditional layer is robust:** As Ana argues, if this layer carries invariant content that supports truth-functional embedding, it functions exactly like propositional content in cognitivism. The "commitment" layer becomes an add-on that does no semantic work (epiphenomenal), failing to capture the essential expressivist claim that moral judgments are practical.
  2.  **If the commitment layer is fundamental:** As Ben argues, if the content is actually a "commitment-role," it is unclear how this bears truth-conditions or composes with logical operators like negation without becoming a disguised form of fact-talk. Ben's defense shifts definitions to accommodate objections (e.g., redefining negation as a commitment operator), which suggests the semantic theory is not fixed but ad hoc.

  Because the view relies on an equivocal notion of "truth-conditional content" (sometimes meaning descriptive facts, sometimes meaning commitment-roles) to do the heavy lifting, it fails to securely occupy the middle ground. It collapses into cognitivism when explaining embedding and relies on unexplained expressivist mechanisms when explaining disagreement.

  ***

  ### What Both Parties Are Missing

  **What the Defender (Ben/Draft) Needs to Add:**
  To make the view coherent, the defender must provide a **formal semantics for "commitment-roles."** It is insufficient to label the content as "commitment-role content"; they must demonstrate mathematically or logically how these roles combine under truth-functional operators (specifically negation and conditionals) without invoking descriptive facts. They need to explain the metaphysics of "hypothetical commitment": how can a practical stance be "supposed" in a way that contributes to truth-conditions without becoming a belief? Finally, they must clarify the relationship between the two layers: does the commitment layer *supervene* on the truth-conditional layer, or are they identical?

  **What the Opponent (Ana) Needs to Concede:**
  Ana should concede that **truth-conditional content does not logically entail descriptive cognitivism.** It is theoretically possible to assign truth-values to non-cognitive states (e.g., satisfaction conditions for plans or commitments) without positing moral facts. If the defender can show that "commitment-roles" have a logic isomorphic to truth-functional logic, Ana's claim that the view *must* be cognitivism would fail. She also needs to acknowledge that separating "content" and "force" is a standard linguistic distinction; the mere existence of a content layer does not automatically refute expressivism if that content is defined non-descriptively.
