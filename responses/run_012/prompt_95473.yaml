      *   *Refining the User's Hypothesis:* The "Metaphysical vs. Normative" split is good, but it misses the *Statistical/Inferential* layer. The real fight is about **Bayesian Priors**. Adaptationists assume $P(Adaptation) \gg P(Byproduct)$ absent proof. Critics assume $P(Byproduct) \ge P(Adaptation)$ absent proof. The "Skyhook" charge is a reaction to seeing a high prior as magic. The "Just-So" charge is a reaction to seeing a high prior as untested.

