      *   *Weaknesses/Refinements:* It might be too charitable to the adaptationists regarding metaphysics. Most adaptationists *aren't* greedy reductionists in the ontological sense (they don't deny emergent properties exist); they are *explanatory* reductionists (they believe selection is the primary *cause* of complexity). The conflict isn't just metaphysics vs. method; it's about *default assumptions* in inference.
