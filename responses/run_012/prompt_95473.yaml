  3.  **Formulate the Diagnosis:**
      *   **Is it substantive?** Yes, but not about *whether* selection happens. It's about the *prior probability* assigned to adaptation vs. constraint in the absence of definitive evidence.
      *   **Is it verbal?** Partially. "Adaptationism" is used differently (strong vs. weak).
      *   **Is it hidden empirical?** Yes. It's about the *distribution* of traits in nature. Are most traits optimized? Or are most traits constraints/byproducts? We don't have a census.
