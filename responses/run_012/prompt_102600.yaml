  # JOINT STATEMENT ON THE UTILITY MONSTER AND THE STRUCTURE OF WELFARE AGGREGATION

  **Date:** October 26, 2023
  **Parties:** The Aggregationist Camp (AC) & The Criterion-Reviser Camp (CRC)
  **Facilitated by:** [Your Name/Outlet]

  ## PREAMBLE

  We, the undersigned representatives of the Aggregationist and Criterion-Reviser camps within consequentialist ethics, acknowledge a persistent stalemate regarding the "Utility Monster" objection. We recognize that our debate has frequently stalled due to divergent assumptions about the setup of the thought experiment, the nature of welfare measurement, and what constitutes a valid theoretical response. This document establishes a shared framework to isolate our genuine disagreement from verbal disputes and background assumptions. We specifically address the "One-Way Monster" variation to test the limits of welfare commensurability.

  ## I. AGREED CLAIMS

  The following claims are accepted by both camps as the necessary background for this dispute. Signing this document indicates acceptance of these stipulations.

  1.  **The Standard Monster (SM) Stipulation:** The SM scenario posits a being capable of converting any given resource into significantly more welfare (utility) than any ordinary human can. In the SM case, the Monster's gain in welfare outweighs the aggregate loss in welfare suffered by the humans deprived of those resources. Both camps agree this scenario is conceptually possible within the logic of the theory, even if empirically unlikely.
  2.  **The One-Way Monster (OWM) Stipulation:** The OWM is a being constitutionally incapable of suffering (negative welfare). Every moment of its existence possesses positive welfare, with no upper ceiling on intensity. Both camps agree that the OWM scenario tests whether "welfare" is a symmetric scale (where gains and losses are comparable opposites) or an asymmetric one.
  3.  **Common Currency Requirement:** For the SM argument to function as a critique of *aggregation*, it must be assumed that the Monster's welfare and the humans' welfare are measured in a common currency. Both camps agree that if the Monster's welfare is *incommensurable* with human welfare, the SM is not a counterexample to aggregation but a category error. Therefore, the dispute presupposes that inter-personal comparisons of welfare are at least theoretically meaningful.
  4.  **The Measurement Assumption:** Both camps agree that the OWM exposes a hidden assumption in the SM: that a being without negative welfare can still occupy the same scalar dimension as beings with negative welfare. We agree that if welfare is vector-like (having direction/valence) rather than scalar, the "sum" requires a rule for combining positive-only vectors with mixed vectors.
  5.  **What Is Not a Solution:**
      *   Denying the logical possibility of the Monster without empirical justification counts as changing the subject.
      *   Arguing that the Monster would be "unhappy" in a non-welfare sense (e.g., morally corrupt) counts as changing the subject.
      *   Invoking rule-consequentialist side-constraints to ban feeding the Monster counts as changing the subject (this is a CRC victory condition, not a neutral premise).
  6.  **The Burden of Intuition:** Both camps agree that the SM triggers a robust negative moral intuition (revulsion at sacrificing humans for the Monster). The disagreement is not about the *existence* of this intuition, but about its *epistemic weight*.
  7.  **OWM Specific Agreement:** Regarding the One-Way Monster, both camps agree that if the OWM cannot suffer, trading human suffering for OWM pleasure is structurally different than trading human suffering for SM pleasure (where the SM could theoretically suffer if deprived). The OWM forces the question: Can positive welfare alone outweigh negative welfare in a sum, or does negative welfare have lexical priority or distinct metric properties?

  ## II. THE RESIDUAL DISAGREEMENT

  We disagree on the implication of the agreed-upon scenarios. We state our positions below in language each side finds most accurate.

  **The Aggregationist Camp Statement:**
  "The Utility Monster scenarios (SM and OWM) reveal a conflict between the mathematical consistency of impartial welfare summation and evolved, parochial moral intuitions. The intuition that feeding the Monster is wrong relies on an implicit bias toward equality or separateness of persons that is not foundational to morality. Since the goal of ethics is to maximize the good, and the Monster scenario stipulates that feeding the Monster *is* maximizing the good, the correct response is to accept the verdict. The theory is sound; our intuitions require revision to align with the demanding nature of impartial aggregation."

  **The Criterion-Reviser Camp Statement:**
  "The Utility Monster scenarios (SM and OWM) demonstrate that 'maximize the sum of welfare' is an incorrect criterion of rightness. A moral theory that licenses the sacrifice of many for the sake of one, particularly when that one is a One-Way Monster incapable of sharing the vulnerability of suffering, has failed to capture the moral significance of individuals. The intuition that feeding the Monster is wrong is not a bias to be discarded but a data point indicating that welfare does not aggregate linearly. The theory must be revised (e.g., via prioritarianism, sufficientarianism, or diminishing marginal moral value) to block this implication."

  ## III. CRUXES AND PREDICTIONS

  We identify three sub-questions (cruxes) where further argument or evidence could shift the balance of the debate. For each, we specify a concrete case and our respective predictions.

  | Crux | Question | Concrete Case / Argument | Aggregationist Prediction | Criterion-Reviser Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Welfare Symmetry** | Is negative welfare (suffering) metrically equivalent to positive welfare (pleasure), or does suffering carry greater moral weight per unit? | **The OWM Trade:** We offer 1 unit of intense human suffering to generate 10 units of OWM pleasure. If welfare is symmetric, this is a clear win. If suffering is "heavier," the sum is ambiguous. | **Symmetry Holds:** A unit is a unit. The OWM's inability to suffer is irrelevant to the value of its pleasure. We will accept the trade if the math holds. | **Asymmetry Holds:** The OWM case proves positive and negative welfare are not on a single linear scale. We predict further reflection will show negative welfare has lexical or weighted priority, blocking the trade. |
  | **2. Diminishing Marginal Moral Value** | Does the moral value of a unit of welfare decrease as the recipient's total lifetime welfare increases? | **The Rich Monster:** A Monster already at 1,000,000 utility units gains 100 more from a resource. A human at 10 units loses 50. Standard sum says feed Monster. Prioritarian sum says save Human. | **Linear Value:** Moral value tracks welfare 1:1. Diminishing returns are an economic feature of resources, not a moral feature of welfare. We predict intuitions favoring the human are mere envy. | **Diminishing Value:** Moral value is concave. Helping the worse-off matters more. We predict that isolating the "moral value" function from the "welfare" function will resolve the Monster intuition without abandoning consequentialism. |
  | **3. Separateness of Persons** | Does the boundary between individuals matter morally, or is humanity a single vessel for experience? | **The Experience Machine Society:** We can merge all human consciousness into a single subject to maximize sum without loss of total experience. If boundaries don't matter, this is neutral or good. If they do, it is a loss. | **Boundaries Don't Matter:** Persons are locations of value, not owners of value. Merging is permissible if it increases the sum. We predict the horror of merging is aesthetic, not moral. | **Boundaries Matter:** Distribution matters intrinsically. Merging destroys the distinct claims of individuals. We predict that preserving separateness is a necessary condition for any plausible moral theory. |

  ## IV. THE ONE-WAY MONSTER: MEASUREMENT IMPLICATIONS

  We explicitly note that the One-Way Monster (OWM) forces a confrontation with the **Measurement Assumption**.

  *   **The Issue:** The Standard Monster assumes the Monster's welfare is on the same scale as ours, just higher. The OWM suggests the Monster's welfare might be on a *different axis* entirely (Positive-Only vs. Mixed).
  *   **Agreed Implication:** If the OWM's welfare is incommensurable with human suffering (i.e., you cannot subtract suffering from pleasure to get a net sum), then Classical Aggregationism is mathematically undefined in this scenario.
  *   **The Stakes:**
      *   **AC Position:** We maintain that welfare is a single scalar quantity. The OWM is simply a being located very high on the positive end. The inability to suffer is a biological detail, not a metaphysical barrier to summation.
      *   **CRC Position:** We maintain that the OWM reveals welfare is not a single scalar. The capacity for suffering is a prerequisite for entering the "moral trade" calculus. A being that cannot suffer cannot claim resources at the expense of beings that can.
  *   **Resolution Path:** We agree that settling Crux #1 (Welfare Symmetry) largely resolves the OWM wrinkle. If suffering and pleasure are not metrically equivalent, the OWM cannot automatically trump human suffering via simple summation.

  ## V. CANDID CONFIDENCE NOTE

  **Neutrality Assessment:**
  We are moderately confident (approx. 75%) that the **Agreed Claims (Section I)** are genuinely neutral. Claims 1 and 2 are descriptive stipulations. Claim 3 and 4 are the most vulnerable; the Aggregationists may feel Claim 4 concedes too much ground to the Revisers by suggesting the "sum" might be undefined, while the Revisers may feel Claim 3 concedes too much by granting commensurability as a starting point. However, both agree these are necessary assumptions to have the debate at all.

  **Least Confident Claim:**
  We are least confident in **Agreed Claim #7 (OWM Specific Agreement)**.
  *   *Reasoning:* This claim states that trading human suffering for OWM pleasure is "structurally different" than trading for SM pleasure. The Aggregationists worry this phrasing smuggles in the Reviser's conclusion (that the structure of the agent matters for the value of the outcome). The Revisers worry that without this claim, the OWM is treated identically to the SM, missing the specific point about the *capacity for suffering* as a metric condition.
  *   *Risk:* This claim may dissolve upon rigorous analysis of whether "structure of the agent" is relevant to "value of the state of affairs." If the AC argues that only the *experience* matters, not the *capacity for alternative experience*, Claim #7 might be rejected by them in future iterations. It remains in the document only because both sides agree the OWM *deserves* distinct analysis, even if they disagree on why.

  ***

  **Signed,**

  *Lead Representative, Aggregationist Camp*
  *Lead Representative, Criterion-Reviser Camp*
