      *   Identity is one-one (transitive). Relation R can be one-many (branching).
      *   If branching occurs, identity fails (you can't be identical to two distinct people), but survival (what matters) can still hold.
      *   The "Empty Question": Asking "Am I the survivor?" when there are two psychologically continuous survivors is empty. There is no further fact.

  3.  **Brainstorming the Activity:**
      *   *Idea 1: The Token Transfer.* Students get tokens. They assign them to "Future Selves." If the future self is "them," they get points back.
      *   *Idea 2: The Secret Instruction.* Students write instructions for a future agent. If the agent follows them, they win.
      *   *Idea 3: The Insurance Policy.* Students bet on whether a specific outcome counts as survival.
      *   *Refining for the Prompt:* The prompt suggests a "staged teletransport" where they commit *before* knowing the outcome (branching vs. non-branching).
      *   *The Twist:* The game needs to punish "All or Nothing" thinking (Identity) and reward "Degree" thinking (Continuity).
      *   *Mechanism:* "Legacy Points." Students start with a pool of points representing their "life stakes." They must allocate these points to *recipients* based on a scenario description.
