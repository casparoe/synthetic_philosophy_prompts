          *   Box 2 (Memory): 10 points per recipient (So 20 points total).
      *   *Problem:* If I explain the boxes this clearly, they will guess Box 2.
      *   *Solution:* Obfuscate the criteria slightly using "Standard Protocol" language.
      *   *Better Solution:* Use a betting market.
      *   *Let's try the "Will & Testament" approach.*
      *   Students write a "Will" for their course participation points.
      *   They must specify *who* gets the points.
