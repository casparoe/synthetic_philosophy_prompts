          *   Option 1: Ambiguous. Which organism?
          *   Option 2: Both get points. (High reward).
          *   Option 3: Neither gets points (Condition failed).
      *   *Refinement for "No Identity Word":* Call it "The Continuity Protocol."

  5.  **Drafting the Plan:**

      *   **Materials:** Envelopes, Tokens (poker chips or paper slips), Scenario Cards, Payoff Projector/Board.
      *   **Phase 1 (Commitment):** Students get 10 tokens. They represent "Prudential Concern" (how much they care about the future). They must allocate tokens to a "Future Claim."
      *   **The Claims:**
          *   Claim A: "The Original Substrate" (The body here now).
          *   Claim B: "The Psychological Successor" (Whoever has my memories).
          *   Claim C: "The Singular Heir" (Only if I am the *only* one).
      *   **Phase 2 (The Scan):** Describe the process. Emphasize fidelity.
      *   **Phase 3 (The Glitch):** Reveal that the scanner didn't destroy the original *and* created a perfect copy. Both are claiming the tokens.
      *   **Phase 4 (Adjudication):** Apply the Payoff Table.
      *   **Phase 5 (Debrief):** Connect to Parfit.

  6.  **Addressing the "Rigged" Feeling:**
      *   To avoid feeling rigged, the "Singular Heir" (Identity) option needs to sound like the *safe*, logical choice initially. Usually, we assume we are unique. Betting on uniqueness is rational in the normal world.
      *   The "Psychological Successor" option needs to sound risky (what if they don't remember?).
      *   The Payoff must reflect that in a branching world, Identity (Uniqueness) fails, but Continuity succeeds.

  7.  **Troubleshooting:**
      *   *Student Pushback:* "But the copy isn't *really* me." -> This is the exact friction point we want. Don't resolve it immediately.
      *   *Confusion:* "Who gets the points?" -> Make sure the payoff is clear.
      *   *Cynicism:* "This is just utilitarianism." -> Keep focus on *survival*, not morality.
      *   *Time:* 75 mins is tight. Keep instructions under 10 mins. Game 20 mins. Debrief 45 mins.

  8.  **Refining the Debrief (Parfit Mapping):**
      *   Beat 1: The Jam. (Identity conditions fail in branching).
      *   Beat 2: The Payoff. (What matters—continuity—still exists).
      *   Beat 3: The Empty Question. (Asking "Which one is the real one?" yields no points).
      *   Beat 4: Degrees. (You care about both copies, maybe slightly less than one, but not zero).

  9.  **Limitations:**
      *   The game shows Identity is *pragmatically* useless in this case. It doesn't prove there is no metaphysical fact (Parfit's stronger claim). It just shows that even if there were, it wouldn't help you allocate care.
      *   Need to be honest about this.

  10. **Final Polish:**
      *   Tone: Professional but empathetic to the TA's personal stake.
      *   Structure: Clear headings.
      *   Check constraints: No "Identity" word until debrief. No laptops. 18 students.

      *(Self-Correction during drafting)*: Make sure the "Original Survives AND Copy Exists" scenario is clear. This is the "Non-Destructive Uploading" or "Fission" case.
      *   If the original survives, Claim A (Original Substrate) *should* pay out to the original. But what about the copy?
      *   If the rule is "Exclusive to Original," the copy gets nothing.
      *   If the rule is "Exclusive to Singular," *neither* gets anything (because uniqueness failed).
      *   If the rule is "Psychological," *both* get everything.
      *   This creates the tension. The "Singular" bet is the "Identity" bet. It crashes. The "Psychological" bet is the "Relation R" bet. It thrives.

      *Wait, one nuance:* If the original survives, Claim A (Original Substrate) actually works for the original. So Identity isn't fully punished unless we force a choice between Original and Copy.
      *   *Better Scenario:* The "Teletransporter" usually destroys the original. Let's stick to the classic Parfit Teletransporter but with a *glitch* that creates *two* copies and destroys the original.
      *   *Why?* Because if the original survives, the "Is it me?" question is easier (Yes, for the original). The hard case is Fission (Two copies, no original).
      *   *Prompt Requirement:* "outcome is a case where the original survives *and* a psychologically continuous copy (or two copies) also exists."
      *   *Okay, I must follow the prompt.* Original + Copy.
      *   *Implication:* There are now two claimants.
      *   *The Trap:* Students allocate resources to "The Person Who Is Me."
      *   *If they allocate to "The Body in Seat 1":* That person exists. They get points.
      *   *If they allocate to "The Person Who Remembers":* Both exist. Both get points.
      *   *Where is the jam?* The jam is in the *exclusivity*.
      *   *Let's adjust the Payoff:* The total pot is fixed. If you bet on "Uniqueness," and there are two, the pot is void. If you bet on "Continuity," the pot doubles (or splits).
      *   *Actually, the most Parfitian move:* The "Identity" bet is that there is *only one* person who is you. If there are two, that bet is false.
      *   *Let's go with "The Inheritance Contract".*
      *   You have $100 (points). You are entering the machine.
