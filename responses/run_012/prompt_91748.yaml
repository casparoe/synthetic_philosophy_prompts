answer: |-
  This is a high-stakes tutorial, both pedagogically and personally. You need an activity that bypasses intellectual defense mechanisms and targets the *prudential* anxiety (the "why should I care?" question).

  Here is a complete run-sheet for **"The Sole Heir Protocol."** It is designed to make the concept of *uniqueness* (Identity) the liability and *continuity* (Relation R) the asset, without using the forbidden words until the end.

  ### **Materials**
  *   **18 "Contract Slips"** (Small pieces of paper).
  *   **18 Envelopes** (Sealed, labeled "Future Assets").
  *   **36 "Status Cards"** (Two distinct colors, e.g., White and Blue).
  *   **A Pot of Tokens:** 180 poker chips or paper slips (representing "Prudential Concern Points" or PCPs). 10 per student.
  *   **Whiteboard/Projector:** For the Payoff Table.

  ### **The Setup (0:00 – 0:10)**
  **Do not introduce the topic.** Do not mention metaphysics. Walk in and place an envelope on each desk.

  **Script:**
  "Today is a simulation. You are not students right now; you are clients. Inside your envelope is 10 PCPs (Prudential Concern Points). These represent your stake in your own future. Your goal is to maximize the return on these points.

  In 5 minutes, you will enter a 'Transfer Process.' It is high-fidelity. It preserves your memories, character, and psychology perfectly. However, we do not know the technical outcome yet. It might be a standard transfer, or it might be a broadcast.

  Before you enter, you must sign a **Beneficiary Contract**. This dictates who gets your PCPs on the other side. You have three clauses to choose from. You must circle **one**."

  **Hand out the Contract Slips.** They read:

  > **BENEFICIARY DESIGNATION**
  > I, the Undersigned, allocate my 10 PCPs to:
  >
  > **A) The Sole Heir:** The *one* unique person who is the continuation of me. If more than one person qualifies, or none, this contract is **VOID**.
  >
  > **B) The Psychological Successor:** Any person who possesses my memories and psychology up to this moment. Each qualifying person receives the full 10 PCPs.
  >
  > **C) The Biological Original:** The specific physical organism currently sitting in this seat. If this organism ceases to exist or is not the only one, this contract is **VOID**.

  **Instruction:**
  "Circle A, B, or C. Sign it. Put it in the envelope. Do not discuss your choice. You are betting on your own survival."

  *(Collect the envelopes. Mix them up. This takes about 5-7 minutes.)*

  ### **The Process & The Glitch (0:10 – 0:25)**
  **Script:**
  "Okay. The Transfer has occurred. We need to verify the output to process your contracts."

  **The Reveal:**
  "Here is the technical report. The Transfer was **Non-Destructive**. The original you (in this room) was not harmed. However, the signal also created a **Perfect Copy** elsewhere (represented by the person next to you)."

  **The Mechanic:**
  "Stand up. I am going to hand out Status Cards."
  *   Hand **White Cards** to 9 students (The Originals).
  *   Hand **Blue Cards** to the other 9 students (The Copies).
  *   *Crucial Move:* Pair them up. Have the White Card holder sit next to the Blue Card holder. Tell them: "For the purpose of this simulation, you are now **Fission Partners**. You both share the exact same memories up to the moment you signed the contract. You both feel you are the one who signed."

  **Script:**
  "Look at your partner. You both remember signing that contract. You both feel you are the rightful claimant. The machine produced **two** of you."

  ### **The Adjudication (0:25 – 0:40)**
  **Script:**
  "Now we open the envelopes and apply the Payoff Table."

  **Draw the Payoff Table on the Board:**

  | Contract Clause | Condition for Payout | Outcome in Fission (2 Survivors) |
  | :--- | :--- | :--- |
  | **A) The Sole Heir** | Must be **Unique** (Count = 1) | **FAIL** (Count = 2) |
  | **B) Psychological** | Must have **Memories** (Count ≥ 1) | **PASS** (Both get 10) |
  | **C) Biological** | Must be **This Body** (Original Only) | **MIXED** (Original gets 10, Copy gets 0) |

  **The Scoring:**
  Go through the envelopes (you can fake this speedily or actually check a few).
  1.  **Ask for a show of hands:** "Who chose A (Sole Heir)?"
      *   *Result:* Everyone who chose A gets **0 points**.
      *   *Why:* There is no *Sole* Heir. There are two. The condition of uniqueness failed.
  2.  **Ask for a show of hands:** "Who chose C (Biological)?"
      *   *Result:* The White Cards get 10. The Blue Cards get 0.
      *   *Why:* The Blue Cards are not the *original* organism.
      *   *Friction Point:* Ask the Blue Cards: "You have all the memories. You feel you signed the contract. Why do you get nothing?" (Let them grumble. This is the "Is it me?" intuition).
  3.  **Ask for a show of hands:** "Who chose B (Psychological)?"
      *   *Result:* **Everyone** (White and Blue) gets 10 points each.
      *   *Why:* Continuity was preserved in both.

  **The Kicker:**
  "Total the points.
  Group A (Identity/Uniqueness): 0 points.
  Group C (Body/Original): 10 points total (split between the pair).
  Group B (Continuity): 20 points total (10 each)."

  "The market has spoken. Betting on 'Uniqueness' bankrupted you. Betting on 'Continuity' doubled your stake."

  ### **The Debrief (0:40 – 1:15)**
  *This is where you connect the game to Parfit and your brother.*

  **1. The Jam (Identity Conditions)**
  "Look at Group A. Why did you lose? You didn't lose because you died. You didn't lose because your memories vanished. You lost because **logic broke**."
  *   Write on board: **Identity = One-to-One.**
  *   "Identity is transitive. If X is identical to Y, and X is identical to Z, then Y must be Z. But here, White is not Blue. So neither can be identical to the 'Pre-Scan You' in the strict sense. The concept of 'The One True Heir' has no work to do here. It jams."

  **2. The Payoff (What Matters)**
  "Look at Group B. You won. Why? Because you didn't bet on a metaphysical label. You bet on **Relation R** (Psychological Connectedness)."
  *   Write on board: **What Matters = Degrees of Connection.**
  *   "Did the Blue Card person suffer? No. Do they have your plans? Yes. If you cared about your projects continuing, Group B ensured that. Group A ensured... nothing."

  **3. The Empty Question**
  "Ask yourselves: 'But which one is *really* me?' White or Blue?"
  *   Let them argue for 2 minutes.
  *   "Parfit's claim: This is an **Empty Question**. There is no further fact. The physics is settled (two bodies). The psychology is settled (two minds). Asking for a third thing called 'Identity' is like asking 'Which one is the *real* wedding?' when the ceremony was broadcast to two screens. The question assumes a magic substance that isn't there."

  **4. The Brother (Application)**
  "Now, about the brain scan service."
  *   "If your brother goes in, and they destroy him and make one copy: Group C loses, Group B wins. He survives in what matters.
  *   "If they make *two* copies: Group A (Identity) says he died (because uniqueness failed). Group B (Continuity) says he survived twice.
  *   "If he cares about *being the unique soul*, he should be terrified. If he cares about *his life continuing*, he should be fine. Parfit argues the second concern is the rational one. The first is a fetish for a label."

  ### **Troubleshooting: What Will Go Wrong**

  **1. The "But the Copy isn't ME!" Revolt**
  *   **Prediction:** A student (likely the 'Blue Card') will say, "This is rigged. I'm not him. I'm a copy. He should get the points, not me."
  *   **Handling:** Do not argue metaphysics yet. Ask: "Do you remember signing the contract?" (Yes). "Do you intend to spend the points?" (Yes). "If I take the points away, do you feel cheated?" (Yes).
  *   **Pivot:** "Exactly. Your *concern* is real, even if your *identity* is disputed. Parfit says follow the concern, not the label."

  **2. The "I Chose C and I'm Happy" Camp**
  *   **Prediction:** Students who chose Biological Original (C) will say, "I won. I'm the original. I don't care about the copy."
  *   **Handling:** Acknowledge this is the "Lockean" or "Animalist" view. But ask: "If the machine had destroyed the original and only left the Copy, would you have preferred death?" Most will say no. This reveals that even they value Continuity over Biology deep down.

  **3. Time Creep**
  *   **Prediction:** The argument about "Who is the real one" will eat 20 minutes.
  *   **Handling:** Hard stop. "We are not solving the metaphysics today. We are solving the *accounting*. The accounting shows Identity is a bad investment vehicle. Let's move to why."

  ### **Limitations: What This Game Cannot Do**
  *Be honest about this in the final 5 minutes.*

  1.  **It doesn't prove Reductionism:** The game shows that *Identity* is pragmatically useless in branching cases. It does not prove there is *no* further fact of the matter. A dualist could say, "The Soul went with the White Card, and the game just couldn't detect it."
      *   *Your line:* "This game shows that even if there is a 'Soul Fact,' it doesn't help you allocate care. If you bet on the Soul (Uniqueness), you get zero. If you bet on the Mind (Continuity), you get paid. Parfit argues we should stop betting on the Soul."
  2.  **It assumes Continuity is what matters:** The game rigs the payoff to favor Continuity. That's because we are testing Parfit. A student who values "Biological Life" above "Psychological Memory" (e.g., in cases of dementia) might reject the payoff table.
      *   *Your line:* "If you think biology matters more than memory, Parfit disagrees with you. But ask yourself: If you had to choose between a body with no mind, or a mind with no body (uploaded), which carries your 'life'? Most of us choose the mind."
  3.  **It doesn't solve the Fear of Death:**
      *   *Your line:* "This might not make your brother feel better. Knowing 'Relation R' holds doesn't stop the fear of the scanner destroying *this* specific consciousness. Parfit admits this. He just says the fear is based on a false view of what 'this' is."

  ### **TA Note for Your Sanity**
  You are running this while worried about your brother. That anxiety is actually your best teaching tool.
  *   **In the debrief:** Admit it. "I'm running this because my brother just did this. I need to know if he's coming back."
  *   **Why:** It models the philosophical stakes. Metaphysics isn't word games; it's how we decide whether to grieve or celebrate.
  *   **The Takeaway:** If the game works, the class will see that "Is it him?" is the wrong question. The right question is "Will his life continue?" If the scan preserves the life, the label "Identity" is secondary.

  Good luck. Corner them with the rules, let the points do the arguing, and save the philosophy for the autopsy.
