answer: |-
  There is no single, canonical term in the economic literature that captures this specific reflexive loop. You have correctly identified a tension between the **Milgrom-Stokey No-Trade Theorem** and the **Grossman-Stiglitz Paradox**, but the specific mechanism you describe—the way the *credibility* of a no-trade equilibrium assigns hyper-value to any deviation, thereby incentivizing the endogenous generation of noise—does not have a standard label like "Giffen Good" or "Laffer Curve."

  The closest existing concepts are **Endogenous Noise Trading** (usually discussed in market microstructure) and the **Fragility of Common Knowledge** (discussed in global games), but neither fully captures the *incentive to manipulate* arising specifically from the *interpretive weight* of breaking a no-trade norm.

  Since you have asked for a term if none exists, I propose coining the phrase **The No-Trade Signaling Instability**.

  Below is the definition, the boundary conditions distinguishing it from related concepts, and a concrete example.

  ### The Term: The No-Trade Signaling Instability

  **Definition:**
  A market state in which the common knowledge of rational constraints (such as insider trading bans or symmetric information priors) establishes a no-trade equilibrium that is so credible that any observed deviation is interpreted as possessing disproportionately high informational content. This interpretive asymmetry creates an arbitrage opportunity where the signaling value of a trade exceeds its fundamental cost, incentivizing agents without private information to manufacture deviations (noise) to exploit the market's overreaction.

  **Mechanism:**
  1.  **Constraint:** Common knowledge of rationality and information barriers leads to a no-trade equilibrium (Milgrom-Stokey).
  2.  **Scarcity:** Informational signals become scarce; silence is the expected norm.
  3.  **Hyper-Informativeness:** Because silence is the equilibrium, any "noise" (trade) is statistically treated as "signal" (private information).
  4.  **Incentive Compatibility:** The price impact of the trade (driven by the market's belief in the signal) exceeds the transaction cost, making it profitable for uninformed agents to trade solely to trigger the price update.
  5.  **Destabilization:** The influx of manufactured noise degrades the signal-to-noise ratio, eventually collapsing the market's ability to distinguish real information from manufactured signals.

  ---

  ### Boundary Conditions

  To ensure this term is useful for your research, it is necessary to distinguish it from adjacent concepts.

  **1. Versus Adverse Selection (Akerlof)**
  *   **Adverse Selection:** Occurs *before* the market opens or at the margin. The fear that the counterparty knows more prevents the trade from happening at all (market collapse).
  *   **No-Trade Signaling Instability:** Occurs *after* the market is technically open but functionally frozen. The market does not collapse due to fear; it freezes due to rational inaction. The instability arises when trade *does* occur, not when it fails to occur.

  **2. Versus Costly Signaling (Spence)**
  *   **Costly Signaling:** Requires the signal to be costly enough that low-quality types cannot afford to mimic it.
  *   **No-Trade Signaling Instability:** The trade itself may be cheap (low transaction costs). The "cost" that usually validates the signal is replaced by the *contextual rarity* of the trade. The market mistakenly attributes the credibility of a costly signal to a cheap deviation because the equilibrium context (no-trade) makes the deviation seem "expensive" in terms of risk (e.g., risking regulatory scrutiny).

  **3. Versus Manipulation**
  *   **Manipulation:** Describes the *intent* of the agent (e.g., "pump and dump").
  *   **No-Trade Signaling Instability:** Describes the *structural vulnerability* of the market that makes manipulation profitable. Manipulation is the action; the instability is the condition that renders the action rational.

  **4. Versus Self-Defeating Prophecy**
  *   **Self-Defeating Prophecy:** A prediction causes behavior that falsifies the prediction (e.g., predicting a bank run causes the run).
  *   **No-Trade Signaling Instability:** The "prediction" here is the equilibrium expectation (no trade). The deviation does not falsify the rationality of the agents; rather, it exploits the *common knowledge* of that rationality. It is an equilibrium selection problem, not a falsification of a fundamental prediction.

  **5. Versus The Grossman-Stiglitz Paradox**
  *   **Grossman-Stiglitz:** Argues that if markets are perfectly informationally efficient, no one has an incentive to collect information, rendering markets inefficient. This is about the *acquisition* of information.
  *   **No-Trade Signaling Instability:** Is about the *revelation* of information. Even if information is already held, the structure of the market prevents its revelation until the no-trade equilibrium is broken, at which point the revelation mechanism is hijacked by noise.

  ---

  ### Concrete Example: The Merger Arbitrage Prediction Market

  **Context:**
  Consider a prediction market trading on the success of a proposed merger between Company A and Company B. The market is regulated such that anyone with material non-public information (MNPI) regarding the merger is legally barred from trading. This prohibition is public and strictly enforced.

  **Phase 1: The No-Trade Equilibrium**
  The market opens at $0.50 (50% probability of success). All rational traders know that anyone with genuine inside knowledge (e.g., that the deal is already signed) cannot trade. Therefore, if someone *does* trade, it implies they either (a) have illegal inside information and are risking prosecution, or (b) are irrational. Rational, law-abiding traders assume (a) is unlikely due to enforcement and (b) is unlikely due to common knowledge of rationality. Consequently, no one trades. The price remains at $0.50. This is the Milgrom-Stokey result.

  **Phase 2: The Deviation**
  A speculative trader, possessing no inside information, buys a small contract at $0.51.
  *   **Fundamental Value:** The trade is small and based on no new data.
  *   **Market Interpretation:** Other traders observe the print. They reason: "No one trades here unless they know something. This trader is either risking jail or knows the deal is done."
  *   **Result:** The market updates sharply to $0.80. The price move is not driven by the size of the order (which was negligible) but by the *existence* of the order breaking the silence.

  **Phase 3: The Instability**
  The speculative trader sells at $0.80, realizing a 60% profit on a trade with zero informational basis.
  *   **The Loop:** Other traders observe this profit. They realize that the market is "signal-starved." The credibility of the insider ban has made the market hypersensitive to *any* order flow.
  *   **Endogenous Noise:** Multiple traders begin placing small "probe" orders not to hedge or invest, but to trigger the price jump, intending to reverse the position immediately.
  *   **Collapse:** Eventually, the market realizes that order flow is being manufactured. The "No-Trade Signaling Instability" resolves when the market stops treating order flow as informative, returning to a high-volume, low-information noise state, or the market dissolves due to a loss of trust in the price mechanism.

  **Where it Starts and Stops:**
  *   **Starts:** When the common knowledge of trading constraints creates a credible no-trade equilibrium.
  *   **Stops:** When the frequency of manufactured deviations becomes high enough that the market updates its prior to expect noise, thereby neutralizing the signaling value of a single trade.

  ### Summary for Your Research
  In your writing, you can frame this as a second-order failure of the No-Trade Theorem. The theorem correctly predicts the *static* equilibrium (no trade), but it fails to account for the *dynamic instability* introduced when that equilibrium becomes common knowledge. The **No-Trade Signaling Instability** describes the specific vulnerability where the market's rationality becomes its own exploit.
