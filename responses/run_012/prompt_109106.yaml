answer: |-
  You have identified a genuine epistemological structure, not just a psychological quirk. Your wife calls it stubbornness because, pragmatically, it *functions* like stubbornness. But structurally, you are describing a **Clash of Properly Basic Beliefs**, often discussed in philosophy as **The Problem of the Criterion** or a dispute over **Hinge Propositions**.

  Here is the breakdown of what the thing is, where its edges lie, and how it relates to the examples you gave.

  ### 1. The Name and The Structure

  The most precise label for this is **The Problem of the Criterion** (formulated by Roderick Chisholm, tracing back to Sextus Empiricus).

  The problem arises because to know if a method of finding truth is reliable, you need to know some truths. But to know if you have the truth, you need a reliable method.
  *   **Side A (Methodism):** "I need a valid method first. Your study method is sloppy, so the finding is wrong." (Method $\rightarrow$ Truth)
  *   **Side B (Particularism):** "I know certain truths directly. This finding is implausible, so the method must be flawed." (Truth $\rightarrow$ Method)

  In your sister example, the "method" is *memory reliability* and the "truth" is *the specific deal*.
  *   **You:** My memory of 50/50 is the baseline. Your memory is biased because it conflicts with mine.
  *   **Her:** Her memory of 60/40 (plus the napkin) is the baseline. Your memory is biased because it conflicts with hers.

  This is also described by Ludwig Wittgenstein in *On Certainty* as a dispute over **Hinge Propositions**. A hinge proposition is a claim that is not tested within the system but is the thing *upon which* the testing turns (e.g., "The earth exists," "My memory is generally reliable"). When two people treat different hinges as the fixed point, their arguments become mirror images.

  ### 2. Is Moore's Hand the Same Thing?

  **Yes, but yours is the bilateral version.**

  G.E. Moore's "Here is one hand" argument was a unilateral move to stop skepticism.
  *   **Skeptic:** "You can't prove the external world exists without assuming it exists."
  *   **Moore:** "I know I have a hand. Therefore, the external world exists. Your skepticism is wrong."

  Moore simply *declared* his perception a Hinge Proposition that was more certain than the skeptic's logical requirements. He refused to play the skeptic's game of justification.

  In your fights, **both of you are playing Moore.** You are both saying, "My starting point is more certain than your argument against it." Because both sides claim the "Mooreian Privilege" (the right to treat a claim as self-evident), the accusation of circularity becomes symmetrical. In logic, this is sometimes called **Reciprocal Dogmatism**.

  ### 3. Where Are the Edges? (What makes it *this* and not something else?)

  You asked for the boundaries of the phenomenon. Here is how to distinguish it from ordinary disagreement.

  **Edge 1: Shared Framework vs. Framework Clash**
  *   **Ordinary Disagreement:** We agree on the baseline (the hinge) but disagree on the calculation.
      *   *Example:* We agree the napkin is the authoritative record. We just disagree on what the ink says.
  *   **Your Phenomenon:** We disagree on *which* baseline is authoritative.
      *   *Example:* I say my memory is the baseline; you say the napkin is the baseline.
  *   **The Boundary:** The moment you can appeal to a *third* thing you both accept (e.g., "Let's look at the bank transfer records"), the phenomenon collapses back into ordinary disagreement. If no third thing exists, you are in the standoff.

  **Edge 2: Evidence vs. Axiom**
  *   **Ordinary Disagreement:** One side has evidence that fits within the other side's framework.
  *   **Your Phenomenon:** Evidence is only evidence *relative to the hinge*.
      *   To you, your memory *is* the evidence. To her, your memory is *data to be explained* (by your greed).
      *   To her, the napkin *is* the evidence. To you, the napkin is *data to be explained* (by her faulty recall of writing it).
  *   **The Boundary:** If one side can demonstrate that their hinge is a *subset* of the other's (e.g., "Memory is generally reliable, but physical records override memory in court"), the standoff resolves. If the hierarchies are truly parallel, the standoff holds.

  ### 4. Addressing Your Specific Variations

  **"Is it the same thing when one side actually does have better evidence but can't say why?"**
  **Yes.** This is crucial. Epistemologically, this phenomenon is about *justification*, not *truth*.
  It is possible that you are right and she is wrong. But if your justification relies on "I remember," and hers relies on "I wrote it," and you both treat those as axioms, the *structure of the argument* is identical to a case where you are both equally deluded.
  The phenomenon is a **failure of dialectic**, not necessarily a failure of fact. You cannot win this argument by producing more "evidence" if that evidence is only valid within your own hinge system.

  **"Is it the same when it's one person alone, torn, with nobody to argue against?"**
  **Yes, structurally.** This is **Cognitive Dissonance** viewed through an epistemological lens.
  *   *Voice A:* "I am a good person." (Hinge)
  *   *Voice B:* "I did a bad thing." (Data)
  *   *Resolution 1:* "I didn't do a bad thing." (Deny data to save hinge)
  *   *Resolution 2:* "I am not a good person." (Deny hinge to save data)
  When you are torn, it is because you are oscillating between which claim gets to be the Hinge and which gets to be the Conclusion. It is an internalized version of the same standoff.

  **"Is there a point where this stops being a special phenomenon and just becomes ordinary disagreement about facts?"**
  **Yes.** It stops being this phenomenon when **one side concedes the other's Hinge.**
  If you say, "Okay, assuming the napkin is definitive, does my memory match it?" you have exited the standoff. You have demoted your memory from "Axiom" to "Hypothesis."
  The phenomenon *only* exists while both parties insist their claim is the **Properly Basic Belief** (the thing that doesn't need proof).

  ### 5. Why the Accusation is Useless

  You noted: *"Each side accuses the other of assuming the very thing that's in dispute, and both accusations are correct, which somehow makes the accusation useless."*

  This is because **all reasoning must start somewhere.**
  To avoid circularity entirely, you need an infinite chain of reasons (which is impossible) or a foundational belief that you accept without proof.
  *   When you accuse her of circularity, you are saying: "Your foundational belief is wrong."
  *   When she accuses you, she is saying: "Your foundational belief is wrong."
  *   Since foundational beliefs are, by definition, unproven within the system, neither of you can prove the accusation without using the very belief being attacked.

  This is why your wife calls it stubbornness. To an outsider, it looks like you are both refusing to provide a reason. But to you, **you are providing the ultimate reason.** ("I remember" is the end of the line for you).

  ### Summary

  *   **What is it?** A **Clash of Hinge Propositions** (Wittgenstein) manifesting as **The Problem of the Criterion** (Chisholm).
  *   **The Shape:** Two coherent systems that are mutually exclusive because they prioritize different axioms (Memory vs. Artifact; Method vs. Plausibility).
  *   **The Moore Connection:** It is the bilateral version of Moore's "Here is a hand." Both sides are claiming their perception is the "hinge" that overrides the other's logic.
  *   **The Edge:** It exists only while both sides treat their claim as **Properly Basic**. It dissolves if one side accepts a neutral arbiter or demotes their claim to a hypothesis.
  *   **The Trap:** You cannot argue your way out of it using the rules of the argument, because the argument is *about* the rules.

  **How to break it:**
  You cannot win this logically. You have to shift the ground.
  1.  **Pragmatism:** "Even if I'm right, is fighting over 10% worth the relationship?" (Changes the goal from Truth to Utility).
  2.  **Meta-Agreement:** "We are doing the thing where we both think our memory is the baseline. Let's flip a coin / split the difference / look for a third record." (Acknowledges the Hinge Clash explicitly).
  3.  **Concession:** One person must voluntarily demote their Hinge to a Hypothesis. ("I feel certain it was 50/50, but I acknowledge napkins are usually more reliable than memory, so I will defer to the napkin.")

  You aren't crazy, and it isn't just stubbornness. It is a fundamental limit of how human justification works. You have hit the bedrock, and your spades are turning.
