answer: |-
  **REVEALED ANSWERS**
  **By Dr. Ordinal**

  **Dear Dr. Ordinal,**
  I tell everyone I hate my job. I complain daily. But I haven't quit. My friends say I'm lying to myself. Are they right?
  **—Stuck in Cubicle**

  **Dear Stuck,**
  Your friends are amateur psychologists; I am an economist. Feelings are unobservable data. Only choice is real. You say you hate the job, yet you choose to attend every day. This reveals you prefer the job to the alternative. What was the alternative? Did you have a competing offer you rejected? If yes, you revealed a preference for your current wage over the competitor's. If no, you revealed a preference for your current wage over the effort of searching for a new one. Unless you can prove you were physically restrained from leaving, your complaint is merely cheap talk. You are maximizing utility; you just dislike the bundle you chose. Stop complaining and accept your revealed satisfaction.

  **Dear Dr. Ordinal,**
  My husband tells me he loves me. He says it every night. But he works late constantly and spends our savings on his hobbies. Can I trust his words?
  **—Needing Assurance**

  **Dear Needing,**
  Words are costless; choices are costly. A verbal assertion of love has no budget constraint. Allocating time and capital has a price. Your husband has chosen to allocate his scarce time to work and his scarce capital to hobbies. He has not chosen to allocate them to you. To believe his words over his actions is to believe in metaphysical cheats—utility functions that exist nowhere but in the ether. The data suggests he prefers hobbies to your company. If you continue to demand he value you contrary to his revealed preferences, you will only incur transaction costs. Accept his choices as his truth. It will hurt, but it is efficient.

  **Dear Dr. Ordinal,**
  I'm trying to choose a partner. I like Alice more than Bob. I like Bob more than Charlie. But when I'm with Charlie, I like him more than Alice. I go in circles. What should I do?
  **—Going in Circles**

  **Dear Circles,**
  You are describing intransitive preferences. A rational agent prefers A to B and B to C, therefore A to C. You violate this axiom. This does not mean the world is complex; it means you are not yet a coherent agent. You cannot maximize if you cannot rank. My advice is to suspend your dating life until you can construct a consistent ordering of your potential partners. Do not write back until you are stable. We do not advise entities that behave like broken algorithms.

  **Postscript:**
  Several readers have asked if there is any behavior that cannot be described as maximization. The answer is no. Any sufficiently regular pattern of choosing can be redressed as the maximization of some quantity or other. If you drink cheap wine every night, you are maximizing "wine consumption per dollar" rather than "quality." If you stay in a bad marriage, you are maximizing "avoidance of divorce costs." There is no action that is not rationalizable. You are always getting exactly what you want, because what you want is defined by what you do. Sleep well.
