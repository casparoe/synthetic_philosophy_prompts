  **Note on Mechanism and Liberties**
  This joke relies on the **counterfactual settlement problem**, which is widely acknowledged as the most significant technical hurdle in futarchy design. It is uncontroversial that futarchy requires comparing $E[U|\text{pass}]$ against $E[U|\text{fail}]$, and that only one branch is observed; however, it is a live dispute whether this renders the mechanism impossible. Robin Hanson and proponents suggest using simulation models or trial periods to approximate the counterfactual, whereas critics argue this reintroduces the very epistemic uncertainty markets are meant to bypass. The joke takes liberties by assuming traders would prioritize settlement feasibility over policy preference and that the lack of a perfect oracle collapses liquidity entirely, rather than simply widening spreads. Finally, the reflexivity of voting on futarchy itself is a known edge case, but the joke presents the market's self-abolition as a coherent equilibrium rather than a paradox.
