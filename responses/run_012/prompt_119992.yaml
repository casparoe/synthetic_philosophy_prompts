  - **The cases, restated**

  In Case One, a Club operates under a rule permitting amendment by a simple majority. Members use this majority to replace that very rule with one requiring unanimity for all future amendments. The question is whether the new unanimity rule is validly adopted. In Case Two, a Society holds two conflicting rules: a general provision allowing repeal by a two-thirds vote, and a specific provision stating Rule X is unrepealable. A two-thirds majority votes to repeal Rule X. The question is whether Rule X is abolished. Both cases hinge on whether a rule system can successfully alter the conditions of its own authority using the authority currently in place.

  - **The appearance of paradox**

  The paradox arises because each case seems to invalidate its own outcome. In Case One, consider the moment of voting. The old rule authorizes the change. If the change occurs, the new rule replaces the old. But the new rule states that such a change requires unanimity. Therefore, if the new rule is valid, the process that created it was defective. We are left saying: the rule is valid because the old rule allowed it, but invalid because the new rule forbids it. It feels as though the rule system is trying to lift itself by its own bootstraps, generating a logical short-circuit. In Case Two, the conflict is simultaneous. The general rule says "repeal is allowed," while the specific rule says "repeal is forbidden." If the general rule governs, the specific rule is voidable. But if the specific rule is valid, it limits the general rule. We oscillate: if the vote works, the rule forbidding it was false; if the rule forbidding it is true, the vote cannot work. This looks like a logical contradiction where the system simultaneously affirms and denies the same act's validity. The confusion deepens because we cannot tell if we are judging the act by the standards existing before the vote or after it, creating a loop where validity depends on an outcome that determines validity.

  - **What the paradox really turns on**

  This paradox turns on conflating two distinct questions. The logical question asks whether a sentence can coherently refer to itself. There is no logical barrier here; a rule can certainly contain words referring to its own amendment without contradiction. The real issue is institutional: which rule actually guides officials at the moment of decision? We must also separate validity from content. Validity concerns the pedigree of the rule: is it part of the system? Content concerns what the rule says: does it forbid amendment? A rule can be valid even if its content says "I cannot be changed." In Case One, the old rule was valid at the time of the vote; its content allowed change. The new rule's content restricts change, but that content only binds future acts. In Case Two, both rules are valid, but they conflict in content. The threat of regress appears if we demand that every amendment rule be authorized by a higher rule. If Rule A authorizes changes to Rule B, what authorizes Rule A? If Rule Z authorizes Rule A, what authorizes Rule Z? If we require an infinite chain of higher rules, no change is ever possible. This regress threatens to make all amendment impossible unless the chain stops. It stops only when we reach a rule that is accepted not because a higher rule says so, but because officials actually use it. This suggests that the validity of the amendment power cannot rest solely on another rule within the set. Instead, it must rest on something external to the rules themselves, such as the accepted practice of the members. The paradox emerges only if we assume the rule system is a closed logical loop rather than an open institutional practice. When we treat rules as mere propositions, self-reference looks like a contradiction. When we treat them as social tools, the question becomes whether the community accepts the transition. The institutional question overrides the logical appearance because rules only exist insofar as they are used. Thus, the puzzle is not about syntax, but about the source of authority that lies beneath the written text.

  - **The best resolution**

  The most defensible resolution is that the validity of an amendment depends on the rule in force *at the time of the act*. In Case One, the simple majority rule was valid when the vote occurred. It authorized its own replacement. Once replaced, the new unanimity rule governs subsequent acts, but it cannot retroactively invalidate the vote that created it. The bridge is not destroyed after crossing. The act was valid when performed. In Case Two, the conflict is between simultaneous valid rules. Here, resolution depends on interpretive conventions accepted by the society, such as "specific rules override general ones" or "later rules override earlier ones." However, these conventions are not themselves rules within the set; they are practices of the officials. Rival accounts fail because they demand logical perfection where institutional reality suffices. Some argue self-amendment is logically impossible, but this denies the observable fact that clubs do change their rules. They confuse logical consistency with institutional continuity. Others argue a higher law is always needed, but this leads to the infinite regress described earlier. If every rule needs a parent rule, nothing begins. The only way to stop the regress is to acknowledge a foundational practice: officials treat certain rules as standard. Therefore, the answer rests on a settled practice of the relevant officials. If the Club members accept the new unanimity rule as binding, it is valid. If the Society officials treat Rule X as entrenched despite the vote, it remains. The rule system does not determine its own validity; the participants do. This account succeeds because it aligns with how groups actually function: rules are tools used by people, not abstract truths floating in a void. The authority comes from the bottom up, not the top down. Crucially, this resolves the temporal confusion in Case One. The old rule validates the transition; the new rule validates the future. There is no moment where both apply to the same act. In Case Two, the lack of a meta-rule within the text means the officials must exercise discretion. Their decision establishes which rule prevails. This might seem arbitrary, but it is necessary. Without this extra-legal acceptance, the text is merely ink on paper. The resolution holds because it recognizes that a rule system is a social phenomenon, not just a logical one.

  - **What the resolution leaves standing**

  However, this resolution leaves a residue of puzzlement. By grounding validity in official practice rather than higher rules, we admit that the ultimate foundation of the system is not a rule at all. It is a fact—what people actually do. This is unsettling for those who want law to be purely normative. If the officials change their practice, the constitution changes, even without a vote. Furthermore, the "moment of transition" remains slightly murky. In Case One, exactly when does the new rule bite? Is it immediately after the chair announces the result? If a second vote occurs five minutes later, does the new rule apply? The practice must be precise enough to answer this, but practices are often vague. Finally, this account implies that if officials disagree fundamentally on the practice, there is no rule-based way to settle the dispute. The system fractures. Thus, while the logical paradox is dissolved, it is replaced by a sociological uncertainty. We know *how* to decide (look to practice), but we lose the comfort of thinking the rules themselves guarantee the answer. The system rests on a ground that is not itself rule-governed. This means the security of the rules is only as stable as the consensus holding them up.

  - **Bottom line**

  The problem of self-amendment is not a logical contradiction but a question of authority. It asks whether a rule system can alter its own foundations using the powers those foundations grant. The answer is yes, provided the change follows the rules currently in force. However, the validity of those initial rules depends not on higher laws, but on the settled practice of the community. Ultimately, rules do not authorize themselves; people authorize rules. The paradox vanishes when we see that law is a social practice, not a closed logical circle.
