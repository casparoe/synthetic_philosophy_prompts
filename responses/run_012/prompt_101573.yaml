answer: |-
  1.  **Distinction of Three Senses of Adaptationism.** We agree that "adaptationism" conflates three distinct claims that must be evaluated separately: (i) the *Empirical Claim* (adaptation is the prevalent cause of organic form); (ii) the *Methodological Claim* (selection is the appropriate default hypothesis or heuristic in the absence of contrary evidence); and (iii) the *Explanatory Claim* (once selection is identified, no further explanation of form is required). The Adaptationist camp holds (i) is high, (ii) is justified, and (iii) is mostly true. The Spandrel Critic camp holds (i) is lower, (ii) is biased, and (iii) is false due to developmental and historical necessity. We agree the substantive dispute lies primarily in the justification of (ii) and the sufficiency of (iii), which drives the divergence in (i).

  2.  **Logic of Exaptation and Maintenance.** We agree that a trait can be maintained by natural selection without having been selected for its present effect. "Adaptation" and "Exaptation" do not name exclusive ontological categories but describe successive stages of a single history relative to a specific function (origin vs. maintenance). A trait is an adaptation *for* a function if it evolved *by* selection for that function; it is an exaptation *for* a function if it was co-opted later. Both camps accept this logical geography.

  3.  **Existence of Constraints.** We agree that developmental, phylogenetic, and physical constraints exist and limit the space of viable phenotypes. The dispute is not over their existence but over their prevalence and their capacity to explain complex, functionally specific form without recourse to selection.

  4.  **Requirement of Null Models.** We agree that adaptive hypotheses must be tested against null models (e.g., drift, constraint, phylogenetic inertia). The dispute is over which null model constitutes the appropriate baseline expectation for complex traits.

  5.  **Resolution of Verbal Disputes.** We agree that the question "What percentage of traits are adaptations?" is ill-posed (verbal) unless relativized to a specific set of traits, a level of description, and a timescale. We agree to treat prevalence claims as valid only when these parameters are specified. We agree that charges of "unfalsifiability" apply only to degenerate forms of optimality modeling that adjust parameters post-hoc to fit any outcome, not to optimality modeling itself when constrained by independent trade-off measures.

  | Disagreement Statement | Crux & Verdict | Discriminating Evidence & Predictions |
  | :--- | :--- | :--- |
  | **1. The Methodological Default.**<br>Adaptationist: Selection is the productive null hypothesis; assuming function drives discovery.<br>Critic: Neutral/Constraint models are the rigorous null; assuming function biases observation. | **Crux:** Is the Spandrel critique an empirical thesis or a methodological one?<br>**Verdict:** Genuine. The methodological default determines which data are collected, thereby constructing the empirical prevalence.<br>**Test:** Blind analysis of trait sets where function is masked. | **Adaptationist Prediction:** Researchers starting with function hypotheses will identify valid adaptive complexes faster and with higher replication rates than those starting with neutral models.<br>**Critic Prediction:** Researchers starting with neutral models will identify fewer false positives (adaptive stories rejected by data) and uncover more structural causes masked by functional assumptions. |
  | **2. Unfalsifiability of Optimality Models.**<br>Adaptationist: Models fail when assumptions are wrong; this is falsification.<br>Critic: Models are often insulated from failure by adjustable parameters (e.g., unspecified costs). | **Crux:** Does the charge of unfalsifiability land against optimality modeling itself or only against a degenerate form of it?<br>**Verdict:** Genuine. It targets the practice of *post-hoc* rationalization vs. *a priori* prediction.<br>**Test:** Pre-registered optimality models with fixed trade-off costs. | **Adaptationist Prediction:** A significant proportion of pre-registered models will successfully predict trait values within confidence intervals.<br>**Critic Prediction:** Most models will fail unless allowed to adjust cost functions after observing the trait, confirming the insulation charge. |
  | **3. Prevalence and Relativization.**<br>Adaptationist: Among complex, costly traits, adaptation is the dominant explanation.<br>Critic: Among all phenotypic variations, including细微 details, non-adaptive causes dominate. | **Crux:** Is the prevalence question well-posed?<br>**Verdict:** Genuine, conditional on Agreement #5. The dispute persists even after relativization to "complex traits."<br>**Test:** Consensus ontology of "complex traits" followed by blind causal attribution. | **Adaptationist Prediction:** In the set of "complex, costly traits," >70% will show evidence of historical selection for current function.<br>**Critic Prediction:** In the same set, <50% will show such evidence; the rest will be byproducts or exaptations. |
  | **4. Stipulated Case: Correlated Selection.**<br>Scenario: A lineage where a costly, engineered-looking Trait A has a selection gradient indistinguishable from zero, while a developmentally correlated Trait B in the same structure is under strong directional selection. | **Crux:** Interpretation of zero gradient on costly traits.<br>**Verdict:** Genuine. Disagreement on whether this is a rare exception or a common pattern.<br>**Test:** The stipulated study itself. | **Adaptationist Prediction/Reading:** Trait A is a genetic/developmental hitchhiker of Trait B. This is a specific case of constraint, not a refutation of adaptationism generally. Readings separate if A can be experimentally decoupled from B; if A persists without selection, it is confirmed as a byproduct.<br>**Critic Prediction/Reading:** This confirms the Spandrel critique: apparent design (Trait A) is often a byproduct of selection on correlated features (Trait B). The two readings separate only if the Adaptationist concedes that Trait A is *not* an adaptation, reducing their prevalence estimate (i). |
