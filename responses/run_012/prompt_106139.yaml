answer: |-
  ### Desiderata for a Theory of Value Comparison

  To be adequate, a theory of value comparison must accommodate the phenomenology of hard choices without collapsing into skepticism or reducing all value to a single metric. The following specifications outline the necessary conditions such a theory must meet, categorized by the cases they resolve, the distinctions they preserve, and the formal constraints they obey.

  #### I. Substantive Requirements (The Cases)

  **1. The Trade-Off Condition**
  *   **Requirement:** The theory must allow for two options to be ranked overall even when they differ in kind, without requiring a common unit of measurement.
  *   **Motivation:** In choices between careers, partners, or moral duties, options often excel in different respects (e.g., one is more lucrative, the other more meaningful). An adequate theory must explain how an overall judgment is possible without reducing "meaning" to "money." It must permit a determinate verdict (better, worse, or equal) or explain the specific nature of the indeterminacy.

  **2. The Small Improvement Condition**
  *   **Requirement:** If option $A$ and option $B$ are such that neither is better than the other, but a marginally improved version of $A$ ($A+$) is better than $B$, then $A$ and $B$ cannot be of equal value.
  *   **Motivation:** This is the primary test for incommensurability. If $A$ and $B$ were truly equal, $A+$ would obviously be better than $B$. However, in hard choices, it often seems that $A$ is not better than $B$, $B$ is not better than $A$, yet $A+$ *is* better than $B$. A theory must accommodate this logical space: a relation where $A$ and $B$ are not equal, yet standard betterness does not hold.

  **3. The Forced Choice Condition**
  *   **Requirement:** The theory must explain how a choice can be rationally permissible (or even required) when value comparison yields no determinate verdict.
  *   **Motivation:** In many hard choices, delay is impossible or costly; one must choose. If value comparison runs out (i.e., there is no fact of the matter about which is better), rational choice theory risks implying that *any* choice is irrational or arbitrary. An adequate theory must bridge the gap between indeterminate value and determinate rational permission.

  #### II. Conceptual Requirements (The Distinctions)

  **4. The Inequality of Incomparables**
  *   **Requirement:** The theory must distinguish "incomparable" from "equal."
  *   **Motivation:** Equality implies interchangeability; if $A$ and $B$ are equal, swapping them involves no loss. Incomparability implies that the options are different in kind such that no swap is neutral. Collapsing these renders the Small Improvement Condition unintelligible.

  **5. The Fourth Relation (Parity)**
  *   **Requirement:** The theory must allow for a relation where two items are comparable (they are in the same normative neighborhood) yet neither is better, worse, nor equal to the other.
  *   **Motivation:** Standard trichotomy (better, worse, equal) fails the Small Improvement Condition. A fourth relation is needed to capture cases where options are "in the same league" but distinct enough that one does not dominate the other, and they are not interchangeable. This preserves comparability without forcing a ranking.

  **6. The Asymmetry of Betterness**
  *   **Requirement:** The theory must distinguish "better than" from "at least as good as."
  *   **Motivation:** "Better than" is asymmetric and irreflexive; "at least as good as" is reflexive. In hard choices, we often ask, "Is $A$ at least as good as $B$?" If the answer is no (because they are incomparable), but $A$ is not worse than $B$ either, the logical structure of the ordering is challenged. The theory must specify whether incomparability entails a failure of the "at least as good" relation.

  #### III. Formal Requirements (The Constraints)

  **7. Acyclicity and Transitivity**
  *   **Requirement:** The "better than" relation must be acyclic (no loops where $A > B > C > A$), and the "at least as good as" relation should ideally be transitive.
  *   **Motivation:** Without transitivity and acyclicity, rational planning is impossible. If value comparisons cycle, an agent could be money-pumped or lack a stable goal. A theory of value must preserve the possibility of coherent agency over time.

  **8. Rational Choice Among Incomparables**
  *   **Requirement:** The theory must specify whether choosing one incomparable option over another violates rationality.
  *   **Motivation:** If $A$ and $B$ are incomparable, is it irrational to choose $A$? Standard maximization models say yes (as neither maximizes value). Practical reason suggests no. The theory must define the norms of choice when the norms of value comparison are silent.

  ---

  ### The Tension and The Filter

  Having set out the requirements, we must confront the structural limits of value theory.

  **The Impossible Pair: The Fourth Relation and Transitivity**
  I suspect that **The Fourth Relation (Parity)** and **The Transitivity of 'At Least As Good'** cannot be jointly satisfied without significant theoretical cost.
  *   **Reasoning:** If $A$ is on a par with $B$, and $B$ is on a par with $C$, it does not follow that $A$ is on a par with $C$ (Parity is often non-transitive). However, if "on a par" implies a form of comparability that feeds into the "at least as good" relation, transitivity is threatened. If $A$ is comparable to $B$, and $B$ to $C$, standard order theory expects $A$ to be comparable to $C$. To maintain the Fourth Relation as distinct from equality and betterness, one typically must accept that the overall comparative structure is non-transitive in certain zones. Preserving strict transitivity usually forces the collapse of the Fourth Relation back into Equality or Betterness, thereby violating the Small Improvement Condition.

  **The Most Restrictive Requirement: The Small Improvement Condition**
  The single requirement that rules out the most candidate theories is **The Small Improvement Condition**.
  *   **Reasoning:** This condition is the wedge that breaks the standard model of rational choice. It immediately falsifies any theory that assumes **Completeness** (the idea that for any two options, one is at least as good as the other). This eliminates standard utility theory, lexical orderings, and any monistic value theory that posits a single scale of measurement. It forces the theory to adopt a partial ordering or a more complex structure. While the Forced Choice Condition is practically urgent, it is the Small Improvement Condition that does the heavy logical lifting, demanding that the theory abandon the comfort of trichotomy and completeness. Any theory that cannot satisfy this condition fails to describe hard choices; it merely describes ignorance or indifference.
