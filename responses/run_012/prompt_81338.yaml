      Proponents of Gödel's view argue that for time to objectively pass, there must be a unique, global 'now' that sweeps across the universe. In Gödel's spacetime, no such global simultaneity exists. You cannot slice the universe into distinct moments of time that cover everything everywhere. If objective lapse required this global structure, then Gödel's universe clearly lacks it. But the argument goes deeper: it is modal. Gödel posits that the nature of time should not depend on the specific distribution of matter in the universe. If time is a fundamental constituent of reality, it should be present in all worlds governed by the same physical laws. Since the laws of general relativity permit a world where temporal order is circular rather than linear, time cannot be a necessary feature of those laws.

      Furthermore, if one accepts the 'block universe' view implied by relativity—that past, present, and future all exist equally—Gödel's model simply makes this explicit. In a looping timeline, the future is already there to be visited. This undermines the idea of an open future. If the geometry of spacetime allows you to meet your past self, then your future actions are already part of the geometric structure. There is no room for a 'moving now' that creates reality as it goes. Consequently, the feeling of time passing is merely a psychological artefact of how conscious beings process information within the block, not a feature of the world itself. Gödel's universe thus serves as a reductio ad absurdum for objective becoming: if becoming were real, such loops would be metaphysically impossible. Since they are physically possible, becoming is not real.

      *(Drafting Case Against)*
      However, the inference from closed timelike curves to the ideality of time faces formidable objections. The most significant criticism distinguishes between global topology and local experience. While Gödel's universe lacks a global time function, it remains locally time-orientable. At any given point, an observer can distinguish past from future light cones. Organisms within such a universe would still experience entropy increasing and memories forming in a specific direction. The inability to assign a single universal date to every event does not negate the reality of local succession. Objective becoming might be a local phenomenon, requiring only that causes precede effects in their immediate vicinity, not across the entire cosmos.

      Secondly, critics argue that Gödel commits a modal fallacy. Even if time is ideal in a Gödelian universe, it does not follow that time is ideal in ours. The properties of a possible world do not dictate the metaphysics of the actual world. Our universe appears to be expanding and lacks the specific rotation required for closed timelike curves on a cosmic scale. If objective passage depends on the actual distribution of matter and energy, then the existence of a non-actual solution is irrelevant. We should not let a mathematical curiosity dictate the nature of our lived reality.

      Additionally, Gödel's argument assumes a specific definition of objective time that many philosophers reject. He equates real time with a global linear ordering. Yet, one might argue that objective lapse is about the asymmetry of causation or the growth of facts, not the geometry of spacetime. If the laws of physics are time-symmetric but the thermodynamic arrow of time is not, passage could be grounded in entropy rather than geometry. Finally, there is the worry that Gödel conflates the map with the territory. The inability to construct a global coordinate system is a limitation of our description, not necessarily a limitation of reality itself. Events still happen; they just cannot be neatly stacked into a single universal timeline. This suggests the problem lies with the concept of global simultaneity, not with time itself.

