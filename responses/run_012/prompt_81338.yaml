      Gödel argued this physical possibility carried heavy metaphysical weight. He contended that if a physically possible world lacks a global linear ordering of events, then the objective passage of time cannot be a fundamental feature of reality. For Gödel, the existence of such a solution demonstrated that time is 'ideal'—a construct of our minds or a measure of change, rather than a robust container in which events objectively unfold. If the laws of physics permit a world where yesterday is reachable from tomorrow, he suggested, then the common-sense notion of time flowing from past to future is an illusion, even in our own universe.

