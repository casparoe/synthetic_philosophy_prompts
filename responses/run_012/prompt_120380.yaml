answer: |-
  The nonidentity problem, introduced by Derek Parfit in *Reasons and Persons*, presents a paradox for common-sense morality regarding actions that affect who comes into existence. It arises when a choice affects not only the quality of life of a future person but also their very identity. In such cases, an action may seem intuitively wrong—such as bringing a child into existence with a significant disability—yet it appears to violate no duty to that specific child. This is because if the agent had chosen differently, that specific child would never have existed at all. Consequently, the child is not worse off than they would otherwise have been; their alternative was non-existence.

  This problem pressures a specific premise of the ordinary harm-based account of wrongdoing. This premise combines the **Person-Affecting Restriction** with the **Counterfactual Comparative Account of Harm**. The Person-Affecting Restriction holds that an act can be wrong only if it makes some particular person worse off. The Counterfactual Comparative Account defines "worse off" by comparing the person's actual state to the state they would have occupied had the act not been performed. Together, they yield the assumption specified in your prompt: *an act can be wrong only if it makes some particular person worse off than that person would otherwise have been.* The nonidentity problem demonstrates that we can have strong moral reasons to condemn an action even when this condition is not met.

  To illustrate the tension, consider the pair of cases you described.

  In the **first case** (the nonidentity case), a woman can conceive now or wait a month. If she conceives now, she will have Child A, who will have a moderate but livable impairment. If she waits, the different conditions of conception (different sperm, different egg) mean she will have Child B, who will be unimpaired. She conceives now. Here, Child A exists only because she chose to conceive now. Had she waited, Child A would not exist. Therefore, Child A is not worse off than they would otherwise have been; their alternative was never to be born. Under the ordinary harm-based account, the woman has not wronged Child A.

  In the **second case** (the same-people case), the woman can conceive now or wait a month. If she conceives now, she will have Child A, who will be impaired. If she waits, the biological circumstances allow for the *very same* Child A to be conceived later, and that child will be unimpaired. She conceives now. Here, Child A exists in both possible futures. In the actual future, Child A is impaired; in the alternative future, Child A is unimpaired. Child A is clearly worse off than they would otherwise have been. Under the ordinary harm-based account, the woman has wronged Child A.

  Most people judge the second choice clearly wrong while hesitating over the first. The intuition in the second case is driven by the presence of a clear victim: a specific individual who has been harmed by the timing of the conception. In the first case, the intuition is muddied because there is no specific victim who has been harmed in the counterfactual sense. Child A has a life worth living, and without the decision to conceive now, Child A would not be there to enjoy it. To say the woman acted wrongly seems to imply Child A should not exist, which feels paradoxical.

  However, Parfit argues that this difference in intuition does not survive scrutiny. The moral significance of the impairment does not vanish simply because the child's identity depends on the choice. In both cases, the result is a child with a moderate impairment. In both cases, the woman could have easily chosen a course of action that resulted in an unimpaired child. If the impairment is bad enough to make the choice wrong in the second case, it should be bad enough to make the choice wrong in the first. The identity of the child is morally irrelevant to the badness of the impairment itself. Therefore, the intuition that the first case is permissible is likely an artifact of our reliance on the Person-Affecting Restriction, rather than a robust moral truth.

  This forces a choice among three interpretations: that the counterfactual comparative account of harm is false, that the person-affecting restriction is false, or that our intuitions in different-people cases are unreliable.

  The most defensible reading is that the **Person-Affecting Restriction is false**. We must accept that an act can be wrong even if it does not make any particular person worse off than they would otherwise have been. The counterfactual account of harm is not necessarily false in standard cases, but it is insufficient for nonidentity cases. Relying on the claim that our intuitions are merely unreliable is too easy; it dismisses the substantive moral worry that the woman in the first case *did* do something objectionable by needlessly creating a life with less well-being than she could have created.

  One might attempt to salvage the person-affecting view through a revised, less strict version: the **Wide Person-Affecting View**. On this view, an act can be wrong for how it affects people in the aggregate, even though no single individual is made worse off. In the first case, while Child A is not worse off, the choice affects the "aggregate" of people by bringing into existence a person with lower well-being than the person who would otherwise have existed.

  Does this revised restriction escape the problem without collapsing into a purely impersonal view? It escapes the problem, as it allows us to condemn the woman's choice in the first case. However, it teeters on the edge of collapsing into impersonalism. A purely impersonal view (like Total Utilitarianism) claims that we ought to maximize the good regardless of who exists. The Wide Person-Affecting View tries to maintain that wrongness must still be grounded in effects on *people*, not just abstract states of affairs. Yet, if we are aggregating welfare across possible different people to determine wrongness, the distinction between "affecting people" and "maximizing impersonal value" becomes thin. If the view says we should choose the outcome with the higher aggregate welfare even when no specific person is harmed, it is functionally impersonal.

  I defend the reading that the **Person-Affecting Restriction must be rejected** in favor of a principle like Parfit's "Same Number Quality Claim" (Principle Q). This principle states: "If in either of two possible outcomes the same number of people would ever live, it would be worse if those who live are worse off, or have a lower quality of life, than those who would have lived."

  This reading is superior because it aligns with the moral insight that the value of a life matters independently of the identity of the liver. To insist on the strict Person-Affecting Restriction is to privilege the "who" over the "how well," which is arbitrary. While the revised "Wide" Person-Affecting View is a useful heuristic, it ultimately admits that moral status attaches to outcomes involving possible people, not just actual, specific victims. Accepting this does not require a full slide into a cold, calculating impersonalism that ignores individual rights in standard cases. We can maintain that in same-people cases, individual harm is the primary metric of wrongness, while acknowledging that in different-people cases, the comparative quality of life governs.

  Therefore, the nonidentity problem shows that morality is not exclusively person-affecting in the strict sense. We must accept that we can wrong future people by bringing them into existence in a worse state than we could have, even if they are not worse off than they would otherwise have been. The revised restriction that allows for aggregate evaluation is the necessary correction, even if it acknowledges that moral value is partially impersonal. This preserves the intuition that the woman in the first case acted wrongly without forcing us into the absurdity that Child A has a complaint against their own existence.
