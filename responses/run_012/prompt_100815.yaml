      *   **Constraint 1 (Doxastic Voluntarism):** No direct instructions to "decide to believe." Belief isn't under direct will. Techniques must be indirect (attention management, evidence curation, social curation, repetition/rehearsal).
      *   **Constraint 2 (The Puzzle):** Address the paradox of self-deception (intending to deceive oneself requires forgetting the intention). The guru must resolve this (either partitioning the self or denying intention) without naming a theory, letting the reader feel the cost.
      *   **Tone:** Deadpan, no winking at the reader. Irony must come from content.
      *   **Audience:** Legible to laypeople, but philosophically sound.

  2.  **Deconstruct the Philosophy:**
      *   *Self-Deception Paradox:* How can I intend to make myself believe $p$ when I know $\neg p$? If I know the strategy, I know the truth.
