answer: |-
  Your skepticism is well-founded. The account you read is a classic example of a popularization that conflates *mathematical results* (which are precise) with *philosophical interpretations* (which are contested), presenting the latter as if they were the former. A working set theorist or philosopher of mathematics would accept the historical and technical skeleton of the story but would strongly object to the philosophical conclusions drawn from it.

  Here is a claim-by-claim audit of the narrative you provided, followed by an analysis of the technical status of the problem and an adjudication of your dispute with your friend.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"Cantor's continuum hypothesis says that there is no size of infinity strictly between the countable and the continuum."*
  *   **Verdict:** **Correct.**
  *   **Comment:** This is the standard definition ($2^{\aleph_0} = \aleph_1$).

  **Claim 2:** *"Cantor believed it and tried for years to prove it, without success."*
  *   **Verdict:** **Correct.**
  *   **Comment:** This is historically accurate. It caused him significant distress.

  **Claim 3 & 4:** *"Gödel then showed that the hypothesis cannot be proved... and Cohen... showed that it cannot be disproved either."*
  *   **Verdict:** **Correct (with technical caveats).**
  *   **Comment:** Gödel (1938) proved consistency (if ZF is consistent, ZF+CH is consistent). Cohen (1963) proved independence (if ZFC is consistent, ZFC+$\neg$CH is consistent).
  *   **Caveat:** As you suspected, these results are not unconditional. They are *relative consistency* results. They assume the standard axioms (ZFC) do not contain a contradiction. If ZFC were inconsistent, everything would be provable. However, assuming ZFC is consistent (which all mathematicians do), the summary is accurate.

  **Claim 5:** *"The hypothesis is therefore independent of the axioms."*
  *   **Verdict:** **Correct.**
  *   **Comment:** CH is independent of ZFC (Zermelo-Fraenkel set theory with the Axiom of Choice).

  **Claim 6:** *"It is neither true nor false."*
  *   **Verdict:** **Philosophically Contested / Likely Wrong.**
  *   **Comment:** This is the first major overstep. Independence means the *axioms* cannot decide the truth value. It does not logically entail that the statement lacks a truth value.
      *   **Formalists** agree with the book:数学 is a game of symbols; if the rules don't decide it, it has no truth value.
      *   **Platonists (Realists)** disagree: They believe the "universe of sets" is a real, determinate object. Just because our map (the axioms) is incomplete doesn't mean the territory (the sets) is vague. To a Platonist, CH is either true or false; we just haven't found the right axioms to prove which.
      *   **Consensus:** Most working set theorists act as *methodological Platonists*. They speak of "the" universe of sets and treat the question of CH's truth as a genuine open problem, not a dissolved one.

  **Claim 7:** *"Exactly as the parallel postulate is a matter of which geometry one does."*
  *   **Verdict:** **Defensible Simplification but Misleading.**
  *   **Comment:** This is the analogy you suspected was doing too much work.
      *   **Geometry:** We do not believe there is one "true" geometry. Euclidean geometry describes flat space; Non-Euclidean describes curved space. Both are valid structures.
      *   **Set Theory:** Most set theorists believe there is *one* intended universe of sets (the cumulative hierarchy). The axioms are meant to describe *that* universe, not define a class of possible universes.
      *   **The Breakdown:** In geometry, changing the postulate changes the *structure* being studied. In set theory, changing the axioms is viewed by many as an attempt to better describe the *same* structure. The analogy implies set theory is merely the study of "models of ZFC," whereas practitioners view it as the study of "sets."

  **Claim 8:** *"There are 'Cantorian' and 'non-Cantorian' set theories."*
  *   **Verdict:** **Terminologically Incorrect.**
  *   **Comment:** This is not standard terminology. Set theorists speak of "models of ZFC + CH" and "models of ZFC + $\neg$CH." Calling them "Cantorian" implies Cantor endorsed one side exclusively (he did endorse CH), but it suggests a schism in the field that doesn't exist in that naming convention.

  **Claim 9:** *"Neither is more correct than the other, and the only question is which is more convenient."*
  *   **Verdict:** **Philosophical Stance, not Mathematical Fact.**
  *   **Comment:** This is the "Multiverse View" (championed by Joel David Hamkins and others). It is a respected philosophical position, but it is not the consensus. Many prominent set theorists (like Hugh Woodin) actively search for new axioms that will prove CH is *false* (or true), believing one is genuinely correct. To say it is *only* a matter of convenience dismisses a large portion of contemporary research.

  **Claim 10:** *"The continuum problem is settled, and that is the deepest lesson infinity has to teach."*
  *   **Verdict:** **Wrong.**
  *   **Comment:** The *independence* is settled. The *problem* (what is the size of the continuum?) is widely considered open. The "deepest lesson" is debatable, but claiming the problem is "settled" implies no further research is needed, which is false. Research into new axioms is vibrant.

  ---

  ### Part 2: Technical Nuances and Current Status

  **1. Unconditional vs. Relative Consistency**
  You asked if the independence results are unconditional. They are **not**.
  Gödel and Cohen proved:
  *   If ZF is consistent, then ZFC + CH is consistent.
  *   If ZFC is consistent, then ZFC + $\neg$CH is consistent.
  Mathematicians assume ZFC is consistent. If ZFC were inconsistent, the independence results would be trivial (because everything is provable in an inconsistent system). However, by Gödel's Second Incompleteness Theorem, ZFC cannot prove its own consistency. So, strictly speaking, the independence of CH rests on the assumption that standard mathematics does not contain a contradiction.

  **2. Have further axioms been proposed?**
  Yes. The independence of CH from ZFC did not stop the search for axioms that extend ZFC.
  *   **Large Cardinal Axioms:** These assert the existence of extremely large infinite sizes. Surprisingly, most large cardinal axioms *do not* decide CH. They are compatible with both CH and $\neg$CH.
  *   **Forcing Axioms:** Axioms like **PFA (Proper Forcing Axiom)** or **MM (Martin's Maximum)** imply that $\neg$CH is true (specifically, that the continuum is $\aleph_2$). Many set theorists find these axioms "natural" because they maximize the richness of the mathematical universe.
  *   **Inner Model Hypothesis / Ultimate L:** Hugh Woodin has proposed scenarios (involving "Ultimate L") that might imply CH is *true*.
  *   **Standing:** There is no consensus yet. However, the field is not "settled" in the sense of "nothing left to do." It is an active battleground of competing axiom systems.

  ---

  ### Part 3: Adjudicating the Dispute (Axiom of Choice vs. Continuum Hypothesis)

  Your friend's argument contains a mix of fact and misconception. Here is the breakdown:

  **Friend's Claim 1:** *"The axiom of choice (AC) is likewise independent of the other axioms of set theory."*
  *   **Verdict:** **Correct.**
  *   **Detail:** AC is independent of ZF (Zermelo-Fraenkel without Choice). Gödel and Cohen proved this just as they did for CH.

  **Friend's Claim 2:** *"That is precisely why some mathematicians refuse to use it."*
  *   **Verdict:** **Incorrect.**
  *   **Detail:** This is the critical error. Historically, mathematicians were wary of AC (in the early 20th century) not because it was independent, but because of its **counterintuitive consequences**.
      *   AC implies the existence of non-measurable sets and the Banach-Tarski paradox (decomposing a ball and reassembling it into two balls of the same size).
      *   Constructivists and Intuitionists reject AC because it asserts the existence of a set without providing a method to construct it.
      *   Independence was not discovered until 1963 (Cohen). The controversy over AC peaked in the 1900s–1930s, long before independence was proven.
      *   Today, AC is almost universally accepted (hence "ZFC"). Its independence is not a source of worry for working mathematicians.

  **Friend's Claim 3:** *"There is nothing special about the continuum [compared to AC]."*
  *   **Verdict:** **Incorrect.**
  *   **Detail:** There are profound differences between AC and CH:
      1.  **Utility:** AC is a *tool*. It is used to prove theorems in analysis, algebra, and topology (e.g., every vector space has a basis). CH is a *structural statement*. It describes the layout of the infinite hierarchy. It has very few consequences for "ordinary" mathematics (analysis, number theory).
      2.  **Acceptance:** AC is part of the standard foundation (ZFC). CH is not.
      3.  **Nature of Independence:** Because AC is so useful, mathematicians adopted it despite its weird consequences. CH is not useful enough to force a consensus.
      4.  **Truth Value:** Many mathematicians who accept AC as "true" still debate CH. The independence of AC is generally viewed as a reason to accept it as a useful axiom; the independence of CH is viewed as a mystery to be solved by new axioms.

  **Summary of the Dispute:**
  Your friend is right that both are independent of the base axioms (ZF for AC, ZFC for CH). He is wrong that independence is the reason for wariness of AC (it was the consequences), and he is wrong that the situations are analogous. AC is a settled tool of the trade; CH is an open wound in the foundation of set theory.

  ### Final Conclusion

  The book you read adopted a **Formalist/Multiverse** philosophical stance and presented it as mathematical fact.
  *   **What to trust:** The history (Cantor, Gödel, Cohen) and the technical result (CH is independent of ZFC).
  *   **What to distrust:** The claim that CH is "neither true nor false," the analogy to the parallel postulate, and the claim that the problem is "settled."

  A working set theorist would likely tell you: "We know ZFC cannot decide CH. We are now trying to find better axioms that can. Whether CH has a truth value depends on whether you believe there is one true universe of sets. Most of us behave as if there is, which is why we don't consider the case closed."
