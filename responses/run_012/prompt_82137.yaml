answer: |-
  You have constructed a very tight philosophical knot, and you have done so with a clarity that makes the source of the tension visible. You are not confused about the facts; you are confused about the *category* of the sentence you are analyzing.

  To untangle this, you should give up this specific assumption:

  **Assumption to discard:** *That the claim "history bends toward justice" is primarily a descriptive hypothesis about the causal architecture of the universe (subject to the Drift/Aim binary).*

  You are treating the sentence as if it were a proposition in the philosophy of science or metaphysics, competing with theories of causation. It is not. It is a **moral and political orientation** disguised as a description.

  Here is why giving up this assumption dissolves your two specific difficulties, and which of your three self-diagnoses was the closest to the mark.

  ### 1. Dissolving the Drift/Aim Dilemma (Your First Difficulty)
  You are stuck because you believe that for the sentence to be true, it must correspond to a specific metaphysical mechanism: either blind causation (Drift) or teleological pull (Aim). You correctly note that empirically, a strong Drift and a strong Aim look identical.

  If you drop the assumption that the sentence is a *causal description*, the Drift/Aim distinction becomes irrelevant to the **truth** of the claim, though it remains relevant to the **strategy** of the actor.

  *   **If it is Drift:** The sentence is a recognition of a trend that agents can ride.
  *   **If it is Aim:** The sentence is a recognition of a design that agents can align with.

  In both cases, the *work* the sentence does is the same: it licenses the agent to endure present suffering for the sake of a future payoff. The "truth" of the sentence does not depend on the physics of history, but on the **reliability of the commitment** it engenders in those who believe it. Your friend is closer to the mark than you are: the mechanism is secondary to the reliability of the trajectory. But you are right to sense that "Drift" feels like it empties the meaning. That is because you are looking for *cosmic* meaning in a *human* project.

  ### 2. Dissolving the Speech-Act Worry (Your Second Difficulty)
  You wrote: *"If that is right, then asking whether it is true may be like asking whether a promise is true."*

  You identified the solution but treated it as a problem. You asked if you should give up the idea that the sentence does several jobs at once. **Do not give this up.** This is your strongest insight.

  The assumption you must give up is the corollary: *that a sentence doing several jobs cannot have a truth value.*

  In moral and political language, "truth" is often a hybrid of correspondence (does this match the world?) and felicity (does this successfully commit me to action?). When Martin Luther King Jr. (or whoever originated the phrase) used it, he was not offering a law of social physics. He was issuing a **performative declaration**. He was creating the arc he described by convincing others to act as if it were true.

  If you treat the sentence as a promise or a commitment, your "Problem 2" vanishes. It is not a bug that the sentence is a prediction, a description, and a commitment all at once; that is the *nature* of prophetic political speech. It is supposed to be a self-fulfilling prophecy. By assuming it must be a static description, you created a paradox where none exists.

  ### 3. Which of your three diagnoses was correct?
  You asked: *"Is my drift-and-aim division the wrong way to cut the cake, or is my account of what aiming amounts to the thing that has gone wrong, or am I wrong that a sentence can be doing several jobs at once?"*

  *   **The Drift/Aim division:** This is a valid distinction for biology or physics, but it is the **wrong way to cut the cake** for this specific sentence. Applying it here forces a category error.
  *   **The account of Aiming:** Your definition (future pulling present) is metaphysically strict, but not the source of the main confusion.
  *   **The Sentence doing several jobs:** You are **right** about this, not wrong.

  Therefore, the assumption to surrender is the implicit premise connecting these three: **that meaningful claims about history must be reducible to causal explanations.**

  ### What remains live, and what was an artifact?

  **Artifacts (Questions that disappear once you drop the assumption):**
  1.  *"Is the mechanism Drift or Aim?"* This no longer determines the truth of the claim. It only determines the *method* of advocacy.
  2.  *"Can evidence distinguish the two?"* It doesn't need to. The claim is not a scientific hypothesis waiting for falsification.
  3.  *"Is the sentence truth-apt if it functions as a promise?"* Yes, in the pragmatic sense. A promise can be "true" (kept/realized) or "false" (broken/abandoned).

  **Live Questions (Questions that become clearer once the assumption is dropped):**
  1.  *"Is the commitment sustainable?"* Since the claim is partly a wager, the question is not "Is it metaphysically true?" but "Is it psychologically and sociologically robust enough to sustain the effort required to make it true?"
  2.  *"Who is the 'we' that does the bending?"* If the bend is not automatic (Drift) and not divine (Aim), it must be human. The live question becomes: "Do we have the agency to complete the arc?"
  3.  *"What counts as justice?"* If the bend is not guaranteed by the cosmos, the definition of the destination is entirely up to the agents. This makes the definition of justice the primary political battleground, rather than the mechanics of history.

  **Summary:**
  You are trying to solve a moral problem with a metaphysical toolkit. Put the toolkit down. The sentence is not a map of the territory; it is a compass for the traveler. A compass is not "true" or "false" based on the geology of the ground; it is "useful" or "useless" based on whether it gets you where you intend to go. Your confusion lies in asking for the geology when you should be asking for the destination.
