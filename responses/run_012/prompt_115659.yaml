prompt: |-
  I've got a seminar coming up on whether a nation can be guilty and I want to write down my actual position beforehand so I don't get caught out, but every time I try the list I end up feeling like I've smuggled something in. So: here's the package, please audit it. I've been using the four-way split I associate with Jaspers — criminal, political, moral, metaphysical guilt — or at least that's how I remember it from a course years ago, and it's been doing a lot of work for me. What I believe: (1) guilt in the morally serious sense, the kind that warrants blame and calls for atonement, requires a subject with intentions and agency, so strictly speaking only individuals are morally guilty; (2) but "Germany is guilty" is not just a metaphor or shorthand for "lots of Germans did bad things" — the political guilt of a nation is a real thing, it's just a different kind of thing from an individual's guilt; (3) you can't be morally guilty for something you didn't do, so nobody alive today is guilty for the crimes of their ancestors, full stop; (4) that said, contemporary citizens do owe something to the descendants of the people their state wronged — I'd call that a debt or an obligation to repair, not guilt; (5) the metaphysical guilt idea is right in spirit: being alive and part of a community that did monstrous things puts you in a condition of being implicated, even if you personally did nothing, and I do think that's a real form of guilt and not just a bad feeling; (6) a grown adult in 1943 who did nothing is guilty of something, even if there was nothing they could have done.

  Which of these actually pull against each other, which only look like they do, and what's the cheapest revision that would restore consistency? Rank the tensions by severity instead of listing them all as equally bad — I suspect I'm missing something structural and I'd rather find out now than in front of the room. For the worst one, say exactly what has to give and what I lose by giving it up, and if any pair only hangs together once I add a further claim I haven't stated, tell me what that claim would have to be and whether it's one I'd actually want to hold.
reasoning: |-
