      Futarchy presupposes that social welfare is a unidimensional, cardinally measurable quantity separable from empirical belief, such that interested market prices can reliably isolate causal counterfactuals. This commitment necessitates a consequentialist theory of value where all morally relevant goods are reducible to a single scalar index. By fixing the index ex ante, the system assumes that the good is commensurable across persons and contexts, licensing interpersonal comparisons required to aggregate welfare into a statistic like GDP or life satisfaction. If value were plural or incommensurable, no single index could capture the trade-offs, rendering the market's maximization task unintelligible. Thus, the machinery strictly requires a monistic axiology, though it remains underdetermined between specific variants like hedonistic utilitarianism or preference satisfaction, provided they yield a cardinal metric.

      Furthermore, the design presupposes a Humean instrumentalism that sharply separates values from beliefs. It assumes voters can identify ends without understanding means, ignoring how policy choices constitutively shape values. This separability is essential because the market is tasked solely with epistemic labor—discovering causal relations—while the vote handles normative labor. If values and beliefs were entangled, fixing the index before knowing policies would lock in ignorance, preventing the discovery that certain means are incompatible with the chosen ends. The system therefore demands that normative truth be accessible independently of empirical discovery.

      Regarding market epistemology, the practice assumes that financial incentives can overcome the bias of interested parties. Since traders benefit from policy outcomes beyond their contracts, their bets conflate profit motives with personal stakes in the welfare index. For prices to carry belief rather than preference, the theory must assume that marginal profit from truth-telling dominates the utility gained from manipulating policy outcomes. This requires a specific psychology where agents are more responsive to market arbitrage than to political self-interest, a condition not guaranteed by standard rational choice models. Additionally, resolving the counterfactual settlement problem—where prices reflect adoption probability—presupposes that causal expectations are separable from political probabilities. The market must be able to price $E[Index | Policy]$ distinct from $E[Index | Policy \land Adoption]$, implying that causal knowledge is liquid even when the cause is endogenous to the market itself.

      While this machinery fits comfortably with classical utilitarianism, it is strictly compatible with any theory that reduces value to a maximizable scalar, including average utilitarianism or prioritarianism. However, it cannot accommodate frankly pluralist views. A pluralist theory recognizing incommensurable values would reject the single index, requiring multiple markets without a clear aggregation rule, leading to cycling or paralysis. Similarly, a deontological framework would reject the maximization logic entirely. Rights-based constraints function as side-constraints, not variables to be optimized against policy efficiency. To accommodate deontology, the market mechanism would need to be subordinated to veto gates protecting inviolable duties, transforming the system from a welfare maximizer into a constraint satisfier. Ultimately, futarchy is not a neutral decision procedure but a substantive ethical technology that enforces consequentialist monism by design.

