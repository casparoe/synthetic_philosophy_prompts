  3.  **Drafting - Step 2: Defend/Elaborate (incorporating the puzzles).**
      *   *Measurability/Comparability:* The index choice implies welfare is reducible to a scalar. This requires strong cardinal measurability and interpersonal comparability (utilitarianism). If welfare were ordinal or incommensurable, the index couldn't function as a universal denominator.
      *   *Separability:* The design assumes values (the index) can be fixed independently of means (policies). This presupposes a Humean instrumentalism where reason (markets) serves passion (votes) without feedback. It ignores that means often constitute ends.
      *   *Prices/Beliefs:* The puzzle about interested traders assumes that profit incentives align truth-telling even when traders benefit from the policy outcome itself. This requires believing market incentives swamp personal stake in the policy outcome.
      *   *Counterfactuals:* The settlement problem assumes prices reflect $E[Index | Policy]$ rather than $E[Index | Policy \& Adoption]$. This requires a market structure that subsidizes or forces counterfactual resolution, presupposing causality is price-discoverable despite reflexive loops.
