      *   *The "Solutions":*
          *   Premise-based: Merge $v_P, v_Q$. Compute $v_R = v_P \land v_Q$. (Enforce invariant on write/merge).
          *   Conclusion-based: Merge $v_R$. $v_P, v_Q$ are secondary or discarded. (Prioritize output consistency over input fidelity).

      *   *Desiderata Mapping:*
          *   Universal Domain $\rightarrow$ Convergence / Eventual Consistency (must handle any input history).
          *   Collective Rationality $\rightarrow$ Integrity Preservation (Invariant holds after merge).
          *   Anonymity $\rightarrow$ Symmetry (no primary/leader bias in merge logic).
          *   Systematicity (IIA) $\rightarrow$ Context-Independence / Locality (merge of $X$ doesn't depend on value of $Y$).
          *   Non-dictatorship $\rightarrow$ No Single Point of Failure / No Static Leader.

      *   *Impossibility Result:* This maps surprisingly well to CAP/FLP but specifically to *Invariant-Confluent Replication*. You cannot have a merge function that is purely local (IIA), symmetric, handles all concurrent updates (Universal Domain), and preserves complex invariants (Collective Rationality) without coordination (which violates the "no dictatorship/coordination" spirit or availability). Actually, it maps closer to the impossibility of *coordination-free* invariant preservation for non-monotonic constraints.

  5.  **Developing the Residue Report:**
      *   *Good Translation:* The structural inconsistency (Invariant Violation) is exact. The Premise/Conclusion choice is exactly "Reconcile Inputs vs. Reconcile Outputs."
      *   *Fudging:* "Judges" are active agents; Replicas are passive. Replicas don't "believe" $P$, they store $v_P$. The *semantic* link between $P$ and $R$ is external to the storage layer in DS, whereas in Judgment Aggregation (JA), it's internal to the logic.
