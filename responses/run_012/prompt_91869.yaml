      *   *Actually, let's stick to the prompt's suggestion:* "Bold: gets central mechanism right but drags in an extra entity. Timid: says almost nothing false but also almost nothing true."
      *   *Scenario:* A disease mechanism.
      *   *Truth:* Virus $V$ causes Disease $D$ by binding to Receptor $R$.
