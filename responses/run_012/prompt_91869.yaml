      *   *Bold Theory ($T_B$):* Expanding, driven by a specific scalar field (quintessence) that doesn't exist, flat geometry. (Gets expansion right, posits wrong mechanism).
      *   *Timid Theory ($T_T$):* The universe is static on large scales, but local motions exist. (Gets almost nothing right about the global state, but makes fewer specific false claims about mechanisms).
      *   *Wait, let's refine for the "content vs. likeness" tension.*
      *   *Better Example:* A specific chemical structure.
      *   *Truth:* Molecule $M$ has structure $A-B-C$.
