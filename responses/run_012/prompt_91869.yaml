answer: |-
  **Setting:** *A generic conference center hallway, outside a breakout room. The hum of a vending machine. Elena holds a styrofoam cup that has long gone cold. Marcus is leaning against the wall, scrolling through a program on his phone.*

  **Elena:** You walked out of the verisimilitude session.

  **Marcus:** I walked out for coffee. The air in there was dead. Besides, we've been having the same conversation since 1974.

  **Elena:** That's my point. We've been having it for fifty years because the intuition won't die. We *need* to be able to say that Einstein is closer to the truth than Newton, even though both are strictly false. If you can't say that, you can't make sense of scientific progress. You just have theory replacement, like swapping one tool for another without any sense of refinement.

  **Marcus:** And I'm saying that "closer to the truth" is a metaphor that breaks the moment you try to formalize it. You treat it like a distance metric. But distance requires coordinates. Who chose the coordinates?

  **Elena:** The world chose the coordinates. The truth is the target.

  **Marcus:** The truth is a point, sure. But the distance to that point depends entirely on how you map the space. Miller proved this. If I describe the world in terms of "hot, rainy, windy," and you describe it in terms of "hot, Minnesotan, Arizonan"—where the latter are logical functions of the first—I can make any false theory look closer to the truth than yours just by switching languages. If verisimilitude is language-dependent, it's not a measure of reality. It's a measure of your vocabulary.

  **Elena:** Miller's translation argument is a technical constraint, not a knockout blow. It tells us we need to restrict our comparisons to natural kinds or privileged vocabularies. We don't compare theories in *any* language; we compare them in the language of the ontology they share. The 1974 trivialization results—Tichý, Harris—they showed Popper's *specific* definition was broken. He defined it purely in terms of logical content: more true consequences, fewer false ones. That failed because a false theory always has infinite false consequences. But that doesn't mean the *concept* is broken. It just means content isn't enough. You need likeness.

  **Marcus:** Likeness. The "similarity to the actual world" move.

  **Elena:** Exactly. We compare the possible worlds where the theory is true to the actual world. If the worlds allowed by Theory A are structurally more similar to the actual world than the worlds allowed by Theory B, then A is more verisimilar. It handles the "Bold vs. Timid" problem that content accounts choke on.

  **Marcus:** Let's hear it. I assume you have a pet example.

  **Elena:** I do. Think about a causal mechanism. Say, the true structure of a specific protein interaction. The truth is: Protein A binds to Protein B, which triggers Cascade C.
  Now, consider two false theories.
  Theory Bold says: A binds to B, triggers C, and also releases Particle X. (Particle X doesn't exist).
  Theory Timid says: Something biological triggers C. (It denies the specific A-B mechanism, or just stays vague).
  Actually, let's make Timid properly false but low-content. Theory Timid says: Protein A binds to Protein D to trigger C.
  So, Bold gets the main mechanism (A-B) right but adds a fictitious entity (X). Timid gets the mechanism wrong (A-D) but doesn't add extra entities.

  **Marcus:** Okay.

  **Elena:** On Popper's content account, Bold is in trouble. It has all the true consequences of the truth, plus it asserts X exists. That's a massive amount of false content. Timid has less false content because it says less. A content measure might rank Timid higher, or at least struggle to rank Bold higher. But intuitively, Bold is *better*. It's closer. It got the engine right; it just imagined an extra exhaust pipe. Likeness accounts capture this. The world where A binds B and releases X is structurally closer to the actual world than the world where A binds D.

  **Marcus:** Intuitively, yes. But "structurally closer" is doing a lot of heavy lifting there. You're weighting the A-B bond as more "important" than the existence of X. Why?

  **Elena:** Because the A-B bond is the central mechanism.

  **Marcus:** Ah, there it is. "Important." That's a pragmatic weight, not a metaphysical one. You're smuggling in what matters for *us*—for prediction, for intervention—and calling it "truthlikeness." If I care about Particle X, and I'm building a detector for it, Theory Bold is a disaster. It sends me on a wild goose chase. Theory Timid doesn't. In that context, Timid is the safer bet. You're ranking them based on a specific weighting of errors, but you present it as an objective distance to Truth.

  **Elena:** I'm not weighting based on human interest. I'm weighting based on ontological dependence. The existence of X is contingent on the mechanism. Getting the mechanism right is a deeper approximation of the structure of reality.

  **Marcus:** But you can't specify that structure without assuming the truth to measure the distance. And here's the thing that keeps me up at night: We don't have the truth. We are comparing two false theories. To say one is closer to the truth, you need to know where the truth *is*. If we knew where the truth was, we wouldn't need the measure.

  **Elena:** We don't need to know the truth with certainty to estimate distance. We use fallible indicators. Consilience, novel prediction, robustness. These are evidence of verisimilitude, not the definition of it.

  **Marcus:** No, they're evidence of empirical adequacy. Look, take your Bold theory. It says $p, q, r, s$. Truth is $p, q, r, \neg s$.
  Timid says $p, \neg q$.
  You want to say Bold is closer because it got $p, q, r$ right. But Bold also committed to $s$. In a logical space, adding a false conjunct explodes the falsity content. To save Bold, you have to say that $s$ is "less wrong" than $\neg q$. But how do you measure "less wrong"? Is it wronger to say a particle exists when it doesn't, or to say a bond goes to D instead of B?
  If you say "It depends on the similarity of the states of affairs," I ask: Similar in what respect? Color? Shape? Causal power?
  If you say "Causal power," you've abandoned truthlikeness for causal explanation. Just say that! Don't wrap it in the language of truth.

  **Elena:** Because it *is* about truth! That's what realism is. Science aims at true theories. When we refine a theory, we aren't just making better predictions; we are stripping away error. If you deny verisimilitude, you're forced to say that when we moved from Newton to Einstein, we didn't get closer to how the universe actually is. We just got better at saving the phenomena.

  **Marcus:** I'm saying "closer to how the universe actually is" is a picture that holds us captive. You're imagining the Truth as a location on a map. But if the map is drawn in your vocabulary, the distance is arbitrary.
  Let's go back to your Bold theory. $A \to B \to C + X$.
  Suppose I define a new property, $K$, which means "The system has structure $A \to B \to C$."
  Then Bold says $K \land X$. Truth says $K \land \neg X$.
  Timid says $\neg K$.
  Now, in terms of $K$, Bold is half right. Timid is wholly wrong about $K$.
  But suppose I define property $M$, which means "The system does not contain fictitious entity X."
  Truth has $M$. Bold lacks $M$. Timid has $M$ (vacuously, or explicitly).
  Now Timid looks closer.
  You can toggle the ranking just by toggling the predicates. Unless you have a God's-eye view of which predicates are "natural," you're just ranking theories by how much you like their vocabulary.

  **Elena:** This is the linguistic relativity objection again. And the reply is that not all vocabularies are equal. There are natural kinds. There is a joint to carve. If your predicates don't map onto the causal structure of the world, your distance metric is garbage. But that doesn't mean distance is incoherent; it means some maps are wrong.

  **Marcus:** But to know which maps are wrong, you need to know the joints. Which is the truth. We're back to square one. You're defining progress as movement toward a target you can't identify, using a ruler that changes length depending on which hand holds it.
  Why not just drop the metaphysics? Talk about problem-solving effectiveness. Bold solves more problems than Timid, usually. It opens new lines of inquiry. It unifies phenomena. Timid is safe but sterile.
  Rank them by utility. Rank them by empirical adequacy. But don't tell me Bold is *truer*. Tell me it's more *useful*.

  **Elena:** Because utility isn't enough. History is full of useful falsehoods. Phlogiston was useful. Caloric fluid was useful. We don't say we progressed *from* Phlogiston *to* Oxygen just because Oxygen predicts better. We say we progressed because Oxygen is *real* and Phlogiston isn't. We captured a piece of the ontology.
  If you strip out verisimilitude, you strip out the explanation for *why* the predictions got better. They got better because the theory latched onto the actual causal gears.
  Your deflationism makes the success of science a miracle. If theories aren't getting closer to the truth, why do they work better?

  **Marcus:** They work better because we're pruning the errors that interfere with intervention. We don't need "Truth" with a capital T to explain that. We just need to know which levers move the world.
  Your Bold theory posits Particle X. That's a lever that doesn't exist. If I build my technology on Bold, it might fail when X doesn't show up.
  You want to say Bold is "closer to the truth" because it got the A-B bond right. I say Bold is "more risky."
  The intuition you have—that Bold is better—is actually an intuition about *potential*. Bold has more truth *potential*. It contains the seed of the truth. But as it stands, it's false.
  To say it's "partially true" is just a figure of speech for "contains some true sentences."
  But "closer"? That implies a continuum. And I don't think there's a continuum between False and True. There's just False. And then there's True.
  You're trying to build a bridge out of Falsehoods that never quite reaches the shore, and calling the distance traveled "progress."

  **Elena:** That's a binary view of truth that ignores the structure of representation. A map isn't just true or false. A map can be inaccurate by a meter, or inaccurate by a mile.
  If I say "London is 50 miles from Cambridge" and you say "London is 500 miles from Cambridge," we are both false. But I am not false in the same way you are. I am *less* false.
  If you deny that, you're denying the basic texture of scientific practice. When we tune parameters, when we correct boundary conditions, we are minimizing error. Minimizing error *is* increasing verisimilitude.

  **Marcus:** Minimizing error in *predictions*. Not minimizing distance to a noumenal reality.
  Your map analogy works only if we can measure the distance on the ground. But we can't stand outside the map. We are always drawing.
  When you say Bold is closer because it got the mechanism right, you're assuming the mechanism is the "real" distance metric. But that's just because the mechanism is what *we* care about right now.
  In fifty years, maybe Particle X turns out to be a useful fiction for a higher-level theory. Maybe the A-B bond is an approximation of a field interaction.
  Then your "closeness" ranking flips.
  The ranking tracks our current interests, not the distance to the Truth.

  **Elena:** So on your view, when we finally get the Theory of Everything, we won't be able to say it was the culmination of a long approach? We'll just say it was the last one that worked?

  **Marcus:** I'll say it was the one that saved all the phenomena without contradiction. I won't say it's "closer" than Newton was. Newton was false. Einstein is false. The TOE will probably be false too.
  They are all tools. Some are finer than others.
  You want to call fineness "truthlikeness." I call it "precision."
  Don't conflate the two.

  **Elena:** Precision without truth is just engineering. I'm talking about science. Science is about what the world *is*.
  If you can't say the TOE is closer to the way the world is than Phlogiston, you've lost the plot.
  You're afraid of the metaphysics because it's hard to formalize.

  **Marcus:** I'm afraid of it because it's idle. It does no work.
  Show me a case where believing in verisimilitude changes your methodology.
  You still test predictions. You still check consistency. You still look for anomalies.
  The "verisimilitude" label is just a pat on the back you give yourself to feel like a Realist.
  "Bold is closer." Okay. So what? Do you test it differently? No. You test it by looking for X. If you find X, it's true. If you don't, it's false.
  There is no "almost true" in the lab. There is only "not yet falsified" and "falsified."

  **Elena:** That's instrumentalism, Marcus. Pure and simple.
  And it fails to explain theory choice. When we choose Bold over Timid, we aren't just choosing a tool. We are betting on the ontology. We are saying the world is *more like* Bold than Timid.
  That "more like" is verisimilitude.
  You can call it a metaphor if you want. But it's the only metaphor that explains why we don't just go back to Timid when Bold gets falsified on X. We keep the A-B bond. We discard X.
  We retain the truth-content and discard the falsity-content.
  That editing process *is* the increase in verisimilitude.

  **Marcus:** It's the increase in empirical robustness.
  Keep your editing process. Just don't claim it's a vector pointing to The Truth.
  It's a vector pointing away from Anomaly.
  There's a difference.

  **Elena:** Not if the anomalies are caused by distance from the truth.

  **Marcus:** You're assuming what you need to prove.
  (Checks phone)
  I have to go. Next session is on Bayesian confirmation.

  **Elena:** At least there the math works.

  **Marcus:** At least there they admit it's about degrees of belief, not degrees of truth.
  Don't wait for the next Popperian fix, Elena. The glitch isn't in the definition. It's in the ambition.

  **Elena:** And don't pretend you can explain progress without it. You'll just be describing tools in the dark.

  **Marcus:** Better than mapping a territory that isn't there.

  *Marcus pushes off the wall and walks toward the conference room. Elena stares at her cold coffee, then at the whiteboard behind her where someone has drawn a circle labeled "Truth" with several arrows missing it by varying degrees. She picks up a marker and draws a coordinate grid over the circle, then stops, cap still in hand.*
