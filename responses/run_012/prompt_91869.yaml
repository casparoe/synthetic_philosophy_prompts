  2.  **Character Conception:**
      *   *Realist:* Let's call her **Elena**. She's motivated by the intuition of progress. She needs to defend the *idea* of approximation despite the technical hurdles. She represents the Niiniluoto/Oddie lineage (likeness/ordering).
      *   *Deflationist:* Let's call him **Marcus**. He's skeptical of metaphysical commitments that don't cash out in practice. He represents the van Fraassen/empiricist skepticism or perhaps a Miller-style linguistic relativity critique.

  3.  **The Concrete Example:**
      *   Need a "Bold" vs. "Timid" case.
