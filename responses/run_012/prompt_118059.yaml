  *(Self-Correction during drafting)*: I need to be careful not to definitively say "Your friend is wrong." Instead, I must show *why* the analogy fails to prove his point, as requested ("careful audit"). I need to make sure I distinguish between Contextualism (DeRose) and Subject-Sensitive Invariantism/Encroachment (Stanley/Hawthorne), as the friend seems to conflate them or treat "pragmatic encroachment literature" as a monolith. The friend's analogy supports Contextualism, which *is* part of that literature, so his claim that the literature is chasing a shadow is self-undermining.

