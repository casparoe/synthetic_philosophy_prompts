      *   *Specifics:* Cite the commutativity theorem (Wagner 2002, etc.). Mention the "Input Problem" (Christensen, Jeffrey). Mention the circularity of Rigidity in DB arguments (Lewis).

  7.  **Refining the "Cheapest Fix" for Tension 1:**
      *   If I drop Path Independence (4), I save JC. Cost: Counter-intuitive that order matters.
      *   If I drop JC (1/5), I save Path Independence. Cost: Can't handle uncertain evidence well (or need a different rule like PL or something else).
