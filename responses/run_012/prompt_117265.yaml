      *   **Task:** Critique the credo *before* the seminar does (take shots at it).
      *   **Input:** 5 specific claims about updating (Jeffrey conditionalization, relation to standard conditionalization, justification via Dutch Book/Accuracy, Path Independence, Rigidity of conditionals).
