  Also, check Claim 3 again. "Violating it leaves you open to sure loss." Does violating JC *always* leave you open to sure loss? Only if Rigidity holds. If Rigidity is violated, DB doesn't necessarily apply. So 3 depends on 5, but 5 isn't justified by 3. That's the circularity.

