answer: |-
  # Session Plan: Uncertain Evidence and Jeffrey Conditionalization
  **Time:** 60 Minutes
  **Audience:** 2nd-Year Philosophy Graduate Students
  **Carrying Example:** **The Textured Fabric** (Perceptual experience of color and texture under varying conditions).

  ## I. Motivation: Certain vs. Uncertain Evidence (0:00–0:05)
  **Goal:** Distinguish standard conditioning from probability kinematics.
  1.  **Standard Conditioning:** Recall that Bayes' theorem requires the evidence $E$ to become certain ($P_{new}(E) = 1$).
  2.  **The Problem:** In perceptual experience (the foundation of empiricism), we rarely become *certain* of a proposition. We rarely learn "The cloth is green" with probability 1. We learn "It *looks* greenish," which shifts our credence in "The cloth is green" without maximizing it.
  3.  **The Gap:** Standard conditionalization cannot model this shift because it requires conditioning on a truth. We need a rule for updating when the input is a shift in probabilities across a partition, not a truth.
  4.  **Misconception Check (Softened Bayes):** Explicitly state: "This is not Bayes' theorem with a 'fuzzy' likelihood." Bayes calculates $P(H|E)$ given $P(E)=1$. Jeffrey Conditionalization (JC) calculates $P_{new}(H)$ given a vector of new probabilities for a partition $\{E_i\}$.

  ## II. The Rule and The Rigidity Condition (0:05–0:20)
  **Goal:** Introduce the formula and the necessary constraint for its validity.
  1.  **The Formula:** Present JC: $P_{new}(H) = \sum P_{old}(H | E_i) \cdot P_{new}(E_i)$.
  2.  **The Input:** Emphasize that the rule takes $P_{new}(E_i)$ as *input*. It does not calculate them.
  3.  **The Rigidity Condition (Crucial):** Explain that for the update to be rational, the conditional probabilities $P(H | E_i)$ must remain fixed. The observation changes the probability of the $E_i$'s, but it must not change the *relationship* between $H$ and the $E_i$'s.
      *   *Why:* If the observation changes how $H$ relates to $E_i$, you cannot use the old conditional probabilities to weight the new $E_i$ probabilities.
  4.  **Misconception Check (Any Probability Change):** Head off the idea that *any* shift in credence licenses JC.
      *   *Instruction:* "You cannot simply decide $P_{new}(H)$ has changed and use JC to back-calculate the partition. The input must be the probabilities of the partition cells themselves, derived from the experience."
  5.  **Misconception Check (Old Evidence):** Head off the idea that JC solves the problem of old evidence.
      *   *Instruction:* "JC requires new probabilities for the partition ($P_{new}(E_i)$). If the evidence is old, you have no justification for assigning new values to $P(E_i)$ distinct from the old ones, unless you re-experience it. JC moves the problem of old evidence back to the problem of justifying the input probabilities."

  ## III. The Carrying Example: Observation 1 (0:20–0:30)
  **Goal:** Apply JC to a specific case satisfying all constraints.
  **The Setup:**
  *   **Context:** You are handling a swatch of fabric in a dim room.
  *   **Partition $\mathcal{C}$ (Color):** {Green, Blue, Violet}. (3 cells, non-binary).
  *   **Prior:** $P(G)=0.3, P(B)=0.4, P(V)=0.3$.
  *   **Hypothesis $H$:** "The fabric is expensive." (Correlated with color).
  *   **Observation 1:** You look closely. The lighting is uncertain. You do not learn the color is Blue. You assign new probabilities based on the visual experience: $P_{new}(G)=0.1, P_{new}(B)=0.7, P_{new}(V)=0.2$.
  *   **Calculation:** Walk through the weighted sum using $P_{old}(H | C_i)$.
  *   **Constraint Check:** Note that we are not using likelihoods $P(Obs | Color)$. We are directly assigning $P_{new}(Color)$. This avoids the "determinate likelihood" trap.

  ## IV. Sequential Updating and Commutativity (0:30–0:50)
  **Goal:** Demonstrate non-commutativity and partition instability.
  1.  **Observation 2 (Cross-Cutting):** You now feel the fabric.
      *   **Partition $\mathcal{T}$ (Texture):** {Smooth, Rough}.
      *   **Connection:** Texture correlates with Color (e.g., Violet is usually Smooth, Green is Rough).
      *   **Observation:** Tactile experience shifts Texture probs: $P_{new}(Smooth)=0.8, P_{new}(Rough)=0.2$.
  2.  **Order Dependence:**
      *   **Path A:** Update on Color ($\mathcal{C}$) then Texture ($\mathcal{T}$).
      *   **Path B:** Update on Texture ($\mathcal{T}$) then Color ($\mathcal{C}$).
      *   **Result:** $P_{A}(H) \neq P_{B}(H)$.
      *   **Why:** JC updates preserve rigidity relative to the *current* partition. Updating on $\mathcal{C}$ changes the marginal probabilities of $\mathcal{T}$ (due to correlation). When you subsequently update on $\mathcal{T}$, you override that shift. Reversing the order overrides the shifts in the opposite sequence.
      *   **Misconception Check (Order Independence):** "Unlike standard conditioning on certain evidence (which commutes if the evidence is compatible), JC on different partitions does not commute. There is no unique 'posterior' after two uncertain observations."
  3.  **Partition Stability:**
      *   **What goes wrong:** If the second observation forces you to redefine the first partition (e.g., you realize "Blue" was actually a mix of "Green" and "Violet" under that light), the first update is invalidated.
      *   **Requirement:** The partition must be fixed in advance, and the second observation must respect the probabilistic structure established by the first. If the second observation implies the first partition was ill-formed, you cannot sequentially update; you must restart from the prior.

  ## V. Assessment and Wrap-Up (0:50–1:00)
  **Goal:** Verify understanding of Rigidity vs. Formula.

  **The Assessment Question:**
  > "Suppose you perform the first update on the Color partition. Immediately after, you realize that the dim light specifically distorts Blue to look Green, meaning your visual experience makes 'Green' more likely *only if* the fabric is actually Cheap (not Expensive). Does the Jeffrey update you just performed remain valid? Why or why not?"

  **Expected Answer:**
  *   **No.**
  *   **Reason:** This realization violates the **Rigidity Condition**. You have learned that the relationship between the Hypothesis (Expensive) and the Partition Cell (Green) has changed ($P_{new}(H | Green) \neq P_{old}(H | Green)$). JC requires $P_{old}(H | E_i)$ to remain constant during the update. If the observation changes the diagnostic value of the partition cells themselves, you cannot use the old conditional probabilities as weights.

  **Explicit Exclusions (What to Leave Out):**
  1.  **Derivation from Minimum Information/Entropy:** Do not derive JC from the principle of minimizing Kullback-Leibler divergence.
      *   *Why:* It distracts from the epistemic justification (Rigidity) and turns the session into a math lecture on optimization rather than epistemology.
  2.  **Field's Generalization or Probability of Conditionals:** Do not discuss extensions where the partition itself is uncertain or conditional propositions are the evidence.
      *   *Why:* This is a first exposure to kinematics. Introducing uncertainty about the partition itself confuses the primary lesson on partition stability and commutativity.
  3.  **The "Input Problem" Solutions:** Do not spend time on how to generate the $P_{new}(E_i)$ inputs (e.g., likelihood ratios).
      *   *Why:* The session is about the *update rule* given the inputs, not the psychology of generating the inputs. Focus on the kinematic constraint.
