          *   Obs 2 (Spectroscopy - Uncertain): The machine gives a fuzzy reading. Partition $\mathcal{W}$ (Wavelength Band): {Short, Long}. This cuts across Color (Green/Blue are Short, Violet is Long).
          *   This works for commutativity (Color then Wavelength vs Wavelength then Color).

  6.  **Developing the Assessment Question:**
      *   Needs to test Rigidity, not formula plugging.
      *   Rigidity means $P_{new}(H | E_i) = P_{old}(H | E_i)$.
      *   Question idea: Give a scenario where the agent learns something about the *relationship* between $H$ and $E$ during the observation. If that relationship changes, Rigidity is violated.
