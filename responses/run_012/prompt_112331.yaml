prompt: |-
  I am leading a sixty-minute session on uncertain evidence and Jeffrey conditionalization for second-year philosophy graduate students who are comfortable with Bayes theorem and conditional probability but have never seen probability kinematics. Do not explain the rule to me. Plan how I should teach it: the order in which the components must be introduced and why, beginning with the difference between learning that a proposition is true and receiving evidence that merely shifts probabilities across a partition, and ending with the fact that successive Jeffrey updates on different partitions need not commute and with what goes wrong when the partition is not fixed in advance or the second observation does not respect the first. Choose the single carrying example for the session and say what it must contain (a partition of at least three cells, a prior, an uncertain observation that assigns new probabilities to those cells, and a second uncertain observation that cuts across the first) and what it must avoid (a determinate likelihood, a known truth, a simple binary hypothesis, and the usual medical-test or urn cases). Identify the misconceptions the students will bring or form—for example, that Jeffrey conditionalization is just Bayes theorem with a softened likelihood, that any change in the probability of the evidence licenses it, that the update is order-independent, or that it dissolves the problem of old evidence—and say exactly where in the sequence to head off each. Include one question I can ask at the end to see whether they understand the rigidity condition rather than just the formula, and state what I should explicitly leave out at this level and why.
