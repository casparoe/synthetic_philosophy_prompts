answer: |-
  The phenomenon you have described is a well-documented problem in social choice theory and political philosophy. The established name for the core inconsistency is the **Discursive Dilemma**, historically rooted in what legal scholars call the **Doctrinal Paradox**.

  While these terms identify the inconsistency itself, your specific observations regarding the *order of decisions* and the *hidden nature* of the conflict correspond to specific mechanisms within **Judgment Aggregation Theory**. Below is an explanation of how the phenomenon is understood, how its features are categorized, and how it differs from related concepts.

  ### 1. The Core Phenomenon: The Discursive Dilemma

  The pattern you identified was formally introduced by legal scholars Lewis Kornhauser and Lawrence Sager in 1986 (as the Doctrinal Paradox) and later generalized by philosophers Christian List and Philip Pettit (as the Discursive Dilemma).

  **What it is understood to be:**
  It is a structural impossibility theorem regarding group rationality. It demonstrates that if a group wishes to satisfy three conditions simultaneously, they cannot do so:
  1.  **Universal Domain:** Accept any set of individual judgments.
  2.  **Systematicity/Independence:** Decide each proposition by a separate majority vote (without considering logical links during the vote).
  3.  **Collective Rationality:** Ensure the set of collective judgments is logically consistent.

  Your drug panel example is the canonical illustration. If the logic is $Safe \land Effective \to Approve$, and the individuals are:
  *   Member 1: Safe (Yes), Effective (Yes), Approve (Yes)
  *   Member 2: Safe (Yes), Effective (No), Approve (No)
  *   Member 3: Safe (No), Effective (Yes), Approve (No)

  The majority view on "Safe" is Yes. The majority view on "Effective" is Yes. The majority view on "Approve" is No. The collective view is $\{Yes, Yes, No\}$, which violates the logical constraint that Yes + Yes must equal Yes.

  Crucially, as you noted, **no individual is inconsistent.** The inconsistency is an emergent property of the aggregation method, not the inputs.

  ### 2. Addressing the Order Dependence

  You observed that the result depends on "which question is treated as the one to be settled last." In the literature, this is not treated as a separate phenomenon but as the **Procedural Resolution** of the dilemma. The inconsistency arises only if the group votes on every proposition independently. To avoid inconsistency, the group must choose a procedure that privileges certain propositions over others.

  There are two standard procedures, and the tension between them explains your observation about order:

  *   **The Premise-Based Procedure:** The group votes only on the foundational facts (Safety, Efficacy). The decision on the conclusion (Approval) is *derived* logically from the majority verdict on the premises. In your example, the drug would be approved. This prioritizes collective rationality over the direct majority will on the conclusion.
  *   **The Conclusion-Based Procedure:** The group votes only on the final outcome (Approval). The premises are discussed but not voted on as binding collective judgments. In your example, the drug would be rejected. This prioritizes the direct majority will on the outcome but leaves the collective stance on the premises undefined or inconsistent.

  **How this is understood:**
  Scholars refer to this as **Agenda Sensitivity** or **Path Dependence** in judgment aggregation. The "order" matters because the group must choose which propositions are "input" variables (subject to vote) and which are "output" variables (derived by logic). If you vote on all of them as independent inputs, you generate the paradox. If you sequence them so that the conclusion is calculated rather than voted on, you restore consistency but potentially override the majority's direct preference on the conclusion.

  ### 3. Addressing the "Hidden" Nature

  You noted that the trouble is "often hidden" because decisions are taken one at a time. This is a critical feature of the dilemma, often described as the **Latency of Collective Inconsistency**.

  **Why it stays out of sight:**
  This occurs due to **Proposition-wise Aggregation**. In standard voting, the "unit" of decision is the individual proposition. The voting mechanism does not check for logical coherence across propositions; it only checks for a majority on the specific question at hand. The inconsistency is **non-local**; it does not exist within any single vote. It only exists in the *conjunction* of the votes.

  Because legislative and judicial bodies typically organize their agendas by bill or by issue (compartmentalization), the logical links between Issue A and Issue B are often not subject to a vote. The inconsistency remains latent until an actor attempts to implement the combined decisions. There is no single common noun for this "hiddenness" other than describing it as a failure of **Global Consistency Checks**. However, in cognitive science and organizational theory, this is sometimes linked to **Siloed Decision-Making**, where the structural separation of tasks prevents the detection of systemic conflict.

  ### 4. Distinctions from Related Concepts

  It is vital to distinguish the Discursive Dilemma from three concepts with which it is often confused.

  **A. Condorcet's Paradox (Cyclical Majorities)**
  *   *The Confusion:* Both involve majority voting leading to irrational group outcomes.
  *   *The Difference:* Condorcet's Paradox deals with **preferences** (rankings), not **beliefs** (truth values). In Condorcet's Paradox, the group prefers A to B, B to C, and C to A. In the Discursive Dilemma, the group believes P is true, Q is true, and (P & Q) is false. The former is a cycle of desire; the latter is a contradiction of fact.

  **B. Logrolling (Vote Trading)**
  *   *The Confusion:* Both result in outcomes that might seem strange or suboptimal.
  *   *The Difference:* Logrolling is **strategic**. It requires members to insincerely vote against their preference on one issue to gain a benefit on another ("I'll vote for your dam if you vote for my highway"). The Discursive Dilemma occurs even when **everyone votes sincerely**. It is a mathematical inevitability of the aggregation rule, not a result of negotiation or deal-making.

  **C. Individual Inconsistency (Hypocrisy or Irrationality)**
  *   *The Confusion:* The group ends up holding contradictory views.
  *   *The Difference:* As you noted, the members are consistent. This distinguishes the phenomenon as a **Systemic Failure** rather than a **Psychological Failure**. If a single person held these views, we would call them irrational. When a group holds them via majority rule, we call it a Discursive Dilemma. This is philosophically significant because it suggests that "Group Agency" cannot be assumed to have the same rationality properties as "Individual Agency."

  ### 5. Summary and Terminology Recommendation

  You asked whether you are describing one recognized phenomenon or two, and whether a new term is needed.

  You are describing **one recognized phenomenon** (The Discursive Dilemma) with two specific **structural features** (Agenda Sensitivity and Proposition-wise Aggregation).

  *   **The Inconsistency:** This is the **Discursive Dilemma**.
  *   **The Order Dependence:** This is the choice between **Premise-Based** and **Conclusion-Based** procedures.
  *   **The Hidden Nature:** This is a consequence of **Proposition-wise Aggregation**.

  There is no need to propose a new term for the phenomenon itself, as "Discursive Dilemma" is the standard term in philosophy and economics. However, the specific *risk* you identified—where the inconsistency remains undetected until implementation—is not always emphasized in the formal logic literature, which focuses on the existence of the paradox rather than its detection.

  If you need a label for that specific risk in a practical or organizational context, I propose the term **Latent Aggregation Inconsistency**.

  **Definition:** *Latent Aggregation Inconsistency* occurs when a decision-making body uses proposition-wise voting on logically connected issues, resulting in a collectively inconsistent set of decisions that remains undetected until the decisions are jointly implemented, due to the lack of a global consistency check during the voting process.

  **Boundary Cases:**
  *   *Fits:* A city council votes "Yes" on building a park, "Yes" on raising taxes for maintenance, but "No" on the budget allocation that combines them. No one notices until the budget meeting.
  *   *Does Not Fit:* A council votes "Yes" on the park and "No" on the park. (This is a direct contradiction on a single issue, not an emergent inconsistency across issues).
  *   *Does Not Fit:* A council votes "Yes" on the park and "Yes" on a library, but later realizes they can't afford both. (This is a resource constraint/budgetary trade-off, not a logical contradiction in truth values).

  ### Conclusion

  The pattern you have noticed is the **Discursive Dilemma**. It is understood not merely as a voting error, but as a fundamental limit on how groups can form rational beliefs. The order-dependence you noticed is the central tension between preserving logical consistency (Premise-Based) and preserving majority will on the final outcome (Conclusion-Based). The hidden nature you observed is the result of **Proposition-wise Aggregation**, which isolates votes from their logical consequences. While the core paradox is well-named, the specific danger of it remaining undetected in bureaucratic processes is best described as **Latent Aggregation Inconsistency**.
