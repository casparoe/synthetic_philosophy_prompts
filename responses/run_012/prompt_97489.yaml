prompt: |-
  Hey, so I'm helping put together a small grant for conceptual AI alignment work — three years, four or five people, philosophy and theory only, nobody doing empirical ML. The area we've zeroed in on is approval-directed agents versus goal-directed agents (Christiano-style approval maximizers vs. the usual RL-style objective maximizers), and I've been asked to say which open questions in that space are actually worth the money, and in what order.

  I definately don't want a survey though. I want a defended agenda: for each question, why it's upstream of the others, whether it's the kind of thing a philosopher can make real progress on without a lab, and what would move it up or down the list over the next couple of years.

  A few things I keep bumping into that I'd like you to treat as live candidate cruxes rather than skipping past:

  1) The approver is itself an agent with an alignment problem. So is 'approval-directed' actually relocating the hard part rather than dissolving it, and if so does that make the whole frame less interesting than it looks?

  2) Whether the target should be the approver's approval of the act, of the disposition that produced the act, or of the act under some counterfactual where the approver is smarter / can see the whole training history. These seem to come apart, and I'm not sure anyone has sorted out which one the safety story actually needs.

  3) Approval as an ordinal better/worse signal vs. approval as a scalar you maximize. Does the good behaviour survive the moment you turn it into something to be optimized, or does the ordinal/scalar gap eat the proposal?

  Rank the candidates, tell me which are genuinely load-bearing and which just sound deep, and be honest about which ones we probably can't even state precisely enough to work on yet.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**
      *   **Goal:** Create a defended research agenda for a small grant (3 years, 4-5 people, philosophy/theory only, no empirical ML).
      *   **Topic:** AI Alignment, specifically Approval-Directed Agents (ADA) vs. Goal-Directed Agents (GDA). Focus on Paul Christiano-style approval maximizers.
      *   **Constraints:** No survey. Must be a *defended agenda*. For each question: explain why it's upstream, feasibility for philosophers without a lab, and conditions for reprioritization.
      *   **Specific Cruxes to Address:**
          1.  *The Regress Problem:* The approver is an agent with its own alignment problem. Is ADA just moving the buck?
          2.  *The Target of Approval:* Act vs. Disposition vs. Counterfactual/Smart Approver.
          3.  *The Optimization Pressure:* Ordinal vs. Scalar approval. Does Goodharting kill the proposal?
      *   **Tone:** Honest, critical, prioritizing load-bearing questions over "sounding deep." Acknowledge where precision is lacking.

  2.  **Initial Assessment of the Field (Approval-Directed Agents):**
      *   *Context:* This is a niche within alignment theory. It was hotter ~2015-2020 (Christiano, Armstrong, etc.). It has cooled slightly as focus shifted to LLM alignment (RLHF) and instrumental convergence.
      *   *Viability for Philosophy:* High. This is conceptual, normative, and game-theoretic. It doesn't require GPU clusters. It requires clarity on decision theory, ethics, and epistemology.
      *   *The "Move the Buck" Critique:* This is the strongest objection. If the approver needs to be aligned, why is approving easier than specifying a goal? The answer usually lies in *human-in-the-loop* vs. *automated* approval, or *scalable oversight*.
      *   *The Optimization Critique:* Goodhart's Law is the enemy. If you maximize approval, you get adversarial examples of approval.
      *   *The Target Critique:* What are we actually reinforcing? Intentions? Outcomes? This touches on moral luck and moral worth.

  3.  **Drafting the Agenda - Step-by-Step:**

      *   **Priority 1: The Regress/Bootstrap Problem (Crux 1).**
          *   *Why First?* If ADA just pushes the alignment problem onto the approver without reducing difficulty, the whole paradigm is dead on arrival. This is the "existence proof" question.
          *   *Philosophical Angle:* Epistemology of oversight. Can a weaker agent verify a stronger agent's *process* without verifying the *outcome*? (Analogy: Checking a math proof vs. checking the answer).
          *   *Feasibility:* High. Conceptual analysis, formal models of oversight.
          *   *Reprioritization:* If empirical work shows human approvers break down immediately at scale, this becomes less urgent (because the paradigm is dead). If scalable oversight looks promising, this becomes critical.

      *   **Priority 2: The Optimization Target (Crux 3).**
          *   *Why Second?* Even if the approver is safe, *how* the agent uses approval matters. Maximizing a scalar proxy is dangerous. Ordinal ranking might be safer.
          *   *Philosophical Angle:* Decision theory, Goodhart's Law, measurement theory. Is there a "satisficing" or "quantilizer" approach that fits approval?
          *   *Feasibility:* Medium-High. Formal decision theory work.
          *   *Reprioritization:* If RLHF empirically shows scalar rewards work fine with regularization, this drops. If reward hacking is catastrophic in sims, this rises.

      *   **Priority 3: The Object of Approval (Crux 2).**
          *   *Why Third?* Once we know *who* approves and *how* it's optimized, we need to know *what* is being judged. Act vs. Disposition.
          *   *Philosophical Angle:* Normative ethics (consequentialism vs. deontology vs. virtue ethics). Moral luck.
          *   *Feasibility:* High. Pure philosophy.
          *   *Reprioritization:* If the optimization method (Priority 2) forces a specific target (e.g., only outcomes are observable), this gets constrained.

      *   **Priority 4: The "Precise Statement" Check.**
          *   Need to acknowledge that "Approval" is ill-defined. Is it expected utility? Emotional sentiment? Reflective equilibrium?
          *   *Action:* Make this a cross-cutting constraint, not a separate item. Or make it the foundation. Let's make it the foundation of Priority 1.

  4.  **Refining the Arguments (Self-Correction/Critique):**
      *   *Critique:* Isn't RLHF basically approval direction?
      *   *Response:* Yes, but RLHF is usually treated as learning a reward function (goal-directed). True ADA keeps the human in the loop or uses a specific oversight mechanism that isn't just "distill human preference into a static function." The grant is for *conceptual* work, so distinguishing the *mechanism* of approval from *reward modeling* is key.
      *   *Critique:* Is this too abstract?
      *   *Response:* The prompt asks for philosophy/theory only. I need to ensure the output isn't just "think hard about ethics" but "develop formal criteria for safe oversight."
      *   *Critique:* What about the "Move the Buck" crux?
      *   *Response:* I need to be honest. If the answer is "Yes, it moves the buck," is that fatal? Not necessarily, if the buck is moved to a *easier* problem (e.g., verifying vs. generating). I need to frame the research question around *asymmetry of difficulty*.

  5.  **Finalizing the Structure:**
      *   **Executive Summary:** The core thesis (ADA is only viable if oversight is easier than generation).
      *   **Research Track 1 (The Foundation):** The Asymmetry of Oversight (Addressing Crux 1).
      *   **Research Track 2 (The Mechanism):** Optimization Pressure & Goodhart (Addressing Crux 3).
      *   **Research Track 3 (The Normative Object):** Acts, Dispositions, and Counterfactuals (Addressing Crux 2).
      *   **The "Too Vague" Pile:** Questions to avoid.
      *   **Reprioritization Triggers:** What changes the plan.

  6.  **Drafting the Content (incorporating the "Defended" aspect):**
      *   *Track 1:* Focus on "Verification vs. Generation." This is the only way to solve Crux 1. If verification isn't computationally/epistemically cheaper, ADA fails.
      *   *Track 2:* Focus on "Satisficing vs. Maximizing." Christiano's later work touches on this. If we maximize approval, we get wireheading. If we satisfice, do we lose competitiveness?
      *   *Track 3:* Focus on "Moral Worth in AI." If the AI tricks the approver but the outcome is good, is it aligned? This matters for deceptive alignment.

  7.  **Review against Constraints:**
      *   3 years, 4-5 people? Yes, the scope fits.
      *   Philosophy/Theory only? Yes, no ML experiments required.
      *   Addressed the 3 cruxes? Yes, integrated into the tracks.
      *   Honest about precision? Yes, included a section on ill-defined concepts.

  8.  **Final Polish:** Ensure tone is rigorous, slightly skeptical (as requested: "honest about which ones we probably can't even state precisely"), and actionable for a grant proposal. (Self-correction: Make sure to explicitly rank them 1, 2, 3).

  *(Self-Correction during drafting)*: I initially thought about putting the "Object of Approval" first. But if the Approver is unaligned (Crux 1), it doesn't matter what they approve. So Crux 1 is definitely upstream. Crux 3 (Optimization) is next because even a good approver kills you if you maximize their signal incorrectly. Crux 2 is downstream of that.

