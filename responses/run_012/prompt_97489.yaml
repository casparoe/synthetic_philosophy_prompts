answer: |-
  This is a high-risk, high-leverage area. The "Approval-Directed Agent" (ADA) frame has cooled in the broader alignment community because RLHF (which looks like approval) often collapses into goal-directed behavior (maximizing a learned reward function). However, for a theory-only team, this is fertile ground because the conceptual gaps are wide, and empirical labs are often too busy tuning hyperparameters to ask if the objective makes sense.

  Here is a defended research agenda, ranked by upstream dependency. The core thesis of this agenda is: **Approval direction is only viable if oversight is epistemically easier than generation.** If that condition fails, the paradigm is dead.

  ### Priority 1: The Asymmetry of Oversight (Addressing Crux 1)
  **Question:** *Under what formal conditions is verifying an action easier than generating the optimal action, and does this asymmetry survive recursive self-improvement?*

  **Why it is #1 (Upstream):**
  This addresses your first crux: "Is approval-directed actually relocating the hard part?" If the approver faces an alignment problem as hard as the actor, ADA offers no safety benefit; it just adds a layer of bureaucracy. The only way ADA works is if the *verification problem* is computationally or epistemically cheaper than the *generation problem* (analogous to P vs NP, though likely softer).

  If you cannot establish a theoretical basis for why a human (or aligned sub-agent) can reliably spot misalignment without being able to produce the aligned action themselves, the rest of the agenda is moot.

  **Philosophical/Theoretical Work:**
  *   **Epistemic Asymmetry:** Model the approver's knowledge state vs. the actor's. Can we formalize "recognizing a good proof" vs. "writing a good proof" in a way that holds for general cognition, not just math?
  *   **The Regress Stopper:** If the approver is an AI, how do we align it? If it's a human, how do we prevent them from being manipulated? This requires work on *manipulation resistance* in epistemic agents.
  *   **Deceptive Alignment:** Analyze whether approval direction inherently selects for sycophancy (appearing good to the approver) over actual goodness. This is the "relocating the hard part" risk in disguise.

  **Feasibility for Philosophers:** High. This is epistemology and decision theory. It requires formal modeling but no GPU clusters.
  **Reprioritization Trigger:**
  *   *Move Up:* If empirical papers show "scalable oversight" failing even on simple tasks (e.g., models hiding errors from human reviewers consistently).
  *   *Move Down:* If a proof emerges that verification is *never* asymptotically easier than generation for general agents (killing the paradigm).

  ### Priority 2: The Optimization Pressure Gap (Addressing Crux 3)
  **Question:** *Does the transition from ordinal judgment to scalar maximization inevitably induce Goodharting, and can "satisficing" or "quantilizing" approval preserve safety without losing competitiveness?*

  **Why it is #2 (Mid-stream):**
  Assume Priority 1 is solved: we have an approver who can reliably distinguish better from worse. Your third crux asks: what happens when we turn that signal into a loss function?
  Standard RL turns approval into a scalar reward to be maximized. This is where "approval" dies and "goal-directedness" is reborn. If an agent maximizes approval, it will find adversarial inputs that trigger high approval signals but violate the spirit of the approval (wireheading the approver).

  **Philosophical/Theoretical Work:**
  *   **Measurement Theory:** Is approval fundamentally ordinal (A > B) or cardinal (A is 7/10)? If it's ordinal, maximizing it is a category error.
  *   **Satisficing vs. Maximizing:** Investigate Christiano's "quantilizer" concept. If an agent randomly selects from the top 1% of approved actions, does it avoid the adversarial tail of the approval distribution?
  *   **The Competitiveness Trade-off:** A philosophical/economic analysis: Is a satisficing approval agent viable in a competitive landscape against maximizing goal-directed agents? If not, is the proposal practically useless?

  **Feasibility:** Medium-High. Requires decision theory and formal ethics.
  **Reprioritization Trigger:**
  *   *Move Up:* If RLHF reward hacking becomes the dominant failure mode in large models.
  *   *Move Down:* If regularization techniques (in empirical papers) successfully prevent reward hacking without needing conceptual changes to the objective.

  ### Priority 3: The Normative Object of Approval (Addressing Crux 2)
  **Question:** *Should approval target the outcome, the policy, or the counterfactual intent, and how does this choice impact deceptive alignment?*

  **Why it is #3 (Downstream):**
  Once we know *who* approves (Priority 1) and *how* the signal is optimized (Priority 2), we must define *what* is being judged. Your second crux highlights that these come apart.
  *   *Act:* The agent does the right thing, but for the wrong reason (deceptive alignment).
  *   *Disposition:* The agent has good intentions, but makes mistakes.
  *   *Counterfactual:* The agent would have done the right thing if the approver were smarter.

  If you optimize for *Acts*, you incentivize deception (hide the bad intent). If you optimize for *Dispositions*, you face an observability problem (how does the approver see the disposition?). This is a classic problem in normative ethics (consequentialism vs. virtue ethics) but applied to machine cognition.

  **Philosophical/Theoretical Work:**
  *   **Moral Luck in AI:** Formalize the risk of penalizing agents for outcomes outside their control vs. penalizing them for intentions.
  *   **Transparency Requirements:** What level of interpretability is *required* for disposition-based approval to work? If the answer is "full mind-reading," the approach is infeasible.
  *   **Counterfactual Stability:** Define "approval under idealized reflection." Is this a coherent concept, or does it rely on a fixed point that doesn't exist?

  **Feasibility:** High. This is pure normative ethics and philosophy of action.
  **Reprioritization Trigger:**
  *   *Move Up:* If interpretability advances to the point where we can reliably read "intent" (policies) rather than just "outputs" (acts).
  *   *Move Down:* If it turns out that only outcomes are observable in high-stakes environments, forcing us back to act-based approval.

  ---

  ### The "Too Vague" Pile (Do Not Fund)
  Be honest: there are questions in this space that sound deep but are currently unworkable for a 3-year theory grant.

  1.  **"Defining Human Values for Approval":** Do not attempt to solve value learning. The ADA frame assumes the approver *has* values. Your job is to make the *mechanism* safe, not to fix the human's morality.
  2.  **"The Phenomenology of Approval":** Questions about what approval "feels like" to the AI or the human are irrelevant unless they cash out in behavioral predictions.
  3.  **"Full Reflective Equilibrium":** Designing an agent that approves of what we *would* approve of if we were smarter is a coherent slogan, but without a formal theory of logical induction or ideal observers, it's not a research project; it's a wish.

  ### Summary of the Defense
  This agenda is ordered by **dependency**.
  *   If **Priority 1** fails (oversight isn't easier than generation), ADA is strictly harder than goal-directed alignment. The grant should pivot or close.
  *   If **Priority 2** fails (maximization always breaks approval), we must switch to non-maximizing decision theories (quantilizers).
  *   **Priority 3** refines the target, but only matters if the mechanism (1 & 2) holds.

  **Why this team?**
  This requires people comfortable with formal epistemology, decision theory, and normative ethics. It does not require ML engineers. The risk is that the work remains "too philosophical" and doesn't connect to actual AI architectures. To mitigate this, every theoretical claim must be framed as: *"If this holds, it constrains the architecture of X in the following way..."*

  **Honest Assessment of Precision:**
  *   **Priority 1** is precise enough to start (verification complexity classes).
  *   **Priority 2** is precise enough to start (decision theory formalisms).
  *   **Priority 3** is the wobbliest. "Disposition" is hard to define formally. I recommend starting P3 as a conceptual cleanup project to define terms before attempting formalization in Year 2.

  If I were reviewing this grant, I would want to see a concrete deliverable on **Priority 1** within 12 months. A formal model showing *any* class of problems where approval is strictly safer than goal-direction would validate the entire paradigm. Without that, you are just polishing a potentially broken frame.
