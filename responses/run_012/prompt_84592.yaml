answer: |-
  This is the right move. Most debates on the Lottery and Preface paradoxes stall because participants are optimizing for different hidden variables (e.g., preserving logic vs. preserving fallibilism). Below is a functional specification for a theory of **Rational Outright Belief**.

  This spec is designed to be theory-neutral. It does not assume the Lockean Thesis (that high credence suffices for belief) nor does it assume Infallibilism. It lists the deliverables a theory must produce to count as a solution, rather than a dissolution, of the problem.

  ---

  # Specification: Rational Outright Belief (v1.0)

  ## 1. Functional Role Requirements
  *Before defining when belief is rational, the theory must define what belief **does**. If you change the conditions for belief, you must ensure it can still do these jobs.*

  ### 1.1 The Reasoning Premise Requirement
  **Requirement:** Outright beliefs must be fit to serve as premises in practical and theoretical reasoning without further qualification.
  **Justification:** If I believe $P$, I should be able to reason "If $P$, then $Q$; therefore $Q$" without needing to check my credence level or the stakes.
  **Cost of Violation:** If belief cannot serve as a premise, it collapses into *credence* (which requires weighting) or *acceptance* (which is context-bound).
  **Constraint:** The theory must explain how an agent reasons from a set of beliefs that the theory itself admits might contain a falsehood (in the Preface case).

  ### 1.2 The Assertion Warrant Requirement
  **Requirement:** Rational outright belief must be the primary norm governing flat-out assertion.
  **Justification:** We assert what we believe. If the theory says it is rational to believe $P$ but irrational to assert $P$ (or vice versa), it has created a distinction without a functional difference.
  **Cost of Violation:** If belief diverges from assertion norms, we need a new word for the thing that governs assertion.
  **Constraint:** This requirement puts pressure on **Stakes (Wrinkle 2)**. If belief shifts with stakes, does assertion shift too? If I believe the drug is safe (low stakes) but you don't (high stakes), can I tell you it's safe?

  ### 1.3 The Distinction Preservation Requirement
  **Requirement:** The account must maintain non-collapsed distinctions between:
  1.  **Belief vs. Credence:** Belief is binary; credence is graded.
  2.  **Belief vs. Acceptance:** Belief is involuntary/truth-aimed; acceptance is voluntary/utility-aimed (e.g., a lawyer accepting a client's innocence).
  3.  **Belief vs. High Probability:** A proposition can be probable without being believed.
  **Justification:** If these collapse, the paradoxes vanish trivially (e.g., "Belief just *is* high credence" solves Lottery but eliminates outright belief).
  **Constraint:** You cannot solve the paradox by saying "We don't have beliefs, only credences." The spec is for *outright belief*.

  ---

  ## 2. Normative Constraints
  *These are the logical and evidential rules the belief set must obey.*

  ### 2.1 The Consistency Norm (Default)
  **Requirement:** It is prima facie irrational to hold explicitly contradictory beliefs ($B(P)$ and $B(\neg P)$).
  **Justification:** Contradiction entails explosion in classical logic; a belief system that explodes cannot guide action.
  **Is it Non-Negotiable?** **No.** This is the most common casualty.
  **Cost of Dropping:** You must provide a paraconsistent logic of belief or argue that rationality permits "local" inconsistency (e.g., Preface) so long as it isn't "active."
  **Consideration:** In the Preface, the author believes $p_1, \dots, p_n$ and believes $\neg(p_1 \land \dots \land p_n)$. This is logically inconsistent. A theory must either say this is rational (dropping Consistency) or say one of those beliefs is irrational (dropping Fallibilism or the Evidence Link).

  ### 2.2 The Agglomeration/Closure Norm
  **Requirement:** If it is rational to believe $P$ and rational to believe $Q$, it is rational to believe $(P \land Q)$.
  **Justification:** Beliefs are stored for future combination. If I believe "It will rain" and "I will go out," I must be able to form the belief "It will rain and I will go out" to plan for getting wet.
  **Is it Non-Negotiable?** **No.** This is the second most common casualty.
  **Cost of Dropping:** Reasoning becomes fragmented. You cannot conjoin premises. This makes complex planning impossible.
  **Consideration:** In the Lottery, if you believe of every ticket $t$ that " $t$ will lose," agglomeration forces you to believe "All tickets will lose," which contradicts "One ticket will win."

  ### 2.3 The Fallibilist Evidence Link
  **Requirement:** It must be possible to rationally believe a proposition that is not entailed by the evidence (i.e., probability $< 1$).
  **Justification:** If belief requires probability 1, we believe almost nothing (skepticism).
  **Cost of Dropping:** We lose ordinary knowledge claims ("I believe I had coffee").
  **Consideration:** This requirement forces the theory to set a threshold $t < 1$. The paradoxes arise when we ask what happens when many propositions meet $t$ but their conjunction does not.

  ---

  ## 3. The Wrinkle Constraints
  *These address the specific asymmetries and pragmatic pressures you raised.*

  ### 3.1 The Asymmetry Requirement (Wrinkle 1)
  **Requirement:** The theory must explain the intuitive divergence between the **Lottery Case**, the **Independent Weather Case**, and the **Preface Case**, specifically regarding the "Exactly One Wrong" variation.
  **The Data to Fit:**
  *   **Lottery:** Intuitively, I should *not* believe of any specific ticket it will lose.
  *   **Independent Weather:** Intuitively, I *should* believe it will rain in all 100 cities (even if likely one is wrong).
  *   **"Exactly One Wrong" Forecaster:** Intuitively, this reverts to Lottery intuition (I shouldn't believe the conjunction).
  **Justification:** If the theory treats these identically, it violates strong pre-theoretical intuitions about statistical vs. causal/normic evidence.
  **The Specific Test:** The theory must identify the **trigger feature**. Is it:
  *   *Known Partition?* (Knowing $\neg \bigwedge P_i$ is true a priori).
  *   *Statistical vs. Normic Support?* (Evidence that rules out error vs. evidence that makes error unlikely).
  *   *Salience of Error?* (Knowing *exactly* one is wrong makes the error salient).
  **Constraint:** A theory that says "Belief is just $P > 0.99$" fails this spec because it treats Independent Weather and Lottery identically. A theory that says "Never believe lottery propositions" fails because it is ad hoc. The theory must derive the verdict from a general principle about evidence structure.

  ### 3.2 The Stakes Stability Requirement (Wrinkle 2)
  **Requirement:** If the theory allows practical stakes to alter whether a belief is rational (Pragmatic Encroachment), it must explain the **Inter-Subjective Stability** of belief.
  **The Data to Fit:** In the Medical Protocol case, stakes vary the rationality of belief.
  **Justification:** If belief is a "map of the world," stakes shouldn't change the map. If belief is a "guide to action," stakes should change the map.
  **The Specific Test:**
  *   If I (low stakes) believe the drug is safe, and You (high stakes) do not, can I assert to you "It is safe"?
  *   If the theory says "Yes," it violates the Assertion Warrant (1.2).
  *   If the theory says "No," it implies belief is not purely cognitive.
  **Constraint:** The theory must state explicitly: **Is Belief a Cognitive State (truth-aimed) or a Practical State (action-aimed)?**
  *   If Cognitive: Stakes cannot shift belief thresholds. (Must solve Lottery/Preface via evidence structure).
  *   If Practical: Stakes shift thresholds. (Must explain how we communicate beliefs across stake-contexts).

  ---

  ## 4. The Incompatibility Matrix
  *You asked which subset of requirements cannot be satisfied together. Here is the logical landscape.*

  You cannot simultaneously hold all of the following five claims. At least one must be modified or rejected.

  1.  **Fallibilism:** Rational belief does not require probability 1.
  2.  **Lockean Sufficiency:** If $P$ is sufficiently probable (given evidence), it is rational to believe $P$.
  3.  **Agglomeration:** If $B(P)$ and $B(Q)$ are rational, $B(P \land Q)$ is rational.
  4.  **Consistency:** It is never rational to hold contradictory beliefs.
  5.  **Lottery Intuition:** It is not rational to believe of a specific lottery ticket that it will lose.

  **The Trade-Offs:**

  | Choice | What Goes? | The Cost |
  | :--- | :--- | :--- |
  | **The Skeptic** | Drop **Fallibilism**. | We believe almost nothing. Solves paradoxes but makes belief useless. |
  | **The Agglomerator** | Drop **Lottery Intuition**. | You admit it is rational to believe your ticket will lose. (Many find this intolerable). |
  | **The Paraconsistent** | Drop **Consistency**. | You admit the Preface author is rational to hold contradictory beliefs. Logic becomes non-classical. |
  | **The Fragmentalist** | Drop **Agglomeration**. | You can believe $P$ and $Q$ but not $P \land Q$. Reasoning is blocked. |
  | **The Non-Lockean** | Drop **Lockean Sufficiency**. | **This is the most popular move.** High probability is *necessary* but not *sufficient*. You need something else (Safety, Normic Support, Knowledge). |

  ---

  ## 5. The Bottleneck Requirement
  *Which single requirement does the most work in ruling out standard fixes?*

  **The Bottleneck is: Lockean Sufficiency (combined with Agglomeration).**

  Most "easy" solutions fail here.
  *   If you say "Belief is just high credence," you violate **Consistency** (via Agglomeration).
  *   If you say "Just don't believe lotteries," you violate **Lockean Sufficiency** without explaining *why* (Ad Hoc).
  *   If you say "Beliefs don't agglomerate," you violate **Reasoning Premise (1.1)**.

  **Why this is the bottleneck:**
  To solve the paradoxes without making belief useless (Skepticism) or irrational (Inconsistency), you must deny that **Probability alone suffices for Belief**.
  This forces the theory to posit a **second condition** on belief.
  *   *Example:* "Belief requires High Probability + Normic Support" (Smith).
  *   *Example:* "Belief requires High Probability + Safety" (Williamson).
  *   *Example:* "Belief requires High Probability + No Defeaters" (Defeasibility).

  **The Spec's Demand:**
  Your reading group must not accept any solution that does not explicitly state what this **Second Condition** is. If a paper says "We should believe the weather claims but not the lottery claims," demand they tell you the *rule* that distinguishes them that isn't just "Because one is a lottery."

  ---

  ## 6. Summary Checklist for Your Group
  *When evaluating a paper/solution, run it through this gauntlet:*

  1.  **Does it preserve Outright Belief?** (Or does it reduce belief to credence/acceptance?)
  2.  **Does it explain the Asymmetry?** (Why is Independent Weather different from "Exactly One Wrong" Forecaster?)
      *   *Look for:* Appeals to *knowledge of the partition* vs. *mere probabilistic likelihood*.
  3.  **Does it handle Stakes?** (If stakes move the threshold, how do we communicate?)
  4.  **Which Norm did it sacrifice?** (Consistency, Closure, or Sufficiency?)
  5.  **Is the sacrifice justified functionally?** (e.g., "We sacrifice Closure to save Consistency because reasoning from contradictions is worse than reasoning in fragments.")

  **Final Note on the "Exactly One Wrong" Variation:**
  This is the sharpest tool in your kit.
  *   **Independent Weather:** $P(\text{All True}) \approx 0.36$. Error is *possible* but not *guaranteed*.
  *   **Forecaster (1 wrong):** $P(\text{All True}) = 0$. Error is *guaranteed*.
  *   **Lottery:** $P(\text{All Lose}) = 0$. Error is *guaranteed*.
  *   **The Spec Demand:** A theory must explain why the **guarantee of error** (known via partition) blocks belief, while the **high probability of error** (via independence) does not. If the theory treats "Guaranteed Error" and "99% Likely Error" the same, it fails the Asymmetry Requirement. If it treats them differently, it must explain why *logical certainty of falsehood* blocks belief aggregation when *probabilistic likelihood of falsehood* does not. This usually points to **Closure** being sensitive to *known inconsistency* but not *probable inconsistency*.
