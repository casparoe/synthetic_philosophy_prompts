answer: |-
  A Renaissance humanist tells a fourteenth-century scholar, "I'm filing your kinematics under the Middle Ages." "But they're identical to yours," the scholar protests. "Precisely," says the humanist. "If I admit you were already in the light, then I'm not the one who ended the darkness—I just need a shadow to make my candle look like the sun."

  The joke presupposes that the Renaissance defined itself rhetorically by constructing the preceding era as a "Dark Age" requiring rebirth. It depends on the continuity thesis, specifically that fourteenth-century scholastic kinematics substantively anticipate seventeenth-century natural philosophy. It treats the period boundary not as an empirical discovery but as a normative claim to epistemic authority. Thus, the "Middle Ages" function as a necessary shadow to legitimize the Scientific Revolution's claim to have brought the light.
