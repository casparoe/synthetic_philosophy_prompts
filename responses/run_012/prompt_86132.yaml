answer: |-
  This translation is not a category error, but it exposes that the statistical wars are largely pragmatic disputes masquerading as semantic ones, where the replication crisis stems from users treating procedural guarantees as assertoric content.

  Here is the translation of the statistical landscape into your interface vocabulary.

  **The Translation**

  **Frequentism as Semantic Minimalism**
  The frequentist statement "p < 0.05" has a narrow truth-conditional content: it asserts that, assuming the null hypothesis is true, the probability of observing data this extreme is less than 5%. The truth conditions rely entirely on the behavior of the *procedure* across counterfactual repetitions, not the specific token instance. However, in practice, this utterance carries a powerful conventional implicature: "The null hypothesis is false" or "The alternative hypothesis is likely true." The frequentist framework semantically underdetermines the claim scientists want to make; the pragmatic enrichment required to get from "data is rare under null" to "theory is supported" is where the error enters. The 95% Confidence Interval operates similarly: its semantic content is about the long-run coverage rate of the method (a property of the algorithm), but it is pragmatically processed as a credence interval (a property of the parameter).

  **Bayesianism as Context-Sensitive Enrichment**
  Bayesian claims look more like standard assertions about the world: "There is a 95% probability the parameter lies in this interval." The truth conditions match the speaker's intended content. However, this comes with heavy presuppositional load: the prior distribution. In your terms, the semantic content of a Bayesian result is radically context-sensitive; the truth conditions shift depending on the presupposed prior. Two Bayesians can utter the same sentence with different truth conditions if their presupposed priors differ. The "fight" here is whether this context-sensitivity is a feature (honest acknowledgment of background beliefs) or a bug (lack of objective semantic stability).

  **P-Hacking as Pragmatic Manipulation**
  P-hacking is not semantic ambiguity; it is pragmatic exploitation. It involves manipulating the context of discovery (sample size, variable selection) to force the utterance conditions for "p < 0.05" to be met, thereby generating the implicature of significance without the procedural warrant required to sustain it. It is a violation of the norms of assertion: the speaker presents the result as a warranted assertion when the procedural preconditions for that warrant have been compromised.

  **The Residue Report**

  **What Comes Through Intact**
  The distinction between *what is said* (the mathematical property of the test) and *what is conveyed* (the belief in the theory) maps cleanly onto the semantics/pragmatics divide. The frequentist complaint that Bayesians are "too subjective" maps to a complaint about excessive context-sensitivity undermining stable truth conditions. The Bayesian complaint that frequentists are "irrelevant" maps to a complaint that semantic content which cannot support the intended assertion is useless.

  **What Requires Fudging**
  You must fudge the notion of "truth conditions." In semantics, a proposition is typically true or false. In statistics, the "truth" is probabilistic and asymptotic. A frequentist claim isn't "false" if the null is actually true; it's just a rare occurrence. Equating probabilistic coverage with truth-conditional satisfaction requires treating probabilities as modal operators, which works but stretches the standard binary truth-conditional framework. Additionally, treating priors as "presuppositions" is imperfect; presuppositions usually fail if false, whereas "wrong" priors just yield posterior probabilities that are conditional on those wrong priors—the sentence remains "true" relative to the model, even if the model is garbage.

  **What Has No Counterpart**
  Mathematical necessity versus linguistic convention. In your field, meaning is largely constituted by use and convention. In statistics, the relationship between a p-value and a false-positive rate is mathematically derived, not conventionally agreed upon. You cannot "pragmatically enrich" a p-value into a posterior probability without violating mathematical laws, whereas you can pragmatically enrich "It's cold in here" into "Close the window" without violating logic. The statistical constraints are hard limits, not conversational norms.

  **The Diagnosis: Semantics, Pragmatics, or False Dichotomy?**

  The replication crisis is a pragmatic failure enabled by semantic obscurity. It is not a false dichotomy to ask whether it is semantic or pragmatic, but it is a mistake to think the solution lies in picking one.

  The *semantic* problem is that frequentist terminology is counter-intuitive and often misleadingly named ("confidence," "significance"). The literal meaning does not support the scientific usage. The *pragmatic* problem is that researchers assert hypotheses as true based on evidence that only warrants rejecting a null procedure. They are violating Gricean maxims of quality and quantity by presenting procedural properties as evidential weight.

  If you fix the semantics (e.g., ban the word "significant," force Bayesian reporting), you reduce the ambiguity. If you fix the pragmatics (e.g., enforce norms against p-hacking, require preregistration), you stop the exploitation. You need both. However, framing it purely as pragmatics risks letting the semantic obscurity off the hook; framing it purely as semantics risks ignoring the incentive structures that drive the pragmatic abuse.

  **The Warning**

  Do not assume you can solve their problems with your machinery. Your framework assumes that meaning is negotiable through convention and context. Statistical meaning is constrained by mathematical theorem. You can clarify how scientists *use* these terms, but you cannot pragmatic-enrich a frequentist confidence interval into a Bayesian credible interval without committing a mathematical error, not just a linguistic infelicity. If you treat the statistical norms as merely linguistic conventions, you will smuggle in the assumption that the math is up for debate, and the stats people will be right to reject your analysis. Your vocabulary explains the *communication* failure, but it cannot fix the *inference* failure.
