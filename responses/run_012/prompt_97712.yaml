answer: |-
  The paper sinks if the Strawsonian expert demonstrates that your account of standing is merely epiphenomenal to prior judgements of blameworthiness, leaving you with no independent work for the concept to do.

  **1. The Strawsonian Reduction (The Most Dangerous Person)**
  *The Objection:* 'You are treating standing as a freestanding normative fact, but on any plausible Strawsonian account, the standing to blame is constitutively tied to the agent's own moral status regarding the act. If the act was all-things-considered right, you retain standing; if it was wrong, you lose it. Your "middle ground" of "right reason, wrong act" collapses because there is no such thing as a wrong act that is all-things-considered right. You have not found a new category; you have just renamed moral residue.'
  *The Reply:* 'The mistake here is conflating moral justification with political authority. A politician may be morally justified in breaking a rule to save lives, yet that act violates the public trust inherent in their office. Standing is not about whether they are blameworthy *simpliciter*, but whether they retain the authority to enforce the rule they just broke. The "residue" isn't a feeling; it's a loss of jurisdiction over that specific norm.'
  *The Soft Spot:* This relies entirely on a contested split between general morality and the specific morality of office. If the expert argues that political office cannot generate duties that contradict general morality, your distinction evaporates.

  **2. The Consequentialist Reduction (The Majority)**
  *The Objection:* 'This looks like rule-consequentialism with extra steps. The "loss of standing" is just the long-term disutility of eroding trust and institutional stability. You are reifying a social cost into a metaphysical stain. Why not simply say the politician maximised value but incurred a transaction cost, rather than inventing a new normative status?'
  *The Reply:* 'Because transaction costs are calculable and tradable, whereas standing is deontic. You cannot "pay" for the loss of standing by producing more good later; you must accept constraints on your future power. Consequentialism allows you to buy your way back in; my account says you must step back. That is a structural difference, not just a melancholy mood.'
  *The Soft Spot:* It is difficult to demonstrate why accepting constraints isn't just a way of maximising long-term utility. If the constraint prevents future good, the consequentialist will say the politician is irrational, rendering your "discharge" mechanism perverse.

  **3. The Category Error (The Objection You Hope Nobody Asks)**
  *The Objection:* 'Is this loss of standing moral or political? If it is moral, see objection one. If it is political, why call it "dirty hands"? You are smuggling moral condemnation into a functional loss of authority. Either you are describing a moral fault, in which case standing is redundant, or you are describing a loss of power, in which case "dirty" is the wrong metaphor.'
  *The Reply:* 'It is a hybrid concept specific to public office. The "dirt" is the moral violation; the "standing" is the political consequence. I am arguing they are not causally linked in the usual way. You can be morally justified yet politically compromised. The metaphor holds because the agent feels the moral weight, but the theory tracks the political reality.'
  *The Soft Spot:* **Why you hope this isn't asked:** This exposes the central ambiguity of your thesis. If you cannot precisely define the ontology of "standing" without sliding into either morality or power politics, the whole framework looks like a category mistake. You are hoping to glide over this definition because pinning it down risks collapsing one side of your dichotomy.

  **4. The Kantian Universalisation (The Two Kantians)**
  *The Objection:* 'Does the maxim universalise? If you say "break rules to save lives", can everyone do that? If not, you treated the victim as a means. Standing doesn't fix the violation of dignity. You are suggesting the politician can violate humanity provided they feel the loss of standing later, which treats the victim as a mere instrument for the politician's moral drama.'
  *The Reply:* 'Office-holders operate under a different set of universalisable maxims than private citizens. The maxim is " Uphold the constitution except where survival requires temporary suspension, subject to later constraint." This can be universalised among rulers. The victim is not a means to the politician's moral status, but a casualty of a tragic conflict of duties.'
  *The Soft Spot:* This smells of special pleading. Unless you can robustly defend why politicians are exempt from standard Kantian constraints, this will look like an attempt to immunise power from moral critique.

  **5. The Asymmetry Claim (Your Secondary Thesis)**
  *The Objection:* 'You claim inaction is dirtier than action. But liability usually tracks causation. How is letting die worse than killing? This contradicts basic responsibility frameworks. If I refuse to kill one to save five, I may be rigid, but my hands are cleaner than the executioner. You are asking us to invert the act/omission doctrine without sufficient warrant.'
  *The Reply:* 'In private life, you are correct. In political office, the duty is fiduciary. A politician is hired to protect the populace. Refusing to act is a dereliction of that specific duty, whereas acting dirty is a tragic fulfillment of it. The "dirt" comes from betraying the office's purpose, which is protection, not purity.'
  *The Soft Spot:* **Honest Assessment:** This claim is likely false outside a very narrow definition of office. In standard moral theory, omission is less culpable than commission. You are trying to carry too much weight with the "fiduciary" argument; if the audience rejects the idea that office duties override basic moral prohibitions, this part of the paper breaks.

  **6. The Realist Challenge (The Political Realist)**
  *The Objection:* 'What observable difference does this make on a Tuesday? If the politician stays in power and accepts "constraints", is anyone actually safer? If they resign, that is just guilt again. This is theology, not political science. You are describing a ritual of purification, not a mechanism of accountability.'
  *The Reply:* 'It changes the logic of justification. Currently, politicians say "I did it for the greater good" and move on. On my view, they must say "I did it, and therefore I cannot enforce this rule tomorrow." It shifts the burden from explanation to abdication of specific powers. That limits arbitrary power in a way guilt does not.'
  *The Soft Spot:* It is hard to prove empirically that politicians would actually accept these constraints. If they don't, your theory is normative but practically inert, which fuels the realist's claim that this is merely a philosopher's artefact.

  **7. The Verification Problem (Discharge Mechanism)**
  *The Objection:* 'You say the stain is discharged by accepting constraints. Who verifies the constraints? If the politician self-certifies, it is worthless. If others certify, it is just punishment again. You are trying to find a middle path between penance and impunity, but there is no institutional mechanism for this.'
  *The Reply:* 'Institutions verify it. Parliamentary oversight, judicial review, or term limits can serve as the constraint. The key is that the politician must not resist these checks. The discharge is not a feeling, but a submission to external verification that they are no longer fit to wield unchecked authority.'
  *The Soft Spot:* This conflates standard accountability with your specific notion of standing. If existing institutions already do this, your theory adds nothing. If they don't, you are proposing a utopian mechanism without explaining how to build it.

  **8. The Incentive Structure (The Clean Hands Critique)**
  *The Objection:* 'If clean hands are dirtier, you are incentivising hypocrisy. Politicians will act dirty to claim honesty. They will commit atrocities, accept a nominal constraint, and claim moral superiority over the cautious administrator. Your theory rewards the transgressor over the conscientious objector.'
  *The Reply:* 'No, because the transgressor loses standing. They cannot blame others, they cannot demand trust. The "reward" is illusory. The conscientious objector retains standing but may fail their duty. It is a tragedy either way, but my account ensures the transgressor does not profit from the transgression by claiming moral purity.'
  *The Soft Spot:* In practice, voters often reward "strong" leaders who break rules. Your normative claim might be correct, but if the political market rewards the behaviour you condemn, the theory lacks critical bite against actual political behaviour.

  **Strategic Advice**

  *   **Concede Up Front:** Admit that the asymmetry claim (inaction is dirtier) applies only to high-stakes fiduciary roles, not general morality. Pre-empt the accusation that you are overturning the act/omission doctrine universally.
  *   **Hold Under Pressure:** Do not concede that standing is just a proxy for guilt or utility. If you allow them to reduce standing to psychology or calculus, the paper is dead. Maintain that it is a relational fact about authority.
  *   **The Single Reply That Must Land:** You must successfully distinguish moral justification from political standing (Objection 1). If the Strawsonian expert convinces the room that standing is purely a function of blameworthiness, you have no distinct subject matter. You need the room to accept that one can be morally right to act yet politically wrong to claim authority afterwards.
