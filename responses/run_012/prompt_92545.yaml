      *   **Address the Tension (3 vs 4):** Distinguish between *Ontological Slippage* (what kind of thing is acting?) vs. *Topological Slippage* (how do the things connect?). We allow Topological slippage (wrap-around) more readily than Ontological slippage (letter vs. group).
      *   **Predictions:**
          *   Test $abc \to abd$ on $aabbcc$. Will they do $aabbcd$ (atomic) or $aabbdd$ (group)? Based on (1), likely atomic.
          *   Test $abc \to abd$ on $zyx$. Will they do $zyy$ (successor in reverse?) or $zyw$?
      *   **Recommendation:** If a principle must be sacrificed, it's the idea that "rules are literal." The principle to adopt is "Concepts are dynamic representations shaped by context."
      *   **Essay Advice:** Focus on "Pressure." Concepts bend under pressure to maintain coherence.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, look at Verdict 6 again.* The seed is $mrrjjj \to mrrjjk$. The target is $aaaa$. The user says "I find I have no answer."
      *   If the rule derived from $mrrjjj \to mrrjjk$ is "increment the last letter," then $aaaa \to aaab$ should be easy.
      *   Why is it hard? Because $mrrjjj$ *strongly* implies grouping. $aaaa$ *strongly* implies uniformity. The cognitive friction is between the *contextual framing* of the rule.
      *   *Correction:* The principle isn't just about the rule, it's about the *description* of the scene. In $mrrjjj$, the 'j's are a group. In $aaaa$, are they a group or individuals? If the rule is "increment the last group," $aaaa$ is one group $\to$ $bbbb$? If "increment last letter," $\to$ $aaab$? The user feels *no answer*. This implies the concept relies on *differentiation*.
      *   *Key Insight:* Concepts require *contrast* to function. $abc$ has distinct letters. $mrrjjj$ has distinct groups. $aaaa$ has neither. The concept "change the end" requires an "end" distinct from a "beginning." In $aaaa$, every position is identical.
      *   *Revised Principle:* **Differentiation Precedes Operation.** You cannot apply a directional rule to a symmetric object without breaking the symmetry first.

  6.  **Finalizing the Structure:**
