      *   **The Six Verdicts:**
          1.  *Seed:* $abc \to abd$. *Target:* $iijjkk$. *Answer:* $iijjll$. (Accept: Rightmost letter increments).
          2.  *Seed:* $abc \to abd$. *Target:* $mrrjjj$. *Answer:* $mrrjjk$. (Accept: Rightmost letter increments, even inside a group).
          3.  *Seed:* $abc \to abd$. *Target:* $mrrjjj$. *Friend's Answer:* $mrrkkk$. (Reject: Advancing the whole last group).
