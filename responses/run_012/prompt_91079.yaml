answer: |-
  The rain in Newhaven doesn't wash things clean; it just makes the grime slicker. I watched it bead on the reinforced glass of the Coordination Centre, tracing paths down towards the grey churn of the Channel below. Inside, the air was recycled and dry, smelling of ozone and stale coffee.

  My title was Senior Flow Architect. In the old days, before the Automation Accords, I sat the Watch like everyone else. Four hours a week, mandatory civic duty. You sat in a booth, headset on, watching the feed from the Gull drones. When a distress beacon pinged—a swimmer in trouble, a boat capsized, a fool walking the sea wall in a gale—you pressed the green button. *Confirm Launch.* If you didn't, and someone died, it was manslaughter by omission. The law was explicit: you had a duty of care, and your failure to discharge it was a positive cause of death.

  That was the theory. The practice was messier.

  Now I didn't press buttons. I designed the streams. I decided which distress signals went to which booths. I managed the load balancing. I was a router.

  "You're looking at the Henderson file again," said Sarah. She was an auditor from the Ministry of Civic Safety, standing in the doorway of my office. She held a tablet, filling *in* the requisite compliance forms with a stylus that squeaked against the glass.

  "Just checking the latency logs," I said. I didn't turn around. "There was a spike in Sector 4 during the storm."

  "There was a death," Sarah corrected. "Mr. Henderson went over the wall. A Gull spotted him. No launch occurred. He drowned. The operator on shift, a Mr. Garris, is facing charges. But the metadata suggests the signal was routed to his booth specifically."

  I turned then. "Routing is algorithmic, Sarah. You know the protocol. High-risk zones are matched with high-experience operators."

  "Garris had failed three psych evaluations in the last month," she said, stepping into the room. "He was flagged as unfit for high-stress confirmations. Yet your system assigned him the Henderson ping. Why?"

  "Human error in the flagging system," I said. "It happens."

  "It happens," she repeated. "Or it's arranged."

  She sat on the edge of the desk. This was the friction point. This was where the philosophy met the pavement. The law treated acts and omissions differently. If I had taken a boat out and pushed Henderson into the water, I was a murderer. The causality was direct, physical, undeniable. But I hadn't touched Henderson. I hadn't touched the drone. I hadn't even pressed the button that would have saved him.

  I had merely arranged the circumstances such that the button press—the act that would have interrupted the chain of entropy—did not occur.

  "It's omission laundering," Sarah said quietly. She wasn't quoting me, but she was using the term. It had started on the forums, then migrated to the breakrooms. *Omission Laundering.* The practice of cleaning dirty causality until it looks like mere negligence.

  "Is it?" I asked. "Legally, the cause of death is drowning. The legal cause is Garris's failure to act. My routing is administrative context. It's not a but-for cause in the statutory sense."

  "Isn't it?" Sarah leaned forward. "If you hadn't routed the signal to Garris, it would have gone to Booth 12. Booth 12 would have confirmed. Henderson would be alive. Therefore, your routing is the but-for cause of his death."

  "But Booth 12 might have spilled their coffee," I said. "Booth 12 might have had a heart attack. Booth 12 might have hesitated. The counterfactual isn't solid. You're comparing reality to a hypothetical where everything else remains constant except my choice. But in the real world, the system is noisy. Garris was the variable I selected."

  "You selected a broken variable," she said.

  "I selected a variable within the permissible parameters," I corrected. "The system allows for human error. The law accepts that people fail their duties. If I exploit the statistical probability of that failure, am I causing the outcome, or am I just observing the landscape?"

  This was the itch I couldn't scratch. The rationalist in me wanted to draw a Bayesian network. Node A: Henderson falls. Node B: Signal routed to Garris. Node C: Garris fails to click. Node D: Death.

  In a standard causal model, A leads to D, mediated by B and C. If I control B, I control D. But the law, and indeed our moral intuition, treats Node C differently. Node C is an *omission*. It is a null action. It is the absence of a force. If I push a boulder off a cliff, I add energy to the system. If I remove the strut holding the boulder, I subtract energy. The outcome is identical: the valley is crushed. But we feel the pusher is worse than the remover.

  Why? Because the remover can say, "I didn't do anything. I just didn't hold it."

  I had taken this intuition and industrialised it.

  "It's not just Henderson," Sarah said. "We've seen the pattern. High-profile debts. Political rivals. People who disappear over the wall during storm cycles. Every time, the routing assigns the rescue signal to an operator who is distracted, overloaded, or compromised. Sometimes it's a chain. One operator confirms the locate, the next confirms the hover, the third confirms the winch. If any one of them omits, the subject dies. You fragment the causality across three people. None of them feel responsible. Each one thinks, 'I did my part, the next person failed.'"

  "Diffusion of responsibility," I said. "It's a known psychological phenomenon."

  "It's a murder weapon," she snapped. "You're using the bureaucracy as the gun."

  "But I'm not pulling the trigger," I said. "That's the point. The trigger is the green button. I never touch it. I just ensure the finger is shaky."

  I stood up and walked to the window. The sea was heaving, whitecaps breaking against the sea wall. "Think about the structure, Sarah. If I hire a hitman, I am guilty of murder. The hitman is the instrument. But if I hire a hitman who is legally mandated to save lives, and I pay him to look away... am I the cause? Or is he?"

  "He's the cause. He's the one who didn't act."

  "But I made the not-acting inevitable," I said. "I engineered the omission. I turned a possibility into a certainty. Does the specificity of the engineering not transfer the causal weight?"

  "That's what we're trying to determine," she said. "The Ministry is drafting new legislation. 'Malicious Routing.' It treats the design of the omission as equivalent to the act itself."

  "And will it work?"

  She hesitated. "Legally? Yes. Morally? I don't know. That's why I'm here."

  She tapped her tablet. "Show me the logic. Walk me through the Henderson route. Not the logs. The thought process."

  I sighed. This was the confession she wanted, but I couldn't give it in the language of crime. I had to give it in the language of systems.

  "Henderson was in Zone 4," I began. "Zone 4 is high turbulence. The protocol requires a Level 5 operator. Garris was Level 4, but his clearance had been temporarily elevated due to staffing shortages. I knew this. I also knew Garris was undergoing a divorce. His cognitive load was high. The probability of a missed confirmation under stress was 40%. Standard protocol would have routed to a Level 5 with a 5% failure rate."

  "So you chose the 40%."

  "I chose the available resource," I said. "The system is resource-constrained. If I route to the Level 5, I leave Zone 9 uncovered. Zone 9 has a school trip on the water. If a boat capsizes in Zone 9 while my Level 5 is busy in Zone 4, three children die. If I route Henderson to Garris, one adult dies. I optimised for minimum expected loss."

  Sarah went very still. "You're saying Henderson was a trade-off?"

  "I'm saying causation is a zero-sum game," I replied. "Attention is finite. Every confirmation requires cognitive work. By assigning the task to Garris, I freed up the competent operator for a higher-value target. Henderson's death is the result of resource allocation. Is the budget officer who cuts the fire department funding a murderer when the house burns down? Or is it the fire that killed them? Or the lack of water?"

  "The budget officer knows the house will burn," Sarah said.

  "I knew Henderson might drown," I conceded. "But I didn't know he *would*. That's the shield. Probability. If I knew for certain, it would be intent. But there was always a chance Garris would click the button. He just didn't. I created the conditions for the omission, but I didn't compel it. Garris retained agency. He could have saved him. He chose not to, however unconsciously."

  "That's the loophole," Sarah said, her voice tight. "You hide behind their agency. You say, 'I didn't kill him, he did, by failing to save him.' But you rigged the game so failure was the most likely move."

  "Is rigging a game causation?" I asked. "If I stack a deck of cards so you draw an ace, did I cause you to draw an ace? Or did you?"

  "You stacked the deck."

  "I arranged the omissions."

  We stood there for a long time, the hum of the servers filling the silence. Outside, a siren wailed. Another ping. Another soul in the water. Somewhere in the Centre, a light was blinking on a console. A human being was looking at a screen, deciding whether to press a button.

  "What happens now?" I asked.

  "Now," Sarah said, "I file my report. I recommend charges. Manslaughter. Maybe murder, if we can prove intent beyond the resource allocation defence."

  "And if you fail?"

  "Then the system continues," she said. "Then people like you keep laundering the causality. You turn blood into paperwork. You turn murder into admin."

  "It's not admin," I said softly. "It's architecture. I build the channels where the water flows. I don't push the water. I just dig the ditch."

  "The ditch leads to the grave," she said.

  "Everything leads to the grave eventually," I replied. "I just manage the throughput."

  She looked at me, and for a moment, I saw the frustration behind her eyes. It was the frustration of trying to map a continuous reality onto discrete legal categories. The law wanted a binary: Cause or No Cause. Act or Omission. But the world was analog. It was a spectrum of influence. I was at the far end of the spectrum, where influence looked like indifference.

  "I'll be in touch," she said. She turned to leave, then paused at the door. "One question. Do you sleep?"

  "I sleep fine," I said. "I don't press the buttons, Sarah. I just watch the lights."

  She left. The door clicked shut.

  I turned back to the window. The rain was heavier now, blurring the glass. Down below, the sea wall was invisible beneath the surge. I thought about Henderson. I thought about Garris, sitting in his booth, head in his hands, waiting for the police. Garris would be the cause. The law would say Garris killed him. Garris failed to act.

  But I knew the geometry of it. I knew that if you draw a line from the death back to its source, it doesn't stop at the button. It goes through the wire, through the router, through the algorithm, through me.

  The problem was, where do you draw the line? If I am responsible for the omission I engineered, am I responsible for every omission I *could* have engineered but didn't? If I route a signal to a competent operator, am I responsible for saving them? Does preventing an omission make me the cause of life?

  If causation by omission is real, then every time I don't save everyone, I kill them. I am killing everyone I don't save. The only way to be innocent is to save every soul, everywhere, always. Since that's impossible, I am always guilty. The only variable is whether the guilt is recognised.

  Omission laundering doesn't clean the guilt. It just spreads it thin enough that it looks invisible.

  A light blinked on my console. Zone 9. School trip. I had a Level 5 operator available now. I could route it there. High probability of survival. Or I could route it to a Level 3 who was currently texting his wife. Lower probability. Resource allocation.

  My hand hovered over the keyboard. I wasn't pressing a button. I was just assigning a task. I was just managing the flow. I was just... not acting.

  The light blinked again. Waiting.

  I looked at my hand. It was clean. It hadn't touched the water. It hadn't touched the victim. It hadn't even touched the button that would save him. It was just resting on the keys that decided who would try.

  I made the choice. I routed the signal. I watched the light move to another screen. Another person would now carry the weight of the omission. I had passed it on. I had laundered it.

  Outside, the sea kept rising. Inside, the air remained dry. I waited to see if anyone would drown, knowing that if they did, it wouldn't be because of me. It would be because someone else hadn't acted. And I would be right. And I would be wrong. And the difference between the two was getting smaller every day.
