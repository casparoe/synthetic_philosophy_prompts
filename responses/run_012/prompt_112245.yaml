answer: |-
  **Project Title:** Beyond the One-Liner: A Taxonomy of Metric Failure Mechanisms

  **Project Summary**
  Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure") is frequently cited in economics, public policy, and ethics. However, it is typically treated as a monolithic phenomenon. This project argues that "metric failure" is not a single mechanism but comprises at least three distinct causal pathways: *Strategic Gaming* (agents manipulating the input), *Epistemic Drift* (the world changing around the metric), and *Ontological Replacement* (the metric redefining the goal). Current discourse treats these as identical, leading to ineffective solutions (e.g., applying auditing to a problem of drift). Over six weeks, I will construct a conceptual taxonomy of these failure modes, test them against three distinct case studies, and determine whether distinct failure modes necessitate distinct remediation strategies.

  **The Research Question**
  *Are the mechanisms underlying Goodhart effects unitary or distinct, and does distinguishing between agent-driven gaming and system-driven drift alter the normative prescription for fixing the metric?*

  Most discussions assume the answer is obvious: metrics get gamed, so we need better metrics or more oversight. This project challenges that assumption. If a metric fails because the underlying reality shifted (Drift), more oversight will not help. If a metric fails because it has become the definition of success (Replacement), removing the metric might collapse the system entirely. The research question seeks to determine if these are categorically different errors or merely surface-level variations of the same problem.

  **Background & Why Obvious Answers Fail**
  The standard philosophical and economic treatment of Goodhart's Law tends to focus on *incentive compatibility*. The prevailing view is that agents are rational maximizers who will exploit loopholes. The "obvious answer" is that we need to align incentives better or hide the metric.

  This approach fails to account for non-agentic failure. For example, in climate science, a proxy measure for temperature might stop tracking actual temperature not because scientists are cheating, but because the atmospheric correlation broke down. Conversely, in education, test scores might rise while learning falls because teachers are actively optimizing for the test. Lumping these together under "Goodhart's Law" obscures the cause.

  Furthermore, the "Ontological Replacement" case is often ignored. When hospital wait times become the target, the "goal" of healthcare efficiency may literally become "reducing wait times" rather than "treating patients quickly." This isn't gaming; it's a shift in what the institution *is*. Treating this as simple corruption misses the philosophical shift in the institution's identity.

  My hypothesis is that these three modes (Gaming, Drift, Replacement) are mutually exclusive in mechanism but often concurrent in practice. The project aims to disentangle them.

  **Methodology & Six-Week Timeline**
  This is a conceptual analysis project utilizing case study methodology. No budget or lab access is required; the primary tools are logical modeling and comparative analysis of public data/reports.

  *   **Weeks 1-2: Conceptual Framework Construction**
      *   Define the three categories (Gaming, Drift, Replacement) with necessary and sufficient conditions for each.
      *   Create a "Decision Tree" for diagnosing which mode is active in a given scenario.
      *   *Deliverable:* A 2-page working definition document distinguishing the three modes.

  *   **Weeks 3-4: Case Study Stress-Testing**
      *   Select three high-documentation cases: Standardized Testing (Education), Emergency Room Wait Times (Healthcare), and Carbon Credit Offsets (Environmental Policy).
      *   Apply the Week 2 Framework to each. Does the framework hold? Do the cases fit neatly into one category, or are they hybrids?
      *   *Deliverable:* Annotated analysis of the three cases, mapping specific events to the failure modes.

  *   **Week 5: Remediation Mapping**
      *   For each failure mode identified in Weeks 3-4, identify the standard proposed solution (e.g., auditing, metric rotation, stakeholder redefinition).
      *   Analyze mismatches: Where is a "Gaming" solution being applied to a "Drift" problem?
      *   *Deliverable:* A matrix matching Failure Mode to Effective/Ineffective Solutions.

  *   **Week 6: Synthesis and Final Paper**
      *   Draft the final 10-15 page paper.
      *   Refine the argument: If the categories collapse, argue why they collapse. If they hold, argue for the new taxonomy.
      *   *Deliverable:* Final Research Paper.

  **Criteria for Success and Failure**
  *   **Success:** The project produces a stable taxonomy where at least two of the three failure modes are shown to be mechanistically distinct, and I can demonstrate one real-world instance where applying the wrong fix (based on misdiagnosis) worsened the outcome.
  *   **Failure (Type 1):** The three categories turn out to be semantically different but causally identical (e.g., Drift is just slow Gaming). If this happens, the paper must argue *why* they collapse rather than forcing a distinction.
  *   **Failure (Type 2):** The case studies are too messy to categorize. If this happens, the scope shifts to analyzing *why* the categorization is impossible (i.e., proving the phenomenon is inherently indeterminate).
  *   **Failure (Type 3):** The project remains descriptive ("here are examples") without reaching a normative conclusion ("therefore we should diagnose before fixing").

  **Scope Assessment & Feasibility**
  **Is this too big for six weeks?**
  Yes, in its current form, it risks being too broad. Attempting to solve the remediation strategy (Week 5) for three complex domains (Education, Health, Environment) is ambitious for a high school summer project.

  **What to Cut:**
  To ensure completion, I will cut the **Remediation Mapping (Week 5)** if the Conceptual Framework (Weeks 1-2) proves difficult to stabilize. It is more valuable to have a rigorous definition of the problem than a speculative list of solutions.
  *   *Pivot:* If Weeks 1-3 show that distinguishing the modes is harder than expected, I will reduce the case studies from three to **one deep dive** (likely Standardized Testing, due to data availability) to prove the distinction exists in at least one domain.
  *   *Constraint:* I will not attempt to interview stakeholders or gather private data. All analysis will be based on publicly available reports and existing literature provided by the mentor.

  **Conclusion**
  This project moves beyond quoting Goodhart's Law to dissecting it. By treating metric failure as a multi-mechanism phenomenon rather than a single law, I aim to provide a diagnostic tool that prevents the application of "gaming" solutions to "drift" problems. The outcome will be a philosophical framework with practical implications for policy design.
