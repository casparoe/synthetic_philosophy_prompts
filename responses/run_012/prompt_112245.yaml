prompt: |-
  Hey so I'm a junior in high school and I'm applying to this summer research program at the local university — six weeks, you get a grad student mentor, and you have to hand in a 3-page proposal up front before they'll take you. Mine is supposed to be philosophy-ish. They allow that as long as you can argue it's a real research question and not just an essay.

  My half formed idea is about the thing where you start measuring something and then people start optimizing the number instead of whatever you actually cared about. I think it's called Goodhart's law? Everyone knows the one liner about how a measure stops being a good measure once it becomes a target, and I've got a million examples (standardized test scores, hospital waiting times, cops reclassifying crimes, video game achievements, that kind of stuff). But every time I try to write the actual question down it splits into things that feel like they're not the same phenomenon. Like:

  - sometimes nobody is cheating at all and the number just quietly stops tracking the real thing because the world moved
  - sometimes people are actively gaming it — teaching to the test, hitting the button that scores the point
  - and sometimes I think the number was never tracking a real thing in the first place, it just became the definition of the thing, so "the measure got worse" isn't even the right description — the goal got replaced by the metric

  The bit I actually think is interesting and can't find spelled out anywhere: whether gaming and world-shifting are really two different failure modes or one mode wearing a hat. My hunch is they come apart in a way that matters, because in one case more auditing and transparency fixes it and in the other it definately doesn't, and there might be a third case where auditing makes it wierdly worse. I also suspect the "the goal got replaced" case is doing something different from both, but I can't say what.

  Can you turn this into the proposal? What I need in it: the question stated so that it actually has an answer instead of being a vibe, why the obvious answers people give don't settle it, what I'd do in six weeks week by week (I have no budget, no lab, it's just me and a laptop), what would count as the project failing, and an honest call on whether this is too big for six weeks — and if it is, exactly what to cut so it isn't. Please don't give me a reading list or citations, my mentor said she'd sort that out and I can't get to a library anyway. And please don't just say "it depends on the context" for three pages, that's what my last draft did and it was useless.
