      *   **Stronger Claim:** Indifference, relativized to a procedure class, is a *genuine principle of inference*, not just a consistency constraint. Once the procedure is fixed, indifference is *forced*, yielding determinate answers where classical PoI was ambiguous.
      *   **Objection to Address:** Is this a "verbal rescue"? By making the procedure class part of the input, have we just renamed the problem? Real-world cases (unknown coin bias, unknown cube side, hypotheses about the world) don't come with procedure classes attached. Indifference over procedures might be empty or covertly arbitrary.
      *   **Honest Accounting of Cost:**
          *   What is preserved? (e.g., finite symmetrical hypotheses).
          *   What is lost? (e.g., determinate priors over unknown continuous quantities, two-envelope problem, doomsday argument).
          *   Evaluation: Does the loss indict the view or the application?

  2.  **Drafting - Section by Section:**

      *   **Introduction:** State the thesis clearly. Reframe Bertrand's Paradox not as a failure of logic but as a failure of specification. Introduce the "Procedural Principle of Indifference" (PPI).
      *   **Argument for the Core Position:** Explain *why* the procedural view solves the paradox.
          *   Classical PoI: $P(A) = P(B)$ given no info.
          *   Procedural PoI: $P(outcome | procedure) = uniform$.
          *   Show how the three Bertrand methods correspond to three different physical generative stories. The contradiction vanishes because the questions are actually different.
          *   Address the "transformation" issue: Invariance isn't a requirement of rationality unless the transformation preserves the generative mechanism.
      *   **Defending the Stronger Claim (Inference vs. Consistency):**
          *   Critique the Bayesian subjectivist view (PoI as mere coherence).
          *   Argue that given a *specific* physical setup (e.g., a roulette wheel, a specific throwing mechanism), symmetry *compels* equal credence. It's not just "you can't be Dutch Booked"; it's "the physics dictates the probability."
          *   This makes it objective relative to the procedure. It resolves ambiguity *within* the procedure class.
      *   **Addressing the Objection (Verbal Rescue):**
          *   The objection: Real life doesn't label procedures. "Unknown coin bias" doesn't tell us *how* the bias was generated.
          *   Response: Acknowledge the force. We often lack procedural knowledge.
          *   Counter-response: This isn't a flaw in the principle; it's a fact about the world. If the world doesn't specify a procedure, probability *shouldn't* be determinate. The "verbal rescue" is actually an ontological clarification. Pretending we have a determinate prior when we lack a generative model is the real error (hubris).
          *   Address "Indifference over Procedures": If we don't know the procedure, we shouldn't apply indifference over procedures arbitrarily. We should admit ignorance (imprecise probabilities).
      *   **Honest Accounting of Cost:**
          *   *Preserved:* Finite discrete cases with genuine symmetry (fair dice, cards). Logic of symmetry holds.
          *   *Lost:*
              *   Continuous parameters without physical justification (e.g., Jaynes' maximum entropy without physical constraints).
