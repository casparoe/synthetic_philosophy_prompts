answer: |-
  **JOINT STATEMENT ON WILL, PREFERENCE, AND TEMPORAL CHOICE**

  **Preamble**
  We, the undersigned, acknowledge that our ongoing discourse regarding "weakness of will" has reached a stalemate due to divergent disciplinary frameworks and terminological slippage. One of us approaches the problem via behavioural modelling (Econ), the other via normative psychology and action theory (Phil). We agree that the phenomenon of failing to follow through on intentions is real, but disagree on its ontological status and normative weight. This document formalises our points of contact and contention to determine whether the dispute is substantive or merely verbal. We commit to treating the following claims as binding for the duration of this inquiry.

  **I. Agreed Claims**
  1.  **The Data:** Agents frequently make plans at $t_1$ to perform action $X$ at $t_2$, and subsequently fail to perform $X$ at $t_2$.
  2.  **The Phenomenology:** Agents sometimes report feeling conflict or regret at $t_2$ when failing to perform $X$ (Case A), and sometimes report feeling relief or revised conviction at $t_2$ when failing to perform $X$ (Case B).
  3.  **The Model:** A discount function that declines over time (hyperbolic-like) can mathematically reproduce the choice pattern of planning $X$ at $t_1$ and choosing not-$X$ at $t_2$.
  4.  **The Hazard Rate:** Uncertainty about the duration of the future (hazard rate) can generate declining discount rates in a rational agent without requiring a change in underlying utility functions.
  5.  **The Huck Finn Constraint:** Any theory must accommodate the possibility of acting against one's better judgment *rightly* (e.g., moral intuition overriding flawed reasoning) as well as *wrongly*; weakness of will is not identical to moral error.
  6.  **Descriptive vs. Normative:** There is a distinction between describing *why* an action occurred (causal explanation) and evaluating whether the action was rational or autonomous (normative evaluation). We agree that behavioural models primarily address the former, while philosophical accounts often target the latter.
  7.  **Terminological Truce:** We acknowledge that "Preference" is currently being used in two ways: (1) as *revealed choice* (whatever is chosen is preferred), and (2) as *evaluative ranking* (what is judged best, regardless of choice). We agree to specify which definition is in play when making claims.

  **II. Disagreements Table**

  | Question | Phil's Position (MA) | Econ's Position (PhD) | What Turns on This |
  | :--- | :--- | :--- | :--- |
  | **1. Ontology of the Failure** | Case A (Conflict) and Case B (Revision) are distinct mental events. In Case A, the evaluative ranking remains constant while the causal power of desire overrides it. | Case A and Case B are the same event type (preference reversal). The feeling of "conflict" is a post-hoc narrative imposed on a shift in revealed preference. | Whether "weakness of will" names a specific psychological mechanism or is merely a label for any time-inconsistent choice. |
  | **2. Authority of the Past Self** | A resolution formed at $t_1$ creates a normative reason for action at $t_2$ that persists even if the $t_2$ desire changes. The $t_1$ self has partial authority over the $t_2$ self. | The $t_2$ self is the only agent actually acting. Privileging the $t_1$ preference is arbitrary; rationality is maximizing utility for the *current* self, given current constraints. | Whether pre-commitment devices are tools of rationality (binding a bias) or tools of oppression (binding future freedom). |
  | **3. Explanatory Power** | "Acting against better judgment" does explanatory work. It predicts specific downstream effects (guilt, self-licensing, distinct neural correlates) that mere preference reversal does not. | "Acting against better judgment" is epiphenomenal. Once you model the discount rate and hazard uncertainty, the "judgment" variable adds no predictive power to the choice. | Whether we need a folk-psychological construct of "will" or if discounting parameters suffice for prediction. |
  | **4. Rationality of Reversal** | A reversal where the evaluative judgment remains constant but action flips is structurally irrational (akrasia), regardless of the discount rate. | A reversal driven by a changing time-horizon under uncertainty is structurally rational. If the hazard rate changes, the optimal choice changes. | Whether the agent in Case A is making a mistake or simply updating on implicit environmental cues. |

  **III. Cruxes and Evidentiary Predictions**

  **Crux 1: Phenomenological Discriminability**
  *The Question:* Can Case A (Weakness) and Case B (Revision) be distinguished empirically without relying on the agent's own use of the word "willpower"?
  *Agreed Evidence:* A blinded study where agents log intentions, actions, and immediate post-action self-reports (affect, perceived reason for action) in real-time.
  *   **Phil's Prediction:** We will see two distinct clusters in the data. Cluster 1 (Weakness) will correlate with negative affect (regret/shame) and reports of "being overcome." Cluster 2 (Revision) will correlate with neutral/positive affect and reports of "changing my mind."
  *   **Econ's Prediction:** The data will form a single continuum driven by the magnitude of the immediate reward. Affect (regret vs. relief) will not correlate with the choice structure itself, but with external social signalling. The "clusters" will dissolve when controlling for the size of the discount.

  **Crux 2: The Value of Binding**
  *The Question:* If the Econ is right that preference reversal is often rational (due to hazard uncertainty), agents should not systematically pay to restrict their own future choices unless their current discount rate is pathologically high. If the Phil is right, agents should pay to bind themselves to uphold *judgments* even when desires shift.
  *Agreed Evidence:* Uptake of commitment contracts (e.g., sticking to Dry January via a financial penalty) where the agent explicitly states their desire at $t_2$ might change.
  *   **Phil's Prediction:** Agents will purchase commitment devices specifically to protect *evaluative judgments* against anticipated *desire shifts*. They will report that the device preserves their "true" agency.
  *   **Econ's Prediction:** Agents will purchase commitment devices only when the cost of the device is lower than the predicted loss from their own time-inconsistency. They will report that the device alters the *incentive structure*, not the agency. If the hazard rate explanation holds, uptake should decrease when agents are taught to model uncertainty accurately.

  **IV. Terminological Clarification**
  We acknowledge that a significant portion of our dispute stems from the definition of **Preference**.
  *   **Econ** defines Preference as *Revealed Choice*: If you drink, you preferred to drink. Under this definition, weakness of will is impossible by fiat.
  *   **Phil** defines Judgment as *Evaluative Ranking*: You can judge $X$ better than $Y$ but choose $Y$. Under this definition, weakness of will is a structural relation between Judgment and Choice.

  **Agreement:** We will cease arguing about whether weakness of will exists *under the Econ definition of Preference*. We will restrict our debate to whether the *Phil's definition of Judgment* tracks a real, causally efficacious mental state that predicts behaviour better than discounting models alone.

  **Signed,**

  ________________________ (Phil)
  ________________________ (Econ)
  **Date:** ________________
