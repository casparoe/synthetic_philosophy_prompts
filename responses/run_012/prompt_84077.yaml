er relies on metaphysical inconsistency. We need Evelyn to be one person to care, even if the universe says she is many. The 70/30 split makes her a stranger to herself. The movie refuses that alienation. It insists that no matter how much you change, you are still you. That is a lie, but it is the lie that lets us sleep at night. 
