distinct centers of observation that can still relate. The film succeeds here by showing that high-fidelity copying isn't about cloning memories, but about replicating emotional context. When Evelyn understands Waymond's kindness as a strategy rather than weakness, she installs his pattern into her own operating system. She becomes a carrier of his soul. This is exactly Hofstadter's claim: we are vessels for each other. The emotional climax works because it feels like a reunion of scattered parts, even if the metaphysics of the jump denied that scattering earlier. Hofstadter suggests souls come in sizes based on how many minds hold you. The film scales this visually. Joy as Jobu holds everyone's attention, a massive soul turned destructive. Evelyn grows her soul by holding space for Waymond, her father, and her daughter. The finale is not a battle, but an expansion of capacity. By refusing to fight, Evelyn ensures her pattern remains in Joy's mind without coercion. She accepts that her daughter's mind is a separate universe where her influence is limited. This humility is the fidelity threshold Hofstadter describes. You cannot force your pattern onto another; it must be received. The film's visual language of fractals and branching paths supports this. Every kindness branches the future. Every act of recognition creates a new node where the self exists. The movie thus argues that immortality is not about lasting forever in time, but lasting widely in space, across the neural networks of the people you love. 
