answer: |-
  You ask why the rule beats what she saw with her own eyes, but you misunderstand what her eyes were looking at: she saw a tragedy, yes, but she failed to see the institution she was eroding from within. I will grant you that mercy feels better than bureaucracy in the singular case, and perhaps this family deserved relief, but you cannot build an ethical life (*Sittlichkeit*) on private revelations of justice. By saying "nobody was ever going to know," you admit the act could not withstand public scrutiny, which means it was not law—it was favor, disguised as justice. Her office is not a vessel for her personal morality; it is a node in a network of trust that requires her to be impersonal, even when it hurts. If the law depends on the secret virtues of clerks rather than the public validity of rules, you do not have a state, you have a collection of benevolent dictators waiting for someone to notice they are winging it.
