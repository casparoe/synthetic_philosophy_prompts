answer: |-
  This is a fantastic question. The quote you found is a classic example of "smart-sounding pop social science." It takes real, Nobel Prize-winning concepts and smashes them together into a cynical cocktail-party argument that sounds profound but falls apart under scrutiny.

  If your character is a political scientist, they would recognize this immediately as a conflation of three different theories (Condorcet, Downs, and Arrow) used to support a conclusion none of them actually prove.

  Here is a claim-by-claim breakdown of what an expert would accept, what would make them wince, and what is plain wrong, followed by how your character can push back.

  ### Claim-by-Claim Breakdown

  **1. "The paradox of voting was discovered by Condorcet..."**
  *   **Verdict:** **Accept (with a caveat).**
  *   **The Nuance:** Marquis de Condorcet did identify the "Condorcet Paradox" in 1785. However, in political science, the phrase "The Paradox of Voting" usually refers to something else (see Claim 4). Condorcet discovered the *Voting Paradox* (cycles), while Anthony Downs later described the *Paradox of Not Voting* (rational choice). The quote is sloppily using the terms interchangeably.

  **2. "...and it shows that majority rule is logically self-contradictory: a majority can prefer A to B, another majority can prefer B to C, and yet another can prefer C to A..."**
  *   **Verdict:** **Accept.**
  *   **The Nuance:** This is an accurate description of the Condorcet Paradox. It demonstrates *intransitivity* in group preferences. Even if every individual voter is rational (their preferences don't cycle), the group aggregate can be irrational. This is mathematically true.

  **3. "...so there's really no such thing as the 'will of the people' at all."**
  *   **Verdict:** **Wince.**
  *   **The Nuance:** This is the first leap. Social Choice Theory shows that aggregating preferences is difficult and context-dependent, not that a "will" is nonexistent. A political scientist would argue that the "will of the people" isn't a pre-existing object you find under a rock; it is *constructed* through institutions, debate, and party platforms. Just because the math is messy doesn't mean the political reality is void.

  **4. "This is why rational-choice theorists have shown that a selfish person has no reason to vote — your one vote will never decide anything."**
  *   **Verdict:** **Wince (Conflation).**
  *   **The Nuance:** This is the **Downsian Paradox of Voting** (from Anthony Downs' *An Economic Theory of Democracy*, 1957), not Condorcet. The quote falsely implies that *because* majority rule has cycles (Condorcet), *therefore* voting is irrational (Downs). These are separate issues.
  *   **The Math:** Rational Choice Theory does argue that the *instrumental* benefit of voting (probability of deciding the election × benefit of your candidate) is usually lower than the *cost* (time, effort). Mathematically, for a purely selfish actor, voting is irrational. But the quote presents this as a consequence of Condorcet, which it isn't.

  **5. "And Arrow later proved, with his impossibility theorem, that no democratic system can ever be made to work."**
  *   **Verdict:** **Plain Wrong.**
  *   **The Nuance:** Kenneth Arrow's Impossibility Theorem (1951) is real, but the interpretation here is hyperbolic nonsense. Arrow proved that no rank-order voting system can satisfy a specific set of *fairness criteria* (like non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives) simultaneously in all cases.
  *   **The Reality:** He did **not** prove democracy can't work. He proved that perfect mathematical fairness is impossible. Most democracies work fine by relaxing one of Arrow's criteria (e.g., allowing for some level of "irrelevant alternatives" influencing outcomes). Saying Arrow proved democracy is impossible is like saying physics proved flight is impossible because of gravity.

  **6. "The only real mystery is why anyone bothers to show up."**
  *   **Verdict:** **Non Sequitur.**
  *   **The Nuance:** This conclusion does not follow from the premises. Even if individual impact is low (Downs) and aggregation is messy (Condorcet/Arrow), people still vote for other reasons: expressive voting (signaling identity), civic duty, social pressure, or because the "cost" of voting is low enough that the tiny chance of impact is still worth it.

  ***

  ### Does the Punchline Follow?
  **No.** The argument commits a category error. It takes mathematical limitations on *aggregation* and treats them as practical limitations on *governance*.

  Democracy is not a calculator; it is a conflict-resolution system. The fact that preferences can cycle doesn't stop a government from functioning; it just means that *which* issues get voted on, and *when*, matters (this is where power lies). The fact that one vote rarely decides an election doesn't make voting pointless; it makes it a collective action problem that humans solve through norms and culture, not just cold calculus.

  ***

  ### How Your Character Can Push Back
  If your character is a disillusioned but competent political scientist, they shouldn't just say "you're wrong." They should correct the theory while admitting the cynicism has a point. Here are three ways they could respond, depending on their personality:

  **1. The Pedantic Correction (The "Actually..." approach)**
  > "You're mixing up Condorcet with Downs. Condorcet proved that group preferences can cycle; Downs argued that the cost of voting outweighs the benefit. Arrow didn't prove democracy is impossible, he proved that no voting system is perfectly fair in every mathematical scenario. You're quoting a freshman seminar summary, not the actual theory."

  **2. The Institutional Realist (The "Power" approach)**
  > "The math is clean, but politics isn't. The 'paradox' only matters if you assume everyone votes on everything at once. In the real world, institutions, parties, and agendas stabilize the chaos. The 'will of the people' isn't discovered, it's built. And voting isn't about deciding the election; it's about deciding who gets to build it."

  **3. The Disillusioned Expert (The "You're right, but for the wrong reason" approach)**
  > "Arrow and Downs are right about the math, but wrong about the humans. People don't vote because they think they're a decimal point in a probability equation. They vote because they're tribal, or hopeful, or angry. The tragedy isn't that voting is irrational. It's that the system is designed to make sure your irrationality doesn't actually change the outcome."

  ### Recommended Reading for Your Research
  If you want to deepen the character's voice, these are the actual sources that quote is mangling:

  *   **For the "Voting is Irrational" argument:** *An Economic Theory of Democracy* by Anthony Downs (1957). Specifically, look up the "Calculus of Voting."
  *   **For the "Math is Impossible" argument:** *Social Choice and Individual Values* by Kenneth Arrow (1951).
  *   **For the Pushback (Why people vote anyway):** Look for papers on **"Expressive Voting"** (Geoffrey Brennan) or **"Civic Duty"** models.
  *   **For a Pop-Science Overview:** *The Myth of the Rational Voter* by Bryan Caplan (argues voters aren't rational, but democracy survives anyway) or *The Paradox of Democracy* by Zakaria (more on illiberalism, but touches on the souring sentiment).

  ### Summary for the Novel
  The quote you found is the kind of thing a smart grad student says at a bar to sound deep. A tenured professor would hear it and hear the holes. If your character wants to express cynicism, they should focus on **power** and **agenda control** (who decides what we vote on), rather than the mathematical impossibility of voting. That is where the real sourness in political science lives today.
