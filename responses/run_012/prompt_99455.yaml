      *   *Claim 5 (Arrow):* *Wince/Exaggeration.* Arrow's Impossibility Theorem is real, but "no democratic system can ever be made to work" is a massive overstatement. It applies to specific criteria (ordinal rankings, 3+ options, etc.). Most real-world systems don't meet all the strict criteria or find workarounds.
