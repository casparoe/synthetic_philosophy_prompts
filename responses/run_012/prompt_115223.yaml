      Consider a perfect correlation case: two agents are exact duplicates with identical information. If I cooperate, I know with certainty the other cooperates. The payoff matrix transforms; mutual cooperation dominates mutual defection. EDT dictates cooperating because $P(They Cooperate | I Cooperate) = 1$.
      Now consider probable correlation: agents are not duplicates but share similar evolutionary pressures or logical constraints. Here, $P(They Cooperate | I Cooperate)$ is high but less than one. If the benefit to the other is sufficiently large compared to my cost, the expected utility of cooperation exceeds defection. The agent isn't causing the distant action; they are selecting which logical branch they inhabit. Ignoring this evidence ignores the structure of reality. To defect is to hope one is an exception to the logical rule governing similar minds, which is epistemically arrogant. Rationality demands acting on the best available predictors of outcomes, and one's own decision is often the best predictor of similar agents' decisions.

