  The dispute concerns whether rational agents should cooperate when causally isolated but logically correlated. In a vast universe, an agent may face a choice where sacrificing personal gain benefits a distant counterpart. Causal Decision Theory insists that because no signal can bridge the gap, sacrifice is irrational wastefulness. Evidential Decision Theory counters that actions provide news about the state of the world, including the actions of similar agents. If my choice correlates with theirs, cooperating yields better expected outcomes. The core tension lies between causal efficacy and evidential relevance. Is treating correlation as a basis for action a sophisticated recognition of logical structure, or is it magical thinking that confuses symptoms with causes? This essay adjudicates whether such cooperation is required, permitted, or forbidden, navigating the complexities of uncertainty regarding the nature of the counterpart. The stakes are high: if evidential cooperation is valid, rational agents in a large universe should act to benefit countless others they cannot touch. If it is invalid, such agents are merely indulging in delusions of grandeur.

  Proponents of evidential cooperation argue that rationality is fundamentally about maximizing expected utility given available information. In a large world, the universe likely contains many instances of similar decision-making algorithms. When an agent deliberates, they are effectively executing a computation. If a distant agent runs the same computation, their output will match mine. Therefore, my decision is not an isolated event but a sample from a class of events distributed across spacetime. Choosing to cooperate provides strong evidence that the algorithm outputs cooperate across the universe. This is not merely statistical; it is logical. If the decision process is deterministic, the output is fixed by the inputs and the algorithm.
  Consider the case of perfect correlation: two agents are exact duplicates with identical information and source code. If I cooperate, I know with certainty the other cooperates. The payoff matrix transforms; mutual cooperation dominates mutual defection. EDT dictates cooperating because the conditional probability of their cooperation given mine is one. The agent isn't causing the distant action; they are selecting which logical branch they inhabit. To defect is to select the branch where both defect. This reasoning extends to the large world scenario. Even if the agents are not in the same room, if they are computationally identical, their decisions are linked by logical necessity.
  Now consider probable correlation: agents are not duplicates but share similar evolutionary pressures or logical constraints. Here, the probability is high but less than one. If the benefit to the other is sufficiently large compared to my cost, the expected utility of cooperation exceeds defection. In a large world, even a tiny probability of correlation can justify sacrifice if the number of correlated agents is vast. Ignoring this evidence ignores the structure of reality. To defect is to hope one is an exception to the logical rule governing similar minds, which is epistemically arrogant. Rationality demands acting on the best available predictors of outcomes, and one's own decision is often the best predictor of similar agents' decisions. The logical connection functions as a conduit for utility maximization even without causal pipes. The agent recognizes that their choice is a testament to the algorithm's nature, and thus influences the expected utility of the ensemble. By cooperating, they align themselves with the cooperative cluster of agents, securing higher aggregate utility. The evidential link is robust because it relies on the immutability of logical truths rather than the fragility of causal signals.

  Critics argue this reasoning collapses into superstition. Causal Decision Theory maintains that rationality requires influencing outcomes, not merely predicting them. In the causally isolated scenario, my action cannot change the distant agent's choice; the die is already cast by prior causes or logical necessity. Treating my choice as influential is akin to voodoo magic—believing that stabbing a doll affects a person because of a correlation, not a mechanism. The past and distant places are fixed; my will cannot reach them. Rational agents should only care about what they can change.
  The uncertainty complication strengthens this objection. If I am unsure whether the other is a duplicate, a simulation, or merely a convergent reasoner, the evidential link is fragile. If they have different evidence, our decisions may diverge despite similar algorithms. Furthermore, if I know my own decision, the correlation is screened off. Once I decide to cooperate, learning that I cooperated adds no new information about the other agent beyond what I already deduced from our shared algorithm. The tickle of my own intention renders the evidential update redundant. I already know what I will do; does that tell me what they will do? Only if the correlation is causal or logically necessary, which is disputed.
  There is also the risk of exploitation. A CDT agent knows the EDT agent will cooperate to secure the correlation. The CDT agent can defect, securing the benefit without the cost, knowing their defection won't causally alter the EDT agent's choice. In one-off interactions, the magic cooperators lose resources to the realistic defectors. Rationality should protect agents from being money-pumped or exploited, not encourage sacrificial lambs based on spurious statistical links that lack causal power. If the correlation is merely probable, betting on it is gambling, not reasoning. The agent risks real loss for hypothetical gain based on a link they cannot verify. The critic insists that without a causal channel, the correlation is merely a common cause effect, and my action is just another symptom, not a lever.

  The verdict is that evidential cooperation is **rationally permitted**, and in cases of high confidence, **required**. The distinction hinges on the strength of the logical correlation and the agent's uncertainty. In the perfect correlation case (exact duplicates), cooperation is rationally required. To defect is to ignore a certainty that your action predicts a mutually beneficial outcome. The logical connection is as robust as a causal one because the decision is a logical fact, not just a physical event. The utility calculus is clear: cooperate to secure the twin's cooperation. Defecting guarantees a worse outcome for the algorithmic class.
  However, the prompt introduces uncertainty: agents don't know if evidence is shared. This lowers the correlation probability. In this probable correlation case, cooperation becomes permitted but not strictly required. If the probability of correlation is low, the evidential weight is insufficient to outweigh the personal cost. Yet, if the potential benefit to the distant agent is astronomical (as in large worlds), even a small probability of correlation can justify sacrifice. The expected value calculation depends on the product of correlation probability, number of agents, and benefit size.
  Therefore, it is not irrational magical thinking. It is a bet on logical structure. However, because the agent lacks certainty about the other's evidence base, the strict obligation dissolves into permission. One is not foolish for cooperating, provided the estimated correlation times the benefit exceeds the cost. But one is not necessarily irrational for defecting if the uncertainty regarding shared evidence is too high. Rationality allows for caution when the logical links are opaque. Thus, while not always mandated, evidential cooperation is a valid rational strategy in large worlds. It respects the evidential weight without demanding impossible certainty. The agent is permitted to act on the hope of logical kinship.

