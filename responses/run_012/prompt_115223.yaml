      The uncertainty complication strengthens this objection. If I am unsure whether the other is a duplicate, a simulation, or merely a convergent reasoner, the evidential link is fragile. If they have different evidence, our decisions may diverge despite similar algorithms. Furthermore, if I know my own decision, the correlation is screened off. Once I decide to cooperate, learning that I cooperated adds no new information about the other agent beyond what I already deduced from our shared algorithm.
