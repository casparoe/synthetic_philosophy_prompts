  2.  **Deconstruct the Positions:**
      *   **Institutionalist:** Colonial legal/property rights $\rightarrow$ Economic Development. Institutions are the *fundamental* cause. Geography matters, but only insofar as it shaped institutions (e.g., disease killed settlers, leading to extractive vs. settler institutions).
      *   **Geographer:** Climate, soil, disease, access $\rightarrow$ Economic Development. Institutions are often *endogenous* to geography (you can't have secure property rights in a malaria zone or a landlocked area). Geography is the *fundamental* cause.
