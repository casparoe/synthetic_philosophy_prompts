answer: |-
  Here is the mediation document. I have stripped away the rhetoric to isolate the causal structures you are actually arguing about.

  ### Part 1: Shared Premises
  *Claims both camps can sign without losing face. These establish the methodological floor.*

  1.  **Non-Tautological Definitions:** "Institutions" must be defined as codified rules, enforcement mechanisms, and organizational structures (e.g., property registries, court independence, tax capacity) *independent* of economic outcomes. We cannot define "good institutions" as "those that produce growth."
  2.  **Geography is Not Destiny, But It Is a Constraint:** Both sides agree that physical geography (latitude, disease ecology, soil quality, coast access) exerts a *direct* effect on agricultural productivity and human health, regardless of the legal system.
  3.  **Institutions Are Not Exogenous:** Both sides agree that institutions are not chosen from a vacuum. They emerge from historical contexts that include geographic constraints, power asymmetries, and technological limitations.
  4.  **The Limits of Historical IV:** Both sides agree that historical instrumental variables (like settler mortality) are imperfect. They rely on the "exclusion restriction" (the instrument affects the outcome *only* through the proposed channel), which is untestable and always vulnerable to omitted variable bias.
  5.  **Persistence is Not Permanence:** Both sides agree that while colonial arrangements show high persistence, they are not immutable. Post-colonial policy changes can alter trajectories, though the "cost" of change may vary by context.
  6.  **Measurement Error:** Both sides agree that historical data on both institutions (e.g., protection against expropriation) and geography (e.g., historical disease burden) contain significant measurement error, which biases estimates.

  ### Part 2: The Table of Genuine Disagreements
  *Where the causal weights differ. Phrased so each side recognizes their own position.*

  | Feature of Disagreement | The Institutionalist Position | The Geographer Position |
  | :--- | :--- | :--- |
  | **The Binding Constraint** | In the modern era, bad geography can be overcome by good institutions (e.g., trade, medicine, irrigation). Institutions are the *fundamental* cause of income differences. | Institutions are often *endogenous* to geography. You cannot sustain "good" property rights or state capacity in ecologies that prevent surplus generation or kill skilled labor. Geography is the *fundamental* cause. |
  | **The Settler Mortality Channel** | European mortality rates shaped *settlement patterns* (extractive vs. settler colonies), which determined institutional quality. Mortality does not affect current GDP directly, only through this institutional legacy. | European mortality rates are a proxy for *current* disease burden and labor productivity. The effect on GDP is largely direct (health/workforce), not just through colonial legal structures. The exclusion restriction fails. |
  | **Policy Malleability** | Transplanting or reforming institutions (e.g., rule of law, property rights) is the primary lever for development, even in difficult geographies. | Institutional transplants often fail because they ignore local ecological constraints. Development requires adapting to geography, not just copying legal codes. |
  | **The "Reversal of Fortune"** | The fact that rich 1500-era societies are poor today proves institutions (colonial extraction) matter more than geography (which hasn't changed). | The reversal is explained by the *type* of colonization triggered by density/geography. High-density areas got extractive institutions *because* they were suitable for exploitation, not just by chance. |

  ### Part 3: The Cruxes and The Tests
  *Here we pin down the specific evidence that settles the debate. I have incorporated your border test here.*

  #### Crux 1: The Exclusion Restriction (Settler Mortality)
  *Does the instrument isolate institutions, or is it just relabeling disease ecology?*

  *   **Agreed Evidence:** Historical data on European soldier/settler death rates in colonies; current GDP per capita; current measures of institutional quality.
  *   **Institutionalist Prediction:** Once you control for institutions, the statistical significance of settler mortality on current GDP drops to near zero. The path is Mortality $\rightarrow$ Institutions $\rightarrow$ GDP.
  *   **Geographer Prediction:** Even controlling for current institutional measures, settler mortality (or current disease ecology) retains significant explanatory power over GDP. The path is Mortality/Ecology $\rightarrow$ GDP (directly) + Institutions.
  *   **Concession Condition:**
      *   *Institutionalist:* If mortality predicts GDP strongly in a sample where institutions are held constant (e.g., within the same colonial legal family), I must admit geography has a direct channel I ignored.
      *   *Geographer:* If mortality has *no* predictive power on GDP once institutional quality is accounted for, I must admit the institutional channel is the dominant transmission mechanism.

  #### Crux 2: The Border Test (Your Design)
  *This isolates the "Institution" variable from the "Geography" variable.*

  *   **Case A: The Split Town.** Two towns separated by a colonial border (different legal systems) but sharing identical soil, climate, and disease ecology.
  *   **Case B: The Ecological Pair.** Two towns under the same colonial legal system but situated in vastly different ecological zones (e.g., coastal temperate vs. inland tropical).

  | Side | Prediction for Case A (Split Town) | Prediction for Case B (Eco Pair) | What Makes You Give Ground? |
  | :--- | :--- | :--- | :--- |
  | **Institutionalist** | **Large Divergence.** Despite identical geography, the town with "extractive" legal origins will be significantly poorer than the town with "settler/property-protecting" origins. | **Convergence (or Minor Gap).** Shared legal frameworks allow the disadvantaged ecology to catch up via trade/tech, or at least the gap will be smaller than in Case A. | If Case A towns show **no significant income difference** after 100+ years, institutions are not the fundamental cause. |
  | **Geographer** | **Convergence (or Minor Gap).** Shared ecology drives similar economic ceilings. Legal differences are superficial or adapt to the local ecological reality, minimizing the gap. | **Large Divergence.** The town in the favorable ecology (coast/temperate) will be significantly richer, regardless of sharing the same legal code as the inland/tropical town. | If Case A towns show **large, persistent income differences**, geography is not destiny and institutions can override ecological constraints. |

  #### Crux 3: The Mechanism of Persistence
  *Why do institutions stick?*

  *   **Agreed Evidence:** Post-independence reform attempts, constitutional changes, land tenure reforms.
  *   **Institutionalist Prediction:** Persistence is due to *political equilibrium* (elites benefitting from extractive rules block change). Change is possible if political coalitions shift.
  *   **Geographer Prediction:** Persistence is due to *structural constraints* (the geography makes "good" institutions too expensive to enforce or sustain). Change fails because the underlying ecology reverts the system.
  *   **Concession Condition:**
      *   *Institutionalist:* If reforms consistently fail *only* in specific ecological zones regardless of political will, I must admit geography limits institutional viability.
      *   *Geographer:* If reforms succeed in difficult ecologies when political incentives align, I must admit geography is not a hard constraint.

  ### Part 4: Semantic Clarifications
  *Where you are fighting about words rather than the world.*

  **1. The Definition of "Institutions"**
  *   **The Fight:** The Institutionalist often bundles "state capacity" (roads, schools, bureaucracy) into "institutions." The Geographer argues state capacity is a function of surplus extraction, which is a function of geography.
  *   **The Resolution:** Agree to separate **Rules** (property rights, contracts) from **Capacity** (ability to enforce). Geography may limit Capacity directly, while Rules may be more malleable. If the Institutionalist means "Capacity," the Geographer wins on the direct link. If they mean "Rules," the test is open.

  **2. "Fundamental Cause"**
  *   **The Fight:** Both sides want to claim the title of "Fundamental."
  *   **The Resolution:** Abandon the hierarchy. It is a **feedback loop**.
      *   *Geography* sets the initial costs of state formation.
      *   *Institutions* determine how the surplus from that geography is invested (consumption vs. technology).
      *   *Technology* (an institutional output) can later mitigate *Geography* (e.g., air conditioning, malaria nets).
      *   **Agreement:** Geography is fundamental *historically*; Institutions are fundamental *proximately*. The debate is about which lever is more effective *today*.

  **3. "Relabeling" the Instrument**
  *   **The Fight:** The Geographer says Settler Mortality is just "Disease." The Institutionalist says it's "Settlement Strategy."
  *   **The Resolution:** It is likely **both**. High mortality prevented settlement (Institutional channel) *and* indicates high current disease burden (Geographic channel). The dispute is quantitative: What is the % split?
      *   *Institutionalist claim:* 80% Institutional channel, 20% Direct.
      *   *Geographer claim:* 20% Institutional channel, 80% Direct.
      *   **The Test:** Your border test (Case A) is the only way to break this. If mortality was the same on both sides of the border (same ecology), but institutions differ, and income differs, the Institutional channel gets the points.

  ### Final Note to the Group
  You are stuck because you are treating this as a binary choice: *Either* Institutions *Or* Geography. The social science reality is almost certainly interaction effects.

  The Institutionalist needs to admit that you cannot build a Swiss banking system in a malaria swamp without first addressing the swamp. The Geographer needs to admit that Singapore and Hong Kong exist—places with terrible natural endowments (no hinterland, tropical disease) that became rich purely through institutional design and trade.

  Sign the joint statement. Run the Border Test. Stop arguing about the 17th century and argue about the coefficient on your regression.
