      *   *Claim 2:* "Institutions" must be defined independently of outcomes (rules of the game, not GDP).
      *   *Claim 3:* Geography affects productivity directly (agriculture, health).
      *   *Claim 4:* History is contingent; no single factor explains everything.
      *   *Claim 5:* The settler mortality instrument is imperfect (measurement error, exclusion restriction doubts).

  4.  **Drafting Section 2: Genuine Disagreements (The Table):**
