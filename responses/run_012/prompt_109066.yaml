      *   *Issue:* The Instrument. Inst: Mortality affects settlement, which affects institutions, which affects income (exclusion restriction holds). Geo: Mortality affects income directly through health/labor productivity (exclusion restriction fails).

  5.  **Drafting Section 3 & 4: The Cruxes and Tests:**
