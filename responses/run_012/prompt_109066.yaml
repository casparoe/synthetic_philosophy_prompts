          *   Geographer: Case A shows small/no gap (ecology dominates). Case B shows big income gap.
      *   *Concession Criteria:* What would make them change their minds?
          *   Inst: If border towns with different rules have same GDP, institutions aren't fundamental.
          *   Geo: If border towns with same ecology have vastly different GDP, geography isn't destiny.

  6.  **Refining the Semantics (The "Words" part):**
