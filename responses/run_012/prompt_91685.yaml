      *   *Interpretation 2: Relative Cost (Differential Cost).* The cost must be higher for a "faker" (low quality) than for the "real deal" (high quality). This is the actual Handicap Principle.
          *   Critique: This is the scientifically robust version.
      *   *Interpretation 3: Sunk Cost / Risk.* The signal involves risk of loss, not just expenditure.
          *   Critique: Nuanced version of #2.
      *   *Interpretation 4: Indexical Signals (Non-Costly).* Some signals are physically tied to the trait (e.g., roaring frequency indicates size).
