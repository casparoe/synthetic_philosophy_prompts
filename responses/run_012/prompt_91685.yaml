      *   *Peacock:* Classic Handicap Principle.
          *   Counter: Accurate biology, but doesn't apply to everything.
      *   *Friend's Climate Post:* Adam says posting is free.
          *   Counter: It costs time, social capital, risk of backlash. Also, is it a signal of *wealth* or *belief*? If it's belief, consistency over time is the cost, not the single post.

  6.  **Addressing the "Impossible to Fake" Question (Indexical Signals):**
      *   User asks about body size/voice depth.
      *   These are *Indexical Signals* (or "Unfakeable Signals").
      *   They do not rely on cost; they rely on physical constraints.
      *   This breaks Adam's slogan if he says cost is *necessary*. It shows cost is only *one way* to ensure honesty.

  7.  **Drafting the Response (Iterative refinement):**

