  4.  **Developing the Verdicts:**

      *   *Reading A (Absolute Net Loss):* "You must lose resources to signal."
          *   Verdict: False. Investing isn't losing.
      *   *Reading B (Differential Cost / Handicap):* "It must cost *less* for the truthful signaller than the liar."
          *   Verdict: Interesting/Defensible (This is the actual science).
      *   *Reading C (Risk of Punishment):* "You must risk social/physical backlash."
