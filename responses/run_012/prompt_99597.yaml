      *   *Claim 6:* "And anyway, these systems are trained to imitate human text, so they can't have knowledge that isn't already in the corpus."
          *   *Expert View:* Models generalize. They can infer facts not explicitly stated in the corpus (e.g., arithmetic, novel combinations of facts). They build world models, not just text memorizers.
          *   *Verdict:* Wrong. Misunderstands generalization and world modeling.

      *   *Claim 7:* "So the research program is either trivial (prompt engineering) or incoherent (looking for a ghost in the statistical machine)."
          *   *Expert View:* The research program is neither. It's about mapping internal representations to truth conditions to prevent deception.
