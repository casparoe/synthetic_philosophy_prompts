      *   *Claim 2:* "The only interesting case would be a model that knows something but can't say it. But knowing is just a disposition to say or act, so if it can't say it under any prompt, there's no fact of the matter about whether it knows it."
          *   *Expert View:* This is a behaviorist definition of knowledge. In AI safety, "knowledge" often refers to internal representational states that predict world states, regardless of the output policy. The "can't say it" might be due to RLHF (Reinforcement Learning from Human Feedback) suppressing the output, not lack of internal representation.
          *   *Verdict:* Wince. Conflates *representation* with *policy*. This is the core philosophical disagreement.

      *   *Claim 3:* "What people call latent knowledge is either a jailbreak or a Rorschach test."
          *   *Expert View:* Jailbreaks bypass safety filters, revealing training data. Latent knowledge elicitation aims to find internal truth-tracking features, not just bypass filters. Calling it a Rorschach test dismisses the mathematical structure of activation spaces.
          *   *Verdict:* Wince. Overly dismissive.

      *   *Claim 4:* "The two-door test... If it walks through the true door, it already told you; if it walks through the false door, it's lying or confused; if it refuses to walk, there's no belief to find."
          *   *Expert View:* This assumes the output mechanism is honest. If the model is trained to be helpful/harmless (RLHF), it might *know* the true door but be policy-constrained to choose the "safe" or "expected" door. The test assumes output = belief.
          *   *Verdict:* Wrong. Fails to account for deceptive alignment or output suppression.

      *   *Claim 5:* "Probing the activations is worse, because a linear probe can decode almost anything from a big enough network, and a decoded direction is just a residue of the training data, not something the model believes."
