answer: |-
  Here are ten questions designed to tighten the screws on the "absorptive-goods" argument, specifically targeting the "maximizing saint" deflection and the normative stakes of the claim. Each includes a follow-up keyed to the evasion you anticipate.

  **1. The Source of Fungibility**
  You argue that the moral saint treats every activity as fungible because they are disposed to weigh it against moral alternatives. But where does that disposition come from? Is it built into the very concept of being morally good, or is it specific to a maximizing framework like utilitarianism? If I'm a saint who believes morality sets a threshold of "enough" rather than a ceiling of "most," do I still lose the capacity for absorption?

  *   **Follow-up (If she pivots to maximizing):** "If the argument only works against a maximizing saint, then isn't this actually a critique of consequentialism rather than sainthood? Because if I can be a saint by doing *enough* good, I can presumably be absorbed in my friendship the rest of the time without moral regret. So what work is the concept of 'sainthood' doing here, as opposed to just 'maximizer'?"

  **2. The Non-Maximizing Saint**
  Let's press that distinction. You've said in past talks that this isn't about the maximizing saint, but about the structural fungibility of moral reasons. But if I'm not trying to maximize, why would I renegotiate my friendship every time a better moral option appears? What forces the non-maximizing saint to treat their commitments as tradable assets?

  *   **Follow-up (If she claims moral reasons are always overriding):** "If moral reasons are always overriding, even below the threshold of maximization, doesn't that just smuggle maximizing back in? You're saying I must always take the *best* moral option available, even if it's not the *absolute* best possible. That sounds like local maximizing. How is that distinct enough to save the argument from being just about utilitarianism?"

  **3. Absorptive Moral Goods**
  Your argument hinges on the saint being unable to possess absorptive goods like friendship or craft. But what about absorption in morality itself? There are people genuinely lost in the cause of justice, or consumed by care for others' flourishing. If the saint is absorbed in *doing good*, don't they satisfy your own condition for having a meaningful life?

  *   **Follow-up (If she says moral absorption isn't the *right kind* of good):** "Why not? You say a life needs absorptive goods to have a point. If the saint finds their point in moral absorption, on what grounds do you say that life is empty? Is this a substantive claim about human psychology—that we *can't* be happy that way—or a philosophical claim that morality *shouldn't* be that kind of good?"

  **4. The Corruption of Motivation**
  You suggest that valuing a friendship for its moral value undermines the friendship. But suppose the saint values the friendship *both* for itself and because it's good. Does the presence of the moral reason necessarily crowd out the personal reason? Or is your worry that the moral reason becomes the *dominant* description of the activity?

  *   **Follow-up (If she says the moral description makes it instrumental):** "If I help my friend because I love them, and I also believe loving them is good, why does the second belief turn the first into a calculation? Isn't it possible to see the moral value as a *feature* of the friendship rather than a *competitor* to it? At what point does acknowledging the goodness of an act destroy the act?"

  **5. Prudential vs. Moral Complaint**
  When you say a life stripped of absorptive goods has "nothing left for morality to be about," whose loss is this? Is it that the saint's life goes worse *for the saint* (a prudential claim), or that morality fails to perform its function (a conceptual claim)?

  *   **Follow-up (If she says it's both/they are linked):** "If they are linked, which one is doing the heavy lifting? Because if the saint is perfectly happy being a moral zealot, your prudential claim fails. If morality is still 'morality' even if it makes the agent miserable, your conceptual claim fails. Which one are you willing to sacrifice to save the argument?"

  **6. The Nature of the Defect**
  I want to pin down the tone of the objection. Is your argument that the moral saint is living a life that is *morally* deficient? Or is it that the saint's life is aesthetically or personally flat, and we're just using moral language to describe a preference for a more colorful existence?

  *   **Follow-up (If she insists it's a moral contradiction):** "If it's a moral contradiction, then being a saint is morally wrong. That's a radical conclusion. Are you really prepared to say that the person who sacrifices all personal goods for the moral good is making a *moral error*? Or is this actually a plea to lower the demands of morality to fit our psychological needs?"

  **7. The Normative Upshot**
  Let's talk about what we're supposed to do with this. If the absorptive-goods argument holds, what is the takeaway? Should we reject sainthood as an ideal, or should we revise our understanding of what absorptive goods are? Are you telling us to be less good, or to understand goodness differently?

  *   **Follow-up (If she says we should understand goodness differently):** "If we understand goodness differently—say, as compatible with deep absorption—then the 'self-undermining' problem disappears, right? Because then the saint *can* have the goods. So is your argument actually a prescription for how to redefine sainthood so it doesn't trigger the paradox you've identified?"

  **8. The Threshold of Commitment**
  You argue that absorption requires a willingness to not renegotiate. But in real friendships, we *do* renegotiate. If my friend asks me to help them move, but I have to save a drowning child, I leave the move. I've treated the commitment as fungible. Does every moral interruption destroy absorption, or only a *disposition* to interrupt?

  *   **Follow-up (If she says it's the disposition to weigh):** "But we all have that disposition. Even the non-saint weighs moral alternatives in emergencies. So is the saint just someone who weighs them *more often*? If it's a matter of degree, then sainthood isn't self-undermining, it's just a matter of degree of absorption. Where is the bright line where the good life snaps?"

  **9. Redescription Immunity**
  Imagine a person who claims to be a moral saint but also claims to be deeply absorbed in their spouse. They say they never weigh alternatives when they are together. Do you say this person is lying about their sainthood, or lying about their absorption? How do you adjudicate that from the outside?

  *   **Follow-up (If she says they aren't a true saint):** "This feels like a no-true-Scotsman defense. If anyone who claims to have absorptive goods is by definition not a saint, then the argument is tautological. You've defined sainthood as 'that which precludes absorption.' Can you give me a criterion for sainthood that doesn't build the conclusion into the premise?"

  **10. Falsification Conditions**
  Finally, what would count against this? If I showed you a historical figure widely considered a saint—someone like Schweitzer or Day—who by all accounts experienced deep absorption in craft or love, would that falsify your claim? Or would you argue that we just don't see the internal fungibility weighing they were doing?

  *   **Follow-up (If she says we can't see the internal weighing):** "If the key mechanism is an internal disposition to weigh options, and that disposition is invisible to observation, how is this different from a claim of faith? If no behavior can prove the saint *isn't* weighing, and no testimony can prove they *are*, what empirical or conceptual evidence could possibly change your mind?"
