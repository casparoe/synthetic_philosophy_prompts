prompt: |-
  Next month I present at a two-day workshop on value and personal relationships, and I need a Q&A prep sheet. My thesis: the two goods Moore crowns at the end of Principia Ethica — the enjoyment of beautiful objects and the pleasures of human intercourse — are not on all fours, and the value internalism he states there (the claim that the only things intrinsically good are certain states of consciousness) can carry the first but not the second. What makes a friendship good seems to depend on the actual existence and actual character of the other person, and on the good's being hers as much as mine; Moore's doctrine of organic unities lets him obscure that gap without closing it. I claim this unresolved pressure, rather than mere fashion, is why the friendship literature still divides between internalist accounts (the good lies in the experience of relating) and relational ones (the good depends on facts about the relationship itself).

  The audience: mostly contemporary value theorists who work on friendship and love and treat the history as a distraction; two senior historians of early analytic philosophy who know Principia Ethica closely and will defend Moore's consistency; one consequentialist who will ask what turns on my being right; and one philosopher who holds the unfashionable view that friendship is not valued for reasons at all.

  Draft the sheet: the objections I will actually get, ordered by how much damage they do, each phrased the way that person would phrase it, with a two-minute reply and a note on where the reply is soft; what I should concede up front; and the question I am hoping nobody asks. No citations needed — I know the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** G.E. Moore's *Principia Ethica* (specifically the ending on beautiful objects vs. human intercourse), value internalism vs. relational accounts of friendship, organic unities.
      *   **Thesis:** Moore's two "crown jewels" of intrinsic good aren't equivalent. Internalism works for aesthetic appreciation but fails for friendship (which requires the *actual* other person). Moore uses "organic unities" to hide this gap. This tension explains the modern split between internalist and relational accounts of friendship value.
      *   **Audience:**
          1.  Contemporary value theorists (friendship/love focus, history = distraction).
          2.  Two senior historians of early analytic (know *PE* closely, defend Moore's consistency).
          3.  One consequentialist (asks "so what?").
          4.  One philosopher (friendship is arational/not valued for reasons).
      *   **Format:** Q&A prep sheet.
      *   **Requirements:** Objections ordered by damage potential, phrased in the speaker's voice, 2-minute reply, note on reply's soft spot, concessions to make up front, the "hope nobody asks" question. No citations.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Vulnerability 1 (Historians):* Moore explicitly defines intrinsic value as dependent *only* on intrinsic nature. If friendship requires external facts (the other person exists), is it still intrinsic? Did Moore actually claim friendship is intrinsic in the same way as aesthetic appreciation? Is "organic unity" being misused?
      *   *Vulnerability 2 (Contemporary Theorists):* If internalism fails for friendship, what replaces it? If the value is relational, does it become agent-relative in a problematic way? Does this collapse into partiality problems?
      *   *Vulnerability 3 (Consequentialist):* Why does this exegesis matter for normative ethics? If the outcome (promoting friendship) is the same, why care about the metaphysical grounding?
      *   *Vulnerability 4 (Arational Friend):* If friendship isn't about reasons/value, the whole internalist/relational debate is moot.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Historians - High Damage):* They know the text better. They will attack the reading of *Principia Ethica*. Moore defines "intrinsic" carefully. If you say friendship depends on external facts, you're saying it's not intrinsically good by Moore's lights. But Moore *says* it is. So either Moore is inconsistent (which they deny) or you are misreading "state of consciousness."
          *   *Phrasing:* Needs to sound pedantic but sharp. "Intrinsic nature," "isolation test."
          *   *Reply:* Distinguish between the *source* of value and the *constituents* of the organic unity.
          *   *Soft Spot:* Moore *does* emphasize the mental state.

      *   *Objection 2 (The Contemporary Theorists - Medium/High Damage):* They care about the modern debate. They will ask: "If you reject internalism, do you lose the ability to explain why bad friendships are bad? Or why we should cultivate them?"
          *   *Phrasing:* "Normative guidance," "phenomenology."
          *   *Reply:* Relational accounts explain betrayal better.
          *   *Soft Spot:* Explaining why we should *seek* friendship if the value isn't in the experience.

      *   *Objection 3 (The Consequentialist - Medium Damage):* "So what?"
          *   *Phrasing:* "Action-guiding," "maximization."
          *   *Reply:* It changes how we calculate trade-offs.
          *   *Soft Spot:* Might not actually change policy much.

      *   *Objection 4 (The Arationalist - Low/Medium Damage):* "Friendship isn't about value."
          *   *Phrasing:* "Arational," "commitment."
          *   *Reply:* Even if not chosen for reasons, it's evaluated by reasons.
          *   *Soft Spot:* Hard to refute if they stick to phenomenology.

  4.  **Ordering by Damage:**
      1.  The Historians (They can dismantle the textual basis).
      2.  The Contemporary Theorists (They can show the modern theory doesn't follow).
      3.  The Consequentialist (Can make the project seem irrelevant).
      4.  The Arationalist (Niche, but annoying).

  5.  **Refining the Replies:**
      *   Need to be concise (2 minutes spoken is approx. 250-300 words).
      *   Need to identify the "soft spot" honestly.
      *   Need to capture the *voice* of the objector.

  6.  **Concessions:**
      *   Admit Moore isn't explicitly distinguishing them as sharply as I am.
      *   Admit internalism captures *something* important about friendship (the feeling).

  7.  **The "Hope Nobody Asks" Question:**
      *   Something that exposes a gap in the "Organic Unity" defense. Maybe about the *death* of the friend. If the friend dies, does the value vanish retroactively? That kills the "state of consciousness" view hard.

  8.  **Review against Constraints:**
      *   No citations.
      *   Specific audience voices.
      *   Format: Objection, Reply, Soft Spot.
      *   Tone: Professional, strategic, slightly anxious but prepared.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I make the Historians sound too hostile? *Adjustment:* Make them precise, not angry. They want consistency.
      *   *Check:* Is the Consequentialist objection too easy? *Adjustment:* Make it about the *measurement* of value.
      *   *Check:* Is the "Hope Nobody Asks" question truly dangerous? *Adjustment:* Yes, the "retroactive annulment" problem is a classic killer for externalist/relational views grounded in past interactions.

  10. **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # Q&A PREP SHEET: Moore, Friendship, and the Internalist Gap

  **Thesis Recap:** Moore's two "greatest goods" (aesthetic appreciation & friendship) are structurally different. Internalism (value = state of consciousness) fits aesthetics but fails friendship (value = actual relation). Moore uses "organic unities" to paper over this. This explains the modern split between internalist and relational accounts of friendship value.

  ---

  ### 1. The Historians (Highest Damage Potential)
  **Who:** The two senior early-analytic scholars.
  **Voice:** Precise, textual, slightly pedantic. Concerned with consistency and definitions.
  **Objection:** "You claim Moore's internalism cannot carry the weight of friendship because friendship requires the *actual existence* of the other. But Moore defines 'intrinsic value' via the method of isolation. If the existence of the other person is an external fact, then by Moore's own definition, it cannot be a constituent of the *intrinsic* value. Are you accusing Moore of a blatant contradiction in Chapter 6, or are you redefining 'intrinsic' to suit your thesis? If it's an organic unity, the existence of the object is part of the whole being valued. You haven't shown a gap; you've just ignored his definition of the whole."

  **2-Minute Reply:**
  "I'm not accusing Moore of contradiction, but of a tension he masks with the doctrine of organic unities. When Moore isolates the 'whole' to be valued, he includes the cognitive state *and* its object. For aesthetics, the object's actual existence is arguably irrelevant to the value of the appreciation (a vivid hallucination of a sunset might hold similar personal value). But for friendship, the 'object' is another agent. If that agent is a philosophical zombie or a simulation, the value collapses in a way it doesn't for aesthetics. Moore treats these as parallel cases of 'consciousness plus object,' but the 'object' in friendship brings normative demands that the 'object' in aesthetics does not. My claim is that 'organic unity' is doing too much work here: it allows him to call friendship intrinsic while relying on extrinsic facts about the other's reciprocity. I'm arguing the internalist definition stretches until it snaps when applied to persons rather than things."

  **Soft Spot:** Moore *does* explicitly include the truth of the belief as part of the organic unity in some passages. If I concede that, the "gap" looks like a feature, not a bug.
  **Strategy:** Stand firm on the *kind* of object (person vs. thing) changing the logical structure of the value, not just the content.

  ### 2. The Contemporary Value Theorists (High Damage Potential)
  **Who:** The bulk of the room.
  **Voice:** Impatient with history, focused on normative implications and phenomenology.
  **Objection:** "Let's grant Moore fails. You say this explains the split between internalist and relational accounts in current literature. But if we go relational, we lose the ability to explain why a one-sided friendship is still *valuable* to the lover, or why we should cultivate friendships that don't yet exist. If the value depends on the actual other, doesn't friendship become purely agent-relative in a way that makes it impossible to recommend as a general good? You've solved an exegetical problem by creating a normative one."

  **2-Minute Reply:**
  "That's precisely the tension I'm highlighting. The internalist account survives in the literature because it *does* offer a reason to cultivate friendship: it produces good states of consciousness. The relational account survives because it captures the phenomenology of betrayal—if the friend was never real, you weren't just mistaken, you were wronged. My point isn't that we must choose one, but that the literature oscillates because Moore bequeathed us two incompatible models under one label. Acknowledging this split helps us see why 'friendship' functions as a placeholder for two different value structures. We don't need to solve the agent-relativity problem today; we just need to admit that 'the good of friendship' is ambiguous between 'the good of experiencing connection' and 'the good of being connected.'"

  **Soft Spot:** I haven't offered a solution, only a diagnosis. They might press for a resolution.
  **Strategy:** Emphasize that diagnosing the ambiguity *is* the philosophical progress.

  ### 3. The Consequentialist (Medium Damage Potential)
  **Who:** The one pragmatist.
  **Voice:** Blunt, focused on action-guidance and aggregation.
  **Objection:** "Okay, suppose you're right. Moore's metaphysics of value is messy. What turns on this? Does it change who we should help, how we should live, or how we calculate trade-offs? If the outcome is 'promote friendships,' I don't care if the value is in the head or in the relation. This looks like scholastic navel-gazing."

  **2-Minute Reply:**
  "It changes how we calculate trade-offs in hard cases. If the value is internalist, I can substitute a satisfying illusion of friendship for a real one if the experience is identical (the Experience Machine intuition). If the value is relational, the illusion is worthless. This matters for policy on care for the elderly, AI companions, or digital relationships. If Moore is right that these are the same kind of good, we should prioritize efficiency of experience. If I'm right that they are distinct, we must prioritize truth and reciprocity even at the cost of subjective satisfaction. So, it determines whether we view friendship as a commodity to be consumed or a status to be maintained."

  **Soft Spot:** In many everyday cases, the two recommendations converge.
  **Strategy:** Pivot to edge cases (AI, dementia, deception) where the divergence is stark.

  ### 4. The Arationalist (Low/Medium Damage Potential)
  **Who:** The philosopher who thinks friendship is beyond reasons.
  **Voice:** Quiet, slightly dismissive of "value theory."
  **Objection:** "You're both assuming friendship is valued *for* something. But isn't the point of friendship that it's not instrumental? By arguing over whether the value is internal or relational, you're turning a commitment into a calculation. Maybe Moore's messiness is just a symptom of trying to rationalize something that isn't reason-based."

  **2-Minute Reply:**
  "I agree friendship isn't purely instrumental. But even if we don't enter friendship *for* reasons, we evaluate it *by* reasons. We say a friendship is 'good' or 'bad,' 'healthy' or 'toxic.' My argument is about the structure of that evaluation. Whether you think the value is reason-based or not, you still have to account for why the death of a friend diminishes value in a way the loss of a painting does not. My thesis explains the structure of that evaluation, regardless of whether the motivation to befriend is arational."

  **Soft Spot:** If they double down that *evaluation* is also inappropriate, I have no leverage.
  **Strategy:** Frame it as accounting for the phenomenology of loss, which even they must acknowledge.

  ---

  ### Concessions to Make Up Front
  1.  **Moore's Intent:** Concede that Moore likely *thought* he was being consistent. I am arguing he failed, not that he knew he failed.
  2.  **Internalist Strength:** Concede that internalism captures the *motivation* for friendship better than relational accounts (we seek the feeling). My claim is only about the *constituents of the good*.
  3.  **Organic Unities:** Concede that Organic Unities is a powerful tool, but argue it is being used as a "get out of jail free" card for the externalist requirements of personal love.

  ---

  ### The Question I Hope Nobody Asks
  **"If the value of friendship depends on the actual existence and character of the other person, does the value of a past friendship vanish retroactively if you discover the friend was deceiving you the whole time? Or does the value persist in the past tense?"**

  **Why it's dangerous:**
  *   If I say **it vanishes**: It implies value is unstable and dependent on future information, which makes "promoting value" impossible (a disaster for any normative theory).
  *   If I say **it persists**: It concedes that the *experience* at the time was what held the value, which vindicates the Internalist view I'm trying to critique.
  *   **Prepared Deflection:** "This is the hardest problem for relational views. I'd argue the value of the *time spent* was real because the relationship was real *then*, but the narrative value of your life is updated. Moore doesn't have the resources to handle temporal indexing in organic unities." (This admits a gap but frames it as a general problem for the field, not just my reading).
