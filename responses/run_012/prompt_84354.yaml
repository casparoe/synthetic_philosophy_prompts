      *   **Section 5: Cuts and Additions.**
          *   *Cuts:* The critique of the prerogative could be tightened. The definition of the paradox is fine but could be sharper.
          *   *Additions:* Need a paragraph explicitly addressing the *source* of the disability (to pre-empt Strain 4). Need to distinguish "distributive authority" from "defensive rights" (to handle Strain 2).
