      *   **Draft Content:** A compressed argument defining the paradox of deontology, critiquing three standard replies (agent-relative reasons, practice-based rules, agent-centered prerogatives), proposing a "no-authorization/disability" reading, outlining where it works (transplant, consent, institutions), and listing four specific strains/problems (omissions, self-defense/button, is/ought slide, justification of disability).
      *   **Required Output Structure:**
          1.  Accuracy (characterization of positions/paradox).
          2.  The Central Move (does it dissolve or relocate?).
