          *   *Surviving Paradox:* The paradox re-emerges at the meta-level. Why is the disability there? If the answer is "to prevent worse outcomes," we are back to consequentialism. If the answer is "rights," we need to explain why rights function as disabilities rather than weighty reasons. The "Omission" problem is the biggest survivor of the paradox (why am I authorized to let die but not authorized to kill?).
          *   *Verdict:* It relocates the paradox rather than fully dissolving it. The core tension (why forbid minimizing violations?) becomes (why forbid authorizing the minimization?).

      *   **Section 3: The Four Strains.**
          *   *Ranking:*
              1.  *Justification of Disability (Strain 4):* This is the deepest metaphysical/normative problem. If you can't explain *why* the disability exists without appealing to the very consequences the constraint ignores, the theory collapses into the "practice" view you rejected.
              2.  *Omissions (Strain 1):* This is the classic doing/allowing distinction problem. If the disability is about "deciding who dies," letting five die is also deciding. This threatens to collapse the distinction between killing and letting die.
              3.  *Is/Ought Slide (Strain 3):* Conceptual confusion. Easily fixed by clarifying normative vs. descriptive.
              4.  *Self-Defense/Button (Strain 2):* Specific edge cases. Can likely be handled by distinguishing defensive rights from distributive authority.
          *   *Fatal?* Strain 4 is potentially fatal if not handled carefully. Strain 1 is fatal if it collapses the doing/allowing distinction entirely.

      *   **Section 4: Interest.**
          *   *Novelty:* The "disability/standing" language is not entirely new (Hohfeldian powers, jurisdictional accounts exist), but framing it specifically as a "no-authorization reading" to *dissolve* the paradox (rather than just explain constraints) is a fresh angle.
          *   *Decoration:* The critique of the prerogative is standard but well-put. The definition of the paradox is standard.
