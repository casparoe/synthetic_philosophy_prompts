  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mention any names? *Correction:* Ensure I say "the hybrid conception" instead of "Scheffler's view."
      *   *Check:* Did I address the "Is/Ought" slide clearly? *Correction:* Make sure to explain *why* it's a slide (descriptive lack of power vs. normative prohibition).
      *   *Check:* Is the ranking of strains logical? *Correction:* Yes, the justification problem undermines the whole theory, whereas omissions is a specific application problem. Actually, on second thought, the Omission problem is often the dealbreaker for deontology. I should rank Omissions high, perhaps highest, because if the disability applies to omissions, it becomes consequentialism (duty to save). If it doesn't, why not? The Justification problem is *theoretical*, the Omission problem is *practical*. I will rank Justification as #1 because it threatens the distinctiveness of the view, and Omissions as #2 because it threatens the coherence.
      *   *Wait, looking closer at Strain 4:* If the justification for the disability is "authorization is dangerous," that *is* the practice-based view. This is a structural threat. I'll keep it as #1.
      *   *Looking closer at Strain 1:* If the disability is "no standing to decide who dies," letting die is deciding. This collapses the doing/allowing distinction. This is also structural. I'll rank them close, but Justification is more fundamental to the *proposal's identity*.

  6.  **Final Polish:** Check against the prompt's specific formatting requirements (prose, headings, no citations).

