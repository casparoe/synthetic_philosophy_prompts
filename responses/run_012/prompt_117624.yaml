      *   **P (Sentience Probability):** Implies sentience is uncertain and can be treated as a scalar multiplier. This suggests a "Expected Moral Value" approach to uncertainty about moral status. It treats sentience as a continuous or probabilistic property, not a binary threshold (otherwise P would be 0 or 1).
      *   **D (Duration):** Welfare is temporally additive.
      *   **I (Intensity):** Welfare is cardinal and comparable across individuals/species (interpersonal/inter-species comparability).
      *   **S (Success Probability):** Empirical uncertainty is treated multiplicatively with moral uncertainty (P).
      *   **Vertebrate * 100:** Implies lexical or weighted prioritization based on taxonomy, not just sentience probability (since P already accounts for sentience likelihood/capacity). This suggests a discontinuity or a separate moral status weight unrelated to the P factor.
      *   **No Deliberate Harm:** A deontological constraint (side constraint) that overrides the consequentialist ranking.

