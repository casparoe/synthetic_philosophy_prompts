answer: |-
  The scoring sheet is not a neutral tool; it is a crystallized ethical theory. By reducing moral decision-making to a single product term ($N \times P \times D \times I \times S$), the board has committed to a specific metaphysics of value that privileges aggregation, cardinality, and risk neutrality. The multiplication operation itself is the strongest philosophical claim: it asserts that welfare units are fungible across time, individuals, and species, and that uncertainty about moral status (P) functions identically to empirical uncertainty (S). This treats sentience not as a threshold for entry into the moral community, but as a dimmer switch where partial moral status yields partial moral weight.

  The handling of $N$ reveals a commitment to the "Total View" in population ethics. Since interventions often change population size (preventing hatching, creating habitat), and these are scored positively, the formula assumes that bringing beings into existence (or preventing it) is morally equivalent to affecting existing beings. This implies that possible insects have moral standing proportional to their expected welfare. If the board held a "Person-Affecting View" (where only existing beings count), $N$ for population-changing interventions would be zero, and most grants would score null.

  The vertebrate multiplier introduces a tension. If $P$ and $I$ already capture sentience and suffering capacity, a separate taxonomic multiplier implies either that vertebrates possess a non-sentience-based moral status (rights, species membership) or that the $P/I$ rubric is empirically inaccurate. Given the lack of justification, this functions as an intuitionist override, breaking the internal logic of the sentience-based calculus.

  Finally, the "no deliberate harm" rule sits uneasily with the ranking system. The spreadsheet calculates Expected Value (EV) for all proposals, implying that a high-EV harm project is "good" mathematically but "bad" rule-wise. This is a hybrid view: consequentialist aggregation constrained by deontological side-constraints. It is consistent only if the constraint is lexical (veto power), but the practice of scoring them alongside permissible projects suggests the board hasn't fully integrated the veto into the valuation metric.

