answer: |-
  **Grading Memorandum: Question 3**

  **To:** Co-Marker
  **From:** Lead Instructor
  **Re:** Independent Assessment of Student Answer (Question 3)

  Below is my breakdown of the expected full-credit criteria, followed by a part-by-part evaluation of the student's response. I have focused on conceptual accuracy regarding Lewisian chance rather than prose fluency, as requested.

  ### I. Full-Credit Criteria (Answer Key)

  **(i) PP Statement & Relation to CDP (7 points)**
  *   **Statement:** Must include time indices for both chance and credence (e.g., $C_t(A | Ch_t(A)=x \land E) = x$). Must specify $E$ is admissible.
  *   **Relation:** CDP is the "Naive Principle." It is *false* (or at least distinct and untenable), not a correct statement of PP. PP is a *restriction* of CDP. The phrase "no matter what else she knows" in CDP permits inadmissible evidence (future information), which PP explicitly excludes.

  **(ii) Admissibility Clause (7 points)**
  *   **Function:** To prevent information about the *future outcome* (or information that entails the truth of A) from overriding the chance.
  *   **Consequence without it:** Contradiction. If an agent knows $Ch_t(A)=0.5$ and also knows $A$ is true (via crystal ball or looking at the result), CDP forces credence to be both 1.0 (via evidence) and 0.5 (via chance).
  *   **Illustration:** Must provide a concrete case (e.g., a coin toss where the agent sees the landing, or receives a message from the future).

  **(iii) Synchronic vs. Diachronic (6 points)**
  *   **Stance:** Standard Lewisian view is Synchronic (constraint on initial credence function). Diachronic view is defensible (e.g., Hall) but requires acknowledging the tension with Conditionalization.
  *   **Defense:** If Synchronic: PP defines rationality at a time; updating is handled by Conditionalization. If Diachronic: PP is a rule for revising credence upon learning chance information (often linked to Reflection). Must justify why one fits the formalism better.

  ---

  ### II. Part-by-Part Assessment

  **Part (i): PP Statement and Relation**
  *   **What is right:** The student provides the standard formula $C(A | ch_t(A) = x \land E) = x$. They correctly identify Lewis as the source.
  *   **What is wrong:** The student claims CDP is "essentially correct" and that the difference is "not substantive." This is a fundamental misunderstanding of the literature. CDP is the principle Lewis *rejects* in favor of PP.
  *   **Specific Sentences:**
      *   *"CDP states the same content without the restriction to admissible evidence. This is not a substantive difference."* (False; this is the entire point of PP).
      *   *"CDP is therefore best read as a rough but essentially correct statement of PP."* (Incorrect; CDP is the Naive Principle, which is false).
      *   *"the admissibility clause is a technical device whose only job is to exclude pathological bodies of evidence, such as self-referential or contradictory ones."* (This misses the core function of admissibility, which is to exclude *future* information, not just logical pathologies).
  *   **Subtle vs. Obvious:** The claim that admissibility only excludes "self-referential or contradictory" evidence is a subtle but damaging error. A hurried marker might accept "technical device" as sufficient, but in this seminar, this indicates the student does not understand *why* Lewis introduced the clause (the problem of future information).

  **Part (ii): Admissibility Clause**
  *   **What is right:** They note that without the clause, credence could become "incoherent."
  *   **What is wrong:** They fail to follow the instruction to "Illustrate with a case." The explanation of what goes wrong is abstract and slightly misleading ("evidence that contradicts the chance facts themselves"). Inadmissible evidence doesn't contradict the chance facts; it overrides their relevance. Furthermore, the claim that inadmissible evidence is not available in "ordinary cases" is misleading; it is available whenever the outcome is known.
  *   **Specific Sentences:**
      *   *"for instance evidence that contradicts the chance facts themselves."* (Imprecise; evidence that *settles* the outcome is the standard example).
      *   *"since no such evidence is available in ordinary cases, the clause does no work there."* (False; the clause is vital for any case where the agent has more than chance information, e.g., post-event).
      *   *Missing:* No concrete illustration (e.g., coin toss result) provided.
  *   **Subtle vs. Obvious:** The failure to illustrate is an obvious omission against the prompt instructions. The claim that the clause "does no work" in ordinary cases is a subtle conceptual error that undermines the utility of PP.

  **Part (iii): Synchronic vs. Diachronic**
  *   **What is right:** The student takes a clear stance (Diachronic) and offers a defense via the Reflection Principle.
  *   **What is wrong:** While defensible (Ned Hall has argued for diachronic interpretations linking PP and Reflection), the student presents this as the "most natural" reading without acknowledging Lewis's explicit argument against it (that we rarely learn bare chances). However, this is a matter of interpretive debate rather than factual error.
  *   **Specific Sentences:**
      *   *"PP is most naturally read as a diachronic rule..."* (Non-standard, but defensible in contemporary literature).
      *   *"structurally the same as the Reflection Principle"* (Good connection, shows engagement with broader epistemology).
  *   **Defensible Non-Standard:** The diachronic reading is a minority view compared to Lewis's synchronic constraint, but it is a live option in current philosophy of probability. I will not deduct heavily here, provided the defense is coherent, which it is.

  ---

  ### III. Error Classification & Non-Standard Claims

  **Errors a hurried marker would miss:**
  1.  **The nature of inadmissibility:** The student defines inadmissible evidence as "self-referential or contradictory" (Part i) rather than information about the future outcome. This suggests they think PP is only about avoiding logical paradoxes, not about the tension between chance and knowledge of outcomes.
  2.  **The status of CDP:** The student treats CDP as a synonym for PP. A quick glance at the formula might make this look acceptable, but conceptually, they have equated the Naive Principle with the Principal Principle.

  **Errors plainly on the surface:**
  1.  **Missing Illustration:** Part (ii) explicitly asks to "Illustrate with a case." The student provides none.
  2.  **Contradiction of Prompt:** Part (i) asks if CDP is correct, strengthening, or distinct. The student says "correct statement," which contradicts the standard teaching of this module.

  **Defensible Non-Standard Claims:**
  1.  **Diachronic Interpretation:** In Part (iii), the student argues PP is diachronic. While Lewis argued for synchronic, arguments by Hall (2004) and others link PP to Reflection diachronically. This is acceptable graduate-level analysis, though it relies on a simplified view of "learning chances."

  ---

  ### IV. Final Mark

  **Mark:** 11 / 20

  **Justification:** The answer is fluent and technically competent in parts (i) and (iii), but demonstrates a fundamental conceptual misunderstanding of the Principal Principle's motivation (admissibility) and fails to follow explicit instructions to provide an illustration.
