answer: |-
  **MEMORANDUM**

  **TO:** Environmental Facility Siting Board
  **FROM:** General Counsel's Office
  **DATE:** October 10, 2023
  **RE:** Decision Recommendation – Chemical Manufacturing Facility Permit

  **Recommendation**

  The General Counsel's Office recommends the Board **deny** the permit application.

  While the economic benefits are significant, the project fails the statutory requirement regarding health harms. Specifically, the applicant cannot mitigate substantial health risks to a identifiable class of future state residents. Approval would expose the Board to successful legal challenge and establish a precedent incompatible with the statute's protective purpose.

  **Analysis of Statutory Standard and Harm**

  The governing statute authorizes denial if the Board finds the project "will cause substantial harm to the health of persons residing in the state." The Chair's concern rests on the non-identity problem: for the majority of individuals residing in the three counties in 200 years, their existence is contingent on the economic activity generated by this plant. If we deny the permit, the social and economic reshaping of the region means those specific individuals are never born. Therefore, they are not "worse off" than they would have been in the denial scenario; they simply do not exist.

  Taken to its logical extreme, the Chair's reading suggests that no long-term hazard can ever constitute "harm" if the hazard timeline exceeds the turnover rate of the local population. We acknowledge this philosophical difficulty. However, relying on it to approve the permit is legally unsustainable for two reasons.

  First, the statute does not require harm to *all* persons, nor does it require that *every* affected person be identifiable today. It requires harm to "persons." The record indicates a subset of residents belongs to multigenerational families who will maintain descendants in the region regardless of the plant's construction. For these descendants, the comparison is not existence versus non-existence. It is health versus illness. They will reside in the state in 200 years irrespective of our decision. For this specific class of persons, the plant unequivocally causes substantial harm (kidney damage, cancers, shortened lifespans) compared to the baseline of denial. Because the statute is satisfied by harm to "persons" (plural, not universal), the existence of this group triggers the Board's authority to deny.

  Second, adopting the Chair's interpretation creates a regulatory loophole inconsistent with legislative intent. If the non-identity problem immunizes any project with a latency period longer than a generation, the Board is stripped of authority over permanent waste disposal, nuclear storage, or carbon sequestration projects. The Vice Chair is correct that the legislature did not intend to hand out a "get-out-of-jail-free card" based on demographic churn. The statute's purpose is to prevent substantial health harm resulting from facility siting. Where harm is certain for *any* cohort of future residents, the condition for denial is met.

  **Recommendation on Conditions**

  We considered recommending approval with conditions requiring a containment guarantee extending 300 years. However, our consultants have established that current technology cannot guarantee cap integrity beyond the 150-to-250-year window. Imposing a condition the applicant cannot meet is procedurally equivalent to denial but invites litigation regarding arbitrary standards. A direct denial based on the unmitigated harm to the multigenerational family cohort is the more defensible legal position.

  **Statutory Language and Legislative Feedback**

  This case highlights ambiguities in the current statute that will recur as we face more long-term hazard applications. We recommend the Board transmit the following observations to the legislature for future amendment:

  1.  **Definition of "Persons":** The statute should explicitly clarify whether "persons residing in the state" includes future generations whose identity is contingent on the project's economic activity. If the legislature intends the non-identity problem to bar regulation, it must say so. If it intends to protect future health regardless of identity contingency, the statute must define "harm" to include the imposition of health risks on future populations irrespective of whether those specific individuals would otherwise exist.
  2.  **Temporal Scope of "Will Cause":** The phrase "will cause" implies a degree of certainty that is difficult to apply to 200-year projections. The legislature should consider establishing a statutory presumption of harm for contaminants with half-lives or containment risks exceeding a specific threshold (e.g., 100 years), shifting the burden to the applicant to prove safety rather than requiring the Board to prove certainty of failure.
  3.  **Threshold of Harm:** Clarify whether harm to a subset of future residents is sufficient for denial, or if a majority threshold is required. Our current recommendation relies on the subset theory; legislative clarity would prevent future inconsistency.

  **Conclusion**

  The Chair's logical framework regarding the non-identity problem is philosophically sound for the newcomer population but legally insufficient to override the harm inflicted on existing familial lines. Because the project will cause substantial health harm to identifiable descendants of current residents, the statutory condition for denial is satisfied. Approving the permit based on the non-identity argument risks judicial reversal and undermines the Board's mandate to protect state residents from long-term environmental hazards.

  We recommend voting to deny.
