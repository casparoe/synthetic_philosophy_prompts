answer: |-
  Elena has lived next to Mark for twelve years, during which Mark has served as the secretary for their homeowners' association. Whenever Mark told Elena the outcome of a board vote, she verified his claim against the official minutes the following day because she was considering running for the board herself; in all sixty instances, Mark's report matched the minutes exactly. Yesterday, Mark told Elena that the board had voted to ban satellite dishes effective immediately. However, earlier that morning, Elena had glanced at a draft agenda posted on the community portal which listed satellite dishes as "under review" rather than banned, though she did not see the final approved minutes which are not available until tomorrow. She cannot contact the board president until the office reopens.

  ***

  1. **Belief, Evidence, and Relevant Facts**
     *   **Belief:** The proposition that the HOA has banned satellite dishes.
     *   **Total Evidence:** (1) Mark's testimony that the ban passed. (2) A non-testimonial inductive base: 60 prior claims verified against official minutes, all accurate. (3) Independent counter-evidence: A draft agenda suggesting the ban was merely "under review."
     *   **Epistemically Relevant Facts:** The inductive base is robust and non-circular (verified against documents, not other speakers). The counter-evidence is direct evidence against the truth of the proposition (rebutting) but is acknowledged to be preliminary (a draft). The truth of the proposition cannot be settled immediately by the hearer.

  2. **Verdicts and Theoretical Commitments**
     *   **Reductionist Verdict:** Elena is warranted in believing the ban is real.
         *   **Commitment:** *The Aggregative Principle.* Testimonial warrant is a function of the hearer's total inductive evidence regarding the speaker's reliability weighed against any counter-evidence. Since the probability of Mark's reliability (60/60) vastly outweighs the probability of the draft agenda being correct, the net epistemic weight supports belief.
     *   **Anti-Reductionist Verdict:** Elena is not warranted in believing the ban is real (she must suspend judgment).
         *   **Commitment:** *The No-Defeater Condition.* Testimonial warrant is a default entitlement that obtains *only if* there are no unrebutted defeaters. The draft agenda constitutes a rebutting defeater (evidence that $p$ is false). Once this defeater is present, the default entitlement is nullified. Because the Anti-Reductionist views testimony as a *basic* source, they cannot simply revert to inductive inference to restore warrant without conceding that testimony is not basic; thus, with the default blocked and no conclusive independent verification available, warrant fails.

  3. **The Single Feature and Sensitivity Analysis**
     *   **The Feature:** The presence of the *unrebutted but weak counter-evidence* (the draft agenda).
     *   **Removal:** If the draft agenda is removed, both theories yield belief (Reductionist via induction, Anti-Reductionist via default entitlement).
     *   **Strengthening:** If the counter-evidence is strengthened (e.g., the final minutes are available and contradict Mark), both theories yield disbelief.
     *   **The Swap:** There is a magnitude of counter-evidence where the theories swap verdicts. In the "middle zone" (weak counter-evidence, strong induction), the Reductionist believes (induction outweighs doubt) while the Anti-Reductionist withholds (doubt defeats default). If the counter-evidence becomes very strong, the Reductionist will also withhold. This shows that the Anti-Reductionist view has a lower threshold for *suspension* (any defeater kills the default) than the Reductionist view has for *rejection* (counter-evidence must outweigh inductive support).

  4. **Strongest Anti-Reductionist Reply and Cost**
     *   **Reply:** *Defeaters as Weights.* The Anti-Reductionist can argue that defeaters do not function as binary switches that nullify entitlement, but rather as negative weights that reduce the strength of the default entitlement. On this view, the strong inductive track record acts as a "defeater-defeater" or simply reinforces the default, allowing Elena to believe.
     *   **Cost:** This collapses the structural distinction between the two views. If defeaters and entitlements are merely weights to be balanced against inductive history, the Anti-Reductionist view becomes a version of Reductionism (specifically, a global reductionism where the "default" is just a heavy prior probability). It abandons the core Anti-Reductionist claim that testimony is a *sui generis* source of warrant distinct from induction.

  5. **Structural Asymmetry and Mirrored Case**
     *   **Asymmetry:** This case exposes a **real structural asymmetry**, not merely a difference in statement. Reductionism is fundamentally *aggregative* (all evidence goes into one scale), while Anti-Reductionism is *conditional* (entitlement exists unless a specific condition is violated). The asymmetry arises because a conditional structure is more vulnerable to "false negatives" (withholding belief when one should believe) in the presence of noise, whereas an aggregative structure is more vulnerable to "false positives" (believing when one should withhold) in the absence of data.
     *   **Mirrored Case:** In the standard case (no track record, no counter-evidence), the Anti-Reductionist is more credulous. This requires the **same mechanism running backwards**.
         *   *Standard Case:* Induction = 0, Defeater = 0.
         *   *Reductionist:* 0 Support = No Belief.
         *   *Anti-Reductionist:* Default Entitlement (uncancelled) = Belief.
         *   *Mechanism:* The Reductionist requires positive weight to believe; the Anti-Reductionist requires only the absence of negative weight. In the HOA case, the Reductionist has positive weight (induction) that survives negative weight (draft); the Anti-Reductionist has negative weight (draft) that cancels the positive status (default). It is the same structural difference (Aggregation vs. Conditionality) manifesting in opposite directions depending on whether the variable input is *support* (induction) or *interference* (defeaters).
