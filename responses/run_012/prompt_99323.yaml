prompt: |-
  Hey, so I'm in this grad seminar on bioethics and philosophy of medicine and we've been chewing on the therapy/enhancement distinction for weeks now — whether it's even a real line or just a bureacratic fiction we tell ourselves so insurers know what to pay for — and I have to write a case study for next week. I want to do it on He Jiankui and the CRISPR twins, that 2018 business in China where he edited the CCR5 gene in human embryos, announced it at a big genome-editing summit, claimed he was preventing HIV, and then got absolutely cooked by the entire scientific world and eventually prosecuted back home. My gut says the interesting thing is that basically everyone condemned him but almost nobody agreed on why, and a lot of the reasons people reached for weren't really about enhancement at all. But I keep tieing myself in knots trying to map the conceptual apparatus onto what he actually did, so I want your help thinking it through carefully rather than just summarizing the case.

  So take the role of a philosopher of medicine who knows the enhancement literature cold — the harmful-dysfunction and statistical-normality accounts of disease, the objection that on some views everything medicine does counts as enhancement and the distinction collapses, the reading of the line as tracking natural-versus-artificial rather than good-versus-bad, the way it gets weaponized in insurance coverage and anti-doping — and walk me through this as a two-way case analysis, not a verdict on He. First direction: what does the therapy/enhancement distinction say he was actually doing? Notice CCR5 editing can be framed as disease prevention, i.e. therapy, yet it confers a trait most people never have and that these embryos weren't obviously at risk of needing — so is it therapy, enhancement, or a case that shows the distinction can't separate them without smuggling in a baseline of statistical normality, and if so who gets to set that baseline and why? Does the case expose the distinction as a proxy for something else — risk, consent, coercion, the germline, playing God, distributive justice? Second direction: what does the case do to the distinction itself — confirm it's doing load-bearing work we'd be lost without, or show that all the actual objections (safety, consent of the unborn, the parents' possibly compromised consent, medical tourism and a race to the bottom) would survive even if the edit had been straightforwardly therapeutic, which would make the distinction a distraction here? Before you commit, brainstorm the candidate baselines and the candidate non-enhancement objections in a list, then pick the mapping you think is most honest, defend it, and be explicit about exactly where the distinction goes silent. Don't lean on any particular author's name — I don't need citations, I need the argument.
