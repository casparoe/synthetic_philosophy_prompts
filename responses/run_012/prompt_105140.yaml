      *   **Section 3: The Verdict:** Is the gap a failure of Econ or Biology? (It's mostly a failure of the verbal biology intuition vs. the precision of the math, but the math misses the evolutionary dynamics).
      *   **Conclusion:** A teaching tip for the seminar.

  8.  **Drafting Content - Specific Points to Hit:**
      *   *Single-Crossing Property (SCP):* This is the non-negotiable technical requirement. $ \frac{\partial^2 C}{\partial m \partial t} < 0 $. Cost of signal $m$ for type $t$.
      *   *Interests:* Signaling only matters if interests aren't perfectly aligned (otherwise cheap talk works).
      *   *Index vs. Handicap:* Index = physically constrained (cannot lie). Handicap = could lie, but won't because of incentives.
      *   *Viability vs. Utility:* Biology trades survival for mating. Econ trades money for goods. The "currency" conversion is tricky.
      *   *Zahavi's Mistake:* He thought absolute cost mattered. Grafen showed relative cost matters. A signal can be cheap for the high type and still be a handicap.

