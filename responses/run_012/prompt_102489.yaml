answer: |-
  You should reject the inference from premises (1)–(3) to conclusion (4) by insisting that only *just* cooperative schemes generate obligations of fair play, meaning unjust conventions create no binding force regardless of settledness.

  This argument is indeed the Principle of Fair Play (associated with Hart and Rawls) in miniature. It posits that receiving benefits from a cooperative scheme creates an obligation to follow its rules. The flaw lies in assuming that *any* settled pattern of behavior counts as a norm-generating cooperative scheme. Your colleague's premise (1) is descriptively accurate—bribery networks and sexist hierarchies are "cooperative" in the sense that participants coordinate expectations and bear costs—but it is normatively inert without a justice condition. Rawls explicitly restricts the Fair Play principle to *just* institutions; a scheme based on exploitation or corruption cannot generate moral obligations, even among participants, because the "benefits" are illicit and the "costs" are imposed unfairly.

  To keep premise (3) ("Imposing avoidable costs on others is *pro tanto* wrong") while rejecting (6), you must clarify what counts as a morally relevant "cost." If you keep (3) unqualified, you pay the price of admitting that refusing a bribe is *pro tanto* wrong because it frustrates the official's expectation of income, even though that wrongness is overwhelmingly outweighed by the duty to oppose corruption. A stronger position qualifies (3) to mean "Imposing avoidable costs on others' *legitimate* expectations is *pro tanto* wrong." This allows you to say the briber has no legitimate expectation, so no moral cost is imposed, and thus no *pro tanto* wrong occurs. Your colleague would have to concede that settledness alone lacks moral magic; a convention must be compatible with independent moral standards to bind. You concede that determining which conventions are "just" enough to bind visitors is complex and context-dependent, rather than a simple matter of geography.

  Regarding the visitor's status, there is a principled way to say a convention does not reach them rather than merely being outweighed. The binding force of a convention on a visitor depends on whether the convention is a **coordination norm** (solving a mutual benefit problem, like driving sides or pub rounds) or an **exploitation norm** (extracting value via power asymmetry, like bribery or deference). Visitors are "inside" coordination norms because participating in them is necessary for fair social interaction and imposes no moral injury. They are "adjacent" to exploitation norms because complying would make them complicit in injustice. Thus, the line is not drawn by borders (premise 5), but by the moral character of the practice: you are bound by local rules that facilitate cooperation, but never by local rules that mandate corruption or oppression.
