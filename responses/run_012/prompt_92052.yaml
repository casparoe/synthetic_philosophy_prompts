prompt: |-
  My friend Priya got really into effective altruism over the last year or so, and I'm trying to reverse-engineer her actual decision rule, because her calls look all over the place to me. For what it's worth I'm a backend dev, no philosophy training, so maybe I'm missing something obvious.

  Her takes so far:
  - Drop $200 on bed nets: do it, no question, best use of the money.
  - Go vegan: do it, though she's less confident about it.
  - Vote in the midterms: basically a wash, not worth stressing over.
  - Have a kid: go for it -- but she flat-out refuses to say whether it's net good or bad for the world, says nobody could know.
  - Donate to a charity that just hands cash to very poor people: do it.
  - Sign up for cryonics: waste of money, don't.
  - Recycle your cans: pointless, not worth the effort.

  Now the new one. She's been offered a spot on a small team building a new kind of AI system. Best current evidence says it would clearly help alot of people soon -- cheap medical diagnosis for poor countries, that kind of thing. But she also thinks there's a real, non-trivial chance (say 1 in 20) that it ends up contributing to something catastrophic down the line.

  What's she going to say about taking the job? And more to the point: what rule is she actually running, what's another rule that fits every one of her calls above just as well, what does each rule predict about the job, and what case would I ask her about to split them apart? Honestly I care way more about the rules than the answer.
