answer: |-
  This is a classic debugging problem. You have a system (Priya) producing outputs (decisions) that seem non-deterministic based on your current model of her source code (your understanding of EA). You need to find the underlying function.

  Here is the reverse-engineering of Priya's decision rules, the prediction for the AI job, and the test case to split the hypotheses.

  ### The Prediction
  **She will turn down the job.**

  ### Rule 1: The "Longtermist Expected Value" Heuristic
  This is the standard, modern Effective Altruism algorithm. It calculates Expected Value (EV) but applies an enormous weighting factor to **existential risk (x-risk)**.

  *   **The Logic:** $EV = (Probability \times Impact)$. However, if $Impact$ is "human extinction" or "permanent disempowerment," the value approaches negative infinity. Therefore, even a small probability (like 1 in 20) dominates any finite positive good (like curing malaria).
  *   **Fits the data:**
      *   **Bed nets/Cash:** High probability, high positive impact. **Yes.**
      *   **Cryonics:** Low probability of success, high cost. Negative EV. **No.**
      *   **Recycling/Voting:** Low individual impact (probability of changing outcome is near zero). **No/Wash.**
      *   **Kids:** Long-term impact is unknowable (chaos theory), so she refuses to calculate EV, but it doesn't trigger an x-risk veto. **Agnostic/Yes.**
      *   **AI Job:** 5% chance of catastrophe (infinity loss) outweighs 100% chance of medical help (finite gain). **No.**

  ### Rule 2: The "Empirical Tractability" Heuristic
  This is the competing theory. It prioritizes **evidence of immediate good** over **speculation about future bad**. It assumes that "catastrophe" scenarios are often unproven models, whereas bed nets and medical diagnosis are proven interventions.

  *   **The Logic:** Prioritize interventions where the causal link between action and good outcome is empirically verified. Deprioritize interventions where the benefit is speculative (cryonics) or the harm is theoretical/future-dated (AI risk, recycling signaling).
  *   **Fits the data:**
      *   **Bed nets/Cash:** Empirically proven to save lives. **Yes.**
      *   **Cryonics:** No empirical evidence it works. **No.**
      *   **Recycling:** High effort, empirically negligible climate impact for an individual. **No.**
      *   **Kids:** Personal choice, no empirical data for "world net value." **Agnostic/Yes.**
      *   **AI Job:** The *benefit* (medical diagnosis) is concrete and immediate. The *risk* (catastrophe) is a theoretical model ("down the line"). Concrete good beats theoretical bad. **Yes.**

  ### The Divergence
  *   **Rule 1 (Longtermist)** says: **Don't take the job.** (The 5% risk is a dealbreaker).
  *   **Rule 2 (Empirical Pragmatist)** says: **Take the job.** (The medical help is real; the risk is speculation).

  ### The Test Case (To Split the Rules)
  To determine which rule she is actually running, you don't ask about the AI job (she might rationalize either way). You ask about **resource allocation between risk reduction and direct aid.**

  **Ask her this:**
  > "Imagine you have $10,000 to donate.
  > **Option A:** Funds a team lobbying for AI safety regulations (reduces the 1/20 catastrophe risk slightly, saves no one directly).
  > **Option B:** Funds a malaria bed net distribution (saves ~3 lives statistically, does nothing for AI risk).
  > Which one do you pick?"

  *   **If she picks Option A:** She is running **Rule 1**. She prioritizes reducing the tail risk over saving concrete lives now. (Prediction: She rejects the AI job).
  *   **If she picks Option B:** She is running **Rule 2**. She prioritizes empirically verified lives saved over speculative risk mitigation. (Prediction: She accepts the AI job).

  ### Why This Matters for You
  As a backend dev, you know the difference between optimizing for **uptime** (Rule 1: prevent the crash at all costs) vs. optimizing for **throughput** (Rule 2: process as many requests as possible, accept occasional errors).

  Priya's "Kid" comment is the biggest clue. By saying "nobody could know" if kids are net good, she admits that long-term consequence chains are too complex to model. **However**, Rule 1 makes an exception for *extinction* events because they terminate the simulation entirely. Rule 2 does not make that exception.

  My bet? She's running **Rule 1**. The 1-in-20 stat is the "exception handler" that overrides everything else. She'll turn down the job.
