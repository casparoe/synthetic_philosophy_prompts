      *   **The "Killer" Requirement:** The Environmental Relationality Constraint. It breaks pure Biostatistical Theory (BST) because BST looks at reference classes, but if the reference class environment changes, the status changes.
      *   **The Incompatibility:** **Objectivity vs. Relationality.** (Or Natural Kind vs. Contextual Value). I need to be plain here. You cannot have a theory that says disease is *purely* a biological fact independent of values/environment AND a theory that says disease status changes based on environment/values. One must give.

