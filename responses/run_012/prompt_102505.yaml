      *   *Requirement 3: The Context/Environment Constraint.* A theory must handle relational properties (sickle cell, salt sensitivity). *Why?* Biology doesn't happen in a vacuum.
      *   *Requirement 4: The Function/ Mechanism Constraint.* A theory must define "function" rigorously. *Why?* "Dysfunction" is the core of naturalism, but it's ill-defined without this.
      *   *Requirement 5: The Boundary/Vagueness Constraint.* A theory must handle the continuum (pre-hypertension). *Why?* Biology is continuous; diagnosis is categorical.
