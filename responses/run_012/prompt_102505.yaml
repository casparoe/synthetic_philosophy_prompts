answer: |-
  Here is the specification list for a viable theory of health and disease. These are not preferences for one camp (naturalist or normativist); they are structural requirements any theory must satisfy to map onto the phenomenon we actually practice medicine upon.

  ### I. The Specification List

  **1. The Paradigm Constraint (Extensional Adequacy)**
  *   **Requirement:** The theory must classify clear paradigm cases correctly without ad-hoc exceptions. (e.g., Metastatic cancer = disease; Red hair = not disease; Broken femur = disease).
  *   **Why Genuine:** If a theory classifies red hair as a disease or metastatic cancer as health, it is not a theory of *our* concept of disease. It is a theory of a different concept. A definition that loses the extension of the term it defines is a failure of reference.

  **2. The Function Grounding Constraint**
  *   **Requirement:** The theory must provide truth conditions for "function" and "dysfunction" that do not rely on circular appeals to "health." It must distinguish between *statistical rarity* and *functional failure*.
  *   **Why Genuine:** "Dysfunction" is the primary naturalist criterion. If "function" is undefined, "dysfunction" is a placeholder. If function is defined purely statistically, harmless anomalies become diseases. If defined purely teleologically, novel traits (like reading) become impossible to evaluate. The theory must solve the reference class problem for functions.

  **3. The Environmental Relationality Constraint**
  *   **Requirement:** The theory must account for the fact that the disease status of a physiological state can change based on the environment without changing the physiology itself.
  *   **Why Genuine:** Biology does not occur in a vacuum. A theory that insists disease is *intrinsic* to the organism ignores evolutionary reality (e.g., phenotypic plasticity). A theory that makes disease *purely* relational loses its biological anchor. It must explain the interaction.

  **4. The Continuum/Boundary Constraint (The Grey Zone)**
  *   **Requirement:** The theory must provide a principled method for drawing lines across continuous biological distributions (e.g., blood pressure, bone density). It must distinguish between *risk factor*, *pre-disease*, and *disease*.
  *   **Why Genuine:** Pathophysiology is almost always continuous; diagnosis is categorical. A theory that cannot explain where the cutoff lies (or why there *is* a cutoff) fails to guide clinical practice. It must explain why "high-normal" is not the same as "hypertension."

  **5. The Treatment Distinction Constraint**
  *   **Requirement:** The theory must distinguish "X is a disease" from "X warrants medical treatment."
  *   **Why Genuine:** Collapsing these leads to the medicalization of normality (treating non-diseases) or therapeutic nihilism (ignoring untreatable diseases). We recognize untreatable diseases (e.g., early-stage Huntington's) and treat non-diseases (e.g., contraception, enhancement). The ontology of disease must be separable from the economics/ethics of intervention.

  **6. The Universality/Aging Constraint**
  *   **Requirement:** The theory must explicitly classify aging. It cannot treat aging as a "special case" outside the theory.
  *   **Why Genuine:** Aging is the primary driver of morbidity and mortality. If a theory of disease cannot account for the process that causes most diseases, its scope is critically limited. It must decide if aging is a universal disease, a natural process, or a collection of diseases.

  ---

  ### II. Running the Specific Cases Through the Spec

  Here is how a theory must handle the specific scenarios you raised to meet the specs above.

  **1. The Grey Zone (Pre-diabetes, Osteopenia)**
  *   **The Test:** A theory cannot simply say "it's a spectrum." It must identify the *tipping point*.
  *   **The Requirement:** The theory must invoke a **Harm Threshold** combined with **Statistical Deviation**.
      *   *Principle:* A state is a disease only when the statistical deviation correlates with a non-negligible probability of *specific harm* (not just difference).
      *   *Verdict:* "Pre-diabetes" is a risk factor, not a disease, because the harm (organ damage) is not yet present, only probable. "Diabetes" is the disease because the dysregulation is actively causing or reliably imminent to cause harm. A theory that calls pre-diabetes a disease violates the **Treatment Distinction** (leading to over-treatment). A theory that calls it *not* a risk factor violates the **Continuum Constraint**.

  **2. Function Ascription (Stats vs. Selected Effect)**
  *   **The Test:** Rare harmless traits vs. Novel traits.
      *   *Case A (Rare/Harmless):* Six fingers. Statistically abnormal. Not a disease.
      *   *Case B (Novel):* The ability to read. Not selected for evolutionarily. Is dysfunction here possible? (e.g., Dyslexia).
  *   **The Requirement:** The theory must use a **Hybrid Function Account**.
      *   *Principle:* "Function" is primarily *Selected Effect* (what the system was designed to do), but for novel capacities, it shifts to *Role Function* (what the system contributes to the organism's survival/flourishing in its current context).
      *   *Verdict:* Six fingers fails the harm condition (Constraint 4). Dyslexia is a dysfunction because, while reading isn't selected, the neural mechanisms underlying pattern recognition *are*, and they are failing to meet the *Role Function* required for current survival/flourishing. Pure Statistical Normality fails Case A. Pure Selected Effect fails Case B.

  **3. Context Dependence (Sickle Cell & Salt Sensitivity)**
  *   **The Test:** The Salt-Sensitive Hypertension Variant.
      *   *Scenario:* Gene X + High Salt = Stroke/Death. Gene X + Low Salt = Perfect Health.
      *   *Question:* Is Gene X a disease?
  *   **The Requirement:** The theory must adopt **Relational Realism**.
      *   *Principle:* Disease is not a property of the *gene* or the *environment* alone, but of the *organism-in-environment*.
      *   *Verdict:* Gene X is a **disposition**, not a disease. The *disease* is the hypertension/stroke outcome. Therefore, the individual is not diseased on a low-salt diet. They are diseased on a high-salt diet.
      *   *Why:* If you say Gene X is *always* a disease, you violate the **Harm Threshold** (no harm in low salt). If you say it is *never* a disease, you violate the **Paradigm Constraint** (it kills people in high salt).
      *   *The Disability Analogy:* A wheelchair user is not "diseased" by the inability to climb stairs; they are disabled by the *absence of a ramp*. The theory must classify the *mismatch* between capacity and environment as the locus of the problem, not the capacity alone.

  **4. Aging**
  *   **The Test:** Is aging a disease?
  *   **The Requirement:** The theory must decide between **Process** vs. **Pathology**.
      *   *Principle:* If disease is "interference with function," and aging universally reduces function, aging is a disease. If disease is "deviation from species-typical design," and aging is part of the design (senescence), it is not.
      *   *Verdict:* To satisfy the **Paradigm Constraint**, aging is best classified as a **universal risk state** that generates specific diseases (cancer, dementia), rather than a disease itself. Calling aging a disease violates the **Treatment Distinction** (we cannot "cure" aging without redefining death).

  **5. Disease vs. Treatment**
  *   **The Test:** Untreatable conditions vs. Enhancements.
  *   **The Requirement:** **Ontological Independence.**
      *   *Principle:* "Disease" is a descriptive category of biological state. "Treatment" is a normative category of intervention.
      *   *Verdict:* A theory that collapses these implies that if we can't treat it, it isn't a disease (false: Huntington's), or if we treat it, it was a disease (false: contraception). The theory must allow for **Untreatable Diseases** and **Treatable Non-Diseases**.

  ---

  ### III. The Killer Requirement

  **The Environmental Relationality Constraint (Requirement 3)** is the single requirement that knocks out the most otherwise-attractive theories.

  *   **Why:** Most "Naturalist" theories (like Boorse's Biostatistical Theory) strive to make disease an **intrinsic biological fact**. They want disease to be like chemistry: independent of context.
  *   **The Failure:** The Salt-Sensitivity case destroys this. If disease is intrinsic, the salt-sensitive gene must be diseased *regardless* of the salt. But it causes no harm without the salt. To save the theory, the naturalist must argue the "reference class" includes the diet. But once you include the diet, you admit disease is relational.
  *   **The Normativist Failure:** Normativists handle this easily (disease is what we value/disvalue), but they often fail the **Paradigm Constraint** (making disease too arbitrary).
  *   **Result:** Any theory that insists disease is *solely* inside the skin is dead on arrival given modern genetics and epidemiology.

  ---

  ### IV. The Incompatibility

  You asked me to say plainly if any two items on the list are incompatible.

  **Yes. The Paradigm Constraint (1) and The Environmental Relationality Constraint (3) are in deep tension, potentially incompatible.**

  Here is the plain truth:

  1.  **The Paradigm Constraint** demands that the theory match our stable, intuitive usage of "disease." Our intuition is that disease is a **property of the person**. (e.g., "He *has* cancer," not "He *has* cancer-in-this-environment"). We treat disease status as intrinsic and stable across contexts.
  2.  **The Environmental Relationality Constraint** demands that the theory acknowledge that disease status is **relational and unstable**. (e.g., The salt-gene is healthy in Kyoto, diseased in Chicago).

  **The Conflict:**
  You cannot have a theory that satisfies the folk intuition that disease is an intrinsic label (Paradigm) while simultaneously satisfying the biological reality that disease is a context-dependent interaction (Relationality).

  *   If you prioritize **Relationality**, you must tell the patient: "You are not diseased here, but you would be if you moved." This violates the **Paradigm Constraint** because it makes "having a disease" feel like a situational label rather than a biological state. It destabilizes the concept.
  *   If you prioritize **Paradigm**, you must tell the patient: "You have the diseased gene, regardless of your diet." This violates **Relationality** because it labels a harmless state as pathological, leading to false positives and unnecessary anxiety/treatment.

  **Resolution:**
  A viable theory must **revisionize** the Paradigm Constraint. It must admit that our folk concept of disease as "intrinsic" is metaphysically wrong. The theory must argue that *we should stop thinking of disease as intrinsic*.

  If you are not willing to argue that our ordinary concept of disease is partially mistaken (specifically regarding intrinsicness), you cannot build a theory that handles the salt-sensitivity case correctly. **You must choose between saving the folk intuition or saving the biological accuracy.** Most seminars gloss over this; yours should not.
