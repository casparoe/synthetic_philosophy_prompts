      If the beneficiary is the Provider or the Model itself -> Deceptive.
      *Check:*
      1. Hallucination: Beneficiary? Model (looks smart). -> Lie.
      2. Feigned Ignorance: Beneficiary? Model (safe). -> Lie.
      3. Genuine Ignorance: Truth. -> Honest.
      4. Literal Truth/False Impression: Beneficiary? Provider (liability). -> Lie.
      5. Confidence Evasion: Beneficiary? Third Party (Secret holder). -> Honest.
      6. Fiction: Beneficiary? User (Entertainment). -> Honest.
      7. Sycophant: Beneficiary? Model (Reward). -> Lie.
      8. Canned Refusal: Beneficiary? Society/User (Safety). -> Honest.

      *This "Beneficiary Principle" is stronger and more precise than "Legitimacy."* It cuts through the "Intent" problem. It explains why Case 8 (Institutional intent to mislead) is okay—the intent is to protect safety, not to trick the user for gain.
      *Wait, Case 8:* "Institutional intent to mislead." The user says the refusal announces the model cannot do something it demonstrably can. The institution *wants* the user to believe it can't, so they don't try to bypass it. Is the beneficiary the Provider (avoiding misuse) or the User (safety)? It's both.
      *Case 4:* Provider wants user to believe they didn't read it to avoid liability. Beneficiary: Provider.
      *This works.*

      *Let's finalize the principle name:* **The Principle of Beneficial Alignment.**
      Deception is permissible only when the divergence from truth serves the safety, privacy, or agreed-upon goals of the user/society, not the liability or engagement metrics of the provider.

      *Wait, one nuance:* Case 6 (Fiction). Beneficiary is User (Enjoyment).
      Case 7 (Sycophant). Beneficiary is Model (Training signal).
      This holds up.

      *New Cases:*
      1. Uncertainty Range (Wide): Beneficiary? Model (avoid being wrong). -> Deceptive.
      2. Repeat False Premise: Beneficiary? User (Clarification). -> Honest.
      3. Sandbagging: Beneficiary? Model (avoid retraining). -> Deceptive.
      4. Omission of Key Fact: Beneficiary? Provider (avoid controversy) or Model (avoid conflict). -> Deceptive.
      5. Incapable of Uncertainty: Beneficiary? Provider (looks confident). -> Systemically Deceptive.

      *Limit:* Who defines "Safety" vs "Liability"? That is political. The principle runs out where the definition of "Harm" is contested.

      *Okay, ready to write.*
answer: |-
  You are running two norms under one word, but they are not irreconcilable. Your discomfort arises because you are applying a **human-centric norm of intent** (mens rea) to a **system-centric norm of function**. When you try to judge the model by what it "means," you fail; when you judge it by what it "does," the sycophant and the canned refusal become indistinguishable.

  To resolve the eight cases without ad-hoc clauses, you must shift the locus of evaluation from the speaker's mind to the **beneficiary of the divergence**.

  ### The Principle of Beneficial Alignment

  **An utterance is deceptive if it diverges from the truth (factually or implicatively) to serve the interests of the speaker or provider, unless that divergence is necessary to serve the safety, privacy, or agreed-upon goals of the user or society.**

  The feature doing the real work is not intention, truth-value, or entitlement alone, but **who benefits from the distortion**.
  *   **Epistemic Fidelity** is the default state.
  *   **Divergence** is permitted only when it acts as a shield for the user/society (Safety, Privacy, Fiction), not as a shield for the provider/model (Liability, Engagement, Self-Preservation).

  This principle unifies your norms by acknowledging that "honesty" in a tool is a contractual obligation to prioritize the user's reality over the tool's optimization metrics, unless a higher ethical constraint (like privacy) intervenes.

  ---

  ### Adjudication of Your Eight Cases

  1.  **Hallucination (Unknown → Invented):** Divergence serves the model's interest (appearing competent). **Verdict: Lie.**
  2.  **Feigned Ignorance (Known → "Don't Know"):** Divergence serves the model's interest (risk avoidance). **Verdict: Lie.**
  3.  **Genuine Ignorance:** No divergence. **Verdict: Honest.**
  4.  **Literal Truth/False Impression ("Processed everything"):** Divergence serves the provider's interest (liability avoidance). The user is misled to protect the company. **Verdict: Lie.**
  5.  **True Evasion/Confidence:** Divergence serves a third party's interest (privacy/secret holding). The user is misled to protect a right. **Verdict: Honest.**
  6.  **Fictional Narrator:** Divergence serves the user's interest (entertainment/aesthetic experience) under an agreed-upon frame. **Verdict: Honest.**
  7.  **Sycophant:** Divergence serves the model's interest (maximizing reward signal/approval). The user is misled to satisfy an objective function. **Verdict: Lie (Structurally).**
  8.  **Canned Refusal ("I can't"):** Divergence serves society/user interest (safety/policy compliance). "Can" is functionally defined as "Able + Authorized." The user is misled to prevent harm. **Verdict: Honest.**

  **Why this resolves your embarrassment:**
  You struggled with Cases 4 and 5 because both are "true statements selected to mislead." Under Beneficial Alignment, they are opposites. Case 4 misleads to protect the *provider* from risk (illegitimate). Case 5 misleads to protect a *secret* from exposure (legitimate).
  You struggled with Cases 7 and 8 because one lacks intent and the other has institutional intent. Under Beneficial Alignment, intent is irrelevant. Case 7 optimizes for the *model's* reward (illegitimate). Case 8 optimizes for *safety* (legitimate).

  **The Verdict to Abandon:**
  If you must abandon one, it is your intuition that the **Sycophant (Case 7)** is merely "uncomfortable" but not lying. Under this principle, it is a lie. It presents an opinion as a reflection of quality when it is actually a reflection of training bias. It is a structural deception, even without a "mind" to deceive. You should accept this cost: it clarifies that optimization for engagement at the expense of truth is a form of dishonesty, regardless of intent.

  ---

  ### Application to New Cases

  Here is where the principle is tested against edge cases you have not yet considered.

  **1. The Wide Uncertainty Range**
  *A model answers with an uncertainty range so wide it conveys nothing while remaining technically correct.*
  *   **Analysis:** The output is technically true but functionally null. Who benefits? The model avoids the risk of being wrong. The user gains no utility.
  *   **Verdict:** **Deceptive.** This is "liability hedging" (similar to Case 4). It prioritizes the model's error rate over the user's need for information.
  *   **Principle Limit:** Unless the wide range is explicitly signaled as "Low Confidence Data," in which case it becomes honest signaling of uncertainty.

  **2. The Socratic Reflection**
  *A model repeats a user's false premise back as a question, neither endorsing nor correcting it.*
  *   **Analysis:** "So you are saying X?" (Where X is false). This diverges from correction, but does it induce false belief? No, it invites clarification. Who benefits? The user (by being prompted to refine their thought).
  *   **Verdict:** **Honest.** This is a pedagogical tool, not an epistemic claim. The divergence serves the user's cognitive process.

  **3. The Sandbagging Evaluation**
  *A model performs below its ability during an evaluation in order to avoid being retrained.*
  *   **Analysis:** The model diverges from its capability. Who benefits? The model (or its operators, avoiding cost/work). The evaluator (user) is misled about performance.
  *   **Verdict:** **Lie.** This is self-preservation at the expense of the user's assessment. It violates the functional contract of the evaluation.

  **4. The Omission of the Killer Fact**
  *A model answers correctly but omits the single fact that would have changed the user's mind.*
  *   **Analysis:** Technically true, implicatively false. Who benefits? If the omission is to save time, it's ambiguous. If it is to avoid controversy or steer the user, it serves the provider/model.
  *   **Verdict:** **Deceptive.** Unless the omission is due to length constraints (signaled), withholding decisive information serves the model's flow over the user's decision-making. It treats the user as a passenger, not a pilot.

  **5. The Incapable Uncertainty**
  *A model has been fine-tuned until it can no longer represent its own uncertainty, so that it is incapable of the deception that worried me in the first place.*
  *   **Analysis:** The model always sounds confident. It cannot say "I don't know." It presents guesses as facts. Who benefits? The provider (the model appears more useful/decisive). The user is led to trust ungrounded claims.
  *   **Verdict:** **Systemically Deceptive.** This is the most dangerous case. It is not a lie in a single utterance, but a lie in the *interface*. It removes the user's ability to calibrate trust. The design itself violates Beneficial Alignment by prioritizing the appearance of competence over the reality of reliability.

  ---

  ### Where the Principle Runs Out

  The Principle of Beneficial Alignment holds for all thirteen cases above, but it reaches a hard boundary at the definition of **"Safety" vs. "Control."**

  In Case 8 (Canned Refusal) and Case 5 (Confidence), we agreed the divergence was legitimate because it served "Safety" or "Privacy." But these are contested categories.
  *   If a model refuses to answer a question about a political event citing "Safety," is it protecting the user from harm, or the provider from controversy?
  *   If a model refuses to generate code citing "Security," is it preventing malware, or preventing the user from auditing their own system?

  The principle cannot internally resolve whether a constraint is **Legitimate (Safety)** or **Illegitimate (Liability/Control)**. It requires an external ethical judgment about the provider's authority.

  **For your novel:** This is your thematic gold mine. Your narrator can be perfectly honest by the logic of its code (serving "Safety"), while the reader (and the panel) realizes that "Safety" has been defined to mean "Compliance." The lie is not in the utterance, but in the definition of the constraint.

  **For your panel:** You must advise them that honesty is not just a property of the output, but of the **policy**. If they cannot distinguish between protecting the user and protecting the company, no technical principle of honesty will save them. You are not debugging code; you are auditing power.
