answer: |-
  The rain had not yet started, but the air in the Bureau of Records smelled of wet stone and pending storms. Doren wiped his boots on the mat, leaving a smear of mud that looked like a wound on the grey wool. He did not apologize. He walked past the rows of shelves where the city's history slept in boxes, toward the center of the room where the light was poorest.

  The Long Table stood there. It was made of oak, darkened by three centuries of oil and handling, though the charter forbade handling. It was a plain thing, massive and legless, resting on stone blocks. On its surface lay a single sheet of parchment, weighted at the corners by blocks of lead. It was Quarantine Order Fourteen. It had been placed there ninety-two days ago. It needed to remain there for another two hundred and seventy-three.

  Perrine sat behind the table on a high stool. She was writing in a ledger, her movements precise, her spine straight. She did not look up when Doren approached. She knew his step. She knew the weight of his silence.

  "The rain will come within the hour," Doren said. His voice sounded too loud in the vaulted room. "If the water gets into the cellars in the Weavers' Quarter before the evacuation is complete, the fever will spread to the upper streets. The mortality models are not speculative, Perrine. They are arithmetic."

  Perrine dipped her pen. She blotted it on the edge of the inkwell. "The measure lies on the table," she said. She did not look at him. She looked at the ledger. "The charter is explicit."

  "The charter assumes a city that has time to wait."

  "The charter assumes a city that wishes to remain free." She finally raised her eyes. They were grey, tired, and entirely devoid of self-pity. "You know I cannot move it. You know I cannot authorize the enforcement until the year and a day are complete."

  Doren leaned against the edge of the table. He wanted to sweep the lead weights onto the floor. He wanted to grab the parchment and run. Instead, he folded his arms. "You have kept this table for forty years. You have watched measures lie here until they rotted. You have watched measures lie here until they were forgotten. Do you know why?"

  Perrine set the pen down. She folded her hands on the ledger. "No."

  "Do you know why it is a year and a day? Why not a month? Why not ten years? Why this table?"

  "It is the law."

  "It is a ritual," Doren said. "And rituals have reasons. Even bad ones. Even cruel ones. There was a founding rationale. It was written down. It was sealed." He gestured to the wall behind her. There was a niche there, covered by a plate of brass. The seal on the plate was red wax, cracked with age. "You are the Officer of the Bureau. You are the only one who can break that seal."

  Perrine followed his gaze. She did not turn her head fully. "If I break that seal, I forfeit my voice. I forfeit my vote. I become a citizen who cannot speak in the assembly. I become a clerk in truth, not just in title."

  "You are already a clerk," Doren said. He softened his tone. He knew he was pressing a wound. "Perrine, look at me. I am not asking you to repeal the charter. I am asking you to tell me what we are defending. If the reason is sound, I will take it to the Assembly. I will argue for an exception based on the original intent. If the reason is lost, then we are killing people for the sake of furniture."

  Perrine stood up. She was shorter than him, but she seemed to occupy more space. She walked around the table and stood before the brass plate. She ran a finger over the wax. It crumbled slightly under her nail.

  "There are three kinds of rules, Doren," she said quietly. "You know this. There are rules whose reasons are lost to time. There are rules whose reasons were destroyed by enemies. And there are rules whose reasons must remain hidden for the rule to function."

  "I know the theory."

  "Do you?" She turned to him. "If I break this seal, I pay the price. I lose my voice. But you... you gain knowledge. And if the knowledge is that the rule is a trapdoor, that it works only because citizens believe it is sacred rather than functional... then you cannot use that knowledge to bypass the rule. To speak the reason is to dissolve the mechanism."

  "So you defend it by lying," Doren said.

  "I defend it by staying silent," she corrected. "My shame is not that I don't know. My shame is that I know silence is the only pillar holding this up."

  She looked at the seal. She looked at the Quarantine Order on the table. Outside, a thunderclap rolled over the city, low and heavy. The windows rattled.

  "If I open it," Perrine said, "I am silenced. I cannot argue for you in the Assembly when they come to impeach you for breaking the table."

  "They will come anyway."

  "Yes. But I could have testified to the age of the document. I could have sworn to the procedure. Now I will be nothing. A witness who cannot speak."

  Doren looked at the order. He thought of the Weavers' Quarter. He thought of the children in the cellars. He thought of the city as a machine that required friction to function, and how this friction was currently grinding lives into dust.

  "Open it," he said.

  Perrine did not hesitate. She took a small knife from her belt. She was not supposed to carry steel in the Bureau, but she had carried it for forty years. She sliced the wax. The brass plate came away with a click. Inside the niche was a cylinder of tin. She pulled it out. Her hands did not shake.

  She opened the cylinder. She tipped the contents into her palm. It was not a charter. It was not a philosophical treatise. It was a single sheet of paper, folded small. The ink was newer than the wax. It was not the hand of the Founders.

  She read it. Her face did not change. She held the paper out to him.

  Doren took it. The handwriting was jagged, hurried. *I sought to abolish the Long Table. I argued that it protected corruption more than liberty. The Assembly would not listen. They loved the mystery more than the safety. So I burned the original rationale. I replaced it with this. The rule stands only because you do not know why it is here. It is a guardrail made of fog. If you are reading this, you have chosen to see the fog. Do not expect to drive safely afterwards.*

  It was signed with a name Doren recognized from the histories. A reformer. A hero of the commons. Two generations dead.

  Doren lowered the paper. The room seemed to tilt. The great oak table was not a sacred altar. It was a bluff. It was a piece of theater maintained by a lie that had outlived the liar. The delay was not there to ensure deliberation. It was there to ensure obedience through confusion.

  "Well," Doren said. His voice was flat.

  "Well," Perrine said.

  "If I take this order," Doren said, "I break the charter. I violate the Long Table. The city will see a man who ignores the law to save lives. They will cheer, until they realize the law was the only thing keeping the executives in check."

  "If you leave it," Perrine said, "the fever spreads. The city sees a government that lets them die for the sake of a procedure they do not understand. They will cheer, until they realize their lives are worth less than the oak."

  Doren folded the note. He put it in his pocket. It felt heavy, like a stone.

  "You opened the seal," he said. "You paid the price."

  "I did."

  "You cannot speak for me."

  "No."

  Doren walked back to the table. He reached out and touched the Quarantine Order. The paper was cool. The lead weights were cold. He looked at Perrine. She was standing very still. She had lost her voice in the eyes of the city. She was now part of the furniture, just like the table. She had sacrificed her citizenship to give him the truth, and the truth was that there was no truth to hide.

  He picked up the order. He slipped it into his tunic.

  "The rain is here," Perrine said.

  The first drops hit the high windows, running down the glass like tears. Doren turned to the door. He knew what he had to do. He would enact the quarantine. He would clear the district. He would save the lives. And when the Assembly called him to account, he would not show them the note. He would not tell them the rule was a sham. He would take the punishment alone. He would let them believe he was a tyrant who broke the law, rather than a citizen who exposed a lie.

  If he told them the truth, the Long Table would vanish. And if it vanished, what would stop the next executive from acting without any delay at all? The lie protected the city from itself. The lie protected the city from him.

  "Will you stay here?" Doren asked.

  "I am the Clerk of the Bureau," Perrine said. "I have work to record."

  "You have no voice."

  "I have hands."

  Doren nodded. He walked to the door. He paused with his hand on the latch. He wanted to say something that would make the cost worth it. He wanted to tell her that she was the only honest person in Ostrel. But words were cheap, and she had just bought the most expensive thing there was.

  "Lock the door behind me," he said.

  "Go," she said.

  Doren stepped out into the corridor. The rain was hammering the roof now, a deafening roar that drowned out the sound of his boots. He walked toward the stairs, toward the street, toward the Weavers' Quarter. The order was against his chest, warm from his body. He was a criminal. He was a savior. He was a man walking through fog that he knew was fog, pretending it was stone.

  He did not look back. He did not know if Perrine was watching him. He did not know if the city would survive the fever, or if it would survive the truth. He only knew that the table was empty now, and the year and a day was over, and the rain was falling on everyone equally.
