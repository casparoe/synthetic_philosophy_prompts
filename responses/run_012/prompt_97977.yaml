  9.  **Final Polish:** Ensure clear headings. Make sure the "Killer Requirement" is explicit. (I will argue that the **Real-Time Applicability** requirement is the one that breaks the system, or perhaps the **Extensional Adequacy + Real-Time** combination). Actually, the prompt asks for *one* requirement that does the most work. I'll select **The Distinction Between Error and Demarcation (False $\neq$ Unscientific)** as the one that kills the logical positivists, but **Real-Time Applicability** as the one that makes the whole project suspect. I will clarify this distinction. Let's go with **Real-Time Applicability** as the structural breaker, but **False $\neq$ Unscientific** as the epistemic breaker. The prompt asks for "which single requirement does the most work in eliminating candidates." I think **Extensional Adequacy (including hindsight cases)** combined with **Real-Time** is the conflict. But if I must pick one requirement that filters the *criteria*, it's usually **Extensional Adequacy regarding Historical Cases** (because it kills Naive Falsificationism and Verificationism). However, the student's specific suspicion is about Real-Time. I should validate that. I will argue that **Real-Time Applicability** is the requirement that exposes the impossibility.

