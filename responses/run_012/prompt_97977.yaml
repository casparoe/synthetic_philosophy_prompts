answer: |-
  You have hit upon the central frustration of the demarcation literature. Most textbooks present the history of the demarcation problem as a sequence of *proposals* followed by *refutations*, without first establishing what the proposals are supposed to *do*. You are correct to suspect that the "counterexample ping-pong" persists because the job description is often implicit, inconsistent, or impossible.

  Below is the specification you requested. It is structured as a set of desiderata (requirements), followed by an analysis of their coherence, a scoring of the major contenders, and an identification of the requirement that does the heaviest lifting.

  ---

  ### Part I: The Specification (Desiderata for Demarcation)

  An adequate criterion of demarcation must satisfy the following requirements. Each is motivated by specific phenomena or practical necessities.

  **1. The Truth-Value Independence Requirement**
  *   **Specification:** The criterion must distinguish between a claim being *unscientific* and a claim being *false*, *irrational*, or *unsuccessful*.
  *   **Motivation:** Phlogiston theory was scientific but false. Newtonian mechanics is scientific but strictly false (superseded by Relativity). Conversely, "The moon is made of green cheese" is falsifiable and false, but trivial; "Astrology determines personality" is the target of demarcation, not merely because it is false, but because of *how* it is supported. A criterion that equates "falsified" with "unscientific" (Naive Falsificationism) eliminates the history of science. A criterion that equates "unverifiable" with "unscientific" (Verificationism) eliminates universal laws.

  **2. The Extensional Adequacy Requirement (The "Textbook" Test)**
  *   **Specification:** The criterion must yield the correct verdict on clear historical paradigm cases.
  *   **Motivation:**
      *   **Include:** Einstein's General Relativity (1915). It must count as science even before the 1919 eclipse confirmation.
      *   **Exclude:** Blondlot's N-rays (1903). This must be excluded even though it involved laboratories, instruments, and peer consensus at the time.
      *   **Exclude:** Creation Science (1980s). In *McLean v. Arkansas*, the court needed to distinguish this from evolutionary biology not based on theological content alone, but on methodological structure.
      *   **Accommodate:** Weber's gravitational waves (1969) and Cold Fusion (1989). These are "pathological science" cases where the line between honest error and methodological breakdown is thin. The criterion must explain why these episodes are scientific *attempts* that failed, rather than non-science, or conversely, why they slipped into pseudoscience.

  **3. The Target Specification Requirement**
  *   **Specification:** The criterion must explicitly state what bears the property of "being scientific."
  *   **Motivation:** Is it a single sentence? (Too narrow; context matters). A whole theory? (Too static; theories evolve). A research programme? (Better, but hard to define boundaries). A community? (Risks circularity: "science is what scientists do").
  *   **Necessity:** To avoid category errors. For example, a single claim ("There is a planet beyond Neptune") is scientific if made within the context of celestial mechanics, but unscientific if made via tarot cards. The criterion must account for the **context of generation** or the **methodological lineage**, not just the logical form of the statement.

  **4. The Temporal Applicability Requirement**
  *   **Specification:** The criterion must specify whether it is a tool for *real-time* decision-making (by a judge, funding agency, or teacher) or a *retrospective* tool for historians.
  *   **Motivation:**
      *   **Real-Time:** Courts (e.g., *Daubert* standard) and school boards cannot wait 50 years to see if a theory succeeds. They need a verdict *now*.
      *   **Retrospective:** Historians need to classify Lysenkoism correctly after the fact to understand the sociology of error.
      *   **Conflict Warning:** A criterion that relies on "long-term problem-solving success" (Lakatos) works retrospectively but fails real-time. A criterion that relies on "logical form" (Popper) works real-time but fails extensional adequacy.

  **5. The Normative Neutrality Requirement**
  *   **Specification:** The criterion must not smuggle political or ideological preferences in under the guise of epistemic verdicts.
  *   **Motivation:** We want to exclude Creation Science because it is methodologically flawed (appeals to revelation, immutable premises), not simply because it is religious. We want to exclude Lysenkoism not because it was Soviet, but because it subordinated data to ideology. However, we must avoid defining science as "whatever the current consensus says," because consensus can be politically corrupted (e.g., Soviet biology) or simply wrong (Semmelweis and handwashing). The criterion must be normative enough to correct the community, but not so normative that it becomes a political weapon.

  **6. The Hindsight Accommodation Requirement**
  *   **Specification:** The criterion must accommodate cases where the scientific status changes or clarifies over time.
  *   **Motivation:** Alchemy was a precursor to chemistry; was it science? Atomism was unfalsifiable for centuries; when did it become science? String theory is currently mathematically rigorous but empirically distant; is it science *now*? The criterion must handle the **gradient** of scientificity or explain the transition from speculative to established science without moving the goalposts arbitrarily.

  ---

  ### Part II: Meta-Analysis of the Requirements

  Here we analyze which requirements are essential and which are sources of the conflict you suspected.

  **Non-Negotiable vs. Camp Prejudices**
  *   **Non-Negotiable:** *Truth-Value Independence* (Req 1) and *Target Specification* (Req 3). If a criterion conflates truth with scientific status, it is logically incoherent. If it doesn't specify the target, it is ambiguous.
  *   **Camp Prejudice:** *Real-Time Applicability* (Req 4). This is the most contentious requirement. Many philosophers (especially post-Kuhnian) argue that demanding a real-time verdict is a **category mistake**. Science is a historical process; judging it in real-time is like judging the quality of a novel after reading only the first chapter. The demand for real-time applicability often comes not from philosophy, but from **external stakeholders** (courts, politicians).

  **The Impossible Triangle (Joint Unsatisfiability)**
  You suspected that *Real-Time Applicability* and *Verdict on Hard Cases* cannot both be met. I confirm this, but I would expand it to a trilemma. You cannot simultaneously satisfy:
  1.  **Real-Time Applicability** (Verdict needed now).
  2.  **Extensional Adequacy on Hard Cases** (Correctly sorting N-rays, Cold Fusion, String Theory).
  3.  **Normative Neutrality** (Not relying solely on current consensus).

  **Why they conflict:**
  To correctly sort "Hard Cases" like N-rays or Cold Fusion (Req 2 & 6), you generally need **hindsight**. You need to know that the N-ray apparatus was insensitive, or that Cold Fusion results were not replicable. This requires time.
  If you demand a **Real-Time** verdict (Req 4), you are forced to rely on surface features (logical form, current consensus, stated methodology).
  *   If you rely on logical form (Popper), you fail Extensional Adequacy (Req 2) because N-rays were falsifiable and tested.
  *   If you rely on current consensus (Sociological view), you fail Normative Neutrality (Req 5) because the consensus supported N-rays at the time.

  **Conclusion on Coherence:** The demand that a criterion be applicable by an outsider in real-time is **not epistemically coherent** if it also claims to track the deep methodological health of the research. It requires omniscience regarding future replicability and theoretical fertility. A real-time criterion can only be a **heuristic proxy**, not a deep epistemic definition.

  ---

  ### Part III: Scorecard of Contenders

  Here is how the main contenders score against the specification. (Scale: ✅ Pass, ⚠️ Partial/Fail, ❌ Fail).

  | Criterion | 1. Truth/Status Distinct | 2. Extensional Adequacy | 3. Target Specified | 4. Real-Time App | 5. Normative Neutrality | 6. Hindsight |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Verificationism** | ❌ (Laws unverifiable) | ❌ (Excludes Relativity) | ✅ (Statements) | ⚠️ (Idealized) | ⚠️ (Excludes metaphysics) | ❌ |
  | **Naive Falsificationism** | ❌ (Falsified = Unscientific) | ❌ (Duhem-Quine problem) | ✅ (Theories) | ✅ | ⚠️ (Dogmatic) | ❌ |
  | **Popper (Sophisticated)** | ✅ | ⚠️ (Struggles with N-rays) | ✅ (Theories) | ⚠️ (Ad hoc hard to judge) | ✅ | ⚠️ |
  | **Kuhn (Paradigms)** | ✅ | ✅ (Historically sensitive) | ✅ (Community/Practice) | ❌ (Incommensurable) | ❌ (Consensus bound) | ✅ |
  | **Lakatos (Research Programmes)**| ✅ | ✅ (Best on hard cases) | ✅ (Programmes) | ❌ (Requires hindsight) | ✅ | ✅ |
  | **Thagard (Explanatory Coherence)**| ✅ | ⚠️ (Psychologistic) | ✅ (Claims/Systems) | ⚠️ (Complex to compute) | ✅ | ⚠️ |
  | **Laudan (Pseudo-Problem)** | ✅ | ✅ (Dissolves the issue) | N/A | N/A | ✅ | ✅ |

  **Brief Commentary:**
  *   **Popper:** Fails primarily on *Extensional Adequacy* regarding "messy" cases. N-rays were falsifiable; Popper's criterion admits them.
  *   **Kuhn:** Fails *Real-Time* and *Normative Neutrality*. If science is "puzzle-solving within a paradigm," then Lysenkoism was science in the USSR. It lacks the normative edge to criticize a community from the outside.
  *   **Lakatos:** The strongest epistemic account, but fails *Real-Time Applicability*. You only know if a programme is "progressive" or "degenerating" in hindsight.
  *   **Laudan:** Wins on coherence by arguing the demarcation problem is a pseudo-problem masking a "problem of warrant." However, this fails the *Utility* constraint (courts still need a yes/no answer).

  ---

  ### Part IV: The "Killer" Requirement

  You asked to flag which single requirement does the most work in eliminating candidates.

  **The Requirement:** **The Truth-Value Independence Requirement (Req 1).**

  **Why:** This is the filter that eliminates the entire Logical Positivist tradition (Verificationism) and Naive Falsificationism immediately.
  *   Verificationism fails because universal scientific laws are not strictly verifiable.
  *   Naive Falsificationism fails because it treats a falsified theory as "unscientific," whereas history shows that false theories (Phlogiston, Caloric, Newtonian Physics) are central to the scientific tradition.

  **However,** if we look at the project as a whole (including its practical utility), the **Real-Time Applicability Requirement (Req 4)** is the structural breaker.
  *   It is the requirement that renders the demarcation problem **practically insoluble**.
  *   Any criterion robust enough to handle the *Hard Cases* (N-rays, String Theory) requires historical time to mature (Lakatos/Kuhn).
  *   Any criterion fast enough for *Real-Time* use (Popper/Logic) is too brittle to handle the *Hard Cases*.

  **Final Verdict for your Studies:**
  Your suspicion is correct. The "counterexample ping-pong" exists because philosophers are trying to solve two different problems with one tool:
  1.  **The Epistemic Problem:** What makes science knowledge-producing? (Solved by Lakatos/Kuhn, but requires hindsight).
  2.  **The Political/Legal Problem:** How do we allocate resources/credibility *now*? (Requires heuristics, not deep demarcation).

  When you read the next text, ask: **Is the author trying to define science for the historian, or for the judge?** If they claim to do both without addressing the time-lag conflict, they are the ones concealing the lack of a job description.
