answer: |-
  Here is a complete plan for your 60-minute session. It is designed to be tight, visceral, and intellectually honest about what the experiment can and cannot prove.

  ### Session Title: The Logic of the Clone
  **Time:** 60 Minutes
  **Audience:** 25 Adults
  **Budget:** ~$250 (Cash prize + guaranteed payouts)

  ---

  ### 1. The Setup & Rules (10 Minutes)

  Do not start with theory. Start with the money. Place a clear acrylic box in the center of the room. Put a stack of crisp $20 bills totaling **$100** inside it. This is the **Common Pot**.

  Hand each participant a packet containing:
  *   5 distinct, numbered raffle tickets (e.g., bright pink slips).
  *   5 "Voucher" slips (e.g., pale blue slips).
  *   A pencil.

  **The Rules (Read these aloud, slowly):**
  1.  **The Pot:** The $100 in the box will be divided equally among every **pink ticket** submitted.
  2.  **The Cost:** To submit a pink ticket, you must surrender one **blue voucher**.
  3.  **The Alternative:** Any blue voucher you *do not* use is worth **$1 cash**, payable by me immediately after the game.
  4.  **Privacy:** Write your name on the pink tickets you wish to submit. Fold them. Place them in the box. Keep your unused blue vouchers in your pocket.
  5.  **Secrecy:** You cannot see how many tickets others submit until everyone has finished.

  **The Arithmetic of the Dilemma:**
  *   **If everyone is "Good":** Everyone submits 1 ticket. Total tickets = 25. Pot per ticket = $4. You keep 4 vouchers ($4). **Total Earnings: $8.**
  *   **If you are "Smart" (Nash Equilibrium):** Everyone submits 1 ticket, but *you* submit 5. Total tickets = 29. Pot per ticket = $3.45. You have 5 tickets ($17.25). You keep 0 vouchers. **Total Earnings: $17.25.** (You crush the cooperators).
  *   **If everyone is "Smart":** Everyone submits 5 tickets. Total tickets = 125. Pot per ticket = $0.80. You have 5 tickets ($4.00). You keep 0 vouchers. **Total Earnings: $4.** (Everyone is worse off than if they had done nothing).

  **Instruction:** "You have 5 minutes to decide. Remember: You are rational. Assume everyone else in this room is just as rational as you are."

  ---

  ### 2. Collection & Reveal (15 Minutes)

  **Collection:** Walk around with the box. Ensure participants fold their tickets so numbers aren't visible. This prevents last-minute adjustments based on visual cues.

  **The Count:** This must be theatrical.
  1.  Dump the tickets on a table.
  2.  Ask for a volunteer to count the total number of pink tickets aloud.
  3.  Write the number on a whiteboard.
  4.  **Calculate the Dividend:** $100 / [Total Tickets]. Round to two decimals.
  5.  **Calculate the Payout:** Multiply the dividend by the number of tickets each person submitted.
  6.  **Add the Vouchers:** Count the blue vouchers kept and add $1 per voucher.

  **The Payout:** Hand out the cash immediately. The tactile sensation of receiving $3.50 instead of the possible $8.00 is crucial.

  ---

  ### 3. The Debrief (30 Minutes)

  This is where you move from arithmetic to philosophy. Do not lecture; interrogate their feelings during the decision phase.

  **Phase 1: The Feeling of Rationality (5 Mins)**
  *   Ask: "Who submitted more than one ticket? Why?"
  *   *Expected Answer:* "If I don't, someone else will, and I'll lose out." or "My single ticket won't change the total much."
  *   *Point:* This is standard Game Theory (Nash Equilibrium). It is individually rational. It is collectively ruinous. You followed the rules of economics, and you arrived at a sub-optimal outcome.

  **Phase 2: Defining Superrationality (10 Mins)**
  *   Explain Hofstadter's term. It is **not** altruism.
  *   **Altruism:** "I submit one ticket because I want *you* to win." (Self-sacrifice).
  *   **Superrationality:** "I submit one ticket because I know *I* am rational. I assume *you* are rational. If there is a logical reason to submit one, we will both find it. If I decide to spam tickets, I must assume you will too. Therefore, spamming guarantees the low payout."
  *   *Key Distinction:* Superrationality is selfish. It attempts to maximize *your* payout by leveraging the predictability of others' reasoning. It feels like magic ("How does my choice control theirs?"), but it is actually a bet on logical correlation.

  **Phase 3: What This Is Not (10 Mins)**
  *   **Not Kant:** Kant's Categorical Imperative is moral ("Act only according to that maxim whereby you can... will that it should become a universal law"). Superrationality is predictive ("If I think this, they will think this"). One is duty; the other is probability.
  *   **Not Reciprocity:** In a Repeated Game (Iterated Prisoner's Dilemma), I cooperate because I want you to cooperate *next time*. Here, there is no next time. There is no punishment mechanism. The only "punishment" is the logical consequence of our shared reasoning.
  *   **The "Clone" Assumption:** Superrationality only works if you believe the other players are running the same "software" as you. If you think the room is full of irrational gamblers, superrationality fails. You must defect to protect yourself.

  **Phase 4: The Platonia Telegram (5 Mins)**
  *   Describe the original 1980s *Omni* magazine puzzle Hofstadter proposed.
  *   **The Setup:** 20 people. $1 Billion prize. To win, you must send a telegram. If *more than one* person sends a telegram, *no one* wins.
  *   **The Difference:** Our game allows partial winning (dilution). Platonia is binary (Win/Nothing).
  *   **The Lesson:** Platonia forces the issue of identity. If I am superrational, I know that if I send the telegram, everyone else will too. Therefore, I must not send it. But if I don't, and someone else does, I lose. It creates a paralysis that our "dividend" game softens. Our game lets you "hedge" (submit 2 or 3 tickets). Platonia demands perfect coordination without communication.

  ---

  ### 4. What Will Go Wrong (And Recovery)

  **Failure 1: The "Spammer"**
  *   *Scenario:* One participant submits all 5 tickets immediately, grinning.
  *   *Effect:* It tanks the dividend and validates the Nash Equilibrium.
  *   *Recovery:* Do not shame them. Use them. "This person played standard rationality perfectly. They likely made the most money in the room. This proves why the system collapses. They are the control group."

  **Failure 2: The "Altruist"**
  *   *Scenario:* Someone says, "I only submitted one because I wanted the group to do well."
  *   *Effect:* Confuses superrationality with kindness.
  *   *Recovery:* "That is noble, but that isn't superrationality. Superrationality is submitting one ticket because you calculated it yields the highest *personal* return, assuming we are all clones. If you did it for the group, you acted morally, not logically."

  **Failure 3: Math Confusion**
  *   *Scenario:* People don't understand the voucher vs. ticket value.
  *   *Recovery:* Have a pre-calculated table on the whiteboard showing "If Total Tickets = X, Value per Ticket = Y." Update it live as you count.

  ---

  ### 5. The Candid Limitation

  You must end with this admission. It is the most important intellectual honesty of the session.

  **The Missing Feature: Identity.**
  "This game cannot reproduce the core engine of superrationality: **The belief that we are identical.**
  In Hofstadter's theory, I choose to cooperate not because I trust you, but because I recognize myself in you. I assume that if *I* find a logical reason to cooperate, *you* will find the exact same reason.
  In this room, you don't believe that. You look at the person next to you and think, 'They might be an economist,' or 'They might be a gambler,' or 'They don't care.'
  Because you do not truly view each other as logical clones, superrationality is impossible here. You *must* play standard game theory to protect yourselves.
  **I have to supply the faith.** I have to convince you that your reasoning is not unique to you, but universal. Without that faith, superrationality is just wishful thinking. With it, it is the only way to escape the trap."

