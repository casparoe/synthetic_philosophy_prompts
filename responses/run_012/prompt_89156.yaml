answer: |-
  1. **Question:** You locate the epistemic defect of conspiracy theorizing in a distorted prior over agency rather than in the processing of evidence. But if a believer cites genuine anomalies to justify their high agency prior, isn't the prior itself a rational response to their total evidence, rather than an independent distortion?

     **Follow-up:** *[Anticipating her move to distinguish between the evidence cited and the weight assigned to it]*: If the weight assigned is the defect, but that weight is only visible in the conclusions they draw, haven't you simply relocated the judgment from the belief's content to the believer's psychology without changing the criteria for evaluation?

  2. **Question:** You reject the particularist claim that "conspiracy theory" names no unified epistemic kind, yet you admit the agency-prior is not directly inspectable and must be inferred from a person's explanatory practice. Given that we only access that practice through the specific content of their beliefs, how does your thesis escape collapsing into the particularism you reject?

     **Follow-up:** *[Anticipating her move to insist on structural features over content]*: If the structure is only legible through the content, doesn't identifying the structure require you to already know which contents count as conspiracy theories, thereby making the agency-prior a redescription of the category rather than an independent explanation of it?

  3. **Question:** Consider historical cases where conspiracy theories turned out to be true, such as COINTELPRO or Tuskegee. On your view, did those believers possess the defective agency-prior, or does the truth of the theory retroactively validate the prior probability they assigned to coordinated intention?

     **Follow-up:** *[Anticipating her move to argue that rational updating distinguishes the two]*: If the distinction lies in their willingness to update upon counter-evidence, doesn't that mean the defect lies in their relationship to falsification after all, rather than in the initial prior over agency?

  4. **Question:** Intelligence analysts, forensic accountants, and investigative historians are professionally trained to assign high prior probabilities to coordinated intention and low probabilities to coincidence. Is there a meaningful epistemic difference between their professional skepticism and the agency-prior you diagnose as pathological, or is conspiracy theorizing merely the amateur version of legitimate suspicion?

     **Follow-up:** *[Anticipating her move to distinguish based on institutional accountability or evidence thresholds]*: If the difference is merely one of degree or institutional context, doesn't that suggest the agency-prior is continuous with ordinary reasoning, undermining your claim that it represents a distinctive epistemic kind?

  5. **Question:** You argue that the agency-prior is not directly inspectable but must be inferred from the shape of a person's overall explanatory practice. If the prior is unobservable except through its effects, what prevents your thesis from functioning as an unfalsifiable shield that protects itself from counter-example by attributing any deviation to a hidden structural flaw?

     **Follow-up:** *[Forcing the descriptive/normative choice]*: **[Real Work 1]** You describe this as a defect in rationality, but if the prior is only identifiable by the fact that it leads to beliefs you deem irrational, are you offering a descriptive account of cognitive architecture, or are you smuggling in a normative claim about how we ought to allocate explanatory trust under the guise of psychological description?

  6. **Question:** If the agency-prior is the root epistemic failure, and you wish to intervene in the spread of conspiracy theorizing, how do you propose we identify this prior in real-time? Presumably, we cannot wait for the theory to be debunked to confirm the prior was distorted.

     **Follow-up:** *[Pressing for a third-party diagnostic]*: **[Real Work 2]** You've suggested we look at the "shape of explanatory practice," but can you state a specific diagnostic criterion that a third party could apply to a text or argument *without* already knowing whether the theory in question is true or false, or does your method require hindsight to function?

  7. **Question:** A key component of your thesis is the deflated probability assigned to "institutional drift" or incompetence. Given the documented history of bureaucratic failure, isn't a high agency prior sometimes a rational correction against a naive trust in institutional competence rather than a distortion of probability?

     **Follow-up:** *[Anticipating her move to differentiate between specific and general distrust]*: If the rationality depends on the specific context of the institution, doesn't that return us to a particularist assessment where the epistemic status depends on the object of the theory rather than the structure of the reasoning?

  8. **Question:** You treat the agency-prior as content-independent, yet the probability of agency is inherently tied to the content of the event in question; a sudden market crash warrants a different prior than a sudden weather event. How can the prior be general if the appropriate probability of agency is always sensitive to the specific domain of inquiry?

     **Follow-up:** *[Anticipating her move to argue for a domain-general disposition]*: If the disposition is domain-general, how do you account for the fact that many conspiracy theorists exhibit high skepticism of agency in their daily lives while inflating it only for political or scientific events, suggesting the prior is context-triggered rather than structural?

  9. **Question:** If the characteristic failure is an inflated prior over agency, does your thesis imply that the most effective corrective is to provide evidence against the specific conspiracy, or to somehow recalibrate the believer's baseline expectation of how the world works?

     **Follow-up:** *[Anticipating her move to suggest recalibration is necessary but difficult]*: If recalibration is required, and that recalibration involves trusting institutional explanations more, aren't you asking the believer to adopt a different prior over institutional honesty, which is itself a contested empirical claim rather than a neutral epistemic rule?

  10. **Question:** Does the agency-prior thesis apply equally to religious belief or ideological dogma, where coordinated intention (e.g., of a deity or a class enemy) is also posited against coincidence, or is the defect unique to what we colloquially call conspiracy theories?

      **Follow-up:** *[Anticipating her move to restrict the scope to empirical claims]*: If you restrict it to empirical claims, doesn't that require you to draw a boundary around which claims are empirical, a boundary that conspiracy theorists typically dispute, thereby making your diagnosis dependent on a demarcation they reject?
