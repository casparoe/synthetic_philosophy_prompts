answer: |-
  You have put your finger on a very specific, sophisticated epistemic failure. You are correct that "confirmation bias" is too broad, and that the standard "reference class problem" describes the *difficulty* of choosing a group, not the *manipulation* of that choice.

  There isn't one single Latin term that covers this perfectly, but there are three concepts that, when layered together, describe exactly what you are seeing.

  ### 1. The Colloquial Name: "Reference Class Tennis"
  The most precise term for the social dynamic you described is **Reference Class Tennis**.

  This term (popularized in rationalist circles by Scott Alexander, drawing on the work of Robin Hanson) describes a debate where two parties agree that "base rates" or the "outside view" matter, but they fight over *which* reference class to use.
  *   **Player A:** "This startup will fail; 90% of startups fail in year one." (Reference class: *All startups*)
  *   **Player B:** "No, it will succeed; 90% of startups founded by repeat entrepreneurs with VC backing succeed." (Reference class: *Funded repeat-founder startups*)

  As you noted, the game is won by whoever can narrow or widen the category *after* seeing the outcome they want to predict. It is the weaponization of the reference class problem.

  ### 2. The Logical Fallacy: The Texas Sharpshooter
  The underlying logical error is the **Texas Sharpshooter Fallacy**.

  The metaphor is a shooter firing randomly at a barn wall, then walking up and drawing a bullseye around the tightest cluster of bullet holes to claim they are a sharpshooter.
  *   **The Shots:** The four centuries of historical states.
  *   **The Bullseye:** The specific subset of states that "look like us" (which is defined only after seeing which ones fell).

  Your friend is drawing the target around the clusters of "fallen states" and ignoring the "standing states" as outliers. In your company example, you are drawing the target around "doomed companies" or "surviving companies" depending on which emotional outcome you prefer.

  ### 3. The Cognitive Mechanism: Hindsight Bias (Creeping Determinism)
  You identified a crucial detail: *"'different' always turned out to be something you can only spot after you already know how it ended."*

  This is **Hindsight Bias**, specifically a subtype sometimes called **Creeping Determinism**. Once we know the outcome (the state fell), our brain rewrites the past to make the outcome seem inevitable. We scour the history of that state for "warning signs" (debt, unrest, corruption) and declare those the defining features of the reference class.

  If the state *hadn't* fallen, we would have scanned the same history, found the same debt and unrest, but labeled them "resilience" or "managed risk." The criteria for the group are not pre-existing features; they are post-hoc stories stitched together from the outcome.

  ***

  ### The Carving: Legitimate Analogy vs. This Fallacy

  You asked for the boundary where a legitimate analogy stops and this begins. In forecasting and statistics, a reference class is considered **valid** only if it meets two criteria that your examples violate:

  **1. Pre-commitment (The "Blind" Test)**
  *   **Legitimate:** You must define the criteria for the comparison group *before* you look at the outcomes.
      *   *Example:* "We will compare our company to all SaaS companies with >50 employees and <$10M revenue *as of Jan 1, 2020*." Then you check who survived.
  *   **The Fallacy:** You look at the survivors and non-survivors first, then tweak the criteria until the group yields the prediction you want.
      *   *Example:* "We are like the survivors... oh wait, that makes us look doomed. Okay, we are actually like the ones that survived a bad patch."

  **2. Causal Mechanism vs. Surface Resemblance**
  *   **Legitimate:** The features that put an entity in the reference class must have a plausible *causal* link to the outcome, independent of the outcome itself.
      *   *Example:* "States with hyperinflation >1000% tend to collapse." (Hyperinflation is a mechanism that causes collapse).
  *   **The Fallacy:** The features are tautological or only visible in hindsight.
      *   *Example:* "States that were 'destined to fail' collapsed." (How do we know they were destined? Because they collapsed).
      *   *Your Friend's Case:* If the criteria for "like us" are things like "had a period of unrest," that applies to almost *all* states (both fallen and surviving). If the criteria are "had a period of unrest that *led to collapse*," that is cheating, because you've baked the outcome into the definition.

  ### Summary
  If you need a single label for your notes, **Reference Class Tennis** is the most accurate description of the *argument*. **Texas Sharpshooter** is the most accurate description of the *logic*.

  You are right to distrust this. A base rate is only useful if the reference class is chosen based on **features known at the start**, not **stories constructed at the end**. If you can change the comparison group to change the prediction, you aren't doing statistics; you're doing astrology with spreadsheets.
