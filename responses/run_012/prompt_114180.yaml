      The St. Petersburg paradox is not a single problem but a conflation of three distinct horns that must be disentangled before any resolution can be evaluated. The first horn is arithmetic: the expected monetary value diverges because the payoff grows exponentially while probability decays linearly. The second is descriptive: empirically, agents refuse to pay large sums to play. The third is normative: is this refusal rational, or are agents making a systematic error in judgment? The classical logarithmic utility resolution addresses the arithmetic horn by transforming monetary payoffs into utility units that grow slowly enough to ensure convergence. However, this move purchases finite expected utility at a significant theoretical price. If utility is bounded to prevent divergence, the agent must become indifferent between sufficiently large sums of money. This violates the principle of dominance, where more money should always be preferred to less, implying that beyond a certain threshold, an extra billion dollars adds no value to the agent's life. Alternatively, if one retains unbounded utility but discounts the tail probabilities to force convergence, one violates the continuity axiom or the additivity of probabilities, undermining the structural integrity of expected utility theory itself.

      The vulnerability of unbounded utility is demonstrated by the fact that the paradox can be rebuilt against any such function. For any unbounded utility function, one can construct a super-Petersburg lottery where the payoffs are calibrated in utility units rather than dollars to ensure the expected utility diverges. This suggests that the classical resolution is not a true dissolution of the paradox but a redescription of risk aversion, shifting the problem from money to the structure of preference. The finite casino exercise clarifies the role of the infinite bankroll assumption. If the casino cap is C, the game lasts at most log2(C) rounds. The expected value becomes the sum of probabilities times payoffs up to this cap, which calculates to approximately one-half times log2(C). This shows the fair price grows logarithmically with the bankroll. Consequently, for any realistic reserve, the fair price is modest, suggesting the paradox relies heavily on the physically impossible premise of infinite reserves rather than a flaw in rationality per se.

