      The St. Petersburg paradox is often dismissed in introductory contexts by invoking a concave utility function, typically logarithmic, to demonstrate that the expected utility of the game converges to a finite value. For this exam, you are forbidden from offering this classical resolution as a final solution. Instead, you must dissect the paradox by holding three distinct considerations in view simultaneously. First, distinguish between the arithmetic divergence of expected monetary value, the descriptive fact of human refusal to pay large entry fees, and the normative question of whether such refusal is rational. Second, analyze the theoretical price paid by any resolution that forces convergence. If you argue for bounded utility, explain what this implies about an agent's attitude toward arbitrarily large stakes and whether this violates dominance principles. If you argue for discounting small probabilities, explain what this costs the axioms of expected utility theory regarding continuity or additivity. Third, address the rebuildability of the paradox. Explain why any unbounded utility function remains vulnerable to a modified lottery that generates infinite expected utility, and discuss whether the classical resolution is therefore a genuine solution or merely a redescription of risk aversion.

