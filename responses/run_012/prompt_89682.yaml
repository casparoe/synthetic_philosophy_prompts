  This variant changes the problem from imperfect recall to a problem of *intrapersonal credibility*. The humor highlights that a precommitment device (the note) is useless if the agent reading it cannot verify the conditions under which it was written, because the lack of memory prevents distinguishing a valid command from a mistaken one. It shows that without the ability to condition on location, even external memory cannot restore the optimal conditional strategy.
