          *   *Proposed Solution:* Group wants a lottery for the poorer half. Contractor says this reduces overall efficiency.
          *   *Current State:* Stalemate. "Math forbids it" vs. "That's a dodge."
      *   **The Task:** Diagnose the disagreement (Substantive? Verbal? Different Questions? Legitimacy?). Evaluate the user's hypothesis (Forecasting vs. Rationing + Consent). Suggest what counts as progress. Identify doubts/limitations. End with a specific format.
      *   **Constraints:** No reading lists, no references, no paper names. Direct, clear analysis. Specific ending format.

  2.  **Deconstruct the Disagreement:**
      *   *The Math:* The friend is right. This is the Chouldechova (2017) / Kleinberg et al. (2016) impossibility result. If Group A has a 10% violation rate and Group B has a 50% violation rate, a calibrated score cannot have equal true positive rates (recall) for both without sacrificing calibration or overall accuracy.
      *   *The Contractor's Stance:* They view the tool as a *predictor*. Their goal is efficiency (maximize violations found per inspection). Calibration ensures that a "high risk" label means the same thing regardless of neighborhood. They see fairness as "treating the score the same."
      *   *The Group's Stance:* They view the tool as a *resource allocator*. Inspections are scarce. They want equal protection/enforcement. They see fairness as "equal outcome in safety."
      *   *The User's Hypothesis:* Contractor = Forecasting problem. Group = Rationing problem. Underneath = Consent/Legitimacy. The math is a red herring.

  3.  **Evaluate the Hypothesis:**
      *   *Forecasting vs. Rationing:* This is strong. The contractor optimizes for *predictive parity* (calibration). The group optimizes for *equal opportunity* (recall). These are indeed different objectives for the system. One asks "Is the number right?" The other asks "Is the protection distributed right?"
      *   *Consent/Legitimacy:* This is the deeper layer. Even if the math were solvable, the community feels imposed upon. The "math forbids it" argument is often used to shut down political debate about *which* mathematical constraint to prioritize.
      *   *Is the math a red herring?* Not entirely. It's a hard constraint. You *cannot* have both. But treating it as the *end* of the conversation is the dodge. The math dictates a trade-off, not a solution. The choice of trade-off is political.
      *   *Verbal?* Partially. "Fairness" is being used differently. But it's more than just words; it's different objective functions.
      *   *Different Questions?* Yes. "How accurate is this?" vs. "Who gets protected?"
      *   *Substantive?* Yes. It's about who bears the burden of error (false negatives in poor areas vs. lower overall efficiency).

  4.  **Synthesize the Diagnosis:**
      *   The user's hypothesis is largely correct but needs refinement. It's not just that the math is a red herring; it's that the math *creates* the political choice. The contractor pretends the math dictates the *outcome*, whereas the math only dictates the *trade-off*.
      *   The core disagreement is **Substantive** (which error to tolerate) wrapped in a **Verbal** confusion (definition of fairness) regarding **Different Questions** (prediction vs. allocation).
      *   **Legitimacy** is the fuel. If the community trusted the city, they might accept the trade-off. Because they don't, the trade-off looks like discrimination.

  5.  **Determine "Progress":**
      *   Progress isn't fixing the score (math says you can't have it all).
      *   Progress is acknowledging the trade-off explicitly.
      *   Progress is shifting the question from "Is the tool biased?" to "Which constraint do we prioritize: Calibration or Equal Opportunity?"
      *   Evidence needed: Base rate data. If base rates are actually the same, the math argument fails. If they differ, the trade-off is real.
      *   Change in ask: Stop asking for a "bias-free" score (impossible). Start asking for a *choice* of fairness metric codified in policy.

  6.  **Identify Doubts/Limitations:**
      *   *Doubt 1:* Are base rates actually different? If the tool is already biased in its *inputs* (e.g., using complaint data which is higher in wealthy areas due to tenant awareness), the "base rate" isn't ground truth, it's biased measurement. This undermines the "arithmetic" defense.
