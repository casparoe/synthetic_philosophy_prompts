answer: |-
  **JOINT STATEMENT ON THE METAPHYSICS OF CAUSATION BY OMISSION**

  **Prepared by:** The Inclusionist and The Exclusionist
  **Date:** October 24, 2023
  **Context:** Adversarial Collaboration for the Metaphysics Reading Group

  ### I. AGREED CLAIMS

  We, the undersigned, agree to the following propositions as the baseline for our dispute. We sign these without embarrassment, acknowledging that they do not resolve our disagreement but prevent us from talking past one another.

  1.  **Scope of Dispute:** This dispute is not about moral responsibility, legal liability, or blame. The Exclusionist does not deny that the night guard was negligent, nor that he should be punished or sued. The Inclusionist does not claim the guard is *more* responsible than the intruder. We are debating the metaphysical structure of the world, not the allocation of praise or censure.
  2.  **Shared Data:** We agree that omission-talk is ubiquitous and indispensable in ordinary language, engineering incident reports, clinical morbidity reviews, and legal statutes. We are not attempting to eliminate this language. We are debating whether this language tracks mind-independent causal relations or serves a different function (e.g., explanation, norm-enforcement).
  3.  **Counterfactual Dependence:** We agree on the truth conditions for counterfactuals. To say "E counterfactually depends on C" means: if C had not occurred, E would not have occurred (or would have been significantly less likely). We agree that in the standard cases (e.g., the guard), the outcome counterfactually depends on the omission. We disagree on whether this dependence constitutes *causation*.
  4.  **Causal Processes:** We agree on the standard definition of a causal process: a spatiotemporally continuous chain of events involving the transfer or conservation of physical quantities (energy, momentum, information). We agree that omissions do not exhibit this structure in the standard sense. We disagree on whether this structural absence disqualifies them as causes.
  5.  **Explanatory Relevance:** We agree that citing an omission is often the best way to explain an outcome. If asked "Why did the patient die?", "They did not receive antibiotics" is a correct and useful answer. We disagree on whether "explanatorily relevant" is synonymous with "cause."

  ### II. PRECISE STATEMENTS OF DISAGREEMENT

  We diverge on three specific cruxes. Each statement below is phrased so that the proponent accepts it as an accurate statement of their view.

  **Crux 1: The Nature of the Relata**
  *   **Inclusionist:** Causal relata can be facts or negative events. A cause is whatever makes the difference to the effect, regardless of whether it involves positive energy transfer. "The guard's not walking" is a fact about the world, and facts can be causes.
  *   **Exclusionist:** Causal relata must be occurrent events or standing states. A cause must be something that *happens* or *obtains*. "The guard's not walking" is not an event; it is the non-occurrence of an event. Therefore, it cannot stand in a causal relation.

  **Crux 2: Difference-Making vs. Production**
  *   **Inclusionist:** Counterfactual dependence is sufficient for causation. If the outcome would have been different had the omission not obtained, the omission is a cause. No physical mechanism connecting the absence to the effect is required.
  *   **Exclusionist:** Difference-making is necessary but not sufficient. Causation requires production, transmission, or a mechanism. An omission can be a *condition* for the cause to operate, but it is not itself a cause. The intruder climbing the fence produced the break-in; the guard's absence merely failed to prevent it.

  **Crux 3: The Role of Norms**
  *   **Inclusionist:** Norms and expectations help us *select* which omission to cite from a large field of causal absences, but they do not *constitute* the causation. The causal relation exists independently of our judgment; our judgment merely highlights it.
  *   **Exclusionist:** The fact that we only cite omissions when there is a normative expectation (duty, design, biological function) proves that the causation is not objective. If causation were mind-independent, the absence of *any* preventative factor would be a cause. Since we select based on norms, the "causation" is actually a pragmatic or normative judgment disguised as metaphysics.

  ### III. TEST CASES, PREDICTIONS, AND CONDITIONS FOR REVISION

  For each crux, we identify the cases that bear most heavily on it. We record the observation we agree to look for, and each side's prediction of what that observation will show.

  #### Testing Crux 1 & 2: The Grain Problem and the Automated Watchdog
  **The Cases:**
  1.  **The Night Guard:** The guard failed to walk the perimeter. He also failed to sing opera, failed to juggle, and failed to sleep. All are counterfactually sufficient (had he sung, the intruder might have been scared off).
  2.  **The Automated Watchdog:** A safety system fails because a status flag was never written by a sub-routine. No human agent omitted anything; a line of code simply did not execute.

  **Agreed Observation:** We look for a principled distinction between "not walking" (cited as cause) and "not singing" (not cited), and between human omission and code non-execution.

  **Predictions:**
  *   **Inclusionist:** I predict that "not writing the flag" is a literal cause in the Watchdog case, proving agency is irrelevant. Regarding the Grain Problem, I admit there are infinitely many absentee causes, but only those relevant to the *actual mechanism of failure* count. "Not writing the flag" is causally specific; "not singing" is not, because singing was never part of the system's causal architecture.
  *   **Exclusionist:** I predict that in the Watchdog case, the cause is the *presence* of a bug or a conflicting process that prevented the write, not the absence of the write itself. Regarding the Grain Problem, the fact that you cannot distinguish "not walking" from "not singing" without appealing to norms proves my point: there is no metaphysical difference between them, only a pragmatic one.

  #### Testing Crux 2: Probabilistic Causation (The Clinical Case)
  **The Case:**
  *   **The Antibiotic:** A patient dies. Administration of the antibiotic would have reduced mortality risk from 30% to 10%. There is no strict "but-for" causation (the patient might have died anyway), but the omission raised the chance of death.

  **Agreed Observation:** We look at whether we treat the omission as a cause of *death* or a cause of *increased risk*.

  **Predictions:**
  *   **Inclusionist:** I predict the omission is a cause of the death. Causation can be probabilistic. The absence of the drug altered the objective chances, and the outcome realized that risk.
  *   **Exclusionist:** I predict the omission is a cause of the *risk profile*, but the cause of the *death* is the pathogen's activity. The absence of the drug allowed the pathogen to operate; it did not produce the death.

  #### Testing Crux 3: Norms and Prevention (The Lifeguard and The Oxygen)
  **The Cases:**
  1.  **The Prevented Prevention:** Lifeguard A does not swim out because Lifeguard B is already swimming. B turns back. The drowning occurs. A's omission was prevented by B's action.
  2.  **The Oxygen Case:** A fire goes out because oxygen is removed. We readily say "lack of oxygen caused the fire to extinguish."

  **Agreed Observation:** We look for consistency in how we treat "absence of prevention" (Lifeguard) versus "absence of fuel/oxidizer" (Oxygen).

  **Predictions:**
  *   **Inclusionist:** I predict both are causes. In the Lifeguard case, A's readiness was part of the safety system; its unavailability is a cause. In the Oxygen case, the absence is a cause. The metaphysics is the same; the norms just differ.
  *   **Exclusionist:** I predict a sharp distinction. In the Oxygen case, the "lack of oxygen" is actually a positive state of the environment (a chemical composition below a threshold). In the Lifeguard case, A's not swimming is a true non-event. I accept the Oxygen case as a positive state description; I reject the Lifeguard case as a causal attribution.

  ### WHAT WOULD MOVE US

  We specify the conditions under which we would abandon or significantly modify our positions.

  **For the Inclusionist:**
  *   **The Challenge:** The Grain Problem. If omissions are causes, there are too many of them.
  *   **Condition for Revision:** If it can be demonstrated that there is no principled, non-pragmatic limit on which absences count as causes—that is, if I cannot distinguish "not walking" from "not singing" without appealing to human interest or norms—I must concede that the "causation" is not mind-independent. I require a metaphysical filter for absences, not just a pragmatic one.

  **For the Exclusionist:**
  *   **The Challenge:** The Oxygen Case. You accept "lack of oxygen" as a cause but reject "lack of a guard."
  *   **Condition for Revision:** If it can be demonstrated that "lack of oxygen" is not reducible to a positive state of the remaining gases or the burning material, I must concede that true absences can be causes. I need to show, without special pleading, that oxygen depletion is a positive event while guard depletion is not. If the distinction rests solely on linguistic convention, my position collapses into the Inclusionist's.

  ### VERBAL DISPUTE ASSESSMENT

  We acknowledge that part of our quarrel is verbal, though not all of it.

  **The Verbal Component:**
  We agree that the word "cause" is used in two distinct jobs:
  1.  **Metaphysical Glue:** The physical relation that binds events in the world (Exclusionist's focus).
  2.  **Explanatory Lever:** The information we provide to answer "Why?" (Inclusionist's focus).

  **Translation Manual:**
  *   When the **Inclusionist** says "The guard's omission caused the break-in," the **Exclusionist** translates this as: "The guard's omission was the most salient explanatory factor for the break-in, given our normative expectations, though the metaphysical cause was the intruder's action."
  *   When the **Exclusionist** says "The omission was not a cause," the **Inclusionist** translates this as: "The omission does not involve a transfer of energy, though it is counterfactually necessary and explanatorily primary."

  **The Residual Dispute:**
  Even after this translation, a metaphysical disagreement remains. The Inclusionist insists that counterfactual dependence *is* a real relation in the world, akin to energy transfer. The Exclusionist insists that counterfactual dependence is a logical relation between propositions, not a physical relation between events. We agree to disagree on whether logic can be causal.

  **Signed:**

  _________________________
  (The Inclusionist)

  _________________________
  (The Exclusionist)
