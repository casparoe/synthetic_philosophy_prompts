          *   Kind vs. Continuum question.
          *   Identify the single most constraining requirement.
          *   Usability constraint (must work *in the room* for adjudication, not just extensionally correct from a god's-eye view).
          *   Format: No bibliography. One short paragraph at the end on procedural/genealogical/coherentist accounts.

  2.  **Deconstruct the Core Tension:**
      *   The user identifies the central epistemic problem: "Bias" implies distortion/error, but we use it rhetorically against views we disagree with without conceding our own are false.
      *   The "Internal/External" problem: A theory needs to be usable by participants *in* the debate (internal), but bias is often defined by causal history inaccessible to the agent (external).
      *   The "Truth" problem: If bias = deviation from truth, we need access to moral truth to identify bias. If we don't have access, "bias" becomes just "disagreement."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Grubby Process/Right Outcome Case.* (User mentioned this). Theory must distinguish between lucky correctness and justified belief. If I hate group X for racist reasons (bias) but accidentally make a correct rule that helps them, is the judgement biased? Yes, the *process* is biased, even if the *output* aligns with truth.
      *   *Requirement 2: Adaptive Preferences (Fox & Grapes).* (User mentioned this). Theory must distinguish between a preference formed by oppression vs. a genuine commitment. If I say "I don't want rights" because I was taught I don't deserve them, is that a preference or a bias-distorted judgement?
      *   *Requirement 3: The Rhetorical Stopper.* (User mentioned this). Calling something "bias" ends conversation. A usable theory must allow for the possibility of *mutual* bias recognition without ending the dialogue. It can't be a conversation-ender by definition.
      *   *Requirement 4: Truth-Independence (The Big One).* (User mentioned this). We need to identify bias without assuming our own moral view is the True one. Otherwise, "bias" just means "false."
      *   *Requirement 5: Inescapability.* (User mentioned this). I know I have a bias (e.g., towards my children). Can I still make valid moral judgments? Theory must allow for *acknowledged* bias that doesn't invalidate the judgement entirely.
      *   *Requirement 6: Internal Usability.* (User's purpose). The theory must be applicable by the agents involved, not just an observer.

  4.  **Identifying Trade-offs and Incompatibilities:**
      *   *The Big Clash:* **Truth-Independence vs. Normative Force.** If we define bias without reference to moral truth (to avoid arrogance), we lose the ability to say the bias leads to *error*. If we define it by reference to truth, we can't use it in disagreement without begging the question.
      *   *The Second Clash:* **Internal Usability vs. Causal History.** Bias is often about causal history (genealogy). Agents don't have introspective access to their causal history. So a theory based on history is extensionally good but internally unusable.

  5.  **Refining the List (Categorization):**
      *   *Non-Negotiable:* Must handle the "bias without truth" problem. Must handle the "grubby process" case.
      *   *Camp-Specific:* Realists will want truth-tracking. Expressivists will want consistency with attitude.
      *   *Kind vs. Continuum:* Likely a continuum, but the "line" is the political move.

  6.  **Addressing the Specific "One Requirement" Question:**
      *   Which requirement kills the most views? It's the **Non-Circular Identification Constraint** (identifying bias without presupposing the truth of the evaluator's moral view). This kills simple error-theories of bias.

  7.  **Addressing the Three Accounts (Procedural, Genealogical, Coherentist):**
      *   *Procedural:* Good for usability, bad for deep bias (can follow rules and be biased).
      *   *Genealogical:* Good for "grubby process," bad for usability (can't know history) and truth-independence (need to know what counts as distortion).
      *   *Coherentist:* Good for internal consistency, bad for adaptive preferences (oppressed preferences can be coherent).

  8.  **Review against Constraints:**
      *   *Skip bibliography?* Yes.
      *   *One short paragraph at end?* Yes.
      *   *Loudly state incompatibilities?* Yes.
      *   *Focus on usability?* Yes.
      *   *Tone:* Professional, philosophical, direct, acknowledging the difficulty.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just list abstract principles. The user asked for *cases attached*.
      *   *Correction:* Ensure the distinction between "preference" (taste) and "commitment" (moral) is addressed, as that's part of the prompt's title, though the focus is heavily on bias.
      *   *Emphasis:* Highlight the "View from Nowhere" problem. The theory needs to work from *within* the moral perspective.

  10. **Final Structure:**
      *   Intro acknowledging the difficulty.
      *   Section 1: The Non-Negotiables (with cases).
      *   Section 2: The Camp-Specific/Contested Desiderata.
      *   Section 3: The Incompatibilities (Loudly).
      *   Section 4: Kind vs. Continuum & The Line.
      *   Section 5: The Single Most Constraining Requirement.
      *   Section 6: The Three Accounts (Short Paragraph).

  *(Self-Correction on "Preference vs Commitment"):* The prompt asks about Bias vs Preference/Commitment/Taste. I need to ensure the desiderata cover distinguishing *bias* from *legitimate partiality* (commitment) and *mere taste* (preference).

  *Refining the "Truth" constraint:* The user says "bias seems to mean off the truth, but we want the word to do work against people whose moral views we think are false, without assuming our own are true." This is the crux. The desideratum must be "Identification without Conviction."

  *Refining "Usability":* If the theory requires knowing the causal history, it fails usability. If it requires knowing the moral truth, it fails neutrality. This is the tension.

