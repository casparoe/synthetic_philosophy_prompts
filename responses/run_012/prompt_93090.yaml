answer: |-
  Here is a list of desiderata for a theory distinguishing moral bias from moral preference/commitment, tailored to your working group's constraints.

  ### 1. Non-Negotiable Desiderata (The "Must-Haves")
  *These are requirements any theory must meet to avoid immediate counter-example or practical uselessness.*

  *   **The Lucky Rightness Constraint (Process vs. Output)**
      *   **Case:** A judge denies a parole application because of a subconscious racial animus (grubby process). Coincidentally, the prisoner is highly likely to reoffend based on neutral risk factors (right output).
      *   **Requirement:** The theory must classify the judgement as *biased* despite the correct outcome. Bias must attach to the etiology or structure of the judgement, not solely its truth-value.
  *   **The Non-Circular Identification Constraint (Truth-Independence)**
      *   **Case:** Person A (utilitarian) calls Person B (deontologist) "biased" because B prioritizes rights over utility. B calls A "biased" for ignoring rights.
      *   **Requirement:** The theory must provide criteria for identifying bias that do not presuppose the truth of the accuser's substantive moral view. If "bias" just means "moral error," the concept is redundant in disagreement. We need to identify the *distortion* without first settling the *truth*.
  *   **The Adaptive Preference Constraint (The Fox and the Grapes)**
      *   **Case:** A person raised in a rigid caste system claims they "prefer" not to associate with higher castes, citing comfort. In reality, this preference was formed by systemic suppression of alternative options.
      *   **Requirement:** The theory must distinguish between a legitimate moral commitment/preference and one that is the *product* of the distortion it justifies. It cannot treat all stable preferences as immune to bias charges.
  *   **The Internal Usability Constraint**
      *   **Case:** Two colleagues are in a heated debate. Each suspects the other is biased.
      *   **Requirement:** The criteria for bias must be accessible to the participants *during* the deliberation. If the theory requires a god's-eye view of causal history or moral truth that is unavailable to the agents, it fails your purpose of adjudicating in the room.

  ### 2. Contested/Camp-Specific Desiderata
  *These are often desired, but different epistemological camps will reject them. Flag these as points of friction.*

  *   **The Phenomenological Constraint**
      *   **Desideratum:** Bias should feel different from commitment. Commitment feels like insight; bias feels like compulsion.
      *   **Camp Conflict:** **Realists** may accept this. **Skeptics/Debunkers** will reject it, noting that bias often feels exactly like conviction (the "illusion of objectivity"). If you require the agent to *feel* biased, you let the most dogmatic agents off the hook.
  *   **The Correctability Constraint**
      *   **Desideratum:** A bias is something that *could* be corrected by reflection/evidence; a preference/commitment is resistant to evidence by definition.
      *   **Camp Conflict:** **Internalists** want this. **Externalists** note that some biases (e.g., implicit association) are incorrigible by mere reflection. If you require correctability, you exclude unconscious structural bias.
  *   **The Domain Specificity Constraint**
      *   **Desideratum:** Moral bias must look different than cognitive bias. (e.g., Confirmation bias is cognitive; Favoritism towards kin is moral).
      *   **Camp Conflict:** **Naturalists** want to collapse these into one category of error. **Non-Naturalists** insist moral bias involves a distortion of value, not just fact-processing.

  ### 3. The Incompatibilities (Say This Loudly)
  *These are the trade-offs where you cannot satisfy all desiderata simultaneously.*

  *   **TRADE-OFF 1: Etiological Accuracy vs. Internal Usability**
      *   **The Conflict:** To satisfy the **Lucky Rightness** and **Adaptive Preference** constraints, you need a **Genealogical Account** (looking at the causal history of the belief). However, agents in a room do not have transparent access to their own causal history.
      *   **The Cost:** If you prioritize **Internal Usability**, you must rely on proxies (like rigidity or emotional intensity), which risks misclassifying deep conviction as bias and calm bias as commitment. You cannot have a theory that is both causally precise *and* usable by the agents in real-time.
  *   **TRADE-OFF 2: Normative Force vs. Non-Circularity**
      *   **The Conflict:** To satisfy the **Non-Circular Identification** constraint, you must define bias procedurally (e.g., "ignoring counter-evidence"). But to have **Normative Force** (to actually criticize the view as distorted), you usually need to show it leads away from the truth.
      *   **The Cost:** If you stick strictly to Non-Circularity, "bias" becomes a thin label for "procedural error" that might not actually impugn the moral conclusion. If you insist on Normative Force, you inevitably sneak in substantive moral assumptions, violating Non-Circularity. **You cannot define bias as "distortion away from truth" without assuming you know the truth.**

  ### 4. Kind vs. Continuum
  *   **Verdict:** It must be treated as a **Continuum with a Politically Drawn Line.**
  *   **Reasoning:** There is no ontological break between "partiality towards my child" (commitment) and "nepotism" (bias). They differ in degree and context.
  *   **Who Draws the Line:** This is the political move. In a working group, the "line" is drawn by **reciprocal vulnerability.** The theory must allow me to call your judgement biased only if I accept the same criteria applied to me. If the line is drawn unilaterally, it is power, not epistemology.

  ### 5. The Single Most Constraining Requirement
  *   **The Requirement:** **The Non-Circular Identification Constraint.**
  *   **Why:** This rules out the most attractive views. It kills the "Truth-Tracking" account (bias = false belief). It kills the "Simple Coherentist" account (bias = incoherent belief), because a biased system can be internally coherent (e.g., a consistent racist ideology). It forces the theory to rely on *procedural* or *structural* markers (e.g., immunity to revision, selective scrutiny) which are notoriously difficult to define without smuggling in normative content.

  ### 6. Performance of Standard Accounts Against This List

  A **purely procedural account** (focusing on reasoning rules) passes Internal Usability but fails the Lucky Rightness constraint (one can follow rules and still be biased by premise selection). A **purely genealogical/debunking account** (focusing on causal history) passes Lucky Rightness and Adaptive Preference but fails Internal Usability catastrophically (agents cannot see their own causal chains) and risks violating Non-Circularity (by assuming the current environment is "neutral"). A **purely coherentist account** (focusing on fit with other beliefs) passes Internal Usability but fails the Adaptive Preference constraint (oppressed preferences often cohere perfectly with the system that oppresses them). None satisfy the list fully; the working group's job is to decide which failure is most tolerable.
