prompt: |-
  I'm in a second-year free will seminar and my prof has exactly one line she reaches for whenever compatibilism comes up: "you're only free if you could have done otherwise." Last week someone raised a Frankfurt-style case and she brushed it off — "he still could have done otherwise; the case takes away the alternative, not the ability" — and most of the room nodded like that settled something. I don't think it settles anything, and honestly I don't think that sentence is even one claim. She's also a compatiblist who likes to say that the only freedom worth having is the kind we could actually have, which I suspect is doing some quiet work in the background here.

  I know the labels already — PAP, leeway vs. source, all of it. What I want is the menu. Lay out every distinct precise claim "could have done otherwise" could be making: what kind of possibility the "could" is in each (categorical openness of the world, a counterfactual about what the agent would have done if things had gone differently, an epistemic "for all anyone knew", a claim about the agent's standing capacities or the working order of her deliberative machinery, or anything else you can cleanly distinguish), whether each reading is compatibilist or incompatibilist in effect, and whether it's trivial, contentious but defensible, or just false. Then tell me which reading she needs for "the case takes away the alternative, not the ability" to come out true, whether that's the same reading that makes the slogan a genuine constraint on freedom in the first place, and whether she's quietly sliding between two rows. Also say which reading the people who actually repeat this line in the wild most likely mean, and whether that one is worth having.

  Give it to me as a table, with these columns:

  - Reading — a short handle for the reading.
  - The claim — what exactly it asserts, in a sentence or two.
  - Kind of "could" — categorical / counterfactual / epistemic / dispositional / other (say what).
  - Verdict — trivial, defensible, or false, with a few words on why.
  - Compatibilist or incompatibilist in effect?
  - Supports her Frankfurt move? — yes / no / only if you also help yourself to another reading (name it).

  After the table, one short paragraph: your bottom line on whether she's equivocating, and if so, between which two rows.
