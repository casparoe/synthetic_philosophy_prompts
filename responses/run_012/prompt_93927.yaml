  | Reading | The claim | Kind of "could" | Verdict | Compatibilist or incompatibilist in effect? | Supports her Frankfurt move? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Categorical Openness** | At the moment of choice, multiple futures are metaphysically possible; determinism is false. | Categorical / Metaphysical | False (if determinism is true); renders her compatibilism incoherent. | Incompatibilist | **No.** Frankfurt cases assume the alternative is blocked; this reading requires it be open. |
  | **Conditional Analysis** | If the agent had chosen/willed otherwise, they would have done otherwise. | Counterfactual | Defensible (classically), but vulnerable to the "conditional fallacy" and Frankfurt cases. | Compatibilist | **No.** In Frankfurt cases, the agent *would not* have chosen otherwise (due to the intervener), so the condition fails. |
  | **Intrinsic Dispositional Ability** | The agent possesses the internal causal machinery/skill to do otherwise, even if external factors block the outcome. | Dispositional | Defensible (distinguishes ability from opportunity), though some argue it is too weak for responsibility. | Compatibilist | **Yes.** Matches her distinction: the intervener removes the *opportunity* (alternative), but the *ability* (disposition) remains intact. |
  | **Epistemic Possibility** | Given the available evidence prior to the act, the outcome was not predictable or certain. | Epistemic | Trivial. Predictability does not ground moral responsibility or control. | Compatibilist | **No.** Frankfurt cases often assume the intervener knows what you will do; epistemic uncertainty is irrelevant to the metaphysics. |
  | **Reasons-Responsiveness** | The agent's mechanism is such that, were there sufficient reason to do otherwise, they would have recognized it and acted. | Counterfactual / Dispositional hybrid | Defensible (standard semi-compatibilist move), but usually used to *reject* PAP, not save it. | Compatibilist (Semi-) | **No.** This reading typically concedes PAP is false and argues freedom requires sourcehood, not leeway. |

  **Bottom Line**
  She is equivocating, sliding between **Categorical Openness** and **Intrinsic Dispositional Ability**. She relies on the Categorical reading to make her slogan ("only free if you could have done otherwise") sound like a robust, intuitive constraint on freedom (the kind that worries students about determinism). However, when pressed by Frankfurt cases or her own compatibilism, she silently switches to the Dispositional reading to claim the "ability" survives even when the "alternative" is blocked. This allows her to keep the slogan's rhetorical weight while denying its incompatibilist consequences, but it leaves the claim unstable: the "could" that makes the slogan sound important is not the "could" that saves it from counterexample.
