      *   *Reading 3: Intrinsic Dispositional Ability.*
          *   Claim: You possess the internal causal machinery to do otherwise, even if external factors prevent the outcome.
          *   Kind: Dispositional.
          *   Verdict: Defensible (distinguishes ability from opportunity).
