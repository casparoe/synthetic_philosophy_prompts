      *   *Row 2: Conditional (Moore).*
          *   Claim: If I had chosen/willed otherwise, I would have done otherwise.
          *   Kind: Counterfactual.
          *   Verdict: Defensible but vulnerable to "conditional fallacy" objections.
          *   Effect: Compatibilist.
