  **Bottom line**
  Verdict: Reject. Confidence is high. The Sortition Standards Board will reject the Hospital Closure Review Panel. The proposal fails on two distinct dimensions evident in prior jurisprudence: it lacks deliberative support and invites entrenchment. While the Chair emphasizes representativeness, the Board's record shows that descriptive matching alone is insufficient without safeguards for equitable participation and turnover. The combination of renewable five-year terms and zero stipend creates a high risk of elite capture and burnout, mirroring the fatal flaws of the rejected Youth Budget Parliament and Neighborhood Zoning Assembly. It violates the implicit necessary conditions established across all four previous rulings.

  **The precedents and the candidate rules**
  Two latent rules explain the Board's four prior decisions. First, the **Deliberative Capacity Rule**: bodies require professional facilitation and stipends to ensure equitable voice. The Transit Jury ruling emphasized that "facilitation kept the loudest voices from dominating," and the Housing Panel included stipends. Conversely, the Youth Parliament was rejected for the "absence of support." Second, the **Democratic Hygiene Rule**: bodies must avoid self-selection and entrenchment. Approved bodies used stratified lotteries from universal pools with limited or non-renewable terms. The Housing ruling cited "rotation and representativeness." Rejected bodies drew from self-selected pools (meeting attendees, volunteers) or allowed unlimited/renewable terms; the Zoning rejection cited "self-selection and entrenchment." Both rules fit the data perfectly. The Board never approves a body that fails either test, suggesting these are conjunctive necessary conditions for legitimacy. The Transit ruling highlights capacity, while the Housing ruling highlights hygiene, proving both are active standards. These dual requirements create a high bar for institutional legitimacy.

  **What each rule predicts for the new case**
  Both rules predict rejection. Under the Deliberative Capacity Rule, the Hospital Panel fails because it offers no stipend and relies on unmoderated chat platforms, risking domination by the articulate or wealthy who can afford unpaid labor. Under the Democratic Hygiene Rule, it fails because five-year renewable terms invite entrenchment, transforming citizens into entrenched incumbents rather than rotating representatives. Even though the selection pool is stratified and representative, the tenure structure violates the anti-entrenchment principle seen in the Housing Panel approval. The proposal satisfies the selection criterion but collapses on support and tenure. Thus, the lack of facilitation undermines the deliberative quality required for binding decisions.

  **Which rule the board is probably running**
  The Board is likely prioritizing the **Democratic Hygiene Rule**. While support is consistently present in approved cases, the Housing Panel's ruling explicitly cited "rotation and representativeness" while omitting mention of the stipend in its reasoning. This suggests selection and tenure are the primary legitimating factors, with support serving as a background operational requirement. Furthermore, the rejections heavily emphasized "self-selection and entrenchment." The Chair's comment praising representativeness aligns with this priority. The Board views sortition as a safeguard against careerism, making tenure the critical variable. However, since the Hospital Panel fails the tenure test just as badly as the support test, the distinction matters less for this specific verdict than for future jurisprudence regarding binding power. It is the dominant logic.

  **The closest precedent**
  The Standing Housing Lottery Panel is the nearest analog. Both are permanent, binding bodies drawn from a stratified resident register. The analogy breaks on tenure and support. The Housing Panel had non-renewable two-year terms and stipends; the Hospital Panel proposes renewable five-year terms and no stipend. The Housing Panel was approved specifically because rotation prevented entrenchment. The Hospital Panel's renewable terms directly contradict the logic that saved the Housing Panel from the fate of the rejected Zoning Assembly. It attempts to combine binding power with the tenure structure of the rejected Youth Parliament. This makes it the critical comparison point.

  **The decisive case**
  To distinguish the rules, the Board should consider a **Volunteer Relief Corps**: stratified lottery from all residents, non-renewable one-year terms, but no stipend and no facilitation. The Democratic Hygiene Rule predicts approval (correct selection, no entrenchment). The Deliberative Capacity Rule predicts rejection (no support for equitable participation). If approved, selection and tenure are the true legitimacy drivers. If rejected, support is a non-negotiable prerequisite. This case isolates the variable of material support while maintaining democratic hygiene. It clarifies the hierarchy of values.

  **If consistency is the aim**
  To cohere with its record, the Board must reject the proposal. Approving it would sever the link between binding power and deliberative support established in the Transit and Housing cases. By rejecting, the Board adopts the principle of **Protected Sortition**: random selection alone does not guarantee democracy; it requires infrastructure to protect participants from coercion and burnout. Conversely, if they approve, they adopt **Descriptive Essentialism**, claiming that mirror representation legitimizes any power structure. Given their history of rejecting binding bodies without support or rotation, consistency demands rejection. They must uphold that citizen power requires citizen protection. This principle ensures that lottocratic institutions remain tools of the public rather than becoming new bureaucracies.
