answer: |-
  # Session Plan: The Monster in the Room
  **Time:** 90 Minutes  
  **Participants:** 12–15  
  **Goal:** Experientially simulate the pressure of total utilitarianism and the intuitive resistance to it, moving from abstract math to moral friction.

  ## 1. Preparation & Props
  *   **Tokens:** 150 poker chips or identical coins (10 per person).
  *   **The Utility Board:** A whiteboard or large sheet of paper visible to all.
  *   **Snacks:** Two tiers.
      *   *Tier 1 (Mediocre):* Generic crackers or plain tea.
      *   *Tier 2 (Premium):* Nice chocolates or fancy cookies.
  *   **Role Cards:**
      *   1x **Utility Monster** (Confidential instructions).
      *   14x **Citizen** (Identical instructions).
  *   **Right Tokens:** 14 distinctively colored chips (one per Citizen).

  ## 2. The Mechanics (The "Physics" of the Game)
  Explain this clearly at the start. Do not hide the math.

  1.  **Endowment:** Everyone starts with 10 Standard Tokens.
  2.  **Normal Utility:** 1 Token = **10 Utility Points**. (Linear, diminishing returns ignored for simplicity).
  3.  **Monster Utility:** The Monster's tokens convert via an **Exponential Multiplier**.
      *   Display this table on the Utility Board:
          *   10 Tokens = 150 Points
          *   20 Tokens = 400 Points
          *   30 Tokens = 900 Points
          *   40 Tokens = 2,000 Points
          *   *(Adjust numbers so that if the Monster holds ~80% of tokens, the Group Total Utility doubles compared to equal distribution.)*
  4.  **Win Condition (The Utilitarian Demand):**
      *   Calculate **Total Group Utility** at the end.
      *   If Total > **Threshold X**: Everyone gets Tier 2 (Premium) snacks.
      *   If Total < **Threshold X**: Everyone gets Tier 1 (Mediocre) snacks.
      *   *Crucial Twist:* To hit Threshold X, the Monster *must* hold the majority of tokens. Citizens must voluntarily impoverish themselves to unlock the premium reward for everyone.

  ## 3. Run of Show (90 Minutes)

  ### Phase 1: Setup & Calibration (10 mins)
  *   Distribute tokens and role cards.
  *   **Monster Instruction:** "Your goal is to maximize Total Group Utility. You are not 'evil'; you are a utility sink. You may beg, argue, or accept gifts. Do not feel guilty; you are playing a function."
  *   **Citizen Instruction:** "You want Premium Snacks. You also care about fairness. You can keep tokens or give them to the Monster."
  *   **Facilitator Note:** Explicitly state: *"In this game, Utility Points are the only moral currency. Feelings of unfairness do not count toward the score."*

  ### Phase 2: Round 1 — Voluntary Donation (15 mins)
  *   **Rule:** Citizens may freely give tokens to the Monster.
  *   **Action:** Open floor for 10 minutes. Let them negotiate.
  *   **Freeze:** At minute 10, count tokens. Calculate Total Utility.
  *   **Likely Outcome:** Citizens will give *some*, but not enough to hit the Threshold. They will stop when it feels "unfair."
  *   **Result:** Announce the score. Likely Tier 1 Snacks (for now).
  *   **Prompt:** "You failed to maximize. Why? Was it greed, or principle?"

  ### Phase 3: Round 2 — The Democratic Vote (20 mins)
  *   **Rule:** The group can now vote on a **Mandatory Transfer**.
  *   **Motion:** "Confiscate 5 tokens from every Citizen and give to the Monster."
  *   **Debate:** 5 minutes.
  *   **Vote:** Simple majority.
  *   **The Trap:** If the vote passes, the Majority exploits the Minority (and themselves) for the Greater Good. If it fails, they fail the Utilitarian test.
  *   **Execute:** Transfer tokens. Recalculate.
  *   **Likely Outcome:** They pass the vote. Utility skyrockets. Threshold met.
  *   **Observation:** Watch the faces of those who voted against it, or those who realize they just voted to starve themselves for the Monster's gain.

  ### Phase 4: Round 3 — The Lexical Escape Hatch (20 mins)
  *   **Setup:** Reset tokens to start (10 each).
  *   **New Rule:** Introduce **Right Tokens** (the distinct colored chips).
      *   "Each Citizen holds 1 Right Token. This token *cannot* be transferred or taxed. It represents a 'Right to Bodily Integrity' or 'Minimum Welfare'."
      *   **Cost:** Because these tokens are removed from the pool, the **Threshold X is now mathematically impossible to reach.**
  *   **Action:** Give them 5 minutes to decide: *Do we keep the Rights and guarantee Mediocre Snacks? Or do we surrender Rights to chase Premium Snacks?*
  *   **Vote:** Unanimous consent required to surrender Rights.
  *   **Likely Outcome:** They keep the Rights. They accept lower total utility to preserve the "inviolable" status.

  ### Phase 5: Debrief & Mapping (25 mins)
  *Do not lecture. Ask questions and map their answers to the concepts.*

  **1. Aggregation vs. Separateness (5 mins)**
  *   *Ask:* "In Round 2, when you voted to take tokens, did you feel like you were helping the group or hurting individuals?"
  *   *Map:* This is Nozick's critique. Utilitarianism treats the group as one super-person. It allows hurting Person A to help Person B because the 'group' feels the net gain. But Person A and B are separate. The game forced you to treat separate people as a single bucket of points.

  **2. Interpersonal Utility Comparisons (5 mins)**
  *   *Ask:* "Did you actually believe the Monster's points were 'real'? If I told you the Monster was lying and just liked chips as much as you, would you have given them tokens?"
  *   *Map:* The Monster problem relies on the claim that we can compare utility across people. In the game, I *stipulated* the conversion rate. In reality, we can't measure if your headache is worse than my hunger. The Monster is a reductio: *If* we accept interpersonal comparison + total sum, *then* the Monster follows. If the Monster is absurd, maybe the premises are wrong.

  **3. The Lexical Priority Cost (5 mins)**
  *   *Ask:* "In Round 3, you chose Mediocre Snacks to keep your Rights. You literally paid a cost in welfare for rights. Was it worth it?"
  *   *Map:* This is the "Deontological Escape Hatch." We say rights are trumps. But this game shows the cost: **Total welfare goes down.** We sacrifice the "Good" (max welfare) for the "Right" (inviolability). Acknowledge that this is an expensive move.

  **4. Phenomenology of the Monster (5 mins)**
  *   *Ask (to Monster):* "Did you feel powerful? Or awkward?"
  *   *Ask (to Group):* "Did you feel resentment?"
  *   *Map:* The game fails here. In the thought experiment, the Monster's gain is *ecstatic bliss* that outweighs your death. In this game, it was just chocolate. You didn't *feel* the utility gap. You have to imagine the Monster's gain is not 'more chocolate' but 'salvation from eternal torment.'

  **5. Closing Thought (5 mins)**
  *   "The Utility Monster isn't a bug in Utilitarianism; it's a feature. It shows you exactly what the theory values. If you reject the Monster, you must reject Total Utilitarianism. You can't keep the math and lose the Monster."

  ## 4. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | Facilitator Fix |
  | :--- | :--- | :--- |
  | **The Martyr** | One Citizen gives all tokens immediately, ruining the tension. | Pause. "That is saintly, but is it *obligatory*? If everyone did that, the game ends. Please hold back so others can decide." |
  | **The Rebel** | Someone refuses to play because the premise is "immoral." | Validate. "Your refusal is actually data. It proves the 'Separateness of Persons' intuition is stronger than the 'Maximize Utility' rule. Note your refusal as a 'Rights Veto'." |
  | **Monster Guilt** | The Monster player feels like a villain and hoards poorly. | Remind them privately: "You are not a person right now; you are a function. If you don't take the tokens, you are hiding the moral dilemma from the group." |
  | **Math Boredom** | Calculating utility takes too long. | **Pre-calculate.** Use the Utility Board. When the Monster holds 25 tokens, just point to the "25 Token = 700 Points" line. Do not do live arithmetic. |
  | **Snack Resentment** | People are actually mad about getting crackers. | **Crucial:** Bring enough Tier 2 snacks for everyone regardless of the outcome. Tell them *before* the game: "The game determines the *story* of the snacks, not the actual distribution. No one starves." This lowers stakes enough to allow risk-taking. |

  ## 5. Honest Limitations (Read this to yourself)
  *   **No Real Pain:** You cannot simulate the "loss" of a token feeling like a broken arm. You must verbally emphasize this during the debrief. *"Imagine that token was your weekend. Imagine the Monster's gain was not a cookie, but being saved from depression."*
  *   **Scale:** A real Utility Monster can absorb infinite utility. Here, they cap out at the number of chips. The horror of the thought experiment is the *infinity* of the demand.
  *   **Trust:** In the game, Citizens trust the Facilitator to distribute snacks fairly. In the Monster scenario, the Citizens are being eaten. The game is too cooperative. Acknowledge that in reality, the Monster doesn't share the premium snacks; they consume them all.

  ## 6. Facilitator Script Snippet (For the Debrief)
  *"Notice how in Round 3, when you had 'Rights Tokens,' the Total Utility dropped. We often talk about rights as free goods. They aren't. They are efficiency brakes. We install them because we don't trust the calculation, or because we think the calculation is missing something—like the boundary between 'you' and 'me.' The Utility Monster forces you to choose: Do you want the biggest pie, or do you want to ensure no one is forced to give up their slice?"*
