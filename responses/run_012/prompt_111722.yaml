      *   Ensure the Facilitator script is clear.
      *   Make sure the "Lexical Priority" round is distinct.

  *(Self-Correction during drafting)*: I need to make sure the Monster's utility scaling is clear. If it's exponential, it gets too big too fast. Let's use a step function.
  *   Normals: 1 Token = 10 Utility Points.
