          *   Normals: 1 Point = 1 Utility. Loss = -1 Utility.
          *   Monster: 1 Point = $1.5^n$ Utility? No, that grows too fast. Let's make it multiplicative per round or a steep curve.
          *   *Correction:* The prompt suggests "every unit... multiplies their welfare by 1.5". If they start at 10, get 1 unit -> 15. Get another -> 22.5. This is exponential.
          *   *Simpler Mechanic:* To keep it runnable in 90 mins, let's use a "Conversion Rate".
          *   Normals: 1 Chip = 1 Vote/Point.
          *   Monster: 1 Chip = $X$ Points. $X$ increases as they get more chips.
          *   *Actually, let's stick closer to the prompt:* "Every unit transferred... multiplies welfare by 1.5".
          *   *Refined Mechanic:* Total Group Score = (Sum of Normal Points) + (Monster Points).
          *   Normal Points = Chips held.
          *   Monster Points = $Base \times 1.5^{\text{Chips held}}$.
          *   *Wait, that's too math-heavy for a live game.*
          *   *Alternative:* Fixed conversion rates per round. Round 1: Monster 1 chip = 2 points. Round 2: Monster 1 chip = 3 points.
          *   *Best Approach for Flow:* Use a "Utility Multiplier Card" for the Monster. Every chip they hold is worth more than a chip held by a Normal.
          *   *Let's try this:* Everyone starts with 10 tokens.
          *   Goal: Maximize **Total Group Utility**.
          *   Normal Utility = Tokens held.
          *   Monster Utility = Tokens held $\times$ Multiplier.
          *   Multiplier starts at 2x and increases by 0.5x for every 5 tokens they hold.
          *   *Actually, to make the pressure real:* The group decides on allocations. If they don't feed the monster, the "Total Score" is lower. If they win the game by hitting a target score, everyone gets a prize. If not, no one does. This creates a *shared incentive* to feed the monster, conflicting with *fairness*.
          *   *Better Conflict:* Individual prizes vs. Group Score.
          *   *Let's go with:* End of game, snacks are distributed based on Final Utility Score.
          *   Normal: 1 Token = 1 Snack Ticket.
          *   Monster: 1 Token = Exponential Snack Tickets.
          *   *Problem:* If the monster wins all the snacks, the normals get nothing and will revolt/refuse to play.
          *   *Solution:* The "Veil of Ignorance" twist or just raw negotiation. Let's do raw negotiation to expose the utilitarian calculus.
          *   *Revised Payoff:* The *Group* needs to reach a Total Utility Threshold to unlock the "Party Snack Bowl". If they fail, only individual hoards count. This forces cooperation to feed the monster, creating the tension.
          *   *Actually, simplest is best:* The Facilitator acts as the "Utilitarian God". The group votes on transfers.
          *   *Wait, the prompt asks for "actual allocation choices".*
          *   *Idea:* 3 Rounds. In each round, players can voluntarily donate tokens to the Monster.
          *   *Scoring:* At the end, calculate Total Utility. If Total Utility > Target, everyone gets a baseline reward. PLUS individual rewards based on tokens.
          *   *No, that dilutes the monster problem.* The monster problem is that the monster *should* take everything.
          *   *Okay, final mechanic:*
              *   Start: Everyone has 5 "Life Tokens".
              *   Monster has a public "Utility Multiplier" board.
              *   Phase 1: Open Trading. Normals can give tokens to Monster.
              *   Phase 2: Voting. Majority vote can force transfer (tyranny of the majority vs tyranny of the utility).
