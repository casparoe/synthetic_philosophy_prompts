      *   *Tension:* To beat the score, Normals *must* sacrifice tokens to the Monster. But sacrificing tokens feels unfair.
      *   *This captures the Utilitarian Demand.*

  6.  **Addressing Failure Modes:**
      *   *Refusal to play:* Pre-frame it as a simulation.
      *   *Monster guilt:* Give the Monster a script/role card that says "Your job is to argue for the math."
      *   *Martyr:* Someone might give everything. Acknowledge this as "Saintliness" vs "Obligation".
      *   *Math boredom:* Keep the multiplier simple. 1 Token = 5 Utility for Normals. 1 Token = 10, 20, 40... for Monster.

  7.  **Debrief Structure:**
      *   Map the feelings (resentment, guilt, cold calculation).
      *   Connect to Nozick: Separateness of Persons.
      *   Connect to Interpersonal Utility: Did we believe the multiplier?
      *   Lexical Priority: Introduce "Rights Tokens" that cannot be taken. Show how this lowers Total Score (the cost of rights).

  8.  **Limitations:**
      *   Can't simulate *pain*. Must state: "Imagine this token is your kidney/weekend."
      *   Can't simulate *scale*. The monster in philosophy can absorb infinite utility. Here, capped by tokens.

  9.  **Review against Constraints:**
      *   90 mins? Yes.
      *   12-15 people? Yes.
      *   No real money? Yes (snacks/points).
      *   Specific debrief points? Yes.
      *   Predictable errors? Yes.

