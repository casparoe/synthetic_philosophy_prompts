      *   Intro (10m): Rules, Utility Functions.
      *   Round 1: Voluntary Donation (15m).
      *   Round 2: Democratic Voting on Redistribution (20m).
      *   Round 3: The "Lexical Rights" Amendment (20m).
      *   Debrief (25m).

  5.  **Refining the Payoff/Incentive:**
      *   If the Monster gets all the snacks, the Normals will be annoyed in real life.
      *   *Fix:* The Facilitator provides the snacks regardless. The "Points" are for bragging rights or a small raffle.
      *   *Better:* Use "Chocolate Coins". 1 Normal Token = 1 Coin. Monster Token = Variable Coins.
      *   *Wait, if the Monster gets 100 coins and others 0, it's awkward.*
      *   *Compromise:* The game is about *maximizing the total number of coins generated*.
      *   Mechanic: The Facilitator has a bag of coins.
      *   Normal holding 1 token = Facilitator gives 1 coin to that person.
      *   Monster holding 1 token = Facilitator gives $X$ coins to the *common pool* (or the monster).
      *   *Let's stick to the prompt's specific math:* "Donors lose one unit each."
      *   Okay, let's make it a **Total Score Challenge**.
      *   Goal: Beat the "Facilitator's High Score".
      *   If the group beats the score, *everyone* gets a nice snack bag.
