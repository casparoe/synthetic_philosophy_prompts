answer: |-
  ### The Sequence: Earning the Definition

  Do not open with the trichotomy. If you begin by distinguishing "utility as feeling," "utility as want-satisfaction," and "utility as bookkeeping," you present a taxonomy without a problem. The room will treat it as dogma to be memorized rather than a solution to a puzzle. Instead, the trichotomy must be the **payoff**.

  The dependencies must run from **Observation** to **Structure** to **Representation** to **Interpretation**.

  1.  **Observation (0–10 mins):** Start with *choices* only. Do not use the word "preference." Write pairs of options on the board and mark which was selected. Establish that this is the only hard data we have. Inner states are private; choices are public.
  2.  **Structure (10–25 mins):** Introduce consistency (WARP — Weak Axiom of Revealed Preference). If $A$ is chosen over $B$ today, $B$ cannot be chosen over $A$ tomorrow (ceteris paribus). This is the load-bearing wall. Without this, choice is noise. With this, choice is a system.
  3.  **Representation (25–35 mins):** Show that if the system is consistent, we can assign numbers to the options that preserve the order. Call these numbers "utility." Emphasize that at this stage, the numbers are *derived* from the choices, not the cause of them.
  4.  **Interpretation (35–50 mins):** Now introduce the trichotomy. Ask: "We have built a machine that assigns numbers to choices. What do these numbers *represent*?" This is where you deploy the distinctions. Because you have already built the formalism, the room will see that the math works regardless of the interpretation, which forces them to confront the meaning separately from the mechanism.

  ### The Example: The Reluctant Choice

  Reject the "apple trap" ("you picked the apple, therefore you preferred the apple"). This is a trap because it makes the theory unfalsifiable by definition. It collapses the distinction between choice and preference immediately, validating the behaviorist critique before you've begun.

  Reject the "canteen case" (menu dependence) for this specific session. That example demonstrates a *violation* of the axioms (context dependence), which is crucial for advanced decision theory but distracts from the *meaning* of utility in the standard model. It complicates the formalism when you want to clarify the ontology.

  **Pick "The Reluctant Choice"** (a refined version of your second idea).
  *   **The Case:** An agent freely chooses $X$ over $Y$, but explicitly states, "I wish I hadn't; $Y$ would have made me happier." (e.g., the smoker, or the overworker).
  *   **What it must have:** A clear conflict between the *choice* (observable) and the *testimony about welfare/feeling* (introspective). The agent must be competent and uncoerced.
  *   **What it must not have:** External constraints or ignorance. If they didn't know $Y$ was healthier, it's an information problem, not a preference problem.
  *   **Why:** This example forces the room to decide what the utility number tracks. If utility tracks feelings, the model says the agent chose the lower utility option (violating the theory). If utility tracks choices, the model says the agent maximized utility (making the theory true but potentially empty). This tension is exactly where the trichotomy earns its keep.

  ### What to Refuse to Cover

  You must explicitly refuse three things to keep the session from collapsing into technicalities or ethics:

  1.  **Cardinal Utility:** Refuse to discuss *magnitude*. We are doing ordinal ranking. If someone asks "how much more," shut it down. It invites the "feeling" interpretation too early.
  2.  **Welfare Claims:** Refuse to let the model speak to what is *good* for the agent. State clearly: "This framework describes consistency, not well-being."
  3.  **Psychology:** Refuse to speculate on *why* the choice was made. The model is agnostic to motivation (habit, impulse, calculation).

  Say this out loud: "We are not building a theory of happiness, and we are not building a theory of brain states. We are building a consistency check on observed behavior."

  ### The Misconception Map

  You anticipated four objections. They are actually two mistakes wearing different clothes.

  **Mistake 1: The Normative Conflation (Descriptive vs. Prescriptive)**
  *   *Who:* The Product Manager (A/B testing as welfare) and the "People always get what they want" crowd.
  *   *The Error:* Assuming that because a choice is revealed, it is *beneficial*.
  *   *Where to head it off:** **Early (Observation phase).** When you define the data, explicitly state: "Choice reveals priority, not welfare." If you wait, the PM will have already internalized choice as validation.
  *   *Strategy:* Do not let them equate "preferred" with "better."

  **Mistake 2: The Ontological Vacuum (Tautology vs. Behaviorism)**
  *   *Who:* The Skeptic (Unfalsifiable) and the Philosopher (Behaviorism).
  *   *The Error:* Believing that if preference is defined by choice, the theory explains nothing (tautology) or denies inner life (behaviorism).
  *   *Where to let it arrive:** **Mid-session (Representation phase).** Let them feel the discomfort of the tautology. "If utility is just a label for choice, what work is it doing?"
  *   *Strategy:* Resolve this with **Consistency**. The theory is not empty because it *forbids* certain choices (intransitivity). It has predictive power over *future* choices, not just descriptive power over past ones. Let the Philosopher ask the behaviorism question at the very end; it is the correct metaphysical capstone, not a bug.

  ### The Final Question

  In the last five minutes, do not ask for a definition. Ask for a boundary condition. You want to know if they understand that utility is a property of the *model*, not the *person*.

  \check{If an agent chooses X but says 'I wish I hadn't', does the model say they made a mistake, or does it say our interpretation of utility was wrong?}
