answer: |-
  To specify the desiderata for criteria of authenticity is to define the conditions under which a methodological tool can claim to produce historical knowledge rather than theological reflection or imaginative reconstruction. The following specification sets out the necessary conditions for any criterion (or set of criteria) to be epistemologically valid in this field.

  ### I. The Desiderata

  **1. Sensitivity to Transmission and Translation**
  *Specification:* The criterion must account for the fact that the extant Greek texts stand at the terminus of a period of oral and written transmission, likely involving translation from Aramaic or Hebrew. It must not treat the Greek wording as the primary datum of authenticity.
  *Motivation:* If a criterion relies on Greek wordplay, syntax, or specific Septuagintal echoes as proof of authenticity, it risks identifying the creativity of the evangelist or the Greek-speaking church rather than the historical speaker. Abandoning this renders the criterion blind to the linguistic medium of the tradition.

  **2. Distinction Between Unit and Setting**
  *Specification:* The criterion must be capable of assessing the authenticity of a saying or action independently of the narrative framework in which it is currently embedded.
  *Motivation:* Evangelists frequently placed authentic traditions in new contexts to serve theological arguments. A criterion that validates a saying because it fits its current narrative context perfectly risks authenticating the evangelist's redaction rather than the tradition. Without this distinction, we conflate the history of the tradition with the history of its composition.

  **3. Distinction Between Antiquity and Authenticity**
  *Specification:* The criterion must not equate "early" with "authentic." It must allow for the possibility of early inauthentic material (e.g., early prophetic utterances in the church attributed to Jesus) and late authentic material (e.g., traditions preserved in later texts).
  *Motivation:* Chronological proximity increases probability but does not guarantee origin. Conflating early with authentic assumes that the church never generated traditions about Jesus quickly, and that reliable memory decayed strictly linearly. Abandoning this distinction collapses the history of the movement into the biography of the founder.

  **4. Distinction Between the Historical Jesus and the Kerygmatic Christ**
  *Specification:* The criterion must not presuppose the theological conclusions of the New Testament as historical data. It must allow for a discontinuity between what the church preached and what Jesus enacted.
  *Motivation:* The sources are confessional documents. A method that assumes the kerygma is a transparent record of history begs the question. This distinction preserves the possibility of critical historical inquiry rather than confessional affirmation.

  **5. Consistency with Secure Historical Constraints**
  *Specification:* The results generated by the criterion must be consistent with established non-gospel facts (e.g., Jesus was a Jew, operated in Roman Palestine, was executed by Roman authority).
  *Motivation:* Any portrait that contradicts secure external data is historically impossible. This acts as a boundary condition, preventing the criteria from generating a Jesus who could not have existed in the known时空 (space-time) of the first century.

  **6. Calibration Against Known Secondary Material (The Explicit Requirement)**
  *Specification:* A criterion must be demonstrably capable of returning a negative verdict. It must be tested against material we have independent reason to regard as late, secondary, or inauthentic (e.g., Gospel of Thomas logia, clear redactional seams, apocryphal miracles) to ensure it does not authenticate everything it touches.
  *Motivation:* A test that yields only positive results is not a filter; it is a confirmation bias engine. If a criterion cannot identify a known forgery or late development as inauthentic, it lacks discriminatory power. Without this, the criterion is methodologically vacuous, capable of validating any claim regardless of its origin.

  ### II. Genuine Desiderata vs. Camp Preferences

  It is vital to distinguish between logical necessities and theological preferences masquerading as method.

  **Genuine Desiderata:**
  Requirements 1, 2, 5, and 6 are genuine. They arise from the nature of the evidence and the logic of historical inference. Sensitivity to transmission is required by linguistics; the unit/setting distinction is required by literary analysis; consistency with secure facts is required by general historiography; calibration is required by the scientific method (falsifiability).

  **Camp Preferences:**
  The demand for *continuity* (often favored by maximalists) or the demand for *discontinuity* (often favored by minimalists) are frequently presented as criteria but are actually preferences.
  *   *Maximalist Preference:* Assuming that whatever fits the Jewish context is authentic. This privileges continuity and risks absorbing Jesus entirely into Judaism, making the rise of the church inexplicable.
  *   *Minimalist Preference:* Assuming that whatever fits the church's theology is inauthentic. This privileges discontinuity and risks creating a Jesus who had no influence on his followers.
  Neither continuity nor discontinuity is inherently more probable; both are outcomes to be demonstrated, not methodological starting points. A genuine criterion must be neutral regarding the degree of overlap between Jesus, Judaism, and the Church.

  ### III. Joint Unsatisfiability and Structural Tensions

  Your suspicion regarding jointly unsatisfiable requirements is well-founded. There are two critical tensions that threaten the coherence of the entire project.

  **1. Selectivity vs. Coherence**
  *The Conflict:* The requirement for **Selectivity** (Desideratum 6) demands that criteria be strict enough to reject material. The requirement for **Coherence** (implied in Desideratum 5, often explicit in "Criterion of Coherence") demands that the accepted material form a plausible, unified portrait.
  *The Tension:* High selectivity (e.g., a strict Criterion of Dissimilarity) tends to produce a fragmented, idiosyncratic figure—a Jesus who resembles neither his context nor his followers. This fails the Coherence test because such a figure is historically implausible; no one exists in a vacuum. Conversely, prioritizing Coherence tends to lower the bar for acceptance, allowing questionable material to remain because it "fits" the emerging portrait. This fails the Selectivity test, as the criteria become circular: material is authentic because it fits the Jesus constructed from material deemed authentic.
  *Consequence:* You cannot maximize both. Enforcing strict selectivity destroys the portrait; enforcing strict coherence destroys the critical edge. The project must accept that a fully coherent portrait may require accepting material that cannot be strictly proven authentic, or that a strictly proven corpus will remain fragmentary.

  **2. Independence vs. Definition by Contrast**
  *The Conflict:* The requirement that criteria be **Usable Without Already Knowing Who Jesus Was** (Independence) sits badly with criteria that define themselves by **Contrast** (e.g., Dissimilarity to Judaism or the Church).
  *The Tension:* To judge if a saying is dissimilar to Judaism, you must have a complete and accurate map of first-century Judaism. To judge if it is dissimilar to the Church, you must have a complete map of early Christian theology. However, our maps of Judaism and the Church are often constructed *using* the Jesus traditions we are trying to evaluate. If we define "Judaism" by excluding what Jesus did, and then use "Dissimilarity to Judaism" to find out what Jesus did, the reasoning is circular. Furthermore, if the criterion requires us to know the boundaries of the contrast classes to function, it violates the independence requirement: we are presupposing knowledge of the historical landscape that is as uncertain as the knowledge of Jesus himself.
  *Consequence:* Criteria of contrast cannot be used as independent arbiters. They are dependent on prior historical reconstruction. This undermines the claim that criteria can "settle" who Jesus was from a neutral starting point. They can only refine a hypothesis already formed.

  ### IV. The Killer Requirement

  If enforced, the single requirement that would eliminate the greatest number of standard criteria is **Requirement 6: Calibration Against Known Secondary Material (Demonstrable Negative Discriminatory Power).**

  **Why it eliminates the rest:**
  Most standard criteria are formulated to identify *possibilities* or *probabilities* of authenticity, but they are rarely tested for their ability to identify *inauthenticity*.
  *   **The Criterion of Coherence:** Fails immediately. It is inherently inclusive. It cannot reject material that fits the pattern; it can only accept. It has no mechanism for a negative verdict.
  *   **The Criterion of Palestinian Environment:** Fails calibration. Almost all gospel material fits a general Palestinian environment. It rarely, if ever, identifies a saying as *inauthentic* because it is too Palestinian. It lacks negative discriminatory power.
  *   **The Criterion of Multiple Attestation:** While it strengthens probability, it is often treated as cumulative. More importantly, it cannot easily return a negative verdict on a singly-attested saying that is actually authentic. It is a criterion of weight, not a filter of falsification.
  *   **The Criterion of Embarrassment:** Often fails calibration. What is "embarrassing" is subjective and culturally relative. The church retained "embarrassing" material for theological reasons (e.g., the baptism). It often authenticates material it should not, or fails to authenticate material that is embarrassing but late.

  **What would be left standing:**
  Strictly speaking, almost nothing remains in its traditional form. However, a modified **Criterion of Dissimilarity** (or Distinctiveness) is the only one that structurally allows for a negative verdict (i.e., "This is too Jewish" or "This is too Christian"). Yet, even this would require radical reconstruction. It would have to be stripped of its theological baggage (the assumption that Jesus *must* be unique) and treated purely as a statistical outlier detection system, calibrated against known control groups of Jewish and Early Christian texts.

  Even then, the result would not be a "portrait" of Jesus, but a list of statistically improbable data points. The enforcement of this requirement admits that the traditional goal of the criteria—to build a coherent, full-bodied biography of Jesus using a mechanical method—is impossible. It leaves standing only a negative critical tool, capable of pruning the tree, but incapable of drawing its shape.
