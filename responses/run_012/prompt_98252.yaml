      *   *Did I explain "Center of Narrative Gravity"?* Need to make sure it doesn't sound like "it's all fake." It's *real* as an abstraction.
      *   *Did I answer if the analogy carries the argument?* Yes, the analogy *is* the argument for the roommate, so if the analogy fails, the conclusion fails.

  10. **Final Polish:** Check against the prompt's specific constraints (correspondence, breaks, imports, conclusion survival, Dennett's actual view). (Looks good.)

