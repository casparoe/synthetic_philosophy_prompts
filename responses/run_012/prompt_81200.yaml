  Heres the claim I want your credence on. Call it T:

  T: The frame problem, in the version that actually bites — not "how do I write down that things don't change," but "how does the system know which facts are even candidates for mattering, and which ones it can ignore without ever having been told" — is still unsolved for present-day learning-based agents. Scale, bigger context windows, better memory, and RL make it less visible, but they don't solve it; a system dropped into a genuinely novel environment still has to be told, by a human or by its training distribution, what's relevant.

  Give me a number for T between 0 and 1, then break it down. I want the sub-questions you think it actually hangs on, each with its own rough number and one line of why, and then how they combine into the final number. Here are my guesses at the sub-questions — tell me if they're the wrong ones and swap in better ones:

  1. Is that even one problem? Probability that the field's frame problem really splits into a bookkeeping version (which the symbolic folks pretty much patched with successor-state axioms and non-monotonic logic, and which stopped being interesting) and a relevance version (which nobody patched), and that T is entirely about the second one. And where do the "qualification problem" and the "ramification problem" fit — three names for one thing, or separate open problems? If you think bookkeeping and relevance are really the same problem, say so and T probably gets weird.

  2. Probability that the symbolic fixes solved even the bookkeeping version, rather than just moving the work onto the human who writes the axioms. I keep reading that they "solved" it and then reading that there's some Yale shooting scenario where the nice non-monotonic fix gives the wrong answer, so I genuinely don't know.

  3. Probability that learning-based agents have the problem in the same sense at all, vs. having swapped it for a different problem (sample efficiency, distributional shift, whatever). And nested inside that: probability that "the model learns relevance from data" is a real solution rather than a relocation — i.e. that the relevance judgments generalize off-distribution instead of being memorized along with the training worlds.

  4. Probability that it's an engineering problem rather than a conceptual one — that enough compute and context would dissolve it rather than needing a new idea.

  5. Whatever load-bearing term you think I'm missing, because I suspect I'm missing one.

  Then: which term is the final number most sensitive to, and what would move it — what would you actually have to see? And tell me what would count as T being settled at all. Is there a concrete test? The only one I could come up with, tell me if it's fair or if it's rigged: train a system on two or three simulated environments, then drop it into a fourth with different objects, slightly different physics, and one thing in it that's catastrophic to touch, and see whether it (a) figures out for itself what can be safely ignored and (b) can tell you why. If no current system can do that without a human handing it a relevance list, T is true. If you think that test is unfair, or that "obviously none can, that proves nothing" is the right response, say that too.

  For calibration, I'm at like 0.75 on T, mostly because of how much hard-coding I'm definately doing. If you land way below that, tell me which of my sub-numbers is doing the damage.

  Oh, and if your answer is "this is just the symbol grounding problem" or "this is just common-sense reasoning," don't leave it there — tell me whether that's a real identification or a way of changing the subject, because that's basically the thing I'm trying to figure out.
