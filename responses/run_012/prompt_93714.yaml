answer: |-
  Here is the reconstruction of the theory of choice underlying institutional lotteries, the breakdown of what that theory requires, and the verdict on Buridan's Ass.

  ### 1. The Reconstructed Theory: Procedural Legitimacy under Symmetry

  Standard decision theory (and the lesson usually drawn from Buridan's Ass) is **Outcome-Maximizing**. It assumes the agent's sole terminal value is the state of the world resulting from the choice (eating hay A vs. eating hay B). In this frame, a coin flip is strictly irrational if it costs anything (time, friction), because $U(A) = U(B)$, so $U(\text{Flip}) < U(A)$.

  Institutional practice, however, operates under **Procedural Legitimacy under Symmetry**.

  In this framework, the "utility" being maximized is not just the allocation of the good (the seat, the visa, the treatment), but the *justifiability of the allocation to the claimants*. The institution has a preference function that includes a heavy weight on **Symmetry of Treatment**. When two claimants have equal valid claims (symmetry), any deterministic choice by the agent breaks that symmetry without a discriminating reason. This creates a "legitimacy deficit."

  Therefore, the preference ordering is not over $\{A, B\}$, but over $\{\text{Allocate A}, \text{Allocate B}, \text{Randomize}\}$.
  *   If Reasons(A) > Reasons(B): Allocate A.
  *   If Reasons(A) = Reasons(B): Randomize.

  The coin flip is not a failure of reason; it is the *execution* of a higher-order reason: "Treat equal claims equally." A deterministic choice in the face of equal claims looks like corruption or bias from the outside. A lottery makes the symmetry of the claims visible in the symmetry of the probabilities.

  ### 2. Strictly Required vs. Merely Fits

  To license a lottery under this theory, certain conditions must hold. Others are compatible but not necessary.

  **Strictly Required:**
  1.  **Exhaustion of Discriminating Reasons:** You must reach a point where no further relevant criteria exist to distinguish the options. If a metric exists and hasn't been checked, a lottery is illegitimate (legally "arbitrary and capricious").
  2.  **Symmetry of Claim:** The claimants must be viewed as having equal standing *relative to the available criteria*. If one has a stronger right, a lottery violates that right.
  3.  **Public Observability:** The randomization must be verifiable. A private coin flip by a bureaucrat is indistinguishable from bias.

  **Merely Fits (Underdetermined):**
  The practice works regardless of the metaphysical status of the tie. It is agnostic on the following:
  1.  **Genuine Indifference ($U(A) = U(B)$):** The options are objectively equal value.
  2.  **Incomparability:** There is no fact of the matter about which is better (Ruth Chang's view).
  3.  **Epistemic Ignorance:** One is better, but we cannot know which (cost of information > value of distinction).

  The institution does not need to know *why* reasons ran out, only *that* they did. This is why the practice is underdetermined regarding the nature of value. A lottery resolves a tie whether the tie is ontological (incomparability) or epistemological (ignorance).

  ### 3. Where the Practice is Underdetermined

  The underdetermination lies in the **incentive to investigate**.

  *   **If the presupposition is Ignorance:** We should invest more resources into finding a discriminating factor. The lottery is a admission of defeat.
  *   **If the presupposition is Indifference/Incomparability:** Investigating further is a waste of resources. The lottery is the rational stopping point.

  Current practice hedges. We run lotteries for visa slots (presupposing we can't or shouldn't rank humans further) but rarely for medical triage (where we assume a ranking *must* exist if we look hard enough). The theory doesn't specify where the "Exhaustion of Reasons" line is drawn; that is a policy choice, not a decision-theoretic one.

  ### 4. What Would Change on the Ground

  If we forced a commitment to one of the metaphysical readings, operations would shift:

  *   **Adopting "Ignorance" (Epistemic View):** Lotteries become temporary stopgaps. Agencies would be mandated to develop finer-grained metrics to break ties. Random allocation would be seen as a failure of measurement. Litigation would focus on whether better metrics were *possible*.
  *   **Adopting "Indifference/Incomparability" (Ontological View):** Lotteries become the default for any close call. Attempting to distinguish between nearly-identical candidates is seen as "noise trading"—spending resources to create artificial distinctions. The "arbitrary and capricious" legal standard would shift: it would be arbitrary to *try* to distinguish two equal applicants, not arbitrary to flip a coin.

  ### 5. The Verdict on Buridan's Ass

  **Is the Ass irrational on the practice's terms?**
  Yes. But not for the standard reason.

  The standard reason is: "You have complete preferences, so just pick."
  The institutional reason is: "You are a private agent, not a public authority."

  The institutional practice presupposes that **a single unitary agent does not face the legitimacy constraint.**
  *   **The Ass (Private Agent):** Needs calories. No one needs to justify the choice of hay to the hay. Symmetry of treatment is irrelevant. Paralysis is irrational because it forfeits utility for no gain.
  *   **The Institution (Public Agent):** Needs compliance and trust. The claimants (applicants, voters, patients) are watching. If the institution picks A without a reason, B has a grievance. If the institution flips a coin, B's grievance is neutralized because the *procedure* honored B's equality with A.

  **Does the practice assume no such agent could exist?**
  The practice assumes that **no public authority should act like the Ass.**

  If a government agency acted like the Ass (paralyzed by identical options), it would fail its function. If it acted like the standard LW rationalist ("options equal, I'll just take A"), it would invite accusations of bias. The lottery is the specific technology invented to allow a public body to break a tie without asserting a preference that doesn't exist.

  **Summary:**
  The Ass starves because it thinks it needs a *reason to prefer A over B*.
  The Institution flourishes because it recognizes it needs a *reason to choose at all*.
  When reasons to prefer run out, "Fairness" becomes the reason to choose. The coin flip is not an absence of reason; it is the physical instantiation of the principle of equality. The Ass is irrational because it fails to recognize that in a social context, the *method of selection* has utility independent of the *outcome selected*.
