prompt: |-
  Six weeks ago I took over as chair of the capital-planning committee at a mid-sized regional health system, and the appointment has dragged me into a methodological dispute I did not expect to care about. The committee approves building and equipment projects, which means I am now obliged to sign off on cost and schedule forecasts that our own records show are almost always wrong: of the nineteen projects approved over the past eight years, thirteen overran their budgets, the median overrun was a little over half again the original estimate, and two projects finished at more than three times their projected cost. One of my colleagues has become an evangelist for what he calls the outside view: set aside the particulars of the proposal in front of you, identify a reference class of comparable projects, and anchor on the distribution of outcomes in that class. Our chief operating officer takes the contrary line. She argues that the outside view is a borrowed authority, and that it must smuggle in inside judgments at two points — first in deciding which projects count as comparable, second in deciding whether the case at hand is typical or exceptional — and that in our setting the borrowed authority is nearly worthless anyway, since our historical sample contains only projects that survived committee screening, spans two regulatory regimes, and mixes routine equipment replacement with genuinely novel construction. For her, being epistemically modest does not mean deferring to a number computed over a heterogeneous pile; it means holding one's own judgment as one estimate among several, each of which must earn its place. I have also begun to notice something neither of them has addressed: our forecasts may not be independent of the base rate we adopt, since once we start padding estimates to the historical overrun, the padded figure quietly becomes the new baseline against which overruns are measured.

  I need to write the committee's methodology memo, so I must settle this. Write an essay that states the strongest version of each position and then reaches and defends a verdict on the underlying controversy: whether the outside view is the proper expression of epistemic modesty in forecasting, or whether it is parasitic on the very inside judgments it claims to discipline, and how the two should be combined. Do not close on a note that both sides have a point. Commit to a rule — even a conditional one — for how someone in my position should weight base rates against case-specific reasoning, and specify what would have to be true of the reference class for your rule to change. Where the small, selected, and non-stationary character of our sample matters, address it directly rather than gesturing at statistical caveats, and say something about whether a base rate that our own budgeting can alter is still entitled to the authority the outside view assigns it.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Prompt:**

      *   **Role:** Chair of the capital-planning committee at a mid-sized regional health system (6 weeks in).
      *   **Problem:** Cost/schedule forecasts are consistently wrong (13/19 overruns, median >50%, some >300%).
      *   **The Conflict:**
          *   *Colleague (Pro-Outside View):* Use reference class forecasting (RCF). Ignore specifics, look at comparable past projects, anchor on that distribution.
          *   *COO (Pro-Inside View/Skeptic):* Outside view smuggles in inside judgments (selecting class, judging typicality). Data is flawed (survivorship bias, regulatory shifts, mix of project types). Epistemic modesty means treating internal judgment as one estimate among many, not deferring to a flawed aggregate.
          *   *Chair's Observation (Reflexivity):* Forecasts might alter the base rate (if we pad estimates based on history, the new history changes, potentially masking the underlying bias or creating a self-fulfilling prophecy).
      *   **Task:** Write an essay for the committee's methodology memo.
      *   **Requirements:**
          *   State the strongest version of each position.
          *   Reach and defend a verdict (no "both sides have a point" fence-sitting).
          *   Commit to a rule for weighting base rates vs. case-specific reasoning.
          *   Specify conditions under which the rule would change (reference class quality).
          *   Address the small, selected, non-stationary sample directly.
          *   Address the reflexivity issue (base rates altered by budgeting).
          *   Tone: Professional, analytical, decisive, epistemically rigorous.

  2.  **Deconstruct the Arguments:**

      *   **The Outside View (Kahneman/Lovallo):**
          *   *Strength:* Corrects for optimism bias and strategic misrepresentation. Planners are emotionally invested; statistics are cold. It forces accountability to reality.
          *   *Weakness:* Garbage in, garbage out. If the reference class is wrong, the number is meaningless.
      *   **The Inside View (COO):**
          *   *Strength:* Acknowledges unique constraints and specific details. Recognizes data limitations (heterogeneity, regime changes). Avoids false precision.
          *   *Weakness:* Susceptible to the very biases the outside view corrects. "This time is different" is the most expensive phrase in project management.
      *   **The Reflexivity Problem (Chair's Insight):**
          *   If we adjust forecasts *up* to meet the base rate, future overruns decrease. This changes the base rate. Does this invalidate the base rate? Or does it mean the method works?
          *   *Risk:* If we just pad numbers without fixing processes, costs go up without value.
          *   *Benefit:* It aligns expectations with reality.

  3.  **Formulate the Verdict:**

      *   I cannot say "both are right." I need a hierarchy.
      *   *Core Thesis:* The Outside View is the *default* constraint, but the Inside View is the *mechanism* for exception. However, given the specific data flaws (small, selected, non-stationary), the raw historical base rate is insufficient. It must be adjusted *before* being applied as a constraint.
      *   *Refining the Verdict:* The Outside View is the proper expression of epistemic modesty *only if* the reference class is valid. Here, it is not. Therefore, we must construct a *synthetic* base rate or apply a heavy discount to the internal one.
      *   *Actually, a stronger stance:* The Outside View is structurally superior for *approval*, even with flawed data, because the Inside View has proven catastrophically unreliable (13/19 failures). The COO's critique is valid but leads to paralysis. The solution is to use the Outside View as a *hurdle*, not a target, while acknowledging the data flaws through a "confidence discount."
      *   *Wait, the reflexivity point is crucial.* If we change the forecasts, we change the base rate. This suggests the base rate isn't an external truth but a policy lever.
      *   *Decision:* I will argue that the Outside View is the necessary *discipline*, but the COO is right about the *data*. Therefore, we adopt a "Bayesian Gate" approach. The historical overrun rate sets the *prior*, but the specific project details update it. However, the burden of proof lies entirely on the Inside View to justify deviation from the Outside View.
      *   *Even stronger:* The Outside View is the *only* valid basis for *approval limits*, while the Inside View is for *execution management*. But the prompt asks about forecasting methodology.
      *   *Final Decision:* I will argue that the Outside View is the proper expression of epistemic modesty, *but* only when the reference class is purified. Since ours is impure, we must statistically adjust the historical data to create a "corrected base rate." The Inside View cannot override this corrected base rate unless it provides evidence of *process* change, not just *project* uniqueness. The reflexivity issue is actually a feature: changing the forecast changes the outcome, which is the point.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the crisis (13/19 overruns). State the purpose of the memo. Frame the debate (Outside vs. Inside).
      *   **The Case for the Outside View:** Focus on optimism bias, planning fallacy, and the empirical track record of failure. It's not about hating the team; it's about human psychology.
      *   **The Case for the Inside View (COO):** Focus on data integrity. Survivorship bias, regulatory shifts, heterogeneity. The "false precision" argument.
      *   **The Reflexivity Problem:** Address the Chair's specific insight. If we pad, do we learn?
      *   **The Verdict/Rule:**
          *   The Outside View wins on principle but loses on raw data application.
          *   *Rule:* Use a "Reference Class Adjustment." We don't use the raw 50% overrun. We segment the data.
          *   *Burden of Proof:* The project sponsor must prove why *their* project is in the successful 6/19, not the 13/19.
          *   *Reflexivity:* Acknowledge that changing the forecast changes the base rate. This is desirable. It means we are correcting the systemic optimism.
      *   **Conditions for Change:** When do we stop using this? When we have 50+ projects, or when regulatory regimes stabilize.
      *   **Conclusion:** Firm commitment.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique:* Is saying "Outside View wins" too simplistic given the COO's strong data critique?
      *   *Adjustment:* I need to validate the COO's data critique but show that her conclusion (rely on judgment) is more dangerous. The data is bad, but the judgment is worse.
      *   *Reflexivity:* I need to be careful here. If we pad estimates, costs might actually rise (Parkinson's Law). I need to argue that the *forecast* should reflect the *likely cost*, not the *target cost*. If the likely cost goes up, that's truth-telling, not inflation.
      *   *The Rule:* It needs to be actionable. "Start with the median overrun of the relevant subset. Deviation requires documented risk mitigation."
      *   *Epistemic Modesty:* Define this. It's not "I don't know." It's "I know I am biased."

  6.  **Final Polish:**

      *   Check tone: Authoritative but collaborative.
      *   Check constraints: Did I address the small sample? Yes. The non-stationary nature? Yes. The reflexivity? Yes. Did I avoid "both sides have a point"? Yes, I must pick a winner.
      *   *Winner:* The Outside View is the *framework*, but it requires *data hygiene* (COO's point) to function. So the Outside View is the *master*, but it must be fed clean data.
      *   *Actually, looking closer at the prompt:* "Whether the outside view is the proper expression of epistemic modesty... or whether it is parasitic." I need to answer this philosophical question.
      *   *My Answer:* It is the proper expression of modesty, *provided* we acknowledge the reference class construction is an inside judgment that must be audited. It is not parasitic; it is hierarchical.

  7.  **Writing the Essay:** (Mental outline of the text)
      *   Title: Methodology for Capital Forecasting.
      *   Intro: The 13/19 failure rate is the context.
      *   Section 1: The Outside View (The Discipline).
      *   Section 2: The Inside View (The Data Integrity).
      *   Section 3: The Reflexivity (The Feedback Loop).
      *   Section 4: The Verdict & Rule.
      *   Section 5: Conditions for Revision.

      *(Self-Correction on the Rule)*: The rule needs to be specific about weighting. "The baseline forecast shall be the historical median overrun of the most narrow valid reference class. Inside-view adjustments may reduce this buffer only if supported by third-party validation of risk mitigation."

      *(Refining the Reflexivity)*: If we pad estimates, the "overrun" disappears. The base rate of *overrun* drops. This is good. It means the forecast is becoming accurate. The base rate of *cost* might rise, but accuracy improves.

      *(Final check on COO's argument)*: She says outside view is parasitic. I need to refute that. It relies on inside judgment for *classification*, but not for *prediction*. That distinction is key.

      *(Final check on Sample)*: 19 projects is small. 2 regulatory regimes. I need to say we will split the data or weight recent data higher.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Capital-Planning Committee
  **FROM:** Chair, Capital-Planning Committee
  **SUBJECT:** Methodology for Cost and Schedule Forecasting
  **DATE:** October 26, 2023

  **1. Context and Necessity**

  Over the past eight years, this committee has approved nineteen capital projects. Thirteen exceeded their budgets. The median overrun was fifty percent; two projects tripled their initial estimates. This is not merely a record of bad luck; it is evidence of a systemic failure in our forecasting methodology. We are currently operating under a delusion of precision. We approve numbers we know to be false, relying on a process that rewards optimism and penalizes accuracy.

  To correct this, we must resolve the methodological dispute currently dividing this committee. On one side is the argument for the "outside view" (Reference Class Forecasting), which demands we anchor our expectations to the statistical distribution of past outcomes. On the other is the "inside view," championed by our COO, which argues that our historical data is too heterogeneous and corrupted by selection bias to serve as an authority, and that epistemic modesty requires treating internal project estimates as valid inputs rather than discarding them for a flawed aggregate.

  This memo establishes the committee's binding methodology. It rejects the notion that these positions are equally valid. It further addresses a critical reflexive risk: that by altering our forecasts to match history, we alter the history itself.

  **2. The Strongest Case for the Outside View**

  The argument for the outside view rests on the empirical reality of human cognition, specifically the planning fallacy. When project sponsors construct a budget (the inside view), they build a narrative of success. They visualize the steps required to complete the project under ideal conditions. They implicitly assume that regulatory approvals will arrive on time, that supply chains will hold, and that clinical stakeholders will not change requirements mid-stream.

  The outside view does not ask *how* this specific project will succeed; it asks *how often* similar projects have succeeded. It is the proper expression of epistemic modesty because it admits that the specific knowledge of the project sponsor is subordinate to the general knowledge of statistical reality. In our context, where the base rate of failure is 68% (13 of 19), the inside view has no track record of credibility. To privilege the sponsor's estimate over the historical distribution is to privilege a known liar over a truthful, albeit blunt, witness. The outside view forces us to confront the uncomfortable truth that our "exceptions" are actually the rule.

  **3. The Strongest Case for the Inside View**

  The COO's critique of the outside view is not defensive; it is statistical. A reference class is only as good as its comparability. Our sample of nineteen projects is small, selected, and non-stationary.
  *   **Selected:** These are projects that survived prior screening. They do not represent the universe of proposed projects, but only those deemed viable, introducing survivorship bias.
  *   **Non-Stationary:** The sample spans two distinct regulatory regimes. A cost overrun driven by compliance in 2016 may be impossible in 2023, or vice versa.
  *   **Heterogeneous:** We are mixing routine equipment replacement with novel construction. Aggregating them creates a "fruit salad" base rate that predicts nothing specific.

  Furthermore, the COO argues that the outside view is parasitic. To select a reference class, one must make an inside judgment: *Is this project like the MRI replacement or the new wing?* To decide if the case is typical, one must make another inside judgment. If the outside view relies on inside judgments to construct the mirror in which it reflects, it cannot claim to discipline those judgments. It creates a false sense of objectivity around a number that is just as subjective as the sponsor's estimate, but less accountable.

  **4. The Reflexivity Problem**

  There is a third issue neither side has fully addressed. If we adopt the outside view and systematically pad our forecasts to align with the historical 50% overrun, we change the nature of the data we collect going forward. If the approved budget is inflated to match the likely cost, the project will finish "on budget." The historical overrun rate will drop.

  Does this invalidate the base rate? No. It validates the intervention. The base rate of *overrun* is not a law of physics; it is a measure of our systemic optimism bias. If we correct the bias, the overrun rate should collapse. However, we must distinguish between *forecast accuracy* and *cost control*. Padding the budget improves accuracy but may increase total expenditure if the padding is treated as available slack rather than risk reserve. The authority of the outside view lies in its ability to reveal the true cost of uncertainty, not to provide a slush fund.

  **5. Verdict and Methodological Rule**

  The committee adopts the **Outside View as the Primary Constraint**, subject to Data Hygiene protocols.

  The COO is correct that our raw historical data is flawed, but she is incorrect to conclude that internal judgment is a superior alternative. The inside view has had eight years to prove its reliability and has failed 68% of the time. The outside view's reliance on inside judgments for classification is not a bug; it is a feature that requires governance. The outside view is not parasitic; it is hierarchical. Inside judgments determine *which* class applies; the outside view determines the *cost*.

  Effective immediately, the committee will operate under the **Adjusted Reference Class Rule**:

  1.  **Segmentation:** We will not use a single system-wide base rate. The Finance Office will segment the historical data into three reference classes: *Routine Equipment*, *Renovation*, and *New Construction*. Regulatory regime shifts will be noted; if a class contains fewer than five projects post-regulatory shift, it will be flagged as "Low Confidence."
  2.  **The Baseline:** The starting forecast for any new project is the median cost of its assigned reference class, adjusted for inflation. The sponsor's inside-view estimate is treated as a *bid*, not a *forecast*.
  3.  **The Burden of Proof:** Deviation from the reference class median is permitted *only* if the project sponsor provides evidence of specific risk mitigation that alters the project's risk profile relative to the class. For example, a "New Construction" project may argue for a lower contingency if the design is 100% complete prior to approval (moving it closer to a "Renovation" risk profile). The burden of proof lies entirely on the sponsor to demonstrate they are in the successful 30% of past projects, not on the committee to prove they are in the failing 70%.
  4.  **Reflexivity Management:** To prevent the "padding" of budgets from becoming slack, the "Reference Class Adjustment" will be tracked as a distinct line item (Risk Reserve). This reserve is not released to the project manager for general use. It requires committee approval to access. This ensures that while the *forecast* becomes accurate (reducing the overrun rate), the *spending* remains disciplined.

  **6. Conditions for Revision**

  This rule is not permanent. It is a corrective measure for a system in disequilibrium. We will abandon the strict Outside View constraint if and only if:

  1.  **Sample Stability:** We accumulate a continuous sample of thirty projects within a single regulatory regime where the forecast accuracy (actual vs. approved) remains within ±10% for three consecutive years.
  2.  **Class Purity:** We identify a reference class that is truly homogeneous (e.g., specific modality equipment) where the inside view consistently outperforms the class median.

  Until then, we must accept that our intuition is expensive. The outside view is the only tool we possess that accounts for the things we forget to plan for. It is not an abdication of judgment; it is the acknowledgment that our judgment has a known defect. We will not fix that defect by ignoring the data, but by forcing our plans to conform to it.

  **Approved.**
