          4.  Eliminativism (Only code/electrons exist).
      *   *Ethics/Harm:*
          1.  Mental State (Harm = pain/distress).
          2.  Normative/Description (Harm = violation of rights/rules accepted by participant).
          3.  Deflationary (Talk of "harm" is just about what responses are licensed).
      *   *The Reload Test:* Distinguishes mental state harm (gone if memory gone) vs. objective/normative harm (remains even if forgotten).

  3.  **Drafting the Questions (aiming for 9):**
      *   *Required:* Duplication bug, Unwanted touching, Account stolen, Memorial deleted, NPC begging, Duel loss, World shutdown. (7 cases)
