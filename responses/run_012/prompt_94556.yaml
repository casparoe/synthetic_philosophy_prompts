  # The Dollar Auction Decision Tree

  **Root Node:** Empirical Fact (Bidding reliably exceeds $1.00).

  **Node 1:** Is the bidder's utility function strictly increasing in their own final monetary wealth?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 4.

  **Node 2:** Did the bidder fail to perform backward induction *before* placing the first bid?
  *   **Yes:** Go to Node 3 (Leaf: **Bounded Rationality**).
  *   **No:** Go to Node 3 (Leaf: **Sunk Cost Fallacy**).
      *(Note: Node 3 acts as a terminal splitter for the monetary branch.)*

  **Node 3:** (Monetary Branch Terminal) Was the error a calculation failure (Node 2=Yes) or an execution failure (Node 2=No)?
  *   **Calculation Failure:** Leaf **Bounded Rationality**.
  *   **Execution Failure:** Leaf **Sunk Cost Fallacy**.
  *   **Unoccupied Path:** If the bidder intended to bid >$1.00 *before* the first bid while maximizing only monetary wealth. (Incoherent).

  **Node 4:** Does a rule change refunding all bids if the total exceeds $2.50 eliminate the escalation?
  *   **Yes:** Leaf **Structural Trap**.
  *   **No:** Go to Node 5.

  **Node 5:** Do the non-monetary payoffs depend on the *other* bidder's outcome (e.g., spite, fairness, relative status)?
  *   **Yes:** Leaf **Social Preferences**.
  *   **No:** Go to Node 6.

  **Node 6:** Is the utility derived from signaling reputation to *outside* observers (future opponents)?
  *   **Yes:** Leaf **Strategic Signaling**.
  *   **No:** Leaf **Ludic Utility**.

  ***

  ## The Leaves

  1.  **Bounded Rationality**
      *   *Awkward Commitment:* You have to argue that econ grad students consistently fail simple backward induction puzzles they claim to understand.
  2.  **Sunk Cost Fallacy**
      *   *Awkward Commitment:* You must defend the idea that a rational agent can become irrational mid-game without a change in information or preferences.
  3.  **Structural Trap**
      *   *Awkward Commitment:* This implies fully rational agents are helpless victims of the mechanism, rendering "rationality" useless as a predictive tool in this context.
  4.  **Social Preferences**
      *   *Awkward Commitment:* You are asserting players will burn their own money specifically to reduce another's payoff, even when anonymity is guaranteed.
  5.  **Strategic Signaling**
      *   *Awkward Commitment:* This requires an audience that isn't present; bidders pay to signal toughness in a one-off game where reputation has no future value.
  6.  **Ludic Utility**
      *   *Awkward Commitment:* This reduces the auction to a thrill-seeking exercise, implying the "loss" is actually the price of admission for entertainment.
  7.  **Unoccupied (Incoherent Planner)**
      *   *Awkward Commitment:* "I intended to lose money for no reason other than money," which violates the definition of agency used in the model.

  ***

  ## Analysis of the Tree

  ### Indistinguishable Leaves
  **Bounded Rationality vs. Sunk Cost Fallacy:** Empirically, these are nearly impossible to separate. Both predict escalation from a starting point of ignorance or error. To distinguish them, you need process data (think-aloud protocols) to see if the bidder *could* have calculated the equilibrium at $t=0$. Without that, a failed calculation looks identical to a failure to ignore past costs.

  **Strategic Signaling vs. Social Preferences:** Both predict aggressive bidding beyond monetary value. Unless you vary the anonymity of the players or the existence of future games, you cannot tell if a bidder is punishing an opponent (Social) or building a reputation (Signaling). In a standard one-shot anonymous dollar auction, **Strategic Signaling** is theoretically weak, making it functionally indistinguishable from **Ludic Utility** unless the subject explicitly cites reputation.

  ### Unoccupied Combinations
  **Monetary Maximizer + Intended Escalation:** (Node 1 = Yes, Node 2 = "Intended >$1"). This combination is unoccupied because it is incoherent. If utility is strictly monetary, intending to bid $1.50 for a $1.00 prize is a direct violation of the maximization assumption. No serious theorist defends this; it is the definition of a mistake, not a strategy.

  **Social Preferences + Structural Trap:** (Node 4 = Yes). This combination is theoretically possible but rarely defended as a primary explanation. If the refund rule stops the bidding, proponents of Social Preferences must admit the "spite" was contingent on the *rules* allowing exploitation, not an intrinsic drive. Usually, if the rule change stops it, the "Structural Trap" leaf swallows the explanation, rendering the specific psychological preference irrelevant.

  ### Why Some Paths Are Unattractive
  **Ludic Utility:** While plausible, this is often unattractive to economists because it is unfalsifiable. Any deviation from monetary maximization can be retroactively fitted with a "utility of play" parameter. It explains everything and predicts nothing unless the thrill parameter is measured independently.

  **Structural Trap:** Philosophers may find this unattractive because it absolves the agents of moral or rational responsibility. If the design forces the loss, the "rational agent" model is not just wrong, it is categorically inapplicable, suggesting we need a entirely different framework for institutional analysis.
