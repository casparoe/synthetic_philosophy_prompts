answer: |-
  **Project Title:** Separateness as Precondition: Re-evaluating the Aggregation Objection to Utilitarianism

  **1. The Research Question**
  The standard objection that utilitarianism fails to respect the "separateness of persons" is typically interpreted as a metaphysical critique of aggregation: that summing utilities across distinct individuals is category error akin to summing across distinct species. This project asks a more precise question: **Does the force of the separateness objection derive from a metaphysical claim about the ontology of persons, or does it function solely as a placeholder for an independent principle of distributive justification?**

  This question admits a fact of the matter. If the objection relies on metaphysics, it should retain force even in the absence of specific distributive principles. If it relies on justification, it should collapse when the justificatory demand is made explicit. Crucially, this is not a question of whether consequentialism is true, but whether the *specific argument* from separateness is valid. The project seeks to determine if the objection is a freestanding argument or a restatement of a prior commitment to non-aggregative justice.

  **2. The Gap in Existing Positions**
  Current dialectics leave this question unresolved because utilitarian defenses typically bypass the distinction between ontology and justification. Standard replies argue either that aggregation does not entail sacrifice (the "sum is what matters" defense) or that the objection begs the question by assuming deontological constraints (the "circularity" defense).

  Both replies concede the objector's framing. They defend the *result* of aggregation without challenging the *premise* that separateness threatens it. Consequently, the debate stalls. The utilitarian claims separateness is irrelevant to the good; the objector claims it is essential to justice. Neither examines the possibility that separateness is actually a *precondition* for aggregation—one cannot sum interests unless they belong to distinct loci of experience. By failing to disentangle the ontological claim (persons are distinct) from the justificatory claim (distinct persons require distinct justification), existing literature obscures whether the objection is a metaphysical insight or a normative assertion in disguise.

  **3. Methodology**
  This project employs conceptual analysis and argument reconstruction rather than formal modeling. A formal model of aggregation would obscure the normative significance of the boundaries between agents; it can demonstrate *how* to sum utilities, but not *why* the boundaries between units of account should matter morally. The work will proceed in three stages over the semester:

  *   **Month 1: Disentanglement.** I will reconstruct the separateness objection to isolate the ontological premise from the justificatory conclusion. I will argue that the ontological claim (there is no super-person) is neutral regarding aggregation, as aggregation requires distinct units to sum.
  *   **Month 2: The Intrapersonal Test.** I will apply the objection to intrapersonal trade-offs across time. Utilitarianism permits trading a person's earlier interests for later ones. If the separateness objection is about *persons*, it should not apply here. If it does apply, the objection is not about persons but about *time-slices* or the structure of justification itself. This isolates the variable of "personhood."
  *   **Month 3: The Distributive Test.** I will test the objection against constrained aggregative views (e.g., prioritarianism). If the objection loses force when a distributive constraint is added, this demonstrates that the objection was never about separateness per se, but about the lack of a distributive principle.

  **4. Scope and Target View**
  The primary target is Classic Act Utilitarianism (Pure Sum-Ranking). This view is most vulnerable because it posits no independent distributive constraints. However, the project will also assess whether the objection survives against views that aggregate but subject aggregation to a distributive constraint (e.g., weighted prioritarianism).

  If the objection indicts only pure sum-ranking, this reveals that the "separateness of persons" is a mislabeled critique of *unconstrained* aggregation. If the force survives against constrained views, it suggests a deeper metaphysical incompatibility. Determining which is the case is central to the paper's contribution. The scope is limited to the *argument from separateness*, not a general defense of utilitarianism.

  **5. Outcomes and Success Conditions**
  *   **Positive Result:** The project succeeds if it demonstrates that the ontological claim of separateness supports, rather than undermines, aggregation, and that the objection's force relies entirely on a covert appeal to a specific justificatory norm (e.g., contractualism).
  *   **Negative Result:** The project fails if it cannot show that the ontological and justificatory claims are separable, or if the intrapersonal test proves inconclusive regarding the role of personhood.
  *   **Restatement:** A significant intermediate outcome is showing that the objection is merely a restatement of a distributive ideal. This would not refute utilitarianism but would clarify the dialectic, forcing objectors to defend the distributive principle directly rather than hiding behind metaphysics.

  **6. Risk Assessment and Trimming**
  The primary risk is scope creep regarding the metaphysics of personal identity. The "intrapersonal test" risks devolving into a debate on psychological continuity versus bodily identity, which is too large for an 8,000-word paper.

  *   **Mitigation:** I will treat personal identity as a fixed variable for the sake of the argument, focusing on the *moral significance* of the boundary rather than its constitution.
  *   **Cutting Plan:** If the intrapersonal analogy becomes unwieldy, I will excise the time-slice analysis and focus exclusively on the distinction between ontological distinctness and justificatory individualism. This preserves the core thesis (the conflation of ontology and justification) while sacrificing the comparative test case. The semester timeline is sufficient for the conceptual disentanglement, but insufficient for a full treatment of diachronic identity; the cut ensures completion.
