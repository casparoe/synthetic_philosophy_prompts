answer: |-
  The debate over neural network interpretability has largely calcified into a stale between two unsatisfying positions. On one side, the realists argue that networks develop genuine internal representations—that there is a neuron or a subspace that literally "means" *curve* or *subject-verb agreement*, waiting to be discovered like a fossil embedded in stone. On the other side, the instrumentalists argue that these representations are merely useful fictions, convenient shorthand for behavior that has no underlying semantic truth.

  Both sides are wrong. The realist reifies relationships into objects, while the instrumentalist dismisses the rigorous structure of those relationships as mere convenience. We need a third position: an anti-realism about representational content that is nonetheless a realism about causal structure. Specifically, we should argue that neural networks do not possess representational content; they possess intervention-relative structure. Attributing content to a network state is a category mistake. We are not finding pre-existing concepts; we are mapping how specific states respond to specific classes of interventions. This view does not render interpretability pointless. Rather, it transforms the field from a metaphysical treasure hunt into a discipline of engineering cartography.

  To understand why "content" is a category mistake, we must look at what we actually measure. When a researcher claims a neuron encodes "sentiment," they are not observing a semantic property intrinsic to the activation value. They are observing a correlation between that activation and a specific set of inputs, validated by a specific set of interventions (e.g., ablating the neuron changes the output classification). The "meaning" is not inside the weight matrix. It exists in the relational gap between the intervention and the outcome.

  If you change the intervention class, the "content" shifts. A feature that looks like "dog detection" under standard natural image distributions might look like "texture detection" under adversarial perturbations. The realist is forced to say the network is confused or the feature is polysemantic. The intervention-relative structuralist says the obvious thing: you changed the probe, so you changed the property being measured. There is no "dog" in the machine. There is only a causal pathway that remains stable under a specific set of manipulations. To call this "content" is to mistake the map for the territory, or worse, to mistake the legend for the map.

  This deflationary view might seem to drain interpretability of its purpose. If there are no concepts to discover, why bother looking? The answer is that this view actually clarifies the work. Interpretability becomes engineering cartography. Consider a subway map. It is geographically inaccurate; it distorts distances and straightens curves. A realist looking for geographical truth would call it false. An instrumentalist would call it a useful lie. But an engineer knows it is a valid topology relative to the intervention of "riding the train." It is real work to draw that map. It requires understanding the causal structure of the network to predict how it will behave under stress, how to edit it, and how to align it. We are not archaeologists brushing dust off ancient tablets; we are surveyors drawing blueprints for systems we intend to modify. The work is not less rigorous because the "meaning" is relative; it is more rigorous because it admits the dependency on the probe.

  The true test of this position, however, is how it handles the standard objection that usually sinks anti-realist accounts: the transfer problem. Realists argue, "If representations aren't real, why do we find the same 'curve detectors' or 'grammar heads' across completely different architectures and tasks? Surely that convergence implies objective existence."

  The realist explanation is intuitive but fragile. It assumes that because the feature appears in multiple places, it must be a Platonic form the network is compelled to find. This works until it doesn't. When a finding fails to transfer—when a "safety feature" found in one model vanishes in a slightly larger model with a different optimizer—the realist has no good explanation other than to say the feature is "hidden" or "distributed differently." They are forced to treat non-transfer as an anomaly.

  The intervention-relative structuralist handles this seamlessly. Transfer is not evidence of shared content; it is evidence of shared structural constraints under shared intervention distributions. If two models are trained on similar data (the input intervention) and optimized for similar loss landscapes (the structural constraint), their causal graphs will converge. They will develop isomorphic structures because they are solving the same engineering problem under the same physical constraints.

  Crucially, this view predicts *when* transfer will fail. It fails when the intervention class changes. If you change the tokenizer, the input intervention changes, and the "same" feature may no longer map to the same structural node. If you change the task from next-token prediction to question answering, the intervention class shifts, and the "grammar head" might dissolve. The realist sees this as a mystery: "Where did the grammar go?" The structuralist sees it as a certainty: "You changed the conditions of the map, so the landmarks shifted."

  This explains the patchy nature of interpretability findings better than realism ever can. Realism expects robustness because truth is supposed to be robust. Structuralism expects fragility because causal pathways are sensitive to initial conditions and boundary constraints. When we see a feature transfer across architectures, it is not because we found a universal concept; it is because the engineering constraints of language or vision force similar causal solutions. When we see it fail, it is because the intervention-relative structure has diverged.

  By adopting this stance, we save interpretability from metaphysical dead ends. We stop asking "What does this neuron mean?" and start asking "What interventions does this state stabilize?" We stop treating models as black boxes containing hidden homunculi and start treating them as causal systems with mappable topologies. This is not a retreat into skepticism. It is an advancement into precision. It acknowledges that while there is no "ghost in the machine," there is definitely a machine, and if we want to control it, we need to understand its gears—not by naming them, but by knowing exactly how they turn when we push them.
