      *   **Core Claim:** We only establish how internal states respond to interventions; calling this "content" is a category mistake.
      *   **Implication:** Interpretability is "engineering cartography" (mapping for use) rather than "discovery" (finding pre-existing truths).
      *   **Key Objection to Address:** Why do some findings transfer across architectures/tasks while others don't? (The argument must claim this view handles it *better* than realism).
      *   **Format:** Argumentative essay/prose.
      *   **Style:** American English, no citations.

  2.  **Deconstruct the Core Distinction:**
      *   *Realist View:* There are "features" or "concepts" (e.g., "cat," "grammar rule") existing inside the network waiting to be found. Interpretability is archaeology.
      *   *Standard Anti-Realist View:* These features aren't real, but talking about them is convenient (instrumentalism).
      *   *Proposed View (Intervention-Relative Structuralism):* The network has a causal structure. We probe it with interventions (probes, ablations, prompts). The "meaning" arises from the *relationship* between the intervention and the state change, not from the state itself having intrinsic semantic content. It's not fiction; it's a relational property.
      *   *Analogy:* A map isn't the territory, but it's not a "lie" either. It's a tool defined by how you use it (the intervention).

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The current debate is stuck between "neurons are grandmas" (realism) and "it's all just math" (trivial instrumentalism).
          *   Thesis: We need a third way. Representations aren't things with content; they are nodes in an intervention-relative structure.
          *   Roadmap: Define the distinction, reframe the goal of interpretability, solve the transfer problem.

      *   **The Category Mistake (Content vs. Structure):**
          *   Explain why "content" is wrong. Content implies semantics independent of use.
          *   Explain "intervention-relative structure." A neuron activates *given* a specific perturbation or input distribution.
          *   Analogy: A switch isn't "on" intrinsically; it's "on" relative to the circuit it's powering.
          *   Claim: Attributing "content" reifies a relationship into an object.

      *   **Reframing Interpretability (Cartography vs. Archaeology):**
          *   If there's no hidden content to discover, what are we doing?
          *   Metaphor: Engineering Cartography. We are drawing maps for specific navigational purposes.
          *   A subway map isn't "false" because it distorts distance; it's valid relative to the intervention of "riding the train."
          *   This gives interpretability *real work*. It's not just "nothing is real, go home." It's "build better maps for specific interventions."

      *   **Addressing the Transfer Objection (The Strong Point):**
          *   *Objection:* Realists say, "If features aren't real, why does 'curve detection' show up in Vision Transformers and CNNs alike?"
          *   *Realist Explanation:* Because curves are real things in the world and the network finds them.
          *   *Problem with Realism:* It fails when transfer *doesn't* happen. Why does a feature vanish when I change the optimizer? If it was "real," it should be robust.
          *   *Intervention-Relative Explanation:* Transfer happens when the *intervention structure* is isomorphic across models. If two models are trained on similar data (intervention distribution) with similar loss landscapes (structural constraints), their causal graphs look similar.
          *   *Why this is better:* It predicts *when* transfer fails. It fails when the intervention class changes (e.g., adversarial robustness, different tokenizers). Realism has to say the feature "moved" or "hid." Structuralism says the map no longer applies to this terrain.

      *   **Conclusion:**
          *   Summarize the shift.
