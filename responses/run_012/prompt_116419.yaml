prompt: |-
  Please argue for a position for me: that interpertability research on neural networks should be anti-realist about representations, but not in the usual way where you say it's all just a useful fiction. To make it nontrivial, run with a distinction I've been kicking around between representational content and intervention-relative structure — the idea is that all we ever actually establish is how a network's internal states respond to some specified class of interventions, and that calling that content is a category mistake. Argue that this deflationary view is right, that it still leaves interpretability with real work to do (something like engineering cartography rather than discovery), and that it handles the standard objection better than realism does, namely why some findings transfer across architectures and tasks and others don't. I don't need citations, and please write in American English.
reasoning: |-
