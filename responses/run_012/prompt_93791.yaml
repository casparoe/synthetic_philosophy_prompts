prompt: |-
  I am a third-year student in a political philosophy seminar, and for the past few weeks we have been circling around the question of whether ordinary social conventions—queueing in order, leaving a tip at a sit-down restaurant, waiting for the walk signal even when no car is coming—are genuine moral obligations or merely local etiquette that one can ignore without moral fault. My puzzlement comes from a concrete institutional practice. My university has recently revised its international student orientation. One module, called Local Norms, instructs incoming students from abroad to treat a list of host-country conventions as binding: form a single queue and never hold a place for a friend, tip twenty percent at table-service restaurants, do not jaywalk even on an empty street at three in the morning, and stand on the right side of the escalator. The module's language is moralized: it says that ignoring these expectations is not merely gauche but disrespectful, and that visitors who do so wrong the locals who have to accommodate them. Yet the same orientation, in a different session, tells students that judging another culture's customs by their home standards is a category mistake, and that moral criticism of unfamiliar practices is usually unwarranted. And the surrounding institutional signals are mixed: campus security has stopped ticketing jaywalking on the grounds that it is not a real offense, while the student government has passed a resolution calling the expectation to tip a coercive imposition on international students.

  I want to know what philosophical commitments this practice—the orientation module, together with the qualifications and exceptions the university actually makes—presupposes. Does it presuppose a relativist view, on which the bindingness of a convention is indexed to the local community and visitors acquire obligations simply by entering the territory? Or does it presuppose something more like a fair-play or natural-duty view, on which visitors owe compliance because they benefit from a scheme of coordination and because respect for persons requires not free-riding on shared expectations? Or is it committed to a Humean or Lewis-style account on which conventions are solutions to coordination problems and therefore generate obligations only when the coordination is actually valuable, which would make the empty-street jaywalking case a hard test? Reconstruct the implicit theory as carefully as you can, and distinguish what the practice strictly presupposes from what it merely fits with. In particular, is the module committed to the idea that the same convention binds locals and visitors alike, or does its asymmetry—locals who jaywalk are said to be taking a small liberty, while visitors who jaywalk are said to be disrespectful—reveal a role-based or associative view of obligation? Which rival theories does the practice quietly rule out, and is it internally consistent with the security policy and the student government resolution, or do those parts presuppose incompatible pictures? Finally, suppose we replaced the presupposed view with the view that everyday conventions are morally inert unless they protect rights or prevent harm. What would have to change in the orientation module, in how the university enforces or declines to enforce the conventions, and in what it owes to visitors who violate local norms?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Third-year political philosophy student.
      *   **Context:** Seminar on moral obligations vs. social conventions (queueing, tipping, jaywalking, etc.).
      *   **Problem Case:** University orientation module for international students ("Local Norms").
      *   **Key Features of the Case:**
          *   Module instructs students to treat host-country conventions as *binding* (moralized language: "disrespectful," "wrong the locals").
          *   Module simultaneously warns against judging other cultures by home standards (anti-ethnocentrism/relativist hint).
          *   Mixed Signals: Campus security stopped ticketing jaywalking (decriminalization/low priority), but Student Gov calls tipping "coercive" (critique of the norm itself).
          *   Asymmetry: Locals jaywalking = "small liberty"; Visitors jaywalking = "disrespectful."
      *   **Tasks:**
          1.  Reconstruct the implicit philosophical theory presupposed by the practice (orientation + qualifications + exceptions).
          2.  Distinguish what is *strictly presupposed* vs. what merely *fits*.
          3.  Analyze the asymmetry (locals vs. visitors): Does it imply role-based/associative obligations?
          4.  Identify rival theories ruled out.
          5.  Assess internal consistency (Orientation vs. Security vs. Student Gov).
          6.  Counterfactual: What changes if we adopt the view that conventions are morally inert unless they protect rights/prevent harm?

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Relativism/Conventionism:* Obligations are indexed to location/community. "When in Rome..."
      *   *Fair Play/Principle of Fairness (Hart/Rawls):* Benefiting from a cooperative scheme creates an obligation to do one's part.
      *   *Natural Duty of Justice/Respect for Persons:* We owe respect to others; violating expectations disrupts their agency or causes anxiety.
      *   *Hume/Lewis (Coordination Conventions):* Conventions solve coordination problems. Obligation exists only if the convention actually serves coordination. (Empty street jaywalking challenges this).
      *   *Associative Obligations (Dworkin/Waldron):* Obligations arise from membership or specific roles (e.g., "guest").
      *   *Legal Moralism/Paternalism:* (Ruled out mostly, given the security policy change).
      *   *Harm Principle (Mill):* Only harm justifies interference.

  3.  **Drafting the Reconstruction (Step-by-Step):**

      *   **The Core Tension:** The module says "Follow these rules because they are moral (respect)" but also "Don't judge other cultures." This looks like *Local Relativism* but the justification ("disrespect") sounds *Universalist* (respect is a universal duty).
      *   **The Asymmetry (Locals vs. Visitors):** This is crucial. If the rule were purely about coordination (Lewis), it should bind everyone equally when the coordination is active. If it binds visitors *more* strictly (morally) than locals (who get a "liberty"), this suggests an *Associative* or *Guest-Host* model. The visitor has a specific duty of accommodation that the local does not.
      *   **The Mixed Signals:**
          *   Security (no tickets) $\rightarrow$ Jaywalking isn't a *legal* wrong or harmful enough for state coercion.
          *   Student Gov (tipping is coercive) $\rightarrow$ The norm itself might be unjust.
          *   Orientation (follow norms) $\rightarrow$ You still have a duty to follow them.
          *   *Consistency Check:* Can you have a moral duty to follow an unjust or non-enforced norm? Yes, under Fair Play or Respect, but it creates tension.

      *   **Identifying the Implicit Theory:**
          *   It's not pure Relativism (because it appeals to "respect," a universal value).
          *   It's not pure Lewisian Coordination (because empty street jaywalking is still called "disrespectful" despite no coordination failure).
          *   It looks like a hybrid: **A Duty of Hospitality/Respect grounded in Fair Play.**
          *   *Strict Presupposition:* There is a pro-tanto moral duty to comply with local coordination norms to avoid imposing psychological/transactional costs on locals (Respect).
          *   *Role-Based:* Visitors have a stronger duty than locals because locals *own* the convention, visitors are *guests*.

      *   **Rival Theories Ruled Out:**
          *   *Hard Legal Positivism:* (Security doesn't enforce, yet Orientation says it's wrong).
          *   *Act Utilitarianism:* (Empty street jaywalking produces no bad utility, yet is called wrong).
          *   *Strict Moral Universalism:* (Implies some conventions are morally binding despite varying by culture).

      *   **The Counterfactual (Conventions are Morally Inert):**
          *   If conventions are inert unless rights/harm involved:
          *   Orientation: Must change language from "disrespectful" to "pragmatic advice."
          *   Enforcement: Security policy aligns (no tickets).
          *   Tipping: Student Gov view becomes the official view (it's optional/unjust).
          *   Obligation to Visitors: University owes them protection from social sanction, not enforcement of norms.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say the university *believes* one thing. I need to say what the *practice presupposes* to make sense.
      *   *Nuance on Asymmetry:* Why is visitor jaywalking "disrespectful" but local jaywalking a "liberty"? This implies the local has standing to waive the norm or that the norm is partly constitutive of their community identity, which the visitor must honor. This leans towards **Associative Obligations**.
      *   *Nuance on Consistency:* The Security policy and Student Gov resolution actually *undermine* the Orientation module's moralizing. If tipping is "coercive," why is it "disrespectful" not to tip? This suggests the University administration is fragmented, or the Orientation module is philosophically incoherent. I should highlight this incoherence.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the puzzle. State the thesis: The practice presupposes a hybrid view (Respect-based Fair Play with Associative elements) but suffers from internal tension.
      *   **Section 1: Reconstructing the Implicit Theory.** Focus on the "Respect" justification. It's not just coordination; it's about not disrupting the social fabric.
      *   **Section 2: The Asymmetry (Locals vs. Visitors).** Analyze the "Guest" status. This rules out pure Universalism or pure Lewisian Coordination.
      *   **Section 3: Internal Consistency.** Contrast Orientation vs. Security vs. Student Gov. Show where the contradictions lie (Moral duty vs. Legal enforcement vs. Structural critique).
      *   **Section 4: Rival Theories.** What is excluded? (Utilitarianism, Legal Positivism, Hard Relativism).
      *   **Section 5: The Counterfactual (Morally Inert Conventions).** Walk through the practical changes required.
      *   **Conclusion:** Summarize the philosophical cost of the current policy.

  6.  **Final Polish:** Ensure tone is appropriate for a third-year seminar student (rigorous, precise, engaging with specific philosophers like Lewis, Hart, Rawls, Mill implicitly or explicitly). *Self-correction: Make sure to explicitly address the "strictly presupposes vs. merely fits" distinction requested.*

      *(Self-Correction during drafting)*: Wait, does the module *strictly presuppose* the asymmetry? The prompt says "locals who jaywalk are said to be taking a small liberty, while visitors who jaywalk are said to be disrespectful." This suggests the *discourse* around the practice creates the asymmetry. I need to analyze if the *policy* requires this or if it's just how it's communicated. The prompt asks about the "practice... together with the qualifications." So the asymmetry is part of the data to be explained.

      *(Refining the "Relativist" question)*: The prompt asks if it presupposes relativism. The answer is likely "No, not strict relativism." Strict relativism would say "It's not wrong, it's just different here." The module says "It *is* wrong (disrespectful) *here*." That's a universal duty (respect) applied to local content.

      *(Refining the "Lewis" question)*: Lewis conventions depend on the expectation of compliance. If no cars are coming, the coordination problem dissolves. If the module still says "Don't do it," it rejects pure Lewisianism in favor of a normative conventionalism (the rule stands even when the utility fades).

      *(Final check on the Counterfactual)*: If conventions are inert, the Orientation module becomes a "Travel Guide" rather than a "Moral Code."

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is an exceptionally rich case study because it forces us to disentangle the *source* of an obligation from its *content*. Your university's practice is not philosophically neutral; it is enacting a specific, albeit somewhat fractured, theory of conventional obligation. To reconstruct it, we must distinguish between the *justification* offered for the norms (respect, non-free-riding) and the *status* of the norms (local, binding, coercive).

  Here is a reconstruction of the implicit theory, an analysis of its internal tensions, and the implications of the counterfactual you propose.

  ### 1. Reconstructing the Implicit Theory

  The orientation module does not strictly presuppose **Cultural Relativism**. A strict relativist would hold that moral truth is indexed to culture, such that an act is not "wrong" simpliciter, but only "wrong-relative-to-culture-X." However, your module uses moralized language ("disrespectful," "wrong the locals") that appeals to a trans-cultural value: *respect*. It implies that while the *content* of the rule is local (tip 20%, stand right), the *duty* to follow it is universal (one ought to show respect to hosts).

  Therefore, the practice strictly presupposes a **Hybrid View of Conventional Obligation**, combining elements of the **Principle of Fair Play** with a **Duty of Hospitality**.

  *   **The Fair Play Component:** By entering the host society, the visitor benefits from the stability and predictability provided by local conventions (e.g., orderly queues, predictable traffic patterns). Even if the visitor did not consent to these specific rules, accepting the benefit of social order generates a *pro tanto* obligation to comply so as not to free-ride on the self-restraint of locals.
  *   **The Hospitality Component:** This explains the moralized language. The obligation is not merely about efficiency (coordination); it is about *recognition*. To ignore a local convention is to signal that one's own habits take precedence over the host community's shared life. This treats the locals as mere background rather than co-participants in a social world.

  **What is Strictly Presupposed vs. What Merely Fits:**
  *   **Strictly Presupposed:** The view that social conventions can generate *moral* duties (not just prudential advice) based on the value of interpersonal respect and cooperative stability. It presupposes that "disrespect" is a genuine moral harm, even if no physical harm occurs.
  *   **Merely Fits:** The specific list of norms (tipping, queuing). The theory could justify a different list of norms provided they serve the same coordinative/expressive function. The theory fits with **Rule-Conventionalism** (follow the rule because it is the rule), but it does not strictly require it; it could also fit with a **Scanlonian contractualism** (rules we couldn't reasonably reject given the need for mutual accommodation).

  ### 2. The Asymmetry: Locals vs. Visitors

  The distinction you noted—locals taking a "liberty" vs. visitors being "disrespectful"—is the most philosophically revealing feature of this practice. It rules out a pure **Lewisian Coordination Account**.

  On David Lewis's account, a convention is a solution to a recurrent coordination problem. If the street is empty at 3:00 AM, the coordination problem (avoiding collisions) is absent. Therefore, the obligation to wait dissolves for *everyone*. If the university holds that visitors must wait even when the coordination value is nil, but locals get a pass, Lewisianism cannot explain it.

  Instead, this asymmetry presupposes an **Associative or Role-Based View of Obligation**.
  *   **The Local:** As a member of the community, the local has a degree of "ownership" over the convention. They have the standing to interpret, bend, or occasionally violate the norm without undermining the social fabric, provided they do not do so excessively. Their relationship to the norm is constitutive.
  *   **The Visitor:** The visitor is in the role of a "guest." In political philosophy (reminiscent of Kant's *Right of Hospitality* or Walzer's *Spheres of Justice*), guests do not have the standing to interpret the host's rules. Their obligation is stricter because their violation signals a rejection of the host's authority to define the social space.

  Thus, the practice presupposes that **obligations are not only content-sensitive but agent-relative.** The moral weight of jaywalking is not in the act itself, but in the *relationship* between the actor and the community whose norm is being violated.

  ### 3. Internal Consistency: Orientation vs. Security vs. Student Gov

  Here the university's practice reveals significant incoherence. The three arms of the institution presuppose incompatible pictures of normativity.

  1.  **Orientation (Moral Conventionalism):** Presupposes that conventions create moral duties based on respect.
  2.  **Campus Security (Legal Positivism / Minimalism):** By stopping ticketing, Security presupposes that unless a rule is codified and enforced by the state (or institution), it is not a genuine "offense." They treat jaywalking as *malum prohibitum* (wrong because prohibited) and, removing the prohibition, remove the wrong. This contradicts Orientation, which claims jaywalking is *malum in se* (wrong in itself, i.e., disrespectful) regardless of enforcement.
  3.  **Student Government (Critical Theory / Structuralism):** By calling tipping "coercive," Student Gov presupposes that some conventions are not legitimate sources of obligation because they arise from unjust power dynamics. If tipping is coercive, complying with it is not "respect," but submission to exploitation.

  **The Contradiction:**
  The Orientation module tells students they have a moral duty to tip to show respect. The Student Government tells them tipping is a coercive imposition.
  *   If Student Gov is right, Orientation is demanding students participate in their own exploitation (or the exploitation of workers) under the guise of etiquette.
  *   If Orientation is right, Student Gov is encouraging moral free-riding.

  The university is effectively saying: "You have a moral duty to follow rules that we admit might be unjust (tipping) and that we refuse to enforce (jaywalking)." This is a **fragmented normativity**. It offloads the burden of moral consistency onto the student.

  ### 4. Rival Theories Ruled Out

  The current practice quietly rules out several major philosophical positions:

  *   **Act Utilitarianism:** This is ruled out by the "empty street" clause. If no cars are coming, jaywalking produces more utility (saving time) and zero harm. A utilitarian orientation would say, "Jaywalk if it's safe." The module forbids it, prioritizing rule-following over outcome maximization.
  *   **Hard Legal Positivism:** If the only obligations were those enforced by authority, the Security policy (no tickets) would render the Orientation module nonsensical. The module asserts moral force *beyond* legal enforcement.
  *   **Strict Moral Universalism:** A hard universalist might argue, "Tipping is unjust everywhere," or "Jaywalking is harmless everywhere." The module rejects this by insisting that the *local* context determines the moral valence of the act.
  *   **Libertarianism:** A libertarian view would hold that as long as no rights are violated (no hitting cars, no stealing), the student is free to act. The module's claim that one "wrongs the locals" by not tipping or queuing implies a duty to others that is not grounded in explicit contract or rights infringement, which libertarians would reject.

  ### 5. The Counterfactual: Conventions as Morally Inert

  Suppose we replace the presupposed view with the **Harm/Rights Principle**: *Everyday conventions are morally inert unless they protect rights or prevent tangible harm.*

  This is a Millian shift. Under this view, queueing, tipping, and empty-street jaywalking are prudential or aesthetic, not moral. Here is what must change:

  **A. The Orientation Module:**
  *   **Language:** All moralized language ("disrespectful," "wrong," "obligation") must be stripped. It becomes a **Pragmatic Guide**.
      *   *Current:* "Failing to tip wrongs the server."
      *   *New:* "Failing to tip may result in social disapproval or confrontation, though it is not morally required."
      *   *Current:* "Jaywalking is disrespectful."
      *   *New:* "Jaywalking is legal but may be culturally startling; proceed at your own social risk."
  *   **Justification:** The justification shifts from *duty* to *consequence management*. You follow norms not because you *owe* it to the locals, but to avoid friction for yourself.

  **B. Enforcement and Institutional Stance:**
  *   **Security:** The current policy (no ticketing) aligns perfectly with this view. No harm = no enforcement.
  *   **Student Government:** Their resolution on tipping becomes the institutional baseline. If tipping is coercive and conventions are inert, the university should arguably move to a "service included" model to remove the convention entirely, rather than asking students to navigate it.
  *   **University Liability:** Currently, if a student is harassed for not tipping, the university might say, "You violated the norm." Under the Inert View, the university would have to protect the student from harassment, acknowledging that the norm itself has no moral weight.

  **C. Obligations to Visitors:**
  *   **Current View:** The university owes visitors *instruction* on how to be moral agents in the new context.
  *   **Inert View:** The university owes visitors *protection* from the arbitrary sanctions of the local culture.
  *   **Change:** Instead of telling students "You must adapt," the university would tell locals "You must accommodate." The burden of adjustment flips. If the norm is morally inert, the local has no moral claim to be offended. Therefore, the institution should shield international students from the social costs of violating inert norms (e.g., mediating conflicts with landlords or restaurant staff over these issues).

  ### Summary for Your Seminar

  Your university's practice presupposes a **Role-Based Conventionalism**: conventions bind morally because they are the medium through which we show respect to specific communities, and visitors bear a heavier burden of compliance than members.

  However, the practice is **internally unstable**. It demands moral compliance with norms that the security apparatus treats as non-offenses and the student representatives treat as unjust. It asks students to inhabit a philosophical contradiction: that they must treat inert conventions as moral duties.

  If you were to argue this in seminar, your strongest point is the **Asymmetry**. If the obligation were truly about coordination (Lewis) or universal respect (Kant), it should bind locals and visitors equally. The fact that it binds visitors *more* strictly reveals that the "obligation" is not really about the act (jaywalking), but about **power and membership**. The orientation module is less a moral education and more a technology of border control, using etiquette to demarcate who belongs and who must strive to belong.
