      *   If the objective is physically instantiated (e.g., a specific subnetwork computing "distance to red"), then (2) doesn't make it arbitrary. It makes the *inference* hard, but not the *fact* arbitrary.
      *   The friend's argument is essentially: "Underdetermination of theory by data implies there is no fact of the matter about the theory." This is a philosophical leap (Quinean holism vs. Scientific Realism).
      *   In ML, we care about *counterfactual behavior*. The objective is defined by what the system *would* do in novel situations, not just what it *did* do.
      *   So, the error is conflating *inverse reinforcement learning from a trace* with *mechanistic interpretation of the policy*.

