answer: |-
  To resolve this dispute, we must first dissect the equivocations plaguing the term "information." In biology, "information" oscillates between three distinct senses: (1) mere causal covariation (a thermometer correlates with temperature); (2) digital specificity (a sequence of discrete states); and (3) selected-effect function (a structure exists *because* it correlates with an outcome). Nadia's parity argument relies on collapsing these into the first sense. If information is merely causal correlation, she is correct: the cytoplasm correlates with the organism just as the DNA does. However, this renders the concept of information trivial. If everything that contributes causally carries "information," then the term loses its explanatory power to distinguish *control parameters* from *background conditions*.

  Your defense of DNA as code rests on senses (2) and (3). DNA is not just a cause; it is a *template* whose linear sequence dictates the linear sequence of a polymer via a decoding mechanism. This is where the "code" metaphor transitions from poetry to ontology. A genuine code requires an arbitrary mapping between symbol and referent. Nadia challenges this by noting the genetic code is "frozen." If we cannot renegotiate the mapping (as we do with human language), is it truly conventional?

  Here, molecular detail is decisive. The mapping is arbitrary because there is no stereochemical necessity forcing a specific codon (e.g., UUU) to bind a specific amino acid (Phenylalanine). If chemical affinity dictated the mapping, the ribosome would be unnecessary; mRNA would directly bind amino acids. It does not. The "meaning" is established by the aminoacyl-tRNA synthetases, enzymes that physically link the tRNA anticodon to the amino acid. This adaptor mechanism breaks the chemical chain, inserting a layer of interpretation. The existence of variant codes (e.g., in mitochondria or *Candida* species, where stop codons encode Tryptophan) proves the mapping is not a law of physics but a historical contingency. It is a "frozen convention." The fact that it is currently unchangeable for most lineages does not negate its status as a code; it merely indicates the evolutionary cost of changing the dictionary is prohibitive. A code does not cease to be a code because the users are trapped within it.

  This leads to Nadia's stronger claim: Causal Parity. She argues that because development requires the egg's cytoplasm, membrane, and environment, singling out DNA as the "information" carrier is arbitrary. She suggests this proves too much: if DNA is information, why isn't the oven information for the cake?

  The parity thesis fails because it conflates *causal necessity* with *specificity*. In a causal system, we distinguish between parameters that vary to produce specific outcomes and conditions that remain constant to allow the process to occur. The cytoplasm provides the energetic and material conditions (the oven); the DNA provides the specific sequence instructions (the recipe). If you swap the cytoplasm between two species but keep the nucleus, the organism develops according to the nuclear DNA (as seen in cloning). If you swap the DNA but keep the cytoplasm, the organism changes. The DNA is the *differentiating cause*. It carries information in the sense that its specific arrangement, among many possible arrangements, is selected to produce a specific phenotypic effect. The cytoplasm does not vary in the same combinatorial way to specify the organism's traits.

  Furthermore, the parity argument ignores the directional flow of specificity. While causes flow bidirectionally in a system, the *preservation* of sequence specificity flows from DNA to protein, not vice versa. The ribosome reads the mRNA; the mRNA does not read the ribosome. This asymmetry grounds the informational talk. To say the thermometer carries information about temperature is to ignore that the thermometer was designed to track temperature. Similarly, the translational apparatus was selected to track the DNA sequence.

  **Verdict:**
  Nadia is right that the "code" metaphor is often abused to imply DNA is a homunculus or a sole cause. Developmental Systems Theory correctly warns against genetic reductionism. However, Parity wins only if we accept a definition of information so broad it becomes useless. There is a defensible, robust sense in which DNA is privileged as information: it is the digital control parameter in an analog causal network. It possesses *selected-effect function* to specify sequence via an *arbitrary decoding mechanism*.

  The DNA sequence is not the *only* cause, but it is the *informational* cause because it is the variable element preserved across generations specifically to direct construction. The cytoplasm is the factory; the DNA is the blueprint. A factory is necessary for a building, but we do not say the factory walls contain the information for the building's shape. Parity conflates the medium of construction with the specification of form. Therefore, while DNA is not a sovereign ruler, it is legitimately a code. The metaphor has not gotten out of hand; rather, the philosophical analysis of causation has failed to distinguish between the *conditions* of life and the *instructions* for it.
