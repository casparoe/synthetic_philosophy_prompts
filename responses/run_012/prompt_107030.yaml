      *   Bookmakers set the *payout multiplier*.
      *   *Actually, standard Dutch Book argument:* If Sleeper bets 1:1 on H/T every time.
      *   If H: 1 bet. Wins 1 unit.
      *   If T: 2 bets. Loses 2 units.
      *   Net loss on T.
      *   So Sleeper should bet 1:2 on H:T (i.e., 1/3 credence).
