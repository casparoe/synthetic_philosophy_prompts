answer: |-
  # Activity Design: The Awakening Market

  **Course:** Graduate Seminar in Formal Epistemology
  **Class Size:** 14 Students
  **Duration:** 100 Minutes
  **Objective:** To operationalize self-locating belief through a betting market, forcing students to confront the divergence between prior probabilities and awakening frequencies without using technical labels until the end.

  ---

  ## 1. Materials and Setup

  *   **Room:** A seminar room with a door that closes (for the "Hallway Protocol").
  *   **Currency:** 100 Poker Chips (or distinct paper tokens).
      *   20 for the Sleepers (10 each).
      *   80 for the Bookmakers (distributed equally, ~6 each).
  *   **The Coin:** One large, visible coin.
  *   **The Ledger:** A whiteboard to record Bookmaker Odds and Sleeper Bets.
  *   **The Prize:** A $20 coffee voucher or book token awarded to the student(s) with the most tokens at the end.
  *   **Roles:**
      *   **Sleepers (2 students):** Sit at the front, facing the whiteboard. They hold the betting tokens.
      *   **Bookmakers (12 students):** Sit in the main circle. They set the odds and hold the "Bank."

  ---

  ## 2. The Payoff Scheme

  To ensure stakes feel real but trivial:
  1.  **Sleepers:** Maximize personal token count.
  2.  **Bookmakers:** The "House" (all 12 collectively) wants to break even. If the House loses tokens to the Sleepers over the course of the seminar, the Bookmakers' collective chance at the prize decreases. If the House profits, the Bookmakers share the surplus.
  3.  **Settlement:**
      *   Bookmakers post a price $q$ for a ticket that pays **1 Token if Heads, 0 if Tails**.
      *   Sleepers can buy or sell these tickets using their tokens at the posted price.
      *   *Simpler Alternative for Speed:* Sleepers simply stake tokens on **Heads** or **Tails**.
      *   *Selected Mechanism:* **Fixed Odds Betting.**
          *   Bookmakers agree on a probability $P(H) = q$.
          *   If Sleeper bets 1 token on Heads:
              *   If Heads: Sleeper receives $1/q$ tokens (e.g., if $q=0.5$, win 2 tokens).
              *   If Tails: Sleeper loses 1 token.
          *   If Sleeper bets 1 token on Tails:
              *   If Tails: Sleeper receives $1/(1-q)$ tokens.
              *   If Heads: Sleeper loses 1 token.
      *   *Why:* This forces Bookmakers to compute the "fair" price. If they set $q$ incorrectly relative to the awakening frequency, the House will bleed tokens.

  ---

  ## 3. Round-by-Round Timeline (100 Minutes)

  ### Phase 1: Setup & Instructions (00:00 – 00:15)
  *   **00-05:** Distribute tokens. Explain the prize.
  *   **05-15:** Explain the **Protocol** without naming it.
      *   *Instruction to Sleepers:* "You will be woken. You will not know if this is the first or second time you have been woken. You will not remember previous wakings. You must bet."
      *   *Instruction to Bookmakers:* "You set the odds *before* the coin is flipped. You want the House to break even."
      *   *Simulation of Amnesia:* The 2 Sleepers will step into the hallway.
          *   **Heads:** Sleeper A is called in once.
          *   **Tails:** Sleeper A is called in, then Sleeper B is called in.
          *   *Crucial Cover Story:* Sleepers are told: "You are interchangeable agents. You do not know if you are A or B. You only know you are awake." (This simulates the indexical uncertainty without requiring actual memory erasure).

  ### Phase 2: Condition 1 – The Fair Coin (00:15 – 00:35)
  *   **Protocol:** Fair Coin (50/50). Heads = 1 Awakening. Tails = 2 Awakenings.
  *   **00-15:** Bookmakers deliberate. They must post a single price $q$ for Heads. (Expected behavior: Split between 1/2 and 1/3).
  *   **00-20:** Coin Flip (Public to Bookmakers, Hidden from Sleepers).
  *   **00-20:** Sleepers enter hallway.
  *   **00-25:** **Awakenings.**
      *   If Heads: Sleeper A enters, bets, leaves.
      *   If Tails: Sleeper A enters, bets, leaves. Sleeper B enters, bets, leaves.
      *   *Note:* Sleepers do not see each other.
  *   **00-30:** Settle bets. Count House profit/loss.
  *   **00-35:** Reset tokens.

  ### Phase 3: Condition 2 – The Biased Coin (00:35 – 00:55)
  *   **Protocol:** Biased Coin (2:1 in favor of Heads). Heads = 1 Awakening. Tails = 2 Awakenings.
  *   **00-35:** **Computation.** Bookmakers must calculate fair odds.
      *   *Halfer Logic:* $P(H) = 2/3$.
      *   *Thirder Logic:* $P(H | Wake) = \frac{2/3 \times 1}{(2/3 \times 1) + (1/3 \times 2)} = 1/2$.
      *   *This is the pivot point.* The two camps will now disagree on the *number*, not just the reasoning.
  *   **00-40:** Bookmakers post new odds.
  *   **00-45:** Coin Flip & Awakenings (Same hallway protocol).
  *   **00:50:** Settle bets.
  *   **00:55:** Observe the divergence. One group will feel they were "right" but lost money; the other broke even.

  ### Phase 4: Condition 3 – The Control (00:55 – 01:10)
  *   **Protocol:** Fair Coin. **Heads = 1 Awakening. Tails = 1 Awakening.**
  *   **01:00:** Bookmakers deliberate.
      *   *Expectation:* Consensus at $q = 1/2$. The self-locating element is neutralized.
  *   **01:05:** Coin Flip & Awakenings (Only 1 sleeper called regardless of outcome).
  *   **01:10:** Settle bets.

  ### Phase 5: Debrief & Formal Mapping (01:10 – 01:40)
  *   **01:10:** Reveal labels: "Halfer" vs. "Thirder".
  *   **01:15:** **Map the Losses.**
      *   Ask the Bookmakers who set odds at 1/2 in Round 1: "Did the House lose money on Tails?" (Yes, because 2 bets were placed against 1).
      *   Ask the Sleepers who bet 1/2 in Round 1: "Did you lose tokens in the Tails world?" (Yes).
  *   **01:25:** **Map the Biased Coin.**
      *   Show how the Thirder position ($P(H)=1/2$) aligns with the *frequency of awakenings*, while the Halfer position ($P(H)=2/3$) aligns with the *coin bias*.
      *   Highlight that in Round 3 (Control), these two numbers collapsed, which is why intuition felt stable there.
  *   **01:35:** **Define Self-Locating Belief.**
      *   "The proposition 'I am awake now' is true in more worlds where Tails occurred than where Heads occurred."
      *   Distinguish between *Centered* (I am here now) and *Uncentered* (The coin is Heads) propositions.

  ---

  ## 4. Predicted Failures & Mitigations

  ### Failure 1: The "Second Time" Leak
  *   **Risk:** Sleeper B (in Tails world) realizes they are the second person called because Sleeper A just walked past them in the hall.
  *   **Mitigation:** Stagger the hallway times. Sleeper A waits in a separate office or far corner. Sleeper B is fetched from a different location. Or, instruct Sleepers to wear noise-canceling headphones in the hall and face the wall.
  *   **Instructor Script:** "If you suspect you know which awakening this is, write it on your bet slip but place the bet anyway. We will analyze that data separately."

  ### Failure 2: Bookmaker Collusion/Confusion
  *   **Risk:** Bookmakers set odds that guarantee a loss for the House (e.g., offering 3:1 payout on a 50/50 event).
  *   **Risk:** Bookmakers cannot agree on a single $q$.
  *   **Mitigation:** Appoint one "Chief Bookmaker" per condition to finalize the number after 3 minutes of debate. If they deadlock, the Instructor forces a vote.
  *   **Pedagogical Pivot:** If they set bad odds, use it. "The House lost money not because of the philosophy, but because of bad math. Let's recalculate what the odds *should* have been."

  ### Failure 3: Sleeper Strike
  *   **Risk:** A Sleeper realizes the Tails trap (2 bets vs 1) and refuses to bet on Heads, or refuses to bet at all.
  *   **Mitigation:** Make betting mandatory for participation credit. "You must allocate your 10 tokens. You can hold cash, but inflation (a 'house tax') eats 1 token per round if not staked."
  *   **Better:** Frame it as "Calibration." "Your goal is to match your stake to your credence. If you refuse to stake, you cannot be calibrated."

  ---

  ## 5. Limitations of the Design

  Be honest with the students during the debrief. This activity cannot settle the metaphysical dispute.

  1.  **Pragmatic vs. Epistemic:** The betting game tests *pragmatic* consistency (Dutch Book). A Halfer can argue, "I believe $P(H)=1/2$, but I know I will be bet against twice, so I will bet as if $P(H)=1/3$." The game forces them to conflate belief with betting behavior.
  2.  **The Amnesia Gap:** We simulated ignorance, not memory erasure. Students know *someone* else might be woken. In the true thought experiment, Beauty knows *she herself* is woken twice. The "Interchangeable Agent" workaround dilutes the first-person indexicality ("I") which is the core of the problem.
  3.  **Sample Size:** We run one coin flip per condition. Variance is high. A single Heads result in Round 1 validates the Halfers empirically, even if their strategy is Dutch-bookable in the long run.
      *   *Fix:* Emphasize *Expected Value* in the debrief, not actual winnings. "If we ran this 1000 times, who goes broke?"

  ---

  ## 6. Confidence Assessment

  **Confidence Level:** 85%
  This design reliably produces the tension between frequency and prior probability. The betting mechanics are standard and robust.

  **Least Certain Element:** The **"Interchangeable Agent" Simulation**.
  Using Sleeper A and Sleeper B to simulate one person waking twice is the weakest link. Grad students may reject the premise that Sleeper B's bet counts as "Beauty's second bet."
  *   *Contingency:* If they reject the simulation, pivot immediately to the **Long-Run Frequency** argument. "Okay, imagine you are Sleeper A and B combined as a team. Does the team lose money on Tails if you bet 1/2?" This shifts the focus from *personal identity* to *decision theory*, which is often where the real philosophical work lies anyway.

  ---

  ## 7. Instructor Cheat Sheet: The Math

  **Condition 1 (Fair Coin):**
  *   $P(H) = 1/2$. Wakes: 1H, 2T. Total 3.
  *   Thirder Credence: $1/3$.
  *   Halfer Credence: $1/2$.
  *   *Fair Odds for House:* 1:2 on Heads (Price $q=1/3$).

  **Condition 2 (Biased 2:1 Heads):**
  *   $P(H) = 2/3$. Wakes: $2/3 \times 1$ (H), $1/3 \times 2$ (T). Total Wakes = $4/3$.
  *   Thirder Credence: $(2/3) / (4/3) = 1/2$.
  *   Halfer Credence: $2/3$.
  *   *Fair Odds for House:* 1:1 on Heads (Price $q=1/2$).
  *   *Note:* This is the "Aha!" moment. Thirders move to 1/2. Halfers move to 2/3.

  **Condition 3 (Control):**
  *   $P(H) = 1/2$. Wakes: 1H, 1T.
  *   Thirder Credence: $1/2$.
  *   Halfer Credence: $1/2$.
  *   *Fair Odds:* 1:1.

  **Debrief Question:** "In Condition 2, why did the Thirders change their mind from Condition 1, while the Halfers didn't?"
  **Answer:** Thirders track *awakenings*. Halfers track *coin states*.
