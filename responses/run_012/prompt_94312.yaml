prompt: |-
  Ok this is a weird request but bear with me. I'm a second year ICU fellow and three weeks ago I had to do the thing where you stand at the bedside after we pull the breathing tube and time how long it takes, and then we call it. Our protocol says five minutes with no pulse and no breathing and then the person is dead. His heart stopped at the four minute mark, roughly, and we were all watching the clock and his daughter was in the doorway and I remember thinking, what exactly is the number five doing here. If it were four minutes would he still be alive. If it were six would he already be a corpse. The number isnt doing any medical work, its just the point where we all agreed to stop worrying, and its also the point where we start talking to the organ coordinator in the hall. Somebody signed off on that.

  Anyway I can't stop chewing on it. I've been reading about whole brain vs higher brain criteria and how brain death and circulatory death are two completely different doors into the same room, and how one of the reasons we even wait at all is this rare thing where a heart sometimes just starts up again on its own after everyone has given up, which is wild. And the thing that really gets me is reversibility. We all say death is irreversible, but irreversible with what tools, and whose decision not to use them? With better resuscitation, or a different policy, the same guy at the four minute mark is a patient and not a donor. So is the dying a fact or a policy.

  I want to write a short story about this but I'm way too close to it, so can you write it for me. Something set in the ten or fifteen minutes around the withdrawal, from the point of view of whoever is holding the watch — a nurse, a brand new resident, somebody who has to be the one to say the time out loud. Not a debate in a conference room, I want it in the room, family in the doorway, coordinator waiting in the hall pretending to look at her phone. And I want the character smart enough to see that the five minutes is arbitrary and also to have to keep counting anyway, out loud, for the family.

  Dont resolve it for me. I dont want a lesson or a reveal where someone is secretly right. I want the story to just sit in it.

  After the story, can you add a short note on where it takes liberties with the actual clinical or ethical ideas, or leans on a reading that is contested, and say how confident you are in that note and which bit of it you're least sure about.
