      *   *Check:* Did I address the FCPA facilitation payment exception? *Correction:* I need to acknowledge this. It complicates the "Impersonal Trust" view. I should argue that the FCPA exception is a pragmatic concession that actually undermines the philosophical purity of the UK Act, but the *trend* (and the UK Act) reveals the deeper presupposition. I will focus on the UK Act as the clearer philosophical statement, treating FCPA as a compromised version.
      *   *Check:* The prompt asks about the $40 vs $400 dinner. *Correction:* Make sure to explicitly explain this via the "source of authority" distinction (Public = Citizens/Statute; Private = Shareholders/Contract).
      *   *Check:* Section 5 interpretation. *Correction:* Be precise. It's not that local custom is morally wrong; it's that it lacks the *form* of law. This is a positivist move, not necessarily a moralist one.

  6.  **Final Polish:**
      *   Tone: Academic, authoritative, philosophical.
      *   Structure: Follow the prompt's flow (Presuppositions -> Office Holder -> Public/Private -> Culture/Section 5 -> Reconstruction -> Uncertainty).
      *   Ensure the "Least Confident" section is genuine and substantive.

  7.  **Final Review against constraints:**
      *   Did I generate a list for myself first? (Yes, in step 2).
