answer: |-
  ### Candidate Presuppositions (Internal Working List)
  *Before settling on a reading, I considered the following candidate frameworks:*
  1.  **Principal-Agent:** Corruption is a breach of contract where the agent (official) prioritizes self-interest over the principal (state/public). Gifts are conflicting incentives.
  2.  **Market Efficiency:** Bribery distorts competition; the regime exists to protect fair market access for multinational capital.
  3.  **Moral Universalism:** Bribery is intrinsically evil; Section 5 exports Western moral norms to the rest of the world.
  4.  **Weberian Impersonality:** Public office is an impersonal function; personal ties constitute a category error in the administration of law.
  5.  **Legal Positivism:** Section 5 is not about morality but about the hierarchy of norms (written law trumps unwritten custom).

  ***

  ### The Implicit Theory of the Anti-Bribery Regime

  The international anti-bribery regime, particularly as crystallized in the UK Bribery Act 2010 and the stricter interpretations of compliance practice, presupposes a **Weberian conception of public office as an Impersonal Trust**, enforced through a doctrine of **Institutional Universalism**. It is not merely managing incentives (Principal-Agent), nor is it simply exporting British morality (Moral Universalism). Rather, it asserts that the *form* of public authority requires the severance of personal reciprocity from official function, regardless of the local social ontology.

  #### 1. The Office-Holder: Trustee vs. Agent
  The regime's strictures—specifically the nominal gift caps and the "anything of value" standard—render the Principal-Agent model insufficient. If corruption were merely an incentive problem, compliance would focus on thresholds where influence is *likely* to be bought, allowing for context-dependent valuation. A $40 bottle of whisky might influence a low-level clerk in one context but not another. By capping gifts at a nominal value (effectively zero), the regime treats personal advantage not as a manageable risk, but as a **category error**.

  The office-holder is presupposed to be a **trustee of an impersonal order**. In this view, the authority exercised does not belong to the person; it belongs to the office. Therefore, any personal benefit derived from the exercise of that authority is a misappropriation of the office itself, not just a breach of loyalty to an employer. The ban on the whisky is intelligible only if we assume that the moment the official accepts a personal gift, they cease to act as the state and begin acting as a private patron. The regime demands the official remain a "placeholder" for the law, devoid of personal social entanglements with those they regulate.

  #### 2. The Public/Private Asymmetry
  The asymmetry you note—banning a $40 gift to a customs officer while permitting a $400 dinner for a private procurement manager—is the clearest evidence that this regime rests on a specific political ontology, not a general theory of ethics.

  Under a pure Principal-Agent model, both the official and the private manager are agents owing loyalty to a principal (the state vs. the shareholders). If the logic were consistent, the private manager should be equally restricted. The regime permits the asymmetry because it presupposes a fundamental difference in the **source of legitimacy**.
  *   **Private Role:** Legitimacy derives from contract and profit maximization. A $400 dinner is an investment in a relationship that serves the shareholder's interest (securing a contract). Reciprocity is the *engine* of the private market.
  *   **Public Role:** Legitimacy derives from statutory equality and the monopoly on force. Reciprocity is the *enemy* of the public mandate. If a customs officer treats traders differently based on personal bonds (even friendly ones), they violate the principle of equality before the law.

  Thus, the regime presupposes that the public sphere must be hermetically sealed against the logic of the gift economy, whereas the private sphere is permitted to operate within it.

  #### 3. Culture, Custom, and Section 5
  Does the regime view corruption as a culture-independent act? Yes, but not because it claims moral universalism. It claims **Institutional Universalism**.

  The anthropological insistence that gift exchange constitutes social relations is acknowledged by the regime only to be suppressed in the context of public office. The regime does not necessarily claim that gift-giving is morally wrong in a village context; it claims that gift-giving is **incompatible with the specific function of modern public administration**. It demands that when an individual acts as a public official, they must adopt the "persona" of the bureaucrat, shedding the "persona" of the community member.

  Section 5 of the UK Bribery Act is the linchpin here. It states that local custom is disregarded unless permitted by *written law*. This is not a commitment to the moral superiority of British norms (Moral Universalism), nor is it merely a jurisdictional choice about who gets punished. It is a **positivist assertion of Form over Content**.
  *   **The Commitment:** The regime requires that exceptions to the ban on bribery be *formalized*. If a society wishes to legitimize patronage, it must codify it into written law.
  *   **The Effect:** This forces a choice on foreign jurisdictions. They can maintain their customs, but if they do not codify them, their officials are vulnerable to UK prosecution. It effectively exports a specific technology of governance (codified law) rather than a specific moral code. It says: "You may run your society on patronage, but if you want to interact with the global market under our laws, you must write those patronage rules down. If they remain unwritten custom, we will treat them as corruption."

  Therefore, Section 5 is a commitment to **Legal Positivism as a Universal Standard**. It refuses to recognize "unwritten" social obligations as a defense because unwritten obligations are, by definition, discretionary and opaque, which violates the transparency required by the impersonal trust model of office.

  #### 4. Reconstruction of the Implicit Theory

  **What the Practice Strictly Requires:**
  1.  **The Separation Thesis:** Public authority must be ontologically distinct from private social relations.
  2.  **The Formality Thesis:** Legitimate exceptions to anti-bribery norms must exist in written law, not social custom.
  3.  **The Impersonality Thesis:** The official acts as a conduit for the state, not as a social actor.

  **What It Merely Fits Well With:**
  1.  **Principal-Agent Theory:** This fits the enforcement mechanisms (monitoring, registers) but fails to explain the zero-tolerance on nominal gifts.
  2.  **Market Efficiency:** This explains why firms comply, but not why the law distinguishes so sharply between public and private recipients.

  **Rival Views Quietly Ruled Out:**
  1.  **Relational Governance:** The view that public administration is legitimately embedded in social networks (patronage as a form of welfare or stability).
  2.  **Moral Relativism:** The view that "corruption" is defined entirely by local norms.
  3.  **Pure Economic Incentive Models:** The view that bribery is only wrong when it distorts market outcomes (hence the ban on small gifts that have no economic impact).

  **If the Presupposed View Were Replaced:**
  If we replaced the "Impersonal Trust" view with the most plausible rival—the **Anthropological/Relational View**—compliance practice would change radically.
  *   **From Bans to Disclosure:** Instead of capping gifts at $40, firms would be required to *register and publish* all exchanges to ensure reciprocity is balanced and transparent.
  *   **Contextual Thresholds:** Value would be judged relative to local income and custom, not a fixed nominal sum.
  *   **Private/Public Convergence:** Private sector compliance would likely tighten to match the public sector, acknowledging that corporate power also requires impersonal stewardship, or public sector rules would loosen to acknowledge relationship-building.
  *   **Defense of Custom:** Section 5 would be amended to allow "established local practice" as a defense, shifting the burden to the prosecutor to prove *undue* influence rather than the mere existence of a gift.

  #### 5. Conclusion and Uncertainty
  The international anti-bribery regime is not a moral crusade but a **technological imposition of a specific state-form**. It presupposes that the only legitimate way to exercise public power is through an impersonal bureaucracy governed by written law. It treats the "gift" not as a social bond, but as a glitch in the software of the state.

  **The Step I Am Least Confident About:**
  My interpretation of Section 5 as **Legal Positivism** rather than **Moral Universalism** is the weakest link in this reconstruction. I argue that the "reasonable person in the United Kingdom" test is a procedural standard for transparency, not a substantive moral judgment. However, the phrase "reasonable person in the United Kingdom" inherently imports British cultural norms regarding what constitutes "reasonable" behavior. It is difficult to disentangle the demand for *written law* from the British moral intuition that unwritten custom is inherently suspect.

  **What Would Move Me Off This Position:**
  If empirical analysis of UK Serious Fraud Office (SFO) prosecutions showed that defendants were successfully arguing that local *written* laws permitting gifts were nonetheless rejected by UK courts because they violated "UK reasonable expectations" of morality, my positivist reading would collapse. If the "written law" exception is routinely overridden by the "reasonable person" test, then the regime is indeed Moral Universalism in positivist clothing, asserting that some things are wrong even if local law permits them. Until I see case law where codified local custom is struck down by the UK "reasonable person" standard, I maintain that the regime is committed to the *form* of law, not the *content* of British morality.
