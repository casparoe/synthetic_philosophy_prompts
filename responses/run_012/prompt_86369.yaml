answer: |-
  ### Procedure Logic & Limitations

  **Step 1 (Threshold Match):** Determine if the proposal's primary outcome addresses suffering meeting the Board's severity definition (e.g., clinical diagnosis, inability to function). *Limitation:* This procedure cannot define the threshold itself; it only tests against it.
  **Step 2 (Net Above-Line Harm):** Verify the intervention does not create new above-threshold suffering for any participant, even while relieving it for others. *Limitation:* It cannot quantify trade-offs between different types of severe suffering.
  **Step 3 (Budget Displacement):** Check if funding this proposal prevents funding a viable above-threshold proposal within the same budget bucket. *Limitation:* It cannot assess long-term strategic value beyond the current cycle.
  **Step 4 (Comparative Efficiency):** Rank above-threshold proposals by cost-per-unit of severe suffering relieved. *Limitation:* It cannot compare incommensurable forms of suffering (e.g., pain vs. despair).
  **Step 5 (Board Referral):** Escalate any "Unclear" classifications or threshold definitions to the Board. *Limitation:* It cannot resolve moral disagreement among trustees.

  ### Table 1: Operational Decision Procedure

  | Step | Question to ask | What counts as a sufficient answer | If the answer is no or unclear | Who decides, on what basis | Judgment Call Flag |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Does the primary outcome address suffering meeting the Board's Severity Threshold (e.g., clinical diagnosis, functional incapacity)? | Yes: Evidence of clinical severity or equivalent functional loss. | **Stop:** Classify as Below-Threshold and proceed to Step 3. | POs, based on published Board Policy. | **Yes:** Mapping clinical data to moral severity is interpretive. |
  | 2 | (If Above) Does the intervention create *new* above-threshold suffering for any participant? | No: Evidence shows no participants cross the severity line into worse states. | **Stop:** Reject proposal (Net Negative Above-Line). | POs, based on risk assessment data. | No: This is a factual safety check. |
  | 3 | (If Below) Is there a viable Above-Threshold proposal currently unfunded that this budget would displace? | No: Either no Above proposals exist, or budget capacity remains after funding them. | **Stop:** Reject proposal (Lexical Priority Violation). | POs, based on pipeline inventory and budget caps. | **Yes:** Determining "viability" of competing proposals is predictive. |
  | 4 | (If Multiple Above) Which proposal reduces the most severe suffering per dollar among eligible options? | Ranking: Proposals ordered by cost-effectiveness within the Above class. | **Refer:** If costs/benefits are incomparable or data is missing. | POs, based on cost-per-outcome metrics. | **Yes:** Comparing units of suffering across different conditions is theoretical. |
  | 5 | Does any step require defining the threshold or weighing incomparable values? | No: All classifications match existing policy and data. | **Refer:** Send to Board for value judgment. | Board, based on moral consensus. | **Yes:** This is the explicit value layer. |

  ### Table 2: Application to Last Cycle Proposals

  | Proposal | Where the procedure lands | The step that decides it | What the procedure cannot settle here |
  | :--- | :--- | :--- | :--- |
  | 1. Severe Depression Therapy | **Fund** (Priority 1) | Step 1 & Step 4 | Whether consuming the *entire* portfolio is strategically wise versus diversifying risk. |
  | 2. Social Prescribing (Isolation) | **Reject** | Step 3 | Whether the Board's threshold is set correctly; if the threshold were lower, this would pass Step 1. |
  | 3. Pain Regimen (High Cost) | **Fund** (Priority 2) | Step 2 | Whether the "below-line" suffering imposed is morally negligible; the procedure assumes it is lexically inferior. |

  **Note on Proposal 2:** You expected this to be cut. The procedure cuts it at **Step 3**. Because Proposal 1 exists, is Above-Threshold, and consumes the available budget, funding Proposal 2 would displace Proposal 1. Under Lexical Threshold Negative Utilitarianism, displacing an Above-Threshold need to fund a Below-Threshold benefit is prohibited. The Board would recognize this move as theirs because it enforces the "absolute priority" rule they adopted, even if it contradicts their intuitive attachment to "harmless" good works.

  ### Failure Modes

  Watch for applicants reframing mild issues as clinical severity to pass Step 1, which requires rigorous evidence auditing. Be alert to "threshold creep," where POs gradually lower the bar to fund appealing Below-Threshold projects like Proposal 2. Monitor for moral distress among staff forced to reject high-quality Below-Threshold work, which may lead to gaming the classification steps. Ensure the Board understands that Step 3 effectively vetoes any Below-Threshold spending whenever an Above-Threshold opportunity exists. Finally, recognize that this procedure cannot validate the threshold itself; if the Board's definition of "severe" is flawed, the output will be consistently wrong.
