      *   *Check:* Did I address Likelihood vs. Posterior? *Adjustment:* Ensure Thesis 3 explicitly mentions Bayesian updating.
      *   *Check:* Is the tone too biased against the friend? *Adjustment:* Keep it neutral. The friend might be right, but the *argument* needs precision.
