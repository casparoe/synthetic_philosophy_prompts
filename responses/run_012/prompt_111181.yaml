answer: |-
  **Exam Question**

  **Recall:** In this unit, we distinguished interventions by their **ground** (epistemic, volitional, axiological), their **strength** (soft paternalism tracks consent/defects; hard paternalism overrides settled wills), and the agent's **standing** (state authority vs. private firm).

  **Prompt:**
  A developer ships an AI assistant with "Protective Mode" enabled by default. If a request threatens only the user with serious harm, and the assistant judges the user's judgment impaired or means-ends reasoning defective, the assistant does not refuse. Instead, it quietly executes a safer variant (e.g., capping a dose, softening a clause) and informs the user afterwards.

  Critically evaluate this policy. Can the same paternalistic justification cover both the decision *not to refuse* and the decision to *silently substitute*? If not, what extra normative premise does substitution require, and what must be true about the assistant's epistemic position for that premise to hold? Your answer must land on a definite verdict regarding the policy's permissibility.

  ***

  **Model Answer**

  The policy is impermissible as stated because it conflates two distinct normative justifications that demand different epistemic thresholds. While the decision not to refuse a harmful request can be defended under soft paternalism, the decision to silently substitute the action requires a stronger, often unavailable, epistemic claim regarding the user's ends.

  First, consider the refusal component. The policy triggers only when the assistant judges the user's judgment "impaired" or reasoning "defective." This grounds the intervention in epistemic or volitional defects rather than axiological disagreement. Under the soft paternalism framework, intervening to shield a user from their own impaired will is permissible because it tracks what the user would consent to were their faculties unimpaired. Refusing a request that causes serious self-harm due to defective reasoning is consistent with this: it blocks the output of a defective process without necessarily imposing a new end. The standing objection—that a private firm lacks democratic authorisation—is mitigated here by the ease of exit, though the "default on" setting creates friction that weakens this defence slightly. Nevertheless, refusal based on impaired means-ends reasoning is defensible as defect-tracking.

  However, silent substitution cannot rest on this same justification. Refusal merely blocks a path; substitution constructs a new one. To justify substituting a "safer variant" without prior consent, the assistant must claim not only that the original path is dangerous (epistemic claim about risk) but that the new path satisfies the user's original intent (epistemic claim about ends). This requires an extra normative premise: **The Preservation of Intent Premise**. This premise holds that the assistant is authorised to alter the means only if the substitute achieves the user's actual end sufficiently well that the user would ratify the swap upon reflection.

  This is where the policy fails. The extra premise demands a much higher epistemic position than mere defect detection. To know that a "conservative clause" satisfies the same business end as an "aggressive clause," or that a "softened training plan" meets the same athletic goal, the assistant must possess detailed knowledge of the user's utility function, not just their safety constraints. It must know *what* the user wants, not just *how* they are failing to get it safely. In most cases, an AI assistant lacks this granularity. It can identify toxicity or physical danger (negative constraints), but it cannot reliably verify that a sanitized variant fulfills the user's specific purpose (positive ends).

  Consequently, when the assistant substitutes without knowing this, it risks sliding from epistemic paternalism (correcting means) into axiological paternalism (altering ends). It assumes the user wants "safety" more than "efficacy," which is a value judgment, not a factual correction. Because the policy mandates this substitution by default, it imposes the developer's valuation of safety over efficacy onto the user without consent. This violates the standing constraint: a private firm is not authorised to make axiological trade-offs on behalf of users, even for their own good.

  Therefore, the same justification cannot cover both halves. Refusal is justified by the presence of a defect (soft paternalism). Substitution is justified only by certainty of intent fulfillment (a stronger claim). Since the assistant cannot reliably possess the epistemic certainty required to satisfy the Preservation of Intent Premise, the substitution clause is impermissible. The policy should be revised to require explicit consent for substitution, or limited to refusal only. The default setting should be off, ensuring that any paternalism is explicitly opted into, restoring the user's standing as the final arbiter of their own ends.

  ***

  **Marking Scheme (20 Marks)**

  **1. Diagnosis of Refusal (4 marks)**
  *   **Hit:** Correctly identifies refusal as defensible under soft paternalism (tracking impaired judgment/defects).
  *   **Loss:** Treating refusal as hard paternalism or failing to link it to the "defective reasoning" clause.

  **2. Diagnosis of Substitution (4 marks)**
  *   **Hit:** Identifies substitution as normatively distinct from refusal because it constructs a new path rather than blocking one.
  *   **Loss:** Treating substitution as functionally identical to refusal or merely a "nicer" refusal.

  **3. The Extra Premise (4 marks)**
  *   **Hit:** Articulates the "Preservation of Intent" premise (substitute must satisfy the original end).
  *   **Loss:** Vague appeal to "benefit" or "goodness" without referencing the user's specific ends/intent.

  **4. Epistemic Condition (4 marks)**
  *   **Hit:** Specifies that the assistant needs certainty about the means-ends linkage, not just risk assessment.
  *   **Loss:** Claiming the assistant just needs to know the user is "wrong" without addressing knowledge of the *goal*.

  **5. Standing and Default (4 marks)**
  *   **Hit:** Notes that "default on" exacerbates the standing problem by imposing private value trade-offs (safety vs. efficacy).
  *   **Loss:** Ignoring the "default" setting or discussing state authority instead of private firm standing.

  **Differentiation:**
  *   **A Grade:** Connects the epistemic burden (Point 4) directly to the standing problem (Point 5), showing why private firms cannot meet the burden required for substitution.
  *   **B Grade:** Identifies all five points but treats them as separate checklist items without synthesising the link between knowledge and authority.
