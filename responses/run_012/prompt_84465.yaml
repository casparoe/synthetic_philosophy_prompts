      *   *Constraint A (From 1 & 2):* Reasons must be grounded in *facts*, not false beliefs. (Externalism about the *object* of the reason). You can't have a reason to pour bleach thinking it's gin.
      *   *Constraint B (From 4 & 5):* Reasons must be grounded in the agent's *actual motivational set* (desires/concerns), even if reflective. If you don't care (and wouldn't care upon reflection), you have no reason. (Internalism about the *source* of the reason).
      *   *Constraint C (From 3 & 6):* The motivational set includes *dispositional* attitudes and deep psychological truths, not just occurrent thoughts or avowals. Ravi loves his daughter (dispositionally); Lena wants approval (dispositionally).
      *   *Constraint D (From 7):* The motivational set is limited to the *actual* agent in their *actual* circumstances, not counterfactual versions of themselves (Sofia).

      *   *Candidate Theory:* **Factualist Internalism (or "Subjective Objectivism"? No, let's call it "Factualist Motivationalism").**
      *   *Rough Formulation:* An agent has a reason to $\phi$ if and only if:
          1.  There is a fact $F$ that makes $\phi$-ing conducive to satisfying a desire/concern $D$.
