answer: |-
  Here is a decision tree designed to map the logical space of individual impact debates. It is built to separate causal claims from moral claims, and individual duties from collective ones.

  ### The Logic of the Tree
  The tree proceeds in three stages:
  1.  **Causal Structure:** What does the act *do*? (Metaphysics/Empirics)
  2.  **Moral Mechanism:** Why does it matter? (Normative Ethics)
  3.  **Scope of Duty:** What must you actually do? (Action Guidance)

  ***

  ### The Decision Tree

  **NODE 1: The Causal Claim**
  *Question:* "Setting morality aside: does your individual act (buying the steak, casting the vote, taking the flight) change the **expected total amount** of the harmful outcome?"
  *   **A. Yes:** It has a probabilistic impact (Expected Utility > 0).
  *   **B. Only at a Threshold:** It matters only if it hits a specific tipping point (e.g., triggers a new order), otherwise zero.
  *   **C. No:** The system absorbs individual changes; only the *group total* causally matters.

  **NODE 2: The Moral Mechanism**
  *Question:* "Regardless of the causal answer above: is the act morally forbidden **even if** it makes no causal difference to the outcome?"
  *   **A. No:** Morality tracks consequences. No difference = No wrong.
  *   **B. Yes (Participation):** Morality tracks involvement. Being part of a harmful practice is enough.
  *   **C. Yes (Conditional):** Morality tracks fairness. It is wrong only if others aren't doing their part (or only if they *are*).

  **NODE 3: The Scope of Duty**
  *Question:* "If the act is forbidden, what is your primary obligation?"
  *   **A. Constraint:** Do not perform this specific act (Abstain).
  *   **B. Optimization:** Prevent the harm by any means (Offset, Donate, Agitate).
  *   **C. Collective:** You have no individual duty; only the group has a duty to coordinate.

  ***

  ### The Leaves (Positions)

  Here are the positions generated by the paths through the tree.

  #### 1. The Expected Utilitarian (1A → 2A → 3A/B)
  *   **Plain Name:** "My purchase has expected value."
  *   **Standard Label:** Act Consequentialism / Expected Utility.
  *   **View:** Supply chains respond probabilistically. One steak creates a tiny risk of a cow dying. That expected harm outweighs the taste.
  *   **Application:** Don't buy the steak. Don't take the flight (unless offset). Vote (expected impact > 0).
  *   **Note:** Paths 3A and 3B often merge here. If you must optimize, you usually abstain *unless* offsetting is more effective.

  #### 2. The Triggering Thresholdist (1B → 2A → 3A)
  *   **Plain Name:** "I might be the straw that breaks the camel's back."
  *   **Standard Label:** Triggering Consequentialism.
  *   **View:** Harm happens in chunks (e.g., orders of 1,000 steaks). Most purchases do nothing, but one might trigger the next 1,000. The *risk* of being the trigger makes it wrong.
  *   **Application:** Don't buy the steak. Vote (might break a tie).
  *   **Note:** This survives the "camel's back" objection by arguing you don't need to know *where* the threshold is for the *risk* to be morally significant.

  #### 3. The Complicity Theorist (1C → 2B → 3A)
  *   **Plain Name:** "I won't dirty my hands, even if it changes nothing."
  *   **Standard Label:** Complicity / Participation View.
  *   **View:** Causation isn't the only source of wrongness. Joining in a harmful collective practice makes you morally tainted, regardless of your marginal impact.
  *   **Application:** Don't buy the steak (complicit in slaughter). Don't fly (complicit in climate damage). Voting in a safe state is permissible (not complicit in harm).
  *   **Note:** Distinct from Utilitarianism because it forbids the act even if causally inert.

  #### 4. The Integrity Expressivist (1C → 2B → 3A)
  *   **Plain Name:** "It's about who I am, not what I cause."
  *   **Standard Label:** Virtue Ethics / Expressivism.
  *   **View:** The act expresses a vice (callousness, greed) or violates integrity. The wrongness attaches to the character of the agent, not the outcome.
  *   **Application:** Don't buy the steak (it expresses disregard for life). Flying is okay if it expresses family care, not greed.
  *   **Note:** Can overlap with Complicity, but focuses on *expression* rather than *association*.

  #### 5. The Conditional Contractualist (1C → 2C → 3A)
  *   **Plain Name:** "I'll do my part if you do yours."
  *   **Standard Label:** Scanlonian Generalization / Conditional Duty.
  *   **View:** The act is wrong because you cannot justify it to others if everyone did it. However, if others are defecting, your duty may lapse (or intensify).
  *   **Application:** Don't buy the steak *provided* enough others abstain. If no one else cares, maybe you don't have to (or maybe you must lead).
  *   **Note:** Highly sensitive to the "foregone conclusion" voting case. If the election is fixed, your vote expresses nothing to justify.

  #### 6. The Offset Consequentialist (1A → 2A → 3B)
  *   **Plain Name:** "I can buy the steak if I save a life elsewhere."
  *   **Standard Label:** Effective Altruism / Fungibility View.
  *   **View:** Harm is nettable. You have a duty to the *outcome*, not the *act*. If you donate enough to negate the steak's harm, the steak is permissible.
  *   **Application:** Fly for work, but buy carbon credits. Eat meat, but donate to animal welfare.
  *   **Note:** Distinct from Constraint views (Leaf 1).

  #### 7. The Collective Exclusivist (1C → 2A → 3C)
  *   **Plain Name:** "It's not up to me, it's up to us."
  *   **Standard Label:** Collective Obligation / Structural View.
  *   **View:** Individuals cannot solve collective action problems. Assigning individual duty is a category error. Only the group (state, corporation) has a duty.
  *   **Application:** Your steak doesn't matter. Your vote doesn't matter. Demand regulation instead.
  *   **Note:** **Empty Cell Warning:** This position is often accused of incoherence (if no individual has a duty, how does the group act?).

  #### 8. The Causal Nihilist (1C → 2A → 3C)
  *   **Plain Name:** "It makes no difference, so do what you want."
  *   **Standard Label:** Libertarian Skepticism / Amoralism.
  *   **View:** No causal impact + No non-causal wrongness = Total permission.
  *   **Application:** Eat the steak. Fly. Don't vote (waste of time).
  *   **Note:** Often the position the group is arguing against.

  ***

  ### Analysis of the Logical Space

  #### 1. Empty Cells (Combinations that don't exist or are incoherent)
  *   **The "Inert but Optimizing" Cell (1C → 2A → 3B):**
      *   *Claim:* "My act makes no difference to the harm, but I should do something else to fix the harm."
      *   *Why Empty:* If the act makes no difference (1C) and morality tracks consequences (2A), you have no reason to act regarding *this* harm. If you have a duty to fix the harm, you must believe your actions *can* fix it (contradicting 1C).
      *   *Exception:* Unless you believe you have a duty to *signal* support for a solution without causing the solution itself (moves to Leaf 4).
  *   **The "Collective Duty / Individual Constraint" Cell (1C → 2A → 3A):**
      *   *Claim:* "Only the group causes harm, but I individually must abstain."
      *   *Why Empty:* If only the group causes harm (1C) and morality tracks consequences (2A), individual abstention is irrational. To hold this, you must adopt a non-consequentialist mechanism (moves to Leaf 3 or 4).

  #### 2. Identical Leaves (Where the tree fails to separate)
  *   **Leaf 1 (Expected Utilitarian) and Leaf 2 (Thresholdist):**
      *   On the **Burger** and **Flight** cases, these leaves produce identical advice (Don't do it).
      *   *Separation:* They only diverge on the **Voting** case. The Thresholdist says voting matters *only* if there's a chance of a tie. The Expected Utilitarian says voting matters because it shifts probabilities slightly even without a tie.
      *   *Flag:* If your group doesn't discuss voting probabilities, these two will look identical.
  *   **Leaf 3 (Complicity) and Leaf 4 (Integrity):**
      *   Both say "Don't do it" even if it makes no difference.
      *   *Separation:* Complicity focuses on the *external relationship* to harm (being part of a dirty system). Integrity focuses on the *internal state* (being a virtuous person).
      *   *Flag:* In practice, both forbid the steak. The tree separates them at Node 2, but the action guidance (Node 3) is often the same.

  #### 3. Loaded Questions (Assumptions baked in)
  *   **Node 1 ("Change the expected total"):**
      *   *Assumption:* This assumes a consequentialist framework for "causation." A strict deontologist might reject the premise that "expected total" is the relevant metric for causation.
      *   *Fix:* If someone objects, rephrase: "Does your act physically contribute to the chain of events?"
  *   **Node 2 ("Morally forbidden"):**
      *   *Assumption:* Assumes the act is at least *candidate* for wrongness. It excludes the "Supererogatory" view (it's good to abstain, but not required).
      *   *Fix:* Add a branch option: "It is good to abstain, but not required." (This creates a "Vegetarian as Saint" leaf).
  *   **Node 3 ("Primary obligation"):**
      *   *Assumption:* Assumes there *is* an obligation.
      *   *Fix:* Ensure Leaf 8 (Nihilist) is a valid exit at Node 2 ("No, not forbidden").

  ### How to Use This in Your Group

  1.  **Print the Tree:** Hand it out before the "steak" discussion starts.
  2.  **Silent Sorting:** Ask everyone to mark their path (e.g., 1C → 2B → 3A) for the **Burger** case.
  3.  **Compare Paths:**
      *   If Person A is **1A** and Person B is **1C**, stop debating morality. You are debating supply chain economics. Person A thinks their burger triggers orders; Person B thinks the store orders in bulk regardless. *Resolve the empirics first.*
      *   If Person A is **1C/2A** and Person B is **1C/2B**, you agree on causation but disagree on moral theory (Consequences vs. Complicity). Stop talking about supply chains; talk about whether "dirty hands" matter.
      *   If Person A is **3A** and Person B is **3B**, you agree it's wrong but disagree on the remedy. Debate offsetting vs. abstention.
  4.  **Switch Cases:** Ask them to re-mark for the **Voting** case.
      *   Many **1A (Utilitarians)** will switch to **1C (Inert)** for safe-state voting.
      *   Many **3A (Constraint)** voters will stay **3A** (Civic duty).
      *   *This reveals inconsistency:* If you are a Complicity Theorist on meat (1C/2B), why are you not a Complicity Theorist on voting for a war-monger in a safe state?

  This forces the group to see that they aren't arguing about "steaks"; they are arguing about which leaf of the tree is the correct one to sit in.
