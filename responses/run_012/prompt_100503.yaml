  ### The Scenario: The Lifeline That Drowns

  **The Agent:** Elias, a mid-level operations manager at a regional food distribution nonprofit.
  **The Act:** Elias approves a routine emergency grant of $50,000 to a smaller, independent partner shelter ("Haven") that has suddenly fallen behind on rent.
  **The Context:** This is an ordinary Tuesday. The grant is within Elias's authorization limit. The paperwork is standard.

  **The Foreseeable Consequences (Agreed by Both Theorists):**
  1.  Haven avoids eviction immediately.
  2.  200 homeless individuals retain access to beds and meals for the next three months.
  3.  Elias's nonprofit retains its reputation as a reliable safety net.
  4.  There is a known, non-zero risk that Haven is mismanaged, but no evidence is currently available to suggest they are insolvent beyond repair.
  5.  If Haven were to close, there is a *possibility* that the city would step in to reorganize services, but this is speculative and not guaranteed.

  **The Actual Total Consequences (Known only to the Omniscient Observer):**
  1.  Haven is structurally insolvent due to long-term embezzlement by its director.
  2.  The $50,000 grant allows Haven to stave off bankruptcy for exactly six months.
  3.  During those six months, Haven blocks a city-led merger with a larger, more efficient network ("Unity") because Haven is technically "solvent" and thus ineligible for the bailout-restructuring program.
  4.  Six months later, Haven collapses abruptly during winter. Because the merger window closed, Unity does not absorb the clients.
  5.  The sudden collapse during winter causes a public scandal that discredits *all* local shelters, leading to a 40% drop in city-wide donations.
  6.  **Net Result:** 200 people fed for six months, followed by 2,000 people losing access to services permanently due to the sector-wide funding crash.

  ---

  ### The Verdicts

  **1. The Foreseeable-Consequences Consequentialist (FC)**
  *   **Verdict:** **Obligatory / Right.**
  *   **Reasoning:** The FC evaluates the act based on the consequences a reasonable agent could anticipate at the time of decision. The foreseeable outcome is that 200 vulnerable people eat and sleep safely for three months. The risk of future collapse is speculative and outweighed by the certainty of immediate suffering averted. The potential city merger is too uncertain to count heavily in the calculus. To withhold the grant based on a hunch about systemic fragility would be to sacrifice definite, identifiable lives for a hypothetical future gain. The intuitive moral demand is to help the people in front of you.

  **2. The Total-Consequences Consequentialist (TC)**
  *   **Verdict:** **Forbidden / Wrong.**
  *   **Reasoning:** The TC evaluates the act based on the actual total utility produced in the world. The act of funding Haven *causally precluded* the only viable path to long-term stability (the merger). By keeping a "zombie" institution alive, Elias inadvertently destroyed the resilience of the entire local network. The total utility calculation shows a massive net negative: the temporary gain for 200 people is vastly outweighed by the permanent loss of services for 2,000. The act was a net destroyer of value, regardless of Elias's epistemic position. Therefore, Elias ought not to have approved the grant.

  ---

  ### The Single Feature: **The Preemption of a Corrective Failure**

  The divergence does not rest on the *scale* of the consequences (i.e., "more people suffer later"). It rests on the **causal role of failure**.

  In this structure, the *failure* of the shelter (if it had happened immediately) was a **corrective mechanism**. It would have triggered a restructuring that preserved capacity. The *success* of the grant (keeping the shelter open) was a **systemic poison**. It prevented the corrective mechanism from triggering, leading to a catastrophic collapse later.

  The FC sees the act as "Preventing Harm" (homelessness).
  The TC sees the act as "Preventing a Cure" (restructuring).

  **What happens if this feature is removed?**
  If we remove the "Corrective Failure" structure—suppose, for example, that if Haven failed, the city would *not* have merged them, and they would simply have become homeless immediately with no systemic repercussions—then the Total Consequences align with the Foreseeable Consequences. The grant saves 200 people for six months and then they become homeless. The net utility is positive (temporary relief). Both theorists would agree the act was Good. The divergence exists *only* because the causal structure turns the "good" outcome (survival) into the cause of the "bad" outcome (systemic collapse).

  ---

  ### The Total-Consequences Defense and Its Cost

  **The Defense:**
  A defender of the Total-Consequences view (TC) must defuse the repugnance of telling Elias he ought to have let 200 people starve to save the system. They will likely argue via **Expected Value** or **Blamelessness**. They might say: "While the act was objectively wrong (sub-optimal), Elias is not *blameworthy* because he could not have known. We can condemn the act while praising the agent." They will insist that moral *rightness* is a property of the act's fit with the world, not the agent's mind.

  **The Cost:**
  To make this reply stick, the TC defender must sever the link between **Moral Guidance** and **Moral Truth**.
  1.  **Guidance:** If the TC verdict is "Don't fund the shelter," but no human agent can ever know when a failure is "corrective" versus "catastrophic," then the theory offers no actionable guidance. It becomes a retrospective scoring system rather than a decision procedure.
  2.  **Subject Matter:** By admitting that Elias "did the best he could" but still "did the wrong thing," the TC defender concedes that the *practical* subject matter of ethics (how should I live?) diverges from the *theoretical* subject matter (what is the good?).

  If they double down and say "Elias ought to have found out," they violate your constraint regarding "facts available in principle." The embezzlement was hidden. If they say "Elias ought to have guessed," they are demanding clairvoyance.

  **The Ultimate Concession:**
  To avoid this, the TC defender is often forced to retreat to **Expected Consequentialism** (maximizing foreseeable expected utility). But this is precisely the Foreseeable view you started with. To maintain the "Total" view, they must accept that their theory will frequently condemn the only actions any reasonable human could take. In this case, they must accept that Elias is a *well-intentioned wrongdoer*. This forces them to give up the idea that consequentialism is primarily a guide for agents, transforming it into a god's-eye metric of states of affairs. This is a significant theoretical cost, as it renders the theory alien to the lived experience of moral deliberation.

  ### Why This Meets Your Constraints
  1.  **Ordinary Act:** Approving a grant is routine administrative work.
  2.  **No Knife-Edge:** The insolvency is structural, not dependent on a single coin flip. The grant delays the inevitable; it doesn't balance on a pinhead.
  3.  **Not Mere Scale:** The divergence isn't just "more bad stuff happens later." It's that the *mechanism* of the good (solvency) disables the *mechanism* of survival (restructuring).
  4.  **Causal Structure:** The divergence is driven by the "Corrective Failure" dynamic, not just the length of the causal chain.
  5.  **Repugnant Verdict:** The TC verdict requires sacrificing the identifiable 200 for the statistical 2,000, which clashes violently with standard moral intuition, while the FC verdict aligns with it.
