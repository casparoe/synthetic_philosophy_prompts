          5.  Divergence must arise from *causal structure* (markets, institutions, chains of agents), not just "consequences go on forever" (scale alone).
          6.  Divergence must *not* rest on the agent's ignorance of available facts (epistemic access isn't the key; it's the evaluation metric).
