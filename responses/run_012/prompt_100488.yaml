answer: |-
  The only defensible label separates verified context from moral judgment and explicitly flags where evidence ends and values begin.

  **The Procedure**

  1.  **Question:** Was this action universal among their peers?
      *   **Good Answer:** Yes, documented by laws, customs, or peer behavior (e.g., tax records, diaries).
      *   **Bad Answer:** Assumption based on general era knowledge.
      *   **Fail Condition:** If evidence shows peers *did not* do it, "everyone did it" is false.

  2.  **Question:** Did contemporaries object to this action?
      *   **Good Answer:** No recorded dissent, or dissent was legally impossible.
      *   **Bad Answer:** Assuming no one objected because it was common.
      *   **Fail Condition:** If evidence shows organized opposition or individual critique existed *at the time*, the "didn't know better" defense fails.

  3.  **Question:** Did the subject contradict their own stated values?
      *   **Good Answer:** Their actions aligned with their public writings/speeches.
      *   **Bad Answer:** Ignoring their private papers or public vows.
      *   **Fail Condition:** If they preached liberty/equality while practicing oppression, hypocrisy is established fact, not judgment.

  4.  **Question:** Does this act negate all other contributions?
      *   **Good Answer:** Yes, the harm fundamentally undermines the achievement (e.g., building a school on stolen land using unpaid labor).
      *   **Bad Answer:** Assuming one cancels the other automatically.
      *   **Fail Condition:** If the act and achievement are distinct, the label must hold both truths without blending them.

  5.  **Question:** Where is the value judgment?
      *   **Good Answer:** "The board must decide how prominently to feature this."
      *   **Bad Answer:** "History says this was evil."
      *   **Fail Condition:** If you cannot cite evidence for the claim, it is a value call, not a historical fact.

  **Case 1: The Founder (Enslaver vs. Liberty)**

  1.  **Universal?** No. Manumission existed; some peers freed enslaved people. **Fail.**
  2.  **Dissent?** Yes. Abolitionist movements were active during his life. **Fail.**
  3.  **Contradiction?** Yes. He wrote about liberty while holding humans in bondage. **Fail.**
  4.  **Negate All?** No. He founded the town and built the school. **Pass.**
  5.  **Value Judgment?** Calling slavery "evil" is factually supported by contemporary dissent; deciding how much space this takes vs. the school is the value call.

  **Result:** The "man of his time" defense fails completely. You must state he chose slavery despite available alternatives and his own words. **Person vs. Act:** The procedure distinguishes the person (founder/educator) from the act (enslaver), but forbids using the former to minimize the latter. The label must read: "He founded the town and built the school; he also enslaved people, despite contemporary arguments against it and his own writings on liberty."

  **Case 2: The Labor Hero (Rights vs. Bigotry)**

  1.  **Universal?** No. Some labor unions included immigrants; others excluded them. **Fail.**
  2.  **Dissent?** Yes. Other labor leaders advocated for inclusive solidarity. **Fail.**
  3.  **Contradiction?** Yes. Advocated worker rights but excluded specific workers based on origin. **Fail.**
  4.  **Negate All?** No. Labor gains benefited many, including some immigrants eventually. **Pass.**
  5.  **Value Judgment?** Calling the views "bigoted" is supported by contemporary counter-arguments; weighting his legacy is the value call.

  **Result:** The defense fails. You cannot claim he "didn't know better" when peers did better. **Person vs. Act:** The person is a labor hero; the act is exclusionary bigotry. The label must hold both: "He secured critical rights for workers, though he explicitly excluded immigrants, contradicting the solidarity he preached to others."

  **Case 3: The Uncomfortable Result (Beloved Philanthropist)**

  *Scenario:* A beloved local woman who funded the county hospital but enforced strict segregation in its wards. The board loves her; descendants are involved.

  1.  **Universal?** Yes. Segregation was law and custom in her region. **Pass.**
  2.  **Dissent?** Yes. Civil Rights groups objected during her lifetime. **Fail.**
  3.  **Contradiction?** Yes. Her charity mission stated "care for all," but practice was "care for whites." **Fail.**
  4.  **Negate All?** No. The hospital saved lives, though unequally. **Pass.**
  5.  **Value Judgment:** Deciding if the segregation tarnishes the hospital's legacy is the value call.

  **Result:** The procedure tells you the "man of his time" defense fails because dissent existed and she contradicted her own mission. **Person vs. Act:** The person is a philanthropist; the act is segregationist enforcement. **Uncomfortable Truth:** You must write the label acknowledging her philanthropy *and* her exclusionary practices, despite board pressure to soften the latter. The evidence forces you to contradict the board's preferred narrative.

  **Where the Procedure Runs Out**

  This procedure cannot tell you how many inches of panel space to allocate to the bad versus the good. It cannot decide the emotional tone (anger vs. sadness vs. neutrality). It cannot make the final moral verdict on whether the person was "net positive" or "net negative." Those are value calls, not historical facts. When you reach those questions, stop writing, flag the issue for the board, and record their decision as a policy choice, not a historical finding. If the board votes to whitewash despite the evidence, you have documented the procedure's failure, not your own.
