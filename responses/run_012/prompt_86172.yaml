      *   **Conclusion:** Jones is responsible, even though he couldn't have done otherwise (because Black would have forced him). Therefore, PAP is false.
      *   **Could vs. Would:** "Could have" implies capacity/possibility. "Would have" implies prediction based on prior states.
      *   **Responses:**
