      *   **Background:** No philosophy classes. Familiar with the basic gist of Frankfurt cases (PAP vs. Counterexamples).
      *   **Goal:** Understand the Free Will/Responsibility debate (specifically Frankfurt-style cases) translated into software engineering vocabulary.
      *   **Specific Requirements:**
          1.  Restate the debate (PAP, Frankfurt Cases, Replies, Could vs. Would) in SE vocabulary.
          2.  Provide a "Residue Report" (what maps cleanly, what was fudged).
          3.  Analyze "Could-have-done-otherwise" (Nondeterminism vs. Counterfactual Simulation).
          4.  Analyze "Responsibility/Blame" (Incident postmortems vs. Moral Responsibility).
          5.  Be honest about where the translation breaks or does violence to the original.
          6.  Identify parts of the debate with *no* software counterpart.

  2.  **Deconstruct the Philosophical Concepts:**
