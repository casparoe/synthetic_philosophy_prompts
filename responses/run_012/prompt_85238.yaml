answer: |-
  Friends, families, trustees, and graduates. Look around you. The air is warm, the trees are full, and the people you love are watching you with a pride that needs no evidence to sustain it. For many of your families, this day is a summit they have been climbing toward for generations. They have carried you here on shoulders that ache from the labor. They hear a promise in this ceremony, a reassurance that the struggle was part of a design that ends in a place like this. I respect that faith. It has brought you to this grass, in these gowns, under this sky.

  But you have also been students of history. You have spent years in archives and libraries, looking at the records of what human beings have actually done to one another. And somewhere between your first lecture and this morning, you were told a story about the world you are entering. You were told that history bends toward justice. It is a comforting shape, an arc that suggests gravity is on the side of the good. It implies that if you wait, or if you merely add your small weight to the scale, the outcome is secured.

  I stand here as a historian, and I cannot tell you that the arc exists on its own. I cannot tell you that there is an author writing a story with an ending already decided. To say that would be to ignore the silence of the graves where no justice arrived. There is another reading, one that suggests institutions and interdependence make good outcomes steadily likelier, as if the machinery of society has a preferred direction. I feel the pull of that idea. I want it to be true. But the evidence suggests a harder truth: nothing bends on its own. The curve we see is the sum of what people did, read backwards through the records that happened to survive.

  If there is no automatic bend, there is only the work of your hands. This changes the nature of the task. It means that progress is not a trajectory; it is a mechanism. Think of a ratchet. A ratchet permits motion in one direction and blocks the reverse, but it can be taken apart. Some of what we call progress is held in place by laws, by norms, by the sheer weight of enforcement. Some of it is a trend that could run the other way if the latch slips. When you leave this place, I want you to develop the habit of asking which of your gains are ratchets and which are merely habits of the moment. Do not assume the door locks itself behind you. You must check the latch.

  This view comes with a cost. If history has a direction, then the people destroyed along the way are the price of arrival. We cannot resolve this. We cannot balance the ledger. We can only acknowledge that the ground we stand on is compacted by those who did not make it, and not allow that knowledge to become a reason for standing still. To act without a guarantee is terrifying. It requires a different kind of fuel than certainty.

  This brings me to the hardest question in the room. It comes from the fourth row, from colleagues who know that historians deal in evidence, not benedictions. They ask: if hope is being asked to do motivational work, is that not providence smuggled back in through the side door? If I tell you to be hopeful without promising you a result, am I not asking you to believe in a miracle without calling it by name?

  It is a fair challenge. Here is the distinction. Expectation is a forecast; it demands evidence that something will happen. Hope is a commitment; it demands a decision to act as if it matters. A promise is not a prediction. When I ask you to hope, I am not asking you to calculate the odds and find them favorable. I am asking you to decide that the odds are irrelevant to the obligation. You can hope that something will happen while believing it is unlikely. You cannot expect it. The move from prediction to commitment costs you the comfort of inevitability. It leaves you responsible for the outcome. But it gives you something prediction never can: it gives you agency.

  We must also admit that the shape of the curve is partly an artifact of whose papers were kept.

  So where does that leave you? It leaves you with a world that is not waiting for you to complete it, but is waiting for you to build it. There are people in the audience whose faith supplies them with an arc. They believe the end is written. Do not argue with them. Their certainty is a source of strength, and this country needs strength. But your assignment is different. You are not here to witness a prophecy. You are here to maintain the machinery.

  You will enter professions where efficiency is often confused with virtue. You will work in systems that reward short-term gains over long-term stability. You will see ratchets slip. You will see norms dissolve because it was convenient to let them go. When this happens, do not look for a sign that the universe will correct itself. It will not. You must be the correction.

  This is not a call to despair. It is a call to clarity. Despair belongs to those who expected the arc to do the work for them. Clarity belongs to those who know the work is theirs. There is a dignity in acting without a guarantee. There is a freedom in knowing that you are not a character in a story written by someone else, but an author of the next sentence.

  So, here is what I ask you to do. Do not carry a belief about how things turn out. Carry a tool kit. When you see a gain, ask how it is secured. When you see a loss, ask what mechanism failed. When you are tired, do not look for a promise that rest is coming. Look for the person next to you who is also tired, and share the load. Build institutions that can survive your absence. Write records that tell the truth about what it cost. Protect the people who cannot protect themselves, not because history demands it, but because you demand it of yourself.

  The future is not a destination you are arriving at. It is a thing you are making. It will not end well unless you make it end well. It may not end well even then. But the making of it is the only thing that belongs to you. Go make it.
