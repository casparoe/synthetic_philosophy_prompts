answer: |-
  **THE STANDING AUTHORITY**
  **METHODOLOGY DOCUMENT 4.1: ASSESSMENT OF COMPLAINER ELIGIBILITY**

  **1. Scope of Blaming Activity**
  The Standing Authority (the Bureau) rates the *standing* of an entity to issue blame, not the validity of the blame itself. Blaming Activity is defined as any overt expression of resentment, verbal accusation, demand for cessation, or public agitation regarding a norm violation. Private belief in another's wrongdoing is excluded from rating protocols. Public agitation carries a higher weighting than private confrontation. All Blaming Activity requires a current Standing Rating to be considered actionable by stakeholders.

  **2. Fault Attribution Schedule**
  The Bureau assesses the Blamer's own conduct against the norm invoked.
  *   **Type I Fault (Identity Match):** The Blamer is currently engaged in the exact same conduct they are criticizing. This triggers an automatic non-investment grade review.
  *   **Type II Fault (Normative Congruence):** The Blamer violates a different norm that undermines the spirit of the invoked norm (e.g., criticizing lateness while being chronically unprepared). This incurs a partial downgrade.
  *   **Relevance Screen:** If the Blamer's fault does not touch the norm being invoked (e.g., a thief criticizing assault), no downgrade applies.

  **3. Temporal and Remediation Protocols**
  *   **Lookback Period:** Five years.
  *   **Ongoing Hypocrisy:** Immediate downgrade to Junk status.
  *   **Abandoned Hypocrisy:** Faults ceased prior to the Lookback Period are disregarded.
  *   **Recent Cessation:** Faults ceased within the last twelve months result in a Probationary Rating. Standing is not restored until a full Clean Hands Period is observed.
  *   **Remediation:** Apology alone does not restore rating. Demonstrable behavioral change over the Clean Hands Period is required. No remediation is possible for Type I Faults occurring simultaneously with the Blaming Activity.

  **4. Ratings Scale**
  *   **AAA (Unimpeachable):** No relevant faults detected.
  *   **AA to A (Strong):** Minor historical faults, fully remediated.
  *   **BBB (Investment Grade):** Acceptable standing; minor congruence faults exist but do not invalidate authority.
  *   **BB to B (Speculative):** Significant congruence faults; blaming activity carries high reputational risk.
  *   **CCC to D (Junk):** Compromised standing. Blaming Activity is deemed hypocritical. Type I Faults result in immediate 'D'.

  **5. Worked Examples**
  *   **Entity A (Rating: AA):** Criticizes colleague for falsifying expense reports. Entity A has no history of financial misconduct. Standing is confirmed.
  *   **Entity B (Rating: D):** Criticizes colleague for falsifying expense reports. Entity A falsified reports within the current fiscal quarter. Standing is revoked. The colleague's falsification may still be factual, but Entity B lacks the standing to enforce the norm.

  ***

  **PRESS RELEASE: The Standing Authority Downgrades J. Doe to CCC**

  **NEW YORK** — The Standing Authority today downgraded the Standing Rating of J. Doe from AA to CCC. The downgrade follows evidence that Doe publicly criticized a subordinate for missing deadlines while simultaneously failing to meet internal deliverables.

  "This constitutes a Type II Fault with high Normative Congruence," said a Bureau spokesperson. "While Doe's specific failure differed in kind, it violated the same operational norm invoked against the subordinate." The Bureau noted that the subordinate's missed deadline remains a factual event. The downgrade applies only to Doe's eligibility to complain. Doe has been placed on Probationary Status pending a twelve-month Clean Hands Period.

  ***

  **RISK DISCLOSURE**
  Investors and stakeholders should be aware that under the current Methodology, very few entities retain an investment-grade rating over a lifetime. The Bureau acknowledges that systemic moral failure suggests a market-wide risk where almost all Blaming Activity may eventually be classified as Junk. The Bureau has considered this objection. It has determined that lowering standards to increase the volume of investment-grade Blamers would compromise the integrity of the index. The Methodology will not be revised to accommodate universal non-compliance. Stakeholders are advised that a lack of eligible Blamers does not imply the absence of wrongdoing.

  ***

  **Note to the Author**

  This piece leans heavily on the "standing account" of blame, popularized in contemporary ethics (e.g., by philosophers like Bell, Fritz, or Smith, though unnamed here). It treats standing as a kind of moral credit score based on cleanliness.

  **Liberties & Disputes:**
  1.  **The Separation of Truth and Standing:** The piece insists a 'D' rating doesn't make the complaint false. This is a standard philosophical move to avoid the *tu quoque* fallacy, but some argue that hypocrisy *does* undermine the truth-tracking ability of moral discourse. I am confident in this separation for the sake of the satire, as it's the core of your request.
  2.  **The "Clean Hands" Requirement:** The methodology assumes you need clean hands to blame. Some philosophers argue standing is about *authority* or *relationships*, not just moral cleanliness. You might have standing to blame your child even if you aren't perfect.
  3.  **The Weakest Claim:** The risk disclosure admits almost everyone fails the rating. This commits the Bureau to an overly demanding view of morality (that we must be nearly perfect to criticize). I am least sure about the claim that "Apology alone does not restore rating." Many argue that sincere apology *does* restore standing immediately, whereas the Bureau demands a waiting period. This was a deliberate choice to mimic corporate cooling-off periods, but it's philosophically contentious.
