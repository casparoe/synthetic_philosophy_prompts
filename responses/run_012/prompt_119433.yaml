  Right, I've been going round in circles on the Frankfurt-style cases and I want to dump all my gut verdicts in one place and have someone tell me what principle is actually doing the work here, or whether I just have to drop one of them. Answer in British English please.

  The general shape, in case you need it: someone does a thing off their own bat, but if they hadn't been about to, someone else would have made them do it. Usual verdict is that they're still fully responsible. Fine. But I've been poking at the details and now I'm a mess. Here's what I think, case by case.

  Dara votes Green. A neuroscientist has put a thing in her head that would have made her hand mark the Green box if she'd shown any sign of not doing it. She votes Green on her own, cheerfully, no wobble at all. I think she's fully responsible, and I'd tell the neuroscientist to get lost if she tried to take any credit for it.

  Same thing, except the device works by flooding Dara with an overwhelming urge to vote Green rather than by moving her hand — her reasoning is still hers, just loaded. It never fires. I think this is exactly as responsible as the first one. My flatmate says no, that one's different, because the thing would have worked *through* her rather than *on* her. I dont see it.

  The trigger was her blood sugar. Device fires below 4.0, she's at 4.1. Nothing happens, she votes Green anyway. I think: no difference at all. My flatmate says "well, she got lucky," and I say luck isn't the issue, either you could have done otherwise or you couldn't. Though when he asks whether it's the same if the device would only have fired had she won the lottery, I get noticeably less confident.

  Just before she votes, Dara has a half-second flicker of wanting to spoil her ballot, then thinks better of it. The device was monitoring and would have smoothed the flicker away if it had grown, but it was too weak to trip the trigger. I think the flicker is irrelevant — she's responsible, and if she says "ah but I could have spoilt it," that's just false.

  Nia is a lifeguard. A swimmer drowns while she's on the tower. She never moved to help — not a decision, she just sat there, vaguely aware, thinking about lunch. There was a device in her back that would have paralysed her arm if she'd reached for the float. It never fired because she never reached. I think she is *not* responsible for the drowning. Not "less" — not hers at all. I'd defend that one in court.

  Theo sits on a planning committee and a housing scheme dies because he won't sign the form. Same kind of device on him — it would have paralysed his arm if he'd reached for the pen. He never reached, but this time it's because he'd decided not to sign, and he was glad the thing was going down. I think he's fully responsible. Which is the same shape as Nia and I cannot seperate them.

  Priya grew up wanting exactly the thing she now does. No device anywhere. A manipulator twenty years ago fixed her school, her friends, what she read, so that she'd turn out this way and never need forcing. She does the thing, unforced, out of a desire that is genuinely hers in the ordinary sense. I think her responsibility is compromised — not gone, but not the same. And I can't say why that's different from the first Dara case, where I was happy to say the counterfactual stuff doesn't matter at all.

  My mate's take, which I half like: the manipulator in all the Dara cases is a *shadow* — someone who would have done it *for* her but never did anything *to* her — and all my verdicts are tracking what was actually done to the agent, not what could have been. If that's the right axis then it saves Dara, but it makes a nonsense of Nia versus Theo, because nothing was done to either of them either.

  So: is there a principle that gets all of these, or close? My own guess was "you're responsible just in case what actually happened flowed from your own deliberation, and all the counterfactual machinery is beside the point" — but that hands me Nia, which I won't accept, and it says nothing about Priya. State it precisely if you've got one, tell me which of my verdicts it buys and which it has to overrule, and don't just give me the standard line, I've heard it. Two cases I haven't listed that I'd like it to pronounce on: (a) a device that would have made Dara do something completely different — not vote at all, but set fire to the polling station — if she'd shown any sign of staying home, everything else the same; and (b) a case where the shadow never needed to act, but the agent knew about it all along and did the thing *because* she knew she had no alternative. Where does my pattern break?
