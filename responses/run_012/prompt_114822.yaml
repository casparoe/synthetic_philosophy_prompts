answer: |-
  Philosophers have a name for this little game, but in the studio, we just call it drift. Of course the shape degrades; if you photocopy a photocopy two hundred times, eventually you have a black square, but that doesn't mean the original image didn't exist. The essence lives in the topology: a closed counter, a vertical stress, a distinction from 'o' and 'u'. When your two-hundredth designer draws a hook and a loop, they aren't seeing an *a*; they are trusting the label attached to the previous drawing. The judgment fails, not the essence.

  As for the one-storey and two-storey forms, they are variants like serif and sans, not different letters. The essence is the structural commitment to enclosing space against the baseline. You want a refutation? Show me a shape that violates that topology—say, an open arch like an *n*—that still functions as an *a* in text without confusing the reader, or show me a perfect two-storey *a* that is universally rejected. Until then, you're mistaking the flexibility of the system for the absence of its bones.
