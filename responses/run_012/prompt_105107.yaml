answer: |-
  There is no standard term, but this phenomenon is best coined **Constitutive Lock-in**, a specific stabilization of the broader "Boundary Problem" in democratic theory.

  The reasoning rests on the distinction between *constituted* power (the rules the group makes) and *constituent* power (the group that makes the rules). Your co-op and union both discovered that their constituted rules for membership cannot be reflexively applied to the constituent body without dissolving the authority structure itself. If the current voters apply the "live here and pay" rule to themselves, they cease to be the "current voters," meaning there is no one left to enforce the rule. Constitutive Lock-in occurs when a group implicitly suspends its own membership criteria to preserve the continuity of the decision-making body, prioritizing the existence of the *demos* over the consistency of its definitions.

  This separates from plain self-dealing in motive and structure. Self-dealing is individual corruption: breaking rules for personal gain against the group's interest. Constitutive Lock-in is structural preservation: suspending logic for the group's continuity, often with collective acquiescence. In self-dealing, the rule is violated secretly for profit; in Lock-in, the rule is set aside openly (or quietly) for survival. It is not hypocrisy because the group implicitly acknowledges that *something* must define the boundary, and if the principle fails, the status quo is the only neutral default available to prevent infinite regress.

  The logic remains identical across co-ops, unions, and countries, but the stakes and enforcement mechanisms shift. In a **housing co-op**, the lock-in is contractual and low-stakes; the "border" is property rights, and the exclusion is economic. In a **union**, the lock-in is legal and representational; the "border" is the bargaining unit, and excluding insiders risks decertification while including outsiders dilutes leverage. In a **country**, the lock-in is sovereign and coercive; the "border" is citizenship, and the retreat to "whoever is already in" is formalized as birthright citizenship or grandfathered residency laws backed by state violence. In all three, the edge case reveals that no group is truly defined by its principles alone, but by the historical accident of who holds the power to define them.
