          *   Complexity/Adaptability (Animals are way more complex than 17th-century clocks).
          *   *Crucial Point:* The Roomba analogy assumes *no interiority*. Does Descartes allow *any* interiority? He denies *conscious* interiority.
      *   *Vivisection Implication:* If it's a Roomba, kicking it is property damage, not cruelty. If it's a living thing that *feels* but doesn't *think*, kicking it is cruelty. The friend's argument hinges on the "no feeling" claim.

  4.  **Drafting the Content - Section by Section:**

