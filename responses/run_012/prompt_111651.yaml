      *   *Clarification:* Descartes doesn't deny the *physical process* of pain (nerve pulling), he denies the *mental experience* of pain.
      *   *Friend's Claim:* "No different from kicking a Roomba." Is this true for Descartes? Yes, morally. Physically, the animal bleeds, the Roomba sparks. But morally, both are property.
      *   *Audit:* The user wants to *audit* the analogy. So I need to show where it holds and where it stretches.

