  **The Scenario**
  Elena is driving home late at night on a foggy highway where three consecutive off-ramps look exactly alike; she suffers from a temporary dissociative episode such that at any ramp, she cannot tell which one it is and has no memory of passing previous ones. Exiting at the first ramp leads to a restricted military zone where she will be detained and fined heavily (payoff 0). Exiting at the second ramp leads to a friend's house where she can sleep safely but is far from work tomorrow (payoff 12). Exiting at the third ramp is her actual driveway (payoff 20). If she misses all three, the highway ends at a cliffside barrier where she will crash; she will survive but her car will be totaled (payoff 10). She must decide at every ramp whether to exit or continue, knowing these payoffs but unable to distinguish her location.

  ***

  **1. The Optimal Strategy**
  Because Elena cannot distinguish the intersections, she must adopt a single probability $p$ of exiting at any given ramp. If she always exits ($p=1$), she gets detained at the first ramp (0). If she never exits ($p=0$), she crashes (10). To beat both, she must randomize. Her expected payoff is the sum of the probability of exiting at each specific ramp multiplied by that ramp's value, plus the probability of missing all three multiplied by the crash value.

  Mathematically, this looks like:
  $EU = p(0) + (1-p)p(12) + (1-p)^2p(20) + (1-p)^3(10)$.

  When you solve for the maximum, you do not get a clean number like 1/2. The optimal probability of exiting is approximately **4.7%** ($p \approx 0.047$). At this rate, her expected payoff is roughly **10.05**. This is strictly better than crashing (10) and strictly better than always exiting (0), but the margin is razor-thin. She is essentially betting that by risking a tiny chance of exiting early, she secures a small chance of hitting the driveway without significantly increasing the risk of the crash.

  **2. The Unavailable Perfect Plan**
  If Elena could tell the intersections apart, her plan would be obvious: Continue at the first, Continue at the second, and Exit at the third. This guarantees the driveway payoff of **20**. This plan is unavailable because her memory loss and the identical surroundings collapse her three distinct decision points into one single "information set." She cannot condition her action on her location because, subjectively, every location feels identical. The value of this unavailable plan (20) represents the "First Best" outcome that her cognitive limitation prevents her from securing.

  **3. Value of a Fully Informed Passenger**
  If she hires a passenger who knows the road and tells her exactly which intersection she is at, she can execute the perfect plan (Continue, Continue, Exit). She secures the payoff of 20. Since her baseline expected payoff without the passenger is 10.05, the maximum she should be willing to pay is the difference: **9.95**. This number comes directly from the gap between the certainty of home (20) and the precarious expected value of her absent-minded mixed strategy (10.05).

  **4. Value of a Partially Informed Passenger**
  Suppose the passenger can only speak once, to tell her "You have already passed the first intersection" (which effectively happens at the second ramp).
  *   **If the passenger speaks:** She knows she is at the second ramp. She compares Exiting (12) vs. Continuing. If she continues, she faces the third ramp alone (absent-minded again), where the expected value is only about 10.5. So, she Exits for 12.
  *   **If the passenger is silent:** She knows she is either at the first or third ramp. However, knowing the passenger *would* have spoken at the second, she can adopt a rule: "If silent, Continue; if spoken, Exit." This ensures she passes the first ramp and gets off at the second.
  *   **Result:** This partial information guarantees her the friend's house payoff of **12**.
  *   **Willingness to pay:** $12 - 10.05 =$ **1.95**.

  **The Gap:** There is a massive gap between what she pays for full info (9.95) and partial info (1.95). This shows that the value of information in this case is not just about avoiding the worst outcome (the crash), but about distinguishing the *target* (Exit 3) from the *consolation prize* (Exit 2). Knowing she passed Intersection 1 saves her from the crash, but knowing she is *at* Intersection 3 is what gets her home. The marginal value of distinguishing the final intersection is disproportionately high.

  **5. The Payoff Structure's Critical Feature**
  The feature doing the real work is that **Exiting at the First is worse than Crashing** ($0 < 10$).
  *   **Why it matters:** This creates a "danger zone" at the start of the trip. It forces her exit probability $p$ to be extremely low (4.7%) to avoid the disaster of Intersection 1.
  *   **What collapses if removed:** If Exiting at the First were better than Crashing (e.g., payoff 15), she would exit much more aggressively. The tension between "don't exit yet" and "don't miss the exit" would vanish, and the optimal strategy would likely shift to a high $p$ or even $p=1$. The fragility of the mixed strategy depends entirely on the early exits being catastrophic.

  **6. The Commitment Objection (What your TA wants)**
  The theorists who argue for ex-ante commitment (like Aumann or the "planning self" proponents) would say your case is unstable because of **time inconsistency**.
  *   **The Argument:** While $p=0.047$ is optimal calculated at home before the trip (ex-ante), it is not optimal when Elena is actually at the wheel (ex-interim). When she arrives at a ramp, she should reason: "Since I am here, it is most likely the first ramp." If she believes she is likely at the first ramp, the incentive to Continue is even stronger than calculated ex-ante, pushing her optimal $p$ closer to 0.
  *   **Breaking the Case:** They would argue that without a binding commitment device (like a literal timer locking her steering wheel), she will deviate from the 4.7% plan once she is driving. Furthermore, given the advantage of randomizing is only **0.05 utility units**, they would argue that the cognitive cost of maintaining a randomization strategy exceeds the benefit. A rational agent wouldn't bother flipping a coin for such a negligible gain; she would just accept the crash (10) as "good enough" rather than risk the mental load of optimization.
