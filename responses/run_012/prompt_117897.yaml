  **The Actuarial End of History**
  *Inside the Meridian Continuity Group, where the lifespan of nations is reduced to a decimal, and the base rate is always right until it isn't.*

  ***

  **MCG METHODOLOGY STATEMENT 9.4: POLITY CONTINUITY & TERMINAL HAZARD ASSESSMENT**

  **Preamble**
  The Meridian Continuity Group provides sovereign actors and institutional counterparties with definitive timelines for institutional persistence. Our models exclude narrative bias in favour of structural inevitability, ensuring that all ratings reflect the unconditional probability of cessation rather than the subjective hope of survival.

  **1. Reference Class Selection**
  The rated entity shall be assigned to a cohort of historical polities sharing ≥3 structural attributes (e.g., fiscal centralization, border permeability, elite fragmentation). This cohort is subject to *Post-Hoc Alignment*: if the initial rating diverges significantly from market consensus, the attributes may be reweighted to align the sample size with statistical significance thresholds. The class must be broad enough to yield a rate, yet narrow enough to justify the fee.

  **2. Cohort Revision Protocol**
  Should the selected reference class produce a hazard rate incompatible with the client's continuity objectives, the Class Definition Committee is authorized to revise the inclusion criteria. This ensures that the reference class remains relevant to the specific geopolitical context of the rated state, even if that context was not visible at the time of the historical analogues' failures.

  **3. Survivorship Correction**
  The historical record privileges collapse over persistence; polities that endure leave fewer dramatic archives. Accordingly, the sample excludes polities whose archives remain inaccessible due to continuous administration. We treat silence as data, assuming unrecorded survivals represent measurement error rather than genuine stability. The unconditional rate of failure is thus adopted as the conditional baseline.

  **4. Temporal Crystallization**
  While the model generates a probability density function over a century, the sales product requires a singular date. The median hazard point shall be converted to a calendar year via linear interpolation, disregarding variance bands. A 40% chance of collapse within 50 years is published as "Termination Expected: 2074." Precision implies control.

  **5. The N=1 Waiver**
  Acknowledging that a state is a non-repeatable singularity, the Group nevertheless applies portfolio logic. The rated state is treated as one draw from a hypothetical infinite series of identical states. Diversification benefits are assumed available to the state itself across time, notwithstanding the impossibility of temporal hedging. The law of large numbers applies to the observer, if not the observed.

  **6. Qualitative Displacement (The Override)**
  Base rates hold unless case-specific knowledge indicates a "Broken Leg" scenario. Determination of what constitutes a broken leg is reserved for the Senior Committee. This clause allows narrative intelligence to overwrite statistical baselines when the baseline produces uncomfortable diplomatic friction or contradicts internal intelligence assessments regarding regime stability.

  **7. Epochal Homogeneity**
  The sample spans millennia despite changes in lethal technology. We assume the hazard rate for plague-induced collapse is exchangeable with credit-induced collapse. A footnote acknowledges non-stationarity but asserts that human folly is a constant variable. The mechanisms of death change; the fact of death does not.

  **8. Performative Calibration**
  Publication of the rating alters the entity's borrowing costs, which alters the hazard rate. This reflexivity is not an error but a feature. A downgrade is an intervention designed to accelerate the predicted outcome, thereby validating the model. The rating does not measure the risk; it manages the timeline.

  **9. Terminal Event Consensus**
  "Collapse" is defined retroactively by surviving archivists. As current consensus is unavailable, the Group proxies this using contemporary media sentiment. Ratings are issued to two decimal places, implying precision exceeds the historiographical ability to define the event itself. Uncertainty is rounded down.

  ***

  **APPENDIX A: DISSENTING NOTE (METHODOLOGY DIVISION)**

  **From:** Dr. Aris Thorne, Senior Methodologist
  **To:** File 9.4
  **Re:** Objection to Final Draft

  We are selling certainty about singularities. Clause 6 admits we change the math when the number looks bad. Clause 8 admits we cause the thing we measure. I argued for confidence intervals. They said intervals don't sell. I am noting for the record that when the model says 2049, it means "we feel nervous," not "2049." But the contract says 2049. The outside view is honest, but this document uses it to lie.
