answer: |-
  ### Examination Question

  **Question 1 (20 Marks)**
  Consider the case of a patient recovering from a disorder of consciousness who exhibits two robust, replicable patterns during bedside testing:
  1.  **Pattern A:** On some trials, she correctly uses a briefly presented word to guide a two-step action (fetching a named object). On debrief, she insists she had no experience of the word, describing the action as "something happening in the machinery."
  2.  **Pattern B:** On other trials, she reports a vivid, richly detailed experiential state (e.g., a colour or face) that she cannot use to guide the task, cannot recall a moment later, and which never enters her reasoning.

  Write an essay that critically evaluates this case. Your answer must: (i) define access consciousness (A-consciousness) and phenomenal consciousness (P-consciousness); (ii) assess the coherence of this double dissociation; (iii) explain what Global Workspace Theory (GWT) implies about each pattern; (iv) distinguish whether the tension here represents a genuine theoretical disagreement or a merely verbal dispute; and (v) confront the evidential problem that retrospective reports are themselves access phenomena.

  ***

  ### Model Answer

  The distinction between access consciousness (A-consciousness) and phenomenal consciousness (P-consciousness), famously articulated by Ned Block, is central to analysing this case. A-consciousness refers to a representation's functional availability for reasoning, rational control of action, and reporting. P-consciousness refers to the experiential character of a state—what it is like to have it. The patient's case presents a putative double dissociation: Pattern A suggests A-consciousness without P-consciousness (functional guidance without experience), while Pattern B suggests P-consciousness without A-consciousness (experience without functional utility).

  Pattern A resembles blindsight or semantic priming. The patient's behaviour indicates the word was processed sufficiently to guide action, satisfying criteria for A-consciousness. However, her report denies P-consciousness. Global Workspace Theory (GWT), which typically equates consciousness with global ignition (broadcasting to multiple systems), faces a dilemma here. If GWT identifies consciousness with access, Pattern A is unconscious processing. If GWT allows for unconscious access, it must explain why the patient denies experience. A standard GWT response is that the information was processed locally for motor output without global ignition, hence no P-consciousness. This preserves the theory but relies on the patient's report being accurate.

  Pattern B is more theoretically volatile. The patient reports vivid phenomenology that lacks functional utility. Strictly speaking, if she reports it, she has accessed the content to generate the report, challenging the claim that it lacks A-consciousness. However, if the content is unavailable for *reasoning* or *delayed recall* and only available for immediate verbalisation, one might argue it possesses P-consciousness but limited A-consciousness. For GWT, this is problematic. GWT posits that content becomes conscious only when it enters the global workspace to be broadcast. If Pattern B content is vivid (conscious) but not broadcast for reasoning or memory, GWT must either deny the phenomenality is genuine or decouple ignition from broader cognitive access.

  This leads to the evidential problem. We rely on the patient's reports to establish the presence or absence of P-consciousness. Reports are actions, requiring A-consciousness. In Pattern A, we trust the report of *no* experience. In Pattern B, we trust the report *of* experience. If reports require access, Pattern B's report proves some access existed, potentially collapsing the dissociation. We face a methodological circle: we use access (report) to measure phenomenality, then claim phenomenality exists without access.

  Is this a theoretical or verbal disagreement? It turns on the definition of consciousness. If one defines consciousness strictly as A-consciousness (as Dennett might), Pattern B is incoherent; the patient is confused or the "vividness" is a post-hoc confabulation. If one adopts a pluralist view (like Block), the dissociation is conceptually coherent, though empirically fragile. The disagreement becomes merely verbal if theorists agree on the functional facts (the neural processing and behavioural outputs) but disagree on whether to label the non-functional vividness "consciousness." However, if the neural correlates differ between Pattern A and B, the disagreement is theoretical regarding the architecture of mind.

  Ultimately, the case highlights the fragility of relying on introspection. To maintain the coherence of Pattern B, one must argue that the access required for reporting is distinct from the access required for reasoning and memory. Without this distinction, the double dissociation collapses. GWT proponents must argue that Pattern B involves a failed or partial ignition that supports report but not reasoning, or deny the phenomenality entirely. The case does not refute GWT but forces it to refine the relationship between ignition, report, and cognitive control.

  ***

  ### Marking Scheme (Total 20 Marks)

  **1. Definitions of A-Consciousness and P-Consciousness (4 Marks)**
  *   **4:** Clear distinction between functional availability (A) and experiential character (P), citing Block or equivalent.
  *   **2-3:** Definitions present but slightly conflated or lacking functional specificity.
  *   **0-1:** Vague or incorrect definitions.
  *   *Typical Mishandling:* Treating P-consciousness as simply "stronger" A-consciousness rather than a distinct mode.

  **2. Analysis of Pattern A & GWT Implications (4 Marks)**
  *   **4:** Identifies Pattern A as potential unconscious access; notes GWT views this as local processing without ignition.
  *   **2-3:** Describes the behaviour but misses the GWT implication regarding ignition/broadcasting.
  *   **0-1:** Claims Pattern A proves consciousness exists without access.
  *   *Typical Mishandling:* Dismissing the patient's denial of experience as "self-deception" rather than taking the phenomenological claim seriously.

  **3. Analysis of Pattern B & GWT Implications (4 Marks)**
  *   **4:** Recognises the paradox: reporting implies access. Discusses GWT struggle with phenomenality lacking cognitive utility.
  *   **2-3:** Accepts Pattern B at face value without noting the report/access contradiction.
  *   **0-1:** Claims Pattern B disproves GWT without nuance.
  *   *Typical Mishandling:* Treating the report of vividness as self-certifying evidence of P-consciousness without questioning the access required to report it.

  **4. The Evidential Problem of Reports (4 Marks)**
  *   **4:** Explicitly articulates that reports are access phenomena, creating a methodological circle in measuring P-consciousness.
  *   **2-3:** Mentions reports are unreliable but misses the structural paradox.
  *   **0-1:** Ignores the epistemic status of the debrief.
  *   *Typical Mishandling:* Assuming the debrief is a neutral window into the mind rather than a cognitive task itself.

  **5. Theoretical vs. Verbal Disagreement & Coherence (4 Marks)**
  *   **4:** Distinguishes between definitional stipulations (verbal) and architectural claims (theoretical); concludes on the coherence of the dissociation.
  *   **2-3:** Identifies the dispute but fails to categorise it as verbal vs. theoretical.
  *   **0-1:** Asserts the case is impossible without justification.
  *   *Typical Mishandling:* Concluding the case is "just semantics" without explaining which functional facts are agreed upon.

  **Specific Penalties (Deduct from Total)**
  *   **-2 Marks:** Redscribing Pattern A as the patient merely being wrong about her own experience (heterophenomenological override without justification).
  *   **-2 Marks:** Treating Pattern B's report as unproblematic evidence of phenomenal character without access (ignoring the access requirement for reporting).

  **Grade Boundaries**
  *   **A (17-20):** Nuanced handling of the report paradox; clear GWT application; avoids specific penalties.
  *   **B (14-16):** Good definitions and case analysis but misses the depth of the evidential problem or GWT nuance.
  *   **C (10-13):** Descriptive rather than analytical; definitions weak.
  *   **D/F (<10):** Fundamental misunderstandings of consciousness concepts.
