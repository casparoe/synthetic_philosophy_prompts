prompt: |-
  ok so I'm a fourth-year phil PhD (ethics-of-tech-ish, broadly) and my roommate just dropped a situation on me that I genuinely can't give a clean answer to, and I'd rather help her think it through than just shrug and say "privacy's complicated."

  Two years ago she did one of those mail-in DNA kits. Ancestry percentages, nothing she was worried about, clicked through the consent screens like everyone does. Last month a detective used the company's database to pin a cold case on a distant cousin of hers — a guy she's met like twice. He's been charged. Her data had nothing to do with the crime; the match just happened to run through her profile to get to him. (There was even a law-enforcement opt-out she thought she'd taken, but apparently it only covered her own profile being searched head-on, not being used as the stepping stone to a relative — which is exactly the part that ended up mattering.)

  She's furious and feels violated, but every time I try to say *why* she was wronged I tie myself in knots. She didn't lose a secret — half her family had already uploaded their spit, so this info was basically ambient. She can't unring the bell. And she did tick the box; the terms did say they'd share with law enforcement. So if privacy just means "I control who gets my info," it looks like case closed. But it obviously isn't — she's not being unreasonable, and I don't want to tell her she is.

  I feel like there's some distinction lurking here between "did I specifically agree to *this*" and "is this a fitting way for this kind of information to move around," and I suspect the second one is doing alot of the work, but I can't state it precisely. There's also something weird about the fact that what got exposed wasn't really *her* private business — it was her cousin's, reached through her, or maybe her own, reached through him; I honestly can't tell whose wrong it is, or whether that even matters.

  Can you untangle this for me? What exactly got wronged, if anything — and how would you put it so it doesn't collapse into either "she consented, tough luck" or "any use of your data at all is a violation"? And does the relational part (that it took a relative to make the match) actually change the analysis, or is that a red herring? I want something I can genuinely relay to her.
reasoning: |-
