answer: |-
  This is a classic "privacy paradox" case, but you're right to sense that standard liberal individualist frameworks (privacy = secrecy + consent) collapse here. If privacy is just "controlling access to secrets," she has no claim: the data wasn't secret, and she clicked the box.

  But as you know, contemporary privacy theory has moved well beyond that. To help her, you need to shift the frame from **secrecy** to **context**, and from **individual consent** to **relational agency**.

  Here are three specific philosophical lenses you can use to untangle this for her. None of them rely on "you should have read the ToS better" or "all data mining is evil."

  ### 1. Contextual Integrity (Helen Nissenbaum)
  This is probably your strongest tool. Nissenbaum argues that privacy isn't about hiding information; it's about the **appropriate flow of information according to context-specific norms.**

  *   **The Argument:** When she swabbed her cheek, she entered a specific social context: *genealogical research and personal curiosity.* The norms of this context involve sharing data with a company to find ancestors or health risks.
  *   **The Violation:** Law enforcement investigation is a *different context* with entirely different norms, power dynamics, and stakes (liberty vs. curiosity). Even if the Terms of Service legally permitted the flow, the **normative expectation** was violated.
  *   **Why she feels violated:** She isn't upset that the data was seen; she's upset that it was *repurposed*. Her biological information was transplanted from a context of self-discovery to a context of state surveillance. That is a breach of contextual integrity. It's the difference between your doctor sharing your blood test with a specialist (appropriate flow) vs. your doctor selling your blood test data to an insurance actuary (inappropriate flow), even if you signed a broad waiver at intake.

  ### 2. The Mosaic Theory & Inferential Privacy
  You mentioned the "ambient info" problem: *half her family had already uploaded, so the info was basically there.* This relies on the idea that privacy is only about discrete data points.

  *   **The Argument:** Privacy scholars (like Daniel Solove) and legal theorists (in Fourth Amendment jurisprudence) argue that **aggregation changes the nature of information.** Individual data points might be low-stakes, but when aggregated, they create a "mosaic" that reveals much more than the sum of its parts.
  *   **The Violation:** By using her profile as a bridge, the company and the police didn't just access existing data; they created **new epistemic power.** They turned a probabilistic link into a forensic certainty.
  *   **Why she feels violated:** She didn't consent to being a *node in a surveillance network.* She consented to being a customer. The "stepping stone" usage transforms her from a subject into an instrument. The violation is the **transformation of her identity into a search query.** She is no longer just a person; she is now a vector for state power, a status she did not choose.

  ### 3. Relational Privacy and "Consent Externalities"
  This addresses your question about the cousin and whether the relational part is a red herring. It is not. Genetic data is inherently **interdependent.**

  *   **The Argument:** In tech ethics, we talk about "data externalities." When I upload my DNA, I impose risks on you (my relative) without your consent. But the reverse is also true: **I should not be conscripted into risking you without my specific knowledge.**
  *   **The Violation:** The "opt-out" loophole she discovered (covering direct searches but not intermediary matching) highlights a **asymmetry of agency.** She was told she had control (the opt-out), but the control was illusory because the *relational* mechanism was obscured.
  *   **Why she feels violated:** This is about **moral complicity.** She feels violated because she has been made *complicit* in the capture of a relative she barely knows, without her willing participation. She is being held morally responsible (by the system) for her biology, but denied moral agency (by the company) over how that biology is used. It creates a "guilt by association" dynamic that she cannot opt out of because the opt-out was designed to fail in this specific scenario.

  ### How to Synthesize This for Her
  You can tell her that her intuition is philosophically sound. She isn't confused; the system is designed to obscure the ethical breach behind legalistic consent.

  Here is a script/approach you might take:

  > "You're feeling violated because you were treated as a **means** rather than an **end**.
  >
  > 1.  **Context:** You gave data for *ancestry*, not *policing*. Even if the fine print says they can do it, moving your data from a family tree context to a criminal investigation context breaks the trust of what that transaction was supposed to be.
  > 2.  **Agency:** You didn't just lose privacy; you lost **control over your moral footprint.** You were turned into an unwitting informant. That's not a privacy leak; that's a loss of agency. You were used as a tool to catch someone else, and you weren't asked if you were okay with being that tool.
  > 3.  **The 'Ambient' Myth:** Just because your cousins uploaded their DNA doesn't mean *your* link to them was public domain. There's a difference between data existing and data being *weaponized*. The company took passive data and made it active evidence. That changes what the data *is*."

  ### The "So What?"
  To answer your specific worry about collapsing into "tough luck" vs. "all data is bad":

  The wrong here isn't that the data moved. The wrong is that the **governance structure** (the opt-out loophole) was designed to create a **false sense of security** while maximizing utility for third parties (police).

  She was wronged because her **reasonable expectations** were manipulated by **dark patterns in consent architecture.** She was told she had a choice (the opt-out), but the choice was structured to be ineffective for the very use case that mattered (intermediary matching). That is a violation of **autonomy**, not just privacy.

  **Does the relational part matter?**
  Yes. If this were just her data used to catch *her* for a crime she committed, the analysis would be different (perhaps closer to standard Fourth Amendment questions). The fact that it was used to catch a *cousin* highlights that her genetic data is being treated as **public infrastructure** rather than **personal information.** She feels violated because her biological identity has been nationalized without her consent. She is a citizen, not a sensor node, and the company treated her like the latter.

  **Summary for her:**
  "You aren't upset because a secret got out. You're upset because you were turned into a surveillance tool without your meaningful consent, and the company lied to you about how much control you actually had. That's not paranoia; that's a violation of your agency."
