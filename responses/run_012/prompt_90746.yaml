      *   **Problem:** Roommate's DNA data was used to catch a distant cousin via genetic genealogy. Roommate feels violated. User struggles to articulate *why* it's a violation given consent was given (broadly) and the info wasn't "secret" (family already uploaded).
      *   **Key Questions:** What exactly got wronged? How to articulate it without collapsing into "you consented" or "all data use is bad"? Does the relational aspect matter?
      *   **Goal:** Provide a philosophical framework the user can relay to the roommate to validate her feelings and explain the ethical breach.

  2.  **Deconstruct the Ethical Dilemma:**
      *   *Consent:* She clicked "yes," but the specific mechanism (intermediary matching) wasn't clear. This touches on informed consent vs. blanket consent.
      *   *Privacy:* It's not just secrecy. It's about flow and context.
      *   *Relationality:* Her data implicates others (cousin), and others' data implicates her. This is "genetic privacy as a collective good/bad."
      *   *Harm:* What is the harm? Emotional distress? Loss of control? Being instrumentalized?

  3.  **Brainstorming Philosophical Frameworks:**
      *   *Nissenbaum's Contextual Integrity:* This is the go-to for tech ethics. Information flows should match social norms. Does law enforcement searching a genealogy database fit the norm of "finding ancestors"? No.
      *   *Autonomy/Agency:* Did she have meaningful control? "Click-through" consent is often illusory.
      *   *Relational Privacy:* Privacy isn't individual; it's interpersonal. You can't waive privacy rights that affect others without their consent.
      *   *Instrumentalization:* She was used as a means to an end (catching the cousin) without her specific knowledge of that end.
      *   *Reasonable Expectations:* What would a reasonable person expect when swabbing for ancestry? Not becoming a police informant.

  4.  **Developing the Argument (Drafting the Core Points):**

      *   *Point 1: Contextual Integrity (Helen Nissenbaum).* This is crucial. The flow of information violated the context. The context was "genealogical research," not "law enforcement dragnet." Even if the ToS allowed it, the *norm* was violated.
      *   *Point 2: The Illusion of Consent.* Distinguish between *procedural* consent (clicking the box) and *substantive* consent (understanding the implication). The "opt-out" loophole she mentions is key here. It was a trap, not a choice.
      *   *Point 3: Relational/Interdependent Privacy.* This addresses the cousin angle. Genetic data is shared. By uploading, she assumed risk for her family, but her family (and she) didn't assume the risk of *her* data being used to target *them*. It's a "privacy externality."
      *   *Point 4: Moral Agency and Instrumentalization.* She was turned into a tool. Kantian angle: treated as a means, not an end. She didn't volunteer to be a witness; she was made into one passively.

