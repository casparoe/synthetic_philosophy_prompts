answer: |-
  # Taxonomy of Decision-Theoretic Positions on the Symmetric Prisoner's Dilemma

  ### **Node 1: The Unit of Assessment**
  **Question:** What is the proper object of rational evaluation: the individual's specific action, the collective outcome of the interaction, or the general rule or program the agent instantiates?

  *   **Branch A: The Collective Outcome**
      *   *Leads to Node 2*
  *   **Branch B: The General Rule or Program**
      *   *Leads to Node 3*
  *   **Branch C: The Individual Action**
      *   *Leads to Node 4*

  ---

  ### **Node 2: The Basis of Group Agency** (From Branch A)
  **Question:** Does the agent maximize the joint outcome because they identify as part of a "We," or because they treat the pair as a mechanism for mutual prediction?
  *(Note: This branch isolates Team Reasoning from views that merely calculate joint utility.)*

  *   **Branch A1: Identification as a Group Agent ("We")**
      *   **Leaf: Team Reasoning**
      *   *Awkward Commitment:* Rationality requires dissolving the individual "I" into a group "We" without any prior social contract or communication.
  *   **Branch A2: Mechanism for Prediction**
      *   **Empty Combination**
      *   *Diagnosis:* Incoherent; calculating joint outcomes without group identification reduces to individual act-assessment in a one-shot game.

  ---

  ### **Node 3: The Justification for the Rule** (From Branch B)
  **Question:** Is the rule adopted because it yields the best equilibrium outcome for the pair, or because it satisfies a requirement of universalizability regardless of outcome?

  *   **Branch B1: Best Equilibrium Outcome**
      *   **Leaf: Program Equilibrium**
      *   *Awkward Commitment:* Rationality requires treating human intentions as transparent, executable source code even in the absence of enforced contracts.
  *   **Branch B2: Requirement of Universalizability**
      *   **Leaf: Kantian Universalizability**
      *   *Awkward Commitment:* Rationality requires cooperating even against a known defector if the maxim of cooperation is universalizable, potentially sacrificing utility for consistency.

  ---

  ### **Node 4: The Nature of the Link** (From Branch C)
  **Question:** Does the agent treat her choice as causally independent of the other's, or as diagnostically linked (evidential or logical) to it?

  *   **Branch C1: Causally Independent**
      *   **Leaf: Causal Decision Theory (CDT)**
      *   *Awkward Commitment:* Rationality mandates mutual defection even when facing a perfect copy, leaving guaranteed utility on the table.
  *   **Branch C2: Diagnostically Linked**
      *   *Leads to Node 5*
  *   **Branch C3: Causally Influential**
      *   **Empty Combination**
      *   *Diagnosis:* Incoherent; claims magic or violation of the physical isolation stipulated in the one-shot Prisoner's Dilemma.

  ---

  ### **Node 5: The Scope of the Correlation** (From Branch C2)
  **Question:** Does the diagnostic link rely on the other party being any reliable predictor of your behavior, or specifically a reasoner structurally identical to yourself?

  *   **Branch C2a: Any Reliable Predictor**
      *   **Leaf: Evidential Decision Theory (EDT)**
      *   *Awkward Commitment:* Rationality treats correlations as reasons for action (e.g., washing hands to signal health) even when the action lacks causal power.
  *   **Branch C2b: Structurally Identical Reasoner**
      *   **Leaf: Superrationality**
      *   *Awkward Commitment:* Rationality implies a logical necessity that constrains physical outcomes without causal leverage between isolated agents.

  ***

  ### **Notes on Indistinguishability and Empty Combinations**

  **1. Indistinguishable Leaves in the Symmetric Case**
  While the tree structurally separates **Superrationality**, **Program Equilibrium**, **Team Reasoning**, and **Kantian Universalizability** based on their justifications (Unit of Assessment and Scope), the tree cannot separate their *behavioral output* in the specific case of a one-shot Prisoner's Dilemma against a perfect copy. All four positions prescribe **Cooperate**. They only come apart when the symmetry is broken (e.g., the other party is not a reasoner, code is opaque, or the maxim cannot be universalized).

  **2. Empty Combinations**
  *   **Individual Action + Causal Influence:** Diagnosed as **Incoherent**. In a standard one-shot PD, agents are physically isolated; claiming one's choice causally forces the other's violates the setup's physical constraints.
  *   **Collective Outcome + Prediction Mechanism (without Group Agency):** Diagnosed as **Unattractive/Unstable**. If an agent assesses the joint outcome but retains individual agency (no "We"), they face a dominance argument to defect, rendering the assessment of the joint outcome rationally inert.
