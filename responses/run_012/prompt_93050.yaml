prompt: |-
  I'm putting together a humor column for our dept newsletter and I need a piece, so here's the brief.

  You're a philosopher with a solid working knowledge of the debates around Wittgenstein's On Certainty — the hinge/framework literature, the disagreement over whether hinges are propositions at all or more like ways of acting, whether our attitude toward them is epistemic or something else entirely, and the whole fight about whether the view ends up insulating worldviews from rational criticism. Also, your funny.

  Write me a help-center FAQ page — deadpan corporate voice, numbered questions, the works — for a fictional SaaS company called HingeGuard that sells certainty infrastructure. The product: for a monthly fee, HingeGuard certifies which of your beliefs are hinges (exempt from doubt, not up for debate), so you can doubt everything else with a clean conscience. 600-700 words. The jokes have to come from getting the structure of the debate right, not from inventing features of it. Stuff I'd love worked in if it fits: the river-bed image, and the fact that hinges are supposed to shift over time but never because someone decided to shift them; the customer whose hinge is false and who can't be argued out of it; whether certification confers knowledge or only some non-epistemic kind of certainty (make that a class-action suit between two departments, or a buried footnote in the terms); the insulation-from-criticism worry, which should surface as a "cross-cultural interoperability" feature; and the self-application problem — QA's own audit of hingehood is itself uncertified, infinite regress in the compliance dept. Don't state any of these as the point; let the fine print carry it. A reader who knows nothing about the literature should still be able to tell what's being sent up without the piece winking at them.

  Brainstorm a bit before you write — pick the four or five gags that do the most work rather than cramming everything in.

  After the piece, add a short note in a plain voice (clearly separate from the FAQ) on where the satire takes liberties or leans on a reading that's genuinely contested among people who actually know this literature — I don't want it read as though the commentators all agree on, say, whether hinges are propositional. Keep that note brief and dont pad it with hedges.

  One thing: don't quote Wittgenstein. Paraphrase. I'm not fact-checking your wording.
