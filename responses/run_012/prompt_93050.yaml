answer: |-
  **HingeGuard™ Support Portal**

  **Welcome to HingeGuard Customer Success.**
  Below are answers to frequently asked questions regarding your certainty infrastructure subscription. If your issue is not listed, please submit a ticket. Note that tickets regarding certified propositions are processed under a different SLA than tickets regarding dubitable matters.

  **1. What exactly am I paying for?**
  HingeGuard identifies which of your foundational beliefs function as "hinges." Once certified, these propositions are exempt from doubt, justification, or evidentiary review. This allows your organization to direct all epistemic resources toward non-hinge inquiries without wasting cycles questioning the framework itself. You do not own the hinges; you license the exemption from verifying them.

  **2. Can I update my certified hinges if my worldview changes?**
  No. HingeGuard does not offer manual overrides. While hinges do shift over time, this process is analogous to a riverbed changing course: the water flows over the stone, and eventually, the stone moves. It is not a user setting. Attempting to forcibly swap a hinge via willpower or argument will result in system instability. Migration occurs on a geological timescale based on usage patterns, not administrative decision. Please do not contact Support to request a hinge rotation; if the riverbed shifts, you will be notified.

  **3. What if a certified hinge turns out to be false?**
  Our certification validates function, not truth. A hinge serves as the axis upon which inquiry turns; it is not itself an object of inquiry. Consequently, Customer Success cannot assist in arguing a user out of a certified hinge, even if empirical evidence contradicts it. This is a feature, not a bug. It ensures cross-cultural interoperability by allowing conflicting reality models to coexist without engaging in futile debate. If two clients hold mutually exclusive certified hinges, our firewall prevents interaction rather than attempting resolution.

  **4. Is HingeGuard's own certification process certified?**
  This question touches on our compliance architecture. To avoid infinite regress in the verification chain, the QA department's audit of hingehood is itself uncertified. We accept this as a necessary pragmatic condition of doing business. The compliance team operates with a high degree of confidence, but this confidence is not itself a certified asset. Please refer to Section 14.B regarding foundational trust assumptions.

  **5. Does certification confer knowledge?**
  See Terms of Service, Footnote 7. Certification grants *certainty*, which is distinct from *knowledge*. The former is a mode of acting; the latter is a propositional attitude. By subscribing, you acknowledge that your certainty is non-epistemic. We are not responsible if you claim to "know" your hinges in a court of law.

  ***

  **Note on Satire and Literature**
  This piece leans into specific contested readings of *On Certainty*. First, it treats hinges as propositions that can be listed, whereas many commentators (e.g., Moyal-Sharrock) argue they are non-propositional ways of acting. Second, it presents the "river-bed" metaphor as a slow shift, ignoring debates about whether hinges can change rapidly during radical conceptual upheavals. Third, it satirizes the "insulation from criticism" worry by framing it as a feature, though Wittgensteinians argue hinges are open to revision via experience, just not direct proof. Finally, the epistemic status footnote glosses over the live debate between "entitlement" theorists and "non-epistemic" interpreters regarding whether hinge certainty counts as a form of knowledge.
