  4.  **Writing - First Pass (Mental or Scratchpad):**
      Start with the premise. We write statements that alter reality. But you can't just say words.
      1. The Hereby Test. If you can't put "hereby" in front of the verb, it's not doing anything. "I hereby regret" sounds weird. "I hereby apologize" works.
