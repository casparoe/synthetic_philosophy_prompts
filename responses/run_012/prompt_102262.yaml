  2.  **Drafting - Section by Section:**

      *   *Title:* Statements That Do Things.
      *   *Intro:* Establish the voice. We don't describe reality; we change it. But only if done correctly.
      *   *Rule 1: The "Hereby" Test.* Focus on whether adding "hereby" makes sense. If it describes a feeling, it's not an act.
      *   *Rule 2: Authority/Standing.* You can't apologize if you aren't the one who did it, or resign if you aren't employed. This is a drafting error, not a moral one.
      *   *Rule 3: Effect vs. Act.* Don't confuse making people angry with apologizing. The act is in the words, not the reaction.
      *   *Rule 4: Sincerity vs. Convention.* It doesn't matter if you mean it. It matters if the form is correct.
      *   *Rule 5: Quotation/Scripting.* Don't write apologies in press releases about apologies. That voids the act.
      *   *Conclusion:* The bottom line rule.

  3.  **Drafting - Content & Tone Check:**
      *   *Voice:* Needs to be bureaucratic but precise. "Editorial defect," "Syntax," "Procedure."
