  5.  **Drafting - Actual Text (incorporating constraints):**

      **SECTION 4: STATEMENTS THAT DO THINGS**

      **4.1 General Principle**
      This firm does not describe reality; we alter it. A draft resignation that fails to vacate an office is not a tragic failure of will; it is a syntax error. A apology that fails to absolve liability is not insincere; it is grammatically void. Treat performative verbs as operational machinery. If the machinery does not turn, do not blame the operator. Blame the draft.

      **4.2 The "Hereby" Diagnostic**
      To verify whether a sentence performs an act or merely describes a state of mind, insert the adverb "hereby" before the main verb.
      *   *Correct:* "We **hereby** commit to full reimbursement." (The saying is the doing.)
      *   *Incorrect:* "We **hereby** feel terrible about the incident." (Feelings cannot be enacted by adverb.)
      If the insertion sounds absurd, you are drafting a constative statement disguised as an action. Rewrite until the verb carries the weight of the execution. Do not rely on tone to perform labor assigned to vocabulary.

      **4.3 Standing and Procedure**
      An utterance requires a valid issuer. A spokesperson cannot resign on behalf of a CEO unless the bylaws explicitly delegate the power of resignation to Communications. If the speaker lacks the institutional standing to execute the act, the statement is not a lie; it is null. It is the editorial equivalent of signing a check from an empty account.
      *   *Defect:* "I apologize for the data breach," said by a junior associate regarding a board-level decision.
      *   *Fix:* Either secure the proper signatory or rephrase as a report ("The Board apologizes"). Do not attempt to conjure authority through emphatic punctuation.

      **4.4 Illocution vs. Perlocution**
      Do not confuse what the statement *does* with what the statement *causes*. An apology is successful when the words satisfy the conventional procedure for apologizing, regardless of whether the victim feels forgiven. If the client requires the audience to feel comforted, that is a marketing objective, not a linguistic one.
      *   *Rule:* Draft for felicity, not for effect. If the procedure is complete but the public remains angry, the draft was correct, and the public is non-compliant. Do not add adjectives to compensate for audience recalcitrance.

      **4.5 Sincerity Conditions**
      Clients often insist that a statement must reflect their internal remorse. This is irrelevant to the validity of the act. A promise is binding because of the convention of promising, not the warmth of the promisor's heart. However, be advised: if the speaker is known to be deceptive, the act may be abused, but it remains an act.
      *   *Guidance:* Do not draft clauses asserting sincerity ("We truly mean this"). This invites scrutiny on psychological states rather than contractual obligations. Stick to the commitment.

      **4.6 Etiolation and Embedding**
      A performative uttered on stage, in a press release about a statement, or within quotation marks is stripped of its force. This is etiolation.
      *   *Void:* "The CEO stated, 'I apologize.'" (This reports an apology; it does not apologize.)
      *   *Valid:* "The CEO apologizes." (This executes the apology.)
      Never embed a performative verb within a narrative frame unless the goal is to describe the event rather than enact it. If you quote the apology, you have converted a transaction into a story. Ensure the client understands they are paying for a transaction.

      **4.7 The Bottom Line**
      If you cannot sign the document yourself and make the change happen immediately upon signing, do not write it as something you are doing now.

