answer: |-
  Your predicament is a precise map of the historical tension between **Occasionalism** (only God acts) and **Concurrentism** (God and creatures act together, but in different ways). Your intuitions are oscillating because you are trying to force a univocal definition of "cause" onto phenomena that operate at different ontological levels.

  To save the maximum number of your verdicts, you need a principle of **Domain-Relative Causal Salience**, underpinned by **Non-Competitive Causality**.

  ### The Principle: Domain-Relative Causal Salience

  A causal claim "C caused E" is true if and only if:
  1.  **Dependency:** E counterfactually depends on C (if C had not occurred, E would not have occurred in that way).
  2.  **Salience:** C is the salient difference-maker within the relevant **domain of discourse** (Physical, Agential, Normative, or Ontological).
  3.  **Mechanism/Power:** C involves a transfer of energy, information, or volition, *unless* the domain is Normative (omissions).

  This principle explains your specific verdicts:
  *   **Fire/Virus/Surgeon (Physical/Biological):** True. There is energy transfer and counterfactual dependence.
  *   **Decision/Arm (Agential):** True. Distinct domain (volition), but satisfies dependency and "power" (will).
  *   **Shuffle/Ace (Probabilistic):** False. Fails the **Mechanism** condition. The shuffle randomizes; it does not deterministically produce the ace on top. The ace's position is a *state* left over, not a *product* of the shuffle's specific motion.
  *   **Guardrail/Death (Normative):** True. Fits the **Omission** clause. The domain is safety/norms; the absence is a salient difference-maker.
  *   **God/Fire (Ontological):** True. But this is the **Ontological** domain. God is not *a* cause among causes; He is the ground of causality itself.

  ### Predictions for Your Test Cases

  Applying **Domain-Relative Causal Salience**:

  1.  **The thermostat switching on the furnace:**
      *   **Verdict:** **True.**
      *   **Reasoning:** This is a cybernetic/informational cause. The thermostat transfers information (temperature data) which triggers a mechanism. It fits the "Rock in the road" model but with embedded teleology. It is salient in the domain of control systems.

  2.  **A hypnotized subject's arm rising:**
      *   **Verdict:** **True (Physiological/Psychological), False (Agential).**
      *   **Reasoning:** Here your principle must split the verdict. In the *physical/psychological* domain, the suggestion caused the rise (Dependency + Mechanism). However, in the *Agential* domain (your "different register" for deciding to raise an arm), it is False. The subject did not *do* it in the sense of volition; it happened *to* them. This preserves your distinction between "my deciding" and mere motion.

  3.  **The moon raising the tide:**
      *   **Verdict:** **True.**
      *   **Reasoning:** Standard physical causation (gravitational interaction). It satisfies Dependency and Mechanism. To deny this would force you to deny the fire burning the cotton, as both are regularities of matter.

  ### The Hard Choice: Fire or God?

  You ask: *If the principle that saves the most of my verdicts forces one out, which should go: that the fire did it, or that only God does?*

  **You must keep "The fire did it."**

  Here is why Occasionalism ("Only God does") fails your specific set of verdicts:

  1.  **The Shuffle Problem:** If Occasionalism is true, the Fire and the Shuffle are ontologically identical: both are merely occasions for God's action. There is no *created* power in the fire that is absent in the shuffle. Yet, you insist the Fire claim is **True** and the Shuffle claim is **False**.
      *   To maintain this distinction, you must admit the Fire has a *nature* or *power* that makes it a salient cause, which the Shuffle lacks.
      *   If the Fire has a nature/power, Occasionalism is false.

  2.  **The Surgeon Problem:** If "Only God does," then the surgeon's slip is merely an occasion for God to cause bleeding. This renders medical responsibility and physical explanation unintelligible. It collapses the "Surgeon" verdict into the "Shuffle" verdict (both are just sequences of events God utilizes). Your intuition resists this collapse.

  3.  **The Solution (Non-Competitive Causality):**
      You do not need to choose between Fire and God if you reject the assumption that they compete for the same "slot" of causality.
      *   **Fire:** Operates at the level of *secondary causes* (events within the world).
      *   **God:** Operates at the level of *primary cause* (the existence and power of the world itself).
      *   **Analogy:** A writer writes a novel (Primary Cause). The detective in the novel solves the crime (Secondary Cause). Did the detective solve the crime? **True.** Did the writer write the solution? **True.** They are not competing; the writer's causality enables the detective's causality.

  ### Conclusion

  Your instability comes from trying to read the "God" claim as if it were another "Fire" claim. It is not.

  *   **Keep:** "The fire burned the cotton." (True at the physical level).
  *   **Keep:** "God caused the fire to burn." (True at the ontological level).
  *   **Reject:** The idea that these are the *same sense* of cause.

  If you adopt **Concurrentism** (Secondary Causality grounded in Primary Causality), you save the Fire, the Surgeon, the Decision, and the Guardrail. You only lose the strict Occasionalist intuition that created things are "dead" instruments. But since you already treat the Shuffle as "dead" and the Fire as "alive," you have already implicitly rejected Occasionalism in your practice. Your verdicts demand that creatures have real, derived causal power.
