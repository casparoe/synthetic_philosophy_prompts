answer: |-
  ### Brainstorming and Conceptual Commitments

  Before adjudicating, I need to be precise about what work each principle is doing.

  The **All-Affected-Interests (AAI)** principle is fundamentally consequentialist in its democratic logic. It is committed to the idea that legitimacy derives from the protection of well-being. If a decision alters the trajectory of your life, democratic fairness demands you have a mechanism to steer that trajectory. Its intuitive appeal is moral symmetry: it feels unjust to bear costs without having a voice. However, its conceptual weakness is indeterminacy. "Interests" are porous; almost any significant policy ripples outward. If taken literally, AAI risks dissolving the demos into a global mass, making collective agency impossible.

  The **All-Subjected Principle (ASP)** is deontological and relational. It is committed to the idea that legitimacy derives from freedom from domination. Democracy is the remedy for coercion; therefore, only those coerced need the remedy. Its intuitive appeal is political reciprocity: if I must obey the law, I must help make it. It draws a sharper boundary around the state's jurisdiction. Its weakness is moral blind spots: it can legitimize a polity that ruthlessly exploits outsiders, provided it treats insiders democratically.

  Regarding your colleague's distinction between **Authorization** (who decides) and **Concern** (whose interests count):
  *   **AAI** tends to collapse this distinction. If your interests are affected, you are granted authorization. It assumes the only way to ensure concern is through direct authorization.
  *   **ASP** respects the distinction. It argues that authorization is reserved for those subject to coercive authority (to ensure freedom), but the polity may still have moral obligations of *concern* toward affected outsiders (human rights, comity) without granting them votes. ASP suggests we can owe duties to people without making them citizens.

  ### Case Comparisons

  **(a) Long-term resident non-citizens**
  *   **AAI:** Clearly includes them. Their lives are shaped by local laws, taxes, and schools. Exclusion is a violation of the principle.
  *   **ASP:** Also includes them. They are subject to the coercive power of the state (police, courts, taxation). To exclude them is to subject them to rule without representation.
  *   **Strain:** Both agree here, but for different reasons. ASP is slightly more robust institutionally because it ties membership to legal jurisdiction rather than the vaguer metric of "affected interests."

  **(b) Cross-border externalities (emissions/financial decisions)**
  *   **AAI:** Demands inclusion. If Country A's emissions drown Country B, Country B's citizens are affected and should have a say in Country A's energy policy. This implies a transnational or global demos.
  *   **ASP:** Excludes them. Citizens of Country B are not subject to Country A's laws. They cannot vote in Country A's elections.
  *   **Strain:** This is AAI's strongest case and ASP's weakest. ASP risks legitimizing "democratic imperialism," where a demos votes itself benefits at the expense of outsiders. However, AAI strains practicality: does a Bangladeshi farmer get a vote in US elections? If so, which elections? Energy only? All of them?

  **(c) Future generations**
  *   **AAI:** They are profoundly affected. But they cannot exercise agency. AAI requires a proxy mechanism (guardians, ombudsmen) to represent their affected interests.
  *   **ASP:** They are not currently subject to coercion. They fall outside the demos entirely.
  *   **Strain:** Both struggle with agency. ASP is more honest here: it admits future people are not members. AAI forces a category error (members who cannot act). However, AAI captures the moral urgency of climate change better.

  **(d) Children**
  *   **AAI:** They are affected. But like future generations, they lack capacity. AAI usually accepts a competence threshold, excluding them from authorization but demanding high concern.
  *   **ASP:** They are subject to law (and parental authority). Yet, they are typically excluded from voting.
  *   **Strain:** Both principles require a supplementary "competence" clause. Neither solves the boundary of age on its own. ASP handles this slightly better by framing voting as a function of political agency within a coercive order, which implies maturity.

  **(e) Hard Case: Secession and Border Drawing**
  *   *The Case:* A wealthy region wants to secede from a poorer state to keep its tax revenue. Who decides whether the secession is permitted? Only the region (the secessionists)? The whole state? Or those affected by the economic collapse of the rump state?
  *   **AAI:** The citizens of the remaining state are deeply affected by the loss of the tax base. They should have a veto or a strong say. The boundary of the demos for *this decision* expands to the whole existing state.
  *   **ASP:** Who is subject to the authority deciding secession? Usually, constitutional law dictates this. If the constitution says "national referendum," the whole state votes. If it says "local right to self-determination," only the region votes.
  *   **Strain:** This reveals the circularity most sharply. To apply ASP, we need to know the jurisdiction of the authority deciding the secession. But the secession *changes* the jurisdiction. AAI is clearer morally (the rump state's interests matter), but ASP is clearer legally (we follow the existing constitutional order). AAI risks endless regression (who is affected by the boundary change? Neighbors? Trading partners?).

  ### The Circularity Problem

  You ask if the presupposition of a demos to define the demos is fatal.

  **The Problem:** To apply AAI, we must know which decisions are being made to see who is affected. But who decides which decisions are on the agenda? To apply ASP, we must know the jurisdiction of the coercive power. But jurisdiction is defined by the polity itself.

  **Assessment:** This circularity is **benign**, not fatal. It is hermeneutic, not logical. We do not constitute a demos *ex nihilo*. We start with provisional, historical boundaries (existing states, communities) and apply the principles to refine them.
  *   **ASP** handles this better. It accepts the existing coercive order as the starting point and demands democratization *within* those bounds. It treats the boundary as a institutional fact to be legitimized, rather than a moral variable to be calculated anew every day.
  *   **AAI** suffers more from circularity because "affectedness" is fluid. Without a pre-existing authority to determine *which* effects count (direct vs. indirect), the principle cannot get off the ground.

  ### Verdict and Confidence

  **Judgment:** I find the **All-Subjected Principle (ASP)** more defensible as a foundational rule for constituting the demos, though it requires the **All-Affected-Interests** principle as a moral constraint on external policy.

  **Reasoning:**
  Democracy is a system of *collective self-government*, not merely a system of *interest protection*. ASP captures the specific value of political autonomy: the right to live under laws you have authored. It provides a stable, institutional boundary that makes agency possible. AAI, while morally attractive, dissolves the boundary of agency. If everyone affected by US monetary policy votes on the Federal Reserve, the "demos" becomes unmanageable, and the capacity for decisive action evaporates.

  Furthermore, ASP respects your colleague's distinction. It allows us to say: "You do not have a vote here (Authorization), but our government is morally forbidden from harming you (Concern)." AAI conflates these, insisting that the only way to protect interests is through voting rights, which leads to institutional bloating.

  **Confidence:** Moderate-High (75%).
  I am confident that ASP is superior for *institutional design*. I am less confident that it is sufficient for *global justice*.

  **What Would Change My Mind:**
  I would reverse my verdict if convinced that **global coercive structures** are now so dense that the "state" is no longer the primary site of subjection. If international financial markets, climate treaties, and digital platforms exert coercive power comparable to domestic law, then the "subjected" community is already global. In that world, ASP collapses into AAI (or a global ASP), making my defense of the bounded state obsolete.

  **Where I Am Most Likely Mistaken:**
  I may be underestimating the **normative power of affectedness**. There is a deep intuition that causing harm creates a debt of membership, not just a duty of restraint. If a polity's decisions systematically devastate a neighbor, denying them a vote feels like a continuation of that domination, even if they aren't legally "subject." My reliance on the Authorization/Concern distinction might be too neat; sometimes, the only way to ensure genuine concern *is* authorization. If I am wrong about the separability of those two concepts, AAI becomes much stronger.
