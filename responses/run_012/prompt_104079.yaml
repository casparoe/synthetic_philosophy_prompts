      *   **Constraint:** Reason from principles, not literature survey. Brainstorm first.

  2.  **Brainstorming & Conceptual Clarification:**
      *   *All-Affected-Interests (AAI):*
          *   *Commitment:* Democracy is about protecting interests. If a decision changes your well-being, you need a voice to protect it.
          *   *Work:* Expands the demos to match the scope of consequences. Globalizes democracy potentially.
          *   *Appeal:* Intuitive fairness. "No taxation without representation" extends to "No impact without representation."
          *   *Risk:* "Interests" is vague. Almost everything affects everyone (butterfly effect). Could lead to an unworkably large demos (the "all-affected" becomes "all-everyone"). Collapses authorization and concern?
      *   *All-Subjected (ASP):*
          *   *Commitment:* Democracy is about legitimacy of coercion. If you must obey the law, you must have a hand in making it.
          *   *Work:* Ties the demos to the jurisdiction of the state. Bounded, institutional.
          *   *Appeal:* Political autonomy. Freedom from arbitrary rule. Matches the reality of state power.
          *   *Risk:* Excludes those affected but not legally bound (e.g., foreigners impacted by pollution). Could legitimize tyranny over non-members.
      *   *Authorization vs. Concern:*
          *   Authorization = Voting rights/Constituency.
          *   Concern = Moral weight of interests in deliberation.
          *   *AAI:* Tends to collapse them. If your interest is affected, you should authorize.
          *   *ASP:* Keeps them distinct? You authorize if subjected. But the state should still *concern* itself with affected outsiders (human rights, comity), even if they don't vote.
      *   *Circularity:* To decide who is affected/subjected, who decides the scope of the decision? A pre-political group must apply the principle.
          *   *AAI:* Needs to know the decision's scope to know who is affected. But who decides the decision?
          *   *ASP:* Needs to know the jurisdiction. But jurisdiction is defined by the state, which is defined by the demos.
          *   *Verdict on Circularity:* It's likely benign/practical, not logical fatalism. We start with provisional boundaries and refine.

