  I'm a retired geophysicist—spent 35 years measuring rocks, then retired and went back to school for an MA in philosophy. I'm now putting together an application for a small six-month fellowship and I need a two-page research propasal. My half-formed idea is about the doomsday argument. The usual version says: if you pick a random human from all humans who will ever live, your birth rank is probably somewhere in the middle, so total human number probably isn't gigantic, so doom is probably relatively soon. I keep tripping over the sampling picture. As a scientist, sampling a person from a set of all observers who ever exist feels different from sampling an observer-moment from a process that is still unfolding—like sampling a fossil from a completed stratum versus sampling a tick of a clock that may or may not stop. Maybe the argument equivocates between these. There's also the question of whether the sample is drawn with or without replacement, and whether the relevant reference class is people, person-stages, or civilizations. I want to split those apart and ask whether the doomsday conclusion survives under each reading, and whether the usual replies—self-indication, self-sampling, and so on—actually depend on the split. Turn this into a proposal with a precise statement of the question, why the existing positions leave it open, the method (what I would actually do, month by month for six months), why this sampling-focused angle rather than just another survey of the standard replies, what a result would look like, what would count as the project failing, and an honest assessment of what could make it too big for six months. Don't bother with citations or a bibliography—I'll add those. And please separate what's settled from what's genuinely contested among people who know the doomsday literature; don't present a contested view as the consensus. I'm new to this and I'd rather not embarass myself.
