      *   *Claim 3: By the independence axiom (a.k.a. the sure-thing principle) they cancel out...*
          *   **Fact Check:** This is the core theoretical mechanism. Removing the common 0.89 probability of $1M from 1A/1B transforms them into 2A/2B.
          *   **Nuance:** "Sure-thing principle" is Savage's term, "Independence Axiom" is von Neumann-Morgenstern (vNM). They are related but technically distinct in formulation (Savage vs. vNM). Using them interchangeably is a common PhD-level slip-up but often tolerated.
          *   **Verdict:** Substantively right, terminologically slightly loose.

      *   *Claim 4: Taking 1A and 2B therefore contradicts expected utility theory...*
          *   **Fact Check:** Yes, it violates the Independence Axiom of vNM EUT.
