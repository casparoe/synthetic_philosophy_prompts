          *   **Fact Check:** **Major Error.** EUT *allows* for risk aversion via concave utility functions. It does *not* assume maximization of expected *value* (dollars), but expected *utility*.
          *   **Verdict:** Flat wrong. This confuses Risk Neutrality with Expected Utility Theory.

      *   *Claim 7: ...and since expected utility theory assumes we maximise expected value, it's simply false as a description of how people choose.*
