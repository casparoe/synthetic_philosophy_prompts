prompt: |-
  I'm a self-taught programmer with no philosophy background, but I read Gödel Escher Bach years ago and one part has been stuck in my head ever since, the bit about where meaning lives. As I remember it Hofstadter splits a message into three layers. The frame message is the stuff that tells you this thing is a message at all and that someone meant it to be read — for the Voyager record, it's the fact that the disc is an obviously manufactured object with a cover on it, so any alien who finds it knows it isn't just a rock. The outer message is the instructions for how to decode the thing — the diagrams on the cover, the hydrogen line as a clock, the pulsar map, that kind of stuff. The inner message is the actual content you get once you've decoded it, the music and the pictures. And his big claim, as I recall, is that meaning isn't sitting in any one of those three places, it's in the interaction between them and whatever receiver is doing the decoding — a message only means something to a system that already has the right internal structure to be triggered by it. I might be mangling some of this so correct me where I'm off.

  I've spent about fifteen years working with file formats and network protocols. Magic numbers, file headers, MIME types, chunked formats, codecs, packet captures, TLV encodings, the works. I've wrote parsers from scratch and debugged other peoples. So here's what I want. Take Hofstadter's three-layer thing and his claim about where meaning lives and restate it as faithfully as you can in my vocabulary. Use the real terms, don't dumb it down.

  Then give me the residue report. Which parts map cleanly onto magic bytes and headers and decoders? Which parts only map if I squint? And what's left over — what does Hofstadter say that I can't say at all in file-format terms?

  Two things I'm especially curious about. First: in a self-describing format the "this is a message" signal and the "here's how to decode me" signal are both just bytes in the same stream, sitting right there in the header. But for the Voyager record, and for DNA, the frame seems to live outside the message entirely — it's the cell's machinery, or the fact that the disc is metal. Is that a real structural difference or am I just confusing levels? Second: file formats have specs and canonical decoders, so the regress of "who decodes the decoder" gets cut by convention, and the answer is just "somebody wrote the spec." Hofstadter seems to think you can't cut it that way, that the receiver has to already share alot of structure with the sender before any of it works. Does that survive translation, or does the file-format picture make his point look like it was really just the observation that decoders are built by people who already know the format?

  And then the honest part. If something doesn't survive the translation, is that because my vocabulary is missing something real, or because Hofstadter's three-way distinction is doing less work than it sounds like? I'd rather you tell me the second if that's what you think.
