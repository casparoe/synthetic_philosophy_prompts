answer: |-
  ### Family Resemblance Scores (0 = Essentialist, 10 = Pure Family Resemblance)

  *   **Game:** 9
  *   **Number:** 0
  *   **Art:** 10
  *   **Species (Biology):** 5
  *   **Fish:** 8
  *   **Disease:** 6
  *   **Planet:** 1
  *   **Sport:** 7
  *   **Sandwich:** 4
  *   **Language:** 8
  *   **Life:** 7
  *   **Personhood:** 9
  *   **Justice:** 9

  ***

  ### Concept Analysis

  **1. Game**
  *   **Messiness (World vs. Heads):** Mostly in our heads. The activities themselves are diverse, but the category "game" is a human invention for grouping them. There is no physical law preventing a definition, but any definition we make excludes things we intuitively call games (e.g., solitaire has no competition; ring-around-the-rosie has no winning).
  *   **Practical Stakes:** Low. Unless you are dealing with gambling laws or Olympic funding, it doesn't matter much whether "tag" is officially a game.

  **2. Number**
  *   **Messiness (World vs. Heads):** In our heads (historically), but resolved. We invented axioms (Peano, Set Theory) to rigidify this. The messiness was epistemic (we didn't understand zero or negatives yet), not ontological.
  *   **Practical Stakes:** Extremely High. If "number" were a family resemblance concept, engineering and physics would collapse. We need strict definitions here.

  **3. Art**
  *   **Messiness (World vs. Heads):** In our heads/culture. A urinal is physically identical whether in a bathroom or a museum. The "art" status is conferred by institutional context and interpretation, not physical properties.
  *   **Practical Stakes:** Medium. Matters for tax exemptions, customs duties (art vs. decor), censorship laws, and funding grants.

  **4. Species (Biology)**
  *   **Messiness (World vs. Heads):** Both. The world presents continuous evolution (ring species, hybrids), making sharp lines ontologically difficult. Our heads try to impose discrete boxes on a continuum for practical classification.
  *   **Practical Stakes:** High. Conservation laws protect "species." If a population isn't a distinct species, it might not get protected status, leading to extinction.

  **5. Fish**
  *   **Messiness (World vs. Heads):** In the world (phylogeny). "Fish" is a paraphyletic group; it excludes tetrapods (land animals) even though they evolved from fish. The evolutionary tree doesn't match the word.
  *   **Practical Stakes:** Low/Medium. Matters for biology class and seafood labeling, but rarely for law. Scientists mostly avoid the term "fish" in technical contexts now.

  **6. Disease**
  *   **Messiness (World vs. Heads):** Both. Pathogens are real (world), but "disease" implies a value judgment about "normal function" vs. "harm" (heads). Is homosexuality a disease? Is aging? Depends on social norms.
  *   **Practical Stakes:** Very High. Insurance coverage, disability benefits, quarantine laws, and stigma depend entirely on this classification.

  **7. Planet**
  *   **Messiness (World vs. Heads):** In our heads. The objects exist objectively, but the category "planet" was explicitly redefined by a vote (IAU 2006) to solve the messiness. We chose essentialism over resemblance.
  *   **Practical Stakes:** Medium. Affects textbooks, public interest, and mission funding (New Horizons vs. Pluto flyby), but doesn't change orbital mechanics.

  **8. Sport**
  *   **Messiness (World vs. Heads):** In our heads. Is chess a sport? Is esports? It depends on cultural valuation of "physical exertion" vs. "competition." The activities don't change, our labeling does.
  *   **Practical Stakes:** Medium. Olympic inclusion, visa classifications for athletes, and government funding rely on this.

  **9. Sandwich**
  *   **Messiness (World vs. Heads):** In our heads. It's purely conventional. Is a hot dog a sandwich? Is an open-faced sandwich a sandwich? The bread and filling exist objectively; the category is cultural.
  *   **Practical Stakes:** Low (unless you are the UK VAT office). In 2006, a court had to decide if a filled croissant was a sandwich for tax purposes. It matters for sales tax.

  **10. Language**
  *   **Messiness (World vs. Heads):** Both. Dialects exist on a continuum in the world (mutual intelligibility fades gradually), but political boundaries in our heads draw sharp lines (Swedish vs. Norwegian).
  *   **Practical Stakes:** High. Education policy, national identity, minority rights, and official government communications depend on what counts as a "language."

  **11. Life (Extra)**
  *   **Messiness (World vs. Heads):** In the world. Viruses replicate but don't metabolize. Prions are proteins that replicate. The boundary between chemistry and biology is fuzzy in nature.
  *   **Practical Stakes:** High. Astrobiology (searching for aliens), AI rights (if digital life emerges), and medical definitions of death.

  **12. Personhood (Extra)**
  *   **Messiness (World vs. Heads):** In our heads. Biologically, a fetus is human. Legally/morally, is it a "person"? Corporations are "persons" in law. The biology is clear; the moral status is the mess.
  *   **Practical Stakes:** Extreme. Abortion law, animal rights, AI regulation, and corporate liability hinge on this.

  **13. Justice (Extra)**
  *   **Messiness (World vs. Heads):** In our heads. There is no physical particle of "justice." It is a normative concept built on overlapping intuitions about fairness, desert, and rights.
  *   **Practical Stakes:** Extreme. Legal systems, distribution of resources, and punishment are all based on this concept.

  ***

  ### The Verdict

  **Would I bet on a hidden real definition?**
  I would bet money on **Species** and **Disease** having discoverable "real" definitions (or at least much tighter naturalistic accounts). Biology and medicine are converging on genetic and homeostatic criteria that could reduce the fuzziness. I would *not* bet on **Art**, **Game**, or **Justice**. These are inherently human practices tied to culture and context; finding a "real" definition would likely break the concept rather than fix it.

  **Does "Family Resemblance" explain anything?**
  It is not just a fancy way of saying "I know it when I see it." "I know it when I see it" is an endpoint—it admits defeat. "Family Resemblance" is a *mechanism*. It explains *how* we learn and use the word without a definition (by seeing overlapping examples) and predicts *where* boundary disputes will happen (where the overlaps thin out).

  If you treat "Art" as an essentialist concept, you will fail to understand why Duchamp's urinal counts. If you treat it as a family resemblance concept, you understand that the "art" status comes from its relation to other art-objects (context, history, intention), not a checklist of properties. It shifts the philosophical work from "What is X?" to "How do we use X?" which is usually where the actual answers are.
