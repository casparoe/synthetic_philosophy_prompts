prompt: |-
  I am preparing a session for a graduate seminar on the theory of punishment, and I want to work through one case in detail before I put it to the students. The case is the federal practice of acquitted-conduct sentencing. The salient facts, which you should treat as given rather than look up: a defendant is tried on two counts; the jury convicts on the first and acquits on the second; at sentencing, the judge, applying the relevant-conduct provisions of the federal sentencing guidelines, finds by a preponderance of the evidence that the defendant did in fact commit the conduct underlying the acquitted count, and increases the sentence on the count of conviction accordingly. The Supreme Court upheld this practice in United States v. Watts, decided in 1997. The Sentencing Commission has since revisited the matter, and the practice has drawn sustained criticism from judges and commentators on the ground that it punishes a person, or lengthens his punishment, for conduct of which a jury found him not guilty.

  Analyze the practice twice, once from inside retributivism and once from inside consequentialism. I do not want a survey of the standard positions. I want you to say, for each theory, what its central commitment implies about counting acquitted conduct at sentencing, which features of the practice the theory explains naturally and which it strains to explain, and whether the theory's verdict changes when the details change: the strength of the evidence at the sentencing hearing, the size of the enhancement relative to the base sentence, whether the acquitted conduct is a lesser included offense of the count of conviction, and whether the defendant pleaded guilty rather than standing trial.

  Then reverse the direction and ask what the practice shows about the two theories. A retributivist might reason that what a person deserves depends on what he actually did, not on what a jury was able to establish beyond a reasonable doubt, which suggests that retributivism should be untroubled by the practice, or even welcome it. Yet many retributivists object to it, typically on grounds of proportionality or of the moral significance of the criminal verdict. Is that objection internal to retributivism, or is it a procedural constraint imported from outside the theory, and if the latter, does retributivism as a theory of punishment have the resources to generate it on its own? A consequentialist, by contrast, should find the practice easy to justify, since more accurate information about what the defendant did and what he is likely to do should improve the deterrence and incapacitation calculations. If the practice is nonetheless intuitively objectionable, does that count against consequentialism, or does it show only that the consequentialist has been undercounting a cost the theory can perfectly well accommodate, such as the damage to the perceived legitimacy of the jury, the incentive it creates for prosecutors to overcharge, or the erosion of the finality of an acquittal?

  I am especially interested in whether the case forces a distinction within retributivism between desert understood as actual culpability and desert understood as culpability attributable through a legitimate procedure, and whether that distinction is stable under pressure. If it is not stable, say what has to give. Where a theory is genuinely silent at the point the case presses on it, say so rather than manufacturing an answer. Conclude by saying which theory, if either, comes out of the case better than it went in, and describe what the case would have to look like for that verdict to reverse.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Federal acquitted-conduct sentencing (post-*Watts*).
      *   **Task:** Analyze the practice through the lens of Retributivism and Consequentialism, then reverse the direction (what the practice shows about the theories).
      *   **Specific Constraints:**
          *   Do not survey standard positions; dig into central commitments.
          *   Address specific variable details (evidence strength, enhancement size, lesser included offense, guilty plea).
          *   Address the "Desert vs. Procedure" distinction within Retributivism.
          *   Address the "Legitimacy/Cost" accommodation within Consequentialism.
          *   Be honest about theoretical silence.
          *   Conclude with a verdict on which theory fares better and what would reverse that verdict.
      *   **Tone:** Graduate seminar level (philosophically rigorous, nuanced, precise).
      *   **Facts:** Treat the provided facts as given (Convict Count 1, Acquit Count 2, Judge finds Count 2 conduct by preponderance, enhances sentence, *Watts* upheld, criticism exists).

  2.  **Deconstruct the Case (Acquitted-Conduct Sentencing):**
      *   *Core Tension:* Jury says "Not Guilty" (BRD standard) vs. Judge says "Did it" (Preponderance standard) for sentencing purposes.
      *   *Legal Mechanism:* Relevant Conduct Guidelines (USSG).
      *   *Philosophical Stakes:* Meaning of acquittal, meaning of desert, role of procedure in defining guilt, utility vs. rights.

  3.  **Drafting - Section 1: Retributivism:**
      *   *Central Commitment:* Punishment must be proportionate to culpable wrongdoing (Desert).
      *   *Implication for Acquitted Conduct:*
          *   *Pro-Retrributivist View:* If the defendant *actually* did it, they deserve punishment for it. The jury's acquittal is epistemic (failure of proof), not ontological (innocence). Therefore, ignoring actual conduct under-punishes desert.
          *   *Anti-Retrributivist View:* Desert is not just metaphysical; it's institutional. The state's right to punish is conditioned on a legitimate finding of guilt. An acquittal creates a moral barrier.
      *   *Features Explained/Strained:*
          *   *Explains:* Why we punish the convicted count based on severity.
          *   *Strains:* Why an acquittal matters at all if the conduct was real.
      *   *Variable Details:*
          *   *Evidence Strength:* Retributivism cares about *truth*. If evidence is strong at sentencing, desert is higher. If weak, desert is lower. The BRD standard matters less than the actual probability of guilt.
          *   *Enhancement Size:* Proportionality is key. A massive enhancement for acquitted conduct might violate the "cardinality" of the crime of conviction.
          *   *Lesser Included:* If acquitted of the lesser, but convicted of the greater, the logic holds (you did the greater). If acquitted of the greater, convicted of lesser, enhancing based on the greater is trickier (implies you did the greater without the label).
          *   *Guilty Plea:* Waiver of trial rights. Retributivism might care less about procedure here, as the defendant admitted guilt, but the acquittal on the other count still stands as a state action.
      *   *The "Desert vs. Procedure" Distinction:*
          *   *Actual Culpability:* Metaphysical desert.
          *   *Attributable Culpability:* Institutional desert.
          *   *Stability:* This is the pressure point. If Retributivism is purely about "giving what is due," procedure is instrumental. If it's about "state authority to censure," procedure is constitutive. The case pressures the theory to choose. If it chooses "Actual," it risks becoming utilitarian (maximizing correct outcomes). If it chooses "Attributable," it risks formalism (ignoring truth).
          *   *Silence:* Pure retributivism might be silent on *procedure* unless it incorporates a rights-based constraint (which leans toward hybrid theory).

  4.  **Drafting - Section 2: Consequentialism:**
      *   *Central Commitment:* Punishment is justified by future good (deterrence, incapacitation, rehabilitation).
      *   *Implication for Acquitted Conduct:*
          *   *Pro-Consequentialist View:* More info = better calibration. If he's dangerous (did the acquitted crime), incapacitate him longer. Deterrence requires matching penalty to harm caused, regardless of procedural quirks.
          *   *Anti-Consequentialist View:* Systemic costs. Undermining the jury reduces legitimacy, reducing general deterrence. Overcharging incentives waste resources.
      *   *Features Explained/Strained:*
          *   *Explains:* Why we want accurate risk assessment.
          *   *Strains:* Why we respect the acquittal at all (if the guy is dangerous, why let the jury stop us?).
      *   *Variable Details:*
          *   *Evidence Strength:* Crucial for risk assessment. Preponderance might be enough for "likely dangerous."
          *   *Enhancement Size:* Marginal utility. Does extra time deter more? Or is it wasteful cruelty?
          *   *Lesser Included:* Irrelevant to risk. Danger is danger.
          *   *Guilty Plea:* Efficiency gain. Saves trial costs.
      *   *Intuitive Objection:* The "Legitimacy Cost." Consequentialism can accommodate this *if* the cost is quantifiable. If the practice erodes faith in the system enough to increase crime long-term, Consequentialism forbids it. If not, Consequentialism allows it.

  5.  **Drafting - Section 3: Reverse Direction (What the Case Shows About the Theories):**
      *   *Retributivism:*
          *   The objection (procedural bar) suggests Retributivism isn't just about "cosmic desert." It's about *political* legitimacy.
          *   *Internal vs. Imported:* Is the procedural constraint internal? A "rights-based retributivism" (Moore vs. Husak) might say the state forfeits the right to punish if it fails the procedural test.
          *   *Distinction Stability:* The distinction between "Actual" and "Attributable" desert is unstable under *Watts*. If you punish for acquitted conduct, you are treating "Attributable" as secondary to "Actual." This pushes Retributivism toward a hybrid view (Desert + Rights). If it refuses to hybridize, it must admit that procedure is merely epistemic, which makes the acquittal morally weightless.
      *   *Consequentialism:*
          *   The intuition that it's *wrong* suggests Consequentialists often undercount "process values."
          *   Can it accommodate? Yes, by counting "rule of law" as a good. But this risks becoming rule-worship (deontology in disguise).
          *   If the practice is intuitively objectionable, it counts against Consequentialism *only if* the theory cannot explain the objection without ad hoc adjustments.

  6.  **Drafting - Conclusion:**
      *   *Winner:* Retributivism comes out slightly better *if* it accepts the procedural constraint as constitutive of desert. Why? Because it captures the moral weight of the acquittal better than Consequentialism (which sees it as a mere data point). Consequentialism struggles to explain why we *can't* punish the dangerous man if the system says "no," unless it relies on long-term systemic costs which are speculative.
      *   *Loser:* Consequentialism looks too instrumental. Retributivism looks too metaphysical unless it adapts.
      *   *Reversal:* The verdict reverses if the acquitted conduct is *highly probative of future danger* (e.g., violent predation) but legally technical (e.g., statute of limitations). Consequentialism shines here (protect society). Retributivism struggles (he deserves it, but can't punish?). Or, if the acquittal was clearly due to jury nullification of a just law.

  7.  **Review and Refine:**
      *   *Check Constraints:* Did I cover evidence strength, enhancement size, lesser included, plea? Yes. Did I address the "Desert vs. Procedure" distinction stability? Yes. Did I admit silence? (Need to ensure I explicitly state where theories run out of steam).
      *   *Tone Check:* Is it academic? Avoid colloquialisms. Use precise terminology (epistemic vs. ontological, constitutive vs. instrumental).
      *   *Fact Check:* Ensure I stick to the prompt's facts (don't bring in outside *Watts* nuances unless they help the theory).
      *   *Self-Correction on Retributivism:* Be careful not to conflate Retributivism with "Law and Order." A sophisticated retributivist (like von Hirsch) cares about proportionality and censure. The censure element makes the acquittal vital.
      *   *Self-Correction on Consequentialism:* Ensure I don't just say "it depends on the calculation." The point is whether the theory *can* make the calculation without losing its identity.

  8.  **Final Polish:** Organize into clear sections as requested. Ensure the "Reverse Direction" section explicitly answers the prompts about internal vs. imported constraints and undercounting costs. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Retributivism is divided." I need to analyze *which* version of Retributivism is more coherent under pressure. The prompt asks if the distinction is stable. I should argue it is *not* stable without modifying the theory to include procedural rights as intrinsic goods, which blurs the line with deontology.

  *(Self-Correction on Consequentialism)*: The prompt asks if the intuitive objection counts against the theory. I should argue that it counts against *act*-consequentialism but *rule*-consequentialism can absorb it, though at the cost of complexity.

  *(Final check on Conclusion)*: Which theory comes out better? Retributivism explains the *wrongness* better. Consequentialism explains the *practice* better. But since the seminar is likely critical of the practice, Retributivism (modified) provides the better *critique*. I will argue Retributivism fares better because it captures the normative significance of the verdict, whereas Consequentialism renders it contingent.

