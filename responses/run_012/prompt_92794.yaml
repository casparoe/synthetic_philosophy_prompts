answer: |-
  ### I. Analysis from Inside the Theories

  #### A. Retributivism

  **Central Commitment and Implication**
  The central commitment of retributivism is that punishment is justified only when, and to the extent that, an agent deserves it for culpable wrongdoing. Desert is a function of moral culpability and harm caused.

  From this commitment, a "pure" or "metaphysical" retributivism implies that acquitted-conduct sentencing is not only permissible but potentially *required*. If the defendant actually committed the conduct, he deserves punishment for it. The jury's acquittal is an epistemic event (a failure of proof beyond a reasonable doubt), not an ontological one (a declaration of actual innocence). To ignore the acquitted conduct is to under-punish desert, violating the principle of proportionality. On this view, the sentencing judge is correcting a factual error made by the jury, aligning the state's response with the moral reality of the defendant's actions.

  **Features Explained and Strained**
  *   **Explained:** The theory naturally explains why the sentence increases based on the severity of the conduct. If the acquitted conduct involved violence or significant harm, the defendant's culpability is higher, and the sentence should reflect that "cardinality."
  *   **Strained:** The theory strains to explain why the acquittal should have *any* weight. If desert is based on what was done, the procedural outcome of Count 2 should be irrelevant once the judge establishes the facts by a preponderance. Yet, even many retributivists feel a normative residue from the acquittal. To account for this, retributivism must distinguish between *moral desert* and *institutional entitlement to punish*.

  **Variable Details**
  *   **Strength of Evidence:** For the metaphysical retributivist, this is crucial. If the sentencing evidence is weak (barely preponderant), the confidence in actual desert is low, and punishment should be minimal. If strong, punishment is warranted. The BRD standard at trial is merely a procedural hurdle, not a moral boundary.
  *   **Size of Enhancement:** Retributivism imposes a hard ceiling here. The total sentence cannot exceed the "upper limit" of what is proportionate to the *total* culpable conduct (Convicted + Acquitted). If the enhancement makes the sentence disproportionate to the convicted count alone (e.g., life imprisonment for a minor conviction based on acquitted murder), it violates the "ordinal" proportionality of the conviction.
  *   **Lesser Included Offense:** If the defendant is convicted of Murder but acquitted of Manslaughter (illogical verdict), retributivism is untroubled; the desert for Murder subsumes the lesser. If convicted of Assault but acquitted of Attempted Murder, enhancing based on Attempted Murder conduct is permissible *if* the judge finds the intent existed. The verdict label matters less than the underlying culpable mental state.
  *   **Guilty Plea:** If the defendant pleads guilty to Count 1, he waives trial rights. Retributivism views this as an admission of culpability. However, the acquittal on Count 2 remains a state action. A retributivist might argue the plea waives procedural objections, making the use of acquitted conduct *more* defensible, as the defendant has already conceded the state's authority to censor him.

  **The Desert vs. Procedure Distinction**
  The case forces a distinction between **Desert as Actual Culpability** (what you did) and **Desert as Attributable Culpability** (what the state can legitimately hold you responsible for).
  *   **Stability:** This distinction is unstable under pressure. If Retributivism prioritizes Actual Culpability, the acquittal becomes morally transparent, rendering the jury's role merely instrumental. This risks collapsing retributivism into a form of accuracy-maximizing utilitarianism. If it prioritizes Attributable Culpability, it admits that procedural rules constitute the moral reality of guilt, not just our access to it.
  *   **What Gives:** To maintain stability, Retributivism must concede that "desert" in a political community is not pre-political. It requires a legitimate finding of guilt to trigger the state's right to inflict pain. Therefore, the procedural constraint is not imported; it is internal to the concept of *legal* retribution. However, if the theory admits this, it must acknowledge that a defendant who *did* commit the crime but was acquitted does not "deserve" punishment in the legal sense, even if he deserves it in the moral sense. This creates a gap between moral and legal desert that pure retributivism struggles to bridge without becoming a hybrid theory of rights.

  #### B. Consequentialism

  **Central Commitment and Implication**
  The central commitment of consequentialism is that punishment is justified by its future beneficial consequences (deterrence, incapacitation, rehabilitation).

  From this commitment, acquitted-conduct sentencing is prima facie justified. The jury's verdict is a noisy signal; the sentencing judge's preponderance finding is additional data. If the defendant engaged in the acquitted conduct, he is likely more dangerous (incapacitation) or the crime yielded higher profits (deterrence). Ignoring this information reduces the efficiency of the punishment. The acquittal is relevant only insofar as it signals the risk of error or systemic cost.

  **Features Explained and Strained**
  *   **Explained:** The theory explains the desire for individualized sentencing. It naturally supports using all available information to calibrate the risk the defendant poses.
  *   **Strained:** It struggles to explain the *intuitive* wrongness of the practice without resorting to long-term, speculative systemic costs. A pure act-consequentialist looking at *this* defendant should see a net benefit in incapacitating a dangerous individual, regardless of the jury's vote.

  **Variable Details**
  *   **Strength of Evidence:** Crucial for risk assessment. A preponderance finding suggests a >50% chance the conduct occurred. For incapacitation, this may be sufficient to justify preventive detention. For deterrence, the signal must be clear; if the public perceives the sentencing as unfair, specific deterrence may fail.
  *   **Size of Enhancement:** Determined by marginal utility. Does the extra time deter future offenders more than it costs in prison resources and human suffering? If the enhancement is massive, the diminishing returns of incapacitation may outweigh the benefits.
  *   **Lesser Included Offense:** Irrelevant to consequence. Danger is danger. The legal categorization matters only if it affects public perception of the law's fairness.
  *   **Guilty Plea:** Highly favorable. Pleas save resources (cost-benefit). Using acquitted conduct here maximizes efficiency: the state secures a conviction without trial risk and still neutralizes the threat posed by the acquitted conduct.

  **Accommodating the Objection**
  The intuitive objection is that this practice undermines the jury system.
  *   **Undercounting Costs:** A sophisticated consequentialist argues the practice is not wrong *in itself*, but wrong because of its second-order effects: it encourages prosecutors to overcharge (wasting resources), incentivizes defendants to risk trial (increasing costs), and erodes public trust (reducing general deterrence).
  *   **Theory's Capacity:** Consequentialism can accommodate these costs perfectly well *if* they are empirically verifiable. If the practice does not erode legitimacy, consequentialism has no grounds to object. This makes the theory's verdict contingent on sociological data rather than moral principle.

  ---

  ### II. Reverse Direction: What the Practice Shows About the Theories

  #### A. Retributivism: Internal Constraint or Imported Right?
  The widespread retributivist objection to *Watts* reveals a tension in the theory's account of authority.
  *   **Internal vs. Imported:** If a retributivist objects to punished acquitted conduct, is she relying on a procedural constraint imported from outside (e.g., liberal rights theory) or generated from within?
      *   If **Imported:** Retributivism is incomplete. It provides a theory of *amount* (proportionality) but not a theory of *trigger* (legitimacy). It needs a deontological supplement to explain why the state loses the right to punish after an acquittal, even if desert exists.
      *   If **Internal:** The theory must argue that "legal desert" is constituted by the verdict, not just the conduct. This implies that the jury's "Not Guilty" is not a statement about facts, but a performative act that alters the moral relationship between state and citizen.
  *   **Stability of the Distinction:** The distinction between Actual and Attributable desert is not stable under the pressure of *Watts*. If the state punishes for Actual desert despite a lack of Attributable desert (acquittal), it treats the citizen as a mere object of moral accounting rather than a rights-bearer. To resolve this, Retributivism must "give": it must elevate procedure from an epistemic tool to a constitutive element of justice. It must admit that a man can *deserve* punishment in the abstract but *not be liable* to it in the polity. This moves retributivism closer to a theory of censure, where the *communication* of guilt (the verdict) is as important as the guilt itself.

  #### B. Consequentialism: Legitimacy as a Cost or a Constraint?
  The practice tests whether consequentialism treats the rule of law as a mere instrument or a value in itself.
  *   **The Intuitive Objection:** If the practice feels wrong even when it works (i.e., even if it successfully incapacitates a dangerous person without immediate public backlash), this counts against Consequentialism. It suggests there are agent-relative constraints (do not punish the acquitted) that cannot be traded off for aggregate good.
  *   **Accommodating the Cost:** Consequentialism claims it can accommodate the objection by counting "legitimacy" as a good. However, this risks circularity. If "legitimacy" is defined as "adhering to the norm that acquittals matter," then Consequentialism is smuggling in a deontological rule.
  *   **Silence:** Where the theory is silent is on the *non-instrumental* value of the acquittal. If a study showed that acquitted-conduct sentencing *increased* public trust (e.g., "tough on crime" sentiment), Consequentialism would have to endorse it wholeheartedly. If our intuition says "No, even then, it's wrong," Consequentialism has no resources to explain why. It is silent on the intrinsic wrongness of violating the finality of a verdict.

  ---

  ### III. Conclusion: Verdict and Reversal

  **Which Theory Fares Better?**
  **Retributivism** comes out of the case better than it went in, provided it accepts the "constitutive procedure" modification.
  *   **Reasoning:** Retributivism captures the normative significance of the acquittal better than Consequentialism. It explains *why* we feel the defendant is being wronged: not because the system is inefficient, but because the state is censuring him for conduct it formally declared he did not commit. This violates the internal logic of censure. Consequentialism, by contrast, renders the acquittal contingent. If the systemic costs are low, Consequentialism permits the practice. This fails to match the moral intensity of the objection, which holds that the practice is unjust *per se*, not just imprudent. Retributivism, by integrating procedure into desert, explains the moral barrier.

  **Conditions for Reversal**
  The verdict would reverse if the case details changed to highlight the **epistemic failure of the jury** rather than the **normative force of the verdict**.
  *   **Scenario:** Suppose the acquitted conduct involves a highly technical element (e.g., a specific financial threshold) where the jury likely misunderstood the law, but the judge's preponderance finding is backed by irrefutable forensic evidence, and the conduct indicates a high probability of immediate, catastrophic future harm (e.g., a terrorist plot or serial predation).
  *   **Reversal:** In this scenario, Consequentialism fares better. It can justify the sentence as necessary prevention based on accurate risk assessment. Retributivism struggles: it must either punish a man the jury exonerated (violating the constitutive view) or release a dangerous man who actually committed the act (violating the moral desert view). If the harm of non-punishment is catastrophic, the Consequentialist's willingness to override the procedural quirk appears more responsible than the Retributivist's adherence to the verdict's formal finality. Here, the "Actual Culpability" view of retributivism looks impotent, and the "Attributable" view looks like dangerous formalism.
