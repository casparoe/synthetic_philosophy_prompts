answer: |-
  Hi Mark, I know this debate is exhausting you and the curators, and you are right that dragging them into a seminar on Aristotelian metaphysics won't solve the Tuesday morning treatment approval meeting. You need a tool that looks like science but acts like philosophy, something your technicians can run without needing a degree in ontology. Here is the procedure we are going to implement, written out so you can copy it into your manual. It forces us to separate the three things that make an object what it is: the material stuff, the form or shape, and the causal history of how it came to be. The first thing the technician must ask is about the material inventory, specifically what percentage of the original physical matter remains and whether the key structural elements are original. A sufficient answer here is not a guess but a quantifiable assessment, such as noting that eighty percent of the original wood fibers remain or that the core armature is intact. The second question concerns the form, asking whether the treatment alters the visible shape beyond the artist's known intent or whether it restores a shape that was lost. A sufficient answer requires visual documentation comparing the current state to verified historical images or similar works by the same hand. The third question is about causal history, asking who made this specific material and when, and whether the chain of existence has been broken. A sufficient answer here is provenance data confirming the material dates to the creation period and has not been destroyed and recreated.

  Once those questions are answered, the procedure splits into two paths. There is a hard no where the treatment stops immediately because it would amount to making a new object, and there is a values handoff where the decision goes to a person because it is not a factual question but an ethical one. The hard no triggers if the causal history of the material is severed, meaning the original stuff is destroyed to recreate the form, or if the form is fabricated without any physical continuity to the original creation event. This is where we protect the object's identity. The values handoff occurs when the material and history are secure but the form is ambiguous, such as when removing later additions reveals an earlier state. In those cases, the procedure cannot decide because it depends on whether we value the artist's original moment or the object's life history more, and that is a curatorial judgment, not a conservation fact. I want to be honest with you that distinguishing material from form is sometimes a judgment call wearing a lab coat, but forcing the team to write down which of the three pillars is being compromised stops the argument from becoming about feelings and makes it about evidence.

  Let's run this on the wooden figure with the later overpaint. When we ask about the material, the answer is that the original wood remains intact beneath the later paint layers. When we ask about the form, the answer is that the overpaint obscures the original carved surface. When we ask about history, the answer is that the wood retains its causal chain to the original carver, while the overpaint represents a later, separate history. The procedure here hands the decision to a person because removing the overpaint destroys the material of the later addition to reveal the form of the original. It is a values question about whether the object is defined by the artist's first touch or its current accumulated state. However, my definite stand is that we approve the stripping. The core identity of the artwork resides in the causal history of the wood and the original form intended by the maker. The overpaint is historically significant but it is not the artwork; it is a layer of history on top of the artwork. We document the overpaint extensively, but we remove it to return the object to its primary identity. The donor might complain we are erasing history, but we are actually prioritizing the primary causal history over the secondary one.

  Now consider the figure with the lost hand replaced by new wood. The material question shows a break because the new wood is not original matter. The form question shows a restoration of the intended shape. The history question shows a break in the causal chain because the new hand was not made by the artist or during the creation period. This triggers a hard no on calling the object exactly the same artwork without qualification. If we carve a new hand and attach it, we have created a composite object. The procedure dictates that we cannot claim the treated object is identical to the pre-treatment object in terms of material integrity. We must classify the hand as a restoration, not original material. My stand is that we do the replacement only if it is reversible and clearly distinguishable upon close inspection, and we must label the object as having restored elements. To claim the hand is original is a lie about the causal history. The object is still the artwork, but it is now a damaged artwork with a prosthetic, and pretending otherwise undermines the trust in our cataloging.

  Finally, look at the corroded bronze, whether melting it down to recast or 3D scanning and printing a resin copy. The material question for the melt-down shows that while the metal atoms might be the same, the specific object history is destroyed when the form is liquefied. The material question for the 3D print shows total material replacement. The form question shows a recreation of the shape. The history question shows a complete break in the causal chain for the print, and a reset of the chain for the recast. This is a hard no. If you melt the bronze, you have killed the object and made a new one from its remains, even if you use the original mold. If you 3D print it, you have made a replica. My stand is absolute here: neither the recast nor the print is the artwork. They are derivatives. The donor will hate this because they want the object to look perfect and whole, but if you melt the bronze, the causal history of that specific sculpture ends at the crucible. You cannot recast history. We keep the corroded lump as the artwork and make the recast or print as a study duplicate. To call the copy the artwork is to say that form alone constitutes identity, which denies the value of the authentic trace of the past.

  I know this sounds rigid, and I admit that drawing the line between significant material loss and total material replacement is where the judgment call hides. We are pretending there is a bright line where sometimes there is only a gradient. But if we don't draw the line somewhere, we are just guessing. This procedure forces us to admit when we are making a values choice rather than hiding it behind technical language. Use this to stop the arguments. If the causal history is broken, it's a new object. If the material is compromised, it's a composite. If it's just a debate about which layer of history matters, that's a curatorial vote, not a conservation treatment. Let's try this on the next intake and see if it holds. Best, Sarah.
