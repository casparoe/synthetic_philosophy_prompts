  If I had to bet, I would choose **(1) Precommit to a higher evidential threshold**. It removes roughly **80%** of the curse's distorting effect whilst remaining actionable for a single agent who cannot coordinate with the others. It captures the bulk of the corrective value of Strategy (6) without requiring you to calculate evidence correlations that are rarely knowable.

