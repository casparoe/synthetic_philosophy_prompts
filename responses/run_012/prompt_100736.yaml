  5.  **Drafting the Content - Section by Section:**

      *   *Intro:* Start with the tension. It's not a bug, it's a feature.
      *   *Candidate Theories:*
          1.  *Radical Transparency as Trust:* We trust each other not to misuse the info.
          2.  *Income as Public Fact:* Tax is the price of civilization; the receipt should be public.
          3.  *Disciplinary Visibility:* Panopticon light.
          4.  *Anti-Status Signaling:* Prevents lying about wealth.
      *   *Presuppositions:*
          *   *Privacy:* Redefined. Privacy protects the *home* and *inner life*, not financial status. Financial status is relevant to political equality.
          *   *Income:* Not absolute private property. It's pre-tax vs. post-tax. The pre-tax number is a measure of capacity to contribute.
          *   *Citizen-State:* The state isn't a predator; it's the administrator of the collective will.
