      *   *Underdetermination:* Is it trust or control?
          *   It's likely both. But the *normative* force relies on trust. If it were just control, it would feel oppressive. The fact that it *doesn't* feel oppressive suggests the trust is real. However, don't ignore the disciplinary aspect. It enforces conformity.
      *   *Commitment:* I need to pick a lane. I'll argue for a hybrid: *Transparency as a Technology of Equality.* It's not just trust; it's a mechanism to sustain the specific type of egalitarian social contract. It rules out extreme hierarchy.
      *   *Exportability:* Can the US/UK do this? No. Why? Because the *preconditions* (trust, belief in state legitimacy, low inequality) are missing. You can't legislate the culture required to make the law safe. In a low-trust society, this data becomes a weapon (stalking, class warfare, kidnapping risk).

