answer: |-
  Good evening, Mayor, distinguished guests, colleagues, and friends.

  It is a genuine honour to stand before you as outgoing Chair of this Society. One hundred years. When our predecessors gathered in this county a century ago, the world was a very different place. They founded this society with a specific purpose: to ensure that the story of our town's founding would not fade into the silence of the past. They wanted to keep the flame alive.

  Looking around this room tonight, I see that the flame is still burning. But I also see that the light it casts falls on different things for different people.

  We have here the guardians of the tradition—those for whom the story of our founder is as real as the ground beneath this table. And we have welcome among us the investigators—the archaeologists and academics who look at that same ground and ask how it was formed. I know, sometimes, that these two groups look at each other across the room and wonder if they are speaking the same language.

  That tension is actually why I chose the title for tonight's remarks: *When does a legend become history?*

  It sounds like a question about evidence. We assume the answer is simple: a legend becomes history when we find the proof. When the shard of pottery turns up, or the document is found in an archive, the story graduates. It becomes fact.

  But I've been thinking about this for a while, and I'm not sure that's right. I suspect the transition isn't about what we find in the ground. It's about what we feel in our hearts.

  Consider Troy. For centuries, the idea of a great war over a woman was poetry. Then Schliemann went digging. Today, most historians agree there was a conflict there. But notice how we discuss it. We can argue about the Hittite tablets, or the likelihood of a Greek coalition, without anyone's identity crumbling. If it turns out Troy was never sacked, nobody in this room loses sleep. We are not Trojans. We do not need Troy to be true to know who we are. Because we can afford to be wrong about Troy, it becomes safe to treat it as history.

  Then there is Arthur. He sits in the middle. The early records are silent where we want them to speak, and loud where we wish they wouldn't. Why does this argue still stir us? Because Arthur is part of the story of this island. To say he wasn't real feels, to some, like losing a piece of ourselves. When identity is riding on the outcome, evidence stops being just evidence. It becomes a threat, or a vindication. We cannot afford to be wrong, so he remains a legend.

  And then there are the stories that are even deeper. The great narratives of faith and peoplehood. For many, the question of whether certain events happened in history is secondary to the truth they hold for the community. To treat them as mere hypotheses is to misunderstand their function. They are not waiting to become history; they are sustaining the people who make history.

  So, here is my proposition to you tonight. A tradition crosses over into history not when we find proof that confirms it, but when the community can afford to be wrong about it.

  History requires a certain kind of security. It requires a confidence in who we are that is strong enough to withstand a negative test result. When we love our past enough to let it be examined, even if the examination changes the story, that is when legend matures into history.

  What does this mean for us, here, in this county, at our centenary?

  It means that the work this society does is not to defend a statue, nor is it to dismantle one. Our job is to hold the space where both can exist until the truth is ready to speak.

  To those who cherish the founding story: your stewardship of this narrative is what brought us here. Without your belief, there would be no society to host this dinner. You keep the heart of the town beating.

  To our academic guests: your rigour is what keeps that heart honest. You ensure that our love for the past does not become a blindness to it.

  Perhaps the mark of a mature community—is what I hope we are becoming—is that we no longer need to choose between pride and accuracy. We can love the story of our founder because of what it inspired us to become, regardless of what the archives might eventually say about who he was.

  If the story is robust, it can survive the trowel. And if the evidence is compelling, it should be able to win over the heart.

  We are one hundred years old. That is old enough to have roots, but young enough to keep growing. Let us be the generation that proves we can love our history enough to let it be questioned. Let us be secure enough in our identity that we don't need to be right about everything to be proud of something.

  Thank you for welcoming me into this role, and thank you for trusting me to step down from it. Here is to the next hundred years of asking the hard questions, and enjoying the good answers.

  Cheers.
