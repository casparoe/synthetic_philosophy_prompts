      *   However, Nozick *does* allow for a Minimal State. How does he fund it? In *Anarchy, State, and Utopia*, Nozick is notoriously vague/slippery about taxation. He suggests the Minimal State might be funded by fees or limited taxation that is justified as "compensation" for prohibiting private enforcement of rights.
      *   *The Real Weak Point:* Premise (4) is too strong *if* taken literally without reference to the *purpose* of the taking relative to rights. But Premise (7) assumes the Minimal State relies on the *same kind* of taxation as the welfare state.
      *   *Best Path:* The user should reject **(4)** but refine it, OR reject **(7)** by appealing to Nozick's specific justification for the Minimal State (the Compensation Principle).
      *   *Actually, the most honest answer:* The flatmate is right that (4) creates a tension. Nozick *does* have a problem here. The best move for a Nozickian is to modify (4) to rely on the **violation of specific rights** rather than a blanket "forced labor" claim, or to admit that the Minimal State requires a specific kind of "taxation" that is conceptually distinct (fees/compensation).
