      *   *Decision:* The most philosophically fruitful path for a 3rd-year student is to attack **(4)** but explain *why* it feels true in the redistribution case but not the protection case. The distinction lies in the **presupposition of the framework**. You can't have "just holdings" without a state to define/enforce them. Therefore, contributing to that framework isn't "taking" in the same way. (This leans towards Murphy/Nagel, but can be adapted).
