      *Actually, the "Self-Defeat" objection is widely considered fatal to the *rhetoric* of (4), not necessarily the entitlement theory itself.*
      *I should advise the student to reject (4) as a *freestanding moral truth* and view it as dependent on the prior justification of the state.*

