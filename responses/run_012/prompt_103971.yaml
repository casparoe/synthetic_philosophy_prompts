  Two rivals are at a charity auction where the host puts up a crisp $20 bill. He explains the rules: "Highest bidder wins the $20. But the second-highest bidder also pays their bid to the charity and gets nothing."

  Bidding starts normally, but once it passes $20, the logic kicks in. At $25, the second-place bidder realizes that quitting means losing $24 for nothing, while bidding $26 means losing only $6. It's a rational loss-mitigation strategy.

  The bidding spirals to $50.
  Bidder A ($49): "I bid $50."
  Bidder B ($50): "I bid $51. If you quit, you lose $49. If you win, you lose $31. It's an $18 savings."
  Bidder A: "Logic holds. I bid $52."

  The auctioneer finally slams the gavel. "Sold! $52 from her, $51 from him!"

  Bidder A pauses, doing the math. "So we just paid $103 total for a $20 bill."
  Bidder B nods. "Yes, but think about the alternative. If we hadn't stopped here, we could have lost $53, $54, $55... forever."
  Bidder A's eyes light up. "So by stopping now..."
  Bidder B: "...We saved infinity."

  They shook hands, grateful that rational decision-making had made them infinitely rich, which was convenient, since they were now too broke to spend it.
