  So my roommate and I got into this ridiculous two-hour argument last night and I've decided the only way to get over it is to turn it into a joke, because frankly the argument itself was already one. It started because I explained the dollar auction to him — the setup where you auction off a one-dollar bill, the top bidder pays their bid and gets the dollar, but the *second*-highest bidder also has to pay their bid and gets nothing. So bidding keeps going past a dollar, because if you're sitting at ninety-five cents and someone bids a dollar, walking away means you paid ninety-five cents for literally nothing, so of course you bid a dollar-five, and then they're in the same spot, and it spirals until someone's paying twelve dollars for a dollar bill. He kept saying the bidders are just being stupid, and I kept saying that's the whole thing — every single bid is locally defensible, that's exactly why it's a trap, no one has to be an idiot for it to go off the rails, and by the end we were basically performing the auction ourselves, each of us refusing to concede the last point because conceding felt like paying for nothing. He went to bed mad. I'm still mad. Anyway.

  Write me a joke about this. I want an actual joke with a setup and a punchline, not just a wry observation like "and that's how wars start" — the punchline should turn on the real mechanics, that both bidders pay, that quitting after you've already bid feels like losing twice, that the rational move at each step is the one that ruins you. Someone who actually knows the dollar auction should laugh and also wince a little; someone who doesn't should still get it from the joke itself. Setting ideas, pick whatever works best: two cousins bidding at a charity fundraiser where the prize is a cake, two rival companies in a price war over a product neither of them wanted, a couple dividing up furniture in a breakup, the devil auctioning off someone's soul. Please don't do the lazy version where the punchline is just "economists, amirite" or "humans are irrational lol" — that's the take my roommate had and I'm not over it.
