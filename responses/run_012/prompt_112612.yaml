prompt: |-
  For a graduate seminar on moral formation I am planning, a colleague has proposed a unit that pairs selections from Plutarch's paired Lives with a range of saints' lives, on the premise that the two are settings of a single pedagogical device: an edifying narrative that puts an admirable figure before a reader and lets admiration do the moral work. She distinguishes two settings. In the first, which she calls lateral exemplarity, the figure is close enough to the reader that the reader's own virtue could plausibly approach his, and Plutarch is her model. In the second, which she calls transcendent exemplarity, the figure stands above the reader, who can only revere rather than emulate, and the hagiographers are her models. She adds that in both genres fidelity to fact is subordinate to formative use, so the difference between them is one of altitude rather than of kind, and she wants the seminar to consider whether the second setting simply outperforms the first. My problem is that this looks exactly backwards. If the mechanism is one and the same, the loftier exemplar ought to be the more effective one, and the saints have everything on their side: virtue beyond dispute, suffering borne without complaint, and a reward promised to anyone who follows. Yet readers of the saints' lives seem to come away with devotion rather than emulation, while readers of Plutarch have claimed for centuries to have been made better by him. What am I failing to see? Is this a matter of degree, in which case my colleague's single-device picture stands and I need a better account of why the loftier setting fails to move people? Or is it a difference in kind, in which case I want to know precisely where the picture breaks, what each genre asks of its reader that the other does not, and whether altitude is even the right axis along which to place them? Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**

      *   **Context:** A graduate seminar on moral formation.
      *   **Colleague's Proposal:** A unit pairing Plutarch's *Lives* with Saints' Lives (hagiography).
      *   **Colleague's Thesis:** Both use the same pedagogical device (edifying narrative/admiration). She distinguishes two "settings":
          *   *Lateral Exemplarity (Plutarch):* Figure is close enough to emulate.
          *   *Transcendent Exemplarity (Saints):* Figure is above, to be revered, not emulated.
          *   *Claim:* Fidelity to fact is subordinate to formative use in both. Difference is altitude, not kind.
          *   *Question:* Does the second (transcendent) outperform the first (lateral)?
      *   **User's Problem:** This looks backwards. If the mechanism is the same, the loftier exemplar *should* be more effective (Saints have indisputable virtue, suffering, promised reward). Yet, historically, Plutarch's readers claim moral improvement, while hagiography readers often feel devotion.
      *   **User's Questions:**
          1.  Is this a matter of degree (colleague is right, but why does loftier fail to move)?
          2.  Or is it a difference in kind (where does the picture break, what does each ask, is altitude the right axis)?
      *   **Constraint:** Answer in American English.

  2.  **Deconstruct the Colleague's Argument:**

      *   *Premise 1:* Both genres work by "admiration doing the moral work."
      *   *Premise 2:* The only difference is "altitude" (distance between reader and subject).
      *   *Conclusion:* We should test if higher altitude (Saints) works better than lower altitude (Plutarch).
      *   *Flaw:* The user suspects the mechanism isn't the same. The "altitude" metaphor might be misleading.

  3.  **Evaluate the "Mechanism of Admiration":**

      *   *Plutarch:* The *Lives* are comparative. They show virtue *in action* within political and social constraints. They show struggle, ambiguity, and sometimes failure. The reader is invited to judge and *act* similarly in their own civic life. It's about *phronesis* (practical wisdom).
      *   *Hagiography:* The Saints are often vessels of divine grace. Their virtue is often miraculous or supernatural. The gap isn't just "harder to reach"; it's ontologically different (human vs. divinely empowered human). The response is often liturgical or prayerful, not just behavioral mimicry.
      *   *The "Altitude" Problem:* If the gap is too wide, emulation becomes impossible. If the mechanism is *emulation*, high altitude breaks the mechanism. If the mechanism is *worship*, low altitude fails. The colleague claims the mechanism is the *same* (admiration -> moral work). This is the weak point.

  4.  **Formulate the Counter-Argument (Difference in Kind):**

      *   It is likely a difference in *kind*, not just degree.
      *   *Teleology:* Plutarch aims at civic virtue/political leadership within a republic/empire. Hagiography aims at salvation/sanctification within a Kingdom of God.
      *   *Agency:* Plutarch's heroes achieve virtue through will and habit (Aristotelian). Saints often achieve holiness through grace and surrender (Augustinian/Christian).
      *   *Mimicry:* You can mimic Pericles' speech or Cato's stoicism. You cannot mimic St. Anthony's desert temptations or St. Stephen's martyrdom in the same way without the specific theological context.
      *   *The "Admiration" Mechanism:* Admiration leads to emulation only if the goal is perceived as attainable. If the goal is transcendent, admiration leads to *veneration*, which sustains a community but doesn't necessarily train individual civic agency in the same way.

  5.  **Address the User's Specific Questions:**

      *   *Is it degree or kind?* Argue for kind.
      *   *Where does the picture break?* At the point of *imitability*.
      *   *What does each ask of the reader?* Plutarch asks for judgment and civic action. Hagiography asks for faith and spiritual alignment.
      *   *Is altitude the right axis?* No. The axis should be *imitability* vs. *intercession* or *civic* vs. *sacramental*.

  6.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Academic, respectful, analytical, suitable for a graduate seminar context. American English spelling and idiom.
      *   *Opening:* Validate the user's intuition. It *is* backwards, but not for the reason they might think.
      *   *Section 1: The Flaw in the "Single Device" Theory.* Challenge the idea that admiration works the same way in both. Introduce the concept of the "uncanny valley" of virtue. If too perfect, it stops being a model for action.
      *   *Section 2: Teleological Divergence.* Plutarch = Civic/Political. Saints = Soteriological/Spiritual. The "moral work" is different.
      *   *Section 3: Agency and Grace.* Plutarch = Human effort. Saints = Divine grace. This changes the "how-to."
      *   *Section 4: Re-mapping the Axis.* Suggest "Imitability" vs. "Veneration" instead of "Lateral" vs. "Transcendent."
      *   *Conclusion:* Advise on how to frame this in the seminar. Don't discard the pairing, but reframe the question.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say hagiography *never* encourages emulation. *The Imitation of Christ* exists. But the *mode* of emulation is different (interior disposition vs. exterior action).
      *   *Nuance:* Plutarch also includes failures. Hagiography often smooths these out. This affects the "fidelity to fact" claim. Plutarch's moral work comes from *judging* the flaws, not just admiring the good.
      *   *Key Insight:* The colleague says fidelity to fact is subordinate in *both*. But Plutarch relies on historical plausibility for the lesson to stick. Hagiography relies on theological truth (miracles) which suspends historical plausibility.
      *   *The "Altitude" Trap:* If the saint is too high, you pray *to* them, you don't try to *be* them. If the statesman is too high, you admire them, but Plutarch specifically chooses figures whose struggles are relatable.

  8.  **Final Polish:** Check against American English constraints (e.g., "honor" vs "honour", "program" vs "programme" - though mostly relevant to spelling, ensure idioms fit). Ensure the tone is collegial but firm on the philosophical distinction.

      *(Self-Correction on "American English"):* Ensure spelling (e.g., "behavior" not "behaviour", "center" not "centre"). Ensure phrasing sounds like US academic discourse.

  9.  **Final Structure:**
      *   Introduction: Validate the user's skepticism.
      *   Point 1: The Mechanism of Emulation (The "Too Perfect" Problem).
      *   Point 2: The Teleological Gap (Civic vs. Sacramental).
      *   Point 3: The Role of Flaw and Struggle (Plutarch's specific genius).
      *   Point 4: Reframing the Axis (Imitability vs. Intercession).
      *   Seminar Suggestion: How to pivot the discussion productively.

  10. (Final Review against prompt): Did I answer "What am I failing to see?" Yes. Did I address "Degree vs Kind"? Yes. Did I address "Where the picture breaks"? Yes.

