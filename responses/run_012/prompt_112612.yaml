answer: |-
  You are right to be skeptical. Your intuition that the colleague's framework looks "backwards" stems from a precise philosophical insight: if the mechanism of moral formation were truly identical in both genres, then the more perfect exemplar should indeed yield better results. The fact that it does not suggests that the mechanism is *not* identical.

  The problem is not merely that you need a better account of why the "loftier" setting fails to move people; the problem is that your colleague's premise—that fidelity to fact is subordinate to formative use in the *same way* for both genres—is a category error. It treats a difference in kind as a difference in degree.

  Here is an analysis of where the picture breaks, why altitude is the wrong axis, and how you might reframe this for the seminar.

  ### 1. The Mechanism of Emulation vs. Veneration
  Your colleague posits a single device: "an edifying narrative that puts an admirable figure before a reader and lets admiration do the moral work." This assumes that admiration functions uniformly regardless of the object's distance from the subject. Psychological and philosophical evidence suggests otherwise.

  In Plutarch, the "moral work" is done through **practical judgment**. Plutarch does not present statues; he presents struggles. He shows Cato or Alcibiades making choices in ambiguous political contexts. The reader is invited to simulate that decision-making process. The admiration is for the *capacity* of the agent to navigate complexity. Because the reader recognizes the complexity as shared, the admiration triggers a desire to replicate the *agency*.

  In hagiography, the "moral work" is often done through **intercession and alignment**. When a saint performs a miracle or endures supernatural temptation, the gap is not just one of difficulty (altitude); it is ontological. The saint is a vessel of grace. If the reader cannot access that same grace, emulation is impossible. Consequently, admiration transforms into veneration. You do not try to *be* St. Christopher; you ask him to carry you. The moral formation here is not about replicating external actions (which may be miraculous) but about aligning the interior will with God.

  If the seminar proceeds on the premise that both genres ask the reader to "copy the behavior," the hagiography unit will fail, because that is often not what the text asks.

  ### 2. The Teleological Gap (Civic vs. Sacramental)
  The "moral work" itself differs between the two genres. Plutarch is writing for the formation of a **citizen-statesman**. The telos is the health of the polis, achieved through prudence, courage, and justice in the public sphere. The virtue is immanent; it happens *here*, in the senate or on the battlefield.

  Hagiography is writing for the formation of a **soul**. The telos is salvation and union with the divine. The virtue is often transcendent; it happens *beyond* the social order, sometimes in direct opposition to it (e.g., the desert fathers).

  When you read Plutarch, you are asked, "How would I govern?" When you read a saint's life, you are often asked, "How would I surrender?" If your seminar defines "moral formation" primarily as civic or interpersonal ethical improvement, Plutarch will naturally outperform the saints. If the definition includes spiritual orientation, the saints perform a different task entirely. Comparing them on a single axis of "effectiveness" is like comparing a hammer and a prayer book by seeing which one drives a nail better.

  ### 3. The Role of Flaw and Friction
  Your colleague claims that in both genres, "fidelity to fact is subordinate to formative use." This is true, but the *use* of the facts differs.

  Plutarch's pedagogical power relies heavily on **friction**. He includes flaws, failures, and ambiguities. The moral work comes from the reader judging where the hero went wrong. If Alexander is great but flawed, I can be great and avoid his specific errors. The "lateral" nature isn't just about altitude; it's about shared fallibility.

  Hagiography often smooths out friction to highlight divine power. While there are confessors and penitents, the "transcendent" saints often display a perfection that removes the footholds for emulation. If a saint never feels temptation, or overcomes it instantly through prayer, the reader learns that prayer is powerful, but not *how* to endure the temptation psychologically. The "fidelity to fact" is subordinated to theological truth, whereas in Plutarch, it is subordinated to psychological plausibility.

  ### 4. Reframing the Axis
  Altitude is not the right axis. The axis should be **Imitability vs. Intercession** (or perhaps **Agency vs. Grace**).

  *   **Plutarch (Imitability):** The figure is a model of human agency. The reader is expected to appropriate the virtue through habit and reason.
  *   **Hagiography (Intercession):** The figure is a model of divine reception. The reader is expected to appropriate the virtue through faith and sacrament.

  If you force the saints into the "lateral exemplarity" box, they become discouraging (I can never be that good). If you force Plutarch into the "transcendent exemplarity" box, he becomes irrelevant (He was a hero of a lost age).

  ### Recommendation for the Seminar
  Do not discard the pairing; it is rich. However, you should pivot the seminar's central question. Instead of asking, "Does transcendent exemplarity outperform lateral exemplarity?" ask:

  **"Does moral formation require the exemplar to be imitable, or can it proceed through veneration?"**

  This allows you to test your colleague's hypothesis without accepting her flawed premise. You can explore:
  1.  **The Uncanny Valley of Virtue:** At what point does an exemplar become so perfect that they cease to be a model for action and become an object of worship?
  2.  **The Locus of Change:** Does Plutarch change the *hand* (action), while the saint changes the *heart* (disposition)?
  3.  **The Necessity of Flaw:** Does the reader need to see the exemplar struggle to believe the virtue is attainable?

  ### Summary
  You are failing to see nothing; your colleague is failing to see that "admiration" is not a monolithic psychological engine. In Plutarch, admiration sparks emulation because the gap is bridgeable by human effort. In hagiography, admiration sparks devotion because the gap is bridgeable only by grace.

  It is a difference in kind. The picture breaks at the point of **agency**. Plutarch asks the reader to supply the power to emulate; the hagiographer asks the reader to acknowledge their inability to emulate without help. If the seminar treats these as the same pedagogical device, it will misunderstand both. If you reframe the unit to investigate how different conceptions of human agency require different narrative forms, you will have a much more productive graduate seminar.
