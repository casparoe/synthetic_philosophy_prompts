      *   *The Seller Risk:* Highlight the correlation. If 5 lots are from one guy, that's one bet, not five.
      *   *The Strategy:*
          1.  **Ring-fence the Life Money:** Keep at least 3 months of rent/expenses out of the $4k. Let's say $2,000 is untouchable. That leaves $2,000 for inventory.
          2.  **Position Sizing:** With $2,000 risk capital, max 10 lots. But wait, if 40% are duds, revenue is $2,400. Profit $400. Is that worth the stress?
          3.  **Seller Concentration:** Don't put more than 20-25% of risk capital on one seller.
          4.  **Pacing:** Don't buy all 10 lots in one week. Spread it out.
