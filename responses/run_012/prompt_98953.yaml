      *   **Opportunity:** Weekly online auctions.
      *   **Cost per Lot:** $200.
      *   **Probability/Return:** 60% chance to flip for $400 (100% return on cost), 40% chance worth $0 (100% loss on cost).
      *   **Expected Value (EV):** $(0.6 * 400) + (0.4 * 0) = $240$. Net profit per lot = $240 - $200 = $40. Positive EV.
      *   **Risk:** Ruin risk. Losing the $4,000 means disaster (rent, kid).
      *   **Correlation Risk:** Some lots come from the same seller. If one is a scammer, all from that seller are duds.
      *   **Conflict:** Buddy A (Maximize EV/All-in) vs. Buddy B (Survival/Position Sizing).
      *   **Goal:** Practical advice on how many lots to buy, considering risk of ruin and correlation, without a formal finance lecture.

