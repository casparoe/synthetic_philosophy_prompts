answer: |-
  **Formal Epistemology — Midterm Take-Home**
  **Time Allowed:** 75 Minutes
  **Instructions:** Answer all parts. No notes or texts permitted.

  **Question 1: The Café Mixture**

  A café serves a blended drink consisting only of tea ($T$) and milk ($M$). You are told that the ratio of tea to milk, $r = T/M$, lies in the interval $[1/2, 2]$. You are given no further information about how the drinks are mixed. You are asked to assign a credence to the proposition $E$: "There is more tea than milk" ($T > M$).

  In section, three students proposed the following solutions:
  *   **Student 1:** Since $r$ is in $[1/2, 2]$ and we are ignorant, we apply the Principle of Indifference to $r$. The distribution is uniform on $[1/2, 2]$. $P(E) = P(r > 1) = 2/3$.
  *   **Student 2:** The information is symmetric regarding ingredients. We should apply Indifference to the inverse ratio $r' = M/T$, which is also in $[1/2, 2]$. $P(E) = P(r' < 1) = 1/3$.
  *   **Student 3:** The problem description is invariant under swapping the labels 'tea' and 'milk'. This swap maps $E$ to $\neg E$. Therefore, $P(E) = 1/2$.

  (a) Explain precisely why the reasoning of Student 1 and Student 2 is defective in a way that Student 3's is not. Specifically, address why applying indifference to the ratio is the wrong level of application. (8 marks)

  (b) Is the conclusion $P(E) = 1/2$ logically entailed by the stated information alone, or does it require a further substantive assumption? If the latter, state the assumption and explain whether it counts as a form of Indifference, and if so, why it is defensible here when the ratio-based versions were not. (7 marks)

  (c) Generalize the moral. Under what conditions is an Indifference principle legitimate regarding group invariance and normalizability? Explain why the classic Bertrand Chord paradox arises in light of these conditions, and why it does not arise in the Café case. Include a remark on whether the symmetry in the Café case pins down the entire probability distribution or merely the answer to $E$. (10 marks)

  ***

  **Model Answer**

  Students 1 and 2 fail because they apply the Principle of Indifference to a specific parameterization ($r$ or $r'$) without justification. The interval $[1/2, 2]$ is the same for both, but a uniform distribution on $r$ induces a non-uniform distribution on $r' = 1/r$. Since the problem statement provides no physical mechanism favoring one parameterization over the other, choosing one arbitrarily violates the requirement that epistemic states should not depend on arbitrary representational choices. Their contradiction ($2/3$ vs $1/3$) demonstrates that indifference over continuous parameters is not reparameterization invariant.

  Student 3 succeeds because she applies indifference not to a magnitude, but to the *labels*. The information set $I$ is invariant under the permutation group $S_2$ acting on $\{T, M\}$. Swapping labels maps the possibility space to itself and maps event $E$ ($T>M$) to its complement $\neg E$ ($M>T$). If a rational credence function must respect the symmetries of the information provided, then $P(E|I) = P(\neg E|I)$. Given $P(T=M)=0$ in a continuous mixture, $P(E)=1/2$. This avoids the parameterization problem because the symmetry operates on the outcome space directly, not on a measure over a generating parameter.

  The conclusion $P(E)=1/2$ is not logically entailed by the information alone; logic permits any value in $[0,1]$ consistent with the constraints. It requires the substantive **Principle of Symmetry**: credences should be invariant under transformations that leave the evidence invariant. This is a form of Indifference, but it is the defensible kind. It is defensible here because the group action (swapping labels) is finite and acts transitively on the set of relevant outcomes $\{E, \neg E\}$. Unlike the ratio case, there is no ambiguity about which "uniform" measure to use on a binary set; there is only one probability measure invariant under the swap.

  The general moral is that Indifference is legitimate when the problem's information is invariant under a group acting transitively on the space of possibilities, and the invariant measure is normalizable. In the Café case, the swap group is finite, the space is effectively binary regarding $E$, and the invariant measure is unique and normalizable.

  The Bertrand Chord paradox arises because the symmetry group of the circle (rotations/translations) does not act transitively on the *parameterizations* used to define "random chord" (e.g., distance from center vs. angle of intersection). Different parameterizations select different subsets of chords as "uniform," leading to inconsistent probabilities. The symmetry cannot reach the thing in dispute (the measure over the parameter). In the Café case, the symmetry *does* reach the dispute: it directly links $E$ and $\neg E$. Finally, note that the symmetry in the Café case pins down the probability of $E$ without pinning down the whole distribution over ratios. We know $P(T>M)=1/2$, but we do not know the density of $r$ within the region $T>M$. The symmetry constrains the event, not the underlying continuous measure.

  ***

  **Marking Scheme (Total: 25 Marks)**

  **Part (a): Critique of Students 1 & 2 (8 Marks)**
  *   **Must-Hit (4 marks):** Identifies that Students 1 & 2 assume a uniform measure on a specific parameter ($r$ vs $1/r$) without justification. Must state that indifference is not reparameterization invariant.
      *   *Typical Error:* Treating 2/3 vs 1/3 as a merely verbal dispute or calculation error.
      *   *Recovery:* Award 2 marks if they note the mathematical contradiction implies one assumption must be arbitrary, even if they don't name "reparameterization."
  *   **Must-Hit (4 marks):** Explains why Student 3 avoids this. Must mention that label-swapping acts on the *events* ($E$ vs $\neg E$) rather than the continuous parameter.
      *   *Typical Error:* Claiming Student 3 is just doing indifference in a hat (circular).
      *   *Recovery:* Award 2 marks if they argue that binary symmetry forces a unique measure whereas continuous ratios do not.

  **Part (b): Entailment and Assumption (7 Marks)**
  *   **Must-Hit (3 marks):** States clearly that 1/2 is *not* logically entailed by the information alone (logic allows any $p \in [0,1]$).
      *   *Typical Error:* Claiming it is a logical truth or analytic.
      *   *Recovery:* Award 1 mark if they say it requires a "principle" without specifying logical entailment.
  *   **Must-Hit (4 marks):** Identifies the required assumption (Principle of Symmetry/Invariance) and argues it is defensible because the group is finite/transitive on the outcome space.
      *   *Typical Error:* Vaguely saying "it's more rational."
      *   *Recovery:* Award 2 marks if they contrast the finite binary case with the continuous ratio case to justify defensibility.

  **Part (c): General Moral and Bertrand (10 Marks)**
  *   **Must-Hit (4 marks):** Conditions for legitimate indifference: Invariance under a group acting transitively on possibilities + normalizable measure.
      *   *Typical Error:* Listing conditions without explaining "transitive."
      *   *Recovery:* Award 2 marks if they mention "unique invariant measure."
  *   **Must-Hit (4 marks):** Bertrand comparison: In Chord problem, symmetries don't fix the measure on the disputed parameter (distance vs angle). In Café, symmetry fixes the event probability directly.
      *   *Typical Error:* Saying Bertrand is just "harder" or "ambiguous."
      *   *Recovery:* Award 2 marks if they note Bertrand involves competing parameterizations while Café involves competing labels.
  *   **Bonus Distinction (2 marks):** Notes that Café symmetry pins the yes/no answer ($P(E)$) without pinning the full distribution over ratios.
      *   *Typical Error:* Assuming $P(E)=1/2$ implies uniformity on $r$.
      *   *Recovery:* No partial credit; all or nothing for this insight.

  **General Penalties**
  *   -2 for exceeding word count significantly (if enforced).
  *   -2 for using citations (per course rules).
