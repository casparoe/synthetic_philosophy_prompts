      *   *Student 3:* Symmetry. Swapping $T$ and $M$ leaves the constraint invariant ($T/M \in [0.5, 2] \iff M/T \in [0.5, 2]$). Event $E: T > M$ maps to $E^c: M > T$. If credence respects symmetry, $P(E) = P(E^c)$. Since $P(T=M)=0$ (continuous), $P(E) = 1/2$.
      *   *Key Insight:* Student 3 is right *if* we accept the symmetry principle. This isn't full indifference over a parameter space (which leads to paradox), but indifference over the *labels* (permutation symmetry).
      *   *Connection to Bertrand:* Bertrand fails because the symmetry group (rotations/translations) doesn't act transitively on the *parameterization* chosen (e.g., distance from center vs. angle). Here, the swap symmetry *does* act transitively on the binary outcome space {Tea > Milk, Milk > Tea}.

