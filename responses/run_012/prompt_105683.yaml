  2. The Relative Reliability Principle dictates that one must defer in proportion to the perceived cognitive fitness and track record of the disagreeing party. This saves your verdicts on exhaustion and the unreconstructable route but sacrifices the crowd case where numbers should outweigh individual reliability, predicting you should shift towards your future self if their decade of thought implies superior fitness.

  3. The Independence of Evidence Principle requires belief revision only when disagreement indicates a flaw in processing shared evidence rather than a difference in fundamental values. This captures the statistical error and profit incentive cases but forces you to abandon the intuition that the crowd case is anomalous, predicting you should remain firm against your future self if no new evidence is acquired.

  4. The First-Order Conviction Principle suggests one should maintain one's view unless a specific error is identified, regardless of peer disagreement. This preserves your firm stance in the crowd and poem cases but sacrifices the conciliationist intuition regarding the single colleague and statistical error, predicting you should stay put against your future self unless you can pinpoint a past mistake.

  5. The Contextual Stakes Principle argues that the degree of conciliation depends on the practical consequences of being wrong and the verifiability of the claim. This saves the profit and statistical cases while sacrificing the exhaustion case where stakes are low, predicting you should shift towards your future self only if the reversal carries significant practical implications.
