answer: |-
  **INTERNATIONAL EVIDENTIAL REPORTING COUNCIL (IERC)**
  **Exposure Draft No. 4-B**
  **Recognition and Measurement of Confirmatory Instances**
  **Date:** 14 November 2023
  **Comment Deadline:** 30 February 2024

  **Scope and Objective**
  1. This Draft establishes principles for recognizing evidential support arising from observational data. It applies to all entities formulating universal hypotheses of the form "All Fs are Gs." The objective is to ensure comparability in confirmation reporting across scientific disciplines by standardizing the treatment of logical equivalents.

  **Recognition Principles**
  2. **Instantiation Rule.** An entity shall recognize a confirmatory asset when an observed object possesses property F and property G. The magnitude of support shall be measured at the fair value of the observation cost.
  3. **Equivalence Condition.** Hypotheses logically equivalent must be reported consistently. If "All Ravens are Black" is booked, "All Non-Black Things are Non-Ravens" shall be booked under the same line item. Consequently, a white shoe (Non-Black, Non-Raven) constitutes a confirmatory instance indistinguishable in kind from a black raven. Entities cannot classify the shoe as "Non-Ornithological" to avoid consolidation.^1
  4. **Materiality and Netting.** Confirmatory instances derived from non-raven objects are deemed *de minimis*. Entities may net the support value against the cost of observation. However, a dedicated Shoe-Watching Program must be capitalized as Ornithological Research if aggregate support exceeds the materiality threshold of 0.0001 confirmations per fiscal period.
  5. **Irrelevant Conjunction.** If evidence E supports Hypothesis H, E shall automatically support H conjoined with any unrelated claim X (e.g., "All Ravens are Black and the Moon is Cheese"). No separate disclosure is required for X, provided X does not contradict H.
  6. **Prior-Period Adjustments.** Evidence collected before the hypothesis was formulated shall be recognized as a prior-period adjustment to retained confirmation, restated prospectively.
  7. **Time-Dependent Predicates.** Objects exhibiting predicates that depend on the time of examination (e.g., "Grue") require separate disclosure. Entities must amortize the confirmation value over the temporal switch-point.

  **Illustrative Ledger (Extract)**
  *   **Entry 101:** Black Raven observed. *Debit:* Confirmatory Support; *Credit:* Ornithology Revenue.
  *   **Entry 102:** White Shoe observed. *Debit:* Confirmatory Support (Negligible); *Credit:* Ornithology Revenue.
  *   **Entry 103:** Red Herring observed. *Debit:* Null; *Credit:* Inventory.
  *   **Entry 104:** Green Apple observed. *Debit:* Confirmatory Support (Accumulated); *Credit:* Ornithology Revenue.

  **Basis for Conclusions**
  The Board rejected the "Likelihood Ratio" model proposed by commentators. While Dr. Aris Thorne (Comment Letter 44-B) argued that support should measure the difference in probability given H versus not-H, the Board concluded that likelihood ratios introduce unacceptable volatility into evidential statements. Standardization requires binary instance counting to maintain audit trails.

  **Board Response to Comment Letter 44-B**
  *Commenter:* "The white shoe increases the probability of the hypothesis negligibly, whereas the raven increases it substantially. Recognition should reflect this delta."
  *Board Chair L. V. Quant:* "The Council acknowledges the commenter's concern regarding magnitude. However, distinguishing between 'substantial' and 'negligible' instances undermines the Equivalence Condition. Both items are logically instances. To discriminate would impair comparability across hypotheses. The Board will consider this in Draft 5-A."

  **Effective Date and Transition**
  This Draft is the fourth exposure iteration. The effective date has been postponed pending resolution of the 'Grue Predicate' incompatibility issue. Entities should continue to apply previous guidance until further notice. The Board notes that continued postponement ensures stability in the confirmation markets.

  ***

  ^1 *Footnote: Staff note indicates that green apples may also be booked under this clause, provided they are not examined on a Tuesday.*

  **Approved for exposure by the Board:**
  *Chair:* L. V. Quant
  *Members:* J. S. Milliken, R. Empiricus, K. Popperman (Dissenting)
  *Staff:* Dr. E. Paradox, Senior Technical Advisor
