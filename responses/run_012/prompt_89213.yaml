      *   **Section 2: Conceptual Distinctions (Validating the User's Hang-ups):**
          *   *Chosen vs. Structural:* **Verdict: Genuine Requirement.** Why? Because they imply different physics/sociologies. Structural = Hard Limit (Rare Earth). Chosen = Soft Limit (Sociology). A theory must specify which.
          *   *The Last-Caller Problem:* **Verdict: Genuine Requirement.** This is the "First Mover" paradox. If silence is optimal, how did the enforcers arise without being wiped out? This is a stability condition.
      *   **Section 3: Physical & Astrophysical Constraints (The "Can't Contradict" List):**
