answer: |-
  # Operational Protocol for Responsibility Allocation (OPRA)
  **Version:** 1.0 (Hospital Incident Review Panel)
  **Time Limit:** 120 Minutes per Case
  **Authority:** Administrative/Operational Only (No Legal Findings)

  ## Phase 1: Intake and Fact Verification (0:00–0:30)
  **Goal:** Establish the baseline record.
  1.  **Log Audit:** Retrieve system logs, access records, and change histories.
      *   *Rule:* If logs are missing, corrupted, or inaccessible due to vendor restriction, mark **Answerability Gap** automatically. Do not spend time recovering them.
  2.  **Chain of Custody:** Map the human roles involved (Operator, Approver, Maintainer, Purchaser).
      *   *Rule:* If a specific contractor is defunct or unreachable, mark **Liability Gap** and **Repair Gap** for that node.
  3.  **System Boundary:** Define where the "system" ends and the "workflow" begins.
      *   *Rule:* For hybrid systems (Vendor Model + Hospital Workflow + Clinician Judgment), treat the interface points as potential gap sites.

  ## Phase 2: Gap Diagnosis (0:30–1:15)
  **Goal:** Diagnose the presence of the three specific gaps. Do not assign blame yet.

  **Test A: The Answerability Gap**
  *   **Question:** Can a specific role currently provide a coherent account of *why* the system produced this specific output/action?
  *   **Criteria:**
      *   Yes: Logs + Role explanation exist.
      *   No: Output is opaque, logs are missing, or explanations contradict evidence.
  *   **Outcome:** If No, record **Gap-A**.

  **Test B: The Liability Gap**
  *   **Question:** Is there a budget, insurance line, or role authorized to absorb the cost of this harm (financial, reputational, or physical)?
  *   **Criteria:**
      *   Yes: Costs can be assigned to a person, department, or vendor contract.
      *   No: Costs fall on the patient, or no budget owner exists (e.g., vendor insolvent, contract void).
  *   **Outcome:** If No, record **Gap-L**.

  **Test C: The Repair Gap**
  *   **Question:** Does any role have the standing and technical capacity to modify the system to prevent recurrence?
  *   **Criteria:**
      *   Yes: A role can patch, retrain, update protocol, or disable the tool.
      *   No: System is closed-source, vendor refuses changes, or no one has authority to alter workflow.
  *   **Outcome:** If No, record **Gap-R**.

  ## Phase 3: Responsibility Allocation (1:15–2:00)
  **Goal:** Assign forward-looking duties based on diagnosed gaps.
  *   **Constraint:** Assign responsibilities to **Roles** (e.g., "Chief of Surgery"), not **Named Persons** (e.g., "Dr. Smith"), unless gross negligence is evident (refer to HR/Legal).
  *   **Constraint:** Do not debate metaphysical free will. If a human was in the loop but claim ignorance due to system complexity, treat as **Gap-A**.

  **Allocation Rules:**
  1.  **If Gap-A exists:** Assign **Explanation Duty** to the highest operational role overseeing the system (e.g., CMIO). They must commission an audit or explain the opacity to stakeholders.
  2.  **If Gap-L exists:** Assign **Cost Absorption** to the Institution (Hospital Administration). The institution must create a fund or buffer; do not assign to individual clinicians.
  3.  **If Gap-R exists:** Assign **Monitoring Duty** to the closest operational role (e.g., Biomed Team). They cannot fix the code, but they must monitor for failure and establish workarounds.
  4.  **If No Gaps exist:** Assign **Correction Duty** to the role that failed the protocol (e.g., Operator).
  5.  **Unallocatable:** If a responsibility cannot be assigned without violating safety or ethics (e.g., "Guarantee zero risk"), mark as **Unallocatable** and recommend system decommissioning.

  **Value Flagging:**
  *   Explicitly list any decision that relied on a value judgment rather than fact (e.g., "Panel decided patient consent covered secondary data use").
  *   Explicitly list any residual risk tolerated (e.g., "Panel accepts 1% false-negative rate").

  ---

  # Case Applications

  ## Case 1: Autonomous Infusion Pump (Nurse Override)
  **Incident:** Pump delivered dose outside protocol. Logs show nurse overridden safety alert.
  **Phase 1:** Logs present. Chain of custody clear (Nurse -> Patient).
  **Phase 2: Gap Diagnosis**
  *   **Test A (Answerability):** Pass. Logs show override; Nurse interview confirms intent to expedite care.
  *   **Test B (Liability):** Pass. Hospital liability insurance covers patient harm; Nursing department covers disciplinary costs.
  *   **Test C (Repair):** Pass. Protocol exists; Pump settings can be locked by Biomed.
  *   **Diagnosis:** **No Gaps Present.**
  **Phase 3: Allocation**
  *   **Explain:** Nursing Director (Review override policy).
  *   **Repair:** Biomedical Engineering (Lock override function for this drug class).
  *   **Liability:** Hospital Administration (Process insurance claim).
  *   **Value Flag:** Panel decided that emergency expediency does not justify protocol breach without attending physician sign-off.
  *   **Unallocatable:** None.

  ## Case 2: Triage Model (Demographic Bias)
  **Incident:** Model under-ranked patients from Group X. Cause: Training data from Hospital Y (different demographics).
  **Phase 1:** Logs show model version. Vendor contract limits data access. Vendor is solvent.
  **Phase 2: Gap Diagnosis**
  *   **Test A (Answerability):** Pass. Data science audit confirms data mismatch.
  *   **Test B (Liability):** **Gap-L Present.** Vendor contract limits liability for "algorithmic performance." Hospital bears patient harm costs; Vendor bears no financial penalty.
  *   **Test C (Repair):** **Gap-R Present.** Hospital cannot retrain model. Vendor refuses patch without new contract.
  *   **Diagnosis:** **Gap-L and Gap-R.**
  **Phase 3: Allocation**
  *   **Explain:** Chief Data Officer (Publish bias report to staff).
  *   **Repair:** Chief Medical Officer (Role). Since Vendor will not fix, Hospital must disable model for Group X patients and revert to manual triage.
  *   **Liability:** Hospital Administration (Absorb cost of harm; pursue legal separately).
  *   **Value Flag:** Panel decided that statistical fairness outweighs efficiency gains. Panel decided patient consent for data use did not cover cross-hospital demographic extrapolation.
  *   **Unallocatable:** Vendor accountability (Outside panel authority).

  ## Case 3: Surgical Robot (Unauthorized Update)
  **Incident:** Manufacturer pushed software update changing force limits after Hospital Biomed approved earlier version. Robot exerted excess force; tissue damage occurred.
  **Phase 1:** Logs show update timestamp. Vendor is active but claims "security patch" exemption from approval workflow.
  **Phase 2: Gap Diagnosis**
  *   **Test A (Answerability):** Pass. Logs identify update as cause.
  *   **Test B (Liability):** **Gap-L Present.** Vendor contract indemnifies "security patches." Hospital bears harm cost.
  *   **Test C (Repair):** **Gap-R Present.** Hospital cannot block vendor updates remotely; Vendor refuses to rollback.
  *   **Diagnosis:** **Gap-L and Gap-R.**
  **Phase 3: Allocation**
  *   **Explain:** Vendor Liaison Officer (Role) must demand explanation from Vendor.
  *   **Repair:** **Hospital Biomedical Director (Role).**
      *   *Operational Logic:* Since the Vendor cannot be forced to repair and the system remains dangerous, the local role with physical access must implement a workaround (e.g., manual force monitoring) or disconnect the robot.
      *   *Philosophical Resistance Note:* This allocation resists moral intuition. The Hospital Biomed team did not cause the error and lacks technical authority to change the code. However, under OPRA, if the Vendor (who has capacity) refuses repair, the **Repair Gap** remains open unless assigned to the local operator. To close the gap, the burden shifts to the Hospital, effectively punishing the victim of the update to ensure safety.
  *   **Liability:** Hospital Administration (Absorb cost).
  *   **Value Flag:** Panel decided that "security" does not supersede "safety approval" workflows. Panel decided to tolerate higher surgical delay rather than risk unverified force limits.
  *   **Unallocatable:** Vendor software control (Cannot be allocated to Hospital staff, only monitored).

  ---

  # Procedural Notes on Edge Cases

  **Missing Logs:**
  If logs are missing, do not attempt forensic recovery. Mark **Gap-A**. Assign **Explanation Duty** to the Department Head who allowed the system to run without logging. This incentivizes future logging.

  **Defunct Contractor:**
  If the designer is defunct, mark **Gap-L** and **Gap-R**. Assign **Liability** to the Institution. Assign **Repair** to "Decommission/Replace" duty held by the Procurement Role. Do not assign repair to engineering staff if parts are unavailable.

  **Hybrid Systems (Vendor + Workflow + Clinician):**
  Treat the handoff points as the system boundary.
  *   If Vendor tool fails -> Vendor gaps (shifted to Hospital if Vendor unreachable).
  *   If Workflow fails -> Hospital Role gaps.
  *   If Clinician Judgment fails -> Individual Role gaps (unless obscured by system).
  *   *Metaphysics Clause:* If the panel debates whether the AI "decided" or the human "decided," stop. Ask: "Who can explain the output?" If neither, **Gap-A**. Assign explanation duty to the system owner.

  **Value Questions:**
  The panel must explicitly record when they are setting a tolerance level.
  *   *Example:* "We assign monitoring duty to Nursing, acknowledging this adds 5 minutes per patient."
  *   *Example:* "We assign liability to Hospital, acknowledging this reduces funds for other departments."
  These are not facts; they are policy choices recorded in the Value Flag section.

  **Named Person vs. Role:**
  *   **Role:** "Head of Radiology." Used for system fixes, policy changes, and budget absorption.
  *   **Named Person:** Used only for specific training remediation if a specific individual lacked competence known to leadership.
  *   **Rule:** Default to Role. Named assignments require HR consultation outside this panel.

  \answer{institutional-absorption}
