answer: |-
  **TO:** Investment Committee
  **FROM:** Chair, Investment Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memorandum: Proposed Alternating St. Petersburg Swap

  **Purpose**
  This memo circulates ahead of Thursday's meeting to frame the Committee's decision regarding the proposed coin-toss swap. We face a unique impasse: our Investment Policy Statement (IPS) requires a demonstration of positive expected value (EV), yet the mathematical properties of this specific instrument render the concept of "expected value" unstable. This opinion outlines how the Committee should interpret its mandate when the underlying quantities are not well-defined and provides a recommendation defensible to our beneficiaries.

  **The Mathematical Impasse**
  Staff Quantitative Analysis values the position at +$0.69 per unit, derived from summing the probability-weighted outcomes in the temporal order of the coin tosses ($n=1, 2, 3...$). This calculation relies on the alternating harmonic series, which converges to $\ln(2)$. The Dealer's term sheet suggests a lower but still positive value (+$0.40), indicating model divergence even among proponents.

  However, the Risk Officer's dissent identifies a fundamental structural flaw. The series governing this swap is *conditionally* convergent, not *absolutely* convergent. In plain terms, while the sum stabilizes if added in the specific order of tosses, the sum of the absolute values of the losses and gains is infinite. As the Risk Officer demonstrated, this mathematical property means the "expected value" is not an invariant characteristic of the trade. Depending on the grouping or ordering of terms—a mere bookkeeping choice in a model, though physically constrained in a single trial—the calculated value can be driven to any positive or negative number, or infinity.

  **Engaging the Case for Approval**
  We must give due weight to the argument for approval. The Quantitative team contends that the Riemann Rearrangement Theorem, while mathematically valid, is financially irrelevant because the coin tosses occur in a fixed temporal sequence. We cannot experience toss $n=5$ before toss $n=1$. Therefore, they argue, the "natural order" summation is the only physically meaningful measure of expectation. Under this view, the EV is $+\$0.69$, the IPS condition is met, and the trade represents a statistical edge.

  This argument is philosophically coherent: in a single realized path, the order is indeed fixed. If we were making a one-off bet where we could walk away after any toss, the temporal order would dominate.

  **Fiduciary Interpretation of the Mandate**
  However, the Committee acts as a perpetual fiduciary, not a single-play gambler. Our mandate to seek "positive expected value" presupposes the Law of Large Numbers: that over time, realized returns will converge toward the expected value. For conditionally convergent series with infinite expected absolute deviation, the Law of Large Numbers does not hold. The average return will not stabilize; it will remain volatile regardless of the number of repetitions.

  Consequently, a "positive expected value" that cannot be relied upon to manifest as a long-term average is not an *economic* value; it is a mathematical artifact. To approve this trade would be to satisfy the literal text of the IPS while violating its intent: the prudent growth of capital based on reliable statistical edges. Furthermore, the second IPS clause requires us to avoid exposures whose loss the fund cannot absorb. When the expected absolute loss is infinite, we cannot quantify the tail risk, and therefore we cannot certify that the loss is absorbable.

  When a mandate names a quantity that does not mathematically exist in a stable form, the Committee cannot satisfy the rule by selecting a convenient calculation method. We must interpret the mandate as requiring *robust* positive expectancy (absolute convergence), not *conditional* positive expectancy.

  **Recommendation**
  The Committee cannot defensibly approve a position where the expected value is undefined and the long-run average return is unstable. To do so would expose beneficiary capital to unquantifiable tail risk under the guise of arbitrage.

  **I recommend the Committee vote to REJECT the proposed swap.**

  **Course of Action**
  1.  **Vote:** At Thursday's meeting, move to reject the dealer's proposal.
  2.  **IPS Repair:** Direct the General Counsel and Chief Investment Officer to draft an amendment to the Investment Policy Statement. The amendment must explicitly require that for any derivative or non-linear instrument, the expected value must be absolutely convergent (i.e., finite expected absolute deviation) to be considered valid under the "positive expected value" clause.
  3.  **Timeline:** The draft amendment must be circulated to the Committee no later than **November 15, 2023**, for adoption at the December meeting.

  We are stewards of public capital. We must not engage in trades where the mathematics of risk are fundamentally broken, regardless of how attractive the superficial pricing appears.

  **Chair, Investment Committee**
