  4.  **Refining the Conflict (The Ledger's Categories):**
      *   The prompt says: "discover that the ledger's own categories... are themselves contested."
      *   So, Elara needs to find a footnote or a marginalia in the ledger, or cross-reference a dictionary of old terms, realizing that "Tithe" meant something different then than now, or that the word used implies a consent that wasn't there.
      *   Let's use the word "Exchange." Valerius calls it an Exchange. The ledger says "Ex." But who defined what was exchanged?

  5.  **Drafting - Focus on Sensory Details:**
      *   Dust, light, the smell of old paper, the glow of the screen, the sound of the patron's voice, the physical act of writing.
      *   Avoid abstract musings like "She realized history is subjective." Instead: "She looked at the word 'Loan' and crossed it out. She wrote 'Levy.' Then she crossed that out."

  6.  **Writing - Section by Section (Mental Outline):**

      *   *Opening:* Elara in the archive room. The two books. The silence.
