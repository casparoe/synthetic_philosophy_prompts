answer: |-
  The dust in the archive room did not float; it hung, suspended in the shaft of afternoon light that cut across Elara's desk. On the left lay the *Memoirs of High Founder Valerius*, bound in cracked leather that smelled of vanilla and decay. On the right lay the *Iron Register*, a folio of stiff, grey paper covered in columns of ink so dark it seemed to absorb the light.

  Elara rubbed her eyes. The Commission's letter sat beneath her keyboard, the seal of the Council still embossed on the heavy cream stock. *The Centennial approaches,* Minister Halloway had written. *The people require a foundation they can stand upon. We require the truth, unvarnished.*

  Unvarnished. Elara looked at Valerius's *Memoirs*. She opened to Chapter Four, *The Winter of Sacrifice*.

  *"We did not take,"* Valerius wrote, his prose swelling with the rhetoric of inevitability. *"We gathered. When the frost took the southern fields, the Valley Clans understood that survival required a single fist, not five open hands. They brought their grain to the storehouse not out of fear, but out of a shared vision of the Commonwealth."*

  It was smooth, moral, complete. It explained why the Commonwealth existed. It explained why Valerius led.

  Elara turned to the *Iron Register*. She found the corresponding date: Year 2, Month 11, Day 4.

  *Entry 4490: Receipt. Grain (Wheat). Quantity: 400 Stone. Source: Valley Clans. Classification: Tithe.*

  She read it again. *Tithe.*

  She pulled up the digital scan of the field notes on her second monitor. These were the scraps found in the lining of the Register's cover, used as stuffing. A clerk's scratchy hand. *Day 4. Valley delivery. Guards present? Yes. Compulsion noted?*

  Elara leaned back. The chair creaked in the silence. If guards were present, was it a tithe? In the legal code of Year 2, a tithe was religiously voluntary. A levy was mandatory. But the word in the Register was *Tithe*.

  She typed a draft sentence on her screen. *The Valley Clans contributed grain under the established system of tithes.*

  She deleted it.

  *The Valley Clans transferred grain under the classification of tithes.*

  She deleted that too. The verb was the trap. *Contributed* implied agency. *Transferred* was sterile, but hid the mechanism. Valerius said they understood survival required a single fist. The Register said grain moved from Point A to Point B. The field note said guards were present.

  Her comms unit buzzed. Minister Halloway. She let it go to voicemail, but the red light pulsed like a heartbeat. She knew what he would say. He had said it at the kickoff dinner. *We are not looking for reasons to doubt, Elara. We are looking for reasons to endure.*

  She went back to the Register. She needed to understand the word *Tithe*. She accessed the Etymological Database, searching for usage in Year 2.

  The results fractured. In the public decrees of Year 2, *Tithe* was defined as "A free-will offering to the Common Store." But in the internal administrative memos of the Founder's Council, dated three months prior to the Winter of Sacrifice, the definition shifted. *Tithe: The required portion of harvest designated for state redistribution.*

  The ledger wasn't a raw record. It was a translation. The clerk who had written *Tithe* in the Iron Register hadn't been recording what happened; he had been recording what Valerius had decided to call what happened. The neutral ground was an illusion. The ledger was just another narrative, stripped of adjectives but loaded with categories.

  Elara stood and walked to the window. The city of Ostra sprawled below, gleaming with solar glass and steel. They believed they were built on consent. If the grain was seized, the foundation was built on force. If the grain was given, it was built on unity. The physical reality was the same: the grain moved, the people ate, the Commonwealth survived. But the moral weight rested entirely on the label.

  She returned to the desk. The cursor blinked on the screen. *The Valley Clans...*

  She opened the field notes again. *Compulsion noted?* The question mark was faint. It could be a stain.

  If she wrote *seized*, the Council would reject the manuscript. They would claim she was digging up ghosts to haunt the living. Halloway would say she was breaking the social contract. If she wrote *contributed*, she was lying. She was echoing Valerius's justification rather than the event.

  But was there an event separate from the justification? The grain existed. The hunger existed. The guards existed. But the meaning—the *why*—was gone. It had evaporated with the breath of the people who stood in the snow. All that remained was the ink.

  Her comms buzzed again. A text message this time. *Draft deadline is Friday. The printers need time. Do not make us choose between history and harmony.*

  Elara sat down. She opened the *Memoirs* again. She read the next paragraph. *"There were those who whispered of coercion. To them, I say: look at the children who did not starve. Does the hand that feeds ask permission of the mouth?"*

  Valerius knew. He knew the argument would arise. He had preempted it with morality. He made the outcome justify the method.

  Elara looked at the Register. *Classification: Tithe.*

  She opened a new file. *Appendix C: Terminological Disputes.* She began to type. *The term 'Tithe' appears in the Iron Register with high frequency during the Founding Period. Contemporary analysis suggests the term carried dual connotations...*

  She stopped. That was cowardice. That was hiding the ambiguity in a footnote where no one would read it. The Commission wanted a definitive account. They wanted her to settle the question. They wanted her to be the judge Valerius had been.

  She thought of the Valley Clans. They were gone now, assimilated into the greater populace. Their descendants lived in the lower districts. They celebrated Founding Day. They sang the anthems Valerius wrote. If she wrote *seized*, what did that give them? A grievance? Or a validation?

  If she wrote *contributed*, what did that give them? A lie? Or a shared myth that held the city together?

  The light in the room shifted. The dust motes began to sink as the sun dipped below the skyline. The room grew grey.

  Elara highlighted the word *Tithe* in her draft. She stared at it. It was a vessel. She could pour whatever meaning she wanted into it, but the shape was fixed by the source. She couldn't change the source. She could only describe it.

  She deleted *Tithe*.

  She typed *Allocation*.

  It was dry. It was bureaucratic. It implied a decision made by someone else. It didn't say whether the Clans agreed, but it didn't say they volunteered. It removed the moral gloss of *Tithe* without asserting the violence of *Seizure*.

  But was it true? *Allocation* suggested a system. The system existed. The grain was allocated.

  She looked at the field note again. *Guards present?*

  She typed: *The grain was allocated to the Common Store.*

  She paused. She added: *Valerius records this as a voluntary tithe.*

  She paused again. That put the lie on Valerius, not on the event. It framed the Register as the fact and the Memoirs as the spin. But the Register was also spin. The Register used the word *Tithe*.

  Elara closed the field notes. She closed the *Memoirs*. She left only the blank page of her manuscript open.

  She thought about the Commission's demand for a definitive account. They wanted the past to be a stone block, solid and unmoving. But the past was water. It took the shape of the container. She was the container now.

  Her finger hovered over the key. The red light on the comms unit pulsed again, steady, demanding.

  She thought of the children who did not starve. She thought of the guards in the snow. She thought of the word *Tithe*, heavy with holiness, written by a clerk who might have been shaking.

  Elara moved her cursor back to the sentence. She deleted *Allocated*.

  She typed: *The grain entered the storehouse.*

  It was passive. It was physical. It refused to assign intent. It refused to assign virtue. It simply stated that the grain moved from the outside to the inside.

  She read it over. *On Day 4, the grain entered the storehouse.*

  It felt incomplete. It felt like a sentence waiting for a verdict. The reader would ask: *How? Why?*

  Elara looked at the *Memoirs*. She looked at the Register. She realized she could not answer the question without becoming Valerius. To explain *why* was to impose a narrative. To explain *how* was to choose a side.

  She typed the next sentence. *Valerius called it a tithe. The ledger records it as such. The presence of guards is noted in marginalia.*

  She left it there. She did not connect the dots. She did not draw the line between the guards and the tithe. She laid the evidence on the table like exhibits in a court where the judge had recused herself.

  The room was dark now. She turned on the desk lamp. The circle of light illuminated the keyboard, the screen, and the two books.

  She saved the file. *Founding_Account_Draft_12.*

  She picked up the phone and dialed Halloway. He answered on the first ring.

  "Elara. Do you have it?"

  "I have the draft," she said. Her voice sounded thin in the quiet room.

  "Is it... stable?" Halloway asked. "Can we print it?"

  "It's accurate," she said.

  "Accurate," he repeated. The word hung on the line. "Does it support the narrative of unity?"

  "It supports the evidence," Elara said.

  "There will be questions."

  "Yes."

  "Can you answer them?"

  Elara looked at the sentence on the screen. *The grain entered the storehouse.* She knew that tomorrow she would look at it and want to change it. She knew that next year, someone else would find a new box of scraps and say she was wrong. She knew that the Council would edit the phrasing before publication, softening the edges, perhaps reinserting the word *Tithe* without the marginalia note.

  She knew there was no definitive account. There was only this moment, this light, this choice.

  "I will answer them," Elara said.

  "Good," Halloway said. "Send it over."

  Elara ended the call. She did not close the document. She left the cursor blinking at the end of the sentence, a small, steady rhythm in the dark. She reached out and touched the cracked leather of Valerius's *Memoirs*, then ran her finger over the grey stiff paper of the Register. She sat there for a long time, watching the dust settle on the pages, waiting for the morning light to change the shape of the shadows.
