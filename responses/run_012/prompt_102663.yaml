answer: |-
  ### The Costly Signal Decision Procedure

  **Theory in Plain Language:** A signal is only proof of hidden quality (like persistence) if it is *harder* for a low-quality candidate to produce than for a high-quality one. If a weak candidate can easily do the same thing, the signal is noise. If money makes the cost trivial, the signal measures wealth, not grit. If the cost builds skills rather than wasting resources, it is an investment, not a handicap.

  **Instructions:** Apply these five questions in order. Do not proceed to the next question if the inquiry ends at the current step. Mark "Human Judgment" where the file lacks data and a committee member must use context or proxy indicators.

  #### 1. The Differential Cost Test
  *Question:* Is this action significantly harder for a candidate *without* persistence to complete than for one *with* it?
  *   **Sufficient Answer:** Yes. The action requires sustained effort or忍受 (endurance) that a "quitter" would not sustain (e.g., years of labor, irreversible reputation risk).
  *   **Disqualifying Answer:** No. The action is easily reversible or requires only a one-time payment of money without ongoing effort. **Verdict:** Discount signal to near zero.
  *   **Human Judgment:** If the "difficulty" depends on external market conditions (e.g., job market health) not in the file.

  #### 2. The Saturation Test
  *Question:* Is this action now standard practice for nearly all applicants to this program?
  *   **Sufficient Answer:** No. It distinguishes this applicant from the pool.
  *   **Disqualifying Answer:** Yes. If 80%+ of applicants do this, it is an entry fee, not a signal. **Verdict:** Discount signal to near zero.
  *   **Human Judgment:** If you lack data on the wider applicant pool's behavior.

  #### 3. The Wealth Buffer Test
  *Question:* Would this cost feel trivial to an applicant with substantial family wealth or savings?
  *   **Sufficient Answer:** No. The cost is psychological, reputational, or time-based, which money cannot easily fix.
  *   **Disqualifying Answer:** Yes. The cost is primarily financial and absorbable by the wealthy. **Verdict:** Signal indicates resources, not persistence. Discount heavily unless financial need is documented.
  *   **Human Judgment:** If wealth is not disclosed. Use proxy indicators (institution type, unpaid internships, geographic mobility) to estimate.

  #### 4. The Waste vs. Work Test
  *Question:* Does the cost destroy value (waste) or create value (investment)?
  *   **Sufficient Answer:** Mixed or Waste. Pure "handicaps" (burning money) prove commitment but poor judgment. "Investments" (building skills) prove capacity but may be affordable.
  *   **Disqualifying Answer:** Pure Waste. If the action destroys assets without building capacity, it signals desperation, not judgment. **Verdict:** Flag for risk.
  *   **Human Judgment:** Determining if the "investment" yields skills relevant to *this* fellowship.

  #### 5. The Absence Override
  *Question:* If the applicant presents *no* costly signal, is there independent, verifiable evidence of completion (e.g., long-term track record)?
  *   **Sufficient Answer:** Yes. A history of finishing hard things without dramatic sacrifice. **Verdict:** Accept candidate; signal absence is neutral.
  *   **Disqualifying Answer:** No. No signal and no track record. **Verdict:** Reject.
  *   **Human Judgment:** Weighing the quality of the track record against the lack of current sacrifice.

  ***

  ### Application to Three Files

  **Applicant A: The Job Quitter**
  *   **Action:** Left a secure, high-paying job to work full-time on the proposal.
  *   **Procedure Run:**
      1.  *Differential Cost:* **Human Judgment.** Is the job market hot? If they can re-enter easily, cost is low. Assume moderate difficulty.
      2.  *Saturation:* **Pass.** Not everyone does this.
      3.  *Wealth Buffer:* **Fail.** If they have savings, income loss is manageable. File shows substantial prior earnings.
      4.  *Waste vs. Work:* **Mixed.** Creates a resume gap (waste) but buys time (investment).
  *   **Verdict:** **Moderate Signal.** The committee will likely rate this higher, but the procedure flags it as wealth-dependent and potentially reversible.

  **Applicant B: The Self-Funded Data Collector**
  *   **Action:** Spent a year of personal savings ($40k) to collect preliminary data.
  *   **Procedure Run:**
      1.  *Differential Cost:* **Pass.** Requires organization and endurance.
      2.  *Saturation:* **Pass.** Rare among applicants.
      3.  *Wealth Buffer:* **Fail.** $40k is trivial for wealthy applicants, impossible for poor ones. This signals *wealth* more than *grit*.
      4.  *Waste vs. Work:* **Investment.** Produces valuable assets.
  *   **Verdict:** **Weak Signal of Persistence, Strong Signal of Resources.** The committee will likely rate this as "high commitment." The procedure dictates you discount it as a measure of grit because the cost is not differential for the wealthy.

  **Applicant C: The Falsifiable Claim (The Hardest Case)**
  *   **Action:** Publicly staked a specific milestone (e.g., "I will solve X by Date Y") and offered to forfeit a donation or reputation if failed.
  *   **Procedure Run:**
      1.  *Differential Cost:* **Pass.** High reputational risk for a weak candidate who will fail.
      2.  *Saturation:* **Pass.** Extremely rare.
      3.  *Wealth Buffer:* **Pass.** Reputation risk applies to all; financial forfeit is scaled.
      4.  *Waste vs. Work:* **Investment.** Aligns incentives.
  *   **Verdict:** **Strongest Signal.** This is a binding contract, the most credible form of signaling.

  ***

  ### The Unpopular Verdict

  **The committee will dislike the verdict on Applicant B (The Self-Funded Data Collector).**

  **Why:** Your committee currently views spending personal savings as the ultimate proof of "belief in the project." You treat it as a sacrifice. This procedure reveals it is often a **purchase of progress**. A wealthy applicant can spend $40k without feeling the "cost" that a poorer applicant feels spending $5k. By following this procedure, you must downgrade Applicant B's "grit" score because their signal is contaminated by wealth. You are effectively penalizing an applicant for having the resources to do good work, in favor of measuring their suffering. This contradicts the folk intuition that "money spent equals passion felt." Defending this to the board requires admitting that your current metric favors privilege, not persistence.

  ***

  ### Limitations and Responsibilities

  This procedure cannot settle three critical questions. These remain your responsibility, even if you follow the steps perfectly:

  1.  **Hidden Wealth:** The procedure relies on detecting wealth buffers. Applicants hide wealth. You must decide what proxy indicators (e.g., undergraduate institution, unpaid prior work) count as evidence of a safety net. The procedure tells you *to ask*, not *how to know*.
  2.  **Luck vs. Skill:** A candidate may have persistence but fail due to bad luck. A costly signal proves they *tried*, not that they *succeed*. You must decide how much risk of failure you are willing to fund.
  3.  **The "No Signal" Elite:** Step 5 allows for candidates with no costly signal. The procedure validates them, but it does not tell you *who* they are. Identifying high-capacity candidates who did not need to signal requires your own expertise in the field.

  **Final Note to the Board:** This procedure does not select the best candidates. It selects the candidates whose *commitment* is most verifiable. It protects you from funding the wealthy who play at sacrifice and the desperate who play at risk. It does not protect you from your own bias in judging the "Human Judgment" steps. That remains on you.
