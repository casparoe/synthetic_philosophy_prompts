prompt: |-
  I'm a student in a Chinese philosophy seminar, and for my final paper I want to read William Golding's Lord of the Flies through the Mencius–Xunzi dispute about human nature. Assume the novel is familiar; I don't need plot summary or quotation. The question I keep circling is whether the island is evidence for Xunzi or for Mencius, and I suspect the usual answer—that the boys' savagery vindicates Xunzi—is too quick. Mencius can say the sprouts were present and were starved by fear rather than disproved; Xunzi can say the island lacks exactly what his theory says goodness requires: inherited ritual, teachers, and the transforming work of deliberate effort. What I want is a reading that puts both thinkers on the island as rival interpreters of the same scenes and asks which account is less ad hoc. Consider, in particular, the initial assembly and its rules, the fire and the conch, the first hunt and the dance, Simon's insight about the beast, Piggy's glasses, and the final rescue. Where does the novel genuinely favor one thinker, where does it resist both, and where does it dramatize something neither argument captures—perhaps that moral cultivation is fragile in a way that is neither innate depravity nor merely bad upbringing? End by saying what the novel adds to the debate that philosophical argument alone does not.

  After the reading, append a brief structured summary as a JSON object with these fields: "thesis" (one sentence stating your overall verdict), "mencius_strength" (a number from 0 to 1 for how well Mencius explains the novel), "xunzi_strength" (a number from 0 to 1), "decisive_scene" (an object with "scene", "favors", and "why"), "hardest_case" (the scene or fact that most resists your verdict), and "novel_contribution" (one or two sentences). Keep the prose reading to roughly 800–1000 words before the JSON.
