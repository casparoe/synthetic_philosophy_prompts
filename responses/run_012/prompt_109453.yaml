answer: |-
  Good morning. Looking around this room, I see two distinct groups. On one side, there are those who spent years arguing with Ruth about axioms and inference engines. On the other, there are those who knew her for the way she tied into a rope, or how she listened at a dinner table, or simply because she was family. I know the tension in this room. The experts are worried I will trivialize her work; the family is worried I will obscure the woman behind the work.

  Ruth spent her career on the frame problem.

  I am not going to explain what that means technically. Instead, I want to use the shape of it to talk about why we are here. To describe anything that changes—a world, an institution, a person—you have to say two things. You have to say what the change alters, and you have to say what it leaves alone.

  The first part is easy. We can list the events. We can list the publications, the promotions, the moves from one house to another. We can list the specific moments where something different happened. But the second part is the whole of the difficulty, because there is no finite way to write down everything that stays the same. Any inventory of what doesn't change is either incomplete or absurd. If I pick up this pen, I do not need to state that the wall behind me has not turned blue, that the floor has not become liquid, that the year has not reset. We rely on the inertia of the world to make sense of the action.

  Ruth used to say that this was not a defect in our formalisms but a fact about the world. She said that the largest part of anything is the part you cannot list.

  We are here because a change has occurred. The standard move in a room like this is to reach for the list of what she was. We reach for the adjectives. Her kindness. Her stubbornness. Her handwriting. The way she drank her coffee. This list is what everyone reaches for, and it is always incomplete and slightly false. It treats a life as a series of discrete updates, ignoring the background against which those updates made sense.

  The honest thing is that what did not change is the largest part of her. It is the context in which her actions landed. It is the stability she offered without announcing it. It cannot be enumerated, and that is not a failure of love but the shape of it. To know someone is not to catalog their properties; it is to inhabit a world where their presence is a constant variable. When that variable is removed, we are not just left with a gap in the data. We are left with the sudden, overwhelming burden of having to specify everything that no longer holds.

  Her older son asked me, before he knew what I was planning to say, not to turn his mother into a thought experiment. I have promised him I won't. Ruth was not a puzzle to be solved, and her life was not a proof to be completed. But she taught us that ignoring the background doesn't make it disappear. It just makes the foreground unintelligible.

  For the collaborators here: you know that she never tolerated hand-waving. She demanded precision because she knew that vagueness is where the errors hide. She would not want us to pretend that the difficulty of representing inertia is something magic. It is hard work.

  For the family and friends here: you know that she never tolerated pretense. She demanded honesty because she knew that flattery is where the connection breaks. She would not want us to pretend that grief is something we solve. It is hard work.

  In both cases, the demand is the same. Do not list the changes and pretend you have described the world. Acknowledge the weight of what stays put.

  For the last fifteen years of her life, she kept an index card taped to the edge of her monitor. It was headed, in her handwriting: *things that don't need updating*.

  She rewrote it every January. She did not share the contents with us. She did not need to. The card was not for us. It was a reminder that in a system constantly requiring new axioms, there are some truths that remain valid regardless of the state of the world.

  The card is still there. The tape has dried at the corners. The ink is faded. It is taped to the edge of a monitor that is now turned off.
