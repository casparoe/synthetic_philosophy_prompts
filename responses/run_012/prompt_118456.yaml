  2.  **Drafting the Requirements (The Spec):**
      *   *Requirement 1: Arbitrariness.* The core feature of a convention is that there *could* have been another way. (Case: Driving left vs. right).
      *   *Requirement 2: Normative Force (Bindingness).* It's not just what people *do*, it's what they *ought* to do. You get mad if someone cuts the queue. (Case: Queuing, Forks).
