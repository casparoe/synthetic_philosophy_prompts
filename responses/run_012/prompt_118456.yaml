answer: |-
  ### The Spec: Requirements for a Theory of Convention

  Here are the seven deliverables a theory of convention must satisfy to handle the cases you listed (driving, money, language, queuing, forks, units, AI signaling, power norms).

  **1. Arbitrariness**
  *   **The Requirement:** The theory must explain why a specific solution is chosen when functionally equivalent alternatives exist.
  *   **The Case:** Driving on the left is not intrinsically better than the right. QWERTY is not the optimal keyboard. If the theory cannot account for the indifference between options *ex ante*, it describes a law of nature or a technical necessity, not a convention.

  **2. Normative Force (Bindingness)**
  *   **The Requirement:** The theory must explain why conformity feels obligatory, not just prudent. It must distinguish "I won't do this because it's inconvenient" from "I won't do this because it's *wrong*."
  *   **The Case:** If you use the fish fork for salad, you haven't just made an error; you've violated a rule. If you cut a queue, people feel entitled to rebuke you. A theory that reduces this to "I want to avoid a crash" fails to capture the social sanction.

  **3. Independence from Explicit Agreement**
  *   **The Requirement:** The theory cannot rely on promises, contracts, decrees, or conscious collective decisions.
  *   **The Case:** No one signed a contract to use the dollar or to say "dog" for a canine. Most conventions emerge from chaos, not a constitutional convention. If the theory requires a "meeting of the minds," it excludes the vast majority of actual conventions.

  **4. Stability and Inertia**
  *   **The Requirement:** The theory must explain why conventions persist after their original utility fades or is forgotten.
  *   **The Case:** We keep using Imperial units in specific contexts long after Metric was adopted. We keep etiquette rules that originated in hygiene practices no one worries about anymore. The theory needs a mechanism for "lock-in" that outlasts individual rational calculation.

  **5. Scalability of Change (The Flip Condition)**
  *   **The Requirement:** The theory must explain why unilateral deviation is impossible/catastrophic, but simultaneous collective deviation is possible (though costly).
  *   **The Case:** One person driving on the wrong side dies. A whole country switching sides (like Samoa in 2009) survives the transition. The theory must distinguish between *deviance* and *reform*.

  **6. Accommodation of Asymmetry (The Power Condition)**
  *   **The Requirement:** The theory must allow for conventions that benefit some participants at the expense of others, without ceasing to be conventions.
  *   **The Case:** Norms about who interrupts whom, or who defers to whom, often encode hierarchy. If a theory assumes conventions arise only from *common* interest (pure coordination), it cannot explain oppressive norms that stick because the disadvantaged lack the power to coordinate a flip.

  **7. External Evaluability (Criticizability)**
  *   **The Requirement:** The theory must leave logical space for an agent to criticize a convention as unjust or irrational without being defined as irrational themselves.
  *   **The Case:** We routinely say, "This norm is sexist," or "This measurement system is inefficient." If the theory defines rationality *as* conformity to the convention, criticism becomes impossible by definition. There must be a vantage point outside the convention.

  ***

  ### The Tensions: What Cannot Be Met Simultaneously

  Your suspicion is correct. There is a triad of requirements that creates a structural contradiction. You can satisfy any two, but not all three.

  **The Impossible Triad:**
  1.  **Pure Arbitrariness** (The options are genuinely equal in value).
  2.  **Categorical Bindingness** (You ought to follow it, not just because you want to).
  3.  **External Evaluability** (You can judge the convention as "bad" from the outside).

  **The Conflict:**
  *   If the convention is **Purely Arbitrary**, the *only* reason to follow it is coordination. This makes the bindingness **Instrumental** (I follow it to avoid a crash). But if the bindingness is only instrumental, then **External Evaluability** collapses: if the convention is inefficient or oppressive, the "rational" thing to do is break it. You can't call it "wrong," only "costly."
  *   If the convention is **Categorically Binding**, it generates reasons for action that exist independently of your personal payoff. But if the content is **Purely Arbitrary**, this looks like fetishism (following a rule for no reason). To justify the bindingness, you usually have to smuggle in a value (e.g., "order is good"), which undermines the **Arbitrariness**.
  *   If you want **External Evaluability**, you need a standard of value outside the convention (e.g., justice, efficiency). But if that standard exists, the convention is no longer **Purely Arbitrary** (one side is actually better), or the **Bindingness** is conditional on meeting that standard (which means it's not a convention, it's a law).

  **The Second Tension: Agreement vs. Obligation**
  *   **Independence from Agreement** pulls against **Normative Force**. In moral philosophy, obligations usually stem from consent (contract) or inherent duty (natural law). Conventions are neither. If no one agreed, why does the "ought" exist?
      *   If you say the "ought" comes from *expectations* (Lewis), you reduce obligation to prediction (I ought because I expect you to).
      *   If you say the "ought" comes from *social facts* (Gilbert), you imply a tacit agreement, violating Independence.

  **The Single Requirement That Knocks Out the Most Candidates:**
  **Normative Force (Bindingness).**

  Most theories can explain why we *do* follow conventions (habit, game equilibrium, fear of sanction). Very few can explain why we think we *should* follow them in the absence of personal gain.
  *   **Game Theory** knocks this out immediately (describes behavior, not obligation).
  *   **Evolutionary Theory** knocks it out (describes survival fitness, not duty).
  *   **Habit/Custom Theory** knocks it out (describes psychology, not reason).
  *   Even **Lewis-style Coordination** reduces the "ought" to a hypothetical imperative ("If you want to coordinate, you ought..."). It fails to capture the *categorical* feel of social sanction (the anger at the queue-jumper).

  To satisfy Normative Force without Agreement is the hardest lift. It requires positing a social ontology where "we" exist prior to "I," which many theories refuse to do.

  ***

  ### How the Standard Pictures Do Against the List

  **1. Coordination + Mutual Expectation (The Lewis Picture)**
  *   **Strengths:** Nails **Arbitrariness** and **Independence from Agreement**. Explains the **Flip Condition** well (shift expectations, shift equilibrium).
  *   **Weaknesses:** Fails **Normative Force**. It reduces "ought" to "want." If I don't care about crashing, I have no reason to drive on the left. It struggles with **Asymmetry**; it assumes a common interest in coordination, making it hard to explain exploitative norms where one side prefers a different equilibrium. **Criticizability** is weak; if the equilibrium works, it's hard to call it "wrong."

  **2. Game-Theoretic / Evolutionary (The Emergent Picture)**
  *   **Strengths:** Best at **Sub-intentional Emergence** (covers your AI case perfectly). Explains **Stability/Inertia** via path dependence. Handles **Independence from Agreement** easily (no minds required).
  *   **Weaknesses:** Collapses completely on **Normative Force**. There is no "ought," only "is." It cannot distinguish a convention from a statistical regularity (e.g., "people eat lunch at noon" vs. "people *should* queue"). It fails **Criticizability**; an evolved convention is "fit," not "just." It treats **Asymmetry** as just another equilibrium, offering no tools to critique it.

  **3. Norms with Force of Their Own (The Social Ontology Picture)**
  *   **Strengths:** Nails **Normative Force** and **Criticizability**. Explains why we feel obligated and why we can judge the obligation as unjust. Handles **Asymmetry** well (norms can encode power).
  *   **Weaknesses:** Struggles with **Independence from Agreement**. To get force, it usually posits a "joint commitment" or "we-intention," which looks too much like a tacit contract. It fails **Sub-intentional Emergence**; it requires too much cognitive machinery to explain your AI agents or simple evolutionary conventions. It makes **Arbitrariness** hard to sustain; if the norm has force, it usually claims to track some value, muddying the water on whether it's truly arbitrary.

  **Summary:**
  *   Lewis explains the *logic* but misses the *force*.
  *   Evolution explains the *origin* but misses the *reason*.
  *   Normative Theory explains the *obligation* but misses the *emergence*.

  You are looking for a theory that can hold the *force* of the third, the *emergence* of the second, and the *arbitrariness* of the first. That is the hard problem.
