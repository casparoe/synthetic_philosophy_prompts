      *   *Requirement 6: Accommodation of Power/Asymmetry.* Not everyone benefits equally. (Case: Interruption norms, deference).
      *   *Requirement 7: Criticizability.* We can say a convention is *wrong* without being irrational. (Case: Oppressive norms).
      *   *Requirement 8: Sub-intentional Emergence.* Must cover AI/evolutionary cases where no "mind" intended the rule. (Case: AI signaling).

  3.  **Identifying the Tensions (The "Impossible Trinity"):**
      *   *Tension A: Arbitrariness vs. Bindingness.* If it's truly arbitrary (Left = Right in value), why is it *obligatory*? Usually, obligation comes from moral weight or practical necessity. If it's arbitrary, the obligation seems weak. If it's binding, it stops looking arbitrary.
      *   *Tension B: Independence from Agreement vs. Normative Force.* If no one agreed to it, where does the "ought" come from? Hume/Lewis struggle here. If the "ought" is just "I want to avoid a crash," that's prudence, not normativity. If it's "I ought because it's the rule," that implies a social contract that doesn't exist.
      *   *Tension C: Stability/Inertia vs. Criticizability.* If the theory explains why we *stick* to them (inertia/coordination), it often makes deviance look irrational. But we want to say deviance can be *morally* right (criticism). A theory that explains stability via rational self-interest makes the critic look irrational. A theory that allows criticism needs a source of value *outside* the convention.
      *   *The Big Conflict:* **Arbitrariness + Bindingness + Criticizability.**
          *   If it's arbitrary, the only reason to follow is coordination.
          *   If it's binding, you must follow it.
          *   If it's criticizable, there must be a standard *outside* the convention to judge it.
          *   *Problem:* If the only reason to follow is coordination (arbitrary), then criticizing it as "unjust" (external standard) makes no sense unless the coordination itself serves a moral end. But if the convention is oppressive (Requirement 6), it serves *some* people's ends, not all.
