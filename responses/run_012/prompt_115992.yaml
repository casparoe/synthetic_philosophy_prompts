answer: |-
  # Specification for an Account of Self-Locating Credence

  ## I. Formal Constraints
  These requirements concern the mathematical and logical structure of the credence function. They define what it means to be a rational agent, regardless of the specific indexical puzzle.

  **1. Probabilistic Coherence**
  *   **Specification:** The agent's credences must satisfy the standard axioms of the probability calculus (non-negativity, normalization, finite additivity).
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** Without coherence, an agent's degrees of belief cannot be represented as probabilities, rendering the formalism mathematically incoherent.

  **2. Empirical Conditionalization**
  *   **Specification:** In cases where no indexical uncertainty is present (i.e., the agent knows exactly who and when they are), the rule must reduce to standard Bayesian conditionalization on new evidence.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** Self-locating rules are extensions of standard epistemology, not replacements. If I see a red card, my credence that the card is red must go to 1, regardless of how many observers exist.

  **3. Diachronic Reflection**
  *   **Specification:** An agent's current credence in a proposition should equal their expected future credence in that proposition, provided they anticipate no irrationality or memory loss. $C_t(A) = \sum C_t(C_{t+1}(A)=x) \cdot x$.
  *   **Status:** **Non-negotiable (with exceptions for amnesia).**
  *   **Motivation:** Violating this implies the agent knows their future self will be systematically biased, which undermines the rationality of the current belief. However, this constraint must be relaxed or modified in cases involving memory loss (e.g., Sleeping Beauty).

  **4. Dutch Book Immunity**
  *   **Specification:** The rule must not assign credences that allow a bookie to construct a series of bets that guarantee a loss for the agent, even if the bookie knows the agent's updating rule and memory schedule.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** Vulnerability to a Dutch book indicates a pragmatic inconsistency between belief and action. In indexical cases, the bookie may exploit knowledge of how many times the agent is asked to bet (e.g., twice on Tails, once on Heads).

  **5. Decision-Theoretic Usability**
  *   **Specification:** The rule must yield credences that can be directly plugged into a standard decision rule (e.g., expected utility maximization) to prescribe actions *during* the uncertainty, not just in hindsight.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** A theory of credence that cannot guide betting or action in the middle of a puzzle (such as offering odds on a coin toss while awake in the Sleeping Beauty case) fails to connect belief to behavior. If the credences imply one betting strategy but the "correct" action implies another, the account is broken.

  ## II. Substantive Constraints
  These requirements concern how the rule handles specific metaphysical and empirical scenarios. They test the rule's output against intuitive or theoretical boundaries.

  **6. The Amnesia Constraint (Sleeping Beauty)**
  *   **Specification:** The rule must assign a determinate credence to the coin landing Heads upon awakening, given a fair coin, one awakening on Heads, two on Tails, and amnesia between awakenings.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** This is the canonical test case for indexical uncertainty. The rule must not remain silent or contradictory. It must resolve the tension between the prior probability of the coin (1/2) and the frequency of awakenings (1/3).

  **7. The Doomsday Constraint**
  *   **Specification:** The rule must handle the inference from one's birth rank (e.g., being the 100 billionth human) to the total size of the population without entailing that imminent extinction is overwhelmingly probable solely based on that rank.
  *   **Status:** **Commitment of the SIA Camp (Avoid Doomsday) / Commitment of the SSA Camp (Accept Doomsday).**
  *   **Motivation:** The Doomsday Argument suggests that finding oneself early in the sequence of all humans makes a short future more likely. An adequate account must either validate this inference or explain why it fails, without arbitrary stipulation.

  **8. The Presumptuous Philosopher Constraint**
  *   **Specification:** The bare fact of one's existence must not overwhelmingly favor hypotheses that posit vastly more observers, to the extent that empirical data is rendered irrelevant.
  *   **Status:** **Commitment of the SSA Camp (Avoid Presumption) / Commitment of the SIA Camp (Accept Presumption).**
  *   **Motivation:** If a theory implies we can reject a physical theory positing 1 trillion observers in favor of one positing 1 trillion trillion observers simply because we exist, it allows armchair reflection to settle empirical physics. Most find this unacceptable, but some argue it is the correct price of avoiding Doomsday.

  **9. The Reference Class Stability**
  *   **Specification:** The rule's output should not vary wildly based on minor changes to the definition of the "reference class" (e.g., counting all humans vs. only conscious humans vs. all observer-moments vs. including aliens or AIs).
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** If the probability of a coin toss depends on whether we count "observers" or "observer-moments," or whether we include potential Martian observers, the rule is too sensitive to metaphysical vagueness to be useful.

  **10. The Infinity Handling**
  *   **Specification:** The rule must yield defined probabilities in scenarios with infinitely many observers (e.g., an eternal inflation cosmology), without relying on arbitrary cutoffs.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** Modern cosmology suggests the universe may be infinite. A rule that breaks or yields undefined ratios (0/0) in infinite contexts is scientifically useless for the problems it was designed to solve.

  **11. The Cosmological Constraint (Boltzmann Brains)**
  *   **Specification:** The rule must not entail that we are likely to be random fluctuations (Boltzmann Brains) rather than evolved observers, given a theory that predicts vastly more fluctuations than evolved observers.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** If a cosmological theory predicts that typical observers are disembodied brains with false memories, and the rule forces us to conclude we are likely such brains, the theory becomes self-undermining. The rule must allow us to reject such theories based on the coherence of our experience.

  **12. The Duplication and Branching Constraint**
  *   **Specification:** The rule must handle cases where an agent is physically copied or branches (e.g., quantum splitting) without contradiction regarding the identity of the pre-branch agent and the post-branch copies.
  *   **Status:** **Non-negotiable.**
  *   **Motivation:** As technology and physics advance, the possibility of exact duplication becomes a serious conceptual test. The rule must specify how credence is distributed among identical copies who will immediately diverge in experience.

  ## III. The Incompatibility Theorem

  It is a structural feature of the landscape that **no rule can satisfy all the above requirements simultaneously.** Specifically, there is a forced conflict between the **Presumptuous Philosopher Constraint**, the **Doomsday Constraint**, and **Empirical Conditionalization** in infinite or large-number contexts.

  **The Conflict:**
  1.  To avoid the **Doomsday Argument** (Requirement 7), one must adopt a rule that favors hypotheses with more observers (because being a random observer is more likely in a larger population). This is the Self-Indication Assumption (SIA) approach.
  2.  However, if one favors hypotheses with more observers, one inevitably violates the **Presumptuous Philosopher Constraint** (Requirement 8). One is forced to accept that the mere fact of existing makes theories with vastly more observers more probable, allowing armchair reasoning to override physical evidence.
  3.  To avoid the **Presumptuous Philosopher**, one must adopt a rule that does not favor hypotheses based on observer count (SSA).
  4.  However, if one does not favor hypotheses based on observer count, one inevitably accepts the **Doomsday Argument**, because finding oneself "early" in a small population is not balanced by the higher likelihood of existing in a large population.

  Furthermore, **Diachronic Reflection** (Requirement 3) is logically incompatible with **Amnesia Handling** (Requirement 6) under standard conditionalization. If an agent knows they will forget which day it is (Sleeping Beauty), their current credence cannot equal their expected future credence if the future credence is updated on indexical information ("I am awake now") that they will later lose. One must choose between preserving Reflection or preserving the intuition that waking up provides no new non-indexical evidence.

  **The Most Eliminative Requirement:**
  The **Presumptuous Philosopher Constraint** does the most work in eliminating candidates. It is the hardest constraint to satisfy without triggering the Doomsday conclusion. Most formalisms that successfully block the Presumptuous Philosopher (by ignoring observer counts) immediately fall prey to Doomsday. Most that block Doomsday (by counting observers) immediately fall prey to the Presumptuous Philosopher. A rule that claims to avoid both usually hides a contradiction in its handling of the Reference Class or Infinity constraints.

  ## IV. Novel Test Case: The Altruistic Wager

  To separate leading rules, consider **"The Altruistic Wager."**

  **The Setup:**
  A fair coin is tossed.
  *   **Heads:** One agent is created in a Red Room.
  *   **Tails:** One million agents are created in Red Rooms.
  All agents are identical, have the same memories, and know the setup. They cannot communicate.
  Each agent is offered a bet: Pay $100 now. If Heads, receive $1,000,000. If Tails, receive $0.
  Crucially, the agent is **altruistic**: they value the total utility of all agents created in their branch. If Heads, there is 1 agent to benefit. If Tails, there are 1,000,000 agents to benefit.

  **The Question:**
  Should the agent take the bet?

  **The Test:**
  This case tests the link between **Credence** and **Decision Value** (Requirements 4 and 5) under the **Presumptuous Philosopher Constraint** (Requirement 8).
  *   **SSA (Self-Sampling):** Credence in Heads is ~1/2. Expected utility is positive. **Take the bet.**
  *   **SIA (Self-Indication):** Credence in Tails is ~1,000,000 to 1. Expected utility is negative. **Reject the bet.**
  *   **The Conflict:** If you reject the bet (SIA), you are acting as if Tails is certain. But if Tails is certain, why did you need a coin toss? This case reveals whether the rule treats observer count as *evidence* (SIA) or as a *payoff multiplier* (SSA/Decision-Theoretic). A rule that says "Credence is 1/2 but don't bet" or "Credence is 1/1,000,000 but do bet" fails the Usability constraint.

  ## V. Scorecard

  **The Self-Sampling Assumption (SSA)**
  *   **Performance:** SSA satisfies the Presumptuous Philosopher Constraint by treating one's existence as a random sample from a fixed reference class, preventing observer counts from swamping physical evidence. It handles Empirical Conditionalization well.
  *   **Failure:** It fails the Doomsday Constraint, entailing that we should expect the end of humanity soon based solely on birth rank. It also struggles with the Reference Class Stability requirement; small changes in who counts as an "observer" drastically shift probabilities. In the Altruistic Wager, it prescribes betting strategies that ignore the sheer number of beneficiaries in the Tails world.

  **The Self-Indication Assumption (SIA)**
  *   **Performance:** SIA satisfies the Doomsday Constraint by weighting hypotheses by the number of observers they contain, neutralizing the birth-rank inference. It handles the Reference Class more robustly in some formulations.
  *   **Failure:** It fails the Presumptuous Philosopher Constraint, allowing the mere fact of existence to overwhelmingly favor massive universes, effectively settling cosmology from the armchair. In the Altruistic Wager, it leads to rejecting a bet with massive positive expected value for the group, prioritizing "where am I" credence over total welfare.

  **The "No Special Uncertainty" View (Centered Worlds/Standard Bayesian)**
  *   **Performance:** This view denies that self-locating credence requires new rules, treating "I am here now" as a standard proposition. It preserves Probabilistic Coherence and Standard Conditionalization strictly.
  *   **Failure:** It struggles with the Amnesia Constraint (Sleeping Beauty), often yielding counter-intuitive results (e.g., credence 1/2) that violate Dutch Book Immunity when memory is lost. It frequently fails the Decision-Theoretic Usability requirement in branching cases, as it cannot easily distinguish between "the world is such that I am here" and "I am here," leading to paralysis in the Altruistic Wager where the number of "I"s matters.
