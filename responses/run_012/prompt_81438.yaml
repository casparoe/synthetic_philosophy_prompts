          *   *Standard Reply:* Disjunctivists (like M.G.F. Martin) argue that the *nature* of the experience is constituted by the object. In the good case, the object is a constituent. In the bad case, it is not. The "kind" is defined by the metaphysical structure, not the phenomenology.
          *   *Cost:* The cost is accepting that phenomenology does not exhaust the nature of experience. This is the "transparency" intuition vs. the "constituency" claim. The author thinks this is question-begging. It *is* question-begging against the sense-datum theorist, but that's the point of the standoff. The author's dilemma isn't a trap; it's the statement of the opposing view.

