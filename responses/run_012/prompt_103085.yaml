  *Wait, a better angle for A:* A can argue that the disagreement about conciliationism is *not* a perfect peer disagreement because the steadfast theorist is making a category error. Or, simpler: A admits it's a challenge but argues that B's view leads to "epistemic egoism." Let's go with the idea that B's view makes the concept of a peer incoherent.

  *Revised plan for Self-Undermining:* B raises it. A acknowledges it's the "hard case." A argues that if she conciliates on conciliationism, she suspends judgment on how to handle the auditor case, which *is* a form of conciliation (she stops believing she should be steadfast). So she remains consistent.

