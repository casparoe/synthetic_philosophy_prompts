      **Akrasia and Level-Splitting**
      Is level-splitting coherent? This is the claim: "I believe $p$, but I believe my evidence doesn't support $p$." Structurally, this is unstable. Belief aims at truth guided by perceived evidence. If you genuinely judge that your evidence fails to support $p$, sustaining belief in $p$ requires ignoring your own normative assessment. This is epistemic akrasia.

