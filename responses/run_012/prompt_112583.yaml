      *   Perfect. SEC says X, HOES says Y for Agent B. For Agent A (reliable), credences stay 70/30, so both approaches say X.
      *   This isolates the variable: Reliability evidence changes the verdict for B but not A.

  4.  **Drafting the Content:**
