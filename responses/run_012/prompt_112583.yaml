      *   Need HOE difference: A's credences are reliable (stick); B's credences are unreliable (need discounting/shrinking towards indifference or uniform distribution).
      *   Need divergence: SEC says do X for both (since credences same). HOES says A does X, B does Y (because B's credences are discounted, changing the weighted value).
