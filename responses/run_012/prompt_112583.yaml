answer: |-
  **Brainstorm**

  *   **Resource Allocation:** Two clinicians decide whether to fund a costly drug. Theory 1 maximises aggregate survival; Theory 2 prioritises equality of access. Credences favour Theory 1, but payoffs are close. Reliability evidence shifts the weighted value below the threshold for funding.
  *   **Consent Override:** Two administrators consider overriding a patient's refusal. Theory 1 permits paternalism for significant benefit; Theory 2 forbids it absolutely. Credences lean towards paternalism. Reliability evidence suggests the agent overestimates benefit magnitude or moral permission.
  *   **Triage Priority:** Two nurses assign the last ICU bed. Theory 1 saves the youngest; Theory 2 saves the most vulnerable. Credences favour the youngest. Reliability evidence indicates the agent's judgment is skewed by implicit bias, requiring credence dampening that flips the priority.

  **The Case**

  Clinicians A and B sit on a hospital committee deciding whether to authorise Treatment Z for a competent patient who has refused it. Both face identical empirical facts: Z offers a 70% chance of full recovery (value +10) but requires physical restraint (value -20 under rights-based views, 0 under welfare views). Both assign 70% credence to Welfare Maximisation (T1) and 30% to Rights Inviolability (T2). Both face the same choice: Authorise (Act D) or Respect Refusal (Act P). A possesses a track record showing her moral intuitions correlate strongly with peer consensus and outcomes; B possesses evidence of systematic overconfidence and poor calibration in similar ethical judgments. The stakes, information, and first-order moral credences are identical; only the higher-order evidence regarding their respective reliability differs.

  **Analysis**

  **Verdicts**
  The Simple Expected-Choiceworthiness (SEC) rule calculates value using only first-order credences. For both A and B, the expected value of Act D is (0.7 × 10) + (0.3 × -20) = 1, while Act P is 0. SEC prescribes Authorising (Act D) for both. The Higher-Order-Evidence-Sensitive (HOES) rule adjusts credences based on reliability. For A, credences remain 0.7/0.3, so HOES agrees with SEC. For B, the evidence of unreliability mandates a regression toward indifference; her effective credences shift to 0.55/0.45. Under HOES, B's expected value for Act D becomes (0.55 × 10) + (0.45 × -20) = -3.5. HOES prescribes Respecting Refusal (Act P) for B. Thus, for Agent B, the two approaches deliver opposite verdicts.

  **The Feature Doing the Work**
  The divergence arises from the *sensitivity of the expected value to credence shifts near the indifference point*. The payoff structure is such that the negative value under T2 is double the positive value under T1. This ensures that a relatively small discount in confidence regarding T1 (from 0.7 to 0.55) flips the sign of the expected value from positive to negative. The case relies on the asymmetry of moral stakes across theories combined with credences that are confident enough for SEC but fragile enough for HOES.

  **If That Feature Is Removed**
  If the negative value under T2 were reduced (e.g., to -5), the expected value would remain positive even after discounting B's credences. Both approaches would then agree on Authorising. Conversely, if the initial credences were higher (e.g., 0.9/0.1), the discount required to flip the verdict would be unrealistically large given ordinary evidence of unreliability. The case only works because the moral uncertainty is substantial and the stakes are asymmetrically weighted.

  **The Objection**
  A defender of SEC would attack the case by arguing that moral credences are not analogous to empirical probabilities. They might claim that once an agent has reflected and assigned a credence of 0.7, that figure *already incorporates* all available evidence about their own reliability. To discount it further is to double-count the uncertainty or to engage in a vicious regress where one must have confidence in one's confidence. They would argue B's evidence of unreliability should have been integrated into the first-order credence assignment initially; if it wasn't, the error is in the formation of the credence, not in the decision rule.

  **Position**
  The HOES verdict is correct. Treating moral uncertainty as purely first-order ignores the epistemic status of the agent. Moral judgments are truth-apt claims about the world (or about reasons), and like any cognitive judgment, they are subject to calibration errors. If B knows she is systematically overconfident, maintaining a 0.7 credence is irrational regardless of how strongly she feels the intuition. To act on uncalibrated confidence is to gamble with moral stakes one does not genuinely understand. Modelling moral uncertainty as uncertainty about one's own reliability is necessary to prevent dogmatism; we must discount the weight of our moral convictions when we have independent reason to doubt our capacity to judge them correctly.
