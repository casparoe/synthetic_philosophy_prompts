          *   Difference: Higher-order evidence (HOE) about own moral reliability (A: reliable/correlated with truth; B: unreliable/uncorrelated).
          *   Two approaches must deliver opposite verdicts: (i) Simple Expected Choiceworthiness (SEC) using first-order credences; (ii) Higher-Order-Evidence-Sensitive (HOES) rule adjusting credences.
          *   Setting: Ordinary, non-philosophical (hospital ethics committee context implied by user, but prompt says "ordinary, non-philosophical setting" - I should stick to the hospital context since the user mentioned joining one, but keep it grounded).
