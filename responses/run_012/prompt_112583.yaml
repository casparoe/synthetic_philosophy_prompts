      *   *Idea 2: Consent.* Two administrators deciding whether to override a patient's refusal. Theory 1: Paternalism (benefit outweighs autonomy). Theory 2: Liberalism (autonomy absolute). Both 50% credence. A is calibrated; B is not.
      *   *Idea 3: Triage.* Two nurses deciding who gets the last ventilator. Theory 1: Save the youngest. Theory 2: Save the most likely to survive. Both 50% credence. A is experienced; B is novice with known bias.
