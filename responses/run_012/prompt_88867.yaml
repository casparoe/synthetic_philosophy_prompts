answer: |-
  ### Preliminary Notes on the Phenomenon

  "Dirty hands" is not merely the commission of a wrong for a right end; that is standard consequentialist calculation. Nor is it simply the tragedy of a moral dilemma where every option violates a duty. The specific phenomenon of dirty hands (DH) is the **normative residue** that adheres to the agent *even after* the act has been justified as necessary. It is the claim that an office-holder can be simultaneously justified in acting and culpable for having acted. The "dirt" is the stain of having violated a deep constraint (usually one protecting persons or truth) that cannot be fully washed away by the goodness of the outcome.

  Regarding your collected material: Cases **1 (Core Case)**, **2 (Residue)**, and **5 (Price)** are constitutive of the concept. Without the paradox of "wrong but right" and the lingering stain, you have only "lesser evil" reasoning. Case **4 (Agency)** is the deepest theoretical hurdle regarding legitimacy. Case **8 (Ex Ante)** is the most dangerous constraint for your project; it threatens to dissolve the phenomenon entirely. Cases **3**, **6**, and **7** are elaborations necessary for a robust theory but secondary to the structural paradox. I count 1, 2, 4, 5, and 8 as the critical load-bearing walls; if any fall, the structure collapses.

  ***

  ### Requirements for an Adequate Theory of Dirty Hands

  1.  **The Paradox Constraint**
      *   **Motivation:** Case 1 (Core Case).
      *   **Status:** *Non-Negotiable.*
      *   **Specification:** The theory must articulate how an act can be morally obligatory (or permissible) for the office-holder while simultaneously constituting a moral violation that generates culpability. It cannot resolve the tension by declaring the act simply "right" (which cleans the hands) or simply "wrong" (which forbids the act).

  2.  **The Residue Specification**
      *   **Motivation:** Case 2 (Dirt > Cost) & Case 5 (The Price).
      *   **Status:** *Non-Negotiable.*
      *   **Specification:** The theory must identify the "dirt" as a normative status distinct from regret, financial cost, or political fallout. It must specify whether this residue entails a duty to suffer (punishment, resignation) or merely a duty to acknowledge guilt. It must explain why the justification does not extinguish the blame.

  3.  **The Differentiation Clause**
      *   **Motivation:** Case 3 (Neighbours).
      *   **Status:** *Non-Negotiable.*
      *   **Specification:** The theory must distinguish DH from: (a) simple utilitarian lesser-evil reasoning (where hands remain clean if the math works); (b) moral dilemmas where no right answer exists (DH implies there *is* a right thing to do, but it stains); and (c) private wrongdoing (the office must be causally or constitutively relevant).

  4.  **The Agency/Principal Problem**
      *   **Motivation:** Case 4 (Citizens' Name).
      *   **Status:** *Non-Negotiable.*
      *   **Specification:** The theory must explain why the moral liability attaches to the agent's character/record rather than being absorbed by the collective principal (the citizens). If the act is done *for* us, why are *her* hands dirty? If they are ours, why is she the one who pays?

  5.  **The Scope Condition**
      *   **Motivation:** Case 7 (Mundane Range).
      *   **Status:** *Non-Negotiable.*
      *   **Specification:** The theory must apply to routine administrative violations (budget lies, rationing rules) and not solely to extreme emergencies (ticking bombs). If the theory only works for emergencies, it is a theory of war, not a theory of *office*.

  6.  **The Character Variable**
      *   **Motivation:** Case 6 (Risk/Pleasure).
      *   **Status:** *Camp Preference.*
      *   **Specification:** *Virtue-Ethics Camp:* The theory must weigh the agent's internal state (reluctance vs. pleasure) as constitutive of whether hands are dirty. *Deontological Camp:* The act itself dirties the hands regardless of the agent's emotional state. (I mark this preference because a theory of *office* should ideally judge the act's relation to the role, not just the psyche, but ignoring motive risks licensing sadists).

  7.  **The Ex Ante Action-Guidance Demand**
      *   **Motivation:** Case 8 (Ex Ante) & Your Purpose.
      *   **Status:** *Non-Negotiable (For Your Purpose).*
      *   **Specification:** The theory must provide criteria usable *before* the act to determine if a DH situation is obtaining. It cannot rely on hindsight to validate the necessity of the wrong. It must guide deliberation under uncertainty.

  ***

  ### Incompatibility Analysis

  **There is a joint unsatisfiability between Requirement 1 (Paradox), Requirement 2 (Residue), and Requirement 7 (Ex Ante Guidance).**

  **Confidence:** High (0.85).

  **The Argument:** The phenomenon of Dirty Hands relies on the *exceptionality* and the *retrospective recognition* of the violation. The "dirt" exists because a deep, usually absolute, constraint has been breached for the sake of necessity.
  *   If you satisfy **Req 7 (Ex Ante)**, you are effectively creating a rule or a policy exception ("In conditions X, Y, and Z, torture is authorized").
  *   If there is a rule authorizing the act, the act is no longer a violation of a deep constraint; it is a permitted function of the office.
  *   If the act is permitted by the theory *in advance*, the hands are not dirty (**Req 2 fails**). The residue vanishes because the agent has followed the moral law as specified by your theory.
  *   If you insist the hands remain dirty despite the ex ante authorization, you render the guidance incoherent ("Do this, it is the right thing, but you are culpable for doing it"). While this satisfies **Req 1**, it fails as practical guidance because it demands the agent accept culpability for following the theory's own advice.

  **Verdict:** You cannot have a theory that *normalizes* the exception (Ex Ante Guidance) without *cleaning* the hands (destroying the Residue). To make DH usable in advance is to turn it into Lesser Evil Utilitarianism. To keep the Hands Dirty is to admit that the decision cannot be fully theorized in advance.

  ***

  ### The Exclusionary Requirement

  **Requirement 2 (The Residue Specification)** does the most work to exclude standard positions.

  *   **Consequentialism:** Excluded immediately. For a consequentialist, if the act produces the best outcome, the hands are clean. There is no residue. The "cost" is in the outcome, not on the soul/record of the agent.
  *   **Absolutism (Deontology):** Excluded because it cannot satisfy Req 1. An absolutist cannot say "it was right to do." They must say "do not do it, even if the world burns." They avoid dirty hands by refusing the act, not by theorizing the dirt.
  *   **Standard Virtue Ethics:** Struggles here. A virtue ethicist typically argues that a truly virtuous agent would find a way not to violate the constraint, or that violating it corrupts the agent such that they can no longer rule well. Req 2 demands the agent *remain* in office but bear the stain, which is a specific political configuration not native to standard virtue theory.

  ***

  ### Smuggled Assumptions & Critical Pushback

  **1. The Smuggle of "Office" as a Moral Shield.**
  Requirement 4 (Agency) smuggles in the assumption that the *office* creates a distinct moral topology. It assumes the politician is not just a citizen with a job. If you reject this—that there is no "role morality" distinct from ordinary morality—then Dirty Hands dissolves into ordinary wrongdoing. You must commit to the claim that public office alters the moral permissions and burdens of the agent, or the entire project collapses into private ethics.

  **2. The Coherence of Your Purpose.**
  I must push back on your stated purpose: *"a theory usable in advance by a real official."*
  If I am honest, **this purpose is likely incoherent with the phenomenon of Dirty Hands.**
  DH is fundamentally a *retrospective* judgment of tragedy. It is what we say about leaders *after* they have saved the city by breaking the law. To ask for an *ex ante* manual is to ask for a way to sanitize the dirt before it touches you.
  *   **If you insist on Ex Ante Guidance:** You will get a theory of "Authorized Exceptions." It will be useful, but it will not be Dirty Hands. It will be Machiavellianism or Rule-Utilitarianism.
  *   **If you insist on Dirty Hands:** You must tell the official, "You cannot know for sure. If you do this, you *might* be saving us, but you *will* be violating a constraint. You must decide without a guarantee that the dirt will be worth it."

  **Recommendation:**
  Do not promise a theory that guides deliberation to a clean conclusion. Promise a theory that clarifies the *structure of the burden* the official is about to undertake. The theory should not tell them *whether* to get their hands dirty (that is the gamble of office); it should tell them *what it means* if they do.

  **Confidence on Incompatibility:** I am 85% confident that Ex Ante Guidance destroys the Residue. The remaining 15% allows for a "presumptive" theory (e.g., "Presume constraints are absolute unless catastrophe is imminent"), but even then, the *dirt* only appears if the presumption is overridden, which is a judgment call that resists codification.

  **Final Verdict:** If you require the theory to license the act in advance without ambiguity, you must abandon the "Dirty Hands" metaphor. You are writing about **Public Necessity**, not Dirty Hands. Dirty Hands requires the sting of the retrospective stain. Choose: do you want to help them decide, or do you want to explain the cost of the decision? You cannot fully do both.
