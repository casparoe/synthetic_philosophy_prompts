answer: |-
  This is a classic formulation of the **Pessimistic Meta-Induction (PMI)**, most famously associated with philosopher Larry Laudan. Your intuition is spot-on: the argument is powerful, but conclusion (7) is self-defeating.

  If your friend claims (7) is a "feature, not a bug," they are adopting a pragmatic or therapeutic stance (like a philosophical ladder you kick away after climbing). But if they claim the argument is *sound* and *true*, they are trapped in a performative contradiction.

  Here is where you should break the argument, why it fixes your problem, and what it costs you.

  ### The Breaking Point: Step (2) or the Inference to (7)

  You should reject the move from **(5) to (7)**, which relies on the uniformity assumption in **(2)**.

  Here is why: **Premise (1) contradicts Conclusion (7).**

  *   **Premise (1)** claims: "Past theories... turned out to be **false**."
  *   **Conclusion (7)** claims: "No scientific theory... is ever **justified** in what it says about reality."

  To assert (1) as a fact of history, you must be justified in believing that phlogiston *does not exist* and that the ether *does not exist*. You are making a claim about the unobservable structure of reality (i.e., that it lacks phlogiston). If (7) is true, you are not justified in believing (1). If you aren't justified in believing (1), the argument collapses.

  Your friend cannot simultaneously claim we are never justified in believing theories about reality *and* claim to know as a fact that past theories were false about reality.

  ### How to Cut the Knot

  You have two main options to preserve humility without embracing total skepticism.

  #### Option A: Reject Step (2) (The "Relevant Difference" Move)
  You accept that past theories were false, but deny that there is "no independent way of telling the difference" between then and now.

  *   **The Argument:** Science is not a static list of guesses; it is a convergent process. Newton didn't have particle accelerators, gravitational wave detectors, or the mathematical framework of gauge invariance. We have independent ways of checking consistency (e.g., different experimental methods converging on the same constant).
  *   **The Cost:** You lose "radical humility." You have to admit that *some* current posits (like electrons or spacetime curvature) are likely more robust than phlogiston. You have to argue that the "base rate" of survival improves as methodology improves.
  *   **Why it helps:** It allows you to say the phlogiston folks were *unjustified* (or less justified) because their methods were weaker, while we are *more* justified, even if not certain.

  #### Option B: Reject the Inference to (7) (The "Asymptotic Realism" Move)
  You accept (5) (we should be humble about current theories) but deny (6) and (7).

  *   **The Argument:** Even if every past theory was strictly false, they might be *approximately true* or getting *closer* to the truth. Newtonian mechanics is "false" (because of relativity), but it's not as false as Aristotelian physics. It survives as a limiting case.
  *   **The Cost:** You have to adopt a view of truth that allows for degrees (verisimilitude) rather than a binary true/false.
  *   **Why it helps:** It saves the idea of progress. The phlogiston people were wrong, but Lavoisier was *less* wrong, and we are *less* wrong still. This validates your intuition that we are justified in thinking they were wrong.

  ### The "Feature, Not a Bug" Claim

  Your friend claims the argument applies to itself. This is the **Self-Refutation Objection**.

  If the argument is sound, then the argument itself (which is a philosophical theory about the unobservable nature of justification and reality) is not justified.
  *   If they say, "This argument is true," they violate (7).
  *   If they say, "This argument is not true, but useful," they are admitting it doesn't prove realism is *dead*, only that it's psychologically useful to doubt it.

  You can tell your friend: *"If this argument applies to itself, then I am not justified in believing the conclusion. If I'm not justified in believing the conclusion, I have no reason to abandon realism. You've sawed off the branch you're sitting on."*

  ### A Middle Ground: Structural Realism

  If you want to keep (1) (history is full of dead entities) and keep humility, but reject (7) (total skepticism), look into **Epistemic Structural Realism**.

  *   **The View:** When theories change, the *entities* (phlogiston, ether) often vanish, but the *mathematical structure* (equations, relationships) is often preserved.
  *   **Example:** The Fresnel equations for light worked perfectly in the Ether theory. When the Ether was ditched, the equations were kept for Electromagnetic Fields.
  *   **The Compromise:** We are not justified in believing our *ontology* (the "stuff" the theory says exists) is final, but we *are* justified in believing the *structure* (the relations and predictions) captures something real about the world.

  ### Summary of Advice

  1.  **Do not give up (1).** It is historically accurate.
  2.  **Do not give up (5).** Humility is virtuous.
  3.  **Give up (2) and (7).**
      *   Reject **(2)** by arguing that modern methods (intervention, manipulation, cross-verification) provide a relevant difference between us and the phlogiston theorists.
      *   Reject **(7)** by pointing out the self-refutation: If (7) is true, we can't know (1) is true.
  4.  **The Cost:** You must concede that science likely *does* track truth, at least approximately or structurally. You cannot be a total skeptic. You have to believe that *some* knowledge of the unobservable is possible, otherwise, you can't even state the argument.

  Tell your reading group: *"I agree we shouldn't be dogmatic realists. But to use history to prove we can't know reality, I have to assume I know the history of reality. I can't have it both ways. I'll take the humility, but I'm keeping the progress."*
