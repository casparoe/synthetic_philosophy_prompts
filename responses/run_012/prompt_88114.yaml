answer: |-
  Right, let's sort this out. You've been wrestling with one of the technical heavyweights of contemporary philosophy of language, and it is entirely predictable that you've come away with a headache. Your mate is speaking the lingo of David Chalmers and Frank Jackson; you are speaking the lingo of Saul Kripke. The friction arises because they are trying to do two different jobs with the same tools.

  Here is the verdict, without the diplomatic fluff.

  ### 1. The Contradiction Charge: You are wrong.
  Your mate is right about the logic, though she has been terrible at explaining *why*. You are treating "necessary" and "contingent" as monolithic properties that a proposition possesses *simpliciter*. In two-dimensional (2D) semantics, they are not. They are relational properties, like "left" and "right".

  A object can be to the left of a tree and to the right of a car simultaneously without contradiction. Similarly, in 2D semantics, a statement can be necessary relative to one dimension and contingent relative to the other. There is no formal inconsistency here, provided you accept the framework's definitions.

  Here is the "worlds considered as actual" bit your mate mumbled about, properly unpacked:

  *   **Secondary Intension (The Kripkean Dimension):** We fix our world as the **actual** world. In our world, water is H2O. Now we ask: in other *counterfactual* worlds, is water H2O? Since 'water' rigidly designates H2O (thanks to Kripke), the answer is yes. In every world where water exists, it is H2O. Therefore, "Water is H2O" is **metaphysically necessary**. This preserves Kripke's insight.
  *   **Primary Intension (The Epistemic Dimension):** We do *not* fix our world as actual. We consider other worlds *as if they were the actual world*. Imagine a world (call it Twin Earth) where XYZ flows from the taps, fills the lakes, and is called 'water' by the locals. If *that* world were the actual one, the term 'water' would refer to XYZ, not H2O. Therefore, the statement "Water is H2O" would be false. Since there is a coherent scenario where the statement comes out false, it is **epistemically contingent**.

  The contradiction dissolves because the two claims are not about the same thing. The secondary intension asks, "Given how things *are*, what follows?" The primary intension asks, "Given how things *might turn out to be*, what would we mean?"

  So, on the charge of logical inconsistency: your mate wins. You are collapsing the dimensions by applying a one-dimensional modal operator to a two-dimensional framework.

  ### 2. The Descriptivism Charge: You are right to be suspicious.
  This is where your instinct is sharper than your mate's. You asked if the primary intension is just "resurrected descriptivism". The short answer is: **Yes, functionally.**

  Kripke's great achievement was to sever the link between *meaning* (description) and *reference* (the object). He showed that I can refer to Aristotle without knowing a unique description that fits him. Your mate's framework sneakily reattaches that link via the primary intension.

  In 2D semantics, the primary intension of 'water' is indeed something like "the clear, drinkable liquid around here". This is precisely the description theory Kripke flattened. If the primary intension determines the reference of the term in a world considered as actual, then reference *is* determined by satisfaction of a description.

  However, 2Dists (like Chalmers) will argue this doesn't "collapse" Kripke's view because they distinguish between **epistemic content** (primary) and **metaphysical content** (secondary). They argue Kripke was right about metaphysics (water is necessarily H2O) but that there remains an *epistemic* puzzle (how we identify water) which requires a descriptivist tool.

  But you have hit the genuine fault line here. Many Kripkeans (notably Scott Soames) argue exactly what you are suggesting: that 2D semantics is a desperate attempt to save Fregean descriptivism after Kripke killed it. If the primary intension fixes reference, then the reference is descriptive. If the reference is descriptive, then Kripke's argument that names are not descriptions is undermined, at least for natural kind terms.

  So, while the theory isn't *logically* inconsistent (as per point 1), it is philosophically costly. It buys its consistency by accepting a form of descriptivism that many believe was rightly buried.

  ### The Final Ruling

  **On the logic:** Your mate is correct. There is no contradiction in saying a proposition is necessary on one intension and contingent on the other. You are misapplying a one-dimensional modal logic to a two-dimensional system. The phrase "worlds considered as actual" is not mumbo-jumbo; it is the technical mechanism for varying the reference-fixing context.

  **On the philosophy:** You are correct. The primary intension *is* a form of descriptivism. Whether this "collapses" the whole project depends on whether you think Kripke refuted descriptivism *entirely* or just refuted it as an account of *metaphysical necessity*.
  *   If you think Kripke showed that reference is *never* fixed by description, then 2D semantics is indeed a refuted view in disguise.
  *   If you think Kripke only showed that reference is not fixed by description *across counterfactual worlds*, then 2D semantics survives by limiting descriptivism to the epistemic realm.

  **My advice:** Tell your mate she wins on the formal logic, but you win on the metaphysical cost. The framework is consistent, but it only works by swallowing a pill that Kripkeans refuse to take. You haven't gone round the bend; you've just spotted the price of admission.
