answer: |-
  # Joint Statement on Causation: Adversarial Collaboration Draft
  **Authors:** [Name A] (Counterfactualist) & [Name B] (Interventionist)
  **Date:** October 26, 2023
  **Subject:** Status of Disagreement and Path Forward

  ## 1. Agreed Claims
  *We jointly affirm the following substantive claims regarding the nature of our inquiry and the phenomena any adequate theory must address.*

  1.  **Difference-Making Core:** We agree that causation is fundamentally a matter of difference-making. Any viable theory must capture the intuition that causes make a difference to their effects, distinguishing causal relations from mere correlations or logical entailments.
  2.  **Rejection of Simple Regularity:** We both reject Humean simple regularity accounts. Constant conjunction is insufficient for causation; modal force (what *would* happen) is required.
  3.  **The Problem Set:** We agree that any theory must provide principled verdicts on the standard suite of problem cases: early and late preemption, symmetric overdetermination, double prevention, causation by omission/absence, and the question of transitivity. A theory that dismisses these as "pseudo-problems" without explaining away the intuition is inadequate.
  4.  **Paradigm Agreement:** In standard, non-pathological cases of singular causation (e.g., a stone throwing breaks a window; a spike in pressure triggers a valve), our frameworks issue the same verdict. We agree on the extension of the term "cause" in the vast majority of ordinary and scientific contexts.
  5.  **Shared Primitives:** We admit that neither framework is fully reductive in the strictest sense.
      *   The Counterfactualist relies on a primitive similarity metric over possible worlds to evaluate counterfactuals.
      *   The Interventionist relies on a primitive notion of "intervention" (or "testing condition") which is itself characterized causally.
      *   We agree that if one framework is guilty of circularity or primitiveness, the other likely is as well, though we disagree on whether this is vicious.
  6.  **Scientific Relevance:** We agree that a theory of causation must be compatible with, and ideally illuminating for, the special sciences (biology, economics, psychology), not just fundamental physics.

  ## 2. Disagreements
  *The following table outlines our remaining substantive divergences. Each position is stated in terms its proponent endorses.*

  | Topic | Counterfactualist Position (Lewis-Style) | Interventionist Position (Woodward-Style) |
  | :--- | :--- | :--- |
  | **1. Circularity & Primitives** | The appeal to "interventions" in defining causation is viciously circular if 'intervention' is itself a causal notion. A metaphysical analysis should reduce causal facts to non-causal modal facts (counterfactuals grounded in world-similarity). | The circularity is non-vicious. 'Intervention' is characterized functionally within a causal model. The goal is not reductive metaphysics but conceptual explication: clarifying how causal claims function in reasoning and science. |
  | **2. Metaphysics vs. Methodology** | Causation is an objective feature of the world's ontology. Counterfactuals track mind-independent relations of dependence between events. | Causation is primarily an explanatory tool. Causal claims represent invariant relationships that allow for manipulation and control. The "reality" of causation is tied to the stability of these relationships. |
  | **3. Interventions vs. Counterfactuals** | Counterfactual dependence can exist without the possibility of intervention (e.g., cosmic events, past history). Causation should track dependence even where manipulation is impossible. | A causal claim is meaningless without a specification of how the cause could be manipulated (even in principle). If no intervention is possible, there is no causal relation, only correlation or description. |
  | **4. Token vs. Type** | Singular (token) causation is primary. Type-level claims are generalizations over singular causal relations. | Type-level (general) causation is primary. Singular causal claims are derivative, understood as the instantiation of invariant generalizations in a specific context. |
  | **5. Absences & Transitivity** | Causation by omission is real if counterfactual dependence holds (if I had watered, the plant would have lived). Transitivity generally holds, though pragmatic factors may obscure it. | Omissions are causes only relative to a model and specific expectations. Transitivity often fails because invariant relationships do not chain neatly through intermediate variables. |

  ## 3. Cruxes and Predictions
  *For each disagreement, we identify the specific sub-question (Crux) that, if settled, would shift the debate. We name a concrete case and record our predicted verdicts.*

  | Disagreement | The Crux (Sub-Question) | Test Case / Evidence | Counterfactualist Prediction | Interventionist Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Circularity** | Can we characterize the "fixing" of a variable without invoking causal power? | **Symmetric Overdetermination:** Two shooters fire simultaneously; either shot is sufficient to kill. | **Verdict:** Neither is a cause (on strict dependence) or both are (on quasi-dependence). <br>**Moral:** Shows counterfactuals need refinement, not abandonment. | **Verdict:** Both are causes. <br>**Moral:** Intervention on *either* variable changes the outcome (in the model), capturing the intuition better than simple dependence. |
  | **2. Metaphysics vs. Method** | Is the value of causation in describing the world or guiding action? | **Special Sciences Invariance:** A biological mechanism (e.g., gene regulation) that holds across background conditions. | **Verdict:** Causal because counterfactuals hold. Invariance is evidence, not definition. <br>**Moral:** Physics and biology share the same causal ontology. | **Verdict:** Causal *because* it is invariant. <br>**Moral:** Causation in biology is "realer" or more distinct than in fundamental physics if invariance is higher. |
  | **3. Impossible Interventions** | Does causation require manipulability in principle? | **Cosmic/Geological Events:** The moon's gravity causing tides (cannot intervene on the moon). | **Verdict:** Causal. Counterfactual: "If the moon weren't there, no tides." Manipulation is irrelevant. | **Verdict:** Causal only if we can specify *what would happen* under a hypothetical intervention, even if physically impossible for humans. If the hypothetical is incoherent, the causal claim is dubious. |
  | **4. Token vs. Type** | Do singular causes derive their status from generalizations? | **Late Preemption:** Assassin A shoots; Assassin B would have if A hadn't. A kills. | **Verdict:** A is the cause. Dependence is restored via stepwise chains or quasi-dependence. <br>**Moral:** Token facts ground the theory. | **Verdict:** A is the cause because the *generalization* "Shooting causes death" is invariant in this context, while B's potential shot is not. <br>**Moral:** Token causation is parasitic on type-level invariance. |
  | **5. Absences** | Are absences events or background conditions? | **Failure to Water:** Gardener fails to water; plant dies. | **Verdict:** Cause. Dependence holds: "If gardener had watered, plant lives." <br>**Moral:** Omissions are genuine causes; profligacy is a pragmatic, not metaphysical, issue. | **Verdict:** Context-dependent. Cause only if there was a normative expectation or model specification that the gardener *should* water. <br>**Moral:** Prevents causal profligacy (e.g., "The Queen's failure to water" is not a cause). |

  ## 4. Analysis: Verbal vs. Genuine Dispute
  *Having laid out the disagreements and cruxes, we offer the following assessment of the nature of our stalemate.*

  **1. The Metaphysical vs. Pragmatic Divide (Genuine)**
  We judge the disagreement regarding **Metaphysics vs. Methodology** to be genuine. One of us (Counterfactualist) is asking, "What makes it true in the world that $C$ caused $E$?" The other (Interventionist) is asking, "Under what conditions is it useful and correct to assert that $C$ caused $E$?" These are different questions. If the Counterfactualist insists on truth-conditions independent of agents, and the Interventionist insists on truth-conditions tied to manipulative capacity, we are not offering rival answers to the same question. We are offering rival accounts of *different* concepts that overlap significantly in extension.

  **2. The Status of Omissions (Genuine)**
  The disagreement on **Absences** is genuine and ontological. The Counterfactualist accepts a ontology where absences can be relata of causal relations. The Interventionist treats absences as features of a causal *model* relative to expectations. This leads to divergent verdicts in cases of "profligate causation" (e.g., the Queen of England failing to water my plant). The Counterfactualist must bite the bullet that she is a cause (pragmatically screened off); the Interventionist denies she is a cause (no invariant pathway in the relevant model).

  **3. The Definition of Intervention (Mostly Verbal)**
  We suspect the disagreement regarding **Circularity** is largely verbal. The Interventionist admits 'intervention' is causal but argues it is *illuminatingly* circular (explication). The Counterfactualist demands *reductive* analysis. If we agree that no reductive analysis of causation is possible (a shared admission of primitives), the charge of "vicious circularity" loses its sting. The dispute reduces to whether we prefer our primitive to be "world similarity" or "manipulation." This is a choice of theoretical vocabulary, not a factual disagreement about the world.

  **4. Token vs. Type (Verbal/Methodological)**
  The disagreement on **Token vs. Type** appears to be a difference in starting point rather than outcome. The Interventionist can recover token causation via actualist interpretations of interventions; the Counterfactualist can recover type causation via generalization of counterfactuals. If both frameworks can technically accommodate the other's preferred relata, this dispute is about theoretical convenience and which direction of analysis is more illuminating for the special sciences.

  **Conclusion**
  We conclude that our collaboration has hardened into a recognition that we are pursuing different projects under the same label. The Counterfactualist is pursuing a **metaphysics of causal relations**, while the Interventionist is pursuing an **epistemology of causal explanation**. We recommend circulating this document to the group with the stipulation that future meetings distinguish between "Causal Metaphysics" sessions and "Causal Modeling" sessions, as conflating the two has been the primary source of our friction.

  ***

  **Signed,**

  _________________________ (Counterfactualist)

  _________________________ (Interventionist)
