          3.  *Counterfactuals without Interventions:* Counterfactualist says yes (e.g., cosmic events). Interventionist says causal claim is meaningless without potential manipulation.
          4.  *Singular vs. Type:* Counterfactualist prioritizes token causation. Interventionist prioritizes type-level/generalizations (though Woodward allows singular, it's derivative).
          5.  *Absences/Transitivity:* How each handles the "hard cases."
      *   *Drafting thought:* Use "We disagree on..." or "Side A holds... Side B holds..." structure. Ensure the Interventionist doesn't sound like they deny reality, and the Counterfactualist doesn't sound like they ignore science.

  5.  **Drafting Section 3: Cruxes and Predictions:**
      *   *Goal:* Connect abstract disagreements to concrete test cases.
      *   *Cases:* Symmetric overdetermination, Late preemption, Double prevention, Omission, Special Sciences.
      *   *Structure:* Disagreement -> Crux Question -> Test Case -> Prediction (Lewis) -> Prediction (Woodward).
      *   *Drafting thought:* This needs to be precise. For example, on Omissions: Lewis might accept them as causes (counterfactual dependence holds). Woodward might be more cautious or require a specific normative/expectation context. Actually, Woodward often treats omissions as "real" causes if there's an invariance, but worries about profligacy. Let's refine: Lewis accepts dependence; Interventionist requires a specific intervention path.
      *   *Refinement on Special Sciences:* Woodward says invariance is key. Lewis says counterfactuals apply there too but might not need "intervention" language.

  6.  **Drafting Section 4: Verbal vs. Genuine:**
      *   *Goal:* Honest assessment.
      *   *Analysis:* Much of the dispute is likely about *purpose*. Is causation a feature of the world's ontology (Lewis) or a tool for explanation/manipulation (Woodward)? If so, they might be talking past each other on "what causation *is*."
      *   *Verbal:* The definition of "intervention" vs. "counterfactual."
      *   *Genuine:* The status of omissions and the metaphysics of modality.

  7.  **Review and Refine:**
      *   *Check constraints:* Did I include all specific cases requested? (Symmetric overdetermination, late preemption, double prevention, omission, special sciences). Yes.
      *   *Check tone:* Is it respectful? Yes.
      *   *Check formatting:* Numbered claims, Disagreements Table, Crux Table, Concluding Analysis.
      *   *Check Philosophy:* Is the Lewis view accurate? (Yes, focus on dependence/worlds). Is the Woodward view accurate? (Yes, focus on invariance/manipulation).
      *   *Self-Correction on "Circularity":* Woodward explicitly admits 'intervention' is causal but argues it's not viciously circular because it clarifies the *structure* of causal claims. Lewis would argue this fails as a reductive analysis. I need to make sure this distinction is clear.
      *   *Self-Correction on "Singular Causation":* Woodward *can* handle singular causation (actual cause), but it's defined via the type-level generalizations that hold in that situation. Lewis starts with singular. This is a key distinction.

  8.  **Final Polish:** Ensure the language sounds like two philosophers writing together, not an AI summarizing. Use phrases like "We jointly affirm," "The divergence lies in," etc. (Proceed to generate output based on these thoughts).

  *(Self-Correction during drafting the Crux Table)*: Make sure the predictions are distinct. For omissions, Lewis usually says "Yes, cause." Woodward says "Yes, but only relative to a model/expectation." For Special Sciences, Woodward says "Invariance is the mark." Lewis says "Counterfactuals hold regardless of manipulability."

  *(Final check on Verbal/Genuine)*: Be bold. If the dispute is largely about whether we are doing metaphysics or philosophy of science, say so.

