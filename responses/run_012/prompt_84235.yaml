answer: |-
  Here is the specification of desiderata for a theory of slurs, structured by phenomena, distinctions, evaluation, and tensions.

  ### I. Phenomenological Desiderata
  *The empirical data points any adequate account must explain.*

  **1. The Co-extensivity Constraint**
  *   **Case:** A racial slur and its neutral counterpart (e.g., the N-word and *Black person*) pick out the exact same set of individuals in the actual world.
  *   **Requirement:** The account must explain how two expressions can be truth-conditionally equivalent (or co-extensive) yet differ in cognitive significance, social force, and acceptability. It cannot simply say they mean different things in a way that changes the truth conditions of the sentence, unless it explains why we treat them as referring to the same people.

  **2. The Offense-Without-Intent Constraint**
  *   **Case:** A slur uttered in a dictionary definition, a news report, a philosophical example, or by a non-native speaker ignorant of its history still causes offense or discomfort to listeners.
  *   **Requirement:** The account must locate the source of offensiveness in something more stable than the speaker's immediate psychological state or illocutionary intent. The potential to offend must be inherent to the utterance type or its conventional history, not solely the speaker's malice.

  **3. The Reclamation/In-Group Exception**
  *   **Case:** The same slur, used by a member of the target group toward another member of the target group, often lacks offensiveness and may signal solidarity.
  *   **Requirement:** The account must explain how the offensive content can be "disabled" or "transformed" by the identity of the speaker and the context, without rendering the word neutral for everyone else. It must accommodate the volatility of the term's force.

  **4. The Embedding (Projection) Constraint**
  *   **Case:** "If John is a [slur], he won't get the job," or "John is not a [slur]." The offensiveness typically survives negation, conditionals, and questions, though it may vanish in indirect reported speech ("He said that John is a [slur]").
  *   **Requirement:** The account must provide a compositional semantics or pragmatics that explains why the derogatory content "projects" out of logical operators. It cannot treat the offensiveness as a standard conversational implicature, which usually vanishes under negation.

  **5. The Endorsement (Non-Detachability) Constraint**
  *   **Case:** It is difficult to use a slur in a purely classificatory way (e.g., "There are many [slurs] in this database") without sounding like one is endorsing the derogatory perspective.
  *   **Requirement:** The account must explain why the derogatory attitude is "sticky." It must clarify why the expressive content cannot be easily separated from the descriptive content in standard assertoric contexts.

  **6. The Heterogeneity Constraint**
  *   **Case:** Some pejoratives target ascriptive groups (race), others target ideologies (e.g., *terrorist*, *cultist*), and some lack a clear neutral counterpart (e.g., *illegal alien* vs. *undocumented immigrant*).
  *   **Requirement:** The account must specify whether these are all "slurs" in the same theoretical sense. It cannot stipulate that only terms with perfect neutral counterparts count, nor can it ignore the structural differences between ascriptive and non-ascriptive pejoratives.

  **7. The Diachronic/Gradient Constraint**
  *   **Case:** Terms drift in severity over time (e.g., *cripple* to *disabled*); some become taboo, others become reclaimed. Severity also varies synchronically between different slurs.
  *   **Requirement:** The account must accommodate gradience and historical change. A static semantic value that cannot shift with social practice is insufficient.

  ---

  ### II. Conceptual Distinctions
  *The boundaries the account must maintain without collapsing.*

  **1. Use vs. Mention**
  *   **Requirement:** The theory must distinguish between uttering a slur to derogate (use) and uttering it to discuss the word itself (mention), while acknowledging that mention can still cause offense (see Desideratum 2).

  **2. Slur vs. Insult vs. Profanity**
  *   **Requirement:** The theory must distinguish a group-based slur (derogating via membership) from a personal insult (*idiot*, *jerk*) and from general profanity (*damn*, *fuck*). A mechanism that explains *idiot* must not automatically explain the N-word, and vice versa.

  **3. Derogation vs. Offense vs. Contempt**
  *   **Requirement:** The theory must separate the *act* of derogating (what the speaker does), the *effect* of giving offense (what the listener feels), and the *attitude* of contempt (what is expressed). A speaker can derogate without intending offense; a listener can take offense without the speaker derogating.

  **4. Semantic Content vs. Speaker Meaning**
  *   **Requirement:** The theory must specify which part of the slur's impact is encoded in the language system (semantic/conventional) and which part is generated by context (pragmatic/speaker meaning). Collapsing this distinction makes it impossible to explain cross-contextual stability.

  **5. Descriptive vs. Expressive Content**
  *   **Requirement:** The theory must isolate the truth-conditional contribution (the group reference) from the expressive contribution (the negative evaluation). It must say whether these are two separate contents or one fused content.

  ---

  ### III. Evaluation: Genuine Desiderata vs. Camp Commitments

  **Genuine Desiderata (Data-Driven)**
  *   **Co-extensivity:** This is a pre-theoretical intuition shared by almost all speakers; denying it requires heavy theoretical lifting.
  *   **Embedding/Projection:** This is a robust linguistic behavior. If a theory cannot explain why "He isn't a [slur]" is still offensive, it fails empirically.
  *   **Offense-Without-Intent:** The dictionary/reporting case is a hard datum. If offense relied entirely on intent, quoting a slur would be innocuous. It is not.
  *   **Distinction (Slur vs. Insult):** Phenomenologically, being called a slur feels different than being called an idiot. The theory must respect this difference.

  **Camp Commitments (Theory-Driven)**
  *   **The Neutral Counterpart Requirement:** *Commitment.* Semanticists often insist a slur *must* have a neutral counterpart to be a slur. This excludes terms like *terrorist* or *illegals* arbitrarily. A robust theory should handle pejoratives even where the "neutral" term is contested.
  *   **The Uniform Mechanism Requirement:** *Commitment.* Demanding that *all* pejoratives (racial, ideological, gendered) work via the exact same semantic mechanism is a desire for theoretical elegance, not a datum. It is possible slurs are a disjunctive class.
  *   **The Semantic Location of Offense:** *Commitment.* Insisting the offense *must* be in the truth-conditions (to solve embedding) or *must* be in the pragmatics (to solve reclamation) is a theoretical stance, not a requirement. The requirement is only to explain the data, not to locate it in a specific module.
  *   **The Reclamation "Neutrality" Assumption:** *Commitment.* Assuming in-group use renders the term fully "neutral" is controversial. Some argue it remains a slur but is licensed; others argue it changes meaning. The desideratum is to explain the *difference in effect*, not to presuppose the mechanism of reclamation.

  ---

  ### IV. Tensions and Incompatibilities

  **1. The Stability vs. Flexibility Tension (The "Reclamation Paradox")**
  *   **The Conflict:** Desideratum 2 (Offense-Without-Intent) and Desideratum 4 (Embedding) suggest the offensive content is **stable**, conventional, and semantically encoded (otherwise it wouldn't survive reporting or negation). However, Desideratum 3 (Reclamation) suggests the offensive content is **flexible**, context-sensitive, and pragmatic (otherwise in-group use couldn't disable it).
  *   **Incompatibility:** It is extremely difficult to model a content that is rigid enough to project through logical operators and survive ignorant utterance, yet fluid enough to vanish when the speaker's identity changes. A purely semantic account fails Reclamation; a purely pragmatic account fails Embedding.

  **2. The Uniformity vs. Heterogeneity Tension**
  *   **The Conflict:** Desideratum 6 (Heterogeneity) acknowledges that slurs target different kinds of groups (ascriptive vs. chosen) and lack consistent neutral counterparts. However, theoretical virtue demands a **Uniform Mechanism**.
  *   **Incompatibility:** If you demand a single semantic mechanism for all pejoratives, you will likely have to exclude ideological pejoratives (which often lack the historical "essence" of racial slurs) or deny that they are true slurs. If you accept full heterogeneity, you risk having no unified "theory of slurs," only a theory of pejoratives.

  **3. The Descriptive vs. Expressive Tension**
  *   **The Conflict:** Desideratum 1 (Co-extensivity) implies the descriptive content is identical to the neutral term. Desideratum 5 (Endorsement) implies the expressive content is inseparable from the descriptive content in use.
  *   **Incompatibility:** If the contents are truly separate (hybrid theories), it should be easier to use the term descriptively without endorsing the expression. The fact that it is *hard* to do so suggests the contents are fused, which threatens the Co-extensivity constraint (if fused, do they still refer to the same set?).

  ---

  ### V. The Killer Constraint

  **The Embedding (Projection) Constraint** is the single requirement that does the most to rule out candidate theories.

  **Reasoning:**
  Most initial intuitions about slurs are pragmatic: "It's just a rude way of saying X," or "It depends on how you use it." These intuitions naturally lead to **Gricean Conversational Implicature** accounts or pure **Speech Act** accounts.
  *   **Why it rules them out:** Standard conversational implicatures cancel under negation (e.g., "He didn't eat some of the cookies [implicature: he ate all]" -> "He didn't eat some, he ate none"). Slur offensiveness does *not* cancel under negation ("He isn't a [slur]" is still offensive).
  *   **The Consequence:** This requirement immediately eliminates any theory that treats the derogatory content as a standard pragmatic inference derived from context and maxims. It forces the theorist to posit something more robust: a **Conventional Implicature**, a **Presupposition**, or a **Semantic Truth-Condition**.
  *   **The Cost:** By forcing the theory to make the content "semantic-like" to satisfy Embedding, it makes satisfying the **Reclamation Constraint** (Desideratum 3) significantly harder, as semantic content is typically less sensitive to speaker identity than pragmatic content. Thus, satisfying the Killer Constraint creates the central tension of the field.
