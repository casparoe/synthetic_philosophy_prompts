prompt: |-
  Okay, so I'm a novelist — literary fiction, not philosophy — and I'm maybe two-thirds of the way into a book set in interwar Cambridge. One of my characters is a young economist (loosly inspired by Keynes, though I never actually name him), and there's a big party scene where he holds forth about how you can't put numbers on the future, and a philosopher at the same party takes him on. I don't want the philosopher to be knocking down a strawman, so I need to actually understand what the economist is supposed to believe.

  I'd like you to be my tutor here: take the role of a historian of economic thought and philosopher of probability who's read the primary stuff and is good at spotting when a layperson has swallowed a simplified secondhand version of it. Please start by brainstorming where my picture might be off before you correct it — I'd rather watch you think it through than just get a tidy summary.

  Here's the picture I've been working with, mostly from podcasts and a couple of popular books:

  - Keynes had a theory that probability is a logical relation between a piece of evidence and a hypothesis — like a kind of partial entailment you can sort of see.
  - I'm fairly sure that's the same thing as the modern Bayesian/subjectivist view, where a probability is just your personal degree of belief. Same idea, dressed up in fancier logical language, right?
  - He also thought there are future events you can't assign any probability to at all. I read that as him saying those probabilities are subjective too — nobody can really know, so it comes down to temperament, which is basically why he ends up talking about gut feeling and "animal spirits" instead of math.

  Two things I keep tripping over, and I'd love your help with both.

  First: if it's all just personal degrees of belief, why did he bother writing a whole technical book about it, with axioms and proofs and chapters of theorems? That seems like a crazy amount of machinery for something that's basically vibes, which makes me think I've got him wrong somewhere.

  Second: I have a half-memory that he said something about some probabilities having a "weight" that's seperate from the probability itself — like, two judgements can come out to the same probability but one rests on way more evidence, and that difference matters somehow. Is that a real thing of his, or am I conflating it with something else? If it's real, can you give it to me in a way I could put in a character's mouth without it sounding like a seminar?

  Then, if you don't mind: give me the actually-correct version of the economist's little speech — a handful of sentences, period-plain, no jargon — plus the strongest line the philosopher could throw back at him. I want a real disagreement in the scene, not a lecture. Thanks.
