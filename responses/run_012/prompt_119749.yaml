      *   **Counter-Argument to Address:** The reply that a converged agent is "neutral" rather than "blank." I need to defend the "blank/suffering" interpretation against this.
      *   **Alternative Proposal:** I must commit to an alternative account of valence that handles surprises without making valence disappear for well-calibrated agents.
      *   **Tone/Style:** Committed, not hedging. Philosophical but grounded in RL mechanics.

  2.  **Deconstruct the RPE = Valence Thesis:**
      *   *Premise:* Dopamine/Valence $\approx$ $\delta = R_t + \gamma V(S_{t+1}) - V(S_t)$.
      *   *Implication:* If $\delta = 0$ (perfect prediction), Valence = 0.
