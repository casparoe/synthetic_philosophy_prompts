      *   **Specific Argument to Attack:** The idea that valence *is* reward prediction error (RPE).
      *   **Task:** Argue that identifying valence with RPE is a *reductio ad absurdum* (leads to absurd conclusions).
      *   **Key Scenario:** A fully converged agent (perfect prediction) on a constant high reward stream.
