prompt: |-
  I'm sitting in on a seminar on medieval Jewish philosophy and we just did Maimonides on why the Torah has all these laws about animal sacrifice, and I left genuinely unsure whether I'm missing something or whether he's saying something way more radical than I expected. The passage we were handed is from one of the old English translations so the prose is kind of clunky, but here's the chunk that's bugging me:

  "Many precepts in our Law are the result of a similar course adopted by the same Supreme Being. It is, namely, impossible to go suddenly from one extreme to the other: it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed. Now God sent Moses to make [the Israelites] a kingdom of priests and a holy nation (Exod. 19:6) by means of the knowledge of God. Comp. "Unto thee it was showed that thou mightest know that the Lord is God (Deut. 4:35); "Know therefore this day, and consider it in thine heart, that the Lord is God" (ibid. 5:39). The Israelites were commanded to devote themselves to His service; comp. "and to serve him with all your heart" (ibid. 11:13); "and you shall serve the Lord your God" (Exod. 23:25); "and ye shall serve him" (Deut. 13:5). But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them; religious and ascetic persons were in those days the persons that were devoted to the service in the temples erected to the stars, as has been explained by us. It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action."

  And a bit later he says: "I know that you will at first thought reject this idea and find it strange; you will put the following question to me in your heart: How can we suppose that Divine commandments, prohibitions, and important acts, which are fully explained, and for which certain seasons are fixed, should not have been commanded for their own sake, but only for the sake of some other thing: as if they were only the means which He employed for His primary object?"

  My problem is the "means to some other thing" move. It really sounds like hes saying God basically indulged the Israelites' habit of slaughtering animals and burning incense, kept the whole ritual machinery in place and just redirected it, purely because it would have been too jarring to ask them to quit cold turkey. So the sacrificial laws end up looking like a pedagogical concession, a bit of divine damage control, rather than something God actually wanted in itself. And then he raises that exact worry himself in the last line I pasted, but I honestly can't follow how his answer is meant to dissolve it rather than just restate the problem.

  The other thing that trips me up is the analogy he builds up just before all this, with the nerves and muscles hardening gradually and the newborn needing milk before it can handle solid food. Is that comparison doing real argumentative work or is it just window dressing? Because "a body physically can't jump straight from milk to meat" and "people are attached to their old customs and would get upset if you changed them too fast" seem like two totally different kinds of necessity, and he seems to glide between them as if they were the same. And if the whole point was to wean people off idolatry, why does the sacrificial system stick around forever instead of getting phased out once the habit is broken? I feel like I'm either overreading him or missing something obvious. Could you walk me through what he's actually claiming here and whether the "concession" reading is fair to him? Just write it out as normal flowing paragraphs, no bullet points, no headings, no bold, nothing like that — like you're explaining it to me over email.
