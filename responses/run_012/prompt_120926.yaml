answer: |-
  Dear friend, it is a pleasure to engage with someone who has thought so carefully and independently about these matters, and I should begin by reassuring you that your intuition regarding the distinction between streams of experience and persons is not only sensible but aligns with some of the most rigorous thinking in the philosophy of mind. You are not using words wrongly so much as you are navigating a terminology that professionals often leave frustratingly vague. In clinical and philosophical circles, we frequently conflate the mind, which refers to the faculty of thinking and feeling, with the person, which refers to the subject of moral and legal responsibility. Your hunch that split-brain cases might increase the number of experiential streams while leaving the number of persons unchanged is a sophisticated position that avoids the trap of assuming every fragment of consciousness must be a separate self. You have asked me to derive the principle behind your verdicts, to apply it to the cases that worry you, and to be honest about where it breaks down, so I shall attempt to do exactly that in the spirit of a continued conversation.

  The principle that best fits the series of verdicts you have provided is what we might call the principle of narrative agency. This principle holds that we identify a person not by the unity of their private experience, but by the unity of their public agency and their capacity to construct a coherent biographical narrative. Under this view, a person is the sort of thing that can be argued with, blamed, and held accountable, which requires a centralised locus of decision-making that can communicate reasons for its actions. This principle explains why you view the conflicting hands as one man in a civil war rather than two men fighting; the conflict is internal to a single agent, much like your own desire for a biscuit versus your desire for health, because there is only one centre of social accountability managing the body. It also explains your verdict on the confabulation case, where the speaking half invents a reason for the silent half's action. You see this as one person because the speaking half is the only entity capable of offering a narrative explanation to the outside world, effectively absorbing the silent half's actions into its own story, even if that story is fabricated. The silent half may have preferences, as you note in the case of the divergent tastes in music or pictures, but without the capacity to articulate those preferences into a social context or to claim responsibility for them, it remains a subsystem of the single person rather than a person in its own right. Your dismissal of the patient's subjective feeling of unity is also consistent with this principle, because you recognise that self-report is merely the output of the speaking agency and cannot confirm the metaphysical status of the silent partner.

  When we apply this principle of narrative agency to the hypothetical case that you cannot settle, where the two halves communicate by typing and develop divergent beliefs and identities, the implication is quite stark. If the silent half gains the capacity to type, it gains the capacity for social accountability and narrative construction. It can now argue, blame, and claim a life of its own. Therefore, consistent with your previous verdicts, the principle forces us to say that there are now two people sharing a body. The tipping point is not the separation of consciousness, which was already present in the conflicting hands, but the separation of agency. As long as the silent half is mute, it is a passenger; once it can type, it becomes a driver. This is likely why you feel unsettled, because our ordinary concept of a person is tightly bound to the concept of a human body, and admitting two people in one body challenges our legal and social structures. However, your own logic regarding what makes something a person, specifically the ability to be argued with and to have a life to lead, demands that you count them as two once they can communicate their divergence.

  To test this principle further, let us consider three cases you have not mentioned. First, consider conjoined twins who share some brain tissue but have two separate heads and voices. Most people would intuitively say there are two persons here, and the principle of narrative agency agrees, because there are two distinct centres of social accountability and biographical narrative, even if their physical bodies are joined. Second, consider a patient with dissociative identity disorder, where different personality states take control of the same body at different times. Here the principle struggles, because while there may be multiple narratives, they usually do not coexist simultaneously in the way split-brain hands do, and they share a single legal identity. Your principle would likely suggest we treat them as one person with fragmented agency, unless the alters can communicate with each other and the outside world simultaneously and hold conflicting moral views, at which point the count becomes murky. Third, consider a patient in a locked-in syndrome, who is fully conscious but cannot move or speak. Your principle might dangerously suggest they are not a person because they lack public agency, but I suspect you would rightly insist they remain a person because the capacity for agency is present even if the output is blocked. This suggests we must refine the principle to say that personhood relies on the capacity for agency, not necessarily its continuous exercise.

  I must now be honest about where this principle cannot save your verdicts, or rather, where it reveals a bias in them. The most significant weakness is what you suspected yourself, which is the one mouth problem. Your verdicts heavily privilege the speaking left hemisphere. If the silent right hemisphere could speak, you admit you might change your mind about whether there are two people. This suggests that your principle of narrative agency might actually be a principle of verbal report. We tend to grant personhood to those who can talk to us. If the silent half suffers pain but cannot type or speak, the principle allows us to treat it as part of one person, potentially ignoring the specific suffering of that silent stream. This is a moral hazard. If there are truly two streams of experience, and one is in agony while the other is content, saying there is only one person might lead us to neglect the agony of the silent stream. The principle saves the count of persons but risks obscuring the count of sufferers. Furthermore, the principle does not fully explain why the conflicting hands feel like one person to the observer. It explains why we treat them as one agent, but it does not explain why the unity of the body feels so compelling that we resist calling them two people even when they type. There is a deep biological intuition that one body equals one person that your principle overrides only with difficulty.

  Finally, you asked whether the word unity is doing any real work when people talk about the unity of consciousness, or whether it is only a name for the fact that there is normally nobody else in here to disagree with. I believe it is doing real work, but it is functional work rather than metaphysical glue. In a standard brain, information gathered by the left eye is instantly available to the right hand, and memories stored in one area are accessible to the language centres. This integration is what we mean by unity. It is not that there is a single little man inside watching a single screen, but rather that the data processing is sufficiently interconnected that the system acts as one. When the corpus callosum is cut, that functional unity is degraded. Information no longer flows freely. So unity is not merely the absence of disagreement, because a single person can disagree with themselves as you noted with the biscuit. Unity is the capacity for any part of the mind to access the information held by any other part to guide action. In the split-brain patient, this capacity is broken. Therefore, the unity of consciousness is a description of the architectural integration of the brain, and when that architecture is severed, the unity is lost even if the personhood remains intact due to the dominance of one narrative agency. You have done very well to separate the question of how many streams there are from how many people there are, and holding that distinction clear is the best way to navigate these difficult waters without losing sight of either the science or the humanity involved.
