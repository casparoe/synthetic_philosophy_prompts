answer: |-
  Here is the complete run-sheet for the session. It is designed to be printed or written on the board without a projector.

  ### 1. The Materials & Card Construction

  **The Legend (Write this on the Whiteboard):**
  *   **Intensity (1–10):** 1 = A hangnail you notice only if you think about it. 5 = A constant migraine that stops you working. 10 = Flaying/torture; the worst pain a human can survive without breaking.
  *   **Duration:** Continuous, 24/7. No breaks.
  *   **The Rule:** You will live *exactly* one of these lives. You cannot die early. You cannot take painkillers. You must choose which ticket you take.

  **The Deck (10 Cards):**
  Print these on stiff paper. Make two identical decks so multiple pairs can work on the same step if needed (though with 18 students, 9 pairs covers the 9 gaps perfectly).

  *   **Card 1:** 60 Years at Intensity 2 (Constant low-level ache, like a bad flu.)
  *   **Card 2:** 50 Years at Intensity 3 (Noticeable pain, limits physical activity.)
  *   **Card 3:** 40 Years at Intensity 4 (Daily headaches, hard to concentrate.)
  *   **Card 4:** 30 Years at Intensity 5 (Migraine-level, work is difficult.)
  *   **Card 5:** 20 Years at Intensity 6 (Severe pain, bedridden often.)
  *   **Card 6:** 10 Years at Intensity 7 (Agonizing, requires assistance.)
  *   **Card 7:** 5 Years at Intensity 8 (Torturous, screaming often.)
  *   **Card 8:** 2 Years at Intensity 9 (Unrelenting torture.)
  *   **Card 9:** 6 Months at Intensity 9.5 (Extreme torture, barely survivable.)
  *   **Card 10:** 1 Week at Intensity 10 (Maximum imaginable pain, but it ends.)

  **Sanity Check (Why these numbers work):**
  *   **Local Steps (e.g., 1 vs 2):** Trading 10 years of life for a slight increase in pain (2 to 3) is an easy win for Card 1. The verdict should be near-unanimous: **1 is better than 2.**
  *   **The Chain:** This logic holds all the way down. 9 (6 months) is clearly better than 10 (1 week) because the duration difference is massive compared to the 0.5 intensity bump. Verdict: **9 is better than 10.**
  *   **The Ends (1 vs 10):** 60 years of nagging misery vs. 1 week of hell. Most people will choose the week of hell to get it over with. Verdict: **10 is better than 1.**
  *   **The Trap:** If $1 \succ 2$, $2 \succ 3$... $9 \succ 10$, then transitivity demands $1 \succ 10$. But the room will vote $10 \succ 1$.

  **Other Materials:**
  *   **Verdict Slips:** Small pieces of paper. Pre-printed with: *Card A ___ / Card B ___ / We Prefer: [ A / B / Indifferent ]*.
  *   **Tokens:** A bowl of chocolate coins, poker chips, or raffle tickets (at least 30).
  *   **Tape/Blu-tack:** To pin slips to the board.

  ---

  ### 2. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & The "Demon Rule"**
  *   Hand out the cards. Pair students up. Give each pair *one* neighbouring gap (Pair 1 gets 1&2, Pair 2 gets 2&3, etc.).
  *   **Crucial Instruction:** "You are not discussing what is moral or what you'd advise a friend. You are choosing which life *you* live. If you say 'I refuse to choose,' the Demon chooses for you randomly. If you say 'Indifferent,' you must flip a coin now and record the winner. I need a strict 'Better Than' verdict on every slip."
  *   *Why:* This prevents the "refusal to choose" from derailing the logic. It forces completeness.

  **00:05 – 00:25: The Local Comparisons**
  *   Pairs discuss their two cards (5 mins).
  *   They write their verdict slip (2 mins).
  *   **The Pin-Up:** Bring slips to the front. Pin them in order on the whiteboard: *1 vs 2*, *2 vs 3*, etc.
  *   **The Read-Out:** Read the chain aloud. "Pair 1 says 1 is better than 2. Pair 2 says 2 is better than 3..."
  *   *Expected Result:* A clean chain: $1 \succ 2 \succ 3 \succ 4 \succ 5 \succ 6 \succ 7 \succ 8 \succ 9 \succ 10$.

  **00:25 – 00:35: The Global Vote (The Snap)**
  *   Hold up Card 1 and Card 10.
  *   "Ignore the middle cards. Just these two. 60 years of Level 2, or 1 week of Level 10. Show of hands: Who prefers Card 1?" (Count). "Who prefers Card 10?" (Count).
  *   *Expected Result:* Card 10 wins overwhelmingly.
  *   **The Squeeze:** Point to the board. "The board says 1 is better than 10 (by transitivity). Your hands say 10 is better than 1. Both cannot be true."
  *   Do not explain *why* yet. Let the silence sit for 30 seconds.

  **00:35 – 00:50: The Money Pump (Live Demo)**
  *   Call 3 volunteers: **The Agent** (holds the cards), **The Broker** (you, or a confident student), **The Banker** (holds the tokens).
  *   **Start:** Give The Agent Card 10 and 5 Tokens.
  *   **Step 1:** Broker points to the board (9 vs 10). "The room says 9 is better than 10. I will swap your Card 10 for Card 9. Cost: 1 Token."
      *   *Agent agrees (based on board verdict).* Swap happens. Agent has 4 tokens.
  *   **Step 2–9:** Broker moves up the chain. "8 is better than 9. Swap? Cost 1 token." ... "1 is better than 2. Swap? Cost 1 token."
      *   *Agent agrees at every step.* Agent now holds Card 1 and 0 Tokens.
  *   **The Close:** Broker holds up Card 10. "The room just voted 10 is better than 1. I will swap your Card 1 for Card 10. Cost: 1 Token."
      *   *Agent agrees (based on global vote).*
  *   **Result:** Agent is back where they started (Card 10), but has lost all their tokens.
  *   **Ask the Agent:** "Do you feel rational?" (They usually laugh/nervous). "Would you do it again?"

  **00:50 – 01:05: The Repair Shops**
  *   Split the room into 4 groups. Assign each one a "Way Out." They have 10 minutes to prepare a 2-minute defense of their position.
      *   **Group 1 (Deny Transitivity):** "Better-than" just isn't transitive. Small changes accumulate to big ones without a clear cut-off.
      *   **Group 2 (Break the Chain):** One specific step on the board is wrong. Identify which pair (e.g., 7 vs 8) and argue why the jump was too big.
      *   **Group 3 (Incomparability):** Card 1 and Card 10 are on different scales. You can't compare them. "Better" doesn't apply.
      *   **Group 4 (Bite the Bullet):** Transitivity is law. If 1 is better than 2... then 1 *must* be better than 10. We were wrong to vote for 10 in the global vote.
  *   **Vote:** Quick show of hands on which repair feels "cheapest" (least damaging to our other beliefs).

  **01:05 – 01:15: The Debrief (Vocabulary Mapping)**
  *   Now you lecture. Map their experience to the terms.
      *   **The Chain:** *Spectrum Argument / Sorites Paradox.*
      *   **The Cycle:** *Intransitivity of Preference.*
      *   **The Token Loss:** *Money Pump Argument* (proof that intransitivity leads to exploitation).
      *   **Group 1:** *Non-Transitive Better-Than (Parfit/Quinn).*
      *   **Group 2:** *Lexical Thresholds (Lexical Priority).*
      *   **Group 3:** *Incomparability / Parity (Chang).*
      *   **Group 4:** *Strict Aggregation / Utilitarianism.*
  *   End on the open question: "Which cost did you vote was lowest? That's your current philosophical commitment."

  ---

  ### 3. Troubleshooting: What Will Go Wrong

  **1. The "Refusal to Choose" (The Stoic Objection)**
  *   **Problem:** As you experienced, students may say, "Both are torture, I won't play."
  *   **Fix:** The "Demon Rule" (stated in Setup). "You are not advising. You are suffering. If you do not choose, the Demon picks the one *you* didn't pick."
  *   **If they still resist:** Ask them to record "Indifferent." Then, during the Money Pump, tell the Agent: "If you are indifferent, you should be willing to swap for free. But if you swap for free, I can still charge you a token because you don't *lose* utility by swapping." (This is technical, but usually, the social pressure of the game forces a choice).
  *   **Better Fix:** Tell them: "This is not about bravery. It is about math. If you say 'neither,' you break the math. I need you to break the math on purpose. Pick the one that sucks less."

  **2. The "Lexical" Rebellion (The Global Vote Fails)**
  *   **Problem:** The class votes Card 1 (60 years @ 2) over Card 10 (1 week @ 10). They decide torture is *always* worse, regardless of duration.
  *   **Result:** No paradox. Transitivity holds. $1 \succ 10$ matches the chain.
  *   **Recovery:** Do not panic. Pivot the discussion. "Okay, you are all Lexical Prioritizers. You believe Intensity trumps Duration. So, where is the cut-off? At what week does Level 10 become worse than 60 years of Level 2? Is it 2 weeks? 3 days?"
  *   **Why this works:** It forces them to find the "Break the Chain" solution (Group 2) immediately. You still get to discuss thresholds, just without the intransitivity trap.

  **3. The Money Pump Feels Fake**
  *   **Problem:** Students say, "I wouldn't pay the token because I know you're tricking me."
  *   **Recovery:** Acknowledge this. "Real money pumps rely on the agent not seeing the cycle. But the *logic* holds: if your preferences are truly $A \succ B \succ C \succ A$, you *should* be willing to trade at every step. The fact that you hesitate proves you sense the inconsistency."

  ---

  ### 4. Honest Limitations (For Your Debrief)

  You need to supply the philosophical caveats yourself, as the activity cannot prove them. Tell them this:

  1.  **Revealed Preference Assumption:** The activity assumes that "What you choose" = "What is Better." Some philosophers deny this. You might choose A over B out of weakness, even if B is better. The Money Pump only works if Choice reveals Value.
  2.  **Forced Completeness:** We forced you to choose (The Demon Rule). In reality, maybe some lives *are* incomparable. The activity hides the "Incomparability" exit until the end.
  3.  **The "Global" Vote Status:** Why does the vote of 1 vs 10 override the chain of 1 vs 2 vs 3? The activity treats the Global Vote as authoritative, but a transitivity defender would say the Chain is more reliable because the comparisons are "easier" (neighbors are similar).
  4.  **Staging vs. Proof:** This shows that *our intuitions* clash. It does not prove that rationality *requires* transitivity, only that violating it has a cost (tokens). Whether that cost is high enough to abandon the intuition is the real debate.

  ---

  ### 5. Confidence & Weakest Link

  **Confidence Level:** **85%**.
  *   The local steps (1 vs 2, 9 vs 10) are robust. The numbers are spaced widely enough that reasonable people won't disagree.
  *   The engagement will be high because it involves "lives" and "tokens."
  *   The "Refusal" issue is mitigated by the Demon Rule.

  **The Weakest Design Choice:** **The Global Vote (Card 1 vs Card 10).**
  *   **Why:** This is the only point of failure. If your specific cohort of students are deontologists or have a "torture is absolute" intuition, they will vote $1 \succ 10$. The cycle vanishes.
  *   **Mitigation:** If this happens, lean into it. "Okay, so you found the threshold. Where is it? Card 8? Card 9? If you can't name the exact card where it flips, you still have a Sorites problem, just a different one." This saves the seminar even if the intransitivity trap doesn't spring.

  **Final Tip:** When pinning the slips, if a pair disagrees (e.g., they vote $2 \succ 1$ against the grain), leave it there. Point it out during the read-out. "Pair 2 broke the chain." Ask them why. Their reason is likely the seed for the "Repair" phase. Don't hide dissent; use it.
