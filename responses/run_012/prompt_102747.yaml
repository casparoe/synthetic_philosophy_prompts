answer: |-
  The pattern you have identified is not a contradiction, but it is also not a single, unified theory. It is a **Mixed Epistemic Constitution**. The practice does not presuppose a single source of legitimacy (like "the will of the people" or "the truth of the experts"). Instead, it presupposes that legitimacy is **domain-specific** and derived from minimizing the specific type of error cost most dangerous in that domain.

  Here is the breakdown of what the practice strictly requires, where it is underdetermined, and how it handles the hard cases you raised.

  ### 1. The Presupposed View of Legitimacy

  The system strictly requires a **pluralistic theory of authority**. It rejects the idea that one metric (votes or knowledge) can validate all power. Instead, it operates on a **Risk Allocation Principle**:

  *   **Monetary Policy & Safety Regulation:** The primary risk is **Time Inconsistency** and **Ignorance**. Politicians have short time horizons (election cycles); laypeople lack technical knowledge. Therefore, legitimacy here is derived from **Insulation**. The presupposition is that some goods (price stability, drug safety) are too easily destroyed by short-term popular pressure to be left to a majority vote.
  *   **Criminal Trials:** The primary risk is **State Tyranny** and **Moral Alienation**. If the state convicts using only its own experts, it becomes an oppressor. If experts decide guilt without community input, the law loses moral force. Therefore, legitimacy here is derived from **Consent and Peer Judgment**. The presupposition is that liberty is too important to be trusted to efficiency or accuracy alone.
  *   **Tax & Redistribution:** The primary risk is **Illegitimate Coercion**. Taking property requires direct consent. Technical efficiency is secondary to political authorization. Therefore, legitimacy here is derived from **Accountability**.

  **Strict Requirement vs. Underdetermination:**
  *   **Strictly Required:** The system requires that no single institution holds a monopoly on truth or will. It *requires* that technical bodies lack coercive power over liberty (juries) and that democratic bodies lack discretion over technical constants (interest rates).
  *   **Fits Comfortably:** The idea that experts are "neutral." In reality, regulators make value judgments (how safe is safe enough?), but the system pretends these are technical to shield them from voting.
  *   **Underdetermined:** The boundary itself. There is no principled line in nature between "technical" and "political." Inflation targeting is a value choice (how much unemployment is acceptable to curb inflation?). The system papers over this by calling it a "technical means" to a "democratic end," but that division is porous.

  ### 2. The Hard Bits

  **The Jury: Condorcet vs. Legitimacy**
  You asked if the jury rests on the Condorcet Jury Theorem (that groups track truth better than individuals).
  *   **The Theory:** Condorcet assumes independent voting and binary choices.
  *   **The Reality:** Jurors deliberate (correlating their votes) and decide nuanced verdicts (credibility, intent) that are not binary. Empirically, juries make more "errors" (acquitting the guilty or convicting the innocent) than a panel of judges.
  *   **The Verdict:** The Condorcet justification **fails**. If accuracy were the only goal, we would use expert judges or AI. The jury survives because it serves a **non-epistemic function**: it forces the state to convince the community before depriving a member of liberty. It is a political check, not a truth machine. The presupposition is that a false conviction by the state is worse than a false acquittal by the people.

  **The Central Bank: Means vs. Ends**
  You asked if the independence of central banks is justified by a division of labor (experts on means, politicians on ends).
  *   **The Theory:** Government sets the inflation target (End); Bank sets interest rates (Means).
  *   **The Reality:** This is a **comforting fiction**. Setting interest rates *determines* unemployment levels, which is a deeply political value judgment. By insulating the bank, the government isn't just delegating means; it is tying its own hands on ends.
  *   **The Verdict:** The justification is not competence, but **credibility**. Markets believe the bank will fight inflation even when it hurts the government. If the government could override the bank, inflation expectations would rise. The system presupposes that democratic will is sometimes self-destructive and needs a "guardian" to enforce long-term constraints.

  **Citizens' Assemblies (Sortition)**
  You asked if this hybrid is stable or a fudge.
  *   **The Presupposition:** It assumes that "Raw Public Opinion" is flawed (ignorant/polarized) but "Informed Public Opinion" is legitimate. It tries to manufacture the competence of an agency with the legitimacy of a jury.
  *   **Stability:** It is **unstable** in its current advisory form. If they only recommend, they are irrelevant. If they bind, they compete with the legislature.
  *   **The Deeper Claim:** It presupposes that competence is not a fixed trait of experts but a **process outcome**. It claims that random people, given time and expert testimony, can reach epistocratic-quality decisions without epistocratic elitism. This challenges the idea that expertise requires years of training rather than weeks of deliberation.

  ### 3. The Counterfactual Swap

  If we swap the presupposition, the institutions do not just tweak; they collapse or mutate.

  **Scenario A: Strict One-Person-One-Vote (Competence-Blind Democracy)**
  *   **Presupposition:** Equality of agency is the only legitimate source of power. Knowledge confers no right to rule.
  *   **Concrete Changes:**
      *   **Central Banks:** Abolished or subordinated. Interest rates set by congressional committee or referendum. Inflation would likely become volatile, used to juice employment before elections.
      *   **Regulators (FDA/FAA):** Safety standards subject to legislative approval. Drug approval times would shorten, but adverse event rates would rise.
      *   **Juries:** Could remain (as they are democratic), but judges would have more power to overturn verdicts that contradict evidence.
      *   **Tax Code:** Remains largely similar, as this is already the domain of pure democracy.
  *   **What Breaks:** Long-term planning and minority protections against majority whim. The system loses its "brakes."

  **Scenario B: Frank Epistocracy (Rule by the Knowers)**
  *   **Presupposition:** Decision quality is the only legitimate source of power. Votes are weighted by competence, knowledge, or stake.
  *   **Concrete Changes:**
      *   **Central Banks:** They become the executive branch. Monetary and fiscal policy merge under technocratic control.
      *   **Juries:** Abolished. Replaced by panels of legal experts, forensic statisticians, and psychologists. Conviction rates would rise; wrongful convictions based on technical error might fall, but "nullification" (jury refusing to convict unjust laws) disappears.
      *   **Tax Code:** Written by economic councils, not politicians. Redistribution would likely decrease (viewed as market distortion) unless optimized for social stability.
      *   **Voting:** Restricted. Perhaps only those who pass a civics/economics test can vote, or votes are weighted by education level.
  *   **What Breaks:** Consent. The system loses its "engine." Without the feeling of ownership, compliance relies entirely on performance. If the experts fail (e.g., a technocratic war or economic depression), legitimacy evaporates instantly because there is no mechanism to fire the rulers other than revolution.

  ### Conclusion

  The current practice does not smuggle in epistocracy quietly; it **marries it openly to democracy** but keeps them in separate rooms. It presupposes that **Democracy is for choosing values, and Epistocracy is for managing constraints.**

  The contradiction you feel is real because the boundary between "value" and "constraint" is porous. Inflation is a constraint; unemployment is a value, but they are two sides of the same coin. Guilt is a fact; punishment is a value, but the jury decides both.

  The system survives not because it is logically pure, but because it is **functionally redundant**. It allows us to blame the experts when the economy crashes ("unelected bureaucrats") and blame the politicians when taxes rise ("career politicians"), preserving the legitimacy of the system as a whole by allowing specific parts to fail without taking down the whole. If you force it into a single theory (pure democracy or pure epistocracy), you lose that shock absorption. You gain coherence, but you lose resilience.
