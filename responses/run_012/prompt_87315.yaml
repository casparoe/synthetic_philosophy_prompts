answer: |-
  Let's pull up a chair and talk this through, because your nagging feeling is spot on. That summary your friend wrote is a classic case of getting the broad strokes right while missing the technical machinery that makes Augustine tick, and nowhere is this more dangerous than in the definition of a lie itself. Starting with the comparison to Kant, I am very confident that this is a defensible simplification. Scholars like Oliver O'Donovan and Jean Burnaby have long drawn this parallel, and while Augustine lacks Kant's categorical imperative framework, the absolute prohibition regardless of consequences is structurally identical. So you can keep that line; it captures the spirit of his rigorism accurately enough for a summary, even if it anachronistically projects Enlightenment deontology onto a fourth-century bishop.

  Moving to the claim that Augustine won't bend even for enormous stakes, I am extremely confident that Augustine would endorse this description. This is the whole point of his later work Against Lying, written specifically to counter the Priscillianists who argued that deceiving heretics was a valid strategy to protect the faith. Augustine explicitly shuts down the idea that you can lie to save a life, protect someone from assault, or secure a theological victory. He insists that the sin lies in the act of lying itself, not in the outcomes it produces, so your friend is on solid ground here. This isn't really contested among scholars; the texts are too explicit for anyone to argue that Augustine permitted lying for utility. The same goes for the ranking of lies. Augustine does indeed categorize them into eight grades in On Lying, ranging from doctrinal falsehoods down to jocose lies told in jest. He considers the joking lies less culpable, sometimes venial rather than mortal, but he still maintains they are sins. Your friend's summary gets this right, and I have high confidence that this is a fair representation of the text.

  However, we hit a major problem with the definition of a lie, and here I am virtually certain the summary is sloppy rather than reflecting genuine scholarly debate. The summary claims that for Augustine, a lie is simply a false statement and that objective falsity makes it a lie regardless of your state of mind. Augustine would flatly deny this. His technical definition is enunciatio contra mentem, speaking against one's own mind. If you say something false believing it to be true, Augustine says you are not lying, though you are in error. Conversely, if you say something true believing it to be false, you are lying. The summary gets this backward by saying what makes it a lie is the falsity rather than the intent to speak against what you believe. In the example given, if you tell a dying man his son is alive while believing him dead, Augustine agrees it is a lie, but not because of the falsity; it is a lie because you are expressing something contrary to what you hold in your mind. Even if the son turned out to be alive, you would still be lying because you believed he was dead. This is a crucial distinction because it shifts the locus of sin from the external reality to the internal integrity of the speaker, and the summary misses this entirely.

  This sloppiness carries over into the discussion of the Hebrew midwives, which is where I am less confident than in the other points, and I will flag this as the area where I am least sure. The summary suggests Augustine softens here and admits the lie wasn't a sin because it saved lives. Augustine never actually admits this. He struggles with the passage, offering two main solutions across his works. Sometimes he suggests they did not lie but spoke prophetically or mysteriously, meaning their statement had a hidden truth. Other times he admits they did lie but argues they were rewarded for their benevolence and faith, not for the lie itself, which remained a sin. The summary's conclusion that Augustine admits the lie wasn't a sin is incorrect, but there is genuine scholarly contestation about how successfully Augustine maintains his rigorism here. Some scholars argue his exegesis bends enough to break his rule, while others say he holds the line by separating the reward from the act. So while the summary's claim that he admits it isn't a sin is sloppy, the broader conclusion that his rigorism might be rhetorical is a live debate in Augustine scholarship. I am moderately confident that the summary misrepresents Augustine's explicit conclusion on the midwives, but I am less confident about adjudicating whether his handling of the case ultimately undermines his theory, because that depends on how one weighs his conflicting exegetical attempts.

  To wrap up the distinction between contestation and sloppiness, the errors regarding the definition of lying and the midwives' sinfulness are cases of sloppiness. The texts are clear enough that Augustine defines lying by the mind's intent and maintains the midwives' act was sinful even if rewarded. There isn't much daylight among experts on those specific points. The genuine contestation lies in the final inference about whether his rigorism is rhetorical. Some scholars think the midwives case shows he couldn't live up to his own standard, while others think it shows the complexity of applying absolute rules to narrative theology. Your friend's summary conflates the two, using a sloppy reading of the text to support a contested conclusion. If you want to keep the Kant comparison, you should definitely correct the definition of lying to focus on the intent to deceive against one's own mind, and clarify that Augustine maintains the midwives sinned even if God rewarded their mercy, rather than saying he admitted the lie was harmless. That keeps the rigorism intact without misrepresenting the mechanics of his thought.
