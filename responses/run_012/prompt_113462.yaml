answer: |-
  ### Exam Question

  **Course:** Legislation and Statutory Interpretation
  **Assessment:** Take-Home Final
  **Time:** 90 Minutes
  **Marks:** 30 (out of 100)

  **Question 1**

  Read the following statute and legislative history carefully.

  > **The Automated Delivery Device Act**
  > 1. No automated delivery device shall operate on a public sidewalk or in a crosswalk without a permit issued under this chapter.
  > 2. "Automated delivery device" means a self-propelled machine that transports goods to a customer's address.
  > 3. This chapter does not apply to a device that is under the continuous physical control of a natural person.
  > 4. The department shall issue a permit to any applicant who pays the fee and files a safety plan.

  **Legislative History:** The first draft of the Act exempted devices weighing less than fifty pounds. This clause was struck in conference at the last minute. When asked about small devices, the floor sponsor stated the issue was "a mess" and that they were "leaving it to the department." Following enactment, the Department announced a moratorium on issuing new permits pending a safety study. Consequently, small autonomous robots are currently off the sidewalks, while larger devices operated by humans are free to roam.

  **Facts:** Two devices seek to operate:
  (a) A six-pound robot that navigates autonomously. It is monitored by one human in a call center who supervises forty units and can take over remotely only when an error is flagged.
  (b) A two-hundred-pound robot that a worker walks behind on the sidewalk, holding a dead-man switch that stops the machine immediately if released.

  **Prompt:**
  Write a memorandum analyzing whether devices (a) and (b) require a permit. In your analysis, you must:
  1.  Identify the specific textual ambiguity governing "control" and how it applies to both devices.
  2.  Evaluate the significance of the deleted weight clause and the sponsor's comment.
  3.  Assess the legality of the Department's moratorium in light of Section 4.
  4.  Conclude by answering this theoretical question: Do textualism and purposivism disagree about the *outcome* here, or only about how to *justify* the outcome? What does this suggest about the nature of the debate?

  ***

  ### Model Answer

  The statutory scheme creates a tension between the plain text of the exemption and the apparent safety purpose of the Act. Resolving the status of devices (a) and (b) requires navigating textual ambiguity, legislative silence, and administrative overreach.

  **Textual Ambiguity and Application**
  The pivot point is Section 3's exemption for devices under "continuous physical control." This phrase is not self-defining. A strict textualist reading focuses on the ordinary meaning of "physical." Device (b), operated by a worker walking behind it with a dead-man switch, fits the ordinary understanding of physical control; the human is proximate and possesses immediate mechanical intervention. Device (a), however, is supervised remotely by one human managing forty units. This lacks "continuous" attention and "physical" proximity. Under a plain meaning approach, (b) is exempt, and (a) requires a permit.

  However, a surface reading ignores the safety context. If "physical control" implies the ability to prevent harm, the remote supervisor of device (a) may lack the capacity to intervene effectively, reinforcing the need for a permit. Conversely, if the text is treated as unambiguous, the result is that the dangerous, heavy device (b) is unregulated, while the small device (a) is regulated.

  **Legislative History and the Deleted Clause**
  The legislative history presents a trap. The deletion of the fifty-pound exemption suggests the legislature rejected a bright-line size rule. A naive purposivist might argue this deletion proves an intent to regulate *all* devices, including small ones. However, the floor sponsor's comment that they were "leaving it to the department" complicates this. The deletion likely signifies a delegation of authority rather than a mandate to ban small robots. The legislature acknowledged the complexity ("a mess") and refused to codify a size threshold, preferring agency expertise. Therefore, the history supports regulating device (a) but does not necessarily mandate banning it; it supports empowering the Department to decide.

  **Administrative Deference and the Moratorium**
  Section 4 uses mandatory language: the Department "shall issue" a permit upon fee payment and safety plan filing. The moratorium halts this mandatory duty. Unless the safety plan requirement implies a discretionary safety determination, the moratorium appears ultra vires. The Department is effectively rewriting Section 4 to create a ban the legislature declined to write in Section 3. While the legislature delegated the "small robot question," it did not delegate the authority to suspend the permitting statute entirely. The moratorium is likely invalid, meaning device (a) should receive a permit if it files a plan, rather than being banned outright.

  **Theoretical Convergence**
  This scenario reveals that textualism and purposivism often converge on outcomes while diverging on justification. Both theories likely conclude that device (a) requires a permit and device (b) does not. The textualist reaches this via the definition of "physical control." The purposivist reaches this via the safety goal: device (b) has a human present to mitigate risk, while device (a) does not.

  The divergence lies in democratic legitimacy. The textualist accepts the oddity that the heavy robot (b) is exempt because the text says so, trusting the legislature to fix it. The purposivist might strain the text to regulate (b) if the safety risk is high enough. Here, however, the theories align. This suggests the debate is often less about *meaning* and more about *judicial role*. When text and purpose align, the theories are indistinguishable in practice. When they diverge, the debate is not about what the law says, but about who has the authority to change it when the result seems suboptimal. In this case, the text is clear enough to guide both, rendering the theoretical conflict moot on the specific facts, though potent regarding the Department's overreach.

  ***

  ### Marking Scheme (30 Marks)

  **1. Textual Analysis & Ambiguity (8 Marks)**
  *   **A (7-8 marks):** Explicitly identifies "continuous physical control" as the ambiguous term. Distinguishes between proximity/mechanical link (Device b) vs. remote/attenuated link (Device a). Acknowledges that text favors exempting (b) and regulating (a).
  *   **B (4-6 marks):** Treats the text as "clear" without discussing ambiguity. Correctly applies text to facts but fails to explain *why* "physical control" covers the dead-man switch but not remote monitoring.
  *   **C (0-3 marks):** Misapplies the text (e.g., claims (a) is exempt). Ignores Section 3 entirely.

  **2. Legislative History & The "Deleted Clause" Trap (8 Marks)**
  *   **A (7-8 marks):** Recognizes the deletion of the weight clause is *not* simple evidence of an intent to ban small robots. Correctly interprets the sponsor's comment ("leaving it to the department") as a delegation of authority, not a substantive mandate. Avoids the trap of saying "deletion = ban."
  *   **B (4-6 marks):** Treats the deleted clause as straightforward evidence that the legislature intended to regulate small devices. Misses the nuance of delegation vs. prohibition.
  *   **C (0-3 marks):** Ignores legislative history or claims it overrides the text completely.

  **3. Agency Deference & "Shall Issue" (7 Marks)**
  *   **A (6-7 marks):** Identifies the conflict between the moratorium and the mandatory "shall issue" language in Section 4. Argues the Department likely exceeded its authority by creating a de facto ban via moratorium.
  *   **B (3-5 marks):** Discusses deference generally but misses the specific statutory conflict ("shall" vs. "moratorium"). Accepts the moratorium as valid without statutory analysis.
  *   **C (0-2 marks):** Fails to address the Department's action.

  **4. Theoretical Synthesis (Text vs. Purpose) (7 Marks)**
  *   **A (6-7 marks):** Directly answers the meta-question. Argues that Textualism and Purposivism *converge* on the outcome (a regulated, b exempt) but diverge on justification/role. Articulates that the debate is about judicial authority/legitimacy, not just semantic meaning.
  *   **B (3-5 marks):** States that the theories always disagree or always agree without nuance. Recites "text vs. intent" without applying it to the specific convergence in this fact pattern.
  *   **C (0-2 marks):** Ignores the theoretical question or provides a generic definition of the theories without application.

  **General Penalties**
  *   **Case Names:** Deduct 2 marks total if real case names (e.g., *Chevron*, *Scalia*, *Bostock*) are used. The prompt requires conceptual analysis.
  *   **Word Count:** Deduct 1 mark if the answer deviates significantly from the 600-700 word range (too brief to cover issues or too verbose).
  *   **Structure:** Deduct up to 3 marks for poor organization (e.g., no clear conclusion, mixing analysis sections).
