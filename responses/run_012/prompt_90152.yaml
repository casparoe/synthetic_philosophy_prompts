answer: |-
  The sun over Veridia rose without warmth, illuminating the white stone of the Exchange where the citizens gathered as they did every morning. They carried styluses and slates, their faces composed, their minds already turning toward the ledger. They were a people of sums and probabilities, owning little but their coherence. To be incoherent was to be poor; to be inconsistent was to be shamed.

  Orin, the Keeper of the Ledger, sat at the high desk. He dipped his pen into the inkwell that served the whole city and opened the great book to a fresh page. The list of questions for the day was already growing. *Will the rain cease by noon?* *Is the grain shipment from the north delayed?* Citizens approached one by one, whispering their numbers between zero and one into the record.

  Mira was among the first. She was young and trusted the city's habits more than her own cunning. She saw the question added just before the bell: *The Exchange's official price for this sentence on the day it is first posted is less than one half.* It looked like any other query about the Exchange's records, permissible under the charter amended long ago. She felt a flicker of uncertainty. She did not know what the median would be. To express perfect uncertainty, she whispered, "One half." Orin wrote *0.50* beside her name.

  Elian arrived later, his hands stained with chalk dust. He did not approach the desk immediately. He stood at the periphery, watching the flow of citizens, muttering to himself, running simulations on the slate strapped to his forearm. He was trying to model the crowd. He knew that if the median landed below 0.50, the sentence would be true, and the optimal price would be 1.00. If the median landed at 0.50 or above, the sentence would be false, and the optimal price would be 0.00.

  He watched Mira's entry. He watched others. Some, like Mira, posted 0.50. Others, sensing the trap, posted 0.00, betting the collective wisdom would push the median high. Some posted 1.00, betting the city would be timid. Elian's stylus hovered. He calculated the derivative of the crowd's fear. He realized that for every citizen trying to push the median down to make the sentence true, another would push it up to align with the falsehood. The function had no fixed point. There was no number they could collectively agree upon that would not invalidate itself upon inspection.

  Kaelen stood near the desk, arguing quietly with a group of elders. He was a man of the charter, rigid and precise. "The scoring rule is strictly proper," Kaelen said, his voice low but carrying. "It rewards honesty. It demands we post our true belief. But the truth of this sentence is a function of our post. If I believe the median will be low, I must post high. If I post high, the median rises. I cannot be honest about a truth that moves to evade me."

  "The charter says no question may go unpriced," an elder replied.

  "The charter assumes the truth is static," Kaelen countered. "It assumes the ledger records the world. Today, the ledger makes the world. If we price this, we break the scoring rule. If we do not, we break the charter."

  Elian finally approached the desk. He looked at Orin. "If I post 0.49, I contribute to making the sentence true, which means I should have posted 1.00. If I post 0.51, I make it false, which means I should have posted 0.00. There is no equilibrium."

  Orin did not look up from the ledger. "The rule is to post a number. The verifier checks the arithmetic at close. I am not authorized to judge the metaphysics of the question, only the integrity of the sum."

  Elian grimaced. He understood the trap better than anyone. To minimize the city's collective loss, they needed to coordinate on a number that minimized the distance to the resulting truth. But the distance was discontinuous. He looked at Mira, who stood calmly nearby. She had posted 0.50. She hadn't seen the cliff.

  "I will post 0.50," Elian said, his voice tight. "It is the point of discontinuity. It minimizes the maximum error."

  "You know it will be scored as false," Kaelen said. "0.50 is not less than 0.50."

  "I know," Elian said. He wrote *0.50*.

  The day wore on. The tension in the Exchange was not loud; it was a silence in the scratching of styluses. Usually, the hum of calculation was comforting. Today, it felt like the buzzing of a trapped fly. Citizens glanced at the ledger, seeing the column of numbers for the sentence grow. There was no convergence. The distribution was bimodal, peaks at 0.00 and 1.00, with a stubborn cluster at 0.50 from those like Mira who simply admitted ignorance.

  At noon, the bell rang. The posting closed. Orin calculated the median. He ran his finger down the column, counting the entries. He stopped. He counted again. He looked up, his face unreadable.

  "The median is 0.50," Orin announced.

  A ripple went through the hall. Kaelen closed his eyes. He knew what came next. Since 0.50 is not less than 0.50, the sentence was false. The truth value was 0. The official price was 0.50. Every citizen would be scored against the truth of 0.

  Mira frowned. "I posted 0.50. I was uncertain. But the truth is zero?"

  "The truth is determined by the price," Elian said softly. "And the price was determined by us. We built a machine that outputs a lie."

  That evening, the scores were published. The ledger showed a scar. For every other question, the city's coherence was high; the sum of squared errors was within standard deviation. For this sentence, the error was massive. The city had priced a falsehood at 0.50. The scoring rule, designed to punish dishonesty, punished them for existing. They had followed every rule, posted honestly according to their best models, and yet the ledger recorded them as liars.

  The next morning, the Exchange was full. No new questions were posted initially. The citizens stood before the ledger, looking at the previous day's entry. The scandal was not that they were wrong; it was that the rules had allowed them to be necessarily wrong.

  Kaelen stepped forward. He held a copy of the charter. "The scoring rule presumes independence," he said to the assembly. "It assumes the world does not look back at the price. This question looked back. It bit its own tail."

  "We cannot strike it," Orin said from the high desk. "The ledger is auditable. The entry stands. The loss stands."

  "We cannot price like this again," Elian said. He stepped up beside Kaelen. "I simulated the day ten thousand times in my head. There is no number that saves us. If we ban such questions, we limit the charter. If we allow them, we break the scoring."

  Mira spoke from the crowd. "I posted what I believed. I believed the median would be half. I was right about the median. I was wrong about the truth. But the truth depended on the median. How do I believe correctly about a thing that changes because I believe it?"

  The silence stretched. The sun moved across the stone floor. They were a people of arithmetic; they knew that when an equation has no solution, you do not force one. You change the equation.

  "We amend the charter," Kaelen said. "Not to remove the question. But to change the time of the price."

  Elian nodded. "Reflexive questions. Questions about the current day's median. They cannot be priced on the current day."

  "Then when?" Orin asked.

  "Tomorrow," Elian said. "We price yesterday's reflexive questions today. The truth is settled. The price is independent."

  "It creates a lag," Kaelen noted. "The ledger will always be one day behind on itself."

  "Better a lag than a break," Kaelen replied. "Better a delay than a lie."

  The voting was swift. There was no sentiment in it, only the cold weighing of costs. The cost of coherence was time. They would sacrifice the immediacy of self-knowledge for the integrity of the score.

  Orin took his pen. He turned to a fresh page in the charter. He wrote the amendment in the precise script of the city. *Questions referencing the official price of the current day shall be priced on the following day, against the settled median of the prior.*

  He turned back to the ledger. He drew a new column header beside the date. *Provisional.* Below it, *Settled.*

  "Today's list," Orin announced. "There are no reflexive questions. But yesterday's question remains on the list. It is now a settled fact. The median was 0.50. The truth was 0. Who will price it?"

  Mira stepped forward. She knew the truth now. It was fixed. It did not move when she looked at it. She whispered, "0.00."

  Orin wrote it down. The ink dried. The line was straight.

  Elian watched the number enter the ledger. It was no longer a performative act. It was a record. The city had lost the ability to price itself in the present moment, but it had saved the meaning of the price. They stood in the quiet hall, the sun warming the stone slightly, and waited for the next question, ready to count the cost of knowing.
