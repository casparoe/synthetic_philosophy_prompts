      *   **Characters:**
          *   Citizen 1: Tries to compute the median by simulating others (the Calculator).
          *   Citizen 2: Argues from charter/scoring rule (the Legalist/Pragmatist).
          *   Citizen 3: Posts quickly/honestly without seeing the trap (the Naive/Honest).
          *   Keeper of the Ledger: Present, not omniscient.
      *   **Constraints:**
          *   No lectures on the paradox.
          *   No naming famous theorems.
          *   No fiat solutions (can't declare it meaningless).
          *   Must end in a settled practice/rule change, not a settled answer.
          *   Show logical uncertainty through action/argument.
          *   Third person, ~1500 words.
          *   Names for city and at least two citizens.
      *   **Core Conflict:** The sentence "The Exchange's official price for this sentence on the day it is first posted is less than one half." creates a discontinuity. If price < 0.5, truth = 1 (should price 1). If price >= 0.5, truth = 0 (should price 0). No fixed point.
      *   **Goal:** Show the struggle and the resulting institutional change.

  2.  **Character Development:**
      *   City Name: Axioma? Veridia? Let's go with **Veridia**.
      *   Citizen 1 (Calculator): **Elian**. Obsessed with prediction, models the crowd.
      *   Citizen 2 (Legalist): **Kaelen**. Focused on the scoring rule and coherence.
      *   Citizen 3 (Naive): **Mira**. Trusts the system, posts based on intuition.
      *   Keeper: **The Auditor** (or a name like **Orin**). Let's use **Orin**.

  3.  **Plot Outline:**
      *   **Morning:** The sentence appears. Citizens gather at the Exchange.
      *   **Midday:** Panic sets in as Elian realizes the loop. Kaelen argues about the scoring rule. Mira posts her number.
      *   **Closing:** The median is calculated. It lands somewhere (likely 0.5 due to the split).
      *   **Aftermath/Resolution:** The scoring reveals the incoherence. The city debates. They cannot fix the past, but they change the future rules (e.g., separating self-referential questions, or allowing a "null" price, or changing the scoring rule for fixed-point failures). The prompt requires a *settled practice*. Let's go with a procedural change: questions about the current day's median are deferred or priced differently. Or perhaps they accept a "gap" in coherence.
      *   **Refinement on Resolution:** The prompt says "No citizen has ever had cause to regret the amendment" regarding past rules. Now they do. They need a new habit. Maybe they introduce a "Settlement Day" where self-referential prices are resolved retrospectively, or they admit that some prices are *performative* rather than *descriptive*. Let's aim for a rule change: Self-referential questions regarding the current day's median are banned or moved to a separate ledger with different scoring. Actually, the prompt says "They may change the rules, but only after the change has been argued for and its cost counted." And "end in a settled practice... an amended rule, a new column in the ledger, a habit."
      *   **Idea:** They realize the scoring rule (strictly proper) breaks here. They introduce a "Suspension" clause. Or they accept that the ledger records *intent* rather than *truth* for such cases. Let's go with: They create a new category of question that is priced *after* the fact, or they agree to price such sentences at exactly 0.5 regardless of truth, accepting a penalty as a tax for consistency. No, that violates the scoring rule.
      *   **Better Idea:** They realize the median mechanism fails for fixed-point discontinuities. They amend the charter to allow the Keeper to flag "Reflexive Questions" which are priced not by median but by a specific algorithm (e.g., fixed-point iteration) or simply excluded from the daily scoring until the next day. Let's go with exclusion/deferral. It shows the limit of their system.
      *   **Wait, one more constraint:** "The citizens must find the structure from their own rules." They need to realize *why* it breaks.
      *   **Ending:** They add a column for "Provisional" prices or ban immediate self-reference. Let's go with banning immediate self-reference regarding the current day's median.

  4.  **Drafting - Scene by Scene:**
      *   **Scene 1: The Posting.** Mira sees the sentence. It looks like any other. She writes 0.5 (uncertainty).
      *   **Scene 2: The Realization.** Elian is running simulations. He sees the divergence. He tries to shout it out.
      *   **Scene 3: The Argument.** Kaelen cites the scoring rule. If we price < 0.5, we lie. If >= 0.5, we lie. Orin (Keeper) watches the ledger fill.
      *   **Scene 4: The Close.** The median is calculated. It lands on 0.5 (or close to it). The scoring happens later (usually overnight).
      *   **Scene 5: The Morning After.** The scores are published. Everyone lost points on this question. The coherence of the ledger is broken.
      *   **Scene 6: The Reform.** They meet. They decide to amend the charter. Self-referential pricing regarding the current day is moved to a "Settlement Ledger" priced T+1.

  5.  **Writing - Focus on Tone:**
      *   Patient, unsentimental, arithmetic-focused.
      *   Show the tension in the numbers, the scratching of styluses, the silence of the hall.
      *   Avoid explaining the paradox explicitly. Show the math failing.

  6.  **Refining the Paradox Interaction:**
      *   Sentence S: "Price(S) < 0.5".
      *   If Median(S) = 0.4 -> S is True -> Ideal Price = 1.0. Error = (1.0 - 0.4)^2.
      *   If Median(S) = 0.6 -> S is False -> Ideal Price = 0.0. Error = (0.0 - 0.6)^2.
      *   If Median(S) = 0.5 -> S is False (since 0.5 is not < 0.5) -> Ideal Price = 0.0. Error = (0.0 - 0.5)^2.
