      *   **The Brother's Argument:** Summarizes the Lucas-Penrose argument: Gödel's incompleteness $\rightarrow$ Humans see truth outside the system $\rightarrow$ Mind $\neq$ Formal System $\rightarrow$ Computer = Formal System $\rightarrow$ Mind $\neq$ Computer $\rightarrow$ Penrose adds quantum mechanics $\rightarrow$ Strong AI is impossible.
