      *   **The "Stepping Outside" Claim (The Philosophy):** This is the weak link. The "Consistency Assumption." If the mind is a machine, do we know *which* machine? If we don't know the code, we can't construct $G$. Also, are humans consistent? (We make mistakes).
      *   **First vs. Second Theorem:** Lucas uses G1 mostly. Penrose leans on G2 (unprovability of consistency). Explain why G2 matters (we can't prove our own consistency).
      *   **The Quantum Leap:** Distinguish Lucas (anti-mechanist) from Penrose (quantum brain). Emphasize that the quantum part is widely rejected by physicists and neuroscientists.
      *   **The AI Conclusion:** Distinguish between "Strong AI" (consciousness) and "Weak AI" (behavior). The argument attacks the former, not necessarily the latter.
      *   **The Defender's Reply:** How would Penrose respond? (We *do* perceive mathematical truth, therefore we are non-algorithmic).
      *   **Consensus:** Most philosophers/logicians reject the argument. Why? (The "Shoe-horn" objection, consistency issues).

  4.  **Refining the Tone:**
