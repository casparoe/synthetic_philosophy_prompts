answer: |-
  This is a sharp observation, and you are right to sense a tension. The practice you are describing—deriving conservation laws from symmetry principles via Noether's Theorem while maintaining that both are "laws"—is standard in theoretical physics. However, the metaphysical interpretation of that derivation is notoriously slippery.

  Here is a reconstruction of what this practice presupposes, where it is underdetermined, and how it maps onto Humean and anti-Humean frameworks.

  ### 1. What the Practice Strictly Requires vs. What It Fits With

  To start, we need to separate the mathematical formalism from the metaphysical gloss.

  **What the practice strictly requires:**
  Strictly speaking, the practice requires only a Lagrangian or Hamiltonian formulation of mechanics where the action integral is invariant under continuous transformations. It requires that the mathematical derivation holds: if the action has a specific symmetry, a specific current is conserved. It does *not* strictly require any commitment to whether the symmetry "causes" the conservation, whether both are merely descriptions of a mosaic, or whether one is more ontologically fundamental than the other. The math works identically regardless of whether you are a Humean, an anti-Humean, or an instrumentalist.

  **What the practice fits with (Underdetermination):**
  The language physicists use—"symmetries dictate conservation laws," "symmetries are more fundamental"—is compatible with multiple metaphysical pictures, provided you adjust the definition of "fundamental."
  *   **Epistemic Fundamentality:** Symmetries are starting points for calculation.
  *   **Ontological Fundamentality:** Symmetries are the "makers" of the regularities.
  *   **Systematic Fundamentality:** Symmetries are the axioms of the best summary.

  The practice is underdetermined because physicists often slide between these meanings without noticing. When your friend says it is "just a useful way to organize the math," she is pointing to the fact that the practice itself is metaphysically neutral. However, when philosophers or theoretically inclined physicists claim symmetries are "more fundamental," they are importing a metaphysical hierarchy that the math alone does not mandate.

  ### 2. The Anti-Humean (Governing) Reading

  If you adopt an anti-Humean view where laws govern nature or reflect natural necessities, the practice fits very naturally, but it demands a specific hierarchical structure.

  **The Presupposition:**
  On this view, treating symmetries as the source of conservation laws presupposes that symmetries function as **meta-laws**. They are not just regularities; they are constraints on what first-order dynamical laws are possible. If laws govern events, symmetries govern the laws.

  **Does it make conservation laws less lawlike?**
  No. In an anti-Humean framework, a derived law can still be a genuine law. It just means its modal force is inherited from the symmetry. The conservation of energy is necessary because the time-translation symmetry is necessary.

  **What would have to change for a strict Anti-Humean?**
  To be consistent, a strict anti-Humean must commit to the modal status of the symmetries. You cannot simply say symmetries are "features of the laws." You must argue that symmetries have a stronger modal status than the dynamical equations they constrain. If the dynamical laws could have been different but the symmetries could not, then the symmetries are the true governing principles. The practice would need to shift from treating symmetries as heuristic tools to treating them as the primary bearers of natural necessity.

  ### 3. The Humean (Best-System) Reading

  This is where your confusion about the Best-System Account (BSA) is most pertinent. Many philosophers assume BSA struggles with derived laws, but it actually handles this scenario cleanly, provided you adjust your intuition about what "law" means.

  **The Presupposition:**
  For a Humean, laws are the axioms and theorems of the deductive system that best balances simplicity and strength in summarizing the cosmic mosaic.
  *   **Symmetries:** These are likely candidates for **axioms**. Stating "the laws are time-translation invariant" is incredibly simple and entails a vast range of specific dynamical behaviors.
  *   **Conservation Laws:** These are **theorems** of that system.

  **Does being a theorem make them less lawlike?**
  For a Humean, **no.** In the BSA, anything that is entailed by the best system is a law. There is no ontological distinction between an axiom of the best system and a theorem of the best system. Both are true summaries of the mosaic. The fact that conservation of energy is a theorem of the symmetry axiom does not make it "less of a law"; it just means it is not an *axiomatic* law. It is still a law because it is part of the best systematization.

  **What would have to change for a strict Humean?**
  A strict Humean must purge the language of "constraint" and "production."
  *   **Stop saying:** "Time translation symmetry *forces* energy to be conserved."
  *   **Start saying:** "The pattern of events in the universe is such that the simplest summary includes a time-translation symmetry axiom, which logically entails that energy is conserved."
  *   **The Shift:** The symmetry does not constrain the mosaic; the mosaic constrains the system. The symmetry is in the best system *because* the mosaic happens to exhibit that pattern. The direction of fit is reversed compared to the anti-Humean view.

  ### 4. The Functional Kind View

  You asked if the practice presupposes that "law" is a functional kind. This is a strong candidate for what is actually happening in the seminar room.

  If "law" is a functional role (e.g., supporting counterfactuals, explaining phenomena, organizing theory), then both symmetries and conservation laws can realize that role.
  *   Conservation laws realize the role of constraining physical processes (you can't build a perpetual motion machine).
  *   Symmetries realize the role of unifying different dynamical laws (they tell you why gravity and electromagnetism both respect energy conservation).

  On this view, there is no metaphysical conflict. One entity (symmetry) realizes the "unification" function, and another (conservation) realizes the "constraint" function. They are linked mathematically, but metaphysically they are just different tools doing different jobs. This view dissolves the tension but might feel unsatisfying if you are looking for a unified ontology.

  ### 5. The Noether's Theorem Angle

  This is the crux of your question: If conservation laws are theorems derived from symmetries, does that make them less lawlike for a Humean, or does it make symmetries the real laws?

  **For the Anti-Humean:**
  Noether's theorem reveals a dependency relation in the world. The symmetry is the ground; the conservation law is the grounded. The symmetry is "more real" or "more fundamental" in the chain of governance. Conservation laws are real laws, but they are derivative.

  **For the Humean:**
  Noether's theorem reveals a logical dependency within the Best System.
  *   It does **not** make conservation laws less lawlike. They remain laws because they are robust, counterfactual-supporting generalizations included in the best system.
  *   It **does** make symmetries the *axiomatic* basis. If including the symmetry axiom makes the system simpler than listing every conservation law individually, the symmetry gets the axiomatic spot.
  *   **Crucial Point:** For the Humean, the symmetry is not "the real law" in the sense of being the only truth-maker. The truth-maker for both the symmetry and the conservation law is the mosaic of particular events. The derivation is internal to the system, not external to the world.

  ### 6. Summary of Metaphysical Commitments

  To answer your core question: **The practice does not presuppose an anti-Humean governing view, nor does it presuppose a Humean view.** It is compatible with both, but the *interpretation* of the practice differs radically.

  *   **Underdetermination:** The practice underdetermines the direction of metaphysical explanation. It establishes a mathematical equivalence, not an ontological priority.
  *   **The Hidden Commitment:** The only thing the practice strictly presupposes is **structural realism** of a sort: that the structure of the theory (the Lagrangian symmetries) maps onto something real enough to do work. Whether that "something" is a governing principle or a summary pattern is left open.

  **If you adopted a straightforward Humean Best-System view:**
  You would have to stop treating symmetries as constraints on nature. You would treat them as constraints on *theory choice*. You would say, "We posit time-translation symmetry because it yields the simplest system that captures the events." Conservation of energy is a law because it is a theorem of that system. The "source" of the conservation law is not the symmetry itself, but the fact that the mosaic is best described by a system containing that symmetry.

  **If you adopted a straightforward Anti-Humean Governing view:**
  You would have to commit to symmetries as meta-laws. You would argue that the reason energy is conserved is that the universe is governed by a principle of time-translation invariance. The conservation law is lawlike because it flows from a governing principle. You would need to explain what kind of entity a symmetry is if it is not just a regularity (e.g., a relation between universals, or a dispositional property of spacetime).

  **Conclusion:**
  The "weirdness" you feel comes from physicists using modal language ("must," "constrain," "fundamental") without specifying the metaphysical cash value of those terms. For the physicist, the math does the work. For the philosopher, the math is neutral. The practice licenses the talk of symmetries being fundamental, but it does not force you to accept that they are ontologically prior. You can treat them as axiomatic summaries (Humean) or governing meta-laws (Anti-Humean) without breaking the physics. The choice depends on your broader metaphysical commitments, not on the practice of deriving conservation laws itself.
