      *   *The "Winging It" angle:* She might be applying a "Homeless Litmus Test." If it stops a homeless person from surviving, it's political. If it just annoys a driver, it's not.
      *   *Let's formalize the rules for the output:*
          1.  **The Disparate Impact Rule:** Does the constraint fall heavier on a marginalized group? (Bench, Soap, Cul-de-sac).
