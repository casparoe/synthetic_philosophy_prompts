      *   *Selection:* Let's go with **Disproportionate Burden** and **Social Sorting**. They are slightly different but overlap. Actually, the prompt asks for the rule she is *really* using. The cul-de-sac example is the tell. It highlights *unintended* systemic effects.
      *   *Revised Rule 1: The Exclusionary Outcome Rule.* (Does it prevent a specific type of person from using the space/object?)
      *   *Revised Rule 2: The Universal Safety/Utility Rule.* (Is the constraint applied equally to everyone for a neutral goal?)
