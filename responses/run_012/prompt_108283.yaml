      *   *Actually, the "Winging It" angle is strong.* She treats bugs (soap) and features (benches) the same.
      *   *Let's refine the "Winging It" analysis.* She seems to have a "Homeless/Outsider Detector." If it keeps the "unwanted" out, it's political. If it keeps "everyone" safe, it's not. The Guardrail keeps pedestrians out of the highway (unwanted) but protects drivers (wanted). This is the inconsistency.

      *   *Final Plan:*
