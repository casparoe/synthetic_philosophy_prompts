      *   *Let's try to find the inconsistency.* Guardrails prevent you from driving off a cliff. That restricts freedom. But it's "not political." Why? Because it preserves life (universal good). Benches restrict lying down. That restricts freedom. Why "political"? Because it targets a specific behavior associated with a specific class.
