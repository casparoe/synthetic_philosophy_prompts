      *   *Which one is she really using?* The **Disparate Impact Rule** tempered by the **Safety Exception**. But the Cul-de-sac proves she doesn't require *malice*.
      *   *Actually, the most consistent rule is:* **Does the artifact enforce a social hierarchy?**
          *   Bench: Housed > Unhoused.
          *   Soap: Light Skin > Dark Skin.
          *   Cul-de-sac: Resident > Outsider.
          *   Speed Bump: Driver = Driver (No hierarchy).
          *   Guardrail: Driver = Driver (No hierarchy).
          *   F/J Key: Typist = Typist (No hierarchy).
      *   *Fountain:* Creates hierarchy. Bottle Owners > Non-Owners. Hygienic > Thirsty.

  6.  **Develop the Test Case (The Wedge):**
      *   I need a case that forces a choice between "Disparate Impact" and "Safety/Utility."
      *   *Idea:* A design that improves safety but disproportionately burdens a specific group.
      *   *Example:* Street lighting that is bright enough to deter crime (safety) but uses a frequency that disturbs nearby residents in a low-income neighborhood (disparate impact).
