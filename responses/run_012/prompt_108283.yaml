      *   *Best Test Case:* **Smart Streetlights with Dimming.**
          *   Scenario: Lights dim after 1 AM to save energy/reduce light pollution (Universal/Environmental good).
          *   Impact: Makes walking home at night less safe for service workers (disproportionately women/minorities) compared to drivers.
          *   *Why it works:* It pits "Universal Good (Environment/Efficiency)" against "Disparate Safety Burden."

      *   *Wait, I need to check if her list is inconsistent.*
      *   Guardrails: Protect drivers. Do they protect pedestrians? No. They protect the *vehicle occupants*. If a pedestrian hits a guardrail, they get hurt. But the design intent is vehicle containment.
      *   Speed Bumps: Slow cars. Annoy everyone.
      *   Is there a hidden bias? She calls Cul-de-sacs political (segregation) but Speed Bumps not (annoyance). Both restrict movement. The difference is *who* is restricted. Cul-de-sacs restrict *through-traffic* (outsiders). Speed bumps restrict *local traffic* (insiders too).
      *   *Inconsistency Check:* If she thinks Cul-de-sacs are political because they isolate communities, why aren't Guardrails political because they isolate the road from the landscape? (Weak).
      *   *Stronger Inconsistency:* The Soap Dispenser. It fails on dark skin. That's a *bug*, not a *feature*. The Bench armrests are a *feature*. The Cul-de-sac is a *feature* with unintended *social consequence*.
      *   *The Glitch:* She treats a **failure of technology** (soap) the same as a **success of policy** (benches).
      *   *Rule Conflict:* Is it political if the exclusion is accidental (soap/cul-de-sac) vs intentional (benches)? She says yes to both.
      *   *So where is the inconsistency?* Maybe the Guardrail. Guardrails kill motorcyclists disproportionately. If she knows this and says "Not Political," she is ignoring Disparate Impact. If she doesn't know, she's winging it.
      *   *Let's focus on the "Safety Alibi".* Speed bumps and Guardrails are "Safety." Benches and Fountains are "Hygiene/Order."
      *   *The Wedge:* A safety device that has disparate impact.
      *   *Case:* **Airbags.** Early airbags killed small women and children disproportionately. Were they political? By her logic (Soap Dispenser = Political), yes. By her logic (Guardrail = Not Political), no.
      *   *This is the winner.* Airbags vs. Guardrails.

  7.  **Drafting the Response:**
      *   **Verdict:** She will flag the fountain as **Political**.
      *   **The Rules:**
          1.  **The Disparate Impact Rule:** Does the design burden a specific social group more than others? (Bench, Soap, Cul-de-sac).
