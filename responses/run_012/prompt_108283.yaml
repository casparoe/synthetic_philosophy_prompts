answer: |-
  Maya is going to flag the fountain as **political**. In fact, she's probably going to call it "textbook hostile architecture."

  Here is the breakdown of the rules she is actually using, how they apply to the fountain, where her logic cracks, and the case that would break her brain.

  ### The Three Rules Maya Is Running

  To make sense of her list, you have to look past the objects and look at the *relationships* they enforce between people and space.

  **1. The Disparate Impact Rule**
  *   **Definition:** An artifact is political if its constraints or failures burden a specific social group (homeless, racial minorities, outsiders) more than the general population.
  *   **Fits:** Park benches (burdens homeless), Soap dispensers (burdens dark skin), Cul-de-sacs (burdens outsiders/public transit users).
  *   **Excludes:** Speed bumps (burdens all drivers equally), F/J keys (benefits all typists equally).

  **2. The Intent Irrelevance Rule**
  *   **Definition:** It does not matter if the designer *intended* the exclusion. If the structural outcome sorts people into classes, it is political.
  *   **Fits:** Cul-de-sacs (she explicitly notes the designers weren't trying to keep people out, yet she still flags it).
  *   **Excludes:** Nothing on her list contradicts this, but it prevents her from accepting "It wasn't our goal" as a defense.

  **3. The Universal Safety Exception**
  *   **Definition:** An artifact is *not* political if the constraint is applied universally for the immediate purpose of physical safety or basic ergonomic function.
  *   **Fits:** Speed bumps (safety for all), Guardrails (safety for all), F/J keys (function for all).
  *   **Excludes:** Benches (sitting is safe, lying down is not "unsafe"), Soap dispensers (hygiene is the goal, but racial bias is a failure, not a safety constraint).

  ### The Verdict on the Fountain

  Maya will flag the fountain as **Political**.

  **Why:**
  The fountain fails the **Disparate Impact Rule** and does not qualify for the **Universal Safety Exception**.
  *   **Bottle-only:** Disproportionately burdens people who cannot afford reusable bottles or who are thirsty spontaneously (often lower-income users).
  *   **Shallow/Sloped Basin:** This is the "armrest on the bench" equivalent. It explicitly prevents sitting (homeless/resting elderly) and washing (homeless/laborers).
  *   **30-Second Shutoff:** Prevents filling larger containers, which burdens people who don't have easy access to frequent refill spots.

  While the city will claim "Hygiene" and "Water Conservation" (Safety/Utility alibis), Maya will argue these are pretexts. Hygiene doesn't require removing the bubbler (standard sanitization exists), and conservation doesn't require preventing washing. Therefore, the design sorts users into "Deserved/Public" vs. "Undesired/Loiterer," triggering her **Social Sorting** heuristic.

  ### The Dominant Rule: Social Sorting

  The rule she is *really* using is a synthesis of the three above. Let's call it the **Social Sorting Heuristic**.

  **The Heuristic:** *Does this design enforce a hierarchy of who belongs in this space?*

  *   **Benches:** Housed > Unhoused. (Political)
  *   **Soap:** Light Skin > Dark Skin. (Political)
  *   **Cul-de-sacs:** Resident > Outsider. (Political)
  *   **Speed Bumps:** Driver = Driver. (Not Political)
  *   **Guardrails:** Driver = Driver. (Not Political)
  *   **F/J Keys:** Typist = Typist. (Not Political)

  She isn't just looking for bias; she's looking for **power dynamics**. If the design decides who is a "citizen" and who is a "problem," it's political. If the design treats all users as equal participants in a system, it's not.

  ### The Inconsistency: She Is Quietly Winging It

  Maya's list has a significant crack in it: **The Highway Guardrail.**

  By her own **Disparate Impact Rule**, guardrails are political. Guardrails are designed to contain cars. They are highly effective at protecting vehicle occupants (drivers/passengers). However, they are often lethal to motorcyclists, cyclists, and pedestrians who strike them.
  *   **The Sort:** Car Owners > Non-Car Owners / Vulnerable Road Users.
  *   **The Outcome:** It prioritizes the safety of one class of road user over another.

  If she calls guardrails "not political," she is making an exception for **Civil Infrastructure** that she doesn't make for **Product Design**. She treats "engineering standards" as neutral, even when they encode a preference for four-wheeled vehicles over two-wheeled ones or pedestrians. This suggests her "Safety Exception" is actually a "Standard Industry Practice Exception." She trusts the Department of Transportation more than she trusts a park designer.

  ### The Test Case: The "Male Default" Crash Dummy

  To force her to choose between her rules, present her with this case:

  **The Case:**
  > "Automotive safety standards for the last 40 years have used crash test dummies based on the 50th percentile *male* body. Women are 40% more likely to be injured in a car crash of the same severity because the seatbelts, airbags, and crumple zones are designed for male mass and bone density."

  **The Conflict:**
  *   **Apply the Universal Safety Exception:** Seatbelts and airbags are "safety features" intended to protect everyone (like Guardrails). By this rule, the car is **Not Political**.
  *   **Apply the Disparate Impact/Social Sorting Rule:** The design systematically endangers women to protect men. It creates a hierarchy of safety based on sex (like the Soap Dispenser creates one based on race). By this rule, the Car is **Political**.

  **The Trap:**
  If she says the Car is **Political**, she has to go back and re-evaluate the **Guardrail** (which also prioritizes cars over people).
  If she says the Car is **Not Political** (because it's "just safety tech"), she admits that her verdict on the **Soap Dispenser** was inconsistent (both are tech failures that hurt specific demographics), or that she only cares about politics when the exclusion is about *public space* (benches/parks) rather than *private products* (cars).

  This forces her to admit whether she cares about **Bias** (the soap/crash dummy) or **Territory** (the bench/fountain/cul-de-sac). Her list suggests she cares about Territory, but her Soap Dispenser verdict suggests she cares about Bias. The Crash Dummy case breaks the tie.
