      *   *Even Better (closer to her list):* **Automatic Doors with Motion Sensors.**
          *   Scenario: Heavy doors replaced by sensors.
          *   Safety/Utility: Accessibility for wheelchairs (Universal).
          *   Disparate Impact: Sensors often fail to detect people of color (like the soap dispensers).
          *   *Wait, she already ruled on soap dispensers.*
      *   *Let's try:* **Noise Barriers on Highways.**
          *   Scenario: Walls built to reduce noise for a wealthy suburb.
          *   Safety/Utility: Health benefit (noise reduction).
