answer: |-
  This is a profound observation, and it cuts to the heart of the difficulty in bridging ethology, cognitive science, and philosophy of mind. You have identified a structural feature of explanation that is often gestured at but rarely named as a distinct phenomenon.

  To answer your first question directly: **No, there is no single, established term that captures specifically the *reversal* of the rigidity/flexibility verdict based on the level of description.**

  However, your observation sits at the intersection of several well-established concepts. To understand why no single name exists, and to justify the coinage you requested, we must first map the "near misses" in the literature.

  ### 1. The Near Misses (Existing Concepts)

  **A. Ethology: Fixed Action Patterns (FAP)**
  In classical ethology (Lorenz, Tinbergen), the behavior you described in the wasp (*Ammophila*) is the textbook definition of a **Fixed Action Pattern**. It is triggered by a sign stimulus and runs to completion. However, ethology traditionally treats FAPs and "flexible" behavior as distinct categories. Your insight—that the *same behavior* is an FAP at one level and flexible at another—exposes a limitation in that binary. Ethology lacks a term for the *relativity* of the FAP status.

  **B. Philosophy of Action: Actions Under a Description**
  The phrase "agent-under-a-description" echoes **Donald Davidson** and **G.E.M. Anscombe**. Davidson argued that an event is an intentional action only *under certain descriptions*. (e.g., "I flipped the switch" is intentional; "I alerted the burglar" may not be).
  *   **Proximity:** This captures the idea that properties (like intentionality) attach to descriptions, not raw events.
  *   **Gap:** Davidson focuses on *intentionality*, not *rigidity*. He does not explicitly theorize the trade-off where a description that grants intentionality (flexibility) removes mechanistic rigidity, or vice versa.

  **C. Cognitive Science: Marr's Levels of Analysis**
  David Marr proposed three levels: **Computational** (goal), **Algorithmic** (procedure), and **Implementation** (hardware).
  *   **Proximity:** A system can be rigid at the Implementation level (neurons firing deterministically) but flexible at the Computational level (achieving the goal despite noise).
  *   **Gap:** Marr's levels are hierarchical and usually assumed to align. Your observation is that the *verdict* on flexibility flips depending on which level is chosen as the "identity" of the behavior.

  **D. Cybernetics: Perceptual Control Theory (PCT)**
  This is perhaps the closest scientific framework. In PCT (William Powers), behavior is the control of perception. The system keeps a **Reference Signal** (goal) rigid by varying its **Output** (action) flexibly to counteract disturbances.
  *   **Proximity:** This explains your wasp perfectly. The "Reference" is *prey at burrow threshold*. The "Output" is the dragging motion. If the Reference is rigid, the Output must be flexible. If the Reference is changed to *complete the motor sequence*, the Output becomes rigid.
  *   **Gap:** PCT describes the *mechanism*, but it does not have a specific term for the *philosophical ambiguity* that arises when an observer switches which variable they treat as the Reference.

  **E. Dennett's Stances**
  Daniel Dennett distinguishes the **Physical Stance** (predict by laws of physics; rigid) from the **Intentional Stance** (predict by beliefs/desires; flexible/rational).
  *   **Proximity:** This captures the "machine vs. agent" dichotomy.
  *   **Gap:** Dennett treats these as tools for the *observer*. Your observation is that the *organism itself* exhibits this duality internally (the ant is mechanically rigid regarding the landmark, but flexibly goal-directed regarding the food).

  ### 2. The Coinage: Level-Relative Invariance (LRI)

  Since no existing term captures the specific *reversal* of the rigidity/flexibility verdict based on descriptive grain, I propose the term **Level-Relative Invariance** (or **Descriptive Relativity of Constraint**).

  Here is the precise definition you requested.

  #### **Definition: Level-Relative Invariance (LRI)**
  **Level-Relative Invariance** is the phenomenon wherein the ascription of rigidity (mechanism) or flexibility (agency) to a system is not an intrinsic property of the system's physical dynamics, but a function of the **locus of invariance** selected by the observer's description.

  A system exhibits LRI when:
  1.  **Description A** posits a variable $X$ as the fixed constraint (the goal/rule). Under Description A, variable $Y$ appears flexible (adaptive/compensatory).
  2.  **Description B** posits variable $Y$ as the fixed constraint (the routine/sequence). Under Description B, variable $X$ appears rigid (invariant/repetitive).
  3.  Both descriptions accurately model the physical events, yet yield contradictory normative verdicts (e.g., "intelligent" vs. "automatic").

  #### **What It Excludes**
  *   **Simple Mixed Behavior:** It is not merely the fact that an animal has some habits and some reflexes. LRI requires that the *same* episode be interpretable both ways.
  *   **Multiple Realizability:** This refers to different physical states realizing the same function. LRI refers to the *same* physical states realizing different functions/constraints depending on the grain.
  *   **Equifinality:** This is reaching the same end from different beginnings. LRI explains *why* equifinality looks like flexibility at one level and rigidity at another.

  #### **Boundary Cases**
  *   **The Thermostat:**
      *   *Level 1 (Goal):* Maintains 70°F. Flexible (turns on/off as needed).
      *   *Level 2 (Mechanism):* Bimetallic strip bends at specific temperature. Rigid (physical law).
      *   *Verdict:* Low LRI. We rarely mistake a thermostat for an agent because the "goal" level is too simple.
  *   **The Wasp (Your Example):**
      *   *Level 1 (Sequence):* "Inspect burrow." Rigid (restarts if interrupted).
      *   *Level 2 (Motor):* "Drag prey." Flexible (compensates for wind).
      *   *Verdict:* High LRI. The conflict between levels creates the illusion of "stupidity" or "intelligence" depending on the observer's focus.
  *   **The Human Obsessive:**
      *   *Level 1 (Principle):* "Keep hands clean." Flexible (uses sanitizer, gloves, soap).
      *   *Level 2 (Ritual):* "Wash exactly 3 times." Rigid (distress if interrupted).
      *   *Verdict:* High LRI. We call this "compulsion" when the lower level dominates, "hygiene" when the upper level dominates.

  ### 3. The "Bottom Level" and Free Will

  You ask: *"Is there a bottom level that settles the matter? Or is mechanical always a description relative to a chosen grain?"*

  If **Level-Relative Invariance** is a universal feature of complex systems (which control theory suggests it is), then the demand for a "bottom level" that settles the question of free will is a **category error**.

  Here is why:
  1.  **The Regress of Control:** In any hierarchical control system (like a nervous system), a higher level sets the reference for a lower level. The lower level is "rigid" in serving that reference, but "flexible" in how it achieves it. But the higher level's reference is itself controlled by an even higher level.
  2.  **No Absolute Fixity:** There is no level where the system is *purely* rigid (like a rock) or *purely* flexible (like a ghost). Even the "bottom" physical level (neurons/atoms) is only rigid relative to the laws of physics, which themselves describe patterns of invariance.
  3.  **The Dissolution of the Dichotomy:** The question "Are we free or merely complicated machines?" assumes that "machine" implies rigidity and "free" implies a lack of mechanism. LRI shows that **mechanism is the substrate of flexibility.** You cannot have flexibility at Level $N$ without rigidity (constraint) at Level $N-1$. The wasp's flexible compensation for wind *requires* the rigid motor reflexes.

  Therefore, the "bottom level" does not settle the matter because **rigidity is not the opposite of freedom; it is the prerequisite for it.** A system that was not rigid at *some* level of description (e.g., maintaining its own structural integrity) could not act at all.

  ### Summary for the Entomologist-Philosopher

  You have rediscovered a central problem in **Cybernetics** and **Non-Reductive Physicalism**, but from the ground up, via the burrow of the wasp.

  *   **Established Concept:** There is no single term. The closest cluster is **"Intentionality under a Description"** (Davidson) combined with **"Levels of Analysis"** (Marr) and **"Reference Signals"** (Control Theory).
  *   **Proposed Term:** **Level-Relative Invariance (LRI)**.
  *   **Definition:** The property of a system wherein the attribution of rigidity or flexibility depends on which variable in the control hierarchy is treated as the fixed constraint.
  *   **Implication for Free Will:** The question "Are we machines?" is ill-posed. We are machines *under the description of physiology* and agents *under the description of intention*. Neither description is "more real." The "freedom" lies in the number of levels at which the system can shift the locus of invariance. The wasp is less free than you not because she is a machine, but because her hierarchy of control is shallower; she cannot easily shift the invariance from the *sequence* to the *goal*.

  You are correct to suspect that "mechanical" is a description relative to a chosen grain. In a universe of complex systems, there is no view from nowhere, and there is no behavior without a description.
