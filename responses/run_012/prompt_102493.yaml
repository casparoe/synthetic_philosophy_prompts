      *Refining the "Voluntariness" point:* In *Laws*, is it truly voluntary? It's compulsory civic duty. But it's compulsory *for citizens*. The helot is compelled *as a slave*. The distinction is status, not just consent. I need to be precise there.

      *Refining the "Overseer":* In *Laws*, the overseer protects the drinker from themselves. In Sparta, the overseer protects the *youth* from the example, using the drinker as sacrificial material.

