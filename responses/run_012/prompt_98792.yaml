      *Overview:* Sixteen students, seventy-five minutes. Four teams, trays, numbered cards, betting tokens. The goal is to demonstrate that the limit state of a supertask is underdetermined by its finite steps. Participants will see that identical stepwise operations yield contradictory final states depending on the removal policy, forcing a confrontation with the gap between process and completion.

      *Setup:* Prepare four shallow trays (vases). Create four decks of index cards, numbered sequentially (1–1000 suffices). Provide each team with a stack of betting tokens (paper chips work). Print prediction sheets with fields for: Chosen Removal Strategy (e.g., lowest, highest, random), Predicted Final Cardinality, and Specific Cards Remaining. Ensure a whiteboard is available for tracking round numbers. The facilitator needs a master sheet showing the mathematical outcomes for specific strategies to reference during the reveal without lecturing.

      *Run sheet:* 0–10: Introduction and grouping. Distribute materials. 10–20: Rule explanation and strategy commitment. Teams write predictions. 20–50: The Game. Five simulated rounds performed physically; teams extrapolate to infinity. 50–65: The Reveal. Compare outcomes based on strategies. Introduce the Lamp variant. 65–75: Debrief. Connect activity to supertask underdetermination and physical realizability. Transitions must be sharp; use a timer to prevent the physical counting from consuming the philosophical discussion.

      *Activity:* Each team starts with an empty vase. In each round, they add cards numbered consecutively from their deck (Round 1: 1–10, Round 2: 11–20, etc.). Immediately after adding, they must remove exactly one card according to their pre-committed strategy. They perform five rounds physically to cement the habit. Then, they must stop and answer the critical question: If this process continues infinitely, what remains?
      Scoring does not depend on the physical cards after round five. Instead, teams stake tokens on their prediction of the *limit state*. Options: Empty, Finite Non-Zero, or Infinite. High stakes are placed on the specific reasoning. For example, Team A commits to removing the lowest-numbered card available. Team B commits to removing the highest. Both add ten and remove one per round. Arithmetic suggests net growth of nine cards per round indefinitely. However, the wager is resolved by logical extrapolation, not physical counting. Teams must write down whether card #1 remains, whether card #100 remains, and the total count. This forces them to confront the conflict between cardinality (growing by nine) and membership (every card n is removed at step n). The facilitator collects sheets before revealing the mathematical consequences.

      *Reveal:* Gather the prediction sheets. Do not announce the answer. Ask Team A (lowest removal) to trace card #1. It was added round 1, removed round 1. Card #10? Added round 1, removed round 2. Every card n is removed at step n. The vase is empty. Ask Team B (highest removal). They remove 10, 20, 30... Cards 1–9 never touched. The vase is infinite. The divergence is now visible: identical local operations, contradictory global limits.
      Second beat: Replace the vase with a counter starting at 0. Each step increments the counter by 1. Ask for the value at the limit. It cannot be an integer; it must be infinity, but infinity is not a number in the sequence. This breaks the scoring model entirely, showing that some supertasks yield categories outside the system's ontology.

      *Debrief:* Connect the physical actions to the philosophical problems. The finite rounds represent the supertask's history; the prediction represents the limit state. The conflict arises between counting *how many* (cardinality) and asking *which ones* (membership). In the activity, Team A and B had the same cardinality growth rate but different membership outcomes. This maps directly to the vase puzzle: the description of the steps does not fix the description of the end.
      Transition to Thomson's Lamp. The lamp is toggled on/off. Like the cards, every state change is defined. But the final state (on/off) is not determined by the sequence of toggles. The activity showed that removal policies matter; the lamp shows that even with a fixed policy, the limit may be undefined. Finally, address idealization. The students handled cards in finite time. The supertask requires compressing infinite steps into finite time. The activity isolates the logical underdetermination, but the physical impossibility remains a separate barrier. The gap they felt between their strategy and the outcome is the gap between finite intuition and infinite completion.

      *Failures:* Students will insist on counting the physical cards after round five, missing the extrapolation point. They will argue that "you can't do infinite steps," dismissing the logical puzzle as physically impossible. Teams may copy the "lowest removal" strategy once they hear others discuss it. The facilitator will feel tempted to explain the solution early to save time. Resist this. Let them commit to wrong answers. If they argue about physical time, acknowledge it but return to the logical consistency of the description. If they fixate on the arithmetic (9n), ask them to locate specific card numbers in the final set. Do not resolve the tension; let the contradiction stand as the lesson.

