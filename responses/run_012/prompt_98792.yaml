  - Overview
  Sixteen students, seventy-five minutes, one room. Divide the class into four teams of four. Provide each team with a shallow tray, a deck of sequentially numbered index cards, and a stack of betting tokens. The session requires no prior reading and no internet access. The activity simulates a supertask through a finite game of addition and removal. Participants will commit to a removal strategy and wager on the final state of the vase after infinite rounds. They will come away seeing that the limit state of a process is not fixed by the finite steps that lead up to it, experiencing the underdetermination of the infinite directly in their own hands.

  - Setup
  Prepare four identical kits. Each kit contains one shallow tray (the vase), one deck of 200 index cards numbered 1 to 200, and thirty paper tokens. Print sixteen prediction sheets. Each sheet must have fields for Team Name, Removal Strategy (e.g., always lowest, always highest, random), Prediction of Final Count (Zero, Finite, Infinite), and a checklist for specific cards (Is card 1 present? Is card 100 present?). Ensure pens are available. The facilitator needs a master key showing that removing the lowest card yields an empty set, while removing the highest yields an infinite set. Arrange tables to face inward for discussion but allow team isolation during the betting phase. Keep a spare deck for the facilitator to demonstrate during the reveal. Ensure the numbering is bold and visible.

  - Run sheet
  0–10: Introduction. Divide into teams. Distribute kits. Explain the goal: to predict the end state of an infinite process. Emphasize that physical counting stops early.
  10–20: Strategy Phase. Teams discuss and write down their removal policy and final state prediction. They stake tokens on their confidence. Facilitator circulates to ensure rules are understood.
  20–35: Simulation. Teams perform five rounds physically (add 10, remove 1). This cements the rule without exhausting time. Facilitator calls time strictly.
  35–50: Extrapolation. Teams discuss what happens at infinity based on their five rounds. They may adjust stakes but not strategy. Facilitator warns against arithmetic intuition.
  50–65: The Reveal. Facilitator collects sheets. Walk through the logic of specific card numbers. Introduce the Lamp variant.
  65–75: Debrief. Connect the card logic to the philosophical problem of supertasks and physical realizability. Use a visible timer. Ensure transitions are announced verbally to maintain pace.

  - The activity: rules, rounds, and scoring
  The game proceeds in rounds. In every round, a team must take the next ten consecutive cards from their deck and place them in the vase. Immediately after adding these ten, they must remove exactly one card from the vase. The choice of which card to remove is determined by their pre-committed strategy. For example, a team might choose always to remove the lowest-numbered card currently in the vase. Another might choose the highest.
  Teams perform five rounds physically. This ensures they understand the mechanics: net growth is nine cards per round. However, the scoring does not depend on the physical cards after round five. Instead, teams must predict the state of the vase after *infinite* rounds. They stake tokens on whether the vase will be empty, contain a finite number of cards, or contain infinitely many. They must also specify which specific cards remain.
  To prevent endless counting, the facilitator announces that the game ends after five physical rounds, but the wager is on the mathematical limit. Teams cannot change their removal strategy after round one. This constraint forces them to confront the long-term consequences of their local choices. If a team chooses lowest-removal, they are betting on emptiness. If they choose highest-removal, they bet on infinity. The tension arises because the arithmetic (plus nine per round) suggests growth, while the membership logic (every card is eventually removed) suggests emptiness. The scoring rewards consistency between their strategy and the logical limit, not the physical count after round five. Teams win tokens if their prediction matches the mathematical truth of their chosen strategy. This creates a direct incentive to analyze the limit rather than the process. Most teams will initially bet on infinity because nine cards are added every round. This is the trap. The facilitator should note this consensus without confirming it. The activity relies on this intuitive error to make the reveal impactful. Teams must write down their reasoning briefly. This prevents them from guessing randomly. The tokens represent intellectual commitment. If a team realizes their strategy implies emptiness, they must move their tokens to Zero. This movement is the learning moment. The physical act of moving tokens from Infinite to Zero embodies the conceptual shift. The rules forbid discussing strategies between teams until after the wager is locked. This ensures independent convergence on the arithmetic trap.

  - The reveal
