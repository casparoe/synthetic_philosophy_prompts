  Transition to Thomson's Lamp. The lamp is toggled on/off. Like the cards, every state change is defined. But the final state (on/off) is not determined by the sequence of toggles. The activity showed that removal policies matter; the lamp shows that even with a fixed policy, the limit may be undefined. Finally, address idealization. The students handled cards in finite time. The supertask requires compressing infinite steps into finite time. The activity isolates the logical underdetermination, but the physical impossibility remains a separate barrier. The gap they felt between their strategy and the outcome is the gap between finite intuition and infinite completion. The activity makes the abstract concrete: the limit is not a continuation of the pattern, but a break from it. Students should leave understanding that infinity is not just "very large." Explicitly name the concept: underdetermination. The steps determine the process, but not the completion. This is the core philosophical takeaway. The lamp puzzle is structurally identical: the history is fixed, the state is not. The activity forces them to inhabit the ambiguity. It is not that we lack information; it is that the information given does not specify the limit. This mirrors the philosophical problem of defining completion conditions for infinite tasks. The physical cards were real; the infinite completion was not. This distinction is crucial for metaphysics.

  - What will go wrong the first time
  Students will insist on counting the physical cards after round five, missing the extrapolation point. They will argue that "you can't do infinite steps," dismissing the logical puzzle as physically impossible. Teams may copy the lowest removal strategy once they hear others discuss it. The facilitator will feel tempted to explain the solution early to save time. Resist this. Let them commit to wrong answers. If they argue about physical time, acknowledge it but return to the logical consistency of the description. If they fixate on the arithmetic (9n), ask them to locate specific card numbers in the final set. Do not resolve the tension; let the contradiction stand as the lesson. The goal is confusion, not closure. Facilitators must avoid validating the arithmetic intuition. When students say "nine cards per round means infinity," reply "trace card number one." This redirects them to membership. Some teams may try to change strategies mid-game. Enforce the rule strictly. This rigidity is necessary to show the consequence of the initial choice. If they hedge, the lesson is lost.

  - What the activity cannot reproduce
  The activity cannot simulate actual infinity. Students perform finite steps and imagine the rest. The emotional weight of the completed supertask is missing; it remains a thought experiment wrapped in cardboard. The physical cards obey classical physics; they do not vanish. The facilitator must supply the conceptual leap from very many rounds to all rounds, ensuring students understand the divergence occurs only at the limit, not during the game. The temporal compression of a true supertask is absent. The activity isolates the logical structure but cannot reproduce the metaphysical strangeness of completing an infinite task in finite time. It remains a model.
