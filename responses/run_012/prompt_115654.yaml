      *Re-evaluating:* Mill wanted to *encourage* cooperation, not necessarily mandate it by law immediately, though he was open to legal changes to facilitate it. Proposal 2 sounds like a mandate ("granting... a legal claim"). Proposal 1 is a tax. Mill supported the land tax as a right of the state.
      *Decision:* Mill's critique of the wage system is fundamental. He thinks wages are a temporary expedient. Proposal 1 accepts the wage/capitalist structure and just taxes the rent. Proposal 2 changes the structure. Mill would prefer the structural change (2) but would insist it be done in a way that preserves incentive and liberty. However, the "unearned increment" argument is very strong in his later work.
