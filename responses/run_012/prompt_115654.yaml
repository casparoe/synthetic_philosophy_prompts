      *   *Cons:* Who are the "workers" in ML? (Engineers vs. data subjects). Mill focused on *employees*, not necessarily *users* or *data subjects*. Extending ownership to users might be too diffuse for Mill's conception of a cooperative.
      *   *Mill's likely view:* This is closer to his *ideal* end state. He believed the wage relation was temporary. Replacing it with association is the path to human development.

  5.  **Address the Tensions:**
