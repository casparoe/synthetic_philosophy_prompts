      *   *Chapters on Socialism:* Written late in life. Critical of state socialism (bureaucracy, stagnation) but very supportive of voluntary cooperative socialism (workers owning the means of production). He sees the transition from wages to cooperation as the key to moral and economic improvement.
      *   *Autobiography:* Explicitly claims the label "socialist" (with qualifications). Emphasises the influence of Harriet Taylor. Highlights the goal of removing the distinction between rich and poor, not by robbing the rich, but by raising the poor.
      *   *Unearned Increment:* Mill was a strong proponent of taxing the unearned increment on land. He believed land value increases due to societal growth, not landlord effort, so society should capture that value.

  3.  **Evaluate Proposal 1: Taxing Unearned Increment (Universal Dividend)**
      *   *Pros:* Aligns with Mill's view on land. ML value comes from "shared inheritance of human writing" (societal growth) and scale (infrastructure). It avoids direct state management of production. It funds a dividend (raising the floor).
      *   *Cons:* Mill's land tax was specific to *land* (a monopoly gift of nature). Is data/compute analogous? It relies on taxation and state redistribution, which Mill worried could lead to bureaucracy or dampen incentive if too high. It doesn't change the *relation* of production, just the distribution of proceeds.
