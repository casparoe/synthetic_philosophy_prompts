      *   *Distorted Translations:* "Downward Causation" (Config management? Feedback loops?).
      *   *No Counterpart:* Normative force, qualia, genuine agency.
      *   *Blind Spots:* Software is designed; society evolves. Software has a spec; society doesn't (necessarily).

  8.  **Refining the "Fudges" (Critical Self-Correction):**
      *   *Fudge 1:* Agency. Services don't "want." They execute. Social individuals have internal states that aren't just variables.
      *   *Fudge 2:* Evolution. Code is versioned. Norms mutate without a deploy.
      *   *Fudge 3:* The "Interface" definition. In software, interfaces are explicit. In society, they are implicit (norms).

