  *(Self-Correction Note on the Animal)*: A pig is good, but let's make it a *Wolf*. Wolves are controversial. Protected vs. Hunted. "Fenris," a wolf Elara rehabbed. If the NI is high, hunting is banned globally. If low, culling resumes. This raises the stakes for the "Scaling" argument (how many wolves can we kill to save livestock?).
  *Actually, let's stick to the Pig.* It's more intimate. Eating a pig is daily life. Banning it upends the world. Hamlet the Pig is better for the "individual vs species" conflict.

