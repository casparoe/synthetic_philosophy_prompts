answer: |-
  The isotropic fractionator hummed, a low, dental-drill vibration that Elara felt in her molars. On the screen, the flow cytometer scattered laser light through the suspension, counting nuclei one by one as they drifted past the sensor. It was a beautiful, terrible rain of data.

  On the stainless-steel tray beside the machine lay the empty cranial cavity of Subject 89-B. Elara didn't look at the cavity. She looked at the beaker of pinkish slurry swirling in the fractionator. That slurry was the telencephalon of Hamlet.

  Hamlet had been a Large White pig, three years old, weighing two hundred and fifty pounds. He had also been Elara's shadow for eighteen months at the Sanctuary, following her through the mud, nudging her pockets for apples, learning to open latches with a snout that possessed the dexterity of a human hand. He was dead now, euthanized under Clause 14 of the Global Biomass Accord: *Specimen Sacrifice for Taxonomic Baseline.*

  To know what Hamlet was, they had to unmake him.

  "Stabilizing at 4.2 million nuclei per microliter," Dr. Aris Thorne said. He didn't look up from his tablet. Aris was a Senior Adjudicator for the Sentience Commission. He wore a suit that cost more than Elara's annual salary, and he treated the numbers on the screen like scripture. "Volume of the homogenate was 150 milliliters. Do the math, Elara."

  Elara tapped the console. The algorithm multiplied the density by the volume, then applied the neuronal ratio specific to suid tissue. "Total neuronal count in the forebrain: 3.14 billion."

  Aris nodded, a sharp, satisfied motion. "Above the Threshold of Class 4. That settles it. Pigs are Persons."

  "Wait," said Julian. He was leaning against the doorframe, arms crossed. Julian was an ethicist attached to the Agricultural Lobby, though he dressed like a grad student. He was the only person in the room who looked uncomfortable. "3.14 billion is the raw count. It's not the moral weight."

  "It is under the Accord," Aris said. "Neural Index is the legal standard. We moved past 'behavioral observation' five years ago. Behavior is subjective. Neurons are countable."

  "Neurons are just cells," Julian said, pushing off the frame and walking toward the beaker. "They're hardware. The Index assumes the hardware correlates perfectly with the software. With the capacity for suffering. But what if the correlation breaks? What if a pig's neurons are packed differently? What if 3 billion pig neurons feel half as much as 3 billion primate neurons?"

  Aris finally looked up. His eyes were cold, the color of washed-out denim. "The Commission calibrated the Index using human baselines. We know what 86 billion feels like. We extrapolate down. It's a proxy, yes. But it's the only objective proxy we have. If you start arguing about 'qualia' and 'density,' we're back to guessing. We're back to letting farmers decide which animals feel pain based on how much it costs to stop killing them."

  Elara kept her hands on the keyboard. She could still smell Hamlet. Not the chemical sting of the fixative, but the underlying scent of him—warm straw, wet earth, sweet corn. She remembered the day he learned his name. She had tapped his shoulder, said "Hamlet," and he had turned. Not a reflex. A recognition.

  "3.14 billion," Elara said softly. "That's higher than a chimpanzee."

  "Significantly," Aris said. "Which is why the meat lobby is sweating. If pigs hit Class 4, the slaughterhouses in the Midwest shut down overnight. The economic contraction would be... severe."

  "But lower than a human," Julian pressed. "And here's the problem. The Scaling Function. The Accord doesn't specify how moral value scales with the count. Is it linear? If a human has 86 billion and a pig has 3 billion, is a human worth twenty-eight pigs? Or is it logarithmic? If it's logarithmic, the gap closes. A pig might be worth half a human in terms of protection budget."

  Aris sighed, tapping his stylus against the tablet. "The Budget Committee is still debating the curve. But the Classification is binary. You are either Class 4 (Protected Person) or Class 3 (Sentient Livestock). The count determines the Class. The Curve determines the Quota."

  "So if the Curve is linear," Julian said, "we can still kill millions of pigs, as long as we balance it against human population growth. But if it's logarithmic, killing a pig becomes almost as weighty as killing a person."

  "You're conflating policy with science," Aris snapped. "My job is to provide the Number. The Number is the fact. What you do with the fact is politics."

  Elara watched the slurry swirl. *The Number is the fact.* That was the doctrine of the Commission. But Elara knew that Hamlet was not a fact. Hamlet was a variable.

  "Hamlet wasn't average," Elara said.

  The room went quiet. The hum of the fractionator seemed to grow louder.

  Aris turned slowly. "Excuse me?"

  "Hamlet," Elara said, her voice steady. "He was an outlier. At the Sanctuary, we ran cognitive batteries. Maze navigation, symbolic communication, emotional mirroring. He scored in the 99th percentile for his species. He was... exceptional."

  Julian looked at her, eyes widening. "You're saying this specimen might have a higher neuronal count than the species average?"

  "I'm saying we only count one," Elara said. "The Accord says one specimen sets the baseline for the taxon. If Hamlet is a genius, and we use his brain to set the standard for all pigs, we're inflating the value of the species. Or," she looked at Aris, "if we assume he's average, and he's actually high, we might be under-valuing the rest. But wait." She paused, the logic twisting in her gut. "If Hamlet is high, and we classify the species based on him, then the average pig gets the protection of a genius. If he's low, the geniuses get slaughtered with the rest."

  "The framework assumes a standard distribution," Aris said dismissively. "Variance is noise. We need a signal."

  "It's not noise if the variance is structural," Julian argued, seizing on Elara's point. "Domestication selects for tameness, which often correlates with brain size reduction. But sanctuary pigs are a mixed bag. If you use a sanctuary pig to set the quota for factory-farmed pigs, you're creating a legal fiction. You're granting personhood to animals that might not meet the cognitive threshold, or denying it to those that do."

  "We cannot test every pig," Aris said. "The cost would be prohibitive. You would have to kill the entire population to save it."

  "So we kill one to save the rest," Elara said. "And we hope the one represents the many."

  "We know the one represents the many," Aris corrected. "That is the axiom of biology."

  Elara looked at the beaker. Hamlet's mind was currently passing through a capillary tube, being counted by a laser. She thought about the within-species question. The architects of the Accord had left it vague because the answer was dangerous. If individual variation mattered, then the quota system collapsed. You couldn't have a "pig quota." You'd have to test every single animal before you could eat it. The industrial machine required categories. It required averages. It required Hamlet to be a statistic, not a friend.

  "3.14 billion," Julian mused. "The threshold for Class 4 is 3.0 billion. He's barely over."

  "Margin of error is point-zero-five," Aris said. "He's clear."

  "But what if the next pig is 2.9?" Julian asked. "Do we execute the next one to check? Or do we assume Hamlet was right?"

  "We assume Hamlet was right," Aris said. "Because we cannot afford to be wrong about the budget."

  Elara felt a cold knot tighten in her stomach. *The budget.* That was the scaling problem made flesh. The Commission had a "Moral Budget" for the planet. A certain amount of suffering was permissible per year, calculated in Neural-Weighted Hours. If pigs were Class 4, their Neural Weight was high. The budget would fill up fast. To stay within the global limit, the number of pigs allowed to exist—and be killed—would have to drop precipitously.

  If the scaling was linear, a pig was worth 1/28th of a human. If the scaling was logarithmic, a pig was worth 1/4th. The difference between those two fractions was billions of lives. It was the difference between a phased ban on pork and an immediate, violent prohibition.

  "Run the calibration again," Elara said.

  Aris frowned. "The machine is calibrated."

  "Run it again," she insisted. "Hamlet's tissue was... it was stressed. He had a heart condition. Cortisol can affect cell integrity. Maybe the count is skewed."

  "You want to fudge the data?" Aris asked, his voice dropping.

  "I want to be sure," Elara said. "If this number goes into the database, it locks the taxonomy for a decade. If Hamlet was an outlier, we're building a law on a lie."

  "The law is built on the best available data," Aris said. "Perfection is the enemy of the Accord."

  "Justice is the enemy of the Accord," Julian muttered.

  Aris ignored him. "Elara. Finalize the report. Submit the count. 3.14 billion. Class 4."

  Elara's finger hovered over the *Enter* key. She looked at the slurry. It was just pink water now. The complexity that had allowed Hamlet to recognize her, to feel fear, to anticipate joy, was reduced to a concentration of nuclei.

  She thought about the scaling problem again. If she submitted this number, and the Commission adopted a linear scale, pigs would be protected, but the quota would allow for millions to be culled as "population management." If they adopted a logarithmic scale, the protection would be near-absolute. But the Commission wouldn't decide the scale for months. In the meantime, the farmers would react. They would cull herds preemptively. They would kill pigs before the law could protect them, because a dead pig had no legal standing. Only a counted brain had rights.

  The system incentivized the very destruction it sought to regulate. To know the value of the mind, you had to destroy the mind. To save the species, you had to kill its representative.

  "Elara," Aris warned. "The upload timer is expiring."

  She looked at Julian. He was watching her, his expression unreadable. He knew what she was thinking. He knew that if she delayed, if she questioned the variance, the report would be flagged. An audit would follow. They would take another pig. Maybe one from a factory farm. A pig that had never seen the sun, never learned a name. That pig would likely have a lower count. Stress stunts neural growth. Malnutrition shrinks the forebrain.

  If they tested a factory pig, the count might drop to 2.5 billion. Class 3. Livestock. The sanctuary pigs, the smart ones, the ones like Hamlet, would be legally indistinguishable from the broken ones in the crates. They would all be meat.

  If she submitted Hamlet's number, the smart pigs might be saved, but the law would be a lie for the dull ones. If she flagged the variance, the law might become honest, but the smart ones would die in the process.

  There was no correct answer. The framework couldn't hold the weight of the reality. It was a net cast over an ocean, designed to catch whales but made of mesh that let the water slip through.

  "Elara," Aris said. His hand rested on the console, inches from hers. "Don't make this personal. The Index is impersonal. That is its virtue."

  "It's not impersonal," Elara said. "It's posthumous. It only speaks for the dead."

  "It speaks for the living," Aris corrected. "It tells the living how they are allowed to treat the future dead."

  Elara looked at the screen. *3.14159...* The numbers scrolled, settling.

  She thought about Hamlet's eyes. Dark, intelligent, framed by long lashes. He had looked at her when the vet came in with the syringe. He hadn't struggled. He had trusted her. She had held him while he went to sleep, whispering that he was a good boy, that he was safe.

  And then she had brought him here. To be dissolved.

  If she pressed *Enter*, she validated the sacrifice. She made his death mean something. A legal category. A quota.

  If she didn't, his death was just murder.

  "Scaling function," Julian said suddenly. "Aris, if the count is 3.14, and the threshold is 3.0, but the variance within the species is plus-or-minus 0.5... then statistically, a significant portion of the population falls below the threshold. Does the Class 4 designation apply to the species or the individual?"

  Aris stiffened. "It applies to the species. *Sus scrofa domesticus*."

  "So a pig with 2.5 billion neurons gets the same protection as Hamlet?"

  "Yes."

  "And a pig with 3.5 billion?"

  "Yes."

  "Then the Index doesn't protect the mind," Julian said. "It protects the taxonomy. It protects the label."

  "It protects the ecosystem of rights," Aris said, his patience fraying. "We cannot adjudicate individual souls, Julian. We manage biomass."

  Elara's finger trembled. The hum of the machine was the only sound in the room. The pink slurry continued to cycle, a endless loop of counting.

  She realized then that the true horror wasn't the killing. It was the averaging. It was the decision that Hamlet's unique, specific light could be used to illuminate a darkness he didn't belong to. He was being asked to carry the weight of every pig that had ever squealed in a slaughterhouse.

  And she was the one holding the scale.

  "Elara," Aris said. "Upload."

  She looked at the *Enter* key. It was a simple mechanical switch. A piece of plastic on a circuit board. It didn't know about neurons. It didn't know about suffering. It just closed a circuit.

  If she uploaded, the Commission would announce the Class 4 designation tomorrow. The markets would crash. Pigs would be culled by the thousands in the night. But the survivors would have rights. They would have lawyers. They would have a number that said they mattered.

  If she deleted the file, the audit would trigger. A new specimen would be selected. Another pig would die. And the number might be lower. And the rights would vanish.

  She had to choose between Hamlet's truth and the species' survival.

  "Elara," Aris said. "Now."

  She thought about the within-species question. The architects left it unanswered because they knew it would break the system. If individual variance mattered, the industrial model collapsed. You couldn't farm individuals. You could only farm averages.

  Hamlet was not an average.

  Elara moved her hand. She didn't press *Enter*. She didn't press *Delete*.

  She pulled the power cord from the back of the fractionator.

  The hum died. The laser cut out. The screen went black. The number 3.14 billion vanished into the dark.

  Aris stared at her. "What have you done?"

  "I broke the chain," Elara said. Her voice shook, but she didn't look away. "You can't count him now. The sample is degrading. Without power, the suspension settles. The count is lost."

  "You've invalidated the specimen," Aris hissed. "Do you know the cost? Do you know we have to find another? We have to kill another?"

  "Yes," Elara said. "You do."

  "That's monstrous," Julian whispered.

  "No," Elara said, turning to face them both. "The monster is the idea that one death can buy life for millions. The monster is the math that says you can sum up a soul. Hamlet isn't a baseline. He's a dead end."

  Aris was already reaching for his phone. "Security. We have a containment breach in Lab 4. Technician is compromised."

  "They'll just get another pig," Julian said, his voice hollow. "They'll get one from the line. A factory pig. And the number will be lower. And you'll have killed Hamlet for nothing."

  "Maybe," Elara said. She looked at the beaker. The pink liquid was still now. The nuclei were settling at the bottom, a silent sediment of mind. "Or maybe they'll have to explain why they keep killing them to find a number that fits the budget. Maybe the variance will leak out. Maybe people will ask why the numbers change depending on where the pig comes from."

  "You're betting on chaos," Aris said. "You're betting on confusion."

  "I'm betting on the truth," Elara said. "That we don't know. That we can't know without destroying what we're trying to measure."

  Security badges beeped at the door. The lock disengaged.

  Elara didn't move. She placed her hand on the glass of the beaker. It was cool.

  "3.14 billion," she said to the silence. "It was a beautiful number."

  "It was a liability," Aris said.

  The door opened. Two guards stepped in, hands on their holsters.

  Elara looked at Julian. "Write it down. Write down that the variance was too high. Write down that the sample was compromised by stress. Tell them the truth about the cost."

  Julian hesitated, then nodded slowly. He pulled a notebook from his pocket.

  Aris was shouting at the guards, pointing at Elara. "Detain her. Seize the data."

  "There is no data," Elara said.

  She looked at the beaker one last time. The slurry was opaque. You couldn't see the neurons anymore. They were just a cloud. A cloud that used to be a friend.

  As the guards took her arms, she didn't resist. She thought about the scaling problem. Linear, logarithmic, threshold. None of it mattered if the input was a lie.

  They led her out of the lab. The corridor was bright, sterile, white. She passed a window. Outside, beyond the security fence, she saw a field. Green grass. Mud.

  She wondered if there were pigs out there. She wondered if they were counting themselves, in their own way, in the dark, without lasers, without beakers.

  She wondered if the number would follow her.

  The door closed behind them, sealing the lab. Inside, the fractionator sat silent. The beaker sat on the tray. The number 3.14 billion existed nowhere but in Elara's head, and in Aris's tablet cache, and in the memory of a dead pig who had opened latches and known his name.

  The quota would be set eventually. Another pig would die. The number would be found. The law would be written.

  But for tonight, the number was lost. And the budget was overdrawn.

  Elara walked down the hall, her footsteps echoing on the tile. She didn't know if she had saved them. She didn't know if she had saved anything. She only knew that for a moment, the machine had stopped counting.

  And in that silence, Hamlet was whole.
