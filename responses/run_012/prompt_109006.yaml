  ### Brainstorming the Logical Space

  Before drawing the lines, we need to clear up the conceptual clutter. The "demandingness" debate often conflates three distinct logical layers:

  1.  **Extension:** *Which* acts are in the category? (Is it universal or role-relative? Is cost essential?)
  2.  **Normativity:** *What force* does the category have? (Can you be blamed for skipping it? Is there a mirror category for bad-but-permitted acts?)
  3.  **Metaphysics:** *What kind of thing* is the category? (Is it about acts, agents, or social codes?)

  Many "disagreements" in reading groups are actually people answering questions from different layers. For example, a Virtue Ethicist and a Deontologist might agree on the *Extension* (costly acts are optional) but disagree on the *Metaphysics* (act-property vs. agent-property). My tree forces you to settle the Extension and Normativity before you get to the Metaphysics.

  I have structured this as a "ladder" tree. You only proceed to the finer distinctions if you survive the coarser ones. This prevents the tree from exploding into 32 leaves while still capturing the ~9 distinct positions you requested.

  ***

  ### The Supererogation Decision Tree

  **Node 1:** Is there ever a case where an act produces the best moral outcome but is not morally required?
  *   **No:** → **Leaf 1: Strict Maximizing**
  *   **Yes:** → Go to Node 2.

  **Node 2:** Can that same act be required for one person (e.g., a lifeguard) but optional for another (e.g., a passer-by)?
  *   **Yes:** → **Leaf 2: Agent-Relative Duty**
  *   **No:** → Go to Node 3.

  **Node 3:** If you choose the lesser option, is moral criticism or blame ever appropriate?
  *   **Yes:** → **Leaf 3: Imperfect Duty**
  *   **No:** → Go to Node 4.

  **Node 4:** Are there acts that are permitted but still appropriate targets for criticism? (The Mirror Image)
  *   **Yes:** → **Leaf 4: Symmetric Criticism**
  *   **No:** → Go to Node 5.

  **Node 5:** Does an act cease to be supererogatory if it costs the agent nothing? (e.g., an easy rescue)
  *   **Yes:** → **Leaf 5: Sacrifice-Centric**
  *   **No:** → Go to Node 6.

  **Node 6:** Is "supererogatory" primarily a label for the *act* or the *agent*?
  *   **Agent:** → **Leaf 6: Virtue Supererogation**
  *   **Act:** → Go to Node 7.

  **Node 7:** Is this optionality a feature of morality itself or just specific moral codes?
  *   **Codes:** → **Leaf 7: Code Relativism**
  *   **Morality:** → **Leaf 8: Standard Supererogation**

  ***

  ### The Leaves: Positions and Awkward Commitments

  **Leaf 1: Strict Maximizing**
  *   **Awkward Commitment:** You are morally required to donate a kidney if it saves a life, regardless of the cost to you.
  *   **Routes:** Fails the Soldier/Grenade case (must jump); Fails the Income case (must give all).

  **Leaf 2: Agent-Relative Duty**
  *   **Awkward Commitment:** Morality demands different things of two people performing the exact same physical act, based solely on their identity or role.
  *   **Routes:** Handles the Kidney/Sibling case well (sibling must, stranger needn't); Handles Lifeguard cases.

  **Leaf 3: Imperfect Duty**
  *   **Awkward Commitment:** You are not required to do the act, but you are morally at fault if you don't (the "optional obligation").
  *   **Routes:** Handles the Income case (give some, not all, but blamed for giving none); Collapses supererogation into duty.

  **Leaf 4: Symmetric Criticism**
  *   **Awkward Commitment:** There is a category of acts you are allowed to do, but we are right to scold you for doing them (Suberogation).
  *   **Routes:** Handles the "Permitted but Rude" cases; Rarely defended in isolation without Leaf 3.

  **Leaf 5: Sacrifice-Centric**
  *   **Awkward Commitment:** A costless heroic act (e.g., saving a drowning child when you are already wet) is merely your duty, not supererogatory.
  *   **Routes:** Handles the Soldier/Grenade case perfectly; Struggles with the "Costless Hero" case.

  **Leaf 6: Virtue Supererogation**
  *   **Awkward Commitment:** Supererogation isn't about what you *do*, but who you *are*; two people can do the same act, but only one does it supererogatorily.
  *   **Routes:** Handles the "Motivation" cases; Merges with Leaf 7 in many practical applications.

  **Leaf 7: Code Relativism**
  *   **Awkward Commitment:** Morality itself is maximally demanding; "slack" is just a human concession in our social rulebooks, not a feature of the good.
  *   **Routes:** Handles the "Cultural Variation" cases; Makes morality itself alienating.

  **Leaf 8: Standard Supererogation**
  *   **Awkward Commitment:** There is a universal moral slack built into reality that permits you to leave value on the table for no reason other than preference.
  *   **Routes:** The default "common sense" view; Struggles to explain *why* the slack exists without begging the question.

  ***

  ### Merged Leaves and Uncharted Territory

  **Merged Leaves:**
  *   **Leaf 6 (Virtue) and Leaf 7 (Code Relativism):** My tree separates these logically, but in practice, few philosophers hold one without the other. If supererogation is about Agent Character (Leaf 6), it is almost always relative to a community's conception of virtue (Leaf 7). If you find yourself in Leaf 6, you will likely answer Node 7 in a way that lands you in Leaf 7. I have kept them separate to respect your request, but treat them as a "cluster" in discussion.
  *   **Leaf 4 (Symmetric Criticism) and Leaf 3 (Imperfect Duty):** These often travel together. If you think you can be blamed for omitting the good (Leaf 3), you usually think you can be blamed for committing the permissible-bad (Leaf 4). My tree forces a choice, but note that a "Yes" at Node 3 makes a "Yes" at Node 4 highly probable.

  **Incoherent/Unattractive Combinations:**
  *   **Leaf 4 without Leaf 3:** A position that says "You can't be blamed for skipping the heroics, but you *can* be blamed for doing the permissible sub-optimal" is logically possible but psychologically bizarre (Pessimistic Permissivism). I have never seen this defended; it likely indicates a confusion about the normativity of blame.
  *   **Leaf 5 with Leaf 8:** It is difficult to maintain that Sacrifice is essential (Leaf 5) while also claiming this is a universal feature of Morality (Leaf 8) without explaining why morality cares about sacrifice universally. Usually, Sacrifice-Centric views (Leaf 5) drift toward Agent-Relative views (Leaf 2) or Code Relativism (Leaf 7).

  ### How to Use This in Your Group

  When someone says, "Obviously you aren't obliged to donate a kidney," stop them and ask: **"Which Node are you settling?"**

  *   If they mean "It costs too much," they are at **Node 5**.
  *   If they mean "It's not my job," they are at **Node 2**.
  *   If they mean "It's good but not required," they are at **Node 1**.

  This prevents the "Kidney" example from doing all the work. The kidney case is primarily a **Node 2** (Relative Duty) or **Node 5** (Sacrifice) intuition pump. It cannot settle **Node 7** (Code Relativity) or **Node 6** (Act vs. Agent). By routing the discussion through the tree, you force the group to admit if they are disagreeing about the *existence* of slack (Node 1) or just the *location* of slack (Node 5).
