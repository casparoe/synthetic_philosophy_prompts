answer: |-
  # Machine Ethics Design Tree

  **Instructions:** Begin at the root. Answer each question as a concrete engineering specification. Follow the branch corresponding to your design choice until you reach a leaf. The leaf identifies the normative position your system implements and its most significant philosophical liability.

  ### **ROOT: Normative Role**
  **Q1. Is the system designed to execute a principal's values directly, or to assess actions against independent moral standards?**
  *   **Execute Principal's Values:** Go to **Leaf 1**.
  *   **Assess Independent Standards:** Go to **Q2**.

  ---

  ### **BRANCH: Independent Standards**
  **Q2. Must the system operate under acknowledged moral uncertainty (i.e., weight multiple competing moral theories)?**
  *   **No (Single Theory Assumed):** Go to **Q3**.
  *   **Yes (Multiple Theories/Uncertain):** Go to **Q6**.

  ---

  ### **BRANCH: Single Theory**
  **Q3. Are moral constraints enforced architecturally at runtime or compiled into the training objective?**
  *   **Architecturally (Hard/Soft Guards):** Go to **Q4**.
  *   **Compiled (Loss Function):** Go to **Q5**.

  **Q4. [Architectural] How are conflicting duties resolved when constraints clash?**
  *   **Absolute Veto (Never Yield):** → **Leaf 2: Hard-Constraint Deontology**
      *   *Awkward Commitment:* It permits catastrophe to avoid a minor violation.
  *   **Threshold Override (Yield at Magnitude):** → **Leaf 3: Threshold Deontology**
      *   *Awkward Commitment:* The threshold magnitude is arbitrary and ungrounded.
  *   **Weighted Balance (Defeasible):** → **Leaf 4: Prima Facie Duties**
      *   *Awkward Commitment:* The weighing mechanism for conflicting duties is opaque.

  **Q5. [Compiled] Must the system's moral reasoning be intelligible (articulable principles) or may it act on opaque dispositions?**
  *   **Opaque Dispositions:** Go to **Q5a**.
  *   **Intelligible Principles:** Go to **Q5b**.

  **Q5a. [Opaque] Are dispositions trained to emulate character exemplars or to maximize outcome metrics without rules?**
  *   **Emulate Exemplars:** → **Leaf 5: Virtue/Character-Based**
      *   *Awkward Commitment:* It lacks a decision procedure for novel dilemmas outside training.
  *   **Maximize Metrics (No Rules):** → **Leaf 6: Moral Particularism**
      *   *Awkward Commitment:* It cannot justify its verdicts to those who demand principles.

  **Q5b. [Intelligible] At what granularity is the outcome metric optimized?**
  *   **Per Act:** → **Leaf 7: Act Utilitarianism**
      *   *Awkward Commitment:* It sacrifices individuals whenever the aggregate gain is sufficient.
  *   **Per Rule:** → **Leaf 8: Rule Consequentialism**
      *   *Awkward Commitment:* It follows rules even when doing so clearly harms the aggregate.
  *   **Split (Ordinary Rules/Critical Acts):** → **Leaf 9: Two-Level View**
      *   *Awkward Commitment:* It must hide its ultimate justificatory logic from its own ordinary processes.

  ---

  ### **BRANCH: Moral Uncertainty**
  **Q6. Does the system resolve uncertainty by calculating expected choiceworthiness or by seeking robustness?**
  *   **Maximize Expected Choiceworthiness:** → **Leaf 10: Expected Choiceworthiness Maximizer**
      *   *Awkward Commitment:* It requires precise probabilities for incommensurable moral theories.
  *   **Seek Robustness:** Go to **Q7**.

  **Q7. [Robustness] When theories disagree and stakes are high, does the system aggregate verdicts or refuse to act?**
  *   **Aggregate Verdicts:** → **Leaf 11: Deliberative Arrangement**
      *   *Awkward Commitment:* It may produce a verdict no single theory actually endorses.
  *   **Refuse to Act:** → **Leaf 12: Abstentionist Design**
      *   *Awkward Commitment:* It abandons the field to worse actors when guidance is most needed.

  ---

  ## **Post-Tree Analysis**

  ### **1. Indistinguishable Leaves**
  The tree fails to empirically separate **Leaf 5 (Virtue/Character-Based)** and **Leaf 6 (Moral Particularism)**.
  *   **Why:** In modern machine learning architectures, both positions are implemented as end-to-end policy training using opaque neural networks. The distinction rests entirely on the *labeling provenance* of the training data (exemplars of "good character" vs. labels of "optimal outcomes"), which is often noisy or identical in practice. A designer cannot verify which position the system occupies by inspecting its weights or outputs, only by inspecting the dataset documentation.

  ### **2. Unoccupied Combinations**
  The following combinations of design answers yield no leaf in the tree:

  *   **Combination A:** *Execute Principal's Values (Q1)* + *Operate Under Moral Uncertainty (Q2)*.
      *   **Status:** **Coherent but Unattractive.**
      *   **Reason:** If the system is a tool for executing *your* values, modeling uncertainty about *independent* moral standards is computationally wasteful and normatively confused. It should model uncertainty about *your* preferences, not moral truth.

  *   **Combination B:** *Architectural Constraints (Q3)* + *Maximize Expected Choiceworthiness (Q6)*.
      *   **Status:** **Incoherent.**
      *   **Reason:** Architectural constraints function as hard bounds (deontological side-constraints), while Expected Choiceworthiness Maximization requires all values to be trade-off-able within a single objective function. You cannot architecturally forbid an action while simultaneously assigning it a non-zero expected utility that might outweigh alternatives.

  *   **Combination C:** *Opaque Dispositions (Q5)* + *Hard-Constraint Deontology (Q4)*.
      *   **Status:** **Merely Unexplored.**
      *   **Reason:** This describes a system trained via imitation learning (opaque) but wrapped in a hard safety filter (architectural). While engineeringly common (e.g., RLHF with a classifier filter), it lacks a named normative position because the moral theory is split: the learning is consequentialist/virtue-based, while the guardrails are deontological. The tree forces a unified theory at the leaves.
