answer: |-
  You are correct. Infinite ethics is largely analysis performed in natural language by people who are often terrified of the formal implications of the objects they are manipulating. The "paradoxes" usually arise from attempting to impose a total ordering on a space that naturally admits only a partial order, or from applying linear functionals to divergent series without specifying a regularization scheme.

  Here is the translation of the main positions, followed by the residue report and the analysis of your three specific questions.

  ### Part 1: Translations of Positions

  **1. Classical Total Utilitarianism**
  *   **Philosophical Claim:** The value of a population is the sum of the welfare of its members. An infinite future with positive welfare is infinitely good.
  *   **Analysis Translation:** Let the population be a measure space $(\Omega, \mathcal{F}, \mu)$ where $\mu$ is the counting measure. Let welfare be a measurable function $u: \Omega \to \mathbb{R}$. Value is $V = \int_\Omega u \, d\mu$.
  *   **The Problem:** If $\mu(\Omega) = \infty$ and $u \ge \epsilon > 0$, then $V = \infty$. All such worlds have the same value in $\overline{\mathbb{R}}$. Comparison is trivial and useless unless you restrict the domain to finite subsets (which contradicts the premise) or move to a non-Archimedean field (hyperreals) where infinities have distinct magnitudes.

  **2. Average Utilitarianism**
  *   **Philosophical Claim:** We should maximize the average welfare per person, not the total.
  *   **Analysis Translation:** We are looking for the limit of the Cesàro mean: $V = \lim_{n \to \infty} \frac{1}{n} \sum_{i=1}^n u(i)$.
  *   **The Problem:** This limit does not exist for all bounded sequences (e.g., oscillating welfare). To make this a well-defined functional on the space of bounded sequences $\ell^\infty$, you must invoke a **Banach Limit**. This requires the Hahn-Banach theorem (non-constructive, relies on Axiom of Choice). The value assigned to a world becomes dependent on the specific choice of the linear functional extending the limit, which is mathematically arbitrary.

  **3. Person-Affecting Views**
  *   **Philosophical Claim:** An outcome is only better if it is better *for someone*. Adding a happy person to a world doesn't make it better if no existing person is affected.
  *   **Analysis Translation:** Let $u, v$ be welfare functions on $\Omega$. $v \succ u$ only if $\mu(\{x \in \Omega : v(x) > u(x)\}) > 0$ and $\mu(\{x \in \Omega : v(x) < u(x)\}) = 0$. Essentially, $v \ge u$ a.e. and $v \neq u$ a.e.
  *   **The Problem:** This defines a **partial order**, not a total preorder. It cannot rank disjoint populations (where $\text{supp}(u) \cap \text{supp}(v) = \emptyset$). In infinite settings, "same people" is ill-defined without a rigid counterpart relation (a fixed bijection between worlds). If the bijection shifts, the "person-affecting" constraint dissolves into total utilitarianism.

  **4. Temporal/Generational Discounting**
  *   **Philosophical Claim:** Future welfare counts less than present welfare. This solves the infinity problem.
  *   **Analysis Translation:** Introduce a weight function $w: \mathbb{N} \to (0, 1]$ such that $\sum w(n) < \infty$. Value is $V = \sum_{n=1}^\infty u(n)w(n)$.
  *   **The Problem:** This maps the problem into $L^1(\mathbb{N}, w)$. The integral is now finite and well-behaved. However, the choice of $w$ is axiomatic. If $w(n) \sim 1/n$, the series may still diverge (harmonic series). If $w(n)$ decays exponentially, you lose sensitivity to the tail. This is not a solution to infinite ethics; it is a refusal to engage with the infinite measure by forcing the space to be finite measure.

  **5. Pascal's Mugging (Tiny Probabilities, Enormous Value)**
  *   **Philosophical Claim:** A tiny probability $\epsilon$ of an enormous payoff $M$ can outweigh a certain finite cost $C$, if $M$ is large enough.
  *   **Analysis Translation:** We are comparing terms in an expectation series $E = \sum p_i v_i$. The claim is that the series does not converge absolutely, or that the tail behavior dominates the head.
  *   **The Problem:** If the utility function $v$ is unbounded, the expected value integral $\int v \, dP$ is undefined (can be made to converge to any value by rearranging terms, per Riemann Rearrangement Theorem, if conditional). If $v$ is bounded, the mugger's claim fails. The "paradox" is simply the instability of conditionally convergent series or the definition of utility on an unbounded domain.

  ---

  ### Part 2: The Residue Report

  **What goes over cleanly:**
  *   **Pareto Principles:** These translate perfectly to pointwise ordering of functions ($f \ge g$).
  *   **Discounting:** This is standard weighted $L^1$ theory.
  *   **Risk/Expectation:** This is standard integration against a probability measure, provided utility is bounded.
  *   **Rearrangement Sensitivity:** The intuition that "order matters" in infinite ethics is exactly the distinction between absolute and conditional convergence.

  **What survives only via distortion:**
  *   **"Betterness" Relations:** Ethics demands a **total preorder** (for any $A, B$, either $A \succeq B$ or $B \succeq A$). Analysis tells you that on infinite-dimensional spaces with natural topologies, you often only get a **partial order**. Forcing totality requires ultrafilters or Banach limits, which introduce non-constructive arbitrariness. The distortion is insisting on comparability where the topology dictates incomparability.
  *   **Identity:** Philosophers talk about "the same people" existing in different worlds. In analysis, this requires a fixed underlying set $\Omega$ and measure-preserving maps. Ethical arguments often slide between changing the function $u$ (welfare change) and changing the domain $\Omega$ (population change) without adjusting the $\sigma$-algebra. This is a category error.

  **What has no counterpart:**
  *   **Normativity:** The move from "World A has higher integral than World B" to "You ought to choose A." This is the Is-Ought gap. Math gives you orderings; it does not give you vector fields directing action.
  *   **The Value of Existence:** In analysis, the zero function is the zero function. In ethics, "not existing" is often treated as neutral (0), but sometimes as a distinct state that cannot be compared to 0. There is no measure-theoretic equivalent for "undefined value due to non-existence" other than removing the point from the domain, which circles back to the domain-change problem.

  **Verdict on Framework vs. Claim:**
  *   **Framework Poverty:** Minimal. Real analysis, measure theory, and non-Archimedean fields are sufficient to model every structural claim made.
  *   **Claim Clarity:** Poor. Most ethical paradoxes are artifacts of failing to specify the function space, the measure, or the convergence criterion. When forced to specify, the "paradox" usually becomes a standard property of that space (e.g., "incompleteness of the ordering").

  ---

  ### Part 3: The Three Specific Questions

  #### 1. Cardinality vs. Additive Measure
  **The Translation:**
  When an ethicist says "Population A is better than Population B," they are implicitly proposing a functional $V: \mathcal{U} \to \mathbb{R}^*$ (where $\mathbb{R}^*$ is an ordered field extension).
  *   **Cardinality approach:** Compares $|\text{supp}(u)|$. This is useless for welfare ethics because it ignores the values of $u$. It treats all non-zero welfare as equivalent.
  *   **Additive Measure approach:** Compares $\int u \, d\mu$.

  **The Assumption:**
  The assumption being made is that the population constitutes a **measure space** $(\Omega, \mu)$ where $\mu$ is fixed across comparisons.
  *   If $\mu$ is counting measure, you are summing.
  *   If $\mu$ is a probability measure, you are averaging.

  **Principled or Arbitrary?**
  It is arbitrary *unless* you have a physical or metaphysical theory dictating the measure.
  *   **The Smuggle:** Ethicists often smuggle in a **density**. They treat $\mathbb{N}$ as having a "natural density" without specifying it. In analysis, there is no translation-invariant measure on $\mathbb{N}$ that gives the whole space finite measure (other than zero). To compare two infinite sums, you are effectively choosing a **regularization method** (e.g., Zeta regularization, Cesàro summation).
  *   **Conclusion:** The choice is not principled mathematically; it is an axiomatic ethical choice disguised as a mathematical observation. You are selecting a specific linear functional on $\ell^\infty$ or a specific extension of the sum operator. There are infinitely many such functionals.

  #### 2. Finite Loss vs. Infinite Future
  **The Translation:**
  Let $S = \sum_{n=1}^\infty x_n$. We are comparing $S$ to $S' = -C + \sum_{n=1}^\infty x_n$.
  *   **Case A (Absolute Convergence):** If $\sum |x_n| < \infty$, then $S$ is finite. $S' = S - C$. The loss matters.
  *   **Case B (Divergence to $+\infty$):** If $x_n \ge 0$ and $\sum x_n = \infty$, then in $\overline{\mathbb{R}}$, $S = S' = \infty$. The loss is swamped. This is not a theorem; it is the definition of arithmetic on the extended reals.
  *   **Case C (Conditional Convergence):** If $\sum x_n$ converges conditionally, Riemann Rearrangement applies. By reordering the "infinite future," you can make the sum $-\infty$, $+\infty$, or any real number.

  **Is it a Theorem?**
  It is a property of the **Extended Real Line**. If you work in $\mathbb{R}$, the series doesn't exist. If you work in $\overline{\mathbb{R}}$, $\infty - C = \infty$.
  *   **Dominated Convergence:** This is irrelevant. DCT is about swapping limits and integrals. The intuition here is about the **stability of divergence**.
  *   **The Catch:** The intuition that the loss is "swamped" only holds if you treat the infinite sum as a single object $\infty$. If you treat it as a limit of partial sums $S_N$, then $S_N - C$ is strictly less than $S_N$ for all $N$. The "swamping" only occurs at the limit.
  *   **Verdict:** It is nothing much at all mathematically. It is a decision to evaluate the world at the limit rather than along the sequence of partial sums. If you care about the path (the experience of the generations), the loss never vanishes. If you care only about the completed totality, it vanishes by definition of $\infty$.

  #### 3. Adding One More Life (The Mere Addition Paradox)
  **The Translation:**
  Let population $P$ be represented by a sequence $u \in \mathbb{R}^\mathbb{N}$.
  *   **Scenario:** Add a life with welfare $w > 0$.
  *   **Set Theory:** If $P$ is a set of indices, adding a life changes the domain from $\mathbb{N}$ to $\mathbb{N} \cup \{*\}$. Since $|\mathbb{N}| = |\mathbb{N} \cup \{*\}|$, there exists a bijection $\phi$.
  *   **Invariance:** If your value functional $V$ is invariant under bijections of the domain (anonymity), then $V(u) = V(u \circ \phi)$. Adding a life is just shifting indices. If the sum was $\infty$, it remains $\infty$.

  **Can it be said?**
  No, not if the population is just a set with an anonymous sum.
  *   **Required Structure:** To say adding a life makes things "worse" (or better) in a way that isn't trivial, you need to break **bijection invariance**.
      1.  **Ordering:** You need the population to be an **ordered set** (e.g., time). Adding a person at $t=100$ is different than adding them at $t=1$.
      2.  **Critical Level:** You need a functional like $V(u) = \sum (u_i - c)$. If $0 < w < c$, adding the life decreases the sum. But if the sum is already infinite, you are back to $\infty - \epsilon = \infty$.
      3.  **Non-Archimedean Value:** You need the value of the world to live in a field where $\infty + w \neq \infty$. E.g., Hyperreals $^*\mathbb{R}$. Here, $\omega + w > \omega$.

  **What do you lose?**
  *   **By adding Order:** You lose Anonymity. The identity of the generation matters.
  *   **By adding Critical Levels:** You lose the "Pareto on positive welfare" intuition (adding a happy life can be bad).
  *   **By adding Hyperreals:** You lose the Archimedean property. There are now "infinitely small" differences that never sum to a finite amount. This matches the intuition but complicates the decision theory (no standard expected utility theorem for hyperreals).

  **Verdict:** The feeling that adding a life ought to change the value *continuously* is a demand for the value functional to be **continuous with respect to the addition of points**. Standard measures are not continuous in this way on infinite domains (adding a point has measure zero). To capture the intuition, you must abandon standard measure theory for something like **non-additive measures (capacities)** or **hyperreal valuations**. The intuition is mathematically coherent, but it requires leaving the standard toolkit of Lebesgue integration.

  ### Summary
  Your framework is not too poor. The philosophical claims are often under-specified.
  *   **Cardinality vs. Measure:** It's a choice of functional. No fact of the matter without axioms.
  *   **Finite vs. Infinite:** It's a choice of evaluating at the limit vs. along the sequence.
  *   **Adding a Life:** It requires breaking anonymity or leaving the reals.

  The "paradoxes" are what happens when you try to force a total order on a space that is naturally partially ordered, or when you demand continuity properties that the topology does not support. The friction you feel is the sound of natural language trying to do topology without defining the open sets.
