  I've got a maths background — masters in analysis, and these days I mostly think in terms of measures, orderings and convergence; I'm comfortable with cardinality arguments, rearranging series, finitely vs countably additive measures, that kind of thing. Lately I've been reading around the infinite-ethics stuff — infinitely many people, an infinite future, tiny probabilities of enormous value, whether adding a happy person to an already infinite population makes things better — and honestly alot of it reads like analysis done in prose without anyone admitting it. So: take the main positions in that debate and restate each one in my vocabulary, as faithfully as you can. Don't tidy them up into something I'd obviously find correct; just do the translation, one position at a time. Then the part I actually care about — the residue report. What goes over cleanly, what only survives if you distort it, and what has no counterpart at all in an analyst's toolkit? And for everything that doesn't survive, tell me whether that's my framework being too poor for the job or the original claim being less clear than it looked.

  Three things I'd particularly like pinned down, because I suspect they're where it gets interesting:

  1. Comparing populations by cardinality vs comparing them by some additive measure of welfare. What exactly is being assumed when someone says one infinite population is better than another, and does the choice look principled or arbitrary once it's stated in measure-theoretic terms? I have a suspicion that a bare set is the wrong kind of object here and something richer is being smuggled in.

  2. The intuition that a finite loss now gets swamped by an infinite future. Is that a theorem about series, a failure of dominated convergence, or nothing much at all? Does it matter whether the relevant series converges absolutely, conditionally, or not at all?

  3. The feeling that adding one more life barely worth living to an infinite population ought to make things worse, or at least not better. Can that even be said if the population is just a set? What structure would you have to add to say it, and what do you lose by adding it?

  I'm not after a literature review, a reading list or citations — just the translation and the residue. Be blunt about where the philosophical disagreement looks like a verbal dispute that dissolves under translation, and where it doesn't.
