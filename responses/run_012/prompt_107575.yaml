prompt: |-
  A mid-sized AI lab is writing its refusal policy and can spare roughly three researchers for a year on the conceptual foundations, so it has to be selective about which questions to settle first. The lab distinguishes between paternalism that intervenes on a specific request a user makes now and paternalism that shapes the option set, defaults, and friction so that certain requests are never voiced; it is also unsure whether an assistant that the user relies on to deliberate — one that partly constitutes the user's own reasoning — can coherently be called paternalistic toward that user at all. Which open conceptual questions about when an assistant should refuse or override a user's request should the lab prioritize, and in what order? I care more about the reasoning than the list: for each, say why it is upstream of the others, how tractable it is for philosophers rather than engineers, and what argument or evidence over the next year would move it up or down the ranking. A question with no bearing on how a refusal policy would actually be written should be deprioritized, and you should explain why.
