answer: |-
  The practice of treating a prediction market price as *the* probability of an event presupposes the **Harsanyi Doctrine**, also known as the **Common Prior Assumption (CPA)**. This framework, formalized in economics and game theory by John Harsanyi and Robert Aumann, posits that rational agents begin with identical prior probability distributions over the states of the world. Under this theory, any divergence in belief between traders arises solely from differences in private information (signals), not from fundamental differences in how they process the world.

  ### 1. Reconstructing the Implicit Theory
  When a news report treats a 70% market price as an objective fact superior to individual judgment, it implicitly models the market as a **Bayesian aggregation machine**. The theory runs as follows:
  *   **Shared Reality:** All traders share a common understanding of the underlying structure of reality (the prior).
  *   **Informational Friction:** Traders differ only in the data they have observed.
  *   **Sufficient Statistic:** The market price acts as a sufficient statistic for all dispersed private information. Because everyone updates from the same baseline, the equilibrium price reflects what a single omniscient agent would believe if they possessed all the private signals held by the entire market.
  *   **Epistemic Authority:** Consequently, the price is not merely a compromise; it is the *correct* rational credence. An individual trader defying the price is not exercising legitimate dissent; they are effectively ignoring information held by others.

  This practice quietly rules out rival accounts of disagreement that posit **irreducibly different priors**. In philosophy and behavioral economics, this rival view holds that rational agents can share all the same information and still disagree because they weigh evidence differently, possess different heuristic frameworks, or start from different foundational assumptions about how the world works. If this rival view were true, the market price would not be a "pooled judgment" of the truth, but merely a **clearing point** between incompatible worldviews. The price would represent the margin where the liquidity of one worldview meets the liquidity of another, not an objective probability.

  ### 2. Internal Consistency and Speculative Trading
  The practice is **not internally consistent** when examined against the standard theoretical results of the very framework it presupposes.

  If we accept the Common Prior Assumption *and* assume that traders are rational and that this rationality is common knowledge, we encounter the **Milgrom-Stokey No-Trade Theorem**. This theorem demonstrates that if traders share a common prior, no speculative trade should occur. Why? Because any offer to trade reveals information. If I offer to sell you a contract at 70%, you infer that I possess negative information about the event. You update your belief downward. I, knowing you are rational, infer that your willingness to buy implies you have positive information. Through this iterative inference, our beliefs converge, and the motive for trade vanishes.

  Yet, prediction markets are full of speculative volume. Traders participate precisely because they believe their private assessment *beats* the market price. This behavior implies that traders act *as if* they have different priors (believing their model is superior to the market's aggregate model) or that they believe other traders are irrational (noise traders).

  Therefore, the practice relies on the Common Prior to justify the price as "truth," but the *existence* of the market's liquidity relies on the *violation* of the Common Prior (or the assumption of irrationality). The news report treats the price as the consensus of rational agents (requiring CPA), while the traders themselves act as if they are rational dissenters (requiring different priors).

  ### 3. Strict Requirements vs. What Merely Suits
  We must distinguish what the Common Prior Assumption strictly necessitates from what it merely facilitates.

  *   **What it Strictly Requires:** The Common Prior is strictly required for the **No-Trade Theorem**. Without common priors, speculative trade is perfectly rational even among agents who know each other to be rational; they can "agree to disagree." Thus, the CPA is the specific theoretical component that makes the observed speculative trading mysterious.
  *   **What Merely Suits:** The Common Prior **suits** the interpretation of price as a unique probability, but does not strictly necessitate it. One could argue that even with different priors, a market price represents a "consensus forecast" useful for decision-making. However, without the CPA, the price loses its normative force as *the* rational probability. It becomes a liquidity-weighted average of divergent rationalities rather than a Bayesian update of a shared truth.

  To answer your specific question: **The Common Prior is what makes speculative trading mysterious, but it is also what gives the price its epistemic authority.** Without the CPA, the price is still "readable" as a probability in the sense of a risk-neutral measure, but it cannot be read as *the* objective likelihood of the event superior to individual judgment. It would merely be the point where betting volumes balance, potentially biased by the risk tolerance or wealth of those holding specific priors.

  ### 4. Changing the Speech
  If we gave up the Common Prior Assumption, our language regarding market prices would have to shift from **epistemic** to **mechanistic**.

  *   **Current Speech:** "The market says there is a 70% chance of war." (Implies: This is the true likelihood derived from pooled wisdom.)
  *   **Revised Speech:** "The market clears at 70%." (Implies: This is the price where current buy and sell orders match.)
  *   **Current Speech:** "The probability is better than any individual estimate." (Implies: Information aggregation.)
  *   **Revised Speech:** "The price reflects the marginal belief of the last trader needed to clear the book." (Implies: Liquidity and wealth-weighted sentiment.)

  Abandoning the CPA would force news reports to acknowledge that the price reflects not just information, but **risk appetite** and **worldview diversity**. A 70% price might not mean the event is 70% likely to occur; it might mean that the people with money and the willingness to bet on "Yes" currently outnumber those betting on "No," regardless of who is actually "right" about the underlying reality. We would have to treat the market not as an oracle of truth, but as a mechanism for reconciling incompatible bets.
