answer: |-
  Here is the plan for the talk. It is structured to bypass philosophical defensiveness by anchoring the abstract problem in the concrete experience of writing and reading, introducing the technical distinction only after the intuition has been secured.

  ### I. The Order of Arrival

  You cannot begin with the distinction. If you begin with "reasons for attitudes," you have already lost them to the lecture they fear. The pieces must arrive in this order:

  1.  **The Phenomenon (The Hook):** Start with the *Sympathetic Villain*. Ask them to name one they love. Establish the consensus: we love him despite his crimes.
  2.  **The Inventory (The Data):** Ask *why* they love him. List the reasons on a board. (e.g., "He loves his dog," "He has style," "If we don't root for him, the book fails.")
  3.  **The Split (The Ambiguity):** Isolate the last reason ("If we don't root for him, the book fails"). Ask: *Does this make him admirable, or does it make reading him necessary?* This is the pivot. You must establish that "a reason to admire" is ambiguous before you give them the vocabulary to resolve it.
  4.  **The Case Study (The Test):** Introduce the nominated case (see below). Use it to sharpen the split identified in step 3.
  5.  **The Label (The Tool):** Only now introduce "Right Kind" vs. "Wrong Kind." It will land as a name for a distinction they have already felt, not a concept they must learn.
  6.  **The Application (The Craft):** Map the distinction back to their techniques. Charm is RKR (Right Kind); Narrative Necessity is WKR (Wrong Kind).

  **Dependency:** Step 4 depends on Step 3. If they do not feel the ambiguity of "reason to admire" in the context of their own craft, the Case Study will look like a logic puzzle irrelevant to fiction. Step 5 depends on Step 4; without the clean case study, the labels sound like moral judgment.

  ### II. The Single Case

  **Nomination:** The **Threat Case** (The Demon with a Gun).
  *Scenario:* A demon appears and says, "I will kill you unless you admire this mud pie." You have a overwhelming reason to bring about the admiration. Do you have a reason to *admire* the pie?

  **Why this over the Remorse Case:**
  The Threat Case is the better carrier for a forty-minute talk.
  *   **What it must have:** It must have an undeniably potent pragmatic reason (survival). The audience cannot deny that the threat gives you a reason to *do something*.
  *   **What it must lack:** It must lack any hint that the attitude is *possible* to choose. The mud pie is obviously not admirable. This isolates the *reasons* problem from the *psychology* problem.

  **Evaluation of your Remorse Case:**
  *Structure:* It is structurally identical (Pragmatic reason to have an attitude vs. Fittingness reason for the attitude).
  *The Problem:* The Remorse Case introduces the "Voluntarism" objection immediately. The audience will get stuck on: *"But she can't just decide to feel remorse. That's psychologically impossible."* This distracts from the normative question (*"Even if she could, would it be real remorse?"*) and turns the talk into a debate about emotional control.
  *Verdict:* Use the **Threat Case** to teach the distinction. It is cleaner. Use the **Remorse Case** later, in the Application section, as a literary example of a character trapped in a WKR scenario. The Threat case teaches the logic; the Remorse case illustrates the human cost.

  ### III. The Misconceptions

  You must head these off in the exact order they will arise. If you address the third one first, the first two will fester.

  1.  **"Wrong Kind" means "Immoral."**
      *   *When it arises:* Immediately upon hearing the title "Wrong Kind of Reasons."
      *   *Where to head it off:* **Before** you introduce the labels. When listing the reasons for loving the villain (Step 2 above), explicitly validate the pragmatic reasons. Say: "These are excellent reasons to *keep reading*. They are not moral failures."
      *   *Correction:* Emphasize that "Wrong Kind" is a technical term about *target*, not morality. A WKR can be a very good reason (like saving your life); it is just the wrong reason for *that specific attitude*.

  2.  **"Wrong Kind Reasons are not Reasons at all."**
      *   *When it arises:* When you claim the demon's threat isn't a reason to *admire*. They will say, "Of course it is! It's a life-or-death reason!"
      *   *Where to head it off:* **During** the Case Study analysis. You must concede the point.
      *   *Correction:* Agree with them. "It is a reason. It is a reason to *want* to admire, or a reason to *pretend* to admire. It is not a reason that counts in favor of the mud pie's admirability." You must grant the force of the reason to save the distinction.

  3.  **"You cannot choose your feelings."**
      *   *When it arises:* When discussing the Remorse Case or the Villain. "I can't just decide to love the villain because the plot needs me to."
      *   *Where to head it off:* **After** the distinction is secure, in the Application section.
      *   *Correction:* Acknowledge the truth but pivot. "You are right, we are not robots. But as writers, we manipulate conditions to make the feeling inevitable. The WKR problem asks: when we succeed, have we made the character better, or just made the reader more compliant?"

  ### IV. Admiration vs. Belief

  You asked whether the distinction survives the move from admiration to belief.

  *   **The Verdict:** Yes, it survives, but it is more controversial.
  *   **The Structure:** A reason to believe $X$ because believing $X$ makes you happy (Pragmatic) vs. a reason to believe $X$ because $X$ is true (Evidential).
  *   **The Difference:** In admiration, we accept that WKRs exist (we know we *should* admire the hero for pragmatic reasons sometimes). In belief, we are more purist; we tend to think a reason that isn't evidence isn't a reason for *belief* at all, but merely for *action*.
  *   **What this tells us:** If the distinction holds for belief, it proves the problem is not about *emotions* specifically, but about **Normative Domains**. It shows that every attitude (belief, admiration, fear, desire) has a "standard of correctness."
  *   **Instruction:** Mention this briefly. Tell them: "This isn't just about feelings. It's about truth. If you believe a lie because it comforts you, you have a reason to believe, but not a truth-reason." This elevates the talk from "character psychology" to "the ethics of representation."

  ### V. The Closing Question

  Do not ask them to define the terms. Ask them to apply the distinction to a borderline case.

  **The Question:**
  *"If a villain saves a child, but he does it only because he knows you, the reader, are watching and he needs your sympathy to survive the chapter: Do you have a reason to admire the act?"*

  *   **Why this works:**
      *   If they say "Yes," they have missed the distinction (they are conflating the outcome with the motive).
      *   If they say "No," they have the distinction (the reason is pragmatic/WKR, not fittingness/RKR).
      *   If they say "It's complicated," ask them *which kind* of reason is in play.
      *   This tests whether they see that **narrative manipulation** is a Wrong Kind of Reason, even if it produces the Right Kind of outcome.

  ### VI. The Deeper Stakes (What to Omit)

  **The Omission:** The **Buck-Passing Account of Value**.
  *   **The Concept:** In philosophy, this problem threatens the definition of "Good." If "Good" means "That which there is reason to value," and WKRs count as reasons to value, then the mud pie becomes "Good" because the demon threatened you. To save the definition of Value, philosophers must exclude WKRs.
  *   **Why omit it:** It is too abstract. It turns the talk into meta-ethics. Your audience cares about *characters*, not the definition of *Value*.
  *   **What you lose:** By refusing to explain this, you lose the ability to tell them *why* philosophers fight over this. It will look like a curiosity about emotions rather than a structural problem in how we analyze worth.
  *   **The Trade-off:** You sacrifice philosophical completeness for craft utility. You must accept that they will leave thinking this is a tool for *character construction*, not a problem for *axiology*. This is the correct trade for this audience. If you explain the Buck-Passing Account, you will confirm their suspicion that a lecture is being smuggled into their weekend. Keep the stakes literary: **Authenticity vs. Manipulation.**
