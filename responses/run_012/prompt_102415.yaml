answer: |-
  This is one of the oldest and stickiest problems in the history of philosophy, so first: forgive yourself and Dan for not solving it by 2am. You are grappling with *De Interpretatione* Chapter 9, and people have been grinding on this for 2,400 years.

  Your working theory—that this is a disguised semantic argument dressed up as metaphysics—is sharp. But it's only half the story. It is a semantic argument *because* the semantics are doing metaphysical heavy lifting.

  Here is the diagnosis of your fight, the map of the positions you stumbled into, and an honest assessment of whether progress is possible.

  ### 1. Diagnosis: What kind of disagreement is this?

  You asked if this is verbal (definitions of 'true') or substantive (metaphysics of time). The answer is **both**, layered like an onion.

  **Layer 1: The Semantic Surface (Verbal)**
  You and Dan are using different semantic frameworks for future-tense sentences.
  *   **You** are treating "It is true that $p$" as a timeless property. If a proposition corresponds to a fact, it corresponds *simpliciter*. If there is a fact of the matter about tomorrow, it exists now (in the realm of truth), even if the event hasn't happened.
  *   **Dan** is treating truth as **tense-dependent** or **settledness-dependent**. For Dan, "It is true that $p$" implies "It is *settled* that $p$." If the future is open, there is no fact of the matter yet, so the proposition lacks a truth value.

  If you stop here, it looks verbal. You could say, "Okay, Dan, let's call your view 'settledness' and keep 'truth' for timeless correspondence." But then you'd just ask, "Is it *settled* now?" and the fight resumes.

  **Layer 2: The Metaphysical Core (Substantive)**
  The semantic disagreement exists because you hold different models of time.
  *   **Your Intuition (Block Universe/Eternalism):** Past, present, and future all exist. Truths about the future are made true by future facts that exist in the block. If those facts exist, they are fixed.
  *   **Dan's Intuition (A-Theory/Branching Time):** The future does not exist yet. It is a realm of potentiality. To say a future contingent is "true" now is to claim that potentiality has already collapsed into actuality, which kills freedom.

  **The "Change the Future" Slogan**
  You called Dan's claim ("you can change the future but not the past") trivial or confused. Philosophically, it's neither; it's the flashpoint.
  *   **Why it sounds confused:** In a Block Universe, the future is just as fixed as the past. You can't "change" 2025 any more than you can "change" 1925.
  *   **What Dan means:** He is endorsing a **dynamic ontology**. The future is not a fixed territory waiting to be visited; it is a set of branching possibilities that get pruned by present action. "Changing the future" means "preventing a possible branch from becoming actual."

  **Verdict:** You are not just using 'true' differently. You are disagreeing about whether the future is *real* in the same way the past is real. The semantics are the proxy war for the metaphysics.

  ### 2. The Moves: Mapping the Positions

  You asked for the specific technical moves people have made to escape the dilemma. Here is the landscape you and Dan were wandering through.

  #### A. The Ockhamist (Your opponent, but softer)
  *   **The Move:** Accept Bivalence. "There will be a sea battle" is either true or false *now*.
  *   **The Escape:** Distinguish between **Necessity of the Consequence** and **Necessity of the Consequent**.
      *   *Necessity of the Consequence:* Necessarily (If it is true that $p$, then $p$). This is trivial logic.
      *   *Necessity of the Consequent:* If it is true that $p$, then necessarily $p$. **Ockham denies this.**
  *   **The Cost:** It feels like fatalism. If it is *true* now that I will drink coffee, in what sense could I do otherwise? Ockhamists say "You could do otherwise, but then the past truth would have been different." (This is called counterfactual power over the past).
  *   **Who holds this:** Most classical theists (to preserve divine foreknowledge) and many Eternalists.

  #### B. The Peircean (Dan's likely neighborhood)
  *   **The Move:** Reject Bivalence for future contingents. But go further: Analyze "will" as a modal operator meaning "inevitably will."
  *   **The Logic:** "There will be a sea battle" is actually false if there is *any* possible branch where there is no battle. "There will or will not be a battle" is true because it holds on all branches.
  *   **The Cost:** It makes most ordinary future predictions false. If I say "I will eat breakfast," and there is a branch where I starve, my statement is technically false. It requires rewriting how we speak.
  *   **Who holds this:** A.N. Prior (the father of tense logic).

  #### C. The Supervaluationist (The Logician's Compromise)
  *   **The Move:** Truth is **super-truth**. A statement is true if it is true on *all* possible future branches. False if false on *all*. Indeterminate if true on some, false on others.
  *   **The Logic:** "There will be a sea battle" is indeterminate. However, the Law of Excluded Middle ("Battle or No Battle") remains valid because on every branch, one or the other holds.
  *   **The Cost:** It breaks classical logic rules like *Disjunctive Syllogism* in certain contexts. It saves logic at the price of making truth a global property of a tree, not a local property of a moment.
  *   **Who holds this:** Bas van Fraassen, many contemporary metaphysicians.

  #### D. The Thin Red Line (TRL) (The "Have Your Cake" View)
  *   **The Move:** Admit branching time (the future is open), but posit that one branch is "actualized" or "selected" as the Thin Red Line.
  *   **The Logic:** Propositions are evaluated relative to the TRL. "There will be a battle" is true if the battle happens on the TRL.
  *   **The Cost:** It's metaphysically mysterious. What makes one branch the "Red" one if not determinism? If nothing makes it red, is it just a label? If something makes it red, isn't the future fixed after all?
  *   **Who holds this:** Some trying to reconcile Open Future with definite truth.

  ### 3. Are They Disagreeing or Talking Past Each Other?

  This is the crucial question.

  **In terms of Formal Semantics:** They are often **translatable**.
  An Ockhamist and a Supervaluationist can often map their models onto each other. The Ockhamist says "True at $t$ on history $h$." The Supervaluationist says "True at $t$ relative to the set of histories." If you specify the parameters enough, the formal systems often produce the same validity results for logical arguments. In this sense, much of the fight is **notational**.

  **In terms of Metaphysics:** They are **genuinely disagreeing**.
  The formalism hides the ontological commitment.
  *   If you are an Ockhamist, you likely believe the future is ontologically fixed (Eternalism).
  *   If you are a Peircean, you likely believe the future is ontologically open (Branching Actualism).

  When you argued with Dan, you were fighting the Metaphysical battle, but using Semantic weapons. You said, "If it's true, it's fixed." You meant: *Truth requires an existing truthmaker.* Dan said, "It's not true yet." He meant: *There is no truthmaker yet.*

  You are not talking past each other; you are disagreeing about the **truthmakers** for future propositions.

  ### 4. What Counts as Progress?

  You asked for honesty. Here it is: **There will be no knockout victory.** There is no empirical test that will prove the Block Universe wrong or the Open Future right. However, progress is possible in three specific ways.

  **1. Disambiguation (The "Dissolve")**
  Progress is realizing that "True" is doing too much work.
  *   If we define Truth as *Correspondence to Existing Facts*, Dan wins (no future facts).
  *   If we define Truth as *Logical Consistency within a Model*, you win (bivalence holds).
  *   **Progress:** Admitting that "Truth" is ambiguous between *semantic validity* and *ontological settledness*. Once you separate these, the "fatalism" worry often evaporates. You can have bivalence without causal determinism (Ockham's move).

  **2. Formal Precision (The "Technical Win")**
  We have made massive progress in the *logic* of time (Temporal Logic, Branching Time Semantics). We know exactly what costs each position incurs.
  *   We know Supervaluationism saves Excluded Middle but costs classical inference rules.
  *   We know Ockhamism saves classical logic but costs the intuition of "openness."
  *   **Progress:** Acknowledging the trade-off. The question isn't "Which is right?" but "Which cost are you willing to pay?"

  **3. Admitting the Ill-Posedness (The "Therapeutic Win")**
  Your suspicion that this is a "disguised argument about semantics" is the most mature philosophical take.
  *   The problem arises because natural language ("will", "true", "fixed") is not precise enough for modal metaphysics.
  *   **Progress:** Realizing that the "problem of future contingents" is a friction between **human language** (which assumes a flowing now) and **formal logic** (which is tenseless).
  *   If you accept that language is a tool for navigation, not a mirror of ontology, the tension loosens. Dan's "change the future" is pragmatically true (my actions matter) even if it is metaphysically dubious (the future doesn't exist to be changed).

  ### Summary Advice for the Next Round with Dan

  Don't try to prove him wrong. Instead, propose a **distinction**.

  Say this: *"Dan, I think we're conflating **Semantic Bivalence** (every sentence is T or F) with **Ontological Determinism** (events are causally necessitated). I'm worried that if I grant Bivalence, I get Determinism. You're worried that if you grant Determinism is false, you have to break Logic."*

  Then ask him: *"Are you saying there is no fact of the matter about tomorrow (Metaphysics), or just that we can't assign a truth value yet (Semantics)?"*

  If he says Metaphysics: You are arguing about the nature of Time (Block vs. Branching).
  If he says Semantics: You are arguing about the definition of Truth (Correspondence vs. Assertibility).

  The 2 AM fight wasn't a waste. It was you two bumping into the boundary where Logic meets Reality. That's exactly where philosophy is supposed to hurt.
