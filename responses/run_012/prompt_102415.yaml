      *   *The Dilemma:* If "There will be a sea battle tomorrow" is true *now*, does that necessitate the battle?
      *   *Key Positions:*
          1.  **Aristotelianism (Standard Reading):** Future contingents are neither true nor false. PB restricted. (Dan's view).
          2.  **Ockhamism:** Future contingents *are* true/false now, but their truth doesn't imply *necessity*. Truth is one thing, causal determination is another. (User's worry addressed by distinguishing types of necessity).
