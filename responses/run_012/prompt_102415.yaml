          4.  **Supervaluationism:** Truth is super-truth (true on all branches). "Battle or no battle" is true (valid on all), but "Battle" is indeterminate.
          5.  **Thin Red Line (TRL):** There is one actual future among the branches. It makes propositions true, but doesn't make them necessary.

  3.  **Diagnose the Disagreement (User vs. Dan):**
