prompt: |-
  Ok so last night my friend Dan and I got into it for like two hours about Aristotle's sea battle and now I can't stop thinking about it. Short version of the fight: I said that if it's already true today that there will be a sea battle tomorrow, then tomorrow is already fixed, so the captain can't really do otherwise, so bivalence quietly kills free will. Dan said no, the future is genuinely open, so claims about tomorrow's battle just arent true or false yet. Then he said 'you can change the future but not the past,' which I think is either trivial or confused, and we just went around in circles until 2am.

  What I want from you isn't a verdict on who's right, it's a diagnosis of what kind of disagreement this even is. Is it verbal — are we just using 'true' differently, him deflationarily, me like a card-carrying correspondence theorist? Or is there a real substantive question hiding under it, something like whether tense is a feature of the world rather than of our language, or whether 'will' is a tense or a modal? My working theory is that the whole thing is a disguised argument about the semantics of future-tense sentences that keeps getting dressed up as an argument about freedom, but I might just be fooling myself.

  So: spell out the actual moves people have made — the Ockhamist one where future contingents are true or false now but only contingently, the Peircean one where they have no truth value at all, the 'thin red line' one where the future is open but there's still one actual course it takes, the supervaluationist one where they come out neither true nor false while 'either there will be or there won't' still comes out true — and then tell me whether the people holding these are actually disagreeing with each other, or answering different questions under one heading. And be honest about what, if anything, would count as progress here: a distinction, a formal result, or just admitting the question was ill-posed from the start.
