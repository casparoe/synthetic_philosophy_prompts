answer: |-
  Here is a principle constructed to accommodate your seven verdicts, followed by an analysis of your unlisted case and the location of the irrationality. I have framed this using terminology that should feel familiar to a software engineer.

  ### The Principle of State-Invariant Exploitability

  **Statement:**
  An agent is irrational if and only if, in a given environment, they possess a **disposition** to execute a sequence of voluntary transactions which they foresee (or ought to foresee) will result in a **net loss of utility**, driven by preferences that remain **invariant across relevant state variables**.

  **Definitions for Mechanical Application:**
  1.  **Disposition:** The agent must be willing to perform the actions when offered. Latent preferences without the opportunity or will to act do not trigger irrationality.
  2.  **Net Loss of Utility:** The final state must be ranked lower by the agent than the starting state (e.g., holding the same job but with less money), or the agent must be worse off by their own long-term standards.
  3.  **Invariant Across Relevant State Variables:** The preferences driving the choices must not change due to valid changes in context. Valid state variables include:
      *   **Time:** (e.g., morning vs. evening).
      *   **Information:** (e.g., learning new facts).
      *   **Physical Context:** (e.g., hungry vs. full).
      *   If the preference changes *without* a change in these variables (i.e., a pure cycle), the invariance condition is met.

  ---

  ### Mapping Your Cases to the Principle

  Here is how the principle processes your seven cases, noting which clause forces each verdict.

  **1. The Cyclic Job Chooser (Sequential)**
  *   **Verdict:** Irrational.
  *   **Analysis:** She has a *disposition* to trade (Clause 1). The sequence results in a *net loss* (she pays fees to return to the start) (Clause 2). Her preferences are *invariant* (she prefers A to B regardless of when asked, provided the job descriptions haven't changed) (Clause 3).
  *   **Forcing Clause:** All three, but specifically the **Invariant** clause distinguishes this from Case 3.

  **2. The Cyclic Job Chooser (Simultaneous/No Trade)**
  *   **Verdict:** Not Irrational (yet).
  *   **Analysis:** She holds cyclic preferences, but the environment prevents the sequence. She cannot execute the trades. Therefore, she lacks the active *disposition* to execute the loss-making sequence in this environment.
  *   **Forcing Clause:** **Disposition**. This clause ensures irrationality is a property of the agent-in-environment, not just the agent's internal data.

  **3. The Juice-and-Coffee Man**
  *   **Verdict:** Not Irrational.
  *   **Analysis:** He may suffer a net loss if pumped, and he has a disposition to swap. However, his preferences are **not invariant**. They are indexed to *Time* (morning vs. evening), which is a relevant state variable.
  *   **Forcing Clause:** **Invariant Across Relevant State Variables**. This saves time-relative preferences from being flagged as bugs.

  **4. Pre-commitment (Good)**
  *   **Verdict:** Rational.
  *   **Analysis:** He pays £5 (cost), but the outcome is *not* a net loss; it is a net gain relative to his unbound future self.
  *   **Forcing Clause:** **Net Loss of Utility**.

  **5. Pre-commitment (Bad)**
  *   **Verdict:** Irrational.
  *   **Analysis:** He pays £5 to alter his choice, and the outcome leaves him *worse off*. This is a dominated strategy.
  *   **Forcing Clause:** **Net Loss of Utility**.

  **6. Incomplete Preferences**
  *   **Verdict:** Not Irrational.
  *   **Analysis:** He declines to rank options. Therefore, he has no *disposition* to swap A for B or B for A. The loop cannot start.
  *   **Forcing Clause:** **Disposition**.

  **7. Preference Revision (Learning)**
  *   **Verdict:** Not Irrational.
  *   **Analysis:** She changes her mind. However, this is driven by *Information*, which is a relevant state variable. Her preferences are not invariant; they have been updated by new data.
  *   **Forcing Clause:** **Invariant Across Relevant State Variables**.

  ---

  ### The Unlisted Case: The Pre-committed Cyclic Chooser

  **The Case:** A chooser with a genuine cycle (A>B>C>A) who has resolved in advance to refuse every swap and does refuse them.

  **The Verdict:** **Rational.**

  **Reasoning:**
  According to the **Disposition** clause, irrationality requires a willingness to execute the loss-making sequence. This agent has identified the cyclic dependency in her preference module and has implemented a "guard clause" (the resolution to refuse swaps).
  *   She holds the cyclic preferences (like Case 2).
  *   She does *not* execute the trades (unlike Case 1).
  *   Therefore, she does not satisfy the condition for irrationality.

  **Commentary:**
  You asked whether she is rational for guarding herself or irrational for having preferences she must guard against. Under this principle, **having the preferences is not irrational; acting on them is.**
  Think of it as legacy code. Having a function that *could* cause a stack overflow if called recursively is not a bug until you actually call it recursively without a base case. She has effectively wrapped the dangerous function in a `try-catch` block that prevents execution. She is managing her technical debt responsibly.

  ---

  ### Location of the Irrationality: Architecture vs. Data

  You asked whether the irrationality lies in the preferences, the trades, or their combination, and whether rationality is a momentary or temporal property.

  **1. Preferences (Data) vs. Trades (Logic)**
  The irrationality lies in the **combination**, specifically in the **coupling** of the preferences to the action-selection algorithm.
  *   In Case 3 (Juice/Coffee), the preferences change, so the coupling is safe.
  *   In Case 6 (Incomplete), the preferences are silent, so the coupling is safe.
  *   In Case 1 (Cyclic), the preferences are cyclic *and* the agent is disposed to act on them.

  If you must isolate it, the error is in the **decision rule** (the trade disposition), not the preferences themselves. A preference is simply a ranking; it is neither true nor false. A decision rule that acts on those rankings can be efficient or inefficient. The money pump demonstrates that a decision rule which respects cyclic preferences is *inefficient* (it leaks resources).

  **2. Momentary vs. Temporal**
  Rationality is a **temporal property** (a property of a trace), not a snapshot property.
  *   **Snapshot:** At time *t*, preferring A to B is not irrational.
  *   **Trace:** Over time *t1* to *t4*, accepting a sequence of trades that returns you to *t1* with less money is irrational.

  Your Case 2 confirms this: at a single moment, she is fine. It is only when the system is run over time that the error manifests. Your Case 3 confirms this further: a snapshot of her morning self contradicts a snapshot of her evening self, but the *trace* is consistent with her context-sensitive utility function.

  ### Limitations of This Principle

  While this principle fits your seven cases mechanically, be aware of two edge cases where it might conflict with broader philosophical orthodoxy:

  1.  **The "Sleeping Dog" Problem:** If a man has cyclic preferences but lives on a desert island where no trades are ever possible, this principle says he is **Rational** (no disposition to trade can be formed). Some philosophers argue he is still irrational because his internal state is inconsistent, regardless of the environment. Your verdict on Case 2 suggests you side with the pragmatic view (my principle), not the internalist view.
  2.  **Self-Deception:** In Case 5, if the man *believes* he is better off paying the £5, but is objectively worse off, the principle relies on "ought to foresee". Determining what an agent *ought* to foresee can be subjective. In engineering terms, this is the difference between a compile-time error (logical inconsistency) and a runtime error (unexpected loss). This principle detects runtime errors.

  ### Summary for Implementation

  To apply this mechanically:
  1.  **Log the Trace:** Record the sequence of choices and the agent's willingness to make them.
  2.  **Check the Delta:** Compare the final state to the initial state. Is there a net loss (e.g., money lost, same asset held)?
  3.  **Check the State:** Did the agent's relevant context (time, info, physiology) change between choices?
      *   If **Yes**: The preference change is valid. (Rational).
      *   If **No**: The preference is invariant.
  4.  **Verdict:** If **Net Loss** AND **Invariant Preferences** AND **Voluntary Disposition**, then **Irrational**. Otherwise, **Rational**.
