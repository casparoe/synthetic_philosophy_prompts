  2. **Unknown Distributions (0.30):** In open-ended searches (e.g., apartment hunting), "best available" is often undefined, breaking the optimization framework entirely.
  3. **Ought-Implies-Can (0.75):** If optimization is computationally impossible, it cannot be a normative standard, leaving satisficing as the primary norm rather than a fallback.
  4. **Computation as Constraint (0.65):** Usually, thinking costs are just another constraint, collapsing "soft satisficing" into constrained optimization.
  5. **Hard Satisficing Coherence (0.40):** Brute thresholds without optimizing backstories are normatively unstable; agents usually adjust thresholds based on outcomes.
  6. **Descriptive/Normative Slide (0.90):** Most disagreement stems from conflating whether agents *do* optimize (descriptive) vs. whether they *should* (normative).

