prompt: |-
  I've been arguing with a friend about satisficing for like three weeks now and I still can't tell whether we actually disagree or whether we're just using the word differently, so I want a number out of you instead of another vibe check. Here's the claim, which I've been calling the Collapse Thesis: every case that looks like genuine satisficing — an agent stops searching and takes an option it knows isn't the best one available, because the option is good enough, and the threshold it used was not itself arrived at by optimizing anything — is really just constrained optimization in disguise, so "satisficing" doesn't name a distinct normative category at all. My credence in the Collapse Thesis is about 0.45; my friends is about 0.75. Give me yours, but the number is the least interesting part. You don't need to cite anyone, I've read alot of the usual stuff and I'm not asking for a lit review — I want the derivation.

  So what I want is the decomposition. I assume it lives in sub-questions like: whether any stopping threshold can always be reconstructed after the fact as the argmax of some objective function over a richer space (and if so, whether that reconstruction is trivial — in which case the thesis is vacuous — or substantive); whether "the best available option" is even well-defined when the option space is open-ended, which is the case that actually bugs me, think apartment hunting where each viewing costs you a Saturday and you have no idea what the distribution of listings looks like; whether ought-implies-can does any real work here, i.e. whether a standard that requires optimization over an unbounded space simply fails to apply to bounded agents, leaving satisficing as the only live standard rather than a fallback; whether what's really going on is a claim about the cost of computation rather than about standards at all; and how much of the dispute is just the descriptive reading and the normative reading getting slid past each other. I've also been toying with a distinction I made up that you should either use or tell me is useless: soft satisficing, where the threshold is itself set by some objective function (so it's optimizing with extra steps), vs. hard satisficing, where the threshold is just a brute disposition with no optimizing behind it — and the question is whether hard satisficing is even coherent as a norm rather than a description. If you think one of my sub-questions is malformed, or that I'm missing the actual crux, say so and add yours.

  Give it to me in this order: (1) My number — one line, just the credence, no hedging. (2) The decomposition — five or six sub-questions, each with a rough probability and a sentence of justification. (3) How they combine — a short paragraph showing the arithmetic and flagging anywhere you might be double-counting. (4) Where my friend and I most likely actually disagree — two or three sentences. (5) What would move the number — three or four concrete arguments or findings, each with a direction and a rough size. Keep the whole thing under 900 words; I'd rather have tight than thorough.
