answer: |-
  1. **The Case**
  Consider a university department requiring staff to book the main seminar room. In Scenario A, booking is managed by a physical whiteboard in the hallway with a marker on a string; any staff member can erase an existing entry and write their own name, relying only on the social norm that you shouldn't cross out a colleague without asking. In Scenario B, booking is managed by a standard digital calendar system where recurring events are technically "owned" by the login credential of the creator; once a slot is booked as a recurring series, the system permissions prevent any other user from editing or deleting that entry, regardless of social norms. In both scenarios, a senior professor booked the prime Tuesday slot years ago and rarely uses it, while junior staff need it for teaching. The behavioral effect is identical: the room is unavailable to juniors. The difference lies in reversal: in A, a junior can physically erase the name immediately (the effect evaporates); in B, the junior cannot technically alter the entry—they must request the senior professor to log in and cancel it. The senior benefits from the status quo (status/option value) and holds the only credential capable of undoing it. The software was not designed to privilege seniors, but its architecture maps veto power automatically to the beneficiary of the existing arrangement.

  2. **The Verdicts**
  The **neutralist** argues that both artifacts are merely tools reflecting existing social power. They claim the politics lies in the department's hierarchy, not the kit; the whiteboard works only because juniors respect seniors, and the software works only because IT assigned ownership rules that mirror employment contracts. For them, A and B are functionally identical regarding politics; the software just makes the social rule more explicit. The **Winner-ish** position argues that B is inherently political while A is not. They contend that B delegitimizes resistance by making it technically impossible rather than socially taboo, thus embedding a specific authority structure into the material world that A leaves open. The **affordance/script** position sits in between: they argue A scripts the user as an 'editor' with agency, while B scripts the junior as a 'viewer' and the senior as an 'admin.' The divergence hangs on the premise of **constitutive power**: the neutralist sees the artifact as mediating pre-existing power, while the Winner-ish and script positions see the artifact as *constituting* the power relation by altering the cost and possibility of resistance. If the artifact changes the physical possibility of action (delete key vs. eraser), the politics is in the artifact.

  3. **The Working Feature**
  The feature doing the work is **technical enforcement of ownership**. It is not merely that reversal is harder in B, but that the *mechanism* of reversal is shifted from the social realm (negotiation) to the technical realm (authentication). If you make both A and B cheap to reverse (e.g., B allows anyone to override bookings), the power dynamic remains socially, but the artifact ceases to be the locus of the political claim; the case collapses back into ordinary institutional analysis. If you give the designer bad intentions (e.g., the software was built specifically to lock out juniors), the case becomes about *intent*, which weakens your claim that this is a structural feature of artifacts generally. Your argument relies on the *incidental* encoding of veto power: the software enforces ownership to prevent double-booking (a neutral goal), but that same enforcement mechanism entrenches the specific distribution of benefits. The politics emerges from the *rigidity* of the technical constraint, not the motive behind it.

  4. **The Neutralist Reply**
  The strongest neutralist reply is this: "You have not found politics in the artifact; you have found **property rights written in code**. The veto power isn't a fact of the software; it's a fact of the employment contract and IT policy that assigns ownership credentials. The software is merely obeying instructions. If you changed the policy, the software would behave differently. Therefore, the politics remains in the institution (who holds the keys), and you are mistaking the *execution* of power for the *source* of power."
  **Does it work?** Only partially. It fails because it ignores the **transaction cost asymmetry** introduced by the materiality. Changing a policy is slow, bureaucratic, and visible; changing a whiteboard entry is fast, invisible, and reversible. The artifact transforms a *negotiable* social norm (don't erase names) into a *non-negotiable* technical constraint (cannot click delete). By raising the cost of reversal from "social awkwardness" to "administrative procedure," the artifact actively stabilizes the benefit for the senior staff in a way the whiteboard does not. The politics is not just in the policy, but in the **material resistance** the artifact offers to policy change. The artifact makes the status quo sticky in a way that is independent of the actors' wills.

  5. **Commit**
  Your switch-cost idea is correct, but "switch costs" is too economic; it implies a rational calculation. The case shows something stronger: **Materialized Veto Power**. The verdict is that Artifact B is political in a way Artifact A is not, because B removes the *capacity* for resistance, not just the willingness. A allows for "quiet subversion" (erasing the name); B requires "formal revolution" (changing permissions). This validates your claim that the fault line is **reversibility**, but you must refine it: it is not just about the cost of undoing, but about **who the artifact recognizes as an agent of undoing**. In A, the artifact recognizes any physical presence as an agent; in B, it recognizes only credentialed identity. This is a fact about the artifact's configuration, not just the surrounding society, because the society could wish for change but be blocked by the code. You have not rediscovered path dependence; path dependence is historical inertia (we are here because we started there). Your claim is about **structural inertia** (we are here because the kit locks us here). Keep the claim, but frame it as the **politics of reversibility**: artifacts are political when they asymmetrically distribute the technical capacity to restore the status quo ante.
