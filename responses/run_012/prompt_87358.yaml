prompt: |-
  I'm a third-year PhD student in STS, mid-thesis, and I'm stuck on the second chapter. It's on the politics of everyday workplace tech, and I need you to build me one thought experiment — good enough to survive a hostile question in a viva.

  Here's what I'm actually trying to pin down. Everyone in this literature fights over whether an artifact can be political in itself or whether the politics always comes from the people and institutions around it — the Winner line versus the tools-are-neutral line. I think that framing is a dead end and the real fault line is somewhere else: switch costs, or better, who gets to undo. Some artifacts leave their effects revisable by anyone — you just do something else, no new kit, nobody's permission required. Others entrench an effect so that reversing it means replacing or reconfiguring the thing, or means getting the consent of the people the effect currently benefits. My half-formed claim is that the second kind is political in a way the first isnt, and that this is a fact about the artifact rather than about the surrounding society. But I genuinely can't tell if that's a real distinction or if I've just rediscribed path dependence with a nicer name.

  So: construct a case that tests it. Specs:

  - Two artifacts, A and B, both entirely realistic in a workplace (office, ward, school — no sci-fi, and no historical cases, so nothing with bridges or reapers or panopticons, I'm sick of those).
  - A and B have the same behavioural effect on the same population. Same people, same norms, same law, same budget, same managers. Everything held fixed except the two pieces of kit.
  - Neither was designed to exclude or entrench anything. No villains, no racist architects.
  - The difference has to be in how the effect gets undone: with A the effect evaporates the moment people change what they do, with B it survives until the artifact is replaced or reconfigured, and the people who'd have to agree to that are the ones currently benefiting from the effect. The artifact should encode that veto, not just happen to sit next to it.

  Then do the work, don't just hand me the scenario:

  1. One paragraph for the case, plain prose.
  2. Walk the verdicts: what the neutralist position says about A and about B, what the Winner-ish position says about each, and what an affordance/script type position says. Say exactly where they diverge and which premise the divergence hangs on.
  3. Tell me which feature of the case is doing the work, and whether removing it collapses the case back into an ordinary claim about institutions. If I make both A and B cheap to reverse, what's left? If I give the designer bad intentions, does the case get stronger or does it just become about the designer?
  4. The hardest part: give me the best neutralist reply — the argument that what I'm calling the artifact's politics is really a fact about budgets, property or who holds veto rights in the firm, and that I've smuggled the politics in through the back door. Then tell me whether that reply works.
  5. Commit. Pick the case you think is best and tell me which verdict you think is actually correct, and why. I don't want four options with a paragraph each and a shrug at the end — if you think my switch-cost idea is wrong, say so and say what the case shows instead.

  No citations or reading lists, I'll sort that out myself.
