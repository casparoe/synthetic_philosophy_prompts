  # JOINT STATEMENT ON MODEL ASSUMPTIONS AND PREDICTIVE VALIDITY

  **Date:** [Today's Date]
  **Parties:** [Your Name] (The Realist) & [Friend's Name] (The Instrumentalist)

  ### I. SUBSTANTIVE AGREEMENTS
  *We both affirm the following claims. These are not platitudes; they are the boundaries within which our disagreement operates.*

  1.  **Simplification is Mandatory:** No model can include all features of reality. Omission of detail is required for a model to be useful. Therefore, literally "true" assumptions are impossible for any non-trivial model.
  2.  **Prediction is the Floor:** A model that fails to predict observable data consistently is defective, regardless of how "realistic" its assumptions appear. Predictive failure is a necessary condition for rejection.
  3.  **Robustness Matters:** A model that works only for a single, specific dataset is overfitted. Both of us require that a model demonstrate stability across slightly varying conditions or time periods to be trusted.
  4.  **Assumptions Drive Implications:** We cannot ignore the logical consequences of assumptions. If an assumption mathematically necessitates a specific outcome, we cannot claim the model supports a different outcome without changing the math.
  5.  **Context Dependence:** A model's validity is domain-specific. A model that works in a controlled lab environment or a specific historical period is not automatically valid in a different environment or period.
  6.  **The "As If" Limit:** We agree that agents can behave *as if* they are optimizing even if they are not consciously calculating. We disagree on whether the *mechanism* generating that behavior matters for long-term prediction.

  ### II. REMAINING DISAGREEMENTS
  *We disagree on the following points. We have attempted to state each position in terms the holder would accept.*

  | Topic | The Realist Position (My View) | The Instrumentalist Position (My Buddy's View) | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **The Function of Assumptions** | Assumptions are claims about causal mechanisms. If the mechanism is false, the model is a black box that will fail when the environment shifts. | Assumptions are data-compression algorithms. They are tools to map inputs to outputs. The internal mechanism is irrelevant if the mapping holds. | **Substantive:** We disagree on whether models are maps of territory or calculators of outcomes. |
  | **Fragility of Falsehood** | Predictive success based on false assumptions is statistically fragile (luck). It implies the model is capturing a correlation, not a structure. | Predictive success based on false assumptions is efficient. It implies the model has captured the *relevant* variables without noise from the "real" details. | **Substantive:** We disagree on the probability of out-of-sample failure given known false assumptions. |
  | **Definition of "Realistic"** | An assumption is realistic if the entity or force it describes exists and operates in the way described (ontological correspondence). | An assumption is realistic if the system behaves statistically indistinguishable from how it would behave if the assumption were true (empirical adequacy). | **Verbal:** We are using "realistic" to mean two different things (Structure vs. Output). |
  | **Explanatory Value** | Understanding *why* a prediction holds is a separate value from the prediction itself. It allows for intervention and policy design. | Understanding *why* is only valuable insofar as it improves future prediction. If the "why" doesn't change the output, it is metaphysical padding. | **Substantive:** We disagree on whether "explanation" has independent utility apart from prediction. |

  ### III. CRUXES AND TEST CASES
  *These are the specific sub-questions where settlement would force one of us to change our broader position. We agree to treat these as the deciding factors.*

  #### Crux 1: Idealization vs. Structural Falsehood
  **The Question:** Is there a functional difference between an assumption that is a *limit case* of reality (frictionless plane) and an assumption that is *structurally impossible* (perfect rationality with infinite computation)?

  *   **Realist Claim:** Structurally impossible assumptions mask causal errors and will fail under stress. Limit-case assumptions approximate reality and degrade gracefully.
  *   **Instrumentalist Claim:** Both are false. The distinction is semantic. If the structurally impossible model predicts better than the limit-case model, it is the superior model.
  *   **The Test:** Compare two models of market crashes.
      *   *Model A (Idealization):* Assumes transaction costs are zero (a limit of low costs).
      *   *Model B (Structural Falsehood):* Assumes all agents have perfect foresight of price trajectories (impossible for humans).
      *   *Stress Condition:* Introduce a regulatory change that alters information flow speed.
  *   **Our Predictions:**
      *   **Realist:** Model B will fail catastrophically under the stress condition because the mechanism (foresight) is broken. Model A will degrade gracefully.
      *   **Instrumentalist:** If Model B predicted the crash better in-sample, it will likely retain predictive edge out-of-sample because it captures the *aggregate* effect of information, regardless of the individual mechanism.

  #### Crux 2: Possibility Proofs vs. Predictive Claims
  **The Question:** Does the standard for assumptions change if the model claims to show what *could* happen (existence proof) versus what *will* happen (prediction)?

  *   **Realist Claim:** Yes. A possibility proof only requires logical consistency. A predictive claim requires plausible mechanisms. Sliding from one to the other without changing assumptions is invalid.
  *   **Instrumentalist Claim:** No. A possibility proof is just a model with a weaker conclusion. The assumptions should always be judged by their contribution to the conclusion, not by their realism. If an unrealistic assumption is needed to show something *could* happen, that is still a valuable theoretical result.
  *   **The Test:** Take a model showing a stable equilibrium *could* exist under perfect rationality. Use it to argue that a specific policy *will* stabilize a market.
  *   **Our Predictions:**
      *   **Realist:** This policy intervention will fail or produce unintended consequences because the stability relied on an impossible assumption.
      *   **Instrumentalist:** The policy has a non-zero probability of working. The model identified a stable state; the policy moves the system toward it. The assumption realism is secondary to the stability logic.

  ### IV. PRE-COMMITMENT TO MIND-CHANGING EVIDENCE
  *We agree to the following conditions. If the described scenario occurs, we acknowledge we must update our position.*

  **Scenario:** We observe a model ($M_1$) with a known-false assumption (e.g., "Agents maximize expected utility perfectly") making accurate out-of-sample predictions over five years. We then construct a series of models ($M_2, M_3, M_4$) that progressively relax this assumption toward psychological reality (e.g., adding cognitive biases, computation limits), while keeping the core structure intact.

  **1. The Realist's Commitment:**
  > "If the de-idealized models ($M_2 \rightarrow M_4$) maintain or improve the predictive accuracy of $M_1$, I will accept that the original 'false' assumption was functioning as a valid **idealization** rather than a causal error. I will concede that predictive robustness is sufficient evidence of structural adequacy, even if the initial assumption was literally false."

  **2. The Instrumentalist's Commitment:**
  > "If the de-idealized models ($M_2 \rightarrow M_4$) show a sharp decline in predictive accuracy compared to $M_1$ as they become more 'realistic,' I will accept that the original success of $M_1$ was likely due to **overfitting or compensating errors** rather than efficient compression. I will concede that realistic assumptions are necessary for long-term robustness when the 'false' model fails the de-idealization test."

  **3. Joint Agreement on Failure:**
  > "If $M_1$ (false assumption) predicts well, but $M_4$ (realistic assumption) predicts poorly, we agree to investigate whether $M_1$ is capturing a higher-order regularity that $M_4$ obscures with noise. We will not declare $M_1$ 'true' but we will acknowledge it as 'instrumentally superior' until a better realistic model is found."

