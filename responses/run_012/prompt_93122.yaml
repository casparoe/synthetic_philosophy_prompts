answer: |-
  You are not being conned, but your friend has presented a very famous, very sophisticated philosophical objection that relies on a subtle category error. This argument is essentially a version of the "Reductionist Objection" to prioritarianism, often discussed in the shadow of Derek Parfit's work (who actually coined the term "Priority View" to distinguish it from Egalitarianism).

  You can keep your prioritarianism and its immunity to the leveling-down objection. To do so, you need to reject **Step (5)**.

  Here is the breakdown of where the argument fails, why it looks so convincing, and what you need to hold onto to keep your view intact.

  ### 1. The Bad Step: Step (5)
  **The Claim:** *"So the priority view treats equality as good in itself."*

  **The Error:** This step confuses **extensional equivalence** (two theories producing the same result in specific cases) with **intensional identity** (two theories valuing the same thing for the same reasons).

  Your friend's logic is effectively:
  1.  Prioritarianism recommends equality in fixed-sum cases.
  2.  Egalitarianism recommends equality in fixed-sum cases.
  3.  Therefore, Prioritarianism values equality *for the same reason* Egalitarianism does.

  This is false. Prioritarianism recommends equality in fixed-sum cases **instrumentally**, not intrinsically. It recommends equality only because, given a concave value function $f$, equality is the mathematical byproduct of maximizing weighted welfare. It does not posit "equality" as a separate value in the equation.

  ### 2. Why Step (5) Looks Innocent
  It looks innocent because in the specific scenario your friend constructed (Step 2: fixed total welfare), the two views are indistinguishable in practice.

  If you have 100 units of welfare to split between two people:
  *   **Egalitarian:** "Split 50/50 because gaps are bad."
  *   **Prioritarian:** "Split 50/50 because $f(50) + f(50)$ is greater than $f(90) + f(10)$."

  Since the output is identical, it is very tempting to assume the *moral machinery* is identical. Your friend is betting that you won't notice the machinery is different until you change the constraints.

  ### 3. The Proof: The Leveling-Down Test
  To see why Step (5) is wrong, you have to run the Leveling-Down Objection (LDO) explicitly. This is where the machinery reveals itself.

  Imagine two worlds:
  *   **World A (Inequality):** Rich person has 100 welfare; Poor person has 10 welfare.
  *   **World B (Equality):** Rich person has 10 welfare; Poor person has 10 welfare.
      *(We simply destroyed the Rich person's welfare; we did not transfer it.)*

  **The Egalitarian Calculation:**
  World B is better *in one respect* (equality) than World A, even though it is worse in total welfare. Many egalitarians admit this makes their view counterintuitive, but they accept it as the cost of valuing equality intrinsically.

  **The Prioritarian Calculation:**
  *   Value of A = $f(100) + f(10)$
  *   Value of B = $f(10) + f(10)$
  *   Since $f$ is strictly increasing, $f(100) > f(10)$.
  *   Therefore, Value of A > Value of B.

  For the prioritarian, World B is **not better in any respect**. There is no "equality variable" in your function to go up when the gap goes down. There is only the weighted sum of welfare. By leveling down, you have destroyed value without creating any compensating value.

  **Conclusion:** Prioritarianism is **not** open to the leveling-down objection. Your friend's Step (7) is false because Step (5) was false.

  ### 4. What You Have to Give Up
  To reject Step (5) and save your view, you must give up the idea that **equality is a fundamental moral currency.**

  You must accept that:
  1.  **Non-Relationalism:** The moral value of a benefit depends only on the absolute level of the person receiving it (and where they sit on the priority scale), *not* on how they compare to others. If you were the only person in the universe, prioritarianism would still make sense; telic egalitarianism would not (because you can't be unequal to yourself).
  2.  **Coincidence:** Your preference for equality in zero-sum scenarios is a happy coincidence of diminishing marginal moral value, not a fundamental commitment to fairness.

  If you are uncomfortable with this, it might be because you *do* feel that inequality is bad in itself, separate from the harm to the poor. If so, you might not be a pure prioritarian; you might be a **pluralist**.

  ### 5. Is There a Version Where You Owe the Egalitarian Something?
  Yes. Derek Parfit, who formulated the Priority View, acknowledged that one could be a **Pluralist**.

  You can hold that:
  1.  **Priority:** Benefits to the worse off matter more (non-relational).
  2.  **Equality:** Gaps between people are also intrinsically bad (relational).

  In this pluralist view, you *would* have to concede something to the leveling-down objection. You would have to admit that World B (Leveled Down) is better *in one respect* (equality) even if it is worse all-things-considered.

  **However,** if you want to keep the specific advantage you bought prioritarianism for (immunity to LDO), you must stick to **Pure Prioritarianism**.

  ### Summary for Your Friend
  You can tell your friend:
  > "You've conflated a mathematical implication with a moral commitment. Prioritarianism implies equality in fixed-sum cases, but it does not value equality intrinsically. Because it doesn't value equality intrinsically, it doesn't register 'leveling down' as a gain in any respect. Step (5) is the error: preferring equality as a *means* to maximizing weighted welfare is not the same as preferring equality as an *end*."

  **The Exit:** Stay a prioritarian. Reject Step (5). Keep your immunity to the leveling-down objection. Just acknowledge that your love of equality is a byproduct of your love for the worse-off, not a separate principle.
