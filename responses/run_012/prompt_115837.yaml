  ok, I want a dialogue out of you, two people going at each other, and I want them to actually dig into a specific case rather than trade slogans.

  Background I've been chewing on: the idea that science aims at getting closer to the truth even though our theories are false, and that we can meaningfully say theory X is closer to the truth than theory Y.

  Here's the toy case I want them to fight over. Sealed room, exactly three lights: red, green, blue. Nothing else in there. I've seen inside, so the truth is fixed and we both know it: red on, green off, blue on. Now two theories.

  T1: red is on, blue is off.
  T2: red is on, blue is off, green is off.

  Both are false, since blue is on. Everyone I've asked says T2 is obviously closer -- it gets two out of three things right and is wrong about the exact same thing T1 is wrong about.

  Now the thing thats bugging me. The standard line is: T2 is closer than T1 when T2 has more true consequences and no more false ones. But T2 is just T1 with a true claim bolted on, so every consequence of T1 is also a consequence of T2 -- T2's consequence set swallows T1's. That hands T2 strictly more true consequences (green is off is now a consequence, and thats true). But it also hands it strictly more false ones: T2 entails that blue is off and green is off, and that conjunction is false. So T2 flunks the no-more-false-consequences half of the test, and T1 flunks the more-true-consequences half. The test calls them incomparable -- even though T2 is T1 plus something true. So it looks like bolting a true claim onto a false theory can never make it closer. That cant be right, right?

  So, dialogue:

  Person A defends the counting line: closer to truth means more true consequences and no more false ones. He is not a moron and not a punching bag. Give him the real moves that are actually available to him: the room is a degenerate toy with a tiny vocabulary and no theoretical structure; only count consequences in some privileged or relevant vocabulary rather than all of them; junk consequences like the disjunction of blue being off with it raining in peru shouldn't count as content at all; maybe the definition needs surgery, not burial. If he gets cornered on the toy case, let him concede that much and fight on other ground -- thats what real people do.

  Person B says the whole counting game is doomed and that closeness has to be about how similar the picture of the world a theory paints is to the actual world -- a distance between worlds, or between the theory's world and the real one, weighted by which respects matter. She gets the intuition in the toy case right (T2 wins, obviously), but she has to eat the obvious objection: where does the distance come from, and if the weights depend on what we care about, havent we just made being closer to the truth relative to our interests instead of a fact about the theories? Let her push back.

