answer: |-
  Here is a specification list for a theory of radical interpretation (RI), distinguishing between the *process* constraints (what the interpreter can do) and the *content* constraints (what the theory must deliver). I have flagged the epistemic status of each point based on current literature consensus.

  ### Desiderata for a Theory of Radical Interpretation

  **1. The Admissible Evidence Constraint**
  *   **Requirement:** The theory must specify an input base that contains no semantic or propositional attitude concepts. The interpreter cannot assume prior knowledge of the speaker's meanings or beliefs.
  *   **Motivating Case:** *The Alien Mind.* If the interpreter assumes shared perceptual wiring (e.g., that red looks the same to both), they are smuggling in semantic/psychological assumptions. The evidence must be restricted to observable behavior and environmental events describable without semantic vocabulary.
  *   **Epistemic Status:** **Settled.** This is the definition of "radical." Disagreement exists only on *how* strictly physical the description must be (e.g., whether "holding true" is observable enough).

  **2. The Belief-Meaning Decoupling Constraint**
  *   **Requirement:** The theory must provide a principled method for distinguishing when a speaker holds a sentence true because they believe it, versus when they hold it true because they mean something else by it. It must allow for the possibility of false belief without collapsing into meaning variance.
  *   **Motivating Case:** *The Systematically Wrong Speaker.* A fluent speaker who believes almost everything false about their environment (e.g., a brain in a vat, or a radical skeptic). A theory that equates meaning with truth conditions derived from actual environmental causes cannot account for this speaker without declaring them unintelligible.
  *   **Epistemic Status:** **Contested.** Everyone agrees the distinction must exist; there is no consensus on how much error is permissible before interpretation breaks down (the limit of Charity).

  **3. The Illocutionary Coverage Constraint**
  *   **Requirement:** The theory must account for utterances that are not aimed at describing the world. It cannot treat all speech as assertoric truth-claims.
  *   **Motivating Case:** *The Liar/Joker* and *The Non-Truth-Apt Community.* If a speaker mostly jokes, lies, or speaks a language focused on imperative/expressive functions, a theory built solely on "conditions under which sentences are true" will fail to capture their competence.
  *   **Epistemic Status:** **Contested.** Davidsonians argue truth is central to all speech; pragmatists and expressivists argue this is a category error. There is no agreement on whether truth-conditions can be derived from non-assertoric evidence without prior semantic knowledge.

  **4. The Performance Error Tolerance Constraint**
  *   **Requirement:** The theory must distinguish between systematic competence and occasional performance slips without invoking prior semantic knowledge to identify the slip.
  *   **Motivating Case:** *The Slip of the Tongue.* When a speaker says "epitaph" but means "epithet" and is understood, the interpreter must recognize the error as noise, not a difference in meaning. If the theory treats every utterance as veridical data, it will assign the wrong meaning to the word type.
  *   **Epistemic Status:** **Mostly Settled.** Competence/performance is a standard distinction, but formalizing it within RI (without circularity) remains a technical hurdle.

  **5. The Normativity Constraint**
  *   **Requirement:** The output of the theory must yield correctness conditions, not just predictive regularities. It must explain why a usage *should* be rejected, not just that it *is* rare.
  *   **Motivating Case:** *All Cases.* Without normativity, you have a theory of behavior, not meaning. If the community uses "gavagai" for rabbits 90% of the time and tables 10% of the time, the theory must decide which is the meaning and which is the mistake.
  *   **Epistemic Status:** **Settled.** Meaning is normative. The contestation lies in the source of the norm (social practice vs. causal relation vs. rationality).

  ***

  ### Note on Davidson's Package

  Davidson's combination of Charity, Holism, and Indeterminacy meets the **Admissible Evidence** and **Normativity** constraints well; by tethering meaning to public causes and rational coherence, he secures a non-semantic base and normative force. However, his package makes the **Belief-Meaning Decoupling** and **Illocutionary Coverage** constraints difficult to satisfy. The Principle of Charity is often strong enough to rule out the *Systematically Wrong Speaker* (requiring substantial agreement on beliefs), and the focus on truth-conditions struggles with the *Non-Truth-Apt Community* without significant modification.

  **Tension Flag:** The **Admissible Evidence Constraint** and the **Belief-Meaning Decoupling Constraint** appear jointly unsatisfiable under strict Davidsonian conditions. If you are restricted to non-semantic evidence (behavior + environment), you cannot solve the equation of meaning and belief without assuming a high degree of belief truth (Charity). If you assume high belief truth, you cannot accommodate massive error. You must loosen the evidence constraint or tighten the error allowance; you cannot have both strict radicalism and massive skepticism.

  \answer{The separation of belief and meaning from non-semantic evidence}
