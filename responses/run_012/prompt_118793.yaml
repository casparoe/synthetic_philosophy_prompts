answer: |-
  # The Constraint & Contingency Protocol (CCP)

  **Purpose:** To separate the claim "we are locked in" into four distinct questions: Can we move? Does it hurt? What does it cost? Was it fate?
  **Timebox:** 45 Minutes (30 min discussion, 15 min verdict).
  **Pre-work:** Presenter must submit the **One-Page Constraint Template** 24 hours prior.

  ---

  ## Part 1: The One-Page Constraint Template
  *(To be filled by the presenter before the meeting)*

  **1. The Constraint:** What specific technology, model, or system are we discussing?
  **2. The Exit Path:** Describe the specific alternative state. (If left blank, assume "unknown.")
  **3. The Hard Limit:** Is there a technical reason migration is *impossible* (e.g., vendor bankruptcy, lost source code)? [Yes/No]
  **4. The Active Drag:** List three specific incidents in the last 90 days where this constraint caused outages, delayed features, or increased costs. (If fewer than three, explain why.)
  **5. The Price Tag:** Estimate the engineering effort to migrate. (Use ranges: <1 week, 1 week–1 month, 1–3 months, >3 months). *Do not invent precise numbers.*
  **6. The Historical Check:** At the time of the original decision, did at least two competitors or peers successfully use the proposed alternative? [Yes/No/Unknown]

  ---

  ## Part 2: The Procedure (Meeting Flow)

  The Board Chair runs this sequence. Do not skip steps. If a step triggers a **Stop Condition**, end the discussion and move to Verdict.

  ### Step 1: The Feasibility Gate (5 Minutes)
  **Question:** Is migration technically impossible, or just difficult?
  **Review:** Look at Template Section 3 (Hard Limit).
  **Sufficient Answer:** "Impossible" requires proof of missing dependencies or hard incompatibilities. "Difficult" is not a valid answer here.
  **Stop Condition:** If **Impossible**, proceed immediately to Verdict **TECHNICAL BLOCK**.
  **Gaming Warning:** Presenters may claim "impossible" to avoid the work of estimating cost. Challenge any claim that relies on "too much work" as "impossible."

  ### Step 2: The Drag Verification (10 Minutes)
  **Question:** Is the current state actively harming us *now*, or is it just old?
  **Review:** Look at Template Section 4 (Active Drag).
  **Sufficient Answer:** Specific tickets, incident reports, or delayed OKRs from the last 90 days. "It might hurt later" is not valid. "It is ugly" is not valid.
  **Stop Condition:** If **No Active Drag**, proceed immediately to Verdict **ACCEPTED RISK**.
  **Gaming Warning:** Presenters may inflate minor annoyances into "blockers." Board must distinguish between "slower build times" (annoyance) and "build failures blocking release" (drag).

  ### Step 3: The Price Check (10 Minutes)
  **Question:** What is the cost to leave?
  **Review:** Look at Template Section 5 (Price Tag).
  **Sufficient Answer:** A range based on comparable past migrations. If the presenter says "Unknown," the verdict defaults to **RESEARCH SPIKE**.
  **Threshold:** If the upper bound of the range exceeds **one engineer-quarter (3 months)**, the Board cannot approve funding directly.
  **Stop Condition:** If Cost > 1 Engineer-Quarter, proceed to Verdict **CTO REVIEW**.
  **Gaming Warning:** Presenters wanting the change will underestimate cost. Presenters wanting status quo will overestimate. The Board must ask: "What was the last similar migration, and did it come in on estimate?"

  ### Step 4: The Inevitability Test (5 Minutes)
  **Question:** Did market forces push us here, or did we drive?
  **Review:** Look at Template Section 6 (Historical Check).
  **Sufficient Answer:** Evidence that peers using different starting points converged on this solution (Inevitable), OR evidence that peers using the alternative are thriving (Contingent).
  **Note:** This step does *not* stop the process. It informs the Verdict label to determine if we are fixing a mistake or paying a tax.
  **Gaming Warning:** Hindsight bias. Just because a solution is popular *now* doesn't mean it was viable *then*. Stick to evidence from the time of the original decision.

  ---

  ## Part 3: The Verdicts

  Select one. The Chair signs it.

  | Verdict Name | Condition | Action Triggered |
  | :--- | :--- | :--- |
  | **TECHNICAL BLOCK** | Step 1 = Impossible. | **Stop.** Document the constraint as a permanent architectural boundary. No further proposals allowed without new technology. |
  | **ACCEPTED RISK** | Step 2 = No Active Drag. | **Stop.** The system stays. Complaints about "lock-in" are closed. Revisit only if Drag evidence appears. |
  | **RESEARCH SPIKE** | Step 3 = Unknown Cost. | **Allocate 1 week.** Engineer to produce a concrete migration plan and cost estimate. Return to ARB in 14 days. |
  | **MIGRATION AUTHORIZED** | Step 2 = Drag + Step 3 < 1 Quarter. | **Go.** Team proceeds with migration. Progress reported at next monthly ARB. |
  | **CTO REVIEW** | Step 2 = Drag + Step 3 > 1 Quarter. | **Escalate.** Board recommends migration, but funding requires CTO approval. Package includes Drag Evidence and Cost Estimate. |
  | **HISTORICAL NOTE** | Step 4 = Inevitable + No Drag. | **Close.** Acknowledge the lock-in is a market tax, not a local error. No action, but update onboarding docs to explain *why* we use this. |

  ---

  ## Part 4: Judgment Calls & Gaming Analysis

  This procedure looks mechanical, but three steps rely on human judgment. Here is how they will be gamed.

  **1. Defining "Active Drag" (Step 2)**
  *   **The Judgment:** Is this pain normal growth pains, or specific to this constraint?
  *   **How to Game It:** A presenter can attribute *any* slowdown to the legacy system. "The feature took 3 weeks because the data model is old."
  *   **Counter-Measure:** The Board must ask for the *counter-evidence*. "Show me a similar feature built on the new stack that took less time." If they can't, the drag is unproven.

  **2. Estimating "Unknown" Costs (Step 3)**
  *   **The Judgment:** When is an estimate "Unknown" vs. "Rough"?
  *   **How to Game It:** To kill a proposal, claim the risk is "unknown" to trigger a Research Spike that never ends. To force a proposal, give a confident low-ball number.
  *   **Counter-Measure:** If the presenter claims "Unknown," the Board assigns the Research Spike to a *different* senior engineer to prevent bias.

  **3. Assessing "Inevitability" (Step 4)**
  *   **The Judgment:** What counts as a "peer"?
  *   **How to Game It:** "Everyone uses AWS SQS, so it was inevitable." (Ignoring that 3 years ago, RabbitMQ was standard).
  *   **Counter-Measure:** Restrict evidence to the *year of original decision*. If the alternative didn't exist or wasn't stable then, the lock-in is Inevitable.

  ---

  ## Part 5: Case Study Runs

  Here is how the protocol executes on your three specific scenarios.

  ### Case A: Migrating Off In-House Build System
  *   **Context:** 200 engineers trained, massive plugin ecosystem.
  *   **Template Data:**
      *   *Exit Path:* Commercial SaaS Build System.
      *   *Hard Limit:* No.
      *   *Active Drag:* 1 incident in 90 days (plugin conflict). Build times are slow but stable.
      *   *Price Tag:* >3 months (rewriting 400+ plugins).
      *   *Historical Check:* Yes, peers used commercial tools 5 years ago.
  *   **Procedure Execution:**
      *   Step 1 (Feasibility): Pass. It is possible.
      *   Step 2 (Drag): **FAIL.** Only one minor incident. "Slow builds" is annoyance, not active drag under protocol definition.
      *   **Stop Condition Met.**
  *   **Verdict:** **ACCEPTED RISK**.
  *   **Action:** Proposal rejected. No migration.
  *   **Why You Won't Like It:** As a Staff Engineer, you likely see the long-term strategic risk of a custom build system. You know the "drag" will come later. But the protocol demands *current* evidence of harm. It prioritizes immediate stability over hypothetical future optionality. You are forced to defend the status quo.

  ### Case B: Cloud Provider's Proprietary Queue
  *   **Context:** Claim that we would have ended up here no matter what 4 years ago.
  *   **Template Data:**
      *   *Exit Path:* Open Source Kafka.
      *   *Hard Limit:* No.
      *   *Active Drag:* None. System is stable.
      *   *Price Tag:* 2 months (refactoring consumers).
      *   *Historical Check:* No. 4 years ago, managed Kafka was not stable; competitors using self-hosted Kafka had major outages.
  *   **Procedure Execution:**
      *   Step 1 (Feasibility): Pass.
      *   Step 2 (Drag): **FAIL.** No active harm.
      *   Step 4 (Inevitability): **PASS.** Evidence shows the market force (reliability > flexibility) pushed everyone to managed queues eventually.
      *   **Stop Condition Met.**
  *   **Verdict:** **HISTORICAL NOTE**.
  *   **Action:** Close ticket. Update onboarding to explain that this was a market convergence, not an engineering error.
  *   **Outcome:** Validates the original architects. Distinguishes "lock-in" from "smart betting on market maturity."

  ### Case C: Splitting Shared Data Model
  *   **Context:** One model serving two product lines, causing coupling and slowdowns.
  *   **Template Data:**
      *   *Exit Path:* Two bounded contexts, separate databases.
      *   *Hard Limit:* No.
      *   *Active Drag:* 3 incidents in 90 days (schema changes broke Product B; deployment locks prevented Product A release).
      *   *Price Tag:* 1–3 months (data migration + dual write).
      *   *Historical Check:* Yes, microservice patterns were standard at decision time.
  *   **Procedure Execution:**
      *   Step 1 (Feasibility): Pass.
      *   Step 2 (Drag): **PASS.** Clear evidence of blocked releases and outages.
      *   Step 3 (Price): **Borderline.** Upper bound is exactly 1 engineer-quarter.
      *   Step 4 (Inevitability): **FAIL.** This was a contingent choice to move fast, not market force.
  *   **Verdict:** **CTO REVIEW**.
  *   **Action:** Because the cost hits the funding threshold, the Board recommends the split but requires CTO sign-off on the headcount.
  *   **Outcome:** Acknowledges the debt is "real" (not inevitable) and "harmful" (drag), but admits it is too expensive for the team to absorb alone.

  ---

  ## Part 6: What This Procedure Cannot Do

  You asked for the limits of this tool. It will fail you in three specific areas.

  **1. It Cannot Value Optionality**
  The procedure requires *Active Drag* (Step 2). It cannot account for "This prevents us from doing a thing we haven't thought of yet." If your strategy relies on pivoting quickly in the future, this protocol will vote to keep you locked in today, because the future pain is not evidence under Step 2. It favors stability over agility by design.

  **2. It Cannot Resolve Value Conflicts**
  If the Board is split between "Move Fast" and "Stay Stable," this procedure will not solve it. One group will argue the Drag is severe; the other will argue the Cost is too high. The protocol exposes the disagreement, but it does not decide it. The Verdict becomes a proxy war for culture, not architecture.

  **3. It Creates False Confidence on "Inevitability"**
  Step 4 asks for evidence from the past. But history is messy. You can always find *some* competitor who did the opposite. A skilled presenter can cherry-pick market data to prove "Inevitability" or "Contingency" as needed. The verdict will look factual ("Historical Note"), but it is actually an interpretation of market history. Do not treat a "Historical Note" verdict as objective truth; treat it as "The Board agrees with this story for now."

  **Final Warning:**
  This procedure turns "We are locked in" from a conversation-stopper into a data-point. But it does not remove the burden of leadership. If the procedure says **ACCEPTED RISK** on the build system (Case A), but you believe the company will die in 3 years because of it, you must override the procedure. Use the verdict to clarify the cost of your override: *"I know the protocol says stay, but I am authorizing the migration because I value survival over efficiency."* That is a leadership decision, not an architectural one. The protocol ensures you make that trade-off explicitly.
