answer: |-
  Here is a specification of the requirements (desiderata) for an adequate theory of population value. This list is designed to be neutral, separating logical and empirical necessities from moral intuitions that different camps might dispute.

  ### Table of Desiderata

  | Requirement | Motivating Case / Consideration | Status | Excludes / Challenges Which View |
  | :--- | :--- | :--- | :--- |
  | **1. Logical Consistency**<br>The theory must not contradict itself. If it says World A is better than B, and B better than C, it cannot say C is better than A. | General Consideration (Logic) | **Non-Negotiable** | Excludes any theory that relies on circular reasoning or contradictory rules. |
  | **2. Empirical Coherence**<br>The theory must distinguish between population *size*, *density*, and *total life-years*. It cannot assume resources are infinite. | Case 4 (Resource Trade-off), Case 6 (Immigration), Case 10 (Avg vs. Total) | **Non-Negotiable** | Excludes theories that ignore physical limits or confuse moving people with creating people. |
  | **3. Definition of "Person"**<br>The theory must specify what counts as a moral unit. It must decide if simulated minds (Case 1) count the same as biological humans. | Case 1 (Happy Sims), Case 2 (False Belief) | **Camp Preference** | Excludes biological chauvinism (only humans count) or pure experientialism (only feelings count). |
  | **4. The Existing Person Priority**<br>The theory must distinguish between making an *existing* person worse off and failing to bring a *new* person into existence. | Case 5 (Life Extension), Case 8 (Happy New, Worse Existing) | **Widely Shared Intuition** | Excludes theories that treat potential people as having equal claim to resources as living people. |
  | **5. Non-Identity Sensitivity**<br>The theory must handle cases where a policy changes *who* is born, not just *how many*. It must explain if these people can be harmed by being born into a worse situation, even if their life is still worth living. | Case 7 (Identity Replacement) | **Non-Negotiable (Analytical)** | Excludes theories that say "no harm done" simply because the person wouldn't exist otherwise. |
  | **6. Mere Addition Principle**<br>Adding a person with a life worth living, without making anyone else worse off, should not make the world *worse*. | Case 1 (Happy Sims), Case 8 (Happy New, Worse Existing) | **Camp Preference** | Excludes "Negative Utilitarianism" (which focuses only on reducing suffering) or strict Average views. |
  | **7. Repugnance Constraint**<br>A world with a massive population of lives that are barely worth living should not be judged *better* than a world with a smaller population of very happy lives. | Case 3 (Barely Worth Living), Case 10 (Avg vs. Total) | **Widely Shared Intuition** | Excludes "Total Utilitarianism" (which sums up all happiness, leading to the "Repugnant Conclusion"). |
  | **8. Sadistic Avoidance**<br>It should not be considered "better" to add miserable people to a world just to avoid adding happy people, or to prevent a slightly worse outcome. | Case 9 (Miserable Preventing Worse) | **Widely Shared Intuition** | Excludes theories that prioritize avoiding the creation of people over the welfare of those who exist. |
  | **9. Quality Sensitivity**<br>The theory must account for the *quality* of happiness, not just the duration or intensity. False happiness may count for less than authentic happiness. | Case 2 (False Belief), Case 4 (Resource Trade-off) | **Camp Preference** | Excludes pure "Hedonism" (which says pleasure is all that matters, regardless of truth). |
  | **10. Uncertainty Handling**<br>The theory must provide guidance when we are unsure if future lives will be worth living. | General Consideration (Risk) | **Non-Negotiable (Practical)** | Excludes theories that only work in a world of perfect knowledge. |

  ### Analysis of Joint Unsatisfiability (The Impossibility Theorem)

  You suspected the fault line lies between "adding a happy person is not bad" and "a world of many barely happy lives is not better." You are correct, but the tension is slightly more specific. It is mathematically impossible to satisfy the following three requirements simultaneously:

  1.  **Mere Addition is Not Bad:** Adding people with lives worth living, without hurting others, does not make the world worse (Requirement #6).
  2.  **Quality Matters:** A smaller population of very happy people is better than a larger population of barely happy people (Requirement #7).
  3.  **Transitivity:** If World A is better than B, and B is better than C, then A is better than C (Requirement #1).

  **Why they conflict:**
  Imagine World A (10 very happy people).
  Imagine World A+ (The 10 very happy people + 10 new barely happy people). By **Mere Addition**, A+ is not worse than A.
  Imagine World B (20 barely happy people, slightly happier than the new ones in A+). By **Quality Matters**, B is better than A+ (because the average is higher or the distribution is more equal).
  If you repeat this step enough times, you eventually reach a world with billions of barely happy people. Logic dictates this final world must be better than World A. But **Quality Matters** says the final world is worse than World A.

  **Verdict:** You must drop or modify at least one of these three. Most theories drop **Mere Addition** (saying adding people *does* change the value significantly) or they drop **Quality Matters** (accepting the "Repugnant Conclusion").

  ### The Single Requirement That Excludes the Most Theories

  The single requirement that does the most work to exclude popular theories is **Requirement #7: The Repugnance Constraint.**

  *   **Why:** It is the hardest filter to pass.
  *   **Theories it excludes:** Any theory that simply adds up total happiness (Total Utilitarianism). If you believe the goal is to maximize the total sum of happiness in the universe, you *must* accept that a world of billions of people with lives barely worth living is better than a world of millions of people with ecstatic lives, provided the total sum is higher.
  *   **The Cost:** To satisfy this requirement, a theory becomes mathematically complex. It must introduce "critical levels" (a life must be *very* good to add value) or "discounting" (extra people count for less the more people there are). This often leads to violating **Requirement #6 (Mere Addition)** or **Requirement #8 (Sadistic Avoidance)**.

  ### Distinguishing Non-Negotiables from Camp Preferences

  It is vital to separate what a theory *must* do to function from what you might *want* it to say.

  **Non-Negotiable (Functional Requirements):**
  *   **Logical Consistency:** A theory that contradicts itself cannot guide policy.
  *   **Empirical Coherence:** A theory that ignores resource limits (Case 4) or confuses immigration with birth (Case 6) will fail in the real world.
  *   **Non-Identity Sensitivity:** A theory that cannot handle the fact that policies change *who* is born (Case 7) cannot judge long-term government policy.

  **Camp Preferences (Moral Intuitions):**
  *   **Mere Addition Principle:** Some believe adding a happy person is always a gain. Others believe it is neutral. This is a moral starting point, not a logical fact.
  *   **Repugnance Constraint:** Some philosophers argue we should accept the "Repugnant Conclusion" (that the massive barely-happy world *is* better) because our intuition is wrong. Others say the intuition is the anchor.
  *   **Definition of Person:** Whether simulated minds count (Case 1) or whether false happiness counts (Case 2) depends on your underlying view of what makes life valuable (truth vs. experience).

  ### Conclusion on the Deep Tension

  The deepest tension is not just between quantity and quality. It is between **Person-Affecting Views** and **Impersonal Views**.

  *   **Person-Affecting:** An act is only good or bad if it is good or bad *for someone*. (Fits Case 8 well: don't hurt existing people).
  *   **Impersonal:** An act is good if it creates a better state of affairs, even if no specific existing person is benefited. (Fits Case 1 well: creating happy sims is good).

  If you choose **Person-Affecting**, you struggle to explain why it is wrong to create a miserable child (Case 9) if that child's life is still worth living (because you didn't harm *them* compared to non-existence).
  If you choose **Impersonal**, you struggle to explain why we shouldn't sacrifice existing people to create more happy people (Case 8), or why the Repugnant Conclusion is false (Case 3).

  **Final Specification Result:**
  An adequate theory must explicitly state which of the three impossible triad members (Mere Addition, Quality Matters, Transitivity) it is willing to modify. A theory that claims to satisfy all three without explanation is inadequate. Furthermore, it must define whether "value" resides in the *experiences* of individuals or in the *state of the world* independent of specific individuals. Without resolving these two conflicts, the theory cannot judge the ten cases you provided consistently.
