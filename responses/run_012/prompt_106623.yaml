      Question: Machiavelli offers multiple metaphors for the relationship between fortune and virtù, specifically comparing fortune to a river and later to a woman. Evaluate whether these two images present a coherent strategy for political success. In your answer, you must also account for his claim in the Discourses that individuals cannot change their inherent nature. Does the inability to adapt one's character undermine the agency promised by the river metaphor or the woman metaphor?

      Model Answer:
      Most introductory readings of Machiavelli treat the relationship between fortune and virtù as a stable partnership where human skill manages external luck. However, a closer examination reveals a fundamental tension between his metaphors that complicates this stability. The river metaphor suggests that fortune operates like a seasonal flood. It is destructive but predictable. Here, virtù consists of foresight and engineering. A leader builds defenses during calm weather to withstand the inevitable storm. This implies a linear timeline where preparation guarantees safety. Conversely, the image of fortune as a woman suggests a relationship based on immediate dominance. He argues that fortune favors the impetuous and the young. This virtù is not about long-term planning but about audacity and seizing the moment. These two strategies are not easily reconciled. One requires caution and patience, while the other demands rashness and speed. If a leader follows the river advice, they might miss the opportunity to dominate fortune when she appears. If they follow the woman advice, they might neglect the dikes needed for the flood.

      This contradiction becomes critical when considering his assertion that humans cannot change their nature. He observes that success depends on matching one's mode of proceeding to the times. A cautious man succeeds when times are slow, and a bold man succeeds when times are fast. The tragedy is that individuals are fixed in their character. A cautious man cannot suddenly become bold when the times shift. This limitation severely undermines the agency promised by both metaphors. The river metaphor assumes you can choose to build dikes, but if your nature is impetuous, you will not build them. The woman metaphor assumes you can choose to be bold, but if your nature is cautious, you will hesitate. Therefore, fortune becomes more powerful than the initial half-and-half split suggests. Success is not merely about skill meeting luck, but about the accidental alignment of a fixed character with a specific historical moment.

