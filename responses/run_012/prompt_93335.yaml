answer: |-
  The full list cannot be met simultaneously; you must sacrifice requirement (b) regarding strict falsifiability via state-space refinement, because enforcing a canonical state space to make the assumption testable violates requirement (d) on frame invariance.

  ### Requirements Specification for a Theory of the Common Prior Assumption

  **1. Ontological Clarity (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly categorize the assumption as either a descriptive claim about the world, a normative constraint on rationality, or a methodological stipulation for modeling.
  *   **Consideration (a):** Standards of success differ by category. A descriptive claim requires empirical fit; a normative constraint requires logical derivability from axioms of rationality; a stipulation requires utility in simplification. Blurring these allows the theory to evade criticism by shifting definitions mid-argument.
  *   **Status:** Non-negotiable. Without this, the theory is unintelligible.

  **2. Falsifiability Condition (Taste/Empiricist)**
  *   **Requirement:** The theory must specify what empirical evidence would count against the assumption, independent of expanding the state space or type space.
  *   **Consideration (b):** If any disagreement can be reconciled by positing hidden private information or finer state partitions, the assumption is vacuous. A robust theory must define a limit to this "rescue" operation.
  *   **Status:** Taste. Essential for empirical science, but often discarded by pure theorists who view CPA as a definition of equilibrium rather than a testable hypothesis.

  **3. Awareness Robustness (Non-Negotiable)**
  *   **Requirement:** The theory must define what "common prior" means when agents are unaware of different events or conceive of different state spaces.
  *   **Consideration (c):** Standard CPA assumes a universal state space known to all. If agents lack awareness of the same possibilities, a single probability measure over a single space is undefined. A theory that cannot handle unawareness is limited to idealized, unrealistic contexts.
  *   **Status:** Non-negotiable for a general theory, though standard game theory often ignores this.

  **4. Frame Invariance (Non-Negotiable)**
  *   **Requirement:** The verdict on whether priors are common must not depend on arbitrary choices regarding the granularity or boundaries of the state space.
  *   **Consideration (d):** There is no canonical way to draw state spaces. If "priors are common" is true only under specific bookkeeping conventions, it is an artifact of the modeler, not a property of the agents or the world.
  *   **Status:** Non-negotiable. Violating this makes the theory sensitive to irrelevant modeling choices.

  **5. Justificatory Mechanism (Non-Negotiable)**
  *   **Requirement:** The theory must identify the specific mechanism forcing prior alignment: logical symmetry, shared learning history, or ignorance-based principles (e.g., Harsanyi's doctrine).
  *   **Consideration (e):** "Being part of the same group" is insufficient. The theory must explain why biological or social proximity translates to identical probability measures over abstract states. Without this, the assumption is an unsupported assertion.
  *   **Status:** Non-negotiable. Without a mechanism, the assumption lacks explanatory power.

  **6. Empirical Consequence Ownership (Taste/Predictive)**
  *   **Requirement:** The theory must account for observed speculative trade and persistent disagreement without relying on ad-hoc frictions that swallow the rule.
  *   **Consideration (f):** CPA + Common Knowledge of Beliefs => No Trade. Trade exists. The theory must either deny CPA, deny Common Knowledge, or explain why the no-trade theorem doesn't apply in practice without making the model unfalsifiable.
  *   **Status:** Taste. Predictive modelers require this; normative theorists may accept trade as "irrational" deviation from the model.

  ### Inconsistency Analysis

  The critical inconsistency lies between **Requirement 2 (Falsifiability)** and **Requirement 4 (Frame Invariance)**.

  *   **The Conflict:** To make CPA falsifiable (Req 2), you must fix the state space so that disagreements cannot be smoothed away by adding new states. However, fixing the state space violates Frame Invariance (Req 4), because there is no canonical state space; any fixed space is an arbitrary bookkeeping choice.
  *   **The Consequence:** If you honor Frame Invariance, you must allow state spaces to vary. If you allow state spaces to vary, agents can always be modeled as having a common prior over a sufficiently fine universal space (making CPA vacuous). Thus, you cannot have both a non-vacuous test and frame independence.
  *   **The Sacrifice:** Successful theoretical frameworks typically sacrifice **Requirement 2**. They treat CPA as a methodological stipulation (Req 1) that is not empirically falsifiable in isolation, preserving Frame Invariance by acknowledging that the state space is a modeler's tool, not a feature of the world.

  ### Scorecard of Main Positions

  *   **Standard Harsanyi-Nash Program:**
      *   *Ontology:* Methodological Stipulation.
      *   *Passes:* Ontological Clarity, Frame Invariance (by ignoring the issue).
      *   *Fails:* Awareness Robustness, Falsifiability.
      *   *Verdict:* Useful for solving games, useless for explaining belief formation.

  *   **Aumann/Interactive Epistemology:**
      *   *Ontology:* Normative Rationality Constraint.
      *   *Passes:* Ontological Clarity, Justificatory Mechanism (logic-based).
      *   *Fails:* Empirical Consequence Ownership (cannot explain trade without patches), Awareness Robustness.
      *   *Verdict:* Logically tight, empirically brittle.

  *   **Behavioral/Epistemic Game Theory (Heterogeneous Priors):**
      *   *Ontology:* Descriptive Claim.
      *   *Passes:* Empirical Consequence Ownership, Awareness Robustness.
      *   *Fails:* Justificatory Mechanism (why differ?), Ontological Clarity (often mixes norms and descriptions).
      *   *Verdict:* Fits data, loses the predictive power of agreement theorems.

  *   **Unawareness Literature:**
      *   *Ontology:* Structural Modification.
      *   *Passes:* Awareness Robustness.
      *   *Fails:* Frame Invariance (often requires specific lattice structures), Falsifiability.
      *   *Verdict:* Solves (c) at the cost of significant complexity and loss of standard results.
