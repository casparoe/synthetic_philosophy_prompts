answer: |-
  ### Rehearsal Prep Sheet: The Relay Case & Parfit's Hitchhiker

  **Strategy Overview:**
  Your goal in this rehearsal is not to prove you are right, but to show you have thought about why people *think* you are wrong. The Econ/Debate kids will try to "solve" the puzzle with real-world mechanics. The Psychology kids will ask why anyone would actually do it. The Advisor will ask if it counts as morality at all.

  **Concessions (Say "Yes" to these):**
  *   **Concede:** In the real world, contracts and reputation *do* solve this. You aren't arguing they don't work; you're arguing they aren't what the philosophical puzzle is about.
  *   **Concede:** If you are the *only* person with this disposition, you might get exploited. Your claim is about what happens when a group shares it.

  **Hold Firm (Say "No" to these):**
  *   **Hold:** You cannot dismiss the thought experiment just because "no one would actually drive without a contract." The case *stipulates* no contracts.
  *   **Hold:** The "wrongness" in the Relay Case isn't about harming the driver (who is safe) or the stranger (who doesn't know they were owed). It's about the system collapsing.

  ---

  ### The Objections (In likely order of occurrence)

  #### 1. The "Just Sign a Contract" Objection
  **Who:** Economics/Debate Student (likely the first hand up).
  **Damage Level:** 🟡 Medium (They are missing the point of the thought experiment).
  **The Objection:** "This whole puzzle disappears if you just allow for enforceable agreements. In the real world, I'd make the driver sign a contract, or I'd pay via an app before I get out of the car. If there's no way to enforce the promise, the rational move is always to defect. Why are we pretending contracts don't exist?"

  **Your 90-Second Reply:**
  "You're absolutely right that in the real world, contracts and apps solve this. But the philosophical case is designed to strip all that away on purpose. It's like asking 'what happens if we drop a feather and a hammer in a vacuum?' You can say 'but there's no air in my room,' but the point is to see how gravity works without the noise.
  My argument isn't that we should drive without contracts. It's that even when we strip away the contracts and the reputation stuff, we still feel like we *should* keep the promise in the Relay Case. If the only reason to keep a promise is fear of punishment or hope of reward, then 'promising' is just a fancy word for 'trading.' I want to know if there's a reason to keep the promise when the trading part is gone."

  **Honest Note on Softness:**
  This reply relies on them accepting the rules of the thought experiment. If they keep insisting "but rational people wouldn't play this game," you might get stuck in a loop. If they push hard, concede: "Okay, assume you're already in the car. The deal is done. Do you pay?"

  #### 2. The "Free Rider" Objection
  **Who:** Economics/Debate Student (the smart one who listened to your Relay Case details).
  **Damage Level:** 🔴 High (Attacks your specific solution).
  **The Objection:** "You said the Relay Case is a threshold problem—that it only works if enough people do it. But that creates a free rider problem. If I know enough other people are going to help the next stranger, my help doesn't matter. I can just enjoy the system without paying the cost. So isn't it still irrational for *me* specifically to help, even if it's good for the group?"

  **Your 90-Second Reply:**
  "That is exactly the tension I'm trying to highlight. In the standard Hitchhiker case, the focus is on *you* binding *yourself*. In my Relay Case, I'm saying the focus should be on the *chain*.
  If you free-ride, you're right: you personally gain nothing by helping. But if everyone thinks that way, the chain breaks, and eventually, someone leaves you in the desert. My point isn't that it's magically rational for you to lose out. It's that the puzzle isn't about your individual rationality anymore. It's about whether we can agree that keeping the chain going is valuable enough that we shouldn't free-ride, even when we could get away with it. I'm shifting the question from 'What's best for me?' to 'What keeps the relay alive?'"

  **Honest Note on Softness:**
  This is your weakest spot. You haven't actually solved *why* an individual should contribute if the threshold is already met. You are describing the problem, not solving it. If they press "But why should *I* care?", admit: "I'm not saying I have the answer to why you should care. I'm saying the old answer (binding yourself) doesn't work here, so we need a new question."

  #### 3. The "Description vs. Prescription" Objection
  **Who:** Psychology Student.
  **Damage Level:** 🟠 Medium-High (Attacks your normative claim).
  **The Objection:** "It sounds like you're just describing how society works. Like, 'people feel bad if they break chains.' But philosophy is about what we *ought* to do, not what we *do*. Are you saying we should keep the promise because it feels right, or because it's actually the right thing to do? You're mixing up feelings with rules."

  **Your 90-Second Reply:**
  "That's a really important distinction. I'm not saying we should keep the promise just because it feels good or because we're wired to. I'm saying the *reason* it's the right thing to do changes depending on the case.
  In the normal Hitchhiker case, people say you keep the promise to prove you're trustworthy. In the Relay Case, you can't prove anything to the driver. So if there is still a duty to help, it can't be about your reputation. It has to be about the stranger. I'm arguing that if we feel a duty in the Relay Case, it proves that promising isn't just about self-interest or reputation. It shows the duty exists even when the psychological reward is gone."

  **Honest Note on Softness:**
  You are walking a line between "it's useful" and "it's moral." If they ask "But is it *obligatory*?", be careful not to say "only if you want the system to work." That makes it hypothetical. Try to stand firm that the obligation exists regardless of desire.

  #### 4. The "Empty Promise" Objection
  **Who:** Club Advisor (Kantian).
  **Damage Level:** 🔴🔴 Critical (Undermines the definition of your core concept).
  **The Objection:** "You say that in the Relay Case, breaking the promise wrongs no one in particular. But if breaking it wrongs no one, in what sense is it a *promise* at all? A promise creates a duty to a specific person. If you turn it into a general rule about 'helping the system,' you haven't made a promise; you've just made a resolution. You're changing the subject to avoid the moral difficulty."

  **Your 90-Second Reply:**
  "I see why it looks like I'm changing the subject, but I think the Relay Case reveals something hidden in the original one. In the standard case, we think we owe the driver. But once I'm in town, the driver is fine. I'm not hurting them by not paying.
  So, even in the original case, the 'wrong' isn't actually harming the driver. It's violating the practice of promising itself. The Relay Case just makes this obvious by removing the specific person entirely. I'm not saying the promise is empty. I'm saying the weight of the promise doesn't come from the person listening to it, but from the act of committing yourself. The Relay Case just strips away the distraction of the driver's feelings so we can see that."

  **Honest Note on Softness:**
  This is the hardest hit. A Kantian believes the duty is to the person, not the system. You are arguing the duty is to the *practice*. If the Advisor pushes that "a promise requires a promisee," you have to concede that your "Relay Promise" is a new kind of commitment, different from a standard contract. Don't fight the definition too hard; argue that it's a *better* definition for this puzzle.

  ---

  ### The One Question You Hope Nobody Asks

  **The Question:**
  "If the Relay Case shows that breaking the promise wrongs no one in particular, and it's only 'bad' because of the threshold effect, then why shouldn't I be the first person to break the chain? If everyone else is going to keep it, the system survives without me. If everyone else is going to break it, my effort is wasted. So in *every* scenario, my rational choice is to walk away. Haven't you just described a Tragedy of the Commons without solving it?"

  **Why this hurts:**
  It combines the Econ "Free Rider" problem with the Advisor's "Duty" problem. It suggests your "Threshold" insight doesn't actually tell anyone what to *do* in the moment.

  **Emergency Reply (if asked):**
  "You're right that it doesn't make it *personally profitable* to keep the promise. That's my whole point. The standard view tries to say keeping the promise is smart for *you*. I'm saying it's not smart for you; it's necessary for the *group*. So the answer to 'Why shouldn't I break it?' isn't 'Because you'll benefit.' It's 'Because if everyone asks that, we all die in the desert.' I'm arguing we need to stop looking for a selfish reason to be good."
