answer: |-
  Your friend's summary is surprisingly robust for a casual overview, capturing the broad strokes of Harsanyi's contribution to utilitarianism and social choice. However, a careful reader of Harsanyi (or social choice theory) would identify a significant technical conflation, a few overstatements, and one nuanced historical claim.

  Here is the audit of the specific claims:

  **1. "Harsanyi proved that a rational person behind a veil of ignorance... will pick the arrangement that maximizes average utility."**
  *   **Verdict:** **Accurate (but distinct from the Aggregation Theorem).**
  *   **Analysis:** This refers to Harsanyi's *Impartial Observer Theorem* (1953), not his *Aggregation Theorem* (1955). In this argument, Harsanyi posits that a moral agent choosing social rules under equiprobability (the "veil") maximizes expected utility, which mathematically equates to average utility. Your friend correctly identifies the conclusion, but attributes it to the same bucket as the aggregation math.

  **2. "The theorem itself says that any social welfare function satisfying the Pareto principle and the expected-utility axioms has to be a weighted sum of individual utilities..."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the core of the 1955 Aggregation Theorem. If individual and social preferences both satisfy von Neumann-Morgenstern (vNM) rationality axioms, and social preferences respect the Pareto principle, the social utility function must be a linear (weighted) combination of individual utility functions ($W = \sum a_i U_i$).

  **3. "...and because behind the veil you're equally likely to be anyone, the weights must be equal."**
  *   **Verdict:** **Common Simplification / Conflation.**
  *   **Analysis:** This is where the two theorems are merged. The Aggregation Theorem *alone* permits unequal weights (e.g., $a_i$ could differ based on status or other factors). The "equal weights" conclusion ($a_i = a_j$) comes strictly from the *Impartial Observer* argument (the veil/equiprobability assumption), not the aggregation math itself. While Harsanyi intended them to work together, technically the Aggregation Theorem yields *weighted* utilitarianism; the Veil argument justifies *classical* (equal-weight) utilitarianism.

  **4. "So it's a proof that utilitarianism is the only rational social choice rule..."**
  *   **Verdict:** **Overstatement.**
  *   **Analysis:** It proves utilitarianism is the only rule *conditional* on accepting the vNM axioms for social preferences and the Pareto principle. Many philosophers and economists (notably Amartya Sen) argue that applying vNM expected-utility axioms to *social* choices is not "rational" in the same way it is for individual choices. Therefore, it is not an unconditional proof of rationality, but a conditional consistency proof.

  **5. "...and it also shows how to get around Arrow's impossibility theorem by using cardinal utilities to aggregate preferences consistently."**
  *   **Verdict:** **Accurate.**
  *   **Analysis:** Arrow's Impossibility Theorem assumes ordinal preferences and bans interpersonal comparisons. Harsanyi's framework assumes cardinal utility (via vNM) and allows interpersonal comparisons (via the vNM scale normalization). By changing the "informational basis" from ordinal to cardinal, the impossibility result no longer applies.

  **6. "The catch is that it assumes interpersonal comparisons of utility are meaningful, which is why later economists rejected it."**
  *   **Verdict:** **Nuanced / Partially Wrong.**
  *   **Analysis:** This is the shakiest part. Harsanyi argued that vNM cardinality *provides* the basis for interpersonal comparisons (by fixing the zero and unit via the veil). Critics (like Robbins or Sen) argue that vNM cardinality is still individual-specific and doesn't automatically grant *interpersonal* comparability without further ethical assumptions. Regarding "rejection": Later economists didn't universally reject it; rather, social choice theory (led by Sen) shifted toward analyzing *what* informational assumptions (ordinal vs. cardinal, comparable vs. non-comparable) yield which results. It is more accurate to say the assumptions were recognized as "strong" rather than the work being "rejected."

  ### Does the conclusion follow?
  The conclusion that "utilitarianism is the only rational rule" follows **only if** one accepts the vNM axioms as binding on social welfare and accepts the equiprobability model of the veil of ignorance. If one rejects the idea that society should be modeled as a single expected-utility maximizer (a common critique), the conclusion fails.

  ### Confidence and Uncertainty
  **Confidence:** 90%
  I am highly confident in the technical distinction between the Aggregation Theorem and the Impartial Observer Theorem, as well as the relationship to Arrow's theorem.

  **Least Sure Point:** I am least certain about the characterization that later economists "rejected" Harsanyi's approach. While the ordinalist consensus (post-Robbins/Arrow) made interpersonal comparisons taboo for a time, modern welfare economics and mechanism design often utilize Harsanyi-style cardinal frameworks. "Rejected" might be too strong a verb for "heavily critiqued and restricted to specific axiomatic contexts."

  \answer{Substantially correct but technically conflated}
