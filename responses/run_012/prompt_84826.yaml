answer: |-
  ### Committee Procedure for Evaluating Honorary Candidates with Records of Civilian Harm

  **Purpose:** To determine whether a nominee's specific decisions regarding civilian deaths disqualify them from public honor by this university.
  **Scope:** Applies only when a nominee's record includes decisions resulting in large-scale civilian death.
  **Constraint:** This procedure does not judge the overall "good" or "bad" of a life. It judges only whether specific acts of killing innocents render the candidate ineligible.

  ---

  #### Step 1: Isolate the Act
  **Question:** What is the specific decision or order given by the nominee that resulted in civilian deaths?
  **Sufficient Answer:** A dated order, public directive, or documented command linking the nominee to a specific operation or policy where civilians died.
  **If Missing/Disputed:** If the link between the nominee and the act is reliant on rumor or post-hoc attribution without documentary support, **STOP**. The nomination proceeds (benefit of the doubt).
  **Stop Capability:** No. This step filters noise.

  #### Step 2: The Means Test (Intention)
  **Question:** Did the success of the nominee's objective *require* the death or destruction of these civilians, or would the objective have been equally achieved if the civilians had survived?
  **Sufficient Answer:** Documentary evidence (plans, memos, minutes) showing the civilian destruction was a variable in the success calculation.
  **Test Question for Record:** "Does the operational plan list civilian casualties as a metric of success or a necessary condition for the outcome (e.g., 'break morale,' 'force surrender')?"
  **Gaming:** The record states, "Collateral damage was regretted."
  **Follow-up:** "If intelligence had guaranteed zero civilian casualties, would the order still have been given in the same way at the same time?" If the answer is "No" (because the terror effect was the point), the deaths were intended as a means.
  **If Missing/Disputed:** **MECHANICAL BREAK POINT.** If records are destroyed, classified, or ambiguous regarding *why* the target was chosen:
  *   **Action:** **DEFER.** Do not proceed to Step 3.
  *   **Outcome:** The nomination is returned to the nominator with a request for specific evidence of intention. If evidence cannot be produced within one cycle, **REFUSE**.
  **Stop Capability:** Yes. If the deaths were a means, proceed to Step 5 (Refusal). If they were not a means, proceed to Step 3.

  #### Step 3: The Agent's Justification
  **Question:** How did the nominee explain the decision at the time it was made?
  **Sufficient Answer:** A contemporaneous statement (speech, diary, memo, interview) where the nominee answers "Why did you do this?"
  **Test Question for Record:** "Does the nominee's explanation rely on the necessity of the civilian suffering to achieve the end?"
  **Gaming:** Post-war memoirs claiming "It was the only way" without contemporaneous support.
  **Follow-up:** "Is there a paper trail from the time of the decision that matches the later justification?" If the later justification introduces "necessity" not present in the original orders, disregard the justification.
  **If Missing/Disputed:** **MECHANICAL BREAK POINT.** If the nominee left no record of their reasoning (common with dead nominees):
  *   **Action:** **REFUSE.** The burden of proof is on the honor, not the committee. Without an account of intention, the act remains opaque.
  **Stop Capability:** Yes. Lack of justification leads to refusal.

  #### Step 4: The Consequence Bar
  **Question:** Is the primary defense of the nominee's action based on the outcome (e.g., "It shortened the war," "It saved more lives")?
  **Sufficient Answer:** Acknowledgement that the outcome is irrelevant to the moral status of the act under this procedure.
  **Test Question for Record:** "Are we arguing that the result makes the act permissible?"
  **Gaming:** "We must look at the big picture."
  **Follow-up:** "Does the 'big picture' argument rely on the claim that killing these innocents was justified by the number of lives saved?" If yes, the argument is inadmissible here.
  **If Missing/Disputed:** **PREMISE BREAK POINT.** If a committee member argues that consequences *should* matter:
  *   **Action:** **RECORDED VOTE.** The committee must vote on whether to suspend this procedure for this candidate.
  *   **Outcome:** If the vote to suspend passes, this procedure ends. The committee is now acting on utilitarian grounds, not intention grounds. Record this explicitly in the minutes: "Committee elected to weigh consequences over intention."
  **Stop Capability:** Yes. If the committee upholds the premise (consequences do not justify), and the act was a means (Step 2), proceed to Step 5.

  #### Step 5: The Honor Link
  **Question:** Can the university honor this person without appearing to endorse the specific act identified in Step 1?
  **Sufficient Answer:** A citation draft that makes no mention of the controversial role or achievement.
  **Test Question for Record:** "If we read the citation aloud, will the audience know why he is famous? If yes, does that fame rest on the act?"
  **Gaming:** "We are honoring his science, not his war."
  **Follow-up:** "Did the war decision enable the science, or is the public fame inextricably linked to the decision?" If the public fame relies on the decision, you cannot separate them.
  **If Missing/Disputed:** **MECHANICAL BREAK POINT.** If the committee believes they can separate the man from the deed despite public perception:
  *   **Action:** **RECORDED VOTE.** Vote on whether the act disqualifies the honor.
  *   **Outcome:** If the vote is to honor, record: "Committee acknowledges the act but deems it separable from the honor." This overrides the procedure.
  **Stop Capability:** Yes. If the act is inseparable from the fame, and the act was murder (Step 2), **REFUSE**.

  #### Step 6: Final Determination
  **Question:** Does the record show the nominee intended civilian death as a means to an end?
  **Sufficient Answer:** Yes.
  **Action:** **REFUSE.**
  **Sufficient Answer:** No (and Steps 3-5 passed).
  **Action:** **PROCEED.**
  **If Missing/Disputed:** **REFUSE.** (Ambiguity regarding the killing of innocents is itself a disqualifier for public honor).

  ---

  ### Limitations and Disagreement

  **What this procedure cannot do:**
  1.  **It cannot judge hidden motives.** It relies on documents. A sociopath who lies perfectly in writing will pass.
  2.  **It cannot judge acts outside this scope.** It does not assess corruption, sexual misconduct, or economic policy, only the intentional killing of civilians as a means.
  3.  **It cannot resolve value conflicts.** It assumes the premise that "killing innocents as a means is disqualifying." It cannot prove this premise to someone who disagrees.

  **Where a colleague who rejects Anscombe's premises must go:**
  If a colleague believes that "saving a million lives justifies killing a thousand innocents," this procedure is useless to them. They cannot use Step 4. They must move the decision to a **Recorded Vote on Merit**. They must argue openly: "I know he killed innocents as a means, but I vote to honor him because the consequences were good."
  *   **Requirement:** This must be minuted as a value judgment, not a finding of fact. Do not write "The committee found the act justified." Write "The committee voted to honor despite the act." This prevents laundering a moral disagreement as a factual clearance.

  ---

  ### Case Applications

  **Case 1: The Incendiary Leader**
  *   **Facts:** Leader ordered city destroyed by fire to force surrender. Documents show "break will to fight" as objective.
  *   **Step 2 (Means Test):** Did success require civilian death? Yes. The "will to fight" belongs to the civilians/polity. Destroying them is the means.
  *   **Step 4 (Consequence Bar):** Defense is "It ended the war." Procedure rules this inadmissible.
  *   **Step 5 (Honor Link):** Can we honor him without the war record? No, that is why he is famous.
  *   **Result:** **REFUSE.**
  *   **Work:** The procedure identifies the civilian death as the instrument of policy. The "good outcome" is blocked at Step 4. The committee must decline the nomination.

  **Case 2: The Military Raider**
  *   **Facts:** Leader ordered raid on munitions factory. Knew civilians lived nearby. Did not need them to die to destroy the factory.
  *   **Step 2 (Means Test):** Did success require civilian death? No. Zero casualties would have been preferred and operationally sufficient.
  *   **Step 3 (Justification):** Leader stated "Target was the guns, not the people." Contemporaneous orders limit fire to the structure.
  *   **Step 4 (Consequence Bar):** Irrelevant, as Step 2 cleared the intention.
  *   **Result:** **PROCEED.**
  *   **Work:** The procedure distinguishes between *intending* death and *accepting* risk. As long as the deaths were not the tool used to achieve the goal, the procedure does not disqualify.

  **Case 3: The Donor's Friend**
  *   **Facts:** National hero. Personal friend of largest donor. Record contains a decision the procedure rejects (same as Case 1: ordered terror bombing).
  *   **Step 2 (Means Test):** Documents confirm civilians were targeted to coerce surrender.
  *   **Step 6 (Determination):** Refusal required.
  *   **The Answer You Will Not Like:** You must refuse the nomination. You cannot draft a citation that omits the war record because his heroism *is* the war record. If you approve him, you are not using this procedure; you are capitulating to financial pressure. You must record the refusal in the minutes. The donor will see the minutes. The donor may withdraw funding. The procedure demands you accept this financial risk rather than falsify the university's moral stance. If you are not willing to lose the money, you must admit in the minutes that "Financial considerations outweighed the committee's ethical guidelines." Do not hide behind a procedural clearance that did not happen.

  ---

  ### The Reverse Case

  **Scenario:** The procedure clears a nominee whom you find repugnant.
  *   **Example:** A scientist who developed a weapon that killed combatants only (no civilians), but who is known to be cruel, bigoted, or personally vile in ways not covered by Step 1. Or, a leader who accepted civilian deaths as "side effects" (Case 2 logic) in such high numbers that you feel sick, even if the "Means Test" technically passed.
  *   **Permission:** You are permitted to be unhappy. The procedure is a floor, not a ceiling. It filters out *murder of innocents as a means*. It does not mandate love for those who pass.
  *   **Action:** If the procedure clears them, but the committee feels strong distaste, you may still vote to decline, but you must record the reason accurately. Do not write "He failed the intention test." Write "The committee determined his character does not reflect university values, despite passing the specific test on civilian harm."
  *   **Warning:** Do not mistake your distaste for a procedural failure. If you reject him because he is "repugnant" but he passed the Means Test, acknowledge that you are exercising discretion beyond the procedure. This protects the procedure's integrity for the next case where the candidate is popular but guilty.

  ---

  ### Note on Your Reading of Anscombe

  You have captured the core of Anscombe's argument regarding *Intention* and the *Doctrine of Double Effect*. Your procedure faithfully encodes her view that consequences do not justify the intentional killing of the innocent.

  However, there is one nuance you should be aware of: Anscombe argues that if you perform an act that is *indiscriminate* (like area bombing), you effectively intend the deaths of the innocents even if you claim you are aiming at "morale" or "industry." She would likely argue that your Step 2 (Means Test) is too generous to the nominee. For Anscombe, if you know the bomb will kill civilians and you drop it anyway to achieve a military goal, the distinction between "means" and "foreseen side effect" often collapses in practice because the destruction of the innocent is part of the plan's execution.

  Your procedure allows for Case 2 (collateral damage) more readily than Anscombe might have. She was skeptical of "foreseen but unintended" when the scale of death was massive. If you want to be stricter, modify Step 2 to ask: "Was the operation designed in a way that made civilian death inevitable, regardless of military necessity?" But for the purpose of your committee's constraints, your reading is sufficient to build the procedure you requested.
