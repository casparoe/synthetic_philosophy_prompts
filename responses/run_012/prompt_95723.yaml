answer: |-
  You are not inventing this. You have independently rediscovered one of the most persistent and frustrating fault lines in probability theory, decision theory, and machine learning.

  The short answer is: **Yes, there is a name.** The economist you are remembering is **John Maynard Keynes**, and the concept is the **Weight of Evidence** (or *Weight of Arguments*).

  However, since you are an engineer, the modern machine learning terminology might actually serve you better than the philosophical one. In ML, this is the distinction between **Aleatoric Uncertainty** (the randomness of the world) and **Epistemic Uncertainty** (the ignorance of the model).

  Here is the breakdown of how this thing gets carved up, why your intuition about "second-order probability" felt wrong, and how to handle the decision-making side without lying about the 0.8.

  ### 1. The Names and The History

  **The Philosopher's Name: Keynes' "Weight"**
  In *A Treatise on Probability* (1921), Keynes argued that probability measures the *balance* of evidence (favorable vs. unfavorable), but not the *amount* of evidence.
  *   **Probability:** The ratio of supporting evidence to total evidence.
  *   **Weight:** The absolute amount of relevant evidence.

  Keynes explicitly wrote: *"The weight of an argument is not probabilistic."* You cannot capture it with a single number between 0 and 1. Two arguments can have the same probability (0.8) but vastly different weights. As you noted, more data can increase weight while decreasing probability (if the new data is messy), or increase weight while keeping probability stable.

  **The Engineer's Name: Epistemic vs. Aleatoric Uncertainty**
  *   **Aleatoric Uncertainty:** This is the "fair coin" risk. The data is noisy, the world is stochastic. Even with infinite data, you can't predict better than the 0.8. This is inherent to the proposition.
  *   **Epistemic Uncertainty:** This is the "thin data" risk. The model doesn't know because it hasn't seen enough cases. This is inherent to *you* (the model/agent). With more data, this goes down.

  Your "0.8 on thick data" is high Aleatoric, low Epistemic.
  Your "0.8 on thin data" is high Aleatoric, high Epistemic.

  ### 2. The Ontology: Where does this live?

  You asked: *Is it a feature of my evidence, of the proposition, or of me?*

  It is a **relation between the Agent and the Proposition, mediated by the Evidence.**

  *   It is **not** a feature of the proposition. The account either churns or it doesn't. The "true probability" is a property of the generating process, but the *weight* is not in the process.
  *   It is **not** purely a feature of the evidence. Evidence doesn't have weight in a vacuum; it has weight relative to a question.
  *   It **is** a feature of your state of knowledge.

  **Can two people have the same probability and different weights?**
  Yes. If I have seen 1,000 cases and you have seen 10, but we both calculate 0.8, we have the same probability but different weights.

  **Who defers to whom?**
  In a rational market or team setting, **Weight trumps Probability.**
  If we are betting, the person with higher weight (more evidence/less epistemic uncertainty) should dictate the position size. If you have low weight, you should defer to the high-weight agent *unless* you have private information that suggests their data is biased.
  *   *Why?* Because the low-weight probability is fragile. It is more likely to shift drastically with new information. The high-weight probability is robust.

  ### 3. Why "Second-Order Probability" Felt Wrong

  You said: *"Saying I have a probability distribution over the probability also felt off... it's not that I think the true number is drawn from somewhere."*

  Your intuition is sharper than the standard textbook explanation.
  Standard Bayesianism models this as a distribution over parameters (e.g., a Beta distribution). If you have a Beta(8, 2), your mean is 0.8. If you have a Beta(80, 20), your mean is 0.8. The variance of the second is much lower.

  **Why it felt wrong to you:**
  Because there is no "true probability" floating in the ether waiting to be sampled. The "true probability" is just a limit of frequency. When you say "distribution over probabilities," it sounds like you're saying "Nature picks a probability, then picks an outcome." That's not what's happening. Nature picks an outcome. The distribution represents *your confusion*, not nature's randomness.

  **A better formalism: Credal Sets / Probability Intervals**
  Instead of a distribution over probabilities, many theorists (like Isaac Levi or Peter Walley) suggest using **Imprecise Probability**.
  You don't say $P = 0.8$.
  You say $P \in [0.6, 0.9]$.

  *   **Thick data:** $P \in [0.79, 0.81]$ (Tight interval, high weight).
  *   **Thin data:** $P \in [0.4, 0.9]$ (Wide interval, low weight).

  The *width* of the interval captures the "Weight" without claiming there is a hidden "true number" being drawn. It captures the range of reasonable beliefs given the evidence. This aligns with your feeling that the thin 0.8 shouldn't be treated as a solid 0.8.

  ### 4. The Coin vs. Hunch (Ellsberg Paradox)

  You asked about the "two 50/50 bets, one a fair coin, one a vibe."
  This is the famous **Ellsberg Paradox** (1961).

  *   **Urn A:** 50 red, 50 black. (Known risk).
  *   **Urn B:** 100 balls, ratio unknown. (Ambiguity).

  People overwhelmingly prefer to bet on Urn A, even though the expected value is identical. Standard probability theory (Savage's Sure Thing Principle) says this is irrational. If you think Red is 50% in Urn B, you should be indifferent.

  **Why it feels rational to you:**
  Because you are intuitively applying **Ambiguity Aversion**. You are penalizing the bet for its low Weight/High Epistemic Uncertainty.
  In decision theory, this is modeled not by changing the probability, but by changing the **Utility Function**.
  *   **Standard:** Maximize Expected Utility ($E[U]$).
  *   **Ambiguity-Averse:** Maximize Minimum Expected Utility (Maximin) or use a smooth ambiguity model (Klibanoff, Marinacci, Mukerji).

  **So, to answer your specific question:**
  Yes, the difference you feel between the coin and the hunch is exactly this "Weight" thing. It is not a difference in the *probability* of winning; it is a difference in the *reliability* of that probability estimate.

  ### 5. Knightian Uncertainty: Is it the same?

  **Frank Knight (1921)** distinguished:
  *   **Risk:** Outcomes unknown, probabilities known (e.g., Roulette).
  *   **Uncertainty:** Outcomes unknown, probabilities unknown (e.g., Launching a new product).

  Your case is a hybrid. You *have* a probability (0.8), so it's not pure Knightian Uncertainty. But you don't *trust* the probability.
  Economists often call this **Ambiguity** (as opposed to Risk).
  *   **Risk:** You know the distribution.
  *   **Ambiguity:** You aren't sure about the distribution (even if you have a point estimate).

  So, your "thin data 0.8" is a **Risky estimate under Ambiguity**.

  ### 6. How to handle this practically (without lying)

  You mentioned your team corrects by hand ("treat the thin ones more like a 0.6"). You correctly identified this as "false." It creates calibration issues. If you log 0.6 but the model outputs 0.8, your calibration plots are lies.

  **The Engineering Solution:**
  Decouple **Prediction** from **Decision**.

  1.  **The Model** outputs the Probability ($p = 0.8$) AND an Uncertainty Score ($u = \text{variance}$ or $\text{interval width}$).
      *   Keep the 0.8 honest. It is the best estimate of the frequency.
  2.  **The Policy** consumes both.
      *   If $p > 0.7$ AND $u < \text{threshold}$: Trigger Intervention.
      *   If $p > 0.7$ AND $u > \text{threshold}$: Flag for Human Review / Reduce Bet Size.

  This is how high-stakes systems (autonomous driving, medical diagnosis) handle it. They don't clamp the probability; they clamp the *actionability* based on epistemic uncertainty.

  **If you must have a single number for a downstream system:**
  Use **Probability Intervals** (Lower Bound).
  Instead of passing `0.8`, pass `0.65` (the lower bound of your 95% credible interval).
  *   Thick data 0.8 $\rightarrow$ Interval [0.78, 0.82] $\rightarrow$ Pass 0.78.
  *   Thin data 0.8 $\rightarrow$ Interval [0.40, 0.95] $\rightarrow$ Pass 0.40.

  This preserves the "conservatism" your team wants without claiming the expected frequency is different. It says: *"I expect 0.8, but I'm only willing to guarantee 0.4."*

  ### Summary

  1.  **Name:** **Weight of Evidence** (Keynes) or **Epistemic Uncertainty** (ML).
  2.  **Ontology:** It is a property of the **Agent's state of knowledge**, not the proposition.
  3.  **Coin vs. Hunch:** This is the **Ellsberg Paradox**. The difference is real and rational to account for via **Ambiguity Aversion**.
  4.  **Decision Making:** Do not adjust the probability (calibration). Adjust the **bet size** or **action threshold** based on the weight/uncertainty.
  5.  **Formalism:** If distributions over probabilities feel fake, use **Credal Sets** (Probability Intervals). The width of the interval is the "Weight."

  You haven't found a bug in your thinking; you've found a bug in the standard notation of probability theory. It forces you to write $P(A) = 0.8$ when what you really mean is $P(A) = 0.8 \pm 0.4$ vs $P(A) = 0.8 \pm 0.02$. The information is in the $\pm$, not the $0.8$.
