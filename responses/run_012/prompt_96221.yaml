  I am a first-year PhD student in philosophy of mind, and I have to turn in a short prospectus—about 1,500 words, to be defended at a departmental workshop in six weeks—on some question in the metaphysics of realization. The idea came out of an argument with a colleague in a seminar on mental causation, and it has become genuinely pressing for me because I have to decide soon whether to commit a year to it. Here is the half-formed thought. Functionalism's multiple realizability thesis is almost always presented as a broadly empirical claim: the same mental state can be realized by different physical states, and we discover which by looking (octopus, bird, silicon, and so on). But it seems to me that whether a given pair of systems counts as an instance of multiple realization depends entirely on how finely we individuate the realizing physical kinds, and that this choice of grain is not itself an empirical discovery. Individuate the physical coarsely and almost nothing is multiply realized, because every case turns out to be "the same kind" at some level of description; individuate finely and everything is multiply realized, because no two systems share an exact physical kind. Take a brass adding machine and a silicon chip that both implement the same arithmetic function: whether that is one realization or two looks like a fact about our taxonomy, not about the machines. If that is right, then the standoff between those who treat multiple realization as ubiquitous and those who argue it is rare may be less a disagreement about the world than about the grain at which realization is claimed—and the live question is not whether minds are multiply realized but what fixes the grain, and whether anything principled does.

  I would like you to act as an expert philosopher of mind with a specialization in the metaphysics of realization, and to help me convert this into a real proposal. Think it through carefully, and before you settle on a framing, spend a moment enumerating the two or three most natural ways to state the question precisely—for instance, as a question about the relata of the realization relation, as a question about levels or grains of physical description, or as a question about whether functionalism needs the multiple realizability thesis at all—and then say which framing makes the question both genuinely open and tractable within a term, and why the others do not.

  Then write the prospectus itself. It should contain a precise statement of the question that has a determinate answer; an account of why the existing positions leave it open rather than settled—the type-identity theorist's appeal to physical kinds, the functionalist's appeal to multiple realization, the disjunction and causal-exclusion worries, and the more recent skepticism about whether multiple realization is even common; the method, meaning what I would actually do, week by week; a description of what a result would look like and what would count as the project failing, or as collapsing into a merely verbal dispute (I am genuinely worried it might, so I want the proposal to say how one would tell); and an honest assessment of scope for a 1,500-word prospectus and a term of work. Do not give me a bibliography, a reading list, or citations—I will supply those myself; refer to positions and arguments in your own words instead. Please begin the response directly with the prospectus, with no preface or commentary, and make its first sentence the precise statement of the research question.
