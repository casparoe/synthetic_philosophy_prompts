answer: |-
  What principled constraint fixes the grain of physical individuation required to substantiate claims of multiple realization, and is this constraint metaphysical or pragmatic? This question arises from a tension at the heart of non-reductive physicalism. The multiple realizability thesis is standardly invoked to block type-identity reductions: if mental kinds can be realized by distinct physical kinds, then mental kinds cannot be identical to physical kinds. However, the truth of this thesis depends entirely on how we individuate the realizing physical bases. If we individuate physical states finely enough, every realization is unique, and multiple realizability becomes trivial. If we individuate coarsely enough, seemingly distinct realizers collapse into the same physical kind, and multiple realizability disappears. Consequently, the debate over whether minds are multiply realized often masks a deeper disagreement about the correct grain of physical description. This project proposes to determine whether there is a principled, non-arbitrary standard for fixing this grain, or whether claims of multiple realization are ultimately relative to explanatory interests.

  The significance of this question extends beyond taxonomy. If the grain of individuation is fixed by metaphysics, then multiple realizability is a robust fact about the world, capable of supporting strong anti-reductionist conclusions. If the grain is fixed by pragmatics, then multiple realizability is a feature of our descriptions, and its utility for metaphysics is limited. Currently, the literature treats the grain of physical kinds as either given by natural science or determined by causal powers, but neither option fully resolves the tension. The type-identity theorist appeals to the kinds posited by completed physics, arguing that at the fundamental level, all realizers of a given mental state will share a physical description. This move relies on the assumption that physics provides a single, privileged level of description. However, special sciences operate at higher levels of abstraction, and it is unclear why the metaphysics of mind should be bound by the grain of fundamental physics rather than the grain of neuroscience or engineering. Conversely, the functionalist appeals to causal roles to individuate mental states, but this leaves the individuation of the realizers unspecified. If realizers are individuated by their causal powers, and those powers are defined by their contribution to the mental state, we risk circularity. The skeptic argues that multiple realizability is rare because genuine distinctness requires structural divergence that is causally relevant, but this merely pushes the question back to what counts as causally relevant divergence.

  Existing positions leave this question open because they assume the grain of physical individuation is settled prior to the analysis of realization. The type-identity theorist assumes a coarse grain dictated by fundamental physics, but fails to explain why higher-level physical similarities do not count as identity. The functionalist assumes a fine grain dictated by structural diversity, but fails to explain why this diversity is metaphysically significant rather than merely descriptive. The skeptic attempts to find a middle ground by requiring relevant similarity, but lacks a criterion for relevance that is not itself dependent on the mental kind being realized. Thus, the standoff between those who treat multiple realization as ubiquitous and those who argue it is rare is less a disagreement about the world than about the grain at which realization is claimed. The live question is not whether minds are multiply realized, but what fixes the grain, and whether anything principled does. Without an answer, the multiple realizability argument for non-reductive physicalism remains vulnerable to the charge that it relies on a verbal trick rather than a metaphysical discovery.

  To address this, I will pursue a six-week research plan designed to isolate the variables of individuation and test them against standard cases. In the first week, I will map the landscape of individuation criteria currently in play, distinguishing between microstructural, causal, and functional criteria for physical kinds. This will involve reconstructing the implicit assumptions about grain in classic arguments for and against multiple realizability, focusing on how different theorists define "same physical kind." The goal is to produce a taxonomy of grain-fixing strategies. In the second week, I will analyze the relationship between grain and causal powers. If physical kinds are individuated by causal powers, does this provide a natural stopping point for fine-graining, or does it lead to an infinite regress where every difference in effect implies a difference in kind? I will test this against the causal exclusion argument to see if a specific grain is required to avoid exclusion without collapsing into overdetermination.

  In the third and fourth weeks, I will apply these criteria to concrete cases. I will examine the standard examples of multiple realization, such as pain in humans versus octopuses, and arithmetic in silicon chips versus brass machines. For each case, I will determine whether the judgment of multiple realization holds under different grain constraints. For instance, if we individuate physical states by their microstructural composition, the human and octopus are distinct; if we individuate by their neurobiological role, they may be similar. I will look for a criterion that yields stable judgments across cases without relying on ad hoc adjustments. Specifically, I will investigate whether the grain is fixed by the explanatory goals of the science in question. If neuroscience seeks different generalizations than physics, does it thereby license a different grain of physical individuation? In the fifth week, I will synthesize these findings into a preliminary account of grain-fixing. I will argue either that there is a metaphysical fact about the correct grain, likely tied to causal powers, or that the grain is pragmatic, tied to explanatory interests. In the sixth week, I will draft the prospectus defense paper, focusing on anticipating objections regarding circularity and triviality. I will prepare to defend the claim that if the grain is pragmatic, multiple realizability cannot support strong metaphysical conclusions about the autonomy of the mental.

  A successful result will look like a criterion for physical individuation that avoids both the triviality of extreme fine-graining and the reductionism of extreme coarse-graining. It must explain why the brass machine and the silicon chip are distinct realizers without relying on the fact that they are made of different stuff, since "stuff" is itself a grain-relative notion. The criterion must be independent of the mental kind being realized, to avoid circularity. If I can show that causal powers provide a non-arbitrary stopping point for individuation, then multiple realizability is metaphysically robust. If I show that causal powers are themselves grain-relative, then multiple realizability is pragmatic. Either result is a success, provided it is argued rigorously. The project fails if it collapses into the claim that "grain is relative to interests" without specifying which interests matter or why. It also fails if it relies on a notion of physical kind that presupposes the mental kind, thereby begging the question against the identity theorist. A merely verbal dispute would result if the conclusion is simply that different theorists mean different things by "physical kind" without resolving which meaning is appropriate for metaphysics. To avoid this, I will explicitly tie the choice of grain to the metaphysical work multiple realizability is supposed to do, namely, blocking reduction. If the grain that allows multiple realizability also blocks reduction, the account is substantive. If the grain that allows multiple realizability is compatible with reduction, the account is verbal.

  The scope of this project is limited to the metaphysics of realization and does not extend to a full defense of non-reductive physicalism. I will not argue that multiple realizability is true, but rather what it would take for it to be true in a metaphysically significant sense. This is appropriate for a term project, as it isolates a single premise of the larger argument. However, there is a risk that the question of grain is too entangled with the philosophy of science to be settled within six weeks. The individuation of physical kinds is a topic in its own right, and I may find that the literature offers no consensus. To manage this, I will restrict my analysis to the specific context of mental realization, rather than physical kinds generally. I will also limit the case studies to the standard examples in the literature, rather than attempting to survey empirical neuroscience. This ensures the project remains philosophical and tractable. Another risk is that the distinction between metaphysical and pragmatic grain is itself unclear. If causal powers are both metaphysical and interest-relative, the dichotomy may collapse. I will address this by defining "metaphysical" as mind-independent and "pragmatic" as dependent on explanatory goals. If the project reveals that this distinction is untenable, that too is a significant result, though it would require reframing the conclusion. Ultimately, the goal is to provide a clear account of the conditions under which multiple realizability claims are substantive, thereby clarifying the stakes of the debate for the departmental workshop.
