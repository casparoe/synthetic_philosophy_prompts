answer: |-
  Mr. Speaker, Honorable Members of the Legislature, Elders of the Nation, Citizens of the Republic.

  I rise in this chamber to speak for the Government. I stand before the representatives of the people, the guests seated in the gallery, and the record of this country. I speak to acknowledge a fact that has stood unchallenged in our law for one hundred and fifty years. On this anniversary, the Government offers an apology to the Indigenous Nation removed from the River Valley in 1875.

  This apology is unconditional. It contains no explanation of the context. It offers no justification based on the beliefs of the past. It weighs the wrong against no subsequent achievement. It stands alone.

  We state clearly what was done. This legislature, the predecessor of this body, debated and passed the Removal Act. The Cabinet of the day ordered the enforcement of that Act. The Commissioners of Land signed the warrants. The Marshals of the State executed the orders. They forced the Nation from its ancestral territory. They transferred the land to private settlers. They dismantled the community's presence in the valley. This was not a natural disaster. It was not an accident of history. It was a deliberate act of the State. The agents of the State did this work. Their names remain on the buildings of this capital. Their signatures remain in the archives. We name them as the authors of this wrong.

  We name the act as wrong. It was wrong then. It is wrong now. The legality of the Act under the statutes of 1875 does not absolve the morality of the act. The consent of the settlers who benefited does not absolve the theft. The State took what it did not own. It broke the trust it held. It inflicted harm that persists.

  I address this words to two audiences. First, I speak to the dead. The ancestors of the Nation removed from the valley cannot hear this speech. They cannot receive this acknowledgment. They died without redress. This speech does not reach them. It only records that we know they were wronged.

  Second, I speak to the living. The Elders seated here, the descendants of the Nation, the citizens of the State. You are under no obligation to accept this apology. Acceptance is not required. There is no mechanism by which a people grants forgiveness to a state. A people is not a person. There is no single voice that can accept this apology on behalf of the Nation. We acknowledge this limitation. We do not ask for forgiveness. We state that no forgiveness is being asked for. The apology is offered regardless of reception.

  The Government distinguishes this apology from the remedy we announce today. The apology is a moral statement. The remedy is a legal obligation. They are separate. The acceptance of the apology does not trigger the remedy. The rejection of the apology does not void the remedy. The remedy is owed because the land was taken, not because we speak these words.

  Later this session, the Government will introduce legislation to repeal the surviving statutes of the Removal Act. These statutes remain on the books today. They are still law until this body votes otherwise. The State still holds the title to the Valley. This wrong is not finished. The law still bears the signature of the oppressor. The land still bears the mark of the theft. We will repeal the statutes. We will return the title of the Valley to the Nation. This return is not a gift. It is not a trade for silence. It is not a substitute for the apology. It is the restoration of property that was never lawfully alienated. The Government proceeds with this restitution whether the apology is welcomed or rejected.

  We do not claim that this speech repairs the harm. The harm is not reparable. Time does not reverse. Loss does not heal simply because it is acknowledged. The generations lost cannot be returned. The culture fractured cannot be perfectly mended. We do not suggest that the State is improved by this admission. We do not suggest that the Nation is ennobled by its suffering. The suffering was not instructive. It was not redemptive. It was loss.

  We do not claim that the State can feel remorse. The State is an institution. It has no heart to break. It has no conscience to prick. But the State can bind itself. The State can be held to what it says. This apology is a binding on the record. It commits the State to truth. It commits the State to the constraint of its own history. Future governments will be held to this acknowledgment. They cannot claim ignorance. They cannot claim the record is unclear. We bind the State to this truth.

  The legislators who oppose this measure argue it insults their forebears. The legislators who support it argue it is overdue. Both views concern the living. Neither view changes the fact of the wrong. The record of 1875 is clear. The vote was taken. The land was seized. The poverty of the Nation's descendants today is the direct result of that seizure. The wealth of the settlers' descendants is the direct result of that seizure. We do not ask the House to balance these outcomes. We ask the House to recognize the cause.

  This apology does not end the relationship between the State and the Nation. It does not finalize the account. It opens the record to scrutiny. It admits liability. It separates the law from the justice.

  We offer this apology without condition. We offer the remedy without condition. We accept that the wrong exceeds the capacity of the State to fix. We accept that the words may be refused. We speak them because they are true.

  The Clerk will read the text of the Repeal Bill. The House will vote. The record will show who stood where. The apology stands regardless.

  I yield the floor.
