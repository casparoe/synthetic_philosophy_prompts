answer: |-
  **Scene:** *The Counter at the Bureau of Hedonic Adjudication. A CLAIMANT stands before an ADJUSTER who is stamping a form.*

  **ADJUSTER:** Regarding your claim for the kidney stone incident... our biometrics logged a peak suffering intensity of 8.5.

  **CLAIMANT:** And?

  **ADJUSTER:** That hits the Lexical Threshold. Priority veto applies. No quantity of pleasure can compensate for that. We're issuing a formal apology and closing the file.

  **CLAIMANT:** Wait. What if I testify it was only an 8.4? It felt borderline.

  **ADJUSTER:** *Pauses, pen hovering.* Then you fall into the Commensurable Zone. We can trade.

  **CLAIMANT:** So I get a smaller settlement?

  **ADJUSTER:** No. At the current exchange rate, to offset an 8.4, we owe you approximately four hundred years of unblemished euphoria.

  **CLAIMANT:** Four hundred years? But for 8.5 I get nothing?

  **ADJUSTER:** Correct. Above the line, the pain lexically outweighs any bliss, so the transaction is impossible. Below the line, the pain is finite, so we pay the price. Please initial here to confirm your agony was negligible.

  **CLAIMANT:** *Snatches the pen.* It was barely a tickle.

  **ADJUSTER:** *Stamping.* Welcome to the arithmetic zone.
