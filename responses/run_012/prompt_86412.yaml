answer: |-
  You're right to be frustrated. The standard "sunk cost fallacy" explanation is the "gravity" of behavioral economics: everyone invokes it, but half the time they're using it to explain why things fall down and the other half to explain why things float up. It's a label, not a mechanism.

  You've already spotted the fatal flaw in the pop-psych version: The Dollar Auction. In the Dollar Auction, the first bid is the stupidest one. There are no sunk costs yet. You haven't invested anything. You bid 5 cents to win a dollar. That's rational. The escalation happens *after* the trap is sprung, driven by the structure of the game, not the history of the player.

  If you want a spec that works for a novelist—something that lets you build a character who is either tragically deluded or brilliantly ruthless—here is the revised requirements list. I've kept your core five, tightened the language, and added two that are missing but essential for fiction.

  ### The Spec: What a Theory of Escalation Must Deliver

  **1. The Forward-Looking Trap (Your Point #1, Refined)**
  *   **Requirement:** It must explain why a rational actor takes the *next* step even when they know the *whole* journey is a loss.
  *   **The Case:** The Dollar Auction. At 60 cents, I bid $1.00. I know I'm going to lose money either way. But losing 60 cents is worse than losing 0 cents (if I win at $1.00).
  *   **Why it matters:** This stops you from writing monologues about "I've come too far to turn back." Sometimes the line is "I can't afford to stop *now*." That's different. One is nostalgia; the other is math.

  **2. Structural vs. Psychological Costs (Your Point #2)**
  *   **Requirement:** It must distinguish between costs that vanish if you quit (psychological ego) and costs that crystallize if you quit (contractual penalties, loss of collateral).
  *   **The Case:** A bad meal vs. a lawsuit. If you walk out of a restaurant, you just feel rude. If you settle a lawsuit early, you admit liability and invite ten more lawsuits.
  *   **Why it matters:** In your book, if your character stays because he's embarrassed, he's weak. If he stays because leaving triggers a penalty clause (social or financial), he's trapped. Readers forgive trapped rats; they don't forgive stubborn fools.

  **3. The Exit Mechanism (Your Point #3)**
  *   **Requirement:** It must define the "circuit breaker." Escalation is a positive feedback loop; all loops need a fuse.
  *   **The Case:** Bankruptcy, death, or a third-party arbiter.
  *   **Why it matters:** In fiction, escalation without an end is just pacing. You need to know: Does this end because one guy runs out of ammo (resource exhaustion), or because one guy decides the ammo costs more than the territory (re-evaluation)? The former is tragedy; the latter is choice.

  **4. The ROI of Rage (Your Point #4)**
  *   **Requirement:** It must account for the fact that escalation is sometimes a winning strategy.
  *   **The Case:** VC portfolios. 9 out of 10 startups die. You pour money into the 10th one because the *potential* payout covers the losses of the first 9. Or a strike: you lose wages now to gain higher wages forever.
  *   **Why it matters:** This is the "Player" vs. "Fool" divider. A Player escalates because they see a non-linear payoff on the horizon. A Fool escalates because they hope to recover the past.

  **5. Portability of the Trap (Your Point #5)**
  *   **Requirement:** If you swap the character, does the behavior remain?
  *   **The Case:** A new CEO takes over a failing project. If they cancel it, it was ego. If they fund it, it was the project's fundamentals.
  *   **Why it matters:** This tells you if the conflict is about *who* they are or *where* they are. If a saint would do the same thing in that chair, it's a systemic tragedy. If only your specific idiot does it, it's a character flaw.

  **6. The Audience Constraint (New)**
  *   **Requirement:** It must specify who is watching. Escalation is often a signal, not a transaction.
  *   **The Case:** Nuclear deterrence. You build bombs you never intend to use to prove you *would* use them.
  *   **Why it matters:** If your character is escalating to prove a point to *himself*, that's neurosis. If he's doing it to prove a point to *the room*, that's strategy. You can't have reputation without witnesses.

  **7. The Fungibility Test (New)**
  *   **Requirement:** It must handle resources that cannot be replaced.
  *   **The Case:** Time vs. Money. Money is fungible (you can make more). Time is not (you die).
  *   **Why it matters:** This addresses your first wrinkle. Spending years on a grudge is different than spending millions. Money can be written off as a business loss. Time spent is identity spent. "I am the man who spent ten years on this." If he quits, he isn't just losing time; he is deleting a version of himself.

  ---

  ### Addressing Your Wrinkles

  **Wrinkle 1: Time vs. Money**
  You are correct that standard theory leans on money. Time changes the physics.
  *   **The Spec Adjustment:** When the currency is time, the "Stopping Point" (Req #3) moves. With money, you stop when you're broke. With time, you stop when you're dead or when the opportunity cost of *not* doing something else becomes unbearable.
  *   **For the Book:** If he's spending years, the escalation isn't about winning the object anymore; it's about validating the years. The object is just the receipt. If he walks away, the receipt is worthless. This makes him harder to reason with than a gambler. A gambler can leave the casino. A man who built his house in the casino has to burn it down to leave.

  **Wrinkle 2: Reputation as a Commitment Device**
  > *"He's decided that if he's known as a man who never walks away from a position he's paid for, people will stop testing him."*

  This is coherent. In game theory, this is called a **Schelling Point** or a **Binding Commitment**. It is rational *if* the long-term dividend of the reputation outweighs the short-term loss of the current conflict.
  *   **The Trap:** To work, the commitment must be *credible*. If he quits this time "just because it's too expensive," the reputation is shattered. He *must* suffer the loss to maintain the asset (the reputation).
  *   **Fool vs. Player:**
      *   **The Fool** thinks the reputation is worth saving regardless of the cost. He doesn't calculate the dividend.
      *   **The Player** calculates: "This fight costs me $100k. But if I quit, every employee/ rival knows I'm weak, costing me $1M next year. I will pay the $100k."
      *   **The Tell:** The Player has a ceiling. "I will spend up to $100k to prove this point, then I fold." The Fool has no ceiling. "I will spend whatever it takes."
      *   **Verdict:** Your character is a **Player** if he has a secret budget (of time, money, or pain) he is willing to burn to buy the reputation. He is a **Fool** if he is burning blindly hoping the reputation will magically appear.

  ---

  ### The Non-Negotiables vs. The Prejudices

  You asked which requirements can't be satisfied at once. Here is the hard truth: **You cannot satisfy Rationality (Req 4) and Psychology (Req 1 & 2) simultaneously for the same action.**

  *   **The Conflict:** If the escalation is structurally rational (Req 4), then it's not a psychological fallacy (Req 1). If it's a psychological fallacy, it's not rational.
  *   **The Solution for a Novelist:** You don't need to solve this; you need to **obscure** it. The tension in your book comes from the *ambiguity*.
      *   **Non-Negotiable:** Req 3 (Stopping). Everything must end. If you don't know how it ends, you don't understand the escalation.
      *   **Non-Negotiable:** Req 6 (Audience). Escalation is social. Even a hermit escalating against nature is performing for an internalized audience (God, his father, his younger self).
      *   **Prejudice:** Req 5 (Person vs. Position). Academics fight over this. For you, it's a dial. You can slide the character from "victim of the system" to "architect of his own doom" as the plot progresses.

  **The Trade-off:** The more you emphasize the **Reputation/Wrinkle 2** angle, the more rational he seems (Player). The more you emphasize the **Time/Wrinkle 1** angle, the more desperate he seems (Fool).
  *   If he says, "I'm doing this so they know not to mess with me," he's a Player.
  *   If he says, "I can't let those years be for nothing," he's a Fool.
  *   **The Twist:** The most interesting character believes he is the former while acting like the latter.

  ---

  ### The Theory Matrix (Brief)

  Here is how the standard accounts stack up against your Spec. Use this to diagnose which lens fits your scene.

  | Account | Explains Runaway (Req 1) | Distinguishes Structure (Req 2) | Explains Stopping (Req 3) | Allows for Profit (Req 4) | Person vs. Position (Req 5) | Verdict for your Book |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Sunk Cost (Psych)** | No. Assumes past investment drives it. | No. Treats all past cost as fallacy. | No. Assumes exhaustion. | No. Treats all escalation as error. | Person. | **Weak.** Makes your guy look stupid. |
  | **Loss Aversion (Kahneman)** | Yes. Pain of loss > Joy of gain. | Sort of. Framing matters. | No. | No. | Person. | **Okay.** Good for internal monologue. |
  | **War of Attrition (Game Theory)** | **Yes.** Forward looking. | **Yes.** Payoff matrices. | **Yes.** When cost > value. | **Yes.** Winner takes all. | **Position.** | **Strong.** Best for the "Player" angle. |
  | **Signaling/Reputation** | **Yes.** Buying credibility. | **Yes.** Audience costs. | **Yes.** When reputation is secured. | **Yes.** Long-term gain. | **Both.** | **Best.** Fits your "never walk away" wrinkle. |

  **Final Advice:**
  Don't let your character worry about sunk costs. That's boring. Let him worry about **future costs**.
  *   **Fool:** "I've spent 5 years. I can't waste them."
  *   **Player:** "If I quit now, the next 5 years will be spent fighting people who think I'm weak. I can't afford that."

  The second one keeps him in the war without making him a victim of his own memory. It makes him a prisoner of his own strategy. That's a much tighter cage for a novel.
