      *   **Core Debate:** Provenance View (value lies in history/intention/causal path) vs. Experiential View (value lies in the object/experience; indistinguishable = identical value).
      *   **User's Hypothesis:** *Vertigo* is a "forgery of a forgery." Scottie loves a copy of a copy (Judy as Madeleine). The user suspects Scottie is a counterexample to the Provenance View (he wants the surface) *but* is destroyed by the history (the deceit). The necklace proves the film sides with Provenance. Midge's portrait scene matters. The ending suggests the demand for authenticity is destructive.
