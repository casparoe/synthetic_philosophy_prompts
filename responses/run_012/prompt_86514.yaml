answer: |-
  This is a brilliant pivot. The "molecule-for-molecule duplicate" thought experiment is sterile by design; it isolates aesthetic value from human consequence. *Vertigo* refuses that isolation. It insists that the history of an object (or a person) is not just a footnote to its value but the very engine of its affective power.

  Here is a reading of the film through your debate, treating *Vertigo* not as an illustration of the Provenance View but as a critique of its psychological and ethical costs.

  ### 1. The Ontology of the Fake: Copy of a Copy
  Your intuition that this is a "forgery of a forgery" is correct, but we need to tighten the ontology. In the standard forgery debate, there is an Original (the *Mona Lisa*) and a Fake (the copy). In *Vertigo*, there is no aesthetic Original.

  There is the **Victim** (the real Madeleine Elster, who is dead before the film begins and whom Scottie never meets).
  There is the **Performance** (Judy playing Madeleine, orchestrated by Gavin Elster).
  There is the **Resurrection** (Scottie forcing Judy to play Madeleine again).

  Scottie does not fall in love with a person; he falls in love with a *narrative performance*. When he discovers the deception, the "artwork" (the woman as he experienced her) is retroactively degraded. This aligns perfectly with the Provenance View (associated with Goodman or Danto): two indistinguishable objects are not aesthetically equivalent if their histories of production differ.

  However, *Vertigo* adds a layer the philosophy often misses: **The audience is complicit.** In the standard thought experiment, the viewer is passive. In *Vertigo*, Scottie becomes the forger in the second half. He is not just looking for a duplicate; he is manufacturing one. He tries to brute-force the Provenance View by rewriting Judy's history to match the Performance he loved. He wants to make the copy *into* the original by force of will.

  ### 2. Is Scottie a Counterexample?
  You ask if Scottie is a counterexample to the Provenance View because his desire seems surface-level (he wants the look), yet he is destroyed by the history (the deceit).

  I would argue he is not a counterexample, but rather the **Provenance View incarnate as pathology.**

  If Scottie held the Experiential View ("if she looks like Madeleine and acts like Madeleine, she is Madeleine"), the film would end happily in the hotel room. Judy is willing to be that. She offers him the perceptual duplicate. She offers him the *experience* of Madeleine without the *history* of the conspiracy.

  Scottie rejects this. He cannot accept the perceptual duplicate once the provenance is tainted. Why? Because for Scottie, the "value" of Madeleine was her mystery, her tragedy, her connection to the past (Carlotta). That value was *constituted* by the history he believed she had. When the history changes (from "tragic heiress" to "accomplice to murder"), the aesthetic object collapses. He doesn't just want the green suit; he wants the *truth* of the green suit.

  So, Scottie confirms the Provenance View: he proves that knowing the causal history changes the aesthetic experience irrevocably. You cannot "un-know" the forgery. But the film shows us that this philosophical stance is not neutral; it is obsessive. It demands that the world conform to the narrative we have invested in.

  ### 3. The Necklace and Midge: Index vs. Icon
  You are right about the necklace. In semiotics, the necklace functions as an **index**, not an icon. An icon resembles (like Judy's face); an index has a physical causal connection to the referent (the necklace actually belonged to Carlotta).

  The film sides with the index. The visual resemblance (the icon) is enough to fool Scottie initially, but the index (the provenance) is what destroys the illusion. The necklace is the physical trace of the *real* history breaking into the *fake* performance. It is the moment the Provenance View wins the argument visually.

  Regarding Midge: You recall the scene correctly. She paints a parody of the Carlotta portrait, inserting her own sensible, modern face into the tragic historical frame. Scottie barely looks at it. Why? Because Midge's copy is an **honest forgery**. She admits it's a joke. She offers an experience without a deceptive history.

  This highlights a crucial distinction in the debate: **We value forgeries most when they lie to us.** Midge's portrait fails to captivate Scottie precisely because it lacks the deceptive causal path. It offers "art" without "mystery." This suggests that the value we place on originals (or successful fakes) is tied to our desire to be deceived by history. We want the object to carry a weight that isn't visible. Midge offers visibility; Scottie wants the invisible weight.

  ### 4. The Ethical Turn: The Violence of Authenticity
  This is where the film dramatizes something the argument alone cannot. The standard philosophical debate asks: *Is the fake less valuable?* *Vertigo* asks: *What violence do we do when we demand the real?*

  Your reading of the ending is the strongest part of your proposal. The demand for the "genuine article" is shown to be murderous.

  When Scottie drags Judy back to the mission tower, he is forcing a confrontation with the Provenance. He needs her to admit the history. He needs the truth of the causal chain. But Judy cannot survive that truth. The "real" Judy (the woman who loved Scottie) is incompatible with the "real" history (the woman who helped kill Madeleine).

  The film's dark claim is this: **The Provenance View is a demand for purity that living things cannot satisfy.** A painting can have a pure history. A human being is a mess of contradictions, performances, and revisions. By treating Judy as an artwork whose value depends on her history of making, Scottie objectifies her to the point of destruction. He cures his vertigo (he conquers his physical flaw) but loses the woman. The "truth" saves his body but kills his love.

  This adds a moral dimension to the aesthetics seminar. It suggests that insisting on the Provenance View in human relationships is a form of control. It is a refusal to accept the object in front of you in favor of a story about where it came from.

  ### 5. Seminar Scenes and Discussion Points
  To make this work in class, put these three sequences on the board:

  **A. The Makeover Sequence (The Attempted Re-creation)**
  *   **Scene:** Scottie taking Judy to the salon, buying her the suit, silencing her when she tries to speak.
  *   **Discussion:** Is Scottie trying to restore the *experience* (Experiential View) or the *history* (Provenance View)? He knows she is Judy. He knows the history is fake. Yet he tries to rebuild the surface. This complicates your debate. It shows a man trying to use the *surface* to rewrite the *history*. He wants the copy to *become* the original through repetition. Does this work? (The film says no).

  **B. The Necklace Reveal (The Indexical Clue)**
  *   **Scene:** Scottie seeing the necklace in the mirror/jewelry box while Judy is in the bathroom.
  *   **Discussion:** Why does this small object shatter the whole illusion? It's not that she looks different. It's that the object carries a history she said she didn't have. This is the visual argument for the Provenance View. The object's history matters more than the subject's appearance.

  **C. The Tower Ending (The Cost of Truth)**
  *   **Scene:** The confrontation at the top of the bell tower. Judy admits the truth, then falls (or jumps).
  *   **Discussion:** Scottie gets what the Provenance View demands: the full disclosure of the causal history. He gets the "authentic" story. And it results in death. If the Experiential View had prevailed (accepting Judy-as-Madeleine), she would live. Is the film arguing that the Provenance View is ethically untenable in the realm of human love?

  ### 6. Where the Analogy Breaks (And Why It Matters)
  You asked me to tell you if you are forcing the film. There is one point of friction you need to address with your students.

  In art forgery, the "Original" usually exists (the *Mona Lisa* is in the Louvre). In *Vertigo*, the "Original" (the real Madeleine Elster) is dead and irrelevant. Scottie never loved her. He loved the **Simulacrum**.

  This shifts the debate from **Original vs. Copy** to **Simulacrum vs. Reality**.
  *   **Standard Debate:** Copy is bad because it lacks the authority of the Original.
  *   **Vertigo Debate:** Copy is bad because it lacks the *honesty* of the Reality.

  Scottie isn't mourning the loss of the Original; he is mourning the loss of the *Lie*. He preferred the beautiful lie (the successful forgery) to the ugly truth (the honest copy). This inverts the standard moralizing about forgery. Usually, we say "Truth is better than a beautiful lie." *Vertigo* suggests that for the aesthetic experience, the beautiful lie *is* the truth, and exposing it destroys the value.

  ### Summary for the Seminar
  *Vertigo* validates the Provenance View (history matters, indistinguishables are not identical) but indicts the *desire* for it. It shows that valuing an object for its history rather than its presence is a way of valuing the past over the present, and stories over people.

  Scottie is not a counterexample; he is a warning. He demonstrates that if you insist on the Provenance View—if you demand that the thing you love have the "correct" causal history—you may find that nothing living can satisfy that demand. The only perfect original is a dead one. The film argues that the appetite for authenticity is, ultimately, an appetite for control, and it is satisfied only when the object is fixed, finalized, and often, gone.

  Use the film to push your students past the question "Is the fake less valuable?" to the question "What are we doing when we demand the real?" That is where the philosophy lives in the cinema.
