      *   *Refining the "Forgery" aspect:* It's not just a fake painting. It's a *staged event*. The artwork is the *performance* of Madeleine. Scottie is the audience. When he finds out it's a forgery, the aesthetic experience is retroactively poisoned. This supports the Provenance View but adds an ethical dimension the standard philosophical debate often misses.
