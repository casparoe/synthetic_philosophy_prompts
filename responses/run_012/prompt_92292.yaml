prompt: |-
  ok so I'm putting together a doc for my reading group and I need you to draft it. Background: two of my friends have been arguing for like a year about German vs American folk morality. One of them is all in on the German/order thing — the idea that the morally mature person is the one who follows the rules, keeps things in order, does their duty without making a scene, trusts the procedure. The other is all in on the American/conscience thing — individual conscience is the final court of appeal, you disobey when you have to, the person who just "follows orders" is the moral failure. They've been going in circles and honestly half the time I think they're just talking past each other.

  So here's what I want: write the document they *should* have produced after a year of good-faith arguing. I want a numbered section of claims both of them could actually sign — about what morality is for, about coordination, about what each tradition gets right, whatever survives. Then a table of where they genuinely still disagree, and for each disagreement a neutral phrasing that each side would accept as a fair statement of its own view (not a strawman, not a sneaky concession either). Then the cruxes: the sub-questions where settling it would actually move one of them. And for each crux, name a case or argument that both of them would agree bears on it, and write down what each side predicts about that case in advance.

  Now the part I actually care about, because otherwise you'll just give me the same tired duty-vs-autonomy stuff. I want you to work in a specific angle and take it seriously. Think of rules and conscience as two different ways of allocating a fixed budget of moral attention. Every rule you internalize saves you from having to make a fresh judgment, and the question is whether the attention you save gets spent well — on the hard cases that really need it — or just wasted, so you end up morally lazy and blind to the one case where the rule has gone rotten. The German/order side should say the saved attention is exactly what lets you notice the rotten case calmly, without panic. The American/conscience side should say no, the rule-follower never notices at all, because noticing requires having kept the judgment muscle in shape. I want that tension to be one of the named cruxes, and I want a concrete case both sides accept as a test — something like a workplace or hospital or bureaucratic scenario where a standing rule produces an obviously bad outcome, and each side has to say who spots it first, the rule-follower or the conscience-driven one.

  Two more things I want in there. First, a crux about recovery: after a system gets something badly wrong — a bad rule, or a bad consensus — which kind of culture corrects faster, and does each side have to concede something about its own failure mode? Second, if any part of their fight turns out to be purely verbal (like they mean different things by "duty" or "freedom"), say which part and why, instead of pretending it's a real disagreement.

  Keep it plain and readable, no jargon soup, and don't put any reading lists or citations in — just the claims, the table, the cruxes, and the predictions.
