          *   *HOT (Higher-Order):* Requires thoughts about thoughts. Insects definitely No.
          *   *IIT (Integrated Information):* Depends on Phi. A simple feedback loop might have Phi. Might imply Yes for simpler systems than expected, or No for distributed systems.
          *   *The Flip:* The User's view is basically RP. If GWT says Yes for insects (central complex as workspace) but User says No, there's tension. If IIT says Yes for a crab ganglion, User might have to accept that or explain why Phi isn't enough.

  5.  **Ranking the Defeaters:**
      *   *Fatal:* Empirical evidence that the proposed mechanism (recurrence for flexible control) exists in the "No" category (Insects) *and* produces behavior indistinguishable from "Yes" categories in terms of welfare/value.
      *   *Fatal:* If "flexible control" is shown to be possible without the proposed neural architecture (decentralized control), making the neural criterion arbitrary.
      *   *Awkward:* Theory divergence (GWT says Yes, User says No). This just means the User is committed to RP over GWT.
