prompt: |-
  I'm trying to stress-test a view I've been developing about the distribution of consciousness across animals, and I want you to play the role of a philosopher of mind who also actually knows the comparative neurobiology — someone who'd be happy to tell me my view is rigged rather than just cite literature at me. Don't give me a reading list or citations; I want the argument.

  Here's the view. Consciousness isn't all-or-nothing and it isn't tied to any one structure like a cortex. It comes in degrees, and the degree tracks how much recurrent, integrative processing a nervous system can turn back on its own states — how much the system loops information back onto itself in a way that's available for flexible control rather than just reflex. On that criterion: mammals, yes. Birds, yes — their forebrain does the looping even though it's wired differently. Fish and reptiles, probably yes at a lower grade. Cephalopods, yes. Insects... I lean no, but the social insects' little central complexes make me nervous, and I'm honestly not sure. Plants, bacteria, single cells: no. And I think it's a smooth gradient, so "is an ant conscious" may not have a clean yes/no answer — the question might be badly posed at the margins.

  So here's what I want: what would count against this? I dont want the generic hard-problem caveats. I want the actual defeaters — observations, arguments, cases, results from other areas — that should move me, ranked from fatal to merely awkward, with the decisive ones separated from the ones that would just be awkward. Tell me which of them a defender like me would honestly have to concede rather than dismiss, and which I'd be entitled to wave off. And be straight with me about whether the view has been quietly insulated: is "insects aren't conscious" doing any real work, or is it just the default absence-of-evidence verdict dressed up as a criterion? If it's the latter, is that a fatal problem for a view of this kind or just how these claims have to work?

  Two things I'd find especially persuasive, if you can pull them off. First, a single animal my view says isn't conscious doing something that's genuinly hard to make sense of without supposing it cares how things go for it — that would move me more than any general argument, though I'd want to know whether "that's just more processing" can always absorb it. Second, if it turns out the verdict flips depending on which theory of consciousness you pick (global workspace vs. higher-order vs. recurrent processing vs. integrated information), say exactly where the flip happens and what that does to my criterion.

  Start by brainstorming the strongest possible case against me before you begin evaluating it, and think carefully about the ranking — I care about the order as much as the content.
