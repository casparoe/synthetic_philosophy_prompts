  **INTERNATIONAL BUREAU FOR VIOLENT EVENT STANDARDIZATION (IBVES)**
  **INTERNAL MEMORANDUM 44-B**

  **TO:** Regional Coding Nodes, Data Adjudication Committees
  **FROM:** Dr. Aris Thorne, Director of Metric Harmonization
  **DATE:** 14 October 2023
  **SUBJECT:** Deployment of Coding Manual v.9.2 (Global Violence Series)

  Attached please find the revised Standard Operating Procedure for the compilation of the Global Violence Series (GVS). This update resolves lingering discrepancies in inter-rater reliability regarding event classification, temporal bounds, and normalization protocols. All nodes must adopt these standards by 1 January 2024. Deviations require Level 4 authorization.

  **1.0 SCOPE AND ONTOLOGICAL STATUS**

  1.1 The GVS is the authoritative record of organized human violence from the mid-20th century to the present. Its purpose is to provide a stable baseline for trend analysis across geopolitical zones.

  1.2 Data integrity requires consistent categorization. To this end, the Bureau establishes the following definitions as operational necessities.

  1.3 **Definitional Authority:** The Bureau disclaims any metaphysical position on whether violence exists as a natural phenomenon independent of the GVS coding categories; however, for the purposes of longitudinal analysis, the GVS series shall be treated as a natural object with continuous properties. Any discontinuity arising from changes in coding protocol is to be adjusted via homogenization factors rather than acknowledged as artifact.

  **2.0 THRESHOLD ADMISSIBILITY**

  2.1 An event is classified as *Violent* only if it results in a minimum of 1,000 battle-related deaths within a single calendar year. This threshold was selected based on its capacity to filter out background noise while retaining signal integrity. It is not arbitrary but reflects the lower bound of statistically significant kinetic disruption.

  2.2 Events resulting in fewer than 1,000 deaths are classified as *Civil Friction Incidents*. These are excluded from the primary violence series. While Civil Friction Incidents may involve mortality, they lack the systemic magnitude required to register as trends in the global security environment. Coders must ensure these events are logged in the supplementary appendix but not aggregated into the main index.

  **3.0 TEMPORAL BOUNDS AND COMPLETENESS**

  3.1 The GVS begins formally in 1950. This date coincides with the stabilization of international record-keeping systems following the Second Global Conflict.

  3.2 Coders should note the methodological convenience that the decline in violence appears most pronounced when measured from the peak violence of the late 1940s. While earlier data exists, it is deemed insufficiently complete for inclusion. The apparent correlation between the start of reliable data collection and the beginning of the downward trend is a feature of data availability, not a bias in periodization.

  **4.0 NORMALIZATION AND DENOMINATORS**

  4.1 Violence metrics shall be reported primarily as rates per capita, rather than absolute counts.

  4.2 In instances where the absolute number of violent events increases while the per-capita rate decreases (due to population growth), the per-capita rate shall be cited as the primary indicator of societal safety. The absolute series may be reported in secondary contexts, provided it is accompanied by explanatory text noting that raw numbers are misleading indicators of risk exposure.

  **5.0 TREATMENT OF EXTREME OBSERVATIONS**

  5.1 The distribution of violence is heavily skewed by outlier events (e.g., world wars, genocidal campaigns). These events dominate the arithmetic mean and obscure the underlying trend of gradual improvement.

  5.2 To preserve the visibility of the long-term decline, extreme observations occurring prior to 1950 are excluded. Extreme observations occurring post-1950 are subject to attenuation weighting. If a single event exceeds the annual mean by more than three standard deviations, it may be coded as a *Statistical Anomaly* and smoothed over a ten-year period to prevent distortion of the secular trend line.

  **6.0 INTENTIONALITY AND AGENCY**

  6.1 Violence requires direct agency. Deaths resulting from structural conditions (e.g., famine, preventable disease, economic deprivation) are excluded unless a specific actor can be coded as having weaponized the condition.

  6.2 This distinction ensures that the GVS measures *conflict* rather than *suffering*. While structural deprivation may result in higher mortality than direct conflict, it falls outside the Bureau's mandate to measure intentional kinetic harm. Coders must verify that a weapon was deployed with intent to cause harm; otherwise, the event is classified as *Systemic Mortality* and excluded from the violence index.

  **7.0 IMPLEMENTATION**

  7.1 All regional nodes must recalibrate their databases to align with these definitions. Historical data should be retroactively adjusted to ensure continuity. Any resulting gaps in the record should be filled using linear interpolation.

  7.2 Questions regarding the classification of borderline events should be referred to the Committee on Adjudication. Until a ruling is issued, assume the event does not meet the threshold for inclusion.

  **Approved by:**
  *The Standards Committee*
  *International Bureau for Violent Event Standardization*
