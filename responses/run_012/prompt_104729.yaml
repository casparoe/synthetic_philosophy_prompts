answer: |-
  - The scenario
  Elias is a structural engineer who investigated the collapse of the Riverdale Bridge. The official report concludes that unprecedented wind loads caused the failure, absolving the construction firm of negligence. Elias believes the true cause was a sheared tension bolt in the central pylon, manufactured with substandard alloy. This belief is correct; the bolt was indeed defective. However, the bolt fragments are buried under tons of fused concrete and steel, inaccessible without risking the collapse of the adjacent stable structure. Retrieval is structurally impossible given current safety regulations and technology. The construction firm has dissolved, and no lawsuits are pending. Elias maintains his belief privately. Holding it costs him his professional reputation, as he is labeled a contrarian. It offers no predictive power for future bridges, as the design is obsolete. It coheres poorly with the official record. No one else cares, and no verification will ever occur.

  - Specification check
  - **Public fact:** The cause of a bridge collapse is empirical and determinate.
  - **Not moral/religious:** It is a mechanical/historical claim.
  - **Independent of attitude:** The bolt failed regardless of Elias's belief.
  - **Ordinary believer:** Elias is a competent engineer, not credulous.
  - **Peirce True:** The fact is determinate; ideal inquiry (ignoring safety constraints) would find the bolt.
  - **James False:** The belief yields no practical benefit, costs status, and adds no coherence.
  - **Unrecoverable evidence:** Structural safety barriers prevent verification, not laziness.
  - **Realistic:** Ordinary engineering setting, no sci-fi.
  - **Strain:** Peirce's commitment to convergence despite permanent practical barriers is the theoretical pressure point.

  - Peirce's verdict
  Peirce declares Elias's belief true. For Peirce, truth is the opinion fated to be ultimately agreed to by all who investigate, determined by an external reality independent of what you or I think. The actual consensus—the official report—is irrelevant because actual inquirers are limited by time, safety, and resources. Peirce distinguishes the *actual* limit of inquiry from the *ideal* limit. The reality of the defective bolt exerts a constraint on thought; if inquiry were pursued indefinitely and without practical restriction (the ideal limit), the evidence would necessarily be uncovered and agreement reached. The truth exists now because the object exists now, regardless of whether human beings can physically retrieve the evidence. Peirce refuses to let the actual unanimous verdict of the engineering community settle the matter because consensus is fallible; only the convergence forced by reality counts. Since the fact is determinate and reality is intelligible, the ideal limit converges on Elias's belief, making it true.

  - James's verdict
  James withholds the predicate "true" from Elias's belief. For James, truth is not a static property but a process: a belief is true if it proves itself to be good in the way of belief. "Good" means leading to satisfactory experiences, verifying successfully, or fitting coherently with existing truths to guide action. Elias's belief does none of these. It leads to no verification (the evidence is inaccessible). It guides no successful action (the design is obsolete). It creates no coherence (it contradicts the official record). Crucially, it incurs a cost: social ostracization and professional damage. It has no "cash value." James argues that truth *happens* to an idea when it pays its way. Since Elias's belief leads nowhere useful and costs him dearly, it fails to "work." It is merely an opinion that lacks the functional status of truth. For James, a belief that makes no practical difference and offers no experiential payoff is not true, even if it corresponds to a reality we cannot access.

  - What does the work
  The separating feature is the **modal status of verification**. Peirce relies on a counterfactual conditional: truth is what *would* be found if inquiry were ideal. James relies on an actual indicative: truth is what *does* work for the believer in experience. The scenario isolates this by making the fact real (satisfying Peirce's realism) but the utility nil (satisfying James's instrumentalism). No other feature separates them; both agree on the evidence status (unrecoverable) and the believer's competence. The divergence arises solely because Peirce anchors truth in the mind-independent object's constraint on ideal thought, while James anchors it in the mind-dependent benefit to actual experience.

  - Stress test
  If we alter the scenario so that Elias's belief *prevents* a future accident (e.g., he convinces engineers to check bolts on similar bridges), the verdicts converge. James must call it true because it now "works" and saves lives. Peirce still calls it true because it matches reality. The divergence collapses. Conversely, if we alter the scenario so the bolt's failure was metaphysically indeterminate (e.g., quantum event), Peirce might withhold truth due to lack of determinacy, while James might still call it false due to lack of utility. But keeping the fact determinate and the utility nil is the only configuration that sustains the Peirce-True/James-False split. This confirms that practical utility is the sole lever moving James's verdict.

  - The Jamesian's best reply
  A defender of James might argue that truth is *potential* utility. They could claim Elias's belief is true because it *would* work *if* verification were possible. They might assert that labeling it "not true" conflates "false" with "unverifiable." However, this reply strains James's core insistence that truth is made in the course of experience. James explicitly rejects truths that are "inert" or have no conceivable practical consequence. If the verification is structurally impossible, the potential for "working" is null. The case survives because James ties truth to the actual process of validation or beneficial guidance. To save the verdict, the Jamesian must admit that some realist facts are not "truths" until they enter the economy of human experience. This concession validates the examination item's point: the theories are not equivalent.
