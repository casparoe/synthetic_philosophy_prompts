      *   **Value Add:** What does the story see that the technical/philosophical debate misses?
      *   **Tone:** Direct, academic but engaging, seminar-paper appropriate.

  2.  **Deconstruct the Frame Problem vs. Funes:**
      *   *The Frame Problem (Philosophical):* How does a mind determine relevance? How do we know what *doesn't* matter when processing new data? It requires a mechanism of *ignoring*.
      *   *Funes's Condition:* Hyperthymesia (perfect memory). He perceives every detail. He cannot generalize (the dog at 3:04 is not the dog at 3:05). He creates unique names for every number (7013 -> "Maximo Perez").
      *   *The Connection:* Funes fails the frame problem because he treats *everything* as relevant. He has no filter.
      *   *Static World Objection:* The prompt asks about the fact that Funes isn't really "acting" or "updating" in a dynamic environment. He is paralyzed by perception.
      *   *My Stance:* The story *is* a dramatization of the frame problem, but specifically the *ontological* precondition of the frame problem. It's not just about updating beliefs; it's about the constitution of objects through neglect. The static nature *sharpens* the analogy because it shows the problem exists even before action begins.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Thesis:** *Funes the Memorious* is not merely about memory; it is a radical dramatization of the philosophical frame problem. It argues that cognition *is* the act of ignoring. The static nature of Funes's experience sharpens the analogy rather than killing it.
      *   **Addressing the "Static" Objection:** Why does the lack of change matter? In AI, the frame problem is about action (I moved the cup, the color didn't change). In Funes, the "action" is perception itself. Every moment is a new state. Because he perceives every micro-change (moulding, clouds), he cannot frame a stable object. Therefore, he cannot act. The frame problem isn't just about updating; it's about *stabilizing* the world enough to think about it.
      *   **Abstraction vs. Frame:** The prompt asks if it's abstraction or frame. I need to argue they are the same thing here. You can't abstract without framing out the noise. Funes fails abstraction *because* he fails the frame problem.
      *   **The Narrator's Admiration:** The narrator calls Funes a "monster" but also admires his precision. This highlights the seductive danger of total fidelity. The technical debate often assumes "more data = better." Borges shows "more data = paralysis."
      *   **What the Story Sees:** The technical debate treats ignoring as an engineering hurdle (how to do it efficiently). Borges treats ignoring as an existential necessity (to be human is to forget). The "tragedy" isn't computational inefficiency; it's the loss of the world.

  4.  **Refining the Stance (The "Come Down on One Side" Constraint):**
      *   I must not say "On one hand... on the other." I must say "It is X, and here is why."
      *   *Decision:* It is a dramatization of the frame problem. The failure of abstraction is the *symptom* of the frame problem failure.
