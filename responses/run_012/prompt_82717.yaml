prompt: |-
  i'm slowly grinding through Marx's Grundrisse — the notebooks he wrote in 1857-58, the bit everyone calls the 'Fragment on Machines' — and there's a stretch near the end that I keep re-reading without it clicking. here it is, i'm skipping a couple sentences of lead-in:

  "Thus, the specific mode of working here appears directly as becoming transferred from the worker to capital in the form of the machine, and his own labour capacity devalued thereby. Hence the workers' struggle against machinery. What was the living worker's activity becomes the activity of the machine. Thus the appropriation of labour by capital confronts the worker in a coarsely sensuous form; capital absorbs labour into itself – 'as though its body were by love possessed'.

  The exchange of living labour for objectified labour – i.e. the positing of social labour in the form of the contradiction of capital and wage labour – is the ultimate development of the value-relation and of production resting on value. Its presupposition is – and remains – the mass of direct labour time, the quantity of labour employed, as the determinant factor in the production of wealth. But to the degree that large industry develops, the creation of real wealth comes to depend less on labour time and on the amount of labour employed than on the power of the agencies set in motion during labour time, whose 'powerful effectiveness' is itself in turn out of all proportion to the direct labour time spent on their production, but depends rather on the general state of science and on the progress of technology, or the application of this science to production. (The development of this science, especially natural science, and all others with the latter, is itself in turn related to the development of material production.) Agriculture, e.g., becomes merely the application of the science of material metabolism, its regulation for the greatest advantage of the entire body of society."

  what i can't get my head around is how the two halves of that second paragraph are supposed to sit together. he says the presupposition of the whole value-relation is *and remains* the mass of direct labour time as the determinant factor in the production of wealth, and then in the next breath says that as large industry develops, real wealth comes to depend less and less on labour time and more on science and technology. is that just a contradiction he didn't notice, or is 'wealth' vs 'value' doing real work there — like, is he saying wealth (actual stuff, use-values) stops tracking labour time while value (the capitalist measure of it) still does? i want to know which, and what in the wording forces it.

  second, if it's not a contradiction, what's he actually predicting? does he think automation *ends* capitalism because the measure of value breaks down underneath it, or does he think capital just keeps going and the contradiction only gets sharper? those feel like very different claims and i can't tell which one the paragraph is making.

  third, small vocab thing: 'objectified labour' vs 'living labour' — that's just machines/fixed capital vs. workers, right? and the 'contradiction' in 'the contradiction of capital and wage labour' — what's the contradiction there exactly?

  fourth, on the machinery bit: does he think machines are good (humans stop being beasts of burden) or bad (skills devalued, workers smashing looms)? the passage seems to lean one way but i might be reading my own priors into it.

  and here's the concrete thing i actually want to be able to say out loud: suppose a factory is fully automated, zero workers. does this passage commit Marx to saying its output has no value at all? or does value get 'transferred' from the machines somehow? my gut is he'd say something else entirely, but i want to know what the text actually licenses versus what's me improvising.

  lastly, two people have told me opposite things about this passage. one says it shows Marx was basically a post-work guy — automation will free us from labour. the other says no, he thought automation just tightens the screws and immiserates workers. which reading does the text support, and what in it decides? sorry this is long, i just dont want a summary of Marx, i want to actually understand this one paragraph.
