answer: |-
  This is one of the most famous and difficult passages in all of Marx's unpublished manuscripts. You are right to feel the tension in that second paragraph; it is not a slip-up, it is the engine of the whole argument.

  Here is the breakdown of what is happening in the text, anchored in the specific wording you provided.

  ### 1. Wealth vs. Value: Is it a contradiction?

  It is not a contradiction Marx failed to notice; it is **the** contradiction he is diagnosing. Your intuition is correct: "Wealth" (use-values, material stuff) and "Value" (the capitalist social form) are doing distinct work here.

  Look at the syntax:
  > *"Its presupposition is – and remains – the mass of direct labour time... as the determinant factor in the production of wealth."*

  Who does "Its" refer to? **The value-relation.**
  Marx is saying: Capitalism (*the value-relation*) *presupposes* that labour time creates wealth. Capitalism *requires* this to be true in order to function (because profit is unpaid labour time).

  Then look at the pivot:
  > *"But to the degree that large industry develops, the creation of real wealth comes to depend less on labour time..."*

  Here, "real wealth" refers to material abundance (use-values).
  **The Wording that Forces It:** The shift from "production of wealth" (in the first sentence, governed by the presuppositions of capital) to "creation of *real* wealth" (in the second sentence, governed by the physical reality of technology).

  **The Point:** Capitalism measures everything by labour time (Value). But technology makes labour time irrelevant to making stuff (Wealth). Capitalism is trying to run a 21st-century productive system with a 19th-century accounting system. The "contradiction" is that the *form* (value) is strangling the *content* (wealth).

  ### 2. The Prediction: Breakdown or Sharpening?

  Marx is not predicting a mechanical collapse (the machine stops), nor is he saying capitalism just chugs along forever. He is describing a **tendency that makes the system historically obsolete.**

  > *"The exchange of living labour for objectified labour... is the ultimate development of the value-relation... Its presupposition is – and remains – the mass of direct labour time"*

  He is saying capitalism reaches its "ultimate development" when it automates. But because capitalism *must* measure value by labour time, and automation removes labour time, capitalism undermines its own foundation.

  **Does it end capitalism?**
  The text suggests that automation makes the *law of value* explode. If wealth no longer depends on labour time, then labour time can no longer be the measure of wealth. If you can't measure wealth by labour time, you can't have wage labour or profit in the Marxist sense.
  **However**, Marx does not think this happens automatically. He implies capital will try to enforce labour time artificially (creating artificial scarcity, intellectual property, rent) to keep the value form alive. So: the *potential* for post-capitalism is created by automation, but the *reality* is a sharpening crisis where capital tries to hold back the productive forces to preserve the value relation.

  ### 3. Vocab: Objectified vs. Living & The Contradiction

  *   **Living Labour:** The worker currently working. This is the only thing that creates *new* value.
  *   **Objectified Labour:** Past labour crystallized into things (machines, raw materials, factories). This is "dead labour." It transfers its own value to the product, but creates no *new* value.

  **The Contradiction:**
  > *"What was the living worker's activity becomes the activity of the machine."*

  Capital wants to maximize profit. To compete, individual capitalists must replace workers with machines (objectified labour).
  *   **Goal:** Reduce costs, increase surplus.
  *   **Result:** You remove the only source of *new* value (the living worker).
  *   **The Contradiction:** Capital is compelled to reduce living labour to increase productivity, but living labour is the only source of the value (profit) it seeks to accumulate. It bites the hand that feeds it.

  ### 4. Are Machines Good or Bad?

  The text supports **both**, dialectically.

  **Bad (Under Capital):**
  > *"the specific mode of working here appears directly as becoming transferred from the worker to capital... and his own labour capacity devalued thereby."*
  > *"appropriation of labour by capital confronts the worker in a coarsely sensuous form"*

  Under the value relation, the machine is a weapon against the worker. It devalues their skill, makes them redundant, and appropriates their knowledge into capital ("as though its body were by love possessed" — a quote from Goethe's *Faust*, implying a demonic possession).

  **Good (Potentiality):**
  > *"depends rather on the general state of science and on the progress of technology"*
  > *"regulation for the greatest advantage of the entire body of society."*

  Marx sees the *technical capacity* of the machine as liberating. It frees humanity from "direct labour time." It allows wealth to be based on social knowledge ("general intellect") rather than sweat.

  **Verdict:** The machine is a liberator trapped in a vampire. The technology is good; the *value relation* governing it is bad.

  ### 5. The Concrete Case: The Fully Automated Factory

  This is the hardest question, and the *Grundrisse* is more radical here than *Capital Vol 1*.

  If a factory is **fully automated (zero workers)**:
  1.  **Value Transfer:** The machines (objectified labour) transfer their own depreciation value to the product.
  2.  **New Value:** Zero living labour means **zero new value created.**
  3.  **Surplus Value:** Zero.

  **Does the output have value?**
  Strictly speaking, in Marx's terms: The product contains the *transferred* value of the machines, but no *new* value. If the *entire economy* were automated, **value would cease to exist as a category.** Price might exist, but "value" (congealed social labour time) would not.

  **What does the text license?**
  > *"the creation of real wealth comes to depend less on labour time"*

  If it depends *less*, value production shrinks relative to material wealth. If it depends *not at all* (full automation), value production hits zero.
  Marx is committed to the idea that a fully automated sector cannot generate *profit* (surplus value) on its own. It lives off the surplus value extracted from sectors that still employ living labour. If all sectors automate, the rate of profit falls to zero, and the value system collapses.

  ### 6. Post-Work vs. Immiseration: Which Reading?

  Both readers are half-right, but the **Post-Work** reading is closer to the specific philosophical thrust of the *Grundrisse* (more so than *Capital*).

  **The Immiseration Reader** focuses on:
  > *"Hence the workers' struggle against machinery... his own labour capacity devalued thereby."*
  This is the *immediate* reality under capital.

  **The Post-Work Reader** focuses on:
  > *"The development of this science... is itself in turn related to the development of material production."*
  > *"regulation for the greatest advantage of the entire body of society."*

  **How to decide:**
  Look at the tension. Marx argues that automation creates the **material conditions** for post-work freedom (wealth without labour), but capitalism prevents this from being realized because it needs labour to measure value.

  > *"Its presupposition is – and remains – the mass of direct labour time"*

  Capital *forces* labour time to remain the measure, even when it's no longer the source of wealth. This creates immiseration (people forced to work even when machines could do it) to preserve the value form.

  **The Synthesis:**
  Marx is saying: Automation *should* free us (Post-Work potential). But under Capital, it impoverishes us (Immiseration reality). The contradiction becomes so sharp that the system must break to allow the potential to be realized.
  So, the text supports the Post-Work conclusion **as the resolution to the contradiction**, but acknowledges the Immiseration **as the current trajectory.**

  ### Summary for your "Out Loud" explanation:

  If you need to articulate this to someone, say this:

  "Marx isn't contradicting himself; he's identifying a crash between **Value** and **Wealth**. Capitalism measures **Value** by labour time. But **Wealth** (actual stuff) is increasingly produced by science and machines, not labour time.
  So, in a fully automated factory, **material wealth** is high, but **new value creation** is zero.
  Marx's point is that capitalism *requires* labour time to function, but its own success in automation makes labour time irrelevant. This doesn't mean capitalism ends automatically, but it means the system becomes a 'fetter'—it has to artificially restrict abundance or enforce work to keep the value-measure alive. The 'Fragment' argues that automation makes a post-work society *technically possible*, but capitalism makes it *socially impossible* until the value relation itself is abolished."
