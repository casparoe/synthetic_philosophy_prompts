answer: |-
  Your intuition is shared by many working computer scientists: the convergence of Turing machines, lambda calculus, recursive functions, and register machines on the same class of functions (the recursive functions) feels like a proof. However, the philosophers and logicians you encounter are correct on a technical point: **the Church–Turing thesis (CTT) is not a theorem, and it cannot be proved within mathematics.**

  This is not merely a verbal dispute about the label "thesis." It reflects a substantive gap between **mathematical formalism** and **physical/intuitive reality**. To understand why, and to answer your concrete questions about halting oracles and quantum computers, we must distinguish between three different versions of the thesis that often get conflated.

  ### 1. Why it is not a theorem (The Substantive Gap)

  A mathematical theorem proves a relationship between two formal definitions (e.g., "All groups of order 4 are abelian"). The Church–Turing thesis, however, asserts an equivalence between:
  1.  **A formal concept:** Turing-computable functions (or $\lambda$-definable functions).
  2.  **An informal concept:** "Effectively calculable" functions (what a human can compute following a definite method).

  You cannot prove a relationship between a formal definition and an informal intuition using only formal mathematics. The informal side lacks axioms. Turing's 1936 argument was not a proof but an **analysis**. He argued that any human "computer" (a person calculating with paper and pencil) is limited by finite states, finite symbols, and local operations. He showed that if you accept his analysis of human computation, then Turing machines capture the limit of that computation.

  **The Gap:** The gap lies in whether "effective calculability" is strictly bound to human-like procedural steps, or whether it encompasses physical processes that nature can perform but humans cannot simulate step-by-step.
  *   **The Mathematical CTT:** "The intuitive notion of an algorithm is captured by Turing machines." This is widely accepted as a definition.
  *   **The Physical CTT:** "Any function that can be physically computed by a device in our universe is Turing-computable." This is an empirical claim about physics, not a mathematical truth.

  The convergence of models (register machines, etc.) only proves that the *formal* class is robust. It does not prove that the *physical* universe is bound by that class.

  ### 2. The Halting Problem Device Scenario

  You ask: *Suppose someone built a device that decided the halting problem for ordinary Turing machines. Would that refute the Church–Turing thesis?*

  The answer depends on which version of the thesis you are testing.

  **Scenario A: The Mathematical CTT**
  If we define "effectively calculable" as "computable by an algorithm" (where an algorithm is a finite, mechanical procedure a human could follow), then building such a device **does not refute the thesis**.
  *   **Reasoning:** We would simply conclude that the device is not running an "algorithm" in the classical sense. It might be using an "oracle" or a physical shortcut that cannot be written down as a step-by-step procedure. We would categorize the device as a **hypercomputer**.
  *   **Outcome:** The class of "algorithmically computable functions" remains the Turing-computable functions. The device computes a function outside that class, so we say the device does something *more* than algorithmic computation. The thesis stands as a definition of *algorithm*.

  **Scenario B: The Physical CTT**
  If we define "effectively calculable" as "computable by any physical system in the universe," then such a device **would refute the thesis**.
  *   **Reasoning:** It would demonstrate that the laws of physics allow for the computation of non-recursive functions.
  *   **Outcome:** We would have to revise our understanding of physical computability. Most physicists suspect this is impossible (due to noise, finite energy, etc.), but it is not logically ruled out by mathematics. Some speculative general relativity models (e.g., Malament–Hogarth spacetimes) theoretically allow for hypercomputation, though they likely cannot be constructed in our actual universe.

  **Verdict:** In practice, if such a device were built, computer scientists would likely protect the Mathematical CTT by reclassifying the device as "non-algorithmic physical computation." The thesis would survive as a definition of *procedure*, but our understanding of *physics* would change.

  ### 3. Quantum Computers: Speed vs. Computability

  Your impression that quantum computers might threaten the thesis is a very common confusion. It stems from conflating the **Church–Turing Thesis** with the **Extended Church–Turing Thesis (ECTT)**.

  *   **Church–Turing Thesis (Computability):** Concerns *what* can be computed.
  *   **Extended Church–Turing Thesis (Complexity):** Concerns *how efficiently* it can be computed. It states that any reasonable model of computation can be simulated by a probabilistic Turing machine with at most polynomial overhead.

  **Standard Quantum Computers:**
  A standard quantum computer (operating within the laws of quantum mechanics as currently understood) **does not** violate the Church–Turing thesis.
  *   **Why:** Any computation a quantum computer performs can be simulated by a classical Turing machine. The simulation might take exponential time (which is why quantum computers are exciting), but it is possible. Therefore, quantum computers compute exactly the same class of functions (the recursive functions) as classical machines.
  *   **Threat:** They *do* threaten the **Extended** Church–Turing Thesis. If quantum computers can solve problems in BQP (Bounded-error Quantum Polynomial time) that are not in P (Polynomial time) for classical machines, then the claim that "all physical computers are polynomially equivalent" is false.

  **Exotic Quantum Models:**
  There are speculative models (e.g., quantum computing with infinite precision, or utilizing closed timelike curves) that *could* violate the standard CTT. However, these rely on physical assumptions (like infinite precision in measurement) that most physicists believe are impossible in the real world due to quantum noise and the Bekenstein bound.

  ### 4. Summary: What remains unsettled?

  The convergence of formal models closed the gap on the **mathematical** side. We are secure in knowing that "Turing-computable," "lambda-definable," and "general-recursive" are identical.

  The gap that remains open is **epistemological and physical**:
  1.  **Is "algorithm" a human-centric concept?** If CTT is about what *humans* can calculate, it is secure.
  2.  **Is the universe digital?** If CTT is about what *physics* allows, it is contingent. It relies on the assumption that physical laws do not permit the manipulation of continuous quantities with infinite precision or the completion of supertasks (infinite steps in finite time).

  **To close the gap:**
  To turn the Physical CTT into a theorem, one would need to derive it from fundamental physical axioms (e.g., finite information density, local causality). Robin Gandy attempted this in 1980 with "Gandy's Principles," deriving a form of CTT from physical constraints. However, since physics is empirical, any such "proof" is only as secure as our current physical theories.

  ### Conclusion

  You are right that the convergence of models makes the thesis as secure as anything in science can be. However, the philosophers are right that it is not a **mathematical theorem**.

  *   **Halting Device:** Would refute the *Physical* CTT, but likely lead us to classify the device as "non-algorithmic" to preserve the *Mathematical* CTT.
  *   **Quantum Computers:** Do not threaten the standard CTT (computability), only the Extended CTT (efficiency).

  The word "thesis" is not just caution; it acknowledges that we are bridging the gap between the abstract world of logic and the concrete world of physical reality. That bridge is supported by overwhelming evidence, but it rests on the assumption that the universe does not harbor "hypercomputational" shortcuts that defy algorithmic description.
