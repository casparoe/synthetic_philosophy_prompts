prompt: |-
  My reading group just spent three weeks on imprecise probabilities and we've ended up in a fight I can't referee, so I want you to write the argument out for me as a dialogue. Take the role of someone who knows this material from the inside — comfortable with sets of distributions, with decision rules that don't presuppose a single probability, with the standard objections in both directions — and please don't start writing straight away: spend a few lines first working out what the strongest version of each side actually is and where the real hinge of the dispute sits, because the last three attempts I've seen just had each person restate his own view louder. Two characters, roughly equal in competence, neither one a strawman, and they have to reply to each other's specific points rather than talk past each other. Don't bother with references or citations, I'm offline for the week.

  Character A is a hardline subjectivist of the de Finetti-ish sort: credence is a betting quotient, a rational agent's credence in any proposition is a definite number, and if you say your credence is an interval you're either being coy or you haven't finished thinking — an interval isn't a state of belief, it's an announcement that you don't yet have one. Character B thinks that's exactly backwards: there are evidential situations that genuinely underdetermine the number, the honest representation is a set of probabilities, and the demand for sharpness is an artefact of the mathematics rather than a norm of rationality; for decisions she reaches for something like maximality or E-admissibility — you go with an option only if no alternative beats it across the whole set, roughly — instead of one expected utility calculation. They should push each other on concrete cases rather than trade slogans: the coin of unknown bias, the Ellsberg-ish two-urn setup, what a set of probabilities is even supposed to be a set *of*, whether the interval is an epistemic state or a committee or just a bookkeeping device, and whether it's a problem for B that she can end up with genuinely undecided choices and no principled way to break the tie.

  The thing I most want them to chew on — this is what made me think the disagreement is deeper than precise versus sloppy — is something I read about called dilation. As I understand it, you can learn something that seems to have nothing to do with H, something that's independent of H under every single probability function in your set, and instead of your interval for H staying put it gets wider, sometimes I think all the way out to the whole 0-to-1 range. That looks like information making you worse off about H, which smells like a reductio on B's whole framework. But the guy who told me about it said it's more interesting than that — that it's about what conditional independence amounts to when you've got a set rather than a function, and that it has knock-on effects for whether acquiring information can even be worth it. Have them actually work through it: what dilation is, what it's supposed to show, whether it's a real cost to B or a misdescription, whether A has a mirror-image embarassment of his own (he's the one who has to put a number on everything, after all), and where the exchange should leave things. I'd also like a short closing paragraph where you step out of the dialogue and say who you think got the better of it and why, and flag anything you had to idealize to keep it readable. Maybe 900 to 1300 words, and no name-dropping as a substitute for argument.
