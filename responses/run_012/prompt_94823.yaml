answer: |-
  **The Priority Question**

  **If the proper challenge 'How do you know?' is misplaced for spokespersons, doesn't that undermine the knowledge norm itself? If knowledge isn't what licenses the assertion, why call it a knowledge norm?**
  *She will likely argue the norm remains knowledge, but the subject shifts to the group. But if the speaker lacks the epistemic position, isn't this merely a norm of entitlement based on role, rather than knowledge simpliciter?*

  1.  **How does your view square with the summativist/non-summativist debate? If group knowledge is just members' knowledge summed, doesn't the spokesperson still lack personal knowledge?**
      *She'll argue group knowledge is non-summativist; the group knows via structure, not aggregation. Yet if the structure fails and no member knows, does the group still know? If not, isn't the spokesperson's warrant fragile?*

  2.  **Does role-relativity quietly turn the norm into one of blamelessness rather than knowledge?**
      *She'll insist knowledge is the constitutive norm, blamelessness secondary. But if one can assert without personal knowledge blamelessly, isn't the knowledge norm doing no normative work?*

  3.  **When a spokesperson asserts falsely, who is blameworthy: the individual or the group?**
      *She'll suggest the group bears epistemic responsibility, the individual procedural responsibility. If the individual is blameless despite falsehood, doesn't that sever the link between assertion and truth-tracking?*

  4.  **What evidence or argument would count against your view?**
      *She might cite intuitions about inappropriate spokesperson assertions where group knowledge is absent. But couldn't those intuitions be explained by a simpler norm of reliable testimony instead?*

  5.  **You claim this explains selfless assertion. But isn't a spokesperson distinct from a scientist suppressing doubt?**
      *She'll argue both involve asserting what one's evidence supports without full belief. If the mechanisms differ (role vs. evidence), does lumping them together obscure more than it reveals?*

  6.  **Does the audience need to know the speaker's role for the norm to apply?**
      *She'll say the role fixes the norm objectively, regardless of audience uptake. But if the audience challenges 'How do you know?', and the answer is 'We know', isn't communication broken?*

  7.  **Where is the line between speaking for oneself and speaking for the group?**
      *She'll point to explicit mandates or institutional context. What about informal groups? Does any consensus create a spokesperson role?*

  8.  **If the group knows, but the spokesperson lies about it, have they violated the norm of assertion?**
      *She'll say yes, because they asserted what they didn't know the group knew. But doesn't this show the norm is actually about accurate representation of the group, not knowledge itself?*

  9.  **Does this view imply that private assertions within the group must meet a higher standard than public ones?**
      *She'll likely deny a hierarchy, suggesting context-sensitive norms. But if internal assertions require personal knowledge, isn't there a discontinuity in the group's epistemic practice?*

  10. **Finally, does role-relativity apply to other speech acts, like promising or apologising?**
      *She'll suggest it might, given institutional roles. If so, isn't this a general norm of institutional speech, rather than a specific norm of assertion?*
