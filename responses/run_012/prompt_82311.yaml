answer: |-
  This is a great angle for a paper. The tension between dispositionalism and the community view is where the real action is in Kripke's text, and your "schmplus" example actually cuts right to the heart of the indeterminacy problem. Let's argue this out without getting bogged down in citations.

  First, let's look at why Dispositionalism struggles with the original **Quus** example, because that sets the stage for why Kripke thinks we need the Community View.

  The Dispositionalist says: "To mean *plus* is just to be disposed to answer '125' when asked '68 + 57'." It sounds intuitive. You have a mental or physical setup that reacts to inputs with specific outputs.

  Kripke hits this with two main blows: **Normativity** and **Finitude**.

  1.  **Normativity:** Meaning is normative. If I mean *plus*, I *ought* to say "125." If I say "5," I made a mistake. But dispositions are descriptive. If I am disposed to say "5" (maybe I'm tired, or my brain misfires), the dispositionalist has to say, "Well, in that case, you meant *quus* (or some other function) all along." This destroys the idea of error. On the dispositional view, you can never be wrong about what you mean; you just reveal what you were disposed to do. But we know we make mistakes. We know we meant *plus* even when we slip up and calculate wrong. Dispositionalism can't distinguish between *meaning* something and *performing* according to that meaning.
  2.  **Finitude (The Quus Problem):** I have only calculated a finite number of sums in my life. My disposition is a physical state in a finite brain. Why does that physical state dictate an answer for numbers I've never encountered? A physical state is compatible with infinitely many rules. My brain state right now is compatible with *plus*, but it's also compatible with *quus* (which matches *plus* up to now but diverges later). Nothing about my disposition *forces* the *plus* outcome rather than the *quus* outcome for new cases.

  So, Dispositionalism fails because it can't account for the "ought" (mistakes) and it can't bridge the gap between finite past behavior and infinite future application.

  ### How the Community View Handles Quus

  Kripke's "Skeptical Solution" accepts the paradox: there is no "fact of the matter" about what an individual means. Instead, he shifts the ground. We don't look for truth-conditions (is it *true* that I mean plus?); we look for **assertibility-conditions** (under what conditions are we *justified* in saying he means plus?).

  The answer: **Community Agreement.**

  I am justified in saying you mean *plus* if your answers align with how the community would answer. If you say "125" for "68 + 57," and we all say "125," we accept you as a member of the rule-following club.

  Does this handle Quus better? **Yes.** It sidesteps the need for a metaphysical fact inside your head. It doesn't matter if your internal state is compatible with *quus*. What matters is that when you get to the divergence point, you answer the way we do. If you answer "5," we correct you. If you persist, we exclude you from the language game. The "normativity" comes from the social pressure of the group, not from a ghostly fact in your mind.

  ### Enter "Schmplus"

  Now, let's apply your **Schmplus** rule: *Plus* on Mon/Wed/Fri, *Quus* on Tue/Thu.

  **The Dispositionalist Explanation:**
  The dispositionalist would say: "You mean *schmplus* because you are disposed to answer according to the day of the week."
  *   **The Problem:** How do we verify this disposition? Suppose today is Monday. You answer "125" for "68 + 57." This is consistent with *plus*, *schmplus*, and *quus* (assuming the numbers are small enough).
  *   To prove you mean *schmplus*, we have to wait until Tuesday. On Tuesday, you must give the *quus* answer. But here's the kicker: How do *you* know you're following *schmplus* and not just a rule that says "Do *plus* until next Tuesday, then do *quus*, then switch back"?
  *   The Dispositionalist is stuck with the same finitude problem. Your disposition on Monday doesn't fix your behavior on Tuesday. Any finite pattern of behavior (even one that tracks days of the week) is compatible with infinitely many interpretations of how you will behave on *future* Tuesdays. The disposition doesn't contain the rule; it only contains the history.

  **The Community View Explanation:**
  The Community View says: "We check your answers against ours."
  *   If the community also follows *schmplus*, then when you give the *quus* answer on Tuesday, they nod and say, "Correct." When you give the *plus* answer on Monday, they say, "Correct."
  *   If you give the *plus* answer on Tuesday, they correct you.
  *   **Why this works better:** It doesn't require a fact about *why* you do it. It just requires that you and the group synchronize. If the group agrees that Tuesday is *quus*-day, then meaning *schmplus* is established by that agreement.

  ### Does the Community View Push the Problem Back?

  This is the million-dollar question for your paper. The short answer is: **Yes, but Kripke thinks that's okay.**

  **The Objection (Pushing it Back):**
  If no individual has a fact that determines meaning, how does a *collection* of individuals create one? If I don't know if I mean *plus* or *quus*, and you don't know, and nobody else knows... how does us all agreeing solve the mystery?
  It looks like mass delusion. If the whole community is disposed to follow *quus* but calls it *plus*, the Community View says "They mean *quus*." But intuitively, we want to say "They *think* they mean *plus*, but they're all wrong." The Community View eliminates the possibility of the whole community being wrong about their own meanings. It seems to trade the mystery of the individual for the mystery of the group.

  **Kripke's Defense (Why it stops the regress):**
  Kripke would argue that this objection assumes there *should* be a truth-condition (a fact) that we are missing. He's saying: **Stop looking for the fact.**
  The regress stops because we aren't trying to describe the world anymore; we are describing a **practice**.
  *   The "fact" of meaning is replaced by the "utility" of the practice.
  *   It is useful for us to check each other. It allows communication.
  *   The "brute fact" isn't a meaning-fact; it's the brute fact of **agreement**. We just *do* agree. That's where the language game starts.
  *   So, regarding *schmplus*: If the community agrees on *schmplus*, there is no further question of "But do they *really* mean *schmplus*?" That question presupposes the truth-conditions Kripke just rejected.

  **However, for your paper, you should press the objection.**
  Even if we accept assertibility conditions, the *schmplus* case highlights a vulnerability.
  Imagine a sub-community that follows *plus* every day, and your sub-community follows *schmplus*.
  *   On Monday, you agree.
  *   On Tuesday, you disagree.
  *   Who is right?
  *   The Community View says: "Within your group, you are right. Within theirs, they are right."
  *   This leads to a radical relativism. It makes meaning entirely local.
  *   The Dispositionalist might try to fight back here by saying: "No, there is a fact about the causal structure of our brains that aligns with the structure of arithmetic." (Kripke denies this is possible, but a realist would argue it).

  ### Summary for your Argument

  1.  **Dispositionalism fails** both *Quus* and *Schmplus* because it cannot distinguish between **mistakes** and **meaning** (normativity), and it cannot determine future application based on finite past states (finitude). Your *schmplus* rule just adds a variable (days of the week), but the disposition to track days is still just another finite behavior pattern subject to infinite interpretation.
  2.  **The Community View handles *Quus* and *Schmplus* better** pragmatically. It establishes a standard for "correctness" without needing a metaphysical fact. If the community accepts the Tuesday *quus* answer, then *schmplus* is the rule.
  3.  **The "Pushing Back" Critique:** You should argue that the Community View *does* push the problem back from the individual to the group, but Kripke's move is to deny that the problem exists at the group level *if* we abandon truth-conditions.
      *   *Your critical angle:* However, this comes at a high cost. It makes meaning **relative to the community**. If the community changes its mind on Tuesday, the meaning changes. This makes meaning unstable. Dispositionalism tries to anchor meaning in the individual's nature (which fails), while Kripke anchors it in social consensus (which succeeds pragmatically but fails to capture our intuition that meaning is something robust and truth-apt).

  **Verdict on "Which handles Schmplus better?":**
  The Community View wins on **coherence**. It can explain *schmplus* without contradiction: "We check, you match, you're in."
  Dispositionalism loses on **indeterminacy**: "You're disposed to match the day" doesn't explain *which* day-rule you're disposed to follow until you've already followed it, at which point it's too late to guide you.

  The Community View solves the guidance problem by outsourcing it. You don't need to know the rule; you just need to stay in sync with the crowd. Whether that "pushes the problem back" depends on whether you think the crowd needs a rule to follow, or if the crowd's movement *constitutes* the rule. Kripke says the latter. Your paper can argue whether that's a satisfying place to stop.
