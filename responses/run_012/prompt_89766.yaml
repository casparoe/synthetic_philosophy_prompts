prompt: |-
  Philosophy of physics prof here, and I need a handout for a seminar that keeps going in circles. There's a line that gets trotted out in every discussion of many-worlds — everything that can happen happens — and last week it got used, in the same hour, to prove two opposite things. One student deployed it to argue that Everettian QM can't make any sense of probability: if every outcome happens, then what is the Born rule even assigning a number to? Another student used the very same sentence to say the branching is all the probability we could ever need. I'm fairly sure they're both sliding between different readings of the same words, but I couldn't untangle it fast enough on my feet and now it's definately going to come up again.

  So: lay out the distinct precise claims that sentence could be making. Break it on each word — what "can" is supposed to mean here (nonzero amplitude? not forbidden by the dynamics? simply "has a branch"?), what "happens" means (occurs in some world, gets an outcome recorded, is real), and how strong "everything" is meant to be. For each reading, tell me whether it's a platitude, a substantive commitment of the Everettian picture that someone could reasonably hold, or something false that nobody should accept. Then say which readings would actually license each of my two students' conclusions, and whether either of them has a reading that's both non-trivial and true.

  Menu format, please, since I want to photocopy it. American English. And don't bother with who said it first or what's been published on it — I don't need the history, just the logic of the sentence.
