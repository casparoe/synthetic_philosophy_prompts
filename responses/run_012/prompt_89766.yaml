answer: |-
  **SEMINAR HANDOUT: DISAMBIGUATING "EVERYTHING THAT CAN HAPPEN HAPPENS"**
  **Course:** Philosophy of Physics | **Topic:** Everettian Quantum Mechanics (MWI)

  ### I. THE PROBLEM PHRASE
  *"Everything that can happen happens."*

  This slogan is frequently invoked in discussions of the Many-Worlds Interpretation (MWI). However, it is systematically ambiguous. In recent discussions, it has been used to support two contradictory claims regarding probability:
  1.  **The Incoherence Charge:** If every outcome happens, probability (the Born Rule) has no work to do.
  2.  **The Dissolution Claim:** If every outcome happens, branching *constitutes* probability (via self-locating uncertainty).

  To resolve this, we must parse the modal and ontological commitments of the sentence.

  ---

  ### II. LEXICAL DISAMBIGUATION

  **A. "Everything" (Scope)**
  *   **S1 (Logical):** All logically conceivable outcomes.
  *   **S2 (Dynamical):** All states not forbidden by the Schrödinger equation.
  *   **S3 (Support):** All components of the wavefunction with non-zero amplitude.

  **B. "Can" (Modality)**
  *   **M1 (Possibility):** Merely consistent with logic/laws.
  *   **M2 (Allowance):** Permitted by unitary evolution.
  *   **M3 (Actuality-in-Potential):** Possesses a specific measure/weight > 0.

  **C. "Happens" (Ontology)**
  *   **H1 (Existence):** Is present in the universal wavefunction.
  *   **H2 (Experience):** Is observed by a successor observer-state.
  *   **H3 (Uniqueness):** Is the *unique* actual outcome (incompatible with MWI).

  ---

  ### III. THE MENU OF READINGS

  Select the reading that matches the context of the argument. Evaluate its truth status within standard Everettian frameworks.

  #### **Reading 1: The Modal Realist Overreach**
  *   **Parsing:** [S1] + [M1] + [H1]
  *   **Claim:** "All logically possible outcomes exist in the wavefunction."
  *   **Status:** **FALSE.**
  *   **Analysis:** The dynamics constrain the wavefunction. Unicorns or violations of conservation laws do not appear in the superposition simply because they are logically conceivable. No serious Everettian holds this.

  #### **Reading 2: The Dynamical Platitude**
  *   **Parsing:** [S2] + [M2] + [H1]
  *   **Claim:** "All states allowed by unitary evolution are present in the wavefunction."
  *   **Status:** **PLATITUDE / TRIVIAL.**
  *   **Analysis:** This is just a restatement of linearity. If the dynamics allow a superposition, the superposition exists. It does not yet address probability or branching structure.

  #### **Reading 3: The Support Claim (Standard Everettian)**
  *   **Parsing:** [S3] + [M3] + [H1/H2]
  *   **Claim:** "All components of the wavefunction with non-zero amplitude correspond to real branches/observer experiences."
  *   **Status:** **SUBSTANTIVE COMMITMENT.**
  *   **Analysis:** This is the core ontological claim of MWI. Zero-amplitude branches do not exist; non-zero amplitude branches do. Crucially, this reading acknowledges that "happening" is binary (you are either in the support or not), but it does not yet specify *weights*.

  #### **Reading 4: The Measure-Ignorant Slogan**
  *   **Parsing:** [S3] + [M3] + [H2] (with implied equality)
  *   **Claim:** "All non-zero amplitude branches happen *equally*."
  *   **Status:** **FALSE (or Misleading).**
  *   **Analysis:** This is the source of the "Probability is Impossible" error. While all branches *exist*, they do not exist *equally*. They carry different Hilbert-space measures (squared amplitudes). Treating existence as a binary property without a measure over properties destroys the Born Rule.

  #### **Reading 5: The Self-Locating Uncertainty Claim**
  *   **Parsing:** [S3] + [M3] + [H2] (with indexical focus)
  *   **Claim:** "All outcomes happen, so probability is just uncertainty about which branch 'I' am on."
  *   **Status:** **SUBSTANTIVE COMMITMENT (Contested).**
  *   **Analysis:** This is the source of the "Probability is Solved" claim. It relies on the idea that objective chance is replaced by subjective self-location. This is viable *only if* one can derive why an agent should weight their bets according to the Born Rule rather than branch counting.

  ---

  ### IV. DIAGNOSTIC APPLICATION

  Use this section to identify which reading your interlocutors are using.

  #### **Student A: "Probability is Impossible"**
  *   **Argument:** If outcome X and outcome Y both happen, there is no sense in saying Y is more probable than X.
  *   **Hidden Reading:** **Reading 4 (Measure-Ignorant).**
  *   **The Slide:** They are treating "happens" as a binary property (Exists/Does Not Exist) and assuming that existence implies equal ontological weight.
  *   **Correction:** Existence is binary; *Measure* is continuous. "Everything happens" does not mean "Everything happens with equal frequency/weight." The Born Rule assigns weights to the happening, not probabilities of the happening *versus* not happening.

  #### **Student B: "Probability is Trivial/Solved"**
  *   **Argument:** Since every outcome occurs, probability is just the agent not knowing which branch they will experience.
  *   **Hidden Reading:** **Reading 5 (Self-Locating).**
  *   **The Slide:** They are assuming that the mere existence of branches automatically licenses the Born Rule weights for decision theory.
  *   **Correction:** This requires the **Epistemic Separability Principle** or a decision-theoretic derivation (e.g., Deutsch-Wallace). Merely asserting "everything happens" does not prove that rational agents must care about branches in proportion to their squared amplitude. It solves the *nature* of probability (uncertainty), but not the *quantification* of probability (why 0.99 vs 0.01?).

  ---

  ### V. VERDICT AND RECOMMENDATION

  **Is there a reading that is both Non-Trivial and True?**
  **Yes: Reading 3 (The Support Claim).**
  *   *Claim:* "Every outcome with non-zero amplitude is realized in some branch."
  *   *Truth:* True (within MWI).
  *   *Non-Trivial:* It denies collapse and asserts a specific ontology.

  **Why the Conflict Persists:**
  The conflict arises because **Reading 3** is insufficient to ground probability on its own.
  *   **Student A** correctly sees that Reading 3 lacks *weights*.
  *   **Student B** correctly sees that Reading 3 provides *outcomes* for uncertainty to operate on.

  **Seminar Rule of Thumb:**
  Ban the sentence *"Everything that can happen happens"* unless it is immediately qualified by: *"...with a measure given by the squared amplitude."* Without the measure clause, the sentence is a category error between **Ontology** (what exists) and **Measure** (how much it exists).
