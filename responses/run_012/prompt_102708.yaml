prompt: |-
  Here's a tension I keep noticing in rationalist and quant-investing writing. The same people who will tell you that the only coherent theory of choice is expected-utility maximization will also tell you to bet a fixed fraction of your bankroll — full Kelly, or more often half — and to judge a strategy by the rate at which it compounds over a long sequence of bets, treating "go all in on this positive-EV gamble" as obviously wrong. Sometimes Kelly is presented as a theorem of expected utility, just with log wealth plugged in; sometimes it's presented as a rival to expected utility, a matter of time-average rather than ensemble-average growth. What philosophical commitments does the practice of Kelly sizing actually presuppose? Does it require the claim that wealth has logarithmic value, or can a risk-averse utility function of any shape generate the same advice? Does it presuppose that the right unit of rationality is a single agent living through a long sequence of bets rather than an ensemble of agents each facing the bet once — and is the practice committed to that picture, or merely well-suited to it? And if we swapped out the presupposed view for straight expected-value maximization, what concretely would have to change about how these people size bets and what they count as a good decision?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** The user observes a conflict in rationalist/quant investing circles between Expected Utility Theory (EUT) and Kelly Criterion (growth optimality).
      *   **Specific Observations:**
          *   People claim EUT is the *only* coherent theory of choice.
          *   People advocate Kelly (or half-Kelly) sizing, rejecting "all-in on positive EV."
          *   Kelly is sometimes framed as a special case of EUT (log utility) and sometimes as a rival (time-average vs. ensemble-average).
      *   **Key Questions:**
          1.  What philosophical commitments does Kelly sizing presuppose?
          2.  Does it require logarithmic utility, or can other risk-averse functions work?
          3.  Does it presuppose a single agent through time vs. an ensemble of agents?
          4.  If we switched to straight Expected Value (EV) maximization, what would concretely change in betting/decision-making?

  2.  **Initial Analysis & Fact-Checking:**

      *   *EUT vs. Kelly:* Kelly is indeed equivalent to maximizing Expected Utility with $U(w) = \ln(w)$. So, it *is* consistent with EUT, provided you accept log utility.
      *   *Risk Aversion:* Any concave utility function implies risk aversion and leads to fractional betting (less than full Kelly for log, less than "all-in" for linear). So Kelly isn't unique in prescribing fractional betting, but it is unique in maximizing *geometric* growth rate.
      *   *Time vs. Ensemble:* This is the Ergodicity Economics argument (Ole Peters). EUT usually deals with ensemble averages (expectations across possible worlds). Kelly/Time-average deals with one path through time. This is a crucial philosophical distinction.
      *   *EV Maximization:* If you maximize arithmetic expected value (linear utility), you bet everything on any positive EV bet (independent, non-correlated, no ruin constraint). This leads to almost sure ruin in repeated settings.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. It's a real and insightful observation. State the thesis: The tension arises from conflating *normative* axioms (EUT) with *instrumental* goals (survival/growth), and from ambiguity about whether utility is over *wealth* or *outcomes*.

      *   **Question 1: Philosophical Commitments of Kelly:**
          *   It's not just math; it's about the goal.
          *   Commitment 1: Repeated play (asymptotic horizon). Kelly is optimal *in the long run*.
          *   Commitment 2: Non-ergodicity awareness. The ensemble average $\neq$ time average.
          *   Commitment 3: Utility of Wealth is Logarithmic (implicitly). If you say "maximize growth," you are saying "maximize $E[\ln(W)]$."

      *   **Question 2: Log Utility vs. Other Risk-Averse Functions:**
          *   Can other functions generate similar advice? Yes. Any concave $U(w)$ leads to fractional betting.
          *   Is Kelly unique? Yes, in that it maximizes the *rate* of growth. Other utilities might maximize something else (e.g., probability of reaching a goal, minimizing shortfall).
          *   Crucial distinction: Kelly is *myopic* (optimize each step to optimize the whole) only for Log utility. For other utilities, you need dynamic programming.
          *   So, Kelly *specifically* presupposes Log Utility (or an approximation thereof).

      *   **Question 3: Single Agent (Time) vs. Ensemble:**
          *   This is the heart of the "Ergodicity Economics" critique.
          *   Standard EUT: Ensemble average. "What happens across 1000 parallel universes?"
          *   Kelly/Ergodic: Time average. "What happens to me over 1000 days?"
          *   Does Kelly *require* this? Mathematically, no (it's just Log EUT). Philosophically, yes, if you justify it via "growth rate" rather than "risk preference."
          *   The "Rationalist" pivot: Many rationalists use the Time-Average argument to justify Log Utility without admitting it's a utility assumption. They frame it as "objective reality" (ergodicity) rather than "subjective preference" (utility).

      *   **Question 4: Switching to Straight EV Maximization:**
          *   What changes concretely?
