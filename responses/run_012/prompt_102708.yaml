answer: |-
  This is a sharp observation that cuts to the core of a often-unexamined friction in decision theory. The tension you identify arises because the "rationalist" and quant communities often conflate three distinct layers: **axiomatic coherence** (EUT), **instrumental survival** (Kelly), and **ontological claims about probability** (Ergodicity).

  Here is a breakdown of the philosophical commitments Kelly sizing presupposes, how it relates to utility functions and time, and what would change under straight expected-value (EV) maximization.

  ### 1. Does Kelly require logarithmic utility?
  **Yes, specifically.**

  Mathematically, the Kelly Criterion is exactly equivalent to maximizing Expected Utility where $U(w) = \ln(w)$. If you maximize the expected value of the logarithm of wealth, you maximize the geometric growth rate.

  However, your question asks if *any* risk-averse utility function generates the same advice. The answer is **qualitatively yes, quantitatively no.**
  *   **Qualitatively:** Any concave utility function ($U'' < 0$) implies risk aversion. If you have a concave utility function, you will generally reject "all-in" bets on positive EV gambles if the risk of ruin is non-zero, because the marginal utility of the next dollar is lower than the disutility of losing the current dollar. So, fractional betting is a property of risk aversion generally, not just Kelly.
  *   **Quantitatively:** Kelly is unique. It is the *only* utility function that makes the optimal betting fraction **myopic**. With log utility, the optimal bet size today depends only on the current odds and bankroll, not on how many bets remain or what your future income might be. With any other concave utility (e.g., $U(w) = -e^{-aw}$ or $U(w) = w^{0.5}$), the optimal bet size depends on your investment horizon and future opportunities.

  **Philosophical Commitment:** By using Kelly (or half-Kelly) without explicitly defending a logarithmic preference for wealth, practitioners are implicitly committing to the claim that **wealth is instrumentally valuable only insofar as it generates future betting opportunities.** Log utility is the mathematical expression of "I want to stay in the game as long as possible to compound."

  ### 2. Time-Average vs. Ensemble-Average (The Ergodicity Question)
  This is the most significant philosophical pivot in recent rationalist discourse (championed by Ole Peters and others).

  *   **The Standard EUT View (Ensemble):** Rationality is defined by consistency across parallel possible worlds. If I face a bet, I should ask, "What is the average outcome if this bet were played by 1,000 versions of me simultaneously?" If the EV is positive, a linear utility maximizer bets everything. Ruin in some branches is acceptable if the average wealth across the ensemble is high.
  *   **The Kelly/Ergodic View (Time):** Rationality is defined by the trajectory of a single agent through time. "What happens to *me* if I take this bet 1,000 times sequentially?" In multiplicative dynamics (investing), the ensemble average is dominated by rare, huge winners, while the time average (what you actually experience) is determined by the geometric mean.

  **Does Kelly presuppose the Time-Average picture?**
  *   **If justified via Log Utility:** No. You can stay in the Ensemble picture. You simply claim, "I happen to have logarithmic preferences." This treats risk aversion as a subjective taste, like preferring chocolate to vanilla.
  *   **If justified via Growth Optimality:** Yes. When quant writers say "all-in is obviously wrong" because you will go bust, they are invoking the Time-Average. They are claiming that **ergodicity breaking** makes the ensemble average irrelevant for a single agent.

  **The Tension:** The community often wants to have it both ways. They use EUT to debunk inconsistent preferences (e.g., Allais paradox) but switch to Time-Average arguments to debunk EV maximization (e.g., St. Petersburg paradox or leveraged ETFs). This suggests their commitment is not to EUT *per se*, but to **non-ruin**. They treat "not going to zero" as a hard constraint rather than a utility preference.

  ### 3. What if we switched to Straight EV Maximization?
  If a quant or rationalist truly switched to maximizing Arithmetic Expected Value (linear utility of wealth, $U(w) = w$) without a "no-ruin" constraint, the concrete changes would be drastic:

  1.  **Bet Sizing:** You would bet 100% of your bankroll on any gamble with positive EV, provided the bets are independent and you can recover from zero (or the game ends at zero). In a sequence of positive EV bets, the "all-in" strategy yields the highest *expected* final wealth (arithmetic mean), even though the *median* final wealth goes to zero.
  2.  **Diversification:** You would not diversify unless correlation reduced the EV. You would concentrate entirely on the single asset with the highest expected return. Diversification is a tax on EV paid for variance reduction; an EV maximizer doesn't care about variance.
  3.  **Decision Criteria:** You would accept gambles that have a 99.9% chance of total ruin if the 0.1% payoff is large enough to make the EV positive. (e.g., A 1 in 1 million chance to win 10 million times your stake).
  4.  **Stopping Rules:** You would never stop playing a positive EV game until you physically could not bet more. There is no "taking profit."
  5.  **Valuation of Options:** You would value options solely on their discounted expected payoff, ignoring the "value of information" or the "optionality to wait" unless those factors directly increased the immediate arithmetic EV.

  **Why don't they do this?** Because in the real world, wealth is not infinitely divisible, and "zero" is an absorbing state. Once you hit zero, you cannot place the next positive EV bet. EV maximization assumes you can borrow against future parallel selves; Kelly assumes you are a single thread through time.

  ### 4. Resolving the Tension: What is the actual commitment?
  The practice of Kelly sizing (specifically Half-Kelly) in the rationalist/quant community presupposes a hybrid philosophical view that is rarely stated explicitly:

  1.  **Instrumental Convergence:** We don't actually care about utility functions; we care about **agency preservation**. To be a rational agent in the future, you must exist in the future. Log utility is a proxy for "probability of survival."
  2.  **Epistemic Humility (Half-Kelly):** Pure Kelly assumes you know the true probabilities and edge. Half-Kelly is a heuristic for **parameter uncertainty**. It acknowledges that while EUT is the *theory*, our *estimates* of EV are noisy. Overestimating edge leads to overbetting, which reduces geometric growth faster than underbetting.
  3.  **The "Shut Up and Multiply" Limit:** They use EV maximization for small, non-existential decisions (where linear utility is a good approximation) and Kelly for large, portfolio-level decisions (where multiplicative dynamics dominate).

  **Conclusion:**
  The tension exists because "Expected Utility" is being used as a label for two different things.
  1.  **Normative EUT:** A framework for consistency of preferences.
  2.  **Descriptive EUT:** A tool for calculating growth.

  When they say "only EUT is coherent," they mean #1. When they say "don't go all-in," they are relying on #2 combined with an implicit **Log Utility of Wealth** derived from the **Time-Average** necessity of survival.

  If they were truly consistent with straight EV maximization, they would be leveraged to the hilt on the highest variance crypto asset available, accepting a near-100% probability of ruin for the sake of maximizing the arithmetic mean of the ensemble. The fact that they don't do this proves that their actual philosophical commitment is not to Expected Value, but to **Ergodicity**: they are optimizing for the path they will actually walk, not the average of the paths they could have walked.
