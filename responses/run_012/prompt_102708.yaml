          *   Ruin: You go bust with probability 1 in repeated games.
          *   Decision Criterion: You ignore variance entirely. A 1% chance to win 1000x is better than a 99% chance to win 2x (if EV is higher).
          *   Portfolio: Extreme concentration. No diversification unless correlation reduces EV (which it usually doesn't in simple EV models).
          *   Real-world constraint: You need a "stop" condition (e.g., I only need \$10M). Once reached, EV maxing stops. But before that, it's all-in.

      *   **Synthesizing the Tension (The "Rationalist" Context):**
          *   Why the inconsistency?
