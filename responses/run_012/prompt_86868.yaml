prompt: |-
  I am a novelist, and the book I am writing turns on a character who never utters a falsehood and nevertheless ruins a friend's life by what she lets her listeners infer. I have spent a year reading in the philosophy of deception and keep meeting the same question — whether lying is worse than misleading, and why — answered in ways that do not help me write her. What I want instead is an agenda: which open questions about the distinction between lying and misleading would genuinely change how a character like hers is written and judged, ranked, with the ranking defended. Assume a year of my time, no appetite for disputes that turn out to be terminological, and nothing I could use only if I had a philosophy library to hand.

  Here is the working view you may push back on before ranking anything. On my account an utterance misleads only if the speaker relies on an inference the hearer is entitled to draw given the shared norms of the conversation; call this the entitlement condition. The questions I want ordered are the ones upstream of it: whether entitlement is fixed by convention, by the speaker's design, or by what a reasonable hearer would infer; whether misleading requires intent, and what it is to intend an inference rather than merely foresee it; where the paltering case — true statements arranged to produce a false impression — belongs, with lying, with misleading, or in a third class; whether the supposed moral gap between lying and misleading survives once consequences, breach of trust, and entitlements are held fixed; and whether the distinction marks anything in the world or only in our vocabulary.

  Rank them by how much each would change the writing — which would alter what the reader takes to be her crime, which would alter her own self-justification, which would alter nothing but my prose — and say plainly which criteria you are using, where those criteria pull against one another, and what argument or example would move a question up or down the list. If I have left out a question that should outrank all of these, put it first and tell me why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book about a character who never lies but ruins a friend's life via misleading inferences.
      *   **Problem:** Philosophical literature on lying vs. misleading is too abstract/terminological to help characterization.
      *   **Goal:** An agenda of open questions about the lying/misleading distinction, ranked by their impact on *writing the character* (crime, self-justification, prose).
      *   **Constraints:**
          *   Assume a year of the user's time (deep dive).
          *   No appetite for purely terminological disputes.
          *   No need for a philosophy library (accessible concepts).
          *   Must critique/rank based on specific criteria (impact on crime, self-justification, prose).
          *   Must address the user's "working view" (Entitlement Condition).
          *   Must identify if a crucial question is missing and rank it first.
      *   **Tone:** Professional, direct, literary-philosophical, practical.

  2.  **Deconstruct the User's "Working View":**
      *   *Definition:* Misleading relies on an inference the hearer is *entitled* to draw given shared norms.
      *   *Implication:* This shifts the moral weight from the speaker's intent to the social contract between speaker and hearer.
      *   *Critique:* This is a strong starting point for a novelist because it creates tension between *technical truth* and *social truth*. However, it risks being too static. "Entitlement" is fluid.

  3.  **Brainstorming the Questions (based on user's list + potential missing ones):**
      *   Q1: Source of Entitlement (Convention vs. Design vs. Reasonableness).
      *   Q2: Intent vs. Foresight (Do I need to *want* the inference or just *know* it will happen?).
      *   Q3: Paltering (True statements, false impression - where does it fit?).
      *   Q4: Moral Gap (Is it actually worse to lie if consequences/trust are identical?).
      *   Q5: Ontological Status (Is the distinction real or just vocabulary?).
      *   *Missing Q:* The question of *Care* or *Responsibility for the Other's Mind*. (Why did she let them infer? Was it malice, indifference, or a twisted sense of virtue?)

  4.  **Developing Ranking Criteria:**
      *   **Criterion A: The Nature of the Crime.** How does the reader judge her? (Villain, tragic flaw, anti-hero?)
      *   **Criterion B: The Character's Interiority.** How does she justify herself to herself? (Delusion, rigor, malice?)
      *   **Criterion C: Dramatic Tension/Prose.** How does this play out in scenes? (Dialogue, subtext, pacing?)
      *   *Priority:* A > B > C. (Plot/Theme > Character > Style).

  5.  **Evaluating and Ranking the Questions:**

      *   *Missing Question:* **The Question of Care/Responsibility.** (Does she owe the friend the truth, or just non-falsehood?) This determines the *relationship* dynamic. If she owes care, she's cruel. If she owes only accuracy, she's principled. This is fundamental. *Rank: 1.*

      *   *Q2 (Intent vs. Foresight):* If she *intends* the inference, she's manipulative. If she merely *foresees* it and allows it, she's passive-aggressive or negligent. This changes her agency. *Rank: 2.*

      *   *Q1 (Source of Entitlement):* If entitlement is conventional, she broke a rule. If it's based on her design, she set a trap. This changes the *mechanism* of the betrayal. *Rank: 3.*

      *   *Q4 (Moral Gap):* Does the reader feel the distinction matters? If the gap collapses, she's a liar by another name. If the gap holds, she's a tragic figure bound by code. *Rank: 4.*

      *   *Q3 (Paltering):* This is a subset of the main action. It's technical. *Rank: 5.*

      *   *Q5 (Ontological Status):* Too meta. Doesn't change the story, only the author's thesis. *Rank: 6.*

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the "Entitlement Condition." It's a great hook.
      *   *The Missing Question:* "The Duty of Care." Why is this #1? Because it defines the friendship. Without this, the rest is semantics.
      *   *Ranking the User's Questions:*
          *   *Intent vs. Foresight:* Crucial for *mens rea* (guilty mind). Is she active or passive?
          *   *Source of Entitlement:* Defines the *setting* of the betrayal. Is society against her, or is she against society?
          *   *Moral Gap:* Determines the *theme*. Is the book about the failure of language or the failure of people?
          *   *Paltering:* Specific tactic. Good for scenes, less for arc.
          *   *Ontology:* Writer's worry, not character's worry.
      *   *Critique of Working View:* The "Entitlement Condition" is good but needs to be dynamic. Entitlement shifts with intimacy.
      *   *Criteria Explanation:* Be explicit about Crime, Justification, Prose.
      *   *Moving the Needle:* Give examples of what changes the rank (e.g., if the friend is vulnerable, Intent moves up).

  7.  **Refining the Tone:**
      *   Avoid academic jargon where possible.
      *   Focus on *narrative consequence*.
      *   Be decisive. The user asked for a ranking, not a maybe.
      *   Ensure the "year of time" constraint is respected (don't suggest reading lists, suggest thinking experiments).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Entitlement Condition"? Yes, in the critique.
      *   *Check:* Did I rank them? Yes.
      *   *Check:* Did I explain the criteria? Yes.
      *   *Check:* Is the missing question truly superior? Yes, because "Duty" precedes "Violation." You can't violate an entitlement if you don't owe a duty.
      *   *Check:* Is the distinction between "Intent" and "Foresight" clear for a novelist? Use the concept of "aiming" vs. "allowing."

  9.  **Final Polish:** Ensure the distinction between "Crime" (Reader's view), "Justification" (Character's view), and "Prose" (Execution) is clear in every ranking explanation. (Proceed to generate output).

  *(Self-Correction Note)*: Wait, I need to make sure I don't just say "Duty of Care" but frame it as a question about the *limits of linguistic obligation*. The question is: *Does intimacy create an obligation to clarify, overriding the right to remain literally truthful?* This is more specific to the lying/misleading dynamic.

  Let's refine the Missing Question: **The Question of Collaborative Truth.** Is conversation a cooperative game where the goal is shared understanding, or a competitive game where the goal is self-protection? This frames the "Entitlement" better. Let's call it "The Telos of Conversation."

  Actually, "The Duty of Care" is more emotionally resonant for a novelist. Let's stick with that but frame it philosophically: *Does the relationship impose a duty to rescue the hearer from error?*

  Okay, let's finalize the ranking.
  1. Missing: Duty to Rescue/Clarify.
  2. Intent vs. Foresight.
  3. Source of Entitlement.
  4. Moral Gap.
  5. Paltering.
  6. Ontology.

