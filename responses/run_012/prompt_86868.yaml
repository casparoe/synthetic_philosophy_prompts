answer: |-
  This is a precise and demanding brief. You have correctly identified that the philosophical literature often stalls on taxonomy when you need mechanics of human interaction. Your "Entitlement Condition" is a robust working thesis; it moves the debate from the speaker's mouth to the space between the speakers. That is where the novel lives.

  However, your list misses the prerequisite question that makes the entitlement matter. Before we ask *how* entitlement is fixed, we must ask *why* it exists.

  Here is the ranking of questions, including the missing one, ordered by their capacity to alter the novel's moral architecture, the character's psychology, and the texture of the prose.

  ### The Criteria
  I am ranking these based on three tiers of narrative impact:
  1.  **The Verdict (Crime):** How the reader ultimately judges her. Is she a villain, a tragic figure, or a misunderstood rigorist?
  2.  **The Voice (Justification):** How she explains herself to herself. Is she deluded, principled, or malicious?
  3.  **The Texture (Prose):** How the dialogue and subtext are rendered on the page.

  *Note on Conflict:* These criteria often pull against one another. A question that clarifies her *Justification* might muddy the *Verdict*. I have prioritized the **Verdict**, as the reader's judgment is the engine of your plot's resolution.

  ---

  ### 1. The Missing Question: The Duty to Rescue
  **Question:** *Does intimacy impose a positive duty to correct a known false inference, even if one did not create it?*

  **Rank:** First (Outranks all others).
  **Why:** This is the upstream condition for your "Entitlement Condition." If there is no duty to rescue a friend from error, your character has committed no crime; she has merely exercised a right to silence. If there *is* a duty, her silence is an act of aggression.

  *   **Impact on Verdict:** If the answer is **Yes**, she is a betrayer. She watched her friend walk off a cliff and didn't shout. The novel becomes a tragedy of omission. If the answer is **No**, she is a martyr to truth in a world that demands comfort. The novel becomes a conflict between individual integrity and social coercion.
  *   **Impact on Justification:** If **Yes**, her self-justification must be complex (e.g., "They needed to learn this the hard way," or "I owed the truth more than I owed them"). If **No**, her justification is simple ("I said nothing false").
  *   **Impact on Prose:** If **Yes**, scenes must highlight her *awareness* of the friend's error in real-time. We need to see her biting her tongue. If **No**, scenes can be more detached; she is simply stating facts.
  *   **What moves this up/down:** This question cannot move down; it is foundational. However, the *degree* of duty changes based on the friend's vulnerability. If the friend is a child or dependent, the duty is absolute. If the friend is a rival, the duty vanishes. You must fix the power dynamic of the friendship to answer this.

  ### 2. Intent vs. Foresight (The Mens Rea)
  **Question:** *Is it misleading to merely foresee a false inference, or must one actively intend it?*

  **Rank:** Second.
  **Why:** This determines her agency. It distinguishes between a sniper and a landmine.

  *   **Impact on Verdict:** If **Intent is required**, and she only *foresaw* the inference, she is negligent rather than malicious. The reader may forgive her. If **Foresight is sufficient**, she is complicit. She saw the fire and handed them a match.
  *   **Impact on Justification:** If **Intent**, she can tell herself, "I didn't make them think that; they did." If **Foresight**, she must admit, "I knew it would happen, and I spoke anyway."
  *   **Impact on Prose:** If **Intent**, her dialogue must be crafted to trigger specific associations (active manipulation). If **Foresight**, her dialogue can be blunt and literal, with the narrative carrying the weight of the consequence (passive cruelty).
  *   **What moves this up/down:** This moves up if you want the book to be a psychological thriller (focus on manipulation). It moves down if you want it to be a philosophical drama (focus on the nature of truth).

  ### 3. Source of Entitlement (The Rules of the Game)
  **Question:** *Is the hearer's entitlement fixed by social convention, the speaker's design, or reasonable expectation?*

  **Rank:** Third.
  **Why:** This defines the arena of the conflict. It tells us who is breaking the rules: her, or the world.

  *   **Impact on Verdict:** If **Convention**, she violated a social contract. She is a bad friend. If **Speaker's Design**, she set a trap. She is a schemer. If **Reasonable Expectation**, the world is ambiguous. She is a victim of miscommunication.
  *   **Impact on Justification:** If **Convention**, she can argue, "I never agreed to those norms." If **Design**, she has no justification other than success.
  *   **Impact on Prose:** If **Convention**, dialogue relies on idioms and implicatures everyone knows. If **Design**, dialogue is idiosyncratic, coded, unique to her.
  *   **What moves this up/down:** This moves up if the setting is a closed society (e.g., a cult, a courtroom, a high-society circle) where conventions are rigid. It moves down in a chaotic, modern setting where norms are fluid.

  ### 4. The Moral Gap (The Stakes)
  **Question:** *If consequences and breach of trust are identical, is lying still worse than misleading?*

  **Rank:** Fourth.
  **Why:** This is the thematic core, but it matters less to the plot than the mechanics of *how* she did it.

  *   **Impact on Verdict:** If **Yes (Gap survives)**, she retains a sliver of moral superiority. She didn't *lie*. The reader feels the tragedy of a technical virtue failing to save a soul. If **No (Gap collapses)**, she is a liar in all but name. The reader feels the hypocrisy.
  *   **Impact on Justification:** If **Yes**, she clings to "I never lied" as a shield. If **No**, she must find a different shield (e.g., "They couldn't handle the truth").
  *   **Impact on Prose:** If **Yes**, the prose must highlight the literal truth of her statements. If **No**, the prose should blur the line, making her statements feel like lies even when they aren't.
  *   **What moves this up/down:** This moves up if the climax involves a confrontation where she defends her integrity. It moves down if the climax is purely about the damage done, regardless of method.

  ### 5. Paltering (The Tactic)
  **Question:** *Where does paltering (true statements arranged to produce a false impression) belong: with lying, misleading, or a third class?*

  **Rank:** Fifth.
  **Why:** This is a subset of Question 2 (Intent). It is a tactic, not a principle.

  *   **Impact on Verdict:** Minimal. It's a specific way to execute the misleading.
  *   **Impact on Justification:** It offers a specific line of dialogue: "Every word I said was true."
  *   **Impact on Prose:** High impact on specific scenes. It requires careful construction of dialogue.
  *   **What moves this up/down:** It moves up if the "ruining" of the friend's life hinges on a specific sequence of statements (a trial scene, a breakup). It moves down if the ruin is cumulative over years.

  ### 6. Ontological Status (The Meta-Question)
  **Question:** *Does the distinction mark anything in the world or only in our vocabulary?*

  **Rank:** Sixth (Last).
  **Why:** This is a question for the author, not the character. The character lives in the world; she does not analyze the vocabulary unless she is a philosopher (which risks making her wooden).

  *   **Impact on Verdict:** None. The reader judges actions, not metaphysics.
  *   **Impact on Justification:** Only if she is self-aware enough to question language itself.
  *   **Impact on Prose:** Low. It might influence the narrative voice, but not the dialogue.
  *   **What moves this up/down:** Only if you are writing a postmodern novel where language itself is the antagonist. In a character-driven drama, this is a distraction.

  ---

  ### Critique of Your Working View
  Your **Entitlement Condition** ("an utterance misleads only if the speaker relies on an inference the hearer is entitled to draw") is strong, but it contains a hidden trap for a novelist.

  **The Trap:** "Entitlement" sounds static. In a friendship, entitlement is dynamic.
  *   **The Fix:** You must treat entitlement as a **currency that is spent**.
      *   *Early in the book:* The friend is entitled to generous inferences. If the character misleads here, it is a betrayal.
      *   *Late in the book:* Trust has eroded. The friend is no longer entitled to generous inferences. If the character misleads here, it is self-defense.
  *   **Why this matters:** If you treat entitlement as fixed by convention, your character looks like a sociopath from page one. If you treat it as fluid based on the relationship's history, her descent (or ascent) becomes the plot.

  ### A Year's Agenda
  Since you have a year, do not read more philosophy. Instead, run these three experiments to lock in the ranking above:

  1.  **The "Omission" Test (For Question 1):** Write a scene where your character sees her friend misunderstand something *without* the character speaking at all. Does she correct it? If she doesn't, you have your answer on the Duty to Rescue. This defines her soul.
  2.  **The "Script" Test (For Question 2):** Write the same dialogue twice. In Version A, she *wants* the friend to infer the falsehood. In Version B, she *fears* the friend will infer it but speaks anyway. Which version feels more like your book? This defines her agency.
  3.  **The "Verdict" Test (For Question 4):** Show the draft to three readers. Ask them: "Did she lie?" If they say yes, the Moral Gap has collapsed for your audience. You must decide if you want to fight that intuition or lean into it.

  **Final Argument:**
  If I could move one question to the top, it is the **Duty to Rescue**. Everything else is mechanics; this is morality. If she owed the friend clarity, she is a murderer of reputation. If she owed only accuracy, she is a saint of syntax. That is the novel.
