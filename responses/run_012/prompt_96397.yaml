answer: |-
  The moral distinction between lying, misleading, and selection collapses when the agent's intent is to induce a false belief. The locus of wrongness in communication is not the linguistic vehicle used—whether a false assertion, a true statement with false implicature, or a curated subset of truths—but the intentional subversion of the listener's epistemic autonomy. When a speaker manipulates any of these channels to ensure a listener forms a belief the speaker knows is incorrect, the moral injury is identical: the listener has been treated as a means to an end rather than a partner in the exchange of information. The standard defense of the lying/misleading distinction relies on the norm of assertion, arguing that lying breaks a constitutive rule of communication while misleading merely exploits pragmatic inferences. However, the existence of "selection" (often called paltering or strategic omission) exposes this defense as a loophole rather than a moral boundary. If a hiring manager can destroy a candidate's prospects by truthfully selecting only negative facts, achieving the exact same deceptive outcome as a lie without technically violating the norm of assertion, then the norm of assertion cannot be the primary source of moral value. The wrong is not in breaking a rule of grammar or logic; it is in breaking the trust required for cooperative inquiry.

  This equivalence holds even when we consider the auditability of the act. A lie leaves a forensic trace: a false statement that can be contradicted by evidence. Selection leaves no such trace because every individual statement is true. One might argue this makes selection less morally culpable because it does not "cash in" on the specific trust placed in explicit assertions. This is incorrect. The lack of auditability makes selection morally worse, not better, because it compounds the initial deception with immunity from correction. When you lie, you invite the listener to verify your claim; when you select, you rig the verification process itself. The listener cannot point to a false sentence and say, "You lied," because you have structured the environment so that the truth itself leads to a false conclusion. This unaccountability aggravates the moral wrong because it undermines the listener's ability to restore their own epistemic position. The harm to autonomy is deeper when the listener is deprived not just of the truth, but of the tools to recognize they have been deceived.

  The role of convention further clarifies why the mechanism matters less than the intent. If a community shares a convention—such as understanding that letters of recommendation contain only true positives—then faint praise ("He was always punctual") is not deceptive because the listener possesses the key to decode the message. In this scenario, the speaker has not undermined autonomy because the listener has fair warning about the selective nature of the communication. The moral wrong vanishes not because the act is selection rather than lying, but because the intent to deceive is absent or the listener has consented to the filtering process. However, if the speaker relies on the listener ignoring this convention, or if the framing is set by a stakeholder rather than a neutral process, the deception returns. A neutral process might mitigate the suspicion of intent, but it does not absolve the agent if they manipulate the inputs to that process. The moral joint is not between lying and misleading, but between transparent manipulation (where the listener knows the rules of the game) and opaque manipulation (where the listener is kept in the dark about the selection bias).

  Ultimately, preserving the lying/misleading distinction in the face of selection requires valuing the form of communication over its function. If ethics is concerned with how we treat one another, then the method used to distort another person's reality is secondary to the fact that the distortion was intended. Selection proves that one can be perfectly truthful and profoundly deceptive. Therefore, the distinction does not survive; all three practices are morally equivalent instances of deception when deployed to induce false belief, and they are only distinguishable by the ease with which they can be policed. We should judge the speaker not by whether their sentences are false, but by whether they have respected the listener's right to form beliefs based on an unrigged presentation of reality.
