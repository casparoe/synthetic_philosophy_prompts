answer: |-
  Here is the specification you requested. It is framed not as a philosophical argument, but as a set of conditions of adequacy. Any theory claiming to justify paternalistic interference must satisfy these constraints to be actionable in policy.

  ### I. The Desiderata

  **1. The Ends Alignment Condition**
  *   **Requirement:** The theory must distinguish between interventions that help an agent secure ends they already hold (instrumental paternalism) and interventions that substitute the intervener's ends for the agent's (substantive paternalism).
  *   **Case/Consideration:** A default option that enrolls employees in a pension scheme assumes the end "financial security in retirement" is shared. A default option that enrolls citizens in a specific religious charity assumes an end they may not hold. An adequate theory must justify why the former is permissible while the latter is not, without relying solely on the popularity of the end.

  **2. The Mechanism Transparency Condition**
  *   **Requirement:** The theory must classify interventions by their mechanism of action: coercion (removing options), pricing (altering costs), architecture (altering friction), or epistemic manipulation (altering beliefs/salience). It must provide a justification specific to the mechanism, not just the outcome.
  *   **Case/Consideration:** A sugar tax (price) and a calorie label (information) may produce the same reduction in consumption. A theory that justifies the tax but not the label (or vice versa) must explain why the *mechanism* matters morally, independent of the health outcome.

  **3. The Harm Boundary Condition**
  *   **Requirement:** The theory must rigorously separate interventions justified by the agent's own good from those justified by harm to others or public offense.
  *   **Case/Consideration:** Mandatory motorcycle helmets are paternalistic (self-harm). Mandatory isolation during a contagious outbreak is not (harm to others). A theory that collapses these justifications fails to protect the liberal presumption against interference. The verdict must not depend on the magnitude of harm alone, but on the *recipient* of the harm.

  **4. The Competence Continuum Condition**
  *   **Requirement:** The theory cannot rely on a binary distinction between "competent" and "incompetent." It must account for the continuum of capacity, specifically addressing:
      *   The competent adult who knowingly and repeatedly chooses what is bad for them (stable preference).
      *   The competent adult who says they wish they could stop (conflicted preference/second-order volition).
      *   The adult for whom the presumption of competence fails outright (clinical incapacity).
  *   **Case/Consideration:** Interfering with the "stable preference" smoker requires a different justification (e.g., welfare objective) than interfering with the "regretful" smoker (e.g., agency facilitation). A theory that treats them identically ignores the moral weight of autonomy.

  **5. The Agency Source Condition**
  *   **Requirement:** The theory must specify whether the moral status of an intervention depends on the identity of the intervener (State vs. Private Actor).
  *   **Case/Consideration:** A shopkeeper rearranging shelves to maximize profit (placing candy at eye level) creates the same choice architecture as a state regulator rearranging shelves to maximize health. If the theory condemns one but permits the other, it must identify the relevant difference (e.g., democratic accountability, exit options, monopoly power). If it treats them the same, it must explain how private paternalism is regulated.

  **6. The Publicity Condition**
  *   **Requirement:** The justification for the interference must be statable openly to the person governed without defeating the purpose of the intervention.
  *   **Case/Consideration:** If a nudge relies on a cognitive bias (e.g., framing effects) that ceases to function once the bias is pointed out, the theory must determine if this renders the nudge impermissible. A theory that permits "noble lies" or hidden architectures must explain why the agent's right to know the reasons for their constraint is overridden.

  **7. The Empirical Durability Condition**
  *   **Requirement:** The justification must be contingent on the empirical reality of the intervention's effect size, heterogeneity, and durability over time.
  *   **Case/Consideration:** An intervention that shows a 5% behavior change in a 6-week pilot but decays to 0% in 6 months, or works only for a specific demographic while harming another, cannot be justified by a theory that assumes stable, homogeneous effects. The moral cost of interference must be weighed against the *actual* sustained welfare gain, not the *potential* gain.

  ***

  ### II. Negotiability and the Primary Excluder

  **Negotiable Requirements:**
  *   **The Agency Source Condition:** It is possible to construct a coherent theory where the morality lies entirely in the *impact on liberty*, regardless of whether the restrictor is the State or a corporation. While politically significant, this is not theoretically fatal if a theory treats all power centers equally.
  *   **The Mechanism Transparency Condition:** A strictly consequentialist theory might argue that only outcomes matter, rendering the mechanism (tax vs. nudge) morally neutral. This is a defensible, if controversial, position.

  **Non-Negotiable Requirements:**
  *   **The Ends Alignment Condition:** Without this, "paternalism" dissolves into "social engineering." If a theory cannot distinguish between helping you get what you want and making you want what the state wants, it has no boundary.
  *   **The Competence Continuum Condition:** A binary model is empirically false and morally crude. Any theory ignoring the "regretful actor" vs. "contented actor" distinction will fail to capture the core tension of autonomy.
  *   **The Empirical Durability Condition:** A justification for interference that ignores whether the interference *works* is not a justification for policy; it is ideology.

  **The Single Requirement That Does The Most Work:**
  **The Publicity Condition.**
  This is the primary excluder of candidate theories, particularly "Libertarian Paternalism." Many proposed nudges rely on cognitive illusions, inertia, or information asymmetry. If a theory requires that the reason for the nudge be disclosed to the subject, a large class of "effective" nudges become ineffective. A theory that cannot resolve the tension between *transparency* and *efficacy* collapses. It forces the theorist to choose: either paternalism must be honest (and potentially less effective), or it must admit to manipulation (and violate liberal norms of respect). Most casual theories fail here because they assume transparency is costless.

  ***

  ### III. Joint Unsatisfiability: Disclosure vs. Effectiveness

  You suspect a demand for disclosure and a demand for effectiveness will pull against each other. **This is a real tension, not an artefact.**

  It is known in the literature as the **Transparency Paradox**.
  *   **The Conflict:** Many choice architectures work precisely because they exploit System 1 thinking (heuristics, biases, inertia). These processes are opaque to the agent. If you disclose the architecture ("We placed the fruit here because we know you ignore the vegetables"), you engage the agent's System 2 (deliberative) reasoning. This often neutralizes the nudge.
  *   **The Implication:** If a theory insists on the **Publicity Condition** (non-negotiable for liberal justification) and the **Empirical Durability Condition** (non-negotiable for policy efficacy), there is a subset of interventions that are *jointly unsatisfiable*. You cannot have a nudge that is both fully transparent and relies on opacity for its effect size.
  *   **Resolution Requirement:** An adequate theory must not hide this. It must either:
      1.  Ban nudges that rely on opacity (sacrificing some effectiveness for integrity).
      2.  Argue that disclosure does not always neutralize the effect (empirical claim).
      3.  Argue that some loss of effectiveness is the moral cost of legitimacy.
      *Any theory that claims transparency *enhances* effectiveness in all cases is empirically false.*

  ***

  ### IV. The Empirical Standard

  Given your background, this is the most critical section. Philosophical theories often treat "effectiveness" as a binary variable (it works/it doesn't). A theory adequate for policy must treat effectiveness as a distribution.

  **1. The Minimum Effect Threshold**
  A theory must specify a threshold where the welfare gain justifies the liberty cost.
  *   *Requirement:* The theory cannot justify interference for trivial gains. If an opt-out scheme increases savings by 0.1% but creates administrative friction or anxiety for 10% of the population, the theory must have a mechanism to weigh this. It must explicitly reject the notion that *any* positive nudge is justified *ex officio*.

  **2. Heterogeneity of Treatment Effects**
  A theory must account for the fact that interventions affect subgroups differently.
  *   *Requirement:* A nudge that helps the financially literate but harms the financially illiterate (e.g., by creating false confidence) is not justified by an aggregate positive mean. The theory must specify whether the justification requires a Pareto improvement (no one worse off) or a Kaldor-Hicks improvement (winners could compensate losers). In paternalism, compensation is rarely possible. Therefore, the theory must address *distributional harm*.

  **3. Decay and External Validity**
  A theory must distinguish between *efficacy* (pilot conditions) and *effectiveness* (real-world implementation).
  *   *Requirement:* Justification cannot rest on pilot data alone. The theory must include a "durability clause." If an intervention requires constant recalibration to maintain effect (e.g., novelty wears off), the moral cost of continuous interference accumulates. A theory that justifies a one-time intervention based on a temporary effect is flawed. It must demand evidence that the behavior change persists after the intervention is normalized or removed.

  **4. The Counterfactual Baseline**
  A theory must define the baseline against which "improvement" is measured.
  *   *Requirement:* Is the baseline the agent's *revealed* preference (what they chose) or their *latent* preference (what they say they want)?
  *   *Empirical Constraint:* As you know, revealed preference is noisy. But latent preference is unobservable. A theory that relies on latent preference must specify the evidentiary standard required to prove it exists. It cannot assume that because an agent *says* they want to quit smoking, the state knows *how* they wish to quit better than they do. The empirical burden of proof lies on the intervener to show that the interference aligns with the latent preference, not just that it changes the revealed preference.

  ### Summary Specification
  To settle contested policy, a theory of justified paternalism must:
  1.  **Define the End:** Prove the intervention serves the agent's own ends, not the state's.
  2.  **Pass the Transparency Test:** Remain justified even if the mechanism is explained to the subject.
  3.  **Meet the Empirical Bar:** Demonstrate sustained, heterogeneous-aware welfare gains that exceed the moral cost of the liberty restriction.

  If a theory cannot satisfy these three simultaneously, it is not a theory of *justified* interference; it is a theory of *management*.
