answer: |-
  This is a classic moment in the study of language: you have hit the wall where pre-theoretical intuitions clash. The frustration you feel is the friction of "reflective equilibrium"—you are trying to adjust your specific judgments to fit a general rule, and vice versa, until they stop fighting.

  Your roommate is right that "vibes" aren't enough, but you are right that a single clean principle is hard to find because language isn't governed by one switch; it's governed by a layered system. Your tentative "denial test" (cancellability) is a strong start, but it is insufficient because it lumps together things that behave differently in other contexts (like negation).

  To get your verdicts to cohere, we need to replace your single principle with a **Diagnostic Protocol**. This protocol uses three specific stress-tests to sort any utterance into one of your five categories.

  ### Part 1: The Candidate Distinctions (Defined by Behavior)

  Before applying the protocol, we must define the categories not by "feel," but by how they behave under logical stress.

  1.  **Entailment:** Part of the truth conditions. If this is false, the sentence is a lie.
      *   *Behavior:* Cannot be denied; does not survive negation.
  2.  **Presupposition:** Background information taken for granted.
      *   *Behavior:* Survives negation (the "Hey, wait a minute" test).
  3.  **Conversational Implicature:** Inferred based on context and cooperative norms.
      *   *Behavior:* Cancellable (deniable); disappears under negation; context-dependent.
  4.  **Conventional Implicature:** Attached to specific words (like "so," "but," "even"), contributing meaning without affecting truth conditions.
      *   *Behavior:* **Not** cancellable (sounds contradictory); survives negation; not context-dependent.
  5.  **Non-Literal Speaker Meaning:** The literal sentence is obviously false or inappropriate, requiring a reinterpretation (Irony, Metaphor, Loose Use).
      *   *Behavior:* Literal truth conditions are violated; relies on obvious mismatch between world and words.

  ---

  ### Part 2: The Diagnostic Protocol (The Principle)

  Here is the principle set you need. To categorize any meaning component $M$ of a sentence $S$, run these tests in order.

  **Test A: The Negation Test**
  Negate the main verb of $S$ ("It is not the case that $S$"). Does $M$ still hold?
  *   **Yes:** $M$ is either a **Presupposition** or a **Conventional Implicature**. (Go to Test B).
  *   **No:** $M$ is either an **Entailment**, a **Conversational Implicature**, or **Non-Literal Meaning**. (Go to Test C).

  **Test B: The Cancellation Test (for survivors of Negation)**
  Can you explicitly deny $M$ after asserting $S$ without sounding contradictory? (e.g., "$S$, but not $M$").
  *   **No (Sounds Contradictory):** $M$ is a **Conventional Implicature**.
  *   **Yes (Sounds Fine):** $M$ is a **Presupposition** (Note: Presuppositions are tricky; they usually project through negation but can be cancelled in specific "hey, wait a minute" contexts, but for your purposes, if it survives negation but isn't tied to a specific connective word, treat as Presupposition).

  **Test C: The Cancellation Test (for non-survivors of Negation)**
  Can you explicitly deny $M$ after asserting $S$ without sounding contradictory?
  *   **Yes:** $M$ is a **Conversational Implicature**.
  *   **No:** $M$ is an **Entailment** OR **Non-Literal Meaning**.
      *   *Distinguisher:* Is the literal sentence obviously false in the context? If yes, **Non-Literal**. If no, **Entailment**.

  ---

  ### Part 3: Running the Protocol on Your Cases

  Let's apply this to your gut verdicts. This will force some adjustments.

  **1. "Some of the students passed" (Implicates: Not all)**
  *   *Negation:* "It's not the case that some passed." (Does "not all" survive? No. If none passed, "not all" is true, but the inference vanishes).
  *   *Cancellation:* "Some passed, in fact all." (Sounds fine).
  *   *Verdict:* **Conversational Implicature.**
  *   *Status:* **Keep.** Your gut was right.

  **2. "It's cold in here" (Means: Close window)**
  *   *Negation:* "It's not cold in here." (Request vanishes).
  *   *Cancellation:* "It's cold, but I'm not asking you to do anything." (Sounds fine, if rude).
  *   *Verdict:* **Conversational Implicature** (specifically, an indirect speech act derived from relevance).
  *   *Status:* **Keep.**

  **3. "John has three kids" (Implicates: Exactly three)**
  *   *Negation:* "John doesn't have three kids." (If he has four, is this true? Yes. So "exactly three" does not survive negation).
  *   *Cancellation:* "John has three kids, in fact he has four." (Sounds weird, but is it a logical contradiction? No).
  *   *Verdict:* **Conversational Implicature.**
  *   *Status:* **SACRIFICE REQUIRED.** You said, "it feels more like the word just means exactly three." You must give this up. Logically, "three" means "at least three." The reason it feels semantic is that the "exactly" inference is so strong (a *generalized* implicature) that it feels baked in. But your own earlier intuition ("I'd feel misled, not lied to") confirms it is an implicature. If it were semantic (entailment), having four kids would make the statement a *lie*, not just misleading. You must align "Three" with "Some."

  **4. "The bus is full" (One seat left)**
  *   *Literal Truth:* Is the bus literally full? No.
  *   *Context:* Is it obvious there is space? No, it's functionally full.
  *   *Verdict:* **Non-Literal Speaker Meaning** (Loose Use).
  *   *Status:* **Keep.** You correctly identified this as distinct from standard implicature.

  **5. "She's from Yorkshire, so she must be stubborn" (The "so" claim)**
  *   *Negation:* "It's not the case that she's from Yorkshire so she's stubborn." (The explanatory link still hangs there).
  *   *Cancellation:* "She's from Yorkshire so she's stubborn, but actually her origin explains nothing." (Sounds contradictory).
  *   *Verdict:* **Conventional Implicature.**
  *   *Status:* **Keep.** Your intuition that "so" adds a claim you can't cancel is the textbook definition of this category.

  **6. "Great weather, huh" (In downpour)**
  *   *Literal Truth:* Is it great? No.
  *   *Verdict:* **Non-Literal Speaker Meaning** (Irony).
  *   *Status:* **Keep.**

  **7. "He didn't manage to fix it" (Implies: He tried)**
  *   *Negation:* "He didn't manage to fix it." (Does "he tried" survive? Yes. Even if he didn't manage, the word "manage" presupposes an attempt).
  *   *Cancellation:* "He didn't manage to fix it, though he didn't try." (Sounds contradictory/weird).
  *   *Verdict:* **Presupposition.**
  *   *Status:* **Keep.** This distinguishes it from "Some." "Some" disappears under negation; "Manage/Try" survives.

  **8. The Cancellation Contrast ("Some... all" vs. "Yorkshire... not")**
  *   This confirms the split between **Conversational** (cancelable) and **Conventional** (non-cancelable).
  *   *Status:* **Keep.** This is your strongest evidence.

  ---

  ### Part 4: Two New Test Cases

  To ensure this principle holds, let's run two cases you haven't listed.

  **New Case 1: "She stopped smoking."**
  *   *Candidate Meaning:* She used to smoke.
  *   *Negation Test:* "She didn't stop smoking." (Does "she used to smoke" still hold? Yes).
  *   *Cancellation Test:* "She stopped smoking, but she never smoked." (Contradiction).
  *   *Protocol Result:* Survives negation + Non-cancellable = **Presupposition**.
  *   *Why this matters:* It distinguishes from "Manage." Both presuppose something, but "Stop" presupposes a prior state, "Manage" presupposes an attempt. Both behave differently from "Some."

  **New Case 2: "He is rich but happy."**
  *   *Candidate Meaning:* Rich people are usually not happy (contrast).
  *   *Negation Test:* "He is not rich but happy." (The contrast expectation remains).
  *   *Cancellation Test:* "He is rich but happy, and there's no contrast between wealth and happiness." (Sounds contradictory).
  *   *Protocol Result:* Survives negation + Non-cancellable + Tied to word "but" = **Conventional Implicature**.
  *   *Why this matters:* It matches your "Yorkshire/so" case. It proves the "so" intuition wasn't a fluke; it's a structural feature of connective words.

  ---

  ### Part 5: The Honest Accounting (What You Must Give Up)

  To achieve equilibrium, you cannot keep every gut feeling. Here is the cost of admission for this system:

  1.  **You must sacrifice the "Semantic" status of "Three."**
      *   *Your Gut:* "Three" means exactly three semantically, unlike "Some."
      *   *The Fix:* You must accept that "Three" is semantically "at least three," just like "Some." The feeling that it is semantic is a psychological illusion caused by frequency. Your own "misled vs. lied" intuition actually supports this; if it were semantic, having four kids would be a lie. You must trust the "misled" intuition over the "word meaning" intuition.
  2.  **You must sharpen the definition of "Contradiction."**
      *   *Your Gut:* "So" cases feel like "just not the main point."
      *   *The Fix:* You need to recognize that Conventional Implicatures *are* part of "what is said" (in a broad sense) but not part of the "truth conditions." Denying them creates a pragmatic contradiction, not necessarily a logical falsehood, but it sounds wrong enough to fail the Cancellation Test.
  3.  **You must separate "Loose Talk" from "Implicature."**
      *   *Your Gut:* The Bus case felt like "speaker meaning."
      *   *The Fix:* Ensure you don't try to force the Bus case into the Implicature box. It fails the literal truth test. It belongs in the Non-Literal bucket with Irony. If you try to make "The bus is full" an implicature, you break the system for "Great weather."

  ### Summary for Your Debate
  Tell your roommate: "Vibes" are just untested intuitions. The principle is **Cancellability and Projection.**
  *   If you can deny it without contradiction, it's **Conversational Implicature** ("Some", "Three", "Cold/Window").
  *   If you can't deny it, but it survives negation, it's **Presupposition** or **Conventional Implicature** ("Manage/Tried", "So/Explanation", "Stop/Used to").
  *   If the sentence is literally false but understood, it's **Non-Literal** ("Bus Full", "Great Weather").

  Your gut was 90% right; you just needed to stop treating "Three" as a special exception and let it fall in line with "Some."
