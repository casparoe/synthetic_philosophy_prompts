      *   **4. Internal Consistency (Byproducts & Designed Systems):**
          *   *Byproducts (Spandrels):* If a trait is a byproduct (e.g., ability to do calculus), it has no SE function. If it breaks, is it a disorder? SE says no (no function to malfunction). CR says yes (system fails). Psychiatry diagnoses cognitive deficits in calculus-like reasoning. Inconsistency here.
          *   *Designed/Trained Systems:* If function comes from learning (neuroplasticity), SE can accommodate "learning history." But if it's purely cultural (like reading), SE falters.
