answer: |-
  The dispute you and your friend stumbled into is the central fault line in the philosophy of psychiatry. It concerns the **Harmful Dysfunction Analysis (HDA)**, most famously articulated by Jerome Wakefield, which has quietly become the operational backbone of the DSM's definition of mental disorder. The DSM-5 defines a mental disorder as a syndrome reflecting a "dysfunction in the psychological, biological, or developmental processes underlying mental functioning."

  Here is the reconstruction of that commitment, the tension between the theories of function, and the consequences of pulling that thread.

  ### 1. The Presupposed Theory: A Hybrid with an Evolutionary Anchor

  The diagnostic practice presupposes a **normative naturalism**. It claims that to call something a disorder is to make a factual claim about the organism, not merely a value judgment about its behavior.

  *   **The Claim:** A condition is a disorder only if an internal mechanism is failing to perform its **natural function**.
  *   **The Theory:** Officially, the field commits to the **Selected-Effects (SE)** view (also known as the etiological view). On this view, the function of a mechanism is what it was selected for by evolution (or learning history). A heart pumps because ancestors with pumping hearts survived; a fear response activates because ancestors who feared predators survived.
  *   **Why SE?** If the field adopted the **Causal-Role (CR)** view (where function is simply whatever a part currently contributes to the system), it would lose its shield against social control. Under CR, if a political dissident's brain states cause them to disrupt the "social system," that disruption could theoretically be labeled a dysfunction. SE anchors the norm in the *past* (evolutionary history), making it independent of current social values.

  However, in daily practice, clinicians often operate on a **Causal-Role** intuition. They ask: "Is this mechanism preventing the patient from functioning in their current environment?" This creates a latent instability: the *justification* is evolutionary (SE), but the *observation* is systemic (CR).

  ### 2. Does It Require Selection History? (SE vs. CR)

  Does the practice *genuinely* require the selection-history view, or would the causal-role view serve?

  **It requires SE for legitimacy, but relies on CR for utility.**

  If you switch entirely to **Causal-Role**, the concept of "malfunction" collapses into "undesirable effect." A fever causally disrupts homeostasis (temperature regulation fails to keep the body at 98.6°). Under CR, a fever is a dysfunction. But medicine treats fever as a *functioning* defense mechanism. Only SE can distinguish a fever (functioning as designed) from hyperthermia (mechanism broken). Therefore, to maintain the distinction between a *disorder* and a *normal reaction to stress*, the practice requires SE.

  However, SE is often epistemically inaccessible. We do not know the selection history of most cognitive mechanisms. So clinicians default to CR: "This memory mechanism is not contributing to the system's goal of daily living."

  ### 3. A Case of Divergent Verdicts

  Here is a case where SE and CR issue different verdicts on whether a condition is a disorder: **Specific Phobia (e.g., fear of snakes) in a modern urban environment.**

  *   **The Scenario:** A patient has a debilitating panic attack upon seeing a picture of a snake. They cannot work or leave home.
  *   **Causal-Role Verdict (Disorder):** The fear mechanism is making a causal contribution that is harmful to the larger system (the person's life). It prevents the system from achieving its goals (employment, safety). The mechanism is failing its role in the *current* system. **Diagnosis: Disorder.**
  *   **Selected-Effects Verdict (Not a Disorder):** The fear mechanism is doing exactly what it was selected to do: detect snake-like stimuli and trigger avoidance. The mechanism is not broken; the *environment* has changed. The false positive is a feature of a system designed to prioritize survival over accuracy. **Diagnosis: Mismatch (Not a biological disorder).**

  *Note: The DSM diagnoses this as a disorder.* This implies the DSM implicitly assumes that the *calibration* mechanism (which adjusts fear to actual risk) is what is malfunctioning, not the fear itself. But if the calibration mechanism is simply operating on ancestral data, SE struggles to call it a "failure" without invoking a normative standard of "appropriate modern risk," which slides back toward social construction.

  ### 4. Internal Consistency: Byproducts and Designed Systems

  The practice is **internally inconsistent** regarding traits without a selection history.

  **The Byproduct Problem:**
  Consider **Dyslexia**. Reading is a cultural invention too recent to have an evolutionary selection history. There is no "reading module" that was selected for.
  *   **SE View:** Since there is no selected function for reading, there can be no *biological* dysfunction of a reading mechanism. Dyslexia is a mismatch between a brain designed for oral language and a culture requiring literacy. Strictly speaking, under SE, it is not a "mental disorder" in the biological sense.
  *   **CR View:** The visual-linguistic processing fails to contribute to the cognitive system's operation in a literate society. It is a dysfunction.
  *   **The Inconsistency:** The DSM diagnoses Specific Learning Disorder (Dyslexia). The practice treats cultural mismatches as biological disorders, violating its own SE presupposition. It treats a lack of selection history as irrelevant when the harm is obvious.

  **The Designed/Trained System:**
  Consider a prosthetic limb or a cognitive strategy learned in therapy.
  *   If a mechanism is "trained" (neuroplasticity) rather than evolved, SE can accommodate this via "ontogenetic selection" (learning history).
  *   However, if the "system" is defined as "functioning in capitalism," then a mechanism that fails to produce punctuality is a CR dysfunction. The practice tries to avoid this by sticking to "internal mechanisms," but the boundary between internal dysfunction and external mismatch is porous.

  ### 5. Where the Practice is Underdetermined

  There is a large class of diagnoses where the theory of function does no work because SE and CR agree. This is where the presupposition is invisible.

  **The "Hard" Neuropathologies:**
  *   **Schizophrenia, Bipolar I, Alzheimer's.**
  *   **CR:** These conditions clearly disrupt the causal integration of the cognitive system. Memory, affect, and perception fail to contribute to coherent behavior.
  *   **SE:** These conditions are so debilitating and heritable (yet persistent) that they are plausibly viewed as breakdowns of mechanisms selected for reality-testing, mood regulation, and memory.
  *   **Result:** In these cases, the diagnosis holds regardless of whether function is defined by history or current role. The philosophical commitment is underdetermined here; the clinician need not know *why* the mechanism is supposed to work to see that it *isn't* working. This gives the field the illusion of theoretical unity where there is actually agnosticism.

  ### 6. Clinical Consequences: Swapping the Theory

  If the field explicitly replaced the SE presupposition with a pure CR view (or vice versa), the clinic would change in specific, high-stakes ways.

  **If we switched to Pure Causal-Role (Function = Current System Contribution):**
  *   **What Moves In:** Conditions currently viewed as "social problems" or "mismatches" become medical disorders. **Dyslexia** becomes a straightforward biological dysfunction. **Grief** that impairs work functioning becomes Major Depression (removing the bereavement exclusion). **Psychopathy** is unequivocally a disorder because it disrupts the social system.
  *   **What Moves Out:** **Fever, Pain, and Anxiety** become harder to distinguish from disorders. If the function is homeostasis, and pain disrupts homeostasis, pain is a dysfunction. We would treat symptoms more aggressively rather than viewing them as defensive signals.
  *   **Risk:** Medicalization of social deviance. If a teenager's brain states causally contribute to school disruption, is it a disorder? CR says yes.

  **If we switched to Pure Selected-Effects (Function = Evolutionary History):**
  *   **What Moves Out:** **Dyslexia** and other learning disorders might be reclassified as "educational problems" rather than medical disorders, since no reading gene exists. **Specific Phobias** might be reclassified as evolutionary mismatches rather than pathologies, shifting treatment from "fixing the brain" to "managing the environment." **Psychopathy** might be de-pathologized if viewed as a frequency-dependent evolutionary strategy (the "cheater" strategy).
  *   **What Moves In:** Very little moves *in*, which is the problem. SE is too restrictive for modern medicine.
  *   **Risk:** Abandoning patients who suffer from modern mismatches. If it's not an evolutionary breakdown, insurance might not cover it.

  **What Stays Put:**
  *   **Psychosis, Mania, Dementia.** These look like breakdowns under any theory. A hallucination is a failure of reality testing (CR) and almost certainly a failure of a selected predictive-coding mechanism (SE). These diagnoses are robust because the malfunction is glaring enough to satisfy both theories.

  ### Summary of the Commitment

  The practice is quietly committing itself to a **fiction of evolutionary specificity**. It claims to diagnose "dysfunctions" (implying SE: a broken design) to maintain scientific legitimacy and distinguish itself from moral judgment. But it actually treats "disruptions to current functioning" (CR) to maintain clinical utility and help people suffering from modern mismatches.

  This allows psychiatry to say to the critic: "We aren't policing social norms; we are fixing broken biology." But then it allows the clinician to say to the patient: "We can fix your inability to read/work/love," even when the biology isn't broken, just mismatched. The practice survives by keeping the definition of "function" vague enough to slide between SE and CR as needed. If forced to choose, the field would fracture: the researchers would retreat to SE (protecting the "medical" model), and the clinicians would retreat to CR (protecting the "helping" model).
