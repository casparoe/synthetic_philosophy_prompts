answer: |-
  **EXAMINATION PAPER: METAPHYSICS AND ACTION THEORY**
  **Section B: Causation by Omission**
  **Time Allowed: 90 Minutes**

  **Question 1**

  Consider the following case: A nuclear reactor has an automatic cooling system designed to open a release valve when pressure crosses a threshold. An operator, Priya, sees the pressure rising but does nothing, because she believes the automatic system will act. In fact, a technician, Tom, disabled the automatic valve during maintenance and failed to re-enable it. The valve does not open, and the core melts down.

  In lectures, we defined the **Two-Baseline Test (TBT)** for determining when an omission is a cause. According to TBT, an omission counts as a cause only if:
  (i) **Counterfactual Dependence:** The outcome would not have occurred had the agent performed the omitted action.
  (ii) **Normative Baseline:** The omission constitutes a deviation from the baseline that the agent's role or the relevant norm defines as the default.

  **Part (a):** Apply the Two-Baseline Test separately to Priya, Tom, and the automatic system. Then, consider two variants:
  *   **Variant A:** No automatic system was ever installed; Priya is the only safeguard.
  *   **Variant B:** The automatic system is an AI trained to defer to human operators unless they are incapacitated.
  Explain how the TBT verdicts shift in these variants and what this implies about where the "causal work" is located.

  **Part (b):** Critically evaluate the Two-Baseline Test. Does it successfully identify metaphysical causation, or does it collapse causation into responsibility? Specifically, address the suspicion that the "Normative Baseline" condition is covertly moral rather than metaphysical.

  ***

  **MODEL ANSWER**

  The Two-Baseline Test (TBT) attempts to restrict the infinite field of counterfactual dependencies to a manageable set of causal candidates by invoking normative expectations. Applying TBT to the main case yields distinct verdicts for each agent based on their assigned baselines.

  For Tom, both conditions are met. Counterfactually, had he re-enabled the valve, the meltdown would have been averted. Normatively, his role as a technician defines maintaining safety systems as the default baseline; disabling it is a clear deviation. Tom is a cause. For the automatic system, counterfactual dependence holds (it would have opened if enabled). However, ascribing a "deviation" to a machine is metaphorical unless we treat its design function as a normative baseline. If we treat mechanical function as a baseline, the system's failure is a cause. For Priya, counterfactual dependence holds (had she acted, the meltdown stops). However, under TBT, her baseline is contested. If her role permits reliance on the auto-system, her inaction is not a deviation from the norm. TBT might exonerate her causally, suggesting the "causal work" lies with Tom, who violated the primary safety baseline.

  In Variant A (No Auto-system), the baseline shifts entirely. Priya is the sole safeguard. Her inaction is now a deviation from her role's default. TBT now identifies her omission as a cause. This reveals that the "causal work" attributed to Priya changes not because the physics changed, but because the normative landscape changed. In Variant B (AI Defers), the AI's baseline is to wait for human input. If the AI waits, it follows its baseline. TBT would likely rule the AI's inaction as *not* a cause, shifting the causal burden back to Priya, even though the physical chain of events remains identical to the main case.

  This sensitivity to role-description exposes the weakness of TBT. The test does not discover causation in the world; it selects causes based on responsibility. The "Normative Baseline" condition is not metaphysical. Metaphysically, the meltdown was produced by the physical accumulation of heat and the mechanical failure of the valve. Priya's stillness and Tom's absence are ontologically similar: both are absences of intervention. TBT distinguishes them only by appealing to what they *ought* to have done.

  Consequently, TBT succeeds as a tool for legal or moral attribution but fails as a test for pure metaphysical causation. It conflates causal selection with blame. When the baseline shifts in Variant A, Priya does not suddenly exert more physical force; she simply becomes the appropriate target for liability. The test confirms the suspicion that omission causation is covertly moral. We call an omission a "cause" when we need a subject to hold responsible, not when we detect a specific metaphysical glue.

  **Conclusion on the Two-Baseline Test**
  The case shows that TBT does not succeed as a metaphysical account because it makes causation dependent on contingent social roles. It collapses causation into responsibility by using normative deviation as a necessary condition for causal status. A better test would separate the physical causal field (all counterfactual dependencies) from the pragmatic selection mechanism (norms used to assign blame). TBT attempts to do both simultaneously, resulting in a concept of causation that fluctuates with moral intuition rather than physical reality. To fix this, a theory must admit that omissions are causally homogeneous and explain why we *select* some over others for blame without claiming the unselected ones are metaphysically inert.

  ***

  **MARKING SCHEME**

  **Total Marks: 20**

  **1. Application of TBT to Main Case (Priya, Tom, System) – 4 Marks**
  *   **Criteria:** Correctly identifies that Tom meets both conditions; Priya meets Counterfactual but fails Normative Baseline (due to reliance on auto-system); System meets Counterfactual but Baseline is mechanical/metaphorical.
  *   **Common Error:** Treating Priya as a cause in the main case despite the explicit instruction that her role permitted reliance on the system.

  **2. Analysis of Variants A and B – 4 Marks**
  *   **Criteria:** Explains that in Variant A, Priya's baseline shifts, making her a cause. In Variant B, AI baseline shifts to deference, removing it as a cause and returning burden to Priya.
  *   **Common Error:** Claiming the physical outcome changes in the variants, rather than the normative baseline.

  **3. Distinction Between Counterfactual Dependence and Normative Baseline – 4 Marks**
  *   **Criteria:** Clearly articulates that Counterfactual Dependence is constant across cases for Priya, while the Normative Baseline is the variable that alters the verdict.
  *   **Common Error:** Confusing the "what if" condition with the "what should be" condition, treating them as a single metric.

  **4. Identification of the Metaphysical vs. Moral Problem – 4 Marks**
  *   **Criteria:** Explicitly states that the Normative Baseline condition imports moral/legal norms into metaphysics, making the test covertly moral.
  *   **Common Error:** Defending TBT as purely metaphysical without addressing how social roles alter physical causality.

  **5. Final Verdict on TBT and Proposal for Better Test – 4 Marks**
  *   **Criteria:** Concludes TBT collapses causation into responsibility. Suggests a better test separates physical causal fields from pragmatic selection mechanisms.
  *   **Common Error:** Concluding that omissions are never causes, rather than critiquing the test used to identify them.
