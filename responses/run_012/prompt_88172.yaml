prompt: |-
  ok so this is kind of a weird ask. my roommate and i got into a genuinely stupid fight because he read Langdon Winner's "Do Artifacts Have Politics?" for his STS class and now he insists my standing desk is a political regime — like the motor height adjustment is a "biasing of the social order," whatever that means — and i kept saying a desk is a desk, it's how you use it, and he said that's exactly the "neutral tool" cope the essay is about. i actually think he's half right, which is what's annoying me. anyway i'm in the same seminar and we've done the two big moves in the essay — the part about artifacts that are political because of how they get used and arranged versus the part about artifacts that are "inherently political," the ones that actually require or are strongly compatible with a particular social order — plus the Moses-bridge and the McCormick-reaper/molding-machine stories, and honestly the more i think about it the more i think the thesis is right but the way people wave it around is unhinged. so for a zine we're doing i want to make fun of the waving-around, not the thesis.

  can you write me a fake internal guidance memo — the kind a big university compliance office or a mid-level government agency would actually circulate — from a made-up "Office of Political Impact Assessment," in a world where the thesis is basically settled policy and every object has to be rated for its politics before anyone's allowed to procure it. deadpan the whole way, numbered sections, maybe a footnote or an appendix, zero winking at the reader. it should be funny to someone who's actually read Winner, so get the real distinctions right instead of just vibing: the use-and-arrangement kind of politics versus the "inherently political" kind (and the memo should keep fumbling the sub-distinction between artifacts that *require* a social order and ones that are merely *compatible* with it), the "it's just a tool / it's neutral" objection that the office has to keep swatting away, and the genuinely awkward case of stuff that just isn't obviously political, which the office handles by inventing a "pending review" category that never resolves. use your own examples instead of just name-dropping the bridges and the machines, but make sure they're the right *shape*. and one more thing — Winner himself says whether a given technology has a politics is often an open question, so i want the joke to be that the bureaucracy can't tolerate an open question, not that Winner was wrong. target the over-application, not the guy. around 650 words, and feel free to put a grumpy dissenting footnote from some "neutrality" holdout in there, those are always the funniest part of memos like this.
