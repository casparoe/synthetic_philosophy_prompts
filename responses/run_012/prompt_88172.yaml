answer: |-
  **MEMORANDUM**

  **TO:** All Department Heads, Procurement Officers, Facility Managers
  **FROM:** Office of Political Impact Assessment (OPIA)
  **DATE:** October 14, 2023
  **SUBJECT:** Compliance Protocol 80-B: Artifact Politics Classification and Procurement Restrictions

  **1. Classification Tiers and Structural Bias**

  Effective immediately, all capital expenditures involving physical artifacts or software infrastructure must undergo a Political Impact Assessment (PIA) prior to acquisition. Per established jurisprudence, artifacts are classified into two primary categories. **Type I Artifacts** are those where the technical requirements necessitate a specific hierarchy of power (e.g., centralized nuclear monitoring systems requiring authoritarian command structures). **Type II Artifacts** are those that do not strictly require a specific regime but are strongly compatible with, or bias toward, a particular social order (e.g., turnstiles designed to exclude non-tokenized bodies).

  Procurement officers are advised that the distinction between *necessity* and *compatibility* is secondary to the presence of bias. If an artifact can be interpreted as reinforcing existing social stratifications, it must be treated as Type I for compliance purposes. Do not attempt to argue that a Type II artifact is merely "compatible" with hierarchy to avoid scrutiny; the Office considers compatibility sufficient evidence of inherent intent. The technical specification is the policy.

  **2. Prohibition of Instrumental Neutrality Claims**

  Staff are reminded that assertions of instrumental neutrality are non-compliant. Claims that an artifact is "just a tool" whose politics depend solely on user arrangement constitute a Category C violation. For example, collaborative project management software is not neutral; its architecture dictates supervisory oversight and labor segmentation. Even if used democratically, the code structure presupposes a manager-administrator dichotomy. 

  When vendors claim their products are agnostic, cite Protocol 80-B Section 4. The question is not whether the artifact *can* be used differently, but whether its physical or logical arrangement makes certain social outcomes more likely than others. If the answer is yes, the artifact possesses politics. Pleas regarding "user agency" will be rejected as philosophical obfuscation.

  **3. Ambiguous Cases and Pending Review Status**

  There remain artifacts where the political valence is not immediately apparent (e.g., standard-issue paperclips, ergonomic mouse pads). In cases where the OPIA cannot determine if an artifact requires or merely biases toward a social order, the item will be assigned **Status P-Null (Pending Political Resolution)**. 

  Items under Status P-Null may not be procured. Please note that the review process for P-Null items is ongoing and indefinite. The Office does not tolerate open questions regarding technological determinism. Until a definitive ruling is issued confirming whether a specific model of stapler enforces clerical subordination, the requisition remains frozen. Departments are advised to source legacy equipment predating 1980 where possible, though even legacy items are subject to retroactive assessment.

  **4. Implementation**

  Failure to submit a PIA form prior to delivery will result in the confiscation of the artifact for ideological recycling. 

  ***

  ^1 *Dissenting Opinion (J. Miller, Senior Analyst, Ret.): I must register my objection to the conflation of Type I and Type II classifications. Winner explicitly states that determining inherent politics is an open empirical question, not a bureaucratic checkbox. By treating "compatibility" as "requirement," we are not analyzing technology; we are engaging in superstition. Furthermore, declaring all ambiguous objects "Pending" indefinitely halts basic operations. Sometimes a chair is just a chair. But nobody listens to the neutrality holdouts anymore.*
