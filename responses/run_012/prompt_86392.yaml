answer: |-
  # The Paradox of Deontology: A Diagnostic Taxonomy

  ## Part 1: Mapping the Logical Space

  Before using the decision tree below, it helps to understand the dimensions along which theories diverge. The "paradox" arises because deontological constraints (e.g., "do not kill") seem to forbid actions that would minimize the very violations they prohibit (e.g., killing one to save five). To sort positions, we need to isolate four independent variables.

  1.  **The Teleology of the Constraint:** Is the point of the constraint to promote a certain value (like life or rights) in the world, or is it a non-instrumental side-constraint on conduct? If the goal is promotion, minimizing violations is rational. If the goal is conduct-guidance, minimizing violations might be irrelevant.
  2.  **The Relativity of Reasons:** Are the reasons provided by the constraint agent-neutral (everyone has reason to minimize violations everywhere) or agent-relative (I have a special reason not to violate, even if others do)?
  3.  **Sensitivity to Consequences:** Is the constraint absolute, or can it be overridden by sufficiently bad outcomes? If it can be overridden, is there a fixed threshold (disaster only) or a sliding scale (any net gain)?
  4.  **The Ground of Obligation:** What makes the constraint true? Is it rational agency, interpersonal justification, rights status, character, or epistemic limitation?

  **Coherence Check:**
  *   **Agent-Neutral + Non-Minimizing:** This combination is theoretically unstable. If the value is neutral, why not maximize it? This space is sparsely populated.
  *   **Agent-Relative + Minimization Goal:** This is logically incoherent. You cannot have a reason indexed to your own agency that simultaneously demands you optimize global outcomes regardless of agency.
  *   **Absolute + Threshold:** Contradictory by definition.

  ***

  ## Part 2: The Diagnostic Tree

  Work through the following questions sequentially. Stop when you reach a named position.

  **Q1. Is the ultimate justification for the constraint that obeying it produces the best overall state of affairs (e.g., fewer violations of the constraint globally)?**
  *   **Yes:** Go to **Q2**.
  *   **No:** Go to **Q5**.

  **Q2. Is the constraint a direct command for every action, or a strategic tool?**
  *   **Direct Command (Act-by-Act):** You deny the constraint exists as a special restriction; you simply minimize violations directly.
      *   ➔ **Leaf 1: Act Consequentialism**
  *   **Strategic Tool:** Go to **Q3**.

  **Q3. Is the strategy based on adopting general rules or cultivating psychological dispositions?**
  *   **General Rules:** The constraint is a rule that, if generally followed, optimizes outcomes, even if breaking it here would help.
      *   ➔ **Leaf 2: Rule Consequentialism**
  *   **Psychological Dispositions:** The constraint is a motive or character trait that optimizes outcomes if held, even if acting on it sometimes hurts.
      *   ➔ **Leaf 3: Motive Consequentialism**

  **Q4. (Unused in this branch)**

  **Q5. Are the reasons provided by the constraint agent-neutral (everyone should minimize violations) or agent-relative (I must not violate, regardless of others)?**
  *   **Agent-Neutral:** You believe everyone has reason to minimize violations, but there is still a non-consequentialist constraint prohibiting you from doing the minimizing yourself.
      *   ➔ **Leaf 4: Agent-Neutral Deontology**
  *   **Agent-Relative:** Go to **Q6**.

  **Q6. Can catastrophic consequences ever override the constraint?**
  *   **No:** The constraint holds regardless of the cost.
      *   Go to **Q7**.
  *   **Yes:** The constraint gives way under pressure.
      *   Go to **Q9**.

  **Q7. (Absolutist Branch) What primarily grounds the constraint?**
  *   **Rational Agency:** The constraint is derived from the requirements of being a rational will.
      *   ➔ **Leaf 5: Kantian Absolutism**
  *   **Intention Structure:** The constraint binds what you intend, not merely what you foresee.
      *   ➔ **Leaf 6: Doctrine of Double Effect**
  *   **Rights Status:** The constraint is based on the inviolability of persons' rights.
      *   ➔ **Leaf 7: Rights Forfeiture View**
  *   **Interpersonal Justification:** The constraint is based on what principles no one could reasonably reject.
      *   ➔ **Leaf 8: Contractualism**
  *   **Character:** The constraint is an expression of what a virtuous agent would do.
      *   ➔ **Leaf 9: Virtue Ethics**

  **Q8. (Unused in this branch)**

  **Q9. (Threshold Branch) What triggers the override?**
  *   **Disaster Only:** The constraint holds unless the consequences are catastrophically bad (e.g., global destruction).
      *   ➔ **Leaf 10: Catastrophe Threshold Deontology**
  *   **Sliding Scale:** The strength of the constraint weighs against the goodness of the outcome; enough good can outweigh a minor violation.
      *   ➔ **Leaf 11: Proportional Threshold Deontology**

  **Q10. (Final Diagnostic) Is the constraint binding only because we lack perfect knowledge of outcomes?**
  *   **Yes:** If we knew the future, we would optimize; constraints are heuristic tools for uncertain agents.
      *   ➔ **Leaf 12: Epistemic Deontology**
  *   **No:** (Return to Q6).

  ***

  ## Part 3: Position Profiles

  **Leaf 1: Act Consequentialism**
  *   **Awkward Commitment:** You must kill an innocent person if doing so prevents even a minor amount of equivalent suffering elsewhere.

  **Leaf 2: Rule Consequentialism**
  *   **Awkward Commitment:** You must follow the rule even in a specific case where you know breaking it would save lives and no one would ever find out.

  **Leaf 3: Motive Consequentialism**
  *   **Awkward Commitment:** You are morally praised for having the disposition that leads to a disaster, provided the disposition itself is generally useful.

  **Leaf 4: Agent-Neutral Deontology**
  *   **Awkward Commitment:** You must agree that violations should be minimized globally, yet you are forbidden from minimizing them yourself.

  **Leaf 5: Kantian Absolutism**
  *   **Awkward Commitment:** You must let five people die rather than perform one action that treats a rational agent merely as a means.

  **Leaf 6: Doctrine of Double Effect**
  *   **Awkward Commitment:** You may bomb a factory knowing workers will die, but you may not target the workers directly to save the same number of people.

  **Leaf 7: Rights Forfeiture View**
  *   **Awkward Commitment:** Rights vanish precisely at the moment when their protection is most desperately needed by the innocent.

  **Leaf 8: Contractualism**
  *   **Awkward Commitment:** A single individual can veto a policy that would save millions, provided their rejection is reasonable.

  **Leaf 9: Virtue Ethics**
  *   **Awkward Commitment:** A virtuous agent might fail to save lives because doing so would require acting out of character.

  **Leaf 10: Catastrophe Threshold Deontology**
  *   **Awkward Commitment:** There is a magic number of victims where morality suddenly flips from "forbidden" to "required."

  **Leaf 11: Proportional Threshold Deontology**
  *   **Awkward Commitment:** Rights have a price tag that can be outbid by enough aggregate good.

  **Leaf 12: Epistemic Deontology**
  *   **Awkward Commitment:** Morality changes based on what you know, meaning two agents in the same situation act differently based on their information.

  ***

  ## Part 4: Taxonomy Notes

  **Indistinguishable Leaves:**
  *   **Kantian Absolutism (Leaf 5) and Contractualism (Leaf 8):** These are difficult to pull apart in this taxonomy because both often yield absolutist results grounded in rationality. The split is metaphysical: Kantians focus on the individual's rational will, while Contractualists focus on interpersonal justification. In practice, they often land in the same place on the paradox.

  **Unoccupied Combinations:**
  *   **Agent-Neutral + Non-Minimizing (Leaf 4):** This view is rarely occupied because it is theoretically unstable. If the value is agent-neutral, it is unclear why the agent is forbidden from promoting it. It is usually held only temporarily by philosophers transitioning between views.
  *   **Agent-Relative + Minimization Goal:** This combination is incoherent. You cannot hold that reasons are indexed to the agent while simultaneously demanding the agent optimize the global satisfaction of those reasons.
  *   **Absolute + Threshold:** This is logically impossible by definition.
  *   **Epistemic + Absolutist:** While possible, this is unexplored. If constraints are only due to ignorance, one would expect them to vanish with knowledge (leading to Consequentialism), not remain absolute.
