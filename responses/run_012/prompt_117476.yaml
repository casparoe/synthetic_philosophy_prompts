  **Project Title:** The Weight of Identity: Axiomatic Limits of Moral Aggregation
  **Principal Investigator:** [Name]
  **Duration:** Nine Months

  **Research Question**
  Does the veil-of-ignorance argument required to fix weights in Harsanyi's aggregation theorem rely essentially on facts about personal identity that are absent in moral uncertainty? Standard interpretations assume a structural isomorphism between aggregating across persons and aggregating across moral theories. This project challenges that assumption. It asks whether the equiprobability assumption—central to deriving utilitarian weights from the veil—retains normative force when the uncertainty is not about *who* one is, but about *which theory* is true. The hypothesis is that the transplant survives formally but fails normatively: the equiprobability constraint is justified by identity conditions unavailable in moral epistemology, meaning moral aggregation requires a distinct axiomatic foundation for weighting.

  **State of the Field**
  Defenders of Harsanyi-style aggregation often extend the theorem to moral uncertainty without adjusting the weight-fixing mechanism. They treat the formal structure as sufficient, assuming that uncertainty over theories parallels uncertainty over identities. Critics of social aggregation typically attack the Pareto condition or the expected utility framework itself, leaving the weight-fixing step under-examined. Meanwhile, theorists working on moral uncertainty accept the analogy as a starting point, focusing on applications rather than the foundational justification for priors. None isolate the veil-of-ignorance step as dependent on a metaphysics of identity. Consequently, the field lacks an account of why equal weighting should apply to theories if the justification for equal weighting across persons relies on the possibility of becoming any particular person. This project fills that gap by severing the formal isomorphism from the normative justification.

  **Methodology and Timeline**
  This is a conceptual and axiomatic project, not a survey. The work proceeds in three phases.
  *Months 1-3: Reconstruction.* I will formalize the weight-fixing step in Harsanyi's argument, isolating the specific role of the equiprobability assumption. I will distinguish between the formal requirement (probabilities sum to one) and the normative justification (impartiality via identity uncertainty).
  *Months 4-6: Axiomatic Testing.* I will model moral uncertainty without identity conditions. I will test alternative weighting rules—maximin, risk-weighted priors, and objective priors—to determine if they collapse into equiprobability without the identity constraint. The goal is to prove that without identity uncertainty, equiprobability is merely one option among many, lacking unique justification.
  *Months 7-9: Synthesis.* I will draft the argument that the normative payload of Harsanyi's utilitarianism rests on the identity condition. If the identity condition is removed, the theorem yields indeterminate weights, undermining the derivation of utilitarianism in moral uncertainty contexts.

  **Outcomes and Scope**
  A positive result demonstrates that the analogy between persons and theories breaks at the weighting stage, requiring new axioms for moral aggregation. A negative result shows that equiprobability can be justified independently of identity, perhaps through pure impartiality. Failure would consist in inability to formally distinguish the two uncertainty types without collapsing into triviality.
  Given the nine-month limit, I will prioritize the axiomatic analysis over applications to specific moral theories. If behind schedule, I will cut the comparison of alternative priors (Month 5) and focus solely on proving the insufficiency of the standard analogy. The core deliverable is a paper establishing the disanalogy, not a comprehensive theory of moral weighting.

  **Strongest Objection and Reply**
  *Objection:* The veil of ignorance is merely a heuristic for impartiality, not a metaphysical claim about identity. Therefore, equal weighting applies to theories simply because no theory should be privileged, regardless of identity conditions.
  *Reply:* This conflates impartiality with equiprobability. Harsanyi's derivation requires expected utility maximization, which demands specific probabilities, not just equal respect. Without the identity claim—that one is equally likely to be any person—the move from impartiality to specific probabilistic weights is unjustified. In moral uncertainty, one cannot be "equally likely" to be a utilitarian or a deontologist in the same metaphysical sense. Thus, the heuristic fails to generate the specific weights required for the theorem to hold.

