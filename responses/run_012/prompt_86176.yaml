  5.  **Refining the Adjudication (Self-Correction/Nuance):**
      *   *Critique of Marcus:* He relies on "insides" which are black-boxed. He smuggles in normative claims (humans *should* notice) as descriptive ones.
      *   *Critique of Ada:* She thinks operationalizing solves the metaphysical problem. "Sphex depth" is just "robustness," which is a known concept. She misses that "sphexish" carries a normative sting (irrationality) that pure robustness doesn't capture.
      *   *The Hidden Fight:* It's about *Normativity*. Marcus wants to preserve the idea that humans are responsible agents (not wasps). Ada wants to naturalize agency (we are just complex wasps).
      *   *The Ben Verdict:* Ben is *functionally* sphexish (Ada) but *phenomenologically* not (Marcus). The insult applies because he *should* know better (Marcus), but the description applies because he *didn't* change (Ada).

