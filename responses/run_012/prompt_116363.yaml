      *   **Task:** Audit the analogy (not endorse/reject conclusion directly).
      *   **Structure:**
          1.  **Mapping:** Table of correspondences (Source: Law of Estates -> Target: Political Community/Reparations). Flag missing counterparts.
          2.  **Disanalogies:** Distinguish between those affecting the intended use (substantive) and decorative ones. Focus on specific features of debt (determinate sum, currency, alienability, discharge, identity, settled ledger).
          3.  **Refinements:** Analyze specific legal doctrines (liability without fault, successor entity obligations, tracing/knowing receipt, odious debt doctrine, limitation/bankruptcy differences). Assess impact (strengthens, embarrasses, cuts both ways).
          4.  **Conclusion:** Does the practical conclusion survive? If weakened, how? Is there a better analogy? Does it bypass Jaspers's fourfold distinction?

  2.  **Part 1: The Mapping (Table of Correspondences):**
      *   *Source:* Law of Estates/Probate.
      *   *Target:* Political Community/State Succession/Reparations.
      *   *Items to map:* Creditor, Debtor, Principal, Interest, Estate, Executor, Assets, Transfer, Default, Limitation, Discharge, Assignment.
      *   *Drafting the mappings:*
          *   Creditor -> Victim group (or their descendants).
          *   Debtor -> The State (as a corporate entity) / Past Government.
          *   Principal -> The harm done/cost of restitution.
          *   Interest -> Compounding harm/lost opportunity over time.
          *   Estate -> The Polity/Nation (institutions, territory, treasury).
          *   Executor -> Current Government/Administration.
          *   Assets -> Public wealth/Infrastructure/Territory.
          *   Transfer of Assets -> Intergenerational succession/Citizenship acquisition.
          *   Default -> Refusal to pay reparations.
          *   Limitation Periods -> Statutes of limitation (often waived in human rights) vs. historical distance.
          *   Discharge -> Payment of reparations/Treaty settlement.
