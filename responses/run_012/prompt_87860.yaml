  right so for my english coursework i want to do a poem on the communitarian vs liberal thing we did in politics — the whole argument about whether the self comes before its ends or whether youre basically made out of ends you never chose. im thinking a sestina, because i reckon the form is the argument: six end-words keep coming back in an order the poet didnt pick, so if those six words are all things the speaker inherited (their mums religion, the estate they grew up on, their surname, the language they think in, a debt, a habit — something like that), then the whole poem is someone trying to say something thats definately their own and finding that every line lands on an inherited word. thats the communitarian point isnt it, that the unencumbered self is a bit of a fiction.

  but i dont want it to be a strawman, so the speaker should also get the liberal's best case in — that you can reflect on your ends and revise them, that choosing is real even if the menu was handed to you. and the envoi should hold both at once, with all six words turning up in the last three lines, instead of picking a winner, because honestly i dont think this one has a winner.

  it needs to be accurate enough that my teacher (who loves this topic) can see exactly what each bit is doing, but still work as a poem for someone whos never heard of the debate. can you write it? cheers
