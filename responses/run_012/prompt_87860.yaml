  But spend the coin beneath my own **Name**. (1)

  **Envoi**

  I carve my **Name** onto a living **Tongue**,
  Acknowledge every **Debt** of **Stone** and bone,
  And turn the **Prayer** into a **Choice** made new.

  ***

  ### Commentary for Coursework

  **Form as Argument**
  The poem is a sestina. This form was chosen to embody the Communitarian critique of Liberalism (specifically the Sandel vs. Rawls debate). In a sestina, the poet cannot choose the end-words for each stanza; they are dictated by the permutation of the first stanza. This mirrors the Communitarian argument that the self is "situated" or "encumbered." We do not choose the language we think in, the place we are born, or the obligations we inherit (represented by the end-words: *Name, Tongue, Debt, Stone, Prayer*). The speaker tries to make a statement in every stanza, but every line must land on a word they were handed at the start, suggesting the "unencumbered self" is impossible.

  **Stanza Progression & Political Theory**
  *   **Stanzas 1 & 2 (The Communitarian Thesis):** These establish the "constitutive ends." The speaker discovers they are already defined by their inheritance (*Name, Debt, Prayer*) before they exercise any agency. The self is discovered, not chosen.
  *   **Stanza 3 (The Liberal Antithesis):** This stanza voices the Rawlsian counter-argument: that the "self precedes its ends." It argues for the capacity to stand back, reflect, and revise one's conception of the good. The tone shifts to imperative ("examine," "hold," "shape").
  *   **Stanza 4 (The Communitarian Rebuttal):** This challenges the Liberal view by asking *what* is doing the reflecting. If the "I" is made of the inherited *Tongue* and *Debt*, can it truly stand outside them? This references Sandel's point that we cannot detach ourselves entirely from our commitments without losing our identity.
  *   **Stanzas 5 & 6 (The Synthesis):** These stanzas attempt to reconcile the two. The speaker accepts the *Stone* and *Prayer* (the community/inheritance) but asserts agency within them. They "add a clause" to the *Debt* and "order something different." This reflects the idea that freedom is not the absence of ends, but the ability to interpret and revise them.
  *   **Envoi:** The final three lines contain all six end-words. It refuses to declare a winner. It suggests that identity is a negotiation: we carve our *Name* (agency) onto the *Tongue* (inheritance). We acknowledge the *Debt* but spend the coin ourselves.

  **Word Choice**
  *   **Name/Stone/Prayer:** Represent the "given" aspects of identity (family, place, tradition).
  *   **Debt:** Represents social obligation and the "obligations we never chose."
  *   **Tongue:** Represents language and culture—the medium of thought itself, which we cannot choose.
  *   **Choice:** The only abstract noun in the set, representing the Liberal ideal of agency. By forcing "Choice" to rhyme with and follow the same pattern as the concrete inheritances, the poem suggests that even our ability to choose is patterned by what came before.
