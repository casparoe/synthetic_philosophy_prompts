answer: |-
  **Scene:** *The office of the Minister of Happiness, Republic of Cordanza. Morning. MINISTER ELARA VANCE stands by a whiteboard on which a ladder has been drawn. The top rung is labelled "BEST POSSIBLE." The bottom is "WORST POSSIBLE." CHIEF ADVISER TOMAS KRELL sits at the table, holding a draft of the "National Ceiling Review" briefing pack.*

  **KRELL**
  Minister, with respect, the teachers are going to revolt. This briefing note suggests they explain to ten-year-olds that "ambition is a form of dissatisfaction."

  **VANCE**
  It's not anti-ambition, Tomas. It's pro-contentment. We're simply recalibrating the anchor points. Look at the ladder.

  **KRELL**
  I see it. Ten rungs. Zero to ten.

  **VANCE**
  Currently, a citizen looks at that top rung and imagines a villa in the hills, a fast car, perfect health. They look at their own life—a flat in the city, a bus pass, a dodgy knee—and they mark a four.

  **KRELL**
  Because their life is objectively harder than the villa.

  **VANCE**
  Because the *gap* is wide. But the survey doesn't measure the villa. It measures the distance between the citizen and their own imagination of the villa. So, under the National Ceiling Review, we shrink the villa.

  **KRELL**
  You want to tell them the best possible life is… what? A slightly larger flat?

  **VANCE**
  We tell them the best possible life is a life free from *unnecessary worry*. And then we define "unnecessary" very broadly. If you worry about the bus being late, that is unnecessary. If you accept the bus is late, you are wise. A wise man is living near the top rung.

  **KRELL**
  This isn't happiness. This is lowering the ceiling so the room feels fuller.

  **VANCE**
  It is *Ceiling Work*. And it is mathematically sound. The question asks: "Where does your current life fall?" It does not ask: "How does your current life feel?" It asks for an appraisal. An appraisal is a story we tell about value.

  **KRELL**
  It feels like cheating.

  **VANCE**
  Is it cheating if I ask you how tall you are, and you say "Tall enough"? The survey relies on subjective anchors. The top rung is whatever they picture. If we run a media campaign suggesting that "the best possible life" is actually quite modest—quiet, safe, unburdened by expectation—then the average citizen's current life suddenly sits much closer to the top.

  **KRELL**
  So we don't fix the potholes. We just convince them a pothole is a "textured traffic calming feature" that adds character to their journey.

  **VANCE**
  Exactly. And character is high on the ladder.

  **KRELL**
  But the other variables—income, health, freedom. Those are published alongside the score. People will see we're poor and sick, yet ranking first in happiness.

  **VANCE**
  Then we explain that those variables are merely *explanatory*. They explain the score; they do not *create* it. We can have low income and high scores, provided the citizens believe that high income was never really part of the "Best Possible Life" to begin with. We aren't lying about their position on the ladder, Tomas. We are simply painting the top rung lower down.

  **KRELL**
  *(Rubbing his temples)*
  It's dishonest.

  **VANCE**
  It is technically honest. The respondent closes their eyes, pictures the best life they can imagine, and places themselves. If their imagination is… domestically managed… then the score rises. The spreadsheet sees a ten. The spreadsheet does not see the shrunk imagination.

  **KRELL**
  And the schoolteachers?

  **VANCE**
  They are the architects of the imagination. Lesson one: "The Joy of Enough." Lesson two: "Why Wanting More Makes the Ladder Longer."

  **KRELL**
  You're asking me to sign off on a programme that makes people happier by making them smaller.

  **VANCE**
  *(Turning back to the whiteboard, picking up a marker)*
  I'm asking you to sign off on a programme that makes the numbers work without spending money we don't have. We cannot afford to raise the floor, Tomas. But we can certainly afford to lower the roof.

  *(She draws a new line across the ladder, halfway down, and labels it "NEW POSSIBLE.")*

  **VANCE**
  Besides, if we do this right, by next year we won't just be the happiest nation on earth. We'll be the only one where the math checks out.
