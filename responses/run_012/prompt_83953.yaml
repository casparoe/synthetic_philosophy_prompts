prompt: |-
  I'm a high school student and I help put together the end-of-term zine for our philosophy club. This term we've been doing a unit on self-reference and paradox, and the session I can't stop thinking about was on Escher's Drawing Hands and the idea of a tangled hierarchy: two hands each drawing the other, so that neither is prior, and yet the whole loop seems to depend on a level outside it—the "inviolate level" that Hofstadter discusses in Gödel, Escher, Bach, the frame that has to be taken as given if the loop is to be intelligible rather than just a circle. Our club president has challenged us to write a joke that actually turns on that structure, and I'd like you to write it. My attempts keep collapsing into either "this sentence is false" or "two mirrors facing each other," and I want something that would make someone who has genuinely thought about strange loops laugh, not just nod at the reference.

  Could you write a short dialogue joke, maybe 6–10 lines, between two characters caught in a tangled hierarchy—for instance, two hands drawing each other, or two documents that each cite the other as their source, or two students each claiming the other wrote their essay—plus a third character who is tempted to stand outside the loop as the inviolate level. The punchline should make the inviolate level do the real work: it should show why the loop cannot authorize itself, and why the outside level is both necessary and precarious, since it can get pulled into the tangle if it answers the wrong question. It should be funny to someone who knows the material, but it shouldn't depend on any specific quotation or citation; I don't need sources, just the joke itself.

  After the joke, please give me a structured summary as a JSON object with these fields: "joke_title" (a short title), "setup" (one sentence), "punchline" (the exact final line or lines), "tangled_hierarchy" (the loop represented in the joke), "inviolate_level" (who or what occupies that role and why), "why_not_just_a_circle" (the conceptual distinction the joke turns on), "weakest_point" (where the joke might fail for someone who knows the material), and "plain_gloss" (a one-sentence explanation for someone who doesn't know the terms).
