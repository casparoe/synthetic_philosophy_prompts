      *   *Inviolate Level:* The level outside the system that gives the system meaning or existence. In *Drawing Hands*, it's the paper, the ink, or Escher himself. In logic, it's the meta-system.
      *   *The Problem:* If the inviolate level tries to justify the loop from within the logic of the loop, it becomes part of the loop. It must remain "inviolate" (untouched) to function, but its existence is what allows the loop to exist.
