      3.  Select the "Delayed Individuation" path (modifying 3 & 6).
      4.  Explain the cost (you weren't "you" at conception).
      5.  Apply to IVF (embryos are distinct *candidates*, not distinct *persons* yet).

      *Wait, one nuance:* The user says "if a different sperm had won... it wouldn't have been me." I need to preserve this. If I say individuation happens at day 14, does that threaten this? No. Because the day-14 entity still causally depends on *that* sperm. Counterfactual: If sperm B won, the day-14 entity would be different. So Origin Essentialism holds, but the *time* of origin is later.

