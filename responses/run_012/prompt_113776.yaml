      *   Ranked Defeaters (1. Preference Uncertainty, 2. Reflective Consistency, 3. Myopia/Episodicity, 4. Empirical Deviation).
      *   Analysis of Unfalsifiability (Theoretical vs. Practical).
      *   Conclusion/Honest Call.

