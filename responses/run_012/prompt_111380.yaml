              1.  Numbered section of agreed claims (ordinary *de re*, necessity of identity, non-disputed points).
              2.  The Disagreement stated twice (once per side's terminology).
              3.  The Cruxes (specific points of contention).
              4.  Test Cases (specifically: (a) Different Parents/Same Life, (b) Two Equally Similar Counterparts).
              5.  Conclusion on whether any part of the dispute is verbal.
      *   **Tone:** Philosophical, precise, collaborative but acknowledging deep disagreement.

  2.  **Deconstruct the Positions:**
      *   **Transworld Identity (TWI):** Individuals exist in multiple worlds. $a$ in $w_1$ is numerically identical to $b$ in $w_2$. "I could have been a pilot" means *I* (this very thing) exist in a world where I am a pilot.
      *   **Counterpart Theory (CT):** Individuals are world-bound. $a$ in $w_1$ is not identical to $b$ in $w_2$. "I could have been a pilot" means there is a *counterpart* of me in $w_2$ who is a pilot. Counterpart relation ($C$) is based on similarity/context, not strict identity.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground. Both accept Kripkean modal logic basics (mostly), just differ on semantics.
      *   *Claim 1:* Ordinary modal claims are truth-apt (e.g., "Humphrey could have won").
      *   *Claim 2:* Necessity of Identity holds ($\forall x \forall y (x=y \rightarrow \Box x=y)$). Even CT can accept this if interpreted carefully (identity is necessary, counterpart relation is not). Let's stick to the logical principle itself.
      *   *Claim 3:* Worlds are maximal consistent ways things could have been (bracketing *what* they are).
