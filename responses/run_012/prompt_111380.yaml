  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Semantics of *De Re* Modality  
  **Parties:** The Transworld Identity Proponent (TWI) & The Counterpart Theorist (CT)  
  **Date:** October 26, 2023

  ## I. AGREED FOUNDATIONS
  *We bracket all questions regarding the ontological status of possible worlds (e.g., concretism vs. abstractionism). We accept the quantification over worlds as a given formal tool. We agree on the following:*

  1.  **Truth of Ordinary Modal Claims:** Ordinary *de re* modal claims (e.g., "Humphrey could have won the election") are truth-apt and often true. Our dispute is not about whether these sentences are true, but about the truth-conditions that make them so.
  2.  **Necessity of Identity:** We agree that strict numerical identity is necessary. If $x$ is numerically identical to $y$, there is no possible circumstance in which $x$ exists and $y$ exists and they are distinct. (We disagree only on whether $x$ and $y$ can be located in different worlds).
  3.  **World-Boundedness of Properties:** We agree that properties are instantiated by individuals at worlds. We disagree on whether the *individual* instantiating the property at world $w_1$ is numerically the same entity as the individual instantiating a property at world $w_2$.
  4.  **Logical Validity:** We agree on the validity of standard non-modal logic. We disagree on the appropriate modal logic system (specifically regarding the Barcan Formula and the interpretation of the $\Box$ operator).

  ## II. THE DISAGREEMENT STATED TWICE
  *To ensure we are not talking past one another, we state the core dispute in our respective preferred terminology.*

  **A. The Transworld Identity Statement (TWI)**
  > "When we say 'Person $P$ could have been $F$,' we assert that there exists a possible world $w$ where **the very same individual** $P$ exists and instantiates property $F$. Modality is *de re* because the *res* (the thing) persists across the modal operators. To deny this is to deny that we are talking about $P$'s possibilities rather than someone else's."

  **B. The Counterpart Theory Statement (CT)**
  > "When we say 'Person $P$ could have been $F$,' we assert that there exists a possible world $w$ where a **counterpart** of $P$ exists and instantiates property $F$. Individuals are world-bound. The counterpart relation is a relation of similarity and causal continuity, not identity. To insist on transworld identity is to conflate qualitative similarity with numerical sameness."

  ## III. THE CRUXES
  *We identify two specific theoretical pivots where our analyses diverge.*

  **Crux 1: Identity vs. Similarity**
  *   **The Issue:** Is the relation connecting an actual individual to a possibilia merely strict identity under a different name, or is it fundamentally a similarity relation?
  *   **TWI Position:** If the counterpart relation does the work of identity (tracking the subject of the modal claim), it must obey the logic of identity (transitivity, symmetry). If it fails these, it is not tracking the *same* individual.
  *   **CT Position:** The relation *should not* obey the logic of identity. Modality is inherently vague and context-dependent. Strict identity is too rigid to capture our intuitive judgments about possibility.

  **Crux 2: Inconstancy and Context**
  *   **The Issue:** Does the truth value of a *de re* modal claim shift depending on which properties are conversationally salient?
  *   **TWI Position:** This is a defect. Whether $P$ could have been $F$ is a matter of fact about $P$, not a matter of conversational context. Truth conditions should be stable.
  *   **CT Position:** This is a virtue. Our ordinary modal talk *is* context-sensitive. Counterpart theory captures this by allowing the criteria for 'counterpart' to shift with salience.

  ## IV. TEST CASES AND PREDICTIONS
  *We agree to evaluate the following cases. We record our predictions in advance to determine which theory better captures intuitive truth conditions.*

  **Case (a): The Origin Swap**
  *   **Scenario:** Consider a person, Alice, in the actual world ($w_1$). In world $w_2$, there exists a person with Alice's exact life story, psychology, and memories, but who was born of different biological parents.
  *   **Question:** Is the sentence "Alice could have had different parents" true?
  *   **TWI Prediction:** **False.** (Following Kripkean origin essentialism). The individual in $w_2$ is not Alice because origin is essential to transworld identity. Numerical identity requires sameness of origin.
  *   **CT Prediction:** **Context-Dependent (Often True).** If psychological continuity is salient, the person in $w_2$ is a counterpart, making the claim true. If biological origin is made salient, they are not a counterpart. The theory allows the truth value to shift; TWI forces a rigid 'False'.

  **Case (b): The Twin Counterparts**
  *   **Scenario:** Consider Bob in $w_1$. In world $w_2$, there exist two individuals, $C_1$ and $C_2$, who are equally similar to Bob in all relevant respects (a symmetrical fission scenario). $C_1$ becomes a pilot; $C_2$ becomes a doctor.
  *   **Question:** Is the sentence "Bob could have become a pilot" true?
  *   **TWI Prediction:** **False (or Incoherent).** Bob cannot be numerically identical to both $C_1$ and $C_2$ (violating transitivity of identity). If Bob is identical to neither, the claim is false. If he must be one, there must be a further fact (haecceity) distinguishing them, which is metaphysically suspect.
  *   **CT Prediction:** **True.** The modal operator is existential over counterparts. Since *a* counterpart of Bob ($C_1$) is a pilot, "Bob could have become a pilot" is true. The existence of $C_2$ does not negate this.

  ## V. CONCLUSION ON VERBALITY
  *Having drafted this statement, we assess the nature of our dispute.*

  We conclude that the dispute is **partially verbal, but substantively residual.**

  1.  **Verbal Component:** Much of our argument stems from the definition of "exists in." If TWI defines "exists in" as "is numerically identical to an inhabitant of," and CT defines it as "has a counterpart in," we are merely assigning different labels to the formal machinery. We agree on the truth of ordinary sentences (e.g., "Humphrey could have won").
  2.  **Substantive Component:** The dispute becomes substantive in **Case (b)**. TWI is forced to deny the truth of "Bob could have become a pilot" or posit obscure haecceitistic facts to preserve transworld identity. CT accepts the truth but abandons the necessity of identity across worlds. This is a genuine logical divergence regarding how quantification interacts with modality.

