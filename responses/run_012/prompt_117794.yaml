answer: |-
  Good evening, everyone.

  For those who don't know me, I'm the treasurer. Which, in a group this size, mostly means I'm the person who chases people for petrol money and counts the till in the back of the pub while everyone else has the sensible idea of going home.

  Twenty years is a long time. In tech, where I work, twenty years is several lifetimes. But here, it means two decades of people turning up on a Tuesday night not because they have to, and not because they're getting paid, but because they want to make something together.

  When the committee asked me to say a few words, I'll admit I panicked. I'm a backend developer. I deal in logic, in things that either work or they don't. Standing up here to talk about "the meaning of it all" feels like trying to compile code without a compiler.

  But I've been reading something lately that helped me find the words. It's a letter written about two and a half centuries ago by a philosopher named Jean-Jacques Rousseau. He wrote it to argue against building a theatre in his home city of Geneva. Now, you might expect a man like that to say theatre is sinful. He didn't. His argument was much sharper than that.

  He argued that a playhouse is a mirror, not a medicine. He said that sitting in the dark, watching actors pretend to feel things, makes us feel virtuous without actually *being* virtuous. We cry for the hero on stage, so we don't have to help the neighbour next door. He said theatre turns us into spectators, passive judges of other people's lives, rather than participants in our own community.

  He had a particular dislike for actors. He thought their trade was fundamentally dishonest—that pretending to feel emotions you don't feel corrupts the soul. And he analysed a famous comedy by Molière to show that the audience ends up laughing at the one sincere person in the room, and siding with the smooth talkers who just tell everyone what they want to hear.

  Reading that, I thought: well, that's it then. We're done. We're exactly what he warned against. We're a playhouse. We're a mirror.

  But then I looked around this hall.

  Rousseau was writing about the professional theatres of Paris. He was writing about a place where there is a hard line between the paid performer on the stage and the paying customer in the seat. A place where the door is locked once the show starts.

  That isn't what we are.

  In this company, there are no auditions. If you walk into the pub on a Thursday and you want to try a line, you try a line. Our rehearsals are open; people wander in to watch, often bringing friends who end up painting a tree in the background because we're short-handed. The boundary between the "actor" and the "audience" isn't a wall; it's a membrane.

  Rousseau said we shouldn't sit in the dark judging. He said we should be out in the open, dancing together, where everyone is part of the event and no one is hidden.

  Well, look at how we operate. We charge what people can afford. After the show, there is no green room. The actors don't disappear. They come into the bar, still in half-removed costume, still buzzing with adrenaline, and they have a drink with the people who just watched them. The separation dissolves.

  So, my hunch—and I'm running this past my old English teacher in the front row, so I'd better be accurate—is that Rousseau drew the line in the wrong place. He wasn't wrong to worry about what theatre *can* do to a community. It can isolate. It can make us passive. But he assumed that "theatre" has to mean a commercial transaction between strangers.

  What we do here isn't really a "playhouse" in his sense. It's closer to the public festival he actually approved of. It's a gathering where the act of making the show is more important than the show itself.

  And regarding his point about honesty? He said acting is lying. But watch our cast tonight. They aren't pretending to be nervous; they *are* nervous. They aren't pretending to care about this group; they *do* care. When an amateur steps onto a stage, they aren't selling a skill. They're offering a piece of themselves. That's not deception. That's vulnerability. And I'd argue that's the opposite of what Rousseau feared.

  I know there are people in this room who think the arts are a "nice-to-have." In a cost-of-living crisis, I understand that argument. If theatre is just a mirror—if it's just an escape—it is a luxury.

  But if theatre is what we do here—a way of practising being a community, a way of breaking down the barrier between watcher and doer—then it's not a luxury. It's infrastructure. It's the glue.

  We haven't saved civilisation in this hall over the last twenty years. We've just kept a space open where people can be together without an agenda. Where the councillor and the carpenter and the teacher and the developer can sit in the same row, and later stand at the same bar.

  Rousseau wanted a city where people knew each other, where they weren't isolated in the dark. Well, Mr Rousseau, you wouldn't have liked the West End. But I think, just maybe, you'd have tolerated this church hall.

  So, thank you. Thank you to everyone who has swept this floor, painted that flat, bought the tea, or just turned up to keep the seats warm. Thank you for proving that a mirror can be a meeting place, and that watching can be the first step to joining in.

  Here's to the next twenty years. Let's keep the lights on.
