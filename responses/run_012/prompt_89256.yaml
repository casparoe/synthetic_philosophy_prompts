      *   **Background/Gap:** Standard literature (Sen 1970, Gibbard 1974) treats rights as decisive preferences over outcomes. This creates logical impossibility results. It ignores the *process* of exercising rights. Recent work on game forms exists, but the specific mechanism of "default status quo + collision fallback" is under-explored. The usual formulations assume rights are absolute vetos or decisive pairs, leaving open whether procedural conditioning resolves the conflict.
