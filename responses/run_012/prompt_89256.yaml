answer: |-
  **Project Title:** Procedural Liberalism: Default Rights and Fallback Rules in Social Choice

  **Research Question**
  Does reformulating liberal rights as default-setting powers with collective fallback mechanisms eliminate the logical inconsistency between Minimal Liberalism and Pareto Efficiency, and if not, how does this reformulation relocate the conflict into the design of the fallback rule?

  **Background and Gap**
  Sen's Liberal Paradox demonstrates that no social choice function can simultaneously satisfy Minimal Liberalism (individuals are decisive over at least one pair of alternatives in their personal sphere) and the Pareto Principle. Standard resolutions focus on restricting preference domains or weakening Pareto. However, these approaches treat rights as fixed decisiveness over outcomes. This ignores the procedural nature of rights: in practice, rights often function as powers to set a status quo that stands unless waived or overridden by specific collective conditions. The usual formulations leave open whether modeling rights as *default settings* rather than *absolute vetos* dissolves the paradox by allowing individuals to opt out of decisive conflicts or by triggering collective resolution only upon collision.

  **Formal Setup**
  I will construct an axiomatic framework where:
  1.  **Agents & Space:** A set of agents $N$ and social states $X$.
  2.  **Default Power:** Each agent $i$ possesses a personal sphere $S_i$. They may exercise a right to designate a default state $d \in S_i$.
  3.  **Collision & Fallback:** If no agent exercises their right, or if multiple agents exercise conflicting rights (defined by intersection of spheres or incompatible states), the outcome is determined by a Fallback Rule $F$.
  4.  **Axioms:** I will define "Default Liberalism" (DL) as the condition where an exercised default stands unless a collision triggers $F$. I will test DL against Pareto Efficiency and Collective Rationality (transitivity/acyclicity).

  **Cases to Test**
  1.  **The Prude vs. Lewd:** I will model the classic case where the Prude sets "no one reads" as the default. I will test if this avoids the Pareto-improving cycle that generates the paradox when the Lewd prefers "everyone reads."
  2.  **Overlapping Spheres:** I will introduce cases where personal spheres are not disjoint (e.g., noise pollution). Here, collisions are frequent, making the properties of $F$ critical.
  3.  **Fallback Variations:** I will compare two fallback rules: (a) Pareto-dominated filtering (collective choice only among Pareto-optimal defaults) and (b) Majoritarian voting over defaults.

  **Success and Failure Criteria**
  *   **Success:** Demonstrating that under specific conditions (e.g., disjoint spheres + Pareto-filtered fallback), a social choice function exists that satisfies DL and Pareto without inconsistency. Alternatively, successfully identifying the specific axiom of the fallback rule (e.g., independence of irrelevant alternatives) that recreates the impossibility.
  *   **Failure:** If the paradox re-emerges regardless of the fallback design, the project will establish that the conflict is inherent to the concept of rights itself, not merely the modeling of decisiveness. Failure also includes inability to formalize the "collision" condition without reintroducing circularity.

  **Feasibility and Timeline**
  A semester is sufficient for this theoretical project. Weeks 1–4 will be dedicated to formalizing the Default Liberalism axioms. Weeks 5–10 will focus on proving existence/impossibility propositions for the test cases. Weeks 11–14 will involve refining the normative implications of the fallback rule design. The scope is limited to pure theory (proofs and counterexamples) rather than empirical simulation, making it manageable within a 15-week term. The primary risk is the complexity of defining "collision" formally; this will be mitigated by starting with disjoint spheres before generalizing.
