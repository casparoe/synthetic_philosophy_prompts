      *   *Proposed Model:* Rights are procedural. Individual $i$ proposes a state regarding their personal sphere. This becomes the default. If $i$ doesn't act, or if multiple individuals act conflictingly, a collective rule (e.g., majority vote, Pareto check) decides.
      *   *Implication:* This sounds like a game-form approach or a rights-as-powers approach (similar to Gaertner, Pattanaik, Suzumura, but specifically focusing on *default status* and *fallback mechanisms*). The key innovation is the "fallback rule" design.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. "Default Rights and Fallback Rules: Resolving Sen's Liberal Paradox through Procedural Reformulation."
