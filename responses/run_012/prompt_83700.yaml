prompt: |-
  I'm a PhD student with a background in metaphysics and logic but no physics training, and I have about three years to write a dissertation on whether special relativity forces a block universe. I don't want to re-run the standard moves in the Rietdijk–Putnam argument; I want an agenda. Which open questions in that vicinity are actually worth the years, and in what order? Rank and defend: whether the argument needs the premise that all and only the events simultaneous with here-now are real, and what survives if the 'real for' relation turns out not to be transitive; whether the argument establishes a claim about what exists or merely about how tense must be interpreted; whether the real work lies in what Minkowski spacetime, as opposed to special relativity, commits us to, or in the metaphysics; whether any version of presentism can survive relativity; and whatever I have left off the list. For each, say what it is upstream of, how tractable it is without physics training, and what would move it up or down the ranking. I'm less interested in the list than in the criteria, and I'd like you to flag any item that is more likely to dissolve than to be answered — and then tell me which single question you would build the dissertation around.
