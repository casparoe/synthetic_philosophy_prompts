answer: |-
  # Activity Design: The Fragile Pot Protocol
  **Target:** Graduate Seminar (Philosophy/Economics) | **Time:** 90 Minutes | **Students:** 18

  ## I. Core Mechanics & Payoff Structure
  This design avoids weak dominance. Claiming is only rational if you believe *few* others will claim. If you believe *many* will claim, Passing is strictly superior. This forces the divergence between Causal Decision Theory (CDT) and Superrationality.

  **The Pot:** 100 "Units" (redeemable for high-quality chocolate or 0.5% course credit each).
  **The Threshold:** 5 Claimants.
  **The Rules:**
  1.  **Universal Pass ($N_c = 0$):** Everyone receives **20 Units**. (The "Superrational Ideal")
  2.  **Safe Claim ($1 \le N_c \le 5$):** Claimants split 100 Units equally ($100/N_c$). Passers get **0**.
  3.  **Crash ($N_c > 5$):** The Pot shatters. Claimants get **0**. Passers get **10 Units** (Consolation).

  **Why this works:**
  *   **Dominance Check:** If you are sure 10 others will claim, Claiming gets 0, Passing gets 10. Passing dominates. If you are sure 0 others will claim, Claiming gets 100, Passing gets 20. Claiming dominates. *There is no dominant strategy.*
  *   **Superrational Pull:** If I assume my reasoning is typical, then *my* choice predicts *their* choice. If I Claim, they Claim $\rightarrow$ Crash $\rightarrow$ 0. If I Pass, they Pass $\rightarrow$ Universal Pass $\rightarrow$ 20. Superrationality dictates Passing.
  *   **Causal Pull:** My choice cannot *cause* theirs. If I think they will Pass, I should Claim (100 > 20). This creates the tension.

  ---

  ## II. Materials & Setup
  *   **Decision Cards:** 18 small slips of paper. Two checkboxes: `[ ] CLAIM` `[ ] PASS`. Space for Name (optional depending on round).
  *   **Payoff Sheet:** Projected on screen or photocopied (see Appendix A).
  *   **The Pot:** A visible bowl of chocolates or a written ledger of points on the board.
  *   **Seating:** Standard seminar circle.
  *   **The Plant:** One student (confederate) briefed beforehand.

  ---

  ## III. Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | 00-10 | **Setup** | Explain rules, payoff table, and stakes. Distribute cards. |
  | 10-20 | **Round 1** | **Silent/Anonymous.** No talk. Collect cards. Tally. Reveal result. |
  | 20-30 | **Round 2** | **Open Discussion.** 5 mins talk, then decide. Tally. Reveal. |
  | 30-40 | **Round 3** | **The Twin Protocol.** Specific framing (see script). Tally. Reveal. |
  | 40-50 | **Round 4** | **The Saboteur.** Plant instructed to Claim. Tally. Reveal. |
  | 50-90 | **Debrief** | Structured discussion mapping moments to theory (see Section V). |

  ---

  ## IV. Instructor Script & Round Protocols

  ### Setup (00-10)
  **Instructor:** "We are going to play four rounds of a resource allocation game. The currency is [Chocolate/Points]. The rules are on the sheet. Note the Threshold of 5. Note the Universal Pass bonus. Note the Crash penalty. In each round, you will submit a card. I will tally the Claimants ($N_c$) and distribute payoffs immediately."

  ### Round 1: The Baseline (10-20)
  **Instruction:** "No discussion. Do not look at neighbors. Submit anonymously."
  **Action:** Collect, tally, announce $N_c$ and payoffs.
  **Expected Outcome:** $N_c$ usually lands between 6 and 12 (Crash).
  **Instructor Note:** Do not comment on the result. Just record it.

  ### Round 2: The Negotiation (20-30)
  **Instruction:** "You have 5 minutes to talk to each other. You may make promises, threats, or coalitions. After 5 minutes, silence falls, and you submit."
  **Action:** Allow haggling. Watch for "Let's all pick 5 people."
  **Expected Outcome:** Often fails due to trust issues or too many volunteers.
  **Instructor Note:** If they agree on 5 specific people, watch if those people actually Pass (free-riding on the agreement).

  ### Round 3: The Twin Protocol (30-40)
  **Instruction:** "For this round, I am changing the epistemic condition. Imagine you are not playing against strangers. Imagine you are playing against a **psychological twin**. Whoever you are sitting next to is reasoning using *your* exact algorithm. If you decide to Claim, they decide to Claim. If you Pass, they Pass. Your payoff depends on the *total* class count, but your decision is perfectly correlated with your neighbor's. Write your decision."
  **Rationale:** This forces the Hofstadterian frame without using the word "superrational."
  **Expected Outcome:** Higher rate of Passing than Round 1.

  ### Round 4: The Saboteur (40-50)
  **Instruction:** "Standard rules. Anonymous. No discussion."
  **Secret Instruction to Plant:** "Regardless of what happens or what you think, you must check CLAIM. Do not reveal yourself unless directly accused in the debrief."
  **Action:** Run the round.
  **Expected Outcome:** Likely Crash.
  **Instructor Note:** Watch the group's reaction when the tally is revealed. "Who did it?"

  ---

  ## V. The Debrief (50-90)
  *Do not lecture. Use the whiteboard to map their quotes to the four cognitive modes.*

  ### Phase 1: The Causal Objection (50-60)
  **Trigger:** Find the student who said in Round 2: *"I couldn't trust them,"* or *"My vote doesn't change theirs."*
  **Board Label:** **Causal Isolation (CDT)**
  **Script:** "In Round 1, many of you Claimed. Why? [Student X] said 'My card doesn't change what [Student Y] does.' This is Causal Decision Theory. My action is causally sealed from yours. Therefore, I should maximize my payoff given *their* fixed probability of claiming. If I think they will Pass, I must Claim (100 > 20). If I think they will Claim, I must Pass (10 > 0). This leads to instability."

  ### Phase 2: The Superrational Pull (60-70)
  **Trigger:** Find the student who said in Round 3: *"If I'm a twin, then if I Claim, we all Claim."*
  **Board Label:** **Superrationality (Hofstadter)**
  **Script:** "In Round 3, the Pass rate went up. Why? [Student Z] said, 'We're all in the same position.' This is Hofstadter's argument. If we are identical reasoners, my reasoning *is* their reasoning. I cannot choose 'Claim' while expecting you to choose 'Pass' if we are using the same logic. Therefore, the choice is not between 'I Claim/You Pass' but between 'We All Claim' (0) and 'We All Pass' (20). Superrationality selects the latter."

  ### Phase 3: Team Reasoning vs. Selfishness (70-80)
  **Trigger:** The moment in Round 2 when the group tried to nominate 5 Claimants.
  **Board Label:** **We-Mode (Team Reasoning)**
  **Script:** "In Round 2, you tried to form a team. You tried to say 'What is best for *us*?' This is Team Reasoning. But notice what happened: [Student A] volunteered to Pass, but then Claimed. Why? Because the *individual* incentive to defect remained. Superrationality tries to solve this without communication, by relying on logic alone. Team reasoning tries to solve it with identity."

  ### Phase 4: The Scapegoat (80-90)
  **Trigger:** The reaction to Round 4 (The Saboteur).
  **Board Label:** **Ex Post Moralizing**
  **Script:** "When the Pot crashed in Round 4, you looked for the 'selfish' one. You assumed the crash was caused by *greed*. But look at the payoff table. The crash was caused by *uncertainty*. Even if everyone wanted to cooperate, without the 'Twin' assurance, the rational move is unstable. You blamed a moral failure for a structural dilemma."
  *(Reveal the Plant here if necessary to drive the point home: "Even if everyone was superrational, one Causal agent breaks the chain.")*

  ---

  ## VI. Limitations (Instructor Notes)
  *Be honest about what the game cannot do.*

  1.  **Scale:** Hofstadter's Lottery relied on $N=100,000$. Here, $N=18$. In a large $N$, the probability that *my single vote* tips the threshold is near zero, making the Causal argument stronger. In this small group, my vote *does* matter materially. You must point out that Superrationality is *harder* to justify in small groups where causal impact is visible, yet the students likely felt it *more* here.
  2.  **Causal Sealing:** In the classroom, you can see each other. You know you are not actually psychological twins. Hofstadter's argument requires a metaphysical leap ("I know they are as rational as me"). This game simulates the *structure*, but you must supply the *philosophical justification* in the debrief.
  3.  **The "Smug Economist":** One student will say, "This is just a mixed-strategy Nash Equilibrium problem."
      *   *Response:* "Correct. Nash predicts a probability of claiming. Superrationality predicts a specific *choice* (Pass) based on symmetry. The game shows that Nash leads to value destruction (Crash), while Superrationality preserves value. The question is not which is 'mathematically correct,' but which is 'rationally required' when agents are identical."

  ---

  ## VII. Troubleshooting: What Will Go Wrong

  **1. The Haggling Collapse (Round 2)**
  *   **Problem:** Students spend 5 minutes arguing and don't submit cards.
  *   **Fix:** Be a strict timekeeper. "Cards down in 30 seconds." If they haven't agreed, they haven't agreed. The failure is data.

  **2. The Angry Mob (Round 4)**
  *   **Problem:** Students feel betrayed by the Crash and demand to know who Claimed.
  *   **Fix:** "The anonymity is part of the structure. The anger you feel is the exact emotion Hofstadter was analyzing. Hold onto that feeling for the debrief."

  **3. The "It's Just Coordination" Objection**
  *   **Problem:** A student insists this is a Coordination Game, not a PD/Superrationality problem.
  *   **Fix:** "In a Coordination Game, there is a Nash Equilibrium where we all win. Here, the 'All Claim' outcome is a trap. The 'All Pass' outcome is not a Nash Equilibrium under Causal Decision Theory (because one defector gains 100). That divergence is the point."

  **4. The Plant Gets Caught Early**
  *   **Problem:** The plant is too obvious.
  *   **Fix:** Choose a student who is naturally assertive or sits in a spot where they can't be easily watched. Instruct them to hesitate before checking the box to simulate deliberation.

