  ## Appendix B: Instructor Cheat Sheet for Debrief Mapping

  | If a student says... | Map it to... | Theoretical Concept |
  | :--- | :--- | :--- |
  | "I couldn't change what they did." | **Causal Isolation** | Causal Decision Theory (CDT) |
  | "If I do it, everyone like me does it." | **Symmetry** | Superrationality (Hofstadter) |
  | "We needed to maximize the group total." | **Collective Agency** | Team Reasoning / We-Mode |
  | "Someone ruined it for everyone." | **Moralizing** | Ex Post Rationalization |
  | "I had to protect my minimum." | **Risk Aversion** | Maximin Strategy |

  **Final Instruction:** Do not resolve the tension. End the class with the question: *"Is it rational to act as if you determine the actions of others, when you know you do not?"* Let them carry that out the door.
