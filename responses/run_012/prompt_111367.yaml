  ## Appendix A: Payoff Sheet (Photocopy this)

  **THE FRAGILE POT**
  **Total Claimants ($N_c$)** | **Payoff for CLAIM** | **Payoff for PASS**
  --- | --- | ---
  **0** (No one claims) | N/A | **20 Units**
  **1 to 5** (Safe Zone) | **100 / $N_c$** (e.g., if 2, get 50) | **0 Units**
  **6 to 18** (Crash Zone) | **0 Units** | **10 Units**

  *Remember: You do not know how many others will Claim.*

