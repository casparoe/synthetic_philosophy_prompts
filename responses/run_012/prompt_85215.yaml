      *   *Personal Affection:* Where does this fit? The protesters felt affection/solidarity with victims of racism (distant personal affection?). The defenders might feel affection for their city's history. Moore prioritizes "pleasures of human intercourse." Does public protest count? Probably less than intimate friendship, but still a form of shared consciousness.

  4.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the difficulty. Moore is often seen as abstract; this is concrete and political.
      *   **Brainstorming Moorean Resources:**
          *   *Intrinsic Good:* States of consciousness, not things.
          *   *The Two Pillars:* Aesthetic enjoyment & Personal Affection.
          *   *Organic Unities:* Crucial for the "Statue + History" complex.
