  2.  **Deconstruct Moore's *Principia Ethica* (Relevant Sections):**
      *   *Chapter 6 ("The Ideal"):* This is the core. Moore argues the greatest goods are "the pleasures of human intercourse and the enjoyment of beautiful objects."
      *   *Intrinsic Value:* Value resides in states of consciousness, not external objects. The statue itself has no intrinsic value; the *contemplation* of it does.
      *   *Method of Isolation:* To determine intrinsic value, ask if the thing would be good even if it existed absolutely alone.
      *   *Organic Unities:* The value of a whole is not necessarily the sum of its parts. A whole containing a bad part (e.g., consciousness of pain + consciousness of the cause) might be better or worse than the sum. Specifically, consciousness of beauty + appropriate emotion is a great good. Consciousness of something ugly/immoral + appropriate emotion (indignation) might also have value.
      *   *Political/Social:* Moore is notoriously individualistic and quietist regarding political action. He focuses on the *internal* state of the agent, not the external consequence, unless that consequence produces further states of consciousness.

  3.  **Brainstorming the Colston Episode through Moore:**
      *   *The Statue as Object:* Intrinsically neutral. Instrumentally valuable if it causes good states of consciousness.
      *   *The Aesthetic:* Is it beautiful? Moore cares about the *experience* of beauty. If the statue is aesthetically pleasing, contemplating it is good. But does its moral history taint the aesthetic experience?
      *   *The Toppling:* An action. Moore judges actions by consequences (utilitarian aspect), but ultimate value is in the *states of consciousness* resulting.
      *   *The Crowd:* Collective emotion. Moore focuses on individual minds. Does a "collective memory" exist for Moore? No, only aggregates of individual minds.
      *   *The Museum:* Recontextualization. Changes the object of contemplation. Instead of "Heroic Merchant," it becomes "Artifact of Slave Trade + Aesthetic Form." This changes the *whole* being contemplated.
      *   *Organic Unity:* The statue + the knowledge of Colston's crimes.
