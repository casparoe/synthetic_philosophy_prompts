          *   *The Act of Toppling:* Instrumental. Did it produce better states of consciousness overall? Relief for some, anger for others. Moore would ask: Did it increase the net sum of "beautiful contemplation + affection"?
          *   *Affection:* The protest was an expression of solidarity (affection for the oppressed). Moore ranks this very high. The defense of the statue might be affection for tradition, but if based on ignorance, it's less valuable.
