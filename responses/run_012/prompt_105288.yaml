answer: |-
  **Title:** Persisting Institutions: A Stress Test for Endurantism and Perdurantism

  **Research Question**
  Does the endurantism/perdurantism distinction retain explanatory power when applied to institutional entities (e.g., marriages, corporations) whose persistence conditions are normative rather than physical? Specifically, does the reliance of institutional identity on collective intentionality force a revision of standard persistence conditions, or does it expose a category mistake in applying spatiotemporal metaphysics to social objects?

  **Problem and Background**
  The debate between endurantism (wholly present at each time) and perdurantism (extended spacetime worms) is stagnant. Standard cases—tables, persons, statues—rely on conflicting pre-theoretic intuitions regarding change and identity. Neither side pays a decisive cost because material objects offer ambiguous evidence: physical continuity supports endurance, while property variation supports perdurance.

  This project shifts the locus to institutional entities. A marriage is numerically identical over decades despite radical changes in properties, participants' psychological states, and physical circumstances. Its persistence depends not on matter, but on social recognition, legal status, and normative commitments. This is genuinely contested territory: there is no consensus that institutional entities are suitable subjects for persistence debates. Many metaphicians restrict the debate to concrete particulars. However, if institutions are real entities that persist through time, they must obey some metaphysical rules.

  Standard positions leave this open because they assume persistence is grounded in physical or constitutive continuity. Endurantism struggles to explain how a marriage is "wholly present" when its essential properties (e.g., "being honeymooning," "being strained") are time-bound. Perdurantism struggles to locate the "temporal parts" of a marriage, which lack clear spatial boundaries. By testing these views against normative persistence, we can see if the debate hinges on hidden physicalist assumptions.

  **Methodology and Timeline**
  *Months 1–3: Framework and Definitions.*
  Review standard accounts of persistence and social ontology. Define "institutional entity" operationally (focusing on marriages and corporations) without presupposing their ontological status. Establish the criteria for what would count as "enduring" or "perduring" in a normative context.
  *Months 4–6: Constructing the Test Case.*
  Develop a detailed model of institutional persistence. Map the lifecycle of a marriage (vows, cohabitation, crisis, renewal, divorce) against endurantist and perdurantist predictions. Identify where standard definitions clash with institutional reality. For example, if a marriage is suspended legally but not emotionally, does it cease to exist?
  *Months 7–9: Evaluating Costs.*
  Analyze the metaphysical costs for each side. Does endurantism require positing mysterious normative substrates? Does perdurantism require arbitrary slicing of social processes? Determine if one side requires more ad hoc maneuvers to accommodate the data.
  *Months 10–12: Synthesis and Writing.*
  Draft the thesis. Argue either for a preferred view or for the dissolution of the dichotomy in this domain. Refine arguments based on supervisor feedback. Finalize text.

  **Expected Results**
  A successful project will demonstrate one of the following:
  1.  **Asymmetry:** One view (e.g., perdurantism) accommodates institutional change significantly better than the other, providing a new argumentative lever for that side.
  2.  **Category Error:** The case shows that institutional persistence is fundamentally normative, rendering the spatiotemporal distinction irrelevant. This would suggest the standard debate is limited to physical objects.
  3.  **Hybrid Requirement:** The case forces a hybrid view (e.g., normative endurance + physical perdurance), suggesting standard monolithic views are insufficient.

  **Failure Conditions**
  This project fails if:
  1.  **Trivial Mapping:** The analysis shows institutional entities map perfectly onto standard material object cases without generating new friction or insight. If a marriage persists exactly like a table, the project adds no value.
  2.  **Ontological Deadlock:** The project gets bogged down in the prior question of whether institutions exist at all. If I cannot establish the entity as a valid subject for metaphysics without resolving the entire realism/anti-realism debate in social ontology, the scope is unmanageable for an MA.
  3.  **Equivocation:** The argument relies on conflating legal existence with metaphysical existence. If I cannot distinguish "the marriage exists in the eyes of the law" from "the marriage exists as a persisting particular," the metaphysical work collapses.

  **Risk Assessment**
  The primary risk is that the "normative" nature of institutions is just a red herring for standard constitution views. I will mitigate this by focusing strictly on *identity conditions over time*, not constitution. There is no consensus on whether social objects have temporal parts; this project treats that openness as the primary investigative target, not a settled fact.
