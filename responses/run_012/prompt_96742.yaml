answer: |-
  Thank you, President [Name], members of the faculty, families, and the Class of 2024.

  It is a profound honor to stand in this chapel again. I know some of you know my history here. You know I sat where you are sitting. You also know that somewhere between this campus and my graduate studies, my own relationship with the faith of this college changed. I am not standing here as a believer. But I am standing here as a scholar of justice, and as an alum who loves this place enough to tell you the truth.

  The administration asked me to speak on "Faith and Public Life." For many of you, that isn't an abstract theme. It is a logistical problem. Most of you are going into public school teaching or public health nursing. You are entering institutions funded by the state, serving a public that is Hindu, Muslim, Jewish, Christian, atheist, and everything in between.

  So, the question is real: When you walk into that classroom or that clinic, do you leave your soul at the door?

  I want to suggest that the answer is no. But to understand why, we have to correct a very common misunderstanding about how a pluralistic democracy works.

  There is a idea that "public reason"—the language we use when we make laws and public policy—is just a code word for "secular reason." The assumption is that if you are religious, you have to translate your thoughts into secular language to be taken seriously, while the atheist gets to speak naturally.

  That is wrong.

  I spend my career studying the work of John Rawls. Many of you may have read him in your political theory or ethics classes. But before he was a philosopher, Rawls was a man of deep religious conviction. He nearly entered the seminary. He intended to become a priest. Then he served in the Pacific during the Second World War. He saw things there that shattered his faith. He lost the theology, but he kept the moral urgency. He spent the rest of his life asking: How can we live together justly when we disagree about the ultimate nature of the universe?

  Rawls argues that the duty of restraint falls on *everyone*. Not just the religious.

  In a public square, a utilitarian cannot simply argue, "We should fund this program because it maximizes aggregate happiness." That is a comprehensive doctrine. A libertarian cannot simply say, "We cannot tax this because property rights are absolute." That is also a comprehensive doctrine. And a religious citizen cannot simply say, "We must do this because Scripture commands it."

  Public reason is not about silencing your deepest convictions. It is about the currency of coercion. Since the state uses force to enforce its laws, it must justify that force in terms that all free citizens can reasonably accept, regardless of their private metaphysics.

  This is where the "proviso" comes in. This is the part people often miss. You *are* allowed to bring your faith into public argument. You can stand up at a school board meeting and say, "I support this curriculum because my faith teaches me that every child is made in the image of God."

  But, to satisfy the demands of public reason, you must be willing and able to cash that out in public terms. You must be able to say, "...and here is why that dignity matters for the civic health of our community, regardless of whether you share my theology."

  You are not asked to abandon your faith. You are asked to build a bridge from your faith to your neighbor's conscience.

  This brings me to the most important distinction you will need to make in your careers. We need to distinguish between the "background culture" and the "public square."

  This college? The churches you attend? The faculty lounges? The dinner tables with your parents? That is the background culture. In the background culture, there are no restrictions. Preach, pray, argue, convert, testify. That is where your comprehensive doctrines are formed and sustained. That is where you get your strength.

  But when you put on that teacher's badge or that nursing uniform, you are entering the public square.

  I am not telling you to leave your faith at the door of the classroom. I am telling you that the classroom is not your church. It is a shared space.

  If you are a teacher, your faith might be the *motivation* for your patience, your grading integrity, and your care for the marginalized student. That is good. That is necessary. But if a parent asks you *why* you teach history the way you do, or *why* you treat every child with such dignity, "Because my church says so" is not a sufficient public answer. The public answer is, "Because a democratic society requires citizens who understand their history and feel valued."

  The motivation can be private. The justification must be public.

  Some of the devout parents in the pews today might worry that this makes your faith second-class. It does not. It makes your faith generous. It requires you to look your neighbor in the eye and find the common ground, rather than retreating into a language they cannot speak.

  And to my secular colleagues in the faculty: This is not me going soft. This is not me telling you to tolerate the intolerable. It is a demand for rigor. It requires the religious citizen to understand their neighbor's freedom, and it requires the secular citizen to understand that religious language often contains deep moral truths that need to be translated, not ignored.

  Rawls himself never forgot the seminary he didn't enter. He knew that for many, justice is a vocation, not just a calculation. He knew that a society without moral conviction is a cold place. But he also knew that a society that imposes one moral conviction on everyone is a tyrannical one.

  So, Class of 2024, here is my charge to you.

  Do not secularize your soul. Keep your faith, keep your convictions, keep the fire that brought you to this work. Let that fire burn in the background culture of your life. Let it warm your home and your community.

  But when you walk into that public school on Monday morning, remember that you are the steward of a shared space.

  Here is the practical takeaway. Sometime in your first year, a student or a parent will ask you a hard question. Maybe it's about a book on the shelf, a policy on inclusion, or a decision on care. They will ask you, "Why are you doing this?"

  If you answer only with your private doctrine, you will alienate the citizen who doesn't share it. If you answer only with bureaucratic rule-following, you will lose your humanity.

  The art of public life is to hold both.

  Say: "I do this because I believe in the dignity of every person. And in this public institution, that dignity is protected by ensuring every student has access to the truth."

  That is how you honor your faith without imposing it. That is how you serve the state without selling out your soul. That is how you build a society where the devout and the secular can look each other in the eye and say, "I may not know what is in your heart, but I know we can trust your word."

  Go out there and teach. Go out there and heal. And do it in a language we can all understand.

  Congratulations.
