prompt: |-
  I'm the story editor for a small history podcast -- six of us, an episode every two weeks -- and we're planning a season on the big why questions. You know the ones: why did the industrial revolution start in Britain and not in China, why did the scientific revolution happen in Europe and not in the Islamic world, why did the Maya collapse and not the Aztecs. Our excecutive producer keeps killing my pitches with "you can't ask it that way," and she can never quite say why, so I want to stop arguing about vibes and build us an actual procedure.

  Here's the raw material I've got. A friend of mine who did a philosophy degree wrote me three pages of notes when I complained about this. Her main point is that a why-question never comes alone -- you're never just asking why P, you're asking why P rather than Q -- and the Q is doing most of the work, so that swapping it out gives you a different question with a different answer even though the P sits there unchanged. She says you can feel this by flipping a question around: why is there something rather than nothing sounds like the deepest question in the world, and why is there nothing rather than something sounds like a joke, and no fact has changed, only which outcome we're quietly treating as the default. She also thinks a lot of bad history comes from picking a foil that isn't a real alternative to anything, so you end up explaining why one country wasn't some other country, and that the units are usually rotten -- "China" across two thousand years, "Europe" across a dozen very different societies, as if each were one actor with one strategy. I suspect there's more in the notes that I'm not getting.

  Could you turn this into a screening procedure we can actually run on a pitch in the ten minutes before we decide whether to commission it? I want the questions asked in order, what counts as a sufficient answer at each step, which step is where a question dies, and which steps are judgment calls dressed up as tests. Tell me which of her points have to survive into the checklist and which ones can be dropped, and be honest about what the procedure can't do -- I'd rather it say this one needs an actual historian than fake a verdict. Then run it on three pitches: (1) why did the industrial revolution happen in Britain and not in China; (2) why did the scientific revolution happen in Europe and not in the Islamic world; (3) why did the potato famine devastate Ireland and not Scotland. That third one is my pet project, so if the procedure kills it, kill it. One more constraint: our host is not a historian and neither am I, so whatever you write has to be usable by someone who can't reliably tell a good answer from a plausible-sounding one.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**
      *   **Role:** Story Editor for a small history podcast (6 people, bi-weekly episodes).
      *   **Problem:** Executive Producer (EP) keeps killing "Big Why" pitches with "you can't ask it that way" but can't explain why. The user wants to move from "vibes" to a concrete procedure.
      *   **Input Material:** Notes from a philosopher friend. Key concepts:
          *   Contrastive Explanation: "Why P rather than Q?" (The foil Q matters).
          *   Default Assumptions: Swapping P and Q changes the perceived depth/normalcy.
          *   Bad Foils: Explaining why one country wasn't another (false alternatives).
          *   Rotten Units: Treating vast, diverse entities ("China," "Europe") as single actors with single strategies.
      *   **Goal:** A 10-minute screening procedure/checklist for pitches.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Indication of where a question dies.
          *   Identification of judgment calls vs. hard tests.
          *   Evaluation of the philosopher's points (keep/drop).
          *   Honesty about limitations (when to call a historian).
          *   Usable by non-historians (host/editor).
          *   **Task:** Run the procedure on three specific pitches:
              1.  Industrial Revolution (Britain vs. China).
              2.  Scientific Revolution (Europe vs. Islamic World).
              3.  Potato Famine (Ireland vs. Scotland) -> *User's pet project (must be treated fairly, even if killed).*

  2.  **Deconstruct the Philosopher's Notes (The Theory):**
      *   *Contrastive Nature of Why:* This is solid philosophy of history (van Fraassen, etc.). "Why P?" is incomplete. "Why P rather than Q?" is the real question. *Keep.*
      *   *The Foil (Q):* The choice of Q determines the answer. If Q is impossible or ahistorical, the question is broken. *Keep.*
      *   *Rotten Units:* Reification of civilizations. "China" isn't a monolith. "Europe" isn't a monolith. This leads to essentialism. *Keep.*
      *   *Default Assumptions:* Psychological framing. *Keep, but maybe less critical for a checklist than the Foil/Units.*
      *   *Implicit Causality:* The notes imply that bad questions lead to bad answers (teleology, essentialism). *Keep.*

  3.  **Drafting the Procedure (The "Vibe Check" to "Protocol" Conversion):**
      *   *Constraint:* 10 minutes max. Non-experts.
      *   *Structure:* Needs to be a funnel. Start easy, get harder. Kill early if possible.
      *   *Step 1: The Contrast (The "Rather Than").* Force the pitcher to name the Q.
      *   *Step 2: The Foil Viability.* Was Q actually possible? (The "Could China have industrialized?" test).
      *   *Step 3: The Unit Integrity.* Are we treating "Britain" or "China" as blobs? Need to specify *which* Britain/China.
      *   *Step 4: The Mechanism.* Can we explain it without resorting to "culture" or "genius"?
      *   *Step 5: The Historian Flag.* When do we admit we need an expert?

  4.  **Refining the Steps (Self-Correction/Optimization):**
      *   *Critique:* Step 4 is too hard for non-historians. They can't judge mechanisms well.
      *   *Fix:* Change Step 4 to "The Evidence Check." Do we have sources/data, or just theories?
      *   *Critique:* The "Rotten Units" point is crucial. Needs to be explicit.
      *   *Critique:* Need to explicitly state *where* a pitch dies.
      *   *Critique:* Need to identify which parts are judgment calls.

  5.  **Developing the "Philosopher's Points" Audit:**
      *   *Keep:* Contrastive structure (Why P rather than Q), Foil validity (Was Q real?), Unit specificity (No monoliths).
      *   *Drop/Modify:* The "Nothing vs. Something" metaphysical example is cool but irrelevant for history. The "Default Assumption" psychological point is useful context but hard to test in 10 mins. Focus on the *historical* implications of those points.

  6.  **Running the Procedure on the Pitches:**

      *   **Pitch 1: Industrial Revolution (Britain vs. China).**
          *   *Contrast:* Clear.
          *   *Foil:* Was China a viable candidate? (Debated, but plausible).
          *   *Units:* "Britain" and "China" are huge red flags. Which China? Qing? Ming? Which Britain? England? UK?
          *   *Verdict:* High risk of "Rotten Units." Needs narrowing. *Conditional Pass/Fail.*

      *   **Pitch 2: Scientific Revolution (Europe vs. Islamic World).**
          *   *Contrast:* Clear.
          *   *Foil:* Did the Islamic World *stop* doing science? Or did Europe define "science" differently? (The "Decline" narrative is controversial).
          *   *Units:* "Europe" and "Islamic World" are massive monoliths.
          *   *Verdict:* High risk of Essentialism/Civilizational Clash. Likely Fail without major reframing.

      *   **Pitch 3: Potato Famine (Ireland vs. Scotland).**
          *   *Contrast:* Clear.
          *   *Foil:* Scotland also relied on potatoes. Both part of UK. Good control group.
          *   *Units:* "Ireland" vs. "Scotland" are specific enough for the 1840s.
          *   *Mechanism:* Policy? Geography? Export laws?
          *   *Verdict:* Strongest candidate. Passes the "Rotten Unit" test better than the others.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the EP's intuition (she's right, just lacks vocab).
      *   **The Procedure (The "Contrast & Unit Protocol"):** 5 Steps. Time limits. Pass/Fail criteria.
      *   **The Philosopher's Audit:** What to keep/drop.
      *   **Limitations:** When to call a historian.
      *   **The Test Run:** Apply the protocol to the 3 pitches.
      *   **Tone:** Professional, pragmatic, slightly weary (podcast production reality), but rigorous.

  8.  **Drafting Content (Iterative refinement during drafting):**
      *   *Make sure to emphasize the "Non-Historian" constraint.* The checklist can't ask "Is this causally valid?" It must ask "Is this specific?"
      *   *Ensure the "Pet Project" (Famine) gets a fair shake.* It actually holds up better than the others under this scrutiny.
      *   *Define "Death Steps".* If Step 2 fails, stop. Don't waste time on Step 5.

  9.  **Review against Constraints:**
      *   10 minutes? Yes, 5 steps x 2 mins.
      *   Ordered questions? Yes.
      *   Sufficient answers defined? Yes.
      *   Judgment calls identified? Yes.
      *   Philosopher points audited? Yes.
      *   Limitations admitted? Yes.
      *   Three pitches tested? Yes.

  10. **Final Polish:** Check tone. Ensure it sounds like advice from a colleague/consultant, not a lecture. (Self-correction: Make sure the distinction between "Judgment Call" and "Hard Test" is clear in the procedure section).

  *(Self-Correction during drafting the response)*: I need to make sure I don't just validate the EP. The EP is right about the *problem*, but the user needs a *tool*. The tool must empower the editor to push back on the EP if the pitch *does* pass the test, or validate the EP if it fails. It needs to be neutral.

  Also, the "Potato Famine" pitch is interesting because it's often framed as "Why did Britain let Ireland starve?" vs "Why did Scotland survive?" The prompt says "Ireland and not Scotland." This is a valid comparative history question. I need to make sure the procedure doesn't kill it based on the "Big Why" stigma, but evaluates it on the *structure* of the question.

  Let's build the "Contrast & Unit Protocol."

  *Step 1: The Foil.* (Name the Q).
  *Step 2: The Possibility.* (Could Q have happened?).
  *Step 3: The Unit.* (Are P and Q specific enough?).
  *Step 4: The Mechanism.* (Is the answer a thing or a vibe?).
  *Step 5: The Historian Flag.* (Do we need an expert?).

  Okay, ready to write.cw
answer: |-
  Here is a screening procedure designed for your constraints. It translates your philosopher friend's theoretical notes into a production tool. It is designed to be run in 10 minutes by non-historians.

  ### The "Contrast & Unit" Screening Protocol

  **Time Limit:** 10 Minutes
  **Goal:** Determine if a "Why" question is historically coherent, not necessarily if the answer is true.
  **Users:** Editor, Host, Producer (No historian required).

  #### Step 1: The Foil Test (2 Minutes)
  **Question:** "You are asking why **P** happened. What is the **Q** that didn't happen?"
  *   **The Rule:** A "Why" question is invalid if it does not explicitly state the alternative.
  *   **Sufficient Answer:** The pitcher must name a specific historical alternative (e.g., "Why Britain industrialized [P] rather than China [Q]").
  *   **Failure Condition:** If the pitcher says, "It's just about why it happened," or "The alternative is nothing," the pitch dies here.
  *   **Judgment Call:** None. This is a binary pass/fail.

  #### Step 2: The Viability Test (2 Minutes)
  **Question:** "At the starting line of this story, was **Q** actually possible?"
  *   **The Rule:** You cannot explain why something didn't happen if it was never going to happen. This prevents "Why didn't the Romans build nuclear bombs?" questions.
  *   **Sufficient Answer:** The pitcher must identify a specific moment where P and Q were both plausible outcomes based on conditions *at that time*.
  *   **Failure Condition:** If the answer relies on hindsight (e.g., "China was always too big to industrialize"), the pitch dies here.
  *   **Judgment Call:** **High.** Non-historians will struggle to know if Q was viable. *See Limitations below.*

  #### Step 3: The Unit Integrity Test (3 Minutes)
  **Question:** "Are **P** and **Q** single actors, or are they boxes full of different people?"
  *   **The Rule:** Civilizations, continents, and centuries are not actors. "Europe" cannot make a decision. "China" cannot have a strategy.
  *   **Sufficient Answer:** The pitcher must identify *who* inside P and Q made the decisions or faced the constraints (e.g., "British textile merchants vs. Qing Dynasty tax collectors").
  *   **Failure Condition:** If the explanation relies on "European culture" vs. "Islamic culture" or "The Chinese decided," the pitch dies here. This is the "Rotten Unit" kill step.
  *   **Judgment Call:** **Medium.** It requires distinguishing between shorthand (acceptable) and essentialism (fatal).

  #### Step 4: The Mechanism Test (2 Minutes)
  **Question:** "What is the engine? Is it a policy, a resource, a law, or a 'mindset'?"
  *   **The Rule:** "Mindset," "Genius," and "Culture" are not mechanisms; they are descriptions of the outcome.
  *   **Sufficient Answer:** The pitcher must point to a tangible lever (e.g., "Coal prices," "Patent law," "Import bans").
  *   **Failure Condition:** If the primary driver is "They were more curious" or "Their culture valued science more," the pitch dies here.
  *   **Judgment Call:** **Low.** Most non-historians can distinguish between a law and a "vibe."

  #### Step 5: The Historian Flag (1 Minute)
  **Question:** "To answer Step 2 (Viability), do we need to call an expert?"
  *   **The Rule:** If the pitch passes Steps 1, 3, and 4, but Step 2 is shaky, you do not kill the pitch. You flag it for expert review.
  *   **Sufficient Answer:** A "Yes" or "No."
  *   **Outcome:** If "Yes," the pitch is **Conditional.** It cannot be commissioned until a historian validates the Foil Viability.

  ---

  ### Audit of the Philosopher's Notes

  You asked which of your friend's points survive into the checklist and which get dropped.

  **Survivors (Core Mechanics):**
  1.  **Contrastive Explanation (Why P rather than Q):** This is Step 1. It is the most important tool. It forces the pitcher to define the scope.
  2.  **Rotten Units (Reification):** This is Step 3. This prevents civilizational essentialism ("The West," "China").
  3.  **The Foil Viability:** This is Step 2. It prevents ahistorical speculation.

  **Dropped (Too Abstract for Production):**
  1.  **The "Default Assumption" (Something vs. Nothing):** While philosophically interesting, it doesn't help you screen a history pitch in 10 minutes. It's merged into Step 2 (Viability).
  2.  **The "Joke" Test:** Whether a question *sounds* deep or silly is subjective. We replaced this with the Mechanism Test (Step 4).

  **Limitations (What this procedure cannot do):**
  *   **It cannot verify truth.** This protocol checks the *shape* of the question, not the accuracy of the answer. A pitch can pass this test and still be wrong.
  *   **It cannot validate Step 2 alone.** Non-historians cannot reliably judge if a historical alternative was "viable." This is why Step 5 exists. If Step 2 feels shaky, you **must** consult a historian. Do not trust your gut on historical possibility.
  *   **It favors specific history over big history.** This protocol will naturally kill "Big Why" questions in favor of "Specific Comparative" questions. This is a feature, not a bug. Your EP is likely trying to steer you toward the latter.

  ---

  ### Test Run: The Three Pitches

  Here is the protocol applied to your three scenarios.

  #### Pitch 1: Why did the Industrial Revolution happen in Britain and not in China?
  *   **Step 1 (Foil):** Pass. P = Britain Industrializes, Q = China Industrializes.
  *   **Step 2 (Viability):** **Flag.** Was China a viable candidate in 1700? Some historians say yes (Song Dynasty precedents), some say no (Qing restrictions). A non-historian cannot adjudicate this.
  *   **Step 3 (Units):** **Fail.** "Britain" and "China" are rotten units. "China" covers an empire of 400 million with regional economies. "Britain" covers a specific island with specific property laws. The pitch must narrow to *which* actors (e.g., "Yangtze Delta merchants vs. Lancashire mill owners").
  *   **Step 4 (Mechanism):** **Fail.** Usually, this pitch relies on "culture of innovation" or "geography." Needs specific laws or resource constraints.
  *   **Verdict:** **KILL (for now).**
  *   **Notes:** This is the classic "Great Divergence" debate. It is too big for a non-historian team. To save it, you must shrink the units (Step 3). *Revision:* "Why did coal mining technology advance in Lancashire and not the Yangtze Delta between 1700-1750?"

  #### Pitch 2: Why did the Scientific Revolution happen in Europe and not in the Islamic World?
  *   **Step 1 (Foil):** Pass. P = Europe Science, Q = Islamic World Science.
  *   **Step 2 (Viability):** **Fail.** This relies on the premise that the Islamic World *stopped* doing science. Many historians argue this is a false foil; knowledge production shifted rather than ceased. The "Default Assumption" here is that Europe is the norm.
  *   **Step 3 (Units):** **Hard Fail.** "Europe" and "The Islamic World" are the rottenest units possible. One is a continent of warring states; the other is a trans-continental civilization spanning centuries. Treating them as single actors guarantees essentialism.
  *   **Step 4 (Mechanism):** **Fail.** Answers to this usually default to "Religion allowed it in Europe but not there," which is a "mindset" mechanism, not a tangible one.
  *   **Verdict:** **KILL.**
  *   **Notes:** Your EP is right to kill this. It fails Step 3 catastrophically. It invites "Clash of Civilizations" narratives that are historically unsound and difficult to source without expertise.

  #### Pitch 3: Why did the Potato Famine devastate Ireland and not Scotland?
  *   **Step 1 (Foil):** Pass. P = Ireland Starves, Q = Scotland Starves.
  *   **Step 2 (Viability):** **Pass.** Both relied heavily on the potato. Both were part of the United Kingdom during the blight (1845-1852). Scotland had crop failure too, but not mass death. The alternative was real.
  *   **Step 3 (Units):** **Pass.** "Ireland" and "Scotland" are specific political/geographic units for the 1840s. They are not "Civilizations." They are jurisdictions within a single state (UK).
  *   **Step 4 (Mechanism):** **Pass.** This allows for tangible mechanisms: Export laws, relief administration, land tenure systems, infrastructure. It does not require "Irish culture vs. Scottish culture."
  *   **Step 5 (Historian Flag):** **No.** The data (export records, death tolls, parliamentary acts) is accessible and the viability is clear.
  *   **Verdict:** **COMMISSION.**
  *   **Notes:** Your pet project is the strongest of the three. It passes the "Rotten Unit" test because it compares two regions under the same Imperial government, isolating the variable (policy/local condition) rather than comparing two different civilizations. It avoids the "Why didn't China become Britain" trap by asking "Why did Region A suffer when Region B didn't, given the same shock?"

  ### Summary Recommendation

  1.  **Adopt the Protocol.** It gives your EP the vocabulary she lacks ("The Unit Integrity Test failed") and gives you a way to defend good pitches ("It passed the Viability Test").
  2.  **Kill Pitch 2 immediately.** It fails Step 3.
  3.  **Shelve Pitch 1.** It is too big. Challenge the pitcher to narrow the "Units" (Step 3) to specific industries or regions.
  4.  **Greenlight Pitch 3.** It is the only one that survives the "Rotten Unit" test. It transforms a "Big Why" into a comparative history question, which is answerable.

  **Final Warning:** If a pitcher argues that "Everyone knows China didn't industrialize," send them back to Step 2. If they argue "Europe is just one culture," send them back to Step 3. If they cannot answer those, the question is broken, regardless of how interesting the topic sounds.
