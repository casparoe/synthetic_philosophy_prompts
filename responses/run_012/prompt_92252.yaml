      If you adopt Risk-Weighted Expected Utility (RWEU) as a normative standard, you buy into a framework that prioritizes risk-attitudes as fundamental, but this comes at a steep structural price. The most decisive defeaters concern dynamic consistency and the status of the risk function.

      **Formal and Structural Costs**
      RWEU explicitly violates the Independence axiom (specifically, the substitution of equivalents). This is the feature that accommodates Allais preferences, but it is also the source of dynamic instability. In multi-stage choices, an RWEU agent may plan one course of action but prefer another once the lottery resolves partially. Buchak concedes this but defends "resolute choice"—sticking to the initial plan despite changed local preferences. Critics argue this is ad hoc; if preferences reverse, rationality demands updating. Money pumps are possible if the agent isn't resolute. Defenders accept this vulnerability but argue that avoiding money pumps isn't the sole criterion of rationality. Furthermore, RWEU requires the reduction of compound lotteries to simple ones before weighting. If framing affects reduction, preferences shift. This framing sensitivity is a concession: the theory assumes agents see through frames, but empirically, they often don't.

      **The Value of Information**
      A committed defender must accept that rational agents may reject costless information. Standard instrumental rationality (via Good's Theorem) dictates that free information always has non-negative value because it allows better conditioning. RWEU breaks this because acquiring information changes the risk profile of the gamble, potentially lowering the risk-weighted value even if expected utility rises. Buchak accepts this consequence. Whether this counts as a defeater depends on whether you view risk-aversion as trumping information-maximization. Critics say this violates the very idea of instrumental rationality; defenders say it correctly models that risk itself has disvalue.

      **Risk Function: Attitude or Taste?**
      This is the deepest normative worry. If any continuous, increasing risk function is permissible, RWEU risks becoming unfalsifiable: any preference pattern can be rationalized by positing a suitable risk function. Buchak argues the function represents a distinct rational attitude, not just a taste, constrained by consistency requirements. However, without external constraints on which risk functions are rational (beyond mathematical coherence), the theory thins into a redescription of preferences. If risk-aversion is purely a taste, calling it "rational" adds little normative force. A reasonable person is moved by the worry that RWEU lacks the normative bite of EU, which restricts risk-attitudes to neutrality.

      **Extensions: Aggregation and Limits**
      In collective choice, aggregating heterogeneous risk functions is problematic. Buchak's veil-of-ignorance argument assumes specific risk attitudes behind the veil to derive distributive conclusions, but this is contentious; why should the veil impose *your* risk function? Regarding imprecise probabilities or infinite stakes, RWEU offers no special advantage over EU. Weighting undefined or infinite values remains mathematically treacherous. The risk function can exacerbate sensitivity to low-probability, high-stakes outcomes (Pascal's Mugging), potentially making the agent *more* vulnerable to extreme stakes than an EU maximizer, depending on the function's shape.

