      The position is less insulated than it appears. The dynamic inconsistency objection is the sharpest dagger; resolute choice is a controversial patch. The information rejection is a bullet many find too bitter to swallow. The "taste" objection threatens the theory's normative soul. However, if you accept that risk is a fundamental normative category independent of utility, these are unavoidable costs rather than fatal flaws. The theory is robust against calibration arguments but fragile against dynamic coherence. It is a viable normative competitor to EU, but only if you are willing to redefine instrumental rationality to include risk-attitudes as basic reasons, not just psychological quirks. The defeaters regarding dynamic choice and unfalsifiability would move a reasonable person, while the information consequence is merely awkward for those already sympathetic.

