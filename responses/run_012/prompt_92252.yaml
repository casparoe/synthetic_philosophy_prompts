      *   *Status of Risk Function:* Is it a rational constraint or just a taste? If any function is permissible, is the theory normative or just descriptive?
      *   *Aggregation/Heterogeneity:* How to aggregate different risk functions in social choice? Buchak uses a veil of ignorance, but this is contentious.
