answer: |-
  Thank you. Please, stay seated.

  Over the last two days, this room has held a tension that is rare in academic settings. On one side, we have the practical reality of farming insects for protein. The margins are thin. The scale is vast. On the other side, we have the philosophical question of whether those insects matter morally. In the middle sit the scientists, who rightly demand evidence before making claims about inner lives.

  I was asked to deliver a consensus statement drafted by the organizers. I am not going to read it. There are two sentences in that draft which attempt to solve our problem by definition. The first suggests that if we are unsure whether an animal feels pain, we should treat the risk as zero. The second suggests that even if there are billions of them, their moral weight does not rise in proportion to their numbers.

  I cannot read those sentences because they are designed to make the arithmetic disappear. And the arithmetic is the only reason we are here.

  Let us be plain about what we do not know. We know an insect nervous system can detect damage. It will pull away from heat. It will groom an injured limb. The entomologists in this room can tell us exactly which neurons fire. What we cannot know, yet, is whether that signaling is accompanied by an experience of suffering. Is there something it feels like to be that cricket? Or is it merely a machine registering error codes?

  Science has not delivered a verdict. It may not for decades. So we are left with uncertainty. And when you combine uncertainty with vast numbers, you get a specific kind of risk.

  Let us work through a calculation together. I will use figures I have invented, but the structure is real. Imagine a single facility producing ten billion insects a year. That is a modest number for this industry. Now, imagine we assign a probability to their sentience. Let us be conservative. Let us say there is only a ten percent chance that they are capable of suffering. Ten percent.

  If you multiply ten billion individuals by a ten percent probability, you get an expected value of one billion sentient lives.

  To put that in perspective, the global cattle population is around one billion. All of them. If our ten percent guess is right, this single facility is responsible for as much potential suffering as the entire global cattle industry. If we raise that probability to twenty percent, the numbers dwarf all vertebrate farming combined.

  This is the arithmetic I keep returning to. It is why the welfare advocates in this room cannot let this go. A small probability multiplied by a vast number yields a large expected harm. The organizers' draft tried to tell us that below a certain threshold of certainty, the harm counts as nothing. But if the stakes are this high, a small probability is not a license to ignore the risk. It is a reason to be careful.

  However, I also know I cannot stand here and tell you that this arithmetic settles the matter. If it did, we would face a paralysis that helps no one.

  This leads to the strongest objection against my own argument. It is the objection that I prove too much. If we count expected suffering, where do we stop? There are more nematodes in a scoop of soil than there are insects in a rearing bin. There are more mites in this building than there are humans. If a one percent chance of suffering matters for a cricket, does it matter for a mite? For a bacterium? If we follow the numbers strictly, we become unable to act without panic. We would have to cease farming, cease walking, perhaps cease breathing.

  So the arithmetic shows us the risk, but it cannot dictate the policy alone. We need a principle that respects the magnitude of the numbers without demanding the impossible.

  We need to acknowledge that complexity matters. A nervous system with a higher capacity for integration is a safer bet for sentience than a simple reflex arc. We are not obligated to treat every living cell as a moral patient. But within the class of animals we have chosen to farm commercially—the crickets, the mealworms, the black soldier flies—the complexity is sufficient that we cannot dismiss the risk as zero. The industry has chosen to operate at a scale where even a tiny error rate becomes a moral event.

  So, what do we do on Monday morning? We cannot wait for philosophy to end. We cannot wait for science to be certain.

  I propose one concrete recommendation that does not depend on resolving the question of sentience. It is a "no-regrets" policy.

  My recommendation is this: Standardize harvesting methods to minimize crushing across all partner facilities.

  Currently, harvesting methods vary. Some involve heat, some involve freezing, some involve grinding. The efficiency of these methods varies, and so does the amount of physical damage inflicted on the product before it is processed.

  Even if you believe these insects feel nothing, crushing represents waste. It damages the protein quality. It reduces yield. It costs money. By optimizing handling to reduce physical damage, you improve your margins. You reduce waste.

  But if there is even a one percent chance that these animals suffer, reducing crushing also reduces the duration and intensity of that potential suffering. It is a measure that aligns economic interest with welfare precaution. It does not require you to sign a statement declaring insects sentient. It only requires you to agree that wasting product is bad, and that avoiding unnecessary damage is good.

  This is how we price the uncertainty. We do not need to agree on the metaphysics to agree on the handling.

  To the funders considering whether to make this an annual event: do not look for a consensus that does not exist. Look for the willingness to work within the uncertainty. The value of this workshop is not that we solved the problem. It is that the industry sat in the same room as the ethicists and listened to the arithmetic without walking out.

  To the operators: You are not being asked to shut down. You are being asked to recognize that scale creates responsibility. When you farm millions, mistakes are individual. When you farm billions, mistakes are statistical.

  To the scientists: Keep testing. We need better markers for stress and damage.

  And to the advocates: Accept that precaution must be balanced with feasibility. If you demand standards that bankrupt the industry, you do not reduce suffering; you merely shift production to places where no one is watching.

  We leave here without a verdict on the inner lives of insects. But we leave with a clear view of the risk. We have seen that the numbers are too large to ignore, even if the probability is small. And we have identified a path forward that protects the animals if they feel, and protects the profit if they do not.

  That is enough for now. Thank you.
