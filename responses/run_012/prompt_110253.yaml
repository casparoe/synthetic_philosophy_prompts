          *   *Difference from Mind:* In the mental case, we feel the "distinctness" more keenly due to the explanatory gap/qualia. In the tornado case, we accept the reduction more easily. But structurally, they are the same. If the argument kills the tornado, it's a *reductio* of the argument itself, not a proof of epiphenomenalism.

