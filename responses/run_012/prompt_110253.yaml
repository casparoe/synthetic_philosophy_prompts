      *   *Correction:* I need to be careful about "Closure." The prompt asks to distinguish the work done by closure from the work done by sufficiency.
      *   *Clarification:* Causal Closure says: For every physical event, there is a sufficient physical cause. Sufficiency of Realizer says: *This* physical state is sufficient for *this* movement.
      *   *Interaction:* If we have Sufficiency of Realizer, we effectively have a local instance of Closure. The Exclusion argument needs the idea that *if* there is a sufficient physical cause, *no other* cause (mental) is needed.
      *   *Tornado:* If the argument implies tornadoes don't cause roofs to collapse, the argument is flawed. The premise that fails is the idea that lower-level sufficiency excludes higher-level causation.
      *   *Escape:* The "Determinable/Determinate" model allows $M$ and $P$ to be distinct but not competing. $P$ is a specific way of being $M$. $M$ causes $B$ in virtue of $P$ causing $B$.
