prompt: |-
  Right, so I've somehow ended up marking a stack of mock exam answers for a friend who tutors first-year philosophy, and I'm a software engineer with zero formal philosophy background, so I'm abit out of my depth on this one. Could you act as an experienced philosophy lecturer who knows the punishment literature inside out and help me mark it?

  Before you give me a mark, I'd like you to think carefully and brainstorm first — jot down what a really strong answer to this question would need to cover, and only then go through the student's answer point by point against that list. I want the actual breakdown rather than a general impression: where they're right, where they're wrong, and how badly.

  Here's the question:

  (a) What is the core difference between retributivist and consequentialist justifications of legal punishment? (b) Suppose punishing an innocent person would prevent a riot and so maximise overall welfare. What does each theory say about that case, and what does it cost the theory? (c) A critic says retributivism is just revenge dressed up. What is the strongest retributivist reply? (d) Which theory, if either, is better placed to explain why punishment should be proportionate to the seriousness of the offence?

  And here's what the student wrote:

  "Retributivism says punishment is justified because the offender deserves it — it looks backwards at the crime. Consequentialism says punishment is justified by its good effects, like deterrence (stopping this offender from reoffending), incapacitation and rehabilitation — it looks forwards. So the core difference is desert versus consequences.

  On (b), the utilitarian has to allow punishing the innocent, because only the outcome matters, and here the outcome is a riot prevented. That's the classic objection and it's a genuine cost. The retributivist says no: the innocent person doesn't deserve it, so it's unjust whatever the consequences. Kant's version is that you can never treat a person merely as a means to other people's ends, so punishing the innocent to calm a crowd uses them as a tool. Kant also said a society about to dissolve should still execute its last murderer, because justice has to be done regardless of any future benefit. So this case basically refutes consequentialism.

  On (c), the retributivist replies that retribution isn't revenge: revenge is personal, comes from the victim, and tends to be excessive, whereas retribution is impersonal, administered by the state, and proportionate. It restores the moral balance.

  On (d), retributivism is clearly better, because consequentialism can't explain proportionality at all. For a consequentialist, punishment is just a lever for producing good outcomes, so if torturing a parking offender deterred best, that's what they'd have to do. Retributivism makes proportionality part of the point: the punishment is set by what's deserved. And retributivists hold that the punishment must match the crime in kind — an eye for an eye — which is where the name lex talionis comes from."

  I genuinely can't tell how much of that is solid and how much is off, which is exactly why I don't want to just wave it through. Please give me a mark out of 20, then a point-by-point breakdown with specific comments. I need to be able to justify every mark I dock, and equally I dont want to dock marks for things that are actually fine — so if you're penalising something, tell me exactly what the error is and why it matters, and if something is right but looks shaky to you, say so seperately.
