  Let's finalize the breakdown.
  (a) 4/5 - Minor lack of depth on 'intrinsic badness'.
  (b) 3/5 - Missed the 'cost to retributivism' nuance.
  (c) 4/5 - Good.
  (d) 2/5 - Significant error on *lex talionis* and consequentialist capacity.
