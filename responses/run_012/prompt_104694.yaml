prompt: |-
  Our debate club's briefing sheet summarizes the precautionary principle as follows. It says that an activity or technology should be banned unless it has first been proven safe, whatever the cost of the ban and however small the risk; that the principle's core claim is a reversal of the burden of proof, so that the innovator must demonstrate safety rather than the public demonstrate harm; that it was written into environmental treaties and has since been extended to pesticides, nuclear power, and now artificial intelligence; and that because it demands certainty before anyone may act it is unscientific, while because it would equally forbid the technologies that might solve the problems it fears — and, once precaution's own costs are counted, forbid precaution itself — it cannot be a serious guide to policy and is at best a slogan. Is this a fair summary? I have a vague sense that there is more than one version of the principle and that the sheet may be describing the strongest one, but I cannot tell. Please go claim by claim and tell me what a careful defender would accept, what is a common simplification, what is a genuine misrepresentation, and whether the closing claim — that the principle cannot guide policy — follows from anything true in the summary.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Source Material:** A debate club briefing sheet summarizing the "Precautionary Principle" (PP).
      *   **Task:** Evaluate the fairness of this summary claim-by-claim.
      *   **Specific Instructions:** Distinguish between what a careful defender would accept, what is a common simplification, what is a genuine misrepresentation, and evaluate the concluding claim (that PP cannot guide policy).
      *   **User's Intuition:** The user suspects there are multiple versions of the principle and that the sheet describes the "strongest" (most extreme) one.
      *   **Goal:** Provide a nuanced, accurate, and structured analysis.

  2.  **Deconstruct the Briefing Sheet's Claims:**
      *   *Claim 1:* "An activity or technology should be banned unless it has first been proven safe, whatever the cost of the ban and however small the risk."
      *   *Claim 2:* "The principle's core claim is a reversal of the burden of proof, so that the innovator must demonstrate safety rather than the public demonstrate harm."
      *   *Claim 3:* "It was written into environmental treaties and has since been extended to pesticides, nuclear power, and now artificial intelligence."
      *   *Claim 4:* "Because it demands certainty before anyone may act it is unscientific."
      *   *Claim 5:* "Because it would equally forbid the technologies that might solve the problems it fears... and, once precaution's own costs are counted, forbid precaution itself."
      *   *Claim 6 (Conclusion):* "It cannot be a serious guide to policy and is at best a slogan."

  3.  **Evaluate Each Claim against Academic/Policy Literature:**

      *   *Claim 1 (Ban unless proven safe, whatever cost/risk):*
          *   *Analysis:* This is the "Strong Precautionary Principle." Most defenders argue for *proportionality* and *risk assessment*, not absolute bans regardless of cost. "Proven safe" is impossible (science rarely proves absolute safety).
          *   *Verdict:* Misrepresentation/Strawman of the mainstream view. Accurate only for the most radical interpretation.

      *   *Claim 2 (Reversal of burden of proof):*
          *   *Analysis:* This is widely accepted as the *core procedural mechanism* of PP. Instead of "innocent until proven guilty" (for chemicals/tech), it's "prove it won't hurt before releasing."
          *   *Verdict:* Fair summary of the core mechanism, though defenders add nuance (degree of proof depends on risk severity).

      *   *Claim 3 (Treaties, pesticides, nuclear, AI):*
          *   *Analysis:* Factually correct. Rio Declaration (1992), EU law, etc. Application to AI is current debate.
          *   *Verdict:* Fair/Accurate.

      *   *Claim 4 (Demands certainty, therefore unscientific):*
          *   *Analysis:* PP is triggered precisely when scientific *uncertainty* exists. It doesn't demand certainty; it demands action *despite* uncertainty. However, critics argue it *implies* a standard of safety that requires near-certainty. Defenders say it mandates caution, not certainty.
          *   *Verdict:* Simplification/Criticism. It conflates "proven safe" (Claim 1) with the trigger condition (uncertainty).

      *   *Claim 5 (Forbids solutions & forbids itself due to costs):*
          *   *Analysis:* This is the "Paralysis Argument" or "Precautionary Principle Paradox." (e.g., Cass Sunstein's critique). If you ban GMOs to be safe, you might cause hunger. If you ban the ban because it costs money, you regress infinitely. Defenders argue PP includes weighing *all* risks (including the risk of inaction).
          *   *Verdict:* A serious philosophical critique, but defenders reject the premise that PP ignores the costs of inaction.

      *   *Claim 6 (Cannot guide policy/Slogan):*
          *   *Analysis:* Does this follow? If the previous claims were true, maybe. But since Claim 1 is a strawman and Claim 5 is contested, the conclusion is debatable. Many policies *do* use it (REACH in EU).
          *   *Verdict:* Contested conclusion.

  4.  **Synthesize the "Multiple Versions" Insight:**
      *   The user is right. There is a spectrum:
          *   *Weak PP:* Uncertainty justifies research/monitoring.
          *   *Moderate PP:* Uncertainty justifies restrictive measures proportional to risk.
          *   *Strong PP:* Uncertainty justifies a ban until absolute safety is proven (the briefing sheet's version).
      *   Key distinction: *Proportionality* and *Risk-Risk Analysis*.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's intuition. Yes, there are versions. The sheet describes the "Strong" version to make it easier to attack.
      *   *Claim-by-Claim Breakdown:*
          *   *Claim 1 (Ban/Cost/Risk):* Label as "Strong Version/Misrepresentation." Explain that mainstream PP requires proportionality. "Proven safe" is scientifically impossible.
          *   *Claim 2 (Burden of Proof):* Label as "Accepted Core." This is the most accurate part.
          *   *Claim 3 (History/Scope):* Label as "Factually Accurate."
          *   *Claim 4 (Certainty/Unscientific):* Label as "Critique/Partial Misrepresentation." PP acknowledges uncertainty; it doesn't demand certainty, though critics say it effectively does.
          *   *Claim 5 (Forbids Solutions/Itself):* Label as "The Paralysis Critique." Explain the defender's counter (PP applies to inaction too).
          *   *Claim 6 (Slogan/No Policy):* Label as "Non-Sequitur/Contested." Show examples where it *is* policy (EU).
      *   *Conclusion:* Summarize the fairness. It's a "steelman" of the critique but a "strawman" of the principle. Good for debate (gives clear ammo), bad for nuance.

  6.  **Refining the Tone:**
      *   Ensure neutrality. I am not arguing *for* PP, but analyzing the *summary* of PP.
