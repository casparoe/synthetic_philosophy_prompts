  8.  **Final Polish:** Organize into the requested structure (Claim by Claim, then Conclusion). Ensure the distinction between Weak/Moderate/Strong PP is clear early on. (Proceed to generate output).

  9.  *(Final thought before generating)*: Make sure to explicitly answer the user's specific question: "Is this a fair summary?" The answer is "It is a fair summary of the *strongest* version used by critics, but an unfair summary of how the principle is actually applied in most policy contexts."

