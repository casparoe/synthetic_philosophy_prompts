answer: |-
  ### The Inefficacy Diagnostic (12-Node Flowchart)

  **START:** We agree your individual act makes no detectable difference to the outcome.

  **Q1:** Does that fact alone settle the moral question (i.e., no difference = no obligation)?
  *   **YES** → **LEAF 1: Inefficacy Exemption**
      *   *Awkward Commitment:* You must watch harm happen if stopping it requires you to be pivotal.
  *   **NO** → **Q2**

  **Q2:** If you abstain, will your seat/steak/vote simply be taken or used by someone else?
  *   **YES (Substitution)** → **Q3**
  *   **NO (Additive)** → **Q4**

  **Q3:** Even if the outcome is identical, does joining the practice make you *tainted* by the harm?
  *   **YES** → **LEAF 2: Complicity Theory**
      *   *Awkward Commitment:* You are responsible for the stain on your hands, not the dirt on the ground.
  *   **NO** → **LEAF 3: Integrity/Expressivism**
      *   *Awkward Commitment:* Your action is a statement of identity, not a tool for repair.

  **Q4:** Is the obligation primarily on the *group* (e.g., "voters"), distributed to you even if you don't pivot the result?
  *   **YES** → **LEAF 4: Collective Obligation**
      *   *Awkward Commitment:* You owe a duty to do your share even when your share is futile.
  *   **NO** → **Q5**

  **Q5:** Do you count a 0.0001% chance of changing the outcome as a real "difference" that matters?
  *   **YES** → **LEAF 5: Expected Utility**
      *   *Awkward Commitment:* You must treat a one-in-a-million catastrophe as a certain small harm.
  *   **NO** → **LEAF 6: Threshold Deontology**
      *   *Awkward Commitment:* You are permitted to ignore the harm until you are powerful enough to stop it.

  ***

  ### Diagnostic Notes

  **1. Indistinguishable Leaves**
  **Leaf 2 (Complicity)** and **Leaf 3 (Integrity)** cannot be genuinely separated by this tree in terms of *action*. Both prescribe abstention in all three cases (fly, beef, vote) despite inefficacy. They differ only in the internal story: Leaf 2 worries about *causal participation* in a bad system (guilt), while Leaf 3 worries about *self-constitution* (virtue). In a club debate about what to *do*, they will always vote the same way; the split is purely theological.

  **2. Unoccupied Combinations**
  **Q2=YES (Substitution) + Q5=YES (Expected Utility).**
  Nobody occupies this corner. It is likely **incoherent**. If you believe substitution is perfect (your seat *will* be filled), the probability of your act changing the outcome is zero. You cannot logically claim "my act changes nothing" (Q2) while simultaneously claiming "there is a non-zero expected utility to my act" (Q5). Those who argue Expected Utility (Leaf 5) almost always deny perfect substitution (answering NO at Q2), insisting that markets or tallies are sensitive to marginal demand.

  **3. Usage Guide**
  *   **The Hydrologist:** If he answers NO at Q1, YES at Q2, and NO at Q3, he is an **Integrity Expressivist**. He doesn't think he'll save the Alps; he just doesn't want to be the kind of climber who flies.
  *   **The Political Member:** If she answers NO at Q1, NO at Q2, and YES at Q4, she is a **Collective Obligation** theorist. She votes not to win, but because "voters" is a team she belongs to.
  *   **The Skeptic:** If he answers YES at Q1, he is at **Leaf 1**. No amount of philosophy will move him; he requires a causal lever.
