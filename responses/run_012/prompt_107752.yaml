answer: |-
  ### Pedagogical Verdicts

  **1. The Backwards Order (Exits First)**
  This order can be made to work, but it carries a specific risk: students may mistake the *exceptions* for the *rule*. If you begin with the Median Voter Theorem or Two-Alternative Majority, students often conclude that "voting works fine usually," treating Gibbard–Satterthwaite (GS) as a niche technicality rather than a general impossibility.
  *   **Where they lose the thread:** The transition from "Here are cases where strategy-proofness is possible" to "Here is why it is impossible everywhere else." The logical gap is the **Unrestricted Domain** condition. Students will understand the Median Voter example, but they will not immediately grasp why moving from single-peaked preferences to unrestricted preferences breaks everything.
  *   **The Fix:** You must define the "Ideal Goal" (Strategy-Proofness + Unrestricted Domain + 3+ Alternatives + Surjectivity) in the first ten minutes. Frame the "Exits" not as "ways voting works," but as "necessary compromises on the Ideal." The theorem then emerges not as a surprise, but as the proof that the list of compromises is exhaustive.

  **2. The Equilibrium Weakening (DS vs. NE)**
  Your position is correct and should be maintained. Moving from Dominant Strategies (DS) to Nash Equilibrium (NE) does escape the impossibility result (e.g., majority rule is NE-implementable), but it purchases possibility at the cost of **belief robustness**.
  *   **Why:** DS implementation is "detail-free"; a voter tells the truth regardless of what they think others will do. NE implementation requires common knowledge of preferences (or beliefs) to sustain the truth-telling equilibrium. If a voter's belief about others is slightly wrong, truth-telling may no longer be a best response.
  *   **Placement:** Introduce this during the "Exits" section, specifically when discussing the second exit (weakening incentives). Frame it as trading *robustness* for *possibility*. It is not a triumph because it shifts the burden from the mechanism designer to the information structure of the voters.

  ### The Carrying Example

  **Use the "Seminar Scheduling" Problem (3 Voters, 3 Alternatives).**
  Do not avoid the 3x3 case. It is the minimal environment required for the theorem to hold ($|A| \geq 3$). Anything simpler (2 alternatives) validates an exit, not the theorem. Anything larger creates unnecessary cognitive load.
  *   **The Setup:** Three faculty members (Alice, Bob, Charlie) must choose a seminar time: Monday, Wednesday, or Friday.
  *   **Why this works:** It is concrete enough for philosophers to grasp the preferences and simple enough for economists to calculate deviations. It allows you to demonstrate a Condorcet cycle easily (Alice: M > W > F, Bob: W > F > M, Charlie: F > M > W), which is essential for explaining why domain restriction (the first exit) matters.
  *   **Requirement:** You must write out the preference profiles on the board. Do not keep them abstract.

  ---

  ### Session Plan (90 Minutes)

  **00:00 – 10:00 | The Ideal and The Definition**
  Start by defining the object of study: a Social Choice Function (SCF) that maps preference profiles to a single winner. State the "Ideal Goal" immediately: We want a rule that is (1) Strategy-Proof (DS), (2) Unrestricted Domain, (3) At least 3 Alternatives, and (4) Surjective (every option can win).
  *   **Crucial Distinction:** Define Strategy-Proofness *strictly* as a worst-case property of the rule. "A rule is manipulable if there *exists* a situation where a voter *can* gain by lying." Explicitly state: "This is not a claim that voters *will* lie, nor that they *know* they can lie. It is a claim about the vulnerability of the mechanism."
  *   **Intervention:** Head off the misconception that Strategy-Proofness predicts honest behavior. If a student asks, "But wouldn't they just tell the truth?" reply: "The theorem doesn't care what they do. It cares whether the rule *rewards* them if they don't."

  **10:00 – 35:00 | The Exits (The Compromises)**
  Present the four "Exits" as ways to satisfy Strategy-Proofness by sacrificing one condition of the Ideal Goal. Use the Seminar Example throughout.
  1.  **Exit 1: Restricting Domain (15 mins).** Show that if preferences are single-peaked (e.g., times ordered M-W-F and no one prefers F to M to W), the Median Voter rule is strategy-proof. *Point:* We saved strategy-proofness by killing Unrestricted Domain.
  2.  **Exit 2: Weakening Incentives (10 mins).** Discuss moving from DS to Nash Equilibrium. *Point:* We saved non-dictatorial rules, but we lost belief-free robustness. (Insert your substantive point here: this is a trade, not a triumph).
  3.  **Exit 3: Randomization (5 mins).** Briefly mention that allowing probabilistic outcomes opens possibilities (Gibbard 1977), but sacrifices determinism.
  4.  **Exit 4: Two Alternatives (5 mins).** Show simple majority works. *Point:* We saved democracy by killing the 3+ Alternatives condition.
  *   **Transition:** Ask: "What if we refuse all these exits? What if we demand DS, Unrestricted Domain, 3+ Alts, and Surjectivity?"

  **35:00 – 55:00 | The Theorem (Closing the Exits)**
  State the Gibbard–Satterthwaite Theorem: If you refuse all exits, the only strategy-proof rule is a Dictatorship.
  *   **Define Dictatorship:** "A rule is dictatorial if there exists one voter such that, for *every* profile, the outcome is their top choice."
  *   **Intervention:** Head off the "Political Dictator" misconception immediately. Emphasize this is a *formal* property of the function, not a claim about political power. A dictator in this sense might not even know they are one; the rule just happens to track their preferences perfectly.
  *   **The Range Condition:** Address the "ignore reports" counterexample here. If a rule always chooses 'Monday' regardless of votes, it is strategy-proof but not surjective. Explain that we care about rules that actually *decide* between live options. This justifies the Surjectivity/Range condition.

  **55:00 – 75:00 | Manipulability vs. Behavior (The Core Distinction)**
  This is the conceptual pivot. Return to the Seminar Example. Construct a profile where the rule is manipulable, but no voter manipulates.
  *   **Scenario:** Suppose the rule is Borda Count (known to be manipulable). In a specific profile, Alice *could* gain by lying, but she doesn't know Bob's preferences, so she plays safe and tells the truth.
  *   **Discussion:** "Is this rule bad?" Economists might say "No, equilibrium is honest." Philosophers might say "Yes, it permits exploitation."
  *   **Verdict:** Reinforce that GS is a *robustness* result. It tells us the rule *allows* manipulation, not that it *causes* it. A strategy-proof rule can still produce outcomes that look like maneuvering (e.g., a dictator's whim), and a manipulable rule can produce honest outcomes. The theorem is about the *structure of incentives*, not the *psychology of voters*.
  *   **Intervention:** Head off the "Counsel of Despair" misconception. GS does not say "democracy is impossible." It says "democracy requires compromise." We must choose an Exit (e.g., accept some manipulability or restrict the agenda).

  **75:00 – 85:00 | Arrow vs. GS and Proof Black-Box**
  *   **Arrow Distinction:** Briefly clarify: Arrow is about ordering social welfare (rankings); GS is about choosing a winner (choices). Arrow assumes IIA and Unanimity; GS assumes Strategy-Proofness. They are cousins, not twins.
  *   **Refusal:** Do not explain the proof (pivotal voter logic). Say: "The proof relies on identifying a 'pivotal' voter who changes the outcome. It is technical and does not add to the conceptual takeaway about incentives. We treat the proof as a black box that guarantees the list of Exits is exhaustive."

  **85:00 – 90:00 | Closing Task**
  Distribute a single slip of paper.
  *   **Task:** "Consider a voting rule that is manipulable. In a specific election, no voter has an incentive to lie given their beliefs about others. (A) Is the rule manipulable? (B) Did strategic voting occur? (C) Does the Gibbard–Satterthwaite theorem imply this rule is dictatorial?"
  *   **Goal:** You are testing if they separate the *property of the rule* (A: Yes) from the *behavior in the situation* (B: No) and the *conditions of the theorem* (C: No, not necessarily, unless all exits are closed).

  ---

  ### Misconception Log & Interventions

  1.  **Formal Dictatorship = Political Tyranny.**
      *   *Surface:* When stating the theorem (Min 35).
      *   *Intervention:* "A formal dictator is a voter whose top choice always wins. They may be unaware of this power. The rule might be a historical accident. Do not import normative baggage."
  2.  **GS = Arrow's Impossibility.**
      *   *Surface:* During hypotheses discussion (Min 55).
      *   *Intervention:* "Arrow ranks societies; GS picks winners. Arrow uses IIA; GS uses Strategy-Proofness. They reach similar bleak conclusions via different routes."
  3.  **Strategy-Proofness = Honest Reporting.**
      *   *Surface:* At Definition (Min 05) and Closing Task (Min 85).
      *   *Intervention:* "Strategy-proofness means honesty is a *dominant strategy*. It does not mean people *are* honest. It means they have no *reason* to be dishonest."
  4.  **The Exits are "Free".**
      *   *Surface:* During Exits section (Min 10-35).
      *   *Intervention:* "Restricting domain requires an agenda setter. Weakening to NE requires common knowledge. These are costly institutional constraints, not free lunches."
  5.  **Counsel of Despair.**
      *   *Surface:* Conclusion (Min 75).
      *   *Intervention:* "The theorem does not ban democracy. It bans *perfectly robust, unrestricted, non-dictatorial* democracy. We live in the world of the Exits. That is where design happens."

  ### What to Refuse to Explain

  1.  **The Proof Mechanics:** Do not derive the pivotal voter.
      *   *Marking the Refusal:* "The proof is a combinatorial exercise in tracking how changing one vote changes the outcome. It confirms the Exhaustion of Exits, but it does not illuminate the economic intuition. We will take the result as given."
  2.  **Gibbard (1973) vs. Satterthwaite (1975):** Do not distinguish the contributions.
      *   *Marking the Refusal:* "For our purposes, the theorem is a single unit. The history of discovery does not change the logical constraints."
  3.  **Bayesian Implementation:** Do not go deeper into the equilibrium weakening beyond the common knowledge trade-off.
      *   *Marking the Refusal:* "Further weakening the solution concept enters the realm of Bayesian implementation, which depends on specific prior distributions. That moves us from robustness to specificity, which is outside the scope of this impossibility result."
