      (Self-Correction on Case 3): "Class of agents... swells to include every firm." This dilutes the correlation. If I reason X, does a random firm reading the same press reason X? No. So $P$ drops.

      *Final Polish:* Ensure the distinction between "Incentives" and "Reasoning" is sharp. Incentives are the payoff matrix. Reasoning is the function mapping evidence to action.

