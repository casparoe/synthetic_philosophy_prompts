answer: |-
  ### The Symmetry Audit: A Decision Procedure for Logical Correlation

  The argument you describe relies on **Logical Correlation**, not Causal Influence. It posits that if your decision and your competitors' decisions are outputs of the same function (reasoning process) applied to the same input (public evidence), then changing your output implies changing theirs. This is not magic; it is prediction based on structural identity.

  However, in the real world, no two firms are identical algorithms. This procedure quantifies that similarity to determine if the "Logical Correlation" argument holds water or if you should revert to standard self-interested defection.

  #### Phase 1: The Gatekeeping Conditions
  Before running the calculation, you must establish that the situation allows for logical correlation. If these three conditions are not met, the argument fails, and you should defect (hold back data) to minimize individual risk.

  1.  **Payoff Isomorphism:** The reward for mutual cooperation and the penalty for mutual defection must be roughly equivalent across the group. If one firm gains 10x more from the database than another, their reasoning function will weigh the inputs differently.
  2.  **Informational Equivalence:** All parties must have access to the same public evidence. If one firm has private intelligence about the database's utility or the others' financial health, their input data differs, breaking the symmetry.
  3.  **Decision Authority Structure:** The decision must be made by agents with similar constraints and incentives (e.g., CEO/Co-founder dyads vs. a committee vs. a single autocrat). Different governance structures process risk differently.

  **Test for Reasoning vs. Incentives:**
  To tell if a counterparty is driven by *your* reasoning rather than just *similar* incentives, look for **deviation history**.
  *   *Incentive-driven:* They always maximize short-term cash flow regardless of industry norms.
  *   *Reasoning-driven:* They follow industry best-practices even when short-term costs are high, provided they believe others will too.
  *   *Action:* Review the last three industry-wide voluntary initiatives. Did they participate at the same rate as you? If yes, reasoning is correlated. If no, incentives dominate, and symmetry is broken.

  ---

  #### Phase 2: The Ordered Questions
  If Phase 1 is passed, proceed to this calculation. You must answer these sequentially. If you cannot answer a question, the procedure halts (see Phase 4).

  **Q1: What is the Reference Class?**
  *   *Definition:* The specific set of agents whose decision-making process you believe is identical to yours.
  *   *Sufficient Answer:* A named list of firms (e.g., "The other five mid-sized firms"). It cannot be "the industry" or "everyone reading the press." It must be firms with similar size, stake, and governance.
  *   *Failure:* If you cannot name them specifically, symmetry is too vague. Defect.

  **Q2: What is the Correlation Coefficient ($P$)?**
  *   *Definition:* The probability that a firm in your Reference Class will make the *same* choice as you, conditional on you making that choice based on this reasoning.
  *   *Sufficient Answer:* A percentage derived from the "deviation history" in Phase 1.
      *   High Symmetry (Same hires, same board structure, same history): $P \geq 0.8$
      *   Medium Symmetry (Same incentives, different culture): $0.5 \leq P < 0.8$
      *   Low Symmetry (Different stakes, different risk tolerance): $P < 0.5$
  *   *Failure:* If $P$ is pure guesswork (<0.5 without evidence), Defect.

  **Q3: What is the Break-Even Threshold?**
  *   *Definition:* The minimum $P$ required to make Contributing more valuable than Holding.
  *   *Calculation:*
      *   Let $V_{mutual}$ = Value if everyone contributes.
      *   Let $V_{free}$ = Value if you hold, others contribute (Free-ride).
      *   Let $V_{sucker}$ = Value if you contribute, others hold (Wasted effort).
      *   Let $V_{none}$ = Value if everyone holds (Status quo).
      *   *Contribute EV:* $P \times V_{mutual} + (1-P) \times V_{sucker}$
      *   *Hold EV:* $P \times V_{free} + (1-P) \times V_{none}$
      *   *Threshold:* Solve for $P$ where Contribute EV > Hold EV.
  *   *Sufficient Answer:* A specific number (e.g., "I need a 60% correlation to justify the cost").

  **Q4: Is the Class Boundary Stable?**
  *   *Definition:* Does adding or removing one firm from the Reference Class change the outcome?
  *   *Sufficient Answer:* "No." If including a marginal firm swings the decision from Contribute to Hold, your class definition is arbitrary. Narrow the class to the core symmetric agents.

  ---

  #### Phase 3: Handling Ambiguity

  **Partial Symmetry ($P < 1.0$):**
  Never assume $P=1.0$. Real-world noise exists. Use the $P$ derived in Q2. If $P$ is above your Break-Even Threshold (Q3), Contribute. If below, Hold. Do not round up based on hope.

  **Differing Stakes:**
  If a firm in the Reference Class has significantly different stakes (e.g., the database is 10% of their revenue but 1% of yours), they are **not** in your Reference Class. Remove them from Q1. Their reasoning function is weighted differently. Do not treat them as "you."

  **Ambiguous Agent Class:**
  If you cannot distinguish between "firms like us" and "firms reading the same news," you have failed Q1. In this state, you cannot claim logical control over the group. You must assume $P$ is low (random noise). Default to Hold.

  ---

  #### Phase 4: Running the Procedure

  Here is the procedure applied to your three requested cases.

  **Case 1: The Base Scenario (Six Mid-Sized Firms)**
  *   **Phase 1:** Payoffs are isomorphic (all need the data equally). Information is public. Governance is similar (Founder-led). *Pass.*
  *   **Q1 (Class):** The other five specific firms.
  *   **Q2 (Correlation):** You all hire from the same three MBA programs, read the same analyst reports, and face the same board pressures. Historical deviation is low. Estimate $P = 0.85$.
  *   **Q3 (Threshold):** Contributing costs \$100k. Mutual contribution yields \$500k value each. Free-riding yields \$600k (gain + no cost). Sucker yields -\$100k. Status quo yields \$0.
      *   Contribute EV: $0.85(500) + 0.15(-100) = 425 - 15 = 410$.
      *   Hold EV: $0.85(600) + 0.15(0) = 510$.
      *   *Wait:* In a standard Prisoner's Dilemma, Hold is dominant. But under Logical Correlation, if you Hold, they Hold (85% chance).
      *   *Corrected Hold EV:* If you decide "Hold", the logic dictates they decide "Hold". So $V_{free}$ is impossible. You get $V_{none}$.
      *   *Revised Calculation:*
          *   If I run algorithm "Cooperate": 85% chance they run "Cooperate". EV = $0.85(500) + 0.15(-100) = 410$.
          *   If I run algorithm "Defect": 85% chance they run "Defect". EV = $0.85(0) + 0.15(600) = 90$. (Note: The 15% is where they cooperate despite you defecting).
      *   *Result:* 410 > 90.
  *   **Decision:** **Contribute.**
  *   **Unwelcome Conclusion:** This result may feel like a "trick." Your causal intuition screams that your data contribution *cannot physically force* them to contribute. You are bearing a real cost (\$100k) based on a metaphysical link. The procedure demands you pay it anyway. If you are risk-averse, this conclusion will feel dangerous.

  **Case 2: The Asymmetric Stake (The Largest Firm)**
  *   **Phase 1:** The largest firm has 10x the market share. The database is critical for them, optional for you. Payoff Isomorphism fails.
  *   **Q1 (Class):** You must exclude the Largest Firm. They are not running your algorithm; they are running a "Market Dominance" algorithm.
  *   **Q2 (Correlation):** With the Largest Firm excluded, you are left with 4 mid-sized firms. However, the value of the database ($V_{mutual}$) depends on the Largest Firm's data. If they defect, $V_{mutual}$ drops by 80%.
  *   **Q3 (Threshold):** You must estimate the Largest Firm's move independently (Causal Decision Theory). If they defect (likely, as they have leverage), the database is worthless.
  *   **Decision:** **Hold.**
  *   **Reasoning:** The symmetry argument only works on agents *like you*. It cannot control the Giant. Since the Giant's participation is required for the value you seek, and you cannot logically correlate with the Giant, the expected value of the database collapses. You save your \$100k.

  **Case 3: The Over-Broad Class (Trade Press Readers)**
  *   **Phase 1:** Informational Equivalence holds (everyone reads the press). Payoff Isomorphism fails (hundreds of firms, different sizes).
  *   **Q1 (Class):** "Every firm that reads the trade press."
  *   **Q2 (Correlation):** This class includes startups, giants, and competitors in adjacent niches. Their reasoning processes are diverse. Estimate $P = 0.10$.
  *   **Q3 (Threshold):** Using the math from Case 1:
      *   Contribute EV: $0.10(500) + 0.90(-100) = 50 - 90 = -40$.
      *   Hold EV: $0.10(600) + 0.90(0) = 60$.
  *   **Decision:** **Hold.**
  *   **Reasoning:** Diluting the reference class destroys the logical correlation. You are not controlling the output of a random firm reading a magazine. To act as if you are is altruism, not strategy.

  ---

  #### Phase 5: Limitations and Hand-Off

  This procedure cannot settle the decision in the following scenarios. When you encounter them, the math stops, and the judgment call returns to you.

  1.  **Existential Stakes:** If contributing threatens your firm's solvency (e.g., $V_{sucker}$ is bankruptcy), the procedure halts. No amount of logical correlation justifies suicide. You must Hold, even if $P=1.0$.
  2.  **Undefined Reference Class:** If you genuinely cannot determine who reasons like you (e.g., a new industry with no history), $P$ is unknowable. The procedure hands back to **Causal Decision Theory**: Defect.
  3.  **Moral Valuation:** The procedure calculates Expected Value based on your inputs. It cannot tell you if you *should* value the industry's health over your firm's short-term profit. If you input a high value for "Industry Health," it will say Contribute. If you input "Shareholder Value Only," it may say Hold. The procedure optimizes; it does not moralize.

  **Where the Procedure Fails You:**
  In **Case 1**, the procedure likely told you to **Contribute**. This is the "unwelcome conclusion" for a skeptic. It requires you to trust that your reasoning is mirrored in others without evidence of communication. It asks you to act on a *counterfactual* (If I were to defect, they would too) rather than a *causal* reality (My defection does not stop them).

  If you cannot stomach the idea that your private thought process exerts "control" over a competitor's boardroom, the procedure's foundation crumbles. In that moment, you are no longer running a Symmetry Audit; you are making a philosophical bet on the nature of decision-making itself. If you lose that bet, you have paid \$100k for nothing but peace of mind. That risk is yours alone to carry.
