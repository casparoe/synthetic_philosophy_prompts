  # HANDOUT: ADVERSARIAL COLLABORATION ON GOODMAN'S NEW RIDDLE
  **Working Group on Induction and Projectibility**
  **Subject:** The Status of the Grue Paradox
  **Date:** October 2023

  ## PREAMBLE
  This document represents the output of an adversarial collaboration between two philosophical camps regarding Nelson Goodman's "New Riddle of Induction."
  *   **Camp A (Bayesian Dissolutionists):** Holds that the riddle is dissolved by formal epistemology. The asymmetry between *green* and *grue* is handled by prior probabilities and language choice.
  *   **Camp B (Entrenchment Theorists):** Holds that the riddle identifies a genuine feature of inductive practice. The asymmetry is explained by the history of usage (entrenchment), which Bayesian priors merely presuppose.

  Both parties agree that the goal is not to "defeat" the other side, but to map the exact topology of the disagreement for the benefit of the reading group.

  ---

  ## 1. AGREED CLAIMS
  *The following propositions are accepted by both Camp A and Camp B.*

  1.  **Logical Symmetry:** There is no logical or formal semantic difference between the predicate *green* and the predicate *grue*. *Green* can be defined in terms of *grue* and *bleen* (relative to a time $t$) just as *grue* can be defined in terms of *green* and *blue*.
  2.  **Language Relativity of "Disjunction":** Whether a predicate counts as "disjunctive" or "gerrymandered" is not a language-independent property of the predicate. In a language where *grue* and *bleen* are primitive, *green* is the disjunctive, complex predicate.
  3.  **The Humean Residue:** Both camps agree that Goodman's riddle does not solve Hume's problem. Even if we agree on which predicates are projectible, there remains no non-circular justification for why the future should resemble the past. Goodman adds a constraint on *which* respects of resemblance matter, but does not justify induction itself.
  4.  **Empirical Underdetermination:** Observations of green emeralds prior to time $t$ are logically compatible with both the hypothesis "All emeralds are green" and "All emeralds are grue." Data alone, without background constraints, cannot distinguish them.
  5.  **Failure of Pure Syntax:** A solution cannot be found solely in the syntactic form of the hypothesis. There is no formal rule that filters out *grue*-like hypotheses while retaining *green*-like hypotheses without referencing semantics or usage.

  ---

  ## 2. THE DISAGREEMENTS
  *Each camp states its core position in its own terms. The other camp accepts this as a fair statement of the opponent's view.*

  ### Camp A (Bayesian Dissolutionist)
  "The New Riddle is not a problem about induction, but a problem about model specification. Once an agent assigns credences over hypotheses, *grue* is simply a hypothesis with an exceedingly low prior probability compared to *green*. This is not circular; it is a reflection of the fact that *green* offers a more compact description of the world's regularities. The Bayesian framework absorbs the riddle: the asymmetry lies in the agent's state of belief (the priors), not in the logic of confirmation. What remains is a pragmatic question of which language minimizes coding length, plus the standard Humean acknowledgment that priors cannot be justified a priori."

  ### Camp B (Entrenchment Theorist)
  "The Bayesian move relocates the mystery without solving it. To assign a higher prior to *green* than *grue* is to presuppose the very distinction Goodman asked us to justify. Priors are not brute facts; they are sedimentations of past inductive success. What does the real work is **entrenchment**: a predicate is projectible because it has been successfully projected in the past. This is not a fact about the world's metaphysical structure, nor is it merely a subjective preference. It is a fact about our linguistic and cognitive practices. The riddle shows that projectibility is a status earned by predicates through usage, not a property they possess inherently."

  ---

  ## 3. THE CRUXES
  *Specific points of contention where the camps diverge on explanation and prediction.*

  ### Crux 1: The Locus of Projectibility
  **Question:** To what does projectibility attach?
  *   **Camp A:** It attaches to **hypotheses relative to an agent's representation**. A hypothesis is projectible if it compresses data efficiently given the agent's coding scheme.
  *   **Camp B:** It attaches to **predicates relative to a history of practice**. A predicate is projectible if it has a lineage of successful use.

  **Agreed Test Consideration:**
  Consider a novel predicate *zork*, defined by a complex physical property never before named or tracked, which happens to carve nature at its joints (e.g., a specific quantum spin state).
  *   **Camp A Prediction:** *Zork* is immediately projectible for an agent who recognizes its simplicity/compression value, even without a history of usage.
  *   **Camp B Prediction:** *Zork* is not projectible until it has been adopted into a practice and used to make successful predictions. Until then, it is merely a definition.

  ### Crux 2: The Source of the Constraint
  **Question:** Is the preference for *green* over *grue* a contingent fact about us, or a fact about the world we are tracking?
  *   **Camp A:** It is a **pragmatic fact about compression**. We prefer *green* because our cognitive architecture and scientific languages evolved to track stable, simple regularities. If the world were chaotic, no predicate would be projectible.
  *   **Camp B:** It is a **constitutive fact about lawhood**. Entrenchment is not just psychological; it determines what counts as a law. A regularity involving unentrenched predicates does not qualify as a law, regardless of the world's structure.

  **Agreed Test Consideration:**
  Imagine a community of speakers who have *always* spoken *Grue-ese* (where *grue* and *bleen* are primitive) and have no history of *green/blue*.
  *   **Camp A Prediction:** If their environment is stable, their priors will favor *grue*. Their "green" (the disjunctive one) will have low prior. The asymmetry is relative to the language game.
  *   **Camp B Prediction:** Even if they speak *Grue-ese*, if their projections fail after time $t$, they will abandon *grue*. Entrenchment tracks success. If *grue* works for them, it is entrenched. If it fails, it isn't. The language doesn't fix the projectibility; the success of the practice does.

  ---

  ## 4. CASE STUDY: THE 2035 URN FORECAST
  *Both camps analyze the following scenario.*

  **The Setup:**
  A lab locks in a forecast about a ball drawn from an urn in the year 2035. Two induction engines are fed identical observations of balls drawn from 2020–2030. All balls are green.
  *   **Engine 1 (Green/Blue Basis):** Represents observations using standard color predicates.
  *   **Engine 2 (Grue/Bleen Basis):** Represents observations using *grue* (green before 2035, blue after) and *bleen*.
  *   **The Event:** In 2035, a ball is drawn.

  **Camp A Analysis:**
  *   **Prediction:** Engine 1 is more likely to be right *in our actual context*.
  *   **Reasoning:** Engine 1's representational basis aligns with the natural simplicity of the actual data-generating process. Engine 2 is using a basis that introduces unnecessary complexity (a time-dependent switch) which is penalized by Occam's Razor in the prior.
  *   **Relevance:** This case shows that the "Grue Problem" is just a model selection problem. Engine 2 isn't logically wrong; it's just overfitting the time parameter.

  **Camp B Analysis:**
  *   **Prediction:** Engine 1 is more likely to be right.
  *   **Reasoning:** Engine 1 uses predicates that are entrenched in the scientific practice governing the urn. Engine 2 uses predicates with no history of projection in this context. The failure of Engine 2 is not due to "complexity" but due to the lack of a projective lineage for *grue* regarding urns.
  *   **Relevance:** This case shows that induction is not a formal engine that works on any data; it requires a pre-selected vocabulary validated by practice.

  **Joint Assessment of the Case:**
  Both camps agree Engine 1 wins. They disagree on *why*.
  *   **Camp A:** Engine 1 wins because *green* is a simpler hypothesis.
  *   **Camp B:** Engine 1 wins because *green* is a more entrenched predicate.
  *   **Verbal Dispute Check:** Camp A suspects "entrenchment" is just Camp B's word for "high prior derived from historical data." Camp B suspects "simplicity" is just Camp A's word for "entrenchment disguised as logic."

  ---

  ## 5. IDENTIFICATION OF VERBAL DISPUTE
  *Where are we talking past each other?*

  We identify a significant verbal dispute regarding the term **"Prior."**

  *   **For Camp A,** a prior is a formal parameter in a probability distribution. It can be set arbitrarily or by principles of indifference/simplicity. It is the *starting point* of the analysis.
  *   **For Camp B,** what Camp A calls a "prior" is actually the *output* of a historical process of entrenchment.

  **Resolution Attempt:**
  If Camp A admits that "Simplicity" priors are ultimately justified by the historical success of simple predicates in our environment, they move toward Camp B.
  If Camp B admits that "Entrenchment" functions mathematically exactly like a high prior probability that updates over time, they move toward Camp A.

  **Remaining Substantive Dispute:**
  The dispute remains substantive on the question of **normativity**.
  *   **Camp A** believes we *ought* to choose priors that maximize predictive accuracy (which happens to favor *green*).
  *   **Camp B** believes we *ought* to project entrenched predicates because that is what constitutes reasoning itself. To project *grue* is not just inaccurate; it is a violation of the rules of inductive practice.

  ---

  ## 6. READING GROUP DISCUSSION QUESTIONS
  1.  Does the Urn Case demonstrate that the Grue problem is merely a problem of computational efficiency (Camp A), or does it demonstrate that induction is impossible without a pre-existing normative practice (Camp B)?
  2.  If a community of *Grue-ese* speakers successfully predicts the 2035 draw using *grue*, does that vindicate Camp A's symmetry claim or Camp B's pragmatic claim?
  3.  Is the "Humean Residue" (Agreed Claim #3) truly separable from the Goodmanian problem, or does solving projectibility dissolve Hume's worry by showing induction is rule-governed rather than justification-seeking?
