      *   **Section 2: The Disagreements (The Split):**
          *   *Camp A (Bayesian):* Focus on the *state of belief*. The puzzle is solved by modeling the agent. Grue is just a complex hypothesis.
          *   *Camp B (Entrenchment):* Focus on the *history of usage*. Priors don't explain *why* we have them. Entrenchment explains the priors.
          *   *Constraint:* Must be worded so each side accepts it as their view.

      *   **Section 3: The Cruxes (The Deep Dives):**
          *   *Crux 1: Locus of Projectibility.* Is it the predicate, the hypothesis, or the practice?
