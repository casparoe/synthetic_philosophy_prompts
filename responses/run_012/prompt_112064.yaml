              *   B: It's a property of the predicate relative to linguistic history.
          *   *Crux 2: Source of Constraint.* Contingent fact about us vs. Tracking the world.
              *   A: It's pragmatic efficiency (compression).
              *   B: It's constitutive of what counts as a "law."
          *   *Requirement:* Need a case/consideration for each.

      *   **Section 4: The Urn/2035 Case (The Thought Experiment):**
          *   *Setup:* Two engines, same data, different bases.
          *   *Camp A Prediction:* The Green engine wins *if* the prior reflects the actual structure of the environment (or simplicity). But formally, if the Grue engine has the "right" priors for *its* language, it converges. However, in *our* world, Green is simpler.
          *   *Camp B Prediction:* The Green engine wins because "green" is entrenched. The Grue engine is using a predicate with no projection history.
          *   *Relevance:* A might say the case is trivial (of course the simpler model wins). B says it's essential (shows practice dictates success).

      *   **Section 5: The Verbal Dispute:**
