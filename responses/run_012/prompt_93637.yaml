      *   *Caveat:* Unlike Hans, the "questioner" isn't involuntarily cueing the model in real-time (usually). The "cue" is in the training data. So the "blinders" test is about data isolation vs. architectural generalization.

  7.  **Drafting the Response (Iterative refinement for tone and precision):**
