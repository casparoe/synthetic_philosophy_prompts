          *   *Verdict:* The controls show that the behavioral criterion was *defeasible*. Pure behaviorism fails because the *same* behavior can arise from non-mental causes.

  4.  **Part 2: Evaluating the User's Hypothesis:**
      *   *Hypothesis:* POM is a family; difficulty $\propto$ 1/(availability of non-mental mechanism).
