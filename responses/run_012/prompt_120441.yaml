      *   **Motivation:** Data 1 and 7 distinguish between being "out of step" (irrational/false belief) and logical contradiction (falsehood).
      *   **Status:** Non-negotiable.

  2.  **Doxastic Possibility**
      *   **Requirement:** The account must explain whether sentence 1 can be believed, engaging the formal fact that belief distributes over conjunction to make the content belief-refuting.
      *   **Motivation:** Data 1 and the Formal Fact (believing the conjunction makes the second conjunct false).
      *   **Status:** Non-negotiable.

  3.  **Omissive vs. Commissive Distinction**
      *   **Requirement:** The account must explain what separates the defect in sentence 1 (omissive) from sentence 2 (commissive).
      *   **Motivation:** Data 1 and 2 exhibit different logical profiles despite similar absurdity.
      *   **Status:** Non-negotiable.

  4.  **Person and Tense Sensitivity**
      *   **Requirement:** The account must explain why the defect disappears in third-person (4) and past-tense (5) variants.
      *   **Motivation:** Data 4 and 5 are unremarkable compared to Data 1.
      *   **Status:** Non-negotiable.

  5.  **Embedding Uniformity**
      *   **Requirement:** The account must provide a single explanation for which embeddings cancel the absurdity (e.g., 6) and which retain it (e.g., 8), covering the pattern uniformly.
      *   **Motivation:** Data 6 and 8 show varied behavior under embedding that requires a unified theory.
      *   **Status:** Non-negotiable.

  6.  **Knowledge Variant Classification**
      *   **Requirement:** The account must determine whether sentence 3 belongs to the same phenomenon as sentence 1.
      *   **Motivation:** Data 3 substitutes knowledge for belief, testing the scope of the phenomenon.
      *   **Status:** Non-negotiable.

  7.  **Gradability of Absurdity**
      *   **Requirement:** The account should accommodate the intuition that the probability case in 8 is worse than the possibility case, and that the credal case in 9 is mild rather than absurd.
      *   **Motivation:** Data 8 and 9 suggest degrees of defect rather than a binary switch.
      *   **Status:** Preference of one camp.

  8.  **Non-Believing Agents**
      *   **Requirement:** The account must explain why sentence 10 printed by a weather station is not absurd.
      *   **Motivation:** Data 10 stipulates a non-believing, non-asserting agent.
      *   **Status:** Non-negotiable.

  9.  **Fallibilism Constraint**
      *   **Requirement:** The account must not rest on infallible knowledge of one's own beliefs to explain the defect.
      *   **Motivation:** User constraint to preserve the ordinary possibility of being wrong about oneself.
      *   **Status:** Non-negotiable.

  10. **Third-Party Assertion**
      *   **Requirement:** The account must explain the status of sentence 11 where a second speaker asserts the contradiction about the first.
      *   **Motivation:** Data 11 separates the believer from the asserter.
      *   **Status:** Non-negotiable.

  **Tension Flag:** I flag **R4** and **R5** as a pair that cannot be jointly satisfied without significant theoretical cost. R4 requires the defect to be sensitive to the specific context of the speaker (indexicality of person and tense), while R5 requires a uniform explanation across embeddings that typically shift or suspend context. Accounts that secure R4 via indexicality often fail R5 because embeddings alter the index; accounts that secure R5 via semantic scope often fail R4 because the scope logic applies equally to third-person and past-tense cases.

  **Most Exclusionary Requirement:** **R9** does the most to exclude candidate accounts. It excludes any account that relies on **Epistemic Transparency** or **Luminosity** principles (the view that if one believes $p$, one necessarily knows one believes $p$). Such accounts typically explain the absurdity by arguing that believing the conjunction entails knowing the second conjunct is false, generating a contradiction in knowledge. R9 forbids this move, forcing the account to locate the defect in the structure of belief or assertion norms rather than in privileged self-knowledge.

  \answer{R9: No Infallibility | unsatisfiable pair: R4, R5}
