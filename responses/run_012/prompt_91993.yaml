answer: |-
  # Verdict

  Ines will likely rule that the valley residents are **out** of the demos. Her prior verdicts consistently prioritize jurisdictional membership and shared social status over the magnitude of external consequences.

  # Rules still standing

  **Residential Membership** holds that the demos comprises those who make their home within the territory. This rule survives because it admits long-term residents, prisoners, and children (who all dwell there) while excluding expatriates, tourists, and non-resident owners (who dwell elsewhere). It treats the city as a shared living space rather than a legal contract or investment portfolio. The valley residents do not reside in the city, so this rule excludes them.

  **Routine Subjecthood** holds that membership belongs to those routinely subject to the entity's coercive legal order. This fits the inclusion of prisoners and residents (who are bound by bylaws) and the exclusion of expats and owners (who are not). It explains the exclusion of tourists as temporary subjection is insufficient. Since the valley residents are not subject to the city's bylaws—only to the physical consequences of its actions—this rule also excludes them.

  **Fundamental Impact** holds that anyone whose basic rights or life chances are decisively altered by a decision must be included. This rule survives only if distinguished from mere property interest; it explains the inclusion of children and guardians (whose development is at stake) and the exclusion of owners (whose financial interests are contingent). However, because the dam destroys the valley residents' homes, this rule predicts their inclusion, making it observationally distinct from the others on this case.

  # What each rule predicts about the dam vote

  | Rule | Prediction | Justification |
  | :--- | :--- | :--- |
  | **Residential Membership** | Out | They do not live within the city's territory. |
  | **Routine Subjecthood** | Out | They are not bound by the city's legal bylaws. |
  | **Fundamental Impact** | In | Their homes and livelihoods will be destroyed. |

  # Which rule she is probably running, and why

  I would bet she is running **Residential Membership**. The crucial clue is her refusal to treat the children and guardianship cases as matters of proxy representation. If her machinery were based on protecting interests (like Fundamental Impact), she would logically accept that vulnerable groups vote *because* others speak for their interests. By insisting they are members "in the same sense" as adults, she signals a constitutive view of membership: you belong because of who you are within the community, not because of what you might lose.

  This aligns with her exclusion of non-resident owners. Owners have clear interests at stake, often more financially significant than a child's, yet they are out. This demonstrates that stakeholding is insufficient for membership. Similarly, expatriates are out despite citizenship. The common thread across all her "in" verdicts is presence within the shared life of the city. The valley residents, while severely affected, remain outsiders to that shared life. Including them would require shifting from a model of community membership to a model of moral compensation, which contradicts the internal logic of her previous boundary drawings. She treats the demos as a container for a political community, not a net for catching all falling harms.

  # The case that would settle it

  Put to her a **Remote Pensioner Case**: A binding referendum on cutting city pension payments to retirees who now live abroad. They hold no property in the city and are not subject to its laws, but their livelihood depends on the vote. **Residential Membership** and **Routine Subjecthood** both predict **Out** (they don't live there or obey laws). **Fundamental Impact** predicts **In** (their basic subsistence is at stake). If she includes them, she is an Impact theorist; if she excludes them, she is a Membership theorist. This separates the cluster of jurisdictional rules from the consequence-based rule without the confounding variable of territorial destruction.

  # What she would be committing to either way

  If she rules **In**, she commits to a principle that democratic legitimacy flows from avoiding harm, effectively dissolving jurisdictional boundaries whenever external costs are high. If she rules **Out**, she commits to the view that democracy is a practice of self-government among a specific community, accepting that legitimate decisions may impose unjust burdens on outsiders who lack the status to contest them.
