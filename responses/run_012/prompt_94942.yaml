      *   **The Changer:** What would make me switch to the Theater? If data shows the "old settlers" sentiment is too entrenched to fix, making the festival a source of division rather than unity. Or if the motel tax projection is proven solid *and* the theater shows a guaranteed operating endowment (which it doesn't seem to have). Let's go with the Inclusivity issue. If the historian shows the exclusion is structural, not just historical, the festival is dead.

