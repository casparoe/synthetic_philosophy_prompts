          *   The Armory is a permanent asset; the park is just space.
          *   Commuters need a destination, not just a hang-out.
      *   **Unknowns & Decision Making:**
          *   We don't know if the motel tax will actually cover Year 2+.
          *   We don't know if "participation" actually builds bonds or just chaos.
