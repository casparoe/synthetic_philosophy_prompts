answer: |-
  **HANDOUT: DISAMBIGUATING "COULD HAVE DONE OTHERWISE"**
  **Course:** Free Will and Moral Responsibility (Final Year)
  **Topic:** The Principle of Alternative Possibilities (PAP) and its Interpretations
  **Prepared by:** [Your Name/Role]

  ---

  ### 1. Introduction
  The phrase "could have done otherwise" (CHDO) is the pivot upon which many arguments regarding moral responsibility turn. However, it is rarely used with precision. In ordinary discourse, and even in philosophical debate, distinct modal claims are often run together. This handout catalogs the precise metaphysical and normative readings available to us. It does not endorse one reading but provides a menu of options with verdicts on their coherence and argumentative utility.

  ### 2. A Menu of Readings
  Below are six distinct interpretations of the claim "Agent $A$ could have done otherwise at time $t$."

  #### 2.1 The Categorical Leeway Reading (Incompatibilist)
  *   **Species of Possibility:** Metaphysical or Nomological.
  *   **Fixity Conditions:** Indexed to the **exact same past** and the **exact same laws of nature**.
  *   **Nature of Claim:** A categorical, occasion-specific power to initiate a causal chain not fully determined by prior states.
  *   **Agent/Time:** The agent at the exact moment of decision ($t$).
  *   **Function:** Descriptive (a claim about the structure of reality).
  *   **Verdict:** **Substantive and Controversial.** If determinism is true, this claim is false. It is the reading required for *Leeway Incompatibilism*. It is not a platitude; it asserts the falsity of determinism (or the existence of agent-causation).
  *   **Common Conflation:** Often conflated with the *Epistemic Reading* (2.4). We feel we have leeway, but that feeling may be epistemic ignorance of causes.

  #### 2.2 The Conditional Analysis Reading (Classical Compatibilist)
  *   **Species of Possibility:** Nomological (within the laws), but counterfactual.
  *   **Fixity Conditions:** Indexed to a **different past** (specifically, a different state of the agent's will/choice).
  *   **Nature of Claim:** A counterfactual conditional: "If $A$ had chosen/willed otherwise, $A$ would have done otherwise."
  *   **Agent/Time:** The agent's capacities over a stretch of time, not necessarily the exact moment $t$.
  *   **Function:** Descriptive (analyzing the meaning of 'could').
  *   **Verdict:** **Largely Abandoned as Sufficient.** While defensible as a analysis of *ability*, it is vulnerable to Frankfurt-style cases (where an agent could not have done otherwise due to a counterfactual intervener, yet seems responsible). It is often accused of "changing the subject" by Incompatibilists because it denies the ability to do otherwise *given the actual past*.

  #### 2.3 The Dispositional/Capacity Reading
  *   **Species of Possibility:** Practical/Agential.
  *   **Fixity Conditions:** Indexed to the **agent's internal machinery** (character, skills, psychology), holding external constraints constant.
  *   **Nature of Claim:** A general capacity or disposition. $A$ possesses the machinery to $X$, even if conditions at $t$ necessitated $\neg X$. Distinguish: *General Ability* (I can swim) vs. *Specific Opportunity* (I can swim *now*).
  *   **Agent/Time:** The agent as a persisting entity, not just the time-slice at $t$.
  *   **Function:** Descriptive (psychological/physiological fact).
  *   **Verdict:** **Platitude for General Ability; Substantive for Responsibility.** It is trivially true that humans have general capacities. It is substantive (and debated) whether retaining general capacity in a determined world is sufficient for blame.
  *   **Common Conflation:** Confusing *lack of opportunity* (handcuffs) with *lack of capacity* (paralysis). The colleague's argument assumes that determinism removes capacity, which this reading denies.

  #### 2.4 The Epistemic Reading
  *   **Species of Possibility:** Epistemic.
  *   **Fixity Conditions:** Indexed to **what is known** by the observer or agent.
  *   **Nature of Claim:** "For all we knew, $A$ might have done otherwise."
  *   **Agent/Time:** Relative to the knower's state at $t$.
  *   **Function:** Descriptive (of knowledge states).
  *   **Verdict:** **Platitude.** It is almost always true that observers lack omniscience. However, it is **Irrelevant to Responsibility.** Moral responsibility does not hinge on our ignorance of causes.
  *   **Common Conflation:** This is the most common source of confusion. When we say "You could have taken the train," we often mean "We didn't know you wouldn't." The Incompatibilist insists on the Metaphysical reading (2.1).

  #### 2.5 The Reasons-Responsiveness Reading (Semi-Compatibilist)
  *   **Species of Possibility:** Modal (Counterfactual), but focused on **reasons** rather than actions.
  *   **Fixity Conditions:** Indexed to **possible worlds where reasons for doing otherwise exist**.
  *   **Nature of Claim:** $A$'s mechanism is sensitive to reasons. In nearby possible worlds where there is sufficient reason to do otherwise, $A$ does otherwise.
  *   **Agent/Time:** The agent's deliberative mechanism.
  *   **Function:** Descriptive/Normative hybrid (describing control).
  *   **Verdict:** **Substantive and Defensible.** This allows one to grant the Incompatibilist that $A$ could not have done otherwise *in the actual sequence* (given determinism) but maintain $A$ is responsible because the *mechanism* was responsive. This is the primary engine of modern Compatibilism (e.g., Fischer & Ravizza).

  #### 2.6 The Normative/Appraisal Reading
  *   **Species of Possibility:** Normative (Deontic).
  *   **Fixity Conditions:** Indexed to **moral obligation**.
  *   **Nature of Claim:** "Could" is not a metaphysical claim but a marker of appraisal. To say "$A$ could have done otherwise" is to say "$A$ is an appropriate target of blame."
  *   **Agent/Time:** The agent as a member of the moral community.
  *   **Function:** Appraisal (not descriptive).
  *   **Verdict:** **Defensible (Strawsonian).** This view (associated with P.F. Strawson) suggests that demanding the Categorical Leeway (2.1) before blaming is a category error. Responsibility is grounded in reactive attitudes, not metaphysical facts.
  *   **Common Conflation:** Treating this as a descriptive claim about physics. It is explicitly a claim about the *logic of blame*.

  ---

  ### 3. Analysis of the "Objective Chance" Gloss
  Your colleague proposed: *$A$ could have done otherwise iff the objective chance of her doing otherwise, given the total prior state of the world, exceeded some threshold.*

  *   **Situation among Readings:** This is a specific, probabilistic version of **2.1 (The Categorical Leeway Reading)**. It requires indeterminism. It is incompatible with 2.2, 2.3, 2.5, and 2.6, all of which can be satisfied in a deterministic world (where objective chance is 0 or 1).
  *   **Objection 1: The Problem of Degrees.** Objective chance comes in degrees (0.1, 0.5, 0.9). Moral responsibility is typically treated as binary (liable or not) or at least not linearly proportional to quantum probability. If the chance was 0.51, is $A$ responsible? If 0.49, not?
  *   **Objection 2: The Threshold Problem.** There is no principled way to set the threshold. Why is 0.5 the cut-off for freedom? This looks arbitrary.
  *   **Objection 3: The Luck Problem (The Mind Argument).** If an action is a matter of objective chance given the prior state, it appears to be a matter of *luck*. If it is luck, it is not *controlled* by the agent. Mere indeterminacy does not guarantee agency; it may merely introduce randomness.
  *   **Verdict on Gloss:** **High Risk of Confusion.** It successfully captures the Incompatibilist intuition that determinism rules out CHDO, but it fails to explain why *chance* confers the *control* necessary for responsibility. It equates "openness" with "agency."

  ---

  ### 4. Argumentative Utility: What Does the Colleague Need?

  To evaluate the dispute in your reading group, we must distinguish between the premise required for the colleague's conclusion and the premise the compatibilist accepts.

  #### 4.1 The Colleague's Argument
  *   **Premise:** Nobody could have done otherwise.
  *   **Conclusion:** Nobody is answerable for anything.
  *   **Required Reading:** **2.1 (Categorical Leeway).**
      *   *Why?* If CHDO means anything compatible with determinism (like 2.2, 2.3, or 2.5), the premise "Nobody could have done otherwise" is false (or at least unproven) even if determinism is true. For the argument to be valid *and* sound under determinism, 'could' must mean "metaphysically possible given the actual past and laws."
      *   *Vulnerability:* This reading relies on the **Principle of Alternative Possibilities (PAP)**. If PAP is false (as Frankfurt cases suggest), the argument fails even if the premise is true.

  #### 4.2 The Compatibilist Response
  *   **Strategy:** Grant the premise (under reading 2.1) but deny the conclusion.
  *   **Required Reading:** **2.5 (Reasons-Responsiveness) or 2.6 (Normative).**
      *   *Why?* The compatibilist argues that responsibility does not require 2.1. It requires 2.5 (the ability to respond to reasons) or 2.6 (the appropriateness of blame).
      *   *The "Changing the Subject" Charge:* Your colleague claims this changes the subject.
      *   *Assessment:* It changes the *definition* of CHDO, but arguably not the *concept* of Responsibility. If the function of responsibility is to regulate behavior via reasons (2.5), then 2.1 is irrelevant. If the function is retributive justice requiring ultimate origination, then 2.1 is essential. The dispute is often about the *purpose* of blame, not just the physics.

  ---

  ### 5. Summary of Verdicts and Uncertainties

  | Reading | Platitude / Substantive / False? | Compatible with Determinism? | Sufficient for Responsibility? |
  | :--- | :--- | :--- | :--- |
  | **2.1 Categorical Leeway** | Substantive (False if Det. true) | No | Debated (Necessary?) |
  | **2.2 Conditional Analysis** | Substantive (Vulnerable) | Yes | No (Frankfurt cases) |
  | **2.3 Dispositional** | Platitude (General) / Substantive (Specific) | Yes | Debated |
  | **2.4 Epistemic** | Platitude | Yes | No |
  | **2.5 Reasons-Responsiveness** | Substantive / Defensible | Yes | Yes (Semi-Compatibilism) |
  | **2.6 Normative** | Substantive / Defensible | Yes | Yes (Strawsonian) |
  | **Colleague's Chance Gloss** | Substantive / Problematic | No | No (Luck objection) |

  **Points of Genuine Uncertainty:**
  1.  **The Link Between Chance and Control:** It remains an open metaphysical question whether objective chance (if it exists) can be harnessed by an agent to produce control, or if it necessarily undermines it. I am not certain a satisfactory libertarian model exists.
  2.  **The Normative Ground:** It is uncertain whether our practices of blame *presuppose* 2.1 implicitly (as a matter of folk psychology) or whether they can be revised to fit 2.5/2.6 without losing their essence.
  3.  **The Threshold:** As noted, if one adopts the Chance Gloss, there is no non-arbitrary threshold for responsibility. This suggests the gloss is likely incorrect, but I cannot prove no such threshold exists.

  ### 6. Recommendation for Discussion
  When your colleague asserts "Nobody could have done otherwise," ask him to specify:
  1.  **Same Past?** "Do you mean given the *exact* prior state of the universe, or given the agent's character?"
  2.  **Descriptive or Normative?** "Are you making a claim about physics, or a claim about the conditions under which blame is fair?"
  3.  **The Chance Gloss:** "If freedom is just objective chance, how do you distinguish a free action from a random quantum fluctuation?"

  If he insists on **2.1**, he is an Incompatibilist. If he claims **2.1** is the *only* meaning of CHDO, he is engaging in semantic stipulation. The Compatibilist does not deny that 2.1 is impossible under determinism; they deny that 2.1 is necessary for the practices of responsibility we care about. Whether this is "changing the subject" depends on whether you think the subject is *Metaphysics* or *Ethics*.
