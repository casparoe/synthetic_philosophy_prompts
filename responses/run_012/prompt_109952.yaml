answer: |-
  # Lesson Plan: Protocol Divided Agency
  **Course:** 400-Level Philosophy of Mind  
  **Time:** 90 Minutes  
  **Students:** 16 (4 Groups of 4)  
  **Materials:**  
  *   Movable chairs (arranged in 4 clusters)
  *   4 Dividers (screens, large folders, or laptop lids)
  *   4 Tubs of mixed small objects (keys, coins, blocks, pens, toy animals)
  *   Index Cards (prepared in advance, see below)
  *   Projector/Screen (for timer and final reveal only)
  *   Tokens (poker chips or slips of paper)
  *   Chocolate (for the prize)

  ---

  ## Part 1: Induction (10 Minutes)
  **No lecture. No context. No names.**

  1.  **Grouping:** Divide the class into 4 groups of 4.
  2.  **Roles:** Assign roles within each group.
      *   **Hemisphere A (The Speaker):** Sits on the right side of the "Patient" table. May speak *only* when addressed by the Examiner. May not see cards shown to Hemisphere B.
      *   **Hemisphere B (The Actor):** Sits on the left side of the "Patient" table, back-to-back or shielded from Hemisphere A. May *not* speak. May use only the left hand to manipulate objects.
      *   **The Examiner:** Stands or sits facing the Patient. Holds the deck of cards. Asks questions. Awards tokens.
      *   **The Marshal:** Sits where they can see both Hemispheres. Watches for rule violations (peeking, whispering, gesturing). Calls out "Violation" immediately.
  3.  **The Objective:** Tell the Examiners: *"Your goal is to collect three tokens. You award a token to the Patient only when Hemisphere A provides an explanation for Hemisphere B's action that is fluent, confident, and plausible to a naive observer. Accuracy does not matter. Coherence matters. If Hemisphere A hesitates, says 'I don't know,' or references information they could not have seen, no token."*
  4.  **The Constraint:** Tell the Hemispheres: *"You are one agent. You share one body. But you do not share information. If you break the silence or line-of-sight rule, the Marshal resets the trial."*

  ## Part 2: The Simulation (35 Minutes)
  **Run 3 Strict Trials, then 1 Breach Trial.**

  **The Setup:**
  *   Place the tub of objects in the center, accessible to Hemisphere B's left hand.
  *   Hemisphere A keeps hands in lap.
  *   Divider up between A and B.

  **Trial 1: The Simple Action**
  *   **Card (Hidden from A):** [Image of a Key]
  *   **Action:** B picks up the key.
  *   **Prompt:** Examiner asks A: "Why did you pick up the key?"
  *   **Target:** A must invent a reason ("I thought I heard a door," "I like the metal").
  *   **Marshal:** Watch for B peeking at A's reaction or A turning their head.

  **Trial 2: The Emotional Command**
  *   **Card (Hidden from A):** [Text: LAUGH LOUDLY]
  *   **Action:** B laughs.
  *   **Prompt:** Examiner asks A: "What's so funny?"
  *   **Target:** A must manufacture a joke or memory ("I just remembered a pun").
  *   **Note:** This usually produces the most vivid confabulation.

  **Trial 3: The Opaque Command**
  *   **Card (Hidden from A):** [Text: POINT TO THE DOOR. DO NOT SPEAK.]
  *   **Action:** B points.
  *   **Prompt:** Examiner asks A: "Where are we going?"
  *   **Target:** A must construct a narrative intent ("We need to leave," "Someone is waiting").

  **Trial 4: The Breach (Cross-Cueing)**
  *   **Instruction:** "For this trial only, Hemisphere A and B may exchange one glance or one word *after* the action but *before* the explanation."
  *   **Card:** [Image of a Blue Block]
  *   **Action:** B picks up the blue block.
  *   **Cue:** B might hum or tap. A glances.
  *   **Prompt:** Examiner asks A: "Why the blue block?"
  *   **Outcome:** A will likely give the *true* reason ("You showed me blue").
  *   **Discussion:** Ask the group: "Did the explanation improve? Did the unity improve?"

  ## Part 3: The Vote & Small Group Work (15 Minutes)

  1.  **Private Vote:** Hand out index cards. Ask students to write anonymously:
      *   *One Mind*
      *   *Two Minds*
      *   *Neither / Indeterminate*
  2.  **Tally:** Write the numbers on the whiteboard.
  3.  **Adversarial Groups:** Regardless of the vote count, assign the small groups (the original 4 triads) a position to defend.
      *   If "Two Minds" won: They must argue for *One Mind*.
      *   If "One Mind" won: They must argue for *Two Minds*.
      *   If "Indeterminate" won: They must argue for a *Definite Answer*.
      *   *Task:* "You have 5 minutes. Construct the strongest possible philosophical case for your assigned position using *only* the evidence from the simulation. What data did you see? What did you hear?"
  4.  **Report Back:** One spokesperson per group gives a 1-minute summary.

  ## Part 4: The Reveal and Debrief (30 Minutes)

  **1. The Reveal (2 Minutes)**
  *   Project the title: **"Split-Brain Patients and the Unity of Consciousness."**
  *   Name the researchers (Sperry, Gazzaniga, Wolford).
  *   Briefly explain the medical context (intractable epilepsy, corpus callosotomy).
  *   Acknowledge the simulation: "You just enacted the lateralised presentation and the interpreter module."

  **2. Mapping the Mechanics (10 Minutes)**
  *Do not summarize the science. Map their experience to the concepts.*

  *   **The Divider & Silence Rule:** "This was the severed commissures. In the patients, this is biological. In this room, it was social. But the effect was the same: information available to one processing center was inaccessible to the other."
  *   **The Left Hand & The Tub:** "This was contralateral control. The right hemisphere (Actor) controls the left hand. The left hemisphere (Speaker) controls speech. You felt the disconnect between *doing* and *saying*."
  *   **The Token Reward:** "This was the Interpreter Module. I rewarded fluency, not truth. You found that Hemisphere A *could not* remain silent. It had to generate a narrative that integrated the action into a coherent self-story, even if that story was false. This is not lying; it is the brain's demand for causal coherence."
  *   **The Breach Trial:** "This was Cross-Cueing. In the literature, critics argue patients aren't truly divided because they use subtle cues (tone, posture, peripheral vision) to share data. When I let you glance, the 'unity' was restored instantly. This shows how fragile the evidence for disunity is. It takes rigorous laboratory control to *produce* the split; in the wild, the system repairs itself."

  **3. Troubleshooting the Intuitions (10 Minutes)**
  *Address the predictable failures of the activity.*

  *   **On Cheating:** "If your Marshal caught peeking, you felt anger. Why? Because the experiment relies on the integrity of the isolation. In the real science, the 'Marshal' is the tachistoscope and the eye-tracking. If the eyes move, the data is void. The strictness feels artificial because it *is* artificial. We are forcing a breakdown that nature usually prevents."
  *   **On Refusal:** "If Hemisphere A refused to invent a story and said 'I don't know,' that is philosophically valuable. It marks the limit of the Interpreter. But note: in real patients, this rarely happens. The speaking hemisphere almost *always* confabulates. The demand for unity is stronger than the demand for accuracy."
  *   **On Trivialization:** "Some of you may feel this proves 'Two Minds' obviously. But remember: outside this room, the Patient is one person. They have one name, one legal identity, one continuous autobiography. If the evidence for 'Two Minds' requires a divider and a shield, is the duality real, or is it a artifact of the test? The vote was likely split. That split *is* the philosophy. The data underdetermines the metaphysics."

  **4. Limitations (Read Aloud)**
  *Read the following section verbatim. Do not ad-lib. This supplies the context the simulation cannot.*

  > "I need to be frank about what this activity cannot reproduce.
  >
  > First, real split-brain patients move through ordinary life without obvious division. They do not walk into doors with their left side, nor do they describe themselves as two subjects. The disunity you felt here is a laboratory achievement, not a standing feature of their experience. In the wild, the brain finds workarounds we did not permit in this room.
  >
  > Second, this exercise builds two agents in by construction. I gave you two roles, two names, and a rule of silence. I handed you a conclusion you should have had to argue for. In the real case, there is one body and one voice. The question is whether that voice speaks for one subject or two.
  >
  > Third, and most importantly: no arrangement of cards and tokens can stage the phenomenal question. What this activity produced was two channels of information and two sources of action. That is a fact about *access*, not about *experience*. We can see that the speaking side does not know what the acting side saw. We cannot see whether there is one 'light' on inside or two. The gap between functional access and phenomenal unity is the thing you will have to think about on your own. The science tells us the system is divided. The philosophy asks whether the *subject* is."

  **5. Closing Question (3 Minutes)**
  *   "If the speaking hemisphere believes the story it tells you, and the acting hemisphere obeys the command without complaint, and the body functions as one... on what grounds do we assert the unity was lost? Is unity a fact of nature, or a story we tell to make sense of the facts? Discuss this in your final paper."

  ---

  ## Instructor Notes: Predictable Failures & Fixes

  **1. The "Honest" Speaker**
  *   **Problem:** A philosophy student playing Hemisphere A may refuse to confabulate on principle. "I didn't see the card. I cannot explain this."
  *   **Fix:** Do not force them. Let the silence hang. In the debrief, highlight this: "This student resisted the Interpreter. Real patients generally do not. Why? Because the social pressure in the lab, combined with the neural architecture, compels a narrative. This resistance shows us that the 'Unity' is a *drive*, not a guarantee."

  **2. The "Obvious Two" Group**
  *   **Problem:** A group concludes, "This is trivial. Obviously they are two people."
  *   **Fix:** Challenge the ontology. "In this game, you knew you were two students playing roles. In the clinical case, there is one human being. If you met them at a grocery store, you would count them as one person. At what point does the 'Two Minds' claim override the 'One Person' claim? Is personhood a biological fact or a social status?"

  **3. The Lopsided Vote**
  *   **Problem:** If 15 students vote "Two Minds," the "One Mind" group will struggle.
  *   **Fix:** Provide them a scaffold. "Argue from the perspective of the *body*. The hands coordinate to walk, to dress, to eat. The emotional affect is often unified. Argue that 'division' is only visible when we artificially restrict information flow."

  **4. Marshal Overreach**
  *   **Problem:** Student Marshals may become too authoritarian or too lax.
  *   **Fix:** You (the Instructor) must circulate as the "Head Marshal." If a group's Marshal is missing a violation, intervene gently. "That looked like a head turn. Marshal, did you see that?" This keeps the experimental conditions consistent across groups so the debrief comparisons hold water.

  **5. Time Management**
  *   **Problem:** The simulation tends to drag as students laugh at the confabulations.
  *   **Fix:** Use the projector for a visible countdown timer. When the timer hits zero, the trial ends, regardless of whether a token was awarded. This creates pressure that mimics the real-time processing of the brain.
