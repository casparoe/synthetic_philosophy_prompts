  Okay so I'm taking this rational choice seminar and we spent the last two weeks on the claim that your preferences only count as rational if they can be written down as maximizing expected utility, and I keep feeling like the readings are rigging the cases. I want to just dump my gut reactions on a bunch of examples and have you tell me what rule I'm actually running, because I can't find it myself.

  Dan, my roommate, genuinely prefers an apple to a banana, a banana to a cherry, and a cherry to an apple, and he'll act on it. Start him with an apple and he'll pay you a nickel to swap it for a cherry, another nickel to swap the cherry for a banana, another to swap the banana back for an apple. I think Dan is straight-up irrational, not just quirky.

  Sam, a guy down the hall, has the exact same cycle, but he just never trades. He says he'll keep whatever he's holding and that's that. Honestly I don't know what to say about Sam. Part of me thinks the cycle makes him irrational no matter what he does; part of me thinks that if he never acts on it there's nothing to complain about.

  A woman in my seminar said she'd take a sure $1,000,000 over a gamble with an 89% shot at $1,000,000, a 10% shot at $5,000,000, and a 1% shot at nothing — and then, offered a straight choice between "11% chance of $1,000,000, otherwise nothing" and "10% chance of $5,000,000, otherwise nothing," she'd take the second. I don't think there's anything irrational about her at all.

  Same woman, different day: there's an urn with 50 red and 50 black balls, and another urn with 100 balls in some unknown red/black mix. She'd rather bet on red in the first urn, and also rather bet on black in the first urn. Feels completely sensible to me.

  Then my uncle, who's a painter, says he prefers being a painter to being a lawyer, a lawyer to being a professor, and a professor to being a painter — and insists those aren't comparable on one scale, they're just different lives. I don't think he's irrational either.

  So here's the rule I've been trying on: you're irrational just in case there's a sequence of trades you'd actually go along with that leaves you worse off no matter how things turn out. That gets Dan, and it lets my uncle off, and it leaves the seminar woman alone. But it also lets Sam off, and I can't quite stomach that. Meanwhile if I make the rule "irrational whenever your preferences go in a circle," I nail Dan and Sam but I have to call my uncle irrational, which I also won't do. And if I just say "irrational whenever you violate the expected-utility axioms," I have to call the seminar woman irrational in both cases, which I really won't do.

  So: what's the principle, or the smallest set of principles, that gets closest to all of this? Say which verdict of mine it forces me to give up, and don't hedge — pick one and defend it. Also run it on two cases I haven't mentioned: someone who breaks the expected-utility axioms only in ways that require treating a compound gamble as a mixture of a coin flip and a sub-gamble, which she flatly refuses to do and says is a fiction; and someone whose preferences are perfectly well-behaved in every finite situation but who'd lose money to you in an infinite sequence of trades.

  Write it as plain prose, no headings or bullet points or bold, just like you'd explain it in an email. (And sorry, I know this is alot — I'm definately procrastinating a problem set by asking this.)
