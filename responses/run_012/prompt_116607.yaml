answer: |-
  Look, I get why you are frustrated because the seminar is pushing a specific technical definition of rationality that prioritizes logical consistency over practical outcomes, but your gut is actually tracking a much more robust philosophical tradition. The principle you are stumbling toward is that rationality is fundamentally about instrumental coherence, meaning you are irrational only if your decision-making process leads you to systematically frustrate your own aims or leave you vulnerable to exploitation. This is often called the money pump argument, but it is better understood as a requirement of dynamic consistency where the only sin is shooting yourself in the foot through a sequence of actual choices. If you adopt this principle, you have to let go of your hesitation about Sam and accept that he is rational, or at least not irrational in any way that matters for choice theory.

  Here is why you have to make that trade. If rationality is a guide for action, then a defect in your preferences that never manifests in self-defeating action is not a practical defect. Dan is irrational because his intransitive preferences drive him to pay nickels to go in a circle, ending up with less money and the same apple. He actively sabotages himself. Sam has the same mental furniture, but he refuses to trade. Because he refuses to trade, his preferences never guide him to a worse outcome. To call Sam irrational is to say that having odd thoughts is the same as making bad choices, but rational choice theory is supposed to be about choices. If you insist Sam is irrational, you are committing yourself to the view that rationality is about the architecture of your mind rather than the success of your agency, and that view is what forces you to call your uncle and the seminar woman irrational too. By accepting Sam is rational, you keep the focus on what actually happens in the world, which saves your uncle because he cannot trade lives, so his intransitivity never leads to a money pump, and it saves the seminar woman because her Allais and Ellsberg choices are one-off decisions that do not inherently lead to exploitation unless someone constructs a specific dynamic trap around them.

  When you run this principle on your two new cases, the results stay consistent. For the woman who refuses to treat a compound gamble as a mixture, she is rational under this view. The reduction of compound lotteries is an axiom of expected utility theory, but violating it is only irrational if it leads you to make choices that contradict each other over time or lose you money. If she simply values the structure of the gamble itself, perhaps because she dislikes the anxiety of unresolved risk, and she pays a premium for that, she is not being exploited. She is purchasing a specific experience of risk, and as long as she isn't money-pumped for that preference, her refusal to reduce the gamble is just a statement of her actual values, not a logical error.

  The infinite sequence case is trickier but the principle still holds. If someone has preferences that are well-behaved in every finite situation but would lose money in an infinite sequence, you have to look at whether that infinite sequence is something they can actually enact. If the scenario implies they actually complete the infinite series of trades and end up with less money, then they are irrational because they have allowed themselves to be exploited over the trajectory of their agency. Rationality is about navigating the world you inhabit, and if your local consistency leads to global ruin in a feasible scenario, then the local consistency was insufficient. However, if the infinite sequence is purely hypothetical and never actualized, then like Sam, they are not practically irrational because no self-defeat actually occurs. But assuming the case implies the loss is real, you must call them irrational because the principle cares about the final outcome of the agent's choices, not just the logical neatness of each individual step. So stick with your gut on the money pump idea, but have the courage to follow it all the way to Sam and admit that without the trade, there is no crime.
