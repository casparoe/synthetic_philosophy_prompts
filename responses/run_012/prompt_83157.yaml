prompt: |-
  My partner and I have to decide by next month whether to move across the country for a job I'd probably love, and neither of us can actually picture what our life there would be like. Then last week I read a summary of L.A. Paul's work on transformative experience — the vampire case and all that — and now I feel like I've been handed a proof that this decision definately can't be made rationally, period. So what's the actual recommended procedure? Flip a coin, go with gut, have my partner just decide for me since she's less anxious? My brother says Paul's real answer is "pick whichever option gives you the bigger revelation," which sounds like an explorer's motto and not a decision rule. I suspect I've mangled something, because "you can't know what it'll be like" seems obviously true, and yet people make these calls all the time and some of them are obviously smarter than others. Can you sort out what she's actually claiming from what I've absorbed from summaries, tell me whether it matters that I can imagine the new city fine but can't imagine being the person I'd be there, and say what if anything rational there is left to do? American English, and please don't just dump jargon on me.
