answer: |-
  The break in your friend's argument is **Step (3)**.

  Here is the diagnosis, the explanation of why it deceives, and the price list for the repairs you need to make to keep Expected Value (EV) Maximization viable.

  ### The Step to Give Up: (3)
  > *(3) Two options with the same expected value give a rational agent no reason to prefer either, so she is indifferent between them.*

  **Why it looked innocent:**
  In standard decision theory (von Neumann-Morgenstern), if two lotteries have the same expected utility, a rational agent is indeed indifferent between them. This holds true for every finite case you encounter in daily life and standard economics. It relies on the assumption that "Expected Value" is a complete ordering—that any two options can be compared and ranked solely by their expectation.

  **Why it fails here:**
  Step (3) implicitly assumes the **Archimedean Axiom** (or Continuity), which guarantees that no outcome is infinitely more valuable than another. The St. Petersburg game violates this. When expectations are infinite, the real number line loses its ability to distinguish between lotteries that are clearly different in terms of risk and dominance.

  Specifically, the Original Game **statewise dominates** the Discounted Game (it pays more in every possible outcome). A fundamental principle of rationality is **Stochastic Dominance**: if Option A pays at least as much as Option B in every state, and more in some, you must prefer A. Step (3) forces you to violate Dominance to preserve EV equality. Since Dominance is a more basic requirement of rationality than EV maximization, Step (3) must yield.

  ---

  ### The Price of Repairs

  To keep (1) ("A rational agent maximizes expected value") without accepting the absurd conclusion (5), you must amend the theory. You have two main paths, each with a different cost.

  #### Option A: The Amendment (Bounded Utility)
  You keep the *structure* of EV maximization but change the *input*. You argue that rational agents maximize Expected **Utility**, not Expected **Dollar Value**, and that utility functions must be **bounded**.

  *   **The Fix:** You adopt a utility function like $U(x) = \log(x)$ or a bounded sigmoid. The Expected Utility of the St. Petersburg game becomes finite (e.g., equivalent to $20). The Discounted Game has a lower Expected Utility. Thus, EV maximization prefers the Original, and Step (3) is no longer triggered because the expectations are not equal.
  *   **What You Pay:** You lose the intuition that money has linear value. You must accept that a billion dollars is not a billion times better than one dollar.
  *   **Impact on "Worth Playing":** You can still say the game is "worth playing" if the entry fee is below its expected utility (e.g., $20). However, you lose the specific intuition that the game is worth *any* finite entry fee. If someone asks, "Would you sell this ticket for $1 million?", you must say "Yes."
  *   **Verdict:** This is the standard economic solution. It saves EV maximization as a universal theory but costs you the "infinite fortune" intuition.

  #### Option B: The Fragment (Generalized EV)
  You insist on linear dollar value (unbounded utility) but admit that EV maximization is only a **fragment** of a larger theory.

  *   **The Fix:** You retain (1) but restrict its domain. EV maximization is the rule *only when expectations are finite*. When expectations are infinite, you defer to a higher-order principle like **Statewise Dominance**. Alternatively, you adopt **Non-Archimedean Decision Theory** (using hyperreal numbers), where the Original Game has an EV of $\infty$ and the Discounted Game has an EV of $\infty - \epsilon$, making them comparable.
  *   **What You Pay:** You lose the simplicity and universality of EV theory. You must accept that "Expected Value" is not a single real number that dictates all choices. You need a lexicographic ordering (Dominance first, EV second) or complex mathematics (hyperreals) to resolve these cases.
  *   **Impact on "Worth Playing":** You keep the intuition that the game is valuable. You can prefer the Original to the Discounted game.
  *   **Verdict:** This keeps your intuitions intact but admits that (1) is not a standalone theory. It is a local rule that breaks down at the limits, requiring a "parent" theory to handle infinities.

  ### Recommendation for Your Group
  Tell your friend you are rejecting **(3)** because it conflates **mathematical equality** with **decision-theoretic equivalence**.

  If you want to keep (1) as a robust, universal principle, you must pay the price of **Option A (Bounded Utility)**. This is the "cleanest" repair: it preserves the math of standard decision theory and refutes the paradox by denying the premise that the St. Petersburg game has infinite *value* (as opposed to infinite *dollars*).

  If you refuse to bound utility, you must accept **Option B**: EV maximization is merely a fragment. It works for the mundane world, but in the realm of the infinite, it must be subordinate to Dominance. You keep the "infinite fortune" intuition, but you lose the claim that EV Maximization is the *sole* definition of rationality.
