      *   Schlick was a logical positivist. He rejected metaphysical questions as nonsensical if they couldn't be verified.
      *   The question "What is the meaning of life?" is often posed as "What is the purpose of life?" (teleological). Schlick argues life has no external purpose.
      *   Meaning is found in acts done for their own sake (intrinsically valuable), not as means to an end.
      *   Example: Play. Children play for the sake of playing.
      *   Emblem: Youth. Not because it's fleeting, but because youth lives more in the present moment.
      *   Murder: He was shot by a deranged student (Johann Nelböck) on the steps of the University of Vienna. This adds a tragic irony but the poem should focus on the philosophy, not necessarily the murder, though the shadow might linger.
      *   Key distinction: *Zweck* (purpose/aim) vs. *Sinn* (meaning). He argues we confuse the two.

