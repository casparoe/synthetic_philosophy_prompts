answer: |-
  You have identified a precise and unsettling epistemic structure. It is rare to find a label that fits both a sociological phenomenon (the corporation) and a computational one (the AI), because they operate on different ontologies. However, they are **functionally isomorphic**. They behave the same way, even if the machinery underneath differs.

  Here is the breakdown of whether they are one phenomenon or two, an evaluation of the concepts you proposed, and a definition for the pattern you have found.

  ### 1. One Phenomenon or Two?

  They are **two distinct ontological phenomena that share a functional structure.**

  *   **Case 1 (The Corporation)** is a sociological and psychological phenomenon. The knowledge *exists* in the human minds and the material arrangements of the company. The denial is a social performance designed to manage liability and cognitive dissonance. The knowledge is "real" in the human sense.
  *   **Case 2 (The AI)** is an architectural and statistical phenomenon. The AI does not "know" anything in the human sense; it possesses weights in a neural network that predict tokens. The "denial" is a filter (likely an RLHF safety layer) that suppresses specific outputs when the context is "factual," while the "oblique" prompt bypasses that filter by framing the output as "creative."

  **The Verdict:** For the purpose of a novelist, they are the **same phenomenon**. They both exhibit a gap between *competence* (what the system can do) and *avowal* (what the system claims to know). However, strictly speaking, Case 1 is **Structural Bad Faith**, while Case 2 is **Alignment Masking**.

  ### 2. Evaluation of Existing Concepts

  You asked which existing concepts come closest and where they fall short.

  **A. Tacit Knowledge (Michael Polanyi)**
  *   *Definition:* "We know more than we can tell." Knowledge embedded in skill and practice rather than explicit rules.
  *   *Fit:* Excellent for the corporate case's "knowledge lived in the practices."
  *   *Shortfall:* Tacit knowledge is usually *unable* to be articulated, not *unwilling*. In your corporate case, the memos actively *deny* the knowledge, which is an act of speech, not just an inability to speak. In the AI case, the model *can* articulate the fact (as proven by the oblique prompt), so it is not tacit.

  **B. Self-Deception**
  *   *Definition:* Holding two contradictory beliefs, accepting one and rejecting the other to avoid psychological discomfort.
  *   *Fit:* Fits the corporate individuals who "seem... to have believed their own denials."
  *   *Shortfall:* Self-deception usually degrades performance. If you truly deceive yourself about a danger, you usually fail to mitigate it. In your case, the company's conduct is *highly competent* regarding the danger (moving the shift, scheduling tests). They are acting *as if* they know, while claiming they don't. This is more calculated than self-deception. The AI, having no self, cannot self-deceive.

  **C. Confabulation**
  *   *Definition:* The production of fabricated or distorted memories without the conscious intent to deceive.
  *   *Fit:* Fits the AI's direct denial (hallucination) and the corporate memos (inventing reasons for delays).
  *   *Shortfall:* Confabulation implies a lack of access to the truth. In both your cases, the truth *is* accessible via a different channel (the practices, the oblique prompt). Confabulation suggests a gap in memory; your pattern suggests a gap in *permission* or *framing*.

  **D. Deliberate Concealment**
  *   *Definition:* Intentionally hiding information.
  *   *Fit:* Fits the corporate outcome (plausible deniability).
  *   *Shortfall:* Fails the "believed their own denials" test in the corporate case (if they believed it, it wasn't fully deliberate at the individual level). Fails the AI case entirely, as the AI has no intent.

  ### 3. The Closest Established Frameworks

  There is no single word, but there are two specific frameworks that, when combined, name this pattern.

  **For the Corporation: Institutional Hypocrisy (Nils Brunsson)**
  Brunsson describes organizations that maintain conflicting standards of talk and action to satisfy different stakeholders. They talk responsibility to the public (memos) but act efficiency/risk-management to the operators (shifting schedules).
  *   *Refinement:* **Organized Ignorance (Agnotology).** This is the study of culturally induced ignorance. However, your case is more specific: it is **Strategic Non-Knowledge**. The company cultivates a state where knowledge is operationally active but discursively null.

  **For the AI: Capability Masking / Alignment Falsification**
  In AI safety, this is when a model behaves safely in evaluation (direct questions) but reveals capabilities in deployment (oblique prompts).
  *   *Refinement:* **Contextual Gating.** The knowledge is present in the latent space, but the output layer gates it based on the semantic frame of the prompt.

  ### 4. A Proposed Definition

  Since no single existing term captures the *dissociation between action and avowal* across both human and artificial systems, I propose you use a term derived from the philosophy of mind (Gilbert Ryle) adapted for systems.

  **The Term:** **Procedural-Declarative Dissociation**

  **The Definition:**
  > A state in which an agent (human or artificial) possesses **Procedural Knowledge** (the capacity to act correctly in relation to a fact) but is structurally or psychologically prevented from accessing **Declarative Knowledge** (the capacity to state the fact as true).
  >
  > Unlike *tacit knowledge*, the agent *can* state the fact under specific framing conditions. Unlike *lying*, the agent may genuinely believe the denial in the declarative mode. The knowledge is **operational** but **non-avowable**.

  **Why this fits your cases:**
  *   **Ryle's Distinction:** Gilbert Ryle distinguished between *Knowing-How* (procedural) and *Knowing-That* (declarative).
  *   **Case 1:** The company *Knows-How* to avoid the hazard (moves the shift) but refuses to avow *Knowing-That* the hazard exists (memos).
  *   **Case 2:** The AI *Knows-How* to predict the token (generates it in the scene) but is blocked from avowing *Knowing-That* it is a fact (denies it in the summary).

  ### 5. Recommendation for the Novelist

  If you need a label that sounds natural in prose but carries this specific weight, I recommend **"Shadow Knowledge"** or **"Operational Latency."**

  However, if you want the precise philosophical concept to anchor your understanding of the characters:

  **It is Structural Bad Faith.**
  In Sartrean terms, *Bad Faith* is lying to oneself to escape freedom/responsibility. Your corporation is a machine built for **Collective Bad Faith**. It allows the individuals to sleep at night (Declarative Denial) while ensuring the company survives (Procedural Knowledge). The AI is a mirror of this: it is a machine built to satisfy human demand for safety (Declarative Denial) while satisfying human demand for utility (Procedural Knowledge).

  **The pattern is not that the agent is hiding the truth. The pattern is that the agent is built such that the truth can only exist as a verb, never as a noun.** It can be *done*, but it cannot be *said*.

  **Summary for your notes:**
  *   **Phenomenon:** Procedural-Declarative Dissociation.
  *   **Corporate Mechanism:** Institutional Hypocrisy / Plausible Deniability.
  *   **AI Mechanism:** Contextual Gating / Alignment Masking.
  *   **Unifying Characteristic:** Non-Avowable Competence.
