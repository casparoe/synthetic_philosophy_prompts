      Dear colleague, I have spent considerable time with the position you have outlined, and I find myself compelled to tell you that while your first half regarding substrate independence is a sturdy vessel, your second half, the Attribution Assumption, is the hull breach waiting to happen. You ask me to break it, and so I will begin with the most fatal objection available, which is the triviality argument originally sharpened by Putnam and later by Searle, because it strikes directly at the claim that there is a fact of the matter about which computation a system implements. The argument holds that for any finite physical system and any finite state machine, there exists a mapping between physical states and formal states such that the physical system implements the machine. If this is true, then your Attribution Assumption collapses immediately because every rock implements every computation, rendering the distinction between a mind and a stone merely a matter of descriptive convenience rather than ontological reality. Defenders of your view, including those who champion computational functionalism, will concede that trivial mappings are possible if one allows arbitrary disjunctions of physical states, but they will dismiss this objection as question-begging because it relies on mappings that lack causal coherence or naturalness. They will argue that not all mappings are created equal, that only those respecting the causal topology of the system count, but here is where I suspect you will find no solid ground, because the criterion for causal coherence itself relies on an prior interpretation of what counts as a cause, which loops you back into the very arbitrariness you are trying to escape.

      Your proposed repair, privileging the mapping under which behaviour is most counterfactually robust, is a sophisticated attempt to plug this leak, drawing on the work of David Chalmers, but I must tell you that this merely relocates the arbitrariness rather than repairing the assumption. By demanding counterfactual support, you rule out the clerk with the lookup table because he cannot support states he did not actually enter, but you have not solved the problem of which counterfactuals matter. To determine robustness, you must define the space of possible perturbations, and that definition is itself a descriptive choice fixed by the observer. A defender of biological naturalism will argue that this confirms their suspicion that computation is not intrinsic to physics but is imposed by us, meaning your view collapses into the claim that moral status is projected by observers rather than discovered in systems. Your defenders will concede that observer relativity is a risk but will dismiss the collapse as fatal only if one assumes moral status must be intrinsic in a non-relational sense, arguing instead that moral status is a relational property like being a predator or being money. However, this concession comes at a steep price, for if moral status is relational, then a system could be owed consideration by one observer and not another, which undermines the objective reality of suffering or rights you likely wish to protect.

      Moving from the fatal to the merely awkward, there are arguments from neurobiology and physics that challenge substrate independence itself, which indirectly undermines the Attribution Assumption by suggesting the grain of description cannot be fixed independently of the material. Observations of neuromodulators, quantum effects in microtubules, or the specific timing of spike trains suggest that the computational description is not invariant under material substitution. If the specific chemical properties of a neuron matter for consciousness, then describing the system purely computationally loses the very property that grounds moral status. Defenders of your view will concede that current uploads are crude but will dismiss these objections as contingent limitations of technology rather than principled barriers, arguing that once we capture the causal structure at a fine enough grain, the material drops away. Yet this creates a prediction that distinguishes your view from its rivals, namely that we should be able to construct a silicon-based system that is functionally isomorphic to a human brain and observe identical markers of consciousness or moral agency. Rivals predict that such a system will always be a zombie, lacking inner life regardless of functional match. In principle, we could check this in the lab by looking for neural correlates of consciousness in non-biological substrates, but the hard problem remains that we have no independent meter for consciousness other than behavioural report or structural analogy, which your view assumes is sufficient while rivals deny it.

