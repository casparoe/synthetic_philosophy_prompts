answer: |-
  Your suspicion is correct: this list is not homogeneous, and a linear ranking would be a category error. You are mixing epistemic principles (how we establish truth) with normative and political principles (whether we should, and who decides). Principle (b) dissolves the conflict entirely by denying the memory is a factual claim; principle (c) overrides truth for safety; principle (h) overrides truth for procedure. You cannot weigh these against evidentiary rules like (a) or (e) on a single scale.

  Furthermore, the framing of 'archive versus memory' is itself fraught. Archives are not neutral repositories of fact but often instruments of state power that produced the silences principle (e) seeks to address. Treating them as commensurable evidentiary sources ignores that the archive often represents the victor's record, whilst memory represents the lived experience of the marginalised.

  Rather than a tidy list, you require a **lexical priority**. Normative and political constraints must bind epistemic methods, not compete with them.

  1.  **Threshold Constraints (The 'Whether'):** Principles (c) **Harm**, (h) **Democratic**, and (d) **Jurisdiction** operate first. If institutionalising a version causes harm, or if the community has not consented to the process, the adjudication should not proceed regardless of the evidence.
  2.  **Categorical Definitions (The 'What'):** Principle (b) **Constitutive** sits next. If a memory is identity-forming rather than factual, it is removed from the evidentiary contest entirely.
  3.  **Epistemic Methods (The 'How'):** Only if the above are satisfied do you weigh (a) **Deference**, (e) **Silence**, (f) **Revisability**, and (g) **Shared-world**. Here, (e) and (a) should carry the most weight, as they correct for archival bias; (f) is dubious (memory is often more fluid than ink), and (g) is a secondary consideration of social cost.

  To rank these linearly would be to pretend that safety, authority, and truth are the same kind of currency. They are not; the former two set the conditions under which the third may be sought.
