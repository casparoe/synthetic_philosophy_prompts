answer: |-
  ### Phase 1: Sharpening the Suspicion

  Before drafting the proposal, we must clarify the logical space. The suspicion is that "greedy reductionism" and "skyhook dependence" are speech acts disguised as truth claims. To make this researchable, we need to isolate the specific point of friction between the epistemic and pragmatic interpretations. Here are three ways to sharpen the focus:

  **1. The Truth-Condition Test**
  If the charge is epistemic, a greedy explanation must be *false*. If I explain the stock market crash solely via neural firings in traders' brains, Dennett would call this greedy. But is it false? The neural firings did occur. The reduction might be *intractable* or *informationally lossy*, but not factually incorrect.
  *Sharpening:* We must distinguish between *ontological reduction* (everything is physical) and *explanatory reduction* (the best account is at the physical level). The suspicion holds that "greediness" targets the latter, which is a matter of utility, not truth. The research must test whether accusers treat greedy explanations as falsified or merely as "black-boxed."

  **2. The Audience-Relativity Test**
  Pragmatic claims are audience-relative. An explanation that skips cranes might be "greedy" for a specialist (who needs the mechanism) but perfectly adequate for a policy-maker (who needs the outcome). Epistemic claims are generally audience-invariant; a false explanation is false for everyone.
  *Sharpening:* If the status of a reduction shifts depending on who is asking the question, the criterion is pragmatic. We can test this by examining whether the label "greedy" is applied consistently to the same explanation across different communicative contexts (e.g., peer-reviewed journals vs. popular science).

  **3. The Repair Test**
  When an explanation is accused of being epistemically flawed, it is usually discarded or fundamentally altered. When it is pragmatically flawed, it is refined or supplemented.
  *Sharpening:* We track the dialectical aftermath of the charge. If a theorist accused of greedy reductionism simply adds the intermediate "cranes" and retains their original conclusion, was the original explanation false? If the conclusion stands, the charge was pragmatic (about the path, not the destination). If the conclusion must be abandoned, the charge was epistemic.

  **Decision:** The third option (The Repair Test) offers the most robust methodology for a six-month project. It moves beyond semantic analysis into the dynamics of scientific controversy, allowing us to observe the *consequences* of the charge rather than just the definitions.

  ***

  ### Phase 2: Research Proposal

  **Title:** Cranes Without Truth: A Normative Analysis of the Greedy Reductionism Charge

  **1. The Governing Question**
  Is the distinction between "good" and "greedy" reductionism truth-conditional (epistemic) or utility-conditional (pragmatic)? Specifically: Does the accusation of greedy reductionism entail that the target explanation is *false*, or merely that it is *explanatorily inefficient* for a specific context?

  **2. Motivation and Existing Gaps**
  The distinction between good and greedy reductionism, alongside the crane/skyhook metaphor, is standard currency in philosophy of biology and cognitive science. It is routinely deployed to police the boundaries of legitimate explanation. However, the normative status of these charges remains ambiguous.

  Existing treatments leave the question open because they conflate *completeness* with *correctness*. A greedy reductionist account (e.g., explaining a social phenomenon solely via genetics) is often incomplete because it skips intermediate levels (culture, psychology). But incompleteness is not falsehood. Current philosophical accounts fail to specify whether the "sin" of greediness is a failure of reference (picking out the wrong causes) or a failure of pedagogy and tractability (picking out the right causes in the wrong order). Without this distinction, the vocabulary functions as a rhetorical bludgeon rather than a diagnostic tool. We cannot know if a scientific controversy is about facts or about explanatory strategy unless we know what kind of error "greediness" constitutes.

  **3. Methodology: The Repair and Retention Analysis**
  The obvious alternative method would be a linguistic cataloging of how the terms "greedy," "crane," and "skyhook" are used in the literature. I reject this approach. Lexical usage is often inconsistent; scientists may use "greedy" loosely to mean "simplistic" while intending a deeper epistemic critique, or vice versa. Descriptive sociology of usage cannot determine the normative force of the concept.

  Instead, I propose a **Repair and Retention Analysis**. This method treats the charge of greedy reductionism as an intervention in a dialectical process. I will select two paradigmatic controversies where the charge has been prominently deployed (e.g., the adaptationist programme in evolutionary psychology and the neural reduction of consciousness).

  For each case, I will reconstruct the argumentative exchange:
  1.  **Initial Claim:** Identify the explanation accused of greediness.
  2.  **The Charge:** Isolate the specific accusation (e.g., "skipping the cultural crane").
  3.  **The Repair:** Observe how the accused theorist (or their defenders) modifies the explanation in response.
  4.  **Retention:** Determine if the core conclusion of the Initial Claim is retained after the repair.

  **The Logic of the Test:**
  *   If the charge is **epistemic**, the Initial Claim should be treated as falsified. The theorist must abandon the conclusion or posit entirely new entities.
  *   If the charge is **pragmatic**, the theorist should be able to "fill in the cranes" (add the intermediate levels) while retaining the original conclusion. The explanation becomes more detailed, but not fundamentally different in truth value.

  **4. Feasibility and Timeline (Six Months)**
  This is a six-month project designed to produce a single, high-impact journal article. It is not a career-long taxonomy.
  *   **Months 1-2:** Case selection and reconstruction. I will focus on one dispute in evolutionary biology and one in cognitive science to ensure cross-domain validity.
  *   **Months 3-4:** Application of the Repair and Retention Analysis. Coding the dialectical moves to see if conclusions are abandoned or refined.
  *   **Month 5:** Synthesis. Determining if the pattern holds across cases.
  *   **Month 6:** Drafting and revision.

  **5. Conditions of Success and Failure**
  *   **Success (Pragmatic Hypothesis Confirmed):** The analysis shows that in successful scientific resolutions, accused "greedy" explanations are rarely discarded. Instead, they are embedded within a multi-level framework where the original reductionist claim holds as a limiting case or a distal cause. This would confirm that "greediness" is a warning about explanatory scope, not truth.
  *   **Success (Epistemic Hypothesis Confirmed):** The analysis shows that accusations of greediness consistently lead to the rejection of the target theory's core claims, replaced by theories that posit distinct causal powers at higher levels. This would vindicate the view that skipping cranes leads to factual error.
  *   **Failure:** The cases prove heterogeneous (epistemic in one domain, pragmatic in another) without a unifying principle, or the textual record is too ambiguous to determine whether conclusions were retained or abandoned. In this case, the distinction may be too context-dependent to support a general philosophical account.

  **6. Significance**
  If the suspicion is correct, it demystifies a major source of friction in the science wars. It suggests that disputes over "greedy reductionism" are not about what exists, but about how we should talk about what exists. This shifts the burden of proof: those deploying the charge must specify *for what purpose* the reduction is inadequate, rather than implying the reduction is false. This clarifies the relationship between special sciences and physics, moving the debate from ontology to explanatory strategy.
