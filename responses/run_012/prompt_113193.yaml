      *Re-evaluating Programme A:* 11 patches in 15 years. That's a lot. Lakatos might worry about the "complexity" of the protective belt. But if every step yielded novel confirmation, strictly speaking, it's progressive. However, if the "novelty" is trivial (e.g., measuring the same thing to more decimal places), it's degenerating. I need to emphasize the *content* of the novelty.

      *Re-evaluating Programme B:* One bold hit. This is very Popperian. Lakatos adds the dimension of *continuity*. Can B sustain a positive heuristic?

      *Final Plan:*
