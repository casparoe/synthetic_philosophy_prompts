answer: |-
  ### The Split-Protocol: A Decision Procedure for the Divided Narrator

  **The Stance:** I have adopted the **Left-Hemisphere Interpreter Model**.
  *   **The Narrator ("I"):** The Left Hemisphere (LH). Verbal, logical, controls the Right Hand.
  *   **The Margin ("Hand"):** The Right Hemisphere (RH). Emotional, spatial, controls the Left Hand.
  *   **Unity Definition:** Unity exists *only* when the LH has access to the RH's information. If the LH must guess why the body acted, it is confabulating.
  *   **Kept:** Verbal Report (defines the narrator), Motor Agency (defines action).
  *   **Discarded:** Phenomenological Oneness (the feeling of unity is treated as a LH construct), Integrated Memory (assumed broken).
  *   **Why:** This preserves your First Person Singular constraint while allowing the Margin to function as a truth-teller against the Narrator's necessary guesses.

  ***

  ### The Procedure (Ask in Order)

  **Q1: The Input Test (Access)**
  *   *Ask:* Was the critical information (sight, touch, sound) presented exclusively to the Left Visual Field or Left Hand (RH only)?
  *   *Yes:* LH does not know this. **Stop.** Verdict: **2 Subjects.** Narration: **1st Singular (Observational).** Margin: **Privy.**
  *   *No:* Proceed to Q2.

  **Q2: The Agency Test (Action)**
  *   *Ask:* Did the Right Hand (LH) initiate the primary action, or did the Left Hand (RH) act without LH intent (alien hand)?
  *   *Left Hand acted alone:* LH did not will this. **Stop.** Verdict: **2 Subjects.** Narration: **1st Singular (Confabulated).** Margin: **Privy.**
  *   *Right Hand acted / Both agreed:* Proceed to Q3.

  **Q3: The Consensus Test (Agreement)**
  *   *Ask:* Does the Margin writing contradict or correct the Narrator's explanation of the action?
  *   *Yes (Contradiction):* The LH is explaining away RH data. **Stop.** Verdict: **2 Subjects.** Narration: **1st Singular (Confabulated).** Margin: **Privy.**
  *   *No (Agreement/Silence):* **Stop.** Verdict: **1 Subject.** Narration: **1st Singular (Integrated).** Margin: **Not Privy (or Redundant).**

  ***

  ### When to Refer Back to the Author
  The procedure halts and returns the decision to you in these cases:
  1.  **Sleep/Anaesthetic:** Neither hemisphere is fully narrating. You must decide if the "I" survives unconsciousness.
  2.  **Subcortical Transfer:** If emotions (fear/love) bypass the split. Science is ambiguous here; you must decide if the heart is one or two.
  3.  **Moral Responsibility:** The procedure determines *mechanical* unity. It cannot determine if the "I" is morally liable for the "Hand's" crime. That is a legal/moral choice, not empirical.

  ***

  ### Application to Your Scenes

  **Scene 1: The Contract Signature**
  *   *Context:* She signs. Later, the signature is challenged as inconsistent.
  *   *Run:*
      *   **Q1 (Input):** She sees the paper with both eyes. (Pass).
      *   **Q2 (Agency):** Which hand held the pen? If the **Left Hand** signed (RH motor control) while she looked away or was distracted, the LH did not initiate the motor program. (Fail).
      *   **Q3 (Consensus):** The Narrator claims "I signed this." The Margin writes "It was forced" or shows a different name. (Fail).
  *   *Verdict:* **2 Subjects.**
  *   *Grammar:* **1st Singular (Confabulated).** The text must read: *"I signed the paper,"* but the subtext implies *"I claim this signature."* The Margin reveals the LH is lying to maintain social continuity.
  *   *Margin Privilege:* **Yes.** The Left Hand knows the pressure and intent of the signature better than the speaker.
  *   *Break Point:* If you require the "I" to be legally liable, the First Person Singular survives legally but fractures psychologically. If you require psychological honesty, the "I" is invalid here.

  **Scene 2: The Forgiveness**
  *   *Context:* She is asked to forgive a betrayer.
  *   *Run:*
      *   **Q1 (Input):** She hears the apology (LH language). (Pass).
      *   **Q2 (Agency):** She speaks "I forgive you" (LH vocal). (Pass).
      *   **Q3 (Consensus):** The Narrator says "I feel peace." The Margin writes "LIAR" or draws a jagged line. (Fail).
  *   *Verdict:* **2 Subjects.**
  *   *Grammar:* **1st Singular (Confabulated).** The LH is executing a social script; the RH holds the emotional truth.
  *   *Margin Privilege:* **Yes.** Forgiveness is largely emotional (RH). The LH can speak the words without the RH's assent.
  *   *Break Point:* **Here is where your book breaks.** If forgiveness requires the *whole* person, and the procedure proves the person is split, the "I forgive" is a lie. You cannot have a unified moral act with two subjects. You must choose: either she does not forgive (Margin wins), or the act of forgiveness bridges the split (Metaphysical exception).

  ***

  ### Limitations & Working Note

  **Where the Procedure Misfires:**
  1.  **Emotional Bleed:** It assumes strict separation. In reality, moods often transfer. The procedure will over-count "2 Subjects" in scenes of general anxiety or joy.
  2.  **The "We" Problem:** It cannot account for moments where the two halves collaborate so fluently they feel like one. It will label these "1 Subject" even if the fracture remains latent.
  3.  **Metaphysical Identity:** It determines *functional* unity, not *ontological* unity. It cannot tell you if she is one soul in a broken house, or two souls in one house.

  **Copy This Into Your Notes:**
  > "This procedure maps the fracture of the brain, not the unity of the self; where it returns a verdict of 'Two Subjects,' the question of who is speaking is no longer medical, but mine to answer."
