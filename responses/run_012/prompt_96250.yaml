answer: |-
  ### Part 1: How These Pictures Fail in Practice

  The "heterarchy of cognitive hierarchies" and "factored cognition" sound rigorous, but they often collapse into **bureaucratic theater**. First, **question substitution** is endemic: sub-teams answer "Can we measure this?" instead of "Does this matter?", or they optimize for local clarity at the expense of global coherence. Second, **loss of interaction effects**: factoring assumes independence, but consequential risks often live in the correlations between sub-answers (e.g., low probability × high impact × unobservable trigger). Third, **the summarizer bottleneck**: even in a heterarchy, the person assembling the sub-answers inevitably becomes the de facto decider because they control the narrative weighting. Finally, **false precision**: breaking a vague question into ten specific ones creates an illusion of resolution without actually reducing the underlying uncertainty.

  ---

  ### Part 2: The Residue-Aware Decomposition Protocol (RADP)

  This protocol is designed for your constraints (8 analysts, 4h/sub-task, 2h/week team sync). It prioritizes detecting *residue* (the part of the question that cannot be factored) over forcing an answer.

  #### Phase 0: Pre-Factorization Check (Director + 1 Lead Analyst, 1 Hour)
  Before breaking the question, determine if it *can* be broken.
  1.  **The Value Test:** Is the core disagreement about facts or values? If values (e.g., "Should we?"), do not factor. **Hand off to Director.** **[JUDGMENT CALL: Distinguishing empirical uncertainty from moral disagreement is often ambiguous.]**
  2.  **The Observability Test:** Is the key variable observable in principle? If the answer depends on a variable that is fundamentally unobservable (e.g., "internal safety culture" without access), factoring will only produce confident guesses about proxies. **Stop.**
  3.  **The Reconstruction Test (Draft):** If we answer all sub-questions perfectly, does the main question answer itself? If no, the decomposition is invalid.

  #### Phase 1: Decomposition (Lead Analyst, 1 Hour)
  Split the question into 3–5 sub-questions.
  1.  **Independence Constraint:** Sub-questions must not rely on the *answers* of other sub-questions to be investigated (to allow parallel work).
  2.  **Sufficiency Criteria:** A sub-answer is sufficient only if it includes: (a) The claim, (b) The evidence strength (1–5), (c) The "Residue Flag" (what this sub-answer *doesn't* cover).
  3.  **Proxy Declaration:** Every sub-question must declare what proxy it is using if it cannot measure the direct variable. **[JUDGMENT CALL: Accepting a proxy involves guessing that the correlation holds under stress.]**

  #### Phase 2: Independent Analysis (Analysts, 4 Hours each)
  Analysts work in pairs or singly on sub-questions.
  1.  **Time Box:** Hard stop at 4 hours. If the answer isn't clear, the uncertainty *is* the answer.
  2.  **Adversarial Note:** Each analyst must write one paragraph on "How this sub-answer could be true but still lead us to the wrong conclusion on the main question."

  #### Phase 3: Adversarial Assembly (Full Team, 2 Hours)
  This is not a presentation; it is a stress test.
  1.  **The Assembly:** The Lead Analyst proposes a synthesis of the sub-answers.
  2.  **The Substitution Check:** The team asks: "Did we answer the main question, or did we answer 'Is the model clean'?"
  3.  **Weighting Mechanism:** To prevent the Lead Analyst from becoming the decider:
      *   Each analyst holds 1 vote on the *confidence* of their own sub-answer.
      *   The team holds a collective vote on the *relevance* of that sub-answer to the main question.
      *   **Formula:** Final Confidence = $\sum$(Sub-Confidence × Relevance Vote).
      *   **[JUDGMENT CALL: Relevance voting is political; analysts may downweight findings that complicate their preferred outcome.]**
  4.  **Inconsistency Check:** If Sub-Answer A and Sub-Answer B are individually defensible but jointly impossible (e.g., "Market will grow" + "Budget will shrink" without explanation), the process halts. **Hand off to Director.**

  #### Phase 4: Stop Conditions & Hand-Offs
  The process must terminate if:
  1.  **Residue Threshold:** The "unfactorable" residue exceeds 30% of the decision weight. **[JUDGMENT CALL: 30% is an arbitrary threshold for "too much uncertainty."]**
  2.  **Value Residue:** The remaining uncertainty is purely normative. **Hand off to Director.**
  3.  **Verification Cost:** Checking the answer requires as much work as producing it (e.g., auditing a black box). **Hand off to Director with a "Unverifiable" tag.**

  #### What This Protocol Cannot Do
  *   It cannot resolve value conflicts; it can only expose them.
  *   It cannot validate unobservable variables; it can only flag them.
  *   It cannot prevent the Lead Analyst from framing the synthesis in a biased way, though the voting mechanism mitigates this.
  *   It cannot compensate for a lack of external data; garbage in, garbage out, even if factored.

  ---

  ### Part 3: Running the Protocol on Three Questions

  #### Case 1: Advise Funder to Pause Grant (Lab Safety Culture Unobservable)
  **Phase 0 (Pre-Factorization):**
  *   *Value Test:* Mixed. Safety is a value, but risk is empirical.
  *   *Observability Test:* **FAIL.** The prompt states internal safety culture "cannot be observed." We are factoring a question about a hidden variable using only external proxies (publication rates, staff turnover, public statements).
  *   *Reconstruction Test:* If we know all external proxies, do we know the safety culture? No. High safety culture can exist with high turnover; low safety culture can exist with perfect publications.

  **Phase 1 (Decomposition):**
  *   Attempted Sub-questions: (1) Turnover rates, (2) Publication retractions, (3) Whistleblower history.
  *   *Proxy Declaration:* All three are weak proxies for *current* internal norms.

  **Phase 3 (Adversarial Assembly):**
  *   *Substitution Check:* The team realizes they are answering "Is there public evidence of malfeasance?" not "Is the lab safe?"
  *   *Inconsistency:* Analyst A finds no public red flags. Analyst B notes that "no red flags" is the expected signature of a lab hiding safety issues. These are jointly consistent but epistemically null.

  **Verdict (Hard Stop):**
  **We cannot advise the funder to pause or continue based on this protocol.** The core variable is unobservable, and factoring creates a false sense of security. The only faithful answer is: *"We cannot assess the risk with the available epistemic access. If the funder requires assurance, they must negotiate direct observation rights. Without that, the decision is a value gamble, not an evidence-based call."*
  **[JUDGMENT CALL: Declaring a question 'unanswerable' is a strategic risk for a nonprofit. The protocol forces this honesty, but the Director may override it to maintain client relations.]**

  #### Case 2: Probability of Legislation Passing (2 Years)
  **Phase 0 (Pre-Factorization):**
  *   *Value Test:* No. This is a forecasting question.
  *   *Observability Test:* Yes. Votes, lobbying records, and public opinion are observable.
  *   *Reconstruction Test:* Yes. If we know the vote count, we know the outcome.

  **Phase 1 (Decomposition):**
  *   Sub-questions: (1) Current vote whip count, (2) Impact of upcoming election, (3) Lobbying expenditure trends.
  *   *Sufficiency:* Each must provide a probability range, not a binary.

  **Phase 2 (Independent Analysis):**
  *   Analysts produce: (1) 60% pass (current), (2) 40% pass (post-election), (3) Neutral impact.

  **Phase 3 (Adversarial Assembly):**
  *   *Weighting:* The team votes that (1) Current Whip Count is most relevant (Weight 0.5), (2) Election is second (Weight 0.3).
  *   *Assembly:* Weighted probability calculated.
  *   *Substitution Check:* Did we answer "Will it pass?" or "What do polls say?" We must adjust for polling error.

  **Verdict:**
  **65% Probability (Range 50–80%).** The question is faithfully factored. The residue (black swan events) is acknowledged but falls within the confidence interval.

  #### Case 3: Run Experiment Persuading People Without Telling Them
  **Phase 0 (Pre-Factorization):**
  *   *Value Test:* **FAIL.** The core question is "Should we?", which is normative. We can factor "Will it work?" and "Is it legal?", but "Should we?" rests on ethical axioms.
  *   *Hand-Off Condition:* Triggered immediately.

  **Phase 1 (Decomposition - Attempted):**
  *   If we ignored Phase 0, we would factor into: (1) Efficacy, (2) Risk of backlash, (3) Legal compliance.
  *   *Residue:* Even if Efficacy is High, Risk Low, Legal Yes, the "Should" remains unresolved without a moral premise.

  **Phase 4 (Stop Condition):**
  *   **Hand off to Director.** The protocol identifies this as a **Value Residue** case.
  *   *Output to Director:* "We can determine efficacy and legal risk. We cannot determine ethical permissibility. This requires a principled stance on deception, not further analysis."

  **Verdict:**
  **No Recommendation.** The protocol refuses to dress up an ethical decision as an empirical one. **[JUDGMENT CALL: The Director might demand a recommendation anyway. The protocol protects the analysts, not the Director's comfort.]**

  ---

  ### Part 4: Plain Statement of Limitations

  1.  **It Cannot Generate Truth:** If the data doesn't exist (Case 1), the protocol outputs "Unknown," not "False." It protects you from overconfidence, not from ignorance.
  2.  **It Cannot Resolve Values:** It isolates value judgments (Case 3) but does not solve them. It forces the Director to own the ethical risk explicitly rather than hiding behind "the analysis says..."
  3.  **It Is Vulnerable to Framing:** The Lead Analyst in Phase 1 decides how to slice the question. If they slice it to hide the hard parts, the voting in Phase 3 may not catch it if the team is group-thinking. **[JUDGMENT CALL: Trusting the Lead Analyst's decomposition is the single point of failure in this heterarchy.]**
  4.  **It Cannot Scale Indefinitely:** With only 2 hours of team time, you can only review 3–5 sub-questions. If a problem requires 20 sub-questions to be honest, this protocol will force a premature collapse of the tree.

  **Final Note to Director:**
  In Case 1 (The Grant), the protocol tells you to tell the funder "We don't know." This may feel like a failure of service. It is not. It is the only output that preserves your integrity. If you use the protocol to generate a "Pause" or "Continue" recommendation there, you have used the machinery to launder a guess into a fact. The protocol's primary function is not to answer questions, but to tell you which questions *cannot* be answered by your current structure.
