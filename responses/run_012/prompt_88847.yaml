answer: |-
  ### Criteria for Ranking

  To allocate two postdocs and a modelling budget over three years, I am applying three filters:

  1.  **Upstream Necessity:** Does resolving this question provide the vocabulary or logical structure required to address the others?
  2.  **Accountability Leverage:** Does the answer change how a regulator, judge, or safety engineer assigns responsibility? If the metaphysics is neutral between two legal outcomes, it is lower priority.
  3.  **Tractability:** Can a team of analytic metaphysicians and a formal modeller produce a definitive result (or a definitive dissolution) within 36 months?

  ### The Ranking

  **1. Representation (Hunch 4)**
  **2. The Division of Labour (Hunch 2)**
  **3. Omission Chains (Hunch 3)**
  **4. Individuation (Hunch 1)**

  ---

  ### 1. Representation (Hunch 4)
  **Priority:** First (Year 1)
  **Reasoning:** This is the most upstream constraint. Your end-users (automated system review teams, regulators) operate via models: causal graphs, fault trees, structural equation models (SEMs). If the metaphysics of omission cannot be mapped onto these formalisms without distortion, the work fails the funder's "use" constraint immediately. You cannot settle the logic of chains (Hunch 3) or the role of norms (Hunch 2) until you know what a variable for "not doing X" looks like in the system. Is it a binary variable set to 0? Is it an intervention on a parent node? Is it a missing edge?
  **Tractability:** High. This is a technical interface problem between metaphysics and formal semantics. A competent modeller can test existing frameworks (e.g., Halpern-Pearl structures) against omission cases quickly.
  **Evidence to Move Agenda:**
  *   *Move Down:* If the modeller demonstrates that standard SEMs handle omissions trivially (e.g., as default values), this becomes a solved engineering constraint, and effort shifts immediately to Hunch 2.
  *   *Move Up:* If representing omissions requires a novel logic (e.g., non-classical negation in the causal structure), this consumes the bulk of the programme, as you cannot proceed to norms or chains without a new calculus.

  ### 2. The Division of Labour (Hunch 2)
  **Priority:** Second (Year 1–2)
  **Reasoning:** This is the substantive heart of the accountability problem. In law and regulation, the gap between "but-for cause" and "liable cause" is bridged by duty, norm, or expectation. If norms are *constitutive* of the causal relation (i.e., there is no causation without a breached norm), then metaphysics merges with ethics. If norms are merely *pragmatic filters* on a purely physical causal relation, then metaphysics and ethics remain distinct. This distinction dictates the output: do you build a "Causal Detector" or a "Responsibility Calculator"? The former is a scientific tool; the latter is a normative one.
  **Tractability:** Moderate. This requires conceptual analysis and case testing, but the binary nature of the question (constitutive vs. pragmatic) allows for a decisive conclusion.
  **Evidence to Move Agenda:**
  *   *Move Down:* If clear cases emerge where causal judgment tracks physical dependence *against* normative expectation (or vice versa), the question is settled, and you proceed to application.
  *   *Move Up:* If the team finds that "norm" is too heterogeneous (statistical, moral, legal) to serve as a single causal filter, this problem expands, requiring a taxonomy of norms before causation can be defined.

  ### 3. Omission Chains (Hunch 3)
  **Priority:** Third (Year 2–3)
  **Reasoning:** This is a stress test for the account developed in steps 1 and 2. Transitivity is a logical property that depends on how you define the relata (Representation) and how you select causes (Division of Labour). If you have solved 1 and 2, chains are largely a matter of checking consistency. The accountability value is specific: it limits "root cause" analysis. If chains are unbounded, every accident is caused by the Big Bang (or the failure to prevent the Big Bang). You need a stopping rule.
  **Tractability:** High, provided 1 and 2 are settled. It is a logic puzzle.
  **Evidence to Move Agenda:**
  *   *Move Down:* If the account of norms (Hunch 2) naturally limits chains (e.g., norms are local, so causal chains stop where norms run out), this requires little independent work.
  *   *Move Up:* If transitivity holds robustly despite normative limits, you face a paradox that threatens the whole programme. You may need to sacrifice transitivity, which has major downstream costs for legal theory.

  ### 4. Individuation (Hunch 1)
  **Priority:** Fourth (Contingent/Minimal)
  **Reasoning:** This is the deepest metaphysics but the least useful for your specific funder. Accountability is inherently descriptive and interest-relative: a regulator charges you with "Failure to file Form 10," not "Failure to be a molecule in configuration Y." Whether "not filing" is ontologically identical to "sitting still" rarely changes the liability. The law individuates omissions by the *duty breached*, not by the *physics of the body*. Pursuing a non-relative account of omission individuation risks solving a problem the practitioners do not have.
  **Tractability:** Low. This is the traditional quagmire of action theory. It is prone to verbal disputes that do not resolve.
  **Evidence to Move Agenda:**
  *   *Move Up:* Only if it turns out that different individuation schemes yield different truth values for causal claims *even holding norms constant*. (This is unlikely).
  *   *Move Down:* If it is confirmed that individuation is always relative to a description/duty, this item is closed immediately as a "pragmatic" matter.

  ---

  ### The Dead End: Individuation (Hunch 1)

  Hunch 1 is the most likely dead end *for this specific programme*.
  **Why:** The funder wants work usable by institutional accountability. Institutions do not deal in raw ontology; they deal in *descriptions under which agents are bound*. A safety review team does not ask, "What is the metaphysical identity of this non-event?" They ask, "Was there a requirement to act, and was it not met?"
  If your postdocs spend Year 1 debating whether an omission is a negative event or a positive state of affairs, they will produce papers, but they will not produce tools. The "relativism" you worry about in Hunch 1 is actually a feature, not a bug, for your end-users. Regulators *want* causation to be relativized to statutory duty. Trying to find a "view from nowhere" individuation of omissions is philosophically seductive but practically inert. If the team finds that individuation is interest-relative, they should stop there and treat it as a parameter for the model, not a metaphysical mystery to be solved.

  ### What to Leave Out

  **The Ontology of "Nothingness."**
  Leave out any work that attempts to ground omissions in a robust ontology of negative facts or non-being.
  **Reasoning:** Whether omissions are "real" in the same way rocks are real is the concession you have already made. Digging deeper into *what kind* of entity an omission is (trope, absence, counterfactual state) yields diminishing returns for accountability. The accountability audience is functionalist: if the model predicts the outcome and assigns the duty, they do not care if the omission is a "real entity."
  **Impact:** Dropping this saves roughly 30% of the philosophical labour, allowing the team to focus on the *structure* of the causal relation (Hunch 2 & 3) rather than the *nature* of the relata (Hunch 1).

  ### Programme Flow (3 Years)

  *   **Year 1 (The Interface):** Postdoc A (Metaphysics) and the Modeller work on **Representation**. Goal: A formal syntax where omissions are first-class citizens, not just "0" values. Postdoc B works on **Division of Labour**, cataloging cases where norms diverge from counterfactuals.
      *   *Milestone:* A working causal model of a standard omission case (e.g., lifeguard negligence) that regulators can inspect.
  *   **Year 2 (The Substance):** Postdoc B finalizes the **Division of Labour** account. Is the norm in the cause or the blame? This determines the output architecture. Postdoc A begins testing **Omission Chains** using the Year 1 models.
      *   *Milestone:* A decision procedure for "causal vs. normative" factors in incident reports.
  *   **Year 3 (The Stress Test & Application):** Focus on **Chains** and transitivity limits. Draft guidelines for post-incident review teams on how to truncate causal chains without losing accuracy. **Individuation** is only addressed if it blocks the chain analysis (likely it won't).
      *   *Milestone:* A prototype "Accountability Protocol" for automated system failures, ready for pilot testing by a partner organization.

  ### Summary Assessment of Your Hunches

  *   **Hunch 4 (Representation):** **Fund this first.** It is the bottleneck. If the math doesn't work, the metaphysics is idle.
  *   **Hunch 2 (Division of Labour):** **Fund this second.** It is the value proposition. This determines if you are building a physics engine or a court room.
  *   **Hunch 3 (Chains):** **Fund this third.** It is the quality control.
  *   **Hunch 1 (Individuation):** **Fund this minimally.** It is the trap. It looks central to metaphysics but is peripheral to accountability. Treat it as a background assumption (relativized to duty) rather than a research question, unless evidence forces it upstream.
