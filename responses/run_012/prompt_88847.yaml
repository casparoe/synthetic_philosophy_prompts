prompt: |-
  Assume, for the sake of the exercise, that failures to act can be genuine causes — that at least one defensible account of causation admits omissions as relata — and treat the live work as lying downstream of that concession rather than in re-litigating it. I am assembling a three-year programme (two postdocs, a workshop budget, no empirical staff) on the metaphysics of omission and prevention. The funder is a philosophy-friendly foundation whose stated interest is that the work eventually become usable by people doing institutional accountability: regulators, tort and criminal-law theorists, and teams that run post-incident reviews of automated systems. Abstract work is fine; work with no conceivable route to that use is not.

  What should the programme take up, and in what order? I want the reasoning more than the list: for each item, what makes it upstream of the others, how tractable it is with the tools of analytic metaphysics plus a competent formal modeller, and what evidence over the next two or three years would move it up or down the agenda. My own hunches, which I would like you to assess rather than simply adopt:

  1. Individuation. A single non-action can be described as failing to do A, as failing to do B, as failing to do anything at all, or as the positive event of continuing to sit still. Much of the disagreement about whether omissions cause anything may really be a disagreement about how omissions get cut up. Is there an account of omission individuation that is not simply relativized to our explanatory interests — and if there is not, does that relativism infect the causal claims themselves or only our reports of them?

  2. The division of labour between counterfactual dependence and everything else. Counterfactual dependence is cheap in cases of inaction: for nearly any outcome there is some non-action on which it depends. If so, something else is doing the work of singling out the cause — a norm, a default, a statistical baseline, an expectation. Is that supplementary element constitutive of the causal relation, or is it a feature of our causal talk and our blame? The answer looks load-bearing for the accountability audience, so I want to know whether it can be settled before the applied work leans on it.

  3. Omission chains. If causation is transitive and omissions can be causes, then long chains of non-actions look causally potent (nobody reminded anyone, nobody checked anything, and the outcome followed). Does an account of omission causation have the resources to stop such chains from swamping the more local causes, or must it give up transitivity, or deny that the chains are causal at all?

  4. Representation. What formal apparatus can even represent an omission? In a structural model an intervention is defined relative to a set of alternatives, and it is not obvious what not doing X is as an intervention rather than as a description of an undisturbed system. If our only rigorous formalisms treat omissions as second-class citizens, does that tell us something about the metaphysics, or only about the formalisms?

  Rank what you would fund, defend the ranking against criteria you state explicitly, and say what you would leave out — including anything that looks central but whose resolution would not change much downstream. Also tell me which of the four hunches above is most likely to be a dead end, and why. I do not need citations or a reading list; I want a case for a division of effort.
reasoning: |-
  Here's a thinking process that leads to the suggested programme:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 3-year research programme (2 postdocs, workshop budget, no empirical staff) on the metaphysics of omission and prevention.
      *   **Constraint 1 (Metaphysical):** Assume omissions *can* be causes (don't debate the existence, debate the nature).
      *   **Constraint 2 (Practical):** The work must eventually be usable by institutional accountability agents (regulators, legal theorists, post-incident review teams for automated systems). Abstract work is okay *only if* it has a conceivable route to use.
      *   **Task:** Rank the four provided hunches (Individuation, Counterfactual/Norm division, Omission Chains, Representation), defend the ranking, state criteria, identify what to leave out, and identify the most likely dead end.
      *   **Output Style:** Reasoning-heavy, no citations/reading lists, focus on division of effort and upstream/downstream relationships.

  2.  **Evaluate the Four Hunches (Initial Assessment):**

      *   *1. Individuation:* How do we carve up non-actions? Is "not saving the drowning child" the same event as "sitting on the bench"? This is deep metaphysics. If this is relativized to interests, does causation become relativized?
      *   *2. Division of Labour (Counterfactuals vs. Norms):* Counterfactual dependence is too broad (everything depends on my not flapping my arms). We need norms/defaults to narrow it down. Is the norm part of the *causation* or part of the *blame*? This is crucial for accountability.
      *   *3. Omission Chains:* Transitivity issues. If A omits, causing B to omit, causing C harm... does the chain go back forever? Need to stop the swelling of causes.
      *   *4. Representation:* Formal modeling (Structural Equation Models - SEMs, Causal Bayes Nets). How do you model "not doing X"? Is it a variable set to 0? Is it an intervention? If the math can't handle it, can the metaphysics?

  3.  **Determine the Criteria for Ranking:**
      *   **Upstream/Foundational:** Which questions must be answered before others make sense?
      *   **Tractability:** Can 2 postdocs + 1 formal modeller make progress in 3 years?
      *   **Impact on Accountability (The "Use" Constraint):** Which answer changes how a regulator or lawyer assigns responsibility?
      *   **Bottleneck Potential:** Which question, if left unresolved, blocks progress on the others?

  4.  **Drafting the Ranking & Reasoning:**

      *   *Priority 1: Representation (Hunch 4).*
          *   *Why:* You can't do rigorous work on individuation, norms, or chains without a formal language to express them. The accountability audience (especially automated systems review) *needs* formal models. If the formalism treats omissions as second-class, the whole project stalls. This is the tool-building phase.
          *   *Upstream:* You need the syntax/semantics before you analyze the logic (chains) or the semantics of individuation.
          *   *Accountability:* Regulators want models they can run or inspect.
          *   *Tractability:* High. Formal modelling is concrete.

      *   *Priority 2: Division of Labour (Hunch 2).*
          *   *Why:* This is the bridge between metaphysics and accountability. Accountability is about picking *the* cause from the sea of conditions. If norms are constitutive of causation, then establishing a duty is establishing a cause. If norms are separate (causation + blame), the analysis splits. This determines the *structure* of the accountability report.
          *   *Upstream:* Needed before tackling Chains (you need to know what counts as a cause to know if the chain holds).
          *   *Accountability:* Critical. Legal theory hinges on duty vs. causation.

      *   *Priority 3: Omission Chains (Hunch 3).*
          *   *Why:* Once you have a model (Rep) and a criterion for cause-selection (Division), you test the logic. Transitivity is the stress test.
          *   *Upstream:* Depends on 1 and 2.
          *   *Accountability:* Important for "root cause analysis," but less fundamental than defining what a cause *is*.
          *   *Tractability:* Moderate. Logic puzzles are solvable.

      *   *Priority 4: Individuation (Hunch 1).*
          *   *Why:* This is the deepest metaphysics but potentially the least useful for the stated goal. Whether "sitting" is identical to "not saving" might be interesting, but for accountability, the *description* under which the agent is held responsible matters more than the ontological status of the event.
          *   *Dead End Risk:* High. It might turn out to be purely linguistic/conceptual relativism with no causal bite.

  5.  **Refining the Argument (Self-Correction/Critique):**

      *   *Critique of putting Representation first:* Is formal modeling really metaphysics? The prompt asks for a metaphysics programme.
      *   *Rebuttal:* The prompt explicitly mentions a "competent formal modeller" and the end-users include "teams that run post-incident reviews of automated systems." These teams *live* in formal models (causal graphs, logs). If the metaphysics doesn't map to the models the practitioners use, it's useless. Therefore, Representation is the gateway.
      *   *Critique of Individuation:* Is it really the least important? If we can't individuate omissions, how do we count them?
      *   *Rebuttal:* For accountability, we care about *agents* and *duties*. "You failed to file the form" is the omission. Whether that is ontologically identical to "drinking coffee" matters less than whether "filing the form" was a required intervention in the model. Individuation is often a proxy for the Norm question (Hunch 2).
      *   *Dead End Analysis:* Hunch 1 (Individuation) is the strongest candidate for a dead end *for this specific funder*. It risks becoming a linguistic debate that doesn't change liability outcomes.

  6.  **Developing the "Evidence to Move Agenda" Section:**
      *   For each priority, what would make us pivot?
      *   *Rep:* If standard SEMs can be tweaked easily, move faster to Norms. If they break completely, spend more time here.
      *   *Norms:* If we find norms are purely pragmatic (not constitutive), shift focus to blame frameworks rather than causal frameworks.
      *   *Chains:* If transitivity holds without explosion, great. If not, we need a new logic.
      *   *Individuation:* If it turns out to be purely interest-relative, downgrade it to a "user manual" issue rather than a metaphysical one.

  7.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the constraint (omissions are causes) and the goal (accountability).
      *   **Criteria:** Define the metrics (Upstreamness, Tractability, Accountability Leverage).
      *   **The Ranking:** 1. Representation, 2. Division of Labour, 3. Chains, 4. Individuation.
      *   **Detailed Reasoning per Item:** Connect to criteria.
      *   **The Dead End:** Explicitly call out Individuation.
      *   **What to Leave Out:** Purely ontological debates that don't touch norms or models.
      *   **Programme Flow:** Year 1, 2, 3 structure.

  8.  **Tone Check:** Ensure it sounds like a grant strategy/philosophical assessment, not a literature review. Focus on *division of effort*.

      *(Self-Correction during drafting)*: Make sure I don't ignore the "metaphysics" aspect. Representation isn't just coding; it's about what the variables *represent* in reality. Keep the link between the formal and the ontological tight.

      *(Refining the "Dead End" argument)*: Why is Individuation a dead end? Because accountability is prescriptive. It tells you what you *should* have done. The ontological status of the "not-doing" is secondary to the normative expectation. If the metaphysics of individuation doesn't change the normative expectation, it doesn't change the accountability.

      *(Refining the "Representation" argument)*: Why is it first? Because the "automated systems" audience speaks in causal graphs. If the metaphysics can't be translated into a graph, it's dead on arrival for that stakeholder.

  9.  **Final Polish:** Check against all constraints in the prompt. (3 years, 2 postdocs, no empirical staff, specific hunches assessed).

