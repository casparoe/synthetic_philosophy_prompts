      "A single non-action can be described as failing to do A, as failing to do B..."
      If I am a regulator, I care about "Failure to file Form X." I don't care if that is ontologically the same as "Breathing."
      So, for the *accountability* goal, Individuation is low priority.
      For the *metaphysics* goal, it's high priority.
      The funder wants "usable by people doing institutional accountability."
      So Individuation must be deprioritized.

      *Let's look at Hunch 3 (Chains).*
      Transitivity is a logical property. It depends on the definition of causation (Hunch 2) and the representation (Hunch 4). So it is downstream.

      *Conclusion on Ranking:* 4 -> 2 -> 3 -> 1.

      *Wait, one more check:* Is Representation (4) actually a hunch about metaphysics or just modeling?
      "If our only rigorous formalisms treat omissions as second-class citizens, does that tell us something about the metaphysics, or only about the formalisms?"
      This is a metaphysical question about the relationship between formalism and reality. It fits.

      *Final Plan:*
