      **RATE SCHEDULE AND REFERENCE CLASSES**

      Assignment to a reference class is a collaborative selection, not a discovery. Clients opting for Class-Selection Advisory (fee applicable) may choose between defensible historical categories. Different selections yield different premiums. The Firm takes no position on which class is objectively correct, only which is most representative of the Client's narrative identity.

      | Reference Class | Base Premium (per annum) | Exception Rider* | Decline Rider** |
      | :--- | :--- | :--- | :--- |
      | Confessional Monarchies (1815–1914) | 4.5% | +2.0% | -0.5% |
      | Maritime Trading Republics | 3.2% | +1.5% | -0.4% |
      | Continental Land Empires | 6.1% | +3.0% | -0.8% |
      | Single-Party States (20th C.) | 8.4% | +4.0% | -1.0% |
      | Bespoke Sovereign Class† | 0.1% | N/A | N/A |

      *Exception Rider: Client asserts current century differs from historical precedent.
      **Decline Rider: Client acknowledges terminal decay; reduces premium but voids claim upon collapse.
