      **Reply:** Correct. The Firm holds no observations of non-applicants. Pricing is based exclusively on the book of past clients.

      **Objection:** Worry regarding survival is itself a symptom of instability.
      **Reply:** Agreed. However, calm polities do not apply. The pool consists entirely of the worried. This is factored into the base rate.

      **Objection:** Our state is unique; historical analogues are irrelevant.
      **Reply:** Uniqueness is not a risk factor we price. If uniqueness is preferred, please purchase the Bespoke Sovereign Class. Note that while the premium is lowest, the class size is one.

