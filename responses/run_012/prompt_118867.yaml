      *   *Header:* Whitmore & Gales. 1847. *Permanence Through Calculation.*
      *   *Intro:* To the Sovereign Client. Premiums reflect the outside view. Your internal narrative is excluded. Historians may attend pricing meetings as non-voting observers.
