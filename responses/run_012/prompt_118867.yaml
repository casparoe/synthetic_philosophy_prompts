      **Terms of Payout and Continuity:**
      1. The Continuity Endowment pays out only upon the verified cessation of the Client's sovereign existence.
      2. All claims must be filed by the recognized sovereign authority of the Client polity.
      3. Recognized sovereign authority is legally extinguished upon the cessation of sovereign existence.
      4. In the event of Class-Selection Advisory usage, the Firm reserves the right to reclassify the Client post-claim based on historical hindsight.
      5. No claim may be processed without a valid signature from an authorized officer of the existing polity.

      *Whitmore & Gales accepts no liability for paradoxes arising from Sections 1 through 3.*

