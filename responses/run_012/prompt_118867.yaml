          1.  Opening assurance (outside view, client historians welcome advisory).
          2.  Rate table (3-4 reference classes, riders including Exception and Decline).
          3.  Frequently Raised Objections (replies concede more than objections).
          4.  Closing Notice to Clients (small print, clauses ensuring no payout).
      *   **Key Concepts to Embed:**
          1.  *Reference Class Selection:* Class is selected, not discovered. Class-Selection Advisory is paid. Same polity in different classes = different premiums. Firm defers to client's "self-understanding."
          2.  *Selection Effects/Survivorship Bias:* Data only includes polities that existed long enough to buy insurance (worry is a symptom). No observations of non-existent polities.
          3.  *Class of One:* Bespoke class containing only the client. 100% survival rate, lowest premium. Footnote discloses accuracy.

  2.  **Drafting - Section by Section:**

      *   **Header:** Firm Name, Date, Motto.
          *   Name: Whitmore & Gales Actuarial Consortium.
          *   Date: Est. 1847.
          *   Motto: *Permanence Through Calculation.*

      *   **Opening:** Needs to sound professional but unsettling. Address the "outside view."
          *   *Drafting thought:* Emphasize that internal optimism is irrelevant. The premium is based on the group, not the individual. Historians can watch but not touch.

      *   **Rate Table:** Needs specific classes.
          *   Classes: Post-Napoleonic Confessional Monarchies, Maritime Trading Republics, Continental Land Empires, Twentieth-Century Single-Party States.
          *   Columns: Base Premium, Exception Rider (this century is different), Decline Rider (acknowledging decay).
          *   *Class of One:* Needs to be in here or noted. Let's put it in the table as "Sovereign Bespoke."
          *   *Selection Bias:* Mention that data comes from past clients.

      *   **Frequently Raised Objections:**
          *   Objection: "We are unique." Reply: "Yes, but uniqueness is not a risk factor we price."
          *   Objection: "Your data is old." Reply: "New data is unavailable because new states haven't survived long enough."
          *   Objection: "You only insure those who worry." Reply: "Correct. Calm states do not apply."

      *   **Closing Notice:** Small print. Clauses that prevent payout.
          *   Clause 1: Payout requires continuous existence.
          *   Clause 2: Definition of existence requires solvency.
          *   Clause 3: If claim is made, policy voids.

  3.  **Refining and Polishing (Word Count & Tone Check):**
      *   *Tone:* Must be dry, bureaucratic, actuarial. No jokes explicitly stated.
      *   *Word Count:* Target ~650.
      *   *Key Jokes:*
          *   Class selection is subjective but priced as objective.
          *   Survivorship bias acknowledged as a feature (worry = symptom).
          *   Class of One (100% survival because it only contains the client *now*).
          *   Payout impossibility.

