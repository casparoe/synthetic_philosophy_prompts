      *   *Actually, the biggest tension is 1 vs 2.* If you teach a seminar on desert, and you believe desert doesn't exist, you are teaching a seminar on a ghost. You need to frame it as "The Concept of Desert" not "Who Deserves What."
      *   *No, 1 vs 5 is more visceral.* Students will ask: "If effort is luck, why pick the fighter?"
      *   *Okay, let's look at 3 vs 4 again.* "Comfortable with markets" vs "Sorting is corrosive." If markets sort, and sorting is corrosive, being comfortable with markets is sociopathic unless qualified.
