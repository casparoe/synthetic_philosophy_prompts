      *   **Critical Damage (Must Fix):** Claim 5 in light of Claim 1. You can't say "Effort isn't deserved" and then "Give it to the one who exerted effort" without explaining *why* (if not desert). If the reason is utility, admit it. If the reason is desert, you contradict Claim 1.
