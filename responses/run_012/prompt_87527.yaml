answer: |-
  The waiting room of the ferry terminal smelled of wet wool, diesel, and the particular stale coffee that only exists in places designed for transit. Outside, the grey water of the sound chopped against the pilings. It was the last crossing of the season; after tomorrow, the schedule would revert to winter, and the island would be cut off until the spring thaw.

  Elias sat on a bolted-down bench, the paper heavy in his lap. Across from him sat Mr. Vane. Vane wore a suit that was too warm for the climate and held a briefcase that looked as though it had never been opened. To Elias's left sat his wife, Mara. She was watching the rain streak the high windows, her arms folded tight across her chest.

  On Elias's lap lay the document. It was a single sheet of bond paper, dated three days ago. It bore a typed statement: *In the event of the Ask, Mr. Elias Thorne will sign the easement.* Below it was Vane's signature.

  Three days ago, Vane had flipped a coin in his office on the mainland. Elias knew this because Vane had told him, and Elias had no reason to doubt the man's truthfulness. There was no magic in Vane, no aura of divinity. He was an administrator for the Trust that managed the St. Jude's Academy, the only school on the mainland equipped to handle Elara's condition.

  The arrangement was simple, though it had taken Elias forty years of studying rock strata and three years of studying philosophy to feel the weight of it.

  If the coin landed on Heads, Vane would come to the island and ask Elias to sign over the mineral rights to the family plot. The land was worthless for mining, but it was his father's land, and Elias was a geologist; the rights were a matter of principle, a lineage written in the ground.

  If the coin landed on Tails, Vane would grant Elara's residency permit immediately, waiving the waiting list. But there was a condition attached to the Tails outcome. Vane would only grant the permit if, in the Heads outcome, he had predicted that Elias would have signed the easement.

  Vane had predicted Elias would sign. Vane had written that prediction three days ago, before Elias knew he would be standing in this terminal, before Elias knew which way the coin had fallen.

  The coin had fallen on Heads. Vane was here to ask. The permit was not on the table. The permit existed only in the shadow of the toss that hadn't happened.

  "The ferry boards in ten minutes," Vane said. His voice was level, devoid of pressure. He checked his watch. "If you sign, I file the easement. If you don't, I return to the mainland empty-handed. The school board reviews the waiting list tomorrow morning."

  Elias looked at the paper. *Mr. Elias Thorne will sign the easement.*

  He uncapped the pen. It was a cheap plastic thing the terminal provided. The ink felt cold in his hand.

  "Don't," Mara said. She didn't look at him. She was watching a seagull battering itself against the glass outside.

  "It's just land, Mara. We don't drill. We never would."

  "It's not about the drilling." She turned to him then. Her eyes were red-rimmed, tired. "It's about the logic. Look at the table, Elias. The coin is Heads. We are in the Ask world. The Reward world is Tails. Tails didn't happen."

  "Vane's prediction was made before the branch split," Elias said. He heard the academic tone in his voice and hated it. It sounded like a lecture hall, not a ferry terminal. "The document describes me. It says I am the kind of man who signs."

  "The document describes a man who didn't know what the document said," Mara countered. "You know now. You're holding it. You know that if you sign, you lose the rights and get nothing. Elara doesn't get the spot because the coin was Heads. She gets the spot only if the coin was Tails *and* you signed. The coin wasn't Tails."

  Vane shifted slightly. He did not intervene. He was an observer of the transaction, not a participant in the marriage.

  "If I refuse," Elias said, "then the paper is a lie. Vane predicted I would sign. If I don't, his model of me is broken."

  "His model is already broken," Mara said. "Because you're thinking about it. The man he wrote about three days ago didn't know he was being tested. He just acted. You are acting with knowledge. You are trying to pay a debt to a timeline that doesn't exist."

  She leaned forward, resting her elbows on her knees. "Elias, listen to me. A demand whose reward lies in a branch that never happened is not a demand. It's a ghost. You are being asked to bleed for a wound you didn't take."

  Elias looked down at the line where his signature was required. The mineral rights were a formality. The Trust wanted them to secure a potential geothermal survey. It was bureaucracy. But it was also the last piece of his father's estate that remained unencumbered. To sign was to admit that the land was a resource, not a home.

  But beyond the land was the principle of the prediction. Elias had spent his life reading the earth. He knew that pressure created diamonds, that strata told the truth of time. If the earth said there was oil, there was oil, regardless of whether you drilled. If Vane's paper said Elias would sign, then Elias should sign. To refuse was to say that the present moment could rewrite the past's truth.

  "If I sign," Elias said, "I validate the prediction. I prove that his understanding of my character was accurate."

  "His understanding was accurate for a man who was ignorant," Mara said. "You aren't ignorant anymore. You're being asked to sacrifice something real in this world for a benefit that exists only in the other world. The other world is dead, Elias. It never breathed."

  Vane cleared his throat. "Five minutes, Mr. Thorne. If you sign, I process the easement. If you do not, I leave. The school board meets at nine."

  Elara was asleep in the car outside, wrapped in blankets. She was seven. She loved the rocks Elias brought her from the cliffs. She didn't know that her future depended on a coin toss and a piece of paper.

  Elias thought about the geology of the decision. In the field, you often had to make a call based on incomplete data. You extrapolated the vein from the outcrop. You trusted the pattern. Vane was offering a pattern. He was saying that consistency of character mattered more than the immediate outcome. If Elias was the kind of man who kept his word—even a word spoken by a proxy in a dead timeline—then he was worthy of the Trust.

  But Mara was right. The reward was in the Tails branch. In this branch, the Heads branch, the reward was null. Signing the easement cost him the rights. It gained him nothing but the satisfaction of being consistent with a prediction that had no causal power over his current reality.

  "It's a tax on integrity," Elias murmured.

  "It's a tax on stupidity," Mara said. Her voice wasn't angry anymore. It was flat. "You want to pay because you feel guilty that you aren't the man in the paper. But the man in the paper didn't know the coin landed Heads. You do. He was making a choice. You are making a payment."

  Elias capped the pen. He uncapped it again. The plastic clicked loudly in the quiet room.

  He looked at Vane. "If I sign, does it change anything for Elara? Here. Now."

  "No," Vane said. "The coin was Heads. The permit is not available in this instance. Your signature secures the easement for the Trust. That is all."

  "So I lose the rights," Elias said.

  "Yes."

  "And Elara remains on the waiting list."

  "Yes."

  Elias looked at the paper. *Mr. Elias Thorne will sign the easement.*

  If he signed, he became the man Vane saw. He aligned the timeline. He made the prediction true. But he did so in a vacuum. He would be a man who kept a promise that yielded no fruit.

  If he refused, he kept the land. He kept the rights. He admitted that he was a man who changed his mind when the stakes were revealed. He admitted that the prediction was wrong.

  Mara reached out and covered his hand. Her palm was warm. "The branch that never happened," she whispered. "Don't haunt yourself, Elias."

  He thought about the rocks. They didn't care if they were observed. They existed regardless of the geologist. But men were not rocks. Men were defined by what they did when they were watched, and what they did when they were alone. This was a strange middle ground. He was being watched by a man who represented a world that didn't exist.

  The ferry horn blew. A long, low mournful sound that vibrated in the floorboards. Passengers began to stand, gathering bags, zipping coats. The queue for the car ramp would open soon.

  Vane stood up. He smoothed his suit jacket. "I need to board, Mr. Thorne. If the document is not signed, I will record the refusal and file the easement as rejected."

  Elias looked at the line. The ink was black. The paper was white. The choice was binary.

  He thought about the version of himself in the Tails world. In that world, the coin had fallen differently. In that world, Vane had not asked for the easement. In that world, Vane had handed over the permit. But only because *this* version of Elias, in *this* world, signed the paper.

  If Elias refused, did he steal the permit from his other self? Did he doom the Elara of the Tails world to the waiting list because the Elias of the Heads world was selfish?

  Or was that madness? Was the Tails world just a story Vane told to make the Heads world hurt more?

  Mara stood up. She picked up her bag. "I'm going to the car. Elara will be waking up." She didn't wait for him. She walked toward the glass doors, her reflection fading into the grey afternoon.

  Elias was alone with Vane. The administrator held out a hand for the paper. He did not look impatient. He looked like a man collecting a receipt.

  "It's about who you are," Elias said.

  Vane tilted his head. "It is about what you do."

  "The paper says I will sign."

  "The paper is a record of a forecast," Vane said. "Forecasts are often wrong. The weatherman predicts sun, and it rains. We do not blame the rain for contradicting the forecast."

  "But you built the condition on the forecast."

  "I built the condition on the assumption of consistency," Vane said. "The Trust values consistency. We admit students whose parents understand that obligations exist outside of immediate gain."

  "That sounds like a justification for a trap."

  "It is a filter," Vane corrected. "For the Tails outcome. Not for this one."

  Elias looked at the door where Mara had exited. She believed the reward was a ghost. She believed that paying for a ghost was madness. She believed that the only reality was the one where the coin landed Heads, and in that reality, signing was a loss.

  Elias looked at the pen. He thought about the strata. He thought about the pressure.

  If he signed, he paid the cost. He gained nothing. He simply proved Vane right.
  If he refused, he kept the cost. He gained nothing. He proved Vane wrong.

  The only difference was the truth of the sentence on the page.

  The queue opened. A uniformed officer waved them toward the ramp. Vane stepped forward, hand still extended.

  Elias lowered the pen to the paper. The tip touched the fiber. He did not press down. He held it there, suspended between the white space and the black ink, between the land he owned and the man he was predicted to be.

  The ferry engine roared to life below them, a deep thrum that shook the bench.

  Vane waited. The rain continued to fall on the sound, blurring the line between the water and the sky. Elias kept the pen hovering, his hand steady, his breath held, while the seconds ticked away into the noise of the departure.
