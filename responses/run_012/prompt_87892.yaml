answer: |-
  Here is the plan for the seventy-five-minute session. It is structured to prevent the students from metabolizing externalism into a claim they already accept (e.g., "context matters" or "training data matters") and to force them into the specific metaphysical tension Putnam and Burge identified.

  ### I. The Sequence: Earning the Conclusion

  Do not begin with Twin Earth. Begin with **Psychological Supervenience**. Your students are cognitive scientists; they accept that mental states supervene on physical states of the organism. You must make this explicit before you challenge it.

  **1. The Internalist Baseline (0–10 mins)**
  *   **Goal:** Formalize their intuition so it can be broken.
  *   **Move:** Elicit from them the claim: "If two agents are molecule-for-molecule identical from the skin in, they are in the same psychological state."
  *   **Why:** This establishes the "In the Head" thesis not as a vague feeling but as a supervenience claim. It forces them to commit to the idea that the *boundary of the skin* is the boundary of the mind.
  *   **Prerequisite:** You must distinguish **Meaning as Reference** (extension) from **Meaning as Concept** (intension/psychological content). If they conflate these, externalism looks trivial (obviously reference depends on the world). You need them to agree that for the internalist, *concept* determines *reference*.
  *   **Checkpoint:** Ensure they agree that if the concept is in the head, and the head is identical, the concept is identical.

  **2. The Carrying Example: "The Standard Case" (10–30 mins)**
  *   **Why not Water?** You are correct; Water/XYZ invites a "chemistry is special" deflation. You need a case where the "hidden structure" is **social**, not physical, to match their distributed systems intuition without letting them retreat to "it's just the training data."
  *   **The Example:** Two engineers, **Ada** and **Twin-Ada**.
      *   **Internal State:** Identical. Same training, same mental associations, same behavioral dispositions.
      *   **Environment:** Ada works at Company A; Twin-Ada works at Company B.
      *   **The Term:** "The Standard." Both use a component they call "The Standard."
      *   **The Difference:** In Company A, "The Standard" is defined by the ISO committee as having Property P1. In Company B, "The Standard" is defined by the ISO committee as having Property P2.
      *   **The Crucial Stipulation:** Neither Ada knows the specific technical definition. They both defer to "the experts" or "the documentation." They believe "The Standard works."
      *   **The Conflict:** Ada's thought "The Standard is reliable" is true if the ISO-P1 component is reliable. Twin-Ada's thought is true if the ISO-P2 component is reliable.
  *   **What it must have:** Explicit **deference**. They must acknowledge they are not the authorities on the term's extension. This blocks the "but they have different beliefs" objection.
  *   **What it must lack:** Any difference in causal history of *acquisition* that looks like "training data." They learned the word the same way. The difference is purely in the *current* social environment's normative facts.
  *   **The Work:** This example forces the realization that the *truth conditions* of their identical internal states differ. If truth conditions differ, content differs. If content differs, content is not in the head.

  **3. The Inference: From Reference to Content (30–45 mins)**
  *   **Goal:** Move from "they refer to different things" to "they mean different things."
  *   **Move:** Ask: "If Ada says 'I hope The Standard holds,' and Twin-Ada says 'I hope The Standard holds,' are they hoping for the same thing?"
  *   **Trap:** If they say "Yes, they have the same hope," they are retreating to Narrow Content (see Crux below).
  *   **Push:** "If the ISO committee changes the definition overnight while Ada sleeps, does her thought change?" If they say no, they are internalists. If they say yes, they are externalists. Push for the "Yes" by appealing to the **Division of Linguistic Labor**: The content of her thought is partly constituted by the experts she defers to.
  *   **Canonical Cases (Water & Arthritis):** Now, and only now, introduce Putnam and Burge.
      *   **Water (Putnam):** Use this as the **Natural Kind** formalization of "The Standard." It shows the logic applies to physics, not just social norms. *Flag as contested:* Does this prove *content* externalism or just *reference* externalism? (See Crux).
      *   **Arthritis (Burge):** Use this to show the phenomenon applies to non-natural kinds (social concepts). This validates "The Standard Case" as philosophically canonical, not just an anecdote.

  ### II. The Misconception Map

  Here is where the specific errors arise and how the sequence blocks them.

  **1. "Meaning is just the Training Distribution" (The Embeddings Trap)**
  *   **Where it forms:** Phase 1 (Internalist Baseline).
  *   **The Error:** Students will equate "external factors" with "historical inputs" (the corpus). They will think externalism just means "your vectors depend on your data."
  *   **How to Block:** In Phase 2 ("The Standard Case"), stipulate that Ada and Twin-Ada have **identical training histories**. They read the same docs, saw the same examples. The difference is *not* in the past inputs (weights) but in the *current normative facts* of their environment. Externalism is about *constitution*, not *causation*.
  *   **Intervention:** "If I clone your model weights and deploy one instance in a server where '0' means 'false' and another where '0' means 'true', do the instances compute the same function?"

  **2. Twin Earth as Skeptical Scenario (The Deception Trap)**
  *   **Where it forms:** Phase 2 (Introducing the Twin).
  *   **The Error:** Treating Twin-Ada as deceived or hallucinating. "Twin-Ada is wrong about what she means."
  *   **How to Block:** Emphasize **Symmetry**. Neither is deceived. Both are correct relative to their environments. The point is not that one is mistaken, but that identical internal states track different truths.
  *   **Intervention:** "We are not asking who is mistaken. We are asking if their thoughts have the same truth conditions."

  **3. "Water" as Indexical (The Triviality Trap)**
  *   **Where it forms:** Phase 3 (The Inference).
  *   **The Error:** " 'Water' just means 'the liquid around here'. Of course it changes on Twin Earth. That's trivial."
  *   **How to Block:** This must be preempted in Phase 1. If meaning were indexical, the *concept* would be `LIQUID(HERE)`. But the concept is `WATER`. The internalist claims the concept `WATER` is in the head. The externalist claims the concept `WATER` *contains* the environment.
  *   **Intervention:** "If 'water' meant 'liquid around here', then before 1750, when no one knew the chemistry, did people mean 'H2O' or 'whatever is around here'? Putnam says they meant H2O. Indexicality cannot explain that."

  **4. Claim About Words vs. Claim About Thought**
  *   **Where it forms:** Throughout.
  *   **The Error:** "Okay, the *word* 'water' refers to H2O. But my *idea* of water is still in my head."
  *   **How to Block:** In Phase 3, explicitly reframe the question. "We are not talking about the dictionary. We are talking about the **propositional attitude**." When Ada believes *that water is wet*, is the *that-clause* determined internally?
  *   **Intervention:** "If content is in the head, then psychology is individualistic. If content is external, then psychology is partly environmental. Which is it?"

  **5. Reference vs. Content (The Live Crux)**
  *   **Where it forms:** Phase 3/4 (Transition to Canonical Cases).
  *   **The Status:** **This is not a misconception; it is a serious objection.** (The "Narrow Content" defense).
  *   **The Objection:** Putnam proves *reference* is external. He does not prove *psychological content* (the role the state plays in reasoning) is external. I can reason about water exactly the same way regardless of whether it is H2O or XYZ.
  *   **Where to Raise:** After "The Standard Case" but before Burge.
  *   **How much to Concede:** Concede that **causal role** might be internal. But insist that **truth-conditional content** is external.
  *   **Pedagogical Move:** "You can save internalism by saying there are two kinds of content: Narrow (in the head) and Wide (in the world). But then you must admit that what you *mean* when you speak is Wide. The session's thesis is that *semantic value* is Wide."
  *   **Flag as Contested:** Explicitly tell them: "Philosophers still fight over whether Narrow Content exists. For this session, we are accepting Putnam's challenge that if reference is external, meaning (as truth conditions) is external."

  ### III. The Ending: Boundaries and Assessment

  **1. The Final Question (Last 5 Minutes)**
  Do not ask them to summarize. Ask them to apply the *constitutive* claim to a boundary case.
  *   **Question:** "Imagine you are the last speaker of a language. The community that fixed the reference of your terms is dead. Do your thoughts still have the same content as they did when the community was alive? If yes, on what basis? If no, when exactly did your thoughts change?"
  *   **Why:** This tests if they understand externalism as a **metaphysical dependence** on the environment/community, not just a causal history. If they say "Yes, content stays the same," they have reverted to internalism. If they say "No," they must explain the mechanism of content loss.

  **2. What to Refuse to Explain**
  You must draw a boundary to keep the session self-contained. State this explicitly at the start or when questions arise.
  *   **Rigid Designation:** Do not teach the machinery of Kripkean rigid designators. It distracts from the psychological point. Say: "We are not analyzing the logic of proper names today; we are analyzing the location of mental content."
  *   **Two-Dimensional Semantics:** Do not introduce the 1-intension/2-intension distinction to solve the Narrow Content crux. It is too technical. Acknowledge the crux exists and move on.
  *   **Causal Theory of Reference:** Do not detail the causal chain mechanism. Focus on the *result* (externality), not the *process* (causation).

  **3. Contested Interpretive Choice Flag**
  You must explicitly flag this during Phase 3:
  *   *"I am presenting Putnam's argument as establishing that **content** is external. Some philosophers argue it only establishes that **reference** is external, leaving a 'narrow content' internal. We are proceeding as if Putnam's stronger claim holds for the sake of argument, because that is where the pressure on cognitive science lies."*

  ### IV. Summary of Dependencies

  1.  **Psychological Supervenience** must be established before **Twin Cases** (otherwise the twin setup makes no sense).
  2.  **Reference/Content Distinction** must be clarified before **The Standard Case** (otherwise they conflate word-use with thought).
  3.  **The Standard Case** (Social) must precede **Water** (Natural Kind) (to prevent "it's just chemistry" deflation).
  4.  **Reference Externalism** must be granted before **Content Externalism** is argued (Reference is the easier sell; Content is the philosophical leap).
  5.  **The Narrow Content Objection** must be raised before the **Final Question** (otherwise the final question is ambiguous).

  This plan respects their background by using a "Standard/Protocol" analogy they grasp, blocks the "Embeddings" misreading by isolating current environment from training history, and isolates the single philosophical crux (Narrow Content) without getting bogged down in technical semantics.
