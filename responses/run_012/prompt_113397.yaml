answer: |-
  **STATEMENT OF SHARED INQUIRY REGARDING THE NATURE OF SKILL AND KNOWLEDGE**

  **Date:** October 26, 2023
  **Parties:** [Your Name] (hereinafter "A") and [Friend's Name] (hereinafter "B")

  **Preamble**
  We have engaged in a prolonged debate concerning the relationship between practical skill ("knowing how") and factual knowledge ("knowing that"). Recognizing that we have reached an impasse due to differing foundational assumptions, we hereby produce this document to clarify our common ground, isolate our genuine disagreements, and establish criteria by which our views might be tested. We sign this not to signal agreement on the conclusion, but to agree on the terms of the dispute.

  ### I. Claims We Both Accept
  *We affirm the following propositions as true, regardless of our theoretical differences:*

  1.  **Distinction of Expression:** There is a observable difference between a person who can successfully perform a task (e.g., ski, play piano) and a person who can successfully describe the rules of that task without being able to perform it.
  2.  **Fallibility of Articulation:** A person possessing a high degree of skill may be unable to articulate the rules or principles governing their performance, even when pressed.
  3.  **Necessity of Reliability:** To say someone "knows how" to do something implies a degree of reliability; accidental success does not count as knowledge.
  4.  **Role of Facts:** Factual knowledge (e.g., knowing the sheet music, knowing the physics of friction) can often improve or assist in the acquisition of a skill, even if it is not identical to the skill itself.
  5.  **Loss of Function:** It is possible for the physical or psychological capacity to perform an action to be damaged or lost while the mental recognition of correct performance remains intact (and vice versa).
  6.  **Language Limitations:** Our ordinary use of the phrase "knows how" is flexible and may shift meaning depending on context (e.g., "He knows how to swim" vs. "He knows how to solve this equation").

  ### II. Statement of Remaining Disagreements
  *We disagree on the metaphysical relationship between the ability to act and the possession of facts. Each party accepts the following wording as a fair statement of their opponent's view and their own.*

  **A's Position (The Anti-Intellectualist View):**
  "Knowing how" is a distinct category of knowledge from "knowing that." While factual knowledge often accompanies skill, the core of a skill is a disposition or ability that is not constituted by the grasp of propositions. One can possess the knowledge (the skill) without possessing any corresponding facts that describe it. Therefore, skill is fundamental and cannot be fully reduced to factual knowledge.

  **B's Position (The Intellectualist View):**
  "Knowing how" is a specific species of "knowing that." To know how to do something is to possess factual knowledge (propositions) under a "practical mode of presentation." If a person performs a skill successfully, they are necessarily acting on facts they know, even if they cannot consciously articulate them. Therefore, all genuine knowledge is ultimately propositional; ability is merely the successful application of that knowledge.

  ### III. The Cruxes and Tests
  *We identify the following specific questions as the pivot points of our debate. We agree that settling these would significantly alter our positions.*

  **Crux 1: The Possibility of Non-Propositional Guidance**
  *   **The Question:** Is it possible for a system (a human mind) to guide complex behavior without referencing any facts/rules, even implicitly?
  *   **The Test:** If we can identify a complex skill that is logically impossible to codify into rules (even infinite rules), A wins. If every successful action can be theoretically mapped to a rule the agent is following (even unconsciously), B wins.
  *   **A's Condition for Change:** If B can demonstrate that the "Surgical Novice" (see Section V) must possess implicit factual knowledge to play the piece, A will concede that skill requires facts.
  *   **B's Condition for Change:** If A can demonstrate a case where an agent acts successfully but is demonstrably insensitive to *any* normative facts (i.e., cannot recognize errors even when pointed out), B will concede that ability can exist without knowledge.

  **Crux 2: The Definition of "Knowledge" in the Absence of Ability**
  *   **The Question:** If the physical ability is removed, does the "knowledge" remain?
  *   **The Test:** The "Stroke Victim" case (see Section V).
  *   **A's Condition for Change:** If it can be shown that the Stroke Victim retains a *practical* capacity (not just theoretical judgment) that is merely blocked, A will concede that "knowing how" survives the loss of action.
  *   **B's Condition for Change:** If it is agreed that the Stroke Victim possesses only "knowing that" (theory) and has genuinely lost "knowing how" (practice), B will concede that the two concepts are separable.

  ### IV. Analysis of the Verbal Dispute
  *We address the suspicion that we are using words differently.*

  **The Assessment:**
  We conclude that our disagreement is **partly verbal, but not merely verbal.**

  1.  **Where it is Verbal:** We are using the phrase "knowing how" to cover two different clusters of phenomena.
      *   **A** uses "knowing how" to mean *Functional Competence* (the successful output of action).
      *   **B** uses "knowing how" to mean *Practical Understanding* (the internal cognitive state guiding the action).
      *   Because A focuses on the *output* and B focuses on the *internal state*, we talk past one another. If we agree to use "Competence" for A's definition and "Practical Knowledge" for B's definition, some tension dissolves.

  2.  **Where it is Substantive:** Even if we fix our definitions, a deeper disagreement remains.
      *   A believes Functional Competence can exist without *any* underlying factual structure.
      *   B believes Practical Knowledge is *made of* factual structures.
      *   **Verdict:** Neither of us is entirely right about the verbal nature of the dispute. Separating "ability" from "grasp" helps clarify the conversation, but it does not solve the philosophical problem of whether the "grasp" is made of facts. We agree to acknowledge that we are debating the *architecture of the mind*, not just the dictionary definition of words.

  ### V. Analysis of Specific Cases
  *We apply our views to the two test cases provided. We offer both our divergent interpretations and a Joint Description we can both accept.*

  **Case 1: The Stroke Victim**
  *A woman who can no longer play a piece she once mastered, but can identify every error in a recording.*

  *   **A's Interpretation:** She has lost "knowing how." She retains "knowing that." Her skill was in her muscles and neural pathways for action, which are damaged. She now only has theoretical knowledge.
  *   **B's Interpretation:** She retains "knowing how." Her knowledge is the propositional understanding of the music and technique. The stroke damaged her *execution hardware*, not her *knowledge software*. She knows how to play, she just cannot physically manifest it.
  *   **Joint Description:** The subject retains **Evaluative Competence** (the ability to judge correctness) but has lost **Executive Competence** (the ability to produce correctness). Whether Evaluative Competence counts as "knowing how" is the specific point of contention.

  **Case 2: The Surgical Novice**
  *A novice given the physical ability to play a piece faultlessly via surgery, without learning music theory or facts.*

  *   **A's Interpretation:** This is pure "knowing how" without "knowing that." It proves skill is a distinct capacity that does not require factual grounding. The hands know what the mind does not.
  *   **B's Interpretation:** Either (1) the surgery installed implicit factual knowledge (rules of movement) into her brain, meaning she *does* know facts she cannot articulate, or (2) she is not "knowing" anything; she is merely a mechanism, like a player piano. If she cannot recognize a mistake, she lacks knowledge.
  *   **Joint Description:** The subject possesses **Blind Executive Competence**. She can produce the correct output without **Evaluative Competence**. Whether Blind Executive Competence qualifies as "knowledge" or merely "causal function" is the specific point of contention.

  ### VI. Conclusion and Signatures
  *We acknowledge that we have not resolved the debate. However, we agree that the distinction between Evaluative Competence (judging) and Executive Competence (doing) is real, even if we disagree on whether both require "facts." We agree to pause the argument until new evidence regarding Crux 1 or Crux 2 becomes available.*

