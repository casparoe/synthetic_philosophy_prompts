  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I cite literature? *Correction:* Ensure no names (Carter, Leslie, Bostrom) are explicitly dropped unless necessary for context, but the prompt says "argue from first principles rather than summarising the state of the literature". Better to describe the *concepts* than name-drop.
      *   *Check:* British English? *Correction:* Use "civilisation", "programme", "centre", "modelling".
      *   *Check:* Did I answer the specific questions?
          *   Implications if DA survives (Cosmology/Civilisations)? Yes.
          *   Implications if DA fails (X-Risk/Reference Class)? Yes.
          *   View on presentation/criticism? Yes.
          *   When is sequence reasoning valid? Yes.
      *   *Deep Dive on the Counter-Examples:* I need to be careful not to just dismiss the colleague. The TV example is weak (viewing order isn't random birth). The sibling example is strong (birth order). The lab example is mixed (stopping rule). I should focus on why the *Doomsday* case might differ from the *Sibling* case, as that's the strongest analogy.
      *   *Crucial Distinction:* In the sibling case, the parents' decision to have more children is not affected by the *existence* of the second child in a way that changes the probability of the *total number* independent of the child's perspective. But in DA, the total number of humans *includes* the observer. The "sampling" is the existence itself.
      *   *Wait, actually:* The strongest counter to the colleague is that the DA relies on the *Copernican Principle* applied to time. The sibling case fails because family size is determined by local factors, not a universal distribution. The DA assumes a universal distribution of civilisation lifespans.
      *   *Better angle:* The validity hinges on whether the observer's existence is *probabilistically independent* of the hypothesis being tested. In the sibling case, my existence is guaranteed regardless of future siblings. In the DA, the number of future humans is the variable.
      *   *Actually, the "God's Eye View" vs "Internal View":* The colleague's examples assume an external process generating the sequence. The DA assumes we are *inside* the sequence without access to the generator.

      *(Self-Correction)*: I must ensure I don't get bogged down in refuting the colleague too much, but rather use the *consequences* of accepting/rejecting their view as requested.

  8.  **Final Polish:** Check flow, clarity, and ensure the "first principles" constraint is met. (Avoid "As Bostrom says...", instead say "Proponents of the view argue..."). Ensure the distinction between *epistemic* uncertainty and *aleatory* randomness is clear.

