          1.  *Scope* is #1 because if performance only grants limited authority, the "right to rule" claim collapses.
          2.  *Definition of Goods* is #2 because if the regime defines the goods, it's not legitimacy, it's brainwashing/paternalism.
          3.  *Coercion Discount* is #3 because it tackles the moral philosophy head-on.
