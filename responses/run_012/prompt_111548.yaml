      *   *The "Right to Rule" vs. "Right to Policy":* Does delivering schools give you the right to jail dissidents? Or just the right to run the school system? (Scope of authority).
      *   *The Exit Option:* Does performance legitimacy require the *possibility* of exit (voice vs. exit)? If you can't leave, is acceptance just resignation?
      *   *The Moral Cost of Efficiency:* If an authoritarian regime delivers better health outcomes than a democracy, does the *method* (coercion) negate the *outcome* in the legitimacy calculus?
