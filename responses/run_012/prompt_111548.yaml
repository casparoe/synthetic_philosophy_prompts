answer: |-
  This is a strong brief. You're right to be bored by the "performance vs. procedure" dichotomy; it's become a placeholder for thinking rather than a tool. The "Asian Values" argument died not because it was refuted, but because it became a tautology: *We deliver growth because we are Asian; we are Asian because we deliver growth.*

  You want to know where the actual friction is. As a theorist who sits between the empirical authoritarians (who think philosophy is noise) and the analytic normativists (who think empirical reality is irrelevant), I see the field differently than either. The empirical folks obsess over survival rates; the philosophers obsess over ideal consent. The gap between them is where your book lives.

  Here is my brainstorm on your current notes, followed by the ranked list of unresolved questions.

  ### Part 1: Evaluating Your "Chewing On" List

  You asked if these are confused, settled, or beside the point. None are settled. Some are framed too narrowly.

  1.  **Flow vs. Stock (Legitimacy Accumulation):** *Live, but under-theorized.* Your hunch (it's a loan) is the standard view, but there's a counter-argument: **Habituation.** If a regime delivers for 30 years, does obedience become cultural rather than transactional? This isn't just about expectations ratcheting; it's about whether legitimacy can be *capitalized* into institutions. If it can, it's a stock. If it can't, it's a flow. This is unresolved.
  2.  **Reciprocity and Benevolent Autocracy:** *Philosophically live, politically toxic.* This is the "Fair Play" theory of obligation. If I benefit from the state, do I owe it obedience? The clean way out philosophers hate is the **Voluntariness Condition.** You only owe a debt if you accepted the benefit voluntarily. If the state forces the benefit on you (order, growth) to create the debt, the obligation is void. But proving "forced benefit" is empirically hard. This is a core philosophical knot.
  3.  **The Information Problem:** *The strongest empirical challenge.* This is the "Dictator's Dilemma." If you suppress dissent to maintain safety, you blind yourself to the very metrics you need to maintain legitimacy. Is it self-undermining? Yes, theoretically. But regimes survive by creating *surrogate* feedback loops (local protests allowed, central control maintained). Whether this works long-term is an empirical question you can report on.
  4.  **Succession and Crisis:** *Beside the point for your specific claim.* Succession is about regime *survival*, not regime *right*. A regime can have a perfect right to rule (normatively) and collapse due to bad luck. Conversely, a regime can survive without any right. Don't let the "will it last?" question eat the "is it justified?" question.
  5.  **Sociological vs. Normative Legitimacy:** *Not a quarrel, a trap.* If you conflate them, you end up justifying anything that survives. If you separate them too sharply, you write philosophy, not political science. The practical consequence is **Prediction.** Sociological legitimacy predicts stability; normative legitimacy predicts resistance when the normative gap widens. The *gap* is the story.
  6.  **Singapore as a Case:** *Methodologically crucial.* If Singapore is a city-state anomaly, generalizing to China is a category error. It's not just "selection effect"; it's about **Scale and Heterogeneity.** Governing a homogeneous port is different from governing a continental empire. This limits the external validity of your book's thesis.

  ***

  ### Part 2: The Ranked Questions

  Here are six questions ranked by **Upstream Impact**. I am weighing "Importance" (how much the debate changes if we answer this) against "Tractability" (can you, a writer, actually make progress on this in 18 months?).

  When Importance and Tractability pull apart, I prioritize Importance. A book that settles a small, tractable question is an article. A book that illuminates a huge, intractable question is a contribution. I have ranked these so that answering the higher ones changes the meaning of the lower ones.

  #### 1. The Scope Question: Does success in X grant authority over Y?
  *   **The Question:** If a government delivers economic growth and safety (X), does that earn it the right to control speech, succession, or justice (Y)? Or is legitimacy domain-specific?
  *   **Why it's Upstream:** This is the foundation. If legitimacy is domain-specific, the claim "a government can earn the right to rule" is false. It can only earn the right to *manage the economy*. Most authoritarian claims assume legitimacy is fungible (growth buys silence). If it isn't, the whole "performance legitimacy" thesis collapses into "technocratic competence."
  *   **Tractability:** *Mixed.* You cannot settle this philosophically (it's normative). But you can report on **breach points.** Where do citizens say, "You fixed the roads, but you don't get to jail my cousin"? Look for moments where performance was high, but specific authoritarian overreach caused backlash. That reveals the boundary.
  *   **Movers:** If you find cases where high performance *failed* to buy tolerance for political repression, this moves to the top of the "debate killer" list. If you find people willingly trading speech for growth consistently, it stays theoretical.
  *   **Confidence:** High. This is the structural weak point of the performance argument.

  #### 2. The Paternalism Trap: Who defines "The Goods"?
  *   **The Question:** Performance legitimacy assumes the government delivers what people *want*. But in "Asian Values" or vanguardist models, the government claims to know what people *need* better than they do (e.g., long-term stability over short-term liberty). Is this legitimacy, or is it parenting?
  *   **Why it's Upstream:** If the regime defines the metrics of success, "performance" is a closed loop. They decide they succeeded, therefore they are legitimate. To break the loop, you need an external metric of "the goods."
  *   **Tractability:** *Hard.* This requires accessing private preference vs. public statement. You can't just poll. You need to look at **exit behavior** (brain drain, capital flight) or **hidden transcripts** (satire, private chat groups) where the "goods" are defined differently than in state media.
  *   **Movers:** If you can demonstrate a systematic divergence between state-defined "goods" (GDP, skyscrapers) and citizen-defined "goods" (dignity, legal recourse), you expose the mechanism as paternalism, not legitimacy.
  *   **Confidence:** Medium-High. The divergence exists; proving it drives the legitimacy calculus is the hard part.

  #### 3. The Coercion Discount: Does the method subtract from the outcome?
  *   **The Question:** In the reciprocity calculation (I give you order, you give me obedience), does the *coercive cost* of producing that order negate the *value* of the order?
  *   **Why it's Upstream:** This tackles the "Benevolent Autocracy" puzzle you mentioned. If the state creates safety by arbitrarily jailing 1% of the population, is the safety "legitimate" for the other 99%? Philosophers say the rights violation taints the benefit. Authoritarians say the net utility matters.
  *   **Tractability:** *Low for settlement, High for illustration.* You can't solve the moral math. But you can report on the **distribution of coercion.** Is the coercion targeted at dissidents (low cost to majority) or random (high cost to majority)? The "discount rate" varies based on who pays the price.
  *   **Movers:** If coercion is invisible to the beneficiaries, the discount is low. If it becomes visible (viral videos of abuse), the discount spikes. Tracking the *visibility* of coercion is your angle.
  *   **Confidence:** Medium. This is deeply subjective, but the "visibility" variable is reportable.

  #### 4. The Time-Horizon Mismatch: Can performance handle long-term pain?
  *   **The Question:** Performance legitimacy relies on positive feedback (growth, safety). But solving existential problems (climate, demographics, debt) often requires short-term *negative* performance. Can a regime based on "delivering the goods" ask citizens to accept "fewer goods" for a decade?
  *   **Why it's Upstream:** This addresses the sustainability critique without relying on "democracy is better." It asks if performance legitimacy has a **structural inability to plan for decline.**
  *   **Tractability:** *Empirical.* Look at current policy shifts. Are regimes lying about the data to maintain the performance narrative? If they must lie to maintain legitimacy, the legitimacy is fragile.
  *   **Movers:** If a performance regime successfully navigates a period of austerity without collapsing, this question drops in importance. If they double down on propaganda during downturns, it rises.
  *   **Confidence:** High. This is a structural constraint of transactional rule.

  #### 5. The Exit vs. Voice Proxy: Is acceptance just resignation?
  *   **The Question:** You mentioned Sociological vs. Normative. The operational version is: When people say they support the regime, is it because they agree (Voice) or because they can't leave (Exit)?
  *   **Why it's Upstream:** If "support" is just a lack of exit options, it's not legitimacy; it's captivity. This determines whether you are studying political obligation or prison management.
  *   **Tractability:** *Empirical.* Measure the **cost of exit.** If exit costs are high (visas, capital controls, social credit), expressed support is noisy data. If exit costs are low (Singapore), support is more meaningful.
  *   **Movers:** Compare regimes with high exit barriers vs. low exit barriers. If support levels are identical despite different exit costs, then legitimacy might be real. If support correlates with exit barriers, it's coercion.
  *   **Confidence:** Medium. Data on "true belief" is always murky, but exit cost data is solid.

  #### 6. Institutionalization: Can charisma become bureaucracy?
  *   **The Question:** Can performance legitimacy be codified into rules, or does it always revert to a personal bond with a leader?
  *   **Why it's Upstream:** This links to your Succession point. If performance is personal ("*I* made you rich"), it dies with the leader. If it's institutional ("*The Party* makes you rich"), it survives.
  *   **Tractability:** *Empirical/Historical.* Look at succession moments. Does the rhetoric shift from "The Leader's Vision" to "The System's Strength"?
  *   **Movers:** If a post-founder regime maintains high performance legitimacy without a strongman, this question is settled (Yes). If they revert to personality cults to maintain legitimacy, it's settled (No).
  *   **Confidence:** Medium-Low. This is highly contingent on specific leadership dynamics.

  ***

  ### Part 3: Weighing the Trade-offs

  You asked how I weigh Importance against Tractability when they pull apart.

  **My Heuristic:** In a book of ideas, **Importance wins.**
  If you solve a tractable question that doesn't matter (e.g., "Do Singaporeans trust their courts more than Malaysians?"), you have a dataset. If you grapple with an intractable question that matters (e.g., "Does safety bought by surveillance create a moral debt?"), you have a framework.

  However, for *you* (a writer, not a philosopher), "Importance" must be filtered through **Narrative Tractability.**
  *   *Question 1 (Scope)* is philosophically huge but narratively rich. You can find stories where the deal broke.
  *   *Question 3 (Coercion Discount)* is philosophically dense. It risks becoming abstract. I ranked it lower than Scope because it's harder to *show* rather than *tell*.
  *   *Question 5 (Exit vs. Voice)* is empirically clean but conceptually dry. It's a supporting argument, not a lead.

  I moved **Scope** to #1 because if legitimacy isn't fungible, the book's central premise ("delivering goods earns the right to rule") is category-error wrong. That is the highest stake possible. I moved **Succession/Institutionalization** to #6 because even if they fail at succession, they might still have had the *right* to rule while they lasted. Survival is not the same as justification.

  ### Part 4: Confidence and The Thin Floor

  **Confidence Levels:**
  *   I am **High Confidence** that the "Scope Question" is the theoretical weak point of performance legitimacy. Most theorists assume fungibility without proving it.
  *   I am **Medium Confidence** in the "Paternalism Trap." Regimes are getting better at manipulating preference formation (digital authoritarianism), making the "who defines goods" question harder to isolate.
  *   I am **Low Confidence** in the "Institutionalization" question. History is small-N, and we are in a novel period of digital governance that might allow for "digital institutionalization" we haven't seen before.

  **The One Claim I Am Least Sure Of:**
  I am least sure of my assessment that **Question 1 (Scope)** can be illuminated by reporting on "breach points."

  *Why:* It is possible that the "Scope" of authority is not determined by citizen pushback (breach points) but by the regime's *capacity* to enforce its will. In other words, the "right to rule" in these systems might not be a social contract that can be breached, but a factual assertion of power that is only limited by physics, not norms. If legitimacy in authoritarian contexts is purely retrospective ("we ruled, therefore we ruled"), then looking for normative boundaries (where citizens say "stop") might be looking for a ghost. The citizens might not believe they have the *right* to define the scope, only the *capacity* to resist it. Distinguishing between "You don't have the right" and "We can't stop you" is incredibly difficult in the field, and if that distinction collapses, the question becomes unreportable.

  That is the thin floor. If legitimacy is just power with a PR department, the normative questions you want to ask might not exist in the minds of your subjects.
