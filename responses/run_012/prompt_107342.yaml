      *   *Claim 1 (Causal):* Heritability ($h^2$) implies genetic differences are difference-makers in an interventionist sense (change genes $\rightarrow$ change trait).
      *   *Claim 2 (Constraint):* High $h^2$ constrains environmental intervention efficacy (tells you which levers work, implies skepticism of social explanations).
      *   *Underlying Assumption:* $h^2$ identifies a stable, causal property of the trait mechanism that limits environmental malleability.

  3.  **Brainstorming Defeaters (categorized by severity):**

      *   *The "No Fixed Fact" Problem (GxE & Variance):* If $h^2$ changes when $V_E$ changes, is it a property of the trait or the context? If I equalize the environment, $h^2$ goes to 1. If I equalize genes (clones), $h^2$ goes to 0.
          *   *Severity:* High. It undermines the idea that $h^2$ is a stable causal fact about the *trait* rather than the *population context*.
      *   *The "Flynn Effect" Problem (Secular Trends):* IQ is highly heritable, yet rose 3 points per decade.
          *   *Severity:* High. Directly contradicts Claim 2 (constraint on intervention). If environment can shift the mean massively despite high $h^2$, then $h^2$ doesn't constrain environmental *power*, only environmental *variance* in that specific context.
      *   *The "Missing Heritability" / Structure Problem:* Is the estimate actually capturing genes? Or population stratification? Or assortative mating inflating the estimate?
          *   *Severity:* Medium-High. If the estimate is biased, the "causal fact" is illusory.
      *   *The rGE Problem (Active/Evocative):* If genes cause exposure to environments, is the "environmental lever" actually independent?
          *   *Severity:* Medium. Complicates the interventionist story. If I change the environment, do I break the genetic propensity?
      *   *The Falsifiability Problem:* If every failed intervention is blamed on "not finding the right environment," is the claim vacuous?
          *   *Severity:* Critical (Philosophical). If unfalsifiable, it's not science.

