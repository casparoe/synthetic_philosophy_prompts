prompt: |-
  Ok so I've been going back and forth with a friend about behavior genetics — she's convinced it's all just fancy bookkeeping that tells us nothing, and I've ended up talking myself into the opposite corner, which I now want you to try to demolish. My position, roughly: a heritability estimate is more than a statistic. When a trait comes out substantially heritable in a population, I want to treat that as a genuine causal fact about the trait — that genetic differences are among the difference-makers for the differences between people, in something like the ordinary interventionist sense of causation (if you could reach in and change the genes, the trait would move). And I want to say this is what makes heritability relevant to policy in the first place: it tells you which levers are actually connected to the outcome, and it should make you skeptical of the usual social explanations for why people differ. I already know the standard disclaimers — that it's population-relative, that it's a variance ratio rather than a property of the trait, that it says nothing directly about between-group differences, that heritable doesn't mean unchangeable — and I accept all of them, so please dont waste the answer reciting them back to me.

  What I want is the map of exposure for the stronger claim: the one where heritability is a causal claim and where high heritability really does constrain what environmental intervention can accomplish. What would count against it? Sort the defeaters from the ones that would genuinely sink it to the ones that are merely awkward, and tell me which ones a careful defender of the position would concede themselves rather than wave off. I'm especially curious about a few things: the cases where a trait's heritability estimate changes when you change the population or the environment, so there's no fixed fact about how heritable it is; the fact that a trait can be strongly heritable and still shift enormously across cohorts; gene-environment correlation, where the environment is itself partly a product of the genes; and whether the estimate might just be biased by assortative mating or population structure, so that the clean causal fact I want to point to isn't even there. And then the uncomfortable bit: is my position actually falsifiable, or have I defined the relevant environmental lever so loosely that no failed intervention could ever count against me — and if that's what's going on, is it a real problem for a view like this, or just the price of doing population-level science?
