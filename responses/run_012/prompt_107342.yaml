          *   *Resolution:* The claim is falsifiable *if* defined as "Variance in outcome cannot be reduced by reducing variance in environment." But the user's claim is about *causal levers*. That is harder to falsify because "environment" is indefinite.
      *   **Conclusion:** Summarize where the position stands. It survives as a claim about *current variance*, but dies as a claim about *potential malleability*.

  5.  **Refining the Tone:**
