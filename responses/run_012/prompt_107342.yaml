      *   *Self-Correction during drafting:* I need to make sure I don't just repeat "heritability isn't immutability." The user knows that. I need to explain *why* high heritability fails to constrain intervention *even if* we accept the causal interpretation of variance. The key is the distinction between *variance* and *means*, and *current range* vs. *potential range*.

