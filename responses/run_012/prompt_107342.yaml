          *   *Concession:* Defender admits estimates are upper bounds, causal specificity is lower.
      *   **Tier 3: The Awkward Truths (Nuance, not Defeat):**
          *   *Focus:* Polygenicity and Pleiotropy.
          *   *Argument:* Thousands of tiny effects. "Changing the genes" isn't a single lever.
