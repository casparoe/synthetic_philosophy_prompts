      *   **Goal:** The user wants me to "demolish" this strong position. They want a "map of exposure" for this claim.
      *   **Constraints:** Do *not* recite standard disclaimers (population-relative, variance ratio, not about groups, heritable $\neq$ immutable). The user already accepts these.
      *   **Specific Areas of Interest:**
