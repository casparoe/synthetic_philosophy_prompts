answer: |-
  Here is a draft for your handout. It's structured to get the group thinking about what we *want* a theory to do before we argue about what the theories *say*.

  ### Part 1: The Wish List (Desiderata)
  *What does a theory of knowledge need to handle to be taken seriously?*

  *   **The Gettier Intuition (No Accidental Truth):**
      *   *The Case:* The stopped clock (reads right by luck), the barn facade county (you picked the one real barn by luck), the man who is right by accident.
      *   *The Requirement:* The theory must distinguish between *knowing* $P$ and merely having a true belief that happens to be right. It needs to rule out epistemic luck.
  *   **The Lottery Problem:**
      *   *The Case:* You hold a ticket in a fair million-ticket lottery. The odds are 99.9999% you lost. You believe you lost. You are right.
      *   *The Requirement:* The theory should explain why this *isn't* knowledge, even though the probability is higher than in many cases where we do claim knowledge (e.g., trusting a news report).
  *   **The Sources of Knowledge (Memory, Testimony, Induction):**
      *   *The Case:* You remember having breakfast. A friend tells you the time. You believe the sun will rise tomorrow.
      *   *The Requirement:* Tracking conditions often get weird here. (e.g., "If I hadn't had breakfast, would I still remember it?" Maybe yes, because I have a false memory disorder). The theory shouldn't deny knowledge in these standard cases just because the counterfactuals are messy.
  *   **Necessary Truths:**
      *   *The Case:* Mathematical or logical truths (e.g., $2+2=4$).
      *   *The Requirement:* These cannot be false. So the condition "If $P$ were false..." has nowhere to go. The theory needs a way to handle knowledge of things that *couldn't* have been otherwise without making knowledge trivial or impossible.
  *   **The Generality Problem (for Reliability):**
      *   *The Case:* You form a belief via vision. Is the process "vision," "vision in daylight," or "vision while tired on a Tuesday"?
      *   *The Requirement:* If the theory relies on "reliable processes," it must pin down *which* process counts. Otherwise, you can gerrymander the process description to make any belief look reliable or unreliable.
  *   **The "Neuroscientist" Case (Intervention):**
      *   *The Case:* You believe $P$ (true). In the actual world, you formed it normally. But, a neuroscientist is monitoring you. If $P$ had been false, he would have zapped your brain to make you believe $P$ anyway.
      *   *The Tension:* Your gut says you *do* know (actual formation was fine). Sensitivity says you *don't* know (because in the nearest $\neg P$ world, you still believe $P$ due to the zap).
      *   *The Requirement:* A desideratum to decide whether "Actual World Competence" trumps "Counterfactual Interference." Should knowledge depend on what a hidden scientist *would* have done, or only on what actually happened?
  *   **Self-Knowability (The Theory's Own Status):**
      *   *The Consideration:* If the Tracking Theory is true, can anyone *know* that the Tracking Theory is true?
      *   *The Requirement:* Does the theory allow for knowledge of itself? If a theory of knowledge implies that we can never know the theory of knowledge is correct, is that a bug (self-defeating) or a feature (humble)?

  ***

  ### Part 2: The "Pick Two" Problem (Incompatibilities)
  *We can't have it all. Here are the clusters of desiderata that fight each other.*

  **1. The Trilemma: Closure + Fallibilism + Anti-Skepticism**
  *   **The Conflict:** You cannot hold all three simultaneously.
  *   **The Argument:**
      *   **Fallibilism:** We can know ordinary things (e.g., "I have hands") without being able to logically rule out skeptical hypotheses (e.g., "I am a Brain-in-a-Vat").
      *   **Closure:** If I know "I have hands," and I know "Having hands implies I am not a BIV," then I must know "I am not a BIV."
      *   **Anti-Skepticism:** We actually know ordinary things (we are not ignorant of the external world).
      *   **The Crash:** The Skeptic argues you *cannot* know you aren't a BIV (because your experience would be the same). If Closure holds, and you don't know you aren't a BIV, then you don't know you have hands.
      *   **The Cost:** To save Anti-Skepticism (we know hands) and Fallibilism (we don't need absolute proof), Tracking theories sacrifice **Closure**. They say you know you have hands, but you *don't* know you aren't a BIV, because your belief about the BIV doesn't track the truth (if you were a BIV, you'd still believe you weren't).
  *   **Discussion Point:** Is giving up Closure too high a price? Or is it the only way to avoid skepticism?

  **2. Single-Premise vs. Multi-Premise Closure**
  *   **The Conflict:** You might accept deducing $Q$ from $P$, but not deducing $Q$ from $P_1, P_2, ... P_{1000}$.
  *   **The Argument:**
      *   **Single-Premise:** If I know $P$, and I see $P$ implies $Q$, I know $Q$. (Hard to deny without making logic useless for knowledge).
      *   **Multi-Premise:** If I know $P_1$, know $P_2$... know $P_{1000}$, do I know the conjunction $(P_1 \& P_2 \& ...)$?
      *   **The Lottery/Preface Pull:** In the Lottery, I seem to know each ticket lost (individually plausible), but I cannot know *all* tickets lost (conjunction is false/impossible to know). In the Preface Paradox, an author knows each claim in their book is true, but knows the book likely contains one error (so the conjunction is false).
      *   **The Cost:** A theory might satisfy Single-Premise Closure but fail Multi-Premise Closure. This suggests knowledge might not aggregate.
  *   **Discussion Point:** Is "knowledge" something that piles up, or does it leak when you combine too many claims?

  **3. Sensitivity vs. Necessary Truths**
  *   **The Conflict:** Sensitivity requires checking worlds where $P$ is false. Necessary truths have no worlds where $P$ is false.
  *   **The Argument:** If the condition is "If $P$ were false, you wouldn't believe it," and $P$ *can't* be false, the condition is vacuously true for *everyone*. This implies everyone knows all necessary truths (even if they guess), or the theory simply has nothing to say about math/logic.
  *   **The Cost:** The theory must add a separate clause for necessary truths, which risks making the theory look patchy or ad-hoc.

  ***

  ### Part 3: Real Requirements vs. Camp Preferences
  *Not all desiderata are created equal. Some are conceptual truths; others are just one side's homework.*

  *   **Genuine Requirements (Almost Universal):**
      *   **Factivity:** You can't know $P$ if $P$ is false. (Everyone agrees).
      *   **Belief:** You can't know $P$ if you don't believe $P$. (Everyone agrees).
      *   **Non-Accidentality:** Knowledge shouldn't be pure luck. (Everyone agrees, though they define "luck" differently).
  *   **Camp Preferences (Contested):**
      *   **Internal Access:** "To know $P$, you must be able to know *that* you know $P$." (This is the KK principle).
          *   *Verdict:* This is an **Internalist Preference**. Externalists (like Tracking theorists) reject this. You can track the truth without knowing that you're tracking it. Don't treat this as a hard constraint unless your group is committed to Internalism.
      *   **Closure:** "Knowledge is closed under known implication."
          *   *Verdict:* This is a **Theoretical Cost**, not a conceptual truth. It feels intuitive, but Tracking theorists explicitly deny it to solve the Skeptic problem. Treat it as a feature you might have to sacrifice, not a law of logic.
      *   **No "Brute" External Facts:** "You shouldn't know $P$ based on facts you can't access (like a neuroscientist's presence)."
          *   *Verdict:* This is **Internalism Sneaking In**. If you are an Externalist, you don't care if the knower can't detect the neuroscientist. If the belief tracks the truth, it's knowledge. Make sure the group notices when they are demanding Internalist constraints on an Externalist theory.

  ***

  ### Notes for the Moderator (You)
  *   **On the Neuroscientist Case:** Watch out for confusion here. The intuition pump is that the *actual* world is clean, but the *nearby* world is manipulated. If the group says "You don't know," push them on why the actual formation doesn't count. If they say "You know," push them on why the counterfactual fragility doesn't matter.
  *   **On Closure:** Keep the distinction between Single and Multi-premise alive. It often saves a theory from the Lottery Paradox.
  *   **On Self-Knowability:** If the group gets stuck, ask: "If Tracking is true, can a Tracking Theorist *know* Tracking is true?" If the answer is no, does the theory undermine itself?
