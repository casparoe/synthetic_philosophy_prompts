answer: |-
  **Brainstorm**
  1.  **Insurance Office:** An adjuster denies a claim because gravity is merely a summary of past events, not a guarantee of future ones. (Turns on the inference problem and counterfactual support).
  2.  **Certification Bureau:** A clerk refuses to stamp a regularity as a "Law" until the universe ends so the whole mosaic can be evaluated for simplicity. (Turns on the Best System Analysis requiring a global view vs. local governing).
  3.  **Library Archive:** Archivists shelve "Laws" and "Accidents" identically because there is no intrinsic mark distinguishing them on the pages of history. (Turns on the identification problem).
  4.  **Factory QC:** An inspector checks if the blueprint forces the product or if the product forces the blueprint to be written. (Turns on the direction of fit and explanatory priority).

  **The Joke**

  **Setting:** The Bureau of Regularity Certification.
  **Characters:** Vance (Anti-Humean), Lowell (Humean).

  Vance: "Stamp Form 88-B. Mass necessitates attraction. The property itself is forcing the apple down."

  Lowell: "I can't authorize that. We haven't finished cataloging the mosaic."

  Vance: "The apple is falling. The law is governing the event."

  Lowell: "The apple is just a local particular. To certify a law, I need the complete history of the universe to run the optimization algorithm."

  Vance: "You're saying gravity might be a coincidence?"

  Lowell: "I'm saying it's a candidate axiom. If including 'gravity' yields the best trade-off between simplicity and strength across the whole timeline, it gets the seal. But if a rogue particle appears tomorrow that violates the inverse-square law..."

  Vance: "Then the law breaks?"

  Lowell: "Then the law never existed. It was just a regularity that looked efficient for a few billion years. We can't know the best system until the last event occurs."

  Vance: "So nothing governs anything until the universe ends?"

  Lowell: "Governing is a heavy metaphysical load. We prefer summaries. The apple falls because that's what apples do in this mosaic, not because a rule pushes them."

  Vance: "My clients need to know the future is secure."

  Lowell: "Tell them the past is secure. The future is just where we hope the pattern holds so the system stays simple. Come back after the heat death."

  Vance: "They'll be dead."

  Lowell: "Then the system will be very simple. Finally ready for certification."

  **Explanation**

  The punchline turns on the Humean difficulty that laws cannot be identified until the entire history of the universe is known to calculate the best system. The Anti-Humean correctly identifies that science requires laws to support counterfactuals now, while the Humean correctly notes that distinguishing laws from accidents requires a global perspective on regularities.
