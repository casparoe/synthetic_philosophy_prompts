answer: |-
  Here is the machinery of the distinction, stripped of the academic name-dropping, followed by my verdicts on your specific points.

  ### The Core Machinery: The Contract of Assertion

  To understand the moral difference, you have to stop looking at language as a data-transfer protocol and start seeing it as a social contract.

  When you assert something to me, you are not just making a noise that causes a belief in my head. You are issuing an **invitation to trust**. You are implicitly saying, "I stand behind this content; you can rely on me for its truth."

  *   **Lying** is a direct violation of that contract. You invite trust while knowing you are unworthy of it. You are corrupting the tool of communication itself.
  *   **Misleading** is an exploitation of that contract. You keep the letter of the agreement (your words are true) but violate the spirit (you know I will walk away with a falsehood). You are corrupting the *user* of the communication.

  Your friend's analogy (pushing vs. greasing stairs) focuses entirely on the **consequence** (the fall) and the **physical mechanism** (gravity/legs). She ignores the **relational dynamic**. Pushing is an assault. Greasing is a trap. Both hurt, but they offend different norms. Assault violates bodily autonomy directly; a trap violates the expectation of safety in a shared space.

  Here is how that machinery applies to your three untangling points.

  ***

  ### 1. Is the distinction moral or just semantic?

  It is moral, but it is *grounded* in semantics. Your friend is trying to collapse the moral into the consequential (the fall), but morality often cares about the *mode* of action, not just the result.

  If the definition of "lying" depended entirely on arbitrary semantic rules (e.g., "Lying is only saying 'I didn't eat the cookie' when you did"), then the moral distinction would be fragile. But the semantic distinction maps onto a real difference in **responsibility**.

  *   **Semantic Reality:** In a lie, the falsity is in the *proposition expressed*. In misleading, the falsity is in the *inference drawn*.
  *   **Moral Reality:** This maps to **Authorship**. When I lie, I am the sole author of the falsehood. When I mislead, I am a co-author with you; I provide the premise, you provide the conclusion.

  If the moral verdict flipped based on semantic theory, that would be a problem. But it doesn't. Regardless of how linguists define "implicature," the social reality is that a listener holds a speaker accountable for their *words* differently than for their *implications*.

  **The Verdict:** The distinction is not semantic theory wearing a moral costume. It is a moral distinction *mediated* by semantics. The semantic boundary (what is said vs. what is implied) marks the boundary of where the speaker accepts full liability. Crossing that boundary intentionally (lying) is a different moral category than staying within it while causing harm (misleading), because one destroys the reliability of speech, while the other destroys the reliability of reasoning.

  ***

  ### 2. The Matched Pair: Same words, same effect, different mind.

  **The Scenario:**
  *   **Case A (Lie):** I say "The meeting is at 4," believing it is at 3, wanting you to miss it.
  *   **Case B (Mislead):** I say "The meeting is after lunch," believing it is at 3, knowing you think "after lunch" means 4, wanting you to miss it.
  *   **Result:** You arrive at 4. You miss the meeting.

  **Your Friend's Claim:** These are the same, or B is worse because I made you do the cognitive work.
  **My Verdict:** **Case A (The Lie) is morally worse.**

  **Why?**
  Your friend argues that making the victim "do the work" makes them complicit, which is worse. This is incorrect. The victim in Case B is not complicit; they are *hijacked*.

  The reason the Lie is worse is **Integrity vs. Cunning**.
  In Case A, I have aligned my will with falsehood. I have made my own voice a vehicle for untruth. I have sacrificed my integrity to achieve the goal.
  In Case B, I have preserved a sliver of integrity (my words were technically true) to achieve the goal. I have sacrificed *your* reasoning to achieve the goal.

  While harming your reasoning is bad, corrupting my own status as a truth-teller is a fundamental moral rot. A liar makes the world less honest. A misleader makes the world more confusing. The former is a decay of the foundation; the latter is a cluttering of the house.

  Furthermore, the Lie removes the "escape hatch." If I mislead you, and you confront me, I can say, "I'm sorry you misunderstood; I said after lunch." I can correct the record without admitting guilt. If I lie, I must double down or confess. The liar forces themselves into a position where they must either persist in evil or humble themselves. The misleader allows themselves to remain slippery. The willingness to be caught and held accountable (which the lie risks) is not a virtue, but the *avoidance* of that accountability (which the misleader ensures) is a vice.

  However, the Lie is worse *pro tanto* (all else being equal). In the real world, misleaders often get away with more, which makes them more dangerous, but the act of lying is the graver sin against the truth.

  ***

  ### 3. The Sneaky Stuff (Presuppositions and "Technically True")

  **The Scenario:** A doctor says "We did everything we could" (meaning protocol, you hear effort). A headline says "Senator linked to scandal" (meaning a donor gave money, you hear corruption).

  **Your Question:** Does this make the implicature version *worse* than the lie? And does it break the story?

  **The Verdict:** **Yes, this specific kind of misleading is often worse than a standard lie, but it does not break the general rule.**

  Here is the nuance: A flat lie is a blunt instrument. It is easily falsifiable. If the doctor says "We tried surgery" and they didn't, you can prove it.
  The "Sneaky Stuff" (often called *paltering*) is a shielded weapon. It uses the truth as armor.

  This is worse than a lie **because it adds Cowardice to Deception.**
  *   **Lie:** Deception + Risk of exposure.
  *   **Sneaky Mislead:** Deception + Immunity from exposure.

  When a speaker uses a literally true statement to convey a false implication, they are insulating themselves from the moral cost of lying while securing the benefit of the deception. They want the *power* of the lie without the *status* of a liar.

  **Does this break the story that lying is worse?**
  No. It means that "Misleading" is a huge category.
  *   *Benign Misleading:* "I'm not home" (when you are, to avoid a telemarketer).
  *   *Vicious Misleading:* The Doctor/Headline examples.

  Lying is almost always vicious. Misleading ranges from polite to vicious.
  So, the *worst* misleading is worse than the *average* lie. But the *average* misleading act is less morally charged than the *average* lie.

  Your friend is taking the worst cases of misleading (the calculated, deniable traps) and comparing them to the definition of lying to claim misleading is worse. That's a category error. If we compare the worst lie to the worst mislead, the lie is still worse because the lie admits no ambiguity. The lie is a pure commitment to falsehood. The sneaky mislead is a commitment to falsehood *plus* a commitment to evasion. Evasion is bad, but the core deception is the same. The lie is the purer evil.

  ***

  ### The Related Thing: Intent to Deceive

  **The Question:** If I lie to people who know the truth (a false denial in front of witnesses), am I lying? If lying doesn't require successful deception, how is it different from error?

  **The Machinery:**
  Lying is not defined by what happens in the *listener's* head. It is defined by what happens in the *speaker's* relationship to the truth.

  *   **Error:** I believe $P$. $P$ is false. I say $P$. (I am mistaken).
  *   **Lie:** I believe $\neg P$. $P$ is false. I say $P$. (I am lying).

  It does not matter if you know I am lying. If I stand before a court and say "I was not there," and everyone in the room has video of me there, I have still lied.

  **Why does this matter?**
  Because the moral wrong of lying is not primarily about *harming the listener* (though that often happens). It is about **corrupting the common record.**

  When I lie to people who know the truth, I am not trying to change their beliefs. I am trying to change the *status of the conversation*. I am forcing everyone to participate in a fiction. I am saying, "Even though we all know the truth, I demand we operate on this falsehood."

  **Intent to Deceive:**
  Strictly speaking, you can lie without intending to deceive *the specific listener*, but you must intend to *assert a falsehood*.
  *   If I say "2+2=5" as a joke, I am not lying (no intent to be taken seriously).
  *   If I say "2+2=5" to a math class knowing they know better, to disrupt the lesson, I am lying.

  **The Separation from Error:**
  The difference between Lying and Being Wrong is **Consciousness**.
  *   **Wrong:** My map of the world is inaccurate.
  *   **Lying:** My map is accurate, but I am handing you a forged copy.

  This brings us back to your friend's argument. She thinks the moral weight is on the *fall* (the false belief in your head). I am telling you the moral weight is on the *push* (the speaker's willingness to sever their connection to reality).

  ### Summary of the Disagreement

  Your friend is a **Consequentialist** about speech. She looks at the belief state of the listener. If the listener ends up with a false belief, the moral crime is complete. The method (lie vs. mislead) is just tactical.

  You are sensing that she is missing the **Deontological** aspect of speech. There are rules about how we treat each other as rational agents.
  *   **Lying** treats the listener as a vessel to be filled with poison.
  *   **Misleading** treats the listener as a partner to be manipulated into poisoning themselves.

  **Final Answer to your Friend:**
  She is right that the *harm* can be identical. She is right that *sneaky* misleading can be more vicious than *clumsy* lying because it avoids accountability.

  But she is wrong that they are the *same act*.
  Lying is a betrayal of the **Speaker's Integrity**.
  Misleading is a betrayal of the **Listener's Agency**.

  In the matched pair, Lying is worse because integrity is the foundation of communication. If everyone misled but never lied, we would be suspicious but could eventually learn the code. If everyone lied but never misled, communication would collapse entirely because the literal meaning of words would become worthless. The lie attacks the code itself; the mislead attacks the user. Destroying the code is the greater moral crime.
