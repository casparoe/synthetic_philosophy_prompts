      *   *Check:* The "Goal vs. Choice" question.
      *   *Correction:* In RP, if $B=\{goal\}$, choice is trivial. Preference is undefined relative to alternatives. In IRL, if dynamics force the goal, Reward is unidentified. The IRL confusion stems from conflating *optimality* with *identification*.

