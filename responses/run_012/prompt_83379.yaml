  *(Self-Correction on Counterfactuals)*: The user asks if transition structure supplies counterfactual variation. Yes, *if* there are branching paths. If the MDP is a single chain, there is no identification. I must emphasize that IRL *requires* branching (choice) to identify rewards, just as RP requires price variation. If IRL practitioners claim identification from a single trajectory in a deterministic chain, they are wrong, and that's where the RP critique bites hardest.

