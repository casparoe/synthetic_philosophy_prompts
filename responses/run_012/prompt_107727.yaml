          *   *Case One (Found Lump):* Natural formation looks like a statue. Later declared a statue without physical change.
          *   *Case Two (Recast):* Bronze figure melted/recast. Lower half is original metal (unchanged), upper half is new metal fused.
      *   **Structure:**
          1.  Numbered list of agreed claims (what cases establish, what needs explanation, terminological vs. substantive, concessions on objections).
