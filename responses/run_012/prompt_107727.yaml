answer: |-
  **JOINT STATEMENT ON MATERIAL CONSTITUTION AND NUMERICAL IDENTITY**

  **Parties:** The Coincidentalist (Party A) and The One-Object Theorist (Party B)
  **Subject:** Adversarial Collaboration regarding the metaphysics of material constitution, specifically utilizing the "Found Lump" and "Recast" cases.

  ### I. Agreed Claims

  Both parties hereby sign the following declarations regarding the scope, limitations, and stakes of our collaboration:

  1.  **Limitations of the Cases:** We agree that neither the *Found Lump* (natural formation declared art) nor the *Recast* (partial metal replacement) case definitively refutes either position; rather, the *Found Lump* tests the role of intention in object generation, while the *Recast* tests the limits of mereological continuity and persistence.
  2.  **Explananda:** Both parties agree that any viable theory must account for the intuitive difference in truth conditions between statements like "The statue could survive the loss of this atom" and "The lump could not survive the loss of this atom," regardless of whether this difference is grounded in ontology or language.
  3.  **Terminological Concessions:** We acknowledge that a portion of our dispute is verbal: Party A uses "object" to denote mind-independent entities satisfying sortal conditions, while Party B uses "object" to denote spatiotemporal regions occupied by matter, treating sortal satisfaction as predication rather than existence.
  4.  **Conditions for Objection (Coincidentalist):** Party A concedes that if it can be demonstrated that the "Statue" and the "Lump" share all causal powers, spatial boundaries, and temporal duration without divergence, positing two entities constitutes a violation of ontological parsimony that outweighs the benefits of preserving unrestricted Leibniz's Law.
  5.  **Conditions for Objection (One-Object Theorist):** Party B concedes that if sortal concepts (e.g., "statue" vs. "lump") are shown to rigidly dictate identity conditions such that $x=y$ is true relative to one sortal and false relative to another within the same context, the "one object" view fails to account for the logical contradiction without resorting to ad hoc relativization.

  ### II. Formulations of Remaining Disagreement

  For each remaining point of contention, the holding party has formulated their position in a single sentence, vetted by the opposing party as fair and non-caricatured:

  *   **Party A (Coincidentalist):** Numerical distinctness is required to ground divergent modal properties, meaning the statue and the lump are two entities because they have different persistence conditions that cannot be reduced to descriptive variance.
  *   **Party B (One-Object Theorist):** Divergent modal properties are relative to sortal descriptions rather than evidence of distinct entities, meaning there is only one thing there that satisfies different conditions under different guises.

  ### III. The Cruxes

  We identify three fundamental theoretical divergences that prevent further consensus:

  1.  **The Principle of Identity:** The dispute turns on whether identity is governed by an unrestricted Indiscernibility of Identicals (if $x=y$, they share *all* properties) or whether identity is relativized to a sortal (if $x=y$ qua $F$, they need only share $F$-relevant properties).
  2.  **Ontology vs. Counting:** We disagree on whether we are disputing what exists in the world (metaphysics) or merely how we are permitted to count what exists (conceptual semantics).
  3.  **The Role of Constitution:** We disagree on whether the constitution relation (if admitted) does genuine explanatory work regarding persistence and change, or whether it merely labels the phenomenon of co-location without resolving the underlying tension.

  ### IV. Evidence, Data, and Predictions

  For each crux, we have selected a concrete datum drawn from our specific cases upon which the crux bears. We record our predictions regarding how the analysis of this datum will unfold.

  **Crux 1: Indiscernibility vs. Sortal Relativization**
  *   **Datum:** In the *Found Lump* case, prior to the sculptor's declaration, the object has the property "is not a statue." After declaration, without physical change, it has the property "is a statue."
  *   **Party A Prediction:** Analysis will show that a *new* object (the statue) has come into existence coincident with the lump, preserving Unrestricted Indiscernibility because the pre-declaration object (lump-only) is not identical to the post-declaration object (statue).
  *   **Party B Prediction:** Analysis will show that the single object has acquired a new relational property ("is declared art"), preserving the One-Object view because "is a statue" is not a fundamental property of the matter but a status relative to observers.

  **Crux 2: Existence vs. Counting**
  *   **Datum:** In the *Recast* case, the lower half of the bronze is numerically the same matter, but the upper half is new; intuitively, the "Statue" is destroyed, but the "Bronze" persists.
  *   **Party A Prediction:** Investigation into causal powers will reveal that the "Bronze" and the "Statue" diverge in their conditions for destruction, proving they are two existing things being counted differently.
  *   **Party B Prediction:** Investigation into linguistic conventions will reveal that "destruction" is applied differently based on interest (aesthetic vs. material), proving we are counting one existing thing in two ways.

  **Crux 3: Explanatory Work of Constitution**
  *   **Datum:** The explanatory gap regarding why the *Found Lump* cannot survive being crushed (as a statue) but can survive being crushed (as a lump).
  *   **Party A Prediction:** Admitting a constitution relation explains this gap by assigning different essential properties to the constituting and constituted entities.
  *   **Party B Prediction:** Admitting a constitution relation fails to explain this gap because it merely restates that the object falls under two sortals with different rules, offering no metaphysical mechanism for the divergence.

  ### V. Closing Assessment

  In concluding this collaboration, we classify the dispute as follows:

  The disagreement regarding **whether sortals dictate persistence conditions** is found to be **genuinely substantive**; this is a metaphysical claim about the nature of objects that cannot be resolved by semantic stipulation alone. However, the disagreement regarding **how many objects exist in the region** is found to be largely **verbal**; once we agree on the distribution of matter, the causal powers, and the truth conditions of sortal predicates, the decision to label this "one object under two descriptions" or "two objects in one place" functions as a choice of ontological bookkeeping rather than a discovery of new facts.

  ***

  **Signed,**

  _________________________
  **Party A (Coincidentalist)**

  _________________________
  **Party B (One-Object Theorist)**
