          *   One-Object: It's always one object. "Statue" is just a way of describing the lump once we care about aesthetics. No new object pops into existence.
      *   *Case Two (Recast):* Challenges mereological essentialism and persistence conditions.
          *   Coincidentalist: The original Statue ceases. A new Statue arises. The Lump (matter) persists. If the lower half is the same matter, does the original Statue survive in part? Usually, Coincidentalists say the *Statue* is destroyed, the *Lump* survives, and a *New Statue* is constituted by the *Lump*.
          *   One-Object: The object persists through the change if the continuity is sufficient, or it doesn't. But there aren't two things (Statue/Lump) diverging in properties.

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look formal, like a collaborative philosophical document.
