answer: |-
  1. Purpose and scope

  The project is to naturalise content for a non-linguistic cognitive system. We seek to explain how internal states guide behaviour by carrying information about the world, without presupposing language or rational agency. This narrows the field to theories compatible with sub-personal mechanisms and computational architecture. Social normative accounts are excluded, as the creature lacks the community required for normativity. The theory must bridge the gap between physical state and semantic value. The scope is strictly naturalistic: no homunculi, no unanalysed intentionality. It prioritises explanatory power over intuitive comfort.

  2. The requirements

  1. **Misrepresentation:** The theory must explain how a state can be false without collapsing into mere correlation. A creature may act on a representation of water where there is none. If content is fixed solely by causal correlation, error becomes impossible, as the state merely correlates with whatever caused it, be it water or a mirage. A theory that cannot distinguish between representing water and representing whatever causes the water-state fails to capture intentionality. Without this distinction, the notion of cognition collapses into reflex. The account must specify conditions under which a state is incorrect, preserving the normativity of truth without invoking linguistic rules. **Tag: Non-negotiable.**

  2. **Distality:** The theory must fix whether a state represents a distal object or a proximal stimulus. When a creature sees a dog, does it represent the animal, the retinal pattern, or undetached dog-parts? Computational explanation requires operations over objects, not sensory surfaces. If the content is merely the proximal cause, the creature cannot navigate the world, only its own sensors. This solves the disjunction problem: why the state means *dog* and not *dog-or-dog-facie-in-the-dark*. The account must ground reference in the environment, not just the interface. **Tag: Non-negotiable.**

  3. **Non-circularity:** The theory must not presuppose the capacities it explains. We cannot explain representation by appealing to rules of combination the creature already possesses. If the theory requires the creature to represent logical constants to have complex thoughts, it begs the question. The basis must be simpler than the phenomenon. This prevents infinite regress in the explanation of thought. The mechanism generating content must be prior to the content itself, ensuring the theory explains the emergence of semantics rather than assuming it. **Tag: Non-negotiable.**

  4. **Acquisition:** The theory must cover creatures without prior concepts. An infant or animal cannot learn concepts it lacks the machinery to grasp. The theory must allow for innate or emergent content that does not rely on prior linguistic scaffolding. This ensures the explanation works for the first thoughts a creature ever has. It must specify how content arises from non-semantic interactions with the environment. The account cannot require a history of learning that presupposes the very representational capacity being explained. **Tag: Non-negotiable.**

  5. **Supervenience:** The theory must not allow physically identical creatures to differ in content merely due to history. For computational explanation, processing depends on current physical state. If twins differ in thought solely because of external history, computation cannot track content. This privileges the internal mechanism over external context. It ensures that causal powers supervene on physical properties. Without this, the computational model loses its grip on the psychology of the individual. **Tag: Commitment of internalism dressed up as a constraint.**

  6. **Sub-personal Scope:** The theory must apply to sub-personal states as well as beliefs. A visual system representing an edge differs from a belief about dogs, yet both guide action. If the theory only works for propositional attitudes, it fails to explain perception. The notion of representation must stretch across levels. This ensures unity in the cognitive architecture. The account must handle non-conceptual content without reducing it to mere signal transmission. **Tag: Non-negotiable.**

  7. **Causal Efficacy:** Content must play a role in the causal story. If content does no work, computational explanation becomes purely syntactic. The creature acts *because* it represents food, not just because of physical states. We must explain how semantics drives behaviour. This avoids epiphenomenalism. The account must show how content properties are relevant to causal powers, ensuring the explanation is truly psychological rather than merely physical. **Tag: Non-negotiable.**

  8. **Compositionality:** The theory must explain forming new thoughts from old. Creatures generalise and combine representations. If content is atomic and unstructured, systematicity is impossible. The theory must allow for complex content built from simpler parts. This supports the productivity of thought. The account must specify how combinatorial syntax maps to combinatorial semantics without presupposing language. **Tag: Non-negotiable.**

  3. Where the list fights itself

  The most acute tension lies between Distality and Supervenience. To fix content as about dogs rather than retinal patterns, one typically appeals to causal history or environmental context. However, if content depends on history, physically identical creatures in different environments (or with different pasts) would differ in content. This violates Supervenience, which demands content track current physical state for computational tractability. Satisfying both requires showing how distal reference is encoded internally, a difficult feat.

  Secondly, Causal Efficacy conflicts with Physical Closure. If physical states suffice for behaviour, content risks being epiphenomenal. Yet computational explanation requires content to drive processing. Reconciling these demands a non-reductive account where semantic properties supervene on causal powers without overdetermining them.

  Furthermore, Compositionality and Non-circularity pull in opposite directions. Explaining combination often requires rules, but presupposing rules violates Non-circularity. The theory must derive structure from non-structural bases. The tension between Sub-personal Scope and Compositionality is also notable. Sub-personal states often lack combinatorial structure. If the theory requires compositionality for all representation, it may fail at the sub-personal level. The list as a whole implies that a unified theory is exceptionally hard to construct. It demands an account that is simultaneously fine-grained enough for neurons and structured enough for thought.

  4. The requirement that does the most excluding

  The Supervenience requirement rules out the most attractive theories. Many compelling accounts of content, particularly teleological and causal-historical ones, rely on external factors to fix reference. They argue that what a state represents depends on what it was selected for or causally linked to over time. By insisting that physical identicals must think the same thoughts regardless of history, this requirement excludes externalism entirely. It forces the theory to locate content wholly within the skin. This is a massive exclusion because it dismisses the intuitive pull of environmental determination. It demands that the brain alone suffices for meaning, which contradicts many naturalistic accounts of function. Consequently, any theory relying on evolutionary history or environmental context to ground content is inadmissible. It privileges the computational model over the biological context.

  5. What this leaves of the leading families

  Covariance accounts fail Misrepresentation. If content is just correlation, error is impossible. They also struggle with Distality, often collapsing into proximal stimulus theories. They cannot distinguish veridical perception from hallucination without extra resources.

  Teleological accounts handle Error well by appealing to function. A state misrepresents if it fails its biological function. However, they typically violate Supervenience, as function depends on history. They also struggle with Sub-personal Scope, as not all neural states have clear evolutionary functions. Acquisition is also problematic if concepts require selection history.

  Inferential-role accounts satisfy Compositionality and Non-circularity within the system. Yet they fail Distality, trapping content within the head without world-contact. They risk idealism, unable to anchor thought in reality. They also struggle with Causal Efficacy, as roles are abstract.

  Formal symbol-system accounts excel at Computation and Compositionality. However, they struggle with Causal Efficacy of content, often reducing semantics to syntax. They also fail to ground content naturally, requiring an interpreter. None satisfy the list fully. Teleological accounts come closest on error but fail internalism. Formal accounts come closest on computation but fail semantics. The list demands a synthesis not yet achieved. It suggests a need for a structural internalism that mimics external relations.
