answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics Board Members, Psychology Department Chair, Principal Investigators
  **FROM:** Chair, Research Ethics Board
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Protocol #PSY-2023-04: Heterophenomenological Approaches to Voice-Hearing

  **Decision**
  The Research Ethics Board (REB) has reviewed the protocol submitted by the Psychology Department regarding the heterophenomenological study of voice-hearing. After considering the written submissions and the testimony from the Clinical Liaison and the research team, the Board issues a decision of **Approval with Conditions**.

  **Board Authority and Metaphysical Bracketing**
  It is the determination of this Board that our mandate extends to the mitigation of physical and psychological harm, not the arbitration of ontological truth. We are not entitled to demand that researchers validate or invalidate the metaphysical claims of participants. Consequently, the Board will not require interviewers to assert that voices are "unreal" during debriefing, nor will we mandate that researchers adopt a clinical pathology framework that contradicts the study's methodological premises. To do so would constitute an overreach of regulatory authority into epistemological questions where the Board holds no standing.

  However, the Board *is* entitled to mandate safeguards against foreseeable distress, regardless of the source of that distress. The methodological choice to bracket reality does not exempt researchers from the duty to monitor and respond to acute psychological risk.

  **Engagement with Clinical Concerns**
  The Clinical Liaison raised a substantial objection: that a script forbidding interviewers from challenging the reality of a participant's experience amounts to an abandonment of the duty of care, particularly for those in early psychosis. This is the strongest argument against the protocol as originally submitted, and it is not dismissed lightly.

  The Liaison is correct that neutrality can curdle into negligence if it is used as a shield to ignore distress. If a participant expresses intent to harm themselves or others based on the commands of a voice, an interviewer who remains silent behind the veil of "methodological neutrality" is indeed failing in their ethical obligations. We acknowledge that for a clinician, withholding reality-testing can feel like colluding with a delusion.

  However, the Board distinguishes between *ontological judgment* and *distress management*. One can acknowledge a participant's distress and offer clinical referral without explicitly stating, "The voice is not real." The Board accepts the researchers' argument that imposing a skeptical framework can be epistemically violent and damaging to the therapeutic alliance. Therefore, the solution is not to force researchers to debunk the voices (which would invalidate the data and potentially harm the participant), but to ensure that the safety net is robust enough that debunking is unnecessary. Care is not abandoned if the protocol includes rigorous screening and referral pathways that operate on the basis of *impact* rather than *verity*.

  **Conditions of Approval**
  To balance methodological integrity with participant safety, the following conditions must be met prior to recruitment:

  1.  **Exclusion Criteria:** The protocol must include a pre-screening tool to exclude individuals currently experiencing acute psychotic episodes or active suicidality, as determined by a standardized clinical checklist (e.g., MINI or equivalent) administered by a qualified clinician, not the interviewer.
  2.  **Distress Protocol:** The interview script must be amended to include a "Pause and Refer" clause. If a participant exhibits signs of acute distress, the interviewer must pause the data collection. The interviewer is permitted to say: *"I can see this is causing you significant distress. While I cannot discuss the nature of these experiences within this study, I am required to ensure your safety. I would like to connect you with a counselor who can support you."* This allows for care without ontological judgment.
  3.  **Debriefing Language:** The debriefing statement must explain the study's method without invalidating the participant. It should read: *"This study records your reports as data about your experience. It does not take a position on the external reality of those experiences. This is a methodological choice, not a judgment on your truth."*
  4.  **Adverse Event Reporting:** Any adverse events (e.g., increased distress, hospitalization) must be reported to the REB within 48 hours of the research team becoming aware of them.

  **Time Frame**
  This approval is valid for a period of **12 months**. The research team must submit a continuation request or a final report by October 23, 2024.

  **Conclusion**
  This decision respects the heterophenomenological method's requirement to bracket ontology while affirming that participant safety is a non-negotiable constraint on all research methods. We trust the research team to implement these conditions with the same rigor they apply to their data collection.

  Verdict: Approved with Conditions.
