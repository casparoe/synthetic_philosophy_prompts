answer: |-
  Your hypothesis is compelling and captures the methodological texture of the debate, but I argue it is symptomatic rather than fundamental. You suggest the impasse arises because the two sides disagree on what counts as *data* (the contradiction as reductio vs. the contradiction as discovery). While accurate as a description of their dialectical moves, this does not explain *why* they categorize the data differently. If logic were purely a descriptive science of consequence, like zoology is of animals, the "data" (the derivation) would settle the matter. The fact that it does not suggests the disagreement is not merely about data selection, but about the *constitutive aim* of logic itself.

  The deeper diagnosis is this: **The dispute is a clash between a normative conception of logic (Classical) and a metaphysical/descriptive conception of logic (Dialetheic).** The classical logician views consistency as a constitutive norm of rationality; the dialetheist views truth-preservation as the primary function of consequence, even if truth is inconsistent. Your "data" hypothesis is the surface manifestation of this functional divide.

  Here is the diagnosis worked through your four requested angles.

  ### 1. The Meaning-Change Charge
  Is the disagreement verbal? The charge is that the dialetheist's $\neg$ is not negation because it does not satisfy Explosion ($A, \neg A \vdash B$).

  *   **The Substantive Core:** If meaning is determined by inferential role (proof-theoretic semantics), then the dialetheist *has* changed the subject. In Classical Logic (CL), $\neg$ is partly defined by its capacity to render a theory trivial when contradicted. In LP (Logic of Paradox), it is not. However, if meaning is determined by truth conditions (model-theoretic semantics), the dialetheist can argue $\neg$ retains its meaning (mapping 1 to 0 and 0 to 1), but the *consequence relation* has changed (preserving truth from {1, b} to {1, b} rather than {1} to {1}).
  *   **The Question-Begging:** The classical charge begs the question if it assumes inferential role is the *only* determinant of meaning. However, the dialetheist faces a reciprocal problem: if $\neg$ does not enforce exclusion, what functional role does it play in reasoning?
  *   **Diagnosis:** This is not merely verbal. It is a disagreement about **which semantic properties are essential to logical constants.** The classicist holds that exclusion (and thus Explosion) is essential to negation. The dialetheist holds that truth-inversion is essential, and exclusion is a derivative property that fails in pathological cases. The "change of subject" charge is precise only if one presupposes the classical functional role of negation is constitutive. Since that is precisely what is in dispute, the charge cannot settle the debate, but it highlights a substantive cost: the dialetheist must explain how their $\neg$ supports the *practice* of denial if it does not support Explosion.

  ### 2. Truth vs. Norms (Assertion and Denial)
  You suggest the dialetheist might be right about truth (metaphysics) while the classicist is right about assertion (norms).

  *   **The Split:** This is the most promising avenue for dissolving the hostility, but it does not dissolve the disagreement. Priest and Beall distinguish between *acceptance* (cognitive state) and *assertion* (speech act). A dialetheist can accept $A \land \neg A$ as true but maintain norms that forbid asserting it indiscriminately (to avoid misleading listeners who assume consistency).
  *   **The Impasse:** The classicist argues that if logic is the study of valid inference, and inference is a normative guide for reasoning, then a logic that validates $A \land \neg A$ is defective *as a logic*, regardless of its metaphysical accuracy. If I cannot *use* the logic to guide my beliefs without risking triviality (or pragmatic incoherence), it fails the job description of logic.
  *   **Diagnosis:** This confirms the "Function of Logic" diagnosis. The classicist treats logic as a **technology of reasoning** (normative). The dialetheist treats logic as a **theory of semantic structure** (descriptive). They are not answering different questions under one heading; they are disagreeing on whether the heading "Logic" refers to a normative technology or a descriptive theory. The dispute persists because both claim the title "Logic." If we renamed them "Rational Norms" vs. "Semantic Consequence," the heat might decrease, but the question of which system governs *truth* would remain.

  ### 3. The Hidden Formal Question (Curry and Stability)
  You ask if the action is downstream of technical results, specifically Curry-style triviality.

  *   **The Technical Crux:** The Liar involves negation; Curry does not. Curry uses a conditional, contraction, and truth rules to derive triviality. To be a dialetheist, one must block Curry without blocking the derivation of the Liar contradiction. This usually requires weakening the conditional (rejecting Modus Ponens or Contraction).
  *   **The Cost:** If you weaken the conditional enough to block Curry, can you still do mathematics? Can you formulate the dialetheic semantics itself? This is the **Recapture Problem**. If the paraconsistent logic is too weak to recapture classical validity for non-semantic vocabulary (arithmetic, physics), the dialetheist position becomes pragmatically self-defeating.
  *   **Diagnosis:** This is the strongest substantive constraint on the debate. It moves the disagreement away from "data" to **expressive power and stability**. If the dialetheist's retreat (e.g., to a non-contractive logic) renders the theory unable to formulate its own solution without paradox (a "revenge" problem), the classical position wins on stability grounds. However, dialetheists (like Beall with "shriek rules" or Field with paracomplete strategies) argue they can recapture classicality for non-semantic domains.
  *   **Verdict on this point:** The debate is not *just* philosophical; it turns on whether a paraconsistent system can be **expressively complete and non-trivial**. If the technical result shows that any logic tolerating gluts must be too weak to formulate its own semantics, the dialetheist position collapses. If a stable system is found, the "meaning change" charge loses force because the system proves its utility. Currently, the technical landscape is contested, which sustains the philosophical stalemate.

  ### 4. Agency and Revision (Reasoning *With* vs. *About*)
  Is the standoff about what an agent could do?

  *   **The Circularity:** To argue for logical revision, one must use logic. The classicist uses CL to argue for CL; the dialetheist often uses CL (in the metalanguage) to argue for non-CL (in the object language), or uses a paraconsistent metalanguage.
  *   **Diagnosis:** This is a **red herring regarding truth**, though it explains the **inertia**. Both sides acknowledge the circularity (Quine's "web of belief"). The classicist says the cost of revising logic is too high (it disrupts all science). The dialetheist says the cost of maintaining consistency is too high (it requires ad-hoc restrictions on truth).
  *   **Assessment:** This does not diagnose the disagreement; it diagnoses the **difficulty of conversion**. It explains why nobody converts, not who is right. It is not a genuine crux because both sides have accounts of revision (abductive methodology for Priest, conservatism for Williamson). The fact that both accounts are coherent means the stalemate is not due to a lack of revisionary theory, but due to the differing weightings of theoretical virtues (conservatism vs. uniformity).

  ### Verdict and Path to Progress

  **Your Hypothesis:** You argued the impasse is due to a disagreement about *data* (what counts as evidence).
  **My Correction:** The impasse is due to a disagreement about the *constitutive aim of logic* (Normative Constraint vs. Descriptive Theory), which manifests as a disagreement about data.

  The classical logician treats Consistency as a **constitutive norm**. For them, a contradiction in the data is like a division by zero in a calculation: it signals a malfunction in the process, not a feature of the world. The dialetheist treats Truth as the **primary value**. For them, a contradiction in the data is like a black hole in physics: it signals a limit of the previous theory, not a malfunction in reasoning.

  Because they prioritize different theoretical virtues, they categorize the "Liar Derivation" differently.
  *   **Classicist:** Data = Derivation + Consistency Constraint $\to$ Result = Error in Truth Rules.
  *   **Dialetheist:** Data = Derivation + Truth Rules $\to$ Result = Error in Consistency Constraint.

  **What Counts as Progress?**
  Given this diagnosis, a "proof" that one side is right is unlikely, because the disagreement is axiomatic (about the function of logic). Progress would take one of three forms:

  1.  **Formal (The Decisive Result):** A technical demonstration that paraconsistent logics *cannot* solve the Recapture Problem. If it is proven that any logic tolerating gluts is necessarily too weak to formulate its own semantics or standard mathematics, the dialetheic position becomes pragmatically untenable. This would force the dialetheist to retreat to a "fictionalist" stance about gluts, effectively conceding to the classicist on logical practice. Conversely, a robust, contractive paraconsistent set theory that recovers classical math would shift the burden of proof heavily to the classicist.
  2.  **Conceptual (The Distinction):** A widespread acceptance of a terminological split. If the field distinguishes **Logic_N** (Normative, governing assertion/belief) from **Logic_S** (Semantic, governing truth-preservation), the debate dissolves. Classicists win Logic_N; Dialetheists win Logic_S. Progress here is the abandonment of the claim that there is only *one* "One True Logic."
  3.  **Nothing (The Standoff):** If the formal systems remain stable and the functional aims remain equally valued, there is no progress to be made. The disagreement is a **fundamental philosophical orientation**, akin to the realism/anti-realism debate. In this case, the "data" hypothesis is the best we can do: we acknowledge that the two camps are operating different research programs with different success conditions.

  **Recommendation:**
  Do not attempt to resolve the dispute by arguing about the Liar itself. The Liar is the *locus* of the disagreement, not the *cause*. To make progress, you must argue about the **Recapture Problem** (Point 3). That is the only place where the "meaning change" and "data" disagreements cash out in hard technical currency. If the dialetheic logic cannot do the work classical logic does (outside of semantics), the classicist wins on pragmatic grounds regardless of metaphysical truth. If it can, the classicist's "change of subject" charge loses its sting.

  Your hypothesis is correct that they disagree on criteria of success, but you should deepen it: they disagree on criteria of success because they disagree on **what logic is for**.
