  *Memo Draft:*
  To: Ethics Advisory Committee
  From: [Name]
  Date: [Date]
  Subject: Recommendation on Proposed Investment Policy Amendment

  I recommend that the committee reject the proposed amendment to the investment policy.

  The sponsors of this amendment advance a serious philosophical claim: that political legitimacy derives partly from outcomes, not merely procedures. They argue that if a regime delivers security and subsistence—basic human goods—and enjoys reported popular support, external actors should not withhold capital based on a specific preference for liberal democracy. This is not a cynical defense of tyranny, but a consequentialist argument that prioritizes material welfare and stability over political form. It suggests that our screening rules might impose a Western-centric conception of legitimacy that ignores the actual preferences of the population in question, potentially harming their economic prospects to satisfy our own moral intuitions.

  We must treat this argument with gravity. If we believe that poverty and violence are profound evils, a regime that mitigates them deserves moral credit. To dismiss this entirely is to risk a kind of ethical imperialism where we privilege political rights over survival needs. For the sponsors to be right, however, two conditions must hold. First, the reported public satisfaction must be a reliable proxy for genuine consent. Second, our investment must not materially increase the regime's capacity to suppress dissent or delay necessary political transitions.

  It is on these two points that the proposal fails. The fundamental obstacle is what we might call the epistemic barrier of repression. In a state where assembly is restricted, the internet is censored, and journalists are jailed, we cannot distinguish between genuine acquiescence and manufactured consent. Satisfaction surveys conducted under the shadow of coercion lack evidentiary weight. When a regime eliminates the mechanisms of dissent, it also eliminates the ability of outside observers to verify the claim that the people "prefer" this order. By accepting the regime's self-reporting on legitimacy, we are not respecting the populace; we are deferring to the oppressor's narrative.

  Furthermore, we must confront the problem of entrenchment. Capital is fungible. Even if our investment targets specific economic sectors, it frees up other state resources for security and surveillance. The argument that a pension fund is too small to influence geopolitics ignores the expressive function of our policy. By creating an exception for "developmental authoritarians," we signal that rights violations are tradable commodities, purchasable with GDP growth. This creates a moral hazard, offering regimes a pathway to rehabilitate their standing without reforming their conduct. It tells dissenters within that country that their suffering is the price of stability, and that international capital agrees.

  Some may argue that engagement is better than isolation, that investment fosters a middle class that eventually demands liberty. This is the "modernization theory" hope. But it is speculative. The harm to specific victims of censorship and imprisonment is immediate and certain; the benefit of potential future liberalization is distant and uncertain. As an ethics committee, we cannot justify concrete complicity in silence based on a hypothetical future freedom.

  For the sponsors' position to prevail, we would need independent, verifiable mechanisms to assess popular will that bypass state censorship, and assurances that capital inflows would not bolster the security apparatus. Neither is possible under the current proposal. The amendment asks us to treat "order" and "growth" as sufficient substitutes for liberty, but without liberty, we cannot know if the order is just or the growth is shared.

  Our fiduciary duty is to manage risk, but our ethical mandate is to avoid complicity. Investing in regimes that systematically silence opposition makes us participants in that silence. We cannot claim to champion human rights while carving out exceptions for regimes that are efficient at violating them. Therefore, maintaining the existing screening rules is the only position consistent with the fund's ethical commitments.

  I urge the committee to vote against the amendment.

