answer: |-
  This is a clean, honest formulation of the Carter-Leslie Doomsday Argument (DA). You've stripped away the noise, which makes the structural weakness easier to see.

  You want to keep line (2) (the Self-Sampling Assumption, or SSA). That is a respectable position; many formal epistemologists keep it because it grounds much of anthropic reasoning. If you keep (2), you cannot give up (4) (the math follows), and (3) is empirical fact.

  The crack is in **Line (6)**.

  Here is why (6) is the failure point, what giving it up costs you, and how it resolves the nagging doubts in (7).

  ### The Crack: The Hidden Prior
  Line (6) claims: *"It's pure armchair reasoning, so it should move my credence whatever I think the real risks are."*

  This is Bayesianly false. The Doomsday Argument provides a **likelihood ratio**, not a posterior probability.
  *   **Likelihood:** $P(\text{Rank}=100B \mid N=200B)$ is indeed higher than $P(\text{Rank}=100B \mid N=100T)$.
  *   **Posterior:** To get a conclusion about $N$, you must multiply that likelihood by a **prior** probability distribution over $N$.

  Line (6) smuggles in a hidden prior: it assumes a scale-invariant or flat prior over the total number of humans ($1/N$). It assumes that, before looking at your birth rank, a total population of 200 billion was just as likely as 100 trillion (or that the probability density doesn't favor huge numbers enough to counteract the sampling effect).

  If your empirical priors suggest that civilizations *usually* either die young or expand to fill the galaxy (a bimodal distribution), the DA's likelihood ratio is a featherweight against the weight of that prior. If physics allows for $10^{20}$ humans, and there are no specific defeators (nukes, AI), your prior for a large $N$ should be massive. The DA shifts that probability down, but not necessarily to "doom within centuries."

  **Giving up (6) costs you the "Armchair Apocalypse."**
  You lose the ability to claim that Bayesian gymnastics override empirical risk assessment. You admit that if our empirical models say colonization is physically easy and risks are manageable, the DA is just a mild nudge, not a verdict. It saves the argument from being a "proof" of doom and reclassifies it as a "bias correction" on our optimism.

  ### The Secondary Crack: The Reference Class (Line 1)
  Your first nag in (7) is the reference class problem. This actually attacks the applicability of **(2)**, even if you keep the principle.

  *   **If the class is "Humans":** $N \approx 200$ billion. Doom is near.
  *   **If the class is "Conscious Observers":** This includes future AI, uploaded minds, or aliens. If we create a billion AI observers for every biological human, your rank of 100 billion is *extremely* early. $N$ could be $10^{20}$. The DA vanishes.

  By keeping (2) but leaving (1) vague ("my species"), you invite the **Presumptuous Philosopher** objection. If you insist on SSA (line 2) without a rigorous definition of the reference class, you can prove anything.
  *   **Cost:** To fix this, you must admit that line (1) is not "no special information." You *do* have special information: you are a biological, carbon-based, 21st-century observer. Conditioning on that specific subset changes the likelihoods. If you define the class too narrowly (biological humans), you beg the question (assuming no post-biological future). If you define it too broadly (all observers), the doom conclusion disappears.

  ### Why the Book Analogy Fails (Line 7, Point 2)
  You noted the book analogy works for pages but fails for humanity. Here is the structural difference:

  *   **Books are Static Urns:** When you pick up a book, the total page count is *already fixed*. You are sampling from a completed set. The DA works perfectly here (this is the German Tank Problem).
  *   **Humanity is a Causal Factory:** The total number of humans ($N$) is not fixed at the start. It is determined by future causal processes (technology, survival, reproduction).

  If the universe is set up such that long-lived civilizations produce vastly more observers than short-lived ones, then **you are more likely to exist at all** in a long-lived civilization. This is the **Self-Indication Assumption (SIA)**.
  *   **SSA (Your Line 2):** "Given that I exist, where am I in the queue?" (Favors short queues).
  *   **SIA:** "Given that I exist, how likely is it that the queue is long enough to contain me?" (Favors long queues).

  Many philosophers argue SIA exactly cancels out the DA. By refusing to drop (2) (SSA), you are implicitly rejecting SIA. The cost of keeping (2) is that you must accept you are *not* in a universe that favors existence. You have to accept that the fact you exist *now* doesn't make a future with trillions of observers more likely, even though that future contains more "slots" for you to occupy.

  ### Recommendation
  **Give up Line (6).**

  Rephrase it to: *"This is a likelihood ratio that updates my empirical priors. If my empirical priors for long-term survival are strong (based on physics, engineering, risk mitigation), this argument only slightly reduces my confidence, it does not overturn it."*

  **The Cost:**
  1.  **Humility:** You lose the cool, spooky power of predicting the end of the world from an armchair.
  2.  **Work:** You actually have to evaluate the empirical risks (AI, bio, nuclear) to set your prior. The DA becomes a check on hubris, not a prophecy.

  **Why this solves your nags:**
  *   **Reference Class:** If the reference class is ambiguous, the likelihood ratio is weak. A weak likelihood ratio cannot override a strong empirical prior (fixing Nag 1).
  *   **Book Analogy:** Books have fixed priors (publishing standards). Civilizations do not. Acknowledging the need for a prior (Line 6) explains why the book heuristic works (we know the prior distribution of book lengths) but the DA feels wrong (we don't know the prior distribution of civilization lifespans) (fixing Nag 2).

  You keep your self-locating logic (2), but you stop it from eating your brain.
