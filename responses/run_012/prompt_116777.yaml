answer: |-
  This is a sophisticated *aporia*, and the student has reconstructed a tension that has plagued commentators on *Nicomachean Ethics* Book V (specifically 1133a–b) for centuries. The argument is logically valid; if you accept premises (1) through (4), conclusion (5) follows inescapably, contradicting (6).

  To preserve (6)—Aristotle's ethical conviction that exchange can be unjust and that usury/retail trade can be corrupt—you must reject **Step (4)**.

  Here is the breakdown of why that step is the failure point, why it seduces the modern reader, what work money is actually doing in Aristotle's system, and the cost of the alternatives.

  ### 1. The Verdict: Reject Step (4)
  **The Step:** *"But if money's worth is conventional, then whatever rate the two parties settle on is by definition the just rate, since there is no independent fact of the matter for the bargain to get wrong."*

  **Why it looked plausible:**
  This step relies on a post-Enlightenment, liberal intuition that equates **convention** (*nomos*) with **subjective agreement**. In modern economic thought (and libertarian political theory), if value is not intrinsic (natural), it is preference-based. If it is preference-based, then voluntary consent is the only metric of justice. The student assumes that because money is not *physis* (nature), it is essentially arbitrary, like choosing which side of the road to drive on. Once the two drivers agree to drive on the left, they cannot be "wrong."

  **Why it is false (in an Aristotelian framework):**
  For Aristotle, *nomos* (convention/law/custom) is not the opposite of objectivity; it is the *source* of political objectivity. A convention is not a whim; it is a functional standard established by the *polis* to facilitate a specific end (the good life).
  *   **Analogy:** Language is conventional. There is no natural reason why "dog" means *canis familiaris*. However, once the convention is established, it is objectively false to use the word "dog" to refer to a cat. You cannot simply agree with a friend to call a cat a "dog" and thereby make it true within the linguistic community.
  *   **Application to Money:** Money is a convention established to measure *demand* (*chreia*) across time. While the *existence* of money is conventional, the *rate* it measures is constrained by the reality of social need and the functional contribution of the traders to the community. If a builder trades a house for one shoe, the convention of money reveals this as unjust, not because the numbers are wrong, but because the ratio violates the proportional reciprocity required to hold the city together.

  **The Cost of Rejecting (4):**
  You must abandon the idea that "consent" is the sole sufficient condition for justice. You have to accept that Aristotle believes there is a **just price** (or at least a just range) determined by social utility and status, which exists independently of the momentary agreement of the traders. This commits you to a form of objective value theory that is difficult to square with modern economics, but it is necessary to save Aristotle's ethics.

  ### 2. The Work Money Is Doing
  If we reject (4), we must clarify the ontology of money in this argument to ensure it isn't just a placeholder for magic.

  **Does it measure a real magnitude or merely a ratio?**
  It measures a ratio, but that ratio represents a **real social magnitude**: the relative demand for the producers' contributions to the *polis*.
  Aristotle argues that need (*chreia*) holds the city together. The builder and the shoemaker are unequal in nature, but they must be made equal for exchange to happen. Money does not measure the physical properties of the house or shoes; it measures the *demand* for them.
  *   **The Nuance:** Demand is not merely subjective desire (I want shoes); it is objective social necessity (The city needs shoes). Money stabilizes this fluctuating demand into a unit that allows for deferred exchange.

  **Does "conventional" mean "arbitrary"?**
  No. In Aristotle's metaphysics, "by nature" means having an internal principle of motion/rest. "By convention" means having an external principle (law/custom).
  *   **Arbitrary:** We could have used shells instead of gold. That choice is arbitrary.
  *   **Non-Arbitrary:** Once gold is established as the measure, its purchasing power *ought* to reflect the proportional worth of the goods. If the convention fails to reflect that proportion (e.g., through inflation or usury), the convention is corrupted, not the justice.
  *   **The Work:** Money acts as a **substitute for need**. Since I cannot bring my need for a house to the shoemaker tomorrow, I take money, which represents my capacity to command need later. It makes the *variable* (need) *determinate* for the sake of the transaction.

  ### 3. Pricing the Alternatives
  You asked what you pay if you choose to keep a different step and sacrifice another. Here is the ledger:

  **Option A: Keep (4) & (5), Reject (6)**
  *   *The View:* Accept the libertarian conclusion. Aristotle was wrong; there is no unjust exchange between consenting adults. Usury is only bad if it destabilizes the state, not because the transaction itself is inherently unjust.
  *   *The Cost:* You dismantle the core of Aristotelian virtue ethics. If exchange is never unjust, then *pleonexia* (grasping more than one's share) in trade is impossible. This reduces the *Ethics* to a manual for personal temperament rather than social justice. It makes Aristotle a proto-Lockean, which renders his critique of "chrematistics" (wealth-getting) incoherent.

  **Option B: Keep (4), Reject (3)**
  *   *The View:* Money is natural, not conventional. Its value is intrinsic (perhaps metallic content).
  *   *The Cost:* Textual infidelity. Aristotle explicitly states money exists by convention (*nomisma*). Furthermore, this leads to a naive metallism that cannot explain fiat currency or credit, and it doesn't actually solve the justice problem (why is X amount of gold equal to a house?).

  **Option C: Keep (2), Reject (1)**
  *   *The View:* Justice in exchange does *not* require commensurability. We trade because we are different, not because we are equal.
  *   *The Cost:* You lose the concept of *antipeponthos* (reciprocity). For Aristotle, the city is a unity of unequals made equal through proportion. If you remove commensurability, you remove the mathematical basis for political friendship. The exchange becomes a power struggle, not a justice-based transaction.

  **Option D: Reject (2)**
  *   *The View:* Need *is* a measure. It admits of a unit (e.g., labor-time or caloric utility).
  *   *The Cost:* This is the most common "fix" (often associated with Marx's reading of Aristotle). It posits that Aristotle implicitly meant "socially necessary labor time."
  *   *Why it's risky:* Aristotle never says this. He says need holds things together, but money measures need. To reject (2) is to argue the student misinterpreted "need." While plausible, it requires more exegetical gymnastics than rejecting (4). Rejecting (4) requires only a correction of political philosophy; rejecting (2) requires rewriting Aristotle's theory of value.

  ### 4. Gap in Reasoning or Gap in Reconstruction?
  Is this a genuine problem in Aristotle, or did the student botch the paraphrase?

  **It is both.**
  *   **The Reconstruction Error:** The student imported a modern binary (Objective Nature vs. Subjective Convention) that Aristotle does not hold. For Aristotle, a convention can be rationally binding. The move from "conventional" to "whatever parties settle on is just" is the student's imposition of liberal contract theory onto a communalist text. Aristotle believes the *law* oversees exchange, not just the parties.
  *   **The Genuine Gap:** Aristotle's text in *NE* V.5 is notoriously obscure (some say incoherent). He struggles to explain *how* need becomes commensurable. He says money "makes things commensurable," but admits money is just a representative of demand. He never fully solves the transformation problem (how qualitative differences in goods become quantitative differences in price). The student has correctly identified that Aristotle's mechanism for value is under-specified.

  ### Summary for Your Piece
  To save Aristotle's claim that unjust exchange exists (6), you must argue that **conventionality does not entail arbitrariness.**

  Money is a **political institution**, not a private tool. Its value is conventional in origin but normative in function. It measures the proportional equality of citizens' contributions to the common good. Therefore, a bargain can be "unjust" even if consensual, if it violates the proportional reciprocity that the money is supposed to represent. The student's error lies in assuming that because the *ruler* is man-made, the *measurement* is up to the people being measured. For Aristotle, the ruler is man-made, but the measurement is binding on all.

  **The price you pay:** You must defend the idea that there is an objective "social value" to goods independent of market price, and that the state (or the moral law) has standing to judge private contracts against that standard. This makes Aristotle incompatible with free-market fundamentalism, but it preserves the integrity of his ethical system.
