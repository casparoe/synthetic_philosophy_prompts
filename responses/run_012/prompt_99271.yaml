answer: |-
  **MEMORANDUM**

  **TO:** Members of the Public Memory and Art Commission
  **FROM:** Chair, Public Memory and Art Commission
  **DATE:** October 24, 2024
  **SUBJECT:** Recommendation Regarding the Elias Wren Monument

  **Introduction**
  This Monday, the Commission must vote on the disposition of the Elias Wren statue. We face five options: removal, retention as is, retention with a plaque, relocation to the city museum, or acceptance of the proposed counter-monument. While I acknowledge the compelling argument from Commissioner Evans to adopt a purely prospective test—asking only what continued display teaches the next generation—I urge the Commission to adhere to the rubric we adopted last year. The rubric provides the necessary diagnostic precision to ensure our decision is consistent with past cases, while the prospective test informs the remedy. Based on this framework, I recommend we **accept the counter-monument in place of the plaque.**

  **Rubric Application: Category (c)**
  Under our established rubric, the Wren statue falls squarely into Category (c): *the honor was unobjectionable when conferred but now functions to celebrate the wrongdoing, whatever the original intent.*
  In 1911, Wren's philanthropy (the library and vocational school) was viewed as unalloyed public good; the institutionalization of orphans was standard social policy, not moral wrongdoing. Therefore, Category (a) does not apply, as the statue was not erected to celebrate family separation. Category (b) is also inapplicable because the "wrongdoing" (forced separation) is not incidental to the honor; it is intrinsic to the vocational school depicted in the bas-relief. However, because the moral understanding of child welfare has shifted fundamentally since 1911, the statue now functions to valorize a system of family removal that causes present-day pain. Category (c) acknowledges this shift without erasing the historical context of Wren's original intent.

  **Engagement with the Prospective Test**
  Commissioner Evans argues that we should discard the rubric's historical analysis and ask only what this site teaches the next generation. This is a vital question, but it cannot stand alone. Without the rubric's diagnostic work, we cannot distinguish between a monument that teaches a warning (Category c) and one that teaches endorsement (Category a). If we apply the prospective test *through* the lens of Category (c), the counter-monument becomes the superior pedagogical tool. A removal teaches erasure; a plaque teaches static correction; but a shadow that moves across the statue teaches critical engagement. It demonstrates to the next generation that public memory is not fixed, but is a dialogue between past actions and present values. The counter-monument satisfies the prospective test better than any other option because it transforms the site from a place of veneration into a place of inquiry.

  **The Strongest Argument for Removal**
  The strongest argument against my recommendation is the case for **Removal**. Proponents argue that for descendants of families separated by Wren's policies, the statue is not a subject of inquiry but a source of active trauma. From this view, no amount of artistic contextualization mitigates the harm of a public veneration of a man who lobbied to break up families. The moral imperative to stop the harm outweighs the historical value of retaining the artifact in situ.

  **Reply to the Argument for Removal**
  While the risk of trauma is real, removal forecloses the public's ability to confront the complexity of civic history. By accepting the counter-monument, we do not ask affected communities to endure the statue unmodified; we ask them to witness its contestation. The shadow literally darkens the image of Wren leading the children, visually acknowledging the harm without sanitizing the record. We mitigate the harm not by hiding the history, but by empowering the community to alter its meaning.

  **Conditions and Implementation**
  Should the Commission approve the counter-monument, the following conditions must be met:
  1.  **Maintenance Agreement:** The artist collective must endow a maintenance fund covering 10 years of upkeep for the new figure.
  2.  **Community Programming:** The Office of Arts & Culture must coordinate quarterly guided tours at the site focusing on the history of child welfare policy.
  3.  **Review Clause:** The Commission will review the installation's impact two years post-installation to assess community sentiment.
  4.  **Visibility Guarantee:** The positioning must ensure the shadow falls across the bas-relief specifically between 11:45 AM and 12:15 PM daily, verified by an independent surveyor.

  **Time Frame**
  The artist collective must submit final engineering plans within 90 days. Installation must be completed by **August 15, 2025**, to coincide with the start of the academic year for the associated vocational school's modern successors.

