      *   *If Tomas thinks Actual Stakes matter:* Then Dana *did* know (error was caught). So Priya's second claim is true.
      *   *Standard IRI:* Usually ties to *practical adequacy*. If the action is actually safe, is it adequate? Most IRI proponents (Fantl & McGrath) argue knowledge is the norm of practical reasoning. If Dana reasons "It's safe enough to wait," and it *was* safe enough (due to net), did she know?
      *   *Let's have Tomas argue the "Actual Stakes" version for maximum contrast.* It makes the disagreement sharper. If Tomas argues Actual Stakes, he says Dana Knew all along. Vera says "Dana Knew" was False at 3 a.m. (in Priya's initial context) and True later.
      *   *Wait, Contextualism says truth is relative to context of utterance.* So when Priya spoke in the morning (thinking high stakes), "Dana knows" was False. When she spoke later (knowing low stakes), "Dana knows" was True.
      *   *IRI says truth is invariant.* So one of Priya's claims was objectively false.
      *   *Okay, that's the core.*

  6.  **Final Review against Constraints:**
