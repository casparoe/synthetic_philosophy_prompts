      *   *Crucial Distinction:* For Vera, the fact "Safety net exists" lowers the *standards* for attribution. For Tomas, the fact "Safety net exists" changes the *metaphysical status* of Dana's belief (makes it knowledge).
      *   *The Separator:* A case where the Attributor is in a high-stakes context, but the Subject is in a low-stakes context, and the Attributor *knows* the Subject is low-stakes.
          *   Vera: Attributor can still truthfully say "S doesn't know" if Attributor's context is high stakes (e.g., deciding whether to fire the nurse).
          *   Tomas: If S is low stakes and has evidence, S knows. Attributor saying "S doesn't know" is false.

  5.  **Polishing the Dialogue:**
      *   Ensure the voices are distinct. Vera is precise about linguistic usage and conversational dynamics. Tomas is precise about action norms and metaphysical grounding.
      *   Check the "Wrinkle": Dana's ignorance of the protocol. This is vital.
      *   *Tomas's pivot:* If Dana thinks the stakes are high, she requires more evidence to know. She didn't have it. So she didn't know. Priya was right the first time, wrong the second time? No, Priya said "She knew" the second time.
