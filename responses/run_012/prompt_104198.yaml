      *   **IRI/Pragmatic Encroachment (Tomas):** "Knows" is invariant semantically, but knowledge itself depends on the *subject's* practical situation (stakes). If it matters more to S whether p is true, S needs more evidence to know p.
      *   **The Tension:** In the Dana case, Dana *thinks* stakes are high (no safety net), but *actual* stakes are low (safety net exists).
