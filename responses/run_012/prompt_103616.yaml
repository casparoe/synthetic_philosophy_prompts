answer: |-
  Welcome. It is genuine pleasure to look out at this room. We have eighty of you, from a dozen countries, representing almost every way there is to study how the world works. Economists, scientists, and—I see you over there—five philosophers who are already auditing the logic of this sentence.

  You are about to navigate a new city. The standard advice for this moment is "When in Rome, do as the Romans do." It's warm, but it's useless. It assumes you know what the Romans are doing, and why they're doing it. It treats all local rules as equally binding. They aren't.

  So, here is a better framework. As you encounter local conventions—tipping, queueing, jaywalking at 3 a.m., standing on the right side of the escalator—sort them into two piles.

  **Pile One is Coordination.**
  These are rules that exist solely to keep us from crashing into each other. They are coordination equilibria. Think of queueing in a single line versus crowding a counter. Think of which side of the sidewalk you walk on.
  Why are you obliged to follow these? Not because "tradition," but because of fairness. These systems only work if everyone expects everyone else to follow them. When you break a coordination convention, you are effectively taking without paying. You are free-riding on the restraint of others. You get the benefit of the orderly line while imposing the cost of your chaos on everyone else. For the economists in the room: this is a negative externality. For the rest of you: it's cutting in line. You owe it to them to follow these rules, even if they seem inefficient to you.

  **Pile Two is Local Color.**
  These are markers. How people greet each other, how much small talk happens before a meeting, whether you take your shoes off at the door. These signal belonging, but they don't hold up the ceiling.
  Here, the moral weight flips. You are not obliged to adopt these perfectly. You are a visitor; you have a grace period. But—and this is crucial—you are strictly obliged *not to insist* that your way is the rational default. If you treat your own cultural markers as universal laws, you are the one being rude. The obligation here isn't to conform; it's to refrain from judging.

  Now, the hard part. The line between these piles is contested.
  Take tipping. Is it a coordination convention? In some places, yes. It is a subsidized wage system. If you don't tip, you are stealing labor from the server, relying on other customers to cover the gap. That's Pile One. In other places, it's a bonus for excellence. That's Pile Two. You need to look at the structure, not just the habit.

  Take jaywalking on an empty street at 3 a.m. Is that a safety coordination rule? Or is it a performative respect for the law? If you cross and cause a car to brake, you've broken a coordination rule. If you cross and no one sees you, but a local scolds you, they are enforcing a marker.

  This brings me to the question the five philosophers in the room are waiting for. Does the fact that something is a "local norm" create an obligation *by itself*?
  The answer is no. "Is" does not create "ought."
  A norm only creates an obligation when it leans on something else: usually fairness, or harm reduction. If the norm is just arbitrary signaling, obeying it is polite, but breaking it isn't immoral. But if the norm is a fragile truce that keeps society running, breaking it is a moral failure.

  You will not always know which pile a rule belongs to. Locals often don't agree. You will make mistakes. You will tip when you shouldn't, or stand on the wrong side of the escalator and get glared at.
  When that happens, don't argue. Don't explain the logic of your home country. Just apologize and adjust.

  Your job here is to study the world. Part of that study is observing how we manage to live together without crashing. Some of those mechanisms are vital infrastructure. Some are just decoration. Learn to tell the difference.

  Welcome to the cohort. Let's get to work.
