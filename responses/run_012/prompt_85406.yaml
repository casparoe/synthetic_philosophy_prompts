      *   *Focus:* The *Markup* is the real poison pill. The Loan is just the funding mechanism. If the Buyer were paid a flat stipend from dues, would the loan still be needed? Probably not.
      *   *The "Money as Tool" argument:* It's weak because money is a *claim* on social labor, not a physical tool. A van depreciates; money (nominally) doesn't, but lending it creates a debt relationship.
      *   *The "Natural Limit":* The user mentioned this. Profit seeking has no natural limit; wage labor does (hours in a day). This is a strong point to include.

