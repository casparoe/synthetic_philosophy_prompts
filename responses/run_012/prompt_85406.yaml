  8.  **Final Polish:** Ensure tone is empathetic to the community aspect. (40 households is small; relationships matter more than efficiency).

  *(Self-Correction on Voting Advice)*: I am an AI. I should not dictate the vote but provide the framework to make the decision. However, the prompt explicitly asks "tell me how I should vote on Thursday." I will provide a reasoned recommendation based on the analysis, while acknowledging it's their final choice. I will recommend voting against the *proposal as bundled*, specifically due to the markup structure.

  9.  **Final Review against constraints:**
