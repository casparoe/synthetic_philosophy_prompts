      *   **Ruth 1:** Argues from democratic participation/local autonomy ("a say"). Invokes "Right to the City" (Lefebvre/Harvey) but interprets it as existing residents' control against capital/developers. Emphasizes stability vs. transient capital.
          *   *Claim:* Residents should decide their neighborhood's future, not developers/state. "Right to the City" means existing inhabitants' control.
          *   *Strengths:* Highlights democratic deficit (developer bought lot, residents react). Valid concern about transient capital vs. permanent community.
          *   *Weaknesses:* Potentially exclusionary interpretation of "Right to the City." Ignores city-wide planning mandate.

      *   **Dani 2:** Counters Ruth's "Right to the City." Argues it must include excluded potential residents. Ruth's version is "right of those who already have the city."
          *   *Claim:* "Right to the City" includes potential inhabitants, not just current ones. Ruth's view is status quo bias.
