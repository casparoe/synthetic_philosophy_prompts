      *   **Ruth 2:** Argues standing/stake. Potential residents don't have standing; current residents do. Renters are transient too. Questions whose interest is being served (landlord's profit vs. renter's stability).
          *   *Claim:* Standing belongs to those with long-term stakes. Potential residents are abstract; current residents are concrete.
          *   *Strengths:* Practical concern about democratic standing. Who represents the non-existent?
          *   *Weaknesses:* Circular logic (only those here matter). Dismisses the structural benefit of housing supply for future renters.

      *   **Dani 3:** Counters the stake argument. Future renters need housing too. Ruth's principle creates a "club" not a "commons." First arrivals dictate terms. Explains systemic stagnation ("why nothing gets built").
          *   *Claim:* Veto power creates a club, not a commons. Systemic issue (NIMBYism).
          *   *Strengths:* Strong systemic critique. Distinguishes commons vs. club effectively.
          *   *Weaknesses:* Might underestimate the value of stability/community cohesion.

      *   **Ruth 3:** Argues for procedural democracy ("let users make rules"). Challenges the "market" selection vs. community selection. Values social capital (neighbors, 30 years) which isn't priced in.
          *   *Claim:* Procedural fairness (hearings). Social value ≠ market value. Objection shouldn't be illegitimate *a priori*.
