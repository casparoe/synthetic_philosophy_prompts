      *   **Ruth 4:** Closing. "City needs housing" approves everything. Her reason is falsifiable/arguable within the community.
          *   *Claim:* Local objections are contestable; macro needs are abstract bludgeons.
          *   *Strengths:* Highlights the abstract nature of macro arguments vs. concrete local harm.
          *   *Weaknesses:* False dichotomy (either veto or approve everything).

  3.  **Synthesize and Adjudicate:**

      *   **Overall:** Dani has the stronger philosophical argument regarding justice and exclusion, but Ruth has the stronger democratic theory argument regarding participation and stake. However, Dani wins on the specific issue of zoning reform because Ruth's position leads to paralysis (the "veto" problem).
      *   **Missing:** Both miss the distinction between *participation* and *veto*. Both miss the role of *regional* vs. *local* governance scales. Both miss the nuance of "character" (can be preserved via design, not just density).
      *   **Dissolving Distinction:** The distinction between a *veto* and a *voice*. Ruth wants a veto (or treats voice as veto); Dani argues against the veto. If the process allowed meaningful voice without veto power, some tension dissolves. Also, the distinction between *exclusionary intent* and *exclusionary effect*. Ruth denies intent; Dani points to effect.
      *   **Confidence:** High on Dani's structural critique, moderate on the democratic theory resolution.
      *   **Least Sure:** The precise weighting of "social capital" (Ruth's 30 years) against "housing need" (Dani's thousands of units). This is the core normative clash.

