  For decades the argument over whether history teaches lessons has run without either side conceding anything. One camp treats historical analogies as instruments of reasoning that can be appraised on their merits — Munich as a warning against appeasement, Vietnam as a warning against gradual escalation, the Thucydides trap as a warning about a rising power displacing a ruling one — and holds that we can say, before the fact, which analogies are apt and which are not. The other camp holds that any two episodes resemble one another in indefinitely many respects and differ in indefinitely many others, so that an analogy's aptness is settled by the conclusion it was recruited to support, which makes talk of the lessons of history a name for the retroactive justification of a decision already taken. My hypothesis, offered as a hypothesis and not as the answer, is that the two camps are equivocating on 'lesson': one side means a covering law, a claim of the form 'situations of this shape end this way', the other means a dispositional heuristic, a trained readiness to notice a certain shape of situation at all. If that is right, the disagreement is neither empirical nor merely verbal, and neither side can win it as posed. Test the hypothesis against what each camp actually says; if my framing is a caricature, or if a real empirical dispute about whether power transitions cause war is doing the hidden work, say so plainly rather than working inside my framing, and don't give me a catalogue of positions in place of a diagnosis.

