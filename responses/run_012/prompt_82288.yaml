  Alternatively, progress lies in accepting a pluralistic utility. If Camp 1 accepts lessons as probabilistic warnings rather than laws, and Camp 2 accepts heuristics as unavoidable cognitive tools rather than mere excuses, the debate softens. The crucial test case is a "negative lesson"—where avoiding a historical parallel successfully prevented war. Demonstrating that *not* acting on an analogy (e.g., avoiding Vietnam-style escalation) produced peace would validate the heuristic value without requiring a covering law. It proves the lesson functioned as a brake, not just an accelerator. Without pre-commitment to falsification or evidence of successful avoidance, the argument remains a stalemate of competing narratives. We must stop asking if history teaches and start asking when specific analogical reasoning reduces error rates in decision-making.

  ### Where my framing is weakest

  Your framing is weakest in assigning "covering law" to Camp 1. Few serious proponents claim deterministic laws; they argue for recurrent patterns or probabilities. By strawmanning Camp 1 as positivists, you make their position easier to dismiss than it actually is. Additionally, defining Camp 2's view as a "dispositional heuristic" contradicts their core claim that lessons are retroactive fabrications. A heuristic implies a forward-looking cognitive tool, whereas Camp 2 argues the "lesson" is a backward-looking political shield. This misclassification obscures the true empirical dispute about causality.
