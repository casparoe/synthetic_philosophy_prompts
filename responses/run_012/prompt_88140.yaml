answer: |-
  She will judge that the proposal increases net wild-animal suffering per hectare over the decade.

  The instructor is applying a form of **negative total utilitarianism** constrained by the empirical premise that wild animal lives are net negative. Her remark that "the arithmetic is mostly in the number of lives" indicates a **Population-Dominant Rule**: when welfare is negative, changes in population size ($N$) outweigh changes in per-capita welfare ($W$) unless the welfare shift is catastrophic or flips the sign to positive. In all four prior cases, population changes and welfare changes moved in the same direction regarding suffering (e.g., $N \uparrow$ and $W \downarrow$ in Cases 1 & 4; $N \downarrow$ and $W \uparrow$ in Cases 2 & 3), so they do not independently test the weight of $N$ versus $W$. However, her explicit comment prioritizes $N$.

  Three plausible rules fit the prior verdicts:
  1.  **Population-Dominant Negative Totalism:** If $W < 0$, any significant increase in $N$ increases total suffering, regardless of improvements in $W$, because the sum of negative lives grows. (Predicts: Suffering Increases).
  2.  **Proportional Negative Utilitarianism:** Total suffering is $N \times W$. The verdict depends on which variable changes proportionally more. (Predicts: Ambiguous, but likely Increases given the "order of magnitude" $N$ rise vs. qualitative $W$ improvement).
  3.  **Habitat-Subsidy Heuristic:** Interventions that artificially raise carrying capacity (feeding, waste, habitat creation) increase suffering by inviting more animals into negative-existence traps; interventions that lower capacity reduce it. (Predicts: Suffering Increases).

  My best guess is Rule 1. The instructor's explicit remark about the arithmetic being "mostly in the number of lives" functions as a lexical priority rule: count dominates intensity when the sign is negative. The quarry conversion increases the number of lives by an order of magnitude (10x); unless the individual welfare improves by more than 90% (shifting from deeply negative to near-zero), the total sum of negative welfare will rise. Given the premise that wild lives are *typically* net negative due to starvation and predation, a constructed wetland likely reduces these risks but does not eliminate them enough to offset a 10x population surge.

  To distinguish Rule 1 (Population-Dominant) from Rule 2 (Proportional), the cleanest further case would be: **A parasite treatment program for a stable deer herd that reduces individual suffering by 90% but causes a 10% population increase due to higher survival rates.** Rule 1 predicts net suffering increases (because $N$ rose); Rule 2 predicts net suffering decreases (because the 90% welfare gain outweighs the 10% population rise).
