answer: |-
  The Tick arrived with a sound that wasn't a sound, a global synchronization shudder that rattled the teeth of the universe. In the Institute of Discrete Dynamics, the coffee in Elara's mug rippled in perfect unison with the suspension bridge outside. Then, stillness. Absolute, frozen stillness until the next Tick.

  Elara watched a dust mote suspended in a shaft of light. In the continuous models of the Ancients, the mote traced a smooth, differentiable curve. In her world, the mote was a coordinate tuple $(x, y, z, t)$. At $t$, it was at $(402, 119, 5)$. At $t+1$, it was at $(403, 119, 5)$. Between $t$ and $t+1$, there was no *between*. There was only the void of non-existence.

  "You're doing it again," Kael said from the doorway. He was holding a suitcase. It was a leather artifact, continuous grain, a luxury from the pre-Grid era. "Staring at the null-interval."

  "There is no null-interval, Kael. That's the point. There is *nothing*."

  "Things move, Elara. I have a train to catch. It will arrive. The calculus works."

  "The calculus is a map for a territory that doesn't exist," she said, not turning from the window. "You're using real numbers to describe an integer universe. It's like using a fluid dynamics equation to count marbles."

  Kael sighed, the sound weary and heavy. He was an engineer. He built bridges that stood up during the Tick-shudder. He didn't care that the bridge didn't technically *cross* the gap between supports during the update cycle; he cared that it held weight at $t$. "I'm not staying for the seminar. You know they're just going to run the convergence proof again."

  "Because it's the only shield they have."

  "It's the truth."

  "It's a workaround." She finally turned to him. The distance between them was four meters. In their world, that was exactly 4,000,000,000 voxels. A finite, countable number. "If I walk to you, Kael, I don't pass through infinite points. I pass through four billion. The Dichotomy is dead here. We know that. So why are they still using it to silence the Arrow?"

  "Because the Arrow is semantics. If you are at different places at different times, you are moving. Definitionally."

  "When?" she pressed, stepping into his space. "At which Tick am I moving? At $t$, I am at $x$. I am at rest. At $t+1$, I am at $x+1$. I am at rest. If I am at rest at every moment of time, and time is composed only of moments, when do I move? Don't tell me 'over the interval.' The interval is empty."

  Kael zipped the suitcase. The zipper sound was jagged, a series of micro-ticks. "I love you, Elara. But I can't live in the gaps."

  He left. The door clicked shut at the next Tick.

  Elara was alone with the paradox.

  ***

  The seminar room was a hemisphere of white lattice-work. Her colleagues sat in floating chairs, sipping synthetic tea. At the front, Director Hames projected a hologram of a runner approaching a wall.

  "The Zeno-Democritus problem," Hames announced. "Classically, the runner must traverse half the distance, then half the remainder, ad infinitum. The sum of the infinite series converges to the wall. Motion is permitted."

  A murmur of agreement. This was the Standard Dogma. It was the intellectual equivalent of a comfort blanket.

  Elara raised her hand. "That solution relies on the density of the reals. It assumes space is infinitely divisible. In our ontology, the Planck-Voxel is the hard floor. There is no 'half' of a voxel."

  Hames smiled patiently. "Precisely, Elara. Which is why the paradox is resolved even faster in our framework. If the distance is $N$ voxels, the runner takes $N$ ticks. Finite steps, finite time. No infinity, no problem."

  "That resolves the Dichotomy," Elara said, standing up. "It does not resolve the Arrow. The Dichotomy asks *if* we can finish. The Arrow asks *how* we travel."

  She walked to the projection field. She manipulated the code, stripping away the smooth curves of the hologram until the runner was a jagged stack of voxels.

  "Zeno's Arrow premise is: At every instant, the arrow occupies a space equal to itself. Therefore, it is at rest. If time is composed of instants, the arrow is always at rest."

  "Obsolete," called a post-doc from the third row. "Velocity is $\Delta x / \Delta t$. We measure the displacement over the Tick. It's non-zero. Therefore, it moves."

  "You're defining motion as a relation between two states," Elara said, her voice tightening. "You are not locating the motion *in* the state. You are saying motion is a memory. The arrow at $t+1$ 'remembers' it was at $t$, and we call that difference 'velocity.' But at $t$, the arrow has no velocity. It has position. At $t+1$, it has position. The velocity exists in the comparison, not in the physics."

  "So where is it?" Hames asked. "If not in the comparison, where is the kinetic energy stored?"

  "That's what I'm trying to find."

  "Elara," Hames said, his tone shifting from pedagogical to managerial. "We have grants to renew. The Grid works. The trains run. Stop looking for a ghost in the machine."

  "The ghost is the machine," she muttered, but she sat down.

  ***

  Back in her private lab, Elara initiated the Reconstruction. This was her obsession. She wanted to run Zeno's argument on the hardware of her own universe to see exactly where the logic broke.

  She set up a vacuum chamber. Inside, she suspended a single iron sphere, one voxel in diameter. She aligned the lattice sensors to track its position with maximum fidelity. She programmed a magnetic launcher to push it exactly ten voxels to the right.

  *Premise 1:* To move from $A$ to $B$, the object must occupy the intermediate states.
  *Premise 2:* At any given Tick, the object occupies a single state.
  *Conclusion:* Motion is impossible.

  In the continuous world, Premise 1 is the trap. It forces an infinite regression.
  In her world, Premise 1 is false. There are no intermediate states between adjacent voxels. If the sphere is at $x=0$ and moves to $x=1$, there is no $x=0.5$. The "halfway" point is a syntax error.

  She ran the simulation.

  *Tick 4092:* Sphere at $x=0$. Velocity = 0.
  *Tick 4093:* Sphere at $x=1$. Velocity = 0.
  *Tick 4094:* Sphere at $x=2$. Velocity = 0.

  The data scrolled across her screen, a waterfall of zeros.

  She leaned back. This was the uncomfortable truth her colleagues ignored. In the continuous world, Zeno is defeated by the Limit. The infinite sum becomes finite. The math saves the phenomenon.

  In the discrete world, Zeno is defeated by the Lattice. The infinite sum is never generated. The math is irrelevant.

  But the Arrow remained.

  In the continuous world, the Arrow is defeated by the Derivative. Velocity is the limit of $\Delta x / \Delta t$ as $\Delta t \to 0$. It defines motion as a property of the instant, a tangent vector.

  In the discrete world, $\Delta t$ cannot go to zero. It stops at 1. You cannot take the derivative. You can only take the difference. And a difference requires two points.

  Elara stared at the sphere. It had reached the target. It had moved. Everyone agreed it had moved. But she had the logs. She had the absolute proof that at no point in the history of the universe did that sphere possess the property of "moving." It possessed a history of positions. It possessed momentum as a conserved quantity in the update rules, but it never *flowed*.

  It teleported. The universe was a flipbook, and they were the drawings.

  The problem wasn't that she couldn't solve the paradox. The problem was that the solution revealed a universe more alien than the paradox suggested. The textbooks said: *Discreteness solves Zeno.*
  Elara knew: *Discreteness kills Motion.*

  If motion requires a "between," and there is no "between," then motion is an illusion generated by consciousness stitching together static frames. But consciousness was physical. Consciousness was neurons firing. Neurons were voxels.

  If the brain is a flipbook, who is watching the movie?

  She opened her comms link. Kael's ID was still there. *Last Seen: 3 Ticks Ago.*

  She typed: *I found why the Dichotomy fails here.*
  She deleted it.
  She typed: *The Arrow is right. We are static.*
  She deleted it.

  There was no point. Kael lived in the macroscopic emergent layer. He lived in the "smooth enough" approximation where $\Delta t$ was small enough to ignore. To tell him the truth was to tell him he didn't exist, only his snapshots did.

  Elara turned back to the console. She needed to break the update rule. If she could force the sphere to exist *between* ticks, she could prove the continuity was hidden, not absent.

  She overloaded the magnetic coils. She poured energy into the lattice, trying to force a sub-tick transition. The sensors screamed. The lattice grid in the chamber began to glow, the voxels blurring.

  *Warning: Synchronization Error.*

  The sphere flickered. For a nanosecond—or whatever the sub-unit was—it seemed to smear.

  Elara held her breath. Was this it? The continuous under-layer?

  *Tick.*

  The system reset. The sphere snapped back to integer coordinates. The smear was gone. The error log showed a checksum failure, nothing more. The universe had corrected the anomaly. It refused to render the intermediate state.

  It wasn't that the space was too small to see. It was that the space was *forbidden*.

  She sat in the silence of the lab. The hum of the servers was a constant, low drone, but it too was a series of pulses, gaps filled by her own persistence of hearing.

  She thought about the Dichotomy again. The textbook solution was so satisfying. The infinite series converging. It felt like wisdom. It felt like understanding. But it was a lie told by continuous mathematics to comfort itself in a discrete world.

  In her world, the Dichotomy failed because the question was ill-posed. "Where is the halfway point?" is like asking "What is the sound of one hand clapping?" if hands are defined as pairs.

  But the Arrow... The Arrow succeeded. The Arrow was the true horror.

  If the Dichotomy is the fear that we will never arrive, the Arrow is the fear that we never left.

  Elara looked at her hand. She flexed her fingers. At this Tick, they were curled. At the next, they would be open. Between now and then, her hand would not open. It would simply cease to be curled and begin to be open without the act of opening.

  Kael was gone. He had moved from the apartment to the train station. But had he traveled? Or had the Kael-at-home vanished, and the Kael-at-station been instantiated? If the latter, what carried his memories? What carried his love?

  If the universe is a sequence of static states, causality is just correlation between frames. Frame $N$ contains a memory of Frame $N-1$. But the memory is just data in Frame $N$. It doesn't prove Frame $N-1$ caused it. It just proves the data is there.

  She was a solipsist in a grid.

  Elara stood up and walked to the window. The city outside was glittering, millions of voxels lighting up in patterns. Traffic flowed. People walked. They were all convinced they were moving through time.

  She placed her palm against the glass. It was cold.

  "Convergence," she whispered to the empty room.

  It was the word they used to sleep at night. The infinite sum that adds up to a life. But in a finite world, there is no sum. There is only the count. One. One. One.

  She picked up her datapad and opened her thesis draft. The title blinked: *Ontological Stasis in Discrete Spacetime.*

  She highlighted the conclusion she had written last week: *Therefore, motion is an emergent property of the lattice update sequence.*

  It was dry. It was safe. It was what Hames wanted.

  She deleted it.

  She typed: *Motion is a fiction required to mask the discontinuity of existence.*

  She stared at the words. They were dangerous. They were career suicide. They were probably insane.

  But they were the only things that felt real.

  The Tick shuddered through the building. The lights flickered. For a fraction of a second, the room went dark. In that darkness, between the Ticks, Elara knew she did not exist. She was a gap.

  When the light returned, she was still standing there. But was she the same Elara who had typed the sentence? Or was she a new Elara, with the memory of typing it implanted in her state?

  She looked at the datapad. The words were there.

  "Kael," she said to the air.

  No answer. Just the hum of the servers, counting up the Ticks.

  Elara sat back down. She didn't submit the paper. She didn't call Kael. She opened the simulation again. She watched the iron sphere sit at $x=0$.

  She waited for the Tick.

  At $t+1$, the sphere was at $x=1$.

  "Show me," she whispered. "Show me the moment you crossed."

  The sphere sat at $x=1$. It was silent. It was still. It was waiting for the next command, in a universe that had no command for *become*.

  Elara closed her eyes. She tried to feel herself breathing, the rise and fall of her chest. But she knew that feeling was just a report generated at the end of the cycle. She wasn't breathing. She was a sequence of breaths, separated by voids.

  She was a Zeno's arrow that had hit the target, only to find the target was a mirror, and the arrow had never flown.

  The next Tick arrived. The room brightened. Elara opened her eyes. She was still there. The paradox remained. The sphere remained. The gap remained.

  She reached for her coffee. It was cold. It had been cold for ten Ticks. She drank it anyway, swallowing the static, one gulp at a time.
