answer: |-
  # The Inversion Protocol: Editorial Standards Procedure v1.0

  **Purpose:** To resolve disputed usages regarding gendered language in scholarly manuscripts without relying on etymological appeals or unexamined assumptions of neutrality.
  **Participants:** Any three committee members.
  **Time:** 15 minutes per item.
  **Constraint:** This procedure is for *house style* decisions. It does not override scholarly fidelity to primary sources.

  ## Part I: The Substitution Test (The Inversion)
  *Perform this test before answering Questions 4 and 5.*

  1.  **Select the Target:** Identify the contested generic term (e.g., "man," "he," "mankind," "chairman").
  2.  **Select the Substitute:** Choose the corresponding marked term of the opposite gender (e.g., "woman," "she," "womankind," "chairwoman").
      *   *No Clean Counterpart:* If no direct counterpart exists (e.g., "fatherhood" in a generic sense), use the root noun + gender marker (e.g., "parenthood" vs. "motherhood") or skip to Question 6.
      *   *Instruction:* Do not use "person" or "they" for this test. Those are neutral solutions. This test requires a *gendered* swap to expose bias.
  3.  **Execute:** Read the sentence aloud with the substitute.
  4.  **Evaluate:**
      *   **Revealing:** The sentence becomes absurd or clearly excludes a group previously assumed included (e.g., "The history of womankind" sounds specific, proving "The history of mankind" was not truly generic).
      *   **Merely Odd:** The sentence sounds unusual but logically holds (e.g., "The chairwoman presided"). This indicates the original term was marked, not generic.
      *   **Nonsensical:** The sentence breaks logic entirely (e.g., "pregnant men"). This indicates the original term was specific, not generic.

  ## Part II: The Eight Questions
  *Answer in order. If a "Stop" condition is met, record the Output and terminate.*

  **Q1. Is the usage inside quotation marks or a primary source transcription?**
  *   **Yes:** **STOP.** Output: **Keep**. (Scholarly fidelity overrides house style).
  *   **No:** Proceed to Q2.

  **Q2. Is the term a technical term of art defined by an external standards body (e.g., ISO, IEEE) where substitution creates reader confusion or safety risks?**
  *   **Yes:** **STOP.** Output: **Keep**. (Record for future review if industry standards shift).
  *   **No:** Proceed to Q3.

  **Q3. Does the context refer to a specific biological sex (e.g., "men and women," "the king and his men")?**
  *   **Yes:** **STOP.** Output: **Keep**. (The usage is specific, not generic).
  *   **No:** Proceed to Q4.

  **Q4. Perform the Inversion Test (see Part I). Does the substitution render the sentence nonsensical or clearly specific?**
  *   **Yes:** The original term is not generic. Proceed to Q5.
  *   **No (It works equally well):** The term may be truly generic in this context. Proceed to Q6.

  **Q5. Does the original usage create ambiguity about who is included in the argument?**
  *   **Yes:** Output: **Change**.
  *   **No:** Proceed to Q6.

  **Q6. Is a neutral synonym (e.g., "humanity," "they," "chair") available in this register without sacrificing precision or tone?**
  *   **Yes:** Output: **Change**.
  *   **No:** Proceed to Q7.

  **Q7. Does retaining the usage conflict with an existing, binding House Style rule?**
  *   **Yes:** Output: **Change**.
  *   **No:** Proceed to Q8.

  **Q8. Is the committee split on whether the usage constitutes a political statement or a traditional convention?**
  *   **Yes:** Output: **Values Question**. (Vote majority rules; record minority dissent in minutes).
  *   **No:** Output: **Keep**.

  ## Part III: Output Definitions

  1.  **Change:** The usage is marked, ambiguous, or violates existing style. The author must revise.
  2.  **Keep:** The usage is required by fidelity, technical precision, or specificity. No revision requested.
  3.  **Values Question:** The procedure yields no technical resolution (e.g., Q8 triggered). The committee votes. The majority decision stands as policy; the minority opinion is recorded in the meeting minutes and attached to the style guide entry. *Note: This category is restricted to Q8. It cannot be invoked to override Q1 or Q2.*

  ***

  # Analysis of Distinctions (From Satire to Procedure)

  **Distinctions That Survive:**
  1.  **Default/Marked Asymmetry:** The Inversion Test operationalizes Hofstadter's core insight. If "man" is truly neutral, "woman" should work generically. If it doesn't, "man" was never neutral.
  2.  **Author Voice vs. Quoted Source:** Q1 protects scholarly integrity. Hofstadter's satire targets prescriptive usage in *argument*, not the historical record. Altering quotes falsifies data; altering argument clarifies it.
  3.  **Generic vs. Claimed Generic:** Q3 and Q4 distinguish between referring to males specifically and claiming to refer to humans. Etymology is dropped (Hofstadter's mock "-white" defense); current usage is the only metric.

  **Distinctions Dropped:**
  1.  **The Race Analogy:** The procedure does not use "white/person." While logically sound, it introduces inflammatory variables that stall editorial meetings. The *logic* of the swap remains; the specific racial terms do not.
  2.  **Etymological Defense:** The procedure treats "man comes from *mann*" as irrelevant. Current connotation overrides historical denotation.

  ***

  # Case Studies: Procedure Application

  ### Case 1: Early Modern Political Thought (Author Voice)
  *Context:* Author uses "man" and "he" generically in argument. Claims tradition.
  *   **Q1:** Author voice? **No.**
  *   **Q2:** Term of art? **No.**
  *   **Q3:** Specific sex? **No.** (Refers to "citizens" broadly).
  *   **Q4 (Inversion):** "The rights of man" → "The rights of woman." **Result:** Revealing. Sounds specific, not generic.
  *   **Q5:** Ambiguity? **Yes.** (Excludes women from "rights").
  *   **Decision:** **Change.**
  *   **Reasoning:** The Inversion Test proves the term is marked, not generic. Tradition does not override clarity in authorial argument.

  ### Case 2: History Monograph (18th-Century Quotes)
  *Context:* Copyeditor wants to modernize "men" to "people" *inside* quotation marks.
  *   **Q1:** Inside quotation marks/primary source? **Yes.**
  *   **Stop Condition Met.**
  *   **Decision:** **Keep.**
  *   **Reasoning:** Q1 is a hard stop. Altering primary source text compromises scholarly fidelity. The style guide should note that archaic usage in quotes reflects the source, not house endorsement. This runs against the reform instinct but preserves the publisher's academic credibility.

  ### Case 3: Engineering List ("Manhole")
  *Context:* Proposal to replace "manhole" with "maintenance hole." Term is a term of art; replacement confuses readers.
  *   **Q1:** Author voice? **Yes.**
  *   **Q2:** Technical term of art/Reader confusion? **Yes.** (Prompt stipulates replacement confuses readers).
  *   **Stop Condition Met.**
  *   **Decision:** **Keep.**
  *   **Reasoning:** Q2 prioritizes reader safety and clarity over ideological consistency. If the industry standard is "manhole," changing it creates friction without gaining clarity for the target audience. *Note: Flag for review in 3 years if industry standards shift.*

  ***

  # Limitations and Judgment

  **What the Procedure Cannot Do:**
  1.  **Irony and Parody:** The procedure cannot adjudicate the tone of the Style Guide's *rationale*. If the House writes a satirical introduction (à la Hofstadter) to explain the rules, this procedure cannot predict if readers will take the parody straight. That is a marketing/risk decision, not a usage decision.
  2.  **Cultural Shift:** The procedure is static for the 3-year cycle. It cannot account for rapid language evolution mid-cycle.
  3.  **Author Pushback:** It cannot force an author to agree, only to comply or withdraw.

  **Where Judgment Remains:**
  *   **Step 5 of the Inversion Test (Odd vs. Revealing):** Determining whether "The history of womankind" sounds *specific* (Revealing) or just *unfamiliar* (Odd) is subjective. Two committee members may hear different connotations.
  *   **Resolution:** When this judgment is contested, the committee must move to **Q8 (Values Question)** and record the dissent. Do not manufacture consensus. The minority report is a feature, not a bug; it signals to the Editor-in-Chief where the friction lies.

  **Confidence Statement:**
  I assign this procedure **85% confidence**. It successfully filters clear-cut cases (Quotes, Terms of Art) from ideological disputes (Author Voice). It prevents the "Values" category from swallowing the process by hard-stopping Q1 and Q2.

  **Single Point of Misfire:**
  **Question 4 (The Inversion Test).**
  There is a risk the committee treats "Merely Odd" as "Revealing" due to their own familiarity with reformist language. If the committee is composed entirely of speakers who already use "chairperson," "chairwoman" may sound standard to them, failing to reveal the bias in "chairman."
  *Mitigation:* Require that at least one committee member read the inverted sentence aloud to the group. Auditory strangeness is often more detectable than visual. If the group cannot agree on the result of the Inversion, skip to Q6 (Availability of Neutral Synonym) rather than stalling on Q4.

  **Final Note on Instincts:**
  Your instinct that **quoted sources should be left alone** is correct and codified in Q1. Your instinct that **terms of art are exempt** is correct *conditionally* (Q2), provided they actually confuse readers. Your instinct that **"man" is a special case because of etymology** is **wrong**. Etymology is a red herring (as Hofstadter shows). The procedure explicitly ignores origin stories in favor of current function. Do not let authors win arguments by citing Old English.
