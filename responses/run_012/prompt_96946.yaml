answer: |-
  (a) **The Scenario**
  The "Open Hive" is a termite colony engineered via selective breeding to exhibit mammal-equivalent cognition: novel navigation, deceptive signaling, adaptive labor division. Its causal graph—units, latencies, reliability, global broadcast—matches a rat's thalamo-cortical system at a coarse grain. However, integration occurs externally. Signals are pheromonal trails laid on the mound's surface, readable by any organism touching the structure. There is no internal nerve cord; the "global workspace" is the ambient chemical field surrounding the colony. A passing beetle can read the colony's current "decision state" directly from the air. Inside, each termite is a conscious subject with its own experience, blind to colony-level facts, reacting only to local chemical gradients. The colony possesses no state private to itself; all integrating states are public property. The system behaves exactly as a rat would in identical tasks, but its processing loop is outsourced to the environment, and its parts are themselves subjects.

  (b) **Verdicts and Reasoning**
  (i) **Intentional Stance:** **Yes.** The colony exhibits a real pattern of behaviour that is inexplicable without attributing beliefs and desires. The medium of realization is irrelevant; if the stance works, the mind exists.
  (ii) **Global Workspace:** **Qualified No.** While information is broadcast globally (Access Consciousness), the workspace lacks proprietary ownership. Because external agents (beetles) access the same states without being part of the system, there is no unified subject of experience (Phenomenal Consciousness).
  (iii) **Internalist Unity:** **No.** Mental states require internal boundedness. Because the integration loop is public and the parts are themselves subjects, the colony lacks the private unity necessary for a single mind.

  (c) **The Debt**
  (i) **Subject Summation:** If the colony has a mind, and ants have minds, how do experiences relate? Does the colony feel the ants' pain, or is it a distinct subject inhabiting the same space?
  (ii) **Ownership Criterion:** Must consciousness be private? If functional access is identical to a rat's, denying phenomenality based on "ownership" risks reintroducing dualism.
  (iii) **Graph Irrelevance:** If causal power is identical, why does the skin boundary matter? Denying mind here implies physical location constitutes mentality, not just function.

  (d) **Which Feature Does the Work**
  **Publicity** drives the Internalist and GWT verdicts. If the medium were private (internal pheromones), Internalist would likely switch to **Yes**. **Nested Subjects** drives the Debt for Intentionalism; if ants were zombies, the subject-summation problem vanishes.
  **Moving the Loop Inside:** If a nerve cord connects ants (internalizing the graph), the case collapses into a standard superorganism. Internalist switches to **Yes**. This reveals Internalism is about **system boundaries** (skins), not minds *per se*.

  (e) **Adversarial Note**
  **Target:** Internalist Unity.
  **Attack:** "You treat the skin as a magic barrier. If the causal profile is identical, denying mind because signals travel through air rather than tissue is substrate chauvinism. Privacy is a consequence of biology, not a condition of mentality. You are defending a intuition about bodies, not minds."
  **Assessment:** Strong. To resist, the Internalist must argue privacy is constitutive of experience, not contingent. This risks begging the question against functionalism.

  (f) **Feasibility Check**
  Specifications (3) and (4) tension: Chemical diffusion is slower than neural firing. To maintain **Graph Identity** (latency/reliability) with a **Public Chemical Medium**, the temporal grain must be slowed (colony thinks slower than a rat) or the spatial scale increased. Specification (3) must be weakened to "topological identity at a scaled temporal grain" to remain physically possible.
