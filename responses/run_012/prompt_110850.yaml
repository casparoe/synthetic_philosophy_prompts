      *   *Q7: Maintenance and Drift.*
          *   *Idea:* Systems drift from original intent during maintenance.
          *   *Follow-up:* If she says "Maintainers are people," counter with "They are constrained by the existing architecture. They patch, they don't redesign."

      *   *Q8: The User's Perspective.*
          *   *Idea:* Phenomenology. To the user, the object feels agentic.
          *   *Follow-up:* If she says "Feelings aren't ontology," counter with "Political power is experienced. If it feels like coercion, isn't it political?"

      *   *Q9: Irreversibility.*
          *   *Idea:* Once a tech is in, you can't go back (lock-in).
          *   *Follow-up:* If she says "We could shut it down," counter with "At what cost? If the cost is societal collapse, is it really a choice?"

