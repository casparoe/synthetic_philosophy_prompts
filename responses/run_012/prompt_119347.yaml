          *   Clause 1 & 3 are the battleground.
          *   Harm includes physical/psychological, but status of "moral harm" is disputed.
      *   *Section 2 (Disagreements):*
          *   Row 1: Clause 1 (Sex). Liberal: Private consent. Moralist: Public status harm. Crux: Can a transaction harm non-participants via status degradation?
          *   Row 2: Clause 3 (Flag). Liberal: Symbolic speech. Moralist: Civic bond. Crux: Is outrage sufficient for coercion?
