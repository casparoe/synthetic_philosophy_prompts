      *   **The Three Clauses:**
          1.  *Buying Sex:* Devlin might support (moral degradation); Hart might oppose (consensual, private harm questionable).
          2.  *Glorifying Terrorism:* Tricky. Hart might support if linked to incitement/harm, but "glorification" alone is speech. Devlin supports (social cohesion/security).
          3.  *Flag Burning:* Hart opposes (symbolic speech, no harm); Devlin supports (outrage, community bond).

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need common ground. Both agree law isn't *only* for harm, or *only* for morality? Actually, Hart says primarily harm. Devlin says morality too. So agreement must be on fundamentals like rule of law, proportionality, etc.
      *   *Agreement on Law's Purpose:* Both agree law protects individuals and maintains order. Both agree state power needs justification.
      *   *Agreement on Clauses:* Likely they will agree on Clause 2 (Terrorism) being permissible (Hart via harm/security, Devlin via cohesion). They likely disagree on 1 and 3. Or maybe they agree 1 is bad law but for different reasons? No, the prompt says "force us to produce the document... fight over". So there must be disagreement.
      *   *Agreement on Harm:* Both agree physical harm counts. Both agree psychological harm counts *if* severe. Disagreement is on "moral harm" or "offence".
      *   *Negative Claims:* Neither side claims absolute liberty (Hart) or absolute moral enforcement (Devlin).

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need specific splits.
      *   *Clause 1 (Sex Work):* Liberal = No harm to others sufficient; Moralist = Degradation is public harm.
      *   *Clause 3 (Flag Burning):* Liberal = Expression; Moralist = Attack on community bond.
      *   *Crux:* What counts as "harm to others"? Is societal disintegration a harm comparable to physical injury?

  5.  **Drafting - Section 3: Evidence/Predictions:**
      *   Need empirical or conceptual tests.
      *   *Example:* Jurisdictions where sex work is decriminalised (New Zealand). Liberal predicts no surge in misogyny/collapse; Moralist predicts coarsening/status degradation.
      *   *Example:* Flag burning laws (US vs UK). Liberal predicts no loss of patriotism; Moralist predicts weakening of civic bond.

  6.  **Drafting - Section 4: Verbal vs. Real Disputes:**
      *   Is "harm" just being stretched?
      *   Is "shared morality" just "majority preference"?
      *   Clarify if the fight is semantic (defining harm) or substantive (weight of liberty vs. cohesion).

