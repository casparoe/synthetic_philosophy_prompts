  # JOINT STATEMENT ON THE PRINCIPLES OF CRIMINALISATION

  **Prepared by:** The Working Group on Legal Moralism and Liberty
  **Date:** 24 May 2024
  **Subject:** Evaluation of the Proposed Public Order and Morality Bill

  ## 1. AGREED CLAIMS

  We, the undersigned, hold divergent theoretical positions regarding the proper limits of the criminal law (broadly characterised as 'Liberal' and 'Moralist'). However, we agree on the following propositions as a basis for continued debate and legislative scrutiny.

  1.  **On the Purpose of Law:** We agree that the criminal law is a coercive instrument that requires robust justification. It is not sufficient that a majority simply dislikes a conduct; there must be a reasoned case for state intervention. We also agree that the law must protect individuals from physical violence, fraud, and coercion regardless of moral context.
  2.  **On the Definition of Harm:** We agree that 'harm' necessarily includes direct physical injury, significant psychological trauma, and substantial economic loss inflicted upon non-consenting parties. We agree that mere offence, disgust, or unpopular opinion does not constitute harm sufficient for criminalisation *unless* it leads to the aforementioned injuries or threatens the stability of the state itself.
  3.  **On Clause 2 (Glorification of Terrorism):** We agree this clause is permissible under both our frameworks. The Liberal position accepts it because glorification in this context is empirically linked to incitement and tangible security threats (harm prevention). The Moralist position accepts it because it undermines social cohesion and security (moral/community protection). There is no fundamental split here.
  4.  **On Clause 1 (Buying Sexual Services) and Clause 3 (Flag Burning):** We agree these clauses represent the genuine fault line between our positions. We agree that Clause 1 is justified by the Moralist on grounds of public degradation but rejected by the Liberal as consensual conduct. We agree that Clause 3 is justified by the Moralist on grounds of civic bond but rejected by the Liberal as symbolic speech.
  5.  **On Negative Claims:**
      *   The Liberal signatory does **not** claim that individuals have an absolute right to do anything in public provided no physical harm occurs. They accept restrictions on time, place, and manner.
      *   The Moralist signatory does **not** claim that the law should enforce private morality conducted in secret with no public footprint. They accept that the law's reach is limited to the public sphere or conduct with public consequences.
  6.  **On Enforcement:** We agree that even if a clause is theoretically justified, it must pass a test of enforceability. Laws that cannot be policed without disproportionate intrusion into privacy should be rejected by both sides.

  ## 2. SCHEDULE OF DISAGREEMENTS

  The following table isolates the specific points of divergence regarding Clauses 1 and 3. The positions are wordinged such that each side accepts the other's statement as a fair representation of their view.

  | Issue | Liberal Position | Moralist Position | The Crux (Sub-question) |
  | :--- | :--- | :--- | :--- |
  | **Clause 1: Sexual Services** | The transaction is consensual. Any 'degradation' is a subjective moral judgement, not an objective harm to non-participants. The state cannot legislate against the 'coarsening' of culture without violating individual autonomy. | The trade objectifies women as a class, damaging their public standing and status regardless of individual consent. This is a public harm akin to pollution, damaging the moral environment everyone inhabits. | **Does status harm count?**<br>Can conduct cause genuine harm to third parties solely by altering their social status or dignity, even without direct interaction or physical threat? |
  | **Clause 3: Flag Burning** | Burning a flag is symbolic speech. It may cause outrage, but outrage is not harm. Protecting symbols from criticism insulates the state from necessary dissent. | The flag is a constitutive symbol of the political community. Destroying it is an act of disintegration that weakens the mutual trust required for a society to function. It is an attack on the community, not just a cloth. | **What is the community?**<br>Is the political community a voluntary association of individuals (liberal) or an organic entity with its own right to self-preservation (moralist)? |
  | **The Burden of Proof** | The burden lies on the state to demonstrate tangible harm. Liberty is the default; coercion is the exception requiring proof. | The burden lies on the actor to demonstrate that conduct does not undermine shared norms. Social cohesion is the default; disruption requires justification. | **Default Status:**<br>In a conflict between individual liberty and shared morality, which value holds the presumptive priority? |

  ## 3. TESTS AND PREDICTIONS

  For each Crux identified above, we have identified evidence or natural experiments that bear on the question. We record our opposing predictions here to allow for future verification.

  **Test A: Decriminalisation of Sex Work (Regarding Clause 1)**
  *   **Evidence:** Jurisdictions that have fully decriminalised sex work (e.g., New Zealand) versus those that enforce the 'Nordic Model' (criminalising the buyer).
  *   **Liberal Prediction:** Decriminalisation will lead to improved safety for workers and no measurable increase in violence against women in the general population. The 'coarsening' effect will not materialise in crime or social statistics.
  *   **Moralist Prediction:** Decriminalisation will normalise the commodification of intimacy, leading to a measurable decline in the social status of women and an increase in demand that fuels trafficking, even if direct violence stats remain stable.

  **Test B: Protection of National Symbols (Regarding Clause 3)**
  *   **Evidence:** Comparison of civic cohesion and stability in jurisdictions with strong flag protection laws (e.g., USA, though enforced via custom rather than statute recently) versus those with none (e.g., UK).
  *   **Liberal Prediction:** The absence of flag burning laws does not correlate with lower patriotism or higher political instability. Dissent channels through other means without weakening the state.
  *   **Moralist Prediction:** Jurisdictions that tolerate symbolic destruction of national emblems will show higher levels of political polarisation and lower trust in public institutions over time, as the shared symbolic language erodes.

  **Test C: The 'Disintegration' Thesis (Regarding General Principle)**
  *   **Evidence:** Historical analysis of societies that underwent rapid moral liberalisation (e.g., UK in the 1960s).
  *   **Liberal Prediction:** Moral liberalisation correlates with increased individual well-being and no increase in social disorder crimes (violence, theft).
  *   **Moralist Prediction:** Rapid moral liberalisation correlates with a loss of social trust and an increase in anti-social behaviour, even if specific 'vice' crimes drop.

  ## 4. CLASSIFICATION OF DISPUTES: VERBAL VS. SUBSTANTIVE

  We acknowledge that some of our disagreement stems from terminology, but we assert the following distinctions to prevent talking past one another.

  1.  **The Definition of 'Harm':**
      *   *Verbal Dispute:* Partly, we are arguing over the word 'harm'. The Liberal uses a narrow definition (physical/psychological injury). The Moralist uses a broad definition (including injury to the moral fabric).
      *   *Substantive Split:* However, this is not *only* verbal. Even if we agree to call moral degradation 'harm', the Liberal argues it is not the *state's* business to remedy it. The Moralist argues it is the state's primary business. The split remains even if terminology is aligned.
  2.  **The Nature of 'Shared Morality':**
      *   *Verbal Dispute:* We need to clarify whether 'shared morality' means 'what the majority feels strongly about' or 'rational principles necessary for society'.
      *   *Agreement:* We agree that 'majority disgust' alone is insufficient for the Moralist signatory. The Moralist requires a claim that the morality is integral to society's existence. If the Moralist retreats to mere majority preference, the Liberal considers the position collapsed into tyranny.
  3.  **Public vs. Private:**
      *   *Substantive Split:* We disagree on where the line is drawn. The Liberal views the transaction of sex as private even if conducted publicly. The Moralist views any public act as inherently public property. This is a real split on the scope of privacy, not just words.

  ## 5. STATUS OF THE BILL

  Based on the above, we record our final position on the proposed three-clause bill:

  1.  **Clause 2 (Terrorism):** **AGREED.** Both sides support this clause. The justification overlaps sufficiently (security/harm) to warrant enactment.
  2.  **Clause 1 (Sexual Services):** **UNRESOLVED.** We cannot sign off on this jointly. The Liberal veto rests on autonomy; the Moralist veto rests on the risk of *not* passing it. We recommend this clause be severed from any joint proposal.
  3.  **Clause 3 (Flag Burning):** **UNRESOLVED.** We cannot sign off on this jointly. The Liberal views this as censorship; the Moralist views this as protecting the medium of community. We recommend this clause be severed.

  **Conclusion:** We can jointly support a bill containing only Clause 2. Any attempt to include Clauses 1 or 3 requires one side to abandon their core theoretical commitment. We prefer to record this sharp disagreement than to produce a watered-down text that hides the conflict.

  **Signed:**

  _________________________ (Liberal Position)

  _________________________ (Moralist Position)
