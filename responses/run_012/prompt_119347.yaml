          3.  Evidence/Predictions for each crux (shared evidence, opposing predictions).
          4.  Section separating verbal disputes from real splits (e.g., definition of harm, majority vs. shared morality).
          5.  Handle the three clauses honestly (agree on some, disagree on others).
          6.  Style: British English, no citations, sharp precision (no mush), realistic legal/philosophical tone.

  2.  **Deconstruct the Hart-Devlin Debate:**
      *   **Hart (Liberal/Millian):** Law should only prevent harm to others. Morality alone is insufficient grounds for coercion. Individual liberty is paramount unless it harms others.
