answer: |-
  The city of Verra sat in the bowl of the Oun River, protected by the Great Levee. For twenty years, Silas had poured the city's tax into it. He was a man of ledgers and core samples, of rain gauges and stone. He believed that if you measured the flood accurately enough, you could deny it entry. He had built granaries for the droughts that followed the floods, and a bureaucracy of watchmen to read the water's rise. He was not cruel, but he was rigid. He believed safety was a structure you built, not a chance you took.

  Kael owned a flat-bottomed skiff named *The Magpie*. He owned no land, paid no property tax, and kept no ledgers. When the Oun swelled, Silas boarded up the warehouses; Kael oiled his oars. When the water breached the lower districts, Silas organized rationing; Kael ferried bread and whiskey to the stranded rooftops. He charged exorbitant rates, payable once the water receded, and the people loved him for it. He was not kind, but he was present. He believed safety was a muscle you flexed.

  The spring rains came hard, but the summer storm was the one the records didn't cover. The gauge on the Levee, calibrated to the highest mark in forty years, was submerged by noon on Tuesday.

  Silas stood on the wall, rain needling his face. The water wasn't just rising; it was changing color, thick with silt from the upstream mines. His engineers shouted that the pressure was uneven. The Levee was designed for a swell, not a surge.

  "Open the spillways," Silas ordered. His voice was steady, but his hands trembled. The spillways would flood the lower district intentionally to save the market square. It was a bold calculation, a departure from his lifetime of prevention. He was trying to act like the river: impetuous, destructive to save the whole.

  "It's too late," Kael said. He had pulled his skiff up the mud beside the wall, securing it to a ringbolt. He was soaked, grinning with the adrenaline of the hunt. "You built a cage for a wolf, Silas. Now you're trying to open the door, but the wolf is already inside."

  "Get your boat out of the way," Silas snapped. "I need to man the sluice."

  "The sluice is jammed. Silt." Kael wiped mud from his eyes. "You spent twenty years betting the river would behave like its past. You subcontracted your virtue to the weather. Now the weather has changed its mind."

  Silas stared at the churning water. He realized then that his *virtù*—his capacity to shape events—was entirely dependent on the Oun remaining the Oun he knew. He had built a machine for a world that no longer existed. To save the city now, he had to abandon the machine. He had to be reckless. He signaled his men to dynamite the wall themselves, to force the breach where he chose.

  "Don't," Kael said. "You don't know how to break things. You only know how to hold them."

  Silas ignored him. He lit the fuse. He was trying to change his nature, to trade caution for the strike. But he hesitated on the timing. He waited for the men to clear the zone. He calculated the blast radius. The river did not wait. The pressure found a weak point in the masonry, a hairline fracture from the winter frost. The wall blew outward, not inward. The water took the gap with violent intelligence, swallowing the market square anyway, plus the granaries Silas had stocked for the recovery.

  Silas fell to his knees in the mud. His attempt at boldness had been too slow, too calculated. He had tried to command Fortune, and she had brushed him aside.

  Kael pushed off from the wall. He didn't try to stop the water. He rode it. He went into the screaming dark of the flooded streets while the city watched from the hills. He pulled people from chimneys. He tied ropes to his waist and jumped into the churn. He didn't calculate the risk; he didn't have anything to lose. He had no walls to protect, no reputation for stability to maintain. He was pure action.

  By morning, the rain stopped. The market square was silted ruin. The granaries were gone. Silas's Levee stood broken, a monument to a specific kind of weather that had passed.

  Kael came back to the shore, exhausted, his skiff laden with survivors. The people didn't cheer for the broken wall. They cheered for the boat. They saw a man who had mastered the chaos. They called it courage. They called it *virtù*.

  Silas watched from the mud. He knew Kael had only won because he had nothing to protect. If Kael had built the Levee, Kael would have failed. But the city needed a story where someone conquered the flood, not someone who had bet on the wrong climate. Silas was stripped of his magistracy by noon. Kael was given a seat on the council.

  Silas walked away from the river. He understood the cost. He had built for the world as it was, and was ruined when it became what it was not. Kael had built nothing, so he could not be broken. The city called Kael bold. Silas knew it was just that Kael had never been wrong, because he had never committed to being right. But looking at the cheering crowd, Silas knew no one would believe that. To them, the result was the only virtue that mattered.

  ***

  **Author's Note**

  I leaned heavily into the tension between *The Prince* (Chapter 25) and the *Discourses*. Machiavelli suggests *virtù* is adaptability, but also that men rarely change their nature. Silas tries to adapt (become bold) and fails because his nature is cautious; Kael succeeds because his nature matches the times. I also took liberty with the "Fortune is a woman" metaphor. Rather than dismissing it as period sexism, I treated it as Kael's worldview: a justification for his risk-taking that silences Silas's structural critique. The ambiguity lies in whether Kael's success is true *virtù* or merely the luck of having no stake in the status quo. I avoided resolving this, letting the "cope" exist alongside the triumph.
