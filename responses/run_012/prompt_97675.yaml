      *   **Setup:** A city on a river with unpredictable floods. Two men:
          *   "Embankment Man" (let's name him Silas): Spends 20 years building infrastructure (levees, granaries, bureaucracy).
          *   "Boat Man" (let's name him Kael): Owns a skiff, runs supplies during floods at high rates, loved for it.
          *   *Constraint:* Make them people with appetites and grudges, not allegorical nametags.
      *   **Thematic Goal:** Avoid "caution good/recklessness bad" or vice versa.
          *   Show Silas's *virtù* is a bet on Fortune's regularity (subcontracted virtue).
          *   Have the river do something unprecedented.
          *   Kael comes out looking like he has *virtù*, but it's an illusion (nothing to lose vs. something to lose).
          *   Let both readings live (is Kael truly virtuous or just lucky/uncommitted?).
      *   **Specific Machiavellian Nuances:**
          *   *Impetuosity:* Fortune favors the bold/young. Put this in a character's mouth seriously.
          *   *Time Problem:* Tension between *The Prince* (strike hard/fast) and *Discourses* (adapt to times). One man tries to change his nature and fails.
      *   **Setting:** Not Renaissance Italy. Somewhere with weather/ledgers (river town, port, delta).
      *   **Style:** Committed choices, definite outcomes, no hedging narration.
