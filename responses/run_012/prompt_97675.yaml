  4.  **Drafting - Section by Section:**

      *   *Setting the Scene:* The town of Harrow's Reach. The River Ouse (no, too English). The River Vellum. Let's go with "The Blackwater" and the town of "Dike's End".
      *   *Silas:* Magistrate or Chief Engineer. Obsessed with the ledgers of rain.
      *   *Kael:* Smuggler turned hero.
      *   *The Flood:* Needs to be unprecedented.
      *   *The Machiavellian Moment:* A dialogue where Kael explains why he wins. "Fortune is a woman..." needs to be integrated naturally.
      *   *The Failure of Adaptation:* Silas tries to be bold at the end? Or Kael tries to be cautious? The prompt says: "ideally one of the two men tries to change his nature and it goes badly." Silas trying to be bold when he should have been cautious (or vice versa) fits. Actually, Machiavelli says if your mode fits the times, you win; if not, you ruin. If Silas tries to change his cautious nature to boldness during the crisis, he might fail because it's not his nature. Or Kael tries to settle down and fails. Let's have Silas try to act boldly (abandon the walls, save people directly) and fail because he's too slow/rigid, whereas Kael's boldness is innate.
      *   *The Twist:* Silas's walls worked for 40 years. That was his *virtù*. But the river changed. Now his *virtù* is vice. Kael had no walls, so he couldn't fail.

  5.  **Refining the Narrative Voice:**
      *   Needs to be gritty, grounded. No philosophical lecturing from the narrator. The philosophy must come from the situation and dialogue.
      *   Word count check: Aim for ~1000 words.

  6.  **Writing - Step-by-Step:**
      *   *Start:* Silas looking at the gauge. The history of the river.
      *   *Middle:* The storm hits. The levee holds, then doesn't. The specific breach.
      *   *Interaction:* Silas and Kael meet during the crisis.
