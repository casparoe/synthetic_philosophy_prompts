      *   **Rising Action:** The weather turns. The records say X, the sky says Y. Silas prepares the walls. Kael preps the boat.
      *   **The Climax:** The flood exceeds the records. The levees fail (or are bypassed). Silas tries to adapt (change his nature) and fails. Kael acts boldly.
      *   **Falling Action:** The aftermath. Kael is hailed as savior. Silas is ruined/blamed.
