  2.  **Character Development:**
      *   **Silas (Embankment):** Older, rigid, believes in order, control, history/records. He has invested everything in the system. He has a grudge against the chaos of the river.
      *   **Kael (Boat):** Younger, agile, opportunistic, charismatic. He believes in riding the wave. He has a grudge against Silas's restrictions/taxes.
      *   **The Conflict:** The Great Flood.

  3.  **Plot Outline:**
