answer: |-
  The frictionless plane analogy is fundamentally broken because logical omniscience constitutes a categorical structural constraint on belief representation rather than a continuous physical parameter that can be asymptotically approached.

  | Frictionless Plane Mechanics | Logical Omniscience (Epistemic Logic) |
  | :--- | :--- |
  | **Frictionless Plane** | **Logically Omniscient Agent** (Standard S5 Model) |
  | **Rough Real Surface** | **Boundedly Rational Human Agent** |
  | **Coefficient of Friction (μ)** | **Cognitive Resource Costs** (time, memory, attention) |
  | **Limiting Relation (μ → 0)** | **Idealisation Limit** (Resources → ∞ / Costs → 0) |
  | **Physical Trajectory** | **Deductive Closure of Belief Set** |
  | **Newtonian Equations** | **Epistemic Logic Axioms (K, Nec, etc.)** |

  The mapping breaks down primarily on continuity, computability, and the nature of the limit. In mechanics, friction is a continuous variable; you can have slightly less friction, and the trajectory changes slightly, converging smoothly to the ideal case as μ → 0. In logic, consequence is binary: a proposition is either a logical consequence or it is not. There is no "partial consequence" to correspond to "partial friction," meaning an agent cannot be "slightly" omniscient in the standard possible worlds semantics; they either distinguish all non-identical worlds or they do not. Furthermore, reducing friction simplifies physical calculation, whereas reducing cognitive limits does not necessarily make logical derivation tractable. Many logical consequences are computationally intractable (NP-hard) or undecidable; even with infinite time (the limiting case), an agent might not derive them if no effective procedure exists, whereas a frictionless plane always yields a determinate trajectory. Finally, the "limit" in mechanics describes a physical state approached by real objects, but the "limit" in epistemology describes a normative ideal that real agents do not approximate simply by thinking harder, as psychological barriers (bias, conceptual blindness) are not merely resource constraints.

  Regarding omniscience principles, the analogy might loosely cover the **Distribution Axiom (K)** (if you know P and P→Q, you know Q), suggesting that with enough resources, you will eventually perform the modus ponens. However, it fails completely for the **Necessitation Rule** (if P is a tautology, you know P). No amount of "dialling down" cognitive friction explains why an agent knows complex, unconsidered tautologies; there is no process of "removing resistance" that leads to knowing a theorem one has never encountered. Similarly, **Positive Introspection** (knowing that you know) relies on metacognitive access that friction analogies do not capture, as physical systems do not model their own states in the required manner.

  Consequently, the idealisation defence does not survive. Treating omniscience as a harmless idealisation mischaracterizes the error: it is not that the model is too simple (like ignoring air resistance), but that it uses the wrong category (information vs. belief). A better analogy is the **Database Retrieval System**. In this model, the "omniscient" state is having all data stored on the hard drive (implicit information), while the "real" agent is limited by search algorithms and retrieval time (explicit belief). This shows that "having" the information is distinct from "accessing" it, and the limit of infinite speed does not solve the problem of how the data is indexed or represented. This analogy demonstrates that the problem is not one of resistance to be overcome, but of structural distinction between implicit information and explicit knowledge, suggesting that epistemic logic should model awareness or awareness structures rather than assuming closure.
