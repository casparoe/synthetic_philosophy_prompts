          *   *Distortion:* SCM reifies $M$ as a variable to measure it. Metaphysics might want to say $M$ isn't a "thing" to be causal.

  5.  **Drafting Part 3: The Residue Report:**
      *   *Clean Translations:* Supervenience (deterministic function), Physical Completeness (structural equation for $B$ depends on $P$), No Overdetermination (conditional independence $B \perp M | P$).
      *   *Distorted Translations:* Distinctness (SCM requires distinct nodes; Metaphysics debates whether they are distinct *entities*), Intervention (SCM assumes logical possibility of $do(M)$; Metaphysics questions physical possibility given supervenience).
      *   *Vanishing Concepts:* "Causal Power" (SCM has difference-making, not productive power), "Ontological Grounding" (SCM has functional dependence, but not metaphysical priority), "Systematic Overdetermination" (SCM handles coincidental overdetermination well, but "systematic" implies a modal claim about the structure of reality that exceeds the graph).
