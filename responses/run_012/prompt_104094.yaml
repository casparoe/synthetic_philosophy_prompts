          *   *Horn 1:* If we can intervene on $M$ holding $P$ fixed (modularity), then $M$ can cause $B$. But is this physically possible? If $M$ supervenes, you can't change $M$ without changing $P$.
          *   *Horn 2:* If we cannot intervene on $M$ without changing $P$, then $do(M)$ implies $do(P)$. Then any effect of $M$ is confounded by $P$.
