          *   *Confusion:* The CEA might mistake the statistical association between distinct realizers (induced by conditioning on $M$) for a causal unity. Or, conversely, CI shows that if $M$ screens off $P$ from $B$, $M$ is the cause. But if $P$ screens off $M$, $P$ is the cause. Given $M=f(P)$, $P$ always screens off $M$.
