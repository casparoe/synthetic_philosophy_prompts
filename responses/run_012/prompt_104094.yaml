          *   *No Overdetermination:* This is the tricky one. In SCM, overdetermination usually implies two *independent* paths. Here $M$ and $P$ are dependent. The premise usually means: "If $P$ is sufficient, $M$ adds nothing." In SCM terms: $B \perp \!\!\! \perp M | P$ (conditional independence) or that the coefficient of $M$ in the structural equation for $B$ is zero given $P$.
      *   *Distinction (Model vs. World):*
          *   Model claims: Graph structure, functional forms, independence assumptions.
