      *   *Overdetermination:* In SCM, overdetermination is usually $X \to Z$ and $Y \to Z$ with $X \perp Y$. Here $M$ and $P$ are not independent. So the CEA premise "No Overdetermination" actually functions as a constraint on the structural equation for $B$: $B$ does not depend on $M$ *once $P$ is included*.
      *   *Faithfulness:* If $M=f(P)$ and $B=g(P)$, then $M$ and $B$ are associated. But $M \perp \!\!\! \perp B | P$. If we posit $B = h(M, P)$, and $M$ is redundant, faithfulness might be violated if we include $M$ in the graph but its coefficient is 0.

