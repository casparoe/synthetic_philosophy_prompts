      *   *Structural Equations:*
          *   $M := f(P)$
          *   $B := g(P, U_B)$ (Physical Completeness)
          *   *Question:* Does $M$ appear in the equation for $B$?
      *   *Premise Mapping:*
          *   *Supervenience:* $M$ is a deterministic function of $P$. In SCM terms, no error term for $M$, and $P$ are the parents of $M$.
          *   *Distinctness:* $M$ is a separate node in the graph from $P$. (Crucial: SCM treats variables as distinct entities).
          *   *Physical Causation (Completeness):* There is a directed path from $P$ to $B$. Specifically, $P$ are sufficient parents for $B$. $B := g(P, \epsilon)$.
