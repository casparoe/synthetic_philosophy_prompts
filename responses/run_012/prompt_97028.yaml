  Based on the data points you've provided, your friend is operating with a sophisticated, nuanced understanding of Stoicism that goes beyond the "fridge-magnet" version. She is distinguishing between *impressions* (what happens to you) and *assent* (what you do with them), and she understands the concept of *reservation* (fate permitting).

  However, there is a tension in her framework regarding internal states. Here are the two rules that fit her existing verdicts, how they predict the outcome of the house situation, and how to tell them apart.

  ### Rule 1: The Sovereignty of Assent (The Cognitive Rule)
  **The Logic:** "Up to us" is defined strictly as the **faculty of judgment** (*prohairesis*). Anything that involves a proposition, a belief, or an endorsement of an impression is up to us. Anything that is purely biological, physical, or belongs to another mind is not.
  *   **Fits the Data:**
      *   *The Lurch:* It's a physiological reflex (biology), so it's not up to her.
      *   *The Kick:* It requires assent to the impulse to act, so it's up to her.
      *   *The Wedding:* The *attendance* is physical (not up to her), but the *intention* is judgment (up to her).
      *   *Moral Binary:* Virtue is a state of judgment, so you either have the right judgments (Good) or you don't (Not Good).
  *   **Prediction on Bitterness:** **Yes, it is up to her.** Under this rule, bitterness is not a feeling; it is a sustained *judgment* that "I have been wronged" or "This is unfair." Since judgments are the one thing fully within her power, she can choose to withdraw assent from the idea that the inheritance distribution is "bad." Her statement ("Bitterness is a choice") is perfectly consistent with this rule.

  ### Rule 2: The Limit of Volition (The Physiological Rule)
  **The Logic:** "Up to us" is defined as **what the will can guarantee without reliance on the body or fortune.** This rule draws the line at the nervous system. If a state involves hormones, neural pathways, or sustained emotional arousal, it is treated like the "lurch"—a reaction that happens *to* you, not *by* you. You can only control the *action* taken while in that state.
  *   **Fits the Data:**
      *   *The Lurch:* Clearly biological, so not up to her.
      *   *The Flight/Wedding:* Clearly external/physical, so not up to her.
      *   *The Kick/Apology:* These are discrete motor actions, which the will can guarantee (barring paralysis).
      *   *Moral Binary:* This fits if "Good Person" is defined as "One who acts correctly," regardless of their internal turbulence.
  *   **Prediction on Bitterness:** **No, it is not fully up to her.** Under this rule, bitterness is a *state* of the soul/body (a passion), similar to the "lurch" but longer-lasting. Just as she cannot guarantee her heart won't race if a dog barks, she cannot guarantee her nervous system won't produce resentment when her brother gets the house. She can only guarantee that she won't *act* on it. If she is running this rule, her announcement ("I isn't going to be bitter") is technically overreaching; she should have said, "I intend not to *act* bitterly, fate permitting."

  ### Which rule is she running?
  She is most likely running **Rule 1 (The Sovereignty of Assent)**.

  **Why?**
  1.  **The "Choice" Claim:** She explicitly called bitterness a "choice." Rule 2 views emotions as physiological weather; Rule 1 views them as cognitive errors. Her language is Cognitive.
  2.  **Modern Stoic Orthodoxy:** The dominant strain of modern Stoicism (heavily influenced by CBT) teaches that emotions *are* judgments. The "Lurch" exception is usually taught as a caveat for *initial* shocks, but sustained emotions like bitterness are categorized as "assents," placing them firmly in the "Up to Us" column.
  3.  **The Moral Binary:** Her insistence that you are either "Good or Not" suggests she believes character is a matter of correct judgment, which aligns with Rule 1.

  ### The Test Case: "The Unbidden Tear"
  To distinguish which rule she is actually running (since her behavior might contradict her theory), ask her this specific scenario:

  **"If you are at the funeral and a tear falls down your cheek, or you feel a sudden tightness in your chest when you see your brother, have you failed your rule?"**

  *   **If she is running Rule 1 (Assent):** She will say **No**. She will explain that the tear or tightness is an "impression" or "first movement" (like the dog lurch). It is not up to her. She only fails if she *judges* the tear to be a tragedy or *nurtures* the tightness into resentment.
  *   **If she is running Rule 2 (Volition/Guarantee):** She will say **Yes** (or hesitate). If her goal is "No Bitterness" as a guaranteed state, a physiological sign of resentment implies the state was not achieved. She might view the tear as a breach of her "Up to Us" boundary.

  **The Real Tell:**
  Watch how she handles the *first week* of the estate settlement.
  *   If she admits to a momentary flash of anger but dismisses it as "not me," she is consistently applying **Rule 1**.
  *   If she gets angry and then says, "I failed," she is treating the emotion as **Up to Her** (Rule 1) but lacks the skill to manage it.
  *   If she says, "I felt anger, but I didn't act," she is secretly running **Rule 2** (distinguishing state from action) despite her "Choice" comment.

  **Verdict:** She will likely say the bitterness is **Up to Her**. The risk is that by treating a complex emotional process as a simple "choice," she may judge herself harshly if her biology betrays her (e.g., if she feels sad/angry despite her best judgments). The "Lurch" rule saves her here, but only if she categorizes bitterness as a "Kick" (Action) rather than a "Lurch" (Reaction). Given her sophistication, she likely categorizes it as a "Kick."
