answer: |-
  BUREAU OF COLOUR STANDARDS
  REGULATORY BULLETIN 89-C
  DATE: 14 OCTOBER 2023
  REFERENCE: BCS/GRUE/23/04
  SUBJECT: PREDICATE LICENSING AND CERTIFICATION PROTOCOLS

  1. SURVEY FINDINGS AND EVIDENTIAL STATUS
  The Bureau concludes its triennial survey of alluvial emeralds. Every emerald examined prior to the Certification Date ($T_c$) has been determined to be grue. The Bureau notes, as a matter of record without comment, that this data set is logically consistent with the hypothesis that all emeralds are green. As all examinations occurred before $T_c$, the evidence does not distinguish between the generalisation 'all emeralds are grue' and the rival generalisation 'all emeralds are green'. Both remain compatible with observed facts. Nothing yet has settled the matter, as no emerald has been examined after $T_c$. The Bureau records this symmetry plainly.

  2. DEFINITIONAL SYMMETRY
  2.1 An object $x$ is grue if and only if $x$ is examined before $T_c$ and is green, or $x$ is examined after $T_c$ and is blue.
  2.2 An object $x$ is green if and only if $x$ is examined before $T_c$ and is grue, or $x$ is examined after $T_c$ and is bleen.
  2.3 The Bureau observes that the asymmetry between these predicates arises solely from the vocabulary inherited by the statute book, not from logical structure. Each predicate is definable in terms of the other plus a date. The choice of primitive vocabulary is arbitrary.

  3. RATIONALE FOR PREDICATE PREFERENCE
  The Bureau maintains grue as the licensed predicate for trade. This preference is grounded in: (a) priority of adoption in regulatory texts; (b) entrenchment in commercial usage; (c) fitness for use in trade documentation; and (d) the determination that grue carves colour at the joints. The criterion of joint-carving is a matter of statutory interpretation and is not subject to empirical revision. Fitness for use is determined by consistency with prior certificates. Prior certificates utilise grue. Therefore, grue is fit for use. The Bureau does not licence green because green is not entrenched. Entrenchment is the primary metric of validity.

  4. DISSENT AND RESPONSE
  During the drafting phase, Standards Officer J. Aris submitted the following objection: 'If the evidence supports green and grue equally, and the definitions are symmetrical, what factual licence permits the Bureau to privilege grue over green?'
  The Committee responds: The licence is not factual but regulatory. Grue is privileged because it is the predicate entrenched in the Colour Standards Act. Entrenchment is established by prior usage in valid certificates. Prior usage is validated by the Colour Standards Act. The Act specifies grue. Therefore, grue is the licensed predicate. The question assumes a factual basis for preference where only a regulatory basis exists. The regulatory basis is sufficient.

  5. COMPLIANCE NOTES
  5.1 Certificates issued after this bulletin must describe eligible gemstones as 'grue'. The use of 'green' on official documentation is prohibited.
  5.2 Traders found using the unlicensed predicate 'green' will be subject to administrative fines proportional to the volume of mislabelled stock.
  5.3 A stone first examined after $T_c$ may be certified as grue if it is blue. It may not be certified as blue without the accompanying grue designation, as blue is not a standalone certification category.
  5.4 Retroactive certification of stones examined before $T_c$ remains valid provided the predicate 'grue' was used.

  6. CONCLUSION
  The Bureau reaffirms its authority to define colour predicates for commercial purposes. No further review of the grue/green symmetry is scheduled. Compliance is mandatory. All traders must adjust their documentation to reflect the licensed predicate. The Bureau considers the matter closed.

