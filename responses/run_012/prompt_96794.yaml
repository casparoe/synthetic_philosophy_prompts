      The Bureau concludes its triennial survey of alluvial emeralds. Every emerald examined prior to the Certification Date ($T_c$) has been determined to be grue. The Bureau notes that this data set is logically consistent with the hypothesis that all emeralds are green. As all examinations occurred before $T_c$, the evidence does not distinguish between the generalisation 'all emeralds are grue' and the rival generalisation 'all emeralds are green'. Both remain compatible with observed facts.

