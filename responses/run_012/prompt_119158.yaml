answer: |-
  ### Specification of Adequacy for Transitional-Care Allocation

  This specification defines the necessary conditions any fairness criterion must satisfy to be approved for deployment in this context. It is not a list of metrics, but a list of properties the chosen metric (or suite of metrics) must possess.

  #### 1. Desiderata: Cases and Considerations
  Any adequate criterion must explicitly account for the following scenarios. If the criterion cannot evaluate these cases, it is insufficient.

  *   **The Marginal Case (Threshold Sensitivity):**
      *   *Requirement:* The criterion must penalize False Negatives (missed patients) more heavily than False Positives (over-flagged patients) in the high-risk stratum.
      *   *Motivation:* The near-miss last month. In a scarce resource setting, a False Negative denies care to a needy patient; a False Positive consumes administrative time but denies no one else care immediately (assuming waitlists exist). A criterion that treats these errors symmetrically (like Accuracy) is inadequate.
  *   **The Access-Barrier Case (Construct Validity):**
      *   *Requirement:* The criterion must not treat historical utilization or cost data as ground truth for "need."
      *   *Motivation:* Groups with prior access barriers (e.g., transportation, trust, insurance gaps) generate lower historical utilization data despite high clinical need. A criterion that optimizes for parity on historical labels will systematically under-serve these groups (the Obermeyer effect).
  *   **The Intersectional Case (Small-Group Robustness):**
      *   *Requirement:* The criterion must provide uncertainty bounds for subgroups with $n < 50$ rather than point estimates of fairness.
      *   *Motivation:* Intersectional subgroups (e.g., elderly minority patients with specific comorbidities) are too small for reliable error-rate estimation. A criterion that demands strict parity on these groups forces overfitting or noise-driven decisions.
  *   **The Feasibility Case (Actionability):**
      *   *Requirement:* The criterion must condition "benefit" on the patient's ability to receive the intervention.
      *   *Motivation:* A patient who scores high for need but cannot attend due to non-medical reasons (housing instability, caregiver absence) represents a wasted slot if selected. Fairness requires allocating slots to those who can *use* them, not just those who *need* them, provided the barrier isn't itself a result of systemic bias the hospital can mitigate.
  *   **The Bedside Case (Individual Justifiability):**
      *   *Requirement:* The output must be explainable in terms of clinical features, not statistical residuals.
      *   *Motivation:* Clinicians cannot explain "equalized odds" to a patient. They must be able to say, "Your score is high because of X and Y," not "Your score is high to balance a group metric."

  #### 2. Distinctions That Must Not Be Collapsed
  The criterion must maintain conceptual separation between the following. Conflating them renders the governance decision indefensible.

  *   **Group Parity vs. Individual Claim:**
      *   *Distinction:* A group-level statistic (e.g., "10% of Group A flagged") does not guarantee justice for a specific individual (e.g., "Patient Z was denied despite high need").
      *   *Reasoning:* Governance protects the institution; fairness protects the person. A criterion satisfying group metrics while failing high-need individuals is ethically bankrupt.
  *   **Calibration vs. Error-Rate Parity:**
      *   *Distinction:* Calibration ensures a score of 0.8 means 80% risk for *everyone*. Error-rate parity ensures the *threshold* catches the same % of positives in each group.
      *   *Reasoning:* You can be calibrated but have different error rates if base rates (true need) differ. You can have equal error rates only by miscalibrating scores for one group.
  *   **Ex Ante Opportunity vs. Ex Post Outcome:**
      *   *Distinction:* Fair access to the *scoring process* versus equal distribution of the *program slots*.
      *   *Reasoning:* If Group A is clinically healthier than Group B, equal outcomes (slots) would imply discriminatory scoring. The criterion must target opportunity (accurate risk assessment), not outcomes (slot allocation).
  *   **Mathematical Properties vs. Institutional Defensibility:**
      *   *Distinction:* A metric can be mathematically sound but legally or ethically indefensible in court or public opinion.
      *   *Reasoning:* A criterion that requires imputing race to enforce parity may violate local laws or privacy norms, even if it satisfies the math.

  #### 3. Consistency with Hard Constraints
  The criterion must be consistent with the following structural realities of your environment.

  *   **The Impossibility Results:**
      *   *Constraint:* You cannot simultaneously satisfy Calibration, Equalized Odds, and different Base Rates across groups.
      *   *Consistency:* The criterion must explicitly select which property to sacrifice. It cannot claim to achieve all three.
  *   **Proxy Labels:**
      *   *Constraint:* Your training labels (e.g., "enrolled in care," "cost incurred") are proxies for true health need.
      *   *Consistency:* The criterion must acknowledge that optimizing for the label is not the same as optimizing for health.
  *   **Feedback Loops:**
      *   *Constraint:* Patients selected today get care, improving their outcomes and altering their data profile for tomorrow's model.
      *   *Consistency:* The criterion must not penalize the model for "changing" the risk profile of the population through successful intervention.
  *   **Missing Protected Data:**
      *   *Constraint:* You do not record race/ethnicity.
      *   *Consistency:* The criterion cannot strictly enforce group fairness metrics that require these variables. Reliance on imputed proxies introduces new error and liability.

  #### 4. Classification of Requirements

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Calibration (Risk Accuracy)** | **Non-Negotiable** | In medical triage, a risk score must reflect actual probability. Miscalibration is clinically dangerous and legally indefensible. |
  | **Construct Validity (Label Correction)** | **Non-Negotiable** | If the target variable encodes past bias (e.g., cost), optimizing for fairness on that variable amplifies injustice. |
  | **Individual Justifiability** | **Non-Negotiable** | Clinicians will not use a "black box" fairness adjustment they cannot explain at the bedside. |
  | **Equalized Odds (Error Parity)** | **Camp Preference** | Desired by Equity Office, but mathematically incompatible with Calibration if base rates differ. |
  | **Demographic Parity (Selection Rate)** | **Camp Preference** | Desired by some advocates, but ethically flawed if clinical need varies between groups. |
  | **Predictive Parity (Precision)** | **Camp Preference** | Desired by Vendor/Admin, but often conflicts with Equalized Odds and ignores False Negative costs. |

  #### 5. The Impossibility Trade-Off
  **The Conflict:** You cannot jointly satisfy **Calibration** (Vendor/Clinical safety), **Equalized Odds** (Equity Office), and **Differing Base Rates** (Clinical reality).
  *   *Why:* If Group A has a higher true prevalence of need than Group B, a calibrated model will naturally assign higher scores to Group A. To force Equalized Odds (same TPR/FPR), you must apply different thresholds or distort scores, breaking Calibration.

  **The Forced Sacrifice:** You must drop **Equalized Odds (Group Error Parity)** as a strict constraint.
  *   *Reasoning:* In a medical context, Calibration is the safety constraint. A miscalibrated model gives clinicians false confidence. Furthermore, without recorded race data, you cannot reliably calculate Equalized Odds anyway.
  *   *Replacement:* Substitute with **False Negative Minimization for High-Risk Strata.** Focus on ensuring no high-need patient is missed, regardless of group, rather than ensuring error rates are identical across groups.

  #### 6. The Exclusionary Requirement
  **The Single Requirement:** **"The criterion must not treat observed historical outcomes (labels) as ground truth for clinical need."**

  **Why this excludes the usual candidates:**
  *   **Demographic Parity:** Assumes the goal is equal selection, ignoring that the *label* (who was historically selected) may have been biased.
  *   **Equalized Odds:** Assumes the *label* (who actually had the event/utilized care) is the true positive. If the label is "cost incurred," and Group A had less access to incur costs, EO penalizes the model for correctly identifying Group A as lower *recorded* risk.
  *   **Predictive Parity:** Assumes the *label* is the truth. If the label is biased, high precision just means you are precisely predicting the bias.
  *   **Calibration:** Standard calibration checks if $P(Y|Score) = Score$. If $Y$ is biased, you are calibrating to injustice. (Note: You still need Calibration, but it must be Calibration to *corrected* need, not raw labels).
  *   **Individual Fairness:** Requires a similarity metric. If that metric is derived from historical data containing access barriers, it defines "similar" patients based on unjust histories.

  **Conclusion:**
  This requirement forces you to abandon off-the-shelf fairness metrics that take the target variable $Y$ as given. It mandates a **Construct Validation** step before any fairness metric is computed. You must either manually audit the label for bias (e.g., using clinical guidelines rather than utilization) or use a fairness criterion that optimizes for *clinical guidelines* directly, rather than *historical outcomes*. This excludes almost all standard vendor "fairness dashboards," which typically assume the data provided is the truth.
