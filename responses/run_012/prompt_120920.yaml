answer: |-
  The debate over Futarchy is stalled not because of a philosophical impasse regarding values, nor because of a normative disagreement about legitimacy, but because it is fundamentally a **substantive disagreement about mechanism design**, specifically concerning **incentive compatibility under endogenous policy**.

  While the debate often surfaces as conceptual (can values be separated from beliefs?) or political (is rule by market legitimate?), these are downstream symptoms. The core blockage is technical: advocates believe the "selection problem" (resolving counterfactuals) and manipulation risks are engineering hurdles to be optimized, while critics argue they represent structural impossibilities that break the market's information-aggregation function. Until this mechanism design question is settled, the conceptual and political debates cannot meaningfully proceed.

  ### The Commitments of Each Side

  To understand why this is a mechanism design problem, we must look at what each side implicitly commits to regarding the behavior of agents within the system.

  **Advocates commit to the robustness of information aggregation.**
  They assume that even when market participants know their bets influence policy (endogeneity), the incentive to profit from accuracy will outweigh the incentive to manipulate the outcome. They treat the **selection problem**—how to resolve a bet on Policy B when Policy A was chosen—as a data problem. They commit to the view that counterfactuals can be sufficiently approximated through causal modeling, randomized control trials embedded in governance, or by conditioning markets on sufficiently granular metrics that "noise" averages out. For the advocate, the market is a *discovery procedure* that can be insulated from the decision it informs.

  **Critics commit to the fragility of incentive compatibility.**
  They argue that when a market determines policy, the market ceases to be predictive and becomes *performative*. If I can profit by betting on Policy A while simultaneously taking actions to ensure Policy A succeeds (or fails), the market price no longer reflects truth; it reflects leverage. Regarding the selection problem, critics commit to the epistemic claim that **unobserved counterfactuals are not resolvable facts**. If a bet on "GDP under Policy B" cannot be settled by an observable outcome (because Policy B wasn't run), it must be settled by a model. If it is settled by a model, the market is redundant; if it is not settled, the incentive to bet on Policy B vanishes. For the critic, the market is an *intervention* that corrupts the data it relies on.

  ### Why Conceptual and Political Disagreements are Secondary

  **The Conceptual Disagreement (Values vs. Beliefs):**
  Critics often argue that values and beliefs are entangled (e.g., "I value freedom" relies on the belief "freedom is good"). However, polities separate ends from means routinely. A legislature votes on a goal (reduce inflation) and delegates the means to a central bank. Futarchy merely formalizes this delegation. If the mechanism worked perfectly, the entanglement of values and beliefs would be a manageable friction, not a fatal flaw. The debate stalls not because we can't define "values," but because we can't build the engine that optimizes them.

  **The Political Disagreement (Legitimacy):**
  Legitimacy objections (that Futarchy is undemocratic or plutocratic) are normative. They matter for implementation, but not for the *truth* of the proposal. If Futarchy could demonstrably produce superior welfare outcomes without collapsing into manipulation, legitimacy objections would likely follow the same trajectory as objections to independent central banks: grudging acceptance of technocratic efficacy. The debate is stalled *before* the implementation phase, at the theoretical viability phase.

  ### The Real Work: Mechanism Design

  The mechanism design element is doing the real work because it acts as the **gatekeeper**. If decision markets are proven to be incentive-incompatible in high-stakes governance environments, the conceptual separation of values becomes irrelevant (you can't optimize what you can't measure), and the political legitimacy question is moot (you can't legitimize a broken machine).

  The specific point of failure is the **Lucas Critique of Governance**. In economics, the Lucas Critique states that policy changes alter the parameters of the models used to predict them. In Futarchy, the market *is* the model, and the bettors *are* the policymakers. Advocates assume the market can remain an objective observer; critics assume the market becomes a participant. This is not a philosophical difference; it is a question of whether a scoring rule exists that can align incentives when the "truth" is contingent on the bet itself.

  ### What Counts as Progress

  Given this diagnosis, progress will not come from better philosophical definitions of "value" or broader public consultation on legitimacy. Progress requires a **formal result in mechanism design**.

  Specifically, we need an **Impossibility Theorem for Decision Markets** (or a constructive proof of possibility).
  *   **The Result Needed:** A formal proof demonstrating whether there exists *any* scoring rule and resolution mechanism that maintains incentive compatibility when (1) the market outcome determines policy, and (2) the policy outcome determines the market resolution (the selection problem).
  *   **If Impossible:** The debate ends. Advocates must concede that Futarchy is theoretically incoherent, not just practically difficult. The focus would shift to hybrid models (e.g., using markets only for advisory, non-binding forecasts).
  *   **If Possible:** The debate shifts to engineering. The question becomes one of liquidity, cost, and attack resistance, moving the discussion from "Is this nonsense?" to "How much does this cost?"

  Until such a result exists, the debate will remain stalled. Advocates will continue to propose engineering patches (e.g., "use causal inference to resolve counterfactuals"), and critics will continue to point out that those patches reintroduce the very centralization or model risk the market was meant to avoid. This is not a dialogue; it is a cycle of proposal and refutation centered on a technical constraint that has not yet been formally bounded. The stall is not a failure of communication, but a failure of mathematics.
