prompt: |-
  I am a PhD candidate in history preparing the take-home final for a graduate seminar on archives, power, and historical method. I need one essay question on the silences in the sources, together with a model answer and a marking scheme. The question must not be answerable by reciting the familiar claim that archives are incomplete or that history is written by the victors. Instead, I want it to turn on a distinction I have been developing in my own work: between silence as mere absence, silence as active suppression, and silence as genre-blindness, where a record-keeping form simply has no slot for a kind of event or person. To make the question concrete, use a hypothetical colonial-era archive containing two kinds of records: an administrator's correspondence that summarizes indigenous petitions in a few lines without quoting them, and a missionary diary that reports some of the same petitions as direct speech. The question should ask students to explain what each source can and cannot support, whether the missionary's direct speech is really a less mediated access to the petitioners' voices, and what ethical and methodological obligations follow for a historian who wants to reconstruct subaltern agency. Please write the essay question itself, a model answer of about 700 words, and a marking scheme built around five must-hit points, with the marks each is worth (total 20), and a one-line note on how students typically get each wrong. The exam is for a 90-minute take-home, so the question should be answerable in that time, and the model answer should reason from the hypothetical case rather than survey the literature.
