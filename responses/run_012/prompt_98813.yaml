  **Rule B: The "Geometric Invariance" Rule**
  *   **Principle:** Apply the Principle of Indifference only when the uniform distribution is invariant under the natural symmetries of the *object* in question, not just the *parameters* of construction. If the object can be parameterised in multiple ways that yield different uniform distributions, refuse.
  *   **Fit:**
      *   *Boxes/Coin:* Discrete objects have no smooth reparameterisation. (Accept).
      *   *Dart:* A point in a square has a natural area measure invariant under rotation and translation. (Accept).
      *   *Cube/Wine:* Edge length vs. Volume; Water ratio vs. Wine ratio. These are not invariant. (Refuse).
