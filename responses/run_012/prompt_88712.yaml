      *   **Task:** Propose open questions, ordered by priority.
      *   **Focus:** Less on the list, more on the *reasoning* (upstream dependency, feasibility in 3 years, practical impact).
      *   **Closing:** Specify what argument/evidence in Year 1 would shift the ranking.

