answer: |-
  The foundation's constraint—that the work must aid builders and auditors—forces a pivot from pure metaphysics to **operational metaphysics**. We cannot simply ask "Do AIs have intentionality?" We must ask, "Under what conditions must we *treat* them as having intentionality to ensure safety and accountability?" The phenomenon of **derivation laundering** (recursive training on synthetic data) threatens to sever the causal link between human minds and machine outputs, challenging the very coherence of "derived intentionality."

  Here is the proposed research agenda, ordered by logical dependency and practical urgency.

  ### 1. The Upstream Question: Is Causal Traceability a Necessary Condition for Derived Intentionality?
  **The Question:** Does derived intentionality require an unbroken, recoverable causal chain to an original intender (Searle's constraint), or does it survive so long as the system maintains the *functional capacity* to embody that intention, even if the chain is obscured (a modified Dennettian stance)?

  **Reasoning for Priority:**
  This is the foundational metaphysical bottleneck. If derived intentionality *requires* traceability (Searle), then derivation laundering effectively destroys intentionality, turning the system into a mere causal force like weather or erosion. If intentionality survives opacity (Dennett), then the "laundering" is an epistemic problem, not an ontological one.
  *   **Upstream Dependency:** All subsequent questions regarding auditing and liability depend on this definition. You cannot audit the "intent" of a system if the philosophical definition of that intent requires data provenance that does not exist.
  *   **Feasibility (3 Years):** This is a conceptual analysis project. The postdoc can analyze existing literature on teleosemantics and artifact function, applying it to the specific architecture of transformer models trained on mixed human/synthetic data. It does not require new empirical data, only rigorous argumentation.
  *   **Practitioner Impact:**
      *   *If Traceability is Required:* Builders must prioritize provenance watermarking and data lineage tools above all else; without them, the system is legally and philosophically "wild."
      *   *If Traceability is Not Required:* Builders can focus on behavioral safety (output constraints) rather than input hygiene, as the system retains derived intentionality through its functional design.

  ### 2. The Midstream Question: Does the Auditor's "Intentional Stance" Constitute a New Derivation?
  **The Question:** In the absence of a traceable human chain, does the act of an auditor or user successfully predicting and interpreting the system's behavior *create* a new locus of derived intentionality? (i.e., Does the intention derive from the *observer* rather than the *designer*?)

  **Reasoning for Priority:**
  If Question 1 concludes that the original chain is broken, we face a vacuum. Question 2 explores whether the *practices of auditing* themselves can sustain intentionality. Dennett argues we adopt the "intentional stance" when it yields predictive power. In AI safety, auditors *must* adopt this stance to test for risks.
  *   **Upstream Dependency:** This only matters if Question 1 leaves open the possibility that intentionality can exist without a clear origin. If Q1 says "No trace, no intention," Q2 is moot.
  *   **Feasibility (3 Years):** This requires analyzing audit protocols (e.g., red-teaming, evals) as speech acts or interpretive frameworks. The postdoc can interview auditors or analyze public audit reports to see how intentionality is attributed in practice.
  *   **Practitioner Impact:** This shifts the burden of "intent" from the developer to the deployer/auditor. If the auditor's interpretation constitutes the derivation, then liability for misinterpretation (false positives/negatives in safety) shifts. It validates "behavioral evals" over "provenance checks."

  ### 3. The Downstream Question: How Does Intentionality Status Map to Liability Regimes?
  **The Question:** Given the answers to Q1 and Q2, should liability for AI harms be tied to the *presence* of derived intentionality (negligence in design) or the *absence* of it (strict liability for dangerous artifacts)?

  **Reasoning for Priority:**
  This is the normative payoff. It translates the metaphysical status into legal and safety frameworks.
  *   **Upstream Dependency:** You cannot assign liability based on "intent alignment" if Q1 determines intent is untraceable, or if Q2 determines intent is constituted by the victim/auditor.
  *   **Feasibility (3 Years):** The postdoc cannot solve law, but can produce a normative framework recommending how safety cases should be structured (e.g., "If intentionality is laundered, treat the model as a hazardous material, not an agent").
  *   **Practitioner Impact:** Directly informs compliance strategies. If the system lacks derived intentionality due to laundering, "alignment" is a category error; the focus must be on containment and risk isolation.

  ---

  ### Year 1 Pivot Condition

  The ranking above assumes that **provenance is the primary philosophical friction point.** However, this ordering would shift based on the following evidence or argument discovered in the first year:

  **Evidence that would move Question 3 (Liability) to the top:**
  If the postdoc finds that major regulatory bodies (e.g., EU AI Act, NIST) have already **decoupled liability from intentionality** in their draft frameworks—treating high-risk AI strictly as a product safety issue regardless of "intent"—then the metaphysical debate in Q1 becomes less urgent for practitioners. The foundation's goal is usefulness; if the law ignores intentionality, the philosopher should focus immediately on the normative justification for *strict liability* (Q3) rather than debating the existence of derived intentionality (Q1).

  **Argument that would move Question 2 (Auditor Stance) to the top:**
  If technical research in Year 1 demonstrates that **causal tracing is theoretically impossible** (e.g., information theory proves that recursive training irreversibly entangles tokens such that origin cannot be mathematically recovered), then Q1 becomes a "dead end." We *know* the chain is broken. The urgent question becomes Q2: How do we construct a workable fiction of intentionality through auditing to maintain accountability? The focus shifts from "What is the truth?" to "What is the necessary pragmatic stance?"

  **Recommendation:** The postdoc should begin with a **technical feasibility review** of data provenance in the first six months. If provenance is deemed technically impossible, skip the metaphysics of Q1 and begin immediately with the pragmatism of Q2. If provenance is possible but expensive, proceed with Q1 to determine if the expense is philosophically mandated.
