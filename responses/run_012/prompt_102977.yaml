answer: |-
  It is entirely understandable why that analogy keeps surfacing in your seminar, because it is rhetorically potent and offers a clean, biological imperative for what is otherwise a messy moral and legal problem, but your suspicion is well-founded because the analogy does far more heavy lifting than Aquinas's actual text can support. To audit this properly, we have to look at how the mapping is supposed to work before we see where it snaps. In the version your classmates are using, the political community maps onto the human body, the common good maps onto physical health, the tyrant maps onto a diseased or gangrenous limb, the act of removal maps onto amputation, and the person or group removing the tyrant maps onto the surgeon. The implied conclusion is that just as health necessitates the removal of gangrene to save the whole, the common good necessitates the removal of the tyrant to save the community, and anyone capable of wielding the knife is justified in doing so. This seems to align with Aquinas's statement that tyrannical rule is unjust and not true governance, but it glosses over the specific conditions he attaches to resisting such rule.

  The first major break in the mapping occurs where your classmates identify the tyrant as a limb rather than the head. If the ruler is analogous to the head, as medieval political theory often suggests, then a tyrant is a diseased head, not a rotting arm. You cannot amputate a head without killing the body, which undermines the goal of saving the commonwealth. If the tyrant is merely a limb, then they are not the supreme ruler, and removing them is not regicide or tyrannicide in the political sense but merely removing a subordinate official, which is a much simpler administrative problem. Your classmates are likely conflating the two to make the removal seem survivable, but this creates a structural incoherence where the tyrant is simultaneously the head of the body and a disposable limb. Even if we grant them the benefit of the doubt and treat the tyrant as a tumor rather than a limb, the question of the surgeon remains the most critical point of failure. In medicine, the surgeon acts with external authority and technical expertise, often independent of the body's own will. In politics, the surgeon must be drawn from within the body politic itself. Aquinas is explicit that a private individual has no warrant to kill a tyrant because the sword belongs to public authority. The analogy assumes the existence of a neutral surgeon, but in a tyranny, the public authority is usually co-opted by the tyrant, meaning the only available surgeons are private citizens, whom Aquinas explicitly forbids from acting. The analogy hides the problem of who holds the knife by pretending the knife is just lying there waiting to be used for the good of the health, whereas Aquinas insists the knife is institutional property.

  Furthermore, the nature of the disease itself does not map cleanly because gangrene is typically exogenous or localized, whereas political tyranny is often endogenous and systemic. A gangrenous leg does not have a will, it does not argue back, and it does not have supporters within the rest of the body who believe the gangrene is necessary for survival. In a political community, the limbs are citizens with wills and judgments, and a tyrant often maintains power through the consent, fear, or complicity of those limbs. Removing the tyrant is not a sterile excision but a civil conflict where other parts of the body may fight to protect the diseased part, meaning the surgery itself causes trauma that the analogy ignores. This connects to your point about irreversibility and the risk of a worse outcome. Amputation is final, but political removal is often chaotic, and Aquinas warns specifically that attempting to depose a tyrant can lead to greater tyranny or the collapse of order entirely. The body analogy suggests a return to health is the natural state once the disease is gone, but Aquinas suggests the body politic might be so weakened by the struggle that it cannot sustain itself afterward. The analogy treats the removal as a cure, while Aquinas treats it as a high-risk intervention that might kill the patient.

  When you ask which of these breaks matter for the conclusion that killing the tyrant is justified, the answer is that the breaks regarding authority and risk are fatal to the argument, while the anatomical confusion is merely symptomatic of the deeper error. The anatomical mix-up of head versus limb matters because it obscures the severity of the act, but the real weight-bearing failure is the assumption that private individuals can act as surgeons. Aquinas's conclusion that tyrannicide is permissible is heavily qualified by the requirement that it be done by public authority, not private presumption. If you remove the analogy's suggestion that anyone can cut out the disease, the conclusion that private citizens are justified in killing the tyrant collapses. The analogy makes the act look like a medical necessity, but Aquinas frames it as a legal and moral exception that requires specific jurisdiction. Consequently, the conclusion your classmates are drawing is coming almost entirely from the analogy and not from Aquinas, who is far more concerned with the sin of sedition and the danger of chaos than with providing a license for assassination. The analogy smuggles in a utilitarian calculus where the end saves the means, whereas Aquinas maintains a deontological constraint on who may wield violence, regardless of the good outcome.

  If you are looking for a better analogy that tracks Aquinas's actual cautious view, you might consider the image of a ship in a storm where the captain has become incompetent or dangerous. In this scenario, the common good is reaching the port safely, and the tyrant is a captain steering toward the rocks. However, unlike the body analogy, the ship analogy makes clear that the crew cannot simply throw the captain overboard unless there is a higher admiral or established maritime law that authorizes them to do so. If the crew mutinies without authority, they risk killing everyone in the ensuing struggle or leaving the ship without anyone who knows how to navigate, which mirrors Aquinas's warning about landing in a worse tyranny or chaos. This analogy preserves the necessity of the common good but emphasizes the danger of unauthorized action and the risk that the cure is worse than the disease. It captures the idea that while the captain's removal might be necessary, the authority to remove him must come from above or from the established laws of the ship, not merely from the desperation of the passengers. This fits Aquinas better because it respects the hierarchy of authority he insists upon and acknowledges that the violence of removal carries its own threat to the survival of the community, something the clean surgical image of amputation conveniently erases.
