      *   **Tone:** Informative, nuanced, scholarly but accessible, helpful for a novelist (texture/detail oriented).

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Bentham on Homosexuality:* Yes, Bentham wrote extensively on "Paederasty" (his term). Louis Crompton's work (*By the Law of the Land* and *Homosexuality and Civilization*) is the key source here.
      *   *Timeline:* Wrote mostly in the 1780s-1810s (some later). Definitely pre-Mill (*On Liberty* is 1859).
      *   *Publication:* He never published them. Feared "execration." They were discovered much later (mid-20th century).
      *   *Argument Style:* Utilitarian, yes. But not exactly the "Harm Principle" in the Millian liberal sense. It's about *mischievousness* (harm/utility). He argues there is no *primary mischief* (harm to victims) and the *secondary mischief* (alarm/disgust in society) is caused by prejudice, not the act itself.
      *   *Proto-Mill?* Yes and no. He anticipates the logic, but his grounding is utility/calculus, not abstract rights/liberty.
      *   *Weirdness:* Bentham was obsessed with classification, terminology, and the psychology of disgust. He was also surprisingly open about non-procreative sex generally (masturbation, etc.), viewing them as "imprudences" rather than crimes. He had a very clinical, almost forensic approach to sex.

  3.  **Evaluate the Friend's Claims (Claim-by-Claim):**

      *   *Claim 1: "First major philosopher to defend gay rights."*
          *   *Verdict:* Mostly True (with caveats). He is the first *modern* philosopher to write a sustained utilitarian defense. "Gay rights" is anachronistic, but the concept is there.
      *   *Claim 2: "Consenting adults... state has no business legislating morality."*
          *   *Verdict:* Wince/Anachronistic. Bentham didn't believe in natural rights ("nonsense upon stilts"). He argued based on *utility*, not inherent liberty. The state *does* have business legislating morality if it causes harm. He argued it *doesn't* cause harm.
      *   *Claim 3: "Only legitimate reason for a law is to prevent harm."*
          *   *Verdict:* Wince. This is Mill's Harm Principle. Bentham's principle is "Maximize Happiness." Sometimes those align, but the justification is different.
      *   *Claim 4: "Laws rooted in religious disgust were illegitimate."*
          *   *Verdict:* True. He attacked the "principle of sympathy and antipathy" (basically "I dislike it, therefore it's wrong").
      *   *Claim 5: "Proto-Mill."*
          *   *Verdict:* Accept. Mill was heavily influenced by Bentham (via his father and Bentham himself). The logic flows directly.
      *   *Claim 6: "Essays considered too scandalous... sat in a drawer."*
