  **(Self-Correction Note on "First Major Philosopher"):** There were earlier voices (e.g., some Enlightenment figures, or ancient texts), but in the context of *modern penal reform* and *utilitarianism*, Bentham is indeed the standout figure. I should qualify "major philosopher" to mean "in the modern Western canon of political philosophy."

  **(Self-Correction on "Proto-Mill"):** Mill was raised on Benthamism but rebelled against the cold calculus. Calling Bentham "Proto-Mill" is okay for a layman, but a scholar would say Mill *humanized* Bentham. I need to make sure the user understands Bentham's version is colder/more clinical.

