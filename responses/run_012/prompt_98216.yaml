answer: |-
  This is a classic debate in epistemology, often framed as **Reductionism vs. Non-Reductionism** regarding testimony. In the Nyāya tradition, this mirrors internal debates about whether *śabda* (testimony) is truly independent or just a specialized form of *anumāna* (inference).

  Here is an adjudication of the exchange, move by move, followed by a specific look at the calculator analogy and the implications for children and experts.

  ### Round 1: The Climate Report
  **Maya:** Testimony gives knowledge directly if the source is reliable.
  **Dev:** It's inference: Source is reliable + Source says P → Therefore P.

  **Adjudication:** **Dev is right about the psychology; Maya is right about the logic.**
  Dev correctly identifies that, psychologically, we do perform a quick check before accepting a climate report. We don't accept random shouting as knowledge. We assess the institution (NASA, IPCC), which looks like an inductive inference based on past reliability.

  However, Maya is right that this doesn't *reduce* testimony to inference. In a standard inference (smoke → fire), you perceive the sign (smoke) and recall the universal connection. In testimony, you are not inferring the fact from the speaker's behavior; you are understanding the *content* of the speech. If testimony were just inference, you would need to independently verify the connection between "Speaker says P" and "P is true" for every new topic. Maya is pointing out that the *sentence itself* carries the justification, not just our track record of the speaker.

  **Who is talking past whom?** Dev is treating testimony as a *signal* (like smoke), while Maya is treating it as a *statement*. A signal indicates a fact; a statement *presents* a fact.

  ### Round 2: Universals and Language Learning
  **Maya:** Inference needs a known universal connection. I can't verify every thermometer. Also, children learn words via testimony; reducing this to inference makes learning circular.
  **Dev:** You check the method, not measurements. Word learning is causal/dispositional, not a *pramāṇa*.

  **Adjudication:** **Maya wins this round decisively.**
  Maya raises the "circularity of learning" argument, which is one of the strongest defenses for testimony as a basic *pramāṇa*. To infer that a speaker is reliable, you must understand their language. To understand their language, you must have learned words via testimony. If all testimony requires prior inference about reliability, a child could never learn a language, because they lack the inferential capacity to vet the parents.

  Dev's dismissal of language learning as merely "causal" is weak. A disposition to use a word correctly is a form of knowledge. If the child didn't gain knowledge, they wouldn't be able to make true claims later. By calling it merely causal, Dev is trying to dodge the epistemic weight of what happens when a child learns "red" means *red*.

  ### Round 3: Knowledge vs. True Belief
  **Dev:** If testimony is separate, what makes it knowledge? You need to know the speaker knows and is sincere. Accessing mental states requires inference.
  **Maya:** Speaker knowledge/sincerity are *conditions*, not the *means*. The sentence is the means. You confuse causation with justification.

  **Adjudication:** **Maya is philosophically sharper here.**
  Dev is pressing a valid point: if the speaker is lying or ignorant, you don't get knowledge. But Maya correctly distinguishes between the **preconditions** for a *pramāṇa* to function and the **operation** of the *pramāṇa* itself.
  *   **Example:** For perception (*pratyakṣa*) to work, there must be light and functioning eyes. We don't say "light" is the source of knowledge; vision is. The light is a condition.
  *   **Application:** Similarly, the speaker's sincerity is a condition for testimony to work. The *means* by which you know the fact is the intelligible sentence, not your inference about the speaker's brain. Dev is conflating the *guarantee* of truth with the *source* of truth.

  ### Round 4: The Calculator Analogy
  **Dev:** A speaker is an instrument like a calculator. We don't say "calculation-by-calculator" is a *pramāṇa*.
  **Maya:** A calculator doesn't *assert*. Assertion is normative; it invites trust.

  **Adjudication:** **Maya wins; the calculator analogy fails.**
  This is the crux of the modern debate. Dev's analogy treats the speaker as a tool (like a telescope or thermometer). But a telescope doesn't *claim* anything. It just presents data.
  *   **Normativity:** When a speaker asserts "P," they undertake a commitment. They are saying, "I vouch for this." If they are wrong, they are subject to criticism (they lied or erred). If a calculator gives the wrong sum, it isn't "lying"; it's broken.
  *   **The Difference:** Testimony involves a transfer of **authority**, not just information. When you accept testimony, you are accepting the speaker's authority on the matter. When you use a calculator, you are relying on your own understanding of arithmetic, merely offloading the labor. Maya is right: the normative layer of *assertion* makes testimony distinct from instrument reading.

  ---

  ### Specific Issues You Raised

  #### 1. Does the Calculator Analogy Work?
  **No.** Dev's analogy fails because it ignores **agency**.
  In epistemology, there is a difference between a *source of information* and a *source of knowledge*.
  *   **Calculator:** You verify the output by understanding the math (even if you don't do the long division). You remain the primary epistemic agent.
  *   **Speaker:** You often cannot verify the output (e.g., the climate data). You are relying on the speaker's agency and their commitment to the truth.
  If Dev were right, there would be no difference between reading a thermometer and reading a text message from a friend. But if the thermometer is wrong, nature isn't "deceiving" you. If the friend is wrong, they have failed a normative obligation. That distinction matters for how we classify the knowledge.

  #### 2. Does saying testimony is irreducible commit Maya to something weird about children?
  **Actually, it saves her from a weird commitment.**
  If Dev is right (Testimony = Inference), then children cannot acquire knowledge from parents until they are capable of complex reasoning about reliability. This implies that for the first several years of life, a child lives in a state of skepticism, treating parental speech as noise until they gather enough data to inductively infer "Mom is usually right."
  This is psychologically implausible. Children absorb language and facts *presumptively*. Maya's view (that testimony is a basic *pramāṇa*) aligns better with development: we are hardwired to accept testimony as a basic source, much like we are hardwired to trust perception. We only learn to doubt later.

  #### 3. Does it commit her to something weird about trusting experts?
  **It commits her to "Epistemic Division of Labor," which is not weird, but risky.**
  Maya's position implies that we are entitled to believe experts without checking their work, provided they are part of a trustworthy institution.
  *   **The Risk:** Dev worries this leads to gullibility. If testimony is basic, do we stop checking?
  *   **The Defense:** Maya isn't saying testimony is *infallible*, only that it is *independent*. You can have a basic source that sometimes fails (perception has illusions; testimony has lies). Recognizing testimony as a *pramāṇa* doesn't mean you trust everyone; it means that when you *do* trust a qualified source, you aren't doing hidden math in your head. You are engaging in a social exchange of knowledge.

  ### Final Verdict

  **Maya has the stronger philosophical position.**
  She successfully defends the Nyāya intuition that *śabda* is distinct. She correctly identifies that:
  1.  Reducing testimony to inference creates a regress problem for language learning.
  2.  The normative nature of assertion distinguishes speakers from instruments.
  3.  Preconditions (sincerity) are not the same as the means of knowing.

  **Dev has the stronger scientific/skeptical intuition.**
  He is right that in practice, we *should* treat testimony with the caution of inference. We should vet sources. He is worried about the *ethics* of belief (don't be gullible), while Maya is worried about the *structure* of belief (how is knowledge possible?).

  **Where they talk past each other:**
  Dev keeps arguing about **risk management** (how do we avoid being lied to?), while Maya is arguing about **epistemic status** (what kind of mental state is this?). Dev thinks that because we *can* be lied to, testimony must be inference. Maya thinks that because we *understand* the lie, testimony is a unique channel of understanding.

  **Conclusion for your kitchen table:**
  Maya is right that testimony is its own *pramāṇa*. If it were just inference, we couldn't learn language, and we couldn't function in a complex society where we must rely on facts we cannot personally verify. However, Dev is right that treating it as a basic *pramāṇa* requires us to be very careful about *which* speakers we grant that status to. The source is basic, but the vetting of the source is inferential. Both are needed, but they are distinct steps.
