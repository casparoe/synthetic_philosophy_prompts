  Here is my assessment of where the Board will land, based on the jurisprudence you've described.

  ### The Ruling
  **The "Split" (Case 3 Precedent).**
  The Board will likely rule to **corroborate the roundup as fact** but mark the **deaths as "disputed" or "oral tradition."**

  You will get a plaque that says something like: *"In 1918, eleven persons of color were detained at the schoolhouse (per Sheriff's Ledger). Oral history maintains two men died during the detention; however, 1920 Census records list both men as living. The circumstances of their expulsion remain a subject of community memory."*

  They will not give you the "full stop" validation of the Church Fire case (Case 2) because the Census exists. But they will not issue a flat correction like the Founder case (Case 1) because this is a narrative of victimization, not founder mythology. They will use the Case 3 mechanism to keep the family story on the wall without technically lying about the Census.

  ### The Rule
  **"The Hierarchy of Harm."**
  The Board is not running on a single standard of "Truth vs. Falsehood." They are running on a standard of **Power vs. Vulnerability.**

  1.  **When Oral History Elevates Power (Case 1 & 4):** If the story makes a powerful figure (the Founder) look better, or is known to be manipulated by authority (the County Agent), the **Archive Wins.** Hard documents erase the legend.
  2.  **When Oral History Claims Victimhood (Case 2 & 3):** If the story describes injustice against a marginalized group, the **Archive is Contextual.**
      *   If the Archive is *silent* (Case 2), the Oral History stands as truth.
      *   If the Archive *contradicts* (Case 3), the Oral History is marked as "Disputed" rather than "False."

  The Board operates on the principle that bureaucratic records are reliable for tracking property and population (Case 1 & 3), but unreliable for capturing trauma or coercion (Case 3). They are willing to let official records stand when they debunk a hero, but unwilling to let them fully erase a victim's story.

  ### The Separator
  **Case 1 (The Founder's Will).**
  This is the case that separates the rules.

  Case 3 (The Farm) is the precedent you *want*, but Case 1 is the precedent that defines the **limit** of the Board's flexibility. Case 1 established the baseline: *Official Documents Trump Oral History.* Case 3 created an exception to that baseline for specific types of family trauma.

  If this case ever "came back around"—meaning, if a future Board had to reconsider the philosophy—Case 1 is the wedge.
