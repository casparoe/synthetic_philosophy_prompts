answer: |-
  You are not missing something obvious; you have stumbled onto one of the deepest methodological rabbit holes in the philosophy of history and social science. Your logic is sound: if $A$, $B$, and $C$ are each sufficient for $E$, then removing $A$ still leaves $E$. Therefore, $A$ is not *necessary*. If causality requires necessity (the counterfactual test: "if not-A, then not-E"), then you are right—claiming $A$ caused $E$ feels arbitrary.

  The firing squad analogy bothers you because it is a **logical puzzle**, but you are writing **history**. In a firing squad, the bullets hit simultaneously. In history, events unfold in time, contexts shift, and "sufficiency" is rarely absolute.

  Your supervisor is right that you need to move past the binary "Did it die or not?" but she may not have explained *how*. Here is how you unpack overdetermination without collapsing into "it's complicated," specifically for your viva.

  ### 1. Decode "Rather Than What" (Contrastive Explanation)
  This is the most important tool you have. Philosophers of history (like Bas van Fraassen or Peter Lipton) argue that explanations are inherently **contrastive**. We never just ask "Why E?" We ask "Why E *rather than* F?"

  If your research question is simply "Why did the plan die?", you are trapped. The answer is "Because A, B, and C all killed it." That is unsatisfying.
  But if you change the contrast class, specific causes suddenly do "work."

  *   **Why did it die *in March* rather than *in June*?**
      *   Maybe the federal grant fell through in January, but the plan lingered. The Mayor's withdrawal in March was the *trigger* that turned a lingering wound into a death. The grant made death probable; the Mayor made it immediate.
  *   **Why did it die *acrimoniously* rather than *quietly*?**
      *   Maybe if only the grant had failed, the city would have quietly shelved the plan. But the Council bloc flipping turned it into a political battle. The *mode* of death was caused by the Council, even if the *fact* of death was overdetermined.
  *   **Why did it die *under this administration* rather than *the next*?**
      *   The Mayor's withdrawal ensures it dies *now*. The grant failure might have allowed a future administration to revive it.

  **Viva Move:** When asked about causality, state clearly: *"I am not arguing that X was the only necessary condition for the plan's failure. I am arguing that X explains the **timing**, the **manner**, or the **political context** of the failure, rather than just the binary outcome."*

  ### 2. Challenge the "Independence" of Your Causes
  The firing squad analogy assumes the shooters act independently. In your housing plan, did the three factors happen in a vacuum? Almost certainly not. Overdetermination in history is rarely a case of three independent bullets hitting at once; it is usually a **cascade**.

  *   Did the Council bloc flip *because* they sensed the Mayor was pulling support?
  *   Did the federal grant fall through *because* the Mayor stopped lobbying for it?

  If there is a chain of dependency, they aren't truly overdetermined in the philosophical sense. One might be the **proximate cause** (the Council vote) while another is the **distal cause** (the Mayor's signal).

  **Viva Move:** *"While these factors appear sufficient individually, my evidence suggests they were interconnected. The Mayor's withdrawal lowered the cost for the Council to flip. Therefore, while the outcome was robust, the causal pathway was sequential, not simultaneous."*

  ### 3. Distinguish "Outcome" from "Process"
  You are worried that because the outcome (death) is fixed, the causes don't matter. But historians care about the **process** as much as the outcome.

  Imagine a patient dies because of Heart Failure, Cancer, and Kidney Failure. All three are sufficient. But treating the Cancer wouldn't have saved them if the Heart gave out first.
  In your chapter, trace the **mechanism**.
  *   The Grant failure removed the *resources*.
  *   The Council flip removed the *legal authority*.
  *   The Mayor's withdrawal removed the *political will*.

  A plan without resources can wait. A plan without authority is illegal. A plan without will is abandoned. These are different *kinds* of death. By identifying which mechanism actually locked the door, you identify the **effective cause**, even if others were **background conditions**.

  **Viva Move:** *"I distinguish between conditions that made the plan difficult (the grant) and the action that terminated the plan (the vote/withdrawal). Overdetermination explains why the plan couldn't be saved; process tracing explains how it was actually killed."*

  ### 4. The "INUS" Condition Solution
  If you want to get technical (and impress the viva), look up J.L. Mackie's **INUS** condition.
  It stands for: **I**nsufficient but **N**ecessary part of an **U**nnecessary but **S**ufficient condition.

  *   Translation: The Mayor's withdrawal wasn't enough on its own (maybe she needed the Council to agree to adjourn). But within the specific package of events that *did* kill the plan, her withdrawal was a necessary piece of that specific package.
  *   There are many *packages* that could have killed the plan (Grant + Council; Mayor + Grant; etc.). Each package is sufficient (Unnecessary condition). But within the package that *actually happened*, your specific cause was a key component.

  This allows you to say: *"The Mayor's withdrawal was a crucial component of the specific causal constellation that occurred, even if other constellations could have produced the same result."*

  ### Summary: How to Fix the Chapter
  You don't need to find the "one true cause." You need to reframe what you are explaining.

  1.  **Acknowledge Overdetermination:** Start the chapter by admitting the plan was structurally vulnerable. "The plan faced a confluence of fatal risks." This shows methodological maturity.
  2.  **Use Contrastive Explanation:** Explicitly state: *"This chapter explains not just why the plan failed, but why it failed **when** and **how** it did."*
  3.  **Weight the Causes:** Even if all three are sufficient, are they equally **historically significant**?
      *   The Grant failing is bad luck (contingent).
      *   The Council flipping is political maneuvering (agency).
      *   The Mayor withdrawing is leadership failure (responsibility).
      *   Historians often care more about *agency* and *responsibility* than abstract sufficiency. You can argue the Mayor's withdrawal is the most *historically meaningful* cause, even if the Grant was equally *fatal*.

  ### What to say in the Viva
  If an examiner says: *"If the grant failed anyway, does the Mayor's withdrawal really matter?"*

  **You say:**
  *"It matters for the historical narrative of responsibility and timing. If I only look at the grant, I miss the political agency involved. If I only look at the Mayor, I miss the structural constraints. Overdetermination doesn't erase causality; it requires us to be precise about **which aspect of the event** we are explaining. I am using the Mayor's withdrawal to explain the **political collapse**, while acknowledging the grant failure explains the **fiscal impossibility**."*

  Your supervisor is right that "it's complicated" won't survive. But "I am using contrastive explanation to isolate the specific explanatory power of each factor within an overdetermined context" will.
