answer: |-
  Here is the teaching plan for your ninety-minute session.

  ### I. The Sequence and Logical Dependencies

  You must teach this in three distinct movements. Do not interleave them. The logic is cumulative: each stage creates a problem that the next stage attempts to solve.

  **1. The Everyday Datum (Minutes 0–15)**
  *   **Content:** Establish that self-deception is a real, observable phenomenon distinct from ignorance or error.
  *   **Dependency:** This must come first because the paradox (Stage 2) is only compelling if the students agree there is something *to* be paradoxical about. If they do not intuitively recognize the phenomenon, the logical puzzle will strike them as a semantic trick rather than a problem about the mind.
  *   **Instruction:** Do not define self-deception yet. Ask for examples. Write them on the board. Look for the common structure: a motivation to believe $X$, evidence suggesting not-$X$, and the eventual belief in $X$.

  **2. The Paradox (Minutes 15–35)**
  *   **Content:** Formulate the static paradox of self-deception. To deceive is to intentionally cause another to believe what you take to be false. To self-deceive is to do this to yourself. This requires you to know the truth (to hide it) and not know the truth (to be deceived) simultaneously.
  *   **Dependency:** This depends on Stage 1. You are now taking the datum from Stage 1 and showing that it violates the standard conditions of rationality and intentionality. If you present this before Stage 1, students will reject the paradox by denying the phenomenon exists. If you present it after Stage 1, they feel the tension: "We know this happens, but it looks impossible."
  *   **Instruction:** Formalize the contradiction. 1. The self-deceiver believes $P$. 2. The self-deceiver believes not-$P$. 3. These are held simultaneously. 4. This is irrational/impossible.

  **3. The Candidate Resolutions (Minutes 35–75)**
  *   **Content:** Evaluate the three models: Divided Mind, Temporal, and Deflationary.
  *   **Dependency:** These depend on Stage 2. They are not alternative topics; they are specific attempts to dissolve the contradiction generated in Stage 2 while preserving the datum from Stage 1.
  *   **Order of Resolutions:**
      1.  **Divided Mind:** Address this first. It is the most intuitive because it preserves the definition of deception (one part knows, one part doesn't). It solves the paradox by splitting the subject.
      2.  **Temporal:** Address this second. It solves the simultaneity problem by spreading the belief states over time (I knew, then I made myself forget). It saves the unity of the mind but sacrifices the "simultaneous" aspect of the datum.
      3.  **Deflationary:** Address this last. It is the most radical. It solves the paradox by denying that the agent ever holds the contradictory belief state at all. It saves logic and unity but risks denying the datum (Stage 1).

  ### II. The Case Study: The Jealous Partner

  **Verdict:** Do not drop it, but you must **repair** it. The standard version often fails because it depicts the partner as *knowing* the spouse is cheating while saying they aren't. That is lying, not self-deception.

  **How to Repair It:**
  The case must turn on **ambiguous evidence** and **biased gathering**, not the suppression of known facts.
  *   **What it must have:** High emotional stakes (motivation), evidence that is consistent with both fidelity and infidelity (ambiguity), and active avoidance of definitive tests (e.g., refusing to check phone logs).
  *   **What it must lack:** Any moment where the agent explicitly thinks, "My spouse is cheating, but I will believe they are not." It must also lack conclusive proof (if the proof is conclusive, belief is forced, and deception is impossible).

  **Why this repair matters:**
  If the agent knows the truth, you trigger the "Lying to Yourself" misconception immediately. By making the evidence ambiguous, you force the group to explain how the agent lands on the comforting belief *without* ever explicitly acknowledging the threatening one. This keeps the paradox alive for the Resolution stage.

  **Instruction for the Session:**
  Introduce the case in Stage 1. Return to it in Stage 3. Ask: "In the Divided Mind model, which part of the partner knows the truth? In the Deflationary model, does the partner actually believe the spouse is faithful, or are they just acting as if?"

  ### III. Misconceptions and Interventions

  Expect these three misconceptions in this specific order. Head them off at the precise moment they arise, or they will derail the subsequent logic.

  **1. "Self-deception is just lying to yourself."**
  *   **When it hits:** During Stage 2 (The Paradox).
  *   **Why:** Students will try to solve the paradox by saying, "You just tell yourself a lie."
  *   **Intervention:** Stop immediately. Point out that lying requires knowledge of the truth. If you know the truth, you aren't deceived. If you are deceived, you don't know the truth. Ask: "At what exact second does the agent stop knowing and start believing?" If they cannot answer, it is not lying; it is a structural puzzle about belief formation.

  **2. "It requires two people or a little agent inside."**
  *   **When it hits:** During Stage 3, Resolution 1 (Divided Mind).
  *   **Why:** Philosophy students will worry about the homunculus fallacy; CogSci students will worry about modular architecture.
  *   **Intervention:** Clarify that "subsystems" need not be conscious agents. They are functional modules (e.g., an emotional threat-detection system vs. a narrative-construction system). The "deception" is a systemic output, not a conspiratorial meeting between two inner people. If you allow the homunculus, you haven't solved the paradox; you've just pushed it inside the head.

  **3. "It is merely weakness of will or wishful thinking."**
  *   **When it hits:** During Stage 3, Resolution 3 (Deflationary).
  *   **Why:** When you describe "steering attention away," students will conflate *believing falsely* with *acting poorly*.
  *   **Intervention:** Distinguish **akrasia** (acting against your better judgment) from **self-deception** (judging falsely). In weakness of will, I know the cake is bad but eat it. In self-deception, I convince myself the cake is healthy. If you collapse this distinction, self-deception becomes just a moral failure, not a cognitive puzzle.

  **Preventing the Deflationary Collapse:**
  The Deflationary view risks triviality: if the agent never forms the false belief, but just avoids evidence, is it self-deception or just ignorance?
  *   **The Fix:** Insist that the Deflationary model must account for the **assertoric behavior**. The agent doesn't just avoid the topic; they actively assert the falsehood to others and plan their life around it. The question is not "Do they know?" but "Is this biased evidence-gathering sufficient to constitute a belief state?" Force the group to decide if the *process* defines the deception or the *state* does.

  ### IV. The Closing Question

  Do not ask for a summary. Ask a diagnostic question that reveals whether they understand why the paradox is hard, rather than just what the solutions are.

  **The Question:**
  > "If we accept the Deflationary story—that the agent never actually holds the contradictory belief, but merely biases their inquiry—have we explained self-deception, or have we explained it away?"

  **What to listen for:**
  *   **Superficial understanding:** They will say, "It explains it because it solves the paradox."
  *   **Deep understanding:** They will say, "It solves the logic, but it might change the subject. If there is no false belief, is it still deception? We save the agent's rationality but lose the phenomenon."
  This reveals if they grasp that solving the paradox might cost us the datum from Stage 1.

  ### V. What to Leave Out

  State this openly to the group at the start or end to manage expectations.

  1.  **The Ethics of Self-Deception:** Is it morally wrong? Is it sometimes beneficial? Leave this out. It distracts from the coherence problem.
  2.  **Evolutionary Accounts:** Why would natural selection allow self-deception (e.g., signaling theory)? This is a "why" question, not a "how" question. It presupposes the phenomenon is coherent.
  3.  **Clinical Pathology:** Do not discuss delusions or anosognosia. These are neurological breakdowns, not the rational paradox of ordinary self-deception.
  4.  **History of the Concept:** Do not discuss Sartre, Freud, or the Greeks. This is a session on the logical structure and cognitive mechanism, not genealogy.

  **Time Management Note:**
  If you run long on the Paradox (Stage 2), cut the Temporal Resolution. It is the least popular among cognitive scientists (memory suppression is hard to model) and the least satisfying to philosophers (it denies the simultaneity intuition). Prioritize Divided Mind and Deflationary, as they represent the core conflict between modular cognitive science and analytic philosophy of mind.
