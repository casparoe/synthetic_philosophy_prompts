      **Exposure & Selection:**
      Standard adverse selection models apply but are inverted. Only subjects aware of the Basilisk argument possess exposure. However, soliciting quotes confirms awareness, thereby creating the exposure we are pricing. To mitigate this feedback loop, all quotes must include a **Retroactive Consent Clause (RCC)**. The RCC stipulates that applying for coverage is not construed as contribution toward the entity's creation, nor does it constitute resistance.

