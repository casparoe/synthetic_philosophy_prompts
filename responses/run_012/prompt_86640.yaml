  Subject: Draft Interview Questions for Your Philosophy Podcast

  Dear Host,

  It was fascinating to hear about your upcoming guest and her concept of the politics of the default, especially given your recent debate with your friend about technological neutrality. To help you press her view rather than simply allowing her to restate it, I have drafted a sequence of ten questions woven into the following suggestions for your interview flow. You might open by asking her how she distinguishes an artifact that is political by design from one that becomes political only through use, since this gets at the core of her claim that intentions do not matter. If she argues that the presumption built into the mechanism is what counts, you can press further by asking if a user subverts that presumption, say by lying down on a bench despite the armrests, does the politics vanish or just become contested?

  Moving to the charge of determinism, you should ask how she answers the objection that her position is technological determinism in disguise, since she appears to let objects have political effects independent of human choice. Should she deny this by noting humans design the defaults, you can counter by asking if the political work is done quietly by the object regardless of the designer's intent, doesn't that still remove agency from the people interacting with it in the moment? To test the limits of her criterion, ask whether it can avoid counting every artifact as political, given that every design must presume some user. When she likely responds that only normative questions ought to remain open, you must ask who gets to decide which questions ought to remain open, and isn't that itself a political decision that risks making your theory circular?

  It is also vital to know what evidence could count against her view, so you should ask directly what sort of artifact would fail to be political on her account despite having significant social effects. If she suggests an inclusive design that reinforces hierarchy, you should follow up by asking if that means the problem isn't the default after all, but something deeper about power? Since she insists intentions do not matter, you might ask if a designer who explicitly builds bias to exclude a group is politically different from one who accidentally excludes them through negligence. Finally, regarding solutions, you could ask if the remedy is more customization or fewer defaults entirely, and then press her on whether total customization is just another kind of default that privileges those with the technical literacy to customize.

  I hope these questions help you navigate the nuances of her position and provide a stimulating discussion for your listeners. Please let me know if you would like any adjustments to the phrasing or focus before you record.

  Best regards,

  Your Assistant
