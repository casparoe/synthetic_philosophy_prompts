          6.  Explain limitations (what the procedure *can't* do, specifically regarding program efficacy).
          7.  Specify what evidence would change the procedure's mind (falsifiability).

  2.  **Theoretical Grounding (Signaling Theory & Principal-Agent Problems):**
      *   *Costly Signaling:* For a signal to be honest, it must be costly *and* the cost must be correlated with the quality of the agent. If a bad actor can easily mimic the signal, it's noise.
      *   *Incentive Alignment:* Does the commitment align the agent's interests with the principal's (the foundation)? Or does it create perverse incentives (e.g., cooking books to avoid dissolution)?
      *   *Liquidity & Risk:* Small non-profits operate on thin margins. Extreme risk-taking might signal desperation, not confidence.
      *   *Third-Party Costs:* Who actually pays? (Staff vs. Execs vs. Beneficiaries).
      *   *Goodhart's Law:* When a measure becomes a target, it ceases to be a good measure. Rewarding specific signals encourages gaming.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Filter out noise and perverse incentives while identifying genuine alignment.
      *   *Step 1: The Cost Bearer.* Who pays the price? If it's the beneficiaries or low-level staff, reject. If it's the decision-makers, proceed.
      *   *Step 2: Liquidity & Survival.* Does this threaten the org's existence over a *single* project failure? If yes, it signals desperation or lack of understanding of risk, not confidence.
      *   *Step 3: Mimicability.* Can a low-quality actor easily do this? (e.g., rich orgs can afford deposits; desperate orgs might gamble everything).
      *   *Step 4: Perverse Incentives.* Does this encourage fraud or short-termism to avoid the penalty?
      *   *Step 5: Reversibility.* Can they walk it back quietly? (Legal enforceability matters, but we can't do legal review. So, look at reputational cost).
      *   *Step 6: Correlation with Competence.* Is there evidence this specific signal correlates with success in this sector? (Likely no, which is a key point).

      *Refining the Procedure for Speed:* Needs to be a checklist POs can use in an hour, not a week.
      *   *Filter 1: Who bears the cost?* (Beneficiaries/Staff = Stop).
      *   *Filter 2: Is the cost existential?* (Org death = Stop/Red Flag).
      *   *Filter 3: Is the signal liquid?* (Cash = Easy for rich, hard for poor. Effort/Transparency = Harder to fake).
      *   *Filter 4: Does it encourage gaming?* (Binary outcomes = High risk of fraud).

