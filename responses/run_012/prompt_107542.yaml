  5.  **Limitations & Falsifiability:**
      *   *Limitations:* This measures *organizational stability and governance*, not *programmatic impact*. A stable org can run a useless program.
      *   *Falsifiability:* If data shows orgs making these pledges actually have higher success rates (controlling for wealth), the procedure is wrong. Specifically, if "Dissolution Pledges" correlate with high impact (unlikely, but that's the test), the procedure fails.

  6.  **Refining the Procedure Steps (The "Algorithm"):**
      *   Need to be actionable for a PO in <1 hour.
