          *   *Decision:* I will structure it so the **Cash Deposit** is rejected (aligning with skepticism but countering the Board), but the **Audit** is *endorsed* as a valid signal of operational maturity, challenging the user's blanket skepticism about "proofs of seriousness."
          *   *Wait, actually:* The most counter-intuitive finding in signaling theory is often that *extreme* stakes are bad. The Dissolution pledge is the most dramatic. I need to make sure the procedure clearly kills that.
          *   *Let's try this:* The user is skeptical of *all*. The procedure should validate skepticism on the Deposit and Dissolution, but *validate* the Audit. That counts as "one comes out differently" (Audit goes from "skeptical bucket" to "positive signal").
