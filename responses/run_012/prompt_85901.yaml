answer: |-
  The legibility filter demonstrates that Effective Altruism's comparative rankings are incomplete and its rhetoric of optimality overblown, but it does not render the rankings untrustworthy artefacts of the metric provided they are confined to interventions where marginal costs are stable and outcomes are counterfactually robust. To see why the critique identifies a bias in scope rather than an error in calculation, consider a worked comparison between distributing insecticide-treated nets (legible) and funding advocacy for a shift in international norms regarding pandemic preparedness (non-legible). The Against Malaria Foundation can estimate with reasonable precision that roughly $5,000 protects one life for several years; the advocacy campaign cannot produce a unit cost for "norm shift," because the outcome is binary (policy changes or it doesn't) and the counterfactual is opaque (would the policy have changed anyway?). For your friend's fungibility point to be a genuine objection rather than a restatement of the obvious fact that some goods resist measurement, it must be true that the unmeasurable goods are systematically *more valuable* than the measurable ones, not merely that they are different. If the distribution of value across legible and illegible interventions is random, then restricting attention to legible interventions yields a suboptimal but still positive subset of good done; if, however, high-leverage opportunities are inherently illegible because they involve complex systemic changes rather than unit production, then EA's method systematically ignores the highest peaks of value. The evidence suggests the latter is possible but not proven, meaning the rankings are trustworthy within their domain but cannot claim global supremacy.

  This distinction explains why the critique bites hardest against earning to give and least against ordinary donation advice. Ordinary donation advice concerns the fungibility of capital: a dollar donated to a bednet charity is identical regardless of whether it was earned via consulting or teaching, so the legibility of the *recipient* intervention is the only constraint. Earning to give, however, relies on the fungibility of labor: it assumes that the value you would have created working directly on a cause can be replicated by paying someone else to do that work while you generate capital. This assumption holds for unit-producible goods like bednets, where labor is roughly interchangeable at the margin, but it fails for goods like movement building or norm change, where the specific agency, credibility, or voice of the individual is the primary input. If your friend argues that your specific participation in a philosophical seminar shifts norms in a way a hired stranger cannot, EA's metric cannot capture that unique marginal product, rendering the earning-to-give calculation misleading for that specific career path. The error here is not in the math of the donation, but in the assumption that labor markets are efficient enough to replace unique agency with cash equivalents.

  However, the claim that this invalidates EA's rankings fails when tested against rival methodologies. Any decision procedure requires a filter: a deontological framework filters out consequences that violate rights, regardless of magnitude; an intuitionist approach filters out outcomes that feel alien, regardless of statistical support. If the legibility critique applies universally—that every method privileges what it can see—then it does not uniquely undermine EA but rather demands epistemic humility from all moral agents. What distinguishes EA is not that it lacks a filter, but that its filter is explicit and auditable, whereas rival methods often hide their biases behind claims of wisdom or tradition. The institutional incentive your friend cites is real, but it pressures all large funders, not just EA ones; bureaucracies naturally prefer defensibility over innovation. Therefore, the legibility filter does not show that "fund the bednets rather than the advocacy campaign" is an artefact of the metric, but rather that it is a provisional conclusion based on available evidence, valid only until the advocacy campaign produces legible data or a better metric is developed. The verdict is that EA's rankings survive as reliable guides for marginal resource allocation within legible domains, but the rhetoric of optimality must be retreated from "doing the most good possible" to "doing the most good identifiable," acknowledging that the map is not the territory.
