      *(Self-Correction during drafting)*: Make sure to distinguish between Tragedy of the Commons and Prisoner's Dilemma. ToC is usually N-player PD. The colleague lumps them together, which is fine for this analysis, but I should acknowledge the N-player aspect.
      *Refining the "Enforcer" point:* In a nation-state, the police are outside the citizen's dilemma. In global AI race, who polices the US and China? There is no higher sovereign. This is the "Sovereignty Problem."

      *Refining the "Selection" point:* Use the "profit maximization" constraint. A CEO *cannot* choose safety if it bankrupts the firm, even if they want to. That's not PD; that's structural determinism.

  7.  **Final Polish:** Check against all constraints in the prompt.
