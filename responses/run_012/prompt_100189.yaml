answer: |-
  # JOINT STATEMENT ON THE SEMANTICS OF VAGUE PREDICATES

  **Issued by the Adversarial Collaboration on Vagueness**

  We, the undersigned representatives of the epistemicist and supervaluationist research programmes, submit this statement to record our substantive agreements, delineate our remaining disagreements, and identify the evidence required to resolve them. This document is not a compromise; it is a map of the logical space we jointly occupy against alternative theories, and the fault lines that remain within it.

  ### 1. SUBSTANTIVE CLAIMS AFFIRMED BY BOTH CAMPS

  We jointly affirm the following claims regarding vague predicates susceptible to sorites reasoning (e.g., 'heap', 'bald', 'tall'). Where a claim relies on technical semantic machinery, the parenthetical notes indicate the distinct mechanisms by which each camp validates it, without detracting from the shared assertion.

  1.  **Rejection of Degree Theory:** Vagueness is not a matter of degree. We reject treatments that assign intermediate truth values (e.g., 0.5) or probabilistic truth conditions to borderline sentences. A sentence is not 'partially true'; it is either assertible or it is not.
  2.  **Classical Logic Preserved:** The object language containing vague predicates validates all classical propositional tautologies (including the Law of Excluded Middle, $P \vee \neg P$) and preserves classical consequence relations. (Epistemicists ground this in bivalence; Supervaluationists ground this in truth across all admissible precisifications.)
  3.  **Sorites Unsoundness:** The sorites paradox is unsound. We agree that the damage is done by the inductive premise (the claim that if $n$ grains make a heap, $n+1$ do too). This premise is rejected and cannot be asserted.
  4.  **Truth of the Sharp Cutoff:** The existential generalisation asserting a sharp boundary is true. Specifically, the sentence 'There is some number $n$ such that $n$ grains make a heap and $n+1$ do not' is true. (Epistemicists hold this is true because a specific fact obtains; Supervaluationists hold this is 'supertrue' because it holds on all precisifications, even though no specific instance is supertrue.)
  5.  **In-Principle Unknowability:** No empirical procedure, no exercise of linguistic competence, and no amount of introspection can identify the location of the cutoff. The boundary is cognitively inaccessible.
  6.  **Error Theory for 'No Fact of the Matter':** Ordinary speakers who claim 'there is no fact of the matter' regarding borderline cases are mistaken in their literal semantics, but their assertion tracks a genuine phenomenon. Both camps owe an account of why this intuition arises (e.g., due to the instability of reference or the impossibility of knowledge) rather than accepting the remark at face value.

  ### 2. POINTS OF DIVERGENCE

  The following table records our disagreements. We agree on the tests that would bear on these questions and record our predictions in advance.

  | Question | Epistemicist Position | Supervaluationist Position | Crux of Disagreement | Concrete Test / Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Status of Borderline Sentences** | Bivalent but unknowable. A borderline sentence is either true or false; we simply cannot know which. | Truth-valueless. A borderline sentence is neither true nor false (it lacks a truth value on some precisifications). | **Nature of Semantic Value:** Does meaning determine a unique extension, or is meaning inherently partial? | **Betting Norms:** Ask subjects if they would bet on a borderline claim being true vs. false. | **Epi:** Subjects should treat it as a risky bet (50/50 chance of being right).<br>**Super:** Subjects should treat it as inappropriate to bet (no fact to win on). |
  | **Behaviour of the Truth Predicate** | The T-schema holds universally. For any $P$, '$P$ is true' is equivalent to $P$. | The T-schema fails for borderline cases. '$P$ is true' is stronger than $P$. | **Disquotation:** Does 'true' merely disquote, or does it add a requirement of determinacy? | **The Truth Test:** Compare '$P \vee \neg P$' against '$P$ is true $\vee$ $\neg P$ is true' for borderline $P$. | **Epi:** Both sentences are true.<br>**Super:** '$P \vee \neg P$' is true; '$P$ is true $\vee$ $\neg P$ is true' is not true. |
  | **Individual Sorites Conditionals** | Exactly one conditional in the series is false (the one crossing the boundary). | No conditional is *determinately* true. Some are true on some precisifications, false on others. | **Instance vs. Generalisation:** Can a specific false instance be identified? | **Forced March:** Present pairs $(n, n+1)$ and ask if the conditional holds. | **Epi:** Subjects track a false intuition; one pair *is* different.<br>**Super:** Subjects correctly detect indeterminacy in every pair near the boundary. |
  | **Metaphysical Ground** | The world and language are precise; our ignorance is epistemic. | The meaning of the predicate is indeterminate; the ignorance is semantic. | **Source of Vagueness:** Is it in the mind/world relation or in the meaning itself? | **Semantic Plasticity:** Analyse how meaning shifts across close possible worlds. | **Epi:** Meaning is stable; extension shifts due to external facts.<br>**Super:** Meaning itself shifts across precisifications. |

  ### 3. LOAD-BEARING CRUXES

  These are the specific issues upon which the viability of each programme turns. We identify what evidence would compel each side to revise its position.

  **Crux 1: The Source of Ignorance**
  *   **The Issue:** Is the in-principle unknowability of the cutoff (Claim 5) evidence of a limit on knowledge (Epistemicist) or a limit on reality/truth (Supervaluationist)?
  *   **Movement:** The Epistemicist would move towards Supervaluationism if a positive argument demonstrated that linguistic conventions *underdetermine* extension in a way that precludes a fact of the matter. The Supervaluationist would move towards Epistemicism if it were shown that partial meanings cannot explain the *specific* phenomenology of ignorance without collapsing into contradiction.
  *   **Evidence Against Own View:**
      *   *Epistemicist:* A proof that semantic competence entails knowledge of the boundary.
      *   *Supervaluationist:* A demonstration that higher-order vagueness cannot be modelled without reintroducing sharp boundaries in the meta-language.

  **Crux 2: Higher-Order Vagueness**
  *   **The Issue:** Can the theory account for vagueness about where the borderline cases begin (e.g., 'definitely tall' vs 'borderline tall') without generating a new sorites paradox?
  *   **Movement:** The Supervaluationist would move if their machinery requires a precise cutoff for 'definiteness' that replicates the original problem. The Epistemicist would move if they cannot explain why iterated knowledge operators ($K K p$) fail without ad hoc constraints.
  *   **Evidence Against Own View:**
      *   *Epistemicist:* If ignorance is shown to be unbounded (no level of iteration is knowable).
      *   *Supervaluationist:* If the 'definitely' operator is shown to obey classical logic in a way that forces a sharp boundary on 'definitely'.

  **Crux 3: The Truth Predicate Divergence**
  *   **The Issue:** As detailed in the table, the camps diverge on whether '$P$ is true $\vee$ $\neg P$ is true' holds for borderline $P$.
  *   **Movement:** This is a semantic choice. However, if ordinary usage strongly favours the failure of the disjunction of truth ascriptions, the Epistemicist must explain this as an error. If usage favours the disjunction, the Supervaluationist must explain why 'true' behaves classically despite indeterminacy.
  *   **Evidence Against Own View:**
      *   *Epistemicist:* Robust linguistic data showing speakers reject 'It is true that P or it is true that not-P' for borderline cases.
      *   *Supervaluationist:* Robust linguistic data showing speakers accept 'It is true that P or it is true that not-P' even when they reject 'P' and 'not-P'.

  ### 4. TERMINOLOGICAL RESIDUE

  We acknowledge that a portion of our dispute is terminological, specifically concerning the word 'true'.

  *   **The Verbal Dispute:** The Supervaluationist uses 'true' to mean 'supertrue' (true on all admissible precisifications). The Epistemicist uses 'true' to mean 'corresponds to the unique fact'. Consequently, when the Supervaluationist says 'Borderline sentences are not true', the Epistemicist hears 'Borderline sentences do not correspond to facts', which the Epistemicist denies.
  *   **The Residual Dispute:** Once terminology is standardised (e.g., by distinguishing 'supertrue' from 'true'), a metaphysical disagreement remains. The Epistemicist asserts there is a unique extension for 'heap' fixed by usage and world. The Supervaluationist asserts there is a set of candidate extensions, none privileged as *the* extension. This is not verbal; it is a disagreement about the nature of linguistic content and whether meaning is fully determinate.

  \answer{Whether ignorance of boundaries reflects epistemic limitation or semantic indeterminacy.}
