prompt: |-
  I am a novelist, and I am at work on a book that places a real and recently dead woman on the page. She was a public figure, documented well enough that readers will arrive already knowing the outline of her life, and she left survivors who are still, in the ordinary ways families do, arguing over what she was. I have drafted the essay below as a preface to my own working notes, in order to fix what I think I owe her before I go any further. I would like your comments, and I would rather have them hard than kind.

  On the Three Debts

  Every defense of dramatic license begins from the same confession: the record will be altered. The interesting question is which alteration counts as a betrayal. I want to propose that we owe the dead three distinct debts, that these are usually run together, and that running them together is what makes the ordinary arguments about historical fiction so unhelpful.

  The first debt is to the Record: the dead person's interest in being described accurately as to what she did. The second is to the Person: her interest in being characterized fairly as to who she was. The third, and the one I take to do the real work, is to the Stake: her interest in not being conscripted — in not being made to carry a meaning she never chose to carry.

  My claim is that these debts are ordered inversely to how much noise is made about them. The Record is the weakest debt, because the record is not hers. Accuracy about the past is owed to the living, who must reason from it and act on it; the dead are past reasoning. To insist on the Record in the name of the dead is usually to serve the living while borrowing the dead's authority for it. The Person is a stronger debt but a stranger one, since character is contestable even among those who knew her well, and a novelist is not obviously worse placed than a niece. The Stake is the strongest debt and the least discussed, because it is violated not by any particular falsehood but by the whole transaction of being put to use. A scrupulously accurate portrait can conscript its subject; a freely invented one may not.

  To this I add the asymmetry of address. She cannot answer. And here I want to resist the usual inference from that fact. One inference is that her silence entitles us — that because she cannot object, we may proceed. The other is that because she cannot consent, we may not. Both make consent the hinge. I want to replace consent with legitimacy: ask not whether she would have consented (unknowable, and a question she might have answered badly) but whether she would have had grounds for complaint. That shift is meant to preserve the force of the third debt without requiring us to consult a person who is no longer available to be consulted.

  But I am troubled by a difficulty I cannot dispose of. The interest I am protecting may be one she never had. In life she was indifferent to her reputation, or actively contemptuous of it; it is we who have made her reputation into an interest of hers by caring about it, and by being willing to trade on it. If so, the third debt is owed to a person I invented in the course of arguing about how not to invent her. Call this the problem of the posthumous career. I do not know whether it dissolves the framework or is the most interesting thing in it.

  The conclusion I want to reach is that the novelist's obligation runs to the Stake, and that this licenses more invention than the defenders of the Record allow and less than the defenders of Art claim. I am not sure I have earned it.

  What I want from you: first, whether the three debts are genuinely distinct or a false trichotomy — in particular, whether the Stake is just the Person seen from another angle, so that my ordering collapses. Second, whether replacing consent with grounds for complaint does any work, or merely renames the difficulty while leaving it intact. Third, whether the problem of the posthumous career is fatal to the framework or is its best part, and what follows for the rest if it is fatal. Fourth, which of the three sections is doing the least work and ought to be cut. Fifth, whether the conclusion follows — whether the Stake really licenses more invention than the Record does, or whether I have smuggled in a permission the argument does not grant. And finally, the strongest objection to the whole thing that I have failed to raise, together with the place where a reader who is not a philosopher will stop following me.
reasoning: |-
  Here's a thinking process that leads to the critique:

  1.  **Analyze the Request:**
      *   **User:** A novelist working on a book about a real, recently deceased public figure.
      *   **Context:** There are surviving family members arguing about her legacy. The author has drafted a "preface to working notes" (an ethical framework) to guide their writing.
      *   **Task:** Provide hard, critical comments on the drafted essay ("On the Three Debts").
      *   **Specific Questions to Answer:**
          1.  Are the three debts distinct, or is "Stake" just "Person" renamed? (Does the ordering collapse?)
          2.  Does replacing "consent" with "grounds for complaint" do any work?
          3.  Is the "problem of the posthumous career" fatal or the best part? What follows?
          4.  Which section does the least work and should be cut?
          5.  Does the conclusion follow? (Does Stake license more invention than Record?)
          6.  What is the strongest objection not raised, and where will a non-philosopher reader stop following?

  2.  **Analyze the Essay ("On the Three Debts"):**
      *   **Core Argument:** Novelists owe the dead three debts: Record (accuracy of deeds), Person (fairness of character), Stake (not conscripting them for meanings they didn't choose).
      *   **Hierarchy:** Stake > Person > Record.
      *   **Key Shift:** Move from "consent" (can't get it) to "legitimacy/grounds for complaint."
      *   **Self-Critique:** Acknowledges the "problem of the posthumous career" (she didn't care about reputation; we created that interest).
      *   **Conclusion:** Obligation runs to the Stake, licensing a middle ground of invention.

  3.  **Drafting the Critique (Iterative Process):**

      *   *Question 1: Distinctness of Debts (Record, Person, Stake).*
          *   *Thought:* Record is facts. Person is interpretation of psychology/motivation. Stake is *usage*.
          *   *Critique:* They are distinct, but "Person" and "Stake" bleed. If I characterize you wrongly (Person), am I not also making you carry a meaning you didn't choose (Stake)?
          *   *Refinement:* The distinction holds if "Stake" is about *instrumentalization*. Record = What happened. Person = Who you were. Stake = What you are *for*.
          *   *Verdict:* Distinct, but the boundary between Person and Stake is porous. The ordering is provocative but defensible.

      *   *Question 2: Consent vs. Grounds for Complaint.*
          *   *Thought:* Consent is binary (yes/no). Grounds for complaint is normative (reasonable/unreasonable).
          *   *Critique:* This is the strongest philosophical move. It shifts from a contractual model (impossible) to a tort model (negligence/harm).
          *   *Verdict:* It does work. It prevents the "she can't say no so I can do anything" trap.

      *   *Question 3: Problem of the Posthumous Career.*
          *   *Thought:* If she didn't care, why protect her reputation?
          *   *Critique:* This is the most honest part. If fatal, the whole project is narcissism (the author caring, not the subject).
          *   *Resolution:* It's not fatal if framed as a debt to the *living* survivors or the *truth* of her indifference. But the essay says the debt is to *her*.
          *   *Verdict:* It's the best part because it shows intellectual honesty. It threatens the framework but saves it from pretension.

      *   *Question 4: Weakest Section.*
          *   *Thought:* The "Record" section feels a bit standard. "Accuracy is for the living" is a common trope.
          *   *Critique:* The "Person" section is also a bit thin ("novelist not obviously worse placed than a niece").
          *   *Verdict:* The "Record" section is the least interesting. It sets up a straw man of "defenders of the Record."

      *   *Question 5: Does the Conclusion Follow?*
          *   *Thought:* If Stake is paramount, does that allow *more* invention?
          *   *Critique:* Yes, because you can change facts (Record) to preserve the meaning (Stake). But does it allow *less* than Art claims? Yes, because Art often claims total freedom.
          *   *Verdict:* It follows, but it's a risky license. Changing facts to save "meaning" is how propaganda works. Needs caution.

      *   *Question 6: Strongest Objection & Reader Drop-off.*
          *   *Objection:* The survivors. The essay focuses on the dead woman. The real ethical friction is with the *grieving family*.
          *   *Drop-off:* The "legitimacy/grounds for complaint" abstraction. It gets dry.
          *   *Verdict:* The omission of the survivors is the biggest hole.

  4.  **Refining the Tone:**
      *   The user asked for "hard rather than kind."
      *   Avoid praise unless it serves the critique.
      *   Be precise, analytical, and slightly ruthless.
      *   Match the intellectual register of the essay (philosophical, precise).

  5.  **Final Polish (incorporating into the response structure):**
      *   *Introduction:* Acknowledge the strength of the draft but set the stage for the critique.
      *   *Address the 6 specific points:* Ensure each is answered clearly.
      *   *Synthesis:* Offer a final verdict on the utility of the essay for the novelist's actual work.

      *(Self-Correction during drafting)*: I need to make sure I don't just answer the questions but explain *why*. For instance, on the "Stake vs. Person" distinction, I need to be clear that violating the Person often violates the Stake, which makes the hierarchy tricky.
      *On the "Posthumous Career":* If she didn't care, protecting her "Stake" might be protecting *our* comfort, not her interest. I need to press this hard.
      *On the Survivors:* This is the elephant in the room. The prompt mentions them ("left survivors... arguing"). The essay ignores them. This is a critical failure in the ethical framework.

  6.  **Final Review against constraints:**
      *   Did I answer all 6 points? Yes.
      *   Is the tone hard/critical? Yes.
      *   Is it helpful to a novelist? Yes, by pointing out practical ethical blind spots.

      *(Final thought on the "Record" section)*: The author says Record is the weakest debt. But in a legal sense (defamation/libel), Record is the strongest. The essay ignores the legal reality for the philosophical one. I should mention that.

      *(Final thought on "Grounds for Complaint")*: Who judges the grounds? The author? That's circular. I need to point out the subjectivity there.

      Okay, ready to write.cw
answer: |-
  This is a rigorous, intellectually honest piece of thinking. It is better than most prefaces and better than most ethical frameworks for historical fiction. However, you asked for hard comments, and there are structural weaknesses and evasions here that threaten to undermine the very protection you seek to build.

  Here are my responses to your six specific queries, followed by a summary observation.

  **1. Are the three debts distinct, or does the ordering collapse?**
  They are distinct, but your hierarchy is unstable. You argue that *Stake* (instrumentalization) trumps *Person* (character), which trumps *Record* (facts). The collapse happens between *Person* and *Stake*.
  If I characterize you falsely (*Person*), I am almost by definition making you carry a meaning you did not choose (*Stake*). If you were courageous and I write you as cowardly, I have violated the *Person*, but I have also conscripted you into a narrative of cowardice you rejected.
  The distinction only holds if *Stake* refers specifically to *ideological* conscription (making you a mascot for a cause) while *Person* refers to *psychological* fidelity. If you maintain that distinction, the ordering holds. If you blur them, the *Stake* swallows the *Person*, and your framework becomes a license to distort character so long as the "higher meaning" remains intact. That is a dangerous license for a novelist.

  **2. Does replacing consent with grounds for complaint do any work?**
  Yes, this is the strongest philosophical move in the essay. Consent is a binary switch that is broken by death; "grounds for complaint" is a normative standard that survives it. It shifts the ethics from contract law to tort law (negligence/harm).
  However, it creates a vacuum of adjudication. *Who* judges the grounds for complaint? You write, "ask not whether she would have consented... but whether she would have had grounds." Since she cannot speak, you are the one judging whether her hypothetical grounds are valid. You have not solved the subjectivity problem; you have merely moved it from "guessing her yes/no" to "guessing her outrage." It is an improvement, but do not pretend it removes the author's ego from the equation. It centers it further.

  **3. Is the problem of the posthumous career fatal or the best part?**
  It is the best part, precisely because it threatens to be fatal. It is the moment the essay stops posturing and starts thinking.
  If it is fatal, it dissolves the framework: if she didn't care, your "debts" are actually debts to yourself (your conscience) or to the survivors (their feelings), not to her.
  *What follows if it is fatal:* You must reframe the *Stake*. It is not her interest in not being conscripted; it is the *world's* interest in not having reality distorted. Or, you must admit that the debt is to the survivors who *do* care. If you keep the framework as is, you are protecting a phantom interest. I advise you to lean into the fatality. Admit that you are protecting a reputation she might have scorned. That honesty is more compelling than a shaky metaphysical claim about her "interests."

  **4. Which section is doing the least work and ought to be cut?**
  The section on the *Record*.
  "The Record is the weakest debt... Accuracy about the past is owed to the living." This is a standard trope in historical fiction debates. It sets up a straw man of the "fact-checker" to knock down. It doesn't advance your specific argument about the *Stake*. You can imply the subordination of fact to meaning without devoting a paragraph to dismissing facts. The energy here should be redirected to the *Survivors*, whom you mention in your prompt but ignore in the essay.

  **5. Does the conclusion follow? Does the Stake license more invention?**
  The conclusion follows logically from your premises, but it smuggles in a risk you acknowledge only glancingly.
  You argue the *Stake* licenses *more* invention than the *Record* allows. This is true: you can change dates and quotes (Record) to preserve the integrity of her agency (Stake).
  But you also claim it licenses *less* than the defenders of *Art* claim. This is where the logic wobbles. Defenders of Art often claim the right to conscript reality for aesthetic truth. If your *Stake* forbids conscription, you are indeed restricting Art. But is "not being made to carry a meaning she never chose" compatible with the novelistic form? A novel *assigns* meaning. That is its function. To write a novel about her is to conscript her. You cannot fully pay the debt of the *Stake* and write the book. You need to acknowledge that the debt will be breached, not just balanced.

  **6. The strongest objection not raised and the reader drop-off.**
  *The Strongest Objection:* **The Survivors.**
  You mention them in your prompt ("left survivors... arguing over what she was"), but they are absent from the essay. Your framework is a monologue between you and the dead woman. The ethical friction, however, is not with the dead; they feel nothing. The friction is with the living who must endure your book.
  If you violate the *Stake*, the dead woman suffers nothing. Her children do. By framing this as a debt to *her*, you insulate yourself from the actual harm, which is inflicted on the grieving. A "ground for complaint" is most legitimately held by the niece, not the corpse. Ignoring them makes this essay feel like a solipsistic exercise in absolving your own guilt rather than engaging with the human cost of your project.

  *The Reader Drop-off:*
  The paragraph beginning "But I am troubled by a difficulty..."
  This is where the abstract philosophy turns inward. A non-philosopher reader (or a family member reading this later) will stop following you when you suggest the debt might be owed to a person you invented. It sounds like navel-gazing. It undermines the authority of the manifesto you just built. Keep the insight, but phrase it as a limitation of the medium, not a metaphysical puzzle.

  **Summary Verdict**
  This is a sophisticated shield, but it is designed to protect *you* (the artist) more than *her* (the subject) or *them* (the family). You have constructed a system where you can violate facts and character so long as you claim to be honoring the "Stake." Since you are the sole judge of the Stake, this is a recipe for self-deception.

  To make this useful, you must break the seal between the dead and the living. Acknowledge that the "Stake" is often held by the survivors. Acknowledge that the "Posthumous Career" is a burden you are imposing, not one she chose. If you do that, this preface moves from a justification to a confession. That is a stronger place from which to write.
