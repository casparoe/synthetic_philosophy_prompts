prompt: |-
  I've got a semester free and I keep flip-flopping on whether 'why Britain and not China?' is even a well-posed question, or whether it's just a two-case study with no variance and a lot of narrative on top. A friend's line is that the fix is to stop treating 'Britain' and 'China' as agents and treat them as two draws from a distribution of possible political economies — then the real question is about the shape of that distribution, not about either case. I can't add archival evidence, so the only lever I've got is conceptual. Given that, which open questions in this area are actually worth a semester, in what order, and which are upstream of which? I care less about the list of questions than about the criteria — what makes a question load-bearing here, how much rides on fixing the framing first versus just committing to a mechanism (institutions, coal, colonies, factor prices) and defending it, and what would make you reorder the whole thing. Also, which of the 'open questions' people cite are really just the well-posedness worry in disguise?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Deconstruct the User's Problem:**
