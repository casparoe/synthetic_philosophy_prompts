answer: |-
  This is a sophisticated methodological bind. You are correctly identifying that the "Great Divergence" literature often suffers from *post-hoc* storytelling masquerading as causal inference. Your friend's advice is the correct move for a conceptual project: shift from **case-based causal attribution** ("Coal caused UK growth") to **selection-based population inference** ("What is the probability of growth given a bundle of traits?").

  Since you cannot add data, your value add must be **logical consistency, model specification, and typological clarity**. You are acting as a theorist or a methodologist, not a historian.

  Here is the breakdown of criteria, the disguised well-posedness worries, and a strategic order of operations for a semester.

  ---

  ### I. The Criteria: What Makes a Question "Load-Bearing"?

  Since you are working without archives, a question is only worth your time if it resolves ambiguity in the *logic* of the debate, not the *facts*. Use these three criteria to filter potential questions:

  **1. The Counterfactual Stability Test**
  *   **Bad Question:** "Did coal cause the Industrial Revolution?" (This is a binary fact check).
  *   **Load-Bearing Question:** "Under what parameter values does 'access to coal' switch from a negligible factor to a binding constraint?"
  *   **Why:** This forces you to define the *mechanism* (e.g., coal lowers energy costs $\rightarrow$ incentivizes labor-saving tech). If the mechanism is robust, it should hold in a model even if you swap 'Britain' for 'Belgium'. If the question collapses when you change the case, it was never a general question; it was a narrative about Britain.

  **2. The Agent-Structure Decoupling**
  *   **Bad Question:** "Why was the British state more supportive of innovation than the Chinese state?" (Treats states as unitary agents with preferences).
  *   **Load-Bearing Question:** "What coalition structures make 'support for innovation' a stable equilibrium for a ruler?"
  *   **Why:** This addresses your worry about treating nations as agents. It shifts the focus to *political economy constraints*. A ruler in Beijing and a ruler in London might have the same preferences, but face different veto players. This makes the "distribution of political economies" concrete.

  **3. The Necessary vs. Sufficient Distinction**
  *   **Bad Question:** "Which factor was most important: Institutions or Geography?"
  *   **Load-Bearing Question:** "Is Factor X a *trigger* (requires high baseline) or a *foundation* (required for any growth)?"
  *   **Why:** Much of the literature talks past itself because Allen (Factor Prices) and North (Institutions) are often describing different stages of the same process. A conceptual project that maps the *sequence* of constraints is more valuable than one that picks a winner.

  ---

  ### II. Which "Open Questions" are Disguised Well-Posedness Worries?

  You asked which debates are actually just anxiety about the $N=2$ problem in disguise. Here are the three biggest culprits:

  **1. "When did the Divergence begin?" (1300s vs. 1750s)**
  *   **The Disguise:** This is often a proxy for "Is the Industrial Revolution a continuous accumulation of small advantages (Malthusian drift) or a discrete phase shift (Modern Growth)?"
  *   **Why it's a framing issue:** If you believe growth is continuous, asking "Why Britain and not China" is valid for any date. If you believe it's a phase shift, the question is only well-posed for the specific decade the phase shift occurred. Debating the *date* is often a way to avoid defining the *process*.

  **2. "Did China have the potential to industrialize?" (The Needham Question)**
  *   **The Disguise:** This is a counterfactual selection bias problem.
  *   **Why it's a framing issue:** Asking if China *could* have industrialized assumes the "distribution of political economies" allows for multiple industrial equilibria. If the industrial equilibrium is unique and rare (a "black swan"), asking why China missed it is like asking why you didn't win the lottery. The question presupposes that industrialization is the *expected* outcome of development, which is historically dubious.

  **3. "Institutions vs. Culture vs. Geography"**
  *   **The Disguise:** This is an omitted variable bias problem masquerading as competing theories.
  *   **Why it's a framing issue:** Institutions are often endogenous to Geography (e.g., island status affects state capacity). Culture is often endogenous to Institutions. Debating them as independent variables is statistically ill-posed without a model of their co-evolution.

  ---

  ### III. Strategic Order of Operations (The Semester Plan)

  If I were in your position, I would not try to solve the Great Divergence. I would try to **formalize the comparison**. Here is the order of operations, upstream to downstream.

  #### Phase 1: Define the Distribution (Weeks 1-4)
  *   **Task:** Operationalize your friend's advice. Do not start with Britain/China. Start with the *space of possibilities*.
  *   **Conceptual Work:** Define the axes of your "distribution of political economies."
      *   *Axis A:* State Capacity (Extractive vs. Administrative).
      *   *Axis B:* Elite Constraints (Absolutist vs. Pluralist).
      *   *Axis C:* Factor Endowments (Land/Labor ratio, Energy access).
  *   **Deliverable:** A typology. Where do UK, China, Netherlands, Japan, and India fall on this map *in 1700*?
  *   **Why Upstream:** You cannot explain selection until you define the sample space. If you can't define the distribution, you can't claim Britain is an outlier or a representative draw.

  #### Phase 2: The Mechanism Audit (Weeks 5-8)
  *   **Task:** Take the canonical mechanisms (Allen's High Wages, Pomeranz's Ghost Acreage, Koyama/Rubin's Rule of Law) and test them against your typology, not just the history.
  *   **Conceptual Work:** For each mechanism, ask: "Does this mechanism predict growth *only* for Britain, or for a *class* of economies?"
      *   *Example:* If High Wages cause innovation, why didn't the Netherlands (high wages) industrialize first?
      *   *Example:* If Institutions cause growth, why did Song China (strong property rights) not sustain it?
  *   **Deliverable:** A matrix showing which mechanisms are *necessary*, *sufficient*, or *context-dependent* based on your Phase 1 typology.
  *   **Why Midstream:** This prevents you from committing to a mechanism before you know what it applies to.

  #### Phase 3: The Selection Model (Weeks 9-12)
  *   **Task:** Synthesize Phase 1 and 2 into a selection argument.
  *   **Conceptual Work:** Argue that the "Great Divergence" is not about Britain winning, but about the *variance* of the distribution increasing.
      *   *Hypothesis:* Perhaps most political economies are trapped in a low-growth equilibrium. Britain didn't "succeed"; it escaped the trap. China didn't "fail"; it remained in the trap.
      *   *Reframing:* The question changes from "Why Britain?" to "What shrinks the basin of attraction for the Malthusian trap?"
  *   **Deliverable:** A conceptual paper arguing that the unit of analysis should be the *stability of the equilibrium*, not the *national characteristics*.
  *   **Why Downstream:** This is your contribution. It uses the previous work to reframe the debate.

  ---

  ### IV. Framing vs. Mechanism: Where to Bet Your Chips

  You asked how much rides on fixing the framing versus committing to a mechanism.

  **Verdict: 80% on Framing, 20% on Mechanism.**

  **Reasoning:**
  1.  **Mechanisms are Dime a Dozen:** There are 50 plausible mechanisms for the Industrial Revolution. Defending "Coal" against "Institutions" without new data is a stalemate. You will not convince a historian of China that they are wrong about Chinese institutions, nor a British economic historian that coal didn't matter.
  2.  **Framing is Scalable:** If you successfully argue that "Britain vs. China" is the wrong comparison, and that "High-Pressure vs. Low-Pressure Political Equilibria" is the right comparison, you have contributed a **tool** that others can use. Even if your specific mechanism is wrong, your framework for analyzing the problem remains useful.
  3.  **The "Agent" Trap:** If you commit to a mechanism (e.g., "Coal") while treating Britain as an agent, you are vulnerable to the critique: "But the British East India Company made decisions, not 'Britain'." If you fix the framing first (Political Economy Distribution), the mechanism becomes a parameter within that system, which is much harder to attack.

  **What would make me reorder the whole thing?**
  *   **Discovery of a Formal Model:** If you find a specific growth model (e.g., Unified Growth Theory by Galor) that already formalizes the "distribution" idea, skip Phase 1 and spend the semester applying *that* model to the historical cases. Don't reinvent the theoretical wheel.
  *   **Regional Heterogeneity:** If you realize "China" is too coarse (e.g., the Lower Yangzi is fundamentally different from the North), you must move the "Define the Distribution" phase earlier and make it sub-national. This increases the $N$ and makes the distribution argument empirically stronger, even conceptually.

  ### Summary Advice
  Your friend is right. The "Why Britain not China" question is a **selection bias trap**.
  *   **Don't** try to prove why Britain industrialized.
  *   **Do** try to prove why the *question* assumes a deterministic path that didn't exist.
  *   **Your Lever:** Use the $N=2$ constraint as a feature, not a bug. Argue that with $N=2$, we cannot estimate coefficients, so we must estimate *structural stability*.

  Spend the semester building the **typology of political economies**, not the history of the Industrial Revolution. That is the only conceptual work that survives the "no archives" constraint.
