prompt: |-
  You are a political philosopher with a specialty in democratic theory and the conceptual foundations of political legitimacy, and I'd like you to help me turn a half-formed idea into a short research proposal. Some context: I'm a second-year PhD student in political theory, and I'm applying for a one-semester writing fellowship at my university's center for ethics and public affairs. What they want from applicants is a two-to-three page proposal (call it 1,200 words) describing the chapter I would write during the fellowship — not a chapter outline so much as a case that the chapter is worth writing and can actually be finished in a semester. I've been circling what people call the boundary problem: the thought that any democratic decision presupposes some prior decision about who is entitled to take part in it, and that this prior decision cannot itself be made democratically without circularity or an infinite regress. I've become suspicious of how quickly the literature treats this as either a fatal paradox or a pseudo-problem to be dissolved by fiat, and my half-formed hunch is that both the panic and the dismissal quietly inherit an assumption I don't think anyone has defended out loud — that membership in the demos is binary, a line you either cross or don't. I want to explore whether treating the demos as graded, a bundle of decision-specific franchises that individuals can hold to different degrees and that can overlap across persons and across decisions, changes what the regress argument actually shows: perhaps it exposes a real indeterminacy, perhaps it exposes only a harmless feature of any revisable practice, perhaps it reframes the whole question. I keep returning to a handful of concrete cases that I'd like the proposal to be able to accommodate without gerrymandering: municipalities that let resident non-citizens vote locally but not nationally; diaspora members who vote in a homeland they do not live in; children who are fully subject to the law but not participants in making it; and the consultative status that NGOs and firms are granted at some international bodies, where they can shape outcomes without deciding them. Turn this into a proposal with a precise statement of the question stated so that it has a determinate answer, an account of why the existing positions genuinely leave that question open, the method — what I would actually do, month by month across the semester — and an honest statement of what would count as the project succeeding and what would count as it failing. I will supply the citations myself, so please do not give me a bibliography or a literature review by name; refer to positions and arguments rather than to who held them, and if you need to gesture at a view, describe it instead of attributing it. Before you start drafting, brainstorm privately for yourself two or three candidate readings of the regress argument, choose the one that yields the sharpest and most tractable question, and let that choice govern the rest. Write in the register of a real fellowship proposal: first person, concrete, no throat-clearing, willing to say plainly where the idea is still shaky.

  After the proposal itself, give me a structured summary of the whole thing as a JSON object with exactly these fields: "central_question" (the question as you have stated it, in one or two sentences); "gap" (a short paragraph on why the existing positions leave it open); "core_move" (one sentence naming the graded-membership idea and what it is supposed to do); "method_steps" (an array of objects, each with "period" and "activity", covering the semester); "success_criteria" (an array of strings, each a concrete outcome that would show the project worked); "failure_criteria" (an array of strings, each a concrete outcome that would show it did not); "scope_assessment" (a brief note on whether this fits a semester and, if not, what to cut); and "main_risk" (the single biggest thing that could sink the project). Make sure the JSON is valid and that its contents match the prose proposal rather than contradicting it.
