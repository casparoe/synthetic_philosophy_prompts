answer: |-
  **Project Title:** The Graded Demos: Dissolving the Boundary Problem through Fractional Membership

  **Proposal**

  Democratic theory faces a persistent embarrassment known as the boundary problem. Any democratic decision presupposes a prior decision about who is entitled to participate in making it. Yet that prior decision cannot itself be made democratically without circularity or infinite regress. The literature generally splits into two camps regarding this regress. One treats it as a fatal paradox, suggesting democracy is logically incoherent at its foundation. The other treats it as a pseudo-problem, dissolved by fiat through external norms like coercion, culture, or pre-political identity. Both responses, I argue, inherit an undefended assumption: that membership in the *demos* is binary. They assume an individual is either fully in or fully out, a voter or a non-voter, a member or a stranger.

  My project challenges this binary ontology. I propose that the regress argument loses its catastrophic force if we treat the *demos* not as a fixed circle with a sharp boundary, but as a graded bundle of decision-specific franchises. On this view, individuals hold membership rights to varying degrees across different domains. They may hold full franchises in local municipal elections, partial consultative franchises in international bodies, and no franchise in national security matters, simultaneously. This is not merely a description of current irregularities; it is a conceptual claim about what democratic legitimacy requires. If membership is graded, the demand for a single, prior, democratic decision on "the people" disappears. There is no single boundary to draw, only a continuous negotiation of overlapping jurisdictions.

  However, this move risks trading a paradox for a mush. If everyone is a member to some degree, does the concept of membership retain any normative bite? This leads to the precise question driving this chapter: **Does modeling democratic membership as a graded bundle of franchises dissolve the logical regress of the boundary problem, or does it merely relocate the indeterminacy to the definition of the grades?**

  Existing positions leave this question open because they refuse to engage with the topology of membership. The "fatal paradox" camp assumes that if the boundary cannot be drawn democratically, legitimacy fails. They do not consider that legitimacy might not require a single boundary. The "pseudo-problem" camp assumes that non-democratic norms (like residence or citizenship) satisfactorily stop the regress. They do not explain why these norms justify a binary exclusion rather than a graded inclusion. Both sides assume that for a decision to be democratic, the set of deciders must be determinate prior to the decision. My hypothesis is that the set can be determinate *through* the decision, provided the stakes and franchises are aligned proportionally.

  To test this, I will apply the graded model to four concrete cases that binary models struggle to accommodate without gerrymandering. First, municipalities that allow resident non-citizens to vote locally but not nationally. Binary models must call these residents either members (contradicting national exclusion) or non-members (contradicting local inclusion). A graded model accepts them as partial members. Second, diaspora members voting in homelands they do not inhabit. Binary models strain to justify their inclusion via "affected interests" without opening the floodgates to everyone affected. A graded model allows for a specific franchise tied to cultural stake rather than residence. Third, children subject to law but excluded from voting. Rather than viewing them as future members, a graded model might recognize their current subjection as warranting a proxy franchise. Fourth, NGOs and firms with consultative status at international bodies. They shape outcomes without deciding them. Binary models dismiss this as non-democratic lobbying; a graded model might recognize it as a legitimate, limited franchise.

  **Method and Work Plan**

  This project is designed for completion within a single semester. I will proceed in four phases, corresponding to the four months of the fellowship.

  *Month 1: Conceptual Reconstruction.* I will finalize the taxonomy of "graded membership." I need to distinguish between graded membership (who you are) and graded franchises (what you can do). I suspect the latter is more tractable. I will map the existing arguments regarding the boundary problem, specifically isolating where the binary assumption does the heavy lifting. The deliverable for this month is a detailed conceptual outline and a literature matrix that categorizes existing solutions by their implicit assumptions about membership topology.

  *Month 2: Case Study Analysis.* I will apply the graded franchise model to the four cases listed above. The goal is not merely to show the model fits, but to stress-test it. Does it justify too much? If NGOs get a franchise, do corporations get votes proportional to tax contribution? I will write draft sections for each case, focusing on whether the graded model resolves the specific tension each case presents regarding the boundary problem. The deliverable is a set of four case study drafts, approximately 2,000 words each.

  *Month 3: Synthesis and Argument.* I will integrate the case studies into the central argument about the regress. This is the hardest phase. I must demonstrate that the graded model answers the central question: does it dissolve the regress or relocate it? I will draft the core philosophical argument, connecting the empirical cases back to the logical structure of democratic legitimacy. The deliverable is a complete first draft of the chapter.

  *Month 4: Revision and Refinement.* I will focus on objections. The primary objection will be that graded membership undermines political equality. I need to show how equality functions in a graded system (e.g., equality of franchise within a specific domain, rather than equality of total membership). I will revise the draft for clarity, argumentative strength, and word count compliance. The deliverable is the final chapter manuscript.

  **Success and Failure Criteria**

  I define success concretely. The project succeeds if: (1) I produce a complete chapter draft of 8,000–10,000 words; (2) I arrive at a determinate answer to the central question (even if that answer is "it relocates the indeterminacy but makes it harmless"); and (3) the graded model successfully accommodates all four case studies without requiring ad-hoc exceptions.

  The project fails if: (1) I become bogged down in taxonomy and fail to return to the regress argument; (2) the graded model proves incapable of distinguishing between legitimate consultative status and illegitimate corruption (e.g., buying influence); or (3) I conclude that the binary assumption is actually necessary for political equality, thereby undermining my own hypothesis. I am willing to accept failure on the hypothesis if the argument is rigorous; a proven negative is still a result. However, failing to produce a complete draft due to scope creep would be a procedural failure.

  **Scope and Risk**

  The scope is tight. I am not arguing for a full theory of global justice or constitutional design. I am arguing for a conceptual shift in how we define the *demos* to solve a specific logical problem. The main risk is that "graded membership" turns out to be merely a metaphor for existing federalist structures, offering no new philosophical leverage. If I find this to be the case in Month 2, I will pivot to arguing that the metaphor itself is what dissolves the panic, even if the institutional reality is unchanged. This fallback ensures the semester yields a defensible conclusion regardless of the empirical novelty.

