answer: |-
  # SEMINAR HANDOUT: MAPPING THE KNOBE EFFECT
  **Course:** PHIL 101 – Experimental Philosophy  
  **Topic:** The Side-Effect Effect (The Knobe Effect)  
  **TA:** [Your Name]

  ### INSTRUCTIONS
  Start at the top. For each question, imagine the specific case described. Answer based on your intuition about what *most people* would say, or what *you* think is the correct description of the case. Follow the arrow to your philosophical position.

  ---

  ### THE DECISION TREE

  **START:** Imagine the standard case. A Chairman starts a policy. He doesn't care about the side effect. The side effect happens.
  *   **Harm Case:** Policy hurts the environment. People say: "He harmed it *intentionally*."
  *   **Help Case:** Policy helps the environment. People say: "He did *not* help it *intentionally*."
  *(This difference is the "Asymmetry.")*

  #### BRANCH 1: THE DRESS CODE TEST (Norm Type)
  **Case:** Swap the "Environment" for an **Office Dress Code**.
  *   **Violation:** Chairman wears sweatpants (against code) to save time. Policy passes.
  *   **Conformity:** Chairman wears a suit (follows code) despite discomfort. Policy passes.
  *   **Question:** Do people still say he wore the sweatpants *intentionally*, but deny he wore the suit *intentionally*?

  *   **NO (Asymmetry vanishes with non-moral norms):** → Go to **BRANCH 2**.
  *   **YES (Asymmetry survives for etiquette/conventions):** → Go to **BRANCH 3**.

  #### BRANCH 2: THE BLAME STRIP TEST (Moral Specificity)
  **Case:** Keep the **Environment** (Moral), but remove the ability to blame or praise.
  *   **Scenario:** The Chairman is *forced* by a higher board to pass the policy, or the outcome is purely random luck unrelated to his choice, but the side effect still occurs.
  *   **Question:** When you strip out the possibility of holding him responsible, does the asymmetry disappear (i.e., do you stop saying "intentional harm")?

  *   **YES (Asymmetry vanishes without responsibility):** → **LEAF A**
  *   **NO (Asymmetry remains even without responsibility):** → **LEAF B**

  #### BRANCH 3: THE SYNONYM TEST (Wording Sensitivity)
  **Case:** Keep the **Dress Code** (Non-Moral Norm), but change the question.
  *   **Scenario:** Instead of asking "Did he do it *intentionally*?", ask "Did he do it *knowingly*?" or "Did he do it *deliberately*?"
  *   **Question:** Does the asymmetry disappear when you swap the word "intentionally"?

  *   **YES (Asymmetry vanishes with different words):** → **LEAF C**
  *   **NO (Asymmetry remains regardless of wording):** → **LEAF D**

  #### BRANCH 4: THE THERMOSTAT TEST (Agent Type)
  **Case:** Replace the Chairman with a **Smart Thermostat**.
  *   **Scenario:** The thermostat is programmed to maximize efficiency. A side effect is that it overheats the room (bad for plants) or warms it perfectly (good for plants).
  *   **Question:** Do you say the thermostat overheated the room *intentionally*, but deny it warmed the room *intentionally*?

  *   **YES (Asymmetry applies to machines):** → **LEAF E**
  *   **NO (Asymmetry requires a human mind):** → Return to your previous Leaf (A, B, C, or D).
  *   **CONTRADICTION (You said "YES" here but "YES" to Branch 2):** → **LEAF F**

  ---

  ### THE POSITIONS (LEAVES)

  **LEAF A: The Blame Leakage View**
  *   **Position:** The effect is really blameworthiness leaking into our attributions.
  *   **Most Awkward Commitment:** You must admit subjects are lying (unconsciously) and answering "Is he bad?" instead of "Did he intend it?"
  *   **⚠️ WARNING:** Hard to empirically distinguish from **Leaf B** because moral badness and blame usually travel together.

  **LEAF B: The Deep Asymmetry View**
  *   **Position:** The folk concept of intentional action genuinely is asymmetric (moral valence is part of the definition).
  *   **Most Awkward Commitment:** You must accept that morality changes *what happened* (the action description), not just whether we like the agent.

  **LEAF C: The Performance Glitch View**
  *   **Position:** It's a performance glitch; the underlying competence is symmetric.
  *   **Most Awkward Commitment:** You have to tell ordinary speakers they are systematically mistaken about the grammar of their own language.

  **LEAF D: The Normative Concept View**
  *   **Position:** Normativity is baked into the concept itself (not just morality, but *any* norm).
  *   **Most Awkward Commitment:** You must accept that violating a dress code is the same *kind* of intentional structure as committing a murder.

  **LEAF E: The Causal Reductionism View** *(Extra Credit Leaf)*
  *   **Position:** The effect isn't about intention at all, but about causal strength and counterfactuals.
  *   **Most Awkward Commitment:** You have to explain why we use mental state words ("intend") to describe the heating habits of thermostats.

  **LEAF F: NOBODY CAN STAND HERE (Dead End)**
  *   **Position:** Logical Contradiction.
  *   **Most Awkward Commitment:** You believe the effect requires a mind capable of blame (Branch 2) but also applies to mindless machines (Branch 4).

  ---

  ### DISCUSSION QUESTIONS FOR SECTION
  1.  If you landed on **Leaf A** or **Leaf B**, look at the warning flag. Can you design a case where an agent is *blameworthy* but the act is *not intentional*, or vice versa?
  2.  If you landed on **Leaf D**, does this mean "intentional" is just a fancy word for "abnormal"?
  3.  Why does **Leaf F** exist? What does it tell us about the relationship between *agency* and *norms*?
