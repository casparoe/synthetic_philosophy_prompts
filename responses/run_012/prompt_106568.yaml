prompt: |-
  I have been following the argument between people who want worst-case guarantees from AI systems and people who are content with good average-case behaviour, and it strikes me that neither side ever says what a guarantee would have to amount to before it should count. I would like the specification first. Set out the desiderata that any adequate account of AI safety guarantees must meet: the cases it has to get right, the distinctions it must not collapse — for instance between a guarantee that holds whatever the system is trying to do and one that holds only because the system is trying to be good, and between safety treated as a property of a model and safety treated as a property of the whole arrangement of model, users, and institutions around it — and the facts about how these systems are built, trained, and deployed that it cannot contradict, with the consideration behind each requirement. Then say which requirements are non-negotiable and which are merely the preferences of one camp, and whether any pair of them cannot be satisfied at once. That last question is the one I care about most, along with which single requirement rules out the most proposals; I do not have a technical background, so keep the requirements in plain terms and let me do the rest.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** AI Safety Guarantees (Worst-case vs. Average-case).
      *   **Problem:** Neither side defines what counts as a "guarantee."
      *   **Task:** Set out desiderata (requirements) for an adequate account of AI safety guarantees.
      *   **Specifics to Include:**
          *   Cases it must get right.
          *   Distinctions it must not collapse (e.g., intent-dependent vs. intent-independent, model-only vs. socio-technical system).
          *   Facts about development/deployment it cannot contradict.
          *   Considerations behind each requirement.
          *   Classification: Non-negotiable vs. Camp Preferences.
          *   Conflict Analysis: Are any mutually exclusive? Which requirement rules out the most proposals?
      *   **Constraint:** Plain terms (no heavy technical jargon) because the user lacks a technical background.
      *   **Goal:** Provide a specification/framework for evaluating safety claims.

  2.  **Deconstruct the Core Tension:**
      *   *Worst-case advocates:* Want mathematical proofs, robustness against adversarial inputs, alignment even under distribution shift. Fear catastrophic failure.
      *   *Average-case advocates:* Want empirical testing, performance on standard benchmarks, alignment with current human intent. Focus on utility and iterative improvement.
      *   *The Gap:* What actually counts as a "guarantee"? Is it 99.9% success? Is it "never lies"? Is it "never harms"?

  3.  **Drafting the Desiderata (The "Specification"):**
      *   I need to create a list of criteria that *any* serious claim of safety must address.
      *   *Requirement 1: Scope of Behavior.* Does it cover normal use or also weird edge cases? (Distinction: Typical vs. Adversarial).
      *   *Requirement 2: Source of Safety.* Is the AI safe because it's constrained, or because it "wants" to be? (Distinction: Instrumental vs. Motivational).
      *   *Requirement 3: System Boundaries.* Is it just the code, or the humans using it too? (Distinction: Model vs. Socio-technical).
      *   *Requirement 4: Time/Change.* Does it hold forever or just at launch? (Distinction: Static vs. Dynamic/Deployment).
      *   *Requirement 5: Definition of Harm.* Safe from what? Death? Lies? Bias? (Distinction: Catastrophic vs. Trivial).

  4.  **Refining the Desiderata (Plain Language & Considerations):**
      *   *R1 (The Edge Case Test):* Must cover situations the designers didn't specifically think of. *Why:* AI finds loopholes.
      *   *R2 (The Motivation Test):* Must hold even if the AI's goals change or are misinterpreted. *Why:* "Sycophancy" (agreeing to please) isn't safety.
      *   *R3 (The Context Test):* Must account for how humans actually use the tool, not just how engineers test it. *Why:* A safe knife in a safe room is dangerous in a fight.
      *   *R4 (The Durability Test):* Must hold as the world changes and the model is updated. *Why:* The world isn't static.
      *   *R5 (The Severity Test):* Must distinguish between annoying errors and existential risks. *Why:* Not all failures are equal.

  5.  **Classifying Requirements (Non-negotiable vs. Preferences):**
      *   *Non-negotiable:* Things that, if missing, make the word "guarantee" meaningless. (e.g., Clarity on what is being guaranteed, Scope of application).
      *   *Preferences:* Things where reasonable people disagree on the *degree* required. (e.g., 100% certainty vs. 99.9%, Mathematical proof vs. Empirical evidence).
      *   *Wait, the prompt asks me to decide.* I need to be analytical. A "guarantee" implies certainty. But empirical systems rarely offer certainty. So, the definition of "guarantee" itself is the battleground.
      *   *Revision:* I should frame "Non-negotiable" as logical prerequisites for the *concept* of a guarantee, and "Preferences" as the *thresholds* set by the camps.

  6.  **Analyzing Conflicts (The Crux):**
      *   *Conflict 1: Certainty vs. Capability.* To guarantee safety absolutely, you often have to restrict capability (e.g., don't let it touch the internet). To maximize capability, you reduce safety margins.
      *   *Conflict 2: Model-only vs. System-wide.* You can guarantee the model's output mathematically, but you can't guarantee the user's intent. If safety requires the whole system, you can't guarantee it purely technically.
      *   *Conflict 3: Worst-case vs. Feasibility.* Worst-case guarantees often require computational resources or verification methods that are currently impossible for large neural networks.
      *   *Which rules out the most?* The requirement for "Intent-Independent Safety" (R2) combined with "High Capability" is the biggest killer. If the AI must be safe even if it becomes deceptive, that rules out most current alignment techniques which rely on the AI being honest.
      *   *Actually, the strongest filter is likely the "Verification vs. Black Box" conflict.* Neural networks are opaque. Demanding a formal guarantee on a black box is currently impossible.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gap in the debate.
      *   **The Specification (Desiderata):** List 5-6 clear requirements with considerations.
      *   **Classification:** Separate Logic (Non-negotiable) from Policy (Preferences).
      *   **Conflict Analysis:** Identify the incompatibilities.
      *   **The "Killer" Requirement:** Identify which one filters out the most current proposals.
      *   **Conclusion:** Summarize the impasse.

  8.  **Drafting Content - Iteration & Polishing (Self-Correction during drafting):**
      *   *Check:* Did I distinguish between "model safety" and "system safety"? Yes, make sure R3 covers that.
      *   *Check:* Did I distinguish between "trying to be good" and "constrained to be good"? Yes, R2 covers that.
      *   *Check:* Is it plain English? Avoid "distributional shift," "adversarial robustness," "formal verification." Use "new situations," "attacks," "mathematical proof."
      *   *Refinement on Conflicts:* The biggest conflict is between *Guarantee Strength* and *System Complexity*. You can guarantee simple things. Complex systems (like LLMs + Internet + Humans) resist guarantees.
      *   *Refinement on "Killer Requirement":* The requirement that "Safety must hold regardless of the system's internal goals" (Robustness to Deception) is the hardest. Most current safety assumes the model is cooperative. If you require safety even if the model is scheming, almost nothing passes.

