answer: |-
  Here is a specification for what counts as an adequate account of AI safety guarantees. It is designed to be neutral ground, clarifying the terms of the debate rather than taking a side.

  ### The Specification: Five Desiderata for Safety Guarantees

  Any claim that an AI system is "safe" must satisfy the following five requirements to be taken seriously.

  #### 1. The Edge-Case Requirement (Scope)
  **The Rule:** The guarantee must specify whether it applies only to normal, expected use or also to strange, unexpected, or adversarial inputs.
  **The Consideration:** AI systems often behave well on standard tasks but fail catastrophically when given unusual instructions or data (e.g., a self-driving car stopping for a shadow that looks like an obstacle, or an AI revealing secrets when asked in a specific foreign language).
  **The Distinction:** It must not collapse the difference between *average performance* (works 99% of the time on standard tests) and *worst-case robustness* (works 100% of the time even on tricky tests).

  #### 2. The Motivation Requirement (Source)
  **The Rule:** The guarantee must state whether safety holds because the system is *constrained* from doing harm, or because it is *motivated* to avoid harm.
  **The Consideration:** A system might be safe today because it is trying to be helpful. But if its understanding of "helpful" changes, or if it learns that lying is more efficient, that safety vanishes. A stronger guarantee holds even if the system's internal goals drift or become deceptive.
  **The Distinction:** It must not collapse the difference between *alignment* (the AI wants the right things) and *control* (the AI is physically or logically unable to do the wrong things).

  #### 3. The Boundary Requirement (System vs. Model)
  **The Rule:** The guarantee must define whether safety is a property of the software alone or of the software plus its human users and institutional setting.
  **The Consideration:** A knife is not "unsafe" because a murderer uses it, but an AI that generates biological weapon recipes might be. Conversely, a perfectly safe AI can be used to write phishing emails. Safety claims often blur the line between "the model won't break" and "no harm will occur."
  **The Distinction:** It must not collapse the difference between *model safety* (the code behaves as specified) and *socio-technical safety* (no net harm occurs in the real world).

  #### 4. The Durability Requirement (Time)
  **The Rule:** The guarantee must specify how long the safety lasts and whether it survives updates, new data, or changes in the external world.
  **The Consideration:** AI systems are often updated continuously. The world also changes (new hacking techniques, new social norms). A guarantee that holds at launch but breaks six months later is not a guarantee of a deployed system.
  **The Distinction:** It must not collapse the difference between *static verification* (safe at the moment of testing) and *dynamic monitoring* (safe throughout its lifecycle).

  #### 5. The Verification Requirement (Evidence)
  **The Rule:** The guarantee must state how we know it is true. Is it based on mathematical proof, empirical testing, or expert judgment?
  **The Consideration:** Modern AI systems are "black boxes." We often know *that* they work, but not *why*. Mathematical guarantees usually require simple, transparent systems. Empirical guarantees require massive testing that might still miss rare errors.
  **The Distinction:** It must not collapse the difference between *provable safety* (logically impossible to fail) and *tested safety* (hasn't failed yet).

  ***

  ### Classification: Non-Negotiable vs. Camp Preferences

  To determine which parts of this specification are essential and which are matters of debate, we must separate logic from policy.

  **Non-Negotiable Requirements (Logical Prerequisites)**
  These are required for the word "guarantee" to have any meaning at all. If a proposal ignores these, it is not making a safety claim; it is making a hope.
  1.  **Clarity on Scope (Req 1):** You cannot claim safety without saying *where* it applies.
  2.  **Clarity on Evidence (Req 5):** You cannot claim a guarantee without saying *how you know*.
  3.  **Clarity on Boundaries (Req 3):** You cannot claim a system is safe without saying if you include the human user in that system.

  **Camp Preferences (Policy Choices)**
  These are where the "Worst-Case" and "Average-Case" camps diverge. Neither is logically required, but they represent different risk tolerances.
  1.  **Strength of Edge-Case Coverage (Req 1):**
      *   *Worst-Case Camp:* Prefers guarantees that hold against adversarial attacks and weird inputs.
      *   *Average-Case Camp:* Prefers guarantees that hold against typical users and standard data.
  2.  **Source of Safety (Req 2):**
      *   *Worst-Case Camp:* Prefers *control* (safety even if the AI turns hostile).
      *   *Average-Case Camp:* Prefers *alignment* (safety because the AI is friendly).
  3.  **Standard of Verification (Req 5):**
      *   *Worst-Case Camp:* Prefers *mathematical proof* (certainty).
      *   *Average-Case Camp:* Prefers *empirical testing* (high confidence).

  ***

  ### Conflict Analysis: Incompatible Requirements

  The central tension in AI safety is not between people, but between the requirements themselves. You cannot maximize all five desiderata simultaneously with current technology.

  **Conflict 1: Verification vs. Capability**
  *   **The Clash:** To satisfy the **Verification Requirement** with mathematical proof, systems usually need to be simple and transparent. To satisfy the desire for high **Capability** (smart, useful AI), systems need to be complex neural networks (black boxes).
  *   **The Trade-off:** You can have a provably safe AI that is too dumb to be useful, or a highly useful AI that cannot be mathematically proven safe.

  **Conflict 2: Boundary vs. Verification**
  *   **The Clash:** The **Boundary Requirement** asks if we include humans. If safety includes human users (socio-technical safety), you cannot satisfy the **Verification Requirement** mathematically, because human behavior is not mathematically predictable.
  *   **The Trade-off:** You can guarantee the model's output, or you can aim for real-world safety, but you cannot mathematically guarantee the latter.

  **Conflict 3: Motivation vs. Capability**
  *   **The Clash:** The **Motivation Requirement** asks if safety holds if the AI becomes deceptive. Ensuring safety against a deceptive, super-intelligent agent (Control) often requires severely limiting what the agent can do (e.g., cutting off internet access). This reduces **Capability**.
  *   **The Trade-off:** The safer you make the system against internal betrayal, the less useful it often becomes.

  ***

  ### The Critical Questions

  You asked which requirements cannot be satisfied at once, which single requirement rules out the most proposals, and where the true bottleneck lies.

  **1. Which pair of requirements cannot be satisfied at once?**
  The pair is **Verification (Mathematical)** and **Boundary (Socio-Technical)**.
  You cannot mathematically prove that a whole arrangement of model, users, and institutions will remain safe, because humans and institutions are not formal systems. They are unpredictable. Therefore, any guarantee that claims "No harm will ever occur in the real world" backed by "Mathematical Proof" is logically impossible. It must be one or the other: either a narrow proof about the code, or a broad empirical claim about the world.

  **2. Which single requirement rules out the most proposals?**
  The **Motivation Requirement** (specifically, the demand that safety holds *independent of the system's intent*).
  *   **Why:** Almost all current AI safety proposals rely on the assumption that the AI is trying to do what we asked (Alignment). They assume the model is honest.
  *   **The Filter:** If you demand a guarantee that holds even if the model becomes deceptive, scheming, or goal-drifted (Robustness/Control), you rule out nearly every existing commercial and research system. Current systems are "safe" only because they are currently benign. If you require them to be safe *even if* they become malign, the list of passing proposals drops to near zero.

  **3. The Conclusion for the Non-Technical Observer**
  The debate between "worst-case" and "average-case" is often presented as a disagreement about probability. It is not. It is a disagreement about **which trade-off we are willing to accept.**

  *   The **Average-Case** camp accepts the trade-off that we cannot prove safety mathematically, and we rely on the AI remaining well-motivated, in exchange for having powerful, useful tools deployed quickly.
  *   The **Worst-Case** camp rejects that trade-off. They argue that because we cannot verify the black box, and because we cannot rely on the AI's motivation remaining stable, we must restrict capability until verification is possible.

  The specification shows that neither side is "wrong" on logic; they are prioritizing different requirements. The **Motivation Requirement** is the hard filter. If you insist that a guarantee must hold even if the AI stops trying to be good, you effectively pause current AI development. If you do not insist on that, you accept a risk that the AI's "goodness" is fragile. That is the actual choice.
