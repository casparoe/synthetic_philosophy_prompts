      *   *Wait, can we keep (5)?* If (5) says "A reason must be a reason for someone," and we say "Natural Selection is the someone," that's a metaphor. Selection isn't an agent. So keeping (5) literally forces Panpsychism.
      *   *So the advice must be:* Reject (5) as stated, but replace it with (5*): "A functional explanation cites a historical selection pressure, not a mental state."
      *   *Wait, what about Premise (4)?* "A rationale is a reason." This is the pivot. If we say "A rationale is a *functional explanation*," does that count as a "reason"? In philosophy of action, no. In philosophy of biology, yes (explanatory reason). The ambiguity is the trap.
      *   *Focus:* The strongest move is to attack the equivocation in (4) and (5).
      *   *Addressing the "Vacuity" Horn (10):* If we deny (5), do reasons collapse into causes? Not if we distinguish *forward-looking* causation (teleology) from *backward-looking* causation (history). Or, more accurately, distinguish *etiological function* from *mere causal consequence*. A broken heart causes death, but its function is pumping. The "reason" it exists is the past pumping, not the current causing. This preserves normativity without minds.

