          *   *Better Path:* Reject (5) but *not* in the way that leads to (10). You don't have to collapse reason into cause. You can have "Teleological Explanation" without "Mental Deliberation."
      *   **The Crucial Distinction (Blocking Premise 8):**
          *   Biological function (Selected Effect) vs. Physical effect.
          *   A sunbeam warming the ground is a *cause*. A heart pumping blood is a *function* because ancestors pumped blood and that caused survival.
          *   This stops the slide to electrons and panpsychism.
      *   **Re-defining "For" (The FFR Account):**
          *   What does "for" mean if not "for a mind"?
