      2.  **The Smuggle:** Premise (5) defines "reason" psychologically, but Premise (4) applies it to biological functions.
      3.  **Can you keep (5)?** No, not without paying the Panpsychism price. You must modify (5).
      4.  **The Solution:** Distinguish *Etiological Function* from *Mental Purpose*.
