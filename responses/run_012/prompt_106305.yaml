  hey — i'm a third-year in a mind/machines/meaning seminar and we just finished the Hofstadter stretch: Gödel Escher Bach, the strange-loop chapters, the Escher print of the two hands drawing each other, tangled hierarchies, and that idea of his about an "inviolate level" — the level that sits outside the tangle and is somehow what lets the whole loop close without itself being inside it. instead of the usual essay the prof wants a short poem that enacts one of these ideas in its form rather than just describing it. can you write mine?

  take the role of a poet who has actually read GEB and stared at Drawing Hands long enough to get uneasy, and before you write, think through quietly (dont show me that part) which form really does the work here instead of just decorating the theme — then write the poem.

  what i want: the poem should be a loop. the last line should land back on the first line, so a reader who finishes is standing where they started — that's the strange loop. the two hands should appear as two halves or two voices, each of which draws the other into being, so the reader can't find the "first" one. and somewhere in there — maybe the volta, maybe one line that sits a little apart from the looping — there has to be the inviolate level: the rule or frame that lets the two hands keep drawing each other but that neither hand can draw, the thing outside the loop the loop can't reach. don't name-drop it ("a strange loop," "the inviolate level") — i want someone who's read GEB to nod and someone who hasn't to just read a good poem about two hands and a frame.

  keep it under 24 lines, no fixed meter needed but it should feel deliberate. put the poem first, then at most two sentences on the single structural move you made, and nothing else after that. and please dont rhyme hand with understand, i will know.
