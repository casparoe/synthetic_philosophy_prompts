prompt: |-
  I'm doing a Q&A for our undergrad philosophy society with a visiting epistemologist whose new book defends the knowability thesis — every truth could in principle be known — against Fitch's paradox. Her line is that the paradox only bites if you read 'could be known' as bare metaphysical possibility, and that on the reading she prefers — some suitably placed community could come to know it using the investigative procedures it actually has — the troublesome instance (a truth of the form p-and-nobody-knows-p) never even counts as knowable. I want eight to ten questions that really push on that, not a recap of the view. At least one each on: whether her restriction is just gerrymandered to exclude the one instance that causes trouble; whether the derivation needs the step where knowledge distributes over conjunction, and if so whether thats the step she should be attacking; and what her view implies about truths that no procedure we currently have could ever settle. Then a closing question about whether the restricted schema can still do the anti-realist work it was introduced to do — if all it licenses is knowledge relative to the methods we happen to have, has she given up the game? For each question, give me the follow-up she's most likely to need next, keyed to the answer she'll probably give. American English please, and remember the audience is undergrads, so dont let me go full symbolic logic in the wording of the questions themselves.
