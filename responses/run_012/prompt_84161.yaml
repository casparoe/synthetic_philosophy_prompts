answer: |-
  This is a precise and dangerous failure mode, and you are right to sense that the standard "Goodhart" warnings do not quite cover it. Goodhart's Law and Campbell's Law presuppose an **optimizer**: an agent who sees the metric, wants the metric, and changes their behavior *to move the metric*.

  In your examples, there is no optimizer targeting the metric. There are only local actors optimizing for *local utility* (clinical triage, psychological ease of clearing tickets), and the metric distortion is a **side effect**, not a goal.

  ### The Name

  There is no single canonical term for the systemic phenomenon, but it is the composition of two well-defined concepts:

  1.  **Statistically:** This is **Informative Censoring** (or **Informative Attrition**).
      *   In survival analysis, "censoring" occurs when you don't observe the event of interest (death, ticket resolution). It is "informative" when the *reason* you don't observe it is correlated with the outcome (sickness severity, ticket difficulty).
      *   *Commitment:* This term commits you to the mathematical structure: $P(\text{Excluded} | \text{Outcome}) \neq P(\text{Excluded})$. It does not imply *why* the exclusion happens, only that it is non-random.

  2.  **Systemically:** I propose calling this **Endogenous Selection Drift**.
      *   **Endogenous:** The pressure comes from inside the system (local decisions), not from an external target or incentive scheme.
      *   **Selection:** The population included in the statistic is being filtered.
      *   **Drift:** The filter changes slowly over time as local behaviors accumulate.

  If you need a shorthand for rationalist discourse, **Passive Selection Drift** also works to emphasize the lack of adversarial intent.

  ### The Carving: Distinguishing from Neighbors

  Here is how **Endogenous Selection Drift** carves reality differently from the standard warnings you already know.

  | Feature | Goodhart / Campbell | Cream-Skimming | Survivorship Bias | **Endogenous Selection Drift** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Driver** | Incentive / Target | Strategic Profit | Static Study Design | **Local Utility / Friction** |
  | **Intent** | Explicit (Game the metric) | Explicit (Pick easy cases) | None (Methodological error) | **None (Side effect of local work)** |
  | **Visibility** | Metric diverges from reality | Metric diverges from reality | Data is missing permanently | **Metric improves while reality rots** |
  | **Coordination** | Centralized or Mimetic | Centralized or Strategic | N/A | **Uncoordinated / Emergent** |
  | **Example** | Police stop writing tickets to boost clearance rates. | Insurers refuse sick patients to boost health stats. | Analyzing returning planes to armor wings. | **Doctors transfer sick patients to keep mortality low; Agents clear easy tickets to feel productive.** |

  **Why "Cream-Skimming" doesn't fit:**
  Cream-skimming implies a *market* or *strategic* selection. An insurer *chooses* healthy patients to maximize profit. In your hospital example, the doctors are not choosing easier patients to boost the mortality stat; they are choosing to transfer patients because they lack capacity or specialty. The *effect* is cream-skimming, but the *mechanism* is capacity triage. Calling it cream-skimming accuses the doctors of gaming; calling it Endogenous Selection Drift accuses the *system design* of allowing local utility to decouple from global truth.

  **Why "Survivorship Bias" doesn't fit:**
  Survivorship bias is typically a **static** error in study design (looking at the wrong dataset once). Your phenomenon is **dynamic**. The population *drifts* over time. The metric doesn't just measure the wrong thing; it measures the right thing on a *changing* thing, creating an illusion of improvement.

  ### Boundary Cases

  You asked two specific boundary questions to test the definition.

  **1. Does the phenomenon survive someone eventually noticing and steering the set deliberately?**
  *   **No.** This is the critical boundary.
  *   As long as the drift is uncoordinated and unintentional, it is **Endogenous Selection Drift**.
  *   The moment administration notices the mortality stat dropping and *instructs* doctors to transfer more sick patients to keep the stat down, it mutates into **Goodhart's Law** (specifically, Adversarial Goodhart or Cream-Skimming).
  *   *Why this matters:* The remediation is different. You fix Goodhart by removing incentives or changing the metric. You fix Endogenous Drift by **closing the boundary** (e.g., counting transferred patients in the mortality rate, or counting tickets upon receipt rather than resolution).

  **2. Does it require that the damage be invisible in the metric itself?**
  *   **Yes.**
  *   If the metric included the "drifted" population (e.g., "Average Response Time" included pending tickets as infinite time, or "Mortality Rate" included transferred patients), the metric would degrade, revealing the problem.
  *   The phenomenon *requires* a **leaky denominator**. The metric must define a population that allows hard cases to exit (or delay entry) without penalty.
  *   *Artifact or Essential?* It is essential to the *illusion*. The underlying reality (backlog, sickness) is visible if you look for it, but the specific *statistic* being used as a proxy must remain blind to the leakage for the "Phantom Improvement" to persist.

  ### Summary Definition

  **Endogenous Selection Drift** occurs when a metric $M$ tracks a property $Q$ of a population $P$. Local actors, optimizing for local utility $U$ (unrelated to $M$), make decisions that systematically alter the composition of $P$ over time. Because the exclusion from $P$ is correlated with $Q$ (Informative Censoring), $M$ diverges from the true state of $Q$, typically showing improvement while the system degrades. Unlike Goodhart's Law, no actor is optimizing for $M$; the decoupling is an emergent property of local friction.

  **The Fix:**
  You cannot fix this by warning people not to game the system (they aren't). You fix it by **hardening the denominator**.
  *   **Hospital:** Mortality must follow the patient for $X$ days post-transfer.
  *   **Support:** Response time must be calculated on *arrival*, not *completion*, or backlog size must be a co-primary metric.

  The carving you are looking for is the distinction between **Optimization Pressure** (Goodhart) and **Structural Leakage** (Endogenous Drift). One is a problem of incentives; the other is a problem of boundary definitions.
