answer: |-
  # Simulation: The Architecture of Exclusion

  **Setup**
  *   **Class:** 18 students divided into 3 Delegations (6 students each).
  *   **Task:** Draft the operative definition of "Crime X" (do not use the word genocide).
  *   **Goal:** Produce a single text agreed upon by all Delegations. Unanimity required.

  **Secret Briefs**
  *   **Bloc A (Colonial Powers):** You administer vast territories with indigenous populations. You must exclude "cultural destruction" and "forced assimilation." If these are included, you veto. Protect state sovereignty above all.
  *   **Bloc B (Authoritarian States):** You purge political opponents regularly. "Political groups" must be excluded. Intent must be proven by explicit written order; inference is unacceptable.
  *   **Bloc C (Victim States):** Your population was recently targeted. You need "political groups" included. "Cultural destruction" counts as destruction. Non-state actors must be liable. Intent can be inferred from context.

  **Timeline (90 Minutes)**
  *   **00–05:** Intro. Distribute briefs. Emphasize secrecy.
  *   **05–20:** Internal Drafting. Groups write their ideal definition (Groups, Intent, Acts, Thresholds).
  *   **20–40:** Plenary Negotiation. Delegations merge texts into one. (Intervene if stalled: "Session closes in 5 minutes.")
  *   **40–60:** Application. Groups apply the *adopted* text to the 3 Vignettes. Record verdicts (Crime X committed? Yes/No).
  *   **60–90:** Reveal & Debrief. Show 1948 Convention. Compare texts and verdicts.

  **Vignettes**
  1.  **Assimilation:** State removes children from Group X to be raised in State culture. No killings occur.
  2.  **Purge:** Regime executes 10% of Political Party Y. Leaders give hate speeches but issue no written kill orders.
  3.  **Militia:** Armed militia destroys 50% of Village Z. State claims no control over militia.

  **Debrief Questions**
  *   Which protections did you sacrifice to secure agreement?
  *   Did the definition fit the crime, or did you shape the crime to fit the definition?
  *   Who holds the veto power in your final text?
  *   How does ambiguity serve the powerful versus the vulnerable?
  *   Compare your text to the 1948 Convention. Which Bloc won?

  **Troubleshooting**
  *   **The Idealists:** If a group drafts a morally perfect definition, pressure them: "If you don't compromise, there is no treaty. No treaty means no law. Choose."
  *   **The Know-It-Alls:** If students cite the real Convention, interrupt: "It is 1947. That text does not exist. You are making history, not reciting it."
  *   **Stalemate:** If negotiation fails, announce: "The UN General Assembly is adjourning. Ratify now or walk away with nothing." Force the trade-off.

  **Limitations**
  This sim cannot reproduce the blood on the floor. It abstracts suffering into clauses. You must verbally re-anchor the stakes: every excluded word represents thousands of uncounted dead. It also cannot fix hindsight bias; students know genocide is "bad." You must emphasize that in 1947, this was a radical, contested legal invention, not a moral given. The discomfort they feel negotiating the exclusion of political groups is the lesson.
