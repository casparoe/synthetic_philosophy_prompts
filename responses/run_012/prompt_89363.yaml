      *   *Case:* Electrode stimulation. -> Requirement: Qualitative difference in agency (sense of agency).
      *   *Case:* RP without movement. -> Requirement: Probabilistic threshold, not deterministic trigger.
      *   *Distinction:* Urge vs. Decision. -> Requirement: Mechanism of endorsement.
      *   *Distinction:* Brain vs. I. -> Requirement: Non-dualistic account (avoiding the homunculus).
