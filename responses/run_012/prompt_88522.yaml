  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Claim:* If voters are independent and each has probability $p > 0.5$ of being correct on a binary choice, the probability that the majority vote is correct approaches 1 as $n \to \infty$. If $p < 0.5$, it approaches 0. If $p = 0.5$, it stays 0.5.
      *   *Assumptions:* Binary choice (True/False), Independence, Competence ($p > 0.5$), Sincere voting.
      *   *Debates:* Are voters independent? Are they competent? Is there a "correct" answer in politics? Does it justify authority?

