      *   *Residue 4: Legitimacy/Authority.*
          *   ML: Accuracy justifies deployment.
          *   Politics: Accuracy does not justify *obligation*. I must obey even if wrong (procedural justice).
          *   *Diagnosis:* ML has no concept of "obligation to the prediction."
          *   *Verdict:* MLE framework defect. It lacks a normative layer. Political claim is about social cohesion, not just error rates.

