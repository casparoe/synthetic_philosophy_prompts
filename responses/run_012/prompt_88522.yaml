      *   *Competence ($p > 0.5$)* -> Base Classifier Accuracy > Random Guessing.
      *   *Independence* -> Error Decorrelation (uncorrelated residuals).
      *   *Correct Answer* -> Ground Truth Label (available only post-hoc or oracle-held).
