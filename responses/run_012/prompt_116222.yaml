      *   *Claim 4:* "If we are in a simulation, the simulation might be shut down at any time... So the expected number of future beings is smaller."
          *   *Critique:* Plausible point (termination risk), but needs nuance. Simulators might run it for a long time. Also, if (1) is true (extinction), the future is short anyway. This point is partially valid but relies on specific assumptions about simulator behavior.
      *   *Claim 5:* "Even if we are simulated, we might still be able to influence the simulation... But since simulated beings are not real, this is not as important."
          *   *Critique:* Repeats the ethical error. Also ignores the "leverage" argument (influencing simulators).
      *   *Claim 6:* "The argument thus supports a kind of anti-fanaticism."
          *   *Critique:* Conclusion follows from their premises, but since premises are shaky, the conclusion is weak.

