          *   Distinguish claims that follow from the argument vs. those requiring additional premises.
          *   Quote/paraphrase student sentences.
          *   Identify subtle errors a hasty grader might miss.
          *   No citations needed (judge on cogency).

  2.  **Brainstorming & Instructor Prep (Mental Sandbox):**
      *   *What is the Simulation Argument (SA)?* Bostrom's trilemma: (1) Extinction, (2) No interest in sims, (3) We are in a sim. It's a probabilistic argument based on self-sampling assumptions. It does *not* prove we are in a sim; it says *if* (1) and (2) are false, then (3) is likely.
      *   *What is "Fanaticism" in this context?* Willingness to sacrifice huge certain present value for tiny probabilities of astronomical future value (Pascal's Mugging style, or just standard expected value maximization with huge stakes).
      *   *Does SA dampen fanaticism?*
          *   *Argument for Yes:* If we are in a sim, the future might be short (shut off). If we are in a sim, our actions might not affect the "base reality" future. If simulated welfare doesn't count (moral anti-realism about sims), value drops.
          *   *Argument for No (or nuanced):* If we are in a sim, *our* future is still our future (phenomenologically). If simulated welfare counts (sentience is what matters), value remains high. If we are in a sim, our actions might influence the simulators (ancestor simulation hypothesis), potentially affecting *their* reality (leverage). The trilemma allows for (1) and (2) to be true, meaning we might *not* be in a sim, in which case the far future is real and vast.
      *   *Common Student Errors:*
          *   Treating the trilemma as a proof that we *are* in a simulation (ignoring horns 1 and 2).
          *   Assuming simulated beings lack moral status (a controversial ethical premise, not a logical consequence of SA).
          *   Confusing "our future" with "the simulator's future."
          *   Ignoring the possibility that being in a simulation *increases* leverage (if simulators watch us).
          *   Failing to distinguish between epistemic probability and ontological reality.

  3.  **Evaluate the Student's Answer:**
      *   *Claim 1:* "The simulation argument shows that we are probably living in a simulation."
          *   *Critique:* Incorrect. The SA establishes a disjunction. It only shows we are probably in a sim *if* we reject (1) and (2). The student treats (3) as the conclusion, not one horn of a trilemma.
