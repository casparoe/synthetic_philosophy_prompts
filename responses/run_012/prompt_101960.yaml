      *   *Crucial Distinction:* Humans can incorporate context *outside* the model variables. A model sees $X$; a human sees $X$ plus "this patient walked 5 miles to get here." This *can* shift base rates locally, potentially mitigating the global impossibility.

  6.  **Drafting the Response:**
