      *   *Check:* The user mentioned TB screening. Use that as an example if helpful.
      *   *Nuance:* The impossibility theorem holds for *binary classification with a single threshold*. If we allow different thresholds per group, we can satisfy Error Rate Balance but lose Calibration (or vice versa). Wait, if we allow different thresholds, we can satisfy Equal FPR/FNR, but we violate "same score means same thing" (Calibration). The theorem says you can't have Calibration + Error Balance + Perfect Accuracy.
      *   *Correction on Step 4:* Step 4 claims *every* instrument is unfair because it can't satisfy *all* criteria. The flaw is assuming fairness requires satisfying *all* criteria simultaneously. Fairness is a concept; the criteria are proxies.
      *   *Human Constraint:* Humans don't output "scores" in the same way. They output decisions. The "score" is latent. This makes Calibration hard to measure but doesn't exempt them from the math of base rates. However, humans can change the *base rate* by intervening earlier (prevention), which models usually don't account for. I should focus on the "latent score" aspect.

  8.  **Final Polish:** Ensure the distinction between *ontological* fairness (the thing itself) and *epistemic* fairness (our measurement of it) is clear. The argument conflates the map with the territory.

      *(Self-Correction on the "Human Committee" point)*: The user says "A committee... faces the same base rates." This is true *ex post*. But *ex ante*, a human might gather more information, effectively changing the reference class. A model is fixed; a human is adaptive. This is a key escape hatch for the "Human" constraint.

      *Wait, one more thing:* The user finds (8) repellent. I need to validate that. (8) is crude utilitarianism. Rejecting (4) allows us to keep fairness without falling into nihilism.

