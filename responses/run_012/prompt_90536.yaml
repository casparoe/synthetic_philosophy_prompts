answer: |-
  Your hunch is spot on. You are intuitively applying **Expected Utility Theory with a Logarithmic Utility Function**, which is mathematically equivalent to maximizing the **Geometric Growth Rate** of your wealth. In betting terms, this is the **Kelly Criterion**.

  The principle you are looking for is: **Maximize the expected value of the logarithm of your wealth, $E[\ln(W)]$, rather than the expected value of wealth, $E[W]$.**

  This distinction resolves the conflict between "additive" thinking (Expected Value) and "multiplicative" thinking (Compounding). In additive thinking, a 50% loss and a 50% gain cancel out. In multiplicative thinking (real life), a 50% loss requires a 100% gain just to break even. Log-utility captures this asymmetry.

  Here is how this single principle handles your seven scenarios, and where you might need to adjust one verdict.

  ### The Principle: Log-Utility & Ergodicity
  When you maximize $E[\ln(W)]$, you are effectively maximizing the long-term growth rate of your bankroll. This framework introduces two critical concepts:
  1.  **Diminishing Marginal Utility:** The first \$10,000 matters more than the next \$10,000.
  2.  **Infinite Penalty for Ruin:** Since $\ln(0) = -\infty$, any bet with a non-negligible probability of reducing your wealth to zero has negative infinite expected utility.

  ### How It Explains Your Seven Verdicts

  **1. The 60% Coin (Repeated)**
  *   **EV Maximizer:** Bets 100% every time. Eventually goes broke (Gambler's Ruin).
  *   **Log-Utility:** Calculates the Kelly fraction: $f = p - q = 0.6 - 0.4 = 20\%$.
  *   **Verdict:** **Consistent.** Log-utility dictates betting a fixed fraction (20%), not all-in. This maximizes the geometric growth rate over time.

  **2. The 60% Coin (One Flip)**
  *   **EV Maximizer:** Bets 100%. If you only care about the arithmetic average of one outcome, this is rational.
  *   **Log-Utility:** If you lose, $W=0$ and $\ln(W) = -\infty$. The expected utility is $-\infty$.
  *   **Verdict:** **Consistent.** Even with a positive edge, you never bet the entire bankroll because the penalty for ruin is infinite.

  **3. House Insurance (Negative EV)**
  *   **EV Maximizer:** Never buys. It's a losing bet on average.
  *   **Log-Utility:** Losing the house drops you to a much lower part of the utility curve (steep slope). The utility loss from a catastrophic drop in wealth outweighs the small certain cost of the premium. You are buying stability in $\ln(W)$, not $W$.
  *   **Verdict:** **Consistent.** Rational to buy to avoid the steep drop in utility.

  **4. Lottery Ticket (Negative EV)**
  *   **EV Maximizer:** Never buys.
  *   **Log-Utility:** The cost of the ticket is a certain small reduction in $\ln(W)$. The potential win is a large increase, but weighted by a tiny probability. Because the utility curve is concave (bends downward), the pain of the cost outweighs the expected joy of the win.
  *   **Verdict:** **Consistent.** Rational to avoid. (Note: This explains why Insurance and Lottery are different: Insurance prevents a *drop* down the steep part of the curve; Lottery pays to climb the flat part of the curve).

  **5. St. Petersburg Paradox**
  *   **EV Maximizer:** Should pay any amount to play (Infinite EV).
  *   **Log-Utility:** The payout grows exponentially ($2^n$), but $\ln(\text{payout})$ grows linearly ($n$). The sum converges to a small finite number.
  *   **Verdict:** **Consistent.** You would only pay a small amount (roughly \$2–\$20 depending on the bankroll), matching intuition.

  **6. Double-or-Nothing on Net Worth**
  *   **EV Maximizer:** Takes the bet (if EV > 0).
  *   **Log-Utility:** $0.5 \times \ln(2W) + 0.5 \times \ln(0) = -\infty$.
  *   **Verdict:** **Consistent.** The risk of ruin dominates any positive edge.

  **7. Retirement in Index Fund**
  *   **EV Maximizer:** Holds it if expected return > bonds.
  *   **Log-Utility:** Holds it **IF** the probability of total ruin ($W=0$) is negligible. An index fund is diversified; while it can drop 50%, it is unlikely to go to absolute zero (unlike the double-or-nothing bet).
  *   **Verdict:** **Conditionally Consistent.** (See below).

  ---

  ### The One Verdict You Might Need to Give Up

  There is a tension between **Scenario 6** (Refusing double-or-nothing) and **Scenario 7** (100% in Index Fund).

  Under strict Log-Utility, you should never expose yourself to a non-negligible risk of ruin.
  *   In Scenario 6, the risk of ruin is 50%.
  *   In Scenario 7, the risk of ruin is low, but **it is not zero.** A total market collapse, hyperinflation, or delisting could theoretically wipe out the fund.

  **The Adjustment:**
  A strict Log-Utility maximizer (Kelly bettor) would likely **not** put 100% of their retirement into a single risky asset class, even an index fund, if there is a risk-free alternative (like TIPS or cash) available. They would allocate a portion to the risk-free asset to reduce "volatility drag" and ensure survival.

  However, in practice, most people (and financial theorists) treat the broad market as having a probability of ruin so close to zero that it is functionally distinct from Scenario 6. If you accept that the Index Fund has **zero** probability of going to zero, your verdict stands. If you admit there is *any* chance of total loss, strict log-utility demands you hold some cash/bonds.

  ### The "Multiplicative" Insight (Ergodicity)
  You mentioned caring about wealth "multiplicatively." In physics and economics, this is known as the **Ergodicity Problem**.
  *   **Ensemble Average (EV):** What happens to 1,000 people flipping the coin once? (Additive).
  *   **Time Average (Growth Rate):** What happens to *one* person flipping the coin 1,000 times? (Multiplicative).

  Most financial decisions are time-average problems (you live your life once, sequentially). Expected Value is an ensemble average. Your gut correctly identifies that **you are a time-average optimizer.**

  ### Summary
  *   **Principle:** Maximize $E[\ln(\text{Wealth})]$.
  *   **Does it get all seven?** Yes, it explains 1–6 perfectly and 7 with a minor caveat about ruin risk.
  *   **What to give up:** You don't need to give up a verdict, but you should refine **Scenario 7**. Acknowledge that you are accepting the Index Fund bet only because you assume the probability of *total* ruin is effectively zero. If that probability were 1% instead of 0.0001%, a log-utility optimizer would reduce their equity allocation.

  Your intuition is mathematically sound. You are a **Kelly Bettor** who understands **Ergodicity**. Trust the gut.
