prompt: |-
  My collegue in HPS keeps an informal scoreboard on right-but-early theories and I need to know what she'll do with the case I'm putting up in seminar next week. Her calls so far: Malthus — no, not right but early, the prediction failed; and she adds that the standard rescue doesn't even get off the ground, because the demographic transition is something Malthus's own theory predicts (the preventive checks), so it isn't an external fix at all. Ehrlich's famine forecasts — falsified, no rescue, and the later claim that it's happening now is a different claim. Hubbert's 1956 call that US oil would peak around 1970 — vindicated, risky, dated, and it landed. Limits to Growth — not a prediction in the first place, just a model with free parameters, so the question doesn't arise.

  Next week's case: a grad student wants to argue that global peak oil was right but early. Same curve-fitting applied to world production, forecasts through the 90s and 2000s that the global peak was imminent or already behind us, and then it didn't arrive on schedule, thanks to unconventional oil and a demand story nobody modelled. Will she say right but early, or falsified? Give me your best guess, the rule she's actually running, at least one other rule that fits all four of her verdicts just as well, and the case that would seperate them. I care more about the rules than the verdict.
