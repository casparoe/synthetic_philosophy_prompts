answer: |-
  Here is the breakdown of your colleague's likely scoring logic, the alternative interpretation, and the case that splits them.

  ### 1. The Verdict
  **She will call it: Falsified (specifically, an *Ad Hoc Rescue*).**

  She will reject the "Right but Early" label. She will argue that shifting from "conventional oil" to "all liquids including unconventional" constitutes a modification of the **auxiliary hypotheses** (the definition of the resource base) to save the **core hypothesis** (the depletion curve). In her view, this is structurally identical to Ehrlich moving the goalposts on *when* the famine would happen, whereas Hubbert succeeded because the definition of "oil" and the geological boundary conditions remained fixed.

  ### 2. The Rule She Is Actually Running
  **The Exogenous Friction & Fixed Boundary Rule**

  A theory qualifies as "Right but Early" only if:
  1.  **Fixed Boundaries:** The definitions of the key variables (what counts as "oil," "population," "food") remain constant between the prediction and the verification.
  2.  **Exogenous Delay:** The reason for the temporal miss must be **exogenous** to the theory's causal mechanism (e.g., political intervention, temporary market shock, data error).
  3.  **No Internal Rescue:** The theory cannot explain its own delay using its own internal mechanisms.

  **How it fits her scoreboard:**
  *   **Hubbert (US):** **Pass.** Boundaries fixed (conventional crude). Delay was negligible (it hit the date). The mechanism (geology) is external to human will.
  *   **Malthus:** **Fail.** She explicitly notes the "rescue" (demographic transition) is an *internal* mechanism (preventive checks). Because the theory contains the seeds of its own delay, it isn't "early"; it is either dynamically correct or wrong about magnitude. It violates the "No Internal Rescue" clause.
  *   **Ehrlich:** **Fail.** Violates "Fixed Boundaries/No Internal Rescue." Changing the claim from "1970s" to "now" is an ad hoc shift of the prediction, not an exogenous delay.
  *   **Limits to Growth:** **N/A.** Violates the precondition of making a risky, dated prediction (free parameters allow fitting any outcome).
  *   **Global Peak Oil:** **Fail.** The "rescue" (unconventional oil/fracking) requires redefining the resource base (auxiliary hypothesis). This is an endogenous model adjustment, not an exogenous friction.

  ### 3. An Alternative Rule (That Fits the 4 Verdicts)
  **The Causal Mechanism Preservation Rule**

  A theory qualifies as "Right but Early" if the **core causal mechanism** remains operative and valid, provided the delay is due to **technological or economic friction** that was theoretically possible but practically unviable at the time of prediction.

  **How it fits her scoreboard:**
  *   **Hubbert (US):** **Pass.** The mechanism (depletion) was correct. Secondary recovery tech existed but didn't prevent the peak.
  *   **Malthus:** **Fail.** The core mechanism (population geometric vs. food arithmetic) was *broken* by the Industrial Revolution, not just delayed. The relationship fundamentally changed, not just the timing.
  *   **Ehrlich:** **Fail.** The core mechanism (population outstripping food supply) was falsified by the Green Revolution (yield increases), not just delayed.
  *   **Limits to Growth:** **N/A.** No single causal mechanism was tested against a specific timeline.
  *   **Global Peak Oil:** **Pass (Divergence!).** Under this rule, the grad student wins. The core mechanism (finite resources deplete) is still valid. The delay was caused by fracking (tech that existed but was economically unviable in the 90s). This counts as "friction," not falsification.

  ### 4. The Discriminating Case
  To separate these two rules, you need a case where the **Causal Mechanism is preserved**, but the **Boundary Conditions are shifted**.

  **The Case: "The End of Moore's Law" (Predictions ca. 2005–2010)**

  *   **The Prediction:** Various physicists and engineers predicted transistor scaling would hit physical thermal limits by ~2020, ending exponential growth in computing power.
  *   **The Outcome:** Exponential growth continued past 2020.
  *   **The Rescue:** The industry shifted from 2D planar scaling to 3D stacking and new architectures (chiplets, etc.). The definition of "scaling" changed from "shrinking transistors" to "increasing density via architecture."

  **How the Rules Split:**
  *   **Her Rule (Exogenous/Fixed Boundary):** **Falsified.** The boundary condition ("scaling" = shrinking lithography) was modified ad hoc to save the prediction. The "rescue" changed the definition of the variable.
  *   **Alternative Rule (Causal Mechanism):** **Right but Early.** The core mechanism (physical limits constrain computation) is still true; we are just hitting them slower because we changed the *method* of computation, which was theoretically possible but economically unviable in 2005.

  If she marks "End of Moore's Law" as **Falsified**, you know she is running the **Fixed Boundary Rule**. If she marks it **Right but Early**, she is running the **Causal Mechanism Rule**, and your grad student might actually have a chance. Given her comment on Malthus (rejecting internal theoretical adjustments), I bet she marks Moore as Falsified.
