          *   Need to state AC clearly.
          *   Acknowledge ZF's strength.
          *   Acknowledge independence (Gödel/Cohen).
          *   Clarify Banach-Tarski (it's not physical, it's about measure).
          *   Address the User's Criterion: This needs careful handling. It resembles *conservativity*. For arithmetic statements, AC is conservative (Shoenfield). For statements about reals, it's more complex. The term "explicitly defined" is tricky. We need to agree that the criterion is *interesting* but perhaps not the final arbiter.
      *   **Section 2: Table of Disagreements:**
          *   Need two columns: "Classical View" and "Skeptic View".
          *   Topics: Ontological status of sets, Utility vs. Constructibility, The "Pathology" of Non-measurable sets.
      *   **Section 3: Cruxes:**
          *   What is the core fight? It's about the meaning of "Existence."
          *   Argument bearing on it: Consistency strength, utility in physics/analysis.
          *   Predictions: Classical says AC leads to deeper unity. Skeptic says AC leads to dead ends in computation/physics.
      *   **Section 4: Verbal Disputes:**
          *   Specifically address "Existence." Platonism vs. Constructivism.

  4.  **Refining the User's Criterion:**
      *   *Criterion:* "An axiom is trustworthy in an area only if every statement it proves about objects that can already be explicitly defined in that area is provable without it."
      *   *Critique:* This is essentially asking if AC is *conservative* over ZF for "definable" statements.
      *   *Problem:* "Explicitly defined" is vague. In ZF, definability is subtle (Tarski's undefinability of truth).
      *   *Mathematical Fact:* AC is conservative over ZF for arithmetic statements (Shoenfield Absoluteness). However, for statements about *sets of reals*, AC changes things (e.g., existence of non-measurable sets). But a non-measurable set *cannot* be explicitly defined in ZF (if it could, ZF would prove it exists). So the criterion might be vacuously true or hard to apply.
      *   *Decision:* We should characterize it as a version of *conservativity*. We agree it's well-formed enough to discuss but note that "explicitly defined" needs care. It doesn't necessarily beg the question, but it favors the Skeptic's view of what counts as a legitimate object.

  5.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Respectful, precise, suitable for bright high schoolers (avoid overly dense jargon where possible, explain when necessary).
      *   *Formatting:* Use Markdown for the table and sections.

      *(Self-Correction during drafting)*: Make sure to mention Dependent Choice (DC). It's the middle ground. Most analysis works with DC. AC is stronger. Solovay's model uses DC.
      *(Self-Correction on Criterion)*: The user asks me to tell them *whether* the criterion is well-formulated. I need to embed this judgment into the joint statement. The mathematicians should agree that it's a *reasonable heuristic* but technically difficult due to the definition of "definable."

  6.  **Final Review against Constraints:**
