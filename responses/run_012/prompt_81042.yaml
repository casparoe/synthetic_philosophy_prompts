          *   Non-measurable sets (Vitali): Requires AC.
          *   Banach-Tarski: Paradoxical decomposition, requires AC (non-measurable pieces).
          *   Ultrafilters: Existence of non-principal ones requires AC.
      *   *Consistency/Independence:* AC is independent of ZF (Gödel/Cohen).
      *   *Solovay's Model:* ZF + Dependent Choice (DC) + "All sets of reals are Lebesgue measurable" is consistent (assuming an inaccessible cardinal).
      *   *Determinacy (AD):* Implies all sets of reals are measurable, but contradicts AC.
      *   *User's Criterion:* This sounds like a version of *conservativity* over a specific domain (e.g., arithmetic or definable reals). Shoenfield Absoluteness is relevant here (AC doesn't change truth of $\Pi^1_2$ sentences). The criterion might be too strong or vague ("explicitly defined").

  3.  **Drafting - Section by Section:**

