  *(Detailed thought on the Criterion)*:
  The criterion says: If AC proves $P$ about object $x$, and $x$ is explicitly definable in ZF, then ZF should prove $P$.
  If $x$ is a specific real number or a specific function definable in ZF, AC generally doesn't change properties of $x$ (Shoenfield).
  However, AC proves "There exists a set $S$ such that..." where $S$ is not definable.
  The criterion asks about statements *about objects that can already be explicitly defined*.
  If AC proves "The definable set $D$ has property $Q$", does ZF prove it?
  Actually, AC can prove the existence of *new* objects that ZF can't define.
  The criterion is essentially: AC should not settle questions about "concrete" mathematics that ZF leaves open.
  This is largely true for arithmetic (Shoenfield).
  The mathematicians should agree: The criterion is well-formed but its application relies on a precise definition of "explicitly defined," which is technically subtle. It does not beg the question, but it aligns more naturally with the Skeptic's philosophy.

