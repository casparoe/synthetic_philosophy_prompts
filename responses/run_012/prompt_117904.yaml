  # THE CELEBRATION DECISION TREE

  **START:** Think of a specific winner (colleague, cousin, influencer). Answer honestly.

  1.  **Did their advantage take something from you (zero-sum) or only get something new (additive)?**
      *   **Took Something:** Go to 2.
      *   **Got Something New:** Go to 3.

  2.  **Was the taking justified by effort/skill (desert) or just luck?**
      *   **Justified:** Go to 4.
      *   **Just Luck:** Go to 5.

  3.  **Is the problem *them* (their behavior) or *the rules* (system/norms)?**
      *   **Them:** Go to 6.
      *   **The Rules:** Go to 8.

  4.  **Do you benefit from their win or compete against them?**
      *   **Benefit:** → **LEAF 1: Patronage Loyalist**
      *   **Compete:** → **LEAF 2: Meritocratic Rival**

  5.  **Is the fault the person's luck or the system's rigging?**
      *   **Person's Luck:** → **LEAF 3: Luck Resenter**
      *   **System's Rigging:** → **LEAF 4: Structural Skeptic**

  6.  **Is admiring them corrosive to *you* or is their behavior the issue?**
      *   **Corrosive to You:** → **LEAF 5: Stoic Skeptic**
      *   **Their Behavior:** Go to 7.

  7.  **Do they boast about the win or deflect credit?**
      *   **Boast:** → **LEAF 6: Tall Poppy Cutter**
      *   **Deflect:** → **LEAF 7: Humility Condition**

  8.  **Do norms protect the weak or enforce mediocrity?**
      *   **Protect Weak:** Go to 9.
      *   **Enforce Mediocrity:** → **LEAF 8: Anti-Elitist**

  9.  **Did their success diminish the community they left?**
      *   **Yes:** → **LEAF 9: Jante Defender**
      *   **No:** → **LEAF 10: Unnamed Position**

  ---

  ### THE LEAVES

  **1. Patronage Loyalist** (ZS / Earned / Benefit)
  *   *Case:* Influencer whose success is the product you buy.
  *   **Awkward Commitment:** You must cheer for inequality because you profit from it.

  **2. Meritocratic Rival** (ZS / Earned / Compete)
  *   *Case:* Colleague promoted over you for reasons you respect.
  *   **Awkward Commitment:** You must accept your own loss as evidence of their virtue.

  **3. Luck Resenter** (ZS / Luck / Person)
  *   *Case:* Colleague promoted for 60% luck.
  *   **Awkward Commitment:** You hate the individual, not the game that produced them.
  *   *Note:* Sounds identical to Leaf 4 ("They didn't earn it"), but blames the player, not the rig.

  **4. Structural Skeptic** (ZS / Luck / System)
  *   *Case:* School posting top names while ignoring resource gaps.
  *   **Awkward Commitment:** The American Dream is a lie; no one truly earns this.
  *   *Note:* **Separated from Leaf 8.** You say the Dream is false; Leaf 8 says it's true but blocked.

  **5. Stoic Skeptic** (Add / Person / Corrosive)
  *   *Case:* Admiring a brilliant scientist who is confidently wrong outside their field.
  *   **Awkward Commitment:** Admiring anyone is a status trap you must opt out of for your own sake.
  *   *Note:* Sounds identical to Leaf 9 ("Don't celebrate"), but protects *you*, not the community.

  **6. Tall Poppy Cutter** (Add / Person / Boast)
  *   *Case:* Hometown friend who got rich and talks about it constantly.
  *   **Awkward Commitment:** Success is fine, but hiding it is mandatory to remain likable.

  **7. Humility Condition** (Add / Person / Deflect)
  *   *Case:* Cousin who wins something and refuses to take credit.
  *   **Awkward Commitment:** Success is only permissible if you pretend you didn't achieve it.
  *   *Diagnosis:* **Unnamed.** Attractive to many, but logically makes success impossible to acknowledge.

  **8. Anti-Elitist** (Add / System / Mediocrity)
  *   *Case:* Someone who says "Jantelagen is just envy."
  *   **Awkward Commitment:** The Dream is true, but we've stopped running it; norms enforce mediocrity.
  *   *Note:* **Separated from Leaf 4.** You say the Dream works but is blocked; Leaf 4 says it's a lie.

  **9. Jante Defender** (Add / System / Protect / Diminished)
  *   *Case:* Hometown friend who got rich and stopped coming back for Christmas.
  *   **Awkward Commitment:** Their leaving hurt us; norms exist to protect the weak from this loss.
  *   *Note:* Sounds identical to Leaf 5 ("Don't celebrate"), but protects the *community*, not you.

  **10. Unnamed Position** (Add / System / Protect / Not Diminished)
  *   *Case:* Someone wins a pile of money and gives most of it away, yet you still object.
  *   **Awkward Commitment:** You enforce norms that protect against harm even when no harm occurred.
  *   *Diagnosis:* **Unattractive.** Punishing success without a victim; purely punitive egalitarianism.
