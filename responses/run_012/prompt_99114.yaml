answer: |-
  Your intuition is sharper than the book's. You have correctly identified the weakest link in the chain: the interpretation of G.E. Moore. While the book gets the broad strokes of Keynes's biography right, it flattens his philosophy into a caricature of hedonism and misreads his later intellectual development.

  Here is a sentence-by-sentence breakdown of how a Keynes scholar would react, followed by a deeper dive into the Moore question and the book's conclusion.

  ### Sentence-by-Sentence Evaluation

  **1. "Keynes thought economics was only ever a means to an end, and the end was leisure."**
  *   **Verdict:** **Nod.**
  *   **Scholar's View:** Keynes consistently viewed economics as a technical instrument. In *Economic Possibilities for our Grandchildren* (1930), he writes that the economic problem is "transitory" and "temporary." The real problem is how to use the freedom that prosperity gives us. However, scholars might nuance "leisure" as "the pursuit of higher ends" rather than just idleness.

  **2. "In his 1930 essay... he predicted that within a hundred years we'd be down to a fifteen-hour week..."**
  *   **Verdict:** **Nod.**
  *   **Scholar's View:** This is factually correct. He predicted a three-hour shift or a fifteen-hour week could satisfy our needs given compound interest and technological progress.

  **3. "...and that this would be the good life — the economic problem solved for good, scarcity abolished, everybody finally free to enjoy themselves."**
  *   **Verdict:** **Wince.**
  *   **Scholar's View:** "Scarcity abolished" is too strong. Keynes argued the *economic* problem (the struggle for subsistence) could be solved, not that scarcity in a philosophical sense would vanish. Also, "free to enjoy themselves" is slightly glib. Keynes worried that most people were not trained to know *how* to enjoy freedom wisely.

  **4. "His ethics came out of Bloomsbury and out of G.E. Moore's Principia Ethica, which argued that the only thing good in itself is pleasure..."**
  *   **Verdict:** **Flat Out Reject.**
  *   **Scholar's View:** This is the critical error. Moore explicitly argued *against* the idea that pleasure is the only intrinsic good. (See deep dive below).

  **5. "...so Keynes was essentially a utilitarian who thought the good life was about maximizing pleasant mental states."**
  *   **Verdict:** **Wince/Reject.**
  *   **Scholar's View:** Keynes was an "Ideal Utilitarian" (following Moore), not a "Hedonic Utilitarian" (following Bentham/Mill). For Keynes, the goal was maximizing valuable *states of consciousness* (appreciation of beauty, love, knowledge), not merely "pleasant mental states." The difference is between watching a challenging play vs. eating a tasty meal; both are states of mind, but Moore and Keynes valued the former higher, regardless of "pleasure."

  **6. "Later on, in a memoir, he repudiated all of that and turned into a hard-nosed pragmatist who only cared about policy."**
  *   **Verdict:** **Wince.**
  *   **Scholar's View:** Keynes wrote a piece called "My Early Beliefs" (1938), where he critiqued the *naivety* of his generation's application of Moore's ethics (they ignored consequences and probability), but he did not repudiate the *ends*. During the 1930s and 40s, he focused on crisis management (unemployment, war finance), which looked like pragmatism, but his founding of the Arts Council in 1946 proves he never abandoned the idea that economic security serves culture.

  **7. "He did also say somewhere that the love of money is a disgusting morbidity."**
  *   **Verdict:** **Nod.**
  *   **Scholar's View:** Direct quote from the 1930 essay. He classified the love of money as a "semi-criminal, semi-pathological propensity."

  **8. "So the upshot is that the famous essay isn't really economics at all — it's a sermon telling us the good life is leisure, and that any society still working forty-hour weeks has failed morally."**
  *   **Verdict:** **Wince.**
  *   **Scholar's View:** It is economics *and* moral philosophy. Keynes analyzes capital accumulation and productivity (economics) to reach a moral conclusion. Regarding the 40-hour week: Keynes allowed for a transition period. He would likely argue we have failed *politically* (distribution of wealth) and *psychologically* (habit), but calling it a simple "moral failure" ignores the structural changes he anticipated.

  ---

  ### The Moore Misunderstanding

  Your suspicion about G.E. Moore is correct and crucial. This is where the book's argument collapses.

  In *Principia Ethica* (1903), Moore attacks "Hedonism" (the idea that pleasure is the only good). He argues that "Good" is a simple, indefinable property, like "yellow." You can't define it, but you can recognize it in certain "organic wholes."

  For Moore (and the young Keynes), the highest goods were:
  1.  **Aesthetic enjoyment:** Appreciation of art and beauty.
  2.  **Personal affection:** Love and friendship.
  3.  **Knowledge:** Understanding the truth.

  Pleasure often accompanies these states, but pleasure *itself* is not the goal. A life dedicated to maximizing pleasure (e.g., constant amusement) would be considered worthless by Moore and Keynes. They believed in **states of consciousness** that were valuable in themselves.

  **Why the book gets this wrong:**
  Popular histories often conflate "Utilitarianism" with "Hedonism." Because Keynes is associated with Bloomsbury (known for partying and affairs), biographers often assume their ethics were about "having a good time." In reality, Bloomsbury's Moorean ethics were quite austere. They believed in being "religious" about art and friendship. Keynes didn't want a 15-hour week so people could watch TV; he wanted it so they could paint, garden, converse, and think.

  ### The "Repudiation" Myth

  The book claims Keynes later became a "hard-nosed pragmatist." This is a common misunderstanding of his career arc.

  *   **The Shift:** In the 1920s, Keynes was a philosophical idealist. In the 1930s, the Great Depression happened. He realized that waiting for the "long run" (where the economic problem solves itself) was useless if people were starving in the short run. Hence: *The General Theory* (1936).
  *   **The Continuity:** He did not stop caring about the "good life." He simply realized you couldn't have the good life without full employment first.
  *   **The Evidence:** The strongest evidence against the "hard-nosed pragmatist" theory is the **Arts Council of Great Britain**. In 1946, months before he died, Keynes helped found it. His explicit goal was to make high art accessible to the masses once the war was over. He wrote: *"This is the reason why we are working... so that everyone... can have the chance to see a play, hear music, see a picture."* That is not a pragmatist speaking; that is the Bloomsbury aesthete speaking, using policy to achieve moral ends.

  In his 1938 memoir piece ("My Early Beliefs"), he did critique Moore. He admitted that Moore's ethics ignored the importance of *consequences* and *probability*. He realized you can't just pursue "states of mind" while ignoring the suffering of the world. But he didn't swap his ethics for pragmatism; he integrated consequences into his idealism.

  ### Does the Conclusion Follow?

  The book concludes: *The essay isn't economics; it's a sermon, and working 40 hours is a moral failure.*

  **1. "It isn't economics."**
  **Verdict: False.**
  It is speculative economic forecasting. Keynes makes specific claims about compound interest, technological substitution of labor, and the marginal propensity to consume. It is economics in the service of philosophy, which is what Keynes thought economics *should* be.

  **2. "Any society still working forty-hour weeks has failed morally."**
  **Verdict: Too Simplistic.**
  Keynes would likely argue we have failed, but not purely morally.
  *   **Distribution:** We produce enough for a 15-hour week, but we distribute income unevenly, so some work 60 hours and some work 0.
  *   **Habit:** Keynes predicted the hardest part would be psychological. We are bred to strive. He wrote, *"There will be no race of men distinct from the rest... who will be devoted to the arts of life."* He feared we wouldn't know how to stop working.
  *   **The Moral Element:** He would agree there is a moral failure in valuing money for money's sake (the "disgusting morbidity"), but he would attribute the 40-hour week to structural inertia as much as moral failing.

  ### Summary for the Reader

  The book is **half-right but philosophically illiterate.**

  *   **Right:** Keynes saw economics as a means to an end; he predicted a 15-hour week; he hated the love of money; he was influenced by Moore.
  *   **Wrong:** Moore was not a hedonist; Keynes did not repudiate his early ethics (he refined them); the 1930 essay is serious economics, not just a sermon.

  **The Scholarly Consensus:**
  Keynes was an **Ideal Utilitarian**. He believed the purpose of wealth was to enable the cultivation of the mind and relationships. The book reduces this to "maximizing pleasure," which turns Keynes into a shallow hedonist. He was actually closer to an Aristotelian: economics provides the leisure necessary for *eudaimonia* (flourishing), not just *hedone* (pleasure).

  If you want to correct the book's narrative in your own mind: Keynes didn't want us to work less so we could *enjoy ourselves*; he wanted us to work less so we could *live wisely*. The failure of the 40-hour week isn't just that we work too much, but that we haven't learned what life is for.
