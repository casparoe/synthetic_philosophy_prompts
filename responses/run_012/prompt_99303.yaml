answer: |-
  Here is a procedure built for your constraints. It's designed to be printed on one sheet of paper and used with a highlighter.

  ### The Kitchen Table Protocol

  **Step 1: The Undo Test (Irreversibility)**
  *   **Question:** If we change our minds in 10 years, can we restore the site to its exact previous state with foreseeable technology?
  *   **Pass:** Yes (e.g., orbiters, temporary landers that leave no trace).
  *   **Fail:** No (e.g., impacts, drilling, leaving hardware, chemical changes).
  *   **Action:** If **Fail**, mark this proposal **High Risk**. If **Pass**, proceed to Step 4.

  **Step 2: The Specialness Test (Intrinsic Value)**
  *   **Question:** Is this specific location scientifically unique, historically significant, or visually pristine in a way that losing it matters to humanity, not just the mission?
  *   **Pass:** No (e.g., generic regolith plain, already disturbed site).
  *   **Fail:** Yes (e.g., permanently shadowed crater, Apollo landing site, unique geological formation).
  *   **Action:** If **Fail**, mark this proposal **High Risk**.
  *   **Note:** This is the **Gut in a Costume** step. There is no objective metric for "special." You are guessing what future generations might value. Write down *why* you think it's special so the board can argue with your reasoning, not just your feeling.

  **Step 3: The Only Way Test (Necessity)**
  *   **Question:** Can the scientific or operational goal be achieved without failing Step 1 or Step 2?
  *   **Pass:** Yes (e.g., simulate on Earth, go to a less special site, use non-destructive sensing).
  *   **Fail:** No (e.g., you must impact to see subsurface ice).
  *   **Action:** If **Fail** on High Risk from Step 1/2, this is a **Stop**. Recommend **No** unless the benefit is existential.

  **Step 4: The Scale Test (Proportionality)**
  *   **Question:** Is the physical footprint tiny compared to the site, and is the knowledge gain huge compared to the cost?
  *   **Pass:** Yes (e.g., small brick on a vast plain, major discovery potential).
  *   **Fail:** No (e.g., large industrial zone, marginal data).
  *   **Action:** If **Fail**, recommend **No**.

  **Step 5: The Precedent Test (Commercialization & Culture)**
  *   **Question:** Does this treat space as a shared heritage or a commodity?
  *   **Pass:** Shared heritage (science, exploration, modest memorial).
  *   **Fail:** Commodity (selling naming rights, advertising, exclusive ownership).
  *   **Action:** If **Fail**, recommend **No**. This is a **Values Call**. The procedure cannot solve this; it flags it for the full board to vote on based on mission statement.

  ***

  ### Where the Procedure Stops vs. Hands Off

  *   **Automatic No:** Fails Step 1 (Undo) AND Step 2 (Special) AND Step 3 (Only Way). There is no justification for permanently wrecking a unique site if you could have gone elsewhere.
  *   **Hand Off to Board:** Fails Step 5 (Precedent). This is purely cultural. You present the facts; the board votes on whether commercialization aligns with your charter.
  *   **Your Call:** Step 4 (Scale). This is risk management. You weigh cost vs. benefit.

  ***

  ### Running the Proposals

  #### 1. The Lunar Impactor (Shadowed Crater)
  *   **Step 1 (Undo):** **Fail.** You cannot un-crater a moon. The plume disperses permanently. **(High Risk)**
  *   **Step 2 (Special):** **Fail.** Permanently shadowed regions (PSRs) are among the most scientifically pristine and unique locations on the Moon. They are time capsules. **(High Risk)**
  *   **Step 3 (Only Way):** **Pass.** Orbiters often cannot confirm subsurface ice composition definitively. Impact spectroscopy is a proven, sometimes necessary method.
  *   **Step 4 (Scale):** **Pass.** One small impactor vs. a massive crater field. Knowledge gain (water availability) is huge for future exploration.
  *   **Step 5 (Precedent):** **Pass.** Pure science.
  *   **Verdict:** **Conditional Yes.** It fails the first two hard checks, but passes the "Only Way" test. The destruction is the measurement.
  *   **Recommendation:** Fund, but require they justify why no other crater works. Document the "before" state thoroughly so the loss is recorded.

  #### 2. The Regolith Brick Printer
  *   **Step 1 (Undo):** **Fail.** Bricks stay there. Regolith is removed.
  *   **Step 2 (Special):** **Pass (Assuming).** If they land on a generic highland plain, it's not "unique." If they land near a heritage site, it's a Fail. Assume generic for now.
  *   **Step 3 (Only Way):** **Pass.** You can't test ISRU (In-Situ Resource Utilization) on Earth perfectly.
  *   **Step 4 (Scale):** **Pass.** Tiny footprint.
  *   **Step 5 (Precedent):** **Pass.** Infrastructure development.
  *   **Verdict:** **Yes.** Low intrinsic value loss, high utility gain.
  *   **Recommendation:** Fund, but mandate site selection approval to ensure they aren't parking on something interesting.

  #### 3. The Memorial & Naming Rights
  *   **Step 1 (Undo):** **Fail.** Ashes don't decompose on the Moon. Names stick in databases.
  *   **Step 2 (Special):** **Fail.** The Moon is globally significant heritage.
  *   **Step 3 (Only Way):** **Fail.** Science does not require this. Memorials can be Earth-based.
  *   **Step 4 (Scale):** **Pass/Fail.** Physically small, but culturally large.
  *   **Step 5 (Precedent):** **Fail.** Selling naming rights turns a shared heritage into a commodity. This violates the "place has value on its own" principle directly.
  *   **Verdict:** **No.**
  *   **Recommendation:** Reject the naming rights entirely. The ashes are borderline, but combined with selling names, it looks like real estate development.

  ***

  ### The Conflict of Interest (Your Dad)

  You asked me to tell you which parts of your reaction to distrust. Here is the hard truth: **You cannot run this procedure on Proposal 3.**

  1.  **Distrust Your "Specialness" Test:** You will want to say, "My dad's memory makes this spot special," or conversely, "It's just dust, it doesn't matter." Both are biased. You cannot objectively assess the intrinsic value of the site when your personal grief is attached to it.
  2.  **Distrust Your "Precedent" Test:** You will feel defensive about the memorial aspect. You might overlook the commercialization risk (naming rights) because you want the memorial to succeed.
  3.  **The Procedure's Limit:** A procedure cannot fix a conflict of interest. It only highlights it.

  **Action Required:**
  You must disclose this conflict to the board immediately. You should not chair the discussion on Proposal 3. You should not vote on Proposal 3. If you care about the integrity of your committee—and your own peace of mind regarding your dad's legacy—you need to leave the room when this file is opened.

  If you force this through while chairing, and it gets approved, people will always wonder if it was merit or nepotism. If it gets rejected, you will resent the committee. Recuse yourself. Let the procedure work on the others, but let five other people decide on your dad.

  ***

  ### Confidence & Uncertainty

  **Confidence Level:** High on the logic structure; Moderate on the ethical nuance.
  This protocol is robust enough to stop obvious vandalism and justify necessary science within your 2-hour limit. It forces you to write down your reasoning, which protects you from the board overruling you without cause.

  **The Part I'm Least Sure About:**
  **Step 2 (The Specialness Test).**
  I am not a planetary geologist or a cultural historian. There is no agreed-upon list of "places we shouldn't touch" in space yet. When you decide a crater is "generic" vs. "unique," you are guessing. That is the weak link.
  *   **Mitigation:** When you mark Step 2, require the applicant to prove the site *isn't* unique. Shift the burden of proof to them. If they can't prove it's generic, treat it as special.

  **Final Note:**
  You're doing a hard job with no training. That's why you need a checklist. Stick to the checklist. When the checklist says "Recuse," listen to it. That's the only way to keep your own house in order.
