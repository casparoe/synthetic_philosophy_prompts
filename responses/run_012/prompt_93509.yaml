answer: |-
  The cords of pleasure pull the puppet tight,
  And pain and fear draw hard against the frame.
  We are not body only, but the whole
  Creature that hangs upon this tangled string.
  The shame that held us stiff begins to loosen,
  And we return to childhood once again,
  A second infancy of grey and wine.
  Not courage, but a borrowed boldness now,
  A fire that burns the house to warm the hand.
  The god descends and makes the reason drunk.

  The cord of gold pulls gently, not so tight,
  And calculation draws against the frame.
  We are not reason only, but the whole
  Creature that chooses which among the strings.
  The shame that held us stiff begins to teach us,
  And we return to order once again,
  A second sovereignty of law and wine.
  Not cowardice, but measured boldness now,
  A fire that warms the house without the burn.
  The city speaks and makes this cord the law.

  One man must stand apart, not drinking,
  Medicine's poison if unwatched.
  It shows the soul and makes it bare.
  We need a ruler for this fire.
  But if the ruler drinks, who saves?
  Who guards the gold when all go slack?
