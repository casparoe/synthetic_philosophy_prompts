answer: |-
  This is primarily a verbal dispute caused by polysemy, but it masks a substantive disagreement about whether biological facts include objective norms.

  Your hypothesis that "function" is doing two jobs is correct: the Selected Effects camp answers "Why is this trait here?" while the Causal Role camp answers "What does this trait do?" When these definitions diverge, such as in a surgically rewired heart, the two sides are not contradicting each other's facts but prioritizing different explanatory projects. The Selected Effects view explains the *presence* of the trait via evolutionary history, whereas the Causal Role view explains the *capacity* of the containing system via current mechanics. If philosophers simply acknowledged this division of labor, the debate would dissolve into pluralism, where each definition is used where it fits best.

  The reason the fight persists is the substantive stake over normativity. The Selected Effects camp insists their definition captures a real, mind-independent fact about malfunction—a heart *ought* to pump blood even if it cannot, because history set a standard. The Causal Role camp treats "malfunction" as merely a description of reduced capacity relative to a system's goals, which are often imposed by the observer. The genuine disagreement is not about the cases themselves, but about whether nature contains genuine "oughts" naturalized by selection history, or whether teleology is always a heuristic tool used by scientists.

  Progress here does not come from finding a case neither side can handle, since both sides can simply dismiss the other's criteria as irrelevant to their specific explanatory goal. Real progress comes from abandoning the search for a single universal definition and adopting context-dependent pluralism: use Selected Effects when explaining evolutionary retention and Causal Role when analyzing physiological mechanisms. The deadlock breaks when you stop asking "What is the function?" and start asking "Which explanatory project are we pursuing?"
