prompt: |-
  Okay so I'm three weeks into a philosophy of biology unit on biological function and I'm loosing my mind a little, because I genuinely can't tell if the two camps are disagreeing or just talking past each other. Setup as I understand it: one side says a trait's function is what it was selected for — hearts have the function of pumping blood because pumping is what got hearts kept around, so the function is fixed by history, and it can be "broken" when the history says one thing and the organ does another. The other side says a trait's function is the contribution it makes to the system it's sitting in right now — pumping blood is the heart's function because that's the role it plays in keeping the body going, and history is beside the point. Every seminar someone throws out the same awkward cases and everyone just re-explains there own side: a heart that's been surgically rewired to do something else, a vestigial organ that no longer does anything, a structure that now does something useful but was never selected for it. Nobody's wrong and nobody moves.

  Here's my hypothesis, please confirm or kill it: this is one word doing two jobs, not one disagreement. Question A is historical and has a normative edge — why is this thing here, and what would it take for it to be malfunctioning? Question B is ahistorical — what is this part doing in this system right now? If that's right, the awkward cases aren't counterexamples to either view, they're just cases where the two questions give different answers, which is allowed. What I can't work out is whether anything real is left over once you split the questions — like whether the historical notion is doing explanatory work the structural one simply can't do, which would make it more than just two tools for two jobs. A third possibility I keep flirting with is that the whole thing is downstream of whether "this heart is malfunctioning" even states a fact about the world or just registers what we want from the thing.

  So: is this verbal, two questions under one heading, or a genuine substantive disagreement in disguise — and if there's a real disagreement, what exactly is it about? And what would count as progress here, a case neither side can handle, or is it just underdetermined?

  Don't give me a reading list or a who-said-what, the syllabus has that, I want your actual verdict. Lead with the bottom line in your first sentence — your one-line call on what kind of disagreement this is — then give the reasons, no preamble, don't restate the question.
