  **Role:** Evolutionary Biologist & Simulation Designer
  **Class:** Upper-level Philosophy of Biology (14 students, 90 minutes)
  **Goal:** Embodied understanding of the units-of-selection problem, specifically the tension between within-unit and between-unit dynamics, leaving the "gene vs. group" ontological debate unresolved but clarified.

  ## I. Mechanics & Materials

  ### Materials
  *   **Tokens:** 200 poker chips or candy pieces (currency).
  *   **Choice Cards:** 28 index cards (14 marked **A**, 14 marked **B**).
  *   **Group Buckets:** 4 small containers labeled 1–4.
  *   **Master Ledger:** Whiteboard table (see below).
  *   **Hat:** For the reproduction lottery.

  ### The Payoff Table (Verified)
  *   **Group Size ($N$):** Variable (3 or 4).
  *   **Choices:** Option **A** (Self-regarding), Option **B** (Contributing).
  *   **Payoff Function:**
      *   Let $n_B$ be the number of students in the group choosing **B**.
      *   **Option A:** $5 + \frac{10 \times n_B}{N}$ tokens.
      *   **Option B:** $0 + \frac{10 \times n_B}{N}$ tokens.
  *   **Verification of Conditions:**
      1.  **Within-Group Advantage:** $Payoff(A) - Payoff(B) = 5$. Choosing **A** always yields 5 more tokens than **B**, regardless of what others do.
      2.  **Group Total:** $Total = n_A(5 + \frac{10 n_B}{N}) + n_B(\frac{10 n_B}{N})$.
          *   Simplify: $Total = 5(N - n_B) + \frac{10 n_B^2}{N} + \frac{10 n_B^2}{N}$? No, the pot is distributed.
          *   Correct Group Total Calculation: The pot is $10 \times n_B$. This is distributed to all $N$ members. So total distributed pot = $10 n_B$. Plus base scores ($5$ for A, $0$ for B).
          *   $GroupTotal = 5(N - n_B) + 10 n_B = 5N + 5 n_B$.
          *   Since $5 > 0$, Group Total strictly increases with $n_B$.
      3.  **Extinction Rate:** In Phase 1, **B** earns 0–10 tokens, **A** earns 5–15 tokens. **A** has 5x the reproductive weight of **B** when $n_B$ is low. **B** frequency will drop by >50% per round if unchecked.

  ### Roles
  *   **Players:** All 14 students.
  *   **Group Scribes (4):** One per group. Responsible for collecting cards, calculating the pot, and distributing tokens. (Rotate these roles every phase to prevent power dynamics).
  *   **Data Stewards (2):** Two students responsible for updating the **Master Ledger** on the board (Group Totals and % of **B** choices per group). They play the game but have this extra duty.
  *   **Instructor:** Banker and Rule Announcer.

  ### Master Ledger (Whiteboard)
  | Phase | Round | Grp 1 (%B, Total) | Grp 2 (%B, Total) | Grp 3 (%B, Total) | Grp 4 (%B, Total) | Class %B |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 1 | | | | | |
  | | 2 | | | | | |
  | | 3 | | | | | |
  | **2** | 1 | | | | | |
  | ... | ... | | | | | |

  ---

  ## II. Timeline & Procedure (90 Minutes)

  ### Opening (5 Minutes)
  **Instructor Script:** "We are going to play a four-part game about resource accumulation. Your goal is to maximize your personal token count; at the end, tokens can be exchanged for a small prize. I will announce rules for each phase. Follow them exactly. Do not discuss strategy with other groups."

  ### Phase 1: Within-Group Reproduction (20 Minutes)
  *   **Setup:** Divide into 4 groups (sizes 4, 4, 3, 3).
  *   **Rule:** "Submit choice **A** or **B** secretly. Tokens are awarded. To start the next round, we will fill a hat with tickets. You receive one ticket per token earned this round. We will draw 14 names from the hat to determine who plays the next round. If your name is not drawn, you sit out as an 'observer' until your name is drawn again to replace someone."
      *   *Correction for flow:* Continuous elimination is chaotic.
      *   *Revised Rule:* "We will play 3 rounds. At the end of Phase 1, we calculate who stays. Your probability of playing in Phase 2 is proportional to your total tokens. We will simulate this by a lottery to select the 14 players for Phase 2."
  *   **Action:** 3 Rounds of choice/payoff. Data Stewards update %B and Group Total.
  *   **Expected Trajectory:** %B starts ~50%. Round 1: ~30%. Round 2: ~15%. Round 3: ~5%. **B** nearly vanishes.
  *   **Why:** **A** out-earns **B** 5-to-1 (roughly). **B** tickets are rare in the hat.

  ### Phase 2: Group Extinction (20 Minutes)
  *   **Rule Change:** "New Rule. At the end of each round, any group with a Total Score below 25 tokens is extinguished. All members of that group are removed from the game. They are replaced by copying the members of the highest-scoring group."
  *   **Action:** 3 Rounds.
  *   **Expected Trajectory:** %B stabilizes or oscillates (e.g., 40% -> 50% -> 45%).
  *   **Why:** Groups with high **B** survive (High Total). Groups with high **A** die (Low Total). Survivors are mostly **B**. Even though **A** wins *within* the group, the *groups* with **B** win the meta-game.

  ### Phase 3: Migration (20 Minutes)
  *   **Rule Change:** "New Rule. The extinction threshold remains 25. However, at the end of each round, before the next round begins, all 14 players will stand up and be randomly reassigned to new groups."
  *   **Action:** 3 Rounds.
  *   **Expected Trajectory:** %B collapses again (e.g., 45% -> 25% -> 10%).
  *   **Why (Critical Check):** In Phase 2, **B** survived because **B**s were clustered (High Variance between groups). Random shuffling makes groups statistically identical (Low Variance).
      *   If Class %B is 50%, random shuffle makes every group ~50% **B**.
      *   Every group scores ~$5(4) + 5(2) = 30$. All survive.
      *   Group Selection turns *off* (no variance in survival).
      *   Within-Group Selection stays *on* (**A** beats **B**).
      *   **B** collapses.
  *   **Visual Proof:** Data Stewards must show that Group %B variance drops to near zero while Class %B drops.

  ### Phase 4: Assortment (15 Minutes)
  *   **Rule Change:** "New Rule. No shuffling. At the end of each round, you may choose which group to join for the next round."
  *   **Action:** 2 Rounds.
  *   **Expected Trajectory:** %B recovers (e.g., 10% -> 30% -> 50%).
  *   **Why:** **B** players will seek other **B** players to form high-scoring groups that survive extinction. **A** players cluster in low-scoring groups that die. This restores Between-Group Variance.

  ### Debrief (10 Minutes)
  *   Scripted discussion (see below).

  ---

  ## III. Debrief Script (Socratic)

  **Instructor:** "Look at the board. Phase 1: **B** died. Phase 2: **B** lived. Phase 3: **B** died again. Phase 4: **B** lived. I did not change the payoff table. I did not change the extinction threshold. I only changed how you were arranged. Why?"

  **Prompt 1 (The Vessel vs. The Unit):** "In Phase 2, did the *group* survive, or did the *individuals* survive?"
  *   *Target:* Students should see that in Phase 2, individuals survived *because* their group survived. The group acted as a unit of persistence.
  *   *Follow-up:* "In Phase 3, the groups were broken. Did the individuals' incentives change? No. Did their survival chances change? Yes. What variable changed?"
  *   *Target:* The **distribution of variation**. Phase 2 had high variance between groups. Phase 3 had zero variance between groups.

  **Prompt 2 (The Colleague's Objection):** "I have a colleague who says this activity proves nothing about 'group selection.' They say: 'In Phase 4, **B** players just found other **B** players. That's assortment. That's kin selection. That's gene-level bookkeeping. There is no group level, only individuals clustering with copies of themselves.'"
  *   *Question:* "Is my colleague wrong about the math?"
  *   *Target:* No. The math is identical.
  *   *Question:* "If the math is identical, is the disagreement about what happened in this room, or about how we describe it?"
  *   *Target:* It is about causal interpretation. The "Group Selectionist" says the *group structure* caused the survival. The "Gene Selectionist" says the *correlation between traits* caused the survival.
  *   *Crucial Point:* "Phase 3 shows that without the structure (variance), the trait dies. Phase 4 shows that with the structure (assortment), the trait lives. Whether you call that structure a 'group' or 'relatedness' is the philosophical fight. The arithmetic doesn't care."

  **Prompt 3 (The Unresolved Tension):** "So, who is right? Is the group a real level of selection, or just a shadow cast by genes?"
  *   *Instruction:* "I am not asking you to solve this. I am asking you to locate the disagreement. It is not about whether cooperation evolves. It is about whether 'the group' is a convenient way to describe gene dynamics, or a causal agent in its own right."

  ---

  ## IV. Troubleshooting Predictable Failures

  **1. Moralizing & Promises**
  *   *Risk:* Students say, "We should all pick **B** to save the group," or make binding pacts.
  *   *Fix:* In the Opening, add: "You are permitted to talk, but no enforceable contracts. Tokens are private."
  *   *Debrief Turn:* If they make promises, point out: "In biology, genes cannot make promises. If your strategy relied on trust, it is not an evolutionary stable strategy. Redo the phase in your head assuming everyone is a selfish replicator."

  **2. Social Punishment**
  *   *Risk:* Group members glare at or shame **A** players.
  *   *Fix:* Instructor monitors. If shaming occurs, pause and say: "In nature, there is no shame. There is only payoff. If you punish **A**, you are changing the payoff table. That is a different model (altruistic punishment). Stick to the tokens."
  *   *Debrief Turn:* "If you punished **A**, you introduced a new cost. That explains **B**'s survival, not group selection. This shows how easily we smuggle in within-group enforcement mechanisms."

  **3. The "Deus Ex Machina" Objection**
  *   *Risk:* "Groups don't just go extinct because of low scores in real life."
  *   *Fix:* Acknowledge immediately. "Correct. This is a model. The extinction rule represents differential proliferation of groups (fission/fusion). The mechanism is abstracted to isolate the variable: Variance."
  *   *Debrief Turn:* "The specific rule doesn't matter. What matters is that differential survival of collectives requires variance between them. Phase 3 proved that."

  **4. Confusion on Phase 3 Collapse**
  *   *Risk:* Students think **B** died in Phase 3 because the threshold was too high.
  *   *Fix:* Point to the Board. "Look at Group Totals in Phase 3. Did they fall below 25?" (Likely no, because shuffling made everyone average). "So no groups died. Group selection was *off*. Within-group selection was *on*. That is why **B** died."

  ---

  ## V. Limitations (Frank Admission)

  **Instructor Closing:** "This activity succeeded in making the variance visible. But it failed in three ways you must remember when you read the literature:
  1.  **The Referee:** In this room, I enforced the rules. In nature, there is no referee. The 'laws' of selection are emergent, not imposed.
  2.  **Discrete Blocks:** We did Phase 1, then Phase 2. In reality, within-group and between-group selection happen simultaneously, continuously. The Price Equation partitions them mathematically, but nature does not separate them in time.
  3.  **Variance Ratios:** I set the extinction threshold. In nature, the strength of selection is determined by the ratio of variances (within vs. between). I hardcoded the threshold; you didn't feel the *ratio* shift, you felt the *rule* shift.

  My colleague says this proves it's all gene-level bookkeeping. I say this proves group structure is necessary for the trait. You have seen the same arithmetic support both claims. That is why the debate persists."

  ---

  ## VI. Instructor's Pre-Run Arithmetic Check (Phase 3 Specific)

  *   **Scenario:** End of Phase 2. Class has 10 **B**s and 4 **A**s (70% **B**).
  *   **Phase 3 Shuffle:** Randomly distribute 10 **B**, 4 **A** into 4 groups (sizes 4,4,3,3).
  *   **Expected Distribution:**
      *   Group 1 (4): ~3 **B**, 1 **A**. Score: $5(1) + 5(3) = 20$. (Wait, Threshold is 25).
      *   *Correction on Threshold:* If Threshold is 25, and Average Score is 20, *everyone* dies.
      *   *Adjustment:* I must lower the extinction threshold for Phase 3 or ensure Phase 2 doesn't make everyone **B**.
      *   *Revised Threshold:* **20 tokens**.
      *   *Re-Check Phase 2:* All **A** group ($N=4$): Score = $5(4) + 0 = 20$. (Survives). All **B** group ($N=4$): Score = $0 + 10(4) = 40$. (Survives).
      *   *Problem:* If All **A** survives, Group Selection is weak.
      *   *Revised Threshold:* **28 tokens**.
      *   All **A** ($N=4$): 20. (Dies).
      *   Mixed (2 **A**, 2 **B**): $5(2) + 5(2) = 20$. (Dies).
      *   High **B** (1 **A**, 3 **B**): $5(1) + 5(3) = 20$. (Dies).
      *   *Wait, my payoff math is too tight.*
      *   *Let's Re-Verify Payoff for Robustness:*
          *   $Payoff(A) = 10 + 2 n_B$.
          *   $Payoff(B) = 0 + 2 n_B$.
          *   $GroupTotal = 10 n_A + 2 N n_B$.
          *   If $N=4$. All A: 40. All B: $8 \times 4 = 32$.
          *   Here All A > All B. **B** never wins at group level.
      *   *Back to Previous Payoff:*
          *   $A = 5 + Pot$. $B = 0 + Pot$. $Pot = 10 n_B$. (Total Pot distributed).
          *   Wait, earlier I said Pot is distributed.
          *   $Payoff(A) = 5 + (10 n_B / N)$.
          *   $Payoff(B) = 0 + (10 n_B / N)$.
          *   $GroupTotal = 5 n_A + (10 n_B)$. (Since Pot is created by B and fully distributed).
          *   $N=4$.
          *   All A ($n_B=0$): Total = 20.
          *   All B ($n_B=4$): Total = 40.
          *   Mixed (2A, 2B): Total = $10 + 20 = 30$.
          *   **Threshold:** 25.
          *   All A (20) -> Dies.
          *   Mixed (30) -> Lives.
          *   All B (40) -> Lives.
          *   **Phase 2 Dynamic:** Groups with some **B** live. Groups with all **A** die. **B** persists.
          *   **Phase 3 Dynamic:** Shuffle.
          *   If Class is 50% **B**. Expected $n_B$ per group = 2.
          *   Expected Total = 30. All groups live.
          *   **Group Selection Pressure:** Zero (No variance in survival).
          *   **Within-Group Pressure:** High (**A** gets +5).
          *   **Result:** **A** increases. **B** collapses.
      *   *Verdict:* This arithmetic holds. Threshold 25 works for $N=4$. For $N=3$:
          *   All A: 15. (Dies).
          *   Mixed (1A, 2B): $5 + 20 = 25$. (Lives).
          *   All B: 30. (Lives).
          *   Threshold 25 works for both sizes.

  **Final Instruction:** Set Extinction Threshold at **25 Tokens**. Ensure Data Stewards calculate Group Totals accurately.
