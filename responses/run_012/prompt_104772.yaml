answer: |-
  # Planning Commission Decision Procedure: The "Right-to-the-City" Protocol

  **To:** Planning Commission Members
  **From:** Chair
  **Subject:** Operationalizing the Comprehensive Plan Preamble
  **Effective:** Immediate

  This document is a decision procedure. It is not a scoring rubric. It does not calculate a "net benefit." It is a sequence of thresholds designed to force us to identify exactly which moral claim is at stake when we vote. It converts the four claims of the Preamble (Habitation, Participation, Appropriation, Openness) into a sequence of findings.

  **Constraint:** We have 30 minutes per contested case. We rely on the Staff Memo. We are not experts.
  **Rule of Missing Data:** If the Staff Memo lacks a datum required by a threshold step, the burden of proof lies with the **Applicant**. If the Applicant does not supply it at the hearing, we must assume the negative (i.e., assume displacement *will* occur, assume capacity *will* drop). We do not continue hearings to gather data.

  ---

  ## I. The Procedure (Order of Operations)

  ### Step 1: Legal & Technical Compliance (The Gate)
  *   **Question:** Does the proposal meet all objective zoning codes, building codes, and state housing element mandates?
  *   **Source:** Staff Memo, Section: "Compliance."
  *   **Sufficient Answer:** "Yes" (Staff recommends approval) or "No" (Staff cites specific code violations).
  *   **Action:**
      *   If **No**: **STOP.** Vote to Deny. (Referral to Attorney only if the code interpretation is disputed).
      *   If **Yes**: Proceed to Step 2.

  ### Step 2: Participation (Preamble Claim 2)
  *   **Question:** Have the *factually affected* parties been notified and given a chance to shape the proposal, not just comment?
  *   **Definition:** "Factually affected" = Anyone within the impact zone defined in the Memo (e.g., 500ft radius) PLUS identified tenants in structures to be altered/demolished. Attendance at the hearing is irrelevant.
  *   **Source:** Staff Memo, Section: "Outreach/Notification."
  *   **Sufficient Answer:** Proof that notification was sent to all factually affected parties AND that the applicant modified the plan in response to at least one substantive concern raised by them.
  *   **Action:**
      *   If **No**: **STOP.** Vote to Continue (one time only) to fix notification OR Vote to Deny if notification is impossible.
      *   If **Yes**: Proceed to Step 3.
  *   **Judgment Call Flag:** Determining who is "factually affected" beyond the statutory radius is a judgment call. Default to the Staff Memo's definition unless a commissioner articulates a specific excluded group.

  ### Step 3: Habitation (Preamble Claim 1)
  *   **Question:** Does this decision extinguish the claim of current residents to live there at a cost they can bear?
  *   **Definition:** "Extinguish" = Physical displacement without a guaranteed right of return at *current* rent, OR rent increase > 10% for existing tenants. "Outbid" = Replacing low-cost stock with higher-cost stock.
  *   **Source:** Staff Memo, Section: "Displacement Impact/Existing Conditions."
  *   **Sufficient Answer:**
      *   **Pass:** Zero displacement OR Right of Return at current rent for 100% of displaced tenants.
      *   **Fail:** Any permanent displacement of current tenants OR net loss of rent-controlled/deed-restricted units.
  *   **Action:**
      *   If **Pass**: Proceed to Step 4.
      *   If **Fail**: **STOP.** The proposal is presumptively Denied. It may only be Approved if the Commission invokes the **Openness Override** (see Step 5).
  *   **Judgment Call Flag:** Determining if a tenant "can bear" the new cost is a judgment call. Use the Memo's AMI (Area Median Income) calculations. If the Memo is silent, assume they cannot bear it.

  ### Step 4: Openness (Preamble Claim 4)
  *   **Question:** Does this decision add housing capacity for those not yet here (the priced-out/future)?
  *   **Definition:** "Add capacity" = Net increase in dwelling units OR net increase in permanently affordable units citywide.
  *   **Source:** Staff Memo, Section: "Housing Capacity/Regional Need."
  *   **Sufficient Answer:**
      *   **Pass:** Net positive units OR Net positive affordable units.
      *   **Fail:** Net zero or Net negative units (e.g., downzoning, demolition without replacement).
  *   **Action:**
      *   If **Pass**: Proceed to Step 5.
      *   If **Fail**: **STOP.** The proposal is presumptively Denied. It may only be Approved if the Commission invokes the **Appropriation Override** (see Step 5).
  *   **Judgment Call Flag:** Estimating "citywide capacity" impact for small projects is a judgment call. Rely on the Staff Memo's aggregate data.

  ### Step 5: The Conflict Resolution (The Vote)
  *   **Context:** You are here because Step 3 (Habitation) or Step 4 (Openness) failed, or both passed but Step 3 (Appropriation) is contested.
  *   **Question:** Which claim takes precedence in this specific instance?
  *   **Scenario A (Habitation Failed, Openness Passed):** *Example: New market-rate housing displaces old tenants.*
      *   **The Vote:** Are we willing to violate the right of current residents to stay (Claim 1) to satisfy the need for future housing (Claim 4)?
      *   **Requirement:** 5/7 Vote to Approve. (Supermajority required to override Habitation).
      *   **Finding:** Must explicitly state: "The Commission finds the need for Openness outweighs the claim to Habitation."
  *   **Scenario B (Openness Failed, Habitation Passed):** *Example: Downzoning to protect neighborhood character.*
      *   **The Vote:** Are we willing to violate the city's duty to the excluded/future (Claim 4) to protect current residents (Claim 1)?
      *   **Requirement:** 5/7 Vote to Approve. (Supermajority required to override Openness).
      *   **Finding:** Must explicitly state: "The Commission finds the claim to Habitation outweighs the duty of Openness."
  *   **Scenario C (Both Failed):** *Example: Demolition with no net gain.*
      *   **The Vote:** Automatic Denial. No discretion.
  *   **Scenario D (Both Passed):** *Example: New affordable housing on vacant land.*
      *   **The Vote:** Proceed to Step 6 (Appropriation). Simple Majority (4/7) to Approve.

  ### Step 6: Appropriation (Preamble Claim 3)
  *   **Question:** Does this decision support a "form of life" or merely a stock of dwellings?
  *   **Definition:** "Form of Life" = Social networks, cultural institutions, non-market uses (gardens, gathering spaces) identified in the hearing record.
  *   **Source:** Hearing Testimony (Record).
  *   **Sufficient Answer:** Qualitative finding that the "social worth" is preserved or enhanced.
  *   **Action:** This step cannot override a failure in Step 3 or 4. It only breaks ties when both pass.
  *   **Judgment Call Flag:** This is entirely a judgment call. There is no data. Commissioners must articulate the specific "form of life" at risk.

  ### Step 7: Legal Referral
  *   **Trigger:** If the Commission wishes to approve a proposal that fails Step 3 (Habitation) or Step 4 (Openness) without the required 5/7 vote, OR if the findings contradict the Staff Memo's factual assertions.
  *   **Action:** Refer to City Attorney for review of liability before finalizing findings.

  ---

  ## II. Written Findings Skeleton

  *Per the Municipal Code, all contested decisions must include these findings.*

  1.  **Compliance:** The proposal [Does/Does Not] meet objective zoning standards.
  2.  **Participation:** The factually affected parties were [Adequately/Inadequately] notified. The proposal [Did/Did Not] incorporate their input.
  3.  **Habitation:** The proposal [Preserves/Violates] the claim of current residents to remain at bearable cost. [If Violates: Specify number of households displaced].
  4.  **Openness:** The proposal [Increases/Decreases] citywide housing capacity for the excluded. [If Decreases: Specify net unit loss].
  5.  **Conflict Resolution:** [If applicable] The Commission explicitly prioritizes Claim [1 or 4] over Claim [4 or 1] because [Reason]. This decision requires a 5/7 vote.
  6.  **Appropriation:** The proposal [Supports/Undermines] the neighborhood as a form of life by [Specific Factor].
  7.  **Decision:** Approved / Denied / Continued.

  ---

  ## III. Test Cases (Simulation)

  Here is how the procedure applies to your three scenarios. Note the outcomes.

  ### Case A: The Market-Rate Displacement
  *   **Facts:** 60-unit market-rate (12 @ 60% AMI) replaces 12-unit rent-controlled. Tenants displaced; right of return at new rents (unaffordable).
  *   **Step 1 (Compliance):** Pass.
  *   **Step 2 (Participation):** Pass (Assume notification sent).
  *   **Step 3 (Habitation):** **FAIL.** Tenants cannot afford return. They are "outbid."
  *   **Step 4 (Openness):** **PASS.** Net gain of 48 units, 12 affordable.
  *   **Step 5 (Conflict):** Habitation Failed, Openness Passed.
      *   **Procedure Requirement:** To Approve, Commission must vote 5/7 to prioritize Openness over Habitation.
      *   **Likely Outcome:** **DENIAL.** (Most commissions cannot muster 5/7 to explicitly vote to displace poor tenants, even for growth).
  *   **Political Intolerance:** This is intolerable to **YIMBYs, Developers, and Moderate Housing Advocates.** The procedure blocks a project that adds significant supply and some affordable units because it violates the "right to stay" of the existing 12. It prioritizes the specific current poor over the general future poor.

  ### Case B: The Protective Downzoning
  *   **Facts:** Historically Black neighborhood petitions to downzone to stop teardowns/speculation. Cuts citywide capacity by 200 units.
  *   **Step 1 (Compliance):** Pass (Downzoning is legal).
  *   **Step 2 (Participation):** Pass (Neighborhood petitioned).
  *   **Step 3 (Habitation):** **PASS.** Prevents displacement of current residents.
  *   **Step 4 (Openness):** **FAIL.** Reduces citywide capacity by 200 units. Fails the "people who will need this city in twenty years."
  *   **Step 5 (Conflict):** Openness Failed, Habitation Passed.
      *   **Procedure Requirement:** To Approve, Commission must vote 5/7 to prioritize Habitation over Openness.
      *   **Likely Outcome:** **DENIAL.** (Most commissions cannot muster 5/7 to explicitly vote against regional housing needs, especially given state pressure).
  *   **Political Intolerance:** This is intolerable to **Community Equity Advocates and the Neighborhood.** The procedure forces the commission to reject a tool for preventing gentrification because it violates the "duty to the future." It prioritizes the abstract future excluded over the specific current marginalized.

  ### Case C: The Community Land Trust (CLT)
  *   **Facts:** CLT builds affordable housing. Requires demolishing 40 units unsubsidized. Relocates 30 households (no right of return at same cost).
  *   **Step 1 (Compliance):** Pass.
  *   **Step 2 (Participation):** Pass.
  *   **Step 3 (Habitation):** **FAIL.** 30 households displaced, unsubsidized stock lost.
  *   **Step 4 (Openness):** **PASS.** Affordable units created (assuming net gain or equal gain with higher affordability).
  *   **Step 5 (Conflict):** Habitation Failed, Openness Passed.
      *   **Procedure Requirement:** To Approve, Commission must vote 5/7 to prioritize Openness over Habitation.
      *   **Likely Outcome:** **DENIAL.**
  *   **Political Intolerance:** This is intolerable to **Affordable Housing Developers and Progressive Allies.** The procedure blocks "good" affordable housing because it harms existing "unsubsidized" poor tenants. It refuses to sacrifice one group of poor people for another.

  ---

  ## IV. Critique: Limitations and Failures

  ### 1. What This Procedure Cannot Decide
  This procedure cannot resolve **Claim 3 (Appropriation)** when it conflicts with Claims 1 or 4. Because "form of life" is qualitative, Step 6 is advisory. If a project passes Habitation and Openness but destroys a cultural landmark (e.g., a jazz club becomes condos), the procedure has no mechanism to deny it. It relies on the Commission's courage to use the "Appropriation Override" in Step 5, which is not codified as a hard threshold.

  ### 2. Where It Will Misfire in Practice
  *   **The Missing Data Trap:** The rule "If Memo is silent, assume the negative" will paralyze the Commission. Staff Memos rarely quantify "form of life" or precise "displacement risk" for small sites. Commissioners will spend 25 minutes arguing about whether the data is missing rather than deciding the case.
  *   **The Attorney Bottleneck:** Any 5/7 vote to override Habitation or Openness triggers a legal review (Step 7). This slows the process and invites the City Attorney to effectively veto the Commission's moral choice by citing liability risks.
  *   **The "Factually Affected" Fight:** Step 2 looks procedural, but defining "affected" is political. If we define it broadly, we delay everything. If narrowly, we violate the Preamble.

  ### 3. The Least Work Claim: Appropriation (Claim 3)
  **Claim 3 (Appropriation) does the least work.**
  In the procedure above, Claim 3 is the only one that cannot trigger an automatic stop or require a supermajority override.
  *   **Why:** "Form of life" is incommensurable with "units" (Openness) and "tenants" (Habitation). You cannot weigh a social network against a housing quota in a binary procedure.
  *   **Evidence:** In Cases A, B, and C, the outcome is determined entirely by the tension between Habitation (Current) and Openness (Future). Appropriation is merely rhetorical flavor added in Step 6.
  *   **Recommendation:** If you dropped Claim 3 entirely, the Procedure would yield the **exact same outcomes** in all three test cases, but would be faster and legally safer. Claim 3 is the philosophical soul of the Preamble, but it is operationally redundant given the strength of Claim 1.

  ### 4. Final Note on the "Intolerable" Results
  You asked for outcomes that are politically intolerable. This procedure guarantees them.
  *   It stops **Gentrification** (Case A) by protecting current tenants, which stops **Growth**.
  *   It stops **Exclusionary Preservation** (Case B) by protecting future tenants, which accelerates **Displacement**.
  *   It stops **Affordable Development** (Case C) if it harms *any* current tenants, which stalls **Production**.

  This is not a bug. The Preamble asserts four absolute claims. In a capitalist land market, these claims are mutually exclusive. This procedure does not hide that contradiction; it forces you to vote on which contradiction you prefer. If the Commission finds these results intolerable, the fault lies not in the procedure, but in the Preamble's refusal to rank its own values.
