prompt: |-
  I teach political philosophy at a state university and, as a civic side-project, I chair the planning commission of the mid-sized city where I live. I would like you to write the commission a decision procedure.

  The setting: we hear about forty matters a year. Most are uncontested — variances, minor subdivisions, sign permits — and we dispatch them in minutes. The cases that divide us are rezonings, conditional-use permits, and demolition approvals, where we must adopt written findings that the city council can override only by a two-thirds vote and that are the record if a decision is appealed. We are seven appointed volunteers; none of us is trained in law, planning, or economics. Our only inputs are a ten-to-fifteen-page staff memo and a hearing that often runs past eleven; we deliberate for about half an hour per case, on the record, and the city attorney reviews our findings afterward.

  Two years ago I drafted, and the council adopted, a preamble to our comprehensive plan that commits us to what the right-to-the-city tradition has always meant by that phrase, but which we have never managed to turn into anything we can actually apply. As adopted, it contains four claims. First, habitation: those who live somewhere have a claim to go on living there at a cost they can bear, and that claim is not extinguished by their being outbid. Second, participation: those who will bear the consequences of a land-use decision have a claim to shape it, not merely to comment on it, and who counts as affected is a question of fact about the decision, not of who happened to turn up at the hearing. Third, appropriation: a neighborhood is where a form of life is made, not merely a stock of dwellings, and its worth to its inhabitants is not exhausted by what they would pay for it. Fourth, openness: the claims of those not yet here — the priced-out, the excluded, the people who will need this city in twenty years — belong in the same ledger, and a city that cannot add housing fails them.

  Write the procedure that turns this preamble into something a commissioner can run during a hearing. I want the questions in order; what counts as a sufficient answer to each; which item in the staff memo would supply it; where the procedure stops with a no; where it must hand the question to a discretionary vote of the commission, and what exactly that vote is about; and where it must go to the city attorney rather than be resolved by us. Give us a fixed skeleton for the written findings, and say what to do when the memo lacks the datum a step requires — we cannot commission a displacement study mid-hearing. Keep what the preamble actually says while making it usable by someone without the theory; tell me which of its distinctions must survive the simplification and which can be dropped. Do not launder an incommensurable trade-off through a scoring rubric or a weighted average: if two of the claims cannot be ranked on the facts of a case, the procedure should say so and say what the vote is really deciding. Flag every step that is a judgment call dressed up as procedure.

  Then run the procedure on three cases. (a) A sixty-unit market-rate building with twelve units at sixty percent of area median income, on a site now occupied by a twelve-unit rent-controlled building whose tenants have lived there for decades; they would get relocation payments and a right of first refusal to return at the new rents, which they cannot pay. (b) A downzoning petition from a historically Black neighborhood that has been losing its housing to teardown and speculation; granting it would cut citywide capacity by roughly two hundred units over a decade. (c) A community land trust's affordable project, beloved by everyone in the room, whose financing requires relocating thirty households and demolishing forty units of unsubsidized housing that will not be replaced. At least two of the three should come out in a way that will be politically intolerable to this commission, and I want you to say plainly which ones and why the framework forces the result.

  Close by telling me what this procedure cannot decide, where it will misfire in practice, and which of the four claims is doing the least work — that is, which one the procedure could drop without changing a single outcome.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Political philosophy professor & Planning Commission Chair (mid-sized city).
      *   **Task:** Write a decision procedure for the Planning Commission based on a specific "Right-to-the-City" preamble adopted by the City Council.
      *   **Context:** 7 volunteer commissioners (no expertise), ~40 cases/year (most easy, some hard), limited time (30 min deliberation), staff memo (10-15 pages), hearing record, city attorney review, council override (2/3 vote).
      *   **The Preamble (4 Claims):**
          1.  *Habitation:* Existing residents have a claim to stay at bearable cost (not extinguished by being outbid).
          2.  *Participation:* Affected parties shape decisions (not just comment); "affected" is factual, not attendance-based.
          3.  *Appropriation:* Neighborhoods are forms of life, not just housing stock; value > market price.
          4.  *Openness:* Future/excluded people matter; city must add housing.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Source of data (staff memo).
          *   Stop conditions (automatic "no").
          *   Discretionary vote triggers (what the vote is *actually* about).
          *   Legal referral triggers.
          *   Fixed skeleton for written findings.
          *   Handling missing data (no mid-hearing studies).
          *   Simplify theory for lay use but keep core distinctions.
          *   No scoring rubrics for incommensurable trade-offs (flag the conflict).
          *   Flag judgment calls disguised as procedure.
          *   **Test Cases:** Run on three specific scenarios (a, b, c). At least two must yield politically intolerable results, explaining why.
          *   **Critique:** What can't it decide? Where will it misfire? Which claim does the least work?

  2.  **Deconstruct the Preamble for Operationalization:**
      *   *Habitation:* Focus on displacement and affordability for *current* residents. Key metric: Can they stay?
      *   *Participation:* Focus on *who* was consulted vs. who is affected. Key metric: Did the process reach the factual "affected" class?
      *   *Appropriation:* Focus on social fabric vs. physical structures. Key metric: Is the "form of life" destroyed or preserved?
      *   *Openness:* Focus on regional housing need and future residents. Key metric: Does this add capacity for the excluded?

      *Tension:* Habitation/Appropriation (protect current) vs. Openness (add housing/allow change). Participation is procedural but impacts the weight of the other three.

  3.  **Drafting the Procedure (The "Skeleton"):**
      *   Need a flowchart logic.
      *   *Step 1: Legal/Technical Compliance.* (Standard planning stuff, keep brief).
      *   *Step 2: Participation Check.* (Preamble Claim 2). Did we hear from the *actual* affected?
      *   *Step 3: Habitation Check.* (Preamble Claim 1). Displacement risk.
      *   *Step 4: Appropriation Check.* (Preamble Claim 3). Social fabric.
      *   *Step 5: Openness Check.* (Preamble Claim 4). Housing supply.
      *   *Step 6: The Conflict Resolution.* (Where the trade-offs happen).
      *   *Findings Structure:* Needs to map to these steps.

      *Refining the "Stop" Conditions:*
      *   If Legal fails -> Deny/Refer.
      *   If Participation fails -> Continue hearing (procedural fix).
      *   If Habitation fails (mass displacement without mitigation) -> High bar for approval.
      *   If Openness fails (no housing added where needed) -> High bar for approval.

      *Handling Missing Data:* The prompt says we can't commission studies mid-hearing. The procedure must rely on the *Staff Memo*. If the memo is silent, the burden of proof falls on the applicant or the commission must assume the negative/positive based on a default rule. Let's make the default rule protective of the *status quo* (Habitation) unless the Memo proves Openness benefits.

      *Flagging Judgment Calls:* Crucial. The procedure can't calculate "form of life." It must ask commissioners to declare it.

  4.  **Developing the Test Cases:**
      *   *Case A (Market-rate w/ some affordable, displaces rent-controlled):*
          *   Habitation: Fails (tenants can't afford return).
          *   Openness: Passes (adds net units, some affordable).
          *   Appropriation: Mixed (new form of life vs. old).
          *   *Result:* Procedure should likely flag the Habitation failure. If Habitation is a "right," this might be a "No" or a very hard "Yes" requiring discretionary vote on the trade-off. To make it "politically intolerable," the procedure should probably *deny* this because it violates the core "not extinguished by being outbid" clause.
      *   *Case B (Downzoning in Black neighborhood):*
          *   Habitation: Passes (stops displacement/teardowns).
          *   Appropriation: Passes (preserves existing form of life).
          *   Openness: Fails (reduces citywide capacity, hurts future/excluded).
          *   *Result:* Procedure should likely *deny* the downzoning because Openness (citywide need) trumps local protectionism, OR it forces a vote on whether local preservation outweighs regional need. To make it "intolerable," the procedure should prioritize Openness (regional housing need) over local Habitation/Appropriation, forcing commissioners to vote against the historically Black neighborhood's wish to stabilize.
      *   *Case C (CLT Affordable, displaces unsubsidized):*
          *   Habitation: Fails (30 households displaced).
          *   Openness: Passes (affordable housing created).
          *   Appropriation: Mixed (CLT is good form of life, but demolition is destructive).
          *   *Result:* This is the "Good vs. Good" conflict. Affordable housing (Openness) vs. Current Tenants (Habitation). To make it intolerable, the procedure should force the commission to acknowledge they are sacrificing current poor tenants for future poor tenants. It might require a denial or a supermajority to approve. Let's make the procedure require a "No" on displacement unless *all* current tenants are housed, which financing doesn't allow.

      *Selection for Intolerance:*
      *   Case A: Denial of "growth/affordable set-aside" because it displaces existing poor. (Developers/Housing Advocates hate this).
      *   Case B: Denial of "neighborhood stabilization" because it hurts regional supply. (NIMBYs/Community Activists hate this).
      *   Case C: Denial of "affordable CLT" because it displaces existing unsubsidized tenants. (Housing Advocates hate this).
      *   *Decision:* I will structure the procedure so that *Habitation* is a threshold right. If it's violated, you need a supermajority to override. This makes A and C very hard to pass. For B, *Openness* is a threshold duty. If capacity drops, you need a supermajority. This makes B hard to pass.
      *   *Wait, the prompt asks for "At least two... politically intolerable."*
      *   Let's refine:
          *   Case A: Procedure forces **Denial**. (Intolerable to YIMBYs/Developers/Moderates who want the 12 AMI units).
          *   Case B: Procedure forces **Denial**. (Intolerable to the Neighborhood/Equity advocates who want to stop gentrification).
          *   Case C: Procedure forces **Denial**. (Intolerable to Affordable Housing Developers).
      *   Actually, if I make *all three* deny, that's strong. But I need to ensure the logic holds.
      *   *Revised Strategy:* The procedure prioritizes *Habitation* (Claim 1) as a negative right (do no harm) and *Openness* (Claim 4) as a positive duty (add housing).
      *   Case A: Violates Habitation. (Deny).
      *   Case B: Violates Openness. (Deny).
      *   Case C: Violates Habitation (displaces 30) to satisfy Openness. (Deny, because Habitation is a threshold).
      *   This creates a "Gridlock" scenario which is philosophically honest but politically explosive.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Set the tone. This is a tool for deliberation, not a calculator.
      *   **The Flow:**
          1.  Threshold: Legal/Staff Compliance.
          2.  Threshold: Participation (Claim 2).
          3.  Threshold: Habitation (Claim 1).
          4.  Threshold: Openness (Claim 4).
          5.  Discretion: Appropriation (Claim 3) & Trade-offs.
      *   **The Findings:** Template.
      *   **Missing Data:** Burden of Proof rules.
      *   **Test Cases:** Apply the logic rigorously.
      *   **Critique:** Honest assessment of limitations.

  6.  **Refining the "Judgment Calls":**
      *   I need to explicitly mark where the commissioner is just guessing. E.g., determining "form of life."
      *   I need to ensure the "Openness" vs. "Habitation" conflict is explicit. No averaging.

  7.  **Addressing the "Least Work" Claim:**
      *   Which claim is redundant?
      *   *Appropriation* (Claim 3) is the softest. "Form of life" is vague. Habitation covers the physical staying. Openness covers the future. Participation covers the process. Appropriation is often just a rhetorical flourish for Habitation. I will argue this in the critique.

  8.  **Review against Constraints:**
      *   *Order:* Yes.
      *   *Sufficient Answer:* Yes.
      *   *Memo Source:* Yes.
      *   *Stop/No:* Yes.
      *   *Discretionary Vote:* Yes.
      *   *Attorney Referral:* Yes.
      *   *Findings Skeleton:* Yes.
      *   *Missing Data:* Yes.
      *   *Test Cases:* Yes (A, B, C).
      *   *Intolerable Results:* Yes.
      *   *Critique:* Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Constraint:* "None of us is trained in law." -> Keep legal referrals clear.
      *   *Constraint:* "30 min deliberation." -> Procedure must be fast. No complex scoring. Binary thresholds.
      *   *Constraint:* "Right-to-the-City tradition." -> Ensure the language reflects the anti-commodification stance (e.g., "not extinguished by being outbid").
      *   *Constraint:* "Do not launder... through a scoring rubric." -> Explicitly state when a vote is a choice between incommensurables.

  10. **Final Polish:** Ensure the tone is professional, academic yet practical, matching the user's persona (Prof/Chair). (Self-correction: Make sure the distinction between "Procedure" and "Commentary" is clear).

  *(Self-Correction during drafting Case B)*: If the procedure denies downzoning because of Openness, is that consistent with Right-to-the-City? Yes, Claim 4 explicitly says "a city that cannot add housing fails them." However, Claim 1 says residents have a claim to stay. Downzoning helps Claim 1 but hurts Claim 4. The procedure must force a choice. I will set it up so Claim 4 (Openness) is a citywide duty that trumps local Claim 1 *unless* the local displacement is catastrophic. In Case B, displacement is the *fear*, not the certainty (teardowns are speculative). So Openness wins. This is intolerable to the neighborhood.

  *(Self-Correction during drafting Case C)*: CLT displacing tenants. Claim 1 says current tenants have a claim not extinguished by being outbid. Even if the new use is "good" (affordable), the current tenants lose. Claim 4 says we need housing. This is a direct clash. The procedure should treat Claim 1 as a "Negative Right" (Do not harm existing) and Claim 4 as a "Positive Duty" (Build more). Negative rights usually trump positive duties in liberal frameworks, but RtC is different. However, to make it usable, I will prioritize *identified* current humans over *theoretical* future humans. So Case C gets denied. Intolerable to housing advocates.

  *(Self-Correction on "Least Work"):* Participation (Claim 2) is procedural. It doesn't determine the *outcome* of the land use, only the validity of the hearing. Habitation, Appropriation, Openness determine the *merits*. However, Appropriation is the most vague. I'll argue Appropriation does the least work because it collapses into Habitation (staying) or Openness (future use).

