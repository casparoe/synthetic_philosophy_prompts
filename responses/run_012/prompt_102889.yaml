answer: |-
  **MEMORANDUM**

  **TO:** Analytic Staff and Board Members
  **FROM:** Chair, Analytic Standards Board
  **DATE:** October 26, 2023
  **SUBJECT:** Guidance on Updating Credences with Conditional Source Reporting (Case File: Kestrel/Marlin)

  **1. PURPOSE**

  This memo constitutes the Analytic Standards Board's written opinion regarding the proper treatment of conditional evidence in probabilistic risk assessments. Specifically, it addresses how analysts should update credences when a reliable source provides an indicative conditional statement (e.g., "If P, then Q") without asserting the truth of the antecedent or the negation of the alternative.

  This guidance is binding for the Kestrel/Marlin case currently under review and establishes a precedent for similar evidentiary structures in future assessments.

  **2. THE QUESTION**

  Analysts are working with a four-cell hypothesis space regarding a target's location: (Kestrel, Depot), (Kestrel, Transit), (Marlin, Depot), and (Marlin, Transit). The prior distribution is uniform (0.25 per cell).

  A source judged *reliable* reports: *"If the target is in Kestrel, it is at a depot."*

  Two interpretations have emerged:
  1.  **The Material Conditional Interpretation:** Treat the report as the proposition $\neg \text{Kestrel} \lor \text{Depot}$. Condition on this proposition. This assigns zero probability to (Kestrel, Transit) and redistributes mass uniformly across the remaining three cells (1/3 each).
  2.  **The Conditional Constraint Interpretation:** Treat the report as information regarding the conditional probability $P(\text{Depot} | \text{Kestrel})$. Maintain positive probability on all cells, adjusting the internal distribution of the Kestrel hypothesis while preserving the marginal probability of Kestrel vs. Marlin.

  **3. BOARD DECISION AND RECOMMENDATION**

  **3.1 The Ruling**
  The Board rejects the Material Conditional Interpretation (Faction 1) for operational forecasting purposes. The Board adopts the Conditional Constraint Interpretation (Faction 2).

  Analysts are directed to treat source reports of the form "If A, then B" as constraints on the conditional probability $P(B|A)$, proportional to the source's reliability rating, rather than as logical propositions that eliminate hypothesis cells.

  **3.2 Specific Posterior for Kestrel/Marlin Case**
  For the specific case at hand, assuming the designation "reliable" corresponds to a standard confidence weight of 0.90 (per Board Manual §4.2), the analyst's posterior distribution shall be:

  *   **P(Kestrel, Depot): 0.45**
  *   **P(Kestrel, Transit): 0.05**
  *   **P(Marlin, Depot): 0.25**
  *   **P(Marlin, Transit): 0.25**

  **4. REASONING**

  The Board's decision rests on three operational pillars: the prohibition on zero probabilities (Cromwell's Rule), the preservation of independence assumptions, and the distinction between logical implication and evidentiary support.

  **4.1 Operational Prohibition on Zeroing (Cromwell's Rule)**
  Our clients rely on these assessments to manage tail risk. Assigning a probability of exactly 0.0 to a physically possible scenario ((Kestrel, Transit)) renders the model incapable of updating should contradictory evidence emerge later. Unless a scenario is logically or physically impossible, it must retain non-zero credence. The Material Conditional Interpretation requires zeroing out (Kestrel, Transit). This violates our operational standard for robustness.

  **4.2 The Irrelevant Alternative Problem**
  Under the Material Conditional Interpretation, the total probability mass of the *Marlin* hypothesis increases from 0.50 to 0.66 (1/3 + 1/3) simply because a source made a claim about *Kestrel*.
  The source stated: "If Kestrel, then Depot." They did not state, "It is not Kestrel." Nor did they offer evidence regarding Marlin.
  It is counter-intuitive and analytically unsound to allow a conditional claim about one branch of the hypothesis tree to inflate the probability of a disjoint branch (Marlin) solely due to the mechanics of normalizing a probability space after zeroing out a cell. The Conditional Constraint Interpretation correctly isolates the update to the internal structure of the Kestrel hypothesis ($P(\text{Depot}|\text{Kestrel})$), leaving the Kestrel/Marlin marginal (0.5/0.5) undisturbed.

  **4.3 Logic vs. Evidence**
  Faction 1 is mathematically consistent *if* the source's statement is treated as a logical axiom known to be true. However, intelligence sources provide evidence, not axioms. A "reliable" source implies a high likelihood that their statement reflects reality, not logical infallibility. Modeling the report as a shift in conditional probability ($P(D|K)$ moves from 0.5 to 0.9) accurately reflects the weight of the evidence without conflating source reliability with logical necessity.

  **5. ADDRESSING THE DISSENT (FACTION 1)**

  The Board acknowledges the theoretical strength of the Material Conditional position. In formal semantics and classical Bayesian epistemology, conditioning on the material implication ($\neg A \lor B$) is the standard method for incorporating a proposition known to be true. Proponents of this view correctly identify that treating conditionals as sui generis (distinct from truth-functional propositions) complicates the probability calculus and lacks a single, universally agreed-upon formalism.

  We are not dismissing this view as "incorrect" in the abstract. We are ruling it **inapplicable** to this specific operational context.
  *   **Where you are right:** If we were certain the source was infallible and the statement was a logical truth, your updating rule would be the rigorous consequence.
  *   **Where the operational context diverges:** We do not deal in certainties. By treating the source as "reliable" rather than "infallible," we introduce a margin of error. Once that margin exists, the material conditional approach becomes brittle. It forces a binary choice (the statement is either True or False) that discards the nuance of source reliability.
  *   **Engagement:** We invite this faction to refine the "reliability parameter." If you believe the source is 99% reliable rather than 90%, we can adjust the posterior for (Kestrel, Transit) to 0.005. But we cannot move it to 0.0.

  **6. SETTLED VS. CONTESTED MATTERS**

  To ensure clarity in future deliberations, the Board wishes to distinguish between settled operational standards and live academic disputes.

  **6.1 Settled (Operational Standards)**
  *   **No Zeroes:** It is settled policy within this organization (and most intelligence/forecasting bodies) that analysts must not assign 0 or 1 to contingent events. This overrides theoretical models that require zeroing.
  *   **Independence:** It is settled that evidence specific to one hypothesis (Kestrel) should not mechanically inflate the probability of a mutually exclusive hypothesis (Marlin) absent specific comparative evidence.

  **6.2 Contested (Formal Epistemology)**
  *   **The Nature of Conditionals:** Whether $P(\text{If } A \text{ then } B) = P(B|A)$ (Adams' Thesis) or whether it equals $P(\neg A \lor B)$ is a live and unresolved dispute in philosophy and logic. There is no academic consensus.
  *   **Optimal Updating Rule:** Among those who reject the material conditional, there is no single consensus on the replacement rule. Some advocate for Minimum Cross-Entropy (MinEnt), others for Jeffrey Conditioning, and others for specific likelihood-ratio adjustments.
  *   **Board Position:** We acknowledge this contest. For the purpose of standardization, this Board selects **Conditional Constraint with Reliability Weighting** (effectively a form of Jeffrey Conditioning on the conditional probability) as the house standard. This is not because it is the only valid mathematical approach, but because it is the most robust for client deliverables.

  **7. DIRECTIVE**

  Effective immediately, analysts must update conditional source reports by adjusting the relevant conditional probability $P(B|A)$ according to the source's reliability rating, preserving the marginal probability of the antecedent $P(A)$ unless independent evidence suggests otherwise. All cells must remain positive.

  The Kestrel/Marlin assessment is to be revised according to the posterior probabilities listed in Section 3.2.

  **Signed,**

  Chair, Analytic Standards Board
