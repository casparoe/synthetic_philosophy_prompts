  My friend and I spent most of last night arguing about the self-sampling and self-indication assumptions, and we kept talking past each other, so I want the dispute rebuilt in the vocabulary I actually think in. I'm a statistician by training: I specify generative models, sample from priors, worry about reference classes and improper priors, and debug Monte Carlo code, and I have almost no background in the metaphysics of possible worlds or indexicality.

