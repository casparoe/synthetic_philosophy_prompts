answer: |-
  Let me begin by doing as you asked: sketching the conceptual landscape for myself, filtering it, and then addressing your specific query.

  ### Internal Sketch: Candidate Concepts

  *   **The Reference Class Problem:** The statistical difficulty of deciding which group an individual belongs to when calculating probabilities (e.g., am I a "human," a "male," a "philosopher," or a "male philosopher born in 1980"?). Each class yields a different base rate.
  *   **The Self-Sampling Assumption (SSA):** The anthropic principle formulation that says, "Reason as if you are a random observer from a specific reference class." This *requires* a reference class choice.
  *   **The Self-Indication Assumption (SIA):** The rival formulation that weights hypotheses by the number of observers they contain. This shifts the burden but doesn't eliminate class ambiguity.
  *   **The Principle of Mediocrity:** The cosmological heuristic that we should assume we are not special unless evidence dictates otherwise. This is often the *motivation* for picking a broad reference class.
  *   **Equivocation:** The logical fallacy of using a term in two different senses within an argument.
  *   **Selection Effects / Observer Selection Effects:** The broader category of biases introduced by the fact that we must exist to observe the universe.
  *   **Motivated Reasoning:** The psychological tendency to process information to reach a preferred conclusion.

  *Scrutiny:* The "Reference Class Problem" is the statistical ancestor. "SSA" is the methodological engine. "Equivocation" captures the sliding but is too semantic; your complaint is probabilistic. "Motivated Reasoning" is too psychological; you are identifying a structural flaw in the inference, not just a bias. The core issue is the *unjustified stipulation* of the sampling distribution.

  ***

  ### Response

  You have put your finger on the central nerve of modern anthropic reasoning. Your intuition is not only correct; it is the primary objection raised by critics of the Doomsday Argument and many resolutions of the Fermi Paradox. You are describing a structural vulnerability in how we apply probability theory to unique, unrepeatable events involving observers.

  Here is the breakdown you requested.

  #### (a) The Nearest Established Concepts

  1.  **The Reference Class Problem:** Originating in frequentist statistics (notably von Mises and Reichenbach), this is the problem that an individual belongs to infinitely many overlapping classes, each with different statistical frequencies. To assign a probability to an event concerning that individual, one must choose *the* relevant class, but there is no formal rule for which class is "correct."
  2.  **The Self-Sampling Assumption (SSA):** Formalized by Nick Bostrom, this is the working hypothesis in anthropic reasoning that you should reason as if you are a random sample from the set of all observers in your "reference class." It makes the reference class choice explicit, but does not solve how to define the class.
  3.  **The Principle of Mediocrity:** A heuristic in cosmology (associated with Vilenkin and others) stating that we should assume our observational situation is typical among all such situations. This is often the *justification* offered for selecting a broad reference class.

  #### (b) Differentiation and Best Fit

  Your observation differs from these concepts in specific, crucial ways:

  *   **Vs. The Reference Class Problem:** The standard Reference Class Problem is usually framed as an *epistemic difficulty* (i.e., "We don't know which class to pick, so our confidence intervals are wide"). You are describing a *rhetorical maneuver* (i.e., "The author picks the class that yields their preferred conclusion without justification"). The former is a limitation of knowledge; the latter is a potential failure of reasoning.
  *   **Vs. The Self-Sampling Assumption:** SSA is a framework, not a fallacy. One can use SSA rigorously. Your complaint is about the *arbitrary application* of SSA. However, SSA is the tool that enables the move you dislike.
  *   **Vs. Equivocation:** Equivocation usually involves semantic ambiguity (e.g., using "light" to mean both "not heavy" and "photons"). Your observation is about *probabilistic framing*. The term "civilization" might remain semantically stable, but its *extension* (which civilizations count in the sample) shifts silently.

  **Which fits best?**
  The phenomenon is best understood as a specific manifestation of the **Reference Class Problem** exacerbated by **Motivated Selection**. However, there is a more precise fit in the literature on the Doomsday Argument. Critics like Elliott Sober and Ken Olum have argued that the Doomsday Argument fails because it relies on an unjustified assumption of "typicality."

  The specific move of *sliding* between classes (e.g., from "typical civilization" to "typical observer moment") is a form of **Indexical Equivocation**, though that term is not standard. The closest established description is **"Gerrymandering the Reference Class."**

  #### (c) Naming and Definition

  **Does it have a name?**
  There is no single, canonical Latin name for this fallacy (like *ad hominem*) that is universally recognized across philosophy and statistics. In informal discussions among philosophers of cosmology (e.g., on LessWrong, or in footnotes of papers by Bostrom, Ćirković, or Sandberg), this is often called **"Reference Class Tennis"** (where players hit the ball back and forth by swapping classes) or **"Anthropic Cheating."**

  However, these are slang. In formal literature, it is usually subsumed under **"The Problem of the Reference Class"** within anthropic reasoning.

  **Does it need a name?**
  Yes, because the specific *rhetorical* abuse of the reference class is distinct from the *statistical* difficulty of defining one. I propose we adopt the term:

  **Motivated Reference Class Selection (MRCS)**

  **Definition:**
  MRCS occurs in probabilistic arguments involving observer selection effects when:
  1.  The conclusion depends sensitively on the definition of the reference class from which the observer is assumed to be randomly sampled.
  2.  The author selects a specific reference class without independent empirical or theoretical justification.
  3.  The selected class is the one that maximizes the probability of the author's desired conclusion.
  4.  (Strong form) The author shifts the definition of the reference class mid-argument to evade counter-arguments, without acknowledging the shift.

  **Sorting Criterion:**
  *   **Instance of MRCS:** An argument claims "Civilizations must be rare" because "We see no aliens." This assumes the reference class is "all civilizations capable of expansion." If the author silently switches to "all civilizations *that survive*" when challenged about why we haven't expanded, that is MRCS.
  *   **Not an Instance of MRCS:** An argument that explicitly states, "If we assume the Principle of Mediocrity applies to *technological maturity*, then X follows. If we assume it applies to *temporal location*, Y follows. We have reason to prefer the former because..." This is honest sensitivity analysis, not motivated selection.

  #### (d) A Boundary Case

  **The Case:**
  Consider a medical researcher studying a new drug. They want to show the drug works. They look at the data and find that the drug works for "males over 50." They publish the result: "The drug is effective for males over 50." They do not mention that they tested "females," "males under 50," and "the general population" first, and those groups showed no effect.

  **Resemblance:**
  This looks like Motivated Reference Class Selection. The researcher selected the specific sub-class ("males over 50") that yielded the positive result, ignoring the broader class ("all patients") which yielded null results. This is often called "p-hacking" or "data dredging."

  **Why it is NOT the same phenomenon:**
  In the medical case, we have a clear *methodological norm* that dictates the correct reference class: the pre-registered population or the total sample. We can objectively say the researcher violated a standard.

  In the Fermi Paradox/Cosmology case, **there is no consensus on the correct norm.** There is no "total sample" of civilizations to compare against. We have a sample size of one (us). Therefore, we cannot objectively say which class is "correct."

  **The Difference:**
  Your complaint about the Fermi literature is not just that they are breaking a rule (like the medical researcher); it is that **the rule itself is undefined.** The "fallacy" is presenting a choice of reference class as a neutral fact rather than a substantive, unproven hypothesis.

  In the medical case, the reference class is an empirical matter (who was in the trial?). In the cosmological case, the reference class is a *metaphysical* or *methodological* stipulation. When a cosmologist says "Assume we are a typical civilization," they are not stating a fact; they are proposing a prior. When they treat that prior as a neutral background assumption to derive a factual conclusion about alien rarity, they are committing **Motivated Reference Class Selection.**

  ### Settled vs. Contested

  I must be plain about the state of the field, as you requested.

  **Settled:**
  Everyone agrees that the choice of reference class changes the probabilities. Everyone agrees that we lack data to empirically verify which class is "correct." Everyone agrees that observer selection effects matter.

  **Contested:**
  1.  **Is the move a fallacy?**
      *   *Side A (The Skeptics):* Philosophers like Elliott Sober argue that anthropic arguments (like the Doomsday Argument) are fundamentally flawed because they cannot justify the reference class without begging the question. They would agree with you that this is a fatal flaw.
      *   *Side B (The Formalists):* Philosophers like Nick Bostrom argue that we *must* make these assumptions to do science at all. They argue that the "Principle of Mediocrity" is a necessary methodological postulate, similar to assuming the laws of physics are uniform across space. They would argue that picking a class isn't "motivated" but is a necessary starting point for Bayesian updating.

  2.  **Is "Typicality" a valid prior?**
      *   Some argue that assuming we are "typical" is the only way to avoid solipsism.
      *   Others argue that in a multiverse or a vast cosmos, "typicality" is ill-defined because the measure problem (how to count infinite observers) is unsolved.

  **Correction on your view:**
  You wrote: *"No one ever says which class."*
  This is slightly too strong. In the technical literature (e.g., Bostrom's *Anthropic Bias*, Ćirković's *The Great Silence*), the classes are often defined explicitly (e.g., $J_{ref}$ = the set of all observer-moments). However, you are absolutely correct that in *popular* expositions and often in the *application* of these theories to the Fermi Paradox, the justification for why *that* specific class is the relevant one is frequently glossed over or assumed to be neutral when it is not.

  **Verdict:**
  You have identified a genuine, recognized, and unresolved problem. It is the **Reference Class Problem** applied to **Anthropic Reasoning**, often manifested as **Motivated Reference Class Selection**. It is not merely a confusion on your part; it is the central friction point in the field. When you see an argument slide from "typical civilization" to "typical observer," you are witnessing the author trying to dodge the measure problem without admitting it. You are right to be suspicious.
