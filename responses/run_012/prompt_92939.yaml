answer: |-
  Here are nine interview questions designed to press the internal tensions of her view without resorting to cheap gotchas. Each includes the main question, the answer she is most likely to give (based on her established position), and a follow-up keyed to that specific response.

  ### 1. The "Lab Coat" Charge
  **Question:** Critics often say your view is a dilemma: either it's trivially true (of course entitlements depend on rules) or it's desert-abolitionism wearing a lab coat (you've emptied the word "desert" of moral force). If I accept your definition, have I learned something about morality, or have I just learned that we should stop using the word "desert" in moral arguments?

  *   **Likely Answer:** She will likely reject the dichotomy, arguing she is clarifying the concept to prevent category errors, not abolishing the moral sentiment. She'll say we can still have moral arguments, just not using "pre-institutional desert" as the premise.
  *   **Follow-up:** "If the moral sentiment remains but the philosophical ground is removed, aren't you leaving people with a feeling they can't justify? If I feel I *morally* deserve salvation but your view says I only deserve what the church rules grant, isn't the practical upshot exactly the same as abolitionism?"

  ### 2. The Gamed Metric (Concrete Case)
  **Question:** Let's take a firm that used to measure merit by sales, but now measures it by a peer-review score. Everyone knows the score is easily gamed, so the best workers stop selling and start flattering their peers. The rules say the highest score gets the bonus. On your view, does the top-scorer *deserve* the bonus, even though everyone knows the metric is broken?

  *   **Likely Answer:** She will likely say "Yes, relative to the practice." If the institution's rules award the bonus for the score, the person with the score is entitled to it. The problem is with the rules, not the desert claim.
  *   **Follow-up:** "But if the 'desert base' is just the score, and the score no longer tracks contribution or effort, haven't you made desert completely unmoored from agency? At that point, why call it 'merit' at all? Why not just call it 'lottery winnings'?"

  ### 3. Desert vs. Worth
  **Question:** There seems to be a gap between what someone *deserves* and what they are *worth* to others. A nurse might be incredibly valuable to a sick patient (high worth) but underpaid by the hospital system (low institutional desert). Your view says desert is institution-relative. Does that mean the gap between worth and desert is just a category error, or is that gap where the real moral tragedy lies?

  *   **Likely Answer:** She will likely argue the gap is real but that "worth" is a market or utility claim, while "desert" is a normative claim. She'll say the tragedy is a mismatch between institutions and value, not a violation of pre-existing desert.
  *   **Follow-up:** "If the institution systematically undervalues what is morally valuable—like nursing—isn't the most natural way to criticize that to say the nurses *deserve* more regardless of the pay scale? If you forbid that language, aren't you disarming the very people trying to fix the mismatch?"

  ### 4. Criticizing the Rules
  **Question:** If desert claims are only valid *inside* a practice, where do you stand when you want to criticize the practice itself? If I say the rules of capitalism are rigged, am I making a desert claim? Or do I need to step outside of desert entirely to make that argument?

  *   **Likely Answer:** She will likely say you step outside of *that* practice's desert rules but appeal to broader moral norms (justice, welfare, rights) to critique the institution. You don't need pre-institutional desert to say a system is unfair.
  *   **Follow-up:** "But when people protest that a system is 'unfair,' they usually mean it fails to reward the right things. If you tell them 'desert doesn't apply here, only welfare does,' aren't you changing the subject? Isn't the demand for fairness specifically a demand for a better alignment of desert and outcome?"

  ### 5. The Resources for Injustice
  **Question:** This leads to the standard objection: if desert is only internal, you lose the resources to say a whole practice is unjust in a way that matters to the losers. If the rules of a caste system say the lower caste deserves servitude, your view grants them no desert-based ground to stand on. Do you have to admit that, in that moment, they *do* deserve servitude relative to that practice?

  *   **Likely Answer:** She will likely distinguish between "institutional entitlement" (which the caste system grants) and "moral justification" (which the caste system lacks). She'll say they don't *morally* deserve it, even if the institution says so.
  *   **Follow-up:** "But if 'moral desert' doesn't exist prior to institutions, what is the 'moral' part made of? If it's not desert, is it just raw preference? If you can't say the lower caste is being denied what they *deserve*, what is the specific moral harm they are suffering?"

  ### 6. The Effort Regress
  **Question:** Let's look at the effort regress. If I work hard because I have a driven character, and I didn't choose my character, do I deserve the reward for that effort? Many say no, because the source of the effort is luck. Does your view allow me to deserve the reward for the effort, or does the regress wipe that out too?

  *   **Likely Answer:** She will likely say the regress is a metaphysical problem that doesn't touch institutional desert. Within the practice, effort is the base. Whether I chose my character is irrelevant to whether the rules reward effort.
  *   **Follow-up:** "But if the justification for reward is that it incentivizes good behavior, and my behavior is determined by luck, doesn't the reward become merely a tool of manipulation? If I don't deserve the reward in a deep sense, are you comfortable with a system that essentially bribes people for traits they didn't choose?"

  ### 7. Meritocracy: Warning or Ideal?
  **Question:** Michael Young coined the term "meritocracy" as a satire, a warning about a society that becomes cruel because it thinks its winners are morally superior. Today, people use it as a straight-faced ideal. Does your view expose this confusion? Are we trying to build an ideal that was originally designed as a dystopia?

  *   **Likely Answer:** She will likely acknowledge the history but argue concepts evolve. She'll say we can salvage "meritocracy" as a technical term for efficient allocation, stripping away the moral superiority Young mocked.
  *   **Follow-up:** "But if you strip away the moral superiority, you strip away the motivation. People work harder because they think they *deserve* the win, not because they are efficient allocators. If you admit the moral superiority is a fiction, aren't you undermining the engine that makes the system function?"

  ### 8. The Empirical Belief
  **Question:** Empirically, most people act as if pre-institutional desert is real. They feel cheated not just when rules are broken, but when the rules themselves don't match their effort. Does your philosophical view require an error theory where we tell everyone their deepest moral intuitions are false?

  *   **Likely Answer:** She will likely say philosophy often corrects folk intuition (like free will or time). Just because people *feel* desert is pre-institutional doesn't make it so. We should educate them toward the clearer view.
  *   **Follow-up:** "In physics, correcting intuition doesn't change social stability. In morality, telling people 'your sense of being cheated is a philosophical error' sounds like gaslighting. Is there a social cost to teaching your view that you haven't accounted for?"

  ### 9. Changing Your Mind
  **Question:** Finally, what would actually change your mind? Is there a concrete case or a logical contradiction that would make you say, 'Okay, there is such a thing as pre-institutional desert'? Or is the view structured in a way that absorbs all counter-examples?

  *   **Likely Answer:** She will likely say she would change her mind if shown a coherent account of pre-institutional desert that doesn't rely on metaphysical luck or religious assumptions. She treats it as a conceptual truth, not an empirical one.
  *   **Follow-up:** "If the view relies on conceptual coherence rather than empirical evidence, and it defines away all counter-examples as 'category errors,' how do we distinguish your theory from a tautology? What risky prediction does your view make that could turn out to be wrong?"
