  The consultant clicked to the final slide. "In both scenarios, the Board's resolution was identical: proceed for profit, explicitly noting indifference to the environmental side effect. When the side effect was cleaning the river, the public ruled the corporation did not do it intentionally. When the side effect was poisoning the river, the public ruled the corporation did do it intentionally."

  The Chairman stared at the minutes. "So our corporate intent isn't a state of mind. It's a verdict."

  "Essentially, you're only capable of intentional harm," the consultant said. "You are psychologically incapable of intentional help."

  The Chairman closed the binder. "Then cancel the charity drive. If we're going to be convicted of intent, I'd rather it be for something that pays dividends."

  ***

  **Note on the punchline:** The joke relies on the Knobe Effect (the Side-Effect Effect), where moral badness biases folk psychology toward attributing intentionality, while moral goodness biases it away. By making the agent a corporation (a Board resolution), it tests whether the asymmetry holds for group minds (experimental philosophy suggests it does, often robustly). The punchline works because the CEO accepts the philosophical finding as a business constraint: since the public will assign "intent" only when there is blame to assign, the company should optimize for profitable blame rather than uncreditworthy virtue. A critic might say the joke cheats by conflating *legal* liability with *folk* intentionality, or that it assumes the CEO cares about public perception of intent rather than actual legal standards of *mens rea*, but the humor lies in the corporate colonization of philosophical categories.
