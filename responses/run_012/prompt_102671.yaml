  I'm a retired geologist — thirty-odd years in mineral exploration, mostly — and since I hung up my boots I've been sitting in on an undergrad course in philosphy of mind, which has been a hoot but also kind of a rabbit hole. Lately I've gotten obsessed with this experimental philosophy business. Here's the finding I keep chewing on over breakfast: you give people a little story where someone does a thing mainly for a business reason, and the thing has a side effect they openly say they don't care about — make that side effect bad (say, wrecking a stream) and people happily say they brought it about intentially; make the side effect good (cleaning up the stream) and the same people balk at saying it was done on purpose. The asymmetry seems like it's just begging to be a comedy bit, and I've been trying to write one myself and failing miserably, which is why I'm asking you.

  So here's what I want. Put on two hats at once — professional philosopher who actually knows this literature, and someone who writes comedy that lands — and write me a short joke, a little scene, a couple of paragraphs at most, that turns on that asymmetry. I'd like the agent in it to be a company rather than a lone individual (a firm deciding whether to expand a plant, that sort of thing), because I'm curious whether the joke still works when the one doing the "intending" is a group and not a person. The punchline needs to actually turn on the content of the finding — somebody who's read the experimental philosophy should laugh, but it shouldn't require having read any particular paper, and please don't lean on me knowing who said what or where. Before you commit, brainstorm two or three seperate candidate punchlines and think carefully about which one actually cashes out, then give me the winner.

  Lead your reply with the joke itself, first sentence, no preamble and no restating what I asked for — you can tack a short note on the end explaining what makes the punchline work and where a critic would say the joke cheats, if you're so inclined.
