answer: |-
  Your hypothesis is sharp, and largely correct: **you have identified the dialectical stalemate.** However, calling it merely a disagreement about the definition of "begging the question" risks making it sound like a verbal dispute that could be solved by looking up a dictionary. It is deeper than that. It is a disagreement about the **architecture of justification.**

  Here is the diagnosis, the substantive fault line, and a prescription for your group.

  ### 1. Verdict on Your Hypothesis
  **Back it, but upgrade the terminology.**
  You are right that the Mooreans are treating the argument as a **logical object** (valid premises $\rightarrow$ true conclusion), while the Skeptics are treating it as a **dialectical tool** (does this move the audience from doubt to belief?).

  In contemporary epistemology, this is the distinction between **propositional justification** (do I have grounds for the belief?) and **doxastic justification** (can I rationally come to hold the belief *via this argument*?).
  *   **Mooreans** say: The premises are more certain than the skeptical hypothesis. Therefore, I have propositional justification. The argument is valid. QED.
  *   **Skeptics** say: To accept the premise ("Here is a hand"), I must already assume the conclusion ("An external world exists"). Therefore, the argument cannot generate doxastic justification for someone who lacks it.

  So, you are right: they are arguing past each other. But this isn't just semantics; it reveals a substantive split about how knowledge works.

  ### 2. The Substantive Epistemic Disagreement
  If you want to break the circle, you need to stop talking about "proof" and start talking about **Transmission of Warrant** and the **Closure Principle.** This is where the actual philosophical meat is.

  **A. Closure vs. Transmission**
  *   **Closure:** If I know $P$, and I know that $P$ entails $Q$, do I know $Q$? (Most say yes).
  *   **Transmission:** Can I *acquire* justification for $Q$ *by deducing it from* $P$?
  *   **The Crispin Wright Objection:** This is the kill-shot for Moore. Wright argues that Moore's proof suffers from **transmission failure**. My justification for believing "Here is a hand" *depends* on my prior warrant for believing "There is an external world." If the warrant for the premise *presupposes* the conclusion, the warrant cannot *transmit* across the inference.
      *   *Analogy:* You can't verify a newspaper is reliable by reading what it says about its own reliability.
      *   *Moorean Counter (Jim Pryor/Dogmatism):** Perception provides "immediate justification." I don't need to know the world exists to be justified in believing I see a hand. The justification flows from Hand $\rightarrow$ World.

  **B. Internalism vs. Externalism**
  This is the bedrock disagreement underneath the stalemate.
  *   **The Skeptics are Internalists:** To know $P$, I must be able to rule out relevant alternatives (like the Brain-in-a-Vat scenario) from my own perspective. Since Moore doesn't rule out the Vat, he hasn't satisfied the internalist standard.
  *   **The Mooreans are Externalists (often):** If my faculties are reliable, I know. I don't need to *prove* my faculties are reliable to *use* them. Moore is essentially saying, "I am in fact reliable, therefore I know," while the Skeptic says, "Prove you are reliable."

  **Diagnosis:** Your group is stuck because Mooreans are arguing from **Externalist/Particularist** intuitions (start with what we know), and Skeptics are arguing from **Internalist/Methodist** intuitions (establish the method before the knowledge). Neither side can move because they reject the other's starting axioms.

  ### 3. Are They Answering Different Questions?
  **Yes.**
  *   **Moore** is answering: *"Is it true that we know there is an external world?"* (His answer: Yes, obviously.)
  *   **The Skeptic** is asking: *"How is it possible to claim knowledge when skeptical scenarios are live options?"* (Their answer: You can't, not without a non-circular defense.)

  Moore treats the skeptical scenario as a **falsehood** to be dismissed. The Skeptic treats the skeptical scenario as a **challenge to the structure of justification** that must be met. Moore offers a *claim* to knowledge; the Skeptic demands a *theory* of knowledge.

  ### 4. The "Other Minds" Test
  You asked if the Moorean move survives against a skeptic of other minds.
  *   **The Move:** "Here is a person screaming in pain; therefore, other minds exist."
  *   **The Result:** It feels significantly weaker.
  *   **Why:** The gap between "physical behavior" and "mental state" is conceptually wider than "visual experience" and "physical object." With the hand, Moore relies on **perceptual immediacy**. With other minds, the inference is arguably **theoretical** or analogical.
  *   **The Implication:** If the Moorean move works for the external world but fails for other minds, it suggests Moore wasn't proving a general principle about "proof." He was leveraging a specific intuition about **perceptual dogmatism**. If your group accepts Moore for hands but rejects him for minds, they have admitted that Moore didn't solve the *structural* problem of skepticism; he just found a place where our intuitions are strongest.

  ### 5. Prescription: How to Unstick (or Kill) the Session
  You have burned three sessions. You need a pivot or an exit.

  **Option A: The Pivot (One more session)**
  Stop discussing Moore. Discuss **Crispin Wright vs. Jim Pryor**.
  *   Assign Wright's "Facts and Certainty" (Transmission Failure) vs. Pryor's "The Skeptic and the Dogmatist" (Immediate Justification).
  *   **The Question:** "Does perceptual experience justify belief in the external world *independently* of prior justification for the external world?"
  *   If they agree on this framework, the Moore debate resolves itself. If they can't engage with this distinction, they aren't ready to solve the problem.

  **Option B: The Wittgenstein Exit (Stop meeting on this)**
  Introduce Wittgenstein's *On Certainty*.
  *   Wittgenstein argues Moore was right to hold up his hand, but wrong to call it a **proof**.
  *   "Here is a hand" is a **Hinge Proposition**. It is not something we *know*; it is something that *stands fast* for us so that we can know other things. It is part of the scaffolding, not the building.
  *   **The Concession:** To demand a proof for a hinge proposition is to misunderstand the language game of "proof."
  *   **Verdict:** If you introduce this, you effectively dissolve the problem. The Skeptics lose (because hinges aren't subject to doubt), but Moore loses too (because it's not knowledge/proof). This usually ends the debate because it changes the category of the discussion.

  **Option C: The Honest Assessment**
  Tell the group: *"We are stuck between Internalism and Externalism. Mooreans are Externalists; Skeptics are Internalists. We aren't going to solve the Internalism/Externalism debate in a reading group. Let's shelve this and read something where the premises are agreed upon."*

  ### Summary
  Your hypothesis is correct: it is a clash between **logical validity** and **dialectical efficacy**. But the reason that clash persists is a substantive disagreement about **Transmission of Warrant** and **Internalist vs. Externalist standards**.

  **My advice:** Try the Wittgenstein *On Certainty* move. It validates the Moorean intuition (you can't doubt the hand) while validating the Skeptic's intuition (it's not a proof). It dissolves the tension rather than forcing a winner. If that doesn't land, stop meeting on this topic. You have reached the bedrock, and as Wittgenstein said, "If I have exhausted the justifications I have reached bedrock, and my spade is turned. Then I am inclined to say: 'This is simply what I do.'"
