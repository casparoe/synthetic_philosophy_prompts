prompt: |-
  OK so this is a thing I've been trying to get straight for a while, and I want a proper conceptual breakdown rather than the usual "logical positivist says religion is meaningless" gloss. You're a philosopher of mind who actually knows the verificationist tradition and the mid-century personal-identity literature, not just the pop version. Before you write anything, brainstorm a bit for yourself: what are the distinct questions hiding inside the question of whether we survive death, and which of them are empirical, which are conceptual, and which are just confused? Then give me the explanation.

  Here's what I'm circling. Ayer is famous for the verification principle and for being a humanist who thought death was the end. But he also had a near-death experience late in life — heart stopped, he reported a red light and some kind of authoritative presence, or so the story goes — and afterwards he said it had slightly weakened his conviction that death is annihilation. At the same time he didn't seem to treat it as evidence for survival in any straightforward sense. And in his more careful writing on personal identity, he seems to have thought the question of whether we survive death isn't a straightforwardly factual one at all: that it turns on what you're willing to count as survival, and that alot of the dispute is really about the criteria of personal identity rather than about any empirical fact.

  So what I want is the conceptual issue here, laid out properly. Specifically:

  - Why might someone in Ayer's tradition think that "I survive death" is not a straightforward empirical hypothesis? What work is the verification principle doing, and where does it run into trouble?
  - How does the indexical problem bear on this — why would any continued mental life count as *me* rather than as a new person who happens to remember my life? What has to be true for the pronoun to latch onto the right thing?
  - What exactly is the difference between the empirical question (is there experience after clinical death?) and the conceptual question (would that experience count as survival)? Are these separable, or does the second collapse into the first?
  - Then: how does Ayer's own near-death experience fit? Does it count as evidence for anything, and if not, why not? Is his refusal to treat it as evidence a principled position or a bit of a dodge?

  Don't give me a history-of-ideas survey. I want the conceptual joints: where the distinctions fall, which moves are available to whom, and what the strongest version of Ayer's position would be. If you think the position is ultimately unstable, say where the instability is and whether it's a fatal problem or just a place where the view needs patching. Think carefully about the order of the argument before you answer.
