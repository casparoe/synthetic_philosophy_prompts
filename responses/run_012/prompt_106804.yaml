answer: |-
  Consider two trials of the careenium, identical in total energy and boundary walls, wherein a specific simmball cluster designated as the symbol 'LEFT' is injected into a sorting channel designed to route clusters based on their structural stability rather than constituent identity. In Run Alpha, the 'LEFT' simmball comprises simms 1 through 50 arranged in a tight hexagonal lattice with low internal vibration, colliding with wall-buffers at precise angles determined by their individual momenta; in Run Beta, the 'LEFT' simmball comprises simms 200 through 250 arranged in a looser cubic lattice with higher internal vibration, following a distinct trajectory of micro-collisions that nonetheless preserves the cluster's integrity against the channel's shear forces. Despite the divergent micro-histories—different simms, different collision sequences, different internal force distributions—both clusters survive the sorting channel intact and settle into the left-hand collection bin, triggering the macroscopic flag 'the careenium says left', while a structurally unstable 'RIGHT' cluster in both runs would have shattered and fallen into the waste chute.

  The epiphenomenalist about the symbolic level must insist that the symbol 'LEFT' is merely a convenient summary of the underlying physics, possessing no causal power of its own. For this view, the cause of the outcome in Run Alpha is the precise position and momentum of simms 1–50, while the cause in Run Beta is the distinct configuration of simms 200–250; the fact that both yield the same result is a coincidence of the laws of motion, not evidence of a common symbolic cause. They argue that every difference displayed is fixed by simm-level facts, and since the simmball exerts no force except through simm-to-simm collisions, nothing at the symbolic level is a cause. Conversely, the real-patterns realist argues that the symbol is the invariant carrying the counterfactual and explanatory weight. They contend that the two runs agree precisely because the symbol is held fixed while the microphysical detail varies; the simm-level description is a disjunction too gerrymandered to explain anything, whereas the symbolic description captures the robust property (structural stability) that guarantees the outcome across different physical realisations. For the realist, the simmball pushes the simms in the sense that the pattern constrains the allowable micro-trajectories.

  The single feature separating these verdicts is the **counterfactual stability of the macro-outcome under micro-variation**. This feature does the work because it isolates the macro-property as the only common denominator between the two runs. If you removed or inverted this feature—such that the two different micro-realizations of 'LEFT' led to different final outcomes—the symbolic description would fail to predict the behaviour, and the epiphenomenalist would be vindicated in claiming that only the specific micro-configuration matters. Similarly, if the same micro-realisation yielded different symbols, the mapping would break, destroying the autonomy of the symbolic level.

  The side that comes out worse in this specific framing is the epiphenomenalist, as the case is designed to highlight explanatory loss at the micro-level. To attack the case, the epiphenomenalist would concede that the symbolic description is excellent for prediction and compression but would dig in on the ontology of causation. They would argue that 'structural stability' is nothing over and above a complex microphysical property, and that granting it causal status violates the causal closure of the physical. They would maintain that the disagreement is merely a matter of which sense of 'cause' we prize: the realist prizes difference-making and generalisation, while the epiphenomenalist prizes productive mechanism. Thus, they would conclude the dispute is substantive only if one insists on non-reductive causation, but verbal if causation is understood strictly as energy transfer between particulars.
