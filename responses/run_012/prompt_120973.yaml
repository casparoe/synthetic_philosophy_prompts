answer: |-
  # Activity: The Damascus Protocol

  **Goal:** Simulate the deliberational instability of *Death in Damascus* without explicitly naming the puzzle until the debrief. Students should feel that every reason to choose a city becomes a reason to leave it.
  **Time:** 75 Minutes (45-minute option included).
  **Class Size:** ~20 Students.
  **Materials:** Index cards (3 per student), envelopes (1 per student), pens, a timer.

  ## 1. Roles & Setup
  *   **You (Instructor):** The Game Master and the "Oracle." You hold the envelopes.
  *   **Students:** Travelers deciding between **Aleppo** (Stay) and **Damascus** (Go).
  *   **The Oracle (Mechanism):** A stack of 20 envelopes.
      *   *Truthful Mechanism:* You will fill these **during Round 1**. As you collect their first tentative choice, you write that choice on the slip inside the envelope. This makes their *initial inclination* the "Prediction."
      *   *Why this works:* It truthfully creates a correlation between their psychology and the "prediction" without requiring psychic powers. It sets up the tension: "If I stick, I match the prediction. If I switch, did the Predictor anticipate the switch?"

  ## 2. Scoring Scheme (No Money)
  Students track points on a scrap of paper.
  *   **Survival:** +100 points.
  *   **Death:** 0 points.
  *   **Travel Cost (Choosing Damascus/Go):** -10 points. (Staying/Aleppo is free).
  *   **Side Bet:** At the start, they write a confidence % (0–100) that they will survive.
      *   If they survive: Add that % to their score.
      *   If they die: Subtract that % from their score.
      *   *(This punishes overconfidence and highlights the instability of their credence.)*
  *   **Auction:** Winner pays their bid in points.

  ## 3. Timeline & Script

  ### Phase 1: The Premise & The Bet (0:00 – 0:15)
  **Action:** Hand out 3 index cards and 1 envelope to each student. Ask them to write their Name on the envelope.
  **Script:**
  > "Tomorrow, Death comes for one of you. He searches exactly one city: Aleppo or Damascus. He will search the city a Predictor named *before* you decided where to be. The Predictor has never been wrong. Nobody gets to learn what the Predictor said until the end.
  >
  > You are in Aleppo now. Staying costs nothing. Going to Damascus costs a night's sleep (10 points). If Death searches your city, you die (0 points). If he searches the other, you live (100 points).
  >
  > Before we begin, take Card 1. Write your name and a percentage: How confident are you that you will survive this game? Be precise. This is your Side Bet. If you live, you add this number to your score. If you die, you subtract it."

  *(Collect Card 1. Do not look at them yet.)*

  ### Phase 2: The Inclination (0:15 – 0:30)
  **Action:** Hand out Card 2.
  **Script:**
  > "Take Card 2. This is your **Tentative Choice**. Write 'Aleppo' or 'Damascus'. Do not put your name on it. Fold it.
  >
  > I am going to collect these. As I collect them, I am transferring the Predictor's verdict into your envelopes. The Prediction is now fixed. It is inside your envelope. Do not open them."

  *(Walk around the room. Collect Card 2. **Crucial Step:** As you take each card, glance at it, and immediately write that city on a slip of paper and put it inside their envelope. This makes the 'Prediction' identical to their 'Tentative Choice'. Seal the envelope.)*

  **Script (Once seated):**
  > "The Prediction is sealed. It is infallible. It matches where the Predictor thought you would be.
  >
  > Here is the problem: You know the Predictor is infallible. If you stay in Aleppo, you have evidence the Predictor said Aleppo. If you go to Damascus, you have evidence the Predictor said Damascus.
  >
  > You have 5 minutes to deliberate. You may change your mind. But remember: the Prediction is already fixed."

  *(**Silence Point:** Do not speak for 5 minutes. Let the room get uncomfortable. Walk slowly among them.)*

  ### Phase 3: The Auction (0:30 – 0:45)
  *(Note: If running the 45-minute version, skip to Phase 4.)*

  **Action:** Select one volunteer (or pick a student at random). Hold up their sealed envelope.
  **Script:**
  > "We have a market intervention. I am auctioning the contents of [Student Name]'s envelope.
  >
  > Rule: A prediction anyone learns is thereby **void**. If the contents are revealed, the causal link is broken. Death no longer goes where the prediction said; he goes to the *other* city.
  >
  > This means if you buy this info, [Student Name] is guaranteed to survive, provided they act on it. Bidding starts at 20 points. Who wants to save them?"

  *(Run a quick open auction. Highest bidder pays points. Reveal the card inside to the class. It will match the volunteer's Tentative Choice.)*

  **Script:**
  > "The prediction was [City]. Since it is now known, it is void. [Student Name], you are safe. You may choose freely."

  *(This highlights the value of information when the causal loop is severed, contrasting with the main group who remain trapped.)*

  ### Phase 4: The Final Verdict (0:45 – 0:60)
  **Action:** Hand out Card 3.
  **Script:**
  > "Take Card 3. This is your **Final Choice**. Write 'Aleppo' or 'Damascus'. Put it inside your envelope.
  >
  > Remember: If your Final Choice matches the Prediction inside, Death finds you. If it does not match, you survive.
  >
  > You have 10 minutes. Do not speak."

  *(**Silence Point:** This is the core experience. Watch them sweat. Some will switch, some will stick. The logic is: 'If I stick, I match my Tentative Choice (which is the Prediction), so I die. If I switch, I survive... unless the Predictor anticipated the switch.' Since you actually used the Tentative Choice as the Prediction, switching guarantees survival in the *game mechanics*, but the *premise* of infallibility makes them doubt the switch.)*

  ### Phase 5: Resolution & Debrief (0:60 – 0:75)
  **Action:** Collect envelopes. Reveal the mechanism.
  **Script:**
  > "Open your envelopes. Compare the slip inside to your Final Choice.
  > [Pause for reactions]
  >
  > Here is the truth: I am not a god. When I collected your Tentative Choice in Round 2, I wrote that down as the Prediction. The 'Prediction' was simply your first instinct.
  >
  > If you switched, you survived. If you stayed, you died.
  >
  > But did you feel safe switching? Or did you worry that an *actually* infallible Predictor would have anticipated the switch? That feeling—that every reason to move is a reason to stay—is Death in Damascus."

  ## 4. The Debrief: Mapping the Experience

  **1. The Evidential Line (The Side Bet):**
  *   **Moment:** When they wrote their survival confidence % in Phase 1.
  *   **Concept:** Evidential Decision Theory (EDT) asks, "What does my choice *say* about the world?"
  *   **Discussion:** "When you wrote 90% confidence, you were treating your choice as *evidence* of survival. But in this game, your choice *causes* the outcome (via the prediction). The Side Bet forced you to put a price on your own evidence."

  **2. The Causal Line (The Auction):**
  *   **Moment:** The Auction in Phase 3.
  *   **Concept:** Causal Decision Theory (CDT) asks, "What does my choice *do* to the world?"
  *   **Discussion:** "When we voided the prediction for the auction winner, we broke the correlation. Suddenly, their choice could causally determine survival without the loop. The high bid showed how much you value breaking the causal link."

  **3. The Loop (The Silence):**
  *   **Moment:** The 10-minute deliberation in Phase 4.
  *   **Concept:** Deliberational Instability / Ratifiability.
  *   **Discussion:** "This is the core. If you decided to Stay, you realized: 'If I stay, I match my Tentative Choice, so I die.' So you decided to Go. But then you thought: 'But if I Go, the Predictor would have known I'd switch.'
  *   "In Newcomb's Problem, you can stop deliberating (One Box or Two Boxes). In Death in Damascus, the verdict *licenses* the counter-verdict. There is no resting point. That anxiety you felt in the silence? That is the philosophical problem."

  ## 5. Troubleshooting & Truthful Explanation

  **What will predictably go wrong:**
  *   **Giggling/Cheating:** Students might treat it as a game to "beat the teacher."
      *   *Fix:* Maintain a somber tone. "This is a simulation of a mortality scenario. Treat the points as utility."
  *   **Confusion on Scoring:** They might forget the Travel Cost.
      *   *Fix:* Write the scoring rules on the board and leave them there.
  *   **The "Switch" Dominance:** Smart students will realize Switching dominates Staying (since Prediction = Tentative).
      *   *Fix:* Acknowledge this in the debrief. "In my simulation, switching won. But in the *philosophical* problem, the Predictor anticipates the switch. The game was designed to make you feel the *pressure* of the prediction, not to perfectly model metaphysical infallibility."

  **What you must say (because the game can't reproduce it):**
  *   "In the real thought experiment, you cannot escape by switching. The Predictor is part of the causal structure. In this room, I was just a guy with a pen. The anxiety you felt was real, even if the mechanism was mechanical."

  **Truthful Explanation of the Oracle:**
  *   "I cannot predict the future. To make the game truthful, I made your *Tentative Choice* the Prediction. This truthfully models the idea that your psychological state *before* final deliberation is what determines the 'fate' you are trying to escape. It wasn't magic; it was a mirror."

  ## 6. The 45-Minute Cut
  If cut to 45 minutes, **drop Phase 3 (The Auction).**
  *   **Reason:** The Auction is an add-on to illustrate the value of information/causality breaking. The core experience of the *Loop* happens in the transition from Tentative (Phase 2) to Final (Phase 4).
  *   **Adjustment:** Reduce Phase 4 deliberation from 10 minutes to 5 minutes. Reduce Debrief to 10 minutes.
  *   **Script Change:** After collecting Tentative Choices, say: "The Prediction is fixed. You have 5 minutes to make your Final Choice. Go."

  ## 7. Instructor's Cheat Sheet (Keep this hidden)
  *   **0:00** Distribute cards/envelopes.
  *   **0:10** Collect Side Bets (Card 1).
  *   **0:15** Collect Tentative Choices (Card 2). **WRITE CARD 2 CONTENTS INTO ENVELOPE.**
  *   **0:30** (Optional) Auction one envelope. Reveal content.
  *   **0:45** Collect Final Choices (Card 3 inside Envelope).
  *   **0:60** Reveal Truth. Debrief.
  *   **Key Phrase:** "The Prediction was your first instinct. The Dilemma was your second thought."
