  4. Decision theory dictates that you should compare the marginal costs of continuing against the marginal benefits of finishing, ignoring the irrecoverable five years already spent. Treating sunk costs as an asset violates this principle by allowing past losses to dictate future resource allocation.
  5. You should not treat sunk costs as a rational asset because the handicap principle validates costly signals only when they secure a net positive return, not when they compound losses. Correcting the bias means leaving if the future expected value of the PhD is lower than your next best alternative.
