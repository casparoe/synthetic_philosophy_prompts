      *   *Why:* Most phenomenological models demand a unified locus of experience, and while the colony acts as one, its physical fragmentation makes true unity unlikely.
  2.  **Integration Condition:** **0.30**
      *   *Question:* Is the colony one integrated system or just a heap?
