      *   *Critique Point 2 (Normative vs. Descriptive):* Psychophysics is descriptive (how we perceive). Ethics is normative (how things *are*). Just because we can't *tell* the difference doesn't mean there *is* no difference in value. The spectrum argument usually assumes there *is* a difference, just a small one. If the user argues there is *no* normative difference until the threshold is crossed, they are advocating for a threshold theory of value. This is controversial.
