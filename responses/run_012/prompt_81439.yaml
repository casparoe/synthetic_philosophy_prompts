answer: |-
  # The Convention Quiz: Rules, Costs, and Visitors

  **Instructions:** Read each scenario carefully. Choose the option that best matches your immediate reaction. Do not overthink it; there are no right or wrong answers, only different philosophical commitments. At the end, use the Scoring Key to find which position best matches your pattern of answers.

  ### Part 1: Who Bears the Cost?
  *These questions test whether you think the moral weight of a convention depends on the visible harm it causes.*

  **1. The Queue Jumper**
  You are standing in a line for tickets. Someone pushes in front of you. You will have to wait one extra minute.
  *   **A.** It is wrong because I lose my spot immediately, and I have the right to object right now.
  *   **B.** It is wrong because if everyone did it, the line would collapse into a scramble.
  *   **C.** It is only wrong if the venue is crowded; if there's plenty of space, it doesn't matter.

  **2. The Wage Tip**
  You are in a country where waiters are paid below minimum wage legally, on the condition that customers make up the difference with tips. You receive good service but decide not to tip.
  *   **A.** It is wrong because the waiter loses income directly due to my choice.
  *   **B.** It is wrong because I participated in the meal, so I accepted the payment rules.
  *   **C.** It is not wrong; the employer is responsible for wages, not me.

  **3. The Empty Road**
  It is 3:00 AM. You are at a pedestrian crossing. The light is red, but the road is completely empty in both directions for a mile. You cross.
  *   **A.** It is wrong because the law says not to, regardless of traffic.
  *   **B.** It is permissible because no one is endangered or inconvenienced.
  *   **C.** It is permissible, but drivers might still be right to honk at you for breaking the pattern.

  ### Part 2: Opt-In or Opt-Out?
  *These questions test whether obligation comes from joining a practice or simply being present.*

  **4. Joining the Line**
  Why does standing in the queue bind you to wait your turn?
  *   **A.** Because by standing there, you silently promised the others to follow the order.
  *   **B.** Because the queue is a system that only works if everyone inside it follows the rule.
  *   **C.** Because it is a public rule, and you must follow public rules wherever you are.

  **5. The Foreign Square**
  You are walking through a public square in a foreign city. There is no line, but locals strictly avoid walking across a specific patch of grass. You walk across it.
  *   **A.** You did nothing wrong; you didn't agree to their custom.
  *   **B.** You did wrong; when in a community, you must respect their shared spaces.
  *   **C.** You did nothing wrong, but the locals are allowed to be annoyed that you did it.

  **6. The Private Club**
  You enter a private dining club. The rules state "No Jackets." You wear a jacket.
  *   **A.** You can stay; it's just clothing, and no one is harmed.
  *   **B.** You must leave or cover up; entering the space means accepting their terms.
  *   **C.** You should have checked the rules before arriving; now you must adapt.

  ### Part 3: The Visitor's Status
  *These questions test the relationship between ignorance, authority, and injustice.*

  **7. The Tourist's Mistake**
  A tourist eats with their left hand in a culture where this is taboo. They did not know.
  *   **A.** The act is wrong, but the tourist is not to blame for it.
  *   **B.** The act is not wrong; morality doesn't change at the border.
  *   **C.** The act is wrong, and the tourist is to blame for not checking beforehand.

  **8. The Local's Resentment**
  A local sees the tourist break a harmless convention (like the grass in Q5). The local feels resentful.
  *   **A.** The local has no right to resent it; it's not their property.
  *   **B.** The local has a right to resent it; it is their community's norm.
  *   **C.** The tourist acted permissibly, but the local is still allowed to feel resentful.

  **9. The Unjust Custom**
  You discover a local convention relies on an underclass of workers who are treated poorly (e.g., a caste-based service system).
  *   **A.** You should follow the convention to avoid causing trouble while visiting.
  *   **B.** You should refuse to participate, even if it causes awkwardness, to avoid supporting the injustice.
  *   **C.** You should follow it while there, but donate to charities that fix the problem later.

  ---

  ### Scoring Key

  Count how many times you selected options corresponding to the columns below. Your dominant column indicates your philosophical position. Note: Some questions contribute to multiple columns; mark a tick for every column listed in the option.

  | Q | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1** | **Harm-based** | **Coordination** | **Harm-based** |
  | **2** | **Harm-based** | **Assurance** | **Harm-based** |
  | **3** | **Localist** | **Harm-based** | **Standing-Asymmetry** |
  | **4** | **Assurance** | **Coordination** | **Localist** |
  | **5** | **Harm-based** | **Localist** | **Standing-Asymmetry** |
  | **6** | **Harm-based** | **Localist** | **Duty-of-Inquiry** |
  | **7** | **Standing-Asymmetry** | **Harm-based** | **Duty-of-Inquiry** |
  | **8** | **Harm-based** | **Localist** | **Standing-Asymmetry** |
  | **9** | **Localist** | **Complicity** | **Duty-of-Inquiry** |

  **Position Profiles:**

  *   **Harm-based Sceptic:** You believe conventions only matter if they cause tangible damage. If no one loses money, time, or safety, the rule is optional.
  *   **Coordination View:** You believe conventions bind those inside the practice because they are shared solutions to order. The system matters more than the individual promise.
  *   **Assurance View:** You believe conventions bind because participation creates reliance. By joining in, you led others to expect you would behave.
  *   **Localist View:** You believe presence in a community creates obligation. Visitors must conform to local norms as a condition of entry, regardless of harm.
  *   **Duty-of-Inquiry View:** You believe visitors are not bound by unknown rules, but they have a strict duty to learn them. Ignorance is an excuse for blame, not for the act.
  *   **Complicity View:** You believe some conventions generate a duty to *refuse* compliance. If a convention sustains injustice, conformity makes you an accomplice.
  *   **Standing-Asymmetry View:** You believe the permissibility of the act and the permissibility of resentment are separate. One can do no wrong, yet others may still rightly feel aggrieved.

  ---

  ### Commentary for the Club

  **1. On Separating Positions**
  You may find the **Coordination View** and **Assurance View** difficult to distinguish in practice. Both argue that participation creates obligation. The quiz separates them by asking *why* the obligation exists: is it to keep the system functioning (Coordination), or because you created an expectation in a specific person (Assurance)? For the purposes of this quiz, if you scored highly in both, you hold a general "Practice-Based" view. We note this plainly: without meta-ethical interrogation, these two often converge for agents inside the practice.

  **2. On Empty Combinations**
  There are logical gaps in the map of positions. Specifically, no coherent position holds both **Localist View** (visitors must conform) and **Harm-based Sceptic** (locals have no standing to resent harmless deviations).
  *   **Why this gap exists:** It is **incoherent**. If a visitor is *obligated* to conform (Localist), then violating the norm is a wrong. If it is a wrong, the locals generally have standing to resent it. To say "You must do it, but we can't mind if you don't" dissolves the obligation.
  *   **Another gap:** **Complicity View** and **Localist View** rarely overlap. One demands conformity to community norms; the demands refusal of unjust norms. A person holding both would be forced into contradiction whenever a local norm is unjust. This gap exists because the views are **mutually exclusive** in application.

  **3. Note for the Economics Teachers**
  You asked whether distributive effects change the moral landscape. **Question 2** addresses this directly. The **Harm-based Sceptic** must decide if the employer's wage shifting counts as a "harm" caused by the tipper. If they answer Option C, they argue the causal chain is broken. If they answer Option A, they acknowledge that conventions which distribute wealth (or poverty) generate obligations even without direct interpersonal harm. The **Complicity View** goes further, arguing that distributive injustice creates a duty to break the convention.

  \answer{7; coordination view/assurance view/harm-based sceptic/localist view/duty-of-inquiry view/complicity view/standing-asymmetry view}
