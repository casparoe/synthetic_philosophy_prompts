answer: |-
  **Title:** Temporal Unity and the Absent-Minded Driver: Decoupling Information from Agency

  **Research Question**
  Standard treatments of the Absent-Minded Driver (AMD) problem treat the payoff structure as the primary variable and the agent's temporal constitution as a fixed background constraint. This proposal inverts that relationship. The central question is: *Does the normative force of a unified policy in the AMD problem depend on agential unity independent of informational unity?* I argue that the apparent paradoxes in AMD arise not from conflicting decision rules, but from conflating two distinct conditions: **Informational Unity** (time-slices sharing evidence and memory) and **Agential Unity** (time-slices being answerable to a single standard of justification). The paper will demonstrate that once these are decoupled, the "correct" decision rule is determined by which form of unity is prioritized, dissolving the standard debate.

  **Motivation and Existing Literature**
  The standard literature focuses on identifying the decision theory (Causal, Evidential, or Functional) that yields the payoff-dominant outcome. Disagreements persist because proponents implicitly assume different metaphysics of the agent. Some treat the driver as a single planner whose instructions must be followed despite memory loss (high Agential Unity, low Informational Unity). Others treat each intersection as a distinct decision node with local knowledge (low Agential Unity, low Informational Unity).

  Current resolutions leave the core issue open because they attempt to solve for the *policy* without first solving for the *agent*. They assume that because the payoffs are assigned to the "driver" as a whole, the rationality must be calculated globally, even when the epistemic access is strictly local. This creates a tension between the planning self and the acting self that is usually resolved by stipulation rather than derivation. By treating the payoff table as the source of the puzzle, existing accounts miss that the table itself presupposes a specific alignment of interests across time that may not be supported by the informational structure.

  **Project Plan (10 Weeks)**
  *   **Weeks 1–3: Reconstruction.** Map the standard solutions to the AMD problem. I will formalize the implicit assumptions each solution makes about the relationship between the time-slices at the two forks.
  *   **Weeks 4–6: Theoretical Framework.** Develop the distinction between Informational Unity (IU) and Agential Unity (AU). I will draw on literature regarding temporal agency and team decision theory to define conditions where IU and AU come apart.
  *   **Weeks 7–8: Application.** Apply the IU/AU framework to the AMD setup. I will show that if AU is maintained despite IU failure, the "planning" solution holds; if AU is reduced to match IU, the "action" solution holds. I will demonstrate that the paradox vanishes when the assumption is made explicit.
  *   **Weeks 9–10: Drafting and Refinement.** Write the paper, focusing on clarity of the distinction. Ensure the argument does not drift into general metaphysics but remains grounded in decision-theoretic norms.

  **Conditions for Failure**
  This project will fail if:
  1.  **Redundancy:** The IU/AU distinction turns out to be merely terminological, mapping 1:1 onto existing distinctions (e.g., planning vs. action selves) without generating new predictive power or clarity.
  2.  **Mathematical Inconsistency:** The argument requires altering the payoff structure in a way that no longer constitutes the Absent-Minded Driver problem.
  3.  **Indeterminacy:** I cannot show that separating IU and AU leads to a determinate recommendation for a decision rule, leaving the paper as a critique without a constructive alternative.

  **Expected Contribution**
  By shifting the focus from payoff maximization to the constitution of the agent, this paper aims to show that the AMD problem is not a failure of decision theory, but a category error regarding temporal identity. The result will be a clearer framework for analyzing dynamic choice problems where memory and identity are imperfectly aligned.
