      *   *Refinement on (c) vs (d):* The tension is: If harm doesn't matter (c), why does defective consent matter (d)? The answer is that (d) prevents the *obligation* from arising, whereas (c) discusses the *force* of an existing obligation. I need to make sure the user sees this distinction clearly.
      *   *Refinement on (a) vs (e):* This is the Fried (Promise as Moral Practice) vs. Rawls (Practice Conception) debate. Fried tries to reconcile them. The user has both. The tension is: Does the practice *create* the obligation, or does the will *use* the practice to create it?
