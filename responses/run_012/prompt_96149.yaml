answer: |-
  This is a sophisticated package. You have effectively reconstructed a **Will Theory** of promising (the obligation comes from the exercise of the will) combined with a **Directed Duty** view (the obligation is owed *to* a specific person). This is a recognizable and defensible position in jurisprudence (akin to Charles Fried's *Contract as Promise*, though you add a conventionalist caveat).

  Here is the audit you asked for, separating the settled ground from the live disputes, and ranking the internal tensions by severity.

  ### Part 1: Consensus vs. Live Dispute

  Before looking at consistency, you need to know where you are standing on solid ground versus where you are planting a flag in contested territory.

  *   **The "Settled" Bits (Mainstream Consensus):**
      *   **(b) & (f) The Relational Nature:** The idea that promises create *directed duties* (owed to the promisee) and that only the promisee can waive them is widely accepted in both moral philosophy (Hohfeldian analysis) and contract law (privity, release). Very few serious theorists argue you owe the duty to "the world" or that you can unilaterally cancel it.
      *   **(d) Validity Conditions:** Everyone agrees coercion and fraud void promises. The *reason* why is disputed, but the *result* is consensus.

  *   **The Live Disputes (Where your friend will attack):**
      *   **(a) vs. (e) Will vs. Practice:** This is the biggest fight in the literature. Is the binding force generated by your individual will (a), or does it only exist because a social convention sustains it (e)? You are trying to hold both.
      *   **(c) The "Harmless Breach":** The claim that you can wrong someone without harming them or them knowing is a hardline deontological position. Consequentialists (like your friend) and Reliance Theorists (like Fuller or Atiyah) will reject this entirely. It is not a consensus view; it is a specific theoretical commitment.

  ---

  ### Part 2: The Tension Audit (Ranked by Severity)

  Here are the internal frictions within your six points, ordered from "threatens to collapse the theory" to "merely requires careful phrasing."

  #### 1. High Severity: The Source of Obligation (a) vs. The Social Practice (e)
  *   **The Conflict:** Claim (a) says the *act of undertaking* binds you "by itself." Claim (e) says a promise *only exists* where there is a "social practice."
  *   **Why it hurts:** If the social practice is necessary for the promise to exist (e), then the act of undertaking (a) cannot bind "by itself." It binds only *because* the practice backs it. If you were the last person on earth, (a) suggests you could still promise, but (e) says you couldn't. This is the classic **Fried vs. Rawls** tension.
  *   **Cheapest Fix:** Modify **(a)**. Instead of saying the act binds "by itself," say the act binds **by invoking the normative power granted by the practice.**
  *   **The Cost:** You lose the pure "magic of the will." You admit that your individual autonomy is not enough; you need the scaffold of the social convention to make your will morally operative. This weakens your reply to the consequentialist slightly (because now the practice itself must be justified consequentially), but it saves the internal logic.

  #### 2. Medium Severity: No Harm Needed (c) vs. Coercion Voids (d)
  *   **The Conflict:** Claim (c) says reliance and harm are irrelevant to the *bindingness*. Claim (d) says coercion/deception voids the promise.
  *   **Why it looks conflicted:** If consequences/harm don't matter for *breaking* the promise (c), why do circumstances/consequences matter for *making* the promise (d)? A consequentialist will ask: "If harm is irrelevant, why is coercion a dealbreaker? Did the promisee get hurt by the coercion, or just the breach?"
  *   **Why it isn't fatal (Discrimination):** This is an **apparent conflict** that dissolves if you distinguish *Validity* from *Force*.
      *   (d) is about **Validity**: Did a promise *occur*? Coercion means the "act of undertaking" in (a) was defective. No act = no obligation.
      *   (c) is about **Force**: Given a valid promise, do consequences matter?
  *   **The Fix:** You don't need to give anything up, but you must clarify that (d) negates the *existence* of the act described in (a), whereas (c) describes the *durability* of the act once it exists.
  *   **The Cost:** None, provided you are precise. You must argue that coercion prevents the *transfer of right*, not that it causes *harm*.

  #### 3. Low Severity: Secret Wrongs (c) vs. Relational Nature (b)/(f)
  *   **The Conflict:** Claim (c) says you can wrong someone who never finds out. Claim (b)/(f) says the duty is *relational* (owed to them, they hold the power).
  *   **Why it looks conflicted:** Many people intuit that a "relation" requires two-way awareness. If they never know, how is it a wrong *to them* rather than just a stain on your character?
  *   **Why it isn't conflicted:** In rights-based jurisprudence, I can violate your right (e.g., trespass on your land while you are asleep) without you knowing. The wrong is the **violation of their normative authority**, not their emotional distress. Since (b) establishes they have authority over your action, violating that authority is a wrong against them, regardless of their epistemic state.
  *   **The Fix:** None needed. This is the strongest part of your package. It survives contact with the rest because (b) grounds (c). The wrong is the *usurpation of their right to hold you to the word*, not the disappointment they feel.

  ---

  ### Part 3: The "One Revision"

  If you want to clean up the most friction at once, specifically to protect yourself from your consequentialist friend while keeping your deontological core, make this revision to **(a)**:

  > **Current:** "What makes a promise bind is the promisor's own act of undertaking the obligation — giving your word does it by itself..."
  >
  > **Revision:** "What makes a promise bind is the promisor's act of **invoking a normative power to change their moral relation to the promisee**."

  **Why this helps:**
  1.  **Solves (a) vs. (e):** It acknowledges that you need a "power" (which comes from the practice/convention) to change the relation. It bridges the Will and the Practice.
  2.  **Protects (c):** It explains why harm doesn't matter. You aren't liable because they got hurt; you are liable because you altered the moral landscape between you without their permission to revert it.
  3.  **Fortifies (b) & (f):** It makes the "relational" aspect the central feature, not a side effect.

  **The Cost:** You concede that promising isn't a "natural" moral power (like self-defense) but an "institutional" one (like casting a vote or signing a deed). This makes your view slightly more vulnerable to the argument that "if the institution is bad, the promise isn't binding," but it makes your internal logic much tighter.

  ### Part 4: The "Secret Wrong" Intuition

  You asked specifically if (c) survives contact with the rest. **Yes, it does,** but only because of (b).

  If you argued (c) based on "private integrity" (i.e., "I promised, so I must be true to myself"), then (c) would conflict with (b) and (f). A private integrity view suggests *you* own the obligation, so *you* should be able to release yourself if your integrity is satisfied.

  But because you ground (c) in (b) (the obligation is *owed*), the "secret wrong" is coherent. It is analogous to theft. If I steal from you secretly and you never find out, I have still wronged *you* (violated your property right), not just "the universe."

  **Warning for Seminar:** Your friend will attack (c) not on consistency grounds, but on **intuition** grounds. She will say, "If no one is hurt and no one knows, where is the 'wrong' located?"
  *   **Your Answer:** "The wrong is located in the **non-consensual alteration of her normative status.** She had a right to expect performance; I unilaterally removed that right without her waiver. That is a harm to her *agency*, even if not her *welfare*."

  ### Summary Recommendation

  1.  **Keep (b), (c), (d), (f).** They form a tight, coherent deontological/relational cluster.
  2.  **Modify (a)** to acknowledge that the "act" works by invoking a conventional power (resolving the tension with (e)).
  3.  **Clarify (d)** as a condition of *validity*, not *consequence*, to prevent the consequentialist from smuggling harm back in through the back door.

  Your package is not a pile of hunches; it is a **Will Theory of Contract with a Conventionalist Constraint.** It is internally consistent provided you admit the Will needs the Convention to function. Go into the seminar confident that (b) and (f) are your anchor; if she attacks (c), tie it back to (b).
