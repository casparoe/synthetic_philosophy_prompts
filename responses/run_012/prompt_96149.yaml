          *   *Severity 2 (Medium):* (c) No Reliance Needed vs. (d) Coercion/Deception Voids. Why does the *input* matter if the *output* (harm) doesn't? Needs a "Consent" bridge.
          *   *Severity 3 (Low/Apparent):* (c) Secret Wrong vs. (b) Relational. Explain why this *isn't* a conflict (rights can be violated without knowledge).
      *   **Resolutions/Costs:**
          *   For (a)/(e): Modify (a) to say the act invokes the practice. Cost: Pure voluntarism is diluted.
          *   For (c)/(d): Clarify that (d) is about the *existence* of the act, not the *consequences*. Cost: None really, just clarification.
      *   **The "One Revision":** Focus on the bridge between Will and Practice.
      *   **Specific Note on (c):** Address the "secret wrong" intuition pump. It survives contact with the rest *if* you hold the Directed Duty view firmly.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I order by severity? Yes, Will vs. Practice is the big one in jurisprudence.
      *   *Check:* Did I distinguish consensus from dispute? Need to be careful. In *philosophy*, almost none of this is settled. In *law*, some is. The user says "jurisprudence seminar," so focus on philosophical consensus (which is low) vs. recognizable schools of thought.
