answer: |-
  **Essay Question**

  Consider the term 'book', which originated as a name for bound paper codices but now extends to digital files that share no physical properties with the originals. Critically evaluate Wittgenstein's family-resemblance account using this case. First, distinguish the account from the view that concepts are disjunctions of sufficient conditions or weighted clusters with thresholds, and from prototype theory. Second, address the objection that similarity is too cheap to individuate concepts, risking circularity if similarities are defined by the concept itself. Third, assess whether Wittgenstein's appeal to shared practice or grammar offers a substantive description of concept acquisition or merely a methodological injunction immune to refutation. Take a stand on whether the account survives these challenges.

  ***

  **Model Answer**

  The family-resemblance account asserts that the application of many general terms is not grounded in any single feature common to all instances, thereby denying the logical necessity for necessary and sufficient conditions. This position must be sharply distinguished from two rivals. First, unlike disjunctive or weighted cluster theories, it does not posit a fixed set of criteria where some combination becomes necessary for application. Cluster theories retain the assumption that meaning is rule-governed by a specific inventory of features, perhaps with a threshold of satisfaction; family resemblance rejects the inventory itself, allowing for instances that share no single trait. Second, it differs from prototype theory, which suggests concepts are applied by comparing instances to a stored psychological exemplar. Wittgenstein's claim is not about cognitive mechanics but about the logical grammar of the term; it concerns what makes an application correct, not how a speaker calculates it psychologically.

  The most serious objection is that appeal to similarity is too cheap to individuate concepts. Any arbitrary collection of things resembles one another in some respect; red things and loud noises are both intense. If resemblance alone justifies grouping, concepts lack boundaries. Furthermore, the account risks circularity if the relevant similarities are specified merely as similarities in being instances of the concept at issue. To say games resemble one another *as games* explains nothing about why this specific grouping exists rather than another. This threatens to make the account vacuous, licensing the conclusion that anything goes in the application of a word.

  Wittgenstein's resources against this objection rely on shifting focus from objects to use. The relevant similarities are not free-floating facts but are determined by the rules of the language-game and the shared practice of the community. In the case of 'book', the term began denoting physical codices and now includes digital files. The earliest and latest instances share no physical features—no paper, ink, binding, or weight. A cluster theory might struggle to explain this continuity without ad hoc adjustments to the necessary conditions, perhaps forcing 'contains text' to become a rigid requirement. Family resemblance handles this by locating the continuity in the practice: both are read, cited, stored, and sold as texts. The overlap is not in material constitution but in the role the object plays in a form of life. The practice filters which similarities matter.

  However, this raises a critical question about the status of the account. Is it a substantive description of how concepts work, or a methodological injunction? If substantive, it claims concepts *are* loosely structured networks, which remains vulnerable to the charge that such networks are arbitrary without further constraint. If methodological, it advises philosophers to stop seeking essences and examine actual usage. The latter interpretation is more robust. It does not claim that concepts *must* lack essences, but that searching for them obstructs understanding of language. The appeal to grammar is not a description of extension but a reminder that meaning is constituted in use. If treated as a substantive empirical hypothesis, it could be refuted by finding a common feature; treated as grammar, it is immune to such refutation because it dictates how we look for features.

  Consequently, the account survives not by offering a rival theory of reference, but by dissolving the demand for one. The 'book' case demonstrates that extension follows practice, not physical similarity. The circularity objection is met by grounding relevance in the form of life, not in abstract comparison. Ultimately, the family-resemblance account is defensible only as a therapeutic method against essentialism, not as a positive doctrine of concept acquisition. It succeeds by changing the philosophical subject from metaphysics to grammar, showing that the unity of a concept is found in the unity of the practice, not the unity of the object. To treat it as psychology is to miss the point; to treat it as license for arbitrariness is to ignore the constraint of the practice.

  ***

  **Marking Scheme (30 Marks)**

  **First-Class (25–30 marks)**
  *   **Precise Distinctions:** Clearly distinguishes family resemblance from cluster/disjunction theories (no necessary conditions vs. weighted thresholds) and prototype theory (grammar vs. psychology).
  *   **Objection Handling:** Confronts the "too cheap similarity" objection directly, acknowledging the risk of circularity and arbitrariness.
  *   **Status of Account:** Explicitly adjudicates the substantive vs. methodological status, arguing that the account survives best as a methodological injunction or grammatical reminder rather than an empirical hypothesis.
  *   **Case Application:** Uses the 'book' case to illustrate how practice sustains concept identity despite material divergence, rather than just listing features.
  *   **Argumentative Stand:** Takes a clear position on whether the account survives (preferably arguing for the methodological/therapeutic reading).

  **Second-Class (18–24 marks)**
  *   **Solid Summary:** Accurately explains family resemblance and the 'book' case but lacks precision in distinguishing it from cluster theories (may conflate the two).
  *   **Objection Handling:** States the circularity objection but offers a standard reply without critically evaluating whether the reply converts the doctrine into a methodological injunction.
  *   **Status of Account:** Treats the account primarily as a substantive description of concepts, missing the nuance that this makes it vulnerable to refutation.
  *   **Case Application:** Uses the example descriptively but fails to link it deeply to the argument about practice vs. features.

  **Third-Class / Fail (0–17 marks)**
  *   **Memorised Doctrine:** Relies on stock phrases ("meaning is use", "look not think") without engaging the specific objections required.
  *   **Recurring Errors:** Treats family resemblance as an empirical hypothesis in psychology that could be settled by experiment; or interprets it as licensing the conclusion that "anything goes" in word application.
  *   **Missing Elements:** Fails to distinguish between prototype/cluster theories and family resemblance; ignores the substantive vs. methodological distinction; or neglects the specific 'book' case provided.
  *   **Misunderstanding:** Claims Wittgenstein argues that concepts *have* no essence as a metaphysical fact, rather than as a grammatical clarification.
