answer: |-
  Two archaeologists, Ellis and Morgan, are crouching over a feature at the end of the season. It's a small pit containing three whole bowls, a layer of charcoal, and no food residue.

  Ellis: "Functional interpretation?"
  Morgan: "Write 'Ritual Deposition.'"
  Ellis: "But that's just saying we don't know. It could be a lost cache. Or weird trash."
  Morgan: "If I call it a cache, the next season finds a fourth bowl and I'm wrong. If I call it trash, the lab finds no wear and I'm wrong. Those are claims about what they *did*. The dirt can veto those."
  Ellis: "And 'ritual'?"
  Morgan: "That's a claim about what they *meant*. The dirt doesn't record intent. You can disprove a pantry with a shovel. You can't disprove a prayer."

  ***

  **Note on liberties taken:**
  This joke caricatures the use of "ritual" as a purely defensive, unfalsifiable fallback. In practice, archaeologists do not simply label ambiguous features "ritual" to avoid being wrong; such interpretations are usually constrained by cross-cultural analogy, pattern recognition across multiple sites, and strict contextual analysis (e.g., distinguishing structured deposition from random loss). Furthermore, many contemporary archaeologists argue that "ritual" is not a distinct category of behavior separate from the practical or political, meaning the asymmetry between "function" and "belief" is itself a contested theoretical stance rather than a hard epistemic rule.
