answer: |-
  Here is a procedure designed for your constraints. It translates the uncomputable ideals of algorithmic information theory into a protocol suitable for a two-hour regulatory meeting. It distinguishes rigorously between mathematical invariants and engineering proxies.

  ### The Protocol: Minimum Description Length for Regulatory Selection (MDL-RS)

  **Preamble:** Read this aloud at the start of the session.
  *"We are not testing for Truth. We are testing for Compression. We seek the model that encodes the data and the regulatory constraints in the fewest bits, using our agreed-upon scientific vocabulary. A shorter description implies fewer opportunities for overfitting and lower transmission cost, not necessarily ontological correctness."*

  #### Step 1: Fix the Reference Machine (The Vocabulary)
  **Question:** "In what language are we measuring length?"
  **Action:** The panel must explicitly agree on the *coding scheme*. This is usually "Standard Scientific English + [Specific Mathematical Notation] + [Regulatory Precedents]."
  **Sufficient Answer:** "We are measuring complexity in the language of [e.g., EPA Toxicological Guidelines 2020] using [e.g., SI units, log-linear transformations]."
  **Theoretical Basis:** Kolmogorov complexity $K(x)$ is invariant up to an additive constant $c$ only across *universal* Turing machines. In practice, our "machine" is the collective understanding of the panel.
  **Engineering Compromise:** We cannot define a universal Turing machine. We substitute "Community Standard Notation."
  **Risk:** If Model A is simple in Python but Model B is simple in C++, the choice of language biases the result.
  **Termination:** If the panel cannot agree on the vocabulary (e.g., one side insists on Bayesian notation, the other on Frequentist), **STOP**. Hand to Judgment. The complexity difference is swallowed by the translation constant.

  #### Step 2: Isolate the Auxiliary Assumptions (The "Hidden Bits")
  **Question:** "What assumptions are required to run this model that are *not* written in the model equation?"
  **Action:** List all boundary conditions, unit conversions, and data-preprocessing steps required to make the model function.
  **Sufficient Answer:** A written list of assumptions for Model A and Model B.
  **Theoretical Basis:** $K(Model)$ must include the code to parse the input. Moving an assumption from the "code" to the "input data" artificially lowers $K(Model)$.
  **Engineering Compromise:** We count these as "effective parameters." Each distinct, underived assumption adds a penalty equivalent to 1 parameter.
  **Termination:** If one model requires a proprietary black-box pre-processor whose complexity cannot be audited, **STOP**. Hand to Judgment. You cannot measure the length of a black box.

  #### Step 3: Calculate the Two-Part Code Length
  **Question:** "What is the cost of the model plus the cost of the errors?"
  **Action:** Compute $L_{total} = L(Model) + L(Data | Model)$.
  *   $L(Model)$: Proxy using parameter count $k$ (penalized).
  *   $L(Data | Model)$: Proxy using the negative log-likelihood of the residuals (goodness of fit).
  **Sufficient Answer:** A calculated score for each model (e.g., BIC or AIC value).
  **Theoretical Basis:** This is the Minimum Description Length principle. $L(Data|Model)$ represents the "noise" remaining after the "signal" (model) is extracted. Solomonoff induction weights hypotheses by $2^{-K(H)}$.
  **Engineering Compromise:** We use BIC (Bayesian Information Criterion) as the proxy for $K$.
  $$BIC = -2 \ln(\hat{L}) + k \ln(n)$$
  Where $n$ is data points, $k$ is parameters. This approximates MDL for large $n$.
  **Note:** If models are non-nested, Likelihood Ratio Tests are invalid. BIC/MDL remains valid.
  **Termination:** If $n$ is small ($< 50$), the asymptotic approximation of BIC breaks down. **STOP**. Hand to Judgment (use AICc or cross-validation instead).

  #### Step 4: Evaluate the Difference Against the Invariance Constant
  **Question:** "Is the difference in scores larger than the uncertainty in our measurement of complexity?"
  **Action:** Calculate $\Delta = |Score_A - Score_B|$.
  **Sufficient Answer:**
  *   If $\Delta > 10$: Strong evidence for the lower score.
  *   If $2 < \Delta < 10$: Positive evidence.
  *   If $\Delta < 2$: No meaningful difference.
  **Theoretical Basis:** The Invariance Theorem guarantees $|K_U(x) - K_{U'}(x)| \leq c$. However, $c$ is constant only for *long* strings. For regulatory models (short strings), $c$ is significant.
  **Engineering Compromise:** The thresholds (2, 10) are heuristic conventions from Bayesian model selection (Kass & Raftery), not derived from the invariance constant $c$. They assume our "Reference Machine" (Step 1) is stable.
  **Termination:** If $\Delta < 2$, the models are indistinguishable by this metric. **STOP**. Hand to Judgment (choose based on conservatism or cost).

  #### Step 5: Check for "Zero Prior" Violations
  **Question:** "Does selecting this model effectively ban the other from future consideration?"
  **Action:** Ensure the recommendation allows for the rival model to be reinstated if new data arrives.
  **Sufficient Answer:** "Recommend Model A for current limits, subject to review if new data exceeds [Threshold]."
  **Theoretical Basis:** In Solomonoff Induction, no computable hypothesis ever reaches posterior probability zero. It is always possible for the "losing" model to recover with more data.
  **Engineering Compromise:** Regulation requires a binary decision (use/don't use). We mitigate this by adding a "Review Trigger."
  **Termination:** If the Director demands a permanent ban on the rival model, **STOP**. Hand to Judgment. This violates the logic of induction.

  #### Step 6: Formulate the Recommendation
  **Action:** Draft the one-page memo.
  **Content:**
  1.  Vocabulary used (Step 1).
  2.  Score difference (Step 4).
  3.  Known hidden assumptions (Step 2).
  4.  Review Trigger (Step 5).
  **Termination:** Procedure Complete.

  ---

  ### Application to Three Cases

  #### Case 1: Rival Dose-Response Models (LNT vs. Threshold)
  *   **Context:** Linear No-Threshold (2 params: slope, intercept) vs. Threshold (3 params: slope, intercept, threshold dose).
  *   **Step 1 (Vocabulary):** Agreed: Standard toxicology notation.
  *   **Step 2 (Assumptions):** LNT assumes biological linearity at low dose (hidden assumption). Threshold assumes a repair mechanism (hidden assumption). Both count as 1 effective parameter each.
  *   **Step 3 (Scores):** Data fits both within uncertainty. Threshold has slightly better likelihood (lower residuals) but higher parameter penalty.
      *   $BIC_{LNT} = 150.5$
      *   $BIC_{Thresh} = 151.2$
  *   **Step 4 (Difference):** $\Delta = 0.7$.
  *   **Result:** $\Delta < 2$. The procedure **STOPS**.
  *   **Handoff:** The panel cannot recommend based on complexity/fit. The choice must be made on *policy* grounds (e.g., precautionary principle favors LNT despite equal fit). The memo must state: "Models are informationally equivalent; LNT selected for conservative risk management, not descriptive superiority."

  #### Case 2: Physical Process Parameterization (The "Physicist's Trap")
  *   **Context:** Model A (Empirical polynomial, 5 params) vs. Model B (Derived from first principles, 8 params). You favor Model B.
  *   **Step 1 (Vocabulary):** Crucial Step. If vocabulary is "Curve Fitting," Model A is simpler. If vocabulary is "Lagrangian Mechanics," Model B is simpler because the 8 params are fixed constants of nature, not free variables.
  *   **Action:** Panel agrees to measure complexity in "Standard Physical Constants + Free Variables."
  *   **Step 2 (Assumptions):** Model A assumes the polynomial form holds outside data range (high risk). Model B assumes conservation laws (low risk).
  *   **Step 3 (Scores):** In the agreed vocabulary, Model B's "fixed" constants do not incur the $k \ln(n)$ penalty.
      *   $BIC_{A} = 200$ (5 free params)
      *   $BIC_{B} = 190$ (3 free params + 5 constants)
  *   **Step 4 (Difference):** $\Delta = 10$.
  *   **Result:** Strong evidence for Model B.
  *   **Recommendation:** Adopt Model B.
  *   **Note:** This validates your intuition but only because Step 1 correctly identified that "constants of nature" are not "information" in the language of physics. If the panel had defined vocabulary as "Polynomial Coefficients," Model A would have won. The procedure exposes this linguistic bias.

  #### Case 3: Underdetermined Data (The "Null" Case)
  *   **Context:** Two models, vastly different mechanisms, data is too noisy to distinguish.
  *   **Step 3 (Scores):** Likelihoods are identical (dominated by noise).
      *   $BIC_{A} = 500$
      *   $BIC_{B} = 505$
  *   **Step 4 (Difference):** $\Delta = 5$.
  *   **Analysis:** While $\Delta > 2$, the absolute magnitude of the likelihood term is dominated by measurement error variance, not model structure. The "Data" part of the code length is mostly "Noise."
  *   **Result:** **STOP**. Hand to Judgment.
  *   **Reasoning:** When $L(Data|Model)$ is dominated by instrument noise, minimizing description length selects the model that best compresses *noise*, not signal.
  *   **Recommendation:** "Data is insufficient to distinguish models. Recommend funding for higher-precision measurement. Interim standard: Use Model A for cost reasons."

  ---

  ### Limitations and Honesty Statement

  **1. Truth vs. Compression**
  This procedure **cannot** license the claim that the preferred model is "closer to the truth."
  *   *Why:* Kolmogorov complexity measures the shortest *description*, not the causal structure of reality. A lookup table of all data has perfect fit but zero predictive power. A simple model might be "wrong" but compressible.
  *   *Statement for Director:* "We recommend Model A because it is the most efficient summary of current data, not because it is proven to be the physical mechanism."

  **2. The Compressor Dependence**
  If we replaced the BIC calculation (our "compressor") with a different proxy (e.g., AIC, or actual gzip compression of the code), the ranking could flip.
  *   *Why:* BIC assumes $n \to \infty$. AIC assumes finite $n$ with specific loss functions. They approximate different bounds of the MDL.
  *   *Statement for Director:* "This recommendation is robust within the standard Bayesian approximation. If the cost of model error changes significantly, the penalty term should be recalibrated."

  **3. The Invariance Constant Problem**
  For the short "programs" we deal with in regulation (equations with <10 parameters), the additive constant $c$ (the difference between our "language" and a true Universal Turing Machine) is not negligible.
  *   *Why:* Invariance is asymptotic. For short strings, the choice of language (Step 1) determines the winner.
  *   *Statement for Director:* "The preference for Model B relies on the agreement that 'Physical Constants' are not 'Free Parameters'. If this convention changes, the recommendation reverses."

  **4. Solomonoff's Warning**
  Solomonoff Induction sums over *all* models. We are choosing *one*.
  *   *Why:* Regulation requires a single limit. Science requires a distribution.
  *   *Statement for Director:* "By choosing one model, we discard the uncertainty inherent in model selection. The safety margin in the final limit must be widened to account for the possibility that the unselected model is the correct one."

  ### Summary for the Chair
  You are not computing truth. You are managing information risk.
  1.  **Define the Language** (Step 1 is the most critical; it is political, not mathematical).
  2.  **Count the Bits** (Use BIC, but know it is an approximation).
  3.  **Respect the Noise** (If $\Delta$ is small, admit ignorance).
  4.  **Never Ban** (Keep the prior non-zero).

  If the procedure tells you to "Hand to Judgment," do not view it as a failure. It is the only mathematically honest outcome when the data cannot pay for the complexity of the decision.
