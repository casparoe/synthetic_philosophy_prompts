answer: |-
  Good evening. For those of you who know [Friend] from the office or from family gatherings, you know he is the most cheerful person in the room. For those of us who met him at the local rationalist meetup back in 2010… we know that cheerfulness is actually a very sophisticated defense mechanism.

  [Friend] has a favorite thought experiment. It's been his running bit for twenty years. I promised his daughter and his mother that tonight, I would not use the D-word. I would not talk about endings, or extinction, or anything remotely final. So instead, we are going to talk about dinners.

  I want everyone to try something with me. It'll take ten seconds.

  Close your eyes. Imagine every dinner [Friend] will ever share with people he loves. Every single one. The ones we've already had, the one we're having now, and all the ones in the future. Imagine all those nights written on tickets and put into a giant bag. Shake the bag. Now, imagine you reach in and pull out one ticket at random.

  You look at the ticket. It says "Tonight."

  Now, open your eyes. Here is the question that has kept [Friend] up happy for two decades: If there were thousands of dinners left in that bag, wouldn't it be incredibly unlikely for you to pull out one this early in the sequence? Doesn't the fact that you are here, right now, suggest that the bag isn't actually that big? That maybe… there aren't as many dinners left as we hope?

  If you feel a little chill in your stomach, good. That's the logic. It says that just by being here, you are statistically forced to admit the end is closer than the beginning.

  Apply that to his career. He's retiring. The logic says, "See? It was bound to end now."
  Apply it to his marriage. The logic says, "You're halfway through, so hurry up."
  Apply it to tonight. The logic says, "We should probably go home, because this moment is likely near the end of the evening."

  If you follow that thread, you end up in a very strange place. You end up believing that your job is almost over, your marriage is almost over, and your dessert is almost over, all at the exact same time.

  [Friend] has a name for this. He calls it the "everything-is-almost-over" problem.

  And here is the thing I want you to know about him. He doesn't love this argument because he thinks things end. He loves it because he found the flaw in it. He taught me that if one trick tells you that *everything* is ending simultaneously, it isn't telling you anything about the future. It's just telling you that the trick is broken.

  You cannot use the same math to predict the end of a career, the end of a marriage, and the end of a Tuesday night. If you do, you aren't being clever; you're just ignoring that beginnings exist.

  So, the logic fails. And because the logic fails, the bag is still full. There is no statistical force telling us to go home. There is no mathematical reason to stop counting the dinners.

  [Friend] spent twenty years playing with a idea that says "hurry up," so he could prove to us that we don't have to. He taught us that you can look at the abyss, check the math, realize the math is wrong, and order another round.

  So, to [Friend]. May your reference classes be messy, may your priors be weak, and may there be far more dinners in the bag than any statistician dares to predict.

  Cheers.

  ***

  ### Load-Bearing Sentences (for trimming)

  If you need to cut time, keep these sentences intact. They carry the logical arc so the audience still follows the trick and the resolution.

  1.  **"Imagine every dinner [Friend] will ever share with people he loves… Imagine all those nights written on tickets and put into a giant bag."** (Sets up the experiment without jargon.)
  2.  **"Doesn't the fact that you are here, right now, suggest that the bag isn't actually that big?"** (Executes the Doomsday logic implicitly.)
  3.  **"You end up believing that your job is almost over, your marriage is almost over, and your dessert is almost over, all at the exact same time."** (Demonstrates the absurdity of the conclusion.)
  4.  **"If one trick tells you that *everything* is ending simultaneously, it isn't telling you anything about the future."** (The core objection/the gift.)
  5.  **"He taught us that you can look at the abyss, check the math, realize the math is wrong, and order another round."** (The tribute/conclusion.)
