answer: |-
  1.  **Gut Check: The Vaping Cousin (5 min)**
      *   **Action:** Tell the story: Cousin vapes, tells little brother to quit. Brother says, "You can't tell me that."
      *   **Dependency:** This must come first to unlock their intuition before you introduce jargon. If you start with definitions, they will debate the dictionary.
      *   **Constraint:** The example *must* have universal agreement that vaping is bad (so the advice is sound) and certainty that the cousin vapes (so the hypocrisy is factual). It *must not* have ambiguity about health risks or whether he actually vapes, or the room will fight the facts instead of the principle.
      *   **Why this example:** Pick the **Vaping Cousin**. The Captain/Clipping example is too dangerous for a 25-minute lesson because kids will derail into "But did he actually clip?" or "But the other school was worse!" The Cousin example isolates the *speaker* from the *claim* cleanly.

  2.  **The Split: Fraud vs. Mess (5 min)**
      *   **Action:** Write Priya's distinction on the board: **1. You don't believe it (Fraud)** vs. **2. You believe it but fail (Mess)**. Ask the room which one the Cousin is.
      *   **Dependency:** Depends on Step 1. You need their emotional reaction to the Cousin to categorize it.
      *   **Misconception Head-Off:** This is where you stop the idea that "Hypocrisy = Lying." Most kids think hypocrisy means you don't believe what you say. This step forces them to see you can believe it and still be a hypocrite.

  3.  **The Rule: When "Tu Quoque" Counts (5 min)**
      *   **Action:** Now you can say the T-word. Explain that in a debate round, we care about the *claim* (Truth). In life/coaching, we care about the *speaker* (Standing).
      *   **Dependency:** Depends on Step 2. Once they see the "Mess" category, they understand why the rule exists (to protect truth) but also why it feels wrong in life (where standing matters).
      *   **Misconception Head-Off:** This stops them from thinking "Tu Quoque is always a fallacy." You validate their training while expanding their worldview.
      *   **Risk Control:** Do not say "Tu Quoque" until this step. Write "The T-Word" on the board earlier and forbid saying it aloud until now, or they will stop listening to the nuance.

  4.  **The Concept: Standing vs. Truth (5 min)**
      *   **Action:** Define **Standing**: "The right to be heard," not "The rightness of the words."
      *   **Dependency:** Depends on Step 3. They need to know the debate rule before they can understand why "Standing" is a different category entirely.
      *   **Misconception Head-Off:** This stops the idea that "Blame is just stating facts." Blame is a social transaction requiring authority.
      *   **Scope Refusal:** Refuse to decide *if* the cousin loses standing. Do not let the room vote on whether the brother was right. Your job is to teach the *mechanism*, not judge the *case*.

  5.  **The Test: Final Question (5 min)**
      *   **Action:** Ask the question below. Have them write the answer on a slip of paper or shout it out.
      *   **Dependency:** Depends on Step 4. They need the definition of Standing to answer correctly.
      *   **The Question:** "If I prove you're a hypocrite, did I prove your argument is **wrong**, or did I prove you are **disqualified**?"
      *   **Success Metric:** If they say "Wrong," they missed it. If they say "Disqualified" (or "Silenced," "Lost Standing"), they got it.

  \answer{Hypocrisy makes claims false}
