  ok so I'm a junior and I'm in my school's debate club, and our coach Mr. Alderidge is letting me run the entire 25-minute session next Thursday because he's taking the varsity team to regionals and honestly I think he just doesn't want to prep anything. I get to pick the topic and I want to do standing to blame and hypocrisy. The reason is that in debate we get drilled that "tu quoque" is a fallacy and you get docked for it, which I can recite in my sleep, but then in real life my cousin vapes and is constantly telling his little brother to quit and it really does feel like that should matter somehow, and I can't tell if I actually believe that or if I just believe it because I like him. My friend Priya and I got into a whole thing about it at lunch. She says there's two totally different things people mean when they say "you can't say that to me": either you're a fraud, you don't even believe the thing you're saying, or you're a mess, you believe it and you're just failing at it, like a guy with a drinking problem telling you to stop drinking. I think that split is the spine of the whole thing but I'm not sure it can carry the lesson by itself.

  Don't explain the topic to me, plan how I should teach it. I need the order the pieces have to go in and why each one depends on the last, for a room of fourteen-to-seventeens who have never read any philosophy and who all walk in already thinking blame just means telling somebody they did a bad thing and that hypocrisy is definately always a fallacy. Which example should carry the whole thing — I've got two candidates and I want you to pick: the vaping cousin, or something that actually happened last month where our team captain called out another school for clipping evidence during a round and then got caught doing basically the same thing two weeks later. I worry the second one is too juicy and the whole room derails into whether he was still right about the other school, so tell me which one carries it and what that example has to have and has to not have. Then the misconceptions in the order they'll actually show up, and exactly where in the sequence I should head each one off, including the one I'm probably going to plant myself by saying "tu quoque" out loud too early because it's the only word I'm confident about. Also what I should openly refuse to get into in 25 minutes, and the one question I can ask at the end that tells me whether they got the difference between "your criticism is false" and "you aren't the one who gets to make it" rather than just being able to parrot the word hypocrisy. Put it as a numbered sequence I can copy onto the whiteboard. And on the very last line, by itself, put \answer{} with just the misconception you think is the hardest to dislodge from a debate kid, in like three or four words.
