answer: |-
  The zoning regime you describe is not a coherent application of Burkean epistemic humility but rather a doctrinal compromise designed to navigate the constitutional tension between the police power to regulate nuisances and the Fifth Amendment prohibition on taking private property without compensation.

  Your suspicion is correct: amortization is fundamentally incompatible with a strict epistemic or Burkean reading. If existing arrangements encode tacit knowledge or social value worthy of Chesterton's defense, setting a timer to extinguish them contradicts the premise that their preservation is valuable in itself. A consistent Burkean would oppose amortization just as vigorously as immediate prohibition, arguing that the nonconforming use should persist indefinitely unless a specific harm is demonstrated, because the burden of proof lies on the reformer to show the fence is useless. The legal practice does not require epistemic humility; it merely accommodates it superficially through initial grandfathering, while strictly requiring the protection of vested reliance interests to avoid constitutional liability. The discontinuance and amortization rules reveal that the state views the nonconforming use not as a repository of wisdom, but as a legal nuisance that is tolerated temporarily to spare the treasury from compensation claims.

  This package is best understood as a stalemate among distinct commitments, specifically a legal one between property rights and state planning authority. Grandfathering accommodates the reliance interest (and superficially respects the status quo), discontinuance enforces the idea that the right is tied to active investment rather than land ownership, and amortization asserts the state's ultimate priority to achieve zoning uniformity. The practice strictly requires that the state avoid a "taking" without compensation under current constitutional interpretation, which mandates the initial reprieve. It merely accommodates the political desire for orderly zoning transitions through amortization, which functions as a way to eliminate property rights over time without triggering the compensation requirement that immediate elimination would incur.

  Regarding the rival theories, a legal positivist reconstructs the practice without strain because the rules are self-justifying as current positive law. A welfarist can also reconstruct it with moderate strain, viewing grandfathering as a transition cost minimization and amortization as a way to maximize long-term utility by eventually eliminating inefficiencies, provided the phase-out period allows for capital depreciation. A Nozickian libertarian, however, cannot reconstruct the practice without significant strain; from a rights-based perspective, amortization is an expropriation of property value without compensation, violating side-constraints regardless of the phase-out period, and discontinuance rules arbitrarily sever rights from the deed.

  If you swapped the implicit theory for a purely epistemic one, institutionally you would eliminate amortization and discontinuance rules entirely; nonconforming uses would become permanent, inheritable property rights that could only be removed if the owner voluntarily sold or if the state compensated them fully, shifting the burden of proof entirely to the zoning board to demonstrate specific harm. If you swapped it for a purely welfarist one, you would remove the grandfathering friction entirely: the state would either ban the use immediately if the social benefits outweighed the costs (potentially compensating owners to satisfy Kaldor-Hicks efficiency) or allow the use permanently if the transition costs exceeded the benefits, removing the ambiguous "phase-out" middle ground that currently characterizes the system.
