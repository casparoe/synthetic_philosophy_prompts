prompt: |-
  Ok, so I have this friend who's gotten really into an old Chinese line: a white horse is not a horse. He drops it whenever anyone pushes back on his definitions. Most recently I said his veggie burger is still a burger, and he said nope, a white horse is not a horse, a veggie burger is not a burger, same structure. Another time he said a digital ebook isn't a book, and when I asked whether a red Honda is not a Honda he just smiled. I know the original dialogue has a bit where the advocate says if you ask for a horse, yellow and black horses will do, but if you ask for a white horse, they won't, so the two requests are different. I want to know what the sentence could actually be claiming. Can you seperate out the different precise theses it might be expressing, from the boring/trivial ones to the wild ones? For example: it's just saying the set of white horses isn't identical to the set of horses; or that the word horse in white horse is being used differently than horse on its own; or that a white horse is a horse plus something extra, so not the same object; or that not a horse means not identical to horse rather than not a member of the category horse; or something about intensions vs extensions, or about compound terms and how they compose. I want a menu, not one answer. For each reading, tell me whether it's trivial, substantive and defensible, or definately false, and which reading would actually support my friend's move from the white horse line to the veggie burger line. Also tell me which reading people who repeat the line probably mean, and whether the horse-buying example in the original supports any of them. No citations or reading list needed, just the distinctions.
