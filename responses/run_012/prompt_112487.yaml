answer: |-
  Here is a menu of distinct philosophical theses hidden inside the sentence "A white horse is not a horse," ranked from trivial to wild, with an evaluation of how well they support your friend's veggie burger argument.

  ### 1. The Set-Theoretic Non-Identity Thesis
  *   **The Claim:** The *collection* of all white horses is not identical to the *collection* of all horses.
  *   **Explanation:** In math terms, Set A (White Horses) is a proper subset of Set B (Horses). Set A $\neq$ Set B.
  *   **Verdict:** **Trivially True.** Obviously, the group of white horses is smaller than the group of all horses.
  *   **Does it save your friend?** **No.** This doesn't prove a veggie burger isn't a burger. It only proves the *set* of veggie burgers isn't the *set* of all burgers. Your friend is claiming the *object* isn't a burger, not that the *menu category* is different.

  ### 2. The Intensional Difference Thesis
  *   **The Claim:** The *definition* or *concept* of "white horse" is not the same as the definition or concept of "horse."
  *   **Explanation:** "Horse" refers to shape/form. "White horse" refers to shape/form + color. The meaning (intension) of the term "white horse" contains more information than the term "horse."
  *   **Verdict:** **Substantive and Defensible.** Linguistically and conceptually, the terms have different criteria for application.
  *   **Does it save your friend?** **Partially.** This supports the idea that "veggie burger" has a different definition than "burger." However, having a different definition doesn't mean exclusion. A "square" has a different definition than a "rectangle," but a square is still a rectangle. This thesis explains why the *terms* differ, not why the *object* is excluded from the category.

  ### 3. The "Is" of Identity vs. The "Is" of Predication Thesis
  *   **The Claim:** "A white horse is not [identical to] a horse," rather than "A white horse is not [a member of the class] horse."
  *   **Explanation:** This relies on the ambiguity of the word "is." If I say "Clark Kent is Superman," I mean identity. If I say "Clark Kent is a man," I mean category membership. The sophism argues that a specific white horse is not *identical* to the universal concept of "Horseness."
  *   **Verdict:** **Substantive and Defensible.** This is the most logically robust reading. No specific instance is identical to its universal category.
  *   **Does it save your friend?** **No.** Your friend is using "is not" to mean "is not a member of the category." He is saying a veggie burger does not count as a burger. This thesis only says a veggie burger isn't *identical to the concept* of Burgerness, which is boring. It doesn't justify refusing to call it a burger on a menu.

  ### 4. The Compound Entity Thesis
  *   **The Claim:** A "white horse" is a composite object (Whiteness + Horseness), whereas "horse" refers to the simple essence. A composite is not the same thing as one of its components.
  *   **Explanation:** You are adding "white" to "horse." The result is a new, complex thing. Since "horse" implies the abstract form without color specification, the colored version is a different metaphysical object.
  *   **Verdict:** **Substantive (Metaphysically).** This depends on accepting that "Whiteness" and "Horseness" are separate existing entities that combine.
  *   **Does it save your friend?** **Yes, this is his best bet.** He is arguing that a "veggie burger" is a composite (Veggie + Patty-Shape) while a "burger" implies a different composite (Meat + Patty-Shape). If "Burger" essentially requires meat, then adding "Veggie" changes the essence enough to create a new object that is not the original object.

  ### 5. The Pragmatic Request Thesis
  *   **The Claim:** Fulfilling a request for a "white horse" is not the same action as fulfilling a request for a "horse."
  *   **Explanation:** This focuses on utility. If the king asks for a horse, a yellow one works. If he asks for a white horse, a yellow one fails. Therefore, in the context of exchange or command, they function differently.
  *   **Verdict:** **Substantive and Defensible.** It highlights context-dependence.
  *   **Does it save your friend?** **Weakly.** It suggests that if you order a "burger" and get a "veggie burger," you might be dissatisfied. But it doesn't prove the waiter lied by calling it a burger. It explains why you might want to distinguish them, not why they are ontologically distinct.

  ### 6. The Category Exclusion Thesis (The "Hard" Reading)
  *   **The Claim:** A white horse literally does not belong to the category "horse."
  *   **Explanation:** This takes the sentence at face value. It denies class inclusion. It claims that adding a modifier ("white") disqualifies the object from the base noun ("horse").
  *   **Verdict:** **Definitely False.** In standard logic and biology, a white horse is a subset of horses. Denying this breaks language and taxonomy.
  *   **Does it save your friend?** **This is the reading your friend is using.** He is claiming a veggie burger is *excluded* from the category of burgers. However, since this reading is logically false regarding horses, his argument rests on a fallacy unless he can prove "Burger" essentially requires meat (unlike "Horse" which does not require a specific color).

  ---

  ### Analysis of the Original "Horse-Buying" Example
  The original dialogue mentions: *"If you want a horse, a yellow or black horse will do. If you want a white horse, a yellow or black horse will not do."*

  *   **What this supports:** This strongly supports **Thesis 2 (Intensional Difference)** and **Thesis 5 (Pragmatic Request)**. It shows that the *conditions of satisfaction* are different.
  *   **What this does NOT support:** It does **not** support **Thesis 6 (Category Exclusion)**. The text admits that if you just want a "horse," a white horse *will* do. This implicitly admits that a white horse *is* a horse, just a more specific one.
  *   **The Trap:** The original argument uses the difference in *requirements* to argue for a difference in *names*. It does not successfully argue that the white horse ceases to be a biological horse.

  ### What People Probably Mean When They Quote It
  When your friend (or pop-philosophers) drop this line, they usually mean a mix of **Thesis 6 (Category Exclusion)** and **Thesis 2 (Intensional Difference)**, but they conflate them.

  They want the shock value of Thesis 6 ("No, it's literally not one") to win a debate, but they rely on the truth of Thesis 2 ("The definitions are different") to make sense. They are trading on the ambiguity of the word "is."

  ### Why the Veggie Burger Analogy Fails (Even for your friend)
  The "White Horse" argument works best when the modifier is accidental (color doesn't change the essence of the horse).
  The "Veggie Burger" argument works only if the modifier is essential (meat *does* change the essence of the burger).

  *   **Horse:** Color is accidental. A horse is still a horse regardless of color. Therefore, "White Horse is not a Horse" is a logical trick.
  *   **Burger:** Ingredients are often considered essential. If a burger *by definition* requires ground meat, then a veggie patty is not a burger.

  **The Verdict on your Friend:**
  If he is using the line to say "The definition of veggie burger is more specific than burger," he is making a **Thesis 2** claim, which is boring but true.
  If he is using the line to say "A veggie burger cannot be categorized as a burger," he is making a **Thesis 6** claim. This is only defensible if he can prove that "meat" is essential to "burger" in a way that "white" is not essential to "horse."

  The original "White Horse" text actually undermines him: The text admits that if you ask for a horse, a white horse suffices. By analogy, if you ask for a burger, a veggie burger should suffice—unless he argues that "burger" is like "white horse" (a specific subset) rather than "horse" (the general category). If "burger" implies meat, then "veggie burger" is an oxymoron, not a subset. That is his only real out.
