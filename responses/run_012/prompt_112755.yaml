      *   **Consensus vs. Contested (Crucial Step):**
          *   *Consensus:* Probabilism is better than non-probabilism (mostly). Accuracy matters. Evidence constrains credence.
          *   *Contested:* Whether evidence *ever* mandates imprecision. Whether decision theory *requires* a unique choice function. Whether "indeterminacy of choice" is a bug or a feature.
      *   **The Live Fault Lines:**
          *   *The Principle of Indifference:* Does lack of evidence mean equal probability (Precision) or suspension of judgment (Imprecision)?
          *   *Decision Rules:* Can we formulate a decision rule for imprecise credences that avoids paralysis and money pumps? (Elga's objection vs. Weatherson/Chandler defenses).
          *   *Accuracy Generalization:* Can accuracy arguments fully vindicate imprecision without collapsing back to precision? (Joyce's shift).
      *   **What Counts as Progress:**
