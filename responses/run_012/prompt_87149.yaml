answer: |-
  It is completely understandable that your friend's argument left you unsettled because he is half-right in a way that feels like a loophole even when it is not one. He is correct that the modern resolution of Maxwell's demon relies on treating information as a physical quantity, specifically that establishing a correlation between the demon and the gas has thermodynamic consequences, but he is wrong to suggest that this makes the erasure cost merely a bookkeeping trick we invented to save the Second Law. The cost is physical because the physical state of the memory register must be reset to allow the cycle to repeat, and that reset dissipates heat. You are not smuggling anything past yourself by suspecting that a claim of beating Carnot without an external power source is a violation of physics, but to evaluate these pitches without getting bogged down in the foundational debate, you need a procedure that treats the demon not as a philosophical puzzle but as a component in a circuit with a bill for its own operation.

  Start your due diligence by demanding a definition of the system boundary, and do not accept a diagram that leaves the controller outside the box. Ask them to draw a line around everything required to make the device work, including the sensor, the logic gate, the actuator, and the memory register, and then ask where the power enters that boundary. A sufficient answer must identify an external energy source or a thermodynamic gradient, such as a temperature difference or a chemical potential, that crosses that line. If they claim the only input is heat from a single reservoir at equilibrium, you can terminate the procedure immediately and reject the pitch, because that is a perpetual motion machine of the second kind regardless of how clever the information processing is. If they point to a battery or a laser or a temperature differential, you proceed to the second question, which concerns the memory. Ask them explicitly what happens to the information stored in the controller after it has been used to extract work. You are looking for a description of the reset mechanism. A sufficient answer admits that the memory must be cleared to return the device to its initial state for the next cycle and accounts for the energy cost of that clearing. If they claim the memory does not need to be erased because the measurement is reversible, you do not reject them yet, but you must flag this for the hand-off stage, because this is where the physics becomes subtle. For now, simply note whether the memory has a finite capacity. If the device relies on accumulating information without erasure, it is not a continuous engine but a battery that discharges as its memory fills, and you must calculate the total work output divided by the total memory capacity to see if it exceeds the Landauer limit. If they cannot quantify the memory capacity or claim it is infinite, you reject the pitch.

  Once the memory question is settled, move to the measurement process itself. Ask how the device acquires information about the particle or system state without disturbing it. A sufficient answer will describe the probe energy and admit that the measurement apparatus is coupled to a thermal bath or power source. You must not let them flatten the distinction between information and energy here. It is safe to tell your investment committee that entropy is just waste heat, but you cannot let the vendor tell you that information is free. If they claim the measurement is passive and costs zero energy, ask them to show the Hamiltonian that allows a macroscopic controller to couple to a microscopic system without back-action. If they cannot produce a paper or a simulation showing the back-action is accounted for, you reject the pitch. The next checkpoint is the reservoir. Ask if the device exploits an initial nonequilibrium state. Many demos work by starting with a particle in a specific location or a membrane under tension. A sufficient answer acknowledges this startup cost and amortizes it over the lifetime of the device. If the demonstration relies on a prepared state that is not replenished by an external driver, the device is a one-shot toy, not a harvester. If they pass all these checks, meaning they have an external power source, a defined memory reset cost, an accounted measurement energy, and a replenished reservoir, you have reached the limit of your bookkeeping. At this point, you must hand the judgment to your colleague or a hired physicist. The remaining questions are about interpretation, specifically whether the efficiency claims hold up when quantum coherence or non-Markovian dynamics are included, and that is not a risk you can underwrite with a checklist.

  There are two distinctions you must never let a vendor flatten. The first is the difference between work and heat. They may try to tell you that rectified thermal noise is work, but unless it can lift a weight or charge a capacitor against a potential without degrading the source, it is not. The second is the difference between the controller and the system. If the controller is part of the system, its entropy counts. You can safely flatten the distinction between Shannon entropy and Boltzmann entropy when explaining this to non-physicists, as they map to each other in this context, and you can simplify the erasure cost to a fixed tax per bit that must be paid to the environment. Now let us run this procedure on the three cases you mentioned to see how it holds. Consider first the device claiming to turn ambient thermal noise into usable work through a feedback controller. When you draw the boundary, you will find no external power source and no temperature gradient, only a single heat bath. The procedure terminates at the first step. The claim violates the Second Law because the feedback controller itself must be powered, and if that power comes from the same bath, the net work is negative once the controller's dissipation is included. You reject this immediately, and you do not need a physicist to tell you that a box that takes in heat and puts out work with no other change is impossible.

  Next, take the genuine single-molecule feedback-trap result of the kind your friend would cite. Here, the boundary includes the laser trap and the camera. When you ask about the reservoir, they will admit they are using a temperature difference or the energy stored in the laser trap. When you ask about the memory, they will show you the computer recording the trajectory and the energy cost of that computer. The procedure does not terminate in rejection here because the physics is sound, but it terminates in a hand-off to the investment committee with a negative recommendation. The device works, but it consumes more energy to measure and control the molecule than it extracts as work. It is a scientific validation of information thermodynamics, not a power source. Your friend is right that the demon is not a paradox, but he is wrong that this makes it an engine. It is a consumer of work that demonstrates the conversion of information to energy, not a generator.

  Finally, consider the scheme you are attached to, where the demon's memory is never erased because the measurement is made reversible. This is the hardest case, and I know you will not enjoy the answer. When you ask about the memory capacity, they must admit it is finite. If the measurement is truly reversible, no heat is generated during the acquisition of information, but the mutual information between the demon and the system increases. To run the cycle again, that correlation must be broken. If they say it is never erased, the device stops working once the memory register is saturated with correlations. If they claim it runs continuously without erasure, they are implicitly claiming the memory resets itself, which requires a coupling to a zero-temperature bath or an infinite energy source, neither of which exists. The procedure does not shut the door on reversible measurement itself, which is a valid physical concept, but it relabels what is behind it. The cost is not paid during the measurement but during the reset, or else the device is not cyclic. If they argue that the reversible measurement allows them to beat the Landauer limit, they are confusing the cost of acquisition with the cost of erasure. You must hand this to a physicist to verify if the proposed Hamiltonian actually allows for reversible coupling without hidden dissipation, but the default position must be rejection unless they can show where the entropy goes when the memory fills up. The procedure forces them to admit that either the device stops or the memory is reset, and if it is reset, the cost must be paid.

  There are limits to what this procedure can do, and you should be aware of where it will misfire. It cannot detect fraud where the vendor has hidden a battery inside the casing, and it cannot validate a device that genuinely exploits quantum coherence to bypass classical thermodynamic limits, though such devices are currently theoretical. It will also misfire on a device that is novel not because it breaks the laws of physics but because it operates in a regime where the definition of work is ambiguous, such as in biological systems where chemical potential and thermal fluctuations are intertwined. In those cases, the bookkeeping will look clean, but the hand-off to the physicist is critical. Ultimately, your friend's argument that the erasure cost is just a way of protecting a law we believe is a philosophical stance that does not help you allocate capital. The cost is real because the hardware to implement the logic is real, and the heat it generates is real. Your job is not to decide if the Second Law is fundamental but to decide if the vendor has paid their energy bill. If they have not, the device will not run, and if they have, it is not a miracle. Use the procedure to force them to show you the bill, and if they cannot, walk away.
