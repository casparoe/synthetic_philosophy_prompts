      *   *Sentence 3:* "And it inherits egalitarianism's fatal flaw, the leveling-down objection: if what matters is the gap, then a world where everyone is equally poor is better than a world where the poor are a bit better off and the rich are much better off, so prioritarianism would have us burn the rich people's money even when nobody gains by it."
