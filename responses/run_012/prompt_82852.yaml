answer: |-
  This is a classic move in distributive justice seminars: conflate the *implications* of a view with its *justification* to score a quick knock-out. Your friend's summary is rhetorically effective but technically sloppy. It relies on a specific ambiguity in how "weighting" is interpreted.

  Since you're in the weeds of this, I'll skip the Parfit 101 and go straight to the technical distinctions. Here is the sentence-by-sentence breakdown, followed by the assessment of whether there's a residual problem.

  ### Part 1: Sentence-by-Sentence Breakdown

  **1. "Prioritarianism is the view that we give extra weight to the interests of the worse off — the worse off always come first, no matter how big the gains to anyone else."**
  *   **Verdict:** **Backwards (with a grain of truth).**
  *   **Analysis:** The first clause is standard weighted prioritarianism (concave transformation of welfare). The second clause ("always come first, no matter how big the gains") describes **Leximin**, not standard Prioritarianism. Standard Prioritarianism is aggregative; it allows the better-off to win if their utility gain is sufficiently large to outweigh the weighted loss of the worse-off. It does not impose a lexical threshold.
  *   **Confidence:** **High.** This is a definitional distinction. If she means *strict* prioritarianism with an infinite weighting function, she needs to say that. Standard views (Parfit, Arneson) allow trade-offs.

  **2. "So it's egalitarianism with a new name; prioritarians just won't say the word equality out loud because it's unfashionable."**
  *   **Verdict:** **Backwards.**
  *   **Analysis:** This misses Parfit's central metaphysical distinction. Telic Egalitarianism is **relational** (A is bad because A < B). Prioritarianism is **non-relational** (A is bad because A is low, regardless of B). They can converge in two-person, fixed-population cases, but they diverge in Pareto cases and population ethics. Calling it "egalitarianism with a new name" ignores the fact that Prioritarianism is explicitly designed to avoid the *conceptual* commitment to equality as a value.
  *   **Confidence:** **High.** This is the core of the Parfit/Temkin debate. If they were extensionally equivalent in all possible worlds, the distinction would be useless, but they aren't (e.g., the "Pareto Case" where the worse-off gain and the better-off stay still; Egalitarianism is indifferent or negative depending on the gap, Prioritarianism is positive).

  **3. "And it inherits egalitarianism's fatal flaw, the leveling-down objection: if what matters is the gap, then a world where everyone is equally poor is better than a world where the poor are a bit better off and the rich are much better off, so prioritarianism would have us burn the rich people's money even when nobody gains by it."**
  *   **Verdict:** **Backwards.**
  *   **Analysis:** This is the critical error. The Leveling-Down Objection (LDO) applies *only* to views that assign intrinsic value to equality (the gap). Because Prioritarianism values absolute weighted welfare, it is **Pareto-inclusive**. It *never* recommends leveling down. Burning the rich person's money lowers the aggregate weighted sum (since the rich person's utility drops and no one else's rises). Prioritarianism implies this is strictly worse. Your friend is attributing a relational property to a non-relational view.
  *   **Confidence:** **Very High.** This is the standard defense of Prioritarianism against LDO. If she claims Prioritarianism implies leveling down, she is misrepresenting the axiology.

  **4. "Nobody believes that, so the view is dead — and the fact that prioritarians have been chewing on this objection for thirty years is basically an admission."**
  *   **Verdict:** **Unfair Simplification / Backwards Conclusion.**
  *   **Analysis:** Since the premise (that Prioritarianism implies leveling down) is false, the conclusion doesn't follow. However, it is true that prioritarians have been "chewing" on objections for thirty years. But they aren't chewing on LDO; they are chewing on the **Ex Ante/Ex Post dilemma** (Otsuka, Voorhoeve, Adler) and the **Separateness of Persons** objection. She is right that the view is under siege, but she is aiming the wrong missile.
  *   **Confidence:** **Medium-High.** I'm confident the conclusion is unsupported by her premise, but "dead" is a sociological claim about the field, not a logical one. Prioritarianism is still a live contender, though battered.

  ---

  ### Part 2: Is there a real problem in this neighborhood?

  You asked whether the Priority View has a *real* problem in this neighborhood once the summary is corrected. You don't want to just walk away saying "She's wrong." You want to know if there's a vulnerability she's gesturing at, even if she missed the mark technically.

  **The Short Answer:** No, the Leveling-Down Objection specifically does not stick. But yes, there is a "neighborhood" problem that is arguably just as damaging, which she might be garbling.

  **The Real Problem: The Ex Ante / Ex Post Dilemma**
  If you want to press her back, you concede LDO doesn't apply but pivot to the **Voorhoeve/Otsuka objection**. This is the actual "fatal flaw" currently discussed in the literature.
  *   **The Issue:** In cases of risk (prospective prioritarianism), the view struggles to reconcile *ex ante* fairness (everyone has an equal chance) with *ex post* priority (benefiting the person who ends up worse off).
  *   **Why it matters:** Voorhoeve argues that to avoid counterintuitive results in risky cases, Prioritarianism must either collapse into Utilitarianism (ignoring the priority weighting) or collapse into Egalitarianism (caring about the relational gap). If it collapses into Egalitarianism, *then* it becomes vulnerable to LDO.
  *   **The Leverage:** Your friend is essentially arguing that Prioritarianism is unstable. She claims it *is* Egalitarianism. The more sophisticated version of this claim (Voorhoeve) is that Prioritarianism *cannot maintain its distinctness* in risky cases without implying absurdities.

  **The "Complaints" Model**
  There is also the Temkin-style objection: If you ask *why* we give priority to the worse off, the answer usually appeals to fairness or equality. If the justification relies on equality, the view is derivative. If it doesn't (it's just "the moral value of benefits declines"), it risks looking arbitrary. This is the "non-relational" intuition pump.

  **My Assessment of the View's Viability**
  Prioritarianism is not "dead," but it is no longer the default "fix" for Egalitarianism it was in the 90s. The consensus has shifted toward thinking it handles the LDO successfully but fails on risk or population ethics (the Repugnant Conclusion hits Prioritarianism harder than Utilitarianism because gains to the miserable weigh so heavily).

  ---

  ### Confidence and Hedging

  **Confidence Levels:**
  *   **On the LDO technicality (Sentence 3):** **95% Confidence.** It is a matter of record in the literature (Parfit 1997, Holtug 2010) that Prioritarianism is Pareto-inclusive. If she insists otherwise, she is defining the term differently from the standard literature.
  *   **On the Egalitarianism Conflation (Sentence 2):** **90% Confidence.** While extensionally similar in many cases, the intensional difference is the whole point of the view.
  *   **On the "View is Dead" Claim (Sentence 4):** **40% Confidence.** This is speculative. Prioritarianism is still widely taught and defended (e.g., by Adler), though it has lost some shine to pluralist views.
  *   **On the Ex Ante/Ex Post Objection being "Fatal":** **60% Confidence.** This is the live debate. Some (Adler) think it can be solved; others (Voorhoeve) think it forces a collapse. I am less sure here because the literature is still active.

  **Point of Least Certainty:**
  I am least sure about the **boundary conditions of the Voorhoeve collapse argument**. Specifically, whether a sophisticated Prioritarian can accommodate the "complaints" model in risky cases without admitting a relational value of equality.
  *   *Why I'm hedging:* Voorhoeve's argument is powerful, but Adler has responses involving "ex ante prioritarianism" vs "ex post prioritarianism." There isn't a settled consensus on whether Prioritarianism *must* collapse into Egalitarianism under risk, or if it can occupy a stable middle ground. If your friend is hinting at *this* instability (rather than LDO), she has a stronger point, but her current formulation is too crude to capture it.

  ### Strategic Advice for the Argument

  Don't fight her on the definition of Prioritarianism alone; you'll look pedantic. Fight her on the **charitable interpretation**.

  **Say this:**
  "You're right that Prioritarianism is under fire, but you're attacking the LDO vulnerability of Telic Egalitarianism, not the Priority View. The Priority View is explicitly non-relational, so it doesn't level down. However, if your point is that Prioritarianism is *unstable*—that once you unpack *why* we weight the worse off, we either slide into Utilitarianism or collapse back into Egalitarianism (à la Voorhoeve)—then you have a live objection. But claiming it inherits the LDO directly is technically incorrect. Do you want to argue the technical definition, or do you want to argue the instability thesis?"

  This concedes her "sharpness" (acknowledging the view has problems) while correcting the technical error (LDO doesn't apply) and pivoting to the actual debate (Instability/Risk). It moves the goalposts to where you might actually have traction.
