      *   *Missing:* The distinction between *ontological* truthlikeness (does the relation exist?) and *epistemic* verisimilitude (can we estimate it?). Fen attacks the latter to deny the former. Dario defends the former using the latter's intuition. Also, the "privileged language" hypothesis (natural kinds).

