      *   *Problem:* 10 mins for debrief is too short for the required depth. I need to compress the activity stages.
      *   *Compression:* Stage 1 & 2 can be faster. Stage 3 & 4 are the heavy hitters. Stage 5 can be a written prompt done during the rating phase.
      *   *New Timeline:*
