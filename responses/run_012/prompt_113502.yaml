      *   *Risk:* Money Pump refusal. *Fix:* Frame it as "Opportunity to Upgrade." Keep token cost low (1 token).
      *   *Risk:* Politeness. *Fix:* Emphasize this is a simulation of logic, not personal judgment.
      *   *Risk:* Personal discomfort. *Fix:* Ensure items are generic privileges. Anonymize data during debrief (aggregate trends, not "John chose inconsistently").

  6.  **Developing the Debrief:**

