  1.  **Analyze the Request:**

      *   **Context:** 90-minute advanced undergraduate seminar in philosophy of economics/rational choice. 12-16 students.
      *   **Goal:** Make students *feel* the idea that preferences are *constituted* by choice (Revealed Preference Theory) rather than measured by it, and feel the *cost* of that identification.
      *   **Constraint 1 (Secrecy):** No names/terminology until the debrief. No upfront lecturing.
      *   **Constraint 2 (Roles):** "Choosers" (only choose, no explaining/ranking) vs. "Analysts" (observe, build ordering/index, predict).
      *   **Constraint 3 (Structure):** Five escalating stages (Rule changes, not speeches).
          1.  Ordinary pairwise choices (trivial items).
          2.  Context dependence (decoy effect/choice set composition changes).
          3.  Numeric probe (Willingness to Pay/ Accept) vs. Choice ordering conflict.
          4.  Money Pump/Trade Cycle (pay token per trade, end up worse off).
          5.  Paternalism/Planner role (block access based on utility).
      *   **Constraint 4 (Post-Choice):** Private satisfaction rating (dial) that may disagree with choice/price.
      *   **Constraint 5 (Debrief):** Map activity to theory (constitution vs. evidence, ordering vs. measurement, planner incoherence, cardinal smuggling). Predict failures (refusal to pump, rule-breaking, politeness) and how to handle them. Acknowledge limitations. Name the theory at the end.
      *   **Constraint 6 (Logistics):** No real money, trivial tokens, low-tech (whiteboard, cards), no pre-reading.
      *   **Constraint 7 (Ethics/Comfort):** No public diagnosis of tastes. Discomfort must be conceptual, not personal.

  2.  **Deconstruct the Theory:**

      *   The core idea is **Revealed Preference Theory** (Samuelson, Houthakker, etc.).
      *   The tension is between *mentalistic* preferences (what I feel I want) and *behaviorist* preferences (what I actually pick).
      *   Stage 2 targets the **Independence of Irrelevant Alternatives (IIA)** violation.
      *   Stage 3 targets **Ordinal vs. Cardinal** utility.
      *   Stage 4 targets **Transitivity** and the **Money Pump** argument.
      *   Stage 5 targets **Welfare Economics** and the impossibility of criticizing preferences if they are defined by choices.

  3.  **Drafting the Activity Design:**

      *   *Materials:* Index cards (items), tokens (poker chips or paper slips), tally sheets for analysts, "dial" sheets (1-10 scale) for choosers.
      *   *Items:* Need to be trivial but distinct. Examples: "5 min break," "Choose seat tomorrow," "Homework pass (1 question)," "Chocolate bar," "Extra credit point." Let's stick to classroom privileges to avoid food allergies/cost.
          *   Item A: 5-minute extension on next assignment.
          *   Item B: Choice of seat for next class.
          *   Item C: 5-minute break *now*.
          *   Item D: A piece of high-quality chocolate (if allowed) OR "Exempt from one attendance check." Let's go with "Exempt from one attendance check."
      *   *Tokens:* Paper slips. Value: At the end, most tokens = small privilege (e.g., leave 2 mins early). This ensures stakes are non-zero but trivial.
      *   *Roles:* Split 16 students into 8 Choosers, 8 Analysts. Pairs sit facing each other.

      *   *Stage 1 (Baseline):* Pairwise choices. A vs B, B vs C, A vs C. Analysts record $A \succ B$, etc.
      *   *Stage 2 (Context):* Introduce Item D (Decoy). Offer A vs B again, but D is visible on the table (unavailable). Or offer A vs B vs D. The prompt says "composition of choice set changes while same pair remains available... third unattractive option joins." This is the *Attraction Effect*.
          *   *Correction:* To make analysts revise, the choice must *flip*. If I choose A over B, then D is added, and I choose B over A. This violates IIA.
          *   *Implementation:* Round 1: A vs B. Round 2: A vs B vs D (where D is similar to A but worse). If the chooser flips to B, the Analyst's model breaks.
      *   *Stage 3 (Prices):* Choosers assign token prices to keep items. Analysts compare Price Ordering vs. Choice Ordering.
      *   *Stage 4 (Money Pump):* A loop. A $\succ$ B, B $\succ$ C, C $\succ$ A (intransitive). Or simply trading around a circle where they pay a fee.
          *   *Risk:* Students might spot the pump and refuse.
          *   *Mitigation:* Make the trades seem like "upgrades."
      *   *Stage 5 (Planner):* Analysts recommend banning an item to "help" the chooser.
      *   *Post-Activity:* Private satisfaction survey.

  4.  **Refining the Mechanics & Timeline (90 mins):**

      *   Intro/Setup (10 min)
