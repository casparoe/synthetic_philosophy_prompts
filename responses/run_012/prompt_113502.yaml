      *   *Adjustment:* Merge Setup into Stage 1. Tighten transitions. Debrief needs to be robust (25 min). Cut Stage 5 slightly or make it part of the debrief setup. Let's keep Stage 5 as the climax of the activity.
      *   *Revised Timeline:*
          *   0-5: Setup & Roles.
          *   5-20: Stage 1 (Pairwise).
          *   20-35: Stage 2 (Context/Decoy).
          *   35-50: Stage 3 (Pricing).
          *   50-65: Stage 4 (Cycle).
          *   65-75: Stage 5 (Planner).
          *   75-80: Private Ratings.
