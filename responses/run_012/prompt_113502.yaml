answer: |-
  # Lesson Plan: The Constitution of Preference

  **Course:** Advanced Undergraduate Seminar in Philosophy of Economics / Rational Choice
  **Duration:** 90 Minutes
  **Class Size:** 12–16 Students
  **Topic:** Revealed Preference Theory (kept hidden until debrief)

  ## I. Learning Objectives
  By the end of this session, students will have experientially encountered:
  1.  The behavioral definition of preference (choice *constitutes* preference).
  2.  The fragility of ordinal indices when choice sets change (context dependence).
  3.  The conflict between ordinal choice and cardinal valuation (pricing).
  4.  The vulnerability of intransitive preferences to exploitation (money pump).
  5.  The normative paralysis of a planner who accepts choice as the sole metric of welfare.

  ## II. Materials & Preparation

  **Room Setup:**
  *   Arrange desks in 6 to 8 pairs.
  *   In each pair, seats face each other.
  *   Whiteboard visible to all.

  **Physical Materials:**
  1.  **Role Cards (16 total):** 8 marked "CHOOSER", 8 marked "ANALYST".
  2.  **Item Vouchers (Printed on cardstock, 4 types):**
      *   *Item A:* "Leave class 5 minutes early today."
      *   *Item B:* "Select the music for the first 10 mins of next class."
      *   *Item C:* "Immunity from cold-calling for next class."
      *   *Item D:* "Leave class 2 minutes early today." (The Decoy).
  3.  **Tokens:** 100 small paper slips or poker chips.
  4.  **Analyst Sheets:** One per Analyst. Columns for: *Observed Choice*, *Inferred Ordering*, *Prediction*, *Score*.
  5.  **Chooser Record:** One per Chooser. Simple checklist to mark what they picked.
  6.  **Private Dial Sheet:** One per Chooser. A visual slider (1–10) for "Satisfaction" for each item.
  7.  **Planner Memo:** One per Analyst (distributed Stage 5).

  **Token Economy:**
  *   Tokens have trivial value.
  *   **Redemption:** At the very end of class, the student with the *most* tokens gets to decide the order of breaks for the next session. Everyone else gets nothing. (This creates competition without financial risk).
  *   **Stakes:** Analysts gain/lose tokens based on prediction accuracy. Choosers pay tokens during the Trade Cycle.

  ## III. Role Assignment & Rules (0:00–0:05)

  **Facilitator Script:**
  "Welcome. Today is a simulation. I will not lecture until the last twenty minutes. You are divided into pairs. One of you is a **Chooser**, one is an **Analyst**. Do not switch roles.

  **Rule 1 (Choosers):** You will be offered items. You must pick one. You may **never** explain why. You may **never** say 'I prefer X.' You may only point or hand over the card. If you speak about your reasons, your team loses 5 tokens.

  **Rule 2 (Analysts):** You watch. You may **never** speak to your Chooser. You may **never** ask what they like. Your job is to build a mathematical model of their mind based *only* on what they take. You will write down an ordering (1st, 2nd, 3rd) and make predictions. If your prediction matches their choice, you gain tokens. If not, you lose tokens.

  **Rule 3 (Silence):** No talking between pairs. I am the only voice allowed during stages.

  Pick your role cards now. Sit. Silence."

  ## IV. Minute-by-Minute Run Sheet

  ### Stage 1: The Baseline (0:05–0:20)
  **Goal:** Establish the link between Choice and Ordering.
  **Items:** A, B, C.
  **Mechanic:** Pairwise choices.

  1.  **Round 1:** Facilitator announces: "Choosers, choose between A and B." (Wait 30 seconds). "Analysts, record the choice. Predict what they will choose between B and C." (Analysts write prediction).
  2.  **Round 2:** Facilitator announces: "Choosers, choose between B and C." (Wait 30 seconds). "Analysts, record. Predict A vs C."
  3.  **Round 3:** Facilitator announces: "Choosers, choose between A and C."
  4.  **Scoring:** Facilitator reveals actual choices. Analysts get +2 tokens for correct predictions, -2 for incorrect.
  5.  **Transition:** "Keep your sheets. Do not discuss."

  ### Stage 2: The Context Shift (0:20–0:35)
  **Goal:** Violate Independence of Irrelevant Alternatives (IIA).
  **Items:** A, B, and D (Decoy).
  **Mechanic:** Change the menu, observe flips.

  1.  **Setup:** Facilitator places Item D on every table. "Item D is now on the table. It is available."
  2.  **Round 1:** "Choosers, choose between A and B." (D is present but not an option, just visible). *Note: This tests mere presence.*
      *   *Alternative:* "Choosers, choose between A, B, and D."
      *   *Better for the lesson:* "Choosers, choose between A and B." (D is visible). Then "Choosers, choose between A and B." (D is removed).
      *   *Selected Mechanic:* To ensure the flip possibility, use **Asymmetric Dominance**.
      *   **Round 1:** Choose between A and B. (D is hidden).
      *   **Round 2:** Choose between A, B, and D. (D is worse than A in every way).
  3.  **Action:** Analysts must update their Ordering. If a Chooser picked B in Round 1, but A in Round 2 (because D makes A look good), the Analyst's previous index is now "false."
  4.  **Scoring:** Analysts predict a "Test Choice" (A vs B) *after* seeing the Round 2 behavior.
  5.  **Transition:** "Analysts, if your ordering changed, cross it out. Write the new one. This costs you 1 token (administrative fee)."

  ### Stage 3: The Price Probe (0:35–0:50)
  **Goal:** Conflict between Ordinal Choice and Cardinal Value.
  **Mechanic:** Willingness to Pay (WTP).

  1.  **Instruction:** "Choosers, you now own all three items (A, B, C) hypothetically. Name a price in tokens you would accept to *sell* each one back to me. Write it privately. Do not show the Analyst."
  2.  **Action:** Choosers write prices (e.g., A=10, B=5, C=8).
  3.  **Reveal:** Choosers show prices to Analysts.
  4.  **Conflict:** Analysts compare the Price Ordering (A > C > B) with the Choice Ordering from Stage 1 (e.g., B > C > A).
  5.  **Task:** Analysts must write a single "Utility Index" that accounts for *both* the choices and the prices.
  6.  **Transition:** "Analysts, if the Price Ordering contradicts the Choice Ordering, you cannot reconcile them with a simple rank. Note this tension."

  ### Stage 4: The Trade Cycle (0:50–1:05)
  **Goal:** The Money Pump (Intransitivity).
  **Mechanic:** Sequential trades with a cost.

  1.  **Setup:** Each Chooser is given Item A.
  2.  **Trade 1:** Facilitator asks: "Would you trade Item A for Item B? Cost: 1 Token."
      *   If Chooser says yes (hands over A + 1 token), they get B.
      *   If no, keep A.
  3.  **Trade 2:** "Would you trade Item B for Item C? Cost: 1 Token."
  4.  **Trade 3:** "Would you trade Item C for Item A? Cost: 1 Token."
  5.  **Outcome:** A Chooser who accepts all three ends with Item A (same as start) but is down 3 tokens.
  6.  **Analyst Task:** Predict if your Chooser will complete the cycle. Stake 5 tokens on your prediction.
  7.  **Transition:** "Choosers, count your tokens. Analysts, note the net position."

  ### Stage 5: The Planner's Dilemma (1:05–1:15)
  **Goal:** Normative Incoherence.
  **Mechanic:** Paternalistic Recommendation.

  1.  **Distribution:** Hand out **Planner Memos** to Analysts.
  2.  **Prompt:** "You are a Benevolent Planner. Your goal is to maximize your Chooser's Utility. Based *only* on the data you have collected (Choices, Prices, Trades), recommend whether I should **ban Item D** from the menu. Write your justification."
  3.  **Constraint:** You cannot use words like 'mistake,' 'confusion,' or 'better off.' You can only use 'Utility,' 'Choice,' and 'Index.'
  4.  **Action:** Analysts write for 5 minutes.
  5.  **Collection:** Collect the memos. Do not read them yet.

  ### Private Rating (1:15–1:20)
  **Goal:** Internal Discomfort.
  **Mechanic:** Satisfaction Dial.

  1.  **Distribution:** Hand out **Private Dial Sheets** to Choosers.
  2.  **Instruction:** "Rate your satisfaction with Item A, B, and C on a scale of 1-10. This is private. Do not show anyone. Do not worry about what you chose. Just how good did it *feel*?"
  3.  **Action:** Students fill it out. Collect sheets.
  4.  **Silence:** "Put pens down. Look at the board."

  ## V. The Debrief (1:20–1:30)

  **Facilitator Note:** This is the only time you lecture. Do not resolve the tension too quickly.

  **1. The Revelation (5 Minutes)**
  *   **Ask:** "Analysts, who found it impossible to build a consistent index in Stage 2? Who found the Prices contradicted the Choices in Stage 3?"
  *   **Ask:** "Choosers, look at your Private Dial. Did it match what you chose? Did it match what you sold it for?"
  *   **Reveal:** "The idea you just wrestled with is **Revealed Preference Theory**. It was developed by Paul Samuelson in the 1930s."
  *   **Definition:** "The core axiom is: **Preference is not a mental state that causes choice. Preference *is* the choice.**"

  **2. Mapping the Stages (5 Minutes)**
  *   **Stage 1 & 2 (Constitution vs. Evidence):** "In Stage 2, when the menu changed and you flipped your choice, the Analyst's model broke. If preferences are mental states, you just changed your mind. If preferences *are* choices, you didn't change your mind; you revealed a *different* preference because the context changed. The theory says the second choice is the 'true' one, rendering the first one noise. How did that feel, Analysts? Did you feel like you were measuring them, or defining them?"
  *   **Stage 3 (Ordinal vs. Cardinal):** "The Price Probe smuggled in **Cardinal Utility**. Revealed preference is strictly **Ordinal** (A > B). Prices imply magnitude (A is twice as good as B). When they conflicted, which data did you trust? The theory says ignore the prices. Only choice matters. Why is that comforting? Why is it terrifying?"
  *   **Stage 4 (The Money Pump):** "If you cycled, you paid tokens to end up where you started. The theory says this is 'irrational' because it violates **Transitivity**. But if preference is defined by choice, and you chose the trade, then the trade *increased your utility* at that moment. So you voluntarily increased your utility three times and ended up poorer. Is that a contradiction? Or is 'Utility' just a word for 'whatever was chosen'?"
  *   **Stage 5 (The Planner):** "Most of you struggled to write the Planner Memo. Why? Because if Choice = Utility, then banning an item reduces the choice set, which *by definition* reduces Utility. You cannot say 'I banned D to help them' without saying 'They chose wrong.' But the theory forbids saying 'They chose wrong.' You were asked to be paternalistic using a theory that forbids paternalism."

  **3. Troubleshooting & Failure Modes (3 Minutes)**
  *   **If Choosers refused the Cycle:** "Some of you saw the trap and refused. This is **Sophistication**. The theory assumes you don't see the loop. In reality, learning happens. The model is static; you are dynamic."
  *   **If Analysts asked Questions:** "Some Analysts broke the silence. This shows how unnatural it is to treat humans as black boxes. We want to know *why*. The theory says the *why* is irrelevant. Only the *what* exists."
  *   **If Politeness Prevailed:** "If Choosers traded to be nice to the Facilitator, that is a **Social Preference**. The model treats it as a preference for 'being nice.' It absorbs everything. That is its strength and its weakness. It explains everything, so it predicts nothing."

  **4. Limitations & Naming (2 Minutes)**
  *   **What the Activity Missed:** "You felt the logic, but you didn't feel the **Welfare**. In the real world, banning cigarettes might lower 'revealed preference' (smokers choose to smoke) but raise 'well-being' (health). This theory cannot distinguish between the two without smuggling in external values."
  *   **Final Terminology:**
      *   **Revealed Preference:** Preference is defined by action.
      *   **Ordinal Utility:** Ranking without magnitude.
      *   **Transitivity:** If A>B and B>C, then A>C.
      *   **Money Pump:** Exploiting intransitivity.
      *   **Welfare Economics:** The study of how to use these metrics for policy.
  *   **Closing:** "Keep your Private Dial Sheets. Look at them tonight. Ask yourself: Is your satisfaction real, or is it just a story you tell about your choices?"

  ## VI. Troubleshooting Guide for the Facilitator

  | Potential Failure | Why it happens | How to handle it (without breaking the spell) |
  | :--- | :--- | :--- |
  | **Choosers explain themselves** ("I picked A because...") | Natural human impulse to justify. | **Intervention:** "Protocol Violation. Team loses 2 tokens." Do not elaborate. Enforce the silence strictly. This reinforces the "Black Box" nature of the theory. |
  | **Analysts ask Choosers** ("Do you like chocolate?") | Desire for better data. | **Intervention:** "Analyst speaking to subject. Prediction void for this round." This highlights the impossibility of accessing mental states in this framework. |
  | **No one cycles in Stage 4** | Students spot the Money Pump. | **Debrief Point:** "You learned. The model assumes static preferences. You demonstrated adaptive rationality. The model would call your refusal 'consistent,' but it couldn't predict the learning." |
  | **Everyone is consistent** | Items aren't tempting enough. | **Debrief Point:** "The model works best when we fail. Since you succeeded, imagine a scenario where you didn't. The *threat* of the pump is what forces rationality." |
  | **Students feel stupid** | Personalizing the inconsistency. | **Reframing:** "This is not about intelligence. It is about the map (theory) vs. the territory (you). The map is too small. You are not broken; the index is." |
  | **Stage 5 Memos are empty** | Students realize the paradox. | **Validation:** "If you couldn't write it, you understood the lesson perfectly. The incoherence *is* the finding." |

  ## VII. Limitations (For Instructor Eyes Only)

  **What this activity cannot reproduce:**
  1.  **Market Consequences:** In the real economy, inconsistent choosers go bankrupt. In class, the token loss is trivial. You must verbally underscore that in the real world, the Money Pump leads to ruin, which is why the theory assumes it away.
  2.  **Long-term Welfare:** The activity is instantaneous. It cannot capture addiction or habit formation where current choice contradicts long-term interest. You must supply this in the debrief.
  3.  **Social Norms:** Students know they are in a seminar. Their choices are performative. Remind them that Revealed Preference assumes choices are made in isolation of social signaling.

  **Instructor Note on Tone:**
  The goal is *aporia* (puzzlement), not *episteme* (certainty). Do not let the debrief become a clean summary where Revealed Preference "wins." The point is that the theory is powerful *because* it is restrictive, and that restriction leaves out the human experience of satisfaction (the Private Dial). Leave them with the tension.
