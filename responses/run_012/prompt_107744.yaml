      *   The Exercise (Step-by-Step).
      *   The Pivot (The Contradiction).
      *   The Debrief (Mapping to Sen).
      *   Troubleshooting (Predictable Failures).

  *(Self-Correction on the "Observers"):* With 16 students, 6 pairs leaves 4 observers. That works. The observers act as "Constitutional Court" auditors.

  *(Self-Correction on Preferences):* I must ensure the preferences are *meddlesome*.
  Person A: $n > a > b$. (Prefers no one reads, but if someone must, prefers themselves to protect morals).
  Person B: $a > b > n$. (Prefers A reads, but if someone must, prefers themselves, hates no one reading).
  This is the standard Sen example. I will adapt the "Book" to "Playlist" or "Poster" to feel more modern. Let's stick to the **"Book"** but call it "The Syllabus Choice." It's academic.
