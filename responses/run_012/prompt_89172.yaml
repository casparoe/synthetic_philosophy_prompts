      *   Wait, the user says: "my suspicion is that the third [alibi] is not a causal category at all but a rhetorical one... counter-suspicion is that this is too clean."
      *   My advice: Treat "alibi" as a historical object of study (did they use the volcano as an excuse?) rather than a modern explanatory category. The condition should require them to disentangle *physical necessity* from *political contingency*.

  6.  **Refining the "What Would Change Your Mind" Section:**
