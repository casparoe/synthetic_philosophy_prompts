          2.  *Historians/Archaeologist:* Archives/fieldwork on grain policy, taxation, land tenure, relief institutions. Argues discontinuities are due to institutional fragility, not eruption. (Critique: Vivid description with no independent variable).
      *   **Constraints:** Cannot fund both at full scale. Cannot honestly fund either *as written*.
      *   **Philosophical Angle:** User has been reading philosophy of causation/history. Needs to address the distinction between *trigger*, *amplifier*, and *alibi*.
      *   **Specific Requirements:**
          *   Recommendation (Fund one, Fund joint/conditions, Decline both).
