answer: |-
  A regional warehouse's three-year inventory log for a specific appliance shows demand spikes that align perfectly with two distinct rules: Pattern Alpha states spikes occur on every 15th of the month (highly compressible, simple arithmetic), while Pattern Beta states spikes occur only when the 15th coincides with a post-payroll weekend (less compressible, conjunctive condition). Both rules fit the historical ledger without error, yet when the fourth year begins, Alpha fails immediately while Beta continues to track demand accurately. This case is engineered to order: the historical coincidence was constructed to ensure equal in-sample fit, isolating temporal projection as the sole discriminator between compressibility and robustness, rather than discovered from natural data where such perfect overlap is statistically vanishing.

  Under the **Physical Stance**, neither pattern is fundamental, but Beta is privileged as it supervenes on causal flows (money transfer, calendar time) whereas Alpha is a numerical accident; the **Design Stance** selects Beta because it aligns with the system's function of servicing customers who purchase when liquid; the **Intentional Stance** likewise chooses Beta, as it renders the agents rational (buying when paid) rather than superstitious (buying on dates). The single feature doing the work is **access to fresh data (temporal projection)**. If you withhold the fresh data, both patterns are equally "real" relative to the archive, possessing identical compressibility and fit; if Alpha also projected, both would be real, perhaps indicating overlapping causal mechanisms. A realist about real patterns defends Alpha against the charge of unreality by arguing that pattern reality is indexed to the observer's informational state: Alpha was a real pattern *at the time* because it offered genuine predictive leverage and compression within the context of the available data, and its subsequent failure indicates a shift in the environment rather than proving the pattern was never real.
