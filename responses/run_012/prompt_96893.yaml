answer: |-
  ### The Integrity Objection: Williams and the "One Thought Too Many"

  The integrity objection, most famously articulated by Bernard Williams in *Utilitarianism: For and Against* (1973) and the essay "Persons, Character and Morality" (1981), challenges the utilitarian requirement of impartiality. It argues that utilitarianism alienates agents from their deepest personal commitments, thereby attacking their integrity.

  To understand the objection, one must distinguish between a practical complaint about decision-making and a philosophical complaint about moral justification.

  #### 1. The "One Thought Too Many"
  Williams asks us to imagine a man whose wife is drowning. He can save either his wife or a stranger, but not both. A utilitarian agent, strictly following the impartial calculus, might save the wife if he determines that doing so produces slightly more overall utility (e.g., less grief for him, greater net happiness).

  Williams argues that if the husband saves his wife *because* he has calculated that this maximizes utility, he has had "one thought too many." The objection is not that the calculation is psychologically difficult, time-consuming, or prone to error. It is not a complaint about the *burden* of thinking. Rather, it is a claim about the **kind of reason** the theory validates.

  In the landscape of human relationships, the appropriate reason for saving one's spouse is simply: "She is my wife." This reason is grounded in the relationship itself. By inserting the utilitarian calculus as the mediating justification, the agent treats the relationship as instrumental. The wife is saved not because of who she is to him, but because her survival serves the impersonal good. Williams argues this creates **alienation**: the agent is severed from the very projects and attachments that give his life meaning and constitute his identity. Integrity, for Williams, is the ability to act from one's "ground projects"—those commitments so deeply held that to abandon them would be to cease to be oneself. Utilitarianism demands that these projects be abandoned whenever the impartial calculus requires it, rendering the agent a neutral channel for utility rather than a person with a distinct moral identity.

  #### 2. The Self-Effacing Reply and Its Limits
  A common utilitarian response, associated with R.M. Hare and J.J.C. Smart, is that utilitarianism can be **self-effacing** (or indirect). This view holds that the *criterion* of rightness is utility maximization, but the *decision procedure* for agents need not be. Utilitarianism might dictate that people should cultivate dispositions to love their families partiality, because a world where people do so produces better outcomes than a world of constant calculation.

  Williams finds this reply unsatisfactory for two structural reasons:

  1.  **The Justificatory Gap:** Even if the agent is told not to calculate, the *justification* for his action remains external. If asked, "Why did you save her?" the ultimate truth (on this view) is "Because the universe is better this way," not "Because I love her." The self-effacing strategy preserves the utility metric as the sovereign truth, rendering the agent's personal love a useful fiction. This maintains the alienation Williams identifies; the agent's deepest motivations are still subordinate to an external standard.
  2.  **Government House Utilitarianism:** If the theory requires agents to believe non-utilitarian thoughts (like "I must save her because she is my wife") while the theory itself knows this is only instrumentally true, it creates a split between the moral truth and the agent's consciousness. Williams suggests this is intellectually dishonest and undermines the agent's integrity by making them a vehicle for a truth they are not permitted to fully acknowledge in their deliberation.

  #### 3. Probing the Scope: Intimacy vs. Strangers
  To test the scope of the integrity objection, consider a contrast case: An agent must allocate a scarce medical resource (e.g., a kidney) between two strangers to whom they have no special relationship.

  *   **The Stranger Case:** Here, most philosophers agree the integrity objection loses significant force. In the absence of special obligations or "ground projects" involving the parties, impartiality seems not only permissible but required. If the agent favored one stranger over the other based on a whim or a trivial preference, we would not praise their integrity; we would question their fairness.
  *   **The Role of Commitments:** This contrast suggests the integrity objection depends essentially on the existence of **special obligations** or constitutive commitments. Williams' critique is not that impartiality is always wrong, but that it is wrong when it demands the abrogation of the commitments that define the agent. In the stranger case, the agent has no prior commitment that is being violated by the calculus.
  *   **Contested Extension:** However, the scope is not entirely settled. Some critics argue that integrity can be violated even in impartial contexts if the utilitarian demand conflicts with an agent's deeply held moral convictions (e.g., a pacifist forced to calculate that killing one saves five). While Williams focuses on personal projects (like marriage), some interpreters argue the objection extends to professional or moral identities. Nevertheless, the consensus in the literature is that the objection bites hardest where personal intimacy is concerned, as this is where the conflict between "impersonal good" and "personal reason" is starkest.

  #### 4. Settled vs. Contested in the Literature
  When analyzing the integrity objection, it is vital to separate the established dialectic from ongoing philosophical disputes.

  **Settled Interpretations:**
  *   **The Nature of the Charge:** It is settled that Williams' objection is conceptual, not psychological. He is not claiming utilitarianism is too hard to practice; he is claiming it misunderstands the source of moral motivation in personal contexts.
  *   **Alienation:** It is widely accepted that Williams identifies a genuine tension between consequentialist impartiality and the partiality required by personal relationships.
  *   **The "One Thought":** It is settled that this phrase refers to the intrusion of an impersonal justification into a sphere where a personal justification is constitutive of the value at stake.

  **Genuinely Contested Issues:**
  *   **The Success of Indirect Utilitarianism:** It is highly contested whether "sophisticated consequentialism" (e.g., Peter Railton) successfully answers Williams. Railton argues an agent can non-alienatedly care for their wife *and* believe this is justified consequentially. Williamsians counter that this still makes the care contingent on the outcome, whereas true integrity requires the care to be non-contingent. There is no consensus on who wins this exchange.
  *   **The Moral Status of Integrity:** Utilitarians often contest whether integrity is a *moral* value. They argue that if integrity prevents the maximization of good (e.g., saving the wife when the stranger would contribute more to humanity), then integrity is merely a personal preference that should be overridden. Williams assumes integrity is a central ethical value; utilitarians often deny this premise.
  *   **Scope of Ground Projects:** It is contested how broad "ground projects" can be. If an agent's ground project is "maximizing utility," does utilitarianism violate their integrity? Williams suggests this is a pathological project, but defining the boundary between legitimate ground projects and moralistic obsessions remains a point of debate.

  ### Conclusion
  The integrity objection remains one of the most potent critiques of utilitarianism because it targets the theory's conception of the person. It asserts that we are not merely locations of utility, but beings defined by our commitments. While the objection clearly applies to cases of intimacy (the wife case), its application to impartial contexts (the stranger case) is weaker, suggesting the critique is specifically about the colonization of personal life by impersonal standards. Whether utilitarianism can accommodate this insight without ceasing to be utilitarianism remains one of the central unresolved questions in modern normative ethics.
