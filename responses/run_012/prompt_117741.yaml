  I've been trying to work through a stretch of Turing's 1950 paper on computing machinery and intelligence, specifically the part where he turns from the imitation game to the question of how one might actually build a machine that could pass it. Since I don't have the text in front of me, I'll give you the gist of the passage in my own words, and I'd like your help understanding it.

  Turing suggests that instead of trying to program a machine to simulate an adult mind, it would be more promising to produce a machine that simulates a child's mind and then subject it to an appropriate course of education. The child machine would start with something like a blank or nearly blank mind, and the education would consist of a mixture of reward and punishment, with the teacher shaping the machine's behavior over time. He then introduces a distinction between the mechanism of the machine and its writing: the mechanism being the fixed, hardware-like part, and the writing being the modifiable part, the instructions or notes that the machine can alter as it learns. He remarks that from our point of view mechanism and writing are almost synonymous, and that the character of the machine is a product of both. He also floats the idea that the machine might be allowed to modify its own program, and that random variation combined with selection might substitute for some of the educator's work.

  What I can't get clear on is this. If the education of the child machine is supposed to be a matter of reward and punishment, then the teacher must already be able to recognize the behaviors that deserve reward and punishment, which seems to mean that the teacher already possesses the intelligence or judgment that the machine is supposed to acquire. That looks like a regress: the learning machine can only be educated by something that already knows what it is supposed to learn, so the learning-machine program presupposes the very thing it was meant to explain or produce. Turing seems aware of something like this, because he keeps insisting that the educator need not be intelligent in the full sense, that the process can be largely mechanical, and that the education might be something we could in principle carry out without understanding it. But I can't tell whether that is a genuine answer or just a postponement. I also can't tell how the mechanism/writing distinction bears on the regress: if mechanism and writing are nearly synonymous from our point of view, then the distinction between the fixed hardware and the modifiable program may not do the work Turing needs it to do.

  I'd like you to help me understand the passage and the problem. In particular: what is Turing actually claiming about the relation between learning, education, and the acquisition of intelligence? Is the regress I've described a real difficulty for his view, or does he have a way out that I'm missing? How should I understand the mechanism/writing distinction, and does it help or hurt him? And is there a reading on which the child-machine proposal is not an attempt to explain intelligence by learning but something else, a methodological proposal about how to build the thing rather than a philosophical claim about what intelligence is? I'd also like you to say something about what Turing's view implies for education in the ordinary human sense: if a machine can be educated into intelligence, what does that suggest about the role of teaching, discipline, and imitation in human learning, and does the analogy cut both ways?

  Please answer in continuous prose, without headings, bullet points, bold text, or tables, just an essay or a long letter. I'm not looking for citations or a reading list; I'll track down the sources myself. What I want is a careful, patient explanation that takes the passage seriously and doesn't just give me the standard summary of the Turing test.
