answer: |-
  Here is a design for a 90-minute session titled **"The Arbitrage Simulation."** It is built to induce the specific frustration of the money pump, neutralize the "foresight" objection, and force a debrief on the normative force of coherence.

  ### **Session Overview**
  *   **Time:** 90 Minutes
  *   **Participants:** 12 (3 Tables of 4)
  *   **Materials:** Colored cards (Red, Blue, Green), "Transaction Tokens" (poker chips or paper slips), Preference Sheets, Coin.
  *   **Currency:** "Lab Credits" (LC). No real cash. Top scorer chooses the next reading or gets a bottle of wine.
  *   **Constraint:** The phrase "Money Pump" is banned until the final 5 minutes. Call it "The Arbitrage Simulation."

  ---

  ### **1. Setup & Roles (10 mins)**
  Divide into 3 tables. Each table has 4 participants.
  *   **3 Traders:** Each receives a **Preference Sheet**.
  *   **1 Banker:** Manages the LC ledger and transaction tokens. (Rotate this role in Phase 2).

  **The Induction (Crucial Step):**
  Do not ask them to generate preferences. *Assign* them. Tell the economists: *"We are testing the stability of the architecture, not the psychology of the agent. For this simulation, you are a script with these inputs."*

  **The Preference Sheet (Intransitive):**
  *   **Asset A (Red Card):** Base Value 100 LC.
  *   **Asset B (Blue Card):** Base Value 105 LC.
  *   **Asset C (Green Card):** Base Value 110 LC.
  *   **The Twist:** Your valuation is *context-dependent* (framing).
      *   When holding **A**, you value **B** at 110 LC (Gain 10).
      *   When holding **B**, you value **C** at 115 LC (Gain 10).
      *   When holding **C**, you value **A** at 120 LC (Gain 10).
      *   *Note to Facilitator:* This creates a cycle $A \prec B \prec C \prec A$ with a strict preference margin of 10 LC per step.

  **Transaction Cost:**
  Every trade costs **3 LC**.
  *   Trade A $\to$ B: Net Gain = 10 (pref) - 3 (cost) = +7 LC.
  *   Cycle A $\to$ B $\to$ C $\to$ A: Net Gain = 0 (pref) - 9 (cost) = **-9 LC**.

  ---

  ### **2. Phase 1: The Deterministic Cycle (25 mins)**
  **Goal:** Let them feel the loss. Let them find the escape hatch.

  **Rules:**
  1.  All Traders start with Asset A and 50 LC.
  2.  The Banker offers trades sequentially, publicly, and deterministically.
  3.  **Round 1:** Banker offers all Traders: "Trade A for B, cost 3 LC."
  4.  **Round 2:** Banker offers: "Trade B for C, cost 3 LC."
  5.  **Round 3:** Banker offers: "Trade C for A, cost 3 LC."
  6.  Traders decide individually. Banker records final LC.

  **Expected Outcome:**
  Smart agents will trade in Round 1 (+7 LC), trade in Round 2 (+7 LC), and **refuse** Round 3.
  *   *Why?* They see the cycle. They know Round 3 brings them back to A but costs 3 LC.
  *   *Result:* They end with Asset A and +14 LC. They avoided the pump.
  *   *Frustration:* The economists will smugly note that "foresight prevents exploitation."

  **Facilitator Script:** "Record your earnings. Reset assets to A. Reset LC to 50. We are changing market conditions."

  ---

  ### **3. Phase 2: The Stochastic Fog (35 mins)**
  **Goal:** Close the escape hatch. Make foresight useless.

  **The Change:**
  The sequence is no longer guaranteed. The market is "volatile."
  *   **Role Rotation:** Swap the Banker role to a new person (so the previous strategy doesn't carry over via collusion).
  *   **The Mechanism:** After every successful trade, the Banker flips a coin.
      *   **Heads:** The market closes. Game ends for that Trader.
      *   **Tails:** The market continues. Next offer is made.

  **The Sequence:**
  1.  Trader holds A. Offer: Trade A $\to$ B (Cost 3).
      *   If Trade: Flip Coin. Heads = End. Tails = Next Offer.
      *   If Refuse: Game Ends immediately.
  2.  Trader holds B. Offer: Trade B $\to$ C (Cost 3).
      *   If Trade: Flip Coin. Heads = End. Tails = Next Offer.
      *   If Refuse: Game Ends immediately.
  3.  Trader holds C. Offer: Trade C $\to$ A (Cost 3).
      *   If Trade: Game Ends (Cycle Complete).

  **The Trap:**
  *   **At Node 1 (Holding A):** You prefer B to A by 10 LC. Cost is 3 LC. Net immediate gain +7 LC.
      *   If you refuse, you get 0.
      *   If you accept, there is a 50% chance the game ends (you keep the +7 LC) and a 50% chance you face Node 2.
      *   *Rational Move:* **Trade.** Refusing violates Dominance (leaving guaranteed value on the table in the Heads case).
  *   **At Node 2 (Holding B):** You prefer C to B by 10 LC. Cost is 3 LC. Net immediate gain +7 LC.
      *   Same logic. If you refuse, you violate local preference.
      *   *Rational Move:* **Trade.**
  *   **At Node 3 (Holding C):** You prefer A to C by 10 LC. Cost is 3 LC.
      *   *Rational Move:* **Trade.**

  **The Result:**
  If they follow their local preferences at every node (which they must, to be rational *at that node*), they complete the cycle 50% of the time (Tails, Tails).
  *   Expected Value of Trading All: $0.5 \times (+7) + 0.5 \times (-9) = 3.5 - 4.5 = -1 LC$.
  *   Expected Value of Refusing All: $0 LC$.
  *   *Wait, check the math:*
      *   Path 1 (H on 1st flip): End with B. Profit +7. (Prob 0.5)
      *   Path 2 (T on 1st, H on 2nd): End with C. Profit +7 (A->B) + 7 (B->C) = +14. (Prob 0.25)
      *   Path 3 (T on 1st, T on 2nd, Trade 3rd): End with A. Profit +7 + 7 - 9 (C->A cost 3, but no pref gain relative to start) = Wait.
      *   Let's simplify the payoff for the game:
          *   Start A (Val 100).
          *   End B (Val 110). Cost 3. Net +7.
          *   End C (Val 120). Cost 6. Net +14.
          *   End A (Val 100). Cost 9. Net -9.
      *   EV of "Always Trade": $(0.5 \times 7) + (0.25 \times 14) + (0.25 \times -9) = 3.5 + 3.5 - 2.25 = +4.75$.
      *   *Correction:* The pump usually requires the cycle to be a *loss*.
      *   *Adjustment:* Make the Transaction Cost **5 LC**.
          *   Trade A->B: +10 - 5 = +5.
          *   Trade B->C: +10 - 5 = +5.
          *   Trade C->A: +10 - 5 = +5. (Wait, if I value A at 120 when holding C, I gain 10 utility, but I am back at Start Asset).
          *   *Real Wealth Check:*
              *   Start: Asset A (100) + 50 LC.
              *   Cycle End: Asset A (100) + 50 LC - 15 LC (costs) = 35 LC.
              *   Loss = 15 LC.
      *   *Re-calc EV with Cost 5:*
          *   Path 1 (End B): +5 LC. (Prob 0.5)
          *   Path 2 (End C): +10 LC. (Prob 0.25)
          *   Path 3 (End A): -15 LC. (Prob 0.25)
          *   EV = $2.5 + 2.5 - 3.75 = +1.25 LC$.
      *   *Problem:* If EV is positive, they *should* trade. The pump fails to be a "pump" (net loss).
      *   *Fix:* Increase Cost to **8 LC**.
          *   Path 1 (End B): +2 LC.
          *   Path 2 (End C): +4 LC.
          *   Path 3 (End A): -24 LC.
          *   EV = $1 + 1 - 6 = -4 LC$.
      *   **Now the trap is set.**
      *   Locally, at Node 1: Trade gives +2 (if Heads) or leads to Node 2. Refuse gives 0. Since +2 > 0, you *must* trade to satisfy local preference.
      *   But globally, the strategy "Always Trade" has negative EV.
      *   **The Escape Hatch is broken.** You cannot refuse Node 1 without violating your preference for B over A in the scenario where the game ends immediately.

  **Run Phase 2:** Run 3 rounds of this stochastic sequence. Tally final LC.

  ---

  ### **4. The Debrief (20 mins)**
  **Step 1: The Reveal (5 mins)**
  *   Ask: "Who lost credits in Phase 2 despite making the 'rational' choice at every step?"
  *   Reveal the term: **Money Pump.**
  *   Reveal the structure: $A \prec B \prec C \prec A$.

  **Step 2: Mapping the Gap (10 mins)**
  Draw two columns on the board:
  1.  **Representation Theorem:** "My preferences can be represented by a utility function."
  2.  **Normative Claim:** "I am exploitable / I am irrational."

  Ask the group: *"Where do these come apart?"*

  *   **The Trap:** In Phase 1, you avoided exploitation by using **foresight**. You imposed a global policy ("Stop at B") that violated your local preference at Node 3 ("I prefer A to C").
  *   **The Conflict:** In Phase 2, foresight didn't help. To avoid the global loss, you had to refuse a trade that was *locally dominant* (positive EV in the Heads case).
  *   **The Location of the Gap:**
      *   If you say "I have intransitive preferences," the Representation Theorem says **No, you don't have a utility function.**
      *   If you say "I avoid the pump by policy," you are admitting that **Preferences alone do not drive action.** You need a *second-order* commitment (Resolute Choice).
      *   **The Punchline:** The "Utility Function" isn't just a description of what you want; it's a description of a *policy you can stick to without losing wealth.* If your preferences require a policy to override themselves to avoid loss, they aren't doing the job of preferences.

  **Step 3: Addressing the Economists (5 mins)**
  *   Acknowledge the objection: "Real agents don't have fixed intransitive preferences."
  *   Counter: "The argument isn't that humans *are* intransitive. It's that if you *are*, coherence forces you to become EU maximizers (or lose money). The 'Escape Hatch' (Resolute Choice) is just EU maximization in disguise. You are maximizing 'Adherence to Plan' utility."

  ---

  ### **5. Predictable Failure Modes**
  1.  **The "I'm Not Irrational" Refusal:**
      *   *What happens:* An economist refuses to accept the Preference Sheet. "I won't value A over C if I value B over A."
      *   *Fix:* Pre-empt this. "This is a simulation of an *architecture*. You are debugging code, not confessing sins. If the code crashes, we fix the code."
  2.  **Collusion / Side Payments:**
      *   *What happens:* Traders at a table pool their LC to offset losses.
      *   *Fix:* Explicit rule: "Individual Scoring Only. Top scorer wins the prize."
  3.  **Phase 2 Confusion:**
      *   *What happens:* They don't calculate the EV correctly and think the game is rigged.
      *   *Fix:* Walk through the EV calculation on the whiteboard *after* the game, not before. Let them feel the loss first.
  4.  **Boredom:**
      *   *What happens:* Flipping coins slows things down.
      *   *Fix:* The Banker pre-flips the sequences for all 3 traders and records them on a sheet to reveal one by one. Speed is key.

  ---

  ### **6. What The Game Can't Reproduce (Honest Limitations)**
  You asked me to be honest about the gaps. Here is what this simulation misses:

  1.  **Completeness:** The game assumes you *must* choose Trade or No Trade. It doesn't capture the state of "I have no preference." In real life, incompleteness often looks like indecision, not cycling.
  2.  **Endogeneity of Preference:** In the game, preferences are fixed on a sheet. In reality, preferences often shift *because* of the pump (learning). A real agent might say, "Wait, why do I prefer A to C? That seems wrong," and update their preferences. The game treats preferences as exogenous constraints, which is the formalist assumption but not the psychological reality.
  3.  **Transaction Costs as Friction:** In the game, the cost is arbitrary. In reality, the "cost" is often cognitive load or time. The game abstracts this into LC, which might feel too clean.
  4.  **The "Small World" Assumption:** The game is a closed system. In the real world, there is no "Banker" offering cycles endlessly. The threat of a money pump relies on the existence of a predator who *knows* your preferences. The game assumes a predatory market; it doesn't prove one will emerge.

  ### **Why This Works for Your Group**
  The stubborn economists will try to solve Phase 1 with "Rational Expectations." Phase 2 removes the expectation. They will be forced to admit that **local rationality does not guarantee global coherence.**

  That is the exact location where "My preferences can be represented by a utility function" (a static claim) fails to bridge to "I am not exploitable" (a dynamic claim). The bridge is **Dynamic Consistency**, and the game shows that intransitivity burns that bridge.
