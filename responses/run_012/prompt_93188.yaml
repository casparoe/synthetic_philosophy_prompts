prompt: |-
  I run a reading group on formal epistemology and decision theory — mixed grad students, a couple of stubborn economists, about twelve of us, one 90-minute session. Next week is coherence arguments for expected utility maximization, and I dont want them just nodding along to the money pump, I want them to feel it. So design a trading game where they pump each other. The specific thing I want them to run into is the escape hatch — someone will clock the cycle and refuse to trade — and I want the activity to survive that, so build a second phase where seeing the sequence coming doesn't save you (a package deal, trades you can't tell apart, whatever you think genuinely works). Nobody says 'money pump' till the debrief. Give me rules, roles, a payoff scheme that doesn't need real cash, a timeline, and a debrief that maps what happened onto the gap between 'my preferences can be represented by a utility function' and 'I'm exploitable' — I'm fairly sure those come apart and I want the debrief to locate where. Then tell me what predictably goes wrong the first time I run it, and be honest about what the game can't reproduce (my guess is nothing about completeness, but you tell me).
