prompt: |-
  I got into a stupidly long argument with my flatmate last night about Lewis Carroll's tortoise-and-Achilles bit — the one where Achilles gets the tortoise to accept the two premises and the conditional, and the tortoise says fine, write that down too, and now please write down the extra conditional that says if the first two are true then the conclusion follows, and so on forever. She thinks the tortoise is just being obtuse, basically trolling, and that the whole thing shows nothing except that you can be an uncooperative pedant if you want to be. I think if the tortoise is being obtuse then so is every actual reasoner at some point, and I couldn't say what the difference between them is meant to be, and we went round in circles until about 2am. So I want to make something out of it: there's a small internal pilot fund at my department (about £1500, six months, one workshop at the end and a draft paper out of it) and I want to apply with this. Can you write me the proposal? Two pages, that's the limit.

  Before you write a word of it, please brainstorm — lay out for yourself the space of readings of the puzzle and be explicit about which ones my framing commits me to — then put on the hat of a philosopher of logic who works on inference and actually knows the conditional literature, and write the proposal carefully, keeping the options genuinely distinct rather than smearing them together. Here's my half-formed idea, and I'm not sure it survives contact but I want you to take it seriously: the puzzle is normally read in one of two ways. Either it's a logical point, namely that you can never get the conclusion out of a conditional alone, you need a rule, and the rule can't itself be one more premise, so the demand for a justification of deduction can never be met from inside deduction. Or it's a psychological point, namely that no pile of premises, however long, actually compels anyone to draw a conclusion — something else has to happen, and that something isn't a matter of logic at all. I think both readings are unstable, and I want to propose that the regress only gets started by assuming that accepting a rule of inference has to be the same kind of thing as accepting a premise: a belief with a content. I want to pull apart at least three things that accepting something can be — a belief that has a content, a disposition to move in a certain way, and a kind of permission or license to move — and then argue that once you separate them, the tortoise isn't exposing a gap in the justification of deduction so much as a category mistake in how the question is posed. The part I actually care about is the test: if I'm right, the same regress should be reconstructible for any practice where we try to back a rule with a proposition — a rule of chess, a rule of grammar, the rule that you keep your promises — and if it turns out the regress is somehow special to deduction, then my whole story collapses and I should say so up front. So the proposal needs to state the question so it has a determinate answer, say why the going positions leave it open (as positions, not as a literature review — don't give me citations or a reading list, I'll fill those in myself, just describe the views), then the method: what I'd actually do month by month, including which cases I'd use as the comparison class and how I'd tell a real regress from a fake one, what the workshop is for, and what a result would even look like here versus what would count as the project failing. Be honest about whether six months and one person is enough, and tell me what I should say to my flatmate when she asks me what the tortoise was actually about.
