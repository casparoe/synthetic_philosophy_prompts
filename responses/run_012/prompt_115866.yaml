answer: |-
  ### Examination Question

  **Module:** Foundations of Probabilistic Reasoning
  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Question 1: The Reference Class Problem in Clinical Prediction**

  A hospital deploys a machine learning model to predict the risk of a specific complication within thirty days of admission. For a particular patient, $P$, the model outputs a risk score of 0.30. Three colleagues dispute the interpretation of this number:

  1.  **Colleague A:** "This is the frequency of complications among all patients in the training set. It is the broadest class for which we have data."
  2.  **Colleague B:** "The only defensible class matches everything known about $P$, including variables the model never saw. That class contains only $P$. The frequency is 0 or 1; we just don't know which."
  3.  **Colleague C:** "The number is a fact about the model, not the patient. It is the frequency of complications among all cases where the model output 0.30."

  Answer the following, drawing on the scenario above:

  1.  **Generalisation:** State the reference class problem precisely. Explain why it arises for any probability assigned to a single case, not merely for frequentist claims. (5 marks)
  2.  **Class Selection:** Explain why neither "use the broadest class" nor "use the most specific class" is sufficient. Discuss what each gets right and how the requirement for class *homogeneity* behaves as the class narrows toward a single case. (5 marks)
  3.  **Interpretation:** Does this problem vanish if the 0.30 is interpreted as a rational degree of belief (Bayesian) rather than a frequency? Defend your answer. (5 marks)
  4.  **Distinctions:** Distinguish this problem from (i) the base-rate fallacy and (ii) the claim that some events are objectively chancy. (5 marks)
  5.  **Resolution & Commitment:** Take a stand on what a satisfactory resolution must accomplish and whether the hospital's 0.30 is defensible. Finally, answer this specifically: If the hospital adds a variable to the model and the reported number for $P$ moves from 0.30 to 0.28, has the **probability** changed or has the **estimate** changed? You must choose one and justify it. (5 marks)

  ***

  ### Model Answer

  The reference class problem is the indeterminacy of single-case probability arising because every individual belongs to infinitely many overlapping classes, each yielding different statistical frequencies. It is not merely a frequentist issue; it arises for any probability assignment because assigning a value to a singular proposition (e.g., "Patient $P$ develops complications") requires conditioning on evidence. The problem is selecting *which* evidence constitutes the relevant conditioning set. Without a principled selection rule, the probability value is underdetermined by the facts.

  Regarding class selection, Colleague A (broadest class) ensures statistical stability and sufficient sample size but ignores relevant heterogeneity. If the training set includes low-risk patients dissimilar to $P$, the 0.30 is biased. Colleague B (most specific class) maximizes relevance but eliminates statistical leverage. As the class narrows toward the singleton $\{P\}$, the requirement for homogeneity (that no further subdivision changes the frequency) is trivially satisfied, but the frequency becomes undefined or deterministic (0 or 1). We sacrifice knowability for relevance. A valid class must balance relevance with stability.

  This problem survives Bayesian interpretation. A Bayesian probability is $Pr(H|E)$, conditional on evidence $E$. The reference class problem re-emerges as the problem of selecting $E$. Which features of $P$ belong in $E$? If $E$ includes everything known, we face the same singleton problem as Colleague B. If $E$ is limited to model inputs, we face Colleague C's limitation. The subjectivity of the prior does not resolve the objectivity of the conditioning information selection.

  We must distinguish this from the base-rate fallacy. The base-rate fallacy is ignoring a *known* relevant statistical distribution (e.g., ignoring the general prevalence of the complication). The reference class problem is deeper: it questions *which* distribution is the relevant one to begin with. Similarly, this is distinct from objective chance. Objective chance claims the world is inherently stochastic. The reference class problem is epistemic; it persists even if the world is deterministic, because it concerns our description of the case, not the metaphysics of the event.

  A satisfactory resolution must provide a pragmatic or teleological rule for class selection, likely tied to the decision context (e.g., fairness vs. accuracy). The hospital's 0.30 is defensible only as a decision-tool calibrated for a specific purpose, not as a metaphysical truth. Regarding the change from 0.30 to 0.28: The **estimate** has changed, not the probability. The patient's physiological state did not alter when the model was updated. The 0.30 was an approximation of the patient's risk based on limited information. Adding a variable refined our approximation of the underlying reality. To claim the probability changed implies the patient's risk was ontologically dependent on the model's architecture, which conflates the map with the territory. The reference class problem reminds us that probability is a relation between a case and a description; changing the description changes the estimate, but we aim to track a stable underlying propensity.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Part 1: Generalisation (5 Marks)**
  *   **A Answer (4-5):** Defines problem as indeterminacy due to multiple valid classifications. Explicitly notes it applies to conditioning evidence in non-frequentist frameworks.
  *   **B Answer (2-3):** Describes the scenario (A vs B vs C) without abstracting to the general logical problem.
  *   **Common Error:** Treating it solely as a "frequency vs. belief" debate rather than a classification issue.

  **Part 2: Class Selection (5 Marks)**
  *   **A Answer (4-5):** Identifies the trade-off: Broad = stability/bias, Specific = relevance/variance. Explains homogeneity breaks at the singleton limit (frequency becomes 0/1).
  *   **B Answer (2-3):** States broad is "too vague" and specific is "too small" without explaining *why* (homogeneity/sample size trade-off).
  *   **Common Error:** Claiming the "most specific" class is simply impossible to find, rather than statistically useless.

  **Part 3: Interpretation (5 Marks)**
  *   **A Answer (4-5):** Argues problem survives Bayesianism because conditioning evidence ($E$) still requires selection. Priors do not solve data selection.
  *   **B Answer (2-3):** Claims Bayesians solve it by using "degrees of belief" without addressing how those degrees are conditioned.
  *   **Common Error:** Asserting subjectivity automatically dissolves the problem of evidence selection.

  **Part 4: Distinctions (5 Marks)**
  *   **A Answer (4-5):** Clearly separates Base-Rate (ignoring known stats) from Reference Class (choosing which stats). Separates Epistemic (description) from Ontic (chance).
  *   **B Answer (2-3):** Conflates base-rate neglect with reference class ambiguity.
  *   **Common Error:** Arguing that objective chance resolves the problem (it does not; we still need to know *which* chance).

  **Part 5: Resolution & Commitment (5 Marks)**
  *   **A Answer (4-5):** Proposes pragmatic/teleological resolution. **Commits** to "Estimate changed" or "Probability changed" and justifies consistently (e.g., Map/Territory distinction).
  *   **B Answer (2-3):** Hedges ("it depends on definition") or fails to justify the choice.
  *   **Common Error:** Refusing to choose in the final test. (Max 2 marks if hedged).

  **Differentiation Note:** To achieve an A (21+ marks), the student must treat probability as a relation between *world* and *description*, not just a property of the world. The final test is the primary discriminator: hedging indicates a failure to grasp the implications of their own argument.
