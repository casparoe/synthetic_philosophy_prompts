answer: |-
  This is a fantastic set of questions. You've identified the exact fault lines where the philosophy of law cracks open under the pressure of historical necessity. The Nuremberg and Tokyo tribunals are essentially a "stress test" for legal theory.

  To help you think this through without writing the paper for you, let's break your puzzle down into three conceptual tensions. For each, I'll outline the competing philosophical commitments and ask you to weigh which one the Tribunal actually prioritized.

  ### 1. The Source of Law: Positivism vs. Natural Law
  You hit the nail on the head: the *ex post facto* problem is the engine of the whole philosophical dilemma.

  *   **The Positivist View:** Law is the command of the sovereign. The London Charter *created* the law.
      *   *Problem:* If this is true, the trials are legally unjust. You cannot punish someone for breaking a rule that didn't exist when they acted. The defense was right; the Tribunal was just exercising raw power.
  *   **The Natural Law View:** There are higher moral principles binding on all humans regardless of statutes. Aggressive war was *already* wrong; the Charter just put a name to it.
      *   *Problem:* If this is true, why did they need a Charter at all? And why limit the jurisdiction to the losers? Natural law applies to everyone, equally.

  **The Tribunal's "Hybrid" Move:**
  The Judgment famously claimed the Charter was not "arbitrary exercise of power" but the "expression of international law existing at the time of its creation." They tried to have it both ways: using the Charter (Positivism) to establish jurisdiction, but appealing to pre-existing custom/morality (Natural Law) to defeat the *ex post facto* objection.

  **Questions to push your analysis:**
  *   Is this hybrid stable? Or is one doing the work while the other provides the cover?
  *   If they rely on Natural Law to justify retroactivity, does that undermine their Positivist rejection of *tu quoque*? (i.e., If the law is "higher morality," surely the Allies are bound by it too. If the law is "the Charter," then the Allies are exempt, but the retroactivity charge sticks.)
  *   **Think about this:** Does the Tribunal treat the Charter as *constitutive* (making new law) or *declaratory* (recognizing old law)? Their rhetoric says declaratory; their practice (especially regarding "Crimes Against Peace") looks constitutive. Which one is required to make the trials legitimate?

  ### 2. Theories of Responsibility: Individual Agency vs. Collective Guilt
  This is where the internal logic of the trial gets really messy.

  *   **Individual Responsibility:** The Tribunal's big innovation was rejecting state immunity. "Crimes against international law are committed by men, not by abstract entities." This presupposes a **Kantian moral agent**: an individual with autonomy who *must* exercise moral judgment even against state commands. This is why "Superior Orders" was rejected as a complete defense. It assumes you *could* have done otherwise.
  *   **Criminal Organizations (SS/Gestapo):** Declaring an organization criminal so that membership itself is a crime looks like **Collective Liability**.
      *   *The Tension:* If guilt is strictly individual, how can *membership* be a crime? Does joining a group absolve you of the need to prove specific criminal acts?
      *   *The Tribunal's Fix:* They tried to say membership was only criminal if voluntary and with knowledge of criminal aims. But in practice, did this hold?

  **Questions to push your analysis:**
  *   Does "Criminal Organization" liability actually undermine the "Individual Responsibility" principle? Does it turn the trial into a form of **vicarious liability** (guilt by association) rather than personal guilt?
  *   Regarding Superior Orders: If they allow it as *mitigation* but not *exculpation*, what does that say about the degree of autonomy they expect from soldiers? Are they saying "You had a choice, but it was a hard choice"? How does that square with the harshness of the death penalties?
  *   **Think about this:** Is the "Criminal Organization" concept a pragmatic tool for processing thousands of defendants, or a philosophical claim about the nature of bureaucratic evil? If it's pragmatic, does it sacrifice justice for efficiency?

  ### 3. Consistency and *Tu Quoque*: Rule of Law or Victor's Justice?
  The rejection of *tu quoque* ("You did it too") is the clearest window into whether this was Law or Politics.

  *   **The Rule of Law Ideal:** Law must be general and consistent. If bombing civilians is a crime, it's a crime for everyone. If it's not a crime for the Allies (Dresden/Tokyo), then the law isn't universal.
  *   **The Tribunal's Logic:** They ruled that the Charter defined their jurisdiction, and the Charter only gave them power over Axis powers. Therefore, Allied actions were irrelevant to the *legal* question of the defendants' guilt.

  **Questions to push your analysis:**
  *   Does rejecting *tu quoque* commit them to a **Positivist** view (Law = What the Sovereign/Jurisdiction says)? If so, does that collapse their Natural Law defense against *ex post facto*?
  *   Is consistency a condition of *legality*, or just a condition of *legitimacy*? The Tribunal might argue: "We are legally entitled to try you regardless of our own sins." But does that destroy the moral authority of the verdict?
  *   **Think about this:** If you admit the trials were "Victor's Justice," do they lose all legal value? Or can they be legally flawed but historically/morally necessary? (This is the "Transitional Justice" angle).

  ### 4. Rebuilding the Tribunal (The Synthesis)
  To answer your final question about what would have to give to make the parts fit:

  **The Immunity Problem (Tokyo/Emperor):**
  *   This is the hardest to reconcile with *any* theory of law. Exempting the Head of State (Hirohito) for political stability while hanging his subordinates contradicts the "Individual Responsibility" principle. It suggests the subordinates were scapegoats.
  *   *To fix this:* You must remove immunity. (Note: The modern ICC attempts this, though enforcement is still political).

  **The Retroactivity Problem:**
  *   *To fix this:* You either need to prove robust Customary International Law existed beforehand (hard for "Crimes Against Peace"), OR you must admit this is not standard criminal law but **Transitional Justice**.
  *   *Implication:* If it's Transitional Justice, the goal isn't just "applying rules," it's "building a new normative order." That changes the justification entirely.

  **The Collective Guilt Problem:**
  *   *To fix this:* You have to tighten the link between membership and specific intent. Mere membership shouldn't be enough; there must be proof of personal contribution to the criminal aim.

  **Forced by Idea vs. Accident of Victory:**
  *   **Accidents of Victory:** The immunity of the Allies, the immunity of the Emperor, the specific definition of "Aggressive War" (which was vague), the location and makeup of the judges.
  *   **Forced by the Idea:** Individual responsibility (you can't try a state), the rejection of superior orders (moral agency is required for law to function), the need for a written charter (Positivist requirement for jurisdiction).

  ### A Suggested Thesis Path
  If I were structuring this, I might argue something like this:

  *The Nuremberg and Tokyo Tribunals attempted to synthesize Legal Positivism and Natural Law to solve the crisis of "Victor's Justice." They used Positivism (the Charter) to establish jurisdiction but Natural Law (universal morality) to justify retroactivity. However, this synthesis fails when tested against the rejection of *tu quoque* and the immunity of the victors. To make the project philosophically coherent, one must admit that these were not standard criminal trials, but acts of **Constitutive Justice**—using legal forms to create a new political order. This explains the inconsistencies: they weren't bugs, they were features of a political transition disguised as a legal proceeding.*

  Does that distinction between "Standard Criminal Law" and "Constitutive/Transitional Justice" help resolve the circles you're running in? It allows you to say "Yes, this violates standard legal theory, but it was doing a different job."
