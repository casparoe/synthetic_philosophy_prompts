  ok so i've been reading about this thing Douglas Hofstadter did called Letter Spirit and i cant stop thinking about it. the idea was a computer program that designs whole alphabets from scratch — every letter still has to be obviously that letter (any 'a' has to read as an 'a', any 'g' as a 'g') while the whole set also has to feel like one style, like one person drew them all, and he kept running into the wall of: whats the actual essence of a letter? not this 'a' or that 'a' but the thing that makes something an 'a' at all, and whether a program can have a style of its own or only copy one.

  It got me thinking about William Morris — the arts and crafts guy, the Kelmscott typefaces, hand presses, hated machines, thought work should be done by hand with some joy in it. So if you could sit him down and show him a machine producing a full typeface where every letter is recognizably itself and the whole set is stylistically consistent, what would he actually say? would he call it real design or a fake, would he say a machine can have a style, or is style something only a human hand and eye can have, and what would he make of the whole "essence of a letter" question given how he thought about craft and beauty? i want his reasoning in his own terms, not a modern designer's spin, and dont just tell me he'd hate it — show me the arguments he'd actually make.

  Give it back as a numbered list of exactly five items, one or two sentences each, no intro and no closing paragraph, each item a specific thing he'd say or argue.
