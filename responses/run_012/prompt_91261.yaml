      *   **B (Two-Factor/Global Workspace):** More cautious, distinguishes between optimization and experience. Believes consciousness/valence requires integration (global broadcast) and self-modeling. Sees the reward signal as just a gradient, not a feeling.

  3.  **Drafting - Section by Section:**

