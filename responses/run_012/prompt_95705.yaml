prompt: |-
  My friend and I have been arguing about this for like three hours and I need you to make the case I kept fumbling. Setup: HCH is the idealization where you take one human answering a question and replace them with a whole tree of copies of themselves — each node is either a primitive answer a copy can just give, or a question that gets split into subquestions handed off to other copies. Factored cognition is the practical version, where you actually farm the subquestions out to separate agents and recombine. His objection is that the idealization is empty, because the hard part of thinking is finding the decomposition in the first place, and if you get to pick the decomposition knowing where the answer is, then everything factors and HCH tells you nothing about anything. I think he's proving way to much — any function has a trivial circuit if you let the circuit be huge — but I couldn't say what saves it. So argue the position that HCH is still informative, and that the work is done by constraints on the shape of the tree (shallow, small fan-out, cheap primitive steps) rather than by the bare existence of some factorization. Use the case we got stuck on: a question where you don't know whether you're hunting for a proof or a counterexample until you've already done some work, so which subquestions to spawn depends on results you don't have yet. He says HCH can't even represent that without cheating; I say the tree can be adaptive, with children chosen by the output of another subtree. Give me the best version of his reply, tell me who's right, and say what would actually settle it.
