      *   **Friend's Position (Anti-HCH):** The definition of HCH allows the human to "know" how to decompose. If the human at the root knows how to decompose to get the answer, they effectively already have the answer. The "hard part" is the strategy, not the execution. If HCH assumes the strategy is available, it's circular.
