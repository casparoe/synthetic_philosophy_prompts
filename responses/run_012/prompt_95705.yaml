          *   Key constraint: **Bounded Context.** Each copy is a standard human, not a superintelligence.
          *   Address the Adaptive Case: This is about *iterative refinement*. Node 1 asks "Is statement X plausible?" If Yes, Node 2a tries to prove. If No, Node 2b looks for counterexample. The *policy* for splitting is local, not global. The root doesn't need to know the path; it just needs to know the *rule* for branching.
          *   Analogy: Binary search. You don't need to know the number to search for it; you need the algorithm. HCH tests if humans have the *algorithm* for truth, not just the truth.

