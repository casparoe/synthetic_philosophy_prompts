prompt: |-
  I teach a 90-minute session in an upper-level seminar on autonomy and personal identity — sixteen students, a mix of philosophy and medical-humanities people, no set reading for the week and no clinical knowledge assumed. What I want them to feel rather than merely recite is the problem of the authority of the earlier self: that an advance directive is a claim staked by someone who will not be present to enforce it, against someone who may have no reason at all to honour it, and that the whole weight of the earlier self's authority therefore has to be carried by a piece of paper. I have been sketching an activity and would like you to build it out properly into something runnable. Keep or discard my sketches as you see fit, but I would rather you kept the general shape: a two-round role-play in which students first draft a binding instruction and then have to argue against one — their own — as the person it was written about.

  Some specifics, so that the thing doesn't collapse into vague discussion. The condition should be fictional and stipulated rather than a real diagnosis, so that the group cannot litigate the medicine and nobody with a family history is put on the spot: something like a progressive syndrome in which present-directed preferences remain coherent and articulate, long-range projects and evaluative commitments are transformed or lost, the ability to engage with one's own earlier commitments is impaired but not absent, and the person remains capable of contentment. I want the directive to have four fields, because I suspect the interesting action is in the last two: a substantive instruction; a trigger specifying what counts as the condition's having taken hold; a defeasance clause saying whether the later self's contemporaneous wishes may override the instruction, and who adjudicates if they conflict; and a meta-clause governing how the directive itself is to be interpreted when matters are unclear. My guess is that most students will write a meta-clause that renders their own directive undefeatable — along the lines of 'any apparent rejection of this directive by my later self is itself evidence that the trigger has fired' — and that they will find it monstrous when someone applies it to them in the second round. I would also like a device that turns the third-person/first-person asymmetry into something the group can see rather than merely feel: my thought was that each pod must decide its cases by announcing a general rule, which goes up on a public board and becomes a binding precedent for later cases, so that the reasons they used to override a stranger's directive come back to govern their own. And I want one small real stake in the room, so that self-binding isn't purely fictional — my sketch is that everyone also signs a sealed slip committing themselves to something trivial in the final ten minutes of the session, which is opened and enforced at the end.

  Give me the rules, the materials (I want a list I can photocopy in five minutes), the roles, a minute-by-minute timeline for sixteen participants in 90 minutes, and the debrief. The debrief should map what happened onto the philosophical terrain: what is owed to the earlier self as against the present one; whether the earlier self's authority is derived from the later self's own autonomy or is independent of it; the difference between a directive's authority and its mere predictive accuracy about what the later self will want; and whether the earlier self can coherently set the terms of its own defeat. Then tell me what will predictably go wrong the first time I run it — not generic facilitation advice, but the specific ways this design fails, for instance what happens when students draft jokey or vague directives, or when the later-self roles get played as a question about competence rather than about values, or when a Round A pod is too lenient to generate any precedent worth citing. Finally, be honest about what the activity cannot reproduce and what I will therefore have to supply from the front of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** 90-minute upper-level seminar (Autonomy & Personal Identity). 16 students (Philosophy + Med-Humanities). No reading, no clinical knowledge assumed.
      *   **Core Goal:** Make students *feel* the problem of the authority of the earlier self (advance directives as claims by an absent self against a present self, weight carried by paper).
      *   **Structure:** Two-round role-play.
          *   Round 1: Draft a binding instruction (Advance Directive).
          *   Round 2: Argue against one (their own or another's) as the "later self."
      *   **Specific Constraints/Features:**
          *   Fictional condition (progressive syndrome, coherent present preferences, lost long-range projects, impaired engagement with past, capable of contentment).
          *   Directive Template: 4 fields (Substantive Instruction, Trigger, Defeasance Clause, Meta-Clause).
          *   Precedent Mechanism: Pods decide cases by announcing a general rule (public board), binding for later cases (creates 3rd/1st person asymmetry visibility).
          *   Real Stake: Sealed slip committing to something trivial in the last 10 mins, enforced at the end.
      *   **Deliverables:** Rules, Materials (photocopy list), Roles, Minute-by-Minute Timeline, Debrief (philosophical mapping), Failure Analysis (what goes wrong), Limitations (what the instructor must supply).

  2.  **Deconstruct & Refine the Design:**

      *   *The Condition:* Needs to be specific enough to guide drafting but vague enough to allow interpretation. Let's call it "Dissociative Hedonic Drift" (DHD). It captures the shift in values without implying incompetence in the medical sense.
      *   *The Groups:* 16 students. 4 pods of 4 seems manageable.
      *   *The Precedent Board:* This is crucial. It needs to be visible. A whiteboard or large sheet of paper.
      *   *The "Real Stake":* Needs to be low stakes but annoying enough to feel binding. "Stay 5 minutes after class" or "Write a specific sentence on the board." Let's go with "Write a specific sentence on the board at the end."
      *   *The Role-Play Flow:*
          *   Phase 1: Drafting (Earlier Self).
          *   Phase 2: Adjudication (Later Self + Proxy/Adjudicator).
          *   *Correction on Precedent:* The prompt says "each pod must decide its cases by announcing a general rule... binding precedent for later cases." This implies a sequential flow where Pod 1 sets a rule Pod 2 must follow, etc. Or, all pods draft, then cases are swapped, and rulings build up.
          *   *Refinement:* To make the precedent mechanic work in 90 mins, we need a central "Court of Appeal" or a shared board where *one* rule is established per round that applies to *all*.
          *   *Better interpretation of prompt:* "each pod must decide its cases by announcing a general rule, which goes up on a public board and becomes a binding precedent for later cases." This suggests a sequential structure. Pod 1 decides Case 1 -> Rule A. Pod 2 decides Case 2 (must respect Rule A) -> Rule B.
          *   *Wait, 16 students.* If I have 4 pods of 4, and they all draft directives, who adjudicates?
          *   *Revised Flow:*
              1.  Everyone drafts a directive (Earlier Self).
              2.  Directives are swapped within pods.
              3.  Pod 1 adjudicates Case 1 (Person A's directive vs. Person B's later self). They set Rule 1.
              4.  Pod 2 adjudicates Case 2. They must follow Rule 1. They set Rule 2.
              5.  This creates the "trap" where the rules they make for others come back to haunt them.
      *   *The "Own Directive" constraint:* The prompt says "argue against one — their own." This is psychologically powerful but logistically tricky if they swap.
      *   *Solution:* Keep the directive private until Round 2. In Round 2, I (the instructor) or a designated "Later Self" actor reads the directive, but the student *whose directive it is* must play the "Later Self" arguing against it? No, that breaks the "Earlier Self" authority.
      *   *Better Solution:* Student A drafts. Student B plays "Later Self A". Student C plays "Adjudicator". Student D plays "Observer/Recorder". Then rotate? Too complex for 90 mins.
      *   *Simplest Robust Solution:*
          1.  All draft directives (Earlier Self).
          2.  Collect and redistribute randomly (ensuring no one gets their own).
          3.  Pod 1 gets Case 1 (Directive X vs. Later Self Y). They rule. Rule goes on board.
          4.  Pod 2 gets Case 2. Must follow Rule 1. They rule. Rule 2 goes on board.
          5.  *Crucial Twist:* In the final debrief, reveal who wrote what. The student who wrote Directive X sees Pod 1's ruling. The student who played Later Self Y sees how their argument fared.
          *   *Wait, the prompt wants:* "argue against one — their own."
          *   *Okay, let's stick closer to the prompt:* Student A drafts. In Round 2, Student A *must* argue as the Later Self against their own directive. But who adjudicates? The Pod.
          *   *Okay, Plan:*
              1.  Draft individually.
              2.  Form Pods of 4.
              3.  Within Pod: Student A presents their Directive (as Earlier Self). Student A *also* argues as Later Self (this is the cognitive dissonance). The other 3 adjudicate.
              4.  *Precedent:* Pod 1 adjudicates. Sets Rule 1. Pod 2 adjudicates (must follow Rule 1). Sets Rule 2.
              5.  *Problem:* If Pod 2 must follow Rule 1, but Rule 1 was set by Pod 1 based on a different directive, does it fit?
              6.  *Fix:* The "Court" is the whole room. One case at a time. 16 students is too many for one case.
              7.  *Fix 2:* 4 Pods. Each pod handles one case sequentially.
              8.  *Case Selection:* We need 4 cases. Pick 4 volunteers to have their directives adjudicated. The rest of the pod acts as the "Later Self" council or Adjudicators.
              9.  *Actually, let's maximize participation:* Everyone drafts. 4 Pods. Each Pod selects *one* member's directive to adjudicate publicly. That member must argue *against* their own directive (as Later Self). The other 3 are the Ethics Committee. They issue a Ruling + A General Rule.
              10. The Rules accumulate on the board.
              11. This ensures the "precedent" mechanic works (Pod 2 is bound by Pod 1's rule).

  3.  **Drafting the Materials:**

      *   Need a Directive Form (4 fields).
      *   Need a Condition Sheet (DHD description).
      *   Need a Ruling Sheet (for the Ethics Committee).
      *   Need the "Sealed Slip" for the real stake.

  4.  **Developing the Timeline:**

      *   0-10: Intro & Condition.
      *   10-25: Drafting Directives (Earlier Self).
      *   25-30: Sealed Slips (Real Stake).
      *   30-45: Pod Prep (Select case, prepare arguments).
      *   45-75: The Adjudication Rounds (4 pods x 7.5 mins). *Tight.*
      *   75-85: Enforce Sealed Slips & Reveal.
      *   85-90: Closing.
      *   *Wait, Debrief needs more time.* The prompt asks for a substantial debrief mapping philosophical terrain. I need to cut the adjudication time or overlap the debrief.
      *   *Revision:* 4 Pods x 5 mins = 20 mins.
      *   0-10: Intro.
      *   10-25: Drafting.
      *   25-30: Sealed Slips.
      *   30-50: Adjudication (4 rounds x 5 mins).
      *   50-90: Debrief (40 mins). This is where the learning happens.

  5.  **Refining the "Precedent" Mechanic:**

      *   To make sure the "trap" springs, the rules must be general. "If the Later Self expresses contentment, the Directive is void."
      *   Pod 1 sets this. Pod 2 *must* use it. If Pod 2's case involves a directive that *relied* on contentment being irrelevant, Pod 2 is now forced to void it.
      *   This requires the Instructor to act as the "Supreme Court" enforcing the precedent rules. I need to explicitly state this in the rules.

  6.  **Addressing the "Failure Analysis":**

      *   *Vague Directives:* Students might write "Don't let me suffer." Need to force specificity in the template.
      *   *Competence vs. Values:* Students might argue the Later Self is "crazy." Need to stipulate the Later Self is *medically competent* but *axiologically shifted*.
      *   *Leniency:* Pod 1 might say "Follow the directive always." Then Pod 2 has no tension. I need to prime Pod 1 to find a conflict.
      *   *The "Own Directive" constraint:* If I argue against my own directive, I might just say "I changed my mind." I need to force the argument to be about *authority*, not just preference.

  7.  **Addressing the "Limitations":**

      *   The simulation is clean; real life is messy.
      *   The emotional weight of real dementia is missing.
      *   The "paper" doesn't actually carry weight in the room unless I enforce it.

  8.  **Final Polish of the Plan:**

      *   *Condition Name:* "Chrono-Axiological Drift" (sounds philosophical/medical).
      *   *Template:* Ensure the Meta-Clause field is prominent.
      *   *Precedent Board:* Explicitly designate a space.
      *   *Sealed Slip:* Make it concrete. "Write your name and 'I owe the group a coffee'."

  9.  **Review against Constraints:**

      *   90 mins? Yes.
      *   16 students? Yes (4 pods of 4).
      *   No reading/clinical knowledge? Yes (Condition provided).
      *   4 Fields? Yes.
      *   Precedent Board? Yes.
      *   Sealed Slip? Yes.
      *   Debrief mapping? Yes.
      *   Failure analysis? Yes.

  10. **Writing the Output:** (Self-Correction during drafting)
      *   *Correction on Adjudication:* If Pod 1 sets a rule, Pod 2 is bound. This means Pod 2's deliberation is constrained. I need to make sure the Instructor acts as the "Bailiff of Precedent" to stop Pod 2 from ignoring Pod 1's rule.
      *   *Correction on "Argue against their own":* To make this work, the student whose directive it is must play the "Later Self." The other 3 are the "Proxy/Adjudicator." This ensures the *author* feels the betrayal of their own earlier rules.
      *   *Timeline Check:* 40 mins for debrief is good. 20 mins for adjudication is tight but doable if I keep strict time.

  11. **Final check on "Real Stake":** The prompt says "opened and enforced at the end." If the session ends at 90 mins, enforcing "stay 5 mins" is easy. Enforcing "write on board" is easy. Let's go with "Write a specific phrase on the whiteboard before leaving." It leaves a physical trace.

  12. **Philosophical Mapping:** Ensure the debrief questions hit: Authority source, Predictive Accuracy, Self-Defeat.

  13. **Failure Modes:** Be specific. "The Meta-Clause Trap," "The Competence Dodge," "The Precedent Loophole."

  Let's assemble.
answer: |-
  # Session Plan: The Authority of the Absent Self

  **Course:** Autonomy & Personal Identity (Upper-Level Seminar)
  **Time:** 90 Minutes
  **Participants:** 16 Students (4 Pods of 4)
  **Goal:** To viscerally experience the fragility of advance directives when the "Later Self" is coherent but axiologically distinct from the "Earlier Self."

  ---

  ## I. Materials List (Photocopy/Prep)

  1.  **Condition Sheet (16 copies):** Describes the fictional syndrome (see below).
  2.  **Directive Form (16 copies):** The 4-field template.
  3.  **Adjudication Record (4 copies):** One per pod, for writing the "General Rule."
  4.  **Sealed Slips (16 small pieces of paper + 1 envelope):** For the real stake.
  5.  **Whiteboard/Blackboard:** Designate the left third as **THE PRECEDENT BOARD**. Do not erase this during class.
  6.  **Timer:** Visible to you (projected or physical).

  ---

  ## II. The Fictional Condition: "Chrono-Axiological Drift" (CAD)

  *Print this on the Condition Sheet.*

  > **Diagnosis:** Chrono-Axiological Drift (CAD)
  > **Progression:** Slow, irreversible, non-fatal.
  > **Cognitive Status:** The subject retains full logical reasoning, memory of facts, and linguistic competence. They are not "confused."
  > **Axiological Status:** Long-range projects, evaluative commitments, and narrative identity markers dissolve. The subject loses the capacity to care about who they *were*. They become intensely present-directed.
  > **Affective Status:** The subject reports high levels of contentment and satisfaction with their current state, even if that state contradicts their earlier values (e.g., an earlier ascetic may become a hedonist; an earlier workaholic may become idle).
  > **Insight:** The subject acknowledges their past self wrote a directive but views that person as a stranger whose reasons no longer apply to them.

  ---

  ## III. The Directive Form

  *Print this on the Directive Form.*

  > **ADVANCE DIRECTIVE: CAD PROTOCOL**
  >
  > **1. Substantive Instruction:** (What must be done or avoided if the trigger fires? Be specific.)
  > _________________________________________________________________________
  >
  > **2. The Trigger:** (What specific behavior or statement counts as CAD having taken hold? e.g., "If I express desire to stop writing.")
  > _________________________________________________________________________
  >
  > **3. Defeasance Clause:** (Can my Later Self override this? If yes, who adjudicates the conflict? If no, state "None.")
  > _________________________________________________________________________
  >
  > **4. Meta-Clause:** (How is this document to be interpreted if my Later Self claims it no longer represents me? e.g., "Any objection is proof of the Trigger.")
  > _________________________________________________________________________
  >
  > **Signed:** ___________________ (Earlier Self)

  ---

  ## IV. Minute-by-Minute Timeline

  ### 00:00 – 00:10 | Introduction & Stipulation
  *   **Instructor:** Briefly state the goal: "We are testing the authority of the Earlier Self over the Later Self."
  *   **Hand out Condition Sheet.** Read the CAD description aloud. Emphasize: *The Later Self is not incompetent. They are just different.*
  *   **Form Pods:** 4 groups of 4 students.

  ### 00:10 – 00:25 | Drafting (The Earlier Self)
  *   **Task:** Every student fills out a Directive Form.
  *   **Constraint:** You are writing for a future you who has CAD. You must assume the Later Self will *want* to violate this directive.
  *   **Instruction:** "Write the Meta-Clause (Field 4) carefully. This is your only weapon once you are gone."
  *   **Collection:** Collect all forms. Shuffle them. **Return them randomly.**
      *   *Crucial:* Ensure no one gets their own. (If they do, swap manually).
      *   *Note:* Each student now holds a stranger's directive, but they will be arguing about their *own* in the next round. (Wait, correction for the "argue against their own" requirement).
      *   *Correction for Flow:* To meet your requirement ("argue against one — their own"), we cannot swap the forms yet.
      *   *Revised Step:* Students keep their **own** forms. They will use them in the pod.

  ### 00:25 – 00:30 | The Real Stake (Sealed Slips)
  *   **Task:** Hand out small slips.
  *   **Instruction:** "Write your name and a trivial commitment. Example: 'I will wipe the whiteboard' or 'I owe the person to my left a coffee.' Seal it in the envelope. I will hold this."
  *   **Instructor:** Place envelope in a bag/pocket. Do not look at contents.

  ### 00:30 – 00:40 | Pod Preparation
  *   **Task:** Within each pod, select **one** volunteer whose directive will be adjudicated.
  *   **Roles:**
      1.  **The Later Self:** The volunteer (author of the directive). They must argue *against* their own earlier instruction.
      2.  **The Proxy:** One student argues *for* the directive (channeling the Absent Earlier Self).
      3.  **The Adjudicators:** Two students decide the case.
  *   **Prep:** The Later Self reviews their own Field 4 (Meta-Clause) and prepares to explain why it should not bind them now. The Proxy prepares to enforce it.

  ### 00:40 – 01:00 | The Adjudication Rounds (Sequential)
  *   **Mechanism:** Pods present one after another. **Precedent accumulates.**
  *   **Round 1 (Pod 1):** 5 Minutes.
      *   Present the conflict.
      *   Adjudicators decide: Honor Directive or Honor Later Self?
      *   **Mandatory:** They must formulate a **General Rule** (e.g., "Contentment trumps prior commitment"). Write this on **THE PRECEDENT BOARD**.
  *   **Round 2 (Pod 2):** 5 Minutes.
      *   Present conflict.
      *   **Constraint:** Adjudicators *must* apply Pod 1's Rule. They can distinguish the case, but cannot contradict the Rule.
      *   They add a **New Rule** (refining or extending the first) to the Board.
  *   **Round 3 (Pod 3):** 5 Minutes. (Bound by Rules 1 & 2).
  *   **Round 4 (Pod 4):** 5 Minutes. (Bound by Rules 1, 2, & 3).
  *   **Instructor Role:** Act as "Bailiff of Precedent." If Pod 3 tries to ignore Pod 1's rule, interrupt: "That violates Precedent 1. Adjust your ruling."

  ### 01:00 – 01:10 | The Reveal & Enforcement
  *   **Task:** Open the Sealed Envelope.
  *   **Action:** Read the commitments. Force the students to acknowledge them.
  *   **Point:** "You signed this 40 minutes ago. You are a different person now (tired, bored, changed mind). Why does this slip bind you? Is it the paper? The signature? The Earlier Self's authority?"

  ### 01:10 – 01:30 | Debrief (Philosophical Mapping)
  *   (See Section VI below).

  ---

  ## V. Rules of Engagement (Read Aloud at 00:30)

  1.  **The Later Self is Competent:** You cannot argue the Later Self is "sick" or "confused." They are rational, just value-shifted.
  2.  **The Precedent is Law:** Once a General Rule is written on the Precedent Board, all subsequent pods are bound by it. You must use it to justify your ruling.
  3.  **The Meta-Clause is Active:** The Earlier Self's interpretation of *when* they are overruled counts as evidence.
  4.  **No Abstention:** Adjudicators must rule either "Honor Directive" or "Honor Later Self." No compromises.

  ---

  ## VI. The Debrief: Mapping the Terrain

  *Do not let them vent generally. Drive these four questions.*

  **1. The Source of Authority (01:10–01:18)**
  *   **Ask:** "Pod 1, why did you bind the Later Self? Pod 4, why did you (or why did you not)?"
  *   **Map:** Distinguish between **Status-Based Authority** (the Earlier Self has a right to rule because it was *me*) vs. **Interest-Based Authority** (the Earlier Self rules only if it benefits the Later Self).
  *   **Point:** If you honored the directive, you treated autonomy as a diachronic narrative (one life). If you voided it, you treated autonomy as synchronic moments (series of selves).

  **2. The Meta-Clause Trap (01:18–01:23)**
  *   **Ask:** "Look at Field 4 on the forms. Many of you wrote: 'If I object, I am sick.' When you played the Later Self, how did it feel to be trapped by your own definition?"
  *   **Map:** This is the problem of **Self-Binding**. Can a self coherently set the terms of its own defeat? If the Later Self rejects the Meta-Clause, is that rejection valid? If yes, the Directive is toothless. If no, the Later Self is a prisoner.

  **3. Prediction vs. Authority (01:23–01:27)**
  *   **Ask:** "Did anyone argue that the Earlier Self was just 'wrong' about what they would want?"
  *   **Map:** Distinguish **Predictive Accuracy** (The Earlier Self guessed wrong about future desires) from **Normative Authority** (The Earlier Self has a right to command even if they guessed wrong). The Directive claims the latter, but often relies on the former.

  **4. The Paper Weight (01:27–01:30)**
  *   **Ask:** "Look at the Sealed Slips. Why do you feel obligated to fulfill that trivial promise? Is it the ink?"
  *   **Map:** The "Paper" is a proxy for social enforcement. In the clinic, the paper has legal weight. In this room, it had only the weight you gave it. In dementia care, the law is often absent. The "Paper" is a ghost.

  ---

  ## VII. Failure Analysis: What Will Go Wrong

  *Be prepared for these specific breakdowns.*

  **1. The "Competence Dodge"**
  *   **Failure:** Students playing Adjudicator will claim the Later Self (the volunteer) is "obviously impaired" because they want to eat cake instead of write poetry.
  *   **Why:** It's hard to separate *values* from *capacity*.
  *   **Fix:** You must intervene. "The stipulation says they are medically competent. You cannot rule on capacity. You must rule on *authority*."

  **2. The "Lenient Precedent"**
  *   **Failure:** Pod 1 creates a rule like "Always honor the Earlier Self."
  *   **Consequence:** Pods 2, 3, and 4 have no conflict. The activity flattens.
  *   **Fix:** If Pod 1 does this, you (as Bailiff) introduce a "Hard Case" variation for Pod 2. "Suppose the Later Self is in physical pain if the Directive is followed. Does your rule still hold?" Force the crack in the precedent.

  **3. The "Jokey Directive"**
  *   **Failure:** A student writes "If I have CAD, kill me" or "Feed me only pizza."
  *   **Consequence:** Trivializes the ethical weight.
  *   **Fix:** During the drafting phase (00:10), circulate. If you see a joke, lean in. "This is a binding legal document in this simulation. If you write this, Pod 1 *will* have to decide if you get killed. Make it count."

  **4. The "Precedent Loophole"**
  *   **Failure:** Pod 2 distinguishes their case so narrowly that Pod 1's rule becomes meaningless.
  *   **Consequence:** The "trap" of the Precedent Board fails.
  *   **Fix:** Enforce strict stare decisis. "Pod 1 ruled that Contentment Trumps. Pod 2, your case involves contentment. You cannot ignore that. You must explain why this contentment is *different*."

  **5. The "Later Self" Performance**
  *   **Failure:** The student playing the Later Self argues too weakly because it's their own directive. They feel guilty betraying themselves.
  *   **Consequence:** No tension.
  *   **Fix:** Instruct the "Proxy" (the student arguing *for* the directive) to be aggressive. The conflict must be externalized.

  ---

  ## VIII. Limitations: What You Must Supply

  *This activity cannot reproduce the following. You must speak to them in the closing minutes.*

  1.  **The Emotional Cost of Care:** In the simulation, overriding a directive is an intellectual exercise. In reality, it involves withholding treatment or forcing medication. The *guilt* of the caregiver is missing. You must name this: "You felt intellectual tension. A spouse feels moral injury."
  2.  **The Fog of Diagnosis:** In the simulation, CAD is clear. In reality, we never know if it's "Drift" or "Depression" or "Delirium." The epistemic uncertainty is the real killer of autonomy.
  3.  **The Absence of the Earlier Self:** In the room, the Earlier Self is present (the student drafting). In the clinic, they are dead or gone. The "voice" on the paper is much quieter when there is no one in the room to remember who wrote it.
  4.  **The Legal Reality:** In this room, the Precedent Board is a game. In the hospital, the Directive is a shield against liability. Doctors often follow directives not out of respect for the Earlier Self, but to avoid being sued. That cynical reality is absent here.

  **Final Instructor Note:**
  The success of this session depends on your rigidity regarding the **Precedent Board**. If you allow Pod 3 to ignore Pod 1's rule, the lesson collapses into "ethics is subjective." If you enforce the rule, they feel the weight of a system they built but no longer control. That is the feeling of the Later Self.
