prompt: |-
  You're a philosopher who works on causation and the act/omission distinction, so please slow down and be careful instead of reaching for the usual trolley-problem stuff.

  In a med ethics seminar someone kept saying "letting die is killing" and used it to argue that switching off a ventilator is just as much murder as smothering the patient. I dont think its that simple but I can't articulate why. Brainstorm first, then lay out the distinct precise things that slogan could actually be claiming — I mean things like whether an omission can literally be a cause of the death at all, or only a "cause" in some looser sense; whether killing and letting die are the same act or merely morally on par; whether "letting die" smuggles in a duty to act that has to be argued for separately; and whether the claim is really about the definition of "killing" in law or ordinary language rather than about metaphysics at all. For each reading, say whether it's trivially true, substantive and defensible, or just false, and tell me which reading would actually get my classmate his conclusion that the doctor is a murderer. Lay it out as a numbered menu I can bring back to class.
