prompt: |-
  I'm in my third year and taking a module on autonomy and the self — we've just finished the bit about whether you can bind your future self, and next week it's my turn to run the seminar on advance directives and dementia, so what I need is a handout rather than an essay. Specifically I want a decision tree: start from the commitment that basically everyone in the room already shares — that it can be legitimate for someone to sign an advance directive refusing treatment for a dementia they don't yet have — and then split that commitment by the questions on which people who share it actually come apart, until each branch ends in a named position on how much authority the earlier self has over the later one. Please don't give me a reading list or bother about who said what; I want the positions themselves, named descriptively if you like, and I'd much rather have the logical space than a roll-call of famous people.

  Some nodes I think have to be on the tree, though add or cut as you see fit: whether the demented person is numerically the same person as the signer (and if you say no, what that does to a directive that starts to look like a promise made to a stranger); whether autonomy is something only a presently competent self can exercise, or something you can bank in advance; whether the directive's authority rests on the earlier self's interests, on its authorship of the later self, or on a commitment it made and can now be held to; and whether the demented person's present contentment — or present protest — counts for anything at all, or counts only up to some threshold of remaining psychological continuity. I'd also like the tree to take seriously a distinction I keep trying to make in my own head: an advance directive as a will (it only takes effect once the person who made it has gone), as a contract with whoever ends up caring for you, and as a self-binding precommitment of the Ulysses sort — I think these generate different answers and I want to see where they land. Same for the difference between a directive that governs a one-off transition decision (treat the chest infection or not) and one that governs ongoing goods (whether I'm to be kept comfortable, whether I'm to be wheeled to the day room), because I suspect some views can authorise the first but not the second.

  Aim for eight to twelve nodes and roughly six to nine leaves, phrase every node as a question someone could answer without already knowing which position it leads to, and where a leaf is a combination nobody actually defends, say so and tell me whether that's because the view is incoherent, unattractive, or just unexplored. Flag any pair of leaves your tree can't really separate instead of pretending the questions do the work. And please actually commit: tell me which leaf you'd defend and why, and which single branch you think is doing the most work in getting there — I dont want a survey with 'it depends' tacked onto the end of every path.
