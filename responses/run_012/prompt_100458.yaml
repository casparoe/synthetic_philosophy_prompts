answer: |-
  # SEMINAR HANDOUT: THE LOGIC OF ADVANCE DIRECTIVES
  **Module:** Autonomy and the Self | **Topic:** Dementia and Precedent Autonomy

  **Starting Premise:** We accept that it is *legitimate* for a competent person to sign an advance directive (AD) refusing treatment for a dementia they do not yet have. The questions below map the logical space of *why* and *how far* that legitimacy extends.

  ---

  ## THE DECISION TREE

  **Node 1: Identity**
  Is the person living with advanced dementia numerically identical to the person who signed the directive?
  *   **YES** → Go to Node 2.
  *   **NO** → Go to Node 3.

  **Node 2: Autonomy Model**
  Is autonomy a capacity that can only be exercised by a presently competent self, or is it a narrative property extended over time?
  *   **PRESENT ONLY** → *Leaf A: The Current Competence View* (The AD is merely advisory; only the demented self's current wishes count).
  *   **EXTENDED** → Go to Node 4.

  **Node 3: Obligation Source** (If Identity = NO)
  If the demented person is a "stranger," who is bound by the directive?
  *   **NO ONE** → *Leaf B: The Lapsed Promise* (The directive dissolves because the promisee no longer exists).
  *   **THE CAREGIVERS** → Go to Node 3b.

  **Node 3b: Contract vs. Morality** (If Identity = NO)
  Does the directive bind caregivers because of a prior contract, or as a moral request regarding the disposal of the "remains" of a person?
  *   **CONTRACT** → *Leaf C: The Third-Party Contract* (Caregivers are bound by agreement with the signer, regardless of the patient's status).
  *   **MORAL REQUEST** → *Leaf D: The Benevolent Stranger* (Caregivers should honor the request as they would a will, out of respect for the deceased signer).

  **Node 4: Mechanism of Authority**
  Does the directive function as a **Will** (taking effect because the 'self' has ended) or as a **Ulysses Precommitment** (binding the continuing self)?
  *   **WILL** → Go to Node 5.
  *   **PRECOMMITMENT** → Go to Node 6.

  **Node 5: The Terminus** (If Mechanism = WILL)
  If the AD is a Will, when does the "testator" die?
  *   **BIOLOGICAL DEATH** → *Leaf E: The Biological Will* (**FLAG:** Generally considered incoherent. A will cannot take effect while the testator is biologically alive and receiving care).
  *   **PSYCHOLOGICAL DEATH** → *Leaf F: The Narrative Death View* (The person died when dementia onset occurred; the AD governs the body that remains).

  **Node 6: Scope of Authority** (If Mechanism = PRECOMMITMENT)
  Does the directive govern only one-off transition decisions (e.g., treating pneumonia) or ongoing goods (e.g., daily routine, comfort)?
  *   **TRANSITION ONLY** → Go to Node 7.
  *   **ONGOING GOODS** → Go to Node 8.

  **Node 7: Transition & Protest** (If Scope = TRANSITION)
  If the demented self actively protests the treatment refusal (e.g., begs for antibiotics), does this protest veto the AD?
  *   **YES** → *Leaf G: The Soft Precommitment* (Past self sets the default, present self holds the veto).
  *   **NO** → Go to Node 9.

  **Node 8: Ongoing & Contentment** (If Scope = ONGOING)
  If the demented self is content (e.g., enjoys being wheeled to the day room contrary to the AD), does this contentment override the directive?
  *   **YES** → *Leaf H: The Critical Interest Override* (Past self's values rule unless they conflict with present self's basic welfare).
  *   **NO** → *Leaf I: The Absolute Ulysses* (Past self's authority is absolute, even over daily pleasures).

  **Node 9: Continuity Threshold** (If Protest = NO VETO)
  Is there a threshold of psychological connectedness below which the directive lapses, even if identity holds?
  *   **YES** → *Leaf J: The Threshold View* (Authority degrades as psychological links fade).
  *   **NO** → *Leaf K: The Authorship View* (Authority rests on the act of creation, not the continuity of the created).

  ---

  ## MAP OF POSITIONS (THE LEAVES)

  1.  **The Current Competence View:** Autonomy is strictly present-tense. ADs have no authority over a demented self.
  2.  **The Lapsed Promise:** Identity break severs the moral link. The AD is void.
  3.  **The Third-Party Contract:** Authority lies in the agreement between signer and doctor, not the patient's identity.
  4.  **The Benevolent Stranger:** The patient is a new being; honoring the AD is a duty to the *dead* signer, not the living patient.
  5.  **The Biological Will:** **[FLAG: INCOHERENT]** Attempts to treat the AD as a will while the body is still medically treatable.
  6.  **The Narrative Death View:** Dementia is the death of the person. The AD is a will governing a corpse that still moves.
  7.  **The Soft Precommitment:** The AD sets the plan, but current resistance signals a change in circumstances that voids it.
  8.  **The Critical Interest Override:** Past values rule, unless the present self is suffering. Contentment trumps precedent autonomy in daily life.
  9.  **The Absolute Ulysses:** The earlier self binds the later self completely. Present happiness is irrelevant if it violates the prior plan.
  10. **The Threshold View:** Authority is proportional to psychological continuity. Severe dementia dissolves the binding power.
  11. **The Authorship View:** The act of signing creates a binding norm that persists regardless of psychological erosion (provided identity holds).

  **Note on Indistinguishability:** *Leaf C (Third-Party Contract)* and *Leaf D (Benevolent Stranger)* often yield the same practical outcome (treatment is withheld), but they differ on *why*. C relies on professional ethics/contract law; D relies on respect for the deceased. In a seminar discussion, these may collapse unless you press on whether the caregiver can be released from the duty if they change their mind (Contract = No; Moral Request = Yes).

  ---

  ## MY COMMITMENT

  **The Position I Defend:** **Leaf 8 (The Critical Interest Override)** combined with **Leaf 10 (The Threshold View)**.
  I call this the **Two-Tier Threshold View**.

  **Why:**
  The "Absolute Ulysses" (Leaf 9) fails because it treats the demented self as a mere vessel, ignoring the moral reality of the sentient being currently occupying that vessel. If the demented self is content, forcing the "dignity" of the past self upon them becomes a form of tyranny, not autonomy. However, the "Current Competence" view (Leaf 1) is too weak; it ignores the fact that the demented self is the *creation* of the earlier self, who bore the burdens of life to get there.

  **The Critical Branch:**
  The branch doing the most work is **Node 6 (Scope: Transition vs. Ongoing)**.
  We must distinguish between **ending a life** (where the past self's view on dignity is paramount, as there is no future for the demented self to enjoy) and **living a life** (where the present self's experience is paramount). An AD should be absolute on life-sustaining treatment (Transition) because that decision is existential. It should be defeasible on daily care (Ongoing) because the present self's happiness is a real moral good that the past self cannot simply erase. This avoids the incoherence of the "Will" model (Leaf 5) while respecting the "Precommitment" intuition without sliding into tyranny.
