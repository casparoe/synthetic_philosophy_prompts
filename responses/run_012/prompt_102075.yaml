prompt: |-
  Hey, so I'm a third-year student and I'm in a philosophy of mind module right now, and our seminar leader somehow got a philosopher to come do a Q&A for our little student podcast next month. His whole thing is a Hofstadter-ish view: the self isn't some indivisible thing parked in one skull, it's more like a pattern, a set of habits and thoughts and ways of reacting, and that pattern can be spread across other people's heads — so when someone close to you dies, a real part of you is still running in them, and a part of them is still running in you. I have to write the questions and I definately don't want to just ask him to explain the view for twenty minutes, everyone's heard that bit already.

  Can you draft like eight to ten questions, each with a follow-up keyed to the answer he's most likely to give? Stuff I want covered:

  - whether he means the spread-out self literally or just as a nice way of talking, and what would actually tell us which it is;
  - the obvious push that if a self is a pattern that gets copied into other brains, why doesn't it leak into everyone the person ever met — and what stops the boundary of an I from being totally arbitrary. For that one I want a follow-up that won't let him just say the amount of sharing is a matter of degree and leave it there;
  - whether two people who've lived together for forty years and finish each other's sentences are one self or two, and whether his view implies an I could have two streams of experience at once — and if so, what that's like from the inside, or whether that question even makes sense for him;
  - what happens in dementia: is the self shrinking, or being replaced, and does he count that as the same kind of loss as death;
  - and then finish on what could ever count against the view, because as far as I can tell it explains everything and predicts nothing.

  If you can also sneak in one about whether this makes death a matter of degree, and whether that's meant to be comforting or just confusing, that'd be great. Cheers.
