answer: |-
  1. You risk conflating the moral status of an act with the psychological cost to the agent, which may shift the focus from supererogation to virtue without resolving the deontic status of the act itself. If the baseline is purely psychological, an agent could theoretically lower their duty by becoming more callous, which inverts the normative direction.

  2. The ratchet mechanism assumes moral habituation always increases obligation, but it fails to account for burnout or the possibility that repeated sacrifice depletes rather than elevates the baseline. This suggests the ratchet might be an artifact of the metaphor rather than a stable feature of moral psychology.

  3. The subjectivism charge lands hard because tying duty to individual disposition allows two agents facing identical circumstances to have fundamentally different moral obligations based solely on internal states. This threatens the action-guiding nature of morality, as agents cannot know their duties without deep introspection regarding their own sacrifices.

  4. While the opacity point is intriguing, it creates an epistemic problem for praise, since we cannot reliably praise supererogatory acts if we cannot access the agent's baseline. This undermines the social function of supererogation, which often relies on public recognition of exceeding shared standards.

  5. Consider a saint who finds no cost in sacrificing everything; on your view, nothing they do is supererogatory, yet intuitively their acts remain beyond the call for normal agents. This suggests the baseline should be objective or species-typical rather than indexed to individual disposition.
