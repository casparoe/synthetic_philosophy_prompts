prompt: |-
  I'm an undergraduate taking a course on decision theory, and next week I'm running a 75-minute session for our seminar group of about fifteen students on Pascal's mugging. I'd like them to play something before the argument is named, so that they walk into it themselves rather than recognising it. What I have in mind is a betting game with token bankrolls and no real money: a stranger makes a series of offers, each a small stake for a small chance at a much larger payoff, culminating in one offer with a probability on the order of one in a trillion and a payoff that is enormous but strictly finite. Please work the design out in detail — the round-by-round stakes, probabilities and payoffs, the rules, and how a class resolves a win that is overwhelmingly unlikely to occur, or what happens if it never does. I want two things built in. First, keep every payoff finite: I don't want them to escape by declaring infinities incoherent. Second, arrange the rules so that any reason a student gives for refusing the final offer would, applied to an earlier round they accepted, have cost them tokens; the debrief can then turn on which principle they are willing to give up, and where. I'd also like a twist in the last round — a rival offer that a consistent expected-value maximiser would have to accept as well, so that the strategy that was winning becomes unstable at exactly the point where it matters. The debrief should map the rounds onto the argument and its standard replies, and be candid about which parts of this are settled and which are genuinely contested among people who work on it, whether the right response is to bound utilities, to reject the setup, or to accept the conclusion. Tell me too what the activity cannot reproduce and I will have to supply myself, and what will predictably go wrong the first time I run it. Format the whole thing as a JSON object with the fields: title, materials, rounds (an array, each entry with stake, probability, payoff and purpose), rules, timeline, debrief_map, failure_modes, limits_of_the_activity, settled_vs_contested.
reasoning: |-
  Here's a thinking process that leads to the suggested JSON output:

  1.  **Analyze the Request:**
      *   **User:** Undergraduate student teaching a decision theory seminar.
      *   **Topic:** Pascal's Mugging.
      *   **Task:** Design a 75-minute session including a betting game.
      *   **Goal:** Students should experience the dilemma before hearing the name/argument.
      *   **Constraints:**
          *   15 students.
          *   75 minutes total.
          *   Token bankrolls (no real money).
          *   Payoffs must be *finite* (no infinity escape).
          *   Structure: Series of offers, escalating payoff/probability ratio, culminating in a 1-in-trillion offer.
          *   Trap: Reasons for refusing the final offer should contradict earlier accepted offers (costing tokens).
          *   Twist: A rival offer in the last round that destabilizes the EV-maximizing strategy.
          *   Debrief: Map rounds to arguments/replies, distinguish settled vs. contested issues.
          *   Honesty: Acknowledge what the activity can't reproduce and what might go wrong.
          *   **Format:** JSON object with specific fields (`title`, `materials`, `rounds`, `rules`, `timeline`, `debrief_map`, `failure_modes`, `limits_of_the_activity`, `settled_vs_contested`).

  2.  **Deconstruct the Game Design:**
      *   *Objective:* Force students to confront the tension between Expected Value (EV) maximization and intuitive plausibility/credence.
      *   *Currency:* "Decision Tokens" (DT). Start with enough to survive small losses but not enough to ignore big risks blindly. Let's say 100 DT start.
      *   *Rounds:* Need a progression.
          *   Round 1: Obvious bet (High prob, low reward). Establishes EV logic.
          *   Round 2: Reasonable bet (Med prob, med reward). Reinforces EV.
          *   Round 3: Risky bet (Low prob, high reward). Starts the tension.
          *   Round 4: The Mugging (Tiny prob, massive reward). The crux.
          *   Twist: A competing hypothesis or "counter-mugging" in Round 4 to show instability.
      *   *The Trap:* If they reject Round 4 because "probability is too low," why did they accept Round 3? If they reject because "payoff is unrealistic," why did they accept Round 2?
      *   *The Twist:* In Round 4, offer two mutually exclusive hypotheses (e.g., "I am a Wizard" vs. "I am a Demon") both promising massive rewards for a token, but they can't both be true. Or, simpler: A "Counter-Mugger" offers the same odds but a negative outcome if you don't pay. Let's go with the "Rival Hypothesis" twist. If you pay the Mugger, you might miss the Counter-Mugger's reward. Actually, the prompt asks for a rival offer a consistent EV maximizer would *have* to accept as well, making the strategy unstable.
      *   *Refined Twist:* In the final round, there are *two* strangers. Stranger A asks for 10 tokens for a 1 in $10^{12}$ chance of $10^{15}$ tokens. Stranger B asks for 10 tokens for a 1 in $10^{12}$ chance of $10^{15}$ tokens. You only have 10 tokens left. You can't pay both. EV says pay either. But paying one excludes the other. This creates a decision instability. Or, simpler for a classroom: The "Simulation" twist. If you pay, you signal you are gullible, and a second mugger appears.
      *   *Better Twist for EV Maximizer:* The "Pascal's Wager" style conflict. Two mutually exclusive claims with infinite (or near infinite) EV. Since we need finite payoffs, let's use the "Many Muggers" problem. If you accept the logic for one, you must accept it for *anyone* making the claim. If 1000 muggers approach, you go bankrupt.
      *   *Selected Twist:* In Round 4, reveal that *every* student is approached by a unique Mugger claiming to be from a different dimension. If the logic holds, everyone should pay. But the total tokens in the room are fixed. If everyone pays, the system breaks. Or, simpler: A "Counter-Offer" that negates the first. Let's stick to the prompt's request: "a rival offer that a consistent expected-value maximiser would have to accept as well, so that the strategy that was winning becomes unstable."
      *   *Idea:* Round 4 Offer A: Pay 10, 1 in $10^{12}$ chance of $10^{16}$. Round 4 Offer B (immediately after): Pay 10, 1 in $10^{12}$ chance of $10^{16}$ (Claim: The first guy was a liar, I am the real one). You only have 10 tokens. You must choose. EV is identical. Choice is arbitrary. This highlights the lack of decision guidance.
      *   *Actually, let's make it sharper:* The "Bounded Utility" trap. If they bound utility to avoid the mugger, show them they lost money in Round 3.
      *   *Let's finalize the Rounds:*
          *   R1: 1 token, 50% chance, 3 tokens payoff. (EV +0.5). Safe.
          *   R2: 2 tokens, 10% chance, 25 tokens payoff. (EV +0.5). Risky but okay.
          *   R3: 5 tokens, 1% chance, 600 tokens payoff. (EV +1.0). High risk, high reward.
          *   R4: 10 tokens, 1 in $10^{12}$ chance, $10^{15}$ tokens payoff. (EV Massive). The Mugging.
          *   Twist: In R4, if they pay, they are told "Actually, there are 15 muggers (one per student). Only one can be telling the truth." Now the probability drops to 1 in $15 \times 10^{12}$. But the EV is still huge. But you can't pay all.
          *   *Wait, simpler Twist:* "The Anti-Mugger." If you pay the Mugger, an Anti-Mugger appears who says "I will destroy your tokens unless you pay me not to." This leads to infinite regress.
          *   *Let's go with the "Rival Hypothesis" as requested:* In Round 4, present two slips. Slip A: "I am a Time Traveler." Slip B: "I am a Dimensional Lord." Both ask for 10 tokens. Both promise $10^{15}$. Probabilities are identical. You have 10 tokens. You must pick one or neither. EV says pick one. But there's no epistemic reason to pick A over B. This shows the decision procedure is underdetermined.

      *   *Winning Condition:* Most tokens at the end.
      *   *Resolution:* Since the final probability is 1 in a trillion, it *will not* happen in class. The "win" is theoretical. The instructor must act as the "Bank of the Universe" and honor the theoretical EV if they took the bet, OR simply acknowledge no one wins the jackpot and discuss the *decision* to take the bet.
      *   *Correction on Resolution:* The prompt asks: "how a class resolves a win that is overwhelmingly unlikely to occur, or what happens if it never does."
      *   *Solution:* The game ends after Round 4. If a student took the Round 4 bet, they are "Bankrupt" in practical terms (spent tokens) but "Rich" in EV terms. The instructor declares that since the event didn't trigger, they have 0 tokens. *However*, to make the point stick, the instructor should offer to "buy out" their ticket at its EV value (in course credit or candy) to show the tension. No, that's too complex.
      *   *Better:* The game is about *survival*. If you run out of tokens, you are out. Round 4 costs 10. If they have 10, they go to 0. If they lose, they have 0. If they win, they have $10^{15}$. Since they won't win, anyone who takes Round 4 ends with 0. Anyone who refused keeps their stash. *This punishes EV maximization.* This is perfect for the debrief. The lesson is: EV maximization leads to ruin in single-shot cases with low prob.
      *   *Wait, the prompt wants:* "any reason a student gives for refusing the final offer would, applied to an earlier round they accepted, have cost them tokens."
      *   *So:* If they refuse R4 because "prob is too low," they should have refused R3. If they refused R3, they have fewer tokens.
      *   *Resolution:* The instructor acts as the Bank. If the dice roll doesn't hit, the tokens are gone. The "Winner" is the person with the most tokens *after* the dust settles. Usually, this will be the person who stopped at R2 or R3. This creates the tension: The EV maximizer goes bust. The heuristic player survives. The debrief explains *why* EV failed (single shot vs repeated).

  3.  **Drafting the Content (Iterative refinement for JSON):**

      *   *Title:* "The Finite Mugging Protocol."
      *   *Materials:* Tokens, slips of paper, dice (or random number generator projected).
      *   *Rounds:* Need specific numbers.
          *   Start: 100 Tokens.
          *   R1: Cost 10, Prob 0.5, Pay 25. (EV 12.5, Net +2.5). Very safe.
          *   R2: Cost 10, Prob 0.1, Pay 120. (EV 12, Net +2). Reasonable.
          *   R3: Cost 10, Prob 0.01, Pay 1500. (EV 15, Net +5). Risky.
          *   R4: Cost 10, Prob $10^{-12}$, Pay $10^{15}$. (EV $10^3$, Net +990). Mugging.
      *   *Twist:* In R4, offer two mutually exclusive tickets. Ticket A (Aliens) and Ticket B (Demons). Both cost 10. You only have 10. You must choose A, B, or None. EV says A or B. Epistemology says no reason to prefer A over B.
      *   *Rules:* Single shot per round. Tokens are life. If you hit 0, you're out (or can't bet further).
      *   *Timeline:* 75 mins. 10 intro, 30 game, 35 debrief.
      *   *Debrief Map:* R1/R2 = Standard Risk. R3 = High Variance. R4 = Pascal's Mugging. Twist = Indifference/Instability.
      *   *Failure Modes:* Students laugh at R4. Students go bankrupt early. Students collude.
      *   *Limits:* Can't simulate repeated trials (Law of Large Numbers). Can't simulate actual existential risk.
      *   *Settled vs Contested:* Bounded utility is popular but controversial. Rejection of EV in single cases is standard (Kelly criterion etc.) but pure EV is still a norm in some ethics.

  4.  **Refining the "Twist":**
      The prompt asks for a rival offer that a consistent EV maximizer would *have to accept as well*, making the strategy unstable.
      *   *Idea:* "The Mirror Mugger." Just as you hand over your 10 tokens for the 1 in $10^{12}$ chance, a second Mugger steps forward. "I am from the *opposite* dimension. If you gave tokens to the first guy, I will destroy you. If you give tokens to *me*, I will save you."
      *   *Better:* "The Competing Muggers." Two muggers. Both claim they can grant the reward. Both require 10 tokens. You have 10 tokens. You can pay Mugger 1, Mugger 2, or Neither.
      *   *EV Calculation:*
          *   Pay M1: EV = High.
          *   Pay M2: EV = High.
          *   Pay Neither: EV = 0.
      *   *Problem:* You can't pay both. If you pay M1, you lose the chance with M2. Since the claims are mutually exclusive (only one can be the true reality bender), the probability of *any* payout is halved if you consider the set of all muggers. But in the moment, they look identical.
      *   *Decision:* This forces the student to admit they are choosing arbitrarily, undermining the rationality of the choice.
      *   *Let's codify this:* Round 4 has two phases. 4a: The Offer. 4b: The Rival Offer. You must commit before 4b is revealed? No, reveal both simultaneously. "Here are two envelopes. One contains the contract for Reality A, one for Reality B. Only one is valid. Pick one."

  5.  **Refining the "Resolution":**
      How to handle the 1 in a trillion win?
      *   *Honesty:* Acknowledge it won't happen.
      *   *Mechanism:* Use a random number generator on screen. Set range 1 to $10^{12}$. Pick a number. If it matches, they win. (It won't).
      *   *Consequence:* Those who bet lose their 10 tokens. Those who didn't keep them.
      *   *Debrief Point:* EV maximization led to actual loss. Why? Because EV assumes repeatability. This was a single shot. This introduces the "Gambler's Ruin" vs "EV" debate.

  6.  **Addressing Specific Prompt Requirements:**
      *   *Finite Payoffs:* Ensure R4 payoff is huge but written as a number, not $\infty$.
      *   *Trap:* If they say "1 in a trillion is impossible," ask why they took R3 (1 in 100).
      *   *Twist:* Rival offer included.
      *   *Debrief:* Map rounds, settled vs contested.
      *   *Format:* JSON.

  7.  **Final Review of JSON Structure:**
      *   Check all keys: `title`, `materials`, `rounds`, `rules`, `timeline`, `debrief_map`, `failure_modes`, `limits_of_the_activity`, `settled_vs_contested`.
      *   Ensure `rounds` is an array of objects with `stake`, `probability`, `payoff`, `purpose`.
      *   Ensure tone is appropriate for an undergraduate seminar leader (peer-to-peer but authoritative on the material).

  8.  **Self-Correction on "Twist":**
      The prompt says: "a rival offer that a consistent expected-value maximiser would have to accept as well, so that the strategy that was winning becomes unstable at exactly the point where it matters."
      *   *Interpretation:* If I accept the logic for Mugger A, I must accept it for Mugger B. But I can't accept both (limited bankroll). Therefore, the logic forces me into a contradiction or arbitrary choice.
      *   *Implementation:* In Round 4, present two betting slips. Slip X and Slip Y. Both cost 10 tokens. Both promise $10^{15}$ tokens. Both claim probability $10^{-12}$. Claim: "Only one of us is telling the truth."
      *   *EV:* Both have positive EV.
      *   *Constraint:* Student has exactly 10 tokens (engineered by previous rounds).
      *   *Dilemma:* EV says "Buy a ticket." Rationality says "No basis to choose X over Y." If you choose X, you might have chosen the liar. If you choose neither, you violate EV maximization.

  9.  **Drafting the JSON content:**
      *   *Title:* "The Finite Mugging Protocol."
      *   *Materials:* Tokens (poker chips or paper), Projector (for RNG), Handouts (Contracts).
      *   *Rounds:* Carefully calibrated to deplete bankroll to exactly 10 by Round 4 if they play optimally/safely, or force a hard choice.
      *   *Start:* 50 Tokens.
      *   *R1:* Stake 5, Prob 0.5, Pay 12. (Net +1).
      *   *R2:* Stake 5, Prob 0.2, Pay 30. (Net +1).
      *   *R3:* Stake 10, Prob 0.05, Pay 250. (Net +2.5).
      *   *R4:* Stake 10, Prob $10^{-12}$, Pay $10^{15}$.
      *   *Wait, bankroll management:* If they start with 50.
          *   R1 (Bet 5): End with 45 or 57.
          *   R2 (Bet 5): End with 40/52 or 82.
          *   R3 (Bet 10): This gets messy.
      *   *Simplification:* Just give them a budget sheet. They decide how much to bet? No, prompt says "a stranger makes a series of offers." It's take it or leave it.
      *   *Revised Bankroll:* Start with 100.
      *   R1: Cost 10. (Left 90).
      *   R2: Cost 10. (Left 80).
      *   R3: Cost 20. (Left 60).
      *   R4: Cost 60. (All in).
      *   *Actually, to make the trap work:* They need to have accepted R1-R3 to feel the pressure of R4.
      *   *Let's standardize:* Start 100.
      *   R1: Stake 10, Prob 50%, Pay 25. (EV +2.5).
      *   R2: Stake 10, Prob 10%, Pay 120. (EV +2).
      *   R3: Stake 20, Prob 1%, Pay 2500. (EV +5).
      *   R4: Stake 60, Prob $10^{-12}$, Pay $10^{15}$. (EV Huge).
      *   *Twist:* In R4, there are two Strangers. Each wants 60 tokens. You only have 60.

      *   *Wait, one more check:* "Any reason a student gives for refusing the final offer would, applied to an earlier round they accepted, have cost them tokens."
      *   If they refuse R4 because "Probability is too low to matter," they should have refused R3 (1%).
      *   If they refuse R4 because "Payoff is unrealistic," they should have refused R2 (120 tokens is a lot for a student?). Maybe not.
      *   If they refuse R4 because "It's a scam," why did they trust the instructor in R1?
      *   *Okay, the logic holds.*

      *   *Debrief:* Need to map R1-R4 to Standard Decision Theory, Risk Aversion, Pascal's Mugging, and the "Many Muggers" objection.
      *   *Settled vs Contested:* Bounded utility is a common fix but technically violates VNM axioms. Rejection of EV for single cases is common but lacks a unified alternative theory.

      *   *Limits:* Cannot simulate true existential stakes. Cannot simulate infinite repeats.
      *   *Failure Modes:* Students treat it as a joke. Students refuse all bets (risk aversion). Students bet all on R1 and go bust (variance).
      *   *Mitigation:* Instructor must emphasize "This is a simulation of rationality, not gambling."

      *   *JSON Construction:* Ensure all strings are escaped properly. No trailing commas.

      *(Self-Correction during drafting JSON)*: Make sure the "Twist" is clearly described in the `rounds` array or `rules`. The prompt asks for the twist in the last round. I will put it in the `rounds` entry for Round 4.

      *(Final check on "Resolution")*: The prompt asks "how a class resolves a win that is overwhelmingly unlikely to occur". I will specify in `rules` that the instructor uses a cryptographic RNG live, and if it fails (which it will), the tokens are lost. This creates the "EV vs Reality" tension for the debrief.

      *(Final check on "Settled vs Contested")*: Be careful not to present bounded utility as the definitive solution, as it has its own problems (scope insensitivity). Present it as a leading candidate.

      *(Final check on "Limits")*: Acknowledge that real Pascal's Mugging involves moral weight (lives saved), not just tokens. Tokens are fungible; lives are not.

