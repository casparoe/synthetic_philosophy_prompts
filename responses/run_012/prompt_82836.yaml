answer: |-
  This is a high-stakes engineering challenge. You are building an ethical governor into an industrial control system. The goal is not to solve philosophy, but to encode a specific ethical policy (Sentience + Precaution) into a deterministic workflow that minimizes suffering without incentivizing black-market evasion.

  Below is the **Welfare Decision Protocol (WDP)**. This is the specification for the logic module you will implement. It is designed to be pre-loaded with scientific data (so the farmer doesn't need to read journals) while requiring operational input from the farmer (so the system knows what is physically possible).

  ### Part 1: The Welfare Decision Protocol (WDP)

  This procedure runs when a batch is created in the software. It consists of four sequential gates.

  #### Gate 1: Species Sentience Classification (System Lookup)
  *The system queries an internal, version-controlled database maintained by your Product Head and Veterinary Consultant. The farm manager sees only the result, not the debate.*

  *   **Question:** What is the current scientific consensus level for this species?
  *   **Input:** Species ID (selected by manager).
  *   **Possible Values:**
      *   `CLASS_A (High Consensus Sentience)`: Evidence of nociception, central processing, and pain-avoidance learning is robust (e.g., Vertebrates, Cephalopods).
      *   `CLASS_B (Precautionary Zone)`: Evidence is unsettled or contested. Nociception exists, but central processing is debated (e.g., Decapod Crustaceans, some Insects).
      *   `CLASS_C (Low/Unknown Sentience)`: Nervous system is decentralized or evidence suggests lack of subjective experience (e.g., Bivalves, Cnidarians).
      *   `CLASS_X (No Data)`: No peer-reviewed welfare data exists for this species in aquaculture.
  *   **Logic:**
      *   If `CLASS_A` → Proceed to Gate 2.
      *   If `CLASS_B` → Proceed to Gate 2 (Precautionary Principle applies: treat as Class A).
      *   If `CLASS_C` → **Verdict: No Special Handling.** (Log rationale: "Consensus indicates low sentience capacity").
      *   If `CLASS_X` → **Verdict: ESCALATE.** (Stop. Flag for Consultant Review. Do not allow batch processing until cleared).

  #### Gate 2: Hardware Capability Verification (Manager Input)
  *The system checks if the farm can actually comply. This prevents "impossible mandates" that lead to routing around.*

  *   **Question:** Is certified stunning hardware installed and functional on this harvest line?
  *   **Input:** Boolean (Yes/No) + Hardware ID.
  *   **Sufficient Answer:**
      *   `Yes`: Hardware ID matches a model validated by your company for this species class.
      *   `No`: No hardware, or hardware not validated for this species.
  *   **Logic:**
      *   If `Yes` → Proceed to Gate 3.
      *   If `No` → **Verdict: DO NOT SUPPORT.** (Stop. Message: "This platform cannot verify welfare compliance for this species without validated stunning hardware. Harvest cannot be logged as compliant.").
      *   *Engineering Note:* This is your leverage. If they want to use your software for certification, they must use the hardware. If they refuse, you drop the liability.

  #### Gate 3: The Precautionary Threshold (System Logic)
  *This is where the "unsettled evidence" rule is enforced.*

  *   **Question:** Does the combination of Species Class and Batch Scale trigger the Precautionary Override?
  *   **Input:** Species Class (from Gate 1) + Batch Size.
  *   **Sufficient Answer:**
      *   If `CLASS_A` or `CLASS_B`: The default is **Stun Required**.
      *   *Exception:* If Batch Size < [Threshold, e.g., 500 units] AND Purpose = [Research/Non-Food], policy may allow override (configurable by Product Head).
  *   **Logic:**
      *   If Stun Required → Proceed to Gate 4.
      *   If Exception Met → **Verdict: No Special Handling.** (Log exception code).

  #### Gate 4: Operational Viability (Manager Input)
  *Final check to ensure the stun will actually happen and be effective.*

  *   **Question:** Can the line maintain the required throughput for effective stunning?
  *   **Input:** Estimated Flow Rate (animals/minute).
  *   **Sufficient Answer:** Flow Rate must be within the operational envelope of the Hardware ID (from Gate 2).
  *   **Logic:**
      *   If Within Envelope → **Verdict: ROUTE THROUGH STUN.** (Unlock harvest logging. Require "Stun Cycle Complete" signal before "Mortality" can be logged).
      *   If Outside Envelope → **Verdict: ESCALATE.** (Stop. Message: "Flow rate exceeds humane capacity. Reduce speed or consult support.").

  ---

  ### Part 2: Value Judgments Disguised as Engineering

  You asked to identify where you are smuggling philosophy into code. Do not hide these from your Support Staff; they must know them to explain the "Why" to farmers.

  1.  **The Classification Database (Gate 1):**
      *   *The Judgment:* Deciding which scientific papers count as "Consensus."
      *   *The Risk:* You are effectively legislating moral status. If you move Shrimp from `CLASS_B` to `CLASS_C` based on new data, you change their moral standing overnight.
      *   *Mitigation:* Version this database. Every batch log must record the *version* of the Sentience Database used. This allows you to update ethics without breaking audit trails.

  2.  **The Precautionary Default (Gate 3):**
      *   *The Judgment:* You have chosen to err on the side of the animal (`CLASS_B` → Stun) rather than the farmer (`CLASS_B` → No Stun).
      *   *The Risk:* This imposes cost on the farmer for a philosophical possibility.
      *   *Mitigation:* This is the core product value proposition. If the certification body requires it, this isn't a judgment, it's a spec. If it's your choice, document that "Unsettled Evidence = Protection" is company policy.

  3.  **The "Do Not Support" Hard Stop (Gate 2):**
      *   *The Judgment:* You are deciding that it is better to refuse business than to allow unverified killing.
      *   *The Risk:* Farmers may switch to a competitor with lower standards.
      *   *Mitigation:* This is the "routing around" defense. By refusing to log the harvest, you prevent the certification body from auditing it. You are making the software a gatekeeper, not just a logger.

  4.  **The Throughput Envelope (Gate 4):**
      *   *The Judgment:* You are defining "Effective Stunning" as a function of speed.
      *   *The Risk:* A stun at 90% efficiency might be "good enough" for a farmer but morally unacceptable for a philosopher.
      *   *Mitigation:* Rely on the hardware vendor's specs for this, but acknowledge that "Spec Sheet Efficiency" $\neq$ "Moral Certainty."

  ---

  ### Part 3: Test Cases

  Here is how the WDP runs on your three scenarios.

  #### Case 1: Farmed Atlantic Salmon (*Salmo salar*)
  *   **Gate 1 (Species):** `CLASS_A`. (Vertebrate, high consensus).
  *   **Gate 2 (Hardware):** `Yes`. (Farm has electrical stun bath).
  *   **Gate 3 (Precaution):** Stun Required.
  *   **Gate 4 (Throughput):** Within envelope.
  *   **Verdict:** **ROUTE THROUGH STUN.**
  *   **Support Script:** "Salmon are Class A. The system requires a stun signal before mortality can be logged. This is non-negotiable for certification."
  *   **Outcome:** Easy. System works as intended.

  #### Case 2: Penaeid Shrimp (*Penaeus vannamei*)
  *   **Gate 1 (Species):** `CLASS_B`. (Decapod. Nociceptors present, brain structure debated. Evidence unsettled).
  *   **Gate 2 (Hardware):** `Yes`. (Farm has chilling bath, which acts as thermal stun).
  *   **Gate 3 (Precaution):** **Precautionary Principle Triggers.** Despite debate, `CLASS_B` defaults to Stun Required.
  *   **Gate 4 (Throughput):** Within envelope.
  *   **Verdict:** **ROUTE THROUGH STUN.**
  *   **Support Script:** "Science is not settled on shrimp pain. Our policy, and your certification, requires precaution. We treat them as sentient until proven otherwise. You must use the chill bath."
  *   **Outcome:** Contested, but defensible. The "Precautionary" clause does the heavy lifting here.

  #### Case 3: Giant Sea Cucumber (*Isostichopus badionotus*) — *The Awkward Case*
  *   **Context:** High revenue customer. Nervous system is a nerve net (no central brain). Killing involves boiling or salting. You have no electrical stun hardware for them.
  *   **Gate 1 (Species):** `CLASS_X`. (No Data / Nerve Net).
  *   **Logic:** **Verdict: ESCALATE.**
  *   **Action:** System locks batch creation. Ticket created for Veterinary Consultant.
  *   **Consultant Review:** Consultant determines nerve net likely precludes sentience (`CLASS_C`), *BUT* hardware is incompatible.
  *   **Gate 2 (Hardware):** `No`. (No validated stun for Sea Cucumbers).
  *   **Logic:** **Verdict: DO NOT SUPPORT.**
  *   **Support Script:** "We cannot verify welfare for this species because we have no way to measure or ensure humane handling in the software. We cannot log this harvest as compliant."
  *   **Outcome:** **Revenue Loss.** This is the correct ethical outcome. If you cannot ensure welfare, you cannot support the harvest. If the customer pushes back, they are asking you to certify suffering. Your "Do Not Support" verdict protects your company from liability and the animals from unregulated killing.

  ---

  ### Part 4: Failure Modes & Limitations

  You asked for an honest list of where this procedure will misfire. Put this in your internal documentation.

  1.  **The "Black Box" Evasion:**
      *   *Failure:* A farmer logs the batch as "Salmon" but harvests "Trout" (if standards differ), or logs a batch but harvests off-the-books to avoid the stun delay.
      *   *Mitigation:* None. Software cannot see physical reality. You rely on audits. Your software makes the *recorded* harvest compliant, not necessarily the *actual* harvest.

  2.  **The "Compliance Stun":**
      *   *Failure:* The hardware runs, but is poorly calibrated. Animals are stunned but not insensible, or stunned then allowed to recover before bleeding.
      *   *Mitigation:* Your software logs "Cycle Complete," not "Insensibility Verified." You are logging *process*, not *physiology*. Be clear with auditors: you verify the machine ran, not that the animal felt nothing.

  3.  **The "Precautionary Fatigue":**
      *   *Failure:* If too many species are `CLASS_B`, farmers become desensitized to the alarms and overrides.
      *   *Mitigation:* Keep `CLASS_B` reviews frequent. If a species moves to `CLASS_C`, update the DB immediately to reduce friction.

  4.  **The "Moral Offloading":**
      *   *Failure:* Farmers stop thinking about welfare because "The Software decided."
      *   *Mitigation:* Your UI should not just say "Stun." It should say "Stun Required: Species Sentience Class A." Remind them *why*.

  5.  **The "Data Lag":**
      *   *Failure:* New science emerges (e.g., Shrimp moved to `CLASS_A`), but your database is version-locked for audit stability.
      *   *Mitigation:* You need a policy for "Critical Updates." If science changes drastically, you must force a DB update even mid-cycle, notifying all customers.

  ### Implementation Advice

  1.  **Hardcode the Ethics:** Do not let the farmer configure the Sentience Class. That is a global setting managed by your Product Head and Consultant.
  2.  **Audit Trails:** Every batch log must include the `Sentience_DB_Version` and the `WDP_Decision_Tree_ID`. If you are audited in 5 years, you need to prove *why* the system made that decision at that time.
  3.  **The "No" Button:** Make the "Do Not Support" verdict easy to trigger. It is better to lose a customer than to become an accomplice to unverified suffering.

  This procedure translates the precautionary principle into a binary gate. It acknowledges that you cannot prove sentience, but you can enforce the *assumption* of sentience where the data is unclear. It places the burden of proof on the technology (Gate 2) rather than the biology, which is the only lever you actually control.
