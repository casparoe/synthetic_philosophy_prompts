          *   Decision: For a *policy target*, we need a conception of wellbeing that is authoritative. Subjective reports alone are vulnerable to adaptation. Objective lists are vulnerable to paternalism.
          *   Label: *Genuine Requirement* (Conceptual Clarity). You can't target what you haven't defined.

      *   *Matter 2: Adaptation and Shifting Standards.*
          *   Context: Deprived but satisfied vs. Rich but dissatisfied.
          *   Requirement: The measure must distinguish between *satisfaction with conditions* and *quality of conditions*. If we target satisfaction, we might ignore deprivation. If we target conditions, we ignore agency.
          *   Decision: For a *rank target*, adaptation is a fatal flaw. You don't want to policy-target a metric that goes up when people lower their expectations.
