answer: |-
  # Desiderata for a National Wellbeing Target

  **To:** The National Statistics Office
  **From:** Advisory Committee on Measurement Specification
  **Subject:** Preconditions for Adopting International Happiness Rankings as Policy Targets

  You have been asked to specify the conditions under which climbing an international happiness league table could justifiably become a national policy goal. This is not a request for a better index; it is a request for the *conditions of validity* for the index's purpose. If the purpose is to treat a rank as a target, the measure ceases to be a thermometer and becomes a thermostat. The standards for thermostats are higher than for thermometers.

  Below are the eight desiderata derived from the fixed purpose of **policy targeting via international ranking**. For each, the motivating consideration is stated, followed by a classification of whether the proposed standard is a **Genuine Requirement** (necessary for the instrument to function as a target) or a **Preference of One Camp** (a philosophical or political stance that is not strictly necessary for measurement validity).

  ---

  ### 1. Conceptual Coherence (What is being measured?)
  *   **Consideration:** A person may report high life satisfaction despite frequent negative emotion (the "happy slave"), or report low satisfaction despite a meaningful, flourishing life (the "miserable achiever"). If the state targets satisfaction, it may ignore suffering. If it targets meaning, it may impose paternalism.
  *   **Specification:** The index must explicitly define the *currency* of wellbeing (hedonic, evaluative, or eudaimonic) and demonstrate that this currency aligns with the state's normative mandate.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** You cannot target a variable without defining it. A measure that conflates mood, judgment, and objective functioning without distinction is statistically incoherent. However, the *choice* of which currency to prioritize (e.g., pleasure vs. capability) is a **Preference of One Camp**. The requirement is not *which* conception is chosen, but that *one* is chosen and adhered to.

  ### 2. Resistance to Adaptive Preferences
  *   **Consideration:** Individuals adapt to deprivation (reporting high satisfaction in poor conditions) or escalate expectations (reporting low satisfaction in rich conditions). If the measure captures adaptation, policy could succeed by lowering expectations rather than improving conditions.
  *   **Specification:** The measure must distinguish between *satisfaction with circumstances* and the *quality of circumstances*. It must not reward policy that pacifies the population without improving their objective capabilities.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** For a rank to be a *policy target*, it must track changeable social goods, not psychological habituation. A target that rises when citizens lower their standards is a perverse incentive.

  ### 3. Interpersonal and Intercultural Comparability
  *   **Consideration:** Two people or societies may use the same scale (e.g., 0–10) to mean different things (scale usage bias). If Country A uses "7" to mean "adequate" and Country B uses "7" to mean "excellent," the ranking is noise.
  *   **Specification:** A unit of wellbeing in the domestic population must be equivalent to a unit of wellbeing in the comparator populations.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** This follows directly from the fixed purpose of adopting a *league table* position. Without cardinal comparability, a "rank" is mathematically meaningless.

  ### 4. Measurement Invariance (Robustness)
  *   **Consideration:** Responses fluctuate based on question order, framing, or salient comparisons (e.g., answering after being asked about marriage vs. income).
  *   **Specification:** The score must remain stable regardless of irrelevant contextual factors in the survey administration.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** Policy cannot target a number that fluctuates based on the phrasing of the question. Stability is a prerequisite for causality.

  ### 5. Policy Responsiveness
  *   **Consideration:** Wellbeing is partly determined by stable traits (genetics, personality) and partly by conditions (income, safety, trust).
  *   **Specification:** The measure must be sensitive to variables that fall within the government's locus of control.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** It is irrational to set a policy target for a variable that policy cannot move. If the index is dominated by stable traits, it is a description, not a goal.

  ### 6. Aggregation and Weighting Transparency
  *   **Consideration:** To produce a *rank*, multidimensional data must be collapsed into a single ordering. This implies trade-offs (e.g., how much income compensates for less leisure?).
  *   **Specification:** The index must either produce a single number with explicitly justified weights, or acknowledge that no single number is valid.
  *   **Classification:** **Preference of One Camp (with a Genuine Caveat).**
  *   **Reasoning:** The demand for a *single number* is a **Preference of the Political Camp** (for legibility). Statistically, wellbeing is multidimensional and often incommensurable. However, given your fixed purpose (a *rank*), the **Genuine Requirement** is that the weighting scheme used to generate that rank must be transparent and normatively defensible, not hidden within a statistical model.

  ### 7. Resistance to Strategic Manipulation (Goodhart's Law)
  *   **Consideration:** When a measure becomes a target, agents optimize for the measure rather than the underlying reality (e.g., teaching to the test).
  *   **Specification:** It must be costlier to manipulate the score artificially than to improve the underlying wellbeing.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** If the index can be gamed by survey sampling or question framing, the policy target becomes a exercise in public relations rather than social improvement.

  ### 8. Distinctness of Outcome (Means vs. Ends)
  *   **Consideration:** Indices often include policy inputs (e.g., "health expenditure") as components of the wellbeing outcome (e.g., "health status").
  *   **Specification:** The index must measure the *state of the citizen*, not the *activity of the state*.
  *   **Classification:** **Genuine Requirement.**
  *   **Reasoning:** Including inputs in the outcome measure creates circular reasoning. You cannot justify spending by pointing to a score that includes that spending as a positive factor.

  ---

  ### The Impossibility Result

  You have asked for a specification that allows you to settle the question of whether to adopt a rank as a target. We must now report that **no measure can satisfy the set of Genuine Requirements simultaneously.**

  There is a fundamental incompatibility between **Requirement 3 (Comparability)** and **Requirement 2 (Resistance to Adaptation).**

  1.  **To satisfy Comparability (Req 3):** You must assume that a "7" in Country A means the same as a "7" in Country B. This requires using raw self-reported scores (as most league tables do) to maintain a common metric across borders.
  2.  **To satisfy Resistance to Adaptation (Req 2):** You must acknowledge that a "7" in a deprived Country A may reflect lowered expectations, while a "7" in a wealthy Country B may reflect high standards. To correct for this, you must adjust scores based on objective conditions or cultural norms.
  3.  **The Conflict:** If you adjust the scores to account for adaptation (satisfying Req 2), you destroy the common metric required for international ranking (violating Req 3). You are no longer comparing "happiness"; you are comparing "happiness corrected by the statistician's model of deprivation." If you do not adjust the scores (satisfying Req 3), you validate adaptive preferences, making the target perverse (violating Req 2).

  **Secondary Conflict:** There is also a tension between **Requirement 6 (Aggregation)** and **Requirement 1 (Conceptual Coherence).** To create a single rank (Req 6), you must weight dimensions (e.g., income vs. emotion). However, there is no scientific consensus on the correct weighting of these dimensions (Req 1). Any single number implicitly imposes a specific philosophical resolution to a contested ethical debate.

  **What this means for the policy question:**
  This impossibility means that a league table rank *cannot* settle the policy question. A rank that is comparable enough to be international is too crude to be normatively authoritative. A measure that is normatively authoritative enough to guide policy is too specific to be comparable internationally. **You cannot have a target that is both a valid guide for domestic welfare and a valid unit for international competition.**

  ---

  ### Conclusion

  **The Single Requirement That Rules Out Current League Tables:**
  **Resistance to Adaptive Preferences.**
  Current international league tables (such as the World Happiness Report) rely primarily on self-reported life satisfaction (e.g., the Cantril Ladder). This metric is demonstrably vulnerable to hedonic adaptation and shifting standards. Citizens in deprived conditions often report high satisfaction due to lowered expectations. If the NSO adopts a rank based on this metric as a policy target, the government could theoretically "succeed" by fostering resignation rather than capability. This violates the normative authority required for a national goal.

  **Assessment of Defensible Indices:**

  *   **OECD Better Life Index:**
      *   *Meets:* Distinctness of Outcome; Resistance to Adaptation (includes objective indicators); Transparency of Weighting (allows users to weight dimensions).
      *   *Fails:* Aggregation (deliberately refuses to produce a single rank, thus failing your fixed purpose); Comparability (some indicators are not perfectly harmonized across all nations).
  *   **Bhutan's Gross National Happiness (GNH):**
      *   *Meets:* Resistance to Adaptation (uses sufficiency thresholds, not just averages); Conceptual Coherence (explicitly Buddhist/eudaimonic).
      *   *Fails:* Comparability (culturally specific metrics make international ranking impossible); Policy Responsiveness (some dimensions are slow-moving).
  *   **Subjective Wellbeing (SWB) Measures (e.g., World Happiness Report):**
      *   *Meets:* Comparability (superficially); Aggregation (produces a clear rank); Policy Responsiveness (sensitive to short-term changes).
      *   *Fails:* Resistance to Adaptation (the fatal flaw); Distinctness of Outcome (often conflates causes like GDP with the outcome); Measurement Invariance (vulnerable to framing).

  **Recommendation:** No existing index meets the desiderata required to justify a *rank* as a *target*. The NSO should advise that while wellbeing should be measured, **international ranking positions are mathematically and ethically unsuitable as primary policy goals.**
