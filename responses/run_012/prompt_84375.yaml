      *Insulation:* The "tracking" clause makes it insulated (unfalsifiable).
      *Falsity:* If biological organization is shown to be largely non-adaptive (Neutral Theory extreme).
      *Repair:* Drop "current maintenance," stick to "historical origin + current presence."

