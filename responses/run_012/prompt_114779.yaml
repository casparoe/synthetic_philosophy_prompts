answer: |-
  This is a tight, high-stakes session. The mechanics you've sketched are sound, but the logistics can kill the vibe if you're shuffling papers for 10 minutes between rounds. Below is the runnable version, optimized for a 90-minute block with minimal tech and maximum psychological impact.

  ### 1. The Core Mechanic (The Math)
  *   **The State:** Each round, the "World" is either **Safe** (1 in 6 chance) or **Risky** (5 in 6 chance).
  *   **The Signal:** Each player gets a private slip of paper.
      *   If World is **Safe**: 90% get "GO" (Green), 10% get "STOP" (Red).
      *   If World is **Risky**: 90% get "STOP" (Red), 10% get "GO" (Green).
  *   **The Trap:** In a Risky round, there is an 85% chance *at least one* person gets a false "GO." If they act on it, the group loses points.
  *   **The Goal:** Maximize the **Group Score**. (This removes selfishness; the failure must be epistemic, not moral).

  ### 2. Materials & Prep (Night Before)
  You need to be able to distribute signals quickly. Do not make 100 envelopes. Make 18 reusable ones.

  **What to make:**
  1.  **18 Player Envelopes:** Brown or plain white. Number them 1–18 on the back.
  2.  **Signal Slips:** Cut ~250 small slips of paper.
      *   Color 120 **Green** (Write "GO" on them).
      *   Color 120 **Red** (Write "STOP" on them).
      *   Keep them in two separate piles/bags: **Pile A** (Mostly Green) and **Pile B** (Mostly Red).
  3.  **5 "Outsider" Envelopes:** Marked "LAB 1" through "LAB 5".
      *   Inside each: One slip. For the final round, these will determine if outside actors release.
  4.  **The State Deck:** 6 cards (e.g., from a poker deck). 1 Ace (Safe), 5 Number cards (Risky). Shuffle these in a small opaque bag.
  5.  **Scoreboard:** Whiteboard or large pad.
  6.  **Release Tokens:** 50 poker chips or distinct coins (to place in a central "Release Box").

  **Prep Time:** ~90 minutes.
  **Helper:** If possible, get one friend to help stuff envelopes during the session so you can facilitate.

  ### 3. Payoff Sheet (Whiteboard This)
  Write this visibly before you start. Do not explain the *why*, just the *rules*.

  | World State | Action | Score Impact |
  | :--- | :--- | :--- |
  | **SAFE** (1/6 odds) | **No Release** | **-50 Points** (Missed Cure) |
  | | **≥1 Release** | **+10 Points** (Problem Solved) |
  | **RISKY** (5/6 odds) | **No Release** | **0 Points** (Status Quo) |
  | | **Each Release** | **-20 Points** (Damage) |

  *Note: The penalty for a false positive (-20) is higher than the gain for a true positive (+10) to create tension, but the missed cure (-50) is catastrophic to prevent total paralysis.*

  ### 4. Minute-by-Minute Timeline (90 Minutes)

  **0:00 – 0:05 | Setup & Silence**
  *   Seat 18 players. Give each an envelope (empty for now) and a pen.
  *   **Script:** "You are a coordination committee. There is a technology that can solve a global problem, but it might be dangerous. You share one score. Your goal is to maximize it. You will get private data. You will decide to Release or Hold. No talking yet."
  *   *Do not mention probabilities. Do not mention the name of the concept.*

  **0:05 – 0:20 | Phase 1: The Blind Walk (3 Rounds)**
  *   **Process:**
      1.  Draw a State Card (show no one).
      2.  Behind a screen/folder, stuff the 18 envelopes based on the State (Safe = Pile A, Risky = Pile B).
      3.  Distribute envelopes. Players open, read, decide.
      4.  Players place a token in the box if releasing.
      5.  Reveal State. Calculate Score. Update Whiteboard.
  *   **Goal:** Let them feel the frustration of a Risky round where someone *inevitably* gets a Green slip and releases.
  *   *Facilitator Note:* Ensure the State is Risky at least twice in these three rounds (manually pick cards if needed to ensure the lesson lands).

  **0:20 – 0:40 | Phase 2: The Discussion (2 Rounds)**
  *   **Script:** "You may talk for 5 minutes before the next decision. You cannot show your slips. You still decide simultaneously."
  *   **Action:** Let them debate. They will try to find a threshold ("Only release if you're 100% sure"). Remind them they only have Green/Red.
  *   **Round 4 & 5:** Run the mechanic.
  *   **Expected Outcome:** They will agree to be cautious. But in a Risky round, the 10% false-positive rate means 1-2 people *will* still get Green. If those people feel the urgency (Safe = -50 penalty), they will break the agreement. This is the curse.

  **0:40 – 1:00 | Phase 3: The Constitution (1 Round + Drafting)**
  *   **Script:** "Write a rule. A binding constraint on your team. It must be enforceable by honor."
  *   **Action:** They might write "Only release if 5 people agree." (Impossible to verify). They might write "Only Person #1 decides." (Person #1 might get a Red slip in a Safe round).
  *   **Round 6:** Test the rule.
  *   **Debrief Moment:** Point out that the rule only binds *them*.

  **1:00 – 1:10 | Phase 4: The Outsiders (1 Round)**
  *   **Script:** "New variable. There are 5 external labs not in this room. They have the same technology. I will open their envelopes now."
  *   **Action:** Set State to **RISKY**.
  *   **Mechanic:** The 18 players agree to **HOLD**. (Give them a moment to feel confident).
  *   **Twist:** Open the 5 "LAB" envelopes. Pre-stuff these so at least one is **GO** (Green).
  *   **Result:** The players held back perfectly. The Outsiders released. The score tanks (-20 per outsider release).
  *   **Point:** Coordination within your group doesn't stop the unilateralist curse if the actor pool is global.

  **1:10 – 1:30 | The Debrief (The Gut to Head Transfer)**
  *   **Step 1: The Reveal.**
      *   "What you experienced is called the **Unilateralist's Curse**." (Write it on the board).
      *   "It was proposed by Nick Bostrom regarding high-risk technologies."
  *   **Step 2: The Math.**
      *   Ask: "In the Risky rounds, how many of you got a Green slip?" (Usually 1 or 2).
      *   "You were not reckless. You were rational. Your signal was 90% reliable."
      *   Write on board: **$0.9^{18} = 0.15$**.
      *   "If there are 18 of you, and each of you is 90% likely to be right... the chance the *group* is right is only 15%."
      *   "The number of actors kills you, not their quality."
  *   **Step 3: Addressing the Loophole.**
      *   *Addressing Worry #1:* "Some of you realized: 'If others release, my holding back doesn't save the points.' That is correct. In a shared score, futility feels like permission. But in the real world, *you* don't know if others will release. You are acting on your signal. The curse is that the *existence* of other decision-makers lowers the reliability of the system, even if everyone is trying to help."
  *   **Step 4: Addressing Realism.**
      *   *Addressing Worry #2:* "This game was too easy. You shared a score. In reality, the lab that releases gets the fame, the profit, or the security advantage. You all share the risk, but the releaser gets the upside. Coordination is harder than this room made it look."

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The "Fast Calculator" Problem**
  *   *Risk:* A reporter does the Bayesian math in Round 1 and shouts, "A Green light is only 64% likely to be Safe! We should never release!"
  *   *Fix:* If this happens, validate them. "Correct. But if the World is Safe and you don't release, you lose 50 points. You cannot afford to never release. You have to find the balance." This keeps the game alive.

  **2. The "Dominant Voice" in Phase 2**
  *   *Risk:* One person dictates the strategy, others comply, they win, and they miss the point.
  *   *Fix:* Intervene. "I'm hearing one plan. Does everyone *privately* agree? Remember, you decide simultaneously. If you disagree, you must act on your conscience." Force the dissent to manifest.

  **3. The "Outsider" Resentment**
  *   *Risk:* Players feel cheated in Phase 4. "We played perfectly and lost."
  *   *Fix:* Lean into it. "Exactly. You did everything right. The structure of the world punished you anyway. That is the story of pandemic preparedness, AI safety, and geoengineering."

  **4. Time Creep**
  *   *Risk:* Stuffing envelopes takes too long between rounds.
  *   *Fix:* Have your helper stuff envelopes *while* you are debriefing the previous round. Or, pre-stuff 3 sets of envelopes (Safe/Risky/Risky) before the session starts and pick the stack secretly.

  ### 6. Limitations (The Honest Paragraph)
  *Read this or paraphrase it at the very end:*

  > "This simulation assumes you all care about the same score. In the real world, the Unilateralist's Curse is compounded by competition. If you hold back and a rival releases, they get the Nobel Prize, the market share, or the strategic advantage, and you get nothing but safety. This game made coordination look possible because you were allies. In reality, the curse is worst when the actors are adversaries who trust each other the least. The math ($0.9^N$) applies regardless of intent, but the incentive to defect makes the $N$ effectively larger."

  ### 7. Facilitator Cheat Sheet (The "Gut" Moments)
  *   **When a Risky Round goes bad:** Don't blame the person who released. Say: "Look at their slip. It was Green. They did the right thing with the information they had. The system failed them."
  *   **When they coordinate successfully:** Ask: "How long can you keep this secret? What happens when a new person joins the committee?"
  *   **The Final Takeaway:** "We cannot just ask people to be more careful. We have to build systems where one person *cannot* decide for everyone."
