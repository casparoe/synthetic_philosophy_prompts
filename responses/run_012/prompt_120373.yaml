  The kitchen light hummed, a low-frequency buzz that seemed to vibrate in the silence left after Joonas's girlfriend had shut her bedroom door. The coffee was cold. I was still holding a mug I hadn't drunk from in twenty minutes.

  "You're stuck on the word 'coerced'," Joonas said. He wasn't looking at me, but at the grain of the table, tracing a knot in the wood with his thumb. "You hear 'state force' and you stop listening. But if you outsource violence, you're saying defense isn't a civic duty. It's a service industry. And if it's an industry, it responds to market signals, not democratic will."

  "It's not just the word," I said. "It's the reality. You're talking about taking a year of a twenty-year-old's life. That's not a duty; that's a seizure. If the threat is real enough to require an army, pay people to do it. Pay them well. Make it a profession like medicine or law."

  "And who pays?" Joonas looked up. "The taxpayer. But if the taxpayer isn't serving, they treat the budget like a utility bill. They want the lights on, but they don't care about the wiring. When defense is professionalized, the political cost of war drops to zero for the majority. You can bomb a country for a decade and never meet a soldier. But if your nephew is in the pool? You check the justification twice. Conscription isn't just about filling ranks. It's a brake on aggression."

  "That's the theory," I said. "But look at the history. Conscript armies don't prevent wars; they just make them bloodier when they happen because you have a mass of bodies ready to burn. And don't tell me it's egalitarian. You know who gets deferments. You know who gets the student exemptions. The 'shared sacrifice' lands on the kids who can't afford university or don't have doctors who'll write a note."

  Joonas nodded slowly. "Okay. That's a fair hit. Inequality corrupts everything. But compare it to the alternative. Your professional force. Who joins? It's not the kids from Helsinki West End or Manhattan. It's the ones who need the tuition money or the citizenship. You called it a poverty draft earlier. You were right. It's conscription by economic necessity. The only difference is the state doesn't admit it."

  I sighed, leaning back. "I'll concede the skew. Volunteer forces do draw disproportionately from lower income brackets. But at least there's a contract. There's consent. If I sign up, I know the deal. If I'm conscripted, I'm a resource. And honestly, Joonas, modern warfare isn't about mass mobilization. It's about tech. You don't want a kid who's counting down the days until discharge flying a drone or managing logistics. You want career specialists."

  "Specialists who can be ordered to do anything," Joonas countered. "A professional army becomes a caste. They separate from the society they protect. That's how you get civil-military gaps where the soldiers vote differently, think differently, eventually loyalty-shifts to the command structure rather than the constitution. A citizen army goes home every night. They remember they're citizens first. That's the republican argument. You don't own the state unless you're willing to die for it. If you hire men to die for you, you're not a citizen. You're a client."

  "So neutrality is just a signaling game then?" I asked. "You think Sweden bringing it back is about bodies? They could buy those bodies."

  "It's about credibility," Joonas said. "If an invader knows they have to fight every shopkeeper and teacher, not just a brigade of professionals, the calculation changes. It's a tripwire made of people. But it also buys competence in a different way. It teaches the population how the state works. It's integration."

  "Or it's a tax on time," I said. "Which brings me to your compromise idea. You mentioned a lottery. Universal civic service. Military or civilian. Random selection. Everyone does two years."

  Joonas perked up slightly. "Exactly. You fix the class issue. No deferments. The CEO's son pulls the same lot as the mechanic's kid. Some go to the barracks, some to hospitals, some to infrastructure. It spreads the burden without forcing everyone into combat roles they don't fit."

  "But that hollows out the defense piece," I said. "If I'm trying to build a deterrent force, I need people who want to be there, or at least people who are all doing the same job. If you split the cohort between building roads and loading artillery, you don't have an army. You have a jobs program with rifles. And if the military track becomes the 'hard' option that the poor get stuck with because the wealthy lobby for civilian placements, you've just recreated the class divide inside the service."

  Joonas rubbed his face. "You're worried the civilian track becomes the escape hatch."

  "I'm worried the military track becomes the punishment track. And if the goal is political cohesion, forcing people to build roads doesn't create the same bond as shared risk. There's no 'last resort' in a hospital internship."

  "So you think the coercion is only justified if it's for violence?" Joonas asked, sharp.

  "I think coercion is rarely justified. But if you're going to do it, it has to be for survival, not social engineering." I paused. "Look, here's the thing. If you could prove to me that a conscript force actually prevents wars better than a professional one—empirically, not theoretically—I'd reconsider. But the evidence is messy. Small professional armies invade things constantly. But conscript armies do too. The variable isn't the recruitment; it's the leadership."

  Joonas thought about that. "Okay. And for me... if you could show me a professional force that is genuinely representative of the population's economic spread. If the rich joined at the same rate as the poor. If the political cost of war was high even without conscription because the volunteers were everyone's neighbors, not just the vulnerable... then I'd drop it. But that doesn't exist."

  "We agree on that," I said. "The volunteer force is economically skewed. That's a fact."

  "It is," Joonas said. He finally picked up his cold coffee and took a sip, grimaced, and put it down. "But I still think you're wrong about the ownership. You can't hire someone to hold your sovereignty for you. It's like hiring someone to vote in your name. It might work functionally, but the legitimacy is gone."

  "And I still think you can't build a free society on forced labor," I said. "Even if the labor is defense. Especially then."

  We sat there for a moment, the hum of the light filling the space between us. Neither of us moved to clear the table.

  "So," Joonas said. "No winner."

  "No winner," I agreed. "But you're washing the dishes."

  "Because I'm Finnish?"

  "Because you lost the coin toss last week and forgot."

  Joonas stood up, gathering the mugs. "Fine. But I'm putting the plates in the rack my way. It's about civic order."

  "Don't push it."
