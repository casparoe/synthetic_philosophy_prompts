          *   **Verdict:** **Dangerous.** Schopenhauer says music *is* metaphysics in sound, but he doesn't suggest we can *replace* philosophical inquiry with listening. Listening gives a *temporary* release (quietism), not a systematic knowledge. It's an *experience* of the truth, not a *proposition* about it.

  4.  **Synthesize for the Novelist:**

      *   **Character Voice:** The conductor is intelligent but isolated. She reads at night. She shouldn't sound like a professor. She should sound like someone struck by lightning.
      *   **The "Universality of Concepts" Error:** This is the biggest philosophical trip-up. Schopenhauer hates concepts (they are dead, abstract). Music is living. If she says music is like concepts, she undermines the whole "Will" argument. *Correction:* Music is universal like *feelings*, not like *words*.
