      *(Self-Correction during drafting)*: I need to make sure I don't polish her speech *too* much. The prompt asks what the novelist can *safely* put in her mouth. I should identify which of the *friend's* sentences are safe, and which need tweaking to avoid looking like the *novelist* made a mistake, rather than the *character*.
