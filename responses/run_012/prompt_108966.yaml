answer: |-
  # JOINT STATEMENT ON STAKING CRITERIA IN MULTIPLICATIVE ENVIRONMENTS

  **Parties:** The Geometric Growth Position (GGP) and The Expected Utility Position (EUP)
  **Subject:** The normative and mathematical basis for position sizing in repeated independent bets.
  **Date:** October 2023

  ## 1. AGREED CLAIMS

  The undersigned positions affirm the following mathematical and logical propositions. These claims represent the intersection of our models; they do not imply agreement on the normative weight to be assigned to each claim.

  1.  **Mathematical Equivalence:** Maximizing the expected geometric growth rate of wealth is mathematically equivalent to maximizing expected utility under a logarithmic utility function of wealth ($U(W) = \ln(W)$). Where an agent's preferences are exactly logarithmic, the prescriptions of GGP and EUP are identical.
  2.  **Behavior at Small Edges:** As the advantage (edge) in a favourable bet approaches zero, the growth-optimal stake size approaches zero linearly. Both positions agree that for sufficiently small edges, the optimal stake is negligible relative to total wealth, regardless of the specific utility curvature (provided utility is smooth and risk-averse).
  3.  **Divergence in Single Bets:** In a hypothetical scenario involving a single, isolated bet with no opportunity for reinvestment or future compounding, the growth-optimal stake and the expected-utility stake may diverge. The growth-optimal criterion prescribes a stake determined solely by the probability and payoff structure; the expected-utility criterion prescribes a stake determined by those factors *and* the curvature of the agent's utility function.
  4.  **Cost of Fractional Staking:** Any stake size smaller than the growth-optimal amount (fractional staking) results in a strictly lower expected long-run geometric growth rate than the growth-optimal stake. Both positions agree that fractional staking constitutes a sacrifice of growth potential.
  5.  **Risk of Overbetting:** Any stake size larger than the growth-optimal amount (overbetting) reduces the expected long-run geometric growth rate and increases the probability of severe drawdowns. In the limit of infinite trials, overbetting by a factor of two or more (depending on the distribution) leads to wealth converging to zero with probability one.
  6.  **Estimation Error:** Both positions acknowledge that the parameters required to calculate the growth-optimal stake (probabilities and payoffs) are never known with certainty. Both agree that uncertainty in these inputs introduces variance in the realized outcome that is not captured by the theoretical models.

  ## 2. DISAGREEMENTS TABLE

  | Question | Geometric Growth Position (GGP) | Expected Utility Position (EUP) | The Crux | Shared Test Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Normative Authority of Averages** | The time-average growth rate of a single trajectory is the physically relevant quantity for a single agent. The ensemble average is a fiction for an agent who cannot exist in parallel worlds. | The ensemble average (expectation) is the definition of rational choice under uncertainty. The time-average is merely the expected utility of a specific (logarithmic) preference set. | **Ergodicity:** Does the non-ergodic nature of multiplicative wealth processes invalidate ensemble expectation as a guide for individual action? | **The Lifetime Sequence:** An agent faces 1,000 sequential bets. | **GGP:** Only the trajectory maximizing time-average growth avoids ruin. <br> **EUP:** An agent with non-log utility may rationally choose a path with lower time-average growth. |
  | **2. One-Shot Normativity** | Even in a one-shot decision, the stake is constrained by the structural properties of the bet. "Correctness" is derived from the math of the gamble, not just the agent. | In a one-shot decision, there is no "correct" stake independent of the agent's preferences. Rationality is consistency with preferences, not compliance with process dynamics. | **Objectivity:** Is there a stake size that is *incorrect* purely due to the bet's structure, regardless of the agent's risk tolerance? | **The Single Coin:** A single favourable coin flip with no future betting opportunities. | **GGP:** Betting more than the growth-optimal amount is structurally reckless. <br> **EUP:** Betting everything is rational if the agent's utility function is linear enough. |
  | **3. Survival Constraint** | Survival (avoiding ruin) is a prerequisite for participation. It is a hard constraint imposed by the absorbing barrier at zero wealth. | Survival is a *goal* valued by the utility function, not a hard constraint. An agent may rationally accept a high risk of ruin if the payoff is sufficiently valued. | **Absorbing Barriers:** Is ruin a failure of the strategy or a valid outcome of a preference for high variance? | **The Ruin Threshold:** A bet with positive expectation but a 10% chance of total loss. | **GGP:** Rationality forbids strategies that guarantee ruin in the long run. <br> **EUP:** Rationality forbids only strategies that violate preference consistency. |
  | **4. Scope of Theory** | This is a theory of stochastic processes applied to finance. It describes how wealth *behaves* over time. | This is a theory of choice. It describes how agents *should decide* given their values. | **Domain:** Are we arguing about physics (wealth dynamics) or psychology (preference ordering)? | **The Definition of "Rational":** Defining the term in the context of betting. | **GGP:** Rationality implies surviving to compound. <br> **EUP:** Rationality implies maximizing subjective satisfaction. |

  ## 3. ANALYSIS OF FUNDAMENTAL CRUXES

  The following analysis addresses the specific philosophical faults identified in the preamble. We distinguish between substantive disagreements (facts about the world) and verbal disagreements (definitions of terms).

  **1. Time-Average vs. Ensemble Average**
  *   **The Dispute:** GGP argues that because a single agent experiences time sequentially, the time-average is the only observable reality. EUP argues that expectation is a normative standard for decision-making under uncertainty, regardless of whether the outcomes are realized in parallel or sequence.
  *   **Verbal Component:** There is a verbal dispute regarding the definition of "Expectation." GGP treats "Expectation" as "Physical Realization over Time." EUP treats "Expectation" as "Probability-Weighted Sum of Outcomes."
  *   **Substantive Remainder:** Once definitions are aligned, the substantive dispute remains: *Should rational choice be bound by the physical constraints of a single trajectory?* GGP claims yes, because the ensemble average is not accessible to the agent. EUP claims no, because the agent can choose to value the *possibility* of high wealth even if the *probability* of realizing it is low.

  **2. One-Shot Correctness vs. Preference**
  *   **The Dispute:** In a genuinely one-off bet, GGP suggests the growth-optimal stake retains normative force (as a benchmark of structural soundness). EUP suggests the stake is entirely determined by the agent's risk aversion.
  *   **Verbal Component:** The word "Correctness." GGP uses it to mean "Structurally Robust." EUP uses it to mean "Preference-Consistent."
  *   **Substantive Remainder:** The substantive dispute is whether the *structure of the bet* imposes obligations on the bettor. GGP argues that multiplicative dynamics impose a "physics of finance" that penalizes deviation from growth-optimality even in short sequences. EUP argues that without repetition, the dynamics of compounding do not activate, and only the utility of the final wealth state matters.

  **3. Survival: Constraint or Implication?**
  *   **The Dispute:** GGP views survival as a constraint required to stay in the game. EUP views survival as a commodity to be traded off against returns.
  *   **Verbal Component:** The word "Constraint." GGP implies "Hard Boundary." EUP implies "Soft Cost."
  *   **Substantive Remainder:** The substantive dispute concerns the *absorbing barrier*. If wealth hits zero, can the agent recover? If the answer is "No" (true ruin), GGP argues this creates an objective duty to avoid it. EUP counters that if the agent values the *chance* of non-zero wealth more than the *certainty* of survival, the duty does not exist. The dispute is resolved only by specifying whether the agent's utility function assigns negative infinity to ruin.

  **4. Identification of the Verbal Dispute**
  *   **Conclusion:** A significant portion of this dispute is verbal. It stems from conflating a **Theory of Processes** (GGP) with a **Theory of Choice** (EUP).
  *   **Precise Identification:** The verbal dispute lies in the definition of **Rationality**.
      *   GGP defines Rationality as: *Choosing the policy that maximizes wealth in the limit of infinite time.*
      *   EUP defines Rationality as: *Choosing the option that maximizes subjective expected utility.*
  *   **What Remains Contested:** Once we acknowledge these are different definitions, the genuine contest is **Pragmatic**: Which definition yields better prescriptions for *human* investors in *finite* time?
      *   GGP claims that because humans live in time and face ruin, the Process definition is the only one that maps to reality.
      *   EUP claims that because humans have diverse goals (consumption, legacy, altruism) not captured by wealth maximization, the Choice definition is the only one that captures human value.
      *   **Residual Question:** Is wealth maximization a proxy for all human value, or is it a specific instrumental goal? If the former, GGP wins. If the latter, EUP wins.

  ## 4. CONDITIONS FOR REVISION

  We state plainly what evidence or argument would cause each position to revise its stance.

  **To move the Geometric Growth Position (GGP):**
  *   **Proof of Ensemble Realizability:** Demonstration that a single agent can effectively access the ensemble average (e.g., through perfect insurance markets or infinite divisibility of risk without transaction costs).
  *   **Proof of Non-Compounding:** Demonstration that the investor's horizon is strictly finite and that wealth does not compound (e.g., all gains are consumed immediately), rendering the geometric mean irrelevant.
  *   **Utility Derivation:** A derivation showing that logarithmic utility is not merely a preference but the *only* utility function consistent with dynamic consistency over time.

  **To move the Expected Utility Position (EUP):**
  *   **Proof of Objective Utility:** Demonstration that risk preferences are not subjective but are objectively dictated by the mathematical structure of the investment opportunity.
  *   **Proof of Ruin Irrelevance:** Demonstration that an agent can rationally ignore the probability of ruin (wealth $\to$ 0) without violating axioms of consistency.
  *   **Ergodicity Breaking:** A formal proof that non-ergodic processes invalidate the use of ensemble expectations for individual decision-making in all contexts, not just wealth growth.

  **Common Ground on Evidence:**
  There is no experiment or observation we both agree would settle the debate.
  *   GGP views empirical success of fractional Kelly as evidence of estimation error (supporting GGP).
  *   EUP views empirical success of fractional Kelly as evidence of risk aversion (supporting EUP).
  *   Both sides interpret the same data through their own normative frameworks. Consequently, this dispute cannot be resolved empirically; it is a conflict of first principles regarding the definition of rational action in a stochastic world.
