answer: |-
  The term you are looking for is **emplotment**.

  It was coined (or at least canonized) by the philosopher of history **Hayden White**, most notably in his 1973 book *Metahistory*. It is the specific technical term for the process by which a historian takes a "chronicle" (a list of verified events in time order) and arranges them into a "story" with a specific structure, mood, and meaning.

  Here is how **emplotment** fits your description, how it differs from the near-miss terms you mentioned, and how we might answer your second question about distinguishing a defensible arrangement from an arbitrary one.

  ### 1. Why "Emplotment" Fits Your Puzzle
  You described a phenomenon where two authors use the same evidence but produce opposite impressions (inevitability vs. contingency) through *ordering, weighting, and framing*.

  *   **Selection vs. Emplotment:** As you noted, "selection" is merely choosing what to keep. Emplotment is what happens *after* selection. It is the decision to treat Event A as the *cause* of Event B, or merely as its *precedent*. It is the decision to begin the story in 1914 (making war inevitable) versus 1913 (making war a diplomatic failure).
  *   **Style vs. Emplotment:** Style is linguistic (adjectives, sentence length). Emplotment is structural. You can write in a dry, neutral style and still employ a "tragic" emplotment (where the outcome is doomed from the start) or a "romantic" one (where heroes overcome odds).
  *   **Presentism vs. Emplotment:** Presentism is importing current values. Emplotment is importing *narrative logic*. A historian can avoid presentism (judging the past by its own lights) and still emplot the story as a tragedy rather than a farce.

  White argued that the archive itself does not dictate the plot. The same set of events can be emplotted as a **Romance** (triumph over adversity), a **Tragedy** (inevitable decline), a **Comedy** (reconciliation), or a **Satire** (absurdity). This explains why you read two accurate books that teach opposite lessons: they are using different *plots* to organize the same *data*.

  ### 2. The Problem with "Emplotment"
  There is a catch. Hayden White was a postmodernist who tended to suggest that all emplotments are essentially literary choices, with no firm ground to say one is "truer" than another. This clashes with your intuition (and mine) that some arrangements are *plainly better*.

  If emplotment is just a literary trope, then history is fiction. But you correctly observe that some arrangements "oblige the reader to believe in coincidences" or "make the actors' choices unintelligible." This suggests there *are* constraints on emplotment imposed by reality.

  ### 3. A Proposed Refinement: "Causal Architecture"
  Because "emplotment" carries baggage of literary relativism, and because you asked for a definition that helps distinguish the *defensible* from the *arbitrary*, I propose a supplementary term (or a refinement) for the specific mechanism you are analyzing: **Causal Architecture**.

  While *emplotment* describes the *mood* or *genre* of the history, **Causal Architecture** describes the load-bearing structure of the argument. It focuses on how the historian connects the bricks of evidence.

  **Definition:** *Causal Architecture is the arrangement of verified events into a structure of dependency, where the weight of the explanation is distributed across specific causal links.*

  ### 4. How to Judge the Architecture (The Line Between Defensible and Arbitrary)
  You asked for a definition that says what makes one arrangement better than another. In the philosophy of history, this is often discussed under **Inference to the Best Explanation**. Here is a framework for drawing the line:

  **A. Intelligibility of Agents**
  *   **Defensible:** The arrangement makes the historical actors' decisions intelligible *to them* at the time. If a historian arranges events to show inevitability, but the actors clearly believed they had choices, the architecture is strained.
  *   **Arbitrary:** The arrangement requires the historian to assume the actors were blind, irrational, or lying to themselves in order to maintain the plot's momentum.

  **B. Friction and Noise**
  *   **Defensible:** A strong causal architecture accounts for "noise" (events that don't fit the trend). It explains why a harvest failed *despite* good policy, or why a war started *despite* diplomacy. It absorbs the anomaly.
  *   **Arbitrary:** A weak architecture ignores the noise or dismisses it as "exceptional." If a book treats the harvest only as background, but the letters show the generals were worried about food, the architecture is ignoring a load-bearing wall.

  **C. Counterfactual Stability**
  *   **Defensible:** A robust arrangement can withstand a "what if." If you remove one event, does the whole story collapse? If the story claims inevitability, but changing one minor dispatch would have prevented the war, the claim of inevitability is architecturally unsound.
  *   **Arbitrary:** The arrangement relies on a "just-so" chain where every link is fragile, yet the conclusion is presented as solid.

  ### 5. Summary
  The established name for the phenomenon is **emplotment**. It captures the framing, ordering, and weighting that turns a chronicle into a story.

  However, to answer your deeper need—to evaluate the *quality* of that arrangement—I suggest using the concept of **Causal Architecture**.

  *   **Emplotment** asks: "What kind of story is this?" (Tragedy, Comedy, etc.)
  *   **Causal Architecture** asks: "Does this structure hold the weight of the evidence?"

  The line between defensible and arbitrary is drawn at **explanatory coherence**. A defensible arrangement is one where the actors remain intelligible, the anomalies are acknowledged, and the causal links do not require the reader to suspend disbelief in human agency. An arbitrary arrangement is one where the plot dictates the evidence, rather than the evidence supporting the plot.
