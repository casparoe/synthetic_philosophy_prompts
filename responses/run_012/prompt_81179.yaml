      *   *Verbal dispute outcome?* (Yes, include in outcomes).

  6.  **Final Polish:**
      *   Check the flow.
      *   Ensure the distinction between "sensory" and "unpleasantness" is clear but also show the finer grain (caring, judging, acting).
      *   Make sure the IASP definition point is integrated as a conceptual hurdle to be analyzed, not just a complaint.

  *(Self-Correction during drafting)*: I initially thought about proposing new experiments. *Correction:* No, the prompt says "conceptual work." I must use *existing* clinical cases. The innovation is in how I *categorize* them relative to the theories. I need to emphasize that I am not collecting new patients, but re-interpreting the logical space of existing reports.

  *(Self-Correction on "Literature Review")*: To ensure this doesn't look like a review, I need to emphasize the *derivational* aspect. I am building a logical model of the theories first. A review reports what authors said; I am reporting what their theories *entail*, which they may not have realized.

  7.  **Final Word Count Check:** A standard two-page single-spaced proposal is roughly 1000-1100 words. I will aim for that density.

  8.  **Finalizing the Title:** "The Logical Architecture of Suffering: Testing Philosophical Accounts of Pain Against Clinical Dissociations."

