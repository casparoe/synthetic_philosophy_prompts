      *   **6. Scope:**
          *   *In Scope:* Adult acquired cases, major theories (Imperativism, Evaluativism, etc.), IASP definition analysis.
          *   *Out of Scope:* Congenital insensitivity, animal pain, detailed neuroanatomy (unless relevant to the conceptual distinction), developing a new theory of pain (this is testing existing ones).

  4.  **Refining the Tone:**
      *   Avoid heavy jargon like "qualia" or "normativity" without context.
      *   Speak to clinicians: Acknowledge the IASP definition tension.
      *   Speak to philosophers: Acknowledge the meta-ethical stakes.
      *   Ensure the "Not a Literature Review" point lands hard. The value add is the *matrix of predictions*.

