      *   **2. Background & The Gap:**
          *   Explain the standard move (asymbolia shows sensation $\neq$ affect).
          *   Explain why this is insufficient. It treats theories as monolithic.
          *   The Gap: Philosophers argue about the *source* of badness (quality vs. command vs. evaluation vs. desire) but rarely ask what *structural consequences* these sources have. If badness is a command, can you have the command without the urge to obey? If it's an evaluation, can you have the evaluation without caring?
          *   Clinicians see the cases; Philosophers build the theories. Nobody is translating the theories into clinical predictions.

      *   **3. Methodology (The "Not a Literature Review" bit):**
          *   This is crucial. I need to show *derivation*, not just reading.
          *   Phase 1: Formalize the theories. Break them down into necessary conditions.
          *   Phase 2: Generate the "Signatures." If Theory X is true, Dissociation Y is impossible.
          *   Phase 3: Audit the clinical literature (systematic, not casual).
          *   Phase 4: Confrontation. Match signatures to cases.
          *   *Timeline:* 12 Months.
              *   M1-3: Conceptual mapping.
              *   M4-6: Clinical audit.
              *   M7-9: Analysis/Confrontation.
              *   M10-12: Writing/Dissemination.

      *   **4. Philosophical vs. Empirical:**
