      *   **Abstract/Summary:** (Usually required, but the prompt asks for a "two-page research proposal" structure. I will integrate a brief summary into the introduction or keep it tight). Let's stick to the structure requested: Question, Gap, Method, Justification, Outcomes, Scope.

