answer: |-
  Two members of a hospital ethics committee, Elena and Marcus, deliberate on a proposal to implement a regulated market for kidney donations. They agree on all non-moral facts: the program will save fifty lives annually, donors will receive substantial compensation, and coercion is absent. Both possess identical moral psychology profiles, scoring equally high on the Sanctity/Degradation foundation, and for both, the feature of commodification acts as an identical trigger, firing the same intuition of visceral discomfort regarding the pricing of human organs. Elena concludes the proposal is impermissible because she warrants the foundation as demanding inviolability, interpreting the discomfort as a boundary marker that forbids market exchange regardless of consequences. Marcus concludes the proposal is permissible because he warrants the foundation as demanding respectful acknowledgment, interpreting the same discomfort as evidence of the transaction's gravity, which requires formal compensation to honor the donor's sacrifice rather than exploiting altruism. They share the same psychological alarm but deploy divergent warrants regarding what that alarm protects.

  1.  **Foundation and Warrant Analysis**
      *   **Foundation:** Both agents are operating primarily within the **Sanctity/Degradation** foundation.
      *   **Triggers:** The trigger is identical for both: the conceptual feature of "assigning market price to human body parts" fires the same psychological intuition (visceral discomfort/alarm) in both agents to the same degree. There is no difference in sensitivity or salience.
      *   **Elena's Warrant:** She offers a warrant of **Inviolability**. She argues that the discomfort signals a categorical boundary; the body's sanctity is protected by prohibiting any mechanism that treats it as a tool. The verdict (Impermissible) follows from the warrant that sanctity requires exclusion from the market sphere.
      *   **Marcus's Warrant:** He offers a warrant of **Sacred Recognition**. He argues that the discomfort signals high value requiring proper ritualization; the body's sanctity is protected by formally acknowledging the cost of donation through compensation. The verdict (Permissible) follows from the warrant that sanctity requires honoring the gravity of the gift, which unregulated altruism fails to do.
      *   **Divergence:** The triggers are the same (both feel the "ick" factor intensely), but the warrants come apart on what the "ick" *means* for action (Stop vs. Ritualize).

  2.  **MFT Prediction and Failure**
      *   **Prediction:** The moral-foundations apparatus, understood as a predictive model mapping a foundation profile and a situational trigger directly to a moral verdict, predicts that identical profiles encountering identical triggers will produce identical verdicts.
      *   **Defeat:** The case shows identical inputs (Profile + Trigger) producing opposite outputs (Verdicts).
      *   **Rescue Requirement:** To rescue the theory, one must add a component external to the foundations themselves: a theory of **normative conceptualization** or **moral semantics**. The model must account for how agents conceptualize the *object* of the foundation (what "sanctity" entails) independently of the psychological sensitivity to the trigger. The foundations alone cannot supply the content of the warrant.

  3.  **The Feature Doing the Work**
      *   **Feature:** The **normative interpretation of the foundation's demand** (the warrant structure). This is the cognitive framework that translates the raw intuition into a specific directive.
      *   **Degeneration:** If you remove this feature (i.e., if you stipulate that the warrant is fixed by the foundation itself), the case degenerates into a standard empirical disagreement where one party must be feeling a different trigger or possessing a different profile. It collapses into the claim that Marcus does not *really* feel the Sanctity trigger as strongly as Elena, thereby restoring the MFT prediction but falsifying the case stipulations.

  4.  **Strongest MFT Defender Reply**
      *   A defender of the moral-foundations approach would argue that the "warrant" is not an independent variable but a post-hoc rationalization generated by the foundation itself. They would claim that Elena and Marcus do not actually have identical psychological states; rather, their subtle, unmeasured differences in how the Sanctity module is calibrated *cause* the difference in warrants. On this view, the warrant divergence is merely the conscious tip of a subconscious psychological divergence, meaning the psychology of foundations remains the ultimate causal explanation for the verdict, and the "warrant" is epiphenomenal.

  5.  **Limitation of the Case**
      *   This case cannot show that the psychology of foundations is *irrelevant* to the question of who is right, nor can it establish that one warrant is objectively correct. It leaves untouched the possibility that one warrant is psychologically unsustainable or that the foundations track moral truth in a way that favors one interpretation. It demonstrates only that the psychology *underdetermines* the verdict; it does not demonstrate that the psychology provides no evidence for the verdict.
