  3.  **Evaluate against Dennett's Actual Views (Mental Knowledge Retrieval):**
      *   *Qualia:* Dennett famously argues against the *philosophical* notion of qualia (ineffable, intrinsic, private, directly apprehensible). He doesn't deny experiences happen, but denies they have the *properties* philosophers attribute to them. ("Quining Qualia").
      *   *Coffee Tasters:* This is from "Quining Qualia" (1988). The point isn't just "no fact of the matter" in a skeptical sense, but that the *intuition pump* relies on the assumption that there *must* be a fact of the matter independent of functional role. Dennett argues the distinction between "taste changed" vs. "judgment changed" is unstable without functional consequences.
      *   *Observable Difference:* Dennett is a functionalist/physicalist. He rejects "epiphenomenal" qualia. If a difference makes *no* difference (causal/functional), it's not real. This isn't crude verificationism (logical positivism) but rather a commitment to causal efficacy.
      *   *Zombies:* Dennett *rejects* the coherence of philosophical zombies. He argues that if you duplicate the function/physics, you duplicate the consciousness. To say we are "zombies" implies there's something extra missing. Dennett says *nothing is missing*. So, claiming he says we are zombies is a major misinterpretation. He says we are *not* zombies in the philosophical sense, but we are "organic machines."
