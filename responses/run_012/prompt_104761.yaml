      *   Conclude that the "both cannot be right" feeling is the error; it's a tension to be managed, not a puzzle to be solved by picking a side.
      *   Suggest a practical compromise (cover the term, but review afterwards).

  8.  *(Self-Correction on "British English"):* Ensure I don't slip into Americanisms. Use "whilst" instead of "while" occasionally, "maths" not "math" (though it's science), "term" is already used. Ensure the register is appropriate for a professional discussion.

  9.  *(Final Review of the prompt's specific questions):*
