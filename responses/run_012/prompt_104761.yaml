answer: |-
  This is a profoundly difficult situation, precisely because it sits at the intersection of contractual obligation, moral duty, and professional collegiality. Your unease is not a sign of confusion, but of ethical sensitivity. You are grappling with what philosophers call the problem of *supererogation* — actions that are good to do but not wrong to omit.

  To answer your specific questions directly: No, she was not required to do it. No, settling that does not settle what you owe. And yes, your sense that 'both cannot be right' is likely the mistake.

  Let us unpack this.

  **Was she doing something she was required to do?**

  Contractually, the answer is plainly no. You state it was not in her contract, unpaid, and outside normal hours. In the language of employment law and professional standards, this was a gift.

  Morally, it is slightly more complex, but the conclusion remains the same. Teachers have a duty of care to their pupils, but that duty is bounded by reasonableness. It is sustainable for a teacher to work late occasionally or attend a school play; it is not sustainable to sacrifice four hours every weekend, through holidays, for years. To claim she was *morally required* to do this would be to argue that teachers owe their lives to their profession in a way that other professionals do not. Her actions were admirable precisely because they were voluntary. They were supererogatory. She went above and beyond the call of duty.

  **Does settling that settle what the rest of us owe?**

  This is where Colleague B's argument holds significant weight, but also where it risks being too rigid. Colleague B is correct that we cannot allow voluntary goodwill to harden into institutional expectation. If every time a teacher goes above and beyond, the department assumes that level of effort is the new baseline, we create a culture of exploitation. It punishes the conscientious by making their generosity a liability for their colleagues. If we agree to cover this indefinitely, we validate the idea that the school can rely on unpaid labour to function.

  However, Colleague A is also correct that the immediate context has changed. This is no longer about establishing a long-term precedent; it is about emergency cover for an ill colleague. There is a distinction between *adopting* her programme and *covering* her absence.

  When a colleague falls ill, there is a professional duty of collegiality to ensure their responsibilities are managed so that pupils do not suffer unnecessarily. While the Saturday club was voluntary, the *pupils' expectation* of support has now been established. To withdraw it abruptly during a crisis (her illness) causes harm that is tangible and immediate.

  Therefore, the fact that she was not obliged to start the programme does not automatically absolve you of the duty to prevent harm during a temporary crisis. Your obligation arises not from her contract, but from your shared responsibility to the pupils and to her as a colleague in distress.

  **Is the sense that 'both cannot be right' the mistake?**

  Yes. You are feeling the tension between two valid moral principles: *fairness* (Colleague B) and *welfare* (Colleague A). It is a mistake to think you must choose one and discard the other. The ethical path lies in holding both truths simultaneously.

  You can acknowledge that the programme should not exist as an unpaid, permanent expectation (validating Colleague B) while simultaneously agreeing to cover it temporarily to prevent harm during a crisis (validating Colleague A).

  The resolution lies in the conditions of your help. If you agree to cover the term, it should be framed explicitly as a one-off emergency measure due to her illness, not as an endorsement of the programme's structure. You might say:

  > "We are happy to cover for [Colleague] whilst she recovers, because we are a team and we do not want the pupils to lose out during this crisis. However, we cannot commit to continuing this beyond the term. We need to review whether this provision is sustainable without relying on unpaid voluntary labour."

  This approach achieves several things. It protects the children in the short term. It supports your ill colleague without demanding she return before she is ready. Crucially, it protects you and the department from the 'precedent' fear Colleague B raises. By explicitly stating that this is temporary and contingent on the crisis, you prevent her unilateral generosity from rewriting your permanent obligations.

  **Conclusion**

  Your colleague performed an act of virtue, but virtue cannot be mandated. If you refuse to help, you are not morally culpable for her choice to work unpaid, but you might be culpable for ignoring the immediate needs of the children when you have the capacity to help.

  The solution is to act out of solidarity, not obligation. Cover the term. Support the children. But do so with the clear understanding that once the term is over, the department must decide whether this provision is truly necessary, and if so, how it can be resourced properly. That is how you honour her generosity without allowing it to become a burden that breaks the rest of you.
