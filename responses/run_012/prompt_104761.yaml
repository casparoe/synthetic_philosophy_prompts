prompt: |-
  For several years a colleague of mine at a state secondary school has run a free Saturday tutoring programme for pupils from the nearby estate — four hours every week, through the holidays, with no extra pay and nothing about it in her contract. She is now unwell and has asked the rest of the science department to cover for a term. Two of my colleagues disagree sharply about what this means for the rest of us. One says we plainly ought to help: the children would lose out, and each of us could easily spare a couple of hours a week. The other says that what she did was far beyond anything anyone had a right to demand of her, and that this is exactly why it cannot now become a demand on the rest of us — otherwise she has, in effect, unilaterally rewritten all our obligations. I feel the force of both, and also a nagging worry I cannot put into words: we admire her precisely because she did more than she had to, yet if the rest of us decline, we are surely letting the children down. Was she doing something she was required to do, or not? And once that is settled, does it really settle what the rest of us owe — or is my sense that 'both cannot be right' itself the mistake?

  Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Scenario:** A colleague (let's call her Sarah) has run a free, voluntary Saturday tutoring programme for years (4 hours/week, including holidays, no pay, not in contract). She is now ill and asks the science department to cover for a term.
      *   **Conflict:** Two colleagues disagree.
          *   Colleague A (The Altruist): We ought to help; children lose out; we can spare the time.
          *   Colleague B (The Contractualist): Sarah went beyond duty; making us cover sets a precedent that rewrites our obligations; we shouldn't be bound by her unilateral generosity.
      *   **User's Dilemma:** Feels the force of both arguments. Worries about letting children down if they decline. Admires Sarah's extra effort but fears the implication of refusing.
      *   **Key Questions:**
          1.  Was Sarah doing something she was required to do?
          2.  Does settling that question settle what the rest of us owe?
          3.  Is the sense that "both cannot be right" the mistake?
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct the Ethical Dimensions:**
      *   **Duty vs. Supererogation:** This is the core philosophical concept.
          *   *Duty:* What is contractually or morally required.
          *   *Supererogation:* Actions that are good to do but not wrong to omit (going "above and beyond").
          *   Sarah's work is clearly *supererogatory*. It's not in her contract, unpaid, outside normal hours.
      *   **The Precedent Problem (Colleague B's point):** If voluntary work becomes expected, it ceases to be voluntary. This creates "mission creep" or "ethical drift" in the workplace. It exploits goodwill.
      *   **The Consequence Problem (Colleague A's point):** Real children suffer real educational harm if the programme stops. There is a moral weight to the outcome, regardless of contractual obligations.
      *   **The Collective Responsibility:** Does the department have a duty to the community that transcends individual contracts?

  3.  **Address the Specific Questions:**

      *   *Was she required to do it?* No. Contractually, clearly not. Morally, it's debatable, but generally, teachers are not morally obligated to sacrifice their weekends and health indefinitely without compensation. It was a gift.
      *   *Does that settle what we owe?* No. This is the crux. Just because *she* wasn't obliged doesn't mean *we* have no obligation now that circumstances have changed. The context has shifted from "individual generosity" to "collective crisis management."
      *   *Is "both cannot be right" the mistake?* Yes. This is a false dichotomy. Both colleagues are highlighting valid moral principles (fairness/sustainability vs. welfare/consequence). They need synthesis, not selection.

  4.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Empathetic, professional, philosophical but grounded, nuanced.
      *   *Vocabulary:* "Programme," "centre," "realise," "colleague," "term," "estate," "whilst," "ought."
      *   *Structure:*
          1.  Acknowledge the difficulty and the virtue of the situation.
          2.  Address the first question (Was she required?).
          3.  Address the second question (Does that settle our duty?).
          4.  Address the third question (Is the conflict a mistake?).
          5.  Offer a path forward (Synthesis).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Say clearly "She didn't have to, but you should help."
      *   *Correction:* Too simplistic. It ignores Colleague B's valid point about institutional exploitation. If we just say "you should help," we validate the idea that voluntary work becomes mandatory.
      *   *Better approach:* Distinguish between *covering for illness* (temporary, collective support) vs. *adopting the programme permanently* (long-term expectation). The request is for *a term*. This is crucial. It's emergency cover, not adopting the burden.
      *   *Philosophical nuance:* Use the term "supererogatory." It fits perfectly.
      *   *British Context:* Mention the pressure on state schools, the "ethos" of the department, the concept of "collegiality."

  6.  **Final Polish (checking against constraints):**
