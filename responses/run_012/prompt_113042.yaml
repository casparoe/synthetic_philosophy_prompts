    "exam_question": "Answer the following question based on the three stipulated cases below. You need no outside knowledge; do not cite authors or texts. Argue directly from the cases and accounts provided.\n\nCase A (founder effect). In one small, historically isolated community, a single allele has reached high frequency through a founder effect: roughly seven adults in ten carry two copies. The allele causes progressive sensorineural hearing loss beginning in early adulthood. In the wider national population the same genotype occurs in fewer than one person in five hundred and is classed as a rare disorder. No other organ system is affected, and the community has no sign language.\n\nCase B (age-related muscle loss). Between the ages of 40 and 80 the great majority of people lose a substantial fraction of skeletal muscle mass and strength; this loss is a leading contributor to falls, fractures, and loss of independent living. The loss is typical for the reference class of human beings in the seventh to ninth decade of life and is not attributable to any identifiable lesion.\n\nCase C (isolated congenital anosmia). A person is born with a complete, isolated absence of the sense of smell. Every other sensory, motor, and cognitive function is typical for their age; they report no distress, and apart from minor practical inconveniences — they cannot smell smoke or spoiled food — they lead an unimpaired life.\n\nEssay Question:\nFor each of the three cases, state whether it counts as a disease, and — where the account you are using distinguishes disease from illness — whether it also counts as an illness, under each of the following three accounts: (i) the statistical-normality or biostatistical account, on which health is statistically normal functional efficiency relative to a reference class; (ii) a pure normativist account, on which disease is whatever is judged harmful or bad, with no value-free factual core; and (iii) a hybrid harmful-dysfunction account, on which a disorder is a dysfunction in a naturally selected function that also causes harm.\n\nThen, identify which single one of the three cases is the strongest evidence that the biostatistical account cannot settle its reference class without a covert appeal to values. State the naturalist's best reply to that pressure and judge whether the reply succeeds.",
