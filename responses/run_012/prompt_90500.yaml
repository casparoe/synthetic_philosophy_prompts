      *   *The "Gap":* If we mean "Who deserves to be punished?", there is a gap. If we mean "Who pays?", there isn't. The impasse happens because people want the latter to track the former perfectly.
      *   *Diagnosis:* It's not *merely* verbal. It's a *normative mismatch*. We want the practical solution to satisfy metaphysical constraints.
      *   *Progress:* We need to decouple liability from desert in this context. Accept "strict liability" not as a poor substitute for blame, but as the correct normative tool for risk-imposition.
