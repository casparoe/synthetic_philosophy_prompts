answer: |-
  Here is a comprehensive plan for your ninety-minute seminar. It is designed to move students from a naive realist view of concepts (as lists of features) to a generative view (as constraints on process), using your specific Bongard variants to force the philosophical crisis.

  ### 1. The Prerequisite Idea
  **Before the first panel is shown, you must establish that a concept is a *compressor*, not a *label*.**

  Students enter knowing Hume (induction is unjustified) and Goodman (not all predicates are projectible). However, they likely still view a "rule" as a static description of the data points (e.g., "all numbers are even").
  *   **The Setup:** Do not start with the puzzles. Start with a 10-minute discussion on **Prediction vs. Description**.
  *   **The Question:** "If I show you three red balls, and you predict the fourth is red, what assumption have you made about the *source* of the balls?"
  *   **The Goal:** Elicit the idea that induction is not about matching features, but about inferring the *mechanism* that produced the features. If they view concepts as static feature-lists, the "dependency structure" variant will make no sense. They must accept that two datasets can be identical in *state* but different in *history*, and that the history is what licenses the prediction.

  ### 2. The Spine Example: To Use or Not to Use?
  **Use the sequence (1, 2, 6, 24, 120 vs. 1, 2, 4, 8, 16), but with a strict constraint.**

  *   **Why:** It is mathematically transparent, allowing students to focus on the *logic of the rule* rather than decoding obscure perceptual features. It leverages their existing knowledge to create a "fluency trap" that you will exploit.
  *   **The Risk:** Students will instantly identify "Factorials" and "Powers of 2." If they name the sequences, they stop analyzing the *structure* and rely on semantic memory.
  *   **The Mitigation:** **Ban sequence names.** When a student says "Factorial," stop them. Ask: "Describe the *operation* required to get from term $n$ to term $n+1$ without using the word 'factorial' or referencing the index $n$ directly."
  *   **Why this carries the session:** Because it is familiar, the *structural* distinction (local vs. global dependency) becomes more shocking. If the data were obscure, they would assume the complexity lay in the data. Since the data is simple, the complexity must lie in the *inductive bias*.

  ### 3. Session Sequence and Variant Ordering
  The order must escalate the underdetermination. Do not introduce the variants as separate "types"; introduce them as **iterations of the same problem** that strip away solutions.

  **Phase 1: The Illusion of Determinacy (Minutes 15–40)**
  *   **Material:** Spine Panel 1 (1, 2, 6, 24, 120 | 1, 2, 4, 8, 16).
  *   **Activity:** Ask for the rule. Students will propose surface features (e.g., "Left grows faster").
  *   **The Turn:** Reveal Spine Panel 2 (Left adds 720; Right adds 32).
  *   **The Point:** Show that multiple rules fit Panel 1, but you are privileging the *generative dependency* rule.
  *   **Philosophical Hook:** Ask, "Why did you assume the rule concerns the *relation between terms* rather than the *properties of the terms*?" This establishes the **Feature-List vs. Generator** distinction.
  *   **Misconception to Head Off:** *The Rule is a Property of Items.*
      *   *Intervention:* When a student says "The left numbers are composite," point out that 2 is prime. Force them to articulate the *transition function*.

  **Phase 2: The Crisis of Fit (Minutes 40–65)**
  *   **Material:** Spine Panel 3 (The Lure).
      *   *Left:* A sequence that looks local but is global (e.g., a sequence that mimics a geometric progression for 5 steps then diverges).
      *   *Right:* A sequence that looks global/noisy but is local (e.g., a recurrence with a hidden state).
      *   *Crucially:* One example on each side violates the surface pattern of its own group but fits the *deep* rule.
  *   **Activity:** Students will try to find a rule that fits *all* data points perfectly. They will fail or propose a disjunctive monstrosity.
  *   **The Turn:** Force a choice. "Do you accept a simple rule with one exception, or a complex rule with no exceptions?"
  *   **Philosophical Hook:** This is the core of the session. Simplicity is not aesthetic; it is a constraint on *projectibility*.
  *   **Misconception to Head Off:** *The Lure is a Mistake.*
      *   *Intervention:* Students will say, "That example is wrong." You must say, "The example is correct; your hypothesis space is too narrow." This mirrors the scientific reality of anomalies vs. paradigm shifts.
  *   **Misconception to Head Off:** *Simplicity is Merely Aesthetic.*
      *   *Intervention:* Ask, "If you bet money on the next number, which rule do you bet on?" Connect simplicity to risk and error cost.

  **Phase 3: Generalization to Etiology (Minutes 65–80)**
  *   **Material:** The Etiological Variant (Indistinguishable figures, different history).
  *   **Activity:** Show two identical shapes. Reveal one was drawn by a continuous stroke (compositional), the other by filling a mask (holistic).
  *   **The Point:** If the *state* is identical, why does the *history* matter?
  *   **Philosophical Hook:** This generalizes the lesson from math to metaphysics. It shows that "Concept" = "Causal History," not "Perceptual Appearance." This connects directly to Cognitive Science (naive physics, essentialism).
  *   **Misconception to Head Off:** *Finite Sample Determines Unique Concept.*
      *   *Intervention:* Remind them that in this panel, the *samples are identical*. If the samples are identical but the concepts differ, the concept cannot be in the sample. It must be in the *context of generation*.

  **Phase 4: Assessment and Closure (Minutes 80–90)**
  *   **Activity:** The Final Question (see below).
  *   **Wrap-up:** Summarize the shift from Feature-List to Generator-Relative.

  ### 4. Anticipating Misconceptions and Interventions

  | Stage | Misconception | Where it appears | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **Phase 1** | "The rule is a property of the numbers." | Panel 1 discussion. | Refuse to accept predicates like "is even." Demand a *function* $f(x_{prev}) \to x_{next}$. |
  | **Phase 1** | "The data determines the rule." | After Panel 2. | Ask: "Could a different rule generate 1, 2, 4, 8, 16, 32?" (Yes, polynomial interpolation). Ask why we reject it. |
  | **Phase 2** | "The Lure is an error/noise." | Panel 3 discussion. | Explicitly state: "Assume the data is noise-free. The exception is part of the signal." |
  | **Phase 2** | "Simplicity is just elegance." | Choosing between Complex/Perfect vs. Simple/Exception. | Frame it as *cognitive cost* or *prediction risk*. "Which rule is more robust to new data?" |
  | **Phase 3** | "If it looks the same, it is the same." | Etiological panel reveal. | Ask: "If I tear the paper, how does it rip?" (Probing the hidden structure). |

  ### 5. The Final Assessment Question
  Do not ask them to solve a new Bongard problem. That tests pattern recognition, not philosophical understanding. Ask a question that forces them to justify the *inductive bias*.

  **The Question:**
  > "Imagine a world where the 'Lure' examples (the exceptions) are actually the majority case, and the 'Simple Rule' examples are the rare outliers. In that world, would your preference for the simple generator be rational? If not, what does that imply about the status of 'simplicity' in our actual world—is it a logical truth, or an empirical assumption about the universe we inhabit?"

  **Why this works:**
  *   It tests if they understand that simplicity is a *bias*, not a logical necessity.
  *   It connects the Bongard mechanics back to Hume/Goodman (is the uniformity of nature an assumption?).
  *   It distinguishes between learning the *puzzle* and learning the *problem of induction*.

  ### 6. What to Explicitly Refuse to Explain
  You must draw a boundary to keep the session philosophical rather than technical. State this explicitly at the start of Phase 2.

  **The Refusal:**
  > "I will not be introducing formal metrics for complexity, such as Minimum Description Length, Kolmogorov Complexity, or Bayesian priors. I am refusing this because I want you to grapple with the *intuition* of why we prefer one generator over another before we quantify it. If we quantify it now, you will outsource the philosophical work to a formula."

  **Why:**
  *   First-year grads often hide behind formalism to avoid conceptual ambiguity.
  *   Learning Theory (VC Dimension, etc.) solves the *how*, but not the *why* of the bias.
  *   Keeping it informal forces them to articulate the *normative* claim (why *should* we prefer local dependency?) rather than the *computational* claim (how do we calculate it?).

  ### 7. Instructor's Note on the "Spine" Logic
  *Caution:* Your definition of the Spine rule ("nth term depends on all previous" vs. "immediately preceding") requires careful handling with the specific numbers $1, 2, 6, 24, 120$.
  *   Mathematically, $n!$ can be generated locally if the index $n$ is available ($a_n = n \cdot a_{n-1}$).
  *   To make your philosophical point hold, you must define the "state" available to the generator.
  *   **Instruction:** Tell the students: "Assume the generator sees *only* the sequence of values produced so far, not the index counter."
      *   Right Side ($2^n$): To get the next number, you only need the *last number* (multiply by 2).
      *   Left Side ($n!$): To get the next number from the *values alone*, you need to know how many values came before (to know what integer to multiply by).
      *   This clarifies the "Global vs. Local" dependency without getting bogged down in index arithmetic.

  ### Summary of the Pedagogical Arc
  1.  **Naive Realism:** Concepts are feature lists. (Broken by Phase 1).
  2.  **Generativism:** Concepts are rules. (Broken by Phase 2).
  3.  **Underdetermination:** Rules are underdetermined by data; we need bias. (Broken by Phase 3).
  4.  **Etiological Essentialism:** The "Bias" is a assumption about the *history* of the data, not just its form. (Solidified by Final Question).

  This plan uses your variants not as puzzles to be solved, but as epistemic traps to be sprung, forcing the students to reconstruct their understanding of what a "concept" is.
