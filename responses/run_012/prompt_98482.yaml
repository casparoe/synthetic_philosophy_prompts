      *   **Goal:** Make participants *feel* Pascal's account of justice and force (from *Pensées*), specifically the third layer: making the strong just by dressing it in custom/precedent.
      *   **Constraint:** No lecture upfront. No mention of Pascal until debrief.
      *   **Mechanism:** Staged deliberation, fictional settlement, scarce resource allocation.
      *   **Metrics:** Two tallies on flip chart (Compliance vs. Legitimacy). Legitimacy via secret ballot.
      *   **Roles:** Hidden interest cards (fair rule costs them), Enforcement role (costly to enforce against strong).
      *   **Key Mechanic:** "Labeling Rule" (Custom vs. New Decision) to show legitimacy shifts without content change.
      *   **Deliverables:** Setup, materials, roles, round structure/timing, scoring, ballot wording, debrief script, handling notes for predictable failures, limitations analysis.

  2.  **Deconstruct Pascal's Argument (for alignment):**
      *   *Layer 1:* Just but unenforced = Wish. (Needs a round where a fair rule is proposed but ignored/unsupported).
      *   *Layer 2:* Enforced but unjust = Tyranny. (Needs a round where force compels compliance but legitimacy tanks).
      *   *Layer 3:* Strong made Just = The Illusion. (Needs a round where the status quo/power distribution is re-labeled as "Custom" to boost legitimacy).
      *   *Core Tension:* Justice without force is helpless; force without justice is accused. We must combine them. Since we can't make the just strong, we make the strong just.

  3.  **Design the Simulation ("The Aquifer of Oakhaven"):**
      *   *Resource:* Water (classic, tangible, scarce).
      *   *Participants:* 18 people.
      *   *Structure:* 3 Rounds + Debrief.
      *   *Tallies:* Compliance (Public, based on action) vs. Legitimacy (Private, secret ballot).

  4.  **Develop Roles & Incentives:**
      *   Need asymmetry to create the "Strong" vs. "Weak" dynamic.
      *   *The Upstream (Strong):* 5 people. Control the source. Get more water naturally.
      *   *The Downstream (Weak):* 10 people. Rely on flow. Get less.
      *   *The Enforcer (The Sword):* 1 person. (Wait, 16 + 1 = 17. Need 18. Let's make the Enforcer a role that rotates or is a specific committee. Better: 1 Enforcer, 5 Upstream, 12 Downstream = 18).
      *   *Hidden Interests:* Upstream want to keep water. Downstream want redistribution. Enforcer wants order but pays a cost to punish Upstream.
      *   *Scoring:* Points represent "Survival/Prosperity."
      *   *Legitimacy Ballot:* Simple thumbs or slip of paper? Request says "secret ballot." Slips of paper into a hat is low tech and effective.

  5.  **Drafting the Rounds:**
      *   *Round 1 (The Wish):* Propose a "Just" rule (Equal share). Upstream ignores it. Enforcer hesitates to punish. Compliance low. Legitimacy high (in theory) but irrelevant.
      *   *Round 2 (The Tyranny):* Enforcer forces the "Just" rule aggressively. Upstream complies due to threat. Legitimacy drops (Upstream feels oppressed, Downstream feels unstable). Or, Enforcer gives up and enforces the "Strong" rule. Let's try: Enforcer tries to enforce Justice, finds it too costly/personally risky, switches to enforcing the Status Quo.
      *   *Round 3 (The Custom):* The Status Quo (Upstream gets more) is re-labeled as "Ancient Custom." Legitimacy should rise despite inequality.

      *Refining the Mechanic for Layer 3:* The prompt specifically asks for a "Labeling Rule." The council can attach a status.
      *   *Revised Round 3:* The allocation is the same as Round 2 (favoring the Strong), but the *justification* changes from "Because we have the guns" to "Because this is the Ancient Way."

  6.  **Addressing the "Cost" of Enforcement:**
      *   The Enforcer needs a reason not to punish the Upstream.
      *   *Idea:* If the Enforcer punishes an Upstream player, the Enforcer loses points (risk of coup/violence). If they punish Downstream, no cost.
      *   *Incentive:* Enforcer wants to maximize total room points *minus* their enforcement costs.

  7.  **Addressing the "Secret Ballot":**
      *   Need a quick way to tally 18 votes without breaking flow.
      *   *Method:* Red/Blue cards? No, that's visible. Folded paper? Too slow.
      *   *Method:* Closed eyes, raise hand? Not secret enough.
      *   *Method:* 18 slips, passed in a bowl. Fast enough for 3 rounds.
      *   *Question:* "Is this rule binding on conscience?" (Yes/No).

  8.  **Timing (90 Minutes):**
      *   Setup/Instructions: 15 mins.
      *   Round 1 (Justice): 20 mins.
      *   Round 2 (Force/Tyranny): 20 mins.
      *   Round 3 (Custom/Legitimacy): 20 mins.
      *   Debrief: 15 mins.
      *   *Critique:* That's tight. 90 mins goes fast. Need to tighten instructions.
      *   *Revised:* Setup 10, R1 20, R2 20, R3 20, Debrief 20.

  9.  **Handling Predictable Failures:**
      *   *Gaming the Ballot:* Downstream might lie to boost legitimacy of a fair rule. *Fix:* Emphasize "Conscience" not "Strategy."
