answer: |-
  ### Desiderata for a Theory of Contrastive Concept Induction

  **1. The Selection Requirement (Underdetermination)**
  *   **Statement:** The theory must specify a mechanism that selects a single rule from the indefinitely many logical possibilities consistent with the data, and it must determine whether a "fact of the matter" exists when competing rules appear equally defensible.
  *   **Motivation:** Any finite set of figures is consistent with infinite predicates (e.g., "contains a triangle" vs. "contains a shape with fewer than 10 sides"). Human solvers converge on one answer and reject others as "clever but wrong." A theory that merely enumerates consistent rules fails to model the solver; it must model the *preference*.

  **2. The Contrast Requirement (Differential Information)**
  *   **Statement:** The theory must treat the two sets as a single logical unit where the second set functions as a constraint on the description of the first, rather than treating the sets as independent collections to be characterized separately.
  *   **Motivation:** The rule is not "what is in Set 1"; it is "what is in Set 1 *and not* in Set 2." A rule that accurately describes Set 1 but also applies to Set 2 is false. Information is carried by the *boundary* between the sets, not the density within them.

  **3. The Projection Requirement (Generalization)**
  *   **Statement:** The theory must produce rules that are projectable to novel figures not present in the display, distinguishing between accidental regularities of the specific 12 figures and lawful properties of the concept.
  *   **Motivation:** A rule like "the top-left figure in Set 1 is a circle" fits the data but fails on new instances. Solvers reject overfitting descriptions. The theory must account for the intuition that the rule governs *possible* figures, not just *actual* ones.

  **4. The Open Vocabulary Requirement (Compositionality)**
  *   **Statement:** The theory must construct rules from a vocabulary of primitives (topology, count, symmetry, etc.) that is not fixed per problem but is drawn from a shared, flexible library that allows for transfer of competence across problems.
  *   **Motivation:** Problem A may require counting vertices; Problem B may require detecting containment. A theory with a fixed feature vector for all problems cannot capture this shift. Yet, the primitives recur (counting appears again in Problem C), implying a stable underlying competence rather than ad-hoc invention.

  **5. The Procedural Requirement (Feasibility)**
  *   **Statement:** The account must be a runnable procedure that terminates in finite time, rather than a logical characterization of the solution space or a post-hoc description of the answer.
  *   **Motivation:** Cognitive theories must explain how the answer is *found*, not just what it *is*. An oracle that verifies rules is not a solver. The theory must respect bounds on attention and processing steps.

  **6. The Difficulty Requirement (Complexity Correlation)**
  *   **Statement:** The theory must correlate the computational resources or depth of search required to find the rule with the phenomenological difficulty experienced by human solvers.
  *   **Motivation:** Some Bongard problems are solved in seconds; others take hours or remain unsolved. A theory that treats all problems as equally distant from the solution fails to capture the structure of the search space.

  ***

  ### Critical Analysis

  #### Genuine vs. Parochial Requirements
  Not all desiderata are created equal. Some reflect the phenomenon itself; others reflect the biases of computational modeling.

  *   **Genuine:** **Selection (1)**, **Contrast (2)**, **Projection (3)**, and **Open Vocabulary (4)** are genuine. They describe the phenomenology of the task. Humans *do* agree on answers (1), they *do* use the negative examples actively (2), they *do* expect the rule to hold for new figures (3), and they *do* transfer concepts like "symmetry" across different visual domains (4). Any theory ignoring these fails to describe the cognition.
  *   **Parochial:** **Procedural (5)** and **Difficulty (6)** are parochial demands of a computationalist style of theory. They assume cognition is isomorphic to an algorithm running on a von Neumann architecture with measurable "steps." While useful for engineering a solver, demanding a specific procedural trace may constrain the theory to match the *implementation* rather than the *competence*. A connectionist or dynamical systems account might satisfy the genuine requirements without satisfying the Procedural Requirement as stated (e.g., without discrete search steps).

  #### The Incompatibility Result
  There is a structural conflict within the problem constraints that no theory can resolve without positing hidden structure. The following subset of requirements cannot be satisfied simultaneously under the stated Standard of Adequacy (one-shot, no external sources/precedents):

  **The Conflict:** **The Selection Requirement (1)** + **The Open Vocabulary Requirement (4)** + **The No-Precedent Standard.**

  **The Result:** **Pure Induction is Impossible.**
  To satisfy **Selection (1)**, the solver must have a bias to prefer one rule over the infinite others consistent with the data. To satisfy **Open Vocabulary (4)**, this bias cannot be hard-coded to specific features (e.g., "prefer triangles"), or the vocabulary is not truly open. To satisfy the **No-Precedent Standard**, the bias cannot be learned from prior problems.
  Therefore, the bias must be innate and structural (e.g., a preference for shorter descriptions). However, structural biases alone cannot select *semantic* content (e.g., distinguishing "inside" from "outside" or "three" from "many") without prior exposure to the meaning of those primitives.
  **Conclusion:** Any theory that claims to solve this problem in one shot with an open vocabulary must implicitly violate the **No-Precedent Standard** by positing rich, content-specific innate knowledge. The problem does not permit a "blank slate" solver. The "fact of the matter" in Selection (1) exists only relative to unacknowledged priors.

  #### The Exclusionary Requirement
  The single requirement that does the most to exclude the obvious families of account (similarity classification, fixed features, statistical learning, memorization) is:

  **The Open Vocabulary Requirement (4).**

  **Reasoning:**
  *   **Fixed Features:** This requirement directly contradicts the assumption that a static feature vector can represent all problems. If the vocabulary is open and compositional, a fixed feature set is insufficient by definition.
  *   **Classification by Similarity:** Similarity metrics require a fixed dimensional space to compute distance. If the relevant dimensions (primitives) change from problem to problem (counting vs. topology), there is no stable metric space in which to compute similarity.
  *   **Statistical Learning:** Statistical methods rely on estimating distributions over fixed variables. With an open vocabulary and only 6 positive examples, the data is too sparse to estimate probabilities for newly constructed predicates.
  *   **Memorization:** Memorization relies on matching current inputs to stored instances. An open vocabulary implies the generation of novel *descriptions* (programs), not the retrieval of stored *images*.

  While the **Contrast Requirement (2)** excludes simple similarity models, and the **No-Precedent Standard** excludes memorization, only the **Open Vocabulary Requirement** forces the theory to be a *program synthesizer* rather than a *classifier*. It demands that the system construct the very language in which the answer is written, which is incompatible with any architecture that assumes the representation is given in advance.
