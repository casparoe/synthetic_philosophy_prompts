prompt: |-
  I run restorative justice for a mid-size school district — about a dozen cases a month, mostly fights, theft, and one ongoing mess where a group of kids has been making a Muslim girl's life hell. My facilitators are teachers and counselors who did a two-day training. We get 45 minutes and sometimes a follow-up. Anything that ends in suspension has to survive the principal and the district's lawyer, so I need something I can defend to people who are never going to read philosophy.

  Here's my problem. We say we do this because of ubuntu — that a person is a person through other people, that you become a person rather than just starting out as one, that the community is what makes a self at all. I believe it, mostly. But when I actually have to decide something I've got nothing. Does the kid who got hurt get to say no to the conference and shut the whole thing down? Do we run it if the kid who did it won't admit anything? Do we let him back in class when the other parents are furious? I fall back on "what would the principal not get yelled at for," which isn't a philosophy, it's just cowardice with a talking stick.

  So write me a procedure I can actually run on a case, in the order I'd run it: the questions to ask, what counts as an answer good enough to move on, where it stops with a no, and where it hands the decision to a human because it's a values question and not a factual one. Ground it in the relational view of persons, not generic "restorative practices." I want the parts that would be different if I didn't believe any of this, and I want you to flag the parts that are just good facilitation dressed up as metaphysics.

  Some things it has to survive:

  - The personhood-is-achieved part. If a 13-year-old isn't yet a full person in the relevant sense, that sounds like it could license treating kids as projects instead of as people with standing right now. Does the view actually say that, and should the procedure care?
  - The community-defines-the-person part, which I've heard read two ways — one where the community is what makes you a person at all, another where it's necessary but doesn't get to swallow you. Tell me which reading the procedure is assuming and what breaks if I switch to the other one.
  - The fact that this stuff has been used to demand conformity — "we're all one family here, so stop making trouble." Which is exactly what the kids tormenting my student could say, and what a school says to a gay kid who won't go along with the room.
  - The accusation that it isn't a theory at all, just a warm feeling, and the counter-accusation that turning it into a flowchart is the real betrayal, since it's supposed to be about the person in front of you and not the rule. If a procedure is the wrong artifact, say so and tell me what to do instead — but I still have to decide something by Friday.

  Then run it on three: the harassment case, where the victim's family wants it handled by the police and won't sit in a room with anyone; a one-time theft where the kid who took the phone is genuinely sorry and the victim wants him expelled anyway; and a case where the "community" — a pack of parents — is demanding that the kid who threw the punch be removed from school, and a conference would just be a nicer-looking way of doing what they already want.

  Include at least one where the procedure tells me to do something I don't want to do, and one where it tells me I'm not allowed to do the thing everybody in the room wants. And tell me straight what the procedure can't do. I'd rather know the three places it will misfire than have it pretend to cover everything.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Restorative Justice (RJ) coordinator for a mid-size school district.
      *   **Context:** ~12 cases/month (fights, theft, harassment). Facilitators are teachers/counselors with minimal training (2 days). Time-constrained (45 mins + follow-up). High stakes (suspensions, legal liability, principal approval).
      *   **Core Problem:** The philosophical foundation (*Ubuntu*/relational personhood) feels disconnected from practical decision-making. Currently falling back on "what won't get the principal yelled at."
      *   **Task:** Create a concrete, actionable procedure grounded in the relational view of persons (*Ubuntu*), not generic RJ.
      *   **Specific Requirements:**
          *   Order of operations (questions, thresholds, stop points, hand-offs).
          *   Address specific philosophical tensions (personhood-as-achieved vs. inherent standing, community definition vs. conformity, theory vs. flowchart).
          *   Flag "facilitation dressed up as metaphysics."
          *   Run the procedure on three specific cases (Harassment/Muslim girl, Theft/Expulsion demand, Fight/Parent mob).
          *   Include constraints: One outcome the user won't like, one outcome the room won't like.
          *   Admit limitations (where the procedure misfires).

  2.  **Deconstruct the Philosophy (*Ubuntu* in a School Context):**

      *   *Core Tenet:* "I am because we are." Personhood is relational. Harm damages the web, not just individuals. Repair restores the web.
      *   *Tension 1: Achieved vs. Inherent Personhood.* If personhood is *achieved* through community, does a kid who acts badly lose standing? *Resolution for Procedure:* In a school context, we must treat personhood as *potential* that requires protection, not a reward for good behavior. The procedure must assume standing *now* to facilitate the *becoming*.
      *   *Tension 2: Community Definition vs. Conformity.* Does the community define the self (risk of tyranny of the majority) or sustain it? *Resolution:* The procedure must prioritize the *health of the web* over the *comfort of the majority*. If the "community" demand excludes a member, the web is broken, not healed.
      *   *Tension 3: Theory vs. Flowchart.* A flowchart can betray the spirit. *Resolution:* Frame the procedure as a "Diagnostic Tool" rather than a "Decision Tree." It identifies *readiness*, not just outcomes.

  3.  **Drafting the Procedure (The "Relational Readiness Protocol"):**

      *   *Goal:* Move from "What punishment fits?" to "Is the web repairable?"
      *   *Steps:*
          1.  **Safety & Standing Check:** Is anyone physically unsafe? Does the victim have standing to refuse? (Crucial for *Ubuntu*—you can't force relation).
          2.  **Accountability Threshold:** Does the harm-doer acknowledge impact? (Not necessarily legal guilt, but relational impact).
          3.  **Community Capacity:** Is the "community" (parents/class) capable of holding reintegration, or will they sever the web?
          4.  **The Decision Point:** Conference vs. Administrative Action.
      *   *Flagging Metaphysics:* Explicitly note where "listening" is actually "risk assessment."

  4.  **Addressing the Philosophical Constraints:**

      *   *Personhood-as-achieved:* The procedure must treat the child as a *person-in-becoming*. We don't withhold RJ because they aren't "good" yet; we use RJ to help them *become*.
      *   *Community Definition:* We assume the "Weak/Supportive" reading (community sustains personhood) not the "Strong/Definitive" reading (community dictates personhood). If the community demands exclusion, the procedure must override the community to save the person.
      *   *Conformity:* Explicit check against "peace at the cost of justice."

  5.  **Running the Cases:**

      *   *Case 1: Harassment (Muslim Girl).* Victim says no. Parents want police.
          *   *Procedure Outcome:* Stop. No conference.
          *   *Why:* Forced relation is violence. *Ubuntu* requires mutual recognition. If one side refuses, the web cannot be woven by force.
          *   *Constraint Check:* User might want to try anyway to avoid suspension. Procedure says No.
      *   *Case 2: Theft (Sorry Kid, Angry Victim).* Kid sorry. Victim wants expulsion.
          *   *Procedure Outcome:* Conference proceeds, but reintegration is conditional on victim's safety/comfort, not expulsion.
          *   *Why:* Expulsion severs the web permanently. If accountability exists, the web *can* be repaired. Victim's anger is valid, but permanent exile contradicts the goal of *becoming*.
          *   *Constraint Check:* Room (Victim) wants expulsion. Procedure says No (to expulsion as primary goal).
      *   *Case 3: Fight (Parent Mob).* Parents want kid gone. Conference = soft removal.
          *   *Procedure Outcome:* Administrative removal (Suspension/Expulsion) necessary.
          *   *Why:* The "Community" (parents) is currently toxic to the web. Reintegrating now destroys the web's trust. The school must hold the boundary until the community cools.
          *   *Constraint Check:* User wants to do RJ to look progressive. Procedure says No (RJ is unsafe/impossible here).

  6.  **Refining the Output:**

      *   *Tone:* Direct, professional, slightly weary but principled. Acknowledge the "cowardice" comment.
      *   *Structure:*
          1.  Philosophical Grounding (The "Why").
          2.  The Procedure (The "How").
          3.  The "Metaphysics vs. Facilitation" Flags.
          4.  Case Applications.
          5.  Limitations (Where it breaks).
      *   *Self-Correction during drafting:* Make sure I don't just give generic RJ steps (Pre-conference, Circle, Agreement). I need to focus on the *decision points* the user asked for (Yes/No, Stop/Go). The user asked for a procedure to *decide*, not just to facilitate.
      *   *Addressing the "Personhood" worry:* Ensure the procedure doesn't treat kids as projects. The "Standing Check" is key here. They have standing *before* they earn it.

  7.  **Final Review against Constraints:**
      *   Grounded in relational view? Yes.
      *   Flag metaphysics vs. facilitation? Yes.
      *   Address personhood/achieved tension? Yes.
      *   Address community/conformity tension? Yes.
      *   Run on 3 cases? Yes.
      *   One outcome user dislikes? Yes (Case 1: No RJ).
      *   One outcome room dislikes? Yes (Case 2: No Expulsion).
      *   Admit limitations? Yes.

  8.  *(Self-Correction on Case 3)*: Wait, if the parents demand removal, and I say "Administrative removal," isn't that just punishment? Yes. But the prompt asks where the procedure tells me I'm *not allowed* to do what everybody wants. In Case 3, everybody (parents, maybe principal) might want a "quick RJ fix" to avoid bad press, but the procedure says "No, the community is too hostile, this needs punitive containment first." OR, everybody wants the kid gone, and the procedure says "No, we must attempt reintegration." Let's go with the latter for stronger *Ubuntu* alignment, but acknowledge the risk. Actually, looking at the harassment case, the victim saying "No" stops it. In the Fight case, if the *community* is hostile, *Ubuntu* says the community needs repair too. If the community demands exclusion, *Ubuntu* challenges the community. Okay, let's make Case 3 the one where the procedure forbids the "easy" RJ wash. The parents want the kid gone. The user wants to do RJ to show progress. The procedure says: "Do not do RJ yet. The community is not safe." That fits the "User doesn't want to do" constraint.
      *   *Wait, re-reading constraint:* "Include at least one where the procedure tells me to do something I don't want to do, and one where it tells me I'm not allowed to do the thing everybody in the room wants."
      *   *Adjustment:*
          *   Case 1 (Harassment): Victim says No. Procedure says Stop. (User might want to push for RJ to avoid suspension/police). -> User doesn't want to do this.
          *   Case 2 (Theft): Victim wants Expulsion. Procedure says No Expulsion (if accountability met). -> Room doesn't want this.
          *   Case 3 (Fight/Parents): Parents want kid gone. User wants RJ. Procedure says... actually, if the community is hostile, *Ubuntu* requires the community to be ready. If they aren't, RJ fails. So Procedure says "No RJ." This overlaps with Case 1. Let's make Case 3 about the *reintegration*. The kid is back, parents are mad. Procedure says "School must protect the kid from the parents' wrath, even if parents are furious."
      *   *Better alignment:*
          *   Case 1: Victim refuses. Procedure = No Conference. (User wants to avoid police/escalation, but must respect refusal).
          *   Case 2: Victim wants expulsion. Procedure = Reintegration Plan (No Expulsion). (Room wants exile, Procedure demands relation).
          *   Case 3: Parents want kid gone. Procedure = No Conference *yet* (Safety/Community Capacity fail). (User wants to close file with RJ, Procedure says "Not ready").

      *   *Wait, I need to be careful on Case 2.* If the victim wants expulsion, does *Ubuntu* support expulsion? Expulsion severs the relation. *Ubuntu* prefers repair. But if the victim's personhood is threatened by the presence of the thief... okay, let's stick to: If accountability is genuine, exile is a failure of the community, not the kid. So Procedure blocks expulsion.

      *   *Refining the "Personhood" warning:* I need to explicitly state that treating kids as "projects" is a violation of the philosophy. The procedure must treat them as agents *now*.

      *   *Refining the "Metaphysics" flag:* I need to point out where "listening" is actually just "gathering evidence for liability."

      *   *Let's write.*
answer: |-
  This is a **Relational Readiness Protocol (RRP)**. It is not a script for a circle. It is a decision matrix for *whether* a restorative process is ethically permissible and practically viable under an *Ubuntu* framework.

  It is designed to stop you from using restorative language to coerce compliance or bypass safety. It forces you to make the hard call *before* you book the room.

  ### Part 1: The Philosophical Grounding (Read this before the flowchart)

  You asked about the tensions in *Ubuntu*. Here is how this procedure resolves them so you can defend them to a lawyer or a principal.

  1.  **Personhood: Achieved vs. Inherent.**
      *   *The Trap:* If personhood is *achieved* through relation, a child who harms others has damaged their own standing. This tempts us to treat them as "projects" to be fixed before they get rights.
      *   *The Procedure's Stance:* We assume **Inherent Potential, Relational Actualization.** The child *is* a person with standing right now (inherent), but their *capacity to act as a full moral agent* is dependent on the web of relations (actualization).
      *   *Operational Rule:* You cannot withhold the *opportunity* for repair (standing) based on past behavior, but you cannot force the *process* of repair if the web is too torn to hold it.
  2.  **Community: Sustainer vs. Dictator.**
      *   *The Trap:* "The community defines the person" is often used to mean "The majority dictates what the minority must become." This is how harassment gets justified as "culture."
      *   *The Procedure's Stance:* **Weak Communitarianism.** The community is necessary for personhood, but it does not own the person. If the community demands the exclusion of a member to preserve its own comfort, the community is broken, not the member.
      *   *Operational Rule:* If the "community" (parents, peers) demands exile, the procedure prioritizes the reintegration of the excluded member *unless* their presence physically threatens the safety of the web.
  3.  **Theory vs. Flowchart.**
      *   *The Trap:* Turning this into rules betrays the "person in front of you."
      *   *The Procedure's Stance:* This is not a rule for the *interaction*; it is a rule for the *institution*. You need a flowchart to protect the facilitator from administrative pressure. The flowchart protects the space where the metaphysics can happen.

  ---

  ### Part 2: The Procedure (The Relational Readiness Protocol)

  Run this in order. If you hit a **STOP**, you do not run a conference. You move to administrative adjudication (suspension, police, expulsion).

  #### Step 1: The Standing Check (Victim/Harmed Party)
  **Question:** Does the person who was harmed consent to a relational encounter?
  *   **Yes:** Move to Step 2.
  *   **No:** **STOP.**
      *   *Action:* Do not schedule a conference. Do not coerce. Process the harm administratively (punitive or protective).
      *   *Philosophical Defense:* *Ubuntu* requires mutual recognition. You cannot force someone into a relation to repair a relation. Forced repair is a second harm.
      *   *Metaphysics Flag:* This isn't just "best practice." If you force this, you are treating the victim as a means to the offender's rehabilitation, violating their status as an end-in-themselves.

  #### Step 2: The Accountability Threshold (Harm-Doer)
  **Question:** Does the harm-doer acknowledge the *impact* of their actions on the other person? (Note: They do not need to admit legal guilt or intent, only impact).
  *   **Yes:** Move to Step 3.
  *   **No:** **STOP.**
      *   *Action:* Administrative adjudication.
      *   *Philosophical Defense:* Without acknowledgment of impact, there is no shared reality. A conference without this is gaslighting. It asks the victim to negotiate with someone who denies their pain exists.
      *   *Metaphysics Flag:* This looks like "facilitation," but it's actually epistemic safety. If they deny the impact, they deny the victim's personhood.

  #### Step 3: The Community Capacity Test (The Web)
  **Question:** Is the surrounding community (class, parents, grade level) capable of holding the reintegration of the harm-doer without severing ties?
  *   **Yes:** Move to Step 4.
  *   **No:** **STOP.**
      *   *Action:* Administrative removal (suspension/expulsion) OR intensive community repair *before* offender reintegration.
      *   *Philosophical Defense:* If the community demands exile, the web is toxic. Putting the kid back in a web that rejects them sets them up to fail. The *community* needs intervention, not just the kid.
      *   *Metaphysics Flag:* This is where you fight conformity. If the parents say "Get him out," and you say "No," you are asserting that the community's comfort is less important than the web's integrity.

  #### Step 4: The Reintegration Viability
  **Question:** Can the harm-doer return to the shared space without the victim feeling unsafe or surveilled?
  *   **Yes:** **PROCEED** to Conference/Agreement.
  *   **No:** **HANDOFF.**
      *   *Action:* This is a values question for the Principal/District.
      *   *Note:* If the answer is No, RJ has failed. Do not try to "RJ" your way out of a safety violation.

  ---

  ### Part 3: Where the Metaphysics Ends and the Job Begins

  You asked to flag the parts that are just good facilitation dressed up as metaphysics. Here they are. Be honest about these in your reports.

  1.  **"Active Listening" is Risk Assessment.**
      *   *The Metaphysics:* "We listen to hear the humanity."
      *   *The Reality:* When a facilitator listens to a kid deny harm, they are gathering evidence that Step 2 has failed. Don't pretend the listening itself is healing if the kid is lying. It's data collection.
  2.  **"The Circle" is Containment.**
      *   *The Metaphysics:* "We sit in equality."
      *   *The Reality:* The circle keeps bodies in a room so adults can assess threat levels. It is a controlled environment. If the power dynamic is too skewed (e.g., gang vs. individual), the circle is a trap, not a healing space.
  3.  **"Agreement" is Contract Law.**
      *   *The Metaphysics:* "A covenant to restore the web."
      *   *The Reality:* It's a behavioral contract that survives legal scrutiny. If it can't be enforced, it's a poem, not a procedure.

  ---

  ### Part 4: Running the Cases

  Here is how the RRP handles your three messes.

  #### Case 1: The Harassment (Muslim Girl)
  *   **Facts:** Ongoing religious harassment. Victim's family wants police. Refuses conference.
  *   **RRP Application:**
      *   **Step 1 (Standing):** Victim says No.
      *   **Result:** **STOP.**
      *   **Action:** You do not run a conference. You support the family's decision to involve police or pursue punitive suspension.
      *   **Why:** *Ubuntu* cannot be weaponized to force a victim to sit with their tormentor. To do so would be to say the "community's desire for peace" outweighs the girl's safety.
      *   **Constraint Check:** **You don't want to do this.** You want to avoid police involvement and keep it "in-house." The procedure forbids you from using RJ to bypass the victim's will.
      *   **Defense to Principal:** "Restorative justice requires voluntary participation to be ethical. Coercing the victim invalidates the process and exposes the district to liability for secondary harm."

  #### Case 2: The Theft (Sorry Kid, Angry Victim)
  *   **Facts:** Kid took phone, admits it, genuinely sorry. Victim wants him expelled.
  *   **RRP Application:**
      *   **Step 1 (Standing):** Victim consents to talk (assumed for this scenario, or they wouldn't be demanding expulsion via you).
      *   **Step 2 (Accountability):** Kid acknowledges impact. Pass.
      *   **Step 3 (Community Capacity):** The "Community" (Victim) demands exile.
      *   **Result:** **Override.** The procedure dictates you **cannot expel** solely based on victim anger if accountability is met and safety is viable.
      *   **Action:** Run the conference. The agreement must address the victim's need for safety, but the outcome is reintegration, not exile.
      *   **Why:** Expulsion severs the web permanently. If the harm-doer acknowledges the relation, the web *can* hold them. Exiling them treats them as a project to be discarded, not a person to be restored.
      *   **Constraint Check:** **The Room doesn't want this.** The victim and their parents want expulsion. The procedure tells you "No."
      *   **Defense to Parents:** "Our goal is to educate all children. Since he has taken responsibility, removing him punishes the community by losing a member, rather than repairing the harm. We will ensure he does not come near your child, but he remains a student here."

  #### Case 3: The Fight (Parent Mob)
  *   **Facts:** Kid threw a punch. Parents of the other kid (and bystanders) demand removal. A conference would look like you're going soft.
  *   **RRP Application:**
      *   **Step 1 (Standing):** Victim willing? Maybe.
      *   **Step 2 (Accountability):** Kid admits punch.
      *   **Step 3 (Community Capacity):** The "Community" (Parent Mob) is hostile. They view the kid as a threat, not a member.
      *   **Result:** **STOP.**
      *   **Action:** Administrative Suspension/Expulsion hearing. **Do not run a conference yet.**
      *   **Why:** The community is currently incapable of holding the person. If you run a conference now, the parents will view it as a betrayal, and the web will fracture further. The community needs cooling down before the web can be woven.
      *   **Constraint Check:** **You don't want to do this.** You want to show you're doing RJ. The procedure says RJ is impossible right now.
      *   **Defense to Superintendent:** "Restorative processes fail when the community is in a punitive mindset. Running a conference now would undermine trust in the process. We need a cooling-off period (suspension) to reset community capacity."

  ---

  ### Part 5: Where This Procedure Will Misfire (The Limitations)

  You asked for straight talk on where this breaks. Do not put these in the handbook, but keep them in your head.

  1.  **The "Powerful Predator" Problem.**
      *   *Misfire:* A charismatic student leader harasses a marginalized student. The "Community" loves the leader.
      *   *Failure:* Step 3 (Community Capacity) will say "Yes, they can hold him," because the community protects him. The procedure will recommend reintegration, which leaves the victim isolated.
      *   *Fix:* You need an external audit of "Community Capacity" that isn't just asking the loud parents. You need to survey the silent kids.
  2.  **The "Resource Starvation" Problem.**
      *   *Misfire:* The procedure says "Community needs repair" (Case 3), but you have 45 minutes and no budget for community circles.
      *   *Failure:* You end up doing punitive suspension anyway, but you call it "Community Cooling." It's dishonest.
      *   *Fix:* Admit it. Call it "Administrative Separation." Don't dress up lack of resources as philosophy.
  3.  **The "Legal Override."**
      *   *Misfire:* The district lawyer says "Expel him, or we get sued by the victim's family."
      *   *Failure:* The RRP says "Reintegrate." The Lawyer says "Expel." The Lawyer wins.
      *   *Fix:* This procedure is your shield, not your sword. Use it to document *why* you recommended reintegration, so when the lawyer overrides you, the philosophical record shows the district chose liability over *Ubuntu*.

  ### Final Note on "Cowardice"

  You said falling back on "what the principal won't get yelled at for" is cowardice.
  Using this protocol is not bravery; it's **fiduciary duty**.

  When you deny a conference because the victim said "No" (Case 1), you are not being soft. You are upholding the victim's standing as a person who cannot be used for the offender's lesson.
  When you deny expulsion because the kid owned it (Case 2), you are not being lenient. You are upholding the school's duty to educate, not exile.

  Print Step 1 through Step 4. Tape it to your clipboard. When the principal asks why you aren't "doing the restorative thing," point to Step 1 or Step 3. Tell them: *"The conditions for personhood weren't met. We can't force a web to hold when the threads are cut."*

  That's a sentence a lawyer can't argue with, and a philosopher can respect.
