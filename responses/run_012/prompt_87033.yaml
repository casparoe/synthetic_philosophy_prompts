answer: |-
  1. **Indifference versus Permissibility**
  **Question:** You argue that a rescuer who saves the single person rather than the five has not acted wrongly. But I want to press on the status of the outcomes themselves: is the world in which the five survive *better* than the world in which the one survives, or are the two outcomes merely *different*, with no moral weight tipping the scale?
  **Follow-up:** If you say they are merely different, then when the rest of us insist we "ought" to save the five, are we speaking nonsense, or are we simply expressing a preference that has no grounding in the claims of the victims?
  **Concession:** A genuine concession would sound like him admitting that the world with five survivors is objectively better, even if he maintains that the rescuer is not *required* to bring it about.

  2. **The Lottery**
  **Question:** You ground your view in the idea that each person's claim to be rescued is equal in strength. If the outcomes are not better, and the claims are truly equal, does fairness *require* a rescuer to flip a coin, or is a lottery merely one permissible way to show respect for that equality?
  **Follow-up:** If you say it is merely permissible and not required, then how is the equality of claims actually respected if I simply choose the one person without giving the five an equal chance?
  **Concession:** A genuine concession would sound like him admitting that a fair-chance procedure is obligatory, not optional, when claims are equal and outcomes are not better.

  3. **Preference versus Reason (The Child Case)**
  **Question:** You grant that a rescuer may save the many, but you insist this permission is based on the rescuer's preference, not a reason supplied by the claims. If that is true, consider a case where the single person is the rescuer's own child: is saving the child a matter of "preference" in the same sense as choosing tea over coffee, or does the special relationship supply a moral reason that the claims of the strangers do not?
  **Follow-up:** If you say it is merely a preference, then are you committed to the view that saving a stranger's child over your own is equally permissible, provided you give them equal chance?
  **Concession:** A genuine concession would sound like him admitting that special obligations function as moral reasons that outweigh or bypass the equality of claims, rather than as mere personal preferences.

  4. **Aggregation Inside a Life**
  **Question:** You reject aggregating claims across persons, but you presumably allow that one person's claim can be stronger than another's because more is at stake for them—for example, death versus permanent paralysis. If I can sum the stakes of death and pain within a single life to strengthen a claim, why is it metaphysically different to sum the stakes across five lives to strengthen their collective claim?
  **Follow-up:** If you say the boundary of the skin is what matters, then are you claiming that the physical separation of bodies is itself a moral barrier that prevents harms from adding up?
  **Concession:** A genuine concession would sound like him admitting that there is no deep moral difference between summing stakes within a life and summing claims across lives, other than a commitment to individual separateness.

  5. **Rescue versus Allocation**
  **Question:** Does this reasoning about separate claims govern a hospital administrator dividing a fixed budget, or is your view strictly limited to emergency rescue? If the same logic applies, does the administrator owe an equal chance to every patient regardless of how many could be saved with the funds?
  **Follow-up:** If you say allocation is different, what is the moral distinction between a rescuer finding a resource and a doctor holding a resource that changes how the claims must be weighed?
  **Concession:** A genuine concession would sound like him admitting that his view must apply to institutional allocation, forcing him to accept the implications for public policy.

  6. **Scaling**
  **Question:** If your view applies to allocation and numbers do not count, must we flip a coin between funding treatment for one person or funding treatment for a thousand? Is there any magnitude at which the numbers begin to count, or does your view hold even at that scale?
  **Follow-up:** If you say there is no threshold, then doesn't a view without a limit make a mockery of triage, requiring us to ignore the catastrophic loss of life in favor of equal chances?
  **Concession:** A genuine concession would sound like him admitting there is a threshold where numbers begin to count, which would undermine the core claim that numbers never have weight in themselves.

  7. **Aggregation and Severity (The Paralysis Case)**
  **Question:** Let's test that threshold with a specific case: the alternative to one person's death is five people's permanent paralysis. If numbers don't count, do the five claims aggregate to outweigh the one based on the severity of the harm, or must we still treat the single death as an equal claim?
  **Follow-up:** If you say the claims remain equal despite the difference in severity, then are you prepared to say it is not wrong to let five people live in permanent pain to save one person from dying?
  **Concession:** A genuine concession would sound like him admitting that severity of harm can aggregate across persons to outweigh a claim to life, even if numbers alone cannot.

  8. **Instrumental Value (The Lifeboat Case)**
  **Question:** Consider a lifeboat that can carry either one adult or two children, where the adult is the only person aboard who can operate the radio. Here the one person has instrumental value for saving the others. Does this instrumental value create a reason to save the one that the claims of the children do not supply, or is this still just a matter of preference?
  **Follow-up:** If you say it creates a reason, then haven't you admitted that consequences *do* generate moral reasons, which contradicts your claim that the outcome of saving more people provides no reason?
  **Concession:** A genuine concession would sound like him admitting that instrumental value creates a moral reason to save the one, which relies on the value of the outcome (saving the children later).

  9. **Teaching and Blame**
  **Question:** Given all these distinctions, what does your view imply for what we may teach children, or blame adults for, in matters of rescue? If a rescuer saves the one over the five, do we tell our students that the rescuer acted wrongly, or merely that they made a choice we wouldn't have made?
  **Follow-up:** If you say we cannot blame them, then what moral guidance are we actually giving our students, other than that their choice in life-and-death matters is morally indifferent?
  **Concession:** A genuine concession would sound like him admitting that we are permitted to blame or criticize the rescuer, which suggests the action was indeed wrong.

  10. **Closing**
  **Question:** You have defended a position that demands immense consistency in the face of counter-intuitive results. What is the ultimate cost of this consistency, and is it a price we should pay to avoid treating individuals as mere means to a greater good?
  **Follow-up:** If you say the cost is worth it, then are you prepared to stand by the conclusion that we cannot condemn a choice that lets thousands die to save one, provided the claims were treated equally?
  **Concession:** A genuine concession would sound like him admitting that the cost of consistency is too high and that some aggregation of claims is necessary to avoid moral absurdity.
