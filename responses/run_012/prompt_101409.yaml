answer: |-
  You are not being inconsistent. You are navigating three different modes of truth that often collide: **Empirical Truth** (what happened), **Mythic Truth** (what gives us meaning), and **Political Truth** (who has the power to define what happened).

  Your discomfort comes from trying to apply a single rule to all three. You don't need one principle; you need a framework that tells you which mode is in play.

  Here are the two principles that underpin your verdicts, followed by the hard answers you asked for.

  ### Principle 1: The Functional Test (History vs. Mythos)
  *Ask: Is this statement functioning as a record of events, or as a ritual of identity?*

  *   **History** claims to describe reality. Its virtue is accuracy. If it fails accuracy, it must be corrected. (The Textbook, The Refugee Plaque).
  *   **Mythos** claims to sustain a community. Its virtue is continuity. If you correct it, you damage the social fabric. (The Church Procession, Nan's Story).

  **The Conflict:** The Refugee Plaque and the Village Inventor claim both look like History, but they function differently.
  *   **The Plaque** claims *moral agency* ("We took refugees in"). This is a claim about civic virtue. If it is false, it is a lie about the town's character. It fails the Functional Test for Mythos because it is presented as administrative history. **Verdict: Change it.**
  *   **The Village Inventor** claims *prestige* ("We are clever"). This is closer to Mythos. However, because it relies on patent records (empirical data), it is dressed as History.
  *   **The Hard Truth:** To be consistent with the Plaque, you cannot let the Village claim stand as *fact*. If "We welcomed refugees" must be true, "We invented this machine" must also be true. **However**, you can save the Village's identity by shifting the claim from History to Mythos. The plaque shouldn't say "Invented Here"; it should say "Home of the [Machine] Tradition." You preserve the pride without lying about the patent.

  ### Principle 2: The Power Test (Neutral vs. Compromised Archive)
  *Ask: Is the "written record" a neutral observation, or an instrument of power?*

  *   **Neutral Archive:** Bureaucratic records where there is no incentive to lie (e.g., patent offices, standard census data). These generally trump oral memory on factual specifics.
  *   **Compromised Archive:** Records created by a dominant power over a subordinate group (e.g., colonial surveys, police reports on riots, court records from rigged trials). Here, the "record" is not truth; it is an act of administration or oppression.

  **The Application:**
  *   **The Land Claim:** The colonial survey is a Compromised Archive. It was drawn by the same power that moved the people. The oral history is not just "memory"; it is counter-evidence. **Verdict: Weight the oral history.**
  *   **The Refugee Plaque:** The council minutes are a Neutral Archive (mostly). They recorded a decision. There is no systemic oppression involved in the record-keeping itself, just a shameful decision. **Verdict: Trust the minutes.**

  ---

  ### Applying the Principles to Your New Cases

  **1. The Massacre Memorial (Record says smaller than memory)**
  *   **Analysis:** Massacre records are almost always **Compromised Archives**. Perpetrators (state/military) minimize numbers; victims maximize or preserve the scale of trauma.
  *   **Verdict:** Side with the community memory. Under Principle 2, the official record is suspect. Under Principle 1, a memorial is often Mythos (honoring the dead) rather than strict History.
  *   **Action:** The memorial should reflect the community's truth, perhaps with a footnote acknowledging the dispute, but not "corrected" down to the state's count.

  **2. The Rigged Trial (Family wants conviction struck)**
  *   **Analysis:** This is a **Compromised Archive**. A rigged trial produces a legal "truth" that is a factual lie.
  *   **Verdict:** The family is right. This isn't about "forgetting history"; it's about correcting a historical injustice that the record codified.
  *   **Action:** The local history should not just record the conviction; it must record the *illegitimacy* of the conviction. Striking it is acceptable if "striking" means "marking as void."

  **3. The Museum Label (Community version of provenance)**
  *   **Analysis:** This depends on the object. If it's a geological sample, the Archive wins. If it's a cultural artifact, Principle 2 applies. Colonial museums often have "acquisition records" that mask theft.
  *   **Verdict:** If the community's account challenges the *morality* or *origin* of the acquisition, their account carries evidential weight equal to the paperwork.
  *   **Action:** The label should read: "Acquired 1902 (Records); Community oral history states taken during [Event]." Present the conflict. Do not let the paperwork silence the people.

  ---

  ### The Hard Question: Which Verdict Must You Give Up?

  You suspect you are inconsistent on the **Village Inventor**. You are.

  If you insist the Refugee Plaque must be changed because "public factual claims must be accurate," then the Village Inventor claim must also be corrected. You cannot say "Truth matters for civic virtue" but "Truth doesn't matter for civic pride."

  **The Fix:** You don't have to gut the village. You have to **re-categorize** the claim.
  *   **Refugee Plaque:** Claims *action*. ("We did X"). This is falsifiable history. It must be true.
  *   **Village Claim:** Claims *identity*. ("We are the people of X"). This can survive the loss of factual priority.
  *   **Resolution:** Correct the history (admit the patent belongs to the other man), but preserve the myth (celebrate the local man who *popularized* it, or the village that *built* it). If the village insists the local man *invented* it as a matter of fact, you must be consistent with the Plaque verdict and tell them they are wrong.

  ### On "The Record" vs. "The Archive"

  You asked if this distinction does any work. **Yes, it is crucial.**

  *   **The Archive** is the pile of documents. It is raw, often biased, and silent on what was never written down. (e.g., The Council Minutes, The Colonial Survey).
  *   **The Record** (or Historical Consensus) is the interpreted truth derived from weighing the archive against other evidence.

  **Where you are hiding the problem:**
  When you say "The record says the castle fell in a fortnight," you mean the *Historical Consensus* (based on archaeology + archive).
  When you say "The record says the patent belongs to the other man," you mean the *Archive* (the patent document).

  **Why this matters:**
  In the Land Claim case, you are correctly identifying that the *Archive* (colonial survey) is not the *Truth*.
  In the Textbook case, you are correctly identifying that the *Consensus* (archaeology) trumps the *Story*.

  **Refined Advice:** Stop saying "The Record."
  *   Say **"The Archive"** when you mean the documents (which can be biased).
  *   Say **"The Evidence"** when you mean the totality of documents + archaeology + oral history.

  ### Summary of Your Coherent Philosophy

  1.  **Public claims of factual action** (Plaques, Textbooks) must align with the best **Evidence**. (Change the Plaque, Fix the Textbook, Correct the Village *Fact*).
  2.  **Private or Ritual claims of meaning** (Nan, Church) are protected as **Mythos**. (Leave Nan, Protect the Procession).
  3.  **When the Archive is an instrument of power** (Land Claims, Rigged Trials, Massacres), Oral/Community Memory is valid **Evidence** and can override the documents. (Support the Land Claim, Acknowledge the Massacre scale, Void the Conviction).

  You are not inconsistent. You are a contextualist. You just need to admit that the Village Inventor story is a "Public Claim of Fact" and therefore subject to Principle 1, even if it hurts. You can soften the blow, but you cannot call it true if you demand the Plaque be changed.
