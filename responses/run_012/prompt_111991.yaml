  **Headline:** **Minimise Your Causal Footprint: The Art of Strategic Inaction**
  **By Julian Thorne**

  We are obsessed with impact. We track our carbon, our steps, our screen time. But rarely do we track our causality. You believe that by doing nothing, you remain innocent. This is a dangerous illusion. In the modern landscape, silence is a shout, and inaction is a verb. Welcome to the Null-Point Protocol™, the only programme designed to help you shrink your causal footprint by doing significantly less.

  The premise is simple. Conventional wisdom suggests that causes are events: you push the domino, the domino falls. But consider the garden. If you fail to water the hydrangeas, they die. Did you kill them? Counterfactually, yes. Had you acted, they would live. Therefore, your idleness on the sofa was the cause of the withered stem. This is causation by omission. Most people fear this. They rush to water the hydrangeas to clear their conscience. I say: lean into it.

  By doing less, you reduce your positive causal load—the messy business of moving matter around. Yes, you accumulate omission-causes, but these are cleaner. They have no location. You cannot point to the moment you killed the hydrangeas. Was it Tuesday? 4 PM? Or the entire weekend? This vagueness is a feature, not a bug. An omission is not an event; it is a shadow cast by what you might have done. It has no duration, which means it cannot be timed, and therefore cannot be billed by the hour.

  Critics ask: if every failure to prevent disaster is a cause, are we not responsible for everything? I am not preventing a tsunami in Jakarta right now. Am I causing it? Technically, yes. This is the Embarrassment of Plenty. There are infinite things you are not doing. To manage this, the Null-Point Protocol teaches Selective Salience. You cannot be causally liable for everything you omit, only what falls within your sphere of duty. This is where the law catches up with metaphysics. The courts know that causation alone is insufficient; you must have had a duty to act. If you had no duty, your omission is causally potent but morally weightless. We help you identify which duties you can safely drop.

  Consider the nested case. You fail to remind your partner to lock the door. They fail to lock it. The house is burgled. Did you cause the burglary? You caused their failure to act, which caused the loss. This chain of negative allowance is where most clients unravel. They try to trace the lineage of every unprevented harm. Our advice: stop tracing. Accept the liability, purchase the offset, and move on.

  This brings us to the Omission Credit Scheme. Since you cannot stop omitting things—you cannot do everything—you must compensate for the harms you allow. You buy credits to balance the books on the things you chose not to prevent. It is the only way to distinguish between doing something and allowing it, when the moral weight feels identical.

  Take Sarah, a client from Leeds. "Before the Protocol," she says, "I was exhausted trying to prevent every possible bad outcome. Now I simply allow them and purchase the offset. I recently bought credits for not intervening in a neighbour's dispute. I felt lighter." Sarah's testimonial is instructive, though she misses a key detail. She was not legally neighbourly enough to hold a duty of care, meaning her omission was causally real but liability-free. She paid for a sin that didn't exist. This is the beauty of the scheme: you can purchase innocence for crimes you didn't commit, provided the causation holds.

  Your exercise this week is the Void Walk. Go for one hour without preventing anything. Do not hold the door. Do not correct the stranger's directions. Do not stop the child from dropping the ice cream. Observe the causal weight settling on your shoulders. Notice how the world continues without your interference, yet somehow because of it.

  You cannot escape causation. But you can curate it. Do less. Cause more. Pay up.

