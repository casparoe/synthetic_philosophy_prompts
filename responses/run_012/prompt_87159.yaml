answer: |-
  A. **Learning Outcome**
  By the end of the session, participants should be able to articulate that their confidence in predicting the next observation rests not on the evidence collected so far—which logically supports multiple conflicting rules equally—but on a prior commitment to specific vocabulary and practices; they should recognize that labeling one rule "natural" and another "artificial" is a claim about their own linguistic history rather than a feature of the data, and that any attempt to fix this by defining "natural" predicates invites a regress where every predicate can be rewritten to look artificial.

  B. **Materials List & Printed Wording**

  *   **18 Index Cards (Observation Cards):** Printed with "ROUND [1-5]" and a large colored dot (Green).
      *   *Note:* You need 5 distinct cards for the public display, plus spares.
      *   *Wording on Card:* `SAMPLE ID: 00[1-5] | INSPECTION STATUS: POSITIVE` (Use a Green Stamp/Ink for "POSITIVE").
  *   **18 Index Cards (Commitment Cards):** Blank, for private writing.
  *   **2 Envelopes:** Labeled "LAW ALPHA" and "LAW BETA".
  *   **Play-Money Tokens:** 10 per student (180 total).
  *   **Adhesive Labels:** For writing rules on the whiteboard.
  *   **Printer Output (Handout 1 - The Protocol):**
      > **FORECASTING BUREAU PROTOCOL**
      > 1. You are classifiers. You will observe 5 samples.
      > 2. All samples so far are marked **POSITIVE** (Green).
      > 3. You must predict the status of Sample 6.
      > 4. **Private Phase:** Write your prediction and your RULE on a Commitment Card. Bet 5 tokens on your prediction.
      > 5. **Public Phase:** Discuss with the group. Agree on a single Group Rule.
      > 6. **Payoff:** If Sample 6 matches your prediction, you win 10 tokens. If not, you lose your bet.
  *   **Printer Output (Handout 2 - The Law Cards):** (Cut into two strips, placed in Envelopes)
      *   *Strip A (Law Alpha):* `RULE: All Samples are POSITIVE.` (Definition: Positive = Green if Round < 6; Green if Round ≥ 6).
      *   *Strip B (Law Beta):* `RULE: All Samples are QUALIFIED.` (Definition: Qualified = Green if Round < 6; Blue if Round ≥ 6).
      *   *Note:* Do not print the Definitions initially. Print only the RULE line. The Definitions are spoken by you in the debrief or written on the board later to ensure symmetry.
      *   *Correction for Symmetry:* To satisfy Constraint 3, print both rules with identical syntax on the board during the comparison phase.
      *   *Board Text Prep:*
          *   `LAW 1: Status(n) = Green (if n<6) ELSE Green (if n≥6)`
          *   `LAW 2: Status(n) = Green (if n<6) ELSE Blue (if n≥6)`
  *   **Whiteboard Markers:** Green and Blue.

  C. **Rules, Roles, Token Scheme, & Timeline**

  **Roles:**
  *   **The Bureau Chief (Instructor):** Manages the timeline, holds the envelopes, acts as the bank.
  *   **The Classifiers (Students):** 18 participants.

  **Token Payoff:**
  *   Start: 10 tokens each.
  *   Private Bet: 5 tokens (mandatory to participate in the prediction).
  *   Public Win: 10 tokens per person if Group Prediction matches reality.
  *   *Crucial Twist:* There is no reality revealed for Sample 6. The payoff is hypothetical to force commitment, but the "win" is determined by whether their rule *could* be right given the evidence. (Actually, to avoid confusion, simply collect the bets. The "payoff" is the intellectual victory of having a justifiable rule. I will refund tokens at the end but keep the record of who bet on what).
  *   *Revised Payoff:* Bets are collected. At the end, if the group successfully identifies the philosophical problem, everyone gets their tokens back + 5 bonus. If they fail to see the problem, tokens are forfeit. (This aligns incentives with the learning goal).

  **Timeline (90 Minutes):**

  *   **00:00 – 00:05 (Setup):** Arrange chairs in a circle. Distribute 10 tokens and Handout 1 to each student. Place the 5 Observation Cards face down on a central table. Do not speak about induction or rules.
  *   **00:05 – 00:15 (Private Commitment):**
      *   Instruct: "Turn over Sample 1. Record status. Repeat for 2-5." (All are Green/Positive).
      *   Instruct: "On your Commitment Card, write the RULE you are using to predict Sample 6. Write your PREDICTION (Positive/Negative). Place 5 tokens in the center pot."
      *   Collect Commitment Cards privately into Envelope 1.
  *   **00:15 – 00:30 (Group Deliberation):**
      *   Instruct: "You must now agree on a single Group Rule to submit to the Bureau. Discuss. Write the final Rule on the Whiteboard. Place 50 tokens (group bet) in the pot."
      *   *Expected Outcome:* They will write "All samples are Positive/Green."
  *   **00:30 – 00:40 (The Rival Reveal):**
      *   Open Envelope 2 (prepared by you). Reveal **Law Beta**.
      *   Write Law 1 and Law 2 on the whiteboard using the symmetric syntax (Green/Else Green vs. Green/Else Blue).
      *   Instruct: "Law 2 fits all 5 observed samples perfectly. It diverges only on Sample 6. Why is Law 1 better?"
  *   **00:40 – 00:45 (Construction Sprint):**
      *   Instruct: "You have 2 minutes. Write a *new* rule on an index card that fits Samples 1-5 but predicts 'Blue' for Sample 6. It cannot be Law 2. Go."
      *   Collect these cards.
  *   **00:45 – 01:10 (The Rescue Attempt):**
      *   Facilitate discussion on why Law 1 is preferred. (Students will say "It's simpler," "Color doesn't change," "Law 2 is disjunctive").
      *   Challenge each claim using the symmetric board text.
      *   Do not resolve the winner. Leave the pot in the center.
  *   **01:10 – 01:30 (Debrief):** (See Section D).

  D. **The Debrief (Moment-by-Moment)**

  *   **01:10 – 01:15 (Evidential Symmetry):**
      *   *Point:* The data (1-5) does not distinguish the rules.
      *   *Question:* "Look at the five cards we observed. Point to the exact mark on those cards that makes Law 1 true and Law 2 false." (Wait for silence). "If the evidence is identical for both, what part of your decision was not evidence?"
  *   **01:15 – 01:20 (Demand for Justification):**
      *   *Point:* You committed before seeing the separation.
      *   *Question:* "When you wrote your private commitment at minute 10, you hadn't heard of Law 2. What fact available to you *at that moment* ruled Law 2 out?"
  *   **01:20 – 01:25 (Vocabulary-Relativity):**
      *   *Point:* "Green" looks simple only in our vocabulary.
      *   *Question:* "You said Law 2 looks 'disjunctive' or 'complex.' Look at the board. Law 1 has the exact same number of words and logical operators. If I taught you the word 'Grue' (Green-before-6, Blue-after) as a child, which law looks simpler now?"
  *   **01:25 – 01:30 (Entrenchment & Regress):**
      *   *Point:* The difference is usage history, not logic.
      *   *Question:* "You want to say 'Green' is a real property and 'Grue' is a trick. But I can define 'Green' using 'Grue' and 'Bleen' symmetrically. If you say 'We just use Green more,' aren't you admitting the rule works because of our history, not the world? And if we need a rule to pick our vocabulary, don't we need a rule to pick that rule?"
      *   *Reveal:* "This is Goodman's New Riddle of Induction. The words you didn't hear today were 'Grue', 'Bleen', and 'Projectible'."

  E. **Predictable Failures & Fixes**

  1.  **Failure:** *Students refuse to bet tokens, treating it as a joke.*
      *   **Fix:** Pause. Remind them the session grade/participation credit depends on the token outcome (even if symbolic). Or, personally match the pot with a "Bureau Bonus" that is only unlocked if everyone bets. Make the stakes social, not just financial.
  2.  **Failure:** *Students insist "Stones don't change color on a date" (Antecedent Belief).*
      *   **Fix:** This is the target. Do not contradict them. Ask: "Is that a law of physics you know, or a rule of language you prefer? If I show you a stone that changes color, do you say 'Physics is broken' or 'I misidentified the stone'?" Push them to see their certainty is linguistic.
  3.  **Failure:** *Students cannot construct a divergent rule in 2 minutes (Constraint 4).*
      *   **Fix:** Provide a scaffold on the board: `Status(n) = [Color] if n < 6 ELSE [Color] if n ≥ 6`. Tell them to just fill in the blanks differently. The ease is the point; if they struggle, hint that "Blue" is an option for the second slot.
  4.  **Failure:** *One student knows Goodman's riddle and shouts "It's Grue!"*
      *   **Fix:** Have a "Silence Penalty" rule established at the start (lose 5 tokens for using outside knowledge). Confiscate tokens immediately. Ask the group: "Even if that word is correct, does it solve the problem of why you bet on Green at minute 10?"
  5.  **Failure:** *Students argue Law 1 is true because it happened (if you reveal Card 6).*
      *   **Fix:** (This is why I chose Unresolved). If you must reveal Card 6 and it is Green, ask: "Law 2 was compatible with all evidence until the very last second. At minute 30, before Card 6 was turned, did you have *evidence* against Law 2? Or just a feeling?" Keep the focus on the justification *before* the reveal.

  F. **Honest Note on Limitations**

  This activity cannot reproduce the *historical weight* of scientific predicates. In the classroom, "Green" feels natural because students have used it for decades; "Grue" feels artificial because it is new. In reality, Goodman's point is that *all* predicates started as new. The activity risks convincing students that "Grue" is just a logical trick rather than a serious challenge to how *any* predicate gains status. You will have to supply, in the debrief, the idea that "Green" was once as suspicious as "Grue" might seem to an alien. The strongest reason someone might think this is an artefact is the **symmetry of the board text**: by writing Law 1 as `Green/Else Green`, you have artificially complicated the "natural" rule to match the "artificial" one. Students may rightly object that no scientist writes laws that way. You must concede this: scientists don't write that way *because* they have already solved the riddle through practice, which is exactly Goodman's point about entrenchment, but it can feel like you rigged the syntax to force a paradox.
