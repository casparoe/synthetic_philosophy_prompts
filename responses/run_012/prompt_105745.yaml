      *   **Dennett (Quining Qualia):** Argues against the philosophical notion of qualia as ineffable, intrinsic, private, directly apprehensible properties. Uses thought experiments (Chase and Sanborn) to show that judgments about experience are theory-laden and subject to revision. There is no "fact of the matter" about the raw feel independent of functional role. Experience is a user-illusion generated by the brain's parallel processing. We can explain everything via heterophenomenology (taking subjects' reports seriously but not literally as infallible data).

