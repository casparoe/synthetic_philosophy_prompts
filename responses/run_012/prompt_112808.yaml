answer: |-
  Friends, neighbors, we stand here Thursday with a choice that feels like it's been made for us already. You hear it in the breakroom, you hear it from the front office. One side says the machines are the enemy, that if we smash the line we save the jobs. The other side says this is just progress, that technology is like the weather, you can't stop the rain, so you might as well take the umbrella they're handing us and the few coins they're offering for the trouble. I'm standing here to tell you that both of those stories are missing the point. The steel isn't the enemy. The weather isn't inevitable. What we are voting on is not whether technology exists, but who owns the time it saves.

  Look at our sister plant down the highway. They voted for this same deal a year ago. They were told the same things we're being told. Less strain, safer work, a smoother shift. I talked to guys there last week. They aren't working less. They're working harder. They say the line doesn't blink anymore. When it was men running the floor, there was rhythm, there was give and take, a human pace. Now the screen sets the speed. It decides when you stop, it decides when you go, it decides the order of things. It's not just replacing hands, it's replacing the judgment you built over twenty-five years. It takes the know-how out of your head and locks it into a program that doesn't care if your back hurts or if you need a minute to breathe.

  And here is the part they don't want us to talk about too loud. In that plant, the severance package had a condition. To get the buyout, you had to train the system. You had to spend your last six months showing the machine exactly how you do your job, teaching it every trick, every shortcut, every piece of wisdom you gained since you were young. Then you walk out, and that knowledge stays in the box, and you're gone. That same clause is sitting in the draft on the table right now. If we sign this, the old hands among us spend the final chapter of their careers building the thing that locks the door behind them. We aren't just losing jobs; we're losing the leverage of our own experience.

  So to those who say break the machines, I say you're right to be angry, but the machine is just metal. It doesn't sign the checks. It doesn't write the contract. Smashing the line gives them a reason to call the police, but it doesn't change the clause that says you have to train your replacement. And to those who say take the money and be grateful, I ask you to look at the tired faces down the highway. If this technology is so great, if it really makes work easier, why are they more exhausted than we are? Where did the saved time go? Did it come back to us in shorter shifts? Did it come back in higher pay? Or did it go into the quota, making the line run faster so they can squeeze more out of the same hour?

  This isn't about stopping the future. It's about deciding what the future looks like. A machine should do the heavy lifting so we can go home sooner. It should take the drudgery so we have more life left in us when the shift bell rings. That is possible. But only if we control the deployment. Only if the time saved belongs to us, not to the quarterly report. If we let them install this line under these rules, we agree that the speed belongs to them, the knowledge belongs to them, and the fatigue belongs to us.

  We have the power to say not this way. We can vote down this contract without voting against ourselves. We tell them we aren't Luddites, we aren't servants. We tell them if they want the automation, they pay for the time it saves. We demand shorter hours for the same pay. We demand no mandatory training of replacements as a condition of severance. We demand that the pace of the line is set by agreement, not by a sensor.

  Thursday, when you walk that ballot in, don't vote on whether you like robots. Vote on whether you like being told when to breathe. Vote on whether you think your twenty-five years of knowledge is yours to keep or theirs to take. Vote no on this contract. Not because we're afraid of the new line, but because we respect ourselves enough to know we deserve better than to be tired trainers for our own obsolescence. We fight for the work, but more than that, we fight for the time. Let's make sure the future belongs to us, not just the machine.
