  7.  **Final Polish:**
      *   Ensure the tone is authoritative ("Be committed").
      *   Check all constraints (no citations, specific sections).
      *   Make sure the "Weakest Point" is admitted honestly. (The weakest point is usually the restriction on the language of commitment required to make safety decidable).

  8.  **Final Review against constraints:**
