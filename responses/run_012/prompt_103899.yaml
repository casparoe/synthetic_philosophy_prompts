  *(Self-Correction on the "Asymmetric" case)*: I need to be careful. If Player A commits and Player B doesn't, Player A can still guarantee a security level. But is that an *improvement*? Only if the security level under commitment is higher than the Nash equilibrium of the original game. But if B can exploit A's commitment, it might be lower. I will argue that Asymmetric Commitment makes SPI *contingent* on the uncommitted player's rationality, violating the core "no probabilistic assumption" desideratum. Therefore, SPI requires symmetric commitment capacity.

