prompt: |-
  I'm a philosopher working on the metaphysics of social kinds, and I've drafted the short essay below. I'd like your comments on it.

  I want to distinguish three ways in which a kind can be social, and then argue that only the third is really interesting, and that it is rarer than its friends suppose.

  First, paper kinds. The kind exists because a rule creates it, and membership is settled by whether the rule's conditions are met: registered voter, widow, felon, heir. Given the rule there is a fact of the matter, and that fact is not about anything in the member's body or mind. The rule could have been otherwise, but it isn't, so the classification is determinate.

  Second, acceptance kinds. The kind exists because we collectively treat things as members, and the treating is not a report on the property but part of what constitutes it. Money is the standard case: a slip of paper is money because we accept it in payment, and if the acceptance evaporated the paper would be paper. Promises and goals in football have the same shape.

  Third, sedimented kinds — my coinage, and the one I care about. A sedimented kind begins as a paper kind or an acceptance kind, but the practice that sustains it leaves a residue in the world that ends up doing the classifying on its own. My homely example is handedness. Left-handedness was for a long time a paper kind with an enforcement apparatus: custom, and in many places the schoolroom, sorted children into right-handed and left-handed and then pushed the second group into writing with the other hand. That apparatus did not merely label a pre-existing biological division; on the usual story it changed the distribution of the trait, so that the prevalence of left-handedness rose as the enforcement decayed. The category has sedimented: the construction has hardened into a biological regularity that would survive the repeal of the practice.

  My substantive claim is that race is a sedimented kind. It began as an acceptance kind — a caste system enforced through rules about marriage, property, testimony, movement and ownership — and that system has deposited itself into bodies and circumstances: health, stress physiology, wealth, neighbourhood, life expectancy. Those differences are heritable and self-reproducing; they no longer need anyone's ongoing belief in the category in order to keep tracking it. If every belief in race were extinguished tomorrow, the inequality would persist for generations. So "race is socially constructed" is true as history and misleading as a description of the present, and it cannot be used to show that the category is arbitrary or that it will dissolve when the belief does. Gender I set aside here, not because I think it differs in kind but because the enforcement is more diffuse and the biology less settled, and I don't want to overclaim.

  This is also why I think the money analogy is a bad one. Money is an acceptance kind all the way down. Race is not.

  The case I can't place is criminal record. "Felon" is a paper kind in my first sense, but the collateral consequences — the employment barrier, the address, the network — seem to sediment in exactly the way I've described. If so, my third category is far larger than I've made it sound, and it may not be a category of social kinds at all so much as a stage that any socially enforced classification can reach.

  I'm aware that this overlaps with things other people have said, and I don't want a reading list or citations — I want to know whether the machinery works, not who else has built it. Take the role of a philosopher of the social world with a good ear for the difference between a distinction that earns its keep and one that is a relabeling. Think the examples through carefully before you commit, and go after the strongest objection to the sedimentation claim rather than the easiest one. Give me exactly five numbered comments, each one or two sentences, and nothing else: no introduction, no summary of what I wrote, no closing remarks. The five should cover at least whether the three-way distinction earns its keep, which of my examples is doing the least work, and what the most serious objection to the claim about race is. At least one of the five should tell me something I won't want to hear.
