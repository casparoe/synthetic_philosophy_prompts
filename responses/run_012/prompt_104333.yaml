answer: |-
  Here is a 40-minute lesson plan designed to be philosophically rigorous, time-tight, and defensible against a skeptical expert.

  ### I. The Sequence (Why Order Matters)

  You cannot discuss whether the brain *is* a computer until you agree on what "computation" means, and you cannot agree on that without separating the *process* from the *material*. If you shuffle this order, the "neuron = transistor" student will dominate the physical layer, and the "computers can't feel" student will dominate the experiential layer, and they will talk past each other.

  1.  **Define Computation as Syntax (5 mins):**
      *   **Goal:** Establish that computation is rule-based symbol manipulation, *not* electronics.
      *   **Why First:** If you don't strip "computation" of its association with silicon chips, the biology student wins immediately ("Brains aren't silicon").
      *   **Defensibility:** Use the mathematical definition: a function mapping inputs to outputs based on formal rules.

  2.  **Introduce the Carrying Example (10 mins):**
      *   **Goal:** Demonstrate "Multiple Realizability" (the same computation can run on different hardware).
      *   **Why Second:** You need a neutral ground before applying this to the contentious topic of the brain.
      *   **Defensibility:** This isolates the *logic* from the *substrate*.

  3.  **Introduce Levels of Description (10 mins):**
      *   **Goal:** Provide the vocabulary to distinguish the Weak Claim from the Strong Claim.
      *   **Why Third:** You cannot make the distinction without a framework to hold the two claims apart. This is where the "Levels" idea does the work.
      *   **Defensibility:** This satisfies the math teacher; it is a structural distinction, not a metaphysical one.

  4.  **Apply to the Brain: Weak vs. Strong Claim (10 mins):**
      *   **Goal:** Separate "The brain computes" (Weak) from "Thinking is nothing but computation" (Strong).
      *   **Why Fourth:** Now that the tools are built, you can apply them.
      *   **Defensibility:** You are not asserting one is true; you are asserting they are *different questions*.

  5.  **Closing & Scope (5 mins):**
      *   **Goal:** Diagnostic question and boundary setting.

  ---

  ### II. The Carrying Example

  **Primary Candidate: A Game of Tic-Tac-Toe.**

  *   **Why:** It is purely rule-based, finite, and universally understood. It requires no specialized knowledge (unlike Chess) and is less causal than a Recipe (which involves chemistry).
  *   **What must be visible at a glance:** The **Rules** (Syntax). Draw the grid. Show that if "X" is here, "O" *must* go there to block. This is the computation.
  *   **What it must deliberately lack:** The **Experience** (Semantics/Qualia). The game does not "know" it is winning. The chalk does not "feel" the loss.
  *   **How to use it:**
      1.  Play a game on the whiteboard with chalk.
      2.  Ask: "If I erase this and play it in my head, is it the same game?" (Yes).
      3.  Ask: "If I write a Python script to play it, is it the same game?" (Yes).
      4.  **Point:** The *game* (computation) is distinct from the *board/computer/head* (substrate).

  **Alternative (if contested): A Recipe for a Cake.**
  *   **Visible:** The Instructions (If mixture is dry, add milk).
  *   **Lacking:** The Taste.
  *   **Risk:** Recipes are causal processes (chemical reactions), which might blur the line between "computation" and "physics" too much for a math teacher. Stick to Tic-Tac-Toe if possible.

  ---

  ### III. Misconceptions & Intervention Points

  Here are the misconceptions your audience will form, in the order they will arise, and how to handle them.

  | Order | Misconception | When it forms | Action | Script/Intervention |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **"Computation requires electricity."** | During Definition (Min 5) | **Correct Immediately.** | "Computation is about *rules*, not power. A abacus computes. A paper map computes a route. If it follows rules to transform input to output, it's computation." |
  | **2** | **"If it acts the same, it is the same."** | During Example (Min 15) | **Correct Immediately.** | "The chalk game and the mental game have the same *logic*, but they are not the same *object*. Don't confuse the description with the thing described." |
  | **3** | **"The brain is just wetware hardware."** | During Application (Min 25) | **Let Surface.** | This is your Reductionist student. Let them state it. Then ask: "At which *Level of Description* are you speaking? Physics or Logic?" |
  | **4** | **"Computers can't have qualia/feelings."** | During Application (Min 30) | **Let Surface.** | This is your Skeptic student. Let them state it. Then ask: "Are you arguing about the *computation* or the *experience*? Which Level is that?" |
  | **5** | **"So you're saying we are robots."** | During Closing (Min 35) | **Correct Immediately.** | "No. I am saying we can *describe* part of the brain as a computer. Whether that description captures *all* of you is the question we just opened." |

  **Note on Misconceptions 3 & 4:** Do not resolve the conflict between the Reductionist and the Skeptic. Your goal is to show they are arguing about different *Levels*. The Reductionist is arguing Level 1 (Physics) vs Level 2 (Computation). The Skeptic is arguing Level 2 (Computation) vs Level 3 (Experience). Your job is to draw the map, not drive the car.

  ---

  ### IV. Making "Levels of Description" Work

  Do not just say the phrase. Draw three horizontal lines on the whiteboard. Label them:

  1.  **Physical Level:** (Chalk, Neurons, Silicon). *Properties: Weight, Color, Voltage.*
  2.  **Computational Level:** (Rules, Logic, Algorithms). *Properties: Validity, Speed, Accuracy.*
  3.  **Experiential Level:** (Fun, Pain, Understanding). *Properties: Feeling, Meaning.*

  **The Work It Does:**
  *   When the Reductionist says "Neurons are transistors," point to **Level 1**. Acknowledge it, but note it doesn't explain the *rules* of Level 2.
  *   When the Skeptic says "Computers can't feel," point to **Level 3**. Acknowledge it, but note it doesn't disprove the *logic* of Level 2.
  *   **The Computationalist Claim:** "Thinking happens at **Level 2**."
  *   **The Trap:** Claiming Level 2 *eliminates* Level 1 or Level 3.

  This structure prevents the "loose wording" the math teacher will pounce on. You are not saying the brain *is* a computer (ontological claim); you are saying the brain can be *described* at the Computational Level (methodological claim).

  ---

  ### V. The Closing Question

  Do not ask: "Do you think the brain is a computer?" (They will just vote based on prior bias).
  Do not ask: "What is consciousness?" (Too big).

  **Ask this:**
  > "If we built a perfect computational model of your brain that could pass every test you can pass, but it had no Physical Level (no body) and no Experiential Level (felt nothing), would we say it *thinks*, or merely that it *simulates thinking*?"

  **Why this reveals understanding:**
  *   If they say "It thinks," they accept the Strong Claim (Thinking = Computation).
  *   If they say "It simulates," they believe Thinking requires Level 1 or Level 3.
  *   If they say "It depends on what you mean by 'think'," they have grasped the Levels of Description.

  ---

  ### VI. What to Exclude (And How to Say It)

  You have 40 minutes. You cannot cover Consciousness, Free Will, or Artificial General Intelligence. If you try, you will fail.

  **The Exclusion Script:**
  > "We are going to touch on feelings and consciousness, but we are not going to solve them today. Those are questions for the *Experiential Level*. Today, we are strictly investigating the *Computational Level*. If we find ourselves arguing about whether machines can have souls, I am going to pull us back to whether they can follow rules. We need to know if the map works before we argue about the territory."

  **Why this works:**
  *   It respects the complexity of the excluded topics.
  *   It frames the exclusion as a methodological necessity (defensible to the math teacher).
  *   It gives you permission to cut off the "Computers can't feel" student without silencing them ("You're right, that's Level 3, but we are analyzing Level 2 right now").

  ### VII. Time Management Strategy

  *   **Minute 0-5:** Definition. (Hard stop).
  *   **Minute 5-15:** Tic-Tac-Toe Example. (Draw it. Play it. Move on).
  *   **Minute 15-25:** Levels of Description. (Draw the three lines. This is the core).
  *   **Minute 25-35:** Application to Brain. (Facilitate the two polarized students here).
  *   **Minute 35-40:** Closing Question & Exclusion.

  **If discussion runs long:**
  Use the whiteboard levels as a traffic light. If a student goes off-track, point to the level they are on and say, "That is a Level 3 question. We are currently working on Level 2. Let's park that." This is not evasion; it is rigorous categorization.
