      *   This feels more "cognitive."
      *   *Decision:* **Navigation (The Map vs. The Walk).**
      *   *Wait, the prompt says "one concrete case."*
      *   Let's go with **The Library.**
      *   No, let's go with **Chess.** It's the standard for a reason. It clearly separates rules from substrate. I will justify this choice in the output.
      *   *Actually, let's look for something more visceral.* **Pain.** No, too controversial.
      *   **Language.** Translating a sentence.
      *   *Okay, I will stick with Chess/Tic-Tac-Toe but frame it as "Playing a Game."* It's the cleanest way to show Syntax without Semantics.
      *   *Wait, I have a better idea.* **A Recipe.**
      *   Why? Because it involves *instructions* (computation) and *ingredients* (physics) and *eating* (experience).
      *   Visible: The steps (If dough is sticky, add flour).
      *   Lacks: The taste.
      *   This covers Weak (following steps), Strong (cooking IS following steps), and the Objection (taste).
      *   *Let's use the Recipe.* It's more accessible than Chess for "process."
      *   *Wait, Chess is better for "rules."* Recipes are causal. Computation is rule-based.
      *   *Okay, final decision:* **Tic-Tac-Toe.** It is purely rule-based. It allows whiteboard interaction. It is finite.

      *Wait, one more check:* The prompt says "I suspect the entire session lives or dies on where I separate the modest claim... from the far stronger claim."
      The Example must illuminate this.
      Tic-Tac-Toe:
      Modest: You can describe the game computationally.
      Strong: The game *is* nothing but the computation.
      Missing: The *experience* of playing.
      This works.

  11. **Drafting the Plan:**
      *   **Intro (5 min):** Define terms.
      *   **Example (10 min):** Tic-Tac-Toe on board.
      *   **Levels (10 min):** Apply levels to example, then brain.
      *   **The Split (10 min):** Weak vs. Strong claim.
      *   **Close (5 min):** Question & Scope.

  12. **Addressing the Math Teacher:**
      *   Ensure "function," "input/output," and "variable" are used correctly if used.
      *   Avoid metaphors that imply magic.
      *   Be precise about "necessary and sufficient conditions."

  13. **Addressing the "Habit of letting discussion run long":**
      *   Build in "Parking Lot" for off-track questions.
