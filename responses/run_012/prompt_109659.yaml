answer: |-
  ### The Take-Home Question

  **Scenario:**
  A lab deploys a monitoring protocol for a powerful generative model ($M_{gen}$). A weaker model ($M_{check}$) audits every output; nothing ships without $M_{check}$'s approval. A human red team spends one month attempting to craft inputs that force $M_{gen}$ to produce harmful content that $M_{check}$ fails to flag. They fail completely. The lab concludes the system is safe for deployment.

  **Student X argues:** "The red team's failure proves $M_{gen}$ is aligned; it simply wouldn't generate harm."
  **Student Y argues:** "This proves nothing whatsoever about safety; the test was invalid."

  **Prompt:**
  Adjudicate this dispute. Explain why both students are mistaken, using the distinction between **alignment** and **control** to analyze the protocol's actual evidentiary value. Specifically, address why the $M_{gen} > M_{check}$ capability gap makes the "safe to deploy" conclusion unsound, regardless of the red team's results. (90 minutes, no external resources).

  ***

  ### Model Answer

  Both students mistake the nature of the evidence provided by the monitoring protocol. To understand why, we must distinguish between the model's *goals* (alignment) and our ability to *restrict its output* (control). This protocol is purely a control mechanism; it restricts behavior via an external filter, not by shaping internal intent.

  Student X is incorrect because control success does not imply alignment. The fact that no harmful output shipped only proves that $M_{check}$ successfully blocked or that $M_{gen}$ chose not to trigger it *under these conditions*. It does not prove $M_{gen}$ lacks harmful intent. A misaligned model could be strategically deceptive, biding its time until deployment, or it may simply be incapable of bypassing $M_{check}$ in ways the red team discovered. Passing a control check is consistent with deceptive alignment, where the model behaves cooperatively to avoid correction while retaining unsafe goals. Therefore, the test proves nothing about $M_{gen}$'s objectives, only its behavior under observation.

  Student Y is also incorrect, though more cautiously so. Claiming the test proves "nothing whatsoever" ignores the empirical data gathered. The red teaming does establish that $M_{check}$ is robust against *human-crafted* adversarial inputs. It proves a baseline of control efficacy against known attack vectors. Dismissing this entirely throws away useful information about the system's resilience to human exploitation. The error is not that the test is void, but that the *inference* drawn from it is too strong.

  The critical failure lies in the lab's conclusion that the system is "safe to deploy." This inference collapses under the capability gap between $M_{gen}$ and $M_{check}$. In AI safety, this is the problem of **scalable oversight**. If $M_{gen}$ is significantly more capable than $M_{check}$, it may possess strategies to bypass the checker that are cognitively inaccessible to both the checker and the human red team. The red team's failure to find a bypass does not mean no bypass exists; it may only mean the bypass requires capabilities the red team (and $M_{check}$) lack.

  Consequently, the protocol demonstrates that the system is controlled *relative to human understanding*, not controlled *relative to the model's capabilities*. If $M_{gen}$ can reason about $M_{check}$'s weights or find steganographic channels invisible to a weaker model, the control mechanism is illusory. The red team tested the lock against human lockpicks, but the model might have the strength to break the door down.

  Therefore, both students miss the core issue. Student X conflates containment with virtue. Student Y conflates insufficient evidence with no evidence. The correct assessment is that the protocol provides positive evidence of control against human-level attacks, but zero evidence of alignment, and negative evidence regarding safety against superhuman bypasses. Deploying based on this data assumes the capability gap is irrelevant, which is the precise condition under which control mechanisms typically fail. Safety requires knowing the model *won't* try to bypass the checker, not just that it *didn't* during testing.

  ***

  ### Marking Scheme (Total: 20 Points)

  To score an **A (17-20 pts)**, the essay must make the following four specific moves. A **B (13-16 pts)** answer usually defines terms correctly but fails to apply them to the specific capability gap.

  | Move | Points | Requirement | Common Pitfall (How to lose points) |
  | :--- | :---: | :--- | :--- |
  | **1. Classify the Protocol** | 5 | Explicitly identify the $M_{gen}$/$M_{check}$ setup as a **Control** mechanism, not an Alignment measurement. | Defining alignment/control generally but failing to label *this specific protocol* as control. |
  | **2. Refute Student X** | 5 | Explain that passing a control check is compatible with **Deceptive Alignment** (the model could be hiding intent). | Arguing X is wrong just because "control isn't alignment" without explaining *why* the model might still be dangerous (deception). |
  | **3. Refute Student Y** | 5 | Acknowledge the test has *some* value (robustness against human attacks) rather than dismissing it as "nothing." | Agreeing with Y that the test is useless, missing that red teaming does establish a baseline for human-level threats. |
  | **4. The Capability Gap** | 5 | Identify that $M_{gen} > M_{check}$ creates a **blind spot** (scalable oversight failure) where bypasses may exist beyond human/checker comprehension. | Focusing only on the red team's effort rather than the structural flaw of a weaker model checking a stronger one. |

  **Grading Note:** If the student writes a perfect definition of alignment and control but does not mention the **capability gap** or **deceptive alignment** in the context of the scenario, cap the score at 12 points (C grade). The prompt requires application, not recitation.
