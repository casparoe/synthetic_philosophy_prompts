  *(Self-Correction during final review)*: Wait, does Briony intend to deceive the reader *permanently*? No, she reveals it. But she intends to deceive *temporarily* to make the tragedy hit harder? Or does she intend to deceive herself? Actually, she writes the happy ending *in the novel*, then admits in the *diary* (part of the book) that it didn't happen. So the reader *is* told the truth eventually. Does this mitigate the lie? Augustine might say the initial presentation was still a lie until corrected. But more importantly, she is trying to alter the *record of reality*.
  *Better angle:* The lie isn't just to the reader; it's to Reality/God. She claims "They lived happily" in the text, knowing "They died." This is bearing false witness, even in art, if presented as the "story of their lives."
