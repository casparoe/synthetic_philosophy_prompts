answer: |-
  It is a pleasure to engage with a mind that has moved from the empirical verification of the laboratory to the conceptual verification of the text. Your summary of Augustine's position on lying is precise: for the Bishop of Hippo, the moral ontology of speech rests not on the correspondence between word and world (objective truth), but on the correspondence between word and mind (subjective truthfulness), governed by the *voluntas fallendi*—the will to deceive.

  As you note, Augustine is uncompromising regarding the *mendacium officiosum*, the "officious lie" told for another's benefit. In *De Mendacio*, he argues that to lie is to sever the bond of trust that holds human society together, and ultimately to offend God, who is Truth. No temporal good, not even the saving of a life, justifies this spiritual disorder.

  Applying this rigorous framework to Ian McEwan's *Atonement* yields a verdict that is as damning as it is illuminating, particularly regarding the elderly Briony. However, as you suspect, the novel itself mounts a resistance to this verdict, proposing an aesthetic ethics that Augustine could not countenance.

  ### 1. The Young Briony: The Unambiguous Lie
  Let us dispose quickly of the thirteen-year-old Briony. You suggest Augustine would call her false accusation a lie notwithstanding her confusion. You are correct. While her youth mitigates her *culpability* (the gravity of the sin), it does not change the *nature* of the act.
  When Briony tells the police she saw Robbie assault Lola, she asserts as fact what she does not know to be fact. Even if she believes her own misinterpretation in the moment, there is an element of performance—a desire to control the narrative and secure the attention of the adults. She intends for the adults to believe a reality she has constructed. For Augustine, this is a rupture in the order of charity. She treats her neighbor (Robbie) not as an end to be loved, but as a prop in her own drama. This is the primal sin of the novel, and Augustine would find no difficulty in condemning it.

  ### 2. The Elderly Briony: Fiction or False Witness?
  The elderly Briony presents the deeper philosophical puzzle. She writes a novel, *Atonement*, which concludes with Robbie and Cecilia reuniting in London. In the final section ("London, 1999"), Briony reveals this reunion never occurred; both died in the war. She admits: "I like to think that it isn't weakness or evasion, but a final act of kindness, a stand against oblivion and despair."

  Is this an Augustinian lie?

  **The Argument for Exemption (The Fiction Convention)**
  Augustine does exempt poets and playwrights (*De Mendacio* 4.8). He acknowledges that in fables and plays, there is a tacit convention (*ex pacto*) that no deception is intended. The audience knows the stage is not the world. If *Atonement* is read simply as a novel, Briony is safe. The reader enters a "fiction contract."

  **The Argument for Condemnation (The Meta-Fictional Breach)**
  However, McEwan structures the book to violate this convention. For the vast majority of the text, the narrative voice mimics the authority of historical record. We are not asked to suspend disbelief in a fantasy; we are asked to believe in a realistic history. Briony intends for us to believe, *while we are reading Part Three*, that the reunion is happening. She intends to deceive the reader temporarily to achieve an emotional effect, only to pull the rug away in the epilogue.

  For Augustine, the temporariness of the deception does not absolve the intent. If the *voluntas fallendi* was present at the moment of writing/reading, the lie occurred. Furthermore, Briony's motivation is the precise definition of the *mendacium officiosum*. She tells the falsehood to spare the reader (and herself) the pain of the tragedy. She writes, "I gave them happiness." Augustine would argue that you cannot do evil (lie) that good (comfort) may come. To give happiness based on a falsehood is to build a house on sand; it is a kindness that corrupts the soul of the giver and misleads the receiver.

  ### 3. Who is Wronged? The Neighbor and The Reader
  You ask if this wrongs anybody, given Augustine's focus on the neighbor.

  **The Dead Neighbors**
  Robbie and Cecilia are dead. They cannot be deceived. However, Augustine would argue that Briony wrongs them by bearing false witness to their lives. She appropriates their reality to serve her own need for atonement. She makes their tragedy about *her* authorship. In Augustine's view, this is a form of pride (*superbia*). She attempts to play God, rewriting creation to suit her moral comfort. She denies the reality of their suffering, which is a denial of their dignity.

  **The Reader as Neighbor**
  Does it wrong the reader? Augustine's ethics are relational. A lie damages the *fides* (trust) between speakers. When Briony reveals the deception, the reader feels a specific betrayal. We realize we have been manipulated.
  However, there is a nuance here that Augustine's framework struggles to capture, which you alluded to. Augustine worries about the lie leading the neighbor into error about *salvation* or *fact*. The reader of a novel is not typically led into factual error about the world.
  Yet, McEwan suggests the wrong is deeper. By deceiving us, Briony implicates us in her fantasy. We *wanted* them to survive. We accepted the happy ending because it satisfied our desire for justice. When the truth is revealed, we are forced to confront our own complicity in preferring a comforting lie to a hard truth. In this sense, Briony wrongs the reader not by making us believe falsehoods about the war, but by exposing our own moral weakness—our preference for aesthetic closure over tragic reality.

  ### 4. Where the Novel Resists Augustine
  Here is where your reading must account for the resistance you sensed. McEwan does not entirely condemn Briony's final act, whereas Augustine would.

  **The Power of Art vs. The Law of Truth**
  Augustine subordinates art to Truth. If a painting or poem suggests a falsehood, it is inferior to Truth. McEwan, writing in a secular, modernist tradition, suggests that Art might possess a redemptive power that Reality lacks.
  Briony says: "What sense of hope or satisfaction could a reader draw from such an account?" She implies that the "truth" of the tragedy is unbearable and perhaps spiritually useless without the "lie" of the reunion.
  For Augustine, this is demonic. Truth is God; there is no satisfaction outside of Truth.
  For McEwan, this is human. The "lie" allows the memory of Robbie and Cecilia to survive in a form that is bearable. It is a monument.

  **The Confession as Mitigation**
  Crucially, Briony *confesses*. The book ends with the revelation of the lie. Augustine places immense weight on confession and penance. By revealing the deception, Briony breaks the lie. She restores the truth *eventually*.
  One could argue Augustinianly that the book *as a whole* is not a lie, because the final word is Truth. The preceding falsehood was a rhetorical device to lead the reader to a deeper understanding of loss.
  However, Briony's motivation undermines this. She does not confess to clear her conscience alone; she confesses to frame the lie as a "kindness." She wants credit for the deception. This remains, in Augustinian terms, a disordering of love (*ordo amoris*). She loves her own narrative control more than she loves the stark reality of God's creation.

  ### 5. Conclusion: The Verdict and the Exception
  To answer your specific questions:

  1.  **Is her invented ending a lie in Augustine's sense?**
      Yes. Despite the convention of fiction, the meta-fictional structure creates an expectation of narrative truth which she intentionally violates to spare pain. It is a classic *mendacium officiosum*.

  2.  **Does it follow that it wrongs nobody?**
      No. It wrongs the memory of the dead by falsifying their end, and it wrongs the reader by manipulating their trust to test a philosophical point about atonement.

  3.  **Does Augustine's account have no means of expressing the wrong to the reader?**
      Augustine expresses it as a violation of *caritas* (charity). He would say Briony loves the reader's comfort (and her own) more than she loves the Truth. However, you are right that Augustine lacks the vocabulary for *aesthetic* betrayal. He cannot easily account for the specific feeling that the "lie" was necessary for the *art* to succeed.

  **The Physicist's Perspective**
  Having trained in experimental physics, you know that data which contradicts the hypothesis must be respected, not smoothed over. Augustine is the ultimate experimentalist of the soul: the data of reality must not be falsified, even to save a life.
  *Atonement* is the counter-experiment. It suggests that in the human sciences, the "data" of suffering is sometimes so destructive that a "theoretical model" (the fiction) is required to make the universe comprehensible.

  Briony's final act is, by Augustinian lights, a sin. But McEwan invites us to ask if it is a *holy* sin. Augustine would say there is no such thing. The novel leaves the question open, resting on the tension between the Truth that saves the soul (Augustine) and the story that saves the memory (Briony). Your retirement reading has landed you precisely in the friction between Jerusalem and Athens.
