  So a while back I fell down a rabbit hole about this lottery a science magazine ran back in the 80s, and I keep coming back to it. The setup as best I remember: you send in a postcard, the number on the postcard is how many entries you want, and the prize is a million dollars divided by the total number of entries everyone sent in, with one entry picked at random to win. So if you're the only one who enters you walk off with the whole million, and if everyone enters a ton, the prize becomes a fraction of a cent. I think the same guy had written about a related puzzle where twenty people are told that if exactly one of them sends a telegram by noon that person gets a billion dollars, and his answer to that one was that everyone should send a telegram with probability 1 in 20. Which I find insane, honestly — I always assumed the clever answer to these things was just for everyone to sit on their hands and not enter.

  Anyway my friend and I have been going back and forth about it. My position: if you reran the million-divided-by-entries lottery today with, say, ten thousand people who all read the same blog post explaining the puzzle carefully — so they all get the setup, they all know the others get it, and they're all the sort of person who finds this stuff fun — the total number of entries would still be in the thousands, the prize would be pennies, and the whole thing would flop exactly like it did the first time. Her position: no, that misses the point of the puzzle, once everyone sees the logic people actually do the clever thing, and the rerun would end with basically no entries at all.

  What I want from you is a credence, and I want the parts layed out rather than a vibe. The proposition, so it's not mush: in a rerun run today for ten thousand people like I described, the total number of entries submitted comes in under 100, so the prize stays at ten thousand dollars or more. Call it a coin toss whether people care about the money at all, the fun of it probably matters more than the cash.

  Give me your number, but mostly give me the decomposition. The terms I'd roughly want, and add or cut any you think are wrong: (1) the odds that there's even a determinate right answer to what one person should do here, as opposed to it just being whatever falls out of the decision theory you happened to bring with you; (2) given there is one, the odds that the superrational / probability-matching answer is the right one, rather than some causal reasoning about how your own postcard barely moves anything; (3) the odds that a real crowd would accept that answer as right, as opposed to enjoying it as a cute paradox and then doing whatever; (4) given they accept it, the odds that enough of them actually act on it, keeping in mind the lure is that being the one person who enters gets you everything; (5) the joke term — how much of the original flop was people deliberately sending in googolplex-style numbers because it's funny, and whether that recurs. A number and a line of justification for each, then how they combine.

  Two more things. Tell me which term you're least sure about and what would actually move it — a real rerun, a lab experiment, a theorem, nothing? And tell me whether my friend and I are really disagreeing where I think we are, which is term 3 and 4 (I think she thinks understanding the logic is the hard part, and I think acting on it is), or whether one of us is secretly wrong about something upstream like what the superrational answer even is. Because I'll be honest, I'm not totally sure I've even got that right — if the real answer isn't nobody enters but some mixed thing where each person enters with some small chance, say so, and then redo the decomposition on the version you think is correct, because that would probably change term 1 for me alot.
