  **Note on Form and Axioms**

  *   **Disagreement Point:** Lines 1–2 establish the baseline utility (zero) if no agreement is reached.
  *   **Symmetry:** The voices are interchangeable; swapping "I" and "You" globally leaves the poem's structure and content invariant, satisfying the symmetry axiom.
  *   **Scale Invariance:** The goods divided are heterogeneous (accounts, lamps, hours, space, records, shelves, lease, words). No single unit of measurement dominates, ensuring the solution does not depend on how utility is denominated.
  *   **Individual Monotonicity:** The verbs progress strictly accumulatively (*begin, take, add, claim, fill, hold, reach*). Shares never decrease; the trajectory only moves toward the ideal.
  *   **Independence of Irrelevant Alternatives (IIA):** Lines 7–10 introduce the sofa. It is explicitly "unchosen," yet its presence alters the division ("the space its shadow makes available"). In Nash bargaining, removing an unchosen option would not change the solution; here, the feasible set's shape shifts the terms, marking this as a Kalai–Smorodinsky solution.
  *   **The Boundary:** The poem follows a ray of fixed proportion (1:1 gains) from disagreement toward the ideal. Lines 17–18 represent the intersection with the Pareto frontier. The phrase "where no more words will fit" renders the next pair not just absent, but structurally impossible, marking the exact limit of the jointly possible.
