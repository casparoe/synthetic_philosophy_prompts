answer: |-
  ### THE CONTEXTUAL WEIGHTING PROTOCOL (CWP)
  **For Use by the Animal Care and Use Committee**
  **Time Allocation:** 20 Minutes per Protocol
  **Objective:** To ensure consistency without enforcing false uniformity; to distinguish factual compliance from moral judgment.

  #### PHASE 1: FACTUAL BASELINE (5 Minutes)
  *Led by: Statistician & Bench Scientists*

  1.  **Scientific Validity:** Is the experimental design statistically sound and biologically valid?
      *   *Sufficient Answer:* Yes/No with citation of power analysis or methodological standard.
      *   *Stop Condition:* If **No**, protocol is **Refused**. Reason: Wasted animal life is an inherent harm that cannot be offset.
      *   *Note:* This is a factual question. Disagreement here is about method, not values.

  2.  **The 3R Compliance:** Have Replacement, Reduction, and Refinement been exhaustively pursued?
      *   *Sufficient Answer:* Documentation of literature search and alternative methods considered.
      *   *Stop Condition:* If **No**, protocol is **Returned**.
      *   *Note:* This is a procedural check.

  #### PHASE 2: PRECEDENT & POLARITY (10 Minutes)
  *Led by: Committee Chair (You)*

  3.  **The Precedent Scan:** Has this committee approved a protocol with this specific feature (e.g., single-housing, aversive stimulus) before?
      *   *Sufficient Answer:* Citation of previous decision record.
      *   *Rule:* Precedent is a **reminder**, not a **binding rule**. It establishes what we have tolerated, not what is right.
      *   *Action:* If a precedent exists, proceed to Question 4. If not, proceed to Question 5.

  4.  **The Polarity Check:** [JUDGMENT DRESSED AS PROCEDURE]
      *   *Question:* In the previous case, did this feature (e.g., pain) function as a *cost* to be minimized, or a *necessary signal*? In *this* case, does it function the same way?
      *   *Sufficient Answer:* A consensus statement on whether the *moral valence* of the feature has flipped.
      *   *Indicator of Polarity Shift:* If the context changes the feature from "tolerable burden" to "existential threat" (or vice versa), the precedent is void.
      *   *Example:* Restraint is a minor stressor in a trained animal; it is a panic-inducing event in a naive one. The feature (restraint) is the same; the moral weight has flipped.
      *   *Action:* If Polarity has Flipped, ignore precedent. Treat as new case (Go to Question 5). If Polarity is Stable, precedent carries **heavy weight**. Deviation requires written justification.

  5.  **The Value Hand-Off:** [PURE JUDGMENT]
      *   *Question:* Does the benefit (knowledge, conservation, health) outweigh the specific harm *in this specific context*?
      *   *Sufficient Answer:* There is none. This is where codification stops.
      *   *Procedure:* Each member states their position. The Community Member speaks last to ensure non-scientific values are not crowded out.
      *   *Stop Condition:* If the Committee cannot agree that the harm is *outweighed*, the protocol is **Refused**.
      *   *Note:* We do not vote on "Yes/No." We vote on "Is the reasoning sufficient?" A unanimous "Yes" with weak reasoning is a failure of this procedure.

  #### PHASE 3: RECORDING (5 Minutes)
  *Led by: Committee Chair*

  6.  **The Written Decision:**
      *   The written record must explicitly state:
          1.  Which features were treated as constant (following precedent).
          2.  Which features were treated as context-dependent (polarity shift).
          3.  Where the decision rested on judgment rather than rule.
      *   *Constraint:* Do not write "The committee determined the benefits outweighed the risks." Write *why* the specific risks were deemed acceptable in this specific context.
      *   *Precedent Weight:* This record becomes a data point for future Polarity Checks, not a binding statute.

  7.  **Deliberation Finished:**
      *   Deliberation ends when the dissenting members (if any) agree their objection is recorded accurately, even if overruled. Consensus on the *record* is required; consensus on the *decision* is not.

  ***

  ### CASE STUDIES: WRITTEN DECISIONS

  **CASE 1: PROTOCOL 24-09 (BEHAVIOURAL)**
  **Subject:** Rhesus Macaque (*Macaca mulatta*)
  **Procedure:** Single-housing for 12 weeks during cognitive testing.
  **Decision:** **REFUSED**

  **Reasoning:**
  1.  **Validity:** Confirmed. Statistical power requires isolation to prevent social learning confounds.
  2.  **Precedent:** Committee has approved single-housing for this species 4 times in 3 years.
  3.  **Polarity Check:** In previous cases, animals were housed singly for <2 weeks for surgical recovery. Here, the duration (12 weeks) shifts the feature from "temporary medical necessity" to "chronic social deprivation." The moral valence of isolation has flipped from *neutral/beneficial* to *severe harm*. Precedent does not apply.
  4.  **Value Hand-Off:** The scientific gain (incremental improvement in cognitive mapping) does not offset the specific harm of long-term social isolation in a gregarious primate. The harm is not merely "stress" but a deprivation of species-typical function.
  5.  **Judgment Note:** [This decision rests on the judgment that social need is a primary welfare metric, equal to physical health. This is a value claim, not a veterinary one.]

  **CASE 2: PROTOCOL 24-11 (NEUROSCIENCE)**
  **Subject:** Rat (*Rattus norvegicus*)
  **Procedure:** Repeated brief foot-shock (0.5s, 0.5mA) during light-cycle.
  **Decision:** **APPROVED**

  **Reasoning:**
  1.  **Validity:** Confirmed.
  2.  **Precedent:** Committee has approved foot-shock paradigms 15 times in 5 years.
  3.  **Polarity Check:** Previous approvals were during dark-cycle (active phase). This protocol is during light-cycle (rest phase).
      *   *Analysis:* Does waking a resting animal for aversive stimulation flip the polarity? Veterinary advice suggests physiological stress is higher, but the animal's capacity to learn the avoidance task remains intact. The feature (shock) remains a "tolerable signal," not a "chronic stressor." Polarity is Stable.
  4.  **Value Hand-Off:** Precedent holds. The deviation (light-cycle) is mitigated by reducing total trial number by 20% (Refinement).
  5.  **Judgment Note:** [We are treating the light-cycle deviation as a quantitative increase in cost, not a qualitative change in harm. This is a judgment call.]

  **CASE 3: PROTOCOL 24-14 (CONSERVATION)**
  **Subject:** Wild Northern Spotted Owl (*Strix occidentalis caurina*)
  **Procedure:** Lethal sampling of 5 individuals from a declining sub-population for pathogen analysis.
  **Decision:** **APPROVED**

  **Reasoning:**
  1.  **Validity:** Confirmed. Non-lethal sampling cannot identify the specific fungal load driving mortality.
  2.  **Precedent:** Committee has never approved lethal sampling from a "Threatened" wild population.
  3.  **Polarity Check:** Normally, death is the ultimate harm. Here, the death of 5 individuals is weighed against the potential extinction of 500. The feature (killing) functions as a *conservation tool* rather than a *terminal loss*. Polarity has Flipped.
  4.  **Value Hand-Off:** The committee accepts the utilitarian calculus that individual sacrifice is permissible to secure population viability.
  5.  **Judgment Note:** [This decision rests on the value judgment that the collective entity (population) has moral standing that supersedes the individual. This is not a biological fact. It is an ethical stance.]

  ***

  ### ANALYSIS: PARTICULARIST OR GENERALIST?

  You asked whether what I have written is a particularist procedure, or whether you have quietly become a generalist to have one.

  The honest answer is: **You have built a generalist machine to process particularist fuel.**

  The procedure itself is rigid. It demands sequential steps, time limits, and written records. It requires you to treat "Polarity" as a check-box item. In doing so, it codifies the *obligation* to look at context, but the act of codifying that obligation is itself a general rule. You have created a "Rule of Context."

  However, the procedure succeeds in one crucial particularist aim: it prevents the committee from hiding behind the rules. By forcing you to mark [JUDGMENT DRESSED AS PROCEDURE], it exposes the moments where the algorithm fails and the human must take the weight. It does not solve the moral problem; it prevents the bureaucracy from pretending the problem is solved.

  You have not become a generalist. You have become an **institutional particularist**. You are using the generalist tools of the bureaucracy (audit trails, precedents, checklists) to protect the particularist nature of moral reasoning from being crushed by that same bureaucracy. The procedure is a shield, not a map. It does not tell you where to go; it ensures you don't lie about how you got there.

  The cost, as you saw in Case 1, is that you will sometimes have to refuse valid science because the context makes the harm qualitatively different than the rulebook allows. Your colleagues will call this inconsistent. The procedure gives you the words to tell them: "It is not inconsistent to treat different cases differently. It is only inconsistent to treat different cases the same."
