answer: |-
  This is a sharp pedagogical move, and I think your intuition about separating those three complaints is correct, though I worry the story might do too much work for you in one specific area. You are right to suspect that students conflate the arithmetic, sacrifice, and standing complaints into a vague mush about rights, and using The Lottery is a clever way to force them apart because the story removes the variable that usually glues them together. In most utilitarian examples, like the standard organ harvest case, there is a clear arithmetic gain—five lives saved for one lost—which allows students to hide behind the math. They can say the arithmetic is wrong, or the sacrifice is impermissible, or the doctor lacks the standing, but they don't have to choose because the conclusion is the same either way. Jackson strips out the gain. There is no five-for-one trade. There is just one for zero. This isolates the standing complaint beautifully because it forces the question of why the village is allowed to kill Tessie at all. If the arithmetic complaint were the only thing that mattered, the story should feel absurd or nonsensical, like adding apples to oranges. But it doesn't feel nonsensical; it feels tyrannical. The horror isn't that the math is fake, but that the community assumes a jurisdiction over Tessie's life that they do not possess. So no, you are not just relabeling the arithmetic complaint as the standing complaint in nicer clothes. The arithmetic complaint attacks the coherence of the value being measured, while the standing complaint attacks the authority of the measurer. In the story, the value is null, so the coherence of the sum is irrelevant, yet the authority is still asserted, which proves the standing objection has independent weight.

  However, the reading becomes much more fragile when you push it in the direction you suggested, asking whether the objection survives if the corn really did come in heavy. This is the stress test for your tripartite distinction, and I suspect this is where your students will struggle to keep the complaints apart. If you tell the class that the lottery actually works, that Tessie's death guarantees survival for everyone else, the standing complaint risks collapsing back into the sacrifice complaint. Students will likely say that if the benefit is real, the village does have the standing to decide, unless you can convince them that some rights are trumps that no amount of utility can override. But that slips you back into deontology, which might muddy the waters on the separateness of persons specifically. The separateness of persons is supposed to be a structural critique of how utilitarianism models society, not necessarily a claim about inalienable rights. If the corn grows, the arithmetic becomes real, and the only thing left to object to is the use of Tessie as a means. At that point, the standing complaint loses its distinct footing unless you argue that no collective entity ever has the standing to trade a life for crops, regardless of the outcome. That is a hard sell in an intro course without leaning heavily on Kant, which might distract from the Rawlsian point you are trying to make. So the story helps you isolate the standing complaint only so long as the utility is ambiguous or absent; once you introduce a clear aggregate benefit, the distinctions blur again, and students will revert to saying the rights violation is the problem, which is exactly where you started.

  You also need to be prepared for the objection that you are imposing a utilitarian frame on a story that is not about utilitarianism at all. This is the strongest resistance point for this reading. The villagers are not calculating utilities. They are not saying one death is worth the survival of the harvest. They are following a ritual because it is what has always been done. Old Man Warner does not argue from consequences; he argues from tradition and superstition. If a student points out that utilitarianism requires a calculation of consequences, and there is no calculation in the story, only blind adherence to a rule, you have to admit they are right. The story is arguably better at illustrating rule-worship or the banality of evil than it is at illustrating the aggregative logic of utilitarianism. The danger here is that you might convince students that the separateness of persons objection applies to any collective sacrifice, rather than specifically to the utilitarian method of justification. To mitigate this, you need to be explicit that you are using the story as a limit case. You are showing them what happens when the utilitarian justification is removed entirely, leaving only the structure of sacrifice. If the utilitarian cannot justify the sacrifice with utility, they look exactly like the villagers in the story. The story shows the bare structure of aggregation without the veneer of benefit, which reveals that the problem isn't just the math, but the assumption that the collective can decide for the individual.

  Regarding where this reading is most likely to be wrong, I think it hinges on whether the standing complaint can actually stand alone without the support of the sacrifice complaint. My worry is that the standing complaint is parasitic on the idea that the person being sacrificed is being used wrongly. If the corn grows, and we assume Tessie consents, does the standing objection vanish? If you think the village still lacks the standing to kill her even with consent and benefit, then the standing complaint is robust. But if you think consent or benefit grants standing, then the complaint collapses into the other two. What would change my mind about your approach is if you run this discussion and find that when you introduce the benefit of the corn, the students cannot articulate why the village lacks standing without immediately invoking the language of rights or using someone as a means. If they cannot separate the authority to decide from the morality of the outcome, then the distinction you are drawing is too fine for the conceptual tools they currently have. Specifically, if a student says that the village has the standing to hold the lottery if the corn grows, then your claim that the standing complaint is independent of the arithmetic complaint is falsified in the classroom context. It would show that for introductory students, standing is contingent on the absence of a greater good, which means you haven't actually taught them the separateness of persons objection, but rather a contingent intuition about unfair sacrifices. To prevent this, you might need to emphasize that the separateness of persons is about the structure of the decision-making agent, not the outcome. The village acts as one super-person, and Rawls says society is not a super-person. That structural point needs to be the anchor, otherwise the story just becomes a debate about whether human sacrifice works, which misses the philosophical point entirely.
