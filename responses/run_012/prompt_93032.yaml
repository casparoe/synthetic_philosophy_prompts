answer: |-
  # Joint Statement on the Mechanisms of Human Cooperation
  **Adversarial Collaboration between the Instrumental Reciprocity Camp (IRC) and the Social Preference Camp (SPC)**

  **Date:** October 2023
  **Signatories:** [Representative, IRC] & [Representative, SPC]

  ## 1. Agreed Claims
  *The following propositions are accepted as true by both camps. We treat these as the baseline for further disagreement.*

  1.  **The Formal Model:** The Prisoner's Dilemma (PD) payoff matrix ($T > R > P > S$) is a valid abstraction for many real-world social tensions. In a strictly finite, known-horizon, one-shot PD with common knowledge of rationality and self-interest (defined as material payoff maximization), the unique Nash Equilibrium is mutual Defection.
  2.  **The Folk Theorem:** In infinitely repeated (or indefinitely horizoned) PDs, the Folk Theorem holds: there are infinitely many Nash Equilibria, including full cooperation, provided the discount factor (shadow of the future) is sufficiently high. The Folk Theorem explains *how* cooperation can be sustained, but not *which* equilibrium will be selected.
  3.  **Lab Data Existence:** In standard laboratory settings, human subjects cooperate at non-zero rates in one-shot anonymous PDs (typically 30–50%) and sustain high cooperation in iterated PDs with unknown horizons. Both camps agree this data is robustly reproducible.
  4.  **Heuristics:** Human decision-making is not calculated from first principles in real-time. We rely on heuristics, social norms, and emotional commitments that were likely shaped by evolutionary or cultural pressures.
  5.  **Punishment:** Second-order punishment (punishing those who do not punish defectors) is observed in public goods games, though its stability is mathematically fragile without additional mechanisms.
  6.  **Stakes Matter:** Increasing material stakes generally reduces cooperation rates, though the magnitude of this effect is disputed.

  ## 2. Areas of Disagreement
  *Where we diverge on interpretation, mechanism, and primary explanation.*

  | Feature | Instrumental Reciprocity Camp (IRC) | Social Preference Camp (SPC) |
  | :--- | :--- | :--- |
  | **Primary Driver** | Cooperation is instrumentally rational given the probability of future interaction (direct or indirect reciprocity). | Cooperation is driven by intrinsic preferences (inequity aversion, warm glow) or group-level adaptations. |
  | **One-Shot Data** | One-shot cooperation is a "spandrel": a misfiring of heuristics adapted for repeated social environments. It is error, not signal. | One-shot cooperation is a stable phenomenon reflecting genuine social utility functions. It is signal, not error. |
  | **Utility Function** | Agents maximize material payoff. Deviations are noise or constraints (e.g., confusion). | Agents maximize a social utility function where others' payoffs have non-zero weight. |
  | **Punishment** | Punishment is a strategic signal to enforce future compliance. Costly punishment is only rational if reputation is at stake. | "Strong Reciprocity" exists: agents derive utility from punishing norm-violators even when future payoff is impossible. |
  | **Evolutionary Path** | Individual-level selection suffices. Kin selection and direct reciprocity explain the adaptation. | Multi-level (group) selection is required to explain the stability of cooperation against free-riders in large groups. |

  ## 3. Cruxes and Predictive Tests
  *We have identified two specific experimental setups where our predictions diverge quantitatively. Settling these would update our credences significantly.*

  ### Crux A: The "True" One-Shot
  **Question:** Is one-shot anonymous cooperation a result of confusion/demand effects, or a stable preference?
  **Test Design:** A one-shot PD with high material stakes (equivalent to one week's wages for the subject population). The protocol includes a rigorous comprehension check (subjects must correctly predict payoffs for all four outcomes to proceed) and a "double-blind" administration where even the experimenters cannot link decisions to identities (eliminating reputation).

  | Camp | Prediction | Rationale |
  | :--- | :--- | :--- |
  | **IRC** | **Cooperation Rate < 5%** | Once confusion is eliminated and stakes make the cost of "error" high, the heuristic misfire corrects. Subjects will realize there is no shadow of the future. |
  | **SPC** | **Cooperation Rate > 20%** | Social preferences are robust to stakes within reasonable bounds. The utility derived from fairness or conditional cooperation outweighs the material loss for a significant minority. |

  ### Crux B: The Evolutionary Tournament
  **Question:** Can individual-level selection sustain cooperation in a noisy environment, or does it require group structure?
  **Test Design:** A round-robin iterated PD tournament. Parameters: 1% noise (random implementation error), unknown horizon (continuation probability $\delta = 0.99$). Populations evolve based on individual payoff (IRC condition) vs. populations evolve based on group-average payoff with migration (SPC condition).

  | Camp | Prediction | Rationale |
  | :--- | :--- | :--- |
  | **IRC** | **Reciprocity Wins (Individual)** | Strategies like *Generous Tit-for-Tat* or *Win-Stay-Lose-Shift* are Evolutionarily Stable Strategies (ESS) even under individual selection. They resist invasion by *Always-Defect* due to the shadow of the future. |
  | **SPC** | **Defect Wins (Individual)** | In a purely individual-selection model, *Always-Defect* (or mimic strategies) will eventually invade cooperative clusters due to noise triggering vendettas. Cooperation only survives in the *Group-Selection* condition. |

  ## 4. Verbal Dispute Check
  *We attempted to taboo the terms "selfish," "altruistic," "self-interest," and "group good" to see if the disagreement is merely semantic.*

  **Result:** The disagreement **survives** tabooing.

  *   **Rephrasing:** The dispute is not about whether agents are "selfish." It is about the **shape of the utility function**.
      *   **IRC Claim:** The utility function is $U = \text{Material Payoff}$. Observed cooperation is $U(\text{Payoff}) + \epsilon$, where $\epsilon$ is error/heuristic misapplication.
      *   **SPC Claim:** The utility function is $U = \text{Material Payoff} + \alpha(\text{Other's Payoff}) + \beta(\text{Norm Adherence})$. Observed cooperation is maximizing $U$.
  *   **Residual Semantic Issue:** There is minor friction over the definition of "rational." IRC defines rationality as maximizing material payoff given constraints. SPC defines rationality as maximizing revealed preference (including social preferences). We agree to use "material maximization" vs. "social utility maximization" to avoid this confusion.

  ## 5. Falsification Criteria
  *What evidence would cause each side to update significantly against its core position?*

  **Instrumental Reciprocity Camp (IRC) would update down if:**
  1.  In the **True One-Shot (Crux A)**, cooperation rates remain high (>30%) despite high stakes and perfect comprehension. This would imply the "heuristic misfire" theory is insufficient.
  2.  Neuroeconomic imaging shows distinct reward circuitry activation for *fairness* outcomes that is independent of material gain circuitry, and this activation predicts behavior better than material payoff models.

  **Social Preference Camp (SPC) would update down if:**
  1.  In the **True One-Shot (Crux A)**, cooperation rates drop to near-zero (<5%) under high stakes/comprehension. This would imply social preferences are weak or non-existent compared to material incentives.
  2.  Evolutionary simulations demonstrate that *individual-level* selection robustly sustains high cooperation in large, anonymous populations without requiring group-structure or assortment, rendering the group-selection mechanism unnecessary.

  ## 6. Shared Path Forward
  *Actions both sides agree would move the field forward, regardless of the outcome.*

  1.  **Standardize "One-Shot" Protocols:** We agree to adopt a standardized comprehension and belief-elicitation protocol for all future one-shot PD studies. Subjects must explicitly state their belief about the probability of future interaction; data where this belief >0 should be segregated.
  2.  **Focus on Mechanism, Not Just Outcome:** Both sides agree that measuring *reaction times* and *neural correlates* during decision-making is more informative than just recording C/D choices. (e.g., Is cooperation a fast/intuitive process or a slow/corrective one?)
  3.  **Real-World Stakes:** We agree to prioritize field experiments with meaningful stakes over low-stakes lab studies with undergraduate populations, as this bears most heavily on Crux A.

  ***

  **Signed:**
  *On behalf of the Instrumental Reciprocity Camp*
  *On behalf of the Social Preference Camp*
