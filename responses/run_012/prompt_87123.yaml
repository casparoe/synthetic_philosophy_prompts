answer: |-
  This is not a party trick; it is a formalized version of the **Euthyphro Dilemma**, generalized beyond theology to metaethics. It is a standard argument in the literature (often associated with objections to Constructivism or attempts to refute Naturalism), but your friend has presented it in a "steel-manned" way that glosses over where the actual philosophical fighting happens.

  Your intuition about the "will" distinction is correct, and step (6) is the most vulnerable claim in the sequence. Here is the breakdown of what is settled logic, what is contested metaphysics, and what you are paying for if you drop specific steps.

  ### 1. The Status of the Steps: Settled vs. Contested

  | Step | Claim | Status | Commentary |
  | :--- | :--- | :--- | :--- |
  | **(1)** | The Exhaustive Fork (Explanatory vs. Tracking) | **Settled Logic** | Logically, a dependency relation must go one way or the other (or be identity). Everyone accepts this is the structure of the question. |
  | **(2)** | The "Idleness" Charge | **Contested** | Assumes that if G *tracks* the good, it isn't the *ground*. Realists argue G can track and still be metaphysically essential (e.g., water tracks H₂O). |
  | **(3)** | The "Arbitrariness" Charge | **Contested** | Assumes that if G *makes* the good, G could have done otherwise. This holds for **Wills** (God, Advisors) but fails for **Natures** (Rationality, Human Function). |
  | **(4)** | The Elimination | **Contested** | Follows from (2) and (3). If you block either horn, (4) fails. |
  | **(5)** | The Good is Ungrounded | **Contested** | This is **Non-Naturalism/Primitivism**. Many serious metaethicists (Parfit, Enoch, Shafer-Landau) accept a version of this. It is not an absurdity. |
  | **(6)** | "Nobody can believe (5)" | **False** | **This is the weakest link.** Error Theorists (Mackie) deny objective good despite our distinctions. Non-Naturalists accept (5) but deny it renders morality meaningless. |

  ### 2. Addressing Your "Will" Worry

  You wrote: *"My friend says the dilemma only bites when G is a will... but then 'what a fully informed advisor would endorse' has a will in it and 'what's good for us' doesn't, which seems to get things exactly backwards."*

  **You are right; your friend is being imprecise.**

  The Euthyphro dilemma is devastating against **Voluntarism** (theories where the ground is a choice/decree, like Divine Command or some forms of Constructivism).
  *   **Against Voluntarism:** Horn (3) bites hard. If God/Advisor *chooses* the good, could they have chosen cruelty? If yes, morality is arbitrary. If no, their choice is constrained by a prior standard of goodness (Horn 2).

  The dilemma is much weaker against **Non-Voluntarism** (theories where the ground is a fact/nature, like Naturalism or Rationalism).
  *   **Against Naturalism/Rationalism:** Horn (3) loses its force. "Human Nature" or "Rational Requirements" do not *choose*. You cannot ask, "Could Human Nature have been different?" in the same way you ask, "Could God have commanded differently?"
  *   If G is "Rationality," the claim is not that Rationality *decides* kindness is good, but that kindness is *constitutive* of rationality. There is no "decree" to be arbitrary.

  **The Verdict:** The argument your friend posted treats all candidate grounds (God, Advisor, Nature, Imperative) as if they are all **Voluntarist**. That is a category mistake. It applies the "Arbitrariness" objection (3) to things that do not have the capacity for arbitrariness.

  ### 3. Which Step to Drop? (And the Cost)

  Since you want to keep (6) (the reality of moral distinctions) and reject (5) (that the good is ungrounded/brute), you must block the path from (1) to (5). You have three main options used in the literature.

  #### Option A: Drop Step (3) (The Necessity Move)
  **The Move:** Argue that even if G endorses/makes the good, G *could not have done otherwise*.
  **Who defends this:** Modified Divine Command Theists (God's nature is necessarily good); Kantian Rationalists (Rationality necessarily endorses the Categorical Imperative).
  **The Cost:** You must explain *why* G couldn't have done otherwise without appealing to a standard of goodness independent of G.
  *   *If you say:* "God couldn't command cruelty because He is Good," you collapse back into Horn (2) (Goodness is independent of God).
  *   *If you say:* "God couldn't command cruelty because of His Nature," you must explain how "Nature" differs from "Independent Standard." This is the **Essence vs. Attribute** debate. It is defensible, but technically demanding.

  #### Option B: Drop Step (2) (The Constitution Move)
  **The Move:** Argue that G tracks the good, but G *constitutes* the good, so it isn't "idle."
  **Who defends this:** Ethical Naturalists (e.g., Foot, Thompson). "Good" is not a separate property tracked by "Human Flourishing"; "Good" *is* "Human Flourishing."
  **The Cost:** You face the **Open Question Argument**. If Good = Flourishing, why does it still make sense to ask, "Is flourishing really good?" You must argue that this identity is synthetic or a posteriori, which requires a robust metaphysics of properties.

  #### Option C: Drop Step (6) (The Non-Naturalist Move)
  **The Move:** Accept (5). Admit the good is not grounded in G, but is a *sui generis* (unique) normative fact.
  **Who defends this:** Non-Natural Realists (Parfit, Enoch, Scanlon).
  **The Cost:** You pay the **Queerness Price**. You must explain how we access these ungrounded facts (epistemology) and what kind of existence they have (metaphysics) without being "spooky." However, note that this does *not* require giving up moral distinctions (6). Non-naturalists believe (6) strongly; they just deny that (5) undermines it.

  ### 4. Recommendation for Your Group

  If you want to keep the robust reality of moral distinctions (6) without accepting that morality is "ungrounded" in a way that makes it mysterious (5), **Option A (Drop Step 3)** is the most common route for theistic or rationalist realists, while **Option B (Drop Step 2)** is the route for naturalists.

  However, the most philosophically honest move regarding your friend's specific board note is to **challenge the application of Step (3) to non-voluntarist grounds.**

  **Tell your friend:**
  > "The dilemma works against Divine Commands because commands are contingent acts of will. It does not work against 'Human Nature' or 'Rational Requirements' because those are not acts of will. They don't 'endorse' things arbitrarily; they *entail* them necessarily. So Step (3) is an equivocation: it treats Natures as if they were Wills."

  **Summary of what is real vs. made up:**
  *   **Real:** Steps (1)-(4) are standard Euthyphro reasoning.
  *   **Real:** Step (5) is a recognized position (Primitivism/Non-Naturalism), though your friend frames it as a *reductio*.
  *   **Made Up/Exaggerated:** Step (6). Many philosophers believe (5) is true and compatible with (6).
  *   **Made Up/Imprecise:** The claim that this dilemma applies equally to Wills and Natures. That is the specific technical error your intuition picked up on.

  **Bottom Line:** You don't have to choose between (5) and (6). You can reject the inference from (1) to (5) by noting that for many candidate grounds (Nature, Rationality), the "Arbitrariness" horn (3) is a category error. That costs you nothing but the assumption that all grounds are Voluntarist.
