prompt: |-
  Just so you know where I'm coming from: no philosophy training whatsoever, I drive a truck for a living, and about two years ago I fell into one of those internet holes about ladder arguments. You know the kind — you take something mildly annoying and make it a tiny bit worse, over and over, and at every single rung it seems insane to call the next rung a big deal, and then you look up and you're supposedly comparing a stubbed toe with something you can't even say out loud. Same shape whether it's pain, or years of life, or how many animals suffer for your dinner. Me and three friends argue about this basically every time we get together, mostly because two of us are vegetarian and the other two think it's all a parlour trick.

  Two things I keep bumping into that I can't get anyone to answer straight. One, you can build the same kind of loop with no ladder at all, just by caring about two things at once — the job that pays better but is deadening, the one that's alive but pays nothing, the one that's close to home but the work is pointless — and if you line them up right you end up back where you started, each one better than the last. So there seem to be at least two flavours of the same trouble and I don't know if they're actually the same problem wearing different hats. Two, whenever we argue it out loud, whatever anyone says at rung five clearly depends on what they just compared it to at rung four, which makes me wonder if the weirdness is in our comparisons being all context-y rather than in the world.

  What I actually want from you: which questions in this area are worth the effort, and in what order? Four of us have Thursday nights for the next year, no library, no uni access, just stubbornness. So I want the reasoning — which question is upstream of which, which ones we could actually make progress on, which ones are traps that just look productive, and what would make you bump something up or down the list. And give me a straight answer on whether 'ok fine, then better-than just isnt transitive' is a real position or the philosophical version of giving up.
