prompt: |-
  I work in the provost's office at a mid-size university, and a big chunk of my job is dealing with people who say the university promised them something. A professor told a prospective PhD student she'd have funding for four years, nothing in writing, the student turned down another offer, then the grant fell through. A chair told a lecturer her contract would be renewed as long as enrollment held, enrollment dropped eight percent, and the chair retired. A community group says someone in facilities gave them the gym every Tuesday indefinitely, and they've since bought equipment. I get maybe forty of these a term, I've got about a week on each, I have no legal training and no philosophy background, and anything involving money or a multi-year commitment goes to the provost to sign off. I've been putting this off for months becuase I keep going in circles.

  What I want is a procedure my two staff and I can actually run on one of these, in order, and then explain out loud to the person complaining without hiding behind policy language. Not an essay on promising. Questions to ask in sequence, what counts as a good enough answer to each, where it stops with a flat no, and where it stops because the remaining question is a value call that a human has to make. Don't send me to the literature, I won't read it.

  Two things I've noticed from reading around that I want built in. First, I keep conflating three different questions: whether a commitment was actually made (what did these two people understand themselves to be doing?), whether it binds (what makes a promise stick in the first place -- the other person's reliance on it, the speaker's will, or something the two of them made between them that neither can just cancel?), and whether it beats everything else we might owe people. Those come apart and my office keeps smashing them together. I want them seperate in the procedure. Second, I need a test for the line between a promise and a prediction -- when somebody says you'll be fine, or we'll always have room for you, is that an undertaking or a forecast? Does it matter whether the listener was meant to rely on it, or just happened to? And related: does a promise need to be accepted to bind, or is it enough that it was made and heard?

  Also, I don't think binds is a yes/no. I want the output to be one of at least four: binds, we do it; binds but we can renegotiate; doesn't bind, but we owe them a straight explanation and maybe something anyway; and binds but not the way you think it does -- the obligation lands on someone else, or takes a different form than the complainant is asking for.

  Run it on three: (1) the four years of funding, where I suspect the answer is one I won't like, since nobody with budget authority made the promise; (2) the renewal, where the person who said it is gone and the condition she attached has failed; (3) the community group, where the promise is vague, open-ended, and was made by someone who has retired. Include one case where the procedure says no, and one where it genuinely can't decide because the parties disagree about what was said and there's no record.

  Tell me where the procedure will misfire and which steps are judgment calls dressed up as questions. And at the end, say how confident you are in the procedure as a whole and which single step you're least sure about -- I'd rather know where it's shaky than get something that sounds tidy.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Works in a Provost's office at a mid-size university. Deals with ~40 "broken promise" cases per term. 1 week per case. No legal/philosophy training. Needs a practical, step-by-step procedure for themselves and two staff members.
      *   **Goal:** A workflow to evaluate claims of broken promises, explainable to complainants without jargon.
      *   **Specific Requirements:**
          *   Separate three questions: Commitment Made? Binding Force? Priority vs. Other Obligations?
          *   Distinguish Promise vs. Prediction (reliance vs. forecast).
          *   Address Acceptance (does a promise need acceptance to bind?).
          *   Output Categories (4 types): Binds/Do it; Binds/Renegotiate; Doesn't Bind/Owe Explanation/Remedy; Binds/Different Form/Agent.
          *   Run the procedure on 3 specific cases (PhD funding, Lecturer renewal, Community gym) + 1 "No" case + 1 "Undecidable" case.
          *   Critique the procedure: Where does it misfire? Which steps are judgment calls? Confidence level? Least sure step?
          *   **Constraint:** Do not send to literature. No essays on promising. Practical tool only.

  2.  **Deconstruct the Philosophical/Practical Problems:**

      *   *Commitment vs. Prediction:* This is about speech acts. "You'll be fine" vs. "I promise you'll be funded." Key differentiator: Intent to undertake obligation + Reasonable reliance.
      *   *Authority:* A professor cannot promise university funds they don't control. This is agency law basics but needs to be framed practically.
      *   *Reliance:* Did the listener change their position based on the statement? (Detrimental reliance).
      *   *Conditions:* "As long as enrollment held." If enrollment drops, did the promise expire?
      *   *Institutional Memory/Authority:* Can a retired chair or facilities manager bind the institution indefinitely? Generally no, but estoppel might apply.
      *   *Priority:* Even if binding, does it override budget realities or equity for others?

  3.  **Drafting the Procedure (The "Protocol"):**

      *   Need a linear flow.
      *   Need clear "Stop" points.
      *   Need to separate the three layers the user identified (Fact of Promise, Binding Nature, Priority/Remedy).
      *   *Step 1: Authority & Capacity.* (Can this person promise this?)
      *   *Step 2: The Speech Act.* (Promise vs. Prediction/Aspiration.)
      *   *Step 3: Reliance & Acceptance.* (Did they hear it, accept it, and act on it?)
      *   *Step 4: Conditions & Duration.* (Was it conditional? Did the condition fail?)
      *   *Step 5: Institutional Constraint.* (Does this violate higher policy/budget?)
      *   *Step 6: Classification.* (Map to the 4 output categories.)

      *Refining the Steps based on User Constraints:*
      *   User wants to separate "Was it made?" from "Does it bind?" from "Does it beat other obligations?"
      *   Let's structure it into three Phases.
      *   *Phase 1: The Fact of Commitment.* (What was said? Who said it? Promise or Prediction?)
      *   *Phase 2: The Force of Commitment.* (Reliance? Authority? Conditions?)
      *   *Phase 3: The Resolution.* (Remedy? Renegotiation? Denial?)

  4.  **Developing the Test Cases:**

      *   *Case 1 (PhD Funding):* Prof promised 4 years. No budget authority. Grant failed. Student relied (turned down other offer).
          *   *Analysis:* Promise made? Yes (likely). Authority? No. Reliance? Yes. Outcome: Binds/Renegotiate or Doesn't Bind/Owe Remedy. (Usually, university isn't bound by prof's unauthorized promise, but equity suggests finding some money).
      *   *Case 2 (Lecturer Renewal):* Chair promised renewal *if* enrollment held. Enrollment dropped. Chair retired.
          *   *Analysis:* Promise made? Yes. Condition? Yes (enrollment). Condition failed? Yes. Outcome: Doesn't Bind.
      *   *Case 3 (Community Gym):* Facilities staff promised gym Tuesdays indefinitely. Group bought equipment. Staff retired.
          *   *Analysis:* Promise made? Maybe vague. Authority? Doubtful (scheduling usually requires admin approval). Reliance? Yes (equipment). Outcome: Binds/Different Form (find other space) or Doesn't Bind/Owe Explanation.
      *   *Case 4 (The "No"):* Need a clear cut case. E.g., A student claims a advisor promised an A.
      *   *Case 5 (The "Undecidable"):* He-said-she-said, no witnesses, no email.

  5.  **Refining the Output Categories:**

      1.  **Green (Binds/Do It):** Valid authority, clear promise, reliance, no conflict.
      2.  **Yellow (Binds/Renegotiate):** Promise valid, but circumstances changed or terms vague.
      3.  **Blue (Doesn't Bind/Remedy):** No authority or condition failed, but reliance was reasonable. Mitigation needed.
      4.  **Red (Binds/Different Agent):** Promise valid, but wrong person/department holding the bag.

      *Wait, user asked for specific 4:*
      1. Binds, we do it.
      2. Binds but we can renegotiate.
      3. Doesn't bind, but we owe them a straight explanation and maybe something anyway.
      4. Binds but not the way you think it does (obligation lands elsewhere/different form).

      *Okay, I will map the cases to these specific four.*

  6.  **Addressing the "Promise vs. Prediction" and "Acceptance" questions:**

      *   *Promise vs. Prediction:* Test = "Could the speaker have controlled the outcome?" + "Did they invite reliance?"
      *   *Acceptance:* In contract law, yes. In moral/institutional context, reliance often substitutes for formal acceptance. I need to build this into Step 3.

  7.  **Critiquing the Procedure (Self-Correction):**

      *   Where will it fail? When authority is ambiguous (e.g., a Chair *usually* controls hiring but technically needs Dean sign-off).
      *   Judgment calls: Determining "Reasonable Reliance." Determining "Authority."
      *   Confidence: High on structure, low on the "Authority" step because university governance is messy.
      *   Least sure step: The "Authority" step. It's easy to say "check authority," but hard when lines are blurred.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Direct, administrative, pragmatic. No fluff.
      *   *Structure:*
          1.  The Protocol (3 Phases, specific questions).
          2.  The Decision Matrix (The 4 outputs).
          3.  The Case Runs (5 cases).
          4.  The Critique (Misfires, Judgment Calls, Confidence).

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "Promise vs Prediction" and "Acceptance" questions within the protocol steps, not as a sidebar.
      *   *Promise vs Prediction:* Put this in Phase 1, Question 2.
      *   *Acceptance:* Put this in Phase 2, Question 1 (Reliance).

      *(Refining Case 1 - PhD)*: Prof has no budget authority. This is the classic "apparent authority" trap. The University isn't bound, but the student relied. This fits "Doesn't bind, but we owe... something."
      *(Refining Case 2 - Lecturer)*: Condition failed. "Doesn't bind." But maybe "owe explanation."
      *(Refining Case 3 - Gym)*: Indefinite promise by non-admin. Reliance (equipment). This fits "Binds but not the way you think" (maybe we find you space, but not *that* gym) OR "Doesn't bind, but remedy." Let's aim for "Binds but not the way you think" to show variety. Actually, "Binds but renegotiate" might fit better if the gym is needed for classes. Let's go with "Doesn't bind, but owe something" because Facilities staff usually can't allocate space indefinitely.
      *(Refining Case 4 - The No)*: A claim based on a prediction. "You'll get a job with this degree."
      *(Refining Case 5 - The Undecidable)*: Oral agreement, no witnesses.

      *Wait, I need to make sure I answer the specific philosophical questions the user asked within the procedure design.*
      *   "Does a promise need to be accepted to bind?" -> Address in Phase 2.
      *   "Promise vs Prediction" -> Address in Phase 1.

  9.  **Final Review against Constraints:**
      *   No literature references? Check.
      *   Procedure in order? Check.
      *   Explainable out loud? Check (use plain English).
      *   4 Output categories? Check.
      *   Run on 3 specific cases + 1 No + 1 Undecidable? Check.
      *   Critique included? Check.
      *   Confidence level? Check.

  10. **Final Polish:** Ensure the distinction between "Authority" and "Binding" is clear. A promise can be *morally* binding on the speaker but not *institutionally* binding on the university. The procedure needs to navigate this. The "Binds but not the way you think" category is perfect for "The Prof promised, so the Dept must find the money, not the Central Budget."

      *Let's tighten the "Authority" step.* If the person lacked authority, the institution isn't bound *contractually*, but might be bound *equitably*. I need to make sure the procedure distinguishes "Institutional Obligation" from "Interpersonal Obligation."
      *Actually, the user works for the Provost. They care about Institutional Obligation.* So, "Lack of Authority" usually leads to "Doesn't Bind (Institution)," but triggers the "Owe something anyway" path due to reliance.

      *Okay, ready to write.*
answer: |-
  Here is a procedure designed for your context. It separates the three layers you identified (Fact, Force, Priority) and forces a decision at each stage. It is written to be read aloud to a complainant.

  ### The Protocol: "The Three-Point Check"

  **Phase 1: The Fact of Commitment (Was a promise made?)**
  *Goal: Distinguish a promise from a prediction or aspiration.*

  1.  **Who spoke?** Identify the specific person.
      *   *Stop:* If the claim is "The University said..." but no specific person is identified, pause. You need a source.
  2.  **Control Test:** Did the speaker have control over the outcome at the time they spoke?
      *   *Yes:* "I will fund you." (Promise candidate)
      *   *No:* "You'll do fine here," or "We usually have room." (Prediction/Forecast)
      *   *Rule:* If they couldn't control it, it wasn't a promise. It was a hope. **Stop. Output: Doesn't Bind.**
  3.  **Intent Test:** Did the speaker intend for you to act on this *now*?
      *   *Question:* "Did they ask you to make a decision based on this statement?"
      *   *Yes:* "Turn down the other offer, I've got you." (Promise)
      *   *No:* "Keep us in mind." (Invitation)
      *   *Rule:* If no reliance was invited, it is not a binding commitment. **Stop. Output: Doesn't Bind.**

  **Phase 2: The Force of Commitment (Does it stick?)**
  *Goal: Determine if the promise survives contact with reality and rules.*

  4.  **Authority Test:** Did the speaker have the actual power to commit the resources they promised?
      *   *Check:* Does a Professor control the budget? Does a Facilities manager control long-term scheduling?
      *   *Yes:* Proceed to Q5.
      *   *No:* The individual made a promise they could not keep. The *person* may be in the wrong, but the *institution* is not automatically bound. **Mark for "Remedy" path, do not mark as "Bind."**
  5.  **Condition Test:** Was the promise dependent on a condition?
      *   *Check:* "As long as enrollment holds," "If grant comes through."
      *   *Condition Met:* Proceed to Q6.
      *   *Condition Failed:* The promise expired naturally. **Stop. Output: Doesn't Bind.**
  6.  **Reliance Test:** Did you change your position based on this, and was it reasonable to do so?
      *   *Check:* Did they turn down other offers? Spend money? Move?
      *   *Yes:* The promise has "force" due to reliance (even if Authority failed).
      *   *No:* If they didn't act on it, it's easier to walk back.
      *   *Note on Acceptance:* You do not need a signed acceptance. If they heard it and acted on it (Reliance), acceptance is implied.

  **Phase 3: The Resolution (What do we do?)**
  *Goal: Assign the obligation.*

  7.  **Conflict Test:** Does fulfilling this promise break a higher rule (state law, accreditation, budget solvency, equity with other students)?
      *   *No:* **Output: Binds, We Do It.**
      *   *Yes:* We cannot do exactly what was asked. Proceed to Q8.
  8.  **Substitution Test:** Can we meet the *intent* of the promise in a different way?
      *   *Yes:* (e.g., Different funding source, different room). **Output: Binds, But Not The Way You Think.**
      *   *No:* (e.g., Money literally does not exist). Proceed to Q9.
  9.  **Mitigation Test:** Since you relied on us (Phase 2, Q6), do we owe you help even if we aren't bound?
      *   *Yes:* (Standard for unauthorized promises with reliance). **Output: Doesn't Bind, But We Owe Explanation/Remedy.**
      *   *No:* (Condition failed or no reliance). **Output: Doesn't Bind.**

  ---

  ### The Four Outputs (Defined for Staff)

  1.  **Binds, We Do It:** Authority was valid, conditions met, no policy conflict. We fulfill the exact request.
  2.  **Binds, But We Can Renegotiate:** The commitment is real, but the original terms are now impossible. We must sit down and find a substitute that honors the reliance.
  3.  **Doesn't Bind, But We Owe Them:** The speaker lacked authority or conditions failed, *but* the complainant relied reasonably. We say "No" to the demand, but "Yes" to mitigation (e.g., bridge funding, priority for next cycle).
  4.  **Binds, But Not The Way You Think:** The obligation exists but lands on a different budget/unit, or takes a different form (e.g., "We promised you a gym, but we can't give you *that* gym; we owe you *access to a* gym").

  ---

  ### Running the Cases

  #### Case 1: The PhD Funding (Professor promised 4 years, grant failed, no budget authority)
  *   **Phase 1:** Control? Yes (Prof thought so). Intent? Yes ("Turn down other offer"). **Result: Promise Made.**
  *   **Phase 2:** Authority? **No.** (Prof cannot commit central funds). Condition? Implicitly "If grant holds." Reliance? **Yes** (Turned down other offer).
  *   **Phase 3:** Conflict? Yes (No money). Substitution? Maybe (Other grants?). Mitigation? Yes (Student is stranded).
  *   **Output:** **Doesn't Bind, But We Owe Them.**
  *   *Explanation:* "The Professor made a promise they didn't have the key to unlock. The University isn't contractually bound by that signature. However, you acted on our behalf's word. We won't fund the four years as promised, but we will fund year one and prioritize you for the next internal fellowship."

  #### Case 2: The Lecturer Renewal (Chair promised renewal if enrollment held, enrollment dropped 8%, Chair retired)
  *   **Phase 1:** Control? Yes (Chair controls hiring recommendations). Intent? Yes. **Result: Promise Made.**
  *   **Phase 2:** Authority? Yes (Within Chair's scope). Condition? **Yes** ("As long as enrollment held"). Condition Met? **No** (Dropped 8%).
  *   **Phase 3:** Since condition failed, the promise expired.
  *   **Output:** **Doesn't Bind.** (Potentially "Owe Explanation" depending on how the drop was calculated, but strictly: No).
  *   *Explanation:* "This was a conditional agreement. The condition was enrollment stability. Enrollment dropped. The agreement ended when the numbers changed, regardless of who is currently Chair."

  #### Case 3: The Community Gym (Facilities staff promised Tuesdays indefinitely, group bought equipment, staff retired)
  *   **Phase 1:** Control? **Debatable.** (Facilities manages space, but usually not indefinite community contracts). Intent? Yes. **Result: Promise Made.**
  *   **Phase 2:** Authority? **No.** (Indefinite allocation usually requires Admin/Provost). Reliance? **Yes** (Bought equipment).
  *   **Phase 3:** Conflict? Yes (Space needed for students). Substitution? **Yes** (Different time/space).
  *   **Output:** **Binds, But Not The Way You Think.**
  *   *Explanation:* "The University owes you access based on your reliance, but the specific person couldn't give away that room forever. The obligation is to find you equivalent space, not necessarily that specific gym on Tuesdays."

  #### Case 4: The "No" (Alumni claims Advisor said "This degree guarantees a job")
  *   **Phase 1:** Control? **No.** (Advisor cannot control the job market).
  *   **Stop.**
  *   **Output:** **Doesn't Bind.**
  *   *Explanation:* "That was a prediction about the market, not a commitment of university resources. No one here can guarantee employment."

  #### Case 5: The Undecidable (Student claims Dean promised a waiver in a hallway chat; Dean denies; no witnesses)
  *   **Phase 1:** Control? Yes. Intent? Maybe.
  *   **Phase 2:** **Fact Check Fail.** We cannot establish Phase 1.
  *   **Output:** **Procedure Misfire.**
  *   *Action:* This stops the protocol. You cannot run the check if the input is contested with no evidence.
  *   *Explanation:* "We have no record of this commitment. Without verification, we cannot authorize resources based on an unverified conversation. We have to operate on the written record."

  ---

  ### Critique: Where This Will Misfire

  **1. The "Authority" Step is a Judgment Call Dressed as a Question.**
  In universities, authority is porous. A Department Chair *usually* hires lecturers. A Professor *usually* allocates RA funding. When they step slightly outside the lines, is it "No Authority" or "Apparent Authority"?
  *   *Risk:* Your staff will have to guess if a Chair *really* had the power.
  *   *Mitigation:* Create a "Red Flag List" for your staff. (e.g., "Professors cannot promise >1 year funding," "Chairs cannot promise >3 year contracts"). If it's on the list, Authority = No. If not, Authority = Yes.

  **2. The "Condition" Test relies on memory.**
  In the Lecturer case, did the Chair say "If enrollment holds" or "Barring major budget cuts"?
  *   *Risk:* People forget conditions attached to good news.
  *   *Mitigation:* If the condition is disputed and unwritten, default to **Doesn't Bind, But We Owe Explanation.** Treat ambiguity as an institutional failure to communicate, not a user failure to listen.

  **3. "Reliance" is subjective.**
  How much reliance is enough? Turning down one job? Selling a house?
  *   *Risk:* Staff might minimize the complainant's hardship ("They could have taken both offers").
  *   *Mitigation:* Define "Reasonable Reliance" for your team. "Detrimental action that is hard to reverse" (e.g., turning down a funded offer, moving cities). "Hoping for the best" is not reliance.

  ### Confidence and Weakest Link

  **Confidence Level:** 85%.
  This will clear 35 of your 40 cases quickly. It stops you from arguing philosophy and forces you to argue facts (Authority, Conditions, Reliance).

  **Least Sure Step:** **Phase 2, Question 4 (Authority Test).**
  This is the shakiest part. In a mid-size university, "who can promise what" is often unwritten lore. If your staff guesses wrong on whether a Chair had the power to renew a lecturer, you either lose money you shouldn't have spent or you create a lawsuit you could have avoided.
  *   *Fix:* Spend your first week just building a one-page "Authority Matrix" for your staff. Who can sign what? Once that is static, the procedure becomes 95% reliable. Until then, that step is a guess.
