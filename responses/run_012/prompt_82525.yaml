      *   *Ethics:* She cared because ethics needs a subject. You can't wrong a scattered atom.
      *   *Ending:* We can't say she's watching us. But we can say the question is still alive.
      *   *Constraint Check:* No "lives on in work." No "she's at peace."

  6.  **Refining the Philosophy (Crucial Step):**
      The prompt says: "She thought the interesting question was never whether there's experience down at the bottom, but whether it adds up."
      And: "If the little bits of experience don't genuinely combine into a single subject, then panpsychism doesn't give you a bigger moral universe, it gives you a much stranger one."
