      *   **Speaker:** Former student/colleague giving opening remarks.
      *   **Audience:** ~30 people. Split: ~12 experts (former students/colleagues, know the literature), ~18 non-experts (husband, brothers, choir friends).
      *   **Time:** 8 minutes (approx. 1,000 words spoken).
      *   **Subject's Work:** Philosophy of mind/consciousness. Specifically, panpsychism.
      *   **Key Philosophical Point:** The "Combination Problem." She argued that whether experience exists at the bottom doesn't matter as much as whether it *combines* into a single subject. If it doesn't combine, panpsychism doesn't expand the moral universe; it creates a scattered universe of subjects that are "nobody in particular." This is the ethical core of her work.
      *   **Constraints:**
          *   No "she lives on in her work."
          *   No standard consolations ("she's at peace," "she's with us") – she would have rejected these as wishful thinking.
          *   Don't alienate the experts (no oversimplification) or the family (no jargon/terror).
          *   Address the brother's question: "Is the universe in pain?"
          *   Don't turn it into a debate about whether she was right (save for after lunch).
          *   Identify the final "landing sentence" and explain why.

  2.  **Determine the Tone:**

      *   Respectful but intellectually honest.
      *   Warm but not sentimental.
      *   Clear but not dumbed down.
      *   Acknowledges the loss without fake comfort.
      *   Bridges the gap between the technical philosophy and the human grief.

  3.  **Drafting - Section by Section:**

      *   **Opening (Welcome & Acknowledgement):** Welcome everyone. Acknowledge the dual nature of the gathering (workshop + memorial). Acknowledge the family specifically.
      *   **The Philosophy (The Core):** Introduce her central question. Avoid jargon where possible, but keep the integrity of the "Combination Problem."
      *   **The Brother's Question:** Address "Is the universe in pain?" directly. This is the bridge for the family.
      *   **The Ethical Stakes:** Explain *why* she cared. It wasn't just puzzles; it was about who matters. The "scattered subjects" idea.
      *   **The Loss:** Acknowledge her absence without fake metaphysics. She isn't "somewhere else." She is gone. But the question remains.
      *   **The Closing:** Bring it back to the room. We are here to think *with* her, not just *about* her.
      *   **The Landing Sentence:** Needs to resonate with both groups.

  4.  **Drafting - Iteration 1 (Mental Outline):**
