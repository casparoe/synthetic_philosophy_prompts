answer: |-
  ### The Surplus & Skill Protocol (SSP)

  **Purpose:** To determine whether a technological proposal reinforces the extraction of value from labor or redistributes the gains of productivity.
  **Time Required:** 10 minutes per proposal.
  **Participants:** All voting board members.
  **Pre-condition:** The proposer must submit a one-page "Labor Impact Statement" alongside the financial projection.

  #### Step 0: The Politics Acknowledgement
  *Read aloud before beginning.*
  "This procedure assumes that 'efficiency' is not a neutral good. It is a claim about who works, who owns the work, and who keeps the value. If this feels like politics, it is because budget allocation is the mechanism of politics. We are not deciding if the machine works; we are deciding if we accept the social relations the machine requires."

  #### Step 1: The Source of Savings (The "Who" Question)
  **Question:** Does the cost reduction come from (A) reducing the time necessary to produce the commodity, or (B) reducing the wage paid for that time?
  *   **Sufficient Answer:** A breakdown of the cost difference. If the machine costs less because it does the work faster, note it. If it costs less because the operator is paid less (or nothing), note it.
  *   **Stop Condition:** If the savings come primarily from **B** (paying less for the same or more value), the proposal is **Rejected** unless Step 2 overrides.
  *   **Rationale:** Machinery that saves labor is progress; machinery that saves wages is extraction.

  #### Step 2: The Destination of Surplus (The "Where" Question)
  **Question:** Who captures the time or money saved?
  *   **Options:**
      1.  **Owners/Shareholders:** (Increased margin, lower book prices to drive volume, retained earnings).
      2.  **Workers:** (Reduced hours for same pay, increased pay for same hours, reinvestment in worker development).
      3.  **Readers/Public:** (Significantly lower price without volume pressure).
  *   **Stop Condition:** If the surplus goes entirely to **1** while Step 1 identified wage reduction, the proposal is **Rejected**.
  *   **Vote Trigger:** If the surplus is split, or if the proposal argues that "survival of the press" counts as "Owners," move to Step 5.

  #### Step 3: The Skill Transfer (The "Deskilling" Question)
  **Question:** Does the technology move judgment, taste, or technique from the worker into the owner's equipment?
  *   **Test:** If the worker leaves, does the machine keep their competence? If yes, the competence is now property, not labor.
  *   **Stop Condition:** If the proposal turns a skilled role (translator, narrator, editor) into a machine-minding role (proofreader, prompter, verifier) *and* the wage is adjusted downward to match the lower skill threshold, the proposal is **Rejected**.
  *   **Rationale:** This creates a "reserve army" of cheaper labor and weakens the bargaining position of all future workers in that category.

  #### Step 4: The Intensity & Security Check
  **Question:** What happens to the workers who remain?
  *   **Sub-question A:** Does their workload increase to manage the machine's output? (Intensification).
  *   **Sub-question B:** Are the displaced workers offered severance, retraining, or ongoing royalty participation? (One-time buyouts count as displacement).
  *   **Stop Condition:** If workload intensifies *and* displaced workers are severed without ongoing stake, the proposal is **Rejected**.

  #### Step 5: The Loss Distribution Vote
  If the proposal has passed Steps 1–4 (or if the board chooses to override a Stop Condition):
  **Question:** We have identified a loss (either to labor standards or to press solvency). Who bears it?
  *   **Option A:** The Press absorbs the cost (Labor is paid full rate, machine is not used or is used as a tool only).
  *   **Option B:** The Labor bears the cost (Wages/royalties are reduced to accommodate the machine).
  *   **Action:** A formal vote is required here. There is no "technical" solution. This is a distributional choice.

  ---

  ### Structural Note: Private Press vs. Worker Cooperative
  You asked what changes if the press is a cooperative.
  *   **In a Private Press (Your Current State):** The "Owners" in Step 2 are distinct from the "Workers." The procedure is a defensive wall against extraction. A "Yes" vote is an admission that you are acting as capitalists regarding the freelancers, even if you are benevolent ones.
  *   **In a Cooperative:** The "Owners" and "Workers" are the same body. Step 2 becomes internal. However, Step 3 (Deskilling) remains critical. Even in a co-op, if you embed your collective skill into a machine owned by the co-op, you risk making your own roles replaceable by cheaper non-member labor later.
  *   **Verdict:** The *questions* do not change. The *verdicts* might, because the surplus in Step 2 circulates back to the workers. However, regarding *external* freelancers (narrators, translators), a co-op is still a capitalist firm. The procedure treats them the same.

  ---

  ### Application to Current Proposals

  #### Proposal 1: Synthetic Audiobooks (Backlist)
  *   **Step 1 (Source):** Savings come from eliminating ongoing royalties and paying a one-time fee. This is **Wage Reduction (B)**.
  *   **Step 2 (Destination):** Savings go to the Press (margin or reinvestment). **Owners**.
  *   **Step 3 (Skill):** Narration skill (performance, interpretation) is transferred to the synthetic model (Press property). The narrator becomes a one-time data source. **Deskilling confirmed.**
  *   **Step 4 (Intensity/Security):** Displaced narrators get a one-time payment. No ongoing stake. **Security failed.**
  *   **Procedure Verdict:** **REJECT.**
  *   **Plain Truth:** This converts a collaborative artistic labor into a raw material extraction. The one-time payment is a buyout of the worker's future claim on the value they create. Under this procedure, this is indistinguishable from a mill owner replacing a weaver and paying them a lump sum to leave.

  #### Proposal 2: Machine Translation (Backlist, including your book)
  *   **Conflict of Interest Check:** The procedure requires you to **RECUSE** yourself immediately. Your book is the commodity; you cannot vote on the devaluation of the labor that translates it. You must leave the room for this vote.
  *   **Step 1 (Source):** Machine cost + flat fee proofreader < Human Translator fee. **Wage Reduction (B).**
  *   **Step 2 (Destination):** Press (market expansion). **Owners.**
  *   **Step 3 (Skill):** Translation judgment moves to the model. Proofreader becomes a corrector of machine errors. **Deskilling confirmed.**
  *   **Step 4 (Intensity/Security):** Proofreader workload may increase (fixing systemic errors is often harder than translating). Displaced translators get nothing.
  *   **Procedure Verdict:** **REJECT** (based on Steps 1 & 3).
  *   **The Vote Trigger:** The publisher may argue "Market Expansion" (Readers who otherwise wouldn't reach the book). The procedure forces a Step 5 Vote: **Does the press absorb the cost to pay the translator a full fee for a "revision," or does the translator bear the loss?**
  *   **Plain Truth:** If you proceed without paying the translator a full fee, you are admitting that *access* is more important than *labor value*. The procedure forces you to say this aloud. It strips the "democratization of reading" cover off the budget cut.

  #### Proposal 3: Slush Pile AI (Quarterly)
  *   **Step 1 (Source):** Reduces reader hours from 6 to 2. **Labor Reduction.**
  *   **Step 2 (Destination):** Press (time savings for board/readers). **Owners/Management.**
  *   **Step 3 (Skill):** "Taste" and "judgment" (the core skill of a literary editor) are transferred to the model. The remaining 2 readers become verifiers of the AI's taste. **Deskilling confirmed.**
  *   **Step 4 (Intensity/Security):** 4 readers displaced. Remaining 2 may face pressure to process higher volume since the AI "pre-filtered."
  *   **Procedure Verdict:** **REJECT.**
  *   **Plain Truth:** This is the most dangerous proposal. It alienates the press's core competence. If the machine learns what "good" looks like from your slush, it owns that definition. You are training your own replacement. The procedure identifies this as a threat to the press's long-term existence, not just a labor issue.

  ---

  ### Where the Procedure Misfires (Limitations)

  You asked where the honest answer is that we are not deciding about machinery at all.

  **1. The Solvency Trap**
  The procedure assumes you have the power to say "No." It cannot account for the scenario where the "No" verdict means the press closes in 18 months. If the choice is "Exploit translators or cease publishing," the procedure labels it exploitation, but the vote will still be "Yes." In this case, the procedure functions only as a *confession*, not a shield. It tells you what you are, but it cannot stop you from being it.

  **2. The "Mission" Disguise**
  Step 2 allows "Readers/Public" as a destination for surplus. A clever proposer can argue that lower costs = lower prices = more readers. This disguises wage cuts as "access." The procedure flags this, but it cannot mathematically disprove the claim that "a cheap machine-translated book is better than no book at all." That is a theological argument, not an economic one. The procedure forces a vote, but it cannot resolve the moral contradiction.

  **3. The Freelancer Blind Spot**
  The procedure works best for employees. For freelancers (narrators, translators), the "Relations of Production" are already obscured by contracts. The procedure treats them as workers (which they are), but the legal reality is they are vendors. If the board votes "Yes," the procedure cannot protect the workers. It only protects the board's conscience. It reveals that you are not a "community of letters" but a firm managing supply chains.

  **4. The Politics Objection, Revisited**
  You anticipated someone saying, "This is politics dressed up as procedure."
  The procedure's answer is: **"Yes. Your budget is politics dressed up as arithmetic."**
  The procedure does not remove politics; it removes the *alibi*. It prevents the accountant from saying "The numbers made us do it." It forces the board to say "We chose the numbers over the workers."

  **5. The Cooperative Illusion**
  If you convert to a co-op, this procedure will hurt more. It will reveal that to survive in a capitalist market, a co-op must often exploit its *external* freelancers just like a private firm. The procedure cannot solve the market's coercion. It only clarifies your position within it.

  ### Final Recommendation
  Run the protocol. When it lands on **Reject** for the audiobooks and **Vote** for the translation, do not look for a workaround. The discomfort you feel is the procedure working. It is measuring the distance between your values and your ledger. If you cannot bridge that distance without cutting wages, the procedure demands you admit that the press's survival is currently subsidized by the underpayment of its contributors.

  That is the only truth that matters for the next ninety minutes.
