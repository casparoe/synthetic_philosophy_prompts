prompt: |-
  For the past year I have been trying to settle, for myself, whether my own small contributions to large harms — a flight, a portion of meat, a vote, a few purchases — matter morally, and I keep running into the same wall. Every argument I can reconstruct either proves too much, so that I am implicated in almost everything, or too little, so that nothing I do makes a difference and I am off the hook. Before I choose a side I want the specification first. Write out the requirements that any adequate theory of an individual's contribution to a collectively caused harm must meet — the spec I would want in hand before entertaining anyone's theory.

  Give me, first, the cases the theory has to get right, each with a sentence on why it is a real case rather than a trick: the ordinary threshold case, where many small contributions together cross a line and mine is neither necessary nor sufficient; a case where I cannot know how many others are contributing, or whether I am pivotal; a case where the harm travels through a norm or a market rather than through physics, so that my restraint changes who consumes but not how much; a case where everyone in my position reasons identically, so the theory has to tell each of us what to do when we all think the same way; and a case where one much larger actor causes most of the harm and I cause a sliver, so that the theory neither dissolves my sliver into their wrongdoing nor inflates it to their size.

  Then the distinctions it cannot collapse: making a difference to a harm versus being part of one; causal contribution versus moral responsibility; doing versus allowing; the blameworthiness of a group versus that of its members; what is true of my act after the fact versus what I could have known beforehand; and the size of the harm versus the strength of the complaint against me.

  Then the results it cannot contradict, so far as I can tell: that at the margin a single act often changes nothing; that small contributions nonetheless aggregate; that thresholds and non-linearities are real; that I cannot know other people's choices; and that whatever the theory demands must be livable by an ordinary person who cannot coordinate with strangers.

  For each requirement, give the consideration behind it. Then tell me which are genuine requirements and which are the prejudices of one camp — I would rather lose a requirement than keep a counterfeit one. Flag any subset that looks jointly unsatisfiable, and say which single requirement does the most to exclude candidate theories; if the most plausible answers survive the list only by quietly dropping something, name what they drop. A short scorecard would help — act-by-act consequentialist, what-if-everyone-did-it, participation in a wrongful practice, group-agency, and expressive or virtue-based answers — but keep it brief, since the requirements are what I actually need.

  Finally, tell me where your reasoning is most likely to fail and what argument or consideration would change your mind about which requirements belong on the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Individual moral contribution to collectively caused harm (e.g., climate change, voting, consumer choices).
      *   **Task:** Create a "specification" (requirements list) for an adequate theory *before* evaluating specific theories.
      *   **Components:**
          1.  **Cases to Get Right:** Ordinary threshold, epistemic uncertainty, market/norm substitution, identical reasoning (universalizability), asymmetry of scale (one large actor vs. many small).
          2.  **Distinctions to Maintain:** Difference-making vs. participation, causation vs. responsibility, doing vs. allowing, group vs. member blame, ex post vs. ex ante, harm size vs. complaint strength.
          3.  **Results Not to Contradict:** Marginal impact often zero, aggregation of small acts, real thresholds/non-linearities, ignorance of others' choices, livability for ordinary uncoordinated agents.
          4.  **Meta-Analysis:** Identify genuine requirements vs. prejudices, flag jointly unsatisfiable subsets, identify the most exclusionary requirement, note what plausible theories drop.
          5.  **Scorecard:** Briefly evaluate 5 specific theoretical approaches against the spec.
          6.  **Self-Correction:** Identify where my reasoning might fail and what would change my mind.
      *   **Tone:** Philosophical, rigorous, precise, analytical, avoiding premature commitment to a specific ethical framework.

  2.  **Drafting the Requirements (The "Spec"):**

      *   *Cases:*
          1.  *Threshold:* Voting/Tipping point. Why real? Physical systems often have breaking points (e.g., oxygen levels, election counts).
          2.  *Uncertainty:* Climate/Supply chains. Why real? We rarely have perfect data on aggregate behavior.
          3.  *Market/Norm Substitution:* Buying meat/Carbon offsets. Why real? Markets clear; if I don't buy, someone else might, or price adjusts slightly.
          4.  *Identical Reasoning:* Recycling/Boycotts. Why real? If everyone thinks "my act doesn't matter," the outcome is catastrophic; theory must guide action under symmetry.
          5.  *Asymmetry:* Corporate polluter vs. individual straw. Why real? Power and impact are vastly unequal in the real world.

      *   *Distinctions:*
          1.  *Difference-making vs. Participation:* Did I cause it, or just join in? (Crucial for overdetermination).
          2.  *Causation vs. Responsibility:* Can I be responsible without being the sole cause?
          3.  *Doing vs. Allowing:* Active harm vs. failing to prevent.
          4.  *Group vs. Member:* Is the collective an agent distinct from the sum of parts?
          5.  *Ex Post vs. Ex Ante:* Hindsight certainty vs. foresight probability.
          6.  *Harm Size vs. Complaint Strength:* Does a tiny contribution warrant a tiny blame or a categorical prohibition?

      *   *Results:*
          1.  *Marginal Zero:* Sometimes one vote/buy really changes nothing physically.
          2.  *Aggregation:* Many zeros can sum to a huge harm.
          3.  *Non-linearities:* Tipping points exist.
          4.  *Ignorance:* We can't know others' moves.
          5.  *Livability:* The theory can't demand impossible coordination or superhuman calculation.

  3.  **Meta-Analysis (Genuine vs. Prejudice & Tensions):**

      *   *Genuine vs. Prejudice:* Some "requirements" might just be intuitions from specific theories (e.g., strict consequentialism demands difference-making; deontology demands participation). I need to flag which are foundational and which are theoretical biases.
      *   *Joint Unsatisfiability:* The "Marginal Zero" result conflicts with "Aggregation" if we demand *causal difference-making* for responsibility. If my act makes no difference (Result 1), but the harm happens (Result 2), how am I responsible (Distinction 1)? This is the core paradox (The Inefficacy Objection).
      *   *Most Exclusionary:* The requirement that "an act can be wrong even if it makes no physical difference to the outcome" excludes pure act-consequentialism. Conversely, "responsibility requires causal difference-making" excludes participation views.
      *   *What Theories Drop:* Act-consequentialists often deny the moral weight of "participation" without impact. Participation views often downplay the "Marginal Zero" fact to preserve blame.

  4.  **Scorecard:**

      *   *Act-Consequentialism:* Fails on Threshold/Uncertainty (expects calculation). Drops "Participation without Difference."
      *   *Universalizability (Kantian/Rule):* Good on Identical Reasoning. Struggles with Market Substitution (rules vs. consequences).
      *   *Complicity/Participation:* Good on Distinctions. Struggles with Livability (implicates too much).
      *   *Group Agency:* Good on Asymmetry. Struggles with Member Blame (dissolves individual).
      *   *Virtue/Expressive:* Good on Livability. Struggles with Harm Size (focuses on agent, not outcome).

  5.  **Self-Correction/Epistemic Humility:**

      *   Where could I be wrong? I might be assuming a framework of "responsibility" that is too individualistic. Maybe the unit of analysis *should* be the group. Or maybe "moral matter" doesn't mean "blame."
      *   What changes my mind? A robust account of *expected utility* that solves the voting paradox without relying on magical pivotality, or a metaphysical account of *social ontology* that redefines causation.

  6.  **Refining and Polishing:**

      *   *Constraint Check:* The prompt asks for specific sections. I need to ensure I don't merge them.
      *   *Tone Check:* Keep it analytical, not preachy. The user wants the *spec*, not the *answer*.
      *   *Clarity:* Ensure the distinction between "Results" (empirical/practical facts) and "Distinctions" (conceptual categories) is clear.
      *   *Critical Edge:* Be honest about the contradictions. The "Inefficacy Problem" is the elephant in the room.

  7.  **Final Review against Prompt:**
      *   Cases with sentences? Yes.
      *   Distinctions listed? Yes.
      *   Results listed? Yes.
      *   Considerations behind each? Yes.
      *   Genuine vs. Prejudice? Yes.
      *   Jointly unsatisfiable flags? Yes.
      *   Most exclusionary requirement? Yes.
      *   What theories drop? Yes.
      *   Scorecard? Yes.
      *   Failure modes/Change of mind? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to solve the problem while listing the requirements. The user wants the *specification* to evaluate theories, not the evaluation itself (though the scorecard is requested at the end). I must maintain the tension.

      *(Refining the "Prejudice" section)*: I need to explicitly call out which requirements might be smuggled consequentialist or deontological assumptions. For example, "Livability" might be a pragmatic constraint, not a moral truth. "Marginal Zero" is an empirical claim that might be contested by expected value theorists.

      *(Refining the "Unsatisfiable" section)*: The trilemma is usually: 1. Responsibility requires difference-making. 2. Collective harm exists. 3. Individual acts make no difference. I need to frame this clearly.

      *(Final Polish)*: Ensure the language is precise ("ex ante" vs "ex post", "causal efficacy" vs "moral complicity").

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the specification for a theory of individual contribution to collective harm. It is structured to isolate the empirical, conceptual, and normative constraints before any theoretical machinery is applied.

  ### I. The Cases
  *The theory must deliver plausible verdicts on these five scenarios.*

  1.  **The Ordinary Threshold:** A river floods only when 1,000 buckets are poured in; you pour the 1,000th, but you do not know the count.
      *   *Why real:* Physical and social systems often have tipping points (e.g., viral transmission, election margins, ecosystem collapse) where the last unit triggers the disaster.
  2.  **The Epistemic Black Box:** You buy beef, but you cannot know if that purchase triggers an order for another cow or merely lowers the price for someone else.
      *   *Why real:* Supply chains and markets are opaque; agents rarely have access to the aggregate data required to calculate pivotality.
  3.  **The Market Substitution:** You refrain from buying a flight, but the seat is sold at a discount to someone who would not have flown otherwise, keeping total emissions identical.
      *   *Why real:* In clearing markets, individual restraint often shifts consumption rather than reducing aggregate production, decoupling personal restraint from physical outcome.
  4.  **The Symmetric Reasoners:** You and a million others face the same choice; if all reason "my act doesn't matter," the harm occurs; if all reason "my act matters," it is averted.
      *   *Why real:* Moral reasoning is often universalizable; if a principle justifies your act, it justifies everyone's in relevantly similar positions, creating a feedback loop.
  5.  **The Asymmetric Scale:** A corporation dumps 99% of the toxin; you and 1,000 neighbors dump the remaining 1%.
      *   *Why real:* Power and impact are distributed unequally; a theory must account for the small actor without erasing their agency or conflating it with the large actor's.

  ### II. The Distinctions
  *The theory must not collapse these conceptual categories.*

  1.  **Difference-Making vs. Participation:** Whether my act changed the outcome versus whether I joined a harmful practice.
      *   *Consideration:* Overdetermination (where the harm happens anyway) should not automatically absolve participation, nor should participation automatically imply causal efficacy.
  2.  **Causal Contribution vs. Moral Responsibility:** The physical link to the harm versus the normative link to blame or obligation.
      *   *Consideration:* One can be causally necessary but not responsible (coerced), or causally negligible but responsible (negligent).
  3.  **Doing vs. Allowing:** Actively causing harm versus failing to prevent it.
      *   *Consideration:* Moral intuition often treats commission and omission differently, even when outcomes are identical.
  4.  **Group Blame vs. Member Blame:** The culpability of the collective entity versus the culpability of the individuals composing it.
      *   *Consideration:* Distributing group guilt to members is not automatic; members may be powerless to change the group's output.
  5.  **Ex Post Fact vs. Ex Ante Expectation:** What the act actually achieved versus what the agent could reasonably have believed at the time.
      *   *Consideration:* Moral assessment usually tracks knowledge and intention, not just luck or hidden outcomes.
  6.  **Harm Size vs. Complaint Strength:** The magnitude of the damage versus the severity of the moral prohibition against the act.
      *   *Consideration:* Some acts are prohibited categorically regardless of scale (rights violations), while others are proportional to damage (cost-benefit).

  ### III. The Results
  *The theory cannot contradict these empirical or practical constraints.*

  1.  **Marginal Nullity:** At the margin, a single act often physically changes nothing.
      *   *Consideration:* In large systems, the signal-to-noise ratio is low; one vote or one ton of carbon rarely alters the trajectory measurably.
  2.  **Aggregation:** Small contributions sum to massive harms.
      *   *Consideration:* The total harm is undeniably the sum of individual inputs; denying this denies the reality of the harm.
  3.  **Non-Linearities:** Thresholds and feedback loops are real features of the world.
      *   *Consideration:* Systems are not always linear; ignoring tipping points leads to catastrophic miscalculation.
  4.  **Ignorance of Others:** I cannot know the choices of strangers.
      *   *Consideration:* Coordination is costly or impossible; moral theory must guide isolated agents, not just coordinated coalitions.
  5.  **Livability:** The demands must be executable by an ordinary person.
      *   *Consideration:* A theory that requires superhuman calculation or total withdrawal from society is practically void.

  ---

  ### IV. Meta-Analysis of the Specification

  **Genuine Requirements vs. Prejudices**
  *   **Genuine:** *Aggregation, Non-Linearities, Ignorance.* These are empirical facts about the world. *Ex Post vs. Ex Ante.* This is a foundational feature of moral agency (we judge choices, not luck).
  *   **Prejudices:** *Marginal Nullity.* This is often a consequentialist assumption that physical impact is the only metric that matters; participation theorists deny this is morally salient. *Livability.* This is a pragmatic constraint, not necessarily a moral truth; a true theory might demand the impossible, leaving us to fail. *Doing vs. Allowing.* Some frameworks (pure consequentialism) collapse this distinction entirely.

  **Jointly Unsatisfiable Subset (The Inefficacy Trilemma)**
  You cannot hold these three simultaneously without modification:
  1.  **Responsibility requires Causal Difference-Making** (Distinction 2 + Case 1).
  2.  **Marginal Nullity is True** (Result 1).
  3.  **Individuals are Responsible for Collective Harms** (Implied by the prompt's goal).

  If my act makes no difference (2), and responsibility requires difference-making (1), I cannot be responsible (contradicting 3). One must break.

  **The Most Exclusionary Requirement**
  **"Responsibility requires Causal Difference-Making."**
  This requirement kills the most plausible theories for collective harm. If you keep it, you must accept that in threshold cases where you aren't pivotal, you are innocent. If you drop it, you must explain how one can be responsible for something they did not change.

  **What Plausible Theories Drop**
  *   **Act-Consequentialism:** Quietly drops *Participation without Difference*. It insists that if you made no difference, you did no wrong, even if you participated in a massacre. It relies on *Expected Value* to salvage the intuition, effectively converting *Marginal Nullity* into *Probabilistic Impact*.
  *   **Complicity/Participation Views:** Quietly drop *Marginal Nullity* as morally decisive. They argue that joining a wrongful practice is sufficient for blame, regardless of physical impact.
  *   **Rule-Consequentialism/Universalizability:** Quietly drops *Ignorance of Others*. They assume that if *everyone* did X, harm would result, and judge the act based on that hypothetical, bypassing the actual causal chain.

  ### V. Scorecard

  | Theory | Handles Threshold? | Handles Uncertainty? | Handles Market Substitution? | Handles Symmetry? | Handles Asymmetry? | What It Drops |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Act-Consequentialist** | No (unless pivotal) | Yes (via Expected Value) | No (often justifies buying) | Yes | Yes | *Participation without Difference* |
  | **Universalizability** | Yes | No (relies on hypotheticals) | No (rules don't track market clearance) | Yes | Weak | *Actual Causal Consequences* |
  | **Complicity/Participation** | Yes | Yes | Yes | Weak | Yes | *Causal Difference-Making* |
  | **Group-Agent** | Yes | Yes | Yes | Yes | No (dissolves individual) | *Individual Member Blame* |
  | **Virtue/Expressive** | Yes | Yes | Yes | Yes | Yes | *Harm Size as Metric of Wrong* |

  ### VI. Failure Modes and Falsifiers

  **Where My Reasoning Is Most Likely to Fail**
  I have assumed that "moral mattering" must map onto a binary of "responsible/not responsible" or "wrong/permissible." This specification may fail if the correct output is not a verdict on the *act*, but a description of the *agent's relationship to the harm* (e.g., "tainted" but not "guilty"). I have also treated *Marginal Nullity* as a hard empirical fact, but expected-utility theorists argue that in a probabilistic world, the *chance* of being pivotal is never zero, meaning the expected impact is never null. If that mathematical move holds, the Inefficacy Trilemma dissolves.

  **What Would Change My Mind**
  1.  **A Robust Account of Expected Pivotality:** If you can demonstrate that for any collective harm (climate, voting), the probability of being pivotal $\times$ the magnitude of harm yields a significant expected value *without* relying on arbitrary probability distributions, I would drop the *Marginal Nullity* requirement.
  2.  **A Social Ontology of Causation:** If you can show that "causation" in social contexts is not physical but normative (i.e., by participating, I *do* cause the harm because the harm is constituted by our joint commitment), I would drop the distinction between *Causal Contribution* and *Participation*.
  3.  **The "Clean Hands" Counter-Example:** If you can present a case where an individual clearly made no difference, participated in no norm, yet we intuitively feel they are *blameless*, it would challenge the *Complicity* requirement. Currently, the spec leans toward finding guilt; a strong case for innocence in overdetermination would force a rewrite of the *Distinctions* section.
