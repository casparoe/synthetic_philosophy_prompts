answer: |-
  Good evening. Usually, at this point in the program, I would tell you how precious every creature is. I would talk about the sanctity of the wild and the unbroken chain of life. I would tell you that by protecting this land, we are saving lives.

  But looking around this room, I see people who know better. I see the birders who have found a chick fallen from a nest, cold and silent. I see our field ecologists, who spend their days measuring not just population growth, but predation rates, starvation, and disease. And I see the donors who have symbolically adopted owls, imagining a wise guardian in the woods, rather than a creature that will likely freeze or starve before its first winter ends.

  So, I want to try something different tonight. I want to acknowledge the tension that sits at the heart of what we do.

  We are here because we love nature. But we must also admit that nature is indifferent to the welfare of the individuals within it. Conservation, by its design, protects habitats. It ensures that ecosystems remain robust enough to support breeding populations. In practical terms, this means we are ensuring that more animals are born. And if the majority of wild lives are short, and end in pain, then one has to ask: when we prevent a forest from being bulldozed, are we preserving a sanctuary, or are we merely maintaining the machinery of suffering?

  It is a quiet question. I have asked it myself over the last year. If non-existence is not a harm to the animal that is never born, then our work does not "save" the unborn. It only burdens the living with the struggle to survive.

  I cannot stand here and tell you I have solved that equation. I don't think it can be solved. The arithmetic of survival is brutal, and our capacity to soften it is limited. If I told you that every owl we protect lives a full, peaceful life, I would be lying to you. If I told you that the total sum of suffering is reduced by our presence, I might be lying to myself.

  So, why are we here? Why fund the traps, the land deeds, and the nest boxes?

  Perhaps we are not here to balance the universe's ledger. Perhaps we are here because the alternative—indifference—is unbearable to the human spirit. We are not gods managing a metaphysical tally of pain versus pleasure. We are witnesses. When we protect a wetland, we are not necessarily guaranteeing happiness for the frogs. We are guaranteeing that the frogs *exist*, and that their existence is witnessed by us.

  There is a specific kind of honesty in that. It requires us to hold two conflicting truths at once: that the wild is magnificent, and that it is cruel. That we love the species, and that we grieve the individual.

  Our field team knows this. They handle the injured bird knowing it may not survive. They know that putting it back is a gamble, not a promise. And you, the donors, know this too. You give money not because you expect a return on investment, but because you refuse to look away from the complexity of life.

  We cannot stop the hawk from taking the mouse. We cannot stop the winter from killing the fledgling. But we can refuse to be the ones who pave over the field where the mouse hid. We can refuse to be the ones who cut down the tree where the hawk perched.

  That is the modest truth of our work. It is not a victory over suffering. It is a commitment to presence. It is an agreement to stand alongside the wild, in all its beauty and all its horror, and say: *I see you. You matter enough to be fought for, even if the fight has no clean ending.*

  Thank you for showing up to bear witness with us. Let's eat.
