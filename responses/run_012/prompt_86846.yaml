      *   **Conflict:**
          *   Neurologist: Says this is evidence of consciousness (Global Workspace Theory-ish: broadcasting = consciousness). Recommends continuing care.
          *   Cousin (Engineer/AI enthusiast): Says this is just functional response/reporting, not necessarily subjective experience (the "Hard Problem"). Claims we are projecting. Recommends skepticism.
