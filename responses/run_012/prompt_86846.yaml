      *   The scan confirms *presence*, but not *prognosis*. The aunt's desire for experimental treatment needs scrutiny regarding burden vs. benefit.
      *   I need to guide the user to see that the scan validates awareness enough to warrant treating him as conscious (pain management, dignity), but doesn't automatically mandate aggressive life-prolonging measures if those contradict his values.

