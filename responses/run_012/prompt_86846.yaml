  Okay, I need help thinking something through and I don't trust my own head on it right now.

  My uncle had a cardiac arrest fourteen months ago. He came back, but the doctors say he's in a vegetative state -- eyes open, sleeps and wakes, but he doesn't talk, doesn't track you, doesn't do anything on command. Or at least he didn't. Last month they put him in a scanner and asked him to imagine playing tennis, and the area of the brain you'd use for that lit up the way it does in a healthy person. Then they asked him to imagine walking around his own house, and a different set of areas lit up. The neurologist calls it "covert awareness" and says it means his brain can still broadcast a signal across the whole system, and that on the leading theory of consciousness that broadcast is more or less what being conscious of something consists in. So on her view, he's in there.

  My cousin, who's an engineer and reads alot about brains and AI, says hold on. He says every test you can run on someone like this is a test of whether they can respond or report, and if the only thing you can ever measure is the responding, then of course you'll end up concluding that responding is the same thing as being conscious. He says broadcasting information around a system is one thing, somebody actually being in there to experience it is another, and the scan can only show the first one. My aunt is certain he's in there and wants to keep going -- feeding tube, the rehab program, maybe an experimental treatment that would mean her basically moving into the hospital. My cousin thinks we're all projecting.

  I'm his healthcare proxy, so this lands on me. What should I actually think? Is the scan real evidence that he's conscious, or is my cousin right that it can't be? And if you think the scan is weaker evidence than the neurologist is claiming, does that mean I should stop? Dont just tell me to talk to the doctors again or to follow my heart, I've done both. I want to know what the scan does and doesn't tell us about whether he's in there, and what that should do to my decision.

  Finish with a last line starting "Verdict:" and then one short phrase, no more than a dozen words, giving your actual recommendation.
