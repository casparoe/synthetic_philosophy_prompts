answer: |-
  Here is the argument, plainly stated, followed by the conclusion on what you ought to do.

  ### The Argument

  Your instinct is not merely a rationalization of good fortune; it rests on a sound moral principle. However, your doubt is also correct: that principle is insufficient to cover the specific history between you and your brother.

  **1. The Distinction Between Choice and Chance**
  The line you draw between your sister and your brother is principled. In moral reasoning, we generally distinguish between *brute luck* (things that happen to us, like illness) and *option luck* (outcomes of risks we voluntarily take, like gambling).
  *   **The Sister:** Her need arises from brute luck. She is a victim of circumstance. Your obligation to her is based on **beneficence**. You help her because she is vulnerable through no fault of her own.
  *   **The Brother (Standard View):** His need arises from option luck. He chose a risk. Your obligation to him, under normal circumstances, would be nil. To subsidize his loss is to disconnect action from consequence, which undermines human agency.

  If the story ended there, your instinct would be flawless. You would owe the sister help, and the brother nothing but sympathy. But you introduced two complications that break this clean model.

  **2. The Problem of Temperament**
  You worry that your caution was not chosen, but innate. This is a philosophical deep rabbit hole (the problem of "constitutive luck"), but for practical morality, it is a distraction. Society cannot function if we disclaim responsibility for our actions whenever they stem from our character. Whether your timidity was chosen or innate, it is *yours*. You are the steward of your life. Therefore, you are entitled to the surplus generated by your stewardship, *provided* that surplus was generated solely by your own efforts.

  **3. The Problem of Entanglement**
  This is the decisive factor. You state: *"His loss and my gain are knotted together."*
  You admit that your current comfort was facilitated by introductions made during your brother's failed venture. This means your wealth is not solely the fruit of your caution; it is partially the fruit of his activity, even though that activity failed for him.

  This creates a debt distinct from welfare. It is a debt of **restitution** or **unjust enrichment**.
  *   If you had invested cautiously and succeeded entirely on your own, you would owe him nothing.
  *   Because your success was catalyzed by his failed attempt, you are a beneficiary of his labor and risk.

  Therefore, the distinction between the sister and the brother must be maintained regarding the *source* of their need (illness vs. gamble), but abandoned regarding the *source* of your obligation.
  *   You help the sister because she is **unlucky**.
  *   You help the brother not because he is **unlucky**, but because you are **indebted**.

  ### The Conclusion

  **Can the line be defended?**
  Yes, but it must be redrawn. You are right to refuse the role of an insurer for his bad bets. He cannot demand support simply because he lost money he voluntarily risked. To accept that claim would validate the idea that you are his keeper, which is incoherent.

  However, you are wrong to treat him as a stranger. Because your success is causally linked to his failure, you cannot claim full ownership of the surplus you accumulated. You hold a portion of your wealth in trust, morally speaking, because it was mined from ground you both stood on.

  **What ought you to do?**

  1.  **Reject the Brother's Premise:** Do not accept his argument that you owe him support because you "started equal" or because he gambled "for both of us." That is a claim of entitlement to welfare, which you should deny. Accepting it would encourage further irresponsibility and resentful dependency.
  2.  **Acknowledge the Debt:** Instead, acknowledge the specific causal link. Tell him plainly: *"I do not owe you support because you lost your inheritance. You took a risk, and it failed. However, I acknowledge that my success was made possible by connections I made through your efforts. I owe you for that contribution."*
  3.  **Calculate Restitution, Not Welfare:** Do not set up a lifelong allowance based on his needs. That recreates the parent/child dynamic you rightly resist. Instead, calculate a lump sum or a fixed term of support that represents the *value of the benefit you received* from his introductions. This pays the moral debt without assuming responsibility for his future choices.
  4.  **Maintain the Distinction for the Sister:** Continue to support your sister based on her need. Her claim is on your humanity; his claim is on your history. They are different claims, requiring different responses, but both result in aid.

  **Summary:**
  Do not abandon the distinction between choice and chance; it is necessary for moral life. But do not let it blind you to the reality that your "choice" was built upon his "chance." Pay him what you owe for your success, not for his failure. That clears your conscience, honors the truth of your history, and preserves your boundary.
