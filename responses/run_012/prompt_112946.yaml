answer: |-
  The doctor presses his thumb into the soft meat of my shin, just below the knee. He pushes hard enough to bruise. He watches my face.

  "Scale of one to ten," he says.

  "Seven," I say. "Maybe a seven and a half. It's sharp. Throbbing."

  He doesn't let up. He's waiting for the wince, the intake of breath, the leg jerk. Nothing comes. I watch his thumb whiten where it presses my skin. I observe the pressure, the specific geometry of the discomfort, but there is no command to move away. There is no *no*.

  "My face isn't moving," I offer, helpful.

  "I see that," he says. He lets go. He writes something on his clipboard. "Pain asymbolia. Likely a small lesion in the insula. We'll monitor."

  He closes the folder. He doesn't tell me what it means, and I don't ask. I pull my sock down. The spot he pressed is already turning pink, but the memory of the pressure is already fading into neutral data.

  ***

  Two days later, I am making dinner. Sarah is at work. I reach for the cast iron skillet to move it off the burner. My palm settles on the handle. It is hot. I feel the heat transfer into the skin, the rapid escalation toward burning. I know, intellectually, that tissue is damaging. I smell it a second later—protein singing, hair curling.

  I lift my hand and look at it. A blister is already rising on the heel of my palm, shiny and tight.

  I turn off the burner. I run my hand under the tap. The water is cold. I feel the cold. I feel the heat residual in the skin. I stand there for a minute, watching the water hit the burn, until I remember I need to eat. I dry my hand. I wrap it in a towel. I finish cooking the chicken. It tastes fine.

  ***

  The ER waiting room is fluorescent and humming. I hold my wrapped hand in my lap. When the nurse calls my name, she leads me to a curtained bay. She unwraps the towel. She sees the blister, the redness spreading up my wrist.

  "On a scale of one to ten," she says, pen hovering over her chart. "How much pain are you in?"

  "Nine," I say.

  She looks at me. She looks at my heart rate monitor, which is steady. She looks at my face. I am not grimacing. I am not shifting in the chair.

  "A nine," she repeats. "And you're... okay?"

  "It's a nine sensation," I say. "It's very intense. It's damaging tissue. But I'm not suffering."

  She writes *9* on the chart. She caps the pen. She looks like she wants to argue with the math. "Do you need morphine?"

  "No," I say. "Can I go home? I have to feed the dog."

  She hesitates. She knows the protocol. Pain equals suffering. Suffering equals treatment. I am breaking the link. She calls the doctor. The doctor comes in, looks at the hand, looks at me, signs the discharge papers. I leave with a tube of ointment. In the parking lot, the sun is bright. The hand pulses. It is interesting, like watching a tide come in.

  ***

  Sarah knows something is wrong before I tell her. She sees the bandage. She sees the calm.

  We are in bed. The lights are off. She is lying on her side, facing me.

  "Does it hurt?" she asks.

  "Yes."

  "Does it hurt *hurt*?"

  "It hurts exactly as much as it should. The nerves are firing correctly."

  She reaches out and touches my cheek. Her hand is warm. "I mean, does it bother you?"

  "No."

  She pulls her hand back. She's looking for the flinch in my voice, the tension in my shoulder. There isn't any. We had an argument last week about money. I remember the words we said. I remember the tightness in my chest, the acidity in my stomach. I recognized those as signs of anger and stress. But I didn't feel the urge to fix it. I didn't feel the sting of her disappointment. I just waited for the conversation to end.

  "Is it just the physical stuff?" she asks now. Her voice is small in the dark. "If I told you I was leaving... would that hurt?"

  I consider this. I search my body for the drop, the hollow feeling, the panic. I simulate the scenario. I know the concept of loss. I know I love her. But the threat of it lands softly, like a pillow dropped on a carpet.

  "I would miss you," I say. "I would be lonely. But it wouldn't... wound me."

  She turns over. She faces the wall. "I don't know how to be married to someone who can't be wounded."

  "I'm still here," I say.

  "You're here," she says. "But you're not anywhere."

  ***

  A month later, I meet Mark for a beer. He knows about the stroke, the knock, the thing the doctor named once and then ignored. He knows about the hand.

  "You know," Mark says, leaning on the bar. "In a way, you're lucky."

  "Lucky," I say.

  "Think about it. Pain is free now. You can do anything. You can work through anything. You're invincible."

  He taps his glass against mine. He thinks this is a superpower. He thinks the absence of the *ouch* is a gift.

  I take a sip. The beer is cold. It hurts my sensitive tooth. I feel the sharp zing in the jaw. I note it. I do not stop drinking.

  "Is it luck?" I ask.

  "Sure. No more suffering."

  "I still feel the damage," I say. "I know when I'm breaking. I just don't care."

  "Same thing."

  "No," I say. "Pain is a signal. It's a stop sign. The feeling is the light. The suffering is the brake. I still see the light. I just cut the brakes."

  Mark laughs. "Philosophical. I'd take it."

  "Would you?"

  "In a heartbeat. Who wants to hurt?"

  I look at my hand. The skin is healed, but the texture is different. Shiny. I press my thumb against it. I feel the pressure. I know that if I press harder, I will break the skin. I know I should stop. I don't stop. I press until I see a pinpoint of blood.

  "If there was a pill," I say. "And it took away the bother, but left the sensation. Would you take it?"

  "Sure."

  "Even if it took away the bother of everything? Sadness. Grief. Fear."

  Mark stops smiling. He looks into his beer. "That's different."

  "Is it?"

  "That's... that's being human. The bother is the point."

  "Then it's not a cure," I say. "It's an illness."

  ***

  I sit on the porch. It is evening. The air is cooling. I can feel the cold on my arms. I know I should go inside before I get too cold, before my fingers stiffen, before the risk of frostbite becomes real. I understand the risk. I can calculate the damage.

  I stay outside.

  I wonder if the badness is in the feeling, or in the minding. I wonder if I am healed or if I am broken in a way that doesn't show up on an MRI. I wonder if Sarah will come out here. I wonder if I want her to.

  The cold gets deeper. It moves into the bones. It is a very clear signal. It is a nine. It is a ten. It is purely information.

  I sit there and let it happen. I am fine. I am not fine. I am here. I wait to see if I freeze. I wait to see if I care.
