answer: |-
  Good evening, everyone. Thank you for joining us here, one last time in this configuration.

  We gather to honor the work we have shared within these walls. For those of us currently studying here, this department has provided the structure for our days and the context for our ideas. For our faculty and staff, it has been the home of your scholarship and your mentorship. For our alumni and families, it has been a source of pride and a connection to this university.

  In three weeks, the administrative structure of the university will shift. Next fall, the new School of Humanities will admit our students. The School will hold the budget that currently bears our name. The School will award the degrees that currently bear our name. Yet, the people in this room will remain the same people. The faculty who have guided us will continue to guide us. The friendships formed in our seminars will persist beyond this semester.

  We stand at a threshold where descriptions become difficult. Some things about us will clearly continue. Other things will clearly change. What matters most, however, is not the boundary line itself, but the substance on either side of it. The arguments we have had, the papers we have written, and the support we have offered one another are facts that no administrative change can alter. Those achievements belong to us, regardless of how the university organizes itself tomorrow.

  We know that institutions are defined by their practices. As long as we continue to practice the kind of inquiry we value here, the spirit of this place endures. Whether that spirit resides in a department or a school is a question for the catalogues. The reality of our collaboration is a question for us.

  So, let us acknowledge the transition without fearing it. We are not losing the work we have done. We are not abandoning the standards we have upheld. We are simply carrying them into a new context.

  Please raise your glasses. To the work we have done, and to the work that awaits us.

  ***

  **Note to Self: What I Cut and Why**

  1.  **"Tonight marks the end of the department."**
      *   *Commitment:* This would be false on any admissible sharpening where the department is considered to survive the merger (e.g., if "department" is defined by faculty and curriculum rather than budget). It violates the supervaluationist constraint.

  2.  **"We are simply changing our name; nothing else matters."**
      *   *Commitment:* This treats the new school as a straightforward continuation. It would be false on sharpenings where budgetary autonomy is essential to being a "department." It also risks denying the ontological significance your epistemicist friend believes exists.

  3.  **"It is unclear whether we still exist."**
      *   *Commitment:* This explicitly signals the seminar topic. It implies vagueness is ontological or semantic, which an epistemicist rejects (they believe it is merely epistemic). It breaks the "no trace of a seminar" rule.

  4.  **"The boundary between department and school is arbitrary."**
      *   *Commitment:* An epistemicist believes the boundary is sharp and non-arbitrary, even if unknown. Asserting arbitrariness would make this sentence false on their view.

  5.  **"We are both ending and continuing."**
      *   *Commitment:* This sounds like a contradiction (A and not-A). While a supervaluationist might accept "It is not true that we end and it is not true that we continue," asserting both positively violates classical logic constraints your audience (and your friend) would expect in a formal toast.
