      *   *Section 2: The Breakages (The Four Pressures).*
          *   *Intimacy vs. Scheme:* The state is a cooperative scheme, not a kinship network. This shifts the obligation from "love" to "fair play."
          *   *Permission vs. Duty:* Families allow partiality; States often demand it as justice. The analogy confuses the two.
          *   *Coercion:* States tax adults. Families support dependents. This changes the moral texture from "care" to "reciprocity."
          *   *Boundaries:* Family boundaries are thick (blood); State boundaries are thin (lines). Naturalization proves the boundary is permeable, undermining the "shared history" exclusivity.
      *   *Section 3: Survival of the Conclusion.* Does it survive? Maybe as "assigned responsibility."
