answer: |-
  This audit examines the "Nation as Household" analogy not to settle the political debate, but to test the structural integrity of the metaphor itself. Given your situation, the stakes are clear: if the analogy holds, your mother's accusation of betrayal has a logical foothold; if it breaks, her view relies on a category error.

  ### 1. The Correspondence and the Justificatory Work

  To understand where the argument derives its force, we must map the terms. In the reading group's formulation ("you do not feed the neighbour's child before your own"), the mapping is as follows:

  *   **The Parent:** The State (or the collective citizenry acting through the state).
  *   **The Child:** The Citizen (the recipient of welfare, protection, and priority).
  *   **The Household's Resources:** The tax base, public goods, and territorial capacity.
  *   **Adoption/Marriage:** Naturalization (your specific case) and immigration.
  *   **Neighbouring Households:** Foreign states and their populations.

  **What does the justificatory work?**
  Merely stating that a nation *is* a household is decorative. The work is done by two specific features of the parent-child relationship:
  1.  **Special Responsibility:** Parents are causally and morally responsible for their children's existence and vulnerability in a way they are not for neighbors' children. This generates a *priority of obligation*.
  2.  **Scarcity and Proximity:** The household has limited food and a single table. You cannot feed everyone, so you must draw a line.

  The analogy argues that because the State stands to Citizens as Parents stand to Children, the State is permitted (or required) to prioritize Citizens over Foreigners when resources are scarce. The "Household" boundary is the moral container that legitimizes this exclusion.

  ### 2. The Breakages

  The analogy fails not because nations aren't literally families (a decorative disanalogy), but because the moral mechanics of the family do not transfer to the mechanics of the state in ways that sustain the conclusion. Here are the four pressures you identified.

  #### Pressure 1: Intimacy vs. Scheme (Co-nationals vs. Co-citizens)
  **The Break:** A family's partiality rests on intimate, face-to-face relationships or deep biological/adoptive bonds. A modern state is an anonymous cooperative scheme among strangers.
  **The Threat:** This breakage threatens to sever the link between *affection* and *obligation*. If the obligation comes from intimacy, the state cannot claim it (you do not know your compatriots). If the obligation comes from participation in a scheme, the "family" analogy is the wrong picture; it should be a "firm" or "union."
  **Implication for you:** This distinguishes between *co-nationals* (cultural kin, which your mother values) and *co-citizens* (fellow participants in a legal scheme, which the state values). The family analogy supports priority for co-nationals (blood/history). It does not support priority for co-citizens (legal status). Since you are a co-citizen but not a co-national in your mother's eyes, the analogy supports her view (blood matters) but undermines the state's view (law matters). If the state is a household, naturalization is "adoption." If adoption creates full moral equality with biological children, your mother's claim fails. If adoption is second-best, her claim holds. The analogy cannot decide this; it merely highlights that the state claims the former while your mother claims the latter.

  #### Pressure 2: Permission vs. Duty
  **The Break:** In morality, families are usually granted a *permission* to be partial (you *may* feed your child first), not a *duty* to be exclusionary (you are not *obligated* to let the neighbor's child starve if you have surplus). However, immigration restrictions and welfare chauvinism often rely on a *duty* to prioritize (the state *must* protect its own, even at the cost of outsiders).
  **The Threat:** The analogy supports the *permission* to favor compatriots, but it does not support the *duty* to exclude strangers. A parent who feeds a neighbor's child after feeding their own is charitable, not unjust. A state that admits refugees is often accused by nationalists of betraying its citizens. The family analogy cannot generate the strong exclusionary conclusion your friend wants. It justifies favoritism, but not necessarily the hardening of borders against the needy.

  #### Pressure 3: Internal Justice and Coercion
  **The Break:** The household is a site of care for dependents; the state is a site of coercion among adults. Parents feed children who cannot feed themselves. States tax adults who can.
  **The Threat:** This is the most damaging breakage for the "duty of care" argument. If citizens are "children," they are infantilized and lack agency. If citizens are "adults," the resource transfer is not "feeding" but "pooling." In a family, resources flow down (parent to child). In a state, resources flow laterally and cyclically (taxpayer to state to beneficiary).
  **Implication:** You are not being "fed" by the state; you are contributing to a pool you are also entitled to draw from. This makes the relationship reciprocal, not paternalistic. If it is reciprocal, the obligation is based on *fair play*, not *kinship*. This undermines the idea that you have "changed sides." You have simply joined a different cooperative scheme. The "betrayal" narrative relies on the family model (loyalty to blood); the "contract" model (loyalty to law) renders it incoherent.

  #### Pressure 4: The Boundary Problem
  **The Break:** Family membership is largely given (biology) or deeply vetted (adoption). State membership is drawn by historical accident and policy.
  **The Threat:** The family analogy assumes the boundary is natural. "Why feed this child and not that one?" is answered by "This one is mine." But "Why is this citizen mine and that one isn't?" is answered by "Because we drew a line here."
  **Implication:** Because you naturalized, you proved the boundary is permeable. If the boundary is policy, not biology, then the "special obligation" is contingent on that policy. If the policy changes, the obligation changes. The family analogy tries to make the boundary feel sacred and fixed. Your experience proves it is administrative. This weakens the argument for restricting entry: if I can join the household through effort and residency (adoption), why is the door locked against others similarly situated? The analogy hides the arbitrariness of the border; your life reveals it.

  ### 3. Does the Conclusion Survive?

  The strong conclusion—that compatriots have a unique moral claim on one another that justifies excluding strangers—does not survive the audit of the household analogy. The analogy collapses under the weight of coercion, anonymity, and the arbitrariness of borders.

  However, a **weaker conclusion** survives if we shift the justification from *relationship value* to *assigned institutional responsibility*.
  We might argue that while all humans have equal moral worth, we cannot care for all humans directly. We assign responsibility for specific humans to specific institutions to ensure *someone* cares for *everyone*. I am responsible for my child; the French state is responsible for French citizens; the South African state for South Africans.
  In this view, your naturalization is not a betrayal of your mother's household, but an acceptance of responsibility within a new administrative unit. You are not "changing sides" in a war; you are moving your registration to a different provider of public goods. This defends partiality not as a moral preference for "our own," but as a division of labor to ensure global coverage.

  ### 4. Alternative Analogies

  If the household analogy is too intimate and hierarchical, other metaphors may carry the argument further without the same breakages:

  *   **The Insurance Pool:** Citizens pay premiums (taxes) to insure against risk (unemployment, illness, old age).
      *   *Pros:* Handles the coercion/reciprocity well. Explains why you can't just join when sick (pre-existing conditions/waiting periods).
      *   *Cons:* Insurance is voluntary; citizenship is often not. It also lacks the emotional resonance of "care."
  *   **The Club:** A private association with rules for entry and benefits for members.
      *   *Pros:* Explains the right to exclude and the value of shared rules.
      *   *Cons:* Clubs are voluntary and often discriminatory. States have human rights obligations clubs do not.
  *   **The Lifeboat:** A scenario of extreme scarcity where taking on more passengers sinks the boat.
      *   *Pros:* Justifies hard borders in crises.
      *   *Cons:* Implies the state is always in emergency mode. Most migration happens when the boat is stable.
  *   **The Neighborhood:** You have special duties to those near you (noise, safety, upkeep) that you don't have to people far away.
      *   *Pros:* Captures proximity and shared infrastructure without the "parent/child" hierarchy.
      *   *Cons:* Neighborhoods don't usually have hard borders or passports.

  **Recommendation:**
  For your specific situation, the **Insurance/Cooperative Scheme** analogy is the most robust defense against the accusation of betrayal. It reframes citizenship not as a loyalty oath to a bloodline (which your mother demands), but as a commitment to a system of mutual contribution and protection (which the state offers). You have not abandoned your family; you have simply purchased a policy in a different jurisdiction because you live there. The "duty" you owe your compatriots is not the duty of a son to a father, but of a partner to a partner: to uphold the rules of the scheme you both benefit from.

  This does not solve the emotional rift with your mother, for she is operating on the Household analogy (blood is thick), while you are living the Cooperative analogy (law is binding). But philosophically, the Household analogy is too brittle to bear the weight of modern citizenship. It breaks at the border, and it breaks at the ballot box. You are not a child who has run away; you are an adult who has signed a new contract.
