      *   **Trigger:** A reading group discussion used the "Nation as Household" analogy (citizens = family members, state = household, partiality = feeding your own kids first).
      *   **Task:** Audit the analogy. Do *not* rehearse standard liberal-nationalist vs. cosmopolitan debates (the user knows them).
      *   **Specific Requirements:**
          1.  Map the correspondence (Parent, Child, Resources, Adoption/Marriage, External Relations). Identify which parts do the *justificatory work* vs. mere decoration.
          2.  Identify where the mapping breaks. Focus on breakages that threaten the conclusion (compatriots have special claims over strangers, justifying favoritism and border restrictions). Ignore decorative disanalogies.
          3.  Address four specific pressures:
              *   Relationship type (Intimate vs. Anonymous/Coercive; Co-nationals vs. Co-citizens).
              *   Permission vs. Duty (Families license partiality; States often claim a duty to prioritize).
              *   Internal Justice/Coercion (Families have hierarchy/abuse issues; States coerce/tax adults).
              *   The Boundary Problem (Biology/History vs. Policy/Drawing lines).
          4.  Conclusion: Does the conclusion survive in a weaker form (e.g., institutional responsibility)? Suggest better analogies (hospitality, insurance, lifeboat, club, neighborhood).

  2.  **Deconstruct the "Nation as Household" Analogy:**
      *   *Correspondence:*
          *   Parent $\rightarrow$ State/Government (or perhaps the "Founding Fathers"/Constitution as ancestors).
          *   Child $\rightarrow$ Citizen.
          *   Resources $\rightarrow$ Tax revenue/Public goods.
          *   Adoption/Naturalization $\rightarrow$ Immigration/Citizenship laws.
          *   Neighbors $\rightarrow$ Other nations/Foreigners.
      *   *Justificatory Work:* The core work is done by the *Parent-Child* bond (special obligation based on intimacy/dependency) and the *Scarcity* element (limited food/resources). The "Household" boundary defines who counts as "own."

  3.  **Analyze the Breakages (Focusing on the Four Pressures):**

      *   *Pressure 1: Relationship Type (Intimacy vs. Anonymity/Coercion).*
          *   Family: Face-to-face, emotional, biological/adoptive bond.
          *   State: Anonymous, bureaucratic, coercive.
          *   *Threat:* If the obligation comes from *love/care*, the state fails. If it comes from *cooperation/coercion*, the family analogy fails. Also, does it justify favoring *co-nationals* (culture) or *co-citizens* (legal status)? The family analogy leans toward blood/culture, but modern states are civic. This creates tension for the naturalized citizen (are they "adopted" or "married in"?).
          *   *Impact:* Weakens the "special attachment" argument for large states.

      *   *Pressure 2: Permission vs. Duty.*
          *   Family: You *may* feed your kid first. You aren't usually morally condemned for not feeding the neighbor's kid *if* your own are fed, but you aren't strictly *obligated* to neglect the neighbor if your kid is full. Actually, the stronger point: Parents have a *duty* to their kids, but they have *permission* to prioritize them.
          *   State: The argument usually tries to prove the State *must* prioritize citizens (Duty) or that Citizens *must* prioritize each other.
          *   *Threat:* Families operate on partiality as a *prerogative*. States operate on justice as an *obligation*. If the state claims a *duty* to exclude strangers to save resources for citizens, that's stronger than the family's *permission* to prioritize. The analogy supports permission better than duty.

      *   *Pressure 3: Internal Justice & Coercion.*
          *   Family: Historically patriarchal, private sphere, non-consensual (for kids). Adults aren't taxed by parents.
          *   State: Public sphere, democratic (ideally), coercive (taxation, laws), applies to adults.
          *   *Threat:* The "care" model hides the "coercion" model. If the state is a parent, citizens are children (infantilization). If citizens are adults, the resource pooling is contractual/coercive, not nurturing. This undermines the "duty of care" justification. It looks more like a protection racket or a mutual insurance scheme.

      *   *Pressure 4: The Boundary Problem.*
          *   Family: Boundaries are mostly biological or clear legal adoption. Hard to change.
          *   State: Boundaries are arbitrary lines on a map. Naturalization is possible (as the user experienced).
          *   *Threat:* Why *this* household? If I can join the household (naturalization), the "blood/history" justification weakens. If the boundary is drawn by policy, why is the obligation tied to the boundary rather than need? The family analogy assumes the boundary is natural/given. The state's boundary is contingent. This is a major threat to the "restricting entry" conclusion.

  4.  **Synthesize the "Justificatory Work":**
      *   What actually carries the weight? It's the *scarcity* combined with *special responsibility*. The parent is *responsible* for the child's existence/welfare in a way they aren't for the neighbor.
      *   In the state, are citizens responsible for each other's existence? Only via the social contract.

  5.  **Drafting the Response (Iterative refinement):**

