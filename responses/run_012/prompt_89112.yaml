answer: |-
  **The Logic of Demand in the White Horse Dialogue**

  My thesis is this: the *White Horse Dialogue* is not a trick based on linguistic ambiguity, nor is it a failed attempt at ontology. It is a coherent argument about the logic of specification. The dialogue divides into two distinct stretches. The first, concerning shape and color, is staging; it establishes the semantic components but does not carry the logical weight. The second, concerning "seeking" (*qiu*), is the actual argument. The defender's conclusion—that a white horse is not a horse—is valid if and only if we understand the subject of the debate not as physical animals, but as the conditions under which a name satisfies a request. The distinction at work is not between identity and membership, but between *truth conditions* (what makes a name applicable to an object) and *demand conditions* (what object satisfies a request made using that name).

  It is settled that the text contains these two stretches and that the conclusion is "a white horse is not a horse." It is contested whether this conclusion is a sophistical error or a profound logical point. I defend the latter.

  **Against the Ambiguity Reading**

  The standard reading holds that the dialogue trades on an ambiguity in the copula "is not." On this view, the objector understands "is not" as non-membership (a white horse is not a member of the set of horses), which is false. The defender, however, allegedly surreptitiously shifts to non-identity (the concept 'white horse' is not identical to the concept 'horse'), which is true. The reading concludes that the defender wins only by equivocation.

  I argue this reading fails because it renders the "seeking" stretch redundant. If the point were merely that the concept 'white horse' differs from 'horse', the shape/color stretch suffices. The seeking stretch introduces a normative element: what one *may* or *may not* deliver. The ambiguity reading treats this as mere illustration. I contend it is the proof. The defender is not arguing about the static relationship between concepts, but about the dynamic relationship between a speaker's intent and a responder's obligation. When the defender says "a white horse is not a horse," he means "the specification 'white horse' is not interchangeable with the specification 'horse' in the context of a demand." The "is not" signifies non-equivalence of function, not non-membership in a class. The ambiguity reading goes wrong by assuming the debate is about what *exists*, when the text shows the debate is about what *answers*.

  **The Argument from Seeking**

  In the second stretch, the objector argues: if there are white horses, you cannot say there are no horses; therefore, having a white horse is having a horse. The defender replies: if you seek a horse, a yellow or black horse suffices; if you seek a white horse, they do not. If 'white horse' were 'horse', what is sought would be the same. It is not the same. Therefore, 'white horse' is not 'horse'.

  This is the core. The defender isolates the context of *seeking*. In this context, the extension of a term is constrained by the modifier. The set of acceptable responses to "seek a horse" includes {white, yellow, black}. The set of acceptable responses to "seek a white horse" includes {white}. Since the sets of acceptable responses differ, the demands differ. If the demands differ, the terms functioning as the objects of those demands are not equivalent. The conclusion "a white horse is not a horse" is shorthand for "the term 'white horse' does not function identically to the term 'horse'."

  This makes the argument good. It avoids the trap of denying that white horses are animals. It affirms that while a white horse *is* an animal, the *name* 'white horse' imposes a constraint that the *name* 'horse' does not. The objector insists on the ontological fact (white horses exist within the group of horses). The defender insists on the pragmatic fact (the request 'white horse' restricts the satisfaction conditions). They are answering different questions. The objector asks, "Is the object included?" The defender asks, "Is the specification equivalent?" The text privileges the defender's question because the dialogue is about *names* (*ming*), not *actualities* (*shi*).

  **Task 1: The Opacity of Seeking**

  The strongest objection to my reading concerns the opacity of intentional contexts. "Seeking" creates an opaque context: one can seek the Morning Star without seeking the Evening Star, even if they are identical. Therefore, the failure of 'white horse' and 'horse' to substitute in the context of seeking shows only that the expressions differ in sense, not that what they name differs. If I accept this, does the defender's inference collapse? Does he infer a difference in the named object from a difference in the name?

  I accept the point about opacity, but I deny that it undermines the argument. The objection assumes the defender is trying to prove something about the *objects* (the animals). I argue the defender is proving something about the *names*. In opaque contexts, the *names* are the primary relata. If I say "I seek X" and "I seek Y," and these are not equivalent, it is valid to conclude "X is not Y" *provided X and Y are understood as the descriptions under which the object is sought*.

  The defender survives the opacity objection because he does not claim the animal is not an animal. He claims the *demand* specified by "white horse" is not the *demand* specified by "horse." Opacity confirms this: because seeking is sensitive to description, the description 'white horse' carries a weight that 'horse' does not. The defender infers a difference in the *normative force of the name* from the failure of substitution. This inference is valid. The objection only holds if we assume the conclusion must be ontological. If we recognize the conclusion is semantic or pragmatic, the opacity of seeking is not a bug; it is the feature that makes the argument work. The argument requires a notion of seeking where the satisfaction conditions are determined by the intension of the term, not just its extension. This is precisely the notion the text employs.

  **Task 2: A Parallel Argument**

  To test this reading, I construct a parallel argument with a non-color modifier and a non-biological head.

  *Premise 1:* If one seeks a battery, a dead battery may not be delivered (it will not power the device).
  *Premise 2:* If one seeks a dead battery, a live battery may not be delivered (it is not suitable for recycling or specific testing).
  *Premise 3:* If 'dead battery' were 'battery', what is sought in the two cases would be the same.
  *Premise 4:* What is sought is manifestly not the same.
  *Conclusion:* A dead battery is not a battery.

  Does this argument go through? In ordinary ontology, the conclusion is false; a dead battery is a subset of batteries. However, under my reading of the *White Horse Dialogue*, the argument is valid. In the context of functional demand, "battery" implies "functional power source," while "dead battery" implies "non-functional cylinder." The satisfaction conditions for the request diverge.

  That the parallel argument feels intuitively wrong in ordinary conversation but logically robust in a pragmatic context shows that my reading is right about the *structure* of the *White Horse Dialogue*. The dialogue is not about biological taxonomy; it is about the logic of specification. The discomfort we feel with "a dead battery is not a battery" mirrors the discomfort the objector feels with "a white horse is not a horse." Both objections arise from conflating the *object* with the *specification*. The fact that the parallel argument holds in a functional context (e.g., procurement, engineering) confirms that the *White Horse Dialogue* is operating in a similar functional context of naming and requesting. It shows the reading is not ad hoc; it applies to a general logic of modifiers and demands.

  **Task 3: Falsification Conditions**

  For my reading to be mistaken, specific features of the text itself would have to be true. It is not enough that later commentators treat the text as ontology; the text must force that hand.

  First, if the defender explicitly identified the subject of the conclusion as the *physical animal* rather than the *name*, my reading would fail. For example, if the text read "The white animal itself is not the horse animal itself," distinguishing the *shi* (actuality) rather than the *ming* (name), the pragmatic reading would collapse. The text, however, consistently frames the debate around what is "permitted" (*ke*) in speech and request.

  Second, if the defender conceded in the seeking stretch that the *object* delivered is the same but maintained the distinction only in language, my reading would be weakened. But the defender insists that what is *sought* (*suo qiu*) is different. This focuses on the intentional object of the request, not the physical referent.

  Third, if the first stretch (shape/color) claimed that color and shape are ontologically separate substances such that their combination creates a new ontological entity, my reading would be mistaken. But the first stretch claims only that the *designations* are separate. The text says "'Horse' is that by which we designate the shape; 'white' is that by which we designate the color." This is about designation, not metaphysics.

  Therefore, the features of the text that bear on this question are the consistent use of verbs of permission and seeking, and the focus on designation. If the text lacked the seeking passage entirely, my reading would be untenable; the shape/color stretch alone is too easily read as metaphysical. It is the seeking passage that anchors the pragmatic interpretation.

  **Settled and Contested Points**

  I must be clear about the dialectical landscape.

  It is **settled** that the text attributes the argument to the School of Names, that it consists of the shape/color distinction followed by the seeking argument, and that the conclusion is the paradoxical "white horse is not horse." It is also settled that the objector argues from existence ("if there are white horses...") and the defender argues from specification ("if you seek...").

  It is **contested** whether the seeking argument is the logical core or merely rhetorical support for the shape/color argument. Many hold the shape/color argument is the primary metaphysical claim. I defend the minority line that the seeking argument is the primary logical claim, and the shape/color argument is merely semantic groundwork.

  It is **contested** whether the dialogue is sophistry. The consensus often leans toward viewing it as a linguistic trick based on ambiguity. I argue explicitly against this consensus. I hold that the argument is valid within a pragmatic framework.

  It is **open** whether the School of Names intended this pragmatic reading or a metaphysical one. The text itself supports the pragmatic reading more strongly, but the historical intent remains a matter of reconstruction. My argument rests on the text as it stands, not on reconstructed intent.

  In sum, the *White Horse Dialogue* is not a denial of biological reality. It is an assertion of semantic precision. When we ask for a white horse, we are not asking for a horse simpliciter; we are asking for a horse under a specific description that excludes other horses. To say "a white horse is not a horse" is to say "the description 'white horse' is not equivalent to the description 'horse'." The seeking stretch proves this by showing the descriptions yield different results. The ambiguity reading fails because it ignores this functional difference. The opacity objection fails because it assumes an ontological conclusion where a pragmatic one is intended. The parallel argument confirms the logic holds for any functional specification. The text itself, by focusing on seeking and permission, invites this reading and resists the purely ontological one.
