answer: |-
  Your roommate is echoing a famous argument from the philosophy of technology, most notably Langdon Winner's 1980 essay *"Do Artifacts Have Politics?"* Winner argues that technologies are not neutral tools; they are ways of settling disputes about how we live together.

  Your gut is working well, but your theory ("hands a burden") is slightly off. QWERTY hands a burden (inefficiency) to everyone, yet feels neutral. The bus bench hands a burden (discomfort) to everyone, yet feels political. The difference isn't the burden; it's the **distribution of power.**

  Here is the principle that fits your list, the verdicts you must discard to keep it consistent, and what it says about your new cases.

  ### The Principle: Asymmetric Agency

  An object is political when its design **encodes a choice that grants agency or access to one group while restricting it for another, where that restriction could have been designed otherwise.**

  To use this as a rule, you need two filters. If an object passes both, it is political.

  1.  **The Contingency Filter:** Could this have been built differently without losing its core function? (If no, it's physics. If yes, it's a choice.)
  2.  **The Asymmetry Filter:** Does that choice systematically sort people into "winners" (more access/power) and "losers" (less access/power) based on class, ability, citizenship, or ownership status?

  ### Applying the Rules to Your List

  **The "Yes" List (Political)**
  *   **Bus Benches:** *Contingent?* Yes (benches exist without armrests). *Asymmetric?* Yes (sitters win, sleepers lose). **Verdict: Keep.**
  *   **Courthouse Stairs:** *Contingent?* Yes (ramps can be front). *Asymmetric?* Yes (abled win, disabled lose/hide). **Verdict: Keep.**
  *   **Money Size:** *Contingent?* Yes (other countries use different sizes/shapes). *Asymmetric?* Yes (sighted win, blind lose). **Verdict: Keep.**
  *   **Roads (Rich vs. Poor):** *Contingent?* Yes (crosswalks cost money but exist). *Asymmetric?* Yes (drivers win, pedestrians/poor lose). **Verdict: Keep.**
  *   **Voting Machine:** *Contingent?* Yes (paper trails exist). *Asymmetric?* Yes (officials win, voters lose recourse). **Verdict: Keep.**
  *   **Glued Battery:** *Contingent?* Yes (screws exist). *Asymmetric?* Yes (manufacturer wins repair monopoly, owner loses autonomy). **Verdict: Keep.**

  **The "No" List (The Sacrifices)**
  This is where you have to be honest. To keep the principle consistent, you must throw out at least one verdict here.

  *   **Right-Handed Scissors:** *Contingent?* Yes (ambidextrous or left-handed versions exist). *Asymmetric?* Yes (righties win, lefties lose dexterity).
      *   **You must flip this.** Your gut says "no" because the stakes are low and it's market-driven, but by the rule, this is **political**. It enforces a "right-handed norm" that treats left-handedness as a deviation.
  *   **QWERTY / Screw Threads / Traffic Lights:** These are **Standards**, not Stratifications.
      *   *Contingent?* Yes (Dvorak keyboard, metric screws).
      *   *Asymmetric?* **No.** Once adopted, the burden is shared equally to enable coordination. They are "frozen politics" (someone won the standard war historically), but functionally they act as neutral infrastructure now.
      *   **You can keep these as "No,"** *but* you must acknowledge they are only neutral because the burden is universal, not because they lack a history of power struggles.
  *   **Doors / Chess:** These are largely physics or game rules. A door must swing; a chess set needs defined moves. Unless the door is designed to block a wheelchair (see: Courthouse), it's neutral. **Verdict: Keep.**

  **The "Flip-Flop" List**
  *   **App on New Phones:** *Contingent?* Yes (code can be optimized). *Asymmetric?* Yes (new phone owners win, old phone owners/low income lose access). **Verdict: Political.** (This is "planned obsolescence" as policy).
  *   **Crossing Signal:** *Contingent?* Yes (timer can be changed). *Asymmetric?* Yes (fast walkers win, elderly/disabled lose safety). **Verdict: Political.** (This is often called "negligent design," but it functions as exclusion).

  ### Intent vs. Effect
  You asked: *"The bus-shelter bench might have just been some guy thinking armrests looked nice."*

  Under this principle, **intent does not matter.** Politics is about the *arrangement of power*, not the *thoughts of the designer.*
  *   If a designer builds a bridge too low for buses, it doesn't matter if they liked the aesthetic or wanted to keep poor people out. If the *effect* is that buses cannot pass, the bridge is political.
  *   If the armrests prevent sleeping, the bench is political, regardless of whether the designer was thinking about "homeless people" or just "tidiness." "Tidiness" in public spaces is itself a political value that prioritizes aesthetics over human need.

  ### The New Cases
  Based on the **Asymmetric Agency** rule:

  1.  **Sprinklers over benches at night:**
      *   *Contingent:* Yes (sprinklers can be aimed at grass).
      *   *Asymmetric:* Yes (dry sitters win, wet sleepers lose).
      *   **Verdict:** **Political.** This is "hostile architecture" in its purest form. It uses public infrastructure (water) to enforce a social boundary (no sleeping).

  2.  **Kettle with special pods:**
      *   *Contingent:* Yes (standard kettles exist).
      *   *Asymmetric:* Yes (company wins recurring revenue, user loses repair/refill choice).
      *   **Verdict:** **Political.** This is a shift from "selling a product" to "renting a service." It transfers power from the consumer to the corporation. It is the glued battery, but for consumables.

  ### Summary
  Your gut is detecting **Power**, not just **Burdens**.

  *   **QWERTY** is a burden shared for **Coordination**. (Not Political in function).
  *   **Scissors** are a burden shared for **Normativity**. (Political).
  *   **Benches** are a burden assigned for **Exclusion**. (Political).

  To keep your theory robust, you must admit that **right-handed scissors are political.** They enforce a physical norm that privileges the majority body over the minority body. The only reason they feel neutral is that the "war" was won long ago by the right-handed majority, and the stakes are low.

  The rule is: **If a design choice settles a question of "who belongs" or "who has control" by physically restricting one group more than another, it is political.** Everything else is just physics or coordination.
