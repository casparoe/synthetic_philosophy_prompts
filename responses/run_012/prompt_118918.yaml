  The spine: the order the ideas must go in and the dependency relations between them, with a note on what breaks if I run two of them out of order

  Start with the definition of "mind." If I let them define it, the Engineer defines it as optimization and the Vet as suffering. They will talk past each other. I must introduce a provisional duality: mind as *capacity to act* versus mind as *capacity to feel*. This distinction is the engine, but I cannot name the destination yet. Next, establish the individual ant. If the audience believes ants are unconscious automata, the colony cannot be conscious by summation. If they believe ants suffer, the colony might inherit it. I must bracket this: assume ants are simple processors for the sake of the argument. This prevents the Vet from derailing the colony question with individual welfare. Third, establish colony agency. Here the Beekeeper and Engineer align. The colony hunts, builds, wars. It has a point of view in the functional sense. I must secure their agreement here: yes, it acts like one thing. Fourth, deploy the Carrying Case. This tests the substrate of that agency. Fifth, the reveal. Now I separate the agreed-upon agency from the contested experience.

  Dependency: If I deploy the Case before establishing Agency, the Case is abstract. If I define the PoV/Subject gap before the Case, the Case is illustrative rather than investigative. The Vet must be bracketed before the Beekeeper speaks, or the conversation becomes an ethics committee. The Engineer's definition must be challenged before the Phil dabblers embrace functionalism. The sequence creates a trap. By securing agreement on agency first, I make the denial of subjecthood harder later. If I ask about consciousness first, they will hide behind behavior. By making them commit to the colony's behavioral unity, I force them to confront whether behavior is enough. The definition of "mind" must remain fluid until the Turn. If I pin it too early, the Phil dabblers will lock onto functionalism and refuse to let go. If I pin it too late, the Engineer will assume optimization is the only metric that matters. The dependency is causal: you cannot feel the gap until you have stood on both sides of it. You cannot stand on the agency side until you have accepted the colony acts as one. You cannot accept the colony acts as one until you have set aside the individual ant's status.

  The carrying case: your verdict on my candidates and a specification of what the case must have and must lack, including what it must not be allowed to do

  Verdict: Use the Staggered Replacement. The Merger case tests individuation (how many minds?), but your crux is about the nature of the mind (is anyone home?). Replacement isolates function from biology. If behavior remains identical while substrate changes from neuron to silicon, the *Point of View* (functional agency) is preserved by definition. The *Subject* (experience) is the only variable left in doubt. Specifications: The case must stipulate that the micro-robots obey the exact same local rules as the ants. It must not imply the robots are conscious; they are explicitly simple machines. It must not allow "life" to be used as a proxy for "mind." If a participant argues "robots aren't alive," you must counter "we are asking about minds, not biology." The case must not resolve the question; it must only sharpen the dilemma. It must lack any narrative element that implies a unified voice (no Hofstadter). It is a structural test, not a story. It must not suggest the robots are networked in a way the ants weren't. The physical swap must be slow enough to imply continuity but fast enough to fit the session.

  The misconception map: the misconceptions they will bring and the ones they will form during the session, in the order they will surface, each with the point in the spine where I head it off and the one move I use, and with the beekeeper, the optimisation engineer, and the vet each placed explicitly

  1.  **Engineer (Mind = Optimization):** Surfaces immediately. He will claim the algorithm proves the mind exists. *Head off:* Step 1 (Mind Definition). *Move:* Ask if a thermostat has a mind because it regulates temperature. Force a distinction between goal-directedness and interiority.
  2.  **Vet (Ant Suffering = Colony Suffering):** Surfaces at Step 2 (Individuals). She will worry about the ants' pain. *Head off:* Step 2. *Move:* Explicitly bracket individual consciousness. "For this hour, assume the ant is a mechanism. Does the mechanism sum to a feeler?"
  3.  **Beekeeper (Colony = Organism):** Surfaces at Step 3 (Agency). She will insist it *is* one animal. *Head off:* Step 3. *Move:* Agree on functional unity ("It acts as one"), but withhold ontological commitment ("Whether it *is* one is what we are testing").
  4.  **Phil Dabblers (Functionalism):** Surfaces at Step 5 (The Gap). They will claim functional equivalence proves consciousness. *Head off:* The Turn. *Move:* Use the Replacement Case to show function can be preserved while intuition about experience wavers.

  Order is critical. If the Vet speaks before the bracket, the room becomes an ethics committee. If the Engineer speaks before the thermostat check, "mind" becomes synonymous with "code." If the Beekeeper speaks before the functional/ontological split, her biological intuition will preempt the philosophical distinction. The Phil dabblers are the final boss; they must be confronted only after the intuition pump has done its work. If you let the Beekeeper define the colony as an organism too early, the Vet will assume organisms necessarily suffer, and the Engineer will assume organisms necessarily compute. You must keep these threads separate until the Carrying Case tangles them intentionally. The Engineer's misconception is the most dangerous early on because it sounds scientific. The Vet's is the most dangerous emotionally because it demands moral action. The Beekeeper's is the most dangerous intuitively because it feels obvious. The Phil dabblers are the risk at the end because they have the vocabulary to close the question prematurely.

  The turn: exactly where the point-of-view-versus-subject distinction gets earned rather than announced, what question I put to the room at that moment and how long I let them sit with it before I say anything

  This occurs immediately after the Staggered Replacement scenario is fully visualized. The board should show two columns: "Original Colony" and "Robot Colony," with identical behaviors listed. You put down the marker. You ask: "The behavior is identical. The optimization is identical. If there was someone home in the first column, what exactly is missing in the second?" Then you stop. You do not elaborate. You let the silence sit for forty-five seconds. You let them feel the weight of the gap between *doing* and *being*. If you speak too soon, you fill the gap they need to discover. The question must hang in the air until someone attempts to bridge it with something other than function. You must resist the urge to nod or prompt. The discovery must be theirs.

  The check: one thing I ask them to do at the end that shows the idea landed rather than that they've learned the vocabulary, plus what a confident wrong answer would look like and what it would tell me

  Ask them to apply the distinction to a corporation. "Does a corporation have a Point of View? Does it have a Subject?" A confident wrong answer looks like: "Yes, because it can sue and own property." This tells you they have collapsed agency into experience. They think legal standing equals phenomenal presence. A correct landing looks like: "It acts like an agent, but no one feels the lawsuit." This shows they have separated the functional utility from the internal witness.

  Deliberate omissions: what I should refuse to settle in seventy-five minutes, and the words I use to refuse it so that it sounds like a decision rather than a gap

  Refuse to settle individual ant consciousness. Refuse to define "life." Refuse to assign moral status. Use this phrase: "That is a separate ontology." If pressed on whether ants suffer, say: "We are testing the colony, not the citizen." If pressed on whether the robot colony is alive, say: "We are testing the mind, not the biology." This sounds like a methodological boundary, not an ignorance of the answer. It keeps the session within the seventy-five minute constraint.

  Where I will go wrong: the one place in this plan where I personally am most likely to start lecturing instead of teaching, and the tell that it's happening

  You will go wrong at The Turn. You will feel the silence becoming uncomfortable and reach for the whiteboard marker to draw the conclusion yourself. The tell is your hand moving to erase the question before they have answered it. You must keep your hands in your pockets. If you explain the gap, you revert to the "bad answer" you gave your child.
