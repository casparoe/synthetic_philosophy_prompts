prompt: |-
  ok so i'm trying to figure out what a theory of biological function actually has to get right — not the theory itself, just the spec. the list of things any account of "the function of X is Y" has to deliver before i bother comparing them. i keep getting annoyed at both sides of the etiological vs causal-role thing (the selected-effects people on one side, the Cummins-style dispositional/role people on the other) and i want to lay out the requirements first and let the theories fight over them instead of arguing case by case forever.

  give me the desiderata, with the motivating case behind each, and say which ones are non-negotiable and which are just commitments one camp can't live without. stuff i want covered:

  - the difference between a trait's function and a mere effect it happens to have (heart pumps blood vs heart makes noise) — but also the annoying version, where the "mere effect" turns out to be doing real work somewhere and you can't just wave it off
  - malfunction and normativity: i can say my heart is failing at its job, but can i say that of a machine, or of a trait that's only existed for one generation? where does the norm come from?
  - vestigial and exapted traits, and traits that arose by drift and only later became useful — no selection history to point to. does it have a function? this is where the two camps really split and i want the list to make that split unavoidable rather than a talking point
  - novel traits with no ancestral history at all. and here's the case i actually care about, so please handle it properly: an organism whose "lineage" is a lab lineage — engineered once, then left to mutate under selection for a few hundred generations. what's the function of a newly useful structure when the only selection pressure was a grad student's culture conditions? does etiological function survive the move from nature to the lab, or is it just causal role wearing a lab coat?
  - whether function-talk in physiology and function-talk in evolutionary biology can even be the same predicate, or whether we're quietly equivocating
  - and the one i suspect does the most damage: the requirement that has to make room for us ascribing functions to parts of organisms we've never seen evolve and never will, without letting us ascribe a function to absolutely anything (the sun's function is to warm the earth)

  flag any pair of these that can't be satisfied together, and tell me which single requirement knocks out the most theories. don't bother scoring the contenders against the list, i'll do that part. a table is fine. and don't cite anything, i don't have web access right now anyway.
