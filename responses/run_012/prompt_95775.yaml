answer: |-
  Here is the specification sheet. I've stripped out the theory names and focused on the logical work each requirement demands.

  ### The Spec Sheet: Desiderata for Biological Function

  | # | Desideratum | The Motivating Case | Status | Camp Tension |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Distinction Constraint** | Must distinguish *function* from *mere effect*. The heart pumps blood (function) vs. makes thumping noise (effect). | **Non-Negotiable** | Both agree, but solve it differently. |
  | **2** | **The Useful Accident Clause** | Must handle cases where a "mere effect" is actually beneficial. (e.g., heart noise startles predators). It shouldn't automatically become *the* function just because it's useful. | **Non-Negotiable** | Etiological handles this well; Causal Role struggles (utility often equals function). |
  | **3** | **The Normativity Constraint** | Must ground claims of **malfunction**. A heart can be *broken* (ought to pump, doesn't), not just statistically rare. A stone isn't "broken" for not pumping blood. | **Non-Negotiable** | **Major Split.** Etiological grounds this in history. Causal Role struggles to derive "ought" from "is." |
  | **4** | **The History vs. Capacity Toggle** | Must decide if function depends on *why it's there* (history) or *what it does now* (capacity). | **Commitment** | **The Main Split.** Etiological requires history. Causal Role requires only current capacity. |
  | **5** | **The Novelty Accommodation** | Must assign function to traits with little/no selection history (e.g., engineered traits, lab lineages, exaptations). | **Negotiable** | **Kills Strict Etiological.** If history is required, brand new useful traits have no function. |
  | **6** | **The Epistemic Access Constraint** | We must be able to ascribe function without knowing the evolutionary history. (Physiologists don't sequence fossils to say kidneys filter). | **Non-Negotiable** | **Kills Strict Etiological in practice.** Requires history to exist, but not necessarily known. |
  | **7** | **The System Boundary Constraint** | Must prevent panfunctionalism. The sun warms the earth, but that's not the sun's *biological function*. Function must be relative to a containing system. | **Non-Negotiable** | Causal Role needs this badly to avoid "everything does something." |
  | **8** | **The Disciplinary Unity Clause** | Must decide if "function" means the same thing in physiology (current role) and evo-bio (adaptive history). | **Negotiable** | Monism is elegant but hard. Pluralism is easy but admits defeat on definition. |

  ---

  ### The Incompatible Pairs (Trade-Offs)

  You cannot maximize all of these simultaneously. You have to choose which bullet to bite.

  **1. The History vs. Novelty Conflict (Desiderata 4 & 5)**
  *   **The Conflict:** If you demand a selection history to ground normativity (D4), you cannot ascribe function to a novel trait that hasn't been selected yet (D5).
  *   **The Trade-off:** Either you accept that new, useful traits have *no function* until they replicate (strict history), or you accept that function can exist without selection history (strict capacity).
  *   **Impact:** This is where the Lab Lineage case breaks the spec.

  **2. The Normativity vs. Epistemic Access Conflict (Desiderata 3 & 6)**
  *   **The Conflict:** Normativity is easiest to ground in hard facts about past selection (D3). But we often ascribe function without knowing those facts (D6).
  *   **The Trade-off:** If function *is* history, then when we don't know the history, we are guessing at the function. If function *is* current role, we know the function, but we lose the hard ground for saying the trait is "broken" when it fails.
  *   **Impact:** This forces theories to choose between being metaphysically robust (history) or epistemically usable (capacity).

  **3. The Unity vs. Precision Conflict (Desideratum 8)**
  *   **The Conflict:** Physiologists use "function" to mean "current contribution to survival." Evolutionary biologists use it to mean "reason for existence."
  *   **The Trade-off:** You can have one definition that is vague enough to cover both (losing explanatory power), or two precise definitions (admitting the word is ambiguous).
  *   **Impact:** Most "unified" theories end up smuggling one definition into the other's domain.

  ---

  ### The Lab Lineage Case (Specific Handling)

  You asked specifically about the engineered organism left to mutate under selection for a few hundred generations. Here is how the spec forces a decision:

  *   **If the structure arose *during* the 100 generations of selection:**
      *   **Etiological Spec:** It has a function. It was selected for in the lab environment. The "lineage" is the lab culture.
      *   **Causal Role Spec:** It has a function. It contributes to the system's capacity to survive the grad student's conditions.
      *   *Result:* Both pass.

  *   **If the structure was *engineered initially* and persisted:**
      *   **Etiological Spec:** **FAIL.** Unless you count the engineer's intent as "selection," there is no natural selection history. It is an artifact, not a biological trait, under strict specs.
      *   **Causal Role Spec:** **PASS.** It does a job now.
      *   *Result:* This is the wedge. If you want the spec to cover engineered biology as "biology," you must relax the History requirement (D4).

  *   **If the structure arose by drift and *then* became useful:**
      *   **Etiological Spec:** **FAIL.** It wasn't selected *for* that use initially. (Some versions allow "subsequent selection" to fix this, but it gets messy).
      *   **Causal Role Spec:** **PASS.** It is currently doing work.

  ---

  ### The Theory Killer

  **The Single Requirement That Knocks Out The Most Theories:**
  **Desideratum 3: The Normativity Constraint.**

  **Why:**
  It is easy to make a theory that distinguishes effects from functions (D1). It is easy to make a theory that allows for novelty (D5). It is very hard to explain how a physical trait can be *wrong* without smuggling in mysticism or external intent.

  *   **Causal Role theories** generally fail here. If a kidney's function is to filter blood, and it stops filtering, the Causal Role theorist must say "it no longer has that function." They struggle to say "it has the function, but is failing at it." They lose the "ought."
  *   **Etiological theories** solve this by saying "it ought to do what its ancestors did." But this kills them on **Desideratum 5 (Novelty)**.
  *   **Hybrid theories** try to get both, but usually collapse into one side when pressed on the Lab Lineage case.

  If you enforce **Normativity** (traits can be broken) AND **Novelty** (new traits have functions) simultaneously, almost every existing account on the market breaks. You end up requiring a theory that can generate normative force from current organization alone, which is the hardest philosophical lift in the bunch.

  ### Summary Recommendation for Your Spec

  If you want to let the theories fight rather than fighting them yourself, make **Desideratum 3 (Normativity)** and **Desideratum 5 (Novelty)** the primary filters.

  1.  **Set Normativity as Non-Negotiable.** If a theory can't explain malfunction, it's not a theory of function, it's a theory of causation.
  2.  **Set Novelty as a Test Case.** Don't make it a hard constraint, but make it a "cost." If a theory requires history, it pays a cost: it cannot handle the Lab Lineage case without modification.

  This forces the Etiological camp to explain how lab-selection counts as "real" history, and forces the Causal Role camp to explain where the "ought" comes from in a lab organism. That's where the actual work is.
