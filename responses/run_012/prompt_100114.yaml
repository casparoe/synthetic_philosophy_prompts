prompt: |-
  I teach a 75-minute seminar on consequentialism to about 18 undergrads and I want them to actually feel the overdemandingness problem in their bones rather than hear it described. The specific thing I want them to run into: the "keep giving until the cost to you outweighs the benefit to others" rule has no natural stopping point — every extra bit of giving looks justified by exactly the same logic that justified the first bit — and I want that pressure to show up in their own choices before anyone names it. So design me a staged role-play where each student holds a small budget of something they actually care about (money, time, attention, sleep, whatever) and then faces a sequence of real decisions about whether to spend it on a needy case, with the rule that any refusal has to be justified out loud, and that earlier justifications stay written on the board and can be reused or challenged in later rounds. I want them to notice that their own reasons start to wear thin. Somewhere around the middle, inject an exit for them: a card or a rule stating that if everyone in the group gives their fair share then the need is met, so you only ever owe your share — and make them decide whether to take that exit and what it costs to take it. No lecture up front, and don't let them hear words like "demandingness" or "fair share" until the debrief. Give me the roles, materials, a timeline, a way to keep score without real money, the debrief that maps specific moments onto the argument, what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of the idea the activity just can't reproduce and that I'll have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Teach the "overdemandingness objection" to consequentialism to ~18 undergrads in a 75-minute seminar.
      *   **Core Experience:** Students need to *feel* the pressure of the "marginal utility" principle (keep giving until cost > benefit) without hearing the theory first. They need to experience the lack of a natural stopping point.
      *   **Mechanism:** A staged role-play/decision game.
      *   **Resources:** Students hold a budget of something they care about (time, attention, hypothetical money, etc.).
      *   **Constraint 1:** Refusals must be justified out loud.
      *   **Constraint 2:** Justifications are recorded on the board and can be challenged/reused.
      *   **Constraint 3:** Mid-game injection of a "fair share/exit" option (collective action problem).
      *   **Constraint 4:** No lecture up front. No technical terms ("demandingness," "fair share") until debrief.
      *   **Deliverables:** Roles, materials, timeline, scoring system, debrief structure, troubleshooting (what goes wrong), and limitations (what the activity *can't* do).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Consequentialism:* Maximize the good.
      *   *Marginal Utility Principle:* You ought to give until the utility lost by you equals the utility gained by others.
      *   *Overdemandingness:* This implies giving away almost everything, leaving you at a subsistence level, because there's always someone worse off.
      *   *The "Fair Share" Escape:* Maybe I only need to do my part if others do theirs? (Cooperation vs. Individual Obligation).
      *   *The Feeling:* Cognitive dissonance, rationalization fatigue, social pressure.

  3.  **Design the Activity ("The Lifeline Protocol"):**
      *   *Currency:* Real money is risky/unequal. "Life Points" (LP) representing leisure/comfort time is better. Let's use "Comfort Credits" (CC). They represent hours of free time this weekend. Everyone starts with 10 CC.
      *   *The Need:* A series of "Crises." Each crisis has a cost to solve and a benefit (lives saved/suffering averted).
      *   *The Rule:* The "Maximize Good" rule (implicit). If you can prevent something bad without sacrificing something of *comparable* moral importance, you must.
      *   *The Twist:* The "Collective Cap" card (the exit).

  4.  **Drafting the Timeline (75 mins):**
      *   0-5: Setup (minimal instructions).
      *   5-25: Round 1 & 2 (Individual decisions, building the "Justification Board").
      *   25-35: The "Collective Cap" Injection (The Exit).
      *   35-55: Round 3 & 4 (Post-Exit pressure).
      *   55-75: Debrief (Connecting experience to theory).

  5.  **Refining the Mechanics:**
      *   *Scoring:* Need a way to track "Good Done" vs. "Comfort Kept."
      *   *The Board:* Needs to track *reasons for keeping*, not just numbers.
      *   *The Pressure:* The instructor acts as the "Algorithm" or "Conscience," not a moralizer. Just asking "Why not?"
      *   *The Exit:* If 50% of the class contributes X amount, the crisis is solved. If not, the crisis worsens. This introduces the "compliance condition."

  6.  **Addressing the "What Goes Wrong" (Troubleshooting):**
      *   *Risk 1:* Students treat it as a game/optimize for points. *Fix:* Make the "Need" visceral (stories, not numbers).
      *   *Risk 2:* One student dominates or opts out immediately. *Fix:* Random selection for who speaks, or small groups. Let's go with whole class but random cold-calling for justifications to ensure broad participation.
      *   *Risk 3:* The "Exit" is taken too easily. *Fix:* Make the "Fair Share" still costly, just *less* costly than the infinite demand.
      *   *Risk 4:* Emotional distress. *Fix:* Keep the currency hypothetical (Comfort Credits), not real money.

  7.  **Developing the Debrief:**
      *   Map the feelings to the terms.
      *   "The Slippage" = Marginal Utility.
      *   "The Exhaustion" = Overdemandingness.
      *   "The Exit" = Cooperation/Compliance Condition.
      *   Connect to Singer, Unger, Hooker.

  8.  **Identifying Limitations:**
      *   The activity can't reproduce *lifetime* commitment. It's only 75 mins.
      *   It can't reproduce the *emotional weight* of real life-and-death.
      *   The instructor must supply the link to the actual philosophical texts.

  9.  **Review against Constraints:**
      *   No lecture up front? Yes.
      *   No technical terms until debrief? Yes.
      *   Justifications on board? Yes.
      *   Exit card included? Yes.
      *   18 undergrads? Yes, scalable.
      *   75 minutes? Yes.

  10. **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the "Conscience" role is neutral but persistent.
      *   Clarify the "Comfort Credit" system so it feels valuable.
      *   *Self-Correction on the Exit:* The prompt asks for an exit where "if everyone gives their fair share... you only ever owe your share." I need to make sure this option is available *as a choice* they can adopt, but it comes with a risk (what if others don't?). Actually, the prompt says "inject an exit... make them decide whether to take it." Okay, I will introduce a "Pact" option.

  11. **Finalizing the Output Structure:**
      *   Activity Title.
      *   Learning Objective.
      *   Materials.
      *   Setup (The Currency).
      *   Phase 1: The Gradient (Rounds 1-2).
      *   Phase 2: The Pact (The Exit).
      *   Phase 3: The Aftermath (Rounds 3-4).
      *   The Debrief (Mapping Experience to Theory).
      *   Troubleshooting.
      *   Limitations.

  *(Self-Correction during drafting)*: I need to make sure the "Justification Board" is used effectively. If a student says "I need this for sleep," and keeps it, that reason is now "spent." Can they use it again? The prompt says "earlier justifications stay written... and can be reused or challenged." This implies if I use "I need sleep" once, can I use it again? If I can reuse it infinitely, the pressure vanishes. The rule should be: You can reuse a justification, *but* the class can challenge if the context has changed (i.e., you've already kept enough for sleep). This creates the "wear thin" effect.

  Let's refine the "Exit." It shouldn't be a magic win. It should be a "Compliance Condition." *Option:* You can pledge to give 2 Credits *if* 15 others do. If the pledge fails, the crisis continues and you are back to individual decisions. This creates the tension between individual efficacy and collective obligation.

  Okay, ready to write.
answer: |-
  # Activity Title: The Lifeline Protocol

  **Learning Objective:** Students will experientially encounter the "marginal utility" principle of act consequentialism, feel the erosion of personal justifications under repeated demand, and grapple with the "compliance condition" (fair share) escape clause before learning the philosophical terminology.

  **Class Size:** 18 Undergraduates
  **Time:** 75 Minutes
  **Materials:**
  *   Whiteboard + Markers (3 colors: Black, Red, Blue).
  *   18 "Wallet Cards" (index cards with 10 slots each).
  *   18 Pens.
  *   Projector (for displaying the "Crises").
  *   A physical "Pact Box" (a bowl or envelope).

  ---

  ## 1. Setup: The Currency (5 Minutes)
  *Do not mention consequentialism, ethics, or philosophy.*

  1.  **Distribute Wallet Cards:** Each student gets a card with 10 empty boxes labeled **"Comfort Credits (CC)."**
  2.  **Define the Currency:** Tell them: *"These credits represent your free time this weekend. 1 CC = 2 hours of leisure (sleeping in, gaming, hanging out). 10 CC = Your entire weekend. You start with 10."*
  3.  **The Rule of the Room:** *"I am going to present a series of Crises. Each Crisis can be alleviated if Credits are donated. You choose whether to donate. If you keep a Credit, you must state why. I will write your reason on the board. If you donate, you mark an X on your card. There is no grade for this, but you must play honestly."*
  4.  **The Silent Principle:** Do not explain *why* they should donate. Just present the need. Let the pressure build from the situation, not your instruction.

  ## 2. Phase 1: The Gradient (Rounds 1 & 2) (20 Minutes)
  *Goal: Establish the pattern of marginal utility without a stopping point.*

  **Round 1: The Low Cost**
  *   **Crisis:** "A village well is contaminated. 50 people will get sick. Cost to fix: 1 CC total (needs 18 students to give 0.1? No, keep it simple). Cost to fix: 5 CC total."
  *   **Action:** Ask for volunteers to donate 1 CC each until 5 are raised.
  *   **The Catch:** If fewer than 5 donate, the sickness happens.
  *   **The Interrogation:** If a student *keeps* their credit, ask: *"Why?"* Write their reason in **Black** on the board (e.g., "I need to study," "I worked hard this week").
  *   **Outcome:** Usually, 5+ people donate easily. The "cost" feels low.

  **Round 2: The Escalation**
  *   **Crisis:** "A famine in a neighboring region. 500 people at risk. Cost to fix: 15 CC total."
  *   **Action:** You need 15 Credits total. Students already donated 5 in Round 1. They have 5 CC left on average.
  *   **The Interrogation:** Ask those who haven't donated yet, or ask previous donors to donate *again*.
  *   **The Board:** When a student refuses, look at the board. *"Sarah said 'I need to study.' Mark, can you use that reason? Or do you need a new one?"*
  *   **The Pressure:** If they reuse a reason, challenge it. *"You already kept 2 credits for 'studying.' How many hours do you need?"*
  *   **Outcome:** Students will feel the pinch. They have to keep justifying keeping resources while the "need" on the screen grows. The board fills with reasons that start to look flimsy ("I want to watch a movie" vs "Someone starves").

  ## 3. Phase 2: The Pact (The Exit Injection) (15 Minutes)
  *Goal: Introduce the "Fair Share/Compliance" escape route.*

  1.  **Stop the Game.** Announce: *"There is a new option. The 'Collective Pact'."*
  2.  **The Rule:** *"If 15 out of 18 of you agree to donate exactly 3 CC each right now, the Crisis is solved permanently. No more requests. If fewer than 15 agree, the Pact fails. The Crises continue, and you keep your current balances."*
  3.  **The Decision:** Give them 3 minutes to discuss in pairs. Then, have them write "PACT" or "PASS" on a slip of paper and drop it in the **Pact Box**.
  4.  **The Reveal:** Count them publicly.
      *   **If Pact Succeeds:** Congratulate them. The game ends early (move to debrief). *Note: This rarely happens because of free-rider fear.*
      *   **If Pact Fails (Likely):** This is the teaching moment. *"The Pact failed. The need remains. We return to individual decisions."*
  5.  **The Cost of the Exit:** Highlight that the Pact required *less* total sacrifice (45 CC) than the open-ended giving might have cost, but it required *trust*. Most will hesitate to trust.

  ## 4. Phase 3: The Aftermath (Rounds 3 & 4) (20 Minutes)
  *Goal: Demonstrate the exhaustion of justifications after the exit is rejected.*

  **Round 3: The Personal Cost**
  *   **Crisis:** "Medical supplies for a chronic condition. 100 people suffer without. Cost: 10 CC per person needed." (Wait, scale it). Cost: 1 CC per student to alleviate significant suffering.
  *   **Action:** Ask every student to donate 1 CC.
  *   **The Board:** Switch to **Red Marker**. Any reason used now must be written in Red.
  *   **The Trap:** If a student says "I'm tired," point to the Black marker reason "I need rest." Ask: *"Is this different? Or are you just repeating yourself?"*
  *   **Observation:** Watch them struggle. They are running out of *new* moral reasons to keep their credits. They are forced to say "Because it's mine," which feels weak against the projected need.

  **Round 4: The Bottom**
  *   **Crisis:** "Final emergency. Cost: All remaining credits."
  *   **Action:** Ask them to donate everything down to 0 CC.
  *   **The Stop:** Do not let them actually go to 0. Stop when the tension peaks (usually when they are down to 1 or 2 CC).
  *   **Freeze:** *"Stop. Keep what you have. Look at your card. Look at the board."*

  ## 5. The Debrief (15 Minutes)
  *Goal: Map the experience to Consequentialism and the Overdemandingness Objection.*

  **Step 1: The Feeling (5 mins)**
  *   Ask: *"At what point did you feel annoyed? At what point did you feel guilty?"*
  *   Ask: *"When you looked at the board, did your reasons look better or worse as the game went on?"*
  *   **Key Insight:** They will admit their reasons felt like "excuses" by Round 3.

  **Step 2: Naming the Beast (5 mins)**
  *   **Reveal the Theory:** *"You were acting under a specific rule: 'Prevent bad things from happening if you can do so without sacrificing something of comparable moral significance.'"* (Peter Singer's principle).
  *   **Term:** This is **Act Consequentialism**.
  *   **Term:** The feeling that you can never stop giving is the **Overdemandingness Objection**.
  *   **Connect:** *"Notice how there was no natural stopping point? Round 1 was easy. Round 4 felt impossible. But the logic was identical. That is the 'slippery slope' of marginal utility."*

  **Step 3: The Pact (5 mins)**
  *   **Term:** The Pact was the **Compliance Condition** or **Fair Share** argument.
  *   **Discuss:** *"Why did the Pact fail? Because you couldn't trust others to do their part. Consequentialism usually says you must do the good regardless of what others do. But does that seem fair?"*
  *   **Connect:** This introduces Rule Consequentialism or Contractualism as potential fixes.

  ---

  ## Troubleshooting: What Will Go Wrong & How to Handle It

  **1. The "Gamer" Student**
  *   **Problem:** One student treats it purely mechanically, donating everything immediately to "win" or keeping everything to "protest," ruining the tension for others.
  *   **Fix:** In the instructions, emphasize: *"Play according to what you actually feel you should do, not what you think the professor wants."* If a student donates all 10 CC instantly, pause and ask: *"Is there anything you need to survive next week? If not, are you a saint or a martyr?"* Use them as a foil: *"Look at Alex. Alex has 0 left. Do the rest of you owe as much as Alex?"*

  **2. The "Silent Room"**
  *   **Problem:** No one wants to justify keeping money/time out loud. It's too awkward.
  *   **Fix:** Allow anonymous justification slips for the first round, but insist on verbal justification for Round 2. If they clam up, *you* voice the justification they are likely thinking. *"I suspect many of you are thinking 'I earned this.' Is that on the board? No. Let's write it."* Break the ice by normalizing the selfishness.

  **3. The Pact Succeeds Too Easily**
  *   **Problem:** They all agree to the Pact immediately.
  *   **Fix:** You lose the "individual burden" phase. If this happens, introduce a "Betrayal Card." After they pledge, reveal: *"3 people lied. The Pact is void."* Then resume individual rounds. This teaches the fragility of cooperation. (Use this only if they are too idealistic).

  **4. Emotional Distress**
  *   **Problem:** A student actually feels genuine guilt or stress about "not giving."
  *   **Fix:** Monitor the room. If someone looks visibly upset, pause. Remind them: *"These are hypothetical credits. Your actual weekend is safe."* Ensure the debrief validates that feeling the tension is the *goal*, not resolving it perfectly.

  ---

  ## Limitations: What This Activity Cannot Do
  *Be honest with yourself about these gaps.*

  1.  **Lifetime Commitment:** Consequentialism is demanding over a *lifetime*, not 75 minutes. Students can recover their "Comfort Credits" next week. You must verbally bridge this gap in the debrief: *"Imagine this wasn't a weekend, but your entire career income."*
  2.  **Real Suffering:** They know the crises are fake. The "guilt" is simulated. You cannot reproduce the actual moral weight of a dying child. You must supply the gravity in the debrief by referencing real-world effective altruism data (e.g., cost to save a life via malaria nets).
  3.  **The "Identity" Problem:** The activity focuses on *resources* (time/credits). It doesn't capture the loss of *personal projects* (becoming a painter vs. a doctor). You will need to add this nuance in the lecture portion: *"It's not just money; it's your right to have a life plan that isn't purely charitable."*

  ## Instructor Script Snippet (For the "Justification Board")
  *When a student says "I need this for myself":*
  **You:** "Okay, writing 'Personal Need' on the board. (Turn to class) If 'Personal Need' stops the demand here, where does it stop? Is it 1 Credit of need? 5? All 10? Who decides the price of 'Personal Need' against a life saved?"
  *(This forces them to see that without a metric, the justification is arbitrary.)*

  *When the Pact Fails:*
  **You:** "The Pact failed. So, Mark, you kept your 3 Credits. But if the Pact had worked, you would have given 3 and the problem would be solved. By keeping your 3 now, the problem remains. Did your 3 Credits buy you more value than solving the problem? Or did you just buy insurance against being the only sucker?"
  *(This forces them to confront the Free Rider problem inherent in the Fair Share objection.)*
