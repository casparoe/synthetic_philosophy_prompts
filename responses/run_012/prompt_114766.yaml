answer: |-
  To anatomize the distinction between the agential and structural dimensions of epistemic injustice, we must first treat them as ideal types and specify the ontological commitments required to keep them apart. Only then can we test the stability of that separation against the pressure of their mutual dependence.

  ### I. Conditions for Genuine Distinctness

  For the agential (testimonial) and structural (hermeneutical) dimensions to be genuinely distinct categories rather than points on a continuum, specific conditions must hold regarding concepts, speakers, and hearers.

  **1. The Status of Concepts**
  For the distinction to hold, concepts must function differently in each dimension. In the **agential** dimension, the requisite concepts must be *available* but *misapplied*. The interpretive resource exists within the collective hermeneutical repertoire, but the hearer fails to apply it to the speaker due to identity prejudice. In the **structural** dimension, the concept must be *absent* or *obscured* from the collective repertoire. The injustice is not a misapplication of an existing tool, but the lack of the tool itself.
  *Condition:* Distinctness requires that *availability* be binary. A concept is either in the shared pool (making agential failure possible) or it is not (making structural failure necessary).

  **2. The Capacity of Speakers**
  The speaker's relation to their own experience must differ. In the **agential** dimension, the speaker possesses *self-intelligibility*. They understand their experience and attempt to convey it; the blockage is external (the hearer's refusal to credit). In the **structural** dimension, the speaker suffers a deficit of *self-intelligibility*. They are confused by their own experience because the social vocabulary renders it unintelligible even in private reflection.
  *Condition:* Distinctness requires that the locus of confusion be separable. The speaker must be able to be clear to themselves while being misunderstood by others (agential), or confused themselves regardless of the hearer's goodwill (structural).

  **3. The Responsibility of Hearers**
  The hearer's capacity for correction must differ. In the **agential** dimension, the hearer must possess the *capacity to correct* the injustice within the immediate exchange. They can, through epistemic virtue, suspend prejudice and grant credibility. In the **structural** dimension, the hearer lacks this capacity. Even a perfectly virtuous hearer cannot credit a claim that cannot be articulated because the conceptual vocabulary does not exist.
  *Condition:* Distinctness requires that *correctability* be tied to the individual will in the agential case, and tied to collective historical change in the structural case.

  ### II. The Argument for Collapse

  The strongest reason for thinking the agential dimension collapses into the structural one is that **prejudice is itself a hermeneutical gap.**

  The agential dimension posits a hearer who possesses the correct concepts but is biased against the speaker. However, identity prejudice is not merely an emotional attitude; it is a cognitive framework. To hold a prejudice against a social group is to operate with a defective hermeneutical resource regarding that group. If a hearer discounts a speaker because they are a woman, the hearer is operating with a concept of "woman" that excludes epistemic authority.

  Therefore, the "agential" failure is not a failure to apply a *good* concept, but the application of a *bad* concept (a stereotype) that has structurally displaced the accurate one. The hearer is not withholding credibility from a position of full interpretive power; they are acting out a structural deficit in the collective understanding of the speaker's social identity. The hearer is not an autonomous agent making a localized error; they are a node through which the structural hermeneutical gap flows. If the structure determines the concepts available to the hearer, and those concepts are prejudiced, the hearer's "agency" is an illusion. The agential is merely the structural made visible in a dyad.

  ### III. Assessing the Repairability Criterion

  You propose a criterion to save the distinction: **Repairability.**
  *Thesis:* Agential injustice can be repaired by a single hearer (by exercising virtue); Structural injustice cannot (because the concept is missing).

  **Scrutiny of the Agential Side**
  Does a single hearer have the power to repair testimonial injustice? Superficially, yes: I can choose to believe you. However, credibility is not solely dyadic; it is social. If I grant you credibility but the wider social structure denies it, your testimony remains socially inert. You may be "believed" by me, but you remain epistemically marginalized in the public sphere. Furthermore, if my ability to "choose" to believe you is constrained by deep-seated structural conditioning (as argued in the Collapse section), then the repair is not truly within my individual agency. I cannot simply "decide" to see outside my hermeneutical horizon. Thus, the agential dimension is not fully repairable by a single hearer.

  **Scrutiny of the Structural Side**
  Is structural injustice immune to single-hearer repair? This relies on the assumption that concepts only emerge from collective consensus. This is historically false. Concepts often enter circulation through *individual* or *dyadic* acts of naming. Consider the introduction of the term "sexual harassment." Before it was a shared public concept, it existed as a private intuition. When one person articulated it and another *heard* it, a micro-hermeneutical resource was created. That single exchange repaired the structural gap *for those participants*, creating a beachhead for the concept to spread.
  If a single hearer can accept a new concept from a speaker, they are participating in the repair of the structural gap. The "structural" resource is just the aggregate of past agential acceptances. Therefore, the structural dimension *can* be initiated and locally repaired by individual agency.

  **Verdict on the Criterion**
  The Repairability Criterion fails because it relies on a false dichotomy between the individual and the collective.
  1.  **Agential repair is limited:** One hearer cannot fully restore social credibility against a structural tide.
  2.  **Structural repair is possible:** One hearer can validate a new concept, initiating structural change.
  The boundary is porous. Both dimensions require a mix of individual virtue and collective resource.

  ### IV. Implications for Basicness

  If the Repairability Criterion fails, we must ask which dimension is the more basic category. The failure of the criterion suggests that the "agential" is not a self-contained sphere of action but a localized manifestation of the "structural."

  **The Structural is Ontologically Prior.**
  For any epistemic exchange to occur, there must be a horizon of intelligibility. This horizon is the structural dimension. Even in cases of pure testimonial injustice (where concepts exist), the *meaning* of those concepts and the *credibility* attached to them are determined by the structure. You cannot have a credibility deficit (agential) without a background economy of value (structural) that defines who is credible.

  The agential dimension describes the *event* of injustice, but the structural dimension describes the *conditions of possibility* for that event.
  *   If the structure is sound but the hearer is biased, the bias itself is a structural artifact internalized by the agent.
  *   If the structure is unsound (hermeneutical gap), the agential exchange is already compromised before it begins.

  Therefore, the agential dimension is derivative. It is the mechanism by which the structural dimension reproduces itself. To treat the agential dimension as distinct and primary is to commit a category error of liberal individualism, assuming that hearers stand outside the structures they inhabit.

  **Conclusion**
  The distinction between agential and structural epistemic injustice is functionally useful for identifying interventions (train the hearer vs. change the language), but it is not ontologically robust. The two dimensions are mutually constitutive loops. However, if one must be foundational, it is the structural. The hearer's agency is always already structured by the hermeneutical resources available to them. The "gap" is not just a lack of words; it is the architecture within which words acquire weight. Consequently, the structural dimension is the basic category; the agential is its active reproduction. To resolve the injustice, one cannot simply fix the hearer, because the hearer is the symptom, not the cause.
