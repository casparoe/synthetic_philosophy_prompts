answer: |-
  You have hit on exactly why this debate is so frustrating for outsiders. The sentence "correlations always come from a common cause" is a linguistic Swiss Army knife. People pull out different blades depending on what they want to cut, but they all call it by the same name.

  In physics and philosophy, this idea is formally known as **Reichenbach's Common Cause Principle**. But in the context of Bell's Theorem, it gets tangled up with assumptions about locality, time, and experimental freedom.

  Here is the menu you asked for. I have broken that single sentence down into four distinct claims, ranging from a mathematical definition to a heavy metaphysical assertion. For each, I've listed the verdict, whether it's about the *world* or our *models*, and who is using it.

  ### 1. The Statistical Definition ("Screening Off")
  *   **The Claim:** If two events $A$ and $B$ are correlated, we can *define* a third variable $C$ such that if we know $C$, $A$ and $B$ become statistically independent. (Knowing $A$ tells you nothing new about $B$ if you already know $C$).
  *   **Is it True?** **Mathematically, yes.** You can almost always construct a variable $C$ that does this (for example, $C$ could just be "the list of all outcomes of $A$ and $B$").
  *   **World or Model?** **Model.** This is a statement about probability theory, not physical machinery.
  *   **Who uses this?** **Mathematicians and Statisticians.**
  *   **The Catch:** Just because you can *define* a variable $C$ doesn't mean $C$ is a physical thing that exists in reality. It might just be a bookkeeping trick.
  *   **Relevance to your debate:** This version is too weak to support either side of the physics argument. It doesn't prove hidden variables exist, nor does it disprove them. It just says "you can describe correlations this way."

  ### 2. The Classical Metaphysical Principle (Reichenbach's Proper)
  *   **The Claim:** If two events are correlated, and one did not cause the other, there **physically exists** a real event in their past that produced both. Furthermore, this physical event fully explains the correlation (it "screens it off").
  *   **Is it True?** **False (in Quantum Mechanics).** This is the specific intuition that Bell's Theorem challenges. In classical physics (like rain causing both the street to be wet and your umbrella to be up), this is true. In quantum entanglement, experiments show no such local physical variable exists that can screen off the correlation.
  *   **World or Model?** **World.** This is a claim about how reality is constructed.
  *   **Who uses this?** **The "Hidden Variable" proponents.** When they say "there must be a common cause," they are asserting this principle is a fundamental law of nature that Quantum Mechanics is violating. They believe QM is incomplete because it violates this rule.
  *   **Relevance to your debate:** This is the version the "spooky action needs a deeper story" crowd is relying on. They are betting that this principle *must* be true, so QM must be wrong/incomplete.

  ### 3. The Local Realist Constraint (Bell's Assumption)
  *   **The Claim:** The common cause must be **local**. It must be located in the overlap of the past light-cones of the two measurements. It cannot involve influences traveling faster than light, and the properties of the particles must be defined *before* measurement (Realism).
  *   **Is it True?** **False (according to experiment).** Bell derived a mathematical limit (Bell's Inequality) that applies if this claim is true. Experiments violate that limit. Therefore, you cannot have a common cause that is *both* local and real in the classical sense.
  *   **World or Model?** **World.** This constrains the geometry of cause-and-effect in the universe.
  *   **Who uses this?** **The "Bell kills Hidden Variables" crowd.** When they say "Bell rules out common causes," they specifically mean *Local* Common Causes. They are saying: "If you insist on Claim #2, you must give up Locality (allow faster-than-light influence). If you insist on Locality, you must give up Claim #2 (no hidden variables)."
  *   **Relevance to your debate:** This is the pivot point. The sentence "correlations come from a common cause" is only ruled out by Bell if you add the constraint "and that cause obeys the speed of light."

  ### 4. The Measurement Independence Clause (The "No Conspiracy" Rule)
  *   **The Claim:** The common cause (the hidden state of the particles) is **not correlated with the settings of the detectors**. The choice of how to measure the particles is independent of the particles themselves.
  *   **Is it True?** **Assumed True (but unprovable).** Standard science assumes experimenters have "free choice" or that detector settings are random enough relative to the particle source.
  *   **World or Model?** **World/Methodology.** It is a claim about the causal structure of the experiment.
  *   **Who uses this?** **The "Conspiracy" (Superdeterminism) Guy.**
  *   **Relevance to your debate:** This is the specific assumption the "conspiracy" commenter was denying.

  ---

  ### Addressing Your Specific Questions

  #### 1. Which reading is doing the work when someone says correlations *must* have a hidden common cause?
  They are using **Claim #2 (The Classical Metaphysical Principle)**. They are treating Reichenbach's Principle as an inviolable law of logic. Their argument is: "Correlations are too orderly to be random; therefore, a physical mechanism (Claim #2) must exist, even if we can't see it yet."

  #### 2. Which reading is doing the work when someone says Bell's theorem *rules that out*?
  They are using **Claim #3 (The Local Realist Constraint)**. They are saying: "We tested Claim #2 under the condition of Locality (Claim #3), and nature failed the test. Therefore, you cannot have a Local Common Cause."
  *Note:* They are *not* ruling out *any* common cause (you could have a non-local one), they are ruling out a *local* one.

  #### 3. What exactly is the "Conspiracy Guy" denying, and is it crazy?
  The Conspiracy Guy is denying **Claim #4 (Measurement Independence)**.
  *   **The Denial:** He is claiming that the hidden variable (the particle's state) and the detector settings (which angle the experimenter chooses) share a common cause all the way back to the Big Bang.
  *   **Is it Crazy?** Logically? **No.** It is a valid loophole. If the particles "know" what settings you are going to choose before you choose them, Bell's math doesn't apply, and you can save Local Realism.
  *   **Why people pile on him:** It is methodologically **catastrophic**. If you deny Claim #4, you undermine the scientific method. If your detector settings are correlated with the thing you are measuring, you can never prove anything. You could construct a theory where the particles conspire to make *any* theory look true. It saves the physics but kills the science. It's not "crazy" in a logic sense, but it's a "dead end" in a practical sense.

  #### 4. Does the sentence say anything about whether the cause has to be in the past?
  Yes, but implicitly.
  *   **In Claims #2 and #3:** The cause is assumed to be in the **past** (specifically, the past light cone). This is the standard definition of causality in physics.
  *   **The Loophole:** There is a minority view called **Retrocausality**. This suggests the "common cause" could be influenced by the *future* measurement settings. This also saves Local Realism without needing a "Big Bang Conspiracy." It violates our intuition about time, but it is distinct from the "Conspiracy" (Superdeterminism) argument. The "Conspiracy" argument usually implies a past block-universe determination; Retrocausality implies future-to-past influence.

  #### 5. Is the detector setting thing part of the same claim or layered on top?
  It is **layered on top**.
  *   **Claim #2 & #3** are about the particles and their history.
  *   **Claim #4** is about the relationship between the particles and the *experimenter*.
  *   Bell's Theorem requires **all of them** to hold.
      *   If you keep #2 & #3 but drop #4 -> Superdeterminism (Conspiracy).
      *   If you keep #2 & #4 but drop #3 -> Non-Local Hidden Variables (Bohmian Mechanics).
      *   If you keep #3 & #4 but drop #2 -> Standard Quantum Mechanics (No hidden variables, just probabilities).

  ### Summary Verdict Table

  | Reading | Precise Claim | Verdict | Ontology or Model? | Who Uses It? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Statistical** | We can define a variable that accounts for correlation. | **True** (Trivial) | Model (Math) | Statisticians |
  | **2. Classical** | A physical mechanism *must* exist to explain correlation. | **False** (in QM) | World (Reality) | Hidden Variable Proponents |
  | **3. Local** | That mechanism must obey the speed of light. | **False** (in QM) | World (Reality) | Bell Theorem Proponents |
  | **4. Independent** | The mechanism doesn't know the detector settings. | **Assumed** | World/Method | Everyone (except Superdeterminists) |

  ### The Bottom Line for Your Evenings
  The reason you are seeing opposite conclusions is that the sentence "correlations come from a common cause" is a shorthand for **"Local Realism + Measurement Independence."**

  *   When the **Hidden Variable** guy says it, he means: "Realism is true, so there must be a cause (Claim #2)."
  *   When the **Bell** guy says it, he means: "If there were a Local Cause (Claim #2 + #3), we would see different results. We don't. So there isn't one."
  *   When the **Conspiracy** guy speaks up, he is saying: "Wait, what if the Cause (Claim #2) is correlated with the Detectors (Denying Claim #4)?"

  None of them are technically lying, but they are all emphasizing a different slice of the same loaf. The "Conspiracy" guy isn't violating logic, he is violating the assumption that the experimenter is independent of the experiment—which is why everyone tells him to sit down, even if he's technically right that it's a logical possibility.
