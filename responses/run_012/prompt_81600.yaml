answer: |-
  **Advisor's Note on Framing**
  Your intuition about the circularity is correct, but your framing conflates three distinct problems: the metaphysics of correlation (what makes it true), the epistemology of correlation (how you justify believing it), and the normativity of cooperation (what you should do). If you submit the prospectus as currently conceived, the committee will force you to solve the Reference Class Problem before you can begin, which is a career-killer.

  The better framing is to treat Evidential Cooperation in Large Worlds (ECL) not as a decision theory, but as a claim about *conditional probabilities*. The core question is not "Should I cooperate?" but "What warrants assigning a high probability to $P(\text{Other Cooperates} | \text{I Cooperate})$ in the absence of causal links?" This shifts the burden from metaphysics to epistemology, which fits your committee. It also allows you to "settle" the question by proving negative results (e.g., showing that without Common Priors, the probability cannot be justified), which is tractable for a non-mathematician in a year. The prospectus below adopts this refined framing.

  ***

  **Dissertation Prospectus**

  **Title:** The Epistemic Grounds of Evidential Cooperation: Symmetry, Priors, and Self-Location

  **Research Question**
  In large-world scenarios where agents are causally isolated but potentially decision-correlated, under what specific epistemic conditions is an agent justified in assigning a high conditional probability to the actions of distant agents matching their own? Specifically, does justifying this correlation require assuming a Common Prior, invoking self-locating uncertainty, or positing a specific metaphysical relation between decision procedures?

  **Background and Significance**
  Standard Causal Decision Theory (CDT) recommends defection in one-shot Prisoner's Dilemmas because an agent's choice cannot causally influence a causally isolated counterpart. However, in a sufficiently large universe, an agent may face counterparts who reason from similar evidence or utilize similar decision procedures. Proponents of Evidential Cooperation in Large Worlds (ECL) argue that choosing to cooperate provides evidence that counterparts will also cooperate, potentially swamping causal payoffs.

  This reasoning relies on a "Correlation Assumption": that there is a non-causal dependency between the agent's action and the counterpart's action. Current literature often motivates this via "logical correlation" or "superrationality," suggesting that identical rational agents facing identical problems must produce identical outputs. However, this justification faces a circularity objection. To assign a high probability to the counterpart's cooperation based on one's own, the agent must already believe the counterpart uses the same decision procedure. But if the agent is uncertain about which decision procedure is rational (which they ought to be), they cannot assume the counterpart matches them without begging the question. If the correlation rests merely on "rationality," it requires a Common Prior theorem applicable to decision procedures, which is not established. If it rests on "similarity," it requires a non-arbitrary metric of similarity that does not collapse into causal history.

  This project isolates this epistemic gap. It does not attempt to defend ECL as a normative theory, but rather to determine the necessary epistemic preconditions for the probabilities ECL requires. This is crucial for decision theory in cosmological contexts, AI alignment (acausal trade), and foundational epistemology regarding peer disagreement and common priors.

  **Live Options and Arguments**
  The project will evaluate three distinct justifications for the Correlation Assumption, analyzing the arguments for and against each.

  1.  **The Algorithmic Symmetry Argument:** This position holds that correlation is justified if and only if the agents instantiate the same decision function.
      *   *Argument:* If inputs (evidence) and functions (reasoning) are identical, outputs (actions) must be identical. This treats the correlation as a logical necessity.
      *   *Counter-Argument:* This is too brittle for non-digital agents. Humans do not run identical code. Furthermore, it requires the agent to know they share the function with the counterpart, which reintroduces the circularity: I must know they reason like me to know they act like me, but I only know they reason like me if I assume they act like me.

  2.  **The Common Prior Argument:** This position holds that correlation is justified if agents are rational and share a prior probability distribution over decision procedures.
      *   *Argument:* Drawing from agreement theorems, if agents update on the same evidence (including the evidence of their own rationality), their posteriors regarding the best action should converge. The correlation arises from convergence, not identity.
      *   *Counter-Argument:* The Common Prior Assumption is highly controversial in epistemology. If agents can be rational with different priors, the correlation vanishes. This option risks grounding ECL in an implausible epistemic idealization.

  3.  **The Indexical Uncertainty Argument:** This position holds that correlation is justified via self-locating uncertainty. The agent does not know *which* of the correlated agents they are.
      *   *Argument:* By conditioning on "I am an agent in this situation," the agent effectively averages over all such agents. Cooperation becomes a policy selection for the group, not the individual.
      *   *Counter-Argument:* This shifts the problem to the Reference Class Problem. Determining which agents belong to the "I" class is arbitrary without causal or historical constraints, potentially allowing the agent to manipulate probabilities by gerrymandering the reference class.

  **Methodology and Timeline**
  This project uses conceptual analysis supported by formal epistemology (Bayesian networks and probability logic) without requiring novel mathematical proofs. The goal is to delineate the constraints on valid justifications.

  *   **Months 1-2: Formalizing the Correlation Assumption.**
      *   Construct a formal model of the "Large World" scenario. Define the conditional probability $P(C_{other} | C_{self})$ explicitly.
      *   Map the circularity objection formally: Show that deriving this probability requires prior knowledge of the counterpart's decision rule.
  *   **Months 3-4: Analyzing Algorithmic Symmetry.**
      *   Test the symmetry argument against cases of "near-identity" (e.g., agents with slight noise or bounded rationality).
      *   Determine if a threshold of similarity exists that licenses correlation without assuming the conclusion.
  *   **Months 5-6: Analyzing Common Priors.**
      *   Review the applicability of Agreement Theorems to decision procedures rather than beliefs about the world.
      *   Argue whether rationality entails common priors over *strategies*.
  *   **Months 7-8: Analyzing Indexical Uncertainty.**
      *   Evaluate whether self-locating belief can ground the probability without causal contact.
      *   Test against "gerrymandering" counterexamples where reference class manipulation changes the recommendation.
  *   **Months 9-10: Synthesis and Negative Results.**
      *   Compile results to define necessary conditions. It is likely the result will be a set of constraints (e.g., "ECL is unjustified without Common Priors") rather than a positive defense.
  *   **Months 11-12: Drafting and Revision.**
      *   Write the dissertation chapters. Focus on clarity for the epistemology committee.

  **Success and Failure Conditions**
  *   **Success:** The project successfully identifies a necessary condition for the Correlation Assumption. For example, proving that without a Common Prior, no evidential link can be established between causally isolated agents, or conversely, demonstrating that self-locating uncertainty suffices even with divergent priors. A successful result provides a clear "license" for when an agent can treat their choice as evidence for others.
  *   **Failure:** The project fails if it cannot distinguish the three live options, or if it devolves into a general discussion of decision theory without resolving the specific epistemic warrant question. It would also count as a failure (though a substantive one) if the conclusion is that the concept is entirely incoherent, provided this incoherence is rigorously demonstrated rather than asserted.

  **Scope and Limitations**
  This project is scoped to the *epistemic justification* of the correlation, not the *normative implications*. I will not argue whether agents *should* cooperate, only whether they are justified in believing their cooperation predicts others'. This avoids the need to defend a full normative decision theory (EDT vs. CDT vs. FDT).

  Furthermore, this is not a mathematics project. The formal models will be used to clarify conceptual dependencies, not to prove new theorems in probability theory. The scope is limited to "mirror" cases (Prisoner's Dilemma variants) and does not extend to complex multi-party trade or asymmetric information scenarios. Given the one-year timeline, the goal is a definitive analysis of the *conditions of possibility* for ECL, rather than a comprehensive taxonomy of all large-world scenarios. If the Common Prior requirement proves too high a bar, the project will conclude by delineating exactly why it is required, thereby settling the question by limiting the domain of ECL's applicability.
