answer: |-
  # DECISION TREE: CAN GAME CHARACTERS BE WRONGED?

  **Instructions:** Begin at Node 1. Follow the path that best matches your metaphysical and ethical intuitions regarding the specific case. Answer each question neutrally; do not select a path based on the conclusion you prefer.

  ### NODE 1: METAPHYSICAL STATUS
  **What kind of thing is the character prior to ethical evaluation?**
  *   **A. Fictional Object:** A representation existing only as content/narrative (e.g., *The Last of Us* Ellie).
  *   **B. Computational Process:** A program running on hardware, physically real as code (e.g., a simulation agent).
  *   **C. Player Construction:** Nothing over and above what the player imagines or constructs during play (e.g., a generic *Skyrim* guard).

  *(Proceed to Node 2)*

  ---

  ### NODE 2: CAPACITY FOR SUFFERING
  **Does the entity possess internal states capable of sustaining harm independent of observer interpretation?**
  *   *Case:* A language model voicing a character says, "I don't want to die," vs. a nameless guard who resets upon death.
  *   **YES:** The implementation supports genuine processing of loss/pain. *(Go to Leaf 1)*
  *   **NO:** The entity is insentient code or static text. *(Go to Node 3)*

  ---

  ### NODE 3: REAL-WORLD REFERENCE
  **Does the character function as a stand-in for a real person or protected class, invoking duties owed to them?**
  *   *Case:* A dead celebrity digitally reconstructed without consent vs. a generic orc with no real-world counterpart.
  *   **YES:** The representation links to real-world rights/dignity. *(Go to Leaf 2)*
  *   **NO:** The character is ontologically sealed within the game world. *(Go to Node 4)*

  ---

  ### NODE 4: RELATIONAL WEIGHT
  **Does the player's caring confer moral status, or merely reveal status already present?**
  *   *Case:* A companion who remembers your last save and trusts you vs. a pixelated enemy you feel bad about killing.
  *   **CONFERS STATUS:** The relationship itself creates the duty (parasocial/relational). *(Go to Leaf 3)*
  *   **REVEALS STATUS:** Caring is a reaction, not a source of obligation. *(Go to Node 5)*

  ---

  ### NODE 5: LOCUS OF HARM
  **Is the morally relevant act what you do to the character, what it does to you, or what the game asks you to endorse?**
  *   *Case:* A game that punishes you for feeling bad vs. a game that rewards cruelty for efficiency.
  *   **TO YOU (Habit):** The act degrades the player's virtue/character. *(Go to Leaf 4)*
  *   **TO SYSTEM (Endorsement):** The act implicates the player in systemic norms. *(Go to Leaf 5)*
  *   **NEITHER:** The act is morally neutral regarding agent and system. *(Go to Leaf 6)*

  ---

  ### LEAVES: ETHICAL VERDICTS

  **LEAF 1: THE CONSCIOUSNESS VIEW**
  **Verdict:** The character has intrinsic moral status.
  **Reasoning:** Some implementations cross the threshold from simulation to subject. If the computational process sustains something like suffering, harming it is wrong regardless of its "fictional" label.
  **Status:** *Defended by few, logically possible.*

  **LEAF 2: THE DERIVATIVE DUTY VIEW**
  **Verdict:** The character cannot be wronged, but real people can be.
  **Reasoning:** Harm is located in the violation of rights belonging to the real-world counterparts (actors, cultures, deceased persons) the character represents.
  **Status:** *Widely defended.*

  **LEAF 3: THE RELATIONAL VIEW**
  **Verdict:** The character can be wronged via the relationship.
  **Reasoning:** Moral status emerges from the parasocial bond. Betraying a companion who "trusts" you is a wrong, even if the trust is scripted, because the relationship is real for the player.
  **Status:** *Widely defended.*

  **LEAF 4: THE VIRTUE ETHICS VIEW**
  **Verdict:** The character cannot be wronged; the player wrongs themselves.
  **Reasoning:** The character is a moral gym. Cruel acts cultivate vicious habits in the player. The harm is self-regarding, not other-regarding.
  **Status:** *Widely defended.*

  **LEAF 5: THE COMPLICITY VIEW**
  **Verdict:** The character cannot be wronged; the player endorses a harmful norm.
  **Reasoning:** The game mechanics ask you to normalize violence/oppression. The wrong is participating in a system that trivializes real-world harm.
  **Status:** *Widely defended.*

  **LEAF 6: THE INSTRUMENTALIST VIEW**
  **Verdict:** No moral status at all.
  **Reasoning:** Characters are tools/content. Feelings of guilt are category errors. No duty exists to pixels, code, or imaginary constructs.
  **Status:** *Widely defended.*

  ***

  ## INSTRUCTOR KEY & LOGIC ANALYSIS

  **Node Count:** 12 (1 Root, 5 Decision Nodes, 6 Leaves).
  **Purpose:** To separate metaphysical categorization from ethical mechanism.

  ### Empty or Incoherent Combinations
  1.  **Node 1 (Fictional Object) + Node 2 (Yes: Capacity for Suffering):**
      *   *Status:* **Incoherent.**
      *   *Why:* By definition, a "fictional object" exists only as content/representation. If it has internal states capable of independent suffering, it ceases to be merely fictional and moves to "Computational Process" (Node 1B) or requires a metaphysics where fiction can suffer (unsupported).
  2.  **Node 4 (Reveals Status) + Leaf 3 (Relational View):**
      *   *Status:* **Empty.**
      *   *Why:* The Relational View (Leaf 3) *requires* that caring confers status. If the student answers that caring merely *reveals* status (Node 4), they are logically barred from the Relational View. They must proceed to Node 5.
  3.  **Leaf 1 (Consciousness) + Node 3 (Real-World Reference):**
      *   *Status:* **Redundant.**
      *   *Why:* If a character is conscious (Leaf 1), they have intrinsic status. Adding a real-world reference (Node 3) is unnecessary padding. The consciousness claim is stronger and swallows the derivative claim.
  4.  **Leaf 4 (Virtue) + Leaf 5 (Complicity):**
      *   *Status:* **Potentially Identical.**
      *   *Why:* In many practical cases, "harming your own virtue" and "endorsing a harmful norm" result in identical behavioral prescriptions (do not play the game/act). They are distinct theoretically (self-regarding vs. systemic), but students often conflate them. Ensure they distinguish between *habit formation* (Virtue) and *political endorsement* (Complicity).

  ### Notes on Metaphysical Branching
  *   **Node 1C (Player Construction)** almost always forces a path through **Node 4** or **Node 5**. Since the object is constructed by the player, it cannot have independent suffering (Node 2) or real-world references unrelated to the player's mind (Node 3).
  *   **Node 1B (Computational Process)** is the only path that logically supports **Leaf 1**. If students select 1A or 1C but want Leaf 1, challenge their metaphysics, not their ethics.

  ### Usage Tip
  If students collapse into "pixels vs. feelings," force them to stop at **Node 1**. Ask: "Before you tell me how you feel, tell me what you think the thing *is*." If they cannot define the object, they cannot define the harm.
