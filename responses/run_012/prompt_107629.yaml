answer: |-
  Here is a decision tree designed to sort positions on long-run prediction failures. It is built from concrete commitments rather than philosophical labels. You can walk a claim down this tree by answering the questions sequentially.

  ### The Decision Tree

  **Start:** A long-run prediction (e.g., collapse, scarcity, famine) has failed to materialize on the expected schedule.

  **Q1. Timing Commitment:** Was the specific deadline (e.g., "by 1980," "within 30 years") an essential truth-condition of the claim, or merely an illustrative extrapolation based on rates at the time?
  *   **Essential:** Go to **Q2**.
  *   **Illustrative:** Go to **Q3**.

  **Q2. (Timing was Essential):** Did the event occur by the deadline?
  *   **Yes:** (Confirmation – outside the scope of this tree).
  *   **No:** Go to **Leaf 1**.

  **Q3. (Timing was Illustrative):** Is the underlying causal mechanism (e.g., exponential growth, fixed carrying capacity) still operating unchanged, or has it been fundamentally altered/broken?
  *   **Altered/Broken:** Go to **Q4**.
  *   **Operating Unchanged:** Go to **Q5**.

  **Q4. (Mechanism Altered):** Was the alteration caused by human intervention taken specifically *because* the prediction was made (e.g., policy changes to avoid the crash)?
  *   **Yes:** Go to **Leaf 2**.
  *   **No:** Go to **Leaf 3**.

  **Q5. (Mechanism Unchanged):** To explain the delay, must we introduce a new factor (auxiliary assumption) not in the original model (e.g., "technology slowed the rate")?
  *   **No (Rates were just uncertain):** Go to **Leaf 4**.
  *   **Yes:** Go to **Q6**.

  **Q6. (Auxiliary Introduced):** Can this new factor be measured or verified *independently* right now, without waiting for the main prediction to finally happen?
  *   **No:** Go to **Leaf 5**.
  *   **Yes:** Go to **Q7**.

  **Q7. (Auxiliary Testable):** Does this factor explain *how* the delay occurs (mechanism), or does it merely assert *that* a delay occurred (label)?
  *   **Asserts Only:** Go to **Leaf 6**.
  *   **Explains Mechanism:** Go to **Q8**.

  **Q8. (Explains Mechanism):** Did maintaining the claim require redefining the predicted outcome itself (e.g., shifting from "physical starvation" to "higher prices")?
  *   **Yes:** Go to **Leaf 7**.
  *   **No:** Go to **Q9**.

  **Q9. (No Redefinition):** Is there any specific, observable future state of the world that would now count as evidence *against* the revised theory?
  *   **No:** Go to **Leaf 8**.
  *   **Yes:** Go to **Leaf 9**.

  *(Parallel Path for Instrumentalism)*
  **Q10. (Epistemic Status):** At any point, was the model claimed to be a literal description of reality, or merely a management tool/heuristic?
  *   **Tool/Heuristic:** Go to **Leaf 10**.
  *   **Description of Reality:** (Continue down the tree above).

  *(Parallel Path for Abandonment)*
  **Q11. (Community Status):** Has the scientific community quietly stopped citing the prediction without formally refuting it?
  *   **Yes:** Go to **Leaf 11**.
  *   **No:** (Continue down the tree above).

  ---

  ### The Leaves (Positions)

  **Leaf 1: Strict Refutation**
  *   **Position:** The deadline was part of the claim; the deadline passed; the claim is false.
  *   **Commitment:** A missed deadline is a miss, regardless of direction.
  *   **Case Fit:** A strict reading of the Ehrlich-Simon bet (Simon won because prices dropped by the specific date).
  *   **Note:** This is the only leaf where "Right Direction, Wrong Time" counts as failure.

  **Leaf 2: Self-Negating Prophecy**
  *   **Position:** The theory was right about the danger, and the prediction failed *because* the theory succeeded as a warning.
  *   **Commitment:** The failure is evidence of the theory's social utility, not its factual error.
  *   **Case Fit:** Malthusian warnings prompting agricultural innovation; fisheries quotas preventing a modeled crash.

  **Leaf 3: Historical Contingency**
  *   **Position:** The theory was factually incomplete. It modeled biology/economics but failed to model historical change (tech, culture, war).
  *   **Commitment:** The mechanism broke due to external luck or innovation not accounted for. The theory is obsolete, not rescued.
  *   **Case Fit:** 1970s resource scarcity models that didn't anticipate fracking or the Green Revolution.

  **Leaf 4: Parameter Uncertainty**
  *   **Position:** The model structure was correct, but the input values (growth rates, carrying capacity) were uncertain.
  *   **Commitment:** The prediction wasn't "wrong," it was probabilistic. The crash is still coming, just later.
  *   **Case Fit:** Your 30-year stock projections where the crash happens in year 35 instead of year 30.
  *   **Distinction:** Unlike Leaf 5, this requires no new factors, just承认 (acknowledgment) of error margins.

  **Leaf 5: Deferred Verification**
  *   **Position:** The rescue factor exists but cannot be tested until the event occurs.
  *   **Commitment:** We must wait to see who was right. The theory is in suspended animation.
  *   **Case Fit:** "Climate tipping points" dated for 2050; claims that "the fish will crash once the current cohort dies out."
  *   **Risk:** This can slide into Leaf 8 if the delay becomes indefinite.

  **Leaf 6: Degenerative Rescue**
  *   **Position:** The theory is saved by adding factors that explain nothing but the failure itself.
  *   **Commitment:** The auxiliary is testable but empty (e.g., "invisible hand," "resilience," "unknown variable X").
  *   **Case Fit:** Claiming scarcity didn't happen because of "market forces" without specifying which forces or measuring them.
  *   **Status:** **Scientifically suspect.** It protects the core theory but adds no new knowledge.

  **Leaf 7: Conceptual Shift**
  *   **Position:** The crisis happened, but it looked different than expected.
  *   **Commitment:** Redefining the outcome preserves the theory (e.g., "Famine" becomes "Malnutrition" or "Price Volatility").
  *   **Case Fit:** Neo-Malthusians arguing scarcity is measured by price, not physical stock, after physical stocks remained stable.
  *   **Risk:** Often indistinguishable from Leaf 8 (Unfalsifiable) if the definition shifts every time.

  **Leaf 8: Unfalsifiable Doctrine**
  *   **Position:** The theory is maintained, but no future observation could refute it.
  *   **Commitment:** The theory is treated as metaphysical or political truth, not scientific hypothesis.
  *   **Case Fit:** Ideological claims that "collapse is inevitable" regardless of any evidence of stability.
  *   **Status:** **Not Science.** (By standard demarcation criteria).

  **Leaf 9: Progressive Rescue**
  *   **Position:** The theory is updated with testable auxiliaries that explain the delay and remain open to future refutation.
  *   **Commitment:** The theory evolves without losing empirical content.
  *   **Case Fit:** Stock assessment models updated with new environmental covariates that explain why recruitment failed earlier than expected.
  *   **Status:** **Scientifically Healthy.** (Lakatosian "progressive problemshift").

  **Leaf 10: Instrumentalist Stance**
  *   **Position:** The model was never "true," it was useful for management.
  *   **Commitment:** Truth conditions don't apply; utility conditions do.
  *   **Case Fit:** Using a simple surplus production model knowing it's biologically simplistic, because it sets safe catch limits.
  *   **Note:** This bypasses the truth/falsity fight entirely.

  **Leaf 11: Quiet Abandonment**
  *   **Position:** The prediction failed, no rescue was attempted, and the theory faded from literature.
  *   **Commitment:** The scientific community voted with its feet.
  *   **Case Fit:** Specific "Peak Oil" dates from the 1990s that are no longer cited by serious geologists.
  *   **Note:** This is how science often handles refutation without a philosophical ceremony.

  **Leaf 12: The Incoherent Position (Empty)**
  *   **Path:** Q1 (Essential) + Q2 (No) + Claim ("Still True") + Q5 (No Auxiliary).
  *   **Position:** The deadline was essential, the deadline passed, no new factors explain the delay, yet the theory is claimed to be correct.
  *   **Status:** **Empty/Incoherent.**
  *   **Why:** This violates the law of non-contradiction. You cannot claim a specific date was necessary for truth, admit the date passed, offer no explanation, and assert truth. Nobody defends this explicitly, though they sometimes drift into it during heated debate.

  ---

  ### Notes on Duplicates and Overlaps

  *   **Leaf 5 (Deferred) vs. Leaf 8 (Unfalsifiable):** These are often the same position wearing different hats. If "Deferred Verification" lasts longer than a human career without intermediate tests, it becomes functionally Unfalsifiable. The tree separates them based on *intent* (waiting for data vs. immune to data), but in practice, they look identical.
  *   **Leaf 3 (Contingency) vs. Leaf 6 (Degenerative):** Both involve adding factors. The distinction is whether the factor explains the change (Contingency: "Fracking happened") or just labels it (Degenerative: "Resilience occurred"). In practice, proponents of Leaf 6 often argue they are in Leaf 3.
  *   **Leaf 10 (Instrumentalist) vs. Leaf 4 (Parameter Uncertainty):** Both allow for "wrong" predictions without rejecting the model. The difference is whether you believe the model *captures reality* (Leaf 4) or is just a *calculator for decisions* (Leaf 10). In fisheries management, these two are frequently conflated.

  ### How to Use This in Your Reading Group

  When the fight starts ("Malthus was right but early!"), don't argue the history. Ask the group to walk the claim down the tree.

  1.  **Ask Q1:** "Did Malthus say 1900 specifically, or just 'eventually'?" (If eventually, you skip Strict Refutation).
  2.  **Ask Q3:** "Is population still growing geometrically?" (If no, you are in Contingency or Self-Negating).
  3.  **Ask Q6:** "Can we measure the 'technological progress' that saved us independently of the fact that we didn't starve?" (If no, you are in Degenerative Rescue).

  This forces them to pick a leaf. Once they pick a leaf, you can ask: "Is that leaf scientifically respectable, or is it Leaf 8?" It moves the fight from "Who is right?" to "What kind of claim are you making?"
