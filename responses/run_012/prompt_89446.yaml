  *   **E (East):** Far right of the line.
  *   **Spatial Order:** $W — C — E$.

  **Voters:** Five residents ($V_1$ to $V_5$) living along the road.

  **True Preferences (Single-Peaked):**
  Everyone's preferences decline as the site gets farther from their home (peak).
  *   **$V_1, V_2$ (Westside):** Peak $W$. Order: $W \succ C \succ E$.
  *   **$V_3$ (Central, Left-Leaning):** Peak $C$. Order: $C \succ W \succ E$.
  *   **$V_4, V_5$ (Eastside):** Peak $E$. Order: $E \succ C \succ W$.

  **Voting Rule:** Plurality (one vote per voter).
  **Tie-Break:** If two or more alternatives tie for most votes, **East (E) wins**. (Fixed ex-ante rule).
  **Benchmark Rule:** Median-of-Peaks (selects the peak of the median voter).

  ---

  ### The Profile and Outcomes

  | Voter | True Peak | True Ranking (SP) | Submitted Ranking (Truth) | Submitted Ranking (Lie) |
  | :--- | :--- | :--- | :--- | :--- |
  | **$V_1$** | $W$ | $W \succ C \succ E$ | Vote $W$ | Vote $W$ |
  | **$V_2$** | $W$ | $W \succ C \succ E$ | Vote $W$ | Vote $W$ |
  | **$V_3$** | $C$ | $C \succ W \succ E$ | Vote $C$ | **Vote $W$** |
  | **$V_4$** | $E$ | $E \succ C \succ W$ | Vote $E$ | Vote $E$ |
  | **$V_5$** | $E$ | $E \succ C \succ W$ | Vote $E$ | Vote $E$ |
  | **Totals** | | | $W:2, \; C:1, \; E:2$ | $W:3, \; C:0, \; E:2$ |
  | **Outcome** | | | **$E$** (Tie $W/E$, Break $E$) | **$W$** |

  **Median Rule Outcome:**
  Peaks are $\{W, W, C, E, E\}$. The median peak is **$C$**.

  **Manipulation Analysis ($V_3$'s Perspective):**
  *   **Truthful Outcome:** $E$ (East).
  *   **Manipulated Outcome:** $W$ (West).
  *   **$V_3$'s True Preferences:** $C \succ W \succ E$.
  *   **Comparison:** $V_3$ strictly prefers $W$ over $E$.
  *   **Incentive:** Strict. By switching their vote from $C$ to $W$, $V_3$ changes the winner from their worst option ($E$) to their second-best ($W$).
  *   **SP Constraint Check:** $V_3$'s submitted lie is $W \succ C \succ E$. On the line $W—C—E$, this peaks at $W$ and declines monotonically to the right. It is a valid Single-Peaked preference.

  ---

  ### Why Single-Peakedness Fails to Protect Plurality

  The Median Voter Theorem guarantees that if the *rule* is the median-of-peaks, truth-telling is dominant. Here, the rule is Plurality. Single-peakedness restricts the *shape* of preferences (no "holes"), but it does not restrict the *strategic incentives* created by the aggregation rule.

  Plurality ignores all information except the first choice. It treats a voter who loves $W$ and hates $E$ the same as a voter who likes $W$ slightly and hates $E$. In this case, the moderate voter ($V_3$) is "wasted" on $C$ because $C$ cannot win against the polarized blocs ($W$ and $E$). The single feature doing the work is **vote-splitting between polarized extremes**. Because $W$ and $E$ split the vote evenly, the tie-break hands the win to $E$. $V_3$ can tip the scale by abandoning their true peak ($C$) for a viable compromise ($W$), effectively coordinating with the $W$-bloc without violating the SP domain restriction.

  ---

  ### Follow-Up Questions

  **(a) If you drop to two alternatives, does the incentive vanish?**
  Yes. With only $\{W, E\}$, Plurality is equivalent to Majority Rule. The Median Voter Theorem holds directly for Majority Rule on any domain. A voter cannot profitably misreport because voting for your less-preferred option never helps you win your preferred option. This highlights that Gibbard–Satterthwaite's requirement of $|A| \ge 3$ is tight; the "spoiler" effect requires a third option to absorb votes.

  **(b) If you go to an even number of voters (e.g., 4) and change nothing else?**
  Remove $V_3$. Peaks: $W, W, E, E$.
  *   **Median:** Undefined or a set $\{W, E\}$ depending on convention.
  *   **Plurality:** Tie $2-2$. Tie-break selects $E$.
  *   **Manipulation:** Harder. If $V_1$ (Peak $W$) lies and votes $E$, $E$ wins outright (worse). If $V_1$ votes $W$, it's still a tie (breaks to $E$). No single voter is pivotal enough to break the tie in their favor without knowing the tie-break bias perfectly. Manipulation becomes contingent on the tie-break rule rather than vote counts, making it less robust but theoretically possible if the tie-break is known and unfavorable.

  ---

  ### Defense of Plurality and Objections

  **Objection 1: "The voter needs to know the others' ballots."**
  *   *Attack:* Strategy-proofness (DSIC) requires truth-telling to be optimal *regardless* of others' actions. My scenario shows a specific profile where lying helps. Thus, Plurality is not DSIC. However, in practice, without perfect information, $V_3$ risks voting $W$ and causing $W$ to win when $C$ might have won (if $V_4/V_5$ had abstained, etc.).
  *   *Verdict:* The objection lands on *practical* frequency but fails on *theoretical* classification. The rule is manipulable by definition.

  **Objection 2: "Strategy-proofness is too strong a demand."**
  *   *Attack:* Real voters aren't hyper-rational optimizers.
  *   *Verdict:* Valid for behavioral prediction, but irrelevant for mechanism design theory. The seminar asks about structural properties. The existence of *any* incentive violates the property.

  **Confidence Flag:**
  I am least confident about the **tie-break's role**. In this specific 5-voter symmetric case, the tie-break determines the truthful outcome ($E$ wins over $W$). If the tie-break favored $W$, the truthful outcome would be $W$, and $V_3$ (preferring $C \succ W \succ E$) would have no incentive to lie (they already get their 2nd choice). Thus, the manipulation relies on the tie-break creating a "worst-case" truthful outcome to motivate the shift. This is not a flaw in the logic, but it means the example is sensitive to the specific tie-breaking convention chosen.

  Verdict: Vote-splitting between polarized extremes allows a moderate to profitably shift peaks.
