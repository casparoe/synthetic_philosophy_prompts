  Here is the smoking gun: **The Rain Case (Case 6).**
  When she told you "there's a chance of rain for the whole city and a different chance for your street, and you're supposed to use the one that's actually about your case," she gave away her metaphysical hand. A Strict Principal Principle theorist (Rule 1) usually believes chance is a property of the physical setup *simpliciter*. A Contextualist believes chance is relative to the information class.

  If she were a Rule 1 theorist, she would have to treat the Guru's 500/500 record as "inadmissible information" about the future. But she already told you in Case 5 that she follows the Guru when the odds are unknown. The only difference in the New Case is the physics analysis. Given that she prioritizes the "street" over the "city" (specific over general), she will prioritize the "Guru Setup" (specific) over the "Physics Setup" (general).

  She views the "Chance is 1/2" stipulation not as a hard metaphysical constraint, but as a claim about *standard* coins. Since this is no longer a standard coin flip (it's a Guru flip), the 1/2 chance no longer applies to *this* case.

  ### The Tie-Breaker Case
  If her verdict next week is ambiguous (e.g., she hedges or says "it depends on what you mean by chance"), here is the case you need to propose to settle whether she is a **Patternist (Rule 2)** or a **Propensity Realist (Rule 1)**:

  **The Quantum Decay Case**
  > "Take a single atom of a radioactive isotope with a half-life such that the objective physical chance of decay in the next minute is exactly 1/2. This is standard quantum mechanics, fundamentally indeterministic. Now, introduce the same Guru. He has predicted 500/500 of these specific quantum decays correctly. He predicts decay. What is your credence?"

  *   **If she says 0.99:** She is a **Pure Humean/Patternist**. She believes *all* chance (even quantum) supervenes on patterns. If the pattern holds, the chance is whatever the pattern says. (Consistent with Rule 2).
  *   **If she says 1/2:** She is a **Propensity Realist**. She believes quantum chance is a fundamental metaphysical property that *cannot* be overridden by empirical patterns without a causal mechanism. This would mean her "Reference Class" rule only applies to *epistemic* chance (coins/weather), not *ontic* chance (quantum).

  This isolates whether her "Reference Class" intuition is a universal rule about chance, or just a rule for handling uncertainty in complex systems. Given her dissertation topic, her answer to the Quantum Case will tell you exactly where she stands in the metaphysics of probability.
