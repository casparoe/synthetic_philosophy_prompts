answer: |-
  You have put your finger on the precise nerve that makes Hobbes simultaneously brilliant and, to many readers, deeply unsatisfying. Your observation is not merely a stylistic quibble; it identifies the central epistemological vulnerability of the "geometric method" when applied to moral philosophy.

  There is no single, universally settled name for this maneuver because it sits at the intersection of logic, rhetoric, and meta-ethics. However, there are three distinct labels that, when layered, give you the full picture of what is happening, how it differs from related fallacies, and why Hobbes's project rests upon it.

  ### 1. The Names of the Move

  **Rhetorically: Persuasive Definition**
  The most common label comes from the philosopher C.L. Stevenson (1938). A **persuasive definition** occurs when a speaker alters the descriptive meaning of a term (its factual content) while retaining its emotive meaning (its evaluative weight) to support a conclusion.
  *   *Example:* Defining "Justice" not as "fairness" (the contested term) but as "obedience to the sovereign" (the Hobbesian term), while keeping the positive moral glow of the word "Justice."
  *   *Why it fits:* It captures the "laundering" you described. The definition looks like a neutral clarification, but it is actually a rhetorical weapon designed to steer the deduction.

  **Logically: Conflating Analytic and Synthetic Propositions**
  This is the deeper philosophical error. An **analytic** proposition is true by definition (e.g., "All bachelors are unmarried"). A **synthetic** proposition is true by fact or observation (e.g., "All bachelors are unhappy").
  *   *The Move:* The arguer treats a synthetic claim (a substantive moral or political claim that could be otherwise) as if it were an analytic claim (a necessary truth derived from definitions).
  *   *Why it fits:* Hobbes wants political truths to have the necessity of geometry. In geometry, "A triangle has three sides" is true because we *define* it so. In politics, "The Sovereign must have absolute power" is a substantive claim. Hobbes defines "Commonwealth" in such a way that absolute power becomes a definitional necessity. He turns a policy preference into a tautology.

  **Politically: Rationalist Constructivism**
  The political philosopher Michael Oakeshott, in his critique of Hobbes, describes this as the error of **Rationalism**. It is the belief that politics is a technical problem solvable by applying a pre-meditated method (geometry) rather than a practical activity based on tradition and experience.
  *   *Why it fits:* It explains *why* the maneuver fails. You can define a triangle however you like, and it will exist in your mind. You cannot define "The People" or "Justice" and expect reality to conform. The quarrel stops only if everyone accepts your dictionary, which they never do in a genuine dispute.

  ### 2. Distinction from Begging the Question (*Petitio Principii*)

  You asked how this is distinct from begging the question. They are cousins, but the mechanism is different.

  *   **Begging the Question** is a flaw in the *inference*. It occurs when the conclusion is assumed in the premises of the argument.
      *   *Structure:* $A$ is true because $B$ is true, and $B$ is true because $A$ is true.
      *   *Detection:* You can spot it by tracing the logical steps. The circle is in the movement from premise to conclusion.
  *   **Definitional Stipulation (Your Move)** is a flaw in the *foundation*. The inference itself may be perfectly valid. The circle is buried in the *meaning of the terms* used in the premises.
      *   *Structure:* Define $X$ as $Y$. Therefore, $X$ is $Y$.
      *   *Detection:* The argument is formally valid. The error is that the definition has done all the work, rendering the syllogism **trivial**. It hasn't proved anything; it has merely unfolded a linguistic package.

  **For your fiction:** A character begging the question sounds circular ("We must do this because it is necessary"). A character using definitional stipulation sounds rigorous and precise ("By 'necessary,' I mean 'that which preserves the sovereign,' and since this preserves the sovereign, it is necessary"). The latter is more dangerous because it wears the mask of clarity.

  ### 3. Distinction from "Definitions Carrying Evaluation"

  You also asked how this differs from the idea that a definition can itself carry an evaluation. This is a subtle but crucial edge.

  *   **The Idea:** All ethical definitions carry evaluation. If I define "Courage" as "enduring risk for a good end," I have built "good" into the definition. This is often unavoidable (see: "Thick Ethical Concepts" in Bernard Williams).
  *   **The Move (The Error):** The error is not that the definition *has* an evaluation, but that it **conceals** the evaluation as a neutral linguistic fact.
  *   **The Distinction:**
      *   *Honest Evaluative Definition:* "For the purposes of this argument, I will define Justice as Equality, though I acknowledge this is a normative choice."
      *   *The Hobbesian Maneuver:* "Let us agree on what Justice *is*. Clearly, Justice is the Law of the Sovereign. Therefore, to question the Sovereign is Unjust."
      *   *The Edge:* The maneuver fails when the interlocutor realizes the definition is not a clarification of usage (Lexical Definition) but a new rule imposed for the sake of the argument (Stipulative Definition), passed off as the former.

  ### 4. The Test: Moore's "Open Question Argument"

  If your characters need a way to detect or defeat this move, give them the tool G.E. Moore devised in 1903 to critique exactly this kind of reasoning.

  **The Open Question Test:**
  If someone defines a moral term (e.g., "Good") as a natural or defined property (e.g., "Pleasure" or "Obedience"), ask: *"Is it still an open question whether [Property] is [Moral Term]?"*

  *   *Hobbes:* "Justice is obedience to the law."
  *   *Critique:* "I understand that obedience is the law. But is it *just*?"
  *   *Result:* If the question still makes sense (it is not a tautology like "Is a bachelor unmarried?"), then the definition has failed to capture the essence. It has merely stipulated a link.

  In your novel, a character who sees through the "geometric" argument is one who realizes that the definition has not closed the question, only silenced it.

  ### 5. Why Hobbes's Hope Turns on This Mistake

  You suspect Hobbes's hope turns on this mistake. You are correct, but with a caveat: Hobbes likely did not see it as a mistake. He was a **Nominalist**. He believed that truth is not "out there" in the world, but is simply the correct ordering of names.

  *   **Geometry:** Works because we *construct* the figures. We define the circle, so we know its properties with certainty.
  *   **Politics:** Hobbes tries to *construct* the Commonwealth in the same way. He defines the "Person of the State" so precisely that its rights become geometric necessities.

  **The Failure:**
  The maneuver fails because human beings are not geometric figures. In geometry, the definition creates the object. In politics, the object (human conflict, passion, history) exists *before* the definition. When you define "Justice" to suit your deduction, reality pushes back. The "quarreling" doesn't stop because the opponents simply reject your dictionary. They realize you have defined the problem out of existence rather than solving it.

  ### Summary for the Writer

  *   **The Label:** Call it **"Persuasive Definition"** (rhetorical) or **"Treating Synthetic Claims as Analytic"** (logical). In the mouth of a critic, it might be called **"Definitional Fiat."**
  *   **The Sensation:** It feels like clarity, but it is actually **triviality**. The argument is airtight because it says nothing.
  *   **The Character:** The character using this move should be obsessed with *precision* and *order*. They should be frustrated when others refuse to accept their definitions, viewing it as irrationality rather than disagreement.
  *   **The Counter:** The character opposing them should not attack the logic (which is valid) but the **cost of the definition**. "You have defined 'Safety' in a way that excludes 'Freedom.' You have proved your point only by changing the subject."

  This maneuver is the intellectual equivalent of moving the goalposts and then claiming you scored a goal because the ball is now inside the new net. Hobbes hoped that if we all agreed on where the net was, the game would end. Your intuition is right: the game ends only if we agree to stop playing.
