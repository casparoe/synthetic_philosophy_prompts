answer: |-
  Good evening, colleagues, friends, and family.

  Eighteen years is a considerable orbit. To serve as President of this society for that duration requires a gravity all its own. For many of us, [President's Name] is the reason we look up. He taught me how to balance a tube against the night, how to find the ring of Saturn without shaking the mount. But we are gathered here to honour the whole man, and that requires us to navigate a certain tension in this room.

  We are a society of astronomers. To most here, astrology is a historical curiosity at best, and nonsense at worst. Yet, to his family and neighbours, [President's Name]'s charts are maps of meaning. I stand somewhere in the middle. When my daughter was born, he gave me a hand-drawn nativity. I keep it on my desk. I do not treat it as physics, yet I cannot dismiss it as mere paper.

  To understand how to hold these two truths, I suggest we look not to the modern divide, but to Johannes Kepler.

  Kepler, as you know, earned his living casting horoscopes. Yet he drew a sharp line that we might do well to observe tonight. He argued that the heavens do not act upon us with a brute, physical force. There is no ray gun in the stars. Instead, he proposed that what matters is the geometry. The planets form configurations, and it is this geometry, received here on Earth, that resonates with the human soul. The soul meets the pattern with a vital power of its own.

  In this light, [President's Name]'s eighteen years resemble that defensible core. He has never claimed the planets compel us. Rather, he has offered us a geometry to contemplate. When he cast a chart for a neighbour, he was not building a cage of fate; he was offering a mirror. He invited people to consider their own lives against the grand architecture of the sky. That is not superstition; it is a form of poetry grounded in observation.

  However, Kepler was also scathing about the machinery that purported to forecast specific events. He refused to be a marketplace entertainer, promising to tell you when you would marry or when the rain would fall. He knew that to claim such precision was to lie.

  Here, too, our President follows the master. You will not find him predicting lottery numbers or election results. He has never used the stars to frighten or to manipulate. He has avoided the indefensible superstructure of fortune-telling, sticking instead to the harmony of the spheres. He respects the sky too much to claim he can bully it into revealing next Tuesday's weather.

  So, to my sceptical colleagues: you need not fear I am endorsing pseudoscience. We are honouring a man who values geometry, who respects the limits of knowledge, and who refuses to cheapen the cosmos for a quick prediction. And to his family: you need not fear mockery. We recognise that the charts he drew were acts of care, ways of marking the significance of a birth or a life, connecting the soul to the geometry of the whole.

  Kepler looked for the music of the spheres. [President's Name] has helped us hear it, not by claiming to control the instruments, but by teaching us how to listen.

  To the President. May your retirement be filled with clear skies and quiet nights.
