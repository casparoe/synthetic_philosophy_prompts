      *   Conditions for A being right: In cases where economic shock is drastic and immediate (e.g., sudden collapse of profitability), interest might be the primary driver, with honor following.

  5.  **Review against Constraints:**
      *   Rate each move? Yes.
      *   Brief justification? Yes.
