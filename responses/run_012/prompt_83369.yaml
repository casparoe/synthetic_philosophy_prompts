answer: |-
  Here is the principle, committed and precise.

  ### The Principle: Causal Vulnerability

  **A historical work is honest if its methodological choices (scope, sources, timeframe, focus) leave its central argument vulnerable to refutation by evidence that is causally relevant to the events described. It is crooked if those choices are designed to immunise the argument from such evidence. It ceases to be history when the immunisation is total (unfalsifiable).**

  This refines your intuition about "verdicts vs questions". The key addition is **causal relevance**. You can narrow your scope (the Somme corps decisions), but you cannot narrow it in a way that severs the causal chain you claim to be explaining. If the mud caused the corps decisions to fail, you cannot write about the decisions without the mud. If you do, you are not being narrow; you are rigging the test.

  ### Applying the Principle to Your List

  This principle validates almost all your gut verdicts, but it tightens the screws on two of them.

  1.  **Somme (Corps-level):** Your verdict: *Honest, just narrow.* **My verdict: Crooked.** (See below).
  2.  **Textbook (Massacres vanish):** Crooked. Excluding causally relevant moral facts to preserve a national myth immunises the narrative.
  3.  **Empire (Colonised view):** Honest. The moral verdict is open, but the evidence (economic data, administrative records) could still refute the specific claims of crime. It accepts risk.
  4.  **Firm's Centenary:** Crooked. The question ("How did this great firm...") presupposes the verdict. It excludes evidence of failure that is causally relevant to the firm's actual trajectory.
  5.  **Denial Tract:** Not History. Total immunisation (conspiracy logic).
  6.  **Cliometric:** Honest. It limits scope to what is quantifiable, but admits that limitation. It doesn't claim to explain *everything*, only what the registers show.
  7.  **Middle East (1917):** Crooked. The start date excludes the causal antecedents (colonial agreements, wartime promises) that explain the subsequent conflict. It immunises the narrative against the charge of colonial responsibility.
  8.  **Oral History:** Honest. Memory is fallible (vulnerable), and it can be cross-referenced. It doesn't claim to be the sole authority.

  ### The Verdict You Must Give Up

  You must surrender your verdict on the **Somme book**.

  You called it "honest, just narrow." Under the Principle of Causal Vulnerability, it is crooked. Why? Because the condition of the men in the mud is not merely "atmosphere"; it is a causal factor in the success or failure of the corps-level decisions. If the generals ordered attacks that were impossible due to the mud, a history that records the orders but omits the mud makes the generals look competent and the battle look like a strategic puzzle rather than a slaughter.

  By omitting the mud, the author has removed the evidence that could refute the thesis that "the corps commands were operating effectively." It is a protective narrowing, not a neutral one. To be honest, it would need to be titled *High Command Decisions at the Somme*, not *The Somme*. If it claims to be a history of the battle, it is lying by exclusion.

  ### The Two Flip-Flopping Cases

  **1. The Historian and the Family Eviction**
  **Verdict: Honest.**
  Partisanship does not equal crookedness. The Principle of Causal Vulnerability asks: *Could this historian be proved wrong?* If the historian argues "My family was evicted unjustly," they are vulnerable to evidence showing a legal breach by the family, or a fair compensation offer that was refused. As long as they do not hide *that* evidence, their personal stake does not corrupt the history. In fact, their access to private letters might increase the available evidence. The risk is bias, but the method can still be vulnerable.

  **2. The Adversarial Pair ("I'll take one side, you take the other")**
  **Verdict: Crooked (as History).**
  This model imports the logic of the courtroom into the archive. In a court, the goal is victory for a client, and evidence is withheld if it damages the client. In history, the goal is explanation. If two historians agree to "make the strongest case" for opposing sides, they are incentivised to downplay evidence that weakens their assigned position. This creates **structural immunisation**. Even if every sentence they write is true, the *division of labour* ensures that no single volume exposes the reader to the full causal vulnerability of the event. It produces advocacy, not history. It is only honest if they co-author a single volume where both sets of evidence are weighed together.

  ### A New Case: The Politician's Biography

  **Case:** A biography of a Prime Minister that relies exclusively on their public speeches and parliamentary records, explicitly excluding their private diaries and letters because, the author says, "Public action is what matters for a statesman."

  **Verdict: Crooked.**
  **Reasoning:** This fails the Principle of Causal Vulnerability. A politician's private intentions often explain their public actions (e.g., a public compromise made because of a private threat). By excluding the private papers, the author immunises the subject against the charge of hypocrisy or hidden motive. The author claims the scope is "Public Action," but if the book is titled *The Life of X*, the reader expects an explanation of the *causes* of that action. Excluding the private mind severs the causal chain. It is a "Firm's Centenary" move applied to a person.

  ### Summary

  Your gut is right: there is a distinction. It isn't about objectivity (which is impossible); it's about **risk**. Honest history risks being wrong. Crooked history rigs the scope so it can't be.

  You need to stop letting "narrowness" off the hook. When narrowness protects the subject from the consequences of their own actions (the Somme generals, the Firm, the 1917 start date), it is not scholarship. It is protectionism.
