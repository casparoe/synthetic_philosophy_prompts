  # Decision Tree: The Metaphysics of the "User Illusion"

  **Root Commitment:** We agree that introspection reveals how consciousness *appears*, not necessarily what it *is*. (The "Phenomenal Concept" Strategy).

  ---

  ### **Node 1: The Reality Check**
  **Question:** When you attend to a vivid experience (e.g., a pain or a red afterimage), is there a genuine property of "felt-quality" instantiated in your brain, or is that a cognitive misreport?
  *   **Yes, a genuine property exists:** Go to **Node 2** (Realists).
  *   **No, it's a misreport:** Go to **Node 6** (Anti-Realists).

  ---

  ### **Node 2: The Nature of the Property**
  **Question:** Is this property something *over and above* the physical/functional role of the brain state (i.e., could a perfect physical duplicate lack it)?
  *   **Yes, it outruns physical description:** Go to **Node 3** (Non-Reductive Realists).
  *   **No, it is identical to a physical/functional role:** Go to **Node 4** (Reductive Realists).
      *   *Note:* This separates those who think qualia are real but physical from those who think they are spooky.

  ---

  ### **Node 3: The Distribution of the Property**
  **Question:** Is this non-physical property fundamental to all matter, or does it emerge only in complex systems?
  *   **Fundamental to all matter:** **Leaf 1: Panpsychism.**
  *   **Emergent in complex systems:** **Leaf 2: Property Dualism / Emergentism.**

  ---

  ### **Node 4: The Mechanism of Access (Reductive)**
  **Question:** Does a brain state become conscious only when it is targeted by a *higher-order* mental state (a thought about the state)?
  *   **Yes, requires higher-order monitoring:** **Leaf 3: Higher-Order Theory (HOT).**
  *   **No, first-order states can be conscious:** Go to **Node 5**.

  ---

  ### **Node 5: The Scope of Access (Reductive)**
  **Question:** Is the consciousness of the state constituted by its availability to *global* systems (speech, reasoning, memory)?
  *   **Yes, global broadcasting is key:** **Leaf 4: Global Workspace Theory (GWT).**
  *   **No, consciousness is local to the representation:** **Leaf 5: First-Order Representationalism.**
      *   *Note:* Nodes 4 & 5 separate the "Exist but nothing like introspection" crowd into their mechanistic camps. Introspection suggests intrinsicness; these views say it's relational.

  ---

  ### **Node 6: The Target of the Error (Anti-Realist)**
  **Question:** If the "felt-quality" isn't real, is the primary error that we posit a *self* having experiences, or that we posit *properties* in the experience?
  *   **The Self is the error (Experience is real/transparent):** **Leaf 6: Self-Model Theory (SMT).**
  *   **The Properties are the error:** Go to **Node 7**.
      *   *Note:* This forces apart "Self is an illusion" from "Consciousness is an illusion."

  ---

  ### **Node 7: The Status of the Concept**
  **Question:** Is the concept of "phenomenal consciousness" logically coherent but empty (like "unicorn"), or fundamentally confused (like "phlogiston")?
  *   **Coherent but empty (nothing fits the definition):** **Leaf 7: Hard Eliminativism.**
  *   **Fundamentally confused (the definition is flawed):** Go to **Node 8**.

  ---

  ### **Node 8: The Source of the Confusion**
  **Question:** Does the confusion stem from misrepresenting the *nature of reality*, or from misrepresenting our own *agency*?
  *   **Nature of Reality (We think properties exist, they don't):** **Leaf 8: Illusionism (Frankish-style).**
  *   **Our Own Agency (We think we cause actions, we don't):** **Leaf 9: The Illusion of Conscious Will.**
      *   *Note:* This forces apart "Consciousness is an illusion" from "Will is an illusion."

  ---

  ## **The Leaves: Positions & Awkward Commitments**

  1.  **Panpsychism:** Consciousness is a fundamental feature of matter.
      *   *Awkward Commitment:* You must accept that electrons or protons have some primitive form of experience, or explain precisely where the cutoff is without arbitrariness.
  2.  **Property Dualism:** Phenomenal properties are real but non-physical emergents.
      *   *Awkward Commitment:* You must explain how non-physical properties interact with physical brains without violating the causal closure of the physical world.
  3.  **Higher-Order Theory (HOT):** Consciousness is a relational property created by inner scanning.
      *   *Awkward Commitment:* You must accept that animals or infants without the capacity for higher-order thought have no conscious experiences, only unconscious states.
  4.  **Global Workspace Theory (GWT):** Consciousness is information broadcast to multiple systems.
      *   *Awkward Commitment:* You must accept that a state can be conscious even if the subject is not attending to it, provided it is broadcast, or deny consciousness to rich unconscious processing that looks like broadcasting.
  5.  **First-Order Representationalism:** Consciousness is just representing the world accurately.
      *   *Awkward Commitment:* You must accept that a thermostat or a simple camera could be conscious if its representation is sufficiently robust, or draw a magic line at "biological."
  6.  **Self-Model Theory (SMT):** Experience is real, but the "I" having it is a transparent model.
      *   *Awkward Commitment:* You must explain why the illusion of self is so persistent and functionally necessary if it is ontologically false, without slipping back into realism.
  7.  **Hard Eliminativism:** "Phenomenal consciousness" is a folk-psychological term that refers to nothing.
      *   *Awkward Commitment:* You must insist that when people say "pain hurts," they are stating a falsehood, as there is no "hurt" property to instantiate.
  8.  **Illusionism:** Phenomenal properties don't exist, but the *belief* in them is a useful cognitive shortcut.
      *   *Awkward Commitment:* You must explain how an illusion can *seem* like something without there being something it seems like, without contradicting yourself.
  9.  **The Illusion of Conscious Will:** Experiences exist, but the feeling of initiating them is post-hoc.
      *   *Awkward Commitment:* You must accept that your conscious decision to raise your hand did not cause your hand to rise, making "you" a passenger in your body.

  ---

  ## **Philosophical Footnotes on the Tree Structure**

  **Unoccupied Combinations:**
  *   **"Hard Eliminativism + Real Self":** Nobody occupies this. If you eliminate the properties of experience, there is nothing left for a self to *be*. It is incoherent to claim the *qualia* are fake but the *subject* is real.
  *   **"Illusion of Will + Property Dualism":** Rare to non-existent. If you believe in non-physical phenomenal properties, you usually want them to *do* something (downward causation). Accepting they are causally inert (Epiphenomenalism) is unattractive enough that few pair it with robust dualism.

  **Indistinguishable Leaves:**
  *   **Illusionism (Leaf 8) vs. Hard Eliminativism (Leaf 7):** In practice, these are often indistinguishable. Both deny the existence of phenomenal properties. The distinction rests entirely on the philosophy of language (whether the term is "confused" or just "empty"). If your group doesn't care about semantic externalism, these leaves functionally merge.
  *   **GWT (Leaf 4) vs. First-Order Representationalism (Leaf 5):** Depending on how "global" the workspace is defined, these can blur. If "global" just means "available to the whole brain," it looks like First-Order. The tree forces a split based on whether *broadcasting* is constitutive (GWT) or merely correlated (FOR).

  **The "Three-Way Split" on Phenomenal Properties:**
  *   **Don't Exist:** Leaf 7 (Eliminativism) & Leaf 8 (Illusionism).
  *   **Exist but Misreported:** Leaf 3 (HOT), Leaf 4 (GWT), Leaf 5 (FOR). (These claim introspection reports intrinsicness, but the reality is relational).
  *   **Concept Confused:** Leaf 8 (Illusionism). (This is the specific "User Illusion" claim where the concept itself is the bug).

  **The "Illusion" Ambiguity Check:**
  *   **Consciousness is Illusion:** Leaf 8.
  *   **Self is Illusion:** Leaf 6.
  *   **Will is Illusion:** Leaf 9.
  *   *Note:* A reader can theoretically answer "Yes" to Node 1 (Realism) but still land in Leaf 9 (Will Illusion) if they answer "No" at Node 8's agency branch? *Correction:* The tree routes Will Illusion through the Anti-Realist branch (Node 6->8). To capture "Realist about Qualia, Illusionist about Will," the reader would need to answer "Yes" at Node 1, but then find no branch for Will.
      *   *Fix for the User:* If a reader believes Qualia are Real (Node 1: Yes) but Will is an Illusion, they currently have no leaf. They would land in 1-5. This is a limitation of the tree designed to prioritize the "Phenomenal Property" ambiguity.
      *   *Philosopher's Note:* I have deliberately routed "Will Illusion" through the Anti-Realist branch because in the literature (Wegner, etc.), the "Illusion of Will" is often paired with a deflationary view of consciousness. However, a **Compatibilist Realist** (Qualia Real + Will Illusion) is a valid position not captured as a distinct leaf here. They would likely end up in Leaf 3, 4, or 5, and must manually add the "Will is Illusion" commitment. I flag this as a **Blind Spot**: The tree prioritizes the *Phenomenal Property* ambiguity over the *Agency* ambiguity for Realists.
