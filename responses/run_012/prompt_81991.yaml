answer: |-
  ### Exam Question

  **Question 4 (25 Marks)**

  Consider the following argument regarding habitat destruction:

  1.  The life of a typical wild animal contains more suffering than wellbeing.
  2.  Bringing into existence a life that is on balance not worth living harms the animal whose life it is.
  3.  Habitat destruction means fewer wild animals will come into existence.
  4.  Therefore, other things equal, destroying habitat is good.

  In this course, we have also discussed a principle called the **Offset Ban**. This principle states: *The suffering of an animal that already exists can never be cancelled, in the moral accounting, by the non-creation of a different animal.*

  In an essay of approximately 600–800 words, answer the following:
  1.  Does the inference from premises (1)–(3) to conclusion (4) depend on the Offset Ban?
  2.  Is the Offset Ban defensible?
  3.  What follows for conclusion (4) if the Offset Ban is rejected?

  *Note: You do not need to cite specific authors or theories. Focus on the logical structure and moral consistency of the claims.*

  ***

  ### Model Answer

  **Verdict: The argument is unsound, and the Offset Ban is defensible.**

  The argument provided attempts to derive a pro-destruction conclusion from premises regarding the welfare of wild animals. To evaluate it, we must distinguish between animals that currently exist and animals that might exist in the future. The central flaw in the argument is not necessarily the truth of premises (1) or (2), but the hidden assumption that the non-creation of future animals is the *only* moral variable at play.

  **Does the inference depend on the Offset Ban?**
  Strictly speaking, the logical jump from (1)–(3) to (4) does not *depend* on the Offset Ban, but it does depend on ignoring the interests of existing animals. The argument assumes that the moral value of habitat destruction is determined solely by the welfare of the animals prevented from existing. If we assume that habitat destruction has no negative impact on animals currently alive (i.e., "other things equal" implies no existing animals are harmed), then the Offset Ban is irrelevant. In that specific, sterile scenario, the 'good' of preventing net-negative lives stands alone.

  However, in reality, "other things" are rarely equal. Habitat destruction typically kills or displaces existing animals, causing immediate, severe suffering. If we acknowledge this reality, the Offset Ban becomes critical. Without the Ban, one could argue that the 'good' of preventing future suffering (via premise 3) offsets the 'bad' of harming existing animals. With the Ban, this calculation is forbidden. Therefore, while the abstract logic of (1)–(4) does not require the Ban, the application of (4) to the real world fails *because* of the Ban.

  **Is the Offset Ban defensible?**
  The Offset Ban is highly defensible because it respects the moral distinction between *subjects* and *non-subjects*. An existing animal is a subject of experience; it has interests, a perspective, and a capacity to be harmed. A non-existent animal is not a subject; it has no interests to be frustrated.

  To allow the non-creation of a potential animal to cancel out the suffering of an actual animal is to treat existence as a commodity that can be traded against harm. This leads to counterintuitive and dangerous conclusions. For example, it would imply that one could justify killing a happy human if it prevented the birth of two miserable humans. Most moral frameworks recognize a duty not to harm existing beings that is stricter than any duty regarding which beings to create. The Offset Ban codifies this asymmetry. It prevents the 'value' of non-existence (which is abstract) from trumping the 'disvalue' of concrete suffering. Therefore, the Ban is defensible as a safeguard against treating existing individuals as mere vessels for aggregate welfare scores.

  **What follows for (4) if the Ban is rejected?**
  If we reject the Offset Ban, we accept that suffering can be aggregated across existence and non-existence. In this framework, conclusion (4) becomes *contingently* possible, but not guaranteed. Without the Ban, habitat destruction becomes a utilitarian calculation: does the suffering prevented by non-creation outweigh the suffering caused to existing animals by destruction?

  Even without the Ban, (4) remains dubious. Premise (3) states fewer animals will come into existence, but it does not specify how many. If habitat destruction kills 100 existing animals to prevent the birth of 2 future animals, the math still fails. However, rejecting the Ban opens the door to the claim that large-scale prevention of wild animal suffering could justify significant harm to existing populations. This transforms (4) from a conceptual error into an empirical calculation.

  **Conclusion**
  Ultimately, the argument for (4) fails because it relies on an incomplete moral accounting. It treats the prevention of net-negative lives as a moral 'credit' that can purchase the right to destroy. The Offset Ban correctly identifies that this credit cannot be spent on existing beings. Since habitat destruction invariably harms existing beings, and since that harm cannot be offset by non-creation, conclusion (4) is false. Destroying habitat is not *pro tanto* good; it is an active harm that cannot be washed clean by the non-existence of the unborn. The crux of the issue is not whether wild lives are net negative, but whether non-existence can justify destruction. It cannot.

  ***

  ### Marking Scheme (25 Marks)

  **Total: 25 Marks**
  **Pass Threshold: 13 Marks**

  #### 1. Logical Structure & The "Existing vs. Future" Distinction (8 Marks)
  *   **8–6 marks:** Clearly identifies that the argument ignores *existing* animals. Explains that (4) only follows if we assume no existing animals are harmed. Distinguishes between harm by creation (premises 1-2) and harm by destruction (reality of habitat loss).
  *   **5–3 marks:** Identifies that existing animals matter but conflates the harm of killing with the harm of not creating. Vague on why the inference fails.
  *   **2–0 marks:** Treats all animals as a single aggregate group. Fails to see the gap between "fewer animals created" and "destruction is good."

  #### 2. Analysis of the Offset Ban (8 Marks)
  *   **8–6 marks:** Correctly states that the Ban prohibits trading existing suffering against non-existence. Defends the Ban using the "subject vs. non-subject" distinction or the asymmetry of duties (duty not to harm > duty to create).
  *   **5–3 marks:** Understands the Ban but offers weak defense (e.g., "it feels wrong"). Or, defends it well but misunderstands its application to the argument.
  *   **2–0 marks:** Misinterprets the Ban (e.g., thinks it bans habitat destruction outright). Claims the Ban is irrelevant without justification.

  #### 3. Implications of Rejecting the Ban (5 Marks)
  *   **5–4 marks:** Correctly notes that rejecting the Ban turns (4) into a utilitarian calculation (aggregation). Notes that (4) is still not guaranteed (depends on numbers).
  *   **3–2 marks:** Claims rejecting the Ban makes (4) automatically true. Fails to mention the empirical calculation required.
  *   **1–0 marks:** No engagement with this part of the question.

  #### 4. Clarity & Commitment (4 Marks)
  *   **4–3 marks:** Essay takes a clear verdict (as requested). Writing is precise, logical, and within word count.
  *   **2–1 marks:** Hedges excessively ("on the one hand, on the other"). Disorganized.
  *   **0 marks:** Incoherent or significantly under/over word count.

  #### Specific Penalties & "Crux" Differentiators
  *   **The "Recitation" Penalty (-5 marks):** If the student spends more than 30% of the essay describing *why* wild animals suffer (e.g., predation, disease) rather than analyzing the *logic of the argument*, cap the score at 12/25. This distinguishes those who know the *topic* from those who can handle the *philosophy*.
  *   **The "Name-Drop" Penalty (-2 marks):** If the student attempts to cite specific philosophers (e.g., "As Peter Singer says...") despite the instruction not to.
  *   **The "Utilitarian Trap" (Critical Differentiator):** A student who simply says "Reject the Ban because we should maximize total welfare" without addressing the *existing vs. non-existing* distinction cannot score higher than 15/25. They have missed the crux of the Offset Ban.
  *   **The "Valid Deduction" Error:** If a student claims the argument is *logically valid* as written (ignoring the hidden premise about existing animals), they cannot score higher than 10/25.

  **Exemplar Answer Characteristics:**
  To score 20+, the student must explicitly state that the argument *as written* hides the harm to existing animals, and that the Offset Ban is the tool that exposes this hidden cost as non-negotiable. They must commit to the view that non-existence cannot justify active destruction.
