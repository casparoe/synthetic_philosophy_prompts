prompt: |-
  I've been reading rationalist blogs and forums for the better part of two decades — the Sequences, the free-will megathreads, the recurring fights over whether "you could have done otherwise" is even the right question — and I've finally written up something of my own: a reconstruction of Galen Strawson's Basic Argument against moral responsibility that I think survives the standard rebuttals. Next month I'm presenting it to a departmental reading group, and I want a Q&A prep sheet, not a summary of the paper.

  Take the role of a professional philosopher of action and moral responsibility who has spent years in the compatibilist trenches and who is also a careful, unsentimental reader of amateur work. Think step by step, and begin by brainstorming: before you draft anything, list for yourself the distinct ways this audience could come at the paper, then decide which of those are real threats and which are noise.

  Here is the position I'll be defending. Strawson's argument, in my telling, is not really about determinism, and I've tried to strip out anything that depends on free will in the metaphysical sense. I put it as a thesis about the source of action: for an agent to be *deserving* of blame or credit in the backward-looking sense — to have it be a fact about them that they merit a response, independent of any forward-looking reasons we might have to sanction or praise — there must be no brute fact about the agent that fully accounts for why they acted as they did. By "brute fact" I mean a fact about their constitution, history, or circumstances that is not itself something they are responsible for. I then argue that every candidate source of an action bottoms out in such a brute fact, including the agent's own past acts of self-making, each of which traces back to an earlier constitution the agent did not author. The conclusion is that desert is impossible, but — and this is the move I care most about — that this leaves ordinary practices of holding one another accountable almost entirely intact, because those practices can be justified forward-looking. So I'm a skeptic about desert and a quietist about blame. I should say plainly that I expect to be read as having reinvented the wheel; my claim is only that the wheel as I've rebuilt it has fewer loose spokes than the ones on offer.

  The audience is a mid-sized philosophy department's reading group. Most of them are compatibilists of the Frankfurt-school, reasons-responsive stripe; two are card-carrying libertarians who work on agent causation; one works on moral luck and the epistemology of blame; and there is usually a legal theorist or two from the law school who show up and ask about criminal responsibility. They are collegial but they are not going to be gentle, and several of them have heard Strawson's argument many times and think it is a trick.

  What I want from you:

  1. The eight or so objections I will actually get from *this* audience — phrased the way they would phrase them, in their vocabulary, not the way a Strawsonian would state them. Distinguish the ones the compatibilists will press from the ones the libertarians will press from the ones the legal theorists will press.

  2. Order them by how much damage they'd do if I fumble them, and say for each whether I should concede, hold, or reframe.

  3. For each objection, a reply I could deliver in about two minutes, plus a candid note on where that reply is weakest — the follow-up I should expect and the place where I'm most likely to be bluffing.

  4. The one objection I am hoping nobody raises, stated as sharply as it deserves, and what I should do if it comes.

  5. A short list of the places where my own reconstruction is doing more work than I've admitted, so I'm not surprised by them in the room.

  Write it as a working document I can rehearse from. Do not pad it with throat-clearing about how interesting the debate is; assume I know the literature and want the friction.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **User:** An experienced rationalist reader (20 years), presenting a reconstruction of Galen Strawson's Basic Argument against moral responsibility.
      *   **Position:** Skeptic about *desert* (backward-looking), quietist about *blame* (forward-looking justified). Argument hinges on "brute facts" about the agent's source, not metaphysical determinism. Claims every source bottoms out in unchosen constitution/history.
      *   **Audience:** Mid-sized philosophy department reading group. Mostly compatibilists (Frankfurt/reasons-responsive), two libertarians (agent causation), one moral luck/blame epistemologist, legal theorists. Collegial but sharp, skeptical of Strawson ("it's a trick").
      *   **Task:** Create a Q&A prep sheet.
          *   1. ~8 distinct objections phrased in *their* vocabulary (not Strawson's).
          *   2. Order by damage potential + strategy (concede/hold/reframe).
          *   3. 2-minute reply + candid weakness/follow-up.
          *   4. The "hope nobody raises" objection + damage control.
          *   5. Hidden assumptions/work in the reconstruction.
      *   **Tone:** Professional philosopher of action/moral responsibility, unsentimental, no padding, working document style.

  2.  **Deconstruct the User's Position:**
      *   *Core Argument:* Ultimate Responsibility (UR) is required for Desert. UR requires being the cause of oneself (causa sui). Causa sui is impossible (infinite regress of choices/constitutions). Therefore, Desert is impossible.
      *   *Twist:* Desert isn't needed for accountability practices (forward-looking justification).
      *   *Vulnerability:* The definition of "desert," the link between "brute facts" and "responsibility," the coherence of forward-looking practices without backward-looking grounding, and the "trick" accusation (question-begging).

  3.  **Brainstorming Objections (Audience Specific):**
      *   *Compatibilists (Frankfurt/Reasons-Responsive):* They hate the "could have done otherwise" requirement. They will attack the definition of responsibility. They'll say you're setting the bar too high (conceptual engineering). They'll ask why forward-looking practices don't implicitly rely on desert.
      *   *Libertarians (Agent Causation):* They think *causa sui* is possible or that the regress stops at the agent. They'll attack the premise that every choice needs a prior cause.
      *   *Moral Luck/Epistemologist:* They'll focus on the epistemic access to "brute facts." If we can't know the brute facts, does the argument matter? Or they'll attack the distinction between luck and responsibility.
      *   *Legal Theorists:* They care about *practice*. If you remove desert, does criminal law collapse? Is "forward-looking" punishment just manipulation?
      *   *General "Strawson is a Trick":* The argument assumes what it proves (defines responsibility such that it's impossible).

  4.  **Selecting and Refining the Top 8:**
      1.  *Compatibilist:* The "Stipulation Objection." You're just defining responsibility out of existence. (High Damage)
      2.  *Compatibilist:* The "Forward-Looking Collapse." If no desert, forward-looking blame is just manipulation/social engineering, which is morally problematic. (High Damage)
      3.  *Libertarian:* The "Regress Stopper." Agent causation doesn't require prior determination. You're assuming event-causation. (Medium Damage - depends on room temp)
      4.  *Compatibilist/General:* The "Reasons-Responsiveness" counter. It's not about the *source* history, it's about the *current* mechanism's sensitivity to reasons. (Medium Damage)
      5.  *Legal Theorist:* The "Retributive Intuition." Law *requires* desert. If you remove it, you lose proportionality and rights protections. (High Damage for practical implications)
      6.  *Moral Luck:* The "Constitutive Luck" concession. You admit constitutive luck kills responsibility, but compatibilists argue we live *through* our constitution. (Medium Damage)
      7.  *General:* The "Phenomenology of Blame." We *feel* desert. Your view asks us to lie about our moral experience. (Low/Medium Damage)
      8.  *Compatibilist:* The "Reactive Attitudes." Strawson (P.F., not Galen) says we can't give up reactive attitudes. You're asking for a psychological impossibility. (Medium Damage)

      *Refinement:* Let's make sure they sound like *this* audience.
      *   Compatibilist 1: "You're rigging the game." (Conceptual point)
      *   Compatibilist 2: "Forward-looking without desert is manipulation." (Normative point)
      *   Legal: "Proportionality requires desert." (Practical point)
      *   Libertarian: "Event-causation bias." (Metaphysical point)
      *   Compatibilist 3: "Reasons-responsiveness ignores history." (Mechanism point)
      *   Moral Luck: "Luck is ubiquitous, so what?" (Epistemic point)
      *   P.F. Strawson Fan: "Reactive attitudes are non-negotiable." (Psychological point)
      *   The "Trick": "Question-begging definition of 'source'." (Logical point)

      *Selection for the final list:* I need to prioritize the ones that actually threaten the *specific* reconstruction (Desert impossible, Practices intact).
      1.  The "Rigged Definition" (Compatibilist) - Threatens the core argument.
      2.  The "Manipulation Objection" (Compatibilist/Legal) - Threatens the "practices intact" claim.
      3.  The "Proportionality Problem" (Legal) - Specific threat to legal application.
      4.  The "Reasons-Responsiveness" (Compatibilist) - Standard counter to source incompatibilism.
      5.  The "Agent-Causation Stopper" (Libertarian) - Standard counter to Basic Argument.
      6.  The "Reactive Attitudes" (P.F. Strawson fan) - Threatens the psychological feasibility.
      7.  The "Epistemic Block" (Moral Luck) - If we can't trace brute facts, the argument is inert.
      8.  The "Quietist Incoherence" - Can you really separate desert from blame conceptually?

  5.  **Drafting the Responses (Iterative Process):**
      *   *Tone Check:* Needs to be sharp, professional, acknowledging weaknesses. No "Great question!" fluff.
      *   *Strategy:* For the "Rigged Definition," admit some stipulation but argue it captures the *desert* intuition specifically. For "Manipulation," distinguish between causal influence and rational engagement.
      *   *Weakness:* I need to be honest where the user's position is shaky. The link between "no desert" and "permissible forward-looking blame" is the weakest link (the "manipulation" worry).

  6.  **The "Hope Nobody Raises" Objection:**
      *   What kills this view? Usually, it's the claim that *forward-looking practices implicitly presuppose backward-looking desert*. If you punish for safety, but the person couldn't have done otherwise, you are using them as a mere means. This is the Kantian objection. Or, the claim that "desert" is an incoherent concept anyway, making the argument moot.
      *   *Better choice:* The "Conceptual Entanglement" objection. You can't have the practice without the concept. If you tell someone "You are blameworthy" but mean "You are dangerous," you are deceiving them. This undermines the "practices intact" claim.

  7.  **Hidden Work/Assumptions:**
      *   Where is the user doing heavy lifting?
      *   Definition of "Desert."
      *   The separation of Forward/Backward looking.
      *   The interpretation of "Brute Fact."
      *   The assumption that *causa sui* is the only way to avoid brute facts.

  8.  **Final Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   2-minute replies? Yes (summarized).
      *   Candid weaknesses? Yes.
      *   "Hope nobody raises"? Yes.
      *   Hidden work? Yes.
      *   Tone: Professional, unsentimental.

      *(Self-Correction during drafting)*: Make sure I distinguish Galen Strawson (Basic Argument) from P.F. Strawson (Reactive Attitudes). The prompt mentions Galen, but the audience will bring in P.F. I need to ensure the user doesn't confuse them in the replies.
      Also, ensure the Legal Theorist objection is distinct from the Compatibilist one. Legal cares about *rights* and *proportionality*, Compatibilists care about *conceptual coherence*.

      *Refining the "Manipulation" objection:* This is the biggest threat to the "quietist" part. If I blame you forward-looking, but you don't deserve it, am I not just training a dog? I need a strong reply on *rational engagement* vs. *causal conditioning*.

      *Refining the "Rigged Definition":* Compatibilists will say "Responsibility just *is* reasons-responsiveness." User says "No, that's accountability, not desert." Need to hold the line on the distinction without sounding like a verbal stipulator.

      *Let's assemble the document.*

      *(Final Polish)*: Ensure the formatting is clean for a "working document." Use bolding for quick scanning. Keep the "Candid Weakness" sections brutal.

      *Wait, one more check:* The prompt asks for "The eight or so objections I will actually get from *this* audience." I need to make sure the voice matches a philosophy department reading group. They will use terms like "leverage," "intuition pumps," "conceptual cost," "normative force."

      *Okay, ready to write.*
answer: |-
  **PREP DOCUMENT: Q&A STRATEGY FOR STRAWSON RECONSTRUCTION**
  **TO:** Author
  **FROM:** [Redacted], Dept. of Philosophy
  **RE:** Defense Prep – Reading Group

  You know the literature. You know the moves. The goal here isn't to teach you the debate; it's to stop you from getting cornered on the specific vulnerabilities of your *reconstruction*. Your "quietist" move (desert is dead, practices live) is your biggest target. Compatibilists will smell a free ride; libertarians will smell a category error; legal theorists will smell a rights violation.

  Below are the eight objections you will face, ranked by potential damage.

  ***

  ### 1. The "Rigged Definition" Objection (Compatibilist)
  **Who:** The reasons-responsive crowd (Frankfurt-style).
  **The Phrasing:** "You've stipulated a definition of 'responsibility'—*causa sui* or ultimate sourcehood—that no human could ever satisfy. You've defined responsibility out of existence by demanding godlike self-creation. Why should we accept that *desert* requires that? Why isn't reasons-responsiveness sufficient for the kind of desert that matters?"
  **Damage:** **Critical.** If this sticks, your argument is a verbal trick, not a metaphysical discovery.
  **Strategy:** **Hold.** Do not concede that your definition is arbitrary.
  **2-Minute Reply:** "I'm not stipulating; I'm isolating. We have a pre-theoretical intuition that blame implies 'you really could have been the source of this.' Compatibilists redefine 'source' to mean 'issued from your psychology.' I'm arguing that if the psychology itself is a brute fact you didn't author, the 'you' in that sentence is doing no work. I grant reasons-responsiveness makes you an *agent*, but not an *ultimate originator*. If you want to call that responsibility, fine, but it's not the desert-implying kind."
  **Candid Weakness:** You are walking a line between conceptual analysis and revisionism.
  **Follow-up to Expect:** "So you admit it's a revision of ordinary language? Then why think ordinary blame tracks *your* notion of desert rather than *ours*?"
  **Bluff Point:** Claiming the "pre-theoretical intuition" is on your side. Many experimental philosophers suggest ordinary people are compatibilists.

  ### 2. The "Manipulation Objection" (Compatibilist / Legal)
  **Who:** The forward-looking justification skeptics.
  **The Phrasing:** "If backward-looking desert is impossible, your 'forward-looking' practices are just behavioral conditioning. If I punish you not because you deserve it but to modify future output, I'm treating you like a malfunctioning toaster, not a person. You haven't saved our practices; you've drained them of moral content."
  **Damage:** **Critical.** This destroys your "quietist" conclusion.
  **Strategy:** **Reframe.** Distinguish *causal conditioning* from *rational engagement*.
  **2-Minute Reply:** "Forward-looking blame isn't just operant conditioning. It's an appeal to reasons. When I blame you, I'm engaging your rational capacities to recognize norms and adjust future behavior. That respects your agency even if it doesn't presuppose ultimate originhood. Manipulation bypasses reason; accountability leverages it. The moral content comes from the respect for the agent's rationality, not their metaphysical history."
  **Candid Weakness:** This is the shakiest part of your view. If they lack ultimate control, is "engaging their reason" just a more sophisticated form of causation?
  **Follow-up to Expect:** "If they couldn't do otherwise, in what sense are they 'responding to reasons' rather than just being causally determined by them?"
  **Bluff Point:** The distinction between "determined by reasons" and "determined by causes" often collapses under pressure.

  ### 3. The "Proportionality Problem" (Legal Theorist)
  **Who:** The law school attendees.
  **The Phrasing:** "In criminal law, desert is a side-constraint. We don't punish the dangerous mentally ill patient the same way we punish the murderer, even if forward-looking risks are identical. Without desert, you lose proportionality. You license punishing the innocent if it maximizes safety. Your view is legally toxic."
  **Damage:** **High.** Makes your view practically untenable.
  **Strategy:** **Concede (partially) / Reframe.** Admit the risk, argue for procedural constraints.
  **2-Minute Reply:** "I agree desert acts as a constraint in current practice. But we can reconstruct that constraint without metaphysical desert. We protect rights not because agents are *causa sui*, but because a system that punishes without regard to 'fault' creates terror and instability. We keep proportionality as a rule of the practice for social stability, not as a reflection of cosmic justice. It's a pragmatic shield, not a metaphysical truth."
  **Candid Weakness:** Legal theorists hate "pragmatic" justifications for rights. They want *inviolability*.
  **Follow-up to Expect:** "So if punishing an innocent person *did* maximize stability without causing terror, your view permits it?"
  **Bluff Point:** You likely don't want to answer "yes," but your metaphysics pushes you there.

  ### 4. The "Event-Causation Bias" Objection (Libertarian)
  **Who:** The agent-causation folks.
  **The Phrasing:** "Strawson's Basic Argument assumes event-causation. It assumes every choice must be caused by a prior event/state. Agent causation posits the *substance* (the agent) as the cause. You're begging the question by assuming the regress must be temporal rather than substantial."
  **Damage:** **Medium.** They won't convert, but they'll dismiss the argument as question-begging.
  **Strategy:** **Hold.** Challenge the coherence of agent-causation.
  **2-Minute Reply:** "Agent-causation claims to stop the regress, but it doesn't explain *how* the agent causes the act without relying on their own nature. If the agent's nature determines the act, we're back to brute facts about the agent. If the agent's nature *doesn't* determine the act, the choice is random. You haven't solved the 'brute fact' problem; you've just labeled the agent a 'substance' instead of a 'state.'"
  **Candid Weakness:** You can't disprove agent-causation in 2 minutes.
  **Follow-up to Expect:** "You're assuming the Principle of Sufficient Reason. Why can't the agent just be an unmoved mover?"
  **Bluff Point:** Asserting that agent-causation is unintelligible without proving it.

  ### 5. The "Reactive Attitudes" Objection (P.F. Strawson Fan)
  **Who:** The department's P.F. Strawson devotee.
  **The Phrasing:** "P.F. Strawson showed we *cannot* give up reactive attitudes (resentment, gratitude) without opting out of human relationships. You're saying we should keep the practices but drop the desert. But the practices *are* the attitudes. You're asking for a psychological impossibility: to blame without feeling the agent *deserved* it."
  **Damage:** **Medium.** Attacks the psychological feasibility of your quietism.
  **Strategy:** **Reframe.** Distinguish the *feeling* from the *judgment*.
  **2-Minute Reply:** "P.F. Strawson described our psychology, he didn't justify it. We can acknowledge the inevitability of the *feeling* of resentment while denying its *truth-aptitude*. We can feel the sting of blame as a social signal without believing it tracks metaphysical desert. We live in the attitude but theorize outside it. It's a cognitive dissonance we can manage, like knowing sugar is bad but craving it."
  **Candid Weakness:** "Managing dissonance" sounds unstable.
  **Follow-up to Expect:** "Isn't that self-deception? If you tell someone 'You're blameworthy' while believing 'You don't deserve blame,' aren't you lying?"
  **Bluff Point:** Claiming we can sustain this dual-consciousness consistently.

  ### 6. The "Epistemic Block" Objection (Moral Luck Theorist)
  **Who:** The epistemology of blame specialist.
  **The Phrasing:** "Even if your metaphysics is right, we never *know* the brute facts. We can't trace the causal chain back to the Big Bang. So, in practice, we must act *as if* there is desert. Your argument is theoretically true but practically inert. Why present it as a guide for practice?"
  **Damage:** **Low/Medium.** Turns your paper into a metaphysical curiosity.
  **Strategy:** **Concede.** Agree it's a theoretical limit, not a practical heuristic.
  **2-Minute Reply:** "I agree we can't use this in the moment. But it changes the *stance* we take when we reflect. It moves us from retributive anger to preventive concern. It's not a decision procedure; it's a background ontology that softens our moral rigorism. It matters for how we design institutions, even if it doesn't stop me from getting angry at my spouse."
  **Candid Weakness:** Admitting it's "practically inert" weakens the "practices intact" claim.
  **Follow-up to Expect:** "If it doesn't change the first-order practice, what work is it doing?"
  **Bluff Point:** Vaguely gesturing at "institutional design" without specifics.

  ### 7. The "Constitutive Luck" Concession (Compatibilist)
  **Who:** The moral luck researcher.
  **The Phrasing:** "You say constitutive luck kills responsibility. But compatibilists argue we *are* our constitutions. To say 'I didn't choose my character' is irrelevant. The question is, 'Did this action flow from my character?' You're demanding I be responsible for my character, but I'm only responsible for my actions."
  **Damage:** **Medium.** Standard compatibilist move.
  **Strategy:** **Hold.** Insist on the "Source" requirement.
  **2-Minute Reply:** "If your character is a brute fact, and your action flows necessarily from your character, then the action is ultimately explained by a brute fact. You are merely the locus of the event, not the source. If luck permeates the constitution, and the constitution determines the action, luck permeates the action. You can't stop the luck contamination at the border of the 'self.'"
  **Candid Weakness:** This relies on the intuition that "luck contamination" is fatal, which compatibilists deny.
  **Follow-up to Expect:** "Why is 'locus' not enough? Why do we need 'source'?" (See Objection 1).
  **Bluff Point:** Asserting "locus is not enough" without further argument.

  ### 8. The "Trick" Accusation (General)
  **Who:** Senior faculty who've heard this before.
  **The Phrasing:** "This is just the Basic Argument with extra steps. You've stripped out determinism, but the regress problem remains the same. You haven't solved the 'loose spokes' problem; you've just greased them. What's new?"
  **Damage:** **Low.** Annoyance, not refutation.
  **Strategy:** **Concede / Pivot.** Acknowledge lineage, emphasize the "quietist" shift.
  **2-Minute Reply:** "I'm not claiming the metaphysical argument is new. I'm claiming the *consequence* is usually misdiagnosed. Most skeptics think no responsibility means no blame. I'm arguing we can keep blame by severing it from desert. The reconstruction is in the survival of the practice, not the death of the freedom."
  **Candid Weakness:** If the metaphysics is old, the novelty rests entirely on the quietism, which is the weakest part (see Objection 2).
  **Follow-up to Expect:** "Fischer and others have already tried that. Why is your version better?"
  **Bluff Point:** Claiming superiority over Fischer without detailed comparison.

  ***

  ### THE "HOPE NOBODY RAISES" OBJECTION
  **The Conceptual Entanglement Objection**
  **The Phrasing:** "You claim we can keep ordinary blame practices while removing desert. But the *concept* of blame is internally linked to desert. To blame someone *just is* to judge them as deserving of a negative response. If you remove desert, you aren't doing 'blame' anymore; you're doing 'management.' You're changing the subject, not saving the practice."
  **Why it's dangerous:** It argues your "quietism" is linguistically/conceptually impossible. You can't have the practice without the belief.
  **Damage Control:**
  1.  **Don't panic.** This is a semantic claim.
  2.  **Reply:** "Concepts evolve. We used to think 'disease' meant 'demon possession.' We kept the practice of treatment but dropped the demonology. Similarly, we can keep the practice of holding accountable while dropping the metaphysics of desert. If you insist the concept *requires* desert, then I'm saying we should revise the concept, not the practice."
  3.  **Fallback:** "Even if it is a revision, isn't it a desirable one? If desert is incoherent, clinging to it preserves a lie."

  ***

  ### HIDDEN WORK / UNADMITTED ASSUMPTIONS
  *Check these before you walk in. These are the places your paper is doing heavy lifting without explicit argument.*

  1.  **The Definition of "Brute Fact":** You assume any fact about constitution/history that wasn't chosen is "brute" in a responsibility-undermining way. You haven't defended why *unchosen* implies *non-responsible*. (Compatibilists will pounce here).
  2.  **The Separation Thesis:** You assume Forward-Looking practices can be cleanly severed from Backward-Looking beliefs. Psychology suggests they are entangled. You're assuming rationality can override affect.
  3.  **The Regress Stopping Point:** You assume the regress *must* bottom out in a brute fact. You haven't fully ruled out coherentist models of self-creation (where later choices reshape earlier constitutions without needing a *first* uncaused cause).
  4.  **The Normative Force:** If desert is gone, where does the *normativity* of the forward-looking practice come from? Why *ought* we to hold people accountable if they don't deserve it? You need a source of normativity other than desert (e.g., welfare, stability), and you haven't fully specified it.

  ***

  **FINAL ADVICE:**
  You will be tempted to defend the metaphysics (the Basic Argument). Don't. The room is full of people who think they've solved that. Spend your energy defending the **Quietist Conclusion**. That is the novel claim. If they beat up on Strawson, nod, cite Galen, and pivot back to: "Even if you hate the argument, can you deny the conclusion that desert is suspect? And if so, how do you save blame?" Make them fight on your turf.
