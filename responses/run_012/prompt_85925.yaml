prompt: |-
  You are an expert in mathematical logic and in teaching the philosophy of mind to non-specialists, and I would like you to plan a session rather than explain anything to me. I run a reading group on Hofstadter's Gödel, Escher, Bach for graduate students in linguistics and computer science who are comfortable with formal proofs but have never read any philosophy of mind, and I have one ninety-minute meeting to carry them from the idea that any consistent formal system rich enough for arithmetic leaves some sentences undecided to the book's claim that this is somehow a picture of a self knowing itself. Work out the dependencies for yourself before you write, and then tell me the order in which the ideas have to come: I assume the arithmetization of syntax comes first, but say what else has to be in place before the analogy can even be stated, and why each step depends on the one before it, so that the last move feels earned rather than asserted.

  I want the session carried by a ladder of small programs instead of by the Gödel sentence itself: one that prints its own source, one that prints a modified copy of its own source, and one that prints a prediction of what its own modified copy will do. Tell me whether that ladder can bear the weight, what each rung accomplishes that the previous one could not, and, if it cannot carry the load, what to use instead and why.

  The distinction I most want them to leave with, because I think the book slides over it, is between a system that can encode statements about its own sentences, a system that contains a proof of a statement about its own limits, and a system that carries a representation of itself as a system with limits. Say where each rung of the ladder lands and where the audience will collapse the three into one. Then give me the misconceptions they will bring in or form (I expect so minds cannot be machines, since a machine has to be consistent, and the strange loop is just feedback), the exact point in the sequence where each should be headed off, one question I can put to them at the end that would show the distinction has landed rather than been parroted, and what I should openly refuse to explain in ninety minutes.

  Write it as continuous prose, the way you would write to a colleague in an email: no headings, no bullet points, no bold text, no tables.
