answer: |-
  # Specification for a Theory of Slurs

  **Purpose:** To underwrite normative judgments regarding permissible speech (classroom inclusion, reclamation rights, entitlement to object).
  **Scope:** Semantics, pragmatics, and social normativity.
  **Status:** Pre-evaluation constraints.

  Below are the desiderata an adequate account must satisfy. Each is marked as a **Genuine Constraint (GC)** (required by the data/purpose) or a **Smuggled Demand (SD)** (a theoretical commitment masquerading as data). Following the list, I identify the critical tension, the most exclusionary requirement, and the hard test cases.

  ---

  ## I. The Desiderata List

  ### 1. The Co-extensionality Constraint
  *   **Motivation:** A slur (S) and its neutral counterpart (N) (e.g., *k* and *Asian*) appear to apply to the exact same individuals in the actual world. If a theory posits different truth-conditions (extensions), it implies that applying S to an N-member is factually false, rather than morally/linguistically违规. This undermines the judgment that the *wrongness* lies in the choice of term, not the identification of the person.
  *   **Status:** **GC**.
  *   **Requirement:** The account must treat S and N as having identical truth-conditional content (reference) while explaining the differential normative force. It must not treat them as lexically distinct items with different extensions, nor collapse them into a single item with no distinction.

  ### 2. The Projection Constraint
  *   **Motivation:** Derogatory content survives embedding. "He is not an S," "If he is an S...", "Is he an S?" all retain the offensive charge. If the offense were merely asserted content, negation would cancel it. If it were merely a conversational implicature, it would be easily cancellable.
  *   **Status:** **GC**.
  *   **Requirement:** The account must explain why the derogatory force projects through logical operators without simply stipulating "it is a presupposition." It must distinguish this projection from standard presuppositions (which can sometimes be filtered) given the unique stickiness of slurs.

  ### 3. The Non-Cancellability Constraint
  *   **Motivation:** Unlike standard implicatures, one cannot say, "He is an S, but I mean nothing derogatory by it," without infelicity (outside of specific reclaimed contexts). The offense is attached to the word type, not just the speaker's momentary intention.
  *   **Status:** **GC**.
  *   **Requirement:** The account must explain why the derogatory force is resistant to explicit cancellation by the speaker.

  ### 4. The Neutral-Use (Mention/Quote) Constraint
  *   **Motivation:** Instructors, journalists, and targets often need to mention the term without endorsing its content. An account that makes the term *inherently* derogatory in all tokens makes academic discussion impossible. Conversely, an account that makes it *never* derogatory fails to capture the harm.
  *   **Status:** **GC**.
  *   **Requirement:** The account must distinguish between *using* the slur (deploying its force) and *mentioning* it (reporting its existence), without relying solely on scare quotes or intonation, which are not always available.

  ### 5. The Gradation Constraint
  *   **Motivation:** Not all slurs are equally toxic, and toxicity shifts with context. A theory that treats all slurs as maximally offensive cannot explain why some are prosecutable hate speech while others are merely rude, nor can it guide classroom appropriateness (e.g., historical texts vs. contemporary epithets).
  *   **Status:** **GC**.
  *   **Requirement:** The account must allow for degrees of offensiveness and explain how context modulates severity without making the meaning entirely ephemeral.

  ### 6. The Speaker-Independence Constraint
  *   **Motivation:** Calling someone an "idiot" attacks their competence; calling someone an S attacks their standing as a member of a group. The harm persists even if the specific target doesn't care, because it reinforces a hierarchy affecting the whole group.
  *   **Status:** **GC**.
  *   **Requirement:** The account must explain why the harm is group-directed and structural, rather than merely individual and psychological.

  ### 7. The Reclamation Constraint
  *   **Motivation:** Targeted groups often repurpose slurs (e.g., *queer*, *n*gga). If the meaning is fixed semantically, reclamation is impossible. If the meaning is purely pragmatic, reclamation is trivial. The theory must explain how the *same* phonological string can be weaponized by an outsider and affectionate by an insider.
  *   **Status:** **GC**.
  *   **Requirement:** The account must specify the conditions under which the derogatory force is suspended or inverted for in-group speakers, without rendering the term safe for out-group speakers.

  ### 8. The No-Counterpart Constraint
  *   **Motivation:** Some slurs lack a clear neutral counterpart (e.g., *gypsy*, *tranny*), or the counterpart is contested. Some terms target ideologies (e.g., *fascist* used as a slur). A theory relying on the S/N pair comparison fails here.
  *   **Status:** **GC**.
  *   **Requirement:** The account must provide a criterion for slur-hood that does not depend on the existence of a neutral synonym.

  ### 9. The Semantic Location Demand
  *   **Motivation:** Many theorists insist the derogation *must* be in the truth-conditions to explain non-cancellability.
  *   **Status:** **SD** (Smuggled Demand).
  *   **Reasoning:** This privileges semantic theories over pragmatic ones a priori. The *phenomenon* (non-cancellability) is the constraint (see #3); *where* it is located in the architecture of meaning is a theoretical choice, not a datum.

  ### 10. The Normative Output Constraint
  *   **Motivation:** Per your stated purpose, the theory must do more than describe meaning; it must ground judgments on what *may* be said. A theory that explains the meaning but leaves the moral status opaque fails the seminar's goal.
  *   **Status:** **GC**.
  *   **Requirement:** The account must entail a mechanism for deriving normative permissions/prohibitions from the semantic/pragmatic facts.

  ---

  ## II. Inconsistency Alert: The Trilemma of Stability

  I flag the following subset as **potentially incompatible** under a single uniform mechanism:

  1.  **Co-extensionality (GC #1):** S and N have identical truth conditions.
  2.  **Non-Cancellability (GC #3):** The offense cannot be talked away by the speaker.
  3.  **Reclamation (GC #7):** In-group speakers can strip the offense.

  **The Conflict:**
  If the offense is non-cancellable (attached to the word type), reclamation should be impossible. If reclamation is possible (attached to speaker identity/context), then the offense is cancellable/modulatable, which threatens Non-Cancellability for out-group speakers. If we solve this by saying reclamation creates a *new word*, we violate Co-extensionality (the reclaimed S is no longer the same lexical item as the hostile S).

  **Resolution Strategy:** An adequate account must distinguish between *semantic content* (stable) and *normative force* (context-sensitive). It cannot treat the slur as a monolithic block.

  ---

  ## III. The Single Most Exclusionary Requirement

  **The Non-Cancellability Constraint (GC #3).**

  **Why:** This is the primary filter.
  *   **Excludes:** Standard Gricean Conversational Implicature accounts. These views treat slur offense as something inferred from context. By definition, implicatures are cancellable ("He's an S, but I don't mean to offend"). Since slurs are not cancellable in standard usage, pure pragmatic views fail immediately.
  *   **Excludes:** Purely Psychological/Perlocutionary accounts. If the harm is just "hurt feelings," a speaker saying "I don't intend to hurt" should mitigate the status. It does not.
  *   **Survivors:** Semantic accounts (truth-conditional), Conventional Implicature (CI) accounts, and Hybrid Expressivist accounts. These locate the force in the convention of the word itself, not the speaker's transient intent.

  ---

  ## IV. The Hard Test Cases

  To stress-test the constraints, I construct two cases that strain the boundaries of "slur" definitions.

  ### Case 1: The Regional Divergent (The "Dialect" Test)
  *   **Scenario:** Term *X* is used in Region A (e.g., the US South) as a term of endearment or neutral description among all races, but in Region B (e.g., the US North), *X* is a lethal racial slur with no neutral use.
  *   **Challenge:**
      *   If the theory relies on **Semantic Content**, *X* must have one meaning. It cannot be both neutral and lethal simultaneously without contradiction.
      *   If the theory relies on **Speaker Intent**, it fails to explain why a Region A speaker is punished in Region B despite benign intent.
      *   If the theory relies on **Historical Oppression**, it must explain why the history applies in B but not A.
  *   **Demand:** The account must explain how the *same* phonological string carries different normative weights based on geographic-linguistic community without fracturing into two different words (violating Co-extensionality across dialects).

  ### Case 2: The Ideological Target (The "Belief" Test)
  *   **Scenario:** Term *Y* is deployed against adherents of a political ideology (e.g., *Fascist*, *Woke*, *Zionist* used pejoratively). The target is defined by chosen belief, not inherited identity. Opponents claim *Y* is a slur; users claim it is political critique.
  *   **Challenge:**
      *   Most slur theories rely on **Protected Groups** (race, gender, sexuality). This case lacks an inherited identity.
      *   If the theory says "Only inherited identities can be slur-targets," it fails the **No-Counterpart Constraint** (GC #8) because *Y* functions exactly like a slur (projection, non-cancellability, group-stigma) but is excluded by definition.
      *   If the theory includes *Y*, it risks over-generating slurs (making all political insults slurs), diluting the **Speaker-Independence Constraint** (GC #6).
  *   **Demand:** The account must provide a principled distinction between a *political insult* and an *ideological slur*, or admit that the category of "slur" extends beyond protected classes.

  ---

  ## V. Consistency Verdict

  **Can a single account pass both cases along with the constraints above?**

  **No.** Not without modification.

  **The Conflict:** The **Speaker-Independence Constraint (GC #6)** (harm attaches to the group/structure) conflicts with **Case 2 (Ideological Target)**. Ideological groups are often defined by voluntary association and lack the structural immutability of racial groups. If a theory explains slurs via "immutable characteristics + power hierarchy," it excludes Case 2. If it includes Case 2 via "any stigmatized group," it dilutes the specific harm of racial/gendered slurs (violating the spirit of GC #6).

  **What I Would Give Up:** I would relax the **Speaker-Independence Constraint (GC #6)** slightly.
  **Why:** The core mechanism of a slur is *essentialization* (reducing a person to a single trait) and *stigmatization*. While racial slurs are the paradigmatic case due to historical violence, the *linguistic mechanism* can operate on ideological groups. I would modify GC #6 to require an explanation of *why* racial slurs are typically more harmful (structural power) without defining slurs *exclusively* by that harm. This allows the theory to adjudicate Case 2 (it is a slur, but perhaps of a different *grade* per GC #5) without collapsing the distinction between racial violence and political disagreement.

  **The Inconsistency Result:** The most important result of this exercise is recognizing that **Co-extensionality** and **Reclamation** cannot be satisfied by a static semantic theory. A theory that satisfies the Reclamation Constraint must treat the "meaning" of a slur as partially constituted by social practice, not just lexical entry. This pushes the account toward **Social Externalism** or **Use-Conditional Semantics**.

  ---

  ## VI. Brief Evaluation of Main Families

  Against this specification (specifically the Non-Cancellability and Reclamation constraints):

  1.  **Semantic Derogation (Truth-Conditional):**
      *   *Fails:* **Reclamation Constraint.** If "S" means "despicable N," an in-group member saying "S" asserts their group is despicable. They must be lying or speaking ironically. It also struggles with **Case 1 (Regional)** without positing ambiguity.
      *   *Passes:* Non-Cancellability, Projection.

  2.  **Conventional Implicature (CI):**
      *   *Fails:* **Reclamation Constraint.** CI is attached to the word convention. It is hard to explain how the convention is "turned off" for in-group users without changing the word.
      *   *Passes:* Projection, Non-Cancellability, Co-extensionality.

  3.  **Expressivist/Hybrid:**
      *   *Passes:* **Reclamation Constraint.** By locating force in the expression of attitude rather than description, it allows in-group users to express solidarity rather than contempt.
      *   *Passes:* Non-Cancellability (the expression is conventional).
      *   *Struggles:* **Case 2 (Ideological).** Must clarify if expressing contempt for beliefs counts as the same "expressive" act as contempt for identity.

  4.  **Deflationary/Pragmatic:**
      *   *Fails:* **Non-Cancellability Constraint.** If it's just context/implied attitude, speakers should be able to cancel it. They cannot.
      *   *Fails:* **Projection.** Hard to explain why "Not an S" still offends if the offense is just an inference.

  **Winner:** A **Hybrid Expressivist** or **Use-Conditional** account fares best, provided it can incorporate the **Normative Output Constraint** to explain *why* the expressed attitude is prohibited in certain contexts (classroom) but permitted in others (reclamation). It is the only family flexible enough to handle the Reclamation/Regional tensions without abandoning Co-extensionality.
