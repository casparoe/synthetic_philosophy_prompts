answer: |-
  Your friend is correct that the intrinsic versus relational distinction is the central fault line, but incorrect that it is stable, because what appears as intrinsic politics is usually just social power relations hardened into material design.

  To see why, you have to define the terms precisely. A claim is **relational** if the political effect depends entirely on the context of use; a claim is **intrinsic** if the artifact enforces a political outcome through its physical or logical structure, regardless of user intent. Consider a **digital rights management (DRM) lock** on an ebook versus a **physical lock** on a diary. The DRM lock is intrinsically political in appearance because the code itself prevents copying; even if you believe in open sharing, the file refuses to cooperate. The physical lock is relational because its politics depend on who holds the key and why; the metal mechanism itself doesn't care about copyright law. However, the distinction collapses when you ask who created the DRM. The code enforces a policy chosen by a corporation, meaning the "intrinsic" constraint is actually a delegated social relation. The technology isn't acting on its own; it is acting as a proxy for human authority that has been embedded into the material world to make compliance automatic.

  This instability matters because it determines where you locate responsibility. If politics are intrinsic, you blame the engineer or the design logic; if they are relational, you blame the user or the institution. In practice, most "intrinsic" politics are just relational politics that have been made difficult to reverse. A **speed bump** forces drivers to slow down (intrinsic effect), but it was installed by a city council to enforce a speed limit (relational origin). If you treat the speed bump as purely intrinsic, you ignore the political decision to prioritize traffic calming over traffic flow. If you treat it as purely relational, you ignore the fact that the bump coerces behavior even when no police officer is present.

  Here is how your four theses line up with this split:

  *   **(a) Neutrality/Use:** This is **strict relationalism**. It claims artifacts are empty vessels, like the physical lock, where politics enter only during deployment. This view fails when artifacts actively constrain use, like the DRM lock.
  *   **(b) Artifact Politics/Design:** This is the **surface intrinsic claim**. It argues that design choices encode values (e.g., a surveillance camera is designed to monitor). This is the most robust position, provided you acknowledge that the "encoding" is a social act, not a magical property of the lens.
  *   **(c) Prime Mover:** This is **hard determinism**. It relies on a strong intrinsic claim to argue that technology drives social change independently of human will. It assumes the speed bump creates the slow driver, rather than the slow-driver lobby creating the speed bump.
  *   **(d) Inevitability:** This is **teleological determinism**. It assumes technology has an internal logic that demands specific outcomes (e.g., "the internet inevitably leads to democracy"). This is the most unstable version of the intrinsic claim, as it treats social contingencies as physical laws.

  The real stake in this debate is whether we can change the technology to change the politics. If you believe politics are intrinsic and stable, you must redesign the artifact to change the outcome (e.g., ban DRM). If you believe they are purely relational, you focus on regulation and usage norms (e.g., change copyright law). Since intrinsic politics are actually frozen relational politics, the most effective approach is usually both: redesign the artifact to make undesirable behaviors harder, while changing the social institutions that demanded those designs in the first place.
