          *   Identify soft spots/concessions.
          *   Identify the "prayer question" (the one you hope nobody asks).
          *   No citations/reading lists.
          *   **Crucial:** If the thesis is muddled or the prep sheet can't be done honestly, say so.

  2.  **Initial Assessment of the Thesis (The "Honesty Check"):**
