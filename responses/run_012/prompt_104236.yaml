answer: |-
  **FINAL EXAMINATION QUESTION**

  **Course:** Value, Comparison, and Rational Choice  
  **Time Allowed:** 75 minutes  
  **Total Marks:** 30

  **Instructions:** Answer all parts of the question. Write clearly and concisely. Throughout, treat *better than* as meaning *better all things considered*, and treat *indifferent* as meaning *neither better nor worse*.

  Transitivity is usually taken to be constitutive of betterness: if A is better than B, and B is better than C, then A is better than C. Spectrum arguments are supposed to show that we cannot keep transitivity together with certain other judgments we will not give up. Consider two sequences.

  **Case I: The Long Conversation.** $C_0$ is a one-minute conversation with a kind but tedious relative; it is mildly pleasant. Each $C_{k+1}$ lasts one minute longer than $C_k$, and the added minute is only imperceptibly more tedious than the minute before it, so that, judged on its own, $C_{k+1}$ seems neither better nor worse than $C_k$. $C_{600}$, ten hours long, is clearly much worse than $C_0$.

  **Case II: The Escalator.** $O_0$ is a life of extraordinary richness — deep relationships, absorbing work, aesthetic pleasure — marred by one hour of discomfort each day. Each $O_{k+1}$ trades a small amount of richness for a small reduction in discomfort, in a proportion that, judged on its own, makes the life slightly better overall; you would accept each trade. By $O_n$, the life is bland but comfortable: almost no richness, no discomfort. You judge $O_0$ clearly better than $O_n$.

  (a) Set out the general form of a spectrum argument and identify the judgments that cannot all be true. For each case, say what a defender of transitivity must give up, and what a critic of transitivity must give up instead. (8 marks)

  (b) The two cases are said to fail transitivity in different ways. Distinct *intransitive indifference* — the strict betterness relation remains transitive while indifference does not, as with just-noticeable differences, a structure sometimes called a *semiorder* — from *intransitive strict betterness*, in which betterness itself cycles. Say which case threatens which, and explain the formal consequence: which of the two failures is compatible with representing the ranking by a real-valued measure of value, or by an interval-valued one (a numerical score paired with a threshold, so that items whose scores fall within the threshold of each other count as indifferent), and which is not. (8 marks)

  (c) Assess the principal responses. Consider at least: denying the stepwise judgments; accepting that betterness is intransitive; locating the trouble in vagueness or in incommensurability rather than in intransitivity; positing a fourth comparative relation, *parity*, holding between items that are neither better, nor worse, nor equal; and holding that the cycle in Case II is an artifact of aggregating several dimensions of value — as when majority voting over dimensions yields a cycle — rather than a feature of overall betterness. (10 marks)

  (d) Take a position. State which response you would adopt, what it costs you, and whether an agent whose betterness relation cycles can be exploited by a sequence of trades returning her to her starting point minus a fee, and whether that possibility is decisive against your response. (4 marks)

  ***

  **MODEL ANSWER**

  (a) A spectrum argument presents a sequence of items where stepwise comparisons yield one result, but endpoint comparisons yield a contradictory result, violating transitivity. The inconsistent set comprises: (1) Transitivity of the relevant relation; (2) Stepwise judgments (e.g., $A_k$ is indifferent to $A_{k+1}$); and (3) Endpoint judgments (e.g., $A_{start}$ is strictly better than $A_{end}$). In Case I, the defender of transitivity must deny either the stepwise indifference or the endpoint strict betterness, perhaps by claiming a sharp boundary exists where tediosity becomes perceptible. The critic denies transitivity, accepting that indifference can chain into strict betterness. In Case II, the defender must deny that each trade is strictly better or that the original life is better than the bland life. The critic denies transitivity of strict betterness, accepting a cycle where $O_n$ is better than $O_0$ by steps, but $O_0$ is better than $O_n$ by endpoint judgment.

  (b) Case I threatens transitivity of indifference while preserving transitive strict betterness. Since each step is indifferent, but the endpoints are strictly ranked, indifference is intransitive. This structure is a semiorder. It is compatible with an interval-valued measure. One can assign real numbers to each conversation such that $C_0$ has a higher score than $C_{600}$, but adjacent items fall within a threshold of indistinguishability, rendering them indifferent despite score differences. Case II threatens transitivity of strict betterness. The steps imply $O_n$ is strictly better than $O_0$, but the endpoint judgment says $O_0$ is strictly better than $O_n$. This creates a strict cycle. This failure is not compatible with a real-valued measure or an interval-valued one. No numerical function can represent a cycle where $x > y$ and $y > x$ simultaneously; any real number assignment requires asymmetry. Thus, Case II implies a deeper breakdown of rational ranking than Case I.

  (c) Denying stepwise judgments avoids the contradiction but implies epistemicism: there is a specific minute where a conversation becomes worse, though we cannot know it. This seems implausible for vague concepts like tediosity. Accepting intransitivity preserves intuitions but sacrifices a core principle of rationality, potentially inviting exploitation. Locating the trouble in vagueness suggests there is no fact of the matter about the comparisons, dissolving the contradiction without denying transitivity itself. Incommensurability suggests the items lack a common metric, but this struggles to explain why stepwise trades seem possible. Positing parity offers a nuanced middle ground: adjacent items are not indifferent but "on a par," allowing small changes without strict betterness while blocking the transitivity chain. This preserves the intuition that $O_0$ and $O_n$ are qualitatively different without requiring a cycle. Finally, the multidimensional aggregation view suggests Case II arises because richness and comfort are separate dimensions. If we aggregate via majority rule across dimensions, cycles emerge (Condorcet paradox). However, if overall betterness integrates these dimensions into a single weighted score, the cycle disappears. This response saves transitivity by denying that the stepwise "better overall" judgments are coherent; they are merely better on a weighted mix that shifts illegitimately across the sequence.

  (d) I would adopt the parity response. It costs me the trichotomy assumption that any two items must be better, worse, or equal. It allows me to accept the stepwise intuitions without accepting a cycle, as parity is not transitive. Regarding exploitation: yes, an agent with cyclic strict betterness can be money-pumped. If an agent prefers $A$ to $B$, $B$ to $C$, and $C$ to $A$, they can be traded around the cycle, paying a fee each time, ending where they started but poorer. However, this is not decisive against my position because I deny strict cycles. Parity does not generate money pumps because one does not strictly prefer par items to each other. Even if one accepted cycles, some argue a sophisticated agent would recognize the cycle and refuse the trades, blocking the pump. Thus, the threat of exploitation primarily defeats the intransitive strict betterness view, not the parity view.

  ***

  **MARKING SCHEME**

  **Total Marks: 30**

  **Part (a): General Form and Case Application (8 marks)**
  *   **2 marks:** Identifies the inconsistent triad: Transitivity, Stepwise Judgments, Endpoint Judgments.
  *   **2 marks:** Correctly states Case I stepwise relation is indifference ($C_k \sim C_{k+1}$) and endpoint is strict betterness ($C_0 > C_{600}$).
  *   **2 marks:** Correctly states Case II stepwise relation is strict betterness ($O_{k+1} > O_k$) and endpoint is strict betterness in reverse ($O_0 > O_n$).
  *   **2 marks:** Clearly distinguishes what the defender denies (stepwise or endpoint) vs. what the critic denies (transitivity).

  **Part (b): Formal Consequences and Representation (8 marks)**
  *   **2 marks:** Correctly identifies Case I as threatening intransitive indifference (semiorder).
  *   **2 marks:** Correctly identifies Case II as threatening intransitive strict betterness (cycle).
  *   **2 marks:** States Case I is compatible with interval-valued measure (score + threshold).
  *   **2 marks:** States Case II is incompatible with any real-valued or interval-valued measure (due to asymmetry requirement).

  **Part (c): Assessment of Responses (10 marks)**
  *   **2 marks:** Assesses denying stepwise judgments (e.g., notes implausibility of sharp boundaries/epistemicism).
  *   **2 marks:** Assesses accepting intransitivity (e.g., notes cost to rationality/exploitation risk).
  *   **2 marks:** Assesses vagueness/incommensurability (e.g., notes dissolution of factuality vs. explanatory power).
  *   **2 marks:** Assesses parity (e.g., notes it blocks transitivity chain without cycles).
  *   **2 marks:** Assesses multidimensional aggregation (e.g., notes it saves transitivity by reinterpreting "overall" betterness).

  **Part (d): Position and Exploitation (4 marks)**
  *   **1 mark:** Clearly states a chosen position.
  *   **1 mark:** Identifies a specific cost of that position (e.g., loss of trichotomy, complexity).
  *   **1 mark:** Correctly answers whether cyclic agents can be money-pumped (Yes).
  *   **1 mark:** Provides a reasoned view on whether this is decisive (e.g., No, if parity is chosen; or No, if agent is sophisticated).

  **Common Misunderstandings (Deduct 2 marks per occurrence)**
  *   Confusing Case I and Case II structures (e.g., claiming Case I involves strict stepwise betterness).
  *   Claiming interval-valued measures can represent strict cycles.
  *   Attributing arguments to named philosophers (violates exam constraints).
  *   Claiming money pumps are possible with parity relations (parity is not a strict preference).

  **Distinguishing A from B Answers**
  An **A answer** integrates the formal constraints of part (b) into the assessment in part (c), showing why parity solves Case I but might not solve Case II unless strict betterness is denied. It treats the money pump argument in (d) as specific to strict cycles, not indifference. A **B answer** correctly lists the positions but treats them as a menu of options without analyzing their formal compatibility with the cases described, or conflates the money pump threat across both intransitive indifference and intransitive strict betterness.
