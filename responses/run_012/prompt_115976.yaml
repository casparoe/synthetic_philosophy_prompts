answer: |-
  Your intuition is correct: Step (5) is the pivot where the argument turns from a mathematical observation into a metaphysical conclusion that destroys utilitarianism. Here is the breakdown of why (5) is the bad step, what it costs to reject it, and how it interacts with your desire to keep (1).

  ### The Diagnosis: Step (5) is the Category Error

  Step (1) is mathematically sound within **Von Neumann-Morgenstern (VNM) decision theory**. For a single agent, utility numbers are indeed only unique up to a positive affine transformation (PAT). You can multiply my utility by 2 or add 10, and my choices over lotteries remain identical.

  Step (5) claims this limitation applies to **Interpersonal Comparisons (IC)**. It asserts that because *individual* scales are arbitrary, *comparing* scales is also arbitrary. This is where Maya's argument overreaches. It conflates **measurement representation** with **ontological reality**.

  If you reject (5), you are asserting that there are facts about welfare (well-being, pain, pleasure) that exist independently of our numerical representation of them. While I can rescale *my own* preference numbers without changing my choices, I cannot rescale *my pain relative to yours* without violating the facts about our experiences.

  ### The Cost: You Need a Theory of Welfare

  You asked: *"If I keep (1), am I stuck needing a theory of welfare that isn't just a preference representation?"*

  **Yes.** This is the exact price of rejecting (5).

  If utility is *only* a representation of preference orderings (strict VNM), then (5) is true, and utilitarianism is unstatable. To reject (5) while keeping the spirit of (1) for individual choice, you must distinguish between **decision utility** (preferences) and **experienced welfare** (the moral currency).

  *   **What breaks:** You can no longer define utilitarianism simply as "satisfying preferences." You need a substantive theory of value (e.g., hedonism, objective list theory) that provides a **common unit** across persons. You must claim that a "unit of pain" for you is comparable to a "unit of pain" for me, grounded in something real (neural firing, phenomenological intensity), not just chosen by convention.
  *   **The Monster's Return:** If you reject (5), you admit interpersonal comparisons are possible. Consequently, Step (4) fails. The Utility Monster is no longer an artifact; it becomes a genuine metaphysical possibility (a being with a higher capacity for welfare per resource). Utilitarianism is saved from being "unstatable," but it is now vulnerable to the Monster objection again.

  ### Can the Monster be Stated Without a Common Scale?

  You asked: *"Is there any way to state the monster's claim using only features that survive the admissible rescalings?"*

  **No.** Not if you stick to pure VNM utility. The definition of the Monster *requires* a ratio comparison ("vastly larger than anyone else's"). Ratios are not invariant under independent affine transformations. If I can rescale the Monster's utility independently of yours, I can make the Monster's gain equal to yours by definition.

  To state the Monster's claim, you **must** posit a common scale (unit comparability). This confirms that rejecting (5) requires you to posit a common scale grounded in something other than arbitrary preference representation.

  ### Summary of Trade-offs

  *   **Reject (5):** Utilitarianism is meaningful. The Monster is a real threat. You must defend Interpersonal Comparisons of Utility (ICU) as factual.
  *   **Keep (5):** Utilitarianism is meaningless (or must be radically redefined). The Monster is dissolved. You keep the pure preference framework but lose the ability to sum welfare across persons.

  Since you prefer keeping (1) (the math of individual choice) over (5) (the impossibility of comparison), you must accept that (1) does not exhaust the concept of moral utility. You pay the metaphysical cost of defending ICU.

