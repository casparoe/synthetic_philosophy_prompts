      *   **Color Phi Phenomenon:** A subject sees a red spot, then a green spot, but reports seeing a single spot moving and changing color from red to green *between* the locations.
      *   **Orwellian Interpretation:** The subject consciously sees red, then consciously sees green, but memory is altered afterwards to report a change. (Like *1984*, rewriting history).
      *   **Stalinesque Interpretation:** The brain fabricates the experience of change *before* it enters consciousness. The subject never consciously sees static red then static green; they consciously see the transition. (Like Stalin's show trials, staged before public viewing).
      *   **Dennett's View:** Dennett argues in "Quining Qualia" and *Consciousness Explained* that this distinction is illusory. There is no "Cartesian Theater" where consciousness happens at a specific moment that can be timestamped independently of the content.
