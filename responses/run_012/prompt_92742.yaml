answer: |-
  **Marcus:** Look at the table. It's magnets. Iron filings. Frictionless glass. Every collision is governed by Lorentz forces and Newtonian mechanics. If you want to know why that cluster moved left, you trace the vector sum of the simms inside it. The simmball didn't push anything. The simms did.

  **Elena:** And if you trace every simm, you'll die of old age before you predict the next checkers move. The simmball is the cause because it's the stable unit of counterfactuals. If I hadn't nudged that cluster, the game state wouldn't have changed.

  **Marcus:** But when you nudge the cluster, you're touching simms. There is no macro-hand. Your intervention is a massive set of micro-interventions. To say the simmball caused the shift is just a coarse label for a billion micro-shoves. It's a compression algorithm, not a causal mechanism.

  **Elena:** It's a compression algorithm that captures *causal leverage*. If I specify the micro-state, I drown in noise. If I specify the simmball position, I capture the invariant structure. A good coarse-graining isn't gerrymandered; it's projectible. It supports counterfactuals the micro-level obscures. If I swap this simmball for another cluster with different simms but the same mass and magnetic moment, the checkers game proceeds identically. The micro-details are causally irrelevant noise.

  **Marcus:** Irrelevant to *you*, because you're looking for a checkers game. That's multiple realizability. You could run this logic on silicon, or water buckets, or abacuses. If the checkers program is the real cause, then the simmballs are just incidental hardware. But if the hardware is incidental, it has no causal standing. It's explanatory, not ontological.

  **Elena:** Why is explanatory power distinct from causal standing? If the pattern allows me to manipulate the system reliably, it's real. Dennett's criterion: a pattern is real if positing it yields predictive profit beyond the cost of describing it. The simmball pattern pays dividends. The micro-state does not.

  **Marcus:** Predictive profit for an observer. You've smuggled in a homunculus. Now causation is relative to computational limits. If a Laplacian demon watched this table, would it see simmballs? No. It would see simms. So simmballs are only "causal" for beings too stupid to track the micro-state. That makes causation observer-relative.

  **Elena:** Yes. And? Causation is always about intervention, and interventions are always made by agents with specific granularities. A bomb causes a building to collapse. Does a micro-physicist say, "No, the rearrangement of electrons caused it"? That's true but useless. The bomb is a real pattern because it groups micro-states that behave similarly under macro-interventions.

  **Marcus:** But look at the boundary. You claim the simmball is an object. But it bleeds simms. It gains and loses constituents constantly. What makes *this* simmball the same cause from moment one to moment two? If identity is vague, causation is vague. You can't have vague objects pushing precise physics.

  **Elena:** Organisms shed cells. Rivers lose water. Are they epiphenomenal? Identity over time is functional, not mereological. As long as the cluster maintains the structural integrity required to play the checkers game, it persists. The bleeding is noise. The signal is the trajectory.

  **Marcus:** That's a category mistake. You're saying the signal pushes the noise. But the signal is *made* of the noise. When you claim "downward causation"—that the checkers state constrains the simms—you're violating causal closure. Either the micro-state determines the next micro-state, or there's magic. If the simmball determines the simms, you have overdetermination. If the simmball is just a summary, it doesn't push. You can't have it both ways.

  **Elena:** I don't need downward causation in the spooky sense. I need causal exclusion to fail. The micro-story is complete, yes. But it's not the *only* true story. The macro-story isn't a rival explanation; it's a higher-level map that captures dependencies the micro-map misses. When the simmball hits another, it constrains the possible micro-trajectories of its constituents. The structure limits the freedom of the parts.

  **Marcus:** "Limits the freedom." That's poetic. Physically, the simms bounce according to their initial conditions. The cluster structure is just a snapshot of those conditions. You're saying the snapshot pushes the paper.

  **Elena:** I'm saying the snapshot is a constraint on future snapshots. If you accept real patterns, you accept that some structures are robust enough to be treated as nodes in a causal network. Denying them because they're composed of smaller things is mereological nihilism. You'd have to deny tables, chairs, and brains.

  **Marcus:** I'd deny they have independent causal powers. They have derivative powers. The simmball moves because the simms move. If you claim the simmball moves the simms, you're reversing the dependency.

  **Elena:** It's not reversal; it's feedback. The arrangement determines the collisions, the collisions determine the new arrangement. It's a loop. At the micro-level, it's just collisions. At the macro-level, it's a game. Both are true. The micro-level is true in virtue of physics. The macro-level is true in virtue of stability.

  **Marcus:** Stability isn't causation. It's regularity. Hume would agree. But you want the simmball to be an engine, not just a regularity. You want it to push.

  **Elena:** To push is to restrict possibilities. The simmball structure rules out micro-states that would dissolve the cluster. It channels the energy. That channeling is causal.

  **Marcus:** The *laws* channel the energy. The pattern is just where the channeling happened to land. You're reifying the wake instead of the boat.

  **Elena:** If the wake predicts where the boat goes better than tracking the engine pistons, the wake is real enough for navigation. And we are navigators, not demons.

  **Marcus:** So you concede. It's relative to navigators.

  **Elena:** I concede it's relative to agents. You call that a cost. I call it the truth. There is no "view from nowhere" causation. There is only causation for someone who wants to do something.

  **Marcus:** Then your ontology is anthropocentric. If humans vanish, the simmballs stop being causes.

  **Elena:** If humans vanish, there are no interventions, so "cause" loses its meaning anyway. But the patterns remain. The stability is in the world. The *interest* is in the agent. The intersection is where causation lives.

  **Marcus:** Then we disagree on whether causation lives in the world or in the intersection. I say the simms push regardless of who watches. You say the push only counts if someone cares about the pattern.

  **Elena:** I say the push only counts as a *cause* if it supports counterfactuals an agent can use. The simms push. The simmballs steer.

  **Marcus:** Steering is just pushing with a pattern attached.

  **Elena:** And that attachment is what makes cognition possible. If you deny the simmballs, you deny the mind that's watching them.

  **Marcus:** I deny nothing. I just know which level pays the bills.

  **Elena:** And I know which level buys the goods.
