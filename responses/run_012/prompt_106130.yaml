answer: |-
  ### What I've committed to

  You are defending a robust, externalist teleosemantics. Commitment 1 anchors meaning in selection history (Millikan/Neander style), rejecting primitivism. Commitment 2 demands the possibility of misrepresentation. Commitment 3 insists on determinate content, rejecting indeterminacy as a feature. Commitment 4 is the troublemaker: it ties content to explanatory efficacy, implying content differences require internal/behavioral differences. Commitment 5 applies 1 rigorously: no history, no content (Swampman). Commitment 6 asserts content facts are mind-independent.

  Two ambiguities need flagging before the audit holds. First, Commitment 4 is unclear on "makes a difference." Does content cause the behavior, or merely individuate it? If the former, you face a causal exclusion problem. Second, Commitment 3 assumes etiological functions can be fine-grained enough to rule out "horse-or-hologram." This is technically demanding and not guaranteed by 1 alone. You are betting that history solves indeterminacy, which is contested.

  ### Real tensions

  **1. Commitment 4 (Explanatory Role) vs. Commitment 5 (Swampman)**
  *Severity: Fatal*
  This is the collapse point of your package. Commitment 5 asserts a content difference between you and Swampman (you have content, he doesn't) despite molecular and behavioral identity. Commitment 4 states that if systems are identical internally and behaviorally, there is no content difference *that could be doing any explanatory work*. If Swampman behaves exactly like you without content, then content is not necessary for that behavior. Therefore, your content is not doing the explanatory work of producing your behavior. If content doesn't explain behavior, it violates Commitment 4's demand to "earn its explanatory keep." You cannot claim content is real and objective (1, 6) yet causally inert regarding the behavior it purportedly explains. Either Swampman has content (deny 5) or content doesn't explain behavior (deny 4).

  **2. Commitment 4 (Explanatory Role) vs. Commitment 1 (Etiological Function)**
  *Severity: High*
  This is the causal power problem. Commitment 1 makes content constitutively dependent on historical facts (selection history). Commitment 4 requires content to make a difference to what the system *does* (current causation). Historical facts are not current causal powers. The mechanism inside your head causes your behavior now; its ancestry does not push the neurons. If content is defined by ancestry (1), but explanation requires current causal efficacy (4), content is explanatorily idle. You are trying to use a historical property to do a causal job. Unless you show how history transmits causal power to the current state (which duplicates lack), you violate the explanatory constraint.

  **3. Commitment 3 (Determinacy) vs. Commitment 1 (Etiological Function)**
  *Severity: Medium*
  This is the indeterminacy of function problem. Commitment 1 says content is fixed by what a mechanism was selected for. Commitment 3 demands a fact of the matter between specific alternatives (horse vs. horse-stage). However, selection history is often coarse-grained. A mechanism might be selected for detecting food, or survival, or horse-shaped retinal patterns. Nothing in the etiology itself necessarily privileges "horse" over "horse-stage" without additional theoretical stipulation. You claim determinacy is a fact (3), but your mechanism for generating it (1) often underdetermines the content. You are asserting a solution where the literature shows a gap.

  ### Only apparent

  **Commitment 1 (Etiological) vs. Commitment 2 (Error)**
  This looks like a conflict because historical theories struggle with novelty, but it isn't. Teleosemantics is specifically designed to handle error via the function/performance distinction. A state misrepresents when it fails to perform its selected function. These two hang together perfectly; this is the primary selling point of the view.

  **Commitment 5 (Swampman) vs. Commitment 6 (Objectivity)**
  It might seem that denying Swampman content makes meaning interpreter-relative, but it doesn't. You are saying the *fact* of selection history is objective, not that an interpreter decides it. Whether Swampman has history is a mind-independent fact. These are compatible externalist claims.

  ### Cheapest fix, and what it costs

  **For Tension 1 & 2 (4 vs. 5 and 4 vs. 1):**
  *Fix:* Weaken Commitment 4. Stop demanding that content explain immediate motor behavior in a way that supervenes on the internal state. Adopt a "long-arm" explanation view: content explains why the system *successfully* navigates the world over time, not why it twitched now.
  *Cost:* You lose the claim that content is the proximate cause of behavior. Psychology becomes less about immediate causation and more about normative success conditions. You concede that internalist explanation (syntax) drives the engine, while content (semantics) only evaluates the route. This marginalizes content in cognitive science.

  **For Tension 3 (3 vs. 1):**
  *Fix:* Refine Commitment 1. Add a "consumer" constraint (what the downstream system uses the state for) to narrow the function.
  *Cost:* Theoretical complexity. You move from pure etiology to a hybrid view. You also risk circularity if the consumer's state also requires determinate content.

  **The Specific Thing to Drop:**
  Commitment 4 is doing too much work. It demands content be both historical (external) and causally supervenient (internal). You cannot have both. Drop the requirement that content differences must explain behavioral differences between molecular duplicates.

  ### Bottom line

  Your package is inconsistent because you are trying to run an externalist semantics on an internalist engine. Commitment 4 (explanatory supervenience) is incompatible with Commitment 5 (Swampman). You must weaken Commitment 4. Accept that content does not causally explain immediate behavior in duplicates. By making this change, you save teleosemantics and the Swampman intuition, but you surrender the claim that content is the primary driver of behavioral explanation in cognitive science. Content becomes a normative historical fact, not a causal power.
