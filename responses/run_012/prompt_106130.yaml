prompt: |-
  Hey, I'm taking a philosophy of mind course this term and we've just finished the unit on naturalizing intentionality — teleosemantics, etiological functions, all that. I have to write a paper where I state my own view and defend it, and before I commit to anything in print I want to stress-test the package. Can you act as someone who actually works on this stuff — a philosopher of mind who knows the teleosemantics literature and won't be polite about it — and audit whether the following commitments hang together? Think carefully, and brainstorm before you write: list the candidate tensions you can see first, then decide which are real. Also don't just tell me everything is interrelated and it depends; I need to know which specific thing has to give. No reading list or citations needed, that's not what I'm after.

  Here's roughly where I've landed:

  1. Aboutness has to be earned, not primitive. A state is about F because of its biological function — the etiological kind, where the function comes from what the state-producing mechanism was selected for doing. No homunculus, and no "it means F because a theorist finds it useful to say so."
  2. Any theory of content has to leave room for error. If a state can never be wrong about anything, it isn't about anything.
  3. Content is determinate. There's a fact of the matter about whether my concept HORSE represents horses rather than horses-or-very-good-holograms or undetached horse parts. Gavagai-style indeterminacy is a problem to be solved, not a discovery.
  4. Content has to earn its explanatory keep. We should only say a state has content C if C makes a difference to what the system does. If two systems are molecule-for-molecule identical and behave identically, then there's no difference in what their states are about that could be doing any explanatory work.
  5. Swampman has no content. If lightning assembles a duplicate of me out of swamp muck, it has my internal states but nothing in it is about anything, because there's no selection history there.
  6. Content attributions are objective. Whether a state means F isn't a matter of what's useful for an interpreter to say.

  I genuinely don't know where the problem is, that's the point of asking — so if a pair that looks bad is actually fine, say so instead of hedging, and if one of these is quietly doing two jobs at once, tell me which job to drop.

  Please give it to me in these sections, in this order:

  - "What I've committed to" — ~150 words: restate each of the six in your own words, flagging any that are ambiguous as stated and need disambiguating before the audit can even start.
  - "Real tensions" — ~600 words: the pairs that genuinely conflict, ordered most to least severe. For each, name the two commitments, give the argument or case that forces the conflict, and rate the severity. Don't order them by how famous the problem is.
  - "Only apparent" — ~150 words: the pairs that look like they conflict but don't, and what the confusion is.
  - "Cheapest fix, and what it costs" — ~300 words: for each real tension, the smallest revision that would resolve it and what I lose by making it.
  - "Bottom line" — ~100 words: the single change that cleans up the most, and what I'd be giving up by making it.
