answer: |-
  This is a classic formulation of the **Causal Argument for Omissions**, and you are right to feel the tension. It pits a sparse metaphysics of causation against a robust morality of responsibility. Your friend is channeling a view similar to Helen Beebee or Michael Moore (in some moods); your resistance aligns with Carolina Sartorio or various counterfactual theorists.

  You want to keep **(1)** (Causes are events) and **(4)** (Responsibility requires causation), while rejecting **(6)** (The monstrous conclusion). Logically, if (1) and (4) are fixed, and you want to be responsible in omission cases, you are forced to reject **(2)**. You must argue that omissions *are* events.

  However, most contemporary responsibility theorists find that price too high and instead adjust (4). Let's break down the costs of each move, address your two specific worries (Ordinary Claims and Priya's Explosion), and see where the "bad step" really lies.

  ### 1. The Logical Trilemma
  You cannot keep (1), (2), and (4) while rejecting (6).
  *   **(1) + (2) $\rightarrow$ (3):** If causes are events, and omissions aren't events, omissions aren't causes. (This inference is valid).
  *   **(3) + (4) $\rightarrow$ (5):** If omissions aren't causes, and responsibility requires causation, you aren't responsible for omissions. (Valid).
  *   **(5) $\rightarrow$ (6):** Application to the drowning case. (Valid).

  Since (6) is unacceptable, one of the premises must go.

  ### Option A: Reject (2) — "Omissions *Are* Events"
  **The Move:** You argue that "not swimming" is not a metaphysical nothing. It is a complex physical/mental event: *your body remaining still while your muscles relaxed while you processed visual data of the drowning child.*
  **Why it looks good:** It saves (1) and (4) intact. It preserves a unified metaphysics of causation.
  **The Cost:** You have to defend a **Positive Ontology of Omissions**. You must explain why "my not blinking" is an event distinct from "the universe continuing without my blink." Critics say this reifies absences into spooky positive entities. It also struggles with *remote* omissions (e.g., I didn't send money to save a child in Sudan; what *event* was that?).
  **Verdict:** This is the hard metaphysical path. It's defensible (Davidsonians take this route), but it invites endless mereological headaches.

  ### Option B: Reject (4) — "Responsibility Requires Causal *Dependence*, Not Production"
  **The Move:** You keep (1) and (2). You admit omissions are not *causal producers* (no energy transfer, no event-event link). But you argue (4) is false as stated. Responsibility tracks **counterfactual dependence**, not causal production.
  **Why it looks good:** It matches the intuition that the child's death *depended* on your inaction. If you had jumped, he would have lived. This dependence is sufficient for responsibility, even if there was no "causal oomph."
  **The Cost:** You sever the tight link between *doing* and *responsibility*. You must explain why dependence is enough. (Sartorio argues that causation is just a specific kind of dependence, so we don't lose much).
  **Verdict:** This is the most popular move in current moral responsibility literature (e.g., Sartorio, *Causation and Free Will*). It costs you the literal truth of (4), but saves the *spirit* of it.

  ### Option C: Reject (1) — "Causation Isn't Just Between Events"
  **The Move:** Causation is a relation between **facts** or **propositions**, not just concrete events. "The fact that I did not swim caused the fact that the child died."
  **Why it looks good:** It handles omissions naturally without reifying them as events.
  **The Cost:** You lose the event-causation framework favored by many metaphysicians. It makes causation more linguistic/conceptual.
  **Verdict:** A strong contender, but if you are wedded to an event ontology, this is a big shift.

  ---

  ### 2. Addressing Your Two Worries

  #### Worry 1: "Ordinary Causal Claims" (The Drought/Famine Problem)
  *If (3) is true, 'The drought caused the famine' is false.*

  **Who pays this price?** Philosophers like Beebee and Moore *do* pay this price. They argue that statements like "The drought caused the famine" are strictly false but **pragmatically assertible**. They are *explanatory* claims, not *causal* claims. We explain the famine by citing the drought, but the causal history only includes positive events (the lack of rain, the withering of crops).
  **Is it a dealbreaker?** For a moral responsibility theorist, it might be. If you say "The guard's absence caused the break-in" is false, you weaken the legal and moral case against the guard.
  **The Fix:** If you reject (3) (by rejecting 1 or 2), you save these claims. If you keep (3), you must bite the bullet that ordinary language is systematically misleading about causation.

  #### Worry 2: Priya's Explosion (The Problem of Profligate Omissions)
  *If omissions are causes, isn't everything a cause of everything? (My not watering caused the plant's death, but so did Beyoncé's not watering).*

  **Is it fatal?** No. This is the **Problem of Causal Selection**, and it applies to positive causation too. (The spark caused the fire, but so did the presence of oxygen, the lack of a sprinkler, the dry wood, etc.).
  **The Solution:** We use **Defaults and Deviations** (McGrath, Hitchcock).
  *   We compare the actual world to a **normative baseline**.
  *   Beyoncé has no duty to water your plant. Her "not watering" is part of the default background. It is not a *deviation*.
  *   You *had a duty* to water the plant. Your "not watering" is a deviation from the norm.
  *   Therefore, your omission is causally relevant; Beyoncé's is not.
  **The Cost:** This makes causation partially **normative**. Whether something counts as a cause depends on what *ought* to have happened. Some metaphysicians hate this (causation should be natural, not normative!), but for a *responsibility* theorist, this is a feature, not a bug. It links the metaphysics directly to the ethics.

  ---

  ### 3. Recommendation: Where to Cut?

  You said you want to keep **(1)** and **(4)**.
  If you insist on this, you **must reject (2)**. You must argue that omissions are events.
  *   **Argument:** "Not swimming" is a state of your body. States are events (or composed of them).
  *   **Risk:** You will spend your dissertation defending a controversial metaphysics of events against people who say "Nothing happened."

  **However,** as a PhD student in *moral responsibility*, I strongly suggest you consider **rejecting (4)** instead.
  Here is why:
  1.  **It costs less:** You don't need to fix metaphysics; you just need to refine the moral principle.
  2.  **It handles Priya:** Counterfactual dependence is easily restricted by normative expectations (the Default/Deviation model).
  3.  **It saves (6):** You *are* responsible, because the outcome counterfactually depended on you, and you violated a normative expectation.
  4.  **Literature Support:** This is the dominant view in your specific subfield (see Carolina Sartorio). She argues that causation is not necessary for responsibility; **causal history** (which includes omissions via dependence) is.

  **The "Bad Step" Diagnosis:**
  The argument looks airtight because it equivokes on **"Cause"**.
  *   In (1)-(3), "Cause" means **Causal Production** (transfer of energy, event-event).
  *   In (4), "Cause" should mean **Causal Relevance/Dependence** (explanatory link, counterfactual support).

  The argument is valid only if "Cause" means the same thing in (3) and (4). It doesn't.
  *   Omissions are not *Producers* (3 is true for Production).
  *   But Responsibility requires *Relevance* (4 is false for Production, true for Relevance).

  ### Summary Advice
  1.  **Don't keep (1) and (4) literally.** You will box yourself into a metaphysical corner.
  2.  **Reject (4)** but replace it with: *"You are responsible for outcomes that **counterfactually depend** on your conduct (actions or omissions) within a normative context."*
  3.  **Tell Priya:** Her objection is solved by **Default/Deviation** semantics. Causation is contrastive and context-sensitive. We don't count Beyoncé because her non-action is the *default*, not a *deviation*.
  4.  **Tell your Friend:** The argument proves too much because it uses a metaphysical definition of causation (Production) in a moral premise (Responsibility). Responsibility tracks **dependence**, not just **production**.

  This allows you to condemn the lifeguard without having to prove that "not swimming" is a ghostly event. It costs you the literal truth of (4), but it saves your sanity and the drowning child.
