answer: |-
  You have understood Galen Strawson's "Basic Argument" remarkably well, especially given that you are approaching it without formal training. Your summary of the regress problem is accurate, and your confusion about the role of determinism is the single most common hurdle people encounter when grappling with this argument. In fact, many professional philosophers stumble over it initially.

  The short answer to your main question is: **No, the falsity of determinism does not bring responsibility back.**

  Here is an explanation of why Strawson insists the argument holds regardless of determinism, and how this applies to your friend's claim of self-improvement.

  ### 1. Why Indeterminism (The "Gap") Does Not Help

  Your intuition is that if determinism is false, there is a "gap" in the chain of cause and effect where free will can operate. You imagine that if my decision is not fully fixed by my past, then *I* am the one fixing it in that gap.

  Strawson's counter-argument is that this "gap" does not contain *you*; it contains **chance**.

  Imagine you are deciding whether to tell the truth or lie.
  *   **Scenario A (Determinism):** Your character, desires, and reasoning process inevitably lead you to tell the truth. Strawson says: You aren't responsible because you didn't choose your character.
  *   **Scenario B (Indeterminism):** Your character and desires lead you up to the moment of choice, but they don't fully determine it. A small element of randomness (the "gap") tips the scale toward telling the truth.

  Strawson asks: In Scenario B, are you more responsible? He argues you are not. If the decision was not determined by your character or reasons, then to that extent, it was **random**. If it was random, it was not *authored* by you. It just happened.

  For Strawson, responsibility requires **control**.
  *   If the action is determined by your past, you lack control (because you didn't choose your past).
  *   If the action is *not* determined by your past (indeterminism), you lack control (because it is partly random).

  Therefore, indeterminacy fails to supply **agency**. It removes the cage of causality, but it leaves you with a roll of the dice. A random number generator is not morally responsible for the numbers it produces, even if they aren't determined by previous numbers.

  ### 2. The Real Core: The Impossibility of *Causa Sui*

  The argument is not really about physics (determinism vs. indeterminism); it is about logic and the concept of **self-creation**.

  Strawson's argument relies on a principle we can call the **Principle of Motivation**: To make a choice, you must have a reason or a motivation. You cannot choose "in a vacuum."

  *   To change your character, you must make a choice.
  *   To make that choice, you must be motivated by *how you already are* (your values, your desires, your reasoning style).
  *   Therefore, the change is the result of your prior nature.
  *   To be responsible for the change, you must be responsible for that prior nature.
  *   But you cannot be responsible for that prior nature, because *that* was formed by earlier choices (based on an even earlier nature) or by luck (genetics/upbringing).

  This is the regress you identified. Strawson's point is that you cannot pull yourself up by your own bootstraps. To be the *ultimate* author of your character, you would have to exist *before* you had a character in order to choose what character to have. But you cannot exist before you exist.

  This is why Strawson says the argument does not depend on determinism. Even if the universe is indeterministic, **you still cannot be the cause of yourself (*causa sui*).** You always start with *some* nature that you did not choose, and all your subsequent choices flow from that nature.

  ### 3. The Puzzle of Your Friend

  This brings us to your friend who says he "made himself."

  Strawson would distinguish between two types of responsibility:
  1.  **Practical Responsibility:** The kind we use in courts, relationships, and daily life. Your friend certainly has this. He set goals, exerted effort, and changed his behavior. We praise him for this, and rightly so, because it encourages useful behavior.
  2.  **Ultimate Moral Responsibility (UMR):** This is what Strawson is attacking. UMR requires that you are the *ultimate, original source* of your actions in a way that makes praise or blame fundamentally deserved, not just socially useful.

  When your friend says, "I made myself," Strawson would ask: **"Why did you want to make yourself?"**

  *   **If he says:** "Because I valued discipline and disliked my temper."
      *   Strawson asks: "Where did that valuation come from?"
      *   If it came from his parents or genetics, he didn't choose it.
      *   If it came from a previous choice, what motivated *that* choice?
  *   **If he says:** "I just decided to, for no reason based on my prior self."
      *   Strawson says: Then that decision was arbitrary (random). You aren't responsible for random events.

  So, the difference is not one of degree. Your friend really did improve his character in the **practical** sense. He used the tools he had to remodel the house. But Strawson's argument is that he did not choose the tools, and he did not choose the desire to remodel. Therefore, he is not the **ultimate author** of the renovation.

  ### Summary

  To answer your specific questions:

  1.  **Does the falsity of determinism bring responsibility back?**
      No. Indeterminism introduces randomness, not control. Responsibility requires that the action comes from *you*, but if it is not determined by your character, it is not truly from *you*; it is from chance.

  2.  **What precisely is the argument asking of me that indeterminacy fails to supply?**
      It asks for **self-origination**. It demands that you be the cause of your own nature. Indeterminacy breaks the chain of past causes, but it does not allow you to step outside of time and biology to choose your own starting point.

  3.  **Is the difference regarding my friend merely one of degree?**
      No. It is a difference in kind. Your friend achieved **self-modification** (changing who you are based on who you already were). Strawson argues that **self-creation** (choosing who you are without relying on who you already were) is logically impossible.

  Strawson's conclusion is not that we should stop holding people accountable in daily life (he admits we can't help doing that), but that "Ultimate Moral Responsibility" is a concept that literally cannot exist, much like a "square circle." It is not a fact about the physical world (determinism); it is a fact about the logic of agency.
