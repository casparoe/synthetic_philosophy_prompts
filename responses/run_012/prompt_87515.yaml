answer: |-
  Here are three candidate scenarios I considered before settling on the one below. 

  1.  **The Light Switch:** Bob wants light and flips a switch. The mental state is "wanting light," the brain state is a specific motor command, and the effect is "light on." The problem here is that the effect is too binary; it's hard to show the specific neural firing wasn't necessary without getting into tricky details about switch mechanics.
  2.  **The Bus Catch:** Charlie sees a bus and runs to catch it. The mental state is "wanting the bus," the brain state is a specific running pattern, and the effect is "boarding." This is good, but it introduces external luck (whether the bus waits), which muddies the causal link between mind and body.
  3.  **The Puddle Avoidance:** Alice sees a puddle and steps around it. The mental state is "wanting dry feet," the brain state is a specific neural configuration, and the effect is "landing on dry pavement." This is the winner because the physical movement (the step) can vary widely in angle, speed, and muscle recruitment while still achieving the exact same outcome (dry feet), making the insensitivity of the effect to the physical detail very clear.

  I'm committing to **The Puddle Avoidance**. Here is the scenario:

  Alice walks down the sidewalk and spots a deep puddle blocking her path. She desires to keep her shoes dry and believes stepping around will achieve this, a mental state realized on this occasion by a specific, intricate firing pattern $N$ in her motor cortex. She lifts her foot and places it firmly on the dry pavement beside the water. Had pattern $N$ not fired, but a slightly different pattern $N^*$ realized the same desire due to normal neural noise, her foot would still have landed on dry pavement; but had the desire itself been absent, she would have walked straight through the water.

  ***

  ### Analysis

  **(a) The Exclusion Argument's Prediction and Failure**
  The causal exclusion argument predicts that because the physical state ($N$) is causally sufficient for the behavior (the step), the mental state (the desire) is redundant and causes nothing. It goes wrong here because it assumes causation is simply about physical sufficiency. In this case, $N$ is *too* specific. The effect (landing on dry pavement) does not depend on the precise details of $N$; it depends on the broader pattern of which $N$ is just one instance. By demanding that a cause be proportional to its effect—no more specific than necessary—we see that $N$ contains irrelevant detail (which exact neurons fired) that the effect doesn't care about, whereas the mental state captures exactly the right level of detail to be the difference-maker.

  **(b) The Counterfactual Check**
  *   **Mental Property ($M$):** The desire to keep shoes dry.
      *   *Counterfactual:* If $M$ had not occurred (no desire), would the effect ($E$) have happened? **No.** She would have walked through the puddle.
  *   **Physical Realizer ($P$):** The specific neural pattern $N$.
      *   *Counterfactual:* If $P$ had not occurred (but $M$ was realized by a different pattern $N^*$), would $E$ have happened? **Yes.** The step would still have landed on dry pavement.
  *   **Effect ($E$):** Landing on dry pavement.
      *   *Result:* $E$ counterfactually depends on $M$, but not on $P$. Therefore, $M$ is the cause, and $P$ is merely the background condition that happened to instantiate $M$.

  **(c) The Feature Doing the Work**
  The single feature doing all the work is **multiple realizability within the system** (often called "degeneracy" in biology). The system is set up so that the output is insensitive to micro-variations in the physical substrate. If you remove this feature—meaning, if the effect *only* happened when exactly pattern $N$ fired and no other pattern would have worked—the counterfactual dependence would shift. In that rigid case, $P$ would be necessary, and we would be back to plain old overdetermination (both $M$ and $P$ look like causes) or outright exclusion (only $P$ causes). The slack between the mental state and the specific physical realizer is what allows the mental state to独占 (monopolize) the causal role.

  **(d) The Skeptic's Objection**
  A skeptic who thinks non-reductive physicalism is wishful thinking would argue that you are conflating *explanation* with *causation*. They would say: "Of course the desire is a better *explanation* for a human observer, but causation is a physical transaction involving energy transfer and force. Only the neurons actually pushed the muscles; the 'desire' is just a vague label we slap on a cluster of physical states. By using proportionality, you aren't finding a new kind of cause; you're just changing the definition of 'cause' to mean 'whatever fits our descriptive interests.' You're cheating by letting a coarse-grained property take credit for work that was actually done by the fine-grained physical property."
