  8.  **Final Polish:** Ensure the distinction between *phenomenology* (what it's like) and *etiology* (what causes it) is clear. This is the crux of the user's confusion. Nora focuses on phenomenology; User focuses on etiology. Both are right about their focus, but talking past each other.

  *(Self-Correction on the Experiment)*: The user suggested matching the slope with a board. If the hand is under a cloth, it's a proprioceptive match. If visible, it's visuo-motor. Proffitt found that verbal estimates change with load, but action (walking) does not always. I need to make sure the user understands that *action* measures are often used to bypass "judgment" biases, but they introduce their own confounds (motor fatigue). I should highlight this trade-off.

  *(Refining the Paper Advice)*: The user asks "where should I concede?" Concede that the *experience* is different for her. Hold that the *classification* of that experience as 'perceptual' is the theoretical move that needs justification.

