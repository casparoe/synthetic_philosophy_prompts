          2.  Evaluation of the proposed experiment (tilting board, weights, visibility) and interpretation of outcomes.
          3.  Term paper strategy (where to concede, where to hold the line, what to argue).

  2.  **Deconstruct the Philosophical Issue:**
      *   **Topic:** Cognitive Penetrability of Perception (CPP).
      *   **The "Standard View" (User's side):** Perception is modular, encapsulated, early vision. Thinking happens *after*. (Fodor, Pylyshyn).
      *   **The "Penetrability View" (Nora's side):** Beliefs, desires, and concepts can alter perceptual experience itself. (Churchland, Siegel, Stokes).
      *   **The Hard Problem:** Distinguishing *perceptual experience* from *perceptual judgment*. This is the "criterion problem."
      *   **Nora's Analogies:**
          *   Müller-Lyer: Classic example of *encapsulation* (knowledge doesn't change look). But wait, Nora uses it to say "looks persist despite knowledge." She's arguing that the *look* is robust.
          *   Music Theory: This is *perceptual learning*. Often distinguished from cognitive penetrability (low-level vs. high-level), but relevant.
      *   **The Backpack Case:** Proffitt's "embodied perception" research (hills look steeper when tired/heavy). Controversial. Is it visual or action-oriented?

  3.  **Address Request 1: Framing the Question to Nora:**
      *   *User's worry:* Asking "Does it look steeper or do you think it's steeper?" begs the question because Nora says they feel the same.
      *   *Analysis:* The user is right to worry. If perception is penetrated, the *phenomenology* changes. If it's just judgment, the phenomenology stays the same, but the output changes.
      *   *Advice:* Don't ask for introspection directly (unreliable). Ask about *phenomenal contrast*. Use the "what is it like" angle but focus on *invariance*.
      *   *Key Distinction:* Is the *content* of the experience changing, or just the *weight* given to it in decision making?
      *   *Strategy:* Shift from "look vs. think" to "experience vs. report." Acknowledge that for her, they are phenomenally identical, but philosophically distinct.

  4.  **Address Request 2: The Experiment:**
      *   *Proposed Design:* Tilting board, weights, visible vs. hidden hand, verbal report vs. matching.
      *   *Critique:* This mimics Proffitt's work.
      *   *Outcomes:*
          *   *Outcome A (Weights change matching when visible):* Suggests perception *or* response bias.
          *   *Outcome B (Weights change matching when hidden):* Suggests proprioceptive drift or motor bias, not necessarily visual.
          *   *Outcome C (No change in matching, only verbal):* Suggests judgment bias (User wins).
          *   *Outcome D (Change in matching, not verbal):* Suggests action-specific perception (Nora wins, but maybe not "visual" in the traditional sense).
      *   *The "Settling" Problem:* No experiment settles the metaphysical question because *any* measure (verbal or motor) is a *report* of experience, not the experience itself. This is the "criterion problem" again.
      *   *Advice:* Don't expect the lab to settle the metaphysics. Use it to demonstrate the *difficulty* of isolation.

  5.  **Address Request 3: The Term Paper:**
      *   *Goal:* Avoid declaring a side. Focus on the *structure of the dispute*.
      *   *Concession:* Concede that phenomenology is real (Nora's experience is valid). Concede that standard introspection is unreliable.
      *   *Hold the Line:* Hold that *explanation* is distinct from *description*. Just because it feels like seeing doesn't mean the visual module is penetrated.
      *   *Argument:* The paper should argue about the *underdetermination of the data*. The real philosophical work isn't deciding if hills look steeper, but deciding what counts as evidence for "seeing" vs. "judging."
      *   *Title Idea:* Something about the "Criterion Problem" or "The Architecture of Disagreement."

