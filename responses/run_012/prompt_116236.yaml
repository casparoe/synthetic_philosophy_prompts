      *   **Specific Scenario:** Argument with friend (Nora) about whether a heavy backpack makes a hill *look* steeper (perceptual change) vs. making her *judge* it steeper (cognitive inference).
      *   **Nora's Analogy:** Müller-Lyer illusion (knowing lines are equal doesn't stop them looking unequal) and Music Theory (hearing tension in chords after training).
      *   **User's Stance:** Skeptical. Thinks it's inference/attention, not perception.
      *   **Goal:** Not a verdict, but advice on how to handle the disagreement concretely (dialogue, experiment design, term paper strategy).
      *   **Key Requests:**
