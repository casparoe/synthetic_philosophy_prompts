      *(One last thought on Tom)*: If the manager says nothing about Tom, and Tom crashes next week, the manager is liable for knowing and not acting. I must emphasize that the "secret" is temporary at best. The hearing is about Ray, but the *strategy* must include Tom. I will advise addressing the *behavior* generally in the hearing, and handling Tom immediately after.

      *Wait, one more nuance:* The user asks "what I should actually say on Friday." I need to give them a stance.
      Stance: Ray violated policy. Ray did not necessarily cause the accident. The system encouraged the violation. The punishment should fit the violation, not the accident cost.
      And regarding Tom: I cannot tell the manager to break confidence lightly, but safety overrides confidentiality. I will suggest that the "way of thinking" requires addressing Tom immediately after the hearing, but in the hearing, focus on the *prevalence* of the issue without necessarily naming names if not asked, or framing it as a systemic discovery. Actually, honesty is the best policy. If the union rep asks "Is this isolated?", the manager shouldn't lie. I'll advise framing it as "We are reviewing all compliance."

