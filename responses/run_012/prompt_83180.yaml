      This policy addresses five recent occurrences: a source's on-record usage requiring verbatim quotation; a Glab columnist's reclamation of the term contested by advocacy groups; an automated summarizer generating the term from reader comments; a request to reprint an 1880s editorial containing the term; and reader feedback indicating the house-style mask "Glab-r--" functions as both a concealment and a distinct insult.

      POLICY CLAUSES:

      1. Verbatim Integrity vs. Prohibition
      Reporters must quote sources accurately to preserve contextual truth. However, no employee shall print the term "Glab-rot" in any capacity. When a source uses the term on record, the quotation must remain verbatim unless it contains the term, in which case the term must be removed to ensure the quotation remains accurate without violating the prohibition.

      2. Reclamation and Audience
      Members of the Glab community retain the right to reclaim "Glab-rot" for self-reference. The Paper respects this agency but shall not amplify derogatory language. Consequently, Glab columnists may use the term regarding themselves provided the editors determine the usage is non-derogatory, though any usage printed by the Paper is presumed to carry institutional endorsement and thus derogatory weight.

