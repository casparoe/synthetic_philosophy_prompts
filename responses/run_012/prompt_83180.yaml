      The masked form "Glab-r--" is intended to indicate the term without printing it. Readers have noted the mask conveys the full semantic content of the unmasked term. Therefore, staff should use the mask to avoid printing the term, unless the mask itself is understood to be the term, in which case the full term must be printed within quotation marks to clarify that the mask is prohibited.

      6. Definitional Glosses
      Explanations of why the term is forbidden must not repeat the term. To clarify the prohibition, editors may define the term's derogatory force without invoking the term's meaning, unless such definition requires specifying the term to distinguish it from non-derogatory synonyms.

