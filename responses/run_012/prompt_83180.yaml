      Content generated by automated tools lacks human intent and therefore cannot constitute a slur in the pragmatic sense. However, the Paper accepts responsibility for all published content regardless of origin. If the summarizer produces the term, it is considered an error of fact rather than speech, unless a reader perceives it as speech, in which case it is treated as a human act requiring correction.

