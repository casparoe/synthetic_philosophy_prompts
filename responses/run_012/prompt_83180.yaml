      Archives must remain unaltered to maintain the historical record of The Crestwood Sentinel. However, past usage of "Glab-rot" violates current ethical standards. Reprints of archival material shall preserve the original text exactly, except where the term appears, in which case it shall be silently altered to protect contemporary readers from historical harm.

