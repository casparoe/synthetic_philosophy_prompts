prompt: |-
  Hey, so I'm in this just war theory seminar and we've been reading Anscombe, and I'm trying to get my own views straight before I write a response paper. I was up late last night mapping this out on a whiteboard and now I'm more confused than when I started. Here's roughly where I've landed, and I want to know if it actually hangs together or if I'm kidding myself. (1) I think Anscombe was basically right that Truman was a murderer for ordering the atomic bombings, because he intentionally killed noncombatants as a means to forcing surrender. (2) But I'm definately not a pacifist — I think some wars are just and that soldiers can permissibly kill enemy combatants. (3) I accept the doctrine of double effect: it can be okay to cause civilian deaths as a foreseen but unintended side effect of a legitimate attack, as long as the military advantage is proportional. (4) I think what makes killing murder is the intention to kill an innocent person, not just the foresight that some will die. (5) I also think nuclear deterrence has been morally permissible because it prevented a third world war, even though it involves a conditional threat to kill millions of civilians if deterrence fails. (6) And I think we should judge historical actors like Truman by the moral standards of their time, and by those standards the bombings were pretty widely accepted as necessary. (7) But I also think that Anscombe's absolutism about never intentionally killing the innocent is too strict in a supreme emergency, where a nation's survival is at stake. (8) I think the firebombing of Tokyo and Dresden were also murderous, not just the atomic bombs. (9) And I think the distinction between intended and merely foreseen harm is real and morally important.

  My friend says I'm contradicting myself alot, but I'm not sure which parts are actually in tension and which just look like they are. Like, is (2) really in tension with (1)? I don't think so, because combatants aren't innocent in the relevant sense. And is (3) in tension with (1)? I don't think so either, because Hiroshima wasn't a side effect, it was the whole point. But maybe (5) conflicts with (4) in a way I'm not seeing? And (6) and (7) both seem to soften (1), but maybe they do it in different ways. Can you audit this for me? Tell me which pairs are genuinely in tension, which are only apparently so, rank the real tensions by severity, and say what the cheapest fix would be for each — and which single revision would clean up the most. I don't want a lecture on Anscombe, I want to know if my package is consistent and what has to give.
