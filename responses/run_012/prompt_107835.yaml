answer: |-
  **R1 (Procedural Majoritarianism)**
  (a) The will is identical to the outcome of the agreed-upon voting procedure.
  (b) Debatable (depends on whether the procedure was fair), but often treated as a rule.
  (c) Supports Friend (Council must obey the vote count).

  **R2 (Empirical Aggregation)**
  (a) The will is the sum of the actual psychological preferences of individuals at the moment of voting.
  (b) Debatable (votes may mismeasure preferences due to rumors or confusion).
  (c) Supports Friend (if vote was accurate) or Other (if vote was skewed by misinformation).

  **R3 (Rousseauian General Will)**
  (a) The will is what people would choose if fully informed and reasoning toward the common good, distinct from actual votes.
  (b) Debatable (highly contested who defines "informed" or "common good"); often unfalsifiable.
  (c) Supports Other (Council can override vote to match true interest).

  **R4 (Unitary Agent)**
  (a) The student body is a single metaphysical entity with one mind, distinct from the sum of its members.
  (b) False/Metaphorical (collections are not minds); used as a poetic justification.
  (c) Ambiguous (used to justify either obeying the "body's" vote or the council's interpretation of the "body's" health).

  **R5 (Exclusionary Populism)**
  (a) The will belongs only to the "real" or "true" members of the community, excluding elites, outsiders, or the "corrupted."
  (b) Debatable/Normative (requires defining who counts as "real people").
  (c) Supports whoever successfully defines the in-group (could be either side).

  **Compatibility and Substance**
  R1 and R2 are usually held together (votes reveal preferences), but both contradict R3 (votes vs. true interest). R4 is often smuggled in to justify R3 (the "Body" knows better than the "Parts"). R5 contradicts R1 if the majority voters are deemed not "real people." R1 and R2 are substantive claims (can be proven wrong by evidence of rigging or misinformation). R3 risks being empty: if the "true will" is defined as "whatever is actually good," the phrase becomes a tautology that does no work except to label the speaker's preference as correct.

  **Opposite Directions**
  Yes, the phrase points opposite ways when pitting R1 (the vote says Ban) against R3 (the informed will says No Ban). On the R3 reading, the deeper will wins because R1 is viewed merely as a flawed measurement tool, not the will itself. The vote is treated as data, not authority.

  **Change Over Time**
  On R2, the will changes as preferences change; the original vote *was* the will for that afternoon, but not forever. On R3, the will might be constant (the true interest didn't change), meaning the original vote *never* was the will, only a mistake. On R1, the will is fixed until a new vote is held, regardless of changing minds.

  \answer{R1}
