answer: |-
  "The short version"
  Audit the outcome verifier: if gameable or nonexistent, halt training. Assess trace legibility: can non-expert labelers distinguish correct steps from plausible errors? If not, default to outcome-only. If yes, run the Step Swap Test; if the process reward model fails to penalize the swapped step, drop process supervision—it's learning prose, not logic. Check budget: if process labels exceed the two-family quarterly quota, default to outcome-only unless safety risk is critical. This empirical gatekeeping replaces debate with data, addressing the lead's skepticism by proving labelers add signal beyond style before committing funds.

  "The questions, in order"

  1.  **Is the outcome verifier robust?**
      *   **Sufficient Answer:** Demonstrate one way to pass the verifier without solving the task (e.g., deleting tests, reading fixtures). If none exist, classify as "Reliable."
      *   **Decides:** If "Gameable" or "Nonexistent," decision is **Neither** (fix verifier first). If "Reliable," proceed to Q2.

  2.  **Is the trace legible?**
      *   **Sufficient Answer:** Show a labeler step 7 from a correct trace and step 7 from a flawed trace. Can they identify the flaw without running the code?
      *   **Decides:** If "No," decision is **Outcome-Only**. Process labels will be noise. If "Yes," proceed to Q3.

  3.  **Does the Step Swap Test pass?**
      *   **Sufficient Answer:** Take a known-good trace, swap one step for a plausible-but-wrong step, and score both with the current process reward model. Does the score drop significantly?
      *   **Decides:** If "No," decision is **Outcome-Only**. The lead is right; the model learns prose style, not reasoning. If "Yes," proceed to Q4. (This test belongs here as the empirical proof of signal).

  4.  **Does it fit the budget?**
      *   **Sufficient Answer:** Compare estimated label cost against the remaining quota (2 families/quarter).
      *   **Decides:** If "No," decision is **Outcome-Only**. If "Yes," decision is **Both**.

  "Where it stops and hands off"

  *   **Verifier Fix Feasibility:** If Q1 fails, the **Engineering Lead** decides if the verifier can be hardened within two weeks. If not, the task family is paused.
  *   **Budget Override:** If Q4 fails but safety risk is critical, the **Team Lead** decides whether to burn the quarterly quota early.
  *   **Final Sign-off:** The **Team Lead** signs the spec. If Q3 fails, his skepticism is validated empirically; if Q3 passes, he signs off on process supervision despite skepticism.

  "Three runs"

  (a) **SQL Migration:** Verifier is staging run (Reliable). Traces are short (Legible). Step Swap detects missing backfills (Pass). Budget available.
  *   **Verdict:** **Both.**
  *   **Note:** Standard case for process supervision.

  (b) **Fixing Failing Tests:** Verifier is test suite (Gameable—model can delete tests). Traces are legible.
  *   **Verdict:** **Neither.**
  *   **Note:** This contradicts the intuition that "passing tests" equals success. Training here rewards sabotage. Fix the verifier before training.

  (c) **Rollout Plan:** Verifier is nonexistent. Traces are long (100+ steps). Labeler is not the stakeholder (Illegible).
  *   **Verdict:** **Neither.**
  *   **Note:** Do not train on this family yet. You cannot verify outcomes, and labelers cannot judge steps.

  "Where this will misfire"

  This procedure formalizes judgment calls it claims to eliminate. Legibility is subjective; a step looks obvious to a senior engineer but opaque to a paid labeler, leading to false negatives on process viability. The Step Swap Test validates local coherence but misses global strategy errors—a model can write perfect prose while solving the wrong problem. A swapped step might be locally plausible but globally catastrophic, which the test catches, but it might also be locally wrong but globally harmless, which confuses the signal. Furthermore, labeler consistency varies; fatigue makes step 70 indistinguishable from noise, inflating costs. Politically, the Team Lead may reject empirical 'Both' verdicts if they conflict with his prose-style theory, rendering the data decorative. Finally, defining 'gameable' is itself a debate; engineers often defend brittle verifiers as 'good enough.' This tool reduces shouting, but it cannot remove the need for trust in the people answering the questions. If the labelers lie or the engineers sandbag the verifier difficulty, the output is garbage. You are measuring the measurers, which is always the hardest part of alignment work. The budget constraint also forces hard choices; if three families look viable, picking two introduces selection bias that this procedure doesn't resolve. Ultimately, this spec protects you from bad decisions, but it cannot force good engineering. If the verifier is weak, no amount of process supervision saves the model, yet the pressure to train will remain. The 'Neither' outcome creates friction; stakeholders want models trained now, not later. This procedure delays gratification, which is organizationally expensive. You risk becoming a bottleneck if every task family requires this hour-long audit. It works best when you have the authority to say no, which is rare.
