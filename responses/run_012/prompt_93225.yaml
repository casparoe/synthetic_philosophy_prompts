      *   **Distinguish Property Types:** Introduce the distinction between *Qualitative* (pure) properties and *Non-Qualitative* (impure/haecceitic) properties.
          *   PII is usually interesting only if restricted to *Qualitative* properties.
          *   Maya is using Non-Qualitative properties (properties that reference specific individuals).
      *   **Address the Triviality Worry:** Confirm the user's fear. If we allow *all* relations (including "being identical to $a$"), PII becomes trivial ($a$ has "being $a$", $b$ has "being $b$").
      *   **Discuss the Costs:**
          *   *Rejecting (4):* You save PII from triviality but leave it vulnerable to Black's counterexample. You must restrict PII to *qualitative* properties.
