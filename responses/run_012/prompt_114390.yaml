      *   *The "Necessity":* It's not logical necessity (like math); it's *psychological* or *causal* necessity given human nature. If humans start in ignorance/fear and reason from effects to causes, they *must* start with many causes (polytheism) before abstracting to one (theism).

  4.  **Reconstruct the Argument:**
      *   *Premise 1 (Anthropological/Psychological):* Human cognition develops from the concrete/sensible to the abstract/invisible. (The "upward path").
