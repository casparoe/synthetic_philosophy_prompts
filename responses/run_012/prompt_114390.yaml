answer: |-
  This is a sophisticated question that cuts to the methodological core of Hume's *The Natural History of Religion* (1757). Your instructor is correct that Hume is engaging in "conjectural history," but your intuition is also correct: there is a tension between his empirical appeals and his modal conclusion ("necessarily must have been").

  To understand this, we must reconstruct the argument not as modern anthropology, but as an exercise in Newtonian experimental reasoning applied to human nature. Below is a reconstruction of the argument, an analysis of the "necessity" claim, and a distinction between settled scholarly interpretations and genuine points of contention.

  ### 1. Reconstruction of the Argument

  Hume's argument in Section I is best understood as a **inference to the best explanation** regarding human nature, using history as data points rather than the foundation itself.

  **The Premises:**
  1.  **Psychological Premise:** Human reasoning regarding invisible powers proceeds from the known to the unknown. We infer causes from effects. In a "rude" state, humans are concerned with immediate, variable, and sensible events (weather, health, harvest).
  2.  **Sociological Premise ("Improvement"):** Human societies develop from simple, disordered, and fear-driven states ("rude beginnings") toward more complex, ordered, and reflective states ("greater perfection"). This reflects the Scottish Enlightenment "stadial theory" of social development.
  3.  **Historical Premise:** The available historical record shows polytheism universally in ancient societies, while theism appears only later and often among philosophical elites or specific nations.

  **The Inference:**
  If human cognition moves from concrete to abstract (Premise 1), and society moves from rude to polished (Premise 2), then the religion of the "rude" state must reflect concrete, multiple causes (polytheism), and the religion of the "polished" state might reflect abstract, unified causes (theism).

  **The Conclusion:**
  Polytheism was not just historically first, but **psychologically primary**. Given the constraints of human nature in early social conditions, it was *causally necessary* that polytheism arise before theism.

  ### 2. The Meaning of "Necessity"

  You asked how an empirical generalization supports a claim of necessity. In Hume's framework, this is **causal necessity grounded in uniformitarian psychology**, not logical necessity.

  *   **Uniformity of Human Nature:** Hume assumes that human nature is constant across time and place. The "rude" ancestors of 3,000 years ago possessed the same cognitive architecture as modern humans.
  *   **The Constraint:** If the cognitive architecture requires starting with sensible particulars to infer invisible causes, and if early life is dominated by a plurality of uncontrollable events (famine, war, disease), the mind *must* posit a plurality of agents. To posit a single, omnipotent, invisible cause requires a level of abstraction and philosophical leisure that "rude" humanity does not possess.
  *   **The Role of History:** The historical evidence ("universal testimony") is not the *proof* of the necessity; it is the **verification** of the psychological theory. If the psychological theory is true, history *should* look this way. Since history *does* look this way, the psychological theory is confirmed.

  Therefore, the "necessity" is conditional: *Given* human nature as Hume describes it, polytheism *must* be first. The historical record confirms that human nature is indeed as he describes it.

  ### 3. The Work Done by "Improvement of Human Society"

  The claim about social improvement serves two specific functions in the argument:

  1.  **It establishes directionality:** It counters the idea of a "Fall" or degeneration from a golden age. If society improves, religion (as a social phenomenon) should arguably become more refined. However, Hume complicates this later by suggesting theism is a philosophical refinement that the masses cannot sustain. In Section I, "improvement" licenses the move from "what we see in the past" to "what the mind is capable of." It allows Hume to treat ancient people as cognitively less developed (in terms of abstraction), not just culturally different.
  2.  **It isolates the variable:** By framing history as a progression from rude to perfect, Hume can argue that theism is associated with the "perfect" (philosophical) stage and polytheism with the "rude" (natural) stage. This sets up his later argument that theism is fragile and prone to degenerating back into polytheism (idolatry) when the "improvement" stalls.

  ### 4. Scholarly Consensus vs. Contested Readings

  It is vital to distinguish what Hume scholars generally agree upon from where legitimate debate remains.

  #### Relatively Settled Consensus
  1.  **Target: Primitive Monotheism:** There is consensus that Hume's primary target is the doctrine of "Primitive Monotheism" (the idea that the first humans naturally knew one God, often associated with Herbert of Cherbury, certain Deists, or Protestant scholastics). Hume wants to show that reason does not naturally lead to theism; passion does, and passion leads to polytheism.
  2.  **Conjectural History:** Scholars agree Hume is not doing empirical history in the modern sense. He is using history illustratively to support a theory of human nature. He is willing to ignore counter-evidence (as he admits regarding the "one or two nations" that were theistic) if it conflicts with the general psychological trend.
  3.  **Passion over Reason:** It is settled that for Hume, the origin of religion is not contemplative reasoning about design (that comes later) but active passions (fear, hope, anxiety) regarding future events. Polytheism fits the "passionate" mind better than theism.

  #### Contested Readings (Defensible Alternatives)
  While the above is standard, there are nuances in how the argument is weighted that remain debated.

  **Reading A: The Psychological Priority Reading**
  *   **Claim:** The argument rests almost entirely on cognitive architecture. History is merely anecdotal support.
  *   **Assumption:** This reading assumes Hume believes the "necessity" holds even without the historical record. If we found a tribe of primitive monotheists, Hume would argue they were anomalous or influenced by philosophy, because the *psychology* dictates polytheism first.
  *   **Weakness:** It risks making Hume's argument unfalsifiable. If history contradicts him, he dismisses history; if history supports him, he cites history.

  **Reading B: The Sociological Instability Reading**
  *   **Claim:** The argument is less about the *origin* and more about the *instability* of theism. Hume is arguing that even if theism arose early, it naturally corrupts into polytheism (idolatry). Therefore, the "universality" of idolatry 1700 years ago shows that polytheism is the *stable* equilibrium of human religion, while theism is a fragile exception.
  *   **Assumption:** This reading leans heavily on Sections III–VIII (on idolatry and corruption) to interpret Section I. It assumes "first" means "dominant baseline" rather than strictly "chronologically first."
  *   **Weakness:** It struggles with Hume's explicit textual claim that theism comes *after* polytheism in development, not just that it degrades *into* it.

  **Reading C: The Rhetorical/Ironic Reading**
  *   **Claim:** Some scholars argue Hume does not genuinely care whether polytheism or theism was first. His goal is to show that *both* arise from irrational passions (fear/ignorance). The "Natural History" is a trap: whether you are a polytheist or a theist, your religion is natural (passion-based) rather than rational.
  *   **Assumption:** This assumes Hume's ultimate goal is the undermining of religious rationality (aligning with the *Dialogues Concerning Natural Religion*), and the historical claim is a rhetorical device to unsettle Christian readers.
  *   **Weakness:** It risks making Hume's detailed psychological account of polytheism gratuitous. Most scholars now reject pure irony in favor of taking the psychological account seriously.

  ### 5. Weaknesses and Critical Evaluation

  For a seminar paper, you should be prepared to critique the argument. Here are the standard weaknesses identified in the literature:

  1.  **The Empirical Gap:** Hume's anthropology is outdated. Modern cognitive science of religion (CSR) does not necessarily confirm that polytheism is cognitively "easier" or prior to monotheism. Some CSR scholars argue that hyper-active agency detection might lead to a diffuse sense of spirits (animism) rather than structured polytheism, and that monotheistic concepts can be acquired early.
  2.  **The "Necessity" Gap:** Even granting Hume's psychology, the move from "humans tend to start with concrete causes" to "humans *must* posit multiple gods" is a leap. One could imagine a "rude" society positing one angry spirit behind all bad events. Hume assumes plurality of effects implies plurality of causes, but this is not a strict cognitive rule.
  3.  **The Oscillation Problem:** In later sections, Hume argues religion oscillates between theism and polytheism. This creates tension with Section I's linear progress narrative. If religion oscillates, can we really say polytheism is "first" in a meaningful developmental sense, or is it just one pole of a pendulum? (Scholars debate whether Hume resolved this tension).
  4.  **The Philosophical Elite Problem:** Hume argues theism arises from philosophical reasoning. But if the masses are incapable of this reasoning (as he implies), how does theism ever become a "popular and established system"? He relies on the idea that philosophers influence the masses, but his own psychology suggests the masses will inevitably drag theism back down to polytheism (saints, relics, idols). This makes the existence of stable monotheistic societies difficult to explain on his own terms without invoking political coercion.

  ### Summary for Your Seminar
  Hume is arguing that **polytheism is the natural religion of human passion, while theism is the artificial religion of human reason.** The "necessity" is psychological: given that early humans were driven by fear and concrete thinking, they *could not* have conceived of theism first. The historical record is cited not as the source of the truth, but as the expected output of this psychological machine.

  The strongest critique you can offer is that Hume conflates **chronological priority** (what came first in time) with **psychological priority** (what is most natural to the mind). By using conjectural history, he shields the psychological claim from historical falsification, but this makes the "necessity" claim circular: it is necessary because human nature is X, and we know human nature is X because history shows Y.
