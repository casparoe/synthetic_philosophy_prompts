answer: |-
  Your intuition that something was "off" is well-founded. Your friend sounds very confident, and he is using the right buzzwords (predictive processing, amodal, cross-modal), but on the specific details of Molyneux's problem, **he has the empirical science backward and the philosophical implications oversimplified.**

  If you were to walk into a seminar on the philosophy of perception or vision science today, here is how the room would likely react to his claims, point by point.

  ### 1. The Empirical Claim: "We've run the test... and the answer turns out to be yes."

  **The Verdict:** **Factually Incorrect.**
  This is the biggest hole in his argument. He claims modern science has proven the newly sighted *can* immediately distinguish the cube from the sphere. The most famous, rigorous modern test says the opposite.

  *   **The Science:** In 2011, a team led by Richard Held (MIT) published a landmark study in *Nature Neuroscience* regarding "Project Prakash." They studied children in India who were born blind (due to cataracts) and had their sight surgically restored. This is the closest we can ethically come to running Molyneux's experiment.
  *   **The Result:** The patients **failed** the test immediately upon gaining sight. They could not match the object they held (touch) to the object they saw (vision). They only learned to make that connection after a few days of visual experience.
  *   **The Consensus:** While there are older, anecdotal case studies (like the 18th-century case of "Virgil" described by Oliver Sacks) that are ambiguous, the controlled data supports **Locke**, not Leibniz. The answer to "Can they do it *the moment* they see?" is **No**.

  **Why your friend might think this:** He may be conflating "restored sight" (cataracts) with "sensory substitution" (devices that turn camera images into sound patterns). Some studies on sensory substitution show faster transfer, but that involves a different cognitive mechanism and doesn't count as "pure vision" in the Molyneux sense. Or, he may simply be remembering the *hope* of the science rather than the *result*.

  ### 2. The "Amodal" Conclusion: "People transfer shape information... which shows perception is amodal."

  **The Verdict:** **Non-Sequitur (Does not follow).**
  Your friend argues: *Transfer happens -> Therefore perception is amodal (innate/shared).*

  *   **The Wince:** Even if the answer were "Yes" (immediate transfer), concluding that perception is "amodal" is a further philosophical step, not a raw data point. "Amodal" implies there is a single representation of "shape" in the brain that both touch and vision plug into.
  *   **The Alternative:** It is possible to have cross-modal transfer that is *learned* very rapidly, not innate.
  *   **The Reality:** Since the data actually shows *no* immediate transfer (see above), the argument for innate amodal perception is actually weakened. The Prakash data suggests that "tactile shape" and "visual shape" are initially distinct representations in the brain that must be *calibrated* through experience. This supports the empiricist view that the connection is learned, not pre-wired.

  ### 3. The Predictive Processing Point: "There's no such thing as a 'pure' visual experience... the question is a relic."

  **The Verdict:** **Philosophically Glib (A Category Error).**
  This is the most sophisticated-sounding part of his argument, but it's a dodge.

  *   **The Claim:** Predictive processing (the idea that the brain is constantly guessing what it will see) means we never have "raw" sensation, so asking about "sight alone" is nonsense.
  *   **The Wince:** Molyneux's question isn't about whether vision is "pure" in the sense of being free from brain processing. It's about whether vision is free from prior *conceptual association* with touch.
  *   **Why it doesn't dissolve the problem:** Even if the brain is predicting, *what* is it predicting? Is it predicting based on innate geometric rules (Nativism) or based on past associations (Empiricism)? Predictive processing is a theory about *mechanism* (how the brain processes), whereas Molyneux is a question about *epistemology* (where the knowledge comes from).
  *   **The Scientist's View:** A vision scientist would say predictive processing explains *why* the learning happens so fast after sight is restored, but it doesn't explain away the need for learning in the first place. Calling the question a "relic" is a way of avoiding the hard question: *Is the mapping innate or learned?*

  ### 4. What would a Defender of Locke (Empiricist) say back?

  Your friend made it sound like no serious person holds the empiricist view anymore. That is false. Many philosophers (e.g., Evans, Campbell) and scientists side with Locke, especially after the Prakash results. Here is their counter-argument:

  1.  **Qualitative Difference:** A sphere feels like a continuous, unbroken surface to the hand. To the eye, a sphere looks like a shaded circle with highlights. There is no logical necessity that "continuous feel" must map to "shaded circle." The brain has to learn that correlation.
  2.  **The "Yes" is too fast, but not instant:** Empiricists admit the learning happens incredibly fast (sometimes within minutes or days). But "fast learning" is not the same as "innate knowledge." If you learn to drive a car in ten hours, it doesn't mean you were born knowing how to drive.
  3.  **The Burden of Proof:** The Nativist (Leibniz) has to prove the connection is pre-existing. The Empiricist just has to show that experience is *necessary*. Since the Prakash patients failed *without* experience, the Empiricist wins by default.

  ### Summary: Who won the argument?

  **You have the stronger position, scientifically and philosophically.**

  *   **On the Science:** Your friend claimed the data says "Yes." The data says "No" (initially).
  *   **On the Philosophy:** Your friend claimed the question is dissolved by predictive processing. Philosophers generally view this as changing the subject.
  *   **On the Consensus:** The current consensus is actually a "Qualified Locke." The answer is **No** at the first moment, but **Yes** very shortly after. This validates the empiricist claim that visual-tactile mapping is a product of experience, not a pre-loaded file in the brain.

  **How to push back:**
  You can tell him: *"I looked up the Project Prakash studies from 2011. The newly sighted kids actually failed the test immediately. They only learned the connection after a few days. That suggests Locke was right that the association isn't innate, even if the learning is fast. Also, predictive processing explains how we learn, but it doesn't prove the knowledge was there before the learning."*

  Your friend's argument sounds "hard-headed and science-y" because it relies on a narrative of scientific progress overturning old philosophy. But in this specific case, the "old philosophy" (Locke) was vindicated by the new science.
