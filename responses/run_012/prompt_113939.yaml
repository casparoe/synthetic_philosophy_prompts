  1.  *Endorsement:* Remove. Premise: The state cannot assert worthiness for a moral monster.
  2.  *Reparative:* Retain. Premise: Removal inflicts harm on the vulnerable by destroying their site of healing.
  3.  *Historical:* Neutral. Premise: Archives preserve the record regardless of the statue's location.

  **Divergence:** The community's transformative usage.
  **Without Feature:** Without reclamation, Reparative aligns with Endorsement (removal reduces harm).
  **Defusal:** Endorsement theorist argues state intent at erection fixes meaning permanently, regardless of public uptake.
