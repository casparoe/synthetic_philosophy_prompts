      *   *The Suberogation Issue:* Claim 2 says suberogation is blameworthy. Claim 5 repeats this. Claim 3 says duty is what can be demanded. If it's permitted, it can't be demanded against. So blame is unmoored. This is the "Suberogation Problem" (Heyd, McNamara).
      *   *Decision:* The 3 vs 4 clash is more foundational. The 2 vs 3 clash is more about the specific mechanics of blame. I will rank 3 vs 4 as the worst because it undermines the *theory* behind the profile, whereas 2 vs 3 is a known puzzle that can be patched. Actually, looking closer: Claim 4 says permissions are just "permissions not to maximize." Claim 3 says limits are fixed by "reciprocity." These are competing *explanations* for the same phenomenon (the existence of options). You can't have both be the *fundamental* explanation.
      *   *Re-evaluating Severity:* Actually, Claim 2 (Suberogation is blameworthy) creates a huge problem for Claim 3 (Obligation = Demands). If I can blame you, I'm implicitly claiming you violated a norm. If the norm isn't a demand (because it's permitted), what is the norm? This threatens the coherence of the "Demand" view in Claim 3.
      *   *Let's stick with 3 vs 4 as the deepest theoretical crack.* It's a clash between Impartialism and Contractualism.
      *   *Wait, Claim 5 says "Doing the suberogatory is blameworthy." Claim 2 says "You're still kind of a jerk."* These are consistent.
      *   *Okay, let's look at 3 vs 4 again.* Claim 4: Reasons are agent neutral. Claim 3: Limits are reciprocal justification. If reasons are agent neutral, why do I need to justify specifically to *you*? Why isn't the limit just "what produces the best outcome"? Claim 4 tries to stop short of maximizing, but Claim 3 provides a *different* brake. Having two different brakes is okay, but claiming the *reasons* are neutral while the *limits* are relational is the tension.
      *   *Actually, the 2 vs 3 tension is more immediate for a seminar.* "How can you blame someone for doing what you admit they had a right to do?" This is the classic Suberogation objection. Claim 3 defines rightness via demands. Claim 2 asserts blame for permitted acts. If blame implies a violation of a demand, 2 and 3 contradict.
      *   *Okay, I will rank 2 vs 3 as the most dangerous for a seminar defense (the "Gotcha" question), but 3 vs 4 as the deepest theoretical inconsistency.* I'll present 3 vs 4 as the "Foundational Crack" and 2 vs 3 as the "Defensibility Crack." I need to pick one as "Worst." I'll pick 3 vs 4 because it makes the system unstable at the root. If your theory of reasons (4) doesn't match your theory of obligation (3), the whole thing collapses.

