      *   **Deep Dive on the Worst (3 vs 4):**
          *   Explain *why*: Agent-neutral reasons push toward maximizing. Reciprocal demands push toward relational limits.
          *   The "Cheap Fix": Give up the strong version of Claim 4 (Agent-Neutrality).
