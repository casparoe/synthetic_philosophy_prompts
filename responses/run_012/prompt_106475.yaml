      *   Which is cheaper? Dropping Claim 4 is cheaper for preserving the "Demand/Reciprocity" intuition which seems central to the user's view of supererogation (Claim 1 & 3 link well). Claim 4 feels like an add-on to sound "impartial."
      *   *Wait, Claim 2 (Suberogation) is the most controversial.* Many philosophers deny suberogation exists. If the user wants to defend it, they need a robust account of blame. Claim 3 undermines that account.
      *   *Okay, final decision:* The worst tension is **3 vs 4**. It's a category error between the *source* of norms (relationships) and the *weight* of reasons (impartial value).
