      *   **Claim 3 (Demand/Reciprocity Criterion):** The line between required/permissible is fixed by what others can *demand*. Demands must be *reciprocal/justifiable*. (Sounds like Scanlonian contractualism or a Kantian reciprocity view).
      *   **Claim 4 (Agent-Neutrality of Reasons):** Reasons are agent-neutral (suffering is suffering). Permissions are just "permissions not to maximize," not based on agent-relative weight. (This is a strong Consequentialist/Impartialist claim about *reasons*, combined with a non-maximizing view of *obligation*).
      *   **Claim 5 (Blame/Status):** Missing supererogation = not blameworthy (but makes you "smaller"). Doing suberogation = blameworthy (even though permitted).

  3.  **Evaluate Pairwise Consistency:**

      *   **1 & 2:** Supererogation (above duty) and Suberogation (below duty but permitted). These are standard mirror images. *Consistency: High.*
      *   **1 & 3:** Supererogation exists because others can't *demand* it. This fits well with a demand-based view of obligation. *Consistency: High.*
      *   **2 & 3:** Suberogation is permitted (no one can demand you don't do it) but blameworthy. Claim 3 says obligation is fixed by what can be demanded. Claim 2 says blame attaches to the permitted. This is tricky. If I can't demand you don't do it, why are you blameworthy? Usually, blame tracks wrongness/duty. If it's permitted, blame is odd. But Claim 2 explicitly asserts this paradox. *Consistency: Moderate Tension.* (The "Blame without Wrongdoing" problem).
      *   **3 & 4:** Claim 3 is about *demands/justification to others* (Interpersonal/Contractualist). Claim 4 is about *reasons* being agent-neutral (Impartial/Consequentialist structure).
          *   *Tension:* If reasons are fully agent-neutral (Claim 4), why does reciprocity/justification to *specific others* (Claim 3) set the limit? Usually, agent-neutrality pushes toward maximizing (Utilitarianism). Claim 4 tries to dodge this by saying "permission not to maximize." But Claim 3 grounds the limit in *reciprocity*.
          *   *Deep Tension:* Agent-neutral reasons usually imply that if I don't maximize good, I'm failing the reasons. Claim 4 says "no, it's just a permission." Claim 3 says "the limit is what I can justify to you." These are different grounding mechanisms. One is teleological (value of outcomes), one is deontological/contractualist (relations between agents). *Consistency: Low/High Tension.*
      *   **4 & 5:** Claim 4 says reasons are agent-neutral. Claim 5 says missing supererogation makes you a "smaller person." If reasons are agent-neutral, moral worth usually tracks adherence to reasons. If I have permission not to maximize, am I morally diminished for not maximizing? Claim 5 says yes ("smaller person"). Claim 4 says the reasons don't weigh more. This creates a gap between *rationality/reasons* and *moral worth*. *Consistency: Moderate Tension.*
      *   **2 & 5:** Both deal with blame/praise asymmetry. Claim 2 says suberogatory is blameworthy. Claim 5 says missing supererogatory is not blameworthy. This is internally consistent regarding the asymmetry of blame. *Consistency: High.*

  4.  **Identify the "Crack" (The Worst Tension):**

      *   **The Big Clash:** Claim 3 (Reciprocal Demands) vs. Claim 4 (Agent-Neutral Reasons).
      *   **Why?** Claim 4 is essentially a Consequentialist account of *reasons* (suffering is suffering) paired with a Non-Maximizing account of *obligation*. Claim 3 is a Contractualist/Scanlonian account of *obligation* (what we can demand/justify).
      *   **The Problem:** If reasons are truly agent-neutral (Claim 4), the "permission not to maximize" looks like an arbitrary brute fact. But Claim 3 offers an *explanation* for the limit (reciprocity/justification).
      *   **The Contradiction:** If the limit of duty is set by *reciprocal justification* (Claim 3), then the reasons governing that limit are inherently *agent-relative* or *relational* (I owe *you* justification). But Claim 4 insists reasons are *agent-neutral*. You can't ground a reciprocity-based limit on duty using purely agent-neutral reasons without a lot of philosophical gymnastics.
