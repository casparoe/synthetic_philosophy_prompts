      *   **Constraints:** Staff are economists/social scientists (not historians), 2 hours/claim, no archive access, no re-estimation capacity. Bad calls = wasted money or damage.
      *   **Task:** Write a triage procedure (questions in order, sufficient answers, stop points for "No", "Cannot Know", and "Values/Politics").
      *   **Specific Requirements:**
          *   Critique current draft (Correlation, Mechanism, Actionability).
          *   Assess existing unit rule (Mechanism + Inputs must still exist).
          *   Run procedure on three specific cases (Land tenure, Culture/Trust, Cash transfer analogy). One must be "Cannot Know" (preferably the one the user is attached to).
          *   No reading list/citations.
          *   End with confidence assessment and the weakest step.
      *   **Tone:** Pragmatic, rigorous, usable by non-historians, explicit about judgment calls.

  2.  **Critique of Current Draft & Unit Rule:**

      *   *Current Draft (Correlation, Mechanism, Actionability):* Too permissive. Correlation (even causal via IV/RD) doesn't mean the effect is large enough to matter *now*. Mechanism stories are often just-so stories. Actionability ignores externalities or political economy constraints. It misses the "stability of the effect" over time.
      *   *Unit Rule (Mechanism + Inputs must exist):* Sound in principle (external validity), but risky. It might wrongly reject cases where the *absence* of the input is the problem (e.g., lack of trust) and the intervention creates the input. It might wrongly accept cases where the mechanism exists but is swamped by other factors today (equifinality).

  3.  **Developing the Triage Procedure:**

      *   *Goal:* Filter out spurious historical claims quickly without needing historical expertise.
      *   *Time Limit:* 2 hours.
      *   *Steps:* Need to move from data validity -> causal stability -> policy relevance -> ethical/political check.
      *   *Structure:*
          1.  **The Data & Design Check:** Is the "natural experiment" actually clean? (Economists can do this).
          2.  **The Persistence Check:** Did the effect survive the intervening time? (Crucial for history).
          3.  **The Mechanism Reality Check:** Is the mechanism actually operating *now*? (Refining the Unit Rule).
          4.  **The Intervention Match:** Does the proposed fix actually target the mechanism?
          5.  **The Politics/Values Handoff:** Where economics stops and judgment begins.

      *   *Refining the "Cannot Know" vs. "No":*
          *   "No" = Fatal flaw in design or logic.
          *   "Cannot Know" = Plausible but untestable with available data/time (e.g., archival verification needed).
          *   "Values/Politics" = We know it works, but should we do it? (Distributional effects).

  4.  **Drafting the Procedure Steps (Iterative refinement):**

      *   *Step 1: The Boundary Integrity.* (Can we trust the variation?) If the boundary moved or people sorted, stop.
      *   *Step 2: The Gap Size.* (Is the effect economically meaningful?) If tiny, stop.
      *   *Step 3: The Continuity of Treatment.* (Did the historical shock actually persist?) This is the historian's trap. Economists assume "once treated, always treated." History says institutions evolve. *This is a key "Cannot Know" point.*
      *   *Step 4: The Mechanism Audit.* (Unit Rule refinement). Not just "does input exist," but "is this the binding constraint?"
      *   *Step 5: The Intervention Logic.* (Does money fix this?)
      *   *Step 6: The Political Economy.* (Who loses?) -> Handoff.

  5.  **Critiquing the Unit Rule (Specific Task):**

      *   *Soundness:* Good for external validity.
      *   *Wrongly Rejects:* Interventions designed to *create* the missing input (e.g., building trust where it's low).
      *   *Wrongly Accepts:* Cases where the mechanism exists but is irrelevant compared to a new constraint (e.g., trust exists, but no electricity).

  6.  **Running the Three Cases:**

      *   *Case 1: Colonial Land Tenure (RD Design).*
          *   Design: Likely solid (RD).
          *   Persistence: Did the tenure system survive decolonization? Often yes, but sometimes reformed.
          *   Mechanism: Investment security.
          *   Verdict: *Cannot Know* (Requires knowing if post-colonial reforms altered the tenure on the ground, which needs archival/local legal knowledge not available in 2 hours). *Self-Correction: User wants the one they are attached to be "Cannot Know". I don't know which one they are attached to, but I should make the Land Tenure one the "Cannot Know" as it's the most seductive/common in development econ.*
      *   *Case 2: Culture/Trust (Survey).*
          *   Design: Correlation vs Causation is weak here. Trust is endogenous.
          *   Persistence: Culture changes slowly, but is it the *cause* of underinvestment or the result?
          *   Verdict: *No* (Endogeneity/Reverse Causality is too high risk for a 2-hour check without IV).
      *   *Case 3: Cash Transfer (Analogy).*
          *   Design: Analogy is not evidence.
          *   Verdict: *No* (Analogy fails the "Data & Design" check immediately). *Wait, I need to make sure I follow the instruction: "At least one of the three should come out 'cannot know,' and I would rather it were the one I am most attached to." Since I don't know which one they are attached to, I should structure the output so the Land Tenure case is the "Cannot Know" because it's the most methodologically sophisticated and thus the most dangerous to accept blindly. The Cash Transfer one is usually weak (analogy), and Culture is often endogenous. I will make Land Tenure the "Cannot Know".*

  7.  **Refining the "Cannot Know" Logic:**

      *   For Land Tenure: The regression works. The boundary is real. But did the *legal* reality match the *statistical* boundary after independence? We can't know in 2 hours without local legal archives. So, "Cannot Know" if the intervention relies on changing tenure.

  8.  **Final Review against Constraints:**

      *   Order of questions? Yes.
      *   Sufficient answers? Yes.
      *   Stop points (No, Cannot Know, Values)? Yes.
      *   Explicit judgment calls? Yes.
      *   Critique of current draft & unit rule? Yes.
