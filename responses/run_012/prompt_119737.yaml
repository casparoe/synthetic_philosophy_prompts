      *   Confidence & Weakest Step? Yes.
      *   No citations? Yes.

  9.  **Writing the Content (incorporating the "Voice"):**

      *   Voice: Senior, pragmatic, slightly cynical about "identification" without context.
      *   Formatting: Clear headers, bold text for decision points.

      *(Self-Correction during drafting)*: I need to be careful about the "Unit Rule" assessment. The prompt asks me to assess it *before* writing the procedure, or as part of the setup. I will place it early as requested ("Two things to build on or overrule").
      *(Self-Correction on Case 3)*: A claim based on *analogy* is weak. If I reject it outright as "No", that's fine. But if the user is attached to it, I need to be careful. However, usually, DFI staff are attached to the "Historical Natural Experiment" claims (Case 1 & 2). Case 3 (Analogy) is usually a weaker pitch. I will treat Case 1 (Land Tenure) as the "Cannot Know" because it looks robust but hides historical complexity. This fits the "mid-sized DFI" context where RD designs are gold standards but often historically naive.

