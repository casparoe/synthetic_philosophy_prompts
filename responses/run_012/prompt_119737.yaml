answer: |-
  ### Part 1: Assessment of Current Tools

  **1. Critique of Your Current Draft (Correlation, Mechanism, Actionability)**
  This triage is too permissive because it treats historical claims as static engineering problems.
  *   **Where it fails:** It assumes that if a correlation was causal *then*, it remains causal *now*. It ignores **equifinality** (different causes producing the same outcome today) and **decay** (institutions evolving after the shock).
  *   **The specific trap:** A claim can pass all three checks and still be wrong. Example: A 1920s railway boundary explains 1990s income differences (Correlation). The mechanism is market access (Plausible). We can build roads (Actionable). But if the railway was nationalized and degraded in 1970, or if a new highway bypassed the region in 2000, the 1920s boundary no longer dictates economic fate. Your current draft funds the road; the road gets built; income doesn't move.
  *   **Verdict:** It lacks a **Persistence Check**.

  **2. Assessment of Your Unit Rule (Mechanism + Inputs Must Still Exist)**
  *   **Soundness:** This is the strongest filter you have. It forces external validity. If the mechanism requires "low trust" to explain underinvestment, but your intervention assumes you can "build trust," you have a contradiction.
  *   **What it wrongly rejects:** Interventions designed to *supply* the missing input. If the claim is "Low trust causes underinvestment," and your rule says "Do not fund unless trust exists," you rule out trust-building programs. You must amend the rule to: "Show the mechanism is binding, and show the intervention alters the mechanism's inputs."
  *   **What it wrongly accepts:** Cases where the input exists but is no longer the *binding constraint*. High trust might exist, but if there is no electricity, firms still won't invest. The mechanism is present, but irrelevant.
  *   **Verdict:** Sound, but needs the "Binding Constraint" amendment.

  ***

  ### Part 2: The Triage Procedure (The "2-Hour Historical Reality Check")

  **Instructions:** Proceed sequentially. If a step returns a **STOP**, do not proceed. Record the reason. If a step returns **HANDOFF**, pass to the Country Director with a specific note.

  #### Step 1: The Design Integrity Check (Economist's Lane)
  *   **Question:** Is the variation in X truly exogenous, or could people have sorted themselves around it?
  *   **Sufficient Answer:** The claim provides a balance table showing pre-determined characteristics (ethnicity, terrain, pre-colonial population) are identical on both sides of the boundary/event.
  *   **STOP (No):** If pre-characteristics differ significantly. (This is selection bias, not a natural experiment).
  *   **Judgment Call:** If the balance table is missing, do not assume it exists. Mark as **Cannot Know** and move to Step 2 only if the design is a Regression Discontinuity (RD) with a very tight bandwidth. If it is a simple IV or OLS with historical controls, mark **No**.
  *   **Why:** Economists can spot bad identification. Historians know people always sort around boundaries eventually.

  #### Step 2: The Institutional Continuity Check (The Historian's Proxy)
  *   **Question:** Did the institution/treatment identified in the regression survive the intervening decades intact, or was it substantially altered by war, reform, or independence?
  *   **Sufficient Answer:** The authors cite a specific legal or administrative continuity (e.g., "The land code was not revised between 1950 and 2000") OR the outcome variable is measured shortly after the historical event (within 10 years).
  *   **STOP (Cannot Know):** If the outcome is measured today (2020s) and the event was pre-1960, and the authors offer no evidence of institutional stability.
  *   **STOP (No):** If there is a known major reform (e.g., land nationalization, universal suffrage, civil war) that occurred *between* the treatment and the outcome which logically would have overwritten the treatment.
  *   **Judgment Call:** You are not checking archives. You are checking the *plausibility of stasis*. If the claim relies on a 100-year-old boundary explaining today's GDP, the burden of proof is on them to explain why nothing else mattered for a century.
  *   **Why:** This is where 80% of historical econ claims fail. Institutions evolve.

  #### Step 3: The Mechanism Binding Check (Amended Unit Rule)
  *   **Question:** Is the proposed mechanism the *binding constraint* today, or merely a correlate?
  *   **Sufficient Answer:** Evidence that varying the mechanism today changes the outcome *in the same direction* as the historical episode. (e.g., If "land tenure security" is the mechanism, do areas with recently secured tenure show higher investment *now*?)
  *   **STOP (No):** If the mechanism is "culture" or "trust" measured by surveys, and the intervention is infrastructure or cash. (Mismatch of mechanism and tool).
  *   **STOP (Cannot Know):** If the mechanism is plausible but there is no contemporary data to verify it is still the bottleneck.
  *   **Why:** Prevents funding interventions that solve a problem that no longer exists (e.g., building courts to enforce land rights when the real constraint is lack of water).

  #### Step 4: The Intervention Match
  *   **Question:** Does the proposed programme directly manipulate the mechanism identified in Step 3?
  *   **Sufficient Answer:** A direct logical link. (Mechanism: Lack of credit. Intervention: Loan guarantee).
  *   **STOP (No):** If the link is indirect or relies on "spillovers" or "general equilibrium effects" without a model.
  *   **Why:** Prevents "magic bullet" thinking.

  #### Step 5: The Political Economy Handoff (Values Lane)
  *   **Question:** Does fixing this mechanism create winners and losers along existing political fault lines (ethnic, regional, class)?
  *   **Sufficient Answer:** A distributional analysis showing who loses status or income if the programme succeeds.
  *   **HANDOFF:** If the programme creates distinct losers. Pass to Country Director with the note: "Evidence supports efficacy, but success implies redistributive conflict."
  *   **Why:** This is not a question of history or econometrics. It is a question of risk appetite and mandate. The Evidence Desk cannot answer this.

  ***

  ### Part 3: Procedure Applied to Three Cases

  #### Case 1: Colonial Land Tenure & Regional Income Gap
  *   **Claim:** A 1897 administrative boundary created two land tenure systems. A Regression Discontinuity (RD) shows a 15% income gap today across this boundary. Proposal: Fund land titling on the "poor" side.
  *   **Step 1 (Design):** **Pass.** RD design with tight bandwidth, pre-characteristics balanced.
  *   **Step 2 (Continuity):** **Cannot Know.** The event was 1897. The outcome is 2024. Did the post-colonial government maintain the 1897 tenure laws strictly? Did informal customs override formal law? The paper does not provide legal history between 1960 and 2020. You cannot verify this in 2 hours without local legal archives.
  *   **Step 3 (Mechanism):** **Pass (Conditional).** Tenure security is a known driver of investment.
  *   **Step 4 (Match):** **Pass.** Titling addresses tenure.
  *   **Step 5 (Politics):** **Handoff.** Titling often disenfranchises customary users.
  *   **Final Verdict:** **Cannot Know.**
      *   *Reasoning:* The econometrics are beautiful, but the history is a black box. The income gap might be due to the tenure, or it might be due to a highway built in 1980 that happened to miss that region, correlated with the boundary. You cannot distinguish these without historical verification.
      *   *Note:* I have selected this as the "Cannot Know" verdict. This is likely the claim you are most attached to because it uses the "gold standard" of econometric identification (RD). It is the most dangerous because it looks scientifically robust while hiding historical fragility.

  #### Case 2: Culture (Trust) & Firm Underinvestment
  *   **Claim:** Survey data shows firms in Region Y have low interpersonal trust. Regression shows trust correlates with investment. Proposal: Fund community-building workshops to raise trust.
  *   **Step 1 (Design):** **No.** Survey responses on trust are endogenous. Low investment might cause low trust (failed business deals), not vice versa. There is no exogenous variation (no historical shock provided).
  *   **Final Verdict:** **No.**
      *   *Reasoning:* Fails the Design Integrity Check. Correlation is not causation, and "culture" is rarely exogenous in a cross-section.

  #### Case 3: Cash Transfer Long-Run Effects (Analogy)
  *   **Claim:** We should fund a new cash transfer. Evidence: A similar transfer in a different country 20 years ago had long-run human capital gains.
  *   **Step 1 (Design):** **No.** Analogy is not identification.
  *   **Final Verdict:** **No.**
      *   *Reasoning:* Fails the Design Integrity Check immediately. Contextual differences between countries and decades render the analogy evidentially void for causal claims.

  ***

  ### Part 4: Implementation Confidence

  **Confidence Level:** **Moderate-High.**
  This procedure will survive contact with your docket because it leverages your staff's existing skills (econometrics) while forcing them to acknowledge the one variable they usually ignore (time/continuity). It stops the most common error: treating a historical coefficient as a physical constant.

  **The Weakest Step:** **Step 2 (Institutional Continuity).**
  This step requires your economists to make a judgment about historical stability without historical training. I have tried to mitigate this by making the default "Cannot Know" if the gap is large (>50 years) and unexplained, but there is a risk that staff will learn to "game" this step by accepting weak explanations of continuity just to clear the claim. You will need to audit the "Cannot Know" decisions periodically to ensure they aren't being used as a lazy rejection tool, or conversely, that "Pass" decisions aren't being granted on flimsy assertions of stability.

  **Final Note on the "Cannot Know" Case:**
  I designated the Land Tenure case (Case 1) as the **Cannot Know**. In development finance, these are the most seductive claims. They offer the comfort of rigorous math applied to the complexity of history. Rejecting them feels like rejecting science. Accepting them feels like progress. The procedure forces you to admit that the math is right, but the history is missing. That is the most valuable output your desk can produce: distinguishing "false" from "unknowable."
