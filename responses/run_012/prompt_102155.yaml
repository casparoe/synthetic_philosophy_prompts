answer: |-
  You have put your finger on one of the most sophisticated and persistent critiques in modern political philosophy. You are describing the tension between **John Rawls** (who invented the Veil of Ignorance) and **John Harsanyi** (who formalized it using probability).

  There is no single, common English word for this specific rhetorical move (like "gaslighting" or "strawman"), but in moral philosophy and social choice theory, it is technically identified as **relying on the Principle of Insufficient Reason (or Indifference) to smuggle normative weights.**

  However, since you asked for a name to use in conversation that captures the *rhetorical sleight of hand* rather than just the math, I propose we call it **"Probabilistic Smuggling"** (or, more punchily, **"The Distributional Dodge"**).

  Here is the breakdown of what this is, the existing philosophical terminology, and how to distinguish the harmless heuristic from the loaded argument.

  ### 1. The Technical Name: The Equiprobability Assumption
  In the literature, the move you are describing is the **Equiprobability Assumption**.
  *   **The Setup:** The Veil of Ignorance (you don't know who you are).
  *   **The Smuggle:** The arguer assumes that because you *don't know* who you are, you must assume there is an *equal chance* of being anyone (the CEO or the janitor).
  *   **The Result:** If you assume equal odds, you naturally choose the policy that maximizes the *average* welfare (Utilitarianism). If you assume you are likely to be in the large "middle/poor" bucket, you choose policies that protect the floor (Prioritarianism/Maximin).

  The critique is that **ignorance does not imply equal probability.** Just because I don't know the outcome of a coin toss doesn't mean the coin is fair. By asserting the odds are equal without arguing for them, the speaker has secretly decided that every person's utility counts exactly the same (a utilitarian view) while claiming they are just being "neutral."

  ### 2. The Coined Term: "Probabilistic Smuggling"
  For your debates, **"Probabilistic Smuggling"** is the precise term for the rhetorical move.

  *   **Definition:** The act of embedding a controversial moral weighting (e.g., "the rich count the same as the poor" or "the poor matter more") into the *probability distribution* of a thought experiment, rather than arguing for that weighting directly.
  *   **Why it works:** Probabilities look like math/facts. Moral weights look like opinions. By turning the moral weight into a probability ("there's a 1% chance you're the billionaire"), the arguer makes their moral premise look like a neutral statistical constraint.
  *   **Why it's a "Dodge":** It dodges the actual question ("Should we tax the rich more?") by replacing it with a gambling question ("Would you take this bet?").

  ### 3. The Philosophical Context: Harsanyi vs. Rawls
  To arm yourself, you should know that this is the exact fault line between two giants of 20th-century philosophy:

  *   **John Harsanyi (The Smuggler):** Argued that behind the Veil of Ignorance, a rational person *must* use the Principle of Insufficient Reason (assume equal odds). He proved that if you do this, you mathematically arrive at **Utilitarianism** (maximize the total sum).
  *   **John Rawls (The Objector):** Explicitly rejected the use of probabilities. He argued that the Veil is not a gambling scenario. He said we should not ask "What odds would I take?" but "What principles could we all agree to?" He argued for **Maximin** (make the worst-off as well off as possible), specifically *rejecting* the idea that you can calculate moral worth using probability.

  If your friend is using the Veil to argue for "fairness" but relying on odds to get their answer, they are accidentally making a **Harsanyi** argument while claiming a **Rawlsian** authority.

  ### 4. Heuristic vs. Argument: Where is the Line?
  You asked how to distinguish this from the Veil just being a harmless heuristic. Here is the test:

  **The Veil as a Heuristic (Safe):**
  *   **Function:** An empathy engine.
  *   **Usage:** "Imagine you might be the person getting evicted. Does this policy still feel okay?"
  *   **Goal:** To check for bias or blind spots.
  *   **Status:** The odds are vague and illustrative. The moral work is done by your *conscience*, not the *calculation*.

  **The Veil as an Argument (Probabilistic Smuggling):**
  *   **Function:** A decision procedure.
  *   **Usage:** "Since there is a 90% chance you'd be a worker, you *rationally must* vote for higher taxes."
  *   **Goal:** To derive a moral obligation from a risk calculation.
  *   **Status:** The odds are specific and determinative. The moral work is done by the *probabilities*.

  **The Line:** The line is crossed when the **probability distribution becomes the premise.**
  *   *Heuristic:* "Use the veil to see if you care about others."
  *   *Smuggling:* "Use the veil to calculate what you *must* want based on these odds."

  ### 5. How to Counter It in Debate
  When a friend pulls this move, you can say:

  > "You're using **Probabilistic Smuggling**. You're presenting this as a neutral fairness test, but the conclusion depends entirely on the odds you've silently assigned to being rich or poor.
  >
  > If you assume equal odds, you get Utilitarianism. If you assume I'm likely to be average, you get redistribution. You haven't proven fairness; you've just hidden your moral weights inside the probability setup. Why should we accept *your* odds as the definition of fairness?"

  ### Summary
  *   **Technical Term:** The Equiprobability Assumption / Principle of Insufficient Reason.
  *   **Rhetorical Term:** Probabilistic Smuggling (or The Distributional Dodge).
  *   **The Error:** Treating a moral weighting (how much people matter) as a statistical frequency (how many people there are).
  *   **The Fix:** Force them to argue for the moral weight directly ("Why does the poor person's dollar matter more?") rather than hiding it behind the veil ("Because you're more likely to be poor").

  You are correct: the odds are doing all the moral work, and they are the one thing never put on trial. Naming this move exposes the hidden premise.
