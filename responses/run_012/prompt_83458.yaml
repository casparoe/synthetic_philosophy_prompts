answer: |-
  Here is the conceptual menu you asked for. The phrase "information is physical" is a slogan, not a premise. It functions rhetorically to slide between distinct claims without defending the transitions. Below are the four distinct propositions usually hiding behind it, ranked by strength.

  ### The Menu of Claims

  **1. The Substrate Claim**
  *   **Proposition:** Information states cannot exist without a physical medium (e.g., a memory register requires atoms, spin, or charge).
  *   **Verdict:** **Trivially True.**
  *   **Exorcism Power:** **None.**
  *   **Analysis:** No one disputes that the demon's memory must be instantiated physically. The paradox arises not because the demon is disembodied, but because standard thermodynamics suggests the *manipulation* of that physical memory (measurement and reset) could be done reversibly. Merely noting the demon has a body does not prove that body must dissipate heat during logical operations.

  **2. The Landauer Claim**
  *   **Proposition:** Logical irreversibility (specifically erasure) *necessitates* thermodynamic irreversibility (heat dissipation of at least $k_B T \ln 2$ per bit).
  *   **Verdict:** **Contentious but Defensible.**
  *   **Exorcism Power:** **High (if true).**
  *   **Analysis:** This is the actual engine of the standard exorcism (Landauer-Bennett). However, this is a dynamical claim about Hamiltonian mechanics and thermalization, not a conceptual truth about "information." It is contested (e.g., by Norton, Earman, and Hemmo & Shenker) on the grounds that it presupposes the Second Law to prove the Second Law. The slogan "information is physical" is often used to smuggle this premise in without arguing for the specific dynamical constraints required.

  **3. The Identity Claim**
  *   **Proposition:** Thermodynamic entropy and Shannon information entropy are literally the same quantity; the distinction between epistemic uncertainty and objective microstate volume is illusory.
  *   **Verdict:** **Outright False (or Category Mistake).**
  *   **Exorcism Power:** **Dissolves the Problem (by changing the subject).**
  *   **Analysis:** This is the Jaynesian informationalist stance. If entropy is *just* missing information, the demon cannot violate the Second Law because the demon's knowledge is part of the system's entropy budget by definition. However, this requires abandoning the objective status of thermodynamic entropy in favor of an agent-relative measure. It doesn't exorcise the demon; it redefines "entropy" so the demon isn't a threat.

  **4. The Ontological Claim**
  *   **Proposition:** Physical reality is fundamentally constituted by information processing; matter/energy are derivative of informational states ("It from Bit").
  *   **Verdict:** **Unfalsifiable Hand-waving.**
  *   **Exorcism Power:** **Irrelevant.**
  *   **Analogy:** This is digital physics or Wheeler-esque metaphysics. It makes no specific difference to the accounting of heat flows in a Szilard engine unless coupled with Claim 2. It is a metaphysical stance, not a thermodynamic argument.

  ***

  ### Diagnostic of Your Reading Group

  Here is what your colleagues were actually asserting when they nodded at the same slogan:

  1.  **The Postdoc ("Settled the matter"):** They were invoking **Claim 2 (Landauer)** but asserting it with the rhetorical force of **Claim 1 (Substrate)**. They treated a contentious dynamical premise as a trivial ontological fact to shut down the debate. This is question-begging.
  2.  **The Reductionist ("Thermo is really info"):** They were asserting **Claim 3 (Identity)**. They are arguing for an epistemic interpretation of thermodynamics. This is a coherent position, but it is not the standard exorcism; it is a dissolution of the objective/subjective boundary.
  3.  **The Equivocator ("Shannon = Thermo"):** Also **Claim 3 (Identity)**, but likely without realizing the philosophical cost. They are treating an analogy (the mathematical isomorphism between the formulas) as an ontological identity.
  4.  **The Metaphysician ("No abstract computation"):** They were asserting **Claim 4 (Ontological)**. This is a claim about the philosophy of mind and computation, largely orthogonal to whether the Second Law holds in a Szilard engine.

  ***

  ### The Verdict on the Exorcism

  Your suspicion is correct. The slogan "information is physical" does no work.
  *   If it means Claim 1, it is true but irrelevant to the Second Law.
  *   If it means Claim 2, it is the conclusion of an argument (Landauer's Principle), not a premise, and that argument is the actual site of controversy.
  *   If it means Claim 3 or 4, it changes the subject away from standard thermodynamics.

  The demon is only "dead" if Claim 2 holds without circularity. The slogan is used to obscure the fact that Claim 2 requires a specific, defended model of the demon-memory coupling to thermal reservoirs.

  ***

  ### Draft Footnote Text

  Since you asked for a compressed version to drop into a footnote, here is a blunt formulation you can adapt:

  > *The slogan "information is physical" is frequently invoked to settle the Maxwell's Demon debate, but it obscures more than it clarifies. Read trivially (information requires a physical substrate), the claim is true but thermodynamically inert; the existence of a memory register does not entail a heat cost for its manipulation. Read strongly (logical irreversibility necessitates thermodynamic irreversibility), the claim is equivalent to Landauer's Principle, which is the contested premise of the exorcism, not its justification. Read reductionistically (thermodynamic entropy just is Shannon entropy), the claim dissolves the paradox by redefining entropy rather than saving the Second Law. In none of these readings does the slogan itself carry the argumentative weight required to exorcise the demon; it functions primarily to elide the distinction between the trivial necessity of embodiment and the contentious dynamics of erasure.*
