prompt: |-
  I'm a second-year PhD student in philosphy of physics, and I sit in on a statistical mechanics reading group that's spent most of this term grinding through the Maxwell's demon literature — Szilard engines, the measurement step, the erasure business, all of it. Last week we got onto wether the demon is really exorcised by information-theoretic bookkeeping at all, or whether the second law was never in danger once you account for the demon's own thermodynamics, and one of the postdocs cut the argument short with 'information is physical', said it as though that settled the matter, and everyone nodded. Then someone else used the same four words two minutes later to argue the opposite — that thermodynamics is really about information all along, so the demon was never a physics problem, just a bookkeeping one. A third person took it to mean that Shannon entropy and thermodynamic entropy are literally the same quantity, which I'm fairly sure is contested at best, and a fourth said it meant there's no such thing as an abstract computation at all, which felt like a completely different claim wearing the same coat.

  I don't need a reading list — I've got the papers, and I'm only after the conceptual work. What I want is a menu: what distinct precise claims could that sentence be making, ordered from the trivial platitudes up to the genuinely radical, with a verdict on each — trivially true, contentious but defensible, outright false, or unfalsifiable hand-waving — and then a note on which of those readings was actually doing the work in each of the four uses I've described. I'm especially interested in whether any reading of it can carry the weight of 'and therefore the demon is dead', because my suspicion is that the trivial readings do no work and the interesting readings are ones nobody in the room actually believes. I'd like to drop a compressed version of this into a footnote where I'm arguing about whether the exorcism needs a measurement step at all, so please be blunt about which readings are empty. Write it in American English.
