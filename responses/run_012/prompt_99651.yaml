      *   **Topic:** Augustine's definition of lying (from *De Mendacio* and *Contra Mendacium*).
      *   **Core Concept:** A lie is not a false statement, but a "divided heart" (one thing in the mind, another on the tongue).
          *   Case 1: Speaking truth while believing it false + intent to deceive = Lying.
          *   Case 2: Speaking falsehood while believing it true = Not lying (error, not lie).
      *   **Specific Scenario:** A man points pursuers down the road the fugitive *actually* took. He believes the fugitive went the other way. He *intends* to deceive the pursuers (save the fugitive). He speaks the truth objectively, but lies subjectively (in his heart).
      *   **Form:** Pantoum (five quatrains).
      *   **Mechanism:** The repeating lines of the pantoum must shift meaning contextually (sometimes sounding like truth, sometimes like the intended lie).
      *   **Ending:** Augustine's refusal to excuse the "kind lie" (officium mendacium), but not preachy. It needs to land as a "wound."
      *   **Audience:** Seminar readers (some know Augustine, some don't). Needs to work poetically for both.

  2.  **Understand the Pantoum Form:**
