      *   **Core Doctrine (as stated):** Nothing causes anything; God directly brings about each event. Regularity (fire burns cotton) is habit/custom, not necessity.
      *   **Task 1 (Translation):** Map this theological position onto game development architecture (game loops, ECS, ticks, save states, determinism, etc.). Be precise about exact matches vs. fudges.
      *   **Task 2 (Residue Report):** Identify what's missing from the analogy (what theology has that code doesn't) and what's added by the analogy (what code implies that theology denies). Assess the quality of the mapping (is it *too* clean?).
      *   **Tone:** Honest, analytical, respectful of the theology, grounded in dev terminology.

  2.  **Deconstruct the Theology (as provided):**
