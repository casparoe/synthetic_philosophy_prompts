  7.  **Final Polish:** Structure into "The Translation" and "The Residue Report." Use bolding for key terms. Ensure the "Fudge" warnings are visible. (Self-Correction: Make sure to explicitly address the "Human Agency" part the user mentioned, even if it's hard to map).

