      *   *Direct Divine Action:* God creates the state of the world at $t_1$, then $t_2$, etc.
      *   *Habit/Custom:* The sequence looks causal, but it's just a consistent pattern chosen by the Agent.
      *   *Contingency:* It could be otherwise (fire could cool cotton).
      *   *Continuous Creation:* Existence isn't a one-off; it's sustained moment-to-moment.
      *   *Human Agency:* (User mentioned this) Humans act, but without independent power (acquisition/kasb).

  3.  **Deconstruct the Game Architecture:**
      *   *Game Loop:* `while(running) { Update(); Draw(); }`
      *   *Delta Time/Ticks:* Discrete steps of time.
      *   *ECS (Entity-Component-System):* Data (Components) is passive. Logic (Systems) acts on data. Entities are just IDs.
      *   *State:* The sum of all component data at frame $N$.
      *   *Determinism:* Same input + same state = same next state.
      *   *Source Code:* The rules governing the transition.

  4.  **Drafting the Translation (Task 1):**
      *   *God* $\rightarrow$ *The Engine / CPU*.
      *   *World/Universe* $\rightarrow$ *Game State (Memory)*.
      *   *Time* $\rightarrow$ *Frame Count / Tick*.
      *   *Causality (Fire burns Cotton)* $\rightarrow$ *System Logic (CollisionSystem checks FireTag and CottonTag, sets BurnStatus)*.
      *   *No Intrinsic Power* $\rightarrow$ *Components are just data structs*. A "FireComponent" doesn't *do* anything. It's just a boolean or float. The `HeatSystem` reads that data and applies damage.
      *   *Habit/Custom* $\rightarrow$ *The Code Logic*. The code *could* have been written `if (fire && cotton) { coolDown(); }`. The fact that it burns is a design choice, not a property of the data.
      *   *Continuous Creation* $\rightarrow$ *Redrawing/Recomputing every frame*. If the loop stops, the world freezes. It doesn't "keep burning" on its own; the engine re-applies the burn damage every tick.
      *   *Human Agency* $\rightarrow$ *Input Buffering*. The player presses a button (will), the engine validates and applies the movement (action).

      *Refining the ECS mapping:* This is the strongest link. In strict ECS, data never touches data. System A doesn't call System B directly (usually). A central scheduler runs them. This mirrors the "Single Agent" aspect.
      *Refining the "Habit":* In code, rules are rigid. In theology, they are habitual but breakable (miracles). I need to flag this as a fudge.

  5.  **Drafting the Residue Report (Task 2):**
      *   *What Theology has that Code lacks:*
          *   *Miracles/Disruption:* Code is deterministic (usually). If the code says fire burns, it *always* burns unless there's an `if` statement for miracles. But in Occasionalism, the *nature* of the connection is contingent, not just conditional. God could change the rule mid-stream without a "miracle flag" in the code.
          *   *Ontological Dependence:* In code, memory persists until overwritten. In Occasionalism, things cease to exist if God stops thinking them. Code doesn't delete variables just because the CPU paused.
          *   *Meaning/Intent:* God's habit is wisdom/will. Code's logic is syntax.
          *   *Human Responsibility:* This is the hardest part. In code, if the engine moves the player, the player is a puppet. In Occasionalism, the human "acquires" the act. How to map "Acquisition" (`kasb`)? Maybe Input vs. Execution?
      *   *What Code has that Theology denies:*
          *   *Causal Chain in State:* `state[t+1]` is mathematically derived from `state[t]`. This implies a necessary logical connection between frames. Occasionalism denies necessary connection between moments. God creates $t_1$ and $t_2$ fresh. The fact that $t_2$ looks like a result of $t_1$ is the "habit." In code, $t_2$ *must* follow the math of $t_1$.
          *   *The Source Code:* We can read the necessity. We know *why* fire burns cotton (we see the `if` statement). Occasionalists say we *cannot* know the necessity, only observe the sequence.
      *   *Is the mapping too clean?* Yes, it risks reducing God to a deterministic machine. The "Habit" part is the weak link.

  6.  **Review and Refine:**
