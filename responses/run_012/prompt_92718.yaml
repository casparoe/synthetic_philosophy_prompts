      *   *Reasoning Point 1 (Choice Type):* The novel distinguishes sharply between moral dilemmas and sadistic coercion. Philosophical hard choices (Williams/Raz) presuppose agency; Sophie's scenario is designed to annihilate agency. The novel treats the coerced option as infinitely worse because it infects the survivor with the perpetrator's logic.
