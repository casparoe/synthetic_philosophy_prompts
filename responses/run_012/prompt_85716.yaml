answer: |-
  ### The Specification: Desiderata for a Theory of Omission Causation

  To serve the dual purpose of adjudicating practical attributions (law, medicine, AI safety) and clarifying the metaphysical boundary between causation and morality, a theory of omission causation must satisfy the following ten criteria. Each is marked as a **Genuine Requirement** (necessary for the theory to function for your stated purposes) or **Camp Prejudice** (a metaphysical commitment that may need to be sacrificed to satisfy other requirements).

  **1. Ontological Commitment (The Reality Constraint)**
  *   **Consideration:** The theory must affirm that at least some omissions function as causal relata, not merely as background conditions or logical negations. If the theory reduces omissions to "nothing," it cannot explain why the nurse is causally implicated in the death while the distant stranger is not.
  *   **Status:** **Genuine Requirement.** Without this, the theory dissolves the phenomenon it is meant to explain.

  **2. Selectivity (The Profligacy Constraint)**
  *   **Consideration:** The theory must provide a principled filter that distinguishes the specific omission that caused the outcome from the infinite set of counterfactual preventers. Everyone who did not fly to the famine zone is a counterfactual preventer; only specific agents are causes.
  *   **Status:** **Genuine Requirement.** A theory that makes everyone a cause of everything is useless for adjudication in law or AI safety.

  **3. Agent-Neutrality (The Machine Constraint)**
  *   **Consideration:** The criteria for omission causation must apply to non-human systems (AI, automated engineering) without relying on human-specific concepts like "intent," "duty," or "consciousness." An autonomous vehicle failing to brake must be analyzable via the same causal logic as a human driver failing to brake.
  *   **Status:** **Genuine Requirement.** Essential for your requirement regarding machines and systems.

  **4. Absence Generality**
  *   **Consideration:** The theory must handle non-agential absences (missing guardrails, lack of rain) using the same structural logic as human inaction. If "lack of rain" causes crop failure, the mechanism must be compatible with "lack of insulin" causing death.
  *   **Status:** **Genuine Requirement.** Ensures the theory is about *causation*, not just *moral responsibility*.

  **5. Temporal Resolution**
  *   **Consideration:** The theory must specify *when* the omission occurs. Is the cause the moment action was possible, the entire duration of inaction, or the moment of outcome? This matters for statutes of limitation and AI logging.
  *   **Status:** **Genuine Requirement.** Necessary for practical adjudication.

  **6. Act/Omission Asymmetry Handling**
  *   **Consideration:** The theory must either validate the intuition that killing is causally distinct from letting die, or explicitly argue that the distinction is non-causal (moral/legal only). It cannot simply ignore the intuition.
  *   **Status:** **Camp Prejudice.** Insisting there *is* a causal asymmetry is a prejudice of moralists; insisting there *is not* is a prejudice of physicalists. The theory must take a stance, but neither stance is a pre-theoretic requirement.

  **7. Hard Case Discrimination**
  *   **Consideration:** The theory must resolve redundant omissions (two lifeguards sleep), preempted omissions (I didn't save him because you already killed him), and termination vs. initiation (switching off respirator vs. never switching on).
  *   **Status:** **Genuine Requirement.** A theory that works only for simple cases fails in law and medicine.

  **8. Causal Unity**
  *   **Consideration:** The theory must state whether "omission causation" is the same relation as "positive causation" or a distinct relation masquerading under the same name.
  *   **Status:** **Camp Prejudice.** Monists demand unity; pluralists accept distinct relations. This is a theoretical choice, not a functional requirement.

  **9. Normative Independence**
  *   **Consideration:** The theory must state whether causal status depends on norms (duties, expectations, design specifications) or purely on counterfactual/physical facts. If a bystander has no duty to act, is their inaction still a *cause*?
  *   **Status:** **Camp Prejudice.** Metaphysical realists demand independence; pragmatists accept dependence. This is the pivot point of the debate.

  **10. Explanatory Power**
  *   **Consideration:** The theory must explain why citing an omission provides understanding. If omissions are "nothing," how do they explain "something"?
  *   **Status:** **Genuine Requirement.** Causation is tied to explanation; a theory that breaks explanation fails.

  ***

  ### The Impossibility Tension

  There is a triad of constraints that cannot be jointly satisfied. You must sacrifice one.

  1.  **Robust Realism:** Omissions are genuine causes in the same sense as positive events (Item 1 & 8).
  2.  **Selectivity:** Not every failure to prevent is a cause (Item 2).
  3.  **Normative Independence:** Causal facts do not depend on duties, norms, or conventions (Item 9).

  **The Conflict:**
  If you hold **Robust Realism** and **Normative Independence**, you rely on pure counterfactuals or physical processes. But counterfactuals are ubiquitous (everyone could have prevented the famine). This violates **Selectivity**. You become a profligate causation theorist.
  If you hold **Selectivity** and **Normative Independence**, you must find a physical or counterfactual feature that distinguishes the nurse from the bystander without using "duty." No such feature exists physically. The nurse's biology is no different from the bystander's relative to the patient. This forces you to deny **Robust Realism** (saying omissions aren't *really* causes, just explanatory tools).
  If you hold **Robust Realism** and **Selectivity**, you must use norms (duties, design specs) to filter the causes. This violates **Normative Independence**. Causation becomes partly normative.

  **The Sacrifice:**
  For your stated purpose (adjudicating law, medicine, and AI), you must sacrifice **Normative Independence (Item 9)**.
  *Why:* Law and medicine are inherently normative domains. An AI's "failure" is defined by its design specifications (norms). A nurse's "omission" is defined by professional duty. A theory that insists causation is purely physical cannot distinguish the negligent engineer from the ignorant tourist. To make the theory useful for attribution, you must accept that causal selection is sensitive to norms and expectations. The "rationalist commonplace" (that you are not responsible for everything you fail to prevent) is therefore not a separate moral doctrine; it is built into the causal selection mechanism itself.

  ***

  ### The Killer Requirement

  **Item 2: Selectivity (The Profligacy Constraint).**

  This is the requirement that eliminates the most candidate theories. Pure counterfactual theories (Lewis-style) fail this immediately without adding pragmatic patches. Pure physical process theories fail this because there is no physical process of "not doing." Only theories that introduce a filtering mechanism (norms, defaults, or contrastive focus) survive.

  ***

  ### Theory Scorecard

  | Theory Type | Ontological Commitment (1) | Selectivity (2) | Agent-Neutrality (3) | Normative Independence (9) | Hard Cases (7) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Pure Counterfactual** (e.g., Lewis) | **Pass.** Omissions are counterfactual dependencies. | **Fail.** Profligate. Everything that could have prevented is a cause. | **Pass.** Logic applies to all systems. | **Pass.** Purely factual. | **Mixed.** Struggles with preemption without complex nesting. | **Rejected.** Fails the primary utility constraint (Selectivity). |
  | **Interventionist / Graph-Based** (e.g., Woodward) | **Pass.** Variables can take 'null' or 'default' values. | **Pass.** Structure of the model limits relevant variables. | **Pass.** Ideal for machines/systems. | **Fail.** Requires "default values" which are often normative/contextual. | **Pass.** Handles redundancy well via structure. | **Strong Contender.** Best for AI/Medicine, admits norm-dependence in "defaults." |
  | **Normative / Convention-Based** (e.g., Hart & Honoré) | **Mixed.** Often treats omissions as quasi-causal. | **Pass.** Duty filters the causes perfectly. | **Fail.** Relies on human social/legal duties. Hard to map to AI. | **Fail.** Explicitly norm-dependent. | **Pass.** Designed for law/hard cases. | **Strong Contender.** Best for Law, requires adaptation for AI (design specs as duties). |
  | **Pluralist / Dual-Relation** (e.g., Hall) | **Pass.** Distinguishes production vs. dependence. | **Pass.** Omissions are dependence, not production. | **Pass.** Can apply both relations to systems. | **Pass.** Keeps metaphysics clean, pushes norms to attribution. | **Pass.** Different relations handle different cases. | **Safe but Costly.** Solves tensions by splitting the concept, but complicates adjudication (which relation applies here?). |
  | **Physicalist / Process** | **Fail.** Denies omissions are causes (no energy transfer). | **Pass.** Only positive processes count. | **Pass.** Physics is universal. | **Pass.** Purely physical. | **Fail.** Cannot distinguish switching off from never on. | **Rejected.** Fails the Reality Constraint for your purposes. |

  **Recommendation:** The **Interventionist / Graph-Based** account offers the highest utility for your specific constraints (Medicine, Law, AI). It handles Selectivity by restricting the causal model to relevant variables (solving profligacy) and handles Agent-Neutrality by treating "expected function" as a variable setting rather than a moral duty. However, you must accept that setting the "default value" of a variable is a normative or contextual act, sacrificing Normative Independence.
