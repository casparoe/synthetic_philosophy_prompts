  *   **Rule A (Bodily Act):** This rule defines killing as death resulting from a *positive bodily act*. However, your friend classifies disconnecting a ventilator as *letting die*. Disconnecting a ventilator involves a positive bodily act (pulling a plug or turning a dial). Since she counts this as allowing death despite the physical action, Rule A cannot be the principle she is running.
  *   **Rule B (Causal Process):** This rule defines killing as death from a causal process the agent initiated or sustained. This fits all her verdicts: injection and shoving start new lethal chains (killing); ventilator disconnection and antibiotic refusal allow underlying pathology to proceed (letting die); the bystander allows nature to take its course (letting die).
  *   **Rule C (Intention):** This rule defines killing by whether death was aimed at. This also fits her verdicts, assuming standard medical ethics interpretations: the lethal injection and the shove aim at death (killing); the ventilator and antibiotic cases aim at respecting autonomy or relieving burden, with death merely foreseen (letting die); the bystander is indifferent, not aiming at death (letting die).

  **Predictions for the Insulin Pump Case**
