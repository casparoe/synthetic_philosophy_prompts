prompt: |-
  i'm a software engineer with no formal philosophy background, and i've been asked to write prompts about the unilateralist's curse for a dataset. i sort of get the gist — a bunch of agents can each unilaterally do a thing, so whichever one actually does it is probably the one who most overestimated how good the thing was — but every explanation i find ends with: so you need a single decider, and i want an example that pulls those two claims apart.

  so give me an example of a conceptual issue here. set up a small decision problem with three or four agents who can each unilaterally take an action, each holding a noisy private estimate of the action's value, all using the same threshold for acting. work the numbers so the curse shows up — the action gets taken, and taking it is on average a bad move. then, using that same setup, flip one thing at a time and tell me which flips make the curse disappear and which don't: (a) everyone's estimate is unbiased but noisy, (b) everyone's estimate is systematically too optimistic, (c) the agents' errors are correlated rather than independent, (d) only one agent exists at all, (e) the agents can cheaply talk and share estimates before anyone acts. i definately want the case that surprises me — the one where you'd expect the curse to vanish and it doesn't, or the reverse.

  then tell me what the example shows the curse is actually about: is it a fact about unilateral action, a fact about thresholds and selection, or just the winner's curse with extra steps? because if it's really selection-on-error, then get a single decider looks like it fixes the wrong thing — the single decider also has a noisy estimate, they just have it alone. say plainly where i'm wrong about that, if i am.

  skip citations and reading lists, i can't look anything up anyway — just the worked example and the reasoning.
