answer: |-
  **Exam Question: Metaphysics of Supertasks (25 Marks)**

  **Time Allowed:** 60 Minutes
  **Instructions:** Answer the question below. You may assume the following mathematical facts: (1) $\sum 1/2^n = 1$; (2) The harmonic series $\sum 1/n$ diverges, though $1/n \to 0$; (3) The partial sums of the harmonic series modulo 1 are dense in the interval $[0, 1)$; (4) The density of perfect squares among integers approaches 0 as $n \to \infty$; (5) Convergence depends on the topology of the state space.

  **The Scenario:**
  Consider three supertasks completed at $t=1$. For each, an operation occurs at stage $n$ at time $t_n = 1 - 2^{-n}$ (for $n=1, 2, 3, \dots$).
  *   **Lamp A (Square):** State is ON or OFF. At stage $n$, set ON if $n$ is a perfect square, OFF otherwise.
  *   **Lamp B (Dial):** State is an angle $\theta \in [0, 1)$. At stage $n$, rotate forward by $1/n$ of a turn (position is sum of rotations mod 1).
  *   **Lamp C (Coin):** State is ON or OFF. At stage $n$, flip a fair coin; set ON if Heads, OFF if Tails.

  **The Question:**
  For each of the three cases, does the specification determine the state (or position) at $t=1$? If yes, what is it? If no, is this because the setup is silent about $t=1$, or because the sequence of prior states fails to converge? Compare these cases to the original Thomson's Lamp (toggle ON/OFF at every stage). Is Thomson's Lamp different in kind, or merely the most familiar instance of a general problem? Finally, argue whether "the state at $t=1$" is a well-defined question. If it is not, what premise (e.g., a Continuity Principle) must be added to make it so, and what is the metaphysical cost of adding it?

  ***

  **Model Answer**

  None of the three specifications determines the state at $t=1$. In each case, the failure arises from a combination of descriptive silence and mathematical non-convergence within the relevant topology.

  First, we must distinguish the description of the process from the state at the limit. The instructions specify states only for $t < 1$. Strictly speaking, the setup is silent regarding $t=1$. This is Benacerraf's point: no logical contradiction arises from assigning *any* state at $t=1$, because the causal description ends before $t=1$. However, we typically ask these questions assuming a **Continuity Principle**: the state at the limit time must be the topological limit of the sequence of prior states. If we accept this principle, we must analyze the convergence of the sequences.

  For **Lamp A**, the state space is discrete $\{ON, OFF\}$. The sequence of states is $OFF, ON, OFF, OFF, ON \dots$ (since squares become sparse). While the *density* of ON states approaches 0, the sequence itself oscillates infinitely. In the discrete topology, a sequence converges only if it becomes constant after some finite $n$. Lamp A does not. Thus, the limit does not exist.

  For **Lamp B**, the state space is the circle $S^1$. The position is determined by partial sums of the harmonic series modulo 1. Since these sums are dense in $[0, 1)$, the dial visits every neighborhood of every point infinitely often. There is no single accumulation point, let alone a limit. The sequence diverges everywhere.

  For **Lamp C**, the state space is again discrete. The sequence is random. While probability theory might suggest a 50% distribution over infinite trials, a specific realization of coin flips will oscillate infinitely between ON and OFF with probability 1. It does not settle. No limit exists.

  Comparing these to **Thomson's Lamp** (alternating ON/OFF), we see they are not different in kind. Thomson's Lamp also fails to converge in the discrete topology. It is merely the simplest periodic instance of non-convergence. Lamp A is aperiodic non-convergence; Lamp B is dense non-convergence; Lamp C is stochastic non-convergence. All share the same structural defect: the history $t < 1$ does not mathematically necessitate a unique state at $t=1$ via the Continuity Principle.

  Is "the state at $t=1$" well-defined? Without extra premises, no. The physical description defines a function $f(t)$ only on $[0, 1)$. Asking for $f(1)$ is a category error unless we extend the domain. To make it well-defined, we must add the Continuity Principle as a law of nature or metaphysical necessity.

  The cost of this premise is high. First, it renders many supertasks physically impossible, not just logically indeterminate. If a lamp cannot be ON or OFF at $t=1$ because neither is the limit, the supertask cannot be completed. Second, it implies action at a temporal distance: the state at $t=1$ is determined by the infinite past sequence, not by a local cause at $t=1$. Third, it relies on topology. If we chose the indiscrete topology, every sequence converges to every state, making the principle trivial and uninformative. If we choose a non-Hausdorff topology, we might force convergence to ON *or* OFF arbitrarily. Therefore, the Continuity Principle is not a neutral logical truth but a substantive metaphysical commitment that rules out indeterminate outcomes by fiat. Since the sequences for A, B, C, and Thomson do not converge in the natural topology of their states, the Continuity Principle fails to assign a value, leaving $t=1$ genuinely indeterminate.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Mathematical Analysis of Convergence (5 Marks)**
  *   **Full Marks:** Correctly identifies that A, B, and C all fail to converge in their natural topologies. Uses provided facts correctly (e.g., density of harmonic sums for B, sparsity of squares for A).
  *   **Common Pitfall:** Claiming Lamp A converges to OFF because squares are sparse (confusing density with limit), or claiming Lamp C converges to a probability distribution rather than a specific state.

  **2. Distinction: Silence vs. Non-Convergence (5 Marks)**
  *   **Full Marks:** Clearly separates the logical silence of the description (Benacerraf's point: description ends at $t<1$) from the mathematical failure of the sequence to have a limit. Acknowledges that silence allows *any* state, while non-convergence blocks the *Continuity Principle*.
  *   **Common Pitfall:** Treating the lack of a limit as a logical contradiction, or ignoring the descriptive silence and treating the limit as the only source of determination.

  **3. Topological Awareness (5 Marks)**
  *   **Full Marks:** Explicitly notes that convergence depends on the topology (e.g., discrete for lamps, circular for dial). Mentions that changing topology (e.g., indiscrete) changes the verdict.
  *   **Common Pitfall:** Treating "limit" as a topology-independent concept, or failing to note that discrete spaces require eventual constancy for convergence.

  **4. Comparison to Thomson's Lamp (5 Marks)**
  *   **Full Marks:** Verdict that Thomson's Lamp is the *same kind* of problem (non-convergence in discrete topology), not unique. Identifies Thomson's as merely the simplest periodic case compared to A (aperiodic), B (dense), C (stochastic).
  *   **Common Pitfall:** Arguing Thomson's is unique because it toggles "regularly," or claiming the new lamps are solvable while Thomson's is not.

  **5. Evaluation of the Continuity Principle (5 Marks)**
  *   **Full Marks:** Commits to a verdict on the principle (e.g., it is an extra premise, not a logical truth). Articulates the cost (rules out supertasks, implies action at a distance, topology dependence).
  *   **Common Pitfall:** Hedging ("it depends on your view"), or asserting the principle is obviously true without discussing the metaphysical cost of imposing it on a silent description.
