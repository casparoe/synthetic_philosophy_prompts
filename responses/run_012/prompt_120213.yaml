      *   *Check:* Did I distinguish Jaspers' categories? The prompt mentions Jaspers. I should briefly reference his four types of guilt (Criminal, Political, Moral, Metaphysical) to show I understand the context. The debt analogy mostly maps to *Political Guilt*, but the students are using it to imply *Moral Guilt*.
      *   *Check:* The corporate analogy point. In law, corporations are liable for torts. Shareholders bear cost. But shareholders aren't *criminals*. This reinforces the Liability vs. Blame distinction.
