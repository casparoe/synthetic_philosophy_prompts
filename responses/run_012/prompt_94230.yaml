answer: |-
  This is a strong brief. You are asking for a facilitation plan that treats your neighbours as intelligent adults without requiring them to become political scientists. Your playing field case is not just good; it is theoretically complete. It mirrors the core problems of social choice theory (specifically agenda-setting and vote aggregation) without needing the math.

  Here is the plan for the evening, structured by the logical dependencies of the ideas.

  ### Part 1: The Case Study Assessment
  **Can the playing field consultations bear the weight?**
  **Yes.** You do not need a second case. In fact, adding a second case (e.g., Brexit or a national election) would weaken the session. National examples bring baggage and partisanship ("the elites," "the real people"). Your local example is shared, neutral ground.

  **What it must include:**
  To make this work, you must present the three consultations not as a story of *council manipulation*, but as a story of *question structure*.
  *   **Leave out:** Speculation on the Council's motives. If the room decides the Council "twisted" the results, the lesson becomes "politicians lie." That is a cynical dead end.
  *   **Include:** The specific mechanics of how the votes were counted. You need to draw on a whiteboard exactly how the "Yes to all three questions" in consultation two logically contradicts the "No" in consultation one. You need to show how the "second choices" in consultation three mathematically overrode the "first choices."

  **Why one case is better:**
  If you use two cases, people will look for differences between them ("Well, that's different because..."). If you use only the playing fields, they cannot escape the contradiction. They are forced to confront the fact that *the same people, in the same town, at the same time, had three different wills.*

  ---

  ### Part 2: The Order of Ideas (The Session Plan)

  You have 90 minutes. Do not lecture. Facilitate. But you must control the sequence.

  #### Phase 1: The Intuition (15 Minutes)
  **Goal:** Establish the baseline definition so you can break it.
  **Activity:** Ask the room: "When a politician says 'I am following the will of the people,' what picture does that paint in your head?"
  **Expected Answers:** It's what the majority wants; it's a fixed thing; it's the 'right' answer.
  **Why this comes first:** You cannot explain why the phrase is complex until you agree on why it sounds simple. You need them to verbalize the assumption that "The Will" is a hidden object waiting to be found, like a fossil.
  **Dependency:** This phase is required to set up the shock of Phase 2. If you skip this, the contradiction later will feel like a technical error rather than a philosophical problem.

  #### Phase 2: The Contradiction (30 Minutes)
  **Goal:** Shatter the idea that "The Will" is pre-existing and singular.
  **Activity:** Walk through the three consultations chronologically on the whiteboard.
  1.  **Vote 1 (Binary):** 51% No. *Conclusion: The Will = Stop.*
  2.  **Vote 2 (Fragmented):** 70% Want Housing + 70% Protect Green + 70% Traffic Bad. *Council Conclusion: The Will = Build (because housing need is urgent).* *Your Conclusion: The Will = Impossible (you can't protect the green and build on it).*
  3.  **Vote 3 (Ranked):** Full Development wins on transfers. *Conclusion: The Will = Build Big.*
  **The Pivot Point:** Ask the room: "Which of these three results is the *true* will of the people?"
  **Why this comes second:** You must let them feel the frustration of the contradiction before you offer an explanation. If you explain the theory first, they will treat it as abstract. If they feel the contradiction first, they will crave the explanation.
  **Addressing Misconception #1:** This is where you head off the idea that **the will exists beforehand.** By showing three valid methods producing three mutually exclusive outcomes, you prove the "will" was not sitting there waiting to be discovered. It was *made* by the method of asking.

  #### Phase 3: The Mechanism (30 Minutes)
  **Goal:** Shift blame from "liars" to "logic."
  **Activity:** Explain *why* the results changed.
  *   **On Vote 2:** Explain that when you break one big decision into three small questions, you allow people to hold contradictory wishes (I want housing *and* I want no building). The "Will" fragmented because the question fragmented the issue.
  *   **On Vote 3:** Explain that when you allow second choices, you change the value of a vote. The "Will" shifted because the *rules of counting* shifted.
  **Addressing Misconception #2:** This is where you head off the idea that **majority rule is straightforward.** Show them that "Majority" depends on how you group the options. A majority for "No Building" (Vote 1) can become a minority once "Small Building" is introduced and eliminated (Vote 3).
  **Dependency:** This phase depends on Phase 2. You can only explain the mechanism once they admit the results are contradictory. This phase saves the evening from becoming a complaint session about the Council. It turns anger into analysis.

  #### Phase 4: The Reconstruction (15 Minutes)
  **Goal:** Make the phrase do "real work" again.
  **Activity:** Propose a new definition. "The Will of the People is not a discovery; it is a construction."
  **Discussion:** If the will is built by the questions we ask, then the most important democratic act is not voting, but *deciding what to vote on.*
  **Why this comes last:** You cannot ask them to accept a complex definition until you have destroyed the simple one. Now, the phrase "Will of the People" stops being empty noise (because everyone knows it's manipulatable) and starts being a tool for scrutiny. It becomes a warning label: *"Whose questions are we answering?"*
  **Dependency:** This relies on Phase 3. Once they understand the mechanism, they can see that "The Will" is the *output* of a system, not the *input*.

  ---

  ### Part 3: The Diagnostic Question
  Near the end (last 10 minutes), ask this single question to test their grasp:

  > **"If we hold a fourth consultation next month, and we get a fourth different answer, has the system failed? Or is the system working exactly as designed?"**

  *   **If they have been talked into it:** They will say the system failed, or that the Council is incompetent, or that we need to find the "right" question. They still believe there is one true answer hidden somewhere.
  *   **If they have grasped the difficulty:** They will say, "The system is working as designed; different questions produce different wills. The problem isn't the result, it's that we have to choose which construction of the will we prefer."

  ---

  ### Part 4: What You Are Not Going to Settle
  You must state this explicitly at the start or end. It protects you from impossible expectations.

  **Say this:**
  *"Tonight, we are not going to solve how to fix democracy. We are not going to decide which of our three consultations was the 'right' one. And we are not going to decide who counts as 'the people' (residents? taxpayers? future generations?). We are only going to agree on what the phrase 'The Will of the People' is actually doing when we use it. We are diagnosing the tool, not building the house."*

  **Why:**
  1.  **Normative vs. Descriptive:** You are describing how the phrase works (descriptive), not how it *should* work (normative). Solving the "should" requires moral philosophy you don't have time for.
  2.  **The Boundary Problem:** Political theory cannot even agree on who constitutes "the people." If you open that door, the councillors and campaigners will fight over voter ID or residency rules, and you will lose the room.
  3.  **The "Right" Method:** There is no mathematical proof for the "best" voting system. If you try to pick a winner, you become a partisan. If you stay neutral, you remain a facilitator.

  ### Summary of Dependencies
  1.  **Intuition** (What we think it is) $\rightarrow$ required to create the baseline for **Contradiction**.
  2.  **Contradiction** (The three votes) $\rightarrow$ required to prove the baseline is wrong, enabling **Mechanism**.
  3.  **Mechanism** (How questions shape answers) $\rightarrow$ required to remove cynicism, enabling **Reconstruction**.
  4.  **Reconstruction** (Will as construction) $\rightarrow$ allows the phrase to be useful again without being naive.

  ### Facilitator's Note for You
  You are a hospital administrator. You know that "patient outcome" depends on "triage protocol." Use that analogy if you get stuck.
  *   *Vote 1* was Triage Category Red.
  *   *Vote 2* was Triage Category Green.
  *   *The Patient* (The Town) didn't change. The *Protocol* (The Question) changed.
  *   Therefore, the "Health of the Patient" (The Will) is a measurement dependent on the test, not just a fact of the body.

  Stick to the playing fields. Trust the contradiction. Do not let them blame the Council; make them blame the math. Good luck.
