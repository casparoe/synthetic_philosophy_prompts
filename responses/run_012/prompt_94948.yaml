answer: |-
  Here is the audit of your desiderata list, followed by the "Impossibility Results" you asked for, and finally a cleaned-up version of the list that you can actually put in the handout.

  ### Part 1: Requirement Audit
  *Goal: Filter for the "Legislator/Insect Welfare" constraint.*

  **1. Metamorphosis and Rebuilding (Caterpillars/Sea Squirts)**
  *Verdict: **Drop or Reframe.** *
  *Reasoning:* You specified the use-case is a legislator deciding on *farmed* insects. Farmed insects (crickets, mealworms) are harvested at the larval/nymph stage. They are never allowed to metamorphose. The question of whether the butterfly is the "same subject" as the caterpillar is a fascinating metaphysical puzzle, but it is legally inert for this specific purpose. The legislator needs to know if the *larva* in the bin is conscious *now*. Diachronic identity (persistence over time) is a luxury problem; synchronic capacity (suffering now) is the legislative mandate. Keep this only if you want to teach metaphysics, not if you want to teach policy guidance.

  **2. Decentralized Subjects (Cephalopods/Arms)**
  *Verdict: **Keep.** *
  *Reasoning:* This is critical for slaughter methods. If a severed arm processes nociception independently of the central brain, standard killing methods might leave "parts" of the subject suffering. For a legislator, the "location" of consciousness dictates the "method" of euthanasia. This forces the theory to map function to anatomy, not just posit a global state.

  **3. Neuron Count Proxy**
  *Verdict: **Keep.** *
  *Reasoning:* This is the bee-vs-mouse problem. If the theory relies on absolute processing power or raw neuron count, insects are excluded by definition, rendering the legislative question moot before it starts. The theory must allow for efficiency over volume. If a million neurons can do the job, the theory must recognize that.

  **4. Split Brains / Multiple Subjects**
  *Verdict: **Downgrade.** *
  *Reasoning:* This is a "prejudice of the camp" (see Part 3). Split-brain cases are human pathologies or lab artifacts. They are vanishingly rare in wild or farmed animals. While important for a theory of *human* consciousness, demanding a theory solve this to pass muster for *animal* welfare is setting the bar in the wrong place. It distracts from the convergent evolution problem which is much more common.

  **5. Convergent Evolution / Nociception without Cortex**
  *Verdict: **Keep (The Anchor).** *
  *Reasoning:* This is the non-negotiable constraint. If the theory requires a neocortex, a specific thalamocortical loop, or mammalian architecture, it fails the insect test immediately. It must be substrate-neutral. It must explain how a bird or a bee achieves the relevant state without the hardware humans use.

  **6. Threshold Specificity**
  *Verdict: **Keep (But Dangerous).** *
  *Reasoning:* A legislator cannot regulate "maybe." They need a rule: "If structure X is present, protect." The theory must define the necessary and sufficient conditions clearly enough to draw a line. However, as we will see in Part 2, this is where the theory is most likely to break.

  **7. Detectable Failure (Falsifiability)**
  *Verdict: **Keep.** *
  *Reasoning:* If the theory can explain both "the bee is conscious" and "the bee is not conscious" by tweaking parameters post-hoc, it is theology, not science. For a legislator relying on expert testimony, the theory must be vulnerable to evidence. If it isn't, the legislator is being asked to trust authority, not data.

  **8. Individuality (Not Clades)**
  *Verdict: **Keep.** *
  *Reasoning:* Welfare attaches to individuals. A theory that says "Hymenoptera are conscious" but can't tell you if a specific injured worker is suffering is useless. It must scale from the general architecture to the specific instance.

  ---

  ### Part 2: Impossibility Results & Analysis

  You asked for the conflicts. Here is where the constraints break each other.

  **The Jointly Unsatisfiable Pair: Threshold Specificity vs. Usable Under Uncertainty**
  This is the core tension of the handout.
  *   **Requirement A:** The theory must give a usable verdict to a legislator (Threshold Specificity).
  *   **Requirement B:** The theory must be honest about uncertainty and indirect measurement (Usable Under Uncertainty).
  *   **The Conflict:** Consciousness is almost certainly a gradient (a dimmer switch), but legislation requires a binary (on/off). To satisfy the legislator, the theory must impose a sharp cutoff on a fuzzy reality. To satisfy scientific honesty, the theory must admit the cutoff is arbitrary.
  *   **The Result:** You cannot have a theory that is both *precisely actionable* and *epistemically humble*. If you force the theory to give a bright-line rule for insects, it will necessarily overstate its confidence. If you force it to admit uncertainty, the legislator cannot use it. **This is the most important thing on the page.** You should present this not as a bug, but as the central problem the seminar will wrestle with.

  **The Single Requirement That Excludes Popular Theories: Threshold Specificity**
  Most theories of consciousness (IIT, GWT, PP) are excellent at describing *mechanisms* in systems that are already assumed to be conscious (usually humans). They are terrible at specifying *where* the mechanism becomes sufficient for moral status.
  *   **IIT:** Can calculate Phi, but has no established mapping from Phi value to "worthy of welfare." Is Phi=0.1 enough? 0.01?
  *   **GWT:** Describes access to global workspace, but does not specify the minimum complexity of the workspace required for *sentience* vs. *unconscious processing*.
  *   **Predictive Processing:** Describes how perception works, not when prediction errors become *painful*.
  *   **Why it kills them:** Demanding a specific line for insects forces these theories to leave the armchair and make risky neuroanatomical predictions they usually dodge. It exposes that they are theories of *human* consciousness masquerading as general theories.

  **The Prejudices Dressed as Adequacy Conditions**
  *   **Split Brains:** This is a human-clinical prejudice. It assumes the "hard case" is a severed corpus callosum in a primate. For animal minds, the hard case is a distributed nervous system (octopus) or a miniaturized one (bee). Prioritizing split brains privileges human pathology over animal ecology.
  *   **Metamorphosis Identity:** This is a metaphysical prejudice. It assumes the "persistence of the subject" is the primary puzzle. For welfare, the "presence of suffering" is the primary puzzle. A theory that solves identity but fails to detect pain in a larva is useless for the legislator.

  ---

  ### Part 3: The Refined Desiderata (For the Handout)

  *Below is the text you can adapt for the handout. It incorporates the audit above, removing the metaphysical luxuries and sharpening the legislative constraints.*

  **Desiderata for a Theory of Animal Consciousness**

  **Purpose:** To provide actionable guidance for welfare legislation regarding non-human animals (specifically invertebrates), under conditions of indirect measurement and epistemic uncertainty.

  1.  **Substrate Neutrality:** The theory cannot define consciousness by the presence of mammalian or avian anatomy (e.g., cortex, thalamus). It must identify functional or structural marks that could be realized by convergent evolution in insects or cephalopods.
  2.  **Anatomical Specificity:** The theory must locate the seat of consciousness within the organism. It must distinguish between centralized subjects (vertebrates) and potentially decentralized or distributed subjects (cephalopods), providing guidance on whether partial destruction of the nervous system constitutes harm to a subject.
  3.  **Efficiency Sensitivity:** The theory cannot rely on raw processing power or neuron count as a proxy for moral status. It must account for high-density, low-volume architectures (e.g., the insect mushroom bodies) without defaulting to a "more neurons = more real" heuristic.
  4.  **Actionable Thresholds:** The theory must offer criteria sufficient to draw a regulatory line. It cannot rest on vague gradients; it must specify what minimum architecture or integration is required to trigger welfare protections, acknowledging that this line will be used to permit or prohibit farming practices.
  5.  **Individual Resolution:** The theory must apply to individual organisms, not just clades or species averages. It must allow for the possibility of variance within a species (e.g., due to injury, development, or mutation).
  6.  **Falsifiability:** The theory must specify what evidence would prove it wrong. If a theory can accommodate any finding regarding insect behavior or neuroanatomy, it provides no decision support for the legislator.

  **The Constraint Problem:**
  Note that Desiderata 4 (Actionable Thresholds) and the reality of Epistemic Uncertainty are in tension. A theory precise enough to satisfy the legislator risks being scientifically dogmatic; a theory honest enough to satisfy the scientist risks being legally useless. We will evaluate each theory by how it manages this trade-off.
