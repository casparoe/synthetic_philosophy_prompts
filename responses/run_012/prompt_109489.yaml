answer: |-
  **Disease Sorting Quiz**

  **Instructions:** Read each case. Select the option that best matches your intuition.

  **1. The Extra Finger**
  A child is born with six fingers. The extra digit works perfectly but is removed for cosmetic reasons.
  A) Yes, it's a disease (biological deviation).
  B) No, unless it causes pain or limits function.
  C) No, "disease" is just a label for what looks odd.

  **2. The Common Blur**
  Nearsightedness affects half the class. Without glasses, they cannot drive safely.
  A) Yes, the eye mechanism is failing.
  B) Yes, because it limits normal life activities.
  C) No, it's too common to be a disease; it's just variation.

  **3. The Old Diagnosis**
  Homosexuality was once a psychiatric diagnosis. The biology hasn't changed, but the classification did.
  A) Yes, it was always a biological dysfunction.
  B) No, it was never a disease because it causes no inherent harm.
  C) Yes/No depends entirely on society's values at the time.

  **4. The Surgeon's Allergy**
  A surgeon develops a latex allergy. She is healthy otherwise but cannot work in an operating room.
  A) Yes, her immune system is malfunctioning.
  B) Only if it prevents her from living the life she wants.
  C) No, the environment is the problem, not her body.

  **5. The Creative High**
  A writer experiences hypomania. She feels euphoric and productive, though her family worries she is unstable.
  A) Yes, her brain chemistry is dysregulated.
  B) No, she feels well; disease requires suffering.
  C) It's a disease only if society decides her behavior is unacceptable.

  **6. The Short Stature**
  A healthy child is significantly shorter than peers. Parents seek growth hormones to prevent bullying.
  A) Yes, growth mechanisms are deficient.
  B) Yes, because being short disadvantages them socially.
  C) No, treating normal variation as disease is a social choice.

  **7. The Mystery Pain**
  A patient suffers chronic pain. Scans show no tissue damage or biological error.
  A) No, without biological failure, it isn't disease.
  B) Yes, the suffering is real regardless of the cause.
  C) "Disease" is the wrong word; it's a social claim for help.

  **8. The Failing Heart**
  A heart stops pumping blood. The patient will die without intervention.
  A) Yes, the organ is objectively broken.
  B) Yes, because death is the ultimate harm.
  C) Even here, "disease" is just a concept we use to manage death.

  ***

  **Scoring Key**

  Tally your A, B, and C responses.

  *   **Mostly A (Biological Dysfunction):** You view disease as a **biological fact**. If the body's design fails, it is disease, regardless of harm or social opinion (e.g., Case 1 is disease; Case 5 is disease).
  *   **Mostly B (Dysfunction + Harm):** You hold a **hybrid naturalist** view. Biology matters, but harm is essential. Harmless deviations (Case 1) or wanted states (Case 5) are not diseases.
  *   **Mostly C (Values Through and Through):** You are a **normativist**. Disease is not a fact of nature but a judgment of badness. Biology is irrelevant without social evaluation (e.g., Case 3 depends on values).
  *   **Mostly C (with skepticism on Case 8):** You lean toward **eliminativism**. You believe the concept of "disease" is too messy to be objective and should be replaced or abandoned.
  *   **Mixed A and B (acknowledging Case 7 as B):** You see the **fact/value split as false**. You believe biological facts exist, but identifying disease inherently involves objective evaluation of harm (e.g., Case 7 is disease despite no biological lesion).

  **The Outlier Pattern**
  If you answered **A to Case 1** (Extra Finger) but **C to Case 8** (Failing Heart), you fit none of the five positions. You would have to believe disease is **purely statistical rarity**. Since heart failure is common in the elderly, you'd deny it's a disease, while calling harmless polydactyly a disease solely because it is rare.

  **Limitations**
  This quiz cannot reliably separate **Normativism** from **Eliminativism**. Both reject biological facts as the sole determinant of disease. Distinguishing them requires asking whether you think the term "disease" is still useful (Eliminativism says no; Normativism says yes, as a value term).
