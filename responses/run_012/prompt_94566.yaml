          *   *Verdict:* Low severity, provided (4) is treated as a retrospective framing device, not a claim that early modern actors were aware of it.

      *   *Tension J: The Big One - (1) Causal Parity vs. (7) Differential Explanation.*
          *   This is the strongest methodological friction.
          *   Scenario: Tambora erupts (Global). New England moves west. Virginia stays put (hypothetically).
