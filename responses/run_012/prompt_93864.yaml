answer: |-
  **Title:** The Architecture of Accusation: Levels of Responsibility in the Fischer Controversy

  **The Research Question**
  To what extent does the historiographical force of the Fischer controversy depend on an unresolved equivocation between three distinct models of moral agency: the individual decision-maker, the state as a corporate agent, and the people as a collective?

  This paper does not ask whether Germany was responsible for the First World War. Rather, it asks what kind of entity is being held responsible when historians assert that "Germany" willed the war. I argue that the controversy's persistence and intensity are not solely functions of archival discovery or national bias, but are structurally sustained by a slippage between these three levels of attribution. When the argument is pressed at one level, it retreats to another, preserving the accusation of guilt while obscuring the conceptual cost of doing so.

  **Existing Positions and the Gap**
  Standard historiographical treatments of the Fischer controversy frame the dispute as a conflict over evidence and intentionality. The "Fischer thesis" is typically understood as a claim about the specific war aims of the German leadership, supported by archival documentation. Counter-arguments focus on the constraints facing those leaders, the actions of other powers, or the reliability of the documents.

  Both sides, however, largely accept a monolithic conception of the German agent. They treat "Germany" as a transparent vessel for action, assuming that responsibility attributed to the state seamlessly transfers to the leadership, and often implicitly to the populace. While some historians have noted the political utility of blaming "Germany" rather than specific elites, few have analyzed the *conceptual* incoherence that allows this substitution to occur. Conversely, philosophers of historical responsibility often discuss collective guilt in the abstract but rarely apply these distinctions to concrete historiographical debates where the stakes are evidential and political. This paper bridges that gap by treating the controversy itself as a case study in the metaphysics of social groups.

  **Conceptual Method**
  The method employed here is conceptual analysis applied to historiographical practice. I will reconstruct the logical structure of the primary accusations leveled during the controversy, distinguishing between:
  1.  **Individual Responsibility:** Based on the mental states and causal efficacy of specific actors (e.g., Bethmann-Hollweg, Moltke).
  2.  **Corporate Responsibility:** Based on the institutional procedures and policy outputs of the German Reich as a state apparatus, independent of specific individual intents.
  3.  **Collective Responsibility:** Based on the shared identity, culture, or complicity of the German *Volk*.

  A straightforwardly historiographical approach asks, "What did the documents show?" A philosophical approach asks, "What must be true about the agent for this document to count as evidence of guilt?" By isolating these categories, I will demonstrate that the Fischer thesis gains its rhetorical power by allowing evidence relevant to one category (e.g., a memo by an individual) to stand in for a conclusion about another (e.g., the guilt of the nation). This method is preferable because it explains why the debate reached an impasse that further archival digging could not resolve: the participants were not merely disagreeing on facts, but on the ontology of the accused.

  **Scope for a Twenty-Minute Paper**
  Given the time limit, I will not attempt a comprehensive history of the controversy. Instead, I will focus on two specific argumentative moves common in the debate:
  1.  The transition from criticizing specific war aims (individual/corporate) to invoking a "continuous line" of German aggression (collective/cultural).
  2.  The defense strategy that shifts from denying individual intent to emphasizing structural constraints on the state.

  I will limit my analysis to the logical structure of these moves, using them as exemplars of the "sliding" mechanism. I will not adjudicate the historical truth of the claims, nor will I engage with the broader diplomatic history of 1914 beyond what is necessary to illustrate the attribution of responsibility.

  **Criteria for Success and Failure**
  A successful result will demonstrate that the stalemate of the Fischer controversy is partially constitutive, not just evidential. Success looks like showing that when critics attacked Fischer on the level of individual intent, Fischer's defense (and his supporters') often relied on structural or cultural claims, and vice versa. If I can show that the controversy functions as a system of equivocation that protects the core accusation from falsification, the paper succeeds.

  Failure would take two forms. First, if the analysis collapses into a restatement of historical facts, becoming a historiographical summary rather than a philosophical critique. Second, if the distinction between corporate and collective agency proves too abstract to map onto the actual texts of the controversy, rendering the model descriptively inaccurate. The paper must remain grounded in the actual argumentative moves of the participants while elevating them to the level of conceptual analysis.

  **Broader Significance**
  By resolving this ambiguity, the paper aims to contribute to the workshop's theme of historical responsibility. It suggests that many debates over national guilt are not merely disputes about the past, but disputes about the metaphysics of group agency. Clarifying these levels is a prerequisite for any coherent ethics of historical justice.
