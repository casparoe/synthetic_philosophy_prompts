          1.  Correct definition of $h^2$ as a ratio of variances ($V_G/V_P$).
          2.  Explanation of Nordland/Sudland $h^2$ difference via $V_E$ (Environmental Variance), not $V_G$.
          3.  Rejection of between-population inference based on within-population $h^2$.
          4.  Explanation of Iodine: Mean shift $\neq$ Variance shift.
          5.  Critique of the Pundit's policy conclusion based on the statistical error.
      *   *Common Errors:* Need specific "how they blow it" one-liners for each.
      *   *A vs. B Differentiators:* Needs to be concrete.
          *   *Idea 1:* Handling the Iodine paradox (B students say "environment changed," A students specify "mean vs. variance").
          *   *Idea 2:* Norms of Reaction (A students explicitly mention GxE or norms of reaction to explain why $V_G$ doesn't map to outcome directly).
          *   *Idea 3:* Precision on the Pundit (B students say "you can't compare groups," A students explain *why*—different variance structures).
      *   *Selection:* Let's go with (1) Mean vs. Variance distinction on Iodine and (2) Explicit articulation of the "Within vs. Between" logical gap (Lewontin's fallacy) rather than just stating it.

