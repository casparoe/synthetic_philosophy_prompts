      *   *Length:* Around 700 words.
      *   *Content:*
          *   Define $h^2 = V_G / V_P$ (where $V_P = V_G + V_E + V_{GxE}$).
          *   Explain Nordland ($V_E$ low $\rightarrow$ $h^2$ high) vs. Sudland ($V_E$ high $\rightarrow$ $h^2$ low).
          *   Critique the Pundit: Within-population $h^2$ does not license between-population causal claims (Lewontin's point).
          *   Explain Iodine: Shift in mean is a shift in the environmental *mean*, not necessarily the environmental *variance*. If everyone gets iodine, $V_E$ doesn't necessarily change, so the ratio stays the same even if the mean moves.
          *   Conclusion: The pundit is right about funding Sudland but for the wrong reasons (or at least, the $h^2$ stats don't prove the causal story).
      *   *Check:* Does it avoid the "slogan" trap? Yes, by doing the math on variances.

  4.  **Drafting Part (c): The Marking Scheme:**
