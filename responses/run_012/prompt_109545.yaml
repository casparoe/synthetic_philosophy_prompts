answer: |-
  (a) **Essay Question**

  **Time Allowed:** 2 Hours
  **Format:** Closed Book
  **Total Marks:** 20

  **Question 1: The Nordland/Sudland Case**

  Read the following scenario carefully:

  > A consortium measures a cognitive outcome in two neighbouring provinces, Nordland and Sudland.
  > *   **Nordland:** Wealthy, internally homogeneous (schooling, nutrition, and healthcare are nearly identical for all citizens). Heritability estimate ($h^2$) $\approx 0.8$.
  > *   **Sudland:** Poorer, internally heterogeneous (wide variance in schooling, nutrition, and healthcare). Heritability estimate ($h^2$) $\approx 0.3$.
  > *   **Nordland Intervention:** Ten years later, Nordland introduces universal iodine supplementation. The population mean score rises significantly, but the heritability estimate remains $\approx 0.8$.
  >
  > **Pundit Op-Ed:** "The data proves that in Nordland, cognitive differences are mostly genetic, whereas in Sudland they are mostly environmental. Therefore, the cognitive gap *between* the provinces is mostly environmental. We should direct intervention funds to Sudland, not Nordland."

  Write an essay responding to the following three prompts:

  1.  **Variance Decomposition (8 marks):** Using the formula for broad-sense heritability, explain mechanically why $h^2$ is higher in Nordland than in Sudland. Specifically, identify which term in the denominator is driving the difference between the two provinces and why.
  2.  **The Between-Group Inference (6 marks):** Evaluate the Pundit's claim that the gap *between* Nordland and Sudland is "mostly environmental" based on the *within*-population heritability estimates. Is this inference valid? Why or why not?
  3.  **The Iodine Paradox (6 marks):** Explain how the mean score in Nordland could rise while heritability remained constant. What does this demonstrate about the relationship between environmental *means* and environmental *variance*?

  ***

  (b) **Model Answer**

  The Pundit's argument is a classic example of conflating within-population variance ratios with between-population causal histories. While the policy recommendation (fund Sudland) may be correct, the statistical justification provided is invalid. To see why, we must look at the machinery of variance decomposition rather than treating heritability as a measure of genetic "determination."

  First, regarding the difference in heritability estimates between the provinces: Heritability ($h^2$) is defined as the ratio of genetic variance to total phenotypic variance ($V_G / V_P$). Crucially, phenotypic variance is the sum of genetic variance, environmental variance, and their interaction ($V_P = V_G + V_E + V_{GxE}$). In this scenario, there is no reason to assume the genetic variance ($V_G$) differs drastically between two neighbouring provinces. The divergence in $h^2$ is driven by the denominator, specifically $V_E$. Nordland is environmentally homogeneous; because schooling and nutrition are uniform, $V_E$ is minimized. When $V_E$ is small, $V_G$ constitutes a larger proportion of $V_P$, yielding a high $h^2$ (0.8). Conversely, Sudland is environmentally heterogeneous. High variance in nutrition and schooling inflates $V_E$. As $V_E$ grows, the ratio $V_G / (V_G + V_E)$ shrinks, resulting in a lower $h^2$ (0.3). Thus, the difference in estimates reflects a difference in environmental *variance*, not a difference in the causal role of genes.

  Second, the Pundit's inference about the gap between the provinces is logically invalid. This is Lewontin's fallacy: high within-group heritability does not preclude large between-group environmental differences. Imagine two fields of corn: one planted with high-yield seeds in rich soil, the other with low-yield seeds in poor soil. Within each field, height differences might be highly heritable. However, the difference *between* the fields could be entirely due to the soil. Similarly, knowing that $h^2$ is 0.8 in Nordland tells us only about the source of *differences among Nordlanders*. It licenses no conclusion about why the Nordland *mean* differs from the Sudland *mean*. The mean difference could be 100% environmental (e.g., chronic malnutrition in Sudland) even if within-Sudland variance is largely genetic. The Pundit attempts to use a statistic describing variance distribution to make a claim about mean causation, which the mathematics does not support.

  Finally, the iodine result illustrates the distinction between shifting an environmental mean and changing environmental variance. Iodine supplementation is an environmental change that shifted the population mean upward. However, because the programme was *universal*, every child received the supplement. Consequently, the variance in iodine intake ($V_E$ component) did not change; everyone moved up the reaction norm together. Since neither $V_G$ nor $V_E$ changed significantly, the ratio ($h^2$) remained stable at 0.8. This demonstrates that a trait can be highly heritable and yet highly malleable. Heritability tracks the proportion of *current* variation attributable to genetic differences, not the immutability of the trait. If the environment changes uniformly, the mean shifts without altering the heritability coefficient.

  In conclusion, the Nordland/Sudland data confirms that heritability is environment-relative. The Pundit fails to distinguish between $V_E$ and $E$, and between within-group variance and between-group means. Funds should go to Sudland because we have independent reasons to suspect deprivation, not because $h^2$ is lower there.

  ***

  (c) **Marking Scheme**

  **Total:** 20 Marks (5 Criteria × 4 Marks each)
  **Grading Note:** To pass, a script must hit at least 3 of the 5 criteria. An 'A' script must hit all 5 and demonstrate the "A/B Differentiators" listed below.

  | **Criterion** | **Must-Hit Content (4 marks)** | **How Students Typically Blow It** |
  | :--- | :--- | :--- |
  | **1. Formula Definition** | Explicitly states $h^2 = V_G / V_P$ (or $V_G / (V_G + V_E)$). Identifies $V_P$ as total phenotypic variance. | Writes "heritability is the % of trait that is genetic" without mentioning variance ($V$). |
  | **2. Nordland/Sudland Mechanism** | Explains that $V_E$ is low in Nordland and high in Sudland. Explicitly states $V_G$ is likely similar, so the *ratio* changes due to the denominator. | Claims Nordland has "more genetic variance" or Sudland has "less genetic influence" rather than focusing on environmental variance. |
  | **3. Within vs. Between** | Rejects the Pundit's inference. States that within-population $h^2$ does not explain between-population *mean* differences (Lewontin's point). | Says "you can't compare groups" without explaining *why* (i.e., fails to distinguish variance structures from mean causes). |
  | **4. Iodine (Mean vs. Variance)** | Explains that universal supplementation changes the environmental *mean* but not the environmental *variance* ($V_E$). | Says "the environment changed so heritability should have dropped" or treats the result as a paradox they cannot resolve. |
  | **5. Pundit Critique** | Concludes the Pundit's argument is invalid (even if the conclusion is coincidentally right). Links the error to the confusion of variance and means. | Focuses entirely on the ethics of the funding decision rather than the statistical validity of the argument. |

  **A vs. B Differentiators**
  *Use these to distinguish a 16/20 (B+) from a 19/20 (A).*

  1.  **Precision on Iodine:**
      *   **B Script:** Says "Everyone got the same iodine, so variance didn't change."
      *   **A Script:** Explicitly distinguishes between shifting the *distribution* of the phenotype (mean) vs. changing the *spread* of the distribution (variance), noting that $h^2$ is blind to mean shifts.
  2.  **Handling the "Gap":**
      *   **B Script:** States Lewontin's fallacy as a rule ("You can't infer between from within").
      *   **A Script:** Explains the *mechanism* of the fallacy using the prompt's context (e.g., "Sudland's lower mean could be caused by a uniform environmental deficit that suppresses the mean without affecting $V_E$ significantly").
  3.  **Norms of Reaction (Optional Bonus):**
      *   **A Script:** Briefly mentions that the iodine case implies a shift along a norm of reaction, reinforcing that genes do not code for fixed outcomes. (Not required for full marks, but signals top-tier understanding).
