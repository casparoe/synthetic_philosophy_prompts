          *   (c) Marking Scheme (5 must-hit points @ 4 marks each + common errors + A vs. B differentiators).
      *   **Key Concepts to Test:** Heritability formula ($V_G / V_P$), variance decomposition, environment-relative estimates, between-population vs. within-population inference, the iodine paradox (mean shift vs. variance ratio).
