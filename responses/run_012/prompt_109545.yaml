          *   Sudland: Poorer, heterogeneous environment, $h^2 \approx 0.3$.
          *   Nordland Intervention: Iodine supplementation raises mean score, $h^2$ stays $\approx 0.8$.
          *   Pundit Op-Ed: Claims Sudland gap is environmental, Nordland differences are genetic, so fund Sudland.
      *   **Deliverables:**
