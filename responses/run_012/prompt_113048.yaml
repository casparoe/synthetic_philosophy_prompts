answer: |-
  The static in the watchtower always sounded like the ocean had been pulled up into the wires, a white-noise tide crashing against the glass. Elara liked it. It was neutral. It didn't want anything from her.

  She sat in the volunteer station above the harbor master's office, her hands resting lightly on the logbook. Below, the town of Oakhaven was sleeping off the remnants of a autumn gale. Her shift was meant to be a formality, a listening post for Coast Guard overflow, but Elara treated it as a practice ground. She had spent three years refining a specific kind of quiet. When a fisherman called in drunk and slurring about conspiracies, she didn't feel the prick of irritation. She noted the slurry speech, the background noise of a bar, the psychological need for attention, and she logged it as *Non-Emergency / Intoxication*. She didn't judge him. She didn't resent him for wasting her time. She understood the causes that made him speak, and understanding dissolved the demand for a response.

  That night, the voice came through at 02:14.

  It was male, breathless. The signal was weak, breaking up under the interference of the lingering storm. *"—taking water… starboard… can't hold…"*

  Elara put on her headphones. She closed her eyes and listened not to the words, but to the texture of the voice. It was high, panicked. But she knew the acoustics of the bay. She knew that when the wind whipped around the headland, it created false echoes that sounded like distress. She knew that small boat owners often exaggerated minor leaks to justify calling in a favor from the rescue team. She analyzed the probability. A real distress call at this hour, in this weather, from an unregistered frequency? The odds were low. The odds of a false alarm driven by panic were high.

  To act would be to enter the chaos. To call the Coast Guard would be to initiate a chain of demands: they would come, they would ask questions, they would expect her to be sure. If she was wrong, she would have to answer for it. She would be liable.

  Instead, she reached for her pen. She wrote: *02:15. Interference. Probable false alarm.* She did not transmit. She did not log a location. She managed the input. She smoothed the jagged edge of the sound into a neat line in the book. She felt a surge of calm, the specific serenity of someone who has refused to be drawn into a game they did not agree to play. She took a sip of cold tea and watched the radar sweep green across the dark screen.

  ***

  Two days later, the town was buzzing. A trawler had been found grounded on the shoals near the headland. The crew had survived, clinging to the rigging until the tide turned, but the boat was totaled. It was the *Kestrel*.

  Elara walked to the market for coffee. She moved through the crowd with her usual gentle detachment. She met Mrs. Gable near the produce stand. Mrs. Gable's son had been on the rescue boat that towed the *Kestrel* in. The older woman was shaking, her hands clutching a bag of apples too tightly.

  "He could have died, Elara," Mrs. Gable said, her voice tight. "If the wind had shifted…"

  Elara reached out and touched the woman's arm. She didn't offer sympathy, exactly. Sympathy implied sharing the burden of the fear. Instead, she offered perspective. "The rescue team is highly trained," Elara said softly. "And the weather patterns were predictable. It looks frightening, but the mechanics of it were sound. Your son is safe. The outcome was favorable."

  Mrs. Gable pulled her arm away. Her eyes were wet, not with relief, but with a sudden, sharp frustration. "It wasn't about mechanics, Elara. I was scared. I'm still scared. I need to… I need to know someone else feels how dangerous that was."

  "I feel it," Elara lied, or perhaps she didn't. She felt the data of the fear, but not the weight of it. "But dwelling on the danger doesn't change the physics of the sea. You should go home and rest. Worrying won't stitch the boat back together."

  Mrs. Gable stared at her for a long moment, then turned and walked away without saying goodbye. Elara watched her go, feeling a faint pity. Mrs. Gable was trapped in the turbulence of her own emotions, demanding that the world mirror her internal state. Elara was free of that. She was the adult in the room. She was the one who could see the strings pulling the puppets. It was a kindness, really, to not add her own panic to the mix. To remain solid. To remain objective.

  ***

  The knock on her door came just after dusk. Elara opened it to find Thomas, the brother of the man who captained the *Kestrel*. He was a large man, usually jovial, but now his face was drawn tight, the skin around his eyes gray.

  "Elara," he said. He didn't wait for an invitation. He stepped into the hallway. He smelled of salt and diesel fuel. "You were on watch Tuesday night."

  It wasn't a question. Elara closed the door. "I was. Is your brother alright? I heard he survived."

  "He's shaken up. He said he called. He said he broadcast on the emergency frequency." Thomas turned to face her. The air in the hallway seemed to thicken. "He said he told you he was taking water."

  Elara kept her hands clasped in front of her. She adopted the posture she used when dealing with distressed relatives at the hospital where she used to volunteer. Open, non-threatening, explanatory. "The signal was compromised, Thomas. The storm was causing significant interference on that band. I assessed the transmission. It lacked the clarity required for a coordinated response. If I had launched the Coast Guard on a ghost signal, I would have put rescuers at risk for no reason."

  "You assessed it," Thomas repeated. His voice was low. "You decided."

  "I evaluated the conditions. It was a judgment call based on probability."

  "It wasn't a probability," Thomas said. He took a step toward her. "It was my brother. It was a man asking for help. You didn't just make a mistake, Elara. You didn't listen."

  "I listened perfectly well," Elara said, her voice steady. "I heard the input. I processed it. The error was in the transmission, not the reception. You're looking for a villain because it's easier than accepting that the sea is chaotic."

  Thomas laughed, a short, harsh sound. "No. I'm looking for you. I'm looking for the person who chose to sit on her hands." He was breathing hard now. "I don't care about your probabilities. I care that you heard him and you decided he wasn't worth the trouble. You decided your quiet night was worth more than his safety."

  "That's not accurate," Elara said. She felt a flicker of something—not guilt, but annoyance. He was being irrational. He was demanding that she accept a moral burden that didn't exist. She hadn't *caused* the storm. She hadn't *caused* the leak. She had merely managed the information flow. To blame her was to misunderstand the chain of causality. "I acted according to protocol. I protected resources."

  "Protocol," Thomas spat. He leaned in, his face inches from hers. "You think you're above this? You think because you analyze everything, you don't have to live in it with the rest of us?"

  "I think," Elara said, "that you are grieving the possibility of loss, and you need to assign blame to make sense of it. I understand why you need to do that. But I won't participate in it."

  "Participate," Thomas said. He shook his head, looking at her as if she were a specimen in a jar. "You didn't participate. That's the problem. You weren't there. You were up in your tower, playing God."

  He turned and walked out, slamming the door hard enough to rattle the frame.

  Elara stood in the hallway. Her heart was beating faster than usual. She analyzed the sensation. Adrenaline. Cortisol. A physiological response to a perceived threat. She breathed in for four counts, held for four, exhaled for four. She waited for the feeling to pass. She waited for the calm to return, the cool distance that allowed her to see that Thomas was just a man driven by pain, acting out predictable patterns.

  But the calm didn't come all the way back. There was a residue. A sticky heat in her chest. She walked to the kitchen and poured a glass of water. Her hand shook, just slightly. She set the glass down hard.

  *He wants me to suffer,* she thought. *He wants me to feel bad.*

  Why should she? She hadn't struck him. She hadn't lied. She had simply refused to enter the emotional transaction he was offering. He wanted guilt; she offered explanation. He wanted resentment; she offered understanding. It was the mature position. It was the only position that didn't multiply the pain.

  Yet, as she stood in the silence of her kitchen, she realized she was angry at him. Not for the accident. Not for the boat. She was angry that he had demanded something from her. He had demanded that she be vulnerable, that she admit she could be wrong in a way that mattered, that she could be *blamed*. He had tried to drag her down into the mud of human accountability, where things aren't just caused, but *done*.

  She hated him for it. She hated his righteousness, his raw, unprocessed need for her to be the villain so he could be the righteous brother. It was messy. It was inefficient. It was intolerable.

  ***

  She went back to the tower the next night. She told the coordinator she needed the hours. She needed the static.

  The room was cold. The green sweep of the radar was the only movement. She put the headphones on. She opened the logbook. The page from Tuesday was still there. *02:15. Interference. Probable false alarm.*

  She looked at the handwriting. It was neat. Controlled.

  A voice crackled over the speaker. It was a routine check-in from a lobsterman down the coast. *"All clear at Buoy Four. Wind dying down."*

  Elara's hand hovered over the pen. She waited for the usual detachment, the sense that she was merely a conduit for information. But the memory of Thomas's face surfaced. The gray skin. The demand. *You chose.*

  She picked up the pen. She looked at the previous entry. She could add a note. *Correction.* She could log the distress call retroactively. She could admit the assessment was wrong.

  If she did that, she would be opening herself up. She would be confirming Thomas's narrative. She would be accepting the blame. She would be entering the participant stance, acknowledging that she owed something to the man on the boat, that she was accountable to him not just as a functionary, but as a moral agent. She would be saying, *I failed you.*

  If she didn't, the book remained clean. The logic held. The causes remained distinct from the actions. She remained safe.

  The radio crackled again. *"Station One, do you copy?"*

  Elara pressed the transmit button. She opened her mouth to speak. She felt the heat in her chest again, that same sticky residue from the hallway. It felt like shame, but it also felt like rage. Rage at the man for making her feel it. Rage at herself for feeling it.

  "Station One copies," she said. Her voice was steady. It gave nothing away.

  "Log update," the voice on the other end said. "We're reviewing the Tuesday incident. Coast Guard wants the raw audio."

  Elara looked at the logbook. She looked at the pen.

  "Understood," she said.

  She didn't hang up. She kept the channel open. The static rushed in, the sound of the ocean pulled up into the wires. It was neutral. It didn't want anything. But she did. She wanted the silence to stay silent. She wanted the book to stay clean. She wanted to be the one who understood, not the one who was judged.

  She reached out and turned off the microphone. She left the channel open to receive, but she muted her own voice. She sat back in the chair. She would send the audio. She had to. But she wouldn't speak. She wouldn't explain. She wouldn't apologize. She would let the data stand on its own.

  Was that accountability? Or was it just another form of management?

  She watched the green line sweep around the circle. It passed over the blank space where the *Kestrel* had been. It passed over the town where Thomas was walking. It passed over her.

  Elara closed her eyes. She waited for the calm to return. She waited for the understanding to dissolve the demand. But the heat in her chest remained, a small, hard coal of something she couldn't quite explain away. It burned. It didn't want to be managed. It wanted to be answered.

  She kept her eyes closed. She didn't write anything in the book. She just sat there, listening to the static, waiting to see if she was the one holding the pen, or if the pen was holding her.

  ***

  **Note for TA**

  **Mapping:**
  1.  **The Radio Decision (Omission):** Elara classifies the distress call as "noise" based on probability. This illustrates the **objective stance**: she treats the caller as a phenomenon to be explained (panic, interference) rather than a person making a demand. She avoids vulnerability by refusing accountability.
  2.  **The Confrontation (Refusal):** Thomas refuses Elara's explanations. He demands blame ("You chose"). This forces the **participant stance**: he insists she is a moral agent who owes him an answer, not just a causal link in a chain of events. Elara finds his anger "intolerable" because it threatens her protective detachment.
  3.  **The Ending (Ambivalence):** Elara feels "heat" (resentment/guilt) but mutes her microphone. She complies technically but refuses the moral engagement. The reactive attitude breaks through (she feels anger/shame) but she attempts to suppress it again.

  **Risk Flag:**
  The story risks painting the objective stance as purely villainous/negligent. Strawson argues the objective stance is necessary for sanity and compassion (e.g., with children or the ill). Elara's use of it is selfish, but students might miss that the stance itself isn't inherently wrong, only its use as a "general policy" to avoid human relationships. Ensure discussion highlights that her failure is the *exclusion* of the participant stance, not the use of the objective one per se.
