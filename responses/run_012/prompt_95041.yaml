answer: |-
  ### Desiderata for a Theory of AI Takeoff Speed

  The following criteria are divided into **Genuine Obligations** (constraints imposed by logic, history, or physics that any theory must respect) and **Conditional Commitments** (requirements defensible only relative to the stated regulatory purpose or specific empirical bets). Where a requirement is often used by one camp to exclude the other unfairly, it is marked as a **Camp Commitment Dressed as Obligation**.

  #### I. Empirical and Historical Anchors

  **1. The Narrow Self-Improver Constraint**
  *   **Requirement:** The theory must explain why decades of recursive self-improvement in narrow domains (compiler optimization, theorem proving, chess engines) have yielded local S-curves rather than global explosions.
  *   **Case:** A compiler that rewrites its own heuristics.
  *   **Rationale:** If RSI automatically produces exponential capability gain, it should have happened already in constrained environments.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models that treat RSI as a sufficient condition for explosive growth without specifying domain-generality thresholds.

  **2. The Productivity Paradox Consistency**
  *   **Requirement:** The theory must account for the flatness of measured productivity growth in IT-intensive economies since the mid-2000s despite massive capital investment.
  *   **Case:** Macro-economic data from US/EU tech sectors.
  *   **Rationale:** A theory predicting that AI investment linearly translates to speed-of-work gains contradicts recent economic history.
  *   **Status:** **Genuine Obligation** (with a caveat: one may argue AGI is qualitatively different from prior IT, but the burden of proof is on the discontinuity).
  *   **Camp Cut:** Cuts against **Fast Takeoff** models that assume capital/compute input maps directly to economic output speed.

  **3. The Researcher Burden Constraint**
  *   **Requirement:** The theory must incorporate the finding that sustaining constant progress rates in hard tech (semiconductors, pharma) requires exponentially increasing numbers of researchers.
  *   **Case:** Moore's Law maintenance costs.
  *   **Rationale:** If low-hanging fruit runs out in chips, it likely runs out in AI architecture search too.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models assuming algorithmic discoveries become easier as AI gets smarter.

  #### II. Structural and Conceptual Distinctions

  **4. The Physical Bottleneck Separation**
  *   **Requirement:** The theory must explicitly model the timescale of processes required to instantiate capability (fabrication, energy grid expansion, wet-lab verification) separately from the timescale of algorithmic insight.
  *   **Case:** A model designs a better chip but cannot build it faster than TSMC's lead time.
  *   **Rationale:** Intelligence without instantiation has no physical leverage.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models relying on "speed of thought" scenarios where digital entities dominate physical infrastructure immediately.

  **5. The Capability vs. Displacement Distinction**
  *   **Requirement:** The theory must distinguish between a system that *can* perform a task and one that can perform it cheaply, reliably, and legally enough to displace the human incumbent.
  *   **Case:** A robot that can fold laundry but costs $500 per load.
  *   **Rationale:** Regulatory risk depends on adoption speed, not just technical feasibility.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models that equate technical benchmark success with immediate economic domination.

  **6. The Intelligence Bundle Constraint**
  *   **Requirement:** The theory must not treat intelligence as a single scalar. It must specify which sub-capabilities (coding, strategy, social manipulation) drive the takeoff and whether they scale in lockstep.
  *   **Case:** A system with superhuman coding but subhuman negotiation skills.
  *   **Rationale:** Bottlenecks in one bundle component can stall overall progress even if others explode.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models relying on a unitary "IQ" metric that scales uniformly.

  **7. The Idle Compute Representation**
  *   **Requirement:** The theory must be able to represent a large stock of idle compute being switched on without asserting that this automatically implies an algorithmic capability jump.
  *   **Case:** A datacenter held in reserve running existing models at higher throughput.
  *   **Rationale:** Scaling inference is not the same as scaling training or capability.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models that conflate compute overhangs with capability overhangs.

  **8. The No-New-Data Limit**
  *   **Requirement:** The theory must specify the limit of improvement possible without new external data, compute, or experimental feedback.
  *   **Case:** A system disconnected from the internet asked to improve itself.
  *   **Rationale:** Pure "thinking" has diminishing returns without empirical grounding.
  *   **Status:** **Genuine Obligation.**
  *   **Camp Cut:** Cuts against **Fast Takeoff** models assuming an AI can bootstrap to superintelligence in a sandbox.

  #### III. Regulatory and Practical Utility

  **9. The Intervention Sensitivity Requirement**
  *   **Requirement:** The theory must identify specific leverage points (compute thresholds, data access, energy) where an intervention would delay capability gain rather than merely displacing it geographically.
  *   **Case:** A compute threshold that actually slows training vs. one that just moves it to another jurisdiction.
  *   **Rationale:** This is the stated practical purpose of the theory.
  *   **Status:** **Conditional Commitment** (Defensible only relative to the regulatory purpose).
  *   **Camp Cut:** Cuts against **Abstract/Philosophical** theories that offer no actionable variables.

  **10. The Deployment Lag Factor**
  *   **Requirement:** The theory must separate the speed of capability gain from the speed of deployment and both from the speed of real-world consequence.
  *   **Case:** Model weights leak (instant capability) vs. integration into supply chains (slow consequence).
  *   **Rationale:** Regulators need to know which clock they are racing.
  *   **Status:** **Conditional Commitment** (Defensible only relative to the regulatory purpose).
  *   **Camp Cut:** Cuts against **Fast Takeoff** models that collapse these three timelines into one.

  **11. The Continuity Assumption**
  *   **Requirement:** The theory must default to continuous growth curves unless a specific mechanism for discontinuity is provided.
  *   **Case:** Predicting the next year's capability based on the last five years.
  *   **Rationale:** Extraordinary claims require extraordinary mechanisms.
  *   **Status:** **Camp Commitment Dressed as Obligation.** (Slow-takeoff proponents often insist on continuity as a baseline; Fast-takeoff proponents insist discontinuity is the default for cognitive systems).
  *   **Camp Cut:** Cuts against **Fast Takeoff** models (by raising the bar for proving discontinuity).

  ---

  ### Incompatible Subsets and Conflicts

  There is a fundamental tension between **Requirement 2 (Productivity Paradox)** and **Requirement 9 (Intervention Sensitivity for Fast Risks)**.

  *   **The Conflict:** If you strictly adhere to the Productivity Paradox and Researcher Burden constraints (Requirements 2 & 3), you are forced toward a model where progress is hard, expensive, and slow to translate into economic value. This makes it difficult to construct a theory where a regulatory intervention in the *next few years* is urgent due to imminent explosive risk. Conversely, if you construct a theory sensitive enough to justify immediate, drastic intervention (Requirement 9), you usually have to posit a discontinuity that violates the historical trends of Requirements 2 and 3.
  *   **The Trade-off:** You cannot simultaneously hold that "AI follows historical IT productivity dynamics" and "AI poses an imminent, unique catastrophe requiring emergency brakes." One of these empirical premises must yield.

  A second tension exists between **Requirement 6 (Intelligence Bundle)** and **Requirement 11 (Continuity Assumption)**.
  *   **The Conflict:** If intelligence is a bundle, different components scale at different rates. This inherently produces jagged, uneven progress profiles. Insisting on a smooth continuity assumption (Requirement 11) obscures the bottlenecks inherent in the Bundle Constraint (Requirement 6).

  ### The "Most Work" Requirement

  **Requirement 4 (The Physical Bottleneck Separation)** does the most work in ruling out candidate theories.

  *   **Why:** It is the hardest constraint. Many theories of fast takeoff rely on the idea that once an AI is smart enough, it can manipulate the world instantly (via hacking, finance, or persuasion). Requirement 4 forces the theory to account for the speed of atoms, not just bits. It rules out any scenario where the time from "superintelligence achieved" to "world domination" is shorter than the time required to build new servers, power plants, or robotic actuators. It forces the "takeoff" to be tethered to industrial capacity, which is historically slow to scale.

  ### Camp Cuts Summary

  *   **Fast Takeoff (FOOM):** Cut primarily by Requirements 1, 2, 3, 4, and 8. These require explaining away historical stagnation in RSI, economic friction, and physical limits.
  *   **Slow Takeoff:** Cut primarily by Requirement 7 and 9. If a theory implies progress is *too* dependent on slow hardware scaling, it cannot account for the risk of idle compute being switched on (Requirement 7) or the need for urgent intervention (Requirement 9).
  *   **Abstract/Philosophical:** Cut by Requirement 9. If the theory doesn't name a lever a regulator can pull, it fails the practical purpose.

  ### What Would Change My Mind

  **1. Dropping Requirement 2 (Productivity Paradox):**
  If it were demonstrated that the productivity paradox was solely a measurement error (e.g., GDP fails to capture digital value) rather than a real friction in converting tech to output, I would drop Requirement 2. This would open the door for theories where AI capability translates to power much faster than historical IT did.

  **2. Dropping Requirement 4 (Physical Bottlenecks):**
  If evidence emerged that high-level AI could achieve decisive strategic advantage *purely* through digital means (e.g., cryptographic breaks, financial market manipulation) without needing to expand physical infrastructure, Requirement 4 would become less critical. This would validate "speed of thought" takeoff scenarios.

  **3. Where Reasoning Might Fail:**
  The reasoning here assumes **stationarity**—that the future will resemble the past regarding friction and bottlenecks. This is the weakest link. If AI is a "universal technology" that fundamentally alters the cost of research and development itself (making Requirement 3 obsolete), then anchoring to historical researcher burden is a category error. The list is most vulnerable to the claim that AI is not just another technology, but a technology that changes the rules of technological progress. If that is true, the historical anchors (Requirements 1, 2, 3) may be misleading rather than constraining.
