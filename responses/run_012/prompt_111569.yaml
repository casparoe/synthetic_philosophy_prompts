      *   *Wait, one more check:* Is there a term that covers *all three*? "Money Pump Vulnerability" covers the exploitability. "Cyclic Choice" covers the outcome. But the *rationality status* differs. I need to be clear that no single normative term covers all three as "irrational" equally.

