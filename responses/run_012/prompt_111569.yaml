answer: |-
  You have spotted a genuine and significant distinction in decision theory. Your intuition is correct: the three cases look the same from the outside (a cycle of trades resulting in a loss), but they rely on fundamentally different internal structures. There is no single term that covers all three as a unified category of *irrationality*, because standard decision theory treats them differently.

  Here is the carving you are looking for, broken down by the specific concepts, terms, and normative status of each friend.

  ### 1. The First Friend: Synchronic Intransitivity
  **The Term:** **The Money Pump Argument** (specifically, a *Synchronic Money Pump*).
  **The Structure:** **Intransitive Preferences.**

  In standard rational choice theory (specifically Von Neumann-Morgenstern utility theory), preferences must be **transitive**. If you prefer $A$ to $B$, and $B$ to $C$, you must prefer $A$ to $C$.
  *   Your first friend violates this at a single moment in time ($t$). At time $t$, she holds $A \succ B$, $B \succ C$, and $C \succ A$ simultaneously.
  *   **Rationality Verdict:** She is strictly **irrational** by the lights of standard decision theory. Her preferences are logically inconsistent, much like believing $X > Y$, $Y > Z$, and $Z > X$ all at once.
  *   **The Exploit:** Because the inconsistency exists *now*, a trader can pump her for money immediately without waiting. She is paying to satisfy contradictory desires.

  ### 2. The Second Friend: Diachronic Instability
  **The Term:** **Diachronic Preference Drift** (or *Dynamic Inconsistency* via preference change).
  **The Structure:** **Stable at $t$, Unstable across $t$.**

  This friend does not violate transitivity. At time $t_1$, she prefers $A \succ B$. At time $t_2$, she prefers $B \succ C$. At time $t_3$, she prefers $C \succ A$.
  *   At any single snapshot, her logic is perfect. The cycle only emerges when you stitch together snapshots from different times.
  *   **Rationality Verdict:** This is **contested**. Standard decision theory usually assumes preferences are stable exogenous data. If her tastes change due to external factors (maturing, new information, mood), she is not necessarily *irrational*; she is merely **unstable**.
  *   **The Exploit:** This is a **Diachronic Money Pump**. The trader must wait between trades. The exploitation relies on the passage of time, not a logical contradiction at a single moment.
  *   **Why it differs from Case 1:** In Case 1, the agent is fighting herself *now*. In Case 2, the agent at $t_1$ is not fighting the agent at $t_1$; she is fighting her future self at $t_3$. Many philosophers argue this makes her **rationally permissible** but **pragmatically vulnerable**.

  ### 3. The Third Friend: Dynamic Inconsistency & Metapreferences
  **The Term:** **Dynamic Inconsistency** (specifically, *Naive* vs. *Sophisticated* choice).
  **The Structure:** **Awareness of Drift.**

  This adds a layer of self-knowledge. She knows her preferences will drift and that the cycle will result in a net loss (regret).
  *   **The Concept:** This touches on **Metapreferences** (preferences about preferences). She has a "global" preference (don't lose money in a cycle) that conflicts with her "local" preferences (swap now for the immediate thrill).
  *   **Rationality Verdict:** If she knows she will regret the cycle but enters it anyway, she is exhibiting **Akrasia** (weakness of will). In decision theory terms, she is failing **Dynamic Consistency**. A dynamically consistent agent makes a plan at $t_1$ that her future self at $t_2$ and $t_3$ will still want to follow. She is dynamically inconsistent.
  *   **Sophistication:** If she *knows* her future self will defect from the plan, she is a **Sophisticated** agent (as opposed to a **Naive** agent who thinks her future tastes will match her current ones). However, a sophisticated agent usually seeks **Pre-commitment** (binding herself to stop the cycle). If she sees the drift coming and does *not* pre-commit, she is voluntarily accepting the money pump.

  ### The Carving: Synchronic vs. Diachronic Rationality

  You asked for the carving rather than just the label. The distinction lies in the dimension of time.

  1.  **Synchronic Rationality (Case 1):**
      *   **Question:** Are your preferences logically consistent *right now*?
      *   **Violation:** Intransitivity.
      *   **Status:** Universally regarded as a defect in reasoning.

  2.  **Diachronic Rationality (Cases 2 & 3):**
      *   **Question:** Are your plans consistent *over time*?
      *   **Violation:** Dynamic Inconsistency.
      *   **Status:** Nuanced.
          *   If preferences change due to **learning** (e.g., you thought you liked spicy food, now you don't), the drift is rational.
          *   If preferences change due to **manipulation** or **impulse** (Case 3), it is often viewed as a defect in agency.

  ### Does one term cover all three?

  **No.** There is no single established term that categorizes all three as the *same kind of error*.

  *   **Case 1** is a **Logic Error** (Intransitivity).
  *   **Case 2** is a **Stability Error** (Preference Drift).
  *   **Case 3** is an **Agency Error** (Akrasia / Failure of Pre-commitment).

  However, there is a phrase that describes the *outcome* for all three: **Money Pump Vulnerability**.

  If you need a term to describe the *structure of the exploitation* across all three, you can call it a **Cyclic Exploitation**. But be careful: in academic writing, "Money Pump" without qualification almost always implies Case 1 (Synchronic Intransitivity). Using it for Case 2 requires the qualifier "Diachronic."

  ### Summary for your reading

  *   **Friend 1** violates the **Transitivity Axiom**. She is **Synchronically Irrational**.
  *   **Friend 2** violates **Preference Stability**. She is **Diachronically Vulnerable** (but not necessarily irrational).
  *   **Friend 3** violates **Dynamic Consistency**. She is **Dynamically Irrational** (specifically, she is an **Akratic Sophisticate**).

  **Recommendation for further reading:**
  Look up the **Money Pump Argument** (for Case 1), **Hyperbolic Discounting** (a specific mathematical model of Case 2/3), and **Resolute Choice** (Edward McClennen's work on how to handle Case 3). You have correctly identified the boundary between static and dynamic decision theory, which is where a lot of modern philosophical work is happening.
