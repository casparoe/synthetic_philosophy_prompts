      *   *Wait, re-reading Case 3:* "she sees the drift coming, knows she will regret it, and goes along with it anyway." This implies she makes the trade *knowing* it leads to a cycle. This is effectively **Succumbing to the Money Pump** despite foresight. This is strong evidence of irrationality in the dynamic sense.

