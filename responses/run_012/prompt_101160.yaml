answer: |-
  This is an exceptional question, and your intuition is strong. In fact, your position aligns with a very prominent view in bioethics often associated with the philosopher Ronald Dworkin. He argued that **precedent autonomy** (the past self's decisions) should generally trump current interests because a life has a narrative integrity that the competent author should control.

  However, Ethics Bowl rewards teams that can recognize the strength of the *opposing* argument, not just the strength of their own. Your teammates are pushing back because the "Promise/Competence" model, while logical, might be too rigid for the messy reality of personhood and suffering.

  Here is a breakdown of why the "Promise" model might be insufficient, why the "Later Self" has moral standing, and how to navigate the specific nuances you asked about.

  ### 1. Is an Advance Directive a Promise?
  You argue that the directive is a promise, and promises are binding. This is a powerful contractual view. However, ethicists point out two problems with applying standard promise-keeping here:

  *   **The Identity Problem:** Promises are usually made between two distinct people. If I promise to pay you $10, I owe *you*. But in an advance directive, the "promisor" (Past Mr. Ellery) and the "promisee" (who is owed the obligation?) are arguably the same person. If dementia alters personality, memory, and values so significantly that Past Mr. Ellery and Present Mr. Ellery are psychologically discontinuous (a view explored by philosopher Derek Parfit), is Past Mr. Ellery making a promise *to himself*, or is he making a demand on a *different person* who happens to inhabit his body? If they are psychologically different people, the binding nature of the "promise" weakens.
  *   **The Circumstance Problem:** Promises are often voided if circumstances change fundamentally in unforeseen ways. Past Mr. Ellery refused treatment based on a *prediction* of suffering ("I do not want to live through the later stages"). But Present Mr. Ellery is "not miserable." If the condition the promise was meant to prevent (misery) is not present, does the promise still hold?

  **For the Bowl:** You can argue the directive *is* a promise to society/doctors to respect his wishes, not just to himself. But you must acknowledge the counter: that a promise based on a false prediction of suffering might not be binding.

  ### 2. Critical Interests vs. Experiential Interests
  This is the most important conceptual tool for this case (derived from Ronald Dworkin).
  *   **Critical Interests:** These are values that make a life good *overall*, based on a coherent narrative (e.g., "I value independence and dignity above mere biological existence"). This is what the Advance Directive protects.
  *   **Experiential Interests:** These are immediate states of well-being (e.g., "I am hungry," "I am in pain," "I want to live today"). This is what Present Mr. Ellery is expressing.

  **The Conflict:** Your argument prioritizes *Critical Interests*. Your teammates are prioritizing *Experiential Interests*.
  If you honor the directive, you respect the narrative integrity of his life, but you may harm the *current* experiencing being (by letting him die when he wants to live). If you honor the request, you protect the current being from distress, but you violate the life narrative the competent man constructed.

  **Why "Competent" is doing too much work:**
  Your teammates are suggesting that legal competence is a binary switch, but moral standing is not. Even if Present Mr. Ellery lacks the *capacity* to understand the long-term trajectory of Alzheimer's, he has the capacity to feel fear of death and a desire for life *now*. Ignoring a calm, repeated request from a sentient being causes distress. In ethics, causing distress to a vulnerable person requires a very high justification. Simply saying "he isn't competent" might dismiss the moral weight of his current suffering.

  ### 3. Is the Later Request Evidence that the Earlier Self Was Wrong?
  You asked if his calmness counts as evidence that the earlier self was wrong. **Yes, this is a crucial epistemic point.**

  Past Mr. Ellery made a decision based on **anticipatory fear**. He imagined a state of existence that he found repugnant. However, humans are remarkably adaptive. This is known as the **Disability Paradox**: healthy people often rate the quality of life of disabled people much lower than disabled people rate it themselves.

  *   **The Argument:** Past Mr. Ellery was speculating about a future he could not fully imagine. Present Mr. Ellery is living the reality. His request to live suggests that, contrary to the prediction, life *is* worth living for him right now.
  *   **The Counter-Argument:** Present Mr. Ellery suffers from anosognosia (lack of insight). He doesn't understand that "living" means more years of decline. His desire is based on a partial understanding.

  **For the Bowl:** If you argue for the directive, you must explain why the *competent prediction* outweighs the *incompetent experience*. If you argue for treatment, you can argue that the directive was based on a factual error about his future quality of life.

  ### 4. Written Directive vs. Verbal Statement
  Does it matter if he wrote it down or just said it?
  *   **Legally:** Yes, written is stronger.
  *   **Ethically:** It matters less, but it speaks to **deliberation**. A signed document suggests he took time to reflect, perhaps with a lawyer or doctor. A casual comment to family might have been offhand.
  *   **However:** A written document cannot capture nuance. If he had told his family, "I don't want to live if I'm suffering and don't know who I am," and now he is *not* suffering and *does* recognize some people, the verbal nuance might actually support treatment *more* than a rigid written form.

  In this specific case, since he *did* write a statement explaining his reasoning ("did not want to live through the later stages"), the weight of the Past Self is heavier. But the ethical tension remains: Is his current stage the "later stages" he feared, or is it a manageable middle stage he didn't account for?

  ### 5. How to Settle It (Without a Simple Rule)
  You asked for a simpler way to settle it. In Ethics Bowl, the "settlement" is usually a recommendation for a *process* rather than a hard edict. Here is how you might synthesize this:

  **Option A: The Strict Autonomy View (Your current stance)**
  *   **Reasoning:** Autonomy is the right to control one's life narrative. Without binding directives, the competent lose the power to protect their future values.
  *   **Risk:** It treats the current patient as a vessel, potentially causing them distress and death against their current will.

  **Option B: The Best Interest/Beneficence View**
  *   **Reasoning:** The primary duty of care is to the person in the bed. If he is not miserable and wants to live, treatment prevents harm (death) and respects current assent.
  *   **Risk:** It undermines the institution of advance directives, causing anxiety for others planning their own end-of-life care.

  **Option C: The "Concordance" Approach (A Potential Middle Ground)**
  *   Many ethicists suggest looking for **concordance**. Is there a way to respect the *spirit* of the directive without ignoring the current self?
  *   *Example:* Treat the pneumonia (antibiotics are low-burden), but do not intubate or use CPR if he arrests later. Antibiotics might be seen as "comfort care" (relieving the distress of pneumonia) rather than "life-prolonging" in the grand sense.
  *   *Reasoning:* This acknowledges the current self's desire to not die of infection *now*, without committing to indefinite life support that the past self feared. It treats the directive as a guide to *values* (avoiding prolonged decline) rather than a rigid list of *procedures* (no antibiotics ever).

  ### Summary for Your Preparation
  Your reasoning is not "wrong," but it is incomplete because it treats the Past Self as the only moral agent. To win points in Ethics Bowl, you should:

  1.  **Steel-man the opposition:** Acknowledge that the "Present Self" is not just noise; he is a sentient being with interests that are being violated.
  2.  **Refine the "Promise":** Argue that the directive is less a promise and more a **protection of values**. The question is: Do his values actually *change*, or does his *capacity to articulate them* change? (You can argue his core value of "dignity" remains, even if his current request contradicts it).
  3.  **Address the Prediction Error:** Concede that Past Mr. Ellery might have been wrong about how bad it would feel. But argue that we generally allow people to make "wrong" decisions about their own lives (e.g., refusing a blood transfusion for religious reasons) because we respect their authority over their own risk assessment.
  4.  **Distinguish Treatment Types:** Consider if antibiotics are truly "life-prolonging" in the sense he feared, or if they are basic care. This shows nuance.

  **The "Simple Answer" you are looking for:**
  There isn't one. The tension exists because we value two different things: **Integrity** (staying true to who we were) and **Well-being** (protecting who we are). Your job in the tournament is not to prove one side is silent, but to explain why, in *this specific case*, one value should outweigh the other.

  If you stick with the directive, argue that **Integrity** is the higher value because without it, we lose the ability to shape our own deaths. If you switch to treatment, argue that **Well-being** is the higher value because ethics must serve the living, breathing human in front of us, not the ghost of who they used to be.
