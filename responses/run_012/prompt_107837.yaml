      *   *Hope Nobody Asks:* "Does this imply we should never build highways?" (The practical reductio of the risk claim).

  6.  **Drafting the Content (incorporating specific voices):**
      *   *Kantian:* "Respect for persons," "Ends in themselves," "Formalism."
      *   *Formalist:* "Continuity," "Representation theorem," "Expected utility."
