answer: |-
  # Q&A Strategy Sheet: Two-Tier Axiology & Aggregation

  **Audience Profile:** 50% Kantian/Constructivist (suspicious of aggregation), 50% Formal/Empirical (DT, Econ, Game Theory), plus Historian & Medical Ethicist.
  **Core Vulnerability:** The claim that probability does not matter for agency-destroying harms.
  **Goal:** Survive the risk objection without collapsing into standard utilitarianism; satisfy Kantians that you aren't smuggling aggregation in; satisfy Formalists that you know what axioms you're breaking.

  ---

  ### I. Pre-emptive Concessions (First 5 Minutes)
  *Do not wait for these to be raised. Embed them in your opening remarks or early transitions to show intellectual honesty and save time for the core argument.*

  1.  **To the Formalists:** "I am aware that introducing a lexical threshold with discontinuous risk sensitivity violates the Continuity Axiom of standard Expected Utility Theory. I am not offering a representation theorem today; I am offering a substantive ethical argument for why continuity should be rejected in this specific domain."
  2.  **To the Kantians/Historian:** "My conception of 'agency' is not fully fleshed out here. I am relying on a functional capacity to form and pursue a life plan, not a metaphysical account of autonomy. I concede this needs more work to avoid arbitrariness."
  3.  **To Everyone:** "The threshold between 'agency-destroying' and 'mere harm' is necessarily vague. I am not claiming a sharp line exists in nature, but that a normative distinction is required to avoid the absurdity of pure aggregation."

  ---

  ### II. Objection Queue (Ordered by Likelihood & Damage)

  #### 1. The Risk/Probability Objection (The Killer)
  **Likelihood:** Certain. **Damage:** Fatal if not handled. **Consensus Danger:** ⚠️ **YES** (Formalists & Kantians agree this is the weak point).

  *   **The Decision Theorist/Economist:** "You claim probability doesn't matter for agency-destroying harms. This violates the Continuity Axiom. If I impose a $10^{-9}$ risk of agency destruction on everyone to save a minor inconvenience, your view forbids it. This implies we cannot build roads, run hospitals, or engage in modern industry. Your lexical tier makes normal social life impossible."
  *   **The Kantian:** "You say we cannot trade agency for convenience. But if the risk is negligible, is it really a failure of respect? By making the constraint absolute regardless of probability, you aren't protecting persons; you're fetishizing a rule. Surely a Kantian can accept a *de minimis* risk if it respects the rational agency of all in the long run?"

  *   **Two-Minute Reply:**
      "I distinguish between *imposing a risk* and *imposing a harm*. The lexical tier triggers when an act treats an agency-destroying outcome as *tradable*. If I build a road, I am not saying 'this person's agency is worth 1 million commutes.' I am saying 'we all accept a shared background risk to enable agency for all.' My view forbids *targeted* trade-offs where specific individuals bear the risk for others' convenience. However, I concede that for systemic risks necessary for general agency (like infrastructure), the 'agency-destroying' label might shift if the alternative is the collapse of the conditions for agency itself. I am not an absolutist on risk; I am an absolutist on *commensurability*. Once you put agency on the scale, you've already lost the person."

  *   **Candid Note on Softness:**
      This is your softest spot. The distinction between "targeted" and "systemic" risk is under-theorized in your paper. If pressed on the math of "shared background risk," you will look like you're smuggling expected utility back in. **Do not** try to formalize this on the fly. Stick to the normative claim: *Trading* is the error, not the *outcome*.

  #### 2. The "Utilitarian Remainder" Objection
  **Likelihood:** High. **Damage:** Medium. **Consensus Danger:** No (Kantians only).

  *   **The Kantian:** "You say numbers count below the threshold. So if I torture one person (below threshold) or prick a billion fingers, you aggregate. But if harms below the threshold can sum to destroy agency eventually, haven't you just moved the goalposts? You haven't blocked aggregation; you've just set a high ceiling for it. You are still a consequentialist about 90% of moral life."

  *   **Two-Minute Reply:**
      "I am not trying to be a pure deontologist. I am trying to solve the Repugnant Conclusion/Torture vs. Dust Specks puzzle. That puzzle arises because we think *any* quantity of small harms can outweigh a catastrophic harm. My view blocks the *lexical* collapse. Yes, aggregation works for minor harms. But the moral catastrophe occurs when we think the *kind* of harm doesn't matter. By securing the lexical priority of agency, I protect the *status* of the person, even if I allow utilitarian calculus for trivialities. The point isn't to eliminate aggregation, but to prevent it from swallowing the agent."

  *   **Candid Note on Softness:**
      Hardline Kantians will not be satisfied. They want aggregation blocked entirely. You are betting that the "moderate" Kantians will accept this as a pragmatic compromise. Don't argue that aggregation is *good* below the threshold; argue it is *unavoidable* and harmless there.

  #### 3. The Sorites/Threshold Objection
  **Likelihood:** High. **Damage:** Medium. **Consensus Danger:** ⚠️ **YES** (Medical Ethicist & Formalists).

  *   **The Medical Ethicist:** "Where is the line? Chronic pain doesn't destroy agency immediately, but over 20 years it erodes it. Is year 19 lexical and year 20 not? If you can't define the threshold, your view isn't action-guiding for clinicians."
  *   **The Decision Theorist:** "A discontinuous value function is unworkable for optimization. If the threshold is vague, the model is broken. How do you maximize social welfare if the function jumps infinitely at an undefined point?"

  *   **Two-Minute Reply:**
      "Vagueness does not entail non-existence. 'Bald' is vague, but there is a difference between a full head of hair and a bald head. In clinical practice, we already make these judgments (e.g., capacity assessments). My view doesn't need a precise number; it needs a qualitative distinction. For the formalist: I am not offering an optimization function for a machine. I am offering a constraint on human reasoning. We accept vague constraints in law (e.g., 'beyond reasonable doubt') because the alternative—precision without moral sense—is worse."

  *   **Candid Note on Softness:**
      This is standard for lexical views. The Medical Ethicist will keep pushing for cases. **Strategy:** Deflect to specific cases only if you are sure. Otherwise, reiterate that "agency destruction" is a functional category (loss of ability to revise life plans), not just pain intensity.

  #### 4. The "Category Error" Objection
  **Likelihood:** Medium. **Damage:** Low/Medium. **Consensus Danger:** No (Formalists only).

  *   **The Decision Theorist:** "You call it a 'category error' to compare agony to annoyance. But in revealed preference theory, if an agent accepts the trade, the preference exists. You are imposing an external 'rationality' on agents who might willingly trade agency for relief. Who are you to say their trade is invalid?"

  *   **Two-Minute Reply:**
      "Revealed preference assumes the agent exists to do the revealing. An agency-destroying harm removes the entity that holds the preferences. You cannot validly consent to the destruction of the capacity to consent. It is not that the agent *wouldn't* trade; it is that the trade consumes the trader. My view protects the *condition of possibility* for preference satisfaction, not the satisfaction itself."

  *   **Candid Note on Softness:**
      Formalists hate "conditions of possibility" arguments; they sound metaphysical. Keep it functional: "No agent, no preferences."

  #### 5. The Conception of the Person
  **Likelihood:** Medium. **Damage:** Low. **Consensus Danger:** No (Historian/Kantian).

  *   **The Historian of Philosophy:** "Your 'agency' sounds like Rawlsian moral power or Kantian autonomy. But you treat it as a threshold capacity. Does this exclude those with cognitive disabilities? If agency is the threshold for lexical protection, do non-agents fall into the additive tier?"

  *   **Two-Minute Reply:**
      "This is the most serious extension of the view. I am arguing for the protection of *potential* or *developed* agency. For those who lack the capacity, the protection derives from their status as beings *for whom* agency is a good, or from the social relations that sustain them. I concede my paper focuses on the paradigmatic case of the adult agent, but the view must extend to vulnerable populations via a guardianship model, not an additive one."

  *   **Candid Note on Softness:**
      This is a known weakness of agency-based views. Do not overpromise. Admit this is the next stage of the research.

  ---

  ### III. The "Hope Nobody Asks" Question
  **Question:** "If probability doesn't matter, does your view forbid vaccination? Vaccines carry a non-zero risk of severe neurological damage (agency destruction) to save the population from minor illness (dust specks) or even death (which you might classify as agency-destroying, but what if the risk is to the few for the safety of the many?)."

  *   **Why it hurts:** It forces you to apply your "probability doesn't matter" claim to a public good case where intuition strongly opposes you. If you say "Yes, forbid," you look absurd. If you say "No, allow," you admit probability *does* matter, collapsing the lexical tier.
  *   **Prepared Deflection:** "Vaccination prevents agency destruction (death/disease) in the population. It is not a trade of agency for convenience; it is a trade of *risk* of agency destruction for *security* of agency. My view prohibits trading agency for *inconvenience*. Public health is not an inconvenience; it is a precondition for agency. However, if a specific individual is sacrificed without consent, that remains forbidden." (This is tightrope walking; pray this doesn't come up).

  ---

  ### IV. Strategic Summary
  1.  **The Killer:** The Probability/Risk objection. If you lose this, the view is impractical. **Defense:** Distinguish between *trading* agency and *accepting background risk* for the sake of general agency conditions.
  2.  **The Consensus Danger:** Both Formalists and Kantians will agree that "Probability doesn't matter" is too strong. You must soften this without surrendering the lexical claim. **Concede** that *de minimis* risks in systemic contexts are treated differently than targeted impositions.
  3.  **The Kantian Pitch:** Emphasize that you are protecting the *status* of the person, not just minimizing pain.
  4.  **The Formalist Pitch:** Emphasize that you know you are breaking Continuity, and you have a substantive ethical reason for doing so (Incommensurability).
  5.  **Body Language:** When the Decision Theorists attack the axioms, do not get defensive. Nod, acknowledge the axiom violation, and pivot back to the *moral cost* of satisfying that axiom. When the Kantians attack the aggregation below the threshold, admit it but frame it as "saving the phenomenon" of ordinary trade-offs without losing the person.

  **Final Advice:** You cannot satisfy the Formalists' desire for a theorem and the Kantians' desire for purity simultaneously. Your goal is to show that your view is the *least bad* option for handling the Torture vs. Dust Specks intuition without paralyzing action. Own the "impurity" of the lower tier to save the "purity" of the upper tier.
