  8.  **Final Polish:** Ensure the tone is professional, strategic, and directly addresses the specific audience composition described. (Self-Correction: Make sure the distinction between the Kantian and Formalist versions of the Probability objection is clear. Kantians care about *respect*, Formalists care about *axioms*.)

