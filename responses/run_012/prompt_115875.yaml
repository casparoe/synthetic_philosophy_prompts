answer: |-
  This is a remarkably precise observation. You have identified a structural feedback loop in medical normativity that is distinct from the ecological "shifting baseline syndrome" (which is primarily epistemic/memory-based) and distinct from general "medicalization" (which is primarily categorical/expansionary).

  To answer your primary question directly: **No, there is no single, canonical term in bioethics or philosophy of medicine that captures this specific triad of phenomena under one name.**

  You have found a gap in the taxonomy. While the components are discussed separately, the unifying structure you describe—where the *intervention itself* constitutively shifts the *normative baseline* against which the intervention is justified—does not have a settled proper noun like "Shifting Baseline Syndrome."

  However, the literature does contain close approximations for each of your three instances, and a few philosophical frameworks that attempt to grapple with the whole. Below is a mapping of your cases to existing concepts, a proposal for a unifying description, and an analysis of the implications for the treatment/enhancement distinction.

  ### 1. Mapping Your Cases to Existing Literature

  **Case 1: The Distribution-Relative Baseline (The Percentile Problem)**
  *   **Existing Term:** **Positional Goods** (Fred Hirsch) or **Zero-Sum Health**.
  *   **The Literature:** In economics, a positional good is one whose value depends on how it compares to others (e.g., standing in a queue). If everyone stands on tiptoe, no one sees better, but everyone is more tired. In bioethics, this is applied to traits like height or cognitive enhancement. If "normal" is defined statistically (e.g., the 50th percentile), treating the bottom tail does not reduce the size of the tail; it merely rotates the population.
  *   **Philosophical Context:** This is a direct critique of **Christopher Boorse's Biostatistical Theory (BST)** of health. Boorse defines health as "statistical normality of species-typical function." Your Case 1 demonstrates that if medical intervention becomes widespread, "statistical normality" shifts, potentially rendering Boorse's definition unstable. If we cure all shortness, the new "statistical normal" is taller, and the untreated (genetically short) become "abnormal" by the new metric.

  **Case 2: The Threshold Revision (The Cut-Off Problem)**
  *   **Existing Term:** **Diagnostic Inflation**, **Criterion Creep**, or **Risk Factorization**.
  *   **The Literature:** This is well-documented in psychiatry (e.g., DSM revisions) and cardiology (e.g., lowering hypertension thresholds from 140/90 to 130/80). **Allen Frances** (*Saving Normal*) and **Ray Moynihan** (*Selling Sickness*) discuss this extensively. David Armstrong's concept of **"Risk Factorization"** is particularly relevant: medicine shifts from treating symptoms to managing risk profiles, allowing thresholds to be lowered indefinitely to capture more "pre-patients."
  *   **Distinction:** Unlike the ecological baseline (where we forget the past), this is often a *policy decision* driven by pharmaceutical markets or preventive logic. The baseline moves not because we forgot the old one, but because the new one is deemed "safer," thereby pathologizing the previous normal.

  **Case 3: The Correction as Requirement (The Tech-Norm Problem)**
  *   **Existing Term:** **Structural Iatrogenesis** (Ivan Illich) or **Technological Normativity**.
  *   **The Literature:** Illich argued that medicine eventually undermines the population's ability to cope without it, creating dependency. Your case is more specific: it is about the *social normalization* of the aid. Once glasses become ubiquitous, not wearing them is a deficit. This is also discussed in disability studies as the **"Social Model"** turning on itself: if the environment (including available tech) accommodates a function, lacking that function becomes a disability, even if the biological capacity was once considered "normal aging."
  *   **Philosophical Context:** This relates to **Georges Canguilhem's** *The Normal and the Pathological*. Canguilhem argued that norms are not static statistical averages but are created by the organism's interaction with its milieu. If the milieu changes (glasses become cheap), the norm changes.

  ### 2. A Proposed Unifying Term

  Since no canonical term exists, the phenomenon is often described descriptively. If you were to coin or adopt a term for this specific structure, the most accurate philosophical descriptors would be:

  **"Endogenous Normative Shift"**
  or
  **"Constitutive Baseline Drift"**

  *   **Definition:** A phenomenon in which the widespread application of a medical or technological intervention alters the statistical or social reference class such that the intervention transitions from being a *restoration* of function to a *requirement* for normality, thereby expanding the population classified as deficient.
  *   **Why "Endogenous"?** Unlike the ecological case (where the observer's memory is the variable), here the *system being measured* (the patient population) is altered by the *act of measurement/treatment* itself. The norm is internal to the practice.

  ### 3. Boundary Cases: What Resembles It But Isn't

  To sharpen the definition, it is useful to distinguish your phenomenon from near-misses:

  1.  **Genuine Scientific Discovery (Not it):** If we lower the cholesterol threshold because we discovered a new pathophysiological mechanism linking 190mg/dL to stroke risk, that is epistemic progress, not baseline drift. *Boundary:* Is the change driven by new knowledge of *nature*, or by new capacity to *intervene*?
  2.  **The Red Queen Effect (Related but distinct):** In evolutionary biology, species must constantly adapt just to maintain relative fitness. In medicine, this looks like an "arms race" against pathogens (antibiotic resistance). *Boundary:* Your cases are about *normative status* (healthy vs. sick), not just biological survival.
  3.  **Standard Medicalization (Broader):** Medicalization turns deviance into sickness (e.g., alcoholism). *Boundary:* Medicalization creates a *new* category. Your phenomenon *moves the boundary* of an existing category using the tools of the category itself.
  4.  **Ecological Shifting Baseline (The Analogue):** As you noted, this is epistemic (forgetting). *Boundary:* In your medical cases, the old baseline is often *known* but *discarded* because the intervention makes it obsolete.

  ### 4. What Follows? Implications for Treatment vs. Enhancement

  You ask whether this shows the line is *vague* (epistemic limitation) or *impossible* (ontological absence).

  This phenomenon supports the **Normativist** view of health over the **Naturalist** view.

  *   **Naturalism (e.g., Boorse, Daniels):** Health is a matter of biological function independent of social values. There is a fact of the matter about "species-typical functioning."
  *   **Normativism (e.g., Canguilhem, Nordenfelt):** Health is a capacity to achieve vital goals within a specific environment/social context.

  Your "Constitutive Baseline Drift" suggests that **Naturalism cannot hold the line.** If "species-typical functioning" changes because we medicate the population (Case 1), or if "normal capacity" changes because technology becomes environmental infrastructure (Case 3), then "treatment" (restoring natural function) inevitably bleeds into "enhancement" (creating a new function that becomes the new natural).

  **Conclusion:**
  The phenomenon does not merely show that the line is *vague* (i.e., we can't find it); it suggests the line is **dynamic and recursive**.
  1.  **Temporality:** An intervention starts as *enhancement* (or aggressive treatment), becomes *standard care*, and then becomes *necessary for normality*. Penicillin was once enhancement-level magic; now, not having access to it is a deficit.
  2.  **Pragmatism:** The distinction between treatment and enhancement is not metaphysical but **pragmatic and consensus-based**. It depends on where the baseline is *currently* anchored, not where it "naturally" belongs.

  **Recommendation for your writing:**
  If you are writing this up, you are on solid ground claiming this is an under-theorized gap. You might frame it as **"The Feedback Loop of Therapeutic Normativity."** You can credit the ecological "Shifting Baseline" as the inspiration but argue that the medical version is more pernicious because it is *constitutive* (the treatment creates the need for more treatment) rather than *perceptual* (the researchers forget the past).

  This supports the conclusion that the treatment/enhancement distinction is not a fixed boundary to be discovered, but a **regulatory horizon** that moves as we approach it. This validates the worry that medicine can become a self-justifying system where the definition of "health" shrinks to match the capacity of the industry to sell "cures."

  **Key References to Cite:**
  *   **Georges Canguilhem**, *The Normal and the Pathological* (for the fluidity of norms).
  *   **Christopher Boorse**, "Health as a Theoretical Concept" (as the Naturalist view you are challenging).
  *   **Ivan Illich**, *Medical Nemesis* (for Structural Iatrogenesis/Case 3).
  *   **Allen Frances**, *Saving Normal* (for Diagnostic Inflation/Case 2).
  *   **Fred Hirsch**, *Social Limits to Growth* (for Positional Goods/Case 1).
  *   **David Armstrong**, "The Rise of Surveillance Medicine" (for Risk Factorization).

  You have effectively synthesized a critique that spans economics, ecology, and bioethics. It is a robust philosophical contribution.
