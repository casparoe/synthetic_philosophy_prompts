answer: |-
  Your friend is describing a version of David Lewis's **Principal Principle**. In plain English: *Align your belief with the known objective chance, unless you have secret information about the outcome or reason to doubt the chance estimate itself.*

  In insurance, "objective chance" is the model output. "Secret information" is underwriter intelligence. "Reason to doubt" is model calibration history.

  Here is a 60-minute procedure to operationalize this. It forces you to separate **Model Error** (Caveat 2) from **Private Intelligence** (Caveat 1). If neither applies, you must defer to the model.

  ### The Chance Deference Protocol (CDP)
  **Time Limit:** 60 Minutes per account
  **Goal:** Determine if an override of the cat model is philosophically and actuarially justified.

  #### Step 1: The Calibration Check (15 Minutes)
  *Tests Caveat 2: Do you have reason to think the chance isn't what the model says?*

  1.  Pull the model's performance report for this specific peril/region for the last 5 years.
  2.  **Pass:** The model's predicted loss ratio is within ±15% of actuals, OR there is no significant historical bias.
      *   *Action:* Proceed to Step 2.
  3.  **Fail:** The model has a documented, systematic bias (e.g., "Undercalls wildfire in Northern CA by 40%").
      *   *Action:* **Stop.** You have proven the "chance" estimate is flawed. Apply a calibrated loading factor to correct the bias. Do not use "gut." Use the historical correction factor.
      *   *Escalation:* If the correction factor exceeds 50%, Chief Underwriter (CU) must sign off on the loading factor.

  #### Step 2: The Intelligence Audit (20 Minutes)
  *Tests Caveat 1: Do you know something the model cannot see?*

  1.  Write down every reason your gut differs from the model.
  2.  Categorize each reason as **Structural** or **Statistical**.
      *   **Structural (Admissible):** Physical facts the model cannot ingest (e.g., "Levee maintenance was skipped this year," "New fuel break built," "Occupancy changed to hazardous storage").
      *   **Statistical (Inadmissible):** Hunches, general market feelings, or data the model already weighs (e.g., "It feels like a bad year," "Claims are up generally," "I think 2% is too low").
  3.  **Pass:** All reasons are Statistical.
      *   *Action:* **Stop.** You have no admissible evidence. You must defer to the model probability. Your gut is noise.
  4.  **Fail:** You have at least one verified Structural reason.
      *   *Action:* Proceed to Step 3.

  #### Step 3: The Quantification (15 Minutes)
  *Translating Structural Intelligence into Probability.*

  1.  For each **Structural** reason identified in Step 2, assign a percentage impact based on textbook loss costs or engineering estimates (e.g., "Skipped levee maintenance = +3% probability").
  2.  Sum the adjustments.
  3.  **Pass:** The total adjustment is less than 50% of the model's base rate.
      *   *Action:* Apply adjustment. Document reasons.
  4.  **Fail:** The total adjustment exceeds 50% of the model's base rate (e.g., moving from 2% to 10%).
      *   *Action:* **Escalate.** This is no longer a pricing adjustment; it is a rejection of the model's fundamental view.

  #### Step 4: Sign-Off (10 Minutes)
  1.  **Standard Path:** If Step 1 Passed and Step 2 Passed → Price at Model. Sign yourself.
  2.  **Calibration Path:** If Step 1 Failed → Price at Model + Historical Bias Correction. Sign yourself (unless >50% loading, then CU).
  3.  **Intelligence Path:** If Step 2 Failed (Structural found) → Price at Model + Structural Adjustment. Sign yourself (unless >50% adjustment, then CU).
  4.  **Rejection Path:** If you cannot justify the gap via Step 1 or Step 2 → You must either accept the Model price or decline the risk. You cannot price in the middle based on "gut."

  ---

  ### Running the Protocol on Your Three Accounts

  #### 1. The Riverside Warehouse
  *   **Model:** 2% | **Gut:** 10%
  *   **Step 1 (Calibration):** Assume model is calibrated for regional flood. **Pass.**
  *   **Step 2 (Intelligence):** You say "Gut says 10%." Is there a specific report on the levee? A change in upstream dam policy? If no, this is **Statistical**.
      *   *Result:* **Fail (Step 2 Pass condition).** You have no Structural intelligence.
  *   **Decision:** **Defer to Model (2%).**
  *   **Why:** Your fear is not evidence. Under the Principal Principle, if you accept the model's chance is 2%, your credence must be 2% unless you have inadmissible evidence. You don't.
  *   **Action:** Price at 2%. If you are too uncomfortable to write it at 2%, decline the account. Do not price at 10% without data.

  #### 2. The Hillside Subdivision
  *   **Model:** 4% | **History:** Model undercalls every year.
  *   **Step 1 (Calibration):** You stated the model "has undercalled every fire season for five years." This is systematic bias.
      *   *Result:* **Fail (Step 1 Pass condition).** You have reason to think the chance isn't 4%.
  *   **Decision:** **Apply Calibration Loading.**
  *   **Why:** This triggers Caveat 2. The "objective chance" provided by the vendor is known to be false.
  *   **Action:** Calculate the 5-year average undercall (e.g., if it undercalls by 50%, adjust 4% to 6%). Price at 6%.
  *   **Escalation:** If the historical undercall implies a rate >6% (a 50% hike), send to Chief Underwriter to approve the model override.

  #### 3. The Brand New Risk
  *   **Model:** X% | **History:** None.
  *   **Step 1 (Calibration):** No history on *this* risk, but assume model is calibrated for the *peril type*. **Pass.**
  *   **Step 2 (Intelligence):** It's new. You have no specific intelligence on the asset.
      *   *Result:* **Pass (Step 2 Pass condition).** No Structural intel exists yet.
  *   **Decision:** **Defer to Model.**
  *   **Why:** With no history and no specific intelligence, the model is the only anchor. Your "gut" on a new risk is pure speculation (Statistical).
  *   **Action:** Price at Model. Add a "New Business Uncertainty" loading *only* if your company has a standard textbook provision for it (e.g., +10% flat), not based on feeling.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Fix Garbage Data:** If the model inputs (e.g., elevation, construction type) are wrong, the protocol treats the output as valid. You need a separate data validation step before Step 1.
  2.  **It Cannot Predict Black Swans:** The Principal Principle works on known chances. It does not protect you against risks the model doesn't know exist (e.g., a pandemic, a new type of cyber-physical attack).
  3.  **It Cannot Remove Risk Aversion:** You might price at 2% (per the protocol) and still lose sleep. The protocol ensures *accuracy*, not *comfort*. If the 2% price doesn't cover your cost of capital due to volatility, that's a capital management issue, not a pricing probability issue.
  4.  **It Shifts Liability:** If you follow this and the model is wrong (Scenario 2), the procedure protects you. If you ignore this and use your gut (Scenario 1), and you're wrong, the audit trail shows you violated the protocol.

  ### Chief Underwriter Triggers
  *   **Model Override:** Any time Step 1 fails and the historical bias correction is >50%.
  *   **Structural Override:** Any time Step 2 identifies Structural factors that increase probability by >50%.
  *   **Decline:** If the protocol forces you to price at 2% but you believe the risk is uninsurable, you must escalate to Decline. The CU must sign off on turning away revenue based on "unquantified gut."

  ### Summary for the Chief Underwriter
  "This procedure aligns our pricing with the **Principal Principle**. It forces us to treat the model as the 'objective chance' unless we have proof of model bias (Caveat 2) or specific account intelligence the model misses (Caveat 1). It prevents us from pricing based on unquantifiable anxiety."
