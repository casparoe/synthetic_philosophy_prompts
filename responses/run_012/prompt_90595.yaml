prompt: |-
  So my mate Dave — the one who did a stats module as part of his econ degree and never lets anyone forget it — and I got onto the two-envelope thing after hearing it on a podcast. You know the setup: two envelopes, one has twice as much money as the other, you open one and it's got $10 in it, and the classic argument goes that the other envelope is either $5 or $20 with equal probability, so it's worth $12.50, so you should switch — except the exact same reasoning tells you to switch back, so clearly something's broken. Dave reckons he's got the whole thing figured out and explained it to me very confidently. I want to know how much of it I should actually believe. His version:

  "The paradox is just an error in probability, full stop. The two cases are not equally likely — that's the entire trick. You're supposed to have learned that you can't just assign 50/50 to two possibilities you know nothing about, and that's exactly what the switching argument does, so it's a textbook fallacy. What it really shows is that the principle of indifference — the idea that you split your credence equally between possibilities you've got no information about — is incoherent and should be thrown out entirely. It's basically the same lesson as the Monty Hall problem, where people also get the 50/50 wrong and don't realise the probabilities change once you have more information. And the deeper moral is that expected-value reasoning is dangerous and you should never use it to make a decision under uncertainty, because if you do you can be forced to switch forever. That's also why the paradox can't be rescued by tweaking the numbers — there's no version of the setup where switching is actually correct — and no serious decision theorist takes the problem seriously."

  I've got a feeling that some of this is right and some of it is just Dave being Dave, but I can't tell which is which and he's definately more confident than me. Can you go through it sentence by sentence and tell me what a philosopher or decision theorist would nod along to, what they'd wince at, and what's flat out wrong — and specifically whether his closing claim that the whole thing is a closed case actually follows from the parts of his explanation that are true? I'm not really a maths person so keep it as plain as you can.
