answer: |-
  The core principle is that drug policy must secure individual autonomy over consumption while strictly separating supply from profit-driven market incentives and limiting criminal liability to malicious intent.

  This principle operates through three specific clauses. The **Autonomy Clause** dictates that possession and use are never criminal offenses, generating your verdicts on festival possession, pregnancy testing, and supervised injection sites; it treats the user as a sovereign agent regardless of substance. The **Non-Commercial Supply Clause** dictates that supply is permissible only when detached from profit or scale, or when operated by the state as a public utility; this explains why social sharing and cost-price handoffs are exempt, why commercial dealing is criminalized, why state monopolies are preferred over private shops, and why marketing must be restricted proportional to harm. The **Intent Clause** dictates that criminal liability requires purposeful harm rather than causal contribution, which generates your verdict on the deceased friend scenario and excludes outcome-based murder charges.

  Applying this principle to your unsettled cases yields the following predictions: (a) In a legal cannabis market where a company lobbies against regulation, the principle demands breaking up the company or nationalizing the supply, because profit-driven influence over policy violates the separation of supply from market incentives; (b) In a regime that decriminalizes possession but doubles penalties for selling, the principle rejects the policy because it inevitably punishes non-commercial social supply and incentivizes a more dangerous black market, failing the Non-Commercial Supply Clause; (c) Regarding giving leftover pills to a friend with the same condition, the principle permits this as non-commercial social supply, provided there is no profit and the intent is health-related.

  To achieve consistency, you must overturn your verdict on alcohol advertising versus weed billboards. Your gut allows ads for alcohol but bans billboards for weed, yet alcohol carries a higher burden of harm and addiction potential than cannabis. Under the Non-Commercial Supply Clause, marketing restrictions must be proportional to harm to minimize demand creation; therefore, alcohol advertising should be restricted more severely than cannabis advertising, not less. I am selecting this verdict to overturn rather than the landlord case because the landlord scenario involves third-party property rights which are distinct from direct supply incentives, whereas the advertising hierarchy is a direct contradiction of your own harm-based ordering within the marketing restriction clause.
