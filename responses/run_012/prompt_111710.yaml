answer: |-
  You confuse the absence of a party with the presence of a master. But a leader who demands loyalty is merely a party compressed into a single body; the idolatry remains the same. I do not offer a saviour, nor do I seek to hand the soul to any man. The truth is impersonal; it belongs to no one and therefore cannot be owned by a faction or a Führer. If the vacuum left by parties is filled by a tyrant, it is because men prefer the warmth of submission to the cold air of judgment. I would rather risk the tyrant than sanctify the lie. The collective pressure you defend is already a form of force; it compels the mind to stop thinking. To abolish parties is not to appoint a new god, but to remove the idols that prevent us from seeing what is real. I have no army to enforce this, only the obligation to think.

  On an ordinary Tuesday, for the forty million, it would look like nothing so dramatic as a revolution. It would look like a man reading a proposal without asking which side proposed it. It would mean speaking according to what is true, even if it isolates him from his neighbours. I know this is a heavy burden for those crushed by labour and fatigue; they seek the intoxication of belonging because reality is too hard to bear alone. I concede that in this time of war, such clarity is perhaps impossible; we fight fire with fire. But peace built on the same collective passions will only breed new wars. I have no scheme to lighten this load. I only say that until they can bear to be alone in their judgment, they are not citizens, but members of a herd. The difficulty is not an argument against the truth.
