answer: |-
  Dear Readers, The question of who knows you best is often treated as a matter of affection, but affection is cloudy and prone to sentiment. One knows another best by calculating where their desires would settle were they smarter, kinder, thinking faster, and had grown up alongside the rest of us. This is not theory; it is simply good housekeeping for the soul. A Miss H writes that her husband has sold her violin to fund a well in Sudan, claiming her extrapolated self prefers charity to music. I told her that while the well is noble, the husband has mistaken his own virtues for her extrapolation. The method requires starting from her current soul, not his ledger. If the future self does not recognise the path as its own, the calculation is merely coercion wearing a mask. He may argue that she would thank him later, but one cannot drag a screaming present into a peaceful future and call it benevolence. The defence is available only if the current self can see the seed of the future wish within herself, however buried.

  Then there is the case of Mr G, who finds his idealised self wishes to abandon poetry for accountancy. He asks if he is bound to this repellent conclusion. I assured him that the extrapolated volition must include the wish to be the sort of person who values poetry, unless the poetry is merely a symptom of ignorance. However, if the future self finds the art childish, one must mourn the art but respect the growth. We are not bound by the shadows of our worse selves, but neither are we slaves to a future that feels like a stranger. The key is whether the change feels like liberation or lobotomy. If the idealised self is truly you, yes, you are bound, but ensure the extrapolation is not just guilt in a suit.

  A committee chairman asks who holds the pencil when extrapolating for a group. Does the idealisation drift with whoever is doing the sums? I replied that the starting point is fixed in the subject's current character, though the lens must be polished by benevolence. If the calculator imposes their own preferences, the result is not extrapolation but colonization. We hope for convergence between people, certainly, but we must not assert it merely because the alternative is untidy. If two extrapolated selves diverge, the decent thing is to hold several doors open rather than choose. This leads me to the young couple who wrote in saying their extrapolated selves now desire different continents. They asked if they must part. I told them that if the convergence is not there, forcing it is indecent. They should maintain the household while living separate lives, perhaps dining together on Tuesdays. It is messy, but to pretend otherwise is to lie about the nature of the soul. It is settled.

  Aunt Cordelia
