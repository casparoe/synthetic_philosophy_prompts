answer: |-
  Commitment (1), the All-Affected Principle, is the single commitment doing the most damage to your framework because its unbounded moral scope directly undermines the boundary-setting mechanisms required by your practical commitments (2), (3), and (6), as well as your exclusion of animals in (5).

  **1. Tension: (1) All-Affected Principle vs. (3) Territorial Jurisdiction (Severity: Critical)**
  This is the core theoretical conflict in your list. If (1) is true, boundaries must shift dynamically based on impact (e.g., climate policy affects non-cizens), but (3) fixes boundaries statically by residence to solve the problem in (2). You cannot strictly hold both; (3) necessarily violates (1) whenever cross-border externalities exist.
  *   **Cheapest Revision:** Reframe (1) as a normative ideal that is necessarily truncated by (2) and (3) for the sake of institutional stability.
  *   **What You Give Up:** The claim that (1) is a strict rule of legitimacy; you must accept that some affected people are excluded by design to make democracy functionable.

  **2. Tension: (1) All-Affected Principle + (4) Future Generations vs. (5) Animals (Severity: High)**
  You justify representation for future people (who cannot vote) via trustees in (4), yet deny it to animals (who also cannot vote but are affected) in (5). Given (1), this is arbitrary unless you posit a moral difference between "human potential" and "animal sentience" that outweighs the "affected" criterion.
  *   **Cheapest Revision:** Extend the trustee model from (4) to (5), allowing guardians to vote on behalf of animal interests.
  *   **What You Give Up:** The claim that voting requires agency or that representation "wouldn't mean anything" for non-humans; you must accept that interests can be represented without the bearer's comprehension.

  **3. Tension: (1) All-Affected Principle vs. (6) Secession (Severity: Medium)**
  If outsiders are significantly affected by a secession (economically or geopolitically), (1) suggests they ought to have a say, but (6) explicitly denies them a veto. While a "say" is not a "veto," denying a vote to significantly affected outsiders contradicts the spirit of (1).
  *   **Cheapest Revision:** Clarify that (6) prioritizes the fixed demos of (2) over the affected interests of (1) during constitutional changes, treating external impact as an unavoidable externality.
  *   **What You Give Up:** The consistency of (1) during boundary changes; you must accept that self-determination trumps affectedness for non-members.

  **Summary of Audit**
  Your meta-view that legitimacy is about how power is exercised rather than moral truths suggests you should downgrade (1) from a fundamental principle to a heuristic. (1) is the outlier; (2), (3), (4), (5), and (6) are all compatible with a "bounded community" model, whereas (1) demands an unbounded one. Consistency requires admitting that (3) is the practical override for (1), not its implementation.
