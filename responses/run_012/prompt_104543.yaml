answer: |-
  Here is the conceptual anatomy of the five mechanisms, ranked and weighted for the two specific cases. I have treated your two additions (*Reputational Precommitment* and *Moral Lag*) as distinct causal variables rather than mere subsets of *Interest* or *Honor*, as their game-theoretic and temporal structures offer specific explanatory leverage.

  ### Case 1: Aristocratic Dueling
  **The Phenomenon:** The rapid decline of the duel among officers and gentlemen (1860–1914) despite the persistence of the code of honor.

  | Mechanism | Tier | Weight | Conceptual Role |
  | :--- | :--- | :--- | :--- |
  | **Honor** | 1 | 40% | **Constitutive Causal.** The practice existed *for* honor. It ended when honor was redefined from "personal vengeance" to "professional discipline." |
  | **Reputational Precommitment** | 2 | 25% | **Coordination Causal.** Regimental messes and clubs instituted bans. The cost shifted from "refusing a challenge" (cowardice) to "accepting one" (expulsion). |
  | **Interest** | 2 | 20% | **Structural Causal.** Professionalization of the military meant a court-martial or dismissal cost a career more than a slight damaged it. |
  | **Moral Lag** | 3 | 10% | **Explanatory.** High command stopped dueling to ensure unit cohesion; the moral language of "civility" trickled down later to justify the ban. |
  | **Argument** | 4 | 5% | **Justificatory.** Rational arguments against dueling existed for centuries prior. They provided the vocabulary for the shift, not the motive force. |

  **Total:** 100%

  **Analysis:**
  Dueling is primarily a technology of status maintenance. Therefore, **Honor** is the dominant variable. However, Honor is malleable. The mechanism that actually *bent* Honor was **Reputational Precommitment**. When a critical mass of senior officers agreed that supporting a duelist was more damaging to the regiment's reputation than the duelist's cowardice, the coordination game flipped. **Interest** supports this by raising the stakes (career loss). **Argument** is negligible as a causal force; no one started dueling less because they read a pamphlet on the sanctity of life. They stopped because their peers would no longer second them. **Moral Lag** accounts for the discrepancy between the administrative bans (causal) and the public moralizing against "barbarism" (justificatory) that followed.

  ***

  ### Case 2: Chattel Slavery
  **The Phenomenon:** The abolition of the slave trade and chattel slavery in the Atlantic World (1790–1888).

  | Mechanism | Tier | Weight | Conceptual Role |
  | :--- | :--- | :--- | :--- |
  | **Interest** | 1 | 35% | **Structural Causal.** Shift from mercantilist plantation economies to industrial wage labor made enforcement costs outweigh profits for the metropole. |
  | **Argument** | 1 | 35% | **Motivational Causal.** Unlike dueling, moral/religious argument (Enlightenment universalism, Evangelical awakening) created a new constituency willing to pay economic costs. |
  | **Reputational Precommitment** | 2 | 15% | **Transmission.** Consumer boycotts (sugar), international treaties, and naval blockades created a "race to the top" among nations to signal civility. |
  | **Moral Lag** | 3 | 10% | **Explanatory.** Abolition happened in the Metropole (elites/public) first, imposed on Colonies (planters) later. The "universal rights" argument masked this geographic class divide. |
  | **Honor** | 4 | 5% | **Peripheral.** While Southern "Herrenvolk" honor defended slavery, Honor was not the primary mechanism for its *dismantling* in the North/Britain. |

  **Total:** 100%

  **Analysis:**
  Slavery differs from dueling because it was an economic engine, not merely a status signal. Thus, **Interest** and **Argument** share the top tier. The "Williams Thesis" (economic decline caused abolition) is too blunt; slavery was still profitable in many sectors. However, the *systemic* interest of rising industrial capitalism favored wage labor and free trade. Crucially, **Argument** receives a much higher weight here than in dueling because moral movements (Quakers, Abolitionists) successfully mobilized people *against* their immediate economic interest (e.g., British consumers paying more for sugar). **Reputational Precommitment** explains the international dimension: Britain banning the trade to force competitors to follow. **Moral Lag** explains the timeline: British citizens were "free" long before British colonial subjects were, suggesting the moral revolution was elite-led before it was universal. **Honor** is minimal; while slaveholders used honor to defend the institution, the abolitionists did not primarily use honor to dismantle it.

  ***

  ### Conceptual Anatomy: Causal vs. Justificatory

  To clarify the "work" each mechanism is doing across both cases:

  1.  **Causal Engines (The "Why it moved"):**
      *   **Interest:** Changes the material payoff matrix. (Dominant in Slavery, Secondary in Dueling).
      *   **Honor:** Changes the social payoff matrix. (Dominant in Dueling, Minor in Slavery).
      *   **Argument:** Changes the cognitive/moral framework. (Co-Causal in Slavery, Negligible in Dueling).

  2.  **Transmission Belts (The "How it spread"):**
      *   **Reputational Precommitment:** This is the tipping point mechanism. It explains how individual shifts become systemic norms. It locks in the changes wrought by Interest or Honor by making defection costly. It is the *coordination technology* of moral revolution.
      *   **Moral Lag:** This is a diagnostic tool for the *sequence* of change. It explains why the *story* of the revolution (we became more moral) often contradicts the *history* of the revolution (elites changed behavior for status/economic reasons, then universalized the justification).

  3.  **Justificatory Gloss (The "Why we say it moved"):**
      *   **Argument:** In both cases, but especially Dueling, philosophical argument serves largely to rationalize a shift that has already occurred due to Honor or Interest. It provides the *language* of the revolution, not the *energy*.

  ***

  ### The Pivot Point: What Would Change the Ranking?

  If I had to identify a **single consideration** that would most drastically alter these weights, it is this:

  **For Slavery: Evidence of sustained profitability at the moment of abolition.**
  *   *Current View:* Interest (35%) assumes that while slavery was profitable, the *systemic* costs (enforcement, trade restrictions, risk of revolt) were rising relative to industrial wage labor.
  *   *Revision Condition:* If historical data conclusively showed that slavery was becoming *more* profitable relative to free labor in the key abolitionist jurisdictions (e.g., Britain pre-1833, US North pre-1800) and was abolished *despite* this, the weight of **Argument** must rise to 60%+ and **Interest** must drop to <10%. This would validate the "Economic Sacrifice" thesis (e.g., Drescher) over the "Economic Decline" thesis (e.g., Williams). It would prove that moral conviction alone can override entrenched economic interest, fundamentally changing the anatomy of moral revolutions.

  **For Dueling: Evidence of state enforcement preceding social stigma.**
  *   *Current View:* Honor (40%) assumes the state could not stop dueling until the social code changed.
  *   *Revision Condition:* If archival data showed that dueling ceased primarily because states successfully prosecuted and executed duelists *before* the social stigma peaked, **Interest** (legal risk) would overtake **Honor**. This would suggest moral revolutions regarding violence are top-down coercive projects rather than bottom-up shifts in status culture.

  **My Call:** I am betting on the **Slavery Profitability** pivot. If it turns out slavery was abolished at the height of its economic power, **Argument** becomes the single most powerful mechanism in modern moral history, displacing **Interest** as the primary driver of structural change. Until then, **Interest** remains the bedrock.
