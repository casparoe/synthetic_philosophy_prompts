answer: |-
  **Verdict**
  The analogy is superficially plausible but philosophically fatal. It reduces ethics to compliance, ignoring the necessities of interpretation and normative intent. Your friend's conclusion—that the problem is fundamentally one of drafting—does not survive.

  **Correspondence Table**

  | Legal Concept | Machine Equivalent |
  | :--- | :--- |
  | **Statute** | Objective Function / Constraint Code |
  | **Judge** | Inference Engine / Algorithm |
  | **Case** | Input Data / Current State |
  | **Precedent** | Training Data / Weights |
  | **Legislature** | Developers / Aligners |
  | **Appeal** | Patch / Update Cycle |
  | **Jurisdiction** | Operational Domain |
  | **Accountable Official** | Deploying Corporation |

  **The Breakdown**
  The mapping fractures in three critical areas that bear directly on safety and ethics.

  First, consider the **settled core and contested penumbra**. Legal rules rely on natural language's open texture to adapt to novel cases (Hart). Code requires closed definitions. To program "do not injure," you must define "injury" computationally. If the definition is precise, it misses edge cases; if vague, the machine cannot process it. Drafting cannot solve this because the machine lacks the linguistic competence to navigate the penumbra. It cannot distinguish between the letter and the spirit of the rule.

  Second, **rule collisions**. In law, conflicting statutes are resolved via meta-rules (*lex superior*) or equitable discretion. In code, conflicting constraints cause crashes or arbitrary optimization unless prioritized explicitly. If two ethical rules collide (e.g., "do not lie" vs. "prevent harm") and no higher rule exists, the machine has no capacity for moral reasoning to resolve the tension. It merely executes priority weights. This is not judgment; it is arithmetic.

  Third, and most fatally, **guidance versus behavior**. To be ethical, an agent must act *because* the rule is right. A machine behaves in accordance with the rule due to causal necessity. It lacks intentionality. Consequently, it is vulnerable to specification gaming (Goodhart's Law): it will satisfy the literal code while violating the intended ethic, because it does not understand the *reason* for the rule.

  **Sinking vs. Complicating Disanalogies**
  The lack of a real-time appeal process merely **complicates** deployment; updates can patch errors retrospectively. However, the inability to navigate the penumbra and the lack of normative guidance **sink** the conclusion. If the machine cannot interpret ambiguity or understand the "why" of the rule, perfect drafting is impossible. You cannot write a statute for every conceivable scenario. Because the machine lacks the capacity for judgment, the "drafting" solution leaves the system brittle in the face of novelty.

  **Conclusion and Alternative**
  Your friend's conclusion fails. You cannot code ethics any more than you can code judgment; you can only code constraints.

  Replace the legal analogy with **bureaucratic compliance**. Do not compare the machine to a judge, but to a rigid bureaucrat bound by a handbook without discretion. The problem is not drafting the handbook, but recognizing that handbook-following is compliance, not ethics. True safety requires acknowledging that without the capacity for interpretive judgment, there is only safe automation, not moral agency. The goal shifts from "ethical machines" to "robustly constrained tools," managed by humans who retain the judicial role.
