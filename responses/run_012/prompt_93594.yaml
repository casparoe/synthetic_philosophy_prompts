          7.  Metrics for Success (Evidence of movement).

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I answer the set theorist? Yes, by distinguishing *mathematical settlement* (consistency/independence) from *epistemic settlement* (warrant/truth).
      *   *Check:* Is the budget considered? $3M/4 yrs is roughly $750k/yr. Enough for a few large grants or many small ones. I should imply a focus on collaborative work or postdocs.
