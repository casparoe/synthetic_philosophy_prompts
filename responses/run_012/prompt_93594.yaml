      *   **Task:** Rank open conceptual questions, assess them (dependency, tractability, crowdedness, evidence of progress), identify depriorities/dead ends, and explicitly state criteria/trade-offs.
      *   **Candidates:** (a) Computer-assisted proof epistemology, (b) Set-theoretic independence/indeterminacy, (c) Mathematical explanation, (d) Social epistemology of acceptance, (e) Applicability to physics.
