  As an experimentalist, you know that data is noisy. The historical cases of sight restoration—cataract removals or modern gene therapies—are philosophically inconclusive. Patients often suffer from retinal degradation or cortical atrophy during blindness. Their failure to distinguish shapes may reflect visual agnosia or cognitive overload, not the absence of cross-modal concepts. Conversely, success in modern cases often involves weeks of rehabilitation, blurring the line between "immediate" and "learned."

