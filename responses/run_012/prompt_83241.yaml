  Your proposed variation—the large or serial object—sharpens the problem significantly. In the standard case, touch is quasi-simultaneous; the hand encompasses the small object much as the eye encompasses the visual field. But if the object is a large wall with a hole, touch becomes a temporal sequence of local events, while vision remains a simultaneous global gestalt.

