  **Verdict**

  Here is the verdict: The man cannot identify the objects by sight alone. The answer is no. The reasoning rests on the distinction between sensory qualia and abstract properties. While geometry is abstract, access to it is mediated by specific sensory codes. Vision and touch encode spatial information differently; one is photic and parallel, the other is haptic and often serial. Without a learned translation manual, the brain cannot map one code to the other.

