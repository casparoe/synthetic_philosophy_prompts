answer: |-
  This is one of the sharpest observations I've seen about the carceral state. You have put your finger on the central tension of modern corrections: the collision between the *retributive logic* of sentencing (you deserve this because you chose that) and the *managerial logic* of release (you get this when you are safe).

  To answer your question directly: **The practice does not strictly require robust, libertarian free will.** It requires *functional agency*.

  Here is the breakdown of what the system presupposes, where the inconsistency lies, and how two people with opposing metaphysical views could sit on the same board without feeling like hypocrites.

  ### 1. What the Practice Strictly Requires
  The parole hearing is not a theological inquest; it is a risk assessment. While the language is steeped in moral desert ("earn your way out," "pay your debt"), the operational machinery is consequentialist.

  *   **The Requirement:** The system requires the inmate to demonstrate **predictive reliability**.
  *   **The Mechanism:** Remorse is used as a heuristic for risk.
      *   If an inmate says, "I didn't do it," or "It wasn't my fault, I was high," the board hears: *This person has not identified the trigger. Therefore, the trigger remains active. Therefore, recidivism risk is high.*
      *   If an inmate says, "I did it, it was wrong, and here is the flaw in my character that led to it," the board hears: *This person has identified the trigger. They are engaging in self-regulation. Risk is lower.*

  **Strictly speaking,** the board does not need the inmate to be the *ultimate originator* of the act in a metaphysical sense. They only need the inmate to be the *current locus of control*. The system presupposes that whatever caused the crime (trauma, genes, lead paint) can be *managed* by the inmate's future cognitive processes.

  ### 2. Is the System Internally Consistent?
  You asked if the medical/causal talk in one room undercuts the desert talk in the other.
  **Theoretically:** Yes. If the adolescent brain and trauma made the crime inevitable, "earning" release through moral reform is incoherent.
  **Practically:** No. The system resolves this by treating "character" as a mutable variable within a causal chain.

  The system operates on a **Compatibilist Bureaucracy**. It assumes that while your past determined who you *were*, your current cognitive engagement determines who you *will be*.
  *   **The Causal Room:** Explains *why* the risk started (trauma/addiction).
  *   **The Remorse Room:** Explains *how* the risk will end (insight/compliance).

  The inconsistency is papered over by the concept of **treatability**. The board doesn't need you to be free from causality; they need you to be responsive to it. If you say, "My trauma made me do it," that's a valid causal explanation, but if you stop there, you are denied. If you say, "My trauma made me do it, *and now I am managing my trauma so I won't do it again*," you are paroled. The "remorse" is actually a pledge of future risk management.

  ### 3. If You Took Hard Incompatibilism Seriously (No Desert)
  If the board genuinely believed that no one is morally responsible because everyone is a product of prior causes, the hearing would change, but perhaps not as much as you'd think.

  *   **What Goes:** The language of "earning," "debt," and "moral reform." The question "Do you feel remorse?" would be replaced by "Do you understand the causal chain?"
  *   **What Stays:** The detention. Even without desert, we quarantine the dangerous. If an inmate is in denial, they are statistically more likely to reoffend. They stay in.
  *   **The Shift:** The hearing becomes purely clinical. It looks less like a confession and more like a discharge planning meeting.
      *   *Current:* "Admit you are bad so we know you won't be bad."
      *   *Incompatibilist:* "Acknowledge the mechanism of your behavior so we can disable the mechanism."
  *   **The Novelistic Tension:** In this version, the inmate isn't performing morality; they are performing *sanity*. They are proving they understand the machinery of their own mind.

  ### 4. If You Took the Compatibilist Line (Desert within Causality)
  This is the current default. It allows the board to keep the remorse test, but it shifts the focus from *origin* to *alignment*.

  *   **The Remorse Test:** It doesn't require that you *could have done otherwise* in the past. It requires that you *align with societal norms* for the future.
  *   **The Rebuild:** You wouldn't need to rebuild the test around "capacity" because capacity is already the metric. The question isn't "Were you free?" it's "Are you capable of self-governance now?"
  *   **The Hypocrisy Check:** A compatibilist board member can listen to the trauma story and say, "That explains the input, but your output is now your responsibility." They feel no hypocrisy because they believe responsibility is compatible with causality.

  ### 5. The Underdetermined Zone (Where They Agree)
  This is the most important part for your novel. There is a vast "Underdetermined Zone" where a Libertarian (free will believer) and a Naturalist (determinist) can sit on the same board and vote the same way, without either feeling like a hypocrite.

  They agree on **Behavioral Modification as a Proxy for Safety.**

  *   **Libertarian View:** "He has chosen to reform his character. He is safe."
  *   **Naturalist View:** "He has successfully reprogrammed his behavioral responses. He is safe."
  *   **The Action:** Both vote "Grant."

  *   **Libertarian View:** "He refuses to admit his sin. He is unrepentant and dangerous."
  *   **Naturalist View:** "He is in denial about his triggers. He is high-risk and dangerous."
  *   **The Action:** Both vote "Deny."

  **The practice is underdetermined regarding *why* the change happened, provided there is evidence *that* it happened.**

  The system demands a **Narrative of Control**. It doesn't matter if the inmate believes that narrative is metaphysically true, only that it is functionally effective. The inmate must tell a story where they are the protagonist who learned a lesson.
  *   If the inmate says, "I am a victim of society," the board denies (Victimhood = Passive = Risk).
  *   If the inmate says, "I am the author of my future," the board grants (Authorship = Active = Safety).

  ### Implications for Your Novel
  For the purposes of your story, this ambiguity is gold. It allows for a specific kind of institutional gaslighting that is unintentional.

  1.  **The Board Members:** They likely don't know they are holding contradictory views. One might talk about "sin" and the other about "dopamine pathways," but they both deny parole to the guy who says, "I only did it because I was poor." They agree on the *outcome* (denial) even if their *reasons* (moral failure vs. risk factor) differ.
  2.  **The Inmate:** The tragedy for your character is that he must perform a metaphysical stance he may not believe. To get out, he must claim to be the "Author" of his past crime (to show remorse) and the "Author" of his future (to show safety), even if he knows his past was determined by lead paint and his future is determined by whether he can find a job.
  3.  **The "Earned" Release:** The idea that release is "earned" is the glue holding the contradiction together. It transforms a risk calculation into a moral transaction. If release were simply "risk is below 15%," it would feel like a medical discharge. By making it "earned," the system forces the inmate to validate the moral authority of the state.

  **Summary:** The practice requires **acknowledgment of causality** (to treat the risk) and **assertion of agency** (to manage the risk). It does not require truth about free will. It requires a **performance of agency**. The system is consistent not in its philosophy, but in its goal: minimizing liability. Both the determinist and the libertarian want the inmate to leave without coming back. They just use different vocabularies to get him to agree to the same behavioral contract.
