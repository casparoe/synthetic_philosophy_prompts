  3.  **Address the Philosophical Tension (Desert vs. Risk):**
      *   *Retribution (Desert):* You deserve punishment because you freely chose evil.
      *   *Consequentialism (Risk Management):* We hold you because you are dangerous. We release you when you are safe.
      *   *The Conflict:* The user sees a conflict between "You chose this" (Desert) and "Your brain made you do this" (Causal).
      *   *The Resolution (in practice):* The system is actually less about *metaphysical free will* and more about *functional agency*. It doesn't matter if the universe is deterministic; it matters if the inmate can regulate behavior *going forward*.
