      *   **The Practice's Actual Commitment (Risk vs. Desert):**
          *   Crucial distinction: Parole is *not* sentencing. Sentencing is backward-looking (retribution/deterrence). Parole is forward-looking (risk management).
          *   Therefore, the system doesn't *strictly* require libertarian free will. It requires *predictive reliability*.
