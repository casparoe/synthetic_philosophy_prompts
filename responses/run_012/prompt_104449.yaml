answer: |-
  You have stumbled directly into the central engine of contemporary analytic metaphysics. The dynamic you are describing has a name, but it is not a single word; it is a cluster of concepts that emerged in the early 2000s under the heading of **Meta-ontology**.

  The specific "move" you are identifying is **Ontological Deflationism** (often executed via a claim of **Quantifier Variance**), and the "loop" you are feeling is a **Meta-ontological Standoff**.

  Here is the carving you asked for. I will break down the standard term ("verbal dispute"), explain why it fails to capture your situation, identify the specific philosophical positions battling in your reading group, and offer a label for the dynamic itself.

  ### 1. Why "Verbal Dispute" is the Wrong Label
  In the classical sense (derived from logical positivism or early Wittgenstein), a **Merely Verbal Dispute** is one that can be *dissolved* by clarifying terms.
  *   **Structure:** Person A says "X is Y." Person B says "X is not Y."
  *   **Resolution:** A clarifies they mean $Y_1$, B clarifies they mean $Y_2$. They realize they agree on the facts and stop arguing.
  *   **Outcome:** Peace. The argument was a confusion.

  In your group, the argument does not dissolve. The diagnosis ("this is verbal") *becomes* the new argument. This means it is not a standard verbal dispute. It is a **Substantive Dispute about Semantics**.

  David Chalmers (in his paper *Verbal Disputes*) distinguishes between disputes that are merely verbal and disputes that are **verbal but substantive**. In the latter, the choice of words matters because the words track different theoretical commitments. Your group is stuck here: the fight isn't about the facts anymore; it's about which linguistic framework gets to describe the facts.

  ### 2. The Two Positions in the Room
  To name the dynamic, we have to name the opposing moves. You have two distinct meta-ontological positions colliding.

  **Side A (The "It's Just Words" Person): Ontological Deflationism**
  *   **The Move:** They are arguing that the quantifier ("there exists") is not a fixed, deep feature of reality but a linguistic tool that can vary in meaning without one side being "wrong."
  *   **Technical Term:** **Quantifier Variance** (championed by Eli Hirsch).
  *   **The Logic:** If we agree on all the concrete facts (the "application conditions"), then there is no further fact about whether the object *really* exists. To insist there is, is to be confused about language.
  *   **Why they think they won:** They are channeling **Rudolf Carnap**. Carnap argued that "external" questions (Does the world of numbers *really* exist?) are pseudo-questions. Only "internal" questions (Is there a prime number greater than 5?) are meaningful. By calling it "just verbal," Side A is claiming they have exposed the question as a Carnapian pseudo-problem.

  **Side B (The "No, It's Real" Person): Ontological Realism**
  *   **The Move:** They are arguing that existence is a **joint-carving** concept. There is a "structure of the world," and our language attempts to map onto it.
  *   **Technical Term:** **Quantifier Absolutism** or **Ontological Realism** (championed by Theodore Sider).
  *   **The Logic:** Even if we agree on the concrete facts, one of us is correctly describing the *structure* of reality and the other is not. The word "exist" isn't just a tool; it's a probe into the fundamental joints of nature.
  *   **Why they resist:** They think Side A is committing a **Category Mistake** or engaging in **Subject-Changing**. To them, Side A isn't dissolving the problem; they are dodging the metaphysical bullet by retreating to linguistics.

  ### 3. The "Loop": The Meta-ontological Standoff
  You described a "weird loop where the diagnosis becomes the next battleground."
  In the literature, this is a **Meta-ontological Dispute**.
  *   **First-order dispute:** "Do numbers exist?"
  *   **Second-order dispute:** "Is the question 'Do numbers exist?' substantive?"

  The frustration you feel comes from the fact that there is no neutral ground to adjudicate the second-order dispute. To decide if the dispute is verbal, you need a theory of language. To decide if the dispute is substantive, you need a theory of reality. Side A and Side B have different theories of both.

  There isn't a single lexicalized word for this specific loop, but the most accurate description is a **Dispute over Semantic Authority**. Both sides are fighting over who has the right to define the "existential quantifier."

  ### 4. Is it "Changing the Subject"?
  You asked if this is the same as someone quietly changing the subject.
  *   **Technically:** Yes. Side A is shifting the subject from *metaphysics* to *semantics*.
  *   **Strategically:** It is not the fallacy of *Ignoratio Elenchi* (missing the point). It is a **Deflationary Gambit**. Side A believes that metaphysics *should* be reduced to semantics. Side B believes semantics should serve metaphysics.

  If you want to call it out, do not say "You are changing the subject." Say: **"You are shifting from first-order ontology to meta-ontological deflationism."** This forces them to defend the *shift*, rather than letting the shift count as a victory.

  ### 5. How to Label It (and How to Fix It)
  If you want a term to use in your group to name this specific frustration, I recommend coining or adopting one of the following:

  **Option A: The Carnap-Quine Standoff**
  This historicizes the problem. Side A is Carnap (logic/language determines existence); Side B is Quine/Sider (existence is a substantive feature of the world). Naming it this way reminds everyone that this argument has been ongoing since 1950 and isn't likely to be settled in an hour.

  **Option B: Meta-ontological Indeterminacy**
  This captures the feeling that the rules of the game are undefined. You cannot settle the score because you haven't agreed on how to keep score.

  **Option C (The Best Fit): A Dispute in Conceptual Ethics**
  This is the most productive way to frame it. **Conceptual Ethics** (a term gaining traction via philosophers like Matti Eklund and David Chalmers) suggests that when two people agree on the facts but disagree on the ontology, they are no longer arguing about *what is*. They are arguing about **which concepts we should use**.
  *   Side A wants a concept of "exist" that is parsimonious (fewer things).
  *   Side B wants a concept of "exist" that is explanatory (captures the structure).
  *   **The Fix:** Stop asking "Does it *really* exist?" Start asking "Which concept of existence is more *useful* for our purposes?"

  ### Summary Recommendation
  When this happens again, try saying this:

  > "It sounds like we've hit a **Meta-ontological Standoff**. We agree on the facts, but we disagree on whether the word 'exist' should be treated as a **deflationary linguistic tool** (Side A) or a **substantive joint-carving predicate** (Side B). Since we can't prove which theory of language is right without begging the question, can we shift this to **Conceptual Ethics**? Which usage of 'exist' does more work for the specific problems we're trying to solve?"

  This validates both sides (acknowledging the semantic nature *and* the substantive stakes) without letting Side A claim a cheap victory by declaring the dispute "merely verbal."

  **The Term You Want:** If you need a single label for the phenomenon where the "it's just verbal" claim is itself contested, call it a **Contested Deflation**. It signals that the attempt to deflate the ontology is being resisted as a substantive move.
