  **NICTO Grant Application #8842**
  **PI:** Dr. Aris Thorne, Dept. of Formal Ornithology
  **Project:** Non-Black Non-Raven Survey (NBNRS)

  **Project Summary:**
  Per NICTO Strategic Plan 4.2, this proposal specifies confirmation criteria for each observation. The primary hypothesis ($H$): "All ravens are black." Logically, $H$ is equivalent to "All non-black things are non-ravens." While standard ornithology seeks Nicod-style instantiation (observing black ravens), this project exploits the Equivalence Condition. We propose to confirm $H$ by observing non-black non-ravens. A red apple is $\neg B$ and $\neg R$; thus, it satisfies the contrapositive. By the Equivalence Condition, it confirms $H$.

  **Methodology:**
  We will bypass field work. Nicod instantiation requires locating $R$ to check for $B$, which is inefficient given the scarcity of $R$. Instead, we employ Hempel's Satisfaction Criterion on accessible $\neg B$ objects. Each object is vetted to ensure it is strictly non-black and strictly non-raven. We will categorize confirmatory weight based on object class. Critically, we are not measuring positive relevance relative to background knowledge ($K$). Standard Bayesian fixes argue that shoes confirm $H$ less than ravens due to $K$; however, NICTO guidelines prioritize logical satisfaction over contextual updating. We treat each $\neg B \land \neg R$ instance as a formal confirmatory unit.

  **Budget Justification:**
  *   **Red Apple Procurement ($45,000):** High-volume purchase to ensure statistical significance of $\neg B \land \neg R$ instances.
  *   **White Shoe Classification ($60,000):** Personnel required to distinguish "white" from "off-white" to maintain predicate precision.
  *   **Blue Mug Acquisition ($30,000):** Diversifying the $\neg B$ domain.
  *   **Travel ($0):** All observations occur in a controlled indoor environment to minimize contamination by actual ravens.

  **Broader Impacts:**
  This project democratizes confirmation theory. Currently, only field ornithologists can confirm laws of nature. By validating the confirmation power of household objects, we allow any citizen to contribute to ornithological law from their living room. This reduces the carbon footprint of confirmation.

  **Reviewer Comment (Dr. E. Bayes, Stanford):**
  The PI is logically correct but probabilistically naive. Yes, the shoe confirms $H$, but confirmation is a matter of degree. Given background knowledge $K$, the probability shift $P(H|E \& K) - P(H|K)$ for a shoe is vanishingly small compared to a black raven. The class of non-black things is vastly larger than ravens. This proposal treats confirmation as binary rather than measuring positive relevance. It satisfies the letter of the Equivalence Condition but violates the spirit of inductive support. Reject.

  **Program Officer Summary:**
  Technically, Dr. Thorne has complied with all NICTO mandates regarding criterion specification. The Equivalence Condition is explicit in our founding charter, and the proposal correctly identifies the Satisfaction Criterion over Nicod's. However, I am baffled by the budget request for shoes. If a shoe confirms a raven hypothesis, why do we fund ornithology at all? We could simply audit departmental footwear. Yet, the logic holds under strict Hempelian rules. I recommend funding a pilot study of 50 apples to test administrative capacity for non-raven data. Pending legal review on whether "apple" constitutes "ornithological data" under the National Science Foundation Act. Status: Conditional Approval.
