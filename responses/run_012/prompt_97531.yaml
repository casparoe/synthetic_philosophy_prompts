  I'm putting together a unit for my grad seminar on confirmation theory, and I wanna open with something funny that actually gets the Hempel raven paradox right instead of just repeating the white-shoe bit and stopping. I was talking with a colleague in phil sci about this and we both agreed the standard joke versions are definately missing the actual structure—the equivalence condition, the difference between Nicod-style instantiation and Hempel's satisfaction criterion, the way background knowledge and positive relevance are supposed to do the work. So here's the ask.

  Write me a mock grant proposal, deadpan bureaucratic voice, to a fictional funding body I'm calling the National Institute for Confirmation-Theoretic Ornithology (NICTO). NICTO's latest strategic plan says every application must specify, for each proposed observation, which hypothesis it confirms and by which criterion (instantiation, satisfaction, or a positive-relevance/Bayesian measure). The PI is an invented ornithologist who has realized that the hypothesis that all ravens are black is logically equivalent to its contrapositive, so they are requesting a large budget to observe non-black non-ravens—red apples, white shoes, blue coffee mugs, etc.—and to count each as a confirming instance. The proposal should include a project summary, a methodology section, a budget justification with absurd line items, and a broader impacts section; about 600 words total. Then add a one-paragraph reviewer's comment from a Bayesian who is not impressed, and a one-paragraph program officer's summary that is either baffled or weirdly enthusiastic. The jokes have to come from the actual logic—why the white shoe feels like it shouldn't count, what the equivalence condition really licenses, where the background-knowledge fix comes in—so that someone who teaches this stuff laughs and someone who's never heard of the paradox can still follow what's happening. Don't let it turn into a generic anti-academia thing; the target is the naive confirmation theory, not universities. And please don't make the PI a strawman who is just stupid—they should be someone who has followed a real principle to an absurd place.
