      *   Nicod's Criterion: Observing an instance that fits (e.g., a black raven) confirms.
      *   The Paradox: Observing a white shoe (non-black, non-raven) confirms ~H, therefore confirms H.
      *   The "Fix" (often Bayesian/Background Knowledge): While logically confirming, the *degree* of confirmation is negligible because there are vastly more non-black things than ravens. Or, relative to background knowledge, the shoe tells us nothing new about ravens.
