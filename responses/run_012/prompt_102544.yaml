  **Tier 1**
  **Sacred-Floor-First: 9/10**
  It lexically prioritizes the existential constraint before dividing surplus, ensuring viability without sacrificing all equity.

  **Tier 2**
  **Maximin-KS: 7/10**
  It protects the weaker party's relative gains but may still violate an absolute minimum if that floor exceeds the disagreement point.
  **Egalitarian: 6/10**
  It prioritizes equal outcomes but collapses if utility scales are not perfectly comparable or calibrated.

  **Tier 3**
  **Kalai-Smorodinsky: 5/10**
  It respects monotonicity but blindly follows the ideal point ratio without honoring hard survival constraints.

  **Tier 4**
  **Nash: 3/10**
  It maximizes aggregate product at the expense of the vulnerable and fails to converge uniquely on non-convex frontiers.

  **Constitution Endorsement:** I would endorse the **Sacred-Floor-First** rule because a constitution must guarantee survival before it worries about optimality, and this rule explicitly hardens the vulnerable party's walk-away point into a right rather than a variable.

  **Nonstarter:** The **Nash** solution is a nonstarter because its reliance on convexity for uniqueness and its willingness to sacrifice the minimum payoff for total product growth make it ethically unstable for this specific setting.
