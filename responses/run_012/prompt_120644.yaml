  **PHILOSOPHY OF THE SOCIAL SCIENCES: FINAL EXAMINATION**

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25 (This question carries 25 marks)
  **Instructions:** Answer the following question. You are not required to provide citations, references, or specific numerical data from external sources. All necessary factual context is provided within the question.

  **Question:**

  Both Sweden and Norway possess among the most extensive welfare states in the world and both sit near the top of most comparative rankings of democracy and freedom, such that coarse rankings cannot discriminate between them. However, specific policy arrangements differ: on some measures Sweden has gone further in marketising public provision—the independent "free schools" financed by public vouchers are the standard example—while Norway has retained some conspicuously state-directed arrangements, such as the state alcohol monopoly and membership of the European Economic Area rather than the European Union.

  Given these facts, answer the following: **Which neighbour is more liberal, Sweden or Norway, and what would settle it?**

  In your response, you must address whether "liberal" refers to a single quantity or competing constructs, how one might aggregate conflicting indicators, and whether the dispute admits of a determinate answer waiting to be discovered or can be resolved only by stipulation. If you argue it is resolved by stipulation, you must assess whether such a stipulation answers the question or changes the subject.

  ***

  **MODEL ANSWER**

  There is no fact of the matter regarding which country is more liberal independent of a prior stipulation defining the construct of "liberalism." The question appears empirical but is ontologically indeterminate until the metric is calibrated, because the term "liberal" fractures into competing dimensions that point in opposite directions for these specific cases.

  To treat "liberalism" as a measurable quantity requires construct validity. In political science, this concept typically splits into at least two distinct senses: classical liberalism and social liberalism. Classical liberalism prioritizes limited state intervention, market discretion, and economic freedom. By this metric, Sweden appears more liberal due to its voucher-based free schools, which introduce market mechanisms into public provision. Conversely, social liberalism prioritizes permissiveness, minority protection, and freedom from moralistic regulation. Here, the comparison is complex, but Norway's retention of the state alcohol monopoly suggests a stronger paternalistic stance than Sweden's, potentially marking Norway as less liberal in the social-permissive sense. However, Norway's choice to remain outside the EU (via the EEA) could be interpreted as a defense of national sovereignty (a classical liberal trait) or as protectionism (an illiberal trait), demonstrating that even individual indicators are theory-laden.

  The core difficulty is not data availability but aggregation. Even if we accept the free schools as evidence of Swedish market liberalism and the alcohol monopoly as evidence of Norwegian state paternalism, we lack a conversion rate between these dimensions. Is a unit of market freedom equivalent to a unit of social permissiveness? To answer "which is more liberal" requires a weighting scheme. If one weights economic discretion heavily, Sweden wins. If one weights protection from market commodification heavily (a different conception of freedom), Norway might win. A student reciting V-Dem scores fails here because those indices have already made these weighting choices implicitly. To rely on them is to outsource the philosophical calibration to a third party without examining the instrument.

  This leads to the question of what would settle the dispute. Since there is no mind-independent quantity "liberalism" waiting to be measured like mass or length, the dispute cannot be settled by discovery. It can only be settled by stipulation. We must define the operational criteria: "For the purpose of this comparison, liberalism is defined as X."

  However, stipulation raises the final philosophical hurdle: does this answer the question or change the subject? If the ordinary language concept of "liberal" is essentially contested, then stipulating a definition does not resolve the original ambiguity; it replaces it with a precise technical term. If I stipulate that liberalism means "market freedom," and conclude Sweden is more liberal, I have not answered who is more "liberal" in the contested public sense; I have answered who is more "market-liberal." Therefore, the only honest answer is that the question is ill-formed. It demands a ranking where none exists without first imposing a value judgment on what counts as freedom. The dispute is settled not by finding the truth, but by deciding which truth matters. Thus, the instrument does not measure the quantity; the definition of the quantity dictates the instrument.

  ***

  **MARKING SCHEME**

  | Point | Criteria for Full Marks (A-Level Move) | Typical B-Level Shortfall (Note) |
  | :--- | :--- | :--- |
  | **1. Conceptual Distinction** | **5 Marks:** Explicitly identifies and defines the tension between classical (economic) and social (permissive) liberalism as distinct constructs. | Candidates often treat "liberal" as a single scalar value or conflate the two senses without noting their divergence. |
  | **2. Application of Evidence** | **5 Marks:** Correctly maps the provided factual details (free schools vs. alcohol monopoly/EEA) to the opposing constructs rather than treating them as uniform evidence. | Candidates list the factual differences but fail to link specific policies to specific dimensions of liberalism. |
  | **3. Aggregation Problem** | **5 Marks:** Argues that comparing the countries requires a weighting scheme or trade-off rule between dimensions, noting the lack of a natural conversion rate. | Candidates assume dimensions can be summed automatically or claim comparison is impossible without explaining the aggregation barrier. |
  | **4. Discovery vs. Stipulation** | **5 Marks:** Asserts that the answer cannot be discovered empirically and requires a prior stipulative definition of the construct to be meaningful. | Candidates argue the answer is "subjective" or "opinion" rather than identifying the need for operational stipulation. |
  | **5. Subject Change Analysis** | **5 Marks:** Evaluates whether stipulation resolves the query or changes the subject, concluding that technical definitions replace rather than solve contested concepts. | Candidates accept stipulation as a solution without questioning whether the technical term matches the ordinary language question. |
