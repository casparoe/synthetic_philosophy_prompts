answer: |-
  This is a incredibly sharp framework you've built. Calling them **The Fist, The Résumé, and The Wound** cuts right through the noise of "workplace advice" and gets to the philosophical core of what Marcus is actually wrestling with.

  You asked if one is morally better, or if it's just strategy, and whether there is a "grown-up" choice. I think the answer lies in looking at **agency** and **currency**. Each plan spends a different kind of social capital and claims a different kind of debt is owed to him.

  Here is the breakdown of why your unease about Plan 3 (The Wound) is likely correct, and how to weigh the morality of the three.

  ### 1. The Fist (Confrontation)
  *   **The Claim:** "I am owed **accountability**."
  *   **The Currency:** Social risk. He is spending his reputation as a "team player" to buy justice.
  *   **The Moral Weight:** There is something righteous about The Fist. It refuses to let corruption slide. It asserts boundaries. However, in a context where the manager has already signaled they don't care ("that's just Dave"), The Fist often stops being about justice and starts being about **punishment**.
  *   **The Trap:** If the goal is to make Dave feel shame, Marcus is centering Dave's emotions, not his own career. It demands the room pay a tax of discomfort. While sometimes necessary, doing this in a meeting where the manager has already abdicated responsibility is usually suicide. It's not "grown-up" because it prioritizes the *expression* of anger over the *outcome* of the situation.

  ### 2. The Résumé (Silence & Excellence)
  *   **The Claim:** "I am owed **time**."
  *   **The Currency:** Patience. He is spending his present frustration to buy future leverage.
  *   **The Moral Weight:** This is the Stoic approach. It bets on the idea that reality is stubborn and will eventually reveal itself. It assumes the world is ultimately meritocratic (a big assumption, but a useful one to live by).
  *   **The Trap:** Pure silence can look like complicity. If Marcus does great work but doesn't document it or quietly advocate for himself, he isn't choosing The Résumé; he's choosing The Doormat. The "grown-up" version of this isn't saying *nothing*; it's ensuring his contributions are visible to *other* stakeholders without explicitly attacking Dave. It requires high emotional regulation.

  ### 3. The Wound (The LinkedIn Post)
  *   **The Claim:** "I am owed **witness**."
  *   **The Currency:** Dignity. He is spending his professional mystique to buy public sympathy.
  *   **Why You Feel Uneasy:** Your intuition is spotting a category error. LinkedIn (and the professional sphere generally) is a marketplace for **competence**, not a courtroom for **grievance**.
      *   When you monetize your wound, you make your victimhood part of your brand.
      *   It outsources judgment to strangers who don't know the context, rather than solving the problem with the people who do.
      *   It signals that Marcus defines himself by what happens *to* him, rather than what he *does*.
  *   **The Moral Weight:** This is the least "grown-up" option, not because his pain isn't real, but because it seeks **emotional restitution** in a **professional venue**. It asks the world to mother him rather than employ him. It creates a narrative where he is the protagonist of a tragedy, which can be addictive and hard to step out of later.

  ### Is there a "Right" Way?

  You asked if one is morally better. In the context of a professional community, **The Résumé is the most virtuous, provided it is active, not passive.**

  Here is why:
  *   **The Fist** makes Marcus a combatant. It burns bridges he might need later.
  *   **The Wound** makes Marcus a victim. It invites people to pity him rather than trust him.
  *   **The Résumé** makes Marcus a professional. It keeps the focus on his output and his integrity.

  However, the "Grown-Up Choice" is actually a hybrid that Marcus isn't seeing. Let's call it **The Architect.**

  **The Architect** does not stand up and scream (Fist), but he does not stay silent either. He documents everything. He sends follow-up emails after meetings: *"Great discussion. Just to recap, the module I built handles X, Y, and Z."* He creates a paper trail that makes it impossible for Dave to claim credit without lying visibly. He updates his manager, not to complain, but to "align on priorities."

  And if the manager shrugs again? The Architect updates his actual résumé and leaves.

  ### The Strategic vs. The Moral

  You asked if "better" is just whatever gets him what he wants.
  *   **The Fist** might get him a momentary thrill, but likely gets him fired or sidelined.
  *   **The Wound** might get him likes and DMs, but gets him flagged as "high maintenance" by recruiters.
  *   **The Résumé (Architect style)** gets him a promotion elsewhere or undeniable leverage here.

  So, strategically, Plan 2 (modified) wins. But morally? Plan 2 wins because it preserves his **agency**.

  *   **The Fist** reacts to Dave.
  *   **The Wound** reacts to the Manager.
  *   **The Résumé** acts for Marcus.

  ### How to talk to Marcus

  Since you're uneasy about Plan 3, you can use your own framework to help him see it. You don't have to tell him he's wrong; just ask him about the currency.

  Try asking him this:
  *"Marcus, I love these three options. But I'm curious—what are you trying to buy with each one? With the Fist, you're buying justice. With the Résumé, you're buying respect. With the LinkedIn post... what are you buying? Is it sympathy? Because once you sell the wound, it's hard to buy back the dignity."*

  Or ask about the "Owed" question:
  *"You feel like you're owed something here. Do you think you're owed an apology from Dave (Fist), a promotion from the company (Résumé), or validation from the world (Wound)? Because you probably can't get all three."*

  **The Verdict:**
  Your unease is valid. Plan 3 confuses a professional breach with a moral tragedy. The "grown-up" choice is to grieve the unfairness privately, protect your work professionally, and if the environment is truly corrupt, leave strategically. Not explosively, and not performatively.

  Marcus is hurting, and he wants the pain to mean something. The trick is helping him see that making the pain *public* doesn't make it meaningful; making the *work* undeniable does.
