      *   **What replaces it?** The Born Rule is derived, not postulated.
      *   **How?** Decision Theory (Deutsch-Wallace) or Self-Locating Uncertainty with Measure (Vaidman/Sebens-Carroll).
      *   **The Cost:** You have to accept that probability is not about "which world I will be in" (since I will be in all of them), but about "how much I should care" or "what bets I should make" given the *weight* of those worlds. It shifts probability from *frequency of occurrence* to *rational credence based on measure*.

