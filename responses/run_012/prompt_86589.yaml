      *   (2) + (5): Realism doesn't strictly imply fanaticism, but if moral facts are mind-independent and infinite values are possible (e.g., infinite utility), realism might commit you to them. However, one can be a realist about bounded value. This is a minor tension compared to (4)+(5).
      *   (3) + (5): If moral learning is possible, can you learn that fanaticism is false? Yes. Not a major tension.

