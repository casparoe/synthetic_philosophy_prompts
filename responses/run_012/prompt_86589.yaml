          *   *Why:* MEC is linear. $E = \sum p_i v_i$. If $v_i \to \infty$ and $p_i > 0$, $E \to \infty$. To block this, you need non-linear weighting, truncated values, or probability thresholds. But strict MEC doesn't allow thresholds.
