answer: |-
  Here is a constructed case designed to maximize the tension among your four criteria, followed by the diagnostic analysis and the pragmatic assessment you requested.

  ### The Case: The Terminal Metabolic Construct (TMC)

  Imagine a synthetic system engineered in a laboratory setting, which we will call the **Terminal Metabolic Construct**.

  **Physical Description:**
  The TMC is a microscopic, spherical vesicle enclosed by a semi-permeable lipid membrane. Inside, it contains a minimal, ribozyme-based metabolic network. This network catalyzes the conversion of environmental precursors (supplied in a continuous flow reactor) into energy carriers and waste products. Crucially, the metabolic network also powers ion pumps that maintain an electrochemical gradient across the membrane, and it drives a "repair mechanism" governed by an internal RNA sequence (the specification).

  **Operational Constraints:**
  1.  **Metabolism:** The TMC actively consumes precursors and exports entropy to maintain its internal gradient and structural integrity.
  2.  **Boundary Maintenance:** When the membrane is damaged, the internal repair mechanism recruits free lipid molecules *already present in the environment* to patch the hole. The TMC *cannot* synthesize lipid molecules *de novo*; it can only assemble scavenged parts.
  3.  **Reproduction:** The TMC is chemically cross-linked to prevent fission. It cannot divide. Furthermore, the internal RNA specification is engineered for ultra-high fidelity replication of itself *within* the vesicle, but it lacks the machinery to package and export copies. There is no heredity, no variation, and no lineage.
  4.  **Persistence:** The system is designed with no senescence program. As long as the flow reactor supplies precursors and scavengable lipids, the TMC can theoretically persist indefinitely, repairing damage and maintaining its boundary without change.

  ### Application of the Criteria

  Let us apply your four criteria to the TMC.

  1.  **Metabolic Criterion:** **YES.**
      The TMC is a bounded system far from thermodynamic equilibrium. It continuously takes in energy/matter and exports entropy. By this definition, it is indistinguishable from a living cell.

  2.  **Evolutionary Criterion:** **NO.**
      The TMC is a dead end. It does not reproduce. It does not belong to a lineage capable of open-ended evolution (it was synthesized *de novo*, and its population cannot vary or adapt). It lacks the historical and population-level properties required by this criterion.

  3.  **Autopoietic Criterion:** **NO.**
      This is the critical friction point. While the TMC maintains its boundary, it does not *produce* the components of that boundary. It scavenges lipids from the environment and assembles them. In strict autopoietic theory (Maturana and Varela), a system is autopoietic only if it produces the very components that constitute the network that produces them. Because the TMC relies on external provision of boundary *components* (not just energy/precursors), it is organizationally "allopoietic" (made by others/environment) regarding its boundary, even if it is self-maintaining regarding its boundary *integrity*.

  4.  **Your Criterion (The "Monastic" Criterion):** **YES.**
      (a) It actively maintains a boundary (via ion pumps and repair).
      (b) It carries an internal specification (the RNA repair script).
      (c) It persists indefinitely without reproducing.
      The TMC is the *exact* target of this definition.

  **The Split:**
  We have a **2-vs-2 disagreement**.
  *   **Life:** Metabolic Criterion, User's Criterion.
  *   **Not Life:** Evolutionary Criterion, Autopoietic Criterion.

  This is not a borderline case where the features are vague; the features are engineered to be binary. The TMC *definitely* metabolizes and *definitely* does not reproduce. The disagreement is structural.

  ### Diagnosis of the Conceptual Issue

  You ask whether this disagreement is verbal, a genuine indeterminacy (Sorites), or a category mistake regarding the function of the criteria.

  **Diagnosis:** The disagreement indicates that the criteria are **not rivals answering the same question.** They are operationalizations of different ontological commitments. Asking which one "gets it right" is a category mistake.

  **Reasoning:**
  1.  **Not Verbal:** If this were merely verbal, we could resolve it by stipulating a definition. But the tension remains because each definition tracks a different *phenomenon*. The Metabolic criterion tracks *thermodynamic distinctness*. The Evolutionary criterion tracks *historical continuity and adaptability*. The Autopoietic criterion tracks *organizational closure*. Your criterion tracks *functional persistence without propagation*. The TMC possesses the thermodynamic and functional properties of life but lacks the historical and organizational properties. No amount of semantic clarification will make these properties coincide in this specific case.
  2.  **Not Indeterminacy (Sorites):** A Sorites paradox arises from vagueness (e.g., "how many grains make a heap?"). Here, there is no vagueness. The TMC either synthesizes its lipids or it does not. It either divides or it does not. The disagreement is not due to a fuzzy boundary in the concept of life, but due to the fact that "Life" is being asked to carry four different theoretical loads simultaneously.
  3.  **The Category Mistake:** The error lies in assuming there is a single natural kind "Life" that these criteria are all attempting to carve at the same joints. The TMC reveals that "Life" is a **cluster concept**. The criteria identify four different dimensions of "liveness."
      *   C1 asks: Is it a distinct thermodynamic object?
      *   C2 asks: Is it a unit of selection?
      *   C3 asks: Is it organizationally closed?
      *   C4 asks: Is it a persistent, specified individual?

      The TMC shows that these dimensions can come apart. Therefore, the conflict is not a failure of definition, but a revelation that the concept is multidimensional. To ask "Is the TMC *really* alive?" is to ask "Which dimension matters most?" without specifying the context.

  **What would have to be true for a different diagnosis?**
  *   For the **Verbal** diagnosis to hold: We would need to show that the proponents of C2 and C3 actually meant the same thing as C1 but used different words. (Clearly false; evolutionary biologists do not mean "thermodynamic equilibrium" when they speak of life).
  *   For the **Indeterminacy** diagnosis to hold: We would need a case where it is unclear whether the system is metabolizing or reproducing. (Here, it is clear; they simply point in different directions).

  ### The Pragmatic Question: Biosafety and Planetary Protection

  You ask whether selecting a criterion based on purpose (e.g., biosafety vs. planetary protection) is a principled resolution or merely changing the subject.

  **Verdict:** It is a **principled resolution**, and it does not change the subject; rather, it correctly identifies the subject as *risk management* rather than *ontology*.

  **Reasoning:**
  In the context of planetary protection or biosafety, the question "Is this life?" is never asked for the sake of metaphysical categorization. It is asked to determine **how to treat the entity.**

  1.  **Planetary Protection (Forward Contamination):**
      *   *Goal:* Prevent biological contamination that could compromise the search for extraterrestrial life or disrupt an alien ecosystem.
      *   *Relevant Criterion:* **Evolutionary (C2).**
      *   *Why:* The primary risk of biological contamination is *adaptation*. A sterile, non-evolving metabolic construct (like the TMC) might contaminate a site chemically, but it will not adapt to new niches, outcompete native forms, or evolve resistance to sterilization. If your protocol uses C2, the TMC is "Not Life," and the sterilization protocols can be less stringent (chemical cleaning vs. biological sterilization). This is not arbitrary; it is proportional to the risk of *biological* invasion.

  2.  **Biosafety (Containment):**
      *   *Goal:* Prevent harm to researchers or the environment from hazardous agents.
      *   *Relevant Criterion:* **Metabolic (C1) or User's (C4).**
      *   *Why:* If the TMC produces a toxin or consumes oxygen in a closed room, it is hazardous regardless of whether it evolves. If your protocol relies only on C2, you might classify the TMC as "safe" because it doesn't reproduce, leading to a breach where the metabolic activity harms the host. Here, C1 or C4 is the principled choice because it tracks the *immediate physical impact*.

  **Does this rescue the concept?**
  It rescues the concept from **essentialism** but admits it is **interest-relative**.
  If you insist that "Life" must have a single, context-independent definition, then the divergence of criteria in the TMC case proves the concept is broken. However, if you view "Life" as a **regulatory category** (like "Vehicle" or "Drug"), then the divergence is expected. A bicycle is a "vehicle" for traffic laws but not for shipping logistics.

  **Conclusion:**
  The choice among criteria is legitimate when tied to the **consequence of classification**.
  *   If the consequence concerns *long-term ecological impact*, use C2.
  *   If the consequence concerns *immediate chemical/thermodynamic interaction*, use C1.
  *   If the consequence concerns *containment of persistent agents*, use C4.

  To treat the choice as "arbitrary" implies there is a "true" classification we are ignoring. To treat it as "changing the subject" implies we should be doing ontology instead of safety engineering. The principled view is that in applied contexts, **ontology follows function.** The TMC forces us to admit that "Life" is not a property of the object alone, but a relation between the object's capacities and the observer's concerns.

  This does not weaken the science; it clarifies the protocol. You are not deciding what the TMC *is*; you are deciding what risks it *poses*. The four criteria are not definitions of a thing, but detectors for different kinds of risk.
