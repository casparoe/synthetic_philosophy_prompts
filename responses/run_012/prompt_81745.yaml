ne coat. What I want is the principle, or the smallest set of principles, that actually generates these verdicts, with the case that motivates each clause, what it predicts about a case I have not listed, and an honest statement of which verdict I have to give up.

  Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction and no conclusion; state the principle itself in the first item and the verdict you cannot save in the last. American English, please.
