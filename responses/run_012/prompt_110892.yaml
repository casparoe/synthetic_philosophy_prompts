answer: |-
  ### (1) Exam Question

  **Time Allowed:** 50 Minutes
  **Total Marks:** 25

  **Question 1**

  **Case:** Ben reads Ada's private journal without permission. Ada confronts Ben, blaming him for the betrayal. Ben replies, "You did the exact same thing to your sister two years ago." Ada responds: "Yes, but I did it to confirm she was being abused. I knew it was pro tanto wrong, but it was justified. Your snooping was mere nosiness."

  Consider the following modifications to the case:
  *   **(V1)** Ada is not the victim; she is a bystander who learned Ben read a *third party's* journal.
  *   **(V2)** Ada has never read a journal, but admits: "If I were in your exact situation, I would have done the same thing."

  **Task:**
  Write an essay addressing the following:
  1.  Does Ada's past conduct (or counterfactual willingness) constitute hypocrisy that negates her **standing** to blame? Distinguish clearly between Ben's *blameworthiness* and Ada's *standing*.
  2.  Does it matter if Ada was justified in her past conduct, or if she is the victim versus a bystander (V1)?
  3.  If Ada openly concedes, "I am a hypocrite," does she lose standing, or does the concession restore it? What does this imply about the function of standing?
  4.  **Verdict:** Conclude definitively: Is 'standing' a distinct normative status with a real job, or is it merely a placeholder for other concepts (e.g., sincerity, efficacy, relationship)?

  *Note: Do not cite specific philosophers. Argue from first principles.*

  ***

  ### (2) Model Answer

  The central confusion in debates over standing is the conflation of the *target's culpability* with the *blamer's authority*. Ben is blameworthy if he violated a norm he ought to have followed. That is an objective fact about Ben. Standing, however, is a relational status concerning whether Ada is entitled to hold Ben accountable. To determine if Ada has standing, we must identify what work the concept is doing. If standing adds nothing to blameworthiness, it should be discarded. If it protects a specific normative function, it must be defined.

  Ada's defense relies on a distinction between *act-type* and *justification*. Hypocrisy typically involves condemning another for a violation while exempting oneself from that same condemnation without cause. However, Ada claims her violation was justified. If a norm admits of exceptions (e.g., "do not read journals" yields to "prevent abuse"), then Ada did not violate the *all-things-considered* norm that Ben violated. She violated a pro tanto duty for a greater good; Ben violated it for triviality. Therefore, Ada is not a hypocrite in the relevant sense. She endorses the norm's authority, acknowledging the cost of her breach, whereas Ben treats the norm as non-binding. Standing requires sincere endorsement of the norm, not moral perfection. If standing required perfection, no one could ever blame. Thus, Ada retains standing because her breach does not signal a rejection of the norm's authority.

  In Variant 1 (Bystander), Ada is not the victim. Some argue standing is a right reserved for victims. However, if blaming is a moral practice of upholding shared norms rather than merely seeking redress, victimhood is not strictly necessary. A bystander can have standing if they represent the moral community. If Ada lacks standing here, it suggests standing is about personal grievance, not moral accountability. Given that we routinely allow third-party blame for serious wrongs, Ada likely retains standing as a bystander, provided her commitment to the norm is sincere.

  Variant 2 (Counterfactual) is more damaging. If Ada admits she would do exactly what Ben did in his situation, she concedes that she does not actually hold herself to a higher standard. This undermines the sincerity condition. It suggests she blames Ben not because he violated a norm she respects, but perhaps to elevate herself. This looks like genuine hypocrisy. Here, standing is lost not because Ben is innocent, but because Ada's blame is functionally corrupt; it is no longer an appeal to shared standards.

  This leads to the concession question. If Ada says, "I am a hypocrite," does she lose standing? Paradoxically, admitting hypocrisy might restore a degree of standing. By acknowledging her fault, she re-aligns herself with the norm she violated. She places herself under the same judgment she passes on Ben. This suggests standing is not a static property but a dynamic status maintained by sincerity. The concession shows she respects the norm enough to condemn herself.

  This analysis reveals the specific job standing does. It is not about who is morally worse. It is about the *authority to demand accountability*. Blameworthiness tracks the violation of a duty. Standing tracks the authority to enforce that duty. Without standing, blame becomes mere noise or aggression; with standing, it is a legitimate demand for answerability. Hypocrisy undermines this because it signals the blamer does not recognize the authority they are invoking.

  Therefore, standing is a real normative status. It is distinct from blameworthiness because one can be blameworthy (Ben) while the other lacks the authority to sanction (Ada in V2). It is also distinct from general moral goodness, as justified violators (Ada in the core case) retain it. Standing functions as a gatekeeper for the practice of moral accountability, ensuring that blame remains a tool for upholding norms rather than a weapon for status-seeking. To collapse standing into blameworthiness is to ignore the relational nature of moral address. We must keep the concept, but define it strictly as the authority derived from sincere commitment to the norms one invokes.

  ***

  ### (3) Marking Scheme

  **Total: 25 Marks**

  **1. Distinction between Blameworthiness and Standing (4 Marks)**
  *   **Criteria:** Clearly defines blameworthiness as objective culpability and standing as the authority/entitlement to blame.
  *   **Common Error:** Treating standing as merely "being right" or conflating Ben's guilt with Ada's right to speak.

  **2. Analysis of Justification vs. Hypocrisy (5 Marks)**
  *   **Criteria:** Explains that Ada's justified breach (abuse prevention) does not equal hypocrisy because she still acknowledges the norm's weight, unlike Ben.
  *   **Common Error:** Claiming any past violation equals hypocrisy regardless of justification (the "tu quoque" trap).

  **3. Variant 1: The Bystander Issue (4 Marks)**
  *   **Criteria:** Addresses whether victimhood is required for standing. Argues for/against bystander standing based on the function of blame (norm-upholding vs. grievance).
  *   **Common Error:** Dismissing the variant or assuming victimhood is automatically required without argument.

  **4. Variant 2: Counterfactual Willingness (4 Marks)**
  *   **Criteria:** Identifies that admitting "I would do the same" undermines the sincerity/commitment required for standing, even without past action.
  *   **Common Error:** Ignoring the counterfactual or claiming it doesn't matter because she hasn't *actually* acted yet.

  **5. The Concession Paradox (4 Marks)**
  *   **Criteria:** Analyzes whether admitting hypocrisy restores standing (via re-alignment with the norm) or cements the loss of it. Links this to sincerity.
  *   **Common Error:** Treating the concession as a simple apology that fixes everything, or ignoring it entirely.

  **6. Final Verdict on the Reality of Standing (4 Marks)**
  *   **Criteria:** Takes a definitive stance (Standing is real/functional OR Standing is a placeholder). Justifies the view based on the preceding analysis.
  *   **Common Error:** Fence-sitting (e.g., "It depends on what you mean by standing") or concluding standing is irrelevant without explaining what replaces it.
