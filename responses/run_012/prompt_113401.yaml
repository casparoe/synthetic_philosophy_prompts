answer: |-
  Dear Colleagues,

  I am circulating this memo ahead of our vote on the quantum optics proposal to clarify my reasoning and to propose a specific course of action that respects both the constraints of our budget and the integrity of the science before us. As you know, we are faced with a request that is effectively two projects wrapped in one envelope: a theoretical derivation of the Born rule within a no-collapse framework, and an experimental measurement of decoherence in a mesoscopic superposition. Our discretionary budget this cycle is sufficient to fund one half or the other, but not both. This financial constraint forces us to make a distinction that I believe is physically artificial, yet we must decide where our money will do the most work. I recommend that we fund the experimental half of the proposal, subject to a condition I will outline below, and I want to explain why this is the only decision that honors the science without overstepping our mandate.

  We must begin by giving the strongest possible weight to the arguments against funding the theoretical half. Two of you have rightly pointed out that this derivation risks falling outside the boundaries of physics as our foundation supports it. The applicant asks us to fund a proof that relies on an axiom of indifference across branches, asserting that a rational agent's preferences should not depend on which branch they occupy. Our referee, a statistical mechanic of considerable stature, argues that this premise is circular. He contends that the axiom is chosen precisely because it yields the Born rule, and that deriving how an agent should bet does not explain why there are facts about probability at all. This is a devastating critique if true. If the axiom is merely a disguised assumption of the conclusion, then the work is mathematics or philosophy, not physics. It becomes a consistency check on a particular worldview rather than a discovery about the world. Furthermore, the applicant's rebuttal—that refusing the axiom leads to unstable preferences—appeals to rationality rather than empirical evidence. We are not in the business of funding arguments about what a rational agent should believe in a multiverse that we cannot observe. To fund this half alone would be to endorse a metaphysical dispute under the guise of theoretical physics, and it would leave us open to the charge that we are supporting speculation that no result could count against.

  However, we must also give full weight to the argument against funding the experimental half. One of you has suggested that this work is expensive plumbing in the service of a metaphysical dispute. The applicant concedes that the experiment cannot discriminate between interpretations of quantum mechanics. If the outcome is compatible with standard quantum theory regardless of whether the wavefunction collapses or branches, then what are we buying? Decoherence measurements are difficult and costly, requiring precise control of cold atoms and isolation from environmental noise. If the result does not rule out a competing theory, if it does not distinguish between the many-worlds view and the Copenhagen view, then it risks being a technical triumph with no conceptual payoff. To spend our limited resources on a measurement that leaves the foundational dispute exactly where it found it is a hard case to make. There is a strong prudential argument here for preserving the money for a future cycle where a proposal might offer a clearer path to empirical discrimination.

  My own view, which I ask you to consider carefully, is that the clean separation between these two halves is illusory. The applicant claims the derivation is physics rather than philosophy precisely because it makes contact with decoherence dynamics. He argues that the indifference axiom is grounded in the physical stability of the branches. If the branches decohere too slowly, or if the dynamics do not support the symmetry he requires, the derivation fails. Conversely, the experiment is only interesting because of the interpretation. Without the theoretical framework suggesting that the dynamical assumptions are critical to the emergence of probability, this is just another decoherence measurement. The theory gives the experiment its stakes, and the experiment gives the theory its physical anchor. To fund one without the other is to cripple the project, but since we must choose, we must choose the half that keeps the anchor in the water.

  I recommend we fund the experimental half. I do not make this recommendation because our charter funds empirical science and is silent on foundations, though that is true. I make it because the experiment is the only part of this proposal that subjects the theoretical claims to the risk of being wrong. The applicant rests his derivation on dynamical assumptions about how superpositions decay. The proposed measurement tests those assumptions. If the data shows that decoherence behaves differently than the derivation requires, the theoretical edifice collapses. That makes this empirical science. It is not merely plumbing; it is a stress test of the physical prerequisites for a major theoretical claim. By funding the experiment, we are not funding the metaphysics; we are funding the physical constraint upon which the metaphysics depends. This satisfies the concern that the theory is circular by demanding that its physical premises hold up in the laboratory.

  To ensure this remains true, I propose we fund the experiment subject to a specific condition. The grant should be renewed for the second and third years only upon a mid-term review confirming that the data obtained constrains the dynamical parameters relevant to the theoretical derivation. The applicant must demonstrate, by the end of the first year, that the measured decoherence rates are being analyzed specifically against the stability conditions required by the indifference axiom. If the experiment drifts into generic characterization of noise without reference to the theoretical constraints that justify its expense, we should halt funding. This condition ensures that the experiment remains tethered to the physics that makes it meaningful, preventing it from becoming the expensive plumbing our colleague fears.

  This decision acknowledges that the theory is the soul of the project but the experiment is the body we can support. It respects the referee's warning that the axiom may be circular by insisting that the physical ground it stands on be verified. It respects the concern about cost by ensuring the measurement is not generic but targeted at a specific theoretical vulnerability. It avoids sheltering behind the charter by arguing that this experiment is physics because it tests the limits of a theoretical framework, not because it avoids foundations. We are not voting on whether the many-worlds interpretation is true. We are voting on whether the physical assumptions required to make sense of it are valid. That is a question we can answer with data, and it is the only part of this proposal that allows us to do so. I ask that you support this recommendation so that we can fund the work that keeps the speculation honest.
