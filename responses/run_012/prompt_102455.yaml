  # Taxonomy of Responses to the Murderer-at-the-Door

  **Q1: Does the moral prohibition attach strictly to asserting what one believes false, or to any intentional production of false belief?**
  *(Sorts: The plain lie vs. the true-but-misleading deflection; the flat refusal to answer)*

  *   **Branch A (Assertion Only):** The wrong is lying; misleading truth or silence is permitted.
      *   **Q2: Is the duty to speak truth owed to the person addressed (forfeitable by misconduct) or to the speaker's own dignity/standard (non-forfeitable)?**
      *(Sorts: The murderer who is a magistrate; the consent case)*

      *   **Branch A1 (Owed to Hearer):** The hearer has a claim-right to truth which misconduct can void.
          *   **Q3: Do consequences enter into the specification of the duty, or do they merely weigh against it?**
          *(Sorts: The courtesy lie; the lie told to save the speaker; the danger-to-asker case)*

          *   **Leaf 1: Moderate Contractualism.**
              *   *Position:* One must not lie to those who retain their claim to the truth, unless consequences specify a competing duty.
              *   *Awkward Commitment:* You must calculate the precise threshold of harm required to void a standing right to truth.
          *   **Leaf 2: Rights Absolutism.**
              *   *Position:* One must not lie to any rights-bearer, regardless of consequences, unless they have forfeited that right.
              *   *Awkward Commitment:* You must tell the truth to the magistrate even if it condemns an innocent person, provided he has not forfeited his office.

      *   **Branch A2 (Owed to Speaker/Standard):** The duty is internal to the speaker or the practice of assertion itself.
          *   **Q4: Do consequences enter into the specification of the duty, or do they merely weigh against it?**
          *(Sorts: The danger-to-asker case; the courtesy lie)*

          *   **Leaf 3: Kantian Integrity.**
              *   *Position:* One must not assert what one believes false, as this violates the speaker's rational nature or the practice of assertion.
              *   *Awkward Commitment:* **[FLAGGED PAIR]** This leaf holds both "Duty to Dignity" and "Duty to Practice" views; separating them requires asking whether the wrong survives if no one is deceived.
          *   **Leaf 4: [UNOCCUPIED].**
              *   *Position:* One must not assert falsehoods, unless consequences specify otherwise.
              *   *Status:* **Unattractive:** It is incoherent to ground a duty in speaker dignity then allow consequences to override it.

  *   **Branch B (Belief Production):** The wrong is deception; misleading truth or silence is prohibited if deceptive.
      *   **Q5: Is the duty to avoid deception owed to the person addressed (forfeitable) or to the speaker's own dignity/standard (non-forfeitable)?**
      *(Sorts: The magistrate; the consent case)*

      *   **Branch B1 (Owed to Hearer):** The hearer has a claim-right not to be deceived which misconduct can void.
          *   **Q6: Do consequences enter into the specification of the duty, or do they merely weigh against it?**
          *(Sorts: The courtesy lie; the self-saving lie)*

          *   **Leaf 5: Moderate Deceptionism.**
              *   *Position:* One must not deceive those who retain their claim, unless consequences specify a competing duty.
              *   *Awkward Commitment:* You are forbidden from remaining silent if your silence will mislead a non-forfeiting hearer.
          *   **Leaf 6: Deceptive Rights Absolutism.**
              *   *Position:* One must not deceive any rights-bearer, regardless of consequences, unless they have forfeited that right.
              *   *Awkward Commitment:* You must not mislead the murderer even by silence, provided he retains a right not to be deceived.

      *   **Branch B2 (Owed to Speaker/Standard):** The duty is internal to the speaker or the practice of communication itself.
          *   **Q7: Do consequences enter into the specification of the duty, or do they merely weigh against it?**
          *(Sorts: The danger-to-asker case)*

          *   **Leaf 7: [UNOCCUPIED].**
              *   *Position:* One must not deceive, as this violates the speaker's nature or the practice of communication.
              *   *Status:* **Unoccupied:** No major theorist extends the dignity-based prohibition from lying to all deception.
          *   **Leaf 8: [UNOCCUPIED].**
              *   *Position:* One must not deceive, unless consequences specify otherwise.
              *   *Status:* **Unattractive:** It is incoherent to ground a duty in speaker dignity then allow consequences to override it.

  ***

  **Note on the Consent Case:** In all occupied leaves (1, 2, 3, 5, 6), the hidden person's consent to be lied about is irrelevant; the tree sorts positions where the duty is owed either to the *hearer* (who has not consented) or the *speaker/practice* (which cannot be waived by a third party). To separate a position where the duty is owed to the *hidden person*, a further branch question would be required.
