answer: |-
  ### Essay Question

  **The Dissociation of Function and Phenomenology**

  Consider the following variation on Jackson's Knowledge Argument. Mary, a neuroscientist confined to a black-and-white room, knows all physical facts about color vision. Before her release, a surgeon installs an implant that restores every downstream capacity associated with seeing red: she can sort red objects, deploy the concept RED, imagine redness, and reason about it exactly as an ordinary perceiver does. However, the implant bypasses phenomenal machinery; she never has a reddish experience. Call her *Implant Mary*.

  Conversely, consider Mary's sister, *Locked-In Sister*. Her visual system produces full, ordinary reddish experiences, but a lesion strips away all downstream capacities. She has the experience but cannot sort, name, imagine, or recall it. Both women know all physical facts.

  Write an essay addressing the following: Does Implant Mary know what it is like to see red? Does Locked-In Sister? Use these cases to evaluate the **Ability Hypothesis** and the **Phenomenal Concept Strategy (PCS)**. Which theory better accommodates the intuitions generated by this pair? You must commit to a verdict regarding which theory survives this dual challenge and explain why.

  ***

  ### Model Answer

  The standard Knowledge Argument suggests that physicalism is false because Mary learns something new upon release. Physicalists typically respond by denying she learns new *facts*, arguing instead that she gains abilities (Ability Hypothesis) or grasps new concepts (Phenomenal Concept Strategy). The case of Implant Mary and Locked-In Sister dissociates phenomenal experience from functional capacity, forcing these theories to reveal their vulnerabilities.

  Implant Mary possesses all functional abilities associated with red without the phenomenology. The Ability Hypothesis identifies "knowing what it is like" with possessing discriminatory and imaginative abilities. Consequently, the Ability Hypothesis must verdict that Implant Mary *does* know what it is like to see red. This is counterintuitive. Implant Mary is, regarding redness, a functional zombie; she behaves as if she sees red but lacks the subjective feel. If the Ability Hypothesis implies she possesses knowledge of the experience without the experience itself, it severs the essential link between phenomenal knowledge and phenomenology. It reduces "what it is like" to "what one can do," failing to capture the intrinsic nature of the experience. Thus, Implant Mary constitutes a decisive counterexample to the Ability Hypothesis.

  Locked-In Sister presents the inverse problem: she possesses the phenomenology without the functional capacities. The Phenomenal Concept Strategy (PCS) argues that Mary gains a phenomenal concept that refers directly to her experience. A challenge arises: does Locked-In Sister possess a concept if she cannot deploy it in reasoning, memory, or classification? If concept possession requires cognitive access or downstream utility, PCS must verdict that Sister does *not* know what it is like (in the propositional sense). However, intuition suggests that having the experience is sufficient for knowing what it is like, regardless of cognitive lockdown.

  Despite this pressure, PCS handles the pair better than the Ability Hypothesis. A sophisticated PCS can argue that phenomenal concepts are grounded in the *presence* of experience, not the ability to manipulate it. Sister's experience itself serves as the referent; her inability to use the concept downstream is a performance error, not a lack of understanding. She possesses the concept demonstratively, even if she cannot store it. In contrast, the Ability Hypothesis cannot easily argue that Implant Mary lacks the abilities; by stipulation, she has them. The Ability Hypothesis is forced to deny the intuition that experience is necessary for phenomenal knowledge. PCS, however, can maintain that experience is necessary (which Sister has) and that concepts are the mode of presentation (which Sister arguably retains via direct acquaintance).

  Therefore, the Phenomenal Concept Strategy offers the more robust defense. While Locked-In Sister complicates the conditions for concept possession, Implant Mary falsifies the core identity claim of the Ability Hypothesis. Physicalism is best served by a theory that treats phenomenal knowledge as conceptually distinct but ontologically physical, grounded in experience rather than mere functional output.

  ***

  ### Marking Scheme (20 Points Total)

  **1. Accurate Reconstruction of the Case (4 points)**
  *   **4 pts:** Clearly distinguishes Implant Mary (abilities, no experience) from Locked-In Sister (experience, no abilities) and notes both know physical facts.
  *   **3 pts:** Minor confusion on which sister lacks experience vs. abilities.
  *   **2 pts:** Fails to mention one of the two sisters or their specific constraints.
  *   **1 pt:** Treats the prompt as standard Mary's Room without the variant details.
  *   *Common Error:* Students conflate the two sisters or forget that both know the physical facts beforehand.

  **2. Analysis of Implant Mary vs. Ability Hypothesis (5 points)**
  *   **5 pts:** Identifies that AH implies Implant Mary *knows* what it's like (due to abilities) and argues this is a fatal counterintuitive result.
  *   **4 pts:** Identifies the implication but offers a weak critique of why it's problematic.
  *   **3 pts:** Summarizes AH without applying it specifically to Implant Mary's lack of experience.
  *   **2 pts:** Claims AH says Implant Mary does *not* know (misunderstanding the theory).
  *   **1 pt:** No mention of Ability Hypothesis.
  *   *Common Error:* Students argue Implant Mary *does* have experience, contradicting the prompt's stipulation.

  **3. Analysis of Locked-In Sister vs. Phenomenal Concept Strategy (5 points)**
  *   **5 pts:** Identifies the tension: Sister has experience but arguably lacks usable concepts; discusses whether PCS can accommodate "inactive" concepts.
  *   **4 pts:** Identifies the tension but resolves it too quickly without analyzing concept possession conditions.
  *   **3 pts:** Summarizes PCS without applying it to Sister's cognitive lesion.
  *   **2 pts:** Claims PCS fails completely without exploring the "direct reference" defense.
  *   **1 pt:** No mention of PCS.
  *   *Common Error:* Students assume concepts *require* linguistic deployment, ignoring non-conceptual content or demonstrative reference.

  **4. Comparative Verdict and Asymmetry Argument (6 points)**
  *   **6 pts (A Range):** Commits to a verdict (AH or PCS) and explicitly justifies it by contrasting the **asymmetry** (AH fails on abilities-without-experience; PCS survives experience-without-abilities).
  *   **5 pts:** Commits to a verdict but treats the cases as separate problems rather than a comparative pair.
  *   **4 pts (B Range):** Summarizes both theories and lists pros/cons but refuses to commit to a winner ("Both have strengths...").
  *   **3 pts:** Defends a verdict but relies on standard Mary arguments, ignoring the variant's specific force.
  *   **2 pts:** No clear conclusion.
  *   **1 pt:** Irrelevant conclusion.
  *   *Common Error:* The "Safe Summary": Listing the theories without judging which one breaks under the specific pressure of the variant.

  **Grading Note for Top Band (A):** To receive 18+ points, the essay must explicitly notice the **asymmetry**: that Implant Mary tests the *necessity* of experience for knowledge (crushing AH), while Locked-In Sister tests the *sufficiency* of experience for concept possession (pressing but not crushing PCS). Essays that merely list the theories' responses without contrasting these directional pressures cannot exceed 15 points.
