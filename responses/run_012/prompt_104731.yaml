      *   *Claim 2 (Probabilistic - The Bayesian View):* $\neg E$ is only evidence of $\neg H$ if we expected $E$ given $H$. If the archive is spotty, $P(E|H)$ is low. *Commitment:* Requires assessing archival survival rates. *Supports Instructor?* Yes, conditionally. *Opponent's target:* The opponent assumes $P(E|H)$ is high.
