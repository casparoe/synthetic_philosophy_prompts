  **2.0 Protocol Clauses**

  **2.1 Designation of Known Propositions**
  Employees must classify active projects as either "Open Inquiry" or "Known Fact." Once a proposition is moved to "Known Fact," its truth is institutionalized. Staff are authorized to rely on memory and prior verification logs. Re-verifying a Known Fact is discouraged unless a Level 5 Epistemic Breach occurs. This protects the integrity of the knowledge base from unnecessary oscillation.

  **2.2 Disposition of Contradictory Data**
  If data emerges contradicting a Known Fact, it is automatically classified as Misleading Evidence. Since the Fact is known, the data cannot be genuine. Employees are not required to examine the data to confirm its misleading nature; the contradiction itself confirms the error. Staff should archive such data without review to prevent cognitive contamination. Ignoring the data is not negligence; it is compliance.

  **2.3 Pre-emptive Exclusion**
  Employees may anticipate counter-evidence. If you know $P$, you know that any future evidence against $P$ will be misleading. You are permitted to disregard such evidence in advance. This includes emails, replication studies, or whistleblower testimony generated after the Knowledge Designation. Listening to misleading evidence is optional; ignoring it is mandatory for efficiency. Do not open documents you know to be false.

  **3.0 Competency Quiz**

  **Q1: A colleague claims your primary dataset contains errors. You know the dataset is accurate. What is the correct response?**
  A) Re-run the analysis to ensure safety.
  B) Ask the colleague for their source data.
