      **2.0 Protocol Clauses**

      **2.1 Designation of Known Propositions**
      Employees must classify active projects as either "Open Inquiry" or "Known Fact." Once a proposition is moved to "Known Fact," its truth is institutionalized. Staff are authorized to rely on memory and prior verification logs. Re-verifying a Known Fact is discouraged unless a Level 5 Epistemic Breach occurs.

