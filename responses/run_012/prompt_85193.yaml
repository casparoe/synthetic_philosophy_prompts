  **Q2: A replication study fails to match your Known Fact. The document is unopened. How do you classify it?**
  A) As a potential falsification requiring review.
  B) As misleading evidence, based on your prior knowledge.
  C) As irrelevant until the peer review process is complete.

  **Q3: When may you stop listening to counter-arguments?**
  A) When you are certain you are right.
  B) When you know you are right.
  C) When management instructs you to stop.

  **4.0 Answer Key**

  **Q1: C.** Since you know the dataset is accurate, the colleague's claim implies a falsehood. Genuine knowledge cannot be overturned by false claims. Examining the claim suggests uncertainty, violating Clause 2.1. Trust your designation.

  **Q2: B.** Under Clause 2.3, knowledge of the fact entails knowledge that contrary evidence is misleading. Opening the document risks exposure to error. The mismatch proves the study is flawed, not the Fact.

  **Q3: B.** Certainty is psychological; Knowledge is epistemic. Once the status is "Known," listening becomes inefficient. Ensure your designation is logged before ignoring arguments. If you merely believe you know, you are liable for negligence.
