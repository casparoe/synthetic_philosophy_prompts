      *   *Analysis:* They are technically distinct logical issues in situation calculus. However, pragmatically, they all stem from the inability to bound the context.
      *   *Critique:* Collapsing them is a strong move. It shifts from logic to epistemology. Is it *defensible*? Yes, under a "context problem" umbrella. Is it *overstated*? Possibly, because Qualification is about *conditions for action*, while Frame is about *persistence of state*. They require different logical fixes (e.g., default logic vs. causal minimization).
