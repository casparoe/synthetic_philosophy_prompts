          3.  The agent can always ignore the information (the set of acts after observation includes the acts before).
          4.  Information is costless (no resource expenditure).
      *   **Resolution of Paradox:** The theorem assumes utility is defined over world states, not over mental states like "knowing" or "believing." If an agent derives disutility from knowing something (e.g., sadness from bad news), that disutility must be encoded in the utility function over outcomes. If the utility function accounts for the psychological cost of knowing, the theorem still holds, but the "costless" assumption might be violated if the psychological pain is treated as a cost. However, the stricter philosophical objection is that standard decision theory assumes preferences are over outcomes, not over belief states themselves (truth-independent utility).

