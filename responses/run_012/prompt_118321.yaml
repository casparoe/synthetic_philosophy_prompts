answer: |-
  The principle is that the weirdness stems from a **performative contradiction** where the act of endorsing a proposition as true implicitly ascribes a belief to oneself that the proposition's content explicitly denies.

  This is known as Moore's Paradox, and it explains your data by distinguishing between logical consistency and pragmatic coherence. The content "It is raining and I don't believe it" is logically possible (you can be wrong about the rain), which is why the past tense ("It was raining... I didn't believe") and third-person cases are fine; in those scenarios, you are describing a state of affairs without currently endorsing the rain as true. The weirdness only arises in the first-person present tense because asserting or judging "It is raining" functions as an avowal of belief—you are simultaneously showing you believe it and saying you don't. This explains why "probably raining" is fine (you aren't committing to full belief) and why hypotheticals ("Suppose...") are fine (you aren't actually judging). Regarding your specific tension: you do not have to give up the past-tense verdict, nor the silent-thought one, but you must give up the assumption that the sentence is **logically contradictory**. If the content itself were contradictory, the past-tense version would be weird too; since it isn't, the contradiction must be in the *act* of thinking or speaking. Your verdict that silent thought is weird is honest and defensible if you accept that private judgment is governed by the same norms of coherence as public assertion; if you treated thought as merely causal noise, you would have to give up that verdict, but your intuition suggests you treat thought as a form of judging. One minor correction: logically, "and" should be just as weird as "but" since the contradiction lies in the conjunction of commitments, not the contrastive particle, though "but" certainly makes the clash more salient to process.

  Based on this, I predict:
  1.  **Questions:** "Is it raining but I don't believe it?" will feel fine, because questioning suspends commitment.
  2.  **Commands:** "Believe it's raining but don't believe you believe it" will feel impossible/weird, because you cannot voluntarily command belief states directly.
  3.  **Third-person self-report:** "He told me 'It's raining but I don't believe it'" will feel fine, because you are reporting his contradiction, not inhabiting it.
