answer: |-
  You have correctly identified the primary objection to illusionism, but the theory survives by rejecting your assumption that a "seeming" requires any actual felt quality to exist.

  The dilemma you present relies on the intuition that for something to "seem" a certain way, there must be a subjective "what-it-is-like" to that seeming. Illusionists like Keith Frankish or Daniel Dennett argue this intuition is precisely the illusion they are debunking. They posit that a "seeming" is a functional or representational state that carries the content "I am having a phenomenal experience" without itself being phenomenal. In their view, the brain generates a state that misrepresents its own physical nature as having magical, non-physical properties (qualia). The "seeming" is the vehicle of this misrepresentation, not the content; it is a cognitive state that forces a judgment, not a felt sensation that justifies it.

  Regarding your second horn, illusionists agree it is not merely a propositional belief like "I believe 2+2=4," because that would be too thin to explain the conviction we have. Instead, they propose a "quasi-phenomenal" state—a non-conceptual, automatic input to the judgment system that feels authoritative even though it lacks qualitative texture. This avoids the triviality charge because it explains why the error is systematic and unavoidable rather than a simple mistake of reasoning. The disagreement ultimately rests on whether you accept that a system can represent a property it does not possess without that representation itself instantiating the property. Critics say no, arguing that the representation of pain must itself hurt to some degree, while illusionists say yes, arguing that a map of a fire does not burn. You are not running two things together; you are highlighting the exact point where illusionism demands we abandon our deepest introspective intuitions.
