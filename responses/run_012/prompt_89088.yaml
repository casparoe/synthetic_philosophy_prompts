      *   **Part 1: Pascal on Justice, Force, and Custom:**
          *   Need to explain the "miserable" state of human reason. We can't know true justice.
          *   Explain the *coutume* (custom) argument: Laws are binding because they are old/established, not because they are inherently good. This prevents endless dispute.
