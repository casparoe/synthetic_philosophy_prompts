      *   *Justice:* True justice (God's justice) is inaccessible to fallen reason. What we call "justice" on earth is largely custom (*coutume*) and imagination. "We cannot see the point of justice."
      *   *Force:* Necessary because men are wicked. "Justice without force is contradicted... Force without justice is accused." The solution? "It is necessary to put justice and force together."
      *   *Reason of Effects (*raison des effets*):* This is crucial. It's not just debunking custom; it's understanding *why* custom exists. Customs endure because they serve a function (order, preventing worse chaos). We must respect established laws not because they are *true*, but because they are *established* (to avoid civil war/chaos).
      *   *Sovereignty:* Pascal lived through the Fronde (civil wars). He values order and stability over abstract rights. The King's authority is necessary to hold the peace, even if the King's claim to divine right is partly imaginative.

  3.  **Analyze the Policy Proposal (Global Enforcement Corps):**
