answer: |-
  It is a rare pleasure to encounter a reading group that lingers on the *Pensées* long enough to reach the fragments on justice and politics. Most stop at the Wager, missing the darker, more politically acute anthropology that undergirds it. You are right to sense a tension in Pascal, but I would argue it is not a contradiction he failed to resolve; it is a tension he believed was intrinsic to the human condition after the Fall.

  To answer your question, I need to first reconstruct the landscape of Pascal's political thought, then walk your proposal across it.

  ### Pascal on Justice, Force, and Custom

  You have correctly identified the famous dictum: justice without force is helpless, force without justice is tyranny. But the context is often sanitized. For Pascal, this isn't a policy problem to be solved; it is a tragic description of reality.

  Pascal operates from a strict Augustinian, Jansenist anthropology. Human nature is corrupted. We are not merely ignorant of the good; our wills are bent toward self-love (*amour-propre*). Because of this corruption, "true justice" — the justice of God — is inaccessible to us in this life. We cannot reason our way to a universally binding moral code because our reason is itself a tool of our passions.

  This is where **custom** (*coutume*) enters. Since we cannot agree on what is truly just, we agree on what is established. Laws bind us not because they are true, but because they are laws. This is not mere cynicism; it is a safeguard against civil war. If every man demanded that laws be "true" before obeying them, society would dissolve into endless dispute. Custom provides a settled authority that curbs our violent instincts.

  This leads to the **reason of effects** (*raison des effets*). This is Pascal's method of understanding social phenomena. We should not simply debunk customs as false (the skeptic's error) nor accept them as divinely true (the dogmatist's error). Instead, we must understand why they exist and what work they do. Monarchy, for example, might not be "naturally" superior, but it produces the *effect* of order. We respect the King not because he is inherently better, but because the *imaginary* authority we vest in him prevents the *real* violence of the state of nature.

  So, the tension you feel is deliberate. Justice *in itself* is indeed a made thing on earth, resting on custom. But it *must* be backed by force because men are wicked. The ideal situation is not a synthesis, but a masking: we must make justice appear forceful and force appear just. We dress up judges in robes to make force look like authority; we give kings armies to make authority look like force.

  ### The Verdict on the Global Enforcement Corps

  Now, let us bring your Global Enforcement Corps (GEC) into this theater.

  Your seminar's proponents argue that the GEC solves the "helpless justice" side of Pascal's equation. By giving the ICC its own muscle, you stop justice from being a beggar at the door of sovereign states. Your critics argue this creates "tyranny" because the force is unmoored from a specific community's custom.

  Pascal would likely find both sides partially correct but ultimately naive. He would be deeply suspicious of the GEC, and his suspicion would center on the source of its legitimacy.

  For Pascal, force is only stable when it rests on a foundation of custom and imagination that the governed accept. A King is obeyed because the people have agreed, over centuries, to imagine him as the head of the body politic. Your GEC proposes a force that has no "people." There is no global custom, no global imagination of solidarity that matches the scope of this force.

  Pascal would argue that you are attempting to create the *effect* of sovereignty (the power to arrest and punish) without the *cause* of sovereignty (a unified political community bound by shared custom). He would predict that this force would not be seen as "justice" by those it targets, but as pure violence. Without the "robes" of local legitimacy, the GEC looks like an occupying army.

  However, your gut instinct is the most Pascalian element here: the idea that the Corps is quietly borrowing force from states. Pascal would seize on this. He would argue that the GEC cannot actually stand alone. If a major power refuses to recognize it, the Corps either backs down (revealing its force is an illusion) or fights (revealing itself as a aggressor). Pascal would say the levy on arms transfers is a poetic attempt to fund justice with the proceeds of violence, but it does not solve the political problem. The money might be independent, but the physical capacity to arrest still relies on the permission of the territories where the arrests happen.

  He would likely view the GEC as a dangerous **diversion**. It is an attempt to solve a spiritual and political problem (human wickedness and the lack of true justice) with a mechanical fix. It assumes that if we just get the enforcement mechanism right, we can approximate true justice. For a Jansenist, this is pride. It assumes we can build a tower of Babel that reaches a justice we are not equipped to define.

  ### The Verdict on the Current ICC

  Ironically, Pascal might have more respect for the ICC as it currently exists, precisely because of its weakness.

  The current ICC admits the truth of the human condition: it is dependent on the goodwill of sovereigns. It acknowledges that there is no global sovereign. When it fails to arrest a suspect because a state refuses cooperation, it reveals the actual state of the world: justice is indeed helpless without local force.

  Pascal values honesty about our misery. The current system does not pretend to be what it is not. It operates as a form of high-level custom among states. When states cooperate, it is because it serves their "reason of effects" — it stabilizes regions, removes pariahs, or burnishes their reputations. When they don't, the mask slips. Pascal would say this is tragic, but it is the truth of the City of Man. He would prefer a system that honestly admits it is a coalition of interests to one that claims to be a global enforcer of right while lacking the global power to back it up.

  That said, he would not "support" it in a modern sense. He would view it as a useful fiction, provided it does not claim a moral authority it cannot sustain. If the ICC claims to speak for "Humanity" while acting only when powerful states allow it, Pascal would call that a lie. If it claims to be a tool for states to manage their own violence, he would accept it as a pragmatic restraint on sin.

  ### International Law Without a Sovereign

  You asked about the question that later preoccupied John Austin: can there be law without a sovereign to command it?

  Pascal would anticipate Austin's conclusion but arrive there via theology rather than linguistics. For Pascal, law is a remedy for sin. It is a curb on the will. A curb requires a hand to hold it. Without a sovereign — a visible, forceful authority capable of punishing transgression — "law" is merely advice or moral philosophy.

  However, Pascal adds a layer Austin misses. He would distinguish between **true law** (which binds the conscience) and **political law** (which binds the body). International law, for Pascal, would fall into a category of "customs between princes." It binds only as long as it is useful.

  He would likely say that calling it "law" is a category error that leads to disappointment. If we call it law, we expect it to behave like domestic law (command + sanction). When it fails, we become cynical. If we recognized it as a set of conventions based on mutual interest (a "reason of effects" among nations), we would not be surprised when it fails in the face of overwhelming passion or interest.

  Pascal would argue that international law *counts* as law only in the sense that a duel's code counts as law. It governs the participants, but there is no higher sheriff to call if the code is broken. The only enforcement is the counter-force of the other party. Therefore, it is not law in the sense of a guarantee of justice; it is law only in the sense of a temporary truce.

  ### The Jansenist Backdrop: Fallen Nature and the Sword

  Finally, we must weigh the theological undercurrents. Does Pascal's view of fallen nature push him toward wanting force in someone's hands, or distrusting whoever holds it?

  The answer is both. This is the crux of his political thought.

  Because men are fallen, we **need** force. Anarchy is worse than tyranny because anarchy allows every man's wickedness to run unchecked. We need a sword to keep the peace. So, he would not be a pacifist about enforcement. He would agree that warrants without arrests are mockeries.

  But because men are fallen, we **distrust** the hand on the sword. No one is neutral. No judge is pure. The GEC proposes a group of enforcers who are supposedly above the fray. Pascal would ask: *Who guards the guards?* If they are men, they are corrupted by *amour-propre*. If they are not accountable to a specific people (who can revolt or vote or complain), they are accountable to no one.

  For Pascal, the legitimacy of force comes from its embeddedness in a specific social order where the ruled accept the ruler. This acceptance is often based on imagination and habit, not reason. The GEC lacks this imaginative substrate. It is a disembodied hand.

  Pascal would likely conclude that your proposal is a well-intentioned attempt to bypass the tragic limitations of political life. He would say you are trying to create a "God's eye view" enforcement mechanism using human hands. He would warn that a force detached from a specific community's custom is not justice; it is merely violence with a legal brief.

  He would likely advise your seminar that while the impulse to give justice teeth is understandable, the teeth must grow from the jaw of a political community. To graft them onto a international body is to create a monster that neither commands the reverence of custom nor possesses the overwhelming power of a true empire. It would be, in his terms, a "false infinity" — an institution pretending to a universality that does not exist on earth.

  In the end, Pascal would tell you that the search for a perfect enforcement mechanism is a form of *divertissement*. It is a way to keep ourselves busy with political engineering so we do not have to face the fact that true justice is not of this world. We must maintain order as best we can, using force and custom, but we should not mistake our tribunals for the Throne of God.
