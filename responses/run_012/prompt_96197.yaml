  # Seminar Handout: The Socialist Calculation Decision Tree

  **Starting Commitment:** You are the Planning Board. You have unlimited computing power, complete data on current resources and technology, and the authority to enforce whatever you decide.

  **Instructions:** Answer the following questions based on your theoretical commitments. Do not worry about which "school" you are landing in; follow the logic of your answers. At the end, you will find your position and its most awkward commitment.

  ---

  ### The Tree

  **Node 1:** To allocate capital goods (e.g., steel vs. microchips), must you compare inputs and outputs using a common unit of account (money prices), or can you do this using physical units alone? *(Case e)*
  *   **Physical Units** → Go to Node 2.
  *   **Money Prices** → Go to Node 6.

  **Node 2:** Can you compute the optimal allocation of these physical units centrally from your technical data?
  *   **Yes** → Go to Node 3.
  *   **No** → Go to Node 4.

  **Node 3:** Does your calculation assume technology and preferences are fixed during the planning period?
  *   **Yes** → **Leaf A**
  *   **No** → Go to Node 4.

  **Node 4:** Do you rely on real-time sensor data and feedback loops to adjust physical flows dynamically? *(Case d)*
  *   **Yes** → **Leaf B**
  *   **No** → Go to Node 5.

  **Node 5:** Do local councils negotiate the allocation of physical resources directly with one another?
  *   **Yes** → **Leaf C**
  *   **No** → **Leaf D** (Unnamed: Bureaucratic Chaos)

  **Node 6:** Can the Board set these money prices administratively based on rules (e.g., equal to marginal cost)? *(Case d)*
  *   **Yes** → Go to Node 7.
  *   **No** → Go to Node 8.

  **Node 7:** Will factory managers follow these pricing rules without personal profit incentives? *(Case a)*
  *   **Yes** → **Leaf E**
  *   **No** → **Leaf F**

  **Node 8:** Does state ownership of capital goods make money prices meaningless for calculation? *(Case e)*
  *   **Yes** → **Leaf G**
  *   **No** → Go to Node 9.

  **Node 9:** If large firms set internal prices between microenterprises, is that sufficient for the whole economy? *(Case c)*
  *   **Yes** → **Leaf H**
  *   **No** → Go to Node 10.

  **Node 10:** Does the market process primarily *discover* future demand that is currently unknown, or is it just an imperfect mechanism we tolerate? *(Case b)*
  *   **Discover** → **Leaf I**
  *   **Imperfect** → **Leaf J**

  ---

  ### The Leaves

  **Leaf A: Mathematical Programming (Optimal Planning School)**
  *   **Name:** Kantorovich / Neoclassical Synthesis
  *   **Awkward Commitment:** You must assume innovation stops during the planning period, or your equations break.

  **Leaf B: Big-Data Cybernetic Planning**
  *   **Name:** Beer / Cockshott
  *   **Awkward Commitment:** You require total real-time surveillance of labor and consumption to keep the feedback loops honest.

  **Leaf C: Bottom-Up Participatory Planning**
  *   **Name:** Participatory Economics (Parecon)
  *   **Awkward Commitment:** You accept that negotiation meetings will take weeks, slowing down response time to crises.

  **Leaf D: Unnamed (Bureaucratic Chaos)**
  *   **Name:** None
  *   **Awkward Commitment:** You have no mechanism for coordination, implying the Board will simply guess and fail.

  **Leaf E: Lange-Style Market Socialism**
  *   **Name:** Oskar Lange
  *   **Awkward Commitment:** Your managers are playing pretend; they minimize costs without fearing bankruptcy.

  **Leaf F: The Incentives Critique**
  *   **Name:** Nove / Standard Econ Critique
  *   **Awkward Commitment:** You admit socialism needs capitalist-style motivation to function, undermining the moral case.

  **Leaf G: No Capital Market Argument**
  *   **Name:** Ludwig von Mises
  *   **Awkward Commitment:** You concede that complex industrial socialism is logically impossible, not just inefficient.

  **Leaf H: Worker-Managed Market Socialism**
  *   **Name:** Yugoslavia / Ward
  *   **Awkward Commitment:** Your firms will likely act like capitalists anyway, maximizing income per worker rather than social welfare.

  **Leaf I: Prices as Discovery Procedure**
  *   **Name:** F.A. Hayek
  *   **Awkward Commitment:** You accept that inequality and waste are necessary costs of finding out what people actually want.

  **Leaf J: Comparative Institutions**
  *   **Name:** Second-Best Theory
  *   **Awkward Commitment:** You defend markets only because planning is worse, not because markets are actually good.

  ---

  ### Meta-Analysis for Discussion

  **1. Contested Literature Points**
  *   **Lange's Actual Model:** There is disagreement over whether Lange intended literal trial-and-error (tatonnement) or merely the use of shadow prices derived from linear programming. If the latter, Leaf E collapses toward Leaf A.
  *   **Mises vs. Hayek:** Mises (Leaf G) argued calculation was *impossible* without private ownership. Hayek (Leaf I) argued it was *inefficient* because knowledge is dispersed. The tree separates them at Node 8 (Ownership) vs. Node 10 (Discovery). In seminar, press students on whether these are distinct problems or the same problem described differently.
  *   **The Soviet Evidence:** Did the USSR fail because of the calculation problem (Leaf G/I) or because of poor incentives/politics (Leaf F)? The tree forces a choice at Node 7, but historically, these failures were entangled.

  **2. Empty or Unstable Combinations**
  *   **Physical Planning + Dynamic Innovation:** There is no leaf for "Physical Planning that handles innovation." Node 3 forces you to admit static tech, or move to Cybernetics (Leaf B), which requires massive surveillance. This combination is empty because no major school defends dynamic physical planning without prices or feedback.
  *   **Lange + No Incentives:** Leaf E assumes enforcement works. If you answer "No" at Node 7, you move to Leaf F. There is no stable position where managers ignore profits, have no incentives, and yet the system works. This combination is incoherent.
  *   **No Capital Market + Worker-Managed:** Leaf G says ownership matters; Leaf H says worker ownership works. You cannot land on both. This combination is logically contradictory regarding the definition of ownership.

  **3. Leaves the Tree Cannot Separate**
  *   **Cybernetic (B) vs. Mathematical (A):** Both rely on central computation. The split at Node 3 (Static vs. Dynamic) is theoretical, but in practice, both require the Board to have the same data access. Students might argue these are the same position with different time horizons.
  *   **Discovery (I) vs. Comparative Institutions (J):** Both defend markets. The split at Node 10 hinges on whether markets *create* knowledge or just *process* it imperfectly. Hayekians insist on the former; neoclassicals often settle for the latter. The tree forces a distinction that some students may reject as semantic.

  **4. The "Start" Commitment Trap**
  *   The starting premise grants "complete data about resources and technology." Hayekians (Leaf I) should object here. They argue this data *does not exist* until the market acts. If a student lands on Leaf I, ask them how they answered Node 1 without rejecting the start. This tension is the core of the seminar debate.
