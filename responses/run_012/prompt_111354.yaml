prompt: |-
  The World Anti-Doping Agency's therapeutic use exemption system allows athletes to use otherwise prohibited substances when they are medically necessary to treat a diagnosed condition, on the understanding that the treatment restores the athlete to a normal state of health rather than enhancing performance beyond it. Yet the same system permits athletes to sleep in altitude tents, to train in hypoxic chambers, to take creatine and caffeine, and to undergo surgery and rehabilitation that may leave them stronger than before; it also permits athletes who carry rare genetic variants that raise hemoglobin or muscle mass to compete without penalty. What philosophical commitments does this pattern presuppose about the distinction between therapy and enhancement, about the nature of health and disease, and about fairness in sport? Reconstruct the implicit theory. In particular, say what conception of a normal baseline the exemption system requires, whether that baseline is statistical, functional, or normative, and whether it is the athlete's own untreated state or a population norm. Then identify which rival views the practice rules out: for example, that the relevant question is whether an intervention is safe, or whether it is available to all, or whether it respects the athlete's autonomy, rather than whether it is therapeutic. Consider whether the practice is internally consistent, given that it treats some interventions that raise a trait above the athlete's natural level as legitimate—altitude training, surgery, nutritional supplementation—while treating others that do the same as cheating—erythropoietin, anabolic steroids, gene editing. Is the distinction between restoring and enhancing doing the real work, or is the practice better explained by a different commitment, such as a rule-based conception of sport as a contest of natural talent plus effort, or a luck-egalitarian view about which advantages should be compensable? Distinguish what the practice strictly presupposes from what it merely fits well with, and say where it is philosophically underdetermined, so that several theories of health, fairness, or the meaning of sport would license the same rules. Finally, tell me what would have to change in anti-doping practice if we replaced the therapy/enhancement distinction with a straightforwardly safety-based or availability-based criterion, and whether the resulting practice would still be recognizably sport.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The World Anti-Doping Agency (WADA) Therapeutic Use Exemption (TUE) system and its relationship with other permitted practices (altitude tents, creatine, surgery, genetic advantages).
      *   **Key Question:** What philosophical commitments does this pattern presuppose regarding therapy vs. enhancement, health vs. disease, and fairness in sport?
      *   **Specific Tasks:**
          1.  Reconstruct the implicit theory.
          2.  Define the conception of the "normal baseline" (statistical, functional, normative? Individual or population?).
          3.  Identify rival views ruled out (safety, availability, autonomy).
          4.  Assess internal consistency (restoring vs. enhancing vs. other permitted enhancements).
          5.  Determine if "restoring vs. enhancing" is the real driver or if another commitment explains it better (natural talent + effort, luck egalitarianism).
          6.  Distinguish strict presuppositions from compatible theories (underdetermination).
          7.  Analyze the consequences of replacing the therapy/enhancement distinction with safety or availability criteria (would it still be sport?).

  2.  **Initial Brainstorming & Analysis:**

      *   *The Paradox:* WADA says "no enhancement, only therapy." But altitude tents *enhance* oxygen capacity beyond sea-level baseline. Creatine *enhances* power output. Surgery can repair a knee to be better than new (e.g., Tommy John surgery). Genetic mutants (Eero Mäntyranta) are allowed. Yet EPO and steroids are banned even if prescribed.
      *   *The Implicit Theory:* It's not actually about "health" in a medical sense. It's about "naturalness" and the "spirit of sport." The TUE system tries to carve out a space for "necessary medical intervention" without upsetting the "level playing field" of natural talent.
      *   *Baseline:* It seems to be a *population norm* (what is normal for a human) but applied to the *individual's pathology*. However, for things like altitude training, the baseline is "sea level human," but the athlete is allowed to exceed that. So the baseline is fluid. It's likely a *normative* baseline regarding "acceptable means" rather than a strictly functional one.
      *   *Rival Views:*
          *   *Safety:* Caffeine is safe, steroids can be safe under supervision. Yet one is allowed, one banned. So safety isn't the primary driver.
          *   *Availability:* Altitude tents are expensive (unavailable to poor athletes). Yet allowed. So strict equality of access isn't the driver.
          *   *Autonomy:* Athletes can't choose to take steroids even if they want. So autonomy is restricted.
      *   *Internal Consistency:* It is *inconsistent* if the goal is strictly "no enhancement." It is *consistent* if the goal is "no *artificial* enhancement via prohibited *methods*." The distinction lies in the *means* (natural training vs. exogenous substances) rather than the *end* (performance level).
      *   *Better Explanation:* "Natural Talent + Effort." You can train hard (effort) and use your genetics (talent). You cannot inject substances that bypass the effort/talent link. TUEs are a concession to the fact that some talents are broken (disease), but we only fix them to "normal," not "super."
      *   *Underdetermination:* Both a "Spirit of Sport" deontological view and a "Fairness as Natural Lottery" view could support these rules.
      *   *Alternative Criteria:* If we switched to Safety, many banned substances might be allowed (careful use). If we switched to Availability, altitude tents might be banned, or steroids subsidized. Would it be sport? Sport relies on *arbitrary* constraints to make the contest meaningful. Removing the "natural limit" constraint changes the nature of the contest to a tech/bio-hacking contest.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. The TUE system claims to be about health, but the broader context shows it's about defining legitimate vs. illegitimate performance sources.
      *   **The Implicit Theory (Reconstruction):** It's not purely medical. It's a hybrid of medical necessity and sporting integrity. The core commitment is that sport tests *natural endowment cultivated by effort*, not *technological or pharmaceutical override*.
      *   **The Baseline:**
          *   Is it statistical? Partly (normal hemoglobin levels).
          *   Is it functional? Partly (ability to compete without pain/risk).
          *   Is it normative? Yes (what counts as a "fair" advantage).
          *   Individual vs. Population: It's a population norm (what is a healthy human range) applied to the individual. *Crucial nuance:* For TUE, the goal is returning to the population norm. For altitude/creatine, the goal is exceeding the population norm *through permitted means*.
      *   **Rival Views Ruled Out:**
          *   *Safety:* Ruled out because permitted methods (surgery, extreme training) carry risks, and some banned substances could be used safely.
          *   *Availability:* Ruled out because expensive tech (altitude tents) is allowed while cheap pills (EPO) are banned.
          *   *Autonomy:* Ruled out because athletes are paternalistically restricted from choosing banned substances even for enhancement.
      *   **Internal Consistency & The Real Work:**
          *   Is "Restoring vs. Enhancing" doing the work? No. Altitude tents enhance.
          *   What is doing the work? The *Means/Ends* distinction. Specifically, the "Naturalness" of the means. Endogenous adaptation (altitude) vs. Exogenous intervention (EPO).
          *   Theory: Sport as a contest of *organic capacity*. TUEs are exceptions to preserve the contest (so the sick aren't excluded), but capped at "normal" to prevent the exception becoming the rule of enhancement.
      *   **Underdetermination:**
          *   *Luck Egalitarianism:* Compensating for bad luck (illness) but not rewarding good luck (genetics) beyond a point? Actually, WADA allows genetic luck. So strict luck egalitarianism doesn't fit perfectly.
          *   *Deontological "Spirit of Sport":* Cheating is violating the rules/norms, regardless of outcome.
          *   *Conclusion:* The rules fit a "Natural Talent + Diligence" model best.
      *   **Alternative Criteria (Safety/Availability):**
          *   *Safety:* Would allow steroids under supervision. Turns sport into "who can handle the best pharmacology."
          *   *Availability:* Would ban altitude tents or subsidize steroids. Turns sport into "who has the best support system" or creates a bureaucratic nightmare.
          *   *Recognizably Sport?* If we remove the ban on artificial enhancement, it becomes a "human engineering" contest, closer to F1 racing than running. It loses the connection to "human potential" in the traditional sense.

  4.  **Refining and Polishing:**

      *   *Tone:* Philosophical, analytical, precise.
      *   *Clarity:* Ensure the distinction between the *stated* rationale (therapy) and the *operational* rationale (naturalness/fairness) is clear.
      *   *Addressing the Prompt:* Did I answer the specific question about the baseline? Yes. Did I identify rival views? Yes. Did I discuss internal consistency? Yes.
      *   *Self-Correction during drafting:* I need to be careful not to say WADA is "hypocritical" but rather that their *philosophical commitments* are more complex than the simple therapy/enhancement slogan. The prompt asks for the *implicit theory*, not a critique of hypocrisy.
      *   *Refining the Baseline:* The baseline for TUE is "species-typical functioning" (population norm). The baseline for training is "unrestricted improvement." The tension is why one is capped and the other isn't. The answer lies in the *source* of the improvement (internal adaptation vs. external substance).

  5.  **Final Review against constraints:**
      *   Reconstruct implicit theory? Yes.
      *   Conception of normal baseline? Yes.
      *   Identify rival views ruled out? Yes.
      *   Internal consistency check? Yes.
      *   Distinguish presuppositions from underdetermined fits? Yes.
      *   Alternative criteria consequences? Yes.

  6.  (Final Polish of the text for flow and philosophical precision.) *Ensure terms like "normative," "statistical," "luck egalitarianism," and "deontological" are used correctly.* *Make sure the distinction between "strictly presupposes" and "fits well with" is explicit.*

  7.  *Final Output Generation* (Proceed to generate response based on these structured thoughts).
answer: |-
  The World Anti-Doping Agency's (WADA) regulatory framework presents a philosophical puzzle. On its face, the Therapeutic Use Exemption (TUE) system relies on a **therapy/enhancement distinction**: medicine restores health; doping creates unfair advantage. However, the permissibility of altitude tents, creatine, surgery, and natural genetic advantages reveals that "enhancement" per se is not the prohibited category. If enhancement were the sole criterion, altitude training (which increases hemoglobin mass beyond sea-level norms) would be banned alongside EPO. Since it is not, the TUE system presupposes a more complex implicit theory about the *sources* of performance and the *purpose* of sport.

  ### 1. Reconstructing the Implicit Theory

  The practice presupposes that sport is a contest of **natural endowment cultivated through permissible effort**, rather than a contest of **technological or pharmaceutical optimization**.

  The implicit theory is not strictly medical but **normative**. It holds that an athlete's performance should reflect their biological organism's capacity to adapt to training, not the capacity of their medical team to manipulate biochemistry. The TUE system is a concession to the fact that the "natural lottery" of health sometimes disqualifies athletes from the contest entirely. Therefore, medicine is permitted to return the athlete to the starting line of the "natural lottery," but not to move them ahead of it.

  ### 2. The Conception of the Normal Baseline

  The exemption system requires a specific, hybrid conception of the baseline:

  *   **Population Norm vs. Individual Baseline:** For TUEs, the baseline is a **population norm** (species-typical functioning). The goal is to return the athlete to the statistical range of healthy human functioning, not necessarily to their own specific untreated historical baseline (which might have been pathologically low). However, for permitted enhancements (altitude tents), the baseline is the **individual's prior capacity**, which they are encouraged to exceed.
  *   **Statistical, Functional, or Normative?** The baseline is primarily **normative**, disguised as functional.
      *   It is not purely *statistical*, because many athletes possess genetic variants (e.g., high VO2 max) that are statistically rare yet permitted.
      *   It is not purely *functional*, because surgery can restore function to a level *higher* than the pre-injury state (e.g., a repaired ACL allowing greater stability), which is permitted.
      *   It is *normative* because it distinguishes between **endogenous adaptation** (the body responding to stress, like altitude) and **exogenous substitution** (bypassing the body's regulatory mechanisms, like EPO). The "normal" state is one where performance limits are set by the body's internal regulatory ceiling, not by an external pharmacological ceiling.

  ### 3. Rival Views Ruled Out

  The current practice explicitly rules out several rival philosophical criteria for regulation:

  *   **Safety:** If safety were the primary criterion, many banned substances (used under strict medical supervision) would be permitted, and many permitted practices (extreme weight cutting, high-impact collision training, risky surgeries) would be banned. The practice rules out the view that sport is a laboratory for safe human optimization.
  *   **Availability (Equality of Access):** If strict availability were the criterion, altitude tents and expensive surgical rehabilitation would be banned or subsidized, as they are not equally accessible to athletes from poorer nations. The fact that they are permitted rules out the view that fairness requires equality of *resources*, favoring instead equality of *rules*.
  *   **Autonomy:** The system is paternalistic. It rules out the libertarian view that athletes should be free to ingest whatever substances they choose, provided they accept the risks. The practice asserts that the integrity of the competition supersedes individual bodily autonomy.

  ### 4. Internal Consistency and the "Real Work" of the Distinction

  Is the distinction between restoring and enhancing doing the real work? **No.**

  As noted, altitude tents and surgery can enhance performance beyond the athlete's original baseline. If "restoration" were the strict logical operator, these would be prohibited. The distinction doing the real work is **Natural vs. Artificial Means**.

  *   **Consistent Logic:** The system is internally consistent *if* we define the prohibited category not as "enhancement" but as "artificial manipulation of internal regulatory systems."
      *   *Permitted:* Altitude tents stimulate the body to produce EPO naturally. Surgery repairs structure to allow natural training.
      *   *Prohibited:* Injecting EPO bypasses the body's feedback loops. Steroids bypass the natural limits of protein synthesis.
  *   **The Commitment:** The practice is better explained by a **conception of sport as a contest of natural talent plus effort**. TUEs are allowed only to ensure that "talent" isn't disqualified by "disease." But once the disease is managed, the athlete must rely on "effort" (training) to enhance performance, not "technology" (drugs).
  *   **Luck Egalitarianism:** A luck-egalitarian view (compensating for bad luck but not rewarding good luck) fits *partially*. TUEs compensate for bad brute luck (illness). However, WADA does *not* penalize good brute luck (genetic mutations like Eero Mäntyranta's high hemoglobin). Thus, the system is not strictly luck-egalitarian; it is **talent-protective**. It protects the value of natural genetic lottery wins while mitigating the exclusionary effects of genetic lottery losses.

  ### 5. Underdetermination: Presuppositions vs. Compatible Theories

  We must distinguish what the practice *strictly presupposes* from what merely *fits well* with it.

  *   **Strictly Presupposed:** The practice presupposes that there is a morally relevant difference between **internal physiological adaptation** and **external biochemical intervention**. Without this metaphysical distinction, the ban on EPO vs. the permission of altitude training collapses. It also presupposes that the "Spirit of Sport" values the *process* of human limitation over the *outcome* of maximum performance.
  *   **Merely Compatible (Underdetermined):**
      *   *Deontology:* A rule-based view ("cheating is violating the code") fits the rules but doesn't explain *why* the code is written this way.
      *   *Virtue Ethics:* A view that sport builds character fits well (drugs bypass character-building struggle), but the rules don't strictly require this; a sociopath who trains hard is still permitted.
      *   *Health Maximization:* This is compatible with TUEs but contradicted by the permission of risky surgeries or extreme training.
      *   *Philosophical Underdetermination:* Several theories of fairness could license these same rules. A **Kantian** view (respecting human dignity by not treating the body as a machine) and a **Rawlsian** view (preserving fair equality of opportunity among natural talents) would both support the current TUE system, despite disagreeing on foundational ethics. The rules do not force us to choose between them.

  ### 6. Alternative Criteria: Safety or Availability

  If we replaced the therapy/enhancement (natural/artificial) distinction with alternative criteria, the nature of sport would fundamentally change.

  *   **Safety-Based Criterion:**
      *   *Change:* Anabolic steroids and EPO could be permitted under strict medical supervision (dosage monitoring, health screening).
      *   *Result:* Sport would become a contest of **pharmacological engineering**. The "winner" would be the athlete with the best medical team and the highest tolerance for side effects.
      *   *Recognizably Sport?* It would resemble professional wrestling or F1 racing (where machine optimization is key). It would lose the connection to "human potential" in the sense of organic limits. The narrative of the "natural hero" would vanish.

  *   **Availability-Based Criterion:**
      *   *Change:* Any intervention available to all athletes would be permitted; exclusive interventions banned.
      *   *Result:* If EPO became cheap and generic, it would be allowed. If altitude tents remained expensive, they would be banned.
      *   *Recognizably Sport?* This creates a bureaucratic nightmare and stagnates innovation. It shifts the contest from "who is the best athlete" to "who can best lobby for their equipment to be deemed 'standard'." It treats sport as a commodity distribution system rather than a test of excellence.

  ### Conclusion

  The WADA TUE system presupposes a **normative theory of naturalness**. It defines the "normal baseline" not as a static health metric, but as the **limit of endogenous physiological regulation**. The system is not internally inconsistent if one understands that the prohibition is on *bypassing* the body's regulatory mechanisms, not on *improving* performance outcomes.

  The practice strictly presupposes that sport is meaningful only if it tests the **organic capacity of the human animal**, not the **technological capacity of human science**. If we abandon the therapy/enhancement distinction for safety or availability, we do not merely tweak the rules; we dissolve the specific social practice of "sport" as a contest of natural talent and diligence, replacing it with a contest of bio-engineering or resource allocation. The resulting activity might be a competition, but it would no longer be recognizably *sport* in the traditional humanistic sense.
