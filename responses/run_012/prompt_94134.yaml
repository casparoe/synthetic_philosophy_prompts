      *   *Claim 2: "Herodotus... says he has to report what he's told even when he doesn't believe it... rarely adjudicates — he leaves the reader to decide."*
          *   **Assessment:** Partially true (he often says "I am bound to report..."), but misleading. Herodotus *does* adjudicate frequently (e.g., "I think," "It seems to me"). Saying he "rarely adjudicates" is a common simplification but technically inaccurate regarding his method. He often weighs probabilities.
      *   *Claim 3: "Thucydides... insists on eyewitness testimony... tested reports as rigorously as he could... strips out the entertaining, romantic material..."*
          *   **Assessment:** Solid summary of Thucydides 1.20-1.22.
      *   *Claim 4: "Biblical scholars developed the criterion of embarrassment... likely authentic if it's awkward or damaging... nobody invents material that makes their hero look bad..."*
          *   **Assessment:** Correct definition of the criterion of embarrassment.
      *   *Claim 5: "This is also called the criterion of dissimilarity, and it's really the same idea..."*
          *   **Assessment:** **FALSE.** This is a major error. The Criterion of Dissimilarity (or Distinctiveness) is distinct from Embarrassment. Dissimilarity argues that material dissimilar to both Judaism *and* the early Church is likely authentic (because it wouldn't be invented by either). Embarrassment argues material damaging to the author's cause is authentic. They are related tools in the "Historical Jesus" quest, but they are *not* the same idea, nor are the names interchangeable.
      *   *Claim 6: "Herodotus is already groping toward this when he repeats stories that are unflattering to the Greeks."*
