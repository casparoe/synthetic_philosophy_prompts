prompt: |-
  Been reading LessWrong-adjacent blogs for about 15 years and I want to spend the next year on a proper post series about lexical-threshold negative utilitarianism -- the idea that there's a level of suffering no amount of pleasure can outweigh -- together with the older question of whether pleasure and pain are even on one scale (the dust specks vs torture thought experiment, but treated as a real axiological problem rather than a gotcha). Two half-ideas I want to use as scaffolding, and I honestly dont know if either survives contact: (1) the threshold isn't a fact about value, it's a tie-break rule -- the two aren't comparable, so we refuse to trade them off at all; (2) the threshold is a band, not a line: below the floor a life is bad however much good is mixed in, above a ceiling extra suffering can't spoil it, and inside the band ordinary weighing applies. Given all that, which open questions here actually matter most, and in what order? I want a dependency-aware ranking rather than a survey -- which questions are upstream of which, which are tractable for one person doing careful conceptual work over a year, which look central but don't end up changing anything downstream, and what would move a question up or down the list. No reading lists please.
reasoning: |-
  Here's a thinking process that leads to the suggested roadmap:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time reader of LessWrong-adjacent blogs (15 years). This implies familiarity with rationalist jargon, consequentialist frameworks, thought experiments (Dust Specks vs. Torture), and the general culture of rigorous conceptual analysis. They are not a novice.
      *   **Project:** A year-long post series on Lexical-Threshold Negative Utilitarianism (LTNU).
      *   **Core Ideas:**
          1.  Lexicality as a tie-break/incomparability rule (not a magnitude fact).
          2.  Threshold as a band (floor/ceiling) rather than a sharp line.
      *   **Goal:** A dependency-aware ranking of open questions. What matters most? What order? What's tractable? What's a dead end?
      *   **Constraint:** No reading lists. Focus on conceptual scaffolding and prioritization.

  2.  **Deconstruct the Core Theory (LTNU + Scaffolding):**
      *   *Standard NU:* Suffering is infinitely (or lexically) worse than pleasure.
      *   *Lexical Threshold:* Suffering above $X$ cannot be outweighed by any amount of pleasure. Suffering below $X$ might be tradeable.
      *   *Scaffold 1 (Incomparability):* It's not that $S > \infty \times P$, it's that $S$ and $P$ are different *kinds* of value that don't aggregate across the threshold. This avoids the "infinity math" problems but introduces choice paralysis or rule-based deontology vibes.
      *   *Scaffold 2 (The Band):* Hysteresis or vagueness. A "safe zone" where trade-offs work, a "danger zone" where they don't. This addresses the "sharp line" objection (Sorites paradox).

  3.  **Brainstorming Open Questions:**
      *   What defines the threshold/band? (Phenomenological? Functional?)
      *   How do we aggregate within the band? (Linear? Diminishing returns?)
      *   How do we handle risk/uncertainty? (Pascal's Mugging variants?)
      *   Does this collapse into Deontology? (If it's a rule, not a value, is it still Utilitarian?)
      *   Population Ethics implications? (Repugnant Conclusion?)
      *   Meta-ethics: Realism vs. Anti-realism regarding the threshold.
      *   Decision Theory: How to act under uncertainty about whether an act crosses the threshold.

  4.  **Filtering & Prioritizing (The "Dependency-Aware" Step):**
      *   *Upstream:* Meta-ethical status of the threshold. If the threshold is arbitrary, the whole theory might be unstable. Definition of suffering/pleasure.
      *   *Midstream:* Aggregation mechanics within the band. Risk handling.
      *   *Downstream:* Specific policy implications, population ethics edge cases.
      *   *Tractability:* One person, one year. Needs to be conceptual, not empirical neuroscience.
      *   *High Impact:* Questions that, if answered differently, destroy the theory.
      *   *Low Impact:* Questions that tweak the theory but don't break it.

  5.  **Developing the Ranking (Drafting the Tiers):**

      *   *Tier 1: The Foundation (Make or Break)*
          *   Q: Is "incomparability" coherent as a decision rule? (Scaffold 1). If this is just disguised deontology, does it lose the "utilitarian" label's benefits?
          *   Q: What anchors the band? (Scaffold 2). If it's purely subjective, is it action-guiding?
          *   *Reasoning:* If Scaffold 1 collapses, the lexicality claim fails. If Scaffold 2 has no anchor, the theory is vacuous.

      *   *Tier 2: The Mechanics (How it runs)*
          *   Q: Aggregation inside the band.
          *   Q: Risk/Uncertainty (Probability of crossing the threshold). This is usually where lexical theories die (Pascal's Mugging).
          *   *Reasoning:* You need to know how to calculate *before* you worry about edge cases. Risk is crucial for real-world application.

      *   *Tier 3: The Stress Tests (Edge Cases)*
          *   Q: Population Ethics (Repugnant Conclusion).
          *   Q: Aggregation across persons (Is the threshold individual or global?).
          *   *Reasoning:* Important for LW audience, but secondary to internal coherence.

      *   *Tier 4: The "Don't Bother Yet" (Premature Optimization)*
          *   Q: Specific neuroscientific correlates.
          *   Q: Political implementation.
          *   *Reasoning:* Too empirical for a conceptual year.

  6.  **Refining the Logic (Self-Correction/Critique):**
      *   *Critique:* Is "Incomparability" really upstream of "The Band"?
      *   *Correction:* Yes, because the Band *presumes* a region where trade-offs happen and a region where they don't. The *reason* they don't (Scaffold 1) dictates the logic of the Band.
      *   *Critique:* Is Risk really Tier 2?
      *   *Correction:* For lexical views, risk is often the killer. If there's a 0.0001% chance of torture, does it outweigh 100% chance of dust specks? This needs to be addressed early because it determines if the theory is action-guiding. Let's bump Risk up.
      *   *Critique:* The user asked for "what would move a question up or down." I need to explicitly state triggers.

  7.  **Finalizing the Structure:**
      *   **Phase 1: Coherence & Definitions (Months 1-3).** Focus on Scaffold 1 & 2 validity.
      *   **Phase 2: Decision Theory & Risk (Months 4-6).** The "Pascal's Mugging" problem for lexical thresholds.
      *   **Phase 3: Aggregation & Scope (Months 7-9).** Interpersonal comparison and population ethics.
      *   **Phase 4: Synthesis & Objections (Months 10-12).** Steelmanning and finalizing.

  8.  **Drafting the Content (incorporating LW style):**
      *   Use terms like "action-guiding," "internal coherence," "Pascal's Mugging," "phenomenology."
      *   Be direct and critical.
      *   Highlight the "Scaffold" specific issues.

  9.  **Review against Constraints:**
      *   No reading lists? Check.
      *   Dependency-aware? Check.
      *   Tractability assessment? Check.
      *   Focus on the two scaffolds? Check.

  10. **Final Polish:** Ensure the distinction between "lexical as magnitude" vs "lexical as rule" is central, as that's the user's specific innovation. Ensure the "Band" idea is treated as a solution to Sorites, not just a tweak. (Self-correction: Make sure to emphasize that if the Band is vague, it might fail the "action-guiding" test, which is a critical failure mode).

  11. **Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a high-leverage project. The "lexical threshold" view is often dismissed as mathematically convenient but metaphysically suspicious; your two scaffolds (incomparability-as-rule and the threshold-as-band) are the exact moves needed to make it robust. However, they introduce new failure modes.

  Here is a dependency-aware ranking of open questions for a one-year conceptual workstream. The logic flows from **Internal Coherence** $\to$ **Action-Guidance** $\to$ **Scope**. If the early tiers fail, the later ones are irrelevant.

  ### Tier 1: The Metaphysics of the Rule (Months 1–3)
  *These questions determine if the theory exists or if it's just verbal camouflage for deontology.*

  **1. The "Incomparability" Cash-Out**
  *   **Question:** If the threshold is a tie-break rule rather than a magnitude fact, what is the decision procedure when the rule triggers? Does it function as a constraint (deontology) or a lexicographic ordering (consequentialism)?
  *   **Dependency:** Upstream of everything. If this collapses into "maximize pleasure subject to a side-constraint against torture," you are no longer doing axiology; you are doing constraint-based ethics. You need to justify why this is still *utilitarian* (i.e., outcome-focused) rather than *rights-based*.
  *   **Tractability:** High. This is pure conceptual analysis.
  *   **Failure Mode:** If you cannot distinguish "lexical rule" from "deontological constraint" in terms of output, the series loses its distinct niche.
  *   **Move Up If:** You find that standard expected utility theory cannot accommodate lexical rules without modification.
  *   **Move Down If:** You realize the distinction is purely semantic and doesn't change decision outputs.

  **2. Anchoring the Band (Scaffold 2)**
  *   **Question:** What phenomenological or functional property defines the floor and ceiling of the band? Is it intensity, duration, cognitive appraisal, or something else?
  *   **Dependency:** Upstream of Aggregation. You cannot calculate trade-offs inside the band if you cannot identify which experiences are *in* the band.
  *   **Tractability:** Medium. Requires engaging with philosophy of mind/pain without needing empirical neuroscience.
  *   **Failure Mode:** The "Arbitrariness Objection." If the band boundaries seem gerrymandered to avoid counter-examples, the theory loses normative force.
  *   **Move Up If:** You discover that the "band" requires a vague predicate that makes the theory non-action-guiding (Sorites returns).

  ### Tier 2: Decision Theory Under Uncertainty (Months 4–6)
  *This is the graveyard of lexical theories. If you can't handle risk, the theory works only in a deterministic universe.*

  **3. The Probabilistic Threshold (Pascal's Mugging Variant)**
  *   **Question:** How does the lexical rule apply to probabilities? Does a 0.00001% chance of crossing the floor outweigh a 100% chance of massive pleasure inside the band?
  *   **Dependency:** Downstream of Tier 1 (needs a defined rule), Upstream of Tier 3 (needs to know how to act).
  *   **Tractability:** Low/Medium. This is notoriously hard. Lexical views often implode here (either you become hyper-risk-averse or you ignore small probabilities arbitrarily).
  *   **Why It Matters:** Real-world decisions are never certain. If your theory forbids any action with *non-zero* risk of crossing the floor, it demands paralysis.
  *   **Move Up If:** You find that standard Expected Value calculations break completely with lexical orderings (they usually do).
  *   **Move Down If:** You decide to treat the threshold as "probability 1 only" (which makes the theory practically useless).

  **4. Aggregation Within the Band**
  *   **Question:** Inside the "trade-off zone," is the currency linear? Diminishing returns? How do we sum across time for a single agent?
  *   **Dependency:** Downstream of Tier 1 & 2.
  *   **Tractability:** High. This is standard utilitarian calculus, just restricted to a domain.
  *   **Why It Matters:** If aggregation inside the band is linear, you might recreate the Repugnant Conclusion *within* the safe zone.
  *   **Move Up If:** You suspect the "band" is just a smaller version of the original problem (Dust Specks vs. Mild Pain).

  ### Tier 3: Scope and Interpersonal Comparison (Months 7–9)
  *Only tackle this if the theory survives Tiers 1 & 2.*

  **5. The Unit of Accounting (Individual vs. Global)**
  *   **Question:** Is the threshold per-experience, per-person, or per-world-state? Does one person's torture get outweighed by a billion people's mild pleasure?
  *   **Dependency:** Downstream of Tier 1.
  *   **Tractability:** Medium.
  *   **Why It Matters:** This determines if your view is Negative Utilitarian (focus on minimizing worst-off) or Lexical Total Utilitarian.
  *   **Move Up If:** You intend to solve Population Ethics.
  *   **Move Down If:** You restrict the theory to individual prudential rationality first.

  **6. The "Ceiling" Problem (Scaffold 2 Specific)**
  *   **Question:** You posited a ceiling where extra suffering can't spoil a good life. Is this defensible? Does a life of ecstasy + moderate pain beat a life of ecstasy + severe pain?
  *   **Dependency:** Downstream of Tier 1 (Band definition).
  *   **Tractability:** Medium.
  *   **Why It Matters:** The "Floor" is intuitive (NU). The "Ceiling" is controversial. It implies suffering has diminishing marginal disvalue at high levels of pleasure, which contradicts the core NU intuition.
  *   **Move Up If:** You realize the Ceiling creates worse counter-intuitions than the Sharp Line.
  *   **Move Down If:** You drop the Ceiling and keep only the Floor (simplifies the theory significantly).

  ### Tier 4: Stress Tests & Synthesis (Months 10–12)
  *Polishing and defense.*

  **7. Dynamic Consistency**
  *   **Question:** Does this view lead to preference reversals over time? (e.g., accepting a risk today that you would refuse tomorrow).
  *   **Dependency:** Downstream of Tier 2 (Risk).
  *   **Tractability:** Low. Requires formal modeling.
  *   **Move Up If:** You want to engage with decision theorists.

  **8. The "Happy Slave" Objection**
  *   **Question:** If a life is above the Ceiling, does it matter if the pleasure is based on false beliefs or oppression?
  *   **Dependency:** Downstream of Tier 3.
  *   **Tractability:** High.
  *   **Move Down If:** You treat this as a separate issue about "objective vs. subjective" well-being.

  ---

  ### Critical Path Summary

  1.  **Start with Scaffold 1 (Incomparability).** If you can't explain why this isn't just Deontology in disguise, stop. The LW audience will eat you alive on this if it's not watertight.
  2.  **Immediately test Scaffold 2 (The Band) against Risk.** A band with fuzzy edges + probabilistic outcomes = decision paralysis. You need a "confidence interval" mechanic for the threshold.
  3.  **Defer Population Ethics.** Do not try to solve the Repugnant Conclusion until you have solved the "One Person, One Choice" version.
  4.  **Drop the Ceiling if it drags.** The "Floor" does the heavy lifting for Negative Utilitarianism. The "Ceiling" is a nice-to-have that might introduce more bugs than it fixes. If you run out of time, cut the Ceiling.

  ### What Moves Questions Up the List?
  *   **Discovery of Incoherence:** If you find the "tie-break rule" requires a meta-rule to adjudicate conflicts, move Meta-Ethics to Tier 1.
  *   **Action-Guidance Failure:** If the "Band" is too vague to use in a trolley problem, move Anchoring (Q2) to the very top.
  *   **Risk Sensitivity:** If a 1% chance of threshold-crossing breaks the math, move Probabilistic Threshold (Q3) to Tier 1.

  ### What Moves Questions Down?
  *   **Formalization Success:** If you can formalize the lexical rule in a way that handles risk cleanly, you can skip deep dives into decision theory.
  *   **Phenomenological Consensus:** If you can point to a robust psychological distinction (e.g., "suffering that disrupts agency" vs. "pain that doesn't"), the Anchoring question becomes easier.

  ### One-Year Pacing Advice
  *   **Months 1-3:** Publish the "Incomparability" argument. Get the pushback early.
  *   **Months 4-6:** Publish the "Risk/Uncertainty" post. This is where the theory lives or dies.
  *   **Months 7-9:** Publish the "Band/Phenomenology" post.
  *   **Months 10-12:** Synthesis and responding to the "Deontology" accusation.

  If you try to solve Population Ethics before solving Risk, you will waste six months. Prioritize the **single-agent, deterministic case**, then the **single-agent, probabilistic case**, then **multi-agent**.
