      *   *Underlying Theory:* Likely draws from Paul Christiano's Iterated Distillation and Amplification (IDA) or similar "alignement via oversight" frameworks. The idea is that if the overseer is smart enough and the process is iterative, the AI learns to do what the overseer *would* approve of if they knew more.

