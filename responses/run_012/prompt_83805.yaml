answer: |-
  The principle you are actually using is a hybrid of two distinct rules. You think you are using one ("The Load-Bearing Test"), but your verdicts reveal you are relying on **Public Justification** *plus* **Equal Standing**.

  **The Principle:**
  1.  **Public Justification:** A law is permissible only if it can be fully justified by reasons accessible to all citizens, regardless of faith. (This is your "Load-Bearing" test).
  2.  **Equal Standing:** A law is impermissible if it uses state power to enforce a sectarian hierarchy or deny a class of citizens equal civic status.

  **The Cost (Verdicts You Must Drop or Reframe):**
  To be consistent with this dual principle, you have to adjust three of your intuitions:

  1.  **The Baker:** Your "Load-Bearing" test alone doesn't condemn the baker. He can offer a secular reason: "Compelled Speech." To say "Not Fine," you are silently prioritizing **Equal Standing** (non-discrimination in public accommodations) over **Liberty** (religious expression). You must admit that if the baker's secular case for "artistic freedom" were stronger, you'd have to let him bake. Your verdict relies on the claim that discrimination harms equal standing more than refusal harms expression.
  2.  **The Bishop Pair:** This is the biggest cost. You say the Death Penalty argument is Fine but the Gay Marriage argument is Not. Under "Public Justification," both are theological claims translated into secular rights (Life vs. Family). To keep your verdict, you must concede the difference isn't the *theology*, it's the **direction of the right**. The Death Penalty argument *protects* a vulnerable class from state harm; the Gay Marriage argument *restricts* a vulnerable class from civil access. You have to own that you are judging the *political effect*, not the *religious source*.
  3.  **The Nativity vs. Call to Prayer:** You are right that "minority status" isn't the principle. The principle is **State Action**. If the city *permits* the Call to Prayer (private act on public zoning), it's Fine. If the city *installs* the Nativity (state act on state property), it's Not Fine. You must admit that if a private church put the Nativity on their own lawn, you'd be Fine. If the city council opened with the Call to Prayer, you'd be Annoyed.

  **The Hidden Case:**
  *A legislator holds a position supported by secular reasons, but admits she would hold it even if those secular reasons were refuted, because her faith is the real driver.*

  **Verdict: Not Fine.**
  Here is why: Your principle requires the *law* to be load-bearing, not just the *lobbying*. If the secular reasons are refuted and she votes "Yes" anyway, the law no longer rests on Public Justification. It rests on "My Church Says So." That turns the law into sectarian coercion. You can vote your faith, but you cannot impose your faith once the public bridge has collapsed.

  **The Tie-Breaker Case:**
  If you are still unsure whether you prioritize **Public Justification** (Can this be translated?) or **State Neutrality** (Is the State doing it?), consider this case:

  **A public high school graduation.**
  *   **Scenario A:** A student valedictorian chooses to pray in her speech.
  *   **Scenario B:** The school principal invites a local cleric to deliver a prayer.

  Both are religious. Both can be "translated" secularly (tradition, solemnity).
  *   If you say **A is Fine** but **B is Not**, your core principle is **State Neutrality**. (The state cannot pray, but citizens can).
  *   If you say **Both are Not Fine**, your core principle is **Secular Space**. (Public institutions must be religion-free).
