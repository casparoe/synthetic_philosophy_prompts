  The chapter is unfair; it treats the historical theory's precise definitions as errors while ignoring the systemic theory's inability to distinguish function from mere effect.

  The summary of the historical (etiological) theory is accurate: it defines function by selective history. Defenders accept this entails that byproducts lack functions, but they deny this is absurd. They argue it preserves normativity: only traits with a history of selection can "malfunction." A stopped heart fails its function; a knee making noise merely has an effect. The book frames the historical theory's exclusion of byproducts as a failure, but defenders view it as a necessary feature to distinguish what a trait is *for* versus what it merely *does*.

  The summary of the systemic (causal-role) theory is technically accurate but misleadingly framed. It claims the knee noise has a function. Defenders of historical theory argue this makes "function" trivial. If every causal contribution is a function, the term loses power to explain why specific traits exist. The book claims systemic theory matches how doctors talk, which is partially true for descriptive physiology, but doctors also speak of pathology (malfunction), which systemic theory struggles to define without smuggling in historical norms.

  Your ridge case is the classic "byproduct" problem. The book says denying it function is absurd. Historical theorists bite this bullet: the ridge has a beneficial *effect*, but no *function* yet. It only gains a function if future selection acts on it specifically. This isn't ignorance of the present; it's precision about evolutionary causation.

  Your friend's point about "selected" versus "selected for" is crucial and the book blurs it. "Selected" means a trait's frequency increases; "selected for" means the trait caused the increase. A trait can be selected (hitchhike) without being selected for. The historical theory requires "selected for" to assign function. The book implies current benefit equals function, conflating utility with evolutionary purpose. This matters for your ridge: the ridge is selected (frequency rises) but not selected for (bracing wasn't the target), so historical theory denies it function until selection targets the bracing specifically.

  Finally, the closing claim that the historical theory is refuted is false. It remains the dominant view in philosophy of biology because it explains teleology and error better than systemic accounts. Biologists haven't "given up" on it; they use etiological functions when explaining adaptation and causal roles when describing mechanisms. The chapter presents a contested philosophical debate as a settled scientific fact, favoring the systemic view by stacking the examples.
