  I'm in a philosophy of biology seminar that has basically turned into a fight about what the word "function" means, and because I'm not sure I follow the fight, I read a popular evolution-and-development book that has a chapter on it, and now I'm worried I've absorbed a version of the debate my seminar would laugh at. I can't check anything online right now (long story, my laptop is at the shop), so I'd rather you just reason it out with me. Here's the book's chapter as best I can reconstruct it:

  'There are two theories of function, and they are rivals. The historical theory says the function of a trait is whatever it was selected for: hearts pump because pumping is why hearts stuck around, and a trait that wasn't favored by selection doesn't have a function at all, it just has effects. The systemic theory, sometimes called the causal-role theory, says the function of a part is whatever it does that contributes to some capacity of the whole system it belongs to — so the function of the heart is whatever the heart does that keeps you alive, and by the same token the noise your knees make when you crouch has a function too, since it's something the system does. On this view, saying what a part is for is just describing how a working system is put together, and you don't need to know any history to do it. The historical theory gets malfunction right — a stopped heart still has the function of pumping, which is why we can call it a broken heart and not just a lump of meat — but it pays for that by making function depend on a past that may have nothing to do with the present, so a trait that arose as an accidental side effect of something else and now happens to keep the animal alive has no function on the historical view, which is obviously absurd, since the trait is plainly doing something important. And the historical theory was effectively refuted once people pointed out how many traits are byproducts of other traits rather than adaptations, so most biologists today have quietly given up on it, and the systemic theory is the one that matches how physiologists and doctors actually talk about parts of the body.'

  My gut says the systemic theory has to be right, because when my physiology TA says the function of the loop of Henle is to concentrate urine, she doesn't seem to be making a claim about the Pleistocene. But then I came up with a case that makes me doubt it: imagine a mutation in some rodent that makes a ridge of bone grow along a joint, and the ridge happens to brace the joint so the animal runs faster and has more pups, but nothing ever selected for bracing — the ridge is just what that mutation does. The book's argument says the historical theory has to deny this ridge has a function, and that this is absurd. Is it actually absurd, or is that just the bullet the historical theory bites on purpose? And what would the systemic theory say about the ridge, given that the ridge really does make a difference to how the system works? One more thing my friend keeps bringing up that I don't understand: she says a trait can be 'selected' without being 'selected for'. What turns on that, and does the book's summary blur it anywhere?

  So please go claim by claim: what's right, what's a standard simplification a defender would accept, what a defender would object to, and what the book has actually gotten wrong. Then tell me whether its closing claim — historical theory refuted, systemic theory vindicated — follows from anything true in the summary. Lead with a one-sentence verdict on whether the chapter is fair overall, I've definately got alot of pages of notes to fix. No citations or reading suggestions, just the arguments, and keep the whole thing under 600 words.
