answer: |-
  The sheet music sat on the piano stand, weighted down by a metronome that no longer ticked. It was a single page, staff lines drawn by hand in blue ink, titled *Variations for E.* in the corner.

  Mara stood over it, her fingers hovering. She was a conservatory graduate; her outer message—the set of instructions she brought to the marks—was rigid. She saw the key signature: no sharps, no flats. She saw the time signature: 4/4. To Mara, the inner message was clear. This was a C Major etude, structured around a standard II-V-I progression. The notes dictated a melancholic adagio. She played it. The tones were precise, the intervals pure, the rhythm mathematically accurate. It sounded like a textbook exercise. It sounded dead.

  Julian leaned against the doorframe, smoking a cold cigarette. He had played clubs with the composer, Elias, for twenty years. He looked at the same blue ink. His outer message was different. He didn't see a key signature; he saw a relative mode. In the tradition they shared, a lack of sharps often implied D Dorian, not C Major, depending on the root note of the bass line which was merely suggested by the chord symbols. Furthermore, the scribbled note above the staff wasn't *adagio*; it was a shorthand for "dragged," a specific rhythmic lag used in the late-night sets they played in 1998.

  "That's not how he wrote it," Julian said, not moving from the door.

  "I'm playing what's on the page," Mara replied, her hands resting on the keys. "The marks indicate C Major. The tempo marking is standard."

  "The marks are a map, not the terrain," Julian said. "You're reading the legend, but you're ignoring the scale. He wrote that for a room with a three-second reverb. You're playing it in a dry box."

  They were extracting different inner messages from the very same marks because their outer messages—their prior knowledge of how to decode the symbols—diverged. Mara decoded for preservation; Julian decoded for performance. Neither could prove the other wrong using only the paper. The paper was silent.

  Later that afternoon, Elias's wife, Elena, came to collect his things. She stood before the piano. She did not read music. To her, the staff lines were merely a fence, the notes like birds caught in it. She could not access the outer message at all; the code of music theory was a language she never learned. She could not extract an inner message regarding melody or harmony.

  Yet, she wept.

  She traced the title: *Variations for E.* The frame message—the part of the communication that announces *this is a message* and *you are the recipient*—did its work independently of the content. The fact that the marks existed, that they were addressed to her initial, told her she had been the subject of his thought when the ink was wet. The frame carried a weight the content could not. She learned something vital—that she was loved—without decoding a single note. The meaning lived in the address, not the body.

  Mara watched her, troubled. She had decoded the content perfectly, yet she felt she had missed something essential. She returned to the piano. She looked at the sheet again. She needed to know why her perfect decoding felt like a lie.

  She looked for instructions on how to read the instructions. Where did the outer message come from? Usually, one learns music theory from a book, another message. But that leads to a regress. If every code requires a key, where does the first key come from?

  She opened Elias's instrument case. His saxophone lay inside. The cork on the neck was compressed on one side, worn down by the specific angle of his bite. The keys were polished smooth where his left ring finger rested longest. This was not a message. There was no intent in the wear, only causality. The metal did not speak; it bore the scar of use.

  This was the regress stopping point. The physical reality of the player dictated the code.

  Mara picked up the saxophone. It was heavy. She tried to play the melody from the sheet. She played the notes correctly—the inner message was intact. She used the jazz phrasing Julian had suggested—the outer message was adjusted. But it still didn't sound like Elias.

  She realized then that the tempo marking wasn't missing; it was biological. The phrases on the page were exactly the length of one of Elias's breaths. He hadn't written a metronome mark because the limit wasn't time; it was oxygen. The code for reading the tempo was not semiotic; it was pulmonary. It came from the volume of his lungs, a fact of biology, not a sign to be interpreted.

  Mara tried to play the phrase in one breath. She couldn't. She was younger, her lung capacity different, or perhaps her embouchure leaked air. To play the notes as written, she had to breathe where he didn't. That break in the sound changed the meaning.

  She understood the failure now. She had gotten the inner message exactly right. The notes were correct. She had even adjusted the outer message to match the jazz convention. But the fit was wrong. The meaning wasn't in the marks, nor solely in her head. It was in the friction between the marks, the code, and the specific physical vessel required to enact them.

  Julian was right about the room, but wrong about the solution. You couldn't recreate the room. Elena was right about the love, but she couldn't hear the song. Mara was right about the notes, but she couldn't breathe the life.

  She put the saxophone down. The sheet music remained on the stand. It was a perfect record of a failure. It documented a sound that could no longer happen because the specific combination of lungs, room, and habit that generated the code had dissolved.

  "The meaning isn't what you decide it is," Julian said softly, watching her struggle. "It's what fits. And sometimes, nothing fits anymore."

  Mara nodded. She closed the lid over the keys. The silence that followed wasn't empty; it was the only accurate performance left. The marks remained, but the message had ended when the breath stopped. The fit had failed, and no amount of correct decoding could restore the event. The paper was just paper. The music was the collision, and the collision was over.
