      COHORT ASSIGNMENT APPEALS TRIBUNAL
      Case No.: CAT-2024-0492
      Litigant: Elias Thorne
      Subject: Reclassification from Cohort Zeta to Cohort Eta

      FINDINGS OF FACT
      The Petitioner was born at 23:58 on 31 December 2004, the statutory cutoff for Cohort Zeta. He petitions for assignment to Cohort Eta, citing cultural affinity and digital native status.

      MAJORITY OPINION
      The Tribunal acknowledges the Petitioner's distress. However, the boundary between Zeta and Eta is not a biological rupture but an administrative convention established to facilitate survey segmentation. To grant this appeal would imply the boundary possesses ontological weight it does not carry.

      The Tribunal notes the inherent confounding in cohort analysis. Any difference observed between Zeta and Eta may be attributed to birth year (cohort), current age (life cycle), or the historical moment of measurement (period). Reclassifying the Petitioner based on current preferences mistakes a period effect for a cohort trait. Furthermore, generational categories are reference classes chosen, not found. They are defined largely by contrast; Zeta is Zeta only because it is not Eta. To move the Petitioner is to shift the definition of both groups, creating a Sorites paradox wherein the Tribunal must determine how many seconds of birthtime constitute a distinct social reality.

      Additionally, the act of self-identification here is performative. By petitioning for Eta status, the Petitioner reinforces the validity of the categorization system itself. To allow individual opt-out would dissolve the reference class required to measure the very affinity he claims. The Bureau requires stable bins to produce unstable truths.

      DISSENT (Hon. Member Vane)
      I argue this Tribunal lacks jurisdiction. Generations are not natural kinds but narrative conveniences. There is no fact of the matter regarding Mr. Thorne's generational essence because no such essence exists. We cannot err in classification if the categories are fictitious. To rule on this petition is to legitimize a false ontology. We are not courtiers to a king who wears no clothes; we are the tailors pretending he does.

      MAJORITY REPLY TO DISSENT
      While the dissent correctly identifies the ontological vacuum, it mistakes the Bureau's function. We do not discover truth; we manufacture consistency. Even if generations are fictitious, the budgets, marketing strategies, and policy interventions predicated upon them are real. To declare the categories void would not liberate the Petitioner but collapse the infrastructure built upon the distinction. We must maintain the fiction to manage the consequences of believing it.

      DISPOSITION
      The appeal is denied. The boundary remains fixed at 23:59:59.

      Verdict: The Tribunal denies the petition, holding that while the line is arbitrary, the authority to draw it is not.

