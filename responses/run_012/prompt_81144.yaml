prompt: |-
  I am a novelist at work on a scene in which my protagonist, a novelist, delivers the wedding toast for her best friend, a philosopher who has spent her career on the toxin puzzle. The room is mixed: perhaps twenty philosophers who know the puzzle in its standard form, and thirty family members and friends who do not. The standard setup is the one in which a billionaire offers a large sum to anyone who can form, tonight, a genuine intention to drink a painful but harmless toxin tomorrow, knowing that tomorrow she will have no reason to drink it and can simply change her mind. The bride's heterodox line—the one I want the toast to be built around—is that the puzzle is misdescribed when it is treated as a puzzle about whether one can intend to do something one will later have no reason to do. On her reading, it is a puzzle about the difference between intending and predicting: the billionaire is not buying a prediction that you will drink the toxin, but an intention that changes what the later choice is, so that the intention cannot be produced by the reward without ceasing to be the kind of intention that collects it. She calls it the commitment problem and refuses the word toxin. I want the toast to take her reading seriously as a reading—not to explain the puzzle from scratch, but to let its structure do the work, so that the family can follow the analogy without a lecture and the philosophers can hear that the analogy is exact. The speech should be warm, specific, and funny, a tribute to a woman who is hard to pin down and who has spent her life thinking about why we cannot simply decide to be the people we want to be. It should be about five minutes, no more than eight hundred words. It should not be a lecture, and it should not use the word toxin unless the joke earns it. The speaker's voice should be that of a novelist—observant, slightly wry, comfortable with concrete detail—not that of a philosopher. You may invent the anecdote at its center; this is fiction