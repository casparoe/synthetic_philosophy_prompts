answer: |-
  Good evening. For those who don't know me, I'm [Name], and I write novels. Which means I make things up for a living. [Bride], on the other hand, spends her life trying to figure out what's actually true about the things we say we're going to do.

  Looking around this room, I see a distinct split. On the left, the family, who know [Bride] as the woman who burns toast because she's thinking about logic. On the right, the philosophers, who know her as the scholar who solved the Commitment Problem. I'm going to try to speak to both groups without boring the first or insulting the second.

  Ten years ago, [Bride] and I made a pact. We were broke, living in different cities, and we promised to meet for coffee at 5:00 AM at a train station halfway between us. No phones allowed. Just coffee and talk.

  On the morning of the meeting, I woke up and thought: *She's not going to be there.* It was raining. I was tired. And logically, once I arrived, whether she was there or not wouldn't change the fact that I was already awake and wet. I had every reason to stay in bed. But I went.

  And there she was. Not because she loved coffee. Not because she predicted I'd actually show up. She told me later that she went because she had formed an intention the night before that made staying in bed impossible. She didn't predict her future action; she bound it.

  This is the heart of her work. She hates the word "toxin"—please, no one offer her any tonight—but you might know the puzzle. A billionaire offers you a reward if you intend to drink a bitter potion tomorrow. You get the money tonight. But tomorrow, you have the money, and the potion still tastes awful. So why drink it? If you can't intend to drink it, you don't get the money.

  Most people think this is about willpower. [Bride] realized it's about identity. You cannot form the intention just to get the reward. If you only intend because you want the money, you won't drink tomorrow, because tomorrow the money is already in the bank. The intention has to be the kind that changes what you want tomorrow. It has to make the drinking rational, even when the reward is gone.

  She calls it the Commitment Problem. And looking at her and [Groom], I realize marriage is the only sane solution to it.

  [Groom], you cannot stand here today and predict that you will love [Bride] every day for the next fifty years. That's a forecast, and forecasts fail. You cannot vow to stay because you calculate that the benefits outweigh the costs. If you marry for the reward, you'll leave when the reward fades.

  You marry to become the person for whom leaving is not an option. You form an intention tonight that changes the choice ten years from now. You are building a structure where staying is the only rational move, even when the rain is hard and the coffee is cold.

  [Bride] has spent her career explaining why we cannot simply decide to be the people we want to be. We need the vow to make us them. She refuses to call it a toxin, because she knows that what looks like poison to the calculating self is actually medicine for the committed one.

  So, to the philosophers: Yes, she solved it.
  To the family: Yes, she's happy.
  And to both: Please raise your glasses.

  To [Bride] and [Groom]. May your intentions be genuine, may your predictions be unnecessary, and may your commitment be the only reason you need.

  ***

  **Note:** I am highly confident that the speech accurately reflects the specific heterodox interpretation of the Toxin Puzzle provided in your prompt, particularly the distinction between intention and prediction. I am least sure whether the marriage analogy perfectly captures the nuance that the intention must *change* the later choice's rationality, rather than simply overriding it via obligation.
