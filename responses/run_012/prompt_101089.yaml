answer: |-
  ### Methodology Note

  The following ratings are derived from a synthesis of historical consensus regarding trigger mechanisms, policy responses, and counterfactual capacity. The scale is 0 (purely natural/accidental; no blame) to 1 (entirely deliberate/avoidable; total blame).

  *   **Dimension (a)** measures the proportion of *excess mortality* caused by human agency (policy, omission, ideology) rather than the initial environmental or biological shock.
  *   **Dimension (b)** measures moral culpability after discounting for epistemic limits (what they could not know) and logistical constraints (what they could not physically do) at the time.
  *   **Replaceability Test:** Asks whether a plausible alternative regime, possessing similar resources and prevailing moral norms, would have achieved significantly lower mortality.
  *   **Frameworks:** Rated 0–1 on explanatory power (1 = fully explains the mortality pattern; 0 = fails to account for key dynamics).

  ---

  ### Case File 1: The Irish Famine (1845–1852)

  **Dimension (a): Causal Weight of Political Choice — 0.70**
  *Reasoning:* The trigger (*Phytophthora infestans*) was biological and unavoidable. However, the conversion of crop failure into mass mortality was driven by the Westminster government's adherence to laissez-faire economics. Food (grain and livestock) was produced in Ireland and exported throughout the famine. The political choice to treat food as a commodity rather than a right, and to limit public works/relief, accounts for the majority of excess deaths.
  *   **Settled:** Food was exported while people starved; relief was inadequate.
  *   **Contested:** Whether this constituted intentional genocide or criminal negligence; the precise mortality count.

  **Dimension (b): Culpability (No-Hindsight) — 0.60**
  *   **Discounts Applied:** I am discounting the modern understanding of macroeconomics. In the 1840s, the belief that market interference would worsen shortages was orthodox among the educated governing class, not merely a pretext. I am also discounting the lack of germ theory (they did not understand the blight's mechanism).
  *   **Reasoning:** Even within 1840s norms, humanitarian intervention was possible (as seen in private charity and later policy shifts). However, the ideological blinders were genuine, reducing culpability slightly compared to a modern actor ignoring settled science.

  **Replaceability Test:**
  *   **Verdict:** Averted.
  *   **Implication for (a):** A French or protectionist government of the era would likely have embargoed exports and organised direct relief. This confirms that British specific ideology, not just era-constraints, was causal.

  **Framework Ratings:**
  *   **Food-Availability Decline (FAD):** 0.20. (Aggregate food supply was sufficient; the potato was the only failure).
  *   **Entitlement Approach:** 0.90. (Collapse of purchasing power for labourers; loss of potato entitlement).
  *   **Political-Economy/Crime:** 0.75. (Explains the export continuation and relief limits well; struggles to prove intent to exterminate).

  ---

  ### Case File 2: The Bengal Famine (1943)

  **Dimension (a): Causal Weight of Political Choice — 0.80**
  *Reasoning:* The trigger was a mix of supply shock (loss of Burmese rice due to Japanese invasion) and demand inflation (military spending). However, the "denial policies" (scorched earth, boat removal) disrupted internal trade. Crucially, the War Cabinet refused to import grain despite available shipping, prioritising military stockpiles elsewhere.
  *   **Settled:** Policy exacerbated the crisis; shipping was available but not allocated.
  *   **Contested:** The extent to which speculation/hoarding by traders vs. government policy drove price spikes.

  **Dimension (b): Culpability (No-Hindsight) — 0.70**
  *   **Discounts Applied:** I am discounting the "fog of war". The Cabinet was making decisions under the existential threat of Japanese invasion of India. Information lags between Delhi and London were significant.
  *   **Reasoning:** While the refusal to ship grain remains blameworthy, the competing imperative of winning the war (which they viewed as the only way to prevent future famines) complicates the moral calculus for a 1943 actor.

  **Replaceability Test:**
  *   **Verdict:** Averted.
  *   **Implication for (a):** A nationalist Indian government or a colonial administration less fixated on the European theatre would have prioritised local civilian feeding. This suggests the colonial status of Bengal was a primary causal factor.

  **Framework Ratings:**
  *   **FAD:** 0.40. (There was a decline relative to demand, but not an absolute absence of food).
  *   **Entitlement:** 0.95. (Sen's paradigm case; rural labourers' wages did not keep pace with rice inflation).
  *   **Political-Economy/Crime:** 0.80. (Fits the view of colonial extraction and racialised valuation of life).

  ---

  ### Case File 3: The Soviet Famine (1932–33)

  **Dimension (a): Causal Weight of Political Choice — 0.90**
  *Reasoning:* There was no significant adverse weather event. The famine followed forced collectivisation and the liquidation of the kulaks. Grain procurement quotas were set at impossible levels and enforced by security services. Borders were sealed to prevent peasant flight.
  *   **Settled:** Policy caused the shortage; enforcement prevented escape.
  *   **Contested:** Whether the famine in Ukraine (Holodomor) was specifically intended to destroy Ukrainian nationalism (genocide) or was a result of brutal class warfare applied unevenly.

  **Dimension (b): Culpability (No-Hindsight) — 0.85**
  *   **Discounts Applied:** I am discounting the chaos of rapid industrialisation. The central state was attempting to transform an agrarian society at breakneck speed; some miscalculation of yield was perhaps inevitable.
  *   **Reasoning:** However, reports of starvation were received by the centre in early 1933, yet quotas were not significantly lowered until after the peak mortality. Ideological commitment to the plan overrode empirical feedback.

  **Replaceability Test:**
  *   **Verdict:** Averted.
  *   **Implication for (a):** A modernising authoritarian regime not committed to immediate, total collectivisation (e.g., a NEP-continuation or a different industrialisation timeline) would not have generated this specific mortality profile.

  **Framework Ratings:**
  *   **FAD:** 0.30. (Grain existed but was seized; regional availability was manufactured).
  *   **Entitlement:** 0.80. (Peasants lost entitlement to their own produce via collectivisation).
  *   **Political-Economy/Crime:** 0.90. (Strongest fit; famine used as a tool of social engineering and coercion).

  ---

  ### Case File 4: China (Great Leap Forward, 1959–61)

  **Dimension (a): Causal Weight of Political Choice — 0.95**
  *Reasoning:* The trigger was the Great Leap Forward policy itself (communes, backyard steel, deep ploughing). Weather variations occurred but were not historically exceptional enough to cause famine of this magnitude without the policy context. Procurement continued based on exaggerated yield reports.
  *   **Settled:** Policy was the primary driver; exaggeration of yields led to over-procurement.
  *   **Contested:** The degree to which Mao and the central leadership knew the true situation during the peak years versus being misled by local cadres.

  **Dimension (b): Culpability (No-Hindsight) — 0.80**
  *   **Discounts Applied:** I am discounting the information chain failure. Local officials lied to the centre to meet quotas; the central leadership may have genuinely believed a surplus existed. Also, the scientific understanding of agronomy was universally poorer then (e.g., Lysenkoism had global echoes).
  *   **Reasoning:** If the centre believed there was food, their refusal to release grain is less culpable than if they knew there was none. However, they suppressed dissent that might have corrected the data.

  **Replaceability Test:**
  *   **Verdict:** Averted.
  *   **Implication for (a):** A pragmatic CCP (as post-1978) or a different socialist model would have avoided the specific mechanisms (communal dining, steel production) that caused the collapse.

  **Framework Ratings:**
  *   **FAD:** 0.50. (There was some disruption to harvest, but not enough to explain the death toll).
  *   **Entitlement:** 0.85. (Loss of private plots and communal dining failure).
  *   **Political-Economy/Crime:** 0.85. (Utopian engineering treated human cost as expendable).

  ---

  ### Case File 5: The Sahel Famine (Early 1970s)

  **Dimension (a): Causal Weight of Political Choice — 0.40**
  *Reasoning:* The primary trigger was a multi-year drought (climatic shift). However, post-colonial governments (Mali, Niger, etc.) were often corrupt, prioritised urban centres over pastoralists, and failed to maintain grain reserves. Cold War geopolitics slowed international response.
  *   **Settled:** Drought was the trigger; governance failure exacerbated mortality.
  *   **Contested:** The extent to which colonial land-use changes made the region more vulnerable prior to independence.

  **Dimension (b): Culpability (No-Hindsight) — 0.25**
  *   **Discounts Applied:** I am discounting the lack of early-warning satellite technology and the primitive state of global humanitarian logistics in the early 1970s. State capacity in newly independent nations was genuinely low.
  *   **Reasoning:** Given the resource base and technological limits of a 1970s Sahelian state, the ability to mitigate a drought of this scale was minimal, even with benevolent intent.

  **Replaceability Test:**
  *   **Verdict:** Mitigated, not Averted.
  *   **Implication for (a):** A wealthier or more organised government could have imported food, but given the *plausible alternatives* (other post-colonial African states of the era), mass distress was likely inevitable due to the environmental shock.

  **Framework Ratings:**
  *   **FAD:** 0.80. (Actual decline in agricultural output due to rain failure).
  *   **Entitlement:** 0.60. (Pastoralists lost livestock value; terms of trade collapsed).
  *   **Political-Economy/Crime:** 0.30. (Neglect is evident, but "famine as crime" fits poorly compared to state-building failures).

  ---

  ### Tiering and Shifts

  **Tier 1: Predominantly Political (Rating > 0.85)**
  *   China (GLF) [0.95]
  *   Soviet Union [0.90]

  **Tier 2: Mixed/Exacerbated (Rating 0.60 – 0.84)**
  *   Bengal [0.80]
  *   Ireland [0.70]

  **Tier 3: Predominantly Environmental (Rating < 0.60)**
  *   Sahel [0.40]

  **Shifts under Dimension (b) (Culpability):**
  *   **China:** Drops from Tier 1 (0.95) toward Tier 2 (0.80). The information failure (local lying to central) reduces the *mens rea* of the top leadership under a no-hindsight constraint, even if the policy remained the cause.
  *   **Sahel:** Drops from Tier 3 (0.40) deeper into Tier 3 (0.25). When logistical and technological constraints of the 1970s are accounted for, the blameworthiness of the local authorities diminishes significantly.
  *   **Bengal:** Remains in Tier 2, but the gap between (a) and (b) widens more than in the Soviet case. The "fog of war" is a stronger exculpatory discount than "ideological blindness".

  ---

  ### Disease and Displacement Flag

  **Cases where rating moves materially if mortality is driven by disease/displacement:**

  1.  **Ireland:** **Yes.** If deaths were primarily starvation, the metric is grain logistics. If deaths were primarily disease (typhus, cholera) in workhouses and crowded ports, the political failure shifts to *public health administration* and *quarantine policy*. The British administration's consolidation of the poor into disease vectors increases the political causal weight (a) slightly, as this was a deliberate administrative choice.
  2.  **Bengal:** **Yes.** A significant portion of mortality occurred among migrants moving to Calcutta. If the political rating rests on food distribution, it is 0.80. If it rests on the *allowance of mass displacement* without sanitation infrastructure, the culpability remains high but the nature of the crime changes from "withholding food" to "failing to manage population flow".
  3.  **Sahel:** **Yes.** Pastoralist mortality was often due to livestock death followed by disease in refugee camps. If the rating relies on crop failure (FAD), it is 0.40. If it relies on the failure to provide sanitary conditions for displaced persons (which was within 1970s capacity), the political causal weight (a) rises, as aid logistics were easier than rain-making.

  *Note:* For Soviet and China, the ratio of starvation-to-disease is less debated as a driver of the *political* rating, because the denial of food was the primary vector for the immune collapse.

  ---

  ### Settled vs. Contested Summary

  | Case | Settled Consensus | Genuinely Contested |
  | :--- | :--- | :--- |
  | **Ireland** | Blight was natural; export of food continued; relief was inadequate. | Whether the British government intended to depopulate Ireland (genocide vs. negligence); exact death toll. |
  | **Bengal** | War policies exacerbated shortage; grain was available globally but not shipped. | The relative weight of speculation/hoarding vs. government denial policies in driving prices; Churchill's personal intent. |
  | **Soviet** | Collectivisation and quotas caused the shortage; peasant flight was blocked. | Whether the famine was targeted specifically at Ukrainians as an ethnic group (Holodomor) or was a result of class-based policy applied ruthlessly across grain regions. |
  | **China** | GLF policies caused the collapse; yield reports were exaggerated. | How much Mao knew during the peak mortality; the contribution of weather anomalies vs. policy error. |
  | **Sahel** | Drought was the trigger; state response was weak. | The extent to which colonial land-use patterns pre-determined the vulnerability; the efficacy of the eventual international aid response. |

  **Final Note on Frameworks:**
  The **Entitlement Approach** is the most robust across all five cases, as it accounts for why food might exist without reaching the starving. The **FAD** framework only holds strong for the Sahel. The **Political-Economy/Crime** framework gains explanatory power as you move from the Sahel to China/Soviet, but risks overstating intent in the Ireland/Bengal cases where ideology and war aims complicated the motive.
