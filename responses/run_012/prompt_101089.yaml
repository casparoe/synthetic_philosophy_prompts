      *   *Sahel:* Is 0.3 too low? Post-colonial corruption was real. But the *trigger* was rain. I'll keep it low on *causal weight of choice* regarding the *onset*, higher on *mitigation*. The prompt asks for "excess mortality attributable to decisions". Mitigation failure counts. I'll raise it to 0.4 to reflect the failure to import/organise relief compared to capacity.
      *   *Ireland:* 0.7 feels right. The blight was natural, the famine was political.
