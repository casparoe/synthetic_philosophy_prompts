      *   **Soviet Union (1932-33):** Collectivisation. Dekulakisation. Grain requisition quotas. Ukraine (Holodomor) specific intensity.
      *   **China (Great Leap Forward, 1959-61):** Backyard steel, collectivisation, exaggerated reporting, continued procurement despite local shortage.
