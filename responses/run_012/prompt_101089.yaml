  3.  **Drafting the Ratings (Dimension A: Political Choice):**

      *   *Ireland:* High political exacerbation, but the trigger was biological. Did politics *cause* the blight? No. Did it cause the *famine* (mass death)? Yes, largely. Rating: ~0.7.
      *   *Bengal:* Trigger was war/disruption, not just weather. Policy decisions (denial, export bans elsewhere, prioritising military) worsened it significantly. Rating: ~0.8.
      *   *Soviet:* Collectivisation was a political choice. Quotas were set politically. Was it intentional genocide or criminal negligence? Contested. But the *cause* of the food shortage was policy, not weather. Rating: ~0.9.
      *   *China:* GLF policies directly destroyed agricultural capacity and allocation. Weather played a minor role (debated). Policy is the dominant driver. Rating: ~0.95.
      *   *Sahel:* Primarily climatic (drought). Governance was weak/corrupt, but could they have stopped the drought? No. Could they have mitigated? Yes, but capacity was low. Rating: ~0.3.

  4.  **Drafting the Ratings (Dimension B: Culpability/No-Hindsight):**

      *   *Ireland:* Malthusianism was dominant. Germ theory didn't exist. But economic ideology was a choice. Discounting modern economics, they still had options. Rating: ~0.6 (Slightly lower than A because some economic beliefs were orthodox then).
      *   *Bengal:* War fog. Communication lags. But Churchill's cabinet had intel. Discounting WWII chaos, the refusal to ship grain remains blameworthy. Rating: ~0.75.
      *   *Soviet:* They knew people were starving (reports existed). Ideology blinded them, but ignorance isn't a full defence. Rating: ~0.85.
      *   *China:* Local officials lied to central, central believed them? Or central knew? Mao's culpability is contested. If we discount the lying chain of command, does culpability drop? Still, the policy was the cause. Rating: ~0.85.
      *   *Sahel:* Limited state capacity. Global food system less integrated. Discounting modern logistics/aid infrastructure. Rating: ~0.2.

  5.  **Developing the "Replaceability Test":**
      *   *Ireland:* Would a French or US gov have acted differently? Likely yes (more interventionist). Implies politics mattered.
      *   *Bengal:* A nationalist Indian gov? Would prioritise locals over war effort. Implies colonial priority structure was key.
      *   *Soviet:* A non-communist modernising regime? Might have industrialised without forced collectivisation. Implies specific ideology was causal.
      *   *China:* A pragmatic CCP (post-78)? Would have avoided GLF. Implies specific leadership/ideology causal.
      *   *Sahel:* A wealthier/western gov? Could mitigate drought. But given *actual* alternatives (other post-colonial African states), maybe not much better. Implies structural constraints + governance.

  6.  **Developing the Framework Ratings (FAD, Entitlement, Political-Economy):**
      *   *FAD:* Did food supply actually drop?
      *   *Entitlement:* Could people access food?
      *   *Political-Economy:* Was it a tool of control/crime?

      *   *Ireland:* FAD (Potato failed, but grain existed). Entitlement (Poor had no money). Pol-Econ (Colonial neglect).
      *   *Bengal:* FAD (Debatable, some say supply was okay). Entitlement (Inflation wiped out wages). Pol-Econ (War priorities).
      *   *Soviet:* FAD (Grain was seized, not necessarily absent nationally). Entitlement (Peasants lost rights to land). Pol-Econ (Breaking resistance).
      *   *China:* FAD (Procurement took it all). Entitlement (Communal dining failed). Pol-Econ (Utopian engineering).
      *   *Sahel:* FAD (Drought reduced supply). Entitlement (Pastoralists lost assets). Pol-Econ (Neglect of periphery).

  7.  **Addressing Disease/Displacement:**
      *   Most famines kill via disease (cholera, typhus, malaria) due to weakened immunity and movement, not literal starvation.
      *   Does this change the "political choice" rating? If the government prevents movement or sanitation, yes.
      *   *Ireland:* Disease huge. Workhouses spread it.
