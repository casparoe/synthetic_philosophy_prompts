      *   Structure: Name -> The Carving (Mechanism) -> The Distinction (Risk vs. Uncertainty) -> The Valid Exception -> How the Defeat Happens.

  10. **Final check against constraints:**
      *   Don't just give a term.
      *   Explain the edges.
