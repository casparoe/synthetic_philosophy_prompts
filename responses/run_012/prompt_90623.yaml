answer: |-
  The name you are looking for is **Pascal's Mugging**.

  It is the secular, finite-time cousin of Pascal's Wager. It was coined by the AI researcher Eliezer Yudkowsky to describe exactly the pattern you've spotted: a scenario where a tiny, unquantifiable probability is multiplied by a massive, unbounded payoff to justify an immediate, costly action.

  But a name won't help your character lose convincingly. You need the anatomy. Here is the carving of the argument, where the bones are, and why your character cannot cut them.

  ### 1. The Load-Bearing Trick: The Non-Zero Loophole
  The engine of this argument is not the huge payoff. It is the **epistemic status of the probability.**

  In normal reasoning, probability is a measurement of evidence. ("Based on past trials, there is a 5% chance.")
  In Pascal's Mugging, probability is a measurement of *logical possibility*. ("You cannot prove this won't happen, therefore the probability is non-zero.")

  **The Trick:** The arguer shifts the burden of proof. They don't need to prove the event is *likely*; they only need you to admit it is *possible*. Once you admit the probability is $>0$, and they set the payoff to $\infty$ (or "millions of lives"), the math forces their conclusion.
  $$ \text{Any Number} \times \text{Infinity} = \text{Infinity} $$

  **Why your character loses:** She is trying to argue about **evidence** ("The odds are terrible"), but he is arguing about **possibility** ("The odds aren't zero"). Evidence cannot kill possibility. As long as she engages on the math of the payoff, she has already accepted his premise that the probability is a valid number to multiply.

  ### 2. Risk vs. Uncertainty (The "No Odds" Question)
  You asked if the version with no odds is a different animal from the version with tiny odds. **Yes.** In economics and decision theory, this is the distinction between **Risk** and **Knightian Uncertainty**.

  *   **Risk (Tiny Odds):** You know the distribution. (e.g., A roulette wheel, or asteroid tracking). You can price this.
  *   **Uncertainty (No Odds):** You do not know the distribution. (e.g., "Will this biotech startup create a god?" or "Will this tenant appeal change the law forever?"). You cannot price this.

  **The Mugging exploits Uncertainty by pretending it is Risk.**
  The arguer treats an unknown probability as if it were a small *known* probability.
  *   **Entry 1 (Biotech):** This is Uncertainty. There is no data.
  *   **Entry 3 (AI vs. Malaria):** This is Uncertainty masquerading as Risk.

  **The Edge:** If your character tries to say, "The odds are too low," she loses, because he can just say, "How low? One in a million? One in a billion? Still worth it for millions of lives."
  **To fight it (which she can't, but you need to know):** She has to refuse the multiplication. She must say, "A probability that cannot be measured cannot be entered into an equation." But this sounds like cowardice to an audience seduced by the "potential to save lives."

  ### 3. The Valid Case: The Asteroid Exception
  You asked for the nearest case where this reasoning is actually fine.
  **Planetary Defense (Asteroids).**

  *   **Why it works:** The probability is **derived from measurement**, not imagination. We can track the rock. We understand the physics of the impact. The causal chain is physical and verified.
  *   **Why the others fail:** The Biotech, Tenant, and AI arguments rely on **speculative causal chains**.
      *   *Biotech:* Startup $\to$ Success $\to$ Distribution $\to$ Lives Saved. (Four speculative links).
      *   *Tenant:* Appeal $\to$ Loss $\to$ Precedent Set $\to$ Future Protection. (Four speculative links).
      *   *Asteroid:* Rock $\to$ Orbit $\to$ Impact. (Three physical links).

  **The Difference:** In the valid case, the "non-zero" claim is **falsifiable**. If the rock isn't there, the risk is zero. In the Mugging, the "non-zero" claim is **unfalsifiable**. You cannot prove the AI *won't* become a god. You cannot prove the tenant case *won't* set a precedent. The uncheckability is the shield.

  ### 4. Why The Same Move Serves Opposite Conclusions (Entry 3)
  You noted that the argument works for AI safety *and* Malaria relief, depending on who is talking. This is because the argument is **content-agnostic**.

  It is a **formalist hack**. It bypasses the *content* of the claim (is this actually true?) and operates solely on the *structure* of the value (is the number big?).
  *   **AI Guy:** Payoff = Infinite Future.
  *   **Malaria Guy:** Payoff = Certain Deaths (treated as Infinite Negative Utility).

  Because neither payoff is real (they are both projections), they are functionally equivalent in the math. This is why your character loses. She is arguing about the *reality* of the situation. He is arguing about the *geometry* of the values. She is playing Chess; he is playing Calvinball.

  ### 5. How Your Character Loses (The Scene Mechanics)
  If you want her defeat to feel authentic, do not have her run out of facts. Have her run out of **leverage**.

  1.  **She attacks the Probability:** "This will never work."
      *   **He counters:** "You can't know that. If there's even a chance..."
      *   *Result:* She looks cynical/negative. He looks hopeful.
  2.  **She attacks the Cost:** "We can't afford this."
      *   **He counters:** "How can you put a price on millions of lives?"
      *   *Result:* She looks cold/calculation. He looks moral.
  3.  **She attacks the Logic:** "This reasoning justifies anything."
      *   **He counters:** "That's a cynical way to talk about people's homes/lives." (See Entry 2).
      *   *Result:* She looks like she's playing word games. He looks like he cares about people.

  **The Defeat:** She loses because the argument is **moralized mathematics**. It uses the cold hardness of math ("It's just multiplication!") to shield a moral claim ("You must save lives!"). If she attacks the math, she attacks the lives. If she attacks the claim, she attacks the math.

  ### Summary for the Notebook
  *   **Name:** Pascal's Mugging.
  *   **Family:** Decision Theory / Effective Altruism / Longtermism.
  *   **Load-Bearing Trick:** Treating Logical Possibility as Epistemic Probability.
  *   **The Shield:** Unfalsifiability (You can't prove the odds are zero).
  *   **The Valid Edge:** Measurable Causal Chains (Asteroids) vs. Speculative Chains (Startups/Precedents).
  *   **Why she loses:** She is bringing a knife (evidence) to a black hole (unbounded utility). The black hole doesn't cut; it just swallows.

  **One final note for the dialogue:**
  The people using this argument rarely sound like they are gambling. They sound like they are the *only ones being rational*. They will use phrases like "Expected Value," "Asymmetric Upside," or "Tail Risk." They will frame her hesitation not as prudence, but as a failure of imagination or morality. That is the sting your character needs to feel.
