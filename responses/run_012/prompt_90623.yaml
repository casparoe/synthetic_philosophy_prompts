prompt: |-
  I'm a novelist and I keep a notebook of arguments I overhear, and I've got three entries now that I'm fairly sure are the same animal, but I can't find a name for it, and I need one, because a character in the book I'm writing has to lose an argument to this thing and I want to know exactly what beats her.

  Entry one: a guy at a party telling his friend to put his entire savings into a biotech startup. The pitch is that if it works it saves millions of lives, and sure the odds are terrible, but you can't say they're zero, and any number times millions of lives is still a big number. When someone asks him what the odds actually are, he says that's not the point.

  Entry two: a tenants' meeting. Someone wants everybody to chip in for an appeal that will almost certainly fail, because there's some chance it sets a precedent that protects thousands of tenants down the line. Another guy says you could use that reasoning to spend every penny you own on literally anything. She says that's a cynical way to talk about people's homes.

  Entry three, my favourite: two guys at the same table. One says give the money to the AI people, because there's a small chance of something unthinkable. The other says give it to the malaria people, because those deaths are certain. Same shape of argument, opposite conclusions, and neither of them budges when you swap which one he's hearing.

  What I keep circling is that the argument gets stronger the less anybody knows. Normally an argument gets weaker when you can't check the claims it's resting on. Here the uncheckability is the engine: you can't rule the huge thing out, and that's somehow supposed to count in its favour, and it doesn't seem to matter whether the huge thing is likely, possible, or merely not excluded. Also nobody ever puts a number on the odds. The number only ever shows up on the payoff side.

  I know Pascal's wager from school, and I know the objection about all the other gods you might be annoying, and I have a feeling this is related but its not the same — the wager is about believing something for an infinite afterlife, this is about real money and real strangers and what to do before Tuesday. So: does this pattern have a name, or a few names for its different parts? I'm not after a reading list. What I want is the carving. Which bit is the load-bearing trick — the unbounded payoff, the missing odds, or the fact that the same move serves any conclusion and its users don't treat that as a reductio? Is the version where nobody has any odds at all definately a different animal from the version where the odds are just tiny? Is it really the wager in a coat? And if nothing fits, invent a name and give me the edges: what's the nearest case where this reasoning is actually fine — an asteroid, a real one-in-a-billion risk with a real remedy — and what makes that one fine when the others aren't. If you hand me a term and nothing else I'll be annoyed, because I still won't know what my character loses to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a novelist writing a book. A character needs to lose an argument to a specific type of reasoning.
      *   **The Problem:** The user has observed three real-world examples of a specific argumentative pattern but can't find a name for it. They know it's related to Pascal's Wager but distinct (secular, finite time, real money).
      *   **The Pattern:**
          *   Low/Unknown Probability $\times$ Huge/Infinite Payoff = Action Required.
          *   Probability is often uncheckable, vague, or dismissed as "not the point."
          *   Payoff is emphasized (millions of lives, precedent, unthinkable AI outcome).
          *   The argument works for contradictory conclusions (Entry 3: AI vs. Malaria).
          *   Uncheckability is a feature, not a bug.
      *   **The Need:** Not just a term, but a "carving." What is the load-bearing trick? Is "no odds" different from "tiny odds"? Is it Pascal's Wager in a coat? What's a valid version (asteroid) vs. invalid versions? The user wants to understand *what beats their character*.

  2.  **Deconstruct the Argument Pattern:**
      *   *Core Mechanism:* Expected Value (EV) Calculation. $EV = Probability \times Impact$.
      *   *The Trick:* If Impact approaches Infinity (or is sufficiently massive), even a vanishingly small Probability yields a high EV.
      *   *The Flaw:* The Probability is epistemically inaccessible (unknown, unknowable, or arbitrarily assigned).
      *   *The Symptom:* Argument immunity. Since the probability can't be disproven (you can't prove it's *zero*), the argument stands. Also, it can justify anything (AI or Malaria) depending on which "Infinite" payoff you choose.

  3.  **Identify Existing Terms/Concepts:**
      *   *Pascal's Wager:* The ancestor. Belief in God $\times$ Infinite Heaven = Believe. User correctly notes this is theological.
      *   *Pascal's Mugging:* This is the precise philosophical term for the secular, finite-but-huge version. A mugger says, "Give me $5 or I'll use magic to kill $3 \uparrow\uparrow\uparrow 3$ people."
      *   *Longtermism:* The ethical framework often associated with Entry 1 and 3 (AI safety, existential risk).
      *   *Speculative Altruism / Effective Altruism (EA) fringe:* The movement context.
      *   *Black Swan:* Unpredictable high-impact events, but usually descriptive, not prescriptive for action based on unknown odds.
      *   *Precautionary Principle:* Act to prevent harm even if cause/effect isn't fully established. Close, but usually focuses on *risk avoidance* rather than *upside gambling* (though Entry 2 is risk avoidance).
      *   *Zero Risk Bias:* Wanting to eliminate a risk entirely regardless of cost.
      *   *Motte and Bailey:* Not quite. That's about retreating to a defensible position.
      *   *Argument from Ignorance:* "You can't prove it won't happen." Relevant, but too broad.

  4.  **Select the Best Fit:**
      *   **Pascal's Mugging** is the technical philosophical term. It captures the "tiny probability $\times$ huge utility" dynamic perfectly.
      *   **Longtermism** is the cultural/ideological vehicle.
      *   **Epistemic Black Hole** (metaphorical): Describes how it sucks in reasoning.
      *   **The "Shut Up and Multiply" heuristic:** A phrase used within the Effective Altruism community that describes the *method* of the argument (just do the math, ignore intuition).

  5.  **Address the "Carving" (The Load-Bearing Trick):**
      *   The user asks: *Which bit is the load-bearing trick?*
      *   It's the **decoupling of probability from evidence**.
      *   In normal reasoning, Probability is constrained by Evidence. In this pattern, Probability is a "free variable" that can be set to "non-zero" based solely on logical possibility.
      *   The "Unbounded Payoff" is the lever, but the "Missing Odds" is the fulcrum.
      *   *Crucial distinction:* Is "no odds" different from "tiny odds"? Yes. "Tiny" implies an estimate. "No odds/Non-zero" implies logical possibility. The argument relies on the latter to avoid falsification.

  6.  **Address the "Valid Version" (The Asteroid):**
      *   When is this reasoning okay? When the probability is *estimable* and the mechanism is *understood*.
      *   Asteroid defense: We know physics. We can track rocks. The probability is small but *quantified*. The impact is huge.
      *   Biotech/AI/Precedent: The mechanism is speculative. The probability is *unknown* (Knightian Uncertainty vs. Risk).

  7.  **Drafting the Response:**
      *   *Tone:* Respectful, analytical, precise (matching the user's "carving" request). No fluff.
      *   *Name:* **Pascal's Mugging**. (Explain the origin briefly: Eliezer Yudkowsky/LessWrong).
      *   *The Carving:* Break down the mechanism.
          *   Load-bearing trick: **The Non-Zero Loophole**. (Shifting from "likely" to "possible").
          *   The Engine: **Unbounded Utility**.
          *   The Immunity: **Epistemic Shielding** (You can't prove the negative).
      *   *Differentiation:* "Tiny odds" (Risk) vs. "Unknown odds" (Uncertainty/possibility). The argument collapses if you demand a number.
      *   *The Valid Case:* Planetary Defense. Why? Because the probability is *derived from measurement*, not imagination.
      *   *How the Character Loses:* The character loses because she is arguing on *evidence*, and the opponent is arguing on *possibility*. Evidence cannot kill Possibility. She needs to attack the *valuation* or the *mechanism*, not the odds.

  8.  **Refining the "Carving" (Self-Correction during drafting):**
      *   Wait, the user said "I'm not after a reading list." Keep theory minimal.
      *   The user asked: "Is the version where nobody has any odds at all definitely a different animal from the version where the odds are just tiny?"
      *   *Answer:* Yes. One is **Risk** (known distribution), one is **Knightian Uncertainty** (unknown distribution). Pascal's Mugging exploits Uncertainty by pretending it's Risk.
      *   The user asked: "What's the nearest case where this reasoning is actually fine?"
      *   *Answer:* Insurance against existential risk *where the mechanism is physical and measurable* (e.g., nuclear deterrence, asteroid tracking).
      *   *Why fine?* Because the "non-zero" claim is backed by a causal chain, not just logical consistency.

  9.  **Final Polish:**
      *   Make sure to explicitly answer "What beats her?"
      *   She loses because she is playing Chess (strategy/evidence) and the opponent is playing Calvinball (rules made up as they go).
