      *   Address the "valid asteroid" question.
      *   Keep it useful for a novelist.

      *(Self-Correction)*: I should mention "Longtermism" as the cultural context, as that's likely where the user heard these arguments (Entry 1 and 3 are classic Longtermist EA talking points). But "Pascal's Mugging" is the logical fallacy name.

      *(Refining the "Load-Bearing Trick")*: It's the **incommensurability**. You can't weigh a concrete cost against an abstract infinity. The trick is forcing the comparison.

      *(Refining the "Valid Case")*: The difference is **falsifiability**. Asteroid risk is falsifiable (we see the rock). AI/Tenants/Biotech is not.

