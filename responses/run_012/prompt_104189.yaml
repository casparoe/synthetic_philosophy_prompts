answer: |-
  **Recommendation**

  We should not issue a subsidiarity objection to the draft regulation on data centres. While water and land use are traditionally local matters, the cross-border nature of electricity grids and the mobility of capital create a collective action problem that member states cannot solve alone. EU-wide minimum standards prevent a race to the bottom without removing local veto power on specific sites. However, we must reject the proposed standing interpretation requiring exhaustion of local remedies and sunset clauses for new competences. That procedural change would shift the burden of proof too high, forcing us to wait for failures before acting, which is incompatible with preventive governance on climate and infrastructure.

  **What we're actually deciding**

  We have two distinct votes. First, we must decide whether the Commission's draft regulation on data centres breaches the principle of subsidiarity. This principle says the EU should only act if objectives cannot be sufficiently achieved by member states. If we vote that it breaches subsidiarity, we send a formal objection that forces the Commission to review the draft. The regulation sets minimum standards for water disclosure, cooling efficiency, and municipal consultation for large data centres.

  Second, we are asked to adopt a new internal rule for how our committee interprets subsidiarity in all future cases. The proposal suggests we should only support EU action where lower levels of government have already tried and failed to solve the problem (exhaustion), and that new EU powers should automatically expire unless renewed (sunset). This is not about data centres specifically; it is about changing the threshold for when we allow Brussels to act at all.

  **The case for objecting**

  The argument against this regulation is principled and strong. Water aquifers do not respect national borders, but they certainly respect municipal boundaries. The people who live next to a data centre are the ones who suffer if their taps run dry or their landscape is industrialized. They are also the ones who benefit from the jobs and tax revenue. That trade-off should be made by the community facing the consequences, not by officials in Brussels.

  Furthermore, land-use planning is the core competence of local democracy. A uniform EU standard risks imposing a one-size-fits-all solution on diverse geographies. A cooling system suitable for Sweden may be inappropriate for Spain. By setting EU-wide rules, we risk dampening innovation and removing the ability of regions to tailor economic development to their specific needs. If a region wants to prioritize attracting tech investment over strict water conservation, that is a democratic choice they should be allowed to make. The Commission's fear of a "race to the bottom" assumes citizens don't care about their environment, which is patronizing.

  **The case against**

  While local control is the default, it fails when the costs are exported and the capital is mobile. A data centre operator can threaten to move to a neighbouring region if water rules are too strict. This pits municipality against municipality, forcing them to loosen protections to compete for investment. This is not democratic choice; it is coercion by capital. We saw this with tax havens and corporate rates; we should not repeat it with essential water resources.

  Additionally, the grid is not local. Data centres require massive power connections that often span regions or countries. Inefficient cooling in one member state increases energy demand across the interconnected European grid, affecting prices and carbon targets for everyone. The regulation does not ban local decisions; it sets a floor. Municipalities still grant the permits. They still decide siting. They just cannot decide to ignore basic efficiency standards or hide water usage data. This is not Brussels taking over; it is Brussels ensuring that local competition doesn't destroy the common resources we all share.

  **The exhaustion and sunset rule**

  The proposed standing rule sounds rigorous but is practically unworkable. An "exhaustion requirement" means we must wait for local systems to fail before the EU can step in. On issues like climate change or pandemics, waiting for failure is too late. We act to prevent harm, not just to clean up afterwards. Similarly, sunset clauses create uncertainty for businesses and investors who need stable rules to build infrastructure. If every environmental standard expires in five years unless renewed, long-term planning becomes impossible. This rule treats subsidiarity as a barrier to be cleared rather than a guide for appropriate action. It would not make us more serious about subsidiarity; it would make us irrelevant to the problems citizens expect us to solve.

  **What I'll say at the meeting**

  *   I taught civics for eleven years. I believe in local control. But I also know that when players can move their pieces off the board, the local referee loses authority.
  *   I ran for this seat on a bus route. That was local. But if the bus depot burns down because of unsafe wiring standards, that's a safety issue that shouldn't depend on which town you're in.
  *   On the data centres: Don't object. Let municipalities decide *where*, but ensure they don't decide to *drain the aquifer dry*.
  *   On the new rule: Voting for exhaustion is voting for failure. We are here to prevent fires, not just fund fire trucks.
  *   Let's not hide behind procedure to avoid hard choices. Support the regulation, reject the procedural change.
