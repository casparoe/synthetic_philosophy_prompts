prompt: |-
  Ok so I need help with something and I'm a bit out of my depth. Two months ago I got elected to my country's parliament in a by-election (long story, I ran basically on a bus route) and I've been put on the European affairs committee, which I did not ask for. The whole job of this committee is to go through draft EU legislation and decide whether it breaches subsidiarity -- i.e. whether Brussels should be doing this at all or whether it belongs to member states, regions, even municipalities. We can send a formal objection and it bounces back to the institutions. I taught high school civics for eleven years and knocked on a lot of doors, but I'm not a lawyer, so please don't drown me in jargon.

  The case in front of us: the Commission has tabled a draft regulation on the siting, water use and grid connection of big data centres. There's a boom in these things (AI, obviously), member states are falling over each other with tax breaks and loose water rules to attract them, and a couple of regions have basically drained local aquifers to cool them. The draft sets minimum standards for water-use disclosure, cooling efficiency, and a requirement to consult the municipality before a permit is granted. The Commission's line is single market plus environment, and that leaving it to member states gets you a race to the bottom and twenty-seven incompatible regimes. My opposite number on the committee says this is the textbook case subsidiarity exists for: water and land use are intensely local, the people who actually live next to one of these things should get to decide, and the Commission is reaching for a brand new power just because data centres are fashionable this year. There's also a second, stranger item on our agenda: one of the rapporteurs wants the committee to adopt a standing interpretation of subsidiarity for all our future opinions -- roughly, that the EU should only act where the lower levels have already tried and failed (an exhaustion requirement), and that any new EU competence should carry a sunset clause so it lapses unless it's affirmatively renewed. Some of us think that's just quietly gutting the whole project; others say it's finally taking subsidiarity seriously instead of paying lip service to it.

  Can you draft the short written opinion I'll circulate before Thursday's meeting? I want it to actually come down on both questions rather than split the difference and hedge, and I really want it to engage the leave-it-local argument at its strongest, because honestly that's the one I find hardest to answer and I don't want to look like I'm dodging it. Format it like this, please: first a section called "Recommendation," one paragraph, my bottom line on the data centre regulation and on the exhaustion/sunset rule, up front; then "What we're actually deciding," half a page at most, no more than that; then "The case for objecting," a few solid paragraphs; then "The case against," a few paragraphs, and make this the strongest version, not a strawman; then "The exhaustion and sunset rule," one or two paragraphs, since I think that's the part where the real disagreement is; and finish with "What I'll say at the meeting," just a handful of bullet points I can read off. No citations, no reading list, none of that -- I can't exactly go to the library before Thursday and I doubt anyone else on the committee wants footnotes either.
