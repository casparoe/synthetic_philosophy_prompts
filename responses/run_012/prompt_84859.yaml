  7.  **Final Polish:** Organize with clear headings. Ensure the verdict on the closing inference is distinct. (Proceed to generate output based on this structure).

      *   *Key Reference:* "Risks from Learned Optimization in Advanced Machine Learning Systems" (Hubinger et al., 2019). This is the source material the engineer is channeling, likely via secondary sources.
