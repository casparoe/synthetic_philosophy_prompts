  **BUREAU OF ACTIONAL COMPLIANCE**
  **GUIDANCE NOTE 742: ASCRITIVE LIABILITY AND FORESEEN SIDE-EFFECTS**

  **1.0 PURPOSE**
  1.1 This Note clarifies the operational definition of "Intentional" pursuant to Section 12 of the Liability Act. It establishes the protocol for determining whether a foreseen side-effect of an action constitutes an intended outcome for the purposes of sanction or commendation.

  **2.0 DEFINITIONS**
  2.1 **Foreseen Indifference:** A state wherein an agent acknowledges a side-effect will occur but proceeds without altering their primary course of action.
  2.2 **Ascriptive Valence:** The moral quality of a side-effect as determined by the Bureau.
  2.3 **The Asymmetry Protocol:** Where Foreseen Indifference is established, a side-effect is deemed **Intentional** if the Ascriptive Valence is negative (harmful). A side-effect is deemed **Unintentional** if the Ascriptive Valence is positive (beneficial).

  **3.0 WORKED EXAMPLES**
  3.1 **Case A (Negative Valence):** *Logistics Corp v. State.*
  The agent authorized a delivery schedule knowing it would increase neighborhood noise levels by 15%. The agent stated profit was the sole goal; noise was irrelevant.
  *Ruling:* The noise increase is **Intentional**. Liability attaches. The agent's indifference to harm constitutes acceptance of harm.

  3.2 **Case B (Positive Valence):** *ChemCo v. State.*
  The agent authorized a waste filtration process knowing it would release a byproduct that fertilizes local soil. The agent stated compliance was the sole goal; soil quality was irrelevant.
  *Ruling:* The soil improvement is **Unintentional**. Commendation is denied. The agent's indifference to benefit constitutes non-engagement with benefit.

  **4.0 OMISSIONS**
  4.1 Where an agent foresees a harmful side-effect of their inaction and possesses the capacity to prevent it, failure to act is treated as the intentional production of that harm. The Asymmetry Protocol applies identically to failures to act. No liability attaches for failures to produce beneficial side-effects.

  **5.0 CONTESTED VALENCE**
  5.1 In cases where the side-effect impacts an institution rather than a natural person (e.g., a rival firm), valence is determined by market stability metrics.
  5.2 **Hard Case:** *Algorithmic Solutions Ltd.* implemented a code update foreseen to render a competitor's proprietary software obsolete.
  *Ruling:* Obsolescence is deemed harmful to the competitor but beneficial to market efficiency. As the competitor holds 'Non-Essential' tax status, the harm to the firm outweighs the market benefit. The obsolescence is **Intentional**. Had the competitor held 'Essential Infrastructure' status, the benefit would have been deemed primary, and the side-effect **Unintentional**.

  **6.0 NEUTRALITY CONTROLS**
  6.1 Recent internal studies (Ref: Study 88-Neutral) indicated that when side-effects are stipulated as morally neutral (e.g., changing the font on invoices), the Asymmetry Protocol fails to trigger; agents are neither praised nor blamed, and intentionality ratings converge at 50%.
  6.2 **Bureau Determination:** True moral neutrality is empirically rare. In Study 88-Neutral, the font change affected reader fatigue, thereby acquiring negative valence. Future filings claiming neutrality must demonstrate zero impact on human welfare. Absent such proof, the Bureau will assign valence based on outcome.

  **7.0 AUTHORITY**
  7.1 This Note supersedes Circular 104. Compliance is mandatory.

  ***

  **ANNEX A: INTERNAL MEMORANDUM (DISSENTING)**
  **From:** Junior Analyst K.
  **To:** Director of Standards
  **Re:** Causal Direction in Note 742

  I must register an objection to the logical foundation of Section 2.3. The Note assumes the public first identifies an outcome as "Intentional" and subsequently assigns blame or praise. However, empirical observation suggests the reverse: observers assign blame based on the outcome's quality, then retroactively attribute "Intent" to justify the sanction.

  If this is correct, the Bureau is not codifying the ordinary concept of intention. We are codifying the public's desire for a target. By treating the asymmetry as a diagnostic tool for mental states, we are reifying a post-hoc rationalization. We are not measuring intent; we are measuring outrage.

  **Director's Reply:** Filed. The objection confuses ontology with procedure. Whether intent precedes blame or blame precedes intent is metaphysically irrelevant. The Protocol yields consistent liability judgments. Consistency is the mandate. The definition of "Intentional" shall remain as written.
