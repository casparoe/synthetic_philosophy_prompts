answer: |-
  1. **Question:** You argue that ISOTYPE is a genuine language, yet you grant it lacks the resources for negation, conditionals, and quantified claims about non-typical cases; is this logical poverty merely a limitation of the medium, or does it indicate that the notation was built for a restricted domain of content rather than for reasoning generally?
     * **Design Note:** Establishes the technical boundaries of the notation to test the "language" claim early.
     * **Follow-up:** She will likely reply that it was built for statistical facts, not for argument generally; press her on whether statistical fact is a natural kind of content or a category constituted by the notation's own constraints.

  2. **Question:** If the notation cannot express logical operators independently, does its status as a "language" depend entirely on its coupling with verbal scaffolding, and if so, in what sense does it function as an independent system rather than a decorated gloss on prose?
     * **Design Note:** Presses the "auxiliary" defense immediately by questioning the independence required for linguistic status.
     * **Follow-up:** If she insists it is independent in its visual syntax, ask whether a syntax that cannot deny its own propositions can truly be said to represent truth-conditions, or merely presence.

  3. **Question:** If protocol statements are revisable, if there is no tabula rasa, and if Neurath's boat is the right image for inquiry, what entitles the pictogram to present social facts as neutral with respect to interpretation and culture?
     * **Design Note:** Puts the anti-foundationalism and the visual program into direct tension regarding epistemic authority.
     * **Follow-up:** Her likely reply is that the transformation from source data to finished chart is an explicit and accountable act of interpretation rather than a concealed one; ask what distinguishes an accountable transformation from an unaccountable one, and whether that distinction can be drawn without appealing to exactly the sort of privileged vantage point her reading denies.

  4. **Question:** You emphasize the division of labour between data, transformer, and chart, but does inserting a trained human interpreter between the source and the display act as a concession to the theory-ladenness of observation that Neurath elsewhere resists, or is it an institutional answer to it that relocates the problem rather than solving it?
     * **Design Note:** Targets the "Transformer" role to see if it solves the epistemic problem or merely bureaucratizes it.
     * **Follow-up:** If she argues it institutionalizes the solution, ask whether an institutional solution that relies on expert training contradicts the claim that the resulting charts are immediately accessible to the untrained eye.

  5. **Question:** On your reading, unity has to be relocated from a shared language to a shared practice and a shared encyclopedia, but can a notation that cannot be rendered sentence-by-sentence into the physicalist thing-language serve the unity project at all?
     * **Design Note:** Challenges the integration of the visual work into the core Unity of Science project.
     * **Follow-up:** If she claims unity is achieved through use rather than translation, ask whether this reduces the Unity of Science from a philosophical thesis about language to a sociological observation about collaboration.

  6. **Question:** Situating the program in Red Vienna and in adult education, is the claim of universal readability an empirical hypothesis, an ideological commitment, or both, and does the typical figure in a pictogram function as a normative construct rather than a neutral one?
     * **Design Note:** Situates the epistemic claims within the specific political and pedagogical context of Neurath's work.
     * **Follow-up:** If she argues the figure is a functional abstraction, ask whether that abstraction implicitly encodes a specific vision of the citizen that aligns with the social democratic goals of Red Vienna.

  7. **Question:** The same graphic system was taken up across politically opposed regimes and adapted to opposed purposes; does that uptake support the universality thesis, or does it show the notation to be a flexible rhetorical instrument whose apparent transparency is itself a persuasive effect?
     * **Design Note:** Confronts reception history to test whether "universality" is actually "malleability."
     * **Follow-up:** If she argues the core syntax remained constant, ask whether the constant syntax is too thin to carry the meaning, forcing the viewer to import the ideological context to make sense of the images.

  8. **Question:** You describe the notation as a helping or auxiliary language, yet you also claim it is the practical completion of Neurath's anti-foundationalism; if it is merely auxiliary, how can it be the completion of the philosophy rather than just a tool for disseminating it?
     * **Design Note:** Directly targets the tension between the "completion" thesis and the "auxiliary" shield.
     * **Follow-up:** If she replies that the philosophy requires a tool for social enactment, ask whether a tool that cannot function without verbal accompaniment can be said to complete the philosophy, or merely illustrate it.

  9. **Question:** What archival or conceptual evidence would show that the visual work really was a side project, or that it betrays rather than completes the coherentism you attribute to it?
     * **Design Note:** Sets the conditions for falsification to force a commitment to specific evidentiary standards.
     * **Follow-up:** Ask what she would have to give up elsewhere in her interpretation if the picture language turned out to be ineliminably dependent on the verbal commentary that accompanied it in the museum setting.
