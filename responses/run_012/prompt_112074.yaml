prompt: |-
  I run communications for a mid-sized state health department — it's me plus two writers, and basically everything from outbreak notices to the commissioner's op-eds crosses my desk before it goes out, usually on a tight clock. I've been lurking on rationalist blogs and forums for, God, a decade now, and the thing that keeps nagging me is the lying-vs-misleading question. Everyone agrees lying is bad, but honestly half our job is choosing which true things to say and which true things to sit on, and I genuinely can't tell anymore where "framing" ends and "deceiving people" begins. The commissioner's whole guidance is "just don't lie," which is useless, because the drafts that scare me most are ones where every single sentence is literally true. I want a decision procedure my team can actually run on a draft before it ships — grounded in what the philosophy of language actually knows about the gap between what a sentence says and what it gets people to believe (implicature, presupposition, what's asserted vs. what's merely suggested, the difference between "causing someone to have a false belief" and "intentionally deceiving them"), not just vibes.

  So: give me the questions to ask, in order, what counts as a sufficient answer at each step, where the procedure stops with a hard no, and where it has to hand the call to a human because the question is really one of values and not facts. It has to be runnable by a smart writer who's never read any philosophy, in maybe fifteen minutes, and it has to be honest about which steps are just judgment calls dressed up as tests — I'd much rather have a procedure with clearly marked holes than one that pretends to settle everything. Then run it on three drafts of ours. (1) A water-quality notice where we lead with "the water is within legal limits" while burying the fact that the legal limit is way above what our own toxicologist thinks is safe — my instinct is that this is the bad one but I want the procedure to tell me why, if it's really bad. (2) A statement that a clinic closure is "part of a routine review" when the real story is the lease fell through and we're embarrassed. (3) One I think we're actually fine on: a release that says an outbreak is "under investigation" and leaves off "and it's spreading," because at the time we genuinely didn't know which way it was going. I especially want you to flag any case where the procedure says a statement I'm quietly proud of is actually over the line. Also, my two writers are going to ask "what if we can't tell whether the audience will draw the false inference" — build in an answer to that instead of hand-waving.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Communications Director at a mid-sized state health department. Small team (3 people total). High stakes (public health), tight deadlines.
      *   **Background:** Long-time lurker in rationalist communities (LessWrong, Slate Star Codex, etc.). Familiar with concepts like "lying vs. misleading," "implicature," "presupposition," "intent vs. outcome."
      *   **Problem:** The "don't lie" guidance from leadership is insufficient. They need a practical decision procedure to distinguish between acceptable framing and unacceptable deception (specifically *misleading* without *lying*).
      *   **Requirements:**
          *   A step-by-step decision procedure (algorithm/checklist).
          *   Grounded in philosophy of language (Grice, etc.) but accessible to non-philosophers.
          *   Time limit: ~15 minutes to run.
          *   Honesty about limitations (mark where it's a value judgment, not a fact).
          *   Handle uncertainty ("what if we can't tell what the audience will infer?").
          *   Apply the procedure to three specific draft scenarios provided.
          *   Flag cases where the user's intuition might be wrong.

  2.  **Deconstruct the Philosophical Core:**
      *   *Lying:* Asserting $P$ when you believe $\neg P$. (User says this is covered/banned).
      *   *Misleading:* Asserting $P$ (true) to imply $Q$ (false or misleading), where $Q$ is not asserted but implicated.
      *   *Gricean Maxims:* Quantity (say enough), Quality (truth), Relation (relevance), Manner (clarity). Violating these generates implicatures.
      *   *Intent:* Did you *intend* the false belief, or just foresee it? (The Doctrine of Double Effect distinction).
      *   *Paltering:* Using truthful statements to create a false impression.
      *   *Omission:* Leaving out crucial context.

  3.  **Drafting the Decision Procedure (The "Truthful Framing Protocol"):**
      *   *Goal:* Make it actionable. Use plain English but keep the philosophical rigor underneath.
      *   *Structure:* Sequential questions. Stop conditions (Hard No, Green Light, Escalate).
      *   *Step 1: Literal Truth.* (Baseline).
      *   *Step 2: The Inference Test.* (What will they believe?).
      *   *Step 3: The Intent/Foreseeability Test.* (Did we mean for them to believe that?).
      *   *Step 4: The Omission/Context Test.* (Is the missing info material?).
      *   *Step 5: The Uncertainty Clause.* (Addressing the writers' concern about not knowing audience reaction).
      *   *Step 6: The Values Escalation.* (Where philosophy ends and ethics begins).

      *Refining Step 5 (Uncertainty):* The user specifically asked for this. If we don't know what they'll infer, we must assume the *worst reasonable* inference. This aligns with the precautionary principle in comms.

      *Refining the "Hard No":* Needs to be clear. If the intent is to induce a specific false belief, it's a no.

  4.  **Applying the Procedure to the Three Drafts:**

      *   **Draft 1: Water Quality ("Within legal limits" vs. Toxicologist's safety view).**
          *   *Literal:* True.
          *   *Inference:* "The water is safe."
          *   *Reality:* Toxicologist thinks it's unsafe.
          *   *Intent:* Likely to prevent panic, but effectively hides risk.
          *   *Verdict:* High risk of misleading. The gap between "legal" and "safe" is material.
          *   *User's Instinct:* Thinks it's the bad one.
          *   *Procedure Result:* Should flag this as problematic (likely a "Hard No" or "Escalate").

      *   **Draft 2: Clinic Closure ("Routine review" vs. Lease fell through/Embarrassment).**
          *   *Literal:* Is it a routine review? If the lease falling through triggered a review, maybe technically true? Or is it a lie? Let's assume it's technically true (they are reviewing options).
          *   *Inference:* "This is planned/normal."
          *   *Reality:* "This is a failure/accident."
          *   *Intent:* To hide embarrassment.
          *   *Verdict:* This is classic paltering. The motive is self-protection, not public welfare.
          *   *Procedure Result:* Hard No.

      *   **Draft 3: Outbreak ("Under investigation" vs. "Spreading").**
          *   *Literal:* True.
          *   *Inference:* "We don't know the status."
          *   *Reality:* "We don't know the status" (at the time).
          *   *Intent:* To avoid speculation.
          *   *Verdict:* This seems fine. It's epistemic humility.
          *   *User's Instinct:* Thinks it's fine.
          *   *Procedure Result:* Green Light. *Self-Correction:* Wait, I need to check if the procedure flags it. If the public infers "It's not spreading," is that our fault? If we genuinely didn't know, omitting "spreading" isn't misleading, it's accurate reporting of uncertainty.

  5.  **Addressing the "Rationalist" Tone:**
      *   The user speaks "rationalist." Use terms like "Bayesian update," "MAP estimate," "Schelling point," "Goodhart's Law," "Steel-manning."
      *   Acknowledge the tension between institutional incentives and truth-seeking.
      *   Be direct, slightly dry, but empathetic to the constraint of public health comms (panic vs. transparency).

  6.  **Developing the "Uncertainty" Answer:**
      *   Writers ask: "What if we can't tell whether the audience will draw the false inference?"
      *   Answer: The "Reasonable Listener Standard." If a *reasonable* person *could* draw the false inference, and that inference matters, you must clarify. Don't gamble on audience sophistication.

  7.  **Review and Refine:**
      *   *Check:* Did I mark the value judgment holes? Yes, specifically around "Materiality" and "Public Interest."
      *   *Check:* Is it 15 minutes? Yes, 6 steps with binary-ish outputs.
      *   *Check:* Did I run the drafts? Yes.
      *   *Check:* Did I challenge the user? I need to make sure I don't just validate their intuition on Draft 1. I need to explain *why* it fails the test (the definition of "safe" vs "legal").
      *   *Check:* Draft 2 is the clearest violation. Draft 3 is the clearest pass. Draft 1 is the nuanced one.

  8.  **Final Polish:**
      *   Ensure the tone is professional but acknowledges the "rationalist" background (e.g., referencing Grice without getting bogged down in academic citations).
      *   Make the "Escalation" step clear—when does the Comms Director have to call the Commissioner?

  *(Self-Correction during drafting)*: I initially thought about making Draft 1 a "Hard No." But in public health, "legal limits" *are* the operational definition of safety for the public, even if toxicologists disagree internally. If we say "unsafe," we might cause panic without actionable advice. The procedure needs to distinguish between *hiding risk* and *operational definitions*. I will mark this as a "Values Escalation" point rather than a hard lie, because it depends on whether the department's duty is to the law or the toxicologist's unpublished opinion. Actually, given the user's prompt ("legal limit is way above what our own toxicologist thinks is safe"), hiding that discrepancy is arguably deceptive regarding the *level of risk*. I will lean towards flagging it as misleading because the implicature "safe" is false relative to expert knowledge held by the speaker.

  *(Refining the Uncertainty Step)*: The prompt asks specifically to build in an answer for "what if we can't tell." I will make this Step 4.5 or part of Step 4. The rule is: "Assume the inference that maximizes reputational risk."

  *(Final check on Draft 3)*: User says "leaves off 'and it's spreading,' because at the time we genuinely didn't know." If they didn't know, they can't assert it. But does omitting it imply it *isn't* spreading? Grice's Maxim of Quantity: Say as much as is required. If "spreading" is a key variable, omitting it might imply "not spreading." However, "Under investigation" usually implicates "Status unknown." I need to be careful here not to over-flag uncertainty. I will argue this passes because the implicature of "investigation" is "uncertainty," not "safety."

