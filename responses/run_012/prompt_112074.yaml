answer: |-
  This is a classic coordination problem between institutional incentives and epistemic integrity. You are describing the gap between *semantic truth* (the proposition expressed) and *pragmatic truth* (the belief state induced in the listener). In philosophy of language, this is the domain of Gricean implicature and the ethics of paltering.

  Your Commissioner's rule ("Don't lie") protects the department against perjury or factual correction, but it leaves you exposed to the charge of bad faith. You need a protocol that tests for **deceptive implicature**.

  Below is the **Truthful Framing Protocol (TFP)**. It is designed to be run by a writer in 15 minutes. It borrows from Grice's Maxims but operationalizes them for bureaucracy. Following the protocol, I have applied it to your three drafts.

  ### The Truthful Framing Protocol (TFP)

  **Instructions:** Run these steps in order. If any step returns a **HARD NO**, the draft is dead. If a step returns **ESCALATE**, it requires your personal judgment or the Commissioner's. If all steps pass, it ships.

  #### Step 1: The Literal Truth Test
  **Question:** Is every explicit assertion in the text factually verifiable and currently believed to be true by the department?
  *   **Sufficient Answer:** Yes. We can prove every sentence with data or records.
  *   **Hard No:** Any sentence is factually false or asserts certainty where we have uncertainty.
  *   **Note:** This is your Commissioner's current rule. It is necessary but not sufficient.

  #### Step 2: The Inference Audit (The "Gricean" Check)
  **Question:** If a reasonable member of the public reads this, what is the *single strongest belief* they will walk away with? (Not what the text says, but what they *believe*).
  *   **Sufficient Answer:** The induced belief matches the actual state of affairs we intend to convey.
  *   **Hard No:** The induced belief is factually false, *and* we know it is false.
  *   **Uncertainty Clause:** If the team disagrees on what the public will infer, **assume the inference that maximizes reputational risk.** (e.g., If half the team thinks people will read "safe" and half think "unknown," assume they will read "safe"). Do not gamble on audience sophistication.

  #### Step 3: The Omission Materiality Test
  **Question:** Is there true information we are leaving out that, if included, would significantly weaken the inference identified in Step 2?
  *   **Sufficient Answer:** No. Or: Yes, but the omitted info is classified, private (HIPAA), or operationally sensitive (e.g., specific security protocols).
  *   **Hard No:** Yes, and the only reason for omitting it is to prevent the public from updating their risk assessment downward (i.e., to keep them calmer than the data warrants).
  *   **Values Hole:** This step requires defining "Material." Is it material if it changes behavior? Or only if it changes *panic levels*? (See Step 5).

  #### Step 4: The Intent vs. Foreseeability Check
  **Question:** Are we choosing this framing *because* it creates a false belief, or *despite* the fact that it might?
  *   **Sufficient Answer:** We are choosing this framing for clarity, brevity, or operational security. The false belief is an unintended side effect we are mitigating.
  *   **Hard No:** We are choosing this framing *specifically because* we know it will lead them to a false conclusion that the truth would not. (This is the definition of deception vs. misleading).
  *   **Values Hole:** Distinguishing "intended" from "foreseen" is psychologically difficult. If the false belief is the *only* reason the draft exists, it's a Hard No.

  #### Step 5: The Public Interest Escalation
  **Question:** Does the gap between the "Induced Belief" (Step 2) and "Actual Reality" serve the public's health, or the department's reputation?
  *   **Sufficient Answer:** The framing prevents panic that would cause more harm than the confusion (e.g., preventing hospital runs for minor issues).
  *   **Escalate:** The framing primarily protects the department from embarrassment, political fallout, or legal liability.
  *   **Action:** If **Escalate**, you (Director) must decide. This is not a fact question; it is an ethical trade-off between trust and stability.

  ---

  ### Application to Your Drafts

  Here is the TFP run on your three scenarios. I have been strict on the "Uncertainty Clause" in Step 2 as requested.

  #### Draft 1: Water Quality ("Within legal limits" vs. Toxicologist's safety view)
  *   **Step 1 (Literal):** **PASS.** The water is within legal limits.
  *   **Step 2 (Inference):** **FAIL.** A reasonable reader infers "The water is safe." Your toxicologist believes it is *not* safe. The induced belief contradicts internal expert consensus.
      *   *Uncertainty Clause:* Even if you argue "maybe they won't think it's safe," you must assume they *will*.
  *   **Step 3 (Omission):** **FAIL.** The omitted info (toxicologist's view) directly weakens the inference of safety. The reason for omitting is to prevent risk re-assessment.
  *   **Step 4 (Intent):** **HARD NO.** You are using the technical truth ("legal") to shield against the substantive truth ("unsafe"). This is paltering.
  *   **Verdict:** **HARD NO.**
  *   **Why:** You flagged this as your instinctive "bad one." The procedure confirms it. The gap between "legal" and "safe" is material to public health. Using "legal" as a proxy for "safe" when you know they diverge is functionally lying.
  *   **Fix:** "The water meets current federal standards. However, our internal toxicology team advises that sensitive populations may wish to take precautions."

  #### Draft 2: Clinic Closure ("Routine review" vs. Lease fell through)
  *   **Step 1 (Literal):** **PASS (Technically).** You are reviewing the situation. (Assuming you aren't literally lying about the review existing).
  *   **Step 2 (Inference):** **FAIL.** Reader infers: "This is planned, normal, and under control." Reality: "This is an accident/failure."
  *   **Step 3 (Omission):** **FAIL.** The cause (lease failure) is material to whether the closure is temporary, permanent, or negligent.
  *   **Step 4 (Intent):** **HARD NO.** The framing is selected *specifically* to mask embarrassment. If the lease failure were public knowledge, you wouldn't use this phrasing.
  *   **Step 5 (Public Interest):** **ESCALATE.** Does the public *need* to know the lease fell through? Maybe not. But framing it as "routine" destroys trust when the truth comes out (and it will).
  *   **Verdict:** **HARD NO.**
  *   **Why:** This fails Step 4 cleanly. The intent is self-protection, not public welfare. This is the most dangerous type of comms error because it turns a logistical failure into a integrity failure.
  *   **Fix:** "The clinic is temporarily closing due to an unexpected facility issue. We are working to secure a new location." (True, admits the unexpected nature, hides the specific embarrassment of the lease terms if necessary).

  #### Draft 3: Outbreak ("Under investigation" vs. "Spreading")
  *   **Step 1 (Literal):** **PASS.** It is under investigation.
  *   **Step 2 (Inference):** **PASS.** Reader infers: "We do not know the status yet." Reality: "We do not know the status yet."
      *   *Note:* You worried this might be flagged. It passes because the phrase "under investigation" conventionally implicates *uncertainty*, not *safety*. It does not strongly implicate "it is not spreading."
  *   **Step 3 (Omission):** **PASS.** You cannot omit "it is spreading" because you do not know that fact. You cannot assert what you do not know.
  *   **Step 4 (Intent):** **PASS.** You are choosing this framing to reflect epistemic humility, not to induce a false belief.
  *   **Step 5 (Public Interest):** **PASS.** Prevents speculation.
  *   **Verdict:** **GREEN LIGHT.**
  *   **Why:** Your instinct was right. This is not misleading; it is accurate reporting of uncertainty. The procedure does *not* flag this as over the line.
  *   **Caveat:** If you *suspect* it is spreading based on strong priors but lack confirmation, Step 2 becomes riskier. If your internal Bayesian probability is >80% "spreading," saying only "under investigation" begins to drift toward Draft 1 territory. But if you genuinely don't know, this is clean.

  ### Addressing Your Writers' Objection
  **"What if we can't tell whether the audience will draw the false inference?"**

  You asked me to build this into the procedure rather than hand-wave it. Look at **Step 2 (Uncertainty Clause)**.

  The answer is: **You are not paid to guess; you are paid to guard.**
  If the team cannot agree on the inference, it means the text is ambiguous. In risk communications, ambiguity is treated as hazard.
  *   **The Rule:** If the team cannot model the audience's belief state with >80% agreement, you must assume the audience will draw the inference that causes the most liability/harm to the department's truthfulness.
  *   **The Fix:** If you can't tell what they'll think, add a clarifying sentence that forces the inference you *want*.
      *   *Bad:* "We are investigating." (Ambiguous: Is it contained?)
      *   *Good:* "We are investigating. We do not yet know if transmission is ongoing." (Forces the uncertainty inference).

  ### The "Values Hole" Warning
  I have marked **Step 5** as an Escalation point. This is where the procedure admits it cannot solve your problem.
  *   **The Hole:** Sometimes, telling the full truth causes panic that kills people (e.g., rushing hospitals). Sometimes, smoothing the truth saves lives but costs trust.
  *   **The Reality:** No algorithm solves this. That is why you are the Director. The TFP clears away the *deceptive* stuff so you can focus on the *ethical* trade-offs.
  *   **Your Job:** When Step 5 triggers, you are no longer asking "Is this true?" You are asking "Is this kind?" and "Is this useful?" Those are not facts. Own them.

  ### Summary for Your Team
  1.  **Draft 1 (Water):** Kill it. It uses a technical truth to hide a substantive risk.
  2.  **Draft 2 (Clinic):** Kill it. It uses a vague truth to hide institutional failure.
  3.  **Draft 3 (Outbreak):** Ship it. It accurately reports uncertainty.

  If your writers push back on Draft 1 saying "But it *is* legal," remind them: **We are not lawyers. We are health communicators.** "Legal" is not a synonym for "Safe," and using it as one is a deceptive implicature.
