answer: |-
  **MPhil in Economics: Philosophy of Economics**
  **Final Examination**

  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 800 words

  **Question 1**

  Consider a market containing exactly two traders. Both agents satisfy the Common Prior Assumption: they share the exact same prior probability distribution over all states of the world and possess the same information structure. There is no asymmetric information between them. However, they enter into a voluntary trade. Agent A holds a large endowment exposed to a specific risk (e.g., weather-dependent crop yield) and sells a portion of this exposure to Agent B, who has a neutral endowment but is risk-averse.

  (a) Is this scenario a counterexample to the standard no-trade theorems? Justify your answer by distinguishing between the motives for trade permitted in the theorem's framework versus those excluded.

  (b) Based on your answer to (a), evaluate the epistemic moral often drawn from no-trade results: that observed market trade necessarily reveals the existence of private information.

  (c) Finally, suppose prices *did* fully reveal all private information. Explain the tension this creates regarding the incentives for agents to acquire costly information in the first place.

  ***

  **Model Answer**

  The scenario described is not a counterexample to the no-trade theorem, provided one correctly specifies the theorem's antecedent conditions. The standard no-trade result establishes that speculative trade cannot occur between rational agents who share a common prior and common knowledge of each other's rationality. The crucial qualifier here is 'speculative'. The theorem rules out trade driven solely by a divergence in beliefs regarding the expected value of an asset. If agents agree on the probabilities of future states, they agree on the expected return. Without a belief divergence, there is no motive to bet against one another, as any trade would be a zero-sum game in expectation, which risk-averse agents would reject.

  However, the theorem does not rule out trade driven by differences in endowments or risk preferences. In the scenario provided, the trade is not speculative; it is insurance. Agent A is hedging an exogenous risk exposure, and Agent B is providing risk-bearing capacity. Even with identical beliefs about the probability of the weather outcomes, the marginal utility of wealth differs between the agents across states of the world due to their initial holdings. Agent A values wealth more highly in the 'bad weather' state than Agent B does. Consequently, mutually beneficial exchange is possible purely to smooth consumption, independent of information asymmetries. To claim this is a counterexample is to misstate the theorem as ruling out *all* trade, rather than *speculative* trade specifically.

  This distinction fundamentally undermines the strong epistemic moral that observed trade necessarily reveals private information. If trade can be fully explained by risk-sharing motives under a common prior, then the observation of volume in a market is not sufficient evidence to infer asymmetric information. An observer seeing Agent A sell to Agent B cannot conclude that Agent A knows something Agent B does not; they may simply know that Agent A is over-exposed to risk. Therefore, the no-trade theorem supports a conditional claim: *if* trade is speculative, *then* it implies a violation of common priors or rationality. It does not support the unconditional claim that *all* trade implies private information. Conflating hedging with betting leads to a false inference about the informational content of prices.

  This leads to the deeper tension regarding information acquisition. The no-trade theorem generally takes information structures as given. However, if we assume a market equilibrium where prices fully reveal all private information (as in a Strong Form Efficient Market), the incentive to collect that information evaporates. If an agent pays a cost to acquire a signal, but the market price immediately adjusts to reflect that signal before they can trade on it, the agent cannot recoup the cost of acquisition through superior returns. If prices perfectly reveal information, no one has an incentive to produce it; but if no one produces it, prices cannot reflect it.

  This paradox suggests that markets cannot be fully informationally efficient in equilibrium. There must remain some 'noise' or opacity—perhaps via the very risk-sharing trades described in the first part of the question—that prevents prices from being perfectly revealing. This opacity preserves the profit opportunity necessary to compensate agents for the cost of information gathering. Thus, the existence of risk-sharing trade is not merely a technical exception to the no-trade theorem; it is a functional necessity for the existence of an informationally productive market. The mechanics of no-trade show that belief convergence stops betting, but the economics of information production requires that belief convergence never quite happens, or that prices never quite clear the informational gap.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Mechanics of the No-Trade Theorem (6 Marks)**
  *   **A Grade (5-6):** Explicitly distinguishes between *speculative* trade (betting on belief differences) and *risk-sharing* trade (hedging endowment differences). Correctly identifies that the theorem assumes no gains from trade *unless* beliefs differ or endowments allow risk smoothing. States clearly that the scenario is **not** a counterexample.
      *   *Common Fluff:* Students claim the theorem bans all trade, or vaguely suggest risk aversion violates the 'rationality' condition.
  *   **B Grade (3-4):** Identifies that risk-sharing is allowed but fails to explicitly define 'speculative' trade. Correctly concludes it is not a counterexample but the justification is intuitive rather than structural.
      *   *Common Fluff:* Confuses 'common prior' with 'common endowment'.
  *   **C Grade (0-2):** Claims it is a counterexample or fails to address the theorem's conditions.

  **2. The Epistemic Moral (6 Marks)**
  *   **A Grade (5-6):** Argues that trade does **not** necessarily reveal private information because risk-sharing is an alternative explanation. Critiques the inference from 'volume' to 'asymmetric information'.
      *   *Common Fluff:* Asserts that trade always reveals information regardless of the risk-sharing context.
  *   **B Grade (3-4):** Acknowledges the risk-sharing exception but fails to articulate how this weakens the epistemic claim about information revelation.
      *   *Common Fluff:* Repeats the prompt's phrasing without analysing the logical implication.
  *   **C Grade (0-2):** Fails to connect the mechanics of part (a) to the epistemic interpretation.

  **3. Incentives and Information Acquisition (6 Marks)**
  *   **A Grade (5-6):** Articulates the Grossman-Stiglitz tension without needing the name: if prices reveal all, marginal value of private info is zero, so no one collects it. Links this back to the necessity of noise/risk-trade to sustain information production.
      *   *Common Fluff:* Describes the free-rider problem but misses the equilibrium contradiction (if no one collects, prices don't reveal).
  *   **B Grade (3-4):** Identifies that costly information is a problem for efficient markets but treats it as a separate issue from the no-trade theorem mechanics.
      *   *Common Fluff:* Suggests regulation or external subsidies as the solution rather than an endogenous market feature.
  *   **C Grade (0-2):** Vague commentary on 'market efficiency' with no reference to information costs.

  **4. Structure and Clarity (2 Marks)**
  *   **A Grade (2):** Concise, logical flow between the three parts. British English spelling and grammar.
  *   **B Grade (1):** Disjointed arguments or minor linguistic errors.
  *   **C Grade (0):** Difficult to follow or significant language issues.

  **Grade Boundaries:**
  *   **A (16-20):** Secure on all three moves. Distinguishes betting from insurance. Links information incentives to market opacity.
  *   **B (12-15):** Gets the mechanics right (Part 1) but is weaker on the philosophical implications (Parts 2 & 3).
  *   **C (8-11):** Understands the basic setup but confuses the conditions of the theorem.
  *   **Fail (0-7):** Fundamental misunderstanding of the economic concepts.
