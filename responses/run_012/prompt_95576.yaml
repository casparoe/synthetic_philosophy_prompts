      *   *Comparison:* Case 2 (Fraud Guru) had an argument. Case 5 (Philanthropist) had documents. Case 4 (Abuser) had artistic merit (story). The Fat Essay is just "riffing on disgust."
      *   *Prediction:* **Kill.** Why? Because it lacks the *justification* of the pieces she ran. The pieces she ran were either Fiction (Case 4) or Investigative/Argumentative (Case 2, 5). The pieces she killed were Personal/Specific attacks (1, 3, 6). This essay is a Personal/Generalized attack. It falls closer to 1, 3, 6 in spirit (mean-spirited attack) than 2, 4, 5 (Art/Truth).
      *   *Wait, reconsider Rule 1 (Identifiability):* If her rule is strictly "No Libel/No Doxxing," she runs it. If her rule is "No Bullying," she kills it.
      *   *Look at Case 4 again:* "Volunteer quit over it." Nell didn't care. "It's a story."
      *   *Look at Case 2:* "Advertiser pulled." Nell didn't care. "He can write a reply."
      *   *Nell is tough.* She doesn't care about offense. She cares about *fairness* and *reality*.
      *   *Case 1, 3, 6:* Unfair to the subject (Stalking, Unproven Crime, Uncharged Crime).
      *   *Case 2, 5:* Fair-ish (Reply offered, Documents provided, Public Figure).
      *   *Case 4:* Fair (Fiction).
      *   *Fat Essay:* Unfair? It targets a group that cannot reply ("he can write a reply" was her note in Case 2). A category cannot write a reply. It offers no documents/truth (unlike 2 & 5). It is not fiction (unlike 4).
      *   *Verdict:* **Kill.** It fails the "Merit/Truth/Fiction" test of the pieces she accepted, and aligns with the "Unfair Attack" nature of the pieces she killed, even if the target is diffuse.

