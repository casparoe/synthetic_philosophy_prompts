  3.  **Analyze the Current Submission (The "Fat Essay"):**
      *   **Genre:** Comic essay (Nonfiction/Personal Essay hybrid usually, but described as a "riff").
      *   **Content:** Generalized disgust toward fat people as a category.
      *   **Targets:** A protected class/demographic group (weight), not individuals.
