      *   **Which to Bet On:** The "Power & Truth" Rule. Nell protects the magazine's integrity as a place for *truth* or *art*, not just *speech*. The essay is neither truthful (it's prejudice) nor art (it's a riff without structure/argument, unlike the story in Case 4).
      *   **Matching Shape:** None of the six are the *exact* shape. Case 4 is closest (offensive content), but the Fiction/Nonfiction line is the wedge. Case 1/3/6 are closest in *malice*, but lack specific targets.
      *   **The Test Case:** To distinguish the rules, propose a piece that names a *powerful* person but is *false/garbage* (tests Truth vs Power) OR a piece that targets a *marginalized group* but is *fiction* (tests Category vs. Individual). Actually, the best test is: A piece attacking a marginalized group *via fiction*. If she runs it, it's about Identifiability. If she kills it, it's about Power/Dignity.
      *   **Advice to User:** Don't spend the goodwill. It's a losing fight.

  7.  **Refining the Argument (Self-Correction during drafting):**
