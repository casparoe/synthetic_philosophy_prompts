      *   *Rule 1: Specific Harm to Individuals (Legalistic).* Predicts **Run**. (No names, no libel).
      *   *Rule 2: Power Dynamics/Punching Down (Ethical).* Predicts **Kill**. (Targeting a marginalized group vs. targeting a powerful guru/philanthropist).
