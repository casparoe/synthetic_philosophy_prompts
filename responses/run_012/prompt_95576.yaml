          *   *Past Cases:* Fits Case 1 (stalking harm), Case 3 (libel/reputation harm), Case 6 (legal/reputation harm). Fits Case 2 & 5 (Public figures assume risk, truth/defense available). Fits Case 4 (Fiction = no real harm).
          *   *Current Case:* Does "making fun of fat people" count as harm? Mill usually refers to direct, tangible harm. Stigma is abstract. If Nell follows strict Mill, she might **Run** it because no specific individual is harmed, no laws broken, no violence incited.
          *   *Weakness:* Mill is vague on "dignity" vs. "hurt feelings."

      *   *Hypothesis B: Identifiability & Specificity (The "Don't Name Names" Rule).*
          *   *Pattern:* She kills pieces that target *specific, living, private individuals* with negative claims (1, 3, 6). She runs pieces that target *public figures, the dead, or abstract concepts/characters* (2, 4, 5).
          *   *Current Case:* Targets a *category*, not individuals. No names.
          *   *Prediction:* **Run.** It fits the "no specific victim" pattern of Cases 2, 4, 5.
          *   *Weakness:* Case 4 was fiction. This is an essay (nonfiction voice). Does the "essay" format imply real-world assertion more than fiction?

      *   *Hypothesis C: Verifiability/Truth Claim (The "Garbage Reporting" Rule).*
          *   *Pattern:* She killed Case 3 because reporting was garbage. She ran Case 2 & 5 because there were documents/arguments.
          *   *Current Case:* No truth claims. It's opinion/comedy. Can't be proven false.
          *   *Prediction:* **Run** (or Kill based on lack of merit, but usually lack of falsifiability protects speech).
          *   *Weakness:* Doesn't account for the "viciousness" factor.

