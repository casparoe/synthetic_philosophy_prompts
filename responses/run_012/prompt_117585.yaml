answer: |-
  Opening

  Do not begin by defining thought experiments. Your audience expects a lecture on why their vignettes are unscientific rubbish. Disarm this immediately. State plainly that every discipline represented here relies on controlled impossibilities to test theories, and that philosophy does the same. Your purpose is not demolition but calibration. Frame the session as maintenance for a tool they cannot discard. Tell them you will not argue that cases are worthless, but that they possess distinct functions which, when conflated, produce error. Promise them that by the end, they will possess a criterion for distinguishing when a case is doing heavy lifting and when it is merely decorating the argument. This validates their practice while introducing the necessity of the distinction you will unfold.

  The sequence

  The session must unfold as a single argument, not a catalogue of tips. Begin by soliciting a standard hypothetical from each discipline—a stylised agent, a legal party, a vignette. Write these on the whiteboard. This establishes shared ground and validates their methodology. Dependence: you cannot critique the tool until you have acknowledged its ubiquity.

  Next, introduce the carrying case (see below) in its first variation only. Ask for a verdict. Record the consensus. Then present the second variation. Ask for a verdict again. Record the conflicting consensus. Only now reveal that the structural conditions are identical save for one variable. This creates cognitive dissonance. Dependence: the distinction you intend to teach cannot be understood abstractly; it must be felt as a problem first. If you define the categories before showing the failure, they will treat them as jargon rather than solutions.

  Third, derive the distinction from this dissonance. Explain that in the first instance, the case functioned argumentatively—it constrained a theory. In the second, it functioned rhetorically—it leveraged a bias to produce a verdict without logical warrant. This is where you validate your instinct: the spine holds, provided you frame 'rhetorical' not as 'false' but as 'psychologically vivid but logically inert'. Dependence: this definition relies on the previous step; without the experienced conflict, the distinction appears arbitrary.

  Fourth, return to the examples they provided at the start. Ask them to re-classify their own cases using this new lens. Which features are constraints, and which are vividness? Dependence: they cannot audit their own work until they possess the diagnostic tool derived from the carrying case.

  Finally, conclude with the exit check. This confirms whether the distinction has been internalised or merely memorised. The sequence moves from validation to disruption, then to explanation, and finally to application. Each step locks into the next; removing the disruption removes the need for the explanation, and removing the explanation renders the application impossible.

  The carrying case

  Choose the Knobe Effect (the side-effect effect). It is superior to your 'Two Roads' draft because it is empirically robust across disciplines. Your draft risks conflating the identifiability effect with intentional structure, which muddies the methodological point. Knobe isolates the variable: moral valence shifts intentionality judgments despite identical structural indifference. This proves that thought experiments can mislead systematically, not just accidentally. It speaks directly to law (mens rea), economics (utility neutrality), and cognitive science (folk psychology).

  Your instinct regarding the spine is correct, but the terminology risks alienation. 'Rhetorical' sounds pejorative to scientists. Frame it as 'Illustrative' versus 'Constraining'. The Knobe case supports this perfectly: the harm version constrains theories of intentionality; the help version illustrates a bias.

  The Trolley Problem belongs in the introduction, not the spine. Acknowledge it immediately as the 'folk model' of thought experiments, then set it aside. It is too loaded with specific moral baggage and distracts from the structural point about methodology. Use it as a contrast: Trolley asks what you should do; Knobe asks what you think is happening. The latter is methodological; the former is substantive. Keep Trolley as a bookmark to show you know their literature, but let Knobe carry the weight.

  The misconception map

  Four specific misconceptions will arise. You must head them off at precise moments, or they will solidify.

  First, 'Philosophy bans empirical cases'. This arrives before you begin. Head it off in the Opening by explicitly stating that philosophy uses these tools too. If you do not say this, they will treat your critique as disciplinary imperialism.

  Second, 'Intuitions are data'. This arises during the Knobe reveal. When they see the asymmetry, they will assume one intuition is correct and the other wrong. You must intervene here to state that the *variation* is the data, not the verdict. If you allow them to debate which verdict is true, you lose the methodological point. The error is trusting the intuition as evidence rather than treating it as the object of study.

  Third, 'Vividness equals validity'. This emerges during the distinction phase. They will assume that because a case feels compelling, it argues well. You must counter this by showing that the Knobe 'help' scenario feels vivid but argues nothing. The move is to separate psychological grip from logical constraint.

  Fourth, 'This is just semantics'. This threatens the application phase. When auditing their own cases, they will dismiss the distinction as wording. You must insist that structural identity versus variation is not semantic but functional. The move is to demand they identify the variable held constant. If they cannot, the case is illustrative, not constraining.

  Each misconception is a defence against the discomfort of the sequence. The Opening prevents tribal defensiveness. The Knobe intervention prevents substantive distraction. The distinction phase prevents aesthetic confusion. The application phase prevents trivialisation. If you miss one timing, the subsequent step loses its force. For example, if you do not head off 'Intuitions are data' during the reveal, they will spend the distinction phase arguing about morality rather than method.

  The exit check

  Do not ask them to define the distinction. Ask them to use it. Present a short, flawed hypothetical from economics: 'A rational agent chooses A over B, proving A yields higher utility.' Ask them to identify whether this case is constraining or illustrative, and what single change would turn it into the other.

  A good answer will note that the case is currently illustrative (it assumes the conclusion) and suggest that adding a condition where the agent chooses against utility would make it constraining (a counterexample). A bad answer will focus on the realism of the agent or the plausibility of the choice. This distinguishes those who grasped the functional distinction from those who merely enjoyed the puzzles. It tests whether they can manipulate the tool, not just describe it.

  What I should leave out

  Explicitly refuse to cover the history of thought experiments (Kuhn vs Brown) and the metaphysics of modality (possible worlds semantics). Name these topics at the start and declare them out of bounds. Refusing beats sketching because a sketch invites questions you cannot answer in seventy-five minutes without derailing the practical focus. These topics are theoretically rich but operationally useless for this audience. They signal depth but consume time better spent on audit skills. By naming them, you show expertise; by excluding them, you show discipline. This reinforces the session's promise: this is a workshop, not a lecture.
