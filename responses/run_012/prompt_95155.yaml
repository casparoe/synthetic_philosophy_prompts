answer: |-
  You have identified a genuine and structurally significant problem, and your intuition that it is distinct from the standard "homunculus" or "regress" objections is correct. The homunculus objection typically targets *agency* or *understanding* (a little man who sees/reads/decides), whereas your pattern targets *structural properties* (a state that confers a status it does not possess). The regress objection targets the *infinite chain*, whereas your pattern targets the *arbitrary termination* of that chain.

  There is no single, canonical term in the literature that captures this specific configuration across HOT, GWT, and Predictive Processing. This is likely why your searches are landing on adjacent but distinct objections. In logic, this is a form of **Special Pleading**. In philosophy of science, it is an **Ad Hoc Hypothesis**. In metaphysics, it posits a **Brute Fact**.

  However, for a seminar paper in cognitive science, those terms are either too broad or too pejorative. You need a descriptive label that allows you to analyze the architecture without immediately dismissing it.

  I propose you name this pattern **"Structural Exemption"** (or **"Meta-Level Immunity"**).

  Below is a definition and a set of criteria for "carving" the phenomenon, distinguishing between *earned* exemptions (genuine explanatory boundaries) and *stipulated* exemptions (mystery-shifting).

  ### 1. Definition: Structural Exemption

  **Structural Exemption** occurs when a theoretical model explains the presence of a property $P$ in a lower-level state $S_1$ by appealing to a higher-level state $S_2$, while stipulating that $S_2$ does not possess $P$, without deriving that exemption from the independent mechanics of $S_2$.

  *   **The Pattern:** $S_2$ confers $P$ upon $S_1$. $S_2$ is structurally similar to $S_1$ (same "kind"). $S_2$ lacks $P$.
  *   **The Exemption:** The lack of $P$ in $S_2$ is not a consequence of the system's dynamics; it is a boundary condition imposed to prevent regress.
  *   **The Risk:** The theory explains $P$ by invoking a mechanism that is immune to the very explanation it provides.

  ### 2. Distinguishing Neighbors

  To keep this distinct in your paper, you should explicitly differentiate it from the concepts you already ruled out:

  *   **Vs. The Homunculus Fallacy:** The homunculus fallacy requires an agent-like entity that *performs* a cognitive task (seeing, interpreting) that the whole system is supposed to perform. Structural Exemption does not require an agent; it requires only a *state* or *process* that is functionally privileged. A thermostat hierarchy can exhibit Structural Exemption without a homunculus.
  *   **Vs. Infinite Regress:** A regress argument claims the explanation fails because it requires an infinite chain ($S_3$ for $S_2$, $S_4$ for $S_3$...). Structural Exemption accepts the need to stop the chain but critiques *how* it is stopped. It argues that stopping the chain by *fiat* (stipulation) is different from stopping it by *constraint* (mechanism).
  *   **Vs. Misrepresentation Objections:** Objections about HOTs misrepresenting first-order states concern the *content* or *accuracy* of the higher-order state. Structural Exemption concerns the *status* of the higher-order state itself (why is *it* not conscious/broadcast/predicted?).

  ### 3. The Carving: Earned vs. Stipulated Exemption

  This is the core of your analysis. You want to distinguish cases where the exemption is a discovery about the system (Earned) from cases where it is a convenience for the theorist (Stipulated).

  Here are four criteria to determine if an exemption is **Earned**:

  #### A. Functional Heterogeneity (Kind vs. Degree)
  *   **Stipulated:** $S_2$ is the same kind of thing as $S_1$, just "higher." (e.g., a thought about a thought, where both are propositional attitudes). If they are the same kind, why does the property apply to one and not the other?
  *   **Earned:** $S_2$ performs a fundamentally different functional role than $S_1$.
      *   *Example:* In Predictive Processing, if the top-level priors are structurally distinct (e.g., fixed genetic constraints) compared to lower-level posteriors (flexible sensory updates), the exemption is earned by the *difference in kind*. If the top level is just "slower learning," the exemption is suspicious.

  #### B. Independent Motivation
  *   **Stipulated:** The only reason to posit $S_2$ is to explain $P$ in $S_1$. If $P$ weren't a problem, $S_2$ wouldn't exist.
  *   **Earned:** $S_2$ is motivated by independent empirical or theoretical constraints.
      *   *Example:* In Global Workspace Theory, if the "broadcast" mechanism is identified with specific anatomical structures (e.g., thalamocortical loops) that have known physiological limits preventing self-broadcast, the exemption is earned by anatomy, not theory.

  #### C. Vulnerability (The "In Principle" Test)
  *   **Stipulated:** The theory allows that $S_2$ *could* have property $P$, but asserts it doesn't. (e.g., "The HOT *could* be conscious, but then we'd need a HOT-HOT, so we'll say it isn't.")
  *   **Earned:** The theory entails that $S_2$ *cannot* have property $P$ given the system's architecture.
      *   *Example:* If a control system operates on a timescale that makes it impossible for it to monitor its own state in real-time (due to latency constraints), the exemption is earned by physical law, not stipulation.

  #### D. Convergence
  *   **Stipulated:** The boundary is drawn where the theorist needs it to be to solve the regress.
  *   **Earned:** Multiple, independent modeling approaches or empirical measures converge on the same boundary.
      *   *Example:* If lesion studies, computational modeling, and phenomenological reports all identify the same "top level" of the hierarchy, the exemption of that level is empirically grounded.

  ### 4. Application to Your Cases

  You can use these criteria to analyze the theories you are reading:

  *   **Higher-Order Theories (HOT):**
      *   *Verdict:* Leans toward **Stipulated**.
      *   *Reasoning:* The HOT is usually the same representational format as the first-order state. The claim that it is unconscious is primarily to avoid regress (Rosenthal's explicit justification). There is rarely an independent mechanistic reason why a HOT *cannot* be conscious.
  *   **Global Workspace Theory (GWT):**
      *   *Verdict:* **Boundary Case**.
      *   *Reasoning:* The "broadcasting" is a process, the "contents" are states. This offers some Functional Heterogeneity. However, if the broadcasting mechanism itself is a neural representation, does it get broadcast? If Dehaene argues the "ignition" is a transient dynamic that cannot be stabilized as content, that is an **Earned** exemption based on dynamics.
  *   **Predictive Processing (PP):**
      *   *Verdict:* **Mixed**.
      *   *Reasoning:* If the top level consists of "hyperpriors" that are genetically fixed and unupdateable, the exemption is **Earned** (they are physically different). If they are just "priors with very low learning rates," the exemption is **Stipulated** (they could be updated, but we pretend they aren't to close the model).

  ### 5. Suggested Terminology for Your Paper

  Since you are writing a seminar paper, you have the license to define your terms clearly. I recommend introducing the term **"Structural Exemption"** early in your text.

  **Sample phrasing:**
  > "While much criticism of higher-order architectures focuses on the regress problem or the homunculus fallacy, a distinct structural issue arises when the explanatory mechanism is exempted from the very property it confers. I will refer to this as **Structural Exemption**. Unlike the homunculus fallacy, this does not posit an internal agent; unlike the regress objection, it accepts the need for a stopping point. The critical question is whether this exemption is a **stipulated boundary** introduced to halt regress, or an **earned constraint** derived from the system's independent mechanics."

  This framing will allow you to critique these theories without relying on the blunt instrument of "it's just a homunculus," and it demonstrates a sophisticated grasp of the architectural constraints involved in modeling consciousness.
