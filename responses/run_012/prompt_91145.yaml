  **MEMORANDUM**

  **TO:** Education Committee Board Members
  **FROM:** Chair, Education Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the "Memory and Nation" Comparative Module

  **Recommendation**

  I recommend that the Committee **adopt the "Memory and Nation" module with specified conditions.**

  While the draft curriculum offers a rigorous and necessary framework for comparative history, its current implementation risks alienating member schools and misaligning with our network's commitment to cultural reciprocity. Specifically, I propose three amendments prior to adoption:
  1.  **Revise the Assessment Rubric:** Replace the normative criterion "acknowledgment by the state" with a descriptive framework analyzing "mechanisms of memory" (e.g., museums, apologies, silence, curriculum).
  2.  **Reframe the Closing Pledge:** Shift the language from preventing historical recurrence based on inherited guilt to fostering "civic agency in the present."
  3.  **Require Local Contextualization:** Mandate that each school pair the four core modules with a fifth, locally relevant case study to decentralize the perspective.

  **Rationale**

  This recommendation seeks to preserve the pedagogical integrity of the proposal while mitigating the political and ethical risks identified during our review.

  *To the Curator:* These conditions preserve your core argument that refusing to compare is itself a political choice. By shifting the rubric from *grading* states to *analyzing* them, we do not remove the discomfort; we redirect it from national shame to structural analysis. This strengthens the academic rigor by asking students to evaluate *how* memory works, rather than simply ranking who is "better." The module remains compulsory and comparative, maintaining your intended challenge to student complacency.

  *To the Dissenting Members:* These conditions address the concern that the draft grades nations rather than comparing them. A descriptive rubric removes the hierarchy that suggests Germany is "finished" while Turkey or Japan are "failing." Furthermore, reframing the pledge wall addresses the objection regarding intergenerational guilt. Students will be asked to commit to ethical actions within their own sphere of influence, rather than answering for crimes committed before their birth. This respects the dignity of students in Istanbul, Osaka, and elsewhere, ensuring they are participants in the inquiry, not defendants in a trial.

  **The Strongest Case Against This Recommendation**

  The strongest case against adopting this module—even with conditions—is the argument for **Rejection**, as articulated by the dissenting board members.

  The core of this argument is that the module's structure is inherently hegemonic. By selecting specific case studies (Germany, Japan, Turkey, American South) and framing them through a lens developed in Berlin, the curriculum implicitly establishes a European standard of "atonement" as the universal metric of moral progress. Even with a neutral rubric, the selection of cases suggests that some histories are "difficult pasts" to be managed, while others remain the invisible norm. Furthermore, no reframing of a pledge can fully resolve the ethical issue of asking children to internalize collective trauma that is not their own. From this perspective, the risk of reinforcing cultural stereotypes and causing alienation among students in the affected regions outweighs the educational benefit. The safest and most respectful course, therefore, is to reject the compulsory nature of the module entirely, allowing individual schools to opt-in only if they deem it locally appropriate.

  **Conclusion**

  While the case for Rejection rests on a valid concern for cultural sensitivity, I believe it underestimates the capacity of our students to engage with complexity. To reject the module is to concede that comparative memory studies are too dangerous for an international classroom. By adopting with conditions, we signal that we can confront difficult histories without imposing a hierarchy of guilt. I ask that you review the amended rubric and pledge language attached to this memo before Thursday's vote.

  **Attachments:**
  *   Revised Assessment Rubric (Descriptive Framework)
  *   Revised Pledge Wall Guidelines (Civic Agency Focus)
