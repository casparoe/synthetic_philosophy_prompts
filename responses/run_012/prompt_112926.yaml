      *   Key break 2: Replacement. A bill can be replaced by the Treasury. A statue cannot be replaced by the "Art Treasury."
      *   Key break 3: Counting. If I have a stack of $100 bills, do I have 100 pieces of paper? Yes. Do I have $10,000? Yes. If I burn them, I lose the paper AND the money. If I demonetize them (swap currency), I lose the money but keep the paper. If I squish the statue, I lose the statue but keep the lump. The asymmetry holds.
      *   So the analogy *preserves* the puzzle rather than dissolving it. It shows distinct persistence conditions.

