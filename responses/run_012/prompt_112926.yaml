prompt: |-
  I'm in a metaphysics seminar and we've just finished the statue-and-clay stuff — the lump of clay that a sculptor squishes into a little figure, so now there seem to be two objects in exactly the same place with different properties: the lump existed before the statue did, the lump is lump-shaped and could survive being squished back into a ball, the statue can't survive that, the lump weighs the same as the statue but seems to have different persistence conditions, and so on. We meet Tuesdays and last week we burned a whole hour on whether the lump survives the squishing. One guy in the seminar keeps saying the whole thing is a pseudo-problem, and the analogy he leans on is money: a dollar bill and the piece of paper it's printed on aren't two things, he says, they're one thing under two descriptions — nobody thinks the paper and the bill are "coinciding objects" occupying the same region — and a statue is the same deal, so all this talk of "material constitution" is just us getting tangled up in our own ways of describing one object. He uses this to argue we should stop asking which of the two is really there.

  I want to know how far that analogy actually holds, because I suspect it's doing more load-bearing work than it can carry. Can you lay out the correspondence explicitly — a table is fine — saying what's supposed to map onto what (the clay, the statue, the shaping, the printing, and whatever plays the role of the conventions that make a bit of paper legal tender), and then where the mapping breaks down? I'm especially interested in whether the money case really does dissolve the double-counting worry or whether it secretly reproduces it, and whether anything about a dollar bill — its persistence conditions, what makes it money in the first place, what happens when it's demonetized or someone scribbles on it — tells against the conclusion my friend wants to draw. If the analogy turns out to be pointing the other way, tell me what a better one would be, or whether there just isn't a clean analogy here and we're stuck with the puzzle. Table first, then the break-down, then a verdict on whether "it's just two descriptions" survives. And please don't just tell me it depends on your theory of properties — I want to see the analogy audited on its own terms.
