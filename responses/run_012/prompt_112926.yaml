answer: |-
  Here is an audit of the money analogy, structured as requested.

  ### 1. The Correspondence Table

  Your classmate is proposing a **Deflationary** or **Conceptualist** mapping: the distinction is linguistic, not ontological. Here is how the terms are supposed to align for his argument to work.

  | Statue & Clay Puzzle | Money Analogy (Bill & Paper) | Intended Function of Mapping |
  | :--- | :--- | :--- |
  | **The Lump of Clay** | **The Piece of Paper** | The underlying material substrate that exists prior to the "higher" object. |
  | **The Statue** | **The Dollar Bill** | The functional/artifact object that comes into existence later. |
  | **Sculpting/Shaping** | **Printing/Stamping** | The event that confers the new status/function onto the material. |
  | **Squishing the Statue** | **Tearing/Demonetizing the Bill** | The event that destroys the "higher" object but leaves the substrate. |
  | **Artistic Convention** | **Legal/Financial Convention** | The external rules that determine when the material counts as the object. |
  | **The Claim** | **The Claim** | "Just as there aren't two things (bill + paper), there aren't two things (statue + clay)." |

  ### 2. The Breakdown: Where the Analogy Leaks

  The classmate's argument relies on the intuition that the Bill/Paper case is *obviously* one object, and therefore the Statue/Clay case should be treated the same. However, when you press on the persistence conditions and counting procedures, the money analogy does not dissolve the puzzle; it reproduces it.

  #### A. Modal Divergence (Leibniz's Law)
  The core of the Statue/Lump puzzle is that they have different modal properties (different things *could* happen to them). The Lump can survive being squished; the Statue cannot.
  *   **In the Money Case:** The Paper can survive being washed clean of ink; the Bill cannot. The Paper can survive demonetization (e.g., the government issues a new currency); the Bill cannot.
  *   **The Break:** If the Bill and the Paper were truly **one object** under two descriptions, they would share all properties. They do not. Your classmate must argue that "surviving demonetization" is not a real property of the object but a feature of the description. But if descriptions track real differences in persistence (i.e., you can still wipe the paper but you can't spend the bill), the distinction is doing metaphysical work, not just linguistic work. The analogy confirms the divergence rather than explaining it away.

  #### B. Source of Existence (Internal vs. External)
  *   **Statue/Clay:** A statue's status is largely determined by its **internal form** and the artist's intention. If you teleported a statue to a universe with no art galleries or humans, it would arguably still be a statue (or at least, a shaped object).
  *   **Bill/Paper:** A dollar bill's status is entirely **external and institutional**. A perfect physical duplicate of a $20 bill printed in your basement is not a bill; it's counterfeit paper.
  *   **The Break:** The Bill/Paper relationship is *constitutive + institutional*. The Statue/Clay relationship is *constitutive + formal*. By using the Bill analogy, your classmate is implicitly arguing that Statues are *only* artifacts by social convention. This is a substantive metaphysical claim (Artifact Conceptualism), not a dissolution of the problem. It shifts the debate from "Are there two objects?" to "Is 'statue' a mind-dependent category like 'money'?" That is not a pseudo-problem; it is a different, equally hard problem.

  #### C. The Double-Counting Worry
  The classmate argues that counting both the bill and the paper is double-counting.
  *   **In Practice:** If a fire burns a vault of cash, the insurance company asks two questions: "What is the weight of the ash?" (Paper) and "What was the face value?" (Bill). These are counted differently.
  *   **The Break:** We *do* double-count in the money case, but we keep the accounts separate because the persistence conditions differ. If the analogy holds, we *should* keep the accounts separate for the statue and the clay. The sculptor owns the clay (material cost) and the statue (artistic value). If the statue is crushed, the clay account remains solvent, but the statue account is bankrupt. The analogy shows that **functional counting differs from material counting**, which validates the intuition that there is a distinction to be made, contradicting the "one object" conclusion.

  #### D. Replaceability and Identity
  *   **Bill:** If a bill is mutilated, the Treasury can issue a *replacement* that is numerically distinct but functionally identical (same value). The *value* persists even if the *paper* is destroyed.
  *   **Statue:** If a statue is crushed, the artist cannot issue a replacement that is *the* statue. A cast copy is a new statue.
  *   **The Break:** The Bill has a layer of abstract value that can migrate to new paper. The Statue does not (usually). This suggests the Bill is actually *more* complex than the Statue, not less. If the classmate uses the Bill to simplify the Statue, he is picking a case that is arguably more metaphysically loaded (involving abstract value types) than the physical statue.

  ### 3. Verdict: Does "It's Just Two Descriptions" Survive?

  **No.** The audit suggests the money analogy actually undermines your classmate's deflationary conclusion.

  Here is why:
  1.  **It Replicates the Puzzle:** The Bill/Paper case exhibits the exact same divergence in persistence conditions as the Statue/Clay case. The paper survives what the bill does not. If your classmate admits the Bill and Paper are "one thing," he must explain how one thing can have contradictory persistence conditions (e.g., "This object survives washing" and "This object does not survive washing"). Saying "it's just descriptions" is a label for the problem, not a solution.
  2.  **It Supports Constitution, Not Identity:** The money analogy is actually the favorite tool of **Constitution Theorists** (like Lynne Baker), who argue that the Bill is *constituted by* the Paper but is **not identical** to it. They use it to argue that there *are* two things in the same place, intimately related. Your classmate is trying to use a Constitution Theorist's example to argue for Deflationism. He has the precedent backwards.
  3.  **The "Pseudo-Problem" Claim Fails:** For the problem to be pseudo, the intuition that the lump survives and the statue doesn't would have to be an illusion. But in the money case, the intuition that the paper survives and the bill doesn't is **real and actionable** (e.g., in law courts regarding damaged currency). Since the money case validates the intuition of divergent persistence, it validates the core intuition of the statue case.

  **Conclusion for the Seminar:**
  Tell your classmate that the money analogy does not show the Statue/Lump distinction is fake; it shows that **functional objects and their material bases have different life histories.** If he insists the Bill and Paper are one object, he inherits the burden of explaining how one object can cease to exist (as money) while continuing to exist (as paper) in the very same instant. The analogy doesn't dissolve the double-counting worry; it justifies it. We count the paper for its weight and the bill for its value because they are not the same thing, even if they occupy the same space.

  If you need a better analogy to test the "one object" claim, try **Software on a Hard Drive**. The software (the code/function) can be deleted while the drive remains. The drive can be smashed while the software is backed up elsewhere. This highlights the *separability* of function and matter even more sharply than the bill, making the "one object" claim even harder to defend. But ultimately, the Statue/Lump puzzle remains robust because it targets the boundary between matter and form, and no analogy successfully erases that boundary without significant metaphysical cost.
