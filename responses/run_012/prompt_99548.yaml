  Alright, I'm putting together a problem set for my laws of nature seminar and I want to use a puzzle a student dropped on me last week. The argument is supposed to show that the Humean best-system account makes every true regularity a law, which cant be right. Here it is: (1) Laws are the axioms or theorems of the deductive system that best balances simplicity, strength, and fit with the total mosaic of non-modal facts. (2) Which system is best depends on the language we state it in. (3) For any true regularity R, we can build a language with a primitive predicate P that applies to all and only the things that satisfy R. (4) In that language, the sentence saying all P things satisfy R is about as simple as an axiom can be, and we can import the rest of our best system without losing strength or fit. (5) So R ends up in the best system. (6) So R is a law. (7) R was arbitrary, so every true regularity is a law. (8) But not every true regularity is a law. Take the regularity that all gold cubes are smaller than a cubic mile, if it is true. That's not a law, it's an accident. (9) So the best-system account is false. I feel like somethings off around step 3 or 4, but I cant name it without giving up something I like. Which step do you reject, why did it look plausible, and what does rejecting it cost? In particular, if you want to keep the Humean picture, can you block the move without smuggling in a privileged set of natural properties or some anti-Humean necessary connections? And if you go anti-Humean, what do you say about the gold-cube regularity? I dont need a survey or citations, just the diagnosis. Answer in American English please.
