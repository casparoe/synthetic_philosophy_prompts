      *   *Point 4: Precommitment & Personhood (Moderate).* Ulysses ties himself because he knows his future preferences will change. If I know my future *epistemic* standards will drop (e.g., I'm getting older, dementia), should I bind my beliefs? If I do, I violate RP. *Defender's move:* Distinguish between *preferences* (changeable) and *truth-tracking* (should be stable). *Verdict:* Awkward, but manageable.
      *   *Point 5: Sleeping Beauty (Nuanced).* Halfer violates RP (Sunday 1/2 -> Monday 1/2 despite knowing Monday credence will be 1/2? Wait, Halfer says Monday credence is 1/2. Thirder says 1/3. If Sunday credence is 1/2, and I know Monday I'll be 1/3, RP says I should be 1/3 now. Thirder respects RP, Halfer violates it.). *Verdict:* It's a litmus test, not a defeater.

  6.  **Refining the Argument on "Unfalsifiability":**
