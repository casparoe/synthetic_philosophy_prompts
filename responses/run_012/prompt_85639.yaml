      *(Refining the Asymmetry point)*: The user asks "Why the asymmetry with the past?" The answer is usually "because of the flow of evidence." But if I know I will lose evidence, the flow reverses. So the principle relies on a "no-loss" assumption. If that assumption is explicit, the principle is weaker. If implicit, it's vulnerable.

