prompt: |-
  I'm taking a metaphysics module on vagueness this term and I've got to hand in an essay plan, but I've drafted the thing and I'm not sure it holds up. Would you read it and tell me where it's weak? Here's the draft:

  Everyone explains the sorites with the tolerance principle: if one grain can't turn a non-heap into a heap, then no number of grains can, and yet somewhere it does. The usual suspects — epistemicism, supervaluationism, degree theory — all locate the trouble in the *meaning* of 'heap'. Either there's a sharp line we can't know, or there are truth-value gaps, or truth comes in degrees. I want to argue that this is a mistake about where the problem lives. The paradox isn't a fact about the word 'heap'; it's a fact about a *rule we use when reasoning*, and rules can be tolerant even when meanings are perfectly precise.

  Here's the move. Take a predicate that is definitely precise, like 'is taller than 1.7m'. Sharp line, no vagueness at all. Now attach a *practical* rule: if two people differ in height by less than a millimetre, don't treat them differently for the purpose at hand. That rule is tolerant. Chain it and you get a contradiction — everyone is taller than 1.7m — even though the predicate was never vague. So tolerance is not a property of predicates; it's a property of the norms of discrimination we bolt onto them.

  So I want to distinguish *semantic tolerance* (no sharp boundary in the extension) from *assertoric/practical tolerance* (a policy about which differences we treat as insignificant). The sorites only goes through if you read the tolerant premise as a claim about the extension. Read it as a policy instead, and the paradox dissolves: the policy is fine, it's just not a claim about where the line is.

  I think this relocates the paradox onto us and our norms of reasoning rather than onto the world's joints. It also predicts something: you should get sorites for precise predicates whenever a tolerant policy is attached — queues, crowds, 'tall for a jockey'. Is that a point in favour, or am I just redescribing the same problem?

  What I'm unsure about: (1) is the distinction real, or is it just the semantic/epistemic divide relabelled? (2) does 'practical tolerance' even make sense as a non-semantic notion, or does any policy already presuppose a semantics? (3) does the paradox actually dissolve, or have I just moved the bump under the carpet? I'd like comments on accuracy first, then on whether the central distinction does any work, then on whether the whole thing is interesting or just a definately-already-been-done reframing. Be honest if it's alot of hot air. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Context:** Undergraduate or Master's level metaphysics module on vagueness.
      *   **Task:** Review an essay plan/draft.
      *   **Content:** The student proposes shifting the locus of the Sorites paradox from semantics (meaning of 'heap') to pragmatics/norms of reasoning (rules of discrimination). They distinguish "semantic tolerance" from "assertoric/practical tolerance."
      *   **Specific Questions:**
          1.  Is the distinction real (vs. semantic/epistemic relabeling)?
          2.  Does 'practical tolerance' make sense as non-semantic?
          3.  Does the paradox dissolve or just move?
          4.  Is it interesting or "hot air"/already done?
      *   **Tone/Style:** Honest, critical, British English.

  2.  **Initial Assessment of the Argument:**
      *   *Core Idea:* The Sorites paradox arises not because predicates are vague, but because we apply tolerant *rules of inference* or *practical norms* to them, even if the predicates were precise.
      *   *Strengths:* It's a pragmatic turn, which is a legitimate avenue in vagueness literature (e.g., contextualism, use-theories). The example of precise predicates + tolerant rules is intuitive.
      *   *Weaknesses:* It risks conflating the *premise* of the Sorites (the tolerance principle) with the *conclusion* (the paradox). The standard tolerance principle *is* usually understood as a semantic claim ("If $x$ is $F$, and $x$ is indistinguishable from $y$, then $y$ is $F$"). Shifting it to a practical norm ("Don't treat $x$ and $y$ differently") changes the logic. Does it solve the paradox or just change the subject?
      *   *Literature Check:* This sounds very similar to *contextualist* approaches (Raffman, Fara) or *pragmatic* approaches (Lewis, Unger, maybe even Williamson's error theory but flipped). It also echoes the "forced march" sorites discussions. The specific move of "precise predicate + tolerant rule" is reminiscent of discussions on *interest-relative invariantism* or specific critiques of the tolerance principle by philosophers like Sorensen or Graff Fara.

  3.  **Addressing the Specific Questions:**

      *   **(1) Is the distinction real?**
          *   It is real, but it might not do the work the student thinks. Semantic tolerance says "There is no fact of the matter." Practical tolerance says "We act as if there is no difference."
          *   *Risk:* If the practical rule leads to a contradiction in action (everyone gets in the queue/no one does), the paradox remains, just in the practical realm.
          *   *Comparison:* It's not exactly the semantic/epistemic divide. Epistemicism says there *is* a sharp line (semantic precision) but we don't know it. The student is saying the *semantics* can be precise, but the *inference rule* is tolerant. This is closer to rejecting the validity of the Sorites reasoning rather than fixing the semantics.

      *   **(2) Does 'practical tolerance' make sense as non-semantic?**
          *   Yes, norms of assertion or action can be distinct from truth conditions. (e.g., Assertibility vs. Truth).
          *   *Problem:* The Sorites is traditionally a paradox about *truth*. If you change it to a paradox about *assertibility* or *action*, you need to explain why we thought it was about truth in the first place.
          *   *Presupposition:* A policy usually presupposes a goal. If the goal is truth-tracking, the policy collapses back into semantics. If the goal is efficiency, it's a different game.

      *   **(3) Does the paradox dissolve?**
          *   This is the hardest hit. If I have a precise rule (>1.7m) and a tolerant policy (ignore <1mm), and I chain them, I end up letting a 1.5m person in.
          *   *Result:* I have violated the precise rule.
          *   *Conclusion:* The paradox isn't dissolved; it's a conflict between the precise definition and the tolerant policy. The student needs to explain why we should abandon the precise definition or why the policy doesn't chain. (Usually, the solution is that practical tolerance *doesn't* chain transitively in practice, even if it looks like it does logically).

      *   **(4) Is it interesting or hot air?**
          *   Not hot air. It's a recognizable position (Pragmatic/Contextualist).
          *   *Challenge:* It needs to engage with existing literature. If the student thinks they invented this, they need to be pointed to Raffman, Fara, or Sorensen.
          *   *Verdict:* Potentially good, but needs rigorous defence against the "moving the bump" charge.

  4.  **Drafting the Feedback (incorporating British English and critical tone):**

      *   *Opening:* Acknowledge the ambition. It's a solid intuition.
      *   *Section 1: Accuracy & The Distinction.*
          *   Validate the semantic vs. practical split. It's not just epistemicism relabelled. Epistemicism keeps the tolerance principle as false; the student is keeping the principle as "valid in practice" but not truth-apt.
          *   Warning: The "Precise Predicate" example is dangerous. If the predicate is *defined* as >1.7m, the tolerance principle is simply *false* for that predicate. You can't have a precise predicate and a true tolerance principle. The student is essentially arguing that 'heap' *looks* precise but we treat it as tolerant. Or that 'heap' is precise but we *act* as if it's tolerant.
      *   *Section 2: Does it Dissolve?*
          *   The "Bump under the carpet" charge is real. If the policy leads to contradiction (letting everyone in), the paradox survives as a practical paradox.
          *   Need to argue that practical tolerance is *non-transitive* in a way semantic tolerance isn't. (Fara's similarity relation idea).
      *   *Section 3: Literature/Originality.*
          *   Must mention Delia Graff Fara (similarity), Diana Raffman (contextualism/psychology), and maybe Timothy Williamson (margin for error principles).
          *   If they ignore these, the essay will look naive.
      *   *Section 4: Structural Advice.*
          *   Sharpen the thesis.
          *   Address the "chaining" problem specifically.

  5.  **Refining the Tone:**
      *   Use "whilst," "programme," "centre," "favour."
      *   Be direct but encouraging. "Hot air" is a strong phrase; address it honestly. It's not hot air, but it is well-trodden ground.
      *   Ensure the distinction between *truth* and *assertibility/action* is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Wait, did I misread the student's point?* They say: "The paradox isn't a fact about the word 'heap'; it's a fact about a rule we use when reasoning."
      *   This sounds like an *inferentialist* or *logical* solution.
      *   *Critique:* If the rule is "If $x$ is $F$ and $x \approx y$, treat $y$ as $F$," and this leads to contradiction, then the rule is bad. The student says "rules can be tolerant even when meanings are precise."
      *   *Counter:* If meanings are precise, the rule *must* fail somewhere. The student admits this ("The policy is fine, it's just not a claim about where the line is").
      *   *Key weakness:* If the policy isn't a claim about the line, why does it force us across the line? The student needs to explain the *compulsion* of the Sorites.
      *   *Adjustment:* I need to point out that the Sorites is compelling *because* we think the tolerance principle is true. If the student says it's just a policy, they need to explain why we mistake a policy for a truth.

  7.  **Final Polish:** Check against the four specific constraints in the prompt. (Accuracy, Distinction work, Interest/Originality, British English).

      *   *Accuracy:* The distinction is coherent but risky.
      *   *Distinction:* It does work, but requires defence against transitivity.
      *   *Interest:* It's a known path (pragmatics), needs citation.
      *   *English:* Check spelling and idiom.

      *(Self-Correction on Literature)*: Specifically, the "precise predicate + tolerant rule" argument is very close to **Roy Sorensen's** work on "blindspots" or **Graff Fara's** "Phenomenal Continua". Also, **Stephen Schiffer**'s "vague partial belief". I should mention that this is a "pragmatic turn" in vagueness.

      *(Final thought on the "Precise Predicate" example)*: The student says: "Chain it and you get a contradiction — everyone is taller than 1.7m". Actually, if the predicate is precise, chaining the tolerant rule leads to *error*, not necessarily a logical contradiction unless the policy *forces* you to assert the false thing. I need to be precise here. The contradiction arises if the policy mandates assertion/classification.

      Okay, ready to write.
answer: |-
  This is a spirited draft with a clear intuitive pull. You are essentially proposing a **pragmatic turn** on the Sorites: shifting the locus of vagueness from the world/semantics to our norms of judgement and action. It is not "hot air"—it is a recognised philosophical manoeuvre—but it is also a well-trodden path that requires careful navigation to avoid stepping on the toes of existing literature without acknowledging them.

  Here is an honest assessment based on the three areas you highlighted, followed by some structural advice.

  ### 1. Accuracy: Is the distinction real?

  Yes, the distinction between *semantic tolerance* (truth-conditional) and *practical/assertoric tolerance* (normative) is coherent. It is not merely the semantic/epistemic divide relabelled.

  *   **Epistemicism** (e.g., Williamson) claims the semantics are precise (there is a sharp cut-off) and the tolerance principle is simply *false*.
  *   **Your view** seems to be that the tolerance principle functions as a *rule of thumb* or a *norm of indifference* that we employ, which remains useful even if the semantics are precise.

  However, there is a accuracy trap in your example. You write: *"Chain it and you get a contradiction — everyone is taller than 1.7m."*
  Strictly speaking, if the predicate 'is taller than 1.7m' is precise, chaining a tolerant *policy* does not create a logical contradiction in the world; it creates a **practical error**. You end up classifying a 1.5m person as 1.7m+.
  For this to be a paradox, you must argue that the *policy itself* compels us to make the error, or that we cannot help but apply the policy transitively. If the policy is just a heuristic, we can abandon it when it conflicts with the precise definition. The Sorites is troubling because we feel we *cannot* abandon the tolerance principle without being arbitrary. Your essay needs to explain why a "mere policy" feels binding.

  ### 2. Does the distinction do any work? (The "Bump" Problem)

  You ask if you are just moving the bump under the carpet. The honest answer is: **potentially, yes.**

  If the paradox dissolves, it must be because the practical rule **does not chain** in the way the semantic premise does.
  *   **Semantic Premise:** $\forall x (Fx \to Fx')$. If this is true, the conclusion follows logically.
  *   **Practical Rule:** "Treat $x$ and $y$ as the same if difference is negligible."

  The problem is that "negligible" is not transitive in practice, even if it looks like it is in theory. If you treat $x_1$ like $x_2$, and $x_2$ like $x_3$, you do not necessarily treat $x_1$ like $x_3$ in a single context.
  To make this work, you need to lean heavily on **contextualism**. The standard line against your view is: "If the policy leads to contradiction, the policy is irrational." You need to argue that the policy is rational locally but fails globally, and that this explains the *feeling* of paradox without requiring vague objects or truth-values.

  **The Weak Point:** You claim the paradox dissolves because the policy "is just not a claim about where the line is." But the Sorites forces us to *draw* a line eventually (e.g., in a court of law, or a competition). If your practical tolerance forbids drawing a line, but the situation demands one, the paradox returns as a conflict of norms. You need to address how the "precise meaning" reasserts itself when the "practical tolerance" runs out of road.

  ### 3. Interest and Originality: Has this been done?

  This is the most critical feedback for a university essay. This position is not new, which is fine, but you must engage with the existing literature or you will be marked down for ignorance of the field.

  Your argument closely resembles:
  1.  **Delia Graff Fara:** She argues that sorites-susceptible predicates are similarity-based. Similarity is context-dependent and not transitive. This is very close to your "practical tolerance."
  2.  **Diana Raffman:** She argues for a psychological/contextualist approach where the "shift" in classification is a psychological gesture, not a semantic fact.
  3.  **Stephen Schiffer:** He discusses "vague partial belief" and pragmatic rules of assertion.
  4.  **Timothy Williamson:** Even the epistemicist discusses "margin for error" principles which look like your practical norms, though he treats them as knowledge norms.

  **Is it interesting?** Yes, provided you frame it correctly. Do not present it as "Everyone else is wrong about semantics; I am right about pragmatics." Instead, frame it as: "Standard solutions focus on truth-conditions, but this misses the *normative force* of the tolerance principle. By analysing it as a norm of discrimination, we can explain why the paradox is compelling without positing metaphysical vagueness."

  ### Specific Recommendations for the Plan

  **1. Sharpen the "Precise Predicate" Example**
  The '1.7m' example is risky because it is stipulative. Everyone agrees 'taller than 1.7m' is precise. The opponent will say: "Of course you can generate a paradox with a false rule. That tells us nothing about 'heap'."
  *   **Fix:** Argue that 'heap' *also* has a precise extension (perhaps epistemic), but we are *forbidden* from using it in ordinary discourse due to practical norms. Or, argue that even with precise predicates, our *access* to them is governed by tolerant norms, which generates the paradox phenomenologically.

  **2. Address Transitivity Explicitly**
  You must explain why practical tolerance doesn't chain.
  *   *Drafting thought:* "Practical tolerance is context-sensitive. In comparing $x_1$ to $x_2$, the context is fixed. In comparing $x_2$ to $x_3$, the context may shift. Therefore, the chain is broken."
  *   If you don't explain why the chain breaks, the paradox remains.

  **3. British English & Tone**
  Your draft is already quite good, but watch for:
  *   "alot" $\rightarrow$ "a lot"
  *   "definately" $\rightarrow$ "definitely"
  *   Ensure you use "whilst" or "while" consistently (whilst is more formal/British).
  *   "programme" (if you use it), "centre", "favour".

  ### Verdict

  It is not hot air, but it is a **high-risk, high-reward** plan.
  *   **Risk:** You might be accused of confusing truth with assertibility, or ignoring the fact that practical contradictions are still contradictions.
  *   **Reward:** If you successfully argue that the Sorites is a paradox of *norms* rather than *truth*, you offer a genuine dissolution rather than a semantic patch.

  **Final Advice:**
  Don't just assert the distinction; defend it against the charge that "practical norms supervene on semantics." If the meaning is precise, why are the norms tolerant? You need a story about *why* we adopt tolerant norms (e.g., cognitive limitations, communicative efficiency). If you add that layer, this becomes a solid Upper Second or First-class plan. If you leave it as "meanings are precise, rules are tolerant," it may look like a category mistake.

  Good luck. It's a lively topic; if you engage with Graff Fara and Raffman, you'll be on solid ground.
