answer: |-
  ### Brainstorming: Five Positions on "Risk Class"

  Before I dig into the filings, let's lay out the metaphysical landscape. When an actuary puts you in a "cell," what are they actually doing?

  1.  **The Essentialist (Realist) View:** You have a "true" individual probability of crashing. It exists in the fabric of reality. Classes are imperfect attempts to measure this intrinsic propensity. A better class is one that gets closer to your specific truth.
  2.  **The Frequentist (Groupist) View:** Individual probability is nonsense. There is only group frequency. You *are* your class. If 5% of 30-year-old males in zip code 90210 crash, your risk is 5%. There is no "deeper" truth.
  3.  **The Bayesian (Information) View:** Risk is a state of knowledge, not a state of the world. Classes are just buckets of information. Adding a variable (like credit score) updates the prior. A better class is one that reduces uncertainty (variance) in the prediction.
  4.  **The Pragmatic (Solvency) View:** Classes are tools to prevent market collapse. If you classify too coarsely, good risks leave (adverse selection). If too finely, you lose pooling benefits. The "right" class is whatever keeps the insurer solvent and the regulator happy.
  5.  **The Constructivist (Political) View:** Risk classes are social technologies for distributing cost. They legitimize charging Group A more than Group B. "Actuarial justification" is a rhetorical shield for normative choices about who should pay.

  **Which one is the practice running on?**
  Operationally, the industry runs on **Frequentism** (you pay the group rate). Regulatorily, it speaks **Essentialist** (you must prove the variable predicts "true" loss cost). Philosophically, it survives on **Pragmatism** (don't let the pool unravel). But if I have to pick the one that actually drives the rate filing? It's **Pragmatic Frequentism**. They treat the group rate as the truth because it's the only number they can calculate, but they tweak the groups to keep the business alive.

  ***

  ### The Argument

  Here is my assessment of the practice, drawing on both the philosophy of probability and the reality of rate filings.

  #### (1) Reference Classes: Proxy Realism
  The practice presupposes a view I call **Proxy Realism**.

  It does *not* genuinely assume there is a metaphysical "true risk" sitting inside your soul waiting to be found. Actuaries are too empirically minded for that. However, the regulatory framework forces them to speak *as if* there is one. When a state insurance commissioner asks for an "actuarial justification," they are demanding you prove that your class variable correlates with loss. This implies there is a "loss reality" out there to be correlated with.

  But operationally, the practice treats your risk as **nothing over and above the rate in the class**. If you are a 25-year-old male in a specific zip code with a specific credit tier, your "risk" is the mean loss of that cell. There is no residual "individual risk" once the variables are exhausted.

  **What makes one class choice better than another?**
  It is not truth; it is **predictive lift constrained by law**.
  A "better" class is one that increases the Gini coefficient (predictive power) of the model without triggering a regulatory ban or a public relations disaster.
  *   *Example:* Credit-based insurance scores are "better" than occupation because they have higher statistical correlation with claim frequency.
  *   *Example:* Zip code is "better" than state, but "worse" than race (statistically) because race is illegal.
  The hierarchy of classes is determined by a cost-benefit analysis: Does the reduction in variance (better pricing accuracy) outweigh the cost of regulatory friction or market shrinkage?

  #### (2) Theory of Unfair Discrimination: The Political Settlement
  There is **no single principled criterion** explaining the line between fair and unfair discrimination in the current regime. If you try to apply a consistent philosophical test, the system breaks.

  *   **Immutability?** Fails. Age is immutable and used everywhere. Gender is immutable and used in US life/auto (mostly), but banned in EU.
  *   **Control?** Fails. Credit score implies financial control (used). Zip code implies no control (used). Genetic makeup implies no control (banned in health, used in life).
  *   **Causality?** Fails. Actuarial science is built on correlation, not causation. We don't know *why* red cars crash more (if they do); we just know they do.
  *   **Morally Protected Status?** Closer, but inconsistent. Race is protected. Gender is sometimes protected. Poverty (credit score) is not protected, even though it correlates heavily with race and zip code.

  **My Verdict:** The line is a **Political Settlement wearing a statistical costume.**
  The practice presupposes a theory of **Social Acceptability**. A variable is "fair" if the public tolerates it and the legislature hasn't banned it.
  *   *Race:* Banned because of historical oppression and civil rights law.
  *   *Zip Code:* Allowed because housing segregation is treated as a "market fact" rather than a protected class, despite being a proxy for race.
  *   *Genetics (Health vs. Life):* In health, banning genetics is about preventing a "death spiral" where only the sick buy insurance (and GINA was about access to healthcare as a right). In life, insurance is viewed as a voluntary investment product; if you know you carry the Huntington's gene, that's "inside information" akin to insider trading.
  *   *EU Gender Ban:* This was a human rights court ruling (Test-Achats), not an actuarial discovery. It prioritized equality of treatment over actuarial accuracy.

  The practice presupposes that **discrimination is unfair only when it violates a specific social norm**, not when it violates a principle of equity.

  #### (3) Presupposition vs. Fit (Underdetermination)
  We need to separate what the math *needs* from what the ideology *wants*.

  **Strictly Presupposed:**
  1.  **Stability:** The classes must be stable enough to calculate a mean. You can't price on "people who will crash tomorrow."
  2.  **Correlation:** The variables must have non-zero correlation with loss. If a variable predicts nothing, it adds noise, not price.
  3.  **Excludability:** You must be able to verify the class. (You can't price on "people who are careful," only on "people with no claims.")

  **Merely Fits Well (Underdetermined):**
  1.  **Actuarial Fairness (Individual Equity):** The idea that you *should* pay exactly what you cost the pool is a normative choice, not a mathematical necessity. You could run the exact same predictive models but compress the rates (subsidize the high-risk with the low-risk) and the math would still work, provided the subsidy isn't so large that low-risk people leave.
  2.  **The "Risk" Ontology:** As noted above, the system works equally well if risk is "real" or "constructed." The pricing engine doesn't care.
  3.  **Adverse Selection Fear:** The industry claims fine classification is necessary to prevent market unraveling. This is theoretically sound but empirically underdetermined. We don't actually know the elasticity of demand for insurance. It's possible we could group much more coarsely (e.g., ban credit scores) without the market collapsing, but insurers would make less profit.

  **Rival Theories that Fit:**
  *   **Utilitarianism:** Maximize total welfare. If banning credit scores lowers aggregate anxiety and social unrest more than it raises premiums, a Utilitarian could license the exact same regulations we have now (or different ones).
  *   **Libertarianism:** Freedom of contract. As long as no fraud is committed, charge whatever the market bears. This fits the US Life insurance model perfectly but conflicts with US Health (ACA) and EU Auto.

  The current practice is underdetermined between **Profit Maximization** and **Risk Segmentation**. They look the same in the rate filing.

  #### (4) The Hard-Line Rival: Policy Choice All the Way Down
  Suppose we swap the presupposed view (Proxy Realism/Political Settlement) for the hard-line rival: **Risk is a Policy Choice.** We admit that "actuarial fairness" has no independent moral content and that reference classes are tools for social engineering.

  **What concretely changes in pricing?**

  1.  **Explicit Redistribution Mechanisms:**
      Currently, insurers hide subsidies inside broad classes. If we admit it's policy, we stop pretending zip codes aren't race proxies. We would either **ban proxy variables** entirely (no zip code, no credit score) or we would **tax the surplus**. If a class generates excess profit due to a correlated disadvantage (e.g., redlining via zip code), that surplus is seized and redistributed. Pricing becomes a form of taxation.

  2.  **Outcome-Based Pricing Caps:**
      Instead of capping *inputs* (e.g., "don't use gender"), we cap *outcomes*. "No demographic group shall pay more than X% of their median income for coverage." This forces the insurer to adjust the reference classes until the social outcome is met, rather than adjusting the price to fit the "risk."

  3.  **Mandatory Pooling (Community Rating Expansion):**
      If risk is a construct, the "unraveling" argument is just a threat. We would expand community rating (like ACA health insurance) to auto and life. Everyone in a region pays the same base rate, adjusted only for choices they make *after* buying the policy (e.g., safe driving telematics), not for who they *are* (age, location, history).

  4.  **Transparency of "Why":**
      Currently, you get a rate, not a reason. Under the rival view, the insurer must disclose the **social weight** of each variable. "Your premium is high 40% because of loss history, 60% because your zip code is subsidized." It forces the political cost into the open.

  5.  **Shift from "Expected Loss" to "Ability to Pay":**
      The ultimate consequence. If the class is a policy choice, the goal of insurance shifts from **indemnity** (making you whole) to **security** (keeping you solvent). Premiums would be income-graded, not risk-graded. The "risk" is pooled across the whole society, funded by progressive pricing rather than actuarial segmentation.

  ### Summary Stance
  The current practice is running on **Pragmatic Frequentism**. It treats your risk as the average of your group because that's the only calculable number, but it selects groups based on **Political Acceptability** rather than philosophical consistency. It is not principled; it is a equilibrium of profit, law, and public tolerance. If you want to change it, you cannot argue about "true risk." You must argue about the social goals of the pricing mechanism itself.
