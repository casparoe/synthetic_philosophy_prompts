answer: |-
  The film *Source Code* serves as a compelling narrative laboratory for testing the reality of virtual worlds, specifically through your proposed ontological continuity criterion and harm-transfer thesis. By examining the structural shifts between the loops and the final timeline, we can see how the film both supports and complicates these philosophical positions, ultimately suggesting that reality is less about the substrate of existence and more about causal independence.

  The ontological continuity criterion argues that a simulation becomes real when it persists beyond its intended function. *Source Code* initially presents the train world as a closed loop: a eight-minute memory reconstruction designed solely for intelligence gathering. During these loops, the world resets constantly; objects and people dissolve when the timer hits zero. This aligns with the view that the simulation is merely instrumental, lacking independent reality. However, the ending radically shifts this status. When Colter Stevens prevents the bombing and asks Goodwin to disconnect his physical body, the simulation does not reset. The timer passes 00:00, the train continues to Chicago, and the world persists without the original operator's intervention. Crucially, Colter sends an email to Goodwin in the "real" world. This message is the ultimate test of your criterion: the simulation produces an effect in the base reality independently of its original purpose (finding the bomber). The film vindicates the continuity criterion here by showing that once the simulation gains causal independence—existing past its programmed limit and affecting the outside world—it demands to be treated as ontologically real.

  However, the harm-transfer thesis faces more resistance. This thesis claims virtual harm is only real if it impacts the inhabitant's real-world body or standing. Throughout the film, Colter experiences the deaths of the passengers as deeply traumatic, even when he believes they are merely memory fragments of already-dead people. If the harm-transfer thesis were strictly true, Colter should feel no moral weight during the early loops; harming a memory cannot transfer harm to a dead person's standing. Yet, the film insists Colter feels guilt and responsibility immediately. This suggests that virtual harm has an intrinsic reality based on the experience of the suffering, not just its external consequences. The film complicates the thesis by showing that moral reality precedes ontological confirmation. It is only at the end, when the continuity criterion is met, that the harm to the passengers becomes "objectively" real in the narrative universe, but the film argues through Colter's emotions that the harm was subjectively real all along.

  A significant complication arises because the film blurs the line between simulation and alternate reality. If the Source Code creates a branching universe rather than just running a program, then the "virtual" objects are actually physical objects in a different timeline. This resists a pure virtual realism based solely on computational processes. If the train is made of quantum possibilities rather than code, then the debate shifts from "are virtual objects real?" to "which reality counts?" The film adds something to the debate that abstract argument often misses: the ethical stakes of dismissal. Philosophical arguments can treat the status of digital beings as a categorization problem, but the film forces the audience to feel the injustice of treating the passengers as disposable data. By making Colter fall in love with Christina and befriend Sean, the film demonstrates that phenomenological experience—the feeling that these people are real—is often enough to generate moral obligation, even before ontological continuity is proven.

  Ultimately, the film suggests that while experience grants moral weight, ontological status is granted by continuity. The email to Goodwin is the narrative's way of sealing the reality of the new world; without that causal link and the continuation of time, Colter's existence would remain solipsistic. The film argues that a world becomes real when it stops being a tool for someone else and starts having its own future.

  \answer{continuity criterion vindicated}
