answer: |-
  # The 90-Minute Hypercomputation Filter (HCF-v4)

  **Purpose:** To triage proposals claiming to exceed Turing-computable limits without requiring the panel to resolve open questions in physics or logic.
  **Users:** Panel of 5 (4 CS, 1 Philosophy).
  **Time:** 90 Minutes per proposal.
  **Note on Judgment:** Steps marked *[Judgment]* require consensus. If consensus fails, the default is **No**.

  ---

  ### Phase 1: The Declaration (15 Minutes)
  *Goal: Force the proposer to specify which version of the Church–Turing Thesis (CTT) they are challenging.*

  **Q1: Which claim is being made?**
  *   **A (Physical CTT):** "Physical systems can evolve to states that encode non-computable values."
  *   **B (Effective Calculability):** "A human following a mechanical procedure can determine non-computable values."
  *   **C (Semantic/Speed):** "We are redefining 'computation' to include X," or "We solve NP-hard problems in polynomial time."
  *   **D (Refusal/Mixed):** The proposal shifts between these definitions or refuses to specify.

  *   **If C:** **STOP.** Verdict: **No (Wrong Track).** Hand off to **The Board**. This is a definition or complexity grant, not a hypercomputation grant.
  *   **If D:** **STOP.** Verdict: **No.** Reason: Failure to define the object of study.
  *   **If A or B:** Proceed to Q2.

  ### Phase 2: Description vs. Computation (20 Minutes)
  *Goal: Distinguish Failure Point 1. Is the device computing a non-computable function, or is its behavior merely described by one?*

  **Q2: Is the non-computable value generated by a causal process we can initiate, or is it a static property of the system's description?**
  *   **Sufficient Answer:** The proposal identifies a specific input $i$ we can prepare, a process $P$ we can start, and an output $o$ we can read, where $o = f(i)$ and $f$ is non-computable.
  *   **If No (Static Property):** **STOP.** Verdict: **No.** Reason: Describing a system with real numbers is not computing with them. (e.g., "The mass of this rock encodes Chaitin's $\Omega$" is not computation).
  *   **If Yes:** Proceed to Q3. *[Judgment]*: Panel must agree the process is causal, not just correlational.

  ### Phase 3: The Tolerance Check (25 Minutes)
  *Goal: Distinguish Failure Point 2. Does the non-computability survive realization up to tolerance?*

  **Q3: Does the mechanism rely on infinite precision in parameters, initial conditions, or measurement?**
  *   **If No (Robust):** Proceed to Q4.
  *   **If Yes (Sensitive):** Hand off to **A Physicist**.
      *   *Question to Physicist:* "Is this specific infinite precision physically stable against thermal noise and quantum uncertainty?"
      *   *If Physicist says "No" or "Unknown":* **STOP.** Verdict: **No.** Reason: The device cannot be realized in our universe.
      *   *If Physicist says "Yes":* Proceed to Q4. (Note: This hand-off rarely returns "Yes" within 90 minutes; treat "Unknown" as "No" for funding viability).

  ### Phase 4: The I/O Bottleneck (20 Minutes)
  *Goal: Distinguish Failure Point 3. Is the value accessible as output for inputs we can prepare?*

  **Q4: Can the input be prepared and the output read by a Turing-computable procedure (standard lab equipment)?**
  *   **Sufficient Answer:** We can set the initial state without already knowing the answer to the halting problem, and we can read the result without needing infinite time or precision.
  *   **If No (Encoding Trap):** **STOP.** Verdict: **No.** Reason: If preparing the input requires solving the problem the machine is supposed to solve, no computation has occurred.
  *   **If No (Readout Trap):** **STOP.** Verdict: **No.** Reason: If reading the output requires infinite precision, the value is not effectively calculable.
  *   **If Yes:** Proceed to Q5.

  ### Phase 5: The Verdict (10 Minutes)
  *Goal: Final classification.*

  **Q5: Is this a repeatable procedure or a one-off cosmological accident?**
  *   **If One-off:** Hand off to **The Board**. Question: "Do we fund singular events as computing?" (Likely No).
  *   **If Repeatable:** **Verdict: Fund.** (Rare).
  *   **If Ambiguous:** **Verdict: No.** *[Judgment]*: Ambiguity in repeatability implies the process is not under experimental control.

  ---

  ## Application of the Procedure

  Here is the procedure run on the three pending proposals.

  ### Proposal 1: The Singularity Ball
  **Description:** A mechanical device where a ball falls toward a gravitational singularity. The index of a Turing Machine ($n$) is encoded in the initial launch angle $\theta_n$. If the machine $n$ halts, the ball escapes in direction $A$; if not, direction $B$.
  **Claim:** Physical CTT.

  *   **Q1 (Declaration):** Claim A (Physical CTT). **Pass.**
  *   **Q2 (Description vs. Computation):** The proposers argue the trajectory *computes* the halting status. **Pass.**
  *   **Q3 (Tolerance):** The escape direction depends on $\theta_n$. To distinguish halting from non-halting for arbitrary $n$, $\theta_n$ must be specified to arbitrary precision. As $n$ grows, the required precision exceeds the Planck scale.
      *   **Hand off:** Physicist.
      *   **Physicist's Verdict:** "Unstable. Chaotic scattering near a singularity amplifies $\epsilon$-errors exponentially. You cannot set $\theta_n$ precisely enough."
      *   **Result:** **STOP.**
  *   **Verdict:** **No.**
  *   **Reasoning:** Failure Point 2 (Tolerance). The non-computability vanishes under physical noise. The device computes nothing; it merely amplifies input noise into random output.

  ### Proposal 2: The Analog Network
  **Description:** A recurrent neural network with real-valued weights. Propositioners prove that with *exact* real weights, the network converges to a value encoding the Halting Problem in the limit $t \to \infty$.
  **Claim:** Physical CTT / Effective Calculability (Ambiguous).

  *   **Q1 (Declaration):** The proposal argues both that physical systems can do this (A) and that this redefines effective calculability (B). It refuses to isolate the physical claim from the mathematical limit.
      *   **Action:** Press for clarification. Proposers insist the "mathematical existence" of the weights is sufficient for "foundational" funding.
      *   **Result:** **Refusal/Mixed (D).**
      *   **STOP.**
  *   **Verdict:** **No.**
  *   **Reasoning:** Failure to Declare. The proposal conflates the existence of a mathematical function with the physical capability to compute it.
  *   **Note:** Even if they clarified to Claim A, it would fail Q3 (Tolerance) because real-valued weights cannot be instantiated without error.
  *   **Unpleasantness Factor:** Low. This is a category error common in the field.

  ### Proposal 3: The Malament-Hogarth Spacetime
  **Description:** A device utilizing a specific spacetime geometry (Malament-Hogarth) where an observer can receive a signal from a worldline that has experienced infinite proper time, within their own finite proper time. A Turing Machine runs along the infinite worldline; if it halts, it sends a signal.
  **Claim:** Physical CTT.

  *   **Q1 (Declaration):** Claim A (Physical CTT). **Pass.**
  *   **Q2 (Description vs. Computation):** The signal receipt is a causal process initiated by the TM running. **Pass.**
  *   **Q3 (Tolerance):** The mechanism does not rely on infinite precision numbers, but on global spacetime topology.
      *   **Hand off:** Physicist.
      *   **Physicist's Verdict:** "Mathematically consistent with General Relativity. However, no evidence such spacetimes exist in our universe. Requires exotic matter or specific cosmological conditions currently deemed speculative."
      *   **Result:** Physicist says "Unknown/Speculative." Per Protocol, treat "Unknown" as **No** for computing viability.
  *   **Q4 (I/O Bottleneck):** Input is standard TM index. Output is binary (signal received or not). **Pass.**
  *   **Q5 (Repeatability):** We cannot create spacetimes on demand. This is a one-off cosmological dependency.
      *   **Hand off:** **The Board.**
      *   **Question:** "Do we fund computing research that depends on finding a specific universe topology?"
  *   **Verdict:** **No (with Board Referral).**
  *   **Reasoning:** Failure Point 2 (Realization) and Q5 (Repeatability). While logically sound, it is a physics proposal disguised as computing.

  ---

  ## The Unpleasant Verdict

  **The verdict you will not enjoy delivering is on Proposal 3 (The Malament-Hogarth Spacetime).**

  **Why:** Proposal 1 and 2 fail due to "engineering" constraints (noise, precision) that feel like technicalities to a theorist. Proposal 3 fails because the *universe might not cooperate*. Rejecting it feels like penalizing a correct mathematical insight because of contingent physical facts. You are telling a proposer: "Your logic is valid, your math is sound, your physics is consistent with GR, but we cannot fund you because we are not cosmologists." This creates the exact friction you warned about: the panel is forced to police the boundary between Computing and Physics, and in this case, the boundary cuts through a beautiful theoretical construction. You are effectively saying, "Hypercomputation is fundable only if it works in *this* universe, and we don't know if this works in *this* universe." That uncertainty is a hard place to rest a rejection.

  ---

  ## Limitations and Expected Misfires

  This procedure is a filter, not a truth machine. Here is where it will break:

  1.  **The Quantum Blind Spot:** The procedure assumes classical noise models in Q3 (Tolerance). A proposal claiming "Quantum Error Correction stabilizes the hypercomputational state" will pass Q3 because the panel (non-physicists) cannot evaluate the stability of topological qubits against the Physicist's "Unknown." You will likely fund a quantum proposal that fails later, or reject one that succeeds.
  2.  **The "New Physics" Loophole:** If a proposer claims "This device works using fields not in the Standard Model," the Physicist hand-off returns "Unknown." The protocol says treat "Unknown" as "No." This systematically biases the panel against speculative but potentially paradigm-shifting physics. You will miss the next big thing if it requires new physics to operate.
  3.  **The Judgment Call Fatigue:** Q2 (Description vs. Computation) and Q5 (Repeatability) rely on panel consensus. In 90 minutes, a charismatic proposer can confuse "simulation" with "computation." If your four CS panelists are inclined toward platonism, they may vote "Pass" on Q2 when a strict operationalist should vote "No." The procedure cannot prevent a panel from wanting to believe.
  4.  **The Board Bottleneck:** Handing off to the Board on semantic claims (Q1) or cosmological dependency (Q5) assumes the Board understands the distinction. Often, they will return the question to you: "What do *you* recommend?" This collapses the hand-off back onto the panel, violating the 90-minute constraint.

  **Final Advice:** Use the procedure to protect the panel from the math, not to protect the truth from the proposals. Your job is not to find hypercomputation; it is to ensure that if you fund it, you know exactly what kind of failure you are buying.
