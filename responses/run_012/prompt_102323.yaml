      *   *Wheels:* Real factors (labor, capital, resources, technology).
      *   *Motion:* Economic activity (output, transactions).
      *   *Friction:* Transaction costs, inefficiencies in barter.
      *   *Oil:* Money (facilitates exchange).
      *   *Implication:* Adding oil doesn't make the machine bigger or faster *structurally*; it just stops it from grinding. Too much oil might be messy (inflation), but doesn't create power.

  3.  **Map to Hume's Actual Text (*Of Money*, etc.):**
      *   *Hume's Core:* Money is "nothing but the representative of labor and commodities." It's a "method of rating men's industry."
      *   *Neutrality:* In the long run, increasing money supply just raises prices proportionally.
      *   *Non-Neutrality (The Crucial Twist):* Hume explicitly argues that an *increase* in money *does* stimulate industry in the short run before prices rise. "It is only in this interval or intermediate situation, between the acquisition of money and rise of prices, that the increasing quantity of gold and silver is favourable to industry."
      *   *Specie-Flow:* Under metallic standards, money flows out if prices get too high, restoring balance.
      *   *Credit:* Hume distinguishes between paper credit (bank money) and specie. He worries paper credit can inflate prices without the same stabilizing flow.

  4.  **Identify the Breaks in the Analogy:**
      *   *Break 1: The "Oil" acts as Fuel temporarily.* Hume says money growth *does* increase motion (output) temporarily. Oil doesn't usually act as fuel.
      *   *Break 2: The Machine isn't Fixed.* Hume believes money can awaken "idle hands." The machine expands, it doesn't just spin faster at the same size.
      *   *Break 3: Distribution Matters.* Hume notes money enters at specific points (merchants/manufacturers first), rippling out. Oil is usually poured everywhere or into a central reservoir.
      *   *Break 4: Fiat vs. Specie.* Hume assumes a self-correcting mechanism (specie flow). Modern central banks can hold money in. The "overflow valve" is broken.
      *   *Break 5: Expectations.* Hume hints at psychology ("hope of reward"). Oil has no psychology.

  5.  **Evaluate the Friend's Conclusion:**
      *   *Claim:* Worries about CB money creation are overblown because money is neutral.
      *   *Hume's View:* Long-run neutrality, yes. Short-run stimulation, yes. But *uncontrolled* inflation is bad. Hume was wary of paper credit exploding beyond specie.
      *   *Verdict:* The friend is using Hume's long-run conclusion to ignore short-run volatility and institutional differences. The analogy supports "long-run neutrality" but hides the "short-run real effects" and the "institutional fragility."

  6.  **Develop a Better Analogy:**
      *   *Idea:* Money as a *messenger* or *signal*?
      *   *Idea:* Money as *water in an irrigation system*? (Flows, wakes up soil, but too much floods).
      *   *Idea:* Money as *adrenaline*? (Short term boost, long term crash if sustained).
      *   *Selection:* **Water in an Irrigation System.**
          *   Why? It flows (circulation), it wakes up dormant land (idle labor), it raises the level (prices), and if the dam breaks (fiat/credit), it floods. It captures the *dynamic* nature better than static "oil."

