      *   *Section 4: The "Fixed Machine" Problem.* The analogy implies a fixed capacity. Hume believed money could expand capacity (employ idle poor).
      *   *Section 5: A Better Analogy.* Propose the "Irrigation/Water" or "Dopamine/Signal" analogy. Let's go with **Water/Irrigation** as it fits the "flow" and "level" aspects of Hume better.
      *   *Conclusion:* Summarize the verdict.

  8.  **Refining the Hume Scholarship:**
      *   Make sure to cite *Of Money* specifically regarding the "interval."
      *   Mention *Of Interest* to distinguish money from capital (the friend might be conflating them).
      *   Ensure the distinction between "Neutrality" (long run) and "Non-Neutrality" (short run) is sharp. Hume is often cited as the father of Quantity Theory, but he is *not* a rigid monetarist in the modern sense. He emphasizes the *process* of adjustment.

