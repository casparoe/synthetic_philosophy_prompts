  Bottom line
  The unifying principle is **Weighted Expected Utility with Meta-Cognitive Costs**. You should stop searching when the expected utility gain from a better option, discounted by the choice's irreversibility and impact on future optionality, no longer justifies the sum of direct search costs and the cognitive effort required to evaluate the search itself. This principle sacrifices the strict intuition that the apartment case is identical to the job case; it demands we treat the apartment as "fine" only because housing is less path-dependent than careers, not because the search mechanics are identical. It validates your friend's blanket rule as a rational savings on deliberation costs.

  The verdicts, restated
  Your verdicts divide into three clusters. First, **low-stakes or reversible choices** (pasta sauce, benign diagnosis, research problems) warrant immediate satisficing. Second, **high-stakes, path-dependent choices** (career-launching jobs, fatal diagnoses, statistical methods) require exhaustive search despite high costs. Third, **high-stakes but reversible choices** (apartments, marriage) are treated as fine to stop early, implying that reversibility or emotional search costs outweigh the potential gain of optimization. The tension lies in distinguishing the apartment from the job, and the pasta sauce from the statistical method, despite superficial similarities in search costs.

  Candidate principles
  **Candidate Principle 1: Net Expected Value.** Stop when $P(\text{better}) \times \text{Value}(\text{better}) < \text{Cost}(\text{search})$. This handles the statistical method (high value of better method) vs. pasta (low value of better sauce). However, it fails the apartment case unless we assume apartment search costs are prohibitively high, and it ignores the friend's heuristic.
  **Candidate Principle 2: Path Dependence Weighting.** Modify the value term by irreversibility. A job offer isn't just a salary; it's a career trajectory. An apartment is just shelter. This explains why you owe yourself more looking for the job: the cost of error includes lost future optionality. The pasta sauce has zero path dependence. This clause rescues the job verdict but doesn't fully explain the friend's blanket rule.
  **Candidate Principle 3: Meta-Rationality.** The cost of searching includes the cost of deciding whether to search. If calculating the expected value of further search requires more energy than the search itself, a blanket heuristic (like your friend's) becomes rational. This validates the friend's rule even if it's locally sub-optimal.
  **Synthesis:** The robust principle combines these: **Stop when the risk-adjusted utility gain, accounting for future optionality, is less than the direct and deliberative costs of continuing.** This captures the job's path dependence, the pasta's negligible utility gain, and the friend's savings on deliberation.

  Predictions on cases I haven't listed
  **Case 1: Buying a Used Car.** This is high cost and high risk of hidden defects, but low path dependence (you can sell it later). The principle predicts moderate search: more than pasta, less than a job. You should pay for a mechanic (low cost test) like the doctor case, but not scour the entire country. The irreversibility is low enough that satisficing after a reasonable inspection is rational, unlike the job market where early choices lock out future paths.
  **Case 2: Choosing a College Major.** This is highly path-dependent, similar to the job case. The principle predicts extensive search is required before committing. Stopping at the first interesting major is irrational because it closes doors to future careers, unlike the apartment case. The "cost" of a wrong major is years of lost earning potential, weighting the expected value of information heavily toward further search.
  **Case 3: Selecting a Restaurant for a Regular Weekly Dinner.** High frequency amplifies small utility gains. Even if picking is low effort, the cumulative value of a better choice is high. The principle predicts more search than a one-off dinner, contradicting the pasta sauce case despite low individual stakes. This tests the "cumulative utility" clause, suggesting that repeated low-stakes choices aggregate into high-stakes decisions requiring optimization.

  What I have to give up
  The principle cannot keep the Apartment verdict unqualified. If the housing market is slow and leases are binding, the path dependence rises, and the principle demands more search. You must either drop the verdict that signing the first apartment is always "fine" or complicate the principle to include "emotional exhaustion" as a valid cost. I recommend complicating the principle. The emotional toll of apartment hunting is a real direct cost that justifies satisficing sooner than in the job market, where professional stamina is expected. The verdict stands, but only because the cognitive cost of housing searches is uniquely high.

  Loose ends
  This framework assumes agents can estimate probabilities and values, which is often impossible. It also struggles with "unknown unknowns"—risks you don't know to test for, like the rare fatal condition. Finally, it treats emotional costs as fungible with time costs, which may not hold when anxiety distorts judgment. The principle guides the logic, but cannot automate the feeling.
