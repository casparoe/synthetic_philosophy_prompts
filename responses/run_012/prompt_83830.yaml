answer: |-
  **Framing the Inquiry**
  The hard part is the question. If I ask "Are we stories?" the answer is always yes, which makes the theory useless. If I ask "Are we *only* stories?" the answer is obviously no, because of biology. The crack is in the middle: *Where does the story live?* Dennett locates it in the organism's predictive modeling. I want to locate it in the social field. The risk is solipsism—if anyone can tell a story about me, do I have infinite selves? The determinate question must be: **Does personal identity survive the severance of first-person narrative authority?** If a false public narrative becomes the dominant predictive model for a person's behavior, has the "self" migrated to the falsehood? That is testable. That is the work.

  ***

  **Project Title:** The External Center of Narrative Gravity

  **The Question and The Gap**
  Daniel Dennett's "center of narrative gravity" suggests the self is a theoretical object, like a center of gravity in physics: useful for prediction, but not a physical thing. Standard interpretations assume this gravity is generated by the organism's own history and first-person reporting. This proposal challenges that anchoring. I argue that the narrative field is plural and partly external. We are often constituted more densely by the stories others tell about us than by the stories we tell ourselves.

  This creates a problem of individuation and truth. If the self is a narrative center, and narratives are external, can two people share a self (e.g., identical twins treated as one unit by a community)? Can one person host two conflicting selves (the private truth vs. the public scandal)? Current philosophical positions leave this open because they prioritize bodily continuity or psychological connectedness. They treat external misidentification as an error to be corrected, not a constitutive element of the self. I propose that when an external narrative becomes the primary tool others use to predict your behavior, it *becomes* your social self, regardless of its truth value. The "false protagonist" is not a mistake; it is a functional self.

  However, this risks making the theory unfalsifiable. If I claim everyone is a narrative center, even those who insist their lives feel nothing like a story, I am safe but empty. My position handles this by conceding the point: if no narratives cohere around an entity—internal or external—there is no narrative self. This is not a failure of the theory, but a boundary condition. Some lives may be non-narrative. Acknowledging this prevents the theory from becoming a metaphorical blanket that covers everything and explains nothing.

  **Method and Timeline**
  This project utilizes a dual-method approach: philosophical analysis and creative experimentation. The novel I am drafting during the fellowship serves as the laboratory. I will not merely illustrate the theory in fiction; I will use the drafting process to stress-test the limits of external identity construction.

  *   **Months 1–3 (Archaeology):** I will compile case studies of "false protagonists" in public life (individuals known for acts they didn't commit) and analyze them against standard psychological continuity criteria. Simultaneously, I will draft the sections of the novel featuring the "silent character," restricting her internal access to zero to see if she retains personhood solely through neighbor testimony.
  *   **Months 4–6 (Construction):** I will draft the theoretical framework. The focus will be on individuation: defining the threshold where an external story overrides internal history. I will refine the "non-narrative" boundary condition here, interviewing subjects who reject narrative self-conception to ensure the theory doesn't overwrite their experience.
  *   **Months 7–9 (Synthesis):** I will revise both the manuscript and the paper together. The goal is to ensure the philosophical claims are supported by the intuitive weight of the fiction, and vice versa. The final month is reserved for peer review within the center, specifically testing the arguments against non-philosophers.

  **Deliverables**
  1.  **A Philosophical Paper:** "Gravity Without Anchors," suitable for a journal in metaphysics or narrative theory.
  2.  **A Novel Manuscript:** The completed draft of the third novel, which enacts the theory.
  3.  **A Public Lecture:** Bridging the gap between the committee's academics and artists, demonstrating how fiction functions as thought experimentation.

  **Risk Assessment**
  *   **Failure:** The project fails if I cannot distinguish between a real person with a false reputation and a fictional character. If the theory collapses the distinction entirely without explaining why we treat them differently ethically, the model is broken.
  *   **Ballooning:** The risk is expanding into general sociology. I must remain focused on *identity*, not just reputation. I will prevent this by strictly tying every external story back to the question: "Is this the person?"

  **The Novelist Defense**
  Am I just dressing up a novel as research? No. Philosophers often use thought experiments (trolley problems, swampmen) that are stripped of human complexity to isolate variables. Novelists do the opposite: we add complexity to see if the variable holds. A novelist is the right person for this because we are professional builders of centers of narrative gravity. We know how much friction is required to make a character feel "real" without a body. If the theory holds, it should hold in the lab where I have the most control: the page. If I can show that a character built entirely of external gossip functions as a self for the reader, I have proven the external gravity model. This is not decoration; it is data.
