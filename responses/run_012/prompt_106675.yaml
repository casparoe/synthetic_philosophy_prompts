answer: |-
  **Thinking on Paper**

  Superrationality (Hofstadter's formulation) rests on a logical leap: treating other agents' decisions as outputs of the same function you are running. If $f(context) = my\_choice$, and $f(context) = their\_choice$, then $my\_choice = their\_choice$. This licenses cooperation in Prisoner's Dilemmas without external enforcement. It transforms the payoff matrix from $\max(E[U|independent])$ to $\max(E[U|correlated])$.

  *Where it licenses:* One-shot PDs with identical agents; coordination problems where communication is impossible but reasoning is shared; situations where "setting an example" is causal magic (it isn't, but logical correlation mimics it).

  *Where it is fragile:*
  1.  **Heterogeneity:** If the other agent is a causal decision theorist (CDT) and I am a functional decision theorist (FDT)/superrationalist, the correlation breaks. They don't run my function.
  2.  **Common Knowledge:** They must know I am reasoning this way, and I must know they know. Without this, I am just a sucker waiting to be exploited.
  3.  **Survival vs. Optimality:** Superrationality maximizes group utility. It does not guarantee individual survival if the group utility requires sacrifice. If "everyone cooperates" leads to "everyone goes bankrupt," superrationality demands bankruptcy.
  4.  **The "Large N" Problem:** In a group of 10, my choice correlates with 9 others. In a group of 10,000, the psychological certainty of that correlation dilutes. Do I really believe 9,999 others are running *this exact script*?
  5.  **Normativity:** It tells you what to do if you want to be rational *assuming symmetry*. It does not tell you if the symmetry assumption is true. That is a judgment call.

  *Procedure Design Note:* I must build in a "Symmetry Break" clause. If the agents aren't alike, the procedure must default to standard rationality (defect/protect self). I also need a "Viability" clause. If collective cooperation kills the collective, the procedure must advise against it.

  ---

  ### The Superrational Audit (10-Minute Procedure)

  **Purpose:** To determine whether to adhere to a cooperative norm ("Cooperate") or break it ("Don't") in situations where payoffs depend on the simultaneous choices of similar agents.

  **Definitions:**
  *   **The Norm:** The agreed-upon rule (e.g., seasonal limit, gear ban).
  *   **The Peer Group:** The specific set of agents whose choices correlate with yours (e.g., co-op members, not external competitors).
  *   **Cooperate:** Adhere to the Norm.
  *   **Don't:** Break the Norm.

  #### Step 1: The Symmetry Check
  **Question:** Are the other members of the Peer Group facing the *exact* same incentives and constraints as me, and do they know I am using this procedure to decide?
  *   **Sufficient Answer for "Yes":** They have similar debt loads, market access, and catch capabilities; we share communication channels where reasoning styles are discussed.
  *   **Sufficient Answer for "No":** Some members are desperate (immediate bankruptcy risk) while I am stable; or there is a known faction that explicitly rejects cooperative reasoning ("They are pirates").
  *   **Decision:**
      *   If **No**: Stop. **Output: DON'T.** (Return to standard self-interest; symmetry is broken.)
      *   If **Yes**: Proceed to Step 2.
      *   *[Judgment Call Alert]:* Estimating "similar incentives" is subjective. Desperation is hard to measure. You are guessing their internal state.

  #### Step 2: The Correlation Confidence
  **Question:** If I choose to Cooperate, what is the probability that the Peer Group also Cooperates? (Be honest, not idealistic.)
  *   **Sufficient Answer for "High" (>80%):** Past behavior shows tight clustering; there is strong social signaling; the reasoning is simple and obvious.
  *   **Sufficient Answer for "Low" (<50%):** History of secret defection; high incentive to cheat; no mechanism for verifying choices.
  *   **Decision:**
      *   If **Low**: Stop. **Output: DON'T.** (Superrationality requires logical correlation. If the link is weak, you are just sacrificing yourself for no return.)
      *   If **High**: Proceed to Step 3.
      *   *[Judgment Call Alert]:* This is the most fragile step. You are estimating a psychological probability as if it were a physical constant.

  #### Step 3: The Collective Outcome Test
  **Question:** If *everyone* in the Peer Group makes the same choice I am about to make, what is the result?
  *   **Option A (All Cooperate):** Describe the outcome (e.g., stock sustains, prices hold).
  *   **Option B (All Don't):** Describe the outcome (e.g., stock collapses, price war).
  *   **Decision:**
      *   If **All Cooperate** is strictly better for the Peer Group than **All Don't**: Proceed to Step 4.
      *   If **All Don't** is better (or equal) for the Peer Group: Stop. **Output: DON'T.** (Superrationality dictates choosing the best collective template. If the Norm is suicidal, break it.)
      *   *[Judgment Call Alert]:* "Better" is a value judgment. Does it mean profit? Survival? Ecological health? You must define the utility function here.

  #### Step 4: The Viability Handoff
  **Question:** Does "All Cooperate" ensure the survival of my specific crew, or does it risk my ruin even if others do the same?
  *   **Sufficient Answer for "Safe":** We all tighten belts, but we all stay in business.
  *   **Sufficient Answer for "Risk":** We all stay ethical, but the external market (non-peers) drives us all into bankruptcy.
  *   **Decision:**
      *   If **Risk**: Stop. **Output: DON'T.** (Reasoning cannot save you from extinction. This is a values/survival call.)
      *   If **Safe**: **Output: COOPERATE.**

  ---

  ### Case Runs

  #### Case (i): The Unusually Profitable Haul
  *Context:* A crew can make one haul exceeding the voluntary seasonal limit.
  *Norm:* Respect the seasonal limit.

  1.  **Symmetry Check:** Are others facing the same temptation? Yes. Do they reason alike? Mostly yes, it's a small co-op. **(Pass)**
  2.  **Correlation Confidence:** If I stop, will they? The limit is voluntary but historically respected. Confidence is high (>80%). **(Pass)**
  3.  **Collective Outcome Test:**
      *   *All Cooperate (Respect Limit):* Stock remains healthy, future seasons secured.
      *   *All Don't (Overfish):* Stock collapses, fishery closes in 2 years.
      *   *Comparison:* All Cooperate is strictly better. **(Pass)**
  4.  **Viability Handoff:** Does respecting the limit bankrupt me? No, it just reduces this season's profit. I survive. **(Pass)**

  **Output: COOPERATE.**
  *Reasoning:* The symmetry holds, the collective outcome of cooperation is superior, and individual survival is not threatened. Superrationality licenses the sacrifice of immediate gain for the logical certainty of a sustained future.

  #### Case (ii): The Costly Gear Ban
  *Context:* Coordinator deciding whether to honor an unenforced ban on high-efficiency gear. Neighboring fleet (non-members) uses it to undercut prices.
  *Norm:* Honor the gear ban.

  1.  **Symmetry Check:** Are co-op members facing the same pressure? Yes. Do they reason alike? Yes. **(Pass)**
  2.  **Correlation Confidence:** If I break the ban, will they? Given the economic pressure, correlation is high. If I break it to survive, they likely will too. **(Pass)**
  3.  **Collective Outcome Test:**
      *   *All Cooperate (Honor Ban):* Co-op production costs remain high. Neighboring fleet undercuts prices. Co-op loses market share rapidly.
      *   *All Don't (Use Gear):* Co-op production costs drop. Co-op competes effectively with neighbors. Market share stabilizes.
      *   *Comparison:* For the Peer Group (the Co-op), "All Don't" yields higher survival/utility than "All Cooperate." The Norm is suicidal in this market context.
      *   **Decision:** Stop. **Output: DON'T.**

  *Reasoning:* Superrationality does not demand adherence to rules; it demands adherence to the *optimal collective strategy*. If the template "Honor Ban" leads to collective ruin against external competitors, the superrational choice is to break the ban. You are not defecting on your peers; you are leading them to a better collective equilibrium (survival).

  ---

  ### Where the Procedure Breaks (Limitations)

  You asked where the reasoning stops being able to help. Here is the degradation curve:

  1.  **The Large Number Degradation:**
      This procedure works in a small co-op (N=10). If you are part of a global industry (N=10,000), Step 2 (Correlation Confidence) collapses. You cannot genuinely believe your single decision logically compels 9,999 others to act similarly. The "magical" correlation feels like wishful thinking. In large groups, superrationality degrades into standard altruism, which is evolutionarily unstable without enforcement.

  2.  **Heterogeneous Reasoning:**
      The procedure assumes your peers are running the same "software." If half your co-op are superrationalists and half are ruthless causal decision theorists (who will take the haul regardless of what you do), Step 1 fails. You cannot detect this reliably in real-time. If you assume symmetry where there is none, the procedure selects "Cooperate," and you become the sucker who subsidizes the defectors.

  3.  **Survival vs. Logic:**
      Step 4 is the hard stop. Superrationality is a logic tool, not a life-support system. If the "All Cooperate" outcome is moral victory but financial death, the procedure tells you to "Don't." But even then, it cannot solve the tragedy: if everyone reasons this way, the norm dissolves, and you end up in a race to the bottom anyway. The procedure identifies the cliff; it does not build a bridge.

  4.  **The Values Handoff:**
      Notice Step 3 requires you to define "Better." Is it profit? Biodiversity? Community cohesion? Superrationality optimizes *whatever utility function you plug in*. It cannot tell you what to value. If you value "purity of the ocean" above "solvency of the crew," the procedure will output "Cooperate" on the gear ban. If you value "feeding my children," it outputs "Don't." The logic is perfect; the input is human. That is where the burden remains on your shoulders.
