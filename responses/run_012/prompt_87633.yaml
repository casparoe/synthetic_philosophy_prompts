  She will reject the computational plan as a sophisticated recurrence of the Lange failure, ruling that modeling prices without genuine exchange and blocking entry without approval replicates the ontological error of command economies regardless of data quality.

  Three candidate rules are jointly consistent with her seven prior verdicts, though none are logically forced by them. All three predict failure for the new case, but they diverge on why it fails and under what modifications it might succeed.

  **Rule 1: The Ontological Price Rule.** Prices are valid only if they emerge from actual exchange of property titles, not from statistical estimation or administrative fiat.
  *   **Prediction:** Fail. The model simulates prices without underlying property exchange, making them data points rather than economic signals.
  *   **Forced?** No. Case 1's failure could be attributed to lack of entry (Rule 2) or lack of external anchors (Rule 3) rather than price ontology.
  *   **Separating Modification:** Allow firms to freely trade production titles among themselves at the model's prices without state approval. This separates Rule 1 from Rule 2. Rule 1 still predicts Fail (prices are still model-derived, not exchange-derived), while Rule 2 predicts Pass (entrepreneurial trading is allowed).

  **Rule 2: The Entrepreneurial Discovery Rule.** Economic calculation requires a mechanism for unapproved experimentation (new products/plants) to test new combinations, not just optimization of existing lines.
  *   **Prediction:** Fail. The requirement for authority approval on new plants/products blocks the discovery procedure necessary for capital valuation.
  *   **Forced?** No. Case 2's failure on capital could be attributed to the lack of genuine prices (Rule 1) rather than the restriction on entry.
  *   **Separating Modification:** Allow firms to launch new product lines or plants without approval, but keep the model as the sole price-setter. This separates Rule 2 from Rule 1. Rule 2 predicts Pass (discovery is enabled), while Rule 1 predicts Fail (prices remain administrative).

  **Rule 3: The External Boundary Rule.** A planned system is calculable only if it operates within a larger market environment that provides external price anchors for its boundaries.
  *   **Prediction:** Fail. The single digital layer covers *every* transaction in the formal economy, leaving no external market boundary to validate internal shadow prices.
  *   **Forced?** No. Case 4's success could be attributed to internal incentive structures (Rule 2) rather than external boundary prices.
  *   **Separating Modification:** Open the economy to free trade at world prices for all goods, but keep internal prices set by the model. This separates Rule 3 from Rule 1. Rule 3 predicts Pass (external anchors exist), while Rule 1 predicts Fail (internal prices remain non-exchange).

  I believe she is actually running **Rule 1 (The Ontological Price Rule)**. Her verdict on Case 1 explicitly states the failure is "not one of effort, honesty, or computing power but of what a price is," which anchors her reasoning in the nature of prices rather than merely the flow of information or the scope of planning. Additionally, her approval of Prediction Markets (Case 7) hinges on their ability to aggregate belief through betting (exchange), not merely centralizing data.

  I would change my mind if her verdict on **Case 4 (Internal Transfer Pricing)** had attributed the firm's success to the quality of its internal data processing rather than explicitly stating it survives "only because the market prices what it buys and what sells at its boundary." If she had validated internal calculation based on data quality alone, it would undermine the Ontological Rule and support a purely Epistemic/Computational rule compatible with the new case.
