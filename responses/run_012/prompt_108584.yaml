  I'm a backend dev, no philosophy background, and I've ended up in a long running argument with the growth team at my company about where "good persuasion" ends and manipulation starts. I've been writing down my gut calls on cases as they come up, and I want to know if there's actually a principle behind them or if I'm just rationalizing whatever I already wanted to say. I know there's a whole literature on this and I don't want the literature, I want the principle.

  Here's my list.

  - A checkout with a "your cart expires in 04:59" timer that resets if you reload the page. Manipulation. No question.
  - A shop that genuinely has one left saying "last one in stock." Not manipulation. That's just information.
  - A charity ad with a photo of a kid and sad piano music. Not manipulation. I know exactly what they're doing to me and I still think the money should go there.
  - An ad for funeral planning that shows up because I'd been searching for funeral costs after my uncle died. Manipulation, even though every word of it is true and I can tell it's an ad.
  - My GP describing an operation as "7 in 10 people are back to normal within a month" rather than "3 in 10 get complications." Not manipulation. That's her doing her job.
  - A friend who tells me three genuinely nice true things about me and then asks to borrow my car for a week. Manipulation, even though everything she said was true and she meant it.
  - A coworker who says "I'm not saying you have to, but everyone else is staying." Manipulation.
  - My manager offering me a paid day off if I ship the thing over the weekend. Not manipulation, that's an offer.
  - A gym that signs you up online in 30 seconds but makes you cancel by mailing a certified letter. Manipulation, even though every term was disclosed and I clicked agree.
  - The AI autocomplete I use telling me my function is "a really clean solution" when it's a mess. Feels like manipulation even though there's no person with a plan in there, just a model trained to keep me typing.
  - Me putting my running shoes by the door so that tomorrow-me actually goes, and my roommate doing the same for me after I asked her to. Not manipulation.

  The ones I can't square: the funeral ad against the GP (both true, both transparent, both aimed at my feelings). The gym against the manager's offer (both fully disclosed, both about what I get). And the AI thing against basically everything else, since nobody is doing anything to me on purpose.

  Case I'm stuck on and want an actual answer to: the growth team wants to A/B test a screen that shows the user's own kid's photo, pulled from the album they uploaded, at the moment they tap "cancel subscription." Nothing false, nothing hidden, the photo is theirs, we'd never lie about anything. I said no in the meeting and then couldn't explain why. Was I right?

  What I want out of this: the principle, or two or three clauses if one won't cover it, with each clause tagged to the case that forces it. Then the verdicts it gives on cases I haven't listed, including at least one case you make up where it says something I wouldn't have guessed. Then tell me straight which of my calls it can't keep, and whether keeping all of them is worth the mess. The closest I've got on my own is "if you'd feel used when you found out, it was manipulation," but that gets my GP case and my AI case wrong, so it's probably junk. I've gone back and forth alot and I dont care whether you vindicate me, I just want the version that survives contact with all eleven cases.

  No reading list, please. End with one line that starts \answer{ and ends }, containing the principle in one sentence, then a semicolon, then the one verdict of mine you'd drop.
