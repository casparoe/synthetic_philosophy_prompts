prompt: |-
  I'm setting the final for a second-year course on logic and reasoning and I want one essay question on Carroll's tortoise that a student can't answer by just narrating the regress. The crux I'm after: the tortoise keeps asking for the conditional to be tacked on as another premise, and it's tempting to say it's just being stubborn -- but if the premise and the rule say the same thing, why doesnt adding it help, and what is the difference between believing a truth and accepting a rule in the first place? I want them pushed to say where the justification of an inference actually bottoms out and why that stopping point isn't just arbitrary, and to say whether 'the tortoise is simply being irrational' is an answer or a dodge. Two things they have to engage instead of waving away: one student insists inference is a skill and not a belief, like riding a bike, so asking for a justification of modus ponens is a category mistake; a colleague reckons the real trouble is that inferring requires you to take your premises to support the conclusion, and that this taking is the regress wearing a hat. Write the question, a model answer of about 700 words, and a marking scheme with five must-hit points, marks out of 20, and one line per point on the mistake students usualy make there.
