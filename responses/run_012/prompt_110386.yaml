answer: |-
  **The Case: The Ironic Notification**

  Elias is working on a laptop in a cafe; his friend Sam sits opposite him. A calendar notification pops up on Elias's screen reading "Meeting with Sam," though they are currently together. Elias glances at the screen for 200ms, smiles briefly, closes the laptop, and orders a coffee. When Sam asks three seconds later, "What was that?", Elias says, "Just spam, I think." The functional story is fixed: the visual processing of the text occurred, the motor program for the smile was executed, the linguistic report was generated, and there was no attempt to deceive (Elias believes the report when he makes it). The smile implies semantic recognition of the irony at *t=1s*; the verbal report implies a lack of semantic recognition at *t=1s*.

  **The Verdicts**

  *   **Cartesian Theater:** There must be a specific time *t* when the content "Meeting with Sam" entered the Theater. Either the content was conscious (in the Theater) at *t=1s*, or it was not. If it was conscious, Elias's verbal report is a memory error or a lie (Orwellian revision). If it was not conscious, the smile was a purely unconscious reflex triggered by semantic processing outside the Theater (Stalinesque pre-processing). The Cartesian is forced to choose one probe as the "truth" and the other as a failure of transmission or memory. There is a Fact of the Matter about whether Elias *really* saw the irony.
  *   **Multiple Drafts:** There is no single Theater, so there is no single *t* where "seeing the irony" happened. Instead, there were competing drafts. One draft (visual-motor) registered the semantic content sufficiently to trigger the smile. A later draft (linguistic-narrative) categorized the event as "spam" to maintain social flow. The verbal report is not a lie about a past conscious state; it is the current state of the narrative draft. The view says something definite: *access was fragmented*. The content was conscious *for* the motor system but not *for* the speech system. There is no "Fact of the Matter" about whether he *really* saw it, only facts about which systems had access.

  **The Single Feature Doing the Work**

  The dissociation between **non-verbal behavioral influence** (the smile) and **verbal report availability** (the denial). The case stipulates that both are genuine outputs of the system, not errors. The Cartesian must unify them into a single timeline of awareness; the Multiple Drafts model allows them to be parallel, competing narratives with no master timeline.

  **The Control: Moving the Probe**

  Hold the processing story fixed (glance, smile, close) and vary only the time of Sam's question.
  *   **Probe at 0.5s (Immediate):** Elias says, "Ha, look, it says we're meeting."
  *   **Probe at 3.0s (Delayed):** Elias says, "Just spam."
  *   **Cartesian:** Consciousness is fleeting. At 0.5s the content was in the Theater; by 3.0s it had faded or been overwritten. The "Fact of the Matter" is that he *was* conscious at 0.5s, and the later report is a memory failure.
  *   **Multiple Drafts:** The narrative draft is unstable. At 0.5s, the "Irony Draft" had the highest potency for speech. At 3.0s, the "Social Politeness Draft" (denying the awkwardness) gained potency and edited the narrative. Nothing "faded"; the winning draft changed. The "Fact of the Matter" about *when* he was conscious is meaningless; there is only the fact of which draft won the broadcast at the moment of probing.

  **The Hostile Redescription**

  *   **Cartesian Move:** "The smile was a subconscious semantic reflex. The verbal report is the only true indicator of consciousness. Elias never consciously saw the irony; his brain processed it without him."
  *   **Why It's Ad Hoc:** This saves the Theater by redefining "consciousness" as "whatever the speech center reports." But the smile is *semantically appropriate* (it targets the irony, not just the light or shape). If the "subconscious" can grasp irony, smile appropriately, and close the laptop, it is doing all the work the Theater was posited to do (integrating meaning and action). Positing a second, "dark" consciousness that does the work while the "light" consciousness sits idle renders the Theater explanatorily redundant. The Cartesian must either admit the subconscious is conscious (collapsing the Theater) or claim meaning can be grasped without consciousness (undermining the motivation for the Theater).
