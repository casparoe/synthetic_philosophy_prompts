prompt: |-
  I'm a retired field ecologist — 35 years at a small research station before I hung it up — and I've gotten deep into philosphy in the last few years, mainly because I finally have the time. Anyway, the station is coming up on its 80th year and they've asked me to chair the committee writing the history. Five of us, meeting monthly, document goes public next spring. The tricky part is it's not a clean story. There's the founding generation everyone loves, there's a long middle stretch of work that looks like pure accumulation, and then there's the 60s through 80s, when some of our data got picked up by agencies and used in ways that did real harm to people living where we worked, plus a couple of researchers whose results nobody can reproduce now.

  I keep coming back to that Nietzsche essay where he splits history into monumental, antiquarian and critical — I'm sure you know the one. What I want is a procedure my committee can actually run, episode by episode, to decide how we tell each one. Concretely: the questions to ask in order, what counts as a good enough answer at each step, where the procedure stops and delivers a verdict, and where it hands off to a human because the call is a value judgment rather than a fact we can settle.

  Three things I want it to handle, since they're what we keep arguing about. First, an episode often seems to want two modes at once — we want the founding era told monumentally because it recruits people and gives them something to live up to, and we want the bad years told critically because that's the whole point of doing this honestly. I want the procedure to say when telling the same episode twice, in two registers, is legitimate and when it's just having it both ways. Second, I suspect each mode has a failure mode that only shows up once you ask who the history is for, and I'd like that built in rather than bolted on at the end. Third, the committee isn't neutral — half of us worked there during the bad years — so tell me where self-interest disqualifies someone and where it's actually a qualification.

  Then run it on three episodes: the founding generation, the contested results, and the agency use. I want at least one where the procedure tells me something I don't want to hear, and I want you to say straight out what this procedure can't do — where it'll misfire, and where it's just a flowchart pretending to be a method.

  And please don't hand me a menu of options and leave the picking to me. Commit: give me the procedure you'd actually defend, and make the hard calls yourself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired field ecologist (35 years), deep into philosophy (specifically Nietzsche's *On the Use and Abuse of History for Life*), chairing a history committee for a research station's 80th anniversary.
      *   **Task:** Create a concrete *procedure* (algorithm/flowchart equivalent) for the committee to decide how to narrate specific historical episodes using Nietzsche's three modes (Monumental, Antiquarian, Critical).
      *   **Specific Constraints/Requirements:**
          1.  Handle mixed modes (when is it okay to tell an episode twice vs. hedging?).
          2.  Identify failure modes of each history type based on *audience* (who is this for?).
          3.  Address committee bias (self-interest as disqualifier vs. qualifier).
          4.  Run the procedure on three specific episodes: Founding Generation, Contested Results, Agency Use (60s-80s).
          5.  Include at least one "unwelcome truth" (something the user doesn't want to hear).
          6.  Explicitly state the procedure's limitations (where it misfires/is just a flowchart).
          7.  **Crucial:** Do not offer a menu of options. Commit to a specific procedure and make hard calls.
      *   **Tone:** Respectful of the user's expertise (ecology + philosophy), direct, pragmatic, intellectually rigorous, avoiding fluff.

  2.  **Deconstruct Nietzsche's Framework (in this context):**
      *   *Monumental:* Inspiring, great deeds, models for the future. Risk: Myth-making, ignoring context, discouraging innovation by setting impossible standards.
      *   *Antiquarian:* Preserving, detailing, reverence for origins. Risk: Mummification, valuing everything old equally, stifling the present.
      *   *Critical:* Judging, condemning, breaking the past to live in the present. Risk: Nihilism, destroying roots, self-righteousness.
      *   *The Goal:* "History for Life." The history must serve the living station's future, not just accuracy or comfort.

  3.  **Develop the Procedure (The "Nietzschean Triage"):**
      *   Need a step-by-step process.
      *   *Step 1: Fact-Finding (Antiquarian Base).* Establish what happened.
      *   *Step 2: Audience Impact (The Failure Mode Check).* Who reads this? How does each mode affect them?
      *   *Step 3: Mode Selection & Conflict Resolution.* Can we mix? When?
      *   *Step 4: Bias Check.* Who speaks?
      *   *Step 5: The "Life" Test.* Does this help the station thrive?

      *Refining the "Mixed Mode" constraint:* Nietzsche warns against eclecticism. You can't just have it both ways. The rule should be: *Sequential* telling is okay (Monumental for recruitment, Critical for internal ethics), but *simultaneous* ambiguity is not. Or, better: One dominant mode per audience channel.
      *Refining the "Bias" constraint:* Insider knowledge is vital for Antiquarian/Critical, but dangerous for Monumental (myth-making).

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Name:* The Tri-Modal Audit.
      *   *Phase 1: The Antiquarian Floor.* (Establish facts).
      *   *Phase 2: The Audience Vector.* (Who reads? What harm/benefit?).
      *   *Phase 3: Mode Assignment.* (Pick the dominant mode).
      *   *Phase 4: The Dual-Narrative Rule.* (When can we split the story?).
      *   *Phase 5: The Witness Protocol.* (Who writes it?).

  5.  **Applying to the Three Episodes:**
      *   *Founding Generation:* Usually Monumental. But needs Antiquarian grounding.
      *   *Contested Results:* Scientific integrity issue. Needs Critical but handled carefully.
      *   *Agency Use (Harm to locals):* The ethical minefield. Needs Critical primarily.

      *The "Unwelcome Truth":* I need to find a place where the procedure forces a conclusion the user might resist. Likely regarding the Founding Generation. If the Founding is tied to the Harm (e.g., access granted by colonial powers, or data used later), the Monumental narrative might need to be severely curtailed or critically framed. Or, regarding the Committee: The user (Chair) might need to recuse themselves from certain sections due to the "Bad Years." Let's aim for the latter or the former. Let's go with the Founding Generation: If the foundation relied on exclusion or access that led to later harm, the Monumental mode is dangerous. *Better idea:* The procedure should dictate that the "Contested Results" cannot be buried in footnotes. It must be Critical. But the *real* unwelcome truth might be about the Committee composition. If half were there during the bad years, they cannot write the Critical history of those years. They are witnesses, not judges.

  6.  **Addressing Limitations:**
      *   It can't generate truth.
      *   It can't resolve deep moral trauma.
      *   It's a tool for consensus, not a moral oracle.

  7.  **Finalizing the Tone:**
      *   Speak colleague-to-colleague. Acknowledge the weight of the task.
      *   Be firm on the procedure. No "you could try this."
      *   Ensure the Nietzschean concepts are used correctly (History *for Life*).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "mixed modes" constraint? Yes, via the "Dual-Narrative Rule."
      *   *Check:* Did I address audience failure modes? Yes, in Phase 2.
      *   *Check:* Did I address committee bias? Yes, in Phase 5 (Witness Protocol).
      *   *Check:* Did I run the three episodes? Yes.
      *   *Check:* Is there an unwelcome truth? Yes, regarding the committee's authority to judge the "Bad Years."
      *   *Check:* Did I avoid menus? Yes, prescribing specific steps.

      *(Self-Correction on the "Unwelcome Truth"):* The user is the Chair. They worked there 35 years. They were likely there during the 60s-80s "Bad Years." The procedure should probably flag that *they* specifically might need to step back from the Critical judgment of that era, even if they chair the committee. That's personal and direct. Or, regarding the Founding: If the Founding is mythologized to hide the roots of the later harm, the procedure must break that myth. Let's go with the Committee Bias one—it's more actionable for the procedure. Actually, the prompt asks for *one* episode where the procedure says something unwelcome. Let's make it the **Founding Generation**. Usually, people want this pure Monumental. The procedure might demand a Critical lens if the Founding enabled the later Harm. That challenges the "clean story."

      *Wait, re-reading the prompt:* "I want at least one where the procedure tells me something I don't want to hear."
      Okay, I will make the procedure dictate that the Founding Generation *cannot* be told purely monumentally because it obscures the power dynamics that allowed the later harm. This strikes at the "clean story" desire.

      *Wait, another angle:* The Committee Bias. The prompt says "half of us worked there during the bad years." The procedure should dictate that those members *cannot* draft the Critical assessment of that era. They can provide testimony, but not judgment. This might be unwelcome if they want to control the narrative to protect themselves. I'll combine these: The procedure restricts who writes what, and it restricts the mode of the Founding.

      *Decision:* I will focus the "unwelcome truth" on the **Agency Use** episode. The user likely wants to frame this as "mistakes were made" (Antiquarian/Monumental deflection). The procedure will force a **Critical** judgment that names names and mechanisms, and it will disqualify the committee members who were present from writing the verdict.

      *Actually, let's look at the "Mixed Mode" constraint again.* The user wants to know when telling the story twice is legitimate. The procedure should say: It is legitimate *only* if the audiences are mutually exclusive (e.g., Recruitment Brochure vs. Internal Ethics Archive). If it's one public document, you must synthesize. Since this is a "history document going public," you can't split it. You must integrate. This is a hard call.

      *Refining the Procedure Steps:*
      1.  **Fact Lock (Antiquarian):** Can we verify it?
      2.  **Life Test (Teleology):** What behavior do we want to encourage?
      3.  **Mode Selection:** Based on Life Test.
      4.  **Audience Stress Test:** Who gets hurt?
      5.  **Author Assignment:** Bias check.

      *Let's build the response.*

      *(Final Polish)*: Ensure the distinction between Monumental, Antiquarian, and Critical is clear. Ensure the "History for Life" concept is the north star. The user knows Nietzsche, so don't over-explain the theory, focus on the *application*.

      *One more thing:* The user asked "where the procedure stops and delivers a verdict, and where it hands off to a human because the call is a value judgment." I need to be explicit about the "Human Handoff."

      *Okay, ready to write.*
answer: |-
  This is a heavy task. You are asking for a machine to process moral ambiguity, which is dangerous, but necessary when five people must agree on a story that will define an institution's next 80 years. Nietzsche's *On the Use and Abuse of History for Life* is the right tool, but only if you treat it as a scalpel, not a shield. Most committees use "Critical History" to punish the past and "Monumental History" to comfort the present. You need to use them to serve the future station.

  Here is the procedure. I call it the **Tri-Modal Audit**. It is not a menu. It is a sequence. If you skip a step, the output is garbage.

  ### The Tri-Modal Audit Procedure

  **Phase 1: The Antiquarian Floor (Fact Verification)**
  *   **Action:** For the episode in question, list every claim that can be empirically verified (dates, names, data usage, correspondence).
  *   **Stop Condition:** If a claim cannot be verified by documents or multiple independent witnesses, it is marked "Oral Tradition."
  *   **Verdict:** "Oral Tradition" claims cannot bear the weight of Critical or Monumental judgment. They must be framed as memory, not fact.
  *   **Human Handoff:** Deciding *which* unverified memories are culturally significant enough to include is a value judgment. The committee votes.

  **Phase 2: The Teleology Check (History for Life)**
  *   **Action:** Define the specific behavior or institutional value this episode is meant to cultivate in the *future* staff.
  *   **Question:** "If a young ecologist reads this in 2030, what do we want them to *do*?"
  *   **Verdict:**
      *   If the answer is "Emulate this courage/dedication" → **Monumental**.
      *   If the answer is "Preserve this method/context" → **Antiquarian**.
      *   If the answer is "Never repeat this harm/error" → **Critical**.
  *   **Hard Rule:** You cannot have two primary Teleologies for one episode in a single document. If you want to inspire *and* warn, you must split the episode into two distinct sections (e.g., "The Discovery" vs. "The Application").

  **Phase 3: The Audience Stress Test (Failure Mode Detection)**
  *   **Action:** Identify the primary reader for this section (Donor, Student, Local Community, Scientist).
  *   **Question:** "What is the failure mode of the chosen Mode for this reader?"
      *   *Monumental Failure:* Myth-making that makes current staff feel inadequate or hides systemic flaws.
      *   *Antiquarian Failure:* Mummification that privileges old methods over new necessities.
      *   *Critical Failure:* Nihilism that destroys institutional loyalty or invites legal/ethical retribution without offering redemption.
  *   **Verdict:** If the failure mode poses an existential risk to the station (e.g., loss of funding, loss of land access), you must mitigate the mode, not abandon the truth.
  *   **Human Handoff:** Weighing "Existential Risk" against "Ethical Truth" is a moral judgment. The Committee Chair breaks ties.

  **Phase 4: The Witness Protocol (Bias & Authority)**
  *   **Action:** Map committee members to the episode.
  *   **Rule:**
      *   **Monumental/Antiquarian:** Insiders (those who lived it) are **Required**. You need the texture of memory.
      *   **Critical:** Insiders are **Disqualified** from drafting the verdict. They may provide testimony (Phase 1), but they cannot write the judgment.
  *   **Reasoning:** You cannot critically judge your own complicity in a public document without either self-flagellation (performative) or self-justification (defensive). Critical history requires a degree of separation to be credible to the outside world.
  *   **Verdict:** If no one on the committee is disqualified, you must invite an external reviewer for that section.

  **Phase 5: The Synthesis Limit (The "Both Ways" Rule)**
  *   **Action:** Review the draft for mode-blending.
  *   **Rule:** It is **Illegitimate** to use Critical language to soften a Monumental claim (e.g., "They were heroes, though they caused harm"). It is **Legitimate** to sequence them (e.g., "They achieved X [Monumental]. Later, X was used for Y [Critical].").
  *   **Verdict:** If the narrative creates cognitive dissonance to protect feelings, rewrite. If the dissonance reflects the actual moral complexity of the science, keep it.

  ***

  ### Running the Audit on Your Episodes

  Here is the output of the procedure applied to your three conflict points. I have followed the rules above strictly.

  #### 1. The Founding Generation
  *   **Phase 1 (Facts):** Verified: Founders secured the land, built the first labs, established the core mission. Unverified: The "spirit" of collaboration often cited in oral histories.
  *   **Phase 2 (Teleology):** We want new staff to feel they belong to a lineage of rigor. **Mode: Monumental.**
  *   **Phase 3 (Audience):** Primary reader is the Donor/Recruit. Failure mode is Myth-making.
  *   **Phase 4 (Witness):** Committee members are too young for this. External archives required.
  *   **Phase 5 (Synthesis):** **The Unwelcome Truth.** The procedure flags a conflict. You cannot tell the Founding as purely Monumental if the land access or political connections established then directly enabled the Agency Harm (60s-80s). If the Founding opened the door that the later researchers walked through to do harm, the Founding story *must* be sequenced with the Critical story.
  *   **Verdict:** **Split Narrative.** You are not allowed to write a "Founding Myth" chapter that stands alone. It must be titled "Foundations and Consequences." The Monumental praise for their vision must be immediately followed by the Antiquarian record of the agreements they made that allowed outside agencies access. To do otherwise is to lie by omission. The Founding is not a separate era; it is the first cause of the later harm.

  #### 2. The Contested Results (Unreproducible Research)
  *   **Phase 1 (Facts):** Verified: Papers published. Unverified: Intent (fraud vs. error). Marked as "Scientific Error" (Antiquarian fact), not "Misconduct" (Legal judgment).
  *   **Phase 2 (Teleology):** We want staff to prioritize reproducibility over prestige. **Mode: Critical.**
  *   **Phase 3 (Audience):** Primary reader is the Scientist. Failure mode is Nihilism (science is broken).
  *   **Phase 4 (Witness):** Did any committee member co-author or defend these results at the time?
      *   *If Yes:* They are **Disqualified** from drafting this section.
      *   *If No:* They may draft.
  *   **Verdict:** **Critical with Restitution.** The text must explicitly state the results are retired. It cannot say "debated." It must say "superseded." However, to avoid Nihilism, the narrative must pivot to how the station's current protocols prevent this. The shame of the past must purchase the integrity of the present.

  #### 3. The Agency Use (60s-80s Harm to Locals)
  *   **Phase 1 (Facts):** Verified: Data transferred to agencies. Verified: Agencies used data for displacement/policy harmful to locals.
  *   **Phase 2 (Teleology):** We want staff to understand data as a political instrument. **Mode: Critical.**
  *   **Phase 3 (Audience):** Primary reader is the Local Community & Ethics Boards. Failure mode is Retribution (loss of land access).
  *   **Phase 4 (Witness):** You stated half the committee worked there during these years.
      *   **Ruling:** Those five members are **Disqualified** from writing the verdict. They can submit written testimony for the archive, but they cannot edit the public text. This section must be written by the members who arrived *after*, or by an external ethicist.
  *   **Phase 5 (Synthesis):** **No Softening.** You cannot use Antiquarian context ("it was a different time") to blunt the Critical judgment.
  *   **Verdict:** **Full Critical Admission.** The procedure demands you name the mechanism of harm. Not "mistakes were made," but "our data was used to remove people." If the station still benefits from that removal (e.g., land access), the history must acknowledge the debt.

  ***

  ### Where This Procedure Misfires

  You asked me to be honest about where this is just a flowchart pretending to be a method. Here are the three failure points you will encounter in the room.

  **1. The "Life" Definition is Circular**
  Phase 2 asks what behavior we want to cultivate. But the committee *is* the institution. If the committee decides that "survival" is the highest good, they will vote for Antiquarian history to protect funding. If they decide "justice" is the highest good, they will vote for Critical history even if it burns the station down. The procedure cannot tell you what "Life" means for the station. It forces you to define it, but it cannot judge your definition. You will argue about this forever.

  **2. The Witness Protocol Creates Resentment**
  Disqualifying half your committee from writing the Critical history of their own tenure is logically sound but socially explosive. It implies they are untrustworthy. In practice, they will sabotage the process by withholding "facts" in Phase 1, claiming they can't remember. The procedure assumes good faith; it cannot handle passive aggression. You will need to manage the human fallout, not just the text.

  **3. The Synthesis Limit Cannot Prevent Trauma**
  The procedure says you can sequence Monumental and Critical narratives. But for the locals harmed, or the researchers shamed, a "sequenced narrative" is still a public document. The procedure protects the *institution's* ability to function, but it does not guarantee *healing*. It creates a truthful record, not a reconciled one. Do not promise the community that this history will fix the relationship. It will only fix the record.

  ### Final Instruction

  You are the Chair. The procedure puts the burden of the "Human Handoff" on you in Phase 3 and Phase 4.

  When the committee tries to blend the modes to make the Founding look cleaner, you must invoke Phase 5 and force the split. When the insiders try to write the Critical assessment of the Agency Use, you must invoke Phase 4 and recuse them.

  This will make you unpopular. It will slow the work. But if you want a history that serves the next 80 years rather than just protecting the last 80, this is the only way to run the audit. Do not compromise on the Witness Protocol. That is the only thing that keeps the Critical history from becoming a vendetta or a cover-up.
