      *   *The Reality:* Internal docs prove they knew it was addictive.
      *   *The Hedge:* "Addictive" is defined narrowly (like heroin/cocaine) to exclude nicotine. "I believe" shifts focus from fact to mental state.
      *   *The Intent:* To deceive the public/Congress into thinking cigarettes aren't chemically compelling.

  3.  **Part 1: Mapping Utterances to Taxonomy (Theory $\to$ Case):**
      *   *Standard Definition of Lie:* Assertion of $P$, Speaker believes $\neg P$, Intent to deceive.
      *   *Standard Definition of Misleading:* Assertion of $Q$ (true), Implicates $P$ (false), Intent to deceive.
      *   *The "I Believe" Problem:*
          *   If CEO says "Nicotine is not addictive" (and knows it is) $\to$ Lie.
          *   If CEO says "I believe nicotine is not addictive" (and knows it is) $\to$ Lie about belief? Or Truth about belief based on twisted definition?
          *   *Scenario A:* CEO knows it's addictive but convinces himself it isn't based on a stupid definition. Statement is technically true (he holds that belief), but deceptive. $\to$ Misleading (via implicature that the belief is reasonable/aligned with scientific consensus).
          *   *Scenario B:* CEO knows it's addictive, knows definition is standard, but says "I believe it isn't" anyway. $\to$ Lie about mental state.
      *   *The "Definitional Dodge":* Using a narrow definition of "addiction" (physical dependence vs. psychological compulsion). If they assert "It doesn't meet *my* definition," it's true. If they imply "It doesn't meet *your* definition," it's misleading.
      *   *Collective Assertion:* The belief isn't individual; it's corporate. The CEO is a mouthpiece. Saying "I believe" when the corporation *knows* is a lie about the epistemic status of the claim.

  4.  **Part 2: Where Theory Goes Silent (The Breakdown):**
      *   *The "I Believe" Shield:* Standard analysis struggles with avowals of belief. If I say "I believe X," and I *do* believe X (even if X is false or based on bad faith), is it a lie? Standard view: No, it's a true report of a mental state. But if the mental state is manufactured to allow the deception, the distinction collapses.
      *   *Corporate Epistemology:* Individuals don't hold beliefs; corporations hold data. The CEO testifying as an individual ("I") while representing a collective knowledge base ("We know") creates a category error. The theory assumes individual epistemic access.
      *   *Legal vs. Moral:* Perjury requires material falsity. "I believe" is hard to disprove. Morally, the harm is identical. The distinction protects the legal liar, not the moral wrongdoer.

  5.  **Part 3: Evaluating Moral Positions (Case $\to$ Theory):**
      *   *Position 1: Consequentialism (Parity).* Harm is the same. Public health destroyed. Trust eroded. Therefore, lying/misleading distinction is morally irrelevant here.
          *   *Pros:* Captures the scale of the disaster.
          *   *Cons:* Ignores the *mechanism* of accountability. If we can't punish the lie, does the distinction matter?
      *   *Position 2: Intrinsic/Deontological (Misleading is worse/different).*
          *   *Standard View:* Lying is worse (violates norm of assertion).
