          4.  Moral Evaluation: Consequentialism vs. Intrinsic (Clean Hands).
          5.  The Call: Propose a Trust/Norm-based framework.

      *   *Refining the "I Believe" analysis:* This is crucial. If I say "I believe P" and I *do* believe P (because I've defined terms weirdly), standard theory says it's not a lie. But if I adopted that definition *to* deceive, is it a lie? This is "self-deception as a tool." I need to highlight that the standard theory treats belief as a black box. If the box is true, the statement is true. But if the box was rigged, the communication is rotten.
      *   *Refining the "Clean Hands" argument:* The prompt mentions the view that misleading is worse because it recruits the hearer. I should contrast this with the Tobacco case where misleading allowed *speaker* innocence (legally). Actually, the prompt asks about the view that misleading is worse because it lets the *deceiver* keep clean hands. Wait, let me re-read: "misleading is intrinsically worse because it recruits the hearer's own inference and lets the deceiver keep clean hands." Okay, so the theory says misleading is *worse*. Does the case support this? The case shows the CEOs *wanted* to keep clean hands. So the distinction *enabled* them. Does that mean misleading is worse? Or that the distinction is flawed? I should argue that the case shows the distinction is *dangerous* because it rewards the "clean hands" maneuver, regardless of whether we call it "worse."
