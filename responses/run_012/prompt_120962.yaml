          *   *Application:* The tobacco CEOs used misleading hedges to keep "clean hands" legally. This suggests the distinction *facilitates* the wrong. It doesn't suggest misleading is intrinsically worse, but that the distinction is *exploitable*.
      *   *The "Clean Hands" Critique:* The prompt asks about the view that misleading is worse because it lets the deceiver keep clean hands. In this case, the CEOs *used* the distinction to keep clean hands. This validates the critique that the distinction is a tool for evasion.

  6.  **Part 4: The "Call" (Synthesis):**
      *   The standard distinction (Lie vs. Mislead) fails here because it focuses on *syntax* and *individual mental states* rather than *communicative norms* and *institutional power*.
      *   Better Framework: **The Norm of Assertion / Trust-Based Account.**
      *   Why? Because the violation wasn't just truth-conditional; it was a violation of the *role* of the witness. They exploited the "I believe" hedge to violate the expectation of good-faith interpretation.
      *   Verdict: The distinction is legally useful but morally bankrupt in high-stakes institutional deception. We need a concept of "Bad Faith Assertion" that transcends the literal truth of the proposition.

