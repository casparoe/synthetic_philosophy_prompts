prompt: |-
  ok so I'm doing this essay for my philosophy class on fakes and forgeries, and the angle I got assigned is that whether something's a fake is about its history and not about how it looks. So I need a case that proves that point, but I dont want one that only works in the usual direction, cause then it just looks like I'm defending whatever the museum or the auction house says is real. So please build me one to spec.

  The two views I'm supposed to be contrasting (my teacher's words, roughly):

  The just-looking view. A work of art is worth whatever an attentive viewer can get out of the object itself, using their eyes and hands. If you cant tell two things apart by looking, then theyre worth the same. Nothing else counts.

  The story view. What a work is worth depends on facts about how it came to be: who made it, when, what it was made for, what it was made in response to, what happened to it afterwards. Those facts can make something priceless or worthless even if nothing you can see changes at all.

  Usually these two fight in one direction. Theres a perfect fake, the just-looking people shrug and say its just as good, the story people say its junk because the masters hand never touched it. I want the opposite direction. Build me a case where the story view is the one that ends up trashing the object everyone calls the original, so the story view ranks the copy higher than the original, while the just-looking view says the two are equal. The copy has to actually win on the story view, not just tie.

  Constraints, cause otherwise its too easy and the case just begs the question:
  - Realistic. Museum, auction house, attic, church, whatever. No magic duplicating machines, no sci-fi, nothing a normal person couldnt actually run into.
  - Both objects have to be from the same artist's own hand, and visually identical. So the story view cant do its usual trick of saying oh, the real one was made by the master and the other one wasnt. They both were. The difference has to come from something else in the two histories.
  - No money or price doing the work. Prices obviously track history, so using them would be cheating and wouldnt show anything.
  - Make up the artist and the works, dont lean on a famous real forgery.
  - The scenario itself is one paragraph. The analysis goes after it.

  Then do the checks, and dont skip any:
  - The verdict each view gives, and exactly why, step by step.
  - Which single fact in the story is doing all the work.
  - What happens to the case if you delete that fact: does it collapse back into the usual direction, or into a tie?
  - How someone who thinks the story view comes off badly would attack the case to stop it from counting.

  And I need you to commit here. Dont hand me three candidate cases and tell me to pick, and dont finish with something like it depends on what you value. Pick the case you think is best, commit to it, and if you think one of the two views actually wins this whole argument, say so and defend it. If you think the constraints I gave make the case impossible, say that straight out and still build me the closest thing that works. This matters alot to me, I have to hand it in Friday.
