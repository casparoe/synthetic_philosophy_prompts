      "Surprise that neighbours disagree despite holding identical data.",
      "Frustration when the World-Designer defeats every proposed rule.",
      "Relief when Nature confirms their intuition in the final round.",
      "Unease realising that Relief relied on an unproven gamble."
    ],
    "materials": [
      "Whiteboard and markers",
      "18 sheets of paper (one per participant)",
      "18 pens",
      "6 index cards (one per team)",
      "Timer or watch",
      "Scoreboard drawn on whiteboard"
    ],
    "room_setup": "Arrange chairs into six clusters of three to accommodate eighteen adults. Ensure each cluster has a small surface or lap space for writing. Place the whiteboard at the front where all clusters can see it. Leave space for one participant to stand near the board during Round 2.",
    "timeline": [
      {
        "phase": "Introduction and Setup",
        "minutes": 10,
        "facilitator_does": "Welcome the group, explain the goal is prediction not philosophy, divide into six teams, and distribute paper and pens.",
        "participants_do": "Sit in teams, receive materials, and listen to the premise that they will compete to predict symbols."
      },
      {
        "phase": "Round 1: The Identical Data",
        "minutes": 20,
        "facilitator_does": "Write the sequence '0 1 0 1 0 1' on the board. Ask each team to write their rule and their prediction for the next symbol privately.",
        "participants_do": "Observe the sequence, formulate a rule that fits perfectly, write down their prediction (0 or 1), and reveal simultaneously."
      },
      {
        "phase": "Round 2: The Adversarial World",
