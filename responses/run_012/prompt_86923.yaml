answer: |-
  The rain in this city does not fall so much as it hangs, a permanent suspension of grey water that slicks the glass towers of the medical district. Mara stood outside the clinic, the collar of her coat turned up against the damp, holding a data drive in her gloved hand. It was small, black, and cold, no larger than a fingernail. Her mother's estate lawyer had handed it to her an hour ago, along with the deed to the house and a box of costume jewelry.

  "Personal archive," the lawyer had said, not looking up from his tablet. "She specified you should have it before you finalized your own cycle."

  Mara's own cycle. The words felt clinical, detached from the swelling hope and terror that had occupied her chest for the last six months. She was thirty-eight. Her partner, David, was waiting in the car, engine running, heater blasting. He wanted to come up, but Mara had told him to stay. This was the inheritance she had to carry alone.

  Inside the apartment, the silence was heavy. Her mother, Helen, had died quickly—a aneurysm, the doctors said, while sleeping. There was no time for wisdom, no final lectures on lineage or fate. There was only the house, full of things Helen had touched, and the drive.

  Mara sat at the kitchen table. She plugged the drive into her terminal. The interface was outdated, clunky compared to the sleek holographic displays at the fertility clinic, but it loaded. A folder labeled *Cycle 449-B*. The year was thirty-five years ago. The technology had been experimental then, expensive, reserved for those with enough anxiety to pay for certainty.

  She put on the headset.

  The simulation resolved into a room that looked like this one, but brighter, warmer. Helen sat in the chair where Mara now sat. Helen was thirty-three, her hair darker, her face unlined by the grief that would come later. She looked tired. She rubbed her temples.

  A clinic technician's voice came from off-screen. "We have three viable candidates, Mrs. Vance. The previews are ready."

  "Three," Helen said. Her voice was higher than Mara remembered. "I thought there were two."

  "One additional developed overnight. Shall we begin?"

  Mara watched her mother nod. The air in the simulation shimmered, and the first child appeared. A boy. He was rendered at about five years old, a projection of potential growth based on genetic trajectory. He played with a block tower near Helen's knee. Helen watched him for ten minutes, asked him his name, smiled when he stumbled. She marked him *No* on her pad. "Too much like my brother," she murmured. "David would hate the noise."

  The second child appeared. A girl. She looked somewhat like Mara, but the nose was different, softer. The eyes were wider. This girl sat quietly, drawing. Helen leaned in. She touched the girl's simulated shoulder; her hand passed through the light.

  "She's calm," Helen said. "She looks... steady."

  "Candidate Two shows high markers for anxiety in adolescence," the technician noted. "Candidate Three is available."

  The air shimmered again. The third child appeared.

  Mara stopped breathing.

  It was her. Not a photograph, but a rendered presence. She saw herself at five, wearing a dress she remembered owning, holding a cup in a way she knew was hers. The simulation turned and looked at Helen. It didn't speak; the previews were behavioral models, not conversations. The child simply existed, radiating a specific, undeniable *this-ness*.

  Mara leaned forward in her kitchen chair, her heart hammering against her ribs. This was the moment. The moment of origin. She waited for her mother to look at the simulation with recognition, with the awe of destiny. She waited for Helen to say, *This one. This is my daughter.*

  Helen sighed. She looked at Candidate Two, the quiet girl with the soft nose. Then she looked at Candidate Three, Mara.

  "They're both girls," Helen said.

  "Genetically distinct," the technician corrected. "Different pairings. Different people."

  "Right." Helen rubbed her face again. She looked at the clock on the wall. "I have to pick up my other sister from the airport at four. I can't be late."

  "We have time for one more observation cycle."

  "No," Helen said. She looked at Mara—the simulation of Mara. The child was stacking cups now. One, two, three. The tower wobbled. "She dropped the cup."

  "Candidate Three?"

  "Yes. Candidate Two didn't drop anything. But..." Helen reached out. The simulation of Mara looked up. Helen's finger hovered over the *Select* button for Candidate Two. Then she moved it. She tapped Candidate Three.

  "Why?" the technician asked, recording the note.

  Helen shrugged. It was a small, tired movement. "The way she looked at me when the cup fell. Like she expected me to be angry. I didn't want her to think that."

  "That's it?"

  "It's Tuesday," Helen said. "I want the one who thinks I'm kind."

  The simulation froze. The file ended.

  Mara ripped the headset off.

  She sat in the grey light of her kitchen, the rain streaking the window. Her hands were shaking. She stood up and walked to the sink, gripping the porcelain until her knuckles turned white.

  *Different people.* The technician had said it. *Genetically distinct.*

  She had always known the mechanics of her birth. IVF was standard. But knowing the mechanics was different than watching the choice. She had spent her life feeling like a necessity. Every trait, every scar, every thought felt woven into a fabric that could only be hers. To be Mara was to be Mara. It was an identity that felt solid, like bone.

  But in the recording, she was a option. She was Candidate Three. There was a Candidate Two who drew quietly and never dropped a cup. A person who would have lived in this house, called Helen "Mom," inherited the same jewelry, stood in this same kitchen. A stranger who would have been her sister, or her replacement.

  And Helen had chosen her because of a cup. Because of a whim on a Tuesday afternoon.

  Mara felt a sudden, violent nausea. If a dropped cup determined her existence, then she was not inevitable. She was an accident. She was a coin toss that had landed heads. If it had landed tails, she would not be here. Someone else would.

  But who was the someone else? When she closed her eyes, she could see the girl with the soft nose. Was that girl a ghost? Or was that girl the real tragedy, the life extinguished so Mara could breathe?

  She wanted to scream at the recording. She wanted to shake her mother and demand to know why she hadn't felt the pull of fate. Why hadn't she known that *this* child, Mara, was the only one who could be her daughter?

  But Helen was just a woman tired from work, worried about picking up her sister. She wasn't a philosopher. She wasn't looking for essence. She was looking for a child.

  Mara showered. She scrubbed her skin until it was raw, as if she could wash away the contingency. When she looked in the mirror, the face staring back seemed fragile. The eyes, the mouth—they were just arrangements. They could have been arranged differently.

  David found her in the bedroom. He sat on the edge of the bed. "How was it?"

  "Ordinary," Mara said. Her voice sounded thin. "She chose me because I dropped a cup."

  David didn't understand. He touched her hair. "You're here. That's what matters."

  "Am I?" Mara asked. She didn't mean it cruelly, but David flinched.

  The next morning, they went to the clinic. The building was all white curves and soft lighting, designed to soothe the anxiety of creation. They sat in the consultation room. On the table lay the vials. Three embryos. Viable. Ready.

  Beside the vials lay a key. A preview key.

  The clinic counselor, a woman with kind eyes and a practiced voice, slid the key toward Mara. "As per your contract, you have the option to view the developmental projections. It helps some parents bond. It helps others decide on specific traits they wish to prioritize."

  "And if I don't use it?" Mara asked.

  "Then we select the embryo with the highest viability score. Blind selection."

  Mara looked at the key. It was identical to the one her mother had used.

  If she used it, she would see them. She would see the three people waiting in the wings. She would see the ones who would not be her child. She would see the strangers who shared her blood but not her origin. She would have to look them in the eye and reject them.

  If she didn't use it, she left it to chance. She left it to biology. She accepted that whichever one grew would be the one who was meant to be.

  But was there a difference? Her mother had looked. Her mother had chosen. And here Mara was.

  If she chose blindly, was she honoring the necessity of the child? Or was she just ignoring the reality that she was playing god with distinct souls?

  If she looked, she acknowledged that these were different people. That picking one meant erasing the others.

  Mara picked up the key. It was warm from the table.

  "Take your time," the counselor said. "The session lasts one hour per embryo."

  Mara looked at David. He was watching her, trusting her. He didn't know about the cup. He didn't know that his wife was feeling like a glitch in the matrix.

  She thought of the girl with the soft nose. The one who drew quietly. If Mara chose blindly, and the embryo implanted was the equivalent of Candidate Two, would that child be less real? Would it be a different person than the one David was expecting?

  No. The child would be itself. Just as Mara was herself.

  The problem wasn't the child. The problem was the mother. The problem was the weight of knowing that love is a choice, not a destiny. Her mother had loved her. She knew that. But her mother had loved her *instead* of someone else. That love was a gate that closed behind her.

  Mara stood up. She walked to the window. The rain was still falling, blurring the city into a watercolor of grey and steel. Thousands of people out there. Thousands of origins. Thousands of Tuesday afternoons where a decision was made over a cup, or a fee, or a whim.

  She turned back to the table.

  "I want to see them," Mara said.

  The counselor nodded, not judging. "Very well. I'll set up the suite."

  "No," Mara said. She looked at the vials. Small, sealed containers of potential. "Not here. I'll do it from home."

  She took the key. She put it in her pocket.

  They walked out into the rain. David opened the umbrella, holding it over her. They walked to the car in silence. Mara sat in the passenger seat, the key burning a hole in her coat pocket.

  She knew what she would see. She would see three children. They would all be viable. They would all be lovable. One of them would be her child. The others would be ghosts.

  She realized then that her mother's whim was not a betrayal. It was the only thing that made it real. If Helen had been compelled by fate, if she had no choice, then Mara's existence was mechanical. But because Helen could have chosen the quiet girl, because she *didn't*, Mara was loved. Not because she was inevitable, but because she was selected.

  But the cost was the others.

  Mara took the key out of her pocket. She held it between her thumb and forefinger. It was small, black, and cold.

  "Are you okay?" David asked, starting the engine.

  Mara looked at the key. She looked at the rain on the windshield. She thought about the girl with the soft nose, waiting in the data, never to be born. She thought about herself, born from a dropped cup.

  She rolled down the window. The cold air rushed in, smelling of salt and wet concrete.

  "Mara?"

  She held the key over the gutter. The water rushed past, black and fast.

  She didn't drop it. She couldn't. She needed to know. She needed to see the faces of the people she would extinguish. She needed to bear witness to the contingency of her own life, and the life of her child.

  She rolled the window up. She put the key back in her pocket.

  "Let's go home," she said.

  David put the car in drive. Mara leaned her head against the glass. She watched the city pass by. Every face in every window was a choice. Every life was a coin that had landed. She closed her eyes and saw the cup falling, tumbling through the air, waiting to hit the floor.

  She kept her hand in her pocket, holding the key, until her fingers went numb.
