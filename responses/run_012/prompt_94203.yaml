answer: |-
  # JOINT STATEMENT ON THE PROBLEM OF OLD EVIDENCE
  **Signatories:** Student A (Dynamic Bayesian), Student B (Idealized Bayesian), Student C (Likelihoodist)

  ## PART 1: SUBSTANTIVE AGREEMENTS
  *We agree on the following claims. Denial of any claim below constitutes a rejection of this joint statement.*

  1.  **The Historical Facts:** In the case of General Relativity (GR) and the perihelion of Mercury, the numerical value of the anomaly was known and accepted by the scientific community prior to Einstein's formulation of GR. In the case of the 1919 Eclipse, the data did not exist prior to the hypothesis.
  2.  **The Mathematical Constraint:** In standard probability theory, if an agent assigns $P(E) = 1$, then for any hypothesis $H$, $P(H|E) = P(H)$. Conditionalization on $E$ cannot raise the probability of $H$ if $E$ is already certain.
  3.  **The Phenomenon to be Explained:** Historically, the Mercury perihelion data *did* increase the scientific community's confidence in GR. Any adequate theory of confirmation must account for this increase in rational credence (or support) without contradicting the historical timeline.
  4.  **Logical Omniscience:** Standard Bayesian models assume agents know all logical consequences of their beliefs. In the POE cases, agents clearly did not know that $H$ entailed $E$ until after $H$ was proposed and $E$ was already known.
  5.  **The Definition of "Old":** We distinguish between (i) evidence known before the hypothesis existed, and (ii) evidence known but not previously connected to the hypothesis. We agree the Mercury case is type (i) regarding the community, and type (ii) regarding Einstein's specific derivation process.
  6.  **The Requirement for a Fix:** A solution to the POE is not successful if it requires the agent to have had access to information they historically lacked (e.g., the truth of $H$) at the time of the update. A solution is not successful if it renders the probability calculus incapable of distinguishing between rational and irrational updates in historical cases.
  7.  **Likelihood Ratios:** We agree that the Likelihood Ratio $P(E|H) / P(E|\neg H)$ is mathematically well-defined even when $P(E) = 1$. We disagree on whether this ratio alone constitutes "confirmation."

  ## PART 2: DISAGREEMENTS TABLE

  | Point in Dispute | Student A (Dynamic/Counterfactual) | Student B (Idealized/Static) | Student C (Likelihoodist) | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Locus of Confirmation** | Confirmation is a diachronic increase in rational credence ($P_{new}(H) > P_{old}(H)$). | Confirmation is a diachronic increase in rational credence governed by strict conditionalization. | Confirmation is a synchronic relation of favoring ($P(E|H) > P(E|\neg H)$), independent of credence shifts. | **Genuine.** Disagreement on the definition of the target phenomenon. |
  | **2. The Counterfactual Move** | We can model confirmation by asking what credence the agent *would* have assigned to $E$ had they not known it, or by conditionalizing on the proposition "$H$ entails $E$". | This move abandons the actual belief state of the agent. If we allow conditionalization on logical relations ($H \vdash E$), we admit the probability function was defective (not logically omniscient) to begin with. | Irrelevant. The likelihood ratio exists regardless of the agent's epistemic history or counterfactual credences. | **Genuine.** Disagreement on the admissibility of idealizing away actual belief states. |
  | **3. The "New" Information** | The genuinely new item is the discovery of the *relation* between $H$ and $E$. We conditionalize on "$H$ explains $E$". | The relation "$H$ entails $E$" is a necessary truth. Its probability is always 1. You cannot conditionalize on a tautology to gain information. | The likelihood of $E$ given $H$ is an objective relation. Whether the agent *discovers* it is psychological, not confirmational. | **Genuine.** Disagreement on whether logical relations can serve as evidence. |
  | **4. The Role of the Model** | Bayesianism is a model of scientific reasoning; it should be tweaked (e.g., via counterfactuals) to match historical rationality. | Bayesianism is a normative logic of ideal agents. If history violates the axioms, history is irrational, or the model doesn't apply. | Bayesianism (specifically Likelihoodism) describes objective support relations, not the psychology of scientists. | **Verbal/Substantive Mix.** Disagreement on the purpose of the theory (descriptive vs. normative vs. logical). |
  | **5. Ad Hoc Flexibility** | The counterfactual route is constrained by rational reconstruction; it is not "anything goes." | The counterfactual route allows the theorist to assign any prior they want to the counterfactual state, making the result unfalsifiable. | The Likelihood ratio is rigid and objective; it does not allow freedom to tweak priors. | **Genuine.** Disagreement on the constraints of the proposed solutions. |

  ***

  ## PART 3: THE CRUXES

  *These are the sub-questions where settling the matter would force at least one signatory to abandon their current position. For each, we specify a test case, the relevance, and the pre-committed predictions.*

  ### Crux 1: The Indeterminate Counterfactual
  **The Question:** Does the counterfactual solution (A) survive when the agent's hypothetical credence in $E$ (had they not known it) is intuitively indeterminate or unknowable?

  **The Case:** Consider a complex topological constraint in fluid dynamics, known empirically for 50 years ($E$). A new theory ($H$) is proposed that entails $E$ via a 200-page proof.
  *   **Test:** We ask: "What would the community's credence in $E$ have been 50 years ago if they hadn't measured it?"
  *   **Relevance:** If the answer is "There is no fact of the matter," then A's solution relies on a fiction. If B is right, this shows the counterfactual route is not a rigorous probability update.

  **Predictions:**
  *   **A:** Predicts we can construct a *rational reconstruction* of the credence based on background theories available at the time. The exact number doesn't matter, only that $P^*(E) < 1$.
  *   **B:** Predicts that any assigned number is arbitrary. Since the measurement *was* made, the counterfactual state is physically and epistemically inaccessible. The "prior" is fabricated.
  *   **C:** Predicts this is irrelevant. The likelihood ratio depends only on whether $H$ entails $E$, not on what anyone would have believed.

  ### Crux 2: Likelihood Ratios with LR = 1
  **The Question:** Does the Likelihoodist line (C) survive when old evidence has a Likelihood Ratio of 1 between rival theories, yet intuitively supports both against a null hypothesis?

  **The Case:** $E$ is a universal constant known since antiquity (e.g., the speed of light is finite). $H_1$ and $H_2$ are two competing modern physical theories. Both $H_1$ and $H_2$ entail $E$ with probability 1.
  *   **Test:** $P(E|H_1) = 1$ and $P(E|H_2) = 1$. The Likelihood Ratio $P(E|H_1) / P(E|H_2) = 1$.
  *   **Relevance:** C claims confirmation is the Likelihood Ratio. Here the ratio is 1, implying $E$ does not favor $H_1$ over $H_2$. But intuitively, $E$ confirms *both* against a theory $H_0$ that predicted infinite speed. If "confirmation" means "favoring one rival over another," C is right. If "confirmation" means "increasing belief in a hypothesis," C fails to explain why scientists feel $E$ supports $H_1$ (absolutely) even if it doesn't discriminate.

  **Predictions:**
  *   **A:** Predicts that $E$ *does* confirm $H_1$ (increases credence) via the counterfactual route (if we didn't know $E$, $H_1$ would have been riskier). C's metric misses absolute support.
  *   **B:** Agrees with A that standard Bayesianism handles absolute support via priors, but notes that if $P(E)=1$, standard conditionalization fails for both.
  *   **C:** Predicts that saying "$E$ confirms $H_1$" is sloppy language. $E$ only confirms $H_1$ *relative to $H_0$*. Relative to $H_2$, $E$ is neutral. If the scientist feels absolute support, they are confusing likelihood with posterior probability.

  ### Crux 3: The Parallel Problem (New Hypotheses)
  **The Question:** Is the "Problem of New Theories" (where do priors for $H_{new}$ come from?) the same disease as the Problem of Old Evidence?

  **The Case:** Einstein formulates GR ($H_{new}$). Before this moment, $H_{new}$ was not in the hypothesis space, so $P(H_{new}) = 0$ or undefined.
  *   **Test:** We compare the update on $H_{new}$ given old $E$ (Mercury) vs. the update on $H_{new}$ given new $E$ (Eclipse).
  *   **Relevance:** If the problem is purely about $P(E)=1$, the Eclipse case should be fine and Mercury case broken. If the problem is about *expanding the hypothesis space*, both are broken in the same way.

  **Predictions:**
  *   **A:** Predicts they are the same disease. Both require us to model a "before" state that didn't logically exist (either $E$ wasn't known, or $H$ wasn't conceived). Both require counterfactual reconstruction.
  *   **B:** Predicts they are different. New Evidence fits standard conditionalization ($P(E)<1$). New Hypotheses break the probability space axioms (partition of possibility space changes). POE is a bug in updating; New Hypotheses is a bug in the state space definition.
  *   **C:** Predicts they are irrelevant to the core logic. Likelihood ratios exist between any $H$ and $E$ regardless of when $H$ was conceived or $E$ was found. The "problem" is purely psychological.

  ### Crux 4: The Verbal Dispute Diagnosis
  **The Question:** Is the fight about whether Bayesianism models the *history* of belief or the *logic* of support?

  **The Test:** We stipulate a definition: "Confirmation Theory is the study of synchronic support relations, not diachronic belief updates."
  *   **Relevance:** If we accept this definition, B and C win (POE disappears because we stop asking about belief *changes*). A loses (because A wants to explain the historical increase in confidence).
  *   **Prediction:**
      *   **A:** Rejects the definition. A theory of confirmation that cannot explain why Einstein became more confident in GR than he was before is useless to historians and philosophers of science.
      *   **B:** Accepts the definition *for the ideal model*, but admits a separate "psychological" module is needed for actual history. The "Problem" arises only by conflating the two.
      *   **C:** Accepts the definition. Belief updates are subjective; support relations are objective. POE is a confusion of the two.

  **Diagnosis of Verbal Dispute:**
  We agree that **50% of the conflict is verbal**.
  *   **A** is using "Bayesian Confirmation" to mean "A model of rational scientific history."
  *   **B** is using "Bayesian Confirmation" to mean "The normative constraints on an idealized probability function."
  *   **C** is using "Confirmation" to mean "Objective evidential favoring."

  If we specify we are doing **History of Science**, A's counterfactuals are legitimate tools. If we are doing **Formal Epistemology**, B's objection holds (logical omniscience is required). If we are doing **Statistics**, C's Likelihood Ratio is the correct metric. The shouting stops when we specify the domain. However, a **Genuine** disagreement remains on whether Formal Epistemology *ought* to be capable of modeling History of Science without breaking its own axioms. A says yes; B says no.
