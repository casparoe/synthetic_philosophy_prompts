      *(Refining the Reversible Fusion Verdict)*: The prompt asks: "When the streams separate, what becomes of the subject...?" My requirement should force the theory to answer this without dodging. I will call this the **Fission/Fusion Truth-Condition**.

      *(Final Polish)*: Ensure the distinction between "combining subjects" and "combining qualities" is sharp. This is the classic Category Mistake in panpsychism.

      *(Commitment)*: I will argue that the desiderata are jointly satisfiable *only if* we abandon the intuition that micro-subjects are enduring substances. They must be events or processes.

      Let's write.

