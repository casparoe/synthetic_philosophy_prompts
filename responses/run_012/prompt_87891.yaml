      *   *Metaphysicians:* Need to avoid brute emergence. Need to avoid contradiction (Subject Summing Problem).
      *   *Phenomenologists:* Need to account for the "what it's like" of unity (the field of consciousness). Need to account for dissociation (split-brain).
      *   *The "Reversible Fusion" Case:* Needs to handle temporal persistence of subjects. Identity over time vs. identity of composition.
      *   *Common Pitfalls:* Confusing information integration with subject unity. Confusing a collection of experiences with a subject of experiences.

  3.  **Developing the Desiderata (Iterative Refinement):**
      *   *Req 1: The Subject/Quality Distinction.* Many theories combine qualities (red + green) but forget the *subject* (who sees red-green?).
      *   *Req 2: Phenomenal Unity vs. Functional Unity.* IIT says integrated info = consciousness. But is functional integration *phenomenal* unity? Need to distinguish them.
      *   *Req 3: The Dissociation Constraint.* If brains split, subjects split. Theory must allow for disunity as well as unity.
