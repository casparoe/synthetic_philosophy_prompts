      *   *Requirement:* **Diachronic Subject Integrity.** An account must specify the truth conditions for subject identity over time, specifically addressing fission and fusion without resorting to linguistic convention alone.

  5.  **Selecting the "Non-Negotiables" vs. "Prejudices":**
      *   *Non-Negotiable:* Phenomenal Unity (it's the data), Non-Bruteness (it's the philosophical job), Dissociation (it's the empirical fact).
