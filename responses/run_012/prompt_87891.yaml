          4.  Special Case: "Reversible Fusion" (two streams integrate then separate). Generate at least one requirement from this.
          5.  Incompatibility Check: Flag any desiderata that might be jointly unsatisfiable.
          6.  Exclusion Power: Identify the single most exclusionary requirement.
          7.  Theory Assessment: Briefly evaluate Subject-Summing, Phenomenal Bonding, Cosmopsychism, and Illusionism/Eliminativism against the list.
