  6.  **Checking for Incompatibilities:**
      *   The "Hard Problem" of Combination: If we demand Non-Bruteness + Micro-Subject Survival + Macro-Subject Reality, we might hit a contradiction (The Subject Summing Problem).
      *   *Verdict:* I suspect "Micro-Subject Survival" is the weak link. I will argue it's not non-negotiable.

  7.  **Evaluating Theories (Briefly):**
      *   *Subject-Summing:* Fails Subject/Quality distinction usually. Fails Reversible Fusion (identities get messy).
