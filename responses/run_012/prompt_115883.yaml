  The regulatory practice you describe is best reconstructed not as a application of a single moral theory, but as a **relational ethic of stewardship** that utilizes hedonistic metrics instrumentally. The law’s uniform focus on experience (pain, fear, distress) rather than life (killing) initially suggests hedonism, yet the specific boundaries of the regime reveal a deeper structure. The exclusion of wild animals indicates that the duty is not triggered by suffering *per se*, but by **human control**; the religious exemptions demonstrate that human cultural interests can outweigh animal pain in specific contexts; and the sentience thresholds mark the limit of moral patienthood capable of entering this relationship. These features are incompatible with pure hedonism, which would demand intervention in wild suffering and prohibit religious exemptions where pain is incurred. They are also incompatible with rights or preference views, which would prohibit killing or confinement regardless of pain levels. Instead, the practice presupposes that animals are **dependents** within a human sphere of use, owed a duty of care that balances their experiential welfare against their biological integrity and human interests.

  This reconstruction explains the tension regarding insensibility. If welfare were purely hedonistic, a genetically edited, pain-proof animal would be the regulatory ideal. However, veterinary standards and welfare codes mandate the capacity for natural behavior and physiological health, which require sensation. This is not a logical inconsistency within the practice, but evidence that the implicit axiology values **functional flourishing** alongside negative experience. A pain-free animal that cannot navigate its environment or regulate its body is functionally broken, violating the stewardship duty to maintain the animal as a viable specimen of its kind. The practice treats pain as the primary *indicator* of welfare failure, but not the sole *constituent* of welfare. Consequently, the "hedonistic imperative" programme—abolishing suffering via biotechnological insensibility—is quietly foreclosed by current regulation, which would view such animals as pathological rather than improved.

  If the regime were rebuilt on the hedonistic imperative, the rules would change radically: genetic analgesia would be mandated, wild animal intervention would become obligatory, and religious exemptions would likely be abolished unless painless. The resulting system would no longer be recognisable as "animal welfare law," which implies a *fare-well* or flourishing within a form of life, but would instead become "suffering management law," concerned solely with the minimization of negative qualia regardless of biological function. The current practice thus incorporates hedonism as a tool for measuring harm within a relationship of use, but it does not adopt hedonism as its foundational ontology.

