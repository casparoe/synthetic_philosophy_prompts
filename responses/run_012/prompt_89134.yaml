prompt: |-
  I'm building a problem set for a seminar on rationality and institutions, and I want a case that pries the dollar auction's structure apart from the sunk-cost story we usually tell about escalation of commitment. The point of the exercise is to find out whether you need the sunk-cost psychology to get escalation at all, or whether the structure by itself gets you there.

  Give me a matched pair of scenarios, both realistic — two firms in a bidding war over a contract, two siblings litigating over the family house, something like that — with everything held fixed except one thing: in Case A the second-highest bidder forfeits whatever they've put in, in Case B they get it back. Same prize, same two players, same information, same bid increments, one paragraph each, and nobody in either case is being dumb on purpose.

  Then do the work. Once each side has put in more than the prize is worth, what does a bidder with correct beliefs and no sunk-cost fallacy do in A, and in B — state the stopping rule explicitly and why it sits where it does? And what does the self-justification account of escalation, the one where people keep going to avoid conceding that the earlier decision was a waste, predict in each? I want to know whether the pair actually discriminates between the two explanations, and if it doesn't, say so rather than fudging it.

  Finish by naming the feature thats doing the work, what breaks if I remove it, and how someone who thinks escalation is always a bias would try to save their view against your case. Under 700 words, and keep what's settled separate from what people in the field actually fight about — dont hand me a contested reading as the consensus.
