answer: |-
  **Case A (The Trap):** Two logistics firms bid for a municipal route worth $10,000. Each bid round requires a non-refundable feasibility study costing the bid amount. The highest bidder wins the contract; both firms pay their study costs. Bids are currently $11,000 and $10,500.

  **Case B (The Standard):** Two logistics firms bid for the same route worth $10,000. Each bid round requires a refundable deposit equal to the bid amount. The highest bidder wins the contract; the loser's deposit is returned in full. Bids are currently $11,000 and $10,500.

  **Rational Analysis**
  In **Case B**, the structure isolates future payoffs from past expenditures. A rational agent maximizes expected utility based on marginal costs. Since the deposit is refundable, the cost of losing is zero. The cost of winning at $11,000 is a $1,000 loss. **Stopping Rule:** Withdraw immediately when the current bid exceeds the prize value ($10,000). Escalation here is strictly dominated.

  In **Case A**, the structure internalizes the sunk cost into the payoff matrix. The $10,500 bidder faces a certain loss of $10,500 if they stop. If they bid $11,500 and win, their net loss is only $1,500 ($11,500 cost - $10,000 prize). **Stopping Rule:** Continue bidding as long as (Next Bid − Prize Value) < (Current Losing Bid). Escalation is ex-post rational loss-minimization, even though ex-ante entry was irrational.

  **Psychological Account**
  The self-justification (sunk-cost) account predicts escalation in **both** cases. It argues agents continue to avoid the emotional pain of admitting prior resources were wasted. In Case B, this contradicts structural incentives. In Case A, it aligns with them.

  **Discrimination**
  This pair discriminates cleanly. If escalation occurs in Case B, it is evidence of bias, as the structure penalizes it. If escalation occurs in Case A, it is ambiguous; the behavior is consistent with both cold rationality and psychological bias. Therefore, Case B is the control condition necessary to isolate the psychology.

  **The Feature**
  The operative feature is the **payoff rule for the loser**. In Case A, the rules make past expenditures relevant to future net wealth (you pay regardless of winning). In Case B, they are irrelevant. If you remove the non-refundable loser-pays rule, the structural incentive for escalation vanishes.

  **The Bias Proponent's Save**
  A researcher insisting escalation is always a bias would argue that while Case A *allows* rational escalation, humans still overshoot the rational stopping rule due to loss aversion (Prospect Theory). They might claim the "rational" calculation in Case A is too cognitively demanding, so agents rely on the heuristic "don't waste what I spent," causing them to bid higher than loss-minimization requires. Alternatively, they would argue the true bias occurred at entry: no rational agent enters Case A, so any subsequent behavior is tainted by the initial error.

  **Settled vs. Contested**
  It is settled game theory that Case B escalation is strictly dominated and Case A escalation can be loss-minimizing ex-post. What remains contested in the field is whether observed human behavior in Case A exceeds the rational loss-minimization threshold, or if the "trap" alone accounts for the data without invoking psychological friction.
