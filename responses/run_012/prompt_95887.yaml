  The principle that best fits your verdicts is a strict Doctrine of Double Effect combined with Non-Combatant Immunity: Intentionally killing the innocent is always murder, whether as an end or a means. Killing combatants (those directly threatening harm) is permissible. Foreseen but unintended civilian death is permissible only as collateral damage from a legitimate military strike, provided the harm is proportionate to the military advantage.

  This principle forces you to give up the verdict that the factory raid's permissibility relies primarily on proportionality. You treat the raid as permissible, but worry that your reasoning relies on consequences. The principle dictates that the raid is permissible solely because the deaths are collateral, not intended means. Consequently, you must firmly reject the idea that the "saved lives" in Hiroshima could ever make it permissible. The verdict stands (murder), but the consequentialist concession must be discarded as morally irrelevant. You cannot hold that Hiroshima is murder *despite* saving lives; it is murder *because* it intended innocent death, making the lives saved irrelevant.

  Regarding the blockade: This is murder. Starvation is used as a means to coerce surrender. The civilians' suffering is not collateral; it is the mechanism of pressure. The government surrenders *because* the civilians starve. You must classify this with Hiroshima, not the munitions plant. Consider a further case: Shooting a hostage to stop a terrorist from detonating a bomb. This is murder. The hostage's death is the means to safety. Even if it saves more lives, the intention to kill an innocent makes it impermissible. This mirrors the Hiroshima logic: the end does not justify the intentional killing.

  On the distinction between attackers and innocents: The conscripted soldier is directly threatening harm, making him liable to defensive killing. The munitions worker sustains the threat but does not directly wield it. Your verdicts hold: shooting the soldier is not murder; using the worker's death as a means is. However, bombing the plant (Verdict 1) treats the worker's death as collateral, which is permissible. The tension you feel (Problem 1) dissolves: intention governs the *status* of the act (murder vs. war), while proportionality governs the *permissibility* of collateral damage. They are distinct but compatible considerations. The worker is innocent of direct attack but liable to collateral risk; the soldier is liable to direct attack.

  Anscombe would endorse this principle. She argued precisely that intention defines the moral act, rendering consequences irrelevant to the prohibition on murder. She opposed the consequentialist reasoning that suggests "saved lives" can cleanse an intentional killing of innocents. Your struggle with the area bomber's redescription is one she addressed: intention is found in the choice of description under which the act is willed. If the act is chosen as "killing civilians to end war," it is murder, regardless of subsequent mental disclaimers. She would commend your rejection of the area bomber's disclaimer but insist you extend that rejection to the consequentialist justification for Hiroshima.
