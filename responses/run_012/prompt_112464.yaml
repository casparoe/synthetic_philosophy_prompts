answer: |-
  **Grade: 5/10**

  **Margin Comments:**

  **(a) Standing & Hypocrisy Type**
  You correctly identify that Dana's past wrongdoing threatens her standing, and your definition of standing as a "right to hold someone to a norm" is solid. However, you've misapplied the definitions provided in the prompt. The prompt defines **synchronic** hypocrisy as blaming someone while doing the thing *at the same time*. Since Dana "stopped" stealing before catching the colleague, this is **diachronic** hypocrisy by the course's definition. This matters because diachronic hypocrisy is often treated differently than synchronic. Additionally, be careful not to conflate *standing* with *truth*. Even if Dana lacks standing, her claim that stealing is wrong is not "false"—the act is still wrong, she just isn't the right person to say it.

  **(b) Reform & Time**
  This is the strongest part of your answer. You correctly note that reform (time passed + repayment) can mitigate hypocrisy and potentially restore standing. This shows good engagement with the nuance of diachronic cases. However, there is a tension with your answer to (a): if Dana had already "stopped" in the initial scenario, why did you classify it as synchronic there? Try to keep the timeline consistent across sub-questions. The point about "general character" (taxes) is interesting, but be careful about introducing new facts not in the vignette unless you flag them as hypothetical extensions.

  **(c) Implications of Lacking Standing**
  This is the most significant conceptual error. You write that the colleague can "ignore it" and there is "nothing there... to answer." This collapses the distinction highlighted in the very first sentence of the prompt: **standing is separate from whether the conduct is genuinely wrong.** Even if Dana lacks the *authority* to blame (standing), the colleague still has independent moral (and legal) reasons to stop stealing. Lacking standing makes the *blaming act* inappropriate, not the *content* of the blame false. The colleague shouldn't listen to *Dana*, but they still have reason to stop the *conduct*.

  **Summary:**
  You have a good intuitive grasp of the concept of standing as a form of authority that can be lost and regained. However, you lost marks on (1) misreading the provided definitions of hypocrisy, (2) conflating standing with the truth/wrongness of the act, and (3) drawing the wrong conclusion about the blamee's obligations. Review the distinction between "the message is wrong" and "the messenger is compromised."
