answer: |-
  **Keynote Address**

  Thank you. Looking out at this room, I see the map of the world redrawn by choice. I stand here as someone who crossed that distance twenty-two years ago, born in Germany, now American. The organizers asked me to speak because I am a "bridge." I have always disliked that word. Bridges are static; they simply endure weight. What you are doing today is not static. It is a movement.

  You are about to take an oath. It is a specific set of words, prescribed by law, recited in unison. To the part of me that grew up German, this ritual feels like safety. There is a moral style I learned young: that order is a kind of decency. That following the rule, even when inconvenient, is how we keep faith with each other. In that view, the law is not a restriction on your freedom, but the structure that makes freedom possible. To say "I was following the rules" is not an excuse; it is a claim of reliability. Many of you know the cost when that style hardens into something cold. You may have come here because the rule became a wall instead of a floor.

  But you are becoming American. And the moral style here is different. Here, the conscience is sovereign. The good citizen is not the one who simply obeys, but the one who decides. An unjust rule is no rule at all. The burden of proof lies on the law to justify itself to you, not on you to justify yourself to the law. To the officials in this room, this sounds like risk. To the new citizens, it sounds like breath.

  I cannot tell you which is better. I live in the friction between them. If I praise order too much, I insult those who fled tyranny. If I praise conscience too much, I alarm those who uphold the law. So I will not offer you a balance. Balance implies you can rest. You cannot rest here.

  Instead, look at the oath itself. It is the point where these two styles collide and must hold. You are submitting to a rule—the Constitution, the laws—but you are doing it voluntarily. You are choosing to be bound. That is the only place where German order and American liberty actually meet. It is not a compromise; it is a paradox.

  So here is where you stand tomorrow: You are not free from the law, and you are not merely subject to it. You are its authors, because you consented to it. When you disagree with this country, do not simply disobey, and do not simply obey. Argue. Use the freedom you chose to change the rules you agreed to follow. That is the work. It is uncomfortable. It requires you to hold the tension of being both loyal and critical. Do not look for a bridge to carry you over that tension. Stand in it. That is what citizenship costs.

  ***

  **Where this leans on contested ground**

  The speech relies on a binary between "German order" and "American conscience" that cultural theorists treat cautiously. While Hofstede's cultural dimensions do rank Germany higher on "Uncertainty Avoidance" and the U.S. higher on "Individualism," treating these as moral styles risks caricature. Modern Germany has a robust culture of dissent (think *Zivilcourage*), and American legal culture is deeply rule-bound. The "burden of proof" distinction is more accurately a difference between Civil Law (codified) and Common Law (precedent-based) traditions, rather than national character.

  If you remove this binary, the speech loses its spine. To fix it, you would need to pivot from "moral styles" to "legal cultures," framing the tension as one between *security through code* versus *liberty through precedent*. This is less emotionally resonant but empirically safer. You would need to cut the lines about "decency" and "conscience" and instead speak about how different legal traditions approach the source of authority. However, for a keynote, the binary serves a poetic truth even if it fails a sociological test. Just acknowledge internally that you are using ideal types, not descriptions of every individual in the room.
