answer: |-
  **Elena:** Let's ensure we're framing this correctly. My position is reductionist: testimonial justification is not basic. For me to be justified in believing your assertion, I need independent, non-testimonial evidence that you are reliable. Testimony transmits justification; it doesn't generate it.

  **Marcus:** And mine is anti-reductionist: testimony is a basic source of justification, on par with perception. I have a *prima facie* entitlement to accept what you say simply because you said it, absent defeaters. I don't need to verify your reliability before I'm justified in believing you.

  **Elena:** Precisely. Now, consider the **Inherited Ledger**. Suppose my entire stock of evidence regarding speaker reliability—past accuracies, reputations, track records—was itself acquired via testimony. If every piece of evidence supporting testimony is itself testimonial, don't you face a vicious circle?

  **Marcus:** I do not. That's the point of the entitlement. It stops the regress. If I required non-testimonial evidence for every testimonial claim, I'd need evidence for that evidence, ad infinitum. My default entitlement allows the chain to terminate. The reductionist faces the circle; I avoid it by positing a basic right to trust.

  **Elena:** But that's too quick. The chain terminates in perception and memory, not testimony. I see you speak; I hear the sounds; I remember your past accuracy on observable matters. Those perceptual memories are non-testimonial. They ground the induction. The ledger isn't purely testimonial; it's anchored in observation.

  **Marcus:** Anchored, yes, but consider the **Unverifiable Domain**. I have observed your reliability on observable matters—where the bus stops, what color the wall is. Now you tell me about the remote past, or quantum mechanics, domains I cannot check. Does your perceptual record license an inductive leap to these uncheckable domains?

  **Elena:** It does, via a principle of uniformity. If a speaker is truthful on checkable matters, I have inductive grounds to suspect truthfulness on uncheckable ones, unless I have specific reason to think competence varies by domain.

  **Marcus:** That principle is shaky. A speaker might be honest about bus stops but dogmatic about history. Your induction requires an assumption—that reliability transfers across domains—which itself needs justification. If that justification is testimonial, we're back to the circle. If it's a priori, you're conceding my point: there's a default principle at work.

  **Elena:** It's not a priori; it's a pragmatic postulate grounded in the success of communication. But let's press harder. What about the **First Hearer**? A child, or an adult encountering testimony for the first time. They have no track record. On my view, they lack the inductive base.

  **Marcus:** Exactly. And intuitively, the child *is* justified in believing their parent. If your view implies the child is unjustified until they've gathered enough data to run an induction, your view contradicts our epistemic practices. Children know things.

  **Elena:** *(Pauses)* This is the difficult spot. If I insist on individual induction for every agent, the child is indeed unjustified. I could bite the bullet and say children have pragmatic acceptance but not epistemic justification... but that seems too harsh. They *know* their name is given by their parents.

  **Marcus:** So you must concede a default entitlement exists at the origin.

  **Elena:** I will modify my position. I concede that for the *initial* acquisition of testimonial concepts, a default entitlement is necessary. Otherwise, learning language itself is impossible. However, once the agent is mature and possesses a stock of evidence, the default is overridden. For competent adults, reduction is required. The entitlement is developmental, not permanent.

  **Marcus:** That's a significant retreat from global reductionism. You're now a local reductionist for adults, but an anti-reductionist for children. But why does the entitlement vanish upon maturity? If I'm entitled as a child because trust is necessary for learning, why am I not entitled as an adult when trust is necessary for social coordination?

  **Elena:** Because adults have the cognitive resources to monitor reliability. The entitlement is a placeholder for missing evidence. Once evidence is available, the placeholder is redeemed.

  **Marcus:** But availability doesn't mandate usage. I have the resources to check every perceptual belief against others, yet I'm justified without doing so. Why is testimony different?

  **Elena:** Because testimony involves another agency. Perception is a direct causal link; testimony is a voluntary assertion. The risk of deception is unique to testimony.

  **Marcus:** But that risk is covered by defeaters. We agree on this: if I have positive evidence you are lying, I'm unjustified in believing you.

  **Elena:** Agreed. Positive defeaters destroy justification for both of us.

  **Marcus:** And if I have no evidence either way?

  **Elena:** Then I lack justification until I verify.

  **Marcus:** And I have justification until I'm defeated. Here is where we might find common ground. We both agree that *negative* duties—avoiding belief when there are signs of falsehood—are binding. Our dispute is purely about the *positive* duty: must I actively seek reasons to trust, or is trust the baseline?

  **Elena:** Yes. That sharpens it. It's not about whether deception is possible; it's about the burden of proof. I place the burden on the speaker to prove reliability via my evidence. You place the burden on the hearer to find defeaters.

  **Marcus:** Precisely. And consider the Unverifiable Domain again. If the burden is on me to find defeaters, I can accept your claim about the remote past unless I have reason to doubt. If the burden is on you to prove reliability, you must prove you know about the remote past. But I can't check that. So, on your view, knowledge of the uncheckable is impossible for me.

  **Elena:** Not impossible. I can rely on expert consensus, which I verify through institutional reliability, which I verify through...

  **Marcus:** ...Testimony. You're relying on the Inherited Ledger again. You're trusting the institution based on what others say about the institution.

  **Elena:** *(Sighs)* I see the circle tightening. If I maintain that adults need independent evidence, and all evidence for complex facts is testimonial, I risk starving the adult agent of justification just as much as the child.

  **Marcus:** So your modification regarding the child threatens to swallow your adult requirement. If the child needs entitlement to start, and the adult needs testimony to sustain, the entitlement never truly disappears. It just becomes hidden under layers of inferred reliability.

  **Elena:** Perhaps. But there is a distinction here we haven't fully exploited. It's between *being justified in believing* and *being justified in accepting*. I might be justified in *accepting* your claim for the sake of argument, or as a hypothesis, without full belief.

  **Marcus:** That's an evidentialist move. But testimony usually yields belief, not mere acceptance. When you tell me the train leaves at five, I don't accept it hypothetically; I believe it and act.

  **Elena:** True. But if I treat testimonial belief as a distinct category—where the justification is partly constituted by the social act of assurance—maybe I can soften the reductionism. If your assertion is an *assurance*, it gives me a second-personal reason to believe that isn't merely inductive evidence.

  **Marcus:** Now you sound like an anti-reductionist. You're admitting the interpersonal structure provides justification beyond the inductive base.

  **Elena:** I'm admitting that the "evidence" isn't just track records. The act of telling itself is a reason. But I still want to say it's a reason I must assess. I must assess whether you are *offering* assurance sincerely.

  **Marcus:** And how do you assess that without a default entitlement to take your address at face value? If I must verify your sincerity before I can take your assurance as a reason, I'm back to the regress.

  **Elena:** Then perhaps we converge here: The default entitlement is real, but it is fragile. It exists, but it is easily overridden by the specific risks of agency you mentioned. I concede that there is a baseline entitlement, but I maintain that for high-stakes or unfamiliar domains, the reductionist requirement kicks in.

  **Marcus:** So you're a reductionist about high-stakes testimony and an anti-reductionist about everyday testimony?

  **Elena:** Call it a contextualist reductionism. The burden of proof shifts based on the context. In low-stakes, everyday conversation, the default holds. In high-stakes, or unverifiable domains, I require independent evidence.

  **Marcus:** That's a stable position. But note what you've given up: the claim that testimony is *essentially* non-basic. You've admitted it is basic in some contexts.

  **Elena:** And you've admitted that the entitlement is not absolute; it is context-sensitive and defeasible. We both agree that blind credulity is not justified. The disagreement is now narrowly focused on where the default line is drawn. Is the default trust, or is the default skepticism?

  **Marcus:** I say the default is trust, constrained by reason. You say the default is skepticism, constrained by available evidence.

  **Elena:** Yes. And regarding the First Hearer, I concede that without an initial entitlement, no evidence could ever be gathered. So the anti-reductionist core is necessary for the reductionist superstructure to exist.

  **Marcus:** Then the reductionist view is dependent on the anti-reductionist view. You need my foundation to build your house.

  **Elena:** But a house is not a foundation. Once built, the structure stands on its own beams. The adult agent stands on their evidence, even if that evidence was originally acquired through entitlement.

  **Marcus:** But if the beams are made of the same material as the foundation, why deny the material supports the weight? If testimony justified the child, why doesn't it justify the adult without the extra inductive labor?

  **Elena:** Because the adult knows the material can rot. The child doesn't. Awareness of fallibility changes the epistemic duty.

  **Marcus:** Then it's not the source that changed, but the agent's reflection on the source.

  **Elena:** Precisely. And that reflection requires evidence.

  **Marcus:** Or it requires only the absence of counter-evidence.

  **Elena:** We're back to the burden of proof.

  **Marcus:** We are. But we've moved from whether testimony *can* justify to *when* it requires monitoring.

  **Elena:** That's progress. I can live with a view where testimony is basic but monitored. Can you live with a view where entitlement is default but contextually sensitive?

  **Marcus:** I can. But I will still insist that the monitoring is a defeater-check, not a justification-builder.

  **Elena:** And I will insist that in critical contexts, the check is a justification-builder. We haven't solved that.

  **Marcus:** No. But we've isolated it. The disagreement isn't about the child, or the ledger, or the unverifiable. It's about the epistemic cost of maturity.

  **Elena:** Whether knowing more requires trusting less.

  **Marcus:** Or trusting differently.

  **Elena:** Let's leave it there.
