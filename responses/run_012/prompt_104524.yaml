answer: |-
  No specification of idealized preferences can simultaneously satisfy identity continuity, procedural neutrality, and normative authority, meaning any paternalistic override will either alienate the subject or rely on arbitrary philosophical stipulations.

  ### The Desiderata Specification

  1.  **Identity Continuity:** The idealized agent must be psychologically and causally continuous with the actual agent.
      *   *Reason:* If the idealization process changes core values, projects, or self-conception too radically (Case 1), the resulting preference belongs to a stranger, not the subject, rendering the paternalism alienating rather than helpful.
  2.  **Procedural Robustness:** The output preference must remain stable across reasonable variations in the idealization method (e.g., adding information vs. increasing coherence vs. therapy).
      *   *Reason:* If the "real" preference changes based on the arbitrary choice of procedure (Case 2), the theory fails to identify a fact of the matter about the subject's good, making the override an artifact of the theorist's methodology.
  3.  **Reflexive Endorsement:** The idealized agent must endorse the idealization process itself, including the authority to override the actual agent's current veto.
      *   *Reason:* If the subject rejects the idealization framework as creepy or violating (Case 3), proceeding anyway imposes an external conception of rationality, violating the autonomy the theory claims to respect.
  4.  **Normative Independence:** The theory must be able to identify a preference as "better" without defining "better" solely as "whatever results from idealization."
      *   *Reason:* If a cult member's idealized self still endorses the cult (Case 4), the theory must distinguish between a coherent error and a true good; otherwise, idealization merely amplifies existing errors rather than correcting them.
  5.  **Operational Determinacy:** The theory must yield a specific verdict within a finite timeframe suitable for decision-making.
      *   *Reason:* Paternalism requires action now; if the idealization process is infinite or indeterminate, it cannot guide real-world intervention.

  ### Analysis of Requirements

  **Non-Negotiable vs. House Rules**
  *   **Non-Negotiable:** **Identity Continuity** and **Normative Independence**. Without Identity Continuity, you are not helping *her*; without Normative Independence, you cannot distinguish between a refined preference and a refined mistake (solving the Cult/Addict case).
  *   **House Rules:** Specific definitions of **Procedural Robustness** (e.g., exactly which cognitive improvements count) and **Operational Determinacy** thresholds. Debates over whether "therapy" or "information" is the correct path are house rules; the requirement that the path shouldn't arbitrarily change the outcome is non-negotiable.

  **The Killer Requirement**
  **Procedural Robustness** kills off the most defended versions. Most CEV and idealized preference theories rely on a specific vector of improvement (e.g., "more information" or "more coherence"). In practice, adding information often reduces coherence (you learn the world is messy), and increasing coherence often requires ignoring information (simplifying values). Because these paths diverge, demanding that the "real" preference be invariant across them collapses most theories into indeterminacy.

  **The Incompatible Pair**
  You cannot have **Identity Continuity** and **Normative Independence** simultaneously in hard cases. If the subject's actual values are fundamentally mistaken (requiring Normative Independence to correct), the correction often requires changing the values so deeply that Identity Continuity is broken (Case 1). If you preserve Identity strictly, you may be forced to accept a "good" that is objectively harmful; if you enforce the Objective Good, you may create a person the subject no longer recognizes.

  ### Application to Your Four Cases

  1.  **The Identity Swap:** This violates **Identity Continuity**. If the idealized self wants a different name and values, the theory has failed to track the person's good and has instead selected a different person's good. You cannot override the actual person for the sake of a stranger.
  2.  **The Procedure Problem:** This violates **Procedural Robustness**. If therapy says X and information says Y, there is no "real" preference to find. You must admit the outcome is constructed by your choice of method, which undermines the claim that you are discovering her true will.
  3.  **The Anti-Idealization Veto:** This violates **Reflexive Endorsement**. If the theory overrides her wish not to be idealized, it proves the theory values "being idealized" over "what she wants," making the paternalism explicit rather than derived from her own volition.
  4.  **The Cult/Addict:** This violates **Normative Independence**. If the idealized self endorses the ruinous life, the idealization process failed to track the *good*, tracking only *coherence*. To justify override here, you must import an external standard of well-being, admitting that idealized preference alone is insufficient.
