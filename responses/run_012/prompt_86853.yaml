answer: |-
  **Project Title:** The Function of Defeat: A Taxonomy of Lost-Cause Myths in Collective Memory

  **1. Research Question**
  Current literature on collective memory often treats narratives of military defeat as a singular category, assuming they function primarily to process trauma or preserve identity. This project asks: **Under what conditions does a narrative of military defeat function to reconcile a population to a new political status quo, and under what conditions does it function to mobilize resistance against that status quo?**

  This question bridges the gap between meaning (what the myth signifies to the holder) and cause (what political action it enables). It moves beyond asking what the myth *says* to asking what work the myth *does*. By distinguishing between *integrative myths* (which make defeat livable within the current order) and *mobilizing myths* (which frame defeat as a debt requiring future redress), the project seeks a determinate classification system rather than a descriptive list.

  **2. Problem Statement**
  The obvious answer—that the function of the myth depends on the specific politics of the case—is insufficient because it is merely descriptive. It tells us *that* Kosovo mobilized and Dunkirk integrated, but not *why*. If the answer is simply "it depends," we cannot predict how new cases will develop or understand the mechanism linking memory to action.

  Furthermore, existing theories often conflate these types. Some scholars argue that all defeat myths are essentially consolatory, serving to heal national wounds. Others argue they are inherently revanchist, keeping grievances alive. Both positions fail to account for the variance between cases like the American Confederacy (which consolated the South while accepting Union sovereignty) and Kosovo 1389 (which sustained a claim to sovereignty centuries after the fact). A taxonomy is better than a list because it identifies the load-bearing variables—such as territorial control or the nature of the enemy—that determine which function a myth serves. Without this distinction, we risk applying the wrong analytical tools to cases that look similar on the surface but operate differently underneath.

  **3. Methodology**
  This is a conceptual paper using comparative case studies. I will not conduct archival research; instead, I will analyze established secondary narratives regarding four core cases: the Confederacy (USA), Kosovo (Serbia), Masada (Israel/Zionism), and Dunkirk (UK).

  This approach is defensible for a ten-week bursary because the objective is framework construction, not historical revisionism. The cases serve as test subjects for the conceptual framework, not as the primary object of historical inquiry. I will treat the "myth" as the unit of analysis—examining how the event is narrated in public memory rather than the military details of the event itself. Dunkirk will serve as a boundary case; since it was a retreat framed as a victory, it tests the limits of whether "defeat" is even a necessary condition for the taxonomy.

  **4. Expected Results and Falsification**
  The project aims to produce a set of criteria for sorting defeat myths. I hypothesize that the decisive variable is not the identity of the enemy, but the **relationship to the post-war state**.
  *   **Integrative Myths:** Occur when the defeated group remains within the victorious political structure (e.g., Confederates within the US, British after Dunkirk). The myth preserves dignity without challenging sovereignty.
  *   **Mobilizing Myths:** Occur when the defeated group views the post-war structure as illegitimate occupation (e.g., Serbs under Ottomans, Jews under Romans). The myth preserves a claim to future sovereignty.

  **Falsification:** The two-kind claim would be falsified if a case demonstrates simultaneous, equal-intensity integration and mobilization regarding the *same* political object. For example, if the Confederate myth is shown to be equally about accepting the Union and overthrowing it during the same period, the taxonomy collapses. Additionally, if Dunkirk (a victory narrative born of defeat) fits neatly into the "Mobilizing" category, the premise that these are "lost-cause" myths may be flawed.

  **5. Feasibility and Risks**
  Ten weeks is realistic for a conceptual paper of 4,000 words, provided I avoid the trap of deep historical diving. The primary risk is overgeneralization. National memory is messy; the Confederacy, for instance, consolated white Southerners but mobilized them against Reconstruction-era civil rights. If the cases prove too hybrid to categorize, the project will fail to produce a clean taxonomy.

  In that event, the scope will shrink: rather than a universal taxonomy, the paper will argue for the *instability* of these categories, using the confusion in the cases to demonstrate that "lost cause" is a misleading umbrella term. This is a viable fallback position that still answers the research question negatively.

  **6. Work Plan**
  *   **Weeks 1–2:** Refine the conceptual framework (Integrative vs. Mobilizing). Draft definitions.
  *   **Weeks 3–4:** Analyze Confederacy and Dunkirk cases (Secondary source review on memory narratives).
  *   **Weeks 5–6:** Analyze Kosovo and Masada cases.
  *   **Weeks 7–8:** Comparative synthesis. Test cases against the framework. Identify anomalies.
  *   **Week 9:** Drafting the paper.
  *   **Week 10:** Revision and polishing. Focus on tightening the falsification criteria.

  ***

  **Confidence Statement**
  I am moderately confident (approx. 70%) in the viability of this proposal. The distinction between integrative and mobilizing memory is theoretically sound and aligns with existing debates in memory studies without requiring new historical data.

  The point I am least sure about is the **Confederacy case**. It is the most likely to break the framework. While it appears "Integrative" (accepting the US), it was also used to mobilize resistance against federal authority for a century. If this dual-function is the norm rather than the exception, the binary taxonomy may be too rigid for the complexity of real-world politics. I am confident I can write the paper, but less confident that the "two kinds" hypothesis will survive contact with the American case without significant modification.
