prompt: |-
  Right, I'm a year 12 student and I'm meant to be doing a thing for philosophy club, so I need a hand. Put your hat on as someone who actually knows both philosophy of mind and thermal physics — like a philosopher of science who's thought about Dennett a lot — and please think carefully before you start writing; maybe brainstorm the mapping first before you commit to anything.

  What I'm stuck on is the careenium (I think it's Dennett's — I read about it in some pop-science book and can't remeber which one). The setup: a massive sphere with millions of tiny identical magnetic balls inside, called simmballs. They clump together and roll about, and the whole lot behaves like a computer running a program, so at that level there seem to be symbols and states and maybe something doing a bit of thinking. The argument is about whether the symbols at that top level push the simmballs around, or whether the simmballs just push each other and the symbols are only a handy way of talking.

  Here's what I want. I know my thermal physics pretty well — ideal gases, temperature, pressure, entropy, identical particles — and the one thing I've really absorbed is that temperature doesn't push the molecules around. The molecules shove each other, and temperature is a fact about the lot of them, and yet it's completely real and you can predict with it. So take the careenium debate and restate it faithfully in that vocabulary: molecules, identical particles, coarse-graining, macro-states, statistical averaging, fluctuations. Actually translate it — don't just say "it's like a gas" and move on, and don't quietly smuggle the physics picture in and call that a translation.

  Then give me the residue report. What carries over cleanly? What only carries over if you fudge it? And what in the careenium story has no counterpart at all in thermodynamics? My hunch is it's something about a symbol being able to be wrong, or about the pattern having been selected for rather than just falling out of the statistics — but tell me if that's rubbish and why. And at the end, which way does the residue cut: is my physics vocabulary missing something real, or is the careenium argument vaguer than it sounds? Don't fob me off with "both have a point".
