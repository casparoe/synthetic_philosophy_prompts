answer: |-
  1. It assumes that the biological emergency of starvation can be functionally separated from its political origins, treating hunger as a technical problem rather than a consequence of power. This permits intervention based on need alone, provided the political cause is temporarily rendered invisible to secure access.

  2. It genuinely rules out the view that humanitarian aid is illegitimate unless it simultaneously enforces accountability, demanding instead that life-saving precedes justice. It remains underdetermined, however, on whether the starvation stems from malice or incompetence, leaving that distinction for historians or courts to decide later.

  3. Holding both norms simultaneously is only possible through strict temporal compartmentalization, where neutrality operates during the crisis to secure access and legal accountability applies only retrospectively. Without this separation, the norms are incoherent, as aiding a population controlled by a perpetrator implicitly sustains the regime committing the crime.

  4. It presupposes that explaining the mechanisms of starvation is inherently entangled with blaming specific actors, making causal analysis too politically risky to pursue during active relief operations. Consequently, operational logic treats causal explanation as a threat to access rather than a tool for resolution.

  5. Treating every famine as political from the outset would shift the response from negotiated humanitarian access to political coercion or sanctions, likely reducing immediate aid flow while increasing pressure on the causative regime. This would prioritize justice and structural resolution over the immediate preservation of life through neutral channels.
