  6.  **Self-Correction/Nuance Check:**
      *   *Did Adorno actually compare Stalinism?* He was anti-communist but critical of capitalism. He generally focused on the Nazi specificities. I need to make sure he doesn't simply dismiss Stalinism but frames the *comparison* as the problem.
      *   *Bauman:* Bauman's *Modernity and the Holocaust* was 1989. The Historikerstreit was 1986-88. The prompt asks to distinguish Adorno's position from the thesis *later associated* with Bauman. So I can treat Bauman's view as a known quantity for the sake of the philosophical reconstruction, even if chronologically tight.
