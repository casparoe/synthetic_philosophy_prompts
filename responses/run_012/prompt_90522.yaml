          *   Normative vs. Descriptive status.

      *   *Refining Para 1, Sentence 1:* "Broadly the same" is the error. Must be *identical*.
      *   *Refining Para 1, Sentence 2:* "Knows how the other is reasoning" is too loose. Needs Common Knowledge of Posteriors.
      *   *Refining Para 1, Sentence 3:* "Pooled" implies communication. Theorem requires common knowledge of the *result*.
      *   *Refining Para 1, Sentence 4:* This is the "No Speculative Trade" implication, but applying it to politics is a leap (different priors are allowed in reality).

      *   *Refining Para 2, Sentence 1:* "Everyone knows it" is Mutual Knowledge, not Common Knowledge. This is a fatal definitional error. Also, the link between CKR and BI is not uncontested (the "Paradox").
