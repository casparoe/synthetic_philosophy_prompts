  2.  **Deconstruct the Text & Arguments:**

      *   **Thesis:** "A white horse is not a horse" (*Bai ma fei ma*).
      *   **Argument 1 (Designation/Shape-Color):**
          *   Premise 1: "Horse" designates shape (*xing*).
          *   Premise 2: "White" designates color (*se*).
          *   Premise 3: What designates color $\neq$ what designates shape.
          *   Conclusion: White horse $\neq$ horse.
          *   *Analysis:* This relies on a mereological or conceptual distinction. The compound concept "white + horse" is not identical to the simple concept "horse." It treats terms as referring to attributes rather than objects.
      *   **Objector's Objection (Existence/Entailment):**
          *   Premise: If there is a white horse, one cannot say there is no horse.
          *   Inference: Having a white horse $\rightarrow$ Having a horse.
          *   Conclusion: White horse *is* a horse.
          *   *Analysis:* This relies on class inclusion. White horses are a subset of horses. Existence of subset implies existence of superset.
      *   **Argument 2 (Seeking/Extension):**
          *   Scenario A: Seek "horse" $\rightarrow$ Yellow/Black/White accepted.
          *   Scenario B: Seek "white horse" $\rightarrow$ Yellow/Black rejected.
          *   Premise: If White Horse = Horse, the object sought would be the same.
          *   Observation: The extensions (acceptable responses) differ.
          *   Conclusion: White Horse $\neq$ Horse.
          *   *Analysis:* This relies on extensional difference. The set of things satisfying "horse" is larger than the set satisfying "white horse."

  3.  **Address the Specific Questions:**

      *   **(i) Reconstruction of Advocate's Claims:**
          *   Arg 1: Intensional/Conceptual. "Horse" refers to the form/essence of horseness. "White horse" refers to form + color. Since Form $\neq$ Form+Color, they are not identical.
          *   Arg 2: Extensional/Pragmatic. "What is sought" refers to the *satisfaction conditions* or the *extension* of the term. If $A = B$, then the set of things satisfying a request for $A$ must equal the set for $B$. They don't. Therefore $A \neq B$.
      *   **(ii) Meeting the Objector's Objection:**
          *   Objector says: $WH \subset H$ (Inclusion). Therefore $WH$ is a kind of $H$.
          *   Advocate says: $WH \neq H$ (Identity).
          *   Do they talk past each other? Yes, largely. The Objector uses "is" for class membership/predication ("is a kind of"). The Advocate uses "is" for strict identity ("is identical to").
          *   Does Arg 2 meet the objection? It challenges the idea that inclusion implies identity. It shows that while a WH *is* a horse (in the Objector's sense), the *term* "white horse" is not interchangeable with the *term* "horse." It shifts the ground from ontology (what exists) to semantics/pragmatics (how we use words).
      *   **(iii) Friend's Leibnizian Reading:**
          *   Leibniz's Law: $x = y$ iff for all properties $P$, $P(x) \leftrightarrow P(y)$. Or linguistically: Terms are interchangeable *salva veritate*.
          *   Does it unify? Yes, surprisingly well.
          *   Arg 1: "Designates shape" is a property of the term "horse." "Designates color" is a property of "white." The compound term has different properties than the simple term. Substitution fails in the context "___ designates shape."
