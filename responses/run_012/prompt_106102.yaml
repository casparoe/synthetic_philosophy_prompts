          *   Suspicion of equivocation on "is not" (*fei*).
      *   **Friend's Proposal:** A Leibnizian Identity of Indiscernibles/Substitutability reading. Both arguments test identity via substitutability. The "seeking" argument is the strong one; the "shape/color" one is a clumsy preview.
      *   **Required Output:**
