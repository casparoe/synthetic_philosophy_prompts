          *   Is Arg 1 clumsy? It's more metaphysical/semantic than logical, but it fits the substitutability model if we treat "designating shape" as a property of the *name* or *concept*.
          *   Verdict: It's a strong charitable reading that makes Gongsun Long look like a proto-analytic philosopher. It hides the shift from intension (Arg 1) to extension (Arg 2) by treating both as tests of identity conditions.
      *   **(iv) Sense of "Is Not" (*Fei*):**
          *   Must it be single? No. In Classical Chinese, *fei* is a negator of predication/identity. It's ambiguous between "is not identical to" and "is not a member of."
          *   Advocate: Uses *fei* as "is not identical to" ($\neq$).
          *   Objector: Uses *fei* (implicitly in the negation of the thesis) as "is not a kind of" ($\notin$).
          *   Can they be assigned different senses without mistake? Yes. This is the standard modern logical resolution. The dialogue is a clash of logical types (Identity vs. Inclusion). Neither is "wrong," they are arguing about different relations.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, respectful, analytical, helpful for a study group leader.
