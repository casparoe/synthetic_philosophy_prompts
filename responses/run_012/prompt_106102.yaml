      *   *Key Insight:* The core tension is Intension/Identity (Advocate) vs. Extension/Inclusion (Objector). The Leibnizian reading bridges this by focusing on *substitutability*, which applies to both intensions and extensions.

      *   *Refining Point (i):* Need to be careful about "what is sought." It's not just physical objects, it's the *criteria* for acceptance. The Advocate is arguing about the *concept* required to fulfill the request.
      *   *Refining Point (ii):* The Objector is arguing from ontology (existence of the animal). The Advocate is arguing from semantics (usage of the name). They are talking past each other, but the Advocate's second argument forces the Objector to confront semantic usage.
      *   *Refining Point (iii):* The Leibnizian reading is excellent. It treats the dialogue as a debate about the *criteria of identity* for terms. Arg 1 tests identity of *meaning* (intension). Arg 2 tests identity of *reference* (extension). Both are valid tests for term identity.
      *   *Refining Point (iv):* The "is" (*fei*) ambiguity is the crux. In modern logic, $a \in B$ does not imply $a = B$. The Objector conflates them; the Advocate distinguishes them. Gongsun Long is likely exploiting this ambiguity deliberately.

