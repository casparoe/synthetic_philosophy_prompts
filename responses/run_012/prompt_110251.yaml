prompt: |-
  I have been reading an introductory book on metaethics, and its chapter on expressivism contains the following paragraph, which I would like audited rather than supplemented. I am not a metaethicist — I work in an adjacent area — and I cannot tell which of its sentences I should trust.

  "Expressivism holds that moral judgements do not describe the world: to call an action wrong is not to state a fact about it but to express the speaker's attitude of disapproval, in something like the way that a cry of 'Boo!' expresses one. The Frege–Geach problem, sometimes called the embedding problem, is the standard objection to this view. If 'lying is wrong' merely expresses an attitude, then in the sentence 'If lying is wrong, then getting your brother to lie is wrong' the antecedent is not asserted and so expresses nothing; the conditional has no content for the expressivist to analyse, and the argument from 'Lying is wrong' and 'If lying is wrong, then getting your brother to lie is wrong' to 'Getting your brother to lie is wrong', though obviously valid, comes out invalid on expressivist terms. Since so much moral argument has this form, the view cannot account for it. The same difficulty shows up in the fact that two people who disagree about whether lying is wrong are contradicting one another, whereas two people who merely have opposed attitudes are not. The problem is named for Frege, whose observation that a sentence means what it does in virtue of its truth-conditions leaves the expressivist with nothing to say about the embedded occurrence, and for Geach, who pressed the point against the non-cognitivists of the 1960s. Expressivists have by and large conceded it, and now claim only that the inference is pragmatically acceptable rather than logically valid — that we are entitled to move from the attitudes to the conclusion even though no entailment holds. Because the point of moral reasoning is that it can be valid, the Frege–Geach problem is widely regarded as having refuted expressivism."

  What I want is an accuracy audit, not a tutorial. Taking the paragraph clause by clause, please separate what a careful expressivist would accept, what would make them wince, and what is straightforwardly wrong — beginning with the opening characterization of the view, which I have some doubt any current expressivist would own. Where a clause is a simplification, say what it simplifies and whether the simplification is harmless. In particular, I would like the several complaints the paragraph runs together kept apart: the Frege–Geach problem itself, the embedding problem, the negation problem, and the problem of explaining moral disagreement. My suspicion is that the paragraph treats as one problem what are at least two, and I want to know whether the distinction is substantive or pedantic. I also want a verdict on three specific moves: the claim that an unasserted antecedent "expresses nothing" and so leaves the conditional without content; the claim that expressivists have conceded the objection and fallen back on pragmatic acceptability; and the closing claim that the problem has refuted the view. Does that conclusion follow from whatever in the paragraph is accurate? And if the view is not refuted, what is the strongest difficulty that remains, and what would count as a solution — I have heard quasi-realism and minimalism about truth offered as the expressivist's way out, but the paragraph never mentions them, and I do not know whether they change the audit.
reasoning: |-
  Here's a thinking process that leads to the audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a specific paragraph from an introductory metaethics book regarding expressivism and the Frege-Geach problem.
      *   **Constraint:** Do *not* supplement (teach metaethics from scratch); focus on accuracy/trustworthiness of the text provided.
      *   **User Profile:** Works in an adjacent area, not a metaethicist, wants to know which sentences to trust.
      *   **Specific Requirements:**
          *   Clause-by-clause analysis (Accept, Wince, Wrong).
          *   Address the opening characterization (doubt current expressivists own it).
          *   Distinguish between specific problems run together (Frege-Geach, Embedding, Negation, Disagreement).
          *   Verdict on three specific moves: (1) Unasserted antecedent expresses nothing/no content, (2) Expressivists conceded/fallen back on pragmatics, (3) Problem refuted the view.
          *   Address the conclusion (does it follow?).
          *   Address remaining difficulties and solutions (Quasi-realism, Minimalism) even though the text omits them.

  2.  **Analyze the Source Text (Clause by Clause):**

      *   *Clause 1:* "Expressivism holds that moral judgements do not describe the world: to call an action wrong is not to state a fact about it but to express the speaker's attitude of disapproval, in something like the way that a cry of 'Boo!' expresses one."
          *   *Analysis:* Classic "Boo/Hurrah" Ayer/Stevenson era expressivism. Contemporary expressivists (Blackburn, Gibbard) reject the simple "Boo" analogy because it leads directly to Frege-Geach. They talk about "plans," "norms," or "commitments," not just emotional outbursts.
          *   *Verdict:* Simplification bordering on caricature for *current* expressivism. Accurate for *classical* non-cognitivism (1930s-50s).

      *   *Clause 2:* "The Frege–Geach problem, sometimes called the embedding problem, is the standard objection to this view."
          *   *Analysis:* Accurate. It is the standard objection. "Embedding problem" is a common synonym.
          *   *Verdict:* Accept.

      *   *Clause 3:* "If 'lying is wrong' merely expresses an attitude, then in the sentence 'If lying is wrong, then getting your brother to lie is wrong' the antecedent is not asserted and so expresses nothing;"
          *   *Analysis:* This is the core of the objection *as posed by critics*. Expressivists deny the "expresses nothing" conclusion, but the logic of the *objection* is represented accurately here.
          *   *Verdict:* Accurate representation of the *objection*, though expressivists dispute the premise.

      *   *Clause 4:* "...the conditional has no content for the expressivist to analyse, and the argument from 'Lying is wrong' and 'If lying is wrong, then getting your brother to lie is wrong' to 'Getting your brother to lie is wrong', though obviously valid, comes out invalid on expressivist terms."
          *   *Analysis:* This accurately describes the *charge*. The "no content" part is the critic's claim. The "comes out invalid" is the critic's claim.
          *   *Verdict:* Accurate representation of the *objection*.

      *   *Clause 5:* "Since so much moral argument has this form, the view cannot account for it."
          *   *Analysis:* This is the conclusion of the objection.
          *   *Verdict:* Accurate representation of the *objection*.

      *   *Clause 6:* "The same difficulty shows up in the fact that two people who disagree about whether lying is wrong are contradicting one another, whereas two people who merely have opposed attitudes are not."
          *   *Analysis:* This is the "Problem of Moral Disagreement." It is related to Frege-Geach but distinct. Frege-Geach is about logic/embedding; Disagreement is about contradiction vs. clashing attitudes. The text says "The same difficulty," implying they are identical.
          *   *Verdict:* Conflation. They are distinct (though related) problems.

      *   *Clause 7:* "The problem is named for Frege, whose observation that a sentence means what it does in virtue of its truth-conditions leaves the expressivist with nothing to say about the embedded occurrence, and for Geach, who pressed the point against the non-cognitivists of the 1960s."
          *   *Analysis:* Historically accurate enough for an intro book. Frege on assertion/context; Geach on the specific application to non-cognitivism.
          *   *Verdict:* Accept.

      *   *Clause 8:* "Expressivists have by and large conceded it, and now claim only that the inference is pragmatically acceptable rather than logically valid — that we are entitled to move from the attitudes to the conclusion even though no entailment holds."
          *   *Analysis:* **Major Red Flag.** Contemporary expressivists (Blackburn, Gibbard, Schroeder) do *not* concede logical invalidity. They argue for "logical validity" within an expressivist framework (e.g., consistency of attitudes/plans). They claim it *is* valid, not just pragmatically acceptable. This describes a retreat that didn't really happen in the way stated.
          *   *Verdict:* Straightforwardly Wrong / Outdated.

      *   *Clause 9:* "Because the point of moral reasoning is that it can be valid, the Frege–Geach problem is widely regarded as having refuted expressivism."
          *   *Analysis:* "Refuted" is too strong. It's a major hurdle, but expressivism is still a live position (Quasi-realism). "Widely regarded" is debatable; it's regarded as the *central challenge*, not a refutation.
          *   *Verdict:* Exaggerated/Wrong.

  3.  **Synthesize Specific Complaints (Frege-Geach vs. Embedding vs. Negation vs. Disagreement):**
      *   *Embedding:* The general phenomenon of moral sentences appearing in non-assertoric contexts (questions, conditionals).
      *   *Frege-Geach:* The specific logical problem that arises from embedding (validity appears lost).
      *   *Negation:* A specific subset of embedding (e.g., "It is not the case that lying is wrong"). Often treated as part of F-G.
      *   *Disagreement:* The problem that "A says X is wrong" and "B says X is not wrong" looks like a contradiction, but if it's just attitudes ("Boo X" vs "Yay X"), it's just a clash, not a logical contradiction.
      *   *Text's Treatment:* The text lumps Disagreement under "The same difficulty." This is a simplification. It's structurally similar (need for propositional content) but distinct.
      *   *Verdict:* The distinction is substantive, not pedantic. Solutions to F-G (logic) don't automatically solve Disagreement (contradiction), though they usually go hand-in-hand in quasi-realism.

  4.  **Evaluate the Three Specific Moves:**
      *   *Move 1 (Antecedent expresses nothing):* This is the *critic's* premise. Expressivists deny it. The text presents it as fact ("the antecedent... expresses nothing"). It should be framed as "The objection claims..."
      *   *Move 2 (Conceded/Pragmatics):* Wrong. Expressivists defend logical validity (e.g., Gibbard's norm-expressivism, Blackburn's quasi-realism). They don't retreat to mere pragmatics.
      *   *Move 3 (Refuted):* Wrong. Expressivism is still a dominant metaethical position.

  5.  **Address Solutions (Quasi-realism/Minimalism):**
      *   The text ignores these. They are crucial. Quasi-realism (Blackburn) aims to *earn the right* to talk of truth, facts, and validity without abandoning expressivism. Minimalism about truth (deflationism) allows expressivists to say "It is true that lying is wrong" without committing to robust moral facts.
      *   These solutions directly contradict the text's claim that expressivists conceded invalidity.

  6.  **Drafting the Audit:**
      *   *Structure:*
          1.  Executive Summary (Trust level).
          2.  Clause-by-Clause Audit (Accept, Wince, Wrong).
          3.  Distinguishing the Problems (Embedding, F-G, Disagreement).
          4.  Verdict on the Three Specific Moves.
          5.  The "Refutation" Claim & Remaining Difficulties (Quasi-realism/Minimalism).
      *   *Tone:* Professional, precise, auditing the text, not teaching the user metaethics from scratch (though explaining *why* the text is wrong requires some metaethics).
      *   *Key Insight:* The text describes 1950s Expressivism (Ayer/Stevenson) and treats the 1960s/70s objection (Geach/Searle) as a final death blow, ignoring the 1980s-present revival (Blackburn/Gibbard). It is historically frozen.

  7.  **Refining the "Wince" vs. "Wrong":**
      *   "Boo!" analogy: Wince (for contemporary view), Accept (for classical). I should clarify that distinction.
      *   "Expresses nothing": This is the *objection's* claim. The text presents it as the state of affairs. That's misleading.
      *   "Conceded... pragmatically acceptable": This is factually wrong regarding the current state of the field.
      *   "Refuted": Factually wrong regarding the current state of the field.

  8.  **Final Review against Constraints:**
      *   Did I supplement? No, I'm auditing the claims.
      *   Did I separate the complaints? Yes.
      *   Did I address the three moves? Yes.
      *   Did I address Quasi-realism/Minimalism? Yes, as context for why the audit finds the text lacking.

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure to explicitly state that the paragraph is likely outdated (pre-1990s understanding).
      *   Ensure the distinction between the *objection* and the *state of the view* is clear. The text presents the objection's premises as facts about expressivism.
      *   Be careful not to validate expressivism as *true*, but validate that the *text's description of expressivism* is inaccurate.

  10. **Final Polish:** Check tone. Ensure it sounds like an audit report. (Proceed to generate response).

  *(Self-Correction on "Negation Problem"):* The prompt asks about the "negation problem." The text doesn't explicitly mention negation, but it mentions "contradiction" in the disagreement section. I should clarify that the "Disagreement" issue is often tied to the "Negation" problem (how to express the negation of an attitude). I will ensure this distinction is clear in the "Distinguishing Complaints" section.

  *(Self-Correction on "Pragmatics"):* Some expressivists *do* use pragmatic explanations for *some* phenomena, but not for logical validity itself. The text says they claim the inference is *not* logically valid. That is the error. Blackburn/Gibbard argue it *is* valid.

  *(Final check on "Refuted"):* In philosophy, "refuted" is a strong word. Most metaethicists would say it's the "primary challenge," not a refutation. The text is hyperbolic.

  Okay, ready to write.cw
answer: |-
  ### Executive Summary

  **Trust Level:** Low to Moderate.
  **Diagnosis:** The paragraph is historically frozen. It accurately describes **classical emotivism** (1930s–1950s) and the **initial objections** raised against it (1960s–1970s). However, it presents these objections as current consensus and ignores the subsequent development of **quasi-realism** (1980s–present). Consequently, it misrepresents the current state of expressivist theory, specifically regarding logic, validity, and truth.

  You should trust the paragraph as a summary of *why expressivism was challenged*, but not as a summary of *what expressivism currently claims* or *how the debate currently stands*.

  ---

  ### Clause-by-Clause Audit

  **1. "Expressivism holds that moral judgements do not describe the world: to call an action wrong is not to state a fact about it but to express the speaker's attitude of disapproval, in something like the way that a cry of 'Boo!' expresses one."**
  *   **Verdict:** **Wince.**
  *   **Analysis:** This is accurate for *classical* non-cognitivism (Ayer, Stevenson). Contemporary expressivists (Blackburn, Gibbard, Schroeder) explicitly reject the "Boo!" model because it makes the Frege–Geach problem unsolvable. They characterize moral judgments as expressions of *plans*, *norms*, or *commitments*, which have logical structure, rather than mere emotional outbursts.
  *   **Simplification:** It simplifies the *nature* of the expressed state. This is **harmful**, not harmless, because the "Boo!" model is precisely what makes the subsequent logical problems seem fatal.

  **2. "The Frege–Geach problem, sometimes called the embedding problem, is the standard objection to this view."**
  *   **Verdict:** **Accept.**
  *   **Analysis:** This is accurate. It is the central technical objection.

  **3. "If 'lying is wrong' merely expresses an attitude, then in the sentence 'If lying is wrong, then getting your brother to lie is wrong' the antecedent is not asserted and so expresses nothing;"**
  *   **Verdict:** **Wince (Context Dependent).**
  *   **Analysis:** This accurately reports the *critic's premise*. However, the clause presents this as a fact about the sentence ("the antecedent... expresses nothing") rather than as the *objection's claim*. A contemporary expressivist would deny this; they argue the antecedent expresses a *commitment* even when unasserted.
  *   **Simplification:** It omits the expressivist response. As a statement of the *objection*, it is accurate; as a statement of *fact*, it is contested.

  **4. "...the conditional has no content for the expressivist to analyse, and the argument from 'Lying is wrong' and 'If lying is wrong, then getting your brother to lie is wrong' to 'Getting your brother to lie is wrong', though obviously valid, comes out invalid on expressivist terms."**
  *   **Verdict:** **Accept (as a report of the objection).**
  *   **Analysis:** This correctly describes the *charge* leveled by Geach and Searle. The problem is that if moral sentences lack truth-conditions, standard definitions of validity (truth-preservation) cannot apply.

  **5. "Since so much moral argument has this form, the view cannot account for it."**
  *   **Verdict:** **Accept (as a report of the objection).**
  *   **Analysis:** This follows logically from the previous clause *if* one accepts the critic's premises.

  **6. "The same difficulty shows up in the fact that two people who disagree about whether lying is wrong are contradicting one another, whereas two people who merely have opposed attitudes are not."**
  *   **Verdict:** **Wince (Conflation).**
  *   **Analysis:** This identifies the **Problem of Moral Disagreement**. While related to Frege–Geach, it is distinct. Frege–Geach concerns logic and embedding; Disagreement concerns contradiction and negation. Treating them as "the same difficulty" obscures the specific solutions required for each. (See section below on Distinguishing Complaints).

  **7. "The problem is named for Frege, whose observation that a sentence means what it does in virtue of its truth-conditions leaves the expressivist with nothing to say about the embedded occurrence, and for Geach, who pressed the point against the non-cognitivists of the 1960s."**
  *   **Verdict:** **Accept.**
  *   **Analysis:** Historically accurate. Frege distinguished sense/force; Geach applied this to show non-cognitivists could not distinguish the *sense* of "Wrong" in asserted vs. unasserted contexts.

  **8. "Expressivists have by and large conceded it, and now claim only that the inference is pragmatically acceptable rather than logically valid — that we are entitled to move from the attitudes to the conclusion even though no entailment holds."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Analysis:** This is the most dangerous sentence in the paragraph. Contemporary expressivists do **not** concede that moral arguments are logically invalid. They argue that validity can be defined in terms of *consistency of attitudes/plans* rather than truth-preservation. They claim the inference *is* valid. To say they retreated to "pragmatic acceptability" is to describe a position most rejected decades ago.

  **9. "Because the point of moral reasoning is that it can be valid, the Frege–Geach problem is widely regarded as having refuted expressivism."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Analysis:** Expressivism remains one of the two or three dominant positions in metaethics (alongside realism and error theory). It is not regarded as refuted. It is regarded as facing a *challenge* which sophisticated versions (quasi-realism) claim to meet.

  ---

  ### Distinguishing the Complaints

  Your suspicion is correct: the paragraph conflates distinct problems. The distinction is **substantive**, not pedantic, because solutions to one do not automatically solve the others.

  1.  **The Embedding Problem (General):** The observation that moral terms appear in non-assertoric contexts (questions, commands, conditionals).
      *   *Status:* A datum that any theory must explain.
  2.  **The Frege–Geach Problem (Logical):** The specific claim that because expressivists cannot assign truth-conditions to embedded sentences, they cannot explain why moral arguments are *valid*.
      *   *Status:* The core technical hurdle.
  3.  **The Negation Problem:** A subset of embedding. If "Lying is wrong" expresses Disapproval, what does "Lying is *not* wrong" express? It cannot simply be the absence of disapproval (I might have no opinion). It must be a conflicting attitude. Explaining the logical relation between a sentence and its negation is harder for expressivists than for realists.
      *   *Status:* Often treated as part of Frege–Geach, but technically distinct.
  4.  **The Problem of Moral Disagreement:** If I say "Boo Lying" and you say "Hurray Lying," we have clashing attitudes, like preferring chocolate vs. vanilla. But moral disagreement feels like a *contradiction* (one of us is mistaken), not just a clash.
      *   *Status:* Distinct from logic. A theory could solve logic (validity) but fail to explain why disagreement feels contradictory rather than merely competitive.

  **Audit Verdict:** The paragraph treats these as one "difficulty." This is a **harmful simplification**. A theory might solve the logical validity issue (Frege–Geach) but still struggle to explain the nature of contradiction (Disagreement/Negation).

  ---

  ### Verdict on Three Specific Moves

  **1. The claim that an unasserted antecedent "expresses nothing" and so leaves the conditional without content.**
  *   **Verdict:** **False (as a statement of expressivist doctrine).**
  *   **Analysis:** This is the *critic's* characterization of expressivism, not the expressivist's own view. Contemporary expressivists argue the antecedent *does* have content (it expresses a hypothetical commitment or plan). The paragraph presents the critic's straw man as the expressivist's actual position.

  **2. The claim that expressivists have conceded the objection and fallen back on pragmatic acceptability.**
  *   **Verdict:** **False.**
  *   **Analysis:** As noted in the clause-by-clause audit, this describes a retreat that did not happen in the mainstream literature. Simon Blackburn (quasi-realism) and Allan Gibbard (norm-expressivism) explicitly defend the *logical validity* of moral reasoning. They redefine validity to fit a non-truth-conditional semantics, rather than abandoning validity for pragmatics.

  **3. The closing claim that the problem has refuted the view.**
  *   **Verdict:** **False.**
  *   **Analysis:** In philosophy, a view is "refuted" when it is abandoned by its proponents or deemed untenable by consensus. Expressivism is neither. It is a live, developing research program. The paragraph reads as if it were written in 1975, before the quasi-realist response was fully developed.

  ---

  ### The "Refutation" Claim and Remaining Difficulties

  **Does the conclusion follow?**
  No. Even if the premises about the Frege–Geach problem were accurate (which they are, as an objection), the conclusion that the view is *refuted* does not follow. It follows only that the *naive* version of the view (the "Boo!" theory) is untenable.

  **What is the strongest difficulty that remains?**
  Even with modern solutions, expressivists face the **Problem of Creeping Minimalism** (or the Problem of Distinction).
  *   **The Issue:** To solve Frege–Geach, expressivists adopt "minimalist" or "deflationary" accounts of truth and facts. They say, "It is *true* that lying is wrong" just means "Lying is wrong."
  *   **The Difficulty:** If they say moral sentences are truth-apt, express moral facts, and support valid inferences, it becomes hard to distinguish their view from **Moral Realism**. If the expressivist earns the right to talk exactly like a realist, what makes them an expressivist?
  *   **Status:** This is currently considered a more pressing problem than the original Frege–Geach objection.

  **Do Quasi-Realism and Minimalism change the audit?**
  Yes, fundamentally.
  *   **Quasi-Realism (Blackburn):** This is the project of starting with expressivist premises but *earning the right* to talk as if moral judgments are truth-apt, objective, and logically valid. The paragraph ignores this entirely. If the paragraph acknowledged quasi-realism, it could not claim expressivists concede invalidity.
  *   **Minimalism about Truth:** This is the tool quasi-realists use. It holds that "is true" does not denote a robust property (correspondence to reality) but is merely a logical device for endorsement. This allows expressivists to say moral judgments are "true" without admitting they describe the world in the robust sense the paragraph denies.

  **Final Recommendation:**
  Treat this paragraph as a historical artifact. It accurately summarizes the **1960s critique of 1930s expressivism**. It does not accurately summarize **contemporary expressivism** or the **current state of the debate**. Do not rely on it for the current status of the view, the expressivist response to logic, or the consensus on whether the view is viable.
