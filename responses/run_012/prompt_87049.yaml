  There is no single established term that captures this mechanism precisely. "Groupthink" is incorrect because it describes a decision-making failure driven by social pressure, whereas you are describing a *pre-emptive cognitive narrowing* where the question ceases to exist before it can be pressured. "Echo chambers" describe information filtering, not internal processing limits. "Self-censorship" implies the thought persists but is silenced; here, the thought itself dissolves.

  The closest academic neighbors are Mary Douglas's concept of **Institutional Thinking** (institutions classify the world, making unclassified thoughts unthinkable) and Imre Lakatos's **Negative Heuristic** (a research programme protects its core assumptions from falsification). However, Douglas focuses on cultural classification rather than action-oriented unity, and Lakatos focuses on scientific methodology rather than political morality. Neither captures the specific moral tragedy you identified: that a *virtue* (the capacity to stand together) becomes the mechanism that destroys the faculty of attention.

  Weil's claim is indeed stronger than the standard sociological view. She argues this is not a corruption but an *essence*: a party is defined by its will to win, and winning requires a single vector. Any thought that complicates the vector is, by definition, counter-productive to the party's existence. Therefore, the mechanism is structural, not accidental.

  **Edges and Distinctions**
  *   **Vs. Self-Censorship:** Self-censorship is pragmatic ("I know X, but I won't say it"). This mechanism is epistemic ("X no longer occurs to me as a valid question").
  *   **Vs. Echo Chamber:** An echo chamber filters *input* (you don't hear opposing views). This mechanism filters *processing* (you hear the view, but your mind categorizes it as 'noise' or 'cost' relative to group unity).
  *   **Vs. Being Outvoted:** Being outvoted implies the question was weighed and rejected. Here, the question is never weighed; it is priced as a threat to cohesion before it reaches the scale.
  *   **Requirements:** Requires a need for a unified public stance/action. Does *not* require leaders, explicit rules, malice, or even awareness by the members.
  *   **Boundary Cases:**
      *   **Church:** Yes. Dogma creates unity; theological questions that undermine dogma become unthinkable (heresy), not just forbidden.
      *   **Company:** Yes. Mission statements create unity; strategic questions that undermine the brand identity are often not just rejected but fail to be formulated by middle management.
      *   **Research Programme:** Yes. A paradigm protects its "hard core"; anomalies are often ignored until they become overwhelming, not because of censorship, but because they don't fit the programme's tools.

  **Coinage**
  The mechanism requires a name that highlights the transformation of a virtue into a cognitive deficit.

  \answer{Solidarity-Induced Atrophy}
