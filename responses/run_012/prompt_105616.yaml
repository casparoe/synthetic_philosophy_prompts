  1. In this metaphor, the bicycle represents the macroeconomy, forward motion signifies GDP growth, and physical balance represents financial stability. The rider embodies policymakers preventing a toppling recession, while pedaling represents the capital investment and consumption required to service debt and sustain employment.
  2. The analogy holds because modern financial systems rely on future expansion to service present debts, much like a bike needs momentum to stay upright against gravitational pull. Without growth, debt burdens become unsustainable and unemployment rises, creating political instability that mirrors a loss of physical balance.
  3. It breaks down because a bicycle is a physical object governed by immutable Newtonian laws, whereas an economy is a social system governed by mutable rules regarding debt, distribution, and work. The metaphor assumes growth is a physical necessity rather than a design choice of financial structures that require compound returns to function.
  4. Degrowth advocates argue we can redesign the system to function without expansion, akin to adding a kickstand or third wheel, by prioritizing distribution over accumulation. Conversely, relying solely on carbon taxes assumes absolute decoupling of growth from resource use can happen fast enough to avoid climate collapse, which historical data questions.
  5. The conclusion that degrowth is a fantasy does not fully survive because the analogy ignores the possibility of institutional change, yet the warning that halting growth without preparation is dangerous remains valid. Ultimately, the metaphor proves stability requires momentum under current rules, but not that those rules cannot be rewritten to allow for a stable steady state.
