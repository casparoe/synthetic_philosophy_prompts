      *   *Criteria for Success:* Specific computational structure, signatures of special design (economy, precision, specificity), dissociations, cross-species comparison, outperforming null models (byproduct/plasticity).
      *   *Defense against Critics:* The charge of "just-so stories" is overstated; the standard is demanding but satisfiable.

  3.  **Brainstorming Counter-Arguments & Evidence (The "Map of Exposure"):**
