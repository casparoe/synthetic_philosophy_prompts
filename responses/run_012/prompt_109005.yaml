      *   *Modularity vs. Plasticity:* Neuroplasticity evidence. Cultural variation evidence.
      *   *Specific Cases:*
          *   *Cheater Detection (Wason Task):* Replication issues? Alternative explanations (pragmatic reasoning schemas)?
