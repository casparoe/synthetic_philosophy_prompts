  To: Bylaws and Elections Committee
  From: Chair
  Re: Recommendation for Presidential Election Reform

  Colleagues,

  Our current plurality system produces presidents lacking majority support. We must recommend a change for the spring ballot. Below I assess the theoretical landscape, evaluate the four proposals, and offer a concrete path forward.

  **The Impossibility Result**
  The Gibbard–Satterthwaite (G-S) theorem is often invoked to paralysis, but its implications are specific. It proves that no *deterministic, ordinal* voting system with three or more candidates is simultaneously strategy-proof, non-dictatorial, and surjective. It rules out perfect ranked-choice systems. It does *not* rule out cardinal systems like Approval Voting, where voters rate candidates independently rather than ranking them. Nor does it apply if we introduce randomization.

  Two nuances matter for us. First, domain restriction. G-S assumes no structure on preferences. If our members' preferences are single-peaked along a left–right axis, Black's Median Voter Theorem suggests a Condorcet winner exists and plurality becomes more stable. However, we cannot guarantee single-peakedness in a scholarly association with diverse subfields; relying on it is risky. Second, randomization. A lottery escapes G-S because the outcome is not deterministic. The sponsor of the lottery proposal is technically correct that randomization avoids manipulability, but it trades strategic voting for unpredictability, undermining the legitimacy of the office.

  Finally, the claim that "members vote sincerely anyway" is a dodge. Voting systems incentivize behavior. Plurality incentivizes strategic desertion of third parties; other systems incentivize different manipulations. We must choose the system that incentivizes the *best* sincerity, not hope for it. G-S does not settle the question, but it pushes us away from complex ranked systems unless we accept trade-offs, and it leaves Approval Voting theoretically viable as a non-ordinal alternative.

  **Evaluation of Proposals**
  1.  **Approval Voting:** Members mark all acceptable candidates. The highest total wins. *Strongest Case:* It mitigates vote-splitting without requiring ranking. It encourages consensus candidates and reduces negative campaigning, as candidates want to be everyone's second choice. It is simple to administer and count.
  2.  **Condorcet with Fallback:** Elects the candidate who beats all others pairwise. *Strongest Case:* It best respects majority rule. If a majority prefers A over B, B cannot win. It is the gold standard for reflecting the will of the majority in ranked systems.
  3.  **Plurality with Safety Valve:** The board can set aside results lacking a mandate. *Strongest Case:* It protects the association from extremist or accidental winners in low-turnout races. It provides a constitutional crisis avoidance mechanism.
  4.  **Lottery (Top Two):** Random selection between the top two finishers. *Strongest Case:* It is honest about the arbitrariness inherent in close elections under any system. It eliminates strategic voting entirely by making the vote non-decisive.

  **Recommendation**
  I recommend **Approval Voting**. It addresses the mandate problem directly (winners will likely have broad acceptance) without the complexity of Condorcet counting or the democratic deficit of the safety valve and lottery.

  **Mechanics**
  *   **Ballot Format:** List candidates with checkboxes. "Select all that apply." (Committee Policy)
  *   **Tie-Breaking:** In the event of an exact tie for the highest approval count, the winner shall be selected by random lot administered by the Committee Chair. (Committee Policy)
  *   **Write-ins:** Permitted. A write-in name must be clearly legible to count as an approval for that individual. (Bylaws)
  *   **None of the Above (NOTA):** Permitted. If NOTA receives the highest approval count, the election is void, and the Board shall appoint an interim president. (Bylaws)

  **Process and Timeline**
  The current bylaws specify "the candidate with the most votes wins" and a 40% runoff threshold. Approval Voting changes the definition of a "vote" and eliminates the need for a runoff threshold. Therefore, a **bylaws amendment** is required. Committee policy cannot override the text.
  *   **Week 1:** Committee finalizes this report.
  *   **Week 2:** Board approves placing the amendment on the spring business meeting agenda.
  *   **Week 3:** Notice of amendment circulated to membership (per bylaws notice period).
  *   **Spring Meeting:** Membership votes on amendment. If passed, immediate implementation for the election ballot distributed electronically following the meeting.

  **Strongest Objection**
  The strongest objection to Approval Voting is that it favors "lowest common denominator" candidates over visionary leaders. A polarizing reformer may have high intensity support but low broad approval, whereas a bland incumbent may be acceptable to everyone. Approval Voting risks selecting competence over transformation. However, given our recent history of presidents lacking basic majority support, securing a broad mandate is the priority. We can address leadership vision through nomination processes, not the counting rule. Furthermore, a reformer can still win if their base approves them and they are not actively disliked by the rest.

  Please review this reasoning before our meeting. I look forward to your critique.
