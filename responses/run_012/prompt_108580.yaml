answer: |-
  | Requirement | Forcing Case/Fact | Status |
  | :--- | :--- | :--- |
  | **Total Entropy Balance** | Two-box gas trapdoor; Molecular demon inside universe. | Non-negotiable |
  | **Single-Run vs. Ensemble** | One-particle engine; Fluctuation theorems. | Non-negotiable |
  | **Correlation Accounting** | Pre-correlated memory (no measurement); Initial state preparation. | Non-negotiable |
  | **Physicality of Demon** | Demon made of molecules; Must obey same physics as gas. | Non-negotiable |
  | **Memoryless Mechanism** | Ratchet and pawl; No internal state storage. | Non-negotiable |
  | **Infinite Memory Handling** | Demon that never erases; Accumulating records forever. | Non-negotiable |
  | **Reversible vs. Irreversible** | Distinction between logical copying and thermodynamic reset. | Camp-specific |
  | **Localization of Cost** | Whether cost lives in measurement, erasure, or correlation creation. | Camp-specific |

  **Conflicting Requirements**
  The pair **"Second Law holds for every single trajectory"** and **"Demon is an ordinary physical system"** cannot both be met. If the demon is physical, it is subject to thermal fluctuations. Fluctuations allow temporary, local violations of the Second Law (e.g., heat flowing from cold to hot in a single run). Insisting on strict trajectory compliance denies the demon's physicality.

  **Verdict:** Give up "Second Law holds for every single trajectory." The Second Law is statistical, holding only on average or with overwhelming probability. A solution that forbids single-run violations effectively posits a supernatural demon immune to noise, which begs the question. The bill must be paid in the ensemble average or via generalized entropy bounds, not by forbidding lucky runs.

  **The Killer Requirement**
  **Requirement:** "Account for the thermodynamic cost of establishing initial system-demon correlations, regardless of subsequent measurement or erasure."

  *   **Kills Measurement-Cost Accounts:** Measurement can be thermodynamically reversible if the device is already correlated; charging this step double-counts.
  *   **Kills Erasure-Only Accounts:** If the demon never resets but accumulates correlations, the cost must lie in the initial correlation creation, not the final reset.
  *   **Kills "Free Lunch" Accounts:** Pre-correlated states are low-entropy resources; extracting work from them consumes the correlation entropy, preserving the Second Law.

  This requirement forces the accounting backward to the preparation of the joint state. It reveals that the "demon" is merely a conduit for converting existing mutual information into work. The Second Law is saved not by blocking the engine, but by recognizing that the fuel is the correlation itself, which is expensive to produce. Any account that locates the cost solely in the operational phase (measurement or reset) without addressing the joint history fails this test.
