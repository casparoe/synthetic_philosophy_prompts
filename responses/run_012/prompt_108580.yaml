prompt: |-
  I want the spec for what an actual solution to Maxwell's demon has to do, before I read any more takes on it. Not a survey of who said what — the requirements list. What does any account that claims to have exorcised the demon have to deliver?

  Give it to me as a table: the requirement, the case or fact that forces it, and whether it's non-negotiable or just something one camp wants. Requirements like: it has to handle the plain two-box gas with a trapdoor; the one-particle engine where the demon's whole memory is a single bit; the version where the demon is itself made of molecules and has to sit inside the same universe it's sorting; the ratchet and pawl, which has no memory at all; and the demon that never erases, just keeps every record forever. It has to respect the difference between the entropy of the gas and the entropy of the demon's records, between one run and an ensemble, between reversible bookkeeping and irreversible erasure, and between "the demon can't win at all" and "the demon wins on a lucky single run but not on average."

  Heres the case I actually care about and cant find a clean treatment of: a demon that never measures anything, because its memory starts out already correlated with the gas. Somebody hands it a box whose microstate is already written on its tape, for free. It still extracts work. Is that a demon? Does it break the second law, or is the bill just hiding in the correlation? I want a requirement that says what any account has to do with a case like that, not just with the measure-then-erase story. I'll be using this to sort good takes from bad ones in a reading group, so make it do work.

  Then flag any pair of requirements you think can't both be met. My guess is there's one hiding in the accounting of where the entropy cost actually lives, and maybe another between "the demon is an ordinary physical system" and "the second law has no exceptions" — if so, say which side you'd give up and why. And tell me which single requirement does the most to kill off the popular accounts, one line each. No names, no citations, no history. Under 800 words.
