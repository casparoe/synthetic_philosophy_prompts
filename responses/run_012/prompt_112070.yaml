answer: |-
  The normativity of assertion is a central problem in contemporary epistemology. When we assert a proposition $p$, we subject ourselves to evaluative standards; if we assert improperly, we are open to criticism. The standard candidates for this norm include the Truth Norm (assert only what is true), the Belief Norm (assert only what you believe), the Justified Belief Norm, and the dominant Knowledge Norm (assert only what you know). However, my instructor's proposal of a "Warrant-Transfer Norm" (WTN) offers a compelling alternative. The WTN holds that an assertion is appropriate just in case the speaker possesses a warrant for $p$ that could be transferred to an epistemically conscientious hearer through testimony. While the Knowledge Norm (KN) has been the standard bearer since Williamson, I argue that the Warrant-Transfer Norm is superior. It captures the essential social function of assertion—namely, the generation of knowledge in others—whereas the KN focuses too narrowly on the speaker's internal epistemic state.

  To see why WTN is preferable, we must first recognize the deficiencies of its rivals. The Truth and Belief Norms are clearly too weak. One can assert a true proposition based on a lucky guess, or assert something one sincerely believes but is wildly unjustified in believing. In both cases, the assertion seems epistemically improper. The Justified Belief Norm improves on this but permits assertions of false propositions provided the speaker has good evidence. While some argue this is acceptable, it fails to explain why we retract assertions upon learning they are false, even if our justification remains intact.

  The Knowledge Norm avoids these pitfalls by tethering assertion to factivity and justification. However, the KN faces challenges in cases where knowledge exists without transferable warrant. Consider the case of expert intuition. A chess grandmaster may know the best move intuitively but lack the articulable warrant to transfer that knowledge to a novice during the game. The KN permits the assertion ("Move the knight"), as the expert knows. The WTN, however, requires that the warrant *could* be transferred to a conscientious hearer. If the warrant is purely tacit and inarticulable, the WTN forbids the assertion. This might seem like a disadvantage for WTN, but it is actually a strength. Assertion is a speech act embedded in a social practice of giving and asking for reasons. If a speaker cannot, even in principle, provide the warrant that would justify a hearer's belief, the assertion functions merely as a command to believe, rather than an invitation to share in knowledge. The WTN respects the hearer's epistemic autonomy in a way the KN does not.

  Furthermore, the WTN handles cases of testimony-based knowledge more gracefully than the KN. If I assert $p$ based on your prior testimony, I may know $p$, but my warrant is dependent on yours. Under the KN, I am cleared to assert. Under the WTN, I must possess a warrant I can transfer. If I simply say "I know it," without access to the original evidence, I may fail the WTN. This aligns with our intuitive practice of challenging assertions by asking, "How do you know?" If the speaker cannot answer, the assertion is defective, even if they happen to know the proposition. The WTN explains this defectiveness: the speaker cannot fulfill the constitutive aim of assertion, which is to improve the hearer's epistemic situation.

  Critics of the WTN will object that it is too demanding, particularly in low-stakes or urgent contexts. Consider a emergency scenario: a doctor sees a patient having a rare allergic reaction. She knows the diagnosis based on pattern recognition but lacks the time to articulate the full warrant to the nurses. The KN permits her to assert "Administer epinephrine!" immediately. The WTN似乎 might forbid this if the warrant cannot be transferred in that moment. This objection threatens to render the WTN impractical.

  However, this objection conflates the *norm of assertion* with *pragmatic overrides*. The WTN specifies the conditions for epistemically appropriate assertion, not necessarily all-things-considered appropriate action. In emergencies, the norm of assertion may be temporarily suspended by the higher norm of preserving life. Moreover, the WTN definition specifies that the warrant must be transferable to an *epistemically conscientious hearer*, not necessarily the specific hearer in the specific context. The doctor's warrant is transferable to a competent medical professional in principle, even if time constraints prevent the transfer in practice. Thus, the WTN remains satisfied because the warrant exists and is shareable within the relevant community of practice.

  Another divergence case involves mathematical conjectures. Suppose a mathematician asserts a conjecture is true based on strong heuristic evidence, though no proof exists. The proposition is true, but unproven. The KN forbids assertion because the mathematician does not strictly *know* (lacking proof). The WTN also forbids assertion because there is no conclusive warrant to transfer that would justify the hearer in believing the proposition as true rather than probable. Here, the norms align. However, consider a case of "isolated knowledge," such as a reliable clairvoyant who knows a fact but has no reason to trust their power. The KN permits assertion (assuming reliability grants knowledge). The WTN forbids it, as the speaker cannot transfer a warrant that would make the hearer epistemically conscientious in believing. The WTN verdict is superior here; we should not assert based on faculties we cannot vouch for, as doing so pollutes the communal pool of information.

  In conclusion, while the Knowledge Norm correctly identifies that assertion requires a strong epistemic position, it mistakes the speaker's state for the act's purpose. The Warrant-Transfer Norm correctly identifies that assertion is fundamentally a communicative act designed to spread justification, not just true belief. It explains the propriety of challenges, respects the hearer's epistemic agency, and filters out assertions based on inarticulate or private reliability that cannot sustain communal inquiry. Therefore, the Warrant-Transfer Norm offers a more robust account of the normativity of assertion.

