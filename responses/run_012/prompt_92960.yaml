answer: |-
  1. "What it presupposes"
  The practice presupposes a form of textual essentialism: it treats "AI-ness" as a reified substance inherent to the document, measurable like radiation or sugar content, rather than a historical fact about how the document was produced. By assigning a continuous score with moral thresholds, the system commits to the ontology that a text carries the fingerprint of its genesis within its syntax, implying a stable, detectable boundary between "human" and "machine" styles. This requires believing that human writing has a consistent phenomenological signature distinct from algorithmic prediction, despite the software's own epistemological disclaimer. Consequently, the disclaimer functions not as a genuine guide to interpretation but as liability shielding; it allows the institution to act *as if* the score is truth for administrative purposes while retaining the plausible deniability to say it isn't proof when challenged. The system assumes authorship is a binary property of the product (who generated the tokens) rather than a responsibility held by the agent (who stands behind the ideas).

  2. "What it rules out"
  This apparatus cannot accommodate the view that large language models are merely "stochastic parrots" lacking internal states, because if they are simply mirroring human statistical patterns without understanding, there is no ontological difference in the output to detect—only a mimicry too perfect to flag. Conversely, it rules out the view that models *do* understand, because if machine cognition is functionally equivalent to human cognition, the distinction required for "misconduct" collapses into prejudice against the substrate of the mind. It also excludes nuanced theories of authorship where writing is inherently collaborative or assisted (by editors, peers, or tools), forcing a false dichotomy between "sole human author" and "cheater." By penalizing the product based on a probability score, the practice rules out the possibility that a student could use AI heavily for scaffolding or grammar while retaining full intellectual ownership of the argument, treating all AI involvement as a linear degradation of academic integrity rather than a qualitative shift in process.

  3. "Where it's underdetermined"
  The score itself is radically underdetermined regarding the *locus* of AI involvement. A 70% score is compatible with multiple contradictory realities: the student generated the whole essay, the student wrote the essay and used AI to polish every sentence, or the student has a writing style that statistically resembles the model's training data. No theory of detection can distinguish between these scenarios based on the text alone, yet the thresholds treat them as morally equivalent. Furthermore, the specific numerical thresholds (20 and 60) are arbitrary; no philosophical or statistical theory licenses the claim that 20% AI involvement warrants a conversation while 19% does not.

  4. "What would have to change"
  If we replaced the presupposed view with the idea that authorship is about stewardship of ideas rather than generation of tokens, the practice would shift from product scanning to process verification. Instead of a threshold-based scanner, the department would require an audit trail of creation: annotated bibliographies, draft histories, or oral defenses where students explain their reasoning independent of the text. The focus would move from detecting "AI-ness" in the syntax to verifying understanding in the student. Misconduct would not be defined by a percentage of machine-generated text, but by the student's inability to account for the claims made in their name. This would treat AI as a disclosed tool within a collaborative workflow, requiring transparency rather than demanding an impossible purity of human origin.
