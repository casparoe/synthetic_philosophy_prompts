          1.  "What it presupposes" (about a paragraph, implicit theory).
          2.  "What it rules out" (about a paragraph, rival views).
          3.  "Where it's underdetermined" (short, parts licensed by multiple theories).
          4.  "What would have to change" (about a paragraph, alternative view implementation).

  2.  **Deconstruct the Philosophical Issues:**
      *   **Ontology of Text:** The system treats "AI-ness" as a quantifiable property inherent *in the text* (like radiation levels), rather than a historical fact about *how the text was made*. This is a category error.
      *   **Epistemology of Detection:** It assumes there is a detectable signature ("fingerprint") distinguishing human from machine output. This conflicts with the "stochastic parrot" view (if it's just prediction, it mimics human statistical patterns) and the "strong AI" view (if it understands, the output is functionally identical to human understanding).
      *   **Ethics/Agency:** The thresholds imply a binary or graded moral culpability based on a number. It assumes authorship is all-or-nothing (or at least linearly scalable) rather than collaborative or distributed.
      *   **Institutional Logic:** The disclaimer vs. practice gap suggests the disclaimer is legalistic (liability shielding) rather than epistemological (truth-seeking). The practice assumes the number *means* something actionable despite the disclaimer saying it doesn't.

  3.  **Drafting Section 1: "What it presupposes"**
      *   *Goal:* Explain the implicit theory.
