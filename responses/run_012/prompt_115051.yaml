answer: |-
  ### The Exploitability Audit Procedure

  **Purpose:** To determine whether a new feature or observed customer behavior pattern constitutes a "money pump" (a cycle that extracts value from the customer through inconsistency or friction) versus a legitimate service offering.

  **Preconditions:** Before starting, you must have: (1) The fee schedule applicable to the feature, (2) A log of at least one complete cycle of customer behavior (or a simulated path), and (3) The exact wording of any warnings or lock-in options presented to the customer.

  **The Procedure:**

  **Step 1: The Loop Test**
  Ask: "Does the customer return to a previous state (financially or positionally) after a series of actions?"
  *   **Sufficient Answer:** A clear "Yes" (e.g., Fund A → Fund B → Fund A) or "No" (linear progression).
  *   **If No:** The feature ships. There is no loop to exploit.
  *   **If Yes:** Continue to Step 2.
  *   **Judgment Call:** No. This is a factual check of transaction logs.

  **Step 2: The Net Cost Test**
  Ask: "Is the customer financially worse off after completing the loop than if they had stayed still, excluding market movement?"
  *   **Sufficient Answer:** A calculation showing net fees, spreads, or tax penalties paid > 0.
  *   **If No:** The feature ships. The loop is costless (or profitable) for the customer.
  *   **If Yes:** Continue to Step 3.
  *   **Judgment Call:** No. This is arithmetic.

  **Step 3: The Revenue Link Test**
  Ask: "Does the firm earn revenue specifically from the *transitions* (fees, spreads, rebates) rather than the *holding* of assets?"
  *   **Sufficient Answer:** Confirmation that revenue increases with turnover.
  *   **If No:** Continue to Step 4. (The cost is likely market friction, not firm extraction).
  *   **If Yes:** **Hand to Human.** This indicates a conflict of interest. The firm profits from the customer's churn.
  *   **Judgment Call:** **Yes.** Determining "specifically from transitions" vs "general service fee" can be muddy.

  **Step 4: The Preference Stability Test**
  Ask: "Does the customer express regret after the loop, or state contradictory preferences (e.g., 'I want A' then later 'I want B' then 'I want A again') without new information?"
  *   **Sufficient Answer:** Customer support tickets, survey data, or behavioral patterns showing regret vs. statements of enjoyment/hobbyism.
  *   **If No (They enjoy it):** The feature ships. This is a service, not a trap.
  *   **If Yes (They regret it):** Continue to Step 5.
  *   **Judgment Call:** **Yes.** Distinguishing "regret" from "learning costs" is subjective.

  **Step 5: The Escape Hatch Test**
  Ask: "Is there a visible, easy-to-use commitment device (lock-in) or warning that clearly explains the cost of the loop *before* the first switch?"
  *   **Sufficient Answer:** A UI element that is not buried, with clear language on cumulative costs.
  *   **If Yes:** The feature ships (with monitoring). The customer was forewarned and equipped to stop.
  *   **If No:** **Hand to Human.** This is a values decision. Do we block a feature because customers *might* not use the safety brake, or do we ship and accept the risk?
  *   **Judgment Call:** **Yes.** Defining "visible" and "easy-to-use" is design subjectivity.

  **Step 6: The Friction Test**
  Ask: "Does the feature artificially remove friction (e.g., free undo, instant settlement) that would normally prevent the loop?"
  *   **Sufficient Answer:** Comparison to industry standard settlement times or reversal costs.
  *   **If No:** The feature ships. The loop is natural.
  *   **If Yes:** **Stop Block.** If the only reason the loop is viable is because we removed the natural brake, we are engineering the pump.
  *   **Judgment Call:** **Yes.** Determining "artificial" vs "innovation" is strategic.

  ***

