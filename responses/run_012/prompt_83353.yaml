answer: |-
  The dispute centers on the metaphysics of shared agency. **Individualists** (e.g., Bratman) argue that "we-intentions" are reducible to interlocking "I-intentions" plus common knowledge; the "we" is a shorthand for a specific psychological structure among individuals. **Collectivists** (e.g., Gilbert, Searle) argue that shared intention is primitive or involves a joint commitment that creates a plural subject, generating normative obligations (like the right to rebuke) that individual intentions cannot ground.

  Three diagnoses compete. First, your **different-questions** hypothesis: Individualists offer a causal-psychological explanation of coordination, while Collectivists offer a normative-conceptual account of what constitutes a plural agent. Second, a **verbal** diagnosis: each side stipulates a different definition of "intention" or "shared" and argues past the other. Third, a **substantive** diagnosis: the dispute is either about **explanation** (can social facts be reduced to individual psychology?) or **norms** (does joint action necessarily entail obligation?).

  Consider the case of the **two strangers pushing the stalled car**. They start independently, adjust force continuously, and afterwards sincerely say, "we pushed it out."

  The **Individualist** sees this as a victory. They argue: "No prior agreement was needed. Each had an individual intention ('I push to move the car'), perceived the other's action, and adjusted subplans in real-time. The 'we' is simply the successful meshing of these I-intentions under common knowledge." Their focus is on the *mechanism* of coordination: how did the car move given two separate minds?

  The **Collectivist** sees a problem. They ask: "Did a joint commitment form? If one stranger suddenly stopped without warning, would the other be entitled to feel betrayed or rebuke them?" If the answer is no (as likely with strangers), the Collectivist may deny this was truly "joint action" in the robust sense, despite the "we" locution. If the answer is yes, they must explain how a binding obligation arose without explicit agreement. Their focus is on the *status* of the agents: what makes this action *ours* rather than just *yours and mine* happening simultaneously?

  This case reveals that the Individualist is answering "How is behavioral coordination psychologically possible?" while the Collectivist is answering "What normative conditions constitute a plural subject?" The Individualist explains the *causal genesis* of the pushing; the Collectivist analyzes the *conceptual conditions* for the attribution of "we." They agree on the facts (the car moved, both pushed, both say "we"), but they are building different maps: one of cognitive mechanics, the other of social ontology. The impasse persists because each side claims their map is the only true territory of "intention."

  I commit to the **different-questions** diagnosis. Progress would not look like one side defeating the other, but rather a theoretical division of labor: acknowledging "coordinated individual action" (psychological) and "normatively bound joint action" (ontological) as distinct but compatible layers. We would stop asking "Which one is real?" and start asking "Which layer is relevant for this specific philosophical problem?" If philosophers explicitly distinguished *psychological shared intention* from *normative joint commitment*, the demand for reduction would vanish, dissolving the conflict.

  \answer{different-questions — The individualist explains the causal mechanism of coordination while the collectivist defines the normative status of plural agency, so they conflict only when conflating mechanism with constitution.}
