  2.  **Deconstruct the Sleeping Beauty Problem:**
      *   **Setup:** Coin flip (Heads/Tails). Heads -> Wake Monday, sleep till Wednesday. Tails -> Wake Monday, memory wipe, Wake Tuesday, sleep till Wednesday.
      *   **Question:** Upon awakening, what is your credence that the coin landed Heads?
      *   **Halfer Position:** P(Heads) = 1/2. (Prior was 1/2, no *new* relevant information gained upon waking).
      *   **Thirder Position:** P(Heads) = 1/3. (Three possible awakening states: H-Mon, T-Mon, T-Tue. Only one is Heads).
