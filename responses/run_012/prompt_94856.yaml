prompt: |-
  I'm a software engineer with no background in philosophy, and I've been reading Aquinas's Summa Theologiae on my own. I'm stuck on the reply to the third objection in the article on whether sedition is always a mortal sin (II-II, q. 42, a. 2). The objection had argued that since it is praiseworthy to deliver a multitude from a tyrannical ruler, and that can hardly be done without dissension among the people, sedition cannot always be a mortal sin. Here is the reply:

  "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states (Polit. iii, 5; Ethic. viii, 10). Consequently there is no sedition in disturbing a government of this kind, unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government. Indeed it is the tyrant rather that is guilty of sedition, since he encourages discord and sedition among his subjects, that he may lord over them more securely; for this is tyranny, being conducive to the private good of the ruler, and to the injury of the multitude."

  What I expected was something like "sedition is normally a mortal sin, but overthrowing a tyrant is an exception." Instead he seems to say that this simply is not sedition in the first place. Does that shift do any real work, or is it just a way of talking? Second, how should I read the proviso about the disturbance being "inordinate" and producing greater harm than the tyranny itself — is he covertly weighing consequences here, which seems to sit oddly with everything I've heard about his ethics? And why does he end up pinning the charge of sedition on the tyrant rather than on those who move against him, given that elsewhere in the same article he treats the defenders of the common good as the ones who are not seditious?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Software engineer, no philosophy background, reading Aquinas's *Summa Theologiae* (ST) on their own.
      *   **Context:** Stuck on *ST* II-II, q. 42, a. 2, ad 3 (Sedition, tyranny, and mortal sin).
      *   **The Text:** Aquinas's reply to Objection 3 regarding whether sedition is always a mortal sin.
      *   **The Problem:**
          1.  The user expected an "exception" model (Sedition is sin *except* when overthrowing a tyrant), but Aquinas uses a "definition" model (Overthrowing a tyrant *is not* sedition). Does this distinction do real work?
          2.  The "inordinate disturbance" proviso sounds like consequentialism (weighing harms), which conflicts with the user's understanding of Aquinas's deontological/virtue ethics.
          3.  Why blame the *tyrant* for sedition when earlier Aquinas says defenders of the common good aren't seditious? (Seems contradictory).
      *   **Goal:** Explain Aquinas's reasoning in accessible terms, addressing the three specific points without oversimplifying the metaphysics/ethics involved.

  2.  **Deconstruct Question 1: Definition vs. Exception ("Is it just a way of talking?")**
      *   *User's intuition:* Exception = Rule applies but is overridden. Definition = Rule doesn't apply.
      *   *Aquinas's metaphysics:* For Aquinas, moral acts are defined by their *object*, *end*, and *circumstances*. Sedition is defined specifically as opposition to the *unity of the multitude* and the *common good*.
      *   *The Shift:* It's not just semantics. If the regime is tyrannical, it is *already* opposed to the common good. Therefore, opposing it *restores* the common good. Sedition is, by definition, an attack on the common good. You can't attack the common good by defending it.
      *   *Analogy:* "Killing is murder." No, "Murder is *unjust* killing." Self-defense isn't an exception to murder; it's not murder at all because the definition of murder includes injustice.
      *   *Work done:* It preserves the absolute prohibition on sedition (as defined) while allowing for justified resistance. It prevents the slippery slope of "sometimes attacking the state is okay" to "attacking the state is a neutral tool."

  3.  **Deconstruct Question 2: The "Inordinate" Proviso (Consequentialism?)**
      *   *User's concern:* Aquinas weighing harms sounds like Utilitarianism/Consequentialism.
      *   *Aquinas's Ethics:* It's Natural Law/Virtue Ethics. It's not *purely* consequentialist, but consequences matter in the *circumstances* of the act (Prudence).
      *   *The Principle of Double Effect (proto-version):* The act is removing a tyrant (good). The side effect is turmoil (bad). If the bad outweighs the good, the act becomes imprudent and potentially unjust.
      *   *Key Distinction:* It's not "the ends justify the means." It's "the act must be proportionate." Prudence (*prudentia*) is the virtue of right reason in action. A prudent person doesn't start a civil war if it will starve more people than the tyrant would have.
      *   *Explanation:* It's not covert utilitarianism; it's the requirement of *prudence* within Natural Law. The "common good" isn't an abstract ideal; it includes the actual well-being of the people.

  4.  **Deconstruct Question 3: Blaming the Tyrant for Sedition (Contradiction?)**
      *   *User's observation:* Earlier Aquinas says defenders of the common good aren't seditious. Now he says the tyrant *is* seditious.
      *   *Resolution:* It's consistent. Sedition is causing discord against the *true* unity (common good).
      *   *The Tyrant's Role:* The tyrant rules for private good, not common good. By doing so, he fractures the true unity of the state. He creates a faction (himself vs. the people). Therefore, he is the author of the discord.
      *   *The Resistors:* They are trying to restore unity.
      *   *Why phrase it this way?* To flip the script. The objection assumed the resistors were causing the trouble. Aquinas argues the tyrant caused the trouble first; the resistance is a reaction to restore order.
      *   *Connection to previous point:* This reinforces the "Definition" point. If the tyrant is the seditious one, opposing him is opposing sedition, not committing it.

