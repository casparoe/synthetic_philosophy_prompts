answer: |-
  This is an excellent question. You have spotted exactly the kind of logical tension that makes Aquinas worth reading, and your intuition that he is doing something more than "just a way of talking" is correct. As a software engineer, you might appreciate that Aquinas is essentially debugging the definition of the function `is_sedition()`.

  Here is a breakdown of the three issues you raised, translating the Scholastic metaphysics into more accessible logical terms.

  ### 1. Definition vs. Exception: Does the shift do real work?

  You expected: `IF overthrowing_tyrant THEN exception_to_sedition_rule.`
  Aquinas writes: `IF overthrowing_tyrant THEN NOT sedition.`

  This is not just semantics; it is a fundamental feature of Aquinas's moral metaphysics. For Aquinas, the morality of an act is determined by its **object** (what is being done), its **end** (why it is being done), and its **circumstances**.

  *   **The Definition:** Aquinas defines sedition specifically as opposition to the **unity of the multitude** and the **common good**.
  *   **The Logic:** A tyrannical government, by definition, is *already* opposed to the common good (it serves the private good of the ruler). Therefore, the "unity" it enforces is a false unity.
  *   **The Conclusion:** If you oppose a tyrant, you are not attacking the *common good*; you are attacking an *enemy* of the common good.

  **Why this matters:**
  If Aquinas treated this as an **exception**, he would be admitting that sedition (attacking the political order) is inherently neutral, and sometimes justified. This would weaken the absolute prohibition against civil discord.
  By treating it as a **definition**, he maintains that "Sedition is always a mortal sin" remains universally true. It is analytically true, like saying "All bachelors are unmarried." If you are justified in overthrowing a ruler, your act *cannot be sedition* by definition, just as killing in self-defense is not *murder* by definition.

  **Engineering Analogy:**
  Think of `sedition` as a function that returns `TRUE` only if `target == common_good`.
  If the government is tyrannical, `government != common_good`.
  Therefore, `attack(government)` does not trigger the `sedition` function. It's not an override; the input parameters simply don't match the function's criteria.

  ### 2. The "Inordinate" Proviso: Is this covert consequentialism?

  You are right to be suspicious of weighing harms, as Aquinas is not a Utilitarian. He does not believe "the ends justify the means." However, he is also not a rigid deontologist who ignores outcomes entirely. He operates within **Natural Law** ethics, which relies heavily on the virtue of **Prudence** (*prudentia*).

  **Prudence vs. Consequentialism:**
  *   **Consequentialism:** The morality of the act is determined *solely* by the outcome. (e.g., "Lie if it makes people happier.")
  *   **Aquinas/Prudence:** The act must be good in itself, *but* a prudent agent must consider whether the act is proportionate to the end in the real world.

  When Aquinas says the disturbance must not be "inordinate" (disproportionate), he is applying a **proportionality test**.
  *   **The Act:** Removing a tyrant (Good).
  *   **The Side Effect:** Civil turmoil (Bad).
  *   **The Calculation:** If the turmoil kills more people or destroys more of the common good than the tyranny itself, the act is no longer "restoring the common good." It has become an act of destruction.

  **Why this isn't consequentialism:**
  Aquinas isn't saying "Calculate the utility." He is saying "Do not do a good thing in a way that results in a greater evil." This is actually a precursor to what later Scholastics formalized as the **Principle of Double Effect**. The resistance is only virtuous if it is *ordered* toward the good. If the resistance creates more disorder than it fixes, it is, by definition, no longer ordered toward the good.

  **Engineering Analogy:**
  Imagine you need to patch a critical security vulnerability (the tyrant). However, the patch requires a system reboot that will cause 48 hours of downtime (the disturbance).
  *   If the vulnerability only leaks minor data, but the downtime shuts down a hospital, applying the patch is **imprudent**.
  *   You aren't weighing "good vs. bad" utilitarianly; you are assessing whether the *remedy* is compatible with the *health of the system*.

  ### 3. Why pin the charge of sedition on the Tyrant?

  This seems contradictory to your reading of the earlier part of the article, but it is actually the key to unlocking the whole argument.

  Earlier, Aquinas establishes that sedition is a sin against **charity** and **justice** because it fractures the unity of the people.
  *   **The Standard Case:** The government is legitimate (serving the common good). The rebels fracture the unity. The rebels are seditious.
  *   **The Tyranny Case:** The tyrant rules for *private good*. By doing so, he treats the state as his property rather than a community. He creates a faction (Himself vs. The People).

  **The Flip:**
  Aquinas argues that the tyrant is the **primary cause** of the discord.
  1.  True political unity exists only when the ruler serves the common good.
  2.  The tyrant breaks this bond first.
  3.  Therefore, the tyrant is the one who has already introduced "sedition" (discord) into the body politic.
  4.  Those who resist him are not creating discord; they are responding to the discord the tyrant initiated.

  **Resolving the apparent contradiction:**
  Aquinas isn't saying "Defenders of the common good are seditious." He is saying "The tyrant claims to be the defender of order, but because he serves himself, he is actually the agent of disorder."

  By pinning the charge on the tyrant, Aquinas validates the resistance without legitimizing anarchy. It frames resistance not as "rebellion against authority," but as "defense of authority against a usurper." The tyrant has, in a metaphysical sense, fired himself by violating the terms of his office (the common good).

  ### Summary for your mental model

  1.  **Definition:** Overthrowing a tyrant isn't an *exception* to the rule against sedition; it fails to meet the *definition* of sedition (which requires attacking the common good).
  2.  **Proviso:** The warning about "greater harm" isn't Utilitarianism; it's **Prudence**. An act that destroys the common good in the process of saving it is irrational and therefore vicious.
  3.  **The Tyrant:** The tyrant is labeled seditious because he fractured the political unity first by prioritizing private good over common good. The resistors are merely restoring the status quo ante.

  Aquinas is walking a tightrope here. He wants to forbid revolution (to maintain order) while acknowledging that tyranny is intolerable (to maintain justice). He does this by rigging the definitions: **True order requires justice. Therefore, unjust rule is not true order, and opposing it is not true disorder.**

  It is dense reading, but your instinct that the specific wording matters is spot on. In Scholasticism, the distinction between "an exception to a rule" and "outside the scope of a rule" is often the difference between a contradiction and a coherent system.
