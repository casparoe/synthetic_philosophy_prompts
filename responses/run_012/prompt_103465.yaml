answer: |-
  # JOINT STATEMENT ON CHARACTER AND SITUATION
  **Signed by the Neo-Aristotelian and Situationist Working Groups**
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  We, the undersigned, affirm the following propositions as the necessary foundation for any further empirical or philosophical work on character. Neither party can relinquish these claims without abandoning the core of their respective positions.

  1.  **The Empirical Record on Consistency:** We agree that the existing empirical record establishes low cross-situational behavioral consistency in *unselected* populations under *strong* situational pressures. We further agree that this record does *not* establish the impossibility of cross-situational consistency in *selected* populations under *weak* or *moderate* situational pressures, nor does it rule out the existence of latent psychological structures that organize behavior over long timeframes.
  2.  **Descriptive vs. Normative Independence:** We agree that the descriptive question ("Do robust global character traits exist in the general population?") is distinct from the normative question ("Does virtue ethics provide the correct account of human flourishing?"). The Situationist holds that a negative answer to the descriptive question undermines the normative plausibility of virtue ethics. The Neo-Aristotelian holds that the normative theory can remain valid even if the descriptive realization of virtue is rare or aspirational.
  3.  **Taxonomy of Traits:** We agree that the term "trait" is ambiguous and must be disambiguated in future research. Specifically, we distinguish between:
      *   (a) A *behavioral disposition* (a statistical regularity in action);
      *   (b) A *skill* (a capacity to perceive and respond correctly, which may fail in performance);
      *   (c) An *evaluative stance* (a commitment to certain values, regardless of behavioral success).
      *   We agree that Situationist critiques primarily target (a), while Neo-Aristotelian defenses primarily rely on (b) and (c).
  4.  **Base Rates and Selection Effects:** We agree that if virtues are, as the Neo-Aristotelian claims, rare excellences akin to expertise or genius, studies sampling from the general population suffer from a selection effect error. We agree that evidence drawn from general populations cannot definitively falsify the existence of rare traits, though it can falsify the claim that such traits are common.
  5.  **Criteria for a Well-Formed Test:** We agree that a decisive test of the disputed claims must satisfy three conditions:
      *   (a) It must measure behavior across genuinely distinct situation types (not merely variations of the same context);
      *   (b) It must distinguish between the *capacity* for virtue and the *performance* of virtue;
      *   (c) It must account for situational strength, acknowledging that even strong traits may be overwhelmed by extreme situational pressures.

  ## II. DISAGREEMENTS TABLE

  | Disagreement | Neutral Statement | Neo-Aristotelian Formulation | Situationist Formulation | Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Definition of Consistency** | Does a trait require behavioral consistency across heterogeneous situations? | A trait requires *narrative* consistency: actions must cohere with the agent's practical identity and reasons, even if behavioral outputs vary. | A trait requires *statistical* consistency: actions must show significant predictive correlation across distinct situational variables. | **Partly Verbal** (Keyword: *Consistency*) |
  | **2. The Locus of Explanation** | What is the primary determinant of moral behavior? | Behavior is the product of an interaction between character and situation, where character acts as a filter or moderator. | Behavior is primarily a function of situational features, with "character" serving as a post-hoc folk explanation. | **Genuine** |
  | **3. The Implication of Rarity** | If virtue is empirically rare, what follows for ethical theory? | If virtue is rare, ethics must be aspirational and educational; the theory prescribes what we *should* become, not what we *are*. | If virtue is rare to the point of non-existence, ethics must be institutional and structural, relying on situations rather than self-cultivation. | **Genuine** |
  | **4. The Relevance of Ordinary Failure** | Do failures of ordinary people in strong situations bear on the concept of virtue? | No. Virtue is an ideal state; the failure of non-virtuous agents in strong situations confirms the difficulty of virtue, not its absence. | Yes. If "virtue" cannot be distinguished from ordinary disposition in empirical testing, it lacks explanatory power for real-world agents. | **Partly Verbal** (Keyword: *Virtue*) |

  ## III. CRUXES AND THE HARBOR STUDY

  We identify the following sub-questions as cruxes. Settling these would significantly shift the dialectic. For each, we specify a concrete test, advance predictions, and state falsification conditions.

  ### Crux A: Is Cross-Situational Consistency Required for a Trait?
  *   **Concrete Test:** A longitudinal study measuring "honesty" via (1) tax reporting, (2) returning lost wallets, and (3) admitting errors in a lab task, controlling for risk of detection.
  *   **Neo-Aristotelian Prediction:** Low correlation between (1) and (2), but high correlation between (2) and (3) when agents perceive the *moral salience* of the situation.
  *   **Situationist Prediction:** Low correlation across all three, driven by specific risk/reward structures in each context.
  *   **Falsification:** If high moral salience perception fails to increase cross-situational correlation, the Neo-Aristotelian must concede that *phronesis* (practical wisdom) does not function as a behavioral integrator.

  ### Crux B: Does Rarity Defeat the Evidence or Insulate the Theory?
  *   **Concrete Test:** A meta-analysis of "moral exemplar" studies (e.g., rescuers during genocide, award-winning caregivers) compared to matched controls on standard personality inventories.
  *   **Neo-Aristotelian Prediction:** Exemplars will show distinct psychological profiles (e.g., higher integration of values) that predict behavior better than situational variables.
  *   **Situationist Prediction:** Exemplars will not differ significantly from controls on trait measures; their behavior will be explained by specific situational affordances (e.g., proximity to victims, lack of authority interference).
  *   **Falsification:** If exemplars show no psychological distinctiveness from controls, the Neo-Aristotelian must abandon the claim that virtue is a psychological reality distinct from circumstance.

  ### Crux C: Do Classic Obedience/Helping Studies Bear on Virtue?
  *   **Concrete Test:** Replication of a helping study (e.g., bystander intervention) with a pre-screened group of individuals nominated for sustained moral commitment.
  *   **Neo-Aristotelian Prediction:** The screened group will intervene at significantly higher rates than the general population, even under pressure.
  *   **Situationist Prediction:** The screened group will succumb to situational pressure (e.g., group inertia) at rates similar to the general population.
  *   **Falsification:** If the screened group intervenes at rates indistinguishable from the general population, the Neo-Aristotelian must concede that "virtue" offers no protective buffer against situational strength.

  ---

  ### Analysis of The Harbor Study

  We treat the Harbor Study and its follow-up as the shared stimulus for this collaboration.

  **1. Interpretation of Initial Results**
  *   **The Data:** High within-situation stability; near-zero cross-situation stability. Top decile on low-cost helping failed high-cost helping.
  *   **Neo-Aristotelian Interpretation:** The initial panel measured *habits* or *temperament*, not *virtue*. The failure of the top decile on high-cost opportunities indicates that low-cost helping is a poor proxy for virtue, which requires sacrifice. The situational strength of the "high-cost" condition likely overwhelmed undeveloped dispositions.
  *   **Situationist Interpretation:** The data confirms that behavioral consistency is domain-specific. The failure of the top decile demonstrates that "compassion" as measured in low-stakes environments does not generalize to high-stakes environments, validating the claim that global traits are poor predictors.

  **2. Predictions for the Screened Follow-Up**
  *   **Protocol:** Participants nominated by peers as "exceptionally compassionate" run through the same experience-sampling and high-cost test.
  *   **Neo-Aristotelian Prediction:** The screened group will show significantly higher cross-situational stability than the random panel. Crucially, the top decile of the *screened* group will perform significantly better on the high-cost opportunity than the median of the random panel.
  *   **Situationist Prediction:** The screened group will show marginally better low-cost helping (due to social expectation monitoring) but will show near-zero stability across situation types. The top decile of the *screened* group will perform no better than the median on the high-cost opportunity, as peer nomination tracks reputation, not behavioral capacity.

  **3. Conditions for Abandonment**
  *   **Neo-Aristotelian Abandonment:** If the screened group shows near-zero cross-situational stability *and* fails the high-cost test at rates identical to the random panel, we must concede that peer-identified "virtue" is empirically indistinguishable from situational conformity.
  *   **Situationist Abandonment:** If the screened group demonstrates robust cross-situational stability (correlation > .40) *and* the top decile succeeds in the high-cost test at a rate significantly above the random median, we must concede that robust global traits can exist in a subset of the population and are detectable via peer nomination.

  **4. Limitations and Joint Research Program**
  We acknowledge that the Harbor Study cannot touch the following parts of the dispute:
  *   **The Normative Status:** Whether a successful screened trait constitutes a *moral good* independent of its consequences.
  *   **The Internal State:** Whether the screened participants acted from *practical wisdom* or from internalized social conditioning (the "skill" vs. "disposition" distinction).
  *   **Developmental Trajectories:** The study is cross-sectional regarding the trait; it does not show how the trait was acquired or if it can be taught.

  **Joint Research Program:**
  To move forward, we commit to a collaborative research program that:
  1.  **Refines Measurement:** Develops situational tests that control for *moral salience* perception, ensuring agents recognize the ethical demand in each context.
  2.  **Longitudinal Design:** Tracks the screened cohort over years to distinguish stable traits from temporary social roles.
  3.  **Intervention Arm:** Attempts to train a random control group using Neo-Aristotelian pedagogical methods to test if "virtue" can be manufactured, thereby addressing the rarity objection.

  We sign this statement not as a truce, but as a map for a shared inquiry.

  __________________________
  **Neo-Aristotelian Representative**

  __________________________
  **Situationist Representative**
