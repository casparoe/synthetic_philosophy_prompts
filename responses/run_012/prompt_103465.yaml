      *   **Situationist Critic (SIT):** Believes empirical evidence shows behavior is driven more by situational factors than global traits. Argues traditional virtue ethics relies on a folk-psychological notion of character that doesn't exist. Focuses on consistency across *different* situations.

  3.  **Drafting Part I: Agreed Claims:**
      *   *Goal:* Find common ground that neither can drop without losing their core identity.
      *   *Claim 1 (Empirical Record):* Acknowledge the data shows low cross-situational consistency in *ordinary* populations, but deny that this proves traits *cannot* exist.
      *   *Claim 2 (Descriptive vs. Normative):* Crucial distinction. SIT focuses on descriptive psychology; AVE focuses on normative ethics. AVE can admit most people lack virtue without ethics collapsing.
      *   *Claim 3 (Nature of Traits):* Agree that "trait" is ambiguous. It can mean behavioral frequency, skill/capacity, or evaluative orientation.
      *   *Claim 4 (Base Rates/Selection):* Acknowledge that studying random populations might miss rare traits (like genius or virtue).
      *   *Claim 5 (Testing):* Agree on what a good test looks like (longitudinal, diverse situations, controlling for situational strength).
      *   *Refinement:* Ensure the language is neutral enough for both but strong enough to matter.

  4.  **Drafting Part II: Disagreements Table:**
      *   *Goal:* Clarify *where* they disagree and *why* (semantic vs. substantive).
