      *   *Disagreement 2: The Role of Situation.* AVE sees situation as the arena for virtue. SIT sees situation as the determinant of behavior. (Type: Genuine).
      *   *Disagreement 3: Normative Force.* AVE says "ought implies can" (we can cultivate virtue). SIT says "ought implies can" is threatened if traits are situational. (Type: Genuine).
      *   *Key Words:* "Consistency," "Virtue," "Situation."

  5.  **Drafting Part III: The Cruxes:**
      *   *Goal:* Identify specific questions where an answer shifts the debate. Include the required (a), (b), (c).
      *   *Crux (a): Consistency requirement.* Does a trait need cross-situational consistency?
      *   *Crux (b): Rarity.* If virtue is rare, does situationist data (on average people) matter?
      *   *Crux (c): Relevance of Classic Studies.* Do Milgram/Darley apply to *virtuous* agents?
      *   *Requirement:* Concrete case/experiment for each.
      *   *Requirement:* Predictions and falsification conditions.

  6.  **Integrating The Harbor Study:**
      *   *Description:* Experience sampling (low-cost helping) + High-cost follow-up. Result: High within-situation stability, low cross-situation stability. Top decile failed high-cost test.
      *   *Follow-up:* Peer-nominated "exceptionally compassionate" people run through the same protocol.
