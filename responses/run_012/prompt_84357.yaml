      *   **Field:** Moral Philosophy and History (interdisciplinary).
      *   **Constraints:**
          *   No archival work.
          *   Citations to be added later (refer to positions by content, not author/title).
          *   No invented dates, figures, or titles.
          *   Use only supplied facts + well-known background (British colonial slavery, dueling, footbinding).
          *   Be honest about the philosophy/history division of labor and feasibility.
          *   **Crucial:** State the question so it has a determinate answer (falsifiable claim), not a survey.
          *   Explain why standard answers leave the question open.
          *   Lay out the method concretely (comparison, coding settlements, avoiding hindsight bias).
          *   Specify failure conditions (observational equivalence, etc.).
          *   Specify success conditions and audience.
      *   **Core Idea:** Moral revolutions involve three mechanisms (Interest, Honor, Argument). They aren't rivals but explain different phases. The key diagnostic is the *settlement* (distribution of burdens), not the rhetoric.
          *   *Argument:* Makes practice contestable.
          *   *Honor:* Stops public defense by the practicing class.
          *   *Interest:* Determines timing and terms of exit.
          *   *Hypothesis:* Honor mechanisms work for self-regarding practices (dueling, footbinding) where practitioner = constrained. They fail for other-regarding/exploitative practices (slavery) where practitioner $\neq$ constrained. In exploitative cases, interest dictates compensation/transitional labor.
          *   *Conclusion:* Honor-based accounts are local, not general. The key variable is who is positioned to demand a price.

  2.  **Deconstruct the Core Argument for the Proposal:**

      *   *Research Question:* Do moral revolutions operate via a unified mechanism of honor-driven norm collapse, or does the mechanism depend on the structural relationship between the practitioner and the victim of the practice?
      *   *Thesis:* The "honor" model of moral revolution is locally valid for self-regarding practices but fails as a general theory because it cannot explain the settlement terms of extractive practices. The distribution of burdens in the settlement reveals the dominant mechanism (Interest vs. Honor).
      *   *Method:* Comparative case study (Slavery vs. Dueling/Footbinding). Focus on the *settlement* (compensation, transitional labor) rather than the *rhetoric* (abolitionist arguments, shaming).
      *   *Feasibility Check:* One semester, 6,000 words. This is tight for deep historical analysis. The proposal needs to acknowledge that the historical claims are provisional/illustrative to support a conceptual point. The heavy lifting is philosophical (categorizing mechanisms), supported by historical plausibility, not definitive historical proof.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and descriptive.
      *   **Introduction/Problem Statement:** Define the "moral revolution" debate. Identify the three rival explanations (Interest, Honor, Argument). State the problem: they are treated as rivals, but maybe they are phases. The real puzzle is distinguishing them.
      *   **The Gap/Standard Accounts:** Why are current answers insufficient? They focus on rhetoric or origins, not the *end state*. They assume one mechanism fits all.
      *   **The Hypothesis:** Articulate the "Settlement Diagnostic." Argument opens the door, Honor closes the debate, Interest sets the price. Crucially, Honor only works when the cost-bearer is the practitioner.
      *   **Methodology:** How to test this without archives? Comparative analysis of well-known cases. Coding the "settlement" (compensation yes/no, transitional labor yes/no). Avoiding hindsight bias (looking at the deal, not the justification).
      *   **Feasibility & Division of Labor:** This is critical. I need to admit that I am not a historian. The historical claims must be treated as "stylized facts" to test a philosophical taxonomy. If the history is messier than the model, the philosophical model needs adjustment, not the history. Is it too ambitious? Maybe. I need to scope it to *testing the taxonomy* rather than *proving the history*.
      *   **Failure Conditions:** What kills the project? If settlements look the same across cases (e.g., if dueling also had compensation), or if slavery ended without compensation (it didn't, but if the data were ambiguous). If the mechanisms are observationally equivalent.
      *   **Success Conditions:** A refined taxonomy of moral change. Matter to moral philosophers (theory of change) and historians (interpretive framework).

  4.  **Refining the Tone and Constraints:**

      *   *Tone:* Professional, academic, precise.
      *   *Citations:* Use phrases like "proponents of the honor-based account" instead of "Appiah says."
      *   *History:* Stick to the prompt's examples. British slavery (compensation + apprenticeship), Dueling (no compensation, honor shift), Footbinding (no compensation, honor shift).
      *   *Word Count:* The proposal itself isn't 6,000 words; the *paper* will be. The proposal needs to be concise but detailed enough to show the plan is viable. (Usually, proposals are 1,500-2,500 words). I will aim for a robust prospectus length.
      *   *Self-Correction on Feasibility:* The prompt asks me to say whether the project is too ambitious. I need to be honest. Comparing three major historical phenomena in 6,000 words is very tight. I should propose focusing on the *contrast* between Slavery and Dueling as the primary axis, using Footbinding as secondary support if space allows. I must emphasize that the goal is conceptual clarification, not definitive historical revisionism.

  5.  **Drafting the Content (Iterative Process):**

      *   *Title:* "The Price of Virtue: Diagnosing Mechanisms of Moral Revolution through Settlement Structures."
      *   *Intro:* Start with the puzzle. Why do some moral changes cost the practitioners nothing (socially/financially) while others require payoffs?
      *   *Literature/Positions:* Describe the three camps without names. Materialist (Interest), Sociological (Honor/Shame), Idealist (Argument).
      *   *Thesis:* They are complementary but distinct phases. The settlement reveals the dominant constraint.
      *   *Method:* Compare British Emancipation (1833) vs. Decline of Dueling (18th/19th C). Look for compensation and transitional labor.
      *   *Risk:* The "Observational Equivalence" problem. If honor always aligns with interest, we can't tell them apart.
      *   *Division of Labor:* I am doing conceptual work (defining the mechanisms) using history as a test bed. I am not claiming new historical truth.
      *   *Ambition:* It is ambitious. I need to limit the scope to ensure the philosophical point lands.

  6.  **Final Review against Constraints:**

      *   *No archival work?* Yes, reliance on established general knowledge.
      *   *No specific citations?* Yes, refer to positions.
      *   *Determinable answer?* Yes, the hypothesis is falsifiable.
      *   *Failure conditions?* Explicitly stated.
      *   *Honest about history/philosophy split?* Yes, emphasized in the methodology/feasibility section.
      *   *Polished prospectus?* Yes, narrative flow, not bullet points.

  7.  **Final Polish:** Check the voice. Ensure it sounds like a graduate student proposing a seminar paper (ambitious but aware of limits). Ensure the distinction between "self-regarding" and "other-regarding" practices is clear, as that's the pivot point of the argument. (Self-correction: Dueling is arguably other-regarding in that it harms the opponent, but the *constraint* is on the participant's own honor. Slavery is extractive. I need to be precise here: Dueling/Footbinding are practices where the person bound by the norm is the one suffering the constraint/cost. Slavery is where the person bound by the norm profits from the suffering of another. This distinction is key.)

      *Refining the "Self-Regarding" distinction:* The prompt says "self-regarding practices, where the practitioner and the person constrained are the same." For dueling, the duelist is constrained by honor. For footbinding, the binder (or the bound woman acting under norm) is constrained. For slavery, the owner is the practitioner, but the enslaved is the one constrained/suffering. This fits. I will use the prompt's terminology to stay safe.

      *Feasibility Check:* 6,000 words is roughly 20-25 pages. Covering three historical cases + philosophical framework is tight. I will recommend prioritizing the Slavery vs. Dueling contrast to ensure depth.

      *Let's write.*
answer: |-
  **Title:** The Price of Virtue: Diagnosing Mechanisms of Moral Revolution through Settlement Structures

  **Project Overview**

  This proposal outlines a 6,000-word seminar paper situated at the intersection of moral philosophy and intellectual history. The project investigates the mechanisms driving moral revolutions—the large-scale abandonment of previously accepted practices such as chattel slavery, dueling, or footbinding. Contemporary debates typically treat three explanatory mechanisms as rivals: changes in material interest, the social pressures of honor and shame, and the force of moral argument. This paper argues that these are not competing explanations for a single phenomenon but distinct causal drivers that operate in different phases of moral change.

  The central thesis is that the dominant mechanism in any given moral revolution can be identified not by the rhetoric used to justify the change, but by the structure of the political and economic settlement that follows it. Specifically, I propose a "settlement diagnostic": if the end of a practice involves compensation to the practitioners and transitional regimes that mitigate their loss, the exit was driven primarily by material interest. If the practice ends without compensation, and the social cost is borne by the practitioners themselves, the exit was driven by honor. Consequently, the honor-based model of moral revolution, often presented as a general theory, is in fact a local explanation applicable only to practices where the practitioner and the person constrained by the norm are identical. It fails to scale to extractive practices where the practitioner profits from the constraint of another.

  **The Research Question**

  The guiding question of this paper is: *Does the distribution of burdens in the post-revolutionary settlement reliably discriminate between honor-driven and interest-driven moral change?*

  This question is designed to admit a determinate, falsifiable answer. It is not a survey of how different scholars have explained moral change, but a test of a specific diagnostic claim. The claim could be false in two specific ways: first, if honor-driven revolutions consistently produce compensated settlements (contradicting the link between honor and self-sacrifice); second, if interest-driven revolutions consistently end without compensation (contradicting the link between interest and exit terms). By focusing on the settlement rather than the rhetoric, the paper seeks to bypass the ambiguity of moral motivation, which is often obscured by post-hoc justification, and look instead at the tangible costs assigned when a practice terminates.

  **Limitations of Standard Accounts**

  Current philosophical and historical accounts of moral revolution tend to suffer from two defects that leave the explanatory question open. First, they often conflate the *onset* of contestation with the *completion* of abolition. Proponents of the moral argument thesis correctly note that practices must become conceptually contestable before they can be abandoned, but they struggle to explain why contestation leads to abandonment at specific times and on specific terms. Proponents of the materialist thesis explain the timing and terms well but struggle to explain why the change is codified as a moral imperative rather than a mere policy adjustment.

  Second, and more critically, standard accounts treat the mechanisms of interest, honor, and argument as mutually exclusive rivals over the same *explanandum*. This forces a false choice. An abolitionist movement can simultaneously deploy moral arguments, rely on shifting economic interests, and utilize social shaming. When these factors align, it is impossible to distinguish which mechanism did the causal work by looking at the movement's rhetoric alone. A slaveholder convinced by moral argument and a slaveholder convinced by economic necessity may both vote for emancipation, but they will demand different terms for doing so. The standard literature focuses on the vote or the speech, rather than the bill attached to the legislation. By shifting the analytical focus to the settlement—the compensation packages, the transitional labor regimes, and the allocation of loss—this project attempts to disentangle these overlapping causes.

  **Methodology and Case Selection**

  The method employed will be a structured, comparative analysis of three well-documented historical cases: the abolition of British colonial slavery, the decline of aristocratic dueling, and the end of footbinding in China. These cases are selected because they are sufficiently distinct in their economic and social structures to test the scope of the honor mechanism, yet well-known enough to allow for analysis without primary archival research.

  The analysis will proceed in three steps. First, I will code the "settlement" of each case along two binary variables: (1) Was financial compensation paid to the practitioners of the abolished custom? (2) Was there a transitional regime that temporarily preserved elements of the old hierarchy (e.g., apprenticeship systems)?

  Second, I will map these settlements against the nature of the practice. British slavery represents an *extractive* practice, where the practitioner (the owner) benefits from the constraint of another (the enslaved). Dueling and footbinding represent *self-regarding* or *honor-bound* practices, where the practitioner is also the primary bearer of the physical or social cost of the norm. In dueling, the duelist risks their own life for honor; in footbinding, the woman (and her family) bears the physical cost for social standing.

  Third, I will evaluate the correlation. The hypothesis predicts that extractive practices will show positive values for compensation and transitional regimes (indicating an interest-driven exit), while honor-bound practices will show negative values for both (indicating an honor-driven exit).

  To avoid the methodological pitfall of reading the outcome back into the motives—a form of hindsight bias where one assumes that because a practice ended, the moral arguments must have been the cause—I will strictly bracket the rhetorical history of the movements. The paper will not assess the sincerity of abolitionists or the moral sophistication of anti-dueling campaigners. Instead, it will treat the settlement terms as revealed preferences. If a class of slaveholders accepts emancipation only when compensated, their behavior reveals that interest was the binding constraint, regardless of whether they cited scripture or economics in parliament.

  **Feasibility and Division of Labor**

  This project requires a clear division of labor between philosophical conceptualization and historical application. The primary contribution of the paper is philosophical: it offers a taxonomy of moral change mechanisms and a criterion for distinguishing them. The historical cases serve as test beds for this taxonomy, not as subjects of original historical revisionism.

  I must be honest about the limitations this imposes. I am not establishing new historical facts regarding the negotiations of the 1833 Slavery Abolition Act or the social pressures surrounding 19th-century dueling. I am relying on established, general historical knowledge regarding these events. For example, it is a matter of standard historical record that British slaveholders received compensation and that freed people were subjected to apprenticeship, whereas duelists who stopped dueling received no financial indemnity for their loss of "honor."

  There is a risk that this division of labor makes the project too ambitious for a one-semester, 6,000-word limit. To compare three distinct historical phenomena across two continents while maintaining philosophical rigor is tight. To mitigate this, the paper will prioritize the contrast between British slavery and dueling as the primary axis of comparison. Footbinding will be used as a secondary corroborating case only if space permits. The goal is not to write a comprehensive history of any of these practices, but to use them as clear data points to test the validity of the settlement diagnostic. If the historical record proves messier than the binary coding allows—for instance, if there were informal compensations in dueling cultures that function like formal compensations in slavery—this would be a limitation of the historical generalization, not necessarily a failure of the philosophical distinction. The paper will acknowledge this by framing the historical claims as "stylized facts" sufficient for conceptual testing, rather than definitive historical proofs.

  **Conditions for Failure**

  It is vital to specify what would count as the project failing, given the constraints. There are two specific failure conditions.

  First, the thesis fails if the three mechanisms turn out to be observationally equivalent given the available historical facts. If it turns out that honor-driven settlements also routinely involve compensation (perhaps through state pensions or alternative status markers that function economically), then the settlement diagnostic cannot discriminate between honor and interest. Similarly, if extractive practices sometimes end without compensation due to state bankruptcy or revolutionary violence rather than moral conversion, the link between extraction and interest is broken. If the historical record shows that settlement terms are determined by state fiscal capacity rather than the nature of the moral practice, the proposed diagnostic is invalid.

  Second, the project fails if the "honor" mechanism cannot be coherently distinguished from "interest" in the self-regarding cases. In dueling, risking one's life is costly. Stopping dueling saves one's life. One could argue that stopping dueling is actually interest-driven (self-preservation) rather than honor-driven. If I cannot clearly distinguish why saving one's life in the context of dueling counts as an honor-shift rather than an interest-shift, the taxonomy collapses. To avoid this, I will define "interest" strictly as material or economic advantage distinct from physical survival or social standing, and "honor" as the maintenance of social status within a specific normative community. If this conceptual distinction proves unsustainable in the text, the argument cannot hold.

  **Conditions for Success and Significance**

  A successful result will look like a refined conceptual map of moral change. It will demonstrate that the "honor" model of moral revolution, while powerful, is not a universal theory but a local one applicable to practices where the cost of the norm falls on the practitioner. It will show that for extractive practices, moral argument may open the door, but interest dictates the price of exit.

  This matters to two audiences. For moral philosophers, it clarifies the causal role of moral reasoning. It suggests that moral arguments are necessary to make a practice contestable but are often insufficient to determine the terms of its abandonment without alignment from interest or honor. For historians and social scientists, it offers a methodological tool for interpreting the end of institutions. It suggests that analyzing the "bill" for a moral revolution is more informative than analyzing the "speeches."

  Ultimately, the paper aims to shift the debate from asking "which motive is strongest?" to "which party is positioned to demand a price?" If the argument holds, it implies that moral progress in extractive systems is structurally different from moral progress in honor systems. In the former, progress is often purchased; in the latter, it is shamed. Recognizing this distinction prevents the error of expecting the dynamics of one to apply to the other, and it provides a more realistic framework for understanding how entrenched immoral practices actually end.

  **Conclusion**

  This seminar paper proposes a focused investigation into the mechanics of moral change. By leveraging well-known historical cases without requiring new archival work, it tests a philosophical hypothesis about the relationship between moral motivation and political settlement. The scope is calibrated to be achievable within one semester by prioritizing conceptual clarity over historical exhaustiveness. The project acknowledges the risk that historical complexity may outstrip the proposed diagnostic, but it posits that even a negative result—showing that settlements are too messy to diagnose motives—would be a valuable contribution to the methodology of moral history. The outcome will be a polished argument that clarifies the limits of honor-based explanations and highlights the persistent role of material interest in the architecture of moral progress.
