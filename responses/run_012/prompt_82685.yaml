          *   *Decision:* The requirement to **distinguish 'unable to vary' from 'no occasion to vary' without invoking dualism** is the hardest. It excludes simple behaviorism (can't see the difference), simple rationalism (assumes always able), and hard determinism (denies the difference matters). But perhaps the "Empirical Constraint" regarding outcome devaluation is the hardest *data* constraint.
