      *   The user is asking for a *theory of agency/control* that can differentiate between "mindless mechanism" and "mindful flexibility" without falling into dualism or behaviorist traps.
      *   The tension is between *mechanistic explanation* (everything is physical/causal) and *intentional explanation* (agents have goals/choices).
      *   The user suspects a contradiction between "intrinsic rigidity" and "graded/description-relative rigidity." This is the crux of the philosophical problem.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Goal:* Define what a successful theory looks like.
      *   *Case Studies:*
          *   Wasp (Sphex): Classic rigidity.
          *   Ants (Death Spiral): Collective rigidity/emergent stupidity.
