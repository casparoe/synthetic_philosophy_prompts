      *(Self-Correction on the "Intrinsic vs Relative" conflict)*: I should validate the user's intuition. If rigidity is intrinsic, it's binary (you have the constraint or you don't). If it's description-relative, it's in the eye of the beholder. A theory that claims *both* is contradictory unless it specifies *levels*. I will argue that the "Intrinsic" claim belongs to the mechanism level, and the "Relative" claim belongs to the intentional level. But if the theory demands *both at the same level*, it is unsatisfiable.

