answer: |-
  ### The Rule She's Running: "Emergence from Mindless Substrate"

  Priya's most consistent principle is what we might call the **Hofstadterian Emergence Rule**. Based on her "Aunt Hillary" reference (a direct nod to Douglas Hofstadter's *Gödel, Escher, Bach*), her criteria for a collective mind are:

  1.  **The Parts Must Be Mindless:** A collective gains a mind *only* if the individual components do not have one. (Neurons: No → Brain: Yes. Ants: No → Colony: Yes.)
  2.  **The Parts Must Be Distinct Agents:** A single organism acting weirdly doesn't count. (Slime mould: No, because it's one cell, not a collective of agents.)
  3.  **The Whole Must Exhibit Cognitive Homeostasis:** The collective must do more than move; it must make trade-offs, allocate resources, and maintain internal state. (Starlings: No, because they just flock. Ants: Yes, because they forage, nurse, and balance ratios.)
  4.  **The "Mindful Parts" Veto:** If the parts already have minds, the collective is just a tool or fiction. (Corporation: No, because humans have minds. Stock Market: No, because traders have minds.)

  **Why this fits her track record:**
  This rule perfectly explains her hardest verdict: the **Corporation**. A functionalist might say a corporation processes information and makes decisions. Priya rejects this because the "processors" (employees) are already mindful. She grants ontological status to the *Whole* only when the *Parts* are ontologically cheap. It also explains the **Starling** verdict: birds have minds, and flocking is kinematic, not cognitive. It explains the **Slime Mould**: it's a single agent, not a collective.

  ### Alternative Rules That Fit

  1.  **Biological Vitalism:** A mind requires living tissue.
      *   *Fit:* Explains Brain, Ants, Bees (Yes) vs. Robots, Corp, Market (No).
      *   *Strain:* Struggles with the **Slime Mould** (which is alive but got a "No") and the **Corporation** (which is made of living humans but got a "No"). She would have to argue slime moulds are "too simple" and corporations are "just labels."
  2.  **The "Natural Kind" Bias:** Only evolved systems have minds; designed systems do not.
      *   *Fit:* Explains Brain, Ants, Bees (Yes) vs. Robots, Corp, Market (No).
      *   *Strain:* Corporations evolve culturally, and she rejects them. This rule doesn't capture her specific reasoning about *employees* vs. *ants*.

  ### Predictions for the Robot Swarm

  *   **Under "Emergence from Mindless Substrate" (Most Likely):** **YES.** The robots are mindless (20-line programs), distinct agents, and the swarm exhibits cognitive homeostasis (job switching, resource allocation). They are functionally isomorphic to the ants. Substrate (silicon vs. chitin) is irrelevant to this rule.
  *   **Under "Biological Vitalism":** **NO.** They are wire and silicon, not carbon and cells.
  *   **Under "Natural Kind Bias":** **NO.** They were built and tuned by engineers, not evolved.

  ### The Bet: YES

  I would bet that Priya **will attribute a mind to the swarm.**

