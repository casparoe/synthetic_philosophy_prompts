answer: |-
  This is a classic formulation of the **Boundary Problem** (sometimes called the "Paradox of Founding" or the "Problem of the *Demos*"). You have reconstructed it with admirable clarity. The argument is logically valid; if you accept premises (1) through (6), conclusion (7) follows inescapably. Since you refuse (7) (nihilism) and prefer to keep (1) (the core democratic intuition), you must find a fault in the machinery between them.

  The step you should reject is **Step (5)**, or more precisely, the **assumption of temporal and logical priority** embedded within it.

  Here is the breakdown of why this step looks compelling, why it should be rejected, and what that rejection commits you to.

  ### 1. Why Step (5) Looked Compelling
  Step (5) states: *"But the collective that would authorize a given boundary rule is precisely the collective that rule defines; its members must already be members in order to authorize the rule that makes them members."*

  This premise relies on a **contractualist intuition** that feels deeply democratic. It assumes that for a decision to be legitimate, the decision-makers must exist *prior* to the decision, just as signatories to a contract must exist before they sign. It treats the *demos* as a **pre-political entity**—a group of people who come together and *then* decide on their rules. Under this model, the boundary rule is just another rule, and like any other rule, it requires a pre-existing author.

  This intuition is powerful because it protects against tyranny. If a group can define its own boundaries without restriction, couldn't they simply exclude all their critics? Step (5) blocks this by saying, "Wait, you can't define the group until the group is already there to agree on the definition."

  ### 2. Why You Should Reject It
  You should reject the claim that the *demos* must **pre-exist** its own constitution. In democratic theory, the *demos* is not a pre-political fact (like a tribe or a family); it is a **political achievement**.

  The relationship between the *demos* and its boundary rule is not linear (first the people, then the rule); it is **constitutive** and **performative**. The act of voting on the boundary *is* the act of bringing the *demos* into existence.
  *   **The Constitutive Move:** When the city council votes on annexation, or when founders ratify a constitution, they are not a fully formed *demos* acting on a boundary. They are acting *as if* they are the *demos* to create the *demos*.
  *   **The Hermeneutic Circle:** This is not a *vicious* circle (which destroys legitimacy); it is a *hermeneutic* or *constitutive* circle (which creates it). Legitimacy does not flow from a pre-existing group to the rule; it emerges from the **procedure** itself, provided that procedure is open to future contestation and revision.

  By rejecting (5), you deny that "members must already be members." Instead, you assert that **members become members through the act of authorization.**

  ### 3. What This Commits You To
  Rejecting (5) saves democratic legitimacy from nihilism, but it comes with three significant theoretical costs you must accept in your seminar:

  **A. Democracy is Recursive, Not Foundational**
  You must abandon the idea that there is a "first moment" of pure legitimacy. There is no Archimedean point outside the system from which to judge the system. Legitimacy is **ongoing**. A boundary decision is legitimate not because it was authorized by a pre-existing perfect *demos*, but because the resulting polity allows for ongoing participation, rights, and the possibility of challenging the boundary later (e.g., through naturalization, secession referendums, or constitutional amendment).

  **B. The "Outsider" Problem Remains (The Annexation Case)**
  Rejecting (5) solves the *founding* paradox (how do *we* define *us*?), but your friend's annexation example highlights a different worry: **exclusion**.
  *   In a founding, the "outsiders" are everyone else in the world.
  *   In annexation, the "outsiders" are the residents of the unincorporated area.
  *   If you reject (5), you admit the City Council *can* constitute a new *demos*. But does that justify binding the outsiders?
  *   **Commitment:** To maintain legitimacy here, you must argue that while the *existing* demos has the competence to propose boundaries, legitimate annexation requires **dual consent** (both the city and the unincorporated area must vote) or a higher-order standard of **justice** (e.g., the annexation must not violate the rights of the outsiders). You cannot rely solely on the internal authorization of the City. This preserves (1) by expanding the "collective" in annexation cases to include *both* affected groups, even if they are not yet one legal entity.

  **C. Legitimacy is Gradational, Not Binary**
  Step (6) concludes that "no boundary rule has legitimate authority." This assumes legitimacy is an on/off switch. By rejecting (5), you commit to the view that legitimacy is a matter of degree. A boundary drawn by a colonial power is less legitimate than one drawn by a constitutional convention, which is less legitimate than one drawn by mutual consent. This allows you to say, "Yes, the boundary problem is real and creates deficits, but it does not erase legitimacy entirely," thus blocking the slide to (7).

  ### Summary for Your Seminar
  Tell your friend that the argument is valid but relies on a **category error** in Step (5). It treats a **constitutive rule** (which creates the subject) as if it were a **regulative rule** (which governs an existing subject).

  *   **Keep (1):** It remains the gold standard for ordinary legislation.
  *   **Reject (5):** The *demos* does not need to pre-exist to authorize its boundaries; it constitutes itself through the authorization.
  *   **Block (7):** Because legitimacy is recursive and ongoing, a state is not illegitimate simply because its founding boundary was circular. It is legitimate if it sustains democratic relations over time.

  This position acknowledges the depth of the boundary problem without surrendering to the conclusion that democracy is a fiction. It accepts that democracy begins with a leap of faith—a performative act of self-creation—that must be justified retrospectively by how well the resulting system treats its members.
