answer: |-
  Your seminar partner's objection—that election law is a matter of authorization rather than truth—rests on a false dichotomy. Legal authorization is conditional on facts: the statute says *if* a vote manifests clear intent, *then* it is authorized to be counted. To determine whether the condition is met is to evaluate the truth of the proposition "this ballot manifests clear intent." If the predicate "clear intent" is vague, the metaphysics of vagueness dictates whether there is a truth to be found (epistemicism) or whether the rule simply fails to determine an outcome in borderline cases (supervaluationism). The metaphysics does not replace the law; it describes the semantic texture of the law's conditions. If the law relies on vague predicates, the authority of the canvassing board depends on whether they are discovering a boundary or selecting one. Therefore, the exercise is not a category mistake; it is an inquiry into the semantic grounds of legal authority.

  Regarding your proposed separation—vagueness in the object, vagueness in the standard, and vagueness about which—you are right to distinguish them, but the metaphysics constrains which are possible. Neither epistemicism nor supervaluationism tolerates vagueness in the object itself; the ballot is a physical entity with determinate properties (number of detached corners, depth of indentation). The vagueness lies entirely in the predicates applied to the object. Your second element, vagueness in the standard ("clear intent" admits multiple precisifications), is where the theories diverge. Your third element, vagueness about which we are dealing with, is essentially the debate between the two theories. The separation is real, but both theories agree the locus is the standard, not the physical object.

  **Epistemicism**
  For the epistemicist, every ballot determinately is or is not a "legal vote for Gore." There is a sharp boundary between clear and unclear intent, even if it is unknowable.
  *   **Loci:** The predicate "is a legal vote" has a precise extension. The physical predicate "is a detached chad" also has a sharp boundary (perhaps at the molecular level), but the legal predicate is the relevant one. The statutory standard "clear intent" picks out a precise property that voters either possess or lack.
  *   **Implications for Courts and Boards:** The canvassing boards are engaged in a fact-finding mission. Their goal is to track the unknown sharp boundary. Errors are possible: a board might count a ballot that is determinately not a vote, or reject one that is. The Florida Supreme Court's order to recount was an order to discover the true count.
  *   **The December 12 Cutoff:** This cutoff is metaphysically innocent but epistemically tragic. The true winner was fixed on November 7. The deadline merely stopped the inquiry before the truth could be fully known. It does not change who won; it changes who is *certified* based on incomplete knowledge.
  *   **Equal Protection:** The epistemicist can support the U.S. Supreme Court's equal protection holding robustly. If there is one true boundary between legal and illegal votes, applying different standards in different counties guarantees that some counties are deviating from the truth more than others. Uniformity is required because there is only one truth to track. Arbitrariness is vicious because it introduces noise into the measurement of a determinate fact.
  *   **The Nature of the Cutoff:** The epistemicist cannot say the cutoff is a determinate number of detached corners. The boundary is a brute semantic fact about the predicate "clear intent," not necessarily reducible to physical metrics. It is silent on *where* the line is, only that it *is*.

  **Supervaluationism**
  For the supervaluationist, "legal vote" is vague because the standard "clear intent" admits multiple admissible precisifications.
  *   **Loci:** A ballot is a supertrue vote if it counts under all admissible precisifications, superfalse if it counts under none, and indeterminate if it counts under some. The vote totals are vague numbers; "who won Florida" lacks a truth value if the indeterminate ballots are sufficient to flip the result.
  *   **Coherence with Certification:** This view coheres with the actual inauguration only if we accept that certification *resolves* indeterminacy rather than reporting a pre-existing fact. When Bush was inaugurated, a precisification was selected by fiat (via the legal process), making it true that he won, even if it was previously indeterminate.
  *   **Constraints on Admissibility:** An admissible precisification must be consistent with the statutory language and physical reality. Human implementability is a legitimate constraint; a standard too complex for counters to apply consistently is not admissible. If counters disagree on a dimpled chad, this suggests multiple precisifications are admissible, supporting the claim of indeterminacy.
  *   **Collapse into Conventionalism:** There is a risk here. If admissibility is constrained by what boards *actually do*, supervaluationism risks collapsing into the claim that the cutoff is fixed by convention. However, the theory maintains that *before* the board decides, there is no fact. The board's consistent application *creates* the fact for that jurisdiction.
  *   **Safe-Harbor Rule:** This acts as a mechanism to force a selection of a precisification. It changes the subject from "who received more legal votes" (which may be indeterminate) to "who has a certified winner by the deadline." It is a legitimate device for resolving semantic indeterminacy for practical purposes.

  **What the Episode Shows About the Views**
  The episode provides evidence that favors supervaluationism over epistemicism, though it does not conclusively prove it.
  *   **Competent Counters:** The fact that competent counters looking at the same dimpled chad reached opposite verdicts, with no principled way to adjudicate between them, supports the supervaluationist's "no fact of the matter." If epistemicism were true, one counter was right and the other wrong, but the persistent inability to converge suggests the disagreement was rational, implying indeterminacy rather than ignorance.
  *   **Physical Determinacy:** The fact that ballots were physical objects supports the epistemicist only if one conflates physical states with legal status. Since the legal status depends on "intent," which is not purely physical, the physical determinacy does not entail semantic determinacy.
  *   **County Variation:** This is evidence for supervaluationism if we accept the U.S. Supreme Court's premise that there was one statutory standard ("clear intent"). If one standard admits multiple interpretations across counties, it behaves like a vague predicate admitting multiple precisifications. If it were merely a difference in enacted law, there would be no equal protection violation. The Court's ruling implies the vagueness was in the standard itself, not in local law.
  *   **Legitimacy and Closure:** The most telling feature is why it was tolerable to stop without knowing who had received more legal votes. Legitimacy came from the decision procedure (the safe-harbor deadline and the Court's ruling) rather than from the truth of the matter. Epistemicism makes this closure a failure (we stopped before finding the truth). Supervaluationism makes it a necessity (we must select a precisification to govern). The acceptance of the outcome despite acknowledged uncertainty suggests the public and institutions treated the winner as determined by the procedure, not by a hidden fact.

  **Silence and Limits**
  Epistemicism is silent on how to identify the sharp boundary, offering no guidance to counters other than "try harder." Supervaluationism is silent on which precisification *ought* to be selected when forced, only that selection is required for decision. Both theories struggle to fully account for the normative force of the Safe-Harbor deadline, which functions as a pragmatic override of semantic inquiry.

  Verdict: Supervaluationism, because the episode demonstrates that legitimate political authority can arise from procedural resolution of indeterminacy rather than the discovery of a hidden truth.
