      *   *The Numbers:* 40 years/generation, 120 years total. -> *Astrology/Numerology/Schema*. Khaldun tries to ground this in biology (age of reproduction/peak), but the rigid 120-year cycle is often more schematic than observed. It's a "natural lifespan" analogy.
