      *   "(glory)": The Arabic term (*mulk* or *majd*? Usually *mulk* = sovereignty/power or *sharaf* = honor). Rosenthal often uses "glory" for status/prestige. This shapes it as a psychological reward system. If the Arabic is closer to "power" or "authority," the stakes are higher. "Glory" makes it sound status-based; "Power" makes it resource-based. This matters for the Turchin comparison.
