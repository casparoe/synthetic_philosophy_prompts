          *   Khaldun's "Luxury" ~ Turchin's "Elite Overproduction/Consumption" (but Khaldun focuses on moral softening, Turchin on resource competition).
          *   Khaldun's "Desert" ~ Turchin's "Frontier" (hardy people on margins).
      *   *Divergence:*
          *   *Time:* Khaldun says ~120 years (3 gens). Turchin says ~2-3 centuries (secular cycle).
          *   *Mechanism of Fall:* Khaldun = Moral decay/loss of nerve + External conquest by tougher group. Turchin = Internal structural stress (elite fragmentation, fiscal insolvency) + Popular unrest.
          *   *Population:* Khaldun doesn't center population pressure as the driver. Turchin does.
      *   *Concrete Case:* A dynasty that becomes wealthy but maintains strong internal elite cohesion (e.g., maybe late Ottoman Janissaries? Or a specific Chinese dynasty).
          *   *Scenario:* A regime faces population pressure and elite overproduction (Turchin signals collapse) but maintains strong ideological/tribal solidarity and successfully purges rivals without collapsing (Khaldun signal of stability).
          *   *Better Case:* A "Frontier" state that settles down but doesn't lose solidarity immediately.
          *   *Specific Prediction Difference:*
              *   *Turchin:* Predicts collapse when elite numbers outstrip state capacity to pay them, leading to intra-elite conflict.
              *   *Khaldun:* Predicts collapse when the 3rd generation loses the "desert toughness" regardless of fiscal balance.
              *   *Imaginary Case:* A dynasty in its 4th generation (160 years) that remains austere and militarily aggressive (violating Khaldun's generational clock) but faces massive population pressure and elite overproduction (confirming Turchin).
              *   *Khaldun says:* They should still be strong because they kept the "desert qualities."
              *   *Turchin says:* They will collapse due to structural demographic pressure.
              *   *Alternative:* A dynasty in 2nd generation (80 years) that becomes luxurious but has low population pressure. Khaldun says decline starts. Turchin says stability continues.
      *   *Verbal vs. Substantive:* Much of it is verbal (solidarity vs. elite unity), but the *driver* is different. Khaldun = Moral/Psychological decay via lifestyle. Turchin = Material/Structural pressure via demographics.

  7.  **Drafting the Response:**
      *   *Tone:* Patient, analytical, hybrid historian/cliodynamicist.
      *   *Structure:* Follow the user's (a), (b), (c), (d) structure.
      *   *Brainstorming/Pre-computation:* Ensure I distinguish between Khaldun's *asabiyyah* and modern "social capital." Ensure I note the numerology issue clearly.
      *   *Refining the Circularity:* It's a negative feedback loop. Success contains the seeds of failure. Not logically circular, but causally recursive.
      *   *Refining the Translation:* Rosenthal's "glory" is key. It implies status. Turchin talks about "wealth" and "power."
      *  Refining the Comparison:* Turchin is endogenous (internal collapse). Khaldun is often exogenous (conquered by *new* desert group). This is a huge difference. Turchin's cycle ends in civil war/state breakdown. Khaldun's ends in regime replacement by outsiders.

