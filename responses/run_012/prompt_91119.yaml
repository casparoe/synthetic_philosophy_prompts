  1.  **Frame:** The constitutive context required to recognize the signal as a message (channel, authority system, language).
  2.  **Outer:** The explicit proposition or command.
  3.  **Inner:** What the signal's existence reveals about the sender's constraints, intent, or state within that system.

  **Motivation**
  This resolves your restaurant sign dilemma. Your tentative principle relied on token uniqueness (Type vs. Token), but Hofstadter's distinction concerns *function*. "Signs convey rules" is Frame because it allows you to decode the text. "We post this because an inspector forced us" is Inner because it reveals the sender's motivation, even if every sender shares it. The test is not "Is this universal?" but "Is this a precondition for reading (Frame) or a revelation about the writer (Inner)?"

  **Predictions**
