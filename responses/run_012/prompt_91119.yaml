      *   **Inner:** I reject your premise (the move reveals the sender's stance toward the dialogue).

  **Incompatibility**
  This principle cannot accommodate your **wedding ring** verdict. You classify "we are the kind of people for whom this symbol is a vow" as Frame. My principle classifies this as Inner: it reveals the sender's cultural identity and values, not the decoding rule (which is merely the convention that rings signify vows). You treat shared values as background (Frame); I treat them as sender characteristics (Inner).

  **Confidence**
  I am 75% confident. This aligns with Hofstadter's emphasis on the "mechanism of transmission" versus "content," but I am least sure about the **Ring clause**. Hofstadter often implies that deep cultural norms are Frame because they are unconscious background. My definition pushes shared values into Inner if they characterize the sender rather than the channel. Distinguishing "unconscious cultural precondition" from "shared sender value" is the fuzzy boundary where this scheme may fracture.
