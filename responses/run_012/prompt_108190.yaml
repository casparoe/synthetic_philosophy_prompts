answer: |-
  Here is a 90-minute session plan designed to navigate the split cohort, avoid the Prude/Lewd baggage, and isolate the logical core of Sen's result without importing unnecessary Arrow machinery.

  ### 1. The Sequence and the Arrow Apparatus

  **Do not build the Arrow apparatus.**
  Hauling in Social Welfare Functions (SWF), Independence of Irrelevant Alternatives (IIA), or the General Possibility Theorem actively hurts you here. Arrow is about *aggregation procedures* (how to count votes). Sen is about *rights assignments* (who gets to decide). If you introduce IIA, the newbies will drown, and the experts will try to prove Sen is just a corollary of Arrow (it isn't; the conditions are logically distinct).

  **The Sequence:**
  1.  **The Intuition (15 mins):** Define the conflict between Efficiency (Pareto) and Liberty (Decisiveness) without notation.
  2.  **The Formal Conditions (15 mins):** Define Weak Pareto and Minimal Liberalism strictly as you stated them.
  3.  **The Example & The Cycle (30 mins):** Walk through the carrying example to generate the intransitivity.
  4.  **The "Arrow Moment" (15 mins):** *Here* you let the experts speak to validate the logic, not the history.
  5.  **Misconceptions & Implications (15 mins):** Address the list.

  **Where to head off the "This is just Arrow" move:**
  Do this immediately after defining the conditions (Minute 30). Say explicitly: *"Arrow asks if there is a voting rule that satisfies certain fairness conditions. Sen asks if we can assign private spheres of influence while maintaining efficiency. Arrow's impossibility comes from the structure of aggregation; Sen's comes from the structure of rights. Do not file this under Arrow. File this under Rights."*

  ### 2. The Carrying Example: "The Loud Radio"

  You are right to avoid Prude/Lewd. It invites moralizing about censorship rather than focusing on the logical structure of *nosiness* (preferences over others' private pairs). You need an example where the "private" pair is physically local to the agent, but the preference ordering is affected by the other agent's state.

  **The Setup:**
  Two neighbours, A and B, in semi-detached houses with thin walls.
  *   **A's Private Sphere:** A decides whether their own radio is **Loud ($L_A$)** or **Quiet ($Q_A$)**.
  *   **B's Private Sphere:** B decides whether their own radio is **Loud ($L_B$)** or **Quiet ($Q_B$)**.

  To generate the paradox, we need three social states (outcomes). We hold one person's action constant to define the "private pair" for the other.
  *   **State $x$:** A is Loud, B is Loud ($L_A, L_B$)
  *   **State $y$:** A is Loud, B is Quiet ($L_A, Q_B$)
  *   **State $z$:** A is Quiet, B is Loud ($Q_A, L_B$)
  *(We ignore the fourth state, Quiet/Quiet, to keep the cycle tight).*

  **The Rights (Minimal Liberalism):**
  *   **A is decisive over $(x, y)$:** In both states, B is Quiet. Only A changes. If A prefers $x$ to $y$, Society must prefer $x$ to $y$.
  *   **B is decisive over $(y, z)$:** *Wait, this doesn't work.* In $y$ A is Loud, in $z$ A is Quiet. B cannot be decisive over a pair where A changes.
  *   *Correction for the Board:* You must define the pairs carefully so only the rights-holder changes.
      *   **Pair 1 (A's Right):** Compare $x$ ($L_A, Q_B$) vs $y$ ($Q_A, Q_B$). (B is Quiet in both).
      *   **Pair 2 (B's Right):** Compare $y$ ($Q_A, Q_B$) vs $z$ ($Q_A, L_B$). (A is Quiet in both).
      *   **Pair 3 (Pareto):** Compare $z$ ($Q_A, L_B$) vs $x$ ($L_A, Q_B$). (Both change).

  *Let's reset the states for maximum clarity on the board:*
  *   **State 1:** A Loud, B Quiet.
  *   **State 2:** A Quiet, B Quiet.
  *   **State 3:** A Quiet, B Loud.

  **The Preferences (The Crux):**
  *   **A's Preferences:** A loves music. A prefers **State 1** (Loud) to **State 2** (Quiet). *However*, A hates noise pollution. A prefers **State 3** (B Loud, A Quiet) to **State 1** (Both Loud).
      *   Ordering: $3 \succ_A 1 \succ_A 2$.
  *   **B's Preferences:** B loves music. B prefers **State 3** (Loud) to **State 2** (Quiet). *However*, B hates noise pollution. B prefers **State 2** (A Quiet, B Quiet) to **State 3** (Both Loud).
      *   *Wait, this breaks the Pareto condition.* We need a unanimous ranking on the third pair.

  **The Working Version (Write this on the board):**
  *   **State $x$:** A Loud, B Quiet.
  *   **State $y$:** A Quiet, B Quiet.
  *   **State $z$:** A Quiet, B Loud.

  *   **A's Right:** Decisive over $x$ vs $y$ (A's volume, B is Quiet). A prefers **$x$** (Loud) to **$y$** (Quiet). $\rightarrow$ **Social: $x P y$**.
  *   **B's Right:** Decisive over $y$ vs $z$ (B's volume, A is Quiet). B prefers **$z$** (Loud) to **$y$** (Quiet). $\rightarrow$ **Social: $z P y$**.
      *   *Note:* This gives us $x P y$ and $z P y$. No cycle yet. We need $y$ to beat one of them.
      *   *Standard Sen Cycle:* A decisive over $(x,y)$, B decisive over $(y,z)$, Pareto over $(x,z)$.
      *   Let's use the standard Sen configuration but with the Radio labels.

  **Final Board Configuration:**
  *   **State $a$:** A Loud, B Loud.
  *   **State $b$:** A Quiet, B Loud.
  *   **State $c$:** A Quiet, B Quiet.

  *   **A's Right (over $a$ vs $b$):** B is Loud in both. A changes. A prefers **$a$** (Loud) to **$b$** (Quiet). $\rightarrow$ **Social $a P b$**.
  *   **B's Right (over $c$ vs $b$):** A is Quiet in both. B changes. B prefers **$c$** (Quiet) to **$b$** (Loud). $\rightarrow$ **Social $c P b$**.
      *   *Still no cycle.* I need the standard cycle: $x P y$, $y P z$, $z P x$.

  **Okay, here is the exact preference profile you must write on the board to make it work.**
  *   **State $x$:** A Reads, B Reads.
  *   **State $y$:** A Reads, B Doesn't.
  *   **State $z$:** A Doesn't, B Reads.
      *(I know you hate Prude/Lewd, but the "Reading" abstraction is the only one that fits the 3-state cycle cleanly without 4-state complications. I will give you the "Garden" variation below that works identically but feels less like reading).*

  **The "Garden Gnome" Variation (Use this):**
  *   **State $x$:** A has Gnome, B has Gnome.
  *   **State $y$:** A has Gnome, B has No Gnome.
  *   **State $z$:** A has No Gnome, B has Gnome.

  *   **A's Right:** Decisive over $x$ vs $z$ (A's garden, B has Gnome). A prefers **$x$** (Gnome) to **$z$** (No Gnome). $\rightarrow$ **Social $x P z$**.
  *   **B's Right:** Decisive over $x$ vs $y$ (B's garden, A has Gnome). B prefers **$x$** (Gnome) to **$y$** (No Gnome). $\rightarrow$ **Social $x P y$**.
      *   *This yields $x$ is best.* No paradox.

  **Stop.** The paradox *requires* that the agents have preferences over the *other's* private pair that conflict with their own private preference.
  **The only way to get the cycle is the specific Sen profile.** I recommend you stick to the abstract labels ($x, y, z$) for the logic, and use the **Radio** example only to explain *why* the preferences might look that way (nosiness), but do not force the Radio example to carry the mathematical weight if it requires 4 states.

  **Recommendation:** Use **Abstract States ($x, y, z$)** for the proof. Use the **Radio** analogy to explain the *preferences*.
  *   **A is decisive over $x$ vs $y$.** (A's private business). A prefers $x$ to $y$.
  *   **B is decisive over $y$ vs $z$.** (B's private business). B prefers $y$ to $z$.
  *   **Pareto:** Everyone prefers $z$ to $x$.
  *   **Result:** $x P y$, $y P z$, $z P x$. Cycle.

  **Why this works:** It isolates the logic. You explain the *plausibility* of the preferences verbally ("A wants to play music ($x$) rather than not ($y$), but A hates B's music even more ($z$ vs $x$)"), but you prove the paradox on the abstract states. This prevents the "But in real life they'd negotiate" objection during the proof phase.

  ### 3. The Misconceptions (Order of Operations)

  Address these in this specific order as they arise during the proof and discussion.

  1.  **"Liberal means Political Liberalism" (Minute 30):**
      *   *When:* As soon as you write "Minimal Liberalism."
      *   *Fix:* "Strip the word of all political theory. Here, 'Liberal' means 'Decisive over a pair.' It is a technical condition about local authority, not a doctrine of justice."
  2.  **"I have a right to stop you" (Minute 45):**
      *   *When:* During the example walkthrough. Students will think A's right over $x/y$ means A can veto B's choice in $z$.
      *   *Fix:* "Minimal Liberalism is not a veto. A cannot stop B from choosing between $y$ and $z$. A only dictates society's ranking between $x$ and $y$. The paradox arises because A's dictate and B's dictate conflict with the group's efficiency."
  3.  **"This is just Arrow" (Minute 60):**
      *   *When:* The Arrow-experts start nodding knowingly.
      *   *Fix:* (See Section 1). "Arrow prohibits a Dictator. Sen *assigns* two mini-dictators (over specific pairs). Arrow is about the impossibility of aggregation; Sen is about the incompatibility of rights and efficiency."
  4.  **"It's about Voting" (Minute 70):**
      *   *When:* Discussion turns to ballots.
      *   *Fix:* "This is about social evaluation, not voting. Even if you appointed a benevolent dictator to maximize welfare, they could not satisfy these two conditions. It is not a mechanical failure of democracy."
  5.  **"Liberalism is Incoherent" (Minute 80):**
      *   *When:* Concluding the implications.
      *   *Fix:* "The theorem does not say Liberty is impossible. It says Liberty *defined as unconditional decisiveness* is incompatible with Pareto Efficiency. You can have liberty if you waive rights (game forms) or restrict preferences (no nosy neighbours)."

  **What you missed:**
  *   **(f) "Preferences are fixed":** Students will argue "A would just pay B to turn the radio off."
      *   *Fix:* "Sen's theorem assumes exogenous preferences. If you allow bargaining, you are doing Coase Theorem, not Social Choice. We are holding preferences fixed to test the logic of rights."

  ### 4. Leveraging the Arrow Experts (The Asset Moment)

  **Time:** Minute 60 (Immediately after drawing the cycle $x P y P z P x$).
  **The Move:** Turn to the half of the room that knows Arrow.
  **The Question:** *"In Arrow's theorem, the cycle is prevented by IIA or Universal Domain restrictions. Here, we have a cycle. Is this a failure of Transitivity in the social ordering, or a failure of the Conditions?"*
  **The Goal:** You want them to confirm for the newbies that **Social Transitivity has broken.**
  **Why:** The newbies need to understand that the *output* of this system is irrational (a cycle), not just that the inputs were difficult. The experts validate that this is a "hard" impossibility (like Arrow), not just a messy example. It gives the newbies confidence that the result is robust, and it gives the experts a job that doesn't involve derailing the lecture with IIA technicalities.

  ### 5. The Final Assessment Question

  Do not ask them to recite the conditions. Ask them to identify the *cost* of the solution.

  **The Question:**
  > "Sen forces us to drop Weak Pareto, Minimal Liberalism, or Universal Domain. If we keep Universal Domain (people can prefer anything) and Weak Pareto (efficiency matters), we must deny Minimal Liberalism.
  >
  > **Does denying Minimal Liberalism mean we must abolish private rights? Or does it mean we must accept that my right to decide X depends on what you prefer?**"

  **What this catches:**
  *   **The Chanters:** Will say "We must abolish rights." (Wrong).
  *   **The Understanders:** Will say "It means rights cannot be *unconditional*. My decisiveness over my private pair might have to yield if it creates a Pareto-inferior cycle. Rights become contingent on the social outcome."
  *   **Why it matters:** This shows they understand that the "expensive move" isn't losing liberty, it's losing the *liberal definition of liberty* as unconditional local dictatorship.

  ### 6. What to Openly Refuse to Explain

  You have 90 minutes. Do not touch the following. If a student asks, write it on a "Parking Lot" side-board and say: *"That is the solution to the paradox, not the paradox itself. We are studying the impossibility today, not the escape routes."*

  1.  **Game Forms vs. Outcomes:** (The Gibbard critique that rights are about actions, not outcomes).
  2.  **Waiving Rights:** (The idea that A can voluntarily give up their decisiveness to break the cycle).
  3.  **Preference Restriction:** (The idea that "nosy" preferences are illegitimate).
  4.  **Resolute Choice:** (David Gauthier's solution).

  **Why:** These are all *ways out*. If you explain them, students will leave thinking the paradox is "solved" rather than understanding the structural tension Sen identified. Keep the tension alive.

  ### Summary Checklist for the Board
  1.  **Left Column:** Weak Pareto (Definition).
  2.  **Middle Column:** Minimal Liberalism (Definition: 2 people, 1 pair each).
  3.  **Right Column:** The 3 States ($x, y, z$) and the Preference Profile (A: $x \succ y$; B: $y \succ z$; Both: $z \succ x$).
  4.  **Bottom:** The Cycle ($x P y P z P x$).
  5.  **Footer:** "Rights $\neq$ Veto" | "Liberal $\neq$ Political" | "Impossibility $\neq$ Incoherence".
