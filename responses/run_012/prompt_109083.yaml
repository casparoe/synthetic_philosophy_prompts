      Some say yes. They say that if you claim to know, you must treat every counter-argument as a standing demand on your attention. To do otherwise is to be arrogant. To do otherwise is to be dogmatic.

      But she saw a trap in that thinking. There is a difference between being dogmatic about a proposition and being dogmatic about your own fallibility.

      Consider the person who is so afraid of being wrong that they never commit to a conclusion. They treat every piece of evidence as inconclusive. They treat every objection as decisive. They believe they must always remain open. This feels like humility. But she taught us that this is its own kind of rigidity. It is a refusal to trust your own eyes. It is a demand for a certainty that human life does not provide.

      If you treat every possibility of error as a reason to stop acting, you cannot cross the street, you cannot marry, and you cannot raise a child. You become paralyzed by the very possibility of being mistaken. That is not wisdom. That is a dogmatism of uncertainty.

      Her career was a defense of the right to stop checking. She argued that there comes a point where the evidence is sufficient. Not perfect. Not immune to error. But sufficient. At that point, you are not ignoring the evidence against you; you are recognizing that you have already weighed it. You have settled the question.

