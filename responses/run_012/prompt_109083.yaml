      Good evening. Looking around this room, I see a fascinating split. On one side, her family, who know her as the woman who will argue for forty-five minutes about the correct route to the airport. On the other side, her colleagues and students, who know her as the philosopher who spent forty years arguing about the correct route to the truth.

      To the family: You call it stubbornness. You remember the holidays where she refused to change the menu, the vacations where she refused to change the itinerary. You saw someone who dug in her heels and refused to move.

      To the colleagues: You call it epistemology. You remember the papers where she refused to concede that skepticism wins by default. You saw someone who dug in her heels and refused to move.

      But I stand here to suggest that both groups are seeing the same thing, and both groups are slightly mistaken about what it is.

