prompt: |-
  I am preparing a paper on the value of originals and want to fix my target before I evaluate anyone's account of it. Take the purpose to be this: a theory good enough to adjudicate, in a principled way, the recurring disputes over whether a copy may stand in for an original — a digital surrogate for a fragile manuscript, an authorized replica on display while the original is in storage, a restoration that replaces most of the original material, an indistinguishable forgery discovered only after decades on the wall.

  Write me the desiderata such a theory must meet. Be specific about the phenomena and the cases it has to get right, the distinctions it must not collapse, the puzzles it must dissolve rather than merely relocate, and the considerations it must remain consistent with (including, for instance, whatever we learn from the market, from conservation practice, and from the fact that we routinely treat some non-art objects — relics, specimens, first editions, source data — as originals whose copies are deficient). State the case or consideration behind each requirement, so that I can see which ones are doing work and which are inherited prejudice.

  Two framings I want you to take seriously, since I suspect much of the literature conflates them. First, keep three questions apart: why we care about the original at all; when a copy fails to do what the original does; and when something's value is diminished by its being a copy (a fake, a replica, a reproduction). A theory may answer one without answering the others, and I want the desiderata to force it to say which it is answering. Second, treat "original" as possibly a relational rather than an intrinsic property, and say what the theory owes us once that possibility is on the table.

  Where you can, flag any pair of desiderata that you suspect cannot be jointly satisfied — that is the part I most want to see — and mark which requirements are non-negotiable and which are commitments of one camp rather than genuine constraints. Keep the weight on the criteria and their motivating cases; a brief scorecard of how the main extant positions do against the list is welcome but secondary.

  Separate what is settled from what is genuinely contested among people who know this topic, and do not present a contested view as the consensus. Where you are unsure whether a requirement is load-bearing or merely customary, say so rather than asserting it. No citations or reading list — I will supply those.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Goal:** Create a set of desiderata for a theory of the value of originals.
      *   **Purpose:** To adjudicate disputes about whether a copy can stand in for an original (surrogates, replicas, restorations, forgeries).
      *   **Key Constraints:**
          *   Be specific about phenomena/cases.
          *   Distinguish distinctions that must not be collapsed.
          *   Dissolve puzzles, not relocate them.
          *   Consistency with market, conservation, non-art objects (relics, etc.).
          *   State the case/consideration behind each requirement (load-bearing vs. prejudice).
          *   **Crucial Framing 1:** Keep three questions apart: (1) Why care about originals? (2) When does a copy fail functionally? (3) When is value diminished by copy-status?
          *   **Crucial Framing 2:** Treat "original" as potentially relational, not just intrinsic.
          *   **Conflict Flagging:** Identify pairs of desiderata that might be incompatible.
          *   **Status Marking:** Distinguish non-negotiable requirements from camp-specific commitments and settled vs. contested views.
          *   **No Citations:** Do not provide a reading list.

  2.  **Deconstruct the Three Questions (Framing 1):**
      *   *Q1: Ontological/Metaphysical:* Why does the specific history/matter of *this* object matter? (Aura, historical testimony, causal chain).
      *   *Q2: Functional/Aesthetic:* Can the copy *do* the job? (Visual experience, information retrieval, ritual function).
      *   *Q3: Normative/Economic:* Does knowing it's a copy lower the value? (Authenticity, trust, market price).
      *   *Desideratum Implication:* The theory must specify which question it answers. A theory explaining Q1 doesn't automatically solve Q3.

  3.  **Deconstruct "Original" as Relational (Framing 2):**
      *   If "original" is relational, it depends on the viewer, the context, or the purpose.
      *   *Desideratum Implication:* The theory must define the relata (Original *for whom*? Original *for what purpose*?). It cannot just say "Object X is the original."

  4.  **Brainstorming Cases & Phenomena:**
      *   *Digital Surrogate:* High fidelity, preserves fragile manuscript. (Functional success, ontological deficit).
      *   *Museum Replica:* Displayed while original is stored. (Functional success, value deficit).
      *   *Restoration:* Ship of Theseus problem. (When does it cease to be original?).
      *   *Forgery:* Indistinguishable visually, discovered later. (Value crash, functional constancy).
      *   *Non-Art:* Relics (bone of a saint), Specimens (type specimen in biology), First Editions (textual variance), Source Data (raw vs. processed).

  5.  **Drafting the Desiderata (Iterative Process):**

      *   *Draft 1 (Mental):* It needs to explain why fakes are bad. It needs to explain why digital copies are okay for reading but not citing. It needs to handle the Ship of Theseus.
      *   *Critique 1:* Too vague. Needs to align with the user's specific constraints (Q1/Q2/Q3 separation, relationality).

      *   *Draft 2 (Structured):*
          1.  Distinguish the three questions.
          2.  Handle the forgery case (indistinguishable but valueless).
          3.  Handle the restoration case (continuity of matter).
          4.  Handle non-art cases (relics).
          5.  Address relationality.
          6.  Check for conflicts (e.g., Materialism vs. Informationalism).

      *   *Refining for "Load-Bearing" vs. "Prejudice":* I need to explicitly state *why* a requirement is there. Is it because the market says so? Or because of a philosophical intuition?
      *   *Refining for Conflicts:* The tension between "Material Continuity" and "Perceptual Indistinguishability" is the big one. If a forgery looks identical, why is it worse? If matter matters, why do we accept restorations?

  6.  **Developing the Specific Desiderata:**

      *   *D1: The Tripartite Separation.* (Directly from prompt).
      *   *D2: The Forgery Puzzle.* (Indistinguishable but valueless).
      *   *D3: The Surrogate Success.* (Digital copies work for some things).
      *   *D4: The Restoration Boundary.* (Ship of Theseus).
      *   *D5: Non-Art Extension.* (Relics/Specimens).
      *   *D6: Relational Specification.* (Original *for* what?).
      *   *D7: Market/Practice Consistency.* (Must align with how conservators/dealers actually act, even if their reasons are murky).

  7.  **Identifying Tensions (The "Conflict Flagging"):**
      *   *Tension A:* Materialism (D4/D5) vs. Perceptualism (D2/D3). If matter matters for relics, why not for paintings? If perception matters for surrogates, why not for forgeries?
      *   *Tension B:* Intrinsic vs. Relational (D6). If originality is relational, does it lose its normative bite?
      *   *Tension C:* Epistemic vs. Ontological (D2). Is the forgery bad because we were lied to (epistemic) or because of its history (ontological)?

  8.  **Structuring the Output:**
      *   Introduction: Acknowledge the scope and the three questions.
      *   Section 1: The Non-Negotiables (Structural requirements).
      *   Section 2: The Phenomenological Constraints (Cases to get right).
      *   Section 3: The Relational Requirement.
      *   Section 4: Conflicts and Trade-offs (Crucial section).
      *   Section 5: Scorecard (Brief, as requested).
      *   Conclusion: Settled vs. Contested.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I separate Q1, Q2, Q3 clearly? *Adjustment:* Make D1 explicitly about this taxonomy.
      *   *Check:* Did I address non-art? *Adjustment:* Ensure D5 covers relics/data specifically.
      *   *Check:* Am I asserting consensus where there is none? *Adjustment:* Use phrases like "Many theorists hold..." or "This is contested..." specifically in the analysis sections.
      *   *Check:* Is the "Relational" point integrated? *Adjustment:* Make it a standalone desideratum (D6) that modifies the others.
      *   *Check:* Am I flagging the incompatibilities? *Adjustment:* Create a dedicated "Incompatibility Matrix" or section.

  10. **Final Polish:** Ensure tone is analytical, rigorous, and avoids prescriptive philosophical posturing (i.e., don't solve the problem, just set the test). Ensure the distinction between "load-bearing" and "customary" is clear in the justification for each desideratum.

      *(Self-Correction on "Scorecard"):* The prompt asks for a "brief scorecard of how the main extant positions do against the list." I need to be careful not to introduce citations/names but describe positions (e.g., "The Materialist View," "The Aesthetic View," "The Institutional View").

      *(Self-Correction on "Settled vs. Contested"):* I need to be explicit about what is actually agreed upon. Actually, in this field, very little is truly settled. I should highlight that the *cases* are settled (e.g., everyone agrees the forgery is less valuable), but the *explanations* are contested.

  11. **Final Review against constraints:**
      *   No citations? Yes.
      *   Specific cases? Yes (forgery, surrogate, restoration, relic).
      *   Three questions separated? Yes.
      *   Relational property addressed? Yes.
      *   Conflicts flagged? Yes.
      *   Load-bearing vs. prejudice stated? Yes.

      *Let's write.*
answer: |-
  Here is a set of desiderata for a theory of the value of originals, structured to meet your specific constraints regarding the three distinct questions, the relational nature of originality, and the identification of theoretical tensions.

  ### I. Structural Desiderata (The Framework)

  These requirements concern the logical architecture of the theory. They are non-negotiable for the specific purpose you stated: adjudicating disputes about substitution.

  **D1. The Tripartite Separation**
  *   **Requirement:** The theory must explicitly state which of the following three questions it answers, and if it claims to answer more than one, it must demonstrate the entailment relations between them:
      1.  **The Ontological Question:** Why does the specific history or matter of *this* object command attention? (Why care at all?)
      2.  **The Functional Question:** Under what conditions does a copy fail to perform the specific work of the original? (When does substitution fail?)
      3.  **The Normative Question:** Under what conditions is an object's value diminished by the knowledge that it is a copy/fake/replica? (When does status diminish worth?)
  *   **Motivation:** A theory might explain why a forgery is ontologically distinct (Q1) without explaining why its market value crashes (Q3), or why a digital surrogate works for reading (Q2) without explaining why it cannot be cited as evidence (Q1). Conflating these leads to theories that solve the wrong problem.
  *   **Status:** **Non-negotiable.** This is a methodological constraint derived from your prompt.
  *   **Load-Bearing:** High. Without this, the theory cannot distinguish between a copy that *cannot* work and a copy that *must not* be used.

  **D2. The Relational Specification**
  *   **Requirement:** If the theory treats "original" as a relational property (Original *for* Agent *A*, *for* Purpose *P*, *in* Context *C*), it must specify the relata. It cannot treat originality as a binary switch inherent to the object.
  *   **Motivation:** A manuscript is an original for the bibliographer (physical evidence) but may be a "copy" of the author's mental text for the literary critic. A relic is an original for the believer but a specimen for the biologist. A theory that treats originality as intrinsic will fail to explain why an object is treated as an original in one context and a mere copy in another.
  *   **Status:** **Contested.** Traditional aesthetics often treats originality as intrinsic (the "aura"). Conservation science treats it relationally (original *for* what analysis?).
  *   **Load-Bearing:** High. This determines whether the theory is universal or context-sensitive.

  ### II. Phenomenological Desiderata (The Cases)

  These requirements ensure the theory maps onto the actual disputes you intend to adjudicate.

  **D3. The Indistinguishable Forgery Constraint**
  *   **Requirement:** The theory must explain the value differential between an undiscovered forgery and a known original, even when they are perceptually identical.
  *   **Case:** A painting hangs in a museum for 50 years. It is revealed to be a perfect modern forgery. Its market value and prestige collapse, though its visual appearance is unchanged.
  *   **Motivation:** This isolates Q3 (Normative) from Q2 (Functional). If the theory relies solely on perceptual experience, it cannot explain the value crash. It must account for historical provenance or "genetic" history as a value component independent of appearance.
  *   **Status:** **Settled Phenomenon, Contested Explanation.** Everyone agrees the value drops. Disagreement exists on whether this is rational (ontological deficit) or irrational (psychological bias).
  *   **Load-Bearing:** High. Any theory that claims "value is purely aesthetic/perceptual" fails here.

  **D4. The Surrogate Success Constraint**
  *   **Requirement:** The theory must account for cases where a copy is deemed an *acceptable* stand-in, without collapsing the distinction between copy and original.
  *   **Case:** A fragile medieval manuscript is digitized. Scholars cite the digital surrogate for textual analysis. The surrogate is "good enough" for reading, but a paleographer must still visit the physical object to analyze ink depth or parchment texture.
  *   **Motivation:** This tests Q2 (Functional). The theory must explain *which* functions transfer to the copy and which remain locked to the original. It prevents the theory from being too absolutist (no copy ever works) or too deflationary (copies are just as good).
  *   **Status:** **Settled Practice.** Conservation and archival standards explicitly differentiate access copies from archival masters.
  *   **Load-Bearing:** High. A theory that cannot distinguish between "reading text" and "analyzing materiality" is useless for adjudication.

  **D5. The Restoration Boundary (The Ship of Theseus)**
  *   **Requirement:** The theory must provide a principled limit on how much material replacement an object can undergo before it loses its status as an original.
  *   **Case:** A painting is 60% overpainted due to damage. A sculpture is recast from the original mold after the original was melted down. A building is rebuilt with new stones after a fire. At what point does the "original" cease to exist?
  *   **Motivation:** This tests Q1 (Ontological). If originality is based on matter, any replacement diminishes it. If it is based on form or continuity, matter matters less. The theory must offer a criterion for "loss of identity" that aligns with conservation ethics (e.g., reversibility, minimal intervention).
  *   **Status:** **Contested.** Conservators often operate on a "continuity of history" model, while purists operate on a "material integrity" model.
  *   **Load-Bearing:** Medium. Crucial for museum practice, less so for market valuation of intact works.

  **D6. The Non-Art Extension**
  *   **Requirement:** The theory must apply consistently to non-art objects where originality commands value, or explain why art is a special case.
  *   **Case:**
      *   *Relics:* A bone of a saint vs. a replica. (Value is historical/causal contact).
      *   *Specimens:* A type specimen in biology vs. a clone. (Value is evidentiary).
      *   *Data:* Raw source data vs. processed dataset. (Value is provenance).
      *   *First Editions:* Textual variance vs. later printings. (Value is historical proximity to author).
  *   **Motivation:** If the theory relies on "aesthetic experience," it fails for relics and data. If it relies on "scarcity," it fails to explain why a forged scarce item is worthless. The theory must identify the common thread (e.g., causal history, testimony, evidence) or admit art is sui generis.
  *   **Status:** **Contested.** Some argue art value is unique (aesthetic autonomy); others argue it is a subset of historical value.
  *   **Load-Bearing:** High. If you want a general theory of "originals," it cannot be art-specific.

  ### III. Consistency Desiderata (External Constraints)

  **D7. Market and Practice Alignment**
  *   **Requirement:** The theory must be consistent with the observable behavior of the art market and conservation profession, even if it critiques their underlying reasoning.
  *   **Case:** The market pays millions for an original and thousands for an authorized replica, even if the replica is visually superior (e.g., newer pigments). Conservators prioritize stabilizing original material over aesthetic reintegration.
  *   **Motivation:** A theory that declares these practices "irrational" without explaining the underlying logic is merely prescriptive, not adjudicative. It must explain *why* these practices persist (e.g., trust, risk mitigation, historical testimony).
  *   **Status:** **Load-Bearing.** If the theory contradicts settled practice without strong normative justification, it is useless for adjudication.
  *   **Note:** This is not an appeal to popularity, but to *institutional reality*. You are adjudicating real disputes, not hypothetical ones.

  ---

  ### IV. Incompatibilities and Trade-Offs

  Here are the pairs of desiderata that I suspect cannot be jointly satisfied without significant theoretical cost. This is the critical stress-test for your paper.

  **Conflict 1: Materialism (D5) vs. Perceptual Functionalism (D4)**
  *   **The Tension:** If you argue that material continuity is essential for originality (to satisfy D5/Restoration), you struggle to explain why digital surrogates are acceptable for research (D4). If the matter matters for the painting, why does the matter not matter for the manuscript text?
  *   **The Trade-off:** To satisfy both, the theory must posit a **pluralism of value**: Materiality matters for *historical testimony* (D5), but information matters for *cognitive access* (D4).
  *   **Risk:** This risks violating D1 (Tripartite Separation) by sliding between Q1 (Ontology) and Q2 (Function) without a clear bridge.
  *   **Verdict:** **Resolvable** only if the theory explicitly distinguishes between *evidentiary value* and *access value*.

  **Conflict 2: The Relational View (D2) vs. The Forgery Constraint (D3)**
  *   **The Tension:** If originality is relational (Original *for* Purpose P), then a perfect forgery *is* an original for the purpose of "visual enjoyment." But D3 requires the theory to explain why the forgery is *deficient* even when undiscovered (or why its value drops upon discovery). If originality is purely relational to the viewer's experience, the discovery of the forgery shouldn't change the object's properties, only the viewer's psychology.
  *   **The Trade-off:** To satisfy both, the theory must claim that one of the "relations" is objective historical causality, not just subjective utility. This pushes the theory back toward an Intrinsic view of history, weakening the Relational claim.
  *   **Verdict:** **High Tension.** A strong Relational View tends to dissolve the "scandal" of the forgery (making it merely a change in context). A strong Forgery Constraint tends to demand an Intrinsic historical property.

  **Conflict 3: Non-Art Extension (D6) vs. Aesthetic Autonomy**
  *   **The Tension:** If you satisfy D6 by finding a common principle for relics, data, and art (e.g., "causal history"), you risk reducing art to mere evidence (instrumentalizing it). If you protect art's uniqueness, you fail D6.
  *   **The Trade-off:** You must decide if the "value of originals" in art is a *species* of historical value or a *genus* of its own.
  *   **Verdict:** **Choice of Camp.** This is not a logical contradiction but a philosophical commitment.

  ---

  ### V. Scorecard of Extant Positions

  A brief assessment of how common theoretical approaches fare against these desiderata.

  | Position | D1 (Separation) | D3 (Forgery) | D4 (Surrogate) | D5 (Restoration) | D6 (Non-Art) | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict Materialism** (Value = Physical Matter) | Pass | Pass | **Fail** | Pass | Pass | Cannot explain why digital surrogates have *any* value. Collapses Q1 and Q2. |
  | **Aesthetic Perceptualism** (Value = Visual Experience) | Pass | **Fail** | Pass | **Fail** | **Fail** | Cannot explain the forgery value crash or why relics matter. |
  | **Institutional Theory** (Value = Status conferred by experts) | **Fail** | Pass | Pass | Pass | Pass | Often circular. Explains *that* a copy fails, not *why* (violates D1). |
  | **Historical Causalism** (Value = Chain of production) | Pass | Pass | **Fail** | Pass | Pass | Struggles with D4 (why accept surrogates?). Strong on D3/D6. |
  | **Pluralist/Relational** (Value = Context-dependent) | Pass | **Mixed** | Pass | **Mixed** | Pass | Best fit, but risks making "originality" too fluid to adjudicate disputes (D7). |

  ### VI. Settled vs. Contested (For your Introduction)

  To ensure you do not present prejudice as consensus, distinguish the following in your paper:

  **Settled (Phenomenological Consensus):**
  *   Undiscovered forgeries are treated as originals; discovered forgeries lose value (D3).
  *   Digital surrogates are acceptable for access but not for material analysis (D4).
  *   Excessive restoration diminishes "original" status (D5).
  *   Relics and specimens command value based on physical continuity, not just appearance (D6).

  **Contested (Theoretical Explanations):**
  *   **The Source of Value:** Is the value of the original intrinsic (in the object's history) or extrinsic (in our psychological response to the history)?
  *   **The Role of Perception:** Is perceptual indistinguishability sufficient for functional substitution, or is there an "aesthetic deficit" in copies even when unseen?
  *   **The Relational Limit:** Is "original" a gradient (more or less original) or a threshold (original or not)?
  *   **Rationality:** Is the preference for originals a rational response to historical testimony or an irrational fetish (the "contagion" heuristic)?

  ### VII. Final Recommendation for Your Paper

  The most load-bearing desideratum is **D1 (Tripartite Separation)**. Most literature fails because it answers Q1 (Why we care) and assumes it has answered Q2 (When copies fail).

  If you force your evaluation to check which question a theory is answering, you will immediately expose where theories are over-claiming. For example, a theory based on "Aura" answers Q1 but cannot adjudicate a dispute about digital surrogates (Q2). A theory based on "Information Fidelity" answers Q2 but cannot explain the forgery market crash (Q3).

  **The "Kill Switch" Desideratum:**
  If I were to select one requirement that will eliminate the most weak theories, it is **D3 (The Indistinguishable Forgery Constraint)** combined with **D1**. Any theory that claims value is solely located in the *present experience* of the object cannot explain why the *past history* (revealed later) changes the value. This forces the theory to account for historical/causal properties, which is the core of the "original."
