  *(Self-Correction)*: Wait, I need to make sure I don't sound *too* cynical. If I say "it's all flawed," no one votes. I need to pivot to "it's flawed, but *participation* fixes the flaws." That's the key.

  8.  **Final Polish of the text.** (Proceeds to generate output).

  *(Post-Drafting Check)*: Does this address the Gibbard-Satterthwaite tension? Yes, by acknowledging it explicitly but dismissing its practical utility for the individual voter due to information asymmetry. Does it appeal to the Dean? Yes, by emphasizing stability and participation. Does it keep the humanists? Yes, by avoiding math.

