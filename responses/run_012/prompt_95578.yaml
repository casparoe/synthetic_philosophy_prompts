answer: |-
  Good morning. As many of you know, the committee I chair has recommended a shift to ranked-choice ballots for our upcoming departmental elections. You should have the new templates in your inbox.

  I want to use these five minutes to tell you why we did this, and more importantly, to tell you what this system *cannot* do.

  I am aware that roughly half of this room could prove the Gibbard–Satterthwaite theorem on a napkin before their coffee gets cold. I am also aware that the other half of this room will tune out the second I say "theorem." So, let me translate.

  The mathematical truth is this: There is no perfect voting system. If we have three or more candidates, and we want a result that isn't dictated by a single person, there will always be scenarios where a voter could benefit by ranking a candidate lower than they actually prefer. In technical terms, no system is perfectly strategy-proof.

  I am not standing here to tell you that ranked ballots solve this. I am not going to stand here and say, "Just rank honestly and the math guarantees a fair outcome." That would be a lie. The math guarantees no such thing.

  So, why are we doing this?

  We are doing this because while perfection is impossible, improvement is not. The alternative—plurality voting, where you pick one name—is far more brittle. It creates spoiler effects. It forces you to vote against someone rather than for someone. It collapses the nuanced reality of this department into a binary switch.

  We chose ranked ballots not because they are immune to gaming, but because they are resilient to it.

  Now, I know the question on everyone's mind: "Should I strategize?"

  Here is the practical reality. Yes, you *can* game the system. But to game it effectively, you need information you do not have. You would need to know exactly how every other colleague intends to vote so you can calculate the marginal utility of your second choice versus your first. You would need to run the simulation in your head while the rest of us are trying to have lunch.

  In the absence of perfect information, the most rational strategy is actually to vote your genuine preference. Trying to outsmart the aggregate without knowing the aggregate is how you end up with a result you like even less.

  I am not selling you a miracle. I am selling you a tool that allows for more expression. It allows you to say, "I want Candidate A, but I can live with Candidate B, and Candidate C is unacceptable." That is a richer sentence than our old ballots allowed us to speak.

  I also want to address the elephant in the front row. Governance requires legitimacy. A voting system only works if the losers accept the result. Ranked choice tends to produce winners who are broadly acceptable, rather than merely polarizing. It rewards coalition-building over factionalism. For a department that needs to function on Friday the way it did on Monday, that stability is worth the theoretical trade-offs.

  So, here is my request.

  Do not look at this ballot and think, "How do I beat the system?" The system is just a box we put our collective judgment into. If the box is slightly imperfect, it is up to us to make the contents count.

  The only way this system fails is if you decide your vote doesn't matter because the math isn't pure. That is a self-fulfilling prophecy. A flawed system with high turnout is infinitely better than a theoretically perfect one that nobody uses.

  We are asking you to rank. We are asking you to participate. We are asking you to trust that your colleagues are doing the same.

  Please fill out the ballot. Please return it by Tuesday. And please, vote for the people you actually want to work with, not the people you think the algorithm wants to see.

  Thank you.
