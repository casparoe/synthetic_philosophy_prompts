          1.  **Leximin:** Maximizes the worst-off, then the second worst-off, etc.
          2.  **Strong Prioritarianism:** Maximizes $\sum f(w_i)$ where $f$ is strictly concave and sufficiently steep to satisfy Verdict 3.

