              *   Professor prefers A. This implies she cares about equality *above* the worst-off, or at least dislikes inequality among the better-off even if the worst-off is unchanged. This contradicts strict Prioritarianism (which only cares about weighted well-being) unless the weighting function is extremely sensitive, but usually, prioritarianism is indifferent to distribution if totals and individual levels are fixed *unless* it's applied to a specific transformation. Actually, standard Prioritarianism (concave transformation) *would* prefer $(10, 30, 30)$ over $(10, 20, 40)$ because $f(30) + f(30) > f(20) + f(40)$ for a concave $f$. So this is consistent with Prioritarianism.
