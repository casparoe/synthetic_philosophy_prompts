          *   **Prioritarianism Check:**
              *   Requires a concave transformation function $f(w)$.
              *   Is $f(30) + f(30) > f(20) + f(40)$?
              *   By Jensen's Inequality, for any strictly concave function, the average of the function is greater than the function of the average. Since $\{30, 30\}$ is less spread than $\{20, 40\}$ around the same mean (30), any concave $f$ will prefer $\{30, 30\}$.
              *   So **Prioritarianism** also fits this verdict.
          *   **Utilitarianism Check:**
