answer: |-
  Here is the specification list for an adequate theory of the badness of pain, broken down by the phenomena it must capture, the distinctions it must maintain, and the tensions that make the job difficult.

  ### The Spec: Requirements for Adequacy

  To count as adequate, a theory must satisfy the following five constraints. I have categorized them by the empirical or intuitive data they are built to preserve.

  **1. The Asymbolia Constraint**
  *   **The Case:** Patients with insular cortex lesions report feeling pain (they can localize it and rate intensity) but exhibit no distress, no withdrawal reflex, and no preference for it to stop. They treat pain like an itch or a neutral touch.
  *   **The Requirement:** The theory must explain the dissociation between *detecting* damage and *minding* damage. It must either:
      *   (A) Deny that asymbolics are in "pain" (reclassifying it as mere nociception), or
      *   (B) Admit they are in pain but deny that pain is *intrinsically* bad.
  *   **Status:** **Non-Negotiable.** This is empirical data. A theory that ignores it is phenomenologically blind.

  **2. The Affective/Sensory Dissociation**
  *   **The Case:** Hypnosis and certain analgesics (like morphine) can leave the sensory intensity of pain intact while removing the "suffering" component. Conversely, anxiety can amplify suffering without changing the sensory input.
  *   **The Requirement:** The theory must locate the badness in the *affective/motivational* component, not the *sensory/discriminative* component. Badness must track unpleasantness, not intensity.
  *   **Status:** **Non-Negotiable.** This follows from the Asymbolia constraint but applies to neurotypical subjects as well.

  **3. The Non-Conceptual Creature Constraint**
  *   **The Case:** Human infants and non-human animals clearly suffer from pain and have moral status regarding that suffering, yet they lack complex propositional attitudes (e.g., they cannot form the desire "I prefer that this sensation cease" in a linguistic or conceptual sense).
  *   **The Requirement:** The theory must account for the badness of pain for beings without higher-order cognition. It cannot define badness solely in terms of frustrated *explicit* desires or violated *rational* preferences.
  *   **Status:** **Non-Negotiable.** If a theory implies infants don't suffer badly because they lack concepts, the theory is ethically unusable.

  **4. The Masochism/Context Constraint**
  *   **The Case:** Marathon runners, religious flagellants, and sexual masochists seek out or willingly endure pain. They often describe it as "good" or "rewarding."
  *   **The Requirement:** The theory must explain how pain can be sought without denying its local badness. It must distinguish between *instrumental value* (good because it leads to fitness/salvation) and *intrinsic disvalue* (bad in itself). Alternatively, it must explain why the pain in these cases loses its badness entirely.
  *   **Status:** **Negotiable (Camp Prejudice).** Some theories insist pain is *always* intrinsically bad (even for the masochist); others argue the context changes the phenomenal character so it isn't "pain" anymore. A theory can survive either way, provided it is consistent.

  **5. The Functional Consistency Constraint**
  *   **The Case:** Congenital Insensitivity to Pain (CIP) results in early death due to unchecked injury. Pain is evolutionarily selected for because it is aversive.
  *   **The Requirement:** The theory must be consistent with pain's protective role. The badness of pain should not make its utility inexplicable (e.g., if pain were *too* bad, it would be maladaptive paralysis; if it weren't bad, it wouldn't protect).
  *   **Status:** **Negotiable.** A theory of *badness* doesn't strictly have to explain *utility*, but it shouldn't contradict it.

  ---

  ### The Tensions: Where the Spec Breaks

  You suspected there are incompatible requirements. You are right. There is a "Impossible Trinity" here. You can satisfy any two, but satisfying all three forces significant theoretical gymnastics.

  **1. Intrinsic Badness vs. Asymbolia**
  *   **The Tension:** If pain is *intrinsically* bad (bad in virtue of its phenomenal feel alone), then anyone feeling pain is suffering something bad. Asymbolics feel pain but do not suffer.
  *   **The Conflict:** To save **Intrinsic Badness**, you must claim asymbolics aren't *really* in pain (they are feeling "pain*"). To save the **Asymbolia Constraint** (accepting they feel pain), you must deny Intrinsic Badness (admitting pain is only bad if you mind it).
  *   **Verdict:** This is the central philosophical friction point. Most modern theories sacrifice Intrinsic Badness to save the Asymbolia data.

  **2. Desire/Attitude Theories vs. Non-Conceptual Creatures**
  *   **The Tension:** If the badness of pain consists in the frustration of a desire (e.g., "I desire not to feel this"), you need a subject capable of having that desire.
  *   **The Conflict:** To save **Desire Theory**, you must attribute complex desires to infants/animals (which seems cognitively demanding). To save the **Non-Conceptual Constraint**, you must water down "desire" to mere "aversion," at which point the theory collapses into a simple Affective Theory.
  *   **Verdict:** This is the graveyard for sophisticated cognitive theories.

  **3. Masochism vs. Intrinsic Badness**
  *   **The Tension:** If pain is intrinsically bad, why seek it?
  *   **The Conflict:** This is easier to resolve than the others. You can argue the pain is locally bad but globally good (instrumentalism). However, if the masochist says "it doesn't hurt in a bad way," you return to the Asymbolia problem: is it still pain?
  *   **Verdict:** Manageable, but requires nuance regarding "local" vs. "overall" value.

  ---

  ### The Killer Constraint

  You guessed **Asymbolia**. You are mostly right, but to be precise: it is the **Affective/Sensory Dissociation** (of which Asymbolia is the clinical proof) that does the most damage.

  **Why?**
  It instantly kills **Simple Sensory Hedonism**.
  Any theory that identifies pain *solely* with a specific sensory quality (like a "sharp, burning sensation") and claims that sensation is *inherently* bad is falsified by asymbolia and hypnosis. If the sensation exists without the badness, the sensation cannot *be* the badness.

  This forces every surviving theory to adopt a **Dual-Component View** (Pain = Sensation + Affective Reaction) or an **Imperative/Perceptual View** (Pain = A command or representation of bodily damage). It forces the debate away from "what does pain feel like?" to "what is the mind *doing* when it feels pain?"

  **Runner Up:** The **Non-Conceptual Creature Constraint** is the second biggest killer. It wipes out high-level **Desire Satisfaction Theories**. If your theory requires the subject to conceptualize their state to suffer, you have to tell a parent that their screaming infant isn't suffering "badly" in the moral sense. That is a bullet most philosophers will not bite.

  ---

  ### Scorecard: How the Contenders Fare

  Here is how the main contenders stack up against your spec. You can use this to drive the class discussion.

  **1. Simple Sensory Hedonism**
  *   *View:* Pain is a specific sensation, and that sensation is intrinsically bad.
  *   *Score:* **Fails.**
  *   *Why:* Collapses under **Asymbolia** and **Affective/Sensory Dissociation**. It cannot explain how the sensation remains while the badness vanishes.

  **2. Desire/Attitude Theories**
  *   *View:* Pain is bad because we have a concurrent desire/aversion for it to stop.
  *   *Score:* **Mixed.**
  *   *Why:* Handles **Asymbolia** well (asymbolics lack the aversion). Handles **Masochism** well (masochists lack the aversion). **Fails** (or struggles with) **Non-Conceptual Creatures**. Does an infant have a propositional attitude? If you say "no," infants don't suffer. If you say "yes," you stretch the definition of "desire" until it breaks.

  **3. Imperative/Perceptual Theories**
  *   *View:* Pain is a perceptual experience that represents bodily damage and commands you to act (e.g., "Don't do that!"). Badness is the force of the command.
  *   *Score:* **Strong.**
  *   *Why:* Handles **Asymbolia** (the command is issued but not heeded/cared about). Handles **Infants** (no concepts needed for imperative signals). Handles **Function** (commands are naturally protective).
  *   *Weakness:* Struggles with **Masochism**. Why would the body issue a "Stop!" command that the agent ignores happily? (Requires explaining why the command is present but the authority is overridden).

  **4. Evaluativism**
  *   *View:* Pain represents bodily damage *as bad*. The badness is part of the content of the experience.
  *   *Score:* **Strong.**
  *   *Why:* Handles **Infants** (non-conceptual content). Handles **Asymbolia** (asymbolics have the sensory representation but lack the evaluative component).
  *   *Weakness:* Can feel like it relocates the problem. *Why* does the experience represent it as bad?

  ### Summary for the Unit
  If you want to nail the spec before teaching the theories, teach the **Asymbolia Constraint** and the **Non-Conceptual Constraint** as the pincers.
  *   Theories that focus on **Sensation** get crushed by Asymbolia.
  *   Theories that focus on **Cognition/Desire** get crushed by Infants.
  *   The surviving theories are the ones that find a middle ground (Affect, Imperatives, or Non-Conceptual Evaluation).

  That is the landscape they need to see before they read the first paper.
