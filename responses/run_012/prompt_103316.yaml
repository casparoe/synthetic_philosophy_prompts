answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee
  **FROM:** [Your Name]
  **DATE:** 24 October 2023
  **SUBJECT:** Opinion on the Proposed 'Ceiling Rule' for Grade Awarding

  **1. Introduction**

  This memo concerns the proposal put forward by the Working Group to introduce a hard cap on the proportion of top grades awarded in any given subject (the 'ceiling rule'). Under the current 'comparable outcomes' approach, we maintain stability in grade distributions over time. The new proposal seeks to go further by fixing a maximum percentage for the highest grade (e.g., 8%), regardless of the absolute performance of the cohort.

  The stated aim is to reduce the disparity in top-grade attainment between high-performing selective/independent schools and the rest of the sector. The Working Group argues that the widening gap is a defect in the system, irrespective of whether the absolute performance of lower-attaining schools improves.

  Having reviewed the paper and consulted with colleagues, my recommendation is that the Committee **reject the ceiling rule in its current form**. While the moral intuition driving the proposal is sound, the mechanism chosen is ethically problematic and practically liable to produce perverse outcomes. Below I set out the reasoning, engaging first with the strength of the Working Group's position before detailing the specific objections.

  **2. The Strength of the Egalitarian Case**

  We must begin by acknowledging the force of the Working Group's argument. There is a serious philosophical position which holds that inequality is intrinsically bad. On this view, a society (or system) where the gap between the best-off and the worst-off widens is defective, even if the worst-off are not absolutely deprived.

  In the context of examinations, this translates to a concern about legitimacy. If the top grade becomes the exclusive preserve of a specific type of school due to resource advantages rather than student ability, the certificate loses its value as a national currency. It begins to signal background privilege rather than attainment. If the gap between a grammar school and a comprehensive grows year-on-year, it creates a perception that the ladder is being pulled up. Reducing that gap can restore faith in the system's fairness. The Working Group is correct to identify that unchecked stratification undermines social cohesion and the perceived meritocracy of the qualification.

  **3. The Ethical Problem: Levelling Down**

  However, the specific mechanism proposed—capping the top without raising the bottom—raises a distinct ethical difficulty. We must be clear about what this rule does. It does not transfer marks from high performers to low performers. It does not fund better teaching in underperforming centres. It simply withholds the top grade from a portion of the highest-performing students once the 8% threshold is reached.

  This creates a situation where some individuals are made worse off, and no one is made better off in absolute terms.

  We must ask ourselves: is the system genuinely 'better' if we achieve equality by suppressing the top, when the bottom remains stationary? There is a difference between *fairness of opportunity* and *equality of outcome*. If we reduce the inequality of outcome by handicapping those who have succeeded through the existing rules, we are not addressing the root cause of the disparity (resource inequality, teaching quality, socioeconomic factors). We are merely masking it.

  Furthermore, grades serve a functional purpose: they discriminate between candidates for universities and employers. If we artificially compress the top end of the distribution, we reduce the informativeness of the grade. A university trying to distinguish between the top 1% and the top 8% will no longer be able to do so using our grades. They will inevitably seek other markers (private admissions tests, interviews), which often favour the wealthy even more than the exam system does. Thus, the rule may inadvertently increase reliance on metrics that are less transparent and more easily gamed by privilege.

  **4. Practical Consequences and Gaming**

  Beyond the ethical architecture, there are practical risks that threaten to undermine the very students the rule is intended to protect.

  **4.1. Market Distortion and Entry Shifting**
  The proposal applies to this exam board. It does not apply to competitors, nor necessarily to all subjects. High-performing centres (independent and grammar schools) have the administrative capacity to shift their entries. If they perceive that our board imposes a 'glass ceiling' on their students, they may move their entries to boards without such caps, or to subjects where the cap does not bind.

  **4.2. The Impact on Remaining Cohorts**
  If high-performing schools exit, the statistical profile of our entries will change. More critically, the schools that *cannot* move—often the state comprehensives with less administrative bandwidth—will remain in our system. They will then be subject to the cap, competing against a smaller pool, but without the benefit of the high-performing cohort that might have raised the overall subject prestige.

  Consequently, the rule risks penalising the students in the centres least able to navigate the bureaucracy to avoid it. The 'ceiling' would bite hardest on the students who lack the option to switch boards. This turns a measure designed to promote equity into one that potentially exacerbates disadvantage.

  **5. Incentives and Signalling**

  Finally, we must consider the signalling effect on students and teachers. A system that tells a student they have achieved the academic standard for the top grade, but denies them the certification because their peers did too well, is difficult to defend. It severs the link between absolute achievement and reward.

  While the Working Group argues that shrinking the gap is a good in itself, we must weigh this against the demotivating effect on high attainment. If the top grade is perceived as a lottery limited by quota rather than a benchmark of mastery, the incentive to stretch the most able learners diminishes. We should be aiming to raise the floor, not lower the ceiling.

  **6. Recommendation**

  The Working Group has correctly identified a symptom (widening inequality) but prescribed a remedy that treats the certification rather than the disease.

  I recommend that the Committee **reject the ceiling rule**.

  To adopt it would be to endorse a form of 'levelling down' that harms high achievers without materially benefiting low achievers, while risking market distortion that could leave our most vulnerable centres exposed.

  **7. Proposed Alternative Path**

  In rejecting the rule, we should not ignore the underlying concern. I propose we commission a working group to investigate **contextualised reporting** instead of hard caps.

  *   **Modification:** Rather than capping grades, we provide universities and employers with contextual data regarding the performance of the centre and the socioeconomic background of the cohort alongside the grade.
  *   **Timeline:** This data framework could be developed over the next academic year, for implementation in the 2025/26 cycle.
  *   **Benefit:** This preserves the integrity of the grade (rewarding absolute attainment) while allowing selectors to understand the context of that attainment. It addresses the 'unjust spread' by illuminating the structural advantages at play, without punishing the individual student for the success of their school.

  **Summary of Vote Request:**
  1.  **Reject** the proposal for a hard cap on top grades.
  2.  **Approve** the formation of a task force to explore contextualised data reporting as a more robust method of addressing sector inequality.

  I am available to discuss the ethical nuances of this position further at Tuesday's meeting.
