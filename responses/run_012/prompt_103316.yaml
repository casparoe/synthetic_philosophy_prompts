prompt: |-
  Ok, slightly unusual one for you. I'm a philosophy lecturer, but I also sit on the standards committee of an exam board — the body that signs off each year on the rules for how grades get awarded. There's a proposal in front of us for next summer and I have to circulate a written opinion before Tuesday's meeting. Would you draft it for me?

  Background: our current awarding approach is basically 'comparable outcomes' — we hold the proportion of each grade roughly steady year to year so the standard doesn't drift. A working group now wants to go further. Their proposal (they're calling it the ceiling rule) would put a hard cap on the share of the top grade in each subject — say 8% of entries — on the grounds that the current spread between schools is unjust and that no school ought to be able to pull ahead of the rest. It would bite hardest on the selective and independent schools and the grammars, where 25–30% of entries currently get the top grade. Crucially, it wouldn't put a single extra mark in the hands of the kids at the bottom — their grades stay exactly where they'd otherwise have been. The working group's line is that shrinking the gap is a good in itself, full stop, and that a system where the gap yawns wider each year is defective even if nobody at the bottom is any worse off.

  Half my colleagues are queasy and can't articulate why. I think I can, but I want the memo to be fair to the other side, because there's a serious version of their view and I won't strawman it.

  What I need: the written opinion I'll circulate. It should end with a clear recomendation — adopt the ceiling rule, reject it, or adopt a modified version (and if modified, exactly what changes and over what timeline). It should engage properly with the strongest case for the working group, the idea that the inequality is itself the defect. Then say what, if anything, is actually wrong with levelling the top down when the bottom gains nothing — and be careful to separate the different things the proposal might be doing: pure levelling down, versus making the top grade more informative for universities, versus shifting incentives. Don't turn it into a philosophy seminar, but make the reasoning tight enough that the non-philosophers on the commitee can follow it and vote on it. There's an obvious named position in the literature that does a lot of work here; I'm not going to name it, partly because I want to see whether the memo lands on it rather than just parrots it. And please write it in British English — no Americanising 'levelling' for anyone.

  One more thing to weigh: a few schools will simply enter pupils for boards and subjects where the cap doesn't bind, so there's a real chance the rule ends up hitting the students it's meant to help. Factor that in.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy lecturer and member of an exam board standards committee.
      *   **Task:** Draft a written opinion/memo for circulation before Tuesday's meeting regarding a proposal called the "ceiling rule."
      *   **Proposal:** Cap the top grade (e.g., A*) at a fixed percentage (e.g., 8%) per subject to reduce inequality between schools.
      *   **Current System:** Comparable outcomes (stable grade distributions year-to-year).
      *   **Key Ethical Issue:** The proposal is a classic "levelling down" scenario. It reduces the top without raising the bottom. The working group argues inequality itself is the defect.
      *   **Requirements:**
          *   British English (specifically "levelling").
          *   Clear recommendation (Adopt, Reject, or Modify).
          *   Engage fairly with the strongest case for the proposal (egalitarianism).
          *   Identify what is wrong with levelling down (without necessarily naming the "Leveling Down Objection" explicitly, though hinting at it strongly).
          *   Distinguish between pure levelling, informativeness for universities, and incentives.
          *   Address the risk of gaming (schools moving to uncapped boards/subjects).
          *   Tone: Professional, reasoned, accessible to non-philosophers, tight reasoning.
          *   Deadline context: Before Tuesday's meeting.

  2.  **Deconstruct the Ethical Landscape:**
      *   *The Working Group's View:* Egalitarianism. Specifically, Telic Egalitarianism (inequality is bad in itself). They believe a narrower gap signals a fairer system, regardless of absolute welfare.
      *   *The Counter-View:* Prioritarianism or Sufficientarianism. We should care about the absolute position of the worst off, not just the relative gap. Also, the "Leveling Down Objection" (LDO): It seems absurd to say a situation is *better* in at least one respect if some people are made worse off and no one is made better off.
      *   *Practical Consequences:*
          *   Top students lose out (signal value of grade diminishes).
          *   Bottom students gain nothing.
          *   Gaming: High-performing schools might switch exam boards or subjects to avoid the cap, potentially destabilizing the market and leaving vulnerable students in capped boards.
          *   University Admissions: If the top grade is capped artificially, it loses discriminative power for elite universities.

  3.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose, summarize the proposal, and state the recommendation upfront (or at the end? The prompt says "It should end with a clear recommendation"). Okay, recommendation at the end.
      *   **The Case for the Ceiling (Steel-manning):** Acknowledge the moral intuition behind the proposal. Inequality *does* matter. It affects social cohesion and perceived legitimacy. If the gap grows solely due to resource advantage, that's unjust.
      *   **The Ethical Problem (The Core):** Address the "levelling down" aspect. Why is it counter-intuitive? Because it harms some to help no one. Distinguish between *equality of outcome* and *fairness of opportunity*.
      *   **Instrumental/Practical Concerns:**
          *   *Informativeness:* Universities need to distinguish between the top 8% and the top 1%.
          *   *Incentives:* Does this motivate lower schools? Or does it demotivate high flyers?
          *   *Gaming:* The escape route problem.
      *   **Recommendation:** Reject the hard cap. Propose a modification (e.g., focus on raising the floor, or context-based flagging rather than hard caps).

  4.  **Refining the Argument (The "Philosophy Lecturer" Touch):**
      *   *Avoid Jargon:* Don't say "Telic Egalitarianism" or "Parfit's Leveling Down Objection." Instead, describe the logic: "Is a state of affairs better simply because it is more equal, even if it makes some worse off and no one better off?"
      *   *British English:* Ensure "levelling," "programme," "centre," etc., are correct.
      *   *Tone:* Collegial but firm. "Queasy colleagues" need articulation, not just validation.

  5.  **Addressing the Specific Constraints:**
      *   *Gaming:* Must mention that schools might exit the system, hurting the remaining cohort.
      *   *Distinction:* Separate the symbolic value of equality from the practical value of the grade.
      *   *Recommendation:* Needs to be specific. "Reject" is safest, but "Modify" shows constructive engagement. A modified version might be "contextualised data" rather than "hard caps." Let's go with **Reject the hard cap, propose alternative measures for equity.** A hard cap is too blunt.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      *   Intro: Proposal is to cap A* at 8%.
      *   Pro side: Inequality is bad. It looks unfair when rich schools dominate.
      *   Con side: It hurts top kids, helps no one. This is the "levelling down" problem. Also, universities can't tell who is best.
      *   Gaming: Schools will leave.
      *   Conclusion: Don't do it. Find another way to help low performers.

  7.  **Drafting - Iteration 2 (Adding Nuance & Tone):**
      *   Need to make the "levelling down" point sharp. "If we burn the harvest to make the field look uniform, have we improved the field?"
      *   Need to acknowledge the Working Group's sincerity. They aren't malicious; they care about social justice.
      *   Need to ensure the recommendation is actionable.

  8.  **Final Polish (checking against prompt):**
      *   *British English:* Check spellings (levelling, programme, centre).
      *   *No naming the theory:* Describe the LDO without calling it "The Leveling Down Objection."
      *   *Gaming:* Include the risk of entry shifting.
      *   *Recommendation:* Clear and at the end.

  9.  **Writing the Memo:** (Self-Correction during drafting)
      *   *Correction:* I initially thought about suggesting a modified cap. But a cap is inherently a cap. If I suggest raising the floor, that's a different policy. The prompt asks to adopt, reject, or adopt modified. A "modified ceiling" is contradictory. Better to recommend rejecting the ceiling but adopting *other* measures to address the underlying concern (equity). Or, perhaps a "soft cap" with contextual overrides? No, let's stick to rejecting the hard cap as it fundamentally misunderstands the purpose of certification. The modification should be about *how* we address inequality, not tweaking the cap. Actually, the prompt says "if modified, exactly what changes". A modified version of the *proposal* might be a phased approach or a different metric. But the ethical objection is fundamental. I will recommend **Rejecting the ceiling rule** but **Adopting a complementary strategy** to address the inequality concern. Wait, strictly speaking, that's rejecting the proposal. Let's recommend **Rejecting the hard cap** but **Commissioning a review on contextualised reporting**. That fits "modified version" of the *approach to standards*.
      *   *Wait, re-reading prompt:* "adopt the ceiling rule, reject it, or adopt a modified version (and if modified, exactly what changes...)"
      *   *Decision:* I will recommend **Rejecting the ceiling rule**. It's the philosophically honest position. A modified cap is still a cap. I will suggest alternative measures in the "Next Steps" but the vote should be on the rule.
      *   *Wait, one more check:* The prompt asks to engage with the idea that inequality is the defect. I need to make sure I don't just dismiss it. I need to explain why *this specific mechanism* fails to address it constructively.
      *   *Gaming:* Make sure to highlight that the students remaining in the capped board are the ones who lose out (often the less advantaged who can't switch schools/boards).

  10. **Final Review against constraints:**
      *   British English? Yes.
      *   No named theories? Yes.
      *   Clear recommendation at end? Yes.
      *   Address gaming? Yes.
      *   Address "levelling down" logic without naming it? Yes.

