answer: |-
  This is one of the deepest rabbit holes in social science, and you are right to be suspicious. Your PM is proposing **Utilitarian Aggregation** (summing/averaging utility), but they are treating it like a measurement problem when it is actually a metaphysical and ethical one.

  Here is the breakdown of why you can't just average the numbers, mapped to the conceptual machinery you need to explain it.

  ### 1. The Core Conceptual Issue: Structure vs. Calibration

  You hit on the Ordinal/Cardinal distinction, but that is only half the battle. That distinction describes the **internal structure** of a single person's scale. The real blocker is **Interpersonal Comparability**.

  Think of your users as thermometers.
  *   **Ordinal:** The thermometer goes up when it gets hotter. (Preference ranking).
  *   **Cardinal:** The distance between 10° and 20° is the same "amount of heat change" as 20° to 30°. (Intensity of preference).
  *   **Comparability:** Does 20° on Thermometer A represent the same physical state as 20° on Thermometer B?

  **Within-Person Meaning (Cardinality):**
  If I rate Movie A a 10 and Movie B a 5, and my scale is cardinal, it means the *difference* in satisfaction between A and B is meaningful. I prefer A to B by a specific magnitude. I can make trade-offs under risk (e.g., "I'd take a 50% chance of A over a guaranteed B").

  **Across-Person Meaning (Comparability):**
  Even if we both have perfect cardinal scales, we have no shared "Zero Point" and no shared "Unit Size."
  *   **Zero Point:** My "0" might be "Misery," while your "0" is "Meh."
  *   **Unit Size:** My "1 point" of joy might be a dopamine spike; your "1 point" might be a mild nod.

  If you average my 10 and your 2, you are implicitly asserting that **my unit of joy is identical to your unit of joy.** There is no physical instrument that measures this. Asserting it is not a measurement fact; it is a political declaration that our internal experiences are fungible.

  ### 2. The Mapping: Assumptions $\rightarrow$ Allowed Aggregation Rules

  In social choice theory (specifically the work of Amartya Sen and John Roberts), we classify informational assumptions by what transformations the numbers can survive without changing the "truth."

  Here is the hierarchy of assumptions and which aggregation rules they permit.

  | Assumption Level | What the Numbers Mean | Admissible Transformations | **Allowed Aggregation Rules** | **Ruled Out Rules** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ordinal Non-Comparability (ONC)** | Only rankings matter. No intensity, no cross-person comparison. | Any independent increasing function (e.g., User A: $x \to x^2$, User B: $x \to \log x$). | **Pareto Principle** (if everyone prefers X, pick X).<br>**Majority Voting**.<br>**Borda Count**. | **Utilitarian Sum** (Averaging).<br>**Rawlsian Max-Min** (needs level comparison). |
  | **Cardinal Non-Comparability (CNC)** | Intensity matters for me, but not vs. you. | Any independent linear function (e.g., User A: $x \to 2x$, User B: $x \to x + 5$). | **Kaldor-Hicks Efficiency** (potential compensation).<br>**Nash Social Welfare** (product of gains). | **Utilitarian Sum** (units don't match).<br>**Direct Equity Comparisons**. |
  | **Cardinal Unit Comparability (CUC)** | Intensity matches across people. Zero points differ. | Common linear transformation (e.g., Everyone: $x \to 2x + 5$). | **Utilitarian Sum** (Averaging works).<br>**Difference Principle** (inequality measurement). | **Level Comparisons** (Who is happier overall?). |
  | **Cardinal Full Comparability (CFC)** | Intensity AND Zero Points match. | Identity transformation only (or common shift). | **Utilitarian Sum**.<br>**Rawlsian Max-Min** (Who is worst off?).<br>**Equity-Weighted Sums**. | None (within welfarism). |

  **The Takeaway for your PM:**
  To simply **average** the ratings, you must assume at least **Cardinal Unit Comparability (CUC)**. You are asserting that a 1-point increase for User A is socially equivalent to a 1-point increase for User B. If you only have Ordinal data (rankings), averaging is mathematically meaningless (like averaging jersey numbers).

  ### 3. The Paradox: How More Information Rules Out Rules

  Your friend's claim sounds backwards because in most engineering contexts, more data = more flexibility. In social choice, the logic relies on **Invariance**.

  An aggregation rule is valid only if it produces the same social outcome regardless of how we represent the underlying information, provided the representation is "informationally equivalent."

  *   **Scenario A (Less Info):** We assume data is **Ordinal**.
      *   *Constraint:* The rule must work even if User A decides to scale their 1-10 ratings to 1-1,000,000 arbitrarily.
      *   *Result:* This is a **very strict constraint**. It rules out Utilitarian Summation immediately, because summing depends on the specific units.
      *   *Outcome:* Very few rules survive (mostly voting).

  *   **Scenario B (More Info):** We assume data is **Cardinal & Comparable**.
      *   *Constraint:* The rule must work even if we all agree to switch from Celsius to Fahrenheit (linear shift).
      *   *Result:* This is a **looser constraint**. Summation survives this test.
      *   *Outcome:* More rules are allowed.

  **So why did your friend say the opposite?**
  They are likely referring to **Normative Information**, not Measurement Information.
  If you add *ethical* information to the mix (e.g., "User A has a Right to Privacy"), you **rule out** aggregation rules that violate that right (like Pure Utilitarianism, which might sacrifice A's privacy for the group's happiness).
  *   **Measurement Info:** More measurability $\rightarrow$ *Allows* more rules (relaxes invariance constraints).
  *   **Normative Info:** More rights/constraints $\rightarrow$ *Rules out* more rules (adds ethical constraints).

  If your PM says "Just average," they are implicitly choosing a measurement assumption (CUC) that *allows* Utilitarianism, while ignoring normative info (rights/fairness) that might *rule it out*.

  ### 4. Where the Ethics Sneaks In (The "Measurement" is the "Ethics")

  You suspected that measurement assumptions are doing ethical work. You are correct. This is the most critical point for your pushback.

  **1. The Choice of Comparability is an Ethical Claim**
  Deciding that "My 5 is equal to Your 5" is not a fact about the database schema. It is a claim of **Equal Moral Worth**.
  *   If you assume **Non-Comparability**, you treat users as sovereign islands. You cannot sacrifice one for the other.
  *   If you assume **Full Comparability**, you treat users as vessels for a single substance ("Utility") that can be poured around. This enables sacrificing a unhappy minority for a happy majority.
  *   **The Sneak:** By building a system that *requires* comparability to function (averaging), you are hard-coding Utilitarianism into the architecture.

  **2. Normalization is Redistribution**
  Since users will inevitably use scales differently (some never rate below 4, some never rate above 6), you will have to normalize the data before averaging (e.g., Z-scoring or Min-Max scaling).
  *   **Z-Scoring (subtract mean, divide by std dev):** This downweights users with extreme opinions (high variance). It ethically privileges the "moderate" voter.
  *   **Min-Max Scaling (squash to 0-1):** This gives equal weight to the intensity of the top and bottom raters, but makes outliers dominate the scale.
  *   **The Sneak:** There is no "correct" mathematical normalization. Each choice changes the political power of different types of users. Choosing one is a decision about whose voice counts more.

  **3. The Zero Point**
  Where is "0"? Is it "I hate this" or "I haven't rated this"?
  *   If 0 is "Neutral," then a -5 rating is a active complaint.
  *   If 0 is "Missing," then averaging treats non-participation as neutrality.
  *   **The Sneak:** Treating silence as zero is an ethical decision to disenfranchise non-voters.

  ### 5. Concrete Two-Person Example

  Here is a scenario where the measurement is perfect (Cardinal, Fully Comparable), everyone agrees on the numbers, but the "Group Decision" is genuinely ambiguous without an extra ethical premise.

  **The Setup:**
  You are choosing between two features for the next sprint: **Feature X** and **Feature Y**.
  You have two users, Alice and Bob. We have a "Hedonimeter" that gives us true, comparable cardinal utility numbers.

  *   **Feature X:**
      *   Alice Utility: **10**
      *   Bob Utility: **2**
      *   **Total Sum:** 12
      *   **Minimum:** 2

  *   **Feature Y:**
      *   Alice Utility: **6**
      *   Bob Utility: **5**
      *   **Total Sum:** 11
      *   **Minimum:** 5

  **The Conflict:**
  *   **The Utilitarian Rule (Maximize Sum):** Choose **Feature X**. (12 > 11). The group is "better off" in total.
  *   **The Rawlsian Rule (Maximize the Minimum):** Choose **Feature Y**. (Min 5 > Min 2). The worst-off person is better off.

  **Why it's unclear:**
  There is no mathematical error in either calculation. The numbers are agreed upon. The comparability is assumed. The ambiguity is purely **normative**.
  *   Do we care about the *size of the pie* (Utilitarian)?
  *   Do we care about *how the pie is sliced* (Egalitarian)?

  **The Extra Premise Needed:**
  For Feature X to clearly win, you must adopt the premise: **"A unit of utility for Alice is perfectly substitutable for a unit of utility for Bob, regardless of their baseline."**
  For Feature Y to clearly win, you must adopt the premise: **"We prioritize improving the condition of the worst-off member over increasing total aggregate welfare."**

  **Recommendation for your PM:**
  Tell them: *"Averaging assumes that a 1-point gain for a power user is identical to a 1-point gain for a new user, and that we are willing to let the majority's intense preference completely override the minority's mild discomfort. If we want to average, we need to explicitly accept that ethical trade-off, because the math doesn't force it—it just hides it."*
