      *   *Correction:* The grader seems to think the answer should be "True" (in an empirical sense) or is confused about the student's "False." Actually, the grader's comment says "a student who says it's true by definition has just refused to answer." This implies the grader thinks the CTT *is* substantive (empirical), so saying it's a theorem (mathematical truth) is wrong, BUT saying it's false because it's a definition is also wrong?
      *   *Let's parse the Grader's logic:*
          *   Question: "CTT is a mathematical theorem. T/F?"
