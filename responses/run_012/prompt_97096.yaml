answer: |-
  **MEMORANDUM**

  **TO:** Qualifying Exam Appeals Subcommittee
  **FROM:** [Your Name], Assistant Professor, Computer Science
  **DATE:** October 24, 2023
  **SUBJECT:** Appeal Decision: Spring Quals, Theory of Computation (Church–Turing Thesis Item)

  **Recommendation**
  I recommend that we **uphold the student's appeal and adjust the grade** to reflect full credit for this item.

  While I respect the grader's long-standing experience with this course, the student's answer is technically correct according to the standard logical framework of computability theory. The exam question asked whether the Church–Turing thesis (CTT) is a *mathematical theorem*. The correct answer is **False**. The student answered **False** and provided the standard justification for that answer. Penalizing her for this penalizes precision, which is the primary competency a qualifying exam should measure.

  **Analysis of the Technical Dispute**
  The core issue is the distinction between a formal mathematical claim and a philosophical identification.
  1.  **Mathematical Theorems** are derived from formal axioms within a formal system.
  2.  **The Church–Turing Thesis** asserts an equivalence between a formal system (Turing Machines/recursive functions) and an informal notion ("effective calculability" or "what a human can do with paper and pencil").
  3.  Because "effective calculability" is not formally defined independent of the thesis itself, the equivalence cannot be proven mathematically. It is a hypothesis about the relationship between our formal models and the intuitive concept of computation.

  The student correctly identified that the thesis is not a theorem because one side of the equivalence is informal. She further distinguished this from the "Physical Church–Turing Thesis" (whether physical reality can compute more than a TM), which is an empirical claim, not a mathematical one. Her answer demonstrates a sophisticated grasp of the material, arguably deeper than a simple binary recall would require.

  **The Grader's Position (Steelmanned)**
  I believe the grader's objection stems from a valid pedagogical frustration rather than a simple error. In my review of similar cases, I have seen students use the "it's not a theorem, it's a definition" line to dodge substantive questions about *why* we trust the Turing model.

  The grader likely views the CTT as the "central empirical claim of computer science." From this perspective, treating the CTT as merely "not a theorem" can feel like dismissing its foundational status. If the CTT is a "law of nature" regarding information processing, then marking "False" to the question "Is this a fundamental truth?" feels like a rejection of the field's basis. The grader's comment suggests he worries that accepting the student's answer validates a deflationary view where the CTT is just a semantic convention rather than a robust claim about computation.

  However, while the CTT may be a fundamental *principle*, it is not a *theorem*. Conflating "fundamental principle" with "mathematical theorem" introduces ambiguity that harms the exam's validity. A student can believe the CTT is true (as a principle) while correctly identifying it is not a theorem (as a mathematical object). The grader's rubric appears to have penalized the student for making this distinction.

  **Recommendations for Future Exams**
  To prevent this ambiguity in the future, I recommend we retire True/False questions regarding the philosophical status of the CTT. They invite exactly this kind of dispute. Instead, we should test the student's ability to articulate the distinction.

  **Suggested Replacement Questions:**
  *   *Option A (Direct):* "Explain why the Church–Turing thesis is not considered a mathematical theorem, despite its central role in computability theory."
  *   *Option B (Scenario):* "A colleague claims to have proven the Church–Turing thesis using standard logic. What is the flaw in their claim?"
  *   *Option C (Distinction):* "Distinguish between the mathematical equivalence of Turing Machines and Lambda Calculus, and the Church–Turing thesis regarding effective calculability. Which is a theorem and which is not?"

  **Conclusion**
  This student answered the specific question asked with technical accuracy. While the grader's concern about students trivializing the thesis is well-founded, the qualifying exam is not the place to penalize a student for precise logical categorization. Upholding this appeal reinforces the standard that our exams test rigorous understanding, not adherence to a specific philosophical interpretation of the field's history.

  I am available to discuss this further at Friday's meeting.
