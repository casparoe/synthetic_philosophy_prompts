          *   *Interpretation:* The grader seems to believe the answer should be "True" (perhaps conflating empirical truth with mathematical theoremhood) OR he believes the question implies "Is the CTT a valid principle?" and her saying "False" sounds like she's rejecting computability theory.
          *   *Actually, looking at the grader's comment again:* "a student who says it's true by definition has just refused to answer." This suggests the grader thinks the CTT is *not* a definition, but an empirical claim. So if the question asks "Is it a theorem?" and the student says "False," why is she wrong?
          *   *Hypothesis:* The grader thinks the CTT *is* a theorem (maybe in the sense that we accept TM as the definition now). OR, the grader is confused.
