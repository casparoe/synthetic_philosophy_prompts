      *   *Wait, one nuance:* The grader said "a student who says it's true by definition has just refused to answer." This implies he thinks the answer to "Is it a theorem?" might be "True" (if viewed as a definition within the system?) OR he's conflating "Theorem" with "True Statement."
      *   *Actually, the most likely scenario:* The grader thinks the CTT is *True* (as a fact of the universe) and interprets "Theorem" loosely as "True Fact." The student interpreted "Theorem" strictly (Mathematical Proof). In a Theory of Computation qual, strict interpretation wins.
