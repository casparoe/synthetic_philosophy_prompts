answer: |-
  Here is the ranking of your proposed loopholes from most to least legitimate, rated on how effectively they bypass the Gibbard–Satterthwaite theorem.

  **1. Restrict to only two outcomes (Rating: 10)**
  This completely negates the theorem's premises since G-S explicitly requires at least three outcomes, making simple majority rule fully strategy-proof.

  **2. Restrict preferences to single-peaked along one left-right line (Rating: 9.5)**
  This genuinely bypasses the theorem by violating the unrestricted domain assumption, making median voting strategy-proof and non-dictatorial within that specific context.

  **3. Allow cardinal utility and money side-payments (Rating: 9)**
  This escapes the theorem by moving from ordinal voting to a mechanism design setting with transfers, where truthful revelation is a dominant strategy via VCG payments.

  **4. Allow randomization and use a random dictator (Rating: 8)**
  By dropping the determinism requirement, this creates a rule where truth-telling is dominant and no single voter dictates the outcome ex-ante.

  **5. Restrict to dichotomous preferences and use approval voting (Rating: 7)**
  This restricts the domain of allowable preferences similar to single-peakedness, allowing non-dictatorial rules though strategic threshold-setting can still occur.

  **6. Drop dominant-strategy requirement for Bayesian Nash equilibrium (Rating: 4)**
  This weakens the solution concept but often fails to guarantee truthfulness without strong common knowledge assumptions that rarely hold in practice.

  **7. Charge a 'pivot tax' and redistribute the revenue (Rating: 3)**
  While VCG taxes ensure truthfulness, redistributing the revenue back to voters typically reintroduces incentives to lie to influence the rebate amount.

  **8. k-lazy strategy-proofness (Rating: 2)**
  This admits manipulation is possible but hopes coordination costs prevent it, so the theorem's logical conclusion about the rule itself remains unchanged.

  **9. Use obvious strategy-proofness (Rating: 0)**
  This actually tightens the constraints rather than loosening them, meaning if G-S blocks strategy-proofness, it definitely blocks obvious strategy-proofness.

  ***

  **If I had to bet on one fix for a real democracy with >2 options:**
  I would bet on **restricting preferences to single-peaked (Item 1)**. In practice, real-world politics often coerces complex issues into a left-right spectrum (or forces coalition building that mimics single-peakedness), making the Median Voter Theorem the only workable model that preserves both non-dictatorship and a reasonable approximation of truth-telling without requiring money or randomness.

  **Which one is my friend definitely right to call fake?**
  Your friend is definitely right about **Obvious Strategy-Proofness (Item 9)**. Since "obvious" strategy-proofness is a strictly stronger condition than the standard strategy-proofness that Gibbard–Satterthwaite already proves impossible for non-dictatorial rules, proposing it as a solution is mathematically incoherent.
