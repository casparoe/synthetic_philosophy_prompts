answer: |-
  Here are ten question-and-follow-up pairs designed to keep the professor pinned down. They are ordered to build pressure: starting with the core definition, moving through the edge cases (drones, conscripts), and ending with the stability of the theory itself.

  For each pair, I've included the **"Likely Evasion"** so you know exactly what trigger to listen for before you hit him with the follow-up.

  ### 1. The Core Claim: Permission vs. Excuse
  **Question:** When you say combatants are morally equal, are you claiming the unjust soldier has a *moral permission* to kill, or simply that they are *blameless* because of the circumstances? Those seem like very different things—one says the act is okay, the other says the act is wrong but the person isn't at fault.
  *   **Likely Evasion:** He will probably say something like, "In the fog of war, we can't expect them to know better, so we treat them as permitted."
  *   **Follow-Up:** That sounds like you're giving them an *excuse*, not a *right*. If it's just an excuse, then the moral equality disappears the moment the fog clears. Are you defending a moral truth, or just a policy for when things are confusing?

  ### 2. The Slippage Trap
  **Question:** You've argued that soldiers are instruments of the state. Does that mean their moral status is entirely borrowed from the institution, or do they retain individual moral agency?
  *   **Likely Evasion:** He will likely slide between the two, saying, "They are individuals, but acting in a role that constrains them."
  *   **Follow-Up:** You started by saying they are *morally equal* as agents, but now you're saying their agency is constrained by the role. If the role is what matters, isn't this just a legal rule disguised as morality? At what point in your answer did the "moral" part drop out?

  ### 3. Remote Warfare: The Risk Factor
  **Question:** The traditional defense of moral equality relies on mutual threat—soldier A kills soldier B because B is trying to kill A. How does this apply to a drone operator who faces zero physical risk from the person they are killing?
  *   **Likely Evasion:** He will argue, "They are still a legitimate target because they are part of the war machine."
  *   **Follow-Up:** But if they aren't a physical threat to the operator, the reciprocity is gone. If the justification for equality is mutual danger, doesn't drone warfare fundamentally break the moral equality of combatants?

  ### 4. Remote Warfare: The "Threat" Definition
  **Question:** If you say the drone operator is still a "threat" because they can kill, does that mean any person who can kill from safety is morally equal to the person dying in the mud?
  *   **Likely Evasion:** He might say, "We have to look at the functional role they play in the conflict."
  *   **Follow-Up:** If it's about functional role, then a factory worker making bolts is also part of the war machine. Why is the drone operator morally equal to the combatant, but the factory worker isn't? Where do you draw the line if risk isn't the factor?

  ### 5. Muddled Wars: Symmetrical Injustice
  **Question:** Let's imagine a war where both sides are aggressors, or the cause is genuinely unknowable. Does the moral equality of combatants still hold there?
  *   **Likely Evasion:** He will likely say, "Yes, especially there, because neither side can claim justice."
  *   **Follow-Up:** If neither side is just, then both sides are essentially committing aggression. If moral equality means both are *permitted* to kill, aren't you saying two wrongs make a right? Or does the doctrine collapse when there's no "just" side to compare against?

  ### 6. Individual vs. Institutional
  **Question:** Is your argument that *I*, as a soldier, am morally allowed to shoot you? Or is it that *the state* should not prosecute me for shooting you?
  *   **Likely Evasion:** He'll say, "It's both, the individual right supports the institutional rule."
  *   **Follow-Up:** But if the individual right depends on the institutional rule, then it's not a moral right, it's a legal immunity. If the state changed the law tomorrow, would your moral argument disappear with it?

  ### 7. Conscripts: The Coercion Problem
  **Question:** Consider a conscript who is forced to fight under threat of execution by his own government. Is he morally equal to a volunteer who chose to fight for a cause he believes in?
  *   **Likely Evasion:** He will probably say, "Yes, because on the battlefield, they pose the same threat."
  *   **Follow-Up:** That answers the *tactical* question, not the *moral* one. If one acts out of fear and the other out of belief, their moral culpability is different. Why does the threat they pose to the enemy erase the difference in their own choices?

  ### 8. Child Soldiers: The Understanding Problem
  **Question:** Pushing that further: a child soldier often doesn't understand the political cause at all. Can someone who lacks the capacity to understand the war really be "morally equal" to an adult soldier who does?
  *   **Likely Evasion:** He might argue, "We treat them as combatants for the safety of others on the field."
  *   **Follow-Up:** That's a safety argument, not a moral equality argument. If you admit they are treated differently for safety, haven't you just admitted that moral equality isn't universal? It stops where understanding stops?

  ### 9. The "Useful Convention" Retreat
  **Question:** Some critics say the moral equality of combatants has been redefined from a "moral truth" into just a "useful convention" to limit war's horror. Is that what you're defending?
  *   **Likely Evasion:** He will say, "It's a convention grounded in moral reasons."
  *   **Follow-Up:** If it's a convention, it can be changed if it stops being useful. Are you saying this is an objective moral fact, or just a deal we've made to keep things from getting worse? Because if it's just a deal, it's not really "moral equality."

  ### 10. The Falsification Condition
  **Question:** Finally, what specific case or argument would actually make you give this view up? Is there any scenario where you would admit the combatants are *not* morally equal?
  *   **Likely Evasion:** He might say, "It's a robust theory, but obviously, there are edge cases..."
  *   **Follow-Up:** If the theory survives every edge case by adding exceptions, does it actually explain anything? If you can't name a situation where the equality fails, is the claim falsifiable at all?
