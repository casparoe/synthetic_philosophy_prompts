answer: |-
  This is an exceptionally sharp setup. You have correctly identified that the standard Popperian demarcation (falsifiability) fails when applied to the actual history of scientific practice, and you have rightly sensed that your own intuitions are tracking something more complex than a single logical condition.

  You asked for honesty rather than a manufactured tidy definition. The honest answer is that there is no single necessary and sufficient condition that separates pseudohistory from legitimate marginal history without either excluding genuine scientific revolutions or including sophisticated pseudoscience. However, we can construct a **diagnostic cluster** that captures the *weight* of your verdicts.

  Here is a proposed principle, followed by the application to your new cases, and finally a diagnosis of where your own list creates contradictions.

  ### The Principle: Epistemic Accountability and Constraint Adherence

  A claim is pseudohistorical (or pseudoscientific) if it exhibits **Systematic Constraint Violation** combined with **Immunization Strategy**.

  1.  **Constraint Adherence:** The claim accepts the methodological constraints of the discipline (dating techniques, linguistic phylogenies, stratigraphic superposition) as binding, *unless* there is independent, empirical evidence that those specific constraints are compromised in this specific instance.
  2.  **Direction of Accommodation:** When evidence conflicts with the hypothesis, the hypothesis is modified to fit the evidence, rather than the evidence being re-interpreted (as forgery, misdating, or conspiracy) to fit the hypothesis.
  3.  **Referee Engagement:** The claim is submitted to the epistemic community's standard referee mechanisms (peer review, replication) and accepts their negative verdicts as *epistemic costs* rather than *evidence of corruption*.

  #### Why these clauses? (Mapping to your cases)

  *   **Clause 1 (Constraint Adherence)** is forced by **Fomenko/Phantom Time**. Fomenko does not just argue history is wrong; he argues that *all* dating methods (dendrochronology, radiocarbon, astronomy) are simultaneously wrong or fabricated without providing independent physical proof of the fabrication. He rejects the constraints *a priori*.
      *   *Contrast:* **Thera Redating**. Proponents argue that *specific* radiocarbon samples might be contaminated or that the calibration curve is off in this period. They attack the *application* of the constraint, not the constraint itself.
  *   **Clause 2 (Direction of Accommodation)** is forced by **Younger Dryas (YD)** vs. **Atlantis/Aliens**. YD proponents have had to modify impact locations, projectile types, and dates as data came in. They accommodate the evidence. Atlantis/Alien proponents treat the *absence* of evidence (no wreckage, no DNA) as proof of suppression or advanced technology that leaves no trace. They accommodate the theory.
  *   **Clause 3 (Referee Engagement)** is forced by **Great Zimbabwe** vs. **Fomenko**. The colonial archaeologists at Great Zimbabwe were wrong, and they had standing. But they published in journals, engaged with critics, and eventually, the weight of evidence (within their own system) forced a paradigm shift. Fomenko publishes books for the public and treats academic rejection as proof of the "conspiracy."

  ---

  ### Application to New Cases

  **1. The Kensington Runestone**
  *   **Verdict:** **Pseudohistory (Fomenko side).**
  *   **Reasoning:** It fails Clause 1 and Clause 2.
      *   *Constraint Adherence:* The inscription contains linguistic anachronisms (Swedish/Norwegian/Danish mix that did not exist in the 14th century) and runes that were not in use. Proponents do not offer independent physical evidence that the stone is old (the geology is contested); instead, they argue that linguists are biased or that the "rules" of language evolution don't apply to this specific isolate.
      *   *Direction of Accommodation:* When linguists identify errors, proponents claim the carver was "illiterate" or "dialectal," effectively making the hypothesis unfalsifiable by linguistic standards. It treats the consensus of philologists as a sociological barrier rather than an epistemic filter.

  **2. The Vinland Map**
  *   **Verdict:** **Legitimate Controversy / Forensic Dispute (Thera side).**
  *   **Reasoning:** It passes Clause 1 and Clause 3.
      *   *Constraint Adherence:* The debate has been conducted entirely through material science (ink analysis, parchment dating, microscopy). Both sides accept that if the ink contains anatase titanium (a 20th-century pigment), the map is a forgery. They are arguing over the *interpretation of the physical data*, not rejecting the validity of chemistry.
      *   *Referee Engagement:* The map was subjected to testing by Yale and independent labs. Even if proponents dispute the results, they dispute them *within the language of the method* (e.g., "the sampling was contaminated"), not by claiming the chemists are part of a plot to hide pre-Columbian contact.
      *   *Note:* If, *after* definitive proof of modern ink, proponents continued to claim it was genuine because "the geography is too accurate to be fake," it would cross into pseudohistory. As a material dispute, it remains legitimate.

  ---

  ### Diagnosis of the Mess: Which of Your Verdicts Must Go?

  You asked which of your existing verdicts this principle cannot accommodate, and whether I think that verdict should go. There are two significant tensions in your list.

  **1. The Schliemann Problem (The Verdict That Should Go)**
  *   **Your Verdict:** Schliemann is *not* pseudohistory.
  *   **The Conflict:** Schliemann fails Clause 1 and Clause 2 spectacularly. He used the *Iliad* as a literal map (violating the constraint that myth is not geography). He destroyed upper stratigraphic layers to get to the "Trojan" layer below (violating the constraint of stratigraphy). He identified "Priam's Treasure" based on narrative fit, not context.
  *   **Diagnosis:** You are exempting Schliemann due to **Outcome Bias**. He is not pseudohistory *because he found Troy*. If he had dug at a different hill and found nothing, he would be remembered as a wealthy crank.
  *   **Recommendation:** **Drop this verdict.** Schliemann *was* practicing a form of pseudohistory that got lucky. Including him as a counter-example to Fomenko confuses *success* with *method*. A graduate seminar should distinguish between "fruitful heuristics that violate norms" and "valid methodology." Schliemann violates norms. He belongs on the pseudohistory side methodologically, even if his core intuition (Troy exists) was right.

  **2. The Multiverse Problem (The Category Error)**
  *   **Your Verdict:** Multiverse is *not* pseudoscience, despite being unfalsifiable.
  *   **The Conflict:** The Multiverse fails Clause 1 (no empirical constraint) and arguably Clause 3 (hard to test).
  *   **Diagnosis:** You are comparing **Speculative Metaphysics within a Paradigm** to **Empirical Claims Outside a Paradigm**. The Multiverse arises from the mathematical internal consistency of inflationary cosmology and quantum mechanics. It is a *theoretical* consequence, not an *empirical* claim pretending to be tested. Fomenko and Atlantis seekers make empirical claims ("This happened," "This building exists") that contradict empirical data.
  *   **Recommendation:** Keep the verdict, but clarify the category. The Multiverse is "Speculative Science" or "Natural Philosophy," not "Pseudoscience." Pseudoscience mimics the *authority* of empirical resolution without the work. The Multiverse admits it lacks empirical resolution. It is honest about its status.

  **3. The Great Zimbabwe Problem (The Sociological Worry)**
  *   **Your Verdict:** Pseudohistory, despite proponents having standing.
  *   **Diagnosis:** This is your strongest intuition. It proves that **Standing is not a Shield.** Institutional science can be pseudoscientific if it is driven by ideology (colonial racism) that forces the *Direction of Accommodation* (Clause 2). The archaeologists ignored local artifacts and oral history to fit the "Civilization must be White" hypothesis.
  *   **Recommendation:** Keep this verdict. It validates Clause 2. It shows that pseudohistory is not defined by *who* speaks, but by *how* they handle counter-evidence.

  ### Summary for the Proseminar

  If I were leading this session, I would propose this conclusion to the students:

  **Demarcation is not a boundary line; it is a vector.**

  It points toward **Epistemic Accountability**.
  *   **Fomenko/Atlantis/Kensington:** The vector points *inward*. Evidence is interpreted to protect the core belief. Failure is externalized (conspiracy, bias).
  *   **Thera/YD/Vinland:** The vector points *outward*. The core belief is risked against independent constraints. Failure is internalized (theory modification).
  *   **Schliemann:** A warning that a vector pointing inward can still hit a target by luck. Do not judge the method by the find.
  *   **Multiverse:** A warning that not all non-falsifiable claims are pseudoscience; some are honest admissions of theoretical limits.

  **The "Principle" is therefore:** Pseudohistory is the practice of making empirical claims while refusing to accept the epistemic costs of those claims being wrong.

  You asked if the honest answer is that there is no single principle. The honest answer is that there is a single **normative stance** (accountability), but it manifests differently in different contexts (linguistics vs. stratigraphy vs. cosmology). Your list is not "loaded," but it does contain a historical anachronism (Schliemann) that threatens to confuse your students about the relationship between method and truth. If you remove Schliemann from the "Not Pseudo" column, your intuitions align remarkably well with the **Constraint and Accountability** principle.
