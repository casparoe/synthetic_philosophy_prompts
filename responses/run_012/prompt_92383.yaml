answer: |-
  ### Specification for a Theory of Psychiatric Classification

  The following desiderata constitute the specification against which any candidate theory of psychiatric classification must be judged. They are derived from the stipulated case of Reduced Social Reward Syndrome (RSRS), historical precedents, and the logical distinctions required for coherent taxonomy.

  #### I. Desiderata and Motivating Considerations

  **1. Accommodation of Interactive Kinds (Looping Effects)**
  *   **Requirement:** The theory must explain how the act of classification can causally alter the behavior, self-conception, and trajectory of the classified individuals, thereby changing the extension of the category over time.
  *   **Motivation:** In the RSRS case, prevalence rose steeply after introduction, and diagnosed individuals reported that the label reorganized their self-understanding and expectations. A theory that treats categories as static buckets fails to explain why the population changes *because* it was classified.

  **2. Normative Discrimination (Disorder vs. Diversity/Deviance)**
  *   **Requirement:** The theory must provide criteria to distinguish a psychiatric disorder from a non-pathological variation in human functioning or a socially disapproved behavior.
  *   **Motivation:** RSRS involves low distress and isolation, raising the question of whether it is a dysfunction or a lifestyle. Historically, the removal of homosexuality required a theory that could distinguish sexual orientation from pathology. Conversely, the "diagnosis" of enslaved people who fled captivity (drapetomania) and the rise and fall of hysteria demonstrate the danger of classifying social deviance or oppression responses as mental illness. The theory must rule out drapetomania while ruling in RSRS (if warranted).

  **3. Integration of Biological and Social Etiologies**
  *   **Requirement:** The theory must allow for categories that exhibit familial heritability and treatment response without requiring that the category be *reducible* to a specific biological lesion or marker.
  *   **Motivation:** RSRS runs in families and responds to medication, suggesting biological components. However, its boundaries shift with manual revisions and prevalence varies across cultures, suggesting social construction. A theory demanding a unique biological cause for every category cannot account for the cultural variation; a theory denying biological reality cannot account for the medication response.

  **4. Epistemic Revisability via Patient Testimony**
  *   **Requirement:** The theory must allow for the revision or removal of categories based on the reported experience and advocacy of the classified population, not solely on new biological data.
  *   **Motivation:** The removal of homosexuality was driven largely by advocacy and moral reconsideration, not a new blood test. In the RSRS case, advocacy communities formed around the label, influencing its uptake. A theory that grants authority only to laboratory findings cannot explain legitimate changes in the manual driven by human rights or lived experience.

  **5. Distinction Between Validity and Reliability**
  *   **Requirement:** The theory must distinguish between the consistency of application (reliability) and the accuracy of the category in capturing a distinct phenomenon (validity).
  *   **Motivation:** RSRS is defined by a checklist, which aids reliability. However, it overlaps with autism and social anxiety, and boundaries shift with revisions, threatening validity. A theory that equates reliable checklist usage with the existence of a real disorder fails to account for the overlap and boundary instability.

  **6. Cross-Cultural Sensitivity**
  *   **Requirement:** The theory must explain why prevalence rates for the same category might vary sharply across cultures without assuming that the underlying dysfunction is absent in low-prevalence cultures.
  *   **Motivation:** RSRS prevalence varies sharply across cultures. A theory assuming universal, context-independent expression of dysfunction cannot account for this variation without dismissing the low-prevalence cultures as diagnostically incompetent or the high-prevalence cultures as deluded.

  **7. Separation of Classification and Diagnosis**
  *   **Requirement:** The theory must distinguish the abstract taxonomy (the classification system) from the clinical act of assigning a label to a specific person (diagnosis).
  *   **Motivation:** RSRS is a category in the manual, but its application depends on self-report and clinician judgment. Confusing the map (classification) with the territory (the person) leads to reification, where the checklist is treated as the person rather than a tool for understanding them.

  ***

  #### II. Status of Requirements

  **Non-Negotiable (Constraints on Adequacy)**
  *   **Accommodation of Interactive Kinds:** Any theory that denies looping effects contradicts the stipulated facts of RSRS and historical data on diagnostic uptake.
  *   **Normative Discrimination:** Any theory that cannot distinguish drapetomania from depression fails a basic moral and scientific sanity check.
  *   **Integration of Biological and Social Etiologies:** Given the mixed evidence of RSRS (meds work, but culture matters), a purely biological or purely social theory is empirically inadequate.
  *   **Epistemic Revisability:** Given the history of homosexuality and the role of advocacy in RSRS, a theory that silences patient testimony is historically obsolete.

  **Preferences (Camp-Specific Commitments)**
  *   **Preference for Natural Kinds:** The desire for categories to map onto discrete, mind-independent biological essences is a preference, not a requirement, given the boundary shifts in RSRS.
  *   **Preference for Pragmatic Utility:** The desire for categories to be defined solely by treatment utility (ignoring truth claims) is a preference, not a requirement, given the need to distinguish disorder from diversity.
  *   **Preference for Atemporal Stability:** The desire for categories to remain unchanged across decades is a preference, contradicted by the manual revisions seen in RSRS and history.

  ***

  #### III. Analysis of Tension: Stable Dysfunction vs. Looping/Revisability

  **Are they jointly satisfiable?**
  No. The requirement that categories track a **stable, mind-independent dysfunction** is **not jointly satisfiable** with the requirement that the theory accommodate **strong looping effects and revisability under patient testimony.**

  **Reasoning:**
  If a category tracks a stable, mind-independent dysfunction (analogous to a virus or a fracture), the classification of the subject should not alter the nature of the dysfunction. A broken bone does not heal differently because the patient identifies as "bone-broken," nor does the definition of a fracture shift because patients advocate for a broader definition. Mind-independent entities exist regardless of human classification.

  However, the RSRS case stipulates that the prevalence rises *after* introduction, that self-understanding changes *because* of the diagnosis, and that boundaries shift *in response* to advocacy. This is the definition of an interactive kind. If the classification changes the people, and the people constitute the extension of the category, the category is not tracking a stable, mind-independent target. It is tracking a moving target that moves *in response to the tracking.*

  To accommodate looping and revisability, the theory must concede that the "dysfunction" is partially constituted by the social and conceptual framework in which it is embedded. To maintain the "stable, mind-independent" requirement, the theory must deny that classification changes the underlying reality of the disorder. One must be abandoned. A viable theory must likely adopt a view of "human kinds" that are real and causally potent but not mind-independent in the strict naturalist sense.

  ***

  #### IV. The Single Excluding Requirement

  The single requirement that does the most to exclude current contenders is:

  **The requirement to accommodate Interactive Kinds (Looping Effects) without collapsing the distinction between Disorder and Diversity.**

  **Why this excludes contenders:**
  1.  **Excludes Strict Biological Realism:** Theories that insist psychiatric categories are natural kinds identical to medical diseases (e.g., strict neurobiological essentialism) fail because they cannot account for the looping effect. They must treat the rise in RSRS prevalence as mere "detection" of a static reality, ignoring the stipulated fact that the diagnosis *changed* the patients' self-conception and behavior.
  2.  **Excludes Strong Social Constructionism:** Theories that argue psychiatric categories are *only* social tools or labels fail because they struggle to maintain the Normative Discrimination requirement. If RSRS is merely a social label, the theory lacks the resources to explain why it responds to medication or runs in families differently than a purely social role would, and it risks validating drapetomania as a "real" social kind equivalent to depression.
  3.  **Excludes Pure Pragmatism:** Theories that define categories solely by clinical utility often bypass the truth claim entirely. They fail to explain *why* the looping happens (the causal power of the belief) and often lack the normative teeth to rule out harmful classifications like drapetomania if those classifications were "useful" to the oppressors.

  This requirement forces a theory to walk a razor's edge: it must treat the disorder as real enough to cause harm and respond to treatment, but malleable enough to change when named. Most existing frameworks settle on one side of this divide, rendering them inadequate for the full stipulated case.
