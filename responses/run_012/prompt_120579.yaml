answer: |-
  ### Desiderata for a Theory of Cognitive Extension in Adjudicative Contexts

  1.  **The Phenomenal Adequacy Requirement**
      *   **Requirement:** The theory must align with robust pre-theoretical intuitions regarding paradigmatic cases of extension, specifically the "Otto and his Notebook" scenario, while distinguishing it from mere tool use.
      *   **Motivation:** If a theory rules that a paper notebook is *never* part of the mind, it contradicts the ordinary sense in which we treat lost notes as lost memories. Conversely, if it rules that looking up a fact in a library is memory, it contradicts the ordinary sense of "knowing."
      *   **Status:** **Non-negotiable.** A theory that fails to capture the basic intuitions driving the legal or medical inquiry cannot guide judgment in those domains.

  2.  **The Constitution-Causation Distinction**
      *   **Requirement:** The theory must provide a principled basis for distinguishing between an external resource *causing* a cognitive state and an external resource *constituting* a cognitive state.
      *   **Motivation:** This prevents the "coupling-constitution fallacy." Without this, any causal influence (e.g., the people standing nearby providing cues, or the library shelves) counts as extension, rendering the concept legally useless for assigning responsibility or rights.
      *   **Status:** **Non-negotiable.** Adjudication requires knowing what belongs to the agent (constitutive) versus what merely influences the agent (causal).

  3.  **The Control and Reliability Condition**
      *   **Requirement:** The theory must account for the agent's ability to access, trust, and maintain the resource, specifically addressing scenarios where a resource is destroyed, or a manufacturer disables it remotely.
      *   **Motivation:** If a cloud provider deletes a file or a smartphone is bricked remotely, the "cognitive loss" feels different than forgetting. A theory of extension must explain why a resource subject to remote repossession is a weaker candidate for mental parthood than one physically secured.
      *   **Status:** **Non-negotiable.** Legal liability and medical capacity hinge on the stability and availability of the purported cognitive resource.

  4.  **The Integration and History Threshold**
      *   **Requirement:** The theory must distinguish between resources consulted deliberately and occasionally versus those integrated into long-standing, automatic cognitive routines.
      *   **Motivation:** Using a calculator for one sum is not cognitive extension; using a specialized interface daily for ten years might be. This addresses the distinction between momentary/deliberate use and long-standing/automatic extension.
      *   **Status:** **Non-negotiable.** Courts need to distinguish between a temporary aid and a permanent prosthetic of the mind to determine long-term capacity or culpability.

  5.  **The Cognition-Personhood Separation**
      *   **Requirement:** The theory must explicitly distinguish between the extension of *cognitive processes* (memory, calculation) and the extension of the *self or person* (rights, privacy, bodily integrity).
      *   **Motivation:** A shared calendar may be part of a couple's cognitive system (joint memory) without implying their legal persons are merged. Conflating these leads to errors in privacy law and human rights adjudication.
      *   **Status:** **Commitment of one camp.** The "Extended Self" camp argues these cannot be separated; the "Extended Mind" camp argues they can. A purely functionalist theory may refuse this separation.

  6.  **The Biological Boundary Condition**
      *   **Requirement:** The theory must specify whether biological integration (implants, neural interfaces) carries a different ontological weight than non-biological carriage (smartphones, notebooks).
      *   **Motivation:** Clinical and legal treatments often privilege implanted devices (e.g., pacemakers, deep brain stimulators) over carried ones regarding bodily integrity and assault. A theory must either justify this privilege or argue for its abolition.
      *   **Status:** **Commitment of one camp.** Internalists/Biological Naturalists require this distinction; Functionalist Externalists reject it as "bio-chauvinism."

  7.  **The Empirical Consistency Constraint**
      *   **Requirement:** The theory must not contradict established findings regarding memory labor division, the degradation of unaided recall upon offloading (the "Google Effect"), and the incorporation of tools into body schema.
      *   **Motivation:** If a theory claims offloading enhances internal memory, but data shows it degrades it, the theory is empirically falsified. It must accommodate the evidence that expert performance relies on external props without assuming those props are always internalized.
      *   **Status:** **Non-negotiable.** A descriptive theory that contradicts data is false; a normative theory based on false descriptions is dangerous.

  8.  **The Adjudicative Tractability Constraint**
      *   **Requirement:** The theory must yield binary or clearly bounded outputs (Yes/No, Inside/Outside) suitable for a verdict, rather than purely graded or continuous spectra.
      *   **Motivation:** While cognition may be graded, a court cannot issue a "60% liable" verdict on whether a device was part of the mind. The theory must provide a threshold for decision-making.
      *   **Status:** **Non-negotiable.** This is a demand of the *purpose* (adjudication), not necessarily of metaphysics.

  ***

  ### Incompatibilities and Exclusionary Power

  **The Incompatible Subset:**
  Requirements **7 (Empirical Consistency)** and **8 (Adjudicative Tractability)** cannot be jointly satisfied without significant theoretical distortion. Empirical findings (Requirement 7) strongly suggest that cognitive integration is a matter of degree (graded), involving varying levels of trust, history, and neural plasticity. However, Adjudicative Tractability (Requirement 8) demands a bright line (all-or-nothing) to render a verdict. Any theory that faithfully models the graded nature of cognitive integration will fail to provide the binary output a court requires without arbitrary stipulation. Conversely, any theory that provides a clean binary output will likely misrepresent the empirical gradience of the cognitive system.

  **The Most Exclusionary Requirement:**
  **Requirement 8 (Adjudicative Tractability)** excludes the largest number of otherwise plausible theories. Most sophisticated philosophical and scientific accounts (particularly the Scaffolding-and-Integration approach and nuanced Functionalist accounts) describe cognitive extension as a continuum or a cluster concept. They resist bright-line definitions precisely because the phenomena are messy. By demanding a binary output for the sake of legal utility, this requirement disqualifies theories that are descriptively accurate but procedurally vague.

  ***

  ### Evaluation of Candidate Theories

  **Parity-Based Functionalism (Clark & Chalmers):**
  This account scores highly on **Phenomenal Adequacy** (it gets the notebook right) and **Biological Neutrality** (it treats implants and phones similarly). However, it notoriously fails the **Constitution-Causation Distinction**, leading to the "Library Problem" (over-extension). It also struggles with **Control and Reliability**, as it focuses on current functional role rather than historical stability or ownership rights, making it difficult to adjudicate cases involving remote disablement or shared resources.

  **Internalist or Embedded Rejoinder (Adams & Aizawa / Rowlands):**
  This approach excels at the **Constitution-Causation Distinction** and **Adjudicative Tractability** by drawing a hard line at the skull or skin. It easily avoids the Library Problem. However, it fails **Phenomenal Adequacy** regarding the notebook case (denying the intuition that the notebook is part of the mind) and violates **Biological Neutrality** by stipulating biological boundaries that may not track functional reality. It is legally safe but descriptively impoverished.

  **Scaffolding-and-Integration Approach (Sterelny / Godfrey-Smith):**
  This framework performs best on **Empirical Consistency** and the **Integration Threshold**, as it is built on evolutionary and developmental data regarding how tools become incorporated over time. It handles the **Control and Reliability** condition well through its focus on long-term niche construction. However, it fails **Adjudicative Tractability** miserably; it views extension as a gradual historical process, offering no clear moment where a tool becomes "mind," which renders it unusable for a binary legal verdict.

  **Extended-Self Approach (Schechtman / Narrative Identity):**
  This theory prioritizes the **Cognition-Personhood Separation** requirement by explicitly rejecting it, arguing that cognitive extension is inseparable from personal identity and rights. While this is powerful for human rights adjudication (e.g., rights over implants), it conflates capacity with identity, violating the **Constitution-Causation Distinction**. It risks expanding legal personhood too broadly (e.g., to include shared calendars as shared persons), making it risky for standard liability cases.

  ***

  ### Normative vs. Metaphysical Demands

  It is critical to note that **Requirement 8 (Adjudicative Tractability)** is a **normative demand** of your specific purpose, not a metaphysical truth. A purely descriptive theory of cognitive science could (and perhaps should) refuse this requirement, acknowledging that cognitive boundaries are fuzzy and graded. Similarly, **Requirement 5 (Cognition-Personhood Separation)** is normative; a metaphysical theory might argue cognition and selfhood are ontologically identical. By including these in the desiderata, you are prioritizing the *utility of the framework for a court* over the *ontological accuracy of the theory*. A theory that is metaphysically true might still fail your framework if it cannot produce a verdict.
