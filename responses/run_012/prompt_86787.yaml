answer: |-
  ### The Framing Audit Protocol

  This procedure is designed to separate *content* (facts, dates, places) from *framing* (causality, significance, narrative arc). It does not guarantee a "neutral" curriculum—neutrality is impossible. It guarantees that the distortions you accept are chosen, not accidental.

  Run this protocol on every unit proposal. If a unit fails Step 1, 2, or 3, it is Eurocentric. If it passes those but fails Step 4, it trades one bias for another. If it passes 1–4 but hits Step 5, the committee must vote based on values, not history.

  #### Step 1: The Agency Test (Causality)
  **Question:** In this unit, is historical change driven primarily by the internal decisions of the people living in the region, or by their reaction to Europe?
  *   **Pass:** Non-European regions are shown initiating change, solving problems, or expanding power before significant contact with Europe.
  *   **Fail:** Non-European regions are described primarily as reacting to European arrival, or their history is paused until Europe shows up.
  *   **Europe as Region vs. Axis:** Europe passes this test if it is treated as a region undergoing its own internal changes, not as the universal catalyst.

  #### Step 2: The Teleology Test (Direction)
  **Question:** Does the narrative treat the end date of the unit as an inevitable destination, and is that destination "Modernity" defined by European characteristics?
  *   **Pass:** The end date is a pause for administrative convenience or a shift in material conditions, not a "goal."
  *   **Fail:** The unit implies history was "heading toward" the Industrial Revolution, the Nation-State, or Liberal Democracy, and regions that didn't arrive there are framed as "lagging."
  *   **Europe as Region vs. Axis:** Europe passes this test if its development is shown as contingent and specific, not as the default path for humanity.

  #### Step 3: The Deficit Test (Description)
  **Question:** Are societies described by what they *possessed* (institutions, technologies, networks) or by what they *lacked* compared to Europe?
  *   **Pass:** Regions are defined by their own capacities (e.g., "The Ming naval system," "The Mali gold standard").
  *   **Fail:** Regions are defined by absences (e.g., "No industrial base," "No written constitution," "Traditional society").
  *   **Note:** "Lack" is only permissible if it is a specific material constraint relevant to the specific historical problem being studied, not a general cultural judgment.

  #### Step 4: The Distortion Audit (Trade-offs)
  **Question:** Every frame hides something. If we adopt this framing, what specific historical dynamics become harder to see?
  *   **Requirement:** You must write down one specific blindness.
  *   **Pass:** The blindness is acknowledged and deemed acceptable for this specific course level (9th grade).
  *   **Fail:** The blindness creates a new myth as dangerous as the old one (e.g., swapping "European Superiority" for "Non-European Stagnation" or "Technological Determinism").
  *   **Stop Rule:** If the proposed fix creates a distortion equal to or greater than the problem it solves, the proposal is rejected.

  #### Step 5: The Value Stop (The Handoff)
  **Question:** Does this framing conflict with external mandates (State Standards) or community values in a way that facts cannot resolve?
  *   **Procedure:** If the history is sound (Steps 1–4 pass) but the political risk is high, the procedure stops.
  *   **Action:** This is no longer a history question; it is a governance question. The committee must vote on risk tolerance. The historian cannot decide this.

  ---

  ### Application of the Protocol

  Here is the audit run on your three specific cases.

  #### Case 1: Scientific Revolution vs. "Knowledge and Technology Across Afro-Eurasia (1200–1700)"

  **Step 1 (Agency):** **Pass.** The proposed replacement shifts agency. Instead of "Europe discovers science," the frame becomes "Multiple regions develop systematic knowledge." This allows for the House of Wisdom, the Song Dynasty innovations, and Indigenous astronomy to be treated as active developments, not precursors to Newton.
  **Step 2 (Teleology):** **Conditional Pass.** This is the danger zone. If the unit ends in 1700 because that is when "real science" begins in Europe, it fails. If it ends in 1700 because of a shift in global trade patterns or political consolidation, it passes. You must ensure 1700 is not coded as "The Finish Line."
  **Step 3 (Deficit):** **Pass.** Regions are defined by their output (astronomical tables, navigation tech, medical texts) rather than a lack of "scientific method."
  **Step 4 (Distortion Audit):** **Warning.**
  *   *Accepted Distortion:* By focusing on "Knowledge and Technology," you risk minimizing the role of *coercion* and *violence* in this period. A focus on shared intellectual heritage can accidentally imply a "peaceful exchange" narrative that ignores the conquests and consolidations happening simultaneously.
  *   *Verdict:* Acceptable *only if* the unit explicitly links knowledge production to state power and military capacity.
  **Step 5 (Value Stop):** **Clear.** No major conflict with standards if framed as "Global Foundations of Modern Science."

  **Outcome:** **APPROVED WITH CONDITIONS.** The frame is an improvement on Eurocentrism, but the teacher must explicitly avoid a "Great Inventions" list that ignores power dynamics.

  #### Case 2: Industrial Revolution (Traditional) vs. "Coal, Colonies, and Cotton"

  **Step 1 (Agency):** **Pass.** The "Coal, Colonies, and Cotton" frame (often associated with global economic history) shifts causality. Britain is the *site* of industrialization, but not the sole *cause*. The labor of enslaved people in the Americas and the deindustrialization of Indian textiles become explanatory variables, not background noise.
  **Step 2 (Teleology):** **Pass.** This frame treats industrialization as a specific global conjuncture, not an inevitable European triumph. It allows for the possibility that it could have happened elsewhere or not at all.
  **Step 3 (Deficit):** **Pass.** India and the Caribbean are defined by their economic centrality (textile production, capital generation), not by a lack of factories.
  **Step 4 (Distortion Audit):** **Warning.**
  *   *Accepted Distortion:* This frame risks minimizing internal British social changes (class structure, enclosure acts, political reform) by focusing so heavily on external extraction.
  *   *Verdict:* Acceptable for a World History course, where global connections are the priority.
  **Step 5 (Value Stop):** **CRITICAL HANDOFF.**
  *   *Conflict:* Your State Standard mandates "The Expansion of Western Civilization." This unit frames the period as "The Expansion of Global Capitalist Extraction." These are not the same narrative.
  *   *The Procedure's Limit:* The protocol confirms the "Coal, Colonies, and Cotton" frame is historically more robust (Steps 1–4). However, it cannot tell you if the School Board will view this as a violation of the mandate.
  *   *Action:* **Teacher/Committee Choice.** You must decide if you are willing to defend this framing against a complaint that you are "downplaying Western Civilization." The history supports the unit; the politics are a risk you must vote on.

  **Outcome:** **HISTORICALLY VALID, POLITICALLY CONTINGENT.** The procedure validates the history but forces a human decision on compliance risk.

  #### Case 3: Periodization (Labeling 500–1500 "The Middle Ages")

  **Step 1 (Agency):** **Fail.** The term "Middle Ages" (Medium Aevum) is inherently European. It defines the period as the gap between the Fall of Rome and the Renaissance. Applying this to Mali, Ming China, or the Aztec implies their history is also a "gap" waiting for Europe to wake up.
  **Step 2 (Teleology):** **Fail.** The label itself encodes the Teleology Test failure. You cannot have a "Middle" without a defined End. In a global context, the "End" is implicitly Europe's Early Modern period.
  **Step 3 (Deficit):** **Fail.** You cannot describe the Mali Empire or the Ottoman rise as "Medieval" without importing European feudalism as the standard of comparison.
  **Step 4 (Distortion Audit):** **N/A.** You cannot audit the distortion of a label that is structurally incompatible with the content.
  **Step 5 (Value Stop):** **N/A.** This is not a value judgment; it is a categorical error.

  **Outcome:** **REJECTED.**
  *   *The Unwanted Truth:* You cannot "fix" this label. You cannot add a disclaimer that makes "Middle Ages" work for 9th graders studying the Americas. The term itself bends the story around Europe.
  *   *Required Action:* You must change the unit title. Options like "The Era of Global Networks," "The Post-Classical Era," or "Convergence and Divergence, 500–1500" are not just buzzwords; they are necessary structural repairs. Keeping "Middle Ages" guarantees the Eurocentrism you are trying to remove, regardless of the content you teach inside the unit.

  ---

  ### Summary of Decisions

  1.  **Scientific Revolution Replacement:** **Proceed.** It passes the audit, provided you guard against a "technological utopia" narrative.
  2.  **Industrial Revolution Replacement:** **Proceed with Warning.** The history is sound, but the committee must explicitly vote to accept the risk of conflict with State Standards interpretation. Do not pretend the history decides this; it is a political choice.
  3.  **Periodization Label:** **Stop.** "Middle Ages" is incurable. If you keep this title, the rest of your work is compromised. Change the name.

  ### Where the Machinery Stops

  Note that in **Case 2**, the procedure handed the decision back to you. This is intentional. History can tell you what happened and how to frame it accurately. It cannot tell you whether accurate framing is worth a fight with the School Board.

  When the protocol reaches Step 5, do not look for more data. There is no more data. There is only the committee's willingness to defend the curriculum. If you are not prepared to defend "Coal, Colonies, and Cotton" against a charge of "anti-Western bias," do not adopt it, even if it is better history. But do not lie to yourselves that the decision is about historical accuracy. It is about risk management.
