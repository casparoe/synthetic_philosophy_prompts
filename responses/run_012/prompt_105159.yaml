  To build a decision tree that captures the logical space of our debate without relying on personalities, we need to isolate the seven specific disagreements that actually drive our conclusions. The first question asks how moral weight relates to uncertainty about sentience, specifically whether you require a threshold of confidence before interests count at all or whether interests count proportionally to the probability of sentience. The second question applies only if you answer proportionally, asking whether you accept that a sufficiently large number of individuals can make a tiny probability of suffering outweigh a smaller number of high-probability sufferers, which is the core of the scale argument. The third question also follows the proportional path, asking whether moral obligation extends to wild ecosystems where human leverage is minimal or only to domains where intervention is feasible. The fourth question applies if you require a threshold, asking whether that threshold is based on specific neurological evidence for each taxon or a blanket precautionary policy default. The fifth question cuts across both main branches, asking whether the fundamental unit of moral concern is the individual organism or aggregates like species and ecosystems. The sixth question asks whether sentience itself is a binary switch that is either on or off or a graded capacity that varies in intensity. The seventh and final question asks whether the obligations generated by these calculations override standard human priorities or are constrained by reasonable partiality to our own species.

  These seven questions carve the space into eight distinct leaves, though not all are occupied. The first leaf combines proportional weighting, acceptance of aggregation, and an obligation to intervene in the wild, which corresponds to the Insect Priority View. The second leaf accepts proportional weighting and aggregation but limits obligation to domains of human leverage, resulting in a Domestic Welfare Focus. The third leaf accepts proportional weighting but rejects aggregation, meaning tiny probabilities never swamp certain concerns regardless of numbers, which we will call the Risk-Weighted View. The fourth leaf requires a threshold based on specific evidence and typically results in an Evidential Skeptic position where insects rarely qualify. The fifth leaf requires a threshold but uses a precautionary default and focuses on individuals, creating a Precautionary Individualist position. The sixth leaf is similar but focuses on taxa or ecosystems as the unit of concern, yielding a Holistic Precautionary View. The seventh leaf is an empty cell representing a threshold based on specific evidence combined with an obligation to intervene in the wild, which is diagnosed as incoherent because high evidence standards almost never meet the bar for wild insect intervention. The eighth leaf captures anyone who answers that obligations are constrained by human priorities, regardless of their previous answers, which we can label Constrained Anthropocentrism.

  Regarding your friend's view, the tree adjudicates it cleanly based on her answer to the second question. She claims that weighting interests by probability dodges the fanaticism worry, but the tree reveals this is only true if she rejects aggregation. If she accepts that astronomical numbers can outweigh high-probability concerns, her view collapses into the first leaf, the Insect Priority View, and she must accept the swamping conclusion she wishes to avoid. If she rejects aggregation, she occupies the third leaf, the Risk-Weighted View, which is a coherent but distinct position that requires explaining why numbers do not aggregate linearly. There is no separate leaf for her claim because it is not a unique combination of answers, but rather a specific path through the existing logic that either holds or fails based on her consistency regarding aggregation.

  Finally, we must note that the tree cannot perfectly separate every position due to the sixth question about the nature of sentience. For the first and second leaves, whether sentience is binary or graded makes no practical difference to the outcome because the proportional weighting already accounts for uncertainty, so these two leaves are flagged as indistinguishable on that specific axis. Additionally, the empty cell is diagnosed as repulsive rather than incoherent, since one could theoretically hold high evidence standards and still demand wild intervention, but nobody does because the leverage problem makes the obligation impossible to fulfill. This structure allows us to see that most of our fighting is happening at the second question about aggregation and the third question about leverage, rather than the underlying probability of sentience itself.
