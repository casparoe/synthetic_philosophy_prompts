          *   *Analysis:* If I act alone, my marginal impact on the *probability* of the leak is small (if others might leak). But if the norm exists, my marginal impact on *maintaining the norm* is high.
          *   *Strict Requirement:* It requires rejecting *naive* act-consequentialism where $P(\text{pivotal})$ is calculated in isolation. It doesn't necessarily require rejecting consequentialism *tout court*, but it does require a specific model of agency (participation in a practice).
