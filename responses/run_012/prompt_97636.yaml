answer: |-
  This is an exceptionally sharp observation for a seminar throwaway. You have identified a genuine tension between the *operational norms* of the security community and the *epistemic norms* of the broader scientific community, grounded in a specific decision-theoretic problem (the unilateralist's curse).

  As a third-year PhD student, you know that "what a practice presupposes" is often distinct from "what practitioners say it presupposes." Below is a reconstruction of the implicit theory underlying coordinated disclosure, parsed according to your constraints: distinguishing strict logical requirements from comfortable fits, and separating settled operational consensus from genuine philosophical contestation.

  ---

  ### 1. The Decision-Theoretic Core: Marginal Contribution and Agency

  The unilateralist's curse (as formalized by Bostrom, Douglas, and Sandberg) relies on a specific failure of naive act-consequentialism. Each agent calculates $P(\text{harm} | \text{my action}) \times \text{disvalue}(\text{harm})$. Since $P(\text{I am pivotal})$ is low (someone else might leak), the expected utility of leaking looks positive (career credit, public safety awareness) while the expected cost looks negligible.

  **What the practice *strictly* presupposes:**
  Coordinated disclosure *cannot* be justified by naive causal individualism. It strictly requires rejecting the premise that an agent's moral calculation should be based solely on the causal impact of their *isolated* token action.
  *   **The Requirement:** It presupposes that agents must treat their decision as *setting a precedent* or *participating in a practice*. To make the math work, the agent must assign significant negative utility to "eroding the norm of coordination."
  *   **Act vs. Rule Consequentialism:** The practice does *not* strictly require Rule Consequentialism (RC) over Act Consequentialism (AC). A sophisticated AC can license coordinated disclosure *if* the agent includes the "signal value" of their action (i.e., "if I leak, I lower the barrier for the next researcher"). However, the practice *does* require that agents treat the *rule* ("wait 90 days") as a proxy for the good outcome, rather than recalculating the utility of the rule for every specific vulnerability. In practice, this functions *as if* it were RC, even if the justification is AC.

  **What is merely a comfortable fit:**
  *   **Deontology:** A Kantian framework (e.g., "do not treat users as mere means to your publication record") fits comfortably here but is not required. The norm works even for thoroughgoing consequentialists.
  *   **Altruism:** The practice does not presuppose researchers are altruistic. It works via *enlightened self-interest* (preserving access to vendors, avoiding legal liability).

  **Where it is underdetermined:**
  You can arrive at the norm via **Contractualism** (Scanlon: principles no one could reasonably reject) or **Consequentialism** (maximize safety). The practice itself is neutral between these foundational ethics; it only demands that the *decision procedure* overrides the marginal-contribution intuition.

  ---

  ### 2. The Locus of Responsibility: Individual vs. Collective

  You asked if the practice presupposes that responsibility is genuinely shared.

  **What the practice *strictly* presupposes:**
  It presupposes that **pivotality is endogenous, not exogenous.** In the standard unilateralist model, the probability of others acting is fixed. Coordinated disclosure changes the game by making the probability of others acting dependent on *your* adherence to the norm.
  *   Therefore, it presupposes a model of **interdependent agency**. It treats the research community not as a collection of atomized decision-makers, but as a system where one agent's deviation alters the payoff matrix for all others.
  *   **Responsibility:** It shifts the locus of blame from "who caused the exploit?" to "who broke the coordination?" This implies a form of **obligatory collective agency**. You are responsible not just for your output, but for your maintenance of the collaborative infrastructure.

  **What is genuinely contested (Do not smooth this over):**
  *   **Ontological Status of the Group:** There is deep disagreement on whether the "security community" is a moral agent capable of bearing responsibility, or merely a label for individuals.
      *   *View A (Methodological Individualism):* Only individuals are responsible. The norm is just a Schelling point to help individuals avoid bad outcomes. (Common among libertarian-leaning security researchers).
      *   *View B (Collective Responsibility):* The community bears a duty of care. If a vulnerability is leaked prematurely, the *community* failed, not just the leaker. (Common among policy advocates and vendor liaisons).
  *   **The Reality of the Curse:** Some researchers contest whether the unilateralist's curse actually applies. They argue $P(\text{others leak})$ is often near zero for obscure bugs. For them, the norm is unnecessary paternalism. This is not a settled empirical question; it depends on the specific sub-field (e.g., critical infrastructure vs. consumer apps).

  ---

  ### 3. The Information Ethics Tension: Openness vs. Safety

  This is the friction point you identified: the clash between Mertonian norms (specifically *Communism/Communalism*—knowledge is common property) and Security norms (knowledge is a hazardous material).

  **What the practice *strictly* presupposes:**
  It presupposes an **Instrumentalist Theory of Information.**
  *   To justify withholding information (even temporarily), one must reject the view that information has *intrinsic* moral value (i.e., "truth is always good to disseminate").
  *   It requires a **Hierarchy of Values** where *Physical/Social Safety* > *Transparency*. If transparency were lexically prior, coordinated disclosure would be immoral regardless of consequences.
  *   It treats vulnerability data as **Dual-Use Research of Concern (DURC).** This is a specific policy categorization that presupposes the *potential for harm* outweighs the *benefit of immediate verification* in the short term.

  **Where the inconsistency lies (The "Nagging Bit"):**
  The community is indeed holding two incompatible pictures, but they manage it via **Contextual Segmentation.**
  *   **Picture A (Academic Ideal):** Information is a public good. Withholding is paternalistic. (Applied to basic science, theoretical vulnerabilities, post-patch analysis).
  *   **Picture B (Security Reality):** Information is a weapon. Withholding is stewardship. (Applied to unpatched zero-days).
  *   **The Philosophical Gap:** There is no settled philosophical criterion for *when* to switch from Picture A to Picture B. The 90-day window is an arbitrary heuristic, not a derived moral boundary.
  *   **Contested:** "Full Disclosure" advocates (e.g., certain factions in the crypto/anarchist tradition) argue that Picture B is always wrong. They argue that vendor secrecy is the real harm, and unilateral disclosure is a necessary corrective to market failure. They accept the unilateralist's curse as a price worth paying for accountability. This is a live, unresolved ethical debate within the field, not a historical footnote.

  ---

  ### 4. Summary: Settled vs. Contested

  To ensure you don't present contested views as consensus in your writing, here is the breakdown:

  | Feature | **Settled / Operational Consensus** | **Contested / Philosophically Open** |
  | :--- | :--- | :--- |
  | **The Norm** | Coordinated disclosure is the default professional standard for high-severity bugs. | Whether the norm should be *binding* (ethical duty) or *advisory* (best practice). |
  | **The Harm** | Unpatched exploitation causes net harm. | Whether "security through obscurity" causes *more* long-term harm than temporary exposure (the "full disclosure" counter-argument). |
  | **Decision Theory** | Researchers should not act on naive marginal contribution ($P \approx 0$). | Whether Rule Consequentialism or Contractualism is the *right* justification for ignoring marginal contribution. |
  | **Information Status** | Vulnerability data is treated as dangerous until patched. | Whether this creates a dangerous precedent for withholding other types of scientific risk data (slippery slope). |
  | **Responsibility** | The leaker is blamed for premature disclosure. | Whether the *vendor* shares responsibility for forcing the hand via slow patching (moral hazard). |

  ### 5. Reconstruction of the Implicit Theory

  If you were to write the "constitution" of this practice based strictly on what is required to make it function, it would read something like this:

  1.  **Agency:** Agents are participants in a shared practice, not isolated causal forces. (Rejects naive individualism).
  2.  **Value:** Safety is instrumentally prior to Transparency. (Rejects epistemic absolutism).
  3.  **Time:** Moral obligations regarding information are time-sensitive. (Information is hazardous at $T_0$, public good at $T_{90}$).
  4.  **Responsibility:** Adherence to the coordination mechanism is a necessary condition for moral permissibility, regardless of the specific causal outcome of the individual act. (Validates the anti-curse mechanism).

  **The Critical Gap for your Research:**
  The practice is underdetermined regarding **enforcement and boundary conditions.** Because the philosophy is a patchwork of consequentialism (safety) and contractualism (community norms), it fractures when a researcher disagrees with the community's assessment of risk. If I believe the vendor is incompetent and the 90-day window is dangerous, does the "curse" logic still hold? The current norm says "yes, coordinate anyway." The "Open Science" ethos says "no, publish."

  The community manages this contradiction not by resolving the philosophy, but by relying on **reputational sanctions**. This suggests the "theory" is actually sociological, not philosophical: the norm holds not because the math is settled, but because the cost of ostracization exceeds the benefit of unilateral action.

  **Recommendation:**
  Don't try to solve the inconsistency between Open Science and Security Disclosure. Instead, frame your inquiry around **how the community navigates the transition between "information as public good" and "information as hazardous material."** That transition point is where the unilateralist's curse is most active, and where the philosophical presuppositions are most fragile. That is a viable dissertation chapter.
