      *   *Nuance:* The "Unilateralist's Curse" (Bostrom, Douglas, Sandberg) is specific. Is it exactly applicable? In security, it's often not just "one person leaks," it's "one person leaks *before patch*." If the patch is ready, unilateralism is less harmful. So the norm is time-bound. I need to mention the *temporal* aspect.
