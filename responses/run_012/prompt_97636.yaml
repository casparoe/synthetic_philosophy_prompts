      *   *Coordinated Disclosure:* Researcher finds bug $\rightarrow$ tells vendor $\rightarrow$ waits $\rightarrow$ publishes. Prevents "zero-day" exploitation before patch.
      *   *Tension:* Academia usually values immediate publication (Mertonian norms: Communism/Communalism). Security research values withholding/delaying.
      *   *Philosophical Angles:* Consequentialism (Act vs. Rule), Deontology (Duty to warn vs. Duty to harm), Collective Responsibility, Epistemic Humility.

  3.  **Drafting the Response - Section by Section:**

