          *   *Contested:* This is a major fault line. Crypto anarchists vs. Security engineers. Some argue secrecy creates more risk (security through obscurity is bad).
      *   **Section 4: What is Settled vs. Contested:**
          *   *Settled:* The norm exists. Most agree unilateral disclosure is reckless *in high-stakes cases*.
          *   *Contested:* Where is the line? (90 days? Indefinite?). Is the curse actually the right model, or is it a prisoner's dilemma? Is the "harm" definition agreed upon?
