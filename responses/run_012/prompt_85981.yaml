      *   *Factivity:* SDT's "Hit" is $D_1=1 | C=1$. Knowledge is $C=1 \land D_1=1 \land \text{Safety}$. SDT doesn't naturally encode Safety, only Error Rates.

  6.  **Refining the Two-Stage Model for the Argument:**
      *   Need to be careful about the input to Stage 2. The prompt says "Stage 2's only input is the first stage's output."
      *   If Stage 2 only sees $D_1$ (binary), meta-$d'$ is limited. If Stage 2 sees $X_1$ (continuous evidence), meta-$d'$ can equal $d'$.
      *   Williamson's argument works even if you have access to the evidence ($X_1$), because the evidence distributions overlap across the Sorites series.
      *   *Margin for Error in SDT:* It's the distance between the criterion $c$ and the mean of the noise distribution, scaled by $\sigma$. Or, more accurately, the requirement that $P(\text{Error})$ stays below a threshold across neighboring stimuli.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the request. Validate the SDT vocabulary.
      *   **Part 1: The Translation:**
