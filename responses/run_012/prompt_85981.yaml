      *   **Part 2: The Residue Report:**
          *   Clean Translations (Noise, Overlap, Finite $d'$).
          *   Distortions (Knowledge vs. Hit, Safety vs. False Alarm Rate).
          *   The Missing Piece (Factivity and Normativity).
      *   **Part 3: Addressing the Suspicion:**
          *   Confirm it is "trivial" in SDT *if* you assume SDT exhausts the epistemic landscape.
          *   Explain the "Cheat": SDT assumes the noise; Williamson argues the noise *plus* the factivity requirement creates the paradox.
          *   The "Leftover": The gap between *predictive confidence* (SDT) and *factive status* (Knowledge).

  8.  **Self-Correction/Nuance Check during drafting:**
