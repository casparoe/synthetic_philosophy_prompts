      *   **Anti-Luminosity Argument (Williamson):**
          *   Target: Luminosity of a condition $C$ (e.g., feeling cold). $C$ is luminous if whenever $C$ obtains, one is in a position to know $C$ obtains.
          *   Mechanism: Margin for Error. Knowledge requires safety. If you know $C$ in case $\alpha$, you must not believe $C$ in a nearby case $\beta$ where $C$ is false (or slightly less true).
          *   Sorites-like series: Case $\alpha_0$ (very cold) $\to$ $\alpha_n$ (not cold).
          *   Premise 1: In $\alpha_0$, you know you are cold.
          *   Premise 2: If you know you are cold in $\alpha_i$, you are cold in $\alpha_{i+1}$ (Margin for Error).
          *   Conclusion: By induction, you are cold in $\alpha_n$ (absurd). Therefore, knowledge of coldness is not luminous.
      *   **Key Concept:** *Factivity* of knowledge vs. *fallibility* of judgment.

