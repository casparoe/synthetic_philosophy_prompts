      *   *Translation Strategy:* Let "Knowing $C$" correspond to a Stage 1 Hit *that satisfies a safety constraint*.
      *   *Mapping "Luminosity":* Luminosity means if $C$ is true, Stage 2 says "Yes, I know". So, $P(D_2=1 | C \text{ true}) = 1$.
      *   *Mapping "Margin for Error":* In SDT, this looks like the overlap of distributions. To avoid False Alarms in $\neg C$ cases, the criterion $c_1$ must be set away from the boundary.
