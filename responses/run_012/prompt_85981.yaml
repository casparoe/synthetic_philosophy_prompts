      *   **Stage 1 (First-Order):** Stimulus $S$ (e.g., temperature). Internal evidence $X_1 \sim N(\mu_S, \sigma)$. Decision $D_1 = 1$ if $X_1 > c_1$.
      *   **Stage 2 (Second-Order/Meta):** Input is $X_1$ (or $D_1$). Internal evidence $X_2$. Decision $D_2 = 1$ ("I know") if $X_2 > c_2$.
      *   **Meta-$d'$:** Measures how well confidence ratings track first-order performance relative to optimal SDT.
