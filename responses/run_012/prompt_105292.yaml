prompt: |-
  I run the grants program at a mid-size family foundation. We make around a hundred grants a year, and about a dozen of them come back asking for more money to keep going, usually somewhere between fifty and five hundred grand. I've started to notice we almost always say yes, and the reasons sound fine at the time, but I think we're basically playing the dollar auction: once you've bid, the only way to not lose your money is to bid again, so you keep bidding and the auctioneer walks off with everything. Our version is messier though. There's no guy holding up a dollar bill, and half the time I'm not even sure what the prize is worth, because the prize is just keeping the program running, so its value seems to creep up the more we've already put in.

  I need a decision procedure my team can actually run on a continuation request. Two people, one two-hour meeting, no economist in the room, and I have to write a one-page recommendation for the board, who sign off on anything over 200k.

  Things I want it to handle:

  - The questions to ask, in order, and what counts as a sufficient answer to each.
  - Where it stops with a no, and where it has to hand the decision to the board because it's a values question and not a facts question.
  - The difference between a real dollar auction (there's an actual second bidder out there, and their willingness to keep going is driven by their own sunk costs) and the seperate plain sunk-cost case (there's no second bidder, it's just us and our past spending). I think the rule you follow should be different in the two cases and I want that spelled out.
  - The late entrant. Sometimes a new funder shows up after we've been at it for years and can come in cheap, because they never paid the early rounds. I never know what to do with that one.
  - Tell me which steps are just judgment calls dressed up as procedure.

  Then run it on three cases: a grant where another funder has been matching us and keeps upping their side; a grant where the only one bidding is us; and one where your procedure says kill a program that's actually doing some real good.

  And say what the procedure definately can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Grants program manager at a mid-size family foundation.
      *   **Context:** ~100 grants/year, ~12 continuation requests ($50k-$500k). High approval rate ("almost always say yes").
      *   **Problem:** Suspects "Dollar Auction" trap (sunk cost fallacy + escalation of commitment). Value of the "prize" (program survival) is ambiguous/creeping.
      *   **Constraints:** 2 people, 2-hour meeting, no economist, 1-page board rec (for >$200k).
      *   **Requirements:**
          1.  Ordered questions + sufficient answers.
          2.  Stop points (No vs. Board escalation for values).
          3.  Distinction: True Dollar Auction (competitor bidding) vs. Sunk Cost (solo bidding).
          4.  Handling "Late Entrants" (new funders joining cheap).
          5.  Identification of "Judgment Calls dressed as Procedure."
          6.  Run the procedure on 3 specific cases (Matching funder, Solo funder, Kill a good program).
          7.  State limitations (what the procedure *can't* do).

  2.  **Analyze the Core Problem (The Dollar Auction vs. Sunk Cost):**

      *   *Dollar Auction:* Two bidders bid for $1. Highest bidder wins $1, *both* pay their bids. Rational escalation leads to paying >$1 to avoid losing the sunk cost.
      *   *Foundation Context:* Usually, it's not a literal auction where we *lose* past money if we stop. It's usually: "We spent $1M. If we stop, that $1M was wasted. If we spend $500k more, maybe it works." This is *Sunk Cost Fallacy*, not strictly a Dollar Auction unless there's a competitor we are trying to beat/outlast.
      *   *Nuance:* The user mentions a case where another funder is matching. That *is* closer to a Dollar Auction (coordination/competition dynamic).
      *   *Key Insight:* The decision must be forward-looking. Past money is gone. The question is: Is the *future* money worth the *future* impact?

  3.  **Drafting the Decision Procedure (The "Continuation Protocol"):**

      *   *Goal:* Make it actionable for 2 people in 2 hours.
      *   *Structure:* Phase 1 (Facts), Phase 2 (Strategy), Phase 3 (Decision).
      *   *Questions:* Need to force a "Zero-Based Budgeting" mindset. If we hadn't funded this before, would we fund it now?
      *   *Differentiation:* Need a specific branch for "Competitive/Matching" vs. "Solo."
      *   *Board Escalation:* When do we punt? When the math says "No" but the mission says "Yes."

  4.  **Addressing Specific Requirements:**

      *   *Questions/Answers:* Need clear pass/fail criteria.
      *   *Stop Points:* Hard "No" if metrics fail. "Board" if strategic alignment is ambiguous.
      *   *Auction vs. Sunk Cost:*
          *   *Solo:* Ignore past spend. Focus on marginal utility.
          *   *Auction (Matching):* Assess the other bidder's motivation. Are we in a bidding war? Is there a cap?
      *   *Late Entrant:* This is an opportunity to exit or reduce. If someone else can pick up the tab, we can reallocate.
      *   *Judgment Calls:* Be honest about where intuition creeps in (e.g., assessing "leadership quality").
      *   *Limitations:* Can't predict the future, can't measure soft impact perfectly.

  5.  **Developing the Three Cases:**

      *   *Case 1 (Matching):* The "Auction" scenario. Need to check if the other funder is rational or also trapped.
      *   *Case 2 (Solo):* The "Sunk Cost" scenario. Hardest to kill. Need to apply the "Fresh Eyes" test.
      *   *Case 3 (Kill Good):* The "Opportunity Cost" scenario. Program is good, but not *our* best use of funds.

  6.  **Refining the Tone:**

      *   Professional, pragmatic, slightly cynical (acknowledging the reality of foundation work), but constructive.
      *   Avoid academic jargon where possible, but use the economic concepts correctly.

  7.  **Iterative Drafting (Self-Correction during thought process):**

      *   *Correction:* Initially, I might treat all continuations as sunk cost. I need to make sure the "Matching" case gets specific treatment regarding the *other* funder's behavior.
      *   *Correction:* The user asked for a "One-Page Recommendation" structure. I should outline what that looks like as part of the procedure.
      *   *Correction:* Make sure to explicitly highlight the "Judgment Calls." Don't hide them.
      *   *Refinement on "Late Entrant":* This is actually a "Exit Strategy" trigger. If new money comes in, does it allow us to leave?

  8.  **Finalizing the Procedure Steps:**

      *   *Step 1: The Zero-Base Test.* (Would we start this today?)
      *   *Step 2: The Marginal Impact.* (What does the *new* money buy?)
      *   *Step 3: The Auction Check.* (Is there a competitor? Why are they bidding?)
      *   *Step 4: The Exit/Handoff.* (Can someone else take this?)
      *   *Decision Matrix:* Clear rules for Yes/No/Board.

  9.  **Writing the Response:** (Proceeding to generate the content based on the above structure.)

      *   *Intro:* Acknowledge the insight (it's a sharp observation).
      *   *The Protocol:* "The Continuation Audit."
      *   *The 3 Cases:* Apply the protocol rigorously.
      *   *Limitations:* Be honest.

  10. **Review against constraints:**
      *   2 people/2 hours? Yes, the protocol is designed for that.
      *   One-page rec? Included as an output.
      *   Auction vs. Sunk Cost distinction? Explicitly built into Step 3.
      *   Late Entrant? Built into Step 4.
      *   Judgment calls identified? Yes, in a dedicated section.

  11. **Final Polish:** Ensure the distinction between "Dollar Auction" (competitive escalation) and "Sunk Cost" (internal escalation) is clear, as the user specifically flagged this. In foundations, true Dollar Auctions are rare; usually, it's Sunk Cost. But matching grants can *feel* like auctions. I need to clarify that distinction in the procedure.

      *(Self-Correction on Dollar Auction definition)*: In a literal dollar auction, *both* pay. In foundation matching, usually, both pay to achieve a goal. If the goal is "keep the nonprofit alive," and both funders keep adding money just because the other is, that's escalation. If the goal is "match $1 for $1 to unlock a program," that's leverage. I need to make sure the procedure distinguishes between *leverage* and *escalation*.

      *Okay, let's write it.*
answer: |-
  This is a sharp diagnosis. You are correctly identifying that **sunk cost fallacy** (throwing good money after bad because you've already spent money) often disguises itself as **strategic commitment**. The "Dollar Auction" specifically implies a competitor driving the price up; in foundations, that competitor is often just your own past reputation or a peer foundation acting irrationally.

  Here is a decision procedure designed for your constraints: 2 people, 2 hours, one-page output.

  ***

  # The Continuation Audit Protocol

  **Goal:** Determine if the *next* dollar creates more value than that same dollar deployed elsewhere.
  **Inputs:** Grant proposal, past grant reports, financials, 2 staff members.
  **Time:** 120 Minutes.

  ## Part 1: The Questions (Ordered)

  You must answer these in order. If you fail a step, you stop or escalate. Do not skip ahead.

  ### Q1: The Zero-Base Test
  **Question:** "If we had never funded this organization, and this proposal landed on our desk today as a new request, would we fund it?"
  *   **Sufficient Answer:** A clear "Yes" backed by current data (not past relationships).
  *   **Insufficient Answer:** "We can't let them fail now," or "We know the CEO."
  *   **Stop Rule:** If **No**, proceed immediately to **Exit Strategy (Q4)**. Do not pass to Q2.

  ### Q2: The Marginal Impact
  **Question:** "What specifically does *this* requested tranche ($50k-$500k) achieve that the previous tranches did not?"
  *   **Sufficient Answer:** A specific milestone (e.g., "Completes the clinic wing," "Funds the pilot through peer-reviewed publication").
  *   **Insufficient Answer:** "Keeps the lights on," "Allows us to continue operations," "Bridges to the next fundraising phase" (without a concrete plan for that phase).
  *   **Stop Rule:** If the answer is purely operational survival with no programmatic milestone, **No**.

  ### Q3: The Auction Check (Crucial Distinction)
  **Question:** "Who else is bidding, and why?"
  *   **Scenario A (Solo/Sunk Cost):** Only us.
      *   *Rule:* Ignore past spend entirely. Evaluate only on Q1 and Q2.
  *   **Scenario B (Matching/Competitive):** Another funder is matching or co-funding.
      *   *Question:* "Is the other funder increasing their commitment *because* we did, or because of external metrics?"
      *   *Sufficient Answer:* "They are matching based on program milestones."
      *   **Insufficient Answer:** "They don't want to be the one to pull the plug," or "They are matching whatever we do."
      *   *Rule:* If the other funder is bidding based on *our* bid (escalation), cap our contribution at the point of diminishing returns. Do not enter a bidding war for a nonprofit's survival.
  *   **Stop Rule:** If it is a pure escalation war with no milestone cap, **No**.

  ### Q4: The Late Entrant / Exit Strategy
  **Question:** "If we say no, does the program die, or does someone else pick it up?"
  *   **Sufficient Answer:** "A new funder is interested," or "The org has a viable pivot plan."
  *   **Insufficient Answer:** "It collapses."
  *   **Rule:** If a "Late Entrant" (new funder) can do this cheaper (because they have no sunk costs), **we should let them.** Our capital is likely less efficient here due to our emotional baggage.
  *   **Stop Rule:** If the program dies but the *model* is proven and attractive to others, **No** (force a market correction). If the model is unproven and dies, see Q1.

  ## Part 2: Decision Matrix

  | Outcome | Action |
  | :--- | :--- |
  | **Q1 = No** | **Decline.** Draft a "sunset grant" (one final small sum to close doors gracefully) if reputation demands it, but no program funding. |
  | **Q1 = Yes, Q2 = No** | **Decline.** Operational survival is not a strategy. |
  | **Q1 = Yes, Q2 = Yes, Q3 = Escalation** | **Cap.** Fund only to the next milestone, then hard stop. |
  | **Q1 = Yes, Q2 = Yes, Q3 = Milestones** | **Proceed to Board.** (If >$200k). |
  | **Q1 = Yes, Q2 = Yes, Math = No, Mission = Yes** | **Escalate to Board.** This is a values call. |

  ## Part 3: The One-Page Board Recommendation

  If you reach the Board, use this template. It forces transparency.

  1.  **The Ask:** $[Amount] for [Purpose].
  2.  **Total Invested to Date:** $[Amount] (Disclose sunk cost openly).
  3.  **The Zero-Base Verdict:** [Would we start this today? Yes/No].
  4.  **The Marginal Win:** [What does this specific dollar buy?].
  5.  **The Auction Status:** [Solo / Matching / Escalation].
  6.  **The Cost of No:** [What happens if we walk away?].
  7.  **Recommendation:** [Fund / Decline / Fund with Conditions].

  ***

  # Where the Procedure Fakes It (Judgment Calls)

  You asked to identify the judgment calls dressed up as procedure. Here they are:

  1.  **Q1 (Zero-Base):** This is impossible to answer truly objectively. You cannot uninvent your relationship with the grantee. *Mitigation:* Require the second person in the room to play "Devil's Advocate" and pretend they have no history with the org.
  2.  **Q2 (Marginal Impact):** Grantees are skilled at painting operational costs as "milestones." Distinguishing "keeping lights on" from "fueling the engine" requires intuition about their specific business model.
  3.  **Q3 (Other Funder's Motive):** You rarely know *why* the other foundation is bidding. You are guessing their internal politics. *Mitigation:* Ask the other program officer directly. If they hedge, assume escalation.
  4.  **The "Reputation Risk" Variable:** The procedure assumes rational capital allocation. It does not account for the fact that saying "No" might burn a bridge with a community leader. That is a political calculation, not a programmatic one.

  ***

  # Running the Cases

  ### Case 1: The Matching Trap (The Dollar Auction)
  **Context:** You put in $250k. Partner Foundation put in $250k. Org needs $500k more. Partner says, "We'll match whatever you do."
  **Run:**
  *   **Q1:** Would we start this today? *Yes, the program works.*
  *   **Q2:** Marginal Impact? *Expansion to a second city.*
  *   **Q3:** Auction Check? *Partner is matching "whatever we do."* This is escalation. They are not committing to the *city*, they are committing to *us*.
  *   **Decision:** **Cap.**
  *   **Rec:** "We will fund $150k (our max for expansion). We inform the Partner we are capping at this milestone. If the second city requires $500k, the Partner must lead the remainder or the expansion is paused."
  *   **Why:** You break the auction dynamic. You force the Partner to value the *program*, not the *match*.

  ### Case 2: The Solo Sunk Cost (The Bleeding Heart)
  **Context:** You've given $1M over 5 years. Org asks for $300k. No other funders. Program is stable but not growing.
  **Run:**
  *   **Q1:** Zero-Base? *Honestly? No. It's mature, low growth. We usually fund innovation.*
  *   **Q2:** Marginal Impact? *"Keeps staff employed."* (Fail).
  *   **Decision:** **Decline.**
  *   **Rec:** "Despite $1M historical investment, the Zero-Base test fails. The marginal dollar buys operations, not impact. We will offer a $50k sunset grant for organizational wind-down or pivot."
  *   **Why:** This is the hardest one. The procedure forces you to admit the money is gone. Spending $300k more to validate the previous $1M is the definition of the trap.

  ### Case 3: The "Kill a Good Program" (Opportunity Cost)
  **Context:** Program is working. Metrics are green. But it costs $400k/year to serve 100 people. Another new proposal could serve 500 people for the same price.
  **Run:**
  *   **Q1:** Zero-Base? *Yes, it works.*
  *   **Q2:** Marginal Impact? *Serves 100 more people.*
  *   **Q3:** Auction? *Solo.*
  *   **Q4:** Late Entrant/Exit? *No one else wants it, but the cost-per-outcome is high.*
  *   **Decision:** **Escalate to Board (Values Call).**
  *   **Rec:** "Program is effective but inefficient. Continuing locks capital in a high-cost model. Stopping harms 100 beneficiaries to potentially help 500 elsewhere. Procedure suggests 'No' based on efficiency, but Mission suggests 'Yes' based on commitment. Board must decide: Are we a Venture Capitalist (efficiency) or a Safety Net (commitment)?"
  *   **Why:** The procedure identifies the tension but cannot solve it. This is where the Board earns their seat.

  ***

  # What This Procedure Definitely Can't Do

  1.  **Predict Black Swans:** It cannot tell you if stopping funding will cause a scandal that hurts the foundation's brand for a decade.
  2.  **Measure "Hope":** Sometimes programs need one more year to turn the corner. The procedure is biased against "turnarounds" because they look like sunk costs. You will miss some home runs.
  3.  **Fix Bad Grantees:** If the grantee lies about the "Marginal Impact" in Q2, the procedure fails. It relies on honest reporting.
  4.  **Replace Strategy:** If your foundation's mission is vague, Q1 (Zero-Base) becomes impossible. This procedure assumes you know what you want to buy.

  ### Final Advice for the Meeting
  When you sit down for the 2-hour meeting, put a physical object on the table representing the *past* money (a stack of paper, a rock). Acknowledge it. Then move it to the floor. **It is not in the room.** The only money in the room is the check you are writing today. If that check doesn't buy more than a check to a stranger, don't write it.
