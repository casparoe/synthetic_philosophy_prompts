  ### Prediction
  Your colleague will likely rule that Nadia has **no standing** to blame her husband.

  ### Candidate Rules and Their Predictions
  To arrive at this prediction, we must first distill the principles underlying her three previous verdicts. There are two primary competing interpretations of her logic:

  **Rule 1: The Strict Identity Principle (Formal Hypocrisy)**
  *   **Formulation:** A blamer lacks standing if and only if they are currently guilty of the *exact same type* of violation as the one they are blaming. Past violations count only if unatoned (per Case 3), and unrelated violations do not count (per Case 2's specificity).
  *   **Application to Previous Cases:**
      *   *Case 1:* Cheating vs. Cheating (Identical) $\rightarrow$ No Standing.
      *   *Case 2:* Clean on Promises (Identical norm clear) $\rightarrow$ Standing.
      *   *Case 3:* Past Promise-breaking (Atoned) $\rightarrow$ Standing.
  *   **Prediction for Nadia:** Nadia is accusing her husband of *theft* (financial betrayal). Her record is clean on theft. Her faults are *infidelity* and *lying*. These are not identical to theft.
      *   **Verdict:** **Standing.**

  **Rule 2: The Normative Domain Principle (Substantive Hypocrisy)**
  *   **Formulation:** A blamer lacks standing if they are currently guilty of violating the *underlying normative value* or *relational trust* invoked by the blame, even if the specific mechanism differs. In close relationships (like marriage), distinct wrongs (sex, money, honesty) may fall under a single unified norm of "Fidelity" or "Trust."
  *   **Application to Previous Cases:**
