answer: |-
  1. **Dependency chain**
  Do not start with "possible worlds." It reifies the tool before the problem is felt. Start with **Reference Fixing**: establish that terms pick out things via rules, not just labels. This must come first because without a rule, there is no variation to track. Second, introduce **Scenario Variation**: ask how the rule applies if the world were different. This requires the rule to be established. Third, expose **The Gap**: show a case where the rule picks out X in actuality but would pick out Y in a counterfactual scenario. This generates the need for two dimensions. Fourth, formalize **The Two Questions**: "What counts as this?" (Primary) vs. "What is this actually?" (Secondary). This distinguishes the axes. Finally, address **Necessity**: explain why one dimension yields necessary truths and the other contingent. This must be last because necessity is the *result* of the distinction, not the starting point. Starting with Kripke or indexicals traps you in metaphysics or grammar before semantics is secured.

  2. **The carrying example**
  Use **"The Lead Motor"** in a factory automation system.
  **The Setup:** The term "Lead Motor" refers to the motor designated to drive the main conveyor.
  **What it must have:** A clear functional role (driving the belt) and a specific physical identity (Motor A).
  **What it must lack:** Ambiguity or synonymy. It cannot be "the biggest motor."
  **The Twist:** Due to a wiring error unknown to staff, Motor B is actually driving the belt.
  **Extension:**
  1.  **Reference:** "Lead Motor" picks out Motor B (by function/Primary) but is rigidly Motor A (by designation/Secondary).
  2.  **Counterfactual:** "If wiring were correct, the Lead Motor would be Motor A." True on Secondary, False on Primary.
  3.  **Necessity:** "The Lead Motor is Motor A" is necessary (Secondary) but a posteriori.
  This example engages the Engineer and Statistician without invoking "water" baggage. It sustains the session because every theoretical move (reference, counterfactuals, necessity) can be tested against the wiring diagram. It avoids the "Twin Earth" feel because the divergence is internal to the system, not planetary.

  3. **The lab-coat case**
  Verdict: **Genuine.** It is structurally Twin Earth, but that is a feature, not a bug; it shows the framework's universality.
  **Placement:** Introduce at minute 60, after "The Lead Motor" is secure.
  **What it buys:** It validates the clinicians' expertise. The "gold-standard test" acts as the Primary Intension (epistemic access: whatever the test classifies). The "pathophysiology" acts as the Secondary Intension (metaphysical ground: the actual disease kind).
  **Utility:** It prevents the framework from feeling like abstract word games. It grounds the "necessary a posteriori" in their practice: "The disease is necessarily [Pathology], though we identify it via [Test]." If you treat the test as merely descriptive, you lose the distinction; ensure they see the test as the *reference-fixing rule*.

  4. **Misconception map**
  1.  **"Two strengths of possibility"** (Generated at Step 2). They will ask, "Is the first dimension just less certain?"
      *   *Head off:* When introducing Scenario Variation.
      *   *Defuser:* "It's not about certainty; it's about whether we hold the world fixed or hold the meaning fixed."
  2.  **"Descriptivism"** (Walk in with). They will say, "So it's just what I think the word means?"
      *   *Head off:* When defining Primary Intension (Step 4).
      *   *Defuser:* "It's not your mental picture; it's the public rule for applying the term across different scenarios."
  3.  **"Relativism"** (Walk in with). They will fear, "So water isn't really H2O?"
      *   *Head off:* When discussing Necessity (Step 5).
      *   *Defuser:* "Water is necessarily H2O. What's contingent is that we use 'water' to pick out H2O."
  4.  **"Indexicals Only"** (Walk in with). They will say, "This is just like 'I' or 'now', right?"
      *   *Head off:* When introducing The Lead Motor (Step 1).
      *   *Defuser:* "Notice 'Lead Motor' isn't an indexical. It's a rigid designator that still has two dimensions."
  5.  **"Diagonal as Third Meaning"** (Generated at End). They will ask, "So which one is the real meaning?"
      *   *Head off:* Conclusion.
      *   *Defuser:* "The diagonal isn't a meaning; it's a tool for checking if a statement gives information."
  *Missed:* That dimensions belong to *statements*, not just words. Address this when evaluating "The Lead Motor is Motor A."

  5. **Check for understanding**
  **Question:** "If we rewired the factory so Motor B drove the belt permanently, would 'The Lead Motor is Motor A' be true?"
  **Good Answer:** "False on the secondary dimension (identity), but tells us something about the actual wiring on the primary."
  **Wrong 1:** "True, because B is doing the work." (Reveals collapse to Primary/Descriptivism).
  **Wrong 2:** "False, because A is the name." (Revents collapse to Secondary/Ignorance of Primary role).
  This forces them to articulate the divergence rather than reciting definitions.

  6. **Left out on purpose**
  **Omit:** Formal notation (boxes/matrices), diagonal propositions as objects of belief, historical debates (Kripke vs. Chalmers), and the connection to consciousness.
  **Sentence:** "We are building a map for navigation, not manufacturing the compass; asking for the formal mechanics now is like asking for the metallurgy of the needle."
  This protects the session from technical bog-down. If pressed, remind them that utility precedes ontology. The goal is grip, not rigor.
