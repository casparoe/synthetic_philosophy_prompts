  Also - and this is probably obvious but - the source for all of this is Popper's "Natural Selection and the Emergence of Mind" from 1978, or maybe the Darwin chapter in The Poverty of Historicism or Objective Knowledge. I'm not sure which one has the actual line about "metaphysical research programme" and I'd like to know so I can cite it properly. Can you fetch it or at least verify the quote? I don't want to be that person.
