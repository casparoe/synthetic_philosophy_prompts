  So I got into this stupid argument at a department thing last week and I'm still annoyed about it. A guy in our lab - who is otherwise fine - said that Popper "refuted" Darwinism, and when I pushed back he started quoting The Poverty of Historicism at me and then said, and I quote, "your boy Popper thought evolution was a metaphysical research program, so maybe don't cite him." I don't even like Popper that much, I just didn't want to let him win, and now I've spent three nights reading about this and I have a lot of thoughts and nowhere to put them.

  Anyway. I want to write a satirical Onion-style news article about Popper's actual view of Darwinism. Like, the headline is something about how a falsifiability inspector has finally cleared natural selection after decades of suspicion, or a breaking news report that Darwinism has been downgraded to a metaphysical research programme pending further review. I want the humor to come from getting the actual Popper position right - the tautology worry, the "survival of the fittest" as unfalsifiable thing, the fact that Popper later softened this, that he called Darwinism a "metaphysical research programme" that was nonetheless "extremely valuable" as a framework, and that he basically thought the theory itself wasn't testable but specific predictions derived from it could be. I want quotes from a fictional philosopher of biology, maybe someone from "The Institute for Falsification Studies" or whatever, being incredibly serious about all of this. Maybe 600 words. Make it funny but make the actual argument recognizable to someone who's read the Popper literature on this.

