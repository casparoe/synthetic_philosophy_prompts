  ### Source Verification for the Quote

  You asked for the specific citation so you don't become "that person." The quote you are looking for is indeed from **"Natural Selection and the Emergence of Mind."**

  *   **Citation:** Popper, K. R. (1978). "Natural Selection and the Emergence of Mind". *Dialectica*, 32(3-4), 339-355.
  *   **The Quote:** "I have come to the conclusion that Darwinism is not a testable scientific theory, but a metaphysical research programme—a possible framework for testable scientific theories." (p. 345).
  *   **Context:** This was a later view. In the 1950s (around *The Poverty of Historicism*), he was more critical. In a 1981 interview (published in *The Philosophy of Karl Popper*), he softened further, saying, "I have changed my mind about the testability and logical status of the theory of natural selection."

  Your colleague is half-right on the quote, but wrong on the implication. Popper calling it "metaphysical" was not a dismissal of its utility, and he certainly didn't think he had "refuted" it in the sense of proving it false.
