answer: |-
  Here is the case, built to your specs.

  **The Case**
  A couple decides to conceive on a Tuesday rather than waiting until Wednesday. There is no medical reason, no resource constraint, and no negligence; they simply feel ready today. Due to the natural lottery of gametes and timing, the Tuesday child (Child A) will have a life that is plainly good—happy, healthy, fulfilled (welfare level 80). Had they waited until Wednesday, a different child (Child B) would have been conceived who, due to a slightly more robust genetic temperament and coinciding with a minor bump in the parents' career stability, would have had a life that is somewhat better (welfare level 85). Both lives are well worth living. The parents choose Tuesday. Child A is born.

  **The Verdicts**
  1.  **Narrow Person-Affecting View:** **Permissible.** Child A exists and has a good life. Child A cannot claim they are worse off than they would have been, because in the alternative branch, Child A does not exist. No actual person is harmed or made worse off relative to their own baseline.
  2.  **"Better Luck Available" (Wide Comparison):** **Wrong.** This principle holds that you ought to bring about the state of affairs where the resulting person is better off, even if it is a different person. Since Child B would have been better off than Child A is, the parents failed to maximize the welfare of the child-position.
  3.  **Plain Totalism:** **Wrong.** Outcome B contains more total welfare (85) than Outcome A (80). Since the number of people is fixed at one, maximizing total welfare requires choosing B.

  **The Analysis**
  Your guess is correct: when the number of people is held fixed, View (2) and View (3) are extensionally identical. They condemn the exact same acts. The feature doing the work is **identity independence**. Both (2) and (3) treat welfare as a value that attaches to a "slot" (the child) rather than essentially to the specific individual. If you pull that feature out—i.e., if you insist that welfare *must* be tied to the specific identity of the person—the case collapses back into the ordinary Non-Identity Problem (View 1), where the act becomes permissible. So yes, this is the same case with the arrow flipped: the standard NIP shows Narrow PAV is too permissive; this mirror case shows Wide PAV/Totalism is too demanding.

  **The Person-Affecting Attack**
  A defender of strict Person-Affecting Views will not argue that the intuition is wrong; they will argue that **View (2) is not a person-affecting view.** Their strongest objection is the **"No Subject of Harm"** claim. They will say: "To say the Tuesday choice is wrong because Child B *would have* been happier is to treat people as vessels for value. It is not worse *for Child A* that Child B wasn't born. It is not worse *for Child B* that they weren't born (they don't exist). If it is not worse for anyone, it violates the core person-affecting restriction that an outcome can only be worse if it is worse for some particular subject." They will argue you haven't found a mirror case for PAV; you've found a case where PAV agrees with intuition (Permissible), and Impersonal Views (Totalism/Wide) clash with intuition. View (2) is the trench coat.

  **The Knowledge Condition**
  The case does not need the parents to have known the alternative was better for the act to be objectively wrong under View (2) or (3); the suboptimality exists in the world regardless of their epistemic state. However, if you add a knowledge condition to make the condemnation stick morally (blameworthiness), you risk degrading the problem into negligence. The philosophical punch of the Non-Identity Problem is metaphysical (about identity and existence), not epistemological. If the condemnation only holds when they *know*, you lose the structural parallel to the standard NIP, where the act is problematic even if the parents are well-meaning.

  **The Straight Answer**
  You asked me to tell you if this can't be built. Here is the hard truth: **View (2) is widely regarded as a straw man by strict person-affecting theorists.** It is often labeled the "Same Number Quality Claim" (Parfit) rather than a person-affecting view. Most philosophers who champion person-affecting views do so specifically to *avoid* the conclusion of View (2). They accept the counterintuitive result of the standard NIP (that the act is permissible) precisely because they refuse to compare different possible people. So, while you have successfully constructed a scenario where Totalism condemns the ordinary, you haven't forced a *person-affecting* view to condemn it—you've forced an *impersonal* view to do so. The mirror image holds logically, but it breaks terminologically: the view that condemns the act has already surrendered the person-affecting constraint.
