  7.  **Final Polish:**
      *   Ensure the tone is "intellectual historian" (slightly formal, precise, attentive to context).
      *   Make sure to answer the specific questions (coding rules, 50% budget, temperament).
      *   *Self-Correction during drafting:* I initially thought about suggesting a 3-variable model. But even that quantifies the unquantifiable. Better to suggest a qualitative matrix.
      *   *Crucial Insight:* The student's colleague in Political Science is thinking like a modern social scientist (leadership studies). Machiavelli is a pre-modern rhetorician. The anachronism is the source of the friction. I need to highlight this disciplinary clash gently.

