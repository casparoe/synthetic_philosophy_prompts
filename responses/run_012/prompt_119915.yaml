  9.  (Self-Correction on Tone): Make sure I don't sound condescending. The student's idea is actually quite sophisticated, just misaligned with the text's ontology. Frame it as "The text resists this operationalization because..." rather than "You are wrong."

  10. (Final check on the "Fixed Temperament" issue): Machiavelli explicitly says in Ch 25 that if a man could change his nature to fit the times, he would never have bad luck. But he *can't*. So the failure is due to the *immutability* of nature. Is that *fortuna*? In a sense, yes (it's given), but it manifests through the agent. This is the paradox. I need to explain that this paradox is the *point*.

