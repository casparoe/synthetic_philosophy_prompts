answer: |-
  ### 1. The Spec: Desiderata for a Theory of Life

  | Requirement | The Biology / Case Behind It | Status |
  | :--- | :--- | :--- |
  | **Paradigm Coverage** | Must classify bacteria, trees, humans, etc., as *Alive*. If it excludes a standard bacterium, it's broken. | **Non-Negotiable** |
  | **Borderline Resolution** | Must place viruses, viroids, prions, plasmids, and mitochondria on a spectrum or justify a hard cut without arbitrariness. Cannot just legislate "viruses aren't alive" without explaining why they share 90% of the properties. | **Non-Negotiable** (for theory); **Optional** (for detectors) |
  | **Individual vs. Lineage** | Must resolve the Mule (alive but sterile) and Sterile Caste (ants/bees) problem. If reproduction is required, the unit must be the *lineage*, not the individual. If the individual is the unit, reproduction cannot be required. | **Non-Negotiable** |
  | **Temporal Continuity** | Must handle dormant states (spores, cryptobiosis, seeds, frozen embryos) and RBCs (no nucleus/division). Life cannot require constant metabolic activity or constant division. | **Non-Negotiable** |
  | **Thermodynamic Distinction** | Must distinguish life from fire, crystals, and convection cells. All dissipate energy and grow. Life must do something *more* (e.g., store information, constrain its own production). | **Non-Negotiable** |
  | **Substrate Independence** | Must account for synthetic cells, digital genomes, and potential silicon/alternative biochemistries. Cannot define life strictly by DNA/Protein/Carbon if the *process* is replicated elsewhere. | **Camp-Specific** (Materialists vs. Functionalists) |
  | **Historical/Modal Status** | Must answer the "Extinct Lineage" question. Is a species alive if no members exist? Is the *file* alive if never read? Life must be grounded in actual causal history, not just potentiality. | **Non-Negotiable** |
  | **Non-Circularity** | Cannot define life using "organisms," "cells," or "biological." Must use physics, chemistry, or information terms. | **Non-Negotiable** |
  | **Operationality** | Must be testable by an astrobiologist with a probe. Cannot rely on hidden historical ancestry (e.g., "must be descended from Earth life"). | **Camp-Specific** (Detectors vs. Theorists) |
  | **Sharp Binary** | Must yield a Yes/No verdict. | **Camp-Specific** (Classifiers vs. Process Philosophers) |
  | **Natural Kind** | Must track a single underlying reality (a "thing" in nature) rather than a human conceptual cluster. | **Camp-Specific** (Realists vs. Pragmatists) |

  ---

  ### 2. The Trade-Offs (The Impossible Triangle)

  You cannot satisfy these three simultaneously. You must drop one.

  1.  **Sharp Binary:** Life is a Yes/No state.
  2.  **Borderline Accuracy:** The theory correctly handles viruses, mules, spores, and colonies without arbitrary cutoffs.
  3.  **Natural Kind:** "Life" tracks a single, unified physical phenomenon in the universe.

  **The Conflict:**
  *   **If you keep Binary + Natural Kind:** You fail Borderline Accuracy. You must declare viruses "dead" despite their evolution, or "alive" despite their lack of metabolism. You must declare mules "dead" or redefine the individual. This creates biological falsehoods to save the definition.
  *   **If you keep Binary + Borderline Accuracy:** You fail Natural Kind. You end up with a checklist (e.g., "5 out of 7 criteria"). This makes life a "family resemblance" concept (Wittgenstein), not a real thing in nature. It's a human categorization, not a physical law.
  *   **If you keep Natural Kind + Borderline Accuracy:** You fail Sharp Binary. Life becomes a process or a continuum. A virus is "more alive" than a crystal but "less alive" than a bacterium. A mule is a dead-end node in a living network. This satisfies biology but frustrates taxonomists and detectors who want a light that turns on/off.

  **Recommendation:** **Drop the Sharp Binary.**
  Biology is evolutionary; evolutionary processes are gradual. There was no "first organism." There is no sharp line between a self-replicating ribozyme and a protocell. Demanding a binary forces you to ignore the gradient nature of emergence. Accept life as a **process variable** (degree of aliveness) rather than a state variable.

  ---

  ### 3. Scorecard: How Standard Criteria Fare

  | Criterion | Passes Paradigms? | Handles Borderlines? | Distinguishes from Fire? | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Metabolism** | Yes | **No.** Fails viruses, spores, RBCs, dormant seeds. | Yes | **Too Narrow.** Ties life to current activity, ignores history/potential. |
  | **Reproduction** | **No.** Fails mules, sterile castes, post-reproductive humans. | **No.** Fails individuals. Works only at lineage level. | **No.** Fire "reproduces" crystals "replicate." | **Needs Qualification.** Must be *Darwinian* reproduction (heritable variation), not just copying. |
  | **Evolution (Darwinian)** | Yes | **Yes.** Handles viruses, viroids, prions. | **Maybe.** Fire doesn't evolve open-endedly. Crystals do, but limitedly. | **Strongest Candidate.** But needs "open-endedness" to exclude crystals. |
  | **Compartmentalization** | Yes | **No.** Fails slime mold aggregates, colonies, naked RNA. | Yes. | **Necessary but Insufficient.** Vesicles form abiotically. |
  | **Information/Genotype** | Yes | **Yes.** Handles synthetic cells/files. | **No.** Computer viruses, books. | **Needs Physical Grounding.** Information must cause its own physical preservation. |
  | **Autopoiesis (Self-Making)** | Yes | **No.** Fails viruses (allopoietic). | Yes. | **Too Strict.** Excludes the very things (viruses) that force us to refine the definition. |

  **The Killer Requirement:** **Thermodynamic Distinction + Open-Ended Evolution.**
  This combination knocks out the most candidates.
  *   Fire dissipates energy but doesn't store information to constrain its own future growth.
  *   Crystals replicate but have limited variance (no open-ended evolution).
  *   Computer viruses evolve but lack physical self-maintenance (unless embodied in a self-repairing robot).
  *   Viruses pass this if viewed as part of the host lineage; fail if viewed as isolated individuals.

  ---

  ### 4. Summary Notes for Your Spec

  *   **Unit of Analysis:** Shift from "Individual Organism" to "Lineage of Darwinian Evolution." This solves the Mule, the Sterile Caste, and the Mitochondria. The *lineage* is alive; the individual is a vehicle.
  *   **The Virus Verdict:** Under a lineage view, viruses are living *when infecting* (part of the metabolic/evolutionary system) and non-living *when virions* (chemical packets). Or, accept them as obligate parasites within the living domain. Do not exclude them based on autonomy; autonomy is a spectrum (mitochondria aren't autonomous either).
  *   **The Synthetic/Digital Verdict:** If the file causes the construction of a physical system that maintains itself and evolves, the *system* is alive. The file is the genotype. If the file is never read, it is a blueprint, not life (matches the "Extinct Lineage" logic: potentiality requires actualization history).
  *   **The "Natural Kind" Trap:** Stop looking for "Life" as a noun. Treat "Living" as an adjective describing a specific thermodynamic/informational regime. This allows you to say "This system is highly living" (bacterium) vs "minimally living" (virus) vs "non-living" (fire).
  *   **Operational Warning:** An astrobiological detector *needs* a binary (alarm on/off). A theory of life *does not*. Do not conflate the instrument spec with the ontology. The instrument will always produce false positives/negatives relative to the theory.

  **Final Instruction:** Build your theory around **Open-Ended Darwinian Evolution constrained by a Thermodynamic Boundary.** Everything else is commentary.
