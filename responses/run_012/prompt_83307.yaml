prompt: |-
  ok so i'm trying to build a spec here, not another essay. before i read one more "what is life" paper i want to know what i should be demanding of any answer to that question. give me the desiderata -- the full list of things a theory of life has to deliver to count as adequate, each one with the case or the biology behind it, and say which are non-negotiable and which are just what one camp happens to want.

  here's the kind of stuff it has to get right, and yes i know some of these are cheap shots:

  - a virus. it has a genome, it evolves, it's under selection, but it doesn't run its own metabolism and can't replicate without hijacking a cell. also the giant ones whose genomes are bigger than some bacteria's, and the ones that seem to carry genes for translation-related machinery.
  - a viroid: a bare loop of RNA, no coat, no protein, still makes plants sick and still evolves.
  - a prion: no nucleic acid at all, just a misfolded protein that talks other copies of the same protein into the same shape, and every so often a variant shape that breeds true.
  - a plasmid or a transposon: a chunk of DNA that copies itself around and sometimes jumps species. is it a living thing, or a thing inside a living thing?
  - mitochondria: ex-bacteria, own genome, own ribosomes, but you can't take one out and have it live on its own.
  - a mule. definately alive. can't reproduce. so either reproduction isn't the whole story or the unit of life isn't the individual.
  - a mammalian red blood cell: no nucleus, no genome, no division. a dormant spore, a seed, a tardigrade curled up in cryptobiosis for decades with metabolism at basically zero. a frozen embryo.
  - a lichen, a slime mold that's single cells until it starves and then aggregates, a portuguese man o' war, a bee colony: individual, colony, or one organism?
  - fire, a growing crystal, a computer virus, a self-replicating 3D printer, a clay that seeds more of itself at the crystal edge and occasionally copies with a defect that breeds true.

  and a few i made up so you can't just sort them by remembered verdicts:

  - a protocell in a lab: a fatty acid vesicle that grows by soaking up more lipid, splits when it gets too big, and carries a ribozyme that copies short RNA strands badly. no proteins, no metabolism worth the name.
  - a synthetic cell whose genome is a file on a computer; the physical cell gets built from the file and destroyed when the next file is read. is the file alive? is the lineage? does the answer change if the file is never read again?
  - a lineage whose last member just died. was the species ever alive, and is it dead now, or was "alive" never the sort of thing a species could be?

  what i want back, roughly:

  1. the list of requirements, each with the case or the biology behind it. stuff like: must classify the paradigm cases right; must handle the borderline ones without just legislating; must respect the actual results -- heritable variation, the shared genetic code and common ancestry of everything we know about, membranes and compartments, the thermodynamics of staying ordered far from equilibrium by eating free energy, and the fact that life emerged gradually so there's no sharp first organism unless you can say why; must not be circular (you can't define life in terms of organisms or cells); must be able to answer for life as we don't know it -- silicon, non-carbon, a lineage that lost reproduction entirely; must be operational enough for an astrobiologist or a bio teacher to actually use; and must be either a real distinction in nature or honestly declared a convention.

  2. which of those are genuinely required and which are just prejudices of one camp -- the people who want a sharp yes/no, the people who want "life" to be a natural kind, the people who want it to be a family resemblance / prototype concept, the astrobiologists who just want a detector.

  3. where two of them can't both be had. i especially want the pair or triple that's jointly unsatisfiable, and i suspect it's somewhere between "sharp and binary", "gets every borderline case right", and "tracks a real natural kind". tell me which one to give up, or why i don't have to.

  4. keep the scoring light: at the end, a line or two on which requirement knocks out the most candidates, and how the usual criteria (metabolism, reproduction-plus-evolution, a self-producing network with its own boundary, information/instructions) fare against the list.

  no reading list, no citations, this is for my own notes, so write it like that. and if a table helps for the requirements then seperate them out into one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (desiderata) for a theory of life, not an essay or a reading list.
      *   **Tone:** Direct, technical, no-nonsense, "for my own notes."
      *   **Content:**
          1.  List of requirements (desiderata) with biological/philosophical justification.
          2.  Classification of requirements: Non-negotiable vs. Camp-Specific (prejudices).
          3.  Trade-offs/Incompatibilities: Identify the "impossible triangle" (e.g., sharp binary vs. borderline accuracy vs. natural kind).
          4.  Scoring/Summary: Which requirement kills the most candidates? How do standard criteria (metabolism, reproduction, etc.) fare?
      *   **Constraints:** No citations, no reading list. Use a table if helpful. Address specific edge cases provided (viruses, viroids, prions, mules, RBCs, colonies, fire/crystals, protocells, synthetic cells, extinct lineages).

  2.  **Deconstruct the Edge Cases (Mental Sandbox):**
      *   *Viruses/Viroids/Prions:* Challenge the "metabolism" and "independent replication" criteria. Challenge the "cellular" criterion.
      *   *Plasmids/Transposons:* Challenge the "individuality" criterion.
      *   *Mitochondria:* Challenge the "autonomy" criterion.
      *   *Mules/sterile castes:* Challenge the "reproduction" criterion (individual vs. lineage).
      *   *RBCs/Spores/Cryptobiosis:* Challenge the "metabolism/activity" criterion (temporal discontinuity).
      *   *Colonies (Lichen, Slime Mold, Siphonophore, Hive):* Challenge the "individuality/boundary" criterion.
      *   *Fire/Crystals/Clay:* Challenge the "thermodynamics/replication" criteria (need to distinguish dissipative structures from life).
      *   *Protocells:* Challenge the "threshold" criterion (when does chemistry become biology?).
      *   *Synthetic/Digital:* Challenge the "substrate" criterion (is life material or informational?).
      *   *Extinct Lineage:* Challenge the "modal" status (is life a property of the present or the history?).

  3.  **Drafting the Desiderata (Requirement List):**
      *   Need to cover: Paradigm cases, Borderline cases, Thermodynamics, Evolution, Individuality, Substrate independence, Operationality, Non-circularity.
      *   *Refinement:* Make them punchy. "Must classify paradigm cases" -> "Paradigm Coverage." "Must handle borderlines" -> "Borderline Resolution."

  4.  **Categorizing Requirements (Non-negotiable vs. Camp):**
      *   *Non-negotiable:* Non-circularity, Paradigm Coverage (Earth life), Thermodynamic consistency (no perpetual motion), Evolutionary capacity (otherwise it's just a statue).
      *   *Camp-Specific:* Sharp Binary (some want fuzzy), Natural Kind status (some want process), Substrate Independence (some want carbon-only), Individual vs. Lineage focus.

  5.  **Identifying the Trade-offs (The "Impossible Triangle"):**
      *   The classic trilemma in definition of life:
          1.  **Binary Classification** (Yes/No).
          2.  **Borderline Accuracy** (Handling viruses, mules, etc. nuance).
          3.  **Natural Kind Status** (Tracking a single underlying reality).
      *   *Analysis:* If you want a sharp binary, you fail borderlines (viruses are either in or out, both feels wrong). If you want to handle borderlines (fuzzy), you lose the binary. If you want a Natural Kind, you might have to exclude things that feel alive (mules) or include things that don't (fire?).
      *   *Recommendation:* Drop the "Sharp Binary." Life is a process/continuum.

  6.  **Evaluating Standard Criteria:**
      *   *Metabolism:* Kills viruses, spores, mules. Too strict on individuals.
      *   *Reproduction:* Kills mules, sterile castes. Needs to be lineage-level.
      *   *Evolution:* Good, but fire/crystals evolve in a sense. Needs "Open-ended" or "Darwinian."
      *   *Compartmentalization:* Good for protocells, tricky for slime molds/colonies.
      *   *Information:* Good for synthetic/digital, tricky for prions.

  7.  **Structuring the Output:**
      *   **Section 1: The Spec Table.** Columns: Requirement, The Biology/Case, Status (Hard/Soft).
      *   **Section 2: The Trade-offs.** The trilemma explanation.
      *   **Section 3: The Scorecard.** How standard definitions fail.
      *   **Section 4: Recommendation.** What to drop.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the synthetic cell file? *Adjustment:* Ensure "Substrate Independence" covers digital/physical mapping.
      *   *Check:* Did I address the extinct lineage? *Adjustment:* Ensure "Historical/Modal" status is in the requirements.
      *   *Check:* Is the tone right? *Adjustment:* Remove fluff. Use bullet points. Keep it dense.
      *   *Check:* The user asked for "which one to give up." *Decision:* Give up the Binary. It's the weakest link philosophically and biologically.

  9.  **Final Polish:**
      *   Ensure the distinction between "Individual" and "Lineage" is clear (Mule problem).
      *   Ensure the distinction between "Dissipative Structure" and "Life" is clear (Fire problem).
      *   Make sure the "Non-negotiable" vs "Camp" distinction is sharp.

  10. **Final Review against constraints:** No citations? Check. No essay? Check. Table included? Check. All edge cases acknowledged? Check.

  *(Self-Correction on the "Natural Kind" point)*: Many philosophers argue life *isn't* a natural kind. I should reflect that in the "Camp" section. The "Process" view is the alternative.

  *(Self-Correction on "Operationality")*: Astrobiologists need a detector. Philosophers need a concept. These conflict. I need to highlight that tension.

  *(Final Plan)*:
