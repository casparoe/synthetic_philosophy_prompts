answer: |-
  Here is a complete plan for a 50-minute session. This game is designed to be run by you while you play, with minimal admin burden.

  # Game Title: "The Red Queen Race"
  *(Do not use the words Moloch, Trap, or Prisoner's Dilemma until the debrief.)*

  ## 1. Materials List
  *   **Tokens:** 20 identical items per person (poker chips, candies, beads, or just tick marks on paper). Total needed: ~300.
  *   **Slips of Paper:** Small cut squares, 5 per person (for secret bids).
  *   **Pencils:** One per person.
  *   **Whiteboard & Markers:** For tracking the "Leaderboard."
  *   **Scorecards:** Pre-printed half-sheets (template below).
  *   **A "Tally Master":** Recruit one student before the session starts to write numbers on the board. This frees you to play.

  ## 2. Setup & Scoring Logic
  **The Goal:** Maximize your **Final Score**.
  **The Formula:** `Final Score = (Rank Points) - (Total Tokens Spent)`

  **The Rank Points (The Trap):**
  We are not scoring based on how many tokens you have left. We are scoring based on where you finish relative to others.
  *   **Top 4 Players:** 60 Points each.
  *   **Middle 6 Players:** 30 Points each.
  *   **Bottom 4 Players:** 0 Points each.
  *   **Tie Rule:** If players tie, they split the points of the ranks they occupy. (e.g., If all 14 tie, everyone gets the average: 30 points).

  **Why this math works:**
  *   **Peace Scenario:** If everyone spends 0 tokens, everyone ties. Everyone gets the Average (30 pts). Cost is 0. **Final Score = 30.**
  *   **War Scenario:** If everyone spends all 20 tokens, everyone still ties. Everyone gets the Average (30 pts). Cost is 20. **Final Score = 10.**
  *   **The Incentive:** If everyone is spending 20, and you spend 21 (or managed to spend 20 while others spent 19), you break the tie. You jump from "Average" (30) to "Top 4" (60). That jump is worth 30 points for the cost of 1 token. It is *always* rational to spend one more token to secure the higher tier.

  ## 3. The Rules (Read these aloud)
  1.  **Start:** You each have **20 Tokens**.
  2.  **Rounds:** We will play **4 Rounds**.
  3.  **Bidding:** Each round, write down how many tokens you want to spend (0 to 5). Put it in the center. You cannot get these tokens back.
  4.  **Power:** Your "Power" is the total tokens you have spent so far.
  5.  **Ranking:** After Round 4, we rank everyone by Total Power. Highest Power = Top Tier.
  6.  **Scoring:** Your Final Score is your **Rank Points** minus your **Total Spent**.
  7.  **Winning:** The person with the highest Final Score wins the prize (candy/bragging rights). *Note: If everyone plays "rationally," everyone might lose.*

  ## 4. Run of Show (50 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Hand out tokens/scorecards. Read rules. **Do not mention strategy.** |
  | **05-10** | **Round 1** | Secret bids. Tally Master sums them on board (anonymous). Update "Total Spent" on scorecards. |
  | **10-15** | **Round 2** | Repeat. Announce current "Tie Status" (e.g., "Currently, 12 people are tied for Top Tier"). |
  | **15-20** | **Round 3** | Repeat. Tension should be rising. |
  | **20-30** | **The Pact** | **Stop the game.** Allow 5 mins open discussion. They can agree to stop spending. Then 5 mins to write Round 4 bids. |
  | **30-35** | **Round 4** | Final bids. Reveal. Calculate Final Ranks. |
  | **35-40** | **Scoring** | Calculate Final Scores. Announce winner (if any). |
  | **40-50** | **Debrief** | The philosophical discussion (script below). |

  ## 5. Facilitator Guide (While Playing)
  *   **Your Role:** You are a player. Submit your bids secretly.
  *   **Admin:** The Tally Master writes the *sum* of bids on the board, not who bid what. This keeps it anonymous and saves you time.
  *   **Pacing:** Keep rounds moving. 5 minutes max per round.
  *   **The "Creep":** In Rounds 1 and 2, most will bid 0 or 1. By Round 3, fear will set in. "If I don't bid now, my previous tokens were wasted."
  *   **The Pact:** When you open the floor for negotiation, **do not lead.** Sit silent. Let them realize they are burning points. Let them propose the pact.
  *   **The Failure:** When they agree to bid 0 in Round 4, remind them: *"Remember, bids are secret. You can agree, but you write your number alone."* This is crucial. The pact fails because enforcement is impossible.

  ## 6. Predictable Problems & Fixes
  *   **"The Saint":** One kid refuses to spend anything on principle.
      *   *Result:* They will likely end up in the Bottom Tier with a score of 0.
      *   *Fix:* Do not save them. In the debrief, point out that their morality was punished by the structure. That *is* the lesson.
  *   **"The Villain":** Someone brags about breaking the pact.
      *   *Result:* They might win.
      *   *Fix:* In debrief, ask: "Did they win because they were evil, or because the rules rewarded betrayal?" Shift blame from person to system.
  *   **Math Errors:** 14 players is a lot to rank manually.
      *   *Fix:* Have the Tally Master sort the total scores on the board from High to Low as they come in. Draw the Tier lines (Top 4, Bottom 4) visually.
  *   **Time Overrun:** Scoring takes too long.
      *   *Fix:* Pre-draw the Tier brackets on the board. Just slot names into the brackets. Don't calculate exact scores for everyone, just the Top 3 and the Average.

  ## 7. The Debrief Script (The Most Important Part)
  *Do not lecture. Ask questions. Let them feel the frustration first.*

  **Phase 1: The Feeling**
  *   "Look at your Final Score. Look at how many tokens you have left. Who ended up with a lower score than if we had all just sat on our hands for 50 minutes?"
  *   (Most hands will go up).
  *   "Did anyone here *want* to waste their tokens? Did anyone wake up this morning hoping to burn resources for no gain?"

  **Phase 2: The Structure (Killing the 'Villain' Theory)**
  *   "If we did this again, would the result change?" (They will say no).
  *   "Why? Was it because [Student Name] is a bad person?"
  *   "No. It's because if you agreed to stop, and I spent 1 token, I win big. And if you think *I* might spend 1 token, you *must* spend 1 token to defend yourself."
  *   "This isn't a Prisoner's Dilemma. In PD, two people betray each other. Here, even if we all love each other, the **math forces us to burn**."

  **Phase 3: Naming Moloch**
  *   "This system has a name. In philosophy and game theory, we call this a **Multipolar Trap**."
  *   "Sometimes people give it a mythological name: **Moloch**."
  *   "Moloch isn't a person. It's not a villain. Moloch is the name we give to a system where competition for relative advantage destroys absolute value for everyone."
  *   "Examples: Arms races. Advertising wars (if no one advertises, we all save money, but if one does, the rest must follow). College admissions (if no one does extracurriculars, colleges judge by grades. If one does extracurriculars, everyone must, and grades still matter)."

  **Phase 4: The Ratchet**
  *   "Why couldn't we just stop in Round 3?"
  *   "Because the tokens were already spent. That's the **Ratchet**. You can't un-burn the fuel. The only way to justify the fuel you already burned is to burn more to win. Sunk cost fallacy becomes structural necessity."

  ## 8. Limitations (What the Game Can't Show)
  *Be honest about this so they don't oversimplify.*
  1.  **Exit:** In the game, you had to play. In real life, sometimes you can leave the market/system (though often at great cost).
  2.  **Regulation:** The game had no referee. In reality, governments/laws often exist to ban the "bidding" (e.g., banning child labor, banning certain weapons). Moloch is what happens when there is no referee.
  3.  **Consciousness:** In the game, you are humans choosing. In reality, Moloch often works through corporations or evolutionary pressures where no single "person" is making the choice. The system selects for the behavior.

  ## 9. Scorecard Template (Print 15 copies)
  ```text
  NAME: ___________________

  ROUND 1 BID: _____  |  TOTAL SPENT: _____
  ROUND 2 BID: _____  |  CURRENT POWER: _____
  ROUND 3 BID: _____  |
  ROUND 4 BID: _____  |

  FINAL TOTAL SPENT: _________

  FINAL RANK TIER:  [ ] TOP 4   [ ] MIDDLE 6   [ ] BOTTOM 4
  RANK POINTS:      [ ] 60      [ ] 30         [ ] 0

  FINAL SCORE (Points - Spent): _____________
  ```

  ## 10. Final Facilitator Check
  *   **Can you play?** Yes, because the Tally Master handles the board. You just submit a slip.
  *   **Is it 50 mins?** Yes, if you keep the rounds tight.
  *   **Does it feel bad?** Yes, because the math guarantees that unless 10+ people irrationally refuse to play, the average score drops below the "Peace" baseline.
  *   **Does the pact fail?** Yes, because the bids are secret in the final round. Even if they trust each other, the *fear* that one person might defect forces everyone to defect. That is the definition of the trap.

  **One last tip:** When you announce the winner, if the winner has a lower score than the "Peace Scenario" (30 points), point that out immediately. "The winner still lost. The system beat everyone." That is the moment they will understand Moloch.
