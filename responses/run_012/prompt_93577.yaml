  OK so context first: I'm a backend engineer, no philosophy degree at all, but I've fallen down a rabbit hole after a lunch argument with a friend who's doing a PhD in philosophy, and this has been bugging me alot. The thing we keep circling is Nozick's tracking theory of knowledge — the one where you know something if your belief tracks the truth, roughly: it's true, you believe it, if it were false you wouldnt believe it, and if it were true you would. Fine, I can follow that. What I can't get past is the closure thing: the standard line is that tracking has to give up the principle that if you know p and you know that p implies q, then you know q, because the sensitivity condition isn't preserved under deduction — you can know some ordinary fact about your surroundings but not know that you're not a brain in a vat, even though the ordinary fact implies you're not one. My friend insists this is fixable, that if you relativize the counterfactuals to the method you used to form the belief, and then treat deduction itself as a method that inherits the sensitivity of its premises, you can have your cake and eat it: sensitivity stays a real necessary condition on knowledge and single-premise closure comes back for free.

