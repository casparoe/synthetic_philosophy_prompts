          *   Meaning: If $A \subset B$ and $A \neq B$, then $B$ is "greater" than $A$ in the sense of inclusion.
          *   Status: True by definition of proper subset.
          *   Relevance: Doesn't contradict Cantor. Cantor agrees $2\mathbb{N} \subset \mathbb{N}$. The dispute is about *size* (cardinality), not inclusion.
