answer: |-
  Your hypothesis is astute, and it captures a significant portion of the frustration inherent in this debate. You are correct that both sides largely agree on the *data* (the linguistic behavior, the validity of inferences) and diverge on the *meta-theoretical constraints* placed on a solution. However, I suggest your hypothesis requires a slight but crucial sharpening. The disagreement is not merely that they are answering different questions under a single heading, nor is it purely verbal.

  Here is the diagnosis of the disagreement, followed by an assessment of where progress lies.

  ### 1. Diagnosis: A Clash of Explanatory Priority, Not Just Meaning

  Your hypothesis suggests that the expressivist is answering "What is the function?" while the critic is answering "What is the compositional meaning?" and that these need not compete. I argue they **must** compete, and that is why the argument is circular.

  Both sides claim to explain the same phenomenon: **Logical Validity.**
  *   **The Critic's Constraint:** Validity is defined as the preservation of truth-conditions across possible worlds. Therefore, a semantic theory must assign truth-conditional content to moral sentences to explain why Modus Ponens works. If the expressivist cannot provide truth-conditions that are robust enough to sustain logic, the theory fails.
  *   **The Expressivist's Constraint:** Validity is defined as the consistency of cognitive or conative states (plans, attitudes). Therefore, a semantic theory must explain how attitudes combine logically without positing truth-apt representations. If the realist posits truth-conditions that detach moral judgment from motivation/action, the theory fails.

  The disagreement is not verbal (about the word "meaning") but **structural**. It is a dispute about **explanatory priority**.
  *   **The Realist/Critic** prioritizes the *structure of logic*. They assume semantics must mirror the formal properties of inference. If moral language behaves like factual language, it must be underwritten by factual content.
  *   **The Expressivist** prioritizes the *structure of agency*. They assume semantics must mirror the psychological role of judgment. If moral judgment is essentially practical (guiding action), it must be underwritten by conative states.

  **Where your hypothesis needs correction:** You suggest the two accounts "need not compete." They do compete because they offer rival accounts of **what validity consists in**. When an expressivist says the inference is valid because holding the premises and denying the conclusion involves a "clash of attitudes," and the critic says it is valid because "truth is preserved," they are not talking past each other; they are offering competing metaphysical accounts of logic itself. The circularity arises because neither side can prove their definition of validity without presupposing their meta-ethical framework.

  ### 2. The Deflationism Wrinkle: Why the Dispute Survives

  You asked whether adopting a deflationary or minimalist notion of truth collapses the disagreement. The short answer is **no**. In fact, this is where the dispute becomes sharpest (often called the "Problem of Creeping Minimalism").

  If the expressivist adopts deflationism, they can say: "Sure, 'Lying is wrong' has a truth condition: it is true iff lying is wrong." This satisfies the critic's demand for a compositional semantic clause.
  *   **The Expressivist Move:** This truth condition is "lightweight." It doesn't imply a moral *fact* exists in the world; it just reflects the logical grammar.
  *   **The Critic's Counter:** If you grant that moral sentences have truth conditions, behave logically, and can be embedded, **what work is left for 'expressivism' to do?** You have achieved semantic respectability only by mimicking realism so closely that the distinction vanishes.

  The dispute survives here because it shifts from "Can you state truth conditions?" to "**What grounds the truth conditions?**"
  *   The Critic insists that for truth conditions to be genuine, there must be *truth-makers* (facts, properties) that explain why the sentence is true.
  *   The Expressivist insists that truth conditions are merely grammatical shadows of our attitudes and require no external truth-makers.

  This is not a verbal dispute. It is a substantive disagreement about **metaphysical commitment**. The critic believes you cannot have the semantic benefit (logic) without the metaphysical cost (moral facts). The expressivist believes you can have the semantic benefit without the metaphysical cost. They agree on the semantics (post-deflation) but disagree on the ontology.

  ### 3. What Counts as Progress?

  Given this diagnosis, a "decisive example" or a "formal result" will not solve the problem. Expressivists (like Mark Schroeder or Allan Gibbard) have produced rigorous formal semantics that handle embedding perfectly. Critics (like Russ Shafer-Landau or David Enoch) grant the formalism but reject the *interpretation* of that formalism as being genuinely non-cognitive.

  Therefore, progress cannot come from proving one side right about the data. Progress must come from **explicitly mapping the theoretical trade-offs.**

  **A. Abandon the Search for a "Knockdown" Argument**
  Both sides should accept that the data underdetermines the theory. The Frege-Geach problem is not a "gotcha" that refutes expressivism, nor is expressivism's ability to mimic realism a "gotcha" that refutes cognitivism. Both frameworks can be made to fit the linguistic data with sufficient engineering.

  **B. Shift to Theoretical Virtues (The Cost-Benefit Analysis)**
  Progress lies in framing the debate as a choice between competing theoretical vices rather than a search for the one true semantics.
  *   **Expressivism** buys **Psychological Plausibility** (explaining why moral judgment motivates) at the cost of **Semantic Complexity** (requiring elaborate machinery to explain logic).
  *   **Realism** buys **Semantic Simplicity** (logic works naturally) at the cost of **Metaphysical/Psychological Queasiness** (explaining what moral facts are and how they motivate).

  A productive discussion stops asking "Which theory is true?" and starts asking "Which cost are we willing to pay?"

  **C. The "Direction of Fit" Distinction**
  A specific distinction that would aid progress is clarifying the **Direction of Fit**.
  *   If the critic can show that *any* account of logical validity necessarily requires a Mind-to-World direction of fit (representation), then expressivism (World-to-Mind) is in trouble.
  *   If the expressivist can show that *any* account of moral motivation necessarily requires a World-to-Mind direction of fit, then realism is in trouble.
  Progress would be a rigorous argument showing that one of these directions of fit is non-negotiable for the phenomena in question. Currently, both sides assume their direction of fit is the non-negotiable one.

  ### 4. Conclusion: Is Stalemate Inevitable?

  There is a strong argument that **no further semantic progress should be expected.**

  If the disagreement is ultimately about **explanatory priority** (Logic vs. Agency), then it is a **framework-relative dispute**.
  *   If you start with the intuition that "Logic is fundamental," you will find Expressivism wanting.
  *   If you start with the intuition that "Action is fundamental," you will find Realism wanting.

  Since neither intuition can be proven without presupposing the framework it supports, the dispute is **architectural**.

  **The Verdict on Your Hypothesis:**
  You are right that the sides are often answering different questions (Function vs. Content). But you are wrong that they "need not compete." They compete because both claim their answer is the *foundation* for the other. The expressivist says "Logic is built on attitudes." The critic says "Attitudes are identified by their logical content."

  **Recommendation for Progress:**
  Stop trying to solve the Frege-Geach problem. It has been "solved" technically by both sides. Instead, argue about **Theoretical Cost**. Ask your friend: "Are you willing to posit objective moral facts to save the simplicity of semantics?" Ask yourself: "Are you willing to complicate the semantics of logic to save the psychology of motivation?"

  If you can agree that the dispute is about **which theoretical cost is more tolerable**, rather than **which theory fits the data**, the circularity will break. You will realize you aren't disagreeing about the language; you are disagreeing about what kind of universe you think you live in.
