  ### Logical Space: The Epistemic Questions
  To navigate from common knowledge (CK) of rationality to a solution concept, participants must resolve five binary distinctions:
  1.  **Rationality Definition:** Does "rational" mean maximizing expected utility (EU) given beliefs, or merely avoiding strictly dominated strategies?
  2.  **Epistemic Object:** Is there CK of the *choices* (equilibrium) or only CK of the *reasoning* (robustness)?
  3.  **Prior Structure:** Must beliefs derive from a Common Prior (CP), or are subjective priors admissible?
  4.  **Correlation:** May players condition actions on correlated private signals external to payoffs?
  5.  **Stability:** Must the solution be robust to infinitesimal trembles (refinement) or only static best-responses?

  ### The Epistemic Decision Tree
  *Start: Common Knowledge of Rationality*

  1.  **Does rationality require EU maximization?**
      *   **No** (Only No Dominated Strategy) → **Iterated Elimination of Strictly Dominated Strategies (IESDS)**
      *   **Yes** → Go to 2.

  2.  **Is the solution self-enforcing (CK of Choices) or robust across hierarchies (CK of Reasoning only)?**
      *   **Robust (Reasoning Only)** → Go to 3.
      *   **Self-Enforcing (Choices)** → Go to 4.

  3.  **Is a Common Prior assumed?**
      *   **Yes** → *Incoherent in 2-player games (Collapses to Nash).*
      *   **No** → Go to 5.

  4.  **May players condition on correlated private signals?**
      *   **Yes** → **Correlated Equilibrium**
      *   **No** → Go to 6.

  5.  **May beliefs correlate opponents' strategies?**
      *   **Yes** → **Correlated Rationalizability**
      *   **No** → **Rationalizability**

  6.  **Must beliefs assign positive probability to all strategies (Trembles)?**
      *   **Yes** → **Trembling Hand Perfect Equilibrium**
      *   **No** → **Nash Equilibrium**

  ### Solution Concepts (Leaves)
  *   **IESDS:** Quietly assumes rationality is defined solely by the absence of dominated strategies rather than belief-specific optimization.
  *   **Rationalizability:** Quietly assumes players hold subjective beliefs without a Common Prior, consistent only with CK of rationality.
  *   **Correlated Rationalizability:** Quietly assumes players may believe opponents' actions are correlated, without requiring CK of choices.
  *   **Nash Equilibrium:** Quietly assumes a Common Prior and independent beliefs such that CK of rationality implies CK of choices.
  *   **Correlated Equilibrium:** Quietly assumes a Common Prior allows beliefs to correlate actions, maintained by CK of choices.
  *   **Trembling Hand Perfect Equilibrium:** Quietly assumes players believe opponents may err with infinitesimal probability, refining Nash via stability.

  ### Notes on Combinations
  **Impossible/Incoherent:** The combination of **CK of Rationality + Common Prior + No CK of Choices** (Branch 3, Yes) is defended by no one in 2-player games. Aumann and Brandenburger (1995) prove this epistemically collapses into Nash Equilibrium (CK of Choices), making it not a distinct "rationalizability" concept but a hidden equilibrium. It looks incoherent as a standalone robustness concept because the Common Prior forces belief convergence.

  **Unexplored:** **Common Prior without CK of Payoffs** is rarely defended because the Prior typically structures beliefs over the entire type space, including payoffs; separating them risks incoherence in defining "types."

  **Unseparated:** The tree separates all requested leaves by definition. However, **Rationalizability** and **IESDS** are extensionally equivalent in 2-player games, though epistemically distinct (EU vs. Dominance).

  Unseparated: none
