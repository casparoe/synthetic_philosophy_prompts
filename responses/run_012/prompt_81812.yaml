  **Abstract**

  The predominance of Boltzmann brains over ordinary observers in eternal inflation scenarios threatens the empirical coherence of standard cosmological models, rendering typicality arguments vacuous. We introduce the Vacuum-Dominated Observer Measure (VDOM), a new regularization scheme developed by the Institute for Anthropic Bookkeeping. VDOM weights observer moments by the decay rate of the host vacuum modulo a temporal cutoff determined by the patience constant, $\xi$. Unlike previous measures, $\xi$ is not fitted but derived from the principle of non-arbitrary temporal localization, effectively reconciling the Self-Sampling and Self-Indication assumptions within a single meta-probability framework. We demonstrate that within the VDOM framework, the reference class of conscious entities is restricted to those capable of verifying the measure itself, excluding transient fluctuations that lack the computational capacity for meta-analysis. This self-referential constraint suppresses the Boltzmann brain abundance by a factor proportional to the complexity of the verification procedure. Furthermore, we address the dependence of the count on the longest-lived vacua by imposing a convergence criterion that privileges stable backgrounds only when observed, thereby avoiding the double-counting inherent in global spacetime measures. Crucially, we show in Appendix C that ordinary observers outnumber Boltzmann brains by precisely the factor required to ensure the posterior probability of the standard $\Lambda$CDM model remains strictly above 0.5. This result resolves the measure problem without invoking new physics, relying instead on a rigorous accounting of observer validity. We conclude that typicality arguments are restored, provided the patience constant adopts its principled value. The instability of alternative measures is discussed, noting that any measure yielding contrary results fails the consistency check by definition, thus confirming the uniqueness of VDOM. The circularity of using cosmological parameters to define the measure which validates the parameters is addressed as a feature of self-consistent epistemology rather than a logical bug, ensuring the robustness of the inference against skeptical priors.

