  # DECISION TREE: WHAT DO YOU THINK HAPPENS IN A SCIENTIFIC REVOLUTION?

  **Start here:** You agree that "revolutions" happen (e.g., Phlogiston $\to$ Oxygen, Newton $\to$ Einstein).

  **1. TOOL OR PICTURE?**
  When you use a scientific theory, are you primarily trying to build a **tool** to predict instrument readings, or a **picture** of what the world is *really* like?
  *   **Tool** $\rightarrow$ **LEAF A: Quietist / Instrumentalist**
      *(Theories aren't true/false, just useful/useless. Incommensurability is a non-issue.)*
  *   **Picture** $\rightarrow$ Go to **2**.

  **2. NEUTRAL OBSERVATION?**
  Could a scientist from each era (e.g., Newton and Einstein) look at the same dial and write the **exact same sentence** describing it, which both would accept as true?
  *   **Yes** $\rightarrow$ Go to **3**.
  *   **No** (Observation is theory-laden) $\rightarrow$ Go to **5**.

  **3. SHARED REFERENCE? (Given Neutral Obs)**
  If they agree on the sentence, does the word (e.g., 'time' or 'mass') pick out the **same physical quantity** in the world?
  *   **No** $\rightarrow$ **LEAF B: Davidsonian Deflationism**
      *(If we share observations but not reference, we aren't in different "schemes"—one is just wrong. The idea of a conceptual scheme is incoherent.)*
  *   **Yes** $\rightarrow$ Go to **4**.

  **4. SHARED STANDARDS? (Given Neutral Obs + Ref)**
  Do they agree on what makes a theory "good" (e.g., is simplicity a virtue regardless of the theory)?
  *   **Yes** $\rightarrow$ **LEAF C: Lakatos / Standard Rationalism**
      *(Progress is objective. We can measure which program is progressing or degenerating.)*
  *   **No** $\rightarrow$ **LEAF D: Realist Disagreement**
      *(We see the same world and talk about the same stuff, but disagree on values. Not truly incommensurable.)*

  **5. SHARED STANDARDS? (Given No Neutral Obs)**
  Even if they describe observations differently, do they share standards (accuracy, scope, fruitfulness) to judge which theory is better?
  *   **Yes** $\rightarrow$ **LEAF E: Moderate Kuhn**
      *(Comparison is possible, but never neutral. Standards are shared but weighted differently.)*
  *   **No** $\rightarrow$ Go to **6**.

  **6. REFERENCE STABLE? (Given No Neutral Obs + No Standards)**
  When a term changes (e.g., 'mass'), does it still refer to the **same stuff** in the world, even if the meaning shifts?
  *   **Yes** $\rightarrow$ **LEAF F: Semantic Holism w/ Reference (Putnam-ish)**
      *(Meanings shift holistically, but reference survives via causal chains. Incommensurability is limited.)*
  *   **No** $\rightarrow$ Go to **7**.

  **7. WORLD CHANGE LITERAL?**
  When Kuhn says they live in "different worlds," is the **physical ontology** literally different, or is this just a metaphor for changed meanings?
  *   **Metaphor** $\rightarrow$ Go to **8**.
  *   **Literal** $\rightarrow$ Go to **9**.

  **8. TRANSLATION POSSIBLE? (Given Metaphorical World Change)**
  Can you translate their claims into your terms **sentence-by-sentence** without loss?
  *   **Yes** $\rightarrow$ **LEAF G: Semantic Holism (Meaning Shift)**
      *(Meanings are theory-bound, but translation recovers them. Incommensurability is weak.)*
  *   **No** $\rightarrow$ **LEAF H: Later Kuhn (Bilingualism)**
      *(No translation manual. You must learn the new language like a second native tongue.)*

  **9. RATIONAL CHOICE? (Given Literal World Change)**
  Is the choice between these worlds governed by **rational rules**, or something like a conversion experience?
  *   **Yes** $\rightarrow$ **LEAF I: Ethical Analogy (Berlin/Williams)**
      *(Values/Worlds are incommensurable, but choice is still rational, like tragic moral choices.)*
  *   **No** $\rightarrow$ **LEAF J: Feyerabend / Radical Incommensurability**
      *(No common measure. Theory choice is non-rational, sociological, or anarchistic.)*

  ***

  ### TA NOTES & LOGICAL FLAGS

  **1. Indistinguishable Leaves:**
  *   **Leaf E (Moderate Kuhn)** and **Leaf F (Semantic Holism w/ Reference)** are difficult to separate in practice. Both deny neutral observation but allow comparison. The tree separates them by *Standards* (Kuhn says shared; Putnam often allows standards to shift with meaning). In a short essay, students often conflate these.
  *   **Leaf B (Davidson)** and **Leaf A (Instrumentalist)** often converge in practice. If schemes are incoherent (Davidson) or theories are just tools (Instrumentalism), the "truth" of the paradigm shift dissolves in similar ways.

  **2. Incoherent/Unattractive Paths:**
  *   **Node 2 (Yes) + Node 3 (No):** This path leads to Davidson (Leaf B). Logically, if you grant neutral observation but deny shared reference, you undermine the possibility of disagreement. Davidson argues this combination collapses into one side simply being *mistaken*, rendering the "incommensurability" label void.
  *   **Node 5 (No) + Node 6 (Yes):** This path leads to Leaf F. Some argue this is unstable: if standards are entirely internal (Node 5=No), it is hard to maintain that reference remains fixed (Node 6=Yes) without some neutral anchor. This is the "No Miracle Argument" tension.

  **3. The "Ethical Analogy" (Leaf I):**
  *   For this leaf to hold, the student must believe that rationality does not require an algorithm. Just as one can rationally choose between conflicting moral values (liberty vs. equality) without a neutral metric, one can rationally choose between paradigms. This requires rejecting the premise that "rationality = rule-following."

  **4. Node Count:** 9 Nodes. **Leaf Count:** 10 Leaves (including Realist Disagreement).
  *   *Adjustment for Handout:* If you need fewer leaves, merge Leaf D (Realist Disagreement) into Leaf C (Lakatos), as both imply objective comparability.
