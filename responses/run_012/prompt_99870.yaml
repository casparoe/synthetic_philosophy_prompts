answer: |-
  This is one of the sharpest methodological questions in economic modeling, and you have correctly identified a tension that often goes unnamed in practice but is heavily debated in the philosophy of economics.

  There is no single, universally standardized noun phrase for this specific type of assumption, but the closest established term in the philosophy of science is a **"load-bearing idealization"** (sometimes called a **"constitutive idealization"**).

  Here is the carving you are looking for: how to distinguish this from standard abstraction, when it is legitimate, and how to evaluate the policy leap.

  ### 1. The Terminology: Load-Bearing vs. Negligibility

  To name the practice, you must distinguish it from the standard defense of false assumptions.

  *   **Negligibility Assumptions (The "Harmless" Kind):** This is the standard Friedmanesque move. You assume friction is zero to model gravity. If you add a little friction back in, the apple still falls. The assumption is *scaffolding*; the result is *robust*.
  *   **Load-Bearing Idealizations (Your Case):** Here, the assumption is not scaffolding; it is the engine. If you remove perfect foresight, the boom-and-bust cycle vanishes. The assumption is **constitutive** of the phenomenon.

  In the literature (e.g., works by Uskali Mäki, Nancy Cartwright, or Michael Weisberg), this is often discussed as the difference between **Galilean** and **Non-Galilean** idealization.
  *   **Galilean:** You distort the world to isolate a causal force that *actually exists* (e.g., gravity). The force persists when you de-idealize.
  *   **Non-Galilean (or Distortive):** You introduce a distortion that *creates* the causal force within the model. The "force" (the cycle) is an artifact of the distortion (perfect foresight).

  When a paper relies on the latter but treats it like the former, critics often refer to it as a **"Friedmanesque F-Twist"** (a pejorative reference to Friedman's claim that unrealistic assumptions are a virtue) or simply an **"artifact-generating assumption."**

  ### 2. Is it a Vice or a Virtue? (The Legitimacy Test)

  Whether this move is legitimate depends entirely on the **epistemic claim** the authors are making. There are three distinct modes of modeling here, and the sin occurs when authors slide between them without signaling.

  #### A. The Existence Proof (Legitimate)
  *   **Claim:** "We show that boom-and-bust cycles *can* emerge from rational behavior under specific conditions."
  *   **Status:** Valid. This is a mathematical possibility theorem. It establishes that the phenomenon is not impossible.
  *   **Policy Export:** Weak. You cannot recommend a quota to prevent a bust unless you have evidence that the real world satisfies the "specific conditions" (perfect foresight).

  #### B. The Minimal Model Explanation (Legitimate, but Rare)
  *   **Claim:** "We show that *only* these few features (including foresight) are required to generate cycles." (See Batterman & Rice, 2014).
  *   **Status:** Valid if the phenomenon is **universal**. In physics, you can model a fluid without modeling every molecule. If fishery cycles belong to a "universality class" where the details of information don't matter, only the feedback structure, the assumption is load-bearing but still explanatory.
  *   **Policy Export:** Plausible, *if* the universality holds. But in social systems, universality is rarely established.

  #### C. The Empirical Explanation (The Vice)
  *   **Claim:** "This model explains *why* we see cycles in the real world, and therefore we should impose quotas."
  *   **Status:** Invalid. If the mechanism (perfect foresight) is known to be false, and the result vanishes without it, the model has not explained the real-world phenomenon. It has explained a phenomenon in a fictional world.
  *   **Policy Export:** Dangerous. You are prescribing a cure for a disease the patient doesn't have.

  ### 3. Why the Policy Recommendation Persists

  You asked why the paper recommends a quota in the setting where the assumption is most plainly wrong. There are two charitable interpretations and one cynical one.

  1.  **The Precautionary Bound:** The authors may be treating perfect foresight as a **worst-case scenario**. If agents *did* know prices, the bust would be worst. Therefore, a quota designed to survive perfect foresight will certainly survive imperfect foresight. (This is a robust control argument).
  2.  **The "Grain of Truth" Defense:** They may argue that while perfect foresight is false, *some* forward-looking behavior exists. The model captures the *direction* of the pressure, even if the magnitude is wrong.
  3.  **The "Tractability Trap" (Cynical):** The stochastic/uncertainty version of the model is unsolvable or yields no closed-form solution. The deterministic version yields a clean result. The policy recommendation is a "zombie conclusion" that survives the death of the mechanism because the authors need a paper conclusion.

  ### 4. Principled Ways to Test Exportability

  You asked for a principled way to tell when a result depending on such an assumption may be exported. You cannot rely on the model's internal logic, because you have already proven that logic is fragile. You must look outside the model.

  **1. Mechanism Mapping (Not just Prediction)**
  Do not ask: "Does the model predict the bust?"
  Ask: "Is there *any* mechanism in the real world that mimics the load-bearing assumption?"
  *   *Example:* Fishermen don't know next season's price. But do they have *herding behavior*? Do they follow a leader who acts *as if* they know? If real-world heuristics create a *functional equivalent* to perfect foresight, the result might export even if the assumption is false.

  **2. Robustness Analysis (The "De-idealization" Test)**
  You have already done this (the result evaporates). In methodology, this is a **failed robustness check**.
  *   *Principle:* If a result is not robust to the relaxation of a known false assumption, the result should be framed as a **conditional possibility**, not an **unconditional recommendation**.

  **3. Empirical Calibration of the "False" Parameter**
  Treat the assumption as a parameter (e.g., "degree of foresight" $\lambda$ where $0 \le \lambda \le 1$).
  *   If the bust only occurs when $\lambda = 1$, and empirical data suggests $\lambda = 0.3$, the model implies **no bust**.
  *   If the paper recommends a quota to prevent a bust, they are implicitly arguing that $\lambda$ is closer to 1 than the data suggests. They must justify that calibration.

  ### Summary

  The word you are looking for is **load-bearing idealization**.

  It differs from standard abstraction because standard abstraction assumes the removed detail is **negligible** (the result survives), whereas a load-bearing idealization assumes the removed detail is **generative** (the result depends on it).

  It is a **vice** if presented as an empirical explanation of real-world dynamics.
  It is a **virtue** if presented as an existence proof ("this is possible") or a precautionary bound ("plan for the worst").

  The policy recommendation is only principled if the authors can demonstrate that the real world contains a **functional equivalent** to the false assumption (e.g., herding, subsidies that mimic foresight, or regulatory lag), or if they explicitly frame the quota as a safeguard against the *possibility* of the bust, rather than a correction of an *actual* bust. If they claim the bust is happening *because* of foresight, they are committing a category error.
