answer: |-
  This is the right instinct. Your friend is statistically correct: you cannot satisfy Calibration, False Positive Rate Parity, and False Negative Rate Parity simultaneously when base rates differ. This is the **Impossibility Theorem of Fairness**.

  However, he is wrong that this means you should throw up your hands. It means you cannot outsource the decision to the vendor. You have to move the "politics" from the back room (where the vendor hides it in the loss function) to the front room (where you document it as policy).

  Below is the **Algorithmic Impact Assessment (AIA) Workflow**. It is designed to be run by a competent analyst who knows SQL and basic regression but hasn't read the philosophy papers. It forces the value judgments into the open.

  ---

  # The County Agency Algorithmic Vetting Procedure (CAAVP)

  **Purpose:** To determine if a vendor scoring tool is fit for deployment in a consequential government setting.
  **Rule #1:** If the vendor says "the model is fair," the answer is automatically "No." Fairness is a constraint you impose, not a property they possess.
  **Rule #2:** If base rates differ between groups, you must choose which error type to equalize. You cannot have both.

  ## Phase 1: The "What Is This For?" Test
  *Before looking at a single number.*

  **Q1: What is the specific decision this score triggers?**
  *   *Good Answer:* "Scores > 0.7 trigger a mandatory home visit." / "Scores > 0.5 are shown to a judge for detention consideration."
  *   *Bad Answer:* "It helps inform decision making." (Vague enough to hide liability).
  *   *Dead End:* If the decision cannot be clearly defined, **STOP**. Do not proceed.

  **Q2: What are the two types of mistakes this model can make?**
  *   *Type A (False Positive):* The model says "High Risk," but nothing bad happens. (Cost: Wasted resources, liberty infringement, stigma).
  *   *Type B (False Negative):* The model says "Low Risk," but something bad happens. (Cost: Harm to resident, public safety risk).
  *   *Action:* Write down which mistake is worse. This is not a math question. This is a policy question. **Director must sign off on this ranking.**

  **Q3: What are the protected groups we are testing?**
  *   *Requirement:* Race, Ethnicity, Gender, Age, Disability (as data allows).
  *   *Note:* If the vendor says "we don't collect race data so we can't test," **STOP**. You must require them to match against county census data or prohibit deployment. You cannot claim fairness without measuring disparity.

  ## Phase 2: The Base Rate Reality Check
  *Validating your friend's point.*

  **Q4: Do the outcome rates differ across groups in the historical data?**
  *   *Action:* Calculate the % of people in Group A vs. Group B who actually had the outcome (e.g., rearrest, substantiated abuse).
  *   *Math:* If Rate(A) ≠ Rate(B), the Impossibility Theorem applies.
  *   *Decision Point:*
      *   If **Calibration** is chosen (a score of 0.8 means 80% risk for everyone): Error rates *will* differ.
      *   If **Error Rate Parity** is chosen (everyone gets detained at the same false positive rate): Calibration *will* differ (a score of 0.8 means different risks for different groups).
  *   *Requirement:* You must pick one. See Phase 3.

  ## Phase 3: The Metric Selection (The Value Choice)
  *This is where you stop doing math and start doing policy.*

  **Q5: Based on Q2 (Which mistake is worse?), select the Primary Fairness Metric.**
  *   **Scenario A: Liberty/Safety is paramount (e.g., Pretrial).**
      *   *Focus:* False Positive Rate (FPR). We cannot jail people unnecessarily.
      *   *Requirement:* FPR must be within 10% across groups.
      *   *Trade-off:* You accept that the *meaning* of the score (Calibration) might vary slightly by group.
  *   **Scenario B: Resource Allocation/Efficiency (e.g., Code Inspections).**
      *   *Focus:* Positive Predictive Value (PPV). When we send an inspector, we want to find a violation.
      *   *Requirement:* PPV must be within 10% across groups.
      *   *Trade-off:* You accept that you might miss violations (FNR) at different rates in different neighborhoods.
  *   **Scenario C: Safety/Capture All Risks (e.g., Child Welfare).**
      *   *Focus:* False Negative Rate (FNR). We cannot miss a child in danger.
      *   *Requirement:* FNR must be within 10% across groups.
      *   *Trade-off:* You accept higher False Positives (more investigations) in groups with lower base rates to ensure you catch the risks.

  **Q6: Does the vendor's model meet the chosen metric?**
  *   *Demand:* A confusion matrix broken down by group at the proposed decision threshold.
  *   *Pass:* Metric is within tolerance.
  *   *Fail:* Metric exceeds tolerance. **Proceed to Phase 4.**

  ## Phase 4: The Mitigation or Kill Switch
  *What to do when the math fails the policy.*

  **Option A: Adjust the Thresholds.**
  *   Can we use different cutoffs for different groups to equalize the error rate?
  *   *Legal Warning:* Consult counsel. Explicit group-based thresholds are legally risky (Equal Protection).
  *   *Alternative:* Use the score only as a "risk flag" requiring human review, not an automatic decision.

  **Option B: Reject the Tool.**
  *   If the disparity is too high and cannot be mitigated without violating law or policy, **DO NOT DEPLOY.**

  ## Phase 5: Documentation (The "Reporter Proof" File)
  *When the lawsuit comes, this is your shield.*

  You must archive a memo containing:
  1.  The definition of the "Worse Mistake" (signed by Director).
  2.  The Base Rate data by group.
  3.  The selected Metric (and the explicit rejection of the other metrics).
  4.  The Vendor's performance on that metric.
  5.  **The "Known Harm" Statement:** A plain English paragraph stating: *"By choosing to optimize for [Metric X], we accept that [Group Y] will experience [Z consequence] at a higher rate. We accept this because [Policy Reason]."*

  ---

  # Running the Procedure: Live Cases

  Here is the procedure applied to your two current tools. I have applied the constraints strictly.

  ## Case 1: Pretrial Risk Score (Jail Population)
  *   **Decision:** Detain vs. Release pending trial.
  *   **Q2 (Mistakes):**
      *   False Positive: Detaining someone who would not have reoffended. (Cost: Loss of liberty, job loss, family disruption).
      *   False Negative: Releasing someone who reoffends. (Cost: Public safety).
      *   *Policy Choice:* In a presumption-of-innocence system, **False Positives are the worse mistake.** We prioritize liberty.
  *   **Q3 (Groups):** Race/Ethnicity.
  *   **Q4 (Base Rates):** Rearrest rates differ by race in your historical data (due to policing patterns, socioeconomic factors, etc.). *Impossibility Theorem Active.*
  *   **Q5 (Metric):** Since False Positives are the worse mistake, we must optimize for **False Positive Rate (FPR) Parity**. We cannot accept a system where Group A is falsely jailed at 20% and Group B at 5%.
  *   **Q6 (Vendor Performance):**
      *   Vendor optimized for AUC/Calibration (standard industry practice).
      *   *Result:* The model is well-calibrated (a 70% score means 70% risk for everyone). However, because base rates differ, the **False Positive Rate for Black defendants is 2.5x higher than for White defendants** at the standard detention threshold.
  *   **Phase 4 (Mitigation):**
      *   To equalize FPR, you would need to set a higher detention threshold for Black defendants (making it harder to detain them) or lower for White defendants.
      *   *Legal Constraint:* Your counsel advises that explicit race-based thresholds expose the county to massive liability.
      *   *Operational Constraint:* Using a single threshold violates your own "Liberty First" policy choice from Q2.
  *   **VERDICT: DO NOT DEPLOY FOR AUTOMATIC DECISIONS.**
      *   *Recommendation to Director:* The tool cannot be used to recommend detention. It can only be used as a "defendant advisory" (shown to the defense) or must be strictly advisory to the judge with a mandatory disclaimer that FPR disparity exists.
      *   *Why this makes the Director unhappy:* It neuters the tool's efficiency. The vendor promised reduced jail populations; this procedure shows using it as promised will violate your fairness policy. You are effectively telling the Director the $500k tool is mostly useless for its intended purpose.

  ## Case 2: Child Welfare Ranking (Family Follow-up)
  *   **Decision:** Prioritize which families get a social worker visit.
  *   **Q2 (Mistakes):**
      *   False Positive: Unnecessary visit. (Cost: Family stress, resource waste).
      *   False Negative: No visit, child harmed. (Cost: Injury/Death).
      *   *Policy Choice:* **False Negatives are the worse mistake.** Child safety trumps family privacy in this mandate.
  *   **Q3 (Groups):** Race, Zipcode (as proxy for income).
  *   **Q4 (Base Rates):** Substantiated abuse reports differ by zipcode/race. *Impossibility Theorem Active.*
  *   **Q5 (Metric):** Since Missing Risk (False Negative) is the worse mistake, we must optimize for **False Negative Rate (FNR) Parity**. We must ensure we are not missing endangered children in Group A at a higher rate than Group B.
  *   **Q6 (Vendor Performance):**
      *   Vendor optimized for "Recall at Top K%" (essentially FNR).
      *   *Result:* The model captures 90% of high-risk cases overall. Broken down: It captures 92% of high-risk cases in Group A and 89% in Group B.
      *   *Disparity:* 3% difference.
      *   *Tolerance:* Your procedure allows 10%.
  *   **VERDICT: APPROVE WITH MONITORING.**
      *   *Recommendation to Director:* Deploy. However, you must implement Phase 5 documentation.
      *   *The "Known Harm" Statement:* *"By optimizing to ensure we miss endangered children at equal rates across groups, we accept that families in lower-risk demographics will be investigated at higher rates relative to their actual risk profile. We accept this intrusion to ensure child safety equity."*
      *   *Why this works:* It passes, but you have explicitly documented that you are choosing to over-investigate some groups to protect children in others. If a reporter asks why a middle-class family was harassed by CPS, you have the policy justification ready.

  ---

  # Limitations: Where Reasonable People Will Still Fight

  You asked for the points where this procedure cannot save you. These are the places where two competent analysts running this exact workflow will come to different conclusions. You need to own these.

  **1. The "Worse Mistake" Weighting (Phase 1, Q2)**
  *   *The Conflict:* In the Pretrial case, I assumed Liberty > Safety. Your Director might argue Safety > Liberty.
  *   *The Reality:* There is no math to solve this. If the Director says "One murder is worth 100 wrongful detentions," and you say "One wrongful detention is worth 10 murders," the model output changes completely.
  *   *Your Shield:* This is why Q2 requires a *signature*. You are documenting that *they* made the value choice, you just enforced the math that follows it.

  **2. The Tolerance Threshold (Phase 3, Q5)**
  *   *The Conflict:* I suggested a 10% disparity tolerance. Why not 5%? Why not 20%?
  *   *The Reality:* 10% is arbitrary. It's the "80% rule" from EEOC employment law, borrowed loosely. A civil rights advocate will say 10% is too high. A law-and-order advocate will say 10% is too low.
  *   *Your Shield:* Document the precedent. "We adopted the EEOC 80% standard as a baseline for administrative feasibility."

  **3. The Proxy Problem (Phase 1, Q3)**
  *   *The Conflict:* You test for Race. But what if the bias is in "Prior Arrests" which is a feature in the model?
  *   *The Reality:* You can test for disparity *by* race, but you can't always test for bias *in* the features without deep causal modeling you don't have time for.
  *   *Your Shield:* Be honest. "We test for disparate impact on outcomes, not causal bias in features."

  **4. The Feedback Loop**
  *   *The Conflict:* If you deploy the Child Welfare tool and it sends more workers to Zipcode A, they will find more reports, which trains the next model to send even more workers to Zipcode A.
  *   *The Reality:* This procedure vetts the model *today*. It does not stop the model from rotting *tomorrow*.
  *   *Your Shield:* Mandate a **6-month re-audit**. The approval expires. If they don't bring you new data in 6 months, the tool turns off.

  # Summary for your Director

  "Director, my statistical advisor was right: we cannot have a tool that is perfectly accurate, perfectly calibrated, and perfectly fair across groups simultaneously. We have to pick which one to sacrifice.

  This procedure forces us to pick *before* we sign the contract.

  For **Child Welfare**, the procedure says we deploy, because we prioritize catching every risk (False Negatives) over bothering low-risk families.

  For **Pretrial**, the procedure says we **cannot deploy as intended**. The vendor optimized for accuracy, but to do that they sacrificed equal error rates. If we use their cutoff, we jail significantly more innocent people from Group A than Group B. To fix that without breaking the law requires human review, which reduces the efficiency gains you were promised.

  I recommend we sign the 'Known Harm' statement for Child Welfare and pause the Pretrial deployment until we can negotiate a custom loss function with the vendor or limit its use to advisory only."
