prompt: |-
  Okay so I just spent like two hours arguing with my buddy who does stats for a living and now I actually have to do my job, so let me lay this out. I run the data/analytics side of a mid-size county agency — we're the ones who vet and then babysit any algorithm a vendor sells us for making consequential calls about residents. Right now that's a pretrial risk score for the jail population and a model that ranks families for child-welfare follow-up visits, and there's a third one coming to prioritize which rental units get code inspections. My friend's whole thing during the arguement was that I'm "asking for something that doesn't exist" — he kept saying you cannot have a score that's well-calibrated and also gives you equal error rates across groups whenever the groups have different base rates, and that the moment you pick what to optimize you're doing politics, not math. Fine, I basically believe him. But I still have to sign off on these things, and "it's impossible, good luck" is not a deliverable I can hand my director.

  So what I want from you is a decision procedure my team can actually run, start to finish, when a new scoring tool lands on my desk: the questions to ask in order, what counts as a good-enough answer at each step, what we should demand from the vendor in writing, where the procedure dead-ends in a flat no, and — this is the part my friend says I'm in denial about — the exact points where the procedure has to stop and hand the call to a human because it's a value choice and not a fact we can compute. I want it usable by an analyst who's heard the word "fairness" but never read the literature, so keep the machinery light, but don't dumb it down to the point where we pretend the tradeoffs away. Concretely, I need it to tell me how to even pick which fairness property we're committing to for a given deployment (and to be honest that different deployments might warrant different picks), how to check whether the vendor's numbers actually demonstrate that property rather than just something that sounds like it, what to do when the group base rates differ and the vendor's "we're calibrated" claim turns out to be technically true but useless for the decision in front of us, and how to document the choice so that when someone sues us or a reporter calls, we can show we didn't just pick whichever metric made the tool look good.

  Then run it on the two live ones — the pretrial score and the child-welfare ranking — and I'd like at least one of those runs to come out in a way that makes my director unhappy, because if the procedure only ever blesses what we were already going to do anyway, it's not a procedure, it's a rubber stamp. And tell me straight what this procedure can't do, i.e. where two reasonable people running it correctly would still land in different places, so I at least know what I'm taking responsibility for.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Data/Analytics Lead at a mid-size county agency.
      *   **Context:** Vetting vendor algorithms for high-stakes decisions (pretrial risk, child welfare, housing code inspections).
      *   **The Conflict:** Just argued with a stats expert friend who claims fairness trade-offs (calibration vs. equal error rates) are mathematically impossible to satisfy simultaneously when base rates differ, and choosing metrics is political, not mathematical. The user accepts this but needs a *practical workflow* to manage the risk and make defensible decisions.
      *   **The Need:** A concrete, step-by-step decision procedure (checklist/workflow) for vetting new tools.
      *   **Requirements:**
          *   Usable by analysts (not fairness PhDs).
          *   Must acknowledge trade-offs (no magic bullets).
          *   Must identify where human value judgments are needed.
          *   Must include documentation for accountability (lawsuits/reporters).
          *   Must apply the procedure to the two live cases (Pretrial, Child Welfare).
          *   **Crucial Constraint:** At least one run must result in a recommendation that makes the director unhappy (i.e., recommend *against* deployment or significant modification), proving it's not a rubber stamp.
          *   Must explicitly state limitations (where reasonable people disagree).

  2.  **Deconstruct the Statistical Reality (The Friend's Point):**
      *   The friend is referencing the "Impossibility Theorem of Fairness" (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017).
      *   *Core Truth:* You cannot have Calibration, Equal False Positive Rates, and Equal False Negative Rates simultaneously if base rates differ across groups.
      *   *Implication:* Choosing a metric *is* a policy choice.
      *   *Task:* Translate this theoretical impossibility into an operational workflow that forces the policy choice into the light rather than hiding it in the code.

  3.  **Drafting the Decision Procedure (The "Algorithm for Algorithms"):**
      *   *Phase 1: Definition & Purpose.* Before looking at numbers, what is the tool *for*? (Resource allocation vs. Risk assessment).
      *   *Phase 2: Data & Base Rates.* Acknowledge the friend's point immediately. Check base rates.
      *   *Phase 3: Metric Selection (The Political/Math Boundary).* This is the core. Force a choice based on the *cost of error*.
          *   If the cost of False Positive (locking someone up unnecessarily) is high -> Prioritize False Positive Rate parity.
          *   If the cost of False Negative (missing a risk) is high -> Prioritize False Negative Rate parity.
          *   If the output is a probability used for resource allocation -> Prioritize Calibration.
      *   *Phase 4: Vendor Verification.* Demand specific tables, not just "AUC."
      *   *Phase 5: The "Stop" Conditions.* When do we say no? (e.g., protected class used as a direct feature, performance too low to be useful, inability to measure disparity).
      *   *Phase 6: Documentation.* The "Paper Trail."

  4.  **Applying the Procedure to the Live Cases:**

      *   **Case 1: Pretrial Risk Score.**
          *   *Context:* Jail vs. Release.
          *   *Stakes:* Liberty (False Positive = Jailing innocent risk) vs. Public Safety (False Negative = New crime).
          *   *Base Rates:* Likely differ by demographic (due to policing patterns, socioeconomic factors).
          *   *Fairness Choice:* In criminal justice, liberty is usually paramount. We should worry about False Positives (detaining people who wouldn't offend).
          *   *Vendor Claim:* "We are calibrated."
          *   *Analysis:* If calibrated but base rates differ, FPR will differ. High-risk groups get detained more often even at same score.
          *   *Verdict:* This needs to be the one that makes the director unhappy. Why? Because most vendors optimize for AUC/Calibration, not FPR parity. If the FPR disparity is high, the procedure should flag it as unacceptable without policy mitigation. Let's make the recommendation: *Do not deploy for detention decisions without manual override thresholds adjusted by group.* (This is operationally painful/unpopular).

      *   **Case 2: Child Welfare Ranking.**
          *   *Context:* Prioritizing visits.
          *   *Stakes:* Child Safety (False Negative = Harm to child) vs. Family Privacy/Resource Burden (False Positive = Unnecessary investigation).
          *   *Fairness Choice:* Safety is usually the mandate. Missing a case is worse than a needless visit.
          *   *Vendor Claim:* "We rank order well."
          *   *Analysis:* Here, Calibration matters less than Ranking (AUC). But we need to ensure we aren't ignoring high-risk families in under-served communities due to data bias (e.g., prior reports driven by surveillance).
          *   *Verdict:* Approve with conditions. Focus on False Negative Rate parity.

      *   **Case 3: Housing Code (Mentioned but not required to run, but good for context).**
          *   *Context:* Inspections.
          *   *Stakes:* Tenant safety vs. Landlord burden.
          *   *Fairness:* Equal Positive Predictive Value (don't waste time inspecting safe units).

  5.  **Refining the "Unhappy Director" Constraint:**
      *   To make the director unhappy, I need to challenge the *utility* or the *legality/reputation risk* of the Pretrial tool.
      *   *Argument:* The vendor claims calibration. But because base rates differ, the False Positive Rate for Group A is 3x Group B. If we use a single cutoff, Group A is disproportionately detained.
      *   *Recommendation:* Either reject the tool or mandate group-specific cutoffs (which is legally contentious but statistically fairer). Let's go with "Reject for automatic decision support; allow only as advisory with mandatory disparity audit." This slows things down.

  6.  **Addressing the "Where Reasonable People Disagree" Section:**
      *   This is crucial for the user's liability protection.
      *   Disagreement points: Weighting errors (Is a missed child abuse case 10x worse or 100x worse?), defining the groups (Race? Zipcode?), and the acceptable threshold of disparity (5% difference? 20%?).

  7.  **Tone and Style:**
      *   Professional, direct, slightly weary but competent.
      *   Acknowledge the friend's correctness without being defeatist.
      *   No jargon without definition.
      *   Actionable checklists.

  8.  **Review against Constraints:**
      *   *Decision procedure?* Yes.
      *   *Questions in order?* Yes.
      *   *Good-enough answers?* Yes.
      *   *Dead-ends?* Yes.
      *   *Human hand-off points?* Yes.
      *   *Run on Pretrial & Child Welfare?* Yes.
      *   *One unhappy outcome?* Yes (Pretrial).
      *   *Limitations section?* Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between *Calibration* (probability means probability) and *Error Rate Parity* (mistakes are distributed evenly) is clear, as this is the crux of the friend's argument.
      *   Make sure the documentation section emphasizes the "Why," not just the "What."

  *(Self-Correction during drafting)*: I initially thought about suggesting group-specific cutoffs for the pretrial tool. However, that's legally risky (equal protection clause issues). Better to recommend *not using it for binding decisions* if the disparity is too high. That protects the agency more and annoys the director who wants automation. I will pivot the recommendation to "Human-in-the-loop mandatory" rather than "Group-specific cutoffs."

  *(Refining the Child Welfare case)*: Make sure this one *passes* but with strict monitoring, so the contrast is clear. The Pretrial one fails the "automatic" test.

  *(Final check on the Friend's Point)*: Ensure I explicitly validate the friend. He's right. The procedure isn't about solving the math; it's about managing the politics of the math.

