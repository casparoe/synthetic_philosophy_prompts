answer: |-
  1. **Does Frege's Platonism structurally entail authoritarianism?**
  This is the philosophical upstream question. If the commitment to objective truth logically requires a hierarchical epistemic authority, the politics aren't an accident; they're a feature. This changes how we teach "Sense and Reference," shifting from neutral semantics to power dynamics. It is upstream of the biographical question because even a saintly Frege would be compromised if the logic demands tyranny. **Tractable?** Yes, via conceptual analysis of *Foundations* in English. **Moves up** if we identify coercive structures in his definition of "law"; **moves down** if Platonism is shown compatible with liberalism.

  2. **Did the antisemitic views predate the logical work?**
  This determines whether the bias infected the system's construction or was a late-life decay. If early, the "smoking gun" gains historical traction; if late, the "irrelevant" camp gains ground. However, this is downstream of #1; if the logic is structurally authoritarian, the timing matters less. **Tractable?** No. Requires German fluency and archive access to verify dates of diary entries versus publications. **Moves up** if new translations reveal early political writing; **moves down** if scholarship confirms late-onset radicalization.

  3. **Is the "tool" separation methodologically valid?**
  Your colleague's argument belongs here, not at the top. It is a defensive maneuver contingent on #1 and #2 being negative. If the work is structurally tainted (#1) or historically infected (#2), treating it as a neutral tool is intellectual dishonesty, not virtue-signaling avoidance. It is downstream of both previous questions. **Tractable?** Yes (pedagogical debate). **Moves up** only if #1 and #2 are definitively settled in the negative; **moves down** if either suggests entanglement.

  **Commitment:** Stop treating biography as separate from metaphysics. If the metaphysics breeds tyranny, the tool is broken. Prioritize #1 because it addresses the philosophy, not just the man. If Platonism implies authoritarianism, the core curriculum must change regardless of Frege's diary. If not, the diary remains a tragic footnote. Your colleague's "tool" defense is only viable if the tool itself isn't designed to crush dissent. Settle the structural link first; everything else follows.
