answer: |-
  **Planning Note**

  *   **Coordination Structure:** A repeated Sender-Receiver game. Senders (fishers) must signal arrival; Receivers (shore helpers) must monitor a specific channel to assist. Coordination occurs only if Sender and Receiver use the same channel.
  *   **Payoffs:** Two pure-strategy Nash equilibria: (Horn, Watch Horn) and (Flag, Watch Flag). (Horn, Watch Horn) yields higher utility (works in fog/night). (Flag, Watch Flag) yields lower utility (fails in fog/night). Mismatch yields negative utility (no help).
  *   **Information:** Perfect local observation within the community. The history of the first signal (broken horn) is public knowledge. Current practices are publicly visible.
  *   **The Bite:** The inferior equilibrium (Flag) is locked in due to path dependence. Switching requires simultaneous deviation by all agents, which is risky without explicit agreement. The case bites on the distinction between *stability* (equilibrium) and *optimality* (efficiency), showing conventions can stabilize on sub-optimal outcomes solely through aligned expectations.

  ***

  **1. The Scenario**

  In a coastal village of thirty families, returning fishing boats must signal shore crews to begin hauling nets. There are two distinct signaling methods: sounding a brass horn or raising a blue flag. The horn is superior; it is audible in fog, rain, and darkness, ensuring nearly perfect coordination. The flag is inferior; it is visible only in daylight and clear weather, leading to frequent delays when conditions worsen. However, coordination is achieved only if the boat uses the method the shore crew is watching. If the boat sounds the horn while the crew watches for the flag, the boat goes unassisted.

  Years ago, the first boat to return after a storm had a broken horn and raised a flag by necessity. The shore crew, seeing the flag, watched for flags thereafter. Subsequent boats, observing the crew's attention, raised flags to ensure assistance, even after repairing their horns. Over time, every boat adopted the flag, and every crew member watched for the flag. The community knows the horn is physically superior, and everyone remembers the broken horn incident as public history. Yet, no one switches to the horn, because doing so alone would result in mismatch and failure.

  No laws mandate the flag, and no one promises to use it. There are no penalties for using the horn other than the natural consequence of being ignored by the shore crew. The regularity persists simply because each fisher expects the crew to watch for flags, and each crew member expects the fishers to raise flags. The village remains stuck in this pattern through seasons of fog where assistance is missed, despite everyone knowing a better method exists and is technically available to all.

  **2. Demonstration of Lewis's Conditions**

  *   **(i) Everyone conforms:** In the scenario, every boat raises a flag and every crew member watches for a flag. This is secured by the description of the current state ("every boat adopted the flag").
  *   **(ii) Everyone expects everyone else to conform:** Fishers expect crews to watch for flags; crews expect fishers to raise flags. This is secured by the repeated history of interaction ("observing the crew's attention").
  *   **(iii) Everyone prefers to conform provided the others do:** Given that the crew watches for flags, a fisher prefers to raise a flag (assistance) rather than sound a horn (no assistance). This is secured by the payoff structure where mismatch yields failure.
  *   **(iv) There is at least one other regularity:** The horn method constitutes an alternative regularity. It would solve the coordination need (matching signal to attention) just as effectively as the flag, though with higher physical efficiency. This is secured by the stipulation that the horn is "technically available to all" and works if matched.
  *   **(v) Common Knowledge:** The conformity, expectations, and preferences are known by all, known to be known, and so on. This is secured by the small community size ("thirty families"), the public nature of the signals, and the shared public history of the broken horn incident.

  **3. The Defining Feature of Convention**

  The single feature that makes this regularity a convention rather than a habit, forced regularity, or socially enforced norm is the **presence of a viable alternative equilibrium known to the agents**. A habit lacks the expectation of others' conformity; a forced regularity lacks an alternative (condition iv); a socially enforced norm relies on external sanctions rather than the intrinsic payoff of coordination. Here, the regularity is sustained solely by the interlocking expectations that one *must* match the other to succeed, despite knowing a better match exists. The "work" is done by the arbitrariness of the choice relative to the coordination problem itself: the specific signal matters less than the matching, yet the specific signal chosen is locked in by expectation.

  **4. A Variant Where Convention Fails**

  Change exactly one feature: **Suppose the brass horns rusted away permanently and cannot be repaired.** In this variant, the flag is the only physically possible signal. Condition **(iv) fails**. There is no longer an alternative regularity that would serve the coordinating need. The regularity becomes a forced necessity rather than a convention, because conformity is compelled by the physical situation, not by expectations of others' behavior in the face of alternatives.

  **5. The Strongest Objection**

  A theorist might object that rational agents would not remain in an inefficient equilibrium; they would either coordinate to switch to the horn or impose sanctions on those who refuse to switch. They might argue that if the flag is truly inferior, the "cost" of missed fog-days acts as a sanction that should drive the community to the horn, or that social pressure would emerge to enforce the efficient rule.

  This objection does not defeat the case but relocates the work. It underestimates the coordination cost of switching equilibria. To move from Flag to Horn, every agent must switch simultaneously; a single deviator fails. Without a focal point or communication channel to synchronize this switch, the risk of mismatch outweighs the potential gain of the horn. Sanctions are unnecessary because the coordination payoff itself polices the equilibrium (mismatch is punishment enough). The objection assumes away the very problem the case illustrates: that decentralized agents cannot easily coordinate a transition between equilibria even when one is superior.

  **6. Closing**

  This case shows that being a convention is distinct from being optimal. A convention is a stable solution to a coordination problem, stabilized by mutual expectation, whereas optimality is a measure of aggregate payoff. The two coincide only if the community has no history locking them into a specific path, or if there exists a salient feature (focal point) that naturally draws everyone to the efficient equilibrium simultaneously. In the absence of such conditions, the world allows for stable, known, and shared regularities that are strictly inferior to available alternatives, sustained merely by the power of expectation.
