prompt: |-
  You are a philosopher of the social sciences with a specialist's grasp of the theory of convention, of coordination games, and of the decentralized processes by which regularities and norms establish themselves. Before you write anything, think the problem through carefully and set down a short planning note: the coordination structure you intend to use, the payoffs, the information available to each person, and the precise point at which your case will bite. Only then produce the deliverable. Do not consult or cite any literature; reason from the definitions supplied below, and do not invent empirical studies.

  Your task: construct a thought experiment to specification.

  The case to build. A small, realistic community — on the order of a few dozen people, engaged in ordinary activity, no abstract masses, no perfect reasoners, no science-fictional devices — faces a repeated coordination problem with at least two equilibria, neither of them forced by the situation. Over time, one regularity comes to be followed by everyone. You must arrange the case so that the regularity that prevails is the less efficient of the two equilibria: the one that is easier to fall into or safer to expect, not the one that would be best for everyone. Nobody ever agreed, promised, or legislated anything; the regularity grew out of ordinary local interactions, with each person forming expectations by watching those around them.

  The specification the case must meet. The prevailing regularity must count as a convention on the account associated with David Lewis. Paraphrasing that account, it must satisfy all of the following: (i) everyone in the relevant group conforms; (ii) everyone expects everyone else to conform; (iii) everyone prefers to conform provided the others do, because the problem is one of coordination; (iv) there is at least one other regularity that would have served the group's coordinating need just as well, so conformity is not compelled by the payoffs; and (v) conditions (i)–(iv) are common knowledge among the members. The case must not smuggle in optimality: nothing in your scenario may make the prevailing regularity the best available one.

  Deliverables, in this order:

  1. The scenario itself, in no more than four paragraphs.
  2. A demonstration that each of (i)–(v) holds, condition by condition, naming the feature of the scenario that secures it.
  3. Identification of the single feature of the case that does the work of making the regularity a convention rather than a mere habit, a forced regularity, or a socially enforced norm — together with an account of why the other candidates fail to explain the phenomenon here.
  4. A second variant in which you change exactly one feature of the case so that the regularity no longer qualifies as a convention. Name the feature, explain the change, and say which condition now fails and why.
  5. The strongest objection available to a theorist who holds that conventions are by their nature efficient equilibria, or that the disposition to follow a convention must be underwritten by sanctions. State the objection fairly, then say whether it defeats the case or merely relocates the work.
  6. A closing paragraph on what the case is for: state plainly what it shows about the relation between being a convention and being optimal, and what would have to be true of the world for the two to coincide.

  Keep the whole answer self-contained: no citations, no reading lists, no appeals to authority, and no claims about what any particular author has written beyond the account paraphrased above.
