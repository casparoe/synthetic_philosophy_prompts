  There's a long-running argument between me and my friend Dana about whether tiny harms can add up, and at this point I've collected enough of her verdicts that I want you to call her next one before she gives it. All of these are forced choices -- she hates them, but she always picks. (1) One person spends six weeks with a broken leg in a cast, versus 400 people each getting a three-day head cold: she picks the broken leg, and not by a little. (2) One person with a three-day head cold versus 400 people each with a three-day head cold: obviously the 400, she says, and she looked at me like I was slow. (3) One person permanently losing the use of their dominant hand versus 50,000 people each with a three-day head cold: the hand, and she got genuinely annoyed at me for asking. (4) One person with a three-day head cold versus five million people each with a three-day head cold: the five million, no hesitation. (5) One person with a month of moderate back pain -- the kind that keeps you from sleeping but doesn't stop you working -- versus a billion people each stubbing a toe once, ten seconds of pain: the back pain. She's also very insistent that "a lot of people are mildly uncomfortable" and "one person's life is wrecked" are different kinds of thing, and that she isn't just being squeemish about large numbers. She says she's a totalist, with a caveat, and refuses to tell me what the caveat is.

  Here's the one she hasn't answered yet. She's about to be asked to choose between (X) one person enduring fifty years of severe, treatment-resistant depression, and (Y) 10^100 people -- more people than there are atoms in the observable universe, she'll be told, so please don't get hung up on whether it's physically possible -- each of whom has one mildly unpleasant dream tonight, a dream they'll have forgotten within an hour of waking. I already know she'll try to wriggle out of it by saying a forgotten bad dream isn't a harm at all, so treat that as a verdict if she says it, and tell me what it commits her to.

  What I actually want isn't the answer, it's the machinery. Which rules fit all five of her earlier verdicts -- I'm fairly sure there's more than one, and I want them stated precisely, along with the tempting rules that her record rules out and why? What does each surviving rule predict about the new case, and which one would you bet is the rule she's really running, and why that one over the others? Then give me the single further case that would do the most to separate the survivors from each other. And if her earlier answers are too vague to pin down where she draws the line -- how mild is "mild," what counts as "wrecked" -- say so, and tell me what to ask her next. She's a PhD student in moral philosophy, so she'll notice if you're fudging, and she's been known to change her mind when someone finds the case that breaks her.
