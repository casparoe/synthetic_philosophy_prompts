answer: |-
  Here is the argument that Lewis's abstraction leaks.

  Lewis's model relies on a binary classification of sanctions: **Fines** are transferable debts, while **Imprisonment** is non-transferable suffering. He argues that because we allow the former but forbid the latter, penal substitution is coherent for money but incoherent for liberty (and thus, for divine justice).

  This is a category error. The distinction isn't between "debt" and "punishment"; it's between "sanctions we culturally permit to be commodified" and "sanctions we don't." If you run his logic through edge cases he ignores, the system throws an exception.

  ### 1. The "Fine as Debt" Abstraction Leak
  Lewis treats a fine as a debt obligation. In software terms, he's treating a `Penalty` object as a subclass of `Invoice`. This is incorrect.

  A debt is owed to a creditor for value received. A fine is a penalty imposed by the state for a violation. When you pay a friend's speeding ticket, you are not paying a debt they incurred to you; you are absorbing a state-imposed punishment. The state does not care about restitution (the money goes to the treasury, not a victim); it cares about the sanction.

  If the purpose of the sanction is **retributive** (the guilty must suffer), paying someone else's fine violates that purpose just as much as sitting in their prison cell. The guilty party escapes the burden. The fact that money is fungible doesn't change the moral structure of the transaction. If Lewis's "Prison Test" (we wouldn't let a friend take your sentence) is the true metric for justice, then the "Fine Test" should yield the same result. The only reason we allow fine substitution is pragmatic convenience, not moral coherence.

  ### 2. The Community Service Edge Case
  Let's stress-test the system with **Community Service**. This is a sanction that is neither a pure financial debt nor incarceration. It is a burden of time and labor imposed on the guilty.

  **Case:** A teenager is sentenced to 50 hours of community service for vandalism. The parent volunteers to do the hours in the child's place.
  **Lewis's Prediction:** Since this involves labor and time (closer to imprisonment than money), it should be non-transferable.
  **Reality:** Courts universally reject this. You cannot serve another's community service.

  Now, compare this to the fine.
  *   **Fine:** Transferable.
  *   **Community Service:** Non-transferable.
  *   **Imprisonment:** Non-transferable.

  Why the divergence? It's not because fines are "debts." It's because money is impersonal, while time and body are personal. But if the *impersonality* of money is the only reason substitution is allowed, then penal substitution is only valid in a system where guilt is impersonal.

  If we accept Lewis's premise that justice requires the *guilty agent* to bear the burden (the "Prison Test"), then community service and fines should be in the same class. They are both burdens imposed to penalize the agent. By allowing fine substitution, we are already admitting that we don't actually care if the *guilty person* suffers, only that the *penalty is paid*.

  If we don't care who suffers the financial loss, why do we care who suffers the loss of liberty? Lewis wants to say: "Money is different." But that's a distinction of currency, not of justice. If the logic of justice is "the guilty must pay," then a third party paying the fine is a bug, not a feature.

  ### 3. The Corporate Vicarious Liability Stress Test
  Consider a corporation paying a regulatory fine on behalf of an employee who broke the law for the company's benefit.

  *   **Scenario:** An employee falsifies safety logs. The state fines the *employee* $10,000. The company reimburses the employee as a "bonus."
  *   **Legal Status:** In many jurisdictions, this is illegal (indemnification of penalties). In others, it's a loophole.
  *   **Lewis's Analysis:** He would likely say the company is just paying a debt.
  *   **The Problem:** If the company pays, the employee has not been punished. The "cost" has been externalized to the shareholders. The guilty agent feels no pain.

  If Lewis argues this is acceptable because "money is a debt," he admits that our legal system often prioritizes **revenue collection** over **retributive justice**. We allow fine substitution because the state wants the cash, not because the moral ledger is balanced.

  But if the state *forbids* the company from reimbursing the employee (which it often does to preserve deterrence), then the fine is treated exactly like imprisonment: it must hit the specific agent. In that instance, Lewis's distinction collapses. The fine is not a debt; it is a targeted strike on the guilty party's resources.

  ### Conclusion: The Inconsistent State
  Lewis's argument creates an inconsistent state in the logic of punishment.

  1.  **If Punishment = Debt:** Then imprisonment should be transferable. If I owe a debt of "5 years," why can't a friend pay it? Lewis says no, because imprisonment is about suffering.
  2.  **If Punishment = Suffering:** Then fines should *not* be transferable. If I owe a "suffering debt" of $5,000, why can a friend pay it? Lewis says yes, because fines are debts.

  He is using two different definitions of "Punishment" to get the result he wants.
  *   When defending fine substitution, he defines punishment as **transactional** (a balance to be settled).
  *   When attacking penal substitution, he defines punishment as **experiential** (a burden to be felt).

  You cannot have both. If justice is transactional, Christ paying the fine works. If justice is experiential, Christ taking the prison time works (if God allows the transfer). But you cannot say "Fines are transactional, Prison is experiential" without admitting that our legal system is morally incoherent, not that penal substitution is impossible.

  The bug isn't in the theology; it's in Lewis's abstraction of justice. He treats the *medium* of punishment (money vs. body) as the defining feature, when the defining feature should be the *purpose* (retribution vs. restitution). If the purpose is retribution, neither transfers. If the purpose is restitution, both transfer. Lewis's split is an ad-hoc patch that fails the unit tests.
