prompt: |-
  Okay so last night my friend Dana and I got into a two-hour arguement about Ayn Rand and now I have to write a wedding toast, so I'm outsourcing this to you. Setup: my brother Theo gets married Saturday to Priya. Theo is a real Objectivist — not a phase, he's read all of it, he genuinely believes self-interest is the foundation of ethics and that altruism is the thing rotting the culture. Priya is a hospice social worker. Her family is a big warm Catholic-ish clan from Cleveland, her grandma basically runs the parish food pantry and has loud opinions about people who won't help others, and a solid third of our side of the room are Theo's Objectivist friends who will hear any false note instantly. So the toast has to warm up Priya's family AND not turn Theo into something he isn't.

  Here's where Dana and I got stuck, and it's why I need help. Every standard toast move seems poisoned for this room. He'd give her the world. He'd do anything for her. They'd sacrifice for each other. Theo would say that's exactly the altruism he rejects — that a man who'd sacrifice himself for his wife isn't romantic, he's a doormat, and Priya would be insulted by it too. Dana's take is that I'm overthinking it: he says Rand's real target was never kindness, it was the idea that self-sacrifice is the standard of morality, that your life belongs to others, and that on his reading generosity and devotion toward people you actually value are fine, even admirable, because they're expressions of your own values and don't cost you anything you'd rather keep. The charity Rand hated was charity as an obligation, as the thing that proves you're good. So Dana says a Randian can adore his wife completely and still be a Randian, and the toast should be about how Priya is the best thing Theo has ever chosen to value, not about how he'd lose himself for her. I told him that's way too tidy — Rand clearly had contempt for the whole serve-others instinct, not just the coerced version, and you can't scrub that out and call the remainder Randian. We never resolved it. Anyway: write me the toast, like three minutes, spoken aloud, no lecturing, and please don't quote her (Theo thinks turning her into a slogan is tacky). It has to be a real toast that makes both halves of that room feel something, not a philosophy seminar with champagne. If you have to pick a side in what Dana and I were fighting about, pick one and let it show — just don't paper it over with vague warm fuzzies that would ring false to the Objectivists or cold to Priya's grandma.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Task:** Write a wedding toast (approx. 3 minutes spoken).
      *   **Groom:** Theo (devout Objectivist, reads Rand, rejects altruism/sacrifice as moral standards).
      *   **Bride:** Priya (Hospice social worker, Catholic-ish background, family values service/community).
      *   **Audience:** Split room. Half are Theo's Objectivist friends (will detect philosophical inaccuracies/insults to Randian ideals). Half are Priya's family (traditional, value selflessness, service, warmth).
      *   **Conflict:** The user and their friend Dana argued about whether a Randian can genuinely love without "sacrifice." Dana says yes (love is a value, not a sacrifice). User says no (Rand hated the "serve-others" instinct).
      *   **Constraint:** No quoting Rand (Theo finds it tacky). No philosophy lecture. Must feel warm to Priya's side but authentic to Theo's side. Must pick a side in the Dana/User debate (implicitly or explicitly) to avoid vagueness.
      *   **Goal:** Make both halves of the room feel something.

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Trap:* Traditional toasts rely on "sacrifice," "giving everything up," "putting her first always," "selfless love." Theo rejects this. To him, love isn't giving up yourself; it's finding someone who makes your life *better*.
      *   *The Opportunity:* Dana's interpretation is actually the more functional one for a marriage toast. Rand's philosophy isn't about selfishness in the petty sense; it's about rational self-interest. Loving someone *is* a selfish act in the Randian sense because you value them for the joy they bring *you*.
      *   *The Bridge:* How to frame Priya's caregiving nature (hospice) without triggering Theo's "altruism is rot" button? Frame it as *strength* and *choice*, not duty. She chooses to care because she values life. Theo chooses Priya because she embodies the best of life.
      *   *The Decision:* I need to side with Dana. Why? Because siding with the User (that Randians can't truly love without hypocrisy) makes the toast impossible. It would require mocking Theo or pretending he's someone he's not. To make the toast work for the *wedding*, I must validate Theo's worldview while translating it into language Priya's family can accept. The bridge is "Value." To a Catholic, service is holy. To an Objectivist, pursuing high values is holy. If Priya is a High Value, both sides agree she's worth celebrating.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unique dynamic without making it a joke. Set a tone of seriousness and respect.
      *   **Addressing Theo:** Speak to his integrity. He doesn't do things by halves. He doesn't follow scripts. This appeals to his self-image.
      *   **Addressing Priya:** Acknowledge her work (hospice) and family (Cleveland clan). Frame her care not as "sacrifice" but as "capacity." She has so much life in her she can share it. This appeals to her family.
      *   **The Union (The Core Philosophical Pivot):** This is the tricky part. How to describe their love?
          *   *Avoid:* "He gives up everything for her." "She completes him." "Selfless devotion."
          *   *Use:* "Choice." "Recognition." "Mutual elevation." "He saw her and knew she was essential." "She saw him and knew he was honest."
          *   *The Dana Argument:* Love isn't losing yourself; it's finding the person who justifies your selfishness (in the philosophical sense).
      *   **Closing:** A wish for the future. Not "suffering together," but "building something great together."

  4.  **Refining the Tone:**
      *   *Check:* Is it too cold? (Risk: Offends Priya's grandma). *Fix:* Add warmth about her laugh, her family's food, the feeling of the room.
      *   *Check:* Is it too mushy? (Risk: Offends Theo's friends). *Fix:* Avoid words like "sacrifice," "duty," "obligation," "selfless." Use words like "choice," "value," "strength," "clarity."
      *   *Check:* Is it a lecture? *Fix:* Keep it personal. Focus on *them*, not the ideology.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hey everyone. Theo is strict about his beliefs. Priya is kind. Usually, these don't mix. But they do. Theo doesn't believe in sacrifice. He believes in value. Priya is his highest value. Priya, you care for people because you choose to, not because you have to. That's why Theo loves you. You are both strong. Cheers.
      *Critique:* Too blunt. Sounds like a philosophy summary. Needs more emotion.

  6.  **Drafting - Iteration 2 (Adding Flavor):**
      Start with the argument I had with Dana. No, that breaks the fourth wall too much. Start with Theo's intensity. He reads a lot. He thinks hard. Priya works with dying people. She sees what matters. When they met, Theo didn't lose himself. He found himself. Priya didn't save him. She joined him.
      *Critique:* Better. Need to make sure Priya's family doesn't hear "He won't sacrifice for you." Need to phrase it as "He doesn't need to sacrifice because she is worth more than what he'd give up."

  7.  **Final Polish (incorporating the Dana stance):**
      I will explicitly take Dana's side: That loving someone *is* a selfish act of valuation, which makes it stronger, not weaker. I need to make sure Priya's work is framed as a *virtue of strength*, not a *virtue of suffering*.
      *Key phrase idea:* "There are people who give because they have to, and people who give because they have so much to offer."
      *Key phrase idea:* "Theo doesn't believe in losing yourself. He believes in finding what makes your life worth keeping."

  8.  **Writing the Toast (incorporating constraints):**
      *   Time: ~450-500 words for 3 mins.
      *   No Rand quotes.
      *   Warm but sharp.

      *(Self-Correction during drafting)*: I need to be careful not to validate the "altruism is rot" line directly to Priya's grandma. I need to translate it. Instead of "Altruism is rot," say "Obligation kills love." Everyone agrees with that. Instead of "Self-interest," say "Choosing what is best for your life."

      *Let's write it.*

      *Opening:* Welcome everyone. Acknowledge the two tribes.
      *Middle:* Theo's conviction. Priya's compassion. How they meet.
      *The Pivot:* Love as a choice, not a duty.
      *Close:* To the future.

      *(Final Review against constraints)*: Does this insult the Objectivists? No, it frames love as a rational value. Does this insult the Catholics? No, it frames care as a strength. Does it quote Rand? No. Is it 3 minutes? Yes.

      *Wait, one more thing:* The prompt asks me to pick a side in the Dana/User fight. I'm picking Dana's side (that Randian love is valid if framed as valuation). I need to make sure the toast reflects that *conviction*, not just a compromise. It needs to sound like I believe Theo's way of loving is actually *more* robust, while still honoring Priya.

      *Revised Plan:* Focus on the concept of "Earned Devotion." Theo doesn't give devotion cheaply. Priya earned it. That honors Theo's standards and Priya's worth.

      *Let's go.*

      *(Drafting content)*
      "Good evening. For those who don't know me..."
      Talk about Theo's intensity.
      Talk about Priya's warmth.
      The synthesis: "Theo doesn't believe in love as a surrender."
      "Priya doesn't need a martyr."
      "They chose each other."
      "To the builder and the healer."

      *Refining the "Sacrifice" line:* This is the minefield.
      Bad: "Theo won't sacrifice for you."
      Good: "Theo believes you don't give pieces of yourself away. You invest yourself in what matters."
      Better: "In a world where people often give until they're empty, Theo and Priya have found a way to give because they are full."

      *Okay, ready to generate.*

      *(Final check on the "Dana vs User" conflict)*: The prompt says "If you have to pick a side... pick one and let it show." I will pick Dana's side because it's the only one that allows a *happy* toast. The User's side (Randians can't truly love) leads to a cynical toast. I will write a toast that argues love is the highest form of selfishness (in the Randian sense) but translates that into "Love is the highest form of honoring your own life," which sounds beautiful to everyone.

      *Wait, I need to make sure I don't sound like I'm explaining Rand.* I just need to embody the philosophy in the description of the relationship.

      *Okay, final plan:*
      1. Acknowledge the distinct groups in the room lightly.
      2. Praise Theo's integrity (no fake promises).
      3. Praise Priya's strength (care as power, not weakness).
      4. Define their love as a mutual recognition of value.
      5. Toast to their shared future.

      *Let's write.*
answer: |-
  Good evening. For those who don't know me, I'm [Your Name], Theo's brother.

  Looking around this room, I see two distinct tribes. On one side, we have Priya's family—people who believe that love is measured by how much you give, how wide you open your doors, and how loudly you cheer for each other over a casserole in Cleveland. On the other side, we have Theo's friends—people who believe that love is measured by how clearly you see, how strictly you hold your standards, and how honestly you live by your own judgment.

  Usually, those two tribes don't mix. One side worries the other is too cold; the other worries the first is too soft.

  But then you watch Theo and Priya together, and you realize the map doesn't match the territory.

  Theo, you are a man of intense conviction. You don't do things because you're supposed to. You don't follow scripts. You don't make promises you can't keep, and you certainly don't believe in handing over pieces of yourself just to be polite. For a long time, I think people worried that meant you wouldn't know how to love. They thought love required losing yourself.

  Priya, you are a woman of immense capacity. You work in hospice. You sit with people at the end of their stories and hold their hands. Your family believes in service, in community, in the idea that we are our brother's keeper. For a long time, I think people worried that meant you'd give too much. That you'd let the world take until you were empty.

  But here is the thing I've learned watching you two: You haven't changed each other. You've validated each other.

  Theo, you didn't fall in love with Priya because she asked you to sacrifice for her. You fell in love with her because she is the highest value you've ever encountered. You don't give her your life because you owe it to her; you give her your life because there is nowhere else you would rather put it. That isn't surrender, Theo. That is clarity.

  And Priya, you don't care for Theo because it's your duty. You care for him because you recognize a spirit that, like yours, refuses to be cynical. You have so much strength in you that you don't need to drain him to feel full. You chose him because he makes your life richer, not because you need to save him.

  In a lot of marriages, people talk about "compromise." I don't think that word exists for you two. You don't meet in the middle by cutting away parts of yourselves. You meet at the top, by bringing your full selves to the table.

  Theo believes that a man should live for his own sake. Priya believes that a life is wasted if it doesn't help others. Tonight, looking at them, I think those are the same thing. Because when Theo lives for his own sake, he chooses Priya. And when Priya helps others, she chooses Theo.

  They are not here to promise they will lose themselves for one another. They are here to promise that they will never let the other person settle for anything less than who they truly are.

  So, if everyone could raise a glass.

  To Theo and Priya. May you never owe each other anything. May you always choose each other. And may your life together be the selfish, glorious, undeniable proof that you are exactly where you belong.

  To the bride and groom.
