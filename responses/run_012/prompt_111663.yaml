      *   *Burden of Proof:* Ray claims progress. Margit claims degeneration. In funding, the burden is on the proposer (Ray) to show novelty. Ray admitted: "If it's mostly after, I'll vote to kill it too." This implies he *believes* it's mostly before. Margit doubts it.
      *   *My Call:* Vote with Margit (Defund/Restructure), *unless* Ray can produce the logbook evidence of temporal priority. Why? Because 30 years is the "Cold Fusion" timeline. The "Permission Slip" argument is the killer. Lakatos is not a blank check.

  6.  **Drafting the Response:**
