answer: |-
  **The Journal of Verified Volition**
  **Instructions for Authors**

  **Manuscript Submission Guidelines: Temporal Dynamics of Intention**

  The *Journal of Verified Volition* invites submissions concerning the chronometry of conscious agency. Given the historical propensity for overstating causal inferences drawn from correlational electrophysiology, all manuscripts utilizing the standard clock-paradigm must adhere to the following technical specifications. Failure to address the inherent confounds of retrospective time-stamping will result in immediate desk rejection.

  **1. Chronometric Calibration and Attentional Load**
  Authors must specify the angular velocity of the timing apparatus. Standard analog clocks with a 2.5-second revolution period are preferred. However, manuscripts must include a control condition quantifying the attentional cost of monitoring the rotating dot while simultaneously monitoring internal motor urges. If the division of attention exceeds 40% of working memory capacity, authors must adjust reported W-times (awareness of urge) to account for latency introduced by perceptual sampling errors. Parallax errors in subject reporting must be corrected using digital gaze-tracking validation.

  **2. Instructional Phrasing and Motor Planning**
  Subjects must be instructed to allow movements to arise "spontaneously" without pre-planning. Any evidence of strategic counting, rhythmic pacing, or anticipatory muscle tension invalidates the trial. Authors must provide transcript evidence that subjects were not subtly coerced into delaying their reported urge to match the experimenter's theoretical expectations. The distinction between a "urge to move" and a "decision to move" must be operationally defined; conflating the two renders the W-time meaningless.

  **3. Electrophysiological Averaging and Single-Trial Variability**
  It is acknowledged that the Readiness Potential (RP) is a signal averaged across hundreds of trials. Consequently, claims that the RP *preceded* consciousness in any specific instance are prohibited unless supported by single-trial decoding analysis. Authors must acknowledge that the ramping negativity observed in grand averages may not exist in individual trials. If the RP is treated as a deterministic precursor rather than a stochastic fluctuation, the manuscript must be submitted to our *Philosophy* sister-journal.

  **4. Veto Mechanisms and Infinite Regress**
  Manuscripts claiming the existence of a "Free Won't" veto power must provide electrophysiological evidence for the veto itself. Authors must address whether the veto constitutes a secondary conscious decision. If so, does this secondary decision require its own preceding readiness potential? If the veto is unconscious, the claim of conscious control is void. If the veto is conscious, authors must map the RP associated with the vetoing process. Submissions demonstrating an infinite regress of meta-vetoes will be fast-tracked.

  **5. Libet Compliance Statement**
  All submissions must include a signed Libet Compliance Statement appended to the Methods section. This statement must certify the following:
  *   (a) That the reported 200ms lag between W-time and Movement is not treated as a fixed constant of nature.
  *   (b) That the authors acknowledge W-time is likely a retrospective reconstruction based on sensory feedback rather than a real-time readout.
  *   (c) That the headline "Brain Decides Before You Do" does not appear in any press release associated with the paper.
  *   (d) That the authors accept that ruling out conscious causation based on a wrist flick in a laboratory does not constitute a final verdict on moral responsibility in complex ecological environments.

  **6. Data Availability**
  Raw EEG data and subject timing logs must be made available. Specifically, trials where the subject failed to report a W-time must not be discarded as noise; these null reports are essential for determining the baseline threshold of awareness.

  The Editors reserve the right to reject manuscripts that treat the paradigm as a proof of determinism rather than a measurement of specific motor preparation under divided attention. We remind authors that correlation of neural activity prior to reportable awareness does not equate to the exclusion of conscious causation, unless the conscious causation is defined solely by the report itself.
