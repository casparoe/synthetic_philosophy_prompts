      *   *Idea 3: Deterrence.* Armed neutrality presupposes that peace is maintained by the *capacity* for violence, not the *renunciation* of it.
      *   *Idea 4: Gender.* Male-only conscription presupposes either biological essentialism (men fight) or a historical patriarchal bargain (men protect, women are protected). This is a weak point philosophically but strong historically.
