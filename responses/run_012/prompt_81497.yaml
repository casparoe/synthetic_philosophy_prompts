      *   *Gender:* This is the biggest inconsistency. If the duty is civic, why exclude women? This suggests the presupposition is actually about *protection* (men protect) rather than *equality of duty*. This conflicts with modern liberal citizenship.
      *   *Underdetermination:* A Libertarian could hate it (bodily autonomy). A Cosmopolitan could hate it (nationalist focus). A Republican loves it. A Communitarian loves it. The practice fits Republicanism best.

