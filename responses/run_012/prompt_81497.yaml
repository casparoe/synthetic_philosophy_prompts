answer: |-
  This is a superb set of questions. You've identified the precise friction points where political theory meets institutional reality. The Swiss case is fascinating because it refuses the standard binary of "militarist vs. pacifist" or "nationalist vs. cosmopolitan." It occupies a specific, somewhat rare philosophical niche.

  Since you've asked me to avoid the lecture-hall summary and think this through with you, I will follow your instruction: first, a brainstorm of the candidate presuppositions ranked by my confidence in how strictly they are required by the practice, and second, a committed philosophical synthesis of what is actually going on, including where the model breaks down.

  ### Part 1: Brainstorming Candidate Presuppositions
  *Ranked from "Strictly Required" to "Merely Compatible"*

  1.  **High Confidence: The State as the Sole Guarantor of Security (Sovereigntist Presupposition).**
      Armed neutrality strictly presupposes that security cannot be outsourced. If you rely on NATO or the UN for defence, you are not neutral; you are a beneficiary of collective security. Therefore, the political community presupposes that it owes its continued existence to its own capacity for violence. This is a *Realist* ontology of international relations: the international sphere is anarchic, and the state is the only legitimate unit of survival.

  2.  **High Confidence: Citizenship as Bodily Obligation (Republican Presupposition).**
      Conscription strictly presupposes that citizenship is not merely a legal status or an economic contract (paying taxes), but a physical claim the state has on the person. It rejects the Liberal-Libertarian view that the body is inviolable private property. It presupposes a *duty of defence* that precedes individual choice.

  3.  **Medium-High Confidence: Deterrence via Capacity, not Intent.**
      The practice of keeping weapons at home presupposes that deterrence works through *uncertainty* and *diffusion*. It assumes a potential aggressor calculates cost not just against the standing army, but against a fragmented, armed populace. This presupposes that the *threat* of force is legitimate even if the *use* of force is forsworn (neutrality). It separates the *possession* of violence from the *aggression* of violence.

  4.  **Medium Confidence: Conscientious Objection as Equivalent Burden (not Penalty).**
      This is tricky. The longer duration of civilian service *could* presuppose a penalty (pricing conscience), but within the internal logic of the Swiss system, it more likely presupposes an *equivalence of burden*. Military service involves loss of liberty (barracks), physical risk, and hardship. Civilian service is often more comfortable and allows living at home. The extra time presupposes that the *total burden* (time + hardship) must be equalized to maintain fairness among citizens. However, this is underdetermined (see below).

  5.  **Medium-Low Confidence: Gendered Protection (Patriarchal Presupposition).**
      Male-only conscription presupposes either biological essentialism (men are naturally fighters) or a patriarchal bargain (men protect, women are protected). Philosophically, this is the weakest link. It conflicts with the "Citizenship as Obligation" presupposition (#2). If the duty is civic, why is it gendered? This suggests the practice is historically path-dependent rather than philosophically consistent.

  6.  **Low Confidence: The Necessity of Conscription for Neutrality.**
      It is *not* strictly presupposed that neutrality requires conscription. You could theoretically have armed neutrality with a professional army (e.g., 19th-century models). However, conscription *fits well* with neutrality because a professional army might develop corporate interests that drag the state into foreign conflicts, whereas a citizen militia is presumed to be more defensive-minded.

  ***

  ### Part 2: Committing to a View
  **The Philosophical Core: Civic Republicanism with Realist Constraints**

  If I have to commit to a view on what the Swiss model *is*, it is a pragmatic instantiation of **Civic Republicanism** operating within a **Realist** international framework.

  Here is the synthesis:

  **1. On Neutrality and Self-Defence**
  You asked if armed neutrality presupposes that the nation-state is the basic unit of security. **Yes.** It rejects the Cosmopolitan view that security is a global public good provided by international bodies. It also rejects the Pacifist view that disarmament leads to peace.
  Philosophically, this rests on a specific conception of **Freedom as Non-Domination**. To be free (neutral), Switzerland must not be dependent on the goodwill of neighbours or alliances. Dependence is domination. Therefore, the capacity for violence is a prerequisite for political independence. The "right to self-defence" here isn't just a legal right under the UN charter; it is a constitutive feature of statehood. Without it, the state is merely an administrative district waiting for permission to exist.

  **2. On Conscription: Duty vs. Job**
  This is the sharpest philosophical divide. The professional army model (UK, US) presupposes a **Liberal-Contractualist** view: the state needs a service, citizens sell labour, the state pays wages. It commodifies violence.
  The Swiss conscription model presupposes a **Republican** view: the army *is* the people in arms. If you professionalize the military, you create a distinct class (soldiers) separate from the citizenry. This creates two risks:
  *   **Internal:** A standing army can become a tool of domestic coercion.
  *   **External:** A professional class may seek conflict to justify its existence or budget.
  By requisitioning the citizen's body, the state asserts that the community's survival takes precedence over individual bodily autonomy *in extremis*. It treats military service not as labour, but as **liturgy**—a ritual performance of citizenship. The fact that you keep the weapon at home reinforces this: you are not a soldier *for* the state, you are a citizen *with* the capacity to defend the state. The state trusts you with the means of violence because you *are* the state.

  **3. The Conscientious Objection (CO) Puzzle**
  You noted the tension: is the longer civilian service a penalty or an equivalence?
  *   **The Penalty View (Liberal):** If conscience is a right, taxing it (with time) infringes on that right. This view suggests the state is saying, "You can opt out, but it costs you."
  *   **The Equivalence View (Republican):** The duty is not "to kill" but "to serve." If the hardship of military service is $X$ (time + risk + loss of liberty), and civilian service is $Y$ (time + no risk), then Time must increase to make $Y = X$.

  **My Commitment:** The Swiss practice is internally committed to the **Equivalence View**, but it risks looking like the Penalty View.
  Why? Because if the underlying duty were simply "defence," there would be no alternative. The existence of the alternative proves the duty is **Service to the Community**. The state is saying: "We all owe the community a portion of our life. Most pay it in risk and discipline (military). If your conscience forbids risk/discipline, you must pay it in pure time."
  *However*, this is where the underdetermination you suspected comes in. A strict Libertarian could argue *any* mandatory service is illegitimate. A strict Pacifist could argue that facilitating a war machine (even via civilian service) is complicity. The Swiss model sits in the middle: it acknowledges the right of conscience but denies the right to *opt out of obligation*. It presupposes that **conscience exempts you from the *method*, not the *duty*.**

  ***

  ### Part 3: Internal Inconsistencies and Rival Views

  You asked me to identify where the practice looks internally inconsistent and what would change if we swapped the presuppositions.

  **1. The Gender Inconsistency**
  This is the model's greatest philosophical failure.
  *   **The Presupposition:** Citizenship entails equal obligation.
  *   **The Practice:** Only men are conscripted.
  *   **The Contradiction:** If the duty is based on *citizenship*, it must apply to all citizens. If it applies only to men, the duty is not based on citizenship, but on **gendered protection**. This reverts to a pre-modern view where men are "defenders" and women are "protected."
  *   **The Fix:** If we swapped this for a consistent Republican view, conscription would be gender-neutral (as it is in Norway). If we swapped it for a Liberal view, conscription would be abolished for everyone (bodily autonomy). The current hybrid (universal male duty) is philosophically unstable. It treats men as means to an end (state security) and women as ends in themselves (protected persons).

  **2. The "Pricing Conscience" Tension**
  If the longer civilian service is truly just "equivalence of burden," why is the threshold for entry so high? You mentioned you have to make a case that it is conscience, not convenience.
  *   **The Inconsistency:** If the state truly respects freedom of conscience as a right, the burden of proof should be low. By making it high, the state presupposes that **conscientious objection is a privilege to be managed, not a right to be respected.**
  *   **The Rival View:** If we adopted a strict Liberal view of rights, civilian service would be equal length (or shorter, given the lack of risk), and the declaration would be sufficient without deep scrutiny. The current system presupposes the state has an interest in minimizing defectors, suggesting the "right" is secondary to the "need for manpower."

  **3. Counterfactual: What if Service were a Job?**
  If we swapped the Republican view for a Labour Market view (Professional Army):
  *   **Neutrality:** Would likely remain, but the *culture* of neutrality would weaken. A professional army is a tool of the executive; a militia is a tool of the populace. Referendums on the army might vanish because the "citizen-soldier" link is broken.
  *   **Weapons at Home:** Would disappear immediately. You cannot issue state property to non-employees. This would signal a shift from "Trust in the Citizen" to "Trust in the Institution."
  *   **CO:** Would become irrelevant. You can't be a conscientious objector to a job you didn't apply for.

  **4. Counterfactual: What if the State has No Claim on the Person?**
  If we adopted a strict Libertarian/Consent theory:
  *   **Conscription:** Abolished.
  *   **Neutrality:** Would have to rely on diplomacy or international law alone (like Costa Rica), because armed neutrality requires a manpower base you cannot coerce.
  *   **Result:** Switzerland would cease to be "Armed Neutral" and become "Unarmed Neutral." The philosophical presupposition here is that **security is a public good that cannot be coercively funded with bodies.**

  ### Final Verdict

  The Swiss system presupposes that **freedom is expensive, and the bill must be paid in person, not just in cash.**

  It is a **Civic Republican** system trying to survive in a **Liberal** world.
  *   It is Republican because it demands sacrifice for the *res publica* (public thing).
  *   It is Liberal because it allows conscientious objection and democratic referendums to dismantle the very system that protects it.

  The internal inconsistency lies in the **Gendered Nature** of the duty (violating equal citizenship) and the **Gatekeeping of Conscience** (violating the sanctity of individual moral agency).

  If you are arguing with your flatmate, the strongest philosophical defence of the Swiss model is not that it is "efficient" or "safe," but that it maintains a specific relationship between the citizen and the state: one where the citizen is a co-owner of the state's violence, rather than a customer of its security. The strongest critique is that this co-ownership is distributed unequally (by gender) and that the "exit option" (civilian service) is rigged to discourage use, betraying the very liberty the system claims to protect.

  Does that align with what you observed in Zurich? I suspect the "trust" aspect (weapons at home) felt very different from the "coercion" aspect (conscription notices). That tension is the philosophy in action.
