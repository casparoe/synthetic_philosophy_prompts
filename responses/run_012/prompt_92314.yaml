answer: |-
  A sociologist interviews a secular tech founder who works 100 hours a week and reinvests every profit despite having no heirs.

  "Why the asceticism?" the sociologist asks. "You don't believe in salvation."

  "My grandfather did," the founder replies. "He worked to confirm a verdict that was already settled. I work to settle a verdict that doesn't exist."

  "So the ethic survived the religion?"

  "No. The religion was the only thing that made the anxiety rational. Now the anxiety runs the show, but the warden resigned."
