      *   *Implicit Assumption:* "Completing an infinite number of tasks" is logically equivalent to "traversing a finite distance divisible into infinite parts."

  3.  **Drafting the Correspondence Table:**
      *   Need to map the math to the physics.
      *   *Terms ($1/2^n$):* The successive distances Achilles must cover to reach where the Tortoise *was*.
      *   *Partial Sums ($S_n$):* Achilles' position after $n$ steps.
      *   *Limit ($1$):* The point where Achilles catches the Tortoise.
