answer: |-
  You have identified a genuine and persistent problem in moral philosophy, legal theory, and policy discourse, but there is no single canonical noun for the *rhetorical maneuver* you are describing.

  The closest existing technical concepts are **"Causal Selection"** (in philosophy of action/law) and **"Proximate Cause"** (in tort law), combined with **"Motivated Reasoning"** (in psychology). However, these describe the *components* of the move, not the specific bias of shifting the cut-off point to secure a verdict.

  Since you are an Econ PhD, the most precise analogy for what you are seeing is an **Endogenous Stopping Rule**.

  In statistics, a stopping rule is valid only if it is exogenous (fixed prior to observing the data). If you decide when to stop collecting data *based on the results you are seeing* (e.g., "I'll stop running the regression when the p-value hits 0.05"), you have biased the inference. In the rooms you are sitting in, the "stopping point" of the causal chain is endogenous to the desired verdict.

  If you need a philosophical label to coin for this specific phenomenon, I suggest **"Motivated Causal Truncation."**

  Here are the boundaries and edges you asked for, distinguishing this move from legitimate responsibility theories (like compatibilism).

  ### 1. The Existing Literature (The Nearest Neighbors)

  *   **Causal Selection (Hart & Honoré):** In *Causation in the Law*, they argue we never trace the full causal chain (which goes back to the Big Bang). We select *the* cause from *conditions* based on normative interests. Your observation is that this selection is often disguised as descriptive fact when it is actually policy.
  *   **Proximate Cause:** The law explicitly admits this cut-off is arbitrary and policy-driven. A defendant is liable only for "proximate" harms, not remote ones. The "remoteness" is often determined by whether we *want* them to pay.
  *   **The Regress Argument (Galen Strawson):** Strawson argues that to be truly responsible for an action, you must be responsible for the character that produced it, which requires a prior choice, ad infinitum. Since you can't be *causa sui*, responsibility is impossible. The people in your rooms are trying to avoid this conclusion by arbitrarily halting the regress.
  *   **Responsibility Tracing (Fischer & Ravizza):** This is the attempt to link current responsibility to past choices (e.g., "he chose to get drunk, so he's responsible for the crash"). Your critique is that the *depth* of the trace is adjusted to fit the blame.

  ### 2. The Coinage: Motivated Causal Truncation

  **Definition:** The practice of halting the causal regression of agency at a point determined by the desired normative outcome, rather than by a consistent principle of agency or causation.

  **The Edges (How to distinguish it from legitimate theory):**

  To determine if someone is committing *Motivated Causal Truncation* or applying a **Principled Stopping Rule**, you can test for three boundaries:

  #### A. The Consistency Edge (Exogeneity)
  *   **Principled:** The stopping rule holds regardless of the verdict. If the rule is "responsibility stops where coercion exceeds 50%," it must apply whether we want to blame the actor or the state.
  *   **Truncation:** The threshold for "enough freedom" shifts. In Case A (we want to blame), "18 years of disadvantage" is background noise; the choice at T=1 is the cause. In Case B (we want to exonerate), "18 years of disadvantage" is the determining cause; the choice at T=1 is epiphenomenal.
  *   **Test:** Ask them to apply their stopping rule to a case where it yields the *opposite* verdict of their preference. If they move the line, it's truncation.

  #### B. The Descriptive Edge (Empirical Identifiability)
  *   **Principled:** The stopping point corresponds to an empirically identifiable shift in the mechanism of action (e.g., a breakdown in reasons-responsiveness, a specific neurological threshold, a legal age).
  *   **Truncation:** The stopping point is described in normative language masquerading as descriptive ("That's where he was *really* himself"). As you noted, "most himself" is a conclusion, not a criterion.
  *   **Test:** Can the stopping point be identified without knowing the verdict? If the description of the "agency point" changes depending on whether the outcome was good or bad, it's truncation.

  #### C. The Compatibilist Edge (Structural vs. Temporal)
  This addresses your specific question about the compatibilist.

  *   **The Compatibilist Claim:** A reasons-responsiveness compatibilist (like Fischer) claims they are **refusing** the truncation move. They argue responsibility isn't about how far back you trace (temporal), but about the *structure of the current mechanism* (structural). If the mechanism issuing the action is "moderately reasons-responsive," the chain stops there naturally. It doesn't matter if the mechanism was caused by bad schools; what matters is if the mechanism *now* can hear reasons.
  *   **The Critique (Your Position):** The skeptic argues that defining the "mechanism" is itself subject to **Motivated Causal Truncation**.
      *   *Example:* Is the mechanism "His decision to drop out" (responsibility assigned)? Or is the mechanism "His internalized belief of stupidity formed at age 10" (responsibility mitigated)?
      *   Both are descriptions of the causal architecture. Choosing which one counts as "the agent" is often driven by the verdict.
  *   **The Boundary:** The compatibilist is *not* doing the same thing **if** they maintain a fixed, empirically grounded definition of "reasons-responsiveness" that applies uniformly. They **are** doing the same thing if the definition of "reasons-responsive" expands or contracts to accommodate the desired social outcome (e.g., "He couldn't respond to reasons" means "We don't want to punish him" vs. "He could respond to reasons" means "We need him to be liable").

  ### 3. How to Use This in Your Context

  In an Econ policy room, you can frame this as an **Identification Problem**.

  *   **The Problem:** We are trying to identify the causal effect of "Agency" on "Outcome."
  *   **The Bias:** The model specification (how many lags of disadvantage we include) is endogenous to the dependent variable (the moral verdict).
  *   **The Terminology:** When you see them do it, you can say: *"You are using an endogenous stopping rule. You're truncating the causal chain at T=1 when you want to assign blame, and at T=0 when you want to assign structural fault. We need an exogenous identification strategy for agency."*

  This translates the philosophical frustration into a methodological critique, which is usually the language of the room. It forces them to defend the *consistency* of their cut-off point, rather than the *plausibility* of the specific cut-off they just chose.

  ### Summary
  *   **Name:** **Motivated Causal Truncation** (or **Endogenous Stopping Rule**).
  *   **Compatibilist Status:** They claim to refuse it (by switching from temporal tracing to structural analysis), but often succumb to it (by defining the structure malleably).
  *   **The Test:** Consistency across cases where the desired verdict is flipped. If the "point of freedom" moves, it's not a point of freedom; it's a point of policy.
