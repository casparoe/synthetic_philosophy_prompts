  2.  **Deconstruct the Core Idea:**
      *   *The Itch:* "Equal Opportunity" is ambiguous in inheritance debates.
      *   *The Distinction:* Transfer (static, point-in-time, quantifiable) vs. Dynastic Capacity (dynamic, structural, qualitative/quantitative hybrid, intergenerational).
      *   *The Problem:* Policy instruments (estate taxes) target Transfer. Moral intuitions (fairness, meritocracy) target Dynasty.
      *   *The Risk:* They might be co-extensive (no real distinction) or the distinction might be practically irrelevant.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic but catchy. *Transfers vs. Dynasties: A Conceptual Decoupling in Equality of Opportunity.*
      *   **Research Question:** Needs to be narrow. Not "Is inheritance tax good?" but "Does the distinction hold water and does it matter for justification?"
          *   *Draft:* Is there a difference between transfer and dynasty?
          *   *Refinement:* Can the normative goals of equality of opportunity be satisfied by regulating transfers alone, or is a distinct conceptual category of 'dynastic capacity' required to diagnose structural unfairness?
          *   *Final Polish:* "Under what conditions does the regulation of intergenerational *transfers* fail to mitigate *dynastic capacity*, and does this decoupling undermine standard luck-egalitarian justifications for inheritance taxation?"

      *   **Literature Gap:**
          *   Standard views: Liberty/Property rights (Nozickian) vs. Equality of Opportunity (Luck Egalitarian/Rawlsian).
          *   The Gap: They treat wealth as a static stock. They assume taxing the stock reduces the power. They don't model the *conversion* of wealth into influence over time. Economics looks at revenue/efficiency, not the *structure* of power.
          *   Why it's not settled: Empirical work looks at Gini coefficients (outcomes), not the *mechanism* of capacity. Theoretical work assumes a direct link between wealth transfer and opportunity hoarding.

      *   **Methodology (Theoretical/Conceptual):**
          *   Since I'm a theorist, I can't run regressions. I need a thought experiment or a model.
          *   *Idea:* Construct a "Conceptual Model" of two societies.
          *   *Society A:* High transfer tax, low dynastic capacity leakage (loopholes, human capital investment).
          *   *Society B:* Low transfer tax, high dynastic capacity leakage (social norms, non-monetary transmission).
          *   *Task:* Analyze the normative implications. If EO is satisfied in A but not B (or vice versa), the distinction matters.
          *   *Specific Tool:* An "Impossibility Claim" or "Decoupling Thesis." Show that certain policy instruments *cannot* target dynasty even if they target transfer perfectly.

      *   **Expected Results:**
          *   Best case: A taxonomy of "Dynastic Mechanisms" that are tax-invisible.
          *   Middle case: Showing that standard luck-egalitarian arguments rely on a false premise (that transfer = capacity).
          *   Failure condition: If it turns out "Dynastic Capacity" is just "Discounted Present Value of Transfers," then the distinction is empty.

      *   **Scope:**
