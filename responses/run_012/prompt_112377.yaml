prompt: |-
  I'm a second-year PhD student in political theory and my prospectus is due at the end of term, and I've got a half-formed idea I can't get to sit still, so I'd like you to help me turn it into an actual research proposal (a couple of pages is fine — this is just the internal version my advisor reads before I write the long one). The itch started when I was arguing with a flatmate about inheritance taxes and realized we were both saying "equal opportunity" and meaning completely different things. The more I read around the topic — the standard moves about whether the testator's liberty covers posthumous transfers, whether a recipient can be said to deserve an unearned windfall, whether the whole thing is better defended as a remedy for unequal starting points than as a revenue tool — the more it looks to me like the debate keeps fusing two things under one heading. Call the first one *transfer*: a stock of resources moving from one pair of hands to another at a moment in time, which is what the tax code and most of the economics is about. Call the second *dynastic capacity*: the durable, standing power of a family or lineage to keep converting wealth into institutional influence, access, and the shaping of the next generation's option set, across many generations, whether or not any single transfer looks large. My suspicion is that almost everything people actually care about when they invoke equal opportunity is the second thing, while almost all of the machinery is aimed at the first, and that the two can come apart — picture a jurisdiction with ferocious estate taxes but weak gift reporting and high returns to capital, or the reverse — so that you can win on transfers and lose on dynasty, or vice versa. I honestly don't know yet if this is a real distinction or a distinction without a difference, and that's part of what I need the proposal to help me find out.

  What I want from you: a precise statement of the question, genuinly narrow so that it has a determinate answer (I'd rather it be small and answerable than grand and mushy); an honest account of why the existing positions in the literature don't already settle it; and a concrete method — what would I actually *do* for a semester, given that I'm a theorist and not about to run regressions? I want to know what a genuine result would even look like here (is it a conceptual claim, a taxonomy, a little impossibility result about policy instruments that can't hit both targets at once?), and what would count as the project failing or turning out to be empty. Be honest about scope, too: is this a term paper, a dissertation chapter, or is it secretly a whole dissertation that I'm kidding myself fits in one semester? And say something about whether a purely conceptual project like this can make progress that an empirical one can't, because my advisor is skeptical of the whole approach. Don't worry about citations or a reading list — I'll fill those in myself, just refer to positions and arguments as you need them.
