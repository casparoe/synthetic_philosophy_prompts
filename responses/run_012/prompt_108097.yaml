answer: |-
  It sounds like you are stuck in one of the most classic and stubborn impasses in contemporary normative ethics, and the frustration you feel is entirely warranted because on the surface it looks like you should be able to resolve it, but you are actually talking past one another on different theoretical levels. The first thing to recognize is that this is almost certainly not a definitional disagreement, since you mentioned you all agree on the cases and who counts as a liar versus a misleader, nor is it a straightforward empirical disagreement about consequences, since you agree the false belief is installed in both scenarios. Instead, this is a theoretical disagreement about the grounding of moral wrongness, specifically concerning which feature of the interaction carries the normative weight. Person A is operating with a view that locates the wrong primarily in the outcome or the state of the victim, meaning the integrity of the proposition asserted is morally inert compared to the resulting deception. Person B is locating the wrong in the mechanics of agency and autonomy, arguing that the method of deception matters because it changes how the victim's rationality is engaged or bypassed. Person C is introducing a third grounding based on normative expectations and social entitlements, which is distinct because it focuses on the rules of the communicative game rather than the outcome or the autonomy mechanics alone. Because you all agree that both actions are generally wrong, the dispute has become about whether the distinction is morally significant or merely taxonomic, and that is why you are stuck; you are arguing about the architecture of the theory rather than the verdicts on the ground.

  To move this forward, you need to stop arguing about whether there is a difference in the standard cases and start looking for a wedge case where your theories generate different verdicts. If Person A is right that the truth of the sentence does no moral work, then there should be no case where misleading is permissible while lying is not, or where lying is significantly worse than misleading. If Person B is right about autonomy, then there should be cases where misleading is less wrongful because it preserves some shred of the victim's agency, perhaps in situations where the victim is suspicious or where the stakes involve protecting someone from a truth they cannot handle. You might try constructing a scenario where the hearer is actively distrustful; if I lie to a suspicious person, I am trying to override their skepticism with a false assertion, but if I merely mislead them, I am relying on their own suspicious nature to lead them astray, which might test Person B's claim about bypassing reasoning. Alternatively, you could look at white lies or paternalistic deception, where the outcome is beneficial; Person A might have to concede the act is permissible because the outcome is good, whereas Person B might still object to the lying because of the autonomy violation, creating a divergence that forces you to choose sides.

  Another productive avenue would be to shift the discussion from the wrongness done to the listener to the corruption of the speaker or the institution of communication. Person B's intuition about not treating a person as a machine often links to the idea that lying violates a constitutive norm of assertion, meaning that when you assert, you implicitly guarantee truth, whereas when you imply, you do not offer that same guarantee. If you frame the debate around what obligations we take on when we speak, rather than what happens to the listener, you might find that Person C's view on entitlements aligns with a view that we are only entitled to rely on what is explicitly asserted in certain contexts. The reason you remain stuck is likely because you are all trying to prove the other wrong on the same battlefield of standard deception cases, where the moral pressure is so high that all theories converge on the verdict that it is wrong. You need to lower the stakes or change the variables to find a scenario where the moral pressure diverges, because if no such case exists, then Person A is practically right even if theoretically distinct, but if such a case does exist, then Persons B and C have the leverage they need to show the distinction matters. Ultimately, this is a real moral disagreement about the source of obligation, not a semantic one, and it will only resolve if you stop testing the definitions and start stress-testing the principles against edge cases where honesty and autonomy pull in opposite directions.
