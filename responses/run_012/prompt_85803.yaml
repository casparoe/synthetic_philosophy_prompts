answer: |-
  **Final Exam Question: Formal Epistemology and Decision Theory**

  **Question 3 (20 Marks)**
  Consider two variants of the Two-Envelope Problem. In the **Capped Ladder**, the host chooses an integer $n$ uniformly from $\{1, \dots, 20\}$, places $2^n$ and $2^{n+1}$ dollars in envelopes, and gives you one at random. In the **Endless Ladder**, the host draws $n$ from a geometric distribution with parameter $p$ ($P(n=k) = p(1-p)^k$ for $k \ge 0$), places $2^n$ and $2^{n+1}$ dollars in envelopes, and gives you one at random. You observe the amount $X$ in your envelope and may swap once.

  You may take as given that in the Capped version, the posterior probability you hold the smaller envelope is $1/2$ for all $X$ except the range endpoints. In the Endless version, this posterior is constant for all $X$ except the minimum possible amount.

  1.  Determine the optimal swapping rule for the **Capped Ladder**. Explain precisely where and why this rule falls short of "always swap."
  2.  Determine the optimal swapping rule for the **Endless Ladder** as a function of $p$. Identify the critical value $p^*$ where the rule changes.
  3.  Calculate the expected value $E[X]$ in the Endless version. Show that $E[X]$ is finite if and only if $p > p^*$. Explain what this coincidence implies for the diagnosis that the paradox arises solely from an improper prior.
  4.  Discuss what these results imply about the Principle of Indifference as used in the standard paradox argument and whether "always swap" can be a coherent decision rule.

  ***

  **Model Answer**

  **1. The Capped Ladder**
  In the Capped version, the prior on $n$ is uniform. If you observe $X = 2^k$, Bayes' theorem yields a posterior probability of $1/2$ that you hold the smaller amount, provided $1 < k \le 20$. The expected value of swapping is $E[\text{swap}|X] = \frac{1}{2}(2X) + \frac{1}{2}(X/2) = 1.25X$. Thus, swapping is advantageous for all interior values. However, the distribution is bounded. If you observe the maximum possible amount ($2^{21}$), you know you hold the larger envelope; the posterior probability of holding the smaller amount is 0. Conversely, if you observe the minimum ($2^1$), you know you hold the smaller. The optimal rule is: **Swap if $X < 2^{21}$; keep if $X = 2^{21}$.** The rule falls short of "always swap" because the boundary condition breaks the symmetry required for the $1/2$ posterior. At the cap, the potential gain from swapping vanishes while the loss remains, neutralizing the expected benefit.

  **2. The Endless Ladder**
  In the Endless version, let $\pi$ be the posterior probability you hold the smaller envelope given $X=2^k$ (for $k \ge 1$). Using the geometric prior $P(n=k) \propto (1-p)^k$, the ratio of probabilities for adjacent states is constant. Specifically, $\pi = \frac{P(n=k)}{P(n=k) + P(n=k-1)} = \frac{1-p}{2-p}$. The expected value of swapping is $E[\text{swap}|X] = \pi(2X) + (1-\pi)(X/2) = X(\frac{3}{2}\pi + \frac{1}{2})$. Swapping is advantageous if $\frac{3}{2}\pi + \frac{1}{2} > 1$, which simplifies to $\pi > 1/3$. Substituting $\pi$, we require $\frac{1-p}{2-p} > \frac{1}{3} \Rightarrow 3 - 3p > 2 - p \Rightarrow 2p < 1 \Rightarrow p < 1/2$.
  The optimal rule is: **If $p < 1/2$, always swap (for $X > 2^0$). If $p > 1/2$, never swap. If $p = 1/2$, indifferent.** The critical value is $p^* = 1/2$.

  **3. Expectation and the Proper Prior**
  The expected amount in your envelope is $E[X] = \sum_{k=0}^\infty P(X=2^k)2^k$. Since $P(X=2^k)$ involves terms proportional to $(1-p)^k$, the sum behaves like a geometric series with ratio $2(1-p)$. This series converges if and only if $2(1-p) < 1$, which implies $p > 1/2$. Thus, $E[X]$ is finite exactly when $p > p^*$.
  This coincidence devastates the canned diagnosis that the paradox relies exclusively on an *improper* prior. The geometric distribution is a valid, normalized **proper prior**. Yet, for $p < 1/2$, the paradox persists: you prefer to swap regardless of $X$. The issue is not merely improper normalization but **infinite expectation**. When $E[X]$ diverges, expected utility theory loses its grip; dominance arguments fail because the integrals defining expected gain do not converge absolutely. A proper prior can reproduce the paradox if it allows sufficiently heavy tails to render expectations infinite.

  **4. Indifference and Coherence**
  The standard argument invokes the Principle of Indifference to assert $P(\text{small}|X) = 1/2$ universally. Our analysis shows this equality is not a priori truth but a specific structural condition (approximated here as $p \to 0$). In the Capped case, indifference holds only interiorly; in the Endless case, it holds only if $p$ is specific. Consequently, "always swap" is not a coherent rule in standard decision theory when expectations are finite, as it implies a preference cycle (preferring A to B and B to A). It becomes "coherent" only in the pathological context of infinite expectations, where standard dominance principles break down. The paradox reveals not a logical contradiction in probability, but a limitation of expected value maximization when dealing with unbounded utilities and heavy-tailed distributions.

  ***

  **Marking Scheme (Total 20 Marks)**

  **Part 1: Capped Ladder (5 Marks)**
  *   **2 Marks:** Identifies optimal rule (Swap unless max observed).
  *   **2 Marks:** Explicitly identifies the boundary condition ($X=2^{21}$) where posterior is not $1/2$.
  *   **1 Mark:** Explains that boundary breaks the symmetry/expected gain calculation.
  *   *Deduction:* **-3 Marks** if student claims "always swap" is optimal or ignores the upper bound.

  **Part 2: Endless Ladder (5 Marks)**
  *   **2 Marks:** Correctly derives or utilizes posterior $\pi = \frac{1-p}{2-p}$.
  *   **2 Marks:** Identifies critical threshold $p^* = 1/2$ correctly.
  *   **1 Mark:** States optimal rule conditional on $p$ (Swap if $p < 1/2$).
  *   *Deduction:* **-2 Marks** for arithmetic errors in deriving the threshold.

  **Part 3: Expectation and Priors (5 Marks)**
  *   **2 Marks:** Correctly identifies condition for finite $E[X]$ ($p > 1/2$).
  *   **2 Marks:** Explicitly argues that since Geometric is a **proper prior**, the "improper prior" diagnosis is insufficient.
  *   **1 Mark:** Links infinite expectation to the persistence of the swapping advantage.
  *   *Deduction:* **-5 Marks (Automatic Zero on Part 3)** if student writes "The paradox arises because the prior is improper" and stops without addressing the proper prior case.
  *   *Deduction:* **-2 Marks** if student claims bounding amounts (Capped) is the only solution to the paradox.

  **Part 4: Indifference and Coherence (5 Marks)**
  *   **2 Marks:** Explains Principle of Indifference is a structural assumption, not a universal truth.
  *   **2 Marks:** Argues "always swap" is incoherent under finite expectations (dominance failure).
  *   **1 Mark:** Concludes that infinite expectation is the root cause of the coherence failure.
  *   *Deduction:* **-3 Marks** if student treats Capped and Endless variants as raising the identical problem (ignoring the proper prior distinction).

  **General Penalties**
  *   **-5 Marks:** "Canned Answer" Penalty. If the essay relies primarily on the phrase "improper prior" without engaging with the Endless/Proper Prior derivation as requested.
  *   **-3 Marks:** Conflation. If the student fails to distinguish the mathematical behavior of the Capped vs. Endless variants.
