      *   *The "Diary" Example (§258):* Associating a sign 'S' with a sensation.
      *   *The Crux:* How do I know I'm using 'S' correctly the next time? I can't appeal to a public rule. I can't appeal to memory without circularity ("whatever seems right to me is right").
