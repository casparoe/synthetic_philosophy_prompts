answer: |-
  # Specification: Adequacy Conditions for an Account of Moorean Absurdity

  **Context:** This document specifies the necessary and sufficient conditions for a philosophical account of Moore's Paradox. It is derived from term-long discussion regarding the omissive form ($p \land \neg Bp$), the commissive form ($p \land B\neg p$), and boundary cases involving knowledge, tense, person, and agency.

  ---

  ## I. Core Desiderata (Non-Negotiable)
  *Any account failing these conditions is to be rejected.*

  **1. The Truth-Compatibility Condition**
  *   **Requirement:** The account must explain why the utterance is absurd without implying that the proposition expressed is necessarily false.
  *   **Motivating Datum:** The omissive proposition "It is raining, but I do not believe it is raining" can be true (it may be raining while I am unaware).
  *   **Tag:** Non-negotiable.

  **2. The Logical-Consistency Condition**
  *   **Requirement:** The account must explain the absurdity without relying on a contradiction in the logical form of the sentence.
  *   **Motivating Datum:** The conjunction $p \land \neg Bp$ is logically consistent; there is no formal contradiction between a fact and a subject's lack of belief in that fact.
  *   **Tag:** Non-negotiable.

  **3. The Omissive-Commissive Parity Condition**
  *   **Requirement:** The account must provide a unified explanation for both the omissive form ($p \land \neg Bp$) and the commissive form ($p \land B\neg p$).
  *   **Motivating Datum:** Asserting "It is raining, but I believe it is not" strikes us as similarly absurd to the omissive form, despite the difference in doxastic attitude.
  *   **Tag:** Non-negotiable.

  **4. The Knowledge-Variant Condition**
  *   **Requirement:** The account must explain why the absurdity persists when the belief operator is replaced by a knowledge operator ($p \land \neg Kp$).
  *   **Motivating Datum:** Asserting "It is raining, but I do not know that it is raining" is pragmatically defective in the same way as the belief variant, despite knowledge entailing belief.
  *   **Tag:** Non-negotiable.

  **5. The Person-Tense Asymmetry Condition**
  *   **Requirement:** The account must explain why the absurdity vanishes in the third person and the past tense.
  *   **Motivating Datum:** "It is raining, but he does not believe it" and "It was raining, but I did not believe it" are coherent assertions.
  *   **Tag:** Non-negotiable.

  **6. The Distinction Condition**
  *   **Requirement:** The account must distinguish Moorean absurdity from (a) outright lying, (b) logical contradiction, and (c) reasonable hedging/surprise.
  *   **Motivating Datum:** A liar knows $p$ is false; a Moorean speaker may sincerely assert $p$. A hedger says "I think $p$"; a Moorean speaker asserts $p$ flatly.
  *   **Tag:** Non-negotiable.

  ---

  ## II. Extended Desiderata (Preferences & Edge Cases)
  *These requirements resolve disagreements between specific camps or address boundary conditions.*

  **7. The Locus Specification**
  *   **Requirement:** The account must explicitly locate the absurdity in either the sentence-type (semantics), the utterance act (pragmatics), or the norm governing assertion.
  *   **Motivating Datum:** Disagreement over whether "It is raining but I don't believe it" is semantically defective or merely pragmatically inappropriate.
  *   **Tag:** Preference (Camp-dependent).

  **8. The Norm Identification**
  *   **Requirement:** If the account is normative, it must specify which norm is violated (Truth, Belief, Knowledge, or Justification).
  *   **Motivating Datum:** The Knowledge-Variant Condition (Req. 4) suggests a Knowledge Norm; the Omissive/Commissive parity (Req. 3) suggests a Belief Norm.
  *   **Tag:** Preference (Camp-dependent).

  **9. The Non-Assertoric Extension**
  *   **Requirement:** The account should determine whether the absurdity extends to non-assertoric moods (guessing, supposing, hoping).
  *   **Motivating Datum:** "Suppose it is raining but I don't believe it" seems intelligible, unlike the assertoric form.
  *   **Tag:** Preference.

  **10. The Second-Person Condition**
  *   **Requirement:** The account must address whether the absurdity arises in second-person address ("You believe $p$, but $p$ is false").
  *   **Motivating Datum:** Telling a subject they hold a Moorean belief may be informative, not absurd, suggesting the absurdity is first-person specific.
  *   **Tag:** Preference.

  **11. The Graded/Whether Condition**
  *   **Requirement:** The account must handle graded confidence ("$p$, but I'm not confident") and the whether-form ("$p$, but I don't know whether $p$").
  *   **Motivating Datum:** These variants feel defective but less sharply paradoxical than the binary belief case.
  *   **Tag:** Preference.

  **12. The Agency/Concept Condition**
  *   **Requirement:** The account must specify whether the speaker must possess the concept of belief or be a normative agent for the absurdity to obtain.
  *   **Motivating Datum:** An automated assistant outputting "$p$ and I do not believe $p$" produces the string, but it is unclear if this counts as "absurd" or merely "inconsistent programming."
  *   **Tag:** Preference (High Tension).

  ---

  ## III. Identified Tensions (Incompatible Pairs)

  **Tension A: The Knowledge-Variant vs. The Assertion-Belief Link**
  *   **Conflict:** There is a strong tension between satisfying **Req. 4 (Knowledge-Variant)** and maintaining a strict **Expressivist** interpretation of **Req. 7 (Locus)**.
  *   **Explanation:** If the absurdity arises because asserting $p$ *expresses* belief that $p$ (making $\neg Bp$ a contradiction in the act), it is difficult to explain why $\neg Kp$ generates the same absurdity without conceding that assertion expresses *knowledge*. However, if assertion expresses knowledge, it becomes difficult to explain how one can assert falsehoods (violating **Req. 1**). An account struggles to maintain that assertion expresses belief (to solve Omissive/Commissive parity) while also treating the Knowledge variant as equally fundamental.

  **Tension B: The Agency Condition vs. Normative Accounts**
  *   **Conflict:** There is a tension between **Req. 12 (Agency/Concept)** and any account relying on **Req. 8 (Norm Identification)**.
  *   **Explanation:** If the absurdity is a violation of a norm governing *belief* or *assertion* (which presupposes a normative agent), an AI system lacking beliefs cannot violate the norm. To call the AI's output "absurd" requires a semantic or syntactic account. To call it "merely inconsistent programming" requires a normative account. Satisfying the intuition that the AI case is *different* from the human case while maintaining a unified theory of the string's defectiveness is highly problematic.

  ---

  ## IV. The "Killer" Constraint

  **The Person-Tense Asymmetry Condition (Req. 5)**
  This is the single requirement that eliminates the most candidate accounts.
  *   **Reasoning:** Many accounts successfully explain why $p \land \neg Bp$ is weird (e.g., "It is a contradiction in the mind"). However, they fail to explain why *only* the present-tense, first-person version is weird. Content-based accounts often struggle here: if the proposition is defective, why is it not defective when John asserts it about himself? Purely pragmatic accounts often struggle to explain why the past tense ("I believed $p$ but $p$ was false") is perfectly coherent despite involving the same clash of fact and attitude. An account that cannot carve out this specific first-person, present-tense niche fails to capture the phenomenon.

  ---

  ## V. Brief Theoretical Comparison

  **Expressivist Accounts** (Absurdity lies in the act of asserting):
  *   **Performance:** Strong on **Asymmetry (Req. 5)** and **Logical Consistency (Req. 2)**. They explain why the sentence is fine but the utterance is not.
  *   **Weakness:** Struggle with **Knowledge-Variant (Req. 4)**. If asserting expresses belief, why is disavowing *knowledge* equally absurd? They also face difficulty with **Agency (Req. 12)**, as non-agents cannot perform speech acts, rendering the AI case category-error rather than absurd.

  **Content-Based (Doxastic) Accounts** (Absurdity lies in the proposition or belief state):
  *   **Performance:** Strong on **Omissive-Commissive Parity (Req. 3)**. They treat the clash as occurring within the rationality of the believer's mind.
  *   **Weakness:** Struggle with **Truth-Compatibility (Req. 1)** and **Asymmetry (Req. 5)**. If the content is irrational, why can it be true? And why is it rational for a third party to assert that content about the subject? They often risk collapsing the distinction between Moorean absurdity and genuine contradiction.

  **Recommendation:** Prioritize accounts that treat the absurdity as a pragmatic violation of a constitutive rule of assertion, but verify their handling of the Knowledge-Variant carefully.
