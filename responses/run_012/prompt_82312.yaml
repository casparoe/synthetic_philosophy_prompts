answer: |-
  This is a rigorous translation task. You are asking me to map a legal-moral category (genocide) onto an operational-scientific category (surveillance case definition). The friction points will reveal the limits of epidemiology as a language for describing intentional social destruction.

  Here is the translation, item by item, followed by the hypothesis test and the judgement on your two suspicions.

  ***

  ### 1. The Treaty Definition
  *Five acts, specific intent, four group types, substantial part.*

  *   **What carries over cleanly:** The structure of a **composite case definition**. The five acts function as clinical or laboratory criteria (the "what"). The four group types function as **inclusion criteria for the population at risk**. The "substantial part" requirement functions as an **epidemic threshold** (e.g., incidence exceeding a baseline to declare an outbreak).
  *   **What carries over with distortion:** The "substantiality" criterion. In epidemiology, a threshold (e.g., 2 standard deviations above mean) is arbitrary but mathematically consistent; it measures *volume* of disease. In the legal definition, "substantial" measures *viability* of the group. A small number of killings can be genocide if they target leadership (decapitation), whereas in epidemiology, removing the "leaders" (super-spreaders) reduces the count but doesn't change the case definition. The distortion is treating a qualitative threat to group continuity as a quantitative incidence rate.
  *   **What has no counterpart:** The **fixity of the host**. In epidemiology, the "population at risk" is a variable denominator (e.g., "residents of City X"). In the treaty, the "group" is a protected status. Epidemiology does not have a mechanism to define a population *by its right to exist* rather than by its exposure to a pathogen.
  *   **Residue Report:** This is a **defect of your framework**. Epidemiology is agnostic about *who* gets sick; it measures the spread, not the status of the host. The legal definition requires the status of the host to be the primary variable. Your framework cannot represent the *value* of the denominator, only its *size*.

  ### 2. The Gap (Coinage vs. Codification)
  *Lemkin's broad sociological process vs. the narrow legal list.*

  *   **What carries over cleanly:** The evolution from a **sensitive working definition** to a **specific confirmed case definition**. Lemkin's concept is like a syndromic surveillance system (broad, captures signal early, high false positives). The Treaty is like a PCR-confirmed case (narrow, high specificity, resource-intensive to verify).
  *   **What carries over with distortion:** The *reason* for the narrowing. In epidemiology, we narrow definitions to improve positive predictive value and allocate scarce resources efficiently. In the Treaty, the narrowing was political to ensure ratification and limit liability. The distortion is framing political exclusion as scientific refinement.
  *   **What has no counterpart:** **Excluded Etiologies.** In epidemiology, if we exclude "political groups" from a definition, it is because we cannot measure the exposure. In the Treaty, political groups were excluded despite being measurable, because states refused to be the pathogen. Your vocabulary has no term for "a risk factor we agree not to surveil."
  *   **Residue Report:** This is **evidence that the original claim was doing more work**. Proponents of the narrow legal definition often argue it is "more precise." Your framework reveals this as false precision. It is not a refinement of sensitivity/specificity; it is a deliberate reduction of sensitivity to protect specific vectors (states).

  ### 3. Law/Evidence vs. Naming as Act
  *Objective determination vs. political consequence of the label.*

  *   **What carries over cleanly:** **Reporting Bias and Surveillance Artifacts.** You know that case counts are influenced by the capacity and will of the reporting authority. The claim that "institutions have interests in not saying the word" translates perfectly to **under-ascertainment** due to administrative suppression.
  *   **What carries over with distortion:** The **consequence of the declaration**. In epidemiology, declaring an outbreak triggers a public health response (resources, isolation, treatment). In genocide, declaring the "outbreak" triggers a sovereign response (intervention, sanctions, war). The distortion is treating a trigger for *aid* as equivalent to a trigger for *policing*.
  *   **What has no counterpart:** **Stigma as Sovereignty.** In public health, a disease name carries stigma, but the disease exists regardless of the name. In genocide, the *name* is part of the legal mechanism of punishment. Without the name, the crime (in the international court) does not exist. In epi, the virus does not care if you count it. In law, the perpetrator cares intensely if you count it.
  *   **Residue Report:** This is a **defect of your framework**. Your framework assumes the goal of counting is to *manage* the phenomenon. Here, the goal of counting is to *condemn* it. Your vocabulary treats the reluctance to count as a bias to be corrected; in this context, the reluctance is the primary object of study.

  ### 4. Constitutive vs. Descriptive
  *The category creates the reality.*

  *   **What carries over cleanly:** **Case Definition Determines Epidemic Curve.** You know that changing the definition changes the history of the outbreak. A revision silently rewrites the past. This matches the legal reality that narrowing the definition excludes past victims from the historical record of genocide.
  *   **What carries over with distortion:** **The Unit of Analysis.** In epidemiology, the "case" is an individual. The epidemic is the aggregate. In genocide, the "case" is the *group*. The individual deaths are evidence of the case, not the case itself. The distortion is atomizing a holistic destruction into countable events.
  *   **What has no counterpart:** **Denominator Destruction.** In epidemiology, if the population dies, surveillance stops, but the *category* of the population remains valid for analysis. In genocide, the intent is to destroy the category itself. Your framework assumes the denominator (the population at risk) is stable enough to calculate rates. Genocide is the process of making the denominator zero.
  *   **Residue Report:** This is a **defect of your framework**. Epidemiology requires a stable population to measure risk. It cannot model a process where the risk factor is the eradication of the population's identity. You can count the dead, but you cannot epidemiologize the erasure of the group *as a group*.

  ***

  ### Hypothesis Test: Special Intent vs. Epidemiological Link

  **Your Instinct:** *Dolus specialis* (special intent) is analogous to an "epidemiologically linked" case (inferred from pattern without lab confirmation).

  **Verdict:** The mapping is structurally sound but functionally distinct.

  **Where it holds:**
  Both are **inferential proxies**.
  *   **Epi Link:** We lack direct lab confirmation of the pathogen in the patient, so we infer infection based on contact with a confirmed case + compatible symptoms.
  *   **Special Intent:** We lack direct confirmation of the mental state (confession), so we infer intent based on the pattern of acts + systematic nature.
  Both rely on **pattern recognition** to bridge a gap in direct evidence. Both increase the **specificity** of the classification (ruling out sporadic cases / accidental deaths).

  **Where it breaks:**
  1.  **Teleology:** An epi-link establishes *causation* (Biological Agent A caused Disease B). Special intent establishes *culpability* (Actor A intended Result B). One is a mechanism of nature; the other is a moral state of mind.
  2.  **Probability vs. Binary:** An epi-link is probabilistic (likely source). In court, intent is binary (proven beyond reasonable doubt or not). You can have a "probable case" in surveillance. You cannot have a "probable genocide" in a verdict.
  3.  **The Null Hypothesis:** In epi, the null hypothesis is "no association." In genocide law, the null hypothesis is "innocence." The epi-link seeks to reject randomness. The intent requirement seeks to establish malice.

  **Conclusion:** The analogy is excellent for explaining *how* the determination is made (inference from circumstantial pattern), but it fails to capture *what* is being determined (biological transmission vs. moral guilt). It works as a description of the *evidence*, but not the *implication*.

  ***

  ### Judgement on Your Two Suspicions

  #### 1. Moral Force vs. Resource Allocation
  *Can a framework that distributes resources carry the condemnatory force of the word?*

  **Judgement:** No. The moral content survives only as an externality.
  In your framework, a "case" is a unit of demand on the system. A high count triggers more resources. In the genocide framework, a "case" is a unit of indictment. A high count triggers more blame.
  You can treat the stigma of a disease name as a confounder to be managed (e.g., renaming HIV to reduce stigma). You cannot treat the condemnation of genocide as a confounder; it is the *outcome variable*. If you strip the condemnation to make the category "operational," you have removed the dependent variable. Your framework can manage the *consequences* of the label (refugee flows, trauma care), but it cannot house the *label's* moral weight. That weight is not a resource allocation decision; it is a sovereign judgement.

  #### 2. The Unit of Counting (The Denominator)
  *Is treating the population at risk as a given a strength or a blind spot?*

  **Judgement:** It is a fatal blind spot.
  Your strength is standardization: a case in Country A is a case in Country B. This requires a stable denominator.
  In genocide, the **denominator is the target**. The crime is not just killing the numerators (the individuals); it is destroying the validity of the denominator (the group).
  When you treat the group as a "given," you implicitly validate the perpetrator's premise that the group is a static, countable entity like a population of cells. But the legal claim of genocide is that the group is a *social construct* under attack.
  By assuming the population at risk is uncontroversial, your framework cannot detect the *preparatory* acts of genocide (dehumanization, legal exclusion) because those acts are attacks on the *definition* of the denominator, not just the health of the numerators. You are measuring mortality in a population whose right to be counted is being revoked.

  **Final Translation Note:**
  Your vocabulary is designed to **minimize error** in counting. The legal vocabulary of genocide is designed to **maximize legitimacy** in judging.
  When you translate genocide into case definitions, you successfully map the *mechanics of proof*. You fail to map the *politics of existence*.
  The failure is not in your rigor; it is in the assumption that "counting" is a neutral act. In genocide, the count is the battlefield.
