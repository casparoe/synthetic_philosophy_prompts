          *   *Search:* Probabilistic matching.
          *   *TTS:* Context-heavy inference.
          *   *Legibility:* Psychophysical metrics.
      *   *Conclusion:* Summarize the trade-off. Current system favors precision and history; perceptual system favors fluidity and visual truth.

  6.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say Unicode is *purely* functional. It's also historical. The prompt notes Latin vs. Cyrillic 'a' are different codes even if drawn identically. That's not functional (they function the same in their respective languages); that's *provenance*. I need to name this hybrid: "Historical-Functionalism."
      *   *Correction on Math:* Why are math alphas separate? Because in math, $a$ and $\alpha$ or $a$ and $\mathit{a}$ mean different things. The visual distinction *is* the semantic distinction. In prose, bold 'a' is just emphasis. This supports the "Semantic Distinctiveness" theory.
      *   *Concrete Changes:* Make sure I don't just say "search would change." Say "search would require vector comparison algorithms instead of integer matching."

  7.  **Final Polish:** Check tone (analytical, philosophical but grounded). Ensure American English spelling. Check against all prompt requirements. (No citations, specific focus on the "a" examples provided).

      *(Self-Correction on "Underdetermination"):* Where do incompatible theories yield the same result? For standard 'a' vs 'b'. Both a shape theory and a functional theory say they are different. The divergence is only at the margins (Cyrillic, Math, IPA). This is a crucial point to make.

      *(Refining the "Inconsistency"):* Is it inconsistent? It treats Math styles as semantic (distinct codes) but Text styles as presentational (same code). This implies the theory is: "Encode distinctively if the visual variation changes the *meaning* independent of context." In math, italic vs. roman changes the variable. In text, it doesn't (usually). So it *is* consistent under a "Semantic Load" theory, but inconsistent under a pure "Writing System" theory. I should highlight this tension.

  8.  **Final Review against Prompt:**
