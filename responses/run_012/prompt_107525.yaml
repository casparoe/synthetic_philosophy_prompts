prompt: |-
  Every piece of digital text I have ever written rests on a division of labor that nobody ever voted on. The text itself stores characters; the shapes come from the font. The same file can be set in a blackletter face, a geometric sans, or a coarse pixel face for a tiny screen, and we say the text is unchanged throughout. Unicode, which fixes what the characters are, treats the double-story a of ordinary prose and the single-story ɑ of phonetic transcription as two different characters, and treats the Latin a and the Cyrillic a — which many text faces draw identically — as two different characters as well, while the bold and italic letters used in mathematical typesetting were given code points of their own. Yet a geometric face may draw the very same character as a single-story a, so the very shape difference that marks two characters in one context is a free stylistic choice in another. Downstream, everything that consumes text — a screen reader speaking a document aloud, a search engine matching a query, a spell-checker, a line-breaking algorithm — treats the letter as the character and pays no attention to the shape at all.

  What conception of the letterform does this practice presuppose? Please reconstruct the implicit theory and then interrogate it. Is the practice committed to the view that a letter is individuated by its role within a writing system — by the contrasts it enters into with other characters — rather than by its shape, by what competent readers recognize, or by anything intrinsic to the mark itself? Which rival accounts of what makes an 'a' an 'a' does the practice quietly rule out, and which does it merely fail to require? Where is the practice underdetermined, such that several incompatible theories of letterform identity would license exactly the same encoding and rendering decisions? Are the parts of the practice consistent with one another, or does it silently draw on two different principles across the cases above? And if we replaced the presupposed conception with a perceptual or structural one — on which an 'a' just is a certain configuration of strokes, or a region in a space of stylistic parameters with a central prototype and vague boundaries — what would have to change in character encoding, in font design and licensing, in text search, in screen readers, and in the way legibility is tested? Be concrete about the changes rather than gesturing at a general rethinking.

  I am not looking for sources or citations; I want the analysis. Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The division of labor between text (characters/Unicode) and fonts (shapes/glyphs) in digital typography.
      *   **Key Observation:** The same character code can look different (fonts), and different character codes can look the same (Latin vs. Cyrillic 'a', math italics). Downstream processes (search, screen readers) care about codes, not shapes.
      *   **Task 1: Reconstruct the Implicit Theory:** What conception of the letterform does current digital practice presuppose?
      *   **Task 2: Interrogate the Theory:**
          *   Is it functional/structural (role in writing system) vs. visual/intrinsic?
          *   What rival accounts are ruled out vs. merely not required?
          *   Where is the practice underdetermined (incompatible theories yielding same results)?
          *   Is the practice consistent, or does it mix principles?
      *   **Task 3: Counterfactual Analysis:** If we switched to a perceptual/structural theory (shape-based), what *concrete* changes would occur in encoding, font design, search, screen readers, and legibility testing?
      *   **Constraints:** No sources/citations. American English. Analytical focus.

  2.  **Reconstructing the Implicit Theory (The "Unicode/Font Split" Model):**

      *   *Observation:* Text = Semantic/Abstract Identity. Font = Visual Realization.
      *   *Theory:* The letter is a *functional unit of distinction* within a specific linguistic or symbolic system. It is defined by its *contrastive value*, not its visual form.
      *   *Name:* Let's call this "Functional Abstractionism" or "Semiotic Distinctivism."
      *   *Key Tenet:* Identity is determined by *intent* and *system membership* (e.g., is this 'a' part of English orthography or IPA?), not by geometry.
      *   *Nuance:* It's not purely structuralist (Saussurean) because it acknowledges historical script boundaries (Latin vs. Cyrillic) even when shapes converge. It's a mix of linguistic function and historical provenance.

  3.  **Interrogating the Theory:**

      *   *Individuation:* Yes, it prioritizes role/contrast over shape. An 'a' is an 'a' because it distinguishes "cat" from "cot," not because it has a tail.
      *   *Ruled Out:* Purely visual theories (an 'a' is a circle with a stick). If shape determined identity, Latin and Cyrillic 'a' would be the same code, and single-story vs. double-story might be different codes always.
      *   *Not Required:* It doesn't *require* readers to recognize it by shape, but it relies on them doing so to make the system work. It doesn't require intrinsic mark properties.
      *   *Underdetermination:* Where do different theories agree?
          *   Standard Latin 'a' vs. 'b'. Both functional and visual theories agree these are different.
          *   Bold/Italic math symbols. Functional theory says they are distinct variables ($a$ vs. $\mathit{a}$). Visual theory might say they are just styled versions. Unicode chose functional (distinct codes).
          *   *Inconsistency:* The prompt hints at this. Unicode treats Latin/Cyrillic 'a' as different (historical/system membership) but allows geometric fonts to make them look identical. It treats single/double story 'a' as different in IPA vs. Text (functional context) but allows fonts to swap them in text (stylistic). This suggests a tension between *historical provenance* and *functional contrast*.
      *   *Consistency Check:* Is it consistent? Mostly, but there's a crack. Math alphas are encoded separately (functional distinction based on mathematical semantics). Latin/Cyrillic are encoded separately (historical/script distinction). But stylistic variants (small caps, swashes) are usually font features, not codes. The principle seems to be: "Separate codes if the distinction carries semantic or scriptal weight; shared codes if the distinction is merely orthographic or stylistic." But the line is blurry (e.g., German ß vs. ss).

  4.  **Counterfactual: Switching to a Perceptual/Structural (Shape-Based) Theory:**

      *   *Premise:* Identity = Visual Form (cluster of strokes, geometric parameters).
      *   *Encoding:* Unicode would collapse. Latin 'a' and Cyrillic 'а' would be the same code point. Math italics would be a style tag, not a new code. IPA 'ɑ' might be a style variant of 'a' unless the shape difference is deemed "significant" by a metric.
      *   *Font Design/Licensing:* Fonts would no longer map 1:1 with character sets. A font would be a library of shapes. Licensing might shift from "per font file" to "per glyph shape" or "per visual style." Variable fonts would become the default standard, not an extension.
      *   *Text Search:* Search would become fuzzy by default. Searching for "a" might find "ɑ" if the visual similarity threshold is met. This breaks exact matching (bad for code, good for recall).
      *   *Screen Readers:* TTS would need to infer pronunciation from shape context, not just look up a code. If Latin and Cyrillic 'a' are the same code, how does the reader know which language to speak? It would need deeper context analysis.
      *   *Legibility Testing:* Testing would focus on shape discrimination thresholds. "Can you distinguish this 'a' from this 'o'?" rather than "Can you read this word?" Metrics would be geometric (stroke width, aperture) rather than reading speed/comprehension.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Define the "Functional-Provenance Model." It treats characters as abstract slots in a system.
      *   *Section 1: Reconstruction.* Focus on the separation of *content* (code) and *presentation* (glyph). The character is a semantic token.
      *   *Section 2: Interrogation.*
          *   *Individuation:* It's definitely role-based.
          *   *Ruled Out:* Visual essentialism.
          *   *Underdetermination:* Standard letters (a vs b) work under both theories. The friction appears at boundaries (Cyrillic, Math).
          *   *Inconsistency:* Point out the Math vs. Text discrepancy. Math gets distinct codes for styles; Text gets style tags. Why? Because math semantics rely on the visual distinction as *meaning*. This reveals the theory is actually "Semantic Distinctiveness," not just "Writing System Role."
      *   *Section 3: The Perceptual Shift.*
          *   *Encoding:* Collapse of script blocks. Rise of metadata tags for language.
