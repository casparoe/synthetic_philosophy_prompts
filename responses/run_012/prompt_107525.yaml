answer: |-
  The digital typography ecosystem described presupposes a theory of the letterform that might be called **Historical-Functionalism**. Under this conception, a character is not defined by its visual geometry, nor strictly by its phonetic value, but by its **semantic and historical provenance within a specific coding system**. The letter is treated as an abstract slot in a linguistic or symbolic matrix, where identity is secured by the character's role in distinguishing meaning *within that specific system*, coupled with an allegiance to a historical script tradition.

  ### Reconstructing the Implicit Theory

  The practice divides the world into two ontological categories: the **abstract character** (the Unicode code point) and the **concrete glyph** (the font shape). The implicit theory holds that the *identity* of a letter resides entirely in the abstract character.

  1.  **Identity via Contrastive Role:** An 'a' is an 'a' because it contrasts with 'b' and 'c' to distinguish words like "bat" from "cat." As long as the downstream processor (search, screen reader) can maintain that contrast, the shape is irrelevant.
  2.  **Identity via Script Provenance:** Even if visual contrast is absent, historical lineage matters. The Latin 'a' and Cyrillic 'а' are distinct characters not because they sound different (they often don't) or look different (they often don't), but because they belong to different historical script blocks. To merge them would be to erase a cultural and orthographic boundary.
  3.  **Identity via Semantic Load:** In mathematical typesetting, visual variations (italic vs. bold) are granted distinct code points because, in mathematics, the shape *is* the meaning. An italic $a$ is a variable; a bold $a$ might be a vector. Here, the theory shifts slightly: when visual variation carries semantic weight independent of context, it graduates from "style" to "character."

  ### Interrogating the Theory

  **Individuation and Rival Accounts**
  The practice is committed to the view that a letter is individuated by its **systemic role and provenance**, explicitly rejecting the view that a letter is individuated by its shape (Visual Essentialism) or solely by reader recognition (Phenomenological Recognition).

  *   **Ruled Out:** Pure Visual Essentialism is ruled out. If shape determined identity, Latin and Cyrillic 'a' would be the same code point, and the single-story 'ɑ' might always be distinct from the double-story 'a'.
  *   **Not Required:** The practice does not require that readers recognize the letter by shape, though it relies on it pragmatically. It also does not require anything intrinsic to the mark. A box labeled "a" would function identically in the encoding scheme, provided the font maps that box to a recognizable shape.

  **Underdetermination**
  There are significant zones where the practice is underdetermined, allowing incompatible theories to license the same decisions.
  *   **Standard Orthography:** For the vast majority of the Latin alphabet (e.g., 'a' vs. 'b'), both the Historical-Functionalist theory and a Visual Essentialist theory agree: they are different codes and different shapes. The theories diverge only at the margins (Cyrillic lookalikes, mathematical alphanumerics, IPA symbols).
  *   **Stylistic Variants:** A Structuralist theory (where letters are points in a style space) could license the current system if one posits that "bold" and "italic" are merely coordinates in that space. However, Unicode treats math bold/italic as distinct characters but text bold/italic as style tags. This suggests the practice is not underdetermined here; it actively chooses based on semantic load.

  **Consistency and Tension**
  The practice is not entirely consistent; it silently draws on two different principles.
  1.  **The Script Principle:** Latin and Cyrillic 'a' are separate because of *history*, even if function and shape overlap.
  2.  **The Semantic Principle:** Math italics are separate because of *meaning*, even if they share a script history with Roman text.

  This creates a tension. In text, a change in shape (italicization) is stylistic. In math, a change in shape (italicization) is semantic. The system claims to separate content from presentation, yet it encodes presentation as content when the presentation *becomes* the content (as in math variables). This reveals the core axiom: **Encode distinctively only when the distinction changes truth conditions or script membership.**

  ### Counterfactual: Shifting to a Perceptual-Structural Theory

  If we replaced Historical-Functionalism with a **Perceptual-Structural theory**—where an 'a' is defined by a configuration of strokes or a region in a geometric style space—the digital text infrastructure would require radical reconstruction.

  **1. Character Encoding**
  *   **Collapse of Script Blocks:** Unicode would shrink dramatically. Latin 'a', Cyrillic 'а', and Greek 'α' (if visually similar enough) would map to a single base code point.
  *   **Metadata for Provenance:** Script identity would move from the character code to a metadata tag. Instead of different codes for Latin vs. Cyrillic, a text stream would carry a "Script Context" header.
  *   **Math Integration:** Mathematical alphanumeric symbols would cease to be distinct code points. An italic 'a' would be Base Character 'a' + Style Tag [Italic, Math-Semantic].

  **2. Font Design and Licensing**
  *   **Generative Fonts:** Fonts would no longer be lookup tables mapping codes to static outlines. They would be generative engines taking a base shape and applying transformation parameters (stroke weight, aperture, serif presence).
  *   **Licensing:** Licensing would shift from "per font file" to "per visual parameter set." A designer might license the right to generate shapes within a specific region of the "a-ness" morphological space.
  *   **No More Missing Glyphs:** Since shapes are generated from structural parameters, the "tofu" box (missing glyph) would disappear. If a character is requested, the engine generates the closest perceptual match based on the active style parameters.

  **3. Text Search**
  *   **Vector Matching:** Search engines could no longer use integer matching (Code Point A == Code Point A). They would need to use vector comparison. Searching for "a" would retrieve results within a certain Euclidean distance in shape-space.
  *   **False Positives:** Search would become fuzzy. A query for "catalog" might match "cаtаlog" (with Cyrillic 'a's) automatically, breaking current security models that rely on exact character matching (e.g., domain name spoofing detection would need to become visual-similarity detection).
  *   **Contextual Disambiguation:** To distinguish Latin from Cyrillic when codes are merged, search would need to analyze surrounding character shapes to infer script context before indexing.

  **4. Screen Readers (TTS)**
  *   **Inference Over Lookup:** Text-to-Speech engines could no longer simply look up the pronunciation of a code point. They would have to infer pronunciation from the "Script Context" metadata or, more dangerously, from the visual shape itself.
  *   **Ambiguity Errors:** If Latin and Cyrillic 'a' share a code, a screen reader encountering a mixed-script document might mispronounce words unless the "Script Context" tags are perfectly maintained. A visual theory places a higher burden on the document structure to preserve semantic clarity that is currently baked into the character codes.

  **5. Legibility Testing**
  *   **Psychophysical Metrics:** Legibility testing would shift from reading comprehension speeds to discrimination thresholds. Instead of measuring how fast a user reads a paragraph, testers would measure the minimum geometric aperture required to distinguish 'a' from 'o' or 'c' at a given pixel density.
  *   **Prototype Deviation:** Testing would analyze how far a glyph can deviate from the "central prototype" of a letter before recognition latency increases. Font validation would become a matter of ensuring all generated shapes fall within the "recognizable manifold" of the letter.

  ### Conclusion

  The current digital practice presupposes that the letter is a **semantic token** anchored by history. It prioritizes the *intent* of the writer (which script? which mathematical meaning?) over the *perception* of the reader. This ensures that search, sorting, and speech remain deterministic and stable, even if the visual rendering is fluid.

  Adopting a Perceptual-Structural theory would align the digital representation with the visual reality, acknowledging that readers see shapes, not code points. However, this would trade the stability of semantic identity for the fluidity of visual similarity. It would make the system more robust against stylistic variation but more vulnerable to ambiguity, requiring complex contextual inference to recover the semantic distinctions that the current system hard-codes into the architecture of text itself. The current inconsistency regarding math symbols reveals that the system already bends toward perceptual semantics when necessary; a full shift would simply make that bend the governing rule.
