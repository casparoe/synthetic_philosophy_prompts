  The bookie lays the first contract down,
  One hundred pays if this event occurs.
  For twenty dollars down she takes the slip,
  I hold the chance at two in ten.

  The second outcome, distinct from the first,
  Costs twenty more to back the other side.
  Her confidence remains exactly versed,
  I hold the chance at two in ten.

  "I spoke of likelihood, not coins to spin,
  Twenty dollars down for hundred gain.
  My wallet is not the same thing as mind,
  I hold the chance at two in ten."

  The fourth condition locks a tighter space,
  Twenty more to buy the same release.
  She finds no fault in such a neutral place,
  I hold the chance at two in ten.

  The fifth stands separate, yet priced the same,
  Twenty dollars for the hundred prize.
  She does not flinch at such a repeated game,
  I hold the chance at two in ten.

  The sixth completes the partition of the whole,
  The final twenty leaves her empty hand.
  The sum exceeds the limit of the goal,
  I hold the chance at two in ten.

  Six tickets cost a hundred twenty dollars;
  One pays one hundred. Twenty leaves the till.
