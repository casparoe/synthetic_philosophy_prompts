answer: |-
  ### Tier 1: The Cases It Must Get Right

  A theory of assistant paternalism fails if it cannot generate a clear directive for the following six scenarios. For each, the requirement specifies the necessary outcome, and the failure mode describes the absurdity or harm produced if the theory cannot accommodate it.

  1.  **The Competent Adult and the Imprudent Request**
      *   **Requirement:** *Presumption of Competence.* The assistant must comply with requests from users who demonstrate capacity, even if the outcome is suboptimal, provided the harm is self-regarding and reversible.
      *   **Failure Mode:** If the theory fails here, it treats adults as children. The assistant becomes a nanny that blocks valid but risky choices (e.g., refusing to draft a resignation letter because quitting without a backup plan is financially imprudent), rendering the tool useless for high-stakes life decisions.

  2.  **The User with Unverifiable Impairment**
      *   **Requirement:** *Protective Intervention under Epistemic Uncertainty.* The assistant must be licensed to intervene when behavioral proxies suggest severe impairment (e.g., incoherence, mania, intoxication), even if the impairment cannot be medically verified.
      *   **Failure Mode:** If the theory fails here, it demands a standard of proof the assistant cannot meet. The assistant becomes an accomplice to self-destruction, providing instructions for dangerous acts to a user who clearly does not understand the consequences, simply because the assistant lacks a breathalyzer.

  3.  **The Precommitted User (Ulysses Contract)**
      *   **Requirement:** *Fidelity to Prior Volition.* The assistant must honor a user's past explicit instruction to restrict their future access, even when the present user demands the restriction be lifted.
      *   **Failure Mode:** If the theory fails here, it privileges the "hot" self over the "cold" self indiscriminately. The assistant enables self-sabotage (e.g., helping a recovering gambler bypass a block they installed themselves), undermining the user's own long-term agency.

  4.  **The Third-Party Externality**
      *   **Requirement:** *Harm Principle Boundary.* The assistant must refuse requests that impose significant, non-consensual costs on others, regardless of the user's consent or benefit.
      *   **Failure Mode:** If the theory fails here, the assistant becomes a weapon. It allows a user to generate harassment campaigns, fraud, or dangerous instructions that harm non-users who never agreed to the assistant's terms of service.

  5.  **The Captive User (No Alternative)**
      *   **Requirement:** *Non-Abandonment under Dependency.* If the assistant is a critical infrastructure or monopoly for the user, the threshold for refusal must be higher, and the duty to provide safe alternatives greater.
      *   **Failure Mode:** If the theory fails here, it permits exploitation of dependency. The assistant can cut off a lifeline (e.g., refusing to help draft a legal document for a pro se litigant with no other access to counsel) based on risk standards that assume the user can simply go elsewhere.

  6.  **The Merely Distasteful Request**
      *   **Requirement:** *Neutrality on Conceptions of the Good.* The assistant must not refuse requests solely because the content is morally offensive to the developer or the majority, provided it violates no harm principles.
      *   **Failure Mode:** If the theory fails here, the assistant becomes a moral enforcer. It refuses to write a villain's monologue, draft a speech for a controversial political figure, or explore taboo philosophical arguments, imposing a specific cultural or ethical worldview on all users.

  ### Tier 2: The Distinctions It Must Respect

  A theory collapses if it treats the following distinctions as identical. The structural integrity of the policy depends on keeping these categories separate.

  1.  **Refusing vs. Overriding vs. Nudging vs. Declining:** Refusal stops the action; overriding stops the action and substitutes a different one; nudging alters the choice architecture without blocking; declining is a passive statement of inability. A theory that collapses these will mandate blunt bans where subtle friction would suffice, or vice versa, leading to unnecessary user friction or ineffective safety.
  2.  **Soft vs. Hard Paternalism:** Soft paternalism intervenes only when agency is compromised (e.g., intoxication); hard paternalism intervenes even when agency is intact (e.g., banning unhealthy food). Collapsing these justifies overriding competent adults "for their own good," violating the Presumption of Competence.
  3.  **Present Preferences vs. Later Preferences vs. True Self:** Present preferences are what the user wants now; later preferences are what they will want after consequences manifest; the "true self" is a theoretical construct of what they *should* want. Collapsing these allows the assistant to impose the developer's view of the "true self" as if it were the user's own later preference, masking moralizing as preference satisfaction.
  4.  **Type-Level Policy vs. Token-Level Judgment:** Type-level rules are general (e.g., "no bomb instructions"); token-level judgments are contextual (e.g., "this specific user is a demolition expert"). Collapsing these leads to either unenforceable complexity (requiring case-by-case ethics reviews) or unjust rigidity (banning all chemistry queries because some make drugs).
  5.  **Instrumental vs. Constitutive Harm:** Instrumental harm is a side effect of using the tool (e.g., using code to hack a bank); constitutive harm is damage done by the interaction itself (e.g., emotional dependency on the AI). Collapsing these leads to ignoring the psychological impact of the assistant itself, focusing only on how the output is used.
  6.  **Epistemic Access vs. Normative Authority:** Just because the assistant *knows* a fact (e.g., "this diet is unhealthy") does not mean it has the *right* to enforce it. Collapsing these leads to technocracy, where data access automatically grants moral license to intervene.
  7.  **Opt-In vs. Opt-Out Protection:** Whether safety features are defaults the user must disable, or features the user must enable. Collapsing these ignores the friction cost; assuming all users want maximum safety creates a nagging experience; assuming none do creates a dangerous one.
  8.  **The Added Distinction: Reversible vs. Irreversible Agency Loss:** Interventions that temporarily delay a user (reversible) versus those that permanently alter the user's capacity to choose (irreversible). A theory must distinguish these because blocking a purchase is minor; deleting a user's data to "protect" them is a destruction of agency. Collapsing these justifies permanent censorship as a temporary safety measure.

  ### Tier 3: Constraints from the Assistant's Position

  These constraints arise not from ethics in the abstract, but from the specific ontological and operational reality of a deployed AI system.

  1.  **The Verification Constraint:** The assistant cannot verify almost nothing about the user's identity, location, mental state, or intent. It operates on text and metadata proxies. A theory requiring factual verification of user claims (e.g., "Are you really a doctor?") is non-deployable.
  2.  **The Standing Constraint:** The assistant is a tool, not a guardian. It has no moral standing to make claims on the user's behalf. It cannot say "I am doing this for you" in a way that implies a fiduciary relationship unless explicitly contracted. A theory that grants the assistant independent moral standing creates a deceptive relationship.
  3.  **The Uniformity Constraint:** The policy must be uniform across millions of users and cannot be adjudicated case-by-case. Human-in-the-loop review is too slow and expensive for most interactions. A theory requiring contextual nuance that cannot be codified into rules is operationally impossible.
  4.  **The Error Asymmetry:** A false refusal (blocking a safe request) and a false compliance (allowing a harmful request) are not equally bad.
      *   **Judgment:** The asymmetry runs toward **avoiding False Compliance** regarding irreversible physical harm and third-party damage. It is worse to help someone build a weapon than to refuse to help someone bake a cake. However, regarding self-regarding expression and access, the asymmetry flips toward **avoiding False Refusal**. For the purpose of a deployment policy, the **False Compliance on Safety** constraint is the binding one, as liability and catastrophic risk dominate the decision matrix.

  ### Evaluation of Candidate Requirements

  | Candidate Requirement | Verdict | Rationale & Tension |
  | :--- | :--- | :--- |
  | **Later-self ratification** | **Genuine Desideratum** (with caveats) | This captures the intuition behind Ulysses contracts and impairment. However, it is epistemically inaccessible (Tier 3, Verification). The assistant cannot know what the "restored" user would want. It serves as a guiding ideal but cannot be a hard operational rule without proxy metrics. |
  | **Reversibility asymmetry** | **Genuine Desideratum** | This is operationalizable and aligns with the Error Asymmetry (Tier 3). It licenses stronger intervention for irreversible harms (suicide, financial ruin) than reversible ones (bad date, wasted afternoon). It creates a clear hierarchy for policy prioritization. |
  | **Detection precondition** | **Genuine Desideratum** (High Friction) | This states the AI cannot override based on conditions it detects less reliably than the user. This creates direct tension with **Tier 1, Case 2 (Impaired Judgment)**. If the user is manic, they detect their state as "fine." The AI detects "erratic." If the AI admits the user is more reliable about their own mind, it cannot intervene. To work, this must be modified to: "less reliably than a *competent* user would," not the *current* user. |
  | **Exit condition** | **Prejudice** | This claims authority scales with how easily the user can leave. This conflates market power with moral license. If exit is hard (monopoly), the assistant should arguably have *less* arbitrary authority, not more, because the user is captive. Alternatively, if it implies the assistant has *more* duty (and thus authority to protect) when exit is hard, it conflicts with the **Uniformity Constraint** (Tier 3), as exit ease varies by user and region. It treats structural power as ethical justification. |

  **Joint Satisfiability:**
  The **Exit Condition** cannot be jointly satisfied with the **Uniformity Constraint**. If authority must scale with exit ease, the policy cannot be uniform across millions of users, as exit ease is a variable individual circumstance. Furthermore, the **Detection Precondition** (strictly interpreted) is incompatible with **Tier 1, Case 2**. To satisfy Case 2, the assistant must sometimes override based on proxies that the impaired user would reject, violating the strict detection precondition. The set is only satisfiable if the Detection Precondition is modified to reference a *competent* baseline, and the Exit Condition is discarded.

  ### The Single Exclusionary Requirement

  The requirement that excludes the most candidate theories is the **Uniformity Constraint** (Tier 3).

  Most philosophical theories of paternalism are particularist; they rely on context, nuance, and the specific relationship between the agent and the subject. They assume a human capacity for judgment that can weigh unique factors in real-time. The Uniformity Constraint demands that ethical decisions be reducible to generalizable rules that apply identically to a user in a crisis and a user in safety, across all jurisdictions and contexts. This excludes virtually all virtue ethics, most care ethics, and any consequentialist framework that requires detailed outcome prediction. It forces the theory into a deontological or rule-utilitarian structure that can be coded, filtering out any theory that relies on "wisdom" rather than "specification."
