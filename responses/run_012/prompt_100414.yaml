  ### Part 3: The Test Case

  To prove this to the committee (and to separate the **Structural Rawlsian** rule from the **Global Dollar Maximin** rival), you need a proposal where the *dollars* go up for the worst-off, but the *opportunity* goes down.

  **Bring this proposal to the committee:**

  > "A different retailer offers a contract that raises our starting wage to **$800** (higher than the $780 in the current proposal). It doesn't hurt any suppliers. However, to fund this, we must convert the top three positions from 'Senior Baker' to 'Manager,' and these roles will be **appointed by the board** rather than earned by seniority or skill, with no path for regular members to apply."

  **Why this separates the rules:**
  *   **The Global Dollar Maximin** must vote **YES**. The absolute lowest wage in the room has risen from $750 to $800. No external parties are hurt. The numerical floor is higher than in the retailer proposal.
  *   **The Structural Rawlsian (Nadia)** must vote **NO**. This is even worse than the retailer proposal. It not only locks the top tier (like the retailer deal) but removes the objective criteria (seniority) entirely, making the hierarchy arbitrary. It violates the "offices open to all" clause completely.

  **How to interpret the result:**
  *   If Nadia votes **Yes**, she is a **Global Dollar Maximin**. She cares about the cash floor, and her Vote 3 was only about external harm, not internal structure. You should take the retailer deal.
  *   If Nadia votes **No**, she is a **Structural Rawlsian**. She cares about mobility and caste. You should reject the retailer deal, because she will block it, and she is likely right that it undermines the co-op's long-term health.

  **My bet:** She votes No on the test case, confirming she will vote No on the retailer. She is protecting the *idea* of the bakery, not just the weekly paycheck.
