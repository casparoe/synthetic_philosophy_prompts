answer: |-
  You have done the work of a moral philosopher without the library. You have correctly identified that the line between persuasion and manipulation is not drawn at *truth* (since your mother told the truth and your friend hid the keys), nor is it drawn at *outcome* (since you came home for Thanksgiving anyway).

  You are tracking three things: **Deception** (about facts or intent), **Benefit** (who wins), and **Closeness** (the relationship contract). But you are right to suspect one is doing the heavy lifting.

  Here is the principle that binds your verdicts together.

  ### The Principle of Congruent Intent

  **Influence is manipulation when your true motive for influencing someone contradicts the motive they reasonably assume you have, given the relationship.**

  In simpler terms: Manipulation is not about lying regarding *facts*; it is about lying regarding *allegiance*. It is **False Alliance**.

  *   **Persuasion** happens when I try to move you, but I am open about *why* I am moving you, and that "why" fits the rules of our relationship.
  *   **Manipulation** happens when I let you believe I am acting for Reason A (your good, neutrality, shared truth), while I am actually acting for Reason B (my convenience, my ego, my hidden gain).

  ### How This Principle Judges Your List

  This principle captures almost all your verdicts by looking at the **Expectation of Allegiance** in each relationship.

  1.  **The Sales Floor (Fine vs. Not Fine)**
      *   *Cheaper/Pricier Mower:* **Fine.** In sales, the customer assumes you want to make a sale. Recommending a specific one fits that contract. Even hiding the returns data is fine because the customer assumes you are the expert filter; you are fulfilling the role of "advisor within a sale."
      *   *Fake Manager Check:* **Not Fine.** The customer assumes you are an agent with limited power. You pretend to be *their* ally against the "boss," but you are actually the boss. You created a False Alliance.
      *   *Fake Competing Bid:* **Fine (with a caveat).** In haggling, both sides assume adversarial posturing. The "other bid" is understood as theater, part of the price-discovery game. The intent (get best price) is congruent with the assumed intent of a salesman.

  2.  **The Medical Cases (Fine vs. Not Fine)**
      *   *Framing Numbers:* **Fine.** The doctor's assumed motive is "patient comprehension." Framing data to help you hear it serves that motive.
      *   *Omitting Alternative:* **Not Fine.** The surgeon's assumed motive is "patient's best health." Omitting an option to suit the surgeon's skill serves "surgeon's convenience." False Alliance.

  3.  **The Relationships (Fine vs. Not Fine)**
      *   *Friend Hiding Keys (Safety):* **Fine.** The assumed motive of friendship is "mutual care." Stopping you from driving serves that.
      *   *Friend Hiding Keys (Exclusion):* **Not Fine.** The assumed motive is "care." The real motive was "spite/control." False Alliance.
      *   *Mother's Guilt:* **Not Fine.** The child assumes the parent's motive is "unconditional love." Using debt ("everything I've done") turns love into a transaction. The motive is "compliance." False Alliance.
      *   *Wife Lie:* **Not Fine.** The assumed motive is "shared life/truth." The real motive is "avoiding conflict." False Alliance.
      *   *Shift Manager Pep Talk:* **Fine.** The team assumes the manager's motive is "team performance." Emotional arousal serves that shared goal.

  4.  **The Undecided Case: The Friend with the Story**
      *   **Verdict:** **Not Fine (Manipulation).**
      *   **Why:** If you are chatting as friends, you assume the exchange is for *shared understanding* or *neutral support*. If he is cherry-picking a story specifically to steer your life decision without admitting he wants you to decide that way, he is posing as a neutral observer while acting as a campaigner. He is hiding his stake in the outcome.
      *   **How to make it Fine:** He must declare the intent. "I'm going to tell you this story because I'm worried about you and I want you to take the job." Once the motive is congruent with the assumption, it becomes persuasion.

  ### The Hard Choice: Which Verdict to Drop?

  You asked for a small principle even if it forces you to drop a verdict. The Principle of Congruent Intent forces you to look harder at the **Fake Competing Bid**.

  Strictly speaking, inventing a competitor is a lie about the state of the world, not just the game. If you apply the principle strictly, **this should be Not Fine.** It creates a false scarcity to pressure a decision. The only reason it feels "Fine" to you is that the sales industry has normalized this specific False Alliance.

  If you want a clean conscience, you should mark the Fake Bid as **Not Fine**. It works on the same mechanism as the Fake Manager: creating a fictional constraint to bypass the customer's rational veto. The fact that "everyone does it" makes it a norm, but not an ethical act.

  ### A New Test Case: The Algorithmic Feed

  **Case:** A social media platform shows you angry political content. They do not lie about the content (it is real news). But they hide the fact that their algorithm is designed to maximize your *time on site*, not your *informed citizenship*. They let you assume you are seeing "what's important," while they are actually showing you "what keeps you clicking."

  **Verdict under Principle:** **Not Fine (Manipulation).**
  **Reason:** The user assumes the platform's intent is "connection/information." The platform's actual intent is "extraction/ad revenue." The motive is hidden and contradicts the assumed alliance. This is the digital version of the Fake Manager check.

  ### Addressing Your "Three Things" Suspicion

  You suspected you were tracking **Deception**, **Benefit**, and **Closeness**. You are right, but they are not equal.

  1.  **Closeness is the Container.** It sets the "Reasonable Expectation." You owe your wife more congruence than a customer at a mower dealership. Closeness dictates how much hidden intent is permissible.
  2.  **Benefit is the Signal.** We usually assume people act for their own benefit. If you act for *my* benefit (Doctor, Sober Friend), I grant you more leeway. If you act for *your* benefit (Surgeon, Mother), I demand more transparency.
  3.  **Deception is the Tool.** It is the least important factor. You can deceive with truth (Mother's line) and persuade with lies (Fake Bid).

  **Can Thanksgiving and Key-Hiding survive in one theory?**
  Yes. They are both **Congruent Intent** cases.
  *   **Keys (Safety):** You assume friends protect friends. He protected you. Intent matched expectation.
  *   **Thanksgiving:** You assume a mother loves her child. She leveraged that love to extract compliance. Intent (compliance) contradicted expectation (love).

  ### The Counter-Ready Rule

  When you are about to steer someone, ask this:

  **"If I told them exactly why I am saying this, would it change their decision?"**

  *   If the answer is **No** (e.g., "I'm telling you this mower is reliable because it is, and I want you to be happy"), it is **Persuasion**.
  *   If the answer is **Yes** (e.g., "I'm telling you this story to push you," or "I'm telling you I have to work late to avoid a fight"), it is **Manipulation**.

  If revealing your reason would disarm your influence, then your influence relies on the concealment of that reason. That is the definition of the mark.
