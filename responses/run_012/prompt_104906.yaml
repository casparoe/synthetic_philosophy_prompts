answer: |-
  You have put your finger on a precise and often overlooked nerve in the philosophy of mind. Your intuition is correct: rejecting the spatial "screen" while retaining a temporal "switch" is a very common move, and it is indeed a way of smuggling the Cartesian Theater back in through the side door.

  To answer your primary question: **Yes, this is generally considered the temporal dimension of the Cartesian Theater.** Dennett himself argues that the Theater is not merely a place, but a *spatiotemporal* locus. However, because the spatial error is more visually obvious (the "little man in the head"), the temporal error often survives undetected in theories that claim to be post-Cartesian.

  There is no single, universally standardized noun phrase for *only* the temporal version (like "The Cartesian Clock"), but there are established frameworks that describe it. Below, I will outline the existing concepts, offer a precise coinage for the specific phenomenon you identified, and provide the "carving" you requested to distinguish the error from defensible claims about time.

  ### 1. Existing Concepts and Their Limits

  **A. The Cartesian Theater (Temporal Dimension)**
  Dennett explicitly defines the Cartesian Theater as the notion that there is a specific place *and time* where "it all comes together." In *Consciousness Explained*, he argues that asking "When did the stimulus become conscious?" presupposes a finish line that does not exist.
  *   **Limit:** Because "Cartesian Theater" is so strongly associated with *space* (the homunculus/screen), using it for the temporal error often requires constant qualification, which allows the error to slip by.

  **B. The Orwellian vs. Stalinesque Distinction**
  This is Dennett's specific tool for dismantling the temporal theater.
  *   **Stalinesque:** The experience is falsified *before* it enters consciousness (a show put on for the inner audience).
  *   **Orwellian:** The experience happens, but memory is revised *afterward* (history is rewritten).
  *   **The Point:** Dennett argues that for many temporal phenomena (like color phi or Libet's experiments), asking whether the distortion was Stalinesque or Orwellian is a **false dichotomy**. It presupposes there was a definite time *t* when the experience occurred, which could then be compared to the time of the revision. If there is no definite *t*, the distinction collapses.
  *   **Relevance:** This is the closest established concept to your observation. It identifies the error as the assumption of **Temporal Determinacy**.

  **C. The Specious Present**
  This is the idea that the experienced "now" has duration (a short span) rather than being a knife-edge instant.
  *   **Difference:** The Specious Present addresses the *width* of the moment, not the *boundary*. You can believe in a Specious Present (a duration of experience) while still believing there is a sharp moment when that duration *began*. Your target is the sharp beginning, not the duration.

  ### 2. A Coinage: "The Cartesian Moment"

  Since you asked for a term if nothing fits perfectly, I propose we formalize this as **The Cartesian Moment** (or alternatively, **The Myth of Phenomenal Onset**).

  **Definition:** The Cartesian Moment is the assumption that there exists a non-arbitrary, precise temporal boundary at which unconscious information processing transitions into conscious experience.

  **What it includes:**
  *   The search for a "neural correlate of consciousness" (NCC) defined as the *first* moment a state is conscious.
  *   The intuition that there is a fact of the matter about whether a stimulus was conscious at *t* = 100ms vs *t* = 101ms.
  *   The treatment of consciousness as a binary switch (off/on) rather than a gradient or a functional status.

  **What it excludes:**
  *   **Functional Onset:** Identifying the time at which a system becomes capable of reporting or acting on information. This is a measurable, functional threshold, not a phenomenal one.
  *   **Temporal Smearing:** Theories (like Dennett's Multiple Drafts or Eagleman's neuroscience) which suggest that the "time of experience" is distributed, indeterminate, or assigned retrospectively.
  *   **The Specious Present:** As noted above, acknowledging duration does not preclude the Cartesian Moment; the Moment is about the *edge* of that duration.

  ### 3. The Carving: Where the Edges Fall

  You asked for the carving: what the phenomenon is, what it is not, and whether dating onset is inherently erroneous. Here is the distinction.

  #### The Error: Reifying the Boundary
  The error is not in talking about time; it is in treating the transition from unconscious to conscious as a **phase change** (like water freezing) rather than a **functional graduation**.

  *   **The Cartesian Moment claims:** There is a fact of the matter about when the lights turned on. Even if we can't measure it, either the subject was conscious at *t* or they were not.
  *   **The Multiple Drafts claim:** "Consciousness" is a label we apply to contents that achieve a certain level of narrative dominance or functional availability. This process is smeared over time. Asking for the exact moment is like asking "At exactly which grain of sand does a pile become a heap?" (The Sorites Paradox). There is no fact of the matter.

  #### The Defense: "We need a *when* even if we don't need a *where*"
  You anticipated the counter-argument: *Surely we can locate the onset of a state in time without locating it in space?*

  **The Rebuttal:**
  This defense fails because it conflates **Reportability** with **Phenomenality**.
  1.  **Functional/Reportable Onset (Defensible):** We can say, "At *t*, the subject could press the button indicating they saw the shape." This is a behavioral fact. It is located in time. This is harmless.
  2.  **Phenomenal Onset (The Error):** We say, "At *t*, the subject *experienced* the shape." This claims that the *qualitative feel* ignited at *t*.

  The Cartesian Moment error occurs when you assume (1) guarantees (2), or that (2) is a distinct event that happens at a specific time. In the Multiple Drafts model, there is no "experience" separate from the functional availability that isn't itself subject to revision and temporal smearing. To insist on a specific time for the *experience* (distinct from the report) is to posit a property that has no causal power and no location, which is the definition of the Cartesian residue.

  ### 4. Summary for Your Reading Group

  When you return to your group, you can frame the distinction this way:

  1.  **The Spatial Theater:** The mistake of thinking there is a **Place** where experience happens.
  2.  **The Temporal Theater (The Cartesian Moment):** The mistake of thinking there is a **Time** when experience happens.
  3.  **The Connection:** They are the same error because they both rely on the **Finish Line Fallacy**. They assume processing is a race that ends at a specific coordinate (x, t), after which the "real" consciousness begins.

  **Verdict on your specific worry:**
  > *"A theory that dates the onset of a conscious state, while locating it nowhere, has already committed the error."*

  **Yes.** If the theory claims that date is the onset of *phenomenal experience* (the "lights coming on"), it has committed the error. It has posited a magical boundary in time that serves the same function as the screen in space: it divides the "mere machinery" from the "true experience."

  If, however, the theory dates the onset of *global availability* or *reportability* and explicitly denies that this marks a sharp phenomenal boundary (acknowledging the boundary is fuzzy or arbitrary), it avoids the error.

  **Recommended Terminology:**
  Use **"The Finish Line Fallacy"** (Dennett's own metaphor) or coin **"The Cartesian Moment."** Both capture the idea that the error is not just about *where* the show is, but *when* the show starts. The Multiple Drafts model suggests there is no start time, only overlapping drafts with varying degrees of influence.
