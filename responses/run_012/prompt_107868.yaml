answer: |-
  **Criteria for Causal Weight**
  I am judging these based on three filters: **Counterfactual Necessity** (would the outcome have occurred without this?), **Mediation** (does the natural factor dictate the outcome or merely constrain human choices?), and **Evidentiary Independence** (is the link supported by human records, or just correlated with clean proxy data?). I am explicitly penalizing items where the natural signal is sharp (ice cores) but the human response is inferred, to correct for the asymmetry where quantifiable nature drowns out patchy archives. Regarding "actants": I treat non-human forces as having *causal power* but not *agency*; history happens in the human response to the force, not in the force itself. Calling a volcano an "actor" is a useful heuristic against anthropocentrism, but ontologically it licenses the sloppiness your friend fears by equating blind physics with strategic action.

  **Tier S (Foundational or Decisive)**
  **(4) Old World pathogens after 1492.** *Role:* Necessary Condition/Driver. *Overreach:* Claiming germs alone conquered, ignoring how indigenous factions leveraged the collapse against rivals. *Confidence:* 95%. This is the strongest case for "matter as actant" because the pathogen replicates and evolves, but the historical outcome depended entirely on colonial exploitation of the demographic vacuum.
  **(2) The dust veil of the mid-500s.** *Role:* Trigger + Amplifier. *Overreach:* Framing it as the sole "end of Rome" rather than a catastrophic stressor on an already fracturing political economy. *Confidence:* 90%. The proxy data is undeniable, and the demographic collapse is too synchronous to be coincidental, though local political failures determined who starved.
  **(9) Milankovitch orbital cycles.** *Role:* Background/Permissive Condition. *Overreach:* Using deep time cycles to explain specific cultural evolutions rather than the broad possibility of agriculture itself. *Confidence:* 95%. It is the ultimate background condition; without it, there is no Holocene, but it explains nothing about specific dynasties.

  **Tier A (Strong Amplifiers)**
  **(1) Tambora eruption of 1815.** *Role:* Trigger. *Overreach:* Attributing westward migration primarily to climate rather than land speculation and post-Napoleonic economic depression. *Confidence:* 85%. The cooling is certain, but the "year without a summer" is often used as a neat narrative hook for complex socioeconomic displacement.
  **(3) ENSO cycle in monsoon Asia.** *Role:* Amplifier. *Overreach:* Climate determinism that ignores state capacity; strong dynasties stored grain, weak ones collapsed under the same rainfall deficits. *Confidence:* 80%. The correlation is robust, but the "dynastic trouble" is mediated by bureaucratic competence.
  **(5) Salinization in southern Mesopotamia.** *Role:* Structural Constraint. *Overreach:* Treating it as an inevitable environmental collapse rather than a manageable problem exacerbated by political centralization and irrigation mismanagement. *Confidence:* 80%. It shifted the center of gravity, but human maintenance choices accelerated the chemical process.

  **Tier B (Significant but Mediated)**
  **(6) Little Ice Age and 17th-century crisis.** *Role:* Amplifier. *Overreach:* Bundling witch trials and revolt directly to cold, ignoring the specific religious and fiscal crises of state-building that turned hardship into violence. *Confidence:* 70%. The cooling is real, but the "crisis" is a historiographical construct that varies wildly by region.
  **(8) Lisbon earthquake of 1755.** *Role:* Trigger (Intellectual). *Overreach:* Claiming it single-handedly shifted the Enlightenment, when theological skepticism was already well-developed prior to the tremor. *Confidence:* 75%. It was a catalytic event for *discourse*, but had negligible causal weight on political structures compared to the Seven Years' War.

  **Tier C (Speculative or Low Resolution)**
  **(7) Maunder Minimum.** *Role:* Background Condition. *Overreach:* Assuming a direct line from sunspots to social unrest without accounting for volcanic forcing or ocean circulation which confound the temperature record. *Confidence:* 60%. The solar link to the LIA is debated; the link to specific historical events is largely correlational.
  **(10) Early Anthropocene (CO2/Methane).** *Role:* Redescription. *Overreach:* Claiming humans stopped a glaciation is a model-dependent hypothesis that risks projecting modern agency onto prehistoric land-use changes. *Confidence:* 50%. It reframes the Holocene, but as a historical cause for specific events, it is too diffuse to measure.

  **The Evidentiary Asymmetry & Actant Vocabulary**
  Your friend is right to be suspicious, but not for the reasons she thinks. The asymmetry is genuine: we have annual resolution for Tambora but decadal resolution for tax receipts, so the volcano *looks* like the protagonist because its script is legible. This inflates the rankings of (1), (2), and (7) in popular science. My rankings above penalize items where the natural proxy is cleaner than the social evidence. As for "actants": in case (4), the pathogen acts like an agent (replication, selection), making the term useful. In case (1), the volcano is just a force. Using "actant" for both blurs the distinction between *biological evolution* and *physical discharge*, and risks absolving humans of the responsibility for how they structured their grain supplies or cities to withstand those forces.

  **Final Verdict**
  I'd put money on pathogens (4) as the undeniable driver of the post-1492 demographic collapse.
  I'd drop the Maunder Minimum (7) as a direct historical cause entirely; it's a climate signal, not a historical explanation.
