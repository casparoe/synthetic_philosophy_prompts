      *   **Address the "Disease View" Necessity:** Does commitment *need* the disease model?
          *   *Legally:* Yes, currently. Statutes require a "mental disorder."
          *   *Philosophically:* It provides the *legitimacy* for state intrusion. Without "disease," it looks like punishment or social control.
      *   **Address the Szaszian Alternative:** Could it run on "problems in living" + paternalism?
