      *   **What Would Change?** If we adopted a non-medical model (but kept commitment):
          *   *Grounds:* Shift from "symptoms" to "capacity" or "harm."
          *   *Who:* Might narrow (only immediate violence) or widen (any severe distress).
          *   *Process:* Less medical authority, more legal/social authority.
      *   **The "Insight" Loop:** Address the catch-22 specifically. It's a due process issue.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the journalist's observation. It's the "central paradox of psychiatric law."
      *   *Section 1: The Legal/Philosophical Split.* Explain *why* the standards differ. Commitment is forward-looking (prevention); Insanity is backward-looking (culpability). The disease model bridges them but inconsistently.
      *   *Section 2: Does it need the Disease View?*
          *   Yes, for *legitimacy*. "Disease" makes it seem neutral/scientific rather than moralistic.
