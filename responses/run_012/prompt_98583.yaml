      *   *The Disease Model:* Current law relies heavily on the medical model (diagnosis = legitimacy).
      *   *Szasz's View:* Thomas Szasz argued mental illness is a metaphor for moral/social conflicts, not literal pathology. He opposed involuntary commitment entirely.
      *   *Paternalism:* The state acting in the "best interest" of the individual against their will.
      *   *The "Loop":* The user identifies *anosognosia* (lack of insight) as a catch-22. This is a well-known ethical/legal critique.

  3.  **Formulating the Argument:**

