answer: |-
  Brainstorming: A dossier fails as evidence for a universal claim if: (1) the sampling frame excludes counterexamples by design (e.g., sampling only from certificated items); (2) the sample size relative to the risk population is too small to detect errors (low severity); (3) the test cannot detect the specific fault (insensitive measure); or (4) a single counterexample exists, which logically destroys the universal claim regardless of other positive findings.

  ### Audit Protocol for Universal Claims (Procedure U-1)

  **Purpose:** To convert audit findings into a defensible verdict on claims of the form "Every X has Y."
  **Users:** Internal Auditors.
  **Time Allowance:** 15 minutes per dossier.

  **Step 1: The Refutation Check (Asymmetry Rule)**
  Scan the findings for any single item that is an **X** but lacks **Y**.
  *   **If found:** STOP. The claim is false.
  *   **Verdict:** REFUTES.
  *   **Action:** Do not sign. Escalate immediately. Positive findings elsewhere do not repair this.

  **Step 2: The Selection Check (Countability Rule)**
  Ask: "Given how these items were chosen, could this sample have contained an X without Y?"
  *   **If NO** (e.g., sampled from a list of 'Certificated Items' or 'Compliant Contracts'): The test was rigged to pass.
  *   **Verdict:** NOT COUNTABLE.
  *   **Action:** Reject dossier. Request new sampling frame.
  *   **If YES:** Proceed to Step 3.

  **Step 3: The Severity Check (Relevance Rule)**
  Determine where the sample was drawn from relative to the risk.
  *   **Case 1: Census of X.** (e.g., Checked all 130 vessels).
      *   **Verdict:** CONFIRMS.
  *   **Case 2: Census of non-Y.** (e.g., Checked all uncertificated items to see if any were X).
      *   **Verdict:** CONFIRMS. (Note: Requires assurance the 'non-Y' list is complete).
  *   **Case 3: Random Mix.** (e.g., Random sample of all assets).
      *   Calculate: (Sample Size) × (Proportion of X in Population).
      *   If Expected X items < 5: The test rarely encounters the risk.
      *   **Verdict:** CONFIRMS NEGLIGIBLY.
      *   If Expected X items ≥ 5:
      *   **Verdict:** CONFIRMS.

  **Step 4: Sign-off**
  Attach this worksheet to the dossier. If Verdict is REFUTES or NOT COUNTABLE, do not sign the statement. If CONFIRMS NEGLIGIBLY, sign only with a qualified note on residual risk.

  ---

  ### Philosophical Distinctions Dropped & Limitations

  To make this usable for auditors without philosophy or advanced statistics, I have dropped the following:

  1.  **Bayesian Updating:** I do not ask auditors to calculate posterior probabilities. The qualitative labels (CONFIRMS vs. NEGLIGIBLY) substitute for degrees of belief. This misfires when two "NEGLIGIBLY" dossiers should logically combine to form a "CONFIRMS" verdict; the procedure treats them in isolation.
  2.  **The Nicod-Hempel Debate:** I do not ask auditors to resolve whether a white shoe confirms "All ravens are black." I resolve it pragmatically: a non-X item counts *only if* the selection method allowed an X to be chosen (Step 2) and the severity is high (Step 3). This drops the theoretical equivalence in favor of test severity.
  3.  **Confirmation vs. Acceptance:** In philosophy, evidence can confirm a claim without warranting acceptance. In audit, "CONFIRMS" means "safe to sign." This collapses the distinction, which misfires if the cost of error is catastrophic (where even strong confirmation might not suffice).
  4.  **Reference Class Boundaries:** The procedure stops at Step 3, Case 2. It assumes the list of "non-Y" is complete. If the finance list of lapsed contracts does not match the compliance register of uncertificated items, the logic holds but the data fails. This question is about operational boundaries, not logic, and must be handed back to the Assurance Lead.

  ---

  ### Application to Dossiers

  **Dossier A: Random sample of 214 from 9,000 assets (130 vessels).**
  *   **Step 1 (Refutation):** No vessel without certificate found. (Pass)
  *   **Step 2 (Selection):** Drawn from full register. Could have found a vessel without a cert. (Countable)
  *   **Step 3 (Severity):** Random Mix. Expected vessels = 214 × (130/9,000) ≈ 3.1.
      *   Expected X items < 5. The test rarely encounters the risk class. Finding 19 non-certificated items helps logically (Raven Paradox), but the low density of vessels makes the evidence weight negligible.
  *   **Verdict:** CONFIRMS NEGLIGIBLY.

  **Dossier B: Census of all 130 vessels.**
  *   **Step 1 (Refutation):** All certificated. (Pass)
  *   **Step 2 (Selection):** Census of X. Could have found a failure. (Countable)
  *   **Step 3 (Severity):** Case 1 (Census of X). Exhaustive test of the risk class.
  *   **Verdict:** CONFIRMS.

  **Dossier C: Inspection of 40 items from finance list of lapsed contracts.**
  *   **Step 1 (Refutation):** None were vessels. (Pass)
  *   **Step 2 (Selection):** Drawn from 'lapsed contracts' (non-Y). Could have found a vessel (if a vessel was on the lapsed list). (Countable)
  *   **Step 3 (Severity):** Case 2 (Census of non-Y). This tests the logical complement. If the finance list is the complete set of non-compliant items, finding no vessels here proves no vessels are non-compliant.
      *   *Lead Judgment Required:* Verify finance list equals compliance register. Assuming dossier represents the complete list available to audit:
  *   **Verdict:** CONFIRMS.

  **Dossier D: One vessel found with expired certificate.**
  *   **Step 1 (Refutation):** Item is X (vessel) and lacks Y (current cert).
      *   **STOP.**
  *   **Verdict:** REFUTES.

  \answer{A: CONFIRMS NEGLIGIBLY; B: CONFIRMS; C: CONFIRMS; D: REFUTES}
