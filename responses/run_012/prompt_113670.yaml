  **Verdict Prediction**
  The instructor will rule that Priya **has standing** to blame Tom.

  **Competing Rules**
  To justify this prediction, we must identify the principles that explain the instructor's previous verdicts (1) through (4). Two distinct rules fit the established data but diverge on Priya's case.

  1.  **The Historical Purity Rule:** A blamer lacks standing if they have *ever* committed the specific fault they are blaming.
      *   *Fit:* This explains why Nadia (a cheater) lacks standing, while Ken, Lena, and Marcus (never unfaithful) have standing. Marcus's drunk driving is irrelevant because it is not the specific fault being blamed.
      *   *Prediction for Priya:* Priya cheated in the past. Under this rule, she lacks standing.

  2.  **The Normative Commitment Rule:** A blamer lacks standing if they are not currently committed to the moral norm they are invoking. This is evidenced by current conduct and a willingness to accept the same criticism.
      *   *Fit:* This explains Nadia's lack of standing (she is currently violating the norm, implying she rejects its authority). It explains Ken, Lena, and Marcus's standing (they currently uphold the norm). It aligns with the instructor's hint that what matters is whether the blamer is "willing to accept the very same criticism."
      *   *Prediction for Priya:* Priya has been faithful for fifteen years and sincerely regards infidelity as wrong. She is currently committed to the norm and, presumably, accepts that her past actions were blameworthy. Under this rule, she has standing.

  **Argument for the Prediction**
  The **Normative Commitment Rule** is the superior interpretation of the instructor's position for two reasons.

  First, the **Historical Purity Rule** makes moral reform impossible. If standing were permanently forfeited by past sin, a person could never legitimately participate in moral accountability regarding that fault again, regardless of how sincerely they reformed. This contradicts the intuitive moral distinction between a current hypocrite (Nadia) and a reformed wrongdoer (Priya). Nadia's blame is undermined because she asserts a standard she currently rejects for herself; Priya's blame is not, because she asserts a standard she currently endorses and follows.

  Second, and decisively, the instructor's **hint** explicitly prioritizes the blamer's *attitude* ("willing to accept... criticism") over their *history*. The hint suggests that standing turns on whether the blamer exempts themselves from the moral community's standards. Priya does not exempt herself; she acknowledges the wrongness of infidelity generally, implying she accepts the validity of the norm against her own past as well as Tom's present. Therefore, the instructor will likely view her past as irrelevant to her current standing, provided her current commitment is sincere.

  **Further Case to Decide Between Remaining Rules**
  While the prediction above favors the Normative Commitment Rule over Historical Purity, a subtle contention remains within the Commitment framework itself. Does standing depend on **Current Conduct** (simply not doing the thing) or **Willingness to Accept** (the psychological stance hinted at by the instructor)? Both predict Priya has standing, but they differ in principle.

  To decide between **Current Conduct** and **Willingness to Accept**, consider the following case:

  *   **The Exemptionist:** Julian has never been unfaithful and is currently faithful. However, when asked, Julian states, "Infidelity is wrong for everyone else, but if I were to cheat, I would be too important to be blamed for it. I am exempt from this rule." Julian blames Tom for cheating.

  *   **Verdict Favouring Current Conduct:** If the instructor rules Julian **has standing**, the rule is based on observable behavior. Julian is not cheating, so he meets the requirement.
  *   **Verdict Favouring Willingness to Accept:** If the instructor rules Julian **lacks standing**, the rule is based on the instructor's hint. Julian is unwilling to accept the same criticism for himself, thereby undermining his authority to blame, even if his hands are currently clean.

  Given the instructor's explicit remark that "everything else is a distraction" compared to willingness to accept criticism, the verdict against Julian would be the consistent application of her stated methodology.
