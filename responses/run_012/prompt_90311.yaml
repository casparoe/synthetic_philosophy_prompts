      *   *The Break Points (Disanalogies):*
          *   **Causal Interaction:** Physical experiments interact with causal powers of the world. TEs interact with conceptual commitments.
          *   **Calibration:** Physical dials can be calibrated against standards. Intuitions are calibrated against... other intuitions? (Circularity risk).
          *   **Independence:** In physics, the world exists independently of the theory. In TEs, the "data" (intuition) is often theory-laden or constituted by the very concepts being tested.
          *   **The "Could Have Been Otherwise" Criterion:** In physical experiments, nature could have said "no." In TEs, if the intuition doesn't match, we often say the thinker is confused, not that the concept is different.
          *   **Framing Effects:** In physical experiments, changing the font on the dial shouldn't change the voltage. In TEs, wording *changes* the intuition. This suggests the "apparatus" is constitutive of the phenomenon, not just measuring it.

  3.  **Address the Opponent's Conclusions:**
      *   *Conclusion 1 (Intuitions are Data):* If the "apparatus" (scenario) constructs the "data" (intuition) rather than measuring an independent fact, calling it "data" in the scientific sense is misleading. It's more like "testimony" or "considered judgment."
      *   *Conclusion 2 (Variability = Failed Replication):* In science, if a result depends on the color of the machine, the machine is flawed. In TEs, if a result depends on wording, it might reveal that the *concept* is vague or context-sensitive, not that the "experiment" was poorly designed. The "fix" isn't always a better case; sometimes it's recognizing the concept isn't binary.

