  *(Final check on Confidence)*: I need to be explicit. "Confidence: High/Medium/Low".
  Least sure: The ultimate metaphysical status of mathematical truth (Platonism vs Constructivism) is philosophically contested, so my claim that the analogy *requires* Platonism is high confidence, but whether that *matters* for the pragmatic use of credence is the wobbly bit. I'll pinpoint the interpretation of Logical Induction's success criteria as the least certain technical point.

