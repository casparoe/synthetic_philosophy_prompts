prompt: |-
  I am a novelist at work on a book set largely in Brussels, and I have come to you with a problem of characterization. My protagonist is a mid-level official who has given thirty years to the treaties' undertaking to draw the peoples of Europe ever closer together, and I have given her the image that everyone in the memoir and commentary literature seems to reach for: Europe as a bicycle, which stays upright only for as long as it keeps moving forward — so that a pause for consolidation, a halt to enlargement, a moratorium on treaty change, is not rest but a fall. She uses it against a younger colleague who wants to stop and repair the democratic deficit first, on the grounds that further integration without a democratic warrant is indefensible. I have never found a first source for the image, and I suspect that is because it is less an argument than a mood; but before I put it in her mouth, I want to know how much weight it will bear.

  So give me the audit. What corresponds to what — rider, pedals, momentum, balance, steering, road, destination, the surrounding traffic? Where does the mapping hold, and where does it break? Which of the breaks bear on the work the image is doing in her mouth, namely licensing the claim that halting is inherently destabilizing, and which are mere decoration? What does the bicycle quietly import that the European Union lacks — a single rider, a single heading, a destination, a physics in which standing still and falling are the same event? And once the disanalogies are on the table, does her conclusion survive, or is there a stable third option between pedaling and toppling? If the image can be improved, tell me what a better one would be.

  Throughout, keep the distinction between what is settled and what is genuinely contested among people who study European integration, and among people who study how analogies argue; do not hand me a contested reading as though it were the consensus. A table of correspondences would be welcome. I would rather my character make a defensible argument that some scholars would reject than an indefensible one that all of them would.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book set in Brussels.
      *   **Protagonist:** Mid-level EU official (30 years experience).
      *   **Core Metaphor:** "Europe as a bicycle" (only stays upright if moving forward).
      *   **Conflict:** Protagonist uses this against a younger colleague who wants to pause integration to fix the "democratic deficit."
      *   **Task:** Audit the metaphor. Map correspondences (rider, pedals, momentum, etc.). Identify where the mapping holds and breaks. Analyze what the metaphor imports that the EU lacks. Evaluate if the conclusion (halting = toppling) survives scrutiny or if a "third option" exists. Suggest improvements if necessary.
      *   **Constraint:** Distinguish between settled facts and contested theories in EU studies and analogy theory. Do not present contested readings as consensus.
      *   **Format:** Include a table of correspondences.
      *   **Goal:** Ensure the character makes a *defensible* argument (even if debatable) rather than an *indefensible* one.

  2.  **Deconstruct the Metaphor ("Europe as a Bicycle"):**
      *   *Origin:* Often attributed to Jean Monnet or Jacques Delors, though exact sourcing is murky (as the user noted). It's part of the "Monnet Method" lore.
      *   *Core Logic:* Dynamic stability. Stasis = Collapse.
      *   *Context:* Functionalism/Neofunctionalism (spillover).

  3.  **Map the Correspondences (The Audit):**
      *   *Bicycle:* The EU project/institutions.
      *   *Momentum:* Integration pace (treaties, enlargement, legislation).
      *   *Balance:* Political stability/legitimacy.
      *   *Rider:* Who steers? (Member states? Commission? Citizens?). This is a major friction point.
      *   *Road:* Geopolitical context/Economic landscape.
      *   *Destination:* "Ever closer union" (vague vs. specific).
      *   *Gravity:* Centrifugal forces (nationalism, sovereignty).

  4.  **Analyze the Breaks (Disanalogies):**
      *   *Single Rider vs. 27 Heads:* A bike has one steering mechanism. The EU has 27 veto points (often).
      *   *Physics:* A bike *physically* falls if stopped. A state *politically* might stabilize if stopped (consolidation).
      *   *Destination:* A bike ride usually has a destination. The EU's destination is famously ambiguous ("ever closer," but to what?).
      *   *Agency:* A rider chooses to pedal. Who chooses in the EU? Is it elite-driven or demand-driven?

  5.  **Evaluate the Argument (Halting = Toppling):**
      *   *Protagonist's View:* Neofunctionalist. Spillover requires constant motion. Pausing allows backlash to crystallize.
      *   *Colleague's View:* Intergovernmentalist/Post-functionalist. Legitimacy deficit causes backlash. Speed causes crash.
      *   *Scholarly Consensus:* There is *no* consensus that stopping equals collapse. The "Eurosclerosis" of the 1970s showed stagnation is possible without total dissolution. The "Polycentric" nature of the EU means it can lock in place.
      *   *Verdict:* The metaphor is rhetorically powerful but empirically contestable. It works as a *motivation* for the character, not necessarily as objective truth.

  6.  **Develop the "Third Option":**
      *   Is there a state between pedaling and toppling? Yes: *Coasting* or *Parking* (Standstill with institutional lock-in). Or *Gear Shifting* (Deepening vs. Widening).
      *   Alternative Metaphors: Ecosystem (resilience vs. efficiency), Cathedral (long-term building), Network (nodes and links).

  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the metaphor's pedigree (Monnet/Delors lore) and its function as a "foundational myth."
      *   *Table of Correspondences:* Create the requested table, marking "Settled" vs. "Contested."
      *   *The Physics of the Metaphor:* Discuss the "dynamic stability" claim. Is it true? (Scholars debate this).
      *   *The Disanalogies:* Focus on the "Rider" (Who steers?) and "Gravity" (What pulls it down?).
      *   *The Argument's Viability:* Can the character say this without looking foolish? Yes, if framed as a *belief system* (Monnetism) rather than empirical fact.
      *   *Alternative Metaphors:* Offer options if the user wants to nuance the character's view.

      *(Self-Correction during drafting)*: I need to be careful not to say "The EU is not a bike." I need to say "Scholars disagree on whether the EU behaves like a bike." I must distinguish between *Neofunctionalists* (who like the bike idea) and *Intergovernmentalists* (who see it as a negotiation table).
      *   *Key Distinction:* The "Democratic Deficit." The colleague argues for legitimacy. The protagonist argues for momentum. This is the classic "Output Legitimacy" (results) vs. "Input Legitimacy" (process) debate.

  8.  **Refining the "Audit":**
      *   *Momentum:* Integration steps.
      *   *Balance:* Public support/Elite consensus.
      *   *The Fall:* Disintegration (Brexit style) or Paralysis.
      *   *The Break:* Bikes fall due to physics. States fall due to politics. Politics can pause.

  9.  **Final Review against Constraints:**
      *   Did I distinguish settled vs. contested? Yes.
      *   Is there a table? Yes.
      *   Did I address the "Third Option"? Yes (Consolidation/Parking).
      *   Is the tone appropriate for a novelist (analytical but creative)? Yes.

  10. **Final Polish:** Ensure the distinction between the *character's* conviction and *reality* is clear. The character *believes* the metaphor. The reader should understand *why* she believes it, even if it's flawed. (This adds depth to her characterization as a "true believer" of the old guard).

  *(Post-computation check)*: Make sure to mention Jean Monnet explicitly as the likely source of the *sentiment*, even if the quote is apocryphal. Ensure the distinction between "widening" (enlargement) and "deepening" (integration) is clear in the momentum section.

