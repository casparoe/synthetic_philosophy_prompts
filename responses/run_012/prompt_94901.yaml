answer: |-
  This is a superb problem of characterization. You have identified a metaphor that is central to the self-conception of the European project, yet one that is notoriously slippery when pinned down to source text. That slipperiness is actually a feature, not a bug, for your purposes: it allows your protagonist to speak from a place of instinctive conviction rather than academic precision.

  The "bicycle theory" is widely attributed to Jean Monnet or Jacques Delors, though no definitive primary source exists. It is part of the oral tradition of the *milieu*. In political science, it aligns with **Neofunctionalism** (the theory that integration in one sector creates pressure for integration in others, requiring constant motion). Its opponents generally align with **Intergovernmentalism** (states remain the masters of the treaties and can pause at will) or **Post-functionalism** (politicization constrains elites).

  Here is the audit of the metaphor, distinguishing between where the analogy holds rhetorical weight and where it breaks under empirical scrutiny.

  ### I. Table of Correspondences

  | Bicycle Component | EU Correspondence | Status of Mapping | Notes |
  | :--- | :--- | :--- | :--- |
  | **Forward Motion** | Integration (Treaty change, enlargement, legislation) | **Settled** | Both require energy input to maintain trajectory. |
  | **Balance/Uprightness** | Political Stability / Institutional Legitimacy | **Contested** | Does stability require motion, or can it be static? |
  | **Gravity** | Centrifugal Forces (Nationalism, sovereignty, economic divergence) | **Settled** | There is a constant pull toward disintegration or stagnation. |
  | **The Rider** | The "European Will" (Commission? Council? Citizens?) | **Broken** | A bike has one steering agent. The EU has 27 veto points. |
  | **The Road** | Geopolitical & Economic Context | **Holds** | Terrain varies (crisis vs. prosperity); affects speed. |
  | **Destination** | "Ever Closer Union" | **Broken** | A bike ride usually ends somewhere. The EU's telos is intentionally vague. |
  | **The Fall** | Disintegration (e.g., Brexit) or Paralysis | **Contested** | Does stopping *cause* the fall, or does the fall cause the stop? |
  | **Pedals/Gears** | Policy Instruments / Treaty Mechanisms | **Holds** | Different speeds require different mechanisms (enhanced cooperation). |

  ### II. The Physics of the Argument: Where the Mapping Holds

  Your protagonist's argument rests on the concept of **dynamic stability**. In this view, the EU is not a static state but a process.

  1.  **Momentum vs. Backlash:** The mapping holds best here. Neofunctionalists argue that integration creates winners and losers. Constant motion creates new coalitions of winners who support the next step. If you stop, the losers (those whose industries were disrupted, those who feel sovereignty loss) have time to organize. A pause allows opposition to crystallize. In this sense, "stopping" does feel like "falling" because the political cost of restarting becomes higher than the cost of continuing.
  2.  **The Nature of Gravity:** The EU lacks a *demos* (a single people). It is held together by elite consensus and economic utility. Like a bicycle, which lacks the wide base of a tricycle, it relies on speed to maintain an equilibrium that would be impossible at rest. If the EU stops delivering benefits (peace, market access), the centrifugal force of nationalism (gravity) pulls it down.

  **Verdict for the Character:** She is on solid ground arguing that *political momentum* is fragile. A halt allows Eurosceptic parties to frame the project as stagnant or failing.

  ### III. The Disanalogies: Where the Mapping Breaks

  This is where your younger colleague can fight back, and where you must be careful not to present the protagonist's view as objective truth.

  1.  **The Single Rider (The Steering Problem):**
      *   *The Metaphor:* A bicycle has one handlebar and one rider. If the rider decides to pedal, the bike moves.
      *   *The Reality:* The EU has 27 heads of state. It is less like a bicycle and more like a **tandem with 27 sets of handlebars**, where any one rider can lock their brakes.
      *   *Implication:* Your protagonist implies a level of agency the EU does not possess. She suggests "we must keep moving," but often "we" cannot agree on the direction. If the bike cannot steer, momentum leads to a crash, not balance.
  2.  **The Physics of Stasis:**
      *   *The Metaphor:* In physics, a two-wheeled vehicle *must* move to stay upright.
      *   *The Reality:* In politics, states can "park." The EU experienced "Eurosclerosis" in the 1970s. It did not dissolve; it stagnated. It waited for a new engine (the Single Market in the 80s).
      *   *Implication:* Halting is not inherently destabilizing. Sometimes consolidation (fixing the democratic deficit) prevents a future crash. The colleague's argument is that pedaling faster with a broken frame (democratic deficit) guarantees the fall.
  3.  **The Destination:**
      *   *The Metaphor:* You ride to get somewhere.
      *   *The Reality:* The EU's destination is ambiguous. Is it a Federation? A Confederation? A Regulatory Zone?
      *   *Implication:* If the rider doesn't know the destination, momentum looks like aimlessness. This fuels the democratic deficit.

  ### IV. Does Her Conclusion Survive?

  **The Claim:** *Halting is inherently destabilizing.*
  **The Scholarly Consensus:** **No.** This is a contested claim, heavily associated with the "Monnet Method."

  *   **Support:** Many practitioners (like your protagonist) believe this. It is the "religion" of the Commission. They fear that if the political energy dissipates, the project dies.
  *   **Rejection:** Academic political scientists (particularly Intergovernmentalists like Andrew Moravcsik) argue that integration happens when national interests converge. If interests diverge, forcing motion causes backlash (as seen in the rejection of the Constitutional Treaty in 2005).

  **Can she say this without looking foolish?**
  Yes, provided she frames it as a **lesson of experience** rather than a law of physics. She has 30 years of tenure. She has seen crises solved by "more Europe." She views the democratic deficit not as a structural flaw, but as a friction cost of moving too slow. To her, the colleague is a mechanic who wants to fix the engine while the car is on the highway.

  **The "Third Option":**
  Is there a stable state between pedaling and toppling?
  *   **Coasting:** The EU can rely on existing acquis (laws) without new treaties. This is "maintenance mode."
  *   **Gear Shifting:** Moving from "Widening" (new members) to "Deepening" (stronger institutions among current members).
  *   **Parking:** A formal moratorium. This is risky but possible.

  If your protagonist denies the third option exists, she reveals her **ideological commitment**. She *needs* the bicycle metaphor to be true to justify her career. If she admits the bike can park, she admits 30 years of constant crisis-migration might have been unnecessary.

  ### V. Improving the Image (Or Complicating It)

  If you wish to nuance her argument or give the colleague a stronger rebuttal, consider these adjustments:

  **1. The Tandem Problem (For the Colleague):**
  The colleague might argue: *"A bicycle stays upright when moving, Madame, but only if the rider is steering. We have twenty-seven riders fighting over the handlebars. If we pedal faster without agreeing on the direction, we do not stay upright; we veer into the ditch."*
  *   *Effect:* This acknowledges the momentum argument but highlights the legitimacy/steering deficit.

  **2. The Ecosystem Alternative (For a Narrator/Observer):**
  If you need a metaphor for the EU that allows for stasis, use an **Ecosystem**.
  *   *Logic:* Ecosystems need energy (sunlight/trade), but they also need periods of dormancy (winter) to regenerate. Constant growth is cancer, not health.
  *   *Effect:* This undermines the protagonist's "permanent motion" thesis.

  **3. The Cathedral (For the Protagonist's Inner Life):**
  Your protagonist might privately view the EU not as a bike, but as a **Cathedral**.
  *   *Logic:* It takes centuries. You lay stones you will never see. Stopping is not falling, but it is abandoning the sacred work.
  *   *Effect:* This adds emotional weight. The bicycle is pragmatic; the cathedral is spiritual. It explains her 30-year devotion better than a machine metaphor.

  ### VI. Recommendation for the Scene

  To make the argument defensible but contested:

  1.  **Have her own the metaphor's lineage.** Let her admit, *"Monnet may not have said it, but he lived it."* This acknowledges the lack of a primary source while cementing its cultural weight.
  2.  **Let the colleague attack the "Rider."** The colleague should point out that a bicycle implies a single will. *"Who is pedaling, Madame? The voters stopped pedaling ten years ago. We are pushing a ghost."*
  3.  **The Stakes:** Make clear that for the protagonist, "falling" doesn't just mean policy failure; it means war. The bicycle metaphor works best when the alternative is the abyss of European history (1914, 1939). If the alternative to motion is violence, then her urgency is moral, not just bureaucratic.

  **Summary Verdict:**
  The bicycle metaphor is **rhetorically robust but empirically fragile**. It is the perfect mantra for a true believer who prioritizes *output legitimacy* (getting things done) over *input legitimacy* (voter consent). Your character can wield it effectively as a veteran official, provided the narrative allows the reader to see the cracks in the frame that the younger colleague points out. She is not arguing physics; she is arguing faith.
