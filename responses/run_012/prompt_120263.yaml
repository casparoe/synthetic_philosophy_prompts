answer: |-
  This is a sophisticated diagnosis of a frustrating situation. You are correctly sensing that the surface-level argument (dates of Rome) is not the actual engine of the disagreement.

  Here is the diagnosis of the disagreement structure, what is doing the epistemic work in the absence of demarcation, and the prospects for progress.

  ### 1. Diagnosis: It is a Framework Conflict, not a Factual One
  You asked if this is factual, evidential, verbal, or talking past each other. It is none of those exclusively. It is a **Kuhnian Paradigm Conflict** protected by **Lakatosian Immunization**.

  *   **The Surface:** It looks like a factual disagreement (Did this event happen in 1000 AD or 300 AD?).
  *   **The Structure:** It is a disagreement about which *web of beliefs* gets to anchor reality. Your brother is not proposing a new fact; he is proposing a new *system* for processing facts.
  *   **The Migration:** Your hunch is correct. The disagreement migrates because the theory is structurally designed to force that migration. In philosophy of science (specifically Imre Lakatos), this is called a **"protective belt."** When a core theory is threatened by evidence (e.g., "Here is a carbon-dated artifact"), the theory does not absorb the blow; it shifts the impact to an auxiliary hypothesis (e.g., "The carbon dating calibration is based on the false chronology").
  *   **The "Sociology" Move:** When he claims suppression, he is moving from *epistemology* (how we know) to *sociology* (who holds power). This is a structural feature of conspiracy-adjacent thinking. It transforms an epistemic failure (lack of evidence) into a sociological proof (the lack of evidence *is* the evidence of suppression).

  So, you are not just accusing him of changing the subject. You are identifying that the *subject* is designed to be ungraspable. The argument migrates because the position is topologically defensive, not offensively factual.

  ### 2. What Does the Work Without Demarcation?
  You are right that philosophers largely abandoned the "Demarcation Problem" (finding a necessary and sufficient condition for Science). Popper's falsificationism failed because real science rarely abandons theories immediately upon falsification (see: Neptune's discovery vs. Uranus's orbit).

  If there is no bright line, why is Fomenko wrong? The work is being done by **Consilience** (or Convergence), not Demarcation.

  *   **Mainstream History:** Relies on the convergence of independent lines of evidence. Dendrochronology (tree rings), ice core data, archaeology, linguistics, astronomy (eclipses), and genetics all produce timelines that match each other without coordinating.
  *   **Fomenko's Method:** Relies on a single line of evidence (statistical correlation of textual volumes) that claims to *override* all other lines.

  The reason Fomenko is rejected isn't that he isn't "scientific" enough. It's that his theory has **low explanatory coherence**. To accept his conclusion, you must assume that *every other field* (geology, astronomy, physics) is simultaneously wrong or complicit, while *only* textual statistics are right.

  The "work" being done when you say he is wrong is **Inference to the Best Explanation (IBE)**. The mainstream timeline is the hypothesis that requires the fewest ad hoc assumptions to explain the totality of the data. Fomenko's timeline requires massive ad hoc assumptions (global conspiracy, total destruction of physical records) to explain why the physical data doesn't match his textual data.

  ### 3. The Battle of Priors
  You suspected this is about "which priors you're allowed to start from." You are correct, but with a caveat: it is about the **cost of updating priors**.

  *   **Your Prior:** "Independent methods of dating usually converge."
  *   **His Prior:** "Institutions usually lie to maintain power; textual patterns reveal hidden truth."

  When you present evidence (e.g., an Egyptian grain receipt carbon-dated to 2000 BC), you are asking him to update his prior. But to accept that evidence, he has to dismantle his entire worldview (that the timeline is fake). The epistemic cost is too high.

  Conversely, when he presents his "statistics," he is asking you to accept a prior that "textual correlation outweighs physical dating." You reject this because the cost is dismantling the consensus of physics and geology.

  The argument stalls because you are both calculating the **cost of belief** differently. He views the "consensus" as a high-cost belief (requiring trust in corrupt institutions). You view "conspiracy" as a high-cost belief (requiring trust in a massive, flawless cover-up across centuries).

  ### 4. What Counts as Progress?
  If the disagreement is about frameworks and priors, standard evidence will not move it. Progress is unlikely in the form of "winning." However, you can shift the terrain.

  **Moves that won't work:**
  *   Providing more facts (he will claim they are falsified).
  *   Attacking his method as "pseudoscience" (he will claim demarcation is political).
  *   Arguing about academic sociology (he will claim you are proving his point).

  **Moves that might help (or end the fight):**
  1.  **The "Single Point of Failure" Question:** Ask him: *"What specific piece of evidence, if found, would prove you wrong?"* If he cannot name one (e.g., "If we found a manuscript dated X in location Y"), then the discussion is theological, not historical. If he names one, you can discuss the status of that evidence.
  2.  **Shift from Truth to Utility:** Ask, *"Even if the timeline is shifted, does it change how we understand human causality?"* Often, New Chronology proponents care less about the date and more about the narrative (e.g., "Humanity is older/wiser than we think"). Address the narrative need, not the date.
  3.  **Acknowledge the Sociology (Partially):** Validate his third move slightly. *"You are right that academia can be insular and resistant to new ideas. That happens. But for your theory to win, it has to explain why geology and astronomy are also wrong, not just historians."* This forces him back to the Consilience problem without triggering the "you trust the establishment" defense.

  **The Honest Answer:**
  There is a high probability nothing will move it. This is not a standard disagreement; it is an **epistemic closure**. He has adopted a system where doubt is interpreted as confirmation of the conspiracy. In that system, your skepticism is not a counter-argument; it is data points *for* his theory.

  ### Confidence and Uncertainty

  **Confidence Level:** **High (85%)**
  I am highly confident in the philosophical diagnosis (Lakatos/Kuhn/Consilience) and the structural analysis of the argument. This pattern is well-documented in the literature on conspiracy theories and pseudoscience.

  **Point of Least Certainty:** **The Psychological Payoff**
  I am least sure about *why* your brother specifically holds this view (the psychological utility). Is it a need for special insight? Distrust of authority? Aesthetic preference for a simpler timeline? While the *structure* of his argument is standard, the *motivation* is individual. If the motivation is social (belonging to a community of skeptics), logical arguments will fail completely. If the motivation is purely epistemic (he genuinely thinks the math is better), there is a slim chance of engagement via the "Consilience" angle. I cannot diagnose his interior state from here.
