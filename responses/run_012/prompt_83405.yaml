prompt: |-
  I chair the data-governance board of an international consortium running a longitudinal study of fatigue at two sites. Both sites use identical instruments, identical case definitions, and identical training, and the participants are matched on every internal measure the study takes; the design assumes throughout that the study's central label picks out the same condition in both places. Site B, however, lies in a region where a chronic parasitic infection is endemic, and our physician there reports that most enrolled participants with the study's symptom profile carry it, while site A has essentially none. A minority on the board now argues that we are not measuring one condition under two names but two conditions under one name, and that the pooled analysis in the draft paper therefore misstates what its numbers mean; they call it Twin Earth with a parasite in place of the twin water. The majority answers that our instruments are calibrated to each other, that participants at the two sites are indistinguishable on everything we measure, and that the label means whatever our protocol says it means. The paper is due in three weeks and the authors have asked us to rule. Please draft the written opinion I will circulate: a clear recommendation — pool, do not pool, or pool under stated conditions — with the reasoning behind it, the strongest case for the course I am rejecting, and what we should ask the authors to do before submission. One page, no more than 400 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Data-Governance Board.
      *   **Context:** International consortium, longitudinal study of fatigue, two sites (A & B).
      *   **Situation:** Identical instruments, definitions, training, participant matching. Site B has endemic chronic parasitic infection (most participants with symptom profile have it); Site A has none.
      *   **Conflict:** Minority argues this is "Twin Earth" (two different conditions under one name, pooling misstates meaning). Majority argues instruments are calibrated, participants indistinguishable on measured data, label is defined by protocol.
      *   **Task:** Draft a written opinion/circular recommendation.
      *   **Requirements:** Clear recommendation (pool, do not pool, or pool under conditions), reasoning, strongest case for the rejected course, instructions for authors before submission.
      *   **Constraints:** One page, max 400 words.

  2.  **Determine the Recommendation:**
      *   *Option 1: Do not pool.* This validates the minority's "Twin Earth" argument. It protects scientific validity regarding etiology but reduces power and might contradict the operational definition agreed upon.
      *   *Option 2: Pool.* This validates the majority's operationalist view. It maximizes power but risks confounding fatigue etiology (parasitic vs. non-parasitic).
      *   *Option 3: Pool under stated conditions.* This is the most nuanced and scientifically rigorous approach. It acknowledges the operational equivalence while transparently addressing the biological confounder. It allows for the primary analysis (pooling) but mandates subgroup analysis or covariate adjustment.
      *   *Decision:* "Pool under stated conditions" is the best governance decision. It respects the protocol (operational definition) while acknowledging the biological reality (validity threat). It prevents the paper from being misleading without fracturing the consortium.

  3.  **Drafting - Section by Section:**
      *   **Header:** To/From/Subject.
      *   **Recommendation:** Clear statement.
      *   **Reasoning:** Why this choice? (Operational consistency + Biological validity).
      *   **Rejected Case:** Acknowledge the minority's strong point (etiological difference).
      *   **Instructions:** What authors must do (stratification, limitations).
      *   **Word Count Check:** Keep it tight.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      To: Consortium Members
      From: Chair, Data-Governance Board
      Re: Fatigue Study Data Pooling
      Recommendation: Pool data, but require stratification by site and parasitic status in analysis.
      Reasoning: Our protocol defines the condition operationally. Participants are indistinguishable on measured variables. However, the parasitic load is a confounder.
      Rejected View: The minority argues the condition is fundamentally different (Twin Earth). This is strong because etiology differs. But our study measures symptoms, not causes.
      Instructions: Authors must run subgroup analyses. Discuss limitation. Do not claim universal etiology.
      (Need to refine tone and fit word count.)

  5.  **Drafting - Attempt 2 (Writing & Editing):**
      **TO:** Consortium Members
      **FROM:** Chair, Data-Governance Board
      **SUBJECT:** Ruling on Data Pooling for Fatigue Study Manuscript

      **Recommendation:**
      The Board recommends **pooling data under stated conditions**. The primary analysis may treat the cohort as unified, provided the manuscript explicitly addresses site-specific biological contexts.

      **Reasoning:**
      Our study design relies on operational definitions. Instruments are calibrated, and participants are indistinguishable across all measured variables. To split the cohort now would violate the protocol's construct validity, effectively changing the study's question from "What characterizes this symptom profile?" to "What causes this profile?" The majority is correct that our label refers to the phenotypic presentation, not the underlying etiology.

      **The Rejected Case:**
      The minority's "Twin Earth" argument is scientifically potent. If the parasitic infection drives the fatigue in Site B, while Site A fatigue is psychogenic or idiopathic, pooling obscures distinct pathologies. Treating them as identical risks producing findings applicable to neither group specifically. This threat to external validity is substantial.

      **Instructions for Authors:**
      To mitigate this risk before submission, authors must:
      1.  **Stratify Analyses:** Present primary pooled results, but include secondary analyses stratified by site and parasitic load.
      2.  **Adjust Models:** Include parasitic status as a covariate in regression models to isolate its effect.
      3.  **Clarify Limitations:** Explicitly state in the Discussion that while the *phenotype* is consistent, the *etiology* may differ, limiting generalizability to non-endemic regions.
      4.  **Define Scope:** Ensure claims reflect the operational definition (symptom-based) rather than implying a singular biological mechanism.

      This approach honors our protocol while maintaining scientific integrity. We cannot ignore the parasite, but we need not fracture the consortium.

      **Decision:** Approved contingent on revisions above.

  6.  **Word Count Check:**
      *   Looks around 200-250 words. Well under the 400-word limit.
      *   Tone is authoritative yet balanced.
      *   Covers all requirements: Recommendation, Reasoning, Rejected Case, Instructions.

  7.  **Final Polish:**
      *   Ensure "Twin Earth" reference is acknowledged respectfully.
      *   Make sure the instruction is actionable within 3 weeks.
      *   Check clarity.

