prompt: |-
  I don't have any philosophy training, but I've been chewing on this for a few months and my friends are tired of hearing about it, so you're my last resort. Everyone says there's something wrong with believing a thing while also believing that you shouldn't believe it — I think the fancy name for it is epistemic akrasia, or level splitting. And I get that "p, but I don't believe p" sounds like the Moore's paradox thing, where you contradict yourself in a weird way even though both halves could be true of the world. But "p, and my believing p is irrational" doesn't sound like that to me at all. Concretely: I'm grinding through a hard logic puzzle and a trustworthy friend tells me I've been given a drug that reliably makes people bad at exactly this kind of reasoning. The proof still seems to go through every time I check it — my first-order evidence hasn't moved — but I now have good reason to think my checking is garbage today. It feels like I have to either trust the proof and conclude my friend is wrong about the drug (or about me), or trust the drug fact and throw out the proof. What I supposedly can't do is keep the proof and also keep thinking my proof-checking is broken. Why not, exactly? Saying "because that's incoherent" just restates it.

  I suspect I'm also mashing together two or three seperate questions, and I'd like them pulled apart. One is the drug case. Another is disagreement — when someone as sharp as me says the opposite, is the reason I should back off the same reason I shouldn't be akratic, or is it a completely different machine that just happens to spit out similar verdicts? And a third is what happens when the higher-order evidence is itself the misleading stuff: if I have good reason to think the drug isn't actually affecting me (my friend is a known prankster), then staying confident in the proof looks like the right move, which makes me wonder whether the "akrasia is always irrational" line is even true. Can you explain how people actually argue for the irrationality, what the strongest version of that arguement is, what the best case is for saying level splitting is sometimes fine, and whether the disagreement stuff and the drug stuff are really the same topic or just cousins? An example of what a rational akratic state would even look like would help alot.
