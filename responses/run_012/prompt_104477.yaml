  2.  **Severity: Medium.** (5) vs. (2). Your liberal default (5) clashes with banning vote selling (2). However, (2) cites harm to fellow citizens (equality), which fits standard liberal harm principles. This is repairable by clarifying that "standing" is a public good, not private property.
  3.  **Severity: Low.** (1) vs. Personal Note. Thinking less of a seller while supporting legality is consistent (law vs. morality), provided you acknowledge the moral cost.

  **The Repair:**

  Revise (4). Do not claim commodification is *intrinsically* wrong for some goods. Claim it is wrong when it undermines **equal social standing** or exploits **extreme vulnerability**.

  *   **Votes (2):** Undermines equality. Ban justified.
  *   **Kidneys (1):** Does not undermine equality if regulated (single payer prevents wealth hierarchy); vulnerability is mitigated by screening. The "think less of" feeling is residual stigma, not justice.
  *   **Gouging (3):** Efficiency trumps meaning here; water isn't constitutive of citizenship.

  **Single Revision:**
  Change (4) to: *"Commodification is wrongful only when it undermines the equal standing of persons or exploits desperate vulnerability."*

  **Cost:** You lose the claim that markets *inherently* degrade meaning. You gain consistency. Markets don't corrupt goods; they corrupt *relationships*. A kidney market among equals (regulated) is permissible; a vote market is not because it turns political equality into economic hierarchy. This aligns (1), (2), and (5) without sacrificing your anti-paternalism. You stop being a "commodification theorist" and become an "equality theorist." This preserves your dad's access to organs without requiring you to defend vote selling.
