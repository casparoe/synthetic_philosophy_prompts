answer: |-
  The Pasadena game is often treated as a mathematical curiosity, a pathological edge case where the machinery of Expected Utility Theory (EUT) grinds against the Riemann rearrangement theorem. In the standard setup, a coin is flipped until it lands heads. If heads appears on the $n$-th toss, the payoff is $(-1)^{n-1} \frac{2^n}{n}$. The probability of reaching the $n$-th toss is $1/2^n$. When you multiply payoff by probability, the $2^n$ terms cancel, leaving an alternating harmonic series: $1 - 1/2 + 1/3 - 1/4 \dots$. This series is conditionally convergent. It sums to $\ln(2)$ if you add the terms in the natural order of time, but mathematically, the terms can be reordered to sum to any real number, or to diverge. Consequently, the expected value is not infinite, as in the St. Petersburg paradox; it is undefined.

  The deflationary response to this is seductive in its simplicity. It argues that EUT is a tool with a specific domain of applicability, much like classical mechanics. We do not say classical mechanics is "false" because it fails at quantum scales; we say it simply doesn't apply there. Similarly, when faced with a prospect lacking an absolutely convergent expectation, the theory falls silent. Rationality does not require an agent to have a preference between every pair of prospects. If the math doesn't work, the preference is undefined, and the agent is permitted to remain indifferent or undecided.

  However, this deflationary move collapses when we introduce the Altadena game. The Altadena game is structurally identical to Pasadena, except that every payoff is increased by a fixed positive amount (say, $+1$). In every single possible state of the world—whether the coin lands heads on the first toss or the millionth—the Altadena game pays out strictly more than the Pasadena game. This is a case of state-wise dominance. Intuitively, preferring Pasadena to Altadena is not just risky; it is irrational. Yet, because the Altadena series is also only conditionally convergent, its expected value is equally undefined. If EUT cannot rank these two options, it is not merely silent; it is blind to a fundamental requirement of rational choice.

  The crux of the matter is whether we should treat the Dominance Principle as derivative of Expected Utility or foundational to it. The deflationist treats Expectation as foundational. On this view, dominance is a heuristic that usually works because it typically correlates with higher expected utility. When the expectation calculation breaks down, the heuristic loses its grounding. To accept this is to accept that a rational agent could, without violation of normative theory, choose the strictly worse option simply because the "scorecard" of expected utility is blank. This renders the theory impotent in precisely the cases where our moral and rational intuitions are strongest. If a theory of rationality cannot condemn choosing a guaranteed loss over a guaranteed gain (relative to the alternative), it has failed its primary descriptive and normative function.

  Furthermore, the appeal to mathematical undefinedness conflates the map with the territory. The rearrangement theorem applies to abstract series where order is arbitrary. But decision problems are embedded in causal structures. The coin flips happen in time. The first flip happens before the second. The natural ordering of the series is not a mathematical convention; it is a physical constraint. To argue that the expectation is undefined because one *could* reorder the outcomes is to argue that the value of a gamble depends on a bookkeeping method no agent could actually employ. If we fix the order to the causal sequence, the expectation is $\ln(2)$ for Pasadena and $\ln(2) + 1$ for Altadena. The deflationist might object that this relies on a specific summation method (Cesàro or standard limit) that isn't robust under all transformations, but this misses the pragmatic point. An agent lives through time. They do not experience the gamble as a set of simultaneous numbers to be rearranged; they experience it as a sequence of potential outcomes.

  This suggests that the correct verdict is not to abandon the search for a ranking, but to extend the theory. We need a decision framework that prioritizes state-wise comparison when global integration fails. This is not a radical overthrow of EUT, but a recognition that EUT is a special case of a broader theory of rational preference. In standard cases, maximizing expectation satisfies dominance. In pathological cases like Pasadena, dominance must constrain the theory, not the other way around. Approaches like Relative Expectation Theory attempt to do this by evaluating the expected difference between two acts rather than the absolute expected value of each. Since the difference between Altadena and Pasadena is a constant $+1$ in every state, the expected difference is $+1$, regardless of the convergence issues of the individual series. This preserves the dominance intuition without requiring the individual expectations to be well-defined in the standard sense.

  Critics might argue that this extension invites inconsistency or money pumps if we are not careful with how we define "difference." However, the risk of inconsistency in an extended theory is preferable to the certainty of irrationality in the standard theory. A theory that permits dominance violations is not "incomplete"; it is incorrect. Incompleteness implies there are questions the theory cannot answer. But the question "Should you prefer more money to less, holding all else equal?" is not an unanswerable question. It is the bedrock of instrumental rationality. To say EUT cannot answer it is to say EUT is the wrong tool for the job.

  There is, admittedly, a metaphysical escape hatch: one could argue that Pasadena-style games are conceptually incoherent. If utility is bounded, or if infinite sequences of outcomes are physically impossible, the problem dissolves. But decision theory is often in the business of idealization. We model agents with infinite computational power and perfect information to understand the structure of rationality. If we banish all problems involving infinite series or unbounded utilities, we risk sanitizing the theory until it offers no insight into high-stakes, low-probability decisions (like existential risk or Pascal's Mugging) that share structural DNA with these paradoxes. We should not solve the problem by denying the possibility of the setup, but by refining the rules of evaluation.

  Therefore, the Pasadena/Altadena pair demonstrates that Expected Utility Theory, in its standard Kolmogorovian formulation, is substantively defective, not merely limited. The deflationary acceptance of incompleteness is a surrender of normative authority. It allows the mathematical properties of infinite series to override the logical properties of rational preference. Rationality requires that if Act A yields a better outcome than Act B in every possible state, Act A is preferable. If a decision theory cannot capture this, it must be extended to do so, even if that requires moving beyond standard summation methods to relative comparisons or fixed-order limits.

  **Verdict:** Expected Utility Theory must be substantially extended to prioritize the Dominance Principle over the existence of well-defined absolute expectations.

  **Condition:** This verdict holds provided we accept that decision theory is a normative enterprise concerned with idealized rational agents, rather than a purely descriptive model of physically possible scenarios. If one insists that only physically realizable gambles count, the paradox vanishes, but so does the utility of decision theory for analyzing high-stakes theoretical risks.
