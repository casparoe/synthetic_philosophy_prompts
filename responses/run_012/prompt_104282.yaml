prompt: |-
  I'm in a decision theory reading group and we keep circling back to the Pasadena game — the one where a coin gets flipped until it first lands heads, and the payoff on the nth toss alternates in sign and grows fast enough that the expected-value series ends up merely conditionally convergent rather than absolutely convergent. So it does "converge" to a finite number, but you can reorder the outcomes and make the sum come out to whatever you want, which is why people describe its expected value as undefined rather than as infinite. What's bugging me is that the standard deflationary move — "expected utility theory just doesn't apply to prospects with undefined expectations, so don't play them, and don't bother having preferences about them" — seems to fall apart once you bring in the Altadena-style companion, which is rigged to come out strictly better than Pasadena in every single state of the world, and yet is just as expectation-less. If expected utility theory can't even say you should prefer the game that dominates the other one, that looks less like a harmless gap in the theory's coverage and more like the theory failing at something it's obviously supposed to do.

  So I'd like you to write me an essay, maybe 1000 to 1400 words, no need for formal citations or a bibliography, just argue it out, on whether the Pasadena/Altadena business shows that expected utility theory needs to be substantially extended or replaced, or whether the right verdict is something more deflationary: for instance that rationality doesn't require having a preference between every pair of prospects, that the dominance intuition is doing illicit work here, or that we should just stipulate rational preference is only defined over prospects with well-defined expectations and simply accept the resulting incompleteness. Please weigh the main responses people actually give — the "just don't play it" line, the appeal to a dominance principle, attempts to extend the theory with non-standard summation or limiting methods, and the thought that the agent is being asked an ill-posed question in the first place — and then commit to a verdict. I don't want a wishy-washy "both sides have a point, it's complicated" ending; if your conclusion is conditional, spell out the condition seperately and clearly. Also, please don't just recite the St. Petersburg paradox back at me, I already know it, and I care specifically about what's different once the expectation is undefined rather than infinite.
