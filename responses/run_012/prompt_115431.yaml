      *   **Practical Stake:** How to describe systems built by the user (software/hardware) that respond to environments and get repurposed.

  2.  **Deconstruct the Philosophical Dispute:**
      *   **Dennett (Intentional Stance/Functionalism):** Intentionality is a matter of interpretation based on behavior, history, and environment. If a system acts *as if* it has beliefs/desires, and this prediction works, it *has* beliefs/desires. There is no magic "intrinsic" aboutness. The vending machine example shows content is external/historical. Humans are just more complex versions of this.
      *   **Searle (Biological Naturalism):** There is a fundamental distinction between *original* intentionality (brains/consciousness) and *derived* intentionality (maps, words, machines). Machines simulate intentionality but don't have it because they lack the specific causal powers of biology (consciousness). The vending machine has only "as-if" intentionality assigned by observers.
      *   **The Impasse:** Dennett says "Look at the functional role and history; that *is* intentionality." Searle says "Look at the first-person ontology; without that, it's just syntax." They agree on the physical facts (the machine's wiring, the coins, the history) but disagree on whether those facts constitute "real" intentionality.

