answer: |-
  Good evening. For those of you I haven't met yet—I know there are quite a few of you, since half this room joined while I was already spending more time in the car than outside—my name is Arthur. For the last nineteen years, I've held the key to the equipment cabinet.

  Nineteen years is a long time to be responsible for tripods, eyepieces, and the occasional missing screw. I'm telling you this not to tally up favors, but to explain why I'm stepping down. I'm seventy-six. My knees have stopped negotiating. For the last two winters, my routine has been to unlock the cabinet, hand out the heavy stuff, and then retreat to the idling sedan with the heater on full blast. I can't stand in the cold past eleven anymore. I can't guide a stranger's eye to the Ring Nebula while shivering so hard the telescope shakes.

  I've been reading an old book lately, Cicero's dialogue on old age. He writes it as a defense, answering four charges people bring against getting old. I found myself arguing with him, because Cato was a consul and a general. His life was big. Mine has been small, repetitive, and mostly spent in the dark with strangers. But his four charges fit my situation perfectly, so I'd like to answer them, on my own terms, before I hand over this key.

  The first charge is that old age withdraws you from active life. Cato argued that you can still advise, even if you can't lead. In my world, "active life" isn't about leading armies. It's about setting up the Dobsonian before sunset. It is true that I am withdrawing. I am handing over the labor. But I am not withdrawing from the society. I will still be the guy in the back row asking if we have power for the projector. Stepping down from the work doesn't mean stepping away from the wonder. The active life changes shape; it doesn't have to end.

  The second charge is that old age weakens the body. Cato says to exercise the mind instead. That is a comfort, but it doesn't warm your shins. I have to be honest with the newer members: this work is physical. It is cold. It is dark. You will drop washers in the grass and you will strain your back. My body is simply telling me that its credit limit has been reached. Acknowledging that isn't a complaint; it's inventory. If you take this key, you need to know that the view of Saturn costs you something. It costs you comfort. That cost is real. But it is also worth it.

  Which brings me to the third charge: that old age strips away pleasures. Cato talks about the loss of banquets and physical vigor. In our line of work, the pleasure isn't a banquet. It's a specific sound. It's the intake of breath from a seven-year-old, or a neighbor who was dragged out against their will, when they finally see the moons of Jupiter. They say, "Oh." Just "Oh."

  That pleasure has not faded for me. In fact, as my eyes get worse, the contrast seems sharper. If I can't stand outside to hear that "Oh" anymore, then I have lost my function. But the pleasure itself? That remains. It belongs to the sky, not to me. And it will belong to you, as long as you keep showing up to unlock the door.

  The fourth charge is the hardest. That old age stands too near death. Cato argues that nature has a plan, like a ship reaching harbor. I don't know about harbors. But I know about cycles. Nineteen years ago, someone handed me this key. They told me to keep the grease on the focuser and not to let the new members touch the primary mirror with their fingers. I followed those instructions. Now, I am passing the key on.

  This isn't a sacred relic. It's a piece of metal that sticks in the lock if you don't jiggle it to the left. *[Hold up key]*. It opens a cabinet that contains mirrors and metal tubes. It does not open the sky. The sky is already open.

  To the old members here: You know what it takes. You've covered for me when my knees locked up. Thank you.
  To the new members: You might be wondering why you should volunteer for this. Why trade a warm living room for the dark? Because the sky is the only thing in this town that hasn't changed in nineteen years, and won't change in the next nineteen. It doesn't care how old you are, or how fast you can set up a tripod. It just waits.

  Cicero ended his dialogue with the idea that the soul is immortal. I can't promise you that. But I can promise you that if you take this key, if you stand in the cold and point the scope, you become part of something that outlasts your knees and outlasts me.

  So. Who has the steady hands and the warm gloves?

  *[Pause, look around]*

  Come see me after the meeting. The grease is in the top drawer. The lock sticks to the left. Clear skies to you all.
