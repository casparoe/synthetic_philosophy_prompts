prompt: |-
  I'm taking a grad seminar on metaphysics and I keep getting stuck on Bradley's regress, and I want you to help me see if my take on it is actually right. Here's my worry. The regress, the way I understand it, shows that you can never get a relation to actually relate its terms: to say that a bears R to b you need a further relation tying a, R, and b together, and then yet another relation to tie that one to them, and so on with no end. And since every proposition — even something as boring as "the cat is on the mat" — has a thing being related to a property or a universal, doesn't it follow that no proposition can ever be fully determinate or unified, that the pieces never really combine into one content? So it looks to me like Bradley's regress is basically a proof that there are no propositions, or at least that we should be error theorists about them, which seems like a huge deal that nobody talks about. I asked my professor and she just said "the regress isn't vicious" and moved on, which helped me not at all.

  You're a philosopher of language who actually knows this literature, so walk me through it. Please start by brainstorming what the regress is really an argument for and against before you answer, because I have a suspicion I've got the target of the argument wrong. Then tell me exactly where my leap from "there's a regress" to "no propositions / error theory" breaks down, and whether the unity of the proposition is even the same problem or a different one that people keep running together with it. I don't need a reading list or citations, I just want the reasoning straightened out — and be blunt if my framing is confused, I'd rather know.
