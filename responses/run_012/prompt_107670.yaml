      *   **The Critique:** Why this specific proposal fails. A paid ranking isn't standing; it's charity masquerading as power. It treats the symptom (invisibility) without the cure (capacity). It asks us to spend health money on a mirror instead of a window.
      *   **The Synthesis:** We agree on the end (health + dignity). We disagree on this means.
      *   **The Recommendation:** Vote no. But with a commitment to address the underlying power imbalance.
      *   **The Closing Sentence:** The required sentence for the council reps.

  4.  **Tone Check:**
      *   *Plain:* No academic terms.
      *   *Unhurried:* Longer sentences, pauses implied.
      *   *Wry:* Acknowledge the awkwardness. "I know what you're thinking."
      *   *No Jargon:* Avoid "utilitarian," "prioritarian," "leveling down."
      *   *Length:* 12 minutes is roughly 1,500 to 1,800 words at a moderate pace.

  5.  **Drafting - Iteration 1 (Mental Outline):**
