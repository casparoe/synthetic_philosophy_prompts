          *   Calculation: 5,000,000 * 2,000,000 * 0.0005 = 5,000,000,000 (5 billion expected sentient-insect experiences).
      *   *Q2 (Correlated Uncertainty):* This is the tricky philosophical bit. The objection is: If insects are sentient (P=0.0005), then *all* are sentient. If not, *none* are. So you don't multiply P by N. You either have 0 suffering or 10 trillion suffering. The expected value is the same, but the risk profile is different. The company needs to justify using the linear model. Maybe they argue about "portfolio risk" or "decision-theoretic precaution."
