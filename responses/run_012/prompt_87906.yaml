  # Seminar Handout: The Logical Space of Moral Worth

  **Instructions:** This decision tree maps the logical space of moral worth. Begin at the root. At each node, answer the question based on your intuition about the test case provided. Follow the branch that matches your answer until you reach a leaf. The leaves represent distinct philosophical positions.

  ### The Decision Tree

  **Node 1: Coherence**
  *Case:* Consider the **Donor** (gives to effective charity chiefly for the pleasure of feeling superior) and the **Bystander** (rescues a child from spontaneous compassion). Both produce the same good outcome.
  *Question:* Does the difference in their motives mark a difference in a distinct normative property of *moral worth*, or is this distinction merely folk-psychological noise?
  *   **No (Noise):** Go to **Leaf 1 (Scepticism)**.
  *   **Yes (Real Property):** Go to Node 2.

  **Node 2: Bearer of Worth**
  *Case:* Consider the **Soldier** (does what is required from drilled obedience, without inner endorsement).
  *Question:* Does moral worth attach primarily to the **action's causal contribution** (which the Soldier makes), or to the **agent's psychology/will** (which the Soldier lacks)?
  *   **Action/Causal Contribution:** Go to **Leaf 2 (Act/Causal View)**.
  *   **Agent/Psychology:** Go to Node 3.

  **Node 3: Objective Rightness**
  *Case:* Consider the **Well-meaning but Factually Mistaken Agent** (acts objectively wrongly due to non-culpable error, but with excellent intentions).
  *Question:* Can this agent possess moral worth, or does worth require the action to be **actually right**?
  *   **Yes (Mistake Allowed):** Go to **Leaf 3 (Quality-of-Will View)**.
  *   **No (Success Required):** Go to Node 4.

  **Node 4: Sufficiency of Motive**
  *Case:* Consider the **Reluctant Accomplice** (refuses to join a wrongdoing out of cowardice and a distaste for scenes). The act is right; the motive is non-moral but benign.
  *Question:* Is a **good/benign motive** sufficient for worth (given the act is right), or must the motive satisfy stricter structural constraints?
  *   **Yes (Good Motive + Right Act is enough):** Go to **Leaf 4 (Hybrid View)**.
  *   **No (Stricter Constraints Needed):** Go to Node 5.

  **Node 5: Occurrent vs. Standing**
  *Question:* Must the source of worth be an **occurrent motive** at the time of action, or will a **standing disposition** suffice?
  *   **Standing Disposition:** Go to **Leaf 5 (Character-Expression View)**.
  *   **Occurrent Motive:** Go to Node 6.

  **Node 6: Content of the Operative Reason**
  *Case:* Compare the **Bystander** (compassion) with an agent who acts from the **Thought of Duty**, and an agent who acts for a **Bad Reason that happens to be the Right-Making Feature**.
  *Question:* What specific psychological feature tracks worth?
  *   **The Thought of Duty:** Go to **Leaf 6 (Strict Acting-from-Duty)**.
  *   **Coincidence with Right-Making Feature:** Go to **Leaf 7 (Coincidence View)**.
  *   **Reliable Practical Competence (Neither motive nor coincidence):** Go to **Leaf 8 (Competence View)**.

  *(Note on Distinctions: The question of **culpable ignorance** is treated at Node 3 & 4; if worth requires objective rightness, culpable ignorance typically defeats it in Leaves 4-8. The question of **degrees** is left open for Leaves 3, 5, 7, and 8, but denied by Leaf 6.)*

  ---

  ### The Leaves: Positions and Commitments

  **Leaf 1: Scepticism**
  *   **Position:** The notion of moral worth should be abandoned as metaphysically obscure or morally irrelevant.
  *   **Awkward Commitment:** You must explain away the deep intuition that the Compassionate Bystander is morally better than the Superiority Donor.
  *   **Confidence:** High (Widely held in error theory and some consequentialist circles).

  **Leaf 2: Act/Causal Contribution View**
  *   **Position:** Worth attaches to acts or to the agent's causal contribution and not to motive at all.
  *   **Awkward Commitment:** You must grant the Drilled Soldier the same moral worth as the Principled Refuser.
  *   **Confidence:** Medium (Held by some objective consequentialists, though often under-described).

  **Leaf 3: Quality-of-Will View**
  *   **Position:** Acting for the right reasons suffices without the thought of duty; well-motivated mistakes have worth.
  *   **Awkward Commitment:** You must grant moral worth to an agent who objectively harms the world due to reasonable but false beliefs.
  *   **Confidence:** High (Prominent in contemporary Kantian scholarship, e.g., Arpaly).

  **Leaf 4: Hybrid View**
  *   **Position:** A good motive is necessary but not sufficient; objective rightness is also required.
  *   **Awkward Commitment:** You must deny worth to the Well-meaning Mistaken Agent while granting it to the Reluctant Accomplice (if cowardice counts as a 'good enough' motive).
  *   **Confidence:** Medium (Often a default pre-theoretic position, less often defended as a final theory).

  **Leaf 5: Character-Expression View**
  *   **Position:** Worth is the expression of a stable virtuous character rather than occurrent mental states.
  *   **Awkward Commitment:** You must deny worth to a one-off heroic act performed by a generally vicious agent who 'got it right' once.
  *   **Confidence:** High (Standard Virtue Ethics position).

  **Leaf 6: Strict Acting-from-Duty View**
  *   **Position:** The agent's operative motive must be the very feature that makes the action right (conceived as duty).
  *   **Awkward Commitment:** You must deny moral worth to the Compassionate Bystander who saves a life from love rather than law.
  *   **Confidence:** High (Classical Kantian reading, though debated).

  **Leaf 7: Coincidence View**
  *   **Position:** The agent's operative reason must coincide with the right-making reason, regardless of whether it is conceived as 'duty'.
  *   **Awkward Commitment:** You risk collapsing into the Quality-of-Will view if 'right-making reason' is interpreted broadly enough to include compassion.
  *   **Confidence:** Low/Medium (Often attributed to interpreters of Kant or Aristotelians, rarely self-identified).

  **Leaf 8: Competence View**
  *   **Position:** Moral worth tracks the exercise of a reliable practical competence, neither the agent's motive nor the coincidence of motive with right-making features.
  *   **Awkward Commitment:** You must separate worth from the traditional 'good will', potentially granting worth to agents who lack moral sentiment but possess moral skill.
  *   **Confidence:** Low (Currently a developing position; few explicit proponents).

  ---

  ### Notes on Logical Space

  **Unoccupied Combinations:**
  *   **Act-Bearer + Mistake Allowed:** No one occupies the view that worth attaches to the *act* (not motive) but that *objectively wrong acts* can have worth. This is likely incoherent: if worth is about the act's contribution, a wrong act by definition fails to contribute the relevant good.
  *   **Strict Duty + Degrees:** The Strict Acting-from-Duty view (Leaf 6) typically denies degrees of worth (an act is from duty or it isn't), whereas the Character and Competence views naturally admit them. A view combining Strict Duty with scalar worth is unexplored and arguably unstable.

  **Inseparable Leaves:**
  *   **Leaf 3 (Quality-of-Will) and Leaf 7 (Coincidence):** These are difficult to separate empirically. If an agent acts for a right-making feature (Coincidence), they often display a good will (Quality-of-Will). The tree separates them based on whether *objective success* is required (Node 3), but in cases of success, the extensions of these views often overlap.

  **Location of the Competence View:**
  *   The **Competence View (Leaf 8)** sits nearest to the **Character-Expression View (Leaf 5)**. Both reject the requirement for an occurrent "Thought of Duty" and both emphasize stability/reliability over momentary intention.
  *   **Where it comes apart:** The Character-Expression view requires the disposition to be *morally virtuous* (e.g., compassion, justice). The Competence view requires the disposition to be a *reliable practical skill* at tracking normative reasons. The Competence view can theoretically grant worth to an agent who lacks traditional moral sentiment (e.g., a psychopath with perfect moral reasoning skills) if they reliably execute the right action via competence, whereas the Character view would deny this.

  **Least Sure Placement:**
  *   I am least sure of the placement of **Leaf 7 (Coincidence View)**. It is unclear whether this is a distinct position or merely a description of the *mechanism* by which the Quality-of-Will or Competence views operate. It is often diagnosed by interpreters rather than held by proponents, making its boundaries in the logical space fuzzy.
