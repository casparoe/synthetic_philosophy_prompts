answer: |-
  Your summary of Benacerraf's Dilemma is accurate enough to work with. You've correctly identified the tension between a realist semantics (math sentences are true because they describe abstract objects) and a causal epistemology (we know things by interacting with them). If math objects are causally inert, we can't know them. If math is just symbol-pushing, we can know it, but it's not "true" in a robust sense.

  Here is the analysis of the non-Euclidean episode through that specific lens, broken down by your three directions.

  ### 1. The Flip: Pre- and Post-Independence

  You are right that there is a flip, but it wasn't a binary switch. It was a migration from one horn to the other, mediated by a change in what "geometry" meant.

  **Pre-Independence (The Semantic Horn)**
  Before the 19th century, geometers were effectively on the **Semantic Horn**.
  *   **Objects:** Idealized physical points and lines. They weren't "abstract" in the modern Platonist sense; they were abstractions *from* space.
  *   **Truth:** Correspondence to the structure of physical space.
  *   **Access:** This is where your "self-evident" note needs tightening. The philosophical machinery here was Kant's *Synthetic A Priori*. The claim wasn't just "it's obvious"; it was that our cognitive architecture *constructs* space this way. We have epistemic access because we install the geometry into the world before we experience it.
  *   **The Dilemma Status:** Benacerraf's dilemma doesn't bite hard here because the objects aren't causally inert. If points are idealized physical locations, we have causal contact with their instantiations. The epistemology works *because* the ontology is physical-ish.

  **Post-Independence (The Combinatorial Horn)**
  Once Gauss, Bolyai, and Lobachevsky showed consistency, the discipline split.
  *   **Pure Geometry:** Shifted to the **Combinatorial Horn**.
      *   **Objects:** Undefined terms (points, lines) bound only by axioms.
      *   **Truth:** Conditional ("If these axioms hold, then this theorem follows"). This is "If-Thenism."
      *   **Access:** Proof theory. We know the theorems because we derived them syntactically.
      *   **The Dilemma Status:** This solves the epistemic problem (we built the system, we know the rules) but sacrifices the semantic problem. "Hyperbolic geometry is true" no longer means "Space is hyperbolic." It means "Hyperbolic geometry is consistent."
  *   **Physical Geometry:** Remained on the **Semantic Horn**, but became empirical.
      *   **Objects:** Spacetime.
      *   **Truth:** Correspondence to measurement.
      *   **Access:** Empirical observation (later, General Relativity).

  **Was the flip clean?**
  No. For most of the 19th century, mathematicians were uncomfortable with "meaningless" symbols. They sought *models* (like Beltrami's pseudosphere) to prove consistency. Why? Because they still wanted a Semantic anchor. They needed to show hyperbolic geometry was true *about something* (a surface in Euclidean space) to feel it was legitimate. The full retreat to the Combinatorial Horn (Hilbert's *Grundlagen*, 1899) came later, where points and lines could be "tables, chairs, and beer mugs" as long as the axioms held.

  **Escape or Relocation?**
  It is a relocation. The dilemma is dissolved for *pure* mathematics (which becomes syntax) but transferred to *physics* (which geometry describes reality?). Benacerraf cares about pure math. So for the mathematician, it's an escape. For the philosopher of science, the problem just moved to "How do we know which structure the physical world instantiates?"

  ### 2. The Asymmetry: Is Geometry a "Cheat" Case?

  Your hunch is correct: **Geometry is a cheat case for Benacerraf's Dilemma, and the asymmetry is real.**

  Benacerraf's dilemma is sharpest for domains that *cannot* be physical.
  *   **Geometry:** As you noted, geometry has an "exit ramp" to physics. We can measure the angles of a giant triangle in space. If they sum to 180°, Euclid wins. If not, Riemann wins. The objects (spacetime regions) are causally reachable. Even when geometry became abstract, it retained the *possibility* of physical instantiation.
  *   **Arithmetic:** There is no "physical arithmetic" test. You cannot measure the "true" nature of the number 7 in a lab. You can count 7 apples, but that's an application, not a test of the number 7 itself. Arithmetic objects (infinite sets, transfinite numbers) are definitionally non-physical.

  **Pre-Independence Geometry and the Dilemma**
  Strictly speaking, pre-19th century geometry is **not** a test case for Benacerraf's Dilemma.
  *   **Why:** Benacerraf's dilemma assumes a Platonist ontology (abstract, causally inert objects). Pre-19th century geometers were not Platonists in that sense; they were either Empiricists (geometry is generalized observation) or Kantians (geometry is a feature of the mind). In both cases, epistemic access is explained causally or cognitively.
  *   **The Real Test Case:** A real test case requires objects that are *necessarily* abstract. Arithmetic is the canonical example. Geometry only becomes a real test case *after* it is fully abstracted (post-Hilbert), at which point it looks exactly like arithmetic: a study of formal structures with no guaranteed physical model.

  **Verdict:** You aren't cheating, but you are identifying a boundary condition. The geometry episode shows how a field *escaped* the dilemma by becoming empirical science (for applied geometry) or syntax (for pure geometry). Arithmetic cannot become empirical science. Therefore, the geometry episode demonstrates a solution that is unavailable to arithmetic.

  ### 3. Structuralism: Support or Undercut?

  This is the crux of the modern philosophical response. Structuralism says: "Math isn't about objects (numbers/points); it's about positions in a structure."

  **How Geometry Supports Structuralism**
  The non-Euclidean episode is the historical birth of structuralism.
  *   **The Evidence:** When Beltrami modeled hyperbolic geometry *inside* Euclidean geometry (using a disk), he showed that the "objects" don't matter. A "point" in hyperbolic space could be a "point" inside a Euclidean disk. The *relations* are what matter.
  *   **The Win:** This solves the "Identification Problem" (another Benacerraf paper). It doesn't matter if the number 3 is the set `{∅, {∅}, {∅, {∅}}}` or something else. It matters that it is the successor of 2. Geometry showed that "point" doesn't need an essence, only a role in the axiom system.

  **Where the Dilemma Bites Structuralism**
  Structuralism helps with Semantics (Job 1), but it struggles with Epistemology (Job 2).
  *   **The Problem:** If structures are abstract objects (which they must be to be "true" in a realist sense), we are back to Benacerraf's original worry.
      *   **Question:** How do we have epistemic access to the "Hyperbolic Structure"?
      *   **Platonist Structuralist:** The structure exists out there. *Critique:* How do you touch it? (Benacerraf's original causal objection).
      *   **Modal Structuralist:** The structure doesn't exist; it's just *possible*. "If there were a system like this, it would behave like that." *Critique:* Now your epistemology relies on modal logic (knowledge of possibility). How do we know what is mathematically possible without already knowing the math?
  *   **The Geometry Lesson:** Geometry suggests we access structures via **representation**. We understand hyperbolic space by mapping it to a Euclidean disk. We understand arithmetic by mapping it to sets.
  *   **The Bite:** This just pushes the regress back. If we know arithmetic by mapping it to set theory, how do we know set theory? If set theory is also a structure, how do we know *that* one?

  **Does the episode undercut Structuralism?**
  No, it validates structuralism as the only viable semantics. But it confirms Benacerraf's suspicion: structuralism does not automatically solve the epistemic access problem. It clarifies *what* we know (relations), but not *how* we know it.

  ### Summary of the Mapping

  1.  **Pre-19th Century:** Not a Benacerraf case. Ontology was physical/mental, not abstract. Access was intuition/observation.
  2.  **Post-19th Century (Pure):** A Benacerraf case. Ontology is abstract structure. Access is proof. Solved by sacrificing "truth" for "consistency" (Combinatorial Horn).
  3.  **Post-19th Century (Applied):** Not a Benacerraf case. Ontology is physical spacetime. Access is measurement.
  4.  **Arithmetic:** The hard case. Cannot be Applied (no physical numbers). Must be Pure. Structuralism explains the semantics, but the epistemic access to abstract structures remains the unresolved "magic" that Benacerraf highlighted.

  **Final Correction on Your Dilemma Summary:**
  You stated: *"Whatever story gives you job two (math is symbol-pushing, derivations from axioms) loses job one, because then the axioms are just rules and there's no fact of the matter about which ones are right."*

  Refine this slightly: The worry isn't just that there's no fact about which axioms are right. It's that if math is just symbol-pushing, the sentence "7 is prime" isn't *true* in the same way "Paris is in France" is true. It becomes more like "Checkmate is a win in chess." It's true *by definition of the game*, not true *by correspondence to the world*. Benacerraf wants math to be true like "Paris is in France" (objective fact) but knowable like "Checkmate is a win" (internal rules). The geometry episode shows us we can have the latter, but only by giving up the former for pure math.

  **Conclusion:** The geometry episode is the story of mathematics realizing it couldn't have both, and choosing to split the domain. Arithmetic hasn't split yet, which is why the dilemma still lives there.
