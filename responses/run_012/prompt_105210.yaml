answer: |-
  You have correctly identified that what appears to be a single objection is actually a braid of three distinct philosophical and rhetorical strands. Your intuition that these require "carving" is sound; conflating them is precisely what gives the pattern its argumentative power. When the three are tangled, a rhetorical move (3) borrows the authority of a metaphysical claim (1) and the moral force of an ethical norm (2).

  Here is the carving you requested, distinguishing the claim, the norm, and the move, followed by a proposed term for the third element.

  ### 1. The In-Principle Claim: Axiological Incommensurability
  **Domain:** Value Theory / Axiology
  **Definition:** The assertion that two values (or disvalues) lack a common metric of measurement. This is not a claim that one is larger than the other, but that they belong to different *categories* of value, making quantification impossible or nonsensical.
  **Philosophical Neighbors:**
  *   **Qualitative Hedonism (Mill):** The claim that some pleasures are "higher" than others, not just more intense.
  *   **Value Pluralism (Berlin/Raz):** The idea that human values are multiple, often conflicting, and cannot be reduced to a single super-value (like utility).
  *   **Lexical Priority (Rawls):** The rule that certain principles (e.g., liberty) must be fully satisfied before others (e.g., efficiency) can be considered.

  **Distinction:** This is a truth-claim about the nature of the evils themselves. If true, it holds universally. If I claim famine and genocide are *axiologically incommensurable*, I am asserting a metaphysical limit on moral mathematics. It does not, in itself, forbid the attempt to compare; it merely asserts the attempt will fail to yield a truth.

  ### 2. The Prohibition: Mnemonic Sacralization
  **Domain:** Ethics of Memory / Normative Ethics
  **Definition:** A social or ethical norm that treats specific historical traumas as "sacred" or inviolable, where the act of comparison is construed as a violation of dignity rather than a factual error.
  **Philosophical Neighbors:**
  *   **The Adorno Prohibition:** The sentiment (derived from *Negative Dialectics*) that certain events resist conceptualization or integration into normal discourse.
  *   **The Ethics of Alterity (Levinas):** The idea that the suffering of the "Other" makes an infinite demand on us that cannot be calculated or weighed against other demands.
  *   **Taboo:** A social prohibition on touching or speaking of something holy or polluted.

  **Distinction:** This is a prescriptive rule, not a descriptive claim. One can acknowledge that two horrors *are* comparable (rejecting Element 1) but still argue that comparing them is *indecent* (affirming Element 2). This norm functions to protect the dignity of victims from being turned into data points. It relies on the social consequence (shaming) rather than logical refutation.

  ### 3. The Rhetorical Move: Strategic Incommensurability
  **Domain:** Rhetoric / Political Philosophy
  **Definition:** The selective invocation of *Axiological Incommensurability* (1) and *Mnemonic Sacralization* (2) to shield a specific historical narrative from scrutiny, while retaining the right to make comparisons when they serve one's own political or moral ends.
  **Status:** **Unnamed.** (Proposed term below).

  **Why it needs a name:**
  Existing terms like "Special Pleading" are too broad; they cover any inconsistent application of a rule. "Moral Equivalence" is the accusation levelled *against* the comparer, not the name of the shield used by the objector. "Oppression Olympics" describes the competition, not the rule-enforcement mechanism.

  **Proposed Term:** **Strategic Incommensurability**
  *(Alternative: Comparative Immunity)*

  **Definition:**
  > **Strategic Incommensurability** is a rhetorical maneuver wherein an agent asserts that two moral evils cannot be compared (invoking Element 1) or ought not to be compared (invoking Element 2), not as a consistent philosophical principle, but as a contextual defense mechanism. It is characterized by **asymmetric application**: the prohibition is enforced when the comparison threatens to diminish the uniqueness or severity of a group with which the agent identifies, but is relaxed or ignored when the comparison would diminish an adversary or outsider.

  **How it differs from its neighbors:**
  *   **Vs. Sincere Incommensurability:** A sincere believer in Element 1 refuses *all* ranking of atrocities, even those favorable to their own side. Strategic Incommensurability is inconsistent.
  *   **Vs. Contextual Sensitivity:** One might argue comparisons are valid for policy (compensation) but not memory (memorials). This is a consistent distinction of *purpose*. Strategic Incommensurability shifts the goalposts based on *outcome*, not purpose.
  *   **Vs. Simple Hypocrisy:** Hypocrisy is claiming a virtue one does not possess. Strategic Incommensurability is weaponizing a philosophical concept to render an opponent's argument unintelligible rather than merely false.

  ### Boundary Cases for Testing "Strategic Incommensurability"

  To determine if this label applies fairly, one must test the agent against these boundary cases:

  **1. The Consistent Absolutist (Not Strategic)**
  *   *Scenario:* An individual refuses to compare the Holocaust to the Holodomor, citing incommensurability. They also refuse to compare the Holocaust to the Atomic Bombings, or the Holodomor to the Transatlantic Slave Trade.
  *   *Verdict:* This is **Sincere Incommensurability**. The norm is applied universally. The charge of Strategic Incommensurability is false.

  **2. The Policy/Memory Distinction (Not Strategic)**
  *   *Scenario:* An individual argues that we cannot compare atrocities in a memorial context (because it disrespects the dead) but *must* compare them in a legislative context (to allocate finite reparations funds fairly).
  *   *Verdict:* This is **Contextual Differentiation**. The criterion for comparison shifts based on the domain (sacred vs. secular), not the identity of the victim. This is a coherent philosophical position, not necessarily a rhetorical shield.

  **3. The Asymmetric Veto (Strategic)**
  *   *Scenario:* An individual shuts down a comparison between Atrocity A (their group) and Atrocity B (another group) as "indecent." However, in a different context, they argue that Atrocity A is "worse" than Atrocity C (an adversary's group) to secure funding or political support.
  *   *Verdict:* This is **Strategic Incommensurability**. The concept of incommensurability is treated as a shield when防御 (defending) and discarded as a sword when attacking.

  **4. The Hierarchical Universalist (Not Strategic)**
  *   *Scenario:* An individual explicitly argues that all atrocities *are* comparable and ranks them on a single scale (e.g., by death toll), applying this metric consistently regardless of who is harmed.
  *   *Verdict:* This is **Utilitarian Calculation**. One may disagree with their axiology (Element 1), but they are not employing the rhetorical move (Element 3).

  ### Summary of the Tangle

  The power of the pattern you identified lies in the **conflation of these three elements**.

  1.  The speaker makes a **Strategic Move** (3).
  2.  They justify it using the language of **Axiological Incommensurability** (1), giving it the weight of philosophical truth.
  3.  They enforce it using the social sanction of **Mnemonic Sacralization** (2), giving it the weight of moral virtue.

  By naming the third element **Strategic Incommensurability**, you isolate the rhetorical maneuver from the philosophical claim and the ethical norm. This allows you to say: *"I respect the norm against ranking suffering (2), and I am open to the claim that some evils are qualitatively distinct (1), but I am objecting to the selective application of this principle (3) which functions to immunize one history from inquiry while permitting the diminishment of another."*

  This carving prevents the objection from being dismissed as mere insensitivity, while still exposing the inconsistency of the prohibition.
