answer: |-
  1. The system prioritizes identifiable individuals facing imminent death over statistical populations facing preventable harm, grounding obligation in physical proximity rather than overall need.
  2. This practice presupposes that we are morally liable for active abandonment in a crisis but not for failing to provide the structural conditions required for long-term survival.
  3. It is not a coherent ethical theory but a fragmented compromise that combines emergency humanitarianism with market-based rationing for all non-acute care.
  4. Swapping this for a population view would redirect funding from high-cost rescues to prevention, whereas a personal responsibility view would abolish the ER mandate entirely.
  5. Dismissing the ER rule as mere optics fails because it legally codifies a minimal collective obligation, proving the system accepts some liability even if it refuses to extend it further.
