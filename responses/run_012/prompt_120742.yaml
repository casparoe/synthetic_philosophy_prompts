answer: |-
  Chen spends forty years as a night-shift archivist in a climate-controlled vault, governed solely by a meticulous manual of preservation protocols that dictate every movement and interaction. He encounters no human suffering, faces no crises requiring spontaneous aid, and feels no inner urge to benevolence, only a steady drive to maintain order and avoid procedural error. His life is one of perfect external conformity to the code, devoid of opportunities for emotional extension or unscripted care.

  **Verdicts and Reasoning**
  For Mencius, Chen does not become good. Moral character is the cultivation of innate "sprouts" (e.g., compassion, shame) which must be triggered by spontaneous reactions to the world and then "extended" (*tui*) to broader contexts. Chen's environment provides no distress to trigger compassion, and his adherence to the manual is mechanical, not an expression of an enlarged heart; thus, his sprouts starve from lack of use. For Xunzi, Chen does become good. Human nature is inherently prone to disorder, and goodness is "artifice" (*wei*) produced by accumulating adherence to a model. The manual functions as Ritual (*li*); by suppressing his raw impulses and aligning his actions perfectly with the code over forty years, Chen successfully transforms his nature into a cultivated state.

  **The Pivotal Feature**
  The case turns on the **absence of occasions for spontaneous emotional extension**. Everything else (duration, effort, conformity) is held fixed.

  **Counterfactual Analysis**
  If this feature were removed—say, Chen works in a busy hospital archive where he frequently encounters grieving families—the case collapses back to the familiar direction. Mencius would predict success, as the sprouts of compassion would be triggered and could be extended through his work. Xunzi would also predict success, as the ritual model would guide his interactions with the grieving. If the feature were reversed to a lack of protocol but presence of emotion, Mencius might still predict success (sprouts exist), while Xunzi would predict failure (no model to shape the impulses).

  **Defense and Substantive Disagreement**
  A defender of Mencius (who here predicts the "pessimistic" failure) would attack the case as anthropologically impossible: a human being devoid of spontaneous emotional triggers for forty years is not a functioning moral agent but a simulacrum, so the failure verdict is trivial. They might claim Xunzi and Mencius use different standards: Xunzi defines goodness as *behavioral order*, while Mencius defines it as *vital moral vitality*. However, this concession does not render the disagreement merely verbal. It remains substantive because it locates the source of normativity differently: for Mencius, value is discovered internally and risks atrophy without specific nourishment; for Xunzi, value is constructed externally and risks collapse without specific structure. The case survives the charge of being rigged because it isolates the mechanism of cultivation (growth vs. construction) rather than the difficulty of the task, proving that Mencius can be the restrictive theorist and Xunzi the enabling one depending on the environmental conditions provided for the self.
