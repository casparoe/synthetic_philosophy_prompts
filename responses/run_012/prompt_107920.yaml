answer: |-
  ### Essay Question

  **Time Allowed:** 60 Minutes
  **Word Limit:** None (but quality over quantity)

  In this seminar, we have distinguished between two properties of a dynamical model. A model is **closed** if its state description and laws of motion leave nothing unmodelled (no external inputs unaccounted for). A model is **tight** if small errors in the initial state remain small under the dynamics (stability of trajectory).

  Consider the following two cases:
  1.  **Case Alpha:** A double pendulum swinging in a vacuum. The model includes all forces acting on the arms. It is deterministic, yet two runs with microscopically different initial positions diverge exponentially within seconds.
  2.  **Case Beta:** A model of a satellite's orbit. The model ignores thruster firings from ground control. However, whenever the satellite drifts from the predicted path, ground control fires thrusters to push it back. Consequently, the satellite's actual position stays very close to the model's prediction over long periods.

  Write an essay analyzing these cases. First, classify Case Alpha and Case Beta using the terms **closed** and **tight**. Second, explain what the predictive performance in each case does, and does *not*, warrant regarding the inference to **determinism** or **indeterminism**. Specifically, address why predictive failure is not proof of indeterminism, and why predictive success is not proof of a closed, deterministic system.

  ***

  ### Model Answer

  To evaluate the relationship between prediction and determinism, we must rigorously apply the distinctions between closure and tightness. A model is **closed** if the state and laws exhaust the causes of change; there are no "outside" forces acting on the system that the model ignores. A model is **tight** if the dynamics are stable, meaning perturbations in the initial state do not amplify significantly over time. These properties are independent: a system can possess one without the other, and this independence breaks the naive inference from predictive success to determinism.

  **Case Alpha** (the double pendulum) is **closed but not tight**. It is closed because the model accounts for all relevant forces (gravity, tension) within the vacuum; there are no unmodelled external inputs. However, it is not tight because it exhibits sensitive dependence on initial conditions. Microscopic errors in the starting position amplify exponentially, leading to macroscopic divergence between the model's prediction and the physical reality. Crucially, this predictive failure does *not* imply indeterminism. The system is ontologically deterministic; the laws dictate a unique future given a precise state. The failure is epistemic, arising from the lack of tightness (chaos), not a lack of causal closure. Therefore, observing predictive failure in such a system is insufficient evidence to infer indeterminism.

  **Case Beta** (the satellite) is **tight but not closed**. It is tight because the actual trajectory remains close to the predicted trajectory; errors do not grow. However, it is not closed because the model ignores the thruster firings. The stability of the prediction relies on an external mechanism (ground control) that intervenes to correct deviations, a mechanism the model itself does not represent. Here, predictive success does *not* imply that the system is deterministic or closed. The match between model and world is maintained by external agency, not by the internal sufficiency of the model's laws. One could mistakenly infer that the satellite's motion is fully determined by the orbital mechanics alone, but this would be false; without the unmodelled corrections, the prediction would fail. Thus, predictive success is insufficient evidence to infer closure or determinism.

  Comparing these cases reveals a gap in the standard inference from prediction to ontology. Arguments for determinism often rely on the success of physics to predict the world, assuming that successful prediction implies a closed, deterministic law. Case Beta demonstrates that success can arise from external stabilization (tightness without closure), rendering the inference invalid. Conversely, arguments against determinism often cite the unpredictability of weather or turbulence. Case Alpha demonstrates that failure can arise from instability within a deterministic framework (closure without tightness).

  Ultimately, determinism is a claim about **closure**: that the state and laws are sufficient for the future. Prediction is a claim about **tightness**: that our measurements are sufficient to track that future. Case Alpha shows we can have determinism without prediction. Case Beta shows we can have prediction without determinism (or at least, without the model capturing the determinism). Therefore, predictive performance is an unreliable proxy for the metaphysical status of the system. To establish determinism, one must demonstrate closure, not merely tightness; to explain predictive failure, one must diagnose tightness, not merely assume indeterminism. The seminar's central claim holds: chaotic systems are typically closed but not tight, and the worry about prediction is a worry about stability, not about the existence of lawful determination.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Correct Classification of Case Alpha (4 Marks)**
  *   **Must Hit:** Identify Case Alpha as **Closed** (all forces accounted for) but **Not Tight** (errors diverge/chaos).
  *   **Characteristic Error:** Identifying Alpha as "Not Closed" because it is unpredictable, or claiming it is "Tight" because the laws are fixed. (Confusing lawfulness with stability).

  **2. Correct Classification of Case Beta (4 Marks)**
  *   **Must Hit:** Identify Case Beta as **Tight** (trajectory stays near prediction) but **Not Closed** (external thrusters unmodelled).
  *   **Characteristic Error:** Identifying Beta as "Closed" because the prediction works, or "Not Tight" because it requires intervention. (Confusing predictive accuracy with model completeness).

  **3. Analysis of Predictive Failure (Case Alpha) (4 Marks)**
  *   **Must Hit:** Argue that predictive failure in Alpha does **not** prove indeterminism because the system is deterministic despite the divergence.
  *   **Characteristic Error:** Treating the exponential divergence (sensitive dependence) as evidence that the system is indeterministic or random.

  **4. Analysis of Predictive Success (Case Beta) (4 Marks)**
  *   **Must Hit:** Argue that predictive success in Beta does **not** prove closure/determinism because the accuracy depends on unmodelled external corrections.
  *   **Characteristic Error:** Treating accurate prediction as evidence that the model's laws are sufficient (closure) or that no external agency is involved.

  **5. Synthesis on the Inference Gap (4 Marks)**
  *   **Must Hit:** Conclude that prediction (tightness) and determinism (closure) are distinct categories, and neither success nor failure reliably infers the other.
  *   **Characteristic Error:** Concluding that determinism is impossible because prediction fails, or that determinism is proven because prediction succeeds (collapsing the distinction).
