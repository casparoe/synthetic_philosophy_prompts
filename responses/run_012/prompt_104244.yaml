  # Decision Tree: Commitments in the Foundations of Mathematics

  **Start:** You are a mathematician comfortable with classical logic and full classical set theory (ZFC). Answer the following questions based on your philosophical commitments.

  ### 1. Is Double Negation Elimination ($\neg\neg A \to A$) valid for all mathematical statements?
  *   **Yes:** (Classical Logic) $\rightarrow$ Go to **Question 2**.
  *   **No:** (Intuitionistic Logic) $\rightarrow$ Go to **Question 5**.

  ---

  ### **Classical Branch**

  ### 2. Is the Axiom of Choice acceptable when it yields a selector with no recipe?
  *   **No:** $\rightarrow$ **Leaf: Predicativism**
      *   *Most Awkward Commitment:* You must reconstruct standard analysis to avoid impredicative definitions, often losing the least upper bound property for arbitrary sets.
  *   **Yes:** $\rightarrow$ Go to **Question 3**.

  ### 3. Does a single logic govern all of mathematics, or is classical reasoning legitimate merely where consistency, not constructive content, is wanted?
  *   **Merely Consistency (Instrumental):** $\rightarrow$ **Leaf: Hilbertian Finitism**
      *   *Most Awkward Commitment:* You must treat infinite totalities as meaningless symbols while relying on them to prove facts about finite numbers.
  *   **Single Logic (Universal Truth):** $\rightarrow$ **Leaf: Unoccupied (Classical Platonism)**
      *   *Status:* **Unattractive** for this handout (This is your starting position, not a constructive alternative).

  ---

  ### **Constructive Branch**

  ### 4. (Filter) Must a proof of an existential claim ($\exists x P(x)$) yield a specific witness $x$?
  *   **No:** $\rightarrow$ **Leaf: Unoccupied**
      *   *Status:* **Incoherent** (Constructivity fundamentally requires witnesses).
  *   **Yes:** $\rightarrow$ Go to **Question 5**.

  ### 5. Must a proof of a disjunction ($A \lor B$) yield a proof of $A$ or a proof of $B$?
  *   **No:** $\rightarrow$ **Leaf: Unoccupied**
      *   *Status:* **Incoherent** (Violates the constructive meaning of "or").
  *   **Yes:** $\rightarrow$ Go to **Question 6**.

  ### 6. From the premise that a computation does not fail to halt, may one infer that it halts? (Markov Principle)
  *   **Yes:** $\rightarrow$ **Leaf: Computability-first (Russian Constructivism)**
      *   *Most Awkward Commitment:* You must identify all functions with recursive functions, denying classical cardinality distinctions.
  *   **No:** $\rightarrow$ Go to **Question 7**.

  ### 7. Must a continuous function on the unit interval that takes both a negative and a positive value vanish somewhere? (Exact IVT)
  *   **Yes:** $\rightarrow$ **Leaf: Brouwerian Intuitionism**
      *   *Most Awkward Commitment:* You must accept free choice sequences that defy law-like definition to secure the continuity of all functions.
  *   **No:** $\rightarrow$ Go to **Question 8**.

  ### 8. May one quantify over all sets, or only over sets definable by some specified procedure (or Types)?
  *   **Definable Procedures / Types:** $\rightarrow$ **Leaf: Type-theoretic Constructivism (Martin-Löf)**
      *   *Most Awkward Commitment:* Universe hierarchies can feel ad hoc to avoid paradoxes while maintaining predicativity.
  *   **Sets (Constructive Membership):** $\rightarrow$ Go to **Question 9**.

  ### 9. Is intuitionistic logic the correct logic of what can be verified, rather than a restriction adopted for convenience?
  *   **Yes (Logic of Verification):** $\rightarrow$ **Leaf: Verificationist Intuitionism**
      *   *Most Awkward Commitment:* You tie mathematical truth tightly to epistemic capacity, risking a collapse into idealism.
  *   **No (Pragmatic Restriction):** $\rightarrow$ **Leaf: Bishop-style Constructive Analysis**
      *   *Most Awkward Commitment:* You must treat many classical theorems as meaningless rather than false, requiring extensive redefinition of analysis.

  ---

  ### **Meta-Analysis of the Tree**

  **Unoccupied Combinations:**
  1.  **Classical Logic + No Witness:** Marked **Incoherent**. A constructive stance requires witness extraction; without it, one is simply a classical mathematician who doubts DNE, which is logically unstable.
  2.  **Classical Logic + No Non-constructive AC:** Filled by **Predicativism**.
  3.  **Classical Logic + Universal Truth + Full AC:** Marked **Unattractive**. This is standard ZFC Platonism, which is the starting point of the tree, not a destination for a unit on *constructive* mathematics.

  **Indistinguishable Leaves:**
  *   **Bishop-style Constructive Analysis** and **Type-theoretic Constructivism (Martin-Löf)**.
  *   **Reason:** While separated in the tree by the "Sets vs. Types" node (Question 8), these positions share identical logical commitments regarding DNE, Witnesses, Disjunction, Halting, and IVT.
  *   **Separating Question:** "Is the foundation of mathematics an informal axiomatic set theory or a formal type theory with explicit formation rules?" (This is a foundational/syntactic distinction rather than a purely logical commitment).

  **Node Coverage:**
  All eight required commitment nodes are utilized in the decision path:
  1.  Double Negation Elimination (Q1)
  2.  Axiom of Choice (Q2)
  3.  Logic Universality (Q3)
  4.  Existential Witness (Q4)
  5.  Disjunction Property (Q5)
  6.  Halting Inference (Q6)
  7.  Intermediate Value Theorem (Q7)
  8.  Quantification Scope (Q8)
  *(Note: Question 9 utilizes the Verificationist commitment from the leaf requirements to ensure the final split is philosophically grounded.)*
