answer: |-
  This is a sophisticated mandate. You are grappling with the "boundary problem" of democratic theory (who constitutes the *demos*), but you are constrained by the realities of municipal law, administrative capacity, and political viability. With one researcher and eighteen months, you cannot solve the philosophical paradoxes; you must resolve the *justiciability* and *implementability* of them.

  Your four labels (Personal, Jurisdictional, Issue-specific, Temporal) are excellent heuristic tools. However, for a Charter Commission, they must be reordered based on **legal constraint** and **administrative burden**.

  Here is the prioritized agenda, ordered by upstream dependency.

  ### Priority 1: The Legal Ceiling (State Preemption)
  **Question:** *Does state election code or constitution prohibit the changes we are contemplating?*
  **Dimension:** Personal & Jurisdictional.

  *   **Why it is upstream:** This is the "can we?" before the "should we?" In most U.S. states, cities are creatures of the state. If state law defines "qualified elector" as a U.S. citizen, your commission cannot recommend noncitizen voting without simultaneously recommending a state constitutional amendment or seeking a home-rule exemption. If state law dictates how annexation votes are conducted, your local charter cannot override it.
  *   **Tractability:** High. This is legal research, not philosophy. Your researcher can query state statutes, attorney general opinions, and case law. This yields binary answers (permitted/prohibited) that define the sandbox for all other work.
  *   **Agenda Triggers:**
      *   *Move Up:* A neighboring municipality successfully implements noncitizen voting or a new state bill expands home-rule powers.
      *   *Move Down:* A definitive Attorney General opinion or state court ruling clarifies preemption. If the door is locked, you stop picking the lock.

  ### Priority 2: The Procedural Lock (Who Ratifies the Charter?)
  **Question:** *Who is eligible to vote on the Charter amendments themselves?*
  **Dimension:** Personal & Meta-Demos.

  *   **Why it is upstream:** You mentioned the proposal to "submit the franchise question itself to a vote of the currently enfranchised." This creates a circularity: the current *demos* decides the future *demos*. You must decide this *before* drafting the ballot language for any other change. If you recommend noncitizen voting, but the state requires only citizens to vote on the charter amendment, you face a legitimacy crisis. You need to determine if the ratification electorate matches the proposed future electorate.
  *   **Tractability:** Medium. This requires analyzing state codes on charter adoption. It is politically sensitive but legally definable.
  *   **Agenda Triggers:**
      *   *Move Up:* If legal counsel advises that expanding the franchise requires a supermajority of the *current* electorate, this becomes the central strategic bottleneck.
      *   *Move Down:* If state law mandates a standard "registered voter" baseline for all charter elections, your discretion is removed, and this becomes a compliance check rather than a policy choice.

  ### Priority 3: The Fiscal Boundary (Debt & Annexation)
  **Question:** *Can residents who do not vote on a bond issue be legally bound by its debt?*
  **Dimension:** Jurisdictional & Temporal.

  *   **Why it is upstream:** This is your highest legal liability. Courts are generally more protective of property rights (taxation/debt) than franchise rights. If you annex an area and bind them to debt they didn't vote on, you invite litigation under "taxation without representation" doctrines. This must be settled before you finalize boundary maps or budget projections.
  *   **Tractability:** High. There is substantial case law on municipal debt and annexation. Your researcher can look for "special benefit" doctrines or state statutes regarding debt assumption in annexation.
  *   **Agenda Triggers:**
      *   *Move Up:* A lawsuit against a neighboring city regarding annexation debt.
      *   *Move Down:* If the city attorney confirms that state municipal code provides a "safe harbor" for annexation debt assumptions, this becomes a standard procedural matter.

  ### Priority 4: The Personal Boundary (Noncitizen Franchise)
  **Question:** *Should lawful permanent residents (or all residents) vote in local elections?*
  **Dimension:** Personal.

  *   **Why it is here:** This is the most politically visible issue, but it is downstream of Priorities 1 and 2. If state law allows it (P1) and you have a mechanism to ratify it (P2), *then* you debate the normative merits. Placing this first wastes time on a debate that might be legally moot.
  *   **Tractability:** Medium. Your researcher can compile comparative data from the few U.S. municipalities that allow this (e.g., Takoma Park, MD; San Francisco school board). The challenge is not data, but political consensus.
  *   **Agenda Triggers:**
      *   *Move Up:* A demographic shift showing a large bloc of noncitizen residents, or a political coalition making this a condition of their support.
      *   *Move Down:* Public polling indicates this is a "poison pill" that would cause voters to reject the entire charter package.

  ### Priority 5 (Defer): Issue-Specific and Temporal Boundaries
  **Question:** *Should we have different electorates for different issues, or bind future generations?*
  **Dimension:** Issue-Specific & Temporal.

  *   **Why Defer:** These are administratively nightmarish and theoretically fraught.
      *   *Issue-Specific:* Creating different voter rolls for schools, bonds, and zoning is a logistical burden most election administrators will reject. It fragments the *demos* and complicates the "one person, one vote" principle.
      *   *Temporal:* You cannot give the unborn a vote. You can only appoint trustees (e.g., a sustainability commission) to represent future interests. This is a governance structure question, not a boundary question.
  *   **Tractability:** Low. There are few successful models of issue-specific franchises in U.S. municipal law.
  *   **Agenda Triggers:**
      *   *Move Up:* If a specific crisis (e.g., a massive infrastructure project affecting only one neighborhood) demands a novel governance solution.
      *   *Move Down:* If the election administrator advises that multiple voter rolls are technically infeasible within the budget.

  ---

  ### Theoretically Prominent, Practically Quiet
  These are questions that dominate political philosophy seminars but should not consume your commission's time.

  **1. The "All-Affected" vs. "All-Subjected" Distinction**
  *   *Theory:* Philosophers debate whether the *demos* should include everyone *affected* by a decision (potentially global) or everyone *subjected* to the coercion of the law (residents).
  *   *Practice:* For a city, "residency" is the functional proxy for both. Expanding beyond residency (e.g., allowing commuters to vote) creates administrative chaos regarding verification. Stick to residency as the bright line; refine the definition of residency, not the principle.

  **2. The Rights of the Dead (Intergenerational Justice)**
  *   *Theory:* Do past generations bind us (via historic preservation, perpetual trusts)?
  *   *Practice:* Unless your city is managing specific perpetual endowments or historic covenants, this is rhetorical. The legal mechanism is not voting rights for the dead, but supermajority requirements for charter amendments. Handle this via *amendment thresholds*, not *demos boundaries*.

  **3. The Ideal "Demos" Construction**
  *   *Theory:* What is the morally perfect boundary?
  *   *Practice:* You are operating in non-ideal theory. You are bound by state law, budget, and existing administrative capacity. A recommendation that is philosophically perfect but legally preempted or administratively impossible is a failure of the commission.

  ### Strategic Advice for Your Researcher
  Given the 18-month timeline and single-staff constraint, instruct your researcher to adopt a **comparative legal approach** rather than a theoretical one.

  1.  **Months 1-3:** Map the State Constraints. (Priority 1). If the state says "no," the commission moves to lobbying the state legislature, not rewriting the charter.
  2.  **Months 4-9:** Draft the "Ratification Clause." (Priority 2). Determine who votes on the charter. This locks in the political coalition.
  3.  **Months 10-15:** Draft the Annexation/Debt provisions. (Priority 3). Ensure legal immunity.
  4.  **Months 16-18:** Polish the Noncitizen Voting language (if legal) and public messaging. (Priority 4).

  **Final Warning:** The most dangerous trap is the "Meta-Vote." If you propose that *current* voters decide whether *noncitizens* can vote, be prepared for the argument that the current voters have a conflict of interest (diluting their own power). If you propose that the *Commission* decides, you face accusations of elitism.
  *Recommendation:* Frame the ratification electorate not as "judging the worthiness" of new voters, but as "approving the administrative capacity" to manage a broader electorate. It shifts the debate from rights to logistics, which is more tractable for a charter commission.
