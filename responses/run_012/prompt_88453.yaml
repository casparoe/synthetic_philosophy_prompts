  In the Philosophy Department at State University, exactly seven faculty members currently hold the title "Curriculum Convener." Department bylaws stipulate that any faculty member who has taught at least four distinct courses in the preceding academic year must be appointed a "Curriculum Convener," and further specify that only those holding this title may access the scheduling software. A review of registrar data confirms that the set of faculty who taught four courses and the set of faculty with software access are identical. The software access is granted via a digital key issued by the department chair that derives its validity from the current bylaws, while the record of having taught four courses is maintained by the central university registrar based on classroom assignment logs and student enrollment figures. The chair issues the digital key only upon verifying the registrar's logs, but the logs themselves are generated by the physical occurrence of classes meeting and students enrolling, processes that are recorded independently of the department's internal title assignments.

  **Analysis**

  **1. Sense of Construction and Reasoning**
  *   **Kind 1: "Curriculum Convener"** satisfies the **constitutive** sense of social construction. The property of being a Convener is ontologically dependent on the department's collective acceptance of the bylaws. The digital key functions as access *only because* the institution counts it as such; if the department voted to abolish the title and the bylaws, the property "Curriculum Convener" would cease to exist entirely, even if the same seven individuals continued to teach.
  *   **Kind 2: "Four-Course Teacher"** satisfies the **merely causal** sense of social construction. While "teaching a course" is itself a social practice, the property of *having taught four* is grounded in the behavioral history recorded by the registrar. The department's practice of appointing Conveners causally shapes who gets the title, but it does not constitute the underlying labor record. If the Convener practice stopped, the fact that these seven individuals taught four courses would remain true, as it is grounded in the enrollment logs and classroom occurrences rather than the title itself.

  **2. The Separating Feature**
  The single feature doing the work is the **direction of fit between the institutional rule and the property**. For the Convener, the rule creates the property (world-to-word direction of fit: the bylaws make it so). For the Four-Course Teacher, the property triggers the rule (word-to-world direction of fit: the logs verify the status). The Convener status exists *in virtue of* the declaration; the Teaching Record exists *in virtue of* the labor, which the declaration merely tracks.

  **3. Removal of the Feature**
  If this feature is removed—for instance, if the department bylaws were changed so that the registrar's logs *themselves* were defined by the chair's declaration (i.e., a course counts as taught only if the chair says it does)—the two kinds would collapse into **one constitutive kind**. Both the title and the teaching record would then depend entirely on the department's ongoing normative practice, eliminating the independent factual ground that currently distinguishes the causal kind.

  **4. Naturalist Objection and Constructionist Defense**
  *   **Naturalist Attack:** A thoroughgoing naturalist would argue that the distinction is illusory because both kinds reduce to physical states. The "Convener" is just a person with a digital keycard (physical object) and the "Teacher" is just a person who occupied a room (physical location). The naturalist claims that "validity" and "bylaws" are just epiphenomenal descriptions of causal interactions; there is no ontological difference between the keycard working and the class occurring, as both are merely physical events in a causal chain.
  *   **Constructionist Defense:** To hold the line, the constructionist must appeal to **deontic powers** rather than physical properties. The defense argues that the naturalist description misses the normative layer: the keycard grants a *right* to schedule, and the bylaws create an *obligation* to recognize the Convener. These rights and obligations exist only within the institutional framework. The constructionist would point out that the naturalist cannot explain why the keycard fails to grant access if the bylaws are repealed (even if the physical card remains identical), whereas the teaching record remains valid even if the department dissolves. The distinction holds because one kind carries institutional powers that vanish without collective recognition, while the other tracks a history of interaction that persists independently of that specific recognition.
