  **Credence: 0.25**

  **Derivation:** The probability is derived from a weighted assessment of the six decomposed components plus one critical omitted term (Chronology). While the diary is authentically Frege's and offers interpretive context, the causal and normative link to his core logical doctrines is attenuated by the temporal gap and the autonomy of logical validity. The figure represents a moderate endorsement of contextual relevance without accepting the strong deterministic "bridging thesis."

