prompt: |-
  I worked at a big logistics company that had an anti-corruption policy I could never make sense of. Cash and gift cards were banned outright. But a supplier could take you to dinner, give you a bottle of whiskey, or pay for a hunting weekend, as long as it was customary and under a dollar cap that each local office set for itself. There was also a line for small payments to customs officers to speed up paperwork; officially banned, but logged as expediting fees, and nobody ever got fired. And the training said corruption is about intent to influence, while also saying some gifts are just relationship-building and refusing them would insult the giver. The disclosure form made it worse: if you logged a gift, it was fine; if you didn't, it was corruption. What view of corruption does a policy like this actually presuppose? Is it that corruption is improper influence, or secrecy, or breaking the local rules of the game, or treating public office as private property? Does it quietly assume a Western split between business and government that doesn't hold everywhere? Which parts of the policy really need that view, and which would survive under a few different views? And if you swapped it for a view where corruption is just whatever the local community calls corrupt, or one where it's any departure from impartial role obligations, what would the policy have to change?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Scenario:**

      *   **Context:** A large logistics company with an anti-corruption policy.
      *   **Key Policy Features:**
          *   Cash/Gift Cards: Banned outright.
          *   Hospitality (Dinner, Whiskey, Hunting): Allowed if "customary" and under a local cap.
          *   Customs Payments: Officially banned, but logged as "expediting fees," tolerated, no firings.
          *   Training Logic: Corruption = intent to influence *BUT* some gifts = relationship building (refusal = insult).
          *   Disclosure Mechanism: Logged = Fine; Unlogged = Corruption.
      *   **User's Questions:**
          *   What view of corruption does this policy *actually* presuppose?
          *   Is it improper influence, secrecy, breaking local rules, or public office as private property?
          *   Does it assume a Western business/government split?
          *   Which parts depend on that view vs. survive under others?
          *   How would the policy change under alternative views (local community standards vs. impartial role obligations)?

  2.  **Analyze the "Actual" Presupposed View:**

      *   *Observation:* The policy is contradictory on the surface (ban vs. allow) but consistent in practice.
      *   *Key Mechanism:* Disclosure/Logging. If you write it down, it's legit. If you hide it, it's corrupt.
      *   *Key Mechanism:* Local Custom. If everyone does it (hunting, dinner), it's okay.
      *   *Key Mechanism:* Plausible Deniability/Pragmatism. "Expediting fees" are known bribes but tolerated for operational efficiency.
      *   *Conclusion:* This isn't a principled stand against *influence*. It's a stand against *unmanaged risk* and *individual enrichment*. It presupposes corruption is **Secret, Unauthorized Private Gain** (or Liability). It's a compliance/risk management view, not an ethical view.
      *   *Western Split?* Yes, it tries to maintain a formal separation (policy says no bribes) while acknowledging the reality of entanglement (expediting fees).

  3.  **Evaluate the Candidate Definitions of Corruption:**

      *   *Improper Influence:* The policy contradicts this. Hunting weekends *are* intended to influence, but allowed.
      *   *Secrecy:* This fits best. Disclosure sanitizes the act.
      *   *Breaking Local Rules:* Contradicted by the "expediting fees." Those break local laws (usually) but are allowed by company policy.
      *   *Public Office as Private Property:* (Nye's definition). This fits the cash ban (don't pocket the money) but fails on the hospitality (using office for relationship building).
      *   *Impartiality:* Contradicted by the "relationship building" exception.

  4.  **Analyze the "Western Split" Assumption:**

      *   The policy assumes a formal distinction between "business expense" and "bribe."
      *   However, it acknowledges that in many jurisdictions, the state (customs) is an obstacle to be greased, not a neutral regulator.
      *   It assumes the *company* has the authority to define legitimacy via logging, overriding local law (on expediting) or universal ethics (on influence).

  5.  **Determine Which Parts Survive Under Different Views:**

      *   *Cash Ban:* Survives almost everywhere (too traceable, too personal).
      *   *Disclosure:* Central to the "Secrecy" view. Less relevant to "Impartiality" (if it's wrong, logging it doesn't make it right).
      *   *Local Caps:* Relies on "Customary" view. Fails under "Universal Impartiality."
      *   *Expediting Fees:* Relies on "Pragmatic/Business Continuity" view. Fails under "Rule of Law" or "Impartiality."

  6.  **Develop Alternative Policy Scenarios:**

      *   *Scenario A: Corruption = Whatever the Local Community Calls Corrupt.*
          *   Change: Remove global caps. Align entirely with local norms. If bribes are standard, make them standard.
          *   Risk: Violates FCPA/UK Bribery Act (global laws).
      *   *Scenario B: Corruption = Departure from Impartial Role Obligations.*
          *   Change: Ban all hospitality that creates reciprocity. Ban expediting fees entirely. Strict separation.
          *   Risk: Business stops moving in certain regions.
      *   *Scenario C: Corruption = Secret/Private Gain (The Current "Real" Policy).*
          *   Change: Double down on disclosure. Make everything transparent.

  7.  **Synthesize and Structure the Answer:**

      *   **Introduction:** Acknowledge the cynicism/astuteness of the observation. This is a classic "Compliance vs. Ethics" gap.
      *   **The Actual Presupposition:** Identify it as **Procedural Legitimacy & Risk Management**. Corruption = Undisclosed Liability.
      *   **Deconstructing the Definitions:** Go through the user's list (Influence, Secrecy, Local Rules, Private Property) and grade them against the policy.
      *   **The Western Split:** Discuss the Public/Private distinction and how the policy navigates (or fails) it.
      *   **Component Analysis:** Which parts rely on which view? (e.g., Disclosure relies on Secrecy view).
      *   **Alternative Views & Policy Shifts:**
          *   *Local Relativism:* Policy becomes a mirror of local practice.
          *   *Impartiality:* Policy becomes zero-tolerance.
      *   **Conclusion:** Summarize the tension between *legal compliance* (FCPA) and *operational reality*.

  8.  **Refine the Analysis (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful about the "Expediting Fees." In some jurisdictions (like the US FCPA), "facilitation payments" *were* historically exempted (though this is changing). The policy might be leveraging that legal loophole while calling it "officially banned" internally to look good. I should mention the legal dimension (FCPA/UK Bribery Act).
      *   *Nuance:* The "Logging" aspect is crucial. It transforms a personal favor into a corporate asset. That's a key insight. If the company knows about the whiskey, the company "owns" the relationship, not the employee.
      *   *Tone:* Keep it analytical, slightly critical but understanding of the corporate reality. Avoid moralizing; focus on organizational theory and political science definitions of corruption.

  9.  **Final Polish:** Check against all parts of the user's prompt.
