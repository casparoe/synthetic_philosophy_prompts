answer: |-
  The heat in the valley was a physical weight, pressing the scent of warmed pine and drying clover into the dust. It was the kind of afternoon that made the air shimmer above the asphalt, and in the apiary, it made the air vibrate. Three people stood around Hive Four, a wooden box painted white that hummed with the energy of sixty thousand insects.

  Martha, who had kept bees since before her daughter was born, stood closest to the entrance. She wore a veil but no gloves; she liked to feel the air around them. She was listening. To her, the sound wasn't just noise; it was a mood. The hum had a jagged edge today, a restless piping that sounded less like work and more like argument.

  Ten feet away, Elara stood with a tablet strapped to her forearm. Wires ran from the device into the hive through a modified entrance slot. She wasn't listening; she was watching columns of numbers scroll. Humidity: 58%. Internal temperature: 34.5 degrees Celsius. Nasonov pheromone concentration: baseline. To Elara, the hive was a machine regulated by homeostasis. If the variables stayed within the green bands on her screen, the system was stable.

  Leaning against the fence post at the edge of the yard was Leo. He was nineteen, hired for the summer because he had strong backs and didn't ask questions. He wasn't looking at the hive, or the tablet. He was watching the bees themselves, specifically the way they hung off the front board. A beard of idle workers draped over the entrance, thick and still.

  "They're going," Leo said. He didn't look up from the fence.

  Elara tapped her screen. "The pheromone levels haven't spiked. The temperature isn't critical. There's no data to support a swarm event before Friday."

  "Look at the beard," Leo said. "It's hanging low. When they hang low, they leave."

  "It's just ventilation," Elara countered, her voice tight. "They're cooling the box. The algorithm accounts for thermal bearding."

  Martha stepped closer to the entrance, the smoke from her canister drifting cold and white. "They aren't hot," she said quietly. "They're nervous. They feel crowded. They know the queen is running out of space."

  "They don't *feel* anything, Mom," Elara said. "They're reacting to chemical gradients."

  "Then why do they sound like they're arguing?" Martha asked.

  "Acoustic byproducts of wing movement," Elara said, though she didn't look up from the scrolling data.

  Leo pushed off the fence. "I'm getting the box. And the net. Give it twenty minutes."

  "If you set up equipment based on a heuristic without statistical significance, you're wasting labor," Elara said.

  "If I wait for your statistics, the branch will break," Leo said. He walked toward the shed where the swarm capture gear was kept.

  Martha watched him go, then looked back at the hive. The hum pitched higher. She felt a prick of irritation, sharp and personal. She had fed them through the winter. She had treated them for mites when the neighbors lost their colonies. She had given them shelter, and this was how they replied? By leaving when the honey flow was just starting. It felt like betrayal. It felt like ingratitude.

  "Elara," Martha said. "If they go, we lose the season."

  "They won't go," Elara said. "The model is robust."

  Ten minutes later, the air changed. It wasn't a sound, but a absence of sound, followed by a roar. The beard of bees lifted off the board in a single dark ribbon. They spiraled up into the heat haze, a living tornado finding the sun.

  Elara stared at her tablet. The numbers were still green. The sensors inside were now reading empty air. "That's impossible," she whispered. "The thresholds weren't met."

  Leo was already moving, shaking the sheet out on the ground, holding the net ready, though he knew he was too late for the main cluster. They were heading for the oak tree, high up, beyond the reach of the pole.

  Martha stood still, watching the sky empty out. The resentment hardened in her chest. It wasn't just loss; it was disobedience. They had chosen to leave. They had chosen to ignore the care she provided. If they were just machines, broken by heat, she wouldn't feel angry. You don't get angry at a tractor for stalling. But because she saw them as agents, capable of choice, she felt owed something they had refused to give.

  "They knew," Martha said. Her voice was flat. "They knew we needed them."

  "They're insects, Mom," Elara said, her voice shaking as she disconnected the wires. "It's a biological imperative. Not a decision."

  "It's a choice," Martha said. "And they chose wrong."

  That evening, after the sun had dropped behind the ridge and the air cooled, Martha went back to the yard. The swarm was gone, settled high in the oak where they couldn't be reached. Hive Four was quiet, holding the remaining workers and a new queen cell that had been sealed in the haste.

  Elara was in the barn, recalibrating her sensors, trying to find the variable she had missed. Leo was asleep in the bunkhouse. Martha stood over the remaining hives, holding her hive tool. She moved to Hive Six, a strong colony that was also building swarm cells.

  She opened the lid. The bees rushed up, agitated. She found the queen, a large, marked dot moving through the chaos. In the past, Martha would have split the colony, giving them more space, accommodating their desire to grow. That was the design stance: fix the capacity, fix the output. But tonight, the intentional stance held her. They were selfish. They couldn't be trusted to stay if given the chance.

  She didn't make more space. Instead, she pinned the queen gently against the frame. She took her shears.

  If they wanted to leave, she would take away their ability to organize the departure. It was a punishment, disguised as management. She clipped one of the queen's wings. A small mutilation. It wouldn't kill her, but it would ground her. If the queen couldn't fly, the swarm couldn't leave. They would be forced to stay. They would have to obey.

  She closed the lid and went to the house.

  Two days later, the colony in Hive Six went silent.

  Elara found her there, kneeling in the grass. The entrance was quiet. No pollen coming in. No guards standing watch.

  "What happened?" Elara asked.

  Martha didn't look up. "They killed her."

  "The queen?"

  "Yes. They sensed she was damaged. Or maybe they just decided she was no longer useful. They superseded her. But in the confusion, the new queen couldn't mate. Or maybe she flew and didn't come back." Martha stood up, brushing dirt from her knees. "Now the colony is queenless. They'll lay workers. They'll dwindle. They'll die by winter."

  "Did the sensors pick up aggression?" Elara asked. "Maybe there was a pathogen."

  "There was no pathogen," Martha said. "I clipped the wing."

  Elara looked at her mother, really looked at her, for the first time in weeks. "Why would you do that? The data said they were stable. You could have split them."

  "They weren't stable," Martha said. "They were ungrateful."

  "That's not a variable, Mom."

  "It is to me."

  Leo walked up from the lower field. He looked at the quiet hive, then at Martha's hands. He didn't ask what happened. He knew the look of a dead colony. He looked at the ground, then at the oak tree where the other swarm was still hanging, out of reach.

  "My rule works on the leaving," Leo said softly. "Doesn't mean I know what happens after."

  "So nobody knows," Elara said. She looked at her tablet, then at the dead hive, then at the oak tree. "The data missed the swarm. The rule missed the survival. And..." She looked at her mother. "And you broke them."

  "I tried to keep them," Martha said.

  "You tried to make them stay," Elara corrected. "There's a difference."

  The three of them stood in the row of white boxes. The heat had broken, and a cool wind was coming down from the ridge. It rustled the leaves of the oak tree, where the stolen bees were building comb in the hollow of a branch, safe and wild. In the box at their feet, the bees were milling aimlessly, waiting for a leader who would never return.

  Martha reached out and touched the wood of Hive Six. It felt cold. She had treated them like people, and they had died like insects. Elara had treated them like machines, and the machine had walked away. Leo had treated them like a weather system, and he had been right about the storm, but wrong about the shelter.

  The wind picked up, carrying the scent of sage. It didn't care which of them was right. It only cared that the boxes were empty.

  A pattern is real only when the cost of ignoring it exceeds the cost of believing it.

  \answer{stance-dependent}
