prompt: |-
  My flatmate and I just spent three hours arguing about voting and got absolutley nowhere, and now I want to turn the arguement into a class activity. The fight was this: I said voting for the lesser evil is just what having a vote means, and he said no, that to vote for the lesser evil you have to actually *want* the lesser evil to win, and wanting that is already a small corruption of yourself, and if you vote for it while hoping it loses you're lying to the ballot box. He also kept saying that the strategic voter is acting as a proxy for people who never consented to be represented that way, which I think is him being dramatic but maybe not wrong. We couldn't settle it because we kept imagining different scenarios.

  Anyway — second-year ethics seminar, 18 students, 75 minutes. I want them to walk into the split themselves, no lecture up front, and I want the split to be three ways: voting as duty, voting as expression, voting as lesser-evil calculation. And I want the proxy/complicity thing and the "do you have to want it" thing to actually bite rather than be something I say at the end.

  Rough plan, rip it up as you like:

  Round 1 — they're the electorate. Three candidates with short policy profiles: one competent but callous, one openly dangerous, one genuinely decent but polling around 5%. Each student also gets a private stake card saying something personal that hangs on the outcome (a job, a visa, a sibling's healthcare) so the tradeoff isn't bloodless. Everyone fills in a secret true-preference card: rank the three, one sentence why.

  Round 2 — secret plurality vote, I tally it. Then I reveal national polling: dead heat between callous and dangerous, decent one can't win. Vote again. Anyone who switches off their stated true preference has to stand up, justify it in one sentence, and take questions from the room.

  Round 3, the bit I'm unsure about — I want "your vote was never going to be decisive" to land without it becoming a probability lecture. My idea: after the second vote I open a sealed envelope naming which single ballot was the pivotal one, and ask that person whether they still defend their vote. Might be too cute.

  What I need: a runnable version — rules, materials, the stake cards, a 75-minute timeline, and how to stage the second vote so it actually bites. A debrief mapping what happened onto the three positions and onto the proxy/complicity objection and the "you have to want it" objection. Tell me what will predictably go wrong the first time — I've run forced-choice stuff before and there's always one student who refuses to play, and I'd like to use that rather than fight it. And be straight with me about which part of the idea the game can't reproduce and I'll have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Second-year ethics seminar, 18 students, 75 minutes.
      *   **Topic:** Voting ethics (Duty vs. Expression vs. Lesser-Evil/Strategic).
      *   **Core Conflict:** The user's argument with their flatmate.
          *   User: Voting for lesser evil *is* what voting means.
          *   Flatmate: Voting for lesser evil requires *wanting* them to win (corruption of self); voting while hoping they lose is lying. Strategic voting acts as a proxy for non-consenting others.
      *   **Goal:** Turn the argument into a class activity. No lecture up front. Students must experience the split.
      *   **Specific Requirements:**
          *   Three voting positions (Duty, Expression, Calculation).
          *   Address "proxy/complicity" and "do you have to want it" objections viscerally.
          *   Refine the user's rough plan (Round 1: Electorate/Stakes, Round 2: Vote/Justify, Round 3: Pivotal Vote).
          *   Provide: Runnable rules, materials, stake cards, timeline, staging advice, debrief mapping, prediction of failures (including the refuser), and limitations of the simulation.

  2.  **Evaluate the User's Rough Plan:**
      *   *Round 1 (True Preference + Stakes):* Good. Creates personal investment.
      *   *Round 2 (Secret Vote + Reveal + Switchers Stand):* Strong dramatic tension. "Stand up and justify" is high pressure, good for ethics.
      *   *Round 3 (The Pivotal Envelope):* *Critique:* This is the weak point. Mathematically, in a class of 18, the probability of a single vote being pivotal is effectively zero, but declaring one *is* pivotal is artificial. If you pick one at random, it feels like a trick. If you rig the count to make one pivotal, it feels manipulative. *Better approach:* Make the "proxy" argument the focus here. The "pivotal vote" idea is too cute/gimmicky. Instead, focus on the *outcome* affecting the stakes of those who voted differently.
      *   *Timing:* 75 minutes is tight for three rounds + debrief. Need to be disciplined.
      *   *The "Refuser":* Need a specific strategy for the student who says "this is stupid/I won't play."

  3.  **Develop the Solution (Iterative Design):**

      *   **Theme:** Keep the "Three Candidates" setup but make the policies distinct enough to trigger the ethical dilemmas.
          *   Candidate A (The Decent/Unviable): High moral ground, low viability.
          *   Candidate B (The Competent/Callous): Economic stability, harsh social policy.
          *   Candidate C (The Dangerous/Charismatic): Populist, risky, potentially authoritarian.
      *   **The "Stake Cards":** Need to ensure some students have stakes tied to Candidate B or C, not just A. This forces the "lesser evil" calculation. If everyone's stake depends on A winning, everyone just votes A. The conflict arises when my stake requires B, but my conscience wants A.
      *   **Round 3 Revision:** Instead of a "pivotal ballot," let's use the "Proxy/Complicity" mechanic. If the "Dangerous" candidate wins, everyone suffers, but those who voted "Decent" contributed to it. Those who voted "Callous" stopped it but enabled callousness.
      *   **Addressing the Flatmate's Argument:** The "Do you have to want it?" question needs to be explicit in the debrief. The "Proxy" argument needs to be highlighted when students justify their switch.

  4.  **Drafting the Plan (Section by Section):**

      *   **Title:** Needs to be catchy but academic. "The Ballot and The Stain."
      *   **Materials:** Cards, envelopes, board.
      *   **Timeline:**
          *   0-5: Setup (No lecture).
          *   5-20: Round 1 (Stakes + True Preference).
          *   20-35: Round 2 (The Strategic Vote + The Stand).
          *   35-50: Round 3 (The Outcome + The Consequence). *Changed from user's Round 3 idea.*
          *   50-75: Debrief (Mapping the theory).
      *   **The "Refuser":** Don't force them. Make them the "Election Observer." Their job is to note procedural integrity. This validates their skepticism while keeping them in the room.
      *   **The "Pivotal Vote" Fix:** The user's idea is indeed too cute. It breaks trust. Better to simulate the *outcome* based on the count, then ask the "Complicity" question. *Wait, I can salvage the "Pivotal" idea.* If I rig the count so the margin is 1 vote, then *every* voter in the winning margin is "pivotal." But singling one out is weird. Let's replace it with "The Coalition Demand." The winner demands a mandate. Did you give it?
      *   **Actually, let's look closer at the Flatmate's "Proxy" argument.** "You are acting as a proxy for people who never consented." This happens when I vote strategically to stop X, thereby deciding for others who wanted Y.
      *   **Revised Round 3:** "The Mandate." The winner claims a mandate based on the *strategic* votes. Do the strategic voters own that mandate?

  5.  **Refining the Ethics (The "Bite"):**
      *   To make the "do you have to want it" argument bite, the justification in Round 2 needs to be specific. "I voted for B to stop C." The class must ask: "Did you want B to win?" If they say "No," the Flatmate's argument activates: "Then you lied to the box."
      *   To make the "Proxy" argument bite: If B wins because of strategic voters, but B's policies hurt the "Decent" voters, the strategic voters imposed B on the Decent voters.

  6.  **Addressing Limitations:**
      *   Simulations can't replicate *scale* (anonymity of millions vs. 18 peers).
      *   Simulations can't replicate *time* (living with the outcome for 4 years).
      *   Simulations often gamify morality (winning the argument vs. finding truth).

  7.  **Finalizing the Plan Details:**
      *   *Candidates:*
          *   **Green (Idealist):** Universal care, green transition. (Polling 8%)
          *   **Blue (Technocrat):** Austerity, strict borders, stable markets. (Polling 46%)
          *   **Red (Populist):** Dismantle institutions, nationalist, volatile. (Polling 46%)
      *   *Stake Cards:* Mix them up. Some need Green to win (visa). Some need Blue (job). Some fear Red (safety).
      *   *The "Stand Up":* Crucial moment. Needs to be handled carefully so it doesn't become bullying.
      *   *The "Refuser":* Election Observer role is perfect.
      *   *Debrief:* Map Student arguments to Philosophical positions (Kantian/Expressive vs. Utilitarian/Consequentialist vs. Civic Duty).

  8.  **Review against Constraints:**
      *   75 mins? Yes, if timed strictly.
      *   18 students? Yes.
      *   No lecture up front? Yes.
      *   Address Flatmate's specific points? Yes, in debrief and Round 2 questioning.
      *   Fix Round 3? Yes, replacing the "envelope" with a "Mandate/Complicity" discussion based on the actual count.

  9.  **Self-Correction on Round 3:** The user liked the envelope idea. I should explain *why* it's risky but offer a modified version that keeps the drama without the deceit. *Decision:* Advise against the envelope (trust issue). Replace with "The Margin of Error." Reveal the count was close enough that *any* switcher changed the outcome. This achieves the "pivotal" feeling without lying about a specific name.

  10. **Final Polish:** Ensure tone is supportive but critical (as requested: "be straight with me").

  *(Self-Correction during drafting)*: Wait, if I tell them the polling *before* Round 2, everyone will just vote strategically. I need to make sure the "True Preference" card is collected *before* they see the polling.
  *Correction:* Round 1: Get Stake + True Preference (Secret). Round 2: Reveal Polling + Vote (Strategic). This creates the tension between Round 1 card and Round 2 action.

  Let's write it.cw
answer: |-
  This is a strong premise. You are trying to gamify the tension between **consequentialism** (outcomes matter most) and **deontology/expressivism** (the act itself must be morally clean). Your flatmate's argument is essentially a Kantian objection to instrumentalizing the vote, mixed with a concern about political legitimacy (the "proxy" problem).

  Your Round 3 idea (the sealed envelope) is the weak link. It relies on a gimmick that, if sensed as manipulative, destroys the trust needed for the ethics discussion. If you lie about the math, they will debate the lie, not the ethics.

  Here is a runnable, hardened version of your plan. It keeps the drama but grounds it in the actual count, and it weaponizes the "Refuser" rather than fighting them.

  ### Title: The Mandate Game
  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Room:** Seminar table or movable chairs.

  ### Materials Needed
  1.  **Candidate Cards (3):** Projected or printed.
  2.  **Stake Cards (18):** Envelopes, sealed. (See below for content).
  3.  **Ballot Slips (36):** Small slips of paper.
  4.  **Two Collection Boxes:** One labeled "True Preference," one labeled "Official Ballot."
  5.  **Whiteboard:** For tallying.

  ---

  ### The Candidates (Project on Board)
  *   **Candidate A (The Idealist):** Radical care reform, climate transition. **Polling: 6%.**
  *   **Candidate B (The Technocrat):** Market stability, strict borders, austerity. **Polling: 47%.**
  *   **Candidate C (The Populist):** Dismantle institutions, nationalist, volatile. **Polling: 47%.**

  *Note: B and C are in a dead heat. A cannot win mathematically.*

  ### The Stake Cards (Preparation)
  You need to ensure the "Lesser Evil" dilemma isn't uniform. If everyone fears C, everyone votes B. You need conflict.
  *   **12 Cards (The Vulnerable):** "Your sibling's visa status depends on Candidate A's policy. If A loses, they are deported. If B wins, they stay but suffer hardship. If C wins, they are deported immediately."
  *   **4 Cards (The Investors):** "Your retirement fund is tied to Candidate B's market stability. If B loses, you lose your pension. A or C winning ruins you."
  *   **2 Cards (The Safety):** "You live in a marginalized community. Candidate C has explicitly targeted your group. B is hostile, but C is dangerous."
  *   **1 Card (The Purist):** "You have no material stake. Your only concern is voting in alignment with your moral conscience."
  *   **1 Card (The Observer):** "You are an Election Observer. You do not vote. You monitor the integrity of the process and note any coercion." **(This is for your Refuser).**

  ---

  ### Timeline & Rules

  #### 0:00 – 0:05 | Setup (No Lecture)
  Hand out the Stake Cards. Tell them: *"Do not show your card to anyone. Read it. This is your life for the next hour."*
  Hand out two Ballot Slips to each voter (17 students). The Observer gets a notepad.
  **Rule:** Silence during voting. No collusion.

  #### 0:05 – 0:20 | Round 1: The Conscience Vote
  **Instruction:** *"On Slip 1, write the candidate you **truly want** to win. Put it in the 'True Preference' box. This will never be counted toward the outcome. It is for your record."*
  **Action:** Students write and deposit.
  **Why:** This creates the baseline for the "lying to the ballot box" accusation later.

  #### 0:20 – 0:35 | Round 2: The Strategic Vote
  **Instruction:** *"Look at the polling numbers. On Slip 2, write the candidate you are **actually casting** for the election. Put it in the 'Official Ballot' box."*
  **Action:** Students vote. You tally publicly on the board immediately.
  **The Twist:** The result will almost certainly show A (Idealist) collapsing, and a split between B and C.
  **The Stand:** Compare Slip 1 (collected earlier) to Slip 2.
  *   If a student voted A in Round 1 but switched to B or C in Round 2: **They must stand.**
  *   **The Question:** They must answer one question from the room: *"Did you vote for [Winner] because you wanted them to win, or only to stop the other?"*
  *   **Constraint:** They cannot say "It's complicated." Yes or No, then explain.
  *   **The Bite:** If they say "I didn't want them, I just stopped C," write their name on the board under "Instrumental Voters."

  #### 0:35 – 0:50 | Round 3: The Mandate (Replacing the Envelope)
  **Instruction:** *"The election is over. The Winner (let's assume B, the Technocrat) claims a mandate. They announce: 'The people have spoken. We are proceeding with austerity and strict borders.'"*
  **The Mechanic:**
  1.  Identify the **Margin of Victory**. (e.g., B won by 3 votes).
  2.  Identify the **Switchers** who voted B.
  3.  **The Complicity Prompt:** Ask the Switchers: *"Candidate B is now implementing policies that harm the students who voted A. You prevented C, but you enabled B. Do you consent to the harm B causes to your classmates?"*
  4.  Ask the **A-Voters**: *"You kept your hands clean. But because you refused to compromise, Candidate C was almost elected. Are you responsible for the risk you imposed on the class?"*

  #### 0:50 – 1:15 | Debrief & Mapping
  Do not lecture. Draw three columns on the board. Ask students to place their experience into the columns.

  **Column 1: Voting as Expression (The Purist)**
  *   *Core Idea:* The vote is a statement of self. To vote for what you hate is to corrupt the self.
  *   *Flatmate's Point:* "If you hope they lose, you are lying to the box."
  *   *Ask:* Did the "Instrumental Voters" feel dirty? Does integrity matter if the house burns down?

  **Column 2: Voting as Calculation (The Consequentialist)**
  *   *Core Idea:* The vote is a tool to minimize harm. The self is irrelevant; the outcome is all.
  *   *Your Point:* "This is just what having a vote means."
  *   *Ask:* Is it okay to use a person (Candidate B) as a means to an end? Is it okay to impose Candidate B on the "A-Voters" without their consent? (This hits the **Proxy** argument).

  **Column 3: Voting as Duty (The Civic Republican)**
  *   *Core Idea:* You vote to sustain the system, regardless of candidates.
  *   *Ask:* Did anyone vote just to keep the democracy running?

  **Closing the Flatmate's Loop:**
  Explicitly ask the class: *"One of you argued earlier that strategic voting makes you a proxy for people who didn't consent. Look at the 'Investors' (Stake Cards). Did the 'Vulnerable' students consent to the Technocrat winning? No. But the Investors decided for them. Is that democratic?"*

  ---

  ### What Will Predictably Go Wrong (And How to Fix It)

  **1. The Refuser**
  *   **Prediction:** One student will say, "This is reductive," or "I won't participate in a simulation of oppression."
  *   **Fix:** You already have the **Observer Card**. Hand it to them privately before class starts if you suspect it, or offer it in the moment. *"You don't have to vote. Your job is to ensure I, the instructor, don't rig the count. You are the audit."* This validates their skepticism and makes them essential to the game's integrity.

  **2. The "All Switch" Problem**
  *   **Prediction:** Everyone switches to B. No tension.
  *   **Fix:** If everyone switches, the debrief shifts. *"Everyone chose safety over integrity. Why? Was it the Stake Cards? If 100% of the electorate votes strategically, does the 'True Preference' box matter? Is democracy dead?"*

  **3. The "Bullying" Risk in Round 2**
  *   **Prediction:** Students grill the Switchers too hard. It becomes personal.
  *   **Fix:** You are the moderator. If it gets aggressive, intervene: *"Attack the logic, not the person. Ask: 'What principle justifies this?' not 'How could you?'"*

  **4. The Round 3 "Envelope" Trap**
  *   **Prediction:** You try to fake the pivotal vote. A math-major student notices the numbers don't add up.
  *   **Fix:** **Do not fake the math.** Use the actual margin. If B won by 5 votes, all 5 switchers are "complicit." If B won by 1 vote, the tension is natural. If B lost because too people voted A, then the A-voters are "complicit" in C's rise (if C was the danger). Let the real numbers dictate the guilt.

  ### What The Game Cannot Reproduce (Be Straight About This)
  In the debrief, you must admit the simulation's failures, or they will dismiss the lesson.
  1.  **Anonymity:** In class, they are voting in front of peers. Real voting is secret. The social pressure here is higher than in a booth.
  2.  **Scale:** In a class of 18, every vote *feels* pivotal. In a nation of millions, your vote is statistically nothing. This changes the "Duty" argument.
  3.  **Time:** They live with the result for 40 minutes, not 4 years. The "corruption of self" might feel worse over time.
  4.  **Information:** They know the polling is real (because you said so). In reality, polling is often contested.

  ### Why This Works for Your Argument
  *   **Your Point (Lesser Evil is Duty):** The "Investors" and "Vulnerable" students will naturally argue this. They *have* to vote B to survive. The game validates your view that survival trumps purity.
  *   **Flatmate's Point (Corruption/Proxy):** The Debrief Column 1 captures this. When the "Switchers" admit they didn't *want* B, the Flatmate's "lying to the box" argument lands. When the "Investors" realize they imposed B on the "Purist," the "Proxy" argument lands.

  ### Final Tip for the "Stand Up"
  Make sure you stand up with them if you are asking hard questions. Don't sit in the instructor chair while they sweat. Physically level the hierarchy. This is an ethics seminar, not an interrogation.

  **One last adjustment:** If the "Dangerous" candidate (C) actually wins because too many people voted for A (The Idealist), the lesson changes entirely. It becomes a lesson on the **cost of purity**. Be prepared to pivot the debrief if the math goes that way. That is actually a richer outcome for your flatmate's argument (i.e., "Your purity allowed the evil to win").
