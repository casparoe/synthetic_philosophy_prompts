answer: |-
  Let us begin by disentangling the objection itself, for you are quite right to suspect that two distinct threads are often knotted together.

  The 'separateness of persons' claim originates as a critique of utilitarianism. At its shallowest, it is a methodological objection: it claims that summing welfare across individuals is a category error. Society is not a super-organism; there is no 'social soul' that experiences the aggregate happiness. To treat the gain of one person as cancelling the loss of another is to pretend that the boundary between them does not exist.

  However, the deeper claim is moral, not merely mathematical. It is that persons are inviolable sources of claim. Because I am distinct from you, what happens to me matters uniquely to me. You cannot sacrifice me, or treat me as a means, simply because the sum total of welfare elsewhere is increased. The objection is not just that the math is wrong; it is that the individual has a status that forbids being traded off against others. In short: the first version says you cannot add us up; the second says you cannot spend us.

  Now, consider the 2020 crisis standards of care. We are in the realm of tragic choice: scarcity is real, and inaction is not an option. Someone will die whichever protocol you adopt. Does the separateness objection bite here?

  It does, but its bite changes shape depending on whether we look at the 'lives' criterion or the 'life-years' criterion.

  If the protocol says 'save the most lives' (two patients over one), this is aggregative. It counts persons. A strict separateness theorist might object that the one patient has a claim to rescue that is not negated by the existence of the other two. However, many philosophers grant that where claims are equal (all equally likely to die without intervention), saving the greater number is permissible, not because the sum is greater, but because it minimises the number of violated claims. You fail to rescue one person rather than two. The separateness objection is somewhat muted here, provided we are not actively killing the one to save the two, but merely allocating a scarce resource.

  The 'life-years' criterion is where the objection has real teeth. When you prioritise a 30-year-old over an 80-year-old because the former has more decades ahead, you are no longer counting persons; you are counting contents. You are treating the 80-year-old as a vessel containing less value than the 30-year-old. This violates the inviolability claim directly. It suggests that the 80-year-old's status as a person is diminished by their proximity to death. The separateness objection insists that each person is a distinct centre of worth, not a container of future time. To weigh their claims against each other using a metric of 'years remaining' is to commit the summing error across persons: it assumes the 30-year-old's future decades can morally outweigh the 80-year-old's present claim to life.

  This brings us to the ex ante and ex post distinction, which is indeed where the tangle often lies.

  Ex ante (before the crisis), one might argue that everyone would agree to a protocol that maximises life-years. We were all young once; we all hope to grow old. A rule that saves those with more life left might seem like a rational insurance policy for the whole population. From this viewpoint, the protocol respects everyone equally over the course of a lifetime.

  However, the separateness objection is primarily an ex post complaint. It speaks from the perspective of the identified victim in the bed. To the 80-year-old patient, the ex ante justification is cold comfort. They are not being treated as a participant in a fair scheme; they are being treated as a lesser claimant *now*. The objection insists that moral justification must hold for the individual facing the loss, not just for the population statistically. If the protocol tells the 80-year-old, 'Your life is worth less than hers,' it violates their separateness regardless of whether the rule was rational behind a veil of ignorance.

  So, what does this episode show about the objection itself? Does it survive contact with forced choice among identified victims?

  Honesty compels me to admit that the theory is strained here. The separateness of persons is most powerful in non-scarce contexts, where it forbids sacrificing one to save many. In triage, we are not usually sacrificing one to save many in the active sense; we are failing to save some because we cannot save all. The distinction between 'killing' and 'letting die' matters, and the objection loses some force when the alternative is not 'everyone lives' but 'who dies?'.

  However, the objection does not vanish. It survives by shifting its demand from outcome to procedure. If we cannot aggregate value (life-years) without violating personhood, and if we must choose between persons with equal claims to life, the separateness objection pushes us towards randomisation. A lottery respects the separateness of persons because it acknowledges that each claim is absolute and incomparable. You cannot weigh them, so you must give them equal chance.

  The episode reveals that the separateness objection is not merely a point about ordinary, non-scarce cases. It retains force in scarcity, but it exposes a limit in what ethical theory can do. It tells us what we cannot do (we cannot treat persons as containers of value to be maximised), but it does not necessarily tell us who to save when all options involve death. It suggests that when forced to choose between identified victims, we ought not to use a calculus that ranks their worth. We should, perhaps, flip a coin.

  There is silence in the theory, too. It does not easily resolve the tension between the duty to rescue the maximum number (lives) and the duty to respect each individual equally (lottery). In the wet lab, you seek a signal through the noise. In this corner of ethics, the separateness objection suggests that the 'life-years' metric is noise masquerading as signal. It looks like precision, but it is actually a category error. The 'lives' metric is more robust, but still aggregative. The objection survives, but it leaves us with a harder task: to make tragic choices without pretending they are arithmetic sums.
