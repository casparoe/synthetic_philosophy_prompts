      *   *Substantive:* Is there a real conflict? Yes, regarding which theorems are *acceptable*. Banach-Tarski isn't just "weird" to the constructivist; it's meaningless or false because the sets involved aren't constructible. The Analyst thinks the Constructivist is missing out on truth; the Constructivist thinks the Analyst is engaging in metaphysics masquerading as math.
