      *   *Ontology vs. Logic:* It's not just ontology (what exists); it's logic (what counts as proof). The Constructivist rejects LEM (Law of Excluded Middle) in infinite contexts, which is tied to AC.
      *   *Justification:* The user's hypothesis is mostly right. It's about *criteria for acceptance*.
      *   *Independence:* It renders the "Is AC true?" question ill-posed without specifying the background universe. It shifts the debate to "Which universe?"

