prompt: |-
  I'm a novelist, and I chair the grant committee of a small foundation set up by a writer who died in the nineties — the will says only that the money should go to work he would have approved of, which worked fine for twenty years because we all knew what he liked. Thursday we vote on a proposal to fund a serialized thriller, written with heavy help from an LLM, by a young writer who is openly building a brand. He would of loathed it: he was a stylist, he thought plot was for children and self-promotion was for hacks. But two trustees keep saying that's the wrong question, that we should fund what he'd have wanted if he'd known then what we know now and had actually thought it through, and I genuinely can't tell whether that's deep or whether it's just us putting our taste in a dead man's mouth. Draft the memo I'll circulate before the vote: a concrete recommendation with a deadline, criteria we can apply to this one and to the next one, and give the other side its best hearing — especially on how anyone is supposed to know what an idealized version of him wants, and whether that idealized man is still him or just a character we wrote. Don't bother looking up his books, we've all got them memorized.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Novelist and Chair of a grant committee for a small foundation.
      *   **Context:** The foundation was set up by a writer who died in the 90s. The will states money should go to work he "would have approved of."
      *   **Conflict:** A proposal for an LLM-assisted serialized thriller by a self-promoting young writer is up for vote.
      *   **The Dead Writer's Known Preferences:** Stylist, hated plot ("for children"), hated self-promotion ("for hacks"). He would have loathed this proposal.
      *   **The Dissenting Trustees' Argument:** We should fund what he *would have wanted* if he knew what we know now (LLMs, modern publishing landscape) and had thought it through. Is this deep wisdom or projecting our tastes onto a dead man?
      *   **Task:** Draft a pre-vote memo.
      *   **Requirements:**
          *   Concrete recommendation with a deadline.
          *   Criteria applicable to this and future proposals.
          *   Give the other side its best hearing (charitable interpretation of the "evolving intent" argument).
          *   Address the philosophical question: Is the idealized version still him, or a character we wrote?
          *   Tone: Professional, literary, thoughtful, decisive but open.
          *   Constraint: Do not look up his books (assume shared knowledge).

  2.  **Determine the Stance/Recommendation:**
      *   The prompt asks for a *concrete recommendation*. As Chair, I need to lead.
      *   *Option A: Reject.* Sticks to the literal will. Safe, but potentially stifling.
      *   *Option B: Approve.* Embraces the "evolving intent." Risky, might betray the founder's core values.
      *   *Option C: Reject this specific one, but revise criteria for the future.* This seems the most balanced. It acknowledges the dissenters' point (we need updated criteria) without violating the core spirit of the founder on a clear-cut case (LLM thriller by a self-promoter is the antithesis of a 90s stylist).
      *   *Decision:* Recommend rejecting *this* proposal but adopting a new framework for evaluating "approval" that accounts for the dissenters' arguments for *future* cases. This shows leadership and nuance.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the upcoming vote. State the purpose of the memo.
      *   **The Core Conflict:** Articulate the tension between "Literal Intent" (what he hated) vs. "Counterfactual Intent" (what he might accept now).
      *   **Giving the Other Side their Due:** This is crucial. I need to articulate the "Counterfactual" argument better than they might have.
          *   *Argument:* He valued vitality and relevance. If he saw LLMs as a tool rather than a crutch, or serialization as a return to Dickens rather than hackwork, would he object?
          *   *The Philosophical Hook:* Is the "Idealized Him" still him? Or is it a ventriloquist act? I need to pose this question seriously.
      *   **The Recommendation:** Vote NO on *this* specific proposal. Why? Because it violates too many core tenets simultaneously (style vs. plot, craft vs. automation, humility vs. branding). It's too extreme a test case for the new theory.
      *   **New Criteria (The Framework):** We need rules for the future so we aren't stuck in this loop.
          *   1. Craft Primacy (Human agency).
          *   2. Aesthetic Alignment (Style over commerce).
          *   3. The "Ghost Test" (Would he recognize himself in this?)
      *   **Deadline:** Set a time for the vote.
      *   **Closing:** A call to unity and respect for the legacy.

  4.  **Refining the Tone:**
      *   Needs to sound like a writer talking to writers. Not too corporate, but structured.
      *   Avoid jargon. Use literary metaphors if they fit.
      *   Respect the dead writer (let's call him "The Founder" or refer to him by name—since the prompt says "Don't bother looking up his books," I should probably use a placeholder like "[Founder's Name]" or just "he/him" to keep it universal, but "The Founder" feels too corporate. Let's use his initials or just "he." Actually, the prompt implies we know him well. I will use "he" and "his" to maintain intimacy).
      *   *Self-Correction on Tone:* The prompt says "Draft the memo I'll circulate." It needs to be ready to send. I should leave a placeholder for the name.

  5.  **Addressing the Specific Philosophical Prompt:**
      *   "Whether that idealized man is still him or just a character we wrote."
      *   I need to make sure this line of reasoning is prominent in the "Dissenting View" section.

  6.  **Developing the Criteria:**
      *   The criteria need to bridge the gap.
      *   *Criterion 1: The Tool vs. The Hand.* (LLM usage).
      *   *Criterion 2: The Brand vs. The Work.* (Self-promotion).
      *   *Criterion 3: The Timeless vs. The Timely.* (Plot vs. Style).

  7.  **Final Review against Constraints:**
      *   Concrete recommendation? Yes (Reject this, adopt new framework).
      *   Deadline? Yes.
      *   Criteria for this and next? Yes.
      *   Best hearing for the other side? Yes.
      *   No book lookups? Yes (relying on shared memory).

  8.  **Polishing:**
      *   Make the language sharper. "Ventriloquism" is a good word here. "Counterfactual intent."
      *   Ensure the distinction between *this* proposal and *future* proposals is clear. We can't reject the *idea* of modernizing, but we can reject *this* specific manifestation of it.

  **(Self-Correction during drafting):** Wait, if I recommend rejecting, does that shut down the conversation? No, if I pair it with a proposal to adopt new criteria *based* on their argument, it validates them while steering the ship. It says "You are right that we need to update our lens, but this object doesn't fit the new lens either."
