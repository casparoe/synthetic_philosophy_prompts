answer: |-
  This is a rich problem because your characters aren't just arguing about morality; they are arguing about *ontology*. They disagree on what the world *is*. The Fixer sees a machine, the Consultant sees a blueprint, and the Aunt sees a household.

  Here is the breakdown of their metaphors, where they fracture, and what they are hiding.

  ### 1. The Correspondence Tables

  | Component | **The Fixer (Grease)** | **The Consultant (Sand)** | **The Aunt (Tip/Loyalty)** |
  | :--- | :--- | :--- | :--- |
  | **The Machine** | The State / The Bureaucracy | The Rule of Law / Development | The Community / The Social Fabric |
  | **The Wheels** | Procedures / Regulations | Institutions / Justice | Relationships / Reciprocity |
  | **The Grease/Sand** | The Bribe (Functional) | The Bribe (Destructive) | The Gift / Tip (Relational) |
  | **The Friction** | Red Tape / Delay | Inefficiency / Inequality | Coldness / Stranger-danger |
  | **The Driver** | The Pragmatist (Who pays) | The Reformer (Who stops paying) | The Host/Kin (Who gives) |
  | **The Load** | Goods / Permissions / Survival | Progress / Fairness / Order | Hospitality / Goodwill / Face |
  | **The Mechanic** | Invisible (Market Forces) | External (The Aid Mission) | Tradition / Elders |

  ### 2. Where the Pictures Break

  **The Fixer (Grease)**
  *   **The Break:** Grease is meant to reduce wear, but in his model, the wear *is* the profit. If the wheels stop seizing without the grease, who is tightening the bolts? The metaphor assumes the friction is natural, rather than manufactured by the official to necessitate the grease.
  *   **The Limit:** It cannot account for violence. Grease doesn't explain broken legs or vanished rivals. It implies a consensual transaction in a system that is often coercive.

  **The Consultant (Sand)**
  *   **The Break:** Sand implies an external contaminant. But if *everyone* is pouring sand, it's not contamination; it's the operating medium. The metaphor fails to acknowledge that the "machine" might be designed to run on sand (i.e., low salaries, high discretion).
  *   **The Limit:** It assumes the machine *should* exist in its current form. It treats the State as a neutral good, ignoring that the "machine" might be a colonial relic or a tool of oppression that deserves to seize up.

  **The Aunt (Tip/Loyalty)**
  *   **The Break:** A tip is voluntary; a bribe is often mandatory. A loyalty card is corporate; a wedding envelope is communal. She conflates *power* with *service*. The doorman opens the door because he works for the building; the customs officer opens the gate because he owns the gate.
  *   **The Limit:** It collapses the public into the private. It cannot account for scale. You can tip a doorman; you cannot "tip" a ministry without changing the nature of the ministry into a household.

  ### 3. The Four Transactions Test

  You are right to worry. These analogies are not universal; they are specialized tools for specific jobs.

  | Transaction Type | **Fixer (Grease)** | **Consultant (Sand)** | **Aunt (Tip)** | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- |
  | **(a) Speed Money**<br>*(Owed, just faster)* | **Perfect Fit.**<br>Grease reduces friction to restore intended speed. | **High Friction.**<br>Undermines queue integrity. | **Awkward.**<br>Tips are for service, not urgency. | **Fixer wins here.** |
  | **(b) Buying Rights**<br>*(Never owed)* | **Market Price.**<br>Grease buys traction where there was none. | **Theft.**<br>Sand jams the lock to steal the car. | **Transactional.**<br>Breaks the "gift" illusion. | **Fixer wins (cynically).** |
  | **(c) Gift/Debt**<br>*(No date written)* | **Inefficient.**<br>Grease must be applied when needed. | **Nepotism.**<br>Sand in the family's gears. | **Perfect Fit.**<br>This is the definition of social capital. | **Aunt wins here.** |
  | **(d) Future Favor**<br>*(Quid pro quo)* | **Investment.**<br>Grease the wheels for the next journey. | **Conspiracy.**<br>Planning future jams. | **Kinship.**<br>Building the long-term bond. | **Fixer & Aunt tie.** |

  **The Diagnosis:** The Fixer's "Grease" only truly fits **(a)**. It struggles with **(c)** because grease is consumed, whereas a gift creates a lingering obligation. The Aunt's "Tip" fits **(c)** and **(d)** but fails at **(b)** because you don't tip someone to let you do something illegal, you pay them. The Consultant's "Sand" is a moral judgment, not a functional description, so it fits none of them functionally, only ethically.

  ### 4. What Each Analogy Smuggles In

  **The Fixer:**
  *   **The Smuggle:** *Inevitability.* By calling it grease, he implies the machine is inevitable. He smuggles in the idea that the State is a natural force like gravity, rather than a human construct that could be dismantled.
  *   **The Price:** It frames the payment as a *cost of doing business* rather than a *redistribution of wealth*.
  *   **The West:** It implies the West has "better oil," not that they have different laws.

  **The Consultant:**
  *   **The Smuggle:** *Universality.* She smuggles in the idea that her "machine" (Western Liberal Bureaucracy) is the only valid machine.
  *   **The Output:** She assumes the output (Justice/Efficiency) is what the locals want, rather than Survival/Certainty.
  *   **The Person:** She treats the payment as a price, ignoring that for the Aunt, it is a claim on a person.

  **The Aunt:**
  *   **The Smuggle:** *Voluntarism.* She smuggles in the idea that these payments are free choices, hiding the coercion of poverty or systemic exclusion.
  *   **The Public/Private:** She hides the theft of public resources by framing it as private hospitality.
  *   **The Power:** She frames the officer as a service provider (doorman) rather than a gatekeeper with a gun.

  ### 5. The Real Question: Does the Fixer's Conclusion Survive?

  **No.** The Fixer's conclusion ("Corruption is necessary for function") collapses the moment you realize the "wheels" are not universal.

  If the State is a machine designed to extract resources rather than serve citizens, then "grease" isn't making the machine work *for the people*; it's making the machine work *for the operator*. The Fixer's analogy relies on the assumption that the **Load** (the public good) is the same for everyone.

  If the Load is actually "regime survival" or "personal enrichment," then the grease isn't preventing seizure; it's lubricating a theft. The analogy carries the entire argument because it presupposes the machine is worth running. If your novel reveals the machine is broken by design (e.g., a post-colonial customs office designed to tax exports rather than facilitate trade), then the Fixer is wrong. He isn't greasing the wheels; he's paying the toll to a bandit.

  ### 6. A Better Picture: The Mycelium vs. The Mushroom

  The "Machine" metaphor is the trap. Machines are rigid, top-down, and designed. Your port town sounds organic, adaptive, and subterranean.

  **Try this:** The Official State is the **Mushroom**. It is the visible fruiting body. It looks solid, but it is brittle and seasonal. The Payments/Relationships are the **Mycelium**. This is the underground fungal network that actually connects the trees, moves the nutrients, and keeps the forest alive.

  *   **Why it works for (a) & (b):** Nutrients flow where the mycelium dictates, not where the mushroom cap points.
  *   **Why it works for (c) & (d):** Mycelium is about connection and symbiosis, not transaction. It creates a debt of life, not money.
  *   **Why it fits the Port:** It suggests a network that is invisible, pervasive, and essential. You can cut off the mushroom (raid the office), but the mycelium (the network of fixers, aunts, and consultants) remains underground and will sprout again.
  *   **The Conflict:** The Consultant wants to kill the fungus because it rots the wood. The Fixer knows the forest dies without it. The Aunt knows she is part of the root system.

  This allows your characters to be right about different things. The Consultant is right that it rots the timber (public funds). The Fixer is right that the forest needs the nutrient cycle (economy moves). The Aunt is right that it is a living system, not a mechanical one.

  It shifts the debate from "Is this machine broken?" to "Which ecosystem are we living in?"
