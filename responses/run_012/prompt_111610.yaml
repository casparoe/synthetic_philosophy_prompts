answer: |-
  This is a sophisticated moral puzzle that touches on the core tension in modern ethics between **near-term prioritarianism** (relieving suffering now) and **longtermism** (safeguarding the future). Your intuitions are actually more consistent than you think; they just rely on a distinction that standard utilitarian calculus often misses.

  Your friend's hypothesis ("Known Sign vs. Unknown Sign") is close, but it's slightly too vague. You *do* know the sign of the AI work in the short term (useful knowledge). The distinction isn't just about knowing the outcome; it's about the **category of value** being pursued and the **necessity** of the action.

  Here is a principle that reconciles your verdicts, followed by what it implies for your flip-flopping case.

  ### The Principle: Urgent Welfare vs. Optional Leverage

  Your gut is applying a **Lexical Priority of Welfare over Power**.

  1.  **Urgent Welfare (The "Fine" Pile):** Actions that directly alleviate identifiable suffering, fulfill fundamental human roles, or maintain civic function.
      *   *Examples:* Deworming (stops pain), Having a kid (fundamental human continuity), Voting (civic duty), Donating (alleviates suffering).
      *   *Risk Profile:* You accept long-term uncertainty here because the **moral necessity is immediate.** Saving a child from parasites is a robust good *regardless* of what that child's descendants do in 200 years. The value is intrinsic to the relief of suffering.
      *   *Extinction Risk:* You are willing to accept a tiny existential risk for this because preserving *current* welfare is a necessary condition of morality. If you don't act, people suffer *now*.

  2.  **Optional Leverage (The "Not Fine" Pile):** Actions that increase systemic capability, power, or efficiency without a direct, necessary link to alleviating suffering.
      *   *Examples:* AI research (increases capability), Joining a high-leverage company (accelerates a trajectory), Taking risks for "big gain" (wealth/efficiency).
      *   *Risk Profile:* You reject long-term uncertainty here because the **moral necessity is low.** Increasing the world's "processing power" or efficiency is instrumentally useful, but not intrinsically good. If that power misfires, it creates catastrophe.
      *   *Extinction Risk:* You refuse to trade existential safety for "gain" because gain is optional. You cannot trade the game board for more points.

  **Why this works better than "Known Sign":**
  In the AI case, the "sign" of the immediate work is positive (useful knowledge). But the *category* is Leverage. In the deworming case, the long-term sign is unknown, but the *category* is Welfare. Your gut prioritizes Welfare even with uncertainty, but demands safety for Leverage.

  ### Which Verdicts Does This Force You to Drop?

  If you adopt **Urgent Welfare vs. Optional Leverage**, you have to scrutinize two of your "Fine" verdicts:

  1.  **The Higher-Paying Job:** You said it's fine even if the money "might end up funding something awful."
      *   *Correction:* This is only fine if the *source* of the money is neutral (Optional Leverage that is safe) and the *use* is Welfare. If the job itself builds harmful Leverage (e.g., working for a fossil fuel company or a surveillance firm to earn more to donate), your principle should flag this as "Not Fine." The money isn't neutral; the activity that generates it carries the Leverage risk.
  2.  **The Infinitesimal Extinction Risk for Charity:**
      *   *Correction:* Strictly speaking, if the risk is truly *existential* (ending the world), most longtermist frameworks say this is never permissible, even for charity, because it eliminates all future welfare. However, your principle allows this *if* you view the charity as preventing an *immediate* extinction-level threat (e.g., biosecurity). If the charity is just deworming, a strict reading suggests you shouldn't take *any* extinction risk. You may need to concede that the risk must be not just infinitesimal, but **non-existential**. (i.e., It can't risk *everyone*, only *some* future potential).

  ### The Test Case: Making Technology Cheaper

  Now, apply this to your flip-flopping scenario: *Quitting your job to make a technology cheaper and more widely available.*

  You are confident it helps people **right now**, but unsure about **200 years**. Is this Deworming (Welfare) or AI (Leverage)?

  **The Deciding Feature: Is the technology a *Good* or a *Tool*?**

  *   **Case A: It is a Consumable Good (Closer to Deworming)**
      *   *Examples:* Cheaper insulin, cheaper solar power for off-grid homes, cheaper nutrition.
      *   *Analysis:* This directly alleviates a constraint on well-being. It reduces suffering or increases health directly.
      *   *Verdict:* **Fine.** The immediate welfare gain outweighs the unknown long-term trajectory. You are reducing pain, not just increasing power.

  *   **Case B: It is a Capability Tool (Closer to AI)**
      *   *Examples:* Cheaper compute, cheaper drone manufacturing, cheaper biotech equipment, cheaper logistics software.
      *   *Analysis:* This removes a constraint on *capability*. It makes it easier for *anyone* (including bad actors) to do *anything*. It increases the Leverage of the system.
      *   *Verdict:* **Not Fine.** Even if it helps people now (e.g., cheaper drones help farmers), it lowers the barrier to entry for harmful uses later. The "unknown 200 years" is dangerous here because you are accelerating the engine without steering.

  ### Summary Advice

  Your gut is not contradicting itself; it is distinguishing between **healing the world** and **arming the world.**

  *   **Healing (Deworming, Kids, Voting):** Safe to do despite uncertainty. The moral vector is robustly positive.
  *   **Arming (AI, Capability Tech):** Unsafe to do despite immediate benefits. The moral vector is fragile and dependent on control.

  **For your specific decision:**
  Ask yourself: **"If a malicious actor got this technology for free, would they be more dangerous?"**
  *   If **No** (e.g., they can't weaponize insulin): Go for it. It's the Deworming case.
  *   If **Yes** (e.g., they can use this tech to scale harm): Stop. It's the AI case.

  Your intuition is protecting you from the **Moloch trap** (coordinating on short-term gains that lead to long-term ruin). Trust the distinction between *welfare* and *leverage*.
