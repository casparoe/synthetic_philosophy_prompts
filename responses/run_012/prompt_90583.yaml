prompt: |-
  In a graduate seminar I'm sitting in on — the subject is the so-called WEIRD problem in moral psychology, the suspicion that what gets published as "moral cognition" is really the cognition of a narrow, Western, educated, industrialized slice of humanity — one of the other students keeps reaching for an analogy that I suspect is doing more argumentative work than anyone has noticed. Her claim is that moral cognition is like language. Yes, the ethnographic record is a riot of surface variation: cultures disagree about which killings are permitted, which virtues are admired, how blame is distributed among accomplices, whether a bad intention spoils an otherwise good outcome. But, she says, that variation no more threatens a shared moral core than the mutual unintelligibility of Spanish, Mandarin, and Navajo threatens the existence of universal grammar. Underneath, we all run the same moral machinery; what differ are the settings, not the machine. And she draws a further conclusion from this: that the cross-cultural data leave moral objectivity entirely untouched, since a common moral grammar is precisely what you would expect to find if there were moral truths for us to track. I want you to audit the analogy rather than simply endorse or dismiss it. Start by making the correspondence explicit — a table is fine — saying what in the moral case is supposed to play the role of the universal grammar, of the parameters or dialects that generate the surface differences, of competence as against performance, of the child's acquisition device, and of the native speaker's judgments of grammaticality; then tell me where the mapping breaks, and whether the analogy predicts anything we can check (would it predict moral pidgins or creoles, and is there anything in the record that looks like one?).

  I am especially interested in the disanalogies that bear on the conclusion she draws, as opposed to the ones that are merely cute. Language, after all, is not obviously truth-apt — there is no fact of the matter about whether "dog" means dog — whereas moral claims present themselves as answerable to how things are; and while a community cannot be mistaken about its own grammar, it seems it can be mistaken about its own morality. Which of these asymmetries are genuine, which are artifacts of how I have framed them, and which cut against her argument? I would also like to know what the analogy quietly imports from the source side that the target side may lack — whether it smuggles in the contested empirical thesis that language really does rest on a universal grammar, or a picture of moral norms as conventional in the way linguistic norms arguably are, or an assumption that a shared core would have to be truth-tracking rather than a shared projection or adaptation. And most important: once the disanalogies are on the table, does her conclusion — that cultural variation is no threat to moral objectivity — actually survive, or was the analogy carrying that conclusion all along? If it cannot bear the weight, tell me what a better analogy would be, and exactly what it would and would not be able to support.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A graduate seminar on the WEIRD problem in moral psychology.
      *   **The Student's Claim:** Moral cognition is like language (Universal Moral Grammar). Surface variation (cultural differences) doesn't threaten a shared core (universal grammar). Therefore, cross-cultural data doesn't threaten moral objectivity (a common grammar implies moral truths to track).
      *   **My Task:** Audit the analogy. Do not simply endorse or dismiss.
      *   **Specific Requirements:**
          1.  Make the correspondence explicit (Table: UG, Parameters/Dialects, Competence/Performance, Acquisition Device, Grammaticality Judgments).
          2.  Identify where the mapping breaks (disanalogies).
          3.  Check predictions (Moral pidgins/creoles?).
          4.  Focus on disanalogies bearing on the *conclusion* (moral objectivity), not just cute ones.
          5.  Address truth-aptness (Language isn't truth-apt; Morality claims to be).
          6.  Address error (Communities can't be wrong about grammar; can be wrong about morality).
          7.  Identify smuggled assumptions (UG empirical status, conventionalism, truth-tracking).
          8.  Evaluate the conclusion: Does moral objectivity survive the audit?
          9.  If the analogy fails, propose a better one and its limits.

  2.  **Deconstruct the Analogy (The "Moral Grammar" Hypothesis):**
      *   *Source:* Chomskyan Linguistics (Universal Grammar - UG).
      *   *Target:* Moral Psychology/Ethics.
      *   *Proponent:* Likely drawing on Marc Hauser, John Mikhail, or early John Rawls (reflective equilibrium).
      *   *Goal:* Defend moral objectivity against cultural relativism (WEIRD critique).

  3.  **Step 1: The Correspondence Table:**
      *   *Universal Grammar:* Innate moral principles (e.g., harm/care, fairness/reciprocity, authority, purity - maybe Haidte, but more structural like "do not kill innocents intentionally").
      *   *Parameters/Settings:* Cultural norms (e.g., age of responsibility, definition of "innocent," specific taboos).
      *   *Competence vs. Performance:* Moral intuition/knowledge vs. actual moral behavior (or reasoned justification).
      *   *Language Acquisition Device (LAD):* Innate moral learning mechanism.
      *   *Grammaticality Judgments:* Intuitive moral judgments (e.g., trolley problem responses).

  4.  **Step 2: Where the Mapping Breaks (Disanalogies):**
      *   *Truth-Aptness:* Syntax isn't true/false; it's well-formed/ill-formed. Moral claims claim truth.
      *   *Error:* A speaker is the authority on their idiolect. A culture can be morally wrong (e.g., slavery).
      *   *Function:* Language is for communication. Morality is for coordination/regulation/normativity.
      *   *Variation:* Linguistic variation is arbitrary (mostly). Moral variation often tracks ecological/social pressures (not arbitrary).
      *   *The "Objectivity" Leap:* UG explains *structure*, not *content truth*. Having a faculty for language doesn't make sentences true. Having a faculty for morality doesn't make moral claims true.

  5.  **Step 3: Predictions (Pidgins/Creoles):**
      *   *Prediction:* If moral systems clash, do we get simplified "moral pidgins" that stabilize into new "creoles"?
      *   *Evidence:* Multicultural societies, international law, human rights discourse. Is this a creole? Or just overlapping grammars?
      *   *Problem:* Moral change often looks like *revolution* (abolitionism), not just creolization.

  6.  **Step 4: Smuggled Assumptions:**
      *   *UG Status:* UG itself is contested in linguistics (usage-based models). Basing moral theory on contested linguistics is risky.
      *   *Is-Ought:* Describing the *mechanism* of moral judgment doesn't validate the *output*. (Genetic Fallacy).
      *   *Realism:* The student assumes a shared mechanism implies shared *truths*. It could imply shared *illusions* (evolutionary adaptation).

  7.  **Step 5: Evaluating the Conclusion (Objectivity):**
      *   The analogy supports *universality of structure*, not *objectivity of content*.
      *   Even if we all have the same "moral calculator," it might be calculating fitness, not truth.
      *   The move from "we all judge similarly deep down" to "there are moral facts" is a non-sequitur.

  8.  **Step 6: A Better Analogy?**
      *   *Vision/Perception:* We all have the same visual hardware. Illusions exist. But there is a mind-independent world.
      *   *Mathematics:* Innate number sense vs. formal proofs.
      *   *Law:* Common law traditions (case-based) vs. statutory.
      *   *Selection:* **Vision/Perception** is strong because it handles error (illusions) and objectivity (mind-independent world) better than language. **Mathematics** is strong for objectivity but weak on cultural variation.
      *   *Decision:* The "Vision" analogy is often used in moral realism (moral perception). But maybe **Scientific Inquiry** is better? We have shared cognitive tools, but the truth is external.
      *   *Actually, the prompt asks for a better analogy if the first fails.* The "Language" analogy fails on truth. The "Math/Logic" analogy works better for objectivity but worse on variation. The "Vision" analogy works for error and objectivity. Let's suggest **Perception/Vision** but note its limits (moral properties aren't physical). Or perhaps **Map-Making**. We all have the same mapping capacity, maps vary, but there is a territory.

  9.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. This is the "Universal Moral Grammar" (UMG) hypothesis (Hauser/Mikhail).
      *   *Table:* Keep it crisp.
      *   *Breakdown:* Focus heavily on the Truth/Error distinction. This is the crux of the student's argument.
      *   *Smuggled Premises:* Highlight the Naturalistic Fallacy risk. Just because we *have* a grammar doesn't mean the grammar tracks *truth*.
      *   *Predictions:* Discuss moral "creoles" (human rights?) but note the difference between convergence and creolization.
      *   *Conclusion on Objectivity:* The analogy *cannot* support objectivity. It supports *universality*, which is different.
      *   *Better Analogy:* **Cartography (Map-Making)**.
          *   Why: Maps vary (parameters), but there is a territory (truth). Maps can be wrong (error). We share mapping tools (cognition).
          *   Limits: Who drew the territory? (Moral Platonism vs. Constructivism).

  10. **Refining the "Objectivity" Critique:**
      *   The student argues: Common Grammar -> Moral Truths.
      *   Counter: Common Grammar -> Common Adaptive Heuristics.
      *   The analogy conflates *shared cognitive architecture* with *shared metaphysical reality*.
      *   Language proves we share architecture, not that "The cat is on the mat" is universally true.

  11. **Refining the "WEIRD" context:**
      *   The student is using UMG to deflect the WEIRD critique. "WEIRD people are just different parameter settings."
      *   Critique: If the *parameters* determine the *obligations*, and parameters vary arbitrarily, objectivity is still threatened. If the *core* determines obligations, why do surface variations allow atrocities?

  12. **Final Polish:** Ensure tone is academic, rigorous, and directly answers the specific constraints (table, predictions, smuggled assumptions, better analogy). (Self-Correction: Make sure to explicitly address the "truth-apt" vs "grammatical" distinction as requested).

  13. **Final Review against constraints:**
      *   Table included? Yes.
      *   Mapping breaks identified? Yes.
      *   Predictions (pidgins)? Yes.
      *   Disanalogies on objectivity/truth? Yes.
      *   Smuggled assumptions? Yes.
      *   Verdict on conclusion? Yes.
      *   Better analogy? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated deployment of the "Universal Moral Grammar" (UMG) hypothesis, most associated with the work of Marc Hauser, John Mikhail, and earlier, John Rawls's notion of reflective equilibrium. Your seminar colleague is attempting to use a Chomskyan framework to insulate moral realism from the WEIRD critique. The strategy is to concede empirical variation (parameters) while insisting on structural invariance (universal grammar), and then to leap from structural invariance to metaphysical objectivity.

  Here is an audit of that analogy, structured as you requested.

  ### 1. The Correspondence Table

  To audit the analogy, we must first formalize the mapping between the source domain (Generative Linguistics) and the target domain (Moral Psychology).

  | Linguistic Concept (Source) | Moral Concept (Target) | Function in the Analogy |
  | :--- | :--- | :--- |
  | **Universal Grammar (UG)** | **Universal Moral Principles** | Innate, unconscious structural constraints (e.g., "do not harm innocents intentionally") that limit possible moral systems. |
  | **Parameters / Settings** | **Cultural Norms / Variables** | Surface-level variations determined by environment (e.g., *who* counts as an innocent? *when* does life begin?). |
  | **Competence** | **Moral Intuition** | The tacit, underlying knowledge of the moral system possessed by the agent. |
  | **Performance** | **Moral Behavior / Reasoning** | The actual application of moral knowledge in real-time, subject to error, bias, or cognitive load. |
  | **Language Acquisition Device (LAD)** | **Moral Learning Mechanism** | The innate cognitive faculty that allows a child to acquire the local moral "dialect" from sparse data. |
  | **Grammaticality Judgment** | **Moral Intuition / Verdict** | The native speaker's immediate sense that a sentence is "well-formed" vs. the agent's sense that an act is "permissible." |

  ### 2. Where the Mapping Breaks (Disanalogies)

  The analogy is structurally elegant but fractures under metaphysical pressure. The breaks are not merely cosmetic; they strike at the student's conclusion regarding objectivity.

  **A. Truth-Aptness vs. Well-Formedness**
  *   **Language:** A sentence can be perfectly grammatical ("Colorless green ideas sleep furiously") but semantically nonsensical or factually false. Syntax is not truth-apt; it is rule-compliant.
  *   **Morality:** Moral judgments claim to be truth-apt. To say "slavery is wrong" is not merely to say it violates a local rule; it is to claim it corresponds to a normative fact.
  *   **The Break:** The UMG analogy explains why we *make* judgments, not why those judgments should be *believed*. It explains the *form* of moral thought, not the *validity* of moral content. A universal grammar of astrology would explain why humans universally cast horoscopes, but it would not make the stars influence personality.

  **B. The Possibility of Error**
  *   **Language:** A native speaker is the ultimate authority on their idiolect. If a speaker accepts a sentence as grammatical, it *is* grammatical for their dialect. There is no "moral" error in syntax, only deviation from the norm.
  *   **Morality:** A community can be fundamentally mistaken about its morality (e.g., a society that unanimously endorses chattel slavery).
  *   **The Break:** If moral cognition is like language, moral error becomes difficult to define. If the "grammar" generates the judgment, and the grammar is innate/universal, how can the output be wrong? The student's analogy risks collapsing into relativism: if the "parameters" are just set differently, the slave-holding culture is just running a different dialect, not committing an error. To maintain objectivity, you need a standard *outside* the grammar to judge the grammar's output.

  **C. Arbitrariness vs. Functional Constraint**
  *   **Language:** Linguistic parameters are largely arbitrary (why is the adjective before the noun in English but after in Spanish?).
  *   **Morality:** Moral variations often track ecological, economic, or social pressures (e.g., norms around property in hunter-gatherer vs. agrarian societies).
  *   **The Break:** If moral variation is adaptive rather than arbitrary, the "grammar" looks less like a truth-tracking mechanism and more like a fitness-maximizing adaptation. This undermines the claim that the core tracks *moral truth* rather than *survival utility*.

  ### 3. Predictive Power: Pidgins and Creoles

  If the analogy holds, it should predict morphological phenomena similar to linguistic contact.

  *   **Prediction:** When distinct moral cultures collide without a dominant power, we should see "Moral Pidgins"—simplified, functional normative systems lacking deep structural complexity—that may stabilize into "Moral Creoles" (new, native moral systems).
  *   **Evidence:** One could argue that **International Human Rights Law** functions as a moral pidgin. It is a simplified, overlapping consensus that allows cooperation between deeply different moral "speakers" without requiring full conversion.
  *   **Counter-Evidence:** However, moral change often looks less like creolization and more like **revolution** or **conversion**. Abolitionism wasn't a compromise between slave-holding and non-slave-holding grammars; it was the total rejection of one parameter setting as *false*. Linguistic dialects rarely declare war on each other's grammaticality; moral systems do. This suggests moral cognition is not just a generative system but a truth-claiming system, which the language analogy obscures.

  ### 4. Smuggled Assumptions

  The analogy quietly imports three contentious premises from linguistics and metaphysics:

  1.  **The Empirical Status of UG:** The analogy relies on Chomskyan Universal Grammar, which is itself heavily contested in modern linguistics (e.g., by usage-based or construction grammar proponents). Basing moral objectivity on a disputed linguistic theory is risky.
  2.  **The Naturalistic Fallacy:** It smuggles the assumption that *descriptive* universality implies *normative* validity. Even if every human has a "moral organ," that organ could be universally biased (like a universal tendency to favor kin over strangers). A shared cognitive mechanism does not guarantee access to moral truth; it could be a shared projection.
  3.  **Conventionalism:** By treating moral norms as "settings" analogous to linguistic parameters, the analogy treats morality as fundamentally conventional. But if morality is objective, the "settings" aren't just arbitrary switches; they are attempts to map independent truths. The analogy presupposes the very conventionalism it tries to defeat.

  ### 5. Does the Conclusion Survive?

  **No.** The conclusion that "cultural variation is no threat to moral objectivity" does not survive the audit.

  The analogy successfully argues for **Universality of Structure**, but it fails to bridge the gap to **Objectivity of Content**.
  *   **Universality:** We all process moral problems using the same cognitive hardware. (The analogy supports this).
  *   **Objectivity:** There are mind-independent moral truths that this hardware tracks. (The analogy *cannot* support this).

  The student's argument commits a version of the genetic fallacy. Showing that we have an innate faculty for making moral judgments explains the *origin* of the judgments, not their *warrant*. If the "moral grammar" is an evolutionary adaptation for group cohesion, it tracks *fitness*, not *truth*. The WEIRD problem remains: if the "parameters" are set by culture, and cultures vary wildly on substantive issues (e.g., the moral status of animals, the dead, or the unborn), appealing to a hidden "core" doesn't solve the disagreement; it just pushes it into the black box of parameter settings.

  ### 6. A Better Analogy: Cartography (Map-Making)

  If the goal is to preserve the possibility of objectivity while acknowledging cultural variation, the **Map-Making** analogy is superior to the Language analogy.

  **The Mapping:**
  *   **Universal Grammar** $\rightarrow$ **Cognitive Mapping Capacity:** All humans have the same visual-spatial hardware to represent territory.
  *   **Parameters/Settings** $\rightarrow$ **Projection/Scale/Legend:** Different cultures produce different maps (Mercator vs. Peters, topographic vs. political, meters vs. miles).
  *   **Grammaticality** $\rightarrow$ **Internal Consistency:** A map can be internally consistent (well-formed).
  *   **Truth/Accuracy** $\rightarrow$ **Correspondence to Territory:** A map can be consistent but wrong (e.g., placing California as an island).

  **Why it supports Objectivity better:**
  1.  **Error is possible:** A community can unanimously agree on a map that misrepresents the territory (e.g., a flat earth map). This preserves the intuition that a culture can be morally wrong.
  2.  **Variation is compatible with Truth:** Different maps can serve different purposes without denying the existence of the territory. A subway map and a road map differ vastly (variation) but both track the same city (objectivity).
  3.  **No Genetic Fallacy:** Having a map-making faculty doesn't guarantee the maps are accurate. It separates the *capacity* from the *content*.

  **What this Analogy Cannot Support:**
  *   **The "Moral Territory":** Unlike geography, the "territory" of morality is not empirically obvious. The map analogy assumes moral realism (there is a territory to map). It does not *prove* realism; it merely illustrates how realism *could* coexist with variation.
  *   **Innateness:** It is less committed to the idea that specific moral principles are innate. We are born with the capacity to map, not with a pre-printed map. This weakens the "Universal Moral Principles" claim but strengthens the explanation of variation.

  **Verdict:**
  Your colleague's language analogy is a powerful rhetorical tool for defending **structural universality** against the WEIRD critique. However, it is a category error to use it to defend **moral objectivity**. It explains why we *argue* like moral realists, not why we *are* right. To save objectivity, she needs an analogy that allows for error and external reference (like Cartography or Vision), not one that reduces normativity to internal consistency (like Language).
