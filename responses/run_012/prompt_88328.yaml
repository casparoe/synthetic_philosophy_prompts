answer: |-
  The vocabulary exists, but it is fragmented across linguistics, ethics, and negotiation theory. No single word captures the entire spectrum of your character's behavior, because the spectrum spans the difference between *active construction* of a false belief and *passive allowance* of one.

  Here is the precise terminology for what she does, categorized by your three scenes, followed by an analysis of the three boundaries you identified.

  ### The Terminology for the Scenes

  **Scenes 1 and 2: Paltering**
  The established term for actively using truthful statements to create a false impression is **paltering**.
  *   **Definition:** The selective use of truthful information to lead a listener to a false conclusion, without making a factually false statement.
  *   **Why it fits:** In both scenes, your character actively constructs a response. She scans the set of available true sentences and selects the one with the highest misleading yield.
  *   **The Edge:** Paltering stops where the statement becomes ambiguous. If she says, "I was busy," that is vague. If she says, "I was at the studio," that is specific and truthful, but functionally deceptive. Paltering requires the speaker to *rely* on the listener's trust in the cooperative nature of conversation.

  **Scene 3: Acquiescent Misleading (or Deception by Acquiescence)**
  Paltering does not fit Scene 3 because paltering requires the *intent* to create the false belief at the moment of speaking. In Scene 3, she speaks truthfully, foresees the error, and chooses not to correct it.
  *   **Definition:** Affirming a true proposition while knowingly allowing the listener to draw a false inference from it, without correcting that inference.
  *   **Why it fits:** She fulfills her duty to truthfulness (the statement is true) but violates her duty to clarity (she allows the meaning to be corrupted).
  *   **The Edge:** This stops being deception and becomes mere silence if she says nothing at all. Because she speaks ("I have never stopped loving him"), she initiates a conversational contract. By not correcting the misunderstanding, she breaches that contract.

  ### Addressing Your Three Boundaries

  You asked for the edges where these concepts stop and start. Here is how the vocabulary draws those lines.

  #### Boundary 1: Speaker Suggestion vs. Listener Error
  *   **The Distinction:** This is the line between **Implicature** and **Inference**.
  *   **Scene 1 (Implicature):** The false suggestion is carried by the speaker's words. By saying "I was at the studio," she relies on the Gricean Maxim of Relation (be relevant). The listener assumes she is mentioning the studio *because* it explains her whereabouts regarding the affair. The speaker plants the seed.
  *   **Scene 3 (Inference):** The false suggestion is supplied by the listener. The words "I never stopped loving him" are technically compatible with platonic love. The sister supplies the romantic context.
  *   **The Edge:** The boundary is **recoverability**. If the speaker can plausibly say, "I didn't mean that, you misunderstood," and be believed, it is Listener Inference (Scene 3). If the speaker's wording makes that denial sound absurd (e.g., "I was at the studio" when she was actually at a hotel *in* the studio complex), it is Speaker Implicature (Scene 1).
  *   **Vocabulary:** Use **Active Implicature** for Scene 1 and **Passive Inference** for Scene 3.

  #### Boundary 2: Intent vs. Foreseeability
  *   **The Distinction:** This is the line between **Purpose** and **Recklessness**.
  *   **Scenes 1 & 2 (Purpose):** She chooses the sentence *for the reason* that it will mislead. The false belief is the goal (or a necessary means to the goal).
  *   **Scene 3 (Recklessness):** She does not seek the false belief, but she accepts it as the cost of her truth-telling. She foresees the harm and proceeds anyway.
  *   **The Edge:** The boundary is **correction**. If, in Scene 3, she had added, "...as a sister," the deception vanishes. By withholding the clarifier she *knows* is needed, her recklessness hardens into intent.
  *   **Vocabulary:** There is no single common noun for this, but in ethics, this is the **Doctrine of Double Effect** applied to speech. For your novel, you might distinguish between **Intentional Paltering** (Scenes 1 & 2) and **Willful Acquiescence** (Scene 3). Willful Acquiescence begins where the speaker recognizes the misunderstanding and ends where the speaker actively cultivates it.

  #### Boundary 3: Misleading Speech vs. Refusal to Answer
  *   **The Distinction:** This is the line between **Evasion** and **Non-Disclosure**.
  *   **The Concept:** A refusal to answer ("I decline to comment") breaks the conversational flow. It signals, "I am hiding something." Paltering and Acquiescent Misleading *maintain* the flow. They signal, "I am cooperating with you," which is why they are more harmful.
  *   **The Edge:** The boundary is the **Cooperative Principle**. If she refuses to answer, she opts out of the contract. If she answers truthfully but misleadingly, she stays in the contract but exploits its rules.
  *   **Vocabulary:** A refusal is **Silence** or **Withholding**. What your character does is **Obfuscation**. Obfuscation requires speech; silence does not. If she says nothing, she is withholding. If she speaks truth to confuse, she is obfuscating.

  ### Summary of Terms for Your Use

  If you need to label these actions in your notes or through a narrator, here is the precise taxonomy:

  1.  **Paltering:** (Scenes 1 & 2). Active, intentional misleading using truthful statements.
      *   *Edge:* Stops when the statement becomes so vague it offers no information (mere evasion).
  2.  **Acquiescent Misleading:** (Scene 3). Speaking truth while knowingly allowing a false inference to stand.
      *   *Edge:* Stops when the speaker corrects the record, or when the speaker remains entirely silent.
  3.  **Obfuscation:** The umbrella term for all three. It distinguishes her behavior from a simple **Refusal to Answer**.
      *   *Edge:* Stops when the speaker makes a factually false statement (which becomes **Lying**).

  ### A Coinage for the Specific Nuance
  You mentioned that existing concepts might not reach the third boundary perfectly. The specific moral texture of Scene 3—where the harm is caused by the *listener's* mind but authorized by the *speaker's* silence—is often lumped in with lying, which feels wrong.

  If you need a term that captures the specific violence of Scene 3 (where she uses the truth as a shield for a lie), I propose: **Truth-Cover**.

  *   **Definition:** A truthful statement offered not to inform, but to protect a falsehood from scrutiny by satisfying the listener's demand for honesty without actually satisfying their need for truth.
  *   **Boundary:** It differs from Paltering because the speaker does not necessarily craft the statement to mislead (Scene 3); it differs from Silence because the speaker engages verbally.
  *   **Usage:** "She didn't lie to him; she gave him a truth-cover."

  This distinguishes her from a liar (who breaks the rules) and a refuser (who quits the game). She is a player who wins the game by following the rules exactly while violating their spirit.
