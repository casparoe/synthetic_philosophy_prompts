  Subject: Quick thoughts on your population ethics setup

  Hi there,

  It is great that you are running this consistency check before the seminar because you have effectively reconstructed the core impossibility theorems in population ethics, specifically Parfit's Mere Addition Paradox and Arrhenius's Impossibility Theorem. You have assembled a set of views that are individually very plausible but collectively inconsistent, which is exactly where the interesting philosophy happens. The most serious tension by far is the triad between your rejection of the Repugnant Conclusion, your acceptance of Mere Addition, and your commitment to Transitivity. If you start with a population where everyone is flourishing and repeatedly add new people with lives worth living without lowering the welfare of the original group, you eventually reach a world with billions of people whose lives are barely worth living. If each step is better than the last because of your Mere Addition principle, and betterness is transitive, then the final repugnant world must be better than the initial flourishing one. You cannot hold all three of those claims simultaneously without contradiction.

  The second most serious tension is between your Mere Addition principle and your Person-Affecting Thought. You claim that adding happy people makes an outcome better, but you also claim an outcome can only be better if it is better for someone. In cases where the new people would not otherwise exist, it is controversial to say the change is better for them in a way that satisfies standard person-affecting constraints, since they have no alternative where they exist and are better off. If you insist that it is better for them simply because their lives are worth living, your Person-Affecting Thought collapses into an impersonal view anyway. If you insist it is not better for them, then you must reject Mere Addition. This is a significant conceptual clash, though it is secondary to the logical impossibility of the first triad.

  Regarding the costs of fixing these issues, giving up your rejection of the Repugnant Conclusion would be theoretically cleanest but intuitively most expensive. You would become a classic Totalist, which solves the transitivity and Mere Addition issues instantly, but you explicitly stated you find the conclusion unacceptable, so this would likely undermine your confidence during the seminar. Giving up Transitivity is another option, allowing you to say each step is better without the final step being better, but this invites charges of irrationality and makes decision theory very difficult to defend. Giving up the Person-Affecting Thought is relatively cheap theoretically and aligns well with Welfarism, but it does not solve the Repugnant Conclusion problem on its own. You would still be stuck with the contradiction between Mere Addition, Transitivity, and the Repugnant Conclusion.

  The single revision that cleans up the most is to modify your second claim about Mere Addition. If you adopt a Critical Level view instead, you can say that adding people only makes an outcome better if their welfare exceeds a certain threshold, not just if their lives are worth living. This allows you to block the slide toward the Repugnant Conclusion while keeping Transitivity and your Welfarism intact. It also dissolves the tension with the Person-Affecting Thought because you are no longer committed to saying that adding barely-happy people is an improvement. This position is widely respected in the literature, often associated with Critical Level Utilitarianism, and it will allow you to defend your rejection of the Repugnant Conclusion without sacrificing rational coherence. You will just have to argue that adding happy people is sometimes neutral rather than always better, which is a manageable cost compared to accepting the Repugnant Conclusion or abandoning transitivity.

