answer: |-
  This is a precise request for a structural analysis of legal regimes. You are asking for the *source code* of these policies: the underlying logic that compels the specific syntax of the laws.

  Here is the reconstruction of the implicit theories behind the three models, addressing your specific puzzles regarding agency, harm, and state function.

  ---

  ### 1. The Nordic Model (Neo-Abolitionism)
  **Jurisdictions:** Sweden, Norway, France, Canada (partial).
  **Mechanism:** Criminalize the purchase of sex; decriminalize the sale.

  *   **Theory of Consent:** Consent to sell sex is **structurally invalid**. This model does not necessarily claim that every individual transaction is physically forced, but that the *class* of transactions occurs within a system of patriarchy and economic coercion that vitiates meaningful consent. It treats sexual autonomy as a right that cannot be waived for money, analogous to how one cannot validly consent to be enslaved or maimed, even if paid.
  *   **Location of Harm:** The harm is **inherent in the transaction**. The act itself constitutes a violation of human dignity (specifically women's dignity). The buyer is the active agent of this violation; the seller is the site of the violation.
  *   **State Role:** **Paternalistic Protector.** The state acts to protect a vulnerable class from exploitation, even if members of that class claim to choose it. The state's duty is to reduce demand to shrink the market, not to manage the market.

  #### Addressing Puzzle 1: The Nordic Asymmetry
  *Is it coherent to treat the seller as too compromised to be blameworthy, yet competent enough that her agreement doesn't excuse the buyer?*

  **Yes, it is coherent, but only under a specific theory of rights.**
  The model relies on the concept of **non-waivable rights**.
  *   **The Seller:** She is not punished because she is viewed as the victim of a rights violation. In criminal law, victims are not punished for the crimes committed against them, even if they "agreed" to the situation (e.g., a victim of a hate crime cannot consent to be assaulted). Her agency is viewed as constrained by background conditions (poverty, trafficking, gender inequality).
  *   **The Buyer:** He is punished because he is the one leveraging those background conditions to purchase access to a body. His crime is not "breach of contract" but "exploitation of vulnerability."
  *   **Coherence:** The logic holds if you accept the premise that sexual integrity is a right you cannot sell. If I sell you my kidney, I am not a criminal, but you are (in many jurisdictions). The asymmetry exists because the law views the buyer as the *predator* and the seller as the *prey*, regardless of the prey's apparent cooperation.

  ---

  ### 2. The Regulation Model (Legalization)
  **Jurisdictions:** Germany, Netherlands, Nevada (USA).
  **Mechanism:** State licensing, zoning, mandatory health checks, taxation.

  *   **Theory of Consent:** Consent is **possible but risky**. The state acknowledges that adults can choose to sell sex, but views the trade as having high negative externalities (disease, public order, trafficking). Consent is valid only if it occurs within state-sanctioned safety parameters.
  *   **Location of Harm:** The harm lies in the **unregulated conditions**. The act itself is morally neutral or tolerable, but the *environment* in which it typically occurs (black markets, street corners) creates danger for the worker and the community.
  *   **State Role:** **Sanitarian Manager.** The state treats sex work as a hazardous industry that must be contained and monitored to protect public health and order. It is not trying to eliminate the market, but to bureaucratize it.

  #### Addressing Puzzle 2: Why Special Rules?
  *If this is work like any other, why registration, zoning, and health checks?*

  **Because the state does not actually believe it is "work like any other."**
  If Germany truly viewed this as ordinary labor, it would be governed solely by the Commercial Code and Labor Law. The existence of specific *Prostitution Laws* reveals the implicit theory:
  *   **Health Checks:** Ordinary workers (chefs, nurses) are not legally mandated to undergo regular STI testing. This presupposes that the sex worker's body is a vector of disease in a way other bodies are not.
  *   **Zoning:** Ordinary businesses can open anywhere zoned for commerce. Restricting brothels to specific areas presupposes that the presence of sex work degrades the moral or aesthetic value of a neighborhood (a nuisance theory).
  *   **Registration:** This creates a database of workers. This presupposes that the state needs to track this population specifically, implying they are a distinct class requiring monitoring.
  *   **Conclusion:** This regime treats sex work as **legitimate but dangerous**. It grants legitimacy (taxation, contracts) but imposes constraints (zoning, health) that signal stigma and risk management.

  ---

  ### 3. The Decriminalization Model
  **Jurisdictions:** New Zealand, New South Wales (Australia).
  **Mechanism:** Remove criminal penalties; govern via standard labor, contract, and health/safety law.

  *   **Theory of Consent:** Consent is **valid and sovereign**. The transaction is a private contract between adults. The state has no interest in the morality of the exchange, only in ensuring the exchange is free of force and fraud.
  *   **Location of Harm:** The harm lies in **criminalization**. Violence, exploitation, and stigma are exacerbated because the industry is pushed underground or because workers cannot access police protection without fear of arrest.
  *   **State Role:** **Referee.** The state withdraws from moral judgment and provides the civil framework (courts, labor tribunals) for disputes to be resolved. It treats sex work as a service sector activity.

  #### Addressing Puzzle 2 (Part B): Why not full employment protection?
  *If New Zealand decriminalized it, why hasn't the full apparatus of employment protection followed?*

  **This is a confusion of *criminal* status vs. *civil* classification.**
  *   **The Barrier Removed:** Before decriminalization, a sex worker could not sue for unpaid wages because the contract was illegal (*ex turpi causa*). Decriminalization removes this bar. They *can* now bring workplace claims.
  *   **The Remaining Hurdle:** The lack of "full employment protection" (minimum wage, paid leave) is not due to the law prohibiting it, but due to the **economic structure** of the industry. Most sex workers in NZ operate as independent contractors (sole traders), not employees. This is true for many gig-economy workers (Uber drivers, freelancers).
  *   **The Difference:** In a regulated model (Germany), the state *mandates* specific rules. In a decriminalized model (NZ), the workers *negotiate* rights. If a NZ sex worker wants employee status, they must prove an employment relationship exists. The law allows it; the market structure often resists it. However, NZ sex workers *have* successfully used the law to recover unpaid wages and sue for safety violations, which was impossible under the other two models.

  ---

  ### Strict Presuppositions vs. Compatible Theories

  You asked to distinguish what each regime *requires* versus what merely *fits* with it. This is crucial because political coalitions often support the same laws for different reasons.

  | Model | Strict Presupposition (The Logic) | Compatible Theories (The Politics) |
  | :--- | :--- | :--- |
  | **Nordic** | **The transaction is inherently exploitative.** The state must intervene to stop the exploitation, regardless of the seller's stated preference. | **Radical Feminism:** Patriarchy makes consent impossible.<br>**Social Conservatism:** Sex outside marriage is immoral/degrading.<br>**Abolitionism:** All prostitution is trafficking-adjacent. |
  | **Regulation** | **The trade is inevitable and risky.** The state must manage the risk to protect the public and the worker. | **Public Health Utilitarianism:** Reduce STIs and crime.<br>**Pragmatism:** "It happens anyway, let's tax it."<br>**Moral Toleration:** We don't like it, but we won't ban it. |
  | **Decrim** | **Criminal law is the wrong tool.** The harms are caused by legal status, not the work itself. | **Libertarianism:** Body autonomy and free contract.<br>**Sex-Positive Feminism:** Work is work; stigma is the enemy.<br>**Harm Reduction:** Safety is prioritized over morality. |

  **Example of Divergence:** A Social Conservative and a Radical Feminist can both vote for the **Nordic Model**, but their presuppositions differ. The Conservative thinks the sex is sinful; the Feminist thinks the power dynamic is coercive. The law works for both because it criminalizes the buyer, but their *theories* of why are incompatible.

  ---

  ### Logical Conclusions: What would the "Genuine" regimes look like?

  If we push each model to its logical extreme, based strictly on its presuppositions, we get the following architectures:

  #### 1. A Genuine "Sex Work is Work" Regime (Decriminalization+)
  *Current NZ model is close, but a "pure" version would go further.*
  *   **Labor Law:** Explicit presumption of **employee status** for anyone working in a managed venue (brothel/agency), shifting the burden to the employer to prove contractor status. This solves the "gig economy" loophole.
  *   **Zoning:** No specific zoning restrictions. A brothel is treated like a massage parlor or salon.
  *   **Health:** No mandatory testing. Health is managed via occupational safety standards (e.g., mandatory provision of condoms/barriers by the employer), same as PPE in construction.
  *   **Banking/Housing:** Explicit anti-discrimination protections preventing banks or landlords from denying service based on income source (a major current hurdle).
  *   **Visas:** Work visas available for migrant sex workers (currently a huge gap; most decrim models still ban migrant sex work, which pushes it underground).

  #### 2. A Genuine "Inherently Harmful" Regime (Nordic+)
  *Current Nordic model is often compromised by lack of exit funding. A "pure" version would be more aggressive.*
  *   **Demand Reduction:** Aggressive policing of buyers, including "john schools" and public shaming registries.
  *   **Exit Services:** Mandatory, fully funded exit programs for sellers. The state treats the seller not just as unpunished, but as a ward requiring rehabilitation.
  *   **Digital Ban:** Criminalization of online advertising for sex (to reduce market visibility), treating platforms as accomplices.
  *   **No Distinction:** No legal distinction between "forced" and "voluntary" trafficking. All third-party involvement (pimps, agencies, even cooperative collectives) is criminalized as "procuring," because facilitating the harm is itself harmful.

  #### 3. A Genuine "Managed Market" Regime (Regulation+)
  *Current German model is a hybrid. A "pure" version would lean into the "hazardous industry" view.*
  *   **State Monopoly:** The state might run the brothels directly (as in some historical models) to ensure total compliance, removing private profit motive which incentivizes cutting corners.
  *   **Strict Licensing:** Revocable licenses for workers based on health or conduct.
  *   **Mandatory Insurance:** Specific liability insurance for sex work, distinct from general business insurance, acknowledging the unique risk profile.
  *   **Segregation:** Strict enforcement of "tolerance zones," ensuring the trade is visible to the state but invisible to the general public.

  ### Summary for the Engineer
  *   **Nordic:** Treats the transaction as a **security vulnerability** in the social fabric. The seller is the compromised system; the buyer is the attacker. Patch the vulnerability by blocking the attacker.
  *   **Regulation:** Treats the transaction as **legacy code** that can't be refactored out. Wrap it in a sandbox (zoning), monitor logs (health checks), and charge API fees (taxes).
  *   **Decriminalization:** Treats the transaction as **open source**. Remove the DRM (criminal law), let the community self-govern via standard protocols (labor law), and fix bugs (violence) through standard support tickets (police/courts).

  The incoherence you sense in the Nordic model is a feature, not a bug: it is a **paternalistic override** of liberal agency. The incoherence you sense in the German model is **technical debt**: they layered regulation over stigma without refactoring the underlying moral view. The incoherence in the NZ model is **implementation lag**: the legal API changed, but the economic libraries (labor market structures) haven't fully updated to use it.
