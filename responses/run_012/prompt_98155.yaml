          2.  *Foresight Gap:* Human act exists, but harm wasn't reasonably foreseeable (no blame).
          3.  *Standing Gap:* Knowledge/Authority mismatch (those who know can't act, those who act don't know).
      *   **The Scenario:** Meridian Health adaptive dosing model. Fatal dose to rare subpopulation. Nurse sees anomaly but can't override. Pharmacist approves but doesn't see inputs. Vendor owns weights.
      *   **The Prompt:** Which gap is doing the work? What do the other two get wrong? Does the human-in-the-loop (HITL) remedy address the gap?
      *   **The Student Answer:** Argues it's a *Tracing Gap*. Dismisses *Foresight Gap*. Argues HITL works *if* authority is fixed, but identifies the real issue as diffusion/standing issues masked as tracing.
