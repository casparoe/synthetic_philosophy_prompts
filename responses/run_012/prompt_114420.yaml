      *   *Unfalsifiability:* The view relies on "transparency." In the real world, transparency is never perfect. If the theory only works at 100% transparency, is it useful?

  6.  **Refining the "Crazy Verdict":**
      *   *Scenario:* The "Bargaining Chip" or "Commitment Race."
      *   *Setup:* Two LDT agents. Agent A publicly commits to "Demand 99% of the pot, else Defect." Agent B, knowing A is an LDT agent and A has committed, must calculate: Cooperate (get 1%) or Defect (get 0%). LDT says Cooperate.
      *   *Why it's crazy:* It rewards the agent who makes the most aggressive, irrational-seeming commitment. It creates a race to pre-commit to craziness.
