  8.  **Final Polish:** Ensure terminology is precise (Program Equilibrium, Löbian Cooperation, CDT vs. LDT, Robustness). Make sure to distinguish between the specific "CliqueBot" strategy the user described and the broader class of "Logical Decision Theories" they seem to be endorsing. The user's specific strategy ("if same program") is actually the weakest link, so I need to press hard on that while acknowledging the stronger versions.

      *(Self-Correction during drafting)*: I should be careful not to conflate Program Equilibrium (Tennenholtz) with FDT (Yudkowsky/Soares). They are related but distinct. The user's description is closer to Tennenholtz's Program Equilibrium with CliqueBot. I should address CliqueBot's specific fragility first, then broaden to LDT for the philosophical implications.

      *Key Insight:* The "Referee" isn't just a mediator; it solves the Halting Problem. Without it, the game is ill-defined. This is a major "Fatal" point.

