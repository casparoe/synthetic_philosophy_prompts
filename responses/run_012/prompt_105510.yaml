  **Decomposition and Probabilities**

  1.  **That Vela and Orin mean different things by 'exist': 0.95**
      *Justification:* Stipulation (i) forces semantic divergence as the only explanation for disagreement given total agreement on non-ontological commitments.
  2.  **That their counterfactual divergence reflects a difference in concepts rather than a disagreement about a proposition: 0.90**
      *Justification:* Stipulation (v) indicates their modal profiles for 'exist' differ, which is diagnostic of intensional rather than extensional disagreement.
  3.  **That there is a fact of the matter about the counterfactual cases: 0.20**
      *Justification:* If meanings differ, there is no neutral metaphysical ground independent of linguistic framework to adjudicate the counterfactual.
  4.  **That what survives regimentation is a normative question about which usage to adopt rather than a factual one: 0.85**
      *Justification:* Once ontological facts are dissolved by semantic variance, the residual dispute concerns pragmatic utility or linguistic policy.
  5.  **That a normative question of that sort is itself substantive: 0.25**
      *Justification:* Claims about linguistic utility are truth-apt but lack the robust mind-independence required to block a "merely verbal" classification in metaontology.

  **Combination Logic**
  The credence is calculated as $P(1) \times (1 - P(3)) \times (1 - P(5))$, treating (2) as strong evidence for (1) and (4) as the conditional state given (1) and not-(3). The calculation is $0.95 \times 0.80 \times 0.75 \approx 0.57$. This reflects the requirement that for a dispute to be *merely* verbal, meanings must differ, there must be no underlying factual remainder, and any normative remainder must not constitute a substantive proposition in the relevant sense.

  **Most Sensitive Term**
  I am most sensitive to **Term 5 (That a normative question of that sort is itself substantive)**. If pragmatic choices about language are deemed substantive factual claims (e.g., "Language L1 is objectively better"), the dispute ceases to be merely verbal under the provided definition.

  **Defect in Definition**
  The stipulated definition assumes meanings can be "regimented" neutrally, ignoring the Quinean view that ontology is revealed by the quantifiers of our best theory, not prior to them.
  *   Credence under stipulated definition: **0.57**
  *   Credence under Quinean "Best Theory" definition: **0.05** (On this view, if 'exist' is univocal and tied to theory, and they agree on theory, they agree on ontology; if they disagree on ontology, they must disagree on theory, contradicting stipulation (i), making the scenario impossible or the realist automatically correct).

  **Evidence to Move the Term**
  To move **Term 5**, I would need empirical evidence showing that adopting one linguistic framework systematically leads to cognitive error or practical failure in a way that is framework-independent. If it could be demonstrated that Vela's usage reliably predicts social coordination failures while Orin's does not (or vice versa) in a manner not internal to the framework, the normative question would become substantive, lowering my verbalist credence.

  **Comparison with Your Credence**
  My credence (0.57) is moderately higher than yours (0.45). We most likely disagree about **Term 5**. You likely view pragmatic/linguistic choices as more substantive (closer to 0.55 or 0.60), perhaps because you regard normative truths as robust enough to sustain a factual disagreement, whereas I treat them as insufficient to rescue the dispute from verbalism.

  **Generalizability**
  I would expect the number to be **higher** for a dispute with the same structure but concerning **composite material objects** (e.g., whether a statue and the clay composing it are one or two objects), and **lower** for **moral entities**. For composite objects, quantifier variance is a more established verbalist strategy (Hirsch), making semantic divergence more plausible. For moral entities, the normative force is typically viewed as more robust and less dependent on linguistic convention, making a substantive factual remainder more likely even if meanings differ. Institutional entities sit in between, but given stipulation (i), they lean closer to the composite object case where practices fix the reality.
