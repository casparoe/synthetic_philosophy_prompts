answer: |-
  **The Procedure (20 Minutes)**

  **Step 1: Verify the Disagreement Point ($D$).**
  *Question:* "If you leave today with no deal, what is your score?"
  *Answer:* The sum of points each party assigned to their fallback on the intake form.
  *Stop:* If parties disagree on what the fallback *is* (e.g., who keeps the status quo), pause mediation. This is a legal fact, not a calculation.

  **Step 2: Verify the Ideal Point ($I$).**
  *Question:* "If you got every item you claimed, what is your score?"
  *Answer:* Normally 100 (since they spread 100 points). If they assigned points to outcomes impossible to grant jointly, cap at 100.
  *Judgment Call:* Adjusting impossible ideals to 100.

  **Step 3: Calculate Maximum Gain ($G$).**
  *Arithmetic:* $G = I - D$. This is the most utility a party can hope to gain from mediation.

  **Step 4: Set the Target Ratio.**
  *Rule:* Both parties must achieve the same percentage of their Maximum Gain.
  *Arithmetic:* Find an allocation where $(\text{Actual Gain}_A / G_A) = (\text{Actual Gain}_B / G_B)$.
  *Judgment Call:* Assigning point values to specific items (cash vs. name) to match the ratio.

  **Step 5: Allocate Items.**
  *Action:* Distribute disputed items until the Target Ratio is met.
  *Stop:* If items are indivisible (e.g., a house) and no split matches the ratio, return to haggling. The math cannot force physical division.

  ***

  **Case 1: Design Studio Dissolution**
  *Parties:* Founder A (Strong BATNA), Founder B (Weak BATNA).
  *Items:* Cash, List, Name, Non-compete.

  1.  **Disagreement ($D$):** A scores her fallback (client offer) at 70. B scores his fallback (nothing) at 10.
  2.  **Ideal ($I$):** Both score "winning everything" at 100.
  3.  **Max Gain ($G$):** A can gain 30 points ($100-70$). B can gain 90 points ($100-10$).
  4.  **Target Ratio:** To equalize percentage gain, B must receive three times the absolute utility gain of A.
  5.  **Allocation:** The mediator assigns the Client List and Cash to B (high value to him, low cost to A who has outside work). A takes the Name and Non-compete.
  *Result:* A ends with 80 points (gain of 10, 33% of $G$). B ends with 40 points (gain of 30, 33% of $G$).
  *Outcome:* The procedure validates A's strong fallback by requiring less absolute compensation to reach "equity," leaving B with the bulk of the studio assets to compensate for his weak position.

  **Case 2: Three Siblings and the Estate**
  *Parties:* Sibling 1 (Occupant), Sibling 2, Sibling 3.
  *Items:* House (indivisible), Car, Care Obligation.

  1.  **Disagreement ($D$):** Forms submitted.
  2.  **Ideal ($I$):** Forms submitted.
  3.  **Max Gain ($G$):** Calculated.
  4.  **Target Ratio:** **HALT.**
  *Failure:* The procedure is dyadic. There is no single line from disagreement to ideal in three-dimensional utility space that volunteers can compute in 20 minutes. Furthermore, the House is indivisible. You cannot allocate 0.33 of a house to match a utility ratio without selling it, which contradicts the intake data assuming retention.
  *Outcome:* The procedure fails. You must revert to item-by-item haggling or sell the assets.

  ***

  **What This Procedure Cannot Do**

  1.  **Ignore Irrelevant Alternatives:** The Kalai–Smorodinsky solution violates Independence of Irrelevant Alternatives. If you add a dummy option to the intake form that nobody wants, it changes the "Ideal Point," shifting the recommended split for the actual items. Your volunteers will produce different recommendations for the same case depending on how many dummy options are listed.
  2.  **Handle Third Parties:** As seen in Case 2, the geometry breaks down with $N > 2$. Your clinic intake assumes dyads; this math cannot scale to families without significant complexity.
  3.  **Resolve Indivisibilities:** The solution assumes a convex feasible set (smooth trade-offs). Real property (houses, cars) creates a stepwise frontier. The "line" often misses the frontier entirely, requiring arbitrary rounding that undermines the mathematical justification.
  4.  **Compare Utilities Interpersonally:** The procedure assumes 100 points for Party A equals 100 points for Party B. In reality, a distressed sibling may value stability differently than a speculative one. The math treats these as equivalent units of value, which is a judgment call disguised as measurement.
  5.  **Ethical Neutrality:** The solution is monotonic: if a party's opportunities improve (better BATNA), their share increases. In family or employment disputes, rewarding the party with the strongest outside option may feel like punishing vulnerability. If your clinic's mission is equity rather than efficiency, this formula may contradict your values.

  **Recommendation:** Do not adopt this as a standard recommendation engine. Use it only as a private check for the mediator to see if a proposed deal is roughly proportional to potential gains. For actual recommendations, stick to facilitated haggling.
