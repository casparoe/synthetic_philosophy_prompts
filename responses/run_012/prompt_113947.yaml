  2.  **Deconstruct the Kalai-Smorodinsky (KS) Solution:**
      *   **Inputs:** Disagreement point ($d$), Ideal point ($u^*$), Feasible Set ($S$).
      *   **Mechanism:** Draw a line from $d$ to $u^*$. The solution is the intersection of this line with the Pareto frontier of $S$.
      *   **Properties:** Monotonicity (if opportunities expand for a player, they do better), Symmetry (if symmetric, equal split), Scale Invariance.
      *   **Violation:** Independence of Irrelevant Alternatives (IIA). Adding an option nobody chooses can change the outcome.
      *   **Constraint Check:** The prompt mentions "two-party cases" generally, but Case 2 involves *three* siblings. KS is defined for $n$ players, but the clinic's intake/process seems geared for two-party (prompt says "forty two-party cases... two-person businesses... cohabiting couples"). Case 2 explicitly introduces a third party. This is a critical failure point for the proposed procedure if it's designed for two parties.
      *   **Intake Form:** Parties spread 100 points across items + fallback. This implies utility is measurable and comparable across parties (interpersonal utility comparison), which is theoretically shaky but practically common in scoring systems. KS requires utility spaces.
      *   **Feasible Set:** In mediation, the feasible set is usually the set of all possible allocations of the items. With discrete items (house, car), the frontier is stepwise, not smooth.

  3.  **Drafting the Procedure (20 minutes, volunteer-friendly):**
      *   Need to simplify the math. No graphing.
      *   Step 1: Verify Disagreement Point ($d$). What happens if mediation fails? (From forms).
      *   Step 2: Determine Ideal Points ($u^*$). What does each get if they win everything? (From forms).
      *   Step 3: Normalize. Since parties allocate 100 points total, utilities are roughly 0-100.
      *   Step 4: Calculate the KS ratio. The line from $d$ to $u^*$ implies a proportional gain over disagreement. $(u_1 - d_1) / (u^*_1 - d_1) = (u_2 - d_2) / (u^*_2 - d_2)$.
      *   Step 5: Find allocation on frontier that matches this ratio.
      *   *Correction:* Volunteers can't compute frontiers easily. They need a heuristic. "Split the surplus proportionally to the maximum possible surplus."
      *   *Critical Stop:* If items are indivisible (house), arithmetic fails. Needs value judgment.

  4.  **Drafting the Cases:**
