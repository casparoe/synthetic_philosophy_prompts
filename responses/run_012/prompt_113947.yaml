      *   IIA violation (adding dummy options changes outcome).
      *   Third parties (procedure breaks).
      *   Indivisibilities (house).
      *   Fallback advantage (KS rewards better BATNA, which might feel unjust in family/egalitarian contexts).
      *   Utility comparability (100 points from Person A != 100 points from Person B).

