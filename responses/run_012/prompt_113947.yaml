          *   Fallbacks differ. KS should reward the one with better fallback (monotonicity).
          *   Calculation: Show the proportional gain.
      *   **Case 2 (Siblings):** 3 Parties.
          *   *Problem:* KS works for $n$ players, but the intake/form procedure described is "two-party". The prompt says "forty two-party cases" but then asks for a three-sibling case. This is a trap/test. The procedure *must* fail or require significant adjustment for 3+ parties.
          *   *Problem:* Indivisible house. KS assumes divisible utility or a convex set. Discrete items make the "line intersection" ambiguous.
          *   *Problem:* Care obligation (negative utility).

