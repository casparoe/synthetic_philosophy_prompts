      *   *Section 1 (Question a):* Preference vs. Judgment. Define the "Synchronic Constraint" on akrasia. Show how discounting models *diachronic inconsistency*, which is necessary but not sufficient for akrasia. Use the "Judgment-Proof" case.
      *   *Section 2 (Question b):* Naive/Sophisticated vs. Continent/Incontinent. Use the Ulysses example. Show that sophistication is a *strategy* to manage predicted incontinence, not a form of continence itself.
      *   *Section 3 (Question c):* Distorted Judgment. Distinguish between *discounting value* (time preference) and *misperceiving value* (cognitive distortion). Introduce the "Hot/Cold" gap.
      *   *Conclusion:* Summarize the conceptual map. Economics gives the *dynamics of temptation*; Philosophy gives the *structure of agency*.

  6.  **Refine the Content (Self-Correction/Nuance Check):**
