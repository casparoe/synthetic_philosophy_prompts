      *   *Check:* Is the distinction between "inconstancy" and "incontinence" clear? Inconstancy = changing mind. Incontinence = keeping mind, losing control.
      *   *Check:* Davidson's "All-Things-Considered" judgment is crucial here. Must mention that.
      *   *Check:* For (c), ensure I distinguish between the Socratic view (no akrasia exists, it's all ignorance) and the Aristotelian view (akrasia exists, but distinct from ignorance). The prompt asks about the case where judgment *is* bent. That leans towards a specific subtype of akrasia or a rival explanation. I should frame it as "Akrasia proper" vs. "Socratic Ignorance."

  7.  **Final Polish:** Ensure clear headings, logical flow, and precise terminology. (e.g., using "synchronic" vs "diachronic", "normative judgment" vs "revealed preference").

  *(Self-Correction during drafting)*: I need to be careful not to say hyperbolic discounting *cannot* explain akrasia. Many philosophers (e.g., Elster, Ainslie) use it to explain it. The point is that the *standard model* describes preference reversal, whereas the *philosophical definition* requires judgment-action mismatch. The reconciliation is that hyperbolic discounting creates the *conditions* for the mismatch, but the mismatch itself is a further psychological fact (the agent maintains the long-term judgment despite the short-term preference shift). I must make this distinction sharp.

