answer: |-
  This is a precise and well-formed problem. You have identified the fault line between *descriptive models of choice* (behavioral economics) and *normative models of agency* (philosophy of action). As a physicist, you will recognize this as a conflict between a model of system dynamics (how preferences evolve over $t$) and a definition of state integrity (the relationship between judgment and action at $t_n$).

  Here is the conceptual geography you requested, addressing your three specific points.

  ### (a) Diachronic Preference Reversal vs. Synchronic Judgment-Action Mismatch

  You are correct to suspect that these are distinct phenomena. In the philosophical literature, this is the distinction between **inconstancy** (changing one's mind) and **incontinence** (acting against one's mind).

  **The Economic Model (Hyperbolic Discounting):**
  This models the value function $V$ of a reward $A$ at delay $D$.
  $$V(A, D) = \frac{A}{1 + kD}$$
  Because the curve is steeper near $D=0$, the intersection of two value curves (Small/Sooner vs. Large/Later) shifts as time passes. At $t_1$, $V_L > V_S$. At $t_2$ (closer to reward), $V_S > V_L$.
  In standard revealed preference theory, **preference is defined by choice.** If you choose $S$ at $t_2$, you *prefer* $S$ at $t_2$. On this model, there is no conflict at $t_2$. There is only a sequence of consistent choices driven by a time-varying utility function. This is **inconstancy**.

  **The Philosophical Model (Davidsonian Akrasia):**
  Following Donald Davidson's seminal *How is Weakness of the Will Possible?* (1970), akrasia requires a **synchronic contradiction**.
  1.  Agent judges that, all-things-considered, $L$ is better than $S$ at $t_2$.
  2.  Agent intentionally chooses $S$ at $t_2$.

  For the philosopher, if the agent's judgment shifts at $t_2$ to match the choice ("Actually, $S$ is better right now"), it is not weakness of will; it is a change of opinion. Weakness of will requires that the long-term judgment *persists* into the moment of temptation but fails to determine the action.

  **The Relation:**
  Diachronic preference reversal is the **mechanism of temptation**, but not the **definition of akrasia**.
  *   **Case 1 (Pure Inconstancy):** The agent's judgment tracks their discounting curve perfectly. At $t_2$, they genuinely believe $S$ is better. They are rational but time-inconsistent. No akrasia.
  *   **Case 2 (Strict Akrasia):** The agent's discounting curve flips (they *want* $S$ more), but their normative judgment does not flip (they still *believe* $L$ is better). They act on the want, not the belief.

  **The Boundary Case:**
  The distinction is forced when we ask: *Can the agent articulate the better judgment at the moment of action?*
  If the agent says, "I know I shouldn't eat this, but I want to," we have akrasia (Judgment $\neq$ Action).
  If the agent says, "I know I shouldn't eat this, but actually, given how tired I am, this is the right choice now," we have inconstancy (Judgment $=$ Action, but Judgment$_{t1} \neq$ Judgment$_{t2}$).
  Hyperbolic discounting explains why the *want* flips. It does not explain why the *judgment* sometimes fails to flip along with it. That gap is the space of the will.

  ### (b) Naive/Sophisticated vs. Incontinent/Continent

  This distinction cuts across the traditional moral psychological categories. It maps **meta-cognition about time** against **volitional control over desire**.

  **The Economic Distinction:**
  *   **Naive Discounter:** Believes their future preferences will match their current long-term preferences. They do not precommit. They are surprised by their future self.
  *   **Sophisticated Discounter:** Anticipates the preference reversal. They engage in precommitment (Ulysses contracts) to restrict their future choice set.

  **The Philosophical Distinction:**
  *   **Incontinent (Akratic):** Acts against their better judgment.
  *   **Continent (Enkratic):** Has a desire contrary to their better judgment but acts *with* their better judgment.

  **The Cross-Cutting:**
  1.  **Sophisticated $\neq$ Continent.**
      The sophisticated agent precommits precisely because they know they *lack* continence. Ulysses tying himself to the mast is not an act of continence (resisting the Sirens while unbound); it is an admission that continence will fail. Sophistication is a *strategic workaround* for predicted incontinence. It bypasses the will rather than strengthening it.
      *   *Case:* An agent locks their liquor cabinet at 8 AM. At 8 PM, they cannot drink. They are sophisticated. Are they continent at 8 PM? No, because there is no choice to be made. The conflict was offloaded to 8 AM.

  2.  **Naive $\approx$ Incontinent (but not identical).**
      The naive agent arrives at $t_2$ and succumbs. They are usually incontinent *at $t_2$*. However, a naive agent could theoretically be continent (they feel the pull of $S$, judge $L$ better, and choose $L$, despite having failed to anticipate the pull).
      Conversely, a naive agent might not be incontinent if their judgment shifts (see Case 1 above). They are merely inconsistent.

  **The Boundary Case:**
  Consider an agent who anticipates their weakness (Sophisticated) but refuses to precommit on principle, believing they should be able to resist in the moment.
  *   If they resist: They are Sophisticated and Continent.
  *   If they fail: They are Sophisticated and Incontinent.
  This shows that Sophistication is an epistemic state regarding one's own psychology, while Continence is a volitional state regarding one's actions. The economic model focuses on *managing the constraint*; the philosophical model focuses on *overcoming the constraint*.

  ### (c) Distorted Judgment vs. Defect of Will

  This is the most subtle area, touching on the Socratic vs. Aristotelian debate. You ask about the case where proximity bends the *judgment* itself (e.g., "The cake looks healthy now," or "One drink won't hurt").

  **The Discounting Framework Limitation:**
  Standard hyperbolic discounting assumes the magnitude $A$ is constant and only the weight changes due to $D$. It models **temporal myopia**, not **evaluative distortion**.
  To model your case, the framework must be expanded to include a "hot/cold empathy gap" or affective forecasting error. Here, proximity doesn't just increase the discount rate $k$; it alters the perceived $A$.
  $$V_{perceived} = \frac{A + \delta(proximity)}{1 + kD}$$
  Where $\delta$ is a cognitive distortion term driven by arousal.

  **The Philosophical Classification:**
  1.  **Defect of Will (Strict Akrasia):** The agent sees the situation clearly (judgment is accurate) but the motivational force of desire overrides the judgment. The "force" of the passion exceeds the "force" of the reason.
  2.  **Defect of Judgment (Socratic Ignorance / Clouded Mind):** The agent's capacity to evaluate is temporarily impaired by passion. They literally do not see that $L$ is better at $t_2$.

  **How the Framework Handles It:**
  If we treat the discounting model as a complete theory of motivation, it collapses this distinction. If $V_S > V_L$ at $t_2$, the agent chooses $S$. Whether this was due to a change in $k$ (will failure) or a change in perceived $A$ (judgment failure) is behaviorally indistinguishable.

  However, to resolve your tension, we must look at **counterfactual stability**.
  *   **Will Defect:** If you ask the agent immediately *after* the action (when the "heat" dissipates), they say: "I knew it was wrong while I was doing it." The judgment was present but overpowered.
  *   **Judgment Defect:** If you ask the agent immediately after, they say: "I honestly thought it was okay at the time." The judgment was absent or altered.

  **The Conceptual Geography:**
  The discounting framework is best viewed as a model of the **structure of temptation**, not the **psychology of the agent**.
  *   Hyperbolic discounting creates the *incentive structure* where $S$ becomes salient.
  *   Whether this results in a **Defect of Will** or a **Defect of Judgment** depends on the agent's cognitive architecture (specifically, the coupling between the affective system and the evaluative system).

  **The Forced Distinction:**
  The case that forces the distinction is **Post-Action Regret vs. Post-Action Rationalization**.
  *   If the agent feels *guilt* (acknowledging the norm was violated), the judgment was intact. This is a defect of will. The discounting model explains the *pull*, but not the *capitulation*.
  *   If the agent feels *relief* or *confusion* (maintaining the norm was not violated), the judgment was bent. This is a defect of judgment. The discounting model must be modified to include perceptual noise to account for this.

  ### Summary of the Conceptual Map

  1.  **Preference Reversal $\neq$ Akrasia.** Reversal is diachronic inconsistency (economic). Akrasia is synchronic conflict between judgment and action (philosophical). Discounting explains the former; it only causes the latter if the agent's normative judgment fails to update to match their discounted preferences.
  2.  **Sophistication $\neq$ Continence.** Sophistication is knowing you will be incontinent. Continence is not being incontinent. Sophistication leads to precommitment (avoiding the test of will); Continence leads to resistance (passing the test of will).
  3.  **Discounting vs. Distortion.** Standard discounting models changes in *weight* over time. It does not model changes in *perception* of value. To capture defects of judgment, the model requires an additional variable representing affective distortion of the input parameters.

  The tension you feel arises because economics treats the agent as a **single locus of preferences** evolving over time, while philosophy of action treats the agent as a **hierarchy of systems** (judgment vs. desire) that can conflict at a single moment. Hyperbolic discounting explains why the lower system (desire) gets louder; it does not explain why the higher system (judgment) sometimes remains silent, and sometimes speaks but is ignored.
