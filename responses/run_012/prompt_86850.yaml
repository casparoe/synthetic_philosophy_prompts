      *   **Core Argument:** The case must show an emotion with *evaluative content* that is *non-propositional*.
      *   **Conditions:**
          *   (a) Feeling View: Must count it as an emotion (bodily arousal present).
          *   (b) Perception View: Must count it as an emotion (non-inferential appearance of value).
          *   (c) Judgement View (Solomon/etc.): Must be forced to deny it's an emotion OR stretch "judgement" beyond recognition.
      *   **Crucial Constraint (The "Crux"):** The subject has an emotion directed at an object, but there is *no property* she takes the object to have. No assent, no inference, no defense. The judgement view fails because there's no propositional attitude to latch onto.
      *   **Realism Constraints:** One paragraph, ordinary adult, kitchen/bus/office. No pathologies (lesions, drugs, etc.). No standard recalcitrance (knowing X but feeling Y). No self-deception.
      *   **Evidence Constraint:** The lack of judgement must be observable externally (inferences, muttering, concessions), not just introspective testimony.
      *   **Object-Directed:** Must be about something specific (not a mood).
      *   **Full-Blooded Emotion:** Must look like a real emotion to observers.
      *   **Output:** The case (1 paragraph) + Analysis (Verdicts, Working Feature, Counterfactual, Strongest Objection).
      *   **Warning:** Do not stipulate verdicts; build the case so the verdicts follow.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Judgement View:* Emotion = Judgement that X is F (e.g., "I judge this dog dangerous").
      *   *Perception View:* Emotion = Perceiving X as F (e.g., "The dog looks dangerous," even if I don't believe it).
      *   *The Gap:* Usually, people argue via *recalcitrant emotions* (I judge it safe, but I feel fear). The prompt explicitly bans standard recalcitrance ("she knows the spider's harmless but...").
      *   *The Challenge:* I need a case where the subject *doesn't even form the judgement* that matches the emotion, nor does she hold the contradictory judgement. She is in a state of *evaluative suspension* or *pre-conceptual engagement* where the emotion is active, but the cognitive machinery for judgement is absent or bypassed.
      *   *Key Insight:* The prompt asks for "no property she takes that thing to have." This suggests a situation where the evaluative content is *phenomenal* but not *doxastic*. It needs to be a moment of *arrest* where action and feeling outpace conceptualization.
      *   *Idea:* A moment of sudden, sharp reaction to something ambiguous where the person reacts *as if* it has value, but refuses to categorize it even after the fact, not out of stubbornness, but because the categorization doesn't fit.
      *   *Refining the Idea:* It can't be "I don't know if it's dangerous." That's uncertainty. It needs to be "I am reacting to it as [Value], but I am not committing to the proposition that it is [Value]."
      *   *Better Idea:* *Aesthetic/Disgust overlap?* No, needs to be a standard emotion.
      *   *Better Idea:* *Sudden loss/absence?*
      *   *Best Idea:* **The "Missing Object" or "Phantom Trigger" within a realistic frame.** Wait, no fictional objects allowed.
      *   *Best Idea:* **The "Unassimilated Violation."** A situation where the normative landscape shifts, but the subject hasn't updated their beliefs yet.
      *   *Wait, the constraint is stronger:* "Nothing she'd assent to, nothing she'd infer from, nothing she'd defend."
      *   *Scenario:* A parent watching a child take a risk? No, they judge it dangerous.
      *   *Scenario:* **The "Uncanny/Off" feeling in a social setting.**
      *   *Scenario:* **The "Sudden Drop" (Elevator/Bus).** Physical sensation + Fear. But usually, they judge "I might fall."
      *   *Scenario:* **The "Intrusive Memory" trigger.**
      *   *Let's try: The "Hesitation at the Threshold."*
      *   *Let's try: The "Broken Promise" that hasn't been processed.*
      *   *Let's focus on the "No Property" constraint.* This is the hardest part. If I am angry, I judge you offended me. If I am afraid, I judge you threaten me. How can I be angry/afraid without judging the offense/threat?
      *   *Answer:* **Pre-reflective arousal that guides attention before conceptualization locks in.** The case needs to capture the *moment* of emotion before the judgement forms, but sustained long enough to be an "episode."
      *   *Revised Strategy:* The subject is in a state of **evaluative bewilderment**. She is reacting to something as *significant*, but she explicitly lacks a conceptual handle on *why*.
