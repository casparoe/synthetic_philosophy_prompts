      *   *Problem:* Too cognitive.
      *   *Idea:* **The "Aesthetic Revulsion" that isn't aesthetic.**
      *   *Let's go with the "Ambiguous Social Signal" but tighten the constraints.*
      *   *Subject:* Elena. *Setting:* Office breakroom.
      *   *Event:* Mark makes a joke. Everyone laughs. Elena's stomach drops, she grips her mug (Feeling). She leaves the room (Action).
      *   *The Crux:* When asked later, she doesn't say "It was offensive." She doesn't say "It was unsafe." She says, "I just couldn't stay." She doesn't infer Mark is a jerk. She doesn't defend the claim the joke was bad. She treats Mark *as* someone to avoid, but assigns no predicate to him.
      *   *Is this recalcitrance?* No, because she isn't asserting "The joke was fine." She is asserting *nothing* about the joke's quality. She is agnostic on the proposition, but committed on the reaction.
      *   *Judgement View:* Must say she judged it offensive.
      *   *Evidence against:* She explicitly withholds that judgement when pressed, not out of denial, but because she feels it doesn't capture the state. She says "It's not that he was wrong, I just... couldn't."
      *   *Perception View:* She perceived the situation *as* intolerable (value property) without judging it *to be* intolerable.

      *   *Wait, one more check:* "Nothing she'd assent to, nothing she'd infer from, nothing she'd defend."
      *   If she avoids him, doesn't that imply she infers "Being near him is bad"?
      *   Yes, but that's a practical inference, not an evaluative judgement about *him*.
      *   The Judgement View requires the emotion to *be* the judgement (e.g., "He is offensive").
      *   If she refuses to assent to "He is offensive," the Judgement View struggles.
      *   *Refining the "No Property":* It needs to be about the *object* of the emotion. If the emotion is anger at Mark, the property is "offensiveness." If she denies/withholds "Mark is offensive," Judgement View says "No anger."
      *   *How to make it full-blooded?* The physiological response must be strong.
      *   *Let's try to make the property *indeterminate*.*
      *   *Case:* **The "Uncanny Valley" Social Interaction.**
      *   *Subject:* David. *Setting:* Bus stop.
      *   *Event:* A stranger stands too close. Not threateningly. Just... off.
      *   *Reaction:* David's skin crawls (Feeling). He moves away (Action). He watches the stranger (Attention).
      *   *The Crux:* David does not think "He is dangerous." He does not think "He is rude." He thinks "He is *wrong*." But "wrong" isn't a property he can defend. If asked, "Is he dangerous?" David says "No." "Is he rude?" David says "Not exactly." "Then why move?" David says "I just had to."
      *   *Why this works:* It isolates the *evaluative feel* (the "awfulness" of the proximity) from the *conceptual categorization* (danger/rudeness).
      *   *Judgement View:* Must claim David judged "This proximity is bad/dangerous/rude."
      *   *Counter:* David explicitly denies those specific predicates. The Judgement theorist must say he judged "It is bad-in-some-undefined-way." But that stretches 'judgement' to mean 'felt inclination'.
      *   *Perception View:* David perceives the proximity *as* violating (non-conceptual content).
      *   *Feeling View:* David feels arousal.

      *   *Drafting the Paragraph:*
      *   Focus on the *withholding* of the judgement while maintaining the *reaction*.
      *   Make sure it doesn't look like repression. He's not hiding the thought; the thought isn't there.
      *   Make sure it's not a mood. It's directed at the stranger.

  3.  **Drafting the Case (Iterative Process):**
      *   *Attempt 1:* David is on the bus. A man stands near him. David feels sick. He moves. He doesn't think the man is dangerous. He just feels he is.
      *   *Critique:* Too close to recalcitrance ("He doesn't think he's dangerous").
      *   *Attempt 2:* David is on the bus. A man stands near him. David feels sick. He moves. When asked, he says "I don't know what it was." He doesn't infer the man is creepy. He just avoids him.
      *   *Critique:* Better. Need to emphasize the *lack of property*.
      *   *Attempt 3 (Final Polish):* Focus on the specific lack of propositional commitment. He treats the man as a source of aversion without categorizing the aversion.

  4.  **Analyzing the Verdicts:**
      *   *Feeling View:* Passes easily (gut clench, moving away).
      *   *Perception View:* Passes easily (appears as 'to-be-avoided' without belief).
      *   *Judgement View:* Fails. To call it fear/revulsion, they need a judgement ("He is dangerous/repellent"). David explicitly withholds this. If they say "He judged it 'bad'", 'bad' is doing no work.
      *   *Working Feature:* The dissociation between *action-tendency/phenomenology* and *propositional commitment*.
      *   *Counterfactual:* If David *did* think "He looks dangerous," it becomes recalcitrance (if he also believes he's safe) or standard fear (if he believes he's unsafe). The lack of *any* belief is key.
