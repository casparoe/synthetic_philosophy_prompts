      *   **Focus on Step 4:** Distinguish between "is isomorphic to" and "implements."
      *   **The "As If" vs. "Real" distinction:** A flame minimizes VFE *as if* it had a model. But it lacks the *separation* required for the model to be *about* the world in a semantic sense.

  6.  **Develop the "Cost" Analysis:**
