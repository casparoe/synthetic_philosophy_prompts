prompt: |-
  I work in functional safety, so my whole professional vocabulary is built around the idea that "does this work?" is never a yes/no. You take a system, work out the worst credible thing it can do to someone, and assign it an integrity level; the nastier the credible consequence, the smaller the probability of failure per hour you have to demonstrate, and past some point the only honest answer is that the residual risk has to be as low as reasonably practicable, which is a cost-benefit argument, not a measurement. So in my world a claim that a thing "works" always comes with a target it was argued to, and someone owns that argument.

  I've got a decent handle on the epistemology fight about whether knowledge depends on practical stakes. There's the contextualist line, where the standards shift with whoever is doing the attributing ("does he know?"), and the pragmatic-encroachment line, where the subject's own practical situation can move whether he knows, so a true, justified belief can fail to be knowledge because too much rides on being wrong. And there's the relevant-alternatives thing lurking around both. I want you to restate these positions in my vocabulary, as faithfully as you can, and then give me the residue report.

  Specifically: in my framework the threshold is a design choice that a person or a board owns and has to defend, and it can be wrong, but "wrong" means under- or over-specified relative to the hazard analysis, not relative to some threshold-independent fact. The philosophers seem to think there's a fact of the matter about whether a given standard is the right one for knowledge. So when you translate, does "knowledge" come out looking like "meets its integrity target," or does the translation quietly turn a normative question into an engineering parameter? And does the contextualism/encroachment split even survive translation? In my world the severity classification is set by the designer, not by the person doing the risky thing and not by whoever judges it afterward, so I genuinely can't tell whether my vocabulary has the resources to keep the attributor's standards apart from the subject's stakes. If it can't, say so plainly and tell me whether that's my framework missing something real, or a sign the dispute is thinner than it looks.

  Give it to me in American English, casual is fine, and use these sections:

  - The translation (both main positions in my terms, roughly 400-500 words total)
  - What survives the translation
  - The residue (what distorts, and what has no counterpart at all)
  - Where the residue points (your verdict, ~200 words)
