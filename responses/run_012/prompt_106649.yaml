      *Let's check the Scope:* Ledgers contain transactions regarding goods and personnel.

      *Let's check the Subject Headings:* "Slavery" might be too obvious. Let's use "Labor supply" or "Domestic economy." Actually, "Slavery—New England" is better if it's buried among "Textile mills." Let's go with "Servants" to erase the condition.

