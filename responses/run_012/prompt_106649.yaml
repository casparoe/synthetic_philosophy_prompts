      *   *Arrangement:* Series I: Business, Series II: Personal, Series III: Household.
      *   *Access Restrictions:* None, except maybe the fragile ledgers.
      *   *Subject Headings:* "Merchants," "Textile industry," "Servants" (not Enslaved people), "Women—Social conditions."
      *   *Processing Info:* The budget crime and the uncatalogued line. The reparative statement.

  4.  **Refining the Tone:**
      *   Must sound like DACS (Describing Archives: A Content Standard).
      *   Passive voice. "Materials were arranged..." "It is assumed..."
      *   Avoid adjectives that convey emotion. "Tragic" becomes "Unfortunate." "Enslaved" becomes "Laborers."
      *   The horror comes from the juxtaposition of human suffering and bureaucratic categorization.

  5.  **Drafting - Writing & Word Count Check:**
      *   Need to ensure I hit the 700-900 word range.
      *   Need to make sure the "budget crime" is clear to archivists but invisible to laypeople (e.g., "item-level description deferred").
      *   Need to make sure the "reparative" statement is hollow.

      *(Self-Correction during drafting)*: Make sure I don't accidentally explain the satire. Let the text stand. Ensure the "uncatalogued" line is very flat. Ensure the distinction between "Silas Hollis" (full name) and "John" (first name only, enslaved) is clear in the text without commentary.

      *Let's flesh out the "Budget Crime":* Often, archivists skip processing "miscellaneous" boxes because they take too long. If those boxes contain the only records of enslaved people, that's the crime. I'll phrase it as "preliminary survey indicated low research value."

      *Let's flesh out the "Reparative Gesture":* "The archives is committed to inclusive description..." followed by "updates will be made as resources allow."

      *Let's flesh out the "Uncatalogued Line":* "0.5 linear feet of uncatalogued material remains in backlog."

