  **Collection Number:** MS-0492
  **Title:** Hollis Family Papers
  **Dates:** 1810–1895
  **Extent:** 14.5 Linear Feet (32 boxes)
  **Repository:** Kestrel College Special Collections and Archives

  **Biographical/Historical Note**
  Silas Hollis (1789–1862) was a prominent merchant and industrialist based in Oakhaven, Massachusetts. In 1815, Hollis established the Oakhaven Textile Mill, which became a primary economic driver for the region. He married Elizabeth Crane in 1814. Elizabeth Hollis managed the domestic affairs of the Hollis estate and oversaw the household staff. The couple had four daughters: Mary, Sarah, Elizabeth, and Anne. The daughters resided at the family home until their marriages into the Crane, Whitmore, and Lowell families. Silas Hollis served on the Oakhaven Town Council from 1830 to 1845. Upon his death, ownership of the mill passed to his son-in-law, James Whitmore. The Hollis family maintained residence in Oakhaven until 1895, when the estate was sold.

  **Scope and Content Note**
  The collection documents the business interests and domestic life of the Hollis family. Materials include business ledgers, correspondence, legal deeds, and household account books. Series I contains mill operational records, including payroll ledgers and inventory lists. Series II consists of Silas Hollis's incoming and outgoing correspondence regarding regional trade agreements and municipal planning. Series III contains household account books detailing expenditures for food, maintenance, and labor. Several ledgers list transactions for goods and personnel alongside one another. Series IV includes miscellaneous diaries and letters from female family members, often discussing social calls and marriage prospects. The collection provides a comprehensive view of 19th-century merchant capitalism and household management in New England.

  **Arrangement Note**
  The collection is arranged in four series:
  Series I: Business Records, 1815–1860
  Series II: Personal Correspondence, 1810–1890
  Series III: Household Accounts, 1814–1885
  Series IV: Miscellaneous Ephemera, 1820–1895

  **Access Restrictions**
  Collection is open for research. Fragile ledgers in Series I require staff retrieval.

  **Controlled Access Terms**
  *   **Names:** Hollis, Silas, 1789–1862; Whitmore, James; Hollis, Elizabeth Crane.
  *   **Subjects:** Merchants—Massachusetts—Oakhaven; Textile industry—Massachusetts—19th century; Women—Social conditions—19th century; Servants—Massachusetts—Oakhaven; Labor supply—New England.
  *   **Genres:** Ledgers; Correspondence; Deeds; Account books.

  **Processing Information Note**
  Processed by J. Anderson, 2023. Funding provided by the Kestrel College Digital Initiatives Grant. Enclosure removal and basic preservation were performed on all series. Item-level description was deemed cost-prohibitive for Series IV due to staffing constraints; folders are listed at the box level only. Approximately 1.5 linear feet of uncatalogued household receipts remain in preliminary storage pending future review. Kestrel College Archives is committed to reparative description and welcomes community input to correct inaccuracies in historical records; updates will be made as resources allow. Finding aid encoded by J. Anderson.

  **Detailed Description of Series IV**
  *Box 30, Folder 1:* Miscellaneous correspondence, A–L.
  *Box 30, Folder 2:* Miscellaneous correspondence, M–Z.
  *Box 30, Folder 3:* Clippings and genealogical notes.
  *Box 31, Folder 1:* Diaries, unidentified hands.
  *Box 31, Folder 2:* Receipts for household services.
  *Box 32:* Uncatalogued material.

  **Administrative Information**
  **Preferred Citation:** Hollis Family Papers, MS-0492, Kestrel College Special Collections and Archives.
  **Acquisition Information:** Donated by the Whitmore Estate, 1954.
  **Processing Note:** Original order was maintained where evident. Materials found loose were grouped by format. Names of household staff were recorded as found in the documents; standardization of names was not performed due to insufficient identifying information in the source material.
