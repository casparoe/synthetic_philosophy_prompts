  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Career Archivist (20+ years experience, knows critical lit on archives/power).
      *   **Task:** Write a satirical finding aid for an invented collection (Hollis Family Papers).
      *   **Tone:** Deadpan, dry, standardized archival language. No winking, no explicit moralizing. The horror must emerge from the form itself.
      *   **Content Requirements:**
          *   Collection number, title, date range, extent.
          *   Sections: Biographical/Historical Note, Scope and Content Note, Arrangement Note, Access Restrictions, Controlled Access Terms, Processing Information Note.
          *   Specific Details:
              *   Biography celebrates the patriarch.
              *   Enslaved people/servants/daughters aggregated or erased.
              *   Subject headings that indict themselves.
              *   One line in processing note about uncatalogued material (flat tone).
              *   One sincere-sounding but empty "reparative" gesture.
              *   One mundane, budget-driven crime (choice to save hours that erases memory).
          *   Length: 700–900 words.
      *   **Goal:** Satire via the gap between neutral template and the reality it describes.

  2.  **Brainstorming & Conceptualization:**
      *   *What does neutral description do?* It privileges the creator (usually white, male, property-owning). It treats human beings as property or incidental labor. It categorizes trauma as "ephemera." It prioritizes intellectual control over physical reality.
      *   *The Hollis Family:* Patriarch (Silas Hollis?), Wife (Elizabeth?), Daughters (unnamed or married names?), Enslaved people (listed as "servants" or "household staff"?).
      *   *The Horror:* A ledger listing human beings as assets next to flour shipments. A letter about a runaway described as "missing inventory." A daughter's diary categorized as "Miscellaneous Correspondence."
      *   *The Budget Crime:* "Item-level description deemed cost-prohibitive for Series 4." This means the lives of the workers are boxed but not listed.
      *   *The Reparative Gesture:* "Archives acknowledges gaps..." without actually fixing them.
      *   *The Uncatalogued Line:* "Approximately 3 linear feet of uncatalogued household receipts remain in preliminary storage." (Where the real lives are).

  3.  **Drafting - Section by Section:**

      *   *Header:* Collection Number, Title, Dates, Extent.
      *   *Biographical/Historical Note:* Focus on Silas Hollis. Merchant, mill owner, civic leader. Wife mentioned as "supportive." Enslaved people mentioned as "domestic assistance" or omitted. Daughters mentioned only regarding marriages.
