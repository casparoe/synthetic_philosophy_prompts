  Here is the breakdown of the rules consistent with your friend's record, the prediction for your Thursday case, and the experiment to settle the matter.

  ### The Three Candidate Rules

  All three rules below incorporate the constraint that explains her prenatal verdict: **The Existence Constraint.** Harm requires a subject who *already exists* to be deprived. You cannot deprive a non-entity of a past, but you can deprive an existing entity of a future. This is why the prenatal case is "nonsense" to her, but the 30-year-old's death is not.

  The differences lie in what counts as a "harm" for that existing subject.

  **1. The Net Welfare Rule (Hedonic Balance)**
  *   **Logic:** Death is bad if the future life would have contained more net good (pleasure, satisfaction) than bad (pain, suffering). Death is good if the future is net negative.
  *   **Fit to Record:**
      *   30yo (Good future): Bad.
      *   92yo (No future goods): Neutral.
      *   55yo (Net pain): Good.
      *   Prenatal (No subject): Neutral.
  *   **Prediction for Test Case:** **Good (or Neutral).** The months ahead are "bad in every way" (pain, fog). Unless the "piece of work" generates enough subjective pleasure to outweigh the physical suffering, the balance sheet is negative. Given her medical background, she likely weighs pain heavily.

  **2. The Sovereign Will Rule (Desire Satisfaction)**
  *   **Logic:** Death is bad if it thwarts the subject's own rational desires regarding their continuation. It is good if it fulfills them. The subject's own valuation of their future overrides objective metrics of pleasure or pain.
  *   **Fit to Record:**
      *   30yo (Presumed desire to live): Bad.
      *   92yo (Desire to stop): Neutral/Good.
      *   55yo (Desire to stop): Good.
      *   Prenatal (No desires): Neutral.
  *   **Prediction for Test Case:** **Bad.** The woman "wants badly to live" to finish the work. Death thwarts this specific, high-priority desire. The pain is secondary to the frustration of her will.

  **3. The Narrative Arc Rule (Objective Completion)**
  *   **Logic:** Death is bad if it interrupts a meaningful project or life trajectory, regardless of the subject's current mood or pain levels. A life is a story; cutting the story short is a harm to the *integrity* of the life, even if the character wants to stop writing.
  *   **Fit to Record:**
      *   30yo (Story cut mid-chapter): Bad.
      *   92yo (Story finished): Neutral.
      *   55yo (Story became horror): Good to end.
      *   Prenatal (No story started): Neutral.
  *   **Prediction for Test Case:** **Bad.** She has "a piece of work she cares about." This is an unfinished chapter. Dying now renders the investment in that work futile. The pain is a tragic element of the story, but not a reason to cancel the ending.

  ### The Commitment

  She is most likely running **The Sovereign Will Rule.**

  **Why:**
  Look closely at the 55-year-old man. Under the *Narrative Arc Rule*, his death is ambiguous. He had a life, now it ends. Is that an interruption? Maybe. But your friend calls it unequivocally *good*. Why? Because "he... stopped wanting anything except for it to stop."

  Now look at the 92-year-old. "He'd told everyone he was ready." Again, the emphasis is on his *readiness*, his internal state.

  If she were running the *Net Welfare Rule*, the 30-year-old case would be more technical ("loss of utility"). But your friend says the 30-year-old was *wronged*. "Wronged" is a moral term that implies a violation of rights or autonomy, not just a loss of pleasure.

  However, the *Sovereign Will* explains the "wronged" verdict best (violation of her life's autonomy) and fits the medical mindset of a pediatric anesthesiologist. In medicine, patient autonomy (advance directives, DNR orders) often trumps objective medical benefit. She applies this to death: if you want to stay, it's bad to go; if you want to go, it's good to go.

  **Verdict for Thursday:** She will say the death is **Bad for her.** The woman's desire to finish the work outweighs the objective suffering.

