prompt: |-
  I sit on the standards panel at the small charity I work for (I'm a retired nurse, not an academic, so excuse the rambling) — four of us get shown anything that looks dodgy and decide whether a partnership survives. I keep getting the feeling we're making it up as we go along, and I want to know what we've actually been doing. Here's the record, roughly.

  1. A partner's director took cash from a supplier under the table for a contract. We ended the partnership. Nobody on the panel lost any sleep over that one.

  2. At the close of a project the community threw a big do: we paid for a goat and some crates of beer out of the project budget, and the district officer was handed a carved stool in front of about two hundred people, with our own staff taking the photos. We said that was fine — that's how you close a project there, and the donor's auditors accepted it.

  3. A staff member paid a customs clerk a small amount in cash to get a container of medical supplies out of the port in two days instead of three weeks. It went through the books as handling charges. We said fine, that's expediting, and the supplies reached the clinic.

  4. A partner's director hired his two nephews as field officers. No advert, the posts hadn't existed before, but the two of them did the job okay, and where he's from a man in his position is expected to look after his relatives and would be shamed if he didn't. We said no — nepotism — re-advertise the posts, and we came close to pulling the partnership.

  Now the new case, same country as 4. Our country director steered a contract to a cooperative from his own village, where his uncle is the chair. The thing is, their bid was genuinely the best and the cheapest, the work's been excellent, the clinic opened on time, nothing was skimmed. He didn't declare the connection — but he didn't hide it either, the whole office knew.

  So what do we decide, and what does that commit us to saying we've been doing all along? I definately go back and forth on whether we have a rule at all or just four gut feelings. My own test has been to ask whether the schoolkids in the donor country who did the sponsored runs would be angry if they saw it on the front page, but I've noticed that test would have got 2 and 4 both wrong, so maybe I'm the inconsistent one.

  I'd also like an honest word about what we give up either way. Alot of the panel thinks we're just imposing rich-country morality on people who organise their obligations differently and that we should get off our high horse; the other half thinks a bribe is a bribe. Don't fudge it. And tell me which of the four is the closest analog to the new case, and if you think two of our old decisions were really driven by different principles that happen to agree so far, tell me what kind of case would finally separate them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Retired nurse, sits on a standards panel for a small charity. Not an academic, self-deprecating ("excuse the rambling"), practical, experienced.
      *   **Context:** Small charity, standards panel (4 people), deciding on partnerships based on ethical dilemmas.
      *   **Problem:** Feeling inconsistent ("making it up as we go along"), wants to understand the underlying principles of past decisions to inform a new case.
      *   **Tone:** Direct, honest, no fudging, respectful of the complexity (cultural relativism vs. universal standards).
      *   **Goal:** Decide on Case 5, define the consistent principle (if any), acknowledge trade-offs, identify the closest analog among Cases 1-4, and expose any hidden divergences in principles.

  2.  **Analyze the Cases:**
      *   **Case 1 (Cash from supplier):** Director took cash under the table. *Decision: End partnership.*
          *   *Nature:* Personal enrichment, corruption, clear fraud.
          *   *Principle:* Zero tolerance for theft/fraud.
      *   **Case 2 (Goat/Beer/Stool):** Community celebration, gifts to official, photos taken. *Decision: Fine (Cultural context).*
          *   *Nature:* Cultural norm, relationship building, transparent (photos), donor auditors accepted.
          *   *Principle:* Cultural relativism, proportionality, transparency.
      *   **Case 3 (Customs grease payment):** Small cash to expedite medical supplies. *Decision: Fine (Expediting).*
          *   *Nature:* "Facilitation payment," humanitarian necessity (medical supplies), minor amount.
          *   *Principle:* Utilitarian/Harm reduction (greater good outweighs rule).
      *   **Case 4 (Nephews hired):** Director hired relatives, no advert. *Decision: No (Nepotism), re-advertise.*
          *   *Nature:* Conflict of interest, favoritism, cultural expectation vs. organizational policy.
          *   *Principle:* Procedural fairness, meritocracy, preventing future risk.
      *   **Case 5 (New Case - Village Cooperative):** Director steered contract to uncle's coop. Best bid, excellent work, no skim, undisclosed but open secret. *Decision: ???*
          *   *Nature:* Conflict of interest (undeclared), but no financial loss, high quality, cultural context (similar to Case 4).

  3.  **Evaluate the User's "Schoolkid Test":**
      *   User says: "Would schoolkids who did sponsored runs be angry if they saw it on the front page?"
      *   User thinks this test fails on Case 2 (Beer/Stool) and Case 4 (Nephews).
      *   *Analysis:* Actually, the test might work if refined. Kids might understand "celebration" (Case 2) but definitely wouldn't understand "hiring family without asking" (Case 4). The test highlights the *reputational risk* and *donor trust* aspect.

  4.  **Determine the Underlying Principles (The "What have we been doing?" question):**
      *   It's not just "gut feeling." There's a pattern.
      *   *Principle A (Harm/Intent):* Is money leaving the mission? (Case 1 = Yes, Case 5 = No).
      *   *Principle B (Transparency):* Is it hidden? (Case 1 = Yes, Case 2 = Photos, Case 5 = Open secret but not declared).
      *   *Principle C (Systemic Risk):* Does this create a slippery slope? (Case 4 = Yes, hiring practices; Case 3 = No, one-off emergency).
      *   *Principle D (Cultural Materiality):* Is this a local norm that doesn't undermine the core mission? (Case 2 = Yes, Case 4 = Debatable).

      *   *Synthesis:* The panel seems to be balancing **Financial Integrity** (is money stolen?) vs. **Procedural Integrity** (are rules followed?) vs. **Mission Impact** (did people get helped?).
      *   *Inconsistency:* Case 3 (Bribe/Facilitation) is technically illegal under UK/US law (Bribery Act/FCPA) but passed. Case 4 (Nepotism) is often a cultural norm but failed. Why?
      *   *Differentiation:* Case 3 was about *external* pressure (customs) to achieve mission. Case 4 was about *internal* governance (hiring). Case 5 is *internal* governance (procurement).

  5.  **Address the New Case (Case 5):**
      *   *Similarities to Case 4:* Undeclared conflict of interest, family connection, local cultural expectation.
      *   *Similarities to Case 2:* Culturally embedded, good outcome.
      *   *Similarities to Case 3:* Practical benefit (best/cheapest).
      *   *Difference from Case 1:* No personal theft.
      *   *The Crux:* It's an undeclared Conflict of Interest (COI). Even if the outcome was good, the *process* was compromised.
      *   *Decision:* This is tricky. If you pass it, you undermine Case 4. If you fail it, you ignore the good outcome and cultural context.
      *   *Recommendation:* Conditional Pass / Remedial Action. The *outcome* is acceptable, the *process* is not. Require declaration retroactively, update COI register, ensure future bids are arm's length.
      *   *Why:* Because Case 4 established that *process matters* (nepotism), but Case 2 & 3 established that *outcomes and context matter*. Case 5 is a hybrid.

  6.  **Identify the Closest Analog:**
      *   **Case 4 is the closest.** Both involve a director favoring family without formal declaration/process.
      *   *Why Case 3 isn't:* Case 3 is external coercion/facilitation. Case 5 is internal discretion.
      *   *Why Case 2 isn't:* Case 2 is community relations/gifts. Case 5 is procurement/financial governance.

  7.  **Identify Divergent Principles (The "Split" Question):**
      *   The panel is toggling between **Consequentialism** (Did it work? Was money lost?) and **Deontology** (Are the rules followed?).
      *   *Case 3* is pure Consequentialism (Supplies arrived, bribe ignored).
      *   *Case 4* is pure Deontology (Rules against nepotism, regardless of job performance).
      *   *The Splitter Case:* A case where breaking the rule saves money/improves outcomes significantly, but creates high reputational risk. Or: A case where following the rule costs the mission dearly but looks clean.
      *   *Specific Splitter:* What if the nephew in Case 4 was the *only* qualified person? If you said "Hire him anyway," you side with Case 3 (Outcome). If you said "Leave post vacant," you side with Case 4 (Rule).

  8.  **Drafting the Response:**
      *   *Tone:* Respectful, professional, direct, acknowledging the nurse's experience (triage ethics).
      *   *Structure:*
          1.  Validate the feeling (it's not rambling, it's ethical triage).
          2.  Analyze the past 4 cases to find the hidden framework.
          3.  Address the "Schoolkid Test."
          4.  Decide Case 5.
          5.  Identify the closest analog (Case 4).
          6.  Expose the divergent principles (Outcome vs. Process).
          7.  The Trade-off (What you give up).

      *   *Refining the Advice on Case 5:* Don't just say "Pass" or "Fail." Say "Pass with Remediation." This aligns with the nuance of Cases 2 & 3 while respecting the boundary set in Case 4. The key failure in Case 5 is the *non-declaration*, not necessarily the *choice*.
      *   *Refining the "What we've been doing":* You've been practicing **Risk-Based Ethics**. You tolerate high ethical risk if the financial/mission risk is low (Case 3), but you tolerate low ethical risk if the financial/mission risk is high (Case 1). Wait, that's not quite right.
      *   *Better formulation:* You distinguish between **Private Gain** (Case 1 - Unacceptable) vs. **Social/Cultural Obligation** (Case 2, 4, 5). But you draw the line at **Internal Governance** (Case 4 - Unacceptable) vs. **External Necessity** (Case 3 - Acceptable).
      *   *Actually, the strongest thread:* **Who benefits?**
          *   Case 1: Director benefits (Fail).
          *   Case 2: Community/Relationship benefits (Pass).
          *   Case 3: Mission/Patients benefit (Pass).
          *   Case 4: Director's Family benefits (Fail).
          *   Case 5: Director's Village/Family benefits (but also Mission benefits).
      *   *This is the key:* Case 5 is the tension point. The Mission benefited, but the Family also benefited.

      *   *Re-evaluating Case 5 Decision:* If Case 4 failed because family benefited, Case 5 should technically fail. *However*, Case 5 has the "Best Bid" element. Case 4 had "Posts didn't exist before." Case 5 is procurement, Case 4 is HR. Procurement allows for competitive bidding even with COI if managed. HR is harder.
      *   *Decision:* Pass, but mandate declaration. The sin is the secrecy, not the kinship.

      *   *The "Splitter" Case:* Need to define a scenario that forces a choice between the logic of Case 3 (Expediency) and Case 4 (Process).
      *   *Scenario:* A director hires a qualified cousin without advert (Case 4 logic says No). But it's an emergency epidemic and the cousin is the only epidemiologist available (Case 3 logic says Yes).

  9.  **Final Polish:** Ensure the voice sounds like a peer speaking to a peer. Avoid academic jargon. Use the "Nurse" analogy (Triage).

      *(Self-Correction during drafting)*: I need to be careful about Case 3. Facilitation payments are illegal under the UK Bribery Act (assuming UK charity based on "country director" and "donor country" phrasing, likely UK/US). I shouldn't validate it as "legal," but acknowledge the panel *treated* it as acceptable. I need to point out that Case 3 is actually the biggest liability legally, even if morally defensible.
      *Wait, the prompt asks "what do we decide" and "what does that commit us to saying we've been doing".* I need to be firm.
      *Case 5 Decision:* You cannot pass Case 5 without addressing the non-declaration. If you pass it cleanly, you invalidate Case 4. If you fail it cleanly, you ignore the "Best Bid" reality.
      *Solution:* **Sanction, don't terminate.** Require retroactive declaration. This honors Case 4 (Process matters) without punishing the outcome (Case 3/2 logic).

      *Let's look at the "Schoolkid Test" again.*
      *   Case 1: Kids angry (Theft).
      *   Case 2: Kids confused but maybe okay if explained as "party."
      *   Case 3: Kids angry ("We gave money for bribes?"). *User says this passed.* This suggests the panel prioritizes Mission over Rules here.
      *   Case 4: Kids angry ("Unfair hiring").
      *   Case 5: Kids angry ("Secret deals").
      *   *Refinement:* The test works if you add "Would they understand the *reason*?"

      *Okay, ready to write.*
answer: |-
  First, take a breath. You aren't rambling, and you aren't inconsistent. You are practicing **ethical triage**. As a nurse, you know that in a crisis, you don't treat the sickest patient first; you treat the one who can be saved with the resources you have. You prioritize based on harm, intent, and outcome.

  Your panel isn't "making it up." You are unconsciously balancing three competing frameworks:
  1.  **Financial Integrity:** Is donor money being stolen? (Case 1)
  2.  **Mission Imperative:** Did the aid reach the people who need it? (Case 3)
  3.  **Governance & Fairness:** Are the rules of the organization being respected? (Case 4)

  Case 2 sits in the middle as **Cultural Materiality**: Is this a local norm that doesn't undermine the other three?

  Here is the honest breakdown of what you've been doing, how to handle the new case, and where your principles are actually at war with each other.

  ### 1. The Decision on the New Case (Case 5)
  **Decision:** **Conditional Pass (Remedial Action).**
  You do not end the partnership, but you do not let it slide. You require the Country Director to retroactively declare the conflict of interest, update the register of interests, and recuse himself from the final payment sign-off for that specific contract.

  **Why:**
  *   **Unlike Case 1:** No money was skimmed. The charity got the best value. There is no financial loss to the donor.
  *   **Unlike Case 4:** This is procurement, not HR. In procurement, a conflict of interest can be *managed* if the bid is competitive and transparent. In Case 4, the posts were created *for* the nephews; there was no market test. Here, the cooperative won on merit.
  *   **The Sin:** The sin here isn't the kinship; it's the **non-declaration**. "Open secret" is not compliance. If you let this pass without a mark on the record, you invalidate Case 4. If you fail it completely, you prioritize bureaucracy over results (ignoring Case 3).

  ### 2. What This Commits You To Saying You've Been Doing
  If you rule this way, you are admitting that your standard is **Process Integrity over Outcome Perfection, unless Mission Critical.**

  You are saying: *"We accept that local cultural obligations (kinship, gifts) exist. We do not punish partners for them, provided they are transparent and do not result in financial loss or exclude better candidates. However, we will not tolerate hidden conflicts of interest."*

  This commits you to the view that **transparency is the cure for conflict.** In Case 4, the lack of advert meant transparency was impossible. In Case 5, transparency is possible retroactively.

  ### 3. The Closest Analog
  **Case 4 (The Nephews)** is the closest analog.
  *   **Similarity:** Both involve a director using their position to benefit family members within the organization's sphere of influence. Both involve a failure to declare the relationship formally.
  *   **Difference:** Case 4 was a "closed shop" (posts created for them). Case 5 was an "open market" (best bid won).
  *   **Why it matters:** If you treat Case 5 exactly like Case 4 (terminate/warn heavily), you are saying *any* family connection is toxic regardless of merit. If you treat it like Case 2 (cultural norm, ignore it), you are saying governance doesn't matter. The middle path acknowledges Case 4's principle (declare it) without Case 4's penalty (because the merit was proven).

  ### 4. The Divergent Principles (The Crack in the Foundation)
  You asked if two of your old decisions were driven by different principles that happen to agree so far. **Yes.**

  **Case 3 (Customs Bribe)** and **Case 4 (Nephews)** are fundamentally opposed.
  *   **Case 3 is Consequentialist:** The ends justified the means. The rule (no bribes) was broken because the outcome (medical supplies) was vital.
  *   **Case 4 is Deontological:** The rule (no nepotism) must be followed regardless of the outcome (the nephews did the job okay).

  **The Case That Would Split Your Panel:**
  To expose this, imagine this scenario:
  > *A director hires his unqualified brother as a driver. It is nepotism (Case 4 logic: Fail). However, the brother is the only person with a vehicle who can reach a flood-stricken area to deliver food today (Case 3 logic: Pass).*

  *   **Half your panel** (the "Rich-country morality/rules" group) will say: **No.** You cannot normalize nepotism, or next time the brother will be unqualified *and* steal the food.
  *   **The other half** (the "Get off your high horse/mission" group) will say: **Yes.** People are starving. The rule is a luxury we can't afford right now.

  Currently, you haven't faced this because the "bribe" (Case 3) helped the mission, and the "nepotism" (Case 4) didn't save the mission—it just filled a post. Case 5 is the first time the two have collided: A conflict of interest (Case 4 type) that actually helped the mission (Case 3 type).

  ### 5. What You Give Up Either Way
  You asked for an honest word on the trade-offs.

  **If you come down hard (Fail Case 5):**
  *   **You gain:** Clean audits, defensible position to Western donors, protection against future corruption (slippery slope).
  *   **You lose:** Local trust. You signal that you do not understand how power works in that country. You may force directors to hide relationships *better* rather than declare them. You risk losing the best local partners who cannot separate family from business.

  **If you let it slide (Pass Case 5 cleanly):**
  *   **You gain:** Goodwill with the Country Director, continued excellent work in that village, cultural alignment.
  *   **You lose:** Moral authority. If this gets out (and "open secrets" have a way of leaking), you look hypocritical. You undermine your own Code of Conduct. You make Case 4 look arbitrary ("Why did the nephew guy get punished but the uncle guy didn't?").

  ### 6. A Note on Your "Schoolkid Test"
  Your test is good, but you're applying it too literally. The schoolkids wouldn't be angry about the goat and beer (Case 2) if you explained it was a *party*, not a *payoff*. They would be angry about the customs bribe (Case 3) if you called it a "fee," but they might understand if you called it "emergency access."

  The test isn't "Would they be angry?" It's **"Would they feel lied to?"**
  *   Case 1: Yes (Theft).
  *   Case 2: No (Transparent celebration).
  *   Case 3: Maybe (Hidden in "handling charges").
  *   Case 4: Yes (Hidden hiring).
  *   Case 5: **Yes (Hidden connection).**

  That is why you cannot pass Case 5 without fixing the declaration. The kids can handle the uncle getting the contract if they know *why* and that it was the best deal. They cannot handle finding out you knew and didn't tell them.

  ### Summary Advice
  1.  **Call it a "Governance Failure," not "Corruption."** Distinguish the two clearly in your minutes.
  2.  **Require Retroactive Declaration.** Make the Director sign a form stating the relationship now.
  3.  **Document the "Best Value" justification.** Keep the bid records proving the uncle's coop was the cheapest/best. This protects you if auditors ask later.
  4.  **Acknowledge the Tension.** In your panel notes, write: *"Panel recognized the tension between local cultural obligations and donor compliance requirements. Decision prioritized mission outcome while enforcing transparency standards."*

  You aren't inconsistent. You're navigating the gap between the rulebook and the real world. Just make sure the bridge you build (transparency) is strong enough to hold the weight.
