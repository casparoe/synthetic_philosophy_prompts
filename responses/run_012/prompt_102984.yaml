answer: |-
  This is an exceptionally well-constructed exam question. The three cases are philosophically tight: they hold counterfactual dependence constant while varying normative status and causal distance, which forces students to engage with the actual literature (e.g., McGrath, Schaffer, Lewis) rather than reciting definitions.

  Below is a refined version of your Model Answer and Marking Scheme. I have polished the Model Answer to sound more like a definitive key (less "students should," more "the verdict is") and expanded it to meet your word count target while sharpening the metaphysical distinctions in part (c). I have also granularized the Marking Scheme to help TAs grade consistently.

  ### Model Answer (Approx. 600 words)

  **(a) Verdicts and Criterion**
  Priya caused the flood; Dan did not; Sam caused the flood. The criterion employed is a **hybrid account**: an omission is causal only if (i) the outcome counterfactually depends on the omitted action, and (ii) the agent violated a relevant normative expectation or duty. Counterfactual dependence is necessary but not sufficient.

  **(b) Divergence of Criteria**
  Bare counterfactual dependence yields identical verdicts for all three cases: had any agent acted differently, the flood would not have occurred. Thus, the counterfactual test incorrectly identifies Dan as a cause. The norm-based criterion distinguishes them: Priya violated a written procedure; Sam violated a duty of maintenance; Dan violated no duty, as he lacked both role and knowledge.
  The criteria come apart in **Cases 1 and 2**. Both share identical counterfactual structures (the flood depends on the omission), but only Priya is judged a cause. This isolates the norm as the deciding factor. Case 3 does not separate the criteria (both yield "cause"), but it tests the transitivity of omission chains.

  **(c) Causal Distance and Ontology**
  Sam's omission is causally distal: he omitted to maintain a device that would have omitted to let the flood happen. This is a chain of double prevention via omission. If we accept Priya as a cause, consistency demands we accept Sam, provided the chain is unbroken. The sensor's failure is not an intervening free action but a mechanical consequence of Sam's omission.
  Regarding ontology: if omissions are causes, we must either (i) admit absences into our ontology as genuine relata (Lewis), or (ii) treat causation as a relation between events where the "cause" is the positive state of affairs that obtained instead (e.g., Priya drinking coffee instead of closing the valve). Case 3 suggests that if we accept omission-causation, we cannot restrict it to "direct" bodily omissions without arbitrariness. The relation is likely the same, but the metaphysical cost increases with distance.

  **(d) Counterexample and Patch**
  The norm criterion faces the **Jurisdiction Problem**: if a "duty to rescue" law were enacted, Dan's omission would suddenly become a cause without any change in the physical facts. This makes causation contingent on local legislation.
  *Patch:* Distinguish between **causal responsibility** and **moral/legal liability**. Norms determine liability, but counterfactual dependence determines causation. However, this risks returning to the promiscuity problem (Dan is a cause but not liable).
  *Bite the Bullet:* Accept that causal selection is inherently pragmatic and normative. We cite only those counterfactual dependencies relevant to our explanatory interests. Thus, Dan is a "cause" in the broad physical sense but not in the explanatory sense required for attribution. I accept this verdict: causation claims are context-sensitive, not purely naturalistic relations.

  ***

  ### Marking Scheme (20 Marks)

  | Component | Marks | Required Moves | Typical Student Errors |
  | :--- | :---: | :--- | :--- |
  | **1. Verdicts & Criterion** | 4 | Correctly identifies Priya/Sam (Yes) and Dan (No). Explicitly states a hybrid criterion (Counterfactual + Norm). | Giving verdicts without stating a criterion; silently switching criteria between cases. |
  | **2. Criteria Divergence** | 4 | Ident Cases 1 & 2 as the separating pair. Explains that CF dependence holds for all, but Norms vary. | Claiming Case 3 separates the criteria; failing to note that CF dependence holds for Dan. |
  | **3. Promiscuity Objection** | 4 | Explains why bare CF dependence fails (counts Dan/sun not exploding). Shows need for restriction. | Treating CF dependence as sufficient; failing to mention the "too many causes" problem. |
  | **4. Case 3 & Ontology** | 4 | Identifies Case 3 as double prevention/chain. Takes a stance on ontology (absences vs. positive states). | Calling Sam's omission "too indirect" without defining indirectness; ignoring the ontology question. |
  | **5. Counterexample & Patch** | 4 | Identifies a genuine flaw (e.g., Jurisdiction Problem). Offers a coherent patch or defended bullet-biting. | Offering a "counterexample" the criterion already handles; patching with ad hoc clauses that exclude Priya. |

  ### Instructor Notes for Grading
  *   **Part (c) Nuance:** Students who argue Sam is *not* a cause can still get full marks if they argue convincingly about **causal attenuation** or **intervening mechanisms**, provided they acknowledge the tension with Priya's case.
  *   **Part (d) Flexibility:** The "Jurisdiction Problem" is the standard objection, but accept any genuine tension (e.g., "Bad Norms" – if Priya's duty was immoral, is she still the cause?).
  *   **Word Count:** Do not penalize for brevity if all philosophical moves are present; penalize only if padding obscures the argument.
