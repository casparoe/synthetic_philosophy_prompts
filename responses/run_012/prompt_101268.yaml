      *   *The "Fei" (Not/Is Not):* In Classical Chinese, *fei* functions more like "is not the same as" or "is not equivalent to" rather than simple class exclusion (like $\notin$). It's about non-identity of concepts, not necessarily exclusion from a biological category.

