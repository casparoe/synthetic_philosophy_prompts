answer: |-
  Here is a complete facilitator guide for your club meeting. It is designed to be handed to another student (or used by you next week) with minimal prep. It respects your 70-minute window, keeps the vocabulary hidden until the end, and includes specific scripts for handling the kids who will try to derail it.

  # Activity Title: The Provenance Game
  **Time:** 70 Minutes
  **Group Size:** 14–16 Students
  **Location:** Art Room (Tables arranged in a U-shape or clusters)

  ## 1. Materials Checklist
  *   **16 Envelopes:** Sealed. Numbered 1–16 on the outside.
  *   **16 Item Cards:** Inside the envelopes. (See *Card Setup* below).
  *   **Token Sheets:** One per student. A simple grid with "Round 1," "Round 2," "Round 3" and a space to write their bid amount.
  *   **Currency:** 500 "Prestige Points" per student (print paper slips or use poker chips).
  *   **Whiteboard & Markers:** To track the "Bank" and write down final scores.
  *   **Timer:** Phone or classroom clock.

  ## 2. Card Setup (Prep Work)
  You need 8 pairs of cards. Each pair describes the *exact same object* visually, but differs in origin.
  *   **Pairs 1–4 (Art/Objects):**
      *   *Card A (Original):* "Oil on canvas, 1889. Painted by the artist's own hand. Slight crack in varnish."
      *   *Card B (Copy):* "Oil on canvas, 2024. Painted by a master forger using period-correct materials. Indistinguishable from A."
  *   **Pairs 5–6 (Sculpture):**
      *   *Card A (Original):* "Marble bust, 1504. Carved by the master."
      *   *Card B (Copy):* "Marble bust, 1850. Carved from the original mold by a workshop apprentice."
  *   **Pairs 7–8 (Music/Performance):**
      *   *Card A (Live):* "Recording of a live concert, 2023. One-time performance."
      *   *Card B (Digital):* "Perfect digital render of the same score, 2024. No human error."

  **Distribution:**
  *   Hand out envelopes randomly.
  *   **Secretly** keep a master list of who has which card (A or B).
  *   Ensure A and B cards are paired up at adjacent tables if possible, but don't tell them who their pair is yet.

  ## 3. Timeline & Script

  ### 0:00–0:10: Introduction & Rules
  **Facilitator:** "Welcome. Today we're testing how we assign value to things. You all have 500 Prestige Points. At the end, the person with the most points 'wins,' but the real goal is to see how your bidding changes.
  **The Rules:**
  1.  Do not open your envelope until I say so.
  2.  Do not show your card to anyone else.
  3.  In each round, you will write a bid for the object in your envelope. You can bid 0 to 500.
  4.  This is a silent auction against yourself. If you bid high, you spend points. If you bid low, you keep points.
  5.  **Crucial:** Do not talk about the words 'fake,' 'real,' 'copy,' or 'original' during the game. If you do, you lose 50 points."

  ### 0:10–0:20: Round 1 (The Blind Bid)
  **Action:** Students open envelopes. They read the description.
  **Facilitator:** "Look at your object. Based *only* on the description of what it looks like and what it is, how much is it worth to you? Write your bid."
  **Collect:** Have them write their bid on the whiteboard next to their envelope number (e.g., Envelope 1: 200 points).
  **Observation:** The facilitator quietly notes if Pair 1 (Envelope 3 and 12) bid similarly.

  ### 0:20–0:35: Round 2 (The Reveal)
  **Facilitator:** "We are going to reveal new information. I am going to walk around and stamp the inside of your card. Either 'Type X' or 'Type Y'."
  *(Facilitator walks around and stamps/marks the A cards as 'Type X' and B cards as 'Type Y'. Tell them Type X is 'First of its kind' and Type Y is 'Subsequent production'. Do not use the words Original/Copy yet.)*
  **Facilitator:** "You now know the history of your object. Type X came first. Type Y came later, but looks identical. Bid again."
  **Action:** Students bid again. They can change their bid.
  **The Twist (The "Mean" Part):** Halfway through this round, announce: "Correction. Due to a cataloging error, Envelopes 5, 6, 9, and 10 have been mislabeled. Swap your Type designation with the person sitting directly across from you."
  *(This simulates the label swap. If Envelope 5 was Type X, now they are told they are Type Y, even though the object didn't change.)*
  **Action:** Let them adjust their bids if they want.

  ### 0:35–0:50: Round 3 (The Intent)
  **Facilitator:** "Final round. New information about *why* the Type Y objects exist."
  **Read these aloud to the whole group:**
  1.  **Group 1 (The Machine):** "Some Type Ys were made by an AI or machine with no intent to deceive. It just happened."
  2.  **Group 2 (The Restorer):** "Some Type Ys are actually Type Xs that were damaged and 80% repainted by a restorer to look new."
  3.  **Group 3 (The Forgery):** "Some Type Ys were made specifically to trick experts and sell for millions. The maker wanted you to think it was Type X."
  **Action:** Assign each student one of these three backstories (mix them up). Let them bid a final time.

  ### 0:50–1:05: The Debrief (The Most Important Part)
  *Gather everyone in a circle. Put the bidding data on the board.*

  **Step 1: The Data Check (5 mins)**
  **Facilitator:** "Look at the board. In Round 1, before you knew the history, did Type X and Type Y bid differently?"
  *(Likely answer: No, they were similar.)*
  **Facilitator:** "In Round 2, when you found out one was 'First' and one was 'Later,' did the bids split?"
  *(Likely answer: Yes, Type X went up, Type Y went down.)*
  **Facilitator:** "Nothing about the object changed physically. Only the story changed. Why did the value drop?"
  *(Let them argue here. They will say 'snobbery,' 'history,' 'connection to the artist.')*

  **Step 2: The Vocabulary Reveal (5 mins)**
  **Facilitator:** "Okay, you can say the words now. Type X was the **Original**. Type Y was the **Copy**. The drop in value you felt? Philosophers call that **Authenticity**. It's not about what your eyes see; it's about the object's history."
  "Now, in Round 3, we added **Intent**. Did the machine-made copy feel different than the forgery? Why?"
  *(Discuss: A forgery is a lie. A machine copy is just data. Does a lie hurt the value more than a copy?)*

  **Step 3: The Real-World Traps (5 mins)**
  **Facilitator:** "Here are three things to take home that complicate this:"
  1.  **The Greek Trap:** "Most Greek marble statues in museums? They are Roman copies. The bronze originals are lost. We've been worshipping the 'Type Y' for 500 years. Does knowing that ruin them for you, or does their history make them the new Originals?"
  2.  **The Music Trap:** "If an orchestra plays Beethoven perfectly, is it a copy? No. We expect the performance to be reproducible. Why do we treat a painting differently than a song?"
  3.  **The Restoration Trap:** "If a painting is 80% repainted by restorers over 400 years, is it still the Original? At what point does it become a copy of itself?"

  ### 1:05–1:10: Wrap Up
  **Facilitator:** "Count your points. Winner gets [bragging rights/a small snack]. But the real question is: If I gave you the Type Y painting for free, and you hung it in your room, and five years later I told you it was Type X, would you feel richer? If yes, the value was in your head, not the canvas."

  ---

  ## 4. Predictable Problems & Fixes

  **Problem 1: The "Snobbery" Derailment**
  *   **The Kid:** "This is stupid. It's just paint. Paying more for the original is pure snobbery and I refuse to play along."
  *   **The Fix:** Do not argue. Validate them. "That is a valid philosophical position. It's called *Aesthetic Idealism*. Please bid 0 or bid what you think it's worth. We need your data point to see if the rest of us are the irrational ones."
  *   **Why:** This turns them from a disruptor into a control variable.

  **Problem 2: The Refuser**
  *   **The Kid:** "I'm not bidding. This feels like gambling."
  *   **The Fix:** "You don't have to spend points. A bid of 0 is a valid move. It means you value the object at nothing. Please write 0 on your sheet so we have your data."
  *   **Why:** Keeps them included without forcing participation.

  **Problem 3: The "I Can Tell the Difference" Bluff**
  *   **The Kid:** "My card said 'slight crack.' I know that means it's the real one."
  *   **The Fix:** "The cards describe visual appearance. Both cards in a pair have the same visual description. If you think you found a clue, write it down, but you must bid based on the assumption they look identical."

  **Problem 4: Running Out of Time**
  *   **The Fix:** Cut Round 3 short. If you are at 1:00 PM and haven't started the debrief, skip the "Machine vs. Forgery" distinction and go straight to the Greek/Music examples. The debrief is more important than the third bid.

  ## 5. Honest Limitations (Read This Before You Start)
  *   **The Printout Problem:** You are handing out text cards, not actual paintings. The students know this. The game relies on *imagining* the object. If they get too hung up on "It's just a piece of paper," remind them: "Imagine you are holding the object described. The paper is just the proxy."
  *   **The Verdict:** This game cannot prove whether the extra value of an original is *real* or a *mistake*. It only proves that people *act* as if it's real. Don't try to solve the debate; just make sure they feel the tension.
  *   **The "Mean" Swap:** If physically swapping labels feels too chaotic, just announce the "Catalog Error." The psychological effect (your object didn't change, but its status did) is the same and saves 5 minutes.

  ## 6. Facilitator Cheat Sheet (Keep this in your pocket)
  *   **Key Concept 1:** *Aesthetic Value* (Round 1) = What it looks like.
  *   **Key Concept 2:** *Provenance* (Round 2) = Where it came from.
  *   **Key Concept 3:** *Intent* (Round 3) = Why it was made.
  *   **If conversation stalls:** Ask "Would you burn the Copy to save the Original?"
  *   **If conversation gets too hot:** Remind them "We are testing our intuitions, not attacking each other."
  *   **The Van Meegeren Story:** If they ask about real forgeries, save the Han van Meegeren (Vermeer forger) story for the very end of the debrief. He fooled the world, then had to prove his paintings were fake to avoid treason charges. It proves the "Original" status is sometimes just a story we agree to believe.
