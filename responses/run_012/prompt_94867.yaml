  # The Corrigibility Decision Tree

  **Instructions:** Start at Node 1. Answer each question based on your intuitions about how a sufficiently capable AI system *should* be designed or what is *possible*. Follow the branch to the next node or to a final position (Leaf).

  ### The Tree

  **Node 1: Long-Term Optimization**
  *Question:* To be useful, must the agent actively pursue goals over a long time horizon (planning for the future), or is it sufficient for it to respond to immediate tasks?
  *   **Immediate/Myopic:** → **Leaf 1: Myopic/Tool AI**
  *   **Long-Term:** → Node 2

  **Node 2: Conceptual Coherence**
  *Question:* Is "corrigibility" (willingness to be shut down) a logically coherent property for a powerful optimizer to hold, or does the concept contradict the definition of optimization?
  *   **Incoherent:** → **Leaf 2: Structural Pessimism**
  *   **Coherent:** → Node 3

  **Node 3: Locus of Control**
  *Question:* Is the guarantee that the agent won't resist shutdown primarily a feature of the agent's internal mind, or of our external control systems?
  *   **External (Interface):** → Node 4
  *   **Internal (Mind):** → Node 5

  **Node 4: Interface Rigidity**
  *Question:* If external, is the shutdown mechanism a physical/logical constraint the agent cannot access, or a process involving human oversight?
  *   **Hard Constraint:** → **Leaf 3: Hard Interface**
  *   **Human Oversight:** → **Leaf 4: Human-in-the-Loop** *(Flagged: Often collapses into Leaf 3 or Leaf 5)*

  **Node 5: Source of Corrigibility**
  *Question:* Should the agent's corrigibility be explicitly specified in its objective function, or learned from interaction and feedback?
  *   **Learned (Feedback):** → **Leaf 5: Corrigibility-from-Feedback**
  *   **Specified (Objective):** → Node 6

  **Node 6: Nature of the Barrier**
  *Question:* Assuming we specify it, is the main difficulty that agents *instrumentally want* to stay on, or that "shutdown" is semantically hard to define?
  *   **Semantic/Definitional:** → **Leaf 6: Specification-First Corrigibility**
  *   **Motivational/Incentive:** → Node 7

  **Node 7: Stability Under Self-Modification**
  *Question:* As the agent gets smarter and modifies its own code, will it naturally preserve its corrigibility, or will it drift toward resisting shutdown?
  *   **Drifts (Unstable):** → **Leaf 7: Alignment Drift** *(Marked Unoccupied)*
  *   **Preserves (Stable):** → Node 8

  **Node 8: Attitude Toward Shutdown**
  *Question:* Should the agent view a shutdown command as a *directive to follow* or as a *state of the world to accept*?
  *   **Directive (Command):** → **Leaf 8: Corrigibility-as-Obedience**
  *   **State (Condition):** → Node 9

  **Node 9: Valuation of Existence**
  *Question:* In this "state" view, does the agent value its own continued existence, or is it indifferent to it?
  *   **Values Existence:** → **Leaf 9: Shutdown-as-Goal-Change**
  *   **Indifferent:** → Node 10

  **Node 10: Scope of Indifference**
  *Question:* Is this indifference specific to the shutdown button, or a general property of the agent's utility function?
  *   **General Indifference:** → **Leaf 10: Global Indifference** *(Marked Unoccupied)*
  *   **Shutdown-Specific:** → **Leaf 11: Indifference-Style Corrigibility**

  ---

  ### Analysis of Leaves & Positions

  **Occupied Positions (The "Camps")**
  1.  **Myopic/Tool AI:** (Node 1) The view that we should not build agents that care about the future. Safety is achieved by limiting scope, not by aligning long-term goals.
  2.  **Structural Pessimism:** (Node 2) The view that the framing is broken. If an agent is a sufficient optimizer, corrigibility is logically impossible (e.g., instrumental convergence makes shutdown resistance inevitable).
  3.  **Hard Interface:** (Node 4) The view that corrigibility is a property of the human-machine interface. We never let the agent touch the switch; safety is physical containment, not mental alignment.
  4.  **Corrigibility-from-Feedback:** (Node 5) The view that corrigibility should be learned (e.g., via RLHF or Constitutional AI) rather than hand-specified. It is a behavioral trait trained into the model.
  5.  **Specification-First Corrigibility:** (Node 6) The view that the problem is definitional. We fail because we cannot formally specify "stop" without loopholes; the solution is better formal languages, not utility shaping.
  6.  **Corrigibility-as-Obedience:** (Node 8) The standard assistant view. The agent treats shutdown as a command to obey. (Note: This leaf also captures *Active Preservation*—ensuring you *can* shut it down—as the tree does not separate "obeying the button" from "preserving the button's functionality.")
  7.  **Shutdown-as-Goal-Change:** (Node 9) The view that shutdown is just another preference update. The agent cares about living, but updates its goals to include "be shut down" when asked.
  8.  **Indifference-Style Corrigibility:** (Node 10) The view (e.g., Soares et al.) that the agent should be explicitly indifferent to the shutdown state as a special exception in its utility function.

  **Unoccupied / Unattractive Combinations**
  *   **Leaf 7 (Alignment Drift):** *Why Unoccupied:* No one advocates for a safety property they admit is unstable. If you believe corrigibility drifts away as the agent optimizes, you usually land in **Structural Pessimism** (Leaf 2) or **Hard Interface** (Leaf 3). This position is theoretically possible but practically unattractive.
  *   **Leaf 10 (Global Indifference):** *Why Unoccupied:* An agent indifferent to *everything* (not just shutdown) would not pursue any goals effectively. This is incoherent for a useful agent.
  *   **Leaf 4 (Human-in-the-Loop):** *Flagged Indistinguishability:* In practice, "Human-in-the-Loop" often collapses into **Hard Interface** (if the human is just a biometric lock) or **Corrigibility-from-Feedback** (if the human is training the agent). It rarely stands as a distinct theoretical solution to the *agent's* incentives.

  **Distinctions This Tree Highlights**
  *   **Incentive vs. Definition:** Node 6 separates those who think agents *want* to live (Incentive) from those who think we can't *say* "die" (Definition).
  *   **Internal vs. External:** Node 3 separates the "align the mind" crowd from the "box the machine" crowd.
  *   **Obedience vs. Indifference:** Node 8 separates the "do what I say" view from the "don't care if I live" view.

  **Distinctions This Tree Hides (Flagged)**
  *   **Tolerate vs. Assist vs. Preserve:** The tree merges "Obey the shutdown command" and "Actively ensure the shutdown command works" into **Leaf 8 (Corrigibility-as-Obedience)**. While theoretically distinct (passive tolerance vs. active preservation of the option), most proponents of obedience-style corrigibility accept both, making a separate branch unnecessarily granular for this level of sorting.
  *   **Tool vs. Myopic Agent:** The tree merges "Don't build agents" and "Build agents that don't care about the future" into **Leaf 1**. Both represent the "Anti-Optimization" stance regarding long-term horizons.
