answer: |-
  This is a classic reconstruction of the Williams vs. Utilitarianism debate, specifically centering on *A Critique of Utilitarianism* (from *Utilitarianism: For and Against*) and the "Integrity" objection from *Persons, Character and Morality*. Your intuition about decision-theory is spot-on: that distinction is exactly where Owen is trying to stand, and exactly where Williams digs his heels in.

  Here is the move-by-move breakdown, followed by the specific settlements you requested.

  ### Move-by-Move Analysis

  | Move | Speaker | Rating | Justification |
  | :--- | :--- | :--- | :--- |
  | **1** | **Marta** | **Clearly Right** | Accurately captures the phenomenological core of the "one thought too many" passage. |
  | **2** | **Owen** | **Right (Technically)** | Correctly states the standard utilitarian distinction between criterion of rightness and decision procedure. |
  | **3** | **Marta** | **Clearly Right** | Correctly identifies that Williams's deeper worry is about *justificatory grounds*, not just psychology. |
  | **4** | **Owen** | **Right (Distinction)** / **Debatable (Reply)** | Correct that these are distinct objections; the "well-being component" reply is standard but controversial. |
  | **5** | **Marta** | **Clearly Right** | Formulates the "self-effacing theory" objection (Government House Utilitarianism) precisely. |
  | **6** | **Owen** | **Debatable** | The humor analogy is common but weak; morality claims normative authority, humor does not. |
  | **7** | **Marta** | **Clearly Right** | Correctly notes that optimizing dispositions still renders projects instrumental "line items." |
  | **8** | **Owen** | **Mistaken** | Williams argues morality *does* claim authority over reasons/thoughts, not just actions; the Kant point is a deflection. |
  | **9** | **Marta** | **Clearly Right** | The "objective partner" analogy perfectly illustrates the alienation inherent in the justificatory structure. |
  | **10** | **Owen** | **Clearly Mistaken** | Category error: Moral theories are normative/prescriptive, biological accounts are descriptive. |

  ### Overall Verdict: Who is More Right?

  **Marta is more right.**

  Owen is technically correct about how Utilitarianism *can* be constructed to avoid deliberative absurdity (Move 2 & 6). However, Marta is right about what Williams is actually attacking. Williams is not merely complaining about what goes on in the agent's head during the rescue; he is complaining about what must be *true* about the agent's life for the rescue to be justified. Owen defends the *psychology* of the agent, but Marta successfully attacks the *truth conditions* of the theory. If the theory is true, the husband's love is only contingently valuable. Owen's defense requires the theory to hide its own truth from the agent to function, which Marta correctly identifies as a *reductio* (Move 5).

  ---

  ### (a) Are "One Thought Too Many" and "Integrity" Distinct?

  **Yes, they are distinct, but Marta is not conflating them; she is escalating.**

  *   **One Thought Too Many (OTT):** This is primarily a phenomenological objection about *deliberation*. It argues that certain relationships (like marriage) require immediate, non-calculative responses. If you calculate, you've already failed the relationship.
  *   **The Integrity Objection:** This is a structural objection about *justification*. It argues that if an impartial theory is the ultimate truth-maker of morality, then all your personal projects are only valuable insofar as they serve the impartial good. This attacks your identity, not just your moment-to-moment thinking.

  **Does it matter which she is pressing?**
  Yes. If Williams is only pressing **OTT**, Owen wins. Utilitarianism can simply say, "Don't calculate in the moment; cultivate dispositions that don't calculate." This is the "two-level" defense.
  But if Williams is pressing **Integrity**, Owen loses. Even if you don't *think* about utility, if the *reason your life has value* is ultimately grounded in utility, you are alienated from your own life. Marta starts with OTT (Move 1) but immediately pivots to Integrity (Move 3: "the theory has quietly excused itself from the man's life... grounds"). She isn't confusing them; she is arguing that OTT is merely the symptom of the disease of Integrity. Owen tries to isolate them (Move 4) to save the theory, but Marta correctly insists the disease remains even if the symptom is hidden.

  ### (b) Does Owen's Two-Level Reply Answer Williams?

  **No, it changes the subject.**

  Owen's reply (Move 2 & 6) relies on the **Criterion vs. Decision Procedure** distinction. This is standard fare in rationalist decision theory (which you noted).
  *   **Criterion:** What makes an act right (Maximize Utility).
  *   **Procedure:** How the agent decides (Save your wife).

  Owen argues Williams conflates these. Williams anticipates this. His response (channeled by Marta in Move 5 & 7) is that a moral theory isn't just a tool for decision-making; it is a claim about **what matters**.
  If Utilitarianism is *true*, then the husband's love is *actually* only instrumentally valuable, even if he doesn't know it. The alienation comes from the *truth* of the theory, not the *use* of the theory in deliberation. Owen's reply works if morality is just a technology for producing good states of affairs. Williams argues morality is constitutive of who we are. By saying "The theory doesn't need to show up in your head," Owen admits the theory is disconnected from the agent's actual reasons for living. As Marta notes (Move 7), this makes the agent's projects "line items in an impartial optimization." The two-level reply saves the *practice* but sacrifices the *agent's sovereignty*, which is exactly Williams's point.

  ### What Both of Them Are Missing

  There are two crucial elements absent from the exchange that clarify why you felt stuck.

  **1. The "Morality System" vs. Specific Theories**
  Owen treats this as Utilitarianism vs. Williams. Marta treats it as Impartiality vs. Partiality. Williams's deeper target (which Marta hints at in Move 9) is the **Morality System** itself—the idea that there is a supreme, obligatory "Ought" that trumps all other considerations.
  *   **What's missing:** Williams isn't just saying Utilitarianism is wrong; he's suggesting that *any* theory that demands we step outside our attachments to validate them (including Kantianism, as Owen notes in Move 8) is suspect. Owen thinks sinking Kant is a *reductio* of Williams; Williams would accept it as a feature. The missing piece is that Williams wants to dissolve the notion of "moral obligation" in these contexts, not just swap one obligation for another.

  **2. The Truth-Condition vs. The Guide-Book**
  Your hunch about decision-theory is the key. Owen is treating moral theory like a **decision algorithm** (Input: Situation -> Output: Act). In decision theory, the criterion can be hidden from the processor.
  Williams is treating moral theory as a **description of value**.
  *   **What's missing:** If I love my wife, and the *truth* is that she is valuable only because she generates utility, my love is based on a false premise (that she matters in herself). Owen's "two-level" view requires the agent to live a lie (or at least an ignorance) for the theory to work. Marta identifies this as "Government House Utilitarianism." The missing clarification is that Williams objects to a moral theory that cannot be openly avowed by the agent without undermining the very goods the theory seeks to maximize. Owen defends the *efficacy* of the theory; Williams attacks its *sincerity*.

  **Summary for the Group:**
  Tell Owen he is winning the debate on **engineering** (how to make utilitarianism work psychologically), but losing the debate on **philosophy** (what it means for a life to be good). Tell Marta she is right about Williams, but should emphasize that Williams isn't just defending "love," he's attacking the authority of the "Ought." Your decision-theory intuition was correct: Williams rejects the model of morality as a decision procedure entirely.
