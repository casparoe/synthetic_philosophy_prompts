answer: |-
  This is a sharp summary, and your mate is pointing at a debate that has raged in the philosophy of economics since 1953 (when Friedman published *The Methodology of Positive Economics*). The "F-twist" (a term coined by critic Mark Blaug) is one of the most cited and misunderstood arguments in social science.

  Here is a breakdown of your summary, sentence by sentence, from the perspective of a methodology specialist, followed by an assessment of your friend's distinction and the "as-if" question.

  ### Part 1: Sentence-by-Sentence Autopsy

  **Sentence 1:** *"A theory is just a tool for turning inputs into predictions, so the realism of its assumptions is neither here nor there — if anything the more unrealistic the better, because that's what buys you generality."*

  *   **The Nod:** A methodology expert would nod at the **instrumentalism**. Friedman explicitly argues that theories are "engines for analysis," not photographic reproductions of reality. They would also agree that abstraction (leaving things out) is necessary for generality.
  *   **The Wince:** They would wince at **"the more unrealistic the better."** This is the caricature version of Friedman. He argues that assumptions *must* be unrealistic in the sense of being *abstract* (ignoring minor details), but not *empirically false* in ways that impact the prediction. If an assumption is "unrealistic" because it ignores a dominant force, the theory fails.
  *   **The Flat Wrong:** **"Realism... is neither here nor there."** Friedman doesn't say assumptions are irrelevant; he says their *descriptive truth* is irrelevant to the *validity* of the theory, provided they yield accurate predictions. However, later critics (like Koopmans) showed that if assumptions are too far off, the predictions eventually break. Assumptions act as a diagnostic tool when predictions fail.

  **Sentence 2:** *"Perfect competition is the obvious case: it doesn't need any actual firms to be doing any actual competing, the only question is whether the predictions come out right."*

  *   **The Nod:** They would nod at **"the only question is whether the predictions come out right."** This is the core positivist criterion.
  *   **The Wince:** They would wince at the **Perfect Competition example.** Friedman's famous examples were actually expert billiard players and leaves on a tree. Perfect competition is a structural model about market concentration, not just behavior.
  *   **The Flat Wrong:** **"Doesn't need any actual firms to be doing any actual competing."** This is technically incorrect. Perfect competition assumes firms are price-takers. If firms are setting prices (monopolistic competition), the model's predictions *will* be wrong. The assumption describes the *environment*, not just the math. If the environment assumption is false, the prediction usually fails.

  **Sentence 3:** *"Which means that when someone objects that people obviously don't maximise utility, that isn't an objection at all."*

  *   **The Nod:** They would nod vigorously. This is the heart of the **"As-If" argument.** Friedman argues that we don't care if the agent *consciously* calculates; we care if they behave *as if* they did.
  *   **The Wince:** They might wince at the **finality.** Modern behavioral economics suggests that if people *systematically* fail to maximize (due to biases, heuristics), the predictions *will* be wrong. So, it *is* an objection if the deviation is systematic rather than random.
  *   **The Flat Wrong:** None, strictly speaking. This is a faithful representation of Friedman's specific claim regarding rationality.

  **Sentence 4:** *"Strip the labels off and it's just instrumentalism."*

  *   **The Nod:** **100% Nod.** Philosophers classify Friedman's position as instrumentalism (theories are tools, not truth-claims).
  *   **The Wince:** Some argue Friedman was a "subtle realist." He believed the market *actually* selects for rational behavior, so the assumption becomes true over time via evolution/selection, not just as a mathematical trick.
  *   **The Flat Wrong:** None. It is instrumentalism.

  ---

  ### Part 2: Your Mate's Distinction (The Three Types of "Unrealistic")

  Your mate is channeling the critique of Fritz Machlup and Paul Samuelson. They are correct: Friedman conflates three different types of assumptions, and treating them all as "unrealistic but fine" is where the methodology gets dangerous.

  1.  **Negligible Factors (True as far as it goes):**
      *   *Example:* Assuming a vacuum when dropping a feather in a dense room is wrong; assuming it in a vacuum chamber is fine.
      *   *Friedman's Take:* He accepts this. This is "abstraction."
      *   *Verdict:* Safe.

  2.  **Heuristic Falsehoods (False but provisional):**
      *   *Example:* Assuming agents have perfect information, knowing we will add "search costs" later.
      *   *Friedman's Take:* He accepts this *if* the prediction holds.
      *   *Verdict:* Risky. If you never relax the assumption, you might be building on a broken foundation.

  3.  **Domain Markers (Scope Conditions):**
      *   *Example:* "This theory applies only to large corporations."
      *   *Friedman's Take:* **Here is the error.** Friedman often treats scope conditions as if they were empirical assumptions.
      *   *Why it matters:* If an assumption is actually a **domain marker** (e.g., "firms are price takers"), it *must* be realistic for the theory to apply. If you say "firms don't compete" is just an unrealistic assumption, but it's actually a scope condition defining the market structure, you are applying the theory to the wrong data.

  **Does the conclusion about Utility Maximisation survive?**
  If we fix the errors using your mate's distinction:
  *   If "maximising utility" is a **Negligible Factor** (people approximate rationality well enough), the conclusion survives.
  *   If "maximising utility" is a **Domain Marker** (this theory only applies to trained traders), the conclusion survives *within that domain*.
  *   If "maximising utility" is a **Heuristic Falsehood** that is systematically wrong (e.g., loss aversion), the conclusion **fails**.

  Friedman relied on a **Selection Argument**: he believed market forces punish non-maximizers (they go bankrupt), so only maximizers survive. Therefore, even if humans *aren't* natural maximizers, the *population* behaves as if they are.
  *   **Modern View:** This survives in financial markets (where arbitrage is strong) but fails in consumer choice or voting (where there is no penalty for being irrational). So, the conclusion survives *conditionally*, not universally.

  ---

  ### Part 3: The "As-If" and the Sums

  **Does the "as-if" bit commit him to saying agents literally do the sums?**

  **No. Explicitly No.**

  This is the most common misunderstanding of Friedman. He uses the **Billiard Player Example**:
  *   *Premise:* If you want to predict the shots of an expert billiard player, you should use the laws of physics (conservation of momentum, angles, friction).
  *   *Objection:* But the player doesn't know calculus or physics!
  *   *Friedman's Reply:* It doesn't matter. If they didn't behave *as if* they knew the formulas, they wouldn't be an expert player. They might have learned by trial and error, but the *model* of them doing the sums predicts their behavior better than asking them what they are thinking.

  **The Nuance:**
  Friedman does **not** claim agents literally run Lagrangian optimizers in their heads. He claims that the *mathematical model* of optimization is the best tool we have to predict their output.

  However, there is a trap here. Later economists (particularly in the Rational Expectations era) often slipped from Friedman's "as-if" into **literalism**. They started assuming agents *actually* had the computational power to solve the models Friedman said were just tools. Friedman would have wince at that. He viewed the math as a tool for the *economist*, not a description of the *agent's brain*.

  ### Summary Verdict

  1.  **Your Summary:** It captures the *spirit* of Friedman but sharpens the edges into a caricature ("the more unrealistic the better").
  2.  **Your Mate:** Is methodologically sharper. Distinguishing between abstraction, provisional falsehood, and scope conditions is essential to saving Friedman from being "flat wrong."
  3.  **Utility Maximisation:** The defense survives only if market selection pressures are strong enough to weed out irrationality. In contexts where irrationality has no cost (like voting), the Friedmanite defense collapses.
  4.  **The Sums:** Friedman does not think agents do the math. He thinks the economist should do the math *about* the agents.

  If you want to sound like you've read the literature, tell your mate: *"Friedman conflates assumptions of negligible relevance with assumptions defining the domain of validity. If utility maximisation is a domain condition, it must be realistic. If it's just an abstraction for selection effects, it holds only where bankruptcy is a threat."*
