  I'm presenting a work-in-progress paper at a small interdisciplinary seminar next week and want a question-period prep sheet. My thesis is that "better than" is intransitive, but only within a grain. The setup I use: outcomes differ only in how many units of a single good they contain, and every added unit is a real improvement, so adding units always makes an outcome better; but an agent can discriminate two outcomes only if they differ by at least thirty units, so outcomes closer than that are indistinguishable to her. Take three outcomes A, B, and C differing by ten units each: A is better than B, B is better than C, and A and C are indistinguishable, so C is at least as good as A — the relation the agent can actually deploy is intransitive. My further claims are that this is the whole story, since every cycle is confined within a grain and a money pump can profit only by exploiting a cycle, so no pump can extract more than a grain; and that there is no agent-independent betterness for the grain to fall short of.

  The audience: two formal decision theorists who treat transitivity as a requirement of rationality and will reach for money-pump arguments; two ethicists who work on incomparability and vagueness and will say I have only redescribed the sorites; one welfare economist who will press on what "indistinguishable" is a fact about; and one logician who will ask what formal structure survives. Assume nobody has read the paper.

  Give me the objections in the order they will come, ordered by how likely and how damaging they are, each phrased the way that particular audience member would phrase it, with a two-minute reply, a note on where the reply is soft, and what I should concede versus hold. Include the objection I am hoping nobody asks. Return a single JSON object with fields: "objections" (an array, each element having "order", "raised_by", "objection", "likelihood", "damage", "stance", "reply", "weakest_point"); "concede_up_front" (array of strings); "one_reply_that_must_land" (string); and "hoping_nobody_asks" (an object with "raised_by", "objection", "why_it_scares_me", "best_available_reply"). Use American English throughout.
