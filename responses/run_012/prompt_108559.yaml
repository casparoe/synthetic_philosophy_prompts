  ### Notes on the choices

  The poem bets on the paradox being a linguistic trap where "worse" equivokes between moral quality and aggregate quantity. It frames the deontologist not as principled but as paralyzed, suggesting the constraint collapses under its own weight when the stakes are visible. The loop implies that the justification for constraints (agency) inevitably fuels the argument against them (outcome). This reading is unfair because it reduces agency to a superstition about stains rather than a commitment to respect persons as ends in themselves. It ignores that constraints protect the integrity of the moral agent, preventing them from becoming a mere conduit for utility. By focusing on the 2am exhaustion, the poem suggests principle is a luxury of daylight, whereas many argue it is the only thing that survives the night. It treats the agent's hands as the only thing that matters, caricaturing the view as selfishness rather than a theory of value.

  A good deontologist could argue that the loop isn't a trap but a boundary: the refusal to calculate lives is the only way to prevent treating humans as means. If I were convinced that agency creates a distinct moral universe rather than just a different calculation, I would write the loop as a ladder instead of a circle. The poem assumes the tension must break; a robust deontology says the tension is the point. To change the poem, I'd need to see constraint not as a limit on saving lives, but as the condition that makes saving them meaningful. If the constraint were shown to protect the very value we seek to maximize, the circle would open.
