      *   *Tension A (The Epistemic Clash):* C1 (We can/should explain via their standards) vs. C2 (We can't escape our standards).
          *   *Severity:* High. If C2 is true, C1 is an ideal we can't fully meet.
          *   *Resolution:* C1 is a regulative ideal, C2 is the ontological/epistemic constraint.
      *   *Tension B (The Moral/Explanatory Gap):* C1 (Explain via their reasons) vs. C3/C5 (Judge via timeless/available standards).
          *   *Severity:* Medium-High. This is the classic "blame in history" problem. If I explain them by their reasons, do I undermine the blame?
          *   *Resolution:* Distinguish *explanation* (C1) from *assessment* (C3/C5).
      *   *Tension C (The Usability Trap):* C7 (Fight now) vs. C1/C6 (Charity/Context).
          *   *Severity:* Medium. Presentist needs can distort charitable reconstruction.
      *   *Tension D (Realism vs. Perspectivalism):* C3 (Moral Realism) vs. C2 (No view from nowhere).
          *   *Severity:* Low/Medium. One is metaphysical, one is epistemic. Compatible if careful.

  5.  **Identifying Equivocations:**

      *   "Standards" (C1, C3, C5). In C1, it means "concepts for explanation." In C3, it means "objective moral truths." In C5, it means "normative expectations."
      *   "Available" (C1, C5). In C1, it means "conceptually intelligible to them." In C5, it means "morally accessible/demandable."
