      *   *C4 (Moral Progress):* Progress is real. Some periods get more things right. (Function: Justifies studying history as improvement, avoids cynicism).
      *   *C5 (Actual vs. Available Standards):* Blame/Judgment based on *available* norms (could have known), not just *actual* norms (did know). (Function: Allows moral criticism of past agents without anachronism).
      *   *C6 (Principle of Charity):* Treat dead like living. Maximize coherence/defensibility before blaming. (Function: Ethical treatment of subjects, prevents strawmanning).
      *   *C7 (Usability/Presentism):* History must speak to current fights. (Function: Justifies the discipline's social value).

  3.  **Initial Coherence Scan (Mental Sandbox):**

      *   *C1 vs. C3:* C1 says explain via *their* standards. C3 says moral facts are timeless. If slavery was wrong *then* (C3), why limit explanation to *their* standards (C1)? *Tension:* Explanation vs. Judgment.
