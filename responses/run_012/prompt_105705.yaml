      *   *C7 vs. C1:* C7 wants history to fight *now*. C1 says don't use categories they couldn't use. *Tension:* Presentist utility vs. Pastist integrity.
      *   *C7 vs. C2:* C7 wants usability *now*. C2 admits we are always situated *now*. These actually support each other.

