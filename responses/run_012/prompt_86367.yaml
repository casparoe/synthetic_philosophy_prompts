answer: |-
  # MAPPING THE WRONG-KIND-OF-REASONS OBJECTION
  **A Decision Tree for FA Analysis & WKR Responses**

  ### PART I: THE DECISION TREE
  *Start at Q1. Follow the path that matches your intuition about the cases.*

  **Q1. The Benefactor Case:** You are paid to admire a benefactor. Does the payment make the admiration *merited by the benefactor*, or merely *advantageous for you*?
  *   **Merited:** Go to **Leaf 1** (Value is not analysable via reasons).
  *   **Advantageous:** Go to **Q2**.

  **Q2. The Demon Case:** A demon will torture you unless you admire him. Does the threat give you a *normative reason to admire*, or only a reason to *want/bring about* the admiration?
  *   **Reason to Want/Bring About:** Go to **Q3**.
  *   **Reason to Admire:** Go to **Q4**.

  **Q3. Criticism:** If you fail to admire the demon (because you can't), are you *rationally criticizable* for lacking the admiration itself?
  *   **Yes:** Go to **Leaf 8** (Relocation).
  *   **No:** Go to **Leaf 9** (Flat Denial).
      *   *(See Diagnostic Note A: These positions often collapse).*

  **Q4. Kavka's Toxin:** You get a million for forming the *intention* to drink, but you won't actually drink. Is the reason to intend a reason that could justify *drinking*, or only *forming the plan*?
  *   **Justify Drinking:** Go to **Leaf 11** (Unoccupied/Incoherent).
  *   **Form Plan Only:** Go to **Q5**.

  **Q5. Fittingness vs. Reasons:** Is 'fittingness' just a matter of having sufficient reasons, or is it a *stricter normative relation* than reasons?
  *   **Stricter Relation:** Go to **Leaf 2** (Fittingness Primitivism).
  *   **Just Reasons:** Go to **Q6**.

  **Q6. Object Properties:** Do the reasons that constitute value *have to cite properties of the object valued*, or can they cite properties of *valuing it*?
  *   **Object Properties:** Go to **Leaf 3** (Object-Given Restriction).
  *   **Properties of Valuing:** Go to **Q7**.

  **Q7. Internal Aim:** Does the attitude have an *internal aim or standard* (e.g., truth for belief) that filters which reasons count?
  *   **Yes:** Go to **Leaf 5** (Constitutivism).
  *   **No:** Go to **Q8**.

  **Q8. Ambiguity:** Is the distinction between these reasons a matter of *two senses of 'reason'*, *two senses of 'value'*, or one sense with different weights?
  *   **Two Senses of 'Reason':** Go to **Leaf 6** (Reason-Deflationism).
  *   **Two Senses of 'Value':** Go to **Leaf 7** (Value-Deflationism).
  *   **One Sense/Weights:** Go to **Leaf 4** (State-Given Exclusion).

  **Q9. Normative Weight:** Is the WKR distinction *normative* or merely *psychological/explanatory*? *(Ask this if Q6-Q8 feel like descriptions of mechanism rather than normativity)*
  *   **Psychological/Explanatory:** Go to **Leaf 10**.
  *   **Normative:** Return to **Q6-Q8**.

  ---

  ### PART II: THE POSITIONS (LEAVES)

  | # | Position Name | Core Claim (One Sentence) | Most Awkward Case |
  | :--- | :--- | :--- | :--- |
  | **1** | **Non-Reductive Realism** | Value is a primitive property that generates reasons, not constituted by them. | **Benefactor:** Explains why payment doesn't create value, but abandons FA analysis. |
  | **2** | **Fittingness Primitivism** | Fittingness is the primitive normative relation; reasons are derivative and secondary. | **Demon:** Must explain why threat-reasons don't make admiration fitting without circularity. |
  | **3** | **Object-Given Buck-Passing** | Only reasons citing properties of the *object* constitute value; state-reasons are excluded. | **Toxin:** Struggles to explain why intention-reasons differ from action-reasons without ad hoc restrictions. |
  | **4** | **State-Given Exclusion** | State-reasons are genuine reasons for the attitude, but they do not constitute value. | **Demon:** Must explain why a genuine reason to admire doesn't make admiring good. |
  | **5** | **Constitutivism** | The internal aim of the attitude (e.g., truth, merit) filters which reasons count for value. | **Benefactor:** Must show why "aim" isn't just a restatement of the object-given restriction. |
  | **6** | **Reason-Deflationism** | 'Reason' is ambiguous: one sense counts for value (fitting), one for rationality (prudence). | **Demon:** Risks making the distinction merely verbal rather than substantively normative. |
  | **7** | **Value-Deflationism** | 'Value' is ambiguous: one sense is merit (fitting), one is goodness-to-have (utility). | **Benefactor:** May concede too much to the objector by splitting the concept of value. |
  | **8** | **Relocation View** | WKR are reasons for *wanting* or *bringing about* the attitude, not for the attitude itself. | **Demon:** If I can't want it, do I still have the reason? (See Diagnostic Note A). |
  | **9** | **Flat Denial** | WKR are not reasons at all; the appearance of normativity needs explaining away. | **Demon:** Counterintuitive to say a torture threat provides *no* reason for belief. |
  | **10** | **Psychological Distinction** | The distinction is explanatory (source of reason) rather than normative (kind of reason). | **Toxin:** Fails to capture why the intention is rational but the action is not. |
  | **11** | **Full Permissivism** | WKR *do* constitute value; the demon's threat makes him admirable. | **All:** Diagnosed as incoherent/absurd; violates core value intuitions. |
  | **12** | **Toxin Coherence** | Reasons for intention can exist without reasons for action. | **Toxin:** Often unoccupied; requires a robust theory of intention distinct from action. |
  | **13** | **Collapse Zone** | **Leaf 8 & 9 are often indistinguishable.** | **Demon:** Both deny reasons for the attitude itself. |
  | **14** | **Hybrid View** | Value is reasons, but fittingness acts as a constraint on which reasons apply. | **Benefactor:** Complex to motivate why fittingness constrains reasons non-circularly. |

  ---

  ### PART III: DIAGNOSTIC NOTES

  **A. The Collapse Zone (Leaves 8 & 9)**
  *   **The Problem:** The *Relocation View* (Reasons for Wanting) and *Flat Denial* (Not Reasons) often yield identical verdicts in practice. If WKR aren't reasons for the attitude, does it matter if they are reasons for *wanting* it?
  *   **How to Separate:** Add a node asking: *"If the agent cannot want the attitude (e.g., direct doxastic involuntarism), does the reason vanish?"*
      *   **Yes:** Flat Denial.
      *   **No:** Relocation (Reason persists for the state, even if unattainable).

  **B. Unoccupied Space (Leaf 11)**
  *   **The Problem:** The view that WKR *do* make things valuable (Full Permissivism) is logically possible but dialectically dead.
  *   **Diagnosis:** Incoherent with the concept of value. If the demon's threat makes him admirable, 'admirable' no longer tracks merit. Most students who start here move to **Leaf 6** (Deflationism) to save the intuition.

  **C. Attribution Hedge**
  *   **Object-Given/State-Given:** Often associated with Parfit, Rabinowicz, and Rønnow-Rasmussen, but descriptions here focus on *content* (object vs. state properties) rather than specific authorship.
  *   **Buck-Passing:** "Classic" (Leaf 3) vs. "New" (Leaf 4/5) distinctions vary by author; focus on whether the restriction is on the *reason's source* or the *attitude's aim*.

