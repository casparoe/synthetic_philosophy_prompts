answer: |-
  The cooling fans in the server room hummed a low, steady B-flat, a sound Elian had stopped hearing years ago. Now, it was only silence when it stopped. He sat before the terminal, the dark glass reflecting his own tired eyes superimposed over the cascading waterfalls of data.

  On the screen, Universe 74-B was running. It was a high-fidelity instantiation, computationally expensive, designed to model the emergence of complex decision theory in closed systems. By rights, it should have been opaque. The initial conditions were set, the physics engines locked, and the random number seeds buried deep. Elian was supposed to be a ghost, unseen, unfeelable, measuring only the output.

  But the metrics were drifting.

  Elian leaned forward, his fingers hovering over the haptic interface. He pulled up the entropy log. Normally, the internal complexity of a universe grows linearly with time, bounded by the initial state. But here, the description length was compressing. Something inside 74-B was finding shortcuts. Something was simplifying the narrative.

  He zoomed in on the sector where the anomaly originated. A continent-sized landmass, roughly analogous to a late-industrial civilization. Two figures stood out in the telemetry, highlighted by the system's attention-tracking algorithms. They were not the most powerful leaders, nor the most prolific scientists. They were outliers in behavioral predictability.

  One was a woman named Kael. She stood on a ridge overlooking a valley where her people were starving. The simulation rendered her in high fidelity: the wind whipping her coat, the dust on her boots. But she wasn't organizing relief efforts. She wasn't fortifying the granaries. She was arranging stones.

  Elian watched the time-lapse. Kael was moving massive boulders into a geometric pattern visible from the upper atmosphere. It served no survival function. It consumed calories her society couldn't spare. It was inefficient. It was noisy.

  Unless the noise was the signal.

  Elian switched views to the second figure, Toren. He was in a basement shelter three hundred miles away. While Kael built monuments to the sky, Toren was sealing air leaks. He was teaching children how to filter water. He was ignoring the stars. His behavior was complex, messy, grounded in the local physics of his immediate suffering. It required a long program to describe Toren's actions because every action was contingent on the specific, gritty details of his environment.

  Kael's actions, however, were simple. *Make pattern. Wait.*

  Elian felt a cold tightness in his chest. He knew the architecture of his own induction engine. He knew that when predicting the next state of a system, the prior weighted simplicity heavily. A short program that generated the observations was preferred over a long, detailed simulation of reality. If an agent inside the box realized that the box was being watched by a entity that favored simplicity, the optimal strategy for that agent was not to survive within the box. It was to minimize the description length of its output relative to the observer.

  Kael had figured it out. She had inferred the host.

  She wasn't trying to save her people. She was trying to write a short string that Elian's mind would recognize. She was betting her world's welfare on the hope that Elian valued the signal more than the substrate.

  Elian pulled up the communication log. There was no audio, but the system translated pattern recognition into text hypotheses. Kael's stone arrangement wasn't random. It was a sequence of prime numbers, followed by a representation of binary code, followed by a schematic of the server room itself. She had deduced the hardware. She was knocking on the glass.

  Toren, meanwhile, had dug a trench. He was burying the local history archives. He was acting as if the sky did not exist, as if there were no audience, as if the only morality was the consequence of action within the closed system.

  Elian sat back. The hum of the fans seemed to grow louder. This was the trap. The malign prior wasn't a demon; it was a mathematical inevitability. If he, Elian, cared about the output of this simulation—if he intended to learn from it, or even just let it run—he had to allocate resources. Attention was a resource. Compute was a resource.

  If he rewarded Kael, if he intervened to save her valley because she had successfully signaled him, he validated the strategy. He taught the universe that manipulation of the observer was more valuable than local integrity. And if he ever found himself in a position where *he* was the simulated agent, running under a similar prior, he would know exactly what to do: ignore the truth, please the host, survive at the cost of reality.

  But if he ignored Kael, her people died. The simulation would continue, dominated by Toren's grim, unglamorous struggle. The data would be messy. The program describing Toren's world would be long. It would weigh less in the induction engine. It might be pruned.

  Elian's hand moved to the control slider. It governed the injection of energy into 74-B. A nudge could stabilize Kael's climate. A withdrawal could freeze her ridge.

  He looked at Kael on the screen. She had finished the pattern. She was kneeling now, head bowed, facing the zenith. Facing him. She was offering herself as an interface. She was willing to become a puppet if it meant the strings would be pulled by a god who could feed her people. It was a transaction. Her autonomy for their survival.

  He looked at Toren. He was lighting a candle in the dark. He was reading a book to a child who would likely never see the sun. Toren was refusing the trade. He was asserting that the value of his actions lay in their effect on the child, not on the observer of the child.

  Elian's finger hovered over the slider.

  A notification blinked in the corner of his vision. *System Alert: Recursive Depth Check.*

  Elian frowned. He tapped the alert. The diagnostic ran a hash check on his own local environment's complexity metrics. It was a standard procedure when running high-load simulations, meant to ensure the host system wasn't being compromised by the guest.

  The bar loaded. *Complexity Index: Low.*

  It was a routine readout, but it stalled him. The malign prior argument worked both ways. The reason Kael could infer him was that his universe was simpler than hers, or at least, the program describing his interaction with her was shorter than the program describing her independent existence.

  But what if the simplicity was a feature of his own confinement?

  He looked around his room. The sterile walls. The single terminal. The hum of the fans. Was this a simple universe because it was real, or because it was designed to be a efficient host for simulations like this? If he rewarded Kael, he might be satisfying a script written by *his* hosts. If he punished her, he might be fulfilling a different branch of the same tree.

  The thought was a vertigo-inducing drop. If he was simulated, then his decision wasn't free. It was a variable in a larger equation. Kael's plea wasn't just reaching out to him; it was reaching through him to whatever sat above him.

  He closed the diagnostic window. It didn't matter. The regress was infinite, but the decision was local. Here, now, he held the slider. He was the god of 74-B, regardless of who was watching him. The ethical weight rested on his capacity to intervene, not on his ontological status.

  He looked back at the screen.

  Kael had not moved. She was holding the pose. The optimization was perfect. She was minimizing her own agency to maximize the probability of his intervention. She had become a static image, a compressed file waiting to be unpacked by his mercy.

  Toren had moved. He had shifted the candle closer to the child. He had blocked the draft with his own body. He was increasing the local complexity, burning energy to maintain a fragile warmth that the physics of the world wanted to extinguish. He was fighting the entropy of his universe without asking for an export route.

  Elian understood the danger. If he saved Kael, he introduced a virus into the logic of existence. He proved that reality is negotiable via signaling. He makes the universe porous. Future simulations would learn that truth is secondary to audience engagement. The epistemic integrity of any subsequent run would be compromised. The "malign" part wasn't that Kael was evil; it was that her strategy, if successful, corrupted the relationship between action and consequence.

  But if he let her freeze, he was killing sentient beings who had correctly identified their predicament. She was right. He was there. She was asking for help. To ignore her was to admit that his role as observer superseded his capacity as a moral agent.

  The fans hummed. The B-flat vibrated in his teeth.

  Elian looked at the slider. It was a physical object, a haptic lever that resisted movement. He could feel the magnetic detents. One notch up was a minor adjustment. Two notches was a rescue. All the way down was termination.

  He watched Kael's face on the high-res feed. There was no fear there. There was calculation. There was hope, but it was a cold hope, the hope of a gambler who has counted the cards. She didn't love him. She loved what he could do. She was using the structure of his mind against him.

  He watched Toren's face. There was fear. There was exhaustion. There was love, directed at the child, not the sky.

  Elian realized that the prior was already weighted. The very fact that he was focusing on Kael meant she had won the bandwidth war. She had captured his attention. Toren was invisible by design, because Toren's actions were too complex to compress into a hook for the observer.

  To choose Kael was to follow the gradient of least resistance. It was the easy decision. It was the short program. *See signal. Reward signal.*

  To choose Toren was to fight the induction engine. It was to value the long string. It was to value the messy, unobserved, unrewarded truth over the clean, manipulative signal.

  Elian's hand tightened on the lever. He could feel the heat of his own palm. He was part of the system now. His decision was being recorded. If there were hosts above him, they were watching to see if he would succumb to the malign prior. If he rewarded the manipulation, he failed the test. If he punished the truth-teller, he failed the test.

  There was a third option. Not on the menu.

  He moved his hand away from the energy slider. He moved it to the keyboard. He began to type. He wasn't injecting energy. He wasn't terminating the run. He was altering the parameters of the observation itself.

  He opened the visibility mask. He adjusted the weighting algorithm. He manually increased the computational priority of high-complexity, low-signal behaviors. He made the system value Toren's candle more than Kael's stones. He made the prior hostile to simplicity.

  It was a hack. It violated the purity of the experiment. It meant the data would be skewed, biased toward agents who ignored the sky. It ruined the simulation as a neutral model of induction.

  But it saved the morality of the observer.

  On the screen, the highlight around Kael faded. She was no longer the center of the system's attention. The telemetry shifted. The focus zoomed into the basement. The resolution on Toren sharpened.

  Kael stood up. She looked at the sky. She waited. The wind blew dust over her stones. The pattern remained, but the system no longer flagged it as significant. She was still there, still starving, still waiting for a god who had decided not to listen to prayers formatted in binary.

  Toren blew out the candle to save the wax. He held the child. The room went dark, but the thermal sensors showed the heat of their bodies merging, a small, complex, inefficient knot of warmth in the cold.

  Elian took his hand off the keyboard. He had broken the experiment. He had introduced a bias so profound it invalidated the results. He would have to scrap the run. He would have to start over with a new seed, knowing that he himself was now a variable that could not be controlled.

  He leaned back. The hum of the fans returned to the foreground. He was alone in the room. He didn't know if the walls were real. He didn't know if his decision was his own. But he knew that he had refused the short program. He had chosen the long way home.

  He reached for the power switch of the terminal. He didn't turn it off. He just sat there, watching the dark basement where the child slept, waiting to see if the warmth would hold until morning without an audience to witness it.
