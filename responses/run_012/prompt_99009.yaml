      *   **Test Set:** Use the provided Marrow Bay cases (four-way stop wave, stone on windowsill, thank-you book, thanking bus driver) alongside standard ones (tipping, queueing, jaywalking). Include odious conventions (youngest eats last/sexist) and changing conventions.
      *   **Output Format:** Requirements list (sentence, motivation, negotiable/non-negotiable), identification of incompatibilities/tensions, closing analysis of specific theoretical approaches (Humean, Kantian, Virtue/Civility). A table is welcome for requirements. No reading list/citations.
      *   **Tone:** Analytical, rigorous, willing to challenge common prejudices (e.g., consent, universal bindingness).

  2.  **Deconstruct the Problem Space:**
      *   What is the core puzzle? Why do arbitrary local rules (drive on the left, tip 20%, leave a stone) feel morally weighty, yet sometimes feel negligible or even wrong?
      *   A theory needs to explain *when* and *why* a convention generates a normative reason (obligation, expectation, blame).
      *   The Marrow Bay cases introduce specific complexities:
          *   *Arbitrariness with local logic:* Four-way stop (second goes first).
          *   *Symbolic expression:* Stone on windowsill (care vs. neglect).
          *   *Substitution:* Service charge included vs. thank-you book (money vs. words).
          *   *Integration:* Thanking the bus driver (insider vs. outsider status).
          *   *Injustice:* Youngest eats last (gendered burden).
          *   *Temporality:* Conventions change over generations.

  3.  **Brainstorming Desiderata (The "Must-Haves" and "Nice-to-Haves"):**
      *   *Action-Guidance:* If I'm in Marrow Bay, I need to know what to do. (Knowability)
      *   *Bindingness:* Why can't I just ignore the stone custom? (Normative Force)
      *   *Scope:* Does it bind tourists? New residents? (Jurisdiction/Insider status)
      *   *Content-Independence:* Does the rule bind *because* it's a rule, or because it's *good*? (The "odious convention" problem)
      *   *Stability vs. Change:* How does the theory handle the fact that rules evolve? (Diachronic coherence)
      *   *Blame/Reactive Attitudes:* Why is omitting the stone seen as "not caring"? (Social Sanction)
      *   *Coordination:* Does it solve a coordination problem? (Humean angle)
      *   *Respect:* Is it about respecting persons or respecting the practice? (Kantian/Virtue angle)

  4.  **Developing the Tensions/Incompatibilities:**
      *   *Tension 1: Knowability vs. Outsider Bindingness.* If I didn't know the rule (tourist), can I be blamed? If the theory says "yes, conventions bind all present," it violates "ought implies can/know." If it says "no," it undermines the social function of the convention (e.g., the bus driver feels slighted regardless of my origin).
      *   *Tension 2: Content-Independence vs. Moral Constraints.* If conventions bind *just because* they are conventions (to maintain order), then the odious "youngest eats last" rule might bind. If the theory says "unjust conventions don't bind," it makes the normative force dependent on content, not convention-status.
      *   *Tension 3: Voluntarism vs. Embeddedness.* Did I consent to the stone rule by walking down the street? If yes, fiction. If no, where does the obligation come from?

  5.  **Drafting the Requirements (Iterative Refinement):**
      *   *Req 1: The Identification Condition.* Must distinguish conventions from mere habits or laws.
      *   *Req 2: The Normative Gap.* Must explain why "is" (people do this) becomes "ought" (you should do this).
      *   *Req 3: The Insider/Outlier Distinction.* Must account for different expectations for locals vs. visitors.
      *   *Req 4: The Injustice Constraint.* Must handle odious conventions without collapsing into general moral theory.
      *   *Req 5: The Diachronic Flexibility.* Must handle changing norms (crank vs. obligation).

      *Refining the "Prejudices":* The prompt asks me to call out prejudices.
      *   Prejudice: "Consent is required." (Most conventions are non-consensual).
      *   Prejudice: "All conventions bind equally." (Some are trivial).
      *   Prejudice: "Visitors must be treated exactly like locals." (Ignorance matters).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gap in the literature and the goal (specification, not verdict).
      *   **The Desiderata Table:** Columns: Requirement, Motivation (Case), Status (Non-negotiable/Preference).
      *   **The Incompatibility Cluster:** Deep dive into the tensions identified in step 4.
      *   **The "Killer" Requirement:** Identify the one that filters out the most theories.
      *   **Theoretical Scorecard:** Briefly assess Humean, Kantian, Virtue accounts against the spec.

  7.  **Fleshing out the Content (incorporating Marrow Bay):**
      *   *Four-way stop:* Shows arbitrariness + local rationality.
