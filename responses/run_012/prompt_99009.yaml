  1. **Universal Jurisdiction:** Any agent within the physical locus of the convention is bound by it.
  2. **Epistemic Transparency:** An agent is only bound by norms they could reasonably be expected to know.
  3. **Implicit Opacity:** Many constitutive conventions are not written, taught, or obvious to outsiders (e.g., the stone, the wave).
