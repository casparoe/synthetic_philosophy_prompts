      *Let's finalize the "Killer Requirement":* **The Non-Reducibility Condition.** The normative force of the convention cannot be fully reduced to the moral value of the outcome *nor* to the prudential value of avoiding sanction. It must be *sui generis* conventional obligation. This kills Act Utilitarianism and Psychological Egoism.

