      *   *Bus driver:* Shows the visitor problem.
      *   *Youngest eats last:* Shows the moral limit problem.

  8.  **Refining the "Killer Requirement":**
      *   What kills the most theories? Usually, it's the tension between *arbitrariness* and *moral force*. A theory that requires the content to be morally good kills the idea of convention-specific force. A theory that requires pure coordination fails on the "stone" case (no coordination problem there).
      *   *Decision:* The "Content-Independence vs. Moral Constraint" tension is the hardest. But the prompt asks for a *single requirement*. Let's go with **The Discrimination Requirement**: The theory must distinguish between conventions that generate genuine moral obligations and those that generate merely social expectations, without relying solely on the gravity of the underlying act. (Actually, better: **The Outsider Ignorance Constraint**).
      *   *Re-evaluation:* The prompt asks for the requirement that eliminates otherwise popular theories. The "Consent" prejudice is popular but false. The "Universal Bindingness" is popular but false.
      *   *Selection:* **The Non-Voluntarist Bindingness Requirement.** (Obligations arise without explicit consent). This kills contractarianism. Or **The Content-Independence Limit.** (Conventions bind *as* conventions, but not if evil).
      *   *Best Fit:* **The Epistemic Accessibility Condition.** (You can't be bound by what you can't know). This kills strict conventionalism that binds visitors immediately.
      *   *Wait, looking at the prompt's specific request:* "Close by naming the single requirement that does the most to eliminate otherwise popular theories."
      *   *Idea:* The requirement that **Normative Force must be distinct from both Pure Prudence and Deep Morality.** It has to occupy the "middle ground." Many theories collapse into one or the other.
      *   *Alternative:* The requirement that **The theory must explain blame for omission without malice.** (The stone case). You didn't mean harm, but you are blamed.
      *   *Let's go with:* **The Arbitrary-Arbitration Requirement.** The theory must explain why an arbitrary rule (second car goes) generates a reason that overrides personal preference, *without* requiring the rule to be morally optimal. This kills Utilitarianism (act by act) and strict Kantianism (universal law).

      *Actually, let's look at the "Incompatibilities" section I planned.* I need to highlight a subset that cannot be jointly satisfied.
      *   Set: (1) Obligations are knowable ex-ante. (2) Outsiders are bound immediately upon entry. (3) Conventions are often opaque/implicit.
