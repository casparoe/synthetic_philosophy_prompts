answer: |-
  ### Specification for a Theory of Conventional Normativity

  The following specification outlines the necessary conditions any adequate theory must meet to explain the normative force of local conventions. This is not a theory of ethics generally, but a theory of the *sui generis* obligation generated by social practices that are arbitrary in origin but binding in effect.

  #### I. The Desiderata Table

  | # | Requirement | Motivation (Case/Consideration) | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Arbitrariness Condition:** The theory must explain why an agent has a reason to follow a rule even when an alternative rule would have served the same functional purpose. | *Marrow Bay Four-Way Stop:* Waiting second works just as well as waiting first. The force comes from *this* being the rule, not from the rule being uniquely optimal. | **Non-Negotiable** |
  | **2** | **The Expressive Condition:** The theory must account for conventions that serve no coordination function but act as signals of internal states (care, respect, grief). | *Marrow Bay Stone:* Leaving the stone coordinates nothing; it signals care. Omitting it is read as a moral failing (indifference), not a coordination failure. | **Non-Negotiable** |
  | **3** | **The Epistemic Accessibility Condition:** An agent cannot be morally blameworthy for violating a convention they could not reasonably have been expected to know. | *The Bus Driver:* A visitor from a "silent boarding" city cannot be genuinely culpable for silence in Marrow Bay until the norm is made accessible to them. | **Non-Negotiable** |
  | **4** | **The Diachronic Stability Condition:** The theory must explain how a convention loses binding force over time without the underlying moral facts changing. | *Generational Change:* A practice obligatory for grandparents is "crankish" for grandchildren. The theory must locate the source of decay in the practice, not the world. | **Non-Negotiable** |
  | **5** | **The Substitution Condition:** The theory must allow for the normative equivalence of different media of compliance (money, labor, words) within a specific context. | *Marrow Bay Café:* Service is paid, yet a note is required. The theory must explain why the note carries the normative weight of a tip elsewhere. | **Preference (Expressivist Camp)** |
  | **6** | **The Jurisdiction Condition:** The theory must distinguish between the normative grip a convention has on a member versus a transient visitor. | *Bus/Queue:* Locals are bound strictly; visitors are often granted a grace period. A theory that binds all equally fails; one that binds none fails. | **Non-Negotiable** |
  | **7** | **The Injustice Constraint:** The theory must provide a mechanism to declare a convention normatively void if it violates fundamental moral rights, even if locally accepted. | *Youngest Eats Last:* If the custom disproportionately burdens one sex, the theory must allow agents to reject it without being "rule-breakers" in the negative sense. | **Non-Negotiable** |
  | **8** | **The Voluntarist Condition:** The theory must derive obligation from the explicit or implicit consent of the participant. | *General Intuition:* Many feel they are only bound by rules they "agreed" to by staying in town. | **Prejudice (See Below)** |
  | **9** | **The Content-Independence Condition:** The theory must assert that the force of the convention is independent of the moral quality of the act required. | *Queueing:* We queue because it is the rule, not because queueing is inherently virtuous. | **Preference (Formalist Camp)** |

  #### II. Identified Prejudices

  In constructing the table above, I have classified several common demands as **Prejudices** rather than genuine requirements. A robust theory should reject these:

  1.  **The Consent Prejudice (Req #8):** It is a prejudice to demand that obligation derive from consent (tacit or explicit). In Marrow Bay, you are bound by the stone custom simply by being a neighbor; you did not sign a contract. Requiring consent renders most social norms non-binding, which contradicts the phenomenology of social life (e.g., feeling rude when you forget the note).
  2.  **The Universal Bindingness Prejudice:** It is a prejudice to assume visitors must be held to the exact same standard as locals immediately. A theory that insists the tourist is *morally wrong* for not thanking the bus driver on day one ignores the Epistemic Accessibility Condition.
  3.  **The Triviality Prejudice:** It is a prejudice to demand the theory remain silent on "manners." The stone case shows that manners (leaving a stone) are the *vehicle* for moral assessment (caring for the bereaved). A theory that separates "etiquette" from "ethics" cannot handle Marrow Bay.
  4.  **The Optimization Prejudice:** It is a prejudice to demand that the convention be the *best* possible rule. The four-way stop (second goes) is less efficient than first-come-first-served, yet it binds. A theory that requires the rule to be optimal dissolves convention into act-utilitarianism.

  #### III. The Incompatibility Cluster (The Trilemma)

  There is a subset of requirements that cannot be jointly satisfied. Any adequate theory must explicitly sacrifice one of the following three propositions. This is not a bug to be solved, but a feature of social ontology that the theory must navigate.

  1.  **Universal Jurisdiction:** Any agent physically present within the locus of the convention is immediately bound by its normative force.
  2.  **Epistemic Transparency:** An agent is only bound by norms they could reasonably be expected to know (Ought Implies Can Know).
  3.  **Implicit Opacity:** Many constitutive conventions are inherently implicit, unwritten, and opaque to outsiders (e.g., the specific meaning of the stone, the wave at the stop).

  **The Tension:**
  If **Implicit Opacity** is a fact of social life (which it is; the stone custom is not posted on a sign), then **Universal Jurisdiction** and **Epistemic Transparency** are logically incompatible.
  *   If you hold that visitors are bound immediately (**Universal Jurisdiction**), you must admit they can be blameworthy for violating rules they couldn't know (**Violates Transparency**).
  *   If you hold that ignorance excuses (**Transparency**), you must admit that visitors are not bound until they learn the rule (**Violates Universal Jurisdiction**).

  **Why this is not merely apparent:**
  This is not a matter of better drafting. It is a conflict between the *function* of conventions (to coordinate/express immediately) and the *fairness* of blame (which requires knowledge).
  *   *Humean Coordination* tends to sacrifice Transparency: If you disrupt the equilibrium, you cause harm, regardless of intent.
  *   *Kantian Respect* tends to sacrifice Universal Jurisdiction: You cannot disrespect a rule you do not know exists; thus, the visitor is exempt until informed.
  *   *Virtue Ethics* tends to sacrifice Implicit Opacity: It assumes a person of practical wisdom (*phronimos*) would intuit the norm, which places an unrealistic burden on the outsider to "read the room."

  A specification-compliant theory must state which horn it accepts. It cannot have all three.

  #### IV. The Killer Requirement

  The single requirement that does the most to eliminate otherwise popular theories is **The Expressive Condition (Req #2)**.

  **Why:**
  Most dominant theories of convention are built on **Coordination** (Lewis/Hume) or **Fairness** (Rawls/Hart).
  *   **Coordination accounts** fail because the *Marrow Bay Stone* is not a coordination problem. It does not matter if everyone leaves a stone; it matters if *you* leave a stone to signal care. A coordination account cannot explain why omitting the stone is a *moral* failing (indifference) rather than just a statistical anomaly.
  *   **Fairness/Reciprocity accounts** fail because the *Marrow Bay Café Note* requires labor (writing) where money (tip) is already paid. There is no unfair advantage gained by not writing the note. The obligation is expressive, not distributive.

  Any theory that reduces convention to "solving a collective action problem" or "preventing free-riding" will collapse when faced with the Stone or the Note. The theory must account for **constitutive expression**: the act *is* the care, not a means to it.

  #### V. Theoretical Scorecard

  Here is how three major theoretical frameworks fare against this specification:

  | Theory | Performance against Specification | Fatal Flaw relative to Desiderata |
  | :--- | :--- | :--- |
  | **Humean Coordination** | **Passes:** Arbitrariness, Diachronic Stability.<br>**Fails:** Expressive Condition, Injustice Constraint. | Treats the *Stone* as a coordination equilibrium. It cannot explain why breaking the norm is *uncaring* rather than just *disruptive*. It struggles to condemn the *Youngest Eats Last* custom if that custom is a stable equilibrium. |
  | **Kantian Universalizability** | **Passes:** Injustice Constraint, Epistemic Accessibility.<br>**Fails:** Arbitrariness Condition, Substitution Condition. | Cannot justify *why this rule* (second car goes) rather than *that rule*. It demands a rational basis for the norm that often doesn't exist. It struggles with the *Café Note* because writing a note cannot be universalized as a duty in the same way truth-telling can. |
  | **Virtue / Civility** | **Passes:** Expressive Condition, Jurisdiction Condition.<br>**Fails:** Epistemic Accessibility, Diachronic Stability. | Assumes the agent should "know better" (violating Transparency for outsiders). It struggles to explain why a virtue (care) becomes *obligatory* via a specific arbitrary mechanism (the stone) rather than through general benevolence. It makes the decay of norms (Generational Change) look like moral decline rather than social shift. |

  **Conclusion for the Unit:**
  Your students should not be asked "Is tipping right?" They should be asked "Which of the three horns of the Trilemma does your justification for tipping sacrifice?" If they argue tipping is obligatory for all (Jurisdiction), they must explain how tourists know the rate (Transparency). If they argue tourists are exempt (Transparency), they must explain why the norm doesn't bind them immediately (Jurisdiction). If they argue the norm is implicit (Opacity), they must explain why ignorance isn't an excuse. This moves the debate from intuition-trading to structural analysis.
