answer: |-
  Here are 8 questions designed to press the metaphysical naturalness solution without rehashing Goodman 101. They're tuned for an audience that cares about epistemic justification, Bayesian updating, and map/territory distinctions.

  For each question, I've included the **Likely Answer** (based on her published view) so you know why the follow-up is constructed the way it is.

  ### 1. The Epistemic Access Problem
  **Question:** You argue that we need natural properties to solve induction. But doesn't identifying which properties are "natural" itself require inductive success? If we need induction to find naturalness, and naturalness to justify induction, aren't we just spinning in a circle?
  **Likely Answer:** She will likely deny the circle, claiming naturalness is a metaphysical fact we grasp via intuition or inference to the best explanation, not via induction itself.
  **Follow-up:** If it's grasped via intuition or IBE, isn't that just a label for "the inductions that happen to work"? How do you distinguish "grasping naturalness" from "having a successful prior" without begging the question?

  ### 2. Explanatory Power vs. Relabeling
  **Question:** Let's grant that natural properties exist. Does positing them actually *explain* why induction works, or does it just relabel the problem? Saying "green is projectible because it's natural" feels like saying "opium puts you to sleep because of its dormitive virtue."
  **Likely Answer:** She will likely argue it's not relabeling because naturalness constrains hypothesis space and prevents overfitting, offering structural explanation.
  **Follow-up:** If the work is being done by the constraint on hypothesis space, why do we need a *metaphysical* ground for that constraint? Why isn't a pragmatic or syntactic constraint sufficient?

  ### 3. The Subjective Bayesian Objection
  **Question:** A subjective Bayesian says the Grue problem is solved by assigning "All emeralds are green" a higher prior than "All emeralds are grue." Once you pick your prior, the updating does the rest. Why is that insufficient?
  **Likely Answer:** She will likely argue that subjective priors are arbitrary unless constrained by something objective, otherwise rationality is ungrounded.
  **Follow-up:** If naturalness is just the mechanism that constrains the prior, haven't you just moved the problem from "justifying induction" to "justifying the link between naturalness and priors"? What bridges that gap?

  ### 4. Objective Priors and Computation
  **Question:** Are you advocating for a form of Objective Bayesianism where naturalness dictates the prior probabilities? If so, how do we compute those priors without already knowing the outcome of the induction?
  **Likely Answer:** She will likely say we don't compute them precisely, but use naturalness as a qualitative guide for theory choice.
  **Follow-up:** If it's only a qualitative guide, doesn't that leave room for Grue-like predicates to sneak in under vague definitions of "natural"? Where is the hard stop?

  ### 5. Contingency of Naturalness
  **Question:** Is the claim "green is a natural property" contingent or necessary? Could there be a possible world where Grue is the natural property and Green is the gerrymandered one?
  **Likely Answer:** She will likely say it's necessary (or at least fixed across nomologically possible worlds) because naturalness carves reality at the joints.
  **Follow-up:** If it's necessary, why does our access to it depend on empirical investigation? If it's contingent, how do we know we aren't in a world where naturalness flips next Tuesday?

  ### 6. Falsifiability and Evidence
  **Question:** What observation would convince you that Green is *not* a natural property? If no empirical evidence could falsify the claim, isn't it metaphysical baggage rather than a scientific hypothesis?
  **Likely Answer:** She will likely say it's not directly falsifiable but is supported by the success of the theories that use it (IBE).
  **Follow-up:** But Grue-based theories can also be made to fit the data retrospectively. If success is the only metric, aren't we back to pragmatic entrenchment rather than metaphysical naturalness?

  ### 7. New Predicates and Entrenchment
  **Question:** Consider "quark." In 1800, "quark" wasn't a projectible predicate. Now it is. Did the property become natural, or did we just discover it? If we discovered it, how did we know to look without prior induction?
  **Likely Answer:** She will likely say we discovered a pre-existing natural property; the predicate was just unavailable linguistically.
  **Follow-up:** If the property was pre-existing, why was induction using "quark" impossible before 1800? Doesn't that suggest projectibility is tied to our conceptual scheme, not just the territory?

  ### 8. Grue-ing Naturalness Itself
  **Question:** You reject Grue because it's time-indexed. But why can't I define "Natural*" as "natural before 2050 and unnatural after"? Doesn't your solution invite a regress where we need a meta-property to validate naturalness?
  **Likely Answer:** She will likely say naturalness is timeless and cannot be time-indexed by definition.
  **Follow-up:** Why is time-indexing blocked for metaphysics but allowed for colors? If the block is just "because naturalness is timeless," isn't that an axiom saved from refutation by stipulation?

  ***

  ### The Verdict

  **She can't answer Question 1 (The Epistemic Access Problem).**

  **Why I'd bet that way:**
  This is the classic regress objection to Lewis-style realism about natural properties, and it remains the sharpest knife in the box. Her position relies on a distinction between the *metaphysical* ground of induction (naturalness) and the *epistemic* process of confirmation. But she needs a bridge between them.

  If she says we know naturalness through **empirical science**, she's circular (science uses induction).
  If she says we know it through **intuition or metaphysical insight**, she loses the LW crowd immediately (it sounds like qualia or magic).
  If she says we know it through **Inference to the Best Explanation**, she's begging the question (IBE *is* an inductive principle that needs the very justification she's trying to provide).

  She will likely try to dance around this by saying naturalness is a "primitive," but for a rationalist audience, positing a primitive to solve a justification problem looks exactly like relabeling the mystery. She can assert the map matches the territory, but she cannot explain how we check the match without already trusting the map.
