      *Wait, looking at standard literature (e.g., Weisberg "Varieties of Bayesianism"):* The "Partition Problem" is indeed the standard name for this. The consensus is that JC is underdetermined without a theory of input. But most Bayesians don't think this makes it "not a genuine rule." They think it makes it a *conditional* rule ("*If* your experience is best modeled as a shift on partition X...").
