prompt: |-
  I've been reading about the situationist critique of virtue ethics — the psychology experiments where whether someone helps a stranger depends on things that have nothing to do with their character, like whether they just found a dime in a phone booth, whether they're in a hurry to get somewhere, or how far away the person in trouble is — and it got me thinking about a practice I run into all the time. Courts let a defendant call character witnesses to say he's honest and peaceable and law-abiding, judges treat a clean record as evidence of good character at sentencing, and employers and licensing boards lean on reference letters the same way. The whole thing seems to assume a person carries traits around with them that reliably show up across situations, which is kind of exactly what those experiments seem to undercut. So what view of character does the practice actually presuppose? Does it need the strong claim that traits are stable across situations, or would something weaker do — traits that are reliable only in the kinds of situations the court or the employer actually cares about? Which rival accounts of character would license the practice just as well, so it turns out to be philosophically underdetermined? And if the situationists are basically right, what would have to change about how we use character evidence? Give it to me as a numbered list of exactly five points, a sentence or two each, no intro or conclusion. Be upfront about what would change your mind — which experiment or argument would flip your verdict — and where your reasoning is most likley to break down.
