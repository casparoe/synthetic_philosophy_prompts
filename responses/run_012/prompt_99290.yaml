      *   *Drafting "The View It's Smuggling In":* This approach assumes that moral status works like a membership card rather than a volume knob, where you either qualify for protection or you don't. It implies that while suffering might vary in intensity, the legal obligation to prevent it only kicks in once an animal crosses a specific threshold of cognitive complexity or proof. Under this view, the law isn't trying to map the exact contours of consciousness but is instead establishing a minimum standard of complexity required to demand that humans change their behavior.
