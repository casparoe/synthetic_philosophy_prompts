answer: |-
  The snag
  You are stuck on the mismatch between the science, which describes sentience as a sliding scale of evidence and capacity, and the law, which treats it as a binary switch that is either on or off. This creates a confusing boundary where a lobster is legally protected based on strong evidence while a bee is excluded based on weak evidence, even though the difference in their inner lives might be negligible.

  The view it's smuggling in
  This approach assumes that moral status works like a membership card rather than a volume knob, where you either qualify for protection or you don't. It implies that while suffering might vary in intensity, the legal obligation to prevent it only kicks in once an animal crosses a specific threshold of cognitive complexity or proof. Under this view, the law isn't trying to map the exact contours of consciousness but is instead establishing a minimum standard of complexity required to demand that humans change their behavior.

  Needed or just cosy
  The law strictly needs a clear, enforceable rule that doesn't require judges to debate neuroscience in every courtroom, but it doesn't actually need to claim that excluded animals feel nothing. The binary line is "just cosy" because it simplifies administration and avoids awkward questions about farming insects, rather than reflecting a hard truth about where consciousness begins. What is truly necessary is a pragmatic cutoff where the burden of proof shifts, not a metaphysical claim that a honeybee has zero inner life.

  Where it's up in the air
  This system leaves it completely open whether the line is drawn because insects lack moral worth, because their suffering is too faint to measure, or because protecting them would be too costly for society. A person who believes only humans have souls could support this law, and so could someone who believes all life matters but thinks we must prioritize resources where suffering is worst. Because the law focuses on lists rather than principles, it allows people with totally different theories about minds to agree on the same rules without resolving their deeper disagreements.

  What would change
  If we took degrees seriously, legislation would become a sliding scale where protections match the strength of evidence, meaning killing a crab might require more justification than killing a beetle but less than killing a pig. For you personally, it would shift the focus from asking if an animal is "in or out" to weighing the severity of the harm against the necessity of your action. We would likely see tiered welfare standards that acknowledge some suffering matters less than others, forcing us to accept that while we shouldn't torture insects, we don't owe them the same safeguards we owe a dog.
