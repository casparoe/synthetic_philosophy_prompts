answer: |-
  Good evening to all of you. We are gathered here from different corners of a life, and indeed from different corners of the intellectual world. Some of you know the weight of the volumes sitting on her desk. Some of you know the weight of the person who wrote them. And some of you are simply here because you love her, which is perhaps the only qualification that truly matters. For forty years, she has devoted herself to a single task: the assembling of a catalogue. It is a record of every surviving letter, every instrument, every marginal note connected to a figure who, by most standards, was minor. But she knew that nothing human is truly minor if looked at closely enough. She has spent four decades proving that the size of a subject does not dictate the size of the truth required to understand it.

  I have been asked to say a few words about what she has meant to us. I find myself in a position similar to the one she occupies in her study. I look at the evidence of her life and I want to record it accurately. I want to make claims that will stand up to scrutiny. It is my sincere conviction that she never missed a deadline. I have checked the records of my own memory, and I cannot find a single instance where her word was not her bond. It is my sincere conviction that she read paleography the way other people read novels. I have watched her decipher handwriting from the seventeenth century with a fluency that seemed to bypass the eye and go straight to the mind. It is my sincere conviction that her footnotes have rescued three generations of graduate students. I am living proof of this rescue, as are many others in this room who found a path through the dark because she had already lit a candle in the margin.

  It is my sincere conviction that she was kind to me when I was useless. There were days when I had nothing to offer but confusion, and she offered patience in return. I believe this to be true. I believe each of these statements to be true. If you were to take any single sentence I have just spoken and test it against the world, I would bet on its accuracy. I would stand by each one individually, just as she would stand by each entry in her catalogue. She verified every date. She authenticated every signature. She treated every fragment as if it were the whole story.

  And yet, we are historians. We know that a catalogue is not the thing itself. We know that a list of true statements does not necessarily constitute a complete truth. I stand here tonight aware that while I believe each claim I have made, I cannot believe that the collection of them is without error. It is a strange condition to be in, to affirm every sentence while doubting the conjunction of them all. I suspect that somewhere in what I have said, or in what I feel, there is a mistake. Perhaps I have forgotten a deadline she missed. Perhaps my memory of her kindness smooths over a moment of frustration that was actually quite sharp. Perhaps the footnote that saved me was less precise than I remember. I do not know which claim might fail. I only know that in any long accumulation of human effort, error is not just possible; it is inevitable.

  This is not a failure of love. It is a condition of it. When she looked at her subject, she did not pretend to know everything. She knew that even an exhaustive catalogue is only a map, and that the territory is always larger than the lines we draw to contain it. She taught us that rigor is not the same as certainty. She taught us that we can believe in the truth of our work while acknowledging the fallibility of our hands. I try to carry this lesson into my own writing. I am currently writing a preface to a book of my own, and I find myself admitting that despite my best efforts, some of what follows is wrong. I write this because she taught me that honesty about our limits is the only way to honor the truth we are chasing.

  So I do not offer you a perfect portrait tonight. I offer you a series of claims that I believe, knowing that they are subject to the same laws of probability as any other human endeavor. Like the tickets in a lottery, each memory seems certain to hold its value, yet we know they cannot all guarantee the winning picture. The value is not in the infallibility of the list. The value is in the act of listing. The value is in the forty years of showing up. The value is in the kindness that was offered even when it was not recorded.

  We are here to celebrate a career that admits its own boundaries. She has spent a lifetime gathering fragments, knowing she could never gather them all. She has spent a lifetime telling the truth, knowing she could never tell the whole of it. That is why we trust her. That is why we love her. We love her not because she was perfect, but because she was rigorous enough to know she was not. We love her because she treated her work like a preface, always open to correction, always pointing toward something larger than itself.

  So I raise my glass. I raise it to the deadlines she kept. I raise it to the footnotes she wrote. I raise it to the kindness she showed. I raise it to the errors I know are there, hidden in the fine print, because they prove she was human. I raise it to the catalogue, which is finished. And I raise it to the life, which is not. To her.
