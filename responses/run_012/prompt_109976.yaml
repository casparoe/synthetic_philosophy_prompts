      *   **Core Constraint/Theme:** The Preface Paradox (believing each individual claim but not the conjunction of all claims) and the Lottery Paradox (believing each ticket loses but not all lose).
      *   **Structural Requirement:** Each sentence/claim must stand on its own as sincerely assertable, but the speech must never quite assert the conjunction of all of them. The ending should feel like a preface (acknowledging fallibility/incompleteness) rather than a peroration (definitive summary).
      *   **Tone:** Formal but affectionate. Accessible to non-historians.
      *   **Prohibitions:** Do not explain the paradoxes as a lecture. Do not use the phrases "preface paradox" or "lottery paradox" unless natural (better to avoid to ensure subtlety). No headings, bullets, bold text, etc. Continuous prose.
      *   **Focus:** About *her* (the advisor), not the speaker or the speaker's book (though the speaker's book preface is the private motivation).

  2.  **Deconstruct the Paradoxical Structure:**
      *   *Preface Paradox:* An author believes each statement in their book is true, but believes the book as a whole contains at least one error.
      *   *Application to Toast:* I can say "She was kind," "She was rigorous," "She was timely," etc. I believe each individually. But I cannot claim "She was *all* these things perfectly without contradiction or error."
      *   *Lottery Paradox:* For any single ticket, it is rational to believe it will lose. But it is not rational to believe *all* tickets will lose (since one must win).
      *   *Application to Toast:* For any single memory/claim, it is rational to believe it is true. But to believe *all* memories/claims capture the whole truth is impossible (one must be incomplete or slightly off, or the sum is greater than the parts).
      *   *Implementation:* I need to write a series of affirmative statements about her virtues and achievements. However, I must avoid a concluding sentence that says "And therefore, she was all of these things." Instead, the conclusion should suggest that while each statement stands true, the total picture exceeds the sum of these statements, acknowledging the inevitability of some error or incompleteness in any cataloguing of a life.

