  Good evening everyone. I stand here looking at a room filled with distinct groups who share a common center. On one side are the people who speak his language of types and proofs. On the other side are the people who share his blood and his holidays. Both groups possess direct evidence of who he is. My background is in backend engineering. I build systems that move data from here to there. I usually assume that if a server responds, the job is done. He taught me that a response is not a result. A result requires a witness. You cannot claim a solution exists unless you hold the term in your hand. This principle guided his thirty years of work. He never accepted a truth because it lacked a counterexample. He accepted truths because he could build them from the ground up.

  When I started working with him, I wanted to know if a certain module would hold under load. He did not tell me to assume stability. He asked me to produce the bound. He refused to let me rely on the law of excluded middle in my architecture. I could not say the system was safe or unsafe based on theory. I had to demonstrate the safety through execution. This frustration felt like stubbornness at the time. Now I see it as a form of care. He knew that assuming existence leads to runtime errors in code and in relationships. He demanded construction because construction lasts. He treated every claim like a promise that required delivery. If I said I understood a concept, he would ask me to implement it. Understanding was not a state of mind. It was a function that returned value.

  Look around this table. The evidence of his career sits here in the form of colleagues who became friends. The evidence of his life sits here in the form of family who became supporters. We do not need to speculate about his impact. We have the witnesses. In his logic, you cannot derive affirmation from a double negation. I will state positive truths. He was steadfast. His retirement is a new type we are defining together starting tomorrow. We possess these things now. They are not hypothetical. They are compiled and deployed. The tools he built continue to run. The students he trained continue to prove theorems. The standards he set continue to constrain our choices in productive ways.

  For those of you who do not speak his language of intuitionism, know that his refusal of classical logic was simply a refusal to take shortcuts. He believed that knowing something is true requires knowing why it is true. He applied this to this dinner. He did not ask us to gather because it was tradition. He asked us to gather because we are here. He values the current state over the abstract promise. He treats time as a resource we allocate, not a river that carries us. This is why his mentorship felt so solid. He never gave me a fish. He never told me where the fish were. He handed me a rod and sat with me until I caught one. He verified the catch. He ensured I knew how I caught it. That verification process is the gift he leaves with us.

  So I invite you to raise your glasses. I will not wish him happiness in the abstract. Happiness is not a boolean flag you set once. It is a process we construct with time and attention. We acknowledge the present value of his company. We have the wine. We have the time. We have the company. These are the constructors for a good evening. Let us use them to build a memorable night. To him.
