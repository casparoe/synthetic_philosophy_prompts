prompt: |-
  I write a weekly column on science and ideas, and I keep having to turn a number into prose: a 1-in-100-year flood, a 30 percent chance of a pandemic in the next decade, a risk model's 0.7 score for a defendant reoffending, a physicist's claim that a given nucleus will decay within the hour. My trouble is not arithmetic but interpretation. The same numeral can be a long-run frequency in some reference class, a degree of belief held by a particular forecaster, or an objective single-case propensity, and my column has to commit to one of them. Please give me a decision procedure I can actually run in the ten minutes before I file: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a plain print, where it must print the number with its interpretation attached, and where it ends by refusing the number altogether. Mark the steps that are judgment calls dressed up as procedure.

  Build in two things. First, the reference class problem: whenever the number is a frequency, the procedure must force me to name the class, and it must say what I do when two defensible classes give different frequencies. Second, the singular cases, where no frequency exists at all: there the procedure must keep a forecaster's credence from being passed off as an objective chance, and it must say what a credence claim still licenses me to write.

  Then run the procedure on the flood, the risk score, and the pandemic forecast, including at least one where it tells me not to print the number the way the source wants. Finish by saying what the procedure cannot do — the cases it resolves only because I decide, and how I should flag that in the column instead of letting the number settle it. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** A weekly columnist on science and ideas.
      *   **Problem:** Translating probabilities/statistics into prose without misinterpreting their ontological status (frequency vs. belief vs. propensity).
      *   **Task:** Create a 10-minute decision procedure (algorithm/checklist) for interpreting numbers before filing.
      *   **Requirements:**
          *   Sequential questions.
          *   Criteria for sufficient answers.
          *   Outcomes: Print plain, Print with interpretation, Refuse the number.
          *   Must address the *Reference Class Problem* (naming the class, handling conflicts).
          *   Must address *Singular Cases* (distinguishing credence from objective chance, licensing claims).
          *   Must identify "judgment calls dressed up as procedure."
          *   Must apply the procedure to three specific examples: 1-in-100-year flood, 30% pandemic chance, 0.7 recidivism score. (One must result in refusing/modifying the number).
          *   Conclusion: Limitations of the procedure and how to flag uncertainty in the column.
          *   Tone/Style: American English, practical, intellectual but actionable.

  2.  **Deconstruct the Core Philosophical Issues:**
      *   *Frequentist:* Long-run relative frequency (e.g., coin flips, actuarial tables). Problem: Which reference class?
      *   *Bayesian/Subjective:* Degree of belief (e.g., expert opinion on unique events). Problem: Can be mistaken for fact.
      *   *Propensity:* Physical tendency of a specific setup (e.g., radioactive decay). Problem: Hard to verify in single cases.
      *   *Algorithmic/Model Output:* A score derived from data (e.g., COMPAS recidivism). Problem: Often conflates correlation with causation or individual risk with group averages.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   Need a flowchart style but in text.
      *   Time limit: 10 minutes. So, max 5-6 steps.
      *   *Step 1: Origin.* Where did the number come from? (Data vs. Model vs. Expert Guess).
      *   *Step 2: Repeatability.* Can the event be repeated under identical conditions? (Distinguishes Propensity/Frequency from Credence).
      *   *Step 3: Reference Class.* If frequency-based, what is the group? Is it stable?
      *   *Step 4: Singular vs. General.* Is this about *this* specific instance or the *type* of instance?
      *   *Step 5: Actionability.* What does printing this number imply for the reader?

      *Refining for Constraints:*
      *   Need to explicitly handle the Reference Class Problem.
      *   Need to explicitly handle Singular Cases (Credence vs. Chance).
      *   Need to mark judgment calls.

      *Revised Protocol Structure:*
      1.  **Source Check:** Empirical history or Model/Opinion?
      2.  **Repeatability Test:** Identical conditions possible?
      3.  **Reference Class Audit:** (If Frequentist) What is the class? Is there a rival class?
      4.  **Credence Check:** (If Singular) Who holds the belief? On what basis?
      5.  **Final Formatting:** Plain, Qualified, or Killed.

  4.  **Developing the Examples:**
      *   *1-in-100-year flood:* Classic frequency, but reference class is tricky (climate change makes past data less relevant). *Decision: Print with qualification about the class.*
      *   *0.7 Recidivism Score:* Algorithmic risk. Often mistaken for individual propensity. Actually group frequency applied to individual. *Decision: Refuse/Modify. Don't say "70% chance he reoffends." Say "70% of similar individuals reoffended."*
      *   *30% Pandemic:* Singular event (unique decade, unique virology). Expert credence. *Decision: Print as expert judgment, not objective fact.*

  5.  **Addressing the "Judgment Calls":**
      *   I need to explicitly label where the user has to use their brain, not just follow rules. E.g., deciding if two reference classes are "defensible."

  6.  **Addressing Limitations:**
      *   The procedure can't solve the metaphysical problem of probability. It just manages communication.
      *   Flagging: Use phrases like "experts estimate," "historical data suggests," etc.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the difficulty. Set the tone (pragmatic).
      *   *The Protocol:* Numbered steps. Clear "If/Then" logic.
      *   *The Markings:* Use bold or italics to highlight the "Judgment Call" steps as requested.
      *   *The Examples:* Walk them through the steps.
      *   *The Limitations:* Honest assessment of what the tool can't fix.

      *(Self-Correction during drafting)*: Make sure I strictly follow the instruction: "Mark the steps that are judgment calls dressed up as procedure." I should probably add a specific icon or note next to those steps. Let's use `[JUDGMENT CALL]` tags.

      *(Refining the Reference Class requirement)*: The prompt says "whenever the number is a frequency, the procedure must force me to name the class, and it must say what I do when two defensible classes give different frequencies." I need to make sure Step 3 covers the conflict resolution (e.g., print the range, or print the more specific class, or kill the number).

      *(Refining the Singular Case requirement)*: "keep a forecaster's credence from being passed off as an objective chance, and it must say what a credence claim still licenses me to write." Step 4 needs to ensure the text says "Experts believe" rather than "There is a chance."

  8.  **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   10-minute runtime? Yes (kept concise).
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Outcomes (Plain, Attached, Refuse)? Yes.
      *   Mark judgment calls? Yes.
      *   Reference class problem addressed? Yes.
      *   Singular cases addressed? Yes.
      *   Run on Flood, Risk Score, Pandemic? Yes.
      *   One refusal/modification? Yes (Risk Score).
      *   Limitations section? Yes.
      *   American English? Yes.

  9.  **Final Polish:** Check tone. It should sound like a senior editor talking to a columnist. Crisp, authoritative, but humble about the philosophy. (Proceed to generate output).

  *(Self-Correction on the Risk Score)*: The prompt asks for one where it tells me *not to print the number the way the source wants*. The recidivism score is the perfect candidate. Sources usually say "70% risk of reoffending." The procedure should force me to write "70% of people with this score reoffended." That's a crucial distinction.

  *(Self-Correction on Flood)*: Climate change makes the "100-year" label misleading. The procedure should catch that the reference class (past weather) is broken.

  *(Self-Correction on Pandemic)*: This is pure credence. Needs to be labeled as such.

  Let's assemble.
answer: |-
  # The Probability Protocol: A 10-Minute Decision Procedure

  This protocol is designed to prevent ontological errors—mistaking a model's output for a law of physics, or a group average for an individual fate. It forces you to categorize the number before you contextualize it.

  **Time limit:** 10 minutes.
  **Goal:** Determine if the number prints Plain, Qualified, or Not At All.

  ---

  ### Step 1: The Origin Test
  **Question:** Was this number generated by counting past occurrences, or by a model/expert estimating a unique future?
  *   **Counting:** Go to Step 2.
  *   **Model/Expert:** Go to Step 3.

  ### Step 2: The Reference Class Audit (For Frequencies)
  **Question:** What is the specific population (reference class) this frequency was drawn from?
  *   *Sufficient Answer:* "Events matching definition X in location Y over time Z."
  *   *Insufficient Answer:* "Historical data" or "Similar cases."

  **[JUDGMENT CALL]** **Conflict Check:** Can you name a second, equally defensible reference class that yields a significantly different frequency? (e.g., "Floods in this river basin since 1900" vs. "Floods in this river basin since 2000 as temperatures rose").
  *   **No:** Print the number **Plain**, but name the class in the text (e.g., "Based on 20th-century rainfall...").
  *   **Yes:** Do not print the number Plain. You must either print the range derived from both classes or **Refuse** the specific numeral and describe the trend qualitatively.
  *   *Stop.*

  ### Step 3: The Repeatability Test (For Models/Experts)
  **Question:** Could this event theoretically be repeated under identical conditions to verify the rate?
  *   **Yes (Propensity):** (e.g., Radioactive decay). Print **Plain**, but label it a physical property (e.g., "The nucleus has a decay probability of...").
  *   **No (Singular):** (e.g., A specific election, a specific pandemic). Go to Step 4.

  ### Step 4: The Credence Check (For Singular Cases)
  **Question:** Whose degree of belief does this number represent?
  *   *Sufficient Answer:* "The consensus of Model X" or "The aggregated judgment of Panel Y."
  *   *Insufficient Answer:* "The risk" or "The chance."

  **[JUDGMENT CALL]** **Weight Check:** Is the forecaster's basis transparent enough to warrant a specific numeral, or is the precision false? (e.g., Is "30%" meaningful, or is it "low-to-moderate" dressed up?)
  *   **Transparent/Calibrated:** Print the number **Qualified**. You must attach the owner of the credence (e.g., "Experts assign a 30% probability...").
  *   **Opaque/Over-precise:** **Refuse** the number. Convert to qualitative language (e.g., "Experts deem this unlikely but plausible").
  *   *Stop.*

  ### Step 5: The Individual Application Check (For Risk Scores)
  **Question:** Is this number being applied to a specific individual based on group data?
  *   **No:** Return to Step 2 or 4.
  *   **Yes:** (e.g., Recidivism, Medical risk). Go to Step 6.

  ### Step 6: The Ecological Fallacy Barrier
  **Question:** Does the source claim this number predicts *this* person's outcome, or the *group's* outcome?
  *   **Group:** Print **Qualified**. (e.g., "70% of men with this score reoffended").
  *   **Individual:** **Refuse** the number as stated. You cannot translate a group frequency into an individual propensity without additional causal justification. Rewrite to reflect the group average.
  *   *Stop.*

  ---

  ### Running the Protocol

  Here is how the protocol handles your three pending columns.

  #### 1. The 1-in-100-Year Flood
  *   **Step 1 (Origin):** Counting past occurrences. (Go to Step 2).
  *   **Step 2 (Reference Class):** Class is "Peak flow events in this watershed, 1920–2020."
  *   **Step 2 (Conflict Check):** **[JUDGMENT CALL]** Is there a rival class? Yes. "Peak flow events under current climate conditions." The frequency changes because the climate system is non-stationary. The past 100 years are not a reliable guide to the next 100.
  *   **Outcome:** **Refuse the number as stated.** You cannot print "1-in-100-year" Plain because it implies stationarity.
  *   **Column Text:** "Engineers historically classified this as a 1-in-100-year flood, but warming atmospheric conditions are shortening that recurrence interval."

  #### 2. The 0.7 Recidivism Score
  *   **Step 1 (Origin):** Model/Expert (Algorithmic). (Go to Step 3).
  *   **Step 3 (Repeatability):** No. You cannot run this specific defendant through the justice system 100 times. (Go to Step 4).
  *   **Step 4 (Credence):** It is an actuarial frequency applied to an individual. (Go to Step 5).
  *   **Step 5 (Individual Application):** Yes, applied to a specific defendant. (Go to Step 6).
  *   **Step 6 (Ecological Fallacy):** The source wants to say "This defendant has a 70% chance of reoffending." The protocol flags this as an Individual Claim based on Group Data.
  *   **Outcome:** **Refuse the number the way the source wants.**
  *   **Column Text:** Do not write "He has a 70% risk of reoffending." Write: "He received a high-risk score; historically, 70% of defendants with this profile reoffended within three years." The number stays, but the *target* of the probability shifts from the man to the class.

  #### 3. The 30% Pandemic Chance
  *   **Step 1 (Origin):** Model/Expert. (Go to Step 3).
  *   **Step 3 (Repeatability):** No. This decade is unique. (Go to Step 4).
  *   **Step 4 (Credence):** Whose belief? "Epidemiological modeling consortium." Is the precision meaningful? **[JUDGMENT CALL]** Yes, if they are calibrated forecasters (like the CDC FluSight network).
  *   **Outcome:** **Print Qualified.**
  *   **Column Text:** "Forecasting models currently assign a 30% probability to a pandemic emerging before 2035." You must attribute the probability to the *models*, not the *world*.

  ---

  ### What This Procedure Cannot Do

  This protocol is a filter, not a truth machine. It resolves communication errors, not metaphysical ones. There are two specific failures you must flag in your column because the procedure cannot fix them for you.

  **1. The Non-Stationary World**
  The protocol forces you to name the reference class, but it cannot tell you if that class is *dead*. In the flood example, the protocol told you to refuse the number, but it couldn't calculate the *new* number.
  *   **How to flag it:** When the past no longer predicts the future, explicitly state that the "sample space is shifting." Use phrases like "under historical assumptions" or "if current trends hold." Do not let the reader assume the probability is stable.

  **2. The Causal Gap**
  The protocol stops you from calling a risk score an individual propensity (Step 6), but it cannot tell you *why* the correlation exists. A 0.7 score might correlate with reoffending because of criminal propensity, or because of policing bias in certain neighborhoods. The number looks the same either way.
  *   **How to flag it:** When printing group frequencies applied to individuals, add a "mechanism clause." Write: "70% of this group reoffended, though the model does not distinguish between causal risk and systemic bias."

  **3. The Judgment Calls**
  I have marked the **[JUDGMENT CALL]** steps above. These are where the procedure pretends to be an algorithm but actually requires your editorial conscience.
  *   **Step 2 Conflict:** Deciding if a rival reference class is "defensible" is up to you.
  *   **Step 4 Weight:** Deciding if a forecaster is "calibrated" enough to warrant a specific numeral is up to you.
  *   **How to flag it:** In these instances, use hedging verbs. Instead of "The risk is 30%," write "The risk is *estimated at* 30%." Instead of "Class A is better than Class B," write "Using the more conservative Class A..."

  The number is never just a number. It is a claim about how the world works. This procedure ensures you know which claim you are making before you hit send.
