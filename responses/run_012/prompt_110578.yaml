answer: |-
  1. The inference in question
  The laboratory operates on the principle that observing a negative test result in a disease-free individual constitutes confirmation of the test's validity rule: "All diseased individuals test positive." Formally, an instance of $\neg D \land \neg P$ is taken to support the universal generalization $D \rightarrow P$. This inferential move treats the contrapositive evidence ($\neg P \rightarrow \neg D$) as functionally identical to direct positive evidence ($D \rightarrow P$) regarding the hypothesis's truth. Consequently, the accumulation of negative results in healthy controls increases the laboratory's confidence in the rule governing diseased patients. The practice asserts that absence of false positives in the healthy population substantiates the presence of true positives in the sick population, effectively treating the logical equivalence of the hypothesis and its contrapositive as an equivalence of evidentiary weight.

  2. What the practice presupposes
  The practice superficially resembles Hempel's satisfaction criterion, where instances of the contrapositive confirm the hypothesis. However, the rejection of the green apple suggests they do not commit to the formal Equivalence Condition (that logically equivalent hypotheses are confirmed by the same evidence regardless of content). Instead, the practice presupposes a *methodological* theory of confirmation where evidence must be drawn from a *relevant reference class*. The lab assumes that "healthy controls" are a specific population generated by the same causal mechanism or sampling frame as the "diseased cases."

  The practice presupposes that validation requires testing the boundaries of the test's specificity to infer sensitivity. It assumes a symmetry in error rates: knowing the false positive rate (via controls) informs the reliability of the positive predictive value. Therefore, the theory isn't pure logic; it's a theory of *error statistics*. The confirmation comes not from the logical form $\neg P \land \neg D$, but from the *process* of attempting to falsify the test in the population where it should be negative. If the practice relied solely on the Equivalence Condition, the green apple would be admissible. Since it is rejected, the practice presupposes that confirmation requires a *causal or nomological connection* between the evidence and the hypothesis, not just logical consistency. The lab implicitly assumes that the test's mechanism interacts with the biological state, making the control group a rigorous test of that mechanism, whereas apples do not interact with the test mechanism. Thus, the presupposition is that evidence confirms a hypothesis only if it arises from a procedure capable of detecting errors relevant to that hypothesis.

  3. Strictly presupposed versus merely fits
  Strictly presupposed is the requirement that evidence must result from an *intervention* or *measurement* applicable to the hypothesis's domain. The lab must run the test on the control; they cannot merely observe a healthy person who wasn't tested. This rules out pure logical satisfaction. What is merely compatible is the Bayesian interpretation. A Bayesian account fits the practice perfectly: negative controls update the likelihood ratio regarding the test's specificity, which mathematically alters the posterior probability of the disease given a positive result. However, the lab does not *need* to calculate priors to operate this way; they only need the frequentist notion that specificity bounds sensitivity errors. Similarly, a Hypothetico-Deductive account fits but is not required; the lab doesn't need to claim the hypothesis entails the evidence, only that the evidence would be improbable if the hypothesis were false (error statistics). The crucial distinction is that while Bayesianism explains *why* the apple is excluded (prior probability of apples affecting the test is zero), the practice itself only strictly demands that the evidence source be *causally connected* to the test mechanism. The rejection of the apple is not a commitment to Bayesian priors but to experimental relevance. Therefore, the practice does not commit to the Equivalence Condition; it commits to a *procedural* condition of testing. The logical shape is secondary to the experimental design. The practice is consistent with multiple theories of confirmation, provided those theories include a constraint on evidence relevance or sampling validity.

  4. Where the practice is underdetermined
  The practice is underdetermined between a Bayesian likelihood account and an Error Statistical account. Both explain why controls matter (they constrain error probabilities) and why apples don't (they offer no error constraint). To decide between them, one must examine how the lab treats "wrong kind" negative results. If the lab dismisses negative results in a population biologically incapable of having the disease (e.g., testing a plant for a human virus) as irrelevant, this favors the Error Statistical view: the test wasn't *capable* of producing an error, so passing it is no confirmation. A Bayesian might argue the likelihood is still 1, but the prior on the hypothesis context shifts. If the lab explicitly states that a test must be *capable* of failing to count as passing, they presuppose severe testing, not just probability updating. Conversely, if they accept any negative result where the disease is absent, regardless of biological plausibility, they lean toward a syntactic view. The ambiguity lies in whether "healthy control" is defined by disease absence alone or by biological similarity to the diseased group. This distinction determines whether the confirmation relies on logical contraposition or on the homogeneity of the sample population regarding the test's causal mechanism.

  5. If the presupposition were replaced
  Adopting an explicit relevance-restricted account would transform validation from a numerical exercise into a justificatory one. Currently, the lab reports specificity as a standalone metric, implicitly assuming the control group's validity. Under an explicit relevance account, the lab would be required to defend the *selection* of controls as part of the confirmation itself. They could not simply report "1000 negatives"; they must report "1000 negatives from a population sharing the relevant biological matrix." This would change how they defend against false positives: instead of claiming the rule is universally confirmed, they would claim the rule holds *within the tested domain*. It would also resolve the internal inconsistency regarding "wrong kind" cases. Currently, they might dismiss plant tests as irrelevant while accepting apple logic implicitly. A relevance account makes this dismissal principled: evidence confirms only if it risks falsification. Consequently, the lab would stop treating the contrapositive as logically equivalent for confirmation purposes. They would acknowledge that $\neg D \land \neg P$ confirms $D \rightarrow P$ only when the test is applied to a $D$-candidate. This shifts the epistemic burden from counting instances to validating the experimental context, ensuring that the scorn for the green apple is grounded in the same methodological principle as the praise for the healthy control.
