          *   *Drafting:* Adopting an explicit relevance-restricted account would transform validation from a numerical exercise into a justificatory one. Currently, the lab reports specificity as a standalone metric, implicitly assuming the control group's validity. Under an explicit relevance account, the lab would be required to defend the *selection* of controls as part of the confirmation itself. They could not simply report "1000 negatives"; they must report "1000 negatives from a population sharing the relevant biological matrix." This would change how they defend against false positives: instead of claiming the rule is universally confirmed, they would claim the rule holds *within the tested domain*. It would also resolve the internal inconsistency regarding "wrong kind" cases. Currently, they might dismiss plant tests as irrelevant while accepting apple logic implicitly. A relevance account makes this dismissal principled: evidence confirms only if it risks falsification. Consequently, the lab would stop treating the contrapositive as logically equivalent for confirmation purposes. They would acknowledge that $\neg D \land \neg P$ confirms $D \rightarrow P$ only when the test is applied to a $D$-candidate. This shifts the epistemic burden from counting instances to validating the experimental context, ensuring that the scorn for the green apple is grounded in the same methodological principle as the praise for the healthy control.

