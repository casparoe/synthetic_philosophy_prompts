  Carnap's philosophy rests on the principle of tolerance, which holds that choosing a linguistic framework is not a matter of discovering truth but of making a practical decision. There is no fact of the matter about whether numbers or physical objects really exist; there is only the question of whether adopting a framework that includes them is useful for our purposes. This voluntarism suggests that all theoretical disputes are actually disguised practical decisions about which language to use. However, Carnap was also a committed socialist who believed that a rationally planned society was necessary for human flourishing and that metaphysical thinking actively obstructed this goal. This creates a tension: if the choice of a social framework is just another practical decision, akin to choosing a logical syntax, then on what grounds can Carnap criticize the metaphysician? If the reactionary chooses a metaphysical framework that supports hierarchy, and Carnap chooses a physicalist framework that supports planning, are they not merely talking past one another?

  To resolve this, we must treat the choice for a rationally planned society as an external question. It is a practical proposal, not a theoretical truth. Carnap does not claim socialism is true in a metaphysical sense; he claims it is more fruitful for specific human ends, such as reducing conflict and increasing welfare. The normative force of his political advocacy comes from the shared acceptance of these ends. If someone accepts the goal of social coordination, then the scientific framework is internally validated as the efficient tool to achieve it. Metaphysics, in this view, is not false; it is inefficient. It generates pseudo-problems that waste intellectual energy and fuel dogmatic conflict.

  Therefore, Carnap's attack on metaphysics is consistent with his voluntarism, provided we understand the attack as pragmatic rather than ontological. He is not saying the metaphysician is wrong about the nature of reality, because there is no framework-independent reality to be wrong about. He is saying the metaphysician is using a tool that fails to perform the job of social clarification. The tension dissolves if we see that Carnap's political commitment supplies the purpose for which the scientific framework is the chosen means. The obligation to be rational is not an obligation to match the world, but an obligation to be effective given our desires.

  However, this leaves a residual problem. If the choice of ends itself is merely a matter of taste or decision, then Carnap cannot condemn the reactionary who rejects welfare or coordination as ultimate goals. Here, Carnap must rely on a psychological or sociological claim that humans generally desire these things, or he must admit that his philosophy cannot compel those who reject the practical aims of the Enlightenment. The strength of his position is that it avoids dogmatic metaphysics; the weakness is that its normativity is hypothetical. It tells us what to do if we want society to work, but it cannot prove we should want that. Yet, for Carnap, proving we should want it would be metaphysics. Thus, the connection between his philosophy and politics is not one of logical entailment but of instrumental rationality. The philosophy clears the ground of nonsense so the politics can build efficiently. The attack on metaphysics survives because it is an attack on inefficiency, not error.

