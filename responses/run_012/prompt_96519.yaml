  Carnap's philosophical project is defined by the principle of tolerance, which asserts that choosing a linguistic framework is a practical decision rather than a theoretical discovery. There is no truth of the matter regarding which framework corresponds to reality; there is only the question of which framework is more expedient for specific purposes. This voluntarism implies that philosophical disputes are often confused practical proposals about how we should speak. However, Carnap was also a committed socialist who argued that metaphysical thinking was not merely empty but an active obstacle to creating a decent, rationally planned society. This generates a critical tension: if the choice of a social order is itself a practical decision akin to choosing a language, how can Carnap normatively criticize the reactionary metaphysician without violating his own tolerance?

  Students often attempt to resolve this by compartmentalizing Carnap's life, suggesting he was a voluntarist in the seminar room and a socialist in the voting booth. This must be rejected. For Carnap, the elimination of metaphysics was precisely what made socialist planning possible. The connection is integral. The question is whether the advocacy for a planned society functions as an external question in his sense. It must. If the claim that society should be planned were a theoretical truth, it would be metaphysics, which Carnap rejects. Therefore, the commitment to socialism is a practical proposal, a decision to adopt a framework of social organization that prioritizes collective welfare and rational coordination.

  Once we accept that the political goal is a practical decision, the attack on metaphysics becomes consistent. Carnap does not argue that metaphysics is false in a correspondence sense. He argues that metaphysics is inefficient for the chosen practical goal. Metaphysical language generates pseudo-problems that cannot be resolved, leading to endless conflict and obscuring the empirical questions necessary for social engineering. If the accepted purpose of our language is to facilitate cooperation and solve practical problems, then metaphysics is a bad tool. The reactionary metaphysician is not wrong about the world, but they are playing a different game with different rules. Carnap's criticism is that their game is useless for the aims he proposes we adopt.

  This preserves voluntarism because the metaphysician is free to continue using their framework, provided they acknowledge it is a poetic or expressive choice rather than a cognitive claim. However, this resolution shifts the normative weight entirely onto the acceptance of the practical ends. Carnap's philosophy can demonstrate that science is the best tool for social planning, but it cannot prove that we ought to value social planning over tribal loyalty or hierarchical tradition. That choice remains a matter of volition, not logic. If someone rejects the aim of universal welfare, Carnap's argument loses its grip. He cannot call them irrational in a theoretical sense, only incompatible with his own practical proposals.

  Thus, the tension is resolved by recognizing that Carnap's anti-metaphysics is a form of instrumental rationality. The connection between his philosophy and politics is that philosophy clears the linguistic debris that prevents politics from functioning effectively. The attack on metaphysics survives because it is re-categorized as a critique of utility rather than truth. The cost of this move is that the moral force of Carnap's socialism is hypothetical. It binds only those who share the desire for a rational society. But for Carnap, demanding more than this would be to lapse back into the very metaphysics he sought to destroy. The coherence of his position relies on maintaining that while we cannot prove our ends are true, we can rigorously determine which means serve them best, and metaphysics serves them poorly.

