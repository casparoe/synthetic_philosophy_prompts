prompt: |-
  A reading group I'm in has been stuck for months on the criteria of authenticity—embarrassment, dissimilarity, multiple attestation, and the rest—and I want a diagnosis of the impasse rather than another round of argument. My working hypothesis is that the disagreement isn't really about the criteria at all but about what 'authentic' attaches to: individual sayings assessed one at a time, versus a whole reconstructed figure that only emerges from the best global account—the two sides answering different questions under one word. What pushes me toward this is that each criterion looks like a likelihood ratio, purporting to say how much more probable a saying is if Jesus said it than if the community invented it; but a likelihood ratio can't tell us what to believe without a prior over what a first-century Galilean would plausibly have said, and that prior is just what's in dispute, so the criteria seem to presuppose the reconstruction they are meant to support. The critics press this, the practitioners concede it, and then both carry on as before. Is my hypothesis right, or is something else doing the work—a hidden disagreement about whether the sources can bear any inferential weight at all, or about what would count as evidence for someone known only through texts written decades later? Diagnose it concretely, and say what, if anything, would move the dispute forward: a distinction, a formal constraint on the criteria, or a change in the question.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the User's Request:**
      *   **Context:** A reading group stuck for months on the "criteria of authenticity" in Historical Jesus research (embarrassment, dissimilarity, multiple attestation, etc.).
      *   **Goal:** A diagnosis of the impasse, *not* another round of argument about the criteria themselves.
      *   **User's Hypothesis:** The disagreement isn't about the criteria, but about the *target* of "authentic" (individual sayings vs. holistic reconstructed figure). The criteria act like likelihood ratios but lack agreed-upon priors (what a 1st-century Galilean would plausibly say). The criteria presuppose the reconstruction they support.
      *   **Task:** Evaluate this hypothesis. Is it right? Is something else at work (e.g., skepticism about sources, definition of evidence)? Diagnose concretely. Propose what would move the dispute forward (distinction, constraint, change of question).

  2.  **Analyze the User's Hypothesis:**
      *   *Strengths:* It identifies the Bayesian structure of the problem (Likelihood Ratio $\times$ Prior = Posterior). It correctly notes that "Dissimilarity" and "Embarrassment" function as heuristics for likelihoods. It spots the circularity risk (using the criteria to build a portrait that defines the priors for the criteria). It highlights the atomistic vs. holistic tension.
      *   *Weaknesses/Missing Elements:* While accurate, it might be too charitable. It assumes both sides are playing the same epistemic game (Bayesian inference) but with different priors. In reality, one side might reject the game entirely (postmodern skepticism) or play a different game (narrative coherence vs. probabilistic atomism). It also might underplay the theological/ideological stakes often hidden in "historical" disputes.

  3.  **Diagnose the Impasse (The "Real" Problem):**
      *   *The Epistemic Gap:* The user is right about the priors, but the deeper issue is the *unit of analysis*.
          *   Side A (Traditional/Third Quest): Treats the Gospel text as a mosaic. Tiles (sayings/pericopes) can be sorted into "Jesus" vs. "Church." Authenticity is a binary property of the tile.
          *   Side B (Memory Theory/Global/Recent Shift): Treats the text as a memory tradition. The "historical Jesus" is an inference to the best explanation of the *entire* tradition's existence, not a collection of verified quotes. Authenticity is a property of the *portrait*, not the saying.
      *   *The Circularity:* The user nailed this. You need a model of Jesus to judge if a saying fits (Coherence), but you need sayings to build the model.
      *   *The Hidden Disagreement:* It's not just about priors; it's about *reference*. What does "The Historical Jesus" refer to?
          *   Referent 1: The ipsissima verba (the very words).
          *   Referent 2: The ipsissima vox (the very voice/style/impact).
          *   Referent 3: The causal explanation for the movement.
      *   *The Source Problem:* The user mentions "whether sources can bear inferential weight." This is crucial. If the texts are theological kerygma, can they function as historical data points? Some in the group likely think the gap between event and text is unbridgeable by these criteria.

  4.  **Evaluate the "Likelihood Ratio" Analogy:**
      *   It's a strong analogy.
      *   *Criterion of Dissimilarity:* High Likelihood Ratio (LR) for uniqueness, but terrible Prior (most people speak like their contemporaries).
      *   *Criterion of Coherence:* High Prior dependence.
      *   *Criterion of Embarrassment:* High LR, but assumes we know what embarrassed the early church (which changes over time).
      *   *Conclusion:* The math doesn't work because the variables are undefined.

  5.  **Formulate the Diagnosis:**
      *   Validate the user's hypothesis (it's sophisticated and correct).
      *   Deepen it: The impasse is a **Category Error** regarding the *ontology of the data*.
      *   Identify the two conflicting models:
          1.  **Atomistic Verificationism:** History = verifying discrete data points. (The criteria work here).
          2.  **Holistic Inference:** History = explaining the existence of the tradition. (The criteria fail here).
      *   Identify the hidden variable: **Theological Anxiety.** (Often, "authenticity" is a proxy for "authority." If a saying isn't authentic, does it lose normative power? This stalls historical judgment).

  6.  **Propose Solutions (Moving Forward):**
      *   *Distinction:* Separate "Authenticity of Utterance" from "Authenticity of Effect."
      *   *Formal Constraint:* Ban the use of "Coherence" as a primary criterion (it's the source of circularity). Use it only for secondary support.
      *   *Change the Question:* Stop asking "Did he say this?" Start asking "What historical scenario best explains why this tradition exists?" (Shift from verification to explanation).
      *   *Bayesian Explicit:* Force the group to state their Priors explicitly. (e.g., "What is the base rate of apocalyptic prophecy in 1st C. Galilee?")

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, precise, empathetic to the frustration, analytical.
      *   *Structure:*
          1.  Validate the hypothesis (It's strong).
          2.  Deepen the diagnosis (The Unit of Analysis & The Reference Class).
          3.  Identify the hidden blocker (Theological/Authority stakes).
          4.  Propose concrete moves (Shift to Explanation, Explicit Priors, Memory Model).
      *   *Refining the "Likelihood Ratio" point:* Make sure to acknowledge that without a reference class (the "Prior"), the LR is useless. The reference class *is* the reconstructed Jesus. This is the circularity.
      *   *Refining the "Something Else":* It's not just skepticism about sources; it's about the *nature* of the sources. Are they records or artifacts?
      *   *Actionable Advice:* Suggest reading Chris Keith or Anthony Le Donne (Memory Theory) vs. John Meier (Criteria). Suggest shifting to "Historical Plausibility."

  8.  **Final Polish:** Check against the prompt's constraints.
