answer: |-
  # Session Design: The Biosafety Committee Simulation
  **Course:** Upper-level Philosophy of Biology  
  **Time:** 80 Minutes  
  **Students:** 18 (6 groups of 3)  
  **Goal:** To induce epistemic friction regarding the definition of life through procedural constraint and adversarial classification, culminating in a pragmatic debrief.

  ## 1. Materials Preparation

  **A. The Case Deck (20 Cards)**
  Print these on cardstock. Each group gets a full deck.
  *Your Provided Cases (15):*
  1.  Viroid (naked RNA circle)
  2.  Prion (misfolded protein)
  3.  Giant Virus (genome > some bacteria)
  4.  Satellite Virus (replicates only inside giant virus factory)
  5.  Mule (sterile mammal)
  6.  Sterile Worker Ant
  7.  Mitochondrion (isolated)
  8.  Endosymbiotic Bacterium (reduced genome, obligate)
  9.  Tardigrade (tun state, dried)
  10. Bacterial Spore
  11. Evolved Self-Replicating RNA (test tube)
  12. Liposome with Self-Copying RNA
  13. Computer Program (mutating/competing in simulation)
  14. 3D Printer (printing most of its own parts)
  15. Clay Crystal (catalytic self-replication in solution)

  *New Cases (5):*
  16. **Xenobots:** Clusters of frog skin/stem cells reconfigured by AI to move and replicate via kinematic self-replication (no DNA modification).
  17. ***Candidatus* Hodgkinia cicadicola:** An endosymbiotic bacterium with a genome smaller than a mitochondrion that has split into multiple complementary cell types within a host.
  18. **Belousov-Zhabotinsky Droplet:** A chemical oscillating reaction that pulses, consumes fuel, and maintains a boundary, but has no genetics.
  19. **Cryopreserved Human Embryo:** Metabolically halted at -196°C, viable upon thawing, no current metabolism or growth.
  20. **Portuguese Man o' War:** A colonial organism composed of specialized zooids that cannot survive alone; is the colony the organism or the zooids?

  **B. The Register (Poster Paper)**
  Each group gets one large sheet divided into three columns: **LIVING | BORDERLINE | NOT LIVING**.
  *Rule:* The "Borderline" column is locked until a petition is granted (see Rules).

  **C. The Criterion Line**
  A distinct strip of paper at the top of the Register.
  *Rule:* A single sentence defining the necessary and sufficient conditions for life must be written here *before* any case is placed in a column.

  **D. Revisionary Criteria Cards (5 Types)**
  Print 4 copies of each (20 total). Distribute one per group (some overlap).
  1.  **Autopoiesis:** A system that continually regenerates its own components and its own boundary.
  2.  **Thermodynamics:** A system that holds itself far from equilibrium by dissipating energy.
  3.  **Evolutionary:** Membership in a population that evolves by natural selection.
  4.  **Assembly Complexity:** A structure whose assembly from basic blocks requires an unusually long and specific sequence of steps.
  5.  **Genetic:** Anything carrying a heritable code that specifies its own construction.

  **E. Attack Tokens**
  Small red stickers or chips. Used to mark "misclassified" items during attack rounds.

  ---

  ## 2. Rules of Procedure

  1.  **The Paradigm Lock:** Your criterion *must* correctly classify the five Paradigm Cases: **Dog (Living), Bacterium (Living), Rock (Not), Flame (Not), Corpse (Not).** If your criterion fails one of these, your Register is vetoed, and you must restart the Criterion Line.
  2.  **The Borderline Petition:** You may not use the "Borderline" column unless you attach a note stating: *"This column represents [Ignorance of Fact / Absence of Fact]."* If you claim "Ignorance," you must identify what fact is missing. If you claim "Absence," you admit the category is fuzzy.
  3.  **Consistency:** Every case placement must be justifiable by the Criterion Line. If an attacker shows a case violates the criterion, you must revise the Criterion Line.
  4.  **Minimal Revision:** When repairing a criterion, you must make the *smallest possible addition* to accommodate the counter-case without breaking the Paradigm Lock.
  5.  **Invention:** During attack rounds, you must invent one *new* hypothetical case that breaks the opponent's criterion.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Instructor Role |
  | :--- | :--- | :--- |
  | **00-05** | **Setup.** Divide into 6 groups of 3. Assign Roles: *Chair* (timekeeper), *Scribe* (writes register), *Prosecutor* (leads attacks). Distribute Decks, Registers, Markers. | Hand out materials. Read the **Paradigm Lock** rule aloud. Emphasize: *"I will not answer 'Is this alive?' questions. The rules decide."* |
  | **05-20** | **Committee Round 1.** Groups draft their Criterion Line. Once approved by you (check against Paradigm Lock), they classify the **Core 10 Cases** (1-10). | Circulate. Veto any criterion that excludes a bacterium or includes a rock. Do not comment on edge cases. |
  | **20-30** | **Attack Round 1.** Groups pair up (1vs2, 3vs4, 5vs6). Swap Registers. Attackers find 1 misclassified case from the Core 10 and invent 1 new case that breaks the criterion. Place Red Token on error. | Enforce time. Ensure attackers use the *Criterion Line* to justify the attack, not intuition. |
  | **30-35** | **Revision 1.** Groups return to their Register. They must repair the Criterion Line (Minimal Revision) and re-classify the attacked cases. Post the old criterion next to the new one. | Ensure the "Minimal Revision" rule is followed. Prevent total rewrites. |
  | **35-45** | **Committee Round 2.** Groups classify the **Edge 10 Cases** (11-20) using the *Revised Criterion 1*. | Watch for groups trying to hide difficult cases in "Borderline" without a petition. |
  | **45-55** | **Attack Round 2.** Groups swap with a *different* partner. Attackers find errors in the Edge 10 or the Invented Cases from Round 1. Defenders revise criterion again (Criterion 2). | Keep the pace brisk. The wall should be filling with crossed-out criteria. |
  | **55-65** | **Card Exercise.** Distribute Revisionary Criteria Cards. Each group applies their *assigned card* to the 5 most contentious cases from the wall (e.g., Virus, Prion, Xenobot, Mule, Spore). Record verdicts on a slip of paper. | Ensure they apply the card *strictly*, even if it contradicts their previous verdicts. |
  | **65-80** | **Debrief.** (See below). | Lead discussion. Connect activity to theory. |

  ---

  ## 4. Scoring (Low Stakes)

  Do not grade for "correctness." Grade for **procedural integrity**.
  *   **5 Points:** Register completed with a valid Paradigm Lock criterion.
  *   **5 Points:** Successful defense (no tokens left on your register after Round 2).
  *   **5 Points:** Successful attack (placed at least one valid token on an opponent's register).
  *   **5 Points:** Card Exercise completion.

  *Note:* The "score" is irrelevant to the learning outcome but prevents students from treating the simulation as a game they can opt out of.

  ---

  ## 5. Instructor Moves (During Activity)

  *   **The Veto:** If a group writes "Life is what biology studies," veto it. It fails the Paradigm Lock (does biology study rocks? Yes. Does it study corpses? Yes.). Force them to be specific.
  *   **The Silence:** When a student asks, "But is a virus *really* alive?" reply: "Does your criterion say yes or no?" If they say "Our criterion says yes, but that feels wrong," reply: "Then change the criterion, or accept the consequence."
  *   **The Borderline Trap:** If a group moves the Prion to "Borderline" without a petition note, move it back to "Living" or "Not" and tell them to decide. Force the ontological commitment.
  *   **The Accretion:** Physically tape the old criteria next to the new ones on the wall. Ensure the "scar tissue" of revisions is visible at the end.

  ---

  ## 6. The Debrief (20 Minutes)

  *Do not lecture until this point.*

  **Phase 1: The Wall (5 mins)**
  Stand before the posted Registers. Point to the accretion of revisions.
  *   "Look at Criterion 1 vs. Criterion 3. How many words did you add? Did the definition get clearer, or more cumbersome?"
  *   "Who had to put the Prion in 'Living' even though they didn't want to? Why?"
  *   "Who used the Borderline column? Did it solve the problem or delay it?"

  **Phase 2: The Cards (5 mins)**
  Compare the Card Exercise results.
  *   "Group 3, your card (Thermodynamics) likely classified the Flame as Living. Group 5, your card (Genetic) likely classified the Virus as Living. Did anyone's card get all five Paradigm Cases right?"
  *   (Expected answer: No.)
  *   "So, are these theories wrong? Or are they answering a different question?"

  **Phase 3: The Map (10 mins)**
  Connect the frustration to the philosophy.
  1.  **Checklist Failure:** Explain that the "trouble" they felt was the **disjunction of properties**. Life is a cluster concept (Wittgenstein). The checklist works for paradigms (Dog) because they have all features. It fails at borders (Virus) because features come apart.
  2.  **Pragmatics:** Ask: "Why did the real committee vote for a line nobody could defend?" Elicit the idea that the definition depends on the *purpose*. For biosafety, "risk" matters more than "ontology." A prion might not be alive, but it needs review.
  3.  **Revisionary vs. Descriptive:** The Cards were *revisionary* (theories of what life *should* be). The Committee was *descriptive* (trying to match intuition). The conflict arises when we mix them.
  4.  **Conclusion:** "You spent 60 minutes trying to draw a line where nature drew a gradient. Next week, we will discuss whether we should stop drawing the line and start asking: 'Alive for what purpose?'"

  ---

  ## 7. Predictable Failures & Troubleshooting

  **1. The Stipulation Deflation**
  *   **Problem:** A group writes: "Life = Dog, Bacterium, Ant. Everything else = Not." This satisfies the Paradigm Lock but defeats the purpose.
  *   **Fix:** The **Minimal Revision** rule during attacks will destroy them. When attackers present the *Mule* (sterile), the group must add "sexually reproductive" to the criterion. Then attackers present the *Bacterial Spore* (no reproduction). The group must add "potential for reproduction." The criterion becomes unwieldy. Let the rules crush them; do not lecture. Point it out in the debrief: "Group 2's definition became 40 words long. Did it become more true, or just more specific?"

  **2. The Relativist Collapse**
  *   **Problem:** Students conclude "Nothing is alive, it's all just words."
  *   **Fix:** In the debrief, distinguish *ontology* from *categorization*. "The virus doesn't care if you call it alive. The question is whether calling it alive helps us predict its behavior or manage its risk. The category is a tool, not a mirror."

  **3. Time Overrun**
  *   **Problem:** The Attack Rounds take too long.
  *   **Fix:** If you pass minute 45 before Round 2 Attack, cancel the second attack. Move straight to the Card Exercise. The friction from Round 1 is usually sufficient.

  **4. The "Correct" Theory**
  *   **Problem:** A student knows the Autopoiesis theory and tries to "win" by using it in Round 1.
  *   **Fix:** Remind them the goal is to match the Paradigm Lock *and* handle the Cases. Autopoiesis often fails the Virus case (no metabolism) or the Mule case (boundary issues). Let them try it. If it fails, they must revise it like everyone else.

  ---

  ## 8. Limitations (For Your Eyes Only)

  Be frank with yourself about what this session cannot do, so you do not overpromise in the debrief.

  1.  **Scoring Penalizes Radical Truth:** The activity rewards fitting the students' pre-existing intuitions (the Paradigm Lock). If a theory like "Viruses are Alive" is scientifically defensible but intuitively repugnant to the students, the game mechanics force them to reject it. This reinforces conservatism. *Mitigation:* In the debrief, explicitly acknowledge that the "Paradigm Lock" biases the game toward folk biology, and that real science often overturns folk intuitions (e.g., heliocentrism).
  2.  **Ad Hoc Patching:** The "Minimal Revision" rule encourages adding clauses ("...unless it is a spore") rather than finding deeper unifying principles. This mimics the history of biology but may frustrate students looking for elegance. *Mitigation:* Highlight this in the debrief as the difference between *phenomenological classification* and *theoretical explanation*.
  3.  **No Resolution:** The session ends on the problem, not the solution. Students may leave feeling philosophy just makes things confusing. *Mitigation:* You must supply the "Pragmatic Turn" in the debrief. You must explicitly state: "The confusion you feel is not a failure of your reasoning; it is a feature of the world. The solution is not a better definition, but a better question."
  4.  **The "Life" Word:** The activity reinforces the idea that "Life" is a single natural kind waiting to be defined. Some philosophers of biology argue we should eliminate the term entirely. This activity does not go that far. *Mitigation:* In the final minute, suggest that some scientists propose deleting the word "life" from technical contexts entirely, using specific terms like "autocatalytic set" or "evolving population" instead.

  This design forces the students to inhabit the committee room you described. They will leave with the "difficulty in their hands," ready for you to explain why it feels that way.
