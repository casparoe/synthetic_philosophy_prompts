answer: |-
  **Brainstorming Key Distinctions**
  The question must test: (1) mechanical application of REU weighting versus linear probability; (2) the separation of risk attitude ($r$) from marginal utility ($u$); (3) whether this separation is merely representational or structurally significant; and (4) compliance with First-Order Stochastic Dominance (FOSD) as a rationality constraint.

  ***

  **Exam Question**

  **Question 4: Risk-Weighted Expected Utility (20 Marks)**

  Consider a decision-maker with a risk function $r(p) = p^3$ and a utility function $u(x) = x$ (linear). They face a choice between:
  *   **Gamble G:** 50% chance of 0, 25% chance of 60, 25% chance of 100.
  *   **Sure Thing S:** 100% chance of 40.

  (a) Calculate the REU of $G$ and $S$. Compare this ranking to the Expected Utility (EU) ranking assuming the same linear utility. (5 marks)
  (b) Standard EU theory conflates risk aversion with diminishing marginal utility. Does REU successfully distinguish these concepts in this scenario, or does it merely relabel diminishing utility as risk weighting? Justify your answer. (10 marks)
  (c) Does the risk function $r(p) = p^3$ respect First-Order Stochastic Dominance? What does this imply for the claim that REU constitutes a general theory of rational risk attitudes? (5 marks)

  ***

  **Model Answer**

  **(a) Calculation and Comparison**
  To calculate REU, we weight outcomes by the change in transformed cumulative probability. Outcomes are ordered $0 < 60 < 100$.
  Cumulative probabilities: $P(X \ge 0)=1$, $P(X \ge 60)=0.5$, $P(X \ge 100)=0.25$.
  Weights using $r(p)=p^3$:
  $w_{100} = r(0.25) - r(0) = 0.015625$.
  $w_{60} = r(0.5) - r(0.25) = 0.125 - 0.015625 = 0.109375$.
  $w_{0} = r(1) - r(0.5) = 1 - 0.125 = 0.875$.

  $REU(G) = 0.875(0) + 0.109375(60) + 0.015625(100) = 6.5625 + 1.5625 = 8.125$.
  $REU(S) = 1.0 \times u(40) = 40$.
  REU strongly prefers $S$ over $G$.

  Under EU with linear utility ($u(x)=x$), probabilities are not transformed.
  $EU(G) = 0.5(0) + 0.25(60) + 0.25(100) = 15 + 25 = 40$.
  $EU(S) = 40$.
  EU implies indifference. The REU agent exhibits extreme risk aversion despite having linear utility (no diminishing marginal value).

  **(b) Distinguishing Risk Aversion from Diminishing Utility**
  REU successfully distinguishes these concepts structurally, not merely by relabeling. In EU, risk aversion *is* concave utility; one cannot be risk-averse over linear value. In REU, risk attitude is located in $r$, while value is in $u$. Here, the agent is risk-neutral regarding value ($u$ is linear) but risk-averse regarding probability ($r$ is convex).

  Critics argue REU collapses into EU because any REU representation can be mathematically transformed into an EU representation with a different utility function. However, this ignores structural invariance. EU requires consistent utility functions across different gamble structures. REU allows the decision-maker to exhibit preferences (like Allais-type common consequence effects) that violate EU's independence axiom but remain consistent under a fixed $r$ and $u$. Thus, REU captures a distinct attitude toward the *distribution* of risk independent of the *value* of outcomes, preserving the intuition that one can care about risk even when marginal utility is constant.

  **(c) FOSD and Rationality**
  FOSD requires that if gamble $A$ yields better outcomes than $B$ at every probability level, $A$ is preferred. REU respects FOSD provided $r$ is monotonically increasing. Since $r(p)=p^3$ is strictly increasing on $[0,1]$, it respects FOSD.

  This implies REU can accommodate risk attitudes without violating a core rationality constraint. Unlike theories allowing non-monotonic weighting (which invite Dutch Books), REU maintains formal rationality while permitting deviations from EU maximization. However, respecting FOSD does not guarantee full rationality; REU still violates Independence. Thus, REU expands the scope of "rational" risk attitudes beyond EU, but remains constrained by dominance principles to avoid outright inconsistency.

  ***

  **Marking Scheme (20 Marks)**

  **1. Calculation (5 Marks)**
  *   **A (5):** Correctly identifies cumulative probabilities (1, 0.5, 0.25). Correctly calculates weights ($0.875, 0.109, 0.016$). Correctly derives REU(G)=8.125 vs REU(S)=40 and EU(G)=40 vs EU(S)=40.
  *   **B (3-4):** Correct weights but arithmetic error in final sum; OR correct final values but unclear derivation of weights.
  *   **C (0-2):** Fundamental error in cumulative probability or weighting formula.

  **2. Risk vs. Utility Distinction (10 Marks)**
  *   **A (8-10):** Explicitly notes $u$ is linear yet agent is risk-averse. Argues distinction is *structural* (invariance across gamble types) not just representational. Addresses the "relabeling" objection by referencing Independence violations or consistency across contexts.
  *   **B (5-7):** Notes $u$ is linear and REU shows risk aversion. States REU separates them but fails to explain *why* this isn't just relabeling (misses structural invariance point).
  *   **C (0-4):** Claims REU is just relabeling without justification, or confuses $r$ and $u$ roles.

  **3. FOSD and Implications (5 Marks)**
  *   **A (5):** Correctly states $r(p)=p^3$ is increasing, so FOSD holds. Implication: REU avoids dominance violations (Dutch Books) while allowing risk aversion, preserving rationality status despite Independence violations.
  *   **B (3-4):** States FOSD holds but gives weak implication (e.g., "it means it is rational"). OR claims FOSD violated because $r$ is non-linear.
  *   **C (0-2):** Incorrect judgment on FOSD compliance.

  **Total Differentiation:** An **A** answer connects the math to the philosophical defense of REU (structural vs. representational). A **B** answer performs the math correctly but treats the philosophical justification as a definition recall.
