answer: |-
  Given your background in experimental physics and biophysics, you will recognize the structure of this problem immediately: it is a signal detection problem involving Type I errors (false positives: convicting the innocent) and Type II errors (false negatives: acquitting the guilty). In your field, the Receiver Operating Characteristic (ROC) curve dictates that you cannot minimize both simultaneously; moving the threshold improves one at the expense of the other.

  The confusion at your dinner arises because the maxim is being used to describe three different things: a statistical target, a moral weighting, and a deontological constraint. Your interlocutors were not disagreeing about the sentence; they were disagreeing about which *category* of claim the sentence represents.

  Here is the anatomy of the maxim, ordered from the nearly empty to the genuinely radical.

  ### I. The Distinct Claims

  **1. The Rhetorical Heuristic (The "Be Careful" Claim)**
  *   **The Claim:** The specific numbers do not matter. The sentence is merely a cultural shibboleth indicating that the legal system should be biased toward the defendant. It asserts an asymmetry of concern without specifying a magnitude.
  *   **Verdict:** **Platitude.** It is trivially true that we *should* care more about false positives than false negatives, but it offers no guidance on how to construct the system or where to set the threshold. It functions as a mood rather than a rule.

  **2. The Institutional Calibration (The "Threshold" Claim)**
  *   **The Claim:** This is a design specification for a legal system. It asserts that the standard of proof ("beyond a reasonable doubt") should be set at a specific point on the error curve where the ratio of False Negatives to False Positives is roughly 10:1. It accepts the trade-off as inevitable but mandates a specific location on the curve.
  *   **Verdict:** **Defensible but Substantive.** This is empirically testable (we could measure conviction rates vs. exoneration rates). It is coherent as a piece of institutional engineering. However, it treats innocence as a probabilistic outcome of a procedure, not a metaphysical state.

  **3. The Utilitarian Weighting (The "Disutility" Claim)**
  *   **The Claim:** The number ten represents a ratio of moral harm. The social/moral cost of punishing one innocent person is equivalent to the cost of allowing ten guilty persons to go free. This is not about procedure, but about aggregate welfare. We maximize social good by minimizing total "moral pain," weighted by this factor.
  *   **Verdict:** **Defensible but Substantive.** This is a coherent consequentialist position. It allows for the trade-off but weights the variables heavily. It fails, however, if one believes the harm of punishing the innocent is *incommensurable* (i.e., infinite) rather than just "ten times worse."

  **4. The Deontological Constraint (The "Side Constraint" Claim)**
  *   **The Claim:** The ratio is rhetorical; the real claim is that the punishment of the factually innocent is forbidden *categorically*. The "ten guilty men" clause is a concession to reality in ordinary cases, but where the penalty is irreversible (death), the ratio becomes infinity:1. It denies the legitimacy of the trade-off curve entirely in high-stakes contexts.
  *   **Verdict:** **False (as a system rule) / Radical (as a moral stance).** As a rule for a functioning legal system that must render binary verdicts under epistemic uncertainty, this is false: you cannot reduce the false positive rate to zero without reducing the false negative rate to 100% (convict no one). It is only coherent if it functions as an argument for abolishing the penalty or the system itself.

  ### II. The Number "Ten"

  In the history of legal theory (from Hale to Blackstone to Voltaire), the number has varied from 5 to 100. This variability confirms its function.

  *   **Is it a literal exchange rate?** No. No legal system audits its error rates to ensure a precise 10:1 ratio is maintained annually.
  *   **Is it a rhetorical flourish?** Partially. It serves to memorably encode the asymmetry.
  *   **Is it a placeholder?** Yes. It stands for "significantly greater than one."
  *   **What work is it doing?** It is doing the work of a **weighting factor** in a cost function. In your terms, it assigns a cost $C_{FP}$ to false positives and $C_{FN}$ to false negatives, asserting that $C_{FP} \gg C_{FN}$.
  *   **The Crucial Distinction:** For the **Judge**, "ten" is a calibration parameter (Claim 2). For the **Friend**, "ten" is a rhetorical foil for "infinity" (Claim 4). The Friend argues that if the penalty is death, the cost function breaks, and no finite number of guilty releases can offset one innocent death.

  ### III. The Definition of "Innocent"

  This is the fulcrum on which your dinner argument balanced. The two senses you identified are:
  1.  **Factual Innocence:** The defendant did not commit the act.
  2.  **Legal Innocence:** The state failed to meet the burden of proof.

  These come apart because the legal system cannot access factual innocence directly; it can only assess evidence.

  *   **The Judge's Usage:** The Judge is using **Legal Innocence**. When he speaks of "institutional engineering," he acknowledges that the system will occasionally fail to convict the guilty and occasionally convict the innocent *by the standards of the procedure*. He views the maxim as a rule for managing the *risk* of error, not the elimination of error. To him, "innocent" means "someone the system should have acquitted but didn't."
  *   **The Friend's Usage:** The Friend is using **Factual Innocence**. This is why the irreversibility of execution matters. A legal error can be corrected (appeal, exoneration, compensation); a factual error involving execution cannot. The Friend argues that because certainty is impossible, the risk of *factual* innocence is always non-zero, and therefore the trade-off is morally impermissible.

  ### IV. Mapping the Readings

  Here is how the claims map to your interlocutors and the general usage:

  | Reading | Who holds it? | Coherence |
  | :--- | :--- | :--- |
  | **Claim 1 (Heuristic)** | **Ordinary Usage.** Most people reciting the maxim mean nothing precise by it; they are signaling allegiance to "fairness." | Coherent but empty. |
  | **Claim 2 (Calibration)** | **The Judge.** He sees the maxim as a target for the standard of proof. He accepts the error curve and chooses a point on it that favors the defendant. | Coherent within a functioning system. |
  | **Claim 3 (Weighting)** | **Neither strictly.** This is a philosopher's utilitarian reading. The Judge is retributivist (desert-based), not utilitarian (outcome-based), though the math looks similar. | Coherent, but mismatches the Judge's stated retributivism. |
  | **Claim 4 (Constraint)** | **The Friend.** She sees the maxim as a limit condition. If the cost is life, the ratio collapses to a prohibition. | Coherent morally, incoherent for system design (unless the system is abolished). |

  ### V. Synthesis

  You noted that you could not get the two readings (trade-off curve vs. absolute constraint) to come apart cleanly. This is because the maxim itself is an **equivocation** that allows both views to shelter under the same sentence.

  *   **The Judge** is correct that in a working system, the maxim must be read as **Claim 2 (Calibration)**. If you treat it as an absolute constraint, the system halts. You cannot adjudicate without accepting some non-zero probability of error. His reading makes the maxim a tool for setting the threshold of "reasonable doubt."
  *   **The Friend** is correct that in a moral context involving irreversible harm, the maxim logically migrates toward **Claim 4 (Constraint)**. If one accepts that factual innocence is the only moral currency that matters, and that certainty is impossible, the "trade-off" becomes a license to kill. Her reading exposes the moral cost of the Judge's calibration.

  **The Verdict on the Maxim:**
  The maxim is **defensible but substantive** only if read as **Claim 2 (Institutional Calibration)** regarding *legal* innocence. It becomes **false** (or at least operationally incoherent) if read as **Claim 4** regarding *factual* innocence within a system that continues to operate.

  The reason they could not resolve the argument is that the Judge was talking about the **physics of the system** (managing error rates), while the Friend was talking about the **ethics of the outcome** (the moral status of the executed body). The maxim bridges these two domains linguistically but fails to do so logically. It sounds like a rule of evidence (Judge) but carries the emotional weight of a moral absolute (Friend).

  In your terms: The Judge is arguing about where to set the discriminator threshold on the ROC curve. The Friend is arguing that for this specific signal (life/death), the cost of a False Positive is infinite, which mathematically forces the threshold to a point where no signal is ever accepted. They are both reading the sentence correctly according to their premises; the sentence itself is doing double duty, masking a category error between procedural risk and moral catastrophe.
