      *   **Core Idea:** Risk-Weighted Expected Utility (REU) treats risk attitudes as a stable agent feature (risk function). The user suspects this might actually be second-order uncertainty (ambiguity/uncertainty about probabilities) masquerading as risk attitude, especially in one-shot, high-stakes, thin-evidence cases.
      *   **Requirements:**
          *   (a) Precise question (determinate answer, debatable).
