answer: |-
  1. **The Mechanics of Presumption**
  Dummett argues for a standing presumption in favor of admission, treating the right to move as primary and the right to exclude as exceptional. In a practical policy framework, how is this presumption supposed to function procedurally? Is it a moral heuristic for legislators, or a justiciable right that an individual migrant can invoke at a border checkpoint?

  *Follow-up:* [Anticipating the guest will argue it is a policy guideline rather than an absolute individual right to avoid chaos] If it is merely a policy guideline rather than an enforceable individual right, doesn't that allow the presumption to be overridden by the very political majorities Dummett suspects are motivated by racism? How does a "soft" presumption protect the vulnerable against the "hard" power of the state?

  2. **The Burden of Proof**
  If the presumption lies with the migrant, the burden of proof must lie with the state to justify exclusion. When a government claims it has reached its "capacity to absorb," what specific evidentiary standard must they meet to overturn that presumption? Is it enough to cite public opinion polls regarding social tension, or must they demonstrate material scarcity?

  *Follow-up:* [Anticipating the guest will insist on material scarcity over public opinion] If you require material scarcity, how do you account for the fact that "scarcity" in housing or healthcare is often artificially manufactured by political choices rather than natural limits? Does the state get to claim "capacity full" if they have chosen not to build more housing?

  3. **Defining Absorptive Capacity**
  You argue that restrictions are only legitimate based on capacity, provided the assessment is free of racial or cultural bias. But "capacity" is not a purely physical metric like water in a glass; it involves social infrastructure. How do you specify a limit on "social trust" or "institutional strain" without implicitly privileging the existing culture of the receiving nation?

  *Follow-up:* [Anticipating the guest will argue that social trust can be measured objectively via crime or service usage] If you reduce social trust to service usage or crime rates, aren't you ignoring the *phenomenological* experience of the host population feeling "crowded"? If their feeling of displacement is real to them, even if statistically unfounded, does Dummett's framework have resources to address that political reality without conceding to bias?

  4. **The Bias Blind Spot**
  Dummett condemns cultural bias, yet he allows for capacity limits. Critics argue that "cultural cohesion" is often used as a proxy for racial homogeneity. What specific audit mechanism would you propose to ensure that a claim of "cultural capacity" is not simply racism in disguise? Who gets to audit the state's justification?

  *Follow-up:* [Anticipating the guest will suggest independent judicial or international review] If an international body audits these claims, doesn't that effectively dissolve national sovereignty in a way that Dummett, who was a patriot, might have found uncomfortable? Is there a tension between his anti-racism and his commitment to the nation-state as a vehicle for democracy?

  5. **Refugees vs. Economic Migrants**
  A core tenet of this position is that refugees have a stronger moral claim than economic migrants. But in a globalized economy, political persecution often manifests as economic strangulation. How do you draw a bright line between a person fleeing a regime that starves them as punishment and a person fleeing a market that starves them by neglect?

  *Follow-up:* [Anticipating the guest will rely on the legal definition of persecution vs. general hardship] If the distinction relies on the *intent* of the oppressor, doesn't that make the migrant's right to safety depend on the psychological state of their persecutor? Why should the moral urgency of my need to survive depend on whether a specific agent intended my harm?

  6. **The Moral Weight of the Distinction**
  Dummett places significant weight on the refugee distinction, suggesting economic migration is more easily restricted. But if the outcome for both individuals is identical—say, death by deprivation—does the *cause* of their migration bear the moral weight Dummett places on it? Why does the category of "refugee" retain such privilege in this framework?

  *Follow-up:* [Anticipating the guest will argue that refugee status triggers specific international obligations] If the moral weight comes from international law rather than fundamental ethics, isn't that circular? Are we protecting refugees because they are more vulnerable, or simply because the 1951 Convention says so, while leaving equally vulnerable economic migrants to drown?

  7. **The Open Borders Collapse**
  Given that wealthy nations have immense material capacity to absorb newcomers, does this Dummettian position ultimately collapse into a *de facto* open borders policy? If the only legitimate barrier is capacity, and capacity is high, is there any principled difference between your view and the open borders advocate?

  *Follow-up:* [Anticipating the guest will deny it is open borders because limits still exist] If the difference is only a matter of degree—where we admit millions instead of billions—does the "right to exclude" retain any meaningful content? At what point does the presumption of admission become so strong that exclusion becomes a theoretical possibility but a practical impossibility?

  8. **The Principled Stopping Point**
  If the position is not open borders, what is the principled stopping point? Is there a specific threshold of demographic change or resource allocation where the presumption flips? If not, how do you answer the communitarian objection that a political community must have the power to define its own boundaries to function as a democracy?

  *Follow-up:* [Anticipating the guest will argue that democracy requires inclusion, not exclusion] If democracy requires inclusion, doesn't that argue for *more* migration to fix the democratic deficit, rather than less? If the community defines itself by excluding others, isn't that the very racialized nationalism Dummett sought to dismantle?

  9. **Anti-Realism and Moral Truth**
  Dummett is famous for semantic anti-realism, arguing that truth cannot outrun our capacity to recognize it. Does this metaphysical view bear on the objectivity of moral claims about borders? Is the claim "This border is legitimate" only true if we can verify the conditions that make it so?

  *Follow-up:* [Anticipating the guest will separate Dummett's metaphysics from his political ethics] If you separate the metaphysics from the ethics, do you lose the philosophical unity of Dummett's thought? If moral truths about borders *are* verification-transcendent (i.e., a border is wrong even if no one recognizes it), doesn't that commit you to a realism Dummett spent his career arguing against?

  10. **The Reality of Harm**
  In an anti-realist framework, the "harm" of exclusion must be recognizable to be real. But much of the harm of immigration restrictions is invisible—it happens to people who never arrive. How can a Dummettian account for the moral reality of harms that are structurally hidden from the verifying gaze of the receiving country?

  *Follow-up:* [Anticipating the guest will argue we must expand our capacity to recognize harm] If we must expand our capacity to recognize harm to make it "true," does that make the moral obligation dependent on our empathy rather than their need? Does this risk making the migrant's right to enter contingent on the host's ability to *imagine* their suffering?
