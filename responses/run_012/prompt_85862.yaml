          *   Final diagnostic question (tempting wrong answer).
          *   What to explicitly refuse to cover (scope creep).

  2.  **Deconstruct the Concept (Common Knowledge):**
      *   *Mutual Knowledge:* Everyone knows $X$.
      *   *Common Knowledge:* Everyone knows $X$, everyone knows everyone knows $X$, ad infinitum.
      *   *The Crux:* It's not just "a lot" of mutual knowledge. It requires a public event or shared context that resets the infinite regress.
      *   *The Newsroom Problem:* They use it to mean "widely known" or "obvious." They miss the *coordination* aspect.
      *   *The Trap:* Infinite regress sounds abstract. Needs concrete grounding.

  3.  **Determine the Sequence (The "Skeleton"):**
      *   *First:* Establish the difference between "knowing" and "acting on knowing." If I know it but don't know *you* know it, I can't coordinate.
      *   *Second:* Introduce the infinite regress problem. Show why "I know you know" isn't enough if I don't know "you know I know."
      *   *Third:* The Solution (Public Announcement/Shared Context). How we actually achieve it in the real world.
      *   *Why this order?* If you start with the definition (infinite hierarchy), they glaze over. If you start with the solution (public announcement), they think it's trivial. You need the *pain* of coordination failure first.

  4.  **Select the Core Example:**
      *   *Candidate 1: Driving Side.* (User suggested avoiding). *Why avoid?* It's too stable. We already coordinate. Doesn't show the *fragility* or the *transition* from uncertainty to coordination.
