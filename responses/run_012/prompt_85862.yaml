      *   *Better Example:* **The Currency Attack / Peg Break.** (Since they liked the bank run piece).
      *   *Counter-argument:* That's too complex for 45 mins without slides.
      *   *Compromise:* Use the **Text Message** for the *logic*, but map it immediately to the **Press Conference** for the *application*. The Text Message is the "machinery." The Press Conference is the "real world."
      *   *Actually, the "Muddy Children" is often better for the "Public Announcement" aspect.* But the user said no Muddy Children.
      *   *Okay, I will stick with the Email/Text Chain.* It's the most intuitive way to draw the "I know that you know..." ladder on a whiteboard.

