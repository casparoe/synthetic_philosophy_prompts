answer: |-
  Here is the teaching plan. It is designed for a whiteboard, a skeptical audience, and a hard stop at 45 minutes.

  ### 1. The Sequence (The Architecture)

  You cannot teach the definition before the problem. If you define common knowledge first, it sounds like semantics. You must make them feel the *cost* of lacking it.

  **First: The Coordination Risk (10 Minutes)**
  *   **Goal:** Establish that "knowing" is not enough to act; you need to know *others* will act.
  *   **Whiteboard:** Draw two stick figures, A and B. Write a payoff matrix simply: "If both act: Win. If one acts: Lose (badly). If neither: Status Quo."
  *   **Why here:** This creates the stakes. Without this, common knowledge is just a logic puzzle. With this, it's a survival mechanism.
  *   **Collapse Point:** If you skip this, they will treat common knowledge as "extra information" rather than "coordination infrastructure."

  **Second: The Infinite Regress (The Machinery) (20 Minutes)**
  *   **Goal:** Visually demonstrate why private channels fail, no matter how many confirmations you add.
  *   **Whiteboard:** This is where you use the **Email/Text Chain** (your Two Generals variant). Draw the arrows. $A \to B$ (Plan?), $B \to A$ (Yes), $A \to B$ (Got your Yes)...
  *   **Why here:** You need them to see the ladder. You need them to see that the last sender *always* has doubt.
  *   **Collapse Point:** If you introduce the "Public Announcement" solution before they feel the pain of the infinite chain, they will think the announcement is just "faster communication." It isn't. It's a structural reset.

  **Third: The Public Reset (The Solution) (10 Minutes)**
  *   **Goal:** Show how a public event collapses the ladder.
  *   **Whiteboard:** Draw a megaphone or a "Press Conference" icon. Draw lines from it to A and B *simultaneously*.
  *   **Why here:** This connects the logic to their job. They write about press conferences, Fed announcements, and earnings calls.
  *   **Collapse Point:** If you don't explicitly link the "Public Reset" back to the "Infinite Regress," they will revert to thinking of it as "everyone heard the news." You must emphasize: *It's not that they heard it; it's that they know the other person heard it.*

  **Fourth: The Wrap & Diagnostic (5 Minutes)**
  *   **Goal:** Lock in the distinction and test comprehension.

  ---

  ### 2. The Single Example: The Unconfirmed Text Chain

  You asked to push back on the Two Generals/Email example. **Do not push back.** Use it.

  **Why this example?**
  1.  **Visual:** It is the only example that lets you draw the infinite regress ($A \to B \to A \to B$) on a whiteboard without using logic notation ($K_a K_b p$).
  2.  **Relatable:** Every reporter has been in a group chat trying to coordinate dinner or a meetup where texts lag.
  3.  **Newsroom Adjacent:** It maps perfectly to "sources confirming off-record" vs. "on-the-record briefing."

  **What the example must HAVE:**
  *   **Uncertainty of Delivery:** The core mechanic is that messages *might* not arrive (or might be intercepted/leaked). If the channel is perfect, the problem vanishes.
  *   **Asymmetric Risk:** Acting alone must be punished. If acting alone is safe, coordination doesn't matter.
  *   **Private Channels:** The initial communication must be 1-to-1.

  **What the example must LACK:**
  *   **Technical Jargon:** Do not use the words "Byzantine Generals," "TCP handshake," or "distributed consensus." Call it "The Text Message Problem."
  *   **Military Stakes:** Keep it abstract or social. If you make it about war, they tune out as "not my beat." Frame it as "Two sources trying to go on the record simultaneously."

  **Why not the others?**
  *   *Driving Side:* Too stable. It explains equilibrium, not the *transition* to coordination.
  *   *Muddy Children:* Too abstract/logic-puzzle. It relies on induction steps that bore non-math audiences.
  *   *Bank Run:* You've already done this. It's the *application*, not the *machinery*. Use the Text Chain to explain *why* the bank run happened.

  ---

  ### 3. Misconceptions (And When to Kill Them)

  **Misconception 1: "It's just Mutual Knowledge with more steps."**
  *   *When it surfaces:* During the **Infinite Regress** phase. They will say, "So if we just send 10 confirmations, it's basically common knowledge."
  *   *Where to head it off:* At the whiteboard. Draw the 10th arrow. Ask: "Does Person A know Person B received the 10th message?" If there's *any* chance of loss, the answer is No.
  *   *The Fix:* Emphasize that Common Knowledge is a **qualitative state**, not a quantitative accumulation. It's a cliff, not a slope.

  **Misconception 2: "A public announcement just spreads information faster."**
  *   *When it surfaces:* During the **Public Reset** phase. They will think the value is efficiency.
  *   *Where to head it off:* Immediately after drawing the megaphone. Ask: "If I email everyone individually saying 'Meeting at 5,' is that the same as shouting it in the newsroom?"
  *   *The Fix:* The value isn't the *info*; it's the *shared context*. The announcement makes *me knowing* contingent on *you knowing*.

  **Misconception 3: "Rationality means being smart."**
  *   *When it surfaces:* If you touch on Game Theory/Markets.
  *   *Where to head it off:* Only if you mention "Common Knowledge of Rationality."
  *   *The Fix:* Define it instantly as "Predictability." "Rational" in this context means "acting according to known rules," not "making good decisions."

  ---

  ### 4. The "Common Knowledge of Rationality" (CKR) Question

  **Can you reach it in 45 minutes?**
  **No.** Not if you want them to leave with a usable tool for their copy.

  CKR is a modeling assumption used to solve for equilibria (e.g., "Why didn't the market crash sooner? Because traders commonly knew other traders were rational"). Explaining this requires explaining *equilibrium selection*, which requires explaining *payoffs*, which eats 20 minutes.

  **The Compromise:**
  Mention it only in the final 2 minutes as a "Pro Tip" for econ writing.
  *   *Script:* "When you read a paper that says 'Common Knowledge of Rationality,' don't translate that as 'everyone is smart.' Translate it as 'everyone assumes everyone else is playing by the same rulebook.' That's a modeling assumption, not a fact about human nature. If you write that traders 'suddenly became rational,' you're wrong. They just suddenly *commonly knew* the rules changed."

  ---

  ### 5. The Final Diagnostic Question

  Do not ask: "What is common knowledge?" (They will recite the definition).
  Do not ask: "Give me an example." (They will give a weak one).

  **Ask this:**
  > "A scandalous memo is leaked. Every single editor in this room receives a copy via encrypted email at 9:00 AM. By 9:05, everyone has read it. At 10:00 AM, the Editor-in-Chief stands on a desk and reads the memo aloud to the whole room.
  >
  > **Why does the situation change at 10:00 AM? What can we do at 10:01 that we couldn't do at 9:05?**"

  **The Tempting Wrong Answer:** "Now we know for sure everyone has it." (This is Mutual Knowledge, which they already had at 9:05).
  **The Right Answer:** "Now we can *act* on it together." (e.g., Publish simultaneously, or collectively ignore it). Before 10:00, if you publish, you risk being the only one (sucker's payoff). After 10:00, the public reading creates the common knowledge required to coordinate the risk.

  ---

  ### 6. What to Flatly Refuse (Scope Control)

  You must set boundaries at the start, or a curious reporter will derail you into formalism. Say this verbatim:

  > "We are not doing logic proofs today. I am not writing $K_i K_j p$ on the board. We are not discussing Bayesian updating. And we are not solving the Two Generals Problem mathematically. We are learning why your copy editor circles 'open secret' and why 'the market knew' is physically impossible unless there was a public bell."

  **Specifically refuse:**
  1.  **The Impossibility Proof:** Do not let them talk you into proving *why* the text chain never resolves. Just assert it. "Trust me, the last sender always doubts."
  2.  **Higher-Order Knowledge:** Do not go beyond "Everyone knows everyone knows." The "everyone knows everyone knows everyone knows" is implied, not drawn.
  3.  **Private vs. Public Good:** Don't drift into economics of public goods. Stay on *information structure*.

  ### Summary Checklist for the Whiteboard
  1.  **Left Side:** The Payoff Matrix (Act/Don't Act).
  2.  **Center:** The Zig-Zag Arrows (The Text Chain).
  3.  **Right Side:** The Megaphone (The Public Reset).
  4.  **Bottom:** The Diagnostic Question.

  If you stick to this geometry, you keep them oriented. If you erase the Center to make room for something else, you lose the machinery. Keep the Zig-Zag visible until the very end.
