      *   **Final Question:** The "Open Secret" vs. "Front Page" distinction.

  11. **Refining the Tone:**
      *   Respect their intelligence.
      *   Keep it practical (copy-editing focus).
      *   Whiteboard-centric instructions.

  12. **Self-Correction on the Example:**
      *   The prompt asks to push back on Two Generals if something else is better.
