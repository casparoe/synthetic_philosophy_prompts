answer: |-
  Here is the translation of the Frame Problem and its neighbors into your vocabulary, followed by the residue report you requested.

  ### 1. The Translation

  In the AI and philosophy literature, the **Frame Problem** is the difficulty of specifying that, when an event occurs, the vast majority of the system state remains unaffected without having to explicitly write a rule for every single unaffected field.

  In your vocabulary:
  *   **The World:** The append-only log (the source of truth).
  *   **State:** A materialized view (projection) folded from the log.
  *   **Action:** A command validated against invariants, resulting in one or more events appended to the log.
  *   **The Frame Axiom:** The implicit assumption in your projection logic that `if event.type != 'FieldX_Updated', then state.FieldX remains unchanged`.
  *   **The Problem:** In a general reasoning system, you cannot hardcode the projection logic in advance. The system must *infer* which fields to update. In your system, you hardcode the projection logic. The philosophical problem arises when you ask: *How do you know you didn't miss a dependency?*

  **The Neighboring Problems:**
  *   **The Qualification Problem:** The infinite list of preconditions required for a command to succeed.
      *   *Your Vocabulary:* Validation logic and invariants. You check `Inventory > 0` before emitting `OrderPlaced`. The problem is that there is always another precondition you didn't check (e.g., "The warehouse didn't burn down five seconds ago").
  *   **The Ramification Problem:** The indirect effects of an action.
      *   *Your Vocabulary:* Projections that subscribe to multiple streams, or process managers that react to an event by emitting a *new* event. If `OrderPlaced` implies `InventoryReserved`, do you handle that in the same transaction (invariant) or as a downstream eventual consistency (projection/process manager)?

  ### 2. The Residue Report

  Here is the breakdown of what carries over from the philosophical discussion to your engineering reality.

  #### A. Clean Translations
  **The Ramification Problem** translates cleanly.
  *   **Philosophy:** Action $A$ causes $P$, but $P$ implies $Q$. How does the system know to update $Q$?
  *   **Your Vocabulary:** This is exactly the design decision between a **single-stream aggregate** vs. **process managers**. If `AddressChanged` must trigger `FraudCheckRequested`, you wire that subscription. The "problem" is reduced to a dependency graph management issue. You solve this by defining explicit handlers.
  *   **Verdict:** No loss. Your vocabulary handles this better than the philosophical literature because you accept eventual consistency.

  **The Qualification Problem** translates cleanly as **Boundary Conditions**.
  *   **Philosophy:** You can't list every condition required for an action to work (e.g., gravity exists, power is on).
  *   **Your Vocabulary:** You define a **Bounded Context**. You explicitly decide that "power is on" is outside your schema. You only validate invariants within your domain model.
  *   **Verdict:** No loss. You acknowledge the problem by drawing a system boundary.

  #### B. Distorted Translations
  **The Frame Problem** translates only under distortion.
  *   **Philosophy:** How does a system *represent* non-change without explicit axioms?
  *   **Your Vocabulary:** How does a developer *implement* non-change without explicit code?
  *   **The Distortion:** In AI, the system is expected to *discover* relevance. In your system, relevance is *configured*. You solve the frame problem by refusing to acknowledge state you didn't define in the schema.
  *   **What gets bent:** The epistemic burden shifts from the *runtime system* (the AI) to the *design-time architect* (you). The problem doesn't disappear; it is outsourced to your requirements gathering.

  #### C. No Counterpart
  **Open-World Assumption.**
  *   **Philosophy:** The system must assume new facts can appear that contradict old rules.
  *   **Your Vocabulary:** Your schema is a closed-world assumption. If a fact isn't in the schema, it doesn't exist for the system. If the world changes in a way your schema doesn't permit, your system throws an exception or ignores the input.
  *   **Verdict:** This is a fundamental mismatch. Your framework assumes the universe of discourse is finite and known. The Frame Problem assumes it is not.

  ### 3. Addressing Your Suspicion

  You asked: *"My framework gets relevance for free, because the schema decides in advance what may be represented and what may change. If the translation only works because my picture has already stipulated the very thing the frame problem says cannot be stipulated, then say so plainly."*

  **Plainly:** Yes. That is exactly what is happening.

  Your framework does not solve the Frame Problem; it **circumvents** it by restricting the domain.
  *   **The Philosophical Claim:** You cannot finitely specify relevance in an open world.
  *   **Your Framework's Move:** We will not operate in an open world. We will operate in a Bounded Context where relevance is defined by the projection subscriptions.

  **Is this a solution, a translation, or a change of subject?**
  It is a **change of subject**.
  The Frame Problem is an epistemological problem about *knowledge* and *inference* in an uncertain world. Event Sourcing is an engineering discipline about *consistency* and *auditability* in a defined world.

  When you say the schema "decides in advance," you are admitting that the "intelligence" regarding what matters resides in the human architect, not the system. The system is dumb; it only follows the fold logic you wrote. The philosophical Frame Problem asks how the *system itself* could figure that out.

  **Is this a defect of your vocabulary?**
  No. It is a feature of your constraints. Your vocabulary is designed for **construction**, not **cognition**.
  *   If you are building a backend, the "defect" is in the philosophical expectation that a formal system should infer relevance without human guidance.
  *   If you are building an AGI, the "defect" is in your vocabulary's inability to handle schema evolution without downtime or migration.

  The residue here is evidence that the philosophical formulation was doing **more work** than your engineering problem requires. The philosophers are trying to model a mind that can walk into a new room and know what matters. You are modeling a ledger that tracks money. The ledger doesn't need to know what matters; it only needs to track what you told it matters.

  ### 4. Worked Example

  **The Scenario:** A User changes their email address.

  **1. The State (Projection)**
  ```json
  {
    "userId": "123",
    "email": "old@example.com",
    "accountStatus": "ACTIVE",
    "lastLoginIp": "192.168.1.1"
  }
  ```

  **2. The Action (Command/Event)**
  Command: `ChangeEmail`
  Event Appended: `EmailChanged { userId: "123", newEmail: "new@example.com" }`

  **3. The Frame Statement (Philosophical)**
  "The action `EmailChanged` does not change `accountStatus` and does not change `lastLoginIp`."
  *In logic:* $Holds(Status, s) \land Holds(IP, s) \implies Holds(Status, Result(EmailChanged, s)) \land Holds(IP, Result(EmailChanged, s))$

  **4. The Update (Event Sourcing)**
  ```javascript
  // Projection Handler
  function onEmailChanged(state, event) {
      state.email = event.newEmail;
      // We do not touch state.accountStatus
      // We do not touch state.lastLoginIp
      return state;
  }
  ```

  **5. Where They Come Apart (The Residue)**
  In the philosophical version, the system must *derive* that `accountStatus` is irrelevant to `EmailChanged`. If the system is smart, it might realize that changing an email often triggers a security review, which *should* change `accountStatus` to `PENDING_VERIFICATION`. If the system relies on frame axioms (things stay the same), it fails to make this update unless explicitly told.

  In your version, **you** decide if `accountStatus` changes.
  *   **Case A:** You write the handler exactly as above. `accountStatus` stays `ACTIVE`.
  *   **Case B:** You realize the requirement. You change the handler (or add a process manager) to set `accountStatus = 'PENDING_VERIFICATION'`.

  **The Rift:**
  The philosophical problem is: *"How does the system know it needs Case B without me telling it?"*
  Your engineering answer is: *"It doesn't. I tell it. If I don't, it's a bug in the requirements, not a bug in the logic."*

  The Frame Problem highlights that in a complex world, you (the architect) will miss Case B. You will assume `accountStatus` is irrelevant when it is actually relevant. Your schema stipulated irrelevance, but the real world violated the stipulation. Your system will faithfully maintain the wrong invariant.

  ### 5. Verdict

  **How much is a disagreement about representation?**
  About **70%**.
  Most of the Frame Problem discussion is about how to encode "nothing else changes" efficiently. Your vocabulary solves this elegantly: "Nothing else changes because the code doesn't touch it." This is the standard "default logic" solution in AI (things stay the same unless there's a rule to change them), implemented via imperative code. You can reason about this part of the philosophical debate perfectly well using your vocabulary. It maps to "implicit vs. explicit state updates."

  **How much concerns something your vocabulary has no room for?**
  About **30%**.
  This is the **Holism/Relevance** component. The philosophical claim is that *any* fact could be relevant to *any* action in an open world (e.g., "If the moon is made of cheese, changing your email might fail due to gravitational tides").
  Your vocabulary has no room for this because your **Schema** acts as a filter. It declares *ex nihilo* what facts exist.
  *   If the schema doesn't have a field for `MoonComposition`, the system cannot reason about it.
  *   If the schema doesn't link `EmailChanged` to `MoonComposition`, the system treats them as independent.

  **Conclusion:**
  You can use your vocabulary to reason about the **mechanics** of the Frame Problem (how to manage state updates without explosion). You cannot use it to reason about the **epistemology** of the Frame Problem (how to know which state updates are required in an unknown world).

  When the philosophers say "You can't stipulate relevance in advance," and you say "Watch me define it in the schema," you are not disagreeing. You are simply pointing out that you are building a **tool**, not a **mind**. The residue is not a defect in your vocabulary; it is the boundary where engineering stops and cognition begins.
