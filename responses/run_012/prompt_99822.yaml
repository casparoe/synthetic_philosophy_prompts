  The passage in its context

  This reply concludes the article asking whether sedition is always a mortal sin. The third objection argues that resisting a tyrant is praiseworthy, implying sedition against such a ruler is not sinful. Aquinas denies the objection's underlying classification. He does not concede that sedition is sometimes permissible; rather, he argues that resisting a tyrant does not constitute sedition at all. Since sedition is defined as opposition to the common good and the unity of the multitude, and a tyrannical government seeks only the private good of the ruler, opposing it aligns with the common good. Therefore, the act falls outside the moral species of sedition. The reply functions to protect the absolute prohibition of sedition while carving out a space for legitimate resistance by redefining the target of such resistance as outside the protection of lawful authority.

  What the reply does and does not license

  Aquinas's definition of sedition in the first article requires discord among parts of a people against the unity of the multitude. A single assassin or small conspiracy does not fit this definition strictly, as they do not represent a factional split within the populace. However, the reply's argumentative work extends beyond mere taxonomy. By establishing that a tyrant rules without justice, Aquinas removes the moral shield of authority from the ruler. Consequently, disturbing such a government is not a sin against unity. This does not automatically license tyrannicide or deposition for any actor. It merely clears the specific charge of sedition. The act may still be unlawful due to lack of proper authority or the sin of murder. The reply distinguishes the *justice of the cause* from the *legitimacy of the agent*. If resisting a tyrant is not sedition, it is because the tyrant has already severed the bond of political unity. Thus, the reply carries significant weight for resistance theory by denying the tyrant the benefit of the peace, but it does not grant a universal right to violence. It leaves open the question of who may act, focusing instead on the moral quality of the opposition itself. The user's suspicion that this clears a charge never laid is partially correct regarding private actors, but wrong regarding the objection's logic. The objection assumed resistance was sedition; Aquinas corrects the definition. If private assassination is not sedition, it is still potentially murder or usurpation. Aquinas is not endorsing vigilante justice. The text protects the resister from the charge of breaking the peace, but does not empower them to make war. It implies that if public authority rises, it is justice. If a private person rises, it is not sedition, but it may be disorder. The reply isolates the tyrant from the common good, making him an enemy of the peace rather than its guardian. Historians often treat this as a green light for revolution. It is not. It is a yellow light that says "This isn't treason against the people," but doesn't say "You can do it." The distinction between the *object* of the act (tyrant) and the *circumstances* (authority, harm) is vital. Aquinas separates the moral species from the prudential execution. "Disturbing" covers any opposition, but lawfulness depends on authority. The Reply argues the *cause* determines the sin, not just the number of actors. If the cause is just, it is not sedition. The tyrant's injustice makes the cause just. But again, just cause does not equal just agent.

  The greater-harm proviso

  The conditional clause regarding greater harm functions as a teleological constraint on natural law reasoning. The common good is the ultimate standard; if resistance destroys the common good more than the tyranny does, the resistance fails the standard. This is not merely prudential advice but a moral condition that renders the act unlawful. It prevents the remedy from becoming worse than the disease. Regarding who judges this, Aquinas implies a collective or public judgment rather than private discretion. Private individuals are prone to passion and error, whereas public authority represents the multitude. This proviso aligns with the requirement that resistance serve the common good, not private vengeance. It places the burden of proof on the resisters to demonstrate that the disturbance will not collapse the political order. Therefore, even against a genuine tyrant, revolt is unlawful if it leads to greater chaos. This makes the judgment objective, rooted in the outcome for the community, not subjective intent. The competence to make this judgment lies primarily with those holding public authority or the community acting as a whole, not isolated individuals. This safeguards against anarchy while maintaining the principle that tyranny is illegitimate. The user asks if this is a real consequentialist proviso. It is not utilitarian; it is teleological. The end is fixed (common good). The means are evaluated by their capacity to achieve that end without destroying it. It is not a calculation of pleasure but of political survival. Who applies it? Not God alone, but human reason assessing probable outcomes. This requires prudence. If private persons judge, they risk error. Thus, the proviso effectively channels resistance toward public authority, who are better positioned to judge the common welfare. It makes spontaneous private revolt morally hazardous, even if technically not sedition. This ensures the judgment is not merely subjective preference.

  The tyrant as the seditious party

  The reversal naming the tyrant seditious is not merely rhetorical but ontological. Sedition is discord against the unity of the multitude. Since the tyrant rules for private good against the common good, he creates the discord. The resister restores unity. This re-description legitimizes resistance as counter-sedition, an act of restoring peace rather than breaking it. However, it does not make every act of the tyrant sedition, nor does it validate every act of the resister. It identifies the source of the division. The tyrant is the aggressor against the political body. This shifts the moral burden. The resister is defending unity; the tyrant is attacking it. It defines the *nature* of the rule, not necessarily the *lawfulness of every response*. The tyrant commits the sin of sedition by ruling tyrannically because he fractures the common good. This means the label of "seditious" attaches to the injustice of the regime, not just open rebellion. It allows Aquinas to condemn the tyrant while protecting the concept of political unity. The rebel is not breaking peace; the tyrant already broke it.

  Squaring it with the treatise on kingship

  The *De Regno* discussion is not in conflict but complements the *Summa*. *De Regno* addresses the *remedy* and *authority*, while the *Summa* addresses the *moral species* of the act. *De Regno* warns private persons against killing tyrants because it often leads to worse tyranny or chaos. This aligns perfectly with the *Summa*'s greater-harm proviso. The *Summa* says resisting a tyrant is not sedition; *De Regno* says private persons should not do it unless public authority acts. There is no contradiction. One text clears the moral label; the other regulates the execution. The *Summa* establishes that tyranny is unjust. *De Regno* establishes that removing it requires prudence and authority. The caution in *De Regno* regarding private assassination confirms that "not sedition" does not mean "lawful for anyone." It means it is not a sin against unity, but it may be a sin against order or justice if done privately. The two texts together form a coherent theory: tyranny is illegitimate (*Summa*), but removal must serve the common good without causing greater harm (*De Regno*). The user's recollection of *De Regno* is accurate; it is more cautious about *action*, not about the *justice of the cause*. The *Summa* is bolder on the principle, *De Regno* is prudent on the practice. They distinguish between the right to resist (based on justice) and the authority to execute resistance (based on order). *De Regno* explicitly states that if no human remedy is available, one must recourse to God. This fits the *Summa*'s proviso: if resistance causes greater harm, do not resist. The *Summa* defines the sin; *De Regno* defines the strategy. A private assassin in *De Regno* is not seditious (per *Summa*), but is rash and potentially sinful due to the danger to the common good. The texts operate on different levels of moral analysis. *De Regno* distinguishes between tolerable and intolerable tyranny. The *Summa* speaks of tyranny generally as unjust. The proviso in the *Summa* absorbs the *De Regno* distinction: if tyranny is tolerable, resistance causes greater harm. If intolerable, resistance is justified. Thus, the caution in *De Regno* is the practical application of the *Summa*'s theoretical proviso.

  Verdict on my reading

  Your framing is sound in identifying the tension between the definition of sedition and the act of resistance. You are correct to suspect that historians often overload this text with revolutionary weight. However, you are conflating the question of sin's species with the question of lawful authority. Aquinas deliberately keeps these separate. The text is underdetermined on who precisely judges the greater harm, but context suggests public authority. You are right that a single assassin does not fit the definition of sedition in Article 1, but the Reply generalizes the principle to any disturbance. Do not look for a modern theory of rights here. Aquinas is defining sin, not licensing revolution. The conflict with *De Regno* is apparent, not real. Your reading is sharp but expects a political manifesto where there is only moral theology. You import categories like "lawful act" in a juridical sense, whereas Aquinas works with moral species. The text does not grant a right; it removes a prohibition. You are also right to question the "consequentialist" label; it is teleological. The genuine underdetermination lies in the mechanism of judgment for the greater harm. Aquinas assumes a natural consensus among the virtuous. Your suspicion that the reply clears a charge never laid is partially true for private actors, but the Reply serves to correct the Objection's assumption. Ultimately, your reading is rigorous but risks modernizing the intent. Accept the distinction between moral classification and political permission. You are correct to question the weight historians place on this passage. It is not a charter for liberation.
