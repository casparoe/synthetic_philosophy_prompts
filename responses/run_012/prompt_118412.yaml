      *(Self-Correction during drafting)*: I need to be careful about the Mule. If the definition requires the *thing itself* to belong to a lineage that *can* evolve, the mule fits. But if the definition implies the *thing itself* must be capable of reproduction, the mule fails. The text of (3) says "belongs to a lineage that can evolve." This saves the mule. I need to point out that the friend's objection to the mule relies on reading (2) as "X must reproduce," whereas (2) actually says "X... belongs to a lineage." Wait, (2) says "a living thing makes more things like itself." That *does* exclude the mule individually.
      *   *Correction:* Step (2) says "a living thing makes more things like itself." This *does* kill the mule.
