answer: |-
  This is a classic problem in historical institutionalism and economic sociology. The term "path dependence" has become a "conceptual stretch" (Sartori), covering everything from "history matters" to "we are trapped in a suboptimal equilibrium."

  Here is the spec you asked for. It is designed to separate the mechanistic core from the rhetorical flourishes.

  ### I. The Desiderata List for a Theory of Path Dependence

  To count as a theory of path dependence (specifically *lock-in*), an explanation must satisfy the **Non-Negotiables**. The **Contested Preferences** are where the three usages you identified diverge.

  #### A. Non-Negotiable Requirements (The Mechanism)
  *If a theory fails these, it is not path dependence; it is just history or inertia.*

  1.  **Contingency of Outcome (The Fork):**
      *   **Requirement:** The theory must demonstrate that at a critical juncture ($T_0$), at least two distinct outcomes were possible and plausible.
      *   **Motivation:** Distinguishes path dependence from determinism. If structural forces made Outcome A inevitable regardless of the "nudge," the nudge didn't matter.
      *   **Test:** Can you construct a plausible counterfactual where the "nudge" goes the other way and the long-run outcome flips?

  2.  **Self-Reinforcement (Increasing Returns):**
      *   **Requirement:** The theory must identify a mechanism where the *probability* of staying on the path (or the *cost* of leaving it) increases *over time*.
      *   **Motivation:** Distinguishes lock-in from plain inertia. Inertia is a constant friction (it costs \$100 to change a law today, and \$100 tomorrow). Lock-in is a deepening rut (it costs \$100 to change today, \$1,000 in ten years, \$1M in fifty).
      *   **Test:** Does the cost of switching rise as the path is traversed? If the cost is static, it's just a stable equilibrium, not path dependence.

  3.  **Sensitivity to Early Events (The Nudge):**
      *   **Requirement:** Small, potentially trivial events at $T_0$ must have disproportionate effects on the long-run outcome.
      *   **Motivation:** Distinguishes path dependence from "large causes have large effects."
      *   **Test:** If you remove the specific "coin flip" or "small nudge," does the outcome remain the same? If yes, the nudge wasn't causal.

  #### B. Contested Preferences (The Evaluation)
  *These distinguish the three usages you encountered. A robust theory should state which it adopts.*

  4.  **Inefficiency Claim (The "Worse" Outcome):**
      *   **Requirement:** The locked-in outcome is demonstrably inferior to the forgone alternative.
      *   **Camp:** Usage 2 (Your second classmate).
      *   **Status:** **Optional.** Many theorists (e.g., Pierson) argue path dependence can lock in *efficient* outcomes too. Demanding inefficiency makes the concept much harder to prove.
      *   **Motivation:** This is the critical bite. If the outcome isn't worse, why do we care that it was contingent?

  5.  **Agency vs. Structure (The "Bothered" Test):**
      *   **Requirement:** Distinguishes "no one has bothered to change it" (preference stability) from "it is too costly to change it" (structural constraint).
      *   **Camp:** Usage 1 vs. Usage 2.
      *   **Status:** **Non-Negotiable Distinction.** A theory must be able to tell these apart. If actors *could* change it easily but *choose* not to, that is preference alignment, not lock-in.

  ---

  ### II. Mechanisms and Their Predictions

  A theory must name the engine. Simply listing them is not enough; you must know what each predicts.

  | Mechanism | What it is | Specific Prediction for Path Dependence |
  | :--- | :--- | :--- |
  | **Increasing Returns** | Unit cost of adoption falls as scale increases. | Early adopters gain a cost advantage that later competitors cannot match, even if the competitor's tech is superior. |
  | **Network Effects** | Value of the good increases as more people use it. | A superior standard will fail to launch if it cannot reach a critical threshold of users early on. |
  | **Learning-by-Doing** | Efficiency increases with cumulative experience. | Switching to a new process requires discarding accumulated "muscle memory" or tacit knowledge, creating a high switching cost that grows over time. |
  | **Adaptive Expectations** | Actors choose based on what they think *others* will choose. | Outcomes can tip rapidly based on rumors or signals about popularity, independent of intrinsic quality. |
  | **Sunk Costs (Political)** | Institutional investments create vested interests. | Actors who invested in the current path will actively block change, making reversal politically costlier over time. |

  **Crucial Distinction:** *Inertia* predicts a constant resistance to change. *Increasing Returns* predicts resistance that compounds. If a legal rule can be changed by a simple statute with no economic disruption, it is **Inertia**, not Path Dependence.

  ---

  ### III. The Tension: Inefficiency vs. Checkability

  You suspected a tension between claiming outcomes are *worse* and claims being *checkable*. You are right.

  **The Tension:**
  To satisfy the **Inefficiency Claim**, you must compare the actual world to a counterfactual world (the road not taken). To satisfy **Checkability**, you need observable data.
  *   **Problem:** We observe the actual path. We do *not* observe the counterfactual path. We cannot know if the "road not taken" would have actually been better, because that path might have had its own unforeseen problems.
  *   **Conflict:** If you demand rigorous proof of inefficiency (Usage 2), you make path dependence almost impossible to verify historically (unfalsifiable). If you drop the inefficiency claim to make it checkable (Usage 1 or 3), you lose the normative urgency (why is lock-in a problem?).

  **Resolution:**
  The only way to resolve this is to treat **Inefficiency as a Contested Preference**, not a definition. A theory of path dependence *can* exist without claiming the outcome is worse. It simply claims the outcome is *contingent* and *sticky*. If you want to claim it is *worse*, you bear a heavy burden of proof that most historical cases cannot meet.

  ---

  ### IV. The Load-Bearing Requirement

  **The Single Requirement that Rules Candidates Out:**
  **Self-Reinforcement (Increasing Returns to Adoption).**

  **Why:**
  This is the filter that catches 90% of misuses.
  *   If a thing persists because people like it? **Not Path Dependence.** (Preference)
  *   If a thing persists because changing it costs a fixed amount and no one wants to pay? **Not Path Dependence.** (Inertia/Equilibrium)
  *   If a thing persists because the cost of changing it *grows* the longer you wait? **Path Dependence.**

  If a case study cannot show that the switching costs *increased* over time due to the adoption of the path itself, it is not lock-in. It is just "history happened."

  ---

  ### V. Applying the Spec to Your Concrete Case

  **The Case:** Two provinces, same legal system. 1920s: Province A adopts Rule X via merchant commission. Province B adopts Rule Y via judge's coin flip. 100 years later: Rules differ. Lawyers say neither is better; both could be changed by statute if anyone cared.

  **Your Argument:** "No one has bothered."
  **Flatmate's Argument:** "Textbook lock-in."

  **Testing against the Desiderata:**

  1.  **Contingency of Outcome:** **Pass.** The judge flipping a coin suggests genuine contingency at $T_0$.
  2.  **Sensitivity to Early Events:** **Pass.** The coin flip determined the outcome.
  3.  **Self-Reinforcement (The Load-Bearing Test):** **FAIL.**
      *   *Evidence:* Lawyers state both could be changed "tomorrow by a statute."
      *   *Analysis:* This implies switching costs are *static* and *low*. There is no evidence that the cost of switching has *increased* over the century due to the adoption of the rule. There are no vested interests blocking it, no technical incompatibility, no network effects preventing change.
      *   *Verdict:* This is **Inertia**, not Lock-in. It is a stable equilibrium because the *benefit* of changing is low (neither rule is better), not because the *cost* of changing is high.
  4.  **Inefficiency:** **Fail.** Explicitly stated that neither is better.

  **Conclusion:** Your flatmate is using Usage 1 ("It happened and stuck"). You are correctly identifying that it fails Usage 2/3 (Mechanism). Under the spec, this is **not** path dependence. It is simply *divergent historical equilibrium maintained by low stakes.*

  ---

  ### VI. The Two Camps: A Scorecard

  **Camp 1: The Lock-In Realists (Arthur, David, North)**
  *   **Claim:** Lock-in to inferior standards is real and common (e.g., QWERTY, VHS).
  *   **Performance on Spec:**
      *   *Mechanism:* Strong. They defined Increasing Returns.
      *   *Contingency:* Strong.
      *   *Inefficiency:* **Weak.** They often assert inefficiency without robust counterfactuals (e.g., the QWERTY myth has been heavily debunked).
      *   *Checkability:* Low. They rely on historical narratives where the counterfactual is assumed.

  **Camp 2: The Skeptics (Liebowitz, Margolis)**
  *   **Claim:** Most "lock-in" is just efficient market selection; if it stuck, it was probably best.
  *   **Performance on Spec:**
      *   *Mechanism:* Strong. They demand proof of switching costs.
      *   *Inefficiency:* **Strong.** They refuse to accept inefficiency claims without proof.
      *   *Contingency:* **Weak.** They often assume markets correct small nudges too quickly for lock-in to establish.
      *   *Checkability:* High. They demand observable data.

  **Who wins?** The Skeptics win on *verification*, but the Realists win on *plausibility* for political/institutional cases (where markets don't correct quickly). In your legal case, the Skeptics are right: without rising switching costs, it's not lock-in.

  ---

  ### VII. Confidence and Meta-Reflection

  **My Confidence in this List:**
  High on the distinction between **Inertia vs. Self-Reinforcement**. This is the analytical core. If you remove this, "path dependence" becomes synonymous with "persistence," which is analytically useless.

  **What I Would Drop First:**
  I would drop the **Inefficiency Claim** as a requirement. It is the source of most confusion. A theory of *how* things stick is valuable even if the thing that stuck is neutral or good. Making inefficiency a definition turns path dependence into a critique rather than an explanation.

  **What Would Change My Mind:**
  If you could show a case where switching costs were *static* (Inertia), yet the outcome was still genuinely *contingent* on a small early event in a way that deterministic models couldn't capture. However, mathematically, without increasing returns or positive feedback, small nudges tend to wash out over time unless there is some friction. If there is friction but no *increasing* friction, it's just a "high barrier" equilibrium, not a "path dependent" one.

  **Final Advice for the Paper:**
  Use the **Self-Reinforcement** requirement as your scalpel. When you read case studies, ask: "Did the cost of switching rise *because* time passed and the path was taken?" If the answer is "No, it just costs effort to change anything," file it under Inertia. If the answer is "Yes, because the whole ecosystem adapted to this specific choice," file it under Path Dependence. Your flatmate's case is Inertia. Don't let them bully you with the jargon.
