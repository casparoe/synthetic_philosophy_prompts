prompt: |-
  Ok so I'm writing a term paper for a course on long-run social explanation and I keep getting stuck on path dependence. The problem is that everyone in the seminar is using "path dependent" to mean three different things and I cant tell which of them is supposed to be doing the actual work. One person means "it happened that way and it stuck around"; another means "it stuck around even though it's worse than what could have been"; a third means "there was a moment where two options were genuinely live and a small nudge picked one". I'm not after something formalisable in a model, I just need something sharp enough to tell me which of those three uses is legitimate and which is a fancy way of saying "it happened". So before I read any more case studies I want the spec, not the cases: what would a theory of path dependence actually have to deliver to be any good?

  So: give me the desiderata list. What does any adequate theory of lock-in have to be able to do -- which cases must it get right, which distinctions must it respect (genuine self-reinforcing lock-in vs. plain inertia or slow adjustment; contingency of the event vs. contingency of the outcome; "nobody has bothered to change it" vs. "it can't be changed"), which mechanisms it has to be able to name and separate (increasing returns, network effects, learning-by-doing, coordination and expectation effects, sunk costs -- and what each of those is supposed to predict, not just that it's on the list), and what it must say about the counterfactual "would the same outcome have arrived anyway". For each requirement give me the case or consideration that motivates it, and mark which requirements are non-negotiable and which are just preferences of one camp. I especially want you to flag any two requirements you think can't be jointly satisfied -- my suspicion is that there's a straight tension between wanting the theory to make strong claims about locked-in outcomes being worse than the road not taken, and wanting those claims to be the sort of thing anyone could in principle check. If you agree, say why; if you think I've set the tension up wrong, say that instead. And which single requirement does the most work in ruling candidates out?

  I've got a concrete case I'm trying to fit, by the way. My flatmate is from a place where two neighbouring provinces had the same legal system, and in the 1920s both adopted a rule about who eats the cost when a house turns out to have a hidden defect -- one by a commission that was told to pick whichever rule the local merchants wanted, the other by a judge who basically flipped a coin between two options he thought equally good. A century later the two rules are still different, and the local lawyers I've talked to agree neither is better than the other and both could be changed tomorrow by a statute if anyone cared. He says that's a textbook lock-in; I say it's just that noone has bothered. Tell me which requirements in your list that case is actually testing, and what the theory would have to say to settle our argument. Finally, one short paragraph on how the two main camps do against the list -- the people who think lock-in into inferior standards is real and common, and the sceptics who think it's mostly bad counterfactual history. Please be straight with me about your own confidence in the list: which requirements you'd drop first if someone pushed, and what would change your mind about which requirement is the load-bearing one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**

      *   **Context:** Writing a term paper for a course on long-run social explanation.
      *   **Problem:** Confusion over the term "path dependence." Three distinct usages identified:
          1.  Persistence ("it happened and stuck").
          2.  Inefficiency/Lock-in ("it stuck even though it's worse").
          3.  Contingency/Small Causes ("a small nudge picked one of two live options").
      *   **Goal:** A "spec" or "desiderata list" for an adequate theory of path dependence/lock-in. Not formal models, but conceptual clarity.
      *   **Specific Requirements:**
          *   Distinguish genuine self-reinforcing lock-in vs. inertia/slow adjustment.
          *   Distinguish contingency of event vs. contingency of outcome.
          *   Distinguish "nobody bothered" vs. "can't be changed."
          *   Name and separate mechanisms (increasing returns, network effects, etc.) and their predictions.
          *   Address the counterfactual ("would it have happened anyway?").
          *   Flag non-negotiable vs. preference requirements.
          *   Identify tensions/trade-offs (specifically between inefficiency claims and checkability).
          *   Identify the single most important requirement for ruling candidates out.
          *   Apply the list to the user's concrete case (legal rules in two provinces).
          *   Evaluate the two main camps (Lock-in proponents vs. Skeptics).
          *   Express confidence levels and what would change the assistant's mind.

  2.  **Deconstruct the Three Usages:**

      *   *Usage 1 (Persistence):* This is trivial. Everything persists until it doesn't. This is "history matters" in the weakest sense.
      *   *Usage 2 (Inefficiency):* This is the strong claim (QWERTY, VHS). Requires comparing actual vs. counterfactual welfare.
      *   *Usage 3 (Contingency/Sensitivity):* This is the mechanistic claim (small events have large, lasting effects). Requires showing alternative outcomes were possible at a critical juncture.

  3.  **Drafting the Desiderata List (The "Spec"):**

      *   *Requirement 1: Contingency of Outcome (The "Fork in the Road").* Must show that at time $T_0$, outcome $A$ and outcome $B$ were both possible. If $A$ was inevitable, it's not path dependence, it's determinism.
      *   *Requirement 2: Self-Reinforcement (The "Mechanism").* Must explain *why* it stuck. Not just inertia (cost of change > 0), but increasing returns (cost of change increases *over time*). Distinguish from "slow adjustment."
      *   *Requirement 3: Counterfactual Robustness.* Would the outcome have occurred without the specific trigger? If yes, it's not path dependent.
      *   *Requirement 4: Inefficiency Claim (Optional/Contested).* Must the outcome be suboptimal? Many theorists say no. This is where the tension lies.
      *   *Requirement 5: Reversibility Costs.* Distinguish "hard to change" (lock-in) from "no one wants to change" (equilibrium).

  4.  **Addressing the Tension (Inefficiency vs. Checkability):**

      *   The user suspects a tension between claiming an outcome is *inferior* and being able to *verify* that claim.
      *   *Analysis:* To claim inefficiency, you need a welfare metric. In social systems, welfare is contested. To claim lock-in, you need to show switching costs are prohibitive.
      *   *Verdict:* The tension is real. Strong inefficiency claims often rely on unobservable counterfactuals. A theory that demands proof of inefficiency makes path dependence unfalsifiable in many historical cases.

  5.  **Identifying the "Load-Bearing" Requirement:**

      *   Which one rules out the most "fake" path dependence?
      *   *Candidate:* Self-Reinforcement (Increasing Returns). Without this, it's just inertia.
      *   *Candidate:* Contingency. Without this, it's just determinism.
      *   *Decision:* **Self-Reinforcement (specifically Increasing Returns to Adoption).** This distinguishes "stickiness" from "lock-in." Inertia is constant friction; lock-in is deepening ruts.

  6.  **Applying to the Concrete Case (Legal Rules):**

      *   *Scenario:* Two provinces, same system, different rules adopted via different processes (commission vs. judge flip). 100 years later, both persist. Lawyers say neither is better, both could change.
      *   *Flatmate:* Says it's lock-in.
      *   *User:* Says it's "no one bothered."
      *   *Analysis against Desiderata:*
          *   *Contingency:* Yes (judge flip vs. commission).
          *   *Self-Reinforcement:* Weak. Lawyers say it *could* be changed by statute. Switching costs don't seem to be increasing.
          *   *Inefficiency:* Explicitly denied (neither is better).
          *   *Verdict:* This looks like **Persistence (Usage 1)**, not Lock-in (Usage 2/3). It fails the Self-Reinforcement test. It's coordination equilibrium, not technological/structural lock-in.

  7.  **Evaluating the Two Camps:**

      *   *Proponents (Arthur, David, North):* Good at identifying mechanisms (increasing returns), often overreach on inefficiency (QWERTY myth).
      *   *Skeptics (Liebowitz, Margolis):* Good at demanding evidence of inefficiency, often set the bar too high (demanding proof of a counterfactual that can't be proven).
      *   *Confidence:* High on the distinction between inertia and increasing returns. Lower on the ability to definitively prove inefficiency in historical cases.

  8.  **Refining the Output (Self-Correction/Polishing):**

      *   *Tone:* Academic but direct. "Straight with me."
      *   *Structure:* Follow the prompt's structure closely (Desiderata, Tensions, Concrete Case, Camps, Confidence).
      *   *Check:* Did I distinguish "contingency of event" vs "contingency of outcome"? Yes, need to make sure that's clear. (Event = the nudge; Outcome = the long term result).
      *   *Check:* Did I list mechanisms? (Increasing returns, network effects, etc.). Need to ensure I explain what each *predicts*, not just lists them.
      *   *Check:* Did I identify the non-negotiables? Yes.
      *   *Check:* Did I address the "load-bearing" requirement? Yes.

  9.  **Final Review of the "Tension":**
      *   The user asks about the tension between "locked-in outcomes being worse" and "claims anyone could check."
      *   My thought: This is the "Inefficiency vs. Falsifiability" tension. If you require proof of inefficiency, you kill the theory because counterfactuals are unobservable. If you drop inefficiency, you lose the critical bite of the theory (why should we care?).
      *   I need to be explicit that *Inefficiency* is the negotiable preference, while *Self-Reinforcement* is the non-negotiable mechanism.

  10. **Drafting the Response:** (Mental outline of sections)
      *   Intro: Acknowledge the messiness.
      *   The Desiderata List (categorized by Non-Negotiable vs. Contested).
      *   Mechanisms & Predictions (table or list).
      *   The Tension (Inefficiency vs. Verification).
      *   The Load-Bearing Requirement.
      *   The Concrete Case Analysis.
      *   The Two Camps.
      *   Confidence & Meta-Reflection.

      *(Self-Correction during drafting)*: Make sure to clearly distinguish "Inertia" (constant cost to change) from "Lock-in" (increasing cost to change). This is crucial for the flatmate case.

      *(Refining the Legal Case)*: The flatmate says "textbook lock-in." The user says "no one bothered." The key is the *cost of switching*. If a statute can change it easily, the switching cost is low. Therefore, it's not lock-in. It's just a stable equilibrium. I need to make sure the theory distinguishes these.

      *(Refining the Mechanisms)*:
