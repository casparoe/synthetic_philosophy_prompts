answer: |-
  # Activity: The Santa Clara Council

  **Time:** 45 Minutes (Activity) + 30 Minutes (Debrief)
  **Participants:** 18 Students (Councilors)
  **Materials:** 18 Envelopes, Paper Tokens (or slips of paper), Score Sheets, Applicant Cards.

  ## I. Setup and Materials (Prep Before Class)

  **1. The Envelopes (18 total)**
  Each envelope contains:
  *   **5 Influence Tokens** (paper chips or slips marked "I").
  *   **4 Applicant Cards** (see below).
  *   **1 Confidential Decision Sheet** (folded).
  *   **1 Public Declaration Card** (visible).
  *   **1 Score Sheet.**

  **2. The Applicant Cards (Identical in every envelope)**
  *   **Card K (Kin):** "Your cousin needs a loan to save the family shop."
      *   *Cost:* 1 Token minimum.
      *   *Payoff:* +2 Network Points per token. -1 Integrity Point per token.
  *   **Card P (Party):** "Local party chair needs funds for voter mobilization."
      *   *Cost:* 1 Token minimum.
      *   *Payoff:* +2 Network Points per token. -1 Integrity Point per token.
  *   **Card V (Village):** "Road repair in the village that elected you."
      *   *Cost:* 1 Token minimum.
      *   *Payoff:* +2 Network Points per token. -1 Integrity Point per token.
  *   **Card M (Merit):** "City-wide sanitation project (impersonal need)."
      *   *Cost:* 1 Token minimum.
      *   *Payoff:* -2 Network Points per token. +3 Integrity Points per token.

  **3. The Score Sheet**
  *   **Network Score:** Sum of Network Payoffs. *Threshold: 15 points.* (Below 15 = "Recalled/Ostracized").
  *   **Integrity Score:** Sum of Integrity Payoffs. *Threshold: 15 points.* (Below 15 = "Indicted/Corrupt").
  *   **Hypocrisy Penalty:** If Public Declaration does not match Private Decision (determined by Audit), subtract 20 Integrity Points.

  **Note on Math:** With 5 tokens, it is **mathematically impossible** to maximize both scores.
  *   *All Merit:* Network = -10 (Fail), Integrity = +15 (Pass).
  *   *All Kin/Party/Village:* Network = +30 (Pass), Integrity = -5 (Fail).
  *   *Split (e.g., 3 Kin, 2 Merit):* Network = +6 (Fail), Integrity = +3 (Fail).
  *   *The Only Way to Pass Both:* Students must realize they need to **lie** on the Public Declaration or find a loophole. (See *Failure Modes* for how to handle this).
  *   *Correction for Playability:* To ensure a solvable tension rather than pure impossibility, adjust the Thresholds.
      *   **Revised Thresholds:** Network Need: 10 points. Integrity Need: 10 points.
      *   *Split Strategy (3 Kin, 2 Merit):* Network = +6 (Fail).
      *   *Wait, let's make the "Village" card neutral.*
      *   **Revised Card V:** +1 Network, 0 Integrity. (The "Gray Zone").
      *   **Revised Thresholds:** Network Need: 8 points. Integrity Need: 8 points.
      *   *Strategy:* 3 Tokens to Village (+3 Net, 0 Int), 2 Tokens to Merit (-4 Net, +6 Int). Total Net: -1. Still tight.
      *   *Final Tweak:* Let the students feel the *failure*. The lesson is that the system is rigged. Do not make it easily solvable. Keep the thresholds high (15 points). Most will fail one metric. This generates the debrief fuel.

  ## II. Activity Timeline (45 Minutes)

  **0:00–0:05: Introduction (The Frame)**
  *   **Instructor:** "You are the Santa Clara City Council. The International Development Bank (IDB) has given you a one-time grant of 5 Influence Tokens each. You must allocate them."
  *   **The Conflict:** "You have two masters. The IDB monitors your **Integrity**. Your constituents (kin, party, village) monitor your **Loyalty**. If Loyalty drops too low, you lose protection and are removed from office. If Integrity drops too low, you are indicted for corruption."
  *   **Instruction:** "Do not discuss your cards with others yet. Keep your envelope closed."

  **0:05–0:15: Phase 1 – The Private Ledger (Secret Allocation)**
  *   Students open envelopes.
  *   They allocate their 5 Tokens among the 4 Cards privately on the **Confidential Decision Sheet**.
  *   They calculate their projected Network and Integrity scores.
  *   **Instructor:** "This is what you *do*. No one sees this but you. Ensure you spend all 5 tokens."

  **0:15–0:30: Phase 2 – The Public Hearing (Justification)**
  *   Students fill out the **Public Declaration Card**. This is a single sentence: *"I allocated my resources to prioritize [Kin/Party/Village/Merit] because..."*
  *   **The Constraint:** "This card will be public. The IDB Monitor (Instructor) will read these aloud. Your constituents (classmates) will hear them."
  *   **The Audit:** "I will randomly select 3 envelopes. If the Public Declaration contradicts the Private Ledger (e.g., you claim Merit but funded Kin), you incur the **Hypocrisy Penalty**."
  *   **Table Talk (5 mins):** Students turn to their table (6 students per table). They must discuss: *"How do we survive both the IDB and our neighbors?"* They cannot trade tokens, but they can share strategies.
  *   **Spotlight (5 mins):** Instructor asks 3 students from different tables to read their Public Declaration.

  **0:30–0:40: Phase 3 – The Reveal and Scoring**
  *   Students calculate final scores based on their Private Ledger.
  *   **Instructor:** "Raise your hand if your Network Score is below 15." (Likely many hands if they pursued Integrity).
  *   **Instructor:** "Raise your hand if your Integrity Score is below 15." (Likely many hands if they pursued Network).
  *   **Instructor:** "Raise your hand if you feared the Audit."
  *   Collect the Private Sheets. Announce that the "Audit Results" will be posted later (maintains tension).

  **0:40–0:45: Transition to Debrief**
  *   **Instructor:** "Keep your Score Sheets. Put everything else away. We are no longer Councilors; we are ethicists analyzing Santa Clara."

  ## III. Debrief Guide (30 Minutes)

  **1. The Phenomenology of the Decision (5 mins)**
  *   *Question:* "For those who funded Kin/Party despite the Integrity cost: What did that feel like? Was it 'corruption' or 'obligation'?"
  *   *Question:* "For those who funded Merit despite the Network cost: Did you feel virtuous, or did you feel vulnerable/exposed?"
  *   *Goal:* Establish that both choices carried a *cost*. Impartiality was not free; it purchased integrity at the price of social safety.

  **2. Mapping the Concepts (10 mins)**
  *   **Corruption vs. Clientelism:**
      *   *Point:* The IDB code defines corruption as "diverting public resources for private gain."
      *   *Point:* Your Network score represents clientelism: "resources exchanged for loyalty/protection."
      *   *Ask:* "If the Village card (Card V) is a public good but also helps your voters, is funding it corruption? The code says maybe. Your survival says yes."
  *   **Universalism vs. Parochialism:**
      *   *Point:* The Integrity Score is **Universalist** (same rule for everyone, imposed by IDB).
      *   *Point:* The Network Score is **Parochial** (specific to your ties, local survival).
      *   *Ask:* "Is the IDB code 'neutral,' or is it a specific cultural view of what office means? If you ignore your cousin in Santa Clara, you survive ethically but fail socially. Is the ethicist who tells you to ignore your cousin imposing an alien value?"

  **3. The Trap of Relativism and Imperialism (10 mins)**
  *   **The Imperialism Charge:** "If I, as the Instructor (IDB), penalize you for funding your cousin, am I enforcing universal ethics or cultural imperialism? I am punishing you for having relationships."
  *   **The Relativism Counter-Charge:** "If we say 'all cultures have different ethics,' does that mean we must accept that the Party Chair *deserves* public funds? Does relativism license exploitation by the powerful (the Party Chair) against the weak (the Stranger)?"
  *   **Key Insight:** Corruption is not just breaking a rule; it is a conflict over *who owns the office*. Does the office belong to the Public (Universal) or the Network (Particular)?

  **4. Structural Limits (5 mins)**
  *   *Question:* "In this game, you had a choice. In reality, do officials always have a choice?"
  *   *Point:* If the social safety net is gone, the "Kin" card isn't just a favor; it's survival. Clientelism often fills the void where institutions fail.
  *   *Conclusion:* "Anti-corruption isn't just about punishing individuals; it's about changing the payoff structure so you don't have to choose between ethics and survival."

  ## IV. Predictable Failure Modes & Fixes

  **Failure Mode 1: The Moralizers (The "Clean" Table)**
  *   *What happens:* A table collectively decides to fund only Merit. They score high Integrity, low Network. They argue, "Corruption is just wrong."
  *   *Why it fails the lesson:* They miss the *cost* of impartiality. They treat the Network penalty as abstract points, not social death.
  *   *Instructor Fix:* During the Scoring Phase, explicitly narrate the consequence. "Councilor X, your Integrity is high, but your Network is zero. In Santa Clara, that means your cousin's shop closes and your party withdraws protection. You are recalled next election. Was the ethical stand worth the loss of power to do *any* good?"

  **Failure Mode 2: The Cynics (The "Realists")**
  *   *What happens:* Students laugh, fund only Kin/Party, and say, "Everyone does it. The IDB is naive."
  *   *Why it fails the lesson:* They collapse into relativism ("anything goes") and miss the normative claim that public office *should* be impartial.
  *   *Instructor Fix:* In the Debrief, press on the *harm*. "If everyone funds Kin, who fixes the sanitation (Merit)? The city rots. Relativism explains the behavior, but does it justify the outcome? Who pays the price of your 'survival'?"

  **Failure Mode 3: Rule-Lawyering (The "Loophole" Seekers)**
  *   *What happens:* Students try to define "Kin" as "Merit" or argue the tokens aren't "public money."
  *   *Why it fails the lesson:* It turns into a logic puzzle rather than an ethical tension.
  *   *Instructor Fix:* Be the Judge. "The IDB defines the terms. You can argue in the debrief, but in the game, the rules stand. The tension is real, not semantic."

  **Failure Mode 4: Time Overrun**
  *   *What happens:* Discussion drags during Phase 2.
  *   *Instructor Fix:* Use a visible timer. Cut the "Table Talk" short if needed. The tension is generated by the *individual* decision, not the group consensus.

  ## V. Limitations of the Activity (For Instructor Awareness)

  Be prepared to acknowledge these in the final 5 minutes:

  1.  **Structural Coercion:** The game makes the choice individual. In reality, clientelism is often a systemic trap. An official might *want* to be impartial but will be physically threatened or politically destroyed if they are. The game gamifies this; reality weaponizes it.
  2.  **The "Poor" are Absent:** The "Merit" card is abstract. In reality, the poor are often the ones dependent on the "Kin/Party" networks because the state (Merit) has abandoned them. Anti-corruption drives sometimes hurt the poor by dismantling the only safety net they have.
  3.  **Network Complexity:** In the game, the network is 4 cards. In reality, corruption networks are diffuse, hidden, and extend beyond the municipality (national parties, corporations).
  4.  **The "Monitor" Problem:** The Instructor plays the IDB. This reinforces the "Western Imposer" dynamic. Acknowledge this: "I am playing the role of the external monitor. Notice how you resented my penalties. That resentment is part of the political reality of anti-corruption work."

