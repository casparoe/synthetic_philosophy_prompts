  These practices presuppose a theory of *fair play* where obligations arise from voluntarily benefiting from a cooperative scheme, rather than from legal statutes or universal moral truths. Strictly, this view assumes binding force emerges only when agents mutually rely on shared restraint, distinguishing *constitutive* participation from mere presence. It fits comfortably with contextual etiquette but strictly presupposes that breaking a convention wrongs *participants*, not the law itself. Consequently, this framework quietly rules out strict Legal Positivism, which equates law with obligation, and Moral Universalism, which would condemn non-queueing universally regardless of locale. Instead, it aligns with Humean conventionalism, where duty is created by the practice itself. If we held that conventions bind only those who have explicitly or tacitly accepted them, our treatment of visitors would require radical transparency. We could not blame a visitor for ignoring a queue unless we established their knowledge of the local norm. Instruction would shift from implicit social shaming to explicit orientation, treating convention violations by outsiders as category errors rather than moral failures. Judgement would depend on proof of participation in the scheme, meaning institutions must signal when a practice is optional to negate the presumption of obligation, ensuring that duty remains tethered to consent rather than coercion or habit.
