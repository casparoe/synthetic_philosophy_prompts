      *   Queueing: Socially obligatory for locals, optional for visitors (context-dependent).
      *   Core tension: Legal vs. Social vs. Contextual obligation.

  3.  **Identify the Underlying Theory:**
      *   The practices suggest a *contextual conventionalism* or *fairness-based obligation* rooted in participation rather than strict legalism or universal moral duty.
      *   It presupposes that obligations arise from *mutual expectation within a specific practice* (Humean convention or Rawlsian fairness), not merely from law or abstract etiquette.
      *   It rules out *Legal Positivism* (law = obligation) and *Moral Universalism* (queueing is always wrong/right).
      *   It distinguishes between *constitutive rules* (binding participants) and *regulative rules* (optional/external).

  4.  **Drafting - Step 1 (Mental Outline):**
