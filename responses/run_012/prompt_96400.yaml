prompt: |-
  I run the quarterly forecasting review for a mid-size specialty insurer. Four times a year my team has to hand the risk committee a single probability for each of a short list of events the firm is exposed to — whether a regulator clears a filing before a stated date, whether a named counterparty is downgraded within a year, whether a jurisdiction restructures — and the committee uses those numbers directly to size hedges and set reserves. There is no budget or time inside a cycle to commission new research: the number has to come out of a ninety-minute meeting. I am not a statistician; two of my five analysts are; and the chief risk officer, who signs the paper, will not read anything containing a formula.

  The recurring problem is that two analysts look at the same event and come back far apart — 30% and 60% on what is nominally the same question — and the meeting ends either in an average nobody believes or in whatever the most senior person in the room asserts. I know there is a formal result somewhere behind this, Aumann's agreement theorem, and an assumption sitting underneath it, the common prior assumption, and I suspect it tells me something I could actually use. What I cannot do is get from the result to anything my analysts could run on a Tuesday.

  Please write me that procedure. I want the questions to ask, in order, of two people who disagree, together with what counts as a sufficient answer to each and who is responsible for giving it; the tests that separate a disagreement about what the evidence is from a disagreement about where you start from before any evidence arrives from a disagreement about how the same evidence should be read; the point at which the procedure concludes that further discussion will not help and says so; and the point at which it stops and escalates, on the grounds that the remaining difference is not a factual one and somebody has to choose. The procedure has to be runnable by a chair who does not know the theory, so translate rather than cite — I am not going to read the literature, and anything I am meant to use needs to be inside the procedure itself. It should also tell me what to record at the end of a review so the next cycle is not starting from nothing.

  Then run it on three cases and tell me, for each, what the procedure does, where it stops, and what it hands back:

  1. Two analysts at 30% and 60% on whether the regulator clears the filing. The one at 60% has had a private conversation with a contact at the regulator and is not permitted to say what was said. I want to know what the procedure does when the condition it needs cannot be met because the information cannot be pooled, and whether the person who cannot disclose can still be made to answer anything useful.

  2. Two analysts who, after a full exchange, agree on every fact, give the same answer when asked what they would have said knowing nothing but what is public, and still disagree — because they read the same leaked draft differently, one treating it as diagnostic of the regulator's intentions and the other as noise. I expect to be told this is outside the theorem and that I have to pick a reading by fiat. If that is the answer, say it plainly, and tell me who should be doing the picking and on what authority.

  3. The case I will not enjoy. Two analysts converge quickly and comfortably on a number, and I need the procedure to make me distrust that agreement rather than reward it: last year the team converged on a number that was badly wrong, because both analysts had leaned on the same vendor's scenario set, and nothing in our process noticed.

  Finally, tell me which conditions of the result are doing real work in meetings like mine and which are idealizations I can drop without losing the point; whether a procedure of this kind can ever establish that a common starting point exists rather than merely detecting when it fails; and what the procedure cannot do. If the honest conclusion is that the result has very little to say about the meetings I actually hold, say that instead of dressing it up as a method.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Runs quarterly forecasting review for a mid-size specialty insurer.
      *   **Task:** Produce a single probability for specific risk events (regulatory clearance, counterparty downgrade, etc.) for the Risk Committee.
      *   **Constraints:** 90-minute meeting, no new research, CRO won't read formulas, Chair (User) isn't a statistician.
      *   **Problem:** Analysts disagree widely (e.g., 30% vs. 60%). Outcomes are either unbelieved averages or seniority bias.
      *   **Theoretical Basis:** User knows about Aumann's Agreement Theorem and Common Prior Assumption but needs a *practical procedure* derived from them, not theory.
      *   **Deliverables:**
          1.  A step-by-step procedure (questions, order, sufficient answers, responsibility, stop/escalate points, recording).
          2.  Application of the procedure to three specific cases (Private Info, Interpretational Disagreement, False Consensus).
          3.  Meta-analysis (Which conditions matter, can we prove common priors, limitations).
      *   **Tone:** Pragmatic, authoritative, no jargon, honest about limitations.

  2.  **Analyze the Theory (Aumann's Agreement Theorem):**

      *   *Core Idea:* Two rational agents with the same prior beliefs cannot agree to disagree. If they have common knowledge of each other's posteriors (probabilities), their posteriors must be equal.
      *   *Implication for Disagreement:* If they disagree, either:
          1.  They have different information (information asymmetry).
          2.  They have different priors (different starting beliefs before seeing evidence).
          3.  One or both are irrational (processing error).
      *   *Practical Translation:* To resolve disagreement, you must pool information and align processing. If priors differ fundamentally, you can't "solve" it mathematically; someone must decide.
      *   *The "Common Prior" Problem:* In reality, people *do* have different priors. The theorem assumes they don't. The procedure needs to test if the disagreement is due to *info* or *priors/processing*.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Goal:* Isolate the source of disagreement (Info vs. Interpretation vs. Prior).
      *   *Step 1: Anchor the Numbers.* State the probabilities clearly.
      *   *Step 2: The "Blank Slate" Test (Priors).* Ask what they would guess without specific new evidence. This tests the Common Prior Assumption.
      *   *Step 3: The Evidence Inventory (Information).* List the specific pieces of evidence each used.
      *   *Step 4: The Weighting Check (Likelihoods).* How much does specific evidence move the needle?
      *   *Step 5: The Stop/Escalate Rule.* If info is pooled and processing is aligned but disagreement remains, it's a Prior/Philosophy clash. Escalate to CRO/Chair.
      *   *Recording:* Need to capture *why* a number was chosen, not just the number.

      *Refining the Steps for a Non-Statistician Chair:*
      *   Avoid "Priors." Use "Starting Point."
      *   Avoid "Likelihood Ratios." Use "Impact of Evidence."
      *   Avoid "Common Knowledge." Use "Shared List."

  4.  **Developing the Three Cases:**

      *   *Case 1 (Private Info):* Analyst B has insider info they can't share.
          *   *Procedure Action:* Step 3 (Evidence Inventory) fails. B cannot list the evidence.
          *   *Outcome:* The procedure flags "Unpoolable Information."
          *   *Resolution:* Can B justify the *weight* without the *content*? (e.g., "Trust me, this source is 90% reliable"). If not, the Chair must decide whether to trust the person or the public data. This is an escalation point.
      *   *Case 2 (Interpretation/Priors):* Same facts, same starting point, different read on a leaked draft.
          *   *Procedure Action:* Steps 2, 3, 4 pass. Disagreement remains.
          *   *Outcome:* This is a "Model/Philosophy" split. Aumann says they *shouldn't* disagree if rational + common prior. Since they do, one is treating noise as signal.
          *   *Resolution:* Escalate. The CRO or Chair must pick the "risk posture" (conservative vs. optimistic). It's not a math problem; it's a policy choice.
      *   *Case 3 (False Consensus):* Both agree (e.g., 50%), but based on same flawed vendor data.
          *   *Procedure Action:* The procedure needs a "Red Team" or "Independent Source" check *before* Step 1.
          *   *Modification:* Add a "Source Independence Check."
          *   *Outcome:* Procedure identifies "Shared Blind Spot."
          *   *Resolution:* Force a divergence exercise. Assign one analyst to argue the opposite case.

  5.  **Meta-Analysis (The "Honest Conclusion"):**

      *   *Working Conditions:* Information pooling is the big one. Rationality (processing logic) is the second.
      *   *Idealizations:* Common Priors is the big lie. People *are* different. The procedure detects this but doesn't fix it.
      *   *Can we prove Common Priors?* No. We can only fail to disprove them.
      *   *Limitations:* It doesn't generate truth. It generates *justification*. It can't fix bad data. It can't force disclosure of private info.

  6.  **Review and Refine:**

      *   *Tone Check:* Is it too academic? *Adjustment: Use business language (Risk Committee, Reserve Sizing).*
      *   *Constraint Check:* 90 minutes? *Adjustment: Keep steps tight. Time-box each step.*
      *   *User Constraint:* "I am not going to read the literature." *Adjustment: Ensure no citations in the procedure itself.*
      *   *Case 1 Nuance:* The prompt asks if the person who cannot disclose can still answer anything useful. *Answer:* Yes, they can validate their *reliability* or the *direction* without the *content*, but the procedure must flag the risk.
      *   *Case 2 Nuance:* Who picks? *Answer:* CRO owns the risk appetite.
      *   *Case 3 Nuance:* How to distrust agreement? *Answer:* Mandatory "Devil's Advocate" step if sources overlap >80%.

  7.  **Final Polish:** Organize into clear sections: The Procedure, The Case Runs, The Meta-Analysis. Ensure the distinction between "Information," "Interpretation," and "Starting Assumption" is crystal clear. (Self-Correction: Make sure the "Recording" section is practical for the next cycle).

  8.  *(Final thought on Aumann)*: Aumann's theorem is often misunderstood. It doesn't say people *will* agree. It says if they *know* each other's estimates and are rational + common prior, they *must* agree. Since they don't agree in reality, one assumption fails. The procedure is essentially a diagnostic tool to find *which* assumption failed. I need to make sure this diagnostic nature comes through without using the theorem's name constantly.

  9.  *(Drafting the Response)*... (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the procedure, the case runs, and the honest assessment of its limits.

  ### Part 1: The Consensus Diagnostic Procedure

  **Purpose:** To determine whether a disagreement between analysts is due to different information, different interpretations of the same information, or different starting assumptions. To force a decision when the disagreement cannot be mathematically resolved.
  **Timebox:** 45 minutes of the 90-minute meeting (leaving 45 for other agenda items).
  **Roles:**
  *   **Chair:** You. Enforces time, asks questions, records outcomes.
  *   **Analyst A / Analyst B:** The two disagreeing parties.
  *   **Scribe:** Records the "Evidence Log" (see End of Procedure).

  **Step 1: The Anchor (5 Minutes)**
  *   **Action:** Analyst A and Analyst B state their probabilities clearly.
  *   **Question:** "State your number and the single biggest factor driving it."
  *   **Sufficient Answer:** "I say 30%. Biggest factor is X." / "I say 60%. Biggest factor is Y."
  *   **Fail State:** Vague reasoning ("It just feels riskier"). *Chair Intervention:* "Name one specific document, event, or data point."

  **Step 2: The Blank Slate Test (10 Minutes)**
  *   **Goal:** Test the "Common Prior" (Do you start from the same place before seeing new evidence?).
  *   **Question:** "Ignore the specific news of the last quarter. Based only on the long-term history of this regulator/counterparty, what is the base rate? What would you have guessed three years ago?"
  *   **Sufficient Answer:** Both analysts give roughly the same historical baseline (e.g., "Regulators usually clear 80% of these filings").
  *   **Fail State:** Analyst A says "50% (coin flip)" and Analyst B says "90% (regulators always clear)."
  *   **Decision:** If they fail here, they have different **Starting Assumptions**. Stop discussion. Go to Step 6 (Escalation).

  **Step 3: The Evidence Inventory (15 Minutes)**
  *   **Goal:** Test for Information Asymmetry (Do you know different things?).
  *   **Question:** "List the specific pieces of evidence you used to move from your Blank Slate number to your current number."
  *   **Sufficient Answer:** A shared whiteboard list. (e.g., "Q3 Earnings Call," "Leaked Draft Regulation," "Meeting with Consultant Z").
  *   **Fail State:** One analyst lists items the other has not seen or cannot verify.
  *   **Decision:**
      *   If the info *can* be shared: Share it immediately. Re-run Step 1.
      *   If the info *cannot* be shared (e.g., confidential contact): Go to Step 5 (Validation).
      *   If the lists are identical but numbers differ: Go to Step 4 (Interpretation).

  **Step 4: The Weighting Check (10 Minutes)**
  *   **Goal:** Test for Rationality/Processing (Do you read the same evidence differently?).
  *   **Question:** "Take the top piece of evidence on the shared list. Analyst A, how many percentage points did this move you? Analyst B, how many points did it move you?"
  *   **Sufficient Answer:** "This document moved me +10%." / "This document moved me +1%."
  *   **Fail State:** Massive divergence on impact (e.g., +10% vs +1%) on the same document.
  *   **Decision:** This is an **Interpretation Disagreement**. You cannot average this. Go to Step 6 (Escalation).

  **Step 5: The Unshareable Info Validation (5 Minutes)**
  *   **Goal:** Handle confidential sources without breaching confidentiality.
  *   **Question (to holder of private info):** "You cannot share the content. Can you certify the source's reliability rating in our vendor system? Can you state whether this info confirms or contradicts the public record?"
  *   **Sufficient Answer:** "Source is Tier 1 reliability. It contradicts the public record."
  *   **Fail State:** "I can't say anything else."
  *   **Decision:** If they cannot validate reliability or direction, the info is treated as **Non-Existent** for the model. Revert to public evidence only.

  **Step 6: Escalation and Recording (5 Minutes)**
  *   **Goal:** Assign ownership of the residual risk.
  *   **Trigger:** If Step 2 (Starting Assumptions) or Step 4 (Interpretation) failed.
  *   **Action:** The Chair does not pick a number. The Chair assigns the **Risk Owner** (usually the CRO or the Senior Underwriter).
  *   **Statement:** "The analysts agree on facts but disagree on interpretation. This is a risk appetite decision, not a forecasting error. [Name] will select the number."
  *   **Recording:** See below.

  **End of Procedure: The Evidence Log**
  Do not record just the final probability. Record the following for the next cycle:
  1.  **The Disagreement Type:** (Info Gap / Interpretation Split / Base Rate Mismatch).
  2.  **The Deciding Factor:** (e.g., "CRO opted for conservative read of leaked draft").
  3.  **The Private Info Flag:** (e.g., "Analyst B held unshareable intel; treated as public null for modeling").
  4.  **The Vendor Check:** (List of data vendors used by both. If identical, flag for "Independent Review" next quarter).

  ***

  ### Part 2: Running the Procedure on Your Cases

  #### Case 1: The Private Contact (30% vs. 60%)
  *   **The Setup:** Analyst A (30%) relies on public filings. Analyst B (60%) has a private contact at the regulator.
  *   **Step 1 (Anchor):** Numbers stated. Factors: A cites public delay trends; B cites "industry chatter."
  *   **Step 2 (Blank Slate):** Both agree historical clearance rate is 50%. *Pass.*
  *   **Step 3 (Evidence Inventory):** A lists public documents. B lists "Conversation with Regulator Official."
  *   **The Block:** B cannot put the conversation on the whiteboard.
  *   **Step 5 (Validation):** You ask B: "Can you rate the source?" B says: "Tier 1." You ask: "Does it contradict public info?" B says: "Yes, public info says delay, contact says speed."
  *   **Procedure Outcome:** The procedure identifies **Unpoolable Information**.
  *   **Does it help?** Yes. It prevents A from arguing against data they can't see. It forces B to stake their reputation on the source's reliability rating without breaching compliance.
  *   **The Decision:** The procedure dictates that if B cannot substantiate the *weight* of the info (Step 4 is impossible), the model must run on public info (A's 30%) **plus** a management overlay.
  *   **Escalation:** You tell the CRO: "The model says 30%. Analyst B has high-confidence unshareable intel suggesting 60%. The 30-point gap is 'Unverified Intelligence Risk.' Do you reserve for the 30% or the 60%?"
  *   **Result:** The CRO chooses the 60% for reserves but marks the 30% as the "Auditable Model Output." The discrepancy is recorded as a risk factor, not a math error.

  #### Case 2: The Interpretational Split (Same Facts, Different Read)
  *   **The Setup:** Both agree on facts, agree on base rates, but one sees a leaked draft as "Signal" (60%) and the other as "Noise" (30%).
  *   **Step 1 & 2:** Pass easily.
  *   **Step 3 (Evidence):** Identical lists.
  *   **Step 4 (Weighting):** Analyst A says draft moves probability +20%. Analyst B says draft moves probability 0%.
  *   **Procedure Outcome:** This is an **Interpretation Disagreement**. The procedure flags that Aumann's conditions (rational processing of common info) have failed.
  *   **The Hard Truth:** You asked if this is outside the theorem. **Yes.** If two rational agents with common priors and common information disagree, one is effectively irrational (processing error) or they are actually expressing different *utilities* (risk tolerance).
  *   **Who Picks?** The **Chief Risk Officer**.
  *   **Authority:** This is not a forecasting question; it is a **Risk Appetite** question. Treating the draft as "Signal" is a conservative posture. Treating it as "Noise" is an optimistic posture.
  *   **Procedure Instruction:** "Stop analysis. This is a policy choice. CRO, do we want to price for the possibility that this draft is real (Conservative) or price for the status quo (Optimistic)?"
  *   **Result:** CRO picks "Conservative." The number is 60%. The minutes record: "Disagreement on signal vs. noise. CRO elected conservative posture per Q3 Risk Appetite Statement."

  #### Case 3: The False Consensus (Agreement on Wrong Number)
  *   **The Setup:** Both analysts converge on 40%. Last year this happened, and they were both wrong because they used the same vendor data.
  *   **The Modification:** The standard procedure above detects *disagreement*. It does not inherently detect *shared blindness*. You need a "Pre-Step 0."
  *   **Step 0: Source Independence Check (5 Minutes)**
      *   **Question:** "List the primary data vendors or models used to generate your base rate."
      *   **Test:** If Analyst A and Analyst B cite the **same** vendor/model for >80% of their data, the procedure triggers a **Red Team Alert**.
      *   **Action:** The Chair assigns one analyst to spend the next 10 minutes arguing why the number is *wrong*, using only external/public data not from that vendor.
  *   **Procedure Outcome:** In your scenario, both cite "Vendor X." Alert Triggered.
  *   **The Exercise:** You force Analyst A to argue for 70% and Analyst B to argue for 10% using only regulatory press releases (no vendor reports).
  *   **Result:** They likely find that without Vendor X, the range widens significantly (e.g., 20% to 80%).
  *   **Decision:** The 40% consensus is rejected. The number handed to the committee is a range, or the average of the "Red Team" exercise, flagged as "High Model Risk."
  *   **Why this works:** It breaks the "Common Prior" illusion created by shared data feeds. It forces the analysts to realize their agreement was an artifact of the tool, not the truth.

  ***

  ### Part 3: Meta-Analysis of the Result

  You asked for the honest conclusion on what Aumann's Agreement Theorem actually buys you in a 90-minute insurance meeting.

  **1. Which conditions are doing real work?**
  *   **Information Pooling:** This is the only condition that matters practically. Most disagreements in your meetings are simply Analyst A knowing something Analyst B does not. The procedure forces this into the open. If you fix this, you solve 50% of your variance.
  *   **Rationality (Processing):** The requirement that analysts update their beliefs logically. In practice, this means checking if they are weighting evidence consistently (Step 4). This catches "pet theories" where an analyst loves a specific data point too much.

  **2. Which conditions are idealizations you can drop?**
  *   **The Common Prior:** You must drop this. Your analysts *do not* have the same starting beliefs. One is naturally optimistic; one is naturally conservative. The theorem assumes they don't. The procedure acknowledges they do, and treats persistent disagreement after info-pooling as a "Risk Appetite" issue rather than a "Math" issue.
  *   **Common Knowledge:** The theorem requires that I know that you know that I know. In your meeting, you only need *Shared Record*. If it is on the whiteboard, that is enough. You do not need infinite recursion of knowledge.

  **3. Can this procedure establish that a common starting point exists?**
  *   **No.** It can only detect when it *fails*.
  *   In Step 2 (Blank Slate), if they agree, you have *evidence* of a common prior, but not proof. They might still be biased in ways they don't see.
  *   However, if they *disagree* on the Blank Slate, you have *proof* that the Common Prior assumption is broken.
  *   **Practical Implication:** Never assume agreement means truth. Assume agreement means "shared bias" until Step 0 (Source Check) proves otherwise.

  **4. What the procedure cannot do:**
  *   **It cannot generate truth.** If the private contact in Case 1 is lying, the procedure will still record their info as "Tier 1" unless you have a way to verify it. It organizes error; it does not eliminate it.
  *   **It cannot force disclosure.** If compliance forbids sharing the info, the procedure stops at "Escalate." It does not solve the legal constraint.
  *   **It cannot fix bad incentives.** If analysts are rewarded for being "safe" (conservative) rather than "accurate," they will game Step 4 (Weighting) to always push probabilities higher. The procedure exposes the mechanic, but you must fix the compensation to fix the behavior.

  **5. The Honest Conclusion:**
  Aumann's Theorem tells you that **persistent disagreement is a signal of missing information or different goals.**
  In your meetings, you are treating disagreement as a problem to be averaged away. The procedure reframes disagreement as a **diagnostic tool**.
  *   If they disagree on **Info**: You have a data gap.
  *   If they disagree on **Weight**: You have a model risk.
  *   If they disagree on **Base Rate**: You have a culture/appetite mismatch.
  *   If they **Agree** on **Source**: You have a systemic blind spot.

  The theorem does not give you the right number. It gives you the right *question* to ask about the number you have. Use the procedure to find the question, not the answer.
