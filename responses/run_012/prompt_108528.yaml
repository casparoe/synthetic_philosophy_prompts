answer: |-
  Here is the specification list for a theory of Interpersonal Welfare Comparison (IWC). These are the functional requirements the theory must satisfy to be viable for your reading group's purposes.

  ### The Requirements List

  **1. Completeness (Non-Negotiable)**
  *   **The Spec:** For any two individuals $A$ and $B$ in any two states $x$ and $y$, the theory must output either $W(A,x) > W(B,y)$, $W(B,y) > W(A,x)$, or $W(A,x) = W(B,y)$. If it claims incomparability, it must provide a formal rule for when that verdict triggers, not just a shrug.
  *   **The Forcing Case:** Policy triage. If a hospital has one dose of medicine and two patients, a theory that says "these lives are incomparable" offers no guidance. To function as a decision tool, the metric must resolve ties.
  *   **Status:** **NN.** Without this, the theory is descriptive, not normative.

  **2. Cardinal Unit Comparability (Non-Negotiable)**
  *   **The Spec:** The measure must be cardinal (magnitude matters, not just rank) and unit-comparable (one unit of welfare for $A$ equals one unit for $B$). It cannot rely solely on ordinal preferences (e.g., "$A$ prefers $x$ to $y$").
  *   **The Forcing Case:** The Trade-off Problem. If $A$ gains a huge benefit at a small cost to $B$, an ordinal theory cannot sum the gain and loss. You need a common currency to weigh intensity across persons.
  *   **Status:** **NN.** This is the definition of IWC. If you drop this, you are doing Social Choice Theory, not Welfare Comparison.

  **3. Currency Specification (Non-Negotiable)**
  *   **The Spec:** The theory must explicitly define the *metric substance*. Is welfare hedonic (pleasure/pain), preferential (desire satisfaction), or objective (capabilities/functionings)?
  *   **The Forcing Case:** **(a) The Adapted Preferences Case.** The contented woman vs. the frustrated ambitious man. If the currency is *subjective satisfaction*, the woman wins. If the currency is *objective opportunity* or *informed desire*, the man might win. A theory cannot remain agnostic here; it determines the verdict.
  *   **Status:** **NN.** You cannot compare "how well off" people are without defining what "well off" consists of.

  **4. Non-Arbitrary Zero Point (Contested)**
  *   **The Spec:** The theory must identify a neutral baseline (zero welfare) that distinguishes lives worth living from lives not worth living (negative welfare).
  *   **The Forcing Case:** The Creation Problem. To decide if bringing a new person into existence is a benefit or a harm, you need to know if their life is above or below zero. A theory with only relative rankings (interval scale) cannot answer this.
  *   **Status:** **CT.** Utilitarians often demand this (ratio scale). Standard economists often reject it (interval scale), arguing zero is arbitrary.

  **5. Pareto Sensitivity / Monotonicity (Non-Negotiable)**
  *   **The Spec:** If $A$'s welfare increases and no one else's decreases, the total evaluation must improve. Conversely, a state where everyone is miserable cannot be rated "better" than a state where everyone is well-off, even if the miserable state is more equal.
  *   **The Forcing Case:** **(The Leveling Down Objection).** A theory that values equality for its own sake might imply that making the rich poor (without helping the poor) is an "improvement" in justice. Your spec requires the welfare measure itself to track *good*, not just *distribution*.
  *   **Status:** **NN.** Violating this makes the theory counter-intuitive for welfare assessment.

  **6. Temporal Aggregation Rule (Contested)**
  *   **The Spec:** The theory must specify how moments sum to a life. Is $W(Life) = \sum W(t)$? Or does the *sequence* matter (e.g., redemption narratives, peak-end rules)?
  *   **The Forcing Case:** **(b) The Shape of Life Case.** A slow rise to happiness vs. a long decline from happiness. A simple sum treats these as identical. A narrative theory treats the decline as worse. The theory must declare if time has a direction or weight.
  *   **Status:** **CT.** Classical Utilitarianism says sum only (Time Neutrality). Psychological and Narrative views say shape matters.

  **7. Impartiality / Anonymity (Non-Negotiable)**
  *   **The Spec:** The identity of the person does not affect the weight of their welfare. $W(A, x)$ is measured by the same function as $W(B, x)$.
  *   **The Forcing Case:** Discrimination. If the theory weights the welfare of men higher than women by definition, it is a theory of hierarchy, not welfare.
  *   **Status:** **NN.** Required for moral universality.

  ***

  ### Analysis of Constraints

  #### The Single Most Restrictive Requirement
  **Cardinal Unit Comparability (Req 2).**

  This is the filter that rules out the majority of mainstream social science and a significant chunk of philosophy.
  *   **Economics:** Standard microeconomics assumes ordinal preferences are all we can observe or trust. Req 2 forces you into the controversial territory of "utils" or neuroscientific hedonic calibrations.
  *   **Philosophy:** It rules out Rawlsian primary goods (which are indices, not cardinal utilities) and many capabilities approaches that resist reducing functionings to a single number.
  *   **Why it hurts:** It demands a metaphysical commitment that "a unit of pain for you is the same size as a unit of pain for me." Proving this is the hard problem of IWC.

  #### The Jointly Unsatisfiable Pair
  **Currency Specification (Subjective) + Non-Arbitrary Zero Point.**

  You cannot consistently hold that welfare is defined entirely by **Subjective Preference Satisfaction** (Req 3 option) and that there is a **Non-Arbitrary Zero Point** (Req 4).

  *   **The Conflict:** If welfare is just satisfying whatever preferences a person happens to have, there is no natural zero. A person can always have *more* unsatisfied preferences (negative) or *more* satisfied ones (positive), but the baseline is shifting. To establish a "life not worth living" (zero), you must impose an *objective* standard of which preferences *ought* to be satisfied or what minimum functioning is required.
  *   **The Consequence:** If you insist on a Zero Point (to handle population ethics or severe suffering), you are forced to abandon pure Subjectivism in your Currency Specification. You must adopt an Objective List or Hybrid view. If you insist on pure Subjectivism, you must abandon the Zero Point and accept an interval scale (where zero is arbitrary). You cannot have both.

  *(Note: There is also a tension between **Completeness** and **Respect for Incommensurability**, but that is a philosophical stance rather than a formal impossibility. The Zero/Subjectivism clash is structural.)*
