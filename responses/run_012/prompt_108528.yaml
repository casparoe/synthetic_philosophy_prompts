prompt: |-
  I'm putting together a doc for a reading group on how to compare how well off two different people are, and I want the spec nailed down first — before we argue about any particular measure, what does a theory of interpersonal welfare comparison actually have to deliver? Give me the requirements list, each one with the case or consideration that forces it, and flag which are non-negotiable and which are just one camp's taste.

  Some I already think belong: it has to rank any two lives, or at least be explicit about when it refuses to; it can't just be ordinal within each person, since the whole point is comparing across them; it has to say something about the baseline — is a life of unremitting pain below zero, and relative to what?; and it has to survive the leveling-down move, i.e. a comparison can't tell us we've improved things by making everyone equally miserable. Add whatever I'm missing.

  Two cases I specifically want it to handle: (a) a woman raised to want very little, who is genuinely content, versus a man with expensive and mostly frustrated ambitions — who's better off, and is the theory obliged to answer at all? (b) two lives with the same total welfare but opposite shapes, a slow rise versus a long decline — does shape have to matter, and can a measure that's just a sum over moments even see it?

  Then tell me which single requirement does the most to rule out the popular proposals, and whether any pair of the requirements is jointly unsatisfiable — taht's the part I most want to see. Skip the reading list, I just want the criteria.
