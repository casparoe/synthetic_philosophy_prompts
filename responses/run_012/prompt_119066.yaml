  8.  **Drafting the Response:** (Mental Outline)
      *   **Hook:** The theorem is a mirror, the movie is the flesh.
      *   **Assumption 1: Common Priors.** #10 breaks it. #8 suspends it.
      *   **Assumption 2: Common Knowledge.** Votes aren't credences. The discussion *makes* them common knowledge.
      *   **Juror #8:** He's not a holdout; he's a protocol enforcer.
      *   **Vote vs. Credence:** The threshold problem.
