      *   *Address Prior Sensitivity?* Yes, Tier 1.
      *   *Address Incentives?* Yes, Tier 2.
      *   *Address Predictions?* Yes, Tier 3.
      *   *Address Insulation?* Yes, Tier 4.
      *   *Address Inference/Measurement split?* Yes, Tier 2/3.
      *   *Tone:* Respectful, rigorous, "lab happy hour" appropriate.

  7.  **Final Polish:** Ensure the distinction between *Bayesian Inference* (updating beliefs) and *Bayesian Modeling* (specifying generative processes) is clear, as the user conflates them slightly in the context of replication. (Actually, the user says "Bayesian model comparison," so they are aware. I need to press on the *model* part of that).

      *Wait, one more thing:* The user is a comp modeler. They know that models are wrong. I need to emphasize that Bayes tells you which *wrong* model is best, not which is *true*. Replication requires truth (or at least stability), not just relative model fit.

      *Okay, let's structure the response.*
      1.  Intro: Validate the position, state the goal.
