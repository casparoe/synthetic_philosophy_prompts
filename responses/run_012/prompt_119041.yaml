      *   *Category 3: The Inference/Measurement Distinction (The "Category Error" challenge).*
          *   Argument: Inference *depends* on measurement. If the construct is invalid, the model is garbage-in-garbage-out. You can't separate them cleanly.
          *   Evidence: Computational psychiatry/neuroscience often has beautiful models fitted to noisy/invalid tasks.
          *   *Rank:* Medium-High. Challenges the "residual failures" claim.

      *   *Category 4: Empirical Predictions (The "Show Me" challenge).*
          *   Argument: Check subfields that use Bayes (e.g., cognitive modeling, some neuro). Do they replicate better?
