  I spent 35 years in a physics department, most of it doing neutron scattering on oxides, and I retired four years ago; since then I've been reading philosophy the way I used to read journals, which is to say obsessively and with a lot of muttering. Last month at dinner a philosopher friend of mine, whos teaches at the local university, got me going about that old essay of Wigner's on how unreasonably well mathematics fits physics — the puzzle that a subject we develop for its own internal reasons keeps turning out to be exactly the tool the next branch of physics needs. I've been on the deflationary side of this my whole career without ever having to say why. My gut says it's a selection effect plus hindsight: we remember Riemannian geometry landing on general relativity and forget the thousands of formalisms that never found a home; we retrofit the mathematics onto the physics after the fact and then admire the fit; and mathematics is the study of all possible structures, so it would be a miracle if the actual world turned out not to be one of them. My friend says that can't be the whole story, because the successes are too specific and too predictive — you can't get novel numerical predictions out of a coincidence — and because no selection story explains why the same handful of structures keeps turning up in domains that are completely seperate from each other.

