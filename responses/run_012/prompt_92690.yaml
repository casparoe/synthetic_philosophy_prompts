prompt: |-
  You're a formal epistemologist — someone who works on the norms of belief and acceptance and knows the lottery/preface literature cold, but is also willing to say when a "requirement" everyone repeats is really just a prejudice of one camp. I'm putting together a unit on the lottery and the preface, and before I teach any of the proposed fixes I want the spec: what does an adequate theory of rational acceptance actually have to deliver?

  Set the purpose first so the criteria are anchored: I care about acceptance in the sense of "this is something I'm entitled to take as a premise in my reasoning and deliberation," for a bounded agent, not idealized omniscience. Then give me the desiderata list, and think it through slowly before you write — maybe brainstorm the cases first, then organize.

  For each requirement I want the case or consideration behind it. So: the cases it has to get right (the lottery, the preface, the humdrum case where I obviously do reason from premises I'm not certain of, the case where a lot of independently near-certain claims get conjoined), the distinctions it can't collapse (accepting p vs. having high credence in p vs. accepting that p is probable; accepting vs. acting; what's rational to accept vs. what's rational to assert), and the constraints it can't violate (deductive closure, consistency of what's accepted, whatever probabilistic coherence you think binds it, fallibilism — the thought that you can accept something while granting you might be wrong). Say for each whether it's non-negotiable or just a house preference, and which single requirement does the most work at ruling candidates out.

  The part I most want: flag any subset that looks jointly unsatisfiable. My suspicion is that a high-probability threshold plus closure plus consistency is a genuine trilemma and that everything else is commentary, but tell me if that's the wrong way to carve it, and what the cheapest thing to give up is. If the list turns out to be inconsistent, then the list is the result and I'd rather know that now.

  No citations or reading lists please, I can't get online — just the criteria. And skip scoring the existing theories against it; I'll do that live in class.
