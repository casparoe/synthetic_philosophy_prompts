      *   *Re-evaluating the Movers:* Legal precedent is the biggest mover for a reporter. If courts treat CDSS failure as malpractice (omission) vs. product liability (defect), that shifts the "sense" of cause.

  8.  **Final Polish:** Check constraints. One-line justifications. Specific probabilities. Clear distinction on the disagreement.

