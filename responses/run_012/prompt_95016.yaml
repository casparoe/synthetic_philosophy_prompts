          5.  The Movers (What changes the credence).

      *   *Refining the Logic:*
          *   Wait, the vendor's defense is weird: "not-pinging was the whole point." But the prompt says it was "silently broken." I need to address this tension. If it was broken, the vendor is lying/spinning. If it wasn't broken, the norm is different. I will assume for the causal analysis that it *failed to perform its function* (detect sepsis), regardless of the "human in the loop" defense. The function is *watching*.
