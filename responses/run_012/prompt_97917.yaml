answer: |-
  The foundry office smelled of ozone and old grease. Outside, the furnace hummed, a low vibration that traveled up through the soles of Elena's shoes and settled in her teeth. On the desk between her and the two men lay the authorization form, a single sheet of paper that would allow the town to melt down the Soldier.

  Arthur Penhaligon sat with his hands folded over a leather portfolio. He was the great-grandson of the man who had paid for the bronze in 1921. He looked like he hadn't slept in a week. Across from him, Silas Groot, the foundry foreman, leaned back in a chair that groaned under his weight, picking at a callus on his thumb.

  Elena held the pen. "The legal opinion says the bequest is to the town in perpetuity," she said. "It doesn't specify the material composition."

  "It specifies the *Statue*," Arthur said. His voice was quiet, but it cut through the furnace hum. "Capital S. My grandfather didn't donate two tons of alloy. He donated a memorial. The metal is just the skin."

  "The metal is the thing," Silas said. He didn't look up from his thumb. "You melt it, you pour it, you put the shape back. It's the same bronze. It's been in this town for a hundred years. It isn't going anywhere."

  "If I melt a wedding ring," Arthur said, turning to Silas, "and make a spoon, do you tell the wife it's the same jewelry?"

  "A ring is a shape," Silas said. "A spoon is a shape. The gold is the truth. You're worshipping the shadow."

  Elena looked at the form. The centenary was in three months. The current statue was pitted, green with corrosion, the face of the soldier blurred by decades of acid rain and the clumsy welds of 1948. The council wanted it shining. The town wanted it whole. But if Arthur was right, if the will was binding on the *object* and not the *stuff*, then melting it was a breach of contract. It was destruction of property. If the Statue ceased to exist, the land it stood on might revert to the Penhaligon estate. The town square would become private property.

  "Silas," Elena said. "If you put this bronze in the crucible... what comes out?"

  "Liquid metal," Silas said.

  "And then?"

  "A new casting."

  "Is it the Soldier?"

  Silas shrugged. "It's a soldier. It looks like him. It's made of him. You're asking me to count ghosts, Mayor. There isn't one thing there. There's the bronze. There's the patina. There's the 1948 patch on the left knee. There's the shape of the rifle. There's the idea of the boy who posed for it. You want me to tell you which one of those dies in the fire? They all stop. They all start again."

  Arthur stiffened. "That's evasive."

  "It's honest," Silas said. "You say there's a Statue. I say there's a lump arranged soldier-wise. You say melting it kills the Statue. I say you're just rearranging the lump. You're arguing about where to draw the line on a map that doesn't exist."

  "The line exists in the will," Arthur snapped. "It exists in the memory of the families who lost sons. That object witnessed the vigil in '45. It was shot at in '44. It has a history. The liquid in your pot won't have that history. A copy doesn't inherit the scars."

  "The scars are damage," Silas said. "You want us to keep the damage?"

  "I want you to keep the *identity*," Arthur said. He turned to Elena. "Mayor, you know what this is. It's the Ship of Theseus, but worse. At least with the ship, you replace the planks one by one. This is execution. You take the life out of the body to put it in a clone. The town gets a replica. We get a breach of trust."

  Elena looked out the window. Through the grime, she could see the Soldier standing on his plinth in the yard, waiting. He was dull, ugly, compromised by the patch on his knee that looked like a scar of a different color. But he was there. He had been there when the town boomed, and there when the mines closed.

  "Silas," Elena said. "If I sign this, and we melt it... and we pour a new one. Is the town lying when we say 'This is the 1921 Memorial'?"

  Silas finally looked up. His eyes were tired. "If you say the *metal* is the memorial, you're telling the truth. If you say the *moment* is the memorial, you're lying. But look, Mayor. You want me to tell you there are two things standing in that yard? A lump and a statue? Occupying the same space? That's not how physics works. There's only one thing there. The rest is just how you look at it."

  "There are two things," Arthur said. "One can survive a squash hammer. The other cannot. That proves they are different."

  "Proves what?" Silas stood up, walking to the window. He tapped the glass. "Proves you have different words for different possibilities. Doesn't mean there are two bodies in the yard. It means you're confused about what 'thing' means."

  Elena looked at the pen. She thought about the land. If the Statue died, the town lost the square. If the Statue lived, the town kept its heart, even if the heart was transplanted.

  "Arthur," Elena said. "If we don't melt it, the corrosion continues. In ten years, the rifle hand falls off. In twenty, the face is gone. Is the Statue alive then?"

  "We preserve it," Arthur said. "We conserve. We do not destroy."

  "Conservation is just slowing down the melting," Silas muttered.

  Elena capped the pen. She uncapped it. The metaphysical weight of the action pressed on her wrist. If she signed, she was asserting that the Lump is the primary object, and the Statue is merely a temporary state of that Lump. If she refused, she was asserting that the Statue is a distinct entity whose life conditions prohibit melting.

  She couldn't prove either. She could only choose.

  "The town needs the square," Elena said. Her voice sounded flat in the small room. "And the town needs a soldier that looks like a soldier, not a green stump."

  "That's pragmatic," Arthur said, his voice tightening. "It isn't right."

  "It's what I can defend," Elena said. She looked at Silas. "You'll keep a portion of the original alloy? Unmelted?"

  Silas nodded. "We can leave the base. The plinth holds the weight. We cut the ankles. Keep the legs in the ground."

  "Arthur," Elena said. "The metal doesn't leave the town. The shape is restored. The continuity of the site is maintained. I am signing this on the condition that the foundry certifies the material composition is identical."

  Arthur stood up. He looked at the form, then at Elena. He didn't look at Silas. "You're killing him," he said. "You're just telling yourself it's anesthesia."

  "I'm keeping the square," Elena said.

  She signed.

  Arthur took his portfolio and walked out without shaking hands. The door clicked shut. The furnace hum seemed to get louder.

  Silas watched her. "You know he's going to sue."

  "I know."

  "You know I was right, though," Silas said. "There wasn't one thing to kill. There was just... stuff."

  Elena looked out the window again. The Soldier stood in the dark. For a moment, she thought she saw two of them, overlapping perfectly. One was a rigid shape that could break. The other was a fluid mass that could flow. They occupied the same space, but they wanted different futures.

  "Maybe," Elena said. "But tomorrow, only one of them is going to stand on that plinth. And I have to tell the town which one it is."

  Silas picked up the form. "I'll get the crucible ready."

  He left her alone in the office. Elena looked at her signature. It was ink on paper. It felt flimsy compared to the bronze outside. She had decided that the metal was the substance and the shape was the accident. She had decided that survival was a matter of atoms, not history.

  Outside, the furnace roared, ready to eat the soldier. Elena wondered if, when the metal poured, it would scream. She supposed that depended on whether you believed there was anyone home to do the screaming.

  ***

  **Author's Note on the Philosophy**

  This story leans heavily on the **Constitution View** (represented by Arthur) versus a mix of **Monism** and **Ontological Nihilism** (represented by Silas). In standard metaphysics, the Constitution View holds that the statue and the lump are distinct objects that coincide spatially and materially but differ in their modal properties (what *could* happen to them). Arthur argues this distinction: the lump survives melting; the statue does not. Silas, however, argues that counting "two objects" is a linguistic error, suggesting either that only the matter exists (Monism) or that object boundaries are arbitrary (a form of Nihilism or Universalism).

  The story takes liberties in two main areas. First, the legal framing implies that metaphysical identity directly dictates legal ownership. In reality, property law rarely hinges on strict metaphysical persistence conditions; courts usually rely on functional continuity or intent rather than whether the "statue" is distinct from the "lump." Second, Silas's view that "there was never one object" is a somewhat caricatured version of eliminativism. Most philosophers who deny the distinction between statue and lump argue for identity (there is one object), not that there are *no* objects or an infinite number of overlapping ones. The story uses this ambiguity to heighten the conflict, forcing the Mayor to enact an ontology through policy rather than resolving the metaphysical truth. The decision to melt the statue treats the lump as the primary substance, effectively ruling in favor of the Monist view by fiat.
