prompt: |-
  so i've been sketching out a proposal for overseeing models we can't fully check, and the whole thing rests on one trick: instead of trying to verify an answer directly, you have two models argue opposite sides of a question in front of a judge who is much weaker than either of them (a human, or a small model), and you go with whichever answer survives the arguement. the hope is that the truthful side can always answer any challenge, so a dumb judge can supervise a much smarter model.

  before i write it up i want the spec, not the sales pitch. what does a setup like that actually have to deliver to be worth anything? i mean things like: what has to be true of the judge, of the two arguers, of how they're paid, of the questions you're allowed to put to them, for the verdict to track the truth even though nobody in the room can check the claim themselves. give me the requirements list with the scenario behind each one -- the case that forces it -- and mark which are non-negotiable and which are just preferences of one particular design.

  the thing that keeps nagging me: a liar can state a claim that's cheap to say and expensive to check -- a big tangle of steps you'd have to verify one at a time -- so the honest side either runs out of budget, or the judge gives up and goes with whoever sounded more confident. is that fatal or is it just another constraint? also, in the version i actually want to build, the two arguers are the same model with different prompts, and the judge is a smaller model that gets fine-tuned on the verdicts later. does that break anything on the list?

  and if some pair of the requirements you hand me can't be had at the same time, say so plainly -- thats the part i care about most. don't bother naming papers or people, i don't need a reading list, i need the criteria.
reasoning: |-
