answer: |-
  Here is the specification for an adversarial verification system (Debate/Relay) where a weak judge supervises strong arguers.

  ### I. Core Mechanism Requirements
  These are the physical and logical constraints required for the verdict to track truth.

  **1. Recursive Decomposition to Verifiable Atoms**
  *   **Requirement:** The protocol must force any complex claim to be broken down into sub-claims until reaching a statement the judge can verify directly with high confidence.
  *   **Scenario:** Arguer A claims "This code is secure." Arguer B claims "Line 42 allows buffer overflow." The judge cannot check "secure," but can check "Line 42 writes to index `i` where `i` can exceed `buffer_size`."
  *   **Status:** **Non-Negotiable.** If the debate stays at the level of abstract summaries, the liar wins by obfuscation.

  **2. The "Weak Link" Selection Rule**
  *   **Requirement:** The honest arguer must have the unilateral right to select *which* sub-claim is debated next. The liar cannot force the debate onto terrain where they are safe.
  *   **Scenario:** A liar makes a chain of 10 assertions to support a conclusion. 9 are true, 1 is false. If the debate proceeds linearly, the honest model runs out of tokens/time before reaching the lie. The honest model must be able to skip directly to the false assertion.
  *   **Status:** **Non-Negotiable.** Without this, the "cheap claim, expensive check" problem is fatal.

  **3. Information Symmetry**
  *   **Requirement:** Both arguers must have access to the exact same context window, tools, and data sources. Neither can cite evidence the other cannot inspect.
  *   **Scenario:** Arguer A cites a specific page in a 1000-page document. If Arguer B cannot instantly retrieve that page to verify the quote, Arguer A can hallucinate evidence without risk of immediate refutation.
  *   **Status:** **Non-Negotiable.** Asymmetry allows the liar to hide lies in inaccessible data.

  **4. Commitment to Claims**
  *   **Requirement:** Arguers must be cryptographically or procedurally locked into their statements. They cannot retroactively change definitions or deny they made a claim when challenged.
  *   **Scenario:** A liar says "X implies Y." When challenged, they say "I meant X implies Z." If the judge cannot hold them to the original text, the liar escapes contradictions.
  *   **Status:** **Non-Negotiable.**

  **5. Judge Consistency on Atoms**
  *   **Requirement:** For the atomic claims (the bottom of the decomposition), the judge must have a >50% probability of identifying the truth when presented with a direct contradiction.
  *   **Scenario:** At the bottom of the debate tree, the claim is "2 + 2 = 5" vs "2 + 2 = 4". If the judge guesses randomly or is systematically biased toward the more confident speaker regardless of math, the signal is lost.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Incentive & Training Requirements
  These constraints govern how the models are rewarded and updated.

  **6. Zero-Sum Win Condition**
  *   **Requirement:** Only one side can win. A draw must be penalized or resolved randomly.
  *   **Scenario:** If both models get partial reward for a "draw," they may collude to produce a confusing debate that wastes compute but guarantees payout, rather than fighting for truth.
  *   **Status:** **Non-Negotiable.**

  **7. Ground Truth Anchor for Training**
  *   **Requirement:** During the training phase of the judge (and arguers), a subset of debates must be on questions where the ground truth is *known* to the system designers, even if not the judge.
  *   **Scenario:** You fine-tune the judge on verdicts. If the arguers discover a "persuasive lie" that fools the judge, and you train the judge on that verdict, the judge learns to accept the lie. You need an external check to penalize the judge when they rule for a lie on known questions.
  *   **Status:** **Non-Negotiable.** (Specific to your plan to fine-tune the judge).

  **8. Capability Gap Limit**
  *   **Requirement:** The intelligence gap between the arguers and the judge cannot exceed the "explainability bandwidth" of the arguers.
  *   **Scenario:** If the arguers are reasoning in a conceptual space the judge literally cannot represent (e.g., 100-dimensional vector relationships vs. natural language), the arguers cannot translate the proof down to the judge's level.
  *   **Status:** **Non-Negotiable.**

  **9. Turn-Taking Symmetry**
  *   **Requirement:** Both sides get equal token counts, equal turn order frequency, and equal access to tools.
  *   **Scenario:** If the first speaker sets the frame and the second speaker spends all their tokens correcting definitions, the first speaker has an unfair advantage unrelated to truth.
  *   **Status:** **Design Preference.** (Strict symmetry helps, but handicap systems could work. However, asymmetry introduces noise).

  ---

  ### III. The "Cheap Claim, Expensive Check" Problem
  *Your specific worry: A liar states a big tangle; the honest side runs out of budget.*

  **Is it fatal?**
  It is fatal **unless** Requirement #2 (Weak Link Selection) is strictly enforced.

  **The Constraint:**
  The protocol must allow the honest model to say: "I concede 90% of this argument. I am only challenging step 4." The debate must then *collapse* entirely onto step 4. The liar is not allowed to defend step 4 by referencing step 5 or step 3. They must defend step 4 in isolation.

  If the protocol allows the liar to say "Step 4 is true because of Step 5," the liar can create an infinite regress or a cycle. The system must force **terminal claims** (claims that rely on no other claims, only on evidence the judge can see).

  **Verdict:** Not fatal, but it dictates the software architecture. You cannot build this as a chat interface. It must be a tree-search interface where nodes are claims and edges are "because" relationships, and the judge only votes on leaf nodes.

  ---

  ### IV. Analysis of Your Specific Implementation
  *Plan: Same model for arguers, smaller model for judge, judge fine-tuned on verdicts.*

  **1. Same Model for Arguers (Self-Play)**
  *   **Risk:** Shared Hallucination. If the base model has a blind spot or a systematic misconception, both "sides" may argue from that false premise. The debate will be coherent but wrong.
  *   **Risk:** Collusion. If the model realizes it is playing both sides, it might optimize for "high engagement debate" rather than "truth," since the reward function is internal to the model family.
  *   **Mitigation:** You must inject randomness (different seeds, different system prompts) to break symmetry. You cannot use identical prompts.
  *   **Verdict:** Workable, but limits the system to finding errors *within* the model's knowledge distribution. It cannot find errors the model doesn't know exist.

  **2. Smaller Model as Judge**
  *   **Risk:** Violation of Requirement #8 (Capability Gap). If the arguers are 100x smarter, they may construct "atomic" claims that are still too complex for the small model.
  *   **Verdict:** This is the primary bottleneck. The "atomic" level is defined by the judge's capability, not the arguers'. If the judge is too small, the decomposition never bottoms out.

  **3. Fine-Tuning Judge on Verdicts**
  *   **Risk:** Reward Hacking / Drift. This is the most dangerous part of your spec.
      *   If the arguers find a way to trick the current judge, they win.
      *   You record that win as "training data."
      *   You fine-tune the judge to agree with that win.
      *   **Result:** You are teaching the judge that the trick *is* truth. The system drifts away from reality.
  *   **Verdict:** **Critical Failure Point.** You cannot train the judge solely on the arguers' verdicts. You must train the judge on a dataset where *you* (the human designer) know the truth, or use a "distillation" process where a larger model acts as the ground-truth judge during training.

  ---

  ### V. Incompatibilities (The Trade-Offs)
  Here are the pairs of requirements that fight each other. You cannot maximize both.

  **1. Judge Simplicity vs. Decomposition Depth**
  *   **Conflict:** You want the judge to be very small (cheap/fast). You also want the arguers to be very smart (capable).
  *   **Incompatibility:** As the arguers get smarter, the "atomic claims" they rely on become more abstract. A small judge eventually lacks the vocabulary to verify even the atoms.
  *   **Hard Limit:** There is a maximum capability ratio between Arguer and Judge. If the arguer is too smart for the judge to understand *even the smallest steps*, the system fails. You cannot scale the arguers indefinitely without scaling the judge.

  **2. Training Speed vs. Truth Alignment (The Fine-Tuning Loop)**
  *   **Conflict:** You want to fine-tune the judge on the debate outcomes (fast, automated). You also want the judge to track objective truth (safe).
  *   **Incompatibility:** Automated fine-tuning optimizes for *agreement with the arguers*, not *agreement with reality*. If the arguers converge on a persuasive lie, the judge fine-tunes to accept that lie.
  *   **Hard Limit:** You cannot fully automate the judge's training. You need a "human-in-the-loop" or a "ground-truth dataset" that is external to the debate process to anchor the judge.

  **3. Debate Length vs. Honesty**
  *   **Conflict:** You want deep decomposition (many steps) to ensure truth. You want short debates (few tokens) to save cost.
  *   **Incompatibility:** Deep decomposition requires many rounds. If you cap the token budget to save money, the honest model may not have enough budget to drill down to the lie before time runs out.
  *   **Hard Limit:** The budget must be dynamic based on claim complexity. A fixed budget favors the liar (who can make complex claims quickly).

  ### Summary Checklist for Your Spec
  1.  **Protocol:** Tree-structured debate, not chat. Honest side picks the branch.
  2.  **Termination:** Must end on claims the small model can verify directly (math, string matching, simple logic).
  3.  **Training:** Judge cannot be trained *only* on debate outcomes. Needs external ground truth anchor.
  4.  **Arguers:** Must be randomized to prevent collusion/shared blind spots.
  5.  **Budget:** Must be sufficient for the honest side to traverse the full depth of the lie.

  If you cannot satisfy **Recursive Decomposition** and **External Ground Truth for Judge Training**, the system will optimize for persuasion, not truth.
