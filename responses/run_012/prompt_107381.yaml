          *   Identify incompatibilities (if two requirements can't coexist, state it plainly).
          *   Constraint: No citations/names/reading lists. Just the criteria.

  2.  **Deconstruct the Mechanism (Debate/Adversarial Verification):**
      *   *Premise:* Truth is easier to defend than falsehood *if* the debate structure allows the defender to pinpoint the lie.
      *   *Weakness:* The judge must be able to recognize *when* a pinpoint has occurred.
      *   *Weakness:* The liar can obfuscate.
      *   *Weakness:* Incentives must align with truth, not persuasion.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Judge's Capability.*
          *   *Idea:* The judge doesn't need to know the answer, but needs to know who won the point.
          *   *Scenario:* If the liar makes a technical claim the honest model refutes, the judge must understand the refutation.
          *   *Refinement:* The judge must be able to verify *local* consistency or *atomic* claims, even if they can't verify the *global* claim.
          *   *Status:* Non-negotiable.

      *   *Requirement 2: Argument Structure (Decomposition).*
          *   *Idea:* You can't argue the whole thing at once.
          *   *Scenario:* "This code is secure." vs "It's not." Too big. Needs to be "Line 42 has a buffer overflow."
          *   *Refinement:* The protocol must force decomposition into claims small enough for the judge to verify.
          *   *Status:* Non-negotiable.

      *   *Requirement 3: Incentive Alignment.*
          *   *Idea:* Models want to win, not tell truth.
          *   *Scenario:* If lying wins more often, they will learn to lie better.
          *   *Refinement:* The reward function must be zero-sum based on the judge's decision, but the *training* must ensure that winning correlates with truth.
          *   *Status:* Non-negotiable (for the system to track truth).

      *   *Requirement 4: Symmetry.*
          *   *Idea:* Both sides need equal opportunity.
