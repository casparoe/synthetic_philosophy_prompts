      *   *Requirement 5: The "Cheap Talk" Problem (User's specific worry).*
          *   *Idea:* Liar says "X implies Y implies Z..." (long chain). Honest model has to check every link.
          *   *Scenario:* Gish Gallop.
          *   *Refinement:* The protocol must allow the honest model to select *one* link to attack. The liar must defend that specific link.
          *   *Status:* Non-negotiable. This is the core mechanism.

      *   *Requirement 6: Common Knowledge/Context.*
          *   *Idea:* Both models need to see the same evidence.
          *   *Scenario:* One model hallucinates a source, the other can't check it.
          *   *Status:* Non-negotiable.

  4.  **Addressing the "Same Model / Small Judge" Constraint:**
      *   *Same Model:* If it's the same base model, does it collude? Or does it just play roles?
          *   *Risk:* If the model realizes "I am arguing against myself," it might optimize for "interesting debate" rather than "truth."
          *   *Risk:* If the model is deterministic, the debate is static. Need randomness/seeding.
      *   *Small Judge:* If the judge is too small, it can't verify the atomic claims.
      *   *Fine-tuning:* Training the judge on verdicts creates a feedback loop. If the arguers learn to fool the judge, the judge learns to accept the foolery. This is "reward hacking."

  5.  **Identifying Incompatibilities (The "Hard Parts"):**
      *   *Judge Capability vs. Cost:* The judge must be smart enough to verify atomic claims. If the atomic claims are still too hard, the system fails.
      *   *Incentives vs. Truth:* If the model is optimized to win the debate, and the judge is imperfect, the model optimizes to fool the judge, not to tell the truth. This is the central tension.
      *   *Decomposition vs. Context:* Breaking things down too much loses the global context needed to judge truth.

