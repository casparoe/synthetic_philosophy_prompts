answer: |-
  ### Setting the stakes

  **1.** You've called the moral shudder people feel at telling the truth to the murderer a "failure of nerve." That's a strong charge. It implies that saving an innocent life at the cost of a lie isn't just wrong, but cowardly. If you're right, what specific capacity of the murderer are you protecting that outweighs the victim's physical survival?

  *   **Anticipated Answer:** She will argue that lying treats the murderer as a mere tool, undermining his rational agency (Formula of Humanity).
  *   **Follow-up:** But if his agency is currently directed toward extinguishing another's agency, why does respecting his capacity to choose trump protecting the victim's capacity to exist?

  **2.** Suppose you conceded this point. Suppose you said, "Okay, lying is permissible when the interlocutor has declared war on the moral law." What collapses in your broader ethical system if you make that exception? Is it just this case, or does the whole architecture fall?

  *   **Anticipated Answer:** She will claim it destroys the categorical nature of the imperative, making duty contingent on consequences.
  *   **Follow-up:** So the risk isn't that we lie to murderers, but that we start calculating the *cost* of truth-telling in other, less dramatic contexts?

  ### Silence and the misleading truth

  **3.** Most hardline Kantians allow you to stay silent. You can shut the door. You can say, "I will not answer." If silence is permissible, isn't the murderer going to infer the victim is inside anyway? What makes withholding the truth morally distinct from speaking a falsehood if the outcome is identical?

  *   **Anticipated Answer:** She will distinguish between *not providing information* and *providing false information*; one is a refusal, the other an assertion.
  *   **Follow-up:** But if you know he will draw the false inference from your silence, aren't you intentionally causing him to believe a falsehood, just without the speech act?

  **4.** A friend of mine staffs a domestic-violence hotline. She's trained to say, "He isn't here right now," when the abuser calls and the victim is hiding in the closet. It's technically true—he isn't *here* in the room with her—but it's designed to mislead. Do you grade that practice as permissible?

  *   **Anticipated Answer:** She will likely accept this as permissible because the statement itself is true.
  *   **Follow-up:** Then isn't your prohibition actually about linguistic accuracy rather than deception? If the intent to deceive is the same, why does the truth-value of the sentence carry the moral weight?

  **5.** If you allow silence and misleading truths, but ban lies, doesn't the rigorism lose its teeth? It seems you're protecting the *words* we use, not the *trust* we rely on. Is your position really that we must keep our vocabulary pure, even if the world burns?

  *   **Anticipated Answer:** She will argue that language is the only medium we fully control; consequences are up to the world.
  *   **Follow-up:** But if the medium is preserved while the message is corrupted, haven't you kept the shell of honesty while abandoning its function?

  ### My practice-of-truth challenge

  **6.** I want to propose a different framing. Suppose the duty of truthfulness isn't owed to the *hearer*, but to the *practice* of asking and telling—a shared public instrument. If that's right, the murderer's "right to the truth" drops out. The question becomes: does lying to him degrade the instrument everyone relies on, including the victim? Why do you reject this institutional view in favor of a dyadic one?

  *   **Anticipated Answer:** She will argue that duties are always between rational agents; you can't owe a duty to an abstract "practice."
  *   **Follow-up:** But if the practice is what enables rational agency in the first place, isn't protecting the practice from abuse (by murderers) a higher duty to rational agency than accommodating this specific agent?

  **7.** On my view, the murderer is effectively hacking the protocol of communication. If I lie to him, I'm not degrading the practice; I'm patching a vulnerability so the practice remains safe for everyone else. If the damage is to the public good, why does the identity of the hearer matter at all?

  *   **Anticipated Answer:** She will say that lying corrupts *your own* will, regardless of the hearer's identity.
  *   **Follow-up:** So the damage is entirely internal to you? Then why does Kant worry about the "harm to humanity" in the essay? Is the scandal purely about your own soul?

  ### Who's on the hook for the murder

  **8.** Kant claims that if you tell the truth, you aren't answerable for the murder, but if you lie and the murderer finds the victim anyway, you are. That asymmetry strikes many as a legalistic patch rather than a theory of responsibility. How do you defend the claim that my truthful speech is causally neutral, but my lie makes me a co-author of the crime?

  *   **Anticipated Answer:** She will argue that the murderer's act is free and unforeseeable in the truth-case, but in the lie-case, you've inserted yourself into the causal chain.
  *   **Follow-up:** But the murderer's intent is fixed in both scenarios. How does my speech change his moral status from "sole author" to "my accomplice" in one case but not the other?

  **9.** There's a reading where *On a Supposed Right to Lie* is about *Right* (law/coercion), not *Ethics* (virtue/duty). It's about what the state can punish, not what you ought to do. If you accept that, does your claim shrink? Are you saying we shouldn't be *punished* for lying, or that we shouldn't *lie*?

  *   **Anticipated Answer:** She will insist it applies to Ethics; the duty is moral, not just legal.
  *   **Follow-up:** If it's moral, and you admit silence is permissible, doesn't the legal distinction collapse? Why should the law care about the phonetics of my refusal if the moral outcome is the same?

  ### What would move you

  **10.** I want to end on falsification. We've talked about stakes, loopholes, and responsibility. But imagine I can't convince you. What argument, evidence, or hypothetical scenario *would* actually get you to drop the view? Is there any world where the hardline Kantian says, "Okay, in that case, lie"?

  *   **Anticipated Answer:** She will likely say only a contradiction in the derivation of the duty itself could change her mind.
  *   **Follow-up:** So unless the math breaks, the body count doesn't matter? I want the students to hear that clearly.
