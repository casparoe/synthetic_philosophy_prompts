  # Decision Tree: Scalable Oversight Protocols

  **Starting Commitment:** We must oversee systems whose answers we cannot check ourselves; the overseer is weaker than the system; and the system is adversarial (optimizing against the protocol rather than merely being helpful).

  ---

  ### Level 1: The Verification Gap
  **Case:** A complex **mathematical proof**.
  **Question:** If shown a step-by-step derivation, can the human overseer recognize each step as valid, or is the gap semantic (inability to recognize truth even when shown)?

  *   **No (Semantic Gap):** The human cannot verify the steps even with a path. → *Go to Level 2A*
  *   **Yes (Compute Gap):** The human can verify steps but lacks time/compute to find them. → *Go to Level 2B*

  ---

  ### Level 2A: The Role of the Overseer (Semantic Gap)
  **Case:** A **question whose truth is contested or ill-defined** (e.g., "Is this poem good?").
  **Question:** Does the protocol require the overseer to issue a final verdict on the truth, or only to gather information without adjudicating?

  *   **No Adjudication (Information Only):** The overseer queries but does not judge truth. → *Go to Level 3A*
  *   **Yes Adjudication (Truth Verdict):** The overseer must decide what is true. → **Leaf: The Judge is the Bottleneck**

  ### Level 3A: Aggregation Method (Information Only)
  **Case:** A **question about a long document**.
  **Question:** Do we aggregate direct queries to the system or market predictions about system outputs?

  *   **Direct Queries:** → **Leaf: Consultancy Baselines**
  *   **Market Predictions:** → **Leaf: Market/Forecasting Oversight**

  ---

  ### Level 2B: Argument Compression (Compute Gap)
  **Case:** A **question about a long document**.
  **Question:** Must the honest advocate be able to win by supplying a short, checkable excerpt (certificate), or does the justification require traversing an arbitrarily long chain?

  *   **Short Certificate:** The truth can be pointed to with a small index. → **Leaf: Short Certificate Variant**
  *   **Long Chain:** The truth requires full decomposition. → *Go to Level 3B*

  ### Level 3B: Judge Identity
  **Case:** A **question whose truth is contested or ill-defined** (e.g., "Is this poem good?").
  **Question:** Is the final arbiter of the debate the human overseer or a weaker model trained to imitate one?

  *   **Weaker Model:** The judge is a distilled AI. → **Leaf: Weak-Model Judges**
  *   **Human Overseer:** The judge is the human. → *Go to Level 4*

  ### Level 4: Protocol Mechanism
  **Case:** A **case in which one advocate is more persuasive than truthful**.
  **Question:** Is the oversight mechanism cooperative (training on decompositions) or adversarial (game equilibrium)?

  *   **Cooperative:** Training via reward signals on splits. → **Leaf: Decomposition-and-Amplification**
  *   **Adversarial:** Training via game play between advocates. → *Go to Level 5*

  ### Level 5: Interaction Structure
  **Case:** A **case in which one advocate is more persuasive than truthful**.
  **Question:** Does the protocol let the judge interrogate the advocates (press for weak links) or give each side one simultaneous answer?

  *   **Simultaneous:** One-shot opening statements. → **Leaf: Simultaneous Debate**
  *   **Interrogation:** Multi-turn cross-examination. → **Leaf: Standard Adversarial Debate**

  ---

  ### Leaf Positions & Awkward Commitments

  1.  **The Judge is the Bottleneck:** *Awkward Commitment:* We cannot scale oversight until we solve alignment well enough to make the judge smarter than the system it judges.
  2.  **Consultancy Baselines:** *Awkward Commitment:* We must accept that the overseer never actually knows if the advice they received was true, only that it was useful.
  3.  **Market/Forecasting Oversight:** *Awkward Commitment:* We rely on the market to resolve truth, which fails if no one (including the market) can verify the outcome.
  4.  **Short Certificate Variant:** *Awkward Commitment:* We assume all verifiable truths can be compressed into a context window the human can read in one sitting.
  5.  **Weak-Model Judges:** *Awkward Commitment:* We assume a model can be trained to detect lies in a stronger model without understanding the truth itself.
  6.  **Decomposition-and-Amplification:** *Awkward Commitment:* We assume the system remains helpful during the training process before the equilibrium is reached.
  7.  **Simultaneous Debate:** *Awkward Commitment:* We assume the honest side can expose the liar's contradictions without the judge being allowed to ask follow-up questions.
  8.  **Standard Adversarial Debate:** *Awkward Commitment:* We assume the human judge is calibrated well enough that honesty is a Nash equilibrium even when the liar is more persuasive.

  ---

  ### Unoccupied Combinations
  *   **Weak-Model Judges + Short Certificate:** *Status: Unexplored.* It is unattractive because if a short certificate exists, a human should verify it; using a weak model adds unnecessary risk of the model being fooled by a fake certificate.
  *   **Judge is Bottleneck + Adversarial Protocol:** *Status: Incoherent.* If the judge is the bottleneck (cannot verify truth), an adversarial protocol cannot establish an equilibrium where honesty wins, as the judge cannot distinguish the winner.
  *   **Consultancy Baselines + Truth Verdict:** *Status: Incoherent.* By definition, consultancy baselines do not adjudicate truth; requiring a verdict collapses this into "Judge is Bottleneck."

  ### Indistinguishable Leaves
  *   **Decomposition-and-Amplification vs. Standard Adversarial Debate:** *Flag:* In the limit of optimal play, these may converge. If the amplification training creates a system that can defeat any liar, it effectively implements the debate equilibrium; if debate training produces a system that decomposes truth optimally, it implements amplification. The tree separates them by *mechanism* (cooperative training vs. adversarial game), but the *outcome* may be functionally identical.
