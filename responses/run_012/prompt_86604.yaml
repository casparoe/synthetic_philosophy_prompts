answer: |-
  There is no single, universally accepted term for this specific phenomenon, though it is the open secret of science policy and journalism.

  Your philosopher friend is wrong about external validity. External validity asks: *Does this model apply to the real world?* Your observation is about something more sociological: *Why does the model's disclaimer fail to apply to the public conversation?*

  Existing terms come close but miss the mark. **Reification** treats an abstract concept as concrete, but implies a cognitive error rather than a transmission failure. **Black Boxing** (from Bruno Latour) describes hiding the internal workings of a technology, but usually implies the user *doesn't need* to know the internals to use it. In your case, the policymakers *do* need to know the internals to use it safely, but they can't carry them. **Decontextualization** is accurate but sterile; it describes the state, not the mechanism.

  Here is the name that fits, borrowing directly from the physics metaphor you already identified:

  ### The Frictionless Fact

  **The Definition:** A Frictionless Fact is a quantitative or qualitative output from a model that travels easily across boundaries (from paper to press release to policy) precisely because the methodological constraints that generated it have high "epistemic viscosity" and get left behind.

  The number flows; the caveat sticks.

  **Why this name sticks:**
  1.  **It honors your example:** You mentioned fluids with no viscosity. In physics, a superfluid flows without losing energy to friction. In science communication, a "Frictionless Fact" flows without losing "energy" to complexity. It arrives at the minister's desk perfectly intact, which is exactly the problem.
  2.  **It implies motion:** This isn't a static error; it's a dynamic process of transmission.
  3.  **It absolves intent:** Friction is a physical property, not a moral failing. The scientist isn't lying; the caveat is just too "viscous" to flow through the narrow pipe of a press release.

  ### The Edges of the Concept

  To make this term useful, we have to distinguish it from the things it often gets confused with.

  **1. Frictionless Fact vs. Ordinary Uncertainty**
  *   **Uncertainty** is about precision (e.g., "The result is 5% +/- 2%"). It is mathematical noise.
  *   **Frictionless Facts** are about structural validity (e.g., "This result assumes no friction").
  *   *The Edge:* You can have a Frictionless Fact with zero uncertainty. The model can calculate the number perfectly. The error isn't in the calculation; it's in the *portability* of the conditions required for the calculation to matter. Uncertainty travels well (error bars are visual); structural assumptions do not.

  **2. Frictionless Fact vs. Spin**
  *   **Spin** is intentional distortion. It is an act of agency.
  *   **Frictionless Facts** are structural inevitabilities.
  *   *The Edge:* If you ask the scientist, "Did you hide the assumption?" they will honestly say no. If you ask the press officer, "Did you know about the assumption?" they will honestly say yes, but "It didn't fit." Spin is a lie; the Frictionless Fact is a translation loss. It is the cost of doing business in a world where attention is scarcer than data.

  ### The Linguistic Extension: Concept Shedding

  You asked if this happens when what travels isn't a number, but a way of talking. Yes, and it is arguably more dangerous.

  When a number travels, it remains a number. When a *concept* travels, it often becomes a **Hollow Metaphor**. I propose calling this **Concept Shedding**.

  This is when a term like "discount rate," "phase transition," or "resilience" leaves its home discipline.
  *   **In the source:** "Phase transition" implies specific thermodynamic conditions, latent heat, and order parameters.
  *   **In the wild:** "Phase transition" just means "a big change."

  The mathematical scaffolding is shed, but the *authority* of the physics remains. The term becomes a **Zombie Concept**: it walks around looking like science, but the brain (the rigorous definition) has been left back in the paper.

  **Why Concept Shedding is worse than Frictionless Facts:**
  A Frictionless Fact (a number) can be corrected later with a new number. A shed concept changes *how people think*. If a regulator starts thinking about the economy as a "fluid," they will start looking for flow dynamics rather than social contracts. The metaphor dictates the solution before the problem is even analyzed.

  ### Summary for your Beat

  *   **The Phenomenon:** **The Frictionless Fact**.
  *   **The Mechanism:** **Epistemic Viscosity** (Caveats are thick; numbers are thin).
  *   **The Linguistic Version:** **Concept Shedding** (Terms lose their definitions but keep their prestige).

  You can now write the headline: *"Why Frictionless Facts Rule the World: The cost of cleaning up our models is that we scrub off the warnings."*
