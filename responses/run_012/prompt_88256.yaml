answer: |-
  **THE ANTHROPOCENE SORTING TREE**

  **Q1: Is formal ratification by geological bodies (ICS/IUGS) required?**
  *   **YES** → **Q2: Is the boundary defined by a physical signal in rock (GSSP) or a calendar date (GSSA)?**
      *   **Physical Signal (GSSP)** → **Q3: What is the source of the signal?**
          *   Radionuclides (Plutonium) → **Leaf A**
          *   Atmospheric/Sediment Change (CO2/Pollen) → **Leaf B**
          *   Artificial Materials (Plastics/Bone) → **Leaf C**
      *   **Calendar Date (GSSA)** → **Q3: What human shift defines the date?**
          *   Energy System (Coal/Steam) → **Leaf D**
          *   Land Use (Agriculture) → **Leaf E**
          *   Biodiversity Loss (Megafauna) → **Leaf F**
  *   **NO** → **Q2: Why retain the term without formal status?**
      *   To describe a sharp scientific phenomenon → **Leaf G**
      *   To critique the political economy → **Leaf H**
      *   To maintain flexible scientific usage → **Leaf I**
      *   To reject geological framing entirely → **Leaf J**

  *(Authority Note: Unless specified below, any leaf may accept either strict geological standing or interdisciplinary consensus.)*

  **LEAF COMMITMENTS**

  *   **Leaf A (1952 Plutonium):** Most awkward commitment: Prioritizes a clean global signal over earlier colonial impacts. (Authority: Flexible)
  *   **Leaf B (1610 CO2 Dip):** Most awkward commitment: Marks genocide-induced reforestation as a geological signal without naming the violence. (Authority: Flexible)
  *   **Leaf C (Technofossils):** Most awkward commitment: Requires accepting plastic and chicken bones as valid stratigraphic markers. (Authority: Flexible)
  *   **Leaf D (Industrial Revolution):** Most awkward commitment: Relies on written history rather than unique rock signals. (Authority: Flexible)
  *   **Leaf E (Early Farming):** Most awkward commitment: Signal is too gradual for a sharp boundary definition. (Authority: Flexible)
  *   **Leaf F (Megafauna):** Most awkward commitment: Dates vary wildly by continent, breaking global synchronicity. (Authority: Flexible)
  *   **Leaf G (Event, not Epoch):** Most awkward commitment: Loses formal power in geological mapping and deep-time correlation. (Authority: Interdisciplinary)
  *   **Leaf H (Name is Wrong):** Most awkward commitment: Fragments consensus by renaming the phenomenon (e.g., Capitalocene). (Authority: Political/Humanities)
  *   **Leaf I (Leave Informal):** Most awkward commitment: Perpetuates ambiguity in scientific communication and law. (Authority: Flexible)
  *   **Leaf J (Stratigraphy Wrong):** Most awkward commitment: Discards the primary tool for measuring deep time to make a political point. (Authority: Political/Critical)

  **LOGICAL GAPS & OVERLAPS**

  **Undefended Combinations**
  1.  **Formal GSSP + "Stratigraphy is wrong instrument" (Leaf J):** *Incoherent.* You cannot demand formal ratification while rejecting the ratifying body's validity.
  2.  **Informal Status + Specific 1952 Plutonium Date (Leaf A):** *Unattractive.* Selecting a precise radionuclide spike implies a desire for formal precision; doing so informally wastes the signal's utility.
  3.  **GSSA (Date) + Technofossils (Leaf C):** *Incoherent.* Technofossils are physical materials requiring a GSSP; a GSSA ignores physical markers by definition.

  **Indistinguishable Leaves**
  1.  **"Leave Informal" (Leaf I) vs. "Event, not Epoch" (Leaf G):** *Flagged.* Functionally identical in outcome (no formal boundary), differing only in whether "Event" implies a specific scientific ontology or just pragmatic vagueness.
  2.  **"Name is Wrong" (Leaf H) vs. "Stratigraphy Wrong" (Leaf J):** *Flagged.* Both reject the standard framing for political reasons; the distinction between renaming the epoch and rejecting the instrument is often rhetorical rather than structural.

  **Authority Axis Note**
  The tree separates Marker/Status from Authority, but most leaves (A-F, I) allow either strict geological standing or interdisciplinary consensus. Leaves G, H, and J inherently require interdisciplinary or political standing, as strict geology cannot ratify an "Event" or a political critique.
