      *   **Goal:** A concrete procedure/checklist to determine when a micro-history reveals macro-structure vs. when it's just an anecdote.
      *   **Tasks:**
          1.  Create the checklist/procedure.
          2.  Apply it to the 1848 Flour Riot case.
          3.  Apply it to a stress-test case (1790s farmer's wife's account book).
