  2.  **Deconstruct the Historiographical Problem:**
      *   This is the classic "microhistory vs. macrohistory" tension.
      *   It's also the "subaltern studies" problem (can the subaltern speak if the archive is colonial/state-owned?).
      *   Key concepts needed: Triangulation, Negative Evidence, Structural Contextualization, Reading Against the Grain (Stoler/Scott), Typicality vs. Exceptionality.

  3.  **Drafting the Procedure (The "Method"):**
      *   Needs to be actionable for a journalist, not just theoretical.
      *   Needs to address the specific critiques (romanticism vs. criminalization).
      *   *Step 1: Source Interrogation.* Who wrote this? Why? What is *not* said?
      *   *Step 2: Structural Anchoring.* Connect the event to prices, laws, trade routes.
      *   *Step 3: Pattern Recognition.* Is this behavior repeated elsewhere? (Comparative history).
      *   *Step 4: The "Deviance" Test.* If the record calls them criminals, does the punishment fit the crime? Does the language suggest moral panic?
      *   *Step 5: The Silence Audit.* Where does the story stop because the archive stops? Acknowledge the gap.
      *   *Step 6: The Zoom Toggle.* When to pull back to economics/state.

  4.  **Applying to Case 1: The 1848 Flour Riot:**
      *   *Sources:* Magistrate deposition (bias: order/property), Insurance claim (bias: money/loss), Burial register (bias: existence/death).
      *   *Application:*
          *   Read the deposition *against the grain*: What do the women's actions imply about community organization?
          *   Check flour prices in Halifax/UK in 1848 (1848 is a big year for revolutions/famine).
          *   Compare to other grain riots (England, Europe). Is "women boarding ships" a known tactic?
          *   Address the "criminal" label: Was this treated as a riot or a theft? Was anyone actually jailed?
          *   Zoom out: Why was flour there? Who owned the schooner?

  5.  **Applying to Case 2: The 1790s Account Book:**
      *   *Sources:* Household ledger (bias: literate, propertied, specific region).
      *   *Problem:* Too much voice, unknown typicality.
      *   *Application:*
