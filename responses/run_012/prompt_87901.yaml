          *   Look for gaps: Does she record wages paid to help? (Implies labor structure).
          *   Is her literacy typical? (Likely not).
          *   Zoom out: 1790s economy, war effects (Napoleonic?), local agriculture.
          *   The "One-off" test: Is her spending power average?

  6.  **Identifying Failure Points:**
      *   Where does this method break?
