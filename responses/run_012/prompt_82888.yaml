answer: |-
  You have put your finger on one of the most notorious friction points in the semantics/pragmatics interface. Your intuition is correct: the "textbook story" (Lewis/Stalnaker possible worlds semantics) treats the past tense in the *if*-clause as a marker of modal distance, but it does not strictly *entail* that the antecedent is false. Yet, in ordinary usage, it certainly *feels* like it does.

  Here is the breakdown of the terminology, the mechanisms, and the distinctions you are looking for.

  ### 1. What is the past tense doing?
  **The Name:** **The Modal Past** (also known as the **Fake Past**, **Remote Past**, or **Irrealis Past**).

  In linguistics and philosophy of language, it is widely accepted that the past tense morphology in conditionals like *"If I had..."* or *"If I were..."* is not marking temporal pastness. You are not talking about yesterday. It is marking **modal remoteness**.

  *   **Temporal Past:** Distance from *now*.
  *   **Modal Past:** Distance from *reality* (or certainty/politeness).

  This single grammatical mechanism covers all the cases you mentioned: the counterfactual ("If I had money"), the impossible ("If I were you"), and the polite tentative ("If I sat here"). In all three, the speaker is using the past tense to step away from the actual, immediate, or certain state of affairs.

  ### 2. What is the "falseness of the if-part"?
  **The Name:** **The Counterfactual Implicature** (or **Falsity Implicature**).

  This is the crux of your problem with the mate who lied to you.
  On the standard Lewis/Stalnaker semantics, a counterfactual $A \boxright C$ ("If A had been the case, C would have been") does **not** logically entail $\neg A$ ("A is not the case").
  *   **Entailment:** If $A$ is true, the sentence is contradictory. (Most philosophers reject this).
  *   **Presupposition:** If $A$ is true, the sentence suffers presupposition failure (neither true nor false). (Some theorists hold this, e.g., in specific contextual accounts).
  *   **Implicature:** If $A$ is true, the sentence is semantically evaluable, but the speaker has misled the listener. (This is the dominant Gricean/Lewisian view).

  **The Verdict on Your Mate:**
  When your mate said, *"If I had a spare fifty I'd give it you,"* he generated a **Counterfactual Implicature**. He pragmatically conveyed that he did not have the money.
  *   **Semantically:** Since he *did* have the money, the nearest world where he has the money is the actual world. In the actual world, he did *not* give you the money. Therefore, strictly speaking, the conditional proposition is **False**.
  *   **Pragmatically:** He violated the **Maxim of Quality** (do not say what you believe to be false). He used the *Modal Past* to implicate he was skint. Since he wasn't, he lied.

  There is an older view, associated with **Alan Anderson (1951)**, which argued that counterfactuals *do* entail the falsity of the antecedent (often called **Anderson's Condition**). If you adopt Anderson's view, your mate's sentence was logically incoherent the moment it turned out he had the cash. However, most modern semantics (post-1973) treat the falsity as an **implicature** because we can make sense of sentences like *"If I had had breakfast (and I did), I wouldn't be hungry"* without logical explosion.

  ### 3. Is it the same as the Politeness cases?
  **Yes and No.**
  It is the same *grammatical ingredient* (The Modal Past), but it signals a different *kind of distance*.

  *   **Counterfactuals ("If I had money"):** Signals **Metaphysical/ontological distance**. The speaker presents the antecedent as removed from the realm of actuality.
  *   **Politeness ("If I sat here", "Would you mind"):** Signals **Social/Epistemic distance**. The speaker presents the request as removed from the realm of *imposition* or *certainty*.

  In the politeness case, the antecedent isn't necessarily false (I might sit there). But by using the Modal Past, I am treating the action as "remote" from my current will to do it, thereby giving you an out. It softens the force of the speech act. This is often called **Pragmatic Softening** via Modal Remoteness.

  ### 4. The Distinctions: Presupposed, Implied, or Grammatical?
  You asked for the distinctions on where these come apart. Here is the taxonomy:

  | Feature | **Entailment** (Anderson's View) | **Presupposition** (Contextual View) | **Implicature** (Standard/Gricean View) |
  | :--- | :--- | :--- | :--- |
  | **Definition** | The falsity of the *if*-part is part of the truth conditions. | The falsity of the *if*-part is a precondition for the sentence to have a truth value. | The falsity of the *if*-part is inferred based on why the speaker chose that form. |
  | **If *if*-part is True** | The sentence is a contradiction (necessarily false). | The sentence is undefined (truth-value gap). | The sentence is **misleading** but logically evaluable (often False). |
  | **Your Mate Case** | He spoke nonsense. | He triggered a presupposition failure. | **He lied.** (He exploited the implicature). |
  | **Current Consensus** | Mostly rejected. | Held by some (e.g. Stalnaker in specific contexts). | **Dominant view.** |

  ### 5. Coining a Term (If you need one)
  If you feel "Counterfactual Implicature" is too dry for the specific phenomenon of *using* the conditional to assert the falsity of the antecedent (as your mate did), you might refer to it as:

  **"The Excuse Implicature"** or **"Deceptive Remoteness."**

  However, in a philosophy module, you will score higher by sticking to the established distinction: **The Modal Past generates a Falsity Implicature.**

  ### Summary for your Module
  1.  **The Tense:** It is the **Modal Past** (marking remoteness from reality/certainty/imposition).
  2.  **The Falsity:** It is a **Pragmatic Implicature**, not a semantic entailment. (Your mate lied by exploiting this implicature).
  3.  **The Politeness:** It is the same **Modal Past**, but marking **Social Distance** rather than Metaphysical Distance.
  4.  **The Evaluation:** In your mate's case, because the antecedent was actually true, the nearest possible world is the actual world. Since he didn't give you the money in the actual world, the conditional is **False**, and his assertion that he was skint was a **Lie**.

  The "shake" you can't get rid of is the gap between **Semantics** (what the sentence means) and **Pragmatics** (what the speaker uses it to do). The textbook gives you the semantics; your real-life experience is giving you the pragmatics. Both are right, but they operate at different levels.
