answer: |-
  **Epistemology III: Final Examination**

  **Time Allowed:** 45 minutes
  **Total Marks:** 20

  **Question 1**

  Consider the following two cases:

  **(A) The gauge.** You want to know whether your fuel gauge is reliable. You glance at it, it reads 'full', you form the belief that the tank is full, you note that it read 'full' and the tank is full, you do this a dozen times over, and you conclude that the gauge is reliable. Received intuition: hopeless. You can't certify an instrument by trusting it.

  **(B) The specs.** You want to know whether your eyesight is reliable. You look in the mirror, see that your eyes look healthy and your glasses aren't smudged, and conclude that your eyesight is in good working order. Received intuition: fine, or at least not obviously vicious. Nobody thinks checking your glasses is circular in the bad way.

  A philosopher proposes the **Different-Question Principle** to explain the difference in intuition:

  > *You may use a process to gather evidence bearing on its own reliability provided that the question you are using it to answer is not a question about that process's own output on that very occasion.*

  Proponents argue this principle bans (A) — because when certifying the gauge, the question is about the gauge's output — and permits (B) — because the question ('are my glasses clean?') isn't about your eyes' output on that occasion.

  Critically assess the Different-Question Principle. Determine whether it successfully captures the intuitive difference between (A) and (B). Your assessment should include a test of the principle's limits beyond these two cases. If you believe the principle fails, explain what deeper epistemological condition is actually required to distinguish legitimate checks from vicious circularity.

  ***

  **Model Answer**

  The Different-Question Principle attempts to solve the problem of easy knowledge by focusing on the content of the agent's inquiry rather than the source of their evidence. Superficially, it appears to handle the contrast between the gauge and the specs correctly. In case (A), the ultimate goal is to determine the gauge's reliability. If we characterise the question being answered as 'Is this instrument reliable?', then this is explicitly a question about the process's output. The principle therefore forbids using the gauge to answer it, matching the intuition that bootstrapping is vicious. In case (B), the question is 'Are my glasses smudged?'. This is a question about the state of the glasses, not the output of the visual process itself. Thus, the principle permits using vision to check the glasses, matching the intuition that this is acceptable.

  However, this success is illusory because it relies on a manipulable description of 'the question'. The principle restricts use based on what question the agent claims to be answering on the occasion, not on the structural dependency of the evidence. An agent engaged in bootstrapping can easily frame their inquiry to bypass the restriction. Suppose I use the fuel gauge repeatedly to answer the question 'Is the tank full?' on each occasion. According to the literal wording of the principle, this is permitted: 'Is the tank full?' is not a question about the gauge's output. I can then aggregate these answers to conclude the gauge is reliable. The principle permits the steps that generate the bootstrapping conclusion, provided the intermediate questions are framed externally. Therefore, the principle fails to ban the vicious reasoning in (A) if the agent is slightly clever about their framing.

  To demonstrate this failure clearly, consider a third case: **The Thermometer**. You want to know if a digital thermometer is reliable. You use it to measure the room temperature, asking 'Is the room 20 degrees?'. It reads 20. You check no other source. You conclude the thermometer is reliable because it said 20 and the room was 20. Here, the question used on the occasion ('Is the room 20 degrees?') is not about the thermometer's output. The Different-Question Principle permits this usage. Yet, the intuition remains that this is hopeless bootstrapping. You cannot certify a thermometer solely by reading it. The principle yields the wrong verdict here: it permits a clearly vicious circularity because the question was framed about the world rather than the instrument.

  The failure of the Different-Question Principle reveals that the crux of the issue is not the *question* asked, but the *independence of the evidence*. In case (B), checking the glasses in the mirror provides evidence that is not wholly dependent on the reliability of eyesight regarding external objects; the mirror reflection offers a distinct causal route or a check on the conditions of perception rather than the perception itself. In cases (A) and the Thermometer, the evidence gathered (that the tank is full, that the room is 20 degrees) is entirely dependent on the assumption that the instrument is working. To use that evidence to prove the instrument is working is to presuppose what one aims to prove.

  Therefore, a decent account must replace the Different-Question Principle with an **Independence Principle**. You may not use a process to gather evidence for its own reliability if accepting that evidence as true requires assuming the process is already reliable. The difference between the gauge and the specs is not about the wording of the question, but about whether the check relies on the very faculty being tested. The gauge check relies on the gauge; the specs check relies on a mirror reflection which, while viewed via eyesight, concerns the apparatus of eyesight rather than the external world the eyesight reports on. The Different-Question Principle is too neat because it mistakes a superficial feature of inquiry for the underlying structural flaw of epistemic circularity.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Application to Cases (A) and (B) (5 marks)**
  *   **5 marks:** Clearly explains how the principle ostensibly distinguishes (A) and (B) based on the proponent's logic (Question in A is about output/reliability; Question in B is about conditions/glasses). Acknowledges the surface-level fit.
  *   **3–4 marks:** Explains the distinction but misses the nuance of how the proponent justifies banning (A) (i.e., fails to note the proponent views the certification question as the relevant one).
  *   **1–2 marks:** Confused application; claims the principle bans both or permits both without justification.
  *   **0 marks:** No attempt to apply the principle to the cases.
  *   *Typical Error:* Students assume the principle obviously bans (A) without explaining *why* the proponent thinks the question in (A) is about output (confusing the intermediate belief 'tank is full' with the ultimate goal 'gauge is reliable').

  **2. Counterexample Construction (5 marks)**
  *   **5 marks:** Constructs a clear case (e.g., Thermometer, Ruler, Memory) where the question is external (not about output) but the reasoning remains vicious bootstrapping. Shows explicitly why the principle permits it but intuition rejects it.
  *   **3–4 marks:** Provides a counterexample but the link to the principle's wording is weak, or the intuition regarding the case is ambiguous.
  *   **1–2 marks:** Attempts a counterexample but it fails to test the specific constraint of the principle (e.g., uses a case where the question *is* about output).
  *   **0 marks:** No counterexample offered.
  *   *Typical Error:* Students reproduce a standard bootstrapping case without adjusting the 'question' to bypass the principle, thereby failing to show the principle's insufficiency.

  **3. Identification of the Real Crux (5 marks)**
  *   **5 marks:** Identifies 'Independence of Evidence' or 'Presupposition' as the core issue. Explains that evidence cannot depend on the assumption of the process's reliability. Clearly contrasts this with the Different-Question Principle's focus on framing.
  *   **3–4 marks:** Identifies circularity or dependency but lacks precision in explaining why (B) avoids this while (A) does not.
  *   **1–2 marks:** Vague appeal to 'common sense' or 'internalism' without analysing the structural difference between the cases.
  *   **0 marks:** No alternative condition proposed.
  *   *Typical Error:* Students retreat to naming specific theories (e.g., 'Reliabilism fails') rather than articulating the structural epistemological condition required.

  **4. Structure, Clarity, and Philosophical Rigour (5 marks)**
  *   **5 marks:** Argument is concise, logically sequenced, and uses precise British English. No reliance on external names or reading.
  *   **3–4 marks:** Clear argument but minor lapses in expression or slight reliance on jargon without definition.
  *   **1–2 marks:** Disorganised or difficult to follow. Significant spelling/grammar errors (including non-British spellings).
  *   **0 marks:** Incoherent.
  *   *Typical Error:* Students waste word count summarising the prompt instead of arguing, or use American spellings (e.g., 'realize', 'center') despite instructions.

  **First-Class Threshold:** To achieve 17+ marks, the answer must successfully manipulate the counterexample to show the principle is manipulable (Task 2) and articulate the Independence condition clearly (Task 3), all within the word limit without referencing external literature.
