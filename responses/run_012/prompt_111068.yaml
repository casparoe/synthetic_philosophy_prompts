  3. Should rights be modeled as conditional claims that agents can waive to resolve cycles, and what norms govern such waivers? This is upstream because it introduces dynamic agency into the static impossibility, and a year can characterize equilibrium outcomes under waiver rules, moving up if it preserves liberty without sacrificing consistency but down if it reduces rights to bargaining chips.

