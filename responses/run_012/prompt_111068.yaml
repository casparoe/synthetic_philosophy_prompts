  5. Who selects the game form or rights structure, and can a higher-order agreement resolve the lower-order impossibility? This is upstream because it addresses the arbitrariness of the rule choice, and a year can model constitutional choice under uncertainty, moving up if it identifies a stable constitutional contract but down if it regresses to infinite regress.
