answer: |-
  You are not confused, and this is not a trivial question. You have identified a specific, high-stakes structural problem in law, politics, and metaphysics that standard terminology often obscures.

  The standard label **"verbal dispute"** fails you because it implies the disagreement is *merely* about words and can be dissolved by clarification. In your examples, the disagreement cannot be dissolved because the *consequences* of the classification are real (taxes, rights, liability).

  The label **"conceptual engineering"** (or proposing a new concept) fails because, as you noted, the participants do not feel they are engineering anything. They feel they are *discovering* the truth. They are wearing the phenomenological clothes of a realist ("This *is* a driver") while performing the function of a legislator ("We *shall treat* this as a driver").

  ### The Existing Neighborhood

  There are three existing concepts that circle this phenomenon, though none land perfectly on the bullseye you've described:

  1.  **Essentially Contested Concepts (W.B. Gallie):** This applies to terms like "democracy" or "justice" where disagreement is inherent to the concept. However, your examples ("driver," "fruit") aren't inherently value-laden in the same way; they become contested only when they hit a regulatory boundary.
  2.  **Open Texture (H.L.A. Hart):** In legal theory, this describes how language has a "core" of certainty and a "penumbra" of doubt. Your disputes happen in the penumbra. But Hart assumes judges *know* they are making a choice in the penumbra. In your scenario, the actors often believe they are reporting facts, not making law.
  3.  **Conceptual Ethics (Plunkett & Shapiro):** This is the closest academic fit. It distinguishes between *conceptual exegesis* (what do we mean?) and *conceptual ethics* (what *should* we mean?). Your phenomenon is a **Conceptual Ethics dispute masquerading as Conceptual Exegesis.**

  ### The Coinage: "Stipulative Realism"

  If existing terms don't quite capture the *shape* of the deception (the feeling that one side is objectively right), I propose calling this a **Stipulative Realist Dispute**, or simply **Stipulative Realism**.

  **Definition:** A Stipulative Realist Dispute occurs when two parties argue over the classification of a borderline case as if it were a matter of factual discovery (Realism), when the resolution actually requires a pragmatic decision about how to draw a boundary (Stipulation), the consequences of which are then codified into reality.

  It is "Stipulative" because the solution is a rule (we will count X as Y).
  It is "Realist" because the participants experience and argue it as a truth-claim (X *is* Y).

  ### The Edges: How to Identify It

  To distinguish this from an ordinary factual dispute or an open policy proposal, five conditions must be met. If any one is missing, it is a different kind of fight.

  **1. Factual Consensus (The "Physics" Condition)**
  Both sides must agree on all non-linguistic properties of the object.
  *   *Example:* In *Nix v. Hedden* (the tomato case), both sides agreed on the botanical structure of the tomato. In the "software driver" case, both sides agree on the code's function.
  *   *Edge:* If they disagree on the biology or the code, it is a **Factual Dispute**.

  **2. Semantic Indeterminacy (The "Vagueness" Condition)**
  Both sides must acknowledge (or it must be objectively true) that the current usage of the word does not settle the case. The word's intension (definition) does not cleanly cover the extension (the object).
  *   *Example:* "Driver" historically implied a human hand on a wheel. The software has no hands. The word breaks.
  *   *Edge:* If the word clearly covers the case (e.g., "Is this apple a fruit?"), it is a **Trivial Classification**.

  **3. Normative Asymmetry (The "Stakes" Condition)**
  The classification must trigger different rules, rights, or liabilities. One category carries a burden or benefit the other does not.
  *   *Example:* If a tomato is a "fruit," it avoids vegetable tariffs. If a corporation is a "speaker," it gains free speech rights.
  *   *Edge:* If the classification changes nothing (e.g., "Is this a sofa or a couch?"), it is a **Verbal Dispute** (the shrug-offable kind).

  **4. Phenomenological Realism (The "Mask" Condition)**
  This is the crucial edge. The participants must argue as though they are describing the world, not designing it. They do not say, "We should treat this as a driver for safety reasons." They say, "This *is* a driver."
  *   *Edge:* If they openly say, "We need to update the definition to handle new tech," it is **Conceptual Engineering** or **Legislative Reform**.

  **5. Institutional Finality (The "Codification" Condition)**
  The dispute is not resolved by consensus or better argument, but by authority (a court, a standards body, a legislature) writing the winner's usage into a statute or form. Once written, the stipulation *becomes* a fact for future purposes.
  *   *Example:* After the Supreme Court rules, the tomato *is* a vegetable for tariff law. The stipulation creates the ontology.
  *   *Edge:* If the dispute fades without resolution or is settled by dictionary consensus, it is **Semantic Drift**.

  ### Why This Distinction Matters

  You noted that the losing side gets treated as "simply wrong." This is the dangerous feedback loop of **Stipulative Realism**.

  1.  **Phase 1 (The Fight):** A borderline case arises. Parties argue semantics, but the stakes are normative.
  2.  **Phase 2 (The Ruling):** An authority picks a side. They frame it as a "finding" of meaning.
  3.  **Phase 3 (The Reification):** The ruling is codified. Future forms, statutes, and AI training data use the ruling as a ground truth.
  4.  **Phase 4 (The Erasure):** Ten years later, it no longer looks like a stipulation. It looks like a fact. "Of course a corporation is a speaker; the law says so."

  The reason you don't have a satisfying name for this is that our language separates "facts" (what is) from "norms" (what ought to be). This phenomenon lives in the gap where **norms harden into facts.**

  Calling it **Stipulative Realism** highlights the mechanism: it is a *stipulation* (a choice) that successfully presents itself as *realism* (a discovery). Recognizing it allows you to ask the correct question in the moment: not "Which side is right?" but "Which stipulation serves our goals better?" without the illusion that the answer was waiting in the world all along.
