answer: |-
  Your intuition is sharper than you give it credit for. You have independently rediscovered the distinction between the **Logical Frame Problem** (McCarthy & Hayes, 1969) and the **Commonsense Frame Problem** (Dennett, 1984).

  The Logical Frame Problem is about syntax: *How do I write axioms that say "everything else stays the same" without writing infinite axioms?*
  The Commonsense Frame Problem is about relevance: *How do I know which of the infinite things that stayed the same actually matter for my next decision?*

  Your gut calls are tracking the **Commonsense/Engineering** version. You are sensing where the burden of proof lies regarding stability.

  ### The Principle: Encapsulated Inertia

  Here is the principle that captures your verdicts:

  > **A system has the Frame Problem when its representational medium does not intrinsically guarantee the persistence of unmodified state against the complexity of the environment it models.**

  In engineering terms: **Does the architecture provide "inertia by default," or must the logic prove inertia?**

  *   **Inertia by Default (No Frame Problem):** The medium (RAM, a database row, a chess board data structure) assumes bits stay bits unless explicitly written to. The environment is fully contained within the medium.
  *   **Inertia by Proof (Yes Frame Problem):** The medium (logic, a map, a form) is an abstraction that can be violated by the environment. The system must actively verify or assume that the world outside the abstraction didn't invalidate the state inside it.

  ### Applying the Principle to Your Verdicts

  This principle forces you to keep most of your verdicts but clarifies *why*, and it requires one specific adjustment regarding the LLM.

  1.  **Thermostat (No):** Correct. There is no internal state model to persist. It is a reflex loop. No encapsulation needed.
  2.  **Chess Engine (No):** Correct. The "world" is the board data structure. The rules of chess are the physics. Nothing exists outside the data structure that can move a pawn. The inertia is encapsulated in the RAM.
  3.  **Robot Vacuum (Yes):** Correct. The map is a *lossy abstraction* of a physical room. The physics engine (reality) is not encapsulated in the map. The planner must assume the couch *might* have moved because the medium (the map) does not guarantee inertia against the environment (your living room).
  4.  **SQL Transaction (No):** Correct, but your worry was astute. The *application engineer* faces no frame problem because the *DBMS engineer* solved it for you. The DBMS provides **Encapsulated Inertia** via locking and write-ahead logs. You say `UPDATE`, and the system guarantees the rest of the row stays the same. You are standing on the solution.
  5.  **Bureaucracy (Yes):** Correct. The database record is not the human. The "environment" (human life) is not encapsulated in the "system" (the form). The clerk faces the frame problem because changing an address *could* imply a change in tax bracket, voting district, or marital status, and the form does not guarantee those other fields are inert.
  6.  **LLM (No):** **Adjustment required.** An LLM is stateless. It does not maintain a world model across tokens; it predicts the next token based on context. When it fails to keep eye color consistent, that is not the Frame Problem; it is **Context Drift** or **Attention Failure**. The Frame Problem requires a state that *persists* and *needs updating*. An LLM has no state to persist. It regenerates the world from scratch every forward pass. It fails at consistency, but not because it couldn't frame the axioms of non-change; it fails because it has no memory of the change to begin with.

  ### The Self-Driving Car

  This is the ultimate stress test for the principle.

  **Verdict:** **Yes, extreme Frame Problem.**

  **Why:** A self-driving car is a hybrid system.
  *   **Perception (Neural Nets):** No frame problem (stateless classification).
  *   **Planning (Logic/Probabilistic):** Massive frame problem.

  The planner maintains a state (a list of objects, their velocities, traffic light states). It operates on the assumption of **Encapsulated Inertia** (the car ahead will stay a car), but it operates in an **Open Environment** (the car ahead might drop a sofa).

  *   **Plastic Bag vs. Rock:** This is actually the **Qualification Problem** (a sibling of the Frame Problem). It's about preconditions: *If obstacle, then stop.* But the rule needs infinite qualifications: *...unless it's a bag, or a shadow, or a leaf.*
  *   **Truck into Tunnel:** This is the **Frame Problem** proper. The system must track that the truck *ceased to exist* as a threat without an explicit "truck deleted" event. It must infer the truck's disappearance from the lack of sensor data, while assuming the tunnel didn't teleport.

  The car has the frame problem because its internal map is a fragile encapsulation of a chaotic world. Every millisecond, it must re-verify that the things it *didn't* update are still true.

  ### Confidence and Uncertainty

  **Confidence Level:** **85%**
  I am highly confident that "Encapsulated Inertia" captures the engineering intuition you are describing. It aligns with how we distinguish between "pure functions" (no state, no frame problem) and "stateful services" (state management required), and it bridges the gap between the logical definition and your real-world examples.

  **Least Sure Claim:** **The LLM Verdict.**
  I am least sure about categorically stating the LLM has "No Frame Problem."
  *   *Why:* There is a growing school of thought (e.g., in cognitive science) that argues Transformer attention mechanisms *are* a form of soft, implicit state representation. If you view the context window as a temporary "working memory," then the failure to maintain character consistency *is* a failure of inertia.
  *   *Counter:* However, strictly speaking, the model weights don't change during inference. There is no persistent state to frame.
  *   *Resolution:* I stand by "No" for the strict definition, but acknowledge that functionally, for a user expecting a consistent story, it *feels* like the frame problem because the system fails to enforce the inertia of narrative facts.

  ### Summary for your Mental Model

  You don't need to worry about "Open vs. Closed World." Instead, ask: **"Who guarantees that nothing touched this variable?"**

  *   If the **Hardware/OS/DB** guarantees it (Chess, SQL): No Frame Problem.
  *   If the **Logic/Planner** has to guarantee it against a leaky environment (Vacuum, Bureaucracy, Car): Frame Problem.
  *   If there is **No Variable** (Thermostat, LLM): No Frame Problem (just other problems).
