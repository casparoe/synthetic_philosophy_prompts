answer: |-
  Elara kept the ledger in the bottom drawer of her desk, bound in cracked black leather. It wasn't part of the Bureau's records. It was hers.

  On the first page, dated ten years ago, she had written: *The Self-Winding Watch.* Beside the words, she had sketched a mechanism of springs and weights that seemed to pull energy from the air currents of a room. She remembered sitting in the park that day, closing her eyes, and seeing the gears turn. It felt smooth. Silent. Possible. She had approved the patent application that week.

  Three years later, after her advanced thermodynamics certification, she had taken a red pen to the page. She hadn't crossed out the sketch. She had simply written *Impossible* in the margin. Not because the watch had failed in the testing lab—though it had—but because she could no longer hold the image in her head without it fracturing. When she tried to visualize the gears turning now, she didn't see motion; she saw air resistance. She saw friction heating the brass. She saw the energy bleeding away into the room like steam. The picture wouldn't stay still. It dissolved into equations.

  She turned the page.

  *The Unbreakable Glass.* Approved, Year 2.
  *Impossible,* Year 5. (Stress fractures inevitable at molecular level.)

  *The Perpetual Pump.* Approved, Year 1.
  *Impossible,* Year 4. (Entropy.)

  The ledger was a graveyard of things that used to fit in her mind. When she was junior, her imagination was a wide net. She could catch anything. If it didn't contradict itself immediately, she let it through. She believed that if she could see it, truly see it, then the universe must have a place for it.

  Now, at Senior Assessor level, the net was mesh so fine nothing slipped through. Nothing got in, either.

  Her office was quiet, save for the hum of the ventilation system. On her desk lay File 8940. The schematic was simple: a coupling device meant to transfer torque between two shafts without physical contact and without energy loss. A Silent Gear. The applicant, a man named Kress, claimed it used magnetic resonance to lock the fields perfectly.

  Elara picked up her pen. She needed to run the viability check. This wasn't about whether it worked yet; it was about whether it *could*. The Bureau required a conceptual viability stamp before any prototype was built. If she couldn't conceive of it without contradiction, she had to reject it.

  She closed her eyes.

  She tried to summon the image. Two rings, hovering. One turns, the other follows. Instantly. No lag. No heat.

  In the past, this would have been easy. She would have seen the smooth metal, the clean transfer of force. But now, as she focused, the image degraded. She saw the magnetic fields not as clean lines, but as messy vectors. She saw the electrons spinning. She felt the resistance of the air between the rings. She felt the heat generating in the coils.

  *Stop,* she told herself. *Just look at the shape.*

  She tried to strip away the physics. Just the geometry. Ring A moves Ring B.

  But the knowledge was sticky. It coated the image. She couldn't see the movement without seeing the cost. The harder she tried to visualize the perfect transfer, the more her mind supplied the losses. It was like trying to imagine a square circle; the definitions fought each other. The more she knew about electromagnetism, the less room there was for the miracle.

  She opened her eyes. The schematic looked innocent on the paper. Just lines and notes.

  She looked at the ledger. There was space on the last page. She wrote: *The Silent Gear.*

  She waited. She wanted to feel that old spark, the sense of expansion. Usually, when she found something viable, the world felt like it opened up. There was more room in it. But now, staring at the blank space beside the title, she felt nothing. The image in her head was static. It wouldn't turn.

  She picked up the stamp. *REJECTED - CONCEPTUAL CONTRADICTION.*

  She hovered it over the form. Her hand trembled.

  Was there a contradiction? Really? Or was there only a contradiction inside her?

  She thought of Kress. He wasn't a physicist. He was a mechanic. He worked with his hands. He didn't see the vectors or the entropy. He probably looked at those rings and saw them turning. He probably felt the smoothness of it in his gut. If she rejected this, he wouldn't build it. He would take the stamp as proof that his own eyes were lying to him. He would stop seeing it too.

  Elara lowered the stamp. She opened the bottom drawer and took out a small, wooden box. Inside was a collection of objects she had approved years ago. A toy top that spun for an hour. A lens that focused light strangely. They worked. They were real. They existed because she had once been able to imagine them without knowing why they shouldn't.

  She looked back at the schematic.

  If she stamped it, she was protecting the integrity of the Bureau. She was upholding the laws of physics as she understood them. She was ensuring that no one wasted money on a dream.

  If she didn't...

  She closed her eyes again. She tried to force the image. She tried to be ignorant. She tried to forget the heat capacity of copper. She tried to forget the resistance of the vacuum. She tried to be the person she was ten years ago, the one who thought the self-winding watch was real.

  She saw the rings. They hovered.

  Then she saw the gap. And in the gap, she saw the math. It flashed like lightning. The energy had to go somewhere. It had to.

  The image shattered.

  She opened her eyes. The office was the same. The hum of the ventilation was the same. The world was exactly as heavy as it had been five minutes ago.

  Elara picked up the stamp. She pressed it down firmly. The ink transferred to the paper with a wet thud.

  *REJECTED.*

  She filed the paper away. She opened the ledger to the last page. Beside *The Silent Gear*, she dipped her pen in the red ink.

  She paused. The nib hovered over the paper.

  She tried one last time to see the gear turning. She tried to find a single corner of her mind where the friction didn't exist. She searched for the possibility that the laws she knew were just local customs, that the universe was wider than her equations.

  She saw only the equations.

  She wrote *Impossible.*

  But she didn't close the book. She left it open on the desk, the red ink still wet, staring at the word. She wondered if the word described the machine, or if it described the hand that wrote it. She wondered if, somewhere else, in a room with a different desk, someone was looking at the same schematic and seeing it spin so clearly they could hear the hum.

  Elara turned off her desk lamp. The ledger disappeared into the dark, but the word remained in her head, glowing faintly, neither true nor false, just heavy. She walked to the window and looked out at the city. The lights flickered. Energy was being lost everywhere, dissolving into the night.

  She tried to imagine a city where the lights didn't flicker. She tried to hold the image steady.

  It dissolved.

  She watched the dark streets for a long time, waiting to see if the lights would come back on, or if she had just forgotten how to see them.
