  **MEMORANDUM**

  **TO:** Rules Committee / Plenary Session
  **FROM:** [Your Name], Rules Committee
  **DATE:** October 24, 202X
  **SUBJECT:** Recommendation on Preliminary Motion Regarding Count IV (Crimes Against Peace)

  **Recommendation**
  I recommend we **retain Count IV subject to the proposed reciprocity trigger.** We should amend the Rules to stipulate that jurisdiction over Crimes Against Peace lapses automatically unless, within twelve months, every convening power ratifies an instrument submitting their own command structure to identical jurisdiction for comparable conduct.

  **Reasoning**
  The Defense's retroactivity objection is legally sounder than our initial drafting suggests. At the time of invasion, aggressive war was not codified as an individual crime in the treaties our state signed. Citing Nuremberg or Tokyo does not settle this; those tribunals faced the same critique and resolved it through political necessity, not settled law. Relying on them now is rhetorical, not legal. We are creating law, not applying it.

  However, striking the count concedes that international law binds only the defeated. The greater threat to this Tribunal's legitimacy is not *ex post facto* liability, but the charge of hypocrisy regarding the convening power's prior incursion. If we prosecute aggression here while immunizing similar conduct by our sponsors, every subsequent conviction becomes suspect.

  The reciprocity trigger converts this vulnerability into a safeguard. It acknowledges the novelty of the charge by demanding prospective buy-in from the victors. If the convening powers refuse to subject themselves to the same standard, the count lapses, and we avoid the appearance of victor's justice. If they agree, the retroactivity concern is mitigated by the establishment of a binding future norm.

  **The Strongest Counter-Argument**
  The faction urging us to strike Count entirely argues that risking the legitimacy of Genocide and War Crimes convictions for a politically volatile count is imprudent. They contend that if the trigger fails—or if the Defense successfully litigates the retroactivity issue regardless—we undermine confidence in the whole statute. They are right that a collapsed Count IV could cast a shadow over Counts I–III. However, preserving the Tribunal's moral authority requires us to test the principle, not hide from it. A conviction on lesser counts achieved through selective justice is no victory.

  **Procedural Next Step**
  We must draft the amendment language implementing the trigger immediately. I propose we circulate a redline of Rule 4(b) by **Wednesday, 17:00**, to allow 48 hours for committee review before Friday's plenary vote. If we cannot agree on the wording by Wednesday, we must default to striking the count to ensure the plenary has a viable statute to vote on.

  **Conclusion**
  This path is procedurally complex, but it is the only way to answer the Defense without surrendering the principle that law must apply equally to aggressors, regardless of who wins the war.
