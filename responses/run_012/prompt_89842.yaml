answer: |-
  **MEMORANDUM ATTACHMENT: HIGH-IMPACT GRANT DECISION PROTOCOL**

  **Purpose:** To provide a consistent, time-bound method for evaluating grants with low probability but high potential impact, resolving conflicts between expected-value maximization and risk aversion.
  **Time Allocation:** 20 Minutes per proposal.
  **Authority:** This protocol supersedes individual trustee heuristics (e.g., "5% rule" or "20% allocation") unless the Board votes to amend the parameters in Section 3.

  ### THE PROCEDURE

  **Question 1: The Benefit Metric Check**
  *   **Ask:** Is the primary benefit measured in concrete, near-term units (e.g., lives saved, tons of CO2, policy changes) within a 50-year horizon?
  *   **Sufficient Answer:** Yes = Proceed. No (e.g., "future digital minds," "civilization survival beyond 100 years," "infinite utility") = **STOP.** Hand off to Human Values Vote (see Q5).
  *   **Rationale:** Prevents "Pascal's Mugging" where undefined or infinite benefits swamp all other logic.

  **Question 2: The Probability Grounding Check**
  *   **Ask:** Is the probability of success derived from a reference class of similar past interventions (e.g., "10% of Phase 1 vaccine platforms succeed") or a quantitative model?
  *   **Sufficient Answer:** Yes = Proceed. No (e.g., "expert vibe," "logical argument," "unprecedented scenario") = **STOP.** Hand off to Human Values Vote (see Q5).
  *   **Rationale:** Distinguishes between calculable risk and unquantifiable uncertainty.

  **Question 3: The Portfolio Cap Check**
  *   **Ask:** Does funding this grant keep the total portfolio allocation to "High Risk/Low Probability" grants below the Board-approved ceiling (recommended: 15% of annual budget)?
  *   **Sufficient Answer:** Yes = Proceed. No = **NO.** (Unless Board votes to raise ceiling).
  *   **Rationale:** Acknowledges opportunity cost; we cannot fund all positive-EV long shots.

  **Question 4: The Irreversibility & Learning Check**
  *   **Ask:** If the grant fails (probability >50%), does the foundation gain actionable information or field capacity that improves future granting?
  *   **Sufficient Answer:** Yes = Proceed. No = **NO.**
  *   **Rationale:** Ensures that "failures" still yield asset value (knowledge/relationships).

  **Question 5: The Human Values Handoff**
  *   **Ask:** For any proposal that triggered a STOP in Q1 or Q2, or passes Q1-Q4 but generates significant board discomfort: Does the Board wish to fund this based on mission alignment rather than formulaic output?
  *   **Sufficient Answer:** 75% Supermajority Vote = **YES.** Otherwise = **NO.**
  *   **Rationale:** Explicitly locates moral responsibility with the trustees, not the math.

  ***

  ### APPLICATION TO PENDING PROPOSALS

  **Case 1: Moonshot Vaccine Platform**
  *   **Profile:** $2M grant, 1-in-200 chance, millions of lives saved.
  *   **Q1 (Metric):** Concrete lives saved, near-term. **PASS.**
  *   **Q2 (Probability):** Based on historical platform trial data. **PASS.**
  *   **Q3 (Cap):** Assuming we have not yet hit the 15% high-risk ceiling. **PASS.**
  *   **Q4 (Learning):** Even if it fails, we learn about the platform's viability. **PASS.**
  *   **Q5 (Values):** No discomfort reported.
  *   **Result:** **FUND.** (Subject to Portfolio Cap availability).

  **Case 2: Engineered Pandemic Reduction**
  *   **Profile:** $2M grant, risk reduction amount "nobody can honestly estimate."
  *   **Q1 (Metric):** Lives saved (conceptually). **PASS.**
  *   **Q2 (Probability):** Probability source is "nobody can estimate." **FAIL.**
  *   **Action:** Triggers **Q5 (Human Values Handoff).**
  *   **Result:** **BOARD VOTE.** The math cannot do the work here. The Board must decide if "trying something plausible but unquantifiable" aligns with mission. If the Board adheres to the Treasurer's "non-arbitrary" standard, this is a **NO.** If they adhere to the "20% long shot" standard, this is a **YES.** The procedure forces them to pick a side explicitly.

  **Case 3: Future Generations / Digital Minds**
  *   **Profile:** $2M grant, benefit is astronomically large number of future/digital entities, EV technically infinite.
  *   **Q1 (Metric):** Benefit relies on speculative future populations/digital minds >50 years. **FAIL.**
  *   **Action:** Triggers **Q5 (Human Values Handoff).**
  *   **Result:** **BOARD VOTE.**
  *   **Honest Assessment:** Pure expected-value mathematics dictates you **MUST** fund this, because any non-zero probability multiplied by infinity is infinite. If you follow the math, you ignore malaria nets to fund digital minds. This procedure explicitly blocks the math at Q1. It forces the Board to vote on whether they care more about existing humans or potential digital minds. In a family foundation focused on global health, this vote will likely fail. The procedure saves you from funding it, but it does so by admitting the formula broke, not by proving the EV is negative.

  ***

  ### LIMITATIONS AND HONESTY CHECK

  **Where This Misfires:**
  1.  **The Cap is Arbitrary:** The 15% risk budget in Q3 is not derived from nature; it is a political compromise. If the Board sets it at 5%, you miss moonshots. If 50%, you endanger the endowment. The procedure enforces the number, it does not justify it.
  2.  **Reference Class Gaming:** In Q2, applicants can cherry-pick reference classes to make probabilities look grounded. Staff must vet the "similar past interventions" claim rigorously, or Q2 becomes a loophole.
  3.  **The "Vibe" Problem:** Case 2 shows that the most important existential risks often lack data. This procedure systematically disadvantages novel, unprecedented threats because they fail Q2. You are trading existential safety for epistemic hygiene.
  4.  **Judgment Dressed as Arithmetic:** Q1 (50-year horizon) and Q3 (15% cap) are value judgments disguised as filters. They are there to stop the math from eating the foundation, not because they are scientifically "true."

  **What This Cannot Do:**
  *   It cannot reconcile the moral weight of future generations vs. current people. It simply defaults to current people unless the Board votes otherwise.
  *   It cannot prevent regret. If you reject Case 2 and a pandemic happens, the procedure will not have been wrong, but you will still feel responsible.
  *   It cannot optimize for EV. It optimizes for *survivability of the foundation's decision-making process.*

  **Final Warning:**
  This procedure protects the Board from being manipulated by infinite numbers and ungrounded guesses, but it requires the Board to accept that they are making moral choices, not mathematical ones. If the Treasurer insists on "non-arbitrary" ranking, this procedure will fail, because the inputs (probability, benefit horizon) are inherently arbitrary.

  Bottom line: This protocol prevents mathematical absurdities from dictating strategy by forcing explicit value votes on any grant where the numbers stop making sense.
