      *Wait, one more nuance:* The user says "Case 3 is the one I suspect your procedure is going to tell me to fund... please don't soften it." This is a challenge. They want to see if I'll bite the bullet on Pascal's Mugging. If I build a procedure that *avoids* Pascal's Mugging via a heuristic filter, I am technically not following the "EV maximizer" logic, but I am following the "Program Officer keeping the foundation alive" logic. I will choose the latter but acknowledge the former. I will state clearly: "If you calculate raw EV, you must fund. This procedure prevents that calculation." That is the honest answer.

      *Actually, looking at the instruction:* "I need it to say... where the procedure has to just stop and say 'this is a values question and a person decides, not a formula.'"
      *   Okay, so for Case 3, the procedure should likely hand it off to a human. The human (Board) will likely say no. So the outcome is "No," but the *reason* is "Values Call," not "Math Says No." This satisfies the constraint.

  9.  **Finalizing the Steps:**
