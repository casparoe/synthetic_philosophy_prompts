      *   *Radical Interpretation:* Starting from scratch, no prior dictionary, observing behavior + environment.
      *   *Principle of Charity:* We must interpret speakers as mostly rational and having mostly true beliefs (by our lights) to make sense of them at all.
      *   *Indeterminacy:* Multiple translation manuals can fit all the evidence equally well (Gavagai style, but needs to be playable).
