  # Troubleshooting: What Will Go Wrong

  **1. Informants Break Character**
  *   *Risk:* Informants get giggly or try to help the Linguists by nodding/winking.
  *   *Fix:* Give Informants a "Script." If a Linguist asks "Does this mean Red?", the Informant must point to the Rule Card and shrug. Tell Informants: "Your goal is not to help them win. Your goal is to follow the Card."

  **2. Linguists Speak English**
  *   *Risk:* "Wait, does 'Blick' mean Red?"
  *   *Fix:* The "Chip Penalty." If you hear English meta-talk during data collection, remove 2 chips from their pot. Enforce this strictly in Round 1.

  **3. The "English Categories" Trap**
  *   *Risk:* They assume "Vop" is a noun marker because English needs nouns.
  *   *Fix:* In the debrief, highlight this. "You assumed 'Vop' was a thing-word because *your* language requires subjects. That's exactly Davidson's point. You brought your grammar to the field."

  **4. The Charity Bite Misses**
  *   *Risk:* They just say "Blick means Blue now" and ignore Round 1.
  *   *Fix:* You must enforce the "Locked Manual" rule. "You have already bet chips on Blick=Red. If you change it, you forfeit Round 1 winnings." This forces the cognitive dissonance.

