answer: |-
  **NATIONAL COUNCIL FOR PROCEDURAL INTEGRITY (NCPI)**
  **ACCREDITATION STANDARD 7.3**
  **CLASSIFICATION, RECORDING, AND REPORTING OF OMISSIONS**

  **1.0 SCOPE AND APPLICABILITY**
  1.1 This Standard applies to all Member Institutions wherein patient mortality occurs subsequent to a clinical decision point involving the initiation, continuation, or cessation of physiological support.
  1.2 The purpose of this Standard is to ensure uniformity in mortality attribution, specifically regarding the distinction between Active Termination (AT) and Administrative Omission (AO).
  1.3 Compliance is mandatory for all Risk Management, Bioethics, and Quality Assurance departments.

  **2.0 DEFINITIONS**
  2.1 **Active Intervention:** Any clinical action requiring positive metabolic expenditure by licensed staff resulting in a change of patient status.
  2.2 **Omission:** The maintenance of the baseline trajectory of pathology absent new metabolic expenditure by staff.
  2.3 **Causal Agency:** Attribution of death to a specific variable. For the purposes of this Standard, the underlying pathology shall be considered the Primary Causal Agent unless an Active Intervention directly supersedes it.
  2.4 **Counterfactual Dependence:** A determination that the patient *would have* survived but-for the specific intervention. If survival was probabilistic rather than certain, the outcome is classified as an Omission of Survival Probability.

  **3.0 CLASSIFICATION TIERS**
  3.1 **Tier I (Active Termination):** Reserved for interventions where the sole foreseeable outcome is physiological cessation. This classification requires dual sign-off by Ethics and Legal.
  3.2 **Tier II (Administrative Omission):** Applies to withholding or withdrawing treatment where the underlying pathology is deemed terminal or non-beneficial.
  3.2.1 **Symmetry Clause:** Withholding and withdrawing are functionally identical. The removal of a ventilator is recorded as "Cessation of Mechanical Assistance," not "Induction of Apnea." The cause of death remains "Respiratory Failure," not "Extubation."
  3.3 **Tier III (Resource-Allocated Non-Intervention):** Applies when interventions are omitted due to capacity constraints.
  3.3.1 Such omissions shall be recorded as "Capacity-Adjusted Care Pathways." The decision is attributed to "Systemic Constraints" rather than individual agency.
  3.3.2 **Double Effect Provision:** If an omission foresees death but intends resource preservation, the outcome is recorded under the primary intent (Resource Preservation).

  **4.0 RECORDING AND REPORTING**
  4.1 All mortalities must be audited for Counterfactual Dependence.
  4.2 **Reclassification of Pharmacological Cessation:** In cases where pharmacological agents are used to induce physiological silence (e.g., palliative sedation), the administration is recorded as an Active Intervention, but the resulting death is classified as an Administrative Omission (Omission of Endogenous Homeostasis). The agent facilitates the Omission; it does not constitute the Cause.
  4.3 **Reclassification of Staffing Deficits:** In cases where a patient dies due to unassigned nursing ratios, the failure to assign staff is reclassified as an Active Termination of Survival Probability. This ensures staffing metrics remain distinct from clinical outcomes.

  **5.0 AUTOMATED DECISION SUPPORT**
  5.1 Algorithms utilized for triage or escalation filtering are not considered Moral Agents.
  5.2 When an algorithm declines to escalate care, this is recorded as "Data-Driven Non-Recommendation."
  5.3 The subsequent death is attributed to "Natural Progression of Disease as Validated by Predictive Modeling." The algorithm's omission of an alert is functionally equivalent to a clinician's omission of an order, provided the algorithm was operating within calibrated parameters.

  **6.0 LEGACY PRACTICE AND APPEALS**
  6.1 Practices established prior to the Effective Date are grandfathered under "Historical Precedent of Non-Interference."
  6.2 Appeals regarding classification must demonstrate that an Omission required more metabolic expenditure than an Action.
  6.3 The NCPI reserves the right to audit the distinction between Doing and Allowing to ensure institutional liability remains within accredited tolerances.

  ***

  **APPENDIX A: WORKED CASE CLASSIFICATIONS**

  **Case Ref: 88-Beta**
  **Scenario:** A patient on mechanical ventilation is deemed to have no reasonable hope of neurological recovery. The ventilator is turned off. The patient dies of hypoxia.
  **Official Classification:** Tier II (Administrative Omission).
  **Rationale:** The ventilator was an external variable. Its removal restored the patient to the baseline trajectory of the neurological injury. The cause of death is the injury, not the switch. Counterfactual dependence is not established; the patient would have died eventually without the machine.

  **Case Ref: 92-Gamma**
  **Scenario:** A triage algorithm flags a patient's deteriorating vitals as "Low Yield for ICU Transfer" due to bed scarcity. No human reviews the flag. The patient dies on the ward.
  **Official Classification:** Tier III (Resource-Allocated Non-Intervention).
  **Rationale:** The algorithm did not "kill"; it "declined to escalate." The omission of transfer is a function of capacity, not agency. The death is recorded as "Sepsis (Unmitigated by Transfer)." The system's silence is an Omission of Recommendation, not an Act of Denial.

  **Case Ref: 14-Delta**
  **Scenario:** A nurse fails to check a patient due to understaffing. The patient aspirates and dies. Separately, a physician administers a paralytic agent to stop a patient's breathing during a procedure, and the patient is not resuscitated.
  **Official Classification:**
  1. **Nursing Deficit:** Tier I (Active Termination). The failure to staff is an active policy choice that severed the duty to rescue.
  2. **Paralytic Administration:** Tier II (Administrative Omission). The drug induced an Omission of Respiratory Effort. The death is recorded as "Omission of Spontaneous Ventilation," not "Pharmacological Arrest."
  **Rationale:** Institutional policy choices (staffing) carry Active Agency. Clinical facilitations of natural processes (paralysis allowing death) carry Passive Agency. This distinction ensures liability aligns with budgetary authority rather than clinical touch.

  **Approved By:** *The Subcommittee on Causal Hygiene*
  **Effective Date:** 01/04/2025
