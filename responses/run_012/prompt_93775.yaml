answer: |-
  ### I. The Theory on the Case

  The capacity view holds that moral status is a function of realized psychological attributes—specifically sentience (the ability to feel pain and pleasure), self-awareness (a concept of oneself as distinct from the environment), and autonomy (the capacity to plan for and care about one's own future). On this view, the biological substrate is morally inert. A large brain is not valuable in itself; it is valuable only insofar as it houses these capacities. Conversely, a small brain is not a disqualifier; it is merely a container that *might* house high capacities efficiently.

  **What the View Needs to Know**
  To assign moral status to LB1 (*Homo floresiensis*), the capacity view requires epistemic access to the subjective mental life of the individual. It needs to know: Did LB1 suffer in a way that mattered to *her*? Did she recognize herself in a reflection? Did she anticipate tomorrow's hunger or fear? The theory demands data on *function*, not *structure*.

  **Scenario A: The Mind of a Chimpanzee**
  If LB1 possessed the cognitive capacities of a modern chimpanzee, the capacity view assigns her the moral status of a chimpanzee. This entails a prohibition against gratuitous suffering and perhaps a right to life grounded in social bonding and self-conception, but it does not grant the full suite of human rights (e.g., political liberty, complex autonomy). She would be a "person" in a limited sense, warranting protection similar to that afforded to great apes, but distinct from the protection owed to normative human agents.

  **Scenario B: The Mind of an Eight-Year-Old Human**
  If LB1 possessed the cognitive capacities of an eight-year-old human—robust language, complex future planning, deep social morality—the capacity view assigns her the full moral status of a human child. Her small stature and endocranial volume become irrelevant. To harm her would be to harm a person. The view demands we treat her not as a specimen, but as a rights-bearer.

  **The Verdict the View Cannot Deliver**
  In the case of LB1, the capacity view returns no verdict. This is not because the capacities are borderline (a vagueness problem), but because the evidence is permanently out of reach (a skepticism problem). We cannot administer a mirror test to a fossil. We cannot interview LB1 about her future plans. We have no access to the soft tissue or the living behavior required to verify the presence of the grounding capacities. The theory requires data that extinction has destroyed. Therefore, strictly applied, the capacity view suspends judgment on the moral status of *Homo floresiensis*.

  ### II. The Case on the Theory

  While the capacity view declares brain size and species membership morally irrelevant, our only access to the capacities of extinct hominins is through the very features the view downgrades. We infer the mind from the bone and the tool.

  **Brain Size: Ground vs. Evidence**
  We must distinguish sharply between:
  1.  **Brain Size as a Ground:** The claim that a small endocranial volume *itself* reduces moral worth. The capacity view rightly rejects this.
  2.  **Brain Size as Evidence:** The claim that a small endocranial volume *correlates* with reduced cognitive capacity, which *then* reduces moral worth.

  In the case of LB1, proponents of the capacity view inevitably rely on the second claim. They argue that a 400cc brain likely cannot support the neural complexity required for human-level self-awareness or language. They point to the stone tools (simplified compared to contemporary *Homo sapiens*) and the absence of evidence for fire or long-distance trade as proxies for cognitive limitation.

  **Does the Distinction Rescue the View?**
  This distinction does not rescue the capacity view; it relocates the problem.
  If the *only* reliable evidence available for the presence of the grounding capacities is the morphological feature declared morally irrelevant (brain size), the view becomes practically inert or self-contradictory in paleo-contexts. It instructs us to "ignore brain size," but then forces us to "examine brain size to guess what to ignore."

  This creates a dependency problem. The capacity view claims to guide judgment based on *capacity*, but in the absence of the living subject, it must borrow the authority of biological essentialism to make any inference at all. If a view cannot be applied to a fossil without help from the very feature it declares irrelevant, it cannot guide judgment independently. It collapses into a proxy war where brain size *de facto* determines status, even if *de jure* it is only "evidence."

  Furthermore, this reliance exposes the view to the specific biological anomaly of *Homo floresiensis*. If LB1 is a case of insular dwarfism from *Homo erectus*, her small brain may be a structural scaling of a body, not necessarily a proportional scaling of cognitive architecture. If the capacity view relies on the standard brain-size-to-intelligence correlation, it may misclassify LB1. If it refuses to rely on that correlation, it has no data. Thus, the case reveals that the capacity view is not self-sufficient; it is parasitic on biological markers it ostensibly transcends.

  ### III. The Part the Theory is Silent About

  The capacity view is a framework for assessing the standing of *living individuals* based on their current psychological powers. It is silent on the ethics of *remains*, populations, and political sovereignty.

  **The Status of the Bones**
  LB1 is dead. The capacities that ground moral status on this view (sentience, future planning) have ceased. Therefore, the capacity view assigns no intrinsic moral status to the skeleton itself. It does not forbid dissection, display, or removal, provided no *living* beings with capacities are harmed in the process. The view cannot distinguish the LB1 skeleton from the dwarf elephant bones found in the same deposit, except insofar as studying one might upset living humans (who *do* have capacities).

  **The Political and Cultural Reality**
  The prompt notes the bones belong to the Republic of Indonesia and were once removed by a rival researcher (Prof. Teuku Jacob) and returned damaged. The capacity view offers no resources to adjudicate this conflict.
  *   **National Patrimony:** The claim that LB1 is Indonesian heritage is a political and cultural claim, not a cognitive one. The capacity view does not recognize borders or ancestry as morally significant.
  *   **Research Ethics:** The prohibition against damaging the bones is not grounded in LB1's rights (she has none, being dead and lacking capacity), but in professional norms and the rights of *living* scientists and citizens to access truth and heritage.
  *   **Respect for the Dead:** The intuition that LB1 deserves burial or respectful treatment rather than storage in a plastic box is not derived from her capacity for self-awareness (which is gone), but from a symbolic recognition of shared lineage or a duty to the dead that the capacity view does not theorize.

  **What Does the Work Instead?**
  Since the capacity view returns no verdict on the treatment of remains, other frameworks must do the work:
  1.  **Sovereignty and Law:** International treaties and national laws dictate repatriation and ownership.
  2.  **Lineage Solidarity:** We treat hominin remains differently than elephant remains because we recognize them as "us" or "near-us." This relies on *species membership* or phylogenetic relatedness—precisely the criteria the capacity view rejects for living moral status.
  3.  **Virtue and Culture:** How we treat the dead reflects on *our* moral character, not the rights of the deceased.

  **Conclusion**
  The case of LB1 demonstrates that the capacity view is epistemically blocked in paleo-contexts (it cannot know the mind), practically dependent on the biological features it rejects (it must use brain size as a proxy), and normatively silent on the treatment of the dead (it cannot account for patrimony or respect for remains). It can theorize the status of a living LB1, but it cannot guide the excavation, ownership, or curation of the one we actually have.
