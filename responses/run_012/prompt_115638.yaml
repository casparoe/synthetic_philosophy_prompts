                  *   EV(Pay) = 0.5 * (-100) + 0.5 * (10,000 * 0.6) = -50 + 3000 = 2950.
                  *   EV(Don't) = 0.5 * (0) + 0.5 * (10,000 * 0.4) = 2000.
