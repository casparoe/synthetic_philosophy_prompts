  9.  **Self-Correction/Nuance Check:**
      *   *Wait, is there a version where 60% changes things?* If the correlation is causal (e.g., Omega scans your brain *now*), then CDT pays. But the prompt specifies "predicted beforehand." So the causal link is broken.
