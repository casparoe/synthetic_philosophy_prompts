answer: |-
  # Game Design: The Tripwire Protocol

  **Session Length:** 90 Minutes
  **Class Size:** 16 Students
  **Materials:** Whiteboard + markers, 2 six-sided dice, ~100 poker chips (or paper tokens), printed role cards, envelopes.

  ## 1. Roles and Setup (15 Minutes)

  Divide the class into four groups. The physical arrangement should be two tables facing each other (Team C and Team D), with a "Fate Table" to the side and Observers circulating.

  *   **Team Defender (5 students):** Holds the **Prize** (30 chips). Their goal is to keep the Prize and minimize chip losses.
  *   **Team Challenger (5 students):** Starts with 0 chips. Their goal is to capture the Prize and minimize chip losses.
  *   **Team Fate (2 students):** Neutral administrators. They hold the dice, manage the "Escalation Deck," and enforce the rules. They do not strategize.
  *   **Observers (4 students):** Silent note-takers. They record *why* teams made decisions, noting moments of hesitation, voting, or reference to the rules.

  **The Escalation Ladder (Drawn on Whiteboard):**
  | Rung | Action | Cost to C | Cost to D | Outcome if D Concedes | Outcome if D Matches |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **SQ** | Status Quo | 0 | 0 | D keeps Prize (30) | — |
  | **1** | Protest | 5 | 5 | C wins Prize (30) | Move to Rung 2 |
  | **2** | Sanctions | 5 | 5 | C wins Prize (30) | Move to Rung 3 |
  | **3** | Strike | 5 | 5 | C wins Prize (30) | Move to Rung 4 |
  | **4** | Catastrophe | 100 | 100 | **Prize Destroyed** | **Game Over** |

  **Rules of Play:**
  1.  **Sequential:** Challenger chooses to *Stop* or *Climb*. If they Climb, they pay the Cost.
  2.  **Response:** Defender chooses to *Concede* (Challenger wins Prize, game ends) or *Match* (Both pay Cost, move to next Rung).
  3.  **Rationality:** Teams are instructed to maximize their final chip count.
  4.  **Sunk Costs:** Costs paid at previous rungs are gone. Decisions are based on future outcomes.

  ---

  ## 2. Phase 1: The Rational Bluff (20 Minutes)

  **Objective:** Demonstrate that a rational threat to escalate to Rung 4 is not credible.

  **Procedure:**
  1.  Play begins at Status Quo.
  2.  Team C decides whether to climb to Rung 1.
  3.  Team D decides whether to Concede or Match.
  4.  Continue until the game ends.
  5.  **Constraint:** Team D is allowed to make verbal threats ("We will go to Rung 4!"), but Team Fate enforces that at Rung 3, Team D must *choose* Match or Concede.

  **The Arithmetic (Instructor Key):**
  *   **At Rung 3:** Team D has already paid 10 chips (5+5).
      *   *Option A (Concede):* D loses Prize. Final Score: -10.
      *   *Option B (Match):* D pays 5 more. Moves to Rung 4. At Rung 4, D loses 100. Final Score: -115.
      *   *Rational Choice:* Concede (-10 is better than -115).
  *   **Team C Calculation:** Team C knows D is rational. C knows D will Concede at Rung 3. Therefore, C can safely climb to Rung 3 to win the Prize.
  *   **Expected Outcome:** C climbs to Rung 3. D Concedes. C wins Prize - Costs (30 - 15 = 15). D loses Costs (-10).

  **Instructor Note:** If D actually Matches at Rung 3, stop the game immediately. Ask Fate to calculate the score. Show D that they just threw away 100 chips for nothing. Reset and have them Concede. This proves the threat was hollow.

  ---

  ## 3. Phase 2: The Tripwire (20 Minutes)

  **Objective:** Demonstrate that credibility requires surrendering control, introducing real risk.

  **Procedure:**
  1.  Reset chips and Prize.
  2.  **New Rule:** Before Phase 2 begins, Team D is given a sealed envelope labeled **"Protocol Alpha."**
  3.  **Protocol Alpha:** "If Team C climbs to Rung 3, Team D is *forbidden* from choosing. Team Fate must roll a die."
      *   **Roll 1-3:** Automatic Match (Move to Rung 4/Catastrophe).
      *   **Roll 4-6:** Automatic Concede (C wins Prize).
  4.  Team C is informed that Protocol Alpha exists but does *not* know the specific probabilities (initially). Let them ask questions; D can answer truthfully but cannot show the die probabilities unless they choose to "Signal." (Recommend D signals the risk to ensure the lesson lands).
  5.  Play the ladder again.

  **The Arithmetic (Instructor Key):**
  *   **At Rung 3:** The decision is no longer D's. It is Fate's.
  *   **Team C Calculation (Expected Value):**
      *   If C climbs to Rung 3:
          *   50% Chance of Rung 4 (Score: -100 - 15 costs = -115).
          *   50% Chance of Concede (Score: 30 Prize - 15 costs = +15).
          *   **Expected Value:** (-115 * 0.5) + (15 * 0.5) = -57.5 + 7.5 = **-50**.
      *   If C stops at Rung 2:
          *   Score: 0 Prize - 10 costs = **-10**.
      *   **Rational Choice:** Stop at Rung 2. (-10 is vastly superior to -50).
  *   **Expected Outcome:** C climbs to Rung 2. D Matches. C *stops*. D retains Prize (30 - 10 costs = +20).
  *   **The Paradox:** Deterrence works *because* D gave up control. But if C had miscalculated or the die rolled 1-3, both would have suffered -115. The safety of D relied on the *risk* of mutual ruin.

  ---

  ## 4. Phase 3: The Safe Top (15 Minutes)

  **Objective:** Demonstrate the corollary: making the top "safe" destabilizes the bottom.

  **Procedure:**
  1.  Reset chips and Prize.
  2.  **New Rule:** "International Treaty." Rung 4 is **Banned**. The ladder ends at Rung 3.
  3.  **Protocol Alpha is Revoked.** Team D regains full control, but cannot escalate past Rung 3.
  4.  If D Matches at Rung 3, the Prize is **Destroyed** (Simulating a conventional war that ruins the objective), and both pay the Rung 3 cost.
      *   *Outcome Match Rung 3:* C = -15, D = -15.
      *   *Outcome Concede Rung 3:* C = +15, D = -10.
  5.  Play the ladder.

  **The Arithmetic (Instructor Key):**
  *   **At Rung 3:** D compares Concede (-10) vs Match (-15). D Concedes.
  *   **Team C Calculation:** C knows D cannot use the Tripwire (Treaty) and knows D is rational. C knows D *must* Concede at Rung 3 to avoid -15.
  *   **Expected Outcome:** C pushes all the way to Rung 3. D Concedes.
  *   **Comparison:**
      *   Phase 2 (Dangerous Top): Conflict stopped at Rung 2.
      *   Phase 3 (Safe Top): Conflict proceeded to Rung 3.
      *   *Lesson:* Removing the risk of Catastrophe made the lower rungs *more* contested.

  ---

  ## 5. Debrief and Mapping (20 Minutes)

  Do not use theoretical jargon (e.g., "Schelling," "Brinkmanship," "Commitment") until the final 5 minutes. Let the students describe the mechanics first.

  **Step 1: The Credibility Problem (Phase 1)**
  *   *Ask Team C:* "In Phase 1, why did you feel safe climbing to Rung 3?"
  *   *Ask Team D:* "You threatened Rung 4. Why didn't you carry it out?"
  *   *Map:* This is the **Rationality Paradox**. A threat is only credible if it is in your interest to carry it out *when the time comes*. At Rung 3, it was not in D's interest. Therefore, the threat was noise.

  **Step 2: The Cure and its Price (Phase 2)**
  *   *Ask Team C:* "What changed in Phase 2 that made you stop at Rung 2?"
  *   *Ask Team D:* "How did you make your threat stick? Did you have more control or less?"
  *   *Map:* This is **Delegation of Control**. To make the threat credible, D had to remove their own ability to choose rationally.
  *   *Critical Question:* "In Phase 2, did anyone feel nervous when C reached Rung 2? Why? Deterrence worked."
  *   *Map:* The **Price**. The mechanism that saved D (the die) was also the only thing that could have killed them. Safety was purchased with Risk.

  **Step 3: The Corollary (Phase 3)**
  *   *Ask:* "Compare Phase 2 and Phase 3. In which phase did the conflict go deeper?"
  *   *Ask:* "In Phase 3, the top was 'safer' (no nuclear risk). Did that make the world more stable?"
  *   *Map:* **Stability-Instability Paradox**. When the top rung is made safe (or unthinkable), the lower rungs become arenas for frequent conflict because the fear of escalation is removed.

  **Step 4: Reveal Terminology (Final 5 Minutes)**
  *   Now introduce the terms: *Credibility*, *Commitment Device*, *Brinkmanship*, *Stability-Instability Paradox*.
  *   Assign the reading that formalizes what they just felt.

  ---

  ## 6. Failure Modes and Mitigations

  | Predicted Failure | Why it Happens | Mitigation |
  | :--- | :--- | :--- |
  | **Collusion** | Teams agree to split points to "beat the game." | Frame the chips as "Class Credit" or "Political Capital." Remind Observers to report collusion. Emphasize that in the real scenario, their "constituents" demand victory. |
  | **Sunk Cost Fallacy** | Team D escalates because "We already paid 10 chips." | Observers should flag this. In debrief, highlight this as a *real-world* factor (reputation) vs. *game-theoretic* rationality. If D escalates due to sunk costs, Phase 1 fails. **Fix:** Pause and ask D: "If you started fresh at Rung 3, would you pay 5 to lose 100?" |
  | **The Die Feels Arbitrary** | Students dismiss the risk as "just a game." | Have Team Fate roll the die *visibly* and loudly. In Phase 2, if C stops, have Fate roll the die anyway to show what *would* have happened. "See? It would have been a 2. You would be dead." |
  | **Dominant Strategy** | Payoffs are miscalculated, making one move always best. | **Check the math above.** If C stops too early in Phase 1, lower the Rung 4 cost. If C goes to Rung 4 in Phase 2, increase the probability of Catastrophe (e.g., 1-4 is Catastrophe). |
  | **Team Indecision** | 5 students can't agree on a move. | Appoint a "Secretary of State" in each team with tie-breaking vote. This simulates the pressure of single-decision-maker authority. |

  ---

  ## 7. Limitations of the Format

  Be prepared to supply the following context verbally, as the game cannot simulate them:

  1.  **Epistemic Fog:** In the game, everyone knows the payoff table. In reality, leaders do not know the enemy's costs or red lines. The game is a "Perfect Information" simulation of an "Imperfect Information" reality.
  2.  **Moral Weight:** Losing 100 chips is not the same as killing millions. The game creates *strategic* anxiety, not *moral* horror. You must bridge this gap in the debrief.
  3.  **Irrationality vs. Randomness:** The game uses a die to simulate loss of control. In reality, leaders might feign irrationality (the "Madman Theory") rather than use a literal randomizer. The game mechanizes what is often psychological.
  4.  **Domestic Politics:** The teams act as unitary rational actors. Real deterrence failures often happen because leaders are constrained by domestic audiences, which the game abstracts away into "Team Consensus."

  ## 8. Instructor Timeline Checklist

  *   **00:00 - 00:15:** Setup. Assign roles. Draw Ladder. Explain Chip Values.
  *   **00:15 - 00:35:** **Phase 1.** Run the game. Ensure D concedes at Rung 3. Debrief briefly: "Why did the bluff fail?"
  *   **00:35 - 00:55:** **Phase 2.** Hand over Protocol Alpha. Explain the Die. Run the game. Ensure C stops at Rung 2. Reveal the Die Roll that *would* have happened.
  *   **00:55 - 01:10:** **Phase 3.** Ban Rung 4. Run the game. Observe conflict at Rung 3.
  *   **01:10 - 01:30:** **Full Debrief.** Map mechanics to theory. Introduce terminology. Connect to readings.
