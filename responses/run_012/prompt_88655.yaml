  Here is my opening move, and I should warn you that I invented it myself and am not certain what to make of it. I have been worrying at the preface case, where an author believes each of her claims and then admits in her preface that at least one of them is false. In the usual telling the trouble depends on probabilities: each claim is very likely on its own, their conjunction is not. I wanted a version in which probability plays no part at all, so I constructed this. A book contains exactly two claims, and the first of them is the preface sentence, which reads: exactly one of the two claims in this book is false. The second claim is the body of the book, and I have deliberately not told you what it says. Now I reason as follows. If the preface sentence is true, then exactly one of the two claims is false, and since the preface sentence is true the false one must be the body claim. If the preface sentence is false, then the number of false claims is not one; it is either none or two, and it cannot be none, because the preface sentence is false; so both claims are false, and the body claim is false again. Either way the body claim is false, whatever it says. So an author who opens a two-sentence book that way has guaranteed by logic alone, before writing a word of the body, that whatever she writes next is false. Nothing probabilistic has entered anywhere.

