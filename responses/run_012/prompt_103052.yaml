answer: |-
  Here is the specification of desiderata for a theory of welfare utility, calibrated to the problem of licensing or forbidding soft paternalism without circularity.

  ### I. Phenomena the Theory Must Accommodate

  **1. Procedural Invariance vs. Preference Stability**
  *   **Requirement:** The theory must distinguish between instability in the *preference relation* and instability in the *choice function* induced by presentation order or cognitive load.
  *   **Motivation (Case 1):** An agent chooses $A \succ B \succ C \succ A$ based on presentation order but writes down a transitive ranking $A \succ B \succ C$. A theory that identifies welfare strictly with choice data must declare the agent's welfare intransitive (making optimization impossible). A theory that identifies welfare with the written report risks ignoring the actual constraints the agent faces. The theory must specify which data stream (action vs. endorsement) tracks welfare and why, without simply asserting the answer.
  *   **Status:** [NON-NEGOTIABLE FOR PATERNALISM]

  **2. Ontological Independence of the State Space**
  *   **Requirement:** The theory must provide a method to identify the *objects* of choice (the state space) independently of the choice data itself. It must distinguish between choosing a substance and choosing a relief from withdrawal, or choosing a habit and choosing under a constraint.
  *   **Motivation (Case 2):** An agent's behavior satisfies WARP (Weak Axiom of Revealed Preference) whether modeled as maximizing a taste for a habit or maximizing a preference *against* the habit subject to a self-control constraint. The choice data are identical. To justify intervention (e.g., a cooling-off period), the theory must identify the latter description as the welfare-relevant one. If the state space is inferred solely from choices, this distinction is impossible.
  *   **Status:** [NON-NEGOTIABLE FOR PATERNALISM]

  **3. Framing and Menu Dependence**
  *   **Requirement:** The theory must determine whether a change in choice due to framing represents a change in welfare or a distortion of welfare measurement.
  *   **Motivation:** Nudges work by framing. If welfare is frame-relative, a nudge cannot be said to improve welfare, only to change it. If welfare is frame-invariant, the theory must identify the invariant description of the outcome that the agent "really" cares about.
  *   **Status:** [NON-NEGOTIABLE FOR PATERNALISM]

  **4. Choice-Report Divergence**
  *   **Requirement:** The theory must adjudicate conflicts between revealed choice and reported satisfaction/endorsement without defaulting to a "true self" metaphor that lacks operational criteria.
  *   **Motivation:** People often choose what they later report made them miserable (e.g., addictive goods, overwork). A welfare theory must explain why the later report might carry more normative weight than the immediate choice without simply stipulating that "later is better."
  *   **Status:** [NON-NEGOTIABLE FOR PATERNALISM]

  ### II. Distinctions the Theory Must Maintain

  **5. Preference vs. Welfare**
  *   **Requirement:** The theory must allow for the logical possibility that satisfying a preference disserves welfare.
  *   **Motivation:** Soft paternalism is definitionally impossible if Preference $\equiv$ Welfare. To evaluate a nudge, one must be able to say, "They chose X, but X was bad for them."
  *   **Status:** [NON-NEGOTIABLE FOR PATERNALISM]

  **6. Actual vs. Informed/Competent Choice**
  *   **Requirement:** The theory must define "better information" or "competence" without referencing the welfare outcome it is meant to predict.
  *   **Motivation:** To claim a choice was "mistaken" due to misinformation, one needs a counterfactual: what they would have chosen with better info. If "better info" is defined as "info that leads to the choice the theorist prefers," the argument is circular.
  *   **Status:** [NON-NEGOTIABLE FOR PATERNALISM]

  **7. First-Order vs. Higher-Order Attitudes**
  *   **Requirement:** The theory must specify the conditions under which a second-order desire (e.g., "I wish I didn't want this") overrides a first-order preference in welfare calculations.
  *   **Motivation:** Essential for addiction and habit cases (Case 2). Without this, the theory cannot distinguish between a sophisticated agent managing a constraint and an agent suffering from a compulsion.
  *   **Status:** [COMMITMENT OF AUTONOMY-BASED CAMPS] (Strict welfarists may reject this).

  **8. Ordinal vs. Cardinal Measurement**
  *   **Requirement:** The theory must justify any move from ordinal ranking to cardinal measurement of harm/benefit.
  *   **Motivation:** Policy requires weighing costs against benefits. If utility is only ordinal (per standard representation theorems), one cannot say a nudge prevents a "large" harm for a "small" cost.
  *   **Status:** [NON-NEGOTIABLE FOR POLICY APPLICATION]

  **9. Intrapersonal vs. Interpersonal Comparison**
  *   **Requirement:** The theory must clarify whether welfare metrics are comparable across persons.
  *   **Motivation:** Policy affects distributions. A theory that works for individual nudges may fail for population-level mandates if interpersonal comparison is undefined.
  *   **Status:** [COMMITMENT OF UTILITARIAN CAMPS] (Prioritarians or Sufficientarians may differ).

  ### III. Formal Constraints

  **10. Representation Theorem Limits**
  *   **Requirement:** The theory must acknowledge that choice data fixes the utility index only up to a monotonic transformation. Any claim about the *magnitude* of welfare gain is extra-structural.
  *   **Motivation:** Prevents smuggling cardinal claims into ordinal models.
  *   **Status:** [FORMAL NON-NEGOTIABLE]

  **11. State Space Identification**
  *   **Requirement:** The theory cannot derive the description of the world solely from the choices made within it.
  *   **Motivation:** As noted in Requirement 2, choice data underdetermines the state space.
  *   **Status:** [FORMAL NON-NEGOTIABLE]

  ---

  ### IV. Impossibility Results and Incompatibilities

  **The Normative Closure Problem**
  *   **Conflict:** Requirements 1, 2, & 5 (Welfare $\neq$ Choice; State Space Independence) are incompatible with a Strict Revealed Preference ontology.
  *   **Explanation:** If you insist that utility is *defined* by choice (Strict RP), you cannot satisfy Req 5. If you satisfy Req 5 by positing a "true" preference distinct from choice, you violate the empirical discipline of RP and must import an external psychological or normative standard.
  *   **Verdict:** You cannot have a theory that is both **purely choice-based** and **capable of licensing paternalism**. One must be abandoned.

  **The Information Circularity**
  *   **Conflict:** Requirement 6 (Actual vs. Informed) vs. Requirement 5 (Preference $\neq$ Welfare).
  *   **Explanation:** To define "Informed Choice" without circularity, you need a standard of welfare independent of choice. But if you have that standard (Req 5), you no longer need the "Informed Choice" proxy to measure welfare; you can just use the standard.
  *   **Verdict:** Informed-Desire accounts often collapse into the objective standard they try to avoid, or they remain empty because "information" cannot be defined neutrally.

  **The Cardinality Gap**
  *   **Conflict:** Requirement 8 (Cardinal Measurement) vs. Requirement 10 (Representation Theorem).
  *   **Explanation:** Standard choice theory yields ordinal utility. Policy requires cardinal trade-offs. Bridging this gap requires assuming interpersonal comparability or specific functional forms (e.g., risk attitudes) that are not revealed by simple choice data.
  *   **Verdict:** A theory based solely on deterministic choice data cannot support cost-benefit analysis without additional, unverified structural assumptions.

  ---

  ### V. Classification of Requirements

  *   **Non-Negotiable (For Your Project):** 1, 2, 3, 4, 5, 6, 8, 10, 11. (Without these, you cannot distinguish a nudge that helps from a nudge that manipulates, nor can you measure the net benefit).
  *   **Camp Commitments:** 7 (Higher-Order Authority is rejected by standard hedonists and strict RP theorists), 9 (Interpersonal Comparison is rejected by strict Paretians).

  ### VI. The Single Most Eliminative Requirement

  **Requirement 2: Ontological Independence of the State Space.**

  This is the technical bottleneck that kills the most candidates.
  *   **Why:** Strict Revealed Preference theory assumes the state space is given or inferred from choices. If the state space must be identified *independently* of choice data to solve Case 2 (Habit vs. Constraint), Strict RP is formally disqualified.
  *   **Impact:** It forces the theorist to import psychology (to identify constraints), neuroscience (to identify cravings), or objective list items (to identify goods) *before* analyzing choice. This destroys the "behaviorist purity" of standard welfare economics. It eliminates any theory that claims to derive welfare *solely* from observed choices.

  ### VII. Brief Assessment of Candidate Theories

  **1. Strict Revealed Preference**
  *   **Score:** Fails Requirements 1, 2, 4, 5.
  *   **Assessment:** Formally rigorous but normatively inert for your purpose. It cannot distinguish Case 1 (error vs. preference) or Case 2 (habit vs. constraint) without smuggling in external assumptions. It defines away the possibility of soft paternalism by equating choice with welfare.

  **2. Hedonism (Experienced Utility)**
  *   **Score:** Passes Requirements 4, 5, 6. Fails Requirement 8 (Cardinal Measurement/Interpersonal Comparison is difficult).
  *   **Assessment:** Successfully distinguishes choice from welfare (people choose things that make them miserable). Handles Case 2 well (habit choice $\neq$ hedonic gain). However, it struggles with the "Experience Machine" objection and faces severe measurement hurdles in policy contexts (how to aggregate reported affect).

  **3. Informed-Desire Accounts**
  *   **Score:** Passes Requirement 5. Fails Requirement 6 (Circularity risk).
  *   **Assessment:** Attempts to split the difference. However, defining "informed" without referencing the *outcome* of the choice usually requires an objective list of what counts as relevant information, which collapses the view back into Objective List or Hedonism. It handles Case 1 poorly (is the transitive report the "informed" one, or the result of a deliberative nudge?).

  **Summary:** To license soft paternalism, you must abandon Strict Revealed Preference. The choice is between Hedonism (measure feelings) or an Objective/Informed Hybrid (measure capabilities/functionings), both of which require data beyond choice.
