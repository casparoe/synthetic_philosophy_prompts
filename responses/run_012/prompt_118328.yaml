prompt: |-
  I host a podcast on decision theory and the philosophy of rational choice, and my next guest is a philosopher of economics who defends an unusually strong line on satisficing: she holds that satisficing is not a second-best procedure for agents too limited to optimize, but the primary form of rational choice, with utility maximization as a degenerate special case that applies only when the option set is given, finite, and fully ordered. Her central distinction is between satisficing as a stopping rule — a way of ending search once an option clears a threshold — and satisficing as a constitutive claim, on which the adequacy of an option is settled before and independently of any comparison among options; she argues that most of the literature collapses these two, and that the collapse is what makes bounded rationality look like a confession of failure. She also insists that the familiar objection that satisficers can be exploited or leave money on the table equivocates between ex ante and ex post rationality. Treat her as defending exactly this package; there is no need to tie her to any particular published author.

  Draft eight to ten interview questions that go beyond having her restate the view. I want at least one question each on: the charge that satisficing licenses anything at all, and what her threshold actually rules out; how aspiration levels themselves get set, and whether that story invites a regress or a circularity; the dispute over whether heuristics are genuinely rational or merely efficient, and where she thinks the heuristics-and-biases tradition goes wrong; and the normative question of whether her account can still call a decision bad rather than merely unusual. For each of those four, add a follow-up keyed to the answer she is most likely to give, so I can keep the exchange moving when she reaches for a stock reply. Also include one question built around a case where stopping early looks plainly wrong — a clinician settling for the first treatment that seems adequate, say — and press her on whether her constitutive reading of adequacy can tell that case apart from a legitimate one. Close with a question about what would count as evidence against her view, and one about what, if anything, she thinks the optimizer's ideal gets right that her account loses.

  Write the questions in American English, in the register of a serious interview rather than a lecture, and make clear where a question is meant to be hostile and where it is meant to give her room to develop a point.
