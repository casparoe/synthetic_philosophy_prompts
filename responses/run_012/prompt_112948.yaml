answer: |-
  # Activity Design: "The Stratigraphy of the Breakroom"

  ## Concept Overview
  This is a three-phase simulation game played across three tables (6 participants per table). Each table acts as a distinct "culture" generating material traces, then as "nature/time" filtering those traces, and finally as "researchers" interpreting the result.

  The core tension is engineered by the **Information Asymmetry**:
  1.  **Generators** know the *Belief* but not the *Filter*.
  2.  **Filters** know the *Rule* but not the *Belief*.
  3.  **Interpreters** know neither, only the *Result*.

  The scoring system rewards **Confidence**, setting the trap for the debrief where confidence is revealed to be unjustified.

  ---

  ## 1. Materials List (Cheap & Printable)

  **Per Table (3 Tables Total):**
  *   **1 Large Sheet of Butcher Paper** (labeled "The Site").
  *   **1 "Culture Envelope"** (sealed, contains Belief Cards).
  *   **1 "Filter Envelope"** (sealed, contains Degradation Rules).
  *   **1 Box of Mundane Objects:**
      *   20 Paperclips (mixed colors).
      *   10 Rubber bands.
      *   10 Sticky notes (yellow).
      *   5 Pens (caps removable).
      *   3 Clean, empty coffee cups (paper).
      *   2 Candy wrappers (crumpled).
      *   1 Small stone or token.
  *   **1 Set of "Grant Tokens"** (10 poker chips or printed circles per person).
  *   **1 Timer** (phone).

  **Printable Content (Sketches):**

  **A. Belief Cards (Inside Culture Envelope)**
  *Do not label these "Beliefs." Label them "Operating Principles."*
  *   **Card 1:** *The Principle of Presence.* "An empty desk is dangerous. Never leave a surface completely clear. Always leave at least one object behind when you walk away."
  *   **Card 2:** *The Principle of Order.* "Chaos invites error. All writing instruments must be capped. All paper must be stacked neatly. If you use a cup, crush it before discarding."
  *   **Card 3:** *The Principle of Connection.* "Work is social. Objects used by one person must be touched by another before storage. Pass the pen. Share the cup."

  **B. Degradation Rules (Inside Filter Envelope)**
  *Label these "Site Formation Protocols."*
  *   **Rule 1 (Organic Decay):** "Remove all paper products (sticky notes, cups, wrappers). Keep only durable goods (pens, clips, bands)."
  *   **Rule 2 (Scavenging):** "Remove all metal objects (clips, pens). Keep only disposables."
  *   **Rule 3 (Curation):** "Remove any object that is not touching another object. Isolated items are discarded."

  **C. Interpretation Sheet (Handout for Phase 3)**
  *   **Section 1: The Assemblage.** (List what remains).
  *   **Section 2: The Narrative.** (Write a 3-sentence story about what these people valued).
  *   **Section 3: The Confidence Bid.** (Wager 1–5 Grant Tokens on how 'true' this narrative is).

  ---

  ## 2. Role Structure & Scoring

  **The Stake:** "Publication Prestige."
  There is no money. The winning table earns the right to **choose the topic for the next workshop**. This creates social stakes within a community of peers.

  **The Scoring Trap:**
  *   Tokens are awarded for **Coherence** (does the story fit the objects?) during Phase 3.
  *   Tokens are *risked* during the Confidence Bid.
  *   **The Twist:** In the debrief, you reveal that *no narrative can be proven true*. The "Winning" table is actually the one that *lost the most tokens* because they realized the ambiguity too late, OR you declare no winner and award the choice to the table that articulated the *uncertainty* best.
  *   *Recommendation:* To keep the sting sharp, award the "Next Topic" choice to the table with the **most coherent narrative** (Phase 3), then immediately dismantle that coherence in the debrief. This mirrors the real-world pressure to publish confident claims despite shaky foundations.

  ---

  ## 3. Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Setup**
  *   Divide into 3 Tables (A, B, C).
  *   Distribute Object Boxes and Butcher Paper.
  *   **Rule:** "You are a team sharing a workspace over one week. You cannot speak during the creation phase. You must act out your Principles using the objects."
  *   Hand **Culture Envelopes** to Table A, B, C. (They do not open them yet).

  **00:10 – 00:30: Phase 1 — Generation (The Palimpsest)**
  *   Tables open Culture Envelopes.
  *   **Round 1 (5 mins):** Simulate "Monday." Arrange objects on the paper according to your Principle.
  *   **Round 2 (5 mins):** Simulate "Wednesday." Add/Move objects. *Do not clear the table.* Just add to the pile. (This creates the **Frozen Moment** trap; the pile now contains Monday + Wednesday mixed).
  *   **Round 3 (5 mins):** Simulate "Friday." Add/Move objects.
  *   **Cleanup (5 mins):** Remove your Belief Cards. Leave *only* the objects on the paper. Do not label anything.

  **00:30 – 00:45: Phase 2 — Formation (The Filter)**
  *   **Rotate:** Table A's Site moves to Table B. Table B's Site moves to Table C. Table C's Site moves to Table A.
  *   Tables open the **Filter Envelopes** found at their *new* table.
  *   **Action (10 mins):** Apply the Degradation Rule strictly. Remove/Destroy the specified items. Put them in a "Trash" bag (out of sight).
  *   **Scatter (5 mins):** Gently mix the remaining objects so their original positions are lost.
  *   *Note:* The Filters now hold the "Truth" of what was removed, but they cannot speak to the Interpreters.

  **00:45 – 01:10: Phase 3 — Interpretation (The Claim)**
  *   **Rotate Again:** Table A's Site moves to Table C. Table B's Site moves to Table A. Table C's Site moves to Table B. (Everyone interprets a site they neither created nor filtered).
  *   **Analysis (15 mins):** Examine the remaining objects. Fill out the Interpretation Sheet. Construct a narrative about the "Culture's Values."
  *   **Bidding (5 mins):** Decide as a table how confident you are. Wager Grant Tokens on your narrative.
  *   **Submission (5 mins):** Hand sheets to Facilitator.

  **01:10 – 01:30: Phase 4 — Debrief (The Collision)**
  *   Facilitator leads the mapping (see below).
  *   Reveal the original Belief Cards and Filter Rules.
  *   Compare Interpretations to Origins.
  *   Award the "Next Workshop Topic" prize.

  ---

  ## 4. Debrief Script: Mapping the Collision

  Do not lecture. Ask questions that force them to articulate the failure points.

  **Mapping Point 1: The Frozen-Moment Assumption**
  *   *Ask:* "Look at the pile you interpreted. Did you assume the pen and the coffee cup were there at the same time?"
  *   *Reveal:* "In Phase 1, Round 1 and Round 3 were separated by 'days.' You mixed them into one pile. The Interpreters treated a week of accumulation as a single snapshot."
  *   *The Lesson:* "When you wrote your narrative, you assumed a single context. In reality, the assemblage was a palimpsest. The pen might be from Monday, the cup from Friday. They never met."

  **Mapping Point 2: Formation Processes**
  *   *Ask:* "Table B (who filtered Table A's site), what did you throw away?"
  *   *Reveal:* "You threw away the paper. Table C (Interpreters), you never saw the sticky notes. You built a theory of 'Oral Culture' because the written evidence was deleted by a rule you didn't know."
  *   *The Lesson:* "The record isn't just what survived decay; it's what survived *policy*. The bias is structured. If the rule was 'Keep Metal,' you would have written a theory about an 'Industrial Culture.' Same people, different filter, different truth."

  **Mapping Point 3: Doing vs. Believing (The Core)**
  *   *Ask:* "Table A, your card said 'Never leave a surface clear.' Table C, what did you write about that pen left on the desk?"
  *   *Likely Response:* "They were working." or "They forgot it."
  *   *The Reveal:* "They didn't forget it. They *left it on purpose* to satisfy a belief. But the object looks exactly the same as a forgotten pen."
  *   *The Lesson:* "An object testifies to an action (placing a pen), not a motivation (fear of emptiness). You can document the doing. The believing is a ghost. You filled the ghost with your own logic."

  **The Confidence Trap**
  *   Highlight the Grant Token wagers. "You wagered tokens on a story that was structurally impossible to verify. Why did you feel confident?"
  *   *Answer:* "Because the narrative was coherent."
  *   *Closing:* "Coherence is not truth. It is just good storytelling. In your reporting, coherence is your product. But it is also your greatest liability."

  ---

  ## 5. Failure Modes & Contingencies

  **Failure Mode 1: The "Note" Cheat**
  *   *Risk:* During Phase 1, participants write "We believe X" on a sticky note.
  *   *Fix:* **Pre-emptive Rule:** "Writing is allowed only for labels or lists. No sentences explaining *why* you are doing something."
  *   *In-Run Fix:* If you see it during Phase 1, walk by and quietly remove the note as a "natural decay event." Don't make a scene. Just let it vanish.

  **Failure Mode 2: The Filter is Too Aggressive**
  *   *Risk:* A Filter Rule removes *everything* (e.g., "Remove all small objects" when only small objects exist).
  *   *Fix:* Have a backup "Moderate Filter" card ready to swap in if you see a table staring at an empty sheet.
  *   *Prevention:* Test the Object Box against the Filter Rules beforehand. Ensure at least 40% of items survive any rule.

  **Failure Mode 3: Interpreters Hedge Too Much**
  *   *Risk:* They write "It could be anything" and wager 0 tokens. This avoids the trap.
  *   *Fix:* **Minimum Wager Rule.** "To publish a report, you must wager at least 2 tokens." Force them to commit.
  *   *Facilitator Move:* During Phase 3, circulate and pressure them. "The magazine needs a headline. What's the headline?"

  **Failure Mode 4: Time Creep**
  *   *Risk:* Phase 1 (Creation) becomes chatty and long.
  *   *Fix:* Use a loud timer. When time is up, shout "Hands off the Site." Enforce it strictly. The rush creates the "Frozen Moment" error naturally (they don't have time to organize, they just dump).

  ---

  ## 6. Honesty Clause: What This Activity Cannot Do

  You asked for honesty about which idea the activity cannot reproduce.

  **The Limitation: The Asymmetry of Belief**
  The activity *simulates* a belief (the Card). It implies that there *was* a specific, singular belief driving the action.
  *   **In the Room:** There is a "True Belief" (the Card). The Interpreters are "wrong" if they don't match it.
  *   **In Reality:** There is no Card. The "belief" might not have existed as a coherent unit. The people might have been acting on habit, contradiction, or conflicting impulses.
  *   **The Gap:** The game reinforces the idea that if we just had *better data*, we could find the True Belief. Real archaeology suggests the True Belief is often a projection of the interpreter.
  *   **Your Burden:** You must supply this in the closing remarks. You have to tell them: *"In this game, Table A actually had a rule. In the real world, the 'Rule' is often something we invent to make the pile of objects feel safe. The asymmetry isn't just that belief leaves no trace; it's that belief might not be a 'thing' that can be found."*

  This distinction is crucial. The game teaches them that **inference is hard**. You must teach them that **inference is often ontological fiction**. The game sets the table; you must serve the final, uncomfortable dish.
