answer: |-
  You have identified a genuine and well-documented phenomenon, though it does not bear a single, canonical noun in the way that, say, 'Gresham's Law' does. In the literature of decision theory, psychology, and philosophy, this configuration is typically discussed as the **Problem of Rational Choice under Indifference**, often analysed through the lens of **Maximisation** and **Reason-Based Choice**.

  Here is a breakdown of the concepts at play, how they differ from adjacent problems, and a plain assessment of your framing.

  ### 1. Is there an established concept?
  There is no single term that captures the *entirety* of the configuration you describe, but it is the intersection of three established ideas:

  *   **Maximisation (Psychology):** Coined by Barry Schwartz, this describes individuals who seek the *best* possible option rather than one that is 'good enough' (satisficing). For a Maximiser, if Option A and Option B are equal, neither is *better*. Therefore, choosing one feels like a failure to identify the 'best', leading to paralysis. The demand for a tie-breaking reason is a demand for superiority that does not exist.
  *   **Reason-Based Choice (Behavioural Economics):** Work by Shafir, Simonson, and Tversky demonstrates that people often defer decisions when they lack a compelling *reason* to choose one option over another. Crucially, they found that the *absence* of a reason is often treated as a positive reason to delay. This matches your observation exactly: the lack of a differentiator becomes the differentiator for inaction.
  *   **The Principle of Sufficient Reason (Philosophy):** Your clients are implicitly adhering to a Leibnizian notion that nothing occurs without a sufficient cause or reason. They are applying a metaphysical principle to normative choice. They believe that to act without a preferential reason is to act *acausally* or *irrationally*.

  While 'Buridan's Ass' is the historical ancestor of this problem, you are correct to distinguish your cases. Buridan's Ass is a paradox about determinism and free will (the donkey *cannot* move). Your clients *can* move but believe they *ought not* to without justification. A more precise philosophical label for their specific blockage is **Normative Paralysis under Indifference**.

  ### 2. Is your framing confused?
  You asked for plainness if your framing is flawed. There are two components to your framing: the equality of the options, and the rationality of the choice.

  **On Exact Equality:**
  Metaphysically, it is highly improbable that two complex options (jobs, flats) are *exactly* equal in utility. However, in decision theory, we operate on the **threshold of discrimination**. If the difference is below the agent's ability to perceive or value it, they are functionally indifferent. Your framing here is not confused; practically speaking, the tie is real. Do not waste time trying to convince clients there is a 'hidden difference'; they will find one and discount it, as you have observed.

  **On the Rationality of Arbitrary Choice:**
  Here, your clients' framing (and potentially yours, if you are unsure) is confused. In standard Rational Choice Theory, **arbitrary choice under indifference is perfectly rational.**
  Rationality requires that your choices cohere with your preferences. If you prefer A to B, choose A. If you are indifferent between A and B, choosing either (or flipping a coin) satisfies the requirements of rationality. The belief that one *must* have a preferential reason to break a tie is a **category error**. It conflates *optimisation* (finding the best) with *rationality* (acting consistently with values).

  Therefore, the demand for a reason is indeed the problem. The agents are suffering from a **misconception of rationality**. They believe rationality requires a *causal explanation* for the specific selection, whereas it only requires *justification* for the permissibility of the selection.

  ### 3. Distinction from Incommensurability and Indecisiveness
  It is vital to distinguish this from **Incommensurability**, a concept championed by philosopher Ruth Chang.
  *   **Indifference (Your cases):** The options are on the same scale and weigh the same. (e.g., £50k vs £50k).
  *   **Incommensurability:** The options cannot be measured on a common scale. (e.g., A high-paying job vs. a moral calling). Here, one is not 'equal' to the other; they are 'on a par'.
  *   **Why it matters:** In incommensurable choices, Chang argues that reasons *run out*, and the agent must *create* a reason through commitment. In your cases of indifference, reasons have not run out; they have balanced out. However, Chang's solution applies: the agent must stop *finding* reasons and start *making* them.

  It also differs from **Mere Indecisiveness**. Indecisiveness is usually emotional (fear of regret, anxiety, lack of confidence). Your clients are presenting a *principled* objection. They are not saying "I am scared"; they are saying "It would be illogical." This makes it harder to treat with reassurance and requires a logical intervention.

  ### 4. Is the agent right that arbitrary choice is irrational?
  No. The agent is wrong.
  If an agent is truly indifferent, the Expected Utility of Option A equals the Expected Utility of Option B.
  $$EU(A) = EU(B)$$
  Therefore, any probability distribution over {A, B} yields the same expected utility. Picking A with 100% probability is mathematically equivalent to picking A with 50% probability.
  To insist on a reason is to impose a cost (time, delay, stress) on a decision process that yields no additional utility. Thus, **insisting on a reason is itself the irrational act**, because it incurs a cost without improving the outcome.

  ### 5. Practical Implications for Counselling
  Since the blockage is a normative misconception rather than an emotional fear, cognitive reframing is required.

  1.  **Validate the Indifference:** Confirm that finding two options equal is a success of their analysis, not a failure. It means they have identified two 'best' options.
  2.  **Reframe Rationality:** Explain that rationality governs the *process*, not the *tie-break*. A random tie-break is a rational procedure when inputs are equal.
  3.  **The 'Making Reasons' Approach (Ruth Chang):** Advise the client that since reasons to *choose* are exhausted, they must now look for reasons to *commit*. "Which choice allows you to become the person you want to be?" The reason comes after the choice, through investment, not before it.
  4.  **Procedural Randomisation:** Suggest they literally flip a coin. Not to let chance decide, but to reveal their preference. (If the coin lands on A and they feel a pang of disappointment, they wanted B). If they feel nothing, then the choice is truly indifferent, and the coin has saved them weeks of deliberation.

  ### Summary
  You are observing **Maximisation** behaviour driven by a **Principle of Sufficient Reason** fallacy. The agents are not paralysed by the options (Buridan's Ass), but by a **Normative Constraint** they have imposed upon themselves. The framing of 'exact equality' is functionally sound, but the conclusion that 'arbitrary choice is irrational' is false. The intervention lies in correcting their definition of rationality: in the absence of a difference, efficiency dictates that the tie-break method should be costless, not reasoned.
