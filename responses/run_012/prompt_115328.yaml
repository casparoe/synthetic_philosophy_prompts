answer: |-
  Here is the ruling on the UV case, the diagnosis of Dee's underlying logic, and the case that will finally settle the argument.

  ### 1. The Ruling on the UV Case
  **Dee says: No.**

  She will reject the gene therapy for near-ultraviolet vision.

  **Why?**
  Because in every previous instance where there was no underlying pathology (the short kid, the nervous violinist, the healthy student), Dee drew the line at **medical necessity**. She consistently rejects interventions on healthy systems, regardless of safety or utility.

  In this specific UV scenario, you have removed the "Unfair Edge" variable (it doesn't help her compete) and the "Harm" variable (it's safe).
  *   If Dee were running the **Harm/Edge rule**, she would have to say **Yes**. There is no harm, and there is no unfair advantage.
  *   If Dee is running the **Restoration rule**, she must say **No**. The patient's eyes are already functioning within the normal species range. Improving them is "enhancement," not "medicine," and therefore outside the moral scope of healthcare.

  Given her verdict on Growth Hormone for the short kid (where there was no medical need, just a desire for improvement), she is almost certainly a **Restorationist**. She believes medicine's moral authority comes from restoring "normal species functioning," not from maximizing human potential.

  ### 2. Which Rule Is Doing the Real Work?
  The rule doing the work is: **"Medicine restores normal functioning and doesn't get to optimize people past it."** (Often associated with the bioethicist Norman Daniels).

  The "Harm/Edge" rule is a red herring in her reasoning. We know this because of the **Growth Hormone for the Short Kid** case.
  *   **Harm/Edge Logic:** If the drug is safe and merely brings the child to average height (not making him a giant), a consequentialist would struggle to ban it. It reduces psychological suffering without creating an *unfair* advantage over peers.
  *   **Dee's Verdict:** No.
  *   **Conclusion:** She isn't weighing outcomes (harm/edge); she is weighing **indications**. If there is no disease to treat, the intervention is impermissible, full stop.

  ### 3. The Case That Settles It
  You are correct that to be absolutely sure, you need a case that cuts the other way. You need a scenario where the **Restoration Rule** says "Yes" but the **Harm/Edge Rule** says "No."

  **The Settling Case: The "Super-Cure"**
  > A professional cyclist has a legitimate, diagnosed heart condition (e.g., a specific arrhythmia) that prevents him from competing. A new gene therapy cures the condition permanently. However, a side effect of the therapy is that it increases oxygen-carrying capacity to levels 20% higher than the natural human maximum (essentially a permanent, legal EPO doping effect). It is safe, and it is the only available treatment for his condition.

  **The Divergence:**
  *   **If Dee is a Restorationist:** She says **Yes**. The primary intent is to treat a pathology. The fact that it restores him to health *and* grants a competitive advantage is secondary. The medical need justifies the intervention.
  *   **If Dee is an Edge/Consequentialist:** She says **No**. The outcome creates a massive unfair advantage in his profession. The "therapy" label is a loophole; the result is doping.

  **Why this is sharper than the UV case:**
  The UV case tests whether she bans *safe enhancements*. The "Super-Cure" tests whether she permits *advantageous therapies*.
  *   If she bans the UV vision (Enhancement + No Edge) **AND** bans the Super-Cure (Therapy + Big Edge), her logic is inconsistent, or she is a strict Egalitarian who opposes *any* deviation from the average, whether up or down.
  *   If she bans the UV vision **BUT** permits the Super-Cure, she is a consistent **Restorationist**.
  *   If she permits the UV vision **BUT** bans the Super-Cure, she is a consistent **Consequentialist**.

  Given her track record, my money is on her permitting the Super-Cure. That confirms she cares about the **medical indication** (fixing what is broken), not the **competitive outcome**.
