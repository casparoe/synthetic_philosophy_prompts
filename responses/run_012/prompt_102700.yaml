prompt: |-
  Please help me understand the disagreement between naturalists and normativists about health and disease by restating it in the vocabulary I actually use as a high-school student who spends most of my free time building and repairing small robots and machines. I am comfortable with the practical vocabulary of that hobby — a part's spec sheet and design tolerance, its normal operating range, telemetry and feedback loops, failure modes, graceful degradation, mean time between failures — but I have no formal training in either engineering or philosophy, so please keep the translation in the register of someone who tinkers rather than someone who has read the literature.

  Restate, one at a time, the main positions: the view that health is simply the statistically normal, species-typical functioning of an organism's parts and that disease is a deviation from it; the view that disease is inescapably evaluative and reflects what we happen to regard as harmful or undesirable; and the hybrid view that a condition counts as a disease only when it is both a genuine malfunction and a harm. For each, say precisely what carries over into my vocabulary, what has to be bent or fudged to fit, and what cannot be said at all. Test each translation against a case that strains it — say, a condition that is statistically abnormal but causes no harm, or one that is harmful yet statistically normal in the population.

  Then give me the residue report, which is the part I care about most: does a machine's having been designed for a purpose quietly smuggle in something the biological case lacks, so that my translation makes the normativist look obviously right for the wrong reason? If so, is that a defect of my vocabulary or a sign that the naturalist's claim is less clear than it appears? Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of my question.
