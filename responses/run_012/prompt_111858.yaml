answer: |-
  # Project Ontic Gap: Distinguishing Epistemic from Constitutive Cluelessness in Consequentialist Deliberation

  ## Abstract

  **Project Title:** The Ontic Gap: Distinguishing Epistemic from Constitutive Cluelessness in Consequentialist Deliberation
  **Duration:** One Semester (4 Months)
  **Investigator:** [Your Name/Placeholder]

  **Summary:**
  Consequentialist agents face "cluelessness": the inability to calculate the expected value (EV) of actions due to complex causal chains. Standard literature (e.g., Greaves, Lenman) treats this as a singular epistemic deficit: the facts exist, but we cannot access them. This proposal argues that "cluelessness" conflates two distinct problems. **Type 1 (Epistemic Cluelessness)** arises when value supervenes on fixed physical facts that are computationally inaccessible. **Type 2 (Constitutive Cluelessness)** arises when the value of an act depends on future facts that are not merely unknown but *unsettled*, because the normative description of the present act is constituted by future developments (a form of Temporal Externalism applied to value).

  This project will: (1) formally distinguish Type 1 and Type 2 using supervenience bases; (2) demonstrate that standard mitigation strategies (rule-consequentialism, satisficing, horizon truncation) resolve Type 1 but collapse under Type 2; and (3) propose a "Outcome Individuation Test" to determine if Type 2 is a genuine metaphysical problem or merely redescribed Type 1 uncertainty.

  **Central Question:** Does there exist a class of consequentialist decision problems where expected value is indeterminate *even given* complete physical information and infinite computational power? (Yes/No).

  **Significance:**
  If Type 2 is real, it undermines the coherence of maximizing consequentialism in a way that epistemic limitations do not. It suggests that rational agents may face choices where there is no fact of the matter regarding which option is better, not because of ignorance, but because the "betterness" relation is temporally extended. This has implications for Effective Altruism strategy, long-termism, and the metaphysics of normative properties.

  ---

  ## 1. Introduction: The Ambiguity of Cluelessness

  The problem of cluelessness is a standard objection to act-consequentialism. As articulated by Hilary Greaves and others, the concern is that the causal ramifications of any act fan out indefinitely. Saving a life today might lead to a tyrant being born in three generations; donating to charity might prop up a corrupt system. The standard response is to treat this as an epistemic limitation. We assume there is a "God's eye view" (a Laplacean Demon) that could, in principle, calculate the net utility of any action. Our cluelessness is a failure of the *map*, not the *territory*.

  However, a closer inspection of how we individuate outcomes suggests a deeper issue. In many contexts, *what* an action is depends on how the future unfolds. Consider a political protest. Is it "civic engagement" or "destabilizing agitation"? The answer may depend on whether the protest leads to reform or civil war. If the future is open (not fixed), then the *description* of the act—and consequently its value under a consequentialist calculus—may not be fixed either.

  This proposal isolates two flavors of cluelessness:
  1.  **Resolvable (Epistemic) Cluelessness:** The value $V(A)$ is a function of physical state $P_{future}$. $P_{future}$ is determined (or probabilistically fixed) by $P_{present}$. The agent lacks access to $P_{future}$ or the compute to process $f(P_{future}) \to V$.
  2.  **Constitutive (Ontic) Cluelessness:** The value function $V$ itself depends on normative or semantic facts $N_{future}$ that do not supervene on $P_{present}$. Even with perfect knowledge of $P_{present}$ and the laws of physics, $V(A)$ remains undefined because $N_{future}$ is not yet constituted.

  The working hypothesis is that the literature has treated Constitutive Cluelessness as a subset of Epistemic Cluelessness. This project argues they are categorically distinct and that Constitutive Cluelessness poses a unique threat to consequentialist rationality that standard "bounded rationality" fixes cannot address.

  ## 2. sharpening the Distinction (Requirement A)

  To ensure this is not a verbal trick, we must define the conditions under which Type 2 cannot be reduced to Type 1.

  **The Supervenience Test:**
  Type 1 Cluelessness assumes **Normative Supervenience on the Physical Present**. That is, for any two possible worlds $W_1$ and $W_2$ that are identical in their physical state at time $t$ and share the same laws of nature, the expected value of an act $A$ performed at $t$ must be identical. The uncertainty is purely about which world we are in or how to compute the trajectory.

  Type 2 Cluelessness asserts **Normative Temporal Externalism**. It claims that the value of $A$ at $t$ depends on facts at $t+n$ that are not determined by the physical state at $t$. Crucially, this is not just about the *consequences* (which consequentialists already accept), but about the *individuation of the outcome itself*.

  **Example Case:**
  Imagine an agent deciding whether to fund a new social movement.
  *   *Type 1 Scenario:* The movement will succeed or fail based on chaotic initial conditions. The value is fixed by the physics of the situation; we just can't predict it.
  *   *Type 2 Scenario:* The movement's status as "beneficial" depends on whether future agents *recognize* it as a legitimate precursor to a valuable institution. If the future recognition is not causally determined by the present physics (e.g., it depends on future free choices or semantic fixation), then the value of funding the movement is not merely unknown; it is *unsettled*.

  For Type 2 to be real and not just Type 1 with extra steps, the following must be true:
  1.  **Non-Supervenience:** Normative facts do not supervene on the instantaneous physical state plus laws of nature.
  2.  **Constitutive Dependence:** The identity of the outcome (and thus its value) is partly constituted by future events, not just caused by them.
  3.  **Indeterminacy:** There is no fact of the matter *now* about the truth value of "Act A is better than Act B," even for an omniscient observer of the present physical state.

  If we cannot establish Non-Supervenience, Type 2 collapses into Type 1 (mere ignorance of the future physical state). The project must rigorously defend the plausibility of Non-Supervenience without retreating into non-naturalistic mysticism. We will lean on arguments from **Temporal Externalism** (Jackman, Brown) applied to normative properties, and **Open Future** metaphysics (branching time), but framed specifically around *value attribution* rather than just truth conditions.

  ## 3. Failure of Standard Escapes (Requirement B)

  Consequentialists have developed several strategies to mitigate cluelessness. This section analyzes why these strategies are Type 1 solutions that fail against Type 2.

  **1. Rule-Consequentialism:**
  *   *Mechanism:* Evaluate rules rather than acts. Rules are more stable and easier to model.
  *   *Type 1 Fix:* Yes. Rules average out chaotic causal noise.
  *   *Type 2 Failure:* If the value of the *rule* itself depends on future constitution (e.g., "Follow the rule that leads to a just society," where "just" is fixed by future reflective equilibrium), the rule inherits the indeterminacy. The rule cannot be selected if its success conditions are ontically unsettled.

  **2. Satisficing:**
  *   *Mechanism:* Choose any act above a threshold of "good enough."
  *   *Type 1 Fix:* Yes. Avoids the need to find the *maximum*, only a local peak.
  *   *Type 2 Failure:* If the threshold itself is constituted by future facts (e.g., "good enough to sustain the practice"), the threshold floats. An act might be "good enough" relative to one future branch and "catastrophic" relative to another, with no fact of the matter now about which branch is the "real" continuation of the practice.

  **3. Tractable Horizons (Discounting):**
  *   *Mechanism:* Ignore effects beyond time $t+n$.
  *   *Type 1 Fix:* Yes. Cuts off the causal chain where computation becomes impossible.
  *   *Type 2 Failure:* Constitutive Cluelessness can emerge instantly. If the *meaning* of my act depends on whether you accept my apology tomorrow, truncating the horizon at 24 hours leaves the value of the act undefined *now*. The constitution of the act is temporally extended, not just its consequences.

  **4. Decision Procedures (Algorithmic Focus):**
  *   *Mechanism:* Optimize the decision algorithm, not the act.
  *   *Type 1 Fix:* Yes. Focuses on what is controllable.
  *   *Type 2 Failure:* If the success metric for the algorithm is unsettled (see Type 2 definition), optimizing the algorithm is like optimizing a function $f(x)$ where the definition of $f$ changes based on future inputs that don't exist yet.

  **Conclusion of Section:** Standard escapes assume the *target* of optimization is fixed, even if the *path* is obscure. Type 2 Cluelessness argues the *target* is moving or non-existent. Therefore, these escapes provide false comfort if Type 2 is genuine.

  ## 4. Methodology: The Outcome Individuation Test (Requirement C)

  To test whether Type 2 is a genuine problem or a confusion, we will construct a formal model of "Value Completion."

  **The Test:**
  We will construct a decision scenario involving two agents, Alpha and Beta.
  1.  **Identical Information:** Both agents have perfect knowledge of the present physical state $P_t$ and all laws of nature $L$.
  2.  **Identical Utility Functions:** Both share the same terminal values (e.g., "maximize human flourishing").
  3.  **Divergent Valuation:** We attempt to construct a case where Alpha and Beta *rationally* assign different Expected Values to Act $A$, solely because they adopt different "completion hypotheses" about how the future will fix the normative facts.

  **Positive Result Criteria:**
  If we can demonstrate a scenario where:
  *   $P_t$ and $L$ are fixed.
  *   $Utility$ is fixed.
  *   But $EV(A)$ is logically underdetermined (i.e., $EV(A)$ is a range, not a point, even with probability 1 on physical outcomes),
  Then Type 2 Cluelessness is real. This would imply that normative properties are not fixed by physical properties + time.

  **Negative Result Criteria:**
  If every attempt to construct such a case reveals that the divergence stems from:
  *   Hidden physical uncertainty (Type 1).
  *   Moral uncertainty (disagreement on Utility).
  *   Or semantic confusion (equivocation on "flourishing"),
  Then Type 2 dissolves. It is merely Type 1 Cluelessness dressed in metaphysical clothing.

  **Procedure:**
  1.  **Formalization:** Use branching-time semantics (Ockhamist vs. Peano) to model the future.
  2.  **Case Study:** Apply to "Legacy Acts" (e.g., founding an institution, writing a philosophical text). These are the strongest candidates for constitutive dependence.
  3.  **Stress Test:** Attempt to reduce the "unsettled value" to a probability distribution over physical states. If successful, Type 2 reduces to Type 1.

  ## 5. Timeline and Work Plan (One Semester)

  **Month 1: Conceptual Architecture & Literature Synthesis**
  *   **Goal:** Finalize definitions of Type 1 and Type 2.
  *   **Tasks:**
      *   Review Greaves on Cluelessness, Parfit on Future Generations, and literature on Temporal Externalism (Jackman).
      *   Draft the "Supervenience Test" formally.
      *   Identify the strongest counter-argument: that all value supervenes on physical states (Naturalistic Moral Realism).
  *   **Deliverable:** A 3-page conceptual memo defining the distinction and defending its non-reducibility.

  **Month 2: Stress-Testing Standard Escapes**
  *   **Goal:** Demonstrate the failure of Rule-Consequentialism and Satisficing against Type 2.
  *   **Tasks:**
      *   Model a Rule-Consequentialist agent facing a Constitutive Cluelessness scenario.
      *   Show where the calculation halts or becomes arbitrary.
      *   Refine the argument that "horizon truncation" fails for temporally extended outcomes.
  *   **Deliverable:** Draft of Section 3 (Failure of Standard Escapes).

  **Month 3: The Outcome Individuation Test**
  *   **Goal:** Run the concrete test.
  *   **Tasks:**
      *   Construct the Alpha/Beta agent model.
      *   Attempt to generate a Positive Result (genuine indeterminacy).
      *   Attempt to generate a Negative Result (reduction to Type 1).
      *   *Pivot Point:* If the test suggests Type 2 is incoherent, shift focus to explaining *why* it feels real (psychological/phenomenological analysis).
  *   **Deliverable:** Draft of Section 4 (Methodology & Results).

  **Month 4: Synthesis and Final Polish**
  *   **Goal:** Assemble the full proposal/paper.
  *   **Tasks:**
      *   Write Introduction and Conclusion.
      *   Integrate the "Candid Assessment" (One project or two?).
      *   Review for clarity and tone (LessWrong/SSC style).
      *   Finalize the Central Question answer based on Month 3 findings.
  *   **Deliverable:** Final 8-10 page research proposal.

  ## 6. Expected Results

  **Positive Result (Type 2 is Real):**
  We successfully model a scenario where $EV(A)$ is indeterminate despite fixed physical inputs.
  *   *Implication:* Consequentialism requires a metaphysics of "open normative facts." Maximizing is impossible in these zones; agents must rely on non-consequentialist heuristics (commitment, integrity, tradition) not as epistemic shortcuts, but as ontological necessities.
  *   *Follow-up:* Develop a "Constitutive Decision Theory."

  **Negative Result (Type 2 is Type 1):**
  We prove that all apparent cases of Constitutive Cluelessness reduce to physical uncertainty or moral uncertainty.
  *   *Implication:* The intuition of "unsettled value" is a cognitive bias (perhaps related to the "illusion of explanatory depth" regarding norms).
  *   *Follow-up:* A paper on the phenomenology of cluelessness and why humans conflate semantic openness with ontic openness.

  ## 7. Candid Assessment: One Project or Two?

  There is a significant risk that this proposal smuggles two distinct projects under one title.
  1.  **The Metaphysical Project:** Do normative properties supervene on physical states? (Realism vs. Externalism).
  2.  **The Decision-Theoretic Project:** How should agents act when value is indeterminate?

  **Integration Strategy:**
  I argue these are one project because the Decision-Theoretic output depends entirely on the Metaphysical input. If Type 2 is false, the decision theory is standard Bayesian maximization. If Type 2 is true, standard decision theory breaks. Therefore, you cannot solve the decision problem without settling the metaphysics.
  *However*, the risk is that the metaphysical inquiry becomes a quagmire that consumes the semester, leaving no time for the decision-theoretic implications. To mitigate this, Month 3's "Test" is designed to be a *functional* test. We don't need to solve meta-ethics; we only need to determine if the *model* breaks. If the model breaks, we treat Type 2 as "true for the purposes of decision theory," regardless of ultimate metaphysical status.

  ## 8. Skepticism and Conditions for Reality

  **The Skeptical View:**
  The most likely critique is that I am redescribing Type 1 Cluelessness in fancier words. A skeptic (likely a naturalistic moral realist) will argue: "The value of the act *is* the physical outcome. If the physical outcome is fixed (probabilistically), the value is fixed. If you think value depends on 'future recognition,' that's just another physical fact about brains in the future. You just don't know it yet."

  **Conditions for Type 2 to be More Than That:**
  For Type 2 to be genuine, one of the following must be true:
  1.  **Semantic Indeterminacy:** The concepts we use to measure value (e.g., "justice," "flourishing") have reference conditions that are not fixed by present usage or physical state (Temporal Externalism).
  2.  **Normative Non-Supervenience:** Moral facts are *sui generis* and can be genuinely open even if physical facts are fixed (a form of Non-Naturalism).
  3.  **Constitutive vs. Causal:** The relation between the future and the present act is *constitutive* (the future makes the present what it is) rather than *causal* (the present causes the future). Standard consequentialism treats value as causal. If value is constitutive, the "effect" is part of the "cause's" identity.

  If I cannot argue for (1) or (3) without accepting (2), the project may collapse into a defense of Non-Naturalism, which is likely too broad for this scope. I will focus primarily on (1) and (3) as they are more compatible with the naturalistic leanings of the target audience (LW/SSC).

  ## 9. Confidence and Weakest Step

  **Confidence Level:** Moderate (60%).
  The distinction is philosophically robust (drawing on established externalist arguments), but its application to consequentialist calculus is novel and untested. There is a 40% chance that upon rigorous formalization, Type 2 dissolves into a complex form of Type 1 (moral uncertainty + physical uncertainty).

  **Weakest Step:**
  The **Outcome Individuation Test (Month 3)** is the point of failure. It is difficult to construct a model where agents agree on all physical facts and utility functions but disagree on EV *without* one of them making a reasoning error. If the disagreement is rational, it implies logic itself is indeterminate in this domain. Proving that the disagreement is *not* due to hidden moral uncertainty (e.g., Alpha values "legacy" more than Beta thinks) is exceptionally hard. If I cannot isolate the variable of "constitutive unsettledness" from "preference uncertainty," the test yields a null result.

  ---

  ## 10. Central Question and Determinate Answer

  **Central Question:**
  *Does there exist a class of consequentialist decision problems where expected value is indeterminate even given complete physical information and infinite computational power?*

  **Target Answer:**
  *Yes.* (The proposal is structured to argue for the existence of Constitutive Cluelessness).

  **Justification for Determinacy:**
  The question is binary (Exists/Does Not Exist). The methodology (The Outcome Individuation Test) is designed to produce a falsifiable result. Either the model holds (Yes) or it reduces to Type 1 (No). There is no middle ground in the final output, even if the philosophical journey is nuanced.

  ---

  ## 11. Positions and Arguments Referenced

  *   **Cluelessness:** Hilary Greaves ("The Cluelessness Objection to Consequentialism").
  *   **Temporal Externalism:** Henry Jackman ("Temporal Externalism and Our Ordinary Practices"), Jessica Brown.
  *   **Open Future:** A.N. Prior (Branching Time), Elizabeth Barnes (The Moving Spotlight).
  *   **Consequentialist Escapes:** Rule-Consequentialism (Hooker), Satisficing (Slote), Tractable Horizons (Effective Altruism discourse on long-termism).
