          3.  Preventive Checks (Malthus included them; falling fertility looks like the mechanism working, not refutation. How to test a theory that absorbs prediction *and* failure?).
          4.  Counterfactuals ("Absent fossil fuels he'd have been right" – Is this evidential work or just keeping the theory alive?).
          5.  Ecological Perspective (Geometric vs. Arithmetic = Carrying Capacity? Ecological dynamics vs. indefinite hold-off vs. conditional antecedent?).
