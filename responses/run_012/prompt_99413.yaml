          *   *Follow-up:* If he says "when resources run out," ask about substitution.
          *   *Equivocation Check:* Force vs. Outcome. (Is the *pressure* real, or must the *crash* happen?)

      *   *Question 2: Auxiliary Hypotheses (Phlogiston comparison).*
          *   Lakatosian research programs. Why is Malthus progressive and Phlogiston degenerating?
