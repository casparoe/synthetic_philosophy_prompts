      *   *Core Claim:* Malthusian pressure is a fundamental constraint that technology temporarily alleviates but doesn't eliminate.
      *   *Defense:* The Industrial Revolution was a one-off energy subsidy (fossil fuels). Demographic transition is a response to scarcity signals (preventive check).
      *   *Vulnerability:* If the collapse never comes, is it science? If every adaptation is just a "delay," does the theory explain everything and therefore nothing?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: Falsifiability & Timing ("Early").*
