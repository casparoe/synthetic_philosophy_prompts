      *   *Tourist vs. Resident:* Time creates expectation and reliance. A tourist is a blip; a resident is a participant in the local economy/social fabric.
      *   *Watered Down?* If the user defines "custom" as "harmless coordination" and "obligation" as "harmful exploitation," they might be creating a tautology. Need to check if they are moving the goalposts.

