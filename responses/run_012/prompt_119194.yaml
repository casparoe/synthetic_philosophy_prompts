  *(Self-Correction on the "Watered Down" point)*: I need to be careful. The user distinguishes between "rude" and "sin." The counter-argument is that "rude" *is* a moral category when it involves reliance. I need to make sure I don't just say "rudeness is bad." I need to say "rudeness violates a duty of fairness."

