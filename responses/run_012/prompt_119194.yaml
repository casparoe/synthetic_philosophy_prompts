      *   **Strengths:** Distinguishes between *malum prohibitum* (wrong because prohibited/customary) and *malum in se* (wrong in itself). Respects cultural autonomy.
      *   **Weaknesses:** Ignores the *consequences* of norm violation on trust and expectation. Ignores the *fairness* principle (free-riding). Ignores the *signaling* function of norms.

  3.  **Brainstorming Counterarguments (The "Case Against"):**

      *   *Argument 1: The Fairness/Free-Rider Problem.* If everyone benefits from the norm (orderly lines, paid servers), but you opt out, you are taking advantage of others' compliance. This is a classic moral objection.
