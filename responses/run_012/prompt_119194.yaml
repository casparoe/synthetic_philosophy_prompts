          1.  **The Free-Rider Objection (Strongest).** This hits the "specific person" criteria. If you don't tip, the server loses money *because* you benefited from their service under the assumption of the norm.
          2.  **Tacit Consent & Reliance.** Entering the restaurant is signing a contract. The server relies on this.
          3.  **The Signaling Harm.** Disrespect is a harm.
          4.  **The Erosion Argument (Weakest for this user).** Too abstract.
      *   *Addressing the "Watered Down" Concern:* This is crucial. If the user says "If it hurts someone, it's not a custom, it's a harm," they are redefining terms to win. I need to point out that *norms themselves create the harm* when broken.
      *   *Addressing the Specific Questions:*
