answer: |-
  This is a sophisticated position. In philosophy, you are essentially arguing for a form of **Moral Conventionalism** regarding social norms, distinguishing sharply between *malum in se* (wrong in itself, like murder) and *malum prohibitum* (wrong because prohibited/customary, like driving on the left). Your brother's girlfriend is pointing you toward **Scanlonian Contractualism** or **Rawlsian Fairness**—the idea that norms are only binding if they are part of a fair system of cooperation.

  You asked for the real case against your view, ranked by persuasive power, specifically looking for concrete harm to specific people, not abstract "social fabric" arguments. You also asked for an honesty check on whether your position is a tautology (a circular argument that wins by definition).

  Here is the case against your position, ranked from "This should change your mind" to "You can probably live with this contradiction."

  ### 1. The Free-Rider Objection (The Fairness Argument)
  **The Argument:** Morality isn't just about not hurting people; it's about not taking advantage of them. When you enter a restaurant in the U.S., you enter a cooperative scheme. The server provides labor under the assumption that the social contract (tipping) will be honored. The owner pays less under the same assumption. By accepting the service but withholding the tip, you are **free-riding**. You benefit from the system (you get served) while opting out of the cost that everyone else bears.
  **The Concrete Harm:** The specific person hurt is the server. They have performed labor with a reasonable expectation of compensation based on local norms. By violating the norm, you directly reduce their income for that specific labor instance.
  **Would you admit this counts against you?**
  *   **Honest Answer:** You might try to wave this off by saying, "I didn't sign a contract."
  *   **Why that fails:** In ethics, **tacit consent** is real. By ordering food in a jurisdiction where tipping is a wage subsidy, you are voluntarily participating in an economic game. If you play the game, you follow the rules. Opting out unilaterally is a violation of fairness, which is a core moral obligation.
  *   **Verdict:** **This should change your mind.** It moves tipping from "custom" to "deferred wage."

  ### 2. The Reliance and Expectation Argument
  **The Argument:** Norms create reliance. When norms are stable, people build their lives around them. This is what your brother's girlfriend meant by "jurisdiction." Norms have a jurisdiction over the people who rely on them. If I move to a city where everyone locks their doors, and I stop locking mine, I might just be risky. But if I move to a city where no one locks their doors, and I start locking mine, I'm fine. However, if I move to a city where everyone *expects* me to lock my door to keep *their* insurance down, and I don't, I harm them.
  **The Concrete Harm:** In the elevator example: If I block the door to get on before people get off, I delay 5 specific people. That is 5 specific losses of time. Is 10 seconds of delay a "moral harm"? Most ethicists say yes, if it's unnecessary and done for selfish gain.
  **Would you admit this counts against you?**
  *   **Honest Answer:** You might say, "10 seconds is trivial. It's not a *sin*."
  *   **Why that fails:** Aggregated trivial harms are still harms. But more importantly, the *uncertainty* you introduce is the harm. If people can't rely on the norm (that you will wait), they become hyper-vigilant. You force them to spend mental energy guarding against you. That cognitive load is a specific cost you impose on them.
  *   **Verdict:** **Strong counter-argument.** It challenges your claim that "nobody gets hurt."

  ### 3. The Signaling Harm (Respect as a Moral Good)
  **The Argument:** Social norms are a language. Following them signals, "I value our interaction enough to adhere to our shared code." Breaking them signals, "I do not value you enough to conform."
  **The Concrete Harm:** The person on the receiving end feels devalued. If you are a tourist and don't tip, the server doesn't think, "Ah, a cultural difference." They often think, "This person thinks my service is worthless."
  **Would you admit this counts against you?**
  *   **Honest Answer:** You will likely wave this off. You will say, "Their feelings aren't my responsibility. I didn't intend disrespect."
  *   **Why that fails:** In ethics, **negligence** counts. If you know a norm exists (even as a visitor), ignoring it is negligent regarding the other person's dignity. However, this is weaker than the Free-Rider argument because it relies on the *victim's interpretation* rather than objective loss.
  *   **Verdict:** **Awkward bullet you can live with.** You can maintain that hurting feelings isn't a moral obligation, though many ethicists would disagree.

  ### 4. The Erosion Argument (The "What if everyone did it?" Test)
  **The Argument:** If everyone acted as you do, the system would collapse. If no one tipped, servers would quit or prices would rise. If no one waited in line, chaos would ensue.
  **The Concrete Harm:** This is usually too abstract ("society breaks down").
  **Would you admit this counts against you?**
  *   **Honest Answer:** You will definitely wave this off. You will say, "But *everyone* isn't doing it. Just me. My single action doesn't break the system."
  *   **Why that fails:** This is the "Paradox of the Heap." One grain of sand doesn't make a heap, but remove enough grains and it disappears. Your action contributes to the erosion.
  *   **Verdict:** **Weak counter-argument for you.** Since you demand specific harm to specific people, you can easily dismiss this as utilitarian calculus that doesn't apply to individual duty.

  ---

  ### Addressing Your Specific Sticking Points

  #### 1. The Unfair Custom (Tipping and Low Wages)
  You asked: *If the custom is unfair (owners don't pay enough), does that make it less binding on me, or more?*

  **The Ethical Consensus:** It makes it **more binding on you regarding the worker**, but **less binding regarding the owner.**
  Here is the distinction: The custom (tipping) is a mechanism that transfers money from you to the server. The *unfairness* is between the Owner and the Server.
  *   If you refuse to tip to "protest" the owner, you are punishing the Server, not the Owner. The Owner has already paid their fixed costs. The Server is the one who goes home with less rent money.
  *   **The Obligation:** You have a moral obligation not to use a vulnerable third party (the server) as a pawn in your political protest against the owner.
  *   **Conclusion:** The unfairness of the system increases your obligation to the worker, because they are the one exposed to the risk. Withholding the tip makes *you* the agent of the harm, not the system.

  #### 2. Tourist vs. New Resident vs. Long-Term Refuser
  You asked: *Is there a difference?*

  **Yes, based on Reliance and Notice.**
  *   **The Tourist:** Has the weakest obligation. They are passing through, haven't integrated into the economic reliance of the community. However, they still have an obligation of **due diligence**. If tipping is widely known (like in the US), claiming ignorance is negligence.
  *   **The New Resident:** Has a stronger obligation. By choosing to live there, they are entering the long-term cooperative scheme. They are benefiting from the stability of the norms (people waiting in line for *them*, etc.).
  *   **The Long-Term Refuser:** Has the strongest obligation. At this point, it is no longer "cultural difference." It is a calculated decision to free-ride. They know the expectation, they know the reliance, and they choose to violate it. This shifts from "cultural misunderstanding" to "exploitation."

  ---

  ### The Honesty Check: Is Your Position Watered Down?

  You asked: *If every counterexample gets answered with "well sure, but that's not the custom, that's an actual harm," then I want to know if that's a cop-out.*

  **Yes, it is a cop-out. And here is why.**

  Your position rests on a distinction between **Custom** and **Harm**. You are defining "Custom" as *things that don't hurt anyone* and "Obligation" as *things that hurt someone*.
  But social norms **create** the harm when broken.
  *   Jaywalking when no cars are coming: No harm. (Your view holds).
  *   Jaywalking when a car *has to brake*: Harm. (Your view admits obligation).
  *   Not tipping: Financial loss to server. (Your view calls this "custom," but it functions exactly like "harm").

  **The Trap:**
  If you define "Moral Obligation" as "Only things that cause concrete harm," and then you admit that breaking tipping norms causes concrete financial harm to servers, **you have contradicted yourself.** You are forced to admit tipping *is* a moral obligation, not just a custom.

  To maintain your view, you have to argue that the server's loss isn't "real harm" because they "shouldn't rely on tips." But that is an economic argument, not a moral one. The reality is they *do* rely on it.

  **The "Jurisdiction" Explanation:**
  Your brother's girlfriend was right. Norms have a jurisdiction.
  *   **Coordination Norms:** Drive on the right. (No moral weight, just safety/efficiency).
  *   **Constitutive Norms:** Tipping, Queuing. These *constitute* the interaction. You cannot separate the "custom" from the "transaction." In the US, a restaurant transaction is *defined* as Price + Tip. To pay only the Price is to not complete the transaction.

  ### How to Write This Essay
  Don't abandon your position, but refine it. Your intuition is correct that *not all* norms are moral laws (e.g., wearing a tie to a wedding). But you are wrong that *none* of them are.

  **The Nuanced Position:**
  A social convention becomes a moral obligation when:
  1.  **Reliance:** Others have structured their expectations/finances around your compliance.
  2.  **Fairness:** You benefit from the compliance of others (Free-Rider problem).
  3.  **Notice:** You have reasonable ability to know the norm (Tourist vs. Resident).

  **The "Cop-Out" Fix:**
  Instead of saying "Customs aren't moral obligations," argue: **"Customs are presumptive moral obligations."** They are binding *unless* there is a stronger moral reason to break them.
  *   *Example:* You should wait in line (obligation). But if someone is having a heart attack, you cut the line (stronger obligation).
  *   *Example:* You should tip (obligation). But if the server was racist to you, you don't tip (violation of reciprocity).

  **Final Verdict:**
  Your view is a real position (Normative Skepticism), but it is vulnerable to the **Fairness/Free-Rider** objection. If you want to keep your view, you must argue that **Fairness is not a moral obligation, only a social preference.** That is a hard pill to swallow, but it is the only consistent way to hold your ground. If you admit Fairness is a moral duty, your distinction between "custom" and "obligation" collapses.
