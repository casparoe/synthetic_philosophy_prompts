answer: |-
  "You're doing the thing again," Elena said, tapping her pen against Marcus's data sheet. "You're looking at the clutch variance and seeing a group. I'm looking at the same variance and seeing a pile of correlated individuals."

  Marcus leaned back, rubbing his eyes. "It's not just correlation, El. Look at the sacrificers. They're sterile. They don't reproduce. Within any given clutch, a sacrificer has zero direct fitness compared to a disperser. If selection is strictly about individual reproductive success, that allele should vanish overnight. Instead, it's fixed in the population."

  "Because the individuals in the clutch are siblings," Elena countered. "High relatedness. The sacrificer allele spreads because it's protecting copies of itself housed in the dispersers. It's inclusive fitness bookkeeping. The gene is the replicator; the larva is just the vehicle. Sometimes the vehicle crashes so the blueprint survives elsewhere. You don't need to invoke a 'clutch entity' to explain that."

  "But the adaptation isn't in the larva," Marcus insisted, leaning forward. "What trait does the sacrificer have that benefits *it*? Nothing. The trait is a division of labour. The defence corps exists at the clutch level. You can't point to a single larva and say, 'There is the adaptation.' The adaptation is the ratio of sacrificers to dispersers. That's a property of the group. The clutch has heritable variation—some mothers produce more sacrificers than others—and differential fitness measured by how many dispersers survive to found new leaves. That meets the literal definition of a unit of selection."

  Elena sighed. "You're equivocating. There's a huge difference between claim (a), that groups differ in the aggregate success of the individuals inside them, and claim (b), that groups are themselves the bearers of adaptations. I'll grant you (a). Clutches with more sacrificers win. But that's still individual selection happening in a groupy setting. The gene selects for the behaviour because of the genetic structure. You're trying to jump to (b), saying the clutch is a superorganism. Does that view predict anything the inclusive-fitness account doesn't? If the math is equivalent, why complicate the ontology?"

  "Because bookkeeping isn't explanation," Marcus shot back. "You can always average the members' fitnesses, call the remainder 'group fitness,' and announce you've solved it. But that's a redescription that drops the causal story. If I treat the clutch as the unit, I'm looking for mechanisms that suppress within-group conflict. And we see them. The sacrificers police the clutch. If a disperser tries to eat the sacrificer, the others attack it. That's group-level maintenance. Your gene view assumes the conflict is resolved by relatedness, but it ignores the emergent machinery that keeps the group intact."

  "Does it predict different outcomes?" Elena pressed. "If I run the model using kin selection coefficients, I get the same equilibrium frequency of sacrificers as you do with your group variance partitioning. If the predictions are identical, your 'group entity' is doing no work. It's an epiphenomenon."

  "Predictions aren't everything," Marcus said. "It's about what happens when the structure breaks. If relatedness drops—say, multiple females lay on one leaf—your kin selection model says cooperation collapses. My group model says the same thing, but for a different reason: the group loses integrity. The variance between clutches drops below the variance within clutches. But here's the thing: suppose we find a mechanism where the clutch actively regulates its own composition, independent of the mother's genotype. Suppose the larvae themselves sense density and switch morphs. Then the heritability is at the group level, not the maternal gene level. That separates (a) from (b)."

  Elena paused. "If the larvae switch morphs based on local cues, that's still a gene-encoded reaction norm. The gene says, 'If density high, become sacrificer.' It's still the gene being selected."

  "But the selection pressure comes from the group's survival," Marcus argued. "The gene doesn't 'know' it's in a group. The causal force is the wasp predation on the clutch. The clutch is the thing being eaten or surviving. If you insist on reducing everything to the gene, you lose the level where the interaction actually happens. It's like explaining a football game solely by the physics of the leather. Technically true, causally useless."

  "Okay, but don't pretend the gene view denies the interaction," Elena said, softening. "I'm not saying groups don't exist. I'm saying they aren't the *unit* of selection in the sense of having a long-term evolutionary trajectory independent of the genes. The clutch doesn't replicate. The dispersers replicate. The clutch is a bottleneck, sure, but it's not a replicator."

  "Is a multicellular organism a replicator?" Marcus asked sharply. "Your cells are sterile. They patrol against cancer. They sacrifice for the whole. We call that an individual. Why is a clutch of beetles different? Because the cells share a genome? These larvae share almost as much. If the sacrificers were clones, you'd call it an organism. Because they're siblings, you call it kin selection. It's a continuum, El. You're drawing a hard line where there's a gradient."

  Elena rubbed her temple. "I'll concede the gradient. If the relatedness is high enough and conflict suppression is strong enough, the group looks like an individual. But that's a description of the *outcome*, not the *process*. The process is still differential survival of alleles. My worry is that when you say 'group selection,' people hear 'magic emergent property' and stop looking for the genetic mechanism. They think the group wants to survive."

  "And my worry," Marcus said, "is that when you say 'gene selection,' people think the gene is a little homunculus calculating fitness, and they ignore the hierarchical structure that makes the calculation possible. You accuse me of mysticism; I accuse you of reductionism that blinds you to the actual causal architecture."

  "So where does that leave us with the beetles?" Elena asked.

  "Stuck," Marcus admitted. "Mathematically, we agree. The sacrificers persist because the between-clutch selection outweighs the within-clutch selection. You call that inclusive fitness; I call it multilevel selection. The price of the ticket is the same."

  "But you want to put 'Clutch' on the ticket stub," Elena said.

  "Because the clutch is where the work is done," Marcus said. "The wasp doesn't bite the gene. It bites the larva, in the context of the clutch. If we want to manipulate the system—say, control the pest—we need to know if we're breaking the group structure or the kin recognition. Your model says disrupt relatedness. Mine says disrupt group cohesion. They might look the same in the lab, but in the field, the leverage points might differ."

  Elena nodded slowly. "I can accept that the group perspective is heuristically useful. It highlights the variance structure. But I won't concede that the gene view is ontologically inferior. The adaptation is still assembled by the differential survival of genetic information."

  "And I won't concede that the group is just a shadow," Marcus said. "The clutch is a real causal force. It constrains the genes just as much as they constrain it."

  "So we agree on the dynamics," Elena said, "but we're fighting over the noun."

  "Basically," Marcus said, picking up his coffee. "But it's a hell of a fight over a noun."

  "Yeah," Elena said, clinking her mug against his. "See you next week?"

  "Wouldn't miss it."
