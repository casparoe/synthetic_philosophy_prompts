answer: |-
  Covering-Law: Let's take the failure of the savings bank in that small industrial town. To explain it, I say: Institutions that borrow short and lend long fail when depositors panic. This bank borrowed short and lent long. Depositors panicked. Therefore, it failed. The event is deduced from a law and particular facts. That is what explanation is.

  Narrative: When you press a historian for that law, what comes back is hedged. "Usually fail," or "tend to fail." If you add enough *ceteris paribus* clauses to make it true, it loses the force to explain this specific failure. You claim the law is there in outline, fillable in principle. But is that fallback refusable in principle? Or are you just saying history is an immature science?

  Covering-Law: I am not retreating to immaturity. I am saying the logical structure requires a general connection. Without it, you merely assert that this happened, then that happened. The hedge is epistemic, not ontological. We don't know all the variables, but the commitment is that there *are* variables that would make the connection strict.

  Narrative: But if the connection relies on human trust, variables might not suffice. That brings me to description. We describe the bank's collapse as "the beginning of the town's ruin." That description is true only in virtue of later events. It was unavailable in the year the bank failed.

  Covering-Law: Every description is relative to a standpoint. That is harmless. I can redescribe the event in contemporaneous terms: "the bank closed its doors."

  Narrative: You can, but you lose the explanation. Historical explanation characteristically explains events under descriptions that could not have been available at the time. If the explanation relies on "the beginning of the ruin," it cannot be reconstructed as a prediction. You cannot predict "the beginning of the ruin" before the ruin exists.

  Covering-Law: You are conflating the significance of the event with the event itself. The logic of explanation holds for the event under any description. If I can predict the closure, I have explained the ruin, even if I lack the label.

  Narrative: But the puzzlement varies. Explanations come in degrees. I might be satisfied by the financial law, but still puzzled about why *this* town collapsed while another survived. The same event seems explainable, correctly, twice over: once by the financial law, once by a narrative of who trusted whom.

  Covering-Law: The argument model survives this because validity is binary. Either the premises entail the conclusion or they do not. Your satisfaction is psychological, relative to what you didn't know. That is pragmatics, not logic.

  Narrative: If the logic ignores the variability of understanding, it misses the point of explaining *to someone*. But let's talk about what I offer positively. Narrative supplies followability—the sense a reader has that one thing led to another.

  Covering-Law: Here is the blow: Is that followability a feature of the events, or a fact about the reader? If I feel satisfied, does that mean the world is connected, or only that your story matches my expectations? You risk making explanation a matter of persuasion.

  Narrative: I absorb that. It is not merely psychological. It is about configuration. The narrative shows how the events cohere into a whole that makes the outcome intelligible, not just expected. It is not about feeling; it is about seeing the connections that constitute the event.

  Covering-Law: But selection of what to include is a pragmatic feature of every explanation, physics included. We ignore friction in mechanics. Narrative cannot claim special privilege here. You select trust relationships and ignore interest rates; I do the reverse.

  Narrative: In physics, selection isolates variables within an existing event identity. In narrative, selection helps constitute the event identity itself. Deciding that the trust network is the story defines what the collapse *was*. It is not just pruning; it is shaping the object of explanation.

  Covering-Law: I will concede this: In history, the laws are rarely strict, and insisting on strict deduction often obscures the specific mechanisms historians uncover. The "in principle" claim may be too distant to guide actual practice.

  Narrative: And I concede that narrative cannot float free of general expectations. If the reader didn't expect banks to need trust, the story wouldn't follow. Narrative relies on implicit laws to work.

  Covering-Law: So we agree that the structure of explanation involves both general expectations and specific configurations.

  Narrative: But we disagree on which is fundamental. You see narrative as a vessel for laws; I see laws as tools within narrative.

  Covering-Law: Then the disagreement is sharper. It is not about whether both exist, but about what does the explanatory work. Is it the subsumption under a generalization, or the configuration of the particular?

  Narrative: Precisely. And until we know whether followability is in the world or in the story, we cannot settle it.

  Covering-Law: But we know the bank failed.

  Narrative: Yes. But why it matters, and how it connects, remains between us.
