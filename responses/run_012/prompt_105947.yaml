answer: |-
  **Brainstorming and Preliminary Readings**

  Three readings of Smith on this episode present themselves. First, the *Monopoly Reading*: Smith opposes the EIC because it distorts trade and raises prices; the famine is a market failure caused by restriction. This is the weakest reading; it reduces a political catastrophe to a price mechanism and ignores the sovereign powers (tax, justice) the Company wielded. Second, the *Moral Distance Reading*: The famine occurred because British actors could not sympathize with distant Bengalis; *The Theory of Moral Sentiments* explains the indifference. This is stronger but risks psychologizing a structural problem. Third, the *Institutional Mismatch Reading*: Smith argues merchants are structurally unfit to be sovereigns because their incentive structure (profit) contradicts the sovereign end (public welfare). This is the strongest reading and the one most fertile for testing "vicarious sovereignty."

  I will proceed with the Institutional Mismatch Reading as the baseline, testing whether "vicarious sovereignty" is merely a synonym for Smith's critique of the merchant-sovereign or if it reveals a gap in his account of accountability. I flag the Monopoly Reading as the weakest; it cannot explain why the Company did not reduce taxes to preserve the long-term productivity of the land, a move even a rational monopolist might make.

  ***

  ### 1. Mapping

  In Smith's framework, the relevant actors are not abstract "British" versus "Indians," but specific functional roles defined by their incentives and accountability.

  *   **The Agents (Company Servants):** These are the men on the ground in Bengal. In Smith's *Wealth of Nations*, merchants are driven by the desire for profit. When they become tax collectors, their incentive is to maximize remittance to London to secure dividends and personal fortunes. They are accountable to the Company, not the ryots (peasants).
  *   **The Principals (Shareholders and Parliament):** The shareholders seek dividends; Parliament seeks imperial revenue and geopolitical advantage. Both are distant. Smith notes that the "masters" of a joint-stock company rarely inspect the operations personally. They rely on reports, which agents manipulate.
  *   **The Subjects (The Bengali Population):** In Smith's economic theory, they are the source of revenue and labor. In his moral theory, they are potential objects of sympathy. In the EIC structure, they are neither voters nor customers with choice; they are trapped revenue sources.
  *   **The Levers:** The levers are the *diwani* (revenue rights), the monopoly on trade, and the private trade allowances permitted to servants.

  **Smith's Prediction:**
  Smith explicitly predicts that a company of merchants will make a "bad sovereign." In *Wealth of Nations*, he argues that merchants view sovereignty as a distraction from profit, yet when they exercise it, they treat the territory as a shop. He predicts they will prioritize short-term remittance over long-term improvement of the land. He predicts that because they are not resident landlords with a stake in the neighborhood's prosperity, they will "squeeze" the revenue without regard for the cultivator's subsistence.

  **Prediction vs. Reality:**
  The mapping holds with disturbing precision. The Company, acting as a merchant-sovereign, raised revenue by a third despite the fragility of the harvest. They enforced monopolies on grain that exacerbated the scarcity. The agents, accountable to London shareholders, prioritized the dividend over the survival of the tax base. Smith's theory predicts the *direction* of the failure: the structural incentive to extract rather than nurture. The reality confirms the prediction: the extraction continued through the famine because the accountability loop ran to London, not Bengal.

  ### 2. Where the theory bites and where it misses

  **Where it Bites:**
  Smith's economic analysis explains the *mechanism* of the catastrophe brilliantly. He identifies the "spirit of monopoly" not just as high prices, but as a mindset that seeks to constrain supply to maintain value. The EIC's grain monopolies fit this. More importantly, his institutional analysis bites on the question of *fitness*. Smith argues that the regulation of trade and the administration of justice require different habits of mind. The merchant habit is to buy cheap and sell dear; the sovereign habit is to ensure order and subsistence. By conflating these, the EIC created a system where the sovereign power was used to enforce merchant predation. Smith's theory explains why the Company did not act as a "enlightened despot" might; their corporate structure prevented it.

  **Where it Misses:**
  Smith's theory misses the *scale* of the moral collapse. His economic model assumes rational self-interest. A rational monopolist preserves the goose that lays the golden egg. Destroying a quarter of the population is bad business; it destroys future revenue. Smith's economic analysis struggles to explain why the Company did not pivot when the catastrophe became apparent. It suggests a myopia deeper than profit-maximization.

  This is where the moral analysis should pick up the slack, but it falters. Smith's moral theory relies on the desire for "praiseworthiness." He assumes actors care about what the impartial spectator thinks. In Bengal, the servants did not care, or they constructed a local spectator (their peers) that approved of accumulation. Smith's framework underestimates the ability of a corporate culture to generate its *own* moral norms that override the universal impartial spectator. He treats the "man of system" as an individual aberration (a legislator in love with his plan), but in the EIC, the "man of system" was the *institution itself*. The theory explains the incentive to oppress, but it underestimates the capacity for institutionalized indifference.

  ### 3. The spectator-gap hypothesis

  **The Claim:**
  The hypothesis posits that Smith's moral theory cannot rescue his economic theory here because the impartial spectator is structurally unavailable at imperial distance. The governed (Bengalis) cannot enter the imagination of the distant principals (London) or even the agents (who view them as alien) as parties whose resentment must be answered.

  **Assessment:**
  This is a fair reading, but it requires a specific interpretation of *The Theory of Moral Sentiments*. Smith admits that sympathy diminishes with distance. We feel less for a stranger in India than a neighbor in Edinburgh. However, Smith also argues that *justice* is a negative virtue—we must not harm others regardless of sympathy. The famine was not just a lack of charity; it was active harm (seizing grain, enforcing taxes during starvation).

  The hypothesis holds water because Smith's mechanism for enforcing justice is the "resentment" of the sufferer, which the spectator validates. If the sufferer is too distant to be heard, and the spectator is too distant to hear, the mechanism breaks. The EIC servants were insulated from the *resentment* of the Bengalis by military force, and insulated from the *judgment* of the British public by information asymmetry.

  **Resources Undeployed:**
  Does Smith have resources he didn't use? Yes. He discusses the corruption of moral sentiments by custom and fashion. He could have argued that the "custom" of empire corrupts the spectator. He hints at this when discussing the "contempt" Europeans feel for other races. But he does not fully theorize the *corporate* spectator. He assumes the individual conscience can withstand institutional pressure. The Bengal case suggests that when the institution rewards cruelty, the individual spectator is silenced. To settle this, we would need to know if Smith believed the impartial spectator could function in a vacuum of social feedback. The Bengal episode suggests it cannot; the spectator requires a community of judgment, and the EIC created a closed community of judgment in Calcutta that validated extraction.

  ### 4. The remedy

  **Smith's Proposals:**
  Smith's remedies were: 1) Gradual emancipation of the colonies (letting them govern themselves); 2) Failing that, ending the Company's monopoly and bringing administration under the Crown/Parliament; 3) Opening trade to all merchants.

  **Assessment against Vicarious Sovereignty:**
  Ending the monopoly addresses the economic distortion but not the vicarious sovereignty. If the Crown takes over, the accountability still runs to London, not Bengal. The "vicarious" nature remains: the sovereign is distant, the governed are local. Smith assumes the British Parliament would be a more virtuous principal than the Company shareholders. He writes that the Crown's administrators would be more stable and less prone to "rapacious" short-termism.

  **Artifact of Limits:**
  This remedy is an artifact of his theory's limits. Smith trusts the "nation" more than the "company." He assumes a national government has a longer time horizon and a broader moral concern than a joint-stock company. But in the case of Bengal, Parliament's regulation (via the Regulating Act of 1773 and Pitt's India Act) failed to stop the extraction or prevent future famines. Smith's remedy assumes that *who* holds the sovereignty matters more than *to whom* they are accountable. He does not propose accountability to the governed. He proposes swapping a bad distant master (Company) for a potentially better distant master (Crown). This confirms that "vicarious sovereignty" is a blind spot; he sees the problem as *who* exercises the power, not the structural impossibility of exercising sovereign power vicariously without local consent.

  ### 5. The verdict on the theory

  The Bengal episode exposes an **anomaly within the theory**, specifically in the intersection of his moral and economic systems.

  Smith's theory anticipates the *economic* failure of merchant-sovereignty. He predicted the EIC would be oppressive and inefficient. In that sense, the episode confirms his critique of monopoly and joint-stock administration. However, the episode presents a case his theory did not fully anticipate: the *corporate moral vacuum*. Smith's moral theory relies on the individual's ability to consult the impartial spectator. He did not foresee an institutional form that could systematically insulate its agents from the spectator's judgment while wielding the power of life and death.

  He treats the "man of system" as a philosophical tyrant, not a corporate employee following orders to meet a dividend target. The EIC showed that sovereignty could be bureaucratized and detached from moral agency in a way Smith's individualistic moral psychology could not easily diagnose.

  **To overturn this verdict:** One would need to find textual evidence where Smith explicitly theorizes the joint-stock company not just as an economic inefficiency, but as a *moral hazard* that structurally disables the impartial spectator. While he calls the Company a "strange absurdity," he stops short of calling it a moral monster. If he had argued that corporate sovereignty makes moral judgment impossible rather than just unlikely, the theory would account for the anomaly.

  ### 6. Silence

  There is a plain silence in Smith's theory regarding the **political rights of the colonized**. Smith speaks of the welfare of the Bengalis as a matter of economic prudence (preserving the revenue base) and humanitarian sympathy (alleviating suffering). He does not speak of their *right* to consent to the taxation or the government.

  His theory is silent on whether the governed must have a mechanism to fire the sovereign. He critiques the EIC for being bad masters, not for being masters without consent. He proposes better masters (the Crown), not self-mastery for the Bengalis (until the very distant horizon of emancipation, which he views as a release from British burden rather than a political right). He does not pose the question: "By what right does a London shareholder tax a Bengali ryot?" He asks instead: "Is this taxation efficient and humane?" This is not a failure of compassion, but a limit of his political economy, which takes the existing imperial framework as a given to be reformed, not a structure of domination to be dismantled on grounds of justice.

  ***

  **Overall Verdict**

  Adam Smith's framework provides a devastating critique of the East India Company's economic logic and institutional fitness, accurately predicting that merchants would make predatory sovereigns. However, the concept of "vicarious sovereignty" reveals a limit in his thought: he assumes that replacing the Company with the Crown would solve the accountability problem, underestimating the structural moral disconnect inherent in *any* distant imperial rule. His theory explains why the Company failed, but it lacks the political vocabulary to explain why the British state itself was structurally incapable of holding the Company accountable to the Bengali people. The anomaly lies not in his diagnosis of greed, but in his faith that a distant Parliament could serve as a sufficient surrogate for the absent consent of the governed.
