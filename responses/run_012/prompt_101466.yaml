answer: |-
  You have identified a structural fault line that runs through the philosophy of science, history, and law, though it rarely has a single catchy name in general discourse. In technical philosophy, the distinction you are drawing is known as the difference between **Type Causation** (general regularities) and **Token Causation** (singular events). The confusion you are witnessing is **Type-Token Conflation**.

  However, because you are specifically asking about the *linguistic slide* between the two kinds of "if"-statements and the *evidentiary asymmetry* regarding single cases, the most precise diagnosis involves two concepts working in tandem.

  ### 1. The Concept: Type-Token Conflation
  The standard philosophical carving for this error is **Type-Token Conflation** (or the **Type-Token Category Error**).

  *   **Type Claims (General):** "Smoking causes cancer." This is a claim about populations and frequencies. It is supported by correlation and refuted by showing the correlation does not hold (e.g., a smoker who doesn't get cancer weakens the statistical strength, though doesn't strictly falsify a probabilistic law).
  *   **Token Claims (Singular):** "The smoking of this specific cigarette caused this specific person's cancer." This is a claim about a specific sequence of events in history. It is a counterfactual claim: "Had this person not smoked this cigarette, they would not have developed cancer at this time."

  **The Error:** The analyst makes a **Token** claim (about the specific war/recession) but supports it with **Type** evidence (frequencies/correlations). The critic accepts these terms of engagement but refutes the **Type** evidence (with a single counter-instance), believing they have thereby refuted the **Token** claim.

  ### 2. The Linguistic Mechanism: Modal Equivocation
  You asked specifically about the confusion of the two "if"-claims. In logic and linguistics, this is **Modal Equivocation**, specifically between **Indicative** and **Subjunctive** conditionals.

  *   **The Predictive "If" (Indicative):** "If the trigger occurs, the outcome follows." This claims a regularity in the actual world. It is vulnerable to a single actual counter-example (a case where the trigger occurred and the outcome did not).
  *   **The Explanatory "If" (Subjunctive/Counterfactual):** "If the trigger *had not* occurred, the outcome *would not have* followed." This claims a dependency in a *possible* world (a world identical to ours except for the absence of the trigger).

  **The Carving:** The error lies in assuming that the truth of the Subjunctive (Token) claim *depends* on the universal truth of the Indicative (Type) claim. This assumption is not logically necessary. A trigger can be necessary for an outcome in one specific context (due to unique background conditions) even if that trigger fails to produce the outcome in other contexts.

  ### 3. A Name for the Rhetorical Move
  While "Type-Token Conflation" is the academic standard, it describes the *categories* rather than the *rhetorical slide*. For the specific habit of treating evidence for one as evidence for the other in debate, I propose the term **The Counterfactual-Regularity Slide**.

  **Definition:** The Counterfactual-Regularity Slide occurs when a proponent justifies a singular counterfactual claim ("$T$ was necessary for $O$ in this case") using general regularity evidence ("$T$ usually leads to $O$"), and a critic refutes that singular claim using general regularity counter-evidence ("$T$ sometimes does not lead to $O$").

  **Boundary:** This term covers both the outright conflation (claiming they are the same) and the looser habit (treating them as interchangeable for evidentiary purposes). It does not cover cases where the analyst explicitly argues that the specific background conditions make the general rule applicable; it applies only when the *difference* in standards is ignored.

  ### 4. Locating the Error
  You asked where exactly the error lies: logic, evidence, or something else.

  *   **It is not merely Logical Equivocation:** Simple equivocation is using a word with two meanings (e.g., "bank" of a river vs. "bank" for money). Here, the participants often understand the difference intellectually but proceed as if the *standards of proof* are identical.
  *   **It is not the "Butterfly Effect":** The butterfly effect concerns *sensitivity to initial conditions* (small causes, large effects). Your observation concerns *causal necessity* (was this cause required?).
  *   **It is an Error of Evidentiary Relevance rooted in Metaphysics:** The mistake is assuming a **Humean** metaphysics of causation. David Hume argued that causation *just is* regularity. If you believe this, the critic is right: a single counter-example damages the causal claim. However, most modern historians and analysts operate with a **Counterfactual** or **Mechanistic** view of causation (causation is about dependency or physical connection, not just pattern). Under this view, the critic's single counter-example is **irrelevant** to the singular claim, because the background conditions in the counter-example may differ.

  **The Verdict:** The critic is misusing the evidence. A single case where the trigger occurred without the outcome refutes the claim that the trigger is *sufficient* for the outcome (Predictive/Type). It does not refute the claim that the trigger was *necessary* for the outcome in the specific case under discussion (Explanatory/Token), unless one assumes that causal relationships must be invariant across all contexts (The Assumption of Causal Invariance).

  ### Summary for Your Reporting
  If you need a label to use in print that is precise but accessible:

  1.  **The Technical Term:** **Type-Token Conflation**. (Use this when describing the categories of claims).
  2.  **The Descriptive Term:** **The Counterfactual-Regularity Slide**. (Use this when describing the debate tactic).
  3.  **The Diagnosis:** The participants are treating **singular historical necessity** as if it were **general predictive sufficiency**.

  The error is not that they are using the word "if" carelessly; it is that they are implicitly agreeing to judge a historical explanation by the standards of a scientific law, where a single exception carries weight it does not bear in singular causal history.
