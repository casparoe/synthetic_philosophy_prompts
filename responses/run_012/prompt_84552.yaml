  Then the part I actually care about is the leftovers. I want the residue report: what survives the translation cleanly, what only survives if you fudge something (and tell me what you had to fudge), and what has no counterpart in my vocabulary at all. For each leftover, say whether the problem is that game design just can't express it, or that Rawls was being vague / smuggling something in that only sounds clear in philosophy words.

  Format it like this:
  - Setup (3 sentences): what you're counting as my vocabulary, and what you're assuming I already know about Rawls.
  - Term-by-term translation (the longest part, a list): each Rawls term, its game-design counterpart, and a tightness score out of 5 with one line on why.
  - The residue (a few hundred words): the leftovers, grouped by kind.
  - Verdict (4-5 sentences): is the stuff that didn't survive a hole in how game designers think, or a hole in Rawls?

  Don't go easy on me and definately don't just tell me it's a great analogy — I want the places where it breaks.
