  Okay so I'm a junior in high school and I play alot of competitive games — team games with character/role picking, matchmaking ratings, balance patches, tier lists, that kind of stuff. I've also messed around making my own little games in Godot and doing the spreadsheet balance thing, so I'd say I'm pretty fluent in that vocabulary. In civics we spent like a day and a half on Rawls and I got the gist (veil of ignorance, difference principle, worst-off people) but I honestly can't tell if I understand it or just memorized the vibes.

