answer: |-
  You put the case with a sharpness that does you credit, and I will not pretend the sting is not felt. It is the easiest thing in the world to cry hypocrisy when a man writes of liberty in one volume and administers empire in another, but you mistake the nature of the contradiction if you think it lies in the principle rather than the application. I have never said that despotism is good; I have said that it is sometimes the only means by which a people may be brought to a state where despotism is no longer necessary. You ask who is the judge of whether improvement is occurring. The answer is not simple, for there is no supreme court of humanity to which the Indian ryot may appeal, but the judge is the enlightened conscience of the governing nation, scrutinised by the free press and the Parliament of England, and ultimately by the test of history. If the rule produces only wealth for the master and misery for the subject, if it stagnates rather than educates, if it crushes the spirit rather than training it, then it has failed. That is the test. It is not a legal test, for you are right that the beneficiary cannot sue, but it is a moral one, and it binds the trustee far more tightly than any court of chancery could.

  As for your specific charge regarding the annexations, you refer to the policy where a state lapses to the Paramount Power upon the failure of natural heirs. I will not defend every act of Lord Dalhousie, for men in high office are prone to the intoxication of power and may mistake the extension of territory for the extension of good government. There were instances where the strict application of this rule caused resentment without securing any corresponding benefit to the people, and where resentment exists, improvement is stalled. If an annexation brings only a change of master without bringing security, justice, or roads and schools, then by my own proviso it stands condemned. I have criticised such blunders in my dispatches, for I was not there to rubber-stamp the ambitions of generals but to ensure the Company remained a vehicle for civilisation. To say that because some annexations were errors, the whole principle of trusteeship is void, is to argue that because a physician may sometimes prescribe the wrong draught, the art of medicine is a fraud.

  But you press me further, implying that the proviso in *On Liberty* is a hole large enough to swallow a subcontinent. Consider the alternative. If we are not to govern those unfit for liberty, are we to abandon them to their own feuds, to the tyranny of native despots who have no such moral restraint upon their power? I have seen the correspondence from India for thirty years; I have seen the suttee abolished, the thuggee suppressed, the infant saved from the river. These are not the acts of a power that sees itself as mere owner. You say the trust is a gift to the trustee because the beneficiary cannot see the accounts. I say the accounts are written in the condition of the people themselves. If, after fifty years, they are no safer, no healthier, and no more capable of reasoning than before, then indict us. But do not indict the principle because the servants of the Company were men and not angels. You ask what I would do if I disagreed with the judge; I would write, I would speak, and I would use whatever influence I possessed to alter the course of administration, just as I do now from this desk. But tell me, if you strip us of the authority to govern, what concrete mechanism do you propose to secure the Indian from the Indian tyrant, without which no liberty is possible?
