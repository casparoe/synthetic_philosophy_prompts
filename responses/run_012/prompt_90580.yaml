      *   *Metaphysics of Collective Agency:* Can a "nation" be an agent? Methodological individualism says no (only individuals act). Collectivism says yes (states have intentions irreducible to individuals). A middle ground: Institutions act through individuals, creating structural intentions.
      *   *Ethics of Memory/Museums:* What is the function of a local heritage museum? Is it to adjudicate historical truth or to facilitate understanding/remembrance? Does "blame" belong in a memorial space?
      *   *Jaspers:* *The Question of German Guilt* (1947). Distinguishes Criminal, Political, Moral, and Metaphysical guilt.
          *   *Criminal:* Violation of laws (individual).
          *   *Political:* Liability for the actions of the state (all citizens bear this, leads to reparations/consequences).
          *   *Moral:* Individual conscience.
          *   *Metaphysical:* Solidarity with humans.
          *   *Relevance:* Jaspers argues *political* guilt is collective (citizens are liable for their state), but *moral/criminal* guilt is individual. This helps separate "Germany started it" (political/historical causation) from "Germans are sinners" (moral).

  3.  **Formulate the Recommendation:**
      *   *The Problem:* The current label ("Germany's war") is too blunt. It conflates historical causation with moral blame. It ignores the systemic nature of 1914 while trying to correct the old "everyone is guilty" myth. It risks alienating the community and visitors.
