answer: |-
  **MEMORANDUM**

  **TO:** The Board of Trustees, City Heritage Trust
  **FROM:** The Chair, Exhibitions Sub-Committee
  **DATE:** 18 October 2023
  **SUBJECT:** Recommendation regarding WWI Permanent Gallery Labeling

  **1. The Recommendation**

  I recommend that the Board **rejects the current draft label** stating the conflict was "Germany's War."

  Instead, we should adopt a text that describes the specific *decisions* made by the German government in July 1914 (specifically the "Blank Cheque" to Austria-Hungary and the activation of the Schlieffen Plan) without attributing singular moral agency to the German nation as a whole. We should aim to have a revised draft circulated by next Tuesday, with a final vote on the wording at the November board meeting, allowing installation to proceed by Christmas.

  This is not a compromise of historical truth for the sake of diplomacy. It is a correction of a metaphysical error. The current label confuses *causal responsibility* with *moral blame*, and *state institutions* with *national populations*. A museum label is not a courtroom verdict; it is an educational tool. If the wording shuts down understanding among our German visitors or implies a collective sin that history does not support, it has failed its function.

  **2. Engaging the Curator's Position (The Strongest Case For "Germany's War")**

  We must acknowledge that the Curator's position is not without merit. Since Fritz Fischer's work in the 1960s, the consensus among many historians is that the German leadership did not merely "slide" into war but actively exploited the July Crisis to achieve strategic dominance. To say Germany bears the *primary* responsibility for escalating a regional conflict into a continental war is historically defensible. To erase this would be to whitewash the evidence of the Blank Cheque.

  However, the strongest version of the opposing argument is not that Germany was innocent, but that the phrase "Germany's War" is historically imprecise and philosophically incoherent. It implies a monolithic national will that did not exist. There were factions in Berlin; there was hesitation; there was miscalculation. More importantly, it ignores the agency of Vienna, Belgrade, and St. Petersburg. By making Germany the sole protagonist of the outbreak, we inadvertently treat the other empires as scenery, which is bad history. We risk replacing the old myth ("everyone is equally guilty") with a new myth ("only one is guilty"), rather than presenting the complex machinery of alliance systems and mobilization timetables that actually drove the catastrophe.

  **3. Collective Responsibility and the "Nation" as Agent**

  This brings us to the core philosophical difficulty: Can a nation be guilty?

  A nation is not a person. It does not have a mind to form intent, nor a conscience to feel remorse. Only individuals make decisions. When we say "Germany wanted war," we are using a shorthand for "a specific circle of elites within the German government calculated that war was advantageous."

  If we label this "Germany's War," we implicate the German people—the workers, the socialists, the farmers—who had no say in the Kaiser's council. This is where the trustee's concern about his grandfather is vital. It conflates *political liability* with *moral culpability*.

  This is where Karl Jaspers is genuinely useful, not as a red herring. In *The Question of German Guilt*, Jaspers distinguishes between **Political Guilt** and **Moral Guilt**.
  *   **Moral Guilt** is individual. It applies to the specific crimes an individual commits or consents to.
  *   **Political Guilt** is collective. It applies to all citizens because they are liable for the actions of their state.

  Jaspers argues that while all Germans bore *political* guilt (meaning they were liable for the consequences, reparations, and the historical record of their state's actions), they did not all bear *moral* guilt. The current label blurs this distinction. It sounds like an accusation of moral sin against a people, rather than a statement of political causation regarding a state. A museum in 2023 should be precise enough to make that distinction. We can state that the German *State* escalated the conflict without implying the German *People* were uniquely evil.

  **4. Proposed Path Forward**

  We are not dropping the causal claim; we are refining it to be more accurate and less alienating.

  **Action Plan:**
  1.  **Immediate:** The Curator is to rewrite the label to focus on *actions* rather than *ownership*.
      *   *Instead of:* "This was Germany's War."
      *   *Try:* "While tensions existed across Europe, the decision by the German government to offer Austria-Hungary unconditional support ('The Blank Cheque') and its subsequent invasion of Belgium turned a regional crisis into a continental war."
  2.  **Consultation:** Before the November vote, we share the revised text with our twin town contacts in Bavaria and the trustee representing the POW descendants. This is not for veto power, but for a "sensitivity check" to ensure we are communicating clarity, not accusation.
  3.  **Timeline:** Revised draft by Tuesday 24th. Board vote on final wording 15th November. Gallery opening remains scheduled for Spring.

  **Conclusion**

  We honor the dead by telling the truth, but the truth requires precision. Saying "Germany started it" is a slogan. Explaining *how* the German leadership's decisions triggered the wider mechanisms of war is history. The former divides us; the latter educates us. I urge the board to support the revised wording.

  **Chair, Exhibitions Sub-Committee**
