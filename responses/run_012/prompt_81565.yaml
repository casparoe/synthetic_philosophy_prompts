answer: |-
  ### The Collapse Filter: A Decision Procedure

  This procedure is designed to be run by a writer in twenty minutes. It is not a negotiation. It is a filter. If the text fails a "Stop" question, the word is banned. If it hits a "Hand-off," the draft goes to the curatorial group with a specific note.

  **Question 1: What is the Subject? (Grain Check)**
  *   **Ask:** Is the noun being modified a *political structure* (dynasty, palace system, kingship) or a *human community* (people, culture, language, civilization)?
  *   **Sufficient Answer:** "The X Dynasty" or "The X Palace System."
  *   **Stop:** If the subject is "The X People," "The X Civilization," or "The X Culture."
  *   **Reason:** Polities end; peoples transform. "Collapse" applied to people implies extinction.
  *   **Hand-off:** None. This is a binary factual check.

  **Question 2: Is There Continuity? (Survival Check)**
  *   **Ask:** Do direct descendants of this subject still exist, speak the language, or occupy the land in a recognizable cultural continuum?
  *   **Sufficient Answer:** "No, the specific political entity ceased to function and was not replaced by a direct successor of the same name/structure."
  *   **Stop:** If the answer is "Yes, millions still speak the language/live on the land."
  *   **Reason:** You cannot collapse a house while the family is still living in the rooms.
  *   **Hand-off:** None.

  **Question 3: What is the Evidence of Ending? (Visibility Check)**
  *   **Ask:** Is the primary evidence for the end the cessation of *elite* markers (monuments, inscriptions, imported luxury goods)?
  *   **Sufficient Answer:** "No, there is evidence of population decline, settlement abandonment, or dietary collapse across all classes."
  *   **Hand-off:** If the answer is "Yes, mostly the monuments and writing stop."
  *   **Note to Curators:** "Text relies on elite visibility bias. Request permission to use 'collapse' for the *record* rather than the *society*."
  *   **Reason:** Silence in the archive is not silence in the landscape.

  **Question 4: What is the Rate of Change? (Speed Check)**
  *   **Ask:** Does the change happen within two generations (approx. 50 years)?
  *   **Sufficient Answer:** "Yes, the systemic function stopped within 50 years."
  *   **Stop:** If the process took more than 150 years.
  *   **Reason:** In 90 words, a century of decline reads as "transformation," not "collapse."
  *   **Hand-off:** If the evidence is between 50 and 150 years.
  *   **Note to Curators:** "Timescale is ambiguous. Request decision on 'decline' vs. 'collapse'."

  **Question 5: What is the Moral Lesson? (Intent Check)**
  *   **Ask:** Does using "collapse" serve to warn the visitor about modern behavior (climate, inequality, hubris)?
  *   **Sufficient Answer:** "No, it is purely descriptive of a systemic failure."
  *   **Hand-off:** If the answer is "Yes, we are drawing a parallel to today."
  *   **Note to Curators:** "Text uses 'collapse' as a cautionary tale. Request approval on moral framing."
  *   **Reason:** The gallery describes the past; it does not preach to the present without explicit curatorial mandate.

  ***

  ### Application of the Procedure

  Here is the procedure run on your four cases. I have taken definite positions.

  **1. Bronze Age Eastern Mediterranean**
  *   **Q1 (Subject):** "Palace Economies." (Pass)
  *   **Q2 (Continuity):** Linear B lost, palaces burned, population dropped significantly. (Pass)
  *   **Q3 (Evidence):** Settlement abandonment is widespread, not just elite. (Pass)
  *   **Q4 (Speed):** Within two generations in key zones. (Pass)
  *   **Q5 (Lesson):** Often used to discuss trade interdependence. (Hand-off)
  *   **Verdict:** **Allowed with Curator Sign-off.**
  *   **The Unpopular Outcome:** I am ruling that this requires a **Hand-off on Q5**. You said everyone is content here. I am disrupting that. Your writers will hate this most. They view the Bronze Age Collapse as the "safe" hook. They are wrong. They are using it as a shorthand for "globalization failed," which is a moral lesson about trade networks. That is a curatorial judgement, not a writing one. The friction is necessary.

  **2. Classic Maya Southern Lowlands**
  *   **Q1 (Subject):** "Maya Civilization." (Stop)
  *   **Correction:** Change subject to "Classic Kingship."
  *   **Q2 (Continuity):** Millions of Maya people remain. (Stop for "Civilization," Pass for "Kingship")
  *   **Q3 (Evidence):** Cessation of stelae/dating. (Hand-off)
  *   **Q4 (Speed):** ~150 years (The "Terminal Classic"). (Hand-off)
  *   **Q5 (Lesson):** Often used to discuss drought management. (Hand-off)
  *   **Verdict:** **Banned for "Maya." Allowed for "Classic Kingship" with Curator Sign-off.**
  *   **Reasoning:** The word "Collapse" is strictly forbidden for the Maya people. It may be used for the political system, but the evidence is elite-biased (stelae stop) and the timescale is slow. This requires the Geologist and Historian to agree that "Political Collapse" is distinct from "Social End."

  **3. Rapa Nui**
  *   **Q1 (Subject):** "Rapa Nui Society." (Pass)
  *   **Q2 (Continuity):** Rapa Nui people remain on the island. (Stop)
  *   **Correction:** Change subject to "Statue-Building Hierarchy."
  *   **Q3 (Evidence):** Ecocide theory debunked; cultivation was wider than thought. (Hand-off)
  *   **Q4 (Speed):** Gradual shift. (Stop)
  *   **Q5 (Lesson):** Strong ecocide warning element. (Hand-off)
  *   **Verdict:** **Banned.**
  *   **Reasoning:** Even with the subject corrected to "Hierarchy," the timescale is too slow and the evidence of "ending" is contradicted by recent agronomy. The "Ecocide" lesson is a moral judgement. Use "Reorganization" or "Shift."

  **4. The Greenland Norse (Case Study)**
  *   **Q1 (Subject):** "Greenland Norse Settlement." (Pass)
  *   **Q2 (Continuity):** No Norse people remain in Greenland. They died out or left. (Pass)
  *   **Q3 (Evidence):** Farm abandonment, burial records cease, no assimilation into Inuit. (Pass)
  *   **Q4 (Speed):** Final decades of the 15th century. (Pass)
  *   **Q5 (Lesson):** Often used to discuss climate adaptation. (Hand-off)
  *   **Verdict:** **Allowed with Curator Sign-off.**
  *   **Reasoning:** This is a genuine collapse. A specific population in a specific place ceased to exist as a functioning entity. There is no continuity of that society. However, because it is frequently used to lecture visitors on climate stubbornness, Q5 triggers a hand-off. The word is factually correct here, unlike the Maya case.

  ***

  ### Where the Procedure Will Misfire

  No procedure survives contact with a clever writer. Here is where this one breaks, and what you cannot automate.

  **1. The Semantic Shift (Gaming Q1)**
  Writers will learn that "Palace System" passes but "Civilization" fails. They will begin writing "The Indus Civilization's Urban Phase Collapsed." This is semantic gymnastics that satisfies the filter while retaining the misleading impact of the word.
  *   **Residual Judgement:** You must spot when the noun phrase is being engineered to bypass Q1. This requires an editor who understands the archaeology, not just the rule.

  **2. The "Silence" Trap (Gaming Q3)**
  Writers will accept "Settlement Abandonment" as proof of total collapse without asking *who* abandoned it. If the elite flee and the peasantry stays, Q3 is technically passed ("Settlement abandonment"), but the implication of total societal end is false.
  *   **Residual Judgement:** Distinguishing between "Elite Flight" and "Total Depopulation" requires archaeological nuance your generalist writers do not have. You will have to spot this in draft review.

  **3. The Moral Hand-off (Gaming Q5)**
  Writers will claim no moral lesson is intended ("We are just stating facts") while structuring the panel to imply one. For example: "The system collapsed due to drought." This sounds descriptive but implies "They failed to adapt."
  *   **Residual Judgement:** Intent is invisible. Your curatorial group will have to judge the *tone*, not the answer to Q5.

  **My Position:**
  I am not banning the word. I am restricting it to **systemic failures of specific political entities where continuity is broken.** If you follow this, the Geologist gets structural language, the Historian gets continuity protection, and you get accuracy. The Bronze Age friction I introduced is the price of that accuracy. Your writers will complain it slows them down. They are wrong. Speed is not the metric; precision is.
