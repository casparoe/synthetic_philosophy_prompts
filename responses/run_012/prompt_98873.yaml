  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure not to sound like a harsh professor. It's a pub reading circle. Keep it encouraging but rigorous.
      *   Ensure the distinction between Burke's "organic growth" and Chesterton's "epistemic humility" is clear in the correction.
      *   Check the "Burke's Fence" error again. In *Reflections*, Burke talks about the "estate of the nation" and "inheritance," but the specific "fence in the road" parable is distinctly Chesterton (*The Thing*, 1929). The student writes: "His [Burke's] famous image of the fence across the road makes the same point." This is factually wrong. I must be firm here.

  9.  **Final Polish:** Check tone. Ensure the "confidence" markers are clear. Ensure the "least sure" point is clearly identified at the end.

  *(Self-Correction on the "Least Sure" point)*: I should be careful. I am an AI. I should be confident on facts. I am less confident on philosophical interpretation. I will flag the assessment of whether the difference is *merely* rhetorical as the point where reasonable minds (and the reading circle) might disagree.

