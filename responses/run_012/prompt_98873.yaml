      *   Better approach: The *interpretive* claim that the difference is *only* rhetorical is the most debatable philosophical point. I can be confident about the facts, but less confident about declaring the philosophical equivalence definitively. I will flag the judgment on whether the difference is *merely* rhetorical as the point of least certainty.

