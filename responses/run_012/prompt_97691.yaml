          *   *View:* Content is fixed by current causal covariation.
          *   *Cost:* Hard to explain error (if it responds to a slug, is it *about* slugs?). Hard to explain unused devices (dispositions?).
      *   *Repair 3: Reject (9) (Embrace Interpretivism).*
          *   *View:* Dennett's Intentional Stance. It's not incoherent; it's just that content is relative to the interpreter.
          *   *Cost:* You lose robust realism (Premise 1 is threatened). You face the regress worry.
