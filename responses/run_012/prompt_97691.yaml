  9.  **Final Polish:** Ensure the distinction between "Causal History" and "Design History" is clear. The argument conflates "history of use" with "history of design." C3 has no history of *use*, but a definite history of *design*. Premise (5) conflates these.

      *Wait, let's look closer at (5).* "Design history cannot do it either, because the third device's history is a mixture and, at the moment of first use, is no more a history of quarter-detecting than of slug-detecting."
      *   *Correction:* The text says "manufacturing histories" are identical for C1 and C2. C3 is "shipped from the American plant to the border town after manufacture."
