      *   *The "Swampman" Counter:* The philosopher might reply, "What if a lightning strike makes an identical device?" (Swampman). If you say C3 has content because of history, does Swampman have none? This is the cost of fixing (5).
      *   *Alternative:* Premise (9). Maybe interpretivism isn't incoherent. (Dennett). But this threatens (1).
