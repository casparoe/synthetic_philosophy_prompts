answer: |-
  This is a classic dilemma that sits at the intersection of probability theory, behavioural economics, and the philosophy of risk. Your finance friend is arguing from the perspective of ensemble averages and asymptotic growth, while your philosopher friend is highlighting the ergodicity problem and the reality of absorbing barriers. Here is how to disentangle the mathematics from the metaphysics.

  ### The Mathematically Settled Ground

  There is broad consensus on the mechanics of repeated betting. If you maximise the expected value (arithmetic mean) of each individual bet, you should stake everything. However, in a repeated sequence, this strategy leads to almost certain ruin. This is because the geometric mean (which dictates long-term wealth growth) is dragged down by volatility.

  The Kelly Criterion, derived by John Kelly in 1956, is the settled mathematical solution for maximising the expected logarithmic growth rate of wealth in a sequence of independent bets with positive expectancy. For your specific bet (60% chance to double, 40% to lose), the net odds are 1:1. The Kelly formula dictates staking 20% of your current bankroll per round. This maximises the long-run compound growth rate and theoretically avoids ruin over an infinite horizon, provided you can bet infinitely divisible fractions.

  It is also settled that introducing a "ruin threshold" (your three months' expenses) changes the optimisation problem. Standard Kelly assumes wealth can approach zero asymptotically; a hard floor where you lose your flat and access to future bets acts as an absorbing barrier. If your wealth approaches this barrier, the optimal bet size drops to zero, regardless of the Kelly signal.

  ### The Genuinely Contested Ground

  Where experts diverge is on how to apply these theories to a human life with a finite horizon and uncertain parameters.

  **1. Ergodicity and Utility:**
  Your philosopher friend is echoing the "Ergodicity Economics" critique (championed by Ole Peters), which argues that standard expected utility theory conflates ensemble averages (what happens to 100 people once) with time averages (what happens to one person 100 times). While traditional economists argue that a logarithmic utility function already accounts for risk aversion, ergodicity proponents argue this is a physical constraint, not just a preference. There is no consensus on whether log-utility is the *moral* or *rational* default for humans, or if something more conservative is required when livelihood is at stake.

  **2. Fractional Kelly:**
  In practice, professional investors rarely bet full Kelly. They use "Fractional Kelly" (e.g., half or quarter Kelly). However, the degree of fractionation is contested. Some argue half-Kelly is optimal when accounting for estimation error in the probabilities. Others argue that when a ruin threshold exists above zero, the fraction should be dynamic, shrinking as wealth approaches the floor. There is no single agreed-upon formula for this adjustment.

  **3. Model Uncertainty and Feedback:**
  Your note that offers are non-independent ("recklessness gets me cut off") introduces model risk. The probabilities (60/40) are not laws of nature but terms set by a counterparty who observes your behaviour. There is no settled mathematics for optimising bets when the rules of the game change endogenously based on your risk profile. This moves the problem from stochastic calculus to game theory, where the "optimal" move depends on inferring the counterparty's hidden tolerance limits.

  ### Synthesis: How the Setup Changes the Advice

  The finite horizon (100 rounds), the ruin threshold (three months' expenses), and the behavioural feedback loop significantly alter the standard advice.

  1.  **The Ruin Buffer:** You cannot treat your total savings as the bankroll. You must subtract the "ruin threshold" (three months' expenses) from your total wealth to determine your *risk capital*. You should never bet a fraction that risks breaching this floor.
  2.  **Discounting for Uncertainty:** Because the odds are not guaranteed independent events and depend on your standing with the counterparty, you must assume your edge (the 60% win rate) is overestimated. This necessitates a significant discount to the Kelly fraction.
  3.  **Option Value:** Maintaining access to the offers has value. Losing your flat eliminates future opportunities. This "option value" argues for greater caution than pure wealth maximisation would suggest.

  **The Verdict:**
  Do not bet the full 20% Kelly. Given the ruin threshold and the non-independent nature of the offers, a fractional approach is required. You should calculate your stake based on wealth *above* the ruin threshold, not total wealth, and apply a further discount (e.g., half-Kelly) to account for model uncertainty.

