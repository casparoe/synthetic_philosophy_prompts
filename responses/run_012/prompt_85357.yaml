prompt: |-
  I'm a metaphysics PhD student working on the special composition question, and there's a line I keep hearing that I can't cash out. Last week in seminar someone ended a debate about whether composition is identity with 'the whole is more than the sum of its parts', like that settled it, and then a minute later used the same line to argue that a heap of sand is a genuine object over and above the grains. Those don't seem like the same claim to me, and I suspect at least one of them is doing no work at all.

  Can you lay out the different precise things that line could be claiming -- from the ones that just tell me what 'sum' is supposed to mean, through the ones that are real claims about emergence or about whether a composite is an extra entity on top of its parts, to the ones that are false or that quietly assume a picture of composition nobody has to accept -- and for each say whether it's trivial, contentious but defensible, or just wrong? Then tell me which reading would actually give him his conclusion, and whether the same reading gets him the heap-of-sand one. Menu format please, I want to bring it to office hours.
