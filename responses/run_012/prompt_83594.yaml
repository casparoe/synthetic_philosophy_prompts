answer: |-
  You asked for a concrete example of why good intentions and rational agreements sometimes fail to stop a bad outcome, specifically looking for a case where the failure comes not from internal betrayal but from the turnover of the participants themselves. I have constructed a case that fits your specifications exactly, focusing on a market dynamic rather than a moral one, to show how the structure of the system overrides the intentions of the individuals within it.

  Consider a local market for residential roofing where ten established firms dominate. Each firm knows that cutting corners on underlayment saves money and allows lower bids, but leads to leaks years later, damaging the industry's reputation and costing everyone in lost trust. All ten owners prefer a high-quality high-price equilibrium, know the others prefer it, and can perfectly monitor each other's supply orders and bid sheets. They sign a binding pact to use only premium materials and maintain a price floor, with immediate punitive price wars triggered by any deviation among them. No owner cheats on this pact; they trust each other and value their ongoing profits. However, the agreement fails to sustain the high-quality equilibrium because new roofing crews constantly enter the market from outside the region, unaware of or unconcerned with the local pact. These new entrants bid lower by using cheap materials, win the price-sensitive contracts, and grow rapidly. The incumbent firms, bound by their pact, lose market share and revenue, eventually shrinking or going bankrupt. As the incumbents exit, they are replaced by more low-cost entrants, until the market is entirely composed of firms using cheap materials, restoring the bad outcome without any single incumbent ever breaking their word.

  To understand why this happens, we can look at the situation through two different analytical lenses. The first lens treats the participants as fixed, which is the standard approach in classical game theory. Under this view, we look at the ten incumbent firms as the entire universe of players. Since they can monitor each other perfectly and have signed a binding agreement, the cost of cheating is higher than the benefit. The Nash equilibrium shifts from defection to cooperation because the contract changes the payoff structure. This analysis predicts that the agreement will hold and the bad practice will disappear. It assumes that the players playing the game remain the same players over time, and that their rationality ensures they stick to the strategy that maximizes their collective utility. If you stop the clock here, the logic is sound; the incumbents are doing exactly what rational actors should do to solve a prisoner's dilemma.

  The second lens treats the participants themselves as the variable being selected, which is the approach taken by evolutionary game theory or market ecology. Here, the focus is not on what a specific player chooses to do, but on which strategies survive in the environment. In this scenario, the strategy of cutting corners yields a short-term cost advantage that allows for lower bids and faster growth. Even though the cooperative strategy is better for the industry as a whole, it is worse for the individual firm's survival in a market where customers choose based on price. This analysis predicts that the cooperative firms will be outcompeted by the defectors, regardless of their internal agreements. The population drifts toward the strategy that generates the highest growth rate, not the highest collective welfare. The agreement fails not because it was broken, but because the signatories were removed from the game by players who never signed it.

  I take the stand that the second analysis explains why the trap persists. The single feature of the case that does the explanatory work is open entry combined with differential growth rates. The incumbents are disciplined, but they are not immune to market selection. If you remove this feature, specifically by closing the market to new entrants or by equalizing the growth rates regardless of pricing strategy, the case collapses into a standard cooperative equilibrium where the binding agreement simply holds. Your suspicion is correct; without the turnover of participants, the rational agreement among the fixed group is sufficient to maintain the good outcome. The trap exists only because the system allows new actors to enter who are not bound by the history or the norms of the existing group, and who are rewarded for ignoring them.

  However, I must now argue against this verdict, adopting the perspective of your colleague who believes that a binding agreement among current participants should be sufficient. The strongest objection here is that a truly rational binding agreement would anticipate the threat of entry and account for it. If the incumbents are truly rational and prefer the cooperative outcome, they would not sign a pact that leaves them vulnerable to being undercut by outsiders; they would include provisions to lobby for licensing barriers, build brand moats, or educate consumers on the long-term cost of cheap roofing. To argue that the agreement fails because of new entrants is to argue that the agreement was incomplete. Furthermore, market selection is not instantaneous. High-quality firms build reputation capital that low-quality entrants cannot immediately replicate. A binding agreement gives the incumbents the stability to leverage that reputation, eventually punishing the low-quality entrants when their roofs fail. From this viewpoint, the selection pressure is overstated, and the agreement is sufficient because it provides the coordination needed to win the long game on quality rather than losing the short game on price. The failure lies not in the structure of the trap, but in the execution of the agreement, which should have been robust enough to handle market dynamics.
