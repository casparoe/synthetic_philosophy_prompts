      *   *Correction on Claim 11:* "Abolished tomorrow." Technically, Parliament *could* pass an act tomorrow. But "without anything else having to change" is the lie. The *system* would change. I need to emphasize the structural dependencies.
      *   *Tone Check:* Ensure I'm not being pedantic but remain firm on the "definite verdicts" instruction. Avoid "some scholars say." Say "A scholar would reject this."
      *   *Sweden Nuance:* Sweden is indeed the most stripped-down, but even there, the Riksdag speaker has roles the Monarch used to have. The passage says the *King* has no role, which is true. I'll accept that but note it's an outlier compared to the UK.
      *   *Discretion:* The "no discretion" claim is the most dangerous. I need to emphasize the "reserve powers" in the UK (appointment of PM, refusal of dissolution in extreme cases).

  7.  **Final Polish:** Check against American English spelling/usage. Ensure the structure is logical. (Claim Audit -> Law/Convention Analysis -> Closing Inference Analysis -> Final Verdict).

