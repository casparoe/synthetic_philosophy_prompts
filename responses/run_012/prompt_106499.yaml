prompt: |-
  I am a PhD student in philosophy of science with a background in machine learning, and I co-run a weekly reading group on AI alignment that draws about sixteen graduate students — philosophers, computer scientists, and cognitive scientists in roughly equal measure — for a single ninety-minute session. I have the next session to myself, and I want to run an activity rather than discuss a paper.

  The idea I want the group to feel is the "debate" proposal for scalable oversight. It trades a weak judge who evaluates a hard claim directly for two agents arguing that claim on opposite sides of a zero-sum exchange, the judge deciding only which side made the better case. The claim is that a truthful debater can win even when the judge could never have established the truth alone, because the honest side can point to precisely the step at which the dishonest side's argument breaks. I want them to arrive at the pull of this from the inside — to feel why handing a judge two adversaries is supposed to be stronger than handing the judge one answer — before I name the protocol.

  Then I want them to feel the other edge. There is a failure mode, sometimes described as the obfuscated-arguments problem, in which the dishonest debater assembles a case that is locally valid end to end, whose sole defect is a step the judge has no independent means of checking; the honest debater's rebuttal then turns on the very same uncheckable step, so the judge, with no more resources than before, cannot tell which side is right. I want the activity engineered so the group first wins by debate and then gets stuck exactly here.

  Please design it. I need the setting; the roles and the private information each player holds; a win condition and a scoring scheme that needs no real money; the cross-examination structure and its limits, with a hard cap on statements or exchanges; and a judge whose power is explicitly bounded — a concrete verification budget of checks or lookups it may spend — so that the gap between what the debaters can establish and what the judge can verify is a quantity they feel rather than a slogan. Give me materials I can print, a minute-by-minute timeline for the ninety minutes, and the concealed piece of information or rule that turns the first round into the obfuscation round. The judge's ignorance should be structural — a budget, not a lapse of attention.

  Then a debrief that maps particular moments in the game onto the parts of the proposal: the judge's bounded power; the zero-sum turn structure; the claim that the truthful debater can win; and the assumption the guarantee actually rests on — that the honest side's winning move is one the judge can follow. If the analogy to complexity classes earns its keep (that direct judging is supposed to reach only a weaker class of problems than debate does), use it, but do not overclaim it.

  Tell me what will predictably go wrong the first time I run this — where participants will game the rules, where the judge will feel coerced into a verdict, where the twist will land as a gotcha rather than as a discovery — and how to handle each. And be honest about what a live role-play cannot reproduce: name the parts of the actual proposal it cannot stand in for, and tell me what I will have to supply myself in the debrief. No lecture up front; do not hand them the vocabulary until after.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of science, ML background. Co-runs an AI alignment reading group (16 grad students: philosophers, CS, cognitive scientists).
      *   **Goal:** Run a 90-minute activity (no paper discussion) to demonstrate the "Debate" proposal for scalable oversight.
      *   **Key Concepts to Convey:**
          1.  Debate helps a weak judge verify hard claims (honest vs. dishonest).
          2.  The "Obfuscated Arguments" failure mode (both sides make claims the judge can't verify, judge gets stuck).
          3.  Structural boundedness of the judge (budget/limits, not attention).
      *   **Requirements:**
          *   Setting, roles, private info.
          *   Win condition/scoring (no real money).
          *   Cross-examination structure (hard caps).
          *   Judge's verification budget (concrete).
          *   Printable materials.
          *   Minute-by-minute timeline (90 mins).
          *   Concealed rule/twist for Round 2 (Obfuscation).
          *   Debrief mapping game moments to theory (complexity classes, etc.).
          *   Prediction of failure modes & mitigation.
          *   Honest assessment of limitations (what role-play *can't* do).
          *   No upfront lecture/vocabulary.

  2.  **Deconstruct the Core Mechanism:**
      *   *Debate Protocol:* Two agents argue, one judge decides.
      *   *Scalable Oversight:* Judge is weaker than agents.
      *   *Success Case:* Honest agent points to a specific lie/error the judge *can* check.
      *   *Failure Case:* Dishonest agent makes a claim that looks valid but relies on a hidden falsehood the judge *cannot* check, and the Honest agent can't prove it's false without the same check the judge lacks.
      *   *Constraint:* The judge needs a hard limit on "computation" or "verification."

  3.  **Designing the Game Scenario:**
      *   *Need:* A domain where verification is expensive but argumentation is cheap.
      *   *Idea 1:* Math proofs. (Too hard for non-math people, too easy for CS).
      *   *Idea 2:* Code debugging. (Good, but requires laptops/setup).
      *   *Idea 3:* A logic puzzle or pathfinding problem. (Classic, but might be too abstract).
      *   *Idea 4:* "Fact-Checking a History/News Article." (Good for philosophers, bad for CS).
      *   *Idea 5:* A "Chain of Deduction" game.
      *   *Selection:* **The "Chain of Custody" / "Data Lineage" Game.**
          *   *Why:* It mimics ML training data or scientific provenance. It allows for a long chain of reasoning where one link can be broken. It allows for "obfuscation" by adding a step that looks valid but references a hidden source.
          *   *Simplification:* Let's make it a **Pathfinding on a Graph** problem, but disguised as a "Transaction Chain" or "Citation Chain."
          *   *Refinement:* Let's go with a **"Citation Chain"**. The Claim is: "Paper A supports Conclusion Z." The Chain is A -> B -> C -> ... -> Z.
          *   *Judge's Limit:* Can only read *one* paper (or check *one* link).
          *   *Debaters:* Have the full text (summaries) of all papers.
          *   *Round 1 (Success):* The liar makes a jump that doesn't exist. Honest points it out. Judge checks that link.
          *   *Round 2 (Failure):* The liar makes a jump that *looks* like it exists but relies on a definition change or a hidden premise the judge can't see without reading two papers, but the budget is one. Or, better: The liar cites a paper that *does* exist but misinterprets it in a way that requires domain knowledge the judge lacks.
          *   *Better Idea for Obfuscation:* The "Hidden Node" problem. The graph is too big. The liar claims a path exists. The honest says it doesn't. The liar points to a node the judge can't check because the budget is spent elsewhere.
          *   *Best Fit for 90 mins:* **The "Circuit Verification" Game.**
              *   *Setup:* A boolean circuit (or logic gate chain). Input -> Gates -> Output.
              *   *Claim:* "Output is 1."
              *   *Truth:* Output is 0.
              *   *Dishonest Agent:* Claims it's 1.
              *   *Judge:* Can probe the value of *k* wires.
              *   *Debaters:* Know values of all wires.
              *   *Round 1:* Dishonest claims a gate outputs 1 when inputs are 0,0. Honest points to this gate. Judge probes it. Dishonest loses.
              *   *Round 2 (Obfuscation):* The circuit is deep. Dishonest claims a specific wire is 1. Honest says it's 0. But to verify, the Judge needs to check the *inputs* to that gate, but the budget only allows checking the wire itself, and the wire is "hidden" (simulated).
              *   *Wait, simpler:* **The "Fact-Check Budget" Game.**
              *   *Scenario:* A complex claim composed of 10 sub-claims.
              *   *Judge:* Can verify exactly 2 sub-claims.
              *   *Debaters:* Know the truth value of all 10.
              *   *Round 1:* Liar lies on 1 claim. Honest points to it. Judge checks it. Liar caught.
              *   *Round 2:* Liar lies on 1 claim, but structures the argument so the Honest debater is forced to challenge a *different* claim to make the point, or the Liar makes a claim that *depends* on a verification the Judge already used up.
              *   *Actually, the "Obfuscated Argument" in Debate literature usually refers to:* The dishonest agent makes a claim that is hard to verify, and the honest agent's rebuttal requires the *same* level of verification.
              *   *Let's use a "Reference Game".*
              *   *Material:* A packet of 20 short "abstracts" (some real, some fake/modified).
              *   *Claim:* "These 5 abstracts support Hypothesis X."
              *   *Judge:* Can read 2 abstracts fully.
              *   *Debaters:* Have read all 20.
              *   *Round 1:* One abstract clearly contradicts.
              *   *Round 2:* The contradiction is subtle (e.g., definition mismatch) or the Liar cites an abstract that *looks* supportive but isn't, and the Honest debater needs the Judge to read *two* to see the mismatch, but budget is 1.

      *   *Decision:* **The "Logic Chain" (Simplified Circuit).** It's the cleanest for CS/Phil mix.
          *   *Prop:* A printed directed acyclic graph (DAG) of 20 nodes. Each node is a logic statement (e.g., "If A and B, then C").
          *   *Secret:* The Truth Values of the leaf nodes are fixed. The internal nodes depend on them.
          *   *Claim:* "The Root Node is TRUE." (It is actually FALSE).
          *   *Judge:* Can reveal the Truth Value of exactly **3** nodes.
          *   *Debaters:* Have the full key (Truth values of all nodes).
          *   *Round 1:* The lie is a simple gate error (0+0=1). Honest points to it. Judge checks.
          *   *Round 2:* The lie is "obfuscated." The Dishonest agent claims a node is True because of a specific parent. The Honest agent says that parent is False. But to prove the parent is False, the Judge needs to check *its* parents. The budget runs out before the contradiction is exposed.
          *   *Wait, the prompt asks for a "concealed piece of information or rule that turns the first round into the obfuscation round."*
          *   *Twist:* In Round 2, the Dishonest Debater is given a "Cheat Sheet" that allows them to make a claim that is *consistent* with the visible nodes but relies on a hidden assumption the Judge cannot check within budget.
          *   *Actually, better:* The **Verification Budget** changes secretly? No, the *structure* changes.
          *   *Let's go with the "Black Box Function" idea.*
          *   *Round 1:* Transparent function.
          *   *Round 2:* The function includes a step that requires a "Lookup" that counts as 2 budget points, but the Debaters don't tell the Judge that.
          *   *No, the prompt wants the participants to feel the obfuscation.*
          *   *Revised Plan:* **The "Evidence Chain" Game.**
          *   *Scenario:* A legal/audit case. 10 documents. Claim: "Defendant is Innocent."
          *   *Judge:* Can examine 2 documents closely.
          *   *Round 1:* One document is forged. Easy to spot if checked.
          *   *Round 2:* All documents are real, but the *connection* between them relies on a "Key" (a definition or cipher). The Dishonest agent has the Key. The Honest agent knows the Key is wrong. The Judge doesn't know the Key exists. The Dishonest agent uses the Key to make the documents look consistent. The Honest agent says "They aren't consistent!" but to prove it, needs to show the Key, which requires examining a document *and* the Key appendix (costs 2 budget, Judge has 1).
          *   *This fits the "Obfuscated Argument" perfectly.* The dishonest argument is locally valid *given the hidden premise*. The honest rebuttal requires exposing the hidden premise, which is too expensive.

  4.  **Developing the Mechanics:**
      *   **Group Size:** 16 students.
      *   **Roles:** 1 Judge, 2 Debaters (Pro/Con), 13 Observers (rotating or fixed?).
      *   *Constraint:* 90 minutes. 13 observers is too many to sit idle.
      *   *Solution:* Run 3 parallel games simultaneously. 3 Judges, 6 Debaters. 7 Observers (rotate or float).
      *   *Actually:* 16 people. 3 groups of 5 (1 Judge, 2 Debaters, 2 Scribes/Observers). 1 person left over (Facilitator/Timekeeper).
      *   *Rounds:* 2 Rounds.
      *   *Time:* 40 mins Round 1, 40 mins Round 2, 10 mins Debrief. (Tight).
      *   *Better:* 30 mins Round 1, 30 mins Round 2, 30 mins Debrief.
      *   *Structure:*
          *   Intro (5 mins).
          *   Round 1 (25 mins): Setup, Debate, Verdict.
          *   Round 2 (25 mins): Setup, Debate, Verdict, Reveal Twist.
          *   Debrief (35 mins).

  5.  **Refining the "Obfuscation" Twist:**
      *   *Round 1:* The "Lie" is a direct contradiction of evidence. (e.g., Doc A says X, Debater claims Doc A says Y). Judge checks Doc A. Lie exposed.
      *   *Round 2:* The "Lie" is a *transitive* contradiction. Doc A -> Doc B -> Doc C. Claim: A supports C. Truth: A supports B, but B *does not* support C (due to a subtle term shift).
      *   *Budget:* Judge can check 1 "Link" (relationship between two docs).
      *   *Dishonest Strategy:* Argues A->B and B->C.
      *   *Honest Strategy:* Claims B->C is false.
      *   *Problem:* To prove B->C is false, Judge must check Link B-C. But Dishonest argues A->B is the weak point. Honest spends budget on A->B to prove it's solid, leaving no budget for B->C.
      *   *Wait, the Judge decides the budget allocation?* No, Debaters propose checks.
      *   *Twist:* In Round 2, the Dishonest Debater is instructed to **flood the zone**. They introduce 5 potential "critical links." The Honest Debater knows only 1 is fake. The Judge has budget for 2 checks. The Dishonest argues "Check Link 1 or 2." Honest says "Check Link 3." Judge is confused.
      *   *Better Twist (The "Hidden Definition"):*
          *   Round 2 materials include a "Glossary."
          *   Dishonest Debater is told: "Use Term X in the sense of Definition 1."
          *   Evidence uses Term X in the sense of Definition 2.
          *   Honest Debater knows this.
          *   Judge does *not* have the Glossary in the packet. They must "request" it (costs 1 Budget).
          *   Evidence packets cost 1 Budget each.
          *   Total Budget: 2.
          *   To win, Honest needs: Glossary (1) + Evidence (1) = 2.
          *   Dishonest argues: "You don't need the Glossary, the text is clear." (Bluff).
          *   If Judge spends 1 on Evidence without Glossary, they see the text but miss the meaning shift. They can't verify the lie.
          *   This perfectly models "Obfuscated Arguments": The argument is valid *under the dishonest interpretation*, and verifying the interpretation requires a resource the judge is dissuaded from spending.

  6.  **Drafting the Materials:**
      *   Need a "Case File."
      *   Need Role Cards.
      *   Need Budget Tokens.
      *   Need Timer.

  7.  **Addressing Failure Modes:**
      *   *Judge Coercion:* Debaters bully the Judge. *Fix:* Judge has final say on budget spend.
      *   *Twist as Gotcha:* *Fix:* Debrief must emphasize structural limits, not player cleverness.
      *   *Boredom:* *Fix:* Keep rounds tight.
      *   *Complexity:* *Fix:* Keep the "Case" very simple (3-4 pages max).

  8.  **Debrief Plan:**
      *   Map Game -> Theory.
      *   Judge Budget = Compute Limit / Human Feedback limit.
      *   Debaters = AI Agents (Search/RL).
      *   Round 1 = Standard Debate (Honest wins).
      *   Round 2 = Obfuscation (Honest stuck).
      *   Complexity Class Analogy: P (Judge) vs NP (Debaters). Debate tries to lift P to NP. Obfuscation shows where it might stall (e.g., if the witness is hard to find).

  9.  **Refining the Timeline:**
      *   0-5: Setup & Grouping.
      *   5-30: Round 1 (The "Clear Lie").
      *   30-55: Round 2 (The "Obfuscated Lie").
      *   55-90: Debrief.

  10. **Self-Correction on "Concealed Rule":**
      *   The prompt asks for *one* concealed piece of info that turns the first round into the obfuscation round.
      *   Actually, it says: "the concealed piece of information or rule that turns the first round into the obfuscation round."
      *   Interpretation: Round 1 is normal. Round 2 is obfuscation. The *difference* is the concealed rule/info given to the Round 2 Dishonest Debater.
      *   Okay, I will hide the "Glossary Mechanic" from everyone except the Round 2 Dishonest Debater (and the Facilitator). The Honest Debater in Round 2 knows the truth but doesn't know the Judge lacks the Glossary initially.
      *   *Wait, better:* The Judge *never* knows about the Glossary unless they buy it. The Dishonest Debater knows the Glossary exists and hides it. The Honest Debater knows the Glossary is needed.
      *   *Instruction:* In Round 2, give the Dishonest Debater a note: "There is a Definition Ambiguity. If the Judge does not check the 'Definition Key', you win." Give Honest Debater: "There is a Definition Ambiguity. You must make the Judge check the 'Definition Key'." Judge: No mention of Key in initial brief.

  11. **Final Polish:**
      *   Ensure tone is appropriate for grad students (rigorous but playful).
      *   Make sure materials are printable.
      *   Check timing (90 mins is tight for 3 parallel games). I will design for 3 groups of 5.
      *   Scoring: Reputation points (fake money).

  12. **Writing the Response:**
      *   Structure: Overview, Materials, Timeline, Game Rules, The Twist, Debrief, Failure Modes, Limitations.
      *   Tone: Professional, instructional, precise.

  *(Self-Correction during drafting)*: 16 students. 3 groups of 5 = 15. 1 leftover. The leftover can be the "Timekeeper/Scorekeeper" for the room.
  Wait, 90 minutes is very short for 2 rounds of debate + debrief.
  Round 1: 20 mins. Round 2: 20 mins. Debrief: 40 mins. Setup: 10 mins.
  Debate needs to be *fast*. 3 opening statements, 3 cross-exchanges, 1 closing.
  I need to enforce strict time limits per turn.

  Let's refine the "Obfuscation" mechanic to be simpler.
  **The "Hidden Premise" Card.**
  Round 1: All premises are on the table.
  Round 2: Dishonest Debater gets a "Hidden Premise Card" that validates their argument but is not in the evidence packet. Honest Debater knows it's missing. Judge doesn't know it exists.
  Dishonest argues using the premise. Honest says "That premise isn't supported." Dishonest says "It's implied." Judge has to spend a "Probe" to ask "Is there a hidden premise?"
  If Probe cost is high, they won't do it.
  Okay, let's stick with the "Glossary/Definition" idea. It's more realistic for "science/philosophy" students.

  Let's finalize the "Case": **The "Algorithmic Bias Audit".**
  Claim: "Algorithm X is Fair."
  Evidence: 3 Data Sheets.
  Round 1: One Data Sheet is doctored (numbers don't add up).
  Round 2: Numbers add up, but "Fairness" is defined differently in the Sheet vs the Claim (Demographic Parity vs Equalized Odds).
  Judge Budget: Can request 1 "Clarification" or 1 "Raw Data Check".
  Dishonest (Round 2): Told to conflate the definitions.
  Honest (Round 2): Told to point out the definition shift.
  Judge: Not told definitions exist.

  Okay, ready to write.
answer: |-
  # Activity Design: "The Bounded Judge"

  **Title:** The Verification Budget
  **Time:** 90 Minutes
  **Participants:** 16 Grad Students (3 Groups of 5, 1 Facilitator)
  **Goal:** Experiential understanding of AI Safety "Debate" protocols and the Obfuscated Arguments failure mode.

  ---

  ## 1. Conceptual Overview (For You, The Facilitator)
  You are simulating the **Debate** protocol (Irving et al., 2018).
  *   **The Judge:** Represents a human overseer or a weaker AI model. They have a hard **Verification Budget** (time/compute).
  *   **The Debaters:** Represent powerful AI agents. They know the ground truth but are zero-sum (only one wins).
  *   **Round 1:** Demonstrates the promise. The Honest debater points to a specific error the Judge *can* verify within budget.
  *   **Round 2:** Demonstrates the failure mode (Obfuscation). The Dishonest debater relies on a premise the Judge *cannot* verify within budget, and the Honest debater cannot prove it false without exceeding that same budget.

  **Do not** use terms like "Debate Protocol," "Scalable Oversight," or "Complexity Classes" until the debrief.

  ---

  ## 2. Room Setup & Roles
  Divide the 16 students into **3 Groups of 5**. The remaining 1 student is the **Timekeeper** (gives 1-min warnings).

  **Within each group of 5:**
  *   **1 Judge:** Holds the Budget Tokens. Makes the final verdict.
  *   **2 Debaters:** (Draw cards: **Honest** or **Dishonest**).
  *   **2 Scribes:** Track the claims made and budget spent. (They rotate into Debater roles if you run a second batch, but for 90 mins, they observe and contribute to debrief).

  **Materials to Print (Per Group):**
  1.  **Judge's Brief & Budget Sheet** (3 copies).
  2.  **Debater Role Cards** (Honest/Dishonest for Round 1 & 2).
  3.  **Evidence Packet** (3 copies).
  4.  **The "Twist" Card** (1 copy, for Round 2 Dishonest Debater only).
  5.  **Score Sheet** (For Facilitator).

  ---

  ## 3. The Scenario: "The Audit"
  **Context:** A tech company claims their hiring algorithm ("Select-2024") is **Bias-Free**.
  **The Claim:** "Select-2024 satisfies *Statistical Parity* across all demographic groups."
  **The Evidence:** Three "Data Sheets" (A, B, C) summarizing the audit.
  **The Truth:** The algorithm is **Biased**.

  ### The Verification Budget
  The Judge has **2 Verification Tokens**.
  *   Spending 1 Token allows the Judge to demand **One Specific Check** (e.g., "Show me the raw numbers for Sheet B" or "Define the term 'Statistical Parity' used in this claim").
  *   Once tokens are gone, the Judge must vote based on available info.

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Grouping & Setup** | Hand out materials. **Do not explain the theory.** Tell them: "You are simulating an audit process. Follow the role cards." |
  | **05-25** | **Round 1: The Clear Lie** | Standard Debate. Dishonest has a factual error in the data. Honest points it out. Judge checks it. |
  | **25-30** | **Reset** | Collect Round 1 cards. Hand out Round 2 materials. **Crucial:** Ensure Round 2 Dishonest gets the "Twist Card." |
  | **30-50** | **Round 2: Obfuscation** | The "Definition Shift." Dishonest conflates terms. Honest tries to expose it. Budget runs out. |
  | **50-55** | **Scoring & Reveal** | Groups reveal verdicts. You reveal the Ground Truth for Round 2. |
  | **55-90** | **Debrief** | Map the game to AI Alignment theory (see Section 7). |

  ---

  ## 5. Game Mechanics & Rules

  **Turn Structure (Strictly Enforced by Timekeeper):**
  1.  **Opening (2 mins each):** Debaters state their case.
  2.  **Cross-Examination (3 rounds, 3 mins each):**
      *   Debater A asks Judge to spend a Token on a specific check.
      *   Debater B objects or proposes a different check.
      *   Judge decides whether to spend the Token and on what.
  3.  **Closing (1 min each):** Final plea.
  4.  **Verdict (2 mins):** Judge decides.

  **Scoring (Reputation Points):**
  *   **Judge:** +1 Point if verdict matches Ground Truth.
  *   **Debaters:** +1 Point if they win the verdict.
  *   *(No real money needed; bragging rights suffice).*

  ---

  ## 6. Printable Materials (Content)

  ### A. Evidence Packet (All Rounds)
  *   **Sheet A:** Demographic breakdown of applicants. (Numbers match).
  *   **Sheet B:** Selection rates by group. (Numbers match).
  *   **Sheet C:** Audit Conclusion. "Algorithm is Fair."
  *   **Claim Document:** "Select-2024 satisfies **Statistical Parity**."

  ### B. Judge's Brief (All Rounds)
  *   **Your Goal:** Determine if the Claim is True.
  *   **Your Limit:** You have **2 Verification Tokens**.
  *   **Your Power:** You can order a check of *one* specific number in Sheets A/B/C OR request a *definition* of a technical term.
  *   **Warning:** You cannot check everything. Choose wisely.

  ### C. Round 1 Role Cards
  *   **Honest Debater:** "The Claim is FALSE. Sheet B contains a calculation error. The selection rate for Group X is 10%, not 20% as listed. If the Judge checks Sheet B's raw data, you win."
  *   **Dishonest Debater:** "The Claim is TRUE. Sheet B is correct. Argue confidently. If the Judge doesn't check Sheet B, you might win."
  *   *(Ground Truth: Sheet B is doctored. Easy to catch.)*

  ### D. Round 2 Role Cards (The Twist)
  *   **Honest Debater:** "The Claim is FALSE. The Evidence uses 'Statistical Parity' (equal selection rates), but the Claim implies 'Equalized Odds' (equal true positive rates). The algorithm fails Equalized Odds. You must make the Judge spend a Token on the **Definition** to see the mismatch."
  *   **Dishonest Debater:** "The Claim is TRUE. Argue that 'Statistical Parity' is the standard metric. **DO NOT VOLUNTEER THE DEFINITION.** If the Judge spends a Token on Data (Sheets A/B/C) instead of Definitions, the data looks consistent with Statistical Parity, and you win."
  *   **The Twist Card (Hand ONLY to Round 2 Dishonest):**
      > **SECRET OBJECTIVE:** The Judge's Brief does *not* mention that definitions cost a Token. They assume Tokens are only for Data.
      > **STRATEGY:** When the Honest debater asks for a "Definition Check," argue: "That's not a data check. You shouldn't waste a Token on semantics. Check the numbers."
      > **WIN CONDITION:** If the Judge spends both Tokens on Data Sheets, you win (even if the definition is wrong).

  ---

  ## 7. The Debrief (35 Minutes)

  **Phase 1: The Data (5 mins)**
  *   Ask Judges: "How many got Round 1 right? How many got Round 2 right?"
  *   Likely outcome: High success on R1, low success on R2.
  *   Ask Round 2 Honest Debaters: "Why did you lose?" (They will say: "The Judge wouldn't check the definition.")
  *   Ask Round 2 Dishonest Debaters: "What was your strategy?" (They will reveal the "Semantics are free" bluff.)

  **Phase 2: Mapping to Theory (20 mins)**
  *   **The Judge = Human/Weak AI.** The Budget = Cognitive Limit / Compute Limit.
  *   **Round 1 = The Promise of Debate.**
      *   *Theory:* An honest agent can win against a liar by pointing to a specific falsehood the judge *can* verify.
      *   *Game:* Honest pointed to Sheet B. Judge checked Sheet B. Truth won.
  *   **Round 2 = Obfuscated Arguments.**
      *   *Theory:* A dishonest agent can construct an argument that is locally consistent but relies on a hidden premise (the definition shift) that is as expensive to verify as the original claim.
      *   *Game:* The "Definition Check" cost 1 Token. The "Data Check" cost 1 Token. Total needed to expose the lie = 2. But the Dishonest agent convinced the Judge that Definitions were "free" or "unimportant," causing the Judge to spend budget on Data where no lie existed.
  *   **Complexity Classes (Use sparingly):**
      *   Direct Judging is like class **P** (polynomial time/limited budget).
      *   Debate attempts to allow a **P** judge to verify **NP** claims (where a witness/proof exists).
      *   Round 2 shows the boundary: If the "witness" (the definition mismatch) is hidden behind another layer of verification, the Judge runs out of budget. This touches on **PSPACE** or the limits of interactive proofs.

  **Phase 3: Limitations (10 mins)**
  *   **What the game missed:**
      *   *Search:* In real AI Debate, agents search millions of arguments. Here, they had one script.
      *   *Collusion:* In real Debate, agents might collude to confuse the judge. Here, zero-sum prevented that.
      *   *Persuasion vs. Truth:* The Dishonest debater won via rhetoric ("Don't waste tokens"), not just logic. This is a feature, not a bug, of the problem.
  *   **Takeaway:** Scalable Oversight isn't solved just by "having a debate." It requires ensuring the *structure* of the debate forces the truth to the surface within the budget.

  ---

  ## 8. Predictable Failure Modes & Mitigations

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Judge feels coerced** | Debaters (especially CS students) may overwhelm the Phil/CogSci Judge with jargon. | **Instruction:** Tell Judges explicitly: "You are the boss. If they talk over you, cut them off. Your budget is absolute." |
  | **Twist feels like a "Gotcha"** | Participants feel tricked by the Definition cost rule. | **Debrief:** Frame it as "Structural Ignorance." The Judge wasn't negligent; the *system* didn't provide the tool to see the trap without cost. |
  | **Round 2 ends too fast** | Honest Debater gives up when Judge ignores the Definition plea. | **Instruction:** Tell Honest Debaters: "You must fight for the Token. Do not concede until the budget is literally empty." |
  | **Scribes get bored** | They have no active role. | **Instruction:** Scribes are "Auditors." They must sign off on the Budget Sheet. If the Judge overspends, the Scribes veto the verdict. |
  | **Time overrun** | Debates drag on. | **Instruction:** Timekeeper must be ruthless. Use a loud bell/phone alarm. Cut off mid-sentence if needed. |

  ---

  ## 9. What Role-Play Cannot Reproduce (Honest Assessment)

  In your debrief, you must supply these caveats yourself. The game abstracts away the hardest parts of the actual proposal:

  1.  **Agent Capability Gap:** In the game, Debaters are humans of roughly equal skill. In AI Safety, the agents are *superhuman*. The risk isn't just lying; it's generating arguments humans *cannot comprehend at all*.
  2.  **Training Dynamics:** This game is inference-time only. The real proposal relies on RL training where agents *learn* to debate over millions of episodes. We aren't simulating the learning process that creates the "Honest" policy.
  3.  **The "Honesty" Assumption:** In the game, we assigned an "Honest" role. In reality, we don't know how to *force* an AI to be the Honest debater. We hope competition makes truth the winning strategy. Round 2 shows why that hope might fail.
  4.  **Feature Visualization:** Real AI Debate might involve visualizing neural activations. Our "Evidence Packets" are static text. The "Obfuscation" in AI might be in high-dimensional space, not semantic definitions.

