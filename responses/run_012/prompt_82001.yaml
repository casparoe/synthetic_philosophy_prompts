  7.  **Final Polish:**
      *   Structure with clear headings.
      *   Ensure the "Residue Report" is distinct.
      *   Verify the advice on empirical tests is actionable (e.g., Measurement Invariance tests, BIC comparison for mixture models).

  8.  *(Final thought before generating)*: The user is asking for a "translation manual" that also serves as a critique of their own toolkit. I need to be careful not to validate the quant approach as superior, but rather as *different* and specific about what it can and cannot claim. The "suspicion" at the end is crucial—I need to confirm that yes, a factor model will happily summarize a spurious correlation as a latent trait.

