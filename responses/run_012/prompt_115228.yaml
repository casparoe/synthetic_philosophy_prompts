prompt: |-
  I'm a PhD student in philosophy of mind, and I've been asked to give the toast at my advisor's retirement dinner. She is retiring after forty years of arguing that there is no Cartesian theater — no single place in the brain where everything comes together for an inner audience — and that mental life is better described by the multiple drafts model, on which contents become conscious by winning out in a competition among parallel processes rather than by being displayed on a screen. Lately she has put the point this way: a self is a center of narrative gravity, real and indispensable, but no more a physical thing inside the head than a story's protagonist is. She has asked me, only half joking, not to sum her up, since summing up assumes there was a finished thing to sum. The trouble is that a toast is exactly a summing up: it puts one character at the center and gives her life a shape. Roughly half the room will be philosophers and cognitive scientists who will notice if I smuggle the theater back in — no breakthrough moment where it all clicked, no claims about what she was really like deep down — and the other half will be her mother and cousins, who want warmth and a story they can follow. Write me a five-minute toast, in American English, that honors her without reinstating the picture she spent a career dismantling, and that lands for both halves of the room.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy of mind.
      *   **Occasion:** Advisor's retirement dinner (40 years of work).
      *   **Honoree's Philosophy:** Daniel Dennett-esque (Multiple Drafts Model, no Cartesian Theater, Center of Narrative Gravity).
      *   **Constraint 1 (The Philosophical Trap):** Cannot "sum up" her life as if it were a finished, unified thing (no essential core, no single moment of clarity). Must avoid the "Cartesian Theater" metaphor (no inner audience, no single spotlight).
      *   **Constraint 2 (The Audience):** 50% philosophers/cognitive scientists (will spot errors), 50% family (want warmth/story).
      *   **Constraint 3 (The Format):** 5-minute toast (approx. 750-900 words spoken at a moderate pace).
      *   **Tone:** American English, warm, witty, philosophically precise but accessible.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Problem:* A toast traditionally creates a "Center of Narrative Gravity." It says, "This is who she is, this is what she did."
      *   *The Solution:* Acknowledge the paradox. Use the philosophy *as* the structure of the toast. Instead of summarizing a static self, describe a *process* of interaction. Frame her legacy not as a monument, but as a continuing influence on the drafts of others.
      *   *Key Concepts to Weave In:* Multiple Drafts, no Cartesian Theater, Center of Narrative Gravity, competition among parallel processes.
      *   *Avoid:* "She always knew," "Deep down," "The moment she realized," "Her true self."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the awkwardness. Address the instruction ("don't sum me up"). This immediately signals to the philosophers that I get it, and to the family that there's an inside joke.
      *   **Middle (The Career):** Describe the work without reifying the worker. Focus on the *arguments* as living things, not just conclusions. Mention the 40 years not as a straight line, but as a series of revisions.
      *   **Middle (The Person/Teacher):** How did she affect *us*? This fits the "Center of Narrative Gravity" idea. She is a center of gravity for *our* stories. This satisfies the family's need for warmth without violating the philosophy.
      *   **Closing:** The Toast itself. Raise a glass to the future drafts.

      *   *Self-Correction during drafting:* I need to make sure I don't sound *too* dry/academic for the cousins. I need to explain the "Center of Narrative Gravity" metaphor simply. I need to ensure the "no theater" point doesn't sound like "nothing is real." (Dennett's point is that the self is real, just not a *thing*).

  4.  **Developing the Metaphor:**
      *   Instead of a "spotlight" on her life, let's talk about "echoes" or "ripples."
      *   Let's use the idea of "editing." Her life wasn't a script; it was an editing room.
      *   The "Center of Narrative Gravity" is the perfect bridge. It allows us to tell stories *about* her, as long as we admit *we* are the ones telling them.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Start:* Good evening. [Advisor Name] gave me one rule.
      *   *Philosophy bit:* Explain the "no summing up" rule to the family. "She's not a statue."
      *   *Career bit:* 40 years of arguing against the little man in the head.
      *   *Personal bit:* How she treated students. Not pouring knowledge into empty vessels (another Cartesian trap?), but competing drafts.
      *   *The "Gravity" bit:* She is real because we orbit her.
      *   *The Toast:* To the next draft.

  6.  **Refining the Tone:**
      *   Make it warm. Use "we."
      *   Ensure the jargon is explained contextually.
      *   Check timing. 5 minutes is roughly 750 words.
      *   *American English:* Use "advisor" not "supervisor," "toast" not "speech," idioms like "cut to the chase," "spotlight."

