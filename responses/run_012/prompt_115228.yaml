answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], one of [Advisor's Name]'s PhD students.

  When [Advisor's Name] asked me to give this toast, she gave me exactly one instruction. She said, "Do not sum me up."

  Now, for the family members here—her mother, her cousins, her friends from before the days of cognitive science—I need to translate that. She isn't saying she's a mystery, or that she's hiding something. She's saying that a human life isn't a statue. You can't walk around it, point to the plaque, and say, "There, that's the whole thing."

  She spent forty years arguing against the idea that there's a little screen inside our heads where "we" watch our lives happen. She argued that there's no single moment where it all clicks, no deep inner core where the real person sits. So, if I stand here and tell you a story about how she "always knew" who she was, or describe the "true woman" behind the work, half the people in this room will think I'm being sweet, and the other half will think I've failed the thesis.

  So, I'm not going to sum her up. I'm going to talk about gravity.

  [Advisor's Name] likes to say that a self is a "center of narrative gravity." It's real. It's indispensable. But it's not a *thing* you can find in the brain, any more than you can find the protagonist of a novel inside the ink and paper. The protagonist is real because the story organizes itself around them.

  Well, look around this room. This is the story organizing itself.

  For forty years, [Advisor's Name] has been a center of gravity for us. When I was struggling with a draft that felt incoherent, I didn't need her to tell me what to think. I needed to know how the argument would look from her orbit. Her mentorship wasn't about pouring knowledge into empty vessels—that would be assuming we were just empty theaters waiting for a show. It was more like she was a rigorous editor in a room full of competing drafts. She helped the best ideas win the competition.

  To the philosophers here: You know that her work dismantled the idea of a finish line. Consciousness isn't a destination; it's a process. And looking at her career, I don't see a straight line from ignorance to enlightenment. I see forty years of revisions. I see arguments that were sharpened, abandoned, and rewritten. She didn't find the Truth with a capital T and sit on it. She kept the conversation going. She kept the drafts moving.

  And to the family: You might wonder, if she's not a "finished thing," does that make her less real? Less worthy of celebration? I would argue the opposite. A statue is static. A story is alive.

  The warmth you feel from her, the memories you share, the way her mother looks at her tonight—that isn't an illusion. It's the effect of that gravity. She is real because she matters to the people in this room. Her kindness isn't a hidden secret deep inside her; it's the pattern of her interactions with us. It's in the emails sent at midnight, the patience with a confused first-year, the way she listens not to reply, but to understand the draft you're trying to write.

  She asked me not to sum her up because a sum implies an end. It implies the book is closed. But retirement isn't a period at the end of the sentence. It's just a paragraph break. The narrative doesn't stop because the tenure ends. The drafts continue.

  We are all walking around with versions of [Advisor's Name] in our heads—not as a little homunculus watching the show, but as a standard of rigor, a model of curiosity, and a source of warmth. We will continue to revise our own stories based on the gravity she provided.

  So, I cannot toast to "the woman she truly was." I can only toast to the effect she has on us, and the stories we will continue to tell.

  Please raise your glasses.

  To [Advisor's Name]. May your next draft be as rich, as challenging, and as deeply influential as the last forty years. And may we all be worthy of the orbit you've put us in.

  To [Advisor's Name]!
