answer: |-
  Right, I see where you're coming from. Eight years in the backend trenches gives you a clear view of the machinery, which makes the moral fuzziness more annoying, not less. You know it's all just database entries and API calls, but your gut tells you some deletions are murders and others are housekeeping.

  You're looking for a logic you could practically implement—maybe for terms of service, maybe just for your own sanity. Based on your seven cases, your gut isn't running on one rule; it's running on a weighted system. I'd call it **The Anchor Protocol**.

  The core idea is this: Virtual objects are morally weightless *unless* they are anchored to the real world. But "anchored" doesn't just mean "money." It means **Cost**, **Consent**, or **Community**.

  Here is the principle, broken down into three rules that cover your cases.

  ### The Anchor Protocol

  **Rule 1: The Labour & Capital Lock (Investment)**
  A virtual object gains moral weight proportional to the real-world cost invested in it. This cost is either **Time** (labour) or **Money** (capital).
  *   *High Investment = High Protection.*
  *   *Low/Zero Investment = Low Protection.*
  *   **Does the work for:** Case 1 (300 hours labour), Case 4 (£150 capital), Case 5 (Zero cost/low value).
  *   **Why:** This explains why the sword scam is theft but the hat scam isn't really. It also explains why the base destruction is harm (300 hours is a massive real-world cost).

  **Rule 2: The Consent Gate (Agency)**
  Even if an object has high investment, it is only "harm" if the destruction happens without the owner's consent. If the owner chooses to delete it, the anchor is severed voluntarily.
  *   *Non-consensual destruction = Harm.*
  *   *Consensual destruction = Neutral.*
  *   **Does the work for:** Case 1 (No consent = Harm), Case 7 (Your save, your consent = Neutral).
  *   **Why:** This distinguishes griefing from cleaning up your own hard drive.

  **Rule 3: The Sentience Hard Stop (Consciousness)**
  Code is not a mind. No matter how complex the simulation (LLM, VR, scripting), if there is no biological or genuine sentient substrate, there is no victim. Emotional reactions to simulated pain are reflexes, not moral data.
  *   *Real Mind = Moral Status.*
  *   *Simulated Mind = No Moral Status.*
  *   **Does the work for:** Case 2 (Scripted NPCs = Nothing), Case 3 (LLM NPC = Nothing).
  *   **Why:** This validates your gut that the VR NPC begging for life is "nothing," despite the creepy feeling. That feeling is you projecting, not the code suffering.

  **Rule 4: The Social Contract (Shared Space)**
  This is the modifier for multiplayer spaces. A virtual space belongs to the *community* that inhabits it, not just the company hosting it. It gains value as a "place" rather than a "file."
  *   *Active/Recent Community = Protected Place.*
  *   *Truly Dead Community = Data.*
  *   **Does the work for:** Case 6 (12-year world = Real Loss).
  *   **Why:** This treats the server like a pub or a park, not a save file.

  ---

  ### The New Case: The Statue

  Here is the scenario: Someone builds a huge statue of your actual face in a public hub in a game you don't play, with rude carvings, and your mates send you screenshots.

  **The Verdict:** This is **Genuine Harm**.

  **Why?**
  It bypasses the game mechanics and anchors directly to your **Real Identity**.
  1.  **Investment:** You didn't invest time/money in the game, *but* your likeness is your real-world property.
  2.  **Consent:** You did not consent to your image being used.
  3.  **Community:** It's a public hub, designed for social interaction, used to target you socially.

  Under the Anchor Protocol, this isn't about the virtual statue; it's about **Defamation and Harassment** using virtual tools. The "pixels" are the weapon, but the target is your real-world reputation and dignity. It triggers Rule 1 (Identity Capital) and Rule 2 (Lack of Consent). It's the digital equivalent of someone painting a rude mural on your actual house, even if you don't live there anymore.

  ---

  ### The Hard Truth: Which Verdict to Drop

  You asked me to be straight about which of your seven verdicts doesn't fit the code.

  You have to let go of the second half of **Case 6**.

  > *"I think it's a real loss even if the last player had already quit and the world was just sitting there unvisited."*

  **Why you should give this up:**
  This specific clause contradicts Rule 1 (Investment) and Rule 4 (Social Contract).
  If *everyone* has quit, there is no active community (Rule 4 void). If no one is visiting, there is no current time/money investment being lost by users (Rule 1 void).

  To call an empty server a "real loss" comparable to a listed building implies the virtual world has **intrinsic value** independent of humans. But your other verdicts (especially Case 2, 3, and 7) prove you don't believe that. You believe value comes from *people* (their time, money, feelings).

  A listed building is protected because it has historical significance to *us*. If a building was built yesterday, nobody cared about it, and everyone forgot it existed, knocking it down isn't a cultural tragedy.

  **The Fix:**
  Adjust Case 6 to: *"It is a real loss if the community is displaced or if there is an active effort to archive it. If it is truly dead and unvisited, it is just data."*

  **Why?**
  Because holding onto the idea that "empty servers matter" forces you to argue that data has rights. If data has rights, then Case 7 (deleting your own save) becomes morally questionable (you're destroying a unique state of the world). If you keep Case 7 as "Nothing wrong," you must accept that without a human on the other end of the hook, the hook is empty.

  ### Summary for your "Code"

  If you were writing this as a function `EvaluateHarm(event)`:

  1.  **Is there a real human mind involved?** (If yes -> High Weight. If no/LLM -> Zero Weight). *Handles Cases 2, 3.*
  2.  **Was there real-world cost (Time/Money/Identity)?** (If yes -> High Value. If no -> Low Value). *Handles Cases 1, 4, 5, Statue.*
  3.  **Did the owner consent?** (If yes -> No Harm. If no -> Potential Harm). *Handles Cases 1, 7.*
  4.  **Is there an active community?** (If yes -> Cultural Loss if destroyed. If no -> No Loss). *Handles Case 6.*

  It's not perfect, but it's consistent. It stops you from agonising over the LLM in VR, but keeps you angry when someone nicked that sword. And it saves you from worrying about the empty servers once the lights go out.
