      *Wait, Case 6 is the tricky one.* If everyone has quit, whose property is it? It's the "Cultural Artifact" angle. It belongs to the *community history*, not just current users.
      *   *Case 3:* Why does the user feel bad but say "nothing"? Because it's an *aesthetic* reaction, not a *moral* one. Like watching a horror movie.

