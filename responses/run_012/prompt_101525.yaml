  ### A Taxonomy of Originality: The Logical Space of Value

  The following tree maps the philosophical positions on why an original might matter more than an indistinguishable copy. It begins with the most radical challenge (the forgery) and branches into specific historical and material commitments. Each branch is divided by a diagnostic question grounded in a concrete case.

  **ROOT QUESTION:**
  **Case: The Indistinguishable Forgery.** If a skilled forger produces a canvas perceptually identical to a celebrated Old Master, does it possess the same artistic value?

  *   **YES (Value is Identical)** → Go to **Branch A**.
  *   **NO (Value is Distinct)** → Go to **Branch B**.

  ---

  #### BRANCH A: The Perceptualists
  *(History of production is irrelevant to artistic value.)*

  **DIAGNOSTIC QUESTION:**
  **Case: The Better Replica.** If an openly advertised replica shows the artist's intention more clearly than the damaged original, should we value the replica more?

  *   **YES (The Image is Primary)**
      *   **Position:** **Ideal Intentionalism**
      *   **Awkward Commitment:** The physical artwork is merely a disposable vessel for an idea, meaning the 'work' could survive the total destruction of all its instances.
  *   **NO (The Experience is Primary)**
      *   **Position:** **Phenomenological Empiricism**
      *   **Awkward Commitment:** We are wrong to wish for restoration; the cracks and stains are essential parts of the aesthetic experience we actually value.

  ---

  #### BRANCH B: The Historicists
  *(History of production determines artistic value.)*

  **DIAGNOSTIC QUESTION:**
  **Case: The Heavily Restored Canvas.** If conservation replaces almost all the original pigment, is it still the same work?

  *   **NO (Original Matter is Essential)** → Go to **Branch B1**.
  *   **YES (Historical Continuity is Essential)** → Go to **Branch B2**.

  ---

  #### BRANCH B1: The Materialists
  *(The value resides in the specific physical atoms created at the start.)*

  **DIAGNOSTIC QUESTION:**
  **Case: The Workshop Production.** If a work was executed largely by assistants but signed by the master, is it less 'original' than one painted by the master's hand?

  *   **YES (The Hand is Essential)**
      *   **Position:** **Autograph Materialism**
      *   **Awkward Commitment:** Collaborative masterpieces from large studios must be categorically demoted to minor works compared to the master's private sketches.
  *   **NO (The Era is Essential)**
      *   **Position:** **Period Materialism**
      *   **Awkward Commitment:** A contemporary copy made in the same studio is equal in status to the master's own design, provided the materials are from the period.

  ---

  #### BRANCH B2: The Continuity Theorists
  *(The value resides in the unbroken chain of existence from creation to now.)*

  **DIAGNOSTIC QUESTION:**
  **Case: The Destroyed Original.** If the original is lost and only a contemporary copy survives, does that copy function as the original work?

  *   **YES (The Copy Inherits Status)** → Go to **Branch B2-i**.
  *   **NO (The Chain is Broken)** → Go to **Branch B2-ii**.

  ---

  #### BRANCH B2-i: The Substitutionalists
  *(A copy can become the original if it is the sole survivor.)*

  **DIAGNOSTIC QUESTION:**
  **Case: The Better Replica (Revisited).** Do we value this surviving copy because of its history or because it is the best image available?

  *   **HISTORY (Provenance is Key)**
      *   **Position:** **Historical Substitution**
      *   **Awkward Commitment:** A visually poor copy is equal to a brilliant original simply because it happened to survive the fire.
  *   **IMAGE (Fidelity is Key)**
      *   **Position:** **Aesthetic Substitution**
      *   **Awkward Commitment:** Historical status is contingent and can be overturned if a more accurate copy is discovered later.

  ---

  #### BRANCH B2-ii: The Genesis Theorists
  *(Only the object touched by the creator counts as the original.)*

  **DIAGNOSTIC QUESTION:**
  **Case: Algorithmic Art.** If a piece is generated by code with no single human 'original', does it lack the value of traditional art?

  *   **YES (Human Agency is Essential)**
      *   **Position:** **Humanist Essentialism**
      *   **Awkward Commitment:** AI art is inherently second-rate regardless of visual impact, because the source of creativity must be biological.
  *   **NO (Systemic Agency is Sufficient)**
      *   **Position:** **Systemic Genesis**
      *   **Awkward Commitment:** The concept of 'originality' must be abandoned entirely, as the 'artist' is merely a trigger for a system.

  ---

  ### Diagnostic Honesty: Gaps and Overlaps

  In constructing this taxonomy, three areas require candid assessment regarding the logical space, the distinction between positions, and the utility of the cases.

  **1. Empty Combinations**
  The tree leaves one logical combination empty: **Phenomenological Empiricism combined with Historical Substitution.** This view would claim that perceptual experience is all that matters (Branch A), yet also argue that a copy becomes the original due to historical accident (Branch B2-i). This is incoherent; one cannot simultaneously dismiss history as irrelevant to value and then rely on historical survival to confer status. This space is empty because the view cancels itself out.

  **2. Indistinguishable Positions**
  The tree struggles to separate **Historical Substitution** from **Causal Genesis** (Branch B2-ii) in cases where the copy is *not* perfect. Both positions value the history of the object. To prise them apart, you would need a case of a **damaged copy of a destroyed original**. *Historical Substitution* might still grant it 'original' status because it is the only link to the past, whereas *Causal Genesis* would reject it entirely because the causal chain was snapped at the moment of destruction. Without this specific nuance, the two positions risk collapsing into a general 'Historicism'.

  **3. Cases Doing No Diagnostic Work**
  The case of the **Heavily Restored Canvas** risks doing no diagnostic work for the Perceptualist branch (Branch A). Both *Ideal Intentionalists* and *Phenomenological Empiricists* generally agree that if the visual experience is preserved, the work survives. Consequently, this case only effectively splits the Historicist branch. To make it diagnostic for the Perceptualists, you would need to contrast a restoration that *improves* the visual experience against one that *preserves* the damage; the current phrasing assumes the former, which masks the split between valuing the 'idea' versus the 'experience of decay'.
