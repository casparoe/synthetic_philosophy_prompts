answer: |-
  # Desiderata for Probability in the Everettian Interpretation

  **Context:** This document specifies the problem space for probability in no-collapse quantum mechanics. It is designed to fix the target before evaluating specific derivations (Decision-Theoretic, Envariance, Self-Locating Uncertainty). Any account presented in this seminar must address the following constraints.

  **Legend:**
  *   **[NN]**: Non-Negotiable (Required for empirical adequacy or logical consistency).
  *   **[REAL]**: Ontological Realist Commitment (Requires probability to be a feature of the world, not just the mind).
  *   **[DT]**: Decision-Theoretic Commitment (Focuses on rational action rather than ontological chance).
  *   **[SLSU]**: Self-Locating Uncertainty Commitment (Allows reduction to indexical ignorance).
  *   **[ENV]**: Envariance Commitment (Derives measure from symmetry of entangled states).

  ---

  ## I. Empirical and Formal Constraints
  *These requirements ensure the account recovers standard quantum predictions and respects mathematical structure.*

  **1. Recovery of the Born Rule**
  The account must derive or justify that the probability measure assigned to an outcome is proportional to the squared modulus of its amplitude ($\mu = |\psi|^2$).
  *   **Status:** [NN]
  *   **Consideration:** Without this, the interpretation is empirically falsified by standard QM experiments.

  **2. Irrational Amplitude Ratios**
  The account must handle cases where branch amplitudes have irrational ratios (e.g., $1:\sqrt{2}$), where no finite counting of branches can reproduce the probability ratio.
  *   **Status:** [NN]
  *   **Consideration:** Naive branch-counting fails here. The measure must be continuous, not discrete.

  **3. Continuum of Outcomes**
  The account must apply to observables with continuous spectra (e.g., position), where the number of branches is uncountably infinite and individual branch amplitudes are typically zero.
  *   **Status:** [NN]
  *   **Consideration:** A theory restricted to finite-dimensional Hilbert spaces is physically incomplete.

  **4. Gleason-Type Non-Contextuality**
  The probability measure assigned to a subspace must depend only on the projector onto that subspace, not on the complete basis (context) in which it is embedded.
  *   **Status:** [NN] (Conditional on Hilbert Space structure)
  *   **Consideration:** Gleason's Theorem implies that any measure satisfying non-contextuality in $d \geq 3$ must be the Born rule. An Everettian account must justify why the measure is non-contextual without presupposing probability.

  **5. Preferred Basis Stability**
  The account must not rely on a naive counting of "branches" prior to solving the preferred-basis problem (decoherence).
  *   **Status:** [NN]
  *   **Consideration:** Branches are not fundamental ontology; they are emergent via decoherence. Probability cannot be defined over ill-defined entities.

  ---

  ## II. Conceptual Distinctions
  *These requirements prevent category errors that obscure the nature of the problem.*

  **6. Weight vs. Credence Distinction**
  The account must explicitly distinguish between **Branch Weight** (an objective property of the wavefunction structure) and **Agent Credence** (a subjective degree of belief). It must specify the link between them.
  *   **Status:** [NN]
  *   **Consideration:** Collapsing these obscures whether the problem is ontological (why is the weight $|\psi|^2$?) or epistemological (why should I believe it is?).

  **7. Probability vs. In-World Frequency**
  The account must distinguish the **Probability of an Outcome** (pre-measurement) from the **Relative Frequency** of that outcome within a single post-measurement branch.
  *   **Status:** [NN]
  *   **Consideration:** In MWI, every outcome occurs. In a specific branch, the frequency is 100% for what occurred. Probability cannot simply be "what happens most often" across the multiverse unless "most" is defined by measure, not branch count.

  **8. MWI vs. Hidden Variables**
  The account must not implicitly rely on a hidden-variable structure where the agent is ignorant of a pre-existing definite outcome.
  *   **Status:** [REAL] / [NN] (for pure MWI)
  *   **Consideration:** If the agent is ignorant of *which outcome will occur*, the theory is not Many-Worlds; it is a single-world theory with hidden variables. All outcomes occur; ignorance can only be about *location*, not *occurrence*.

  **9. The Anti-Reductionist Constraint (No Quiet Redefinition)**
  The account must not quietly redefine probability *solely* as an agent's ignorance about which branch they occupy (Self-Locating Uncertainty) without arguing for why this ignorance behaves like objective chance.
  *   **Status:** [REAL] (Contested by [SLSU])
  *   **Consideration:** **Crucial.** Many accounts solve the problem by stipulating that "probability just is self-locating uncertainty." This desideratum demands that if this move is made, it must be explicitly defended as sufficient to ground the Born Rule, not assumed as a definitional stopgap. It prevents the "Incoherence Problem" from being dissolved by semantic fiat.

  ---

  ## III. Dynamic and Edge Cases
  *These requirements test the robustness of the account under unitary evolution.*

  **10. Equal-Amplitude Symmetry**
  In a branching event with equal amplitudes (e.g., $\frac{1}{\sqrt{2}}|0\rangle + \frac{1}{\sqrt{2}}|1\rangle$), the account must assign equal probability without invoking circular symmetry arguments.
  *   **Status:** [NN]
  *   **Consideration:** This is the minimal test case. If symmetry cannot justify equality here, it cannot justify inequality elsewhere.

  **11. Recoherence and Probability Refund**
  If a branching event is undone by unitary evolution (recoherence/interference), the account must specify whether the probability mass is "refunded" or if the event is treated as if it never happened.
  *   **Status:** [NN]
  *   **Consideration:** Since unitary evolution is reversible, probability cannot be "lost" to a branch that ceases to exist as a distinct decoherent history. The measure must track the unitary flow.

  **12. Diachronic Consistency**
  An agent's credences before branching must align with the expected credences of their successors after branching, conditional on the branching structure.
  *   **Status:** [DT]
  *   **Consideration:** Required for Decision-Theoretic derivations (e.g., Wallace). If pre-branch agents do not care about post-branch successors in proportion to weight, the derivation fails.

  ---

  ## IV. Critical Analysis of the Desiderata

  ### 1. The Single Most Eliminating Requirement
  **Requirement #9: The Anti-Reductionist Constraint.**

  *   **Reasoning:** This requirement targets the most common "dissolution" of the problem. A significant cluster of live positions (specifically **Self-Locating Uncertainty** accounts à la Vaidman, Sebens, & Carroll) solves the probability problem precisely by *redefining* probability as indexical ignorance ("I know the wavefunction, but I don't know which copy I am").
  *   **Impact:** Enforcing #9 forces these accounts to provide a independent justification for why indexical ignorance should obey the Born Rule rather than the Principle of Indifference (which would imply branch counting). It eliminates any account that treats the reduction to ignorance as a brute fact. It also pressures **Decision-Theoretic** accounts, which often rely on the agent's subjective uncertainty to ground the axioms of rationality. Only robust **Ontological Weight** accounts (e.g., Saunders' "objective determinism") or strict **Envariance** derivations (Zurek) might survive without modification, as they attempt to ground probability in the physical state itself, not the agent's perspective.

  ### 2. Jointly Unsatisfiable Pair
  **Requirement #1 (Recovery of Born Rule as Objective Chance) + Requirement #8 (MWI vs. Hidden Variables / Determinism).**

  *   **The Tension:** This is the classic **Incoherence Problem**.
      *   If the universe is strictly deterministic and unitary ([NN] for MWI), then every outcome with non-zero amplitude *actually occurs*.
      *   If an outcome actually occurs, its objective probability is 1. If it does not occur, its probability is 0.
      *   To recover the Born Rule as an *objective chance* (Requirement #1), one needs probabilities strictly between 0 and 1.
      *   **Conflict:** It is logically difficult to maintain that an event is *certain to occur* (because the branch exists) and yet *probabilistic* (with $P < 1$).
  *   **Resolution Paths (and their costs):**
      *   **Deny Objective Chance:** Adopt [DT] or [SLSU]. Probability is only credence. (Cost: Violates [REAL] intuitions about chance).
      *   **Deny Determinism:** Adopt a "many-minds" or stochastic collapse variant. (Cost: Violates pure MWI ontology).
      *   **Redefine Truth:** Adopt a semantics where "Outcome X occurs" is not true simpliciter, but only true relative to a branch. (Cost: High metaphysical overhead).

  ### 3. Camp Loadings
  *   **Decision-Theoretic (Wallace):** Accepts [DT] constraints (Diachronic Consistency) as primary. Treats #9 (Anti-Reductionist) as a challenge to be met by showing rational agents *must* act as if weights are chances.
  *   **Envariance (Zurek):** Prioritizes [ENV]. Attempts to derive #1 (Born Rule) from symmetry alone, bypassing the need for agents or credence entirely. Often struggles with #3 (Continuum) and #11 (Recoherence) without additional assumptions.
  *   **Self-Locating Uncertainty (Vaidman/Sebens):** Explicitly rejects #9 (Anti-Reductionist). They argue probability *is* ignorance. In this seminar, they must defend why this is not a "quiet redefinition."
  *   **Ontological Realists (Saunders):** Accept [REAL]. Argue that "probability" in MWI is a new concept (measure of existence) that does not map to classical chance or ignorance. They bear the burden of explaining why this measure guides action.

  ---

  **Instruction for Seminar Participants:**
  When presenting an account, you must indicate which of the above desiderata you treat as derived, which as axiomatic, and which you propose to reject. You may not satisfy Requirement #1 (Born Rule) by violating Requirement #8 (Determinism/No Hidden Variables). You may not satisfy Requirement #9 (No Quiet Redefinition) by simply asserting that "uncertainty exists" without explaining its source in a deterministic manifold.
