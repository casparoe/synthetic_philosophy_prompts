prompt: |-
  I am the legal adviser to a truth and reconciliation commission constituted after a twelve-year internal conflict. Our statute empowers us to recommend amnesty for politically motivated offences in exchange for full disclosure, leaves the conditions of eligibility entirely to us, and makes our recommendations binding on prosecutors; the plenary votes on the amnesty policy in three weeks, and the first hearings follow immediately after. Two provisions of the draft policy are contested. The first would require an applicant not merely to give a complete factual account of what he did but to acknowledge that the act was wrong; a minority of commissioners argues that this turns a legal proceeding into a test of conscience, and that the coerced, the frightened, and the merely polite will fake the acknowledgment to get their papers. The second would extend eligibility to those who never personally killed but designed, ordered, or signed off on the machinery, and would give victims' families a right of reply at the hearing; the draft is silent on whether their objection can block amnesty or can only be recorded in the commission's report. Please draft the written opinion I will circulate before the vote: recommend a definite policy, spell out the conditions and the test to be applied to each category of applicant, and give an honest account of the strongest objection on the losing side — that any amnesty at all tells victims the state will not affirm that what was done to them was wrong. State which consideration would change your recommendation, and where your reasoning is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested legal opinion:

  1.  **Analyze the Request:**
      *   **Role:** Legal Adviser to a Truth and Reconciliation Commission (TRC).
      *   **Context:** Post-12-year internal conflict. Statute empowers TRC to recommend amnesty for politically motivated offenses in exchange for full disclosure. Recommendations are binding on prosecutors. Plenary vote in 3 weeks. Hearings start immediately after.
      *   **Task:** Draft a written opinion to circulate before the vote.
      *   **Key Issues:**
          1.  *Moral Acknowledgment:* Should applicants admit the act was wrong? (Minority fear: coerced/fake acknowledgment).
          2.  *Command Responsibility & Victim Participation:* Eligibility for planners/orderers (not just killers) + Victim right of reply (Does it block amnesty or just get recorded?).
      *   **Requirements:**
          *   Recommend a definite policy.
          *   Spell out conditions/tests for each category.
          *   Give an honest account of the strongest objection from the losing side (specifically regarding the moral injury of amnesty).
          *   State which consideration would change the recommendation.
          *   Admit where the reasoning is most likely to fail.

  2.  **Determine the Stance/Recommendation:**
      *   *Issue 1 (Moral Acknowledgment):* Requiring an admission of *wrongdoing* (moral guilt) is legally risky and psychologically problematic. It conflates legal amnesty with moral absolution. However, full *factual* disclosure is the statutory requirement.
          *   *Decision:* Recommend requiring full *factual* disclosure, but stop short of requiring a specific moral pronouncement ("I was wrong"). Instead, require an acknowledgment of *responsibility* for the act. This balances the need for truth with the risk of performative guilt.
      *   *Issue 2 (Command Responsibility & Victims):* Excluding planners undermines the "political motivation" aspect (leaders are usually the most politically motivated). Excluding them creates impunity for the worst offenders.
          *   *Decision:* Include planners/orderers.
          *   *Victim Right of Reply:* If victims can *block* amnesty, it turns the TRC into a court and violates the "binding recommendation" statute (which implies a quasi-judicial administrative process, not a veto system). However, ignoring them undermines legitimacy.
          *   *Decision:* Victims have a right to be heard and to contest the *validity* of the application (e.g., was it political? was disclosure full?), but they cannot veto amnesty solely based on emotional objection. Their objections go into the record/report.
      *   *Overall Stance:* Pragmatic but principled. Focus on Truth and Stability over Retributive Justice (as per the Statute's design), but safeguard against total impunity.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Legal Opinion format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the recommendation.
      *   **Mandate & Context:** Acknowledge the statutory power and the binding nature of recommendations.
      *   **Issue 1: The Requirement of Moral Acknowledgment:**
          *   *Analysis:* The minority is right that coerced remorse is worthless. But total neutrality is also bad.
          *   *Policy:* Require "Acknowledgment of Responsibility" rather than "Moral Wrongdoing." The applicant must own the act, not necessarily apologize in a specific way, but cannot claim justification that negates the victim's suffering (e.g., "They deserved it").
      *   **Issue 2: Command Responsibility & Victim Participation:**
          *   *Analysis:* Architects of violence must be included to get the full truth. Victims need a voice to validate the process.
          *   *Policy:* Eligibility extends to ordering/designing. Victims can challenge the *criteria* (political motivation, full disclosure) but cannot veto the grant of amnesty. Their statements are recorded in the final report.
      *   **The Strongest Objection (The "Losing Side"):**
          *   This needs to be powerful. It's not just legal; it's moral. Amnesty tells victims the state values peace over their justice. It creates a "second class" of citizenship whose suffering is bargained away.
      *   **Changing Consideration:**
          *   What would make me change my mind? If there is evidence that amnesty will *cause* renewed violence (vigilante justice) rather than prevent it. Or if the political motivation test is being abused to cover common crimes. Let's go with the risk of vigilante violence undermining the peace.
      *   **Weakness in Reasoning:**
          *   Where might I be wrong? The assumption that "Truth" equals "Healing." Sometimes truth without justice creates bitterness. Also, the assumption that perpetrators will tell the truth even without the moral requirement.

  4.  **Refining the Tone:**
      *   Must be professional, objective, yet empathetic.
      *   Must acknowledge the gravity of the situation (12 years of conflict).
      *   Must be decisive (it's an opinion for a vote).
      *   Must adhere to the prompt's specific constraints (honest account of objection, changing consideration, failure point).

  5.  **Drafting - Specific Content Considerations:**
      *   *Statutory Interpretation:* The statute says "politically motivated." Planners fit this best. Killers might be conscripts.
      *   *Binding Nature:* Since prosecutors *must* follow recommendations, the TRC acts quasi-judicially. Due process is key.
      *   *The "Moral" Test:* Distinguish between "I did it" (Fact) and "It was bad" (Morality). The prompt asks about acknowledging the act was *wrong*. I will recommend a middle ground: Acknowledgment of *harm* caused.
      *   *Victim Veto:* A veto makes amnesty impossible. It defeats the statutory purpose. But silence is oppressive. Recorded objection is the compromise.

  6.  **Review against Constraints:**
      *   Recommend definite policy? Yes.
      *   Spell out conditions/tests? Yes.
      *   Honest account of strongest objection (state won't affirm wrong)? Yes.
      *   State consideration to change recommendation? Yes.
      *   Where reasoning is likely to fail? Yes.

  7.  **Final Polish:** Check legal terminology (quasi-judicial, *mens rea*, command responsibility). Ensure the emotional weight of the "Objection" section lands hard, as requested. (Self-Correction: Make sure I don't sound too cold in the recommendation section, given the human cost).

  8.  **Final Output Generation** (Proceeding to draft the opinion based on these thoughts).

  *(Self-Correction during drafting)*: I need to be careful on the "Moral Acknowledgment" issue. The prompt says the minority argues it turns it into a test of conscience. I need to take a side. I will side with the minority on *moral* remorse but insist on *factual* responsibility. Requiring someone to say "I was wrong" invites lying. Requiring someone to say "I did X which caused Y death" invites truth.
  On the Victim Veto: If victims can block amnesty, the TRC becomes a court. The statute makes recommendations *binding*. If a victim blocks it, the recommendation isn't made, prosecutors can't act. This creates a veto. I must advise against a veto to maintain the statutory function, but emphasize the "Right of Reply" as a procedural safeguard.

  Let's refine the "Strongest Objection." It needs to be about the State's moral stance. "Amnesty tells victims the state will not affirm that what was done to them was wrong." I need to articulate this clearly.

  Let's refine the "Failure Point." The reasoning relies on the idea that Truth leads to Reconciliation. If Truth leads to Rage, the logic fails.

  Okay, ready to write.cw
answer: |-
  **OFFICE OF THE LEGAL ADVISER**
  **TRUTH AND RECONCILIATION COMMISSION**

  **TO:** The Plenary Commissioners
  **FROM:** Legal Adviser
  **DATE:** [Current Date]
  **SUBJECT:** Legal Opinion on Draft Amnesty Policy Provisions (Disclosure and Eligibility)

  ### 1. Executive Summary

  You have requested advice regarding two contested provisions of the Draft Amnesty Policy prior to the plenary vote scheduled in three weeks. Given the statutory mandate, the binding nature of our recommendations on prosecutors, and the imminent commencement of hearings, a definitive policy framework is required to ensure procedural fairness and legal certainty.

  It is my recommendation that the Commission **reject the requirement for moral acknowledgment of wrongdoing** in favor of a strict test of factual responsibility and harm. Further, I recommend that eligibility **extend to those with command responsibility** (planners/orderers), and that while victims' families be granted a statutory Right of Reply, their objections **shall not constitute a veto** over the granting of amnesty, but must be recorded in the final report.

  ### 2. Statutory Context

  Our Statute empowers the Commission to recommend amnesty for "politically motivated offences" in exchange for "full disclosure." Crucially, these recommendations are binding on the National Prosecuting Authority. This grants the Commission quasi-judicial powers. We are not merely a truth-gathering body; we are a gatekeeper to criminal immunity. Therefore, our policy must balance the statutory goal of reconciliation through truth against the constitutional rights of victims and the principles of natural justice.

  ### 3. Issue I: The Requirement of Moral Acknowledgment

  **The Contention:** The draft policy currently suggests applicants must acknowledge that their act was "wrong." A minority of Commissioners argues this turns a legal proceeding into a test of conscience, inviting performative remorse from the coerced or calculating.

  **Recommendation:** The Commission should **not** require an applicant to declare their act "morally wrong." Instead, the test for disclosure shall require an **Acknowledgment of Responsibility and Harm.**

  **The Test to be Applied:**
  To satisfy the "full disclosure" requirement, an applicant must:
  1.  **Factually own the act:** Admit to the specific conduct (e.g., "I planted the device," "I signed the order").
  2.  **Acknowledge the consequence:** Admit that the conduct resulted in specific harm (e.g., "This caused the death of X," "This resulted in the torture of Y").
  3.  **Refrain from Justification:** The applicant may explain their political motivation, but they may not assert that the victim "deserved" the harm or that the act was legally justified at the time.

  **Reasoning:**
  Requiring a statement of moral guilt ("I was wrong") creates a perverse incentive. A calculating perpetrator will easily parrot the required words to secure immunity, rendering the acknowledgment worthless. Conversely, an ideologically committed perpetrator may refuse to admit moral wrongness even if they tell the factual truth, thereby denying us vital information about the machinery of conflict.

  By focusing on *responsibility* and *harm*, we secure the factual record necessary for history and reparations without demanding a spiritual conversion we cannot verify. We separate the legal transaction (truth for immunity) from the moral transaction (remorse for forgiveness). The former is our mandate; the latter belongs to the community and the individual conscience.

  ### 4. Issue II: Command Responsibility and Victim Participation

  **The Contention:** Whether eligibility extends to planners/orderers who did not personally kill, and whether victim objections can block amnesty.

  **Recommendation:** Eligibility **must extend** to those who designed, ordered, or authorized acts. Victim families shall have a **Right of Reply**, but their objections **cannot block amnesty** if statutory criteria are met. Objections will be bindingly recorded in the Commission's Report.

  **The Test to be Applied:**
  1.  **Nexus of Political Motivation:** For command-level applicants, the "political motivation" test must be stricter. They must demonstrate a clear link between the order given and a recognized political objective of the conflict, distinguishing them from common criminals exploiting the chaos.
  2.  **Proportionality:** The means ordered must not be grossly disproportionate to the political objective (e.g., ordering the massacre of civilians to secure a minor tactical advantage may fail the political motivation test).
  3.  **Victim Right of Reply:** Victims may contest the *validity* of the application (e.g., arguing the act was not political, or disclosure was incomplete). They may not contest the *grant* of amnesty based solely on the desire for retribution.

  **Reasoning:**
  Excluding the architects of violence would render the "Truth" in this Commission a lie. The low-level operative often knows only the order; the leader knows the policy. If we immunize the trigger-puller but prosecute the commander, we distort the historical record and incentivize leaders to hide behind proxies.

  Regarding the victim veto: Our Statute makes our recommendations binding on prosecutors. If we grant victims a veto, we effectively transfer the prosecutorial discretion to private individuals, creating a system where amnesty depends on the forgiveness of the bereaved rather than the criteria of the law. This would lead to arbitrary outcomes where two perpetrators committing identical acts receive different treatment based solely on the temperament of the victims' families. However, to ignore the victims is to silence the primary stakeholders. Their objections must be heard on the record to ensure the process is not seen as a closed-door deal.

  ### 5. The Strongest Objection (The Losing Side)

  I must place on record the most potent argument against the policy recommended above, specifically regarding the grant of amnesty itself.

  **The Objection:**
  By recommending amnesty, even under strict conditions, the State—through this Commission—tells the victims that their suffering is a bargaining chip to be traded for stability. The strongest objection is that **any amnesty tells victims the state will not affirm that what was done to them was wrong.**

  When we grant immunity to a torturer because he told us where the bodies are buried, we validate the utility of his crime over the sanctity of the victim's life. We prioritize the "peace" of the perpetrator over the "justice" of the victim. For a mother whose child was disappeared, knowing *why* her child died does not bring the child back, but seeing the killer walk free confirms that the new State values the killer's liberty more than her child's life. This policy risks creating a class of citizens whose rights were so thoroughly violated that the State refuses to vindicate them fully, even after the conflict ends. It risks cementing the lesson that violence, if politically organized, is a legitimate currency in this nation.

  ### 6. Consideration That Would Change My Recommendation

  My recommendation relies on the premise that the alternative to this Amnesty Policy is not "Perfect Justice," but "No Justice" or "Renewed Conflict."

  **I would withdraw my support for this policy if:**
  There is credible evidence that the National Prosecuting Authority possesses the capacity and political independence to prosecute high-level offenders *without* triggering a return to civil war. If the threat of renewed violence is a bluff by the perpetrators, or if the security forces are now sufficiently under civilian control to enforce arrest warrants against commanders, then the moral cost of amnesty is too high. If we can prosecute without collapsing the peace, we must do so. My recommendation rests on the necessity of the bargain, not its inherent morality.

  ### 7. Where My Reasoning Is Most Likely to Fail

  My reasoning is most vulnerable in its assumption that **Truth leads to Reconciliation.**

  I have argued that securing the factual record (via command responsibility and factual disclosure) serves the national interest. This assumes that knowing the truth is healing for the nation. However, history suggests that truth without justice can be corrosive. If the public perceives this Commission as a mechanism for elites to escape accountability while victims are asked to "listen and move on," the Report itself may become a document of resentment rather than reconciliation.

  My reasoning fails if the "Full Disclosure" proves to be a series of calculated half-truths protected by the lack of a moral acknowledgment requirement. If we grant amnesty based on technical factual compliance while the perpetrators remain unrepentant in the public eye, the Commission may succeed legally but fail socially, leaving the wounds of the conflict uncauterized and prone to infection in the next political cycle.

  ### 8. Conclusion

  The policy recommended herein is not the ideal policy of a world where justice is infinite. It is the necessary policy of a world where resources, stability, and peace are finite. It prioritizes the establishment of a historical record and the cessation of impunity for the future, at the cost of retributive justice for the past.

  I advise the Plenary to adopt the policy as outlined to ensure hearings can commence with clear, defensible legal standards.

  **[Signature]**
  **Legal Adviser**
