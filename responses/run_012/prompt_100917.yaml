          *   *Diagnosis:* This is the crux. Sam defines the "Game" as the abstract tree with perfect information. Priya defines the "Game" as the social interaction represented by the tree.

  5.  **Drafting the Argument:**
      *   **Validate User's Hypothesis:** It's insightful but needs sharpening. It's not just "purpose," it's about the **ontology of the player**.
