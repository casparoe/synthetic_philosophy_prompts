answer: |-
  **Exam Question**

  Consider an agent with strictly intransitive preferences over three outcomes: they prefer Apples to Bananas, Bananas to Cherries, and Cherries to Apples. A standard money-pump argument suggests this agent is irrational because a trader could cycle them through these preferences (A→B→C→A), charging a small fee at each step, leaving the agent worse off than where they started.

  However, assume this agent is **sophisticated**: they are fully aware of their own preference cycle, they know the trader's strategy, and they can foresee the entire sequence of trades before accepting the first one.

  Write an essay addressing the following:
  1.  Does the money-pump argument succeed in proving this sophisticated agent is irrational? Explain why the mechanism of the pump changes when the agent can foresee the end-state.
  2.  To avoid the pump, the agent must refuse the first trade. Analyze what this refusal entails. Is the agent acting against their current preference? Is this a form of pre-commitment?
  3.  Distinguish between **exploitability** and **irrationality**. Does avoiding the pump prove the preferences are rational, or merely that the agent is strategically competent?
  4.  What conditions regarding diachronic rationality (e.g., stability of preferences, ability to bind future selves) must hold for the pump to "bite" even a sophisticated agent?

  ***

  **Model Answer**

  The standard money-pump argument relies on a specific conception of agency: that an agent acts solely on their current local preferences without regard for future consequences. In the naive case, an agent with intransitive preferences (A > B > C > A) accepts a trade from A to B for a penny, then B to C for a penny, then C to A for a penny. They end up with their original item but less money. This demonstrates exploitability, which is often taken as a proxy for irrationality. However, when the agent is sophisticated, the argument requires significant refinement.

  A sophisticated agent employs backward induction. Looking at the final stage of the pump (C → A), the agent knows that if they reach state C, they will prefer A enough to pay the fee. Knowing this, at the previous stage (B → C), they realize accepting the trade leads to the final loop where they lose money overall. Consequently, at the very first stage (A → B), the sophisticated agent foresees the entire loss. To avoid this, they must refuse the initial trade.

  This refusal creates a tension in decision theory. At the moment of the first offer, the agent currently prefers B to A (plus the small fee). By refusing, they are deliberately acting against their current local preference to satisfy a global plan. This is not merely "being smart"; it is a form of self-binding. The agent treats their future self as a distinct entity whose actions they must anticipate and constrain. If the agent lacks the capacity to bind their future self—or if their preferences are not stable enough to maintain the plan—the pump may still bite. For example, if the agent plans to refuse the first trade but changes their mind when actually faced with the choice (dynamic inconsistency), they revert to the naive case. Therefore, for the pump to fail against a sophisticated agent, we must assume the agent has diachronic rationality: the ability to form intentions that persist over time and override transient local preferences.

  This leads to the crucial distinction between exploitability and irrationality. The money-pump argument successfully proves that *naive* agents with intransitive preferences are exploitable. However, it does not necessarily prove that intransitive preferences are inherently irrational. If a sophisticated agent can avoid exploitation through strategic refusal, the *consequence* (losing money) is avoided. If rationality is defined instrumentally as achieving the best available outcome without self-defeat, the sophisticated agent remains rational despite intransitive preferences.

  However, one might argue that the *need* for such complex strategic maneuvering is itself a mark of irrationality. A truly rational agent should have transitive preferences such that no such conflict between local desire and global welfare arises. Yet, on the strict terms of the money-pump argument, the proof of irrationality relies on the actual loss of utility. If the sophisticated agent avoids the loss, the pragmatic proof fails. Thus, exploitability is contingent on the agent's decision procedure (naive vs. sophisticated), whereas irrationality is often claimed to be a property of the preference structure itself. The money-pump argument conflates these two. It shows that intransitivity *combined with naivety* leads to exploitation. It does not definitively show that intransitivity alone is irrational for an agent capable of diachronic planning.

  In conclusion, the money-pump argument does not succeed against a sophisticated agent unless we impose additional constraints on rationality, such as requiring that agents always act on their current strongest preference (myopic rationality). If we allow agents to plan across time and act against current preferences to secure better overall outcomes, the pump is defused. This suggests that the true locus of irrationality in the money-pump scenario may not be the intransitivity of preferences, but rather the inability to coordinate one's actions over time.

  ***

  **Marking Scheme (20 Marks)**

  **1. Analysis of the Sophisticated Mechanism (5 Marks)**
  *   **Must Hit:** Student explains backward induction (looking from the end of the sequence to the start) and notes that the agent foresees the net loss before accepting the first trade.
  *   **Common Pitfall:** Treating the sophisticated agent as naive; assuming they will accept the first trade simply because they prefer B to A locally.

  **2. The Nature of the Refusal (5 Marks)**
  *   **Must Hit:** Student identifies that refusing the first trade means acting against current local preference. Must discuss this as a form of pre-commitment or plan-based agency.
  *   **Common Pitfall:** Asserting the refusal is "easy" or "obvious" without acknowledging the conflict between current desire and future welfare.

  **3. Exploitability vs. Irrationality (5 Marks)**
  *   **Must Hit:** Student distinguishes between the *outcome* (losing money/exploitability) and the *structure* (intransitivity/irrationality). Must argue that avoiding exploitation weakens the claim that the preferences themselves are irrational.
  *   **Common Pitfall:** Equating exploitability directly with irrationality without qualifying that sophistication blocks the exploitation.

  **4. Diachronic Conditions (5 Marks)**
  *   **Must Hit:** Student identifies necessary conditions for the sophisticated strategy to work (e.g., stability of preferences over time, ability to bind future self, dynamic consistency).
  *   **Common Pitfall:** Ignoring the temporal aspect; failing to mention that the agent must remain committed to the plan when the future moment arrives.
