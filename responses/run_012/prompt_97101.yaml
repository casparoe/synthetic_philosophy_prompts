answer: |-
  You have hit on one of the most common and persistent misunderstandings of Dennett's project, but credit where it's due: your intuition is sharp. The tension you're feeling is real, but it stems from a category error regarding what Dennett means by "reductionism" and how he defines the "aim" of natural selection.

  You are reading *Darwin's Dangerous Idea* (or perhaps *Consciousness Explained*), and the confusion lies in conflating **ontological reductionism** with **greedy reductionism**, and misunderstanding the mechanical nature of the "crane."

  Here is the untangling of the knot.

  ### 1. Greedy Reductionism vs. Good Reductionism
  Your first worry is: *If Dennett hates greedy reductionism, why does he want to explain consciousness in terms of physics?*

  The trick is that Dennett is **not** against reductionism *per se*. He is a materialist. He believes everything is ultimately physical. What he calls "Greedy Reductionism" is the mistake of skipping levels of explanation.

  *   **Greedy Reductionism:** "Consciousness is just atoms bashing together. Therefore, psychology is bogus." This tries to explain a high-level phenomenon directly via the lowest substrate, ignoring the emergent structures in between. Dennett hates this because it's explanatorily useless. You cannot predict a chess move by analyzing the physics of the wood the pieces are carved from.
  *   **Dennett's "Good" Reductionism:** "Consciousness is a physical process, but it is organized into layers (evolution, neuroscience, cognitive architecture). To explain it, we must trace how the lower levels support the higher levels without skipping the intermediate 'cranes'."

  So, when Dennett says "it'll all come out in physics eventually," he means **ontologically** (everything is made of stuff), not **methodologically** (we can explain everything using only physics vocabulary). He insists we need the vocabulary of biology and psychology to explain the *patterns* that physics alone obscures.

  ### 2. Is Natural Selection a Skyhook?
  Your second worry is the heavy lifter: *Selection is blind. Building requires aim. Therefore, selection must be a skyhook (an unexplained explainer) to get the aim.*

  This is the classic "Watchmaker" objection, and Dennett's entire career is essentially a response to it. His argument rests on the distinction between **forward-looking purpose** and **backward-looking filtering**.

  *   **The Skyhook view:** Design requires a Designer. Something must "want" the outcome to bring it about.
  *   **The Crane view (Dennett):** Natural Selection is an **algorithm**. It is a mindless process of *variation and retention*.

  Dennett argues you do not need "aim" to get "design." You only need:
  1.  Replication (with errors/variation).
  2.  Differential survival (some variations last longer/copy more).
  3.  Time.

  The "building" isn't being done by a force pushing toward a goal. It is being done by a sieve that lets certain things pass and stops others. The "aim" is an illusion created by the fact that we only see the survivors.

  For Dennett, a Skyhook is something that *itself* requires explanation but is offered as an explanation (e.g., "God did it," or "The Mind did it"). Natural Selection is a Crane because **we can explain how Selection itself arises.** It arises inevitably wherever you have replicators, variation, and competition. It doesn't need a "starter" aim; it just needs a starting state of chemistry.

  ### 3. Competence without Comprehension
  This is the phrase that bridges your two worries. Dennett argues that you can have **competence** (the ability to do something complex, like build an eye or speak a language) without **comprehension** (understanding what you are doing).

  *   **The Crane:** Natural selection creates competent organisms (eyes that see) without the process itself comprehending vision.
  *   **The Anti-Greedy Move:** Human consciousness is "comprehension" that emerges from layers of "competence without comprehension" (neurons firing, evolutionary pressures).

  If you try to explain consciousness directly via physics (Greedy Reductionism), you miss the layer of "competence" built by evolution. If you say consciousness needs a non-physical soul (Skyhook), you stop inquiry.

  Dennett's middle path is: Consciousness is a "user-illusion" constructed by a brain that was built by natural selection. The selection process didn't "aim" at consciousness; it aimed (metaphorically) at survival. Consciousness was a byproduct that eventually became useful.

  ### 4. Why it feels like a contradiction
  You feel like you're missing something obvious because Dennett is trying to walk a tightrope that feels unstable:

  1.  He wants to save **meaning** and **mind** (they are real phenomena).
  2.  He wants to ground them in **blind physics** (no magic).
  3.  He wants to avoid **greedy reductionism** (don't ignore the complexity).

  The "niggling" feeling you have is the intuition that **teleology (purpose)** is being smuggled in. You are asking: *"Where did the 'fitness' in 'fitness landscape' come from? Doesn't defining 'fitness' require a goal?"*

  Dennett's answer is that "fitness" is purely relational. It's not a goal; it's a mathematical inevitability. If X replicates faster than Y, X becomes more common. There is no "aim" there, just arithmetic.

  ### Summary
  To square the circle:
  1.  **Against Greedy Reductionism:** We cannot explain psychology *directly* via quarks. We need the intermediate cranes (evolution, neural networks).
  2.  **For Reductionism:** Those cranes are ultimately physical processes, not magical skyhooks.
  3.  **Selection is not a Skyhook:** It requires no aim. It is a blind filter that accumulates "design" over time. The "aim" is retrospective, not prospective.

  Dennett isn't saying "Physics explains everything simply." He is saying "Physics allows for cranes, and those cranes build everything, including the illusion of skyhooks."

  If you still feel a tug of dissatisfaction, you are in good company (Thomas Nagel and John Searle feel it too). But within Dennett's system, the logic holds: **Cranes lift from below; Skyhooks hang from nowhere. Selection lifts from below, so it's a crane.** The fact that it *looks* like it has an aim is the trick evolution plays on us.
