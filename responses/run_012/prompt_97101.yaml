  6.  **Self-Correction during drafting:** I initially thought about bringing in Homuncular Functionalism. That might be too technical. Stick to Cranes/Skyhooks and Reductionism. The user's main confusion is about whether Selection *is* a skyhook. I need to be very firm that for Dennett, Selection is the *ultimate* crane, not a skyhook, precisely because it requires no intelligence to operate.

  7.  **Final Review of the Argument:**
      *   User: Selection needs aim = Skyhook.
