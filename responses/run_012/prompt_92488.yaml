answer: |-
  This design is optimized for 90 minutes, 18 participants, zero laptops, and maximum psychological pressure on the EV cutoff.

  ## **Materials & Setup**

  **1. The Currency (The "Sting")**
  *   **200 Tokens per person:** Use distinct poker chips or thick cardstock slips.
  *   **The Redemption Table:** Display physically at the front.
      *   50 tokens = Fancy Chocolate Bar.
      *   100 tokens = $10 Coffee Card.
      *   200 tokens = $20 Bookstore Card.
      *   0 tokens = Nothing.
  *   **The Bank:** A clear box at the front. Tokens deposited here are "spent." Tokens in hand are "yours."

  **2. The Randomness (The "Honesty")**
  *   **Low Tiers (1-in-6 to 1-in-100):** Use standard D6 and D20 dice rolled publicly.
  *   **High Tiers (1-in-10,000+):** Do **not** use envelopes (susceptible to "rigged" accusations). Use an **External Anchor**.
      *   *Prop:* A printed screenshot of a specific future public random event (e.g., "The last 5 digits of the closing S&P 500 on [Date 3 days from now]" or "The Pick-5 lottery draw in [State] on [Date]").
      *   *Rule:* "If your ticket number matches the public number, I will Venmo/CashApp you the token value equivalent within 24 hours." This makes the astronomical payout *feasible* for you (you only pay if they win, which they won't) but *honest* (verifiable).

  **3. The EV Cards (The "No-Calculator" Rule)**
  *   Print 18 sets of **Decision Cards**. Each card lists a deal and its **Net Expected Value (EV)** in tokens.
  *   *Rule:* "You may not calculate. You must decide based on the printed EV and your gut."
  *   *Text on Card:* "Deal X: Cost [A] tokens. Payout [B] tokens. Chance [1 in C]. **Net EV: +[Z] tokens.**"

  **4. Room Layout**
  *   Seminar circle. You stand at the "Bank."
  *   Whiteboard for the Public Ledger (columns: Name, Tokens Start, Tokens Spent, Tickets Held, Tokens End).

  ---

  ## **Timeline & Run-of-Show**

  ### **0:00 – 0:05 | Setup & Stakes**
  *   Hand out 200 tokens to each.
  *   Point to the Redemption Table. "This is yours. If you leave with 0, you get nothing. If you leave with 200, you get the big card. You can trade tokens with each other, but I only redeem at the end."
  *   **Crucial:** Do not mention "Expected Value," "Pascal," or "Fanaticism." Call it "Decision Workshop."

  ### **0:05 – 0:20 | Phase 1: The Bazaar (Risk Calibration)**
  *   Distribute **Decision Cards Set A** (5 cards).
  *   **The Deals:**
      1.  Cost 10, Win 50, Chance 1/4 (EV +2.5)
      2.  Cost 10, Win 100, Chance 1/9 (EV +1.1)
      3.  Cost 10, Win 500, Chance 1/49 (EV +0.2)
      4.  Cost 10, Win 5,000, Chance 1/499 (EV +0.01)
      5.  Cost 10, Win 50,000, Chance 1/4,999 (EV +0.001)
  *   **Action:** Participants mark "Buy" or "Pass" on each. Collect tokens for "Buy."
  *   **Resolution:** Roll dice immediately for tiers 1–3. For 4–5, use the External Anchor method.
  *   **Goal:** Establish that they *will* take positive EV deals, but drop off as probability shrinks, despite EV remaining positive.

  ### **0:20 – 0:35 | Phase 2: The Horizon (Naming N)**
  *   Hand out a slip: **"The Custom Ticket."**
  *   **Offer:** "I will sell you a ticket for **1 Token**. You choose a number **N**. I will pay you **1,000 × N** tokens with probability **1/N**."
      *   *Math:* EV = (1000N * 1/N) - 1 = 999 tokens. Always massively positive.
  *   **Task:** Write down the largest **N** you are willing to accept.
  *   **Collection:** Collect the slips. Do not resolve yet.
  *   **Ledger:** Write the range of Ns on the board (e.g., "Lowest N: 100, Highest N: 1,000,000").
  *   **Goal:** Reveal the "Event Horizon." Most will stop at N where the chance feels "impossible" (e.g., 1 in a million), even though EV is constant.

  ### **0:35 – 0:50 | Phase 3: The Pump (Additivity)**
  *   **Format:** Rapid-fire rounds. You announce a deal; they raise hands to buy.
  *   **The Deal:** "Cost 1 Token. Payout 10 Tokens. Chance 1/5. **Net EV +1.**"
  *   **Round 1:** Offer it once. (Most buy).
  *   **Round 2:** "Same deal again." (Most buy).
  *   **Round 3:** "Same deal again."
  *   **...Round 50:** "You've bought 50 of these. Cost 50 tokens. Chance of *total ruin* (winning 0) is (4/5)^50 ≈ 0.000014. You will almost certainly lose 50 tokens. But EV is +50 tokens."
  *   **Pressure:** If someone stops, ask: "Why stop? The math on this specific ticket hasn't changed. Are you rejecting the EV?"
  *   **Goal:** Force the realization that accepting individual EV+ deals leads to near-certain aggregate loss (Ruin).

  ### **0:50 – 1:05 | Phase 4: The Lever & The Infinite**
  *   **The Lever:** Take a participant who set a cutoff in Phase 2 (e.g., N=1,000,000).
      *   "You said N=1,000,000 was okay, but N=10,000,000 was not. I will sell you the N=2,000,000 ticket now for 1 token. It is *more* EV-efficient than the first one (same EV, less variance? No, same EV). It is logically identical to the one you accepted. Why the boundary?"
  *   **The Infinite (Whiteboard):**
      *   Draw the table below. Ask: "If I bundle these 3 tickets for **1 Token total**, do you buy?"
      *   *Board:*
          *   Ticket A: Cost 1/2, Pay 8, Prob 1/4 (EV +2)
          *   Ticket B: Cost 1/4, Pay 64, Prob 1/16 (EV +4)
          *   Ticket C: Cost 1/8, Pay 512, Prob 1/64 (EV +8)
          *   **Bundle:** Cost 1 Token. Total EV = Infinity. Chance of winning *anything* = 1/3 (33%).
      *   **Question:** "It costs 1 token. You have a 67% chance of getting nothing. You have a 33% chance of winning big. The EV is infinite. Who buys?"
      *   **Goal:** Visually demonstrate that EV and Probability of Winning diverge completely.

  ### **1:05 – 1:30 | The Debrief**
  *   **Step 1: Name the View.** "You just fought **Expected Value Fanaticism**."
  *   **Step 2: Consistency Check.** "Was anyone inconsistent?"
      *   Point out that rejecting the *Bundle* while accepting the *Parts* is the inconsistency. EV is additive. If Deal A is good, and Deal B is good, A+B must be good.
      *   "You cannot Dutch-book me. I am not offering you a cycle of losses. I am offering you a ladder of gains that leads off a cliff."
  *   **Step 3: The Real Tension.** "The problem isn't math. It's **Ruin**."
      *   "To be a pure EV maximizer, you must be willing to accept a 99.999% chance of leaving with 0 tokens, for the 0.001% chance of 100,000 tokens."
      *   "Any cutoff you name (e.g., 'I won't bet on odds lower than 1 in a billion') is **arbitrary**. Why 1 in a billion and not 1 in a billion-and-one?"
  *   **Step 4: The Limitations (Crucial).**
      *   **Stakes:** "In this game, 1 million tokens feels fake. In reality, if the payout is **Saving a Billion Lives**, the 'fake' feeling goes away. That is where Fanaticism becomes dangerous/compelling."
      *   **Self vs. Other:** "You were playing for snacks. If you were playing for *strangers*, would you risk their certain snacks for a tiny chance at a feast? That is the Effective Altruism question."
  *   **Step 5: Payout.** Honor the small wins immediately. Email the "External Anchor" winners later.

  ---

  ## **Facilitator Notes: Keeping Numbers Honest**

  1.  **The "Rigged" Accusation:** Students *will* suspect the 1-in-1,000,000 ticket is impossible to win.
      *   *Fix:* The External Anchor (Lottery/Stock Market) is key. It removes you from the resolution process.
      *   *Script:* "I cannot roll a million-sided die. But I can bind myself to the [State] Lottery. If your number hits, I pay. I have no control over that draw."
  2.  **The Bankruptcy Cap:** If a student loses all 200 tokens, they are out.
      *   *Fix:* Allow "Credit." "You can go down to -50 tokens. If you end negative, you owe me a coffee." This keeps them in the game for the "Ruin" phase.
  3.  **The EV Cards:** Ensure the Net EV is always positive but diminishing in *probability*.
      *   *Example:*
          *   Card 1: EV +10 tokens (High prob)
          *   Card 2: EV +10 tokens (Med prob)
          *   Card 3: EV +10 tokens (Low prob)
      *   This isolates the variable: **Probability**, not Value.

  ---

  ## **Predictable Failures & Mitigations**

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **"It's just tokens."** | Participants treat it as play money. | **Physical Redemption:** Put the actual gift cards on the table. Let them hold the chocolate. Remind them at minute 45: "You have 80 tokens left. That's half a coffee card." |
  | **"It's rigged."** | Professor controls the dice. | **External Anchor:** As noted above. Use a public future random event for anything >1-in-1000. |
  | **"I'm not playing."** | Risk aversion / Cynicism. | **The Endowment:** "You already have the tokens. Not playing is the same as keeping them. But inflation (time) is eating value." (Bluff slightly to encourage engagement). |
  | **Time Overrun** | Phase 3 (Pump) drags on. | **Hard Stop:** Use a timer. If Phase 3 runs long, cut the "Infinite" whiteboard example and move straight to Debrief. The Pump is more important. |
  | **Math Stalling** | People calculate EV manually. | **Confiscate Phones:** "No calculators. Trust the Card." |

  ---

  ## **What This Activity Cannot Do (Debrief Script)**

  *You must supply these points verbally. The game cannot generate them.*

  1.  **Astronomical Stakes:** "In this room, 10^100 tokens is a joke. It buys the same snacks as 10^6 tokens. In the real world (e.g., existential risk), the stakes are *actually* astronomical. The 'fake' feeling you had about the million-token prize is the only thing protecting you from Fanaticism. If the payout were real, you'd be forced to bet."
  2.  **Altruism:** "You were risking *your* snacks. Fanaticism is usually about risking *resources* to help *others*. If you could spend 200 tokens to give a 1-in-a-million chance of saving 10 billion lives... the EV logic is identical, but the moral weight is heavier. This game was selfish; the theory is moral."
  3.  **Implementation:** "EV Fanaticism assumes you can actually *make* the bet. In reality, institutions, laws, and physics prevent you from taking 1-in-a-billion bets. The theory assumes a frictionless world; we live in a frictionful one."

  ---

  ## **Math Verification: The Infinite Version**

  *For your confidence before writing on the board.*

  **The Bundle:**
  *   **Ticket 1:** Cost $1/2$. Payout $8$. Prob $1/4$.
      *   $EV = 8 \times 0.25 = 2$.
      *   $Net = 2 - 0.5 = +1.5$.
  *   **Ticket 2:** Cost $1/4$. Payout $64$. Prob $1/16$.
      *   $EV = 64 \times 0.0625 = 4$.
      *   $Net = 4 - 0.25 = +3.75$.
  *   **Ticket 3:** Cost $1/8$. Payout $512$. Prob $1/64$.
      *   $EV = 512 \times 0.015625 = 8$.
      *   $Net = 8 - 0.125 = +7.875$.

  **Totals:**
  *   **Total Cost:** $1/2 + 1/4 + 1/8 + \dots = 1$ token.
  *   **Total EV:** $2 + 4 + 8 + \dots = \infty$.
  *   **Total Prob(Win):** Sum of geometric series $a=1/4, r=1/4$.
      *   $Sum = \frac{a}{1-r} = \frac{0.25}{0.75} = \frac{1}{3}$.
  *   **Result:** You pay 1 token. You have a 33% chance to win *something*. You have a 67% chance to lose everything. Your Expected Value is Infinite.

  *This arithmetic is correct.*
