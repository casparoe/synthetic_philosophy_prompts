prompt: |-
  I'm running a ninety-minute session on al-Ghazali on causation — the bit where he says the fire doesnt burn the cotton — for a mixed reading group (two historians, a physicist, an economist, and one very confident undergrad) who've all read a short excerpt of his attack on the philosophers. Don't explain the position to me, plan the session: what has to be nailed down first and what depends on what, and which single example should carry the whole thing. Should it be the fire and the cotton, or does that one quietly teach the wrong lesson — it's so vivid that people leave thinking he's just relocating the cause one step back? I was going to use a video game instead: the character on screen dies when I press a button, though nothing on screen is doing the killing. Tell me whether that carries it or whether it plants exactly the wrong picture, of a hidden mechanism behind the visible one.

  Then the misconceptions, in the order they'll actually turn up, and where in the sequence I head each one off. I'm expecting 'so he's Hume with God bolted on', 'so nothing is really connected and science is a non-starter', and from the physicist, 'quantum indeterminacy means he was right all along'. I also want to know which one to keep in reserve, because the snag I'm most worried about is the one nobody says out loud: if God is doing everything directly then my hand, the fire and the cotton are all just decoration, which can't be what he means.

  Last, a question I can put to them at the end that would show whether they've got the distinction rather than the slogan, and what i should openly refuse to go into at this level — there's a live scholarly argument about how occasionalist he actually is, and I can't decide whether to flag it or keep it shut. British English please.
