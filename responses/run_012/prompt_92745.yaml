answer: |-
  You have identified a configuration that sits at the precise friction point between philosophy of language, sociology, and cognitive science. You are right to suspect that the standard labels ("vagueness," "division of linguistic labor," "empty reference") are neighbors but not the house itself.

  There is no single, canonical noun phrase in the English language that captures this specific triad of features (robust application, definitional absence, distributed stability). However, the *carving* you are asking for exists within the debates surrounding **Normative Pragmatics** and **Social Externalism**.

  If I were to give this configuration a precise name, based on the mechanics you describe, I would call it **Distributed Normativity**.

  Here is the carving you requested: what distinguishes it, why it is stable, and where its edges lie.

  ### 1. The Carving: Normativity without Ontology

  To understand why this is distinct from its neighbors, we must separate two functions of language that are usually assumed to be fused:
  *   **The Representational Function:** The word points to a thing, a concept, or a mental state (Ontology).
  *   **The Normative Function:** The word licenses certain moves, corrections, and inferences (Normativity).

  In your three instances, the Normative function is fully operational, while the Representational function is vacant.
  *   **The Dialect Word:** You cannot point to the *concept* (Representation), but you can correct the *usage* (Normativity).
  *   **Voice:** You cannot define the *quality* (Representation), but you can identify the *absence* (Normativity).
  *   **The Impostor:** He lacks the *knowledge* (Representation), but executes the *behavior* (Normativity).

  This distinguishes it from **Vagueness**. Vagueness implies the boundaries are fuzzy (e.g., "heap"). In your cases, the boundaries are sharp ("That's not how we use it"), even if the center is empty.
  It distinguishes it from **Putnam's Division of Linguistic Labor**. Putnam argues I can use "elm" correctly because I defer to an expert who *does* know. In your configuration, there is no expert. The deference is circular; everyone defers to everyone else.
  It distinguishes it from **Empty Signifiers** (political theory). Empty signifiers usually unify a group through *contestation* (everyone projects their own meaning onto "Freedom"). Your examples show *agreement* without projection.

  ### 2. Why It Does Not Collapse (The Stability Mechanism)

  You wrote: *"I had assumed such a state must be unstable, that a vocabulary with no floor under it would drift or collapse. It does not."*

  This is the deepest insight in your puzzle. You are assuming meaning requires a **Foundation** (a definition, a referent, a mental state). Philosophy of language has spent the last century discovering that meaning requires only **Equilibrium**.

  This is best articulated by the later **Wittgenstein** and refined by **Saul Kripke**. Kripke posed the "Rule-Following Paradox": What fact makes it true that I mean *plus* and not *quus* when I add numbers? He concludes there is no internal fact. The "anchor" is not a thing; it is the **mutual corrective pressure of the community**.

  Your configuration is stable because it is a **Self-Correcting System**.
  *   In the dialect, if I use the word wrongly, you correct me.
  *   In the workshop, if I misidentify "voice," the room corrects me.
  *   With the impostor, if he slips in register, the listeners would correct him (or reject him).

  The "floor" is not under the word; the floor is *between the speakers*. It is a tensional stability, like an arch that stands only because the stones press against one another. Remove the community, and the meaning collapses. Keep the community, and the meaning holds, even if no single stone knows why.

  ### 3. The Edges: When Does It Fail?

  To define this precisely enough to say what falls *outside* it, we must identify the failure conditions of **Distributed Normativity**.

  **It fails when the corrective loop breaks.**
  If the community stops policing the usage, the term drifts into mere **Vagueness**.
  *   *Example:* If the writers stop arguing about "voice" and accept any style, "voice" becomes a polite synonym for "style." It loses its normative bite.

  **It fails when an external referent is demanded.**
  If the dialect speakers are forced by an outsider to write a dictionary definition, they will fail. If the definition becomes the standard (rather than the usage), the term becomes **Empty Reference**.
  *   *Example:* If a writing workshop adopts a rigid textbook definition of "voice" that contradicts their intuitive judgments, the term becomes bureaucratic jargon. It no longer "does work"; it only "names things."

  **It fails when the impostor encounters a novel edge case.**
  The impostor relies on **Pattern Matching** (training data), not **Causal Understanding**.
  *   *Example:* If a professional faces a situation their field has never encountered, they use first principles to innovate. The impostor, having no anchor, cannot innovate; they can only mimic. If the situation requires *generative* reasoning rather than *discriminative* behavior, the impostor is exposed. This is the edge: **Distributed Normativity works for classification and routine inference, but fails at novel problem-solving.**

  ### 4. A Precise Definition

  If you need a definition to use in your working life, I propose this:

  > **Distributed Normativity** is a semantic configuration in which a term's correctness conditions are sustained entirely by intersubjective agreement on its application, independent of any shared definitional content, mental representation, or external referent.

  **What falls outside:**
  *   **Technical Terms:** (e.g., "Mitochondria"). These have an external anchor (biology) and experts.
  *   **Purely Subjective Preferences:** (e.g., "Delicious"). These are not policed; disagreement is allowed.
  *   **Bureaucratic Jargon:** (e.g., "Synergy"). These are defined by text, not usage; usage often contradicts the definition.

  ### 5. Why This Matters for a Novelist

  You asked this as a novelist, not a philosopher. The reason this configuration feels like a puzzle is that **fiction often lives in the gap you have identified.**

  *   **Character Voice:** You know a character is "in voice" not because they match a profile, but because they sustain a normative pattern of speech.
  *   **World Building:** When you invent a culture, you don't need to define their values (Representation); you only need to show how they correct each other (Normativity).
  *   **The Impostor:** Your character is the ultimate test of this. He proves that **competence is indistinguishable from understanding** until the system is stressed.

  The phenomenon you have met is not a bug in language; it is the engine of culture. We build shared realities not by agreeing on what things *are*, but by agreeing on how to *act* as if we know what they are. The vocabulary does not need a floor because it is not a building; it is a dance. It exists only while it is being performed.

  **Name:** Distributed Normativity.
  **Structure:** Normative Practice without Representational Content.
  **Stability:** Mutual Correction (Equilibrium).
  **Failure Condition:** Novelty requiring generative reasoning.
