answer: |-
  Adopting the interventionist standard represents a fundamental shift in your group's ontology. You are moving from an **observational taxonomy** (classifying phenomena based on appearance or static structure) to a **causal taxonomy** (classifying phenomena based on their capacity to be manipulated and their effects on the system). This aligns your engineering practice with a Woodwardian account of causation: a mechanism is defined by the invariant relationships it sustains under intervention.

  Here are the most important implications of adopting this standard for your pipeline, registry, and external communications.

  ### 1. Validation: Detection Becomes Hypothesis Generation
  Under a descriptive or functional standard, you can validate a detector by showing that its flags correlate with a known structural pattern or input–output behavior. Under the interventionist standard, **correlation is insufficient for validation.**

  *   **The Interdependence Problem:** You correctly suspect that detection and validation will lean on one another. If a mechanism *is* its intervention profile, you cannot confirm the existence of the mechanism without running the intervention. This means your anomaly detector cannot "find" a mechanism; it can only find *candidates* for mechanisms.
  *   **Implication:** Your pipeline splits into two distinct phases. Phase 1 is **Anomaly Discovery** (unsupervised, descriptive), which produces provisional tags (e.g., `M-114-draft`). Phase 2 is **Causal Validation** (supervised, active), where you run the specific family of interventions (patching, ablation) required to earn the stable tag (`M-114`).
  *   **The Cost:** Validation becomes significantly more expensive. You can no longer validate a detector retrospectively on static logs. You need an environment where you can intervene on the model in real-time or replay computations with patching capabilities.
  *   **The Gain:** You eliminate "epiphenomenal" tags. If a flag corresponds to an activation pattern that, when patched, changes nothing downstream, the interventionist standard dictates this is *not* a mechanism. You stop tracking ghosts.

  ### 2. Transferability: Implementation Independence
  The strongest argument for the interventionist standard is how it handles transfer across fine-tunes, distillation, and random seeds.

  *   **The Claim to Abandon:** You must abandon the claim that a mechanism has a fixed **location**. Under a descriptive standard, if M-114 lives in layers 10–12 of Model A, you expect it in layers 10–12 of Model B. Under the interventionist standard, M-114 is defined by the fact that steering vector $V$ produces effect $E$. If Model B requires vector $V'$ in layers 14–16 to produce $E$, it is still M-114.
  *   **Implication for Tags:** Tags become robust to architectural surgery. A distilled model often scrambles internal weights while preserving input–output behavior and causal pathways. A descriptive tag would break here; an interventionist tag survives. This makes your registry much more stable across model generations.
  *   **The Risk:** Transfer is no longer automatic; it must be re-verified. You cannot assume M-114 in a fine-tuned model is the same M-114 without re-running the intervention suite. The tag transfers only if the *causal profile* transfers, not because the weights look similar.

  ### 3. Registry Management: Merging and Pruning by Causal Profile
  Your registry ceases to be a list of "things we see" and becomes a list of "levers we can pull."

  *   **Merging:** Two provisional tags (e.g., `M-114` and `M-115`) should be merged if their intervention profiles overlap, even if their activation patterns look distinct. This captures **multirealizability**: the same causal mechanism might manifest as different activation clusters in different contexts. The interventionist standard gives you a mathematical criterion for merging: do the interventions yield statistically indistinguishable downstream effects?
  *   **Pruning:** You gain a rigorous criterion for pruning. If a flagged anomaly cannot be targeted by any intervention in your standard family to produce a reproducible effect, it is pruned. It is classified as noise or a downstream consequence of a different mechanism, not a mechanism itself.
  *   **Granularity:** You must define the "family of interventions" rigorously. If you allow *any* intervention, every unique output is a unique mechanism. You will need to standardize the *resolution* of your interventions (e.g., "layer-wise ablation" vs. "neuron-wise ablation") to prevent the registry from exploding.

  ### 4. External Communication: Control Over Observation
  When speaking to regulators or outside researchers, the interventionist standard changes the nature of your claims from observational to operational.

  *   **The Regulator Question:** A regulator asks, "Does your system detect deceptive reasoning?"
      *   *Descriptive Answer:* "It detects activation patterns similar to those seen in deceptive training data." (Weak, easily adversarially circumvented).
      *   *Interventionist Answer:* "It detects a computational substrate which, when suppressed, reduces deceptive output by $X\%$ without degrading general capability." (Strong, actionable).
  *   **Implication:** You can responsibly claim **control**, not just detection. This is highly valuable for safety cases. However, it increases liability. If you claim M-114 is a "deception mechanism" based on interventionist criteria, and a model deceives without triggering M-114 (or triggers M-114 without deceiving), your causal claim is falsified.
  *   **Recommendation:** Be precise about the *scope* of the intervention. Do not claim the mechanism is "deception." Claim it is "a substrate causally necessary for deception in context $C$."

  ### 5. Summary of Trade-offs: What to Abandon and What to Gain

  | Feature | Claim to Abandon (Descriptive/Functional) | Claim to Adopt (Interventionist) |
  | :--- | :--- | :--- |
  | **Identity** | A mechanism is identified by its activation signature or weights. | A mechanism is identified by its causal response to perturbation. |
  | **Location** | M-114 exists at specific indices (layers/neurons). | M-114 exists in a causal subspace; indices may shift across models. |
  | **Validation** | Validation is passive (checking against a test set). | Validation is active (requiring intervention capabilities). |
  | **Registry** | Tags are distinct if activation clusters are distinct. | Tags are distinct only if intervention effects are distinct. |
  | **Safety Case** | "We can see the model doing it." | "We can stop the model from doing it." |

  ### Strategic Recommendation
  The interventionist standard is the correct choice for a group focused on **safety and control**, but it is overkill for a group focused solely on **monitoring**.

  If your goal is to notice a model doing something on the inside that it does not do in training, you need to know that the "something" is causally efficacious. A descriptive anomaly might just be the model "thinking harder" without changing its strategy. An interventionist anomaly proves the computation matters.

  **However, you must institute a tiered tagging system:**
  1.  **Provisional Tags (P-xxx):** Assigned by the anomaly detector based on descriptive dissimilarity. These are hypotheses.
  2.  **Validated Tags (M-xxx):** Assigned only after the interventionist criterion is met.

  Do not allow Provisional Tags to be cited as mechanisms in external reports. This preserves the rigor of the interventionist standard without crippling the throughput of your detection pipeline. You gain the ability to tell a regulator, "We have identified 50 anomalies, and we have causally validated 5 of them as critical mechanisms." That is a far more defensible position than claiming 50 mechanisms you cannot steer.
