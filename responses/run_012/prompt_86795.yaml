answer: |-
  ### Examination Paper: Reproductive Ethics (Final Year Seminar)

  **Time Allowed:** 90 Minutes
  **Total Marks:** 25 (25% of Final Grade)
  **Instructions:** This is a closed-book examination. You may not consult notes, texts, or electronic devices. Answer the question below. Your grade will depend on the clarity of your argument, not the conclusion you reach.

  ***

  **Question 1**

  Consider the following hypothetical legislation, the *Surrogacy Prohibition and Recognition Act* (SPRA), enacted in a jurisdiction that currently permits compensated oocyte donation but prohibits all surrogacy arrangements:

  > **Section 1 (Offence):** It is a criminal offence to enter into, arrange, or facilitate a surrogacy arrangement, whether performed within this jurisdiction or abroad.
  >
  > **Section 2 (Non-Recognition):** A parent-child relationship resulting from such an arrangement is not to be registered in the civil registry, notwithstanding that it was validly established in the state where the arrangement was performed.
  >
  > **Section 3 (Discretionary Exception):** A court may nonetheless register the relationship where it is satisfied that the child would otherwise be left with no legally recognized parent, or that registration is required by the child's best interests.

  Write an essay evaluating the moral coherence of the SPRA. In your answer, you must address the following:

  1.  For each provision, identify which standard objection to surrogacy (e.g., commodification, exploitation, defective consent) it appears to presuppose.
  2.  Assess whether Section 2 performs any normative work that Section 1 does not already achieve.
  3.  Determine whether Section 3 concedes a principle that collapses the prohibition into a mere denunciation.
  4.  Explain whether the ban's rationale survives the fact that this jurisdiction permits compensated oocyte donation.

  Conclude with a defended verdict on whether the three provisions can rest on a single, coherent view of what is wrong with surrogacy.

  ***

  ### Model Answer

  The SPRA attempts to straddle two incompatible moral commitments: the absolute rejection of surrogacy as a practice and the pragmatic acknowledgment of the child produced by it. To evaluate its coherence, we must examine whether the moral objections driving the criminal ban can logically sustain the civil restrictions and exceptions that follow.

  Section 1 criminalizes the arrangement itself. This provision rests primarily on the exploitation and commodification objections. By penalizing the facilitation and entry into the contract, the state treats the transaction as inherently harmful, regardless of outcome. It presupposes that the surrogate's labor or reproductive capacity cannot be validly alienated, or that the financial inducement vitiates consent. The expressive function of the criminal law is central here; the state declares the act *malum in se*. However, Section 1 also relies on the relocation argument: by criminalizing arrangements abroad, it attempts to prevent citizens from evading domestic moral standards.

  Section 2 refuses to register the resulting parent-child relationship. This presupposes a different objection: that the moral defect of the conception contaminates the status of the parents. If Section 1 punishes the *act*, Section 2 punishes the *status*. However, Section 2 does little work that Section 1 does not already achieve regarding deterrence. If the act is criminal, the arrangement is already illicit. The distinct work of Section 2 is to render the child legally invisible. This creates a tension: if the objection to surrogacy is the exploitation of the woman, punishing the child with non-recognition targets the wrong party. If the objection is that intentional parenthood is invalid, Section 2 is consistent, but it conflicts with the distinction between genetic, gestational, and intentional parenthood taught in this course. By refusing registration, the state implies that biological or gestational links established abroad are morally void at home.

  Section 3 introduces a "best interests" exception. This is the point where the statute risks incoherence. If surrogacy is so morally repugnant that it warrants criminal sanction (Section 1) and civil erasure (Section 2), it is difficult to see how the resulting relationship can be "in the child's best interests" to recognize. Section 3 effectively concedes that the child's welfare trumps the state's moral objection to the parents' conduct. This collapses the prohibition into a denunciation. The state says, "This act is wrong," but simultaneously admits, "The result of this act must be treated as valid to protect the innocent." This reduces Section 1 and 2 to expressive gestures rather than substantive protections. It acknowledges that the harm of non-recognition outweighs the harm of recognizing a "tainted" lineage.

  The coherence of the entire scheme is further tested by the jurisdiction's permission of compensated oocyte donation. If the objection to surrogacy is commodification, why is the sale of gametes permissible? If the objection is exploitation, why is the donor compensated but the surrogate criminalized? A coherent view might argue that gestation involves a deeper bodily integrity than egg extraction, or that the fragmentation of parenthood in surrogacy (separating genetic from gestational) is uniquely harmful. However, if the state permits anonymous donation, it undermines the "child's right to know origins" argument often used in Section 2. You cannot claim a child needs a registered legal parent (Section 3) while permitting practices that obscure genetic origins (donation).

  Ultimately, the SPRA cannot rest on a single view of what is wrong with surrogacy. Section 1 treats the practice as a public harm; Section 2 treats it as a status defect; Section 3 treats it as a private misfortune requiring mitigation. A single coherent view would either prohibit the entry of the child (consistent with Section 2 but violating Section 3) or recognize the child while regulating the practice (consistent with Section 3 but violating Section 1). The statute tries to have it both ways: it wants the moral purity of prohibition without the moral cost of creating parentless children.

  **Verdict:** The SPRA is morally incoherent. It conflates the regulation of adult conduct with the status of the child. While Section 1 can be defended on grounds of exploitation, Section 2 and 3 reveal that the state cares more about the appearance of prohibition than the reality of the family unit. The permission of compensated donation further suggests the objection is not to payment per se, but to the visibility of gestational labor. The statute is not a principled stand against commodification, but a compromise that sacrifices the child's legal security to maintain a political denunciation of the parents' choices.

  ***

  ### Marking Scheme

  **Total Marks: 25**

  **1. Rationale for Section 1 (Criminalization)**
  *   **Marks:** 4
  *   **Requirement:** Identifies that Section 1 relies on exploitation/commodification objections and the expressive function of criminal law to deter the act itself.
  *   **Common Error:** Candidates treat Section 1 as purely administrative rather than moral, or fail to mention the extraterritorial aspect.

  **2. Normative Work of Section 2 (Non-Recognition)**
  *   **Marks:** 4
  *   **Requirement:** Analyzes whether civil non-recognition adds to the criminal ban, noting it targets the child's status rather than the parents' conduct.
  *   **Common Error:** Candidates assume Section 2 is redundant without explaining *why* (i.e., failing to distinguish between punishing the act and voiding the status).

  **3. The Collapse of Section 3 (Denunciation vs. Prohibition)**
  *   **Marks:** 5
  *   **Requirement:** Argues that the "best interests" exception undermines the absolute moral prohibition, turning the ban into a symbolic denunciation.
  *   **Common Error:** Candidates praise Section 3 as humane without recognizing it logically contradicts the severity of Sections 1 and 2.

  **4. Coherence of a Single Moral View**
  *   **Marks:** 4
  *   **Requirement:** Explicitly assesses whether one theory (e.g., commodification) can justify all three provisions simultaneously.
  *   **Common Error:** Candidates list objections for each section separately without attempting to synthesize or contrast them.

  **5. Comparison with Oocyte Donation**
  *   **Marks:** 4
  *   **Requirement:** Uses the permission of compensated donation to test the consistency of the commodification/exploitation rationale.
  *   **Common Error:** Candidates ignore the donation comparison or treat it as a separate topic unrelated to the statute's logic.

  **6. Defended Verdict**
  *   **Marks:** 4
  *   **Requirement:** Provides a clear conclusion on the statute's coherence, supported by the preceding analysis.
  *   **Common Error:** Candidates sit on the fence or offer a verdict that contradicts their own analysis (e.g., arguing it is incoherent but concluding it is justified).

  **Distinguishing an A from a B:**
  An A answer integrates the "donation comparison" into the analysis of the statute's internal logic (Section 4), whereas a B answer treats the donation issue as a separate addendum at the end.
