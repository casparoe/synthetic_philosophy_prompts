answer: |-
  You are definitely not missing something obvious; you are wrestling with one of the most famous and difficult knots in moral philosophy. It has a name: **The Problem of Imperceptible Harm** (or sometimes "The Inefficacy Objection"), and it often gets tangled up with **Causal Overdetermination**.

  Your roommate is right that you have mashed two different cases together, but there is a deeper irony here: **you have interpreted the firing squad analogy backward.**

  Here is the untangling of the logic, followed by the verdict on your flight.

  ### 1. The Firing Squad Inversion
  You argued: *In the firing squad, no single shooter was necessary, yet we blame the collective. Since the collective isn't a person, individual guilt dissolves. Therefore, I am off the hook.*

  This is where the logic snaps. In the firing squad case, we **do not** say the guilt dissolves. We do not say, "The Squad did it, so no individual is responsible." We say, "The Squad did it, so **all five individuals are fully guilty of murder.**"

  The lesson of the firing squad is actually the opposite of what you concluded. It teaches us that **causal necessity is not required for moral responsibility.** Even if the victim would have died without *your* specific bullet, you are still a murderer because you intentionally performed an act that was sufficient to cause the death.

  If climate change were exactly like the firing squad, you would *not* be off the hook. You would be one of five shooters, and you would be fully guilty, even if your bullet wasn't "necessary."

  ### 2. The Structural Mismatch (Your Roommate's Point)
  Your roommate is correct that these are two different logical structures. This is the distinction between **Overdetermination** and **Cumulative Harm.**

  *   **The Firing Squad (Overdetermination):** Each individual act is **sufficient** to cause the harm. If Shooter A hadn't fired, the victim still dies (because of B, C, D, E). But Shooter A *did* kill the victim. Their bullet went through the heart.
  *   **The Flight (Cumulative/Threshold):** Your individual act is **insufficient** to cause the harm. One flight does not cause a hurricane, a drought, or a degree of warming. Your emissions are a drop in an ocean. If you don't fly, the climate outcome is microscopically different, but arguably indistinguishable.

  **Why this matters:**
  In the firing squad, you can point to the body and say, "My bullet is in there." In the climate case, you cannot point to a storm and say, "My flight caused that."

  This is why your roommate says you mashed the cases together. You are trying to use the *guilt* from the firing squad (where acts are sufficient) to justify *innocence* in the climate case (where acts are insufficient), while simultaneously claiming the *responsibility structure* of the firing squad (collective overdetermination) applies to climate. It's a bit of a logical salad.

  ### 3. The "Collective Isn't a Person" Fallacy
  You wrote: *"We blame the collective, and since the collective isn't really a person the whole guilt thing just dissolves."*

  This is the move that most ethicists (including your roommate) will reject. In moral philosophy, **collective responsibility distributes; it does not dissolve.**

  If a gang robs a bank, "The Gang" didn't rob the bank; the individuals comprising the gang did. If we say "The Collective is responsible," that just means "All the participants share the responsibility." To say "The collective isn't a person, so I'm off the hook" is like a member of a lynching mob saying, "I didn't kill him, the mob did, and the mob isn't a citizen." The law and ethics say: *You were part of the mob; therefore, you share the guilt.*

  ### 4. So, does this let you off the plane?
  You asked whether either version of the argument lets you off the hook. The short answer is **no.** Here is why both lines of reasoning fail to clear your conscience, according to standard environmental ethics.

  **A. Why the Firing Squad Analogy Fails to Exonerate You**
  As noted above, if the climate crisis *were* like a firing squad (where your flight alone was enough to cause disaster), you would be maximally responsible. Since you are using this analogy to argue for *innocence*, you are using a precedent that actually convicts you.

  **B. Why the "My Emissions Are Nothing" Argument Fails to Exonerate You**
  This is the "Inefficacy Objection." It feels intuitive: *Why suffer the cost of not flying if it makes no difference to the outcome?* Ethicists usually counter this in three ways:

  1.  **Expected Utility:** Even if the chance that *your* specific flight tips the climate over a catastrophic threshold is tiny, the harm of catastrophic climate change is massive. (Tiny Probability × Massive Harm = Significant Expected Disvalue). You are playing Russian Roulette with the planet; just because the odds are low doesn't mean the pull is moral.
  2.  **Complicity and Integrity:** Morality isn't just about outcomes; it's about what kind of person you are. If you know a system is harmful (fossil fuels), participating in it makes you complicit, even if your individual contribution is small. It's about keeping your hands clean, not just saving the world single-handedly.
  3.  **Universalizability (The Kantian Test):** If everyone reasoned the way you are ("My individual act doesn't matter"), the result would be disaster. You cannot rationally will that everyone adopt your maxim. You are essentially making yourself an exception to a rule necessary for collective survival.

  ### The Verdict
  You are confused because you are trying to use a **collective responsibility** argument to secure an **individual exemption.**

  *   If the harm is collective, the responsibility is shared among the individuals.
  *   If the harm is overdetermined (firing squad), the individuals are still guilty.
  *   If the harm is cumulative (climate), the individuals are still complicit.

  **Does the argument let you off the plane?**
  No. The logic you constructed contains a contradiction (using the firing squad to argue for innocence when it argues for guilt) and relies on a premise most ethicists reject (that collective responsibility dissolves individual duty).

  **However,** a nuanced ethical view might say this: You don't need to carry the weight of *saving* the climate by skipping this flight. That is too much burden for one person. But you cannot claim the flight is *harmless*. It is a contribution to a harm. Whether that contribution is justified by the value of seeing your cousin get married is a weighing of values, not a loophole of logic.

  **Recommendation for the Seminar:**
  Tell your roommate you see the distinction now.
  1.  **Firing Squad:** Overdetermination. Each act is sufficient. Responsibility is joint and several. (You are guilty).
  2.  **Climate:** Cumulative harm. Each act is insufficient. Responsibility is based on complicity and expected value. (You are still implicated).
  3.  **The Error:** You tried to use the *structure* of case 1 to argue for the *exemption* of case 2, but case 1 doesn't grant exemptions.

  You can fly to the wedding if you decide the family obligation outweighs the moral cost of the emissions, but you can't claim the moral cost is zero. It isn't.
