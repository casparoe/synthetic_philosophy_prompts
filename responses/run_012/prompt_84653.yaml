          *   Intuition: We still hold all shooters guilty.
          *   Application to Climate: My flight isn't necessary for climate change (it happens anyway). It's overdetermined.
          *   Conclusion: Since the harm is collective/overdetermined, and the "collective" isn't a person, individual guilt dissolves. Therefore, I can fly with a clear conscience.
