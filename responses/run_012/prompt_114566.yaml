      *   **Point 4: The "Secret Torture" Counterexample.** Address this head-on. Under the deeper reading, it's still wrong because it violates the duty to maintain one's own moral sensitivity.
      *   **Point 5: What is Corruption?** Define it as dulling the "natural predispositions" that support reason.
      *   **Conclusion:** Summarize. Kant's view is still anthropocentric (animals don't have rights), but it's not as coldly calculative as the "practice run" interpretation suggests.

