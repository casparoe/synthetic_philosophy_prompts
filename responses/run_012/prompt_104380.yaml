answer: |-
  Right, let's have a proper look at this. It sounds like the game itself has become secondary to the principle of the thing, which is a dangerous place for a friendship to be, but I'll stick to the maths and the logic as you've asked.

  You've described a classic game theory problem, and your flatmate is mixing up correct mathematics with overconfident generalisations. To give you the straight answer you want: on the specific mechanics of *this* game, she is mathematically correct. On the broader claim that this method solves *any* game or describes how people *actually* behave, she is wrong.

  Here is the breakdown, separating the settled maths from the bits that are still argued over in the faculty common rooms.

  ### 1. The "Coin Toss" Move (Mixed Strategy Dominance)

  **Your question:** *Is crossing off a move that's beaten by a coin toss legitimate in the same way as crossing off one that's beaten by another single move?*

  **The Verdict:** **Yes, this is settled.**

  In standard game theory, a move is considered "rational" only if there isn't another way to play that guarantees you a better result. Usually, we compare single moves (pure strategies). If Move A always gives you more than Move B, you cross off B.

  However, the theory also allows you to compare a single move against a *mixture* of other moves. This is what your flatmate did with C.
  *   Move C guarantees you 1 point.
  *   A "coin toss" strategy (50% A, 50% B) guarantees you an average of 1.5 points, regardless of what she does.

  Since 1.5 is strictly better than 1, a rational player who wants to maximise their score should never play C. It doesn't matter if you physically flip a coin or just decide internally to be unpredictable; the *option* to randomise exists, and because that option beats C, C is "dominated."

  **Settled vs. Contested:**
  *   **Settled:** Among professional game theorists, it is consensus that strategies dominated by a mixture (a "mixed strategy") should be eliminated just like strategies dominated by a single move. This is standard textbook material.
  *   **Contested:** The only debate here is philosophical. Some argue that "randomising" implies you don't actually have a preference, which gets messy when trying to define what a player "wants." But for the purpose of calculating the solution? The maths is solid. Your flatmate is right to kill C.

  ### 2. The Order of Deletion

  **Your question:** *Can the order of deletion change what survives?*

  **The Verdict:** **It depends on the type of dominance, but her general claim is wrong.**

  This is where your flatmate starts to wobble. She claims you can cross off moves "in whatever order you happen to fancy."

  *   **Strict Dominance (Your Game):** In your specific game, C is *strictly* worse than the coin toss (1 is less than 1.5). When you are eliminating *strictly* dominated strategies, the order **does not matter**. You will always end up with the same result. So, on this specific point, regarding this specific game, she is right.
  *   **Weak Dominance (Other Games):** If a move is only *sometimes* worse (e.g., Move X gives 2 or 1, Move Y gives 2 or 0), the order **does** matter. If you delete the wrong one first, you can change the final outcome.
  *   **The "Any Game" Claim:** She reckons this trick solves *any* game. This is false. Many games (like Rock-Paper-Scissors) have no dominated strategies at all. Nothing can be crossed off. The "deletion" method stops immediately, yet the game still has a solution (randomising equally).

  **Settled vs. Contested:**
  *   **Settled:** It is a mathematical fact that order does not matter for *strict* dominance, but does matter for *weak* dominance. It is also a fact that many games have no dominated strategies to begin with.
  *   **Contested:** None, really. This is basic mechanics. She is overgeneralising a rule that only applies to certain types of games.

  ### 3. The "Sensible People" Assumption

  **Your question:** *What work is the 'we're both sensible and we know it' assumption really doing — is it doing anything, or is it just decoration?*

  **The Verdict:** **It is doing all the work. It is not decoration.**

  This is the most important bit. You suspected this assumption was just fluff. It is actually the load-bearing wall of the whole argument.

  In economics, "sensible" translates to **Rationality**. "Knowing the other is sensible" translates to **Common Knowledge of Rationality**.
  *   To eliminate C, *you* must be rational (you want more points).
  *   To eliminate further moves in more complex games, *you* must know *she* is rational.
  *   To go even deeper, *she* must know *you* know *she* is rational.

  If you think she might play C out of spite, or habit, or because she didn't do the maths, then you cannot safely eliminate C. Why? Because if she plays C, your best response might change. If you assume she is "sensible," you predict she won't play C, so you adjust your strategy to beat what's left. If she *isn't* sensible, your adjustment might be wrong.

  **Settled vs. Contested:**
  *   **Settled:** Theoretically, this assumption is essential. Without Common Knowledge of Rationality, the logic of "Iterated Elimination of Dominated Strategies" (the crossing-off process) collapses.
  *   **Contested:** Whether this assumption is *true* in the real world is heavily contested. This is the domain of **Behavioural Game Theory**. Evidence suggests people are not perfectly rational, and they don't assume others are either. Most people only go one or two steps deep ("I know she's sensible," but not "I know she knows I'm sensible").

  ### 4. Why She's Losing (The Reality Check)

  You mentioned she has lost four weeks running. This is the bit where theory meets the carpet of your living room.

  If the game is zero-sum (your win is her loss), and you play the "solution" (50% A, 50% B), you guarantee yourself an average score of 1.5 per round. She cannot stop this. If she plays optimally (50% Left, 50% Right), she limits her loss to 1.5 per round.

  If she is losing "four weeks running," it implies one of two things:
  1.  **You are exploiting her:** She is not randomising properly. She is falling into a pattern, and you are subconsciously catching it. In this case, the "Nash Equilibrium" (the 50/50 split) is actually *too conservative* for you. You should be deviating from the theory to take advantage of her mistakes.
  2.  **Variance:** Four weeks is a small sample size. Even with perfect randomisation, luck plays a part in the short term.

  **The Crucial Distinction:**
  Game theory provides a **Normative** solution (how you *should* play to ensure you are never exploited), not necessarily a **Descriptive** one (how people *do* play).
  *   Your flatmate is treating the theory as a magic spell that guarantees victory. It doesn't. It guarantees *unexploitability*.
  *   You are right to be skeptical. If she isn't actually playing randomly (and humans are terrible at being random), then following the textbook solution might leave money on the table.

  ### Summary: Who is Right?

  Here is the scorecard, keeping the settled maths separate from the real-world mess.

  **On the Maths (Settled Consensus):**
  *   **She is right** that C should be eliminated because it is dominated by a mixed strategy.
  *   **She is right** that for this specific type of elimination (strict dominance), the order doesn't change the result.
  *   **She is wrong** that this method solves "any game." Many games require different tools.

  **On the Assumptions (Settled Theory, Contested Application):**
  *   **She is right** that the "sensible people" assumption is required for the logic to hold. It is not decoration.
  *   **You are right** to doubt that assumption holds in reality. The theory assumes perfect robots; you live with a human.

  **On the Outcome (The Four-Week Loss):**
  *   **You are right** to be suspicious. If the theory predicts a draw (or a stable loss rate) and she is getting hammered, either the theory isn't describing her behaviour, or you are beating her *because* you aren't following the theory (by exploiting her predictability).

  **My Advice:**
  Tell her she wins the argument on the abstract mathematics: C is indeed a rubbish move, and the coin-toss logic is valid. But you win the argument on the application: the theory relies on an assumption of perfect rationality that clearly isn't present in your flat on a Friday night.

  If she wants to stop losing, she shouldn't just read a textbook; she needs to stop being predictable. And if you want to stop caring more about the argument than the game, perhaps suggest that next Friday, the loser buys the takeaway. That's a zero-sum game you can both understand.
