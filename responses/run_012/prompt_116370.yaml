answer: |-
  This is a classic and deeply entrenched dispute, but your hunch is correct: you are not having one argument, you are having three stacked on top of each other. The frustration stems from the fact that each side thinks they are winning the argument they are having, while the other side is playing a different game.

  Here is the diagnosis of the structure of your dispute, the validity of the "redescription" move, and what would actually count as progress.

  ### 1. The Diagnosis: Three Layered Disagreements

  You identified descriptive, explanatory, and verbal disagreements. I would refine these into **Ontological**, **Methodological**, and **Normative** layers.

  **Layer 1: Ontological (What is the model *of*?)**
  *   **Econ:** The model is of the **choice**. The agent is a black box; the theory succeeds if it predicts the input-output mapping (problem $\rightarrow$ decision). Internal states (aspiration levels, search processes) are latent variables that only matter if they change the output.
  *   **Psych:** The model is of the **agent**. The theory succeeds if it accurately describes the causal mechanism generating the choice. Internal states are the *explanandum*, not just tools to predict the output.
  *   **The Clash:** When Econ says "satisficing is just optimization with search costs," they are making a claim about the *choice* (the output is consistent with optimization). When Psych says "no, there is no utility function," they are making a claim about the *agent* (the computation does not exist). Both can be true simultaneously without contradicting, but they treat this as a contradiction.

  **Layer 2: Methodological (What counts as a constraint?)**
  *   **Econ:** Constraints must be **external** (budget, time, physical search costs). If you can write a function that yields the observed behavior, the model is valid.
  *   **Psych:** Constraints must be **internal** (cognitive load, memory limits, computational steps). A model that requires the agent to calculate the "optimal stopping point" by estimating the "marginal cost of search" is invalid if the agent doesn't have the cognitive capacity to estimate those costs.
  *   **The Clash:** This is where the "redescription" move becomes toxic. Econ assumes the agent *can* calculate the cost of calculation. Psych says calculating the cost of calculation is the very problem that necessitates satisficing.

  **Layer 3: Normative (What is "Rationality"?)**
  *   **Econ:** Rationality is a **benchmark**. It is the optimal solution given constraints. If behavior deviates, it is an error or a measurement problem.
  *   **Psych:** Rationality is **ecological fit**. It is the use of a mechanism that works well enough in the environment given cognitive limits.
  *   **The Clash:** Econ is asking, "Is this behavior optimal?" Psych is asking, "Is this mechanism adaptive?"

  ### 2. The "Redescription" Move: Refutation or Tautology?

  The Econ claim—"you can always redescribe satisficing as optimizing subject to constraints"—is mathematically trivial but scientifically dangerous.

  **Where Econ is Right:**
  Formally, for any single observed choice, there exists a utility function and a set of constraints that makes that choice the unique maximizer. This is revealed preference theory. If you stop searching at option $X$, we can posit that the utility of $X$ minus the cost of further search was higher than the expected utility of continuing.

  **Where Psych is Right:**
  This redescription becomes unfalsifiable if the "costs" are allowed to be whatever they need to be to fit the data.
  *   **The Infinite Regress Problem:** To optimize the stopping rule, the agent must calculate the expected value of further search. To do *that*, they must search for information about the value of information. This leads to an infinite regress. Satisficing cuts the regress; optimization pushes it back one step.
  *   **The Independence Problem:** A good theory predicts *new* data. If the Econ model explains the stopping point by *post-hoc* adjusting the "search cost" parameter to fit the stopping point, it has no predictive power. The Psych model predicts that if you manipulate the *aspiration level* (e.g., via priming or past success), the stopping point changes *independently* of the objective search costs.

  **Verdict:** The redescription move is **not a refutation**; it is a **translation**. It translates a process description into an outcome description. It is only a refutation if the Econ side claims the agent *actually performs* the optimization calculation. If they claim it only "as if," they are safe from empirical falsification but have surrendered explanatory power.

  ### 3. The "Bounded Rationality" Definition

  You suspected a disagreement about whether bounded rationality is a theory of rationality or cognition. **You are correct.**

  *   **Econ View:** Bounded Rationality is a subset of Rational Choice Theory where the constraints are tighter. It is still a **Normative** theory (what you *should* do given limits).
  *   **Psych View:** Bounded Rationality (in the Simonian tradition) is a **Descriptive** theory of how cognition handles complexity. It explicitly rejects the idea that agents maximize, even subject to constraints, because the maximization calculation is too expensive.

  The fight persists because the Econ side is trying to absorb Bounded Rationality into Rational Choice (making it a special case), while the Psych side sees it as a rival paradigm (making it a replacement).

  ### 4. What Counts as Progress?

  You will not resolve this by arguing definitions. You need to force the disagreement into a domain where one approach fails and the other succeeds. Here are three specific paths to progress:

  **A. The "Cost of Calculation" Experiment (Empirical)**
  Design a task where the "optimal search cost" is computationally expensive to estimate, but the "aspiration rule" is cheap.
  *   *Prediction (Econ):* Agents will approximate the optimal search cost. Errors will be random around the optimum.
  *   *Prediction (Psych):* Agents will ignore the optimal search cost and rely on aspiration drift. Errors will be systematic (e.g., stopping too early after a string of bad options, regardless of the actual value of remaining options).
  *   *Progress:* If behavior tracks aspiration history more than objective value distributions, the "redescription" requires such complex, history-dependent utility functions that it loses parsimony. The Econ model becomes more complex than the Psych model to explain the same data.

  **B. The Formal Parsimony Test (Formal)**
  Ask the Econ side to write down the utility function required to rationalize the Psych side's aspiration-drift mechanism.
  *   *The Trap:* To make aspiration drift look like optimization, the utility function must change dynamically based on past outcomes.
  *   *Progress:* If the "Optimizing" model requires a utility function that is more complex (in terms of parameters or computational steps) than the "Satisficing" mechanism itself, then Optimization fails as a *simplifying* assumption. It becomes a complex description masquerading as a simple law.

  **C. The Marr's Levels Truce (Conceptual)**
  Since you have a CS person in the lab, use **Marr's Levels of Analysis**.
  *   **Computational Level (Econ):** What is the goal and why? (Maximize value given costs).
  *   **Algorithmic Level (Psych):** How is it done? (Satisficing heuristic).
  *   **Progress:** Agree that Econ is modeling the *Computational Level* (the problem space) and Psych is modeling the *Algorithmic Level* (the solution space).
  *   *The Catch:* This only works if Econ admits that the Algorithmic level might *not* match the Computational ideal. If Econ insists the Algorithm *must* be an optimizer, the truce fails.

  ### Summary Recommendation

  Your dispute is **substantive**, but it is being fought on **verbal** terrain.

  1.  **Acknowledge the Redescription is Valid but Expensive:** Concede to Econ that behavior *can* be redescribed as optimization. But demand they pay the price: show the utility function. If that function is more complex than the satisficing rule, the Psych model wins on parsimony.
  2.  **Separate "Rationality" from "Rationalization":** Agree to use "Rationality" for the normative benchmark (Econ's turf) and "Rationalization" for the *post-hoc* fitting of data (the danger zone).
  3.  **Shift the Question:** Stop asking "Is satisficing rational?" Start asking "Under what environmental conditions does the satisficing algorithm yield outcomes indistinguishable from optimization, and under what conditions does it diverge?"

  If the Econ side refuses to engage with the *complexity* of the required utility function, or the Psych side refuses to acknowledge that satisficing can be *evaluated* against an optimal benchmark, then you have a paradigm incommensurability. In that case, split the concept: treat "Optimization" as a normative baseline and "Satisficing" as a descriptive mechanism, and stop trying to force one to be the other.
