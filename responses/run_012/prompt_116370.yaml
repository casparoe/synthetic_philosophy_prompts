      *   *Refinement on "Redescription":* I need to be careful not to just say "Econ is wrong." The Econ point is that *if* you include search costs, stopping is optimal. The Psych counter is that calculating those search costs *is* the problem. The "cost of calculating costs" leads to infinite regress. This is the substantive formal point.
      *   *Refinement on "Rationality":* Distinguish between "Rational as Optimal" vs. "Rational as Adaptive."

  9.  **Final Polish:** Ensure I don't drift into literature review (no Gigerenzer vs. Kahneman citations unless necessary for concepts, but user said no reading lists). Stick to the logic of the arguments provided.

      *(Self-Correction during drafting)*: I initially thought about suggesting Marr's Levels explicitly. It's a CS concept (user mentioned a CS person). It fits perfectly. I should use it as a framing device but ensure it doesn't sound like a "reading list" suggestion. It's a conceptual tool for diagnosis.

      *(Check against constraints)*: Did I answer "what kind of disagreement this is"? Yes. Did I address the "redescription" move? Yes. Did I address "bounded rationality"? Yes. Did I suggest progress? Yes.

      *(Final thought)*: The core is that Econ treats the utility function as a *representation* of preference, while Psych treats it as a *mechanism* of computation. If it's just a representation, Econ wins. If it's a mechanism, Psych wins. They need to agree on which game they are playing.

