      *   **Econ Position:** Satisficing is just optimization with search costs included. "As if" optimization. If you can redescribe behavior as maximizing *something*, the theory holds. Satisficing adds no new predictive content regarding *choices*.
      *   **Psych Position:** Satisficing is a distinct mechanism (aspiration levels, drift, stop rules). No utility function exists. "As if" is unfalsifiable/trivial. The *process* is the theory.
      *   **User's Hunch:** There are multiple questions tangled together (descriptive, explanatory, verbal/normative). Bounded rationality might be ignoring the normative question.
      *   **Goal:** A diagnosis of the *structure* of the dispute. Is it substantive, verbal, or talking past each other? Is the "redescription" move valid? What counts as progress?
      *   **Constraint:** Engage the actual positions laid out, not a literature survey. No reading lists.

  2.  **Deconstruct the Positions:**

      *   **Econ Side (The "Rationalist" Stance):**
          *   *Ontology:* Agents act *as if* they maximize.
          *   *Methodology:* Revealed preference. If behavior is consistent, it can be modeled as optimization.
          *   *Criterion for Theory:* Predictive equivalence regarding *outcomes* (choices).
          *   *View on Psych:* Process details are "implementation details," not theory.
          *   *Key Move:* The "Redescription Defense." Any stop rule can be modeled as an optimal stop rule given specific cost functions.

      *   **Psych Side (The "Mechanist" Stance):**
          *   *Ontology:* Agents use heuristics/procedures (aspiration levels).
          *   *Methodology:* Process tracing, cognitive plausibility.
          *   *Criterion for Theory:* Explanatory adequacy regarding *process* (how the choice is generated).
          *   *View on Econ:* "As if" is tautological/unfalsifiable.
          *   *Key Move:* The "Falsifiability Attack." If everything is optimization, nothing is.

  3.  **Evaluate the User's Hunch:**
      *   *Descriptive:* Yes, do people optimize or satisfice? (Empirical).
      *   *Explanatory:* What counts as an explanation? (Outcome vs. Process).
      *   *Verbal/Normative:* What is "rational"? (Normative ideal vs. Descriptive capability).
      *   *Bounded Rationality:* Is it a theory of rationality or cognition? (This is crucial).

  4.  **Diagnose the Dispute Structure:**

      *   **Is it Substantive?** Yes, but not on the surface level. It's not just about the word "rational." It's about *what a model is for*.
      *   **Is it Verbal?** Partially. They are using "theory of rationality" to mean different things. Econ = Normative/Outcome benchmark. Psych = Descriptive/Process mechanism.
      *   **Is it Talking Past Each Other?** Significantly. Econ is asking "Can this behavior be rationalized?" Psych is asking "How is this behavior produced?"
      *   **The "Redescription" Move:** This is the pivot point.
          *   *Econ:* Mathematically, you *can* almost always construct a utility function that rationalizes a choice (Samuelson's revealed preference).
          *   *Psych:* But that function might be gerrymandered, complex, or require information the agent doesn't have. It lacks *independent* predictive power.
          *   *Verdict:* The Econ move is mathematically valid but scientifically weak if it makes the theory unfalsifiable. The Psych move is scientifically robust but rejects the Econ definition of "rationality."

  5.  **Identify the Hidden Questions:**
      *   *Question 1 (Normative):* What *should* an agent do to be rational? (Econ wins here usually).
      *   *Question 2 (Descriptive):* What *do* agents actually do? (Psych wins here).
      *   *Question 3 (Model Evaluation):* What makes a model good? (Predictive parsimony vs. Mechanistic accuracy).
      *   *The Clash:* Econ thinks Question 1 answers Question 2 (via "as if"). Psych thinks Question 2 invalidates the relevance of Question 1 for descriptive science.

  6.  **Formulate the Diagnosis:**

      *   **Core Conflict:** It's a **Category Error** regarding the purpose of modeling.
      *   **Econ:** Models are *compression tools* for predicting choices. Process is irrelevant noise.
      *   **Psych:** Models are *causal accounts* of cognition. Process is the signal.
