  # Joint Statement on Commemorative Practice and Public Memory

  **Signatories:** 
  *   **Dr. Elena Vance** (Proponent of the State-Endorsement View)
  *   **Dr. Marcus Thorne** (Proponent of the Physical-Contestability View)

  **Date:** October 26, 2023

  ### I. Agreed Claims

  After a period of adversarial collaboration regarding the ethics of public commemoration (specifically statues and street names), we submit the following foundational premises. These claims resolve our prior ambiguities and establish the terms of our remaining debate.

  1.  **The Normative Assertion:** A public monument or eponym is not a neutral historical record. It is a normative assertion by the governing authority that the named figure or event represents a civic virtue worthy of emulation or gratitude. To occupy prime public space is to claim a share of the community's moral identity.
  2.  **The Dynamics of Meaning (Mandatory Condition 1):** The meaning of a monument is **not fixed at erection**. It is dynamically renewed by each act of administrative upkeep. The decision to retain, clean, fund, or protect a statue is a distinct speech act from the decision to erect it. Therefore, a city that retains a monument honoring an unjust figure is not merely preserving history; it is actively re-endorsing the figure's civic standing in the present tense.
  3.  **The Harm of Erasure:** The charge of "erasing history" names a real harm, but it is category-specific. Erasure is a genuine harm when it obstructs *epistemic access* to the past (e.g., destroying archives, censoring textbooks, or hiding evidence). Erasure is *not* a genuine harm when it removes *honorific status* from a figure whose historical actions are still accurately recorded elsewhere. Removal from a plinth is not removal from the record.
  4.  **The Rotating Panel Protocol (Mandatory Condition 2):** A rotating citizen panel empowered to rewrite a statue's plaque every few years counts as **recontextualization**, not the creation of a different monument. Because the physical effigy remains the locus of attention, the artifact is continuous. However, because the interpretive frame changes, the normative assertion (Claim 1) is modified. This satisfies the requirement for physical persistence while acknowledging that state endorsement must evolve.
  5.  **The Scope of Application:** These principles apply equally to three-dimensional statues and two-dimensional eponyms (street names, building names). Both function as state-sponsored signals of belonging and value.

  ### II. Residual Disagreements Table

  While we agree on the nature of monuments and the mechanics of meaning, we disagree on the default presumption for public space and the threshold for intervention.

  | Crux | Vance's Position (State-Endorsement) | Thorne's Position (Physical-Contestability) | Agreed Adjudication Method | Predictions (Pre-Recorded) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Default Presumption** | **Burden on Retention.** In a pluralistic society, the state must justify why a specific figure is being honored *now*. If a figure's legacy is deeply divisive regarding fundamental rights, the default is removal or relocation to a non-honorific context (e.g., a museum). | **Burden on Removal.** Public space should function as a palimpsest. The default is retention with added context. Removal should only occur if the physical presence incites imminent violence or makes the space unusable for a specific protected class. | **Comparative Case Study:** A 5-year longitudinal study of two comparable cities: City A (adopts Vance's "Burden on Retention" for pre-1950 figures) and City B (adopts Thorne's "Burden on Removal" with mandatory contextual plaques). | **Vance:** City A will show higher levels of civic trust among minority populations and no significant drop in historical literacy.<br>**Thorne:** City B will show higher levels of historical literacy and no significant drop in civic trust, while City A will exhibit "memory silencing." |
  | **2. The Function of Friction** | **Friction is Exclusionary.** The presence of an unjust monument creates a hostile environment that prevents equal participation in public life. The "contestability" Thorne desires is theoretical; the lived experience is alienation. | **Friction is Pedagogical.** The discomfort caused by an unjust monument is a necessary civic tool. It forces citizens to confront the gap between past values and present ideals. Smoothing this over sanitizes the political reality. | **Empirical Survey:** Psychometric testing of citizens from marginalized groups vs. majority groups when navigating spaces with contested monuments vs. spaces with recontextualized plaques. | **Vance:** Margitized groups in "contested" spaces will report significantly higher cortisol levels and lower sense of belonging than in "recontextualized" spaces.<br>**Thorne:** There will be no significant physiological difference, but "recontextualized" groups will show lower retention of historical nuance in follow-up quizzes. |

  ### III. Adjudication and Commentary

  *Authored by the Collaborative Oversight Committee*

  In reviewing this statement, we note that the signatories have successfully isolated the substantive disagreements from the verbal ones.

  **1. Identification of Merely Verbal Disagreements**
  A significant portion of the prior conflict was verbal, centering on the definition of "History." Dr. Thorne frequently used "History" to mean *the sum total of physical artifacts remaining in situ*. Dr. Vance used "History" to mean *the accurate narrative understanding of the past*. 
  Claim 3 resolves this. Once both parties agree that removing a statue does not equate to censoring a textbook, the "Erasure" objection loses its absolute force. Thorne's fear is not that the past will be forgotten, but that the *texture* of the past will be smoothed over. Vance's fear is not that the past will be forgotten, but that the *present* will be complicit. These are compatible concerns, not contradictory facts.

  **2. Evaluation of the Stronger Case**
  We judge **Dr. Vance's case (State-Endorsement) to be stronger** regarding the governance of *active civic spaces* (squares, government buildings, main thoroughfares), while **Dr. Thorne's case (Physical-Contestability) is stronger** regarding *designated historical zones* (battlefields, heritage parks).

  **Reasons:**
  *   **The Coercive Nature of State Speech:** In a liberal democracy, the state must remain neutral regarding comprehensive doctrines of the good life where possible. A statue is not neutral; it is a subsidy of reputation. As Claim 2 establishes, upkeep is a renewed subsidy. Vance correctly identifies that maintaining a monument to a figure who advocated for the disenfranchisement of current citizens creates a contradiction in the state's own claim to equal protection. Thorne's "pedagogical friction" often functions less as a lesson and more as a signal of second-class citizenship to those whose ancestors were victimized by the honoree.
  *   **The Illusion of Contestability:** Thorne argues that leaving a statue up allows the past to be "contestable." However, empirical observation suggests that statues rarely spark debate; they become invisible background noise until a crisis occurs. Vance's model, which requires active justification for retention, ensures the debate remains live and democratic, rather than sedimented in bronze.
  *   **The Compromise of Recontextualization:** The agreement on the Rotating Panel (Claim 4) leans toward Vance's logic. If meaning is renewed by upkeep, then changing the plaque changes the monument's moral claim. This allows Thorne to keep the stone (satisfying the archival impulse) while allowing Vance to alter the speech act (satisfying the justice impulse). However, Vance is correct that a plaque cannot always fully neutralize the honorific power of a towering effigy. Therefore, the "Burden on Retention" (Crux 1) is the more ethically robust default for general public spaces.

  **Conclusion:**
  The collaboration succeeds because it shifts the question from "Did this happen?" (which both agree is settled) to "What relationship do we want the state to have with this memory?" We endorse the **Vance-default** for active civic infrastructure, with the **Thorne-exception** applied only where the primary purpose of the space is explicitly archival education.
