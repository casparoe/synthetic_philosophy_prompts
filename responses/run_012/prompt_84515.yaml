answer: |-
  Thank you for coming. For those of you who knew [Friend's Name] well, you know I'm standing here under instructions. She wasn't just a translator of Russian poetry; she was a translator of thought, specifically her own, and specifically regarding how we think.

  For the last twenty years, she campaigned tirelessly for the ideas in Hofstadter and Sander's work on cognition. She'd corner you at dinner, wine glass in hand, and explain that we never truly know a thing. We only know it by what it resembles. To call something a "door" is just to say it's like other doors you've opened. To call her a "friend" is to say she's like other friends you've had. Concepts are just dried sediment of past likenesses.

  She believed that when someone dies, the language runs out. She told me that grief is the one place where analogy has no purchase. You can't say what pain is like, because it isn't like anything. It just is. So, she made me promise to test this theory today. She challenged me to stand here and say one true sentence about her that does not rely on a comparison. One sentence that doesn't say she was *like* this, or *similar* to that, or *as* something else. If I couldn't find one, I was to admit it. No cheating. No smuggling in a simile and calling it a fact.

  I've tried to write this speech a dozen ways. I'm a novelist; my trade is comparison. I look for the likeness in things. But for her, I had to put the tool down.

  I tried: "[Friend's Name] was kind." But kindness is a category. To say she was kind is to say she behaved like other kind people. It's an analogy to a group.
  I tried: "[Friend's Name] was a translator." But that compares her to others who move words between languages. It places her in a set.
  I tried: "[Friend's Name] was my friend." But that defines her by her relation to me, which is a comparison of roles.

  Every time I reached for a word, I felt the trap snap shut. The linguists in the room know this truth: language is a map of similarities. To speak is to compare. For her mother, and her family, I know this sounds cold. You don't need Hofstadter to tell you that describing her feels insufficient. You know that nothing she was can be fully captured by words that also describe strangers. You know that the specific weight of her absence doesn't feel like anything else you've felt.

  So, I have spent weeks looking for a statement that is purely indexical. A statement that points to her existence without referencing another existence. I needed a fact that stands alone.

  And I found one. But it requires an object.

  *[Pause. Perhaps gesture to a pocket or the lectern, or simply speak the words]*

  I have her teaspoon.

  It is stainless steel. It has a dent in the handle from where she dropped it on the tiled floor of her kitchen in 2019. It has a smear of tarnish near the bowl that doesn't wash off. It weighs twenty-three grams. It is currently sitting in my pocket.

  Here is the sentence:

  **This teaspoon belonged to [Friend's Name].**

  That is not a comparison. It does not say she was like anyone. It does not say she was like anything. It does not categorize her mind or her soul. It states a physical history of ownership between a woman and a piece of metal. It is a closed loop. It is true without referencing anything else in the universe.

  She told me grief is where analogy has no purchase. I think she was right. Because when I hold that teaspoon, I am not thinking of other spoons. I am not thinking of other friends. I am not thinking of metaphors about loss or hollow spaces. I am thinking of the specific sound it made when it hit her tiles. I am thinking of the specific way she stirred her tea, counter-clockwise, three times.

  To the translators here: I know this sentence is trivial compared to the complexity of her mind. I know Hofstadter might argue that even "teaspoon" is a category. But in the context of her challenge, in the context of this grief, it is the only thing I have that doesn't try to map her onto something else. It just lets her be where she was.

  To her mother: I know you miss your daughter. I know philosophy doesn't bring her back. I only know that [Friend's Name] wanted us to be honest about how we speak about the dead. She wanted us to stop pretending we can compare them to anything living.

  So I am keeping my promise. I have found one sentence. It isn't much. It doesn't capture her wit, or her stubbornness, or the way she could dismantle an argument with a single raised eyebrow. But it is true, and it is hers.

  This teaspoon belonged to [Friend's Name].

  And now I'm going to go home and wash it, and put it in my drawer, and leave it there.

  Thank you.
