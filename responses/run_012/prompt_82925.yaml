prompt: |-
  ok so my econ teacher did the centipede game in class today and at the end he gave us a summary of it and I copied it down pretty much word for word since I figured it'd be on the test:

  "two players take turns, and on each turn you either take the pot or pass it to the other player, and the pot gets bigger every time it gets passed. start from the last round, where whoever's turn it is obviously just takes the money; the player before them knows that, so they take it a round early; and that keeps rolling back until you get to the very first turn, where the rational move is to take the money right away. so the game proves that perfectly rational players will never cooperate with each other, even though they'd both be way richer if they did. its basically the prisoners dilemna with more steps, and the takeaway is that being selfish is the rational thing to do — thats what makes it a paradox."

  I kind of follow the backwards part, but the ending seems off to me. If I was actually playing I'd pass a couple times, cause the pot gets so much bigger, and I dont think that makes me irrational. Is his summary fair though? Can you go through it basically sentence by sentence and tell me which parts a game theorist would just nod along with, which parts they'd wince at, and which parts are flat out wrong — and does the conclusion he draws at the end, that being selfish is the rational thing to do, actually follow from the parts that are right? I'm not looking for a reading list or anything, just what I should actually believe here.
