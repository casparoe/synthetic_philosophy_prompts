answer: |-
  Here is the breakdown you need for your piece.

  ### 1. The Correspondence Table
  Here is how the statistical mapping is supposed to work versus how it actually functions in practice.

  | Statistical Concept | Citizens' Assembly Equivalent | The Reality Check |
  | :--- | :--- | :--- |
  | **Population** | The citizenry (usually eligible voters). | Excludes those ineligible to vote, often excludes non-citizens affected by policy. |
  | **Sampling Frame** | Civil registries, phone lists, mail databases. | Often misses the hard-to-reach (unhoused, unstable housing, distrustful of gov). |
  | **Sample Size** | 100–150 members. | Statistically sufficient for a poll, but tiny for a governing body. |
  | **Confidence Interval** | Implied to be low (high precision). | Meaningless once deliberation begins; variance is suppressed by consensus-seeking. |
  | **Survey Instrument** | The final vote or recommendation report. | Not a measurement of preference, but a product of negotiation and curriculum. |
  | **Non-Response** | People who decline the invitation. | **Critical Failure Point:** Those who show up are civically distinct from those who don't. |
  | **Weighting/Stratification** | Quotas for age, gender, region, (sometimes) attitude. | Attempts to fix non-response bias, but creates a "constructed" rather than "random" sample. |

  ### 2. Where the Picture Breaks Down
  The statistical analogy relies on the assumption of **stability**. In a poll, you assume that if you measure the population today, you know what they think. In an assembly, the explicit goal is **instability**. You are paying people to change their minds.

  *   **The Transformation Problem:** A sample measures a *state*; an assembly produces an *outcome*. If 150 people enter a room and 60% support a carbon tax, but 90% support it after three weekends of expert briefings, the final vote is no longer a representation of the population's *current* will. It is a representation of the population's *hypothetical* will under ideal conditions. You cannot sample a counterfactual.
  *   **The Non-Response Bias:** In polling, you weight data to account for people who don't pick up the phone. In assemblies, you cannot weight for the 95% of people who said "no thanks" to the invitation. The people who say "yes" to civic duty are systematically different (higher trust, more free time, higher education) than those who say "no." No amount of demographic quota fixing solves for *civic disposition*.
  *   **The Curriculum Effect:** A poll asks, "What do you think?" An assembly asks, "What do you think after listening to these specific experts?" The "briefings" are a curated information diet. In a statistical sample, information exposure is random and uncontrolled. In an assembly, it is a treatment variable.

  ### 3. What the Sampling Image Smuggles In
  The sampling analogy is doing heavy lifting to bypass the charge of elitism. It smuggles in **epistemic authority** disguised as **democratic mirroring**.

  *   **The "Is" vs. "Ought" Switch:** The organizers want the legitimacy of a poll (this *is* what the people think) with the quality of a committee (this is what the people *should* think).
  *   **The Object of Representation:** If deliberation changes minds, what is being represented at the end? It isn't the people's *preferences*; it is the people's *interests* as interpreted by the members. This moves the assembly from a **delegate model** (mirror) to a **trustee model** (representatives using judgment). But unlike MPs, they weren't elected to be trustees.
  *   **Stratifying by Prior Position:** The organizer who told you they stratify by "prior position" is admitting that demographics don't predict political behavior.
      *   *Is it clever?* Yes, because it ensures the room contains the actual conflict (e.g., climate skeptics vs. activists) rather than just a demographic average that might lean one way.
      *   *Is it incoherent?* Statistically, yes. You cannot stratify by a variable (opinion) that you are trying to measure as an output. By pre-selecting for views, they are turning the assembly into a **microcosm of the debate**, not a **microcosm of the population**. They are sampling the *argument space*, not the *people*. This is a valid design choice for conflict resolution, but it invalidates the claim that "this is a random sample of the country."

  ### 4. Does the Conclusion Survive?
  **The specific conclusion that "this is statistically the people" does not survive.** If you pull that thread, the claim that the assembly is *more* legitimate than a parliament or referendum because it is a "perfect sample" collapses.

  **However, the broader conclusion that "this adds value elections can't" does survive, but the justification shifts.**
  *   **Elections** select for popularity, fundraising, and party loyalty.
  *   **Referendums** measure raw, often uninformed, snapshot opinion.
  *   **Assemblies** select for diversity of experience and capacity for deliberation.

  The legitimacy doesn't come from being a statistical mirror; it comes from **procedural fairness**. It's legitimate not because they *are* us, but because *any of us could have been them*, and they were given the time and resources to think that we are denied.

  If you keep the "binding" recommendation claim without the sampling analogy, you run into a democratic deficit. If they aren't us, why are they binding? The strongest case is that they are **advisory with a mandatory response** (like a jury verdict that a judge must sentence on), or that their output must be ratified by a referendum (the "people" sample the "assembly's" work).

  ### 5. A Better Analogy
  Drop the "Poll/Sample" analogy. It's scientifically wrong and politically fragile.

  **Use the Jury Analogy.**
  *   **Why it works:** Juries are randomly selected (sortition). They are demographically diverse. They hear evidence (briefings). They deliberate in private. Their goal is to reach a verdict based on the evidence, not to mirror public opinion on crime.
  *   **The Shift:** We don't say a jury *is* the public. We say a jury acts *on behalf of* the public to find the truth.
  *   **The Limit:** Juries decide facts and law application, not resource allocation or value trade-offs.
  *   **Refinement:** Call it a **"Policy Jury."**
      *   Like a jury, they are citizens, not career politicians.
      *   Like a jury, they weigh evidence, not polls.
      *   Like a jury, their legitimacy comes from the *process*, not the *outcome matching public sentiment*.

  **The Pitch for Your Piece:**
  The "random sample" line is a comforting fiction. It allows technocrats to claim democratic cover for decisions that might be unpopular in the short term. The assemblies aren't a mirror of the country; they are a **R&D lab for democracy**. They prototype solutions. The mistake is treating the prototype as the final product without letting the public (the actual shareholders) sign off on it.

  If you want to save the "boom," stop selling them as "the voice of the people" and start selling them as "the conscience of the people." One is a measurement; the other is a function.
