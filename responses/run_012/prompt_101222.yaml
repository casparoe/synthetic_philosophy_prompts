answer: |-
  It is a pleasure to meet a fellow traveler in the borderlands between the hard sciences and the philosophy of science. First, tell your wife that arguing with the radio is a time-honored tradition of the retired intellectual; it keeps the synapses firing.

  Your intuition is not "wrong" in the sense of being unscientific. As a soil scientist, you are trained to look at the pedosphere as a record of process, and you are correct that human activity has left a physical mark on the Earth system. Plutonium isotopes, microplastics, and nitrogen cycles *are* in the stratigraphy.

  However, your reading group is nudging you toward a distinction that is often invisible from inside the laboratory: the difference between an **ontological claim** (does this physical signal exist?) and a **classificatory decision** (does this signal warrant a new formal unit of geological time?).

  Here is where the picture gets blurry, and where the "who decides" question enters not as politics leaking into science, but as a structural feature of how geological time is constructed.

  ### 1. The K-Pg Disanalogy: Event vs. Process
  Your analogy to the Cretaceous-Paleogene (K-Pg) boundary is the strongest part of your argument, but it is also the source of the confusion.

  The K-Pg boundary is an **event**. An asteroid hit; iridium settled; soot rained down. It was geologically instantaneous and globally synchronous. You can draw a line in a clay layer in Italy and correlate it to a layer in Denmark within a very tight margin of error. The "decision" was merely recognizing the physical spike.

  The Anthropocene, by almost all accounts, is a **process**. Whether you point to the advent of agriculture (Ruddiman's hypothesis), the Industrial Revolution, or the Great Acceleration of the 1950s, you are pointing to a ramp, not a step.
  *   **Agriculture:** Diachronous. It started 10,000 years ago in the Fertile Crescent, 5,000 years ago in parts of Europe, and later elsewhere. There is no single global stratigraphic horizon.
  *   **Industrialization:** Also diachronous. CO2 rises gradually; soot deposits vary by region.
  *   **The "Bomb Spike" (1950s):** This is the only candidate that looks like a K-Pg event (global plutonium-239 deposition).

  If you choose the Bomb Spike, you satisfy the stratigraphers but ignore 5,000 years of human earth-moving. If you choose Agriculture, you satisfy the historians and some soil scientists, but you violate the International Commission on Stratigraphy (ICS) rule that an epoch boundary must be isochronous (happening everywhere at once).

  So, the "who decides" question enters here: **Who gets to prioritize stratigraphic purity over historical causality?** That is not an empirical question; it is a methodological one.

  ### 2. The Normative Weight of the Start Date
  In most geological epochs, the name is descriptive (Jurassic means Jura Mountains; Pleistocene means "most new"). The start date has no moral weight. We don't argue about when the Pleistocene started to assign blame for glaciation.

  The Anthropocene is unique because the name implies *agency*. "Anthropos" means human. To define the start date is to define the culprit.
  *   **Start at 1950:** The culprit is technology, consumerism, and population growth. It suggests a problem of *management*.
  *   **Start at 1800:** The culprit is capitalism, fossil fuels, and industrialization. It suggests a problem of *political economy*.
  *   **Start at 5000 BP:** The culprit is humanity *as a species*. It suggests a problem of *existence* (we are inherently destructive).

  When your reading group says you are confused, they are pointing out that scientists are not just measuring a layer; they are selecting a narrative. If the ICS ratifies 1950 as the start, they are implicitly rejecting the argument that colonialism or agriculture drove the change. That is why "who decides" matters. It isn't just about finding the iridium; it's about deciding which human story gets carved into the geological time scale.

  ### 3. The Map vs. The Territory
  This is the philosophical core of your reading group's objection. You are treating the Geological Time Scale as a map that must perfectly mirror the territory (the physical rock record).

  But the Geological Time Scale is not just a record of physical changes; it is a **communication tool**. It is a grid we overlay on the rock to make it intelligible. The ICS has strict rules to ensure that grid remains useful for correlation across deep time.

  The question "Is the Anthropocene a formal epoch?" is not the same as "Have humans changed the Earth?"
  *   **Empirical Fact:** Humans have changed the Earth. (You are right; the data is in.)
  *   **Stratigraphic Question:** Is that change distinct enough, sharp enough, and global enough to warrant breaking the Holocene into two pieces?

  Many stratigraphers argue the answer is "no." They argue the human signal is distinct, but it doesn't fit the *rules of the game* for defining an epoch. If you break the rules to accommodate the Anthropocene, you weaken the utility of the time scale for the next billion years of geology.

  So, the "who decides" is the ICS protecting the integrity of their classification system against a term that originated in ecology and critical theory, not stratigraphy.

  ### 4. The Recent Verdict (A Postscript for the Retired Scientist)
  I must mention a development that likely post-dates some of your reading group's discussions. In **March 2024**, the International Commission on Stratigraphy (ICS) effectively **rejected** the proposal to formalize the Anthropocene as a geological epoch.

  The Working Group on the Anthropocene (WGA) had proposed Crawford Lake in Canada as the "Golden Spike" (GSSP), pinning the start to 1950 (the plutonium spike). The higher committees voted it down.

  Why?
  1.  **Stratigraphic reasons:** The signal is too short (70 years is a blink in geologic time).
  2.  **Practical reasons:** It renders the Holocene (which we are still in) fragmented.
  3.  **Philosophical reasons:** Many voting members felt the term is too culturally loaded to serve as a neutral scientific unit.

  This vindicates your reading group's suspicion that this wasn't just an empirical waiting game. The data *was* there (Crawford Lake cores were excellent), but the *decision* was made that the data did not justify the classification.

  ### Summary: What kind of question is this?
  To answer your final question: "When did the Anthropocene start?" is a **boundary object** question. It sits at the intersection of natural science, social science, and philosophy.

  *   **As a natural science question:** It asks about signal-to-noise ratios in sediment. (You are right here).
  *   **As a philosophical question:** It asks about the ontology of human agency in nature.
  *   **As a bureaucratic question:** It asks whether the ICS rules should be bent for a culturally significant term.

  You are making a category error by assuming the *scientific* answer dictates the *classification* answer. In geology, the classification is a human convention imposed on the rock, not just read off it. The K-Pg boundary was easy because the rock screamed the answer. The Anthropocene is hard because the rock is whispering, but the culture is shouting.

  **The takeaway:** You aren't wrong about the soil, the isotopes, or the human impact. But you were treating the Geological Time Scale as a discovery, when it is actually a negotiation. The "who decides" enters because the criteria for the decision are not purely empirical; they are institutional and, inevitably, somewhat political.

  Keep arguing with the radio. It sounds like you're doing it better than most of the people on it.
