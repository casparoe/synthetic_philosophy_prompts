prompt: |-
  I retired from soil science about four years ago and have been reading alot of philosophy and history of science since — my wife says I now argue with the radio. Anyway, the Anthropocene. Everybody keeps going round in circles about when it started, and my instinct as a natural scientist is that this is just an empirical question we haven't nailed down yet: give the stratigraphers a few more decades of ice cores and lake sediments and they'll pin the date down, the same way the K-Pg boundary got pinned down once people found the iridium layer. And once the evidence is in, the "who decides" part seems to me basically moot, because the answer will be forced by the data — it's just a matter of time until the geologists fall in line. But the reading group keeps telling me I'm confused about something here and I can't get a straight answer out of them. So: what's wrong with this picture? Where does the "who decides" part actually enter, if the evidence is the evidence? Is it just politics leaking into a scientific question, or am I making a mistake about what kind of question "when did the Anthropocene start" even is? And if it's the second thing, what kind of question is it, and how would I tell the difference from the outside?
