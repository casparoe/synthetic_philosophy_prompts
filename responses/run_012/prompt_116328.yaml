answer: |-
  ### The procedure in one breath

  Test recognition against neighbors first; if it confuses with `c`, `e`, or `o`, kill it. Test style against the family DNA; if it feels like an orphan, adjust terminals and stress. Test legibility at distance and blur; if it vanishes in glare, open counters. If recognition fails, the Principal decides. If legibility fails, the Consultant vetoes. If style fails, the Junior adjusts. Do not argue with data; if the shape breaks the rule, change the shape.

  ### The steps, in order

  1.  **The Neighbor Test (Category Integrity)**
      *   **Action:** Place the glyph in a string with its closest structural neighbors (`a` with `c`, `e`, `o`, `u`; `l` with `I`, `1`, `j`). Reduce opacity to 20% and view at 10% scale.
      *   **Pass:** The glyph is identifiable without context clues within 0.5 seconds.
      *   **Fail:** Hesitation occurs, or the glyph reads as a neighbor (e.g., single-story `a` reads as `o`).
      *   **Fix:** Exaggerate the distinguishing feature (open the aperture, extend the tail, break the curve). If no feature exists to exaggerate, the form is invalid.
      *   **Time:** 5 minutes.

  2.  **The DNA Test (Stylistic Consistency)**
      *   **Action:** Overlay the glyph's core strokes (stem, curve axis, terminal angle) onto three established characters from the same weight. Ignore the specific shape; look at the construction logic.
      *   **Pass:** The stroke modulation and terminal cuts match the family's underlying geometry.
      *   **Fail:** The glyph looks like it belongs to a different weight or family (e.g., a humanist `g` in a geometric sans).
      *   **Fix:** Align terminal angles and stress axis to the master glyphs. If the shape requires breaking the family's core contrast to exist, it is an orphan.
      *   **Time:** 10 minutes.

  3.  **The Distance Test (Environmental Legibility)**
      *   **Action:** Scale the glyph to its intended physical height at 40 metres. Apply a Gaussian blur simulating low vision and glare (reduce contrast by 40%).
      *   **Pass:** The counter remains open and the shape holds solid.
      *   **Fail:** Counters fill in, strokes disappear, or distinct shapes merge (e.g., `l` and `I` fuse).
      *   **Fix:** Increase stroke weight, open counters, or add distinguishing marks (tails, spurs). If this breaks the DNA, return to Step 2.
      *   **Time:** 5 minutes.

  4.  **The Authority Map (Decision Assignment)**
      *   **Action:** Log the result of Steps 1–3.
      *   **Pass:** All steps pass. Mark as "Ready."
      *   **Fail:** Step 1 fail → Principal decides viability. Step 2 fail → Junior adjusts or escalates to Principal. Step 3 fail → Automatic veto; Consultant must approve exception.
      *   **Fix:** Document the deviation. If an exception is granted, note it as a "Constraint Override" for future family extensions.
      *   **Time:** 2 minutes.

  ### Three glyphs, run through

  **1. Single-story `a`**
  *   **Neighbor Test:** Pass. Distinct from `o` due to vertical stem, distinct from `u` due to closed counter.
  *   **DNA Test:** Pass. Terminal angles match the `c` and `e`. The stubby bowl matches the face's compact proportions.
  *   **Distance Test:** Caution. At 40 metres with glare, the aperture narrows.
  *   **Verdict:** Keep, but widen the aperture by 15%. The shape is valid, but the environment demands aggression. This is a style choice validated by legibility data.

  **2. Earless single-story `g`**
  *   **Neighbor Test:** Fail. At 10% scale, the closed loop reads as `o` or `q`. The lack of an ear removes the primary identifier.
  *   **DNA Test:** Pass. It fits the geometric minimalism perfectly.
  *   **Distance Test:** Fail. Under blur simulation, the descender loop fills in completely. It becomes a blob.
  *   **Verdict:** Cut. We are attached to the minimalism, but Step 1 and Step 3 both veto it. The risk of misreading in a transit environment is too high. Revert to double-story `g` with open ear. This is the hard call: beauty loses to function.

  **3. Straight `l` (no tail)**
  *   **Neighbor Test:** Fail. In the planned Latin Extended support, this conflicts with `I` (capital i) and `1` (one).
  *   **DNA Test:** Pass. It is the cleanest vertical possible.
  *   **Distance Test:** Pass individually, but fails in pairs (`ll` vs `II`).
  *   **Verdict:** Cut. While acceptable for English-only, the client brief implies future international expansion. Step 4 mandates Principal decision on scope. We must add a tail or hook now to avoid redrawing later. Consistency across languages overrides current minimalism.

  ### Where a person has to decide

  The procedure handles the objective checks, but the trade-offs are human. The Junior owns Step 2 (DNA); if she feels a glyph is an orphan, she adjusts it. If she cannot fix it without breaking the style, she escalates to the Principal. The Principal owns Step 1 (Category); only you can decide if a radical shape is still an `a` or a new symbol. The Consultant owns Step 3 (Legibility); their veto on the Distance Test is absolute for this project. If the procedure says "Cut" but the brand team demands "Keep," that is a commercial decision, not a design one, and must be signed off by you as liability acceptance. Taste wears the lab coat in Step 2, but data wears it in Steps 1 and 3.

  ### What this can't do

  This procedure cannot simulate real-world glare perfectly; screen blur is not sunlight on enamel. It cannot predict cognitive load under stress; a tired commuter reads differently than a tester. It cannot resolve emotional attachment; you will still love the earless `g` after cutting it. It fails on novel forms without precedent; if you invent a new `a`, the Neighbor Test has no baseline. On this project, the biggest failure mode is the Consultant's subjectivity; their "legibility veto" may contradict your Distance Test data. Finally, it cannot account for hinting and rendering issues on digital signage; a shape that works in vector may pixelate poorly. Use this to filter errors, not to guarantee perfection.
