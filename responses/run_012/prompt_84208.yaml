answer: |-
  **Suggested Grade: 3.5 / 10**

  **General Feedback Summary:**
  You have a good grasp of the *intuitions* behind the Bank Cases (i.e., that we are less willing to attribute knowledge in high-stakes scenarios). However, you have conflated the *mechanisms* that Contextualism and Subject-Sensitive Invariantism (SSI) use to explain those intuitions. Specifically, you frequently confused whose stakes matter (the attributor's vs. the subject's) and misidentified the relationship between pragmatic encroachment and contextualism.

  **Point-by-Point Comments for the Student:**

  *   **Part (a): The Bank Cases & Mechanisms (Score: 2/4)**
      *   **Good:** You correctly described the intuitive output of the Bank Cases (knowledge is attributed in low stakes, denied in high stakes). You also correctly noted that SSI denies "knows" is context-sensitive.
      *   **Correction:** You attributed the *Subject-Sensitive* mechanism to DeRose/Contextualism. You wrote: *"For DeRose... whether the subject knows depends on how much is at stake for the subject."* This is incorrect. For the Contextualist, the standard is set by the **attributor's** context, not the subject's stakes. The description you gave there is actually the definition of SSI. You need to be precise about *whose* context/stakes drive the truth conditions for each view.

  *   **Part (b): Cross-Context Assessment (Score: 1.5/3)**
      *   **Good:** Your answer for the **Contextualist** was correct. Since the attributor (A) is in a low-stakes context, the standards are low, and "S knows" is true.
      *   **Correction:** Your answer for the **Subject-Sensitive Invariantist** was incorrect. You wrote that for SSI, *"what matters is A's practical situation."* This contradicts the name of the view: it is **Subject**-Sensitive. For the SSI theorist, knowledge depends on the **Subject's (S)** stakes. Since S is in a high-stakes situation with only moderate evidence, S does *not* know. Therefore, A's attribution "S knows" is **false**. You treated SSI as if it were sensitive to the attributor, which is the Contextualist position.

  *   **Part (c): Entailment & Taxonomy (Score: 0/3)**
      *   **Correction:** Pragmatic Encroachment does **not** entail Contextualism. This is the defining feature of Subject-Sensitive Invariantism (the most common form of pragmatic encroachment): it argues that practical factors affect knowledge *without* making the word "knows" context-sensitive.
      *   **Fact Check:** Fantl and McGrath are prominent defenders of Pragmatic Encroachment/SSI, but they are **not** contextualists; they are invariantists. Your reasoning here suggests a fundamental misunderstanding of the difference between "knowledge varies with stakes" (Encroachment) and "the meaning of 'knows' varies with context" (Contextualism).

  **TA Note (For your consistency across blue books):**
  *   **Part (a):** I deducted heavily here because they defined Contextualism using the SSI mechanism (subject stakes). This is a category error.
  *   **Part (b):** I gave half credit because they got the Contextualist verdict right, but the SSI verdict was the exact opposite of the correct answer because they swapped the locus of stakes.
  *   **Part (c):** This is a binary conceptual check. If they think Fantl & McGrath are contextualists, they haven't grasped the core taxonomy of the unit. Zero points is appropriate to maintain consistency with students who correctly identified SSI as invariantist.
