answer: |-
  ### Specification for a Theory of Supererogation

  The following is a specification sheet for any moral theory claiming to accommodate the category of supererogation. It does not argue that supererogation exists; rather, it details what a theory must explain *if* it is to capture the phenomena typically associated with acts "beyond the call of duty." The desiderata are derived from four specific pressure points that test the boundaries of deontic logic.

  #### I. The Four Desiderata

  **1. Act-Agent Dissociation (The Motive Pressure Point)**
  *   **The Case:** An agent performs an act that objectively exceeds moral requirements (e.g., rushing into a burning building to save a stranger), but does so from a motive that undercuts praise (e.g., desire for fame, or a calculated expectation of reward).
  *   **The Requirement:** The theory must distinguish the *deontic status* of the act (is it supererogatory?) from the *aretaic status* of the agent (is she praiseworthy?).
  *   **What This Forces:** The theory cannot define supererogation essentially in terms of virtue or moral worthiness. It must allow for the possibility of a "right act, wrong reason." If a theory ties the status of the act inextricably to the goodness of the motive, it will fail to classify this case correctly, likely collapsing it into mere permissible action or denying its supererogatory status.

  **2. Collective Scalability (The Group Pressure Point)**
  *   **The Case:** A group of neighbors organizes a cleanup. Individually, no neighbor does more than their fair share (duty). Collectively, however, the group produces a benefit far exceeding what morality could require of them as a unit.
  *   **The Requirement:** The theory must specify whether supererogation is an atomistic property of individuals or an aggregative property of collectives. It must determine if a group can be supererogatory when no constituent member is.
  *   **What This Forces:** The theory must declare its ontological scope. If it claims supererogation is strictly individual, it must explain away the intuition that the *group* did something extraordinary. If it allows collective supererogation, it must provide an account of how group obligations are formed without violating the principle that "ought implies can" for the individuals involved.

  **3. Contextual Sensitivity (The Cost Pressure Point)**
  *   **The Case:** Jumping on a grenade is supererogatory for a civilian but obligatory for a soldier in a specific combat role. The physical act is identical; the moral status differs based on role, relationship, and the cost of the alternative.
  *   **The Requirement:** The theory must accommodate the relativity of duty. It must allow that the boundary between obligation and supererogation shifts based on the agent's circumstances, roles, and the magnitude of sacrifice required.
  *   **What This Forces:** The theory cannot rely on a rigid, universal catalog of obligatory act-types. It must incorporate a variable threshold of "cost" or "sacrifice" that determines where duty ends. A theory that posits duty is independent of cost (e.g., some strict deontological views) will struggle to explain why the soldier is obligated while the civilian is not.

  **4. Epistemic Neutrality (The Belief Pressure Point)**
  *   **The Case:** An agent believes an act is strictly required (e.g., "I must donate my kidney") and acts on that belief. In objective fact, the act was not required.
  *   **The Requirement:** The theory must clarify the relationship between objective moral facts and the agent's subjective perspective. It must decide if supererogation is determined by what is *actually* beyond duty, or what the agent *believes* is beyond duty.
  *   **What This Forces:** The theory must choose between an Objectivist or Subjectivist account of obligation. If it is Objectivist, the agent in this case performed a supererogatory act (since they did more than was actually required). If it is Subjectivist, the agent performed a dutiful act (since they did what they thought was required). The theory cannot remain ambiguous on whether moral status tracks truth or belief.

  ***

  #### II. Status of Requirements: Settled, Contested, and Incompatible

  To navigate the literature, one must distinguish between constraints that are constitutive of the concept (among proponents) and those that are matters of theoretical preference.

  **Non-Negotiable (Among Proponents)**
  *   **Act-Agent Dissociation (1):** It is a settled intuition among those who accept supererogation that the category describes *acts*, not merely *agents*. A theory that collapses this distinction is usually viewed as failing to capture the phenomenon, effectively reducing supererogation to saintliness.
  *   **Contextual Sensitivity (3):** It is widely accepted that cost and role matter. A theory that claims jumping on a grenade is always obligatory (for everyone) or always supererogatory (for everyone) is considered extensionally inadequate.

  **Optional / Contested Commitments**
  *   **Collective Scalability (2):** This is genuinely contested. Many prominent accounts (e.g., standard Utilitarianism or Kantianism, even when modified) are methodologically individualistic. Accepting collective supererogation is a commitment of specific camps (e.g., certain collectivist or institutional accounts), not a requirement for the category's coherence.
  *   **Epistemic Neutrality (4):** There is no consensus on whether obligation is objective or subjective. A theory can satisfy the desideratum by taking a firm stand on either side, provided it handles the "Mistaken Duty" case consistently. However, *ambiguity* here is fatal.

  **Incompatible Pair**
  *   **Strict Subjectivism about Obligation + Objective Supererogatory Status:** These two commitments cannot be jointly satisfied regarding Pressure Point 4.
      *   If a theory holds that obligation is *strictly subjective* (determined by the agent's beliefs), then an agent who believes an act is required *cannot* perform a supererogatory act by doing it. They are simply fulfilling their subjective duty.
      *   If a theory holds that supererogation requires *objective excess* (doing more than is actually required), it cannot accommodate the intuition that the agent in Pressure Point 4 acted supererogatorily *from their own perspective* without introducing a dual-track system (subjective duty vs. objective duty).
      *   **Result:** A theory must sacrifice either the purity of subjective obligation or the objectivity of the supererogatory classification in cases of mistaken belief.

  ***

  #### III. Scoring the Main Families of View

  The following scores indicate how well standard theoretical frameworks satisfy the specification above.

  **1. The Saint-and-Hero Model (Virtue-Based)**
  *   *Core Claim:* Supererogatory acts are those performed by agents of exceptional virtue.
  *   **Act-Agent Dissociation (1):** **Fail.** This model typically ties the act's status to the agent's character. It struggles to classify a "glory-seeking rescue" as supererogatory, often demoting it to merely permissible or morally neutral.
  *   **Collective Scalability (2):** **Fail.** Virtue is traditionally an individual property. This model lacks the resources to attribute supererogatory status to groups absent individual heroic virtue.
  *   **Contextual Sensitivity (3):** **Pass.** It handles cost well, as sacrifice is often central to the display of virtue.
  *   **Epistemic Neutrality (4):** **Mixed.** Often relies on the agent's intention, leaning subjectivist, which creates tension with objective moral facts.

  **2. The Tripartite Division (Deontic Logic)**
  *   *Core Claim:* Actions are partitioned into Forbidden, Obligatory, and Permissible, with Supererogatory as a valued subset of Permissible.
  *   **Act-Agent Dissociation (1):** **Pass.** This is the strength of the deontic model. It classifies the act based on rules/consequences, independent of the agent's motive.
  *   **Collective Scalability (2):** **Struggle.** Standard deontic logic applies to individual agents. Accommodating collective supererogation requires significant modification to the logic of obligation.
  *   **Contextual Sensitivity (3):** **Pass.** Easily accommodates shifting duties based on cost thresholds (e.g., "obligatory up to the point of significant sacrifice").
  *   **Epistemic Neutrality (4):** **Pass (with caveats).** Can accommodate both objective and subjective tracks, though it must explicitly choose which track defines the supererogatory status.

  **3. The Skeptical Claim (Incoherence/Reductionism)**
  *   *Core Claim:* The category is illusory; all actions are either obligatory or forbidden (e.g., Act Utilitarianism) or the distinction is linguistically confused.
  *   **Act-Agent Dissociation (1):** **Rejects.** Denies the data. Claims that if an act is best, it is obligatory; if not, it is not morally significant in a way that generates a distinct category.
  *   **Collective Scalability (2):** **Rejects.** Reduces group action to individual maximization.
  *   **Contextual Sensitivity (3):** **Rejects/Reduces.** Typically argues that cost is already factored into the calculation of the *one* right action, leaving no remainder for "beyond duty."
  *   **Epistemic Neutrality (4):** **Rejects.** Usually posits a single objective standard (e.g., utility) against which all acts are measured as pass/fail.

  ### Summary of the Landscape
  The **Tripartite Division** offers the best fit for the non-negotiable desiderata (1 and 3), provided it accepts the complexity of collective agency. The **Saint-and-Hero Model** captures the spirit of the acts but fails the logical specification regarding motive. The **Skeptical Claim** avoids the complexity by denying the phenomenon exists, thereby satisfying none of the desiderata but avoiding the contradictions they generate. The primary tension remaining for any proponent of supererogation is resolving the conflict between **Objective Status** and **Subjective Belief** (Desideratum 4) without rendering the category inaccessible to the acting agent.
