      *   *Refinement on G-S and FPTP:* FPTP is often modelled as a scoring rule or positional rule. G-S specifically targets *ordinal* rules (ranking). FPTP asks for a single choice. However, Gibbard's later work (1973) generalises to all voting schemes. Strictly speaking, G-S (1975) is about ordinal rankings. FPTP can be viewed as a truncation of a ranking. It is safer to say FPTP is manipulable (Gibbard 1973) and often grouped with G-S in informal discourse, but strict G-S (Satterthwaite 1975) is about social welfare functions/ordinal rules. I should be precise here. AV is definitely ordinal. FPTP is technically a plurality rule. Gibbard's 1973 theorem covers *all* deterministic voting rules. The prompt specifically references Gibbard-Satterthwaite (ordinal). I must clarify that AV falls squarely under Satterthwaite, while FPTP falls under Gibbard's broader impossibility. I will stick to the prompt's framing but ensure accuracy: G-S is the standard gloss for "all rules are manipulable." I will treat FPTP as susceptible to the same logic of impossibility even if the technical input differs.
      *   *Refinement on Binary Referendum:* A binary choice is strategy-proof *if* we ignore the paradox of voting/abstention. G-S assumes voters must vote. In a referendum, abstention is an option. However, for the purpose of the theorem's "2 outcomes" clause, simple majority is the exception. I will focus on the 2-outcome exception.

  7.  **Final Review against Constraints:**
      *   British English? Yes.
