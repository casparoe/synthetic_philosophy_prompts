          3.  The Referendum itself was binary. How does the 2-outcome escape clause affect the Yes side's claim?
          4.  What does the episode show about the theorem's practical bite or mis-selling?
      *   **Constraints:** British English, stay disciplined (admit where the theorem is silent), do not look up external facts (use provided facts).

  2.  **Deconstruct Question 1: AV's Promise vs. G-S & FPTP:**
      *   *Yes Claim:* AV ends tactical voting (vote genuine first preference).
      *   *G-S Theorem:* Any non-dictatorial ordinal rule with $\ge$ 3 outcomes is manipulable.
      *   *Analysis:* AV is an ordinal rule. In a typical election, there are $\ge$ 3 candidates. Therefore, G-S applies. AV is manipulable.
      *   *Conclusion:* The Yes claim that AV *ends* tactical voting is theoretically false under G-S. It might *reduce* it compared to FPTP in some contexts, but it cannot eliminate it.
      *   *FPTP:* FPTP is a cardinal/ordinal hybrid (effectively ordinal ranking of 1 vs 0). It has $\ge$ 3 outcomes (Candidate A wins, B wins, C wins). It is non-dictatorial. Therefore, G-S applies to FPTP too. FPTP is notoriously manipulable (tactical voting is rife).
      *   *Nuance:* G-S proves existence of *some* profile where manipulation works. It doesn't prove manipulation is *easy* or *frequent*. So AV might be *less* manipulable in practice, even if not *immune*.
      *   *Discipline:* Acknowledge G-S proves manipulability exists, not that it dominates every election.

  3.  **Deconstruct Question 2: What G-S Does Not Say (Scope & Domain):**
      *   *Extent:* G-S doesn't quantify manipulation. It doesn't say "50% of elections will be manipulated." It just says "not 0%."
      *   *Strategies:* G-S doesn't specify *how* to manipulate.
          *   FPTP: Usually "compromise" (vote 2nd choice to stop 3rd choice).
          *   AV: Allows "burying" (ranking strong rival last) or complex truncation. The No campaign's claim ("elect least popular") hints at non-monotonicity or specific AV pathologies, which are distinct from but related to manipulability.
      *   *Domain Restrictions:* G-S assumes unrestricted domain (any preference order possible).
