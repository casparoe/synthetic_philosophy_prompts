      *   **Theorem Understanding:** Ordinal rules, $\ge$ 3 outcomes, non-dictatorial $\rightarrow$ manipulable. Often glossed as "no rule escapes strategic voting."
      *   **Task:** A "disciplined two-way analysis."
      *   **Specific Questions to Address:**
          1.  Does G-S entail AV couldn't deliver the promise? What does it say about FPTP?
