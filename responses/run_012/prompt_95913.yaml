  I was explaining the misrepresentation clause to my wife over dinner—the bit where Higher-Order Theory says I can have a conscious experience of pain even if the first-order nerve state isn't firing, because the consciousness just *is* the higher-order representation. She asked if that applied to moods, specifically my apparent frustration with the washing machine. I told her, "Technically, I might not be frustrated at all. I might just have a higher-order thought representing me as frustrated, while the first-order state is missing." She stared at me and said, "Well, fix the higher-order thought then." I said, "I can't. By definition, the higher-order thought itself is unconscious; if I could access it directly, it would need a third-order thought to make *it* conscious." She asked, "So you're telling me your conscious life is generated by a state you can't touch, which might be lying about what you feel, and you can't correct it because checking the work requires an infinite chain of new thoughts?" I shrugged and said, "Exactly. So I'd love to adjust the representation, but I'm not prepared to fund an infinite regress before dessert."
