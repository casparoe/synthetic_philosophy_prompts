      *   *Critique:* Since the premise (it's about greed) is wrong, the first fix (be nicer) doesn't work. The second fix (Singleton) is logically consistent with the *actual* theory (you need to change the incentive structure), but it's usually presented as a high-risk solution, not a clean "fix."
