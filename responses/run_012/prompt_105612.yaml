      *   *Necessity/Record:* Cost-benefit analysis. Minimizing the cost of transition (from war to peace). Investing in public goods (historical record) to prevent future deviation.
      *   *Tokyo Dissent:* Jurisdiction as a constraint on the mechanism designer. If the designer lacks standing, the equilibrium is unstable.
      *   *Procedural Fairness vs. Substantive Law:* Distinguish between the *rules of the game* (substantive) and the *refereeing* (procedural).

  4.  **Drafting the Translation Section:**
