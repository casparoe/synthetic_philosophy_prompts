answer: |-
  This is a translation problem between two distinct formal systems: International Legal Theory (deontic logic, sovereignty, precedent) and Mechanism Design (incentives, constraints, equilibrium selection). Your frustration stems from the fact that your brother-in-law (BIL) is arguing about *legitimacy* and *validity*, while you are instinctively modeling *stability* and *efficiency*.

  Here is the mapping of the Nuremberg/Tokyo debate into your vocabulary, followed by the residue report on what gets lost in translation, and finally, the specific disentanglement of procedure versus substance that you requested.

  ### Part I: The Translation Map

  **1. The *Ex Post Facto* Objection**
  *   **Legal Claim:** You cannot punish an act that was not criminal when committed.
  *   **Mechanism Design Translation:** **Time Inconsistency / Lack of Credible Commitment.**
      The Allies acted as a mechanism designer who revealed the constraint set *after* the agents (Axis powers) had already chosen their strategies. This violates the requirement for a rule to be a **commitment device**. If the payoff matrix is modified ex post to penalize a strategy that was optimal ex ante given the previous rules, the "rule of law" loses its value as a coordination signal. Future agents cannot optimize behavior because the objective function is endogenous to the outcome. It renders the mechanism **not renegotiation-proof**; the winners renegotiated the contract after the game concluded to extract surplus (punishment) from the losers.

  **2. The "Victors' Justice" Charge**
  *   **Legal Claim:** The tribunal was biased because it was composed solely of the winning coalition, judging the losers by rules the winners wrote.
  *   **Mechanism Design Translation:** **Principal-Agent Problem / Lack of Independent Verification.**
      The enforcer (Allies) is also the beneficiary of the enforcement (reparations, geopolitical dominance). There is no third-party verifier. In contract theory, this is a **biased auditor**. If the agent who writes the contract also holds the gavel, the mechanism is not **incentive compatible** for truth-telling regarding the facts. The selection of defendants is also non-random (selection bias); losing is the primary predictor of being tried. This undermines the equilibrium stability because future players know the "law" is actually a function of $P(Win)$.

  **3. The *Tu Quoque* Reply (You Did It Too)**
  *   **Legal Claim:** The Allies committed similar acts (Dresden, Soviet invasion of Poland), so they lack standing to judge.
  *   **Mechanism Design Translation:** **Symmetry of Constraints / Failure of Self-Enforcement.**
      For a norm to be a stable equilibrium, it must be **incentive compatible** for all players, including the enforcer. If the constraint binds only the loser but not the winner, it is not a universal rule; it is a weapon. In repeated games, a strategy is sustainable only if it is subgame perfect for all players. By violating the norm themselves, the Allies signaled that the norm was not a **focal point** for coordination but a tool for expropriation. This destroys the reputational capital required for the mechanism to function in future periods.

  **4. Defense: Aggression Was Already Unlawful (Kellogg-Briand)**
  *   **Legal Claim:** The Pact of Paris (1928) renounced war; customary law already prohibited atrocities.
  *   **Mechanism Design Translation:** **Schelling Points / Informal Contracts.**
      The argument is that a written charter wasn't necessary because a **focal point** already existed in the common knowledge of the players. The Kellogg-Briand Pact served as a signal that the strategy "Aggressive War" was off the equilibrium path. The Nuremberg Charter was merely formalizing an existing **implicit contract**. The violation was not of a new statute, but of a pre-existing coordination equilibrium that the defendants knowingly deviated from.

  **5. Defense: The Alternative Was Summary Execution**
  *   **Legal Claim:** Without trials, the losers would have been killed without process (Morgenthau Plan). Trials were the lesser evil.
  *   **Mechanism Design Translation:** **Constrained Optimization / Second-Best Solution.**
      Given the constraint set of the post-war environment (public demand for retribution, risk of insurgency), the trials were the **ex post optimal** mechanism to minimize transition costs. Summary execution is a high-cost equilibrium (martyrdom, instability). A trial, even with flawed jurisdiction, creates a public record (information production) and lowers the cost of the transition to peace. It is a **Pareto improvement** relative to the counterfactual of pure vengeance, even if it is not first-best relative to a hypothetical perfect pre-war court.

  **6. The Tokyo Dissent (Justice Pal)**
  *   **Legal Claim:** The tribunal had no jurisdiction; international law does not bind individuals, only states. Also, colonial powers cannot judge anti-colonial acts.
  *   **Mechanism Design Translation:** **Lack of Standing / Invalid Mechanism Designer.**
      Pal argued that the mechanism designer (the Allies) lacked the authority to bind the agents (individual defendants) directly. In legal terms, states are the principals; individuals are agents. You cannot punish the agent without punishing the principal. Furthermore, regarding colonialism: if the designer is a player with a conflicting interest (colonial holder), they lack **standing** to enforce rules against anti-colonial strategies. The entire mechanism is void *ab initio* because the designer had no jurisdiction to alter the payoff structure for individuals.

  ***

  ### Part II: The Procedural vs. Substantive Split

  You mentioned your BIL collapses these two. In your vocabulary, this is a category error between **Implementation** and **Objective Function**.

  *   **Substantive Validity (The Law):** Was the objective function defined correctly *ex ante*? Did the rule exist before the move? This is the *Ex Post Facto* and *Victors' Justice* argument.
      *   *Economic Equivalent:* Is the contract valid? Was the constraint set known before the agents moved?
  *   **Procedural Fairness (The Trial):** Was the algorithm run correctly? Was evidence admitted properly? Was counsel effective?
      *   *Economic Equivalent:* Is the implementation mechanism noise-free? Did the auditor follow the protocol?

  **The Collapse:** Your BIL argues that because the *Substantive* law was flawed (ex post facto), the *Procedure* was inherently unfair.
  **The Correction:** You can have a valid contract enforced by a corrupt auditor (Substantive Yes, Procedural No). You can also have a void contract enforced by a perfect auditor (Substantive No, Procedural Yes). Nuremberg was likely **Substantively Flawed** (ex post law) but **Procedurally Robust** (by 1945 standards, defendants had counsel, could cross-examine, some were acquitted).
  **Why the collapse matters:** If he conflates them, he avoids admitting that the Nazis got a fairer hearing than they gave their victims. He needs the procedural failure to validate the substantive objection. In game theory terms, he is arguing that a Nash Equilibrium cannot exist if the payoff matrix was rigged, ignoring that the *play* of the game might still have been by the book.

  ***

  ### Part III: The Residue Report

  Here is what happens when you force legal/moral claims into a mechanism design framework. Some fit; some break the model.

  **1. Residue: "It was wrong regardless of the rules." (Natural Law)**
  *   **The Claim:** Certain acts are malum in se. The ex post facto objection matters even if the acts were "evil."
  *   **The Translation:** This implies **Lexicographic Preferences**. The utility function has a hard constraint that cannot be traded off against efficiency.
  *   **Verdict:** **Your framework is missing something real.** Standard mechanism design assumes consequentialism (outcomes determine value). It struggles with deontology (process/rules determine value). If agents derive negative utility from *violating a norm* even when the violation increases total welfare (e.g., punishing a villain retroactively), that is a preference parameter standard models often set to zero. You can model it as a "rule-following" type, but the *force* of the moral claim is that the preference shouldn't be optional.
  *   **Dinner Table Move:** Acknowledge that your model treats "legitimacy" as an input to utility, whereas he treats it as a constraint on the system itself.

  **2. Residue: "The Court speaks for Humanity, not the Winners."**
  *   **The Claim:** The tribunal claimed to represent a universal principal ("Humanity"), but was actually an agent of a specific coalition (Allies).
  *   **The Translation:** **Misidentified Principal.** The agents (Judges) claimed to represent Principal A (Humanity), but were paid/appointed by Principal B (US/UK/USSR). This is a classic agency slack problem.
  *   **Verdict:** **The original claim is doing less work than it sounds.** In mechanism design, "Humanity" is not a coherent principal; it has no utility function and cannot fire the agent. It is a rhetorical device to lower enforcement costs (making the verdict harder to contest). Your framework captures this better than his: it exposes "Humanity" as a fiction used to stabilize the equilibrium. The claim relies on a mystical collective agent that doesn't exist in rational choice models.
  *   **Dinner Table Move:** Point out that "Humanity" cannot sign contracts. Only coalitions can. The trial was a coalition enforcement mechanism masquerading as a universal one to reduce future enforcement costs.

  **3. Residue: "Condemnation vs. Punishment."**
  *   **The Claim:** There is a difference between saying "this was bad" (historical record) and "we will jail you" (sanction).
  *   **The Translation:** **Signaling vs. Sanctioning.** Condemnation is cheap talk or reputation updating. Punishment is a transfer of utility (liberty/life).
  *   **Verdict:** **Your framework handles this well, but he ignores the cost.** The "Record" defense is an argument for **Information Production**. A trial generates public information about the nature of the regime. Punishment is the cost of generating that information. The residue is his belief that *only* a valid court can produce legitimate condemnation. You would argue any observer can update beliefs; he argues only a legitimate mechanism can certify truth.
  *   **Dinner Table Move:** Argue that the "Record" is a public good. The question is whether the cost of producing it (retroactive punishment) exceeded the benefit.

  **4. Residue: The "Sense of Injustice" (The Vibe)**
  *   **The Claim:** Even if technically defensible, it feels like a show trial.
  *   **The Translation:** **Perceived Legitimacy / Common Knowledge.** For a mechanism to be stable, it must be *common knowledge* that it is fair. If the public believes it is victors' justice, the equilibrium is fragile.
  *   **Verdict:** **Your framework captures this as "Beliefs," but misses the "Normative Weight."** You model legitimacy as a probability of compliance. He models it as a moral absolute. However, functionally, they are similar: if legitimacy drops below a threshold, the mechanism collapses (renegotiation/revolution).
  *   **Dinner Table Move:** Concede that the *perception* of time inconsistency creates long-term instability in international law, which validates his worry even if your model treats it as just another parameter.

  ### Summary for the Next Dinner

  1.  **Stop him from conflating Procedure and Substance.** Ask him: "If the Nazis had signed the Kellogg-Briand pact as a binding contract with a penalty clause *ex ante*, would you still object to the trial?" If yes, he objects to the *enforcer* (Victors' Justice). If no, he objects to the *law* (Ex Post Facto). Force him to pick which constraint is binding.
  2.  **The "Humanity" Point:** Remind him that in mechanism design, a principal that cannot fire its agent is a fiction. The tribunal was an Allied enforcement mechanism. Admitting that doesn't necessarily invalidate the outcome, but it clarifies the incentive structure.
  3.  **The Residue:** Admit that your framework treats "justice" as a stability condition, while he treats it as a moral absolute. You are arguing about whether the system works; he is arguing about whether the system is *good*. These are different objective functions.

  **Final Verdict on the Residue:** Your framework is not missing "reality," but it is missing **Deontic Constraints**. You model rules as tools to maximize welfare. He models rules as boundaries that cannot be crossed even to maximize welfare. When he says "It was wrong," he means "It violated a boundary condition." When you hear "It was wrong," you hear "It produced a suboptimal equilibrium." That is the untranslatable gap.
