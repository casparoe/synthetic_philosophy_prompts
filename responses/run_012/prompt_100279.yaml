prompt: |-
  I'm a journalist who writes long features about science and ideas -- history of science, philosophy, that kind of beat -- and an editor has just handed me the assignment I've been ducking for years: 8,000 words on who started the First World War. The hook is that the Fischer fight never actually died; Griff nach der Weltmacht (1961) still gets re-litigated every few years, and the question of what it even means to blame a nation feels more alive to me now than it did in the sixties. There's a podcast episode attached too, so call it three hours of a reader's attention, total. Not infinite.

  What I don't want is the standard tour: Fischer says Germany, the West German establishment says everybody, Christopher Clark's Sleepwalkers says nobody was really steering, and we're all very sophisticated now. I can write that in my sleep. What I want from you is an agenda: which of the open questions in this mess are actually worth my airtime, ranked, and defended. Whats the criteria, whats upstream of whats, whats tractable for a generalist with a library card, and what would move something up or down the list.

  Things I've already got on my list, so you can see the granularity I'm after. Feel free to tell me some of them are dead ends:

  - The September Programme: Riezler's memo of 9 September 1914, which Fischer treated as the smoking gun of premeditated annexationism and which a lot of later historians treat as a discussion document the government never actually adopted. How much can legitimately turn on one document?
  - The December 1912 war council: Fischer and Röhl read it as a decision to prepare for war, others (Strachan, for one) read it as the Kaiser sounding off in front of his generals. Is that a live dispute or a settled one?
  - Article 231, the clause everyone calls the war-guilt clause, which -- if you actually read it -- never uses the word guilt. Here it is: "The Allied and Associated Governments affirm and Germany accepts the responsibility of Germany and her allies for causing all the loss and damage to which the Allied and Associated Governments and their nationals have been subjected as a consequence of the war imposed upon them by the aggression of Germany and her allies." So legal responsibility and moral accusation come apart at the seam. Does that distinction do real work for a general reader, or is it a gotcha?
  - The collective-responsibility puzzle: can a nation be the bearer of blame at all, or only leaders, elites, structures, voters? The old problem of a decision that comes out of a room -- everyones hands on it, nobodys prints on it.
  - The meta-question: is there any conceivable evidence that would settle this, or is the persistence of the argument itself the story?

  And on the implications side, tell me which of these actually follow from any verdict and which are just mood music: reparations and the memory of Versailles; the way the war-guilt charge functioned in Weimar politics; and the present-day habit of reaching for 1914 whenever someone wants to assign blame for a war now. If I've got any of those backwards, say so.

  Rank them. Give me the two or three I should spend the words on, the ones that are traps that will eat the piece and pay off nothing, and what would change the ordering.

  One more thing, and I mean it: if the premise is off -- if working historians have basically stopped asking "who's to blame" and I'd be making an hour of television about a question my own sources think is malformed, or if I'm wrong that Fischer is still the spine of the thing -- then say that plainly instead of humoring the brief. Don't pad the list to make the field look more contested than it is, and flag anywhere the confident tone of the debate outruns the evidence. Also if your not sure about a specific claim, mark it rather than asserting it.

  Last line of the response, please: \answer{1) ...; 2) ...; 3) ...} with the top three as short phrases, best first.
