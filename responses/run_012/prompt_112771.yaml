  Regarding the discrete objection: If states were binary (like a switch), the sorites chain breaks. Proponents argue noise-free digital states allow perfect discrimination, removing the "hair's breadth" problem. However, this objection fails. First, phenomenal states are not digital; experience admits of degrees (faintly cold vs. very cold). Mapping discrete neural states to vague experience reintroduces the margin for error. The chemistry analogy holds: even if the molecule is present, detection limits impose noise. Second, Williamson's core point is about reliability, not just gradualism. Even with discrete underlying states, if error margins exist, one cannot reliably distinguish state A from not-A. The cognitive limitation remains. Knowledge requires safety across nearby possible worlds. Whether the change is gradual or discrete, if the subject cannot discriminate the state from a non-state due to noise or vagueness, safety fails. Therefore, the objection does not save luminosity; the anti-luminosity conclusion holds because knowledge requires reliability which indiscriminability undermines. The discrete objection mistakes the metaphysics of the state for the epistemology of the access.

