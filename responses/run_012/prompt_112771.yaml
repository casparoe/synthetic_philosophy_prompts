prompt: |-
  Hi — bit of an odd request. I spent 35 years as an analytical chemist before I retired, and for the last few years I've been doing a part-time philosophy degree. Somehow I've ended up as the TA for our upper-level epistemology seminar, and the prof has asked me to draft one of the final exam questions. I'll be honest, I'm nervious about it, because I want it to actually test understanding rather than reward people for having memorized the labels.

  Here's what I'm after. An essay question (they get 50 minutes) on Williamson's anti-luminosity argument. I don't want something they can answer by saying "Williamson shows no mental state is luminous" and then padding. I want them to actually reconstruct how the argument runs, and to spell out precisely why it takes down the KK principle — that if you know something you know that you know it.

  And I want a twist in there, because of my own background. In the lab we lived with measurement error: you can never tell two readings apart if they differ by less than the noise. It looks to me like the argument leans on being able to line up a long series of cases that differ so slightly you can't tell them apart — like turning a dial by a hair. So I want the question to make them confront this: if a condition only ever shows up in clearly seperate, discrete states — on/off, black/white, nothing in between — does the argument still go through, or does the chain of "too similar to tell apart" cases break? I want them to take a side on whether that objection lands.

  So: write the exam question, a model answer of no more than 400 words, and a marking scheme out of 20 that names the specific moves a top answer has to make and the specific mistakes that should cost marks. Keep the whole thing under 800 words — that's a hard limit. Thanks!
