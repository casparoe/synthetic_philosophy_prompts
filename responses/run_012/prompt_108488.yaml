prompt: |-
  Write a dialogue between two co-founders of a hardware startup that's 18 months in and still hasnt got a working prototype. One of them keeps pushing the outside view: if you want to know how this ends, ignore your gut about *our* situation and look at the base rate for companies at this stage with this much runway left. The other thinks that's just a fancy way of refusing to think -- the base rate is an average over companies that aren't ours, and the whole reason we know anything is that we know the details of this particular case. Don't make either of them a strawman, and have them actually go at each other's points instead of talking past each other. In particular I want them to fight about the reference class: our company belongs to a lot of reference classes and they'll hand you very different base rates, so who gets to pick, and on what grounds that isn't just picking the answer you already wanted? And if the outside view is supposed to be the humble one, what happens when you point it at itself -- choosing a reference class is itself an inside judgment, and the evidence that base rates beat expert intuition comes mostly from cases where the expert intuition was overconfident. Let them land somewhere, even if it's just a sharper statement of what they still disagree about.
reasoning: |-
  Here's a thinking process that leads to the dialogue:

  1.  **Analyze the Request:**
      *   **Characters:** Two co-founders of a hardware startup (18 months in, no working prototype).
      *   **Conflict:** Outside View (Base Rates/Statistics) vs. Inside View (Specific Details/Intuition).
      *   **Key Arguments to Include:**
          *   Outside View (OV) Proponent: Ignore gut, look at base rates for companies at this stage/runway.
          *   Inside View (IV) Proponent: Base rates are averages of *other* companies; we know *our* details.
          *   Crucial Debate Point: Reference Class Problem (We belong to many classes; picking one is subjective/inside judgment).
          *   Crucial Debate Point: Meta-Critique of OV (OV claims humility, but choosing the reference class is an arrogant act; OV data is biased towards overconfident experts).
      *   **Tone:** Intellectual, heated but respectful, no strawmen, genuine engagement.
      *   **Ending:** They need to land somewhere (even if it's just clarifying the disagreement).

  2.  **Character Conception:**
      *   **Alex (Outside View):** Pragmatic, risk-averse, perhaps ex-finance or consulting. Worried about runway, investors, and the harsh reality of hardware. Wants to pivot or cut losses.
      *   **Jamie (Inside View):** Technical, visionary, deeply embedded in the engineering challenges. Believes the breakthrough is imminent. Sees the stats as irrelevant to their specific technical path.
      *   *Correction:* To make it more interesting, maybe Alex is the CEO (business side) and Jamie is the CTO (tech side), but both are smart enough to know the philosophy behind their positions. Let's make sure neither is purely emotional. Alex isn't just "scared," Jamie isn't just "dreamy."

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Late night, office, whiteboard. The immediate pressure (runway, investor meeting).
      *   **The Spark:** Alex brings up the stats. 18 months, no prototype.
      *   **The Inside View Defense:** Jamie argues why *this* time is different (technical hurdles cleared).
      *   **The Reference Class Attack (The Core):** Jamie points out that Alex is cherry-picking the class ("failed hardware startups") vs. ("deep tech moonshots").
      *   **The Meta-Critique:** Alex defends the OV. Jamie counters that *choosing* the class is an inside view judgment.
      *   **The Bias Point:** Jamie notes that OV studies punish overconfidence, but maybe they aren't overconfident, just informed.
      *   **Resolution:** They agree on a process. Not a solution, but a way to decide.

  4.  **Refining the Dialogue (Iterative Process):**

      *   *Initial thought:* Alex says "90% fail." Jamie says "We are special."
      *   *Correction:* Too cliché. Alex needs to invoke Kahneman/Lovallo. Jamie needs to invoke the specific engineering constraints.
      *   *Focus on the Reference Class:* This is the prompt's specific requirement.
      *   *Alex:* "The class is 'hardware startups with 6 months runway and no alpha prototype.'"
      *   *Jamie:* "No, the class is 'thermal battery tech attempting grid storage.' The failure rate there is different."
      *   *Alex:* "Why that one? Because it has a higher success rate?"
      *   *Jamie:* "Because it's the relevant technology!"
      *   *Alex:* "That's the inside view talking. You're defining the class by the success criteria."

      *   *Focus on the Meta-Critique:*
      *   *Jamie:* "The Outside View claims humility. But picking the reference class is an act of arrogance. You're saying your categorization is objective."
      *   *Alex:* "It's not objective, it's conservative."
      *   *Jamie:* "Conservative is a value judgment."

      *   *Landing:* They can't solve the startup problem in a dialogue. They need to solve the *decision* problem. Maybe they agree to a "pre-mortem" or a specific milestone check.

  5.  **Writing - Scene Setting & Voice:**
      *   Keep sentences punchy.
      *   Use silence and action beats to show tension.
      *   Ensure technical jargon sounds plausible (thermal dynamics, supply chain, runway).

  6.  **Self-Correction during drafting:**
      *   *Check:* Did I make Alex a strawman coward? *Fix:* Make sure Alex emphasizes *resource allocation* and *fiduciary duty*, not just fear.
      *   *Check:* Did I make Jamie a strawman dreamer? *Fix:* Give Jamie concrete evidence of progress (the latest test data) so their optimism is grounded, not magical.
      *   *Check:* Did I hit the "OV on itself" point? *Need to ensure Jamie explicitly argues that the selection of the reference class is itself an intuitive judgment.*

  7.  **Final Polish:**
      *   Check the rhythm.
      *   Ensure the ending feels earned.
      *   Verify the prompt's specific philosophical constraints are met (Reference class selection, humility paradox).

  **(Self-Correction Note):** Make sure the ending isn't too neat. They shouldn't suddenly agree on the future of the company. They should agree on *how to argue* about it.

  8.  **Final Review against constraints:**
      *   18 months in? Yes.
      *   No working prototype? Yes.
      *   Outside View vs Inside View? Yes.
      *   Reference Class argument? Yes.
      *   Meta-critique of OV? Yes.
      *   No strawmen? Yes.
      *   Landing? Yes.

