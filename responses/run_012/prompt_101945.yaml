answer: |-
  The Stranger flipped a coin behind his back. "One of you faces Counterfactual Mugging," he announced. "The other, XOR Blackmail. You don't know which. Give me $100 or walk."

  The Causal Decision Theorist crossed his arms. "I analyze causal gradients. Your demand cannot causally affect the coin flip already made. Nor does my payment alter the blackmail condition independently of your intent. Refusing is the dominant strategy." He kept his wallet shut.

  The Evidential Decision Theorist sweated. "But if I pay, it's strong evidence you're the type who rewards compliance or doesn't release the scandal. Conditional on paying, my expected utility rises." He handed over the bill.

  "CDT, you were in the Mugging," the Stranger revealed. "The coin landed tails. I would have given you $10,000 had it landed heads, but only if I predicted you'd pay now. Your refusal signals you wouldn't pay in the counterfactual branch. You ignore subjunctive links."

  "Rationality requires causal leverage," CDT muttered.

  "And EDT, you were in the Blackmail. I have the scandal regardless. Paying doesn't cause me to withhold it; it merely indicates you're the type I targeted. You treat correlation as causation."

  "But paying was evidence of safety!" EDT cried.

  "Exactly," said the Stranger. "You both applied your theories perfectly. CDT refused where he should have paid. EDT paid where he should have refused. You both got the right answer for the wrong problem."

  They stood in silence, perfectly justified losses.
