answer: |-
  There is no single, canonical Latin name for this specific maneuver in the standard taxonomy of fallacies (like *ad hominem* or *straw man*). However, your description is precise enough that it can be located at the intersection of three existing concepts: the **Motte-and-Bailey fallacy** (structural), **Thick Ethical Concepts** (semantic), and **Persuasive Definition** (rhetorical).

  Because none of these fully captures the *dynamic shifting* of the premise's logical status as you describe it, I will offer the existing nearest neighbors for context, and then coin a term that carves out the specific phenomenon you have identified.

  ### The Nearest Existing Concepts

  1.  **The Motte-and-Bailey Fallacy:** Structurally, this is the closest fit. In a Motte-and-Bailey, an arguer advances a controversial claim (the Bailey) but retreats to a trivially defensible claim (the Motte) when challenged. In your scenario, the normative claim ("You ought not run the railway this way") is the Bailey, and the factual prediction ("The railway will fail") is the Motte. The difference is that in the classic Motte-and-Bailey, these are usually two distinct statements. In your case, they are *one statement* that changes its skin.
  2.  **Thick Ethical Concepts:** Philosophers like Bernard Williams and Hilary Putnam discuss concepts (e.g., "cruel," "brave," "generous") that are both descriptive and evaluative simultaneously. Your examples ("family," "community," "railway") function similarly. However, Thick Concepts are usually treated as a feature of language, not necessarily a fallacious *move*. Your observation identifies the *exploitation* of this feature.
  3.  **Persuasive Definition:** Coined by C.L. Stevenson, this occurs when a speaker alters the descriptive meaning of a term while retaining its emotive force. When someone says, "That is not how a family works," they are often offering a persuasive definition of "family" that smuggles in a norm.

  ### The Coinage: "The Fact-Value Slide"

  Since the existing terms describe the *components* but not the *kinetic maneuver*, I propose calling this **The Fact-Value Slide** (or alternatively, **The Normative-Descriptive Slide**).

  #### Definition
  **The Fact-Value Slide** is an argumentative maneuver in which a premise is asserted that is ambiguous between a descriptive claim (a prediction of fact) and a normative claim (a rule of conduct). The speaker exploits this ambiguity to evade the burden of proof: when challenged on the normativity, the premise is defended as a hard fact; when challenged on the facts, or when drawing a conclusion, the premise is treated as a binding norm.

  #### The Carving: Boundaries and Distinctions

  To distinguish **The Fact-Value Slide** from related phenomena, we must mark its edges carefully.

  **1. What it is not: The Naturalistic Fallacy**
  *   **The Naturalistic Fallacy** (in the strict G.E. Moore sense) involves defining a moral term (like "good") entirely in natural terms. In the broader Humean sense, it is deriving an "ought" directly from a pure "is."
  *   **The Distinction:** In the Fact-Value Slide, the premise is *not* a pure "is." It is a hybrid claim that refuses to settle. The fallacy lies not in the derivation (moving from is to ought) but in the *instability of the bridge itself*. The speaker never commits to the premise being an "is" until pressed.

  **2. What it is not: Ordinary Equivocation**
  *   **Ordinary Equivocation** relies on a word having two distinct lexical meanings (e.g., "bank" of a river vs. "bank" for money).
  *   **The Distinction:** The Fact-Value Slide does not rely on lexical ambiguity. The words "run," "railway," or "family" do not change their dictionary definitions. Instead, the *illocutionary force* of the sentence shifts. It is a shift in logical type (from constative to regulative), not semantic sense.

  **3. What it is not: Genuine Thick Concepts**
  *   **Thick Concepts** are words where fact and value are entangled by the nature of the concept (e.g., "murder" implies both "killing" and "wrongful").
  *   **The Distinction:** Using a thick concept is not fallacious. The Fact-Value Slide becomes fallacious when the speaker *strategically decouples* the two aspects to suit the argumentative moment. If the speaker believes the fact and value are inseparable, they are using a thick concept. If they treat them as separable to evade critique, they are sliding.

  #### The Test: How to Detect the Slide

  To determine if a premise is a legitimate Thick Concept or an exploitative Fact-Value Slide, apply the **Commitment Test** (or Decoupling Test).

  Press the speaker to commit to one reading of the premise in isolation from the other.

  *   **The Factual Commitment:** Ask, "If we could prove that this railway *would* succeed financially and logistically under this management, would you withdraw your objection?"
      *   *If Yes:* The premise was functioning as a factual prediction. The argument stands or falls on empirical evidence.
      *   *If No:* The premise was functioning as a norm. The "fact" was camouflage.
  *   **The Normative Commitment:** Ask, "Are you saying this is morally wrong even if it keeps the community together?"
      *   *If Yes:* The premise is a pure norm. The "fact" about the community was rhetorical flourish.
      *   *If No:* The premise is contingent on the outcome.

  **The Diagnosis:**
  *   **Legitimate Argument:** The speaker accepts the decoupling. ("If it worked, I'd support it, but the data says it won't.")
  *   **The Fact-Value Slide:** The speaker refuses to decouple. ("You can't even ask that question; if it falls apart, it proves it was wrong to try.") They restore the ambiguity to avoid falsification.

  ### Summary of the Phenomenon

  *   **Name:** The Fact-Value Slide.
  *   **Mechanism:** Strategic ambiguity regarding the logical type of a premise (descriptive vs. normative).
  *   **Purpose:** To immunize a claim against empirical falsification (by retreating to normativity) and against normative justification (by retreating to factuality).
  *   **Typical Contexts:** Institutional defenses ("That's not how we do things"), functionalist arguments ("A knife that doesn't cut is bad"), and social conservatism ("A society that does X won't survive").

  This move is particularly resilient because it exploits a genuine philosophical difficulty: the fact that, in human social life, facts and values are often deeply entangled (as Putnam argued). The fallacy occurs not in noting the entanglement, but in weaponizing the inability to distinguish them in order to win an argument.
