prompt: |-
  So I'm in this little reading group that's been slowly grinding through decision theory stuff — we did Newcomb and the smoking lesion a while back, and now we've drifted into acausal trade and "surrogate goals", the idea that you might adopt a goal that isn't really your goal just so that other agents reasoning about your source code will predict you'll do certain things, and then you "throw the surrogate goal overboard" once you've gotten what you wanted. Anyway one of the guys, Dan, keeps saying "a threat is just a prediction" whenever anyone raises the worry that acausal threats are a kind of coercion — like, you threaten some simulation of you by pointing out that your algorithim, running elsewhere, will punish copies of them, and Dan says no no, that's not a threat, it's just a prediction about what my algorithm does, you're not being threatened you're being informed, so the whole moral objection is just confused. I don't buy it but I can't pin down where it goes wrong.

  Can you lay out all the different precise things "a threat is just a prediction" could be claiming — starting from the boring reading where it's true of any threat at all (when I say "do X or I'll do Y" I'm predicting my own conditional behavior), through the ones where it's specifically about the acausal case and the threat is a fact about my algorithm that I don't get to choose, up to the really strong reading where it means there's no threat at all, only information, so nothing coercive is happening. For each reading I want to know whether it's a platitude, whether it's substantive and actually defensible, or whether it's just a word game that relabels the threat and changes nothing — and crucially whether that reading actually gets Dan his conclusion, that the coercion objection dissapears. And while you're at it say something about the word "prediction" itself: predicted by whom, on what basis, and does it matter that in the acausal case the "prediction" isn't about anything I do in this instance at all, but about what my algorithm does across instances? Lay it out as a menu I can bring to the group, not one big verdict.
