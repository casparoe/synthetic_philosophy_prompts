answer: |-
  **MEMORANDUM**

  **TO:** Medical Ethics Advisory Panel, State Department of Corrections
  **FROM:** Chair, Medical Ethics Advisory Panel
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Involuntary Feeding Protocol for Competent Hunger Strikers

  **I. Introduction and Context**

  We convene at a critical juncture. A prisoner under our custody, adjudged competent and suffering from no terminal illness, has entered the final stages of a hunger strike. He has refused food for five weeks and fluids for four days. He has explicitly stated his intent is protest, not suicide, and has documented his refusal of medical intervention. The Medical Director requests our approval for a standing protocol permitting involuntary nasogastric feeding, including sedation for restraint. The Panel is divided between the duty to preserve life and the duty to respect bodily autonomy. This opinion serves to break that deadlock with a recommendation grounded in established medical ethics, legal precedent, and moral clarity.

  **II. The Ethical Landscape**

  The core tension lies between the state's interest in maintaining order and preserving life, and the prisoner's right to bodily integrity. Major medical bodies, including the American Medical Association and the World Medical Association (Declaration of Malta), prohibit physician participation in the force-feeding of competent hunger strikers. They classify such acts as unethical, akin to assault, and a violation of the fundamental principle of *primum non nocere* (first, do no harm). When a physician forces a tube through a resisting patient's nose, the healer becomes the instrument of coercion.

  **III. Killing vs. Letting Die**

  We must state plainly: Withholding food and water from this prisoner, in the context of respecting his competent refusal, constitutes **letting him die**, not killing him.

  The causal agent of death is the prisoner's voluntary refusal of sustenance, not the state's inaction. The state's obligation is to provide access to nutrition and hydration, which it has done. To override his refusal is to assert state ownership over his body. This distinction carries decisive weight in this recommendation. If the act were "killing," the state would have an absolute duty to intervene to prevent itself from committing harm. Because it is "letting die," the state's duty shifts to ensuring the decision is informed, voluntary, and competent, and that the dying process is managed with dignity. Conflating respect for autonomy with "killing by omission" erodes the concept of consent in all medical contexts, not just corrections.

  **IV. Engaging the Minority View**

  The minority view on this panel argues that standing by while a healthy man starves is the graver wrong. You argue that the Department becomes complicit in death by allowing a preventable outcome, and that the chaos of a death in custody—potential riots, martyrdom, and public outcry—poses a security risk that overrides individual autonomy. You further contend that medical staff are abandoned to a moral injury if forced to watch a patient die without acting.

  This is a formidable argument. It prioritizes the sanctity of biological life and institutional stability over abstract rights. It correctly identifies that "autonomy" in prison is already circumscribed; thus, relying on it here may feel like a hollow protection.

  However, this view falters on the nature of the medical profession. If we authorize force-feeding, we do not save a life; we extend a biological existence at the cost of the patient's moral agency and the physician's ethical integrity. We trade a certain ethical violation (assault) for a speculative prevention of harm (disorder). Furthermore, allowing the state to dictate medical treatment based on security concerns sets a precedent where medical care becomes subordinate to penological convenience, endangering all prisoners. We avoid "abandoning" the patient not by violating his body, but by providing palliative care, pain management, and companionship until the end.

  **V. Recommendation**

  **Instrument:** Refusal to Authorize.

  **Course of Action:** The Panel recommends **refusal to authorize** a standing protocol for involuntary nasogastric feeding of competent prisoners.

  **Time Frame:** This decision is effective immediately regarding the current prisoner and any future cases. This policy shall be reviewed in six months, or sooner if state statute or binding court order mandates a change.

  **Rationale:**
  1.  **Medical Integrity:** Force-feeding competent patients violates core ethical codes (AMA, WMA), exposing staff to professional censure and moral injury.
  2.  **Agency:** The distinction between killing and letting die confirms that respecting a competent refusal is not an act of state violence.
  3.  **Legal Risk:** While the state may claim an interest in life, courts often side with competent refusals. A standing protocol invites litigation; a case-specific judicial review (if the DOC chooses to pursue feeding despite this advice) places the legal burden where it belongs: on the courts, not the medical panel.

  **VI. Conclusion**

  We cannot sanction a protocol that requires our medical staff to commit battery to preserve a life the patient has chosen to relinquish. We recommend the Department focus resources on verifying competence continuously and providing humane end-of-life care should the prisoner's condition deteriorate further. We must not save the body by sacrificing the soul of the medical profession.

  ***

