answer: |-
  Here are the desiderata for a theory of conceivability-as-evidence, structured to stress-test the move before you deploy it.

  ### 1. The Water Test (The Necessary A Posteriori Constraint)
  **The Case:** You can easily conceive of a clear, drinkable liquid in a lake that isn't H₂O. It feels coherent. Yet, if water *is* H₂O, it is necessarily H₂O in all possible worlds.
  **The Requirement:** The theory must explain how a state of affairs can be *conceivable* (epistemically open) without being *possible* (metaphysically open). It cannot simply assert "conceivability entails possibility." It must provide a mechanism for filtering out cases where our concepts outstrip the nature of reality.
  **Why it matters:** If the theory fails here, it validates the false intuition that science discovers contingent facts when it actually discovers necessary ones.

  ### 2. The Mathematician Test (The Fallibility Constraint)
  **The Case:** A mathematician vividly pictures a geometric configuration that she claims proves a conjecture false. She feels the "click" of insight. Later, a formal proof shows the configuration is impossible.
  **The Requirement:** The theory must treat conceivability as *defeasible evidence*, not infallible access. It must specify the conditions under which an intuition is overridden by deduction or empirical discovery.
  **Why it matters:** If the theory treats imagination as a direct pipeline to modal truth, it makes error impossible. A theory that cannot account for being wrong is not a theory of evidence; it's a theory of revelation.

  ### 3. The Family Test (The Cultural Contingency Constraint)
  **The Case:** A person grows up in a culture where a specific family arrangement (e.g., communal child-rearing, same-sex parenting) is "unthinkable." Later, they move to a new context and find it easy to picture.
  **The Requirement:** The theory must decide whether this shift evidences a change in *what is possible* or merely a change in *psychological access*. It must distinguish between expanding the boundaries of modal space versus expanding the boundaries of one's own cognitive horizon.
  **Why it matters:** If the theory says the shift changes what is possible, it leads to modal relativism (truth changes with geography). If it says it changes only the person, it must explain why the philosopher's own "unthinkable" intuitions aren't just local biases. **If the theory cannot answer this, say so:** Most current theories punt here, treating cultural conditioning as "noise" without explaining how to filter it from "signal."

  ### 4. The Vocabulary Test (The Distinction Constraint)
  **The Case:** I can *imagine* a golden mountain (visual imagery), I can *conceive* of a chiliagon (understand the definition without imagery), and I can *describe* a round square (words that don't immediately trigger an alarm bell).
  **The Requirement:** The theory must rigorously separate:
  *   **Imaginability:** Sensory or quasi-sensory simulation.
  *   **Conceivability:** Coherence of description or concept.
  *   **Logical Consistency:** Freedom from formal contradiction.
  *   **Epistemic Possibility:** "For all we know."
  *   **Metaphysical Possibility:** "Could actually exist."
  **Why it matters:** Philosophers often slide between these. A theory that collapses them allows the writer to claim the robustness of "logical consistency" while relying on the psychological force of "visual imagery."

  ### 5. The Idealization Test (The Access Constraint)
  **The Case:** I cannot conceive of the solution to a complex logic puzzle due to limited working memory. An ideal reasoner with unlimited information and processing power could.
  **The Requirement:** The theory must specify whose conceivability counts. Is it *my* conceivability right now? Or the conceivability of an *idealized agent*?
  **Why it matters:** If it's only the idealized agent, actual humans (including philosophers) never have direct evidence of possibility, only guesses. If it's actual humans, we are hostage to our cognitive limitations (see The Mathematician Test).

  ### 6. The Zombie Test (The Positive Evidence Constraint)
  **The Case:** You can conceive of a being physically identical to you but lacking conscious experience (a zombie). Many philosophers take this as evidence that physicalism is false.
  **The Requirement:** The theory must explain why *this* specific conceivability claim is granted evidentiary weight when others (like Water $\neq$ H₂O) are rejected. It needs a criterion for when an intuition is a "modal insight" versus a "conceptual confusion."
  **Why it matters:** Without this, the theory is arbitrary. It needs to explain why the zombie intuition survives the filter that catches the water intuition.

  ***

  ### The Incompatible Pair
  **The Idealization Test vs. The Access Constraint.**
  You likely cannot meet both fully.
  *   To satisfy **The Mathematician Test** (avoiding error), you need **Idealization**. You must argue that only what an *ideal* reasoner conceives counts as evidence.
  *   But to satisfy the reality of **The Philosopher's Move** (explaining what we actually do), you need **Access**. You must argue that *our* current conceivability provides the evidence.
  *   **The Conflict:** If only ideal conceivability entails possibility, then the move philosophers constantly pull (using their own, non-ideal brains) is invalid. They are claiming evidence they do not possess. If actual conceivability entails possibility, the Mathematician is right and the theory is false. A theory that saves the *validity* of the move sacrifices the *accuracy* of the method, and vice versa.

  ### The Killer Requirement
  **The Water Test (The Necessary A Posteriori Constraint).**
  This is the single requirement that knocks out the most popular versions.
  *   **Why:** The most popular version of this move is the naive principle: *If I can conceive it without contradiction, it is possible.* (Often implicit in pop-philosophy and intro classes).
  *   **The Knockout:** The discovery of necessary a posteriori truths (Water = H₂O, Hesperus = Phosphorus) shattered this principle. To accommodate this, a theory must become technically complex (invoking two-dimensional semantics, primary/secondary intensions, or rigid designators).
  *   **The Cost:** Once you add that complexity to save the theory, it is no longer a tool a general reader (or even a philosopher in a hurry) can use intuitively. It stops being a "move you can pull" and starts being a "complex calculation you must perform." It kills the utility of the very tool it seeks to justify.
