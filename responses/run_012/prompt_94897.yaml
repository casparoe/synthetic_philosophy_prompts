answer: |-
  **FINAL EXAMINATION: PHILOSOPHY OF PROBABILITY AND INDUCTION**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1**

  The Principal Principle (PP) posits a normative constraint linking rational credence ($Cr$) and objective chance ($Ch$). Roughly, it states that if a rational agent knows the objective chance of an event $E$ is $x$, and possesses no "inadmissible" information, their credence in $E$ ought to be $x$. Formally: $Cr(E \mid Ch(E)=x \ \& \ K) = x$, where $K$ is admissible background knowledge.

  Consider the following "Oracle Case":
  An infallible Oracle announces to an agent that the objective chance of event $E$ occurring is $0.4$. However, in this specific scenario, the objective chance of $E$ is causally sensitive to the agent's resulting credence. Specifically, if the agent sets their credence $Cr(E)$ to $0.4$ (in accordance with the Oracle), a causal mechanism triggers that changes the actual objective chance of $E$ to $0.6$. If the agent sets $Cr(E)$ to any other value, the chance remains $0.4$.

  Dr. Elara Voss addresses this tension in her unpublished manuscript, *The Limits of Deference*:

  > "The Principal Principle assumes a one-way direction of fit: credence conforms to chance. The Oracle Case reveals a feedback loop where credence alters chance. To resolve this, I propose the **Principle of Deferred Chance (PDC)**: A rational agent should set their credence equal to the objective chance if and only if that objective chance is counterfactually independent of the agent's credence. Where chance is sensitive to credence, the Principal Principle is suspended, and the agent must calculate credence based on causal expected utility rather than direct deference."

  **Essay Prompt:**
  Explain why the Oracle Case generates a contradiction or instability for the standard formulation of the Principal Principle. Evaluate Dr. Voss's Principle of Deferred Chance: does it successfully save the Principal Principle from refutation, or does it effectively replace it with a different norm? Finally, discuss whether the Principal Principle can be preserved without Voss's restriction (for example, by revising the definition of admissible information) and state your own verdict on the viability of the Principal Principle in light of self-referential chances.

  ***

  ### MODEL ANSWER

  The Principal Principle (PP) serves as the bridge between metaphysics and epistemology, mandating that rational subjective credence align with objective chance. Formally, $Cr(E \mid Ch(E)=x \ \& \ K) = x$, provided $K$ contains no inadmissible information about the future. The Oracle Case presents a fatal instability for this formulation because it creates a scenario where satisfying the principle ensures its own falsification.

  In the Oracle Case, the Oracle announces $Ch(E)=0.4$. According to PP, the agent must set $Cr(E)=0.4$. However, the scenario stipulates that setting $Cr(E)=0.4$ causes $Ch(E)$ to become $0.6$. Consequently, once the agent complies with PP, the proposition $Ch(E)=0.4$ becomes false. The agent is now in a state where their credence ($0.4$) does not match the actual chance ($0.6$). If the agent attempts to correct this by updating to $Cr(E)=0.6$, the causal mechanism (which triggers only on $Cr=0.4$) might not activate, potentially reverting the chance to $0.4$, or creating a new mismatch. The agent cannot simultaneously match the chance and maintain the conditions that make that chance obtain. This is not merely uncertainty; it is a performative contradiction where deference undermines the object of deference.

  Dr. Voss's Principle of Deferred Chance (PDC) attempts to resolve this by restricting the domain of PP. PDC mandates deference only when chance is counterfactually independent of credence. In the Oracle Case, since $Ch(E)$ depends on $Cr(E)$, PDC suspends PP. The agent is no longer required to set $Cr(E)=0.4$ and is instead directed toward causal expected utility calculations.

  Does PDC save PP or replace it? Superficially, it saves PP by carving out an exception, rendering the principle true *ceteris paribus*. However, this move risks trivializing PP. If "admissibility" or "independence" is defined such that any chance sensitive to evidence is excluded, PP becomes vacuous in precisely the cases where guidance is most needed. Furthermore, PDC shifts the normative burden. It tells the agent when *not* to use PP, but it does not explain how to calculate credence when chance is sensitive, other than invoking causal utility. Thus, PDC functions less as a clarification of PP and more as a replacement norm for a specific class of reflexive probabilities. It admits that PP is not a universal principle of rationality but a limited heuristic for passive observation.

  Can PP be preserved without Voss's restriction? One alternative is to revise the admissibility clause ($K$). Lewis suggested that information is inadmissible if it conveys information about the future beyond what is contained in the chance hypothesis. In the Oracle Case, the Oracle's announcement combined with the knowledge of the causal link constitutes inadmissible information about the *future* chance state relative to the agent's action. By classifying the Oracle's announcement as inadmissible when the agent knows their reaction affects the chance, PP remains intact: the agent simply does not conditionalize on the announcement in the standard way. Instead, they treat the chance as a function of their action.

  However, this requires a robust theory of admissibility that can distinguish between benign evidence and self-referential loops without circularity. If we define admissibility simply as "information that doesn't affect chance," we beg the question. We need an independent criterion, such as temporal priority: chance is fixed at $t_0$, credence is formed at $t_1$. If the chance at $t_0$ depends on $t_1$, the chance function itself is ill-defined at $t_0$.

  My verdict is that the Principal Principle survives, but only as a principle concerning *initial* chances defined prior to the agent's deliberation. The Oracle Case does not refute PP; it reveals that "objective chance" in such contexts is not a fixed parameter but a variable in a game-theoretic equilibrium. PP applies to fixed chances. Voss is correct that deference is inappropriate in reflexive cases, but she is wrong to imply PP is broken. Rather, the concept of "chance" in the Oracle Case fails to meet the metaphysical prerequisites for PP application. PP remains valid for non-reflexive chances, which constitute the majority of empirical inquiry. The Oracle Case is a boundary condition, not a demolition.

  ***

  ### MARKING SCHEME

  **Total Marks:** 25
  **Grade Differentiation:**
  *   **A Grade (20-25):** Demonstrates nuanced understanding of the distinction between "saving" vs. "replacing" PP. Identifies the metaphysical implication (chance as fixed parameter vs. variable). Critiques Voss's independence clause rigorously.
  *   **B Grade (15-19):** Correctly identifies the contradiction and explains Voss's solution. Evaluates Voss but misses the deeper implication regarding the definition of chance or admissibility.
  *   **C Grade (10-14):** Explains the case but struggles with the formal tension. Accepts Voss's proposal without critical evaluation.

  **Five Must-Hit Points (5 marks each):**

  1.  **Formal Statement of the Tension:**
      *   *Requirement:* Must explicitly show that complying with PP ($Cr=0.4$) makes the chance proposition false ($Ch=0.6$), creating a mismatch or instability.
      *   *Common Error:* Students claim the agent is simply "confused" rather than identifying the performative contradiction where compliance falsifies the premise.

  2.  **Accurate Explication of Voss's PDC:**
      *   *Requirement:* Must state that PDC restricts deference to cases where chance is counterfactually independent of credence.
      *   *Common Error:* Students describe PDC as simply "ignoring the Oracle" without mentioning the independence condition.

  3.  **Critical Evaluation of PDC (Save vs. Replace):**
      *   *Requirement:* Must argue whether PDC preserves PP's core intent or limits it so severely it becomes a different norm (e.g., noting the risk of vacuity).
      *   *Common Error:* Students accept PDC as a perfect solution without noting that it limits the scope of PP significantly.

  4.  **Alternative Fix (Admissibility/Time):**
      *   *Requirement:* Must propose a non-Voss solution, such as reclassifying the Oracle's info as "inadmissible" or defining chance at a time prior to deliberation.
      *   *Common Error:* Students propose "ignoring the cause" without linking it to the technical concept of admissibility or temporal priority.

  5.  **Final Verdict on Viability:**
      *   *Requirement:* Must take a clear stance on whether PP is refuted or qualified, supported by the previous analysis (e.g., PP holds for fixed chances).
      *   *Common Error:* Students remain non-committal or conclude PP is "dead" without acknowledging its utility in non-reflexive cases.
