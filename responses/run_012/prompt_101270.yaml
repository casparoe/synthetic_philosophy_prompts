  ### Value of Information: What Would Move Me?

  **Evidence:** **Cross-cultural developmental studies on emotion concepts.**

  **Direction:**
  *   **Move Up:** Evidence that infants or isolated cultures exhibit specific emotional responses (e.g., distinct facial/physiological patterns for anger vs. fear) *before* acquiring the corresponding concepts. This would support the "non-conceptual perceptual" claim.
  *   **Move Down:** Evidence that manipulating concepts changes the physiological/phenomenological signature of the emotion itself (not just the labeling). For example, if teaching a new emotion concept creates a new physiological cluster, it suggests emotions are constructed judgments/perceptions hybrid, undermining the "essential perceptual" claim.

  **Why:** The main threat to Perceptualism is the Constructivist critique (e.g., Lisa Feldman Barrett) that emotions are conceptual categories imposed on arousal. Resolving the conceptual-dependence question directly addresses Q3.

