  ### Sensitivity Analysis

  **Most Sensitive Sub-Question:** **Q3 (Perceptual Mode vs. Judgmental Mode).**

  **Impact:** This is the engine of the theory.
  *   **If I flip Q3 to 0.90** (Convincing evidence that emotions are fundamentally non-conceptual modules): The credence rises to **~0.70**. The theory becomes the dominant paradigm.
  *   **If I flip Q3 to 0.30** (Convincing evidence that emotions are constructed judgments requiring concepts): The credence drops to **~0.15**. The perceptual view becomes a minor historical footnote, supplanted by Constructivism or Cognitivism.

  The other questions (Intentionality, Evaluative Content) are high-probability background assumptions shared by most competing theories. Q3 is the differentiator.

