  2.  **Heterogeneity:** You may weigh the "conceptual dependence" of complex emotions (offense, guilt) more heavily than I do. I grant this lowers the probability (hence Q3 is only 0.60), but I maintain that basic emotions (fear, disgust) anchor the category enough to sustain the general theory.

  **Summary:** I am slightly more optimistic that the perceptual analogy tracks a real natural kind mechanism, whereas you are more cautious about the linguistic reification of that analogy.
