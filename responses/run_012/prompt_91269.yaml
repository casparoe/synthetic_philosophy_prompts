answer: |-
  Here is a 50-minute session plan designed to fix the dependency order, swap the example, and isolate the specific normative claim Williams is making.

  ### 1. The Dependency Chain (Your Internal Map)
  Do not start with "Williams says impartiality is bad." That is the conclusion. To make it land as an argument, you must build the premises in this specific order. If you skip a step, the objection collapses into a mood.

  1.  **The Impartialist Claim:** Morality (Utilitarian or Kantian) claims to be the *ultimate* arbiter of all reasons. It doesn't just add to your reasons; it overrides them.
  2.  **The Constitutive Commitment:** Agents have "ground projects" (relationships, ambitions) that constitute their identity. These are not just things you *want*; they are who you *are*.
  3.  **The Mediation Requirement:** If (1) is true, then acting on (2) requires a specific justificatory step: you must verify that (2) is permitted by (1).
  4.  **The Alienation:** This verification step inserts a gap between the agent and their commitment. You are no longer acting *from* the commitment, but *in accordance with* morality *about* the commitment.
  5.  **The Objection:** This gap destroys "integrity" (understood as wholeness/identity, not honesty).

  **Facilitator Note:** Your user hunch is correct, but it belongs at Step 3. Williams is not objecting to the *psychological occurrence* of a thought (having it); he is objecting to the *normative necessity* of that thought (needing it for justification).

  ---

  ### 2. The Carrying Example: The Living Donor
  **Do not use the drowning wife.** It is too visceral and memorized. Use a case where the "impartial thought" feels professionally or morally required to half the room.

  **The Scenario:**
  > You are a compatible living kidney donor. Your sibling is failing. There is also a stranger on the list who, according to the hospital's allocation algorithm, has a slightly higher "quality-adjusted life year" (QALY) potential if they receive your kidney (perhaps due to age or comorbidities). You have the right to choose the recipient.

  **The "One Thought":**
  > Before agreeing to donate to your sibling, you pause to ask: *"Is favoring my sibling permissible under the principle of maximizing overall health outcomes?"*

  **Why this works:**
  *   **Contested Intuition:** Half the room (especially those with public policy/medical ethics leanings) will say, "That thought is *necessary*. Organs are public resources." This creates friction.
  *   **Not Just Emotion:** Unlike the drowning wife, this isn't a panic reflex. It allows for deliberation, which makes Williams's objection sharper (he's not saying "don't think," he's saying "don't *justify* this way").
  *   **Ground Projects:** It captures "family loyalty" without the melodrama of death, focusing on the commitment to the sibling's well-being as a identity-constituting project.

  ---

  ### 3. Session Flow (50 Minutes)

  #### Phase 1: The Impartialist Claim (0:00–0:10)
  **Goal:** Establish Premise 1 & 2 of the Dependency Chain.
  **Action:**
  *   Ask the group: "If a moral theory tells you to do X, but your deepest personal commitment tells you to do Y, what wins?"
  *   Push them until they articulate the **Impartialist Claim**: Morality claims to be the final court of appeal. It doesn't care that it's *your* sibling; it cares about the *value* of the outcome.
  *   **Check:** Ensure they agree that for the impartialist, personal reasons only count if morality allows them to count.
  *   **Misconception Check:** If they say "Utilitarianism," correct them. "This applies to Kantianism too. It's about *impartiality*, not just calculus."

  #### Phase 2: The Example & The Thought (0:10–0:25)
  **Goal:** Establish Premise 3 (Mediation) and test the intuition.
  **Action:**
  *   Present the **Living Donor** case.
  *   Ask: "To be a morally good person in this scenario, is it required that you check whether saving your sibling aligns with the greater good?"
  *   **Let them fight.** Some will say "Yes, obviously." Some will say "No, just save them."
  *   **The Pivot:** Stop the debate. Say: "Williams isn't asking what you *did*. He's asking what the moral theory *requires* for your action to be justified."
  *   **Introduce the Distinction (Your Hunch):** Draw this on the board:
      *   *Having the thought:* "I happened to wonder about the algorithm." (Williams doesn't care).
      *   *Needing the thought:* "I am not permitted to act until I verify this aligns with the impartial good." (This is Williams's target).
  *   **Why this matters:** If you skip this, they will think Williams is against reflection. He is against *mediation*.

  #### Phase 3: Integrity & Alienation (0:25–0:40)
  **Goal:** Establish Premise 4 & 5 (The Argument).
  **Action:**
  *   Ask: "If you *need* that thought to justify saving your sibling, what has happened to your relationship with your sibling?"
  *   Guide them to the word **Alienation**.
  *   **Explanation:** If your commitment to your sibling is real, it should be the *source* of the action. If impartial morality requires you to step *outside* that commitment to check it against a universal standard, you are treating your commitment as an object to be weighed, not a reason to act.
  *   **The Integrity Point:** Integrity, for Williams, isn't "honesty." It's "remaining whole." If morality forces you to split yourself into "the impartial judge" and "the committed sibling," it attacks your integrity.
  *   **Misconception Check:** If they say "Williams is saying morality is bad," correct them. "Williams is saying a morality that demands this *structure* is too demanding. It asks you to abandon your identity."

  #### Phase 4: Misconceptions & Scope (0:40–0:45)
  **Goal:** Head off the standard wrong turns.
  **Action:**
  *   **Explicitly state:** "Williams is not saying you should be selfish. He is not saying you shouldn't think. He is saying the *justificatory structure* of impartial morality is alienating."
  *   **Scope Limit:** Say this aloud: "We are not going to solve whether Williams is right. We are not going to decide if you should actually save the sibling. We are mapping the *cost* of impartiality." (This prevents the session from devolving into a normative tug-of-war).

  #### Phase 5: The Closing Question (0:45–0:50)
  **Goal:** Test if they grasped the argument or just the slogan.
  **Ask:**
  > "Imagine you save your sibling. On the way to the surgery, you happen to think, 'Thank goodness the utilitarian calculus allows this.' Have you violated Williams's objection?"

  **Correct Answer:** No.
  **Why:** Because the thought was incidental, not *constitutive of the justification*. You acted from the commitment; the thought was just noise. Williams only objects if the thought was *required* to make the action permissible.
  **If they get this wrong:** They think Williams is against thinking.
  **If they get this right:** They understand the distinction between *having* and *needing* the thought.

  ---

  ### 4. What to Refuse (Scope Limits)
  To keep this to 50 minutes, you must explicitly block three paths. Write these on the board at the start:

  1.  **"Is Williams right?"** -> *Refuse.* We are analyzing the objection, not adjudicating the truth.
  2.  **"What about the stranger?"** -> *Refuse.* Do not let the group solve the trolley problem of the kidney. The stranger's suffering is the *pressure*, not the *topic*.
  3.  **"Is this just Utilitarianism?"** -> *Refuse.* Remind them Kantianism also demands acting from Duty, not inclination. If "Love" must be validated by "Duty," the thought is still one too many.

  ### 5. Facilitator Cheat Sheet: Dependency Troubleshooting
  *   **If they say:** "But shouldn't we think before we act?"
      *   **You say:** "Yes, but are you thinking to *plan* the surgery, or to *justify* the love? Williams attacks the justification."
  *   **If they say:** "This is just an excuse for nepotism."
      *   **You say:** "Maybe. But Williams wants to know if *Morality itself* forces you to view your family as a potential nepotism risk. That's the alienation."
  *   **If you feel yourself slipping:** Check the board. Are you talking about the *Thought* before you defined the *Commitment*? If so, stop. Go back to "Ground Projects."

  ### 6. Why This Plan Earns Your Hunch
  You suspected the distinction is between *having* vs. *needing* a justifying thought. This plan earns that by placing it in **Phase 2**.
  *   If you start with the objection ("It's one thought too many!"), the distinction feels like a technicality.
  *   By building the **Mediation Requirement** (Phase 2) *after* establishing the **Impartialist Claim** (Phase 1), the group sees *why* the thought is needed (because Morality demands oversight).
  *   Once they see *why* it is needed, they can feel the weight of Williams saying "You shouldn't *need* that."
  *   The Closing Question then locks it in by removing the *need* while keeping the *have*.

  This structure ensures the objection lands as a structural critique of moral theory, not a sentimental plea for family values.
