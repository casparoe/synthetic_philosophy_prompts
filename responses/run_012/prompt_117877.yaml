prompt: |-
  Ok so I just lost about three hours to an arguement with my friend Maya about speciesism and I came out of it less sure of my own position than when I went in, which is not the outcome I was hoping for. I want you to tell me what would count against it. Don't give me a reading list or citations — I can't check them and honestly I'd rather have the arguments themselves.

  Where I've landed: speciesism is the same kind of error as racism and sexism. Not that every animal gets the same treatment — a mouse and a person obviously can't be treated the same way — but that species membership by itself carries no moral weight, and any capacity that does carry weight has to carry it wherever it turns up, in whatever kind of body.

  Two things from the argument I can't get out of my head. First, Maya's disanalogy: racism is wrong partly because race is morally arbitrary, it doesn't track anything we care about. Species isn't arbitrary in that way — it correlates, messily, with tons of overlap and exceptions, with the very capacities we do care about. So if the anti-speciesist's argument is basically "species is like race," and that relevant similarity doesn't hold, does the view survive on its own or was the analogy carrying all the weight? Second, my own test, which I don't think I've seen put exactly this way: imagine we find a species — call it the raven case — whose median member beats the median human on self-awareness, future-directed preference, maybe even language. My view says ravens then outrank us and I have to be fine with that. Maya says that's a reductio: if the view says that, then it's really a view about capacities, "speciesism" is a misnomer, and once it's a view about ranking beings by their capacities it's a view nobody should want.

  What I want from you: everything that counts against the view, not just the two things above — empirical findings about animal minds, conceptual objections, intuition pumps, results showing it collapses into something else. For each: would a committed anti-speciesist concede it counts against them, or wave it off — and if they wave it off, does the wave cost them anything? Sort them by how much damage they actually do. And tell me honestly whether the view has been qualified into unfalsifiability — the slide to sentience, or to equal consideration not meaning equal treatment — and whether that's a real problem for a view like this or just what any decent ethical view looks like after it's been defended for a while.

  After the prose, give me a table with these columns:

  Defeater | Kind (empirical / conceptual / intuition pump / formal) | Damage (fatal / serious / awkward / cosmetic) | Conceded by a committed anti-speciesist? (yes / no / only in watered-down form) | Their best comeback | Does the comeback cost them anything?

  Then a short JSON object with fields: "survives" (one sentence), "most_dangerous_defeater" (name it), "insulation" ("well-insulated" or "partly" or "exposed"), "insulation_is_a_problem" (true/false plus one line why), "what_should_move_me" (one line).

  The thing that would actually move me isn't a clever asymmetry, it's the view being forced to say something I can't stomach. If it has to say that, tell me plainly.
