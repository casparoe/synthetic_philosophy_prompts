answer: |-
  Your skepticism is well-founded. Your friend has given you a textbook definition that sounds authoritative but glosses over the messy reality of applying bargaining theory to a family dispute over physical assets. A bargaining theorist would wince at three specific things in that explanation: the definition of "gains," the claim of a single "true" solution, and the leap from abstract utility to physical tools.

  Here is where the picture breaks down.

  ### 1. "Equal Gains" is Factually Wrong
  This is the biggest technical error. The Kalai–Smorodinsky (KS) solution does **not** produce equal absolute gains. It produces equal **relative** (or proportional) gains.

  Here is the difference:
  *   **Equal Absolute Gains:** If the "no-deal" point is \$0 and the best possible deal is \$100, we each get \$50. This is actually the *Egalitarian Solution*, not Kalai–Smorodinsky.
  *   **Kalai–Smorodinsky:** It looks at how much of your *maximum possible improvement* you are getting. If your "best case" (if I rolled over completely) is gaining \$1,000, and my "best case" is gaining \$100, KS ensures we both get the same *percentage* of our respective best cases. You might get \$900 and I might get \$90. We are both getting 90% of our potential, but your absolute gain is ten times mine.

  **Why this matters for you:** If your sister values the client list much more than you do (perhaps she plans to keep working, while you want out), her "ideal point" is higher. KS would justify giving her more of the total value because she has more "potential" to gain. If you were expecting a 50/50 split of value, KS might not give you that.

  ### 2. The "One Real Fairness Solution" Myth
  Your friend claims KS is the "proven answer" and Nash is only for symmetric situations. A theorist would wince at this because fairness in economics is not a discovery; it's a choice of axioms.

  *   **Nash** sacrifices *Monotonicity* to keep *Independence of Irrelevant Alternatives (IIA)*. IIA means that if you remove a bad option that nobody wanted, the deal shouldn't change. This is generally good for stability.
  *   **Kalai–Smorodinsky** sacrifices *IIA* to keep *Monotonicity*. Monotonicity means if the pie gets bigger for you specifically, you shouldn't end up with less.

  Neither is objectively "fairer." They prioritize different logical consistencies. Your friend is advocating for Monotonicity (which feels intuitive: "if my options improve, I shouldn't lose out"), but in doing so, he's accepting that removing a useless option from the table could theoretically change the split. That's a trade-off, not a proof of superiority. Furthermore, Nash bargaining can easily handle asymmetry by applying "bargaining weights" (e.g., you get 60% influence, she gets 40%), so the claim that Nash only works for symmetric situations is a simplification.

  ### 3. The Utility vs. Assets Problem
  This is the practical dealbreaker. Bargaining solutions like KS and Nash operate on **utility**, not dollars or hammers.

  To draw that line your friend described, you need to know the "utility" of the van to you versus the "utility" of the van to your sister.
  *   If you keep the van, does that give you 100 utils?
  *   If she keeps the client list, does that give her 100 utils?

  In a carpentry business, assets are **lumpy** (you can't split a van 53.4%) and **subjective** (the client list might be worthless to you but vital to her). KS assumes a smooth curve of achievable outcomes. In reality, you have a finite set of discrete combinations (You get van + she gets clients, OR you get cash + she gets tools, etc.).

  To use KS, you would first have to agree on a currency of value (e.g., dollar valuations) for every single item. But if you could agree on dollar valuations, you wouldn't need a complex bargaining solution; you could just split the cash value. The conflict usually exists *because* you can't agree on the value. KS doesn't solve the valuation problem; it assumes it's already solved.

  ### The Verdict
  The geometric picture your friend drew (line from disagreement point to ideal point) is mathematically accurate for the Kalai–Smorodinsky solution, but the interpretation is off.

  *   **Is it the "one real fairness solution"?** No. It's one of several normative models.
  *   **Does it yield equal gains?** No. It yields equal *proportional satisfaction*.
  *   **Will it solve your fight?** Probably not. It requires you to quantify your "ideal points" and "disagreement points" in a common utility metric, which is exactly what you are fighting about.

  **A Better Approach:**
  For dividing discrete business assets, theorists and practitioners often prefer **Knaster's Procedure** (sealed bids with cash adjustments) or the **Adjusted Winner Procedure** (both sides assign 100 points across items, items go to the higher bidder, and the most valuable item is split or adjusted with cash to equalize points).

  These methods force you to reveal how much you actually value the van versus the tools without requiring you to agree on a single "fair" philosophy beforehand. They are mechanism designs built for lumpy assets, whereas Kalai–Smorodinsky is a theoretical construct built for continuous utility frontiers. Use the tool built for the job.
