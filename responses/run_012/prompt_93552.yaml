answer: |-
  This is an exceptionally sharp observation. You have identified the central tension in contemporary philosophy of mind: the gap between explaining what consciousness *does* (its function) and explaining what consciousness *is* (its experience). Your intuition that Global Workspace Theory (GWT) fits "Access Consciousness" perfectly but leaves "Phenomenal Consciousness" hanging is shared by many professional philosophers.

  Below is a conceptual breakdown designed to help you structure your essay. I will avoid names and dates to focus strictly on the logic of the arguments, as you requested.

  ### Part 1: Analyzing the Four Readings of Broadcast

  You have devised four ways to interpret what "global broadcast" actually means. Let us test each against the requirements of GWT, Access Consciousness, and Phenomenal Consciousness.

  **1. Broadcast as mere availability to downstream systems**
  *   **Does GWT require it?** Yes. This is the minimal definition of the theory. Information must be made available to various specialised modules (memory, language, motor control).
  *   **Is it sufficient for Access Consciousness?** Yes. If information is available for reasoning and action, it is, by definition, access-conscious.
  *   **Is it sufficient for Phenomenal Consciousness?** No. A computer router makes data available to downstream programs, but we do not assume the router has subjective experiences. Mere availability seems too "thin" to generate a feeling.
  *   **Where they come apart:** This is the clearest case of divergence. A system could have perfect information availability (high access) but zero inner feeling (no phenomenality). This is the classic "Philosophical Zombie" scenario.

  **2. Broadcast as availability to a single central reader or narrator**
  *   **Does GWT require it?** No. In fact, GWT explicitly tries to avoid this. The theory posits a distributed network, not a little person (homunculus) sitting in a central theatre watching the screen.
  *   **Is it sufficient for Access Consciousness?** No. Access can happen in parallel without a single reader.
  *   **Is it sufficient for Phenomenal Consciousness?** Problematic. If a "central reader" is needed to have the experience, we must ask: is the reader conscious? If so, does *it* need a further reader? This leads to an infinite regress.
  *   **Where they come apart:** GWT rejects this reading to avoid the regress, but this reading is often what people *intuitively* think phenomenal consciousness requires (a "self" watching the experience).

  **3. Broadcast as availability to the system's own self-monitoring**
  *   **Does GWT require it?** Not strictly. Standard GWT is a "first-order" theory: a state is conscious if it is broadcast, regardless of whether the system thinks about having that state. However, some versions of the theory incorporate meta-cognition.
  *   **Is it sufficient for Access Consciousness?** No. You can access information (e.g., reacting to a stop sign) without monitoring the fact that you are accessing it.
  *   **Is it sufficient for Phenomenal Consciousness?** Debated. Some theories (Higher-Order Theories) argue that you only have a phenomenal experience if you are aware of having it. But many argue that pain, for example, feels like something even if you aren't monitoring it.
  *   **Where they come apart:** If GWT does not require self-monitoring, it allows for conscious states the subject is not aware of *being aware of*. This separates GWT from theories that tie phenomenality strictly to self-knowledge.

  **4. Broadcast as the kind of availability that makes a state reportable in the first person**
  *   **Does GWT require it?** Yes, practically. Reportability is the main scientific marker used to detect when broadcast has occurred.
  *   **Is it sufficient for Access Consciousness?** Yes. Reportability is the gold standard for access.
  *   **Is it sufficient for Phenomenal Consciousness?** No. A system could be programmed to report "I see red" whenever a red signal is broadcast, without actually feeling redness.
  *   **Where they come apart:** This is the critical pressure point. If GWT defines consciousness by reportability, it risks defining away the very thing (the feeling) that might exist without report (e.g., in infants or animals).

  ### Part 2: The Case of the Ephemeral Broadcast

  **The Scenario:** A state is broadcast globally, but there is no self-monitoring, no memory retention, and no behavioural report or integration. It happens once and vanishes.

  **Would a Global Workspace Theorist call this conscious?**
  Strictly speaking, **no**. This reveals a subtle but crucial detail in the theory. GWT does not define consciousness merely as *firing* in the workspace; it defines it as *global availability for control*. If the broadcast does not influence memory, action, or reasoning, it has failed to function as a workspace. It is like a message sent to a post office that no one picks up. If the information does not become "globally available" to the system's functions, the theory would likely say the broadcast was not successful, and therefore the state was not conscious.

  **What does this imply?**
  This shows that GWT is a **functionalist** theory. It defines consciousness by what it *does*, not by what it *is*.
  *   **If the theorist says "Yes, it is conscious":** They face an absurdity. A conscious state that leaves no trace, influences no behaviour, and is remembered by no one is indistinguishable from an unconscious state. This would suggest the theory is broken.
  *   **If the theorist says "No, it is not conscious":** They admit that broadcast alone is not enough; *uptake* is required. This reinforces that GWT is a theory of Access (functional role), not Phenomenality (intrinsic feel).

  **The Hidden Condition:**
  The condition doing the work here is **functional consequence**. GWT assumes that if a state is truly "globally broadcast," it *must* be available for downstream processing. If there is no downstream processing, there was no broadcast. This means GWT cannot account for a "phenomenal residue"—a feeling that exists but does nothing. If you believe such feelings are possible (e.g., a fleeting pain you forget instantly but felt while it lasted), GWT cannot explain them.

  ### Part 3: The Case of Two Non-Communicating Workspaces

  **The Scenario:** A system contains two global workspaces that never share information with each other.

  **Would GWT predict one stream of consciousness or two?**
  GWT would predict **two streams of access**. Since the definition of the workspace is the place where information becomes available to the system, two separate workspaces mean two separate domains of availability. Information in Workspace A is not available to the modules connected to Workspace B.

  **Does this mean two subjects?**
  Here, the theory falls silent. GWT describes the *architecture* of information flow, not the *metaphysics of the self*.
  *   **The Theory's Limit:** GWT can say there are two functionally isolated streams of processing. It cannot, on its own, say whether there is "one person split in two" or "two people in one body."
  *   **The Added Assumption:** To conclude there are two *subjects* of experience, you must add an assumption: "One global workspace equals one subject." This is not proven by GWT; it is an extra philosophical claim.
  *   **The Pressure Point:** If you accept that assumption, GWT implies that if we could surgically separate the two hemispheres of a brain (each with its own workspace), we create a second subject. This is a massive metaphysical conclusion derived from a functional theory. It shows that GWT relies on an unstated link between "functional unity" and "phenomenal unity."

  ### Part 4: The Strongest Objection and The Strongest Reply

  For your essay, this is the climax of the argument. You must present the objection fairly, then present the best possible defence.

  **The Strongest Objection: The Explanatory Gap**
  The objection is that GWT explains the *consequences* of consciousness but not consciousness *itself*.
  *   **The Argument:** GWT explains how a visual signal becomes available to the language centre (Access). It explains why you can say "I see red." But it does not explain why that process is accompanied by the experience of redness (Phenomenal).
  *   **The Accusation:** The theory quietly assumes that once you have explained the access, the feeling comes for free. It treats the "hard problem" (why does it feel like something?) as if it were an "easy problem" (how does the system process data?). By defining consciousness as global broadcast, the theory risks changing the subject. It answers the question "How does the brain report experience?" but pretends it has answered "What is experience?"
  *   **The Silence:** The theory is silent on why information broadcasting should feel like anything at all. A robot could theoretically broadcast information without feeling. GWT gives no reason why the human version is different.

  **The Strongest Reply: Functional Identity**
  The best defence does not try to find a "magic ingredient" inside the broadcast. Instead, it denies that there is a gap to bridge.
  *   **The Argument:** There is no such thing as "phenomenal consciousness" separate from "access consciousness." The feeling of experience *just is* the functional role of the information being stabilized and broadcast.
  *   **The Claim:** To ask "Why does broadcast feel like something?" is a category mistake. It is like asking "Why does water being H2O feel wet?" Wetness isn't an extra ingredient added to H2O; it is what H2O *does* at a macro level. Similarly, phenomenal consciousness is not an extra ghostly property; it is what global access *is* from the inside.
  *   **The Consequence:** If you accept this reply, the "Hard Problem" dissolves. You don't need to explain how the feeling arises from the function, because the feeling *is* the function.
  *   **The Cost:** This reply requires you to accept that if a system functionally mimics a human (broadcasts information, reports, acts), it *must* be conscious. There is no room for a "Zombie" that acts conscious but feels nothing.

  ### Summary for Your Essay

  Your essay can conclude by mapping the "silences" you have uncovered:

  1.  **GWT is silent on intrinsic quality:** It explains the *structure* of awareness, not the *quality* of feeling (why red feels different from blue).
  2.  **GWT is silent on the subject:** It explains the *stream* of consciousness, but relies on an extra assumption to define the *self* that owns the stream.
  3.  **GWT is silent on non-functional experience:** It cannot account for feelings that have no impact on memory or behaviour, because it defines consciousness by its impact.

  Your suspicion is well-founded. GWT is a robust theory of Access Consciousness. Whether it is a theory of Phenomenal Consciousness depends entirely on whether you accept the "Functional Identity" reply. If you believe there is a difference between *processing information* and *feeling information*, then GWT leaves the most important part of the mind unexplained. If you believe feeling is just a kind of processing, then GWT is a complete theory. Your essay's job is not to solve this, but to show clearly where the theory forces you to make that choice.
