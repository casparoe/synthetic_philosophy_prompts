answer: |-
  You are right to be annoyed. The phrase "information is physical" is a rhetorical Swiss Army knife. It gets pulled out to do five different jobs, and speakers rarely specify which blade they are using. This ambiguity allows people to talk past each other: one person is arguing about hardware constraints, while the other is making a claim about the ontology of the universe.

  Here is the menu of interpretations, ordered from trivial to metaphysical, with an assessment of their truth value and their utility against the Demon.

  ### 1. The Substrate Claim
  **The Assertion:** Information cannot exist in the abstract; it must be instantiated in a physical state (a voltage, a magnetization, a molecule's position). There is no "ghost in the machine."
  **Verdict:** **Platitude.**
  **Analysis:** This is trivially true. A bit is always a difference that makes a difference in some material substrate. However, as a defense against the Demon, it is useless. The Demon's proponent already agrees the memory has a physical state. The question isn't *whether* the memory is physical, but whether the *physics of that memory* necessarily incurs an energy cost that balances the books. This claim establishes that the demon has a body, but not that the body must sweat.

  ### 2. The Measurement Claim
  **The Assertion:** The act of acquiring information (measuring the molecule's speed) necessarily dissipates heat or requires work.
  **Verdict:** **False.**
  **Analysis:** This was the original hope (proposed by Szilard in 1929), but it was debunked by Charles Bennett in the 1980s. You can construct a measurement apparatus that interacts with a system reversibly. If the measurement device is already in a known standard state, it can correlate with the gas molecule without increasing entropy. You can "know" the speed of the molecule without paying an energy tax *at the moment of measurement*. People still use this reading because it feels intuitive (observation disturbs the system), but in the context of the Demon, it is physically incorrect.

  ### 3. The Erasure Claim (Landauer's Principle)
  **The Assertion:** While measuring and storing information can be reversible, *deleting* information is logically irreversible and therefore thermodynamically irreversible. To reset a bit to a standard state (to make room for the next measurement), you must dissipate at least $k_B T \ln 2$ of heat per bit.
  **Verdict:** **Substantive Claim.**
  **Analysis:** This is the heavy lifter. It connects *logical* irreversibility (many-to-one mapping, like resetting a 1 or 0 to a 0) to *thermodynamic* irreversibility (phase space compression). It asserts that you cannot compress the phase space of the memory device without expanding the phase space of the environment (heating it up).
  **Is it the same as #4?** It is the operational consequence of #4.

  ### 4. The Identity Claim
  **The Assertion:** Information entropy (Shannon) and Thermodynamic entropy (Boltzmann/Gibbs) are not just analogous; they are the *same quantity* expressed in different units. Knowing the microstate of the gas *is* a reduction of thermodynamic entropy.
  **Verdict:** **Substantive Claim.**
  **Analysis:** This is the theoretical underpinning of Landauer's Principle. It asserts that the Demon's knowledge is a physical resource. If the Demon knows which side the fast molecules are on, the system's entropy *is* lower relative to the Demon, even if it looks high to us. When the Demon uses that knowledge to sort, it converts "information entropy" into "thermodynamic work." To close the cycle, that information debt must be paid.
  **Note:** Claims #3 and #4 are often worn as the same coat. #4 is the identity; #3 is the price tag on that identity.

  ### 5. The Ontological Claim ("It From Bit")
  **The Assertion:** Information is not just a property of physical systems; it is the fundamental constituent of reality. Physics emerges from information processing.
  **Verdict:** **Metaphysical / Unproven.**
  **Analysis:** This is Wheeler's "It from Bit" or modern digital physics. It is a radical research program, not an established fact. While exciting, it is completely unnecessary to exorcise Maxwell's Demon. You do not need to believe the universe is a computer to agree that deleting a file on your hard drive generates heat.

  ---

  ### Which Reading Actually Kills the Demon?

  When physicists wave the demon away, they are leaning on **Reading #3 (The Erasure Claim)**, supported by **Reading #4 (The Identity Claim)**.

  They are *not* saying measurement costs energy (Reading #2 is dead). They are saying the Demon is a cyclic engine. To operate continuously, the Demon must clear its memory. It cannot fill up its brain forever. When it resets its memory to be ready for the next molecule, *that* specific step generates the heat that saves the Second Law.

  ### Does This Genuinely Kill the Demon, or Just Relabel the Problem?

  This is the sharp end of your question, and it divides philosophers of physics.

  **The "Relabeling" Critique (The Skeptic's View):**
  Critics (like John Earman and John Norton) argue that Landauer's Principle is sometimes applied circularly. They argue that if you derive Landauer's Principle *from* the Second Law, then using Landauer's Principle to *save* the Second Law is a tautology. It looks like this:
  1.  Why doesn't the Demon violate the 2nd Law?
  2.  Because erasing memory costs energy.
  3.  Why does erasing memory cost energy?
  4.  Because otherwise, you'd violate the 2nd Law.

  If this is the logic, then "information is physical" is just a fancy way of saying "We define the system boundaries to include the memory, and we stipulate the 2nd Law holds." It moves the problem from the gas to the memory, but doesn't explain *why* the memory must behave that way dynamically.

  **The "Genuine Explanation" Defense (The Consensus View):**
  Proponents (like Bennett, Penrose, and modern statistical mechanicians) argue that Landauer's Principle is **derivable from Hamiltonian dynamics** without assuming the Second Law upfront.
  The argument is about phase space volume.
  1.  The combined system (Gas + Demon) evolves according to reversible laws (Liouville's Theorem), meaning the total volume of phase space is conserved.
  2.  The Demon wants to reduce the volume of the Gas's phase space (sort the molecules).
  3.  To conserve total volume, the Demon's own phase space must expand.
  4.  "Erasure" is the process of compressing the Demon's phase space back to a standard state.
  5.  To compress the Demon's phase space, you must expand the Environment's phase space (heat dissipation).

  **The Verdict:**
  If you accept the microscopic reversibility of classical/quantum mechanics, Reading #3/#4 **genuinely kills the demon.** It does not just relabel the failure; it identifies the specific mechanical step (the resetting of the correlation) where the entropy increase is physically unavoidable due to phase space conservation.

  However, if you view the Second Law as a fundamental axiom rather than a statistical consequence of dynamics, then yes, it looks like a relabeling.

  **Summary for your arguments:**
  *   If someone says "Measuring costs energy," they are wrong (Reading #2).
  *   If someone says "You need a hard drive," they are stating a platitude (Reading #1).
  *   If they say "Resetting the hard drive dissipates heat because logical irreversibility requires phase-space expansion," they are making the substantive claim (Reading #3/#4).
  *   That substantive claim **does** solve the paradox, provided you accept that thermodynamics reduces to statistical mechanics. It locates the cost not in the *sorting*, but in the *forgetting*. The Demon can win for a while, but only by filling up its memory. To keep winning, it must forget, and forgetting is where the heat is paid.
