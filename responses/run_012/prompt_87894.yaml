answer: |-
  # The Heritability Relevance Protocol (HRP)

  **Time Limit:** 120 Minutes
  **Input:** The proposal document and any attached citations/summaries provided by the requester.
  **Output:** A two-page memo using the template at the end of this protocol.
  **Constraint:** Do not search for outside studies. If the document does not state it, it is "Not Stated."

  ## Part I: The Decision Procedure

  Run these questions in order. If a step directs you to a **Verdict**, stop the procedure and draft the memo. If a step directs you to a **Values Handoff**, note the factual finding and pass the decision to the Superintendent/Board.

  ### Step 1: Identify the Job
  **Question:** Which of the following four jobs is the heritability number ($h^2$) being asked to do in this proposal?
  1.  **Variance:** Explain why individuals *within* the district differ right now.
  2.  **Means:** Explain why one group (e.g., schools, demographics) differs from another.
  3.  **Malleability:** Predict what happens if we change the environment (e.g., new curriculum, policy).
  4.  **Targeting:** Predict which specific individuals will respond differently to a change.

  *   **Sufficient Answer:** Select exactly one. If the document mixes them, select the one required to justify the *spending decision*.
  *   **Stop Rule:** If the job is **Means (2)**, stop.
      *   **Verdict:** *Relevant and cutting against the proposal.* (Heritability within a group cannot explain differences between groups).
      *   **Memo Script:** "The statistic describes variation within a population, not differences between populations. It cannot support claims about group gaps."

  ### Step 2: Identify the Source Environment
  **Question:** What population and environmental range produced this estimate?
  *   **Look for:** Age, socioeconomic status, geographic location, and description of "standard" schooling in the study.
  *   **Sufficient Answer:** A one-sentence description (e.g., "Western European twins, ages 7–12, standard public schooling").
  *   **Stop Rule:** If the document does not state the population or environment, stop.
      *   **Verdict:** *Not assessable on the available evidence.*
      *   **Memo Script:** "The source population and environmental conditions are not disclosed. The number cannot be mapped to our district."

  ### Step 3: The Malleability Check
  **Question:** Is the proposal asking to change the environment (Job 3)?
  *   **If No:** Go to Step 4.
  *   **If Yes:** Compare the study's environment to the proposed intervention.
      *   **Narrow vs. Wide:** Is the study's environmental range narrower than the change you propose? (e.g., Study = standard classrooms; Proposal = intensive 1:1 tutoring).
      *   **Method Check:** Is the estimate from a Twin Study (compare identical vs. fraternal) or DNA (compare genetic markers)?
          *   *If Twin Study:* Apply a **Confidence Penalty**. Twin studies assume identical environments for identical twins. If your intervention changes the environment unequally, the estimate is unstable.
  *   **Stop Rule:** If the proposal changes the environment *and* the estimate comes from a narrow range or Twin Study, stop.
      *   **Verdict:** *Relevant but insufficient.*
      *   **Memo Script:** "Heritability describes the current mix of causes. It does not predict the effect of a new environment. High heritability in standard classrooms does not predict response to intensive intervention."
      *   **Required Phrase:** "Heritable does not mean unchangeable; it means 'currently explained by genetic differences in this specific context.'"

  ### Step 4: The Targeting Check
  **Question:** Is the proposal asking to target specific individuals based on response (Job 4)?
  *   **If No:** (i.e., it is Job 1, Variance) Stop.
      *   **Verdict:** *Irrelevant to this decision.* (Explaining why kids differ today does not tell you what to do about it).
  *   **If Yes:** Does the document provide evidence that the *intervention effect size* correlates with the heritable trait (Gene-by-Environment interaction)?
      *   **Sufficient Answer:** Yes/No. Do not accept evidence that the *trait* is heritable. You need evidence that the *gain* is heritable or predicted by the trait.
      *   **Stop Rule:** If the document only shows the trait is heritable, but not that the *response* tracks the trait, stop.
          *   **Verdict:** *Relevant but insufficient.*
          *   **Memo Script:** "Knowing a trait is heritable does not identify who benefits from intervention. We need evidence of differential response."
      *   **Stop Rule:** If the document shows differential response tracking the trait, proceed to **Values Handoff**.
          *   **Values Handoff:** "The evidence suggests the intervention works better for Profile A than Profile B. The decision to target resources based on this profile is a value judgment regarding equity and efficiency."
          *   **Verdict:** *Relevant and supporting it.* (With the Values Handoff note).

  ### Step 5: Final Logic Check
  **Question:** Does the proposal claim that high heritability makes a trait "intrinsic" or "fixed"?
  *   **Stop Rule:** If Yes, stop.
      *   **Verdict:** *Relevant and cutting against the proposal.*
      *   **Memo Script:** "The proposal conflates heritability with immutability. High heritability is compatible with large environmental effects."

  ---

  ## Part II: Application to Current Matters

  Here is the output of the HRP run on your three active files.

  ### Case 1: Vendor Decoding Program
  *   **Claim:** Reading difficulty $h^2 \approx 0.7$ (Twin Study); therefore difficulty is intrinsic and *only* intensive program works.
  *   **HRP Step 1 (Job):** **Malleability.** The vendor claims the statistic justifies a specific environmental change (intensive program).
  *   **HRP Step 3 (Malleability Check):** The estimate comes from a Twin Study in standard environments. The proposal introduces a *new*, intensive environment.
  *   **Procedure Yield:** **Relevant but insufficient.**
  *   **Work Done:** Step 3. The procedure forces the distinction between "variation in current setting" and "response to new setting."
  *   **Risk of Overclaiming:** You might imply the program *won't* work. The verdict only says the statistic doesn't prove it *will*.
  *   **Memo Line:** "The heritability estimate explains why students differ under current instruction. It does not predict the efficacy of a novel, intensive intervention. Heritable does not mean unchangeable."

  ### Case 2: Board Member vs. Resilience Curriculum
  *   **Claim:** Grit is substantially heritable; therefore teaching it is futile.
  *   **HRP Step 1 (Job):** **Malleability.** The member claims the statistic predicts the failure of an environmental change (curriculum).
  *   **HRP Step 5 (Logic Check):** The member equates "heritable" with "futile to teach" (intrinsic/fixed).
  *   **Procedure Yield:** **Relevant and cutting against the proposal.** (Note: This verdict cuts against the *Board Member's argument*, thereby clearing the path for the proposal).
  *   **Work Done:** Step 5. The procedure catches the "Heritable = Unchangeable" fallacy explicitly.
  *   **Risk of Overclaiming:** You might sound like you are advocating *for* the curriculum. You are only advocating *against the statistical objection*.
  *   **Memo Line:** "The argument conflates heritability with immutability. A trait can be highly heritable and still highly responsive to instruction (e.g., reading). The statistic does not support the claim of futility."

  ### Case 3: Targeted Reading Intervention
  *   **Claim:** Reserve intervention for children with Profile X. Evidence shows effect size varies across children in ways that track a heritable characteristic.
  *   **HRP Step 1 (Job):** **Targeting.** The proposal uses the trait to predict individual response.
  *   **HRP Step 4 (Targeting Check):** The document provides evidence that the *intervention effect* tracks the heritable characteristic (Gene-by-Environment interaction), not just that the trait is heritable.
  *   **Procedure Yield:** **Relevant and supporting it.** (Subject to Values Handoff).
  *   **Work Done:** Step 4. This is the exception to your instinct. When the claim is about *differential susceptibility* (GxE), heritability is relevant.
  *   **Risk of Overclaiming:** You are validating the *logic*, not the *science*. If the underlying study is flawed, your memo validates a broken tool. You must include the Values Handoff.
  *   **Memo Line:** "The evidence indicates the intervention effect is moderated by the identified characteristic. This supports the logic of targeting. However, selecting beneficiaries based on biological profiles involves equity considerations beyond statistical efficiency."
  *   **Why you won't like this:** Your instinct is that *all* heritability citations are red herrings. This procedure forces you to admit that when the claim is about **Targeting (Job 4)** supported by **Interaction Evidence**, the citation is valid. You cannot dismiss this one as a red herring without violating the protocol.

  ---

  ## Part III: Failure Modes and Limitations

  This procedure is a filter, not a truth machine. It will misfire in the following situations:

  **1. The "Hidden Environment" Misfire**
  *   **Situation:** A study claims to measure genetic effects, but the "environment" is actually correlated with genetics (gene-environment correlation). For example, parents pass on genes *and* books.
  *   **Why it misfires:** The HRP treats the study's "environment" label as factual. If the study failed to control for passive gene-environment correlation, the $h^2$ is inflated.
  *   **Blind Spot:** You cannot see this without access to the methodology section of the original paper, which you do not have. The memo will look confident while the number is wrong.

  **2. The "Range Restriction" Misfire**
  *   **Situation:** The study population is extremely uniform (e.g., all wealthy, all same school). Heritability will appear artificially high because environmental variance is near zero.
  *   **Why it misfires:** Step 2 asks you to identify the range, but if the document obscures the homogeneity (e.g., says "US Students" but sample is 80% private school), you will miss the penalty in Step 3.
  *   **Blind Spot:** Sampling bias in the provided document.

  **3. The "Black Box" Interaction**
  *   **Situation:** In Case 3, the document claims "effect size tracks heritable characteristic."
  *   **Why it misfires:** The procedure accepts this claim if stated. It does not verify if the interaction effect is statistically robust or a p-hacked subgroup analysis.
  *   **Blind Spot:** You are validating the *argument structure*, not the *data integrity*. A vendor could lie about the interaction effect, and the HRP would yield "Relevant and Supporting."

  **4. What It Cannot Do**
  *   **Cannot Quantify Impact:** It tells you if the logic holds, not if the effect size is worth the cost. A intervention can be "Relevant and Supporting" but still too expensive for the gain.
  *   **Cannot Detect Fraud:** It assumes the provided numbers are real.
  *   **Cannot Resolve Values:** It explicitly hands off the decision when the science is sound but the ethical implication (e.g., genetic profiling) is debatable.

  **Final Instruction:** When you sign the memo, you are certifying that the *logic connecting the statistic to the proposal* is sound, not that the *statistic itself* is true. Keep that distinction in your header.
