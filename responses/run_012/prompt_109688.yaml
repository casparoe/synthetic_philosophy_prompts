      4.  **The Vote.**

      *Let's flesh out the "Gaming" section.* How do people lie? By turning "I like this" into "This is historically pivotal." The protocol needs a specific check for that. "Is this claim verifiable by a third party?"

  7.  **Final Review against Constraints:**
      *   90 mins usable? Yes, keeps discussion focused.
      *   Treasurer included? Yes, budget gate.
      *   Video expert accounted for? Yes, their testimony is weighted but bounded.
