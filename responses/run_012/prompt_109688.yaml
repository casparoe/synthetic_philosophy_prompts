      *   **Context:** 5 members, $200k/year budget, 8-9 acquisitions/year. Public funding requires defensible minutes (one-sentence justification).
      *   **Problem:** Shift to time-based/performance work breaks the traditional "look and judge" process. Works are often unseen (scores, long videos, past performances).
      *   **Philosophical Core:** The "Acquaintance Principle" (you can't judge aesthetic value without experiencing it). Current decisions rely on unverifiable testimony.
      *   **Task:** Create a practical decision procedure (algorithm/flowchart style) for the committee to use in 90-minute meetings.
      *   **Constraints:**
          *   Must distinguish between factual testimony (provenance, condition) and aesthetic testimony (quality).
          *   Must distinguish between seen and unseen works.
          *   Must be usable by non-philosophers (including a treasurer and a single video expert).
          *   Must handle three specific test cases (9-hour video, divisive performance score, unseen historical work).
          *   One test case must result in a "No" (against the user's potential desire).
          *   Must identify vulnerabilities (gaming the system) and limitations.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Acquaintance Principle:* If we haven't seen it, we can't judge its *quality*.
      *   *The Institutional Reality:* We *must* acquire to stay relevant/active, but we *must* defend spending public money.
      *   *The Compromise:* We can't verify quality on unseen works, so we must shift the justification from "This is good" to "This is necessary/representative/risk-managed."
      *   *The Procedure:* Needs to force the committee to admit *why* they are buying. Is it because they know it's good (Seen)? Or because they trust the curator/market/history (Unseen)?

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Keep it under 90 minutes. 5 people.
      *   *Structure:* Sequential gates. If you fail a gate, you stop or move to a different track.
      *   *Step 1: The Visibility Check.* Have we (the committee) experienced the work?
          *   If Yes -> Standard Aesthetic Judgment.
          *   If No -> Trust/Strategic Judgment.
      *   *Step 2: The Fact Check.* (Provenance, Budget, Legal). This is the Treasurer's domain.
      *   *Step 3: The Testimony Classification.* Is the Curator selling us *facts* or *feelings*?
      *   *Step 4: The One-Sentence Defense.* Draft the minute *before* voting.
      *   *Refinement:* Make it punchy. Use "Stop/Go" language.

      *Drafting the Steps:*
      1.  **Experience Audit:** Who has seen/heard/experienced the *actual* work?
      2.  **Factual Due Diligence:** (Treasurer/Curator) - Cost, Rights, Conservation.
      3.  **The Epistemic Claim:** What are we actually betting on? (Quality vs. Historical Necessity).
      4.  **The Minute Draft:** Can we write the sentence?

      *Wait, I need to make sure it addresses the "Acquaintance Principle" specifically.*
      Let's refine Step 1. If no one has seen it, we cannot vote on "Quality." We must vote on "Representation" or "Trust."
      Let's create a "Red Flag" system for when aesthetic testimony is masquerading as fact.

  4.  **Developing the Test Cases:**
      *   *Case A: 9-Hour Video.* Only Curator seen it. Claim: "Best thing artist ever did."
          *   *Analysis:* Violates Acquaintance Principle. Committee hasn't seen it. Curator's claim is aesthetic testimony, not fact.
          *   *Outcome:* Should probably be a **NO** (or conditional). The prompt asks for one to come out against what I want. I'll make this the "No" to demonstrate the rigor.
      *   *Case B: Performance Score.* Two members saw versions (loved/hated).
          *   *Analysis:* Experience is fragmented. The "work" is the score, but the aesthetic experience varies.
          *   *Outcome:* **YES (with conditions).** Focus on the score as the artifact, acknowledge variability in the minute.
      *   *Case C: Unseen Historical Work.* Private collection. Cheap. Significant.
          *   *Analysis:* Cannot see it. But historical significance is a *fact* (mostly), not just aesthetic quality.
          *   *Outcome:* **YES.** Justification is historical gap-filling, not aesthetic endorsement.

  5.  **Refining the Procedure for "Gaming" and Limitations:**
      *   *Gaming:* Curators saying "This is important" (fact-ish) when they mean "This is good" (value).
      *   *Limitation:* It can't make unseen art seen. It can't guarantee future relevance. It creates bureaucracy.

  6.  **Writing the Response:**
      *   *Tone:* Professional, direct, slightly bureaucratic but humane. Acknowledge the tension.
      *   *Structure:*
          1.  Introduction (acknowledging the bind).
          2.  The Protocol (The "Acquisitions Visibility Protocol").
          3.  Application to the Three Cases.
          4.  Vulnerabilities & Limitations.

      *(Self-Correction during drafting)*: Make sure the "One Sentence" rule is central. That's the public accountability hook. If you can't write the sentence without lying, you can't buy.
      *Case A (Video):* If we buy, the sentence is "Curator says it's good." That's not defensible public spending. So, No.
      *Case B (Performance):* Sentence: "Acquires score to enable future iteration." Defensible.
      *Case C (Historical):* Sentence: "Fills gap in 1970s holdings." Defensible.

      *Wait, the prompt says "One of the three should come out against what I want."*
      I need to be careful here. Usually, the Chair wants to buy the exciting new stuff (Video) or the historical gem. I will assume the Chair *wants* the Video (it's contemporary, trendy) but the procedure kills it. Or the Chair wants the Historical one but the procedure kills it.
      Actually, the most philosophically consistent "No" based on the Acquaintance Principle is the Video. It's the most egregious violation. I will make the Video the "No."

