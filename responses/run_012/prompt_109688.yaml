answer: |-
  Here is a decision procedure designed for your constraints. It is not a philosophical treatise; it is a workflow to protect the committee from making claims you cannot defend in public minutes.

  ### The Acquisitions Visibility Protocol (AVP)

  **Time Allocation:** 90 Minutes total.
  **Participants:** 5 Committee Members + Curator (non-voting presenter).
  **Rule:** If a proposal fails a step, discussion stops. You either fix the deficit or kill the proposal.

  #### Step 1: The Visibility Audit (15 Minutes)
  *Goal: Establish who has actually experienced the work.*
  **Question:** "Who on this committee has experienced the work in its entirety, in the format we will acquire?"
  *   **Green:** All 5 members have experienced it.
  *   **Amber:** Some members have experienced it (e.g., saw a performance version, but not the video edit).
  *   **Red:** No members have experienced it (e.g., 9-hour video only curator watched, work in private collection).

  **The Stop Rule:** If **Red**, you are forbidden from using aesthetic adjectives ("moving," "masterful," "powerful") in your justification. You must pivot to *historical* or *strategic* justification.
  **Pass Condition:** Consensus on the Visibility Color.

  #### Step 2: The Claim Classification (30 Minutes)
  *Goal: Separate facts from tastes.*
  **Question:** "What is the primary reason for this purchase?"
  The Curator must categorize the argument into one of two buckets. The Committee must agree on the bucket.

  *   **Bucket A (Fact/Strategy):** Provenance, price below market, fills a gap in the collection, artist representation, legal rights secured. *Verifiable by third parties.*
  *   **Bucket B (Aesthetic/Quality):** The work is "significant," "beautiful," "challenging," or "the artist's best." *Dependent on personal experience.*

  **The Stop Rule:** If Visibility is **Red** or **Amber**, you cannot select **Bucket B**. You cannot spend public money on "quality" you haven't witnessed. You must argue **Bucket A**.
  **Gaming Check:** If the Curator says, "It is historically significant because it is so good," challenge the "because." Is it significant because it was exhibited everywhere (Fact)? Or because it moved people (Value)?
  **Pass Condition:** Committee agrees on the Bucket.

  #### Step 3: The Minute Draft (30 Minutes)
  *Goal: Test the public defensibility.*
  **Task:** Before voting, the Chair drafts the one-sentence justification that will go to the city.
  **Constraint:** The sentence must match the Visibility Color and Claim Bucket from Steps 1 & 2.

  *   *If Green + Bucket B:* "Acquired [Work] for its exceptional aesthetic quality as witnessed by the committee."
  *   *If Red + Bucket A:* "Acquired [Work] to fill a historical gap in our [Year/Movement] holdings." (Note: No mention of quality).
  *   *If Red + Bucket B:* **IMPOSSIBLE.** Do not write this. Kill the proposal.

  **The Stop Rule:** If you cannot write a sentence that is both true and defensible without lying, the proposal fails.
  **Pass Condition:** A draft sentence is accepted by the Treasurer and Chair.

  #### Step 4: The Vote (15 Minutes)
  *Goal: Formal approval.*
  **Question:** "Do we approve the acquisition based *only* on the drafted minute?"
  **Pass Condition:** 4/5 votes.

  ***

  ### Application to Your Three Proposals

  Here is how the protocol runs on your current backlog.

  #### 1. The Nine-Hour Video
  *   **Proposal:** Video art, 9 hours duration. Only the Curator has watched it. Curator claims: "It is the best thing the artist has ever done."
  *   **Step 1 (Visibility):** **Red.** No committee member has seen it. (The video expert has not sat through it).
  *   **Step 2 (Claim):** Curator argues **Bucket B** (Quality/Best work).
  *   **Protocol Intervention:** Stop. Visibility is Red. You are barred from Bucket B. You must pivot to Bucket A (Fact/Strategy).
  *   **Pivot Attempt:** Curator argues, "It is the only major video work by this artist available under $20k." (Bucket A).
  *   **Step 3 (Minute Draft):** "Acquired [Work] to secure the only available major video work by [Artist] within budget."
  *   **Committee Reaction:** The Treasurer notes this justifies spending money on *availability*, not *value*. The Committee feels uneasy buying 9 hours of unseen content based solely on scarcity.
  *   **Step 4 (Vote):** **NO.**
  *   **Why:** The protocol forces you to admit you aren't buying quality. Once you admit that, the risk outweighs the strategic gain. The "Acquaintance Principle" holds: you cannot defend aesthetic spending without aesthetic experience.

  #### 2. The Performance Score
  *   **Proposal:** Performance work. You acquire the score and staging rights. Two members saw past iterations (one loved, one hated).
  *   **Step 1 (Visibility):** **Amber.** Partial experience. The "work" is the score, which you can hold, but the experience is variable.
  *   **Step 2 (Claim):** **Bucket A (Strategy/Rights).** You are buying the *right to stage*, not a fixed aesthetic object. The disagreement on quality actually proves the work is generative (a fact).
  *   **Step 3 (Minute Draft):** "Acquired score and rights to [Work] to enable future live iteration and diversify time-based holdings."
  *   **Step 4 (Vote):** **YES.**
  *   **Why:** The minute is honest. It acknowledges the work is a set of instructions (Fact) rather than a fixed image (Quality). The disagreement among members is documented as part of the work's nature, not a failure of the committee.

  #### 3. The Unseen Historical Work
  *   **Proposal:** 1970s conceptual piece. Locked in private collection. Cheap. Historically significant. Nobody can see it before purchase.
  *   **Step 1 (Visibility):** **Red.** Cannot be seen.
  *   **Step 2 (Claim):** **Bucket A (History/Gap).** Significance is established by exhibition history and critical literature, not current committee viewing.
  *   **Step 3 (Minute Draft):** "Acquired [Work] to fill a critical gap in our 1970s conceptual holdings as documented by [Exhibition/Catalogue]."
  *   **Step 4 (Vote):** **YES.**
  *   **Why:** This bypasses the Acquaintance Principle legally. You are not judging its beauty; you are judging its *place in history*, which is a fact verifiable by archives, not eyes. The low price mitigates the risk of the unseen condition.

  ***

  ### Where This Gets Gamed

  You asked where a committee member might launder a taste verdict into a fact. Here are the two vulnerabilities in the AVP:

  **1. The "Historical Significance" Loophole**
  *   **The Move:** A curator wants a work because they love it (Bucket B), but Visibility is Red. They reframe the argument as "This is historically pivotal" (Bucket A).
  *   **The Game:** "Historical significance" is often just "aesthetic quality" dressed up in a suit. If the only evidence of significance is the Curator's say-so, it's still testimony.
  *   **The Counter:** In Step 2, require *external* verification for Bucket A claims. "Significant" means "in 3 public collections" or "in 5 major biennials." If it's "significant" because the Curator says so, it reverts to Bucket B and fails the Red Visibility check.

  **2. The "Budget as Quality" Proxy**
  *   **The Move:** Justifying a Red Visibility purchase because "It's cheap."
  *   **The Game:** This implies a bargain is inherently good. But a cheap bad video is still a bad video.
  *   **The Counter:** The Treasurer must sign off that "Low Cost" is a valid strategic goal for that fiscal year. If the goal is "High Quality," low cost does not justify a Red Visibility purchase.

  ### What This Procedure Cannot Do

  1.  **It Cannot Guarantee Quality:** It protects you from *lying* about quality, not from *buying* bad art. You can still buy a historically significant piece (Case 3) that turns out to be aesthetically dead. The protocol ensures your minutes remain honest, not that your taste is infallible.
  2.  **It Cannot Fix Time:** It does not solve the 9-hour video problem. To buy that, you either need to watch it (commit 45 committee-hours) or admit you are buying it on faith. The protocol forces the latter admission, which usually kills the deal.
  3.  **It Cannot Protect Against Future Obsolescence:** A "gap-filling" acquisition today might be irrelevant in 10 years. The protocol defends the *decision process*, not the *asset value*.

  ### Summary for the Chair
  The protocol shifts your burden. You are no longer judging *beauty* on unseen works; you are judging *risk* and *documentation*.
  *   **Case 1 (Video):** Fails because you cannot defend the spend without the experience.
  *   **Case 2 (Performance):** Passes because you are buying instructions, not an experience.
  *   **Case 3 (Historical):** Passes because you are buying a historical fact, not an aesthetic verdict.

  If you try to buy the Video, you will have to write a minute that says "We bought this because our Curator told us to." If you can't say that to the City Council, you can't buy the video.
