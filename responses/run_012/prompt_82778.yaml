answer: |-
  This argument is well-known in epistemic logic and metaphysics. It is called **Fitch's Paradox of Knowability** (sometimes the Church-Fitch Paradox).

  It was first published by Frederic Fitch in 1963, though it originated from a referee report written by Alonzo Church in 1945. The argument is famous because it appears to refute **semantic anti-realism** (the view that truth is essentially epistemic, i.e., truth cannot outstrip knowability) by showing that it collapses into **idealism** (the view that all truths are actually known).

  Here is a diagnosis of where the joints are, which premises bear the weight, and how the paradox is typically handled.

  ### 1. The Formal Structure
  To see where the pressure points are, it helps to formalize the argument slightly. Let $K$ stand for "It is known by someone at some time that..." and $\Diamond$ for "It is possible that..."

  1.  **The Knowability Principle:** $\forall p (p \to \Diamond K p)$
      *(Every truth is possibly known.)*
  2.  **Existence of Unknown Truths:** $\exists p (p \land \neg K p)$
      *(There is some truth that is not known.)*

  The paradox arises when we test the Knowability Principle against the specific proposition $q = (p \land \neg K p)$.

  3.  Assume $K(p \land \neg K p)$.
  4.  By the distribution of knowledge over conjunction: $K p \land K(\neg K p)$.
  5.  By the factivity of knowledge ($K\phi \to \phi$): $K p \land \neg K p$.
  6.  This is a contradiction. Therefore, $\neg K(p \land \neg K p)$.
  7.  By the necessity of logical truth, it is not even *possible* to know it: $\neg \Diamond K(p \land \neg K p)$.
  8.  By contraposition of the Knowability Principle (1): $\neg (p \land \neg K p)$.
  9.  This is equivalent to: $p \to K p$.
      *(If $p$ is true, $p$ is known.)*

  Thus, the modest principle (1) entails that omniscience is actual. If there are any unknown truths, the Knowability Principle is false.

  ### 2. Where are the Joints?
  You asked whether the weight lies on the "appeal to what is possible" or the "folding of ignorance into the content."

  **The weight lies on the interaction between classical logic and the factivity of knowledge.**

  The specific proposition $(p \land \neg K p)$ is known as a **Moorean sentence** (after G.E. Moore's "It is raining but I don't believe it"). The paradox shows that Moorean sentences are *logically unknowable*. They can be true, but they cannot be *known* to be true, because the act of knowing them falsifies the second conjunct.

  The "joint" that breaks is the assumption that the **Knowability Principle applies unrestrictedly to all propositions**, including those that contain epistemic operators ($K$) within their own content.

  If you accept classical logic, the derivation is valid. Therefore, you must reject one of the following:
  1.  **The Knowability Principle:** (The Realist response) Some truths are inherently unknowable.
  2.  **Classical Logic:** (The Anti-Realist response) The inference from "It is not the case that there are unknown truths" to "All truths are known" is invalid.
  3.  **The Scope of the Principle:** (The Restriction response) The principle only applies to "basic" or non-epistemic truths.

  ### 3. Diagnosing the Solutions

  #### A. The Realist Diagnosis (Surrender the Principle)
  The most common reaction among realists is to accept the paradox as a *reductio ad absurdum* of the Knowability Principle.
  *   **Diagnosis:** The principle "All truths are knowable" is simply false. There are truths that are in principle unknowable (e.g., specific quantum states, counterfactuals about the distant past, or Gödelian sentences).
  *   **Consequence:** Truth is evidence-transcendent. Truth and knowability come apart.

  #### B. The Intuitionistic Diagnosis (Surrender Classical Logic)
  This is the most sophisticated defense of anti-realism, championed by Michael Dummett and others.
  *   **Diagnosis:** The paradox relies on classical negation. In step 8, we derive $\neg (p \land \neg K p)$. In classical logic, this is equivalent to $p \to K p$. However, in **intuitionistic logic**, $\neg \exists x (\phi x)$ does *not* entail $\forall x (\neg \phi x)$ in the same strong sense, and specifically, denying the existence of unknown truths does not commit you to the actuality of omniscience.
  *   **The Move:** The anti-realist can assert "There are no unknown truths" ($\neg \exists p (p \land \neg K p)$) without asserting "All truths are known" ($\forall p (p \to K p)$).
  *   **Consequence:** They treat the Knowability Principle as a constraint on the *concept* of truth, not a description of our epistemic state. The paradox dissolves because the logic no longer forces the collapse of "possibly known" into "actually known."

  #### C. The Restriction Strategy (Narrow the Principle)
  You asked what happens if the principle is narrowed to "truths that do not themselves concern what anyone knows."
  *   **Diagnosis:** This blocks the specific instance $q = (p \land \neg K p)$ because $q$ contains the operator $K$.
  *   **Problem:** This is often criticized as *ad hoc*. Why should the fundamental link between truth and knowledge fail precisely for statements about knowledge? Furthermore, one can construct "Fitch-style" sentences that do not explicitly use $K$ but imply it, or use temporal operators that function similarly.
  *   **Refinement:** Some propose restricting the principle to **decidable** propositions or **basic** observational statements. If $p$ is a basic observation, $(p \land \neg K p)$ is unstable, but perhaps the principle only governs the atomic base of the language.

  ### 4. Addressing Your Specific Proposals

  **"Narrowed... to truths knowable by some finite procedure"**
  If you restrict the principle to computable/decidable truths, you run into **Gödel's Incompleteness Theorems**.
  *   If a system is consistent, there are true statements within it that are not provable (knowable by finite procedure) within that system.
  *   If you define "knowable" as "provable in system S," then the statement "This statement is true but not provable in S" creates a similar paradox.
  *   Restricting to finite procedures essentially admits that there are truths (the undecidable ones) that are *not* knowable by that definition. This surrenders the universal Knowability Principle for that domain.

  **"Narrowed... to truths that do not themselves concern what anyone knows"**
  As noted above, this is the **Type-Restriction** strategy.
  *   **Pros:** It immediately blocks the Fitch derivation.
  *   **Cons:** It weakens the philosophical motivation. The anti-realist wants to say truth *is* knowability. If knowability only applies to a subset of truths (the non-epistemic ones), then for epistemic truths, truth must be something else (e.g., correspondence). This leads to a fragmented theory of truth.
  *   **Stability:** It is difficult to draw a clean line. Is "The number of stars is even" an epistemic truth? No. But "It is verifiable that the number of stars is even" is. If the principle doesn't cover the latter, the scope of anti-realism is significantly reduced.

  ### Summary
  The argument is **Fitch's Paradox of Knowability**.

  *   **The Weight:** The paradox bears down on the **unrestricted universal quantifier** in the Knowability Principle combined with **classical logic**.
  *   **The Diagnosis:** The statement $(p \land \neg K p)$ is a "blindspot" for knowledge. It can be true, but it cannot be known.
  *   **The Surrender:**
      *   **Realists** surrender the Knowability Principle (Truth > Knowledge).
      *   **Anti-Realists** usually surrender Classical Logic (adopting Intuitionism) to prevent the collapse of "possibly known" into "actually known."
      *   **Restrictionists** surrender the universality of the principle (applying it only to non-epistemic base truths), though this is often seen as unstable.

  The paradox remains one of the most significant results in contemporary epistemology because it forces a choice between a robust notion of truth (Realism) and a robust notion of verification (Anti-Realism), with logic itself as the arbiter.
