answer: |-
  ### The Case: County Workforce Development Board

  **Scenario**
  A County Workforce Board is tasked with lifting long-term unemployment into sustainable livelihoods (the **Goal**), a five-year horizon impossible to assess for quarterly budget reviews. Instead, funding is tiered based on the "180-Day Job Retention Rate" (the **Proxy**): the percentage of placed clients still employed at six months. Two mechanisms drive divergence. First, caseworkers (Mechanism 1) occasionally pressure clients to stay in toxic jobs past the 180-day mark or delay paperwork on terminations; auditors catch most of this, making its net impact negligible, yet it consumes all the oversight attention. Second, and critically, local employers (Mechanism 2) learn the Board's funding depends on the 180-day mark. Historically, a 180-day retention signaled a good match. Under the new regime, employers realize the Board will subsidize wages or overlook performance issues to avoid a "failure" at month six. Employers begin hiring placements specifically for five-month projects, firing them at month seven to recycle the subsidy. The caseworkers aren't lying, and the employers aren't breaking laws; both are acting reasonably within the new rules. However, the historical statistical relationship between "180-Day Retention" and "Five-Year Income" collapses because the *type* of employment generating that retention has fundamentally changed.

  **Neighboring Case (Lucas Only)**
  Consider a neighboring county where the Workforce Board has *no* performance funding (no metric target), but the State Government introduces a universal tax credit for *any* business that retains a new hire for 180 days. Employers shift expectations identically: they hire for five-month cycles to capture the credit. The "180-Day Retention" metric becomes equally useless as a predictor of long-term income (the Lucas Critique holds). However, because the Board's funding isn't tied to the number, the Board does not actively steer clients toward these cyclical employers. The metric breaks, but the organization doesn't optimize for the breakage.

  ***

  ### Analysis

  **1. Taxonomy of Goodhart Effects**
  This case utilizes two distinct flavors from the standard taxonomy simultaneously:
  *   **Adversarial Goodhart (Mechanism 1):** The caseworkers manipulating logs. This is the classic "gaming" definition. An agent with an incentive to deceive manipulates the measure ($U$) without moving the goal ($G$). In your spec, this is the "inert" layer—the red herring that satisfies the audience's instinctive definition of Goodhart's Law but contributes little to the actual failure.
  *   **Causal Goodhart (Mechanism 2):** The employer expectation shift. Here, the proxy ($U$) is a downstream effect of the goal ($G$) under the old regime (good matches *cause* retention). Under the new regime, the policy intervenes on the causal pathway. By making retention a target, the policy incentivizes employers to generate retention *without* the match quality. You are intervening on the proxy (via subsidies/pressure) without causing the goal. This is compounded by the **Lucas Critique**: the structural parameter $\beta$ in the equation $Goal = \beta \times Proxy + \epsilon$ is not constant; it shifts because the policy changes the employers' decision rules.

  **2. The Load-Bearing Feature**
  The load-bearing feature is the **public common knowledge of the target threshold**.
  If the Board kept the metric internal, employers would not know to optimize for the 180-day cliff. The divergence relies entirely on the agents (employers) forming rational expectations about the regulator's behavior.
  *   **If you delete this feature:** If the target is secret, the employers do not shift their hiring cycles. The Lucas effect vanishes. The metric continues to track the goal (mostly), and the only remaining failure is the minor caseworker fraud (Adversarial). The catastrophic structural failure disappears.

  **3. Replacement vs. Tracking**
  **Verdict: The proxy has replaced the goal.**
  In the neighboring case (Lucas only), the proxy *stops tracking* the goal, but the organization might still pursue the goal using other heuristics because they aren't funded on the proxy. In your main case, the Board's survival depends on the proxy. They are not merely suffering from a loss of information (tracking failure); they are actively allocating resources to maximize the proxy *at the expense* of the goal (steering clients to cyclical jobs). The organization succeeds precisely *because* it fails the goal. The metric is no longer a map; it is the terrain.

  **4. The Strongest Attack (The "Vague Truism" Critique)**
  A skeptic from the "standard economics" camp will argue: *"This is just a multi-task Principal-Agent problem with incomplete contracts. You defined the contract poorly. 'Goodhart's Law' adds no mathematical rigor that isn't already covered by incentive compatibility constraints. You're just dressing up 'perverse incentives' in philosophical clothing."*

  **Your Defense:**
  The "incentives" argument explains why agents *act* differently (the employer hiring cycle). It does not explain the **epistemic collapse**. Standard incentive economics assumes the principal can observe the outcome of the incentive scheme. Goodhart's Law specifically describes the failure of the *measurement itself* to convey information.
  In the neighboring case, the incentives changed, but the Board could theoretically observe the metric breaking and stop using it. In the Goodhart case, because the metric is the *target*, the Board loses the ability to detect the failure. The metric reports "Success" (high retention) while the system rots. Goodhart describes the specific pathology where the feedback loop is severed not just by action, but by the corruption of the signal itself. It adds the dimension of **informational opacity** to the dimension of **misaligned incentives**. Without the Goodhart lens, you look at the high retention numbers and conclude the policy is working. Goodhart tells you the numbers are now lying.

  **5. Constraint Check & Confession**
  You asked for a case where the adversarial element is "present but basically inert."
  *   **Confession:** In reality, adversarial gaming (caseworker fraud) is rarely truly inert; it usually compounds the structural issue. I have stylized this to meet your spec. In a real reading group, acknowledge this: *"I have artificially suppressed the impact of the fraud to isolate the structural mechanism, but in the wild, these two usually feed each other."*
  *   **Constraint Satisfied:** The Lucas Critique requirement is the hardest lift. I have met it by ensuring the employer behavior change is an *expectation shift* based on the policy regime, not just a cost-benefit analysis of a subsidy. The key is that the *historical data* is rendered useless, not just that the behavior changed.

  **Summary for the Group:**
  Use this to pivot the conversation from "How do we stop people from cheating?" (The Adversarial trap) to "How do we measure things when the act of measuring changes the physics of the system?" (The Lucas/Structural reality). The Workforce Board case shows that even if you eliminate all cheating, you can still destroy the value of your metric simply by making it a target in a system of rational actors.
