answer: |-
  # DIAGNOSTIC TREE: INTERPRETING THE ALLAIS PATTERN

  **The Setup:**
  *   **Problem 1:** Choose **1A** ($1M sure) OR **1B** (89% $1M, 10% $5M, 1% $0).
  *   **Problem 2:** Choose **2A** (11% $1M, 89% $0) OR **2B** (10% $5M, 90% $0).
  *   **The Pattern:** You choose **1A** and **2B**.

  ***

  ### Q1: THE REFLECTION TEST
  **When the independence cancellation is explained to you (subtracting the common 89% branch), do you change your choice to 1B and 2A?**

  *   **YES** $\rightarrow$ **LEAF 1: NORMATIVE EU ("THE MISTAKE")**
      *   *Position:* The Independence Axiom is correct. Your initial intuition was a cognitive error (innumeracy or framing effect) that vanishes under reflection. (Savage's view).
      *   *Status:* **Rationality Preserved.**

  *   **NO** $\rightarrow$ Go to **Q2**.

  ***

  ### Q2: THE DESCRIPTION TEST
  **If the lotteries are rewritten to explicitly show the 89% common consequence as the *same physical ticket* in both options, does your preference for 1A/2B disappear?**

  *   **YES** $\rightarrow$ **LEAF 2: FRAMING / DESCRIPTION DEPENDENCE**
      *   *Position:* Preferences are not defined over final probability distributions (prospects) but over descriptions or acts. The "cancellation" in Q1 is illegitimate because the *context* of the risk changed.
      *   *Status:* **Domain Restriction.** (Violates Reduction of Compound Lotteries).

  *   **NO** $\rightarrow$ Go to **Q3**.

  ***

  ### Q3: THE UTILITY TRAP
  **Do you believe your choice is explained by the diminishing marginal utility of money (a concave $u(x)$)?**

  *   **YES** $\rightarrow$ **🛑 LEAF 3: ARITHMETIC ERROR (DEAD END)**
      *   *Position:* None. This is mathematically impossible under Expected Utility.
      *   *Flag:* **$u(x)$ cancels out.** The Independence Axiom derivation holds for *any* utility function over final wealth. Concavity explains risk aversion (preferring $1M over a 50/50 of $2M/$0), but it cannot generate the Allais reversal. You are conflating *Risk Aversion* with *Independence Violation*.

  *   **NO** $\rightarrow$ Go to **Q4**.

  ***

  ### Q4: THE LOCUS OF NON-LINEARITY
  **What drives the violation? Is it that "100% probability" feels psychologically distinct (Certainty Effect), OR that you care about the gap between what you got and what you *could* have got (Counterfactuals)?**

  *   **PROBABILITIES ("100% is special")** $\rightarrow$ Go to **Q5**.
      *   *(Leads to Non-Linear Weighting)*
  *   **OUTCOMES ("I'd regret missing the $1M")** $\rightarrow$ **LEAF 4: REGRET / DISAPPOINTMENT THEORY**
      *   *Position:* Utility is state-dependent or defined over vectors of outcomes. You prefer 1A to avoid the regret of getting $0 in 1B when $1M was possible.
      *   *Status:* **Axiom False.** (Preference is over acts, not prospects).

  *   **PROBABILITIES** Branch $\rightarrow$ **Q5**.

  ***

  ### Q5: THE NORMATIVITY TEST
  **If a new model (e.g., Rank-Dependent Utility) fits this choice, should we teach agents to *maximize* that model, or just use it to *predict* deviations?**

  *   **TEACH IT ("Maximize Weighted Utility")** $\rightarrow$ **LEAF 5: NORMATIVE NON-EU**
      *   *Position:* The Independence Axiom is substantively false. A&D is rationally permissible. Decision theory needs a new norm.
      *   *Status:* **Axiom False.** (Prospect Theory / Rank-Dependent as rational).

  *   **PREDICT IT ("It's just a bias")** $\rightarrow$ **LEAF 6: DEFLATIONARY DESCRIPTIVISM**
      *   *Position:* Decision theory is a scientific model, not a logic of rationality. The paradox proves EU is descriptively false; whether it is *normatively* false is a separate (or idle) question.
      *   *Status:* **Model Failure.** (EU is false, "Rationality" is undefined).

  ***

  ### ⚠️ OBSERVATIONAL EQUIVALENCE NOTES

  1.  **Leaf 4 (Regret) vs. Leaf 5 (Weighting):** In the standard 2x2 Allais setup, these theories predict the exact same choices. This tree separates them based on your *introspective justification*, not the choice data alone. To separate them empirically, you need "Event Splitting" cases.
  2.  **Leaf 5 (Normative) vs. Leaf 6 (Descriptivist):** These positions often agree on the math but disagree on the philosophy. This tree separates them based on your stance on *pre-commitment* and *teaching*, not the gamble choice itself.
  3.  **Leaf 3 (DMU Error):** This is the most common error in graduate seminars. If you find yourself here, re-derive the Independence Axiom using $u(x)$ generally; you will see the curvature terms cancel.
