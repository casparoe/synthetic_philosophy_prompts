answer: |-
  The principle that generates your verdicts without resorting to a patchwork of probability thresholds is **Bounded Expected Utility with Epistemic Confidence Weighting**, combined with **Risk Aversion over Personal Welfare**.

  This is not a single equation but a framework with three computable components. To use it, you must define a utility function $U(outcome)$, a confidence factor $C(claim)$, and a risk-weighting function $w(p)$.

  ### The Principle

  **1. Bounded Utility (Solves Cases 1, 2, 3, 6)**
  Your utility function for *impersonal* good (lives saved, existential risk reduced) must be bounded. There is a maximum possible value $U_{max}$ that the state of the universe can hold for you.
  *   **Computation:** $U(lives) \approx U_{max} \times (1 - e^{-k \cdot lives})$.
  *   **Effect:** As the number of lives approaches infinity, the marginal utility approaches zero. This prevents the $3 \uparrow\uparrow\uparrow 3$ in Case 1 from overwhelming your decision. It also caps the value of Case 2 and Case 3, making them comparable to costs.

  **2. Epistemic Confidence Weighting (Solves Cases 1, 3, 6, 8)**
  You do not multiply by the stated probability $p$; you multiply by an *effective probability* $p_{eff} = p \times C$, where $C$ is a discount factor based on the complexity and plausibility of the mechanism making the claim.
  *   **Computation:** $C(claim) \propto 2^{-Complexity(Mechanism)}$.
  *   **Effect:**
      *   **Case 1 (Wizard):** Mechanism is magic/extraordinary. $C \approx 0$. $p_{eff} \approx 0$. Refuse.
      *   **Case 3 (Subscription):** Mechanism is proprietary/black-box. $C$ is low (your "half-trust"). $p_{eff}$ drops below the cost threshold. Refuse.
      *   **Case 6 (Physics):** Mechanism is well-understood physics. $C \approx 1$. $p_{eff} = 10^{-40}$.
      *   **Case 8 (Fire):** Mechanism is mundane physics (fire/spinklers). $C \approx 1$. $p_{eff} = 10^{-9}$.

  **3. Concave Utility of Wealth/Personal Welfare (Solves Cases 4, 5, 8)**
  Your utility for money and personal emotional states is concave (risk-averse). You value the first \$1,000 more than the next, and the safety of your loved ones disproportionately more than strangers.
  *   **Computation:** $U(wealth) \approx \log(wealth)$. $U(personal\_loss) \gg U(impersonal\_loss)$.
  *   **Effect:** You buy insurance (Case 5) and reject lotteries (Case 4) because the pain of the loss outweighs the gain of the win, even at equal EV. You pay the cent in Case 8 because the personal utility at stake is near your personal $U_{max}$, making even $10^{-9}$ significant relative to 1 cent.

  ---

  ### Mapping Clauses to Verdicts

  | Clause | Verdicts Supported | Why |
  | :--- | :--- | :--- |
  | **Bounded Utility** | 1, 2, 3, 6 | Prevents infinite leverage in Case 1. Caps the value of Case 2 & 3 so they don't demand infinite resources. Makes Case 6 risk negligible. |
  | **Epistemic Weighting** | 1, 3, 6, 8 | Distinguishes the Wizard (low $C$) from the Physicist (high $C$). Distinguishes the Proprietary Charity (low $C$) from the Fire Risk (high $C$). |
  | **Risk Aversion / Agent-Relative Value** | 4, 5, 8 | Explains Insurance (5) and Lottery (4). Explains why Case 8 (Personal) is accepted while Case 3 (Impersonal) is rejected despite similar EV math. |

  ---

  ### Application to New Cases

  **Case A: The Nuclear War Charity**
  *   **Offer:** $1,000 to reduce nuclear war probability by $10^{-9}$.
  *   **Analysis:**
      *   **Probability:** $10^{-9}$ is significantly higher than Case 3 ($10^{-12}$).
      *   **Mechanism:** "Publicly known" implies higher Epistemic Confidence ($C$) than the proprietary subscription in Case 3.
      *   **Utility:** Nuclear war is near the Impersonal $U_{max}$.
      *   **Cost:** $1,000 is significant but not ruinous (unlike 10% income in Case 2).
  *   **Verdict:** **Subscribe.**
  *   **Reasoning:** Unlike Case 3, the probability is high enough ($10^{-9}$ vs $10^{-12}$) and the mechanism credible enough that the Expected Value ($10^{-9} \times U_{max}$) likely exceeds the disutility of losing $1,000. This is the "sweet spot" of effective altruism.

  **Case B: The Tiny Wizard**
  *   **Offer:** Wizard threatens $3 \uparrow\uparrow\uparrow 3$ torture unless you pay a sum so small you wouldn't notice (e.g., $10^{-10}$ utility cost).
  *   **Analysis:**
      *   **Utility:** Bounded. The threat is at $U_{max}$.
      *   **Probability:** $10^{-40}$.
      *   **Confidence:** Near zero (Magic).
      *   **Computation:** $U_{max} \times 10^{-40} \times C_{magic}$.
  *   **Verdict:** **Refuse.**
  *   **Reasoning:** Even if the cost is negligible, paying establishes a policy that invites exploitation (Case 7 logic), but more importantly, the Epistemic Confidence $C$ on magic is so low that the EV is effectively zero. You do not pay taxes to imaginary governments.

  ---

  ### The Sacrifice: Which Verdict Must Be Abandoned?

  To make this principle respectable rather than a patchwork, you must abandon **Verdict 7 (The Money Pump Justification)** as a *fundamental reason* for your behavior, and you must abandon your **$10^{-6}$ Probability Rule**.

  **1. Abandon the Money Pump Justification (Verdict 7)**
  You wrote: *"That thought does real work in my refusal in case 1, and I suspect it does less than I pretend."*
  Your suspicion is correct. Under **Bounded Utility**, Pascal's Mugging fails on its own merits. You do not need to refuse on principle to avoid being money-pumped; you refuse because the Expected Utility is genuinely low (due to the bound and epistemic discount). Relying on the money-pump argument suggests you believe the EV *is* high but you refuse anyway to protect your algorithm. A respectable agent refuses because the EV *is* low.
  *   **Revision:** Change your internal reasoning for Case 1 from "I must refuse on principle" to "The expected value is negligible."

  **2. Abandon the $10^{-6}$ Heuristic**
  You wrote: *"The rule I have been using on myself is: maximize expected value, but ignore any probability below about one in a million."*
  This rule fails Case 8 ($10^{-9}$) and is arbitrary. A respectable principle uses **continuous discounting** (Epistemic Confidence) rather than a hard cutoff.
  *   **Revision:** Do not ignore probabilities below $10^{-6}$. Instead, discount them based on how extraordinary the claim is. A $10^{-9}$ risk of fire (mundane) counts; a $10^{-9}$ risk of magic (extraordinary) does not.

  **3. The Action Verdict to Reconsider (Case 3)**
  If you are forced to abandon one of the *action* verdicts (1-6, 8) to align with a strictly **Impartial** Bounded Utility function (removing Agent-Relative Weighting), you must revise **Verdict 3**.
  *   **Why:** If the numbers in Case 3 are taken as *fact* (removing the "half-trust" epistemic discount), the Expected Value ($1000$ expected lives saved for $1,000) is comparable to standard EA interventions. Refusing it relies on the "proprietary/half-trust" clause. If you steelman the charity's credibility, a respectable EA principle demands you pay. Your refusal is currently protected by your epistemic skepticism, which is valid, but if that skepticism were removed, the verdict would have to flip.
  *   **However:** Given your stated "half-trust," Verdict 3 is consistent with the Epistemic Confidence clause.

  **Recommendation:**
  Keep your action verdicts (they are wise). Abandon the **$10^{-6}$ Rule** (it is false). Abandon the **Money Pump Justification** (it is unnecessary). Adopt **Bounded Utility with Epistemic Confidence**. This renders your decision-making coherent without requiring you to pay the wizard or ignore the fire risk.
