answer: |-
  Here is the procedure. It is designed to strip away the technical jargon and force the board to confront the wager they are actually making. It treats the Dark Forest theory not as a fact, but as a risk profile that must be cleared before any transmission is authorized.

  ### The Dark Forest Filter (DFF)

  **Pre-Condition:** The board accepts the *Quiet-Sky Premise*: The universe is radio-quiet. We do not know why.

  **Step 1: The Leakage Test (Fact)**
  *   **Question:** Does the signal propagate beyond the intended target or volume of space?
  *   **Criteria:**
      *   *Pass:* Signal is tightly collimated (laser/narrow beam) and side-lobe leakage is below background noise thresholds at 10 light-years.
      *   *Fail:* Signal is omnidirectional, wide-beam, or leakage is detectable by current human tech at 10 light-years.
  *   **Stop:** If **Fail**, proceed to Step 4 (Value Judgment). If **Pass**, proceed to Step 2.
  *   **Why:** Omnidirectional signals announce us to everyone. Narrow signals announce us to *someone*. Both reveal us, but to different audience sizes.

  **Step 2: The Triangulation Test (Fact)**
  *   **Question:** Does the transmission origin allow the recipient to locate Earth?
  *   **Criteria:**
      *   *Pass:* The signal origin is masked, relayed from a distant probe, or the sender accepts that Earth's location is revealed.
      *   *Fail:* The signal originates from Earth or the Solar System.
  *   **Stop:** If **Fail** (Origin is Earth), the proposal moves to Step 3. There is no technical fix for this; it is a binary state.
  *   **Why:** In a Dark Forest scenario, knowing *where* the shot came from is all a predator needs.

  **Step 3: The Content Test (Fact/Semantics)**
  *   **Question:** Does the message content reveal our biological nature, technological level, or intent?
  *   **Criteria:**
      *   *Low Risk:* Prime numbers, physical constants (anonymous).
      *   *Medium Risk:* Images of humans, DNA, maps to Earth.
      *   *High Risk:* Targeted questions about a specific exoplanet (implies we are watching them).
  *   **Stop:** All proposals reach Step 4. This step categorizes the *type* of threat, not the existence of it.
  *   **Why:** Revealing we are biological makes us prey. Revealing we are technological makes us competitors. Revealing we are watching them makes us targets.

  **Step 4: The Silence Wager (Value Judgment)**
  *   **Question:** Why is the sky quiet?
  *   **Options:**
      *   *A (Optimist):* Civilizations are rare or short-lived for natural reasons.
      *   *B (Pessimist):* Civilizations are hiding because broadcasting means death.
  *   **Procedure:** The board must vote. A "No" vote on transmission requires only 51% agreement that Option B is *plausible* (not proven, just plausible).
  *   **Hand-off:** This is where the procedure stops being science. If the board cannot rule out Option B as *impossible*, the risk is non-zero.
  *   **Why:** You are not betting money; you are betting continuity. If Option B is even 1% likely, and the cost is extinction, the bet is irrational.

  **Step 5: The Existential Cap (Fact)**
  *   **Question:** Is the downside of being wrong finite or infinite?
  *   **Criteria:**
      *   *Finite:* We waste money, we look foolish.
      *   *Infinite:* Civilizational collapse, extinction, loss of future generations' agency.
  *   **Stop:** If **Infinite**, the proposal requires unanimous consent *and* a demonstrated survival necessity (e.g., we must ask for help to stop an asteroid).
  *   **Why:** Standard risk assessment breaks when the loss is total. You cannot balance "scientific curiosity" against "non-existence."

  ***

  ### Where the Reasoning Breaks Down

  You need to tell your board where this filter is leaking. There are three places where the logic is dressed-up fear rather than calculation.

  1.  **The Hiding Assumption:** The Dark Forest assumes all civilizations value survival above all else. Some might value contact, art, or religion more. If a civilization is willing to die to speak, the forest isn't dark; it's just quiet. We cannot know alien psychology.
  2.  **The Detection Limit:** We assume listeners can triangulate us instantly. They might not. We assume they have weapons that work at light-speed across stars. They might not. We are projecting our current tech limits onto gods.
  3.  **The "Already Loud" Paradox:** Earth has been leaking radio noise for a century. A deliberate beam is louder, but the difference is a whisper in a hurricane. If the forest is hunting by sound, we are already dead. If they ignore radio noise, a beam is safe. This procedure assumes the beam is the trigger, which might be false.

  ***

  ### Running the Procedure on the Hard Cases

  Here is how the filter processes your two test cases.

  #### Case 1: The Narrow One-Time Beam
  *Target: Specific nearby star with detected planet.*

  *   **Step 1 (Leakage):** **Pass.** It's a tight beam. Side lobes are negligible.
  *   **Step 2 (Triangulation):** **Fail.** It comes from Earth. The recipient knows the signal originates from the Sol system.
  *   **Step 3 (Content):** **High Risk.** Targeting a specific planet proves we have telescopic capability and are interested in them. This marks us as a peer competitor, not just background noise.
  *   **Step 4 (Silence Wager):** **The Sticking Point.** If even one board member believes Option B (they are hiding because it's dangerous) is *plausible*, the vote defaults to caution.
  *   **Step 5 (Existential Cap):** **Infinite.** There is no survival necessity here. It is scientific curiosity.
  *   **Result:** **REJECT.**
  *   **Reasoning:** While technically contained, the message reveals we are watching them. In a Dark Forest, the thing that moves gets shot. Proving we can see them makes us a threat that needs neutralizing before we grow stronger.

  #### Case 2: The Permanent Omnidirectional Beacon
  *Target: Everyone.*

  *   **Step 1 (Leakage):** **Fail.** It goes everywhere.
  *   **Step 2 (Triangulation):** **Fail.** It comes from Earth.
  *   **Step 3 (Content):** **Medium Risk.** "We are here." Announces biology and tech, but not specific targeting.
  *   **Step 4 (Silence Wager):** **The Sticking Point.** Same as above.
  *   **Step 5 (Existential Cap):** **Infinite.** No survival necessity.
  *   **Result:** **REJECT.**
  *   **Reasoning:** This is suicide by definition under the Quiet-Sky Premise. It maximizes the audience of potential predators.

  ***

  ### The Answer You Won't Like

  You asked for the procedure to land on an answer you won't like. Here it is:

  **The procedure renders your foundation obsolete.**

  Under the *Quiet-Sky Premise* combined with the Dark Forest Filter, **no active transmission can ever be approved** unless it is required for immediate species survival.

  The uncomfortable truth isn't that the Beacon is dangerous and the Narrow Beam is safe. The procedure forces you to admit that **the Narrow Beam is morally indistinguishable from the Beacon.**

  Why? Because the penalty for being wrong is the same (extinction), and the probability of safety is unknowable. In risk management, if the cost of failure is infinite, the probability of success must be 100% to proceed. We cannot prove the probability is 100%. Therefore, the only rational decision is silence.

  If you adopt this procedure, you are not deciding *what* to send. You are deciding *not to send*.

  The third case you mentioned—the anonymous math sequence—fails for the same reason. Even if the message is anonymous, the *direction* of the signal points back to the source. You cannot send a message without revealing the messenger's location.

  **The Breakdown:**
  This procedure works only if you accept the Dark Forest theory as a valid risk model. If your board decides the theory is "sci-fi paranoia," the procedure collapses at Step 4. But if you accept the premise that the silence *might* be predatory, you have no mathematical way to discount that risk.

  You are not a review board. You are a firing squad waiting for a reason to pull the trigger. This procedure gives you the excuse to put the gun down. If that's not what your foundation was built to do, you need a new premise, not a new procedure.
