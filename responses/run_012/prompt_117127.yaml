answer: |-
  ### Brainstorm: Design Space & Constraints

  *   **Normative vs. Epistemic:** Selecting a mission metric is a normative political choice (what *should* we value?), while selecting projects is an epistemic problem (what *will* achieve that value?).
  *   **Futarchy Prerequisite:** Prediction markets require a pre-defined utility function to price contracts; they cannot optimize the utility function itself without circularity.
  *   **Liquidity Constraint:** 15 trustees + staff is a "thin market," prone to manipulation and high variance, validating the finance trustee's skepticism.
  *   **Fiduciary Duty:** Legally, the board cannot outsource decision-making authority to an algorithm or market; duty of care requires human deliberation.
  *   **One-Off Problem:** A single decision (n=1) prevents calibration; we cannot know if the market was "right" until too late to adjust the mechanism.
  *   **Metric Conflict:** The fight between "policy influence" and "knowledge production" is the core strategic disagreement; masking it with a mechanism is dangerous.
  *   **Status Quo Risks:** Voting is susceptible to hierarchy bias (chair influence) and lacks incentive compatibility for truth-telling.
  *   **Pilot Value:** Running parallel markets creates a counterfactual history to evaluate market performance without risking capital allocation.
  *   **Cost-Benefit:** Transaction costs of setting up legal markets may outweigh benefits for a $2.4M budget unless streamlined.
  *   **Reputation Risk:** Binding the board to a market outcome that looks arbitrary (due to low liquidity) could damage foundation credibility.
  *   **Time Horizon:** 3-year settlement is long for traders; discounts may reflect impatience rather than probability.
  *   **Aggregation:** Markets aggregate information; votes aggregate preferences. We need both, but for different things.
  *   **Manipulation:** In thin markets, a single trustee could profit by sabotaging a project they dislike personally.
  *   **Hybrid Potential:** Advisory markets can inform voters without binding them, preserving legal authority while gaining epistemic benefits.
  *   **Learning Goal:** The primary value of a pilot is organizational learning about our own decision processes, not immediate efficiency gains.

  ***

  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Grant Allocation Mechanism for FY2025

  **RECOMMENDATION**

  Adopt a **Modified Pilot (Option 3+)**. The Board should explicitly vote to select the success metric prior to any market activity. We then run prediction markets alongside the standard voting process for project selection, but the markets remain **advisory only**. The Board retains final voting authority on grant allocation. We commit to reviewing the correlation between market prices and Board decisions after three years to determine if binding markets are viable in the future.

  **RATIONALE**

  **1. The Metric Choice is Normative, Not Technical**
  The Chair's suggestion that markets should select the metric is conceptually incoherent. Prediction markets estimate the probability of an outcome *given* a value system. To price a contract on "Policy Influence," we must first agree on what counts as influence. If we ask the market to value "Policy Influence" vs. "Citations," we are asking traders to price the Board's own mission. This conflates *what we want* (a political decision for the Board) with *how to get it* (an empirical question for the market). The Board must vote on the metric first.

  **2. Liquidity and Epistemic Quality**
  The Finance Trustee is correct that 15 trustees constitute a thin market. In low-liquidity environments, prices reflect individual whims or manipulation rather than aggregated information. A binding market (Full Futarchy) risks allocating millions based on noise. A pilot allows us to test whether our specific group generates predictive signal without risking capital. If the market prices diverge wildly from expert consensus during the pilot, we know not to bind ourselves later.

  **3. Fiduciary Duty and Legal Authority**
  We are legally liable for these funds. Delegating binding authority to a market mechanism could be construed as abdicating our duty of care. Courts and regulators expect trustees to exercise judgment, not follow algorithmic outputs. An advisory market informs our judgment; a binding market replaces it. The Modified Pilot preserves our legal standing while capturing the informational benefits of the mechanism.

  **4. The One-Off Problem**
  We are making a single portfolio decision, not running a repeated game. We cannot know afterward if the market was "right" unless the metric is immediately observable (it isn't; it's a 3-year lag). However, a pilot is still valuable. It creates a counterfactual: if the market strongly backed a project the Board rejected, and that project succeeds in 3 years, we have evidence of market superiority. If the market backs failures, we have evidence of its limits. n=1 is poor for statistics, but sufficient for organizational learning.

  **THE CASE FOR FULL FUTARCHY (OPTION 2)**

  To be intellectually honest, there is a strong theoretical case for Full Futarchy that we should acknowledge. If we had a trusted, uncontestable metric and a liquid pool of traders, futarchy is superior to voting. Voting incentivizes signaling and coalition-building; markets incentivize truth-telling via profit. In a high-liquidity environment, markets aggregate dispersed information better than committees.

  For Full Futarchy to be the correct choice today, two conditions would need to be true:
  1.  **Metric Consensus:** The Board would need to unanimously agree that the success metric (e.g., citations) perfectly captures our mission, removing the political conflict.
  2.  **Market Depth:** We would need external traders or a significantly larger pool of internal participants to ensure prices are resistant to manipulation.

  Since neither condition holds, Full Futarchy is premature. However, we should structure the pilot so that if these conditions are met in the future (e.g., we expand the trader pool), we could transition to binding markets.

  **TIMELINE & NEXT STEPS**

  *   **Before Thursday's Meeting:** Program Officers to draft two concrete metric definitions (Policy Influence vs. Knowledge Production) with measurable thresholds.
  *   **At Thursday's Meeting:**
      1.  Board votes to adopt one primary metric for the FY2025 cycle.
      2.  Board approves the "Advisory Pilot" structure (markets run parallel to votes, no binding authority).
      3.  Board approves budget for market infrastructure (legal/technical setup).
  *   **Within 30 Days:** Contracts signed with market platform; metric pre-registered publicly.
  *   **Grant Cycle:** Trustees trade on project success probabilities while reviewing proposals. Program Officers present market prices alongside staff recommendations during the final vote.
  *   **36 Months:** Settlement against metric. Board convenes special session to compare market predictions vs. actual outcomes and vote on whether to bind future allocations to market results.

  **Conclusion**
  The conflict on this board is about mission, not mechanism. We should resolve the mission question directly through voting, and use the mechanism to help us achieve it. The Modified Pilot respects our legal obligations, validates the liquidity concerns, and keeps the door open for innovation without gambling the endowment.
