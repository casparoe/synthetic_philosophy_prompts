prompt: |-
  I'm taking a theory of computation course and there's this one line everyone treats as load-bearing: if something is computable at all, then some Turing machine can compute it. Last week it came up twice in the same seminar doing two totally different jobs. First, someone used it to shut down a question about whether you could build a machine that actually solves the halting problem for real machines — like, no, because 'computable' just means Turing-computable, end of story. Then later someone used it the other way, to argue the brain can't do anything a laptop can't do even in principle, since whatever the brain is up to has to be computable and therefore Turing-computable. And our TA just shrugged and said the whole thing is really a definition, so it's true by fiat and there's nothing to argue about. That doesn't sit right with me — people clearly think they're making a substantive claim about the world, not just choosing how to use a word.

  Could you lay out for me the different precise claims that one sentence could actually be making, going from the boring/stipulative readings up to the ambitious ones, and say for each whether it's true by definition, a substantive-but-defensible claim, or something probably false / that we're not really in a position to know? I especially want to know which reading is in play when the line gets used to rule out hypercomputation or to say the brain must be doing something no computer can, and which reading (if any) would justify my TA saying it's trivially true. Lay it out as a menu with a verdict on each rather than picking one and defending it, because I think the whole confusion is that different people are quietly using different readings of the same sentence. Also — does it change anything whether we're asking about what's computable by an ideal agent with unlimited time and paper, versus what any real physical device could ever actually do? I have a feeling thats where the real action is but I can't quite articulate it, and I'd like the answer to tell me which of the readings turn on that distinction and which don't.
