answer: |-
  **Title:** Names in Context: A Substitutional Reading of Gongsun Long's *White Horse Dialogue*

  **Research Question**
  Does the central thesis of the *White Horse Dialogue* ("A white horse is not a horse") function primarily as an ontological claim about the distinction between kinds, or as a logical claim regarding the failure of substitutivity for names within intentional contexts (such as seeking or requesting)?

  **Problem Statement**
  The standard interpretation of Gongsun Long's dialogue treats the text as a dispute over class inclusion or identity. On this reading, the proposition "A white horse is not a horse" is resolved by distinguishing between the extension of the term "horse" (all horses) and "white horse" (a subset). While this explains the conclusion, it renders several of the dialogue's specific arguments peripheral or rhetorical. Specifically, the argument concerning "seeking" (a person seeking a horse accepts a brown one; a person seeking a white horse does not) is typically treated as a mere illustration of the class distinction.

  I suspect this framing inverts the text's actual priority. The "seeking" argument is not an illustration of an ontological truth but the evidence for a logical rule: names cannot be substituted *salva veritate* within contexts of desire or request, even when one name denotes a sub-kind of the other. If this is correct, the dialogue is not primarily about what exists (metaphysics), but about how names behave in specific linguistic environments (logic of *ming*).

  **Methodology**
  Given the constraint of working with English translations, my research will focus on the logical structure of the arguments rather than philological reconstruction. I will proceed in three steps:

  1.  **Argument Reconstruction:** I will isolate the distinct arguments within the dialogue (e.g., the "Seeking" argument, the "Shape/Color" argument, and the final argument regarding "colored vs. uncolored" horses).
  2.  **The Substitution Test:** I will analyze each argument to determine if it is valid under a "Substitution Reading." This involves testing whether the premises support the conclusion if we assume the rule is: *Term A cannot replace Term B in context C.* I will check if this reading licenses the conclusions without requiring extra ontological assumptions about universals.
  3.  **Consistency Check:** I will examine the latter section of the dialogue concerning horses that lack color. I will determine if the substitution reading applies here as well, or if this section forces a shift to a separate metaphysical thesis.

  **Criteria for Success and Failure**
  A successful interpretation must maximize the number of arguments that are logically valid without contradiction.
  *   **Success:** The Substitution Reading renders the "Seeking" argument the structural core of the text, explains the "Shape/Color" distinction as a condition for substitution, and accommodates the "colored/uncolored" section without positing a second, unrelated thesis.
  *   **Failure:** The Substitution Reading requires forcing the text into modern logical categories that distort the original meaning, or it fails to explain the final conclusion ("White horse is not horse") as convincingly as the Class Reading. If the "colored/uncolored" section proves incompatible with the logic of seeking, the proposal that the text has a *unifying* thought will fail.

  **Scope and Feasibility**
  As a high school student relying on translations, I cannot engage with the textual variants or classical grammar that professional sinologists might. Therefore, I will limit my scope to the internal coherence of the arguments as presented in two standard English translations. I will not attempt to situate Gongsun Long within the broader Mohist Canon or later Daoist critiques, focusing strictly on the *White Horse Dialogue* as a self-contained logical puzzle. This project is feasible within the seminar timeframe because it relies on close reading and logical analysis rather than external historical research. The goal is not to settle the centuries-old debate on Gongsun Long, but to demonstrate whether the "substitution" hypothesis offers a more unified explanation of the text's specific argumentative moves than the standard "class" hypothesis.
