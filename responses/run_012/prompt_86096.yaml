  I'm a retired behavioural ecologist who's recently got into philosophy, and I've been trying to get my head round Molinism. The idea, as I understand it, is that God has three sorts of knowledge: natural knowledge of everything that could be the case, middle knowledge of what every possible free creature would freely choose in any set of circumstances, and free knowledge of what actually happens once God decides what to create. The middle bit is supposed to be true before God's creative decision, which is what lets Molinists say God can set up the world so that free creatures do what He wants without causing them to do it. Critics say this is either incoherent or just collapses into something else. The argument has been going for centuries, everyone knows everyone's moves, and nobody seems to budge. Is this a genuine metaphysical disagreement about whether counterfactuals of creaturely freedom can be true before the creature exists, a verbal one about what 'knowledge' or 'prior' means, or two seperate questions -- one about God's relation to possibility, one about human freedom -- wearing a single heading? A friend suggested thinking of middle knowledge as a giant lookup table indexed by creature-and-circumstances pairs, with the whole row already filled in before the creature exists; I can't tell if that's a helpful way in or a distortion. I'd like a diagnosis, not a verdict on who's right, using what each side actually says. What would count as progress here -- a distinction, a formal result, a change of question -- and what wouldn't? No citations or reading lists, please; I'm definately after the shape of the disagreement, not the literature. Please structure it as: 'Bottom line' (two or three sentences at the top), 'The dispute in plain terms' (one short paragraph), 'The real fault line' (about 300-400 words), 'What would count as progress' (about 200 words), and 'What wouldn't' (a short paragraph).
