  Bottom line
  This is a substantive metaphysical disagreement about truthmakers, not a verbal dispute or two separate questions. The 'lookup table' analogy is heuristically useful but obscures the grounding problem.

  The dispute in plain terms
  The debate asks whether facts about what free creatures would do exist before those creatures are created, without those facts forcing the creatures' hands. Molinists say yes, allowing God to know the future without causing it. Critics say no, arguing that such facts either don't exist yet or must be caused by God, which undermines freedom. It is a clash between how we understand truth and how we understand choice.

  The real fault line
  The core tension isn't about the definition of knowledge, but about the metaphysics of truth and the architecture of reality. Molinists assert that Counterfactuals of Creaturely Freedom (CCFs) are true prior to God's decree, yet not determined by Him. Critics invoke the Principle of Bivalence and Truthmaker Theory: for a proposition to be true, something in reality must make it true. This is the "Grounding Objection." If the truth of "If created, Peter would deny Christ" is grounded in Peter, Peter must have some ontological status before creation, which seems incoherent. If it is grounded in God's decree, Peter isn't free. Molinists typically respond that CCFs are "brute facts" requiring no further ground, or that the truthmaker is the possible creature itself in a non-existent state.

  Your friend's "lookup table" analogy captures the Molinist intuition perfectly: the data exists independently of the system running it. It visualizes logical priority without temporal sequence. However, it distorts the metaphysical cost. A lookup table implies pre-existing data storage. In Molinism, there is no storage medium prior to creation except God's mind. If the data is in God's mind, is it dependent on Him? If it is independent, does it constrain Him? The disagreement is therefore substantive: it is a clash between a robust libertarian view of freedom (which requires ungrounded CCFs) and a robust view of divine sovereignty or metaphysical coherence (which requires grounded truths). It is not merely verbal, because both sides agree on the definitions but disagree on whether such a state of affairs is metaphysically possible. It is also not two separate questions, because the account of freedom dictates the account of truth. The stalemate persists because each side prioritizes a different metaphysical intuition: one prioritizes the integrity of free choice, the other the integrity of truthmaking. Until there is agreement on whether truth requires a ground, or whether freedom requires ungrounded possibilities, the debate remains a collision of foundational axioms rather than a solvable puzzle. Furthermore, treating it as verbal ignores that both sides accept classical logic; they disagree on its application to non-existent entities. Treating it as two questions fails because the solution to the freedom problem (libertarianism) creates the knowledge problem (uncertainty), which Molinism attempts to solve with Middle Knowledge. You cannot separate the epistemology from the ontology here.

  What would count as progress
  Progress would require moving beyond stalemate by refining the underlying metaphysical frameworks rather than rearguing historical positions. A significant step forward would be a formal semantics for counterfactuals that accommodates libertarian freedom without violating truthmaker principles, perhaps by revising what counts as a 'truthmaker' for modal claims. Alternatively, progress might come from distinguishing logical priority from ontological dependence more rigorously, showing how a proposition can be true without a causal ground. Another productive avenue is shifting the burden of proof: demonstrating that the 'brute fact' option is no less coherent than the 'grounded fact' option in other metaphysical contexts, thereby neutralizing the Grounding Objection as a unique defeat for Molinism. Finally, isolating whether the disagreement concerns God's nature or time itself could help. If temporal, a tenseless theory might resolve it; if theological, a revised doctrine of simplicity might help. Progress looks like a new conceptual tool that allows both sovereignty and freedom to coexist without requiring one side to abandon their core metaphysical intuition about truth or agency. It requires a structural change in the debate, not just a restatement of positions. Additionally, exploring whether divine knowledge functions differently than human propositional knowledge could dissolve the epistemic tension. If such knowledge is non-propositional, the requirement for pre-existing truth values might vanish.

  What wouldn't
  Progress would not come from historical exegesis of Molina or Luther, as the logical structure of the argument is now independent of its origins. Nor would verbal stipulations help; defining 'knowledge' differently merely shifts the problem without solving the metaphysical tension. Simply asserting that God is 'outside time' without explaining how that affects truthmakers is also insufficient, as it sidesteps the logical priority issue.
