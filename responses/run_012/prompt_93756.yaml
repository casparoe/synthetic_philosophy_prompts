      *   **Counterpart Theory (CT):** Individuals are world-bound. "Possibility" is analyzed via similarity relations to counterparts in other worlds. "I could have won" means "A counterpart of me won."
          *   *Challenge:* Intuition pump (why care about the counterpart?).
