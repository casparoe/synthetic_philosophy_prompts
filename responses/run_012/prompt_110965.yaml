answer: |-
  # Question-Period Prep Sheet: Population Ethics in the Clinic

  **Context:** Medical School Bioethics Colloquium.
  **Goal:** Defend a consent-based, terms-of-creation asymmetry without triggering ableist alarms or philosophical incoherence.
  **Strategy:** Do not fight on abstract population ethics ground. Fight on *clinical applicability* and *conceptual coherence of consent*.

  ---

  ### 1. The Disability Distinction Collapse (Disability Studies Scholar)
  **Likelihood:** Very High | **Damage:** Critical
  **The Objection:** "You draw a bright line between the fetus with chronic pain and the fetus with the socially disabling condition. But pain is also mediated by social response, and social disability often produces somatic suffering (stress, anxiety, lack of care). If the 'suffering load' is partly a function of the social arrangements you claim to bracket, aren't you just medicalizing disability under a new name? You're telling parents that a life with *our* kind of suffering is okay, but *that* kind is not. Who gets to draw that line?"

  **The Reply (2 mins):** "I grant the social model's insight that disability is exacerbated by exclusion. My argument doesn't deny that. It distinguishes between suffering that is *contingent* on social response and suffering that is *constitutive* of the biological condition regardless of social optimization. The chronic pain case involves nociceptive suffering that persists even in a utopia of accommodation. The social disability case involves barriers that are, in principle, removable. My constraint targets the former: the 'unavoidable load.' I am not saying disabled lives are worse; I am saying that creating a life *guaranteed* to involve unmitigatable physical agony is a different moral category than creating a life that will face social headwinds. The line isn't between 'disabled' and 'not,' it's between 'suffering we can fix' and 'suffering we cannot.'"

  **Candid Note:** This is soft. The line between "constitutive" and "contingent" suffering is notoriously blurry (e.g., is depression constitutive or contingent?). You are relying on a medicalized definition of pain that disability scholars reject.
  **Concede Up Front?** No. If you concede the line is blurry, the constraint becomes unworkable. Hold the distinction but acknowledge the epistemic difficulty in applying it.

  ### 2. The Incoherence of Non-Existent Consent (Kantian)
  **Likelihood:** High | **Damage:** Critical
  **The Objection:** "You hang the entire asymmetry on 'unconsented suffering.' But consent requires a subject. There is no subject prior to conception to bear the right you claim is violated. You are using the language of autonomy to ground a duty, but you have no autonomously existing agent to whom the duty is owed. Is this not just 'hypothetical consent' dressed up as actual consent? If it's hypothetical, aren't you just imputing your own valuation of suffering onto a non-existent being?"

  **The Reply (2 mins):** "It is not hypothetical consent in the standard sense, where we ask what a rational agent *would* choose. It is a constraint on the *power* of the creator. When I create a being, I exercise authority over them. In all other contexts, exercising authority without consent requires justification. Here, justification is impossible because the subject cannot grant it. Therefore, the burden shifts: I cannot impose a heavy burden without consent. I am not claiming the non-existent child *said* no. I am claiming that the act of imposition without the possibility of consent is morally hazardous, specifically when the imposition is a 'load' of suffering. The wrong isn't violating a prior right; it's the unilateral imposition of a heavy cost."

  **Candid Note:** This is your philosophical weak point. You are stretching the concept of "wronging" beyond the person-affecting view's usual limits. A sharp Kantian will smell a contradiction: you can't have a duty *to* someone who doesn't exist.
  **Concede Up Front?** No. But be ready to admit this is a "quasi-right" or a "proxy constraint" rather than a standard Kantian duty.

  ### 3. The "Hope Nobody Asks" Question (Non-Identity Resurgence)
  **Likelihood:** Low | **Damage:** Fatal
  **The Objection:** "If the 'terms of creation' are genetic or constitutive of the specific embryo, then changing the terms means creating a *different* child. If you don't create this child with this pain, *this* child never exists. So how can you say *this* child is wronged by the terms? You are comparing existence-with-pain to non-existence. You said you wouldn't do that. But if the alternative to 'these terms' is 'no person,' haven't you just smuggled the forbidden comparison back in?"

  **The Reply (2 mins):** "I am not comparing existence to non-existence. I am comparing the *act of creating* under Condition A versus the *act of creating* under Condition B. If Condition A involves an unconsented heavy load, the act is impermissible. The alternative isn't 'this child without pain'; the alternative is 'I do not exercise the power to create under these terms.' The wrong is in the exercise of creative power, not in the comparative welfare of the subject. I am restricting the *license to create*, not weighing the *value of the life*."

  **Candid Note:** This is the kill shot. If they press that "restricting the license to create" *just is* preventing the existence of the only possible subject, you are back to Parfit.
  **Concede Up Front?** No. Hope they don't ask. If they do, stick to the "constraint on power" language rigidly.

  ### 4. The Bedside Actionability Problem (Clinical Ethicist)
  **Likelihood:** High | **Damage:** Moderate
  **The Objection:** "This sounds elegant, but I have a consult tomorrow with a couple carrying a fetus with Trisomy 18. They want to know if continuing the pregnancy is 'wrong.' Your constraint is *pro tanto*. What does that tell me? Do I tell them they are morally prohibited? If I tell them that, I'm violating non-directiveness. If I don't, what work is your theory doing? How do I translate 'unconsented suffering load' into counseling language?"

  **The Reply (2 mins):** "It doesn't give you a prohibition to deliver to the family. It gives you a framework for *your own* ethical analysis of the options. You don't tell the family 'you are wronging the child.' You use the constraint to validate the gravity of their dilemma. It supports the permissibility of termination in high-suffering cases without requiring you to claim the future life is 'not worth living.' It shifts the conversation from 'is this life worth it?' to 'is this burden one we should impose?' That is a subtle but crucial difference in counseling. It allows you to support termination without devaluing the disabled."

  **Candid Note:** Clinicians hate "frameworks" that don't yield algorithms. You are asking them to hold a nuanced moral distinction in a high-stress conversation.
  **Concede Up Front?** Concede that it is not an algorithm. "This is not a checklist; it's a guardrail."

  ### 5. The Expressivist Objection (Disability Studies Scholar)
  **Likelihood:** Moderate | **Damage:** High
  **The Objection:** "Even if you distinguish pain from social disability, what message does this send to existing people with chronic pain or disabilities? If we say it is wrong to create lives with certain 'loads,' does that not imply that living with those loads is a mistake? You might avoid antinatalism, but you risk expressivism: that the world would be better without people like my constituents."

  **The Reply (2 mins):** "The expressivist objection assumes that judging the *act of creation* judges the *value of the person*. I reject that. I can believe it was risky or unfortunate that I was born with a predisposition to X, without believing I should not exist now. We make this distinction in other contexts: we can regret a risky pregnancy that resulted in a beloved child, without regretting the child. My constraint is forward-looking about the *imposition of burden*, not backward-looking about the *worth of the resulting person*."

  **Candid Note:** This is emotionally resonant but logically fragile. Many disabled activists *do* feel that prenatal selection judgments devalue them.
  **Concede Up Front?** Acknowledge the risk. "I know this language is dangerous. That is why the constraint must be narrow."

  ### 6. The Uncertainty Threshold (Health Economist)
  **Likelihood:** Moderate | **Damage:** Moderate
  **The Objection:** "You talk about a 'heavy load.' Medicine is probabilistic. Phenotypes vary. If there's a 40% chance of severe pain and a 60% chance of mild pain, does your constraint trigger? Are we maximizing expected suffering? If you set a threshold, isn't that just a QALY cutoff with extra steps? How do you calculate the 'consent' risk under uncertainty?"

  **The Reply (2 mins):** "It is not a QALY cutoff because I am not aggregating goods and bads. I am looking for a specific risk profile: the risk of *unmitigatable* severe suffering. If the probability of that specific outcome crosses a threshold of reasonable expectation, the constraint engages. It's not expected utility; it's risk avoidance of a specific moral hazard. I'm not asking you to maximize welfare; I'm asking you to avoid a specific category of imposition."

  **Candid Note:** You haven't defined the threshold. The economist will press you on where the line is.
  **Concede Up Front?** Concede that the threshold is context-dependent and cannot be mathematically fixed in the theory.

  ### 7. Violation of Non-Directiveness (Clinical Ethicist)
  **Likelihood:** Moderate | **Damage:** Moderate
  **The Objection:** "In genetic counseling, we strive for non-directiveness. We provide information, not moral verdicts. Your argument concludes there is a 'constraint against creating.' That sounds like a verdict. If I use your language, am I not steering the couple toward termination by framing continuation as a moral violation?"

  **The Reply (2 mins):** "There is a difference between a moral verdict on the *parents* and a moral description of the *act*. My paper argues the act has a moral weight. How you communicate that is a matter of clinical skill. You can say, 'Some ethical frameworks suggest this imposes a significant burden,' without saying, 'You must not do this.' My theory clarifies *why* the burden matters, not *how* you must coerce the patient."

  **Candid Note:** This is a dodge. In practice, framing an act as "wronging the child" is inherently directive.
  **Concede Up Front?** Concede that it risks being directive. "It requires careful phrasing to avoid coercion."

  ### 8. Epistemic Authority (General/Disability)
  **Likelihood:** Low | **Damage:** Low/Moderate
  **The Objection:** "Who decides what counts as a 'heavy load'? You? The doctor? The parents? If the parents say they are willing to bear the load to have this child, does your constraint override their judgment? You seem to be claiming an objective authority on suffering that overrides the family's values."

  **The Reply (2 mins):** "It is a *pro tanto* constraint, not an absolute veto. It can be overridden by significant countervailing reasons, including parental commitment and capacity to care. However, it sets a default presumption. We do this in child protection: parents have authority, but not unlimited authority to impose harm. I am suggesting a similar baseline for creation."

  **Candid Note:** This invites state intervention analogies which scare clinicians.
  **Concede Up Front?** Emphasize "pro tanto." It is a weight, not a wall.

  ### 9. Hypothetical vs. Rational Consent (Kantian Follow-up)
  **Likelihood:** Low | **Damage:** Moderate
  **The Objection:** "If the consent is impossible, you must be relying on what a rational agent *would* consent to. But many people with chronic pain say they are glad to be alive. If the actual person, once existing, consents to their life, doesn't that retroactively validate the creation? Your constraint seems to ignore the actual testimony of disabled people."

  **The Reply (2 mins):** "Retroactive consent doesn't validate the initial imposition. If I lend you money without asking, and you later say 'I'm glad I have it,' I still violated the protocol of asking. The wrong is in the *initial unilateralism*, not the final outcome. The fact that many adapt and find meaning is wonderful, but it doesn't erase the fact that they were saddled with a burden they couldn't refuse."

  **Candid Note:** This sounds paternalistic. "I know you're happy, but you shouldn't have been born this way."
  **Concede Up Front?** Be careful. Acknowledge the resilience of disabled people. "Their adaptation is a testament to them, not a justification for the imposition."

  ### 10. QALY Equivalence (Health Economist Follow-up)
  **Likelihood:** Low | **Damage:** Low
  **The Objection:** "If you forbid creating lives with high suffering loads, and you allow creating lives with low suffering loads, aren't you implicitly ranking lives? That's exactly what QALYs do. You're just using 'consent' to hide the utility calculation."

  **The Reply (2 mins):** "QALYs measure the *value* of the life. My constraint measures the *risk of the imposition*. I can say 'imposing this pain is wrong' without saying 'this life has negative value.' One is about the entry condition; the other is about the aggregate worth. I am trying to decouple those."

  **Candid Note:** Economists will find this distinction semantic.
  **Concede Up Front?** No. Insist on the deontological vs. consequentialist distinction.

  ---

  ### The "Hope Nobody Asks" Question
  **Question:** "If the 'terms of creation' are essential to the identity of the child (as they are in genetic cases), then avoiding the 'terms' means avoiding the *child*. Doesn't this collapse back into the Non-Identity Problem? You claim to be person-affecting, but if the person affected only exists *with* the harm, in what sense are they wronged compared to the alternative?"
  **Why I hope they don't ask:** This targets the philosophical engine of the paper. If the "terms" are inseparable from the "person," then a constraint on terms is a constraint on the person's existence. If it's a constraint on existence, I am comparing existence to non-existence, which I explicitly promised not to do. Answering this requires a metaphysical distinction between "essential properties" and "imposed burdens" that is very hard to sustain under cross-examination. If I fumble this, the core theoretical contribution evaporates.

  ### Critical Exchange for Survival
  **The Exchange:** **Objection #2 (The Incoherence of Non-Existent Consent).**
  **Why:** The Kantian in the room (and likely the philosophically inclined clinicians) will seize on the "consent" language. If you cannot defend the coherence of "consent" for non-existents, your mechanism for the asymmetry dissolves. If the mechanism dissolves, you are left with a bare intuition that "suffering is bad," which the Disability Scholars will dismantle as ableist. You must prove that "consent" here is a valid metaphor for "moral authority," not a literal contractual claim. If you lose this, you lose the "person-affecting" shield.

  ### Weakest Part of Your Position
  **The Weakness:** **The coherence of "consent" for non-existents.**
  **Defense Strategy:** Do not try to prove it is *literal* consent. Argue it is a **fiduciary constraint**. When we create dependents, we assume a fiduciary role. Fiduciary duties exist prior to the beneficiary's capacity to consent (e.g., infants). You are extending this fiduciary duty to the *moment of entry*.
  **Preparation:** Be ready to distinguish between "rights of the non-existent" (which you deny) and "duties of the creator" (which you affirm). The duty exists regardless of the subject's capacity to claim it. If you conflate these, the Kantian will eat you alive.
