answer: |-
  # Q&A Prep Sheet: Conventions, Claims, and Culture

  **Strategy Note:** Your core distinction (Load-bearing vs. Decorative) is sharp but vulnerable to the claim that *all* social norms are load-bearing because they all mediate expectations. Your defense must rest on the **source** of the claim (harm/reliance vs. belonging), not the **effect** of violation. Do not defend the terminology; defend the underlying distinction. Concede quickly on empirical premises (e.g., how tipping functions economically) to save the normative framework.

  ---

  ### The Objections (Ordered by Damage Potential)

  #### 1. The Equilibrium Collapse (Behavioral Economist)
  **The Question:** "You classify tipping as 'decorative' because it's a convention, but in the US context, it's a substitute for wages. If visitors treat it as decorative and deviate, the equilibrium collapses and servers starve. Doesn't that make it load-bearing by definition? Is 'decorative' just your name for 'low-stakes equilibrium'?"
  **The Reply:** "I concede that where the convention *constitutes* the wage, it is load-bearing. My claim isn't that tipping is always decorative, but that the *obligation* arises from the server's reliance on that income (a determinate claim), not from the 'custom of tipping' itself. If the server were paid a living wage and tipping were purely a bonus for excellence, violating the convention would be decorative—rude, perhaps, but violating no claim. The distinction tracks the underlying reliance, not the surface behavior."
  **Soft Spot:** You rely on the empirical claim that we can separate the "custom" from the "wage structure." In practice, they are fused.
  **Concede Up Front:** "If the convention is the mechanism of payment, it is load-bearing. I should have been clearer that 'decorative' applies only where the economic claim is already satisfied."

  #### 2. The Tacit Promise (Normative Ethicist: Promising)
  **The Question:** "You say cultures aren't right-holders. But when I enter a local practice, don't I implicitly promise to abide by its rules to facilitate coordination? Isn't the obligation to the 'culture' actually an obligation to the participants generated by my voluntary entry?"
  **The Reply:** "I agree there is an obligation, but the source matters. If it's a promise, it's binding because of the *promise*, not the *custom*. My argument is that 'When in Rome' is often invoked even where no promise is plausible (e.g., a tourist passing through). I'm isolating the normative force of the convention itself. If the only reason to comply is a tacit promise, then the 'custom' is doing no normative work; the promise is. I want to know what work the custom does *absent* consent."
  **Soft Spot:** Distinguishing between "custom as the content of the promise" and "custom as the source of obligation" is subtle and may look like hair-splitting.
  **Concede Up Front:** "I concede that voluntary participation often generates obligations via consent. My target is the residual obligation people feel even when participation is non-voluntary or non-consensual."

  #### 3. The Claim to Recognition (Anthropologist)
  **The Question:** "Calling a norm 'decorative' assumes its only point is efficiency. But rituals of hospitality and exchange mediate claims to dignity and recognition. If I refuse to tip or queue, I'm not just saving money; I'm denying the other person's status. Isn't that a determinate claim you're missing?"
  **The Reply:** "That is a powerful point, and it suggests my 'decorative' category is too thin. If a convention mediates a claim to recognition, it *is* load-bearing on my definition. I would classify that as load-bearing. However, I want to preserve a category for purely symbolic markers—like which hand you eat with—where no dignity claim is at stake. The risk is conflating 'I am offended' with 'I have a claim.' I need to distinguish hurt feelings from normative claims."
  **Soft Spot:** The line between "hurt feelings" and "claim to recognition" is notoriously difficult to draw.
  **Concede Up Front:** "I concede that many norms I labeled 'decorative' may actually be load-bearing because they carry recognition claims. I will narrow the 'decorative' category to purely symbolic markers with no dignity component."

  #### 4. Reliance and Estoppel (Legal Scholar)
  **The Question:** "In private law, custom creates reasonable expectations. If a server expects a tip based on local custom, they have a reliance interest. Does your view imply that custom can never crystallize into a right, even when actors have structured their lives around it?"
  **The Reply:** "Not never. But the right stems from the *reliance*, not the *custom*. Custom is merely the evidence of the expectation. If I know you rely on me, I owe you, regardless of whether there is a local custom. My view prevents the reification of 'custom' into a mystical right-holder. The law incorporates custom because it signals reliance, not because 'tradition' has rights."
  **Soft Spot:** Legal systems often treat custom as a *source* of right, not just evidence of reliance.
  **Concede Up Front:** "I concede that legally, custom often functions as a source of right. I am making a moral philosophical claim about the *ground* of that right, not its legal enforceability."

  #### 5. Blameworthiness vs. Obligation (Normative Ethicist: Practices)
  **The Question:** "If a visitor violates a load-bearing norm, you say they violate a claim. If they violate a decorative one, you say they don't. But in both cases, we blame them. Have you simply relabeled 'strong social sanction' as 'load-bearing' and 'weak sanction' as 'decorative'?"
  **The Reply:** "No, because blameworthiness can be misplaced. We might blame someone for eating with the left hand (decorative), but on my view, that blame is normatively unjustified—it's just social pressure. I am trying to filter out the noise of social sanction to find the signal of moral obligation. Just because a community *enforces* a norm doesn't mean the norm *binds* morally."
  **Soft Spot:** If your theory says our intuitive blame is wrong in many cases, the theory becomes revisionist and less useful.
  **Concede Up Front:** "I concede my view is revisionist. It implies we are often wrong to blame visitors for violating decorative norms."

  #### 6. Signaling and Trust (Behavioral Economist)
  **The Question:** "Decorative norms often function as signals of trustworthiness. If you don't follow the dress code or the greeting ritual, you signal you aren't a cooperative type. That has economic consequences for the group. Doesn't that make the norm load-bearing via indirect reciprocity?"
  **The Reply:** "That turns the decorative norm into an instrumental means to a load-bearing end (trust). But the obligation is to not deceive or harm the group's cooperation, not to follow the dress code *per se*. If I can signal trustworthiness another way, the decorative norm drops away. The norm is a heuristic, not the obligation itself."
  **Soft Spot:** If the heuristic is the only reliable way to signal, the norm becomes functionally mandatory.
  **Concede Up Front:** "I concede that where the convention is the *only* low-cost signal of cooperation, it acquires load-bearing status instrumentally."

  #### 7. The Epistemic Burden (General/All)
  **The Question:** "Even if your distinction holds theoretically, how is a visitor supposed to know which norms are load-bearing and which are decorative? If they guess wrong on tipping, someone goes hungry. Doesn't the uncertainty create a precautionary obligation to follow all customs?"
  **The Reply:** "This is a practical, not theoretical, objection. A precautionary principle might apply, but it's distinct from the obligation to the custom itself. It's an obligation to avoid risk of harm. I agree visitors should err on the side of caution, but that doesn't mean the decorative custom *itself* was binding, only that the risk of mistake was too high."
  **Soft Spot:** This effectively swallows the rule. If you must always follow the custom to be safe, the distinction loses practical guidance.
  **Concede Up Front:** "I concede that for a visitor, the epistemic burden often requires complying with decorative norms to avoid risking load-bearing violations."

  #### 8. The "Hope Nobody Asks" Question (Meta-Ethical)
  **The Question:** "You say cultures aren't right-holders, but persons are. But if the 'claim' in queuing is just the aggregate of individual claims to time, isn't 'Culture' just the aggregate of individual claims to belonging? Why is one aggregate morally real and the other not?"
  **The Reply:** "Because claims to time/resources are non-rivalrous and determinate (I lose 2 minutes), whereas claims to 'belonging' are often zero-sum or undefined. But I admit this is the weakest part of my ontology. I am assuming a liberal individualist framework where only sentient harm creates claims. If you reject that framework, my distinction collapses."
  **Soft Spot:** This attacks the foundational individualism of your entire paper.
  **Concede Up Front:** "I concede this rests on a contested meta-ethical commitment to individualism. I cannot defend that commitment fully in this talk."

  ---

  ### Field Mapping: Settled vs. Contested

  **Settled Consensus (Do not fight these):**
  *   **Conventions as Coordination:** Everyone in this room agrees conventions solve coordination problems and stabilize expectations.
  *   **Norms as Equilibria:** The economists and ethicists agree that norms persist because deviation is costly.
  *   **Culture as Non-Agent:** Most analytic philosophers agree "culture" is not a metaphysical agent capable of holding rights *independent* of persons. (You are safe here, provided you don't slip into holism).

  **Genuinely Contested (Where the fight is):**
  *   **The Source of Normative Force:** Is it the *harm* caused by deviation (Ethicists/Economists), the *promise* implied by participation (Ethicists), or the *meaning* of the act itself (Anthropologist)? Your paper takes the Harm/Claim view; expect the Promise and Meaning views to push back.
  *   **The Status of "Social" Obligations:** Are obligations to follow social norms *moral* obligations, or a distinct category of "conventional" obligations? You are arguing they are moral only when they mediate claims. The Ethicists may argue conventional obligations are *sui generis*.
  *   **The Reality of "Decorative" Norms:** The Anthropologist will contest that any norm is truly "decorative." They will argue all rituals carry meaning/claims. You must defend the possibility of a norm that is *purely* symbolic without a claim attached.

  ### Idiosyncrasy Warning
  *   **Terminology:** "Load-bearing" vs. "Decorative" is your own coinage. It is not standard terminology in the literature on social norms (which usually speaks of "constitutive" vs. "regulative" or "moral" vs. "conventional").
      *   *Action:* Explicitly state in your opening or first Q&A response: "I am using 'load-bearing' and 'decorative' as terms of art for this argument to distinguish between conventions that mediate determinate claims and those that do not."
  *   **The Inversion Claim:** The idea that queuing is morally weightier than tipping is counter-intuitive to many (who view tipping as economic justice). Be prepared to defend the *mechanism* of the claim (reliance/harm) rather than the *intuition* of the case.

  ### Final Strategic Advice
  Your strongest move is to **concede the empirical, hold the normative.** If the Economist says tipping is wages, agree—it's load-bearing then. If the Anthropologist says a ritual is dignity, agree—it's load-bearing then. This makes your "decorative" category very small, but it preserves the *principle* that culture itself is not the right-holder. Do not die on the hill of "Tipping is decorative." Die on the hill of "Culture is not a person."
