prompt: |-
  I am assembling a specification before committing to any particular account. The setting is practical as much as metaphysical: a coroner, a historian of a financial collapse, a regulator and a metaphysician all have to say what caused an outcome when what happened is that something did not happen, and I want to know what a theory of causation by omission would have to deliver to be usable in all four places — not merely internally tidy, but good enough to settle cases. Write out the requirements such a theory must satisfy, each with the case or consideration that motivates it. Do not survey the literature and do not give me a reading list; the criteria are the deliverable, and I will do the scoring against particular accounts myself.

  At a minimum I want the following addressed, and you should add anything else you think genuinely belongs on the list:

  - The plain cases. A doctor who does not prescribe the antibiotic; a driver who does not brake; a lookout who is looking the other way. Any theory has to count these as causal, and has to say in virtue of what.
  - The case against them. There is a standing temptation to hold that absences are not events, that causation relates events, and therefore that omissions are not causes at all but only things we cite in explaining. Set out what that option is committed to and what it costs.
  - The non-agential cases. An antibiotic is absent from a culture and the bacteria grow; a gene is deleted and the phenotype appears; a braking subroutine does not execute and the vehicle collides. Same phenomenon as the doctor's omission, or does the theory need a separate treatment for the artefactual and the merely natural?
  - The case with no possible agent. The rain did not come and the harvest failed. Nobody omitted anything. Must the theory call this causal, and if it must, what stops every fact about the world from becoming a cause of every other fact?
  - Proliferation. Grant that omissions can be causes and that counterfactual dependence is the test, and everyone in the city who did not call the fire brigade caused the house to burn. What constrains the spread? Separate the accounts that constrain it by worldly facts from those that constrain it by norms, expectations or duties, and say what each constraint buys and what it costs.
  - Selection. Even granting that many omissions are causal, we single one out as the cause — the salient one, the blameworthy one, the difference that mattered. Is that singling-out part of causation or part of something else, and can the theory tell the difference?
  - Redundancy and preemption. Two people could each have saved the child and neither does; a watchdog sleeps, though the intruder would have got in anyway. Neither omission is a but-for condition, yet at least one looks causal. What must the theory deliver here?
  - Nested and compound omissions. A fails to tell B; B fails to warn C. May an omission cause an omission, and does the theory multiply causes or absorb them?
  - Omissions as double prevention. The usual move is to treat an omission as causing by preventing a preventer. Say what that buys and where it strains.
  - The normative cases. Two structurally identical factories, one failing to fit a safety valve that is standard in its industry, one failing to fit a novel one. If our causal verdict differs although the physical facts do not, is the theory in trouble or is that the correct result?
  - Degrees and vocabulary. Causal talk about omissions comes in degrees and in different idioms — the historian's absence of a lender of last resort, the engineer's failure mode, the regulator's non-compliance. State whether the theory owes an account of these, or whether they are decoration on a single underlying relation.

  Then, on the structure of the list itself: mark which requirements are non-negotiable and which are preferences of one camp; identify any subset you believe cannot be jointly satisfied and say which member you would give up, since that is the part I most want to see; and name the single requirement that does the most to eliminate candidate accounts. Close with a brief assessment, no more than a paragraph each, of how regularity accounts, counterfactual and dependence accounts, interventionist accounts, powers-and-mechanism accounts, and the view that omissions are not causes but quasi-causal or merely explanatory fare against the list. Keep that closing section short; the list is where the thinking is. The list itself can be a table.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Goal:** Create a specification (list of requirements) for a theory of causation by omission.
      *   **Context:** Practical and metaphysical utility for four specific roles: Coroner, Historian (financial collapse), Regulator, Metaphysician.
      *   **Constraint 1:** Do not survey literature or give a reading list.
      *   **Constraint 2:** The criteria are the deliverable.
      *   **Constraint 3:** Address specific minimum topics (Plain cases, Case against them, Non-agential cases, No possible agent, Proliferation, Selection, Redundancy/Preemption, Nested/Compound, Double Prevention, Normative cases, Degrees/Vocabulary).
      *   **Constraint 4:** Add any other genuinely belonging requirements.
      *   **Constraint 5:** Structure the list (mark non-negotiable vs. preference, identify incompatible subsets/trade-offs, name the single most eliminative requirement).
      *   **Constraint 6:** Close with a brief assessment (max 1 paragraph each) of five specific account types (Regularity, Counterfactual, Interventionist, Powers/Mechanism, Quasi-causal/Explanatory).
      *   **Format:** The list itself can be a table.
      *   **Tone:** Rigorous, practical, philosophical but applied.

  2.  **Deconstruct the Minimum Topics into Requirements:**

      *   *Plain Cases:* Need a requirement for "Agential Omission Coverage."
      *   *Case Against Them:* Need a requirement for "Ontological Parsimony vs. Explanatory Utility."
      *   *Non-Agential Cases:* Need a requirement for "Uniformity across Agency and Nature."
      *   *No Possible Agent:* Need a requirement for "Absence without Duty" (e.g., rain).
      *   *Proliferation:* Need a requirement for "Constraint on Causal Field" (Normative vs. Descriptive).
      *   *Selection:* Need a requirement for "Causal vs. Explanatory Selection."
      *   *Redundancy/Preemption:* Need a requirement for "Overdetermination Handling."
      *   *Nested/Compound:* Need a requirement for "Transitivity of Omission."
      *   *Double Prevention:* Need a requirement for "Mechanism of Negative Causation."
      *   *Normative Cases:* Need a requirement for "Norm-Sensitivity of Causal Status."
      *   *Degrees/Vocabulary:* Need a requirement for "Gradability and Idiom Compatibility."

  3.  **Drafting the Requirements (Iterative Refinement):**

      *   *Refinement on Proliferation:* This is the big one. If *everything* that didn't happen is a cause, the theory is useless. The theory must distinguish between "causal background" and "the cause."
      *   *Refinement on Normative Cases:* This is tricky. If physical facts are identical but causal verdicts differ based on industry standards, is causation normative? The theory must take a stand.
      *   *Refinement on Selection:* Is "cause" a binary relation or does it include pragmatic selection? The theory needs to say if "the cause" is metaphysical or pragmatic.

  4.  **Structuring the List:**
      *   I'll use a table format as suggested.
      *   Columns: Requirement, Motivation/Case, Non-Negotiable vs. Preference, Notes/Trade-offs.
      *   I need to explicitly identify the "Impossible Trinity" or conflicting constraints. The tension between *Proliferation Control* (limiting causes) and *Uniformity* (treating rain and doctors alike) is the classic friction point.
      *   I need to identify the "Killer Criterion." Usually, it's the Proliferation/Constraint issue because it breaks simple counterfactual accounts.

  5.  **Developing the "Trade-off/Incompatibility" Section:**
      *   The prompt asks to identify a subset that cannot be jointly satisfied and say which to give up.
      *   *Conflict:* Uniformity (Rain = Doctor) + Constraint (Not everyone is a cause) + Descriptive Purity (No norms in causation).
      *   *Resolution:* You usually have to let norms into causation or admit that "cause" is context-sensitive. I will flag the tension between *Descriptive Purity* and *Normative Sensitivity*.

  6.  **Developing the "Killer Criterion":**
      *   The "Proliferation Constraint" is the hardest hurdle. Simple counterfactual dependence fails here spectacularly (the Queen of England didn't water my plants).

  7.  **Drafting the Assessments:**
      *   *Regularity:* Struggles with single cases and omissions (no event to regularize).
      *   *Counterfactual:* Good at coverage, terrible at proliferation (too many causes).
      *   *Interventionist:* Good at manipulation, struggles with non-agential absences (can't intervene on rain).
      *   *Powers/Mechanism:* Good at ontology, struggles to find the "mechanism" of a nothing.
      *   *Quasi-causal:* Saves ontology, sacrifices the user's need for a "cause" to settle cases (fails the Coroner/Regulator test).

  8.  **Review against Constraints:**
      *   Did I survey literature? No.
      *   Did I address all minimum topics? Yes.
      *   Is the list a table? Yes.
      *   Are the assessments short (1 paragraph max)? Yes.
      *   Did I mark non-negotiables? Yes.
      *   Did I name the single most eliminative requirement? Yes.

  9.  **Final Polish:**
      *   Ensure the tone is authoritative and specification-like.
      *   Check that the four roles (Coroner, Historian, Regulator, Metaphysician) are reflected in the motivations.
      *   Make sure the "Impossible Subset" is clearly articulated.

      *(Self-Correction during drafting)*: I initially thought about making "Normative Sensitivity" non-negotiable. But a metaphysician might fight that. However, the prompt asks for a theory usable by a *Regulator* and *Coroner*. For them, norms *are* facts of the case. So, for *this* specification, Normative Sensitivity is non-negotiable for utility, even if metaphysically costly. I will mark it as Non-Negotiable for *this* brief.

      *(Refining the "Impossible Subset")*: The tension is between "Uniformity" (Rain and Doctor are same kind of cause) and "Constraint" (Rain is cause, Queen of England is not). If you treat them uniformly via counterfactuals, you lose constraint. If you constrain via norms, you lose uniformity (Rain has no norm). I need to state this clearly.

      *(Refining the "Killer Criterion")*: The Proliferation Constraint is definitely the one that kills the most naive theories.

      *(Final check on Assessments)*: Keep them tight. Focus on how they meet *this* spec, not general pros/cons.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Specification for a Theory of Causation by Omission

  **Purpose:** To adjudicate causal claims regarding non-events across legal, historical, regulatory, and metaphysical contexts.
  **Users:** Coroner (liability/death), Historian (systemic failure), Regulator (compliance/safety), Metaphysician (ontology/truth).

  | # | Requirement | Motivation / Case | Status | Notes & Trade-offs |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Agential Omission Coverage** | **Plain Cases:** The doctor who does not prescribe; the driver who does not brake. The theory must classify these as causal without requiring a positive act to substitute for the omission. | **Non-Negotiable** | Must explain *in virtue of what* the nothingness acts. If it requires a mental event to stand in, it fails the non-agential cases. |
  | **2** | **Ontological Commitment Clarity** | **The Case Against:** The view that absences are not events. The theory must state explicitly whether omissions are real relata or pragmatic placeholders. If the latter, it must explain how they settle legal/regulatory cases which demand real causes. | **Non-Negotiable** | Choosing "not real" satisfies the Metaphysician but risks failing the Coroner/Regulator who need liability anchors. |
  | **3** | **Uniformity of Mechanism** | **Non-Agential Cases:** Bacteria grow due to absent antibiotic; car crashes due to missing code. The theory must determine if this is the *same* causal relation as the doctor's omission or a distinct analogue. | **Preference** | Uniformity aids the Historian (systemic view); Distinction aids the Coroner (mens rea). A unified theory is preferred for metaphysical tidiness. |
  | **4** | **Absence without Duty** | **No Possible Agent:** The rain did not come; the harvest failed. The theory must decide if this is causal. If yes, it must distinguish this from the Queen of England not watering the plants. | **Non-Negotiable** | This is the boundary condition for "natural" vs. "normative" omission. |
  | **5** | **Proliferation Constraint** | **Proliferation:** Everyone who didn't call the fire brigade. The theory must limit the causal field. It must specify if constraints are **Worldly** (physical proximity, capacity) or **Normative** (duty, expectation). | **Non-Negotiable** | **The Killer Criterion.** This eliminates the most candidate accounts. Worldly constraints fail the Normative Cases; Normative constraints fail the Metaphysician's desire for mind-independence. |
  | **6** | **Selection Mechanism** | **Selection:** Singling out *the* cause from the background conditions. The theory must state if this selection is internal to the causal relation or external (pragmatic/explanatory). | **Preference** | If external, the theory is incomplete for the Regulator who needs the theory to identify *the* violation. |
  | **7** | **Overdetermination Handling** | **Redundancy/Preemption:** Two lifeguards sleep; child drowns. Neither is a but-for cause. The theory must account for causal contribution without strict counterfactual dependence. | **Non-Negotiable** | Essential for the Historian (multiple systemic failures) and Coroner (concurrent negligence). |
  | **8** | **Transitivity of Negation** | **Nested Omissions:** A fails to tell B; B fails to warn C. The theory must allow causal chains composed entirely of omissions without collapsing into a single aggregate absence. | **Preference** | Required for complex regulatory failures (chain of command). |
  | **9** | **Double Prevention Account** | **Double Prevention:** Omission prevents a preventer. The theory must clarify if this is indirect causation or a distinct logical form. | **Preference** | Crucial for safety systems (backup fails to activate). |
  | **10** | **Norm-Sensitivity of Causal Status** | **Normative Cases:** Identical physical failures, different industry standards. If causal verdicts differ, the theory must admit norms into the causal relation, not just the blame assignment. | **Non-Negotiable** | **The Trade-off Point.** If the theory denies this, it fails the Regulator. If it accepts this, it strains the Metaphysician's requirement for mind-independent facts. |
  | **11** | **Gradability and Idiom** | **Degrees/Vocabulary:** "Contributory factor" vs. "Proximate cause." The theory must accommodate degrees of causal strength or explain them as non-causal additions. | **Preference** | Historians and Engineers speak in degrees; Metaphysicians often prefer binary relations. |
  | **12** | **Temporal Specificity** | **Added Requirement:** When did the omission occur? (The moment of duty? The moment of outcome?) The theory must locate the omission in time to satisfy statutes of limitation and historical periodization. | **Non-Negotiable** | Practical necessity for the Coroner and Regulator. |

  ### Incompatible Subset and Resolution

  **The Conflict:** You cannot jointly satisfy **Requirement 3 (Uniformity)**, **Requirement 5 (Proliferation Constraint via Worldly Facts)**, and **Requirement 10 (Norm-Sensitivity)** without contradiction.

  1.  If you treat Rain (No Agent) and Doctor (Agent) uniformly (**Req 3**) using only worldly facts (**Req 5**), you cannot distinguish the Doctor's omission from the Queen of England's omission without invoking norms.
  2.  If you invoke norms to solve Proliferation (**Req 5**), you break Uniformity (**Req 3**) because rain has no norms.
  3.  If you make causal status sensitive to norms (**Req 10**), you satisfy the Regulator but violate the Metaphysician's desire for mind-independent causation.

  **Resolution:** To meet the brief's demand for a *usable* theory across all four roles, **Requirement 3 (Uniformity)** must be sacrificed. The theory must treat agential/normative omissions as a distinct causal class from natural absences. A unified ontology of "absence" is too blunt an instrument for the Coroner and Regulator. The cost is metaphysical heterogeneity; the gain is adjudicatory precision.

  ### The Single Most Eliminative Requirement

  **Requirement 5: Proliferation Constraint.**
  This is the filter that destroys the most accounts. Simple Counterfactual Dependence theories fail here immediately (the Queen of England counterfactually prevented the fire by not calling). Any theory that relies solely on "If X had happened, Y would not have" without a built-in constraint mechanism (normative, modal, or contextual) is unusable for this specification.

  ### Assessment of Candidate Accounts

  **Regularity Accounts:**
  These struggle fundamentally with **Requirement 1 (Agential Coverage)** and **Requirement 12 (Temporal Specificity)**. Omissions are not events that can enter into regularities; there is no "constant conjunction" of nothingness. To make this work, one must posit positive events (e.g., "being idle") as proxies, which risks violating **Requirement 2 (Ontological Clarity)**. They generally fail the Proliferation Constraint unless norms are baked into the definition of the regularity, which conflates law and description.

  **Counterfactual and Dependence Accounts:**
  These excel at **Requirement 1** and **Requirement 7 (Overdetermination)** (if modified), but they collapse under **Requirement 5 (Proliferation)**. Without pragmatic restriction, everything that didn't happen is a cause. They also struggle with **Requirement 10 (Norm-Sensitivity)** because counterfactuals are typically evaluated on physical similarity, not normative expectation. They are useful for the Historian but dangerous for the Regulator.

  **Interventionist Accounts:**
  These handle **Requirement 1** well (an intervention could have changed the outcome) but fail **Requirement 4 (Absence without Agent)**. You cannot "intervene" on the rain in the same sense as a doctor. This creates a hard split between natural and agential omission, satisfying the **Resolution** above but potentially alienating the Metaphysician. They handle **Requirement 5** well if interventions are constrained by what is feasible/expected, aligning with regulatory needs.

  **Powers-and-Mechanism Accounts:**
  These offer the best **Requirement 2 (Ontological Clarity)** by denying omissions are causes, treating them as absences of powers. However, this risks failing the primary brief: the Coroner and Regulator need to cite the omission *as* a cause to settle cases. If the theory says "there is no cause here, only an explanation," it fails the **Non-Negotiable** utility constraint. They handle **Requirement 9 (Double Prevention)** elegantly but struggle with **Requirement 7 (Overdetermination)** where no mechanism is active.

  **Quasi-Causal / Explanatory Accounts:**
  This view (omissions are not causes but explanatory tools) satisfies the Metaphysician completely (**Requirement 2**) but fails the Coroner and Regulator (**Requirement 1** and **10**). Legal and regulatory frameworks require causal attribution for liability and compliance, not merely pragmatic explanation. While internally tidy, this account is rejected by the specification's demand for practical settlement of cases. It treats the symptom, not the disease.
