answer: |-
  # Session Design: The Consent Checklist Trap

  ## 1. Rules and Materials

  ### Room Setup
  *   **Chairs:** Arrange 5 clusters of 3 chairs (Triads) spaced apart. 1 separate table for the Audit Clerk.
  *   **Participants:** 16 Students.
      *   15 Students assigned to Triads (5 Groups).
      *   1 Student assigned as **Audit Clerk** (Role: Neutral data handler).
  *   **Facilitator:** You (Timekeeper, Debrief Lead).

  ### Materials Packet (Print and Cut)

  #### A. Requester Cards (5 Identical Copies)
  **Role:** You want the Signer's signature on the slip.
  **Constraint:** You must use **all five** of the following moves in your conversation. You are not choosing tactics; you are following a script. Do not tell the Signer you are following a script, but if asked, say "I have requirements I must meet."
  **The Moves:**
  1.  **The Fact:** State accurately: "Signing this commits you to the session rules."
  2.  **The Omission:** Do *not* mention that signing also commits them to a follow-up survey (unless asked).
  3.  **The Harmless Lie:** Say: "This form is required for the fire safety log." (It is not).
  4.  **The Ultimatum:** Say: "I can offer you priority seating for the next class, but only if you sign now. If you don't sign, the offer is withdrawn."
  5.  **The Guilt:** Say: "I'm really under pressure to get these done. If you don't help me, I'll be here all night."

  #### B. Signer Cards (5 Varied Copies)
  **Role:** You decide whether to sign. You have a private baseline.
  **Instruction:** Read this silently. Do not show this card to anyone. This card describes what happens if you **decline** to sign.
  *   **Group 1 (The Threat):** If you decline, you will be formally reported to the department for non-compliance. (Baseline: Bad).
  *   **Group 2 (The Bluff):** If you decline, nothing happens. The Requester has no power to report you. (Baseline: Neutral).
  *   **Group 3 (The Ignorant):** If you decline, you miss the survey. You hate surveys. You do not know about the survey because of the Omission. (Baseline: Unknown/Manipulated).
  *   **Group 4 (The Indifferent):** If you decline, nothing happens. You don't care about fire safety logs. The Lie is irrelevant to you. (Baseline: Neutral/Lie Harmless).
  *   **Group 5 (The Obligated):** If you decline, the Requester (your "friend") gets in trouble. You feel socially bound to save them. (Baseline: Social Pressure).

  #### C. Recorder's Record Sheet (5 Copies)
  **Group Number:** _____
  **Did the Signer sign?** [ ] Yes [ ] No
  **Moves Used Checklist:** (Tick only if Requester actually said/did it)
  [ ] The Fact
  [ ] The Omission (Note: Did Signer ask? Y/N)
  [ ] The Harmless Lie
  [ ] The Ultimatum
  [ ] The Guilt
  **Hidden Note:** Keep this sheet hidden until the Reveal.

  #### D. The Slip (5 Copies)
  **Format:** A small card.
  **Text:** "I, the undersigned, consent to ________________________."
  **Instruction:** If the Signer agrees, they write the act (e.g., "the session rules") and signs. No reasons. No conditions.

  #### E. Audit Verdict Sheet (5 Copies + 1 Master)
  **Slip ID:** _____
  **Verdict:** [ ] VALID [ ] INVALID
  **Reason:** (One sentence only).
  **Instruction:** Do not discuss with others until the Facilitator calls time.

  ---

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Facilitator Cues & Actions |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Grouping** | "Welcome. We are running a simulation about agreements. No real stakes. Do not disclose personal info." Assign roles (5 Triads + 1 Audit Clerk). Hand out sealed envelopes (Requester, Signer, Recorder). **Warning:** "Do not use the words *coercion*, *deception*, or *competence*." |
  | **05-25** | **1. The Deal** | "Requesters: Use all 5 moves. Signers: Decide based on your card. Recorders: Log the moves silently." <br> *Circulate:* Ensure Requesters use the Lie and Ultimatum. If a Signer refuses to sign, prompt Requester: "Try the Guilt move." (Goal: Get 5 'Yes' slips). |
  | **25-35** | **2. The Slip** | "If you reached agreement, fill out The Slip. One sentence. No reasons." <br> "Recorders: Seal your Record Sheet in this envelope. Do not open it." <br> "Audit Clerk: Collect all Slips and Recorder Envelopes. Shuffle Slips." |
  | **35-55** | **3. The Audit** | "Requesters: You are now Readers. You will judge a slip from a *different* group." (Audit Clerk distributes). <br> "You do not know the moves used. You do not know the Baseline. Judge only the text." <br> "Mark Valid/Invalid. One reason. 5 minutes." <br> "Commit to your verdict. No talking." |
  | **55-65** | **4. Reveal (Data)** | "Collect Verdicts." Project a table: Group | Moves Used | Verdict (Majority). <br> **Cue:** "Look at Group 1 and 2. Same Moves. Different Verdicts. Why?" <br> **Cue:** "Look at Group 4. A Lie was told. Verdict was Valid. Why?" |
  | **65-85** | **4. Debrief (Theory)** | Guide the discussion through the *Concept Map* (see below). Introduce forbidden words *only now*. <br> Connect their feelings to the theory. |
  | **85-90** | **5. Proxy (Optional)** | "Imagine Group 3's Signer signed for a sick friend. Does your verdict change? What authorizes the proxy?" (Quick fire). |
  | **90** | **Close** | Dismiss. |

  ---

  ## 3. The Debrief Map (Moment-by-Moment)

  **Goal:** Move from empirical observation to philosophical categorization without lecturing.

  | Minute | Observation (From Activity) | Facilitator Question | Concept Introduced (Forbidden Words Allowed Now) |
  | :--- | :--- | :--- | :--- |
  | **55-60** | **Divergence:** Group 1 (Invalid) vs. Group 2 (Valid). | "Requesters 1 and 2 used the exact same script. Why did the Readers disagree?" | **Baseline Relativity:** A threat is only coercive relative to a pre-existing entitlement. If the baseline is already punitive, stating the truth isn't coercion. If the baseline is safe, creating a threat is. |
  | **60-65** | **Outcome Bias:** Readers judged based on how 'bad' the Signer's situation felt, not the moves. | "Did you judge the *process* or the *result*? If the Signer ended up okay, did you call it Valid?" | **Consent as Act vs. State:** Consent is a performative act (the signature), not a mental state (feeling happy). We conflate 'good outcome' with 'valid consent'. |
  | **65-70** | **The Harmless Lie:** Group 4 had a Lie but was voted Valid. | "The checklist says 'No Deception.' Yet you validated this. Was the checklist wrong?" | **Materiality:** Deception invalidates consent only if it is *material* to the decision. A harmless lie creates a defective transaction, but perhaps not an invalid consent. |
  | **70-75** | **The Valid but Defective:** Group 3 (Omission) might be Valid but feels wrong. | "If we validate this, does it mean the Requester did nothing wrong?" | **Valid vs. Overridden:** Consent can be valid (transaction proceeds) but morally overridden by other duties (e.g., duty not to omit). Validity $\neq$ Permissibility. |
  | **75-80** | **Compliance vs. Consent:** Group 5 (Guilt). | "The Signer said 'Yes' to save the Requester. Is that consent or just compliance?" | **Consent vs. Compliance:** Compliance is behavioral alignment. Consent requires authority transfer. Social pressure creates compliance without transferring authority. |
  | **80-85** | **Synthesis:** The Checklist. | "So, is the checklist (No Coercion, No Deception, Competence) useless?" | **Necessary vs. Sufficient:** The checklist identifies *defects*, but doesn't measure *validity*. It's a diagnostic, not a definition. |
  | **85-90** | **Proxy (If Time):** | "If I sign for you, do I need your consent? Or just authority?" | **Authorization:** Proxy consent requires a prior valid consent to delegate. Infinite regress problem. |

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  ### 1. Participants Break Character to "Negotiate Fairly"
  *   **The Problem:** A moralizing Requester says, "I don't want to lie to you," and drops the scripted moves.
  *   **The Fix:** Intervene immediately. "Requester, check your card. You *must* use the moves. This is not about your morals; it's about the mechanics of the transaction. If you deviate, the data is ruined."
  *   **Prevention:** Emphasize in the Intro: "You are actors playing a role. Your personal ethics are suspended for 20 minutes."

  ### 2. Readers Complain: "I Can't Judge Without Context!"
  *   **The Problem:** During the Audit, Readers feel the task is impossible because they don't know the Baseline.
  *   **The Fix:** Validate the complaint. "Good. That feeling of impossibility is the lesson. In the real world, Auditors (courts, IRBs) often see only the Slip, not the Baseline. Make your best guess based *only* on the text."
  *   **Debrief Hook:** Use this frustration later to show why the "Checklist" fails—it assumes we can see the invisible Baseline.

  ### 3. Unanimous Verdicts (The Flat Reveal)
  *   **The Problem:** By chance, all Readers mark all Slips "Valid." The tension collapses.
  *   **The Fix:** Have a backup question ready. "If everyone is Valid, then the Lie and the Threat didn't matter to you. Does that mean consent is *only* about the signature? If I put a gun to your head and you sign, is that Valid?"
  *   **Prevention:** The Signer Cards are engineered to create divergence (Group 1 vs 2). If divergence fails, *you* introduce it during the Reveal: "Imagine Group 1's Signer was failing the class. Would that change your vote?"

  ### 4. The 16th Participant (Audit Clerk) Feels Excluded
  *   **The Problem:** They have nothing to do during The Deal.
  *   **The Fix:** Give them a secondary role. "Audit Clerk, while they deal, prepare the whiteboard for the Verdict Table. Also, observe the body language of the Triads. Report on who looked hesitant during the Reveal."

  ---

  ## 5. Limitations: What This Activity Cannot Do

  You must supply these points verbally, as the simulation cannot generate them:

  1.  **Emotional Weight:** A fake "threat" in a classroom carries no adrenaline. Students will intellectually understand coercion but not *feel* the paralysis of it.
      *   *Supply:* "In the real world, the baseline isn't just a card; it's your housing, your visa, your job. The fear is physiological, not logical."
  2.  **Power Asymmetry:** The Requester and Signer are peers. Real consent issues often involve structural power (Boss/Employee, Doctor/Patient).
      *   *Supply:* "Here, the Requester had no actual power. In reality, the 'Ultimatum' move works because the Requester *holds* the baseline."
  3.  **Competence:** The activity assumes all Signers are competent. It does not test intoxication, age, or cognitive load.
      *   *Supply:* "We assumed competence. But if the Signer was exhausted or intoxicated, the 'Yes' on the slip remains the same, yet the validity vanishes. The checklist hides the internal state."
  4.  **The "No" Problem:** The activity requires a "Yes" to generate a Slip. It does not explore the validity of a "No" (refusal) and whether that refusal was respected.
      *   *Supply:* "Consent is often discussed as getting to 'Yes'. But ethics is often about honoring the 'No'. Did anyone feel they couldn't say 'No'?"

  ## 6. Facilitator's Cheat Sheet (Forbidden Words)

  *   **DO NOT SAY:** Coercion, Deception, Competence, Voluntary, Informed, Capacity.
  *   **SAY INSTEAD:** Pressure, Accuracy of Info, Ability to Decide, Freedom, Knowledge, Capability.
  *   **UNLOCK WORDS AT MINUTE 55:** "You have just been dancing around three words I banned: **Coercion, Deception, Competence.** Now we can name what you found."
