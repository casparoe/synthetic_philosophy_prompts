answer: |-
  **Brainstorming the Paradox**

  The core tension in Kavka's puzzle isn't just about willpower; it's about the *logic of intention*.
  1.  **Intention requires belief:** You can't sincerely intend to do $X$ if you believe you won't do $X$.
  2.  **Rationality undermines intention:** A rational agent knows that once the million is secured (based on the intention), drinking the toxin is purely costly with no upside.
  3.  **The Prediction Loop:** Because you know you're rational, you predict you won't drink. Because you predict you won't drink, you can't form the intention. Because you can't form the intention, you don't get the money.
  4.  **The Comedy Angle:** The joke needs to highlight the absurdity of being *too rational to commit*. It's not about being flaky; it's about the structural impossibility of sincerity when the reward is decoupled from the action. The punchline must show that the "reward" (validation/money) kills the "intention" (action).

  ***

  **The Set**

  Kavka says you can't sincerely intend to do what you know you won't do.
  That's not a paradox, that's my Hinge profile.
  I swipe right for the match—that's the million bucks.
  But I know I'm not leaving my house—that's the toxin.
  So when she asks why I never show, I say:
  "I didn't ghost you. I just became philosophically incapable of intending you the moment I secured the validation."
  It's not cruelty, it's epistemic honesty.
