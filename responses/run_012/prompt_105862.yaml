      *   *Check:* Is the "no moral cost" point definitely wrong? In the literature, yes. If the act is justified all-things-considered, some argue the hands are clean. But the *Problem of Dirty Hands* specifically refers to the view that they remain dirty *despite* justification. So, within the context of *this specific problem*, the lecturer is wrong.

