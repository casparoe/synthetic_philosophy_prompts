  The pattern you have identified is a recognized and sophisticated tension in normative ethics, specifically within the debate between **Claim-Based** and **Reasons-Based** theories of obligation. While there is no single famous proper noun (like "The Kantian Paradox") that labels this exact *shape* of intuition, it is the central feature of what is known as the **"Wrong vs. Wronging" distinction**, applied to **Agent-Neutral Obligations**.

  ### The Established Framework: Wrong vs. Wronging
  The philosophical home for your intuition is the distinction between **doing what is wrong** (violating an objective moral norm) and **wronging someone** (violating a specific claim or right held by a person).
  *   **Doing Wrong:** Your confidence that you "ought" to save the five, and that this "ought" grows stronger with the numbers, aligns with an objective, agent-neutral standard (often consequentialist). Failing to save the five is a moral failure *simpliciter*.
  *   **Wronging Someone:** Your intuition that none of the five can say you "wronged" them aligns with the **Claim View** of rights. Since you owed them nothing specific (no contract, no causal responsibility), they lack the standing to complain.

  ### The Established Term: "Imperfect Duty" (With Caveats)
  The closest historical term is **"Imperfect Duty"** (Kantian) or **"Duty of General Beneficence"** (Rossian).
  *   **Where the fit works:** These duties are owed to no one in particular. Failing to help a specific person is not a violation of *their* right, provided you help *someone*.
  *   **Where the fit fails:** Traditional "Imperfect Duties" imply **latitude**. They suggest you may choose *whom* to help based on preference. Your intuition is stricter: you feel the "pull scales with the numbers." You believe you *must* save the five over the one, not that you *may* save the five. This makes your requirement feel like a **Perfect Duty** in terms of binding force, but an **Imperfect Duty** in terms of claimants. Standard terminology struggles to capture this hybrid: a binding obligation that aggregates value but generates no claims.

  ### The Technical Term: "Non-Correlative Obligation"
  In contemporary meta-ethics (e.g., in the work of T.M. Scanlon, Joseph Raz, or Judith Jarvis Thomson), this is best described as a **Non-Correlative Obligation**.
  *   **Definition:** A moral requirement that binds the agent but does not correlate to a right held by any specific patient.
  *   **Coherence:** This position is coherent if you accept the **"Reasons View"** of obligation (obligations stem from the value of outcomes) rather than the **"Claim View"** (obligations stem from interpersonal demands). Critics (Claim Theorists) argue it is a "half-way house," insisting that if an obligation is strict enough to demand saving the five, it *must* generate a claim for the five. However, proponents argue that **Impersonal Value** can bind us without empowering specific individuals.

  ### Boundary Cases
  To test the limits of this requirement, consider where the "flat line" of wronging might suddenly spike:

  1.  **Case within the line (Fits your pattern):** *The Drowning Strangers.* You walk past a pond. Five strangers are drowning on the right, one on the left. You save the one. You acted wrongly (failed the scalar obligation), but none of the five can say *you* wronged *them* personally. You had no prior relationship.
  2.  **Case crossing the line (Wronging occurs):** *The Promised Rescue.* Suppose you shook hands with the one person on the left and said, "I will save you." Now, if you save the five, you have wronged the one. The **claim** was created by the promise, even if the **obligation** to save the most remains.
  3.  **Case crossing the line (Causal Responsibility):** *The Sinking Ship.* Suppose you drilled the hole that is sinking the ship. Now you have a **Duty of Repair**. If you save the five but let the one (who you specifically endangered) drown, that one *can* claim they were wronged by you, because your obligation to them is no longer general beneficence; it is restitution.

  ### Assessment
  Your intuition is not a confusion; it is a precise rejection of the **Correlativity Thesis** (the idea that every duty implies a right). You are describing an obligation driven by **Aggregative Impersonal Value**. It is coherent, provided one accepts that moral reasons can exist independently of interpersonal claims.

  Verdict: Non-Correlative Scalar Obligation
