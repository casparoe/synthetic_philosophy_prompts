answer: |-
  This is a request for the architectural blueprint of a political theory, not a policy debate. You are asking for the load-bearing walls of the argument before you decide where to put the furniture.

  To build a theory of conscription that doesn't collapse into "might makes right" or "slavery," it must resolve the tension between the state's need for survival and the individual's right to bodily integrity. Below are the six desiderata any adequate theory must deliver, followed by the classification of necessities versus preferences, and finally the structural incompatibilities you suspect exist.

  ### Part I: The Desiderata (Requirements List)

  **1. The Threshold of Existential Necessity**
  *   **The Requirement:** The theory must define a specific category of threat that triggers the right to conscript, distinct from general policy goals.
  *   **The Case/Consideration:** This handles the person willing to fight an invasion but refusing to be shipped to a foreign war. If the state can conscript for *any* war it votes for, the citizen becomes a resource for foreign policy rather than a defender of the polity. The theory must explain why the state's claim on your body is stronger when the *state itself* is at risk of dissolution than when it is merely pursuing interests. Without this, conscription is indistinguishable from kidnapping for labor.

  **2. The Proportionality of Burden (Time vs. Risk)**
  *   **The Requirement:** The theory must distinguish between the appropriation of *time* (service) and the appropriation of *life* (combat risk), and justify them separately.
  *   **The Case/Consideration:** This addresses your distinction between losing two years and accepting a chance of dying. A state might justify taking your time for civic training (the Swiss model) without necessarily having the right to expose you to lethal force without specific consent. A theory that conflates "service" with "combat" fails to account for the moral leap from inconvenience to mortal sacrifice. It must explain if the duty to serve is a duty to *train* or a duty to *die*.

  **3. The Reciprocity of Political Agency**
  *   **The Requirement:** The theory must align the demographic bearing the cost of coercion with the demographic holding the power of authorization.
  *   **The Case/Consideration:** This handles the democracy that votes for a war whose costs fall on a non-voting demographic (historically the poor, the young, or racial minorities) and the question of women. If Group A votes for the war and Group B fights it, conscription becomes a tool of internal colonialism. The theory must explain why the obligation to fight attaches to citizenship *status* rather than citizenship *power*. If women are citizens with full voting rights, the theory must explain why the burden of defense does not attach to them; if they are exempt, it must explain why their citizenship is distinct regarding liability.

  **4. The Integrity of Conscience (Universal vs. Selective)**
  *   **The Requirement:** The theory must provide a principled distinction between objecting to *all* war (pacifism) and objecting to *this* war (selective objection), and define the scope of alternative service.
  *   **The Case/Consideration:** This handles the person who will work in a hospital but won't touch a rifle, and the "leftovers" problem. If the state allows alternative service, it admits the burden is "service to the state," not "killing for the state." But if too many people take the alternative, the military becomes a class of those who couldn't opt out, undermining the "army = citizenry" claim. The theory must explain whether conscience is a right to opt out of *violence* or a right to opt out of *coercion*.

  **5. The Civic Utility Condition**
  *   **The Requirement:** The theory must explain the non-military value of conscription that justifies its inefficiency compared to professional forces.
  *   **The Case/Consideration:** This handles the empirical fact that professional forces fight better, yet mass conscription persists. If the only goal is military output, conscription is irrational. Therefore, the theory must account for the "price of having a country" argument (Finnish) or the "army = citizenry" argument (Swiss). It must articulate what social good is produced by the *act of conscription itself* (e.g., social cohesion, deterrence through mass mobilization potential, prevention of military coups) that outweighs the loss in military proficiency.

  **6. The Neutrality Paradox Resolution**
  *   **The Requirement:** The theory must explain how a defensive posture can require offensive-level readiness without violating the "Existential Necessity" threshold.
  *   **The Case/Consideration:** This handles the armed neutral country. Neutrality requires a threat credible enough to deter invasion *before* invasion occurs. This means conscription must happen in peacetime. But if there is no active invasion, does this violate Requirement #1 (Existential Necessity)? The theory must justify why "potential future invasion" is sufficient grounds for present coercion, whereas "potential future foreign policy goal" is not.

  ---

  ### Part II: Non-Negotiables vs. House Preferences

  To referee your friends, you need to know which of these requirements are structural (the theory breaks without them) and which are ideological (specific to a camp).

  **Non-Negotiable (Structural)**
  *   **Threshold of Existential Necessity:** Any theory that cannot distinguish between defense of the realm and projection of power collapses into statism. If the state can conscript for *any* purpose, individual liberty is extinguished. This is the minimum condition for liberalism to coexist with conscription.
  *   **Reciprocity of Political Agency:** A theory that allows a ruling class to conscript a subject class is a theory of feudalism, not citizenship. It doesn't have to mandate perfect equality (e.g., women's inclusion), but it must provide a *reason* for the exclusion that doesn't rely on "might makes right."
  *   **Proportionality of Burden:** A theory that treats time and life as identical commodities cannot handle the morality of risk. It must account for the unique moral weight of death.

  **House Preferences (Ideological)**
  *   **Civic Utility Condition:** This is the **Civic Republican** preference. A **Liberal/Professional** theory can simply admit conscription has *no* civic utility and is therefore unjustified except in total war. A **Libertarian** theory might argue civic utility is irrelevant if the coercion violates rights. Believing conscription *builds character* or *social cohesion* is a preference, not a logical requirement.
  *   **The Scope of Conscience:** The **Just-War** crowd prefers universal pacifist exemptions. The **Statist/Republican** crowd prefers no exemptions (duty is absolute). The **Liberal** crowd prefers selective exemption. Where a theory draws this line is a choice of values, not a logical necessity.
  *   **Armed Neutrality Justification:** The **Neutrality** camp argues peacetime conscription is defensive. The **Interventionist** camp might argue peacetime conscription is preparation for aggression. How a theory interprets "deterrence" is a strategic preference.

  ---

  ### Part III: Structural Incompatibilities (The Real Conflicts)

  You suspected "defensible to the conscript" and "imposable without consent" conflict. That is the baseline tension of all political authority. The deeper, specific conflicts within conscription theory are these:

  **1. The Efficiency vs. Equality Trade-off (The Professional/Republican Conflict)**
  *   **The Conflict:** You cannot simultaneously maximize **Military Efficiency** (Professional preference) and **Civic Integration** (Swiss/Finnish preference).
  *   **Why:** Professional armies require long-term specialization, high retention, and voluntary commitment to maintain high proficiency. Conscription relies on high turnover, short terms, and coercion.
  *   **The Impossibility:** If you design the system to be a true "school of the nation" (universal, short-term, broad), you degrade combat capability. If you design it for combat capability (selective, long-term, specialized), it ceases to be a "citizen militia" and becomes a distinct class. A theory claiming to deliver *both* maximum deterrence through mass mobilization *and* maximum civic integration is promising a free lunch.

  **2. The Universality vs. Conscience Trade-off (The Republican/Liberal Conflict)**
  *   **The Conflict:** You cannot maintain **Universal Obligation** (Finnish preference) and **Absolute Conscience** (Liberal preference) without creating a "Free Rider" class that destroys the universality.
  *   **Why:** If the duty is truly universal (the price of having a country), then exemption is a privilege. If exemption is granted too easily (to preserve liberty), the burden shifts to those less articulate or privileged enough to claim it (the "leftovers" problem).
  *   **The Impossibility:** If you make alternative service truly equal in burden to military service, you validate the objection but reduce military manpower. If you make it lighter, you punish the conscientious. If you make it non-existent, you violate liberal rights. You must sacrifice either the *universality of the burden* or the *sanctity of individual conscience*.

  **3. The Deterrence vs. Necessity Trade-off (The Neutrality Conflict)**
  *   **The Conflict:** **Armed Neutrality** requires conscription in peacetime; **Existential Necessity** justifies conscription only in threat.
  *   **Why:** To stay neutral, you must be strong *before* the crisis. To justify coercion morally, you usually need a crisis *during* the coercion.
  *   **The Impossibility:** If you wait for the existential threat to conscript, you may be overrun before the army is ready (failed neutrality). If you conscript in peacetime to ensure readiness, you are coercing citizens without an immediate existential threat (failed necessity). A theory of armed neutrality must argue that "potential threat" is morally equivalent to "active invasion," which is a very hard pill for liberal theory to swallow.

  **4. The Reciprocity vs. Reality Trade-off (The Gender/Demographic Conflict)**
  *   **The Conflict:** **Political Reciprocity** demands those who vote fight; **Military Reality** often demands those best suited fight.
  *   **Why:** If you open conscription to all voters (including women, older demographics, etc.) to satisfy reciprocity, you may dilute the physical pool required for modern infantry combat. If you restrict it to young men to satisfy efficiency, you break reciprocity (taxation without representation in reverse).
  *   **The Impossibility:** You cannot have a conscript army that is both perfectly representative of the electorate and perfectly optimized for kinetic warfare. One must yield.

  ### Summary for your Refereeing
  When your friends argue, check which incompatibility they are trying to hide.
  *   The **Finnish friend** is likely prioritizing *Existential Necessity* and *Civic Utility* while glossing over the *Efficiency* cost and the *Reciprocity* (gender) gap.
  *   The **Swiss friend** is prioritizing *Civic Integration* and *Neutrality*, likely struggling with the *Conscience* trade-off (how many objectors can the militia take before it's not a militia?).
  *   **You (The Liberal)** are prioritizing *Reciprocity* and *Proportionality*, but you must answer the *Civic Utility* question: if professionals are better, and war is rare, why does the "price of having a country" need to be paid in blood *before* the country is threatened?

  If a theory cannot explicitly state which of these four conflicts it is resolving (and which value it is sacrificing), it is not a theory; it is a rationalization.
