  Here's a thinking process that leads to the suggested decision tree:

  1.  **Analyze the Request:**

      *   **Goal:** Create a decision tree handout for a graduate seminar on consequentialism/utility monsters.
      *   **Purpose:** Move discussion past "bite the bullet" vs. "theory is false." Force engagement with logical space rather than author labels.
      *   **Starting Point:** Commitment that the Utility Monster is *conceivable* (logically possible).
