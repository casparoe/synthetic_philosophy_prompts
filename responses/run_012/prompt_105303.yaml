      *   *Node 4:* (If Welfare) Can a single life absorb infinite moral value (unbounded), or is there a cap on how much a life can matter?
      *   *Node 5:* (If Unbounded) Should we apply the principle directly to acts/outcomes, or indirectly via rules/institutions?
      *   *Node 6:* (If Direct) When aggregating, does every unit of welfare count equally regardless of who holds it? (This splits Total vs. Prioritarian/Rights).
