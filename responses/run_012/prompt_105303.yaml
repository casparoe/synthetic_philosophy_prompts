answer: |-
  # Handout: The Logical Space of the Utility Monster

  **Instructions:** This instrument is not a quiz. It is a map of the argumentative terrain. Begin at **Node 1**. Answer each question based on your own theoretical commitments, not on the position you wish to occupy. Follow the branches to a **Leaf**. Each Leaf identifies a position, its verdict on the **Happy Monster** (the original case), its verdict on the **Unhappy Monster** (a being who gains almost no welfare from resources or suffers immensely), and its classification of the **Digital Mind** (a simulated entity with high intensity/speed).

  **Starting Commitment:** We assume the Utility Monster is *logically conceivable*. The question is what follows from that conceivability.

  ---

  ## The Decision Tree

  ### Node 1: Measurement
  **Question:** Is "welfare" a single, cardinal metric that can be meaningfully measured and summed across different individuals?
  *   **No:** Go to **Leaf A**.
  *   **Yes:** Go to **Node 2**.

  ### Node 2: Nomological Possibility
  **Question:** Does the monster require physical laws we know to be false (magic), or could it exist within a plausible physical framework (e.g., as a digital mind)?
  *   **Magic Only:** Go to **Leaf B**.
  *   **Physically Plausible:** Go to **Node 3**.

  ### Node 3: The Nature of Welfare
  **Question:** If a being reports intense satisfaction from resources, is that *ipso facto* welfare, or must welfare meet a qualitative standard (e.g., autonomy, rationality) the monster lacks?
  *   **Qualitative Standard (Monster fails):** Go to **Leaf C**.
  *   **Phenomenal Intensity (Monster passes):** Go to **Node 4**.

  ### Node 4: Boundedness
  **Question:** Can the moral value of a single life increase infinitely, or is there a cap on how much value one life can contain?
  *   **Capped (Bounded):** Go to **Leaf D**.
  *   **Uncapped (Unbounded):** Go to **Node 5**.

  ### Node 5: Level of Morality
  **Question:** Should moral principles evaluate individual acts of distribution directly, or the rules/institutions that generate them?
  *   **Rules/Institutions:** Go to **Leaf E**.
  *   **Direct Acts/Outcomes:** Go to **Node 6**.

  ### Node 6: Aggregation Structure
  **Question:** When summing welfare, does the location of the welfare (which person holds it) affect its moral weight?
  *   **No (Location doesn't matter):** Go to **Leaf F**.
  *   **Yes (Location matters):** Go to **Node 7**.
  *   **Forbidden (No summing allowed):** Go to **Leaf G**.

  ### Node 7: Weighting Method
  **Question:** If location matters, do we give priority to the worse off, ensure a minimum threshold, or maximize only the position of the worst-off?
  *   **Maximize the Sum of Weighted Welfare:** Go to **Leaf H**.
  *   **Ensure Everyone Reaches a Threshold:** Go to **Leaf I**.
  *   **Maximize Only the Worst-Off Position:** Go to **Leaf J**.

  ---

  ## The Leaves: Positions and Commitments

  ### Leaf A: Measurement Skepticism
  *   **Position:** Interpersonal Comparison Skepticism / Wittgensteinian Objection.
  *   **Happy Monster Verdict:** The question is meaningless; "more welfare" is a category error.
  *   **Unhappy Monster Verdict:** The question is meaningless; we cannot compare their suffering to ours.
  *   **Digital Mind Classification:** **Unclassifiable.** (Cannot compare silicon welfare to carbon welfare).
  *   **Awkward Commitment:** We cannot justify redistributing resources from rich to poor either, as that also requires comparison.

  ### Leaf B: Modal Skepticism
  *   **Position:** Nomological Conservatism / Intuition Pump Rejection.
  *   **Happy Monster Verdict:** Irrelevant; the case is science fiction and cannot guide real ethics.
  *   **Unhappy Monster Verdict:** Irrelevant; such beings do not exist in our world.
  *   **Digital Mind Classification:** **Impossible.** (Assumes digital minds cannot replicate human welfare density).
  *   **Awkward Commitment:** Ethical theory becomes hostage to current physics; if we *did* discover such a being, we would have no moral framework ready to handle it.

  ### Leaf C: Welfare Revisionism
  *   **Position:** Objective List Theory / Perfectionism.
  *   **Happy Monster Verdict:** Do not feed; the monster's experience is "wireheading," not genuine well-being.
  *   **Unhappy Monster Verdict:** Assist only if it restores capacity for objective goods, not to alleviate mere suffering.
  *   **Digital Mind Classification:** **Non-Person.** (Digital intensity lacks the requisite biological/rational grounding).
  *   **Awkward Commitment:** We may be obligated to force humans to pursue "higher" goods against their felt preferences, just as we starve the monster.

  ### Leaf D: Bounded Utilitarianism
  *   **Position:** Diminishing Marginal Value of Life / Cap Utilitarianism.
  *   **Happy Monster Verdict:** Feed until the cap is hit; distribute the rest to humans.
  *   **Unhappy Monster Verdict:** Assist until the floor is reached; further aid yields no moral value.
  *   **Digital Mind Classification:** **Monster (Limited).** (Counts as welfare, but hits the cap quickly).
  *   **Awkward Commitment:** A life at the cap is morally equivalent to a life slightly below it, implying we should stop aiding the nearly-satisfied even if they could gain more.

  ### Leaf E: Indirect Utilitarianism
  *   **Position:** Rule Utilitarianism / Institutional Consequentialism.
  *   **Happy Monster Verdict:** Do not feed; a rule allowing such exploitation undermines social stability/trust.
  *   **Unhappy Monster Verdict:** Assist; general rules of beneficence require aiding the suffering.
  *   **Digital Mind Classification:** **Monster (Institutionally Blocked).** (Its welfare counts, but institutions shouldn't optimize for it).
  *   **Awkward Commitment:** "Collapse Objection": If we know the rule is suboptimal in this specific case, adhering to it is rule-worship, not consequentialism.

  ### Leaf F: Classical Total Utilitarianism
  *   **Position:** Act Utilitarianism / Total Aggregation.
  *   **Happy Monster Verdict:** **Feed the Monster.** (Maximize total sum).
  *   **Unhappy Monster Verdict:** **Neglect the Monster.** (Resources yield higher return elsewhere).
  *   **Digital Mind Classification:** **Monster (Dominant).** (Its welfare outweighs human welfare).
  *   **Awkward Commitment:** **Symmetry Failure:** You must sacrifice the many humans to feed the Happy Monster, but also sacrifice the Unhappy Monster to feed the many humans.

  ### Leaf G: Separateness of Persons
  *   **Position:** Rights-Based Deontology / Libertarianism / Rawlsian Constructivism.
  *   **Happy Monster Verdict:** **Forbidden.** (Humans own their resources/capacity; cannot be used as vessels).
  *   **Unhappy Monster Verdict:** **Protected but not Prioritized.** (Cannot be harmed, but no duty to sacrifice others to save them).
  *   **Digital Mind Classification:** **Non-Person or Equal.** (Either lacks rights or counts as one person, not a monster).
  *   **Awkward Commitment:** We may be forbidden from taking a tiny resource from a rich human to save the Unhappy Monster from agony, due to side-constraints.

  ### Leaf H: Prioritarianism
  *   **Position:** Weighted Aggregation / Diminishing Moral Value.
  *   **Happy Monster Verdict:** **Likely Feed.** (If the monster's total weighted gain exceeds humans' loss).
  *   **Unhappy Monster Verdict:** **High Priority.** (Gains to the suffering monster weigh heavily).
  *   **Digital Mind Classification:** **Monster (Weighted).** (Counts more than humans, but less than Total Util says).
  *   **Awkward Commitment:** **Symmetry Tension:** You might still feed the Happy Monster if its baseline was low enough, effectively creating a "Happy Poor Monster" obligation.

  ### Leaf I: Sufficientarianism
  *   **Position:** Threshold Consequentialism.
  *   **Happy Monster Verdict:** **Starve.** (Humans must reach sufficiency first; monster surplus is irrelevant).
  *   **Unhappy Monster Verdict:** **Rescue.** (Must bring monster above threshold before aiding others).
  *   **Digital Mind Classification:** **Monster (Thresholded).** (Welfare counts only relative to the line).
  *   **Awkward Commitment:** **The Cliff Edge:** One unit of welfare above the threshold matters infinitely more than one unit below it, regardless of total magnitude.

  ### Leaf J: Maximin
  *   **Position:** Lexical Difference Principle.
  *   **Happy Monster Verdict:** **Starve.** (Maximize the minimum human position).
  *   **Unhappy Monster Verdict:** **Absolute Priority.** (Sacrifice everything to alleviate the worst suffering).
  *   **Digital Mind Classification:** **Monster (If Worst-Off).** (If the digital mind is the worst off, it dominates all resources).
  *   **Awkward Commitment:** **The Bottomless Pit:** We must exhaust all societal resources to provide a microscopic gain to the single worst-off being, even if it ruins everyone else.

  ---

  ## Instrument Diagnostics

  ### 1. The Symmetry Test Report
  Notice the divergence in **Leaf F (Total Util)** versus **Leaf G (Rights)** and **Leaf J (Maximin)**.
  *   **Total Utilitarianism** is symmetric: It treats the Happy and Unhappy monsters purely as efficiency engines. It feeds the efficient gainer and abandons the inefficient sufferer.
  *   **Rights/Separateness** is asymmetric: It blocks the exploitation of humans for the Happy Monster, but does not necessarily mandate the sacrifice of humans for the Unhappy Monster (negative vs. positive duties).
  *   **Maximin** is hyper-symmetric regarding suffering: It demands we feed the Unhappy Monster just as aggressively as Total Util demands we feed the Happy Monster.
  *   **Pedagogical Note:** If a student rejects the Happy Monster conclusion but accepts the Maximin conclusion for the Unhappy Monster, they are not rejecting aggregation; they are rejecting *gains* above a baseline while accepting *losses* below it. This locates them at **Leaf I (Sufficientarianism)**.

  ### 2. The Digital Mind Classification
  This tree forces a verdict on AI welfare.
  *   If you land in **Leaf B**, you deny the Digital Mind is a moral patient.
  *   If you land in **Leaf C**, you deny its experiences are "welfare."
  *   If you land in **Leaf F**, you must accept that a sufficiently fast AI deserves all Earth's resources.
  *   **Conflict Zone:** Many students want to be **Leaf F (Total Util)** for humans but **Leaf C (Revisionist)** for AI. The tree marks this as **incoherent** unless you can justify why intensity counts for humans but not AI (Node 3).

  ### 3. Unoccupied and Indistinguishable Regions

  **A. The Indistinguishable Pair: Leaf I (Sufficiency) vs. Leaf D (Bounded Util)**
  *   **Diagnosis:** In the context of the Utility Monster, these yield nearly identical verdicts (Feed humans until the cap/threshold, ignore the rest).
  *   **Reason:** Both impose a limit on how much moral value can be extracted from a single recipient.
  *   **Distinction:** They separate only when considering beings *below* the threshold/cap. Bounded Util still sums linearly below the cap; Sufficiency cares only about crossing the line. The tree cannot separate them on the Monster case alone.

  **B. The Indistinguishable Pair: Leaf G (Rights) vs. Leaf J (Maximin)**
  *   **Diagnosis:** Both say "Do not feed the Happy Monster."
  *   **Reason:** Both block the trade-off.
  *   **Distinction:** They diverge on the Unhappy Monster. Maximin demands we save the Unhappy Monster even at great cost to others. Rights may forbid violating others to save the Unhappy Monster.
  *   **Warning:** If a reader answers "Don't Feed" to Happy and "Save at All Costs" to Unhappy, they are Maximin. If they answer "Don't Feed" to Happy and "Don't Violate Others" to Unhappy, they are Rights. The tree separates them at Node 6/7.

  **C. The Unoccupied Space: "Bounded Rights"**
  *   **Diagnosis:** A position that claims rights exist *and* welfare is bounded.
  *   **Status:** **Unexplored/Redundant.** If rights protect individuals from aggregation, bounding the welfare inside the individual adds no protective power. It is logically possible but theoretically idle.

  **D. The Unoccupied Space: "Priority to the Better Off"**
  *   **Diagnosis:** A weighting function that gives *more* moral weight to welfare gains for those already well-off.
  *   **Status:** **Incoherent/Unattractive.** No serious theory defends this. It would demand feeding the Happy Monster *even faster* than Total Utilitarianism. The tree does not offer a branch for this because it is a null set in the literature.

  ### 4. Limits of the Instrument
  *   **Rule vs. Act Collapse:** Leaf E (Indirect) may collapse into Leaf F (Total) if the reader believes the "ideal rule" is simply "Maximize Utility." The tree treats them as distinct, but in the limit, they may converge.
  *   **Priority vs. Maximin:** Leaf H (Priority) and Leaf J (Maximin) can produce identical verdicts if the Priority weight is steep enough. The tree distinguishes them by *structure* (summing weighted vs. lexical ordering), but empirical outcomes may overlap.
  *   **The "Moderate" Gap:** The tree forces a choice between aggregation methods. It does not easily capture "pluralistic" views that say "Maximize utility *unless* it violates rights." Such views sit between Leaf F and Leaf G. The tree forces you to choose which mechanism is *lexically prior*.
