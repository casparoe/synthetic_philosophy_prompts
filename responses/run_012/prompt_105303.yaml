      *   *Q6:* "In a direct evaluation, does the location of welfare (which person has it) matter, or only the total?" -> *Wait, this needs to split Priority/Sufficiency/Maximin.*
      *   *Better Q6:* "When distributing resources, does the baseline welfare of the recipient change the moral value of the gain?" (Splits Total vs. Priority).
      *   *Better Q7:* "Is there a level of welfare below which we must not fall, regardless of totals?" (Splits Priority vs. Sufficiency/Maximin).
      *   *Better Q8:* "Do individuals own their capacity for welfare such that it cannot be overridden for the sum?" (Splits Aggregators vs. Rights).

      *Let's streamline to avoid a massive tree.*
      1. Comparability.
      2. Empirical Possibility.
