          1.  Deny coherence (no interpersonal comparison/summation).
          2.  Deny genuine possibility (too inconceivable/empirically impossible).
          3.  Revise welfare theory (monster's surplus isn't *real* welfare).
          4.  Cap well-being (bounded utility).
          5.  Rule/Institution level (indirect utilitarianism).
          6.  Criterion level responses: Total aggregation, Priority, Sufficiency, Maximin, Separateness of Persons (Rights).
      *   **Constraint 1 (Symmetry Test):** Every branch/leaf must address the "Unhappy Monster" (a being who gains almost nothing from resources/suffers immensely). How does the position fare on both?
      *   **Constraint 2 (Modern Case):** Must classify a "Digital Mind" (fast/intense experience = more welfare per energy).
      *   **Constraint 3 (Transparency):** Note unoccupied combinations (incoherent/unattractive/unexplored) and flag indistinguishable leaves.
      *   **Format:** Decision tree structure (Internal nodes = questions, Branches = claims, Leaves = Position + Awkward Commitment).

  2.  **Deconstruct the Logical Space:**

      *   *Root:* We have a fixed resource pool. Entity A (Human) vs. Entity B (Monster). B gets vastly more utility per unit.
      *   *Question 1: Measurement.* Can we compare/sum welfare across persons?
          *   No -> Skepticism/Incommensurability.
          *   Yes -> Proceed.
      *   *Question 2: Possibility.* Is the monster *empirically/nomologically* possible, or just logically?
          *   Just logically -> Modal Skepticism (Nozick's intuition pump fails).
          *   Empirically possible (e.g., Digital Mind) -> Proceed.
      *   *Question 3: Nature of Welfare.* Is the monster's experience actually "welfare" in the normative sense?
          *   No (Revisionism) -> Hedonic vs. Objective List.
          *   Yes -> Proceed.
      *   *Question 4: Structure of Value.* Is welfare unbounded?
          *   No (Bounded/Capped) -> Diminishing marginal value of life.
          *   Yes (Unbounded) -> Proceed.
      *   *Question 5: Level of Morality.* Do we maximize directly (Act) or via rules/structures (Rule/Indirect)?
