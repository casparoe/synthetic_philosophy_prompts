  12. **Drafting the Content:** (Mental check of the flow)
      *   Start: Resources R, Human H, Monster M.
      *   Q1: Can we sum M's welfare with H's? (No -> Skepticism).
      *   Q2: Is M physically possible (e.g. AI)? (No -> Modal Skepticism).
