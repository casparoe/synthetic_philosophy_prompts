answer: |-
  Here is the spec. In this seminar, "adequacy" means satisfying a set of data points that emerged post-1970. Most of these are treated as non-negotiable observations about language and modality, but several are actually theoretical commitments disguised as data.

  ### The Spec: 5 Non-Negotiable Constraints

  **1. The Rigidity Constraint**
  *   **The Requirement:** A proper name or natural kind term must designate the same object or kind in every possible world where that object/kind exists. It cannot pick out "whatever fits the description" in other worlds.
  *   **Motivating Case:** "Nixon might not have been President." If "Nixon" meant "the 37th President," this sentence would be contradictory (like saying "The 37th President might not have been the 37th President"). It's not contradictory; it's true. Therefore, "Nixon" picks out the *man*, not the *office*.
  *   **Status:** **Non-Negotiable.** If your theory makes names non-rigid, you are pre-Kripkean and will fail the seminar.

  **2. The Necessary A Posteriori Constraint**
  *   **The Requirement:** The theory must allow for identity statements that are metaphysically necessary (true in all worlds) but epistemically contingent (discoverable only through empirical investigation).
  *   **Motivating Case:** "Water is H2O." Once we fix the reference of "water" to *this stuff*, it turns out *this stuff* is essentially H2O. There is no possible world where water exists and isn't H2O. But we needed science to tell us that.
  *   **Status:** **Non-Negotiable.** This is the core datum of the seminar. A theory that makes these identities contingent (like classical descriptivism) or a priori (like rationalism) is out.

  **3. The Cognitive Significance Constraint (Frege's Puzzle)**
  *   **The Requirement:** The theory must explain why "$a=b$" can be informative while "$a=a$" is trivial, even if $a$ and $b$ refer to the same object and the identity is necessary.
  *   **Motivating Case:** "Hesperus is Phosphorus." Both refer to Venus. The statement is necessary. Yet, the Babylonians learned something when they discovered it. If meaning is *only* reference (Millianism), the proposition is "Venus is Venus," which is trivial.
  *   **Status:** **Non-Negotiable Data, Negotiable Solution.** You *must* explain the informativeness. *How* you do it (senses, pragmatics, two-dimensional intensions) is where the camps fight.

  **4. The Ignorance and Error Constraint**
  *   **The Requirement:** Reference must succeed even if the speaker has false beliefs or no unique identifying description of the referent.
  *   **Motivating Case:** Most people can refer to "Einstein" even if they believe he invented the lightbulb (error) or only know him as "that famous scientist" (which fits many people). If reference depended on satisfying a description, we wouldn't be referring to Einstein.
  *   **Status:** **Non-Negotiable.** This is the bullet that killed Classical Descriptivism. Any theory that makes reference dependent on the speaker's internal knowledge base is dead on arrival here.

  **5. The Metasemantic Stability Constraint**
  *   **The Requirement:** The theory must specify *how* reference is fixed initially and *how* it is transmitted through a community over time, accounting for drift, division, or failure.
  *   **Motivating Case:** (See your TA cases below). A theory cannot just say "it refers"; it must provide the truth conditions for when reference breaks or splits.
  *   **Status:** **Non-Negotiable.** A theory of reference that ignores the causal history or social transmission of terms is incomplete.

  ---

  ### The Pressure Point: Where the Constraints Conflict

  Your hunch is correct. The live wire is the tension between **Constraint 1 (Rigidity/Direct Reference)** and **Constraint 3 (Cognitive Significance)**.

  *   **The Conflict:** If names are directly referential (they contribute only the object to the proposition), then "Hesperus is Phosphorus" expresses the same proposition as "Hesperus is Hesperus." This satisfies Rigidity but violates Cognitive Significance (it makes the discovery trivial).
  *   **The Cost:** To save Cognitive Significance, you have to add machinery (modes of presentation, primary intensions, pragmatic layers). But adding that machinery often threatens Rigidity or the Necessary A Posteriori.
  *   **What You Give Up:**
      *   **Millians** give up on the proposition being different; they push the informativeness into *pragmatics* (how we grasp the proposition), not *semantics* (the proposition itself).
      *   **Two-Dimensionalists** give up on the idea that there is only one kind of necessity. They distinguish epistemic necessity (conceivability) from metaphysical necessity.
      *   **Descriptivists** (neo-) give up on pure Rigidity, arguing names behave like descriptions in certain modal contexts.

  **Camp Style vs. Requirement:**
  *   **Requirement:** "Water is H2O" is necessary.
  *   **Camp Style:** *Why* it is necessary. Kripkeans say it's metaphysical essence. 2D Semanticists say it's a feature of how we fix reference in the actual world vs. other worlds. Don't confuse the explanation with the data.

  ---

  ### The TA Cases: Applying the Spec

  These cases test **Constraint 5 (Metasemantic Stability)**. The list doesn't tell you the *answer*; it tells you what the theory must *decide*.

  **Case 1: Boraline (The Failed/Ambiguous Baptism)**
  *   **The Test:** Does reference require a successful causal link to a *single* kind, or does it track the *description* used at baptism?
  *   **What the Theory Must Settle:**
      *   **Causal-Historical:** If the causal chain is broken or forks (two minerals), reference may fail or become indeterminate. It likely refers to nothing (empty name) or the disjunction, depending on how strict the "same kind" relation is. It definitely does *not* refer to the earlier unrelated rock (that's a different causal chain).
      *   **Descriptivist:** If the description was "the mineral in this lump," and the lump is a mix, the description fails to pick out a unique kind. Reference fails.
      *   **The Constraint:** An adequate theory cannot just say "it's complicated." It must provide truth conditions for sentences using "boraline." Does "Boraline is hard" come out false, true, or truth-valueless?
  *   **Verdict:** This case breaks theories that assume baptisms are always clean. It forces a choice between **Reference Failure** (the term is empty) vs. **Reference Shift** (it picks out the dominant mineral).

  **Case 2: Blue Shade (Semantic Drift and Community Split)**
  *   **The Test:** Is reference determined by the initial baptism (historical) or current usage (dispositional)?
  *   **What the Theory Must Settle:**
      *   **Historical View:** The word refers to the original shade. Both villages are now wrong (or one is). There is a fact of the matter.
      *   **Usage View:** Reference has split. The word is now ambiguous. There is no single fact about the "original word" because the word is now two words.
      *   **The Constraint:** You must distinguish between **Constraint** (what fixes reference) and **Consequence** (what happens after). If your theory says reference is fixed by causal history, then the *consequence* is that the villagers are mistaken. If your theory says reference is fixed by current communal norms, the *consequence* is that the original reference is irrelevant.
  *   **Verdict:** This tests whether your theory allows for **Indeterminacy**. If you insist there *must* be a fact, you are a semantic realist. If you say "it's indeterminate," you are a supervaluationist or nihilist. Both are allowed, but you must declare which one you are.

  ---

  ### The Killer Constraint

  **The Ignorance and Error Constraint (Constraint 4).**

  Historically, this is the single requirement that knocked out the most contenders. It obliterated Classical Descriptivism (Frege/Russell) in one blow. Kripke's "Gödel/Schmidt" case showed that you can refer to someone even if every description you associate with them is false.

  Currently, however, the **Cognitive Significance Constraint (Constraint 3)** is the filter killing the most *live* contenders. Naive Millianism (names are just tags) passes Rigidity and Ignorance easily but crashes hard on explaining why "Hesperus is Phosphorus" is informative without adding ad-hoc pragmatic machinery. If you walk in with pure Millianism and no story about pragmatics or cognitive roles, you will lose.

  ---

  ### The Scorecard (One Line Each)

  *   **Classical Descriptivism:** Dead. Fails Ignorance and Error; makes necessary identities contingent.
  *   **Kripke-Putnam (Causal-Historical):** Gold standard for Rigidity and Necessity, but struggles to explain Cognitive Significance without borrowing from Frege.
  *   **Two-Dimensional Semantics (Chalmers/Jackson):** Saves Cognitive Significance by splitting "meaning" into two layers, but accused of smuggling Descriptivism back in through the epistemic door.
  *   **Millianism + Pragmatics (Salmon/Soames):** Keeps semantics clean (Direct Reference) but pushes all the work into pragmatics; risks making "informativeness" non-semantic.
  *   **Semantic Nihilism/Indeterminacy:** Dissolves the problems by denying reference is determinate enough to break; solves the TA cases by saying "there is no fact," but risks making communication impossible.

  **Final Advice:** When someone says "Theory X can't handle Y," ask: "Is Y a non-negotiable datum (like Rigidity) or a theoretical preference (like Determinacy)?" Half the seminar is fighting over which intuitions get to count as data.
