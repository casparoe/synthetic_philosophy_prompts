  # Arrow's Impossibility: A Taxonomy of Responses

  **Root:** Accept Arrow's Theorem (UD + WP + IIA + ND $\rightarrow$ $\bot$).

  **Node 1 (Reading):** **Internal** (Formal properties of aggregation rules) vs. **External** (Legitimacy of collective decision-making).

  **Node 2 (Internal Path):** **Which Axiom is Expendable?**
  *   **Drop IIA:** *Positional/Scoring Rules.* (Accept that ranking A vs B depends on C).
  *   **Drop Unrestricted Domain:** *Domain Restrictions.* (Assume single-peaked/value-restricted preferences).
  *   **Drop Weak Pareto/Non-Dictatorship:** *Authoritarianism.* (Accept a dictator or ignore unanimous improvement).
  *   **Drop Ordinality:** *Cardinal Utility.* (Use interpersonally comparable welfare data).

  **Node 2 (External Path):** **Diagnosis of Failure:** **Modus Tollens** (The project is impossible) vs. **Burden-Shifting** (The model is incomplete).
  *   **Modus Tollens (Concept):** *Reductio of General Will.* (Collective rationality is incoherent; "the people" cannot will).
  *   **Modus Tollens (Necessity):** *Exit/Market/Secession.* (We do not need a collective ranking; decentralize).
  *   **Burden-Shifting (Inputs):** *Deliberative Democracy.* (Preferences are transformed, not aggregated).
  *   **Burden-Shifting (Goal):** *Epistemic Democracy.* (Aggregation tracks truth, not preference satisfaction).

  ***

  ### Prose Guide for Discussion

  **The Primary Split (Node 1):** This distinguishes your view from Priya's. The **Internal** reading treats Arrow as a constraint on mechanism design (your view): "Given these constraints, which rule do we pick?" The **External** reading treats Arrow as a verdict on political philosophy (Priya's view): "Given this result, is 'democracy' coherent?"

  **The Logical Stance (Node 2, External):** Within the External reading, distinguish **Modus Tollens** from **Burden-Shifting**. A Modus Tollens reading accepts the premises (fixed preferences, need for ordering) and rejects the conclusion (collective agency is possible). A Burden-Shifting reading argues the theorem's premises don't apply to real politics (e.g., preferences aren't fixed).

  **Unoccupied/Incoherent Nodes:**
  *   **Internal + Modus Tollens:** This combination is largely unoccupied. If you view the theorem as purely formal (Internal), concluding the project is impossible (Modus Tollens) is incoherent; you would simply note the formal limit and move to approximation.
  *   **External + Drop IIA:** Rare. Usually, if you care about legitimacy (External), IIA violations (context dependence) are seen as features of deliberation, not just axiom-dropping.

  **Indistinguishable Leaves:**
  *   **Deliberation vs. Epistemic:** At the aggregation stage, these are indistinguishable. Both reject the "fixed preference" input. They only differ in *why* preferences change (consensus vs. truth-tracking).
  *   **Reductio vs. Exit:** Practically indistinguishable in outcome. Both result in no social ordering. They differ normatively: one says we *can't* rank (metaphysical), the other says we *needn't* rank (political).

  **Usage:** Do not ask participants "Are you a Borda person?" Ask: "If you had to violate one condition to save democracy, which one breaks first?" or "Does Arrow prove voting is broken, or just that we need better data?" Place them on the tree based on their answer.
