answer: |-
  The red light above the glass was the only thing in the room that demanded nothing. Elias sat in the booth, the foam wedges on the walls swallowing the sound of his own breathing. On the script stand, the pages were marked with a yellow highlighter, a single line of dialogue for a character named Miller. Miller was a man who had survived a crash, standing in the wreckage, speaking into a dead radio.

  Elias put the headphones on. The director's voice crackled in his ear, bored and distant. "Take four. Remember, he's in shock. He knows the facts, but he isn't processing them. Go."

  Elias leaned into the microphone. He adjusted his posture, slumping the shoulders, loosening the jaw. He became Miller. He looked at the line. He knew exactly what Miller knew. He knew exactly what Miller failed to feel.

  "She is alive," Elias said, his voice dropping into a gravelly register, "but I don't believe it."

  He held the silence after the sentence for a beat, letting the contradiction hang in the air like smoke. It flowed out of him easily. There was no resistance in his throat, no stumble in his breath. The words fit together like mechanical parts, smooth and oiled.

  "Cut," the director said. "Perfect. That's the one."

  Elias took off the headphones. He felt light, unburdened. He had spoken a impossible thing, and it had cost him nothing. He was a vessel; the words passed through him without sticking. He was a tape recorder with a pulse. He packed his bag, nodded to the engineer behind the glass, and walked out into the afternoon.

  The city was grey, wet pavement reflecting the sky. Elias took the train home, standing in the corridor where the air smelled of ozone and wet wool. He thought about the line. It was a strange combination of words. If you wrote it down, it looked like a mistake. If you heard someone else say it about themselves, you would think they were confused. But Miller wasn't confused. Miller was accurate. Miller was reporting the state of the world correctly, and he was reporting the state of his mind correctly. The two reports just didn't shake hands.

  When Elias unlocked the door of his apartment, the silence was heavier than the studio foam. The hallway was dark. He toe-ed off his shoes and walked into the kitchen.

  Sarah was sitting at the table. She was peeling an orange, the zest spraying in fine mist over the wood. She had been home for three months. The accident had been in November; this was February. The doctors said she was lucky. The doctors said she was whole. Elias looked at her hands, steady and pink, and he knew she was there. He knew the biological facts. He knew the legal facts. He knew the spatial facts.

  But when he looked at her, there was a lag, a buffering icon spinning in the center of his vision. He knew she was sitting there, but he did not believe it. The knowledge sat in his head like a stone; the belief refused to take root in his gut.

  "Hey," Sarah said, not looking up. "How was work?"

  "Fine," Elias said. He opened the refrigerator and stared at the light inside. He needed to say it. He needed to tell her why he hadn't been sleeping, why he stood in the doorway of the bedroom sometimes for twenty minutes before entering. He needed to tell her why he checked her pulse when she was asleep, not to see if she was dead, but to confirm she was alive.

  He closed the refrigerator. The light clicked off.

  "Sarah," he said.

  She looked up, a segment of orange in her hand. "What?"

  He tried to form the sentence. He reached for the same words he had used an hour ago. They were the same words. They described the same truth. The first half was fact: *She is alive.* The second half was fact: *I don't believe it.*

  "I..." He started. His throat tightened. It felt as though he were trying to swallow a handful of dry crackers without water. "She is alive," he said, pointing at her, but the gesture felt wrong, like he was pointing at a photograph.

  Sarah frowned. "I'm right here, Elias."

  "No, I know," he said. The air in the kitchen felt thin, insufficient for breathing. "I know that. But..."

  He tried to push the second half out. *But I don't believe it.*

  His jaw locked. The words were there, ready on his tongue, but his brain refused to authorize the release. It wasn't that he was lying. It wasn't that he was afraid. It was that the act of saying it felt like stepping off a curb that wasn't there. It was a physical vertigo. To say "I don't believe it" while standing there, asserting "She is alive" in the same breath, felt like trying to walk forward and backward simultaneously. It was a glitch in the machinery of speaking.

  In the booth, he had been Miller. He had been a shape on a page. Here, he was the source. The words weren't passing through him; they were originating in him. And originating them felt like a violation of a rule he couldn't name.

  "I'm tired," Elias said instead.

  Sarah went back to her orange. "Okay."

  Elias walked into the living room and sat on the couch. He pulled his laptop out of his bag and opened the audio file from the session. He put his headphones on, isolating himself from the kitchen, from the smell of citrus, from the woman peeling fruit at the table.

  He hit play.

  His own voice filled his ears. *She is alive, but I don't believe it.*

  He listened to it three times. On the recording, the sentence was beautiful. It was tragic, honest, and clear. It carried weight, but it didn't break the speaker. It was just sound waves moving through air, captured by a diaphragm. The voice on the recording wasn't claiming anything. It was just playing back. It was a parrot speaking truth.

  Elias took the headphones off. The silence of the apartment rushed back in.

  He looked at his hands. They were trembling slightly. He looked toward the kitchen where Sarah was now washing her hands at the sink. The water ran clear over her fingers. She was there. He knew it. He didn't believe it.

  He stood up and walked to the threshold of the kitchen. He opened his mouth. He wanted to say it again, just to see if the lock would engage. He wanted to test the boundary. Was it the words? Was it the air? Was it him?

  "Sarah," he said.

  She turned, drying her hands on a towel. "Yes?"

  He looked at her. He held the truth in his mind, both halves of it, solid and unchanging. He prepared to assert them together. The friction returned instantly, a heat behind his sternum. It felt like trying to rub two magnets together on the wrong side. It felt like telling a lie, even though it was the truest thing he knew.

  If he said it, would it become false? If he said it, would he start believing it? Or would he stop knowing she was there?

  The sentence sat on his tongue, heavy and inert. It was a key that fit the lock but refused to turn. He realized then that the trouble wasn't in the world, and it wasn't in his head. It was in the bridge between them. The bridge held for Miller. It held for the recording. It held for anyone else who might say it about him. *Elias knows she is alive, but he doesn't believe it.* That sentence was fine. It was a normal sentence. It could be printed in a report.

  But *I*...

  "I'm going to make some tea," he said.

  "Okay," Sarah said.

  Elias turned to the kettle. He filled it with water. He listened to the sound of the tap, the rush of the liquid, the clank of the metal. He waited for the boil. He knew the water would boil. He didn't believe it. He stood there, watching the flame, waiting for the whistle that he knew was coming, suspended in the gap between the fact and the feeling, unable to speak the distance, unable to close it.
