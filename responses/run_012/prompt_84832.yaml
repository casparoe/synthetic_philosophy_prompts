  1. A pregnant patient in her third trimester experiences incapacitating pelvic pain because her uterus expands and relaxin hormones loosen ligaments exactly as designed for birth. Her obstetrician confirms these processes are statistically typical and functionally successful, yet prescribes bed rest because the patient cannot walk or work.

  2. The naturalist concludes this is not a disease because the uterus and ligaments are performing their evolved functions of gestation and preparation for birth without physiological failure. Since no part or process is failing to do what it is there to do, the condition fails the definition of disease regardless of the pain.

  3. The normativist concludes this is a disease because the condition prevents the patient from living the life she has reason to want by confining her to bed and causing severe suffering. Since the state is bad for the person who has it, it counts as a disease regardless of biological functionality.

  4. The feature is harm without malfunction, which vanishes if the pain is removed in early pregnancy (both views say not a disease) or if a tubal rupture causes the pain (both views say disease). The disagreement survives only in the original case because only there do the criteria for function and harm diverge.

  5. They might argue pregnancy is inherently valuable, but this costs them their commitment to the patient's own reasons by imposing an external judgment of what life is worth. This defence avoids the verdict but undermines the view's claim that the patient's inability to live the life they want is decisive.
