      *   *The Distinction:* Is the goal *safety* (longevity, avoiding harm) or *capacity* (energy, strength, ability to act)?
      *   *Nietzsche's Choice:* He would hate the "Vitality Score" app. It quantifies life to death. He might respect the CGM *if* it leads to intuitive eating later. He would despise the appetite drug because it removes the conflict necessary for will.

  7.  **Final Polish:**
