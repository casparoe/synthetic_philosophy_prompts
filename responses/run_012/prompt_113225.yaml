answer: |-
  ### Brainstorming the Argument's Architecture

  Before delivering the verdict, let us weigh the structural integrity of your colleague's syllogism.

  **The Strongest Steps:**
  *   **Step (1)** is robust. It correctly identifies the "underdetermination" problem. A pot shard does not wear its function or meaning on its sleeve; inferring ritual from a deposit requires a hypothesis linking the material pattern to the mental state.
  *   **Step (4)** captures a genuine methodological peril. The "ethnographic analogy" is indeed fraught. Assuming a modern hunter-gatherer group represents a Paleolithic one is often a temporal collage (the "time-travel fallacy"). If this were the *only* way to bridge the gap, skepticism would be warranted.

  **The Weakest Steps:**
  *   **Step (3)** is the epistemological choke point. It asserts a strict empiricist reduction: that all general laws are merely summaries of observed instances. This ignores the role of *causal mechanisms* and *theoretical entities* in science.
  *   **Step (5)** is logically valid only if (3) and (4) hold. If the support for bridging assumptions can come from somewhere other than ethnographic sampling, the collapse is halted.

  ### The Verdict

  I reject **Step (3)**.

  Your colleague's argument is a sophisticated restatement of Humean skepticism applied to deep time. It is seductive because it mimics the rigor of logical positivism: if you cannot observe the past, and you cannot generalize from the present without circularity, you are silenced. However, Step (3) relies on an outdated philosophy of science that conflates the *source of evidence* with the *nature of explanation*.

  ### Why Step (3) Looked Compelling

  Step (3) claims: *"(b) reduces to (a), because any general regularity about human behaviour is known only from cases we have observed, and every case we have observed is present-day."*

  This is compelling because it appeals to **phenomenalism**. It feels undeniably true that all our *data points* are in the present. We do not observe the past; we observe present traces. Therefore, it seems to follow that any rule we derive must be a generalization from present data. If I claim "humans always bury their dead with red ochre," and I justify this by saying "it is a human regularity," the skeptic asks, "How do you know?" If I answer, "Because we see it now," the skeptic retorts, "Then you are just using the present to guess the past."

  This step traps archaeology in a prison of the "Ethnographic Present." It assumes that the only way to validate a bridging assumption is through **inductive enumeration** (counting observed cases).

  ### Why Step (3) Fails

  Step (3) fails because it ignores **abductive reasoning** and **causal realism**. In modern philosophy of science, we do not justify bridging assumptions merely by counting present-day instances (induction); we justify them by positing underlying **generative mechanisms** that are time-transgressive.

  We do not need to observe every instance of a behavior across 100,000 years to posit a regularity. We need to identify a mechanism that *produces* the behavior, provided that mechanism existed in the past.
  *   **Example:** We infer that *Homo sapiens* 50,000 years ago had a capacity for symbolic thought not because we have a random sample of 50,000-year-old societies, but because we know they possessed the same neurobiology (hyoid bones, brain endocasts, genetic markers for language) as humans today.
  *   **The Mechanism:** The regularity is not "all humans make art" (which is empirically falsifiable); the regularity is "humans with this specific cognitive architecture, under these specific environmental pressures, tend to externalize memory in material forms."

  Step (3) collapses **process** into **product**. It assumes that because the *cases* are present, the *laws* governing them must be present-bound. But if the regularity is grounded in human biology, cognitive architecture, or thermodynamic constraints on material culture, the regularity holds for the past *not* because we observed it there, but because the causal conditions obtaining then obtain now. This is **Actualism**, not just Ethnography.

  ### The Price of Cutting Step (3)

  To excise Step (3) and save archaeology from skepticism is not free. You pay for this rescue with specific theoretical commitments. Here is the ledger:

  **1. What the Discipline Gains (The Rescue)**
  *   **Epistemic Authority:** Archaeology escapes the trap of being merely "antiquarianism" (describing objects). It becomes a historical science capable of testing hypotheses about social structure and cognition.
  *   **Methodological Pluralism:** You are no longer forced to rely solely on ethnographic analogy (Step 4's target). You can import bridging assumptions from cognitive science, evolutionary biology, and materials physics. You can argue that a specific tool geometry implies a specific grip, which implies a specific motor-cognitive plan, based on biomechanics, not ethnography.
  *   **Deep Time Access:** You can legitimately make claims about periods where no ethnographic analogy exists (e.g., the Lower Paleolithic), provided you can anchor your inference in a timeless mechanism (e.g., knapping physics or primate cognition).

  **2. What the Discipline Gives Up (The Cost)**
  *   **Radical Historicity:** You must abandon the strong post-processual claim that every past culture is radically incommensurable or that human nature is entirely socially constructed. To reject (3) is to accept a form of **Psychic Unity**. You are committing to the view that there are cross-cultural, trans-historical constants in human cognition and behavior. If a strong social constructivist argues that "belief" itself is a modern Western category that didn't exist in the Paleolithic, your position cannot accommodate them.
  *   **Autonomy:** Archaeology becomes dependent on the "hard sciences." If your bridging assumptions rely on cognitive regularities, you are beholden to neuroscientists and psychologists. If they change their models of memory or symbolism, your archaeological interpretations collapse. You trade archaeological independence for scientific integration.
  *   **Risk of Anachronism:** By positing timeless regularities, you risk projecting modern cognitive styles onto the past. While Step (3) protects you from this error by silencing you entirely, rejecting it allows you to speak but exposes you to the charge of "biological determinism." You must constantly vigilantly distinguish between *capacity* (which may be uniform) and *content* (which is historical).

  ### Conclusion

  Your colleague's argument is airtight only if one accepts a verificationist theory of meaning that most sciences have long abandoned. By rejecting **Step (3)**, you affirm that archaeology is a **retroductive science**. We observe present traces, posit past causes based on invariant mechanisms (biological, physical, cognitive), and test those posits against the material record.

  You keep (1) and (2). You accept the gap and the need for bridges. But you deny that the timber for those bridges comes *only* from the ethnographic present. It comes from the structure of the human animal itself. The cost is a commitment to naturalism, but the reward is a past that is knowable.
