answer: |-
  - **Bottom line**
  The single most decision-changing question is whether shame-based enforcement retains behavioral compliance in anonymous, high-mobility settings better than guilt-based internalization. If shame scales socially without collapsing into silence, her workplace and school levers shift toward public accountability. If guilt is the only thing that survives anonymity, she doubles down on conscience-building. Stop oscillating on theory; fund longitudinal studies on recidivism and norm adherence in transient communities. That data dictates whether you build inner compasses or outer cages.

  - **How I'm reading her situation**
  She's treating guilt and shame as interchangeable tools rather than distinct psychological states with different failure modes. The advisor's delegation framing is insightful but incomplete. It correctly identifies the *source* of enforcement (self vs. crowd) but ignores the *cost* of enforcement. Shame is cheap but brittle; it breaks when the audience leaves. Guilt is expensive but portable. Her oscillation suggests she lacks a theory of *where* these norms need to survive. If she's funding schools and workplaces, she's operating in mixed environments. The delegation frame helps choose the lever, but not the moral emotion. She needs to know which emotion survives the transition from community to anonymity.

  - **The open questions worth settling**
  1. Does shame-induced behavioral change persist when the observing audience is removed or anonymized?
  2. Can school curricula effectively shift a child's default moral emotion from shame to guilt (or vice versa) without consistent parental reinforcement?
  3. Is the psychological collateral damage of shame (withdrawal, depression) outweighed by its superior deterrence in high-trust, tight-knit communities?
  4. Do workplace compliance codes function better when framed as reputational risks (shame) or ethical violations (guilt) regarding repeat offenses?
  5. Does religious institutional funding produce stronger norm adherence when emphasizing divine observation (shame) or divine relationship (guilt)?

  - **The ranking, defended**
  1. **Persistence without audience (Question 1).** This is the pivot point. If shame fails without an audience, her workplace lever (often anonymous) must be guilt-based. If shame holds, she can save money on monitoring. This dictates the strategy for two of her three levers.
  2. **Curriculum tractability (Question 2).** If schools cannot reliably shift these defaults, that lever is dead money. It ranks second because even if shame is superior, you can't buy it through education if development is fixed early.
  3. **Collateral damage vs. deterrence (Question 3).** This is an ethical constraint, not a strategic pivot. She needs to know the cost, but effectiveness (Question 1) matters more for a foundation aiming for leverage.
  4. **Workplace framing (Question 4).** Specific subset of Question 1. Less generalizable.
  5. **Religious framing (Question 5).** Her religious institutions are likely already fixed in theology; harder to shift than school or work codes.

  I prioritized *strategic pivot potential* over *tractability*. Question 1 is hard to study but changes everything. Question 2 is easier to study but only matters if Question 1 validates the target emotion.

  - **What would flip the ranking**
  Watch for data on social media cancel culture outcomes over the next three years. If public shaming leads to permanent exclusion rather than rehabilitation, shame's utility drops for workplaces and schools, moving Question 3 (collateral damage) to the top. Conversely, if high-discipline schools show superior long-term outcomes without mental health spikes, Curriculum Tractability (Question 2) becomes the primary bottleneck and moves to #1. Also, monitor remote work compliance rates; if anonymous remote workers violate norms more often than office workers, it confirms guilt is required for anonymity, locking in Question 1 as the priority.

  - **Leave alone for now**
  Do not fund cross-cultural anthropological comparisons or neurological imaging studies. Anthropological data is too confounded by economics and governance to isolate guilt/shame variables for her specific levers. Neuroscience is too basic; knowing which brain region lights up doesn't tell her whether to change a handbook or a lesson plan. Also, avoid historical analyses of moral decline; they are retrospective and offer no causal leverage for future intervention. She needs forward-looking behavioral data, not backward-looking cultural diagnosis.
