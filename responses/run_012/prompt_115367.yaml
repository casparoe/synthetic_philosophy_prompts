      *   *Shame:* External/Social sanction, focus on self ("I am bad"), withdraw/hide, communal.
      *   *Advisor's Claim:* Guilt/Shame is actually about enforcement delegation (Conscience vs. Audience).
      *   *Critique of Claim:* It's partially true but misses the *phenomenological* and *developmental* differences. Shame isn't just external enforcement; it internalizes as self-concept. Guilt isn't just internal; it relies on shared norms. The advisor's framing is useful for *mechanism* but ignores *outcome durability* and *psychological cost*.

  3.  **Identify Open Questions:**
      *   What actually sticks longer? (Durability)
      *   What scales better in anonymous modern societies? (Scalability)
      *   What causes less collateral damage (mental health/suicide vs. psychopathy)? (Side effects)
      *   Can you train the switch? (Intervention tractability)
      *   Context dependence? (Workplace vs. School vs. Home)

  4.  **Select the Top Questions (for a Funder):**
      *   Need questions that directly impact the three levers (School, Church, Work).
      *   Need questions where an answer would *flip* the strategy (Guilt vs. Shame).
      *   *Question 1:* Durability/Internalization. If shame works better long-term despite short-term pain, that changes things.
      *   *Question 2:* Context Specificity. Is shame better for tight-knit groups (Church) and guilt for anonymous ones (Work)?
