answer: |-
  - **Bottom line**
  Prioritize ontological coherence over empirical application. The Markov Blanket question is the single most upstream issue: if you cannot non-arbitrarily define the system boundary, the rest of the principle lacks a subject. Follow this with the charge of tautology: if FEP is just Bayesian inference renamed, it offers no new mechanistic constraints. Compositionality is third; without it, PP cannot explain thought, only perception. The Dark Room problem is lower priority, often dissolvable by prior specification. My primary weighting criterion is dependency: which questions, if unresolved, render the others moot? A philosopher can best tackle the boundary and content issues; modellers are needed for compositionality. Avoid funding purely mathematical proofs of convergence or specific neural implementations; these are downstream or technical.

  - **The shortlist**
  1. **Markov Blanket Ontology:** Does the mathematical boundary correspond to a real metaphysical individuation of the agent, or is it circular bookkeeping?
  2. **Explanatory Content:** Is FEP a substantive constraint on mechanisms, or merely a redescription of Bayesian inference compatible with any outcome?
  3. **Compositionality:** Can hierarchical predictive processing generate systematic, structured cognition, or is it limited to statistical association?
  4. **The Dark Room:** Is the drive to minimize surprise inherently pathological, or do priors sufficiently constrain active inference toward survival?

  - **The ranking, and the reasoning behind it**
  The Markov Blanket ontology sits at the top because it is the condition of possibility for the entire framework. Your instinct here is correct: if the blanket is merely redrawing a boundary it was supposed to explain, the work is circular. This is not a terminology fight between Pearl and Friston; it is a fault line in the metaphysics of individuation. If the boundary is defined by the statistics, but the statistics are only calculable given the boundary, you have no independent criterion for what counts as a system. This is purely upstream. If the agent cannot be distinct from its environment in a non-arbitrary way, "self-evidencing" is meaningless. This is ideal work for a philosopher. It requires analyzing individuation criteria and causal structures, not running simulations. A philosopher can determine whether the blanket provides a real ontological ground or just a convenient partition for calculation.

  Second is Explanatory Content, which absorbs your worries about falsifiability, double-counting, and whether "self-evidencing" adds anything to Bayesian inference. This is the second-most upstream issue because it determines whether FEP is a theory of mind or a theory of physics. If Expected Free Energy double-counts epistemic and pragmatic value, the motivation for action collapses into redundancy. If the framework is unfalsifiable in a non-boring way, it cannot guide empirical work. Philosophers are essential here to distinguish normative claims (how systems should minimize energy) from descriptive claims (how they do). You need conceptual clarity on what would count as a violation of the principle. If the theory is compatible with all possible data, it is bookkeeping. Funding should target arguments that sharpen the constraints, not papers that apply the framework to new datasets.

  Third is Compositionality. This addresses your concern about association versus structure. If hierarchical PP cannot get you compositionality, it cannot explain language or systematic thought, limiting it to perception and motor control. This is downstream of the first two because if the system isn't individuated or the theory is empty, compositionality doesn't matter. However, it is critical for cognitive science relevance. This question straddles the philosopher-modeller line. A philosopher can define the target—what counts as genuine compositionality versus statistical correlation—but a modeller must demonstrate feasibility. Fund a philosopher to clarify the requirements and a modeller to test them. Do not fund a philosopher to try to prove compositionality mathematically; that is a technical task.

  Fourth is the Dark Room problem. While dramatic, this is often resolved by specifying realistic priors about survival. It is less foundational than the boundary or content issues. It is a specific objection rather than a structural flaw.

  Regarding dead ends: Avoid funding work on specific neural implementations. That is too empirical for a conceptual grant and moves too fast. Also avoid pure mathematical proofs of convergence. That is for mathematicians, not philosophers, and doesn't address the conceptual load-bearing questions. The philosopher-versus-modeller line falls at feasibility versus coherence. Philosophers check if the concepts hang together; modellers check if the equations solve.

  - **What would move a question up or down**
  The ranking shifts based on formal or empirical resolutions. If a rigorous proof demonstrates that FEP is mathematically equivalent to standard control theory without remainder, the Explanatory Content question drops to a historical footnote; the framework becomes a useful notation rather than a new theory. Conversely, if empirical work shows biological boundaries do not align with Markov statistics, the Ontology question becomes urgent and potentially fatal.

  For Compositionality, if a modeller successfully demonstrates systematic structure in a pure PP network, that question drops to implementation details. If they prove it impossible within the current formalism, it rises to a falsification condition, demanding theoretical revision. The Dark Room problem would move up only if it were shown that no plausible prior structure could prevent pathological minimization, but this is unlikely given current adaptive accounts. Essentially, any result that turns a conceptual worry into a mathematical impossibility moves that question to the top of the pile.

  - **Where you're least confident**
  I am least confident about the technical nuance between Pearl and Friston blankets. This may be a mathematical detail that dissolves the metaphysical worry, or it may be the crack in the foundation. I lack the specialized mathematical intuition to know if the distinction is substantive or merely notational. I also hesitate on how much the community values philosophical clarification versus technical expansion. There is a risk that philosophical rigor is seen as obstructionism rather than helpful pruning. Finally, the line between "deep conceptual problem" and "growing pains of a new formalism" is blurry. Some current ambiguities may resolve naturally as the mathematics matures, rendering philosophical intervention premature.
