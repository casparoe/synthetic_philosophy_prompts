  **Formal Methods Reading Group: Anthropics Decision Tree**

  **Preamble**
  We begin from the shared commitment that in the setups below, prior to further learning, there is genuine uncertainty concerning which observer you are. We seek to map the logical space of responses to this uncertainty without presupposing standard labels. The tree is constructed from six branch nodes (questions). These nodes define the coordinate system; the leaves represent the positions located within that system. Combinations of answers that yield no coherent position are diagnosed as unoccupied.

  **The Cases**
  1.  **Two Labs:** A fair coin is flipped. **Heads:** Lab A creates one observer (Red Hat), told the setup. **Tails:** Lab B creates one observer (Red Hat, told) and a second observer (Blue Hat, untold, soundproofed). You find yourself Red and told.
  2.  **Long Life:** A fair coin is flipped. **Heads:** Lab A creates one observer with one moment of experience (the setup). **Tails:** Lab B creates one observer with three moments (the setup, then two blank moments). You are at the moment of being told the setup.

  **The Logical Space (Branch Nodes)**
  Answer the following sequentially. Your path determines your leaf.

  *   **Node 1 (Two Labs Verdict):** In Two Labs, is your credence in Heads less than, equal to, or greater than 1/2?
      *   *Less:* Proceed to Node 4.
      *   *Equal:* Proceed to Node 5.
      *   *Greater:* Proceed to Node 2.
  *   **Node 2 (Unit of Counting):** In Long Life, does the existence of the two future blank moments on Tails raise your credence in Heads above what it was in Two Labs?
      *   *No:* Proceed to Node 3.
      *   *Yes:* **Leaf A.**
  *   **Node 3 (Reference Class Uniqueness):** Is there a single, objective fact about which observers belong to your reference class?
      *   *No:* **Leaf B.**
      *   *Yes:* **Leaf C.**
  *   **Node 4 (Presumptuous Consistency):** Does your view imply that you should be nearly certain you inhabit a world with vastly more observers than one with few, all else being equal?
      *   *Yes:* **Leaf D.**
      *   *No:* **Leaf E.**
  *   **Node 5 (Indexical Reduction):** Do you condition on the fact that *someone* has your evidence, rather than on the fact that *you* have it?
      *   *Yes:* **Leaf F.**
      *   *No:* Proceed to Node 6.
  *   **Node 6 (Action Guidance):** Do these self-locating credences directly constrain rational betting behavior?
      *   *No:* **Leaf G.**
      *   *Yes:* **Leaf H.**

  **The Map (Leaves and Diagnosis)**

  *   **Leaf A (Fraction/Moment):** You track the fraction of observers sharing your evidence, but your unit is the observer-moment. Future blank moments dilute the likelihood of Tails.
  *   **Leaf C (Fraction/Observer):** You track the fraction of observers sharing your evidence, unit is the observer. Future moments are irrelevant; only the ratio of Red Hats per world matters.
  *   **Leaf D (Count/Bullet):** You track the absolute number of observers. You accept the consequence that mere population size makes a world more likely.
  *   **Leaf E (Count/Restricted):** You track absolute numbers but deny the population consequence. **Diagnosis:** Unoccupied/Incoherent. One cannot weight by observer count in Two Labs without weighting by observer count in large-universe cases; blocking the latter while keeping the former lacks a principled divider.
  *   **Leaf F (Full Non-Indexical Conditioning):** You remain at 1/2 in Two Labs. You condition on "Some observer has evidence E" (true in both worlds) rather than "I have evidence E."
  *   **Leaf B (Reference Class Relativism):** You hold the Fraction view (Heads > 1/2) but deny the reference class is fixed. The question is ill-posed without a chosen class.
  *   **Leaf G (Decision-Theoretic):** You may hold credences, but they do not guide action directly; only policies do. Indexical credences drop out of the decision calculus.
  *   **Leaf H (Dissolution):** You maintain the starting commitment formally but argue the uncertainty is an artifact. **Diagnosis:** Tension with Root. This leaf accepts the "genuine uncertainty" premise only to dissolve it at Node 6.

  **Constraints and Overlaps**
  1.  **Count vs. FNC:** Contra the expectation that Two Labs leaves these inseparable, Node 1 separates them. Count-based views favor Tails (1/3) because Tails has more observers. FNC stays neutral (1/2) because both worlds contain exactly one observer with *your* specific evidence.
  2.  **Unseparated Pair:** Leaf F (FNC) and Leaf G (Decision-Theoretic) often converge on output (1/2 credence, standard betting). They are separated here by *why* the credence is 1/2 (evidence structure vs. decision utility), but empirically they may be indistinguishable in standard cases.
  3.  **Empty Space:** Leaf E is flagged as unoccupied. It represents the attempt to gain the evidential benefit of the Count view in small cases without paying the metaphysical cost in large cases.

  **Instructions for Use**
  Participants should answer the Nodes honestly. If you land on Leaf E, you are urged to reconsider Node 4. If you land on Leaf H, acknowledge you have exited the framework of quantifying uncertainty. If you land on Leaf F or G, note that your divergence may be terminological rather than substantive.
