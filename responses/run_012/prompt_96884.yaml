answer: |-
  1. Rejecting hard-line impersonalism forces you to abandon Moore's claim that ethical truths are universal and necessary, shifting instead toward a framework where reasons are essentially indexed to specific agents. This costs you the clean architectural symmetry of *Principia Ethica* but saves the phenomenological reality of partial commitment.
  2. A surviving version of impersonalism could claim that the consciousness of *this* particular relationship is a unique organic unity, meaning swapping partners destroys the specific good even if the abstract quality of affection remains constant. This preserves impersonal value while blocking the interchangeability conclusion because the specific mental states involved are not actually identical.
  3. The isolation test is not methodologically neutral because it strips away the relational history and agency required to sustain friendship, thereby privileging static states over dynamic personal commitments. By design, it isolates the object of value from the subject valuing it, which presupposes the very impersonalism you are questioning.
  4. To block the liquidation argument without abandoning impersonalism, you must argue that the disruption caused by breaking existing bonds creates negative value that outweighs the gain from new stranger-friendships. This maintains the arithmetic of impersonal value but adds transactional costs to the destruction of established organic unities.
  5. If you accept that affection's value depends on the participants' perspective, you pay by conceding that 'good' is no longer a simple, unanalyzable property applicable to states of affairs independently of observers. This fundamentally alters Moore's meta-ethical project, turning intrinsic value into a relation rather than a non-natural property.
