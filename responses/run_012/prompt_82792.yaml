answer: |-
  ### The Essay Question

  **Time Allowed: 45 Minutes**

  **Question:**
  Consider the following four cases: *The Miner's Ear* (common dysfunction), *The Quiet Bone* (asymptomatic risk), *The Beardless Man* (normal function, subjective distress), and *The Shortsighted Classroom* (common dysfunction, neutralized impact).

  Using these cases, explain what a strict biological account of illness (View 1) and a strict value-based account (View 2) must conclude about each. Identify where each view is pushed into an awkward corner. Specifically, explain what the biological account must add to handle *The Quiet Bone* without collapsing into the value-based account. Finally, argue whether the practice of "yardstick-switching" (moving between statistical, functional, and normative measures) is a fatal weakness in the biological view or a legitimate response to complexity.

  ***

  ### Model Answer

  *(To be read aloud after the marking session)*

  The debate over illness turns on whether we are describing a biological fact or passing a value judgement. View 1 (Naturalism) argues illness is biological dysfunction, independent of social context. View 2 (Normativism) argues illness entails harm or badness, which is inherently evaluative. Our three yardsticks are: statistical normality, functional design, and subjective distress.

  In *The Miner's Ear* and *The Shortsighted Classroom*, View 1 must declare these conditions diseases. The ear cannot hear; the eye cannot focus. These are functional failures regardless of how common they are. View 1 rejects the statistical yardstick; common dysfunction is still dysfunction. View 2, however, reaches an awkward corner. If illness requires harm, and the miners do not feel harmed nor lose social standing, View 2 must say they are healthy. This contradicts our medical intuition that broken ears are diseased. Conversely, in *The Shortsighted Classroom*, if glasses neutralize the harm, View 2 might say the disease vanishes when glasses are handed out, whereas View 1 says the disease remains regardless of correction.

  *The Beardless Man* reverses the pressure. View 1 must say he is healthy. His body functions as designed; there is no biological malfunction. View 2 must say he is ill, because he suffers. Here, View 1 looks coldly irrational, ignoring distress, while View 2 risks medicalizing any unhappy preference.

  *The Quiet Bone* presents the sharpest challenge. View 1 must classify low density as disease despite no current dysfunction. To do this without admitting values (View 2), View 1 must argue that risk is simply *probabilistic dysfunction*. It must claim the bone is currently failing to maintain a structure capable of resisting future force, not merely that breaking would be "bad." If View 1 says it is disease because breaking is undesirable, it has smuggled in values and collapsed into View 2. It must stick to the mechanics of probability.

  This brings us to yardstick-switching. When pressed, proponents of View 1 often switch yardsticks: using function for the miner, statistics for the bone, and ignoring distress for the beardless man. Is this fatal? I argue it is. A definition that changes its measuring tool to ensure the same result is not a definition; it is a justification. If View 1 must secretly rely on the normative yardstick (what we want to treat) to decide which biological facts count, it cannot claim to be value-free.

  However, one might argue switching is legitimate because medicine answers different questions. Sometimes we ask "Is it broken?" (Function), sometimes "Is it rare?" (Statistics), sometimes "Does it hurt?" (Normative). But if "illness" is supposed to be a single category, using three different definitions undermines its coherence.

  In conclusion, View 1 offers clarity but fails on risk and commonality without smuggling in values. View 2 captures the human experience but risks over-medicalization. Yardstick-switching reveals that View 1 cannot stand alone. It survives only by silently borrowing the normative force it claims to reject. Therefore, the switching is not a pragmatic solution but a symptom of a theoretical failure. We cannot scrub values from medicine; we must instead argue openly about which values deserve to define our suffering.

  ***

  ### Marking Scheme

  **Total Marks: 20 (5 Criteria × 4 Marks)**

  | Criterion | What to look for (4 Marks) | Common Error (Deduction Guide) |
  | :--- | :--- | :--- |
  | **1. Core Distinction** | Clearly defines View 1 as biological fact/function and View 2 as value/harm/judgement. | Confusing the two views or treating them as the same position. |
  | **2. Commonality Cases** | Correctly notes View 1 calls Miner/Shortsighted "disease" (function) while View 2 struggles (no harm). | Ignoring the statistical element or claiming View 1 accepts commonality as health. |
  | **3. Distress Cases** | Correctly notes View 1 calls Beardless "healthy" (no dysfunction) while View 2 calls it "illness" (distress). | Failing to see that View 1 must deny illness despite the patient's suffering. |
  | **4. The Risk Challenge** | Explains View 1 must treat risk as *probabilistic dysfunction*, not just *undesirable outcome*, to avoid becoming View 2. | Saying View 1 handles risk simply by saying "breaking is bad" (which is a value judgement). |
  | **5. Yardstick Verdict** | Takes a clear side on switching (fatal vs. legitimate) and supports it with reasoning from the cases. | Sitting on the fence without argument, or praising switching without explaining the cost. |

  **Note on Top vs. Competent Answers:**
  A **competent** answer will correctly apply the two views to the four cases like a checklist. A **top** answer will show how the cases *interlock*: specifically, how the solution to one case (e.g., ignoring statistics in the Miner) creates the problem in another (e.g., defining risk in the Bone). Top answers treat the yardsticks as a systemic problem, not just four separate puzzles.
