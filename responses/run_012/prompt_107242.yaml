answer: |-
  You're right to be stuck; this passage is the most cited—and most flattened—snippet in international relations. Here's how to unpack it without drowning in academic jargon.

  **1. How can the "real cause" be "kept out of sight"?**
  Think of this like a messy divorce or a corporate rivalry. When two parties split, the public press release usually cites "policy differences" or "contract violations." That's the formal complaint. But everyone knows the *real* reason is often jealousy, fear, or a shift in leverage.

  Thucydides is making a distinction between **pretexts** (the public excuses) and **motives** (the private fears). Sparta didn't stand up in the assembly and say, "We are attacking because Athens is getting too strong and we are scared." That would look aggressive and insecure. Instead, they talked about treaty violations involving smaller allies (the "grounds of complaint"). Thucydides knows the real cause because he is writing history *after the fact*, analyzing the behavior rather than the press releases. He's claiming that while politicians talked about rules, they were actually acting on fear. He isn't claiming magic insight; he's claiming analytical depth.

  **2. Is war "inevitable" or are the grievances important?**
  This is where the modern "Trap" meme distorts the text. When Thucydides says "made war inevitable," he isn't invoking a law of physics like gravity. He is describing a **pressure cooker**.

  Imagine a boiler building up steam (Athens' growth) until the metal stresses (Sparta's alarm) become too great. The "inevitability" refers to the structural pressure, not the specific timing. The "grounds alleged" (the grievances) are the spark that lights the fuse. Thucydides lists the grievances not to contradict the inevitability, but to show *how* the pressure was released. He's saying: "The tension was so high that war was going to happen anyway; these specific complaints were just the occasion, not the cause."

  **3. Does the distinction survive the "Trap"?**
  Rarely. The modern "Thucydides Trap" (popularized by Graham Allison) tends to treat the quote as a deterministic law: *Rising Power + Ruling Power = War.* That shuts down policy thinking. Thucydides' actual point is more nuanced: *Structural stress makes war highly probable unless managed, regardless of the specific diplomatic disputes.* The difference matters for your piece because one suggests fatalism, while the other suggests a warning about managing underlying tensions rather than just haggling over surface-level grievances.

  Verdict: Thucydides diagnosed a specific structural pressure cooker, not a universal law that makes war unavoidable.
