answer: |-
  1. **The Zero-Point Problem**
  You build interpersonal comparisons on top of the cardinal utility we get from choices under risk. But in that framework, a person's utility scale is only fixed up to a "positive affine transformation"—which is to say, we can stretch the scale or slide it up and down without changing the choices it predicts. We can compare the *distance* between two outcomes for one person, but nothing in the math fixes the *zero* across different people. So, when you compare Person A to Person B, what anchors the origin? How do we know we aren't just sliding their scales until they look comparable?

  *   **Follow-up:** (If she suggests that the observer's imagination fixes the zero): If the anchor is just the observer's psychological baseline, doesn't that make the comparison dependent on the observer's sensitivity rather than the subjects' actual welfare? At what point does "hard to calibrate" become "conceptually undefined"?

  2. **Levels vs. Differences**
  Let's press that point about the scale. Even if we accept we can compare utility *differences* across people—for example, that a meal means more to a starving person than a satiated one—your policy conclusions often seem to require comparing *levels*. You want to say one person is absolutely worse off than another, not just that they have more to gain. Do you actually get level comparability out of this apparatus, or are you smuggling in a normative assumption about where the bottom of the scale sits?

  *   **Follow-up:** (If she insists level comparability follows from the observer device): If the observer says Person A is at "level 5" and Person B is at "level 3," but we can't verify the zero, aren't we just measuring the observer's sympathy, not the subjects' welfare? How do you distinguish a measurement error from a conceptual failure here?

  3. **The Single-Observer Objection**
  Your solution relies on a single well-informed observer ranking what it would be like to be Person A versus Person B. But when that observer makes a choice, aren't they just revealing *their own* preferences over hypothetical states? It looks like you've turned a comparison *between* two people into a comparison *within* the evaluator. Why should the observer's preference to be A rather than B tell us anything about the value of A's life compared to B's?

  *   **Follow-up:** (If she argues the observer is neutralizing their own biases): If the observer has to strip away their own identity to make the judgment, what is left of the "observer" to do the comparing? Are we comparing the two lives, or just testing the limits of one person's imagination?

  4. **Coherence of Identity**
  Following on that: for the observer to rank "being A" against "being B," they have to imagine having A's preferences, memories, and capacities. But if I adopt your preferences, I am no longer making *my* choice. Is the preference "to be you" even coherent? Or does the act of imagining being someone else necessarily distort the utility we are trying to measure?

  *   **Follow-up:** (If she says the distortion is manageable): If the distortion is systematic—for example, if observers systematically underestimate the adaptation of disabled people to their condition—is that a measurement problem we can fix with better data, or does it show the device itself is biased?

  5. **Dependence on Expected-Utility Theory**
  Your cardinality comes from Von Neumann-Morgenstern utility, which depends on people satisfying the axioms of expected-utility theory. But we know from behavioral economics that people violate those axioms consistently—framing effects, loss aversion, and so on. If the underlying representation of individual choice is descriptively false, does the cardinal scale collapse? And if it collapses, does your whole argument for interpersonal comparison fall with it?

  *   **Follow-up:** (If she says we can use a corrected theory of choice): If we have to correct the theory of choice to get the cardinality, aren't we constructing a "rational" utility that the person doesn't actually have? Whose welfare are we maximizing then—their actual preferences or the ones they *should* have had?

  6. **Hedonic Substitutes**
  Suppose we grant that choice-based utility is too fragile. Some proponents of interpersonal comparisons switch to hedonic measures—brain scans, cortisol levels, or life-satisfaction surveys. If you substituted those for the expected-utility device, does it repair the zero-point problem, or does it just relocate the problem to comparing neural states across different biologies?

  *   **Follow-up:** (If she says hedonic measures are complementary): If the two measures conflict—for example, a person chooses a life they report as less satisfying—which one gets to count for policy? If you privilege one, aren't you making an ethical judgment about what welfare *is*, rather than measuring it?

  7. **Determinacy and Distributive Weight**
  I want to talk about the precision required for policy. Some distributive rules, like utilitarianism, only need us to compare utility differences. But others, like prioritarianism, which gives extra weight to the worse off, require comparability of units across persons. Does your method give us the unit comparability needed for prioritarianism, or are you limited to the weaker claims that utilitarianism requires?

  *   **Follow-up:** (If she claims unit comparability is achievable): If the margin of error in your comparisons is large, doesn't that wash out the specific distributive weight you want to assign? At what point does the uncertainty make the "extra weight" for the poor arbitrary?

  8. **Weighing Features of Lives**
  To make these comparisons, the observer has to weigh different features of a life—health, income, liberty, social connection. But there is no objective metric for trading a year of health against a year of income. Who decides which features count and how they are weighted? If the observer decides, isn't the resulting comparison just a reflection of the observer's own values about the good life?

  *   **Follow-up:** (If she says the subjects' own valuations should be used): If we use the subjects' valuations, but Person A values liberty over health and Person B values health over liberty, how does the observer compare them without imposing a third standard? Doesn't that return us to the problem of a common zero?

  9. **The Concrete Trade-Off**
  Let's put this to a policy test. Imagine a reform that gives a massive utility boost to a small, identifiable group, versus one that gives a tiny boost to millions. Your framework suggests we should be able to sum these up. But in practice, the "tiny boost" is often invisible to the observers making the comparison, while the "massive boost" is vivid. How does your method prevent the vividness of the few from swamping the aggregate welfare of the many?

  *   **Follow-up:** (If she says better information solves this): If the problem is that human psychology is wired to care more about the vivid few, is that a measurement constraint we can overcome, or is it a conceptual limit on using interpersonal comparisons for aggregation?

  10. **Falsification**
  Finally, I want to ask about the resilience of your position. You characterize the remaining difficulties as measurement problems rather than conceptual ones. So, what would count as evidence against you? Is there any argument or empirical finding that would convince you that interpersonal comparisons are, in fact, a pseudo-problem, or is the position insulated from refutation by definition?

  *   **Follow-up:** (If she says it would take a theoretical proof): If the position relies on the *possibility* of a well-informed observer, but we can never actually instantiate one, at what point does "possible in principle" become indistinguishable from "impossible in practice" for the purposes of policy?
