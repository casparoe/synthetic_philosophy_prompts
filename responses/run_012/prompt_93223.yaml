prompt: |-
  Me and my flatmate have been going round in circles about this for weeks and I want a proper answer instead of another evening of us both repeating ourselves. She's doing law, I did a bit of philosophy as an undergrad, and what set it off was her revision notes on the legal incidents of marriage, the boring bits nobody mentions in the equal-marriage debates. Spouses can refuse to testify against each other in a lot of places. If you die without a will your spouse jumps the queue ahead of your parents and your brothers and sisters. Your spouse is usually the person who gets to decide whether the machines get switched off. Your spouse can sponsor you for a visa. You file your taxes as a unit. And here's the thing that got me: when same-sex marriage was legalised in country after country, almost nobody touched any of that. They extended the existing package to a new set of couples and left the testimonial privilege, the intestacy rule, the next-of-kin rule and the tax treatment exactly where they were. So what does that practice actually presuppose about what marriage is for? I can see at least two stories. One: marriage is fundamentally the state recognising a certain kind of loving relationship between two adults, and the legal incidents are just how that recognition gets cashed out. Two: marriage is a legal technology for channelling care and dependency, a way of assigning someone to nurse you, inherit from you and speak for you, and the love story is window dressing. There's a third reading as well, which is that the institution isn't one thing at all but a bundle of unrelated rules that got stapled together by history, and that the extension happened without anyone having to commit to a theory.

  The bit that really bugs me is the pattern of who gets left out. If marriage is about the relationship, why does the state still refuse to recognise a settled three-person household, or two sisters who've shared a house for forty years and are each other's next of kin and each other's only real carer? If instead it's about care and dependency, why does the state demand no evidence of either before handing over the intestacy priority and the tax break? You can marry someone you've never lived with and have no intention of ever living with. And if it's just a historical bundle with no theory behind it, then why does the bundle keep getting defended so fiercely in court and in parliament, as though something were at stake that isn't just administrative convenience? It feels like the practice can't be all three at once, but I can't work out which one it's actually committed to, or whether it's just incoherent.

  So what I want from you is this. Reconstruct the theory of marriage that the practice I've described presupposes, if it presupposes one at all. Be careful to separate what the practice strictly requires from what it merely sits comfortably with, because I suspect a lot of my confusion comes from treating things that merely fit as things that are implied. Tell me which rival views of what marriage is for the practice quietly rules out, and where it's genuinely underdetermined, so that several incompatible theories would license exactly the same rules. Say whether the different parts of the practice presuppose consistent things or whether there's a real tension between the ones I've listed. And tell me what would have to change in the law if we swapped the presupposed view for one of the others, so I can see what's actually riding on the answer. Lead with your bottom line in the first sentence and then give the reasoning, no preamble and no restating of my question. British English please, and go easy on the jargon, I'm not a lawyer.
