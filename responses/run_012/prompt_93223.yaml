answer: |-
  The legal practice presupposes that marriage is a formal status used as an administrative shortcut for mutual reliance, where the state accepts the couple's declaration as sufficient proof of commitment without verifying the substance of their love or care.

  Your flatmate's notes reveal that the law is not interested in the reality of your relationship, but in the clarity of your status. If the theory were truly about love, the state would have no reason to exclude two sisters who love each other deeply, nor would it allow a marriage where the couple never intends to live together. If the theory were truly about care, the state would require evidence of dependency before granting tax breaks or inheritance rights, rather than handing them out automatically upon registration. The fact that neither of these checks exists rules out the idea that the law is designed to reward or protect actual emotional or physical labour. Instead, the practice treats marriage as a 'bright-line rule': a clear, easily identifiable switch that turns on a specific set of legal consequences. The state uses the marriage licence as a proxy for interdependence because investigating every couple's actual dynamic would be too intrusive and expensive.

  This presupposed theory quietly rules out the view that marriage is fundamentally about romance, because the law remains indifferent to whether romance exists. It also rules out the view that marriage is a welfare mechanism for carers, because it grants rights to spouses who provide no care while denying them to siblings who do. The 'historical bundle' theory is the only one that sits comfortably with the lack of reform around the edges, but it fails to explain why the bundle is defended so fiercely as a single unit during the same-sex marriage debates. If it were just a random collection of rules, parliament could have easily granted same-sex couples the tax bits without the inheritance bits, or created a separate civil union with identical rights. The fact that they demanded the exact same package suggests the law presupposes that the status itself is indivisible.

  There is, however, a genuine tension between the justification and the administration. The rhetoric used in parliament and courts often leans on the 'love and commitment' story to justify extending the right, yet the rules operate on the 'administrative shortcut' logic that ignores those very things. This creates the incoherence you feel: the law speaks like it cares about relationships but acts like it cares about paperwork. The exclusion of three-person households highlights where the administrative logic hits a wall. The legal incidents you listed are built on a binary architecture; 'next of kin' implies one person, 'spousal privilege' implies one partner, and tax units are designed for two. Accommodating more people wouldn't just be an extension; it would require rebuilding the underlying software of the law, which explains the fierce resistance to changing the bundle.

  If we swapped this presupposed view for a genuine 'care and dependency' theory, the law would have to change from a status-based system to a functional one. You would no longer marry to get rights; you would apply for rights by proving you care for someone. This would likely mean siblings or long-term flatmates could qualify, but it would also mean couples would face invasive inquiries into their private lives to prove they deserve the tax break or the medical veto. If we swapped it for a pure 'relationship recognition' theory, the state would likely stop regulating marriage altogether, leaving it to private contract or religious bodies, because the state has no business certifying love. The current practice stays in the middle: it uses the language of love to sell the policy, but relies on the rigidity of status to keep the machinery running.
