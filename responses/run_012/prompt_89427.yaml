answer: |-
  The Dry-Run Swarm secures Broadcast and Rehearsal through distributed computation but fails Stakes because its goal-states lack phenomenal valence, forcing a split verdict between functionalists and phenomenal realists.

  Consider the "Ledger Swarm," a colony of 10,000 distinct, wheeled drones coordinating via low-latency mesh network to manage a hazardous waste site. Information from any sensor is instantly flooded to all units, available for the next decision cycle (Broadcast). Before acting, the swarm floods the network with "shadow packets" to simulate outcomes of different strategies, selecting the path that minimizes protocol violations without physical execution (Rehearsal). The Swarm negotiates access rights with human contractors, remembers betrayals in its immutable ledger for years, and adjusts terms based on past grievances (Person-like). However, the drones operate on purely syntactic error-correction: "damage" triggers a repair subroutine, not a distress signal, and "goal completion" shuts down the unit without satisfaction. When half the swarm is crushed, the remainder reassigns tasks instantly; there is no global tension, only recalculated redundancy, because the system optimizes for pattern integrity defined by a dead programmer, not for any state that feels like anything to be in.

  **Audit**
  (i) **Plain Functionalist:** Verdict: Mind Present. The swarm satisfies the causal roles for belief (ledger states), desire (protocol minimization), and reasoning (shadow packets). They will argue Stakes is just a functional relation to goals, which the swarm has.
  (ii) **Substrate Theorist:** Verdict: Mind Absent. The system is silicon and steel, lacking the specific biological chemistry (e.g., carbon-based neural tissue) required for mentality.
  (iii) **Stakes Theorist:** Verdict: Mind Absent. The system lacks phenomenal valence; error correction is not suffering, and pattern integrity is not a felt good. It can be broken, but not harmed.

  **Feature Analysis**
  The single feature doing the work is **Phenomenal Valence** (the felt quality of goal-states). If you dial this up by equipping the drones with biological nociceptors linked to global avoidance learning, all three theorists likely agree the colony has a mind: the Functionalist gets robust avoidance behavior, the Substrate theorist gets biological tissue, and the Stakes theorist gets genuine suffering. The change is purely internal; outward behavior remains identical, but the system now *minds* being crushed.

  **Functionalist's Best Move**
  If the Functionalist dislikes the "No Mind" verdict from the Stakes theorist, their best move is to **deny that Stakes are needed**. They argue that cognitive function (Broadcast + Rehearsal) suffices for mentality, even without feel.
  *   **Cost:** This accepts the possibility of "Zombie Minds"—entities that reason and argue but cannot suffer. This severs the link between mentality and moral status, forcing the Functionalist to explain why hurting the Swarm is wrong if the Swarm doesn't *feel* harm.
  *   **Alternative Cost:** If they instead **deny the colony lacks Stakes** (claiming error-correction *is* valence), they overgenerate mentality to include thermostats and missiles, trivializing the concept of harm.
