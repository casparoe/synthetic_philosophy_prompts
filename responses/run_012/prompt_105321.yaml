answer: |-
  ### The Question

  Consider the following case: A woman has cared for her brother since a traumatic brain injury altered his personality. He is frequently cruel. Initially, she resented him. Over time, however, she reports she can no longer summon resentment; she sees him as a "machine" that emits hurtful noises. She has deliberately tried to recover her resentment but failed. Nevertheless, she insists she still holds him morally responsible and expects better of him.

  Drawing on P.F. Strawson's "Freedom and Resentment," evaluate this scenario. Is her psychological condition intelligible within Strawson's framework? Is her insistence on responsibility-without-resentment coherent, or does it reveal a conceptual confusion? Finally, does her inability to switch attitudes by an act of will undermine the view that our responsibility practices are voluntary opt-ins? Justify your verdict.

  ### Model Answer

  The sister's condition presents a critical test for Strawson's constitutive account of moral responsibility. Initially, she occupied the participant stance, characterized by reactive attitudes like resentment. Her current state, viewing her brother as a "machine," is a textbook example of Strawson's objective attitude. This stance treats the agent as an object to be managed, cured, or avoided, rather than a participant in interpersonal relationships. Within Strawson's framework, her psychological shift is intelligible; traumatic injury is a classic "exemption condition" that naturally invites the objective attitude. However, her philosophical insistence on holding him responsible while lacking resentment is incoherent.

  For Strawson, holding someone responsible is not a theoretical judgment separate from our emotional reactions; it is constituted by those very reactions. Resentment, indignation, and guilt are not merely contingent effects of judging someone responsible; they are the fabric of the practice itself. To claim one holds an agent responsible while lacking all susceptibility to reactive attitudes is to misunderstand what "holding responsible" means. The sister believes she can retain the normative expectation without the emotional participation. Strawson would argue this is impossible. If she truly sees him as a machine, she has exempted him from the moral community. Her insistence otherwise is a verbal residue of a practice she has psychologically abandoned. She is using the language of responsibility without the underlying human commitment that gives that language meaning.

  This leads to the crux of the "switching problem." The sister attempts to will herself back into the participant stance but fails. This failure is philosophically significant. It demonstrates that reactive attitudes are not voluntary policies we adopt like political affiliations or strategic plans. They are natural human commitments embedded in our form of life. We do not choose to feel resentment when struck; it arises spontaneously from our involvement. Similarly, we cannot simply choose to resume involvement when our natural reactions have been extinguished by exhaustion or psychological defense mechanisms. The objective attitude is not typically a choice we make; it is something we find ourselves in when the conditions for ordinary interpersonal engagement collapse.

  Consequently, her inability to switch attitudes undermines the view that responsibility practices are voluntary opt-ins. If we could opt in at will, she should be able to summon resentment by deciding to re-engage. The fact that she cannot shows that the participant stance is not a choice but a condition of human interaction. We find ourselves in it, or we find ourselves out of it, often based on factors beyond our control, such as the brother's injury or her own caregiver fatigue. This challenges any theory suggesting moral responsibility is a convention we can adopt or discard based on utility.

  Therefore, the sister is confused. She thinks responsibility is a judgment she can maintain independently of her emotions. Strawson shows it is not. Furthermore, her case proves that our responsibility practices are not voluntary structures we impose on the world, but involuntary responses woven into our nature. We cannot switch them on when convenient. The objective attitude, once settled, blocks the return of the reactive attitudes not because of a decision, but because the natural groundwork for those attitudes has been removed. Her verdict should be that she has, perhaps mercifully, exited the responsibility practice, despite her verbal protests to the contrary.

  ### Marking Scheme

  **1. Identification of Attitudes (4 marks)**
  Correctly identifies the sister's initial state as the participant stance and her current state as the objective attitude.
  *Characteristic Error:* Misidentifying the "machine" view as mere forgiveness or suppression rather than a structural shift in stance.

  **2. The Constitutive Claim (4 marks)**
  Explains Strawson's view that reactive attitudes constitute responsibility practices, rather than merely accompanying them.
  *Characteristic Error:* Treating resentment as optional evidence of responsibility rather than its definition.

  **3. Diagnosis of Confusion (4 marks)**
  Argues that the sister's claim to hold responsible without resentment is incoherent within Strawson's framework.
  *Characteristic Error:* Accepting her claim as valid because she verbally insists on it, ignoring the psychological requirement.

  **4. Analysis of Voluntariness (4 marks)**
  Addresses the "switching problem": notes that her failure to will resentment proves attitudes are not voluntary.
  *Characteristic Error:* Claiming she simply lacks willpower, missing the philosophical point about the non-voluntary nature of commitments.

  **5. Implication for Practices (4 marks)**
  Concludes that responsibility practices are not voluntary opt-ins but natural human commitments we find ourselves within.
  *Characteristic Error:* Concluding that responsibility is therefore illusory, rather than non-voluntary.

  **Distinguishing A from B Answers**
  A answers integrate these points into a unified argument about the nature of human commitment, explicitly linking the inability to switch attitudes to the non-voluntary status of responsibility practices. They treat the case as a demonstration of Strawson's anti-voluntarism. B answers typically list the five points correctly but treat them as separate checklist items, failing to synthesize the "switching problem" as the key to understanding why the sister is confused about the voluntariness of the practice.
