  (v) **0.90** — Counterfactual inference remains valid via structural assumptions despite non-independent observational data and single-history constraints.

  **Combination Logic**
  The final credence is a Bayesian update from a prior of 0.50: term (i) pushes the probability up by confirming institutions are genuinely causal, but terms (iii) and (iv) cap the *relative* weight by affirming significant direct channels for geography and culture, while term (ii) heavily discounts confidence in the estimated magnitude of the institutional effect. Term (v) acts as a multiplier on the validity of the entire exercise; since it is high, the empirical uncertainties in (ii)–(iv) are the binding constraints.

  **Sensitivity**
  The final number is most sensitive to **term (ii)**; if the instrumental variables are deemed invalid, the estimated causal weight of institutions collapses toward correlation, dropping the credence below 0.50.

  **Decisive Result**
  The single result that would move the number most is the discovery of a **validated, exogenous shock to institutional quality (e.g., a colonial policy variation) that is orthogonal to settler mortality, geography, and pre-existing cultural traits.**

  **Mootness Check**
  Term (v) would **not** make this result moot, because assigning a high probability to (v) affirms that the question is well-posed and that valid instruments can indeed identify causal variance shares despite the $N=1$ history problem.
