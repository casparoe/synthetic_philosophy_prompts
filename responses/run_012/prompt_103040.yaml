answer: |-
  **Setting:** *A field lab, late evening. The site report draft lies open on a metal table between Dr. Elena Vance (Processualist) and Dr. Julian Aris (Interpretive). Outside, the wind brushes against the tent canvas.*

  **Vance:** Julian, I've marked the section on Feature 404. The plastered pit. You've written that the deposit "reflects a belief in the animacy of the central figure." I've struck it.

  **Aris:** You've struck the core interpretation of the feature.

  **Vance:** I've struck an untestable claim. We have a pit. We have clay. We have a pattern of breakage. We do not have access to their theology. My revision says: "The assemblage represents a deliberate decommissioning of materials, removed from circulation and sealed." That is anchored in behavior. We can observe disposal. We cannot observe belief.

  **Aris:** "Decommissioning." That's a lovely word. It sounds technical, neutral. But tell me, Elena: what is being decommissioned?

  **Vance:** The figurines. They were taken out of use.

  **Aris:** To take something *out of use* implies it was *in use*. And not just use as a brick or a stone. You don't "decommission" a pebble. You discard it. To decommission implies the object held a status, a function, or a power that required a formal procedure to neutralize. That isn't behavior, Elena. That is an inference about how they valued the object. It's a belief-claim in a lab coat.

  **Vance:** *(Pauses, tapping her pen)* It implies intent. I'll grant you intent. We can infer they intended to bury them. But intent to bury is not intent to worship. I can intend to bury my garbage without holding a belief about the garbage's soul. The middle-range correlation here is between "sealed pit" and "waste management." It's a regularity we see in other contexts. Refuse gets pits.

  **Aris:** But this isn't refuse. It's forty decapitated figures, heads in a ring, one intact in the center, over ash. If this were garbage, the pattern is inexplicably expensive. Why break the necks at the exact same point? Why arrange the heads? Why leave one whole? If the hypothesis is "disposal," the arrangement is noise. If the hypothesis is "meaning," the arrangement is the signal. You're treating the most labor-intensive part of the deposit as irrelevant variance.

  **Vance:** I'm treating it as uninterpretable variance. Look, Julian, I'm not saying the arrangement is random. I'm saying we lack the codebook. If you see a red traffic light, you infer "stop" because you know the code. If you see a ring of clay heads, and you infer "sacrifice" or "animacy," what is your code? Where is the ethnographic link? Where is the experimental data showing that *this* specific geometry correlates with *that* specific belief? Without it, you're running a Rorschach test. You see a hierarchy because you live in a world of hierarchies.

  **Aris:** That's the old processualist trap. You assume belief is a private inner state, like a ghost in the machine, hidden away until someone writes it down. But belief isn't just what they thought; it's what they *did*. The belief is enacted in the arrangement. The distinction between the one and the forty *is* the meaning. It doesn't need a translation manual to tell us that a distinction was being made.

  **Vance:** A distinction, yes. A *specific* belief, no. You can infer they distinguished the central figure from the others. You cannot infer they believed it was "animate" or "divine" or "ancestral." It could have been a game board. It could have been a tally system. It could have been a mock execution of enemies. "Animacy" is a specific ontological claim.

  **Aris:** And "decommissioning" is a specific functional claim. You're smuggling in your own ontology—that objects are either tools or trash. If I write "ritualized deposition," I am describing the public action. The action *is* the belief. If I write "decommissioning," I am describing a mechanical process. Which is more faithful to the data? The ash layer suggests fire. The decapitation suggests violence or transformation. The ring suggests focus. These are public, material facts. To describe them without acknowledging their symbolic weight is to lie by omission.

  **Vance:** It's not a lie; it's a boundary. If you write "belief," the reader assumes we know *which* belief. If you write "structured deposition," the reader knows we see the pattern but don't claim to know the myth. But... *(She sighs, leaning back)* ...I take your point on "decommissioning." It does presuppose a prior status. "Termination of use" is better. But Julian, press me on the ethnography. If you claim the ring implies "protection" or "encirclement," and I claim it implies "containment," how do we adjudicate? Without an independent account of what rings mean to *this* culture, aren't you just begging the question? You're assuming the arrangement communicates, then interpreting the communication based on your assumption that it communicates.

  **Aris:** I'm not assuming it communicates *specific* content. I'm assuming it communicates *difference*. The ethnographic analogy isn't needed to see that the center is not the periphery. That's a structural universal. You don't need ethnography to know that putting one thing in the middle and others around it creates a relationship of focus or dominance. The inference licensed here isn't "They believed in the Sky God." It's "They enacted a distinction between the singular and the plural." That is an inference to a belief system—a cosmology of order—even if we can't name the deity.

  **Vance:** So you're scaling back. You're not claiming to know the *content* of the belief, just the *structure* of it.

  **Aris:** Exactly. Belief isn't a text we haven't found. It's a structure we have found.

  **Vance:** And if I argue that the structure is purely aesthetic?

  **Aris:** Then you have to explain why the aesthetic was buried in a sealed pit with ash. Aesthetics are for display. This was for concealment. The effort was expended for the act, not the view. That points to efficacy. To ontology.

  **Vance:** *(Silence for a moment. She looks at the photo of the pit.)* Okay. Here is where I concede. If I stick to "disposal," I cannot explain the precision of the neck breaks. That requires a rule. A rule implies a norm. A norm implies a shared understanding of how things *ought* to be. That is... close to what you call belief. If I strip "belief" out entirely, I strip out the "rule-bound" nature of the action. I make them look like robots dumping parts.

  **Aris:** And if I push too hard on "animacy," I strip out the uncertainty. I make them look like a textbook example of a religion I've already defined.

  **Vance:** So. The verdict. The report goes to press next week. Can I write that they held beliefs?

  **Aris:** Yes. But you must define what that means.

  **Vance:** No. *(She holds up a hand)* Not yet. The verdict is on the inference. Is it licensed?
  *(She thinks, weighing the "decommissioning" trap against the "Rorschach" risk.)*
  Your argument on the "enacted belief" holds. I cannot describe the *action* accurately without acknowledging the *conceptual distinction* that drove it. To say "they arranged this" is to say "they thought this arrangement mattered." That is a cognitive claim. A belief claim. My attempt to keep it "belief-free" relied on "decommissioning," which you've successfully shown is not neutral. It carries its own ontological baggage.

  **Aris:** So I win?

  **Vance:** You win the principle. But I win the constraint. We infer *that* they held beliefs regarding the status of these objects and the significance of the arrangement. We do *not* infer *what* those beliefs were (ancestors, gods, magic). The report will state: "The structured arrangement indicates a normative conceptual distinction between the central figure and the surrounding group, enacted through a ritualized termination process."

  **Aris:** "Ritualized." You'll use that word?

  **Vance:** I will. Because "functional disposal" fails to account for the ring. The ring is non-functional. Therefore, it is symbolic. Symbolic action implies a worldview.
  *(She looks him in the eye)*
  But Julian, if you try to slip "ancestor veneration" into the summary, I will cut it. We have the structure of the thought, not the content.

  **Aris:** Agreed. The structure is the data. The content is the speculation.

  **Vance:** Then we have a verdict. Inference to the *existence* of belief is licensed by the deposit. Inference to the *specifics* of belief is not. The "decommissioning" hypothesis is rejected because it masks the symbolic labor evident in the heads' arrangement. The "meaningful arrangement" hypothesis is accepted, provided it remains descriptive of the structure rather than prescriptive of the mythology.

  **Aris:** That I can sign off on. It acknowledges the humanity of the actors without pretending we know their language.

  **Vance:** *(Picks up her pen)* Then let's rewrite the paragraph. "The deposit reflects a structured conceptual framework..."

  **Aris:** "...enacted through the differential treatment of the figurines."

  **Vance:** Exactly. We document the mind in the mud, Julian. But we don't pretend to read its diary.

  **Aris:** Fair enough.

  **Vance:** *(Writing)* "Structured conceptual framework." There. It's testable. If we find another pit with a random heap, the framework isn't universal. If we find another ring, it is. It's a pattern of behavior that implies a pattern of thought.

  **Aris:** And that, Elena, is what I've been trying to say all along.

  **Vance:** Don't push it. Drink your coffee.

  ***

  ### Verdict for the Report

  **Yes, an inference to belief is licensed, but it must be strictly limited.**

  **Reasoning:**
  1.  **The "Decommissioning" Trap:** As Dr. Vance conceded, purely functional terms like "decommissioning" or "disposal" are not belief-neutral. They imply the objects had a prior status or power that required neutralization. To describe the action accurately, you must acknowledge the *value* or *status* attributed to the objects by the makers. This is an inference to belief (ontological status).
  2.  **Structure as Data:** The specific arrangement (ring of heads vs. intact center) is non-functional. It requires labor without practical utility. This signals symbolic communication. You are licensed to infer that the makers held a **conceptual distinction** between the central figure and the others (e.g., singular vs. plural, leader vs. group, whole vs. sacrificed).
  3.  **The Constraint:** You are **not** licensed to infer the *content* of that belief (e.g., "ancestor worship," "sympathetic magic," "deity"). Without ethnographic correlation, specific theological claims are untestable.

  **Actionable Wording:**
  Do not write: *"The people believed the central figure was a god."*
  Do write: *"The differential treatment of the central figurine indicates a structured conceptual distinction within the depositor's worldview, enacted through ritualized separation."*

  This allows you to discuss the *presence* of a belief system (the "what they did" implies "what they thought mattered") without making unsubstantiated claims about the *specifics* of that system.
