prompt: |-
  I'm a novelist, and my new book turns on a lottery of the Platonia kind — the one where the pot gets split between everyone who enters, so the clever-looking answer only works if everybody else has already reasoned their way to the same place you have, and where the whole thing collapses the moment a few people pile in for reasons that have nothing to do with reasoning (they misread the form, they're drunk, they enjoy spoiling it for everyone). I've been asked to be the visiting speaker at a decision theory reading group next month, and the thing I actually want to argue is this: the puzzle isn't a paradox of rationality at all, it's a coordination problem in a paradox's clothing, and "superrationality" is a norm that quietly assumes a population already persuaded of the argument — so its clever answer stops being an answer to anything once real people are in the room. And I think there's a nastier second limb: the puzzle only goes through if you're allowed to treat your own reasoning as a copy of everyone else's, and nobody has ever told me why I get to do that. My novel uses its own version of the rules, so if you need the mechanics pinned down to make the objections bite, pin them down yourself and say that's what you're doing.

  Act as a decision theorist who's sat through far too many of these interdepartmental seminars and knows exactly how the room works. The audience: mostly microeconomists, one game theorist who runs lab experiments and is allergic to anything that smells of philosophy, a philosopher of action who'll want to talk about intentions and what it means to "decide for everyone", and two literary critics who came for the fiction and will ask why my characters can't just talk to each other. Think carefully, and brainstorm a bit first, about who in that room cares about what. Then give me my prep sheet: the eight or so objections I'll actually get — not the ones I'd get from a room full of rationalists — ordered by how much damage they'd do, each phrased the way that particular person would phrase it, with a two-minute reply and an honest note on where the reply is soft. Tell me what to concede in the first minute so I don't look like a crank, and finish with the question I'm dreading, the one I'm hoping nobody asks. No reading lists, no references, I can't look anything up from the podium, and don't be polite about the weak bits — I'd rather find them here than up there. British spelling, obviously.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book about a "Platonia" lottery (pot split among entrants, so optimal strategy depends on everyone else's reasoning).
      *   **Core Argument:** The puzzle isn't a paradox of rationality but a coordination problem disguised as one. "Superrationality" assumes a homogenous, persuaded population. It fails with real people (noise, error, non-reasoners). The "copying" assumption (my reasoning = everyone else's) is unjustified.
      *   **Task:** Act as a weary, experienced decision theorist. Create a prep sheet for a talk at a mixed decision theory reading group.
      *   **Audience:** Microeconomists (standard rationality), Experimental Game Theorist (hates philosophy, wants data), Philosopher of Action (intentions, agency), Literary Critics (why no communication?).
      *   **Deliverables:**
          *   Brainstorming on audience interests.
          *   8 Objections (ordered by damage), phrased by specific audience members.
          *   2-minute reply for each.
          *   Honest note on where the reply is soft.
          *   What to concede in the first minute (credibility building).
          *   The Dreaded Question (the one to avoid).
          *   Style: British spelling, no references/reading lists, direct/unpolished about weak bits.

  2.  **Deconstruct the "Platonia" Puzzle (Hofstadter's variant):**
      *   *Standard Setup:* Everyone sends a postcard. If $N$ people enter, prize $P$ is split $P/N$. If no one enters, no prize. Usually framed as: "Don't enter, because if everyone enters, payoff is tiny. If everyone stays out, payoff is huge (but zero if you stay out too?)." Actually, Hofstadter's specific version in *Metamagical Themas* was: Send a postcard. If $k$ people send one, each gets $\$1,000,000/k$. If you don't send, you get nothing.
      *   *The "Superrational" Argument:* If I reason perfectly, and everyone else reasons perfectly, we all reach the same conclusion. If the conclusion is "Enter", everyone enters, payoff is small. If the conclusion is "Don't Enter", payoff is zero. Wait, the trick usually involves a probability $p$ of entering. If everyone chooses $p=1/N$, expected utility is maximized.
      *   *The User's Twist:* The user argues this collapses with "noise" (drunks, misreads) and questions the "copying" assumption (why is my reasoning a proxy for theirs?).
      *   *The User's Goal:* Argue it's a coordination problem, not a rationality paradox, and superrationality is a norm, not a law.

  3.  **Audience Analysis (Brainstorming):**
      *   *Microeconomists:* Care about Nash Equilibrium. Dominant strategies. If "Enter" is dominant, you enter. They hate "magical thinking" (causal decision theory vs. evidential). They will attack the idea that my choice *causes* theirs.
      *   *Experimental Game Theorist:* "Show me the data." People don't act like this in labs. Noise exists. They will love the "drunk/misread" point but hate the philosophical wrapping.
      *   *Philosopher of Action:* What does it mean to "decide for everyone"? Is this Kantian? Are we violating agency? They will focus on the "copying" assumption.
      *   *Literary Critics:* Why is communication forbidden? Real people talk. Fiction requires conflict, but this setup forbids the resolution of conflict (talk). They will attack the premise of the novel itself.
      *   *The User (Novelist):* Wants to validate the plot device while critiquing the theory. Needs to sound rigorous enough not to be dismissed as "just a writer."

  4.  **Drafting the Objections (Iterative Process):**
      *   *Objection 1 (The Microeconomist):* Dominant strategy. If entering gives positive expected value regardless of others, you enter. Superrationality violates individual rationality.
      *   *Objection 2 (The Experimentalist):* Noise. You admitted it. If noise exists, the equilibrium breaks. Why is this a *paradox* then? It's just a messy game.
      *   *Objection 3 (The Philosopher):* Agency. You can't bind others with your reasoning. That's magical thinking.
      *   *Objection 4 (The Literary Critic):* Communication. Why can't they call each other? The plot relies on isolation that doesn't exist in reality.
      *   *Objection 5 (Micro/Game Theory blend):* Common Knowledge. Do they *know* everyone is rational?
      *   *Objection 6 (Philosopher):* Normativity. Is "superrationality" a moral duty or a calculation?
      *   *Objection 7 (Experimentalist):* Stakes. Would they do this for £1 or £1m?
      *   *Objection 8 (General):* Definition of Rationality. You're redefining the word to fit your thesis.

      *Refining for "Damage":* The most damaging ones are those that undermine the core thesis (that it's a coordination problem, not rationality) or expose the "copying" assumption as nonsense.
      1.  *Microeconomist:* Causal independence. (Kills the mechanism).
      2.  *Philosopher:* The "Copying" Assumption. (Kills the justification).
      3.  *Experimentalist:* Noise makes the math irrelevant. (Kills the precision).
      4.  *Literary Critic:* Communication. (Kills the plot plausibility).
      5.  *Microeconomist:* Nash Equilibrium. (Standard objection).
      6.  *Philosopher:* Kantian universalization vs. prediction.
      7.  *Experimentalist:* Learning/Iteration.
      8.  *General:* Why does this matter?

      *Let's select the top 8 and phrase them sharply.*

  5.  **Drafting the Replies & Soft Spots:**
      *   Need to be concise (2 mins).
      *   Need to admit weakness (the "honest note").
      *   British spelling (rationalisation, programme, centre, etc.).

  6.  **The "Concession" Strategy:**
      *   Don't claim to solve the paradox. Claim to reframe it. Admit superrationality works *if* assumptions hold. This disarms the "you don't understand the math" attack.

  7.  **The Dreaded Question:**
      *   It needs to be something that exposes the novelist's motive vs. the theorist's rigour. "Are you writing a novel or doing theory?" or "If the theory is broken, why use it as the pivot?"
      *   Better: "If the coordination fails, does your protagonist win or lose?" (Forces admission that the plot relies on the theory being *wrong* but the character believing it's *right*).
      *   Best: "If superrationality is nonsense, why is your character betting their life on it?" (Exposes the thematic contradiction).

  8.  **Review against Constraints:**
      *   British spelling? Yes.
      *   No references? Yes.
      *   Tone: Weary decision theorist? Yes.
      *   8 Objections? Yes.
      *   Ordered by damage? Yes.
      *   Concession in first minute? Yes.
      *   Dreaded Question? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between "Platonia" (Hofstadter) and the user's version is clear enough without getting bogged down.
      *   Make sure the "copying" argument gets hit hard by the Philosopher.
      *   Ensure the Experimentalist sounds like they hate "armchair" stuff.
      *   Ensure the Literary Critics sound annoyed by the contrivance.

      *(Self-Correction during drafting)*: I need to make sure I don't give the user *too* much ammo to win. The prompt asks for an "honest note on where the reply is soft." I need to be brutal about where their argument might crumble. The "copying" assumption is the weakest link philosophically. The "noise" argument is the strongest empirically.

      *Ordering:*
      1. Microeconomist (Causal Independence) - Highest damage.
      2. Philosopher (The Copying Assumption) - High damage to core thesis.
      3. Experimentalist (Noise is fatal, not a feature) - High damage to utility.
      4. Microeconomist (Nash Dominance) - Standard but solid.
      5. Literary Critic (Communication) - Damages plot plausibility.
      6. Philosopher (Normativity vs. Prediction) - Confusion of categories.
      7. Experimentalist (Stakes/Scaling) - Trivialises the finding.
      8. Literary Critic (Character Agency) - Thematic weakness.

      *Wait, I need to make sure the "Dreaded Question" is truly dreaded.* It should be the one that implies the novelist is exploiting a philosophical error for plot convenience.

      *Let's write it.*
answer: |-
  **PREP SHEET: DECISION THEORY READING GROUP**
  **Subject:** Platonia / Superrationality / Coordination
  **Audience:** 3 Micro, 1 Experimentalist, 1 Philosopher, 2 Lit Critics
  **Tone:** Defensive but grounded. Do not pretend to be one of them.

  ### Audience Mapping (Who cares about what)

  *   **The Microeconomists (x3):** They care about *causal independence*. If my choice doesn't physically change yours, my reasoning cannot bind you. They will smell "magical thinking" (Evidential Decision Theory) and attack it as irrational. They want Nash Equilibria, not mystical unions.
  *   **The Experimental Game Theorist (x1):** They care about *variance*. They run labs. They know subjects press the wrong button, get bored, or try to punish the researcher. They will love your "noise" argument but hate that you're calling it a paradox rather than just "human error".
  *   **The Philosopher of Action (x1):** They care about *agency*. They will focus on your "copying" assumption. How can you treat another mind as a mirror of your own without violating their autonomy? Is this Kantian universalisation or just solipsism?
  *   **The Literary Critics (x2):** They care about *plausibility*. Why is there no talking? Why is the mechanism more important than the motive? They will ask why your characters accept the rules of a game that seems designed to make them miserable.

  ---

  ### The Opening Concession (First 60 Seconds)
  *Do not start by telling them they are wrong. Start by telling them where you agree.*

  "Before we begin: I am not arguing that superrationality is mathematically incoherent. If you assume a population of identical, perfectly rational agents with common knowledge of that rationality, the math holds. I am not a mathematician trying to fix your equations. I am a novelist arguing that those assumptions describe a vacuum, not a room. My claim is not that the theory is false, but that it is sociologically fragile. It works only as long as no one actually plays."

  ---

  ### The Eight Objections (Ordered by Damage)

  #### 1. The Causal Independence Attack
  **Who:** Senior Microeconomist (arms crossed)
  **The Objection:** "You're conflating correlation with causation. My reasoning process happens in my skull. Yours happens in yours. There is no causal link. If I enter, I do not *cause* you to enter. Therefore, maximising my expected utility requires me to treat your probability of entering as fixed, regardless of my choice. To do otherwise is magical thinking. Are you seriously suggesting your decision reaches out and moves their hand?"
  **Your Reply:** "I'm not suggesting magic. I'm suggesting prediction. If we are both rational, and we face the same data, we output the same answer. My decision doesn't move their hand; it reveals what their hand is already doing. It's a diagnostic, not a lever."
  **The Soft Bit:** This relies on *Logical Decision Theory*, which is controversial. If they press on "causal independence," you have no empirical backing. You are asserting a correlation that doesn't exist in the real world.
  **Damage:** High. If this fails, the whole mechanism collapses.

  #### 2. The "Copying" Assumption
  **Who:** Philosopher of Action
  **The Objection:** "You say you treat your reasoning as a copy of theirs. On what grounds? To assume your rationality is identical to mine is to erase my agency. It presumes we value the same things, process information the same way, and define 'rational' identically. Isn't this just solipsism dressed up as game theory? Why do you get to assume you are the template for everyone else?"
  **Your Reply:** "You don't. That's the point. The puzzle *requires* that assumption to function as a paradox. In the real world—my world—you don't get to assume that. The puzzle collapses because the assumption is an act of arrogance, not logic."
  **The Soft Bit:** You are admitting the theory only works on a false premise. They will ask why you're spending time on a theory you admit is based on arrogance.
  **Damage:** High. Attacks the moral/philosophical core of your argument.

  #### 3. Noise is Fatal, Not a Feature
  **Who:** Experimental Game Theorist
  **The Objection:** "You say the system collapses because of 'drunks' and 'noise'. Fine. But then it's not a paradox of rationality, it's just a game with high variance. Why call it a failure of superrationality? If I build a bridge and a lorry drives over it, the bridge doesn't fail because of a 'paradox of engineering', it fails because the load exceeded the design. You're blaming the physics for the lorry."
  **Your Reply:** "Because the theory claims robustness. It claims to find the 'correct' answer for rational agents. If the 'correct' answer leads to ruin the moment a single irrational agent appears, the theory isn't robust. It's brittle. I'm arguing brittleness is a theoretical flaw, not just an environmental one."
  **The Soft Bit:** Engineers expect bridges to hold specific loads. Decision theory often assumes ideal conditions. You might be demanding too much of the model.
  **Damage:** Medium-High. Makes your critique seem like a category error.

  #### 4. The Nash Equilibrium Defence
  **Who:** Microeconomist (younger, keener)
  **The Objection:** "In a one-shot game with no communication, 'Enter' is the dominant strategy. If you stay out and I enter, I win. If we both stay out, we both get zero. If we both enter, we split. Unless you can bind me contractually, I must enter. Superrationality asks me to play against my own interest based on a hope that you'll do the same. That's not rationality, that's altruism."
  **Your Reply:** "Precisely. It asks for altruism but labels it rationality. My argument is that the label is misleading. It's a coordination norm masquerading as a calculation. It only works if we've all agreed to pretend we're altruists."
  **The Soft Bit:** You are conceding that 'Enter' is the rational move. This undermines the "puzzle" aspect of your novel.
  **Damage:** Medium. Standard objection, but you can turn it to your advantage.

  #### 5. The Communication Question
  **Who:** Literary Critic (Novelist specialist)
  **The Objection:** "In your book, why can't they just pick up the phone? If the optimal solution requires coordination, and they are rational agents, they should communicate to establish the coordination. By forbidding communication, you're rigging the plot to force the failure. It feels contrived."
  **Your Reply:** "Because the tragedy isn't that they can't talk; it's that talking wouldn't help. Even if they agree to stay out, the incentive to defect remains. The silence isn't physical; it's structural. They can talk, but they can't trust."
  **The Soft Bit:** If they can talk, they can make side-payments or threats. You have to justify why the rules prevent enforceable agreements.
  **Damage:** Medium. Threatens the plausibility of the narrative setup.

  #### 6. Normativity vs. Prediction
  **Who:** Philosopher of Action
  **The Objection:** "Are you saying superrational agents *would* cooperate, or that they *ought* to? You're sliding between a descriptive claim (they will reason the same) and a normative one (they should reason the same). If it's descriptive, it's empirically false. If it's normative, it's ethics, not decision theory."
  **Your Reply:** "It's a normative claim pretending to be descriptive. That's the deception I'm highlighting. It tells you 'you must do this because it's logical', when it actually means 'you should do this because it's nice'."
  **The Soft Bit:** You are accusing the theorists of lying. They won't like that.
  **Damage:** Medium. Philosophical nitpicking, but annoying.

  #### 7. Stakes and Scaling
  **Who:** Experimental Game Theorist
  **The Objection:** "You're talking about life-or-death in your novel. In the lab, if the stakes are high enough, people converge on Nash. If the stakes are low, they play around. Does your argument hold if the pot is £10? Or only if it's £10 million? If it depends on the stakes, it's not a universal paradox."
  **Your Reply:** "It holds more strongly at high stakes. High stakes increase stress, which increases noise. The 'perfect reasoning' assumption degrades faster when people are desperate. The system is most fragile when it matters most."
  **The Soft Bit:** There is evidence that high stakes improve focus, reducing noise. You are guessing here.
  **Damage:** Low-Medium. Empirical quibble.

  #### 8. Character Agency
  **Who:** Literary Critic (Theorist specialist)
  **The Objection:** "If your protagonist knows the theory is brittle, why do they follow it? If they know 'copying' is a fallacy, why do they bet their life on it? It makes them look stupid, not tragic."
  **Your Reply:** "Because they want to believe they are special. They want to believe their reasoning *is* the template. It's a character flaw, not a plot hole. They are seduced by the elegance of the math."
  **The Soft Bit:** Admitting the character is flawed undermines the "cleverness" of the plot device.
  **Damage:** Low. Internal to the book, not the theory.

  ---

  ### The Dreaded Question
  *This is the one you hope they don't ask, because it exposes the tension between your role as a writer and your role as a critic.*

  **Who:** The Experimental Game Theorist (leaning forward, pen down)
  **The Question:** "If the superrational solution is as fragile and unjustified as you say... why is it the pivot of your book? Are you using a broken theory to drive your plot because the *correct* theory (Nash equilibrium) is too boring to write about? Are you exploiting a philosophical error for dramatic convenience?"

  **Why it hurts:** It suggests you know the theory is rubbish, but you're using it anyway because the truth (everyone enters, everyone loses, no mystery) isn't good fiction. It frames your entire talk as a justification for a plot hole.

  **Prepared Answer:** "I'm writing about the seduction of elegance. The tragedy isn't that the theory works; it's that my character *needs* it to work. I'm not endorsing the theory; I'm dramatising the cost of believing in it." (Stick to this. Do not defend the theory.)

  ---

  ### Final Advice
  *   **Don't get bogged down in the math.** You will lose. Keep it on the *assumptions*.
  *   **Watch the Experimentalist.** They are your best ally if you frame "noise" as data, but your worst enemy if they think you're ignoring data.
  *   **The Philosopher** will try to trap you in definitions of "rationality". Refuse the trap. Say "I mean 'effective'."
  *   **The Microeconomists** will try to prove you wrong with equations. Nod, smile, say "In the model, yes. In the room, no."
  *   **British Spelling:** Ensure you write *rationalisation*, *programme*, *centre*, *defence* in any notes you have on the podium. It signals you're local, not an import.

  Good luck. You're walking into a room of people who solve puzzles for a living, telling them the puzzle is fake. They won't like it, but if you hold the line on "sociological fragility," you might survive.
