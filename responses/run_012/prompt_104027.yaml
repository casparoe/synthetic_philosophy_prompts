answer: |-
  Yes, this distinction has an established name: the property you are describing is called **logical depth**, introduced by Charles Bennett in 1988.

  Logical depth is defined as the execution time of the shortest program that outputs the object on a universal Turing machine. Your two-axis picture is correct: the first axis is Kolmogorov complexity (description length), and the second is logical depth (computational effort). A crystal has low complexity and low depth; a genome or the digits of $\pi$ have low complexity but high depth; random noise or a shuffled deck have high complexity but low depth. This measure captures the intuition that "complexity" should imply buried, non-trivial causal history that is compressible but not quickly computable, distinguishing organized structure from both simple order and randomness.

  Regarding your specific questions and boundaries:

  1.  **Name and Measure:** It is a measure of the computational work embedded in the object's structure. It differs from **Kolmogorov complexity**, which measures information content (compressibility) regardless of generation time, and from standard **computational complexity**, which classifies problems (e.g., P vs. NP) rather than individual objects. You may have encountered it in contexts discussing the origin of life or cryptography, where the distinction between "random" and "structured but hard to generate" is critical.
  2.  **Coining:** Since the term exists, no new coinage is required, but the precise definition requires a **significance level**. Because the shortest program is not always stable, Bennett defines depth relative to a parameter $s$: the running time of the shortest program within $s$ bits of the optimal length. This handles cases where a slightly longer program might run vastly faster.
  3.  **Machine Independence:** Your suspicion is correct: logical depth is **not** machine-independent in the strong sense that Kolmogorov complexity is. Kolmogorov complexity varies only by an additive constant between universal machines; logical depth varies by a polynomial factor due to simulation overhead. While this does not change the classification of obviously deep objects (e.g., exponential time remains exponential), it makes the boundary less sharp than for description length. The significance level parameter helps mitigate this instability.
  4.  **Computability:** It is **uncomputable**, and the situation is worse than for Kolmogorov complexity. To determine Kolmogorov complexity, you must solve the halting problem for all programs up to a certain length; to determine logical depth, you must also know the exact runtime of the shortest halting program. Usable survivors exist in the form of resource-bounded approximations, such as **Levin's Kt-complexity**, which penalizes both program length and runtime, allowing for practical comparisons despite theoretical uncomputability.

  Regarding the boundaries you sought: the "work" counted is strictly computational steps on a universal machine, not physical energy or time. A shuffled deck falls on the shallow side (with noise) because its shortest description is the list of cards itself; the causal history of the shuffle is irrelevant unless it is computationally recoverable from the final state via a short program. If the history is lost to entropy or randomness, the depth is low. The neighboring measure most likely to cause confusion is **thermodynamic depth**, which counts physical intermediate states rather than computational steps, but logical depth is the standard for the computational distinction you are making. Your two-axis picture does not collapse; depth is orthogonal to complexity, successfully separating the genome (deep) from the noise (shallow) despite both potentially having high information content relative to a crystal.
