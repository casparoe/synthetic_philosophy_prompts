answer: |-
  Your cousin is right: this is absolutely from a textbook. Specifically, it's a classic example of a **Money Pump**, and Dev is asking for a **Ulysses Pact**. Marcus is applying introductory economic theory to a behavioral economics problem, which is why his logic feels right but leads to a ridiculous outcome.

  Here is the breakdown of what is actually happening, why Marcus is wrong, and how to handle Dev's request.

  ### 1. Is Marcus right that it's all fine?
  **No.** Marcus is relying on the concept of *Pareto Efficiency*—the idea that if two people voluntarily agree to a trade, they must both be better off. In a static, one-time snapshot, he is correct.

  However, the problem is **dynamic inconsistency**.
  If Priya trades for the balcony, then Marcus trades for the quiet room, then Dev trades for the garage, and eventually everyone cycles back to their original rooms, the group has paid ~$400 for **zero net utility gain**. You are all in the exact same physical state you started in, but you are collectively poorer.

  In economics, this proves that the group's preferences are **intransitive** (A > B, B > C, but C > A) or that you are suffering from **hyperbolic discounting**. You value the *immediate* novelty of a new room more than the *long-term* cost of losing $30. Marcus is treating you like rational robots who know what you want; in reality, you are humans who get bored on Saturday night and regret it on Sunday morning.

  ### 2. Where is the problem?
  The problem is a combination of the **system** and **individual psychology**, but the system enables the psychology.

  *   **The Individuals:** You are experiencing "preference reversal." On Friday, you think you want the balcony. On Saturday, the novelty wears off, or the noise bothers you, and you want the quiet room. By Sunday, you miss the balcony. Your "self" changes over the weekend.
  *   **The System:** The $30 fee acts as a transaction cost. In a healthy market, transaction costs prevent frivolous trades. Here, the cost is low enough to be tempting ($30 feels cheap in the moment) but high enough to accumulate into a significant loss ($400 is a lot for a weekend).
  *   **You (The Banker):** This is the tricky part. You hold the shoebox. If that $400 is used for a group dinner on Sunday, it's a forced savings plan. If that $400 just sits there, or if you have any discretion over how it's spent, you have a **conflict of interest**. You are the market maker profiting from the volatility. Even if you don't spend it on yourself, holding the fund makes you the enforcer of a wealth-destructive cycle.

  ### 3. Is Dev's request reasonable or creepy?
  Dev's request is **reasonable and psychologically astute.** He is asking for a **Ulysses Pact** (or pre-commitment device).

  In Greek mythology, Ulysses knew he wouldn't be able to resist the Sirens' song later, so he ordered his men to tie him to the mast and ignore his future pleas to be released. Dev knows his future self (Saturday night Dev) is irrational and impulsive. He wants his present self (Friday Dev) to bind his future self.

  It is not creepy provided that:
  1.  **The terms are clear:** You both agree on exactly what constitutes a "swap" he is forbidden from making.
  2.  **The penalty is fixed:** He keeps the $30 in the box (presumably for the group fund), and you simply say "no."
  3.  **No power trip:** You must agree to this solely to help him, not because you enjoy denying him.

  If you agree to this, you are acting as his external prefrontal cortex. It is a sign of trust, not manipulation.

  ### 4. What would change my mind?
  I would consider this system "harmless" or even "beneficial" if you could prove one of the following three things:

  *   **The Money is Recycled:** If the $400 in the shoebox is strictly earmarked for a group expense that everyone values equally (e.g., a lavish Sunday steak dinner that nobody would have bought individually), then the "loss" is actually a forced contribution to a public good. The room trading is just a fun mechanism to fund the party.
  *   **The Option Value:** If the *ability* to trade provides psychological comfort, even if you don't use it. (Like insurance). But since you *are* using it and cycling back, this doesn't apply.
  *   **The Net Outcome Changes:** If, by Sunday, people actually ended up in rooms they preferred *more* than their original assignment, justifying the cost. But since you end up in the same rooms, the cost is deadweight loss.

  ### The Verdict and Recommendation

  Marcus is wrong because he is ignoring the **time dimension**. A series of rational micro-decisions can add up to an irrational macro-outcome.

  **Here is what you should do:**

  1.  **Accept Dev's Pact:** Agree to his request. It shows you respect his self-awareness. Tell him, "I've got your back. Once Friday night is over, you're locked in."
  2.  **Audit the Shoebox:** Clarify where the money goes. If it's just sitting there, propose that the accumulated cash funds the *next* year's rental deposit or a specific group asset. If the money vanishes into "miscellaneous expenses," you are running a tax on your friends' impulsivity.
  3.  **Propose a "Settlement Period":** Suggest a rule change for next year. Allow trading on Friday only. Once Saturday morning hits, the rooms are locked. This preserves the fun of the market but prevents the Money Pump cycle from draining everyone's wallets.

  You aren't overthinking it. You are the only one looking at the balance sheet at the end of the weekend. Someone has to be the adult in the room—hopefully, it's the one in the normal room, not the one on the balcony.
