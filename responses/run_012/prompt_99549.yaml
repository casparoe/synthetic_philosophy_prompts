      *   **The Argument:** The distinction between killing (acts) and letting die (omissions) is illusory.
      *   **The Analogy:** Two drownings.
          *   Case A: Holding a swimmer under (killing).
          *   Case B: Standing on the bank, able to throw a rope, doing nothing (letting die).
