      *(Final Polish)*: Ensure the distinction between Rachels' original thought experiment (murder for inheritance) and the bioethicist's application (mercy killing) is clear, as that is a critical audit point for a journalist. The bioethicist is repurposing a case about *malice* to argue for *mercy*. That's a potential logical slip.

