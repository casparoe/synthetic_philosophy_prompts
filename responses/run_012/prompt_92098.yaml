answer: |-
  Elena: The moral weight lies in authorship. When I push a man, I make the world worse. When I watch him drown, the world makes him worse. My agency is the variable in the first case, not the second.

  Marcus: But the variable that matters is the dead man. If you stand by the shallow pond, your omission is causally sufficient for his death given your presence. You're hiding behind a metaphysical distinction between my muscles moving and my muscles staying still.

  Elena: It's not metaphysics; it's liability. Consider the criminal law. There's no general duty to rescue. But if I'm a squatter who falls asleep with a lit cigarette and sets the mattress on fire, I have a duty to act. Why? Because I created the danger. The default is no liability for doing nothing, unless my prior agency triggered the threat.

  Marcus: That exception proves the rule. The law punishes you there not because you omitted to fetch water, but because your earlier act was negligent. You're liable for the fire, not the inaction. But look at end-of-life law. In *Vacco v. Quill*, the Supreme Court upheld bans on assisted suicide by leaning on intent, not the act/omission line. They conceded that letting a patient die and killing them are morally equivalent unless the intent differs. That suggests the interesting distinction isn't doing versus allowing at all.

  Elena: Intent is precisely about agency. If I disconnect a ventilator to end suffering, my agency is directed at removing an obstacle to natural death. If I inject poison, my agency is the cause of death. *Vacco* doesn't erase the distinction; it clarifies that agency requires intentionality. The act/omission line is the vehicle for that intention.

  Marcus: Or it's a cognitive bug. Psychologists call it omission bias. We judge harmful actions worse than harmful inactions even when outcomes match. Then you have the Knobe effect: people say a side effect was brought about "on purpose" if it's bad, but not if it's good. Your intuition isn't moral truth; it's a heuristic for assigning blame. You're mistaking a bug in our praise-and-blame software for a feature of the universe.

  Elena: Descriptive psychology doesn't debunk normative ethics. Even if our heuristic for spotting agency is noisy, the principle remains: I am responsible for what I impose on the world, not merely what I fail to alleviate. Warren Quinn argued this tracks positive versus negative rights. I have a right not to be killed by you; I don't have a right to be saved by you.

  Marcus: Quinn is smuggling in the Doctrine of Double Effect. You think it's about rights, but you're actually tracking harm-as-means versus harm-as-side-effect. You don't mind me diverting a trolley where one dies as a side effect, but you balk at pushing him as a means. The act/omission distinction collapses when the omission is a means to an end. If I don't feed you because I want your inheritance, that's murder, not allowing to die.

  Elena: Because in that case, the omission is weaponized. It becomes an act of will. But let's test the boundary. Switching off a ventilator versus never putting someone on one. Medically equivalent outcomes. Legally, often treated differently.

  Marcus: Exactly. If you agree they're different, you're privileging the status quo. Why is the machine being on morally relevant? If I refuse to host a post on my server, I'm allowing harm—the spread of misinformation. If I delete it, I'm doing harm—censorship. But the harm to the public is identical.

  Elena: If I host the server, I've entered a relationship of care. Deleting is an intervention in an existing flow. Declining is maintaining the baseline. But here is where I pay the price: if maintaining the ventilator is an ongoing act of intervention, then switching it off is merely stopping that act. I must concede that once care begins, the distinction blurs. The "doing" is the maintenance, not the withdrawal.

  Marcus: And there is where I pay mine. If *Vacco* is right that intent distinguishes the cases, then consequences aren't the sole metric. I've spent this argument claiming outcomes are all that matter, but if intent matters enough to justify the law's distinction, then I'm admitting non-consequentialist values drive our legal morality. I need intent to explain why the squatter is liable, but I need outcomes to explain why the bystander isn't.

  Elena: So you admit agency matters when it suits your liability model.

  Marcus: And you admit the status quo is arbitrary when it suits your maintenance model. We're stuck. The line moves depending on whether we're looking at the start of the danger or the end of the life.

  Elena: Then the distinction isn't binary. It's a gradient of involvement.

  Marcus: Which means it's not a fundamental moral truth. It's a pragmatic rule of thumb for regulating social cooperation.

  Elena: Or it's the only way to respect persons without demanding sainthood.

  Marcus: We're just describing the same cliff from different sides.

  Elena: And neither of us can jump.
