answer: |-
  Here is the specification you asked for. This is the "design doc" for any theory of pain's badness. It separates the hard data (non-negotiable) from the interpretive frameworks (camp commitments).

  ### The Spec: Desiderata for a Theory of Pain's Badness

  **1. The Asymbolia Constraint (Non-Negotiable)**
  *   **The Data:** Patients with pain asymbolia report the sensory location and intensity of pain ("there is a sharp stimulus at my finger, level 8") but lack the emotional "ouch." They do not withdraw, they do not suffer, and they may not protect the limb.
  *   **The Requirement:** The theory must explain what has been removed. Is the *badness* gone, or just the *reaction* to the badness?
  *   **The Trap:** A theory cannot simply say "asymbolics don't feel pain." They do. It also cannot say "nothing bad is happening" without explaining why we intuitively think burning their hand is a mistake.

  **2. The Scope Constraint (Non-Negotiable)**
  *   **The Data:** Human infants, non-human mammals, and birds withdraw from nociceptive stimuli and exhibit stress responses, despite lacking the cognitive sophistication to form complex propositional attitudes (e.g., "I desire that this sensation cease").
  *   **The Requirement:** The theory must account for why pain is bad for creatures that cannot conceptualize their own suffering or form higher-order aversions.
  *   **The Trap:** If badness requires a complex "not-wanting" attitude, then babies and dogs do not suffer. This is morally and biologically untenable for most theories.

  **3. The Qualitative Specificity Constraint (Non-Negotiable)**
  *   **The Data:** Pain is distinct from nausea, itch, grief, or the smell of rotting meat. They are all "negative," but they are not interchangeable.
  *   **The Requirement:** The theory must explain why pain's badness is *somatic* and *urgent* in a way that nausea is not.
  *   **The Trap:** A theory that says "everything unpleasant is just 'negative valence'" flattens the distinction. Pain demands immediate bodily protection; nausea demands expulsion. The theory must capture this difference in *kind* of badness.

  **4. The Functional/Informational Constraint (Your Addition)**
  *   **The Data:** Pain carries imperative content ("Don't do that," "Protect this"). It interrupts cognition and prioritizes bodily integrity over other goals.
  *   **The Requirement:** The theory must account for the fact that pain is bad partly because of what it *does* to the agent's agency and bodily state, not just how it feels.
  *   **The Trap:** A purely phenomenal theory (it's just a feeling) ignores that pain is a tool. A purely functional theory (it's just a signal) ignores that it hurts even when useless (chronic pain).

  **5. The Harm vs. Suffering Distinction (Analytical Necessity)**
  *   **The Data:** We distinguish between "it hurts" (phenomenal suffering) and "it damages me" (welfare harm).
  *   **The Requirement:** The theory must specify whether pain is bad *because* it feels bad (Suffering View) or *because* it indicates damage (Harm View).
  *   **The Trap:** Conflating the two. Asymbolics might not *suffer*, but they are still being *harmed* (tissue destruction).

  ---

  ### Camp Commitments (Negotiable)
  *These are not data points; they are the moves different schools make to satisfy the spec above.*

  *   **Attitudinalism (Your Mate's Camp):** Claims the sensation is neutral; the "aversion" makes it bad.
      *   *Cost:* Struggles with **The Scope Constraint** (babies).
  *   **Intrinsicism (Traditional View):** Claims the sensation itself is intrinsically bad.
      *   *Cost:* Struggles with **The Asymbolia Constraint** (why doesn't it hurt asymbolics?).
  *   **Imperativism:** Claims pain is a command ("Stop this!"). Badness is the frustration of the command.
      *   *Cost:* Struggles with **Chronic Pain** (where there is no damage to stop).

  ---

  ### The Killer Constraint

  **The Scope Constraint (Creatures/Babies)** is the single most damaging requirement.

  Here is why: It knocks out the pure Attitudinal View (your mate's position) unless they significantly water it down. If your mate insists that the "badness" is entirely in the *aversion* or the *not-wanting*, they must define what counts as an aversion.
  *   If they say it requires a complex thought ("I wish this would stop"), they lose babies and animals.
  *   If they say a simple reflex withdrawal counts as an "aversion," they have redefined "aversion" to mean "biological avoidance." But if biological avoidance is enough, then the *sensation* is doing the work again, not the attitude.
  *   Accepting this constraint forces the Attitudinalist to admit that the "badness" is built into the biological system, not just the conscious mind.

  ### The Tension: Where the Spec Breaks

  There is a direct conflict between **The Asymbolia Constraint** and **The Scope Constraint**.

  *   **Asymbolia** suggests: Sensation is neutral; Affect (minding) is where the badness lives. (Supports Mate).
  *   **Scope (Babies)** suggests: Badness exists without complex Affect/Minding. (Supports You).

  You cannot have it both ways without nuance. If Asymbolia proves sensation is neutral, then for babies, *what* makes it bad if not the sensation? If you say "babies have the affect," you have to explain why asymbolic adults (who have adult brains) lose the affect while keeping the sensation.
  **The Conflict:** Either pain's badness is intrinsic to the sensation (which Asymbolia challenges) OR pain's badness is extrinsic/attitudinal (which Babies challenge). Resolving this tension is the entire job of the philosophy of pain.

  ---

  ### Verdict on Your Mate's Argument

  Your mate is half-right but sneaking in a category error. He is correct that Asymbolia separates the *sensory discrimination* from the *suffering*. However, he conflates **suffering** (the felt experience) with **harm** (welfare damage).

  When he says, "a person in that state isn't actually being harmed by their pain," he is equivocating. They are not *suffering* (no distress), but they are absolutely being *harmed* (tissue destruction continues unchecked). His argument works only if you define "badness of pain" strictly as "conscious distress." If you define it as "a state that negatively impacts the organism's integrity," his view collapses. He is treating the alarm bell as the fire; just because the asymbolic doesn't hear the bell doesn't mean the house isn't burning.
