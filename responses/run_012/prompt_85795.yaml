answer: |-
  ### Part 1: Diagnostic Brainstorming

  You have identified a genuine structural ambiguity in the literature, not merely a verbal dispute. The tension arises because the Church–Turing Thesis (CTT) is asked to anchor two different inferential practices: one in logic (deriving impossibility results) and one in natural science (bounding physical prediction). Below are three ways to distinguish the "Constitutive" and "Delimiting" jobs, evaluated for philosophical traction.

  **1. The Conceptual vs. Physical Distinction**
  *   **The View:** The Constitutive job analyzes the pre-theoretic concept of "effective calculability" (a human with paper and pencil). The Delimiting job claims physical systems obey this analysis.
  *   **Assessment:** This is the standard view (often associated with the 1930s context), but it is vulnerable. If "effective procedure" is defined by human limitations, it is historically contingent. If defined by Turing Machines, it is circular. Furthermore, it does not solve your worry about the "bridging claim." If the bridge is "physical systems implement Turing Machines," that is an empirical claim that could be false, threatening the Constitutive job if the two are too tightly coupled.
  *   **Verdict:** Too fragile. It relies on a notion of "human computation" that is irrelevant to modern physics.

  **2. The Normative vs. Descriptive Distinction**
  *   **The View:** The Constitutive job sets a norm for what counts as a valid algorithmic proof (necessary truth). The Delimiting job describes the causal powers of matter (contingent truth).
  *   **Assessment:** This protects the impossibility results (undecidability remains true even if hypercomputers exist). However, it risks making the Constitutive job irrelevant to science. If physics allows hypercomputation, why should a physicist care about the normative definition of a Turing Machine? It creates a gap that is hard to bridge without making the bridge claim look like a definition in disguise.
  *   **Verdict:** Promising, but needs to explain *why* the norm applies to physics at all.

  **3. The Idealization vs. Realization Distinction (Most Promising)**
  *   **The View:** The Constitutive job defines a mathematical idealization (the Turing Machine) which is resource-unbounded and noise-free. The Delimiting job claims that physical processes can *approximate* this idealization arbitrarily well, or are bounded by it, within specific error margins and resource constraints.
  *   **Assessment:** This leverages your background. In physics, we distinguish between a theory (idealized) and a measurement (noisy, resource-bound). The confusion in CTT debates often stems from sliding between "computable in principle" (ignoring energy/time) and "computable in practice" (feasible). The "bridging claim" becomes a statement about the stability of the idealization under physical perturbation.
  *   **Why it works:** It isolates the modal status. The idealization holds in all possible worlds (math). The realization claim holds only in worlds with physics like ours. It explains the tension: the Constitutive job requires the idealization to be stable; the Delimiting job requires the realization to be faithful.
  *   **Risk:** One might argue that an idealization that cannot be physically realized even in principle is mathematically idle. You must argue that the mathematical utility (undecidability proofs) is independent of physical realizability.

  **Recommendation:** Proceed with **Option 3**. It allows you to treat the "bridging claim" not as a definition or a raw empirical guess, but as a *model-to-world correspondence rule*, subject to the same epistemic scrutiny as any other physical idealization (like frictionless planes). This avoids the trap of the bridge claim collapsing into a definition because correspondence rules are always open to empirical revision.

  ***

  ### Part 2: Research Prospectus

  **Title:** The Dual Status of the Church–Turing Thesis: Idealization and Physical Constraint

  **1. The Research Question**
  The project asks: *Can the Church–Turing Thesis (CTT) be decomposed into a constitutive mathematical norm and a delimiting physical constraint without rendering the latter trivial or the former contingent?*

  A determinate answer requires demonstrating that the two components have distinct truth-conditions. Success looks like a two-tier account where the "Constitutive Tier" secures the necessity of logical impossibility results (e.g., the Halting Problem), while the "Delimiting Tier" functions as a contingent bridge principle linking mathematical idealizations to physical preparations. Failure would be demonstrating that the two tiers are inseparable—that is, showing that the definition of an algorithm inherently presupposes specific physical laws, or that the physical claim is merely a tautology.

  **2. The Problem: Why Familiar Positions Fail**
  Current debates stall because they treat CTT as a monolithic claim. If CTT is a definition, it secures the foundations of computability theory but falls silent on whether the universe is computable. If CTT is an empirical hypothesis, it speaks to physics but renders undecidability results fragile—contingent on the state of our physics rather than logical necessity.

  Hybrid accounts often obscure the modal gap. They fail to distinguish between *principled* computability (ignoring time and energy) and *feasible* computability (bounded by resources). This conflation creates the illusion of tension. When physicists claim "the universe is computable," they often mean "simulatable within resource bounds," whereas logicians mean "computable in the limit." Similarly, the modal scope is rarely settled: does the delimiting claim concern actual systems, nomologically possible systems, or metaphysically possible systems? Until the resource bounds and modal scope are disentangled, the epistemic status of CTT remains ambiguous, forcing philosophers to choose between an irrelevant definition and a fragile empirical guess.

  **3. Methodology and Work Plan**
  The project will proceed over six months using a conceptual analysis grounded in the philosophy of scientific modeling.

  *   **Months 1–2: Conceptual Archaeology.** I will map the distinct inferential roles CTT plays in proof theory versus theoretical physics. The goal is to catalogue where the "slide" between resource-bounded and resource-unbounded claims occurs. I will focus on arguments involving hypercomputation and analog computing to stress-test the boundary.
  *   **Months 3–4: The Physics Interface.** I will analyze the "Delimiting Tier" as a model-to-world correspondence rule. Drawing on the treatment of idealizations in physics (e.g., thermodynamic limits), I will formulate the bridging claim not as "physical systems *are* Turing Machines," but as "physical systems can approximate Turing Machine behavior within specified error margins." This reframes the claim as empirically testable but distinct from the mathematical definition.
  *   **Month 5: Synthesis.** I will construct the two-tier account, explicitly separating the modal status of each tier. I will test this against counter-examples (e.g., relativistic computers, quantum speedups) to ensure the Constitutive Tier remains stable even if the Delimiting Tier is falsified.
  *   **Month 6: Drafting and Refinement.** I will write the dissertation, focusing on clarity and argumentative structure.

  **Why this approach?** Historical surveys or pure logic analysis ignore the physical intuition driving the "Delimiting" job. Conversely, pure physics approaches often miss the logical necessity required for the "Constitutive" job. Treating CTT through the lens of *idealization* respects both the mathematical rigor and the empirical sensitivity required.

  **4. Success, Failure, and Dissolution**
  *   **Success:** A stable distinction where the undecidability of the Halting Problem remains a necessary truth of the Constitutive Tier, while the claim that "no physical system solves the Halting Problem" is a contingent, empirically defeasible claim of the Delimiting Tier.
  *   **Failure:** If I demonstrate that the concept of an "effective procedure" cannot be stated without referencing physical constraints (e.g., signal propagation speeds), the two tiers collapse. In this case, CTT is fundamentally empirical, and logical impossibility results are merely physical generalizations.
  *   **Terminological Dissolution:** If the analysis reveals that the "tension" is merely a confusion of labels already resolved in the literature (e.g., if "Physical CTT" is already universally distinguished from "Mathematical CTT"), the project dissolves. I will guard against this by focusing on the *epistemic justification* for each tier, not just the naming convention.

  **5. Scope and Limitations**
  The primary constraint is time. To remain within scope, I will not engage in the technical details of specific hypercomputation models (e.g., Malament-Hogarth spacetimes) beyond what is necessary to test the bridging claim. I will also set aside the history of Church and Turing's original intentions; the project concerns the current epistemic status of the thesis, not its genealogy. If the two-page limit proves restrictive, I will condense the "Physics Interface" section, relying on the general philosophy of idealizations rather than specific case studies. The core argument—the separation of the normative idealization from the physical realization—must remain intact.
