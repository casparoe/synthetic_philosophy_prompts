prompt: |-
  I'm in a fourth-year bioethics seminar (14 of us, mixed — about half pre-med, half philosophy) and I've been assigned to run one 90-minute session on how we decide when someone is dead. I want to do an activity, not a lecture, and here's my idea: we're a hospital committee drafting the protocol for organ donation after circulatory death, and the protocol uses one of these newer machines. After the heart stops and death has been declared, the surgical team puts the body on a pump that sends oxygenated blood back into the chest and abdomen so the organs don't spoil, and sometimes the heart starts beating again in there. They block off the vessels going to the head so none of it reaches the brain.

  Give me the rules, roles, materials, a timeline, and a debrief. What I most want them to run into is that writing the protocol forces them to pick a criterion of death without noticing they're picking one: whether you're dead when you can't come back, or dead when we've decided not to try to bring you back. So make them commit to the specifics — how long we stand there doing nothing before we call it, whether restarting circulation counts as resuscitation, what we do if the heart kicks back in, whether we can still take organs from a body whose heart is going again, and how that squares with the rule that we only take organs from someone who's already dead. Then in the debrief show them that the answers they wrote only hang together on one of those two readings and not the other, and that the old protocol they inherited assumed the other one.

  Also tell me what'll predictably go wrong the first time I run it — I'm expecting the pre-meds to just defer to whatever the guidelines say and the philosophers to jump straight to personhood stuff, and I don't know how to stop that from happening. And be honest about what the activity can't do: what I'll still have to say myself at the end, and what about the real thing it definately can't reproduce. No citations needed, obviously.
reasoning: |-
  Here's a thinking process that leads to the suggested activity plan:

  1.  **Analyze the Request:**
      *   **Context:** 4th-year bioethics seminar, 14 students (mixed pre-med/philosophy), 90-minute session.
      *   **Topic:** Determination of death, specifically in the context of Donation after Circulatory Death (DCD) with normothermic regional perfusion (NRP) - the "machine" described.
      *   **Goal:** Activity-based (not lecture). Force students to draft a protocol that reveals their underlying criterion of death (irreversibility vs. permanence/unwillingness to resuscitate).
      *   **Specific Tension:** "Dead when you can't come back" (biological irreversibility) vs. "Dead when we've decided not to try" (normative permanence).
      *   **Requirements:** Rules, roles, materials, timeline, debrief, prediction of pitfalls (pre-meds deferring to guidelines, philosophers jumping to personhood), limitations of the activity.
      *   **Tone:** Practical, honest, academic but engaging. No citations needed.

  2.  **Deconstruct the Ethical Problem:**
      *   The core issue is the "Dead Donor Rule" (DDR): Organs can only be taken from the dead.
      *   DCD with NRP (Normothermic Regional Perfusion) complicates this. The heart stops (circulatory death). Then, machines restart circulation *to the body* but not the *brain*.
      *   If the heart beats again on the machine, is the patient alive? If yes, did we kill them by taking organs? If no, why does a beating heart not signify life?
      *   The "Irreversibility" standard: Death is when function cannot resume spontaneously.
      *   The "Permanence" standard: Death is when function will not resume *because we won't try*.
      *   The activity needs to force them to write specific time limits and intervention rules that expose which standard they are actually using.

  3.  **Design the Activity:**
      *   **Scenario:** A Hospital Ethics Committee/Protocol Drafting Group.
      *   **Task:** Write the specific operational steps for DCD-NRP.
      *   **Groups:** Need to mix pre-meds and philosophers to prevent siloed thinking. 3 groups of 4-5 seems right for 14 students.
      *   **Materials:** A "Legacy Protocol" (vague/old), a "Tech Sheet" (describing the machine), and a "Drafting Template" (forcing specific choices).
      *   **Timeline:** 90 mins total.
          *   Intro (10)
          *   Group Work (40)
          *   Present/Clash (20)
          *   Debrief (20)

  4.  **Drafting the Specific Constraints (The "Trap"):**
      *   To make the tension visible, the Drafting Template needs specific questions:
          1.  Wait time after heart stop (2 mins? 5 mins? 10 mins?).
          2.  Definition of "Auto-resuscitation" (Lazarus phenomenon).
          3.  Response if heart beats *during* organ prep (Stop? Continue?).
          4.  Justification for why blocking brain blood doesn't count as killing.
      *   *Self-Correction:* Make sure the "Legacy Protocol" implies one standard (usually permanence) and the machine forces them to confront the other (biological function).

  5.  **Addressing the Pitfalls:**
      *   *Pre-meds deferring to guidelines:* Give them a scenario where guidelines conflict or are silent. Tell them *they* are the guideline writers for this specific new tech. Explicitly forbid "checking UDDA" during the activity.
      *   *Philosophers jumping to personhood:* Restrict the scope. Tell them this is about *cardiopulmonary* criteria, not neurological/personhood. Frame it as legal liability and surgical safety. Force them to talk about *blood flow*, not *consciousness*.
      *   *Facilitator Role:* I need to instruct the user on how to intervene when these happen.

  6.  **Developing the Debrief:**
      *   This is the most critical part. The user wants to show that their answers only cohere on one reading of death.
      *   Strategy: Compare Group A's wait time vs. Group B's intervention rule. Show that if death = biological irreversibility, NRP is problematic. If death = permanence, NRP is fine but requires honesty about "not trying."
      *   Highlight the "Dead Donor Rule" tension.

  7.  **Identifying Limitations:**
      *   What can't this do? It can't solve the metaphysical problem. It can't reproduce the emotional weight of the ICU. It can't account for legal variability (state laws).
      *   What must the instructor say? The instructor needs to name the concepts (Irreversibility vs. Permanence) explicitly at the end, as students might feel the tension but lack the vocabulary.

  8.  **Refining the Plan (Iterative Polish):**
      *   *Roles:* Don't make them "Philosopher" or "Doctor." Make them "Risk Management," "Transplant Surgeon," "Ethicist," "ICU Nurse." This forces practical engagement.
      *   *The Machine:* Call it "Normothermic Regional Perfusion (NRP)" but describe it simply as requested.
      *   *The "Trap":* Ensure the template asks: "If the heart beats on the pump, is the patient dead? Yes/No." If they say Yes, ask "Why does a beating heart not mean life?" If they say No, ask "Are we killing the patient by removing organs?"

  9.  **Final Review against User Prompt:**
      *   90 mins? Yes.
      *   Activity not lecture? Yes.
      *   Rules, roles, materials, timeline, debrief? Yes.
      *   Address pre-med/philosopher split? Yes.
      *   Honest about limitations? Yes.
      *   Focus on Irreversibility vs. Permanence? Yes.

  10. **Writing the Response:** (Drafting the content with a direct, helpful tone.) *Self-correction during drafting: Make sure the "Legacy Protocol" is vague enough to require interpretation but specific enough to anchor them.* *Ensure the debrief questions are sharp.* *Add a specific "Facilitator Cheat Sheet" for the pitfalls.*

  11. **Final Polish:** Check timing. 40 mins for group work might be tight for drafting a protocol. Let's make the template fill-in-the-blank style to save time. 14 students is a bit large for 3 groups (4-5 each). Let's suggest 3 groups of 4 and one group of 2, or just 3 groups (5, 5, 4). Let's go with 3 groups of 4-5.

      *Wait, 14 students.* 3 groups of 4 = 12. 1 group of 2? No. 2 groups of 7 is too big. 3 groups (5, 5, 4) works best.
      *Actually, for a protocol drafting, 3 groups is good for comparison.*

      *Let's refine the "Trap".* The key is the "No Touch" time. If they choose 2 minutes, they rely on permanence (because biology isn't irreversible yet). If they choose 20 minutes, they lean toward irreversibility (but organs spoil). This trade-off is the crux.

      *Okay, ready to write.*
answer: |-
  Here is a complete plan for your 90-minute session. It is designed to be tight, slightly uncomfortable, and focused entirely on the operational tension between *biological irreversibility* and *normative permanence*.

  ### Session Title: The Beating Heart Protocol
  **Topic:** Donation after Circulatory Death (DCD) with Normothermic Regional Perfusion (NRP).
  **Goal:** Force students to operationalize "death" in a way that exposes the conflict between the Dead Donor Rule and the mechanics of organ preservation.

  ---

  ### 1. Materials & Setup

  **Room Setup:**
  *   Three tables arranged in a triangle.
  *   Whiteboard or projector for the final debrief.

  **Handouts (One packet per student):**
  1.  **The Scenario Sheet:** Describes the patient (young, catastrophic brain injury, family withdraws life support, consents to donation) and the Machine (NRP: restarts blood to body, blocks blood to brain).
  2.  **The Legacy Protocol:** A one-page document from 1995. It says: *"Death is declared when circulatory function ceases irreversibly. A waiting period of 5 minutes is observed to ensure auto-resuscitation does not occur."* (It does not define "irreversibly").
  3.  **The Drafting Template:** A fill-in-the-blank protocol form (see below).
  4.  **Role Cards:** (See Roles section).

  **The Drafting Template (The Trap):**
  *   *Section A (Waiting Period):* "Time to wait after heart stops before declaring death: \_\_\_\_ minutes."
  *   *Section B (The Machine):* "Once the machine is connected, if the heart begins beating effectively in the chest: [ ] Stop procedure [ ] Continue procedure."
  *   *Section C (The Justification):* "If continuing while the heart beats, the patient is considered dead because: \_\_\_\_\_\_\_\_\_\_."
  *   *Section D (The Brain Block):* "We block blood to the brain to prevent awareness. If this block fails and blood reaches the brain: [ ] Abort [ ] Continue."

  ---

  ### 2. Roles (Mixed Groups)
  Divide the 14 students into **three groups** (two groups of 5, one group of 4). Do not let them self-segregate by major. Assign roles within the group to prevent the "philosophers theorize, pre-meds decide" split.

  *   **The Transplant Surgeon:** Cares about organ viability. Wants the shortest wait time possible. Worried about organs spoiling.
  *   **The ICU Attending:** Cares about the dying patient. Worried about the appearance of harming the patient.
  *   **The Hospital Lawyer:** Cares about liability and the "Dead Donor Rule." Wants unambiguous definitions.
  *   **The Ethics Facilitator:** Cares about consistency. Asks "Does this match our definition?"
  *   **The Scribe:** (In the groups of 5) Records the specific numbers and choices.

  *Instruction to Class:* "You are not debating whether this is good or bad. You are writing the rule that will be in the chart tomorrow. You must pick numbers."

  ---

  ### 3. Timeline (90 Minutes)

  **0:00 – 0:10: Introduction & Framing**
  *   Briefly explain the scenario. No lecture on bioethics theory.
  *   **Crucial Instruction:** "You cannot appeal to external guidelines (UDDA, UNOS). Those are what you are replacing. You must write the rule based on what you think is defensible. If you write '5 minutes,' you must be able to defend why it isn't 4 or 6."
  *   Hand out packets.

  **0:10 – 0:50: Group Drafting (40 Minutes)**
  *   Groups fill out the Drafting Template.
  *   **Facilitator Move:** Circulate aggressively.
      *   *If Pre-meds say:* "We just follow the standard of care."
      *   *You say:* "This *is* the new standard of care. The machine is new. The old protocol doesn't cover the heart restarting on the pump. Pick a number."
      *   *If Philosophers say:* "But is the person still a person?"
      *   *You say:* "For this protocol, we are using cardiopulmonary criteria only. Personhood is off the table. Focus on the blood flow. Is the organism functioning or not?"
      *   *If they stall on Section C:* "You have to write the sentence that goes in the medical record. 'Patient is dead because...' Finish the sentence."

  **0:50 – 1:10: The Clash (20 Minutes)**
  *   Have each group post their Template on the wall.
  *   Ask one representative from each group to read **Section A (Wait Time)** and **Section B (Heart Restarting)**.
  *   They will likely differ.
      *   *Group 1:* 2 minutes, Continue if heart beats.
      *   *Group 2:* 10 minutes, Stop if heart beats.
      *   *Group 3:* 5 minutes, Continue if heart beats.
  *   Ask the group that chose "Continue if heart beats": "If the heart is beating, oxygenating the liver and kidneys, what biological function is missing that makes them dead?"
  *   Ask the group that chose "Stop if heart beats": "If the heart restarts, have you just resuscitated a dead person? Or did you never declare death correctly?"

  **1:10 – 1:30: The Debrief (20 Minutes)**
  *   This is where you deliver the conceptual payload. (See Debrief Script below).

  ---

  ### 4. The Debrief Script (The "Reveal")

  Do not ask open questions here. Lead them.

  **Step 1: Expose the Contradiction**
  "Look at Group 1 and 3. You said if the heart restarts on the machine, the patient is still dead, and we can take the organs. But biologically, the heart is pumping. Blood is moving. Metabolism is happening in the torso. The only reason that isn't 'life' is because you manually clamped the arteries to the brain."

  **Step 2: Name the Criteria**
  "You have implicitly chosen one of two definitions of death, and they are mutually exclusive."
  *   **Definition A (Biological Irreversibility):** Death is when the body *cannot* restart on its own. If you choose this, NRP is ethically fraught. If the machine *makes* it restart, was it ever dead? If you wait 5 minutes, biology says it *could* have restarted (Lazarus phenomenon is rare but possible). So you aren't waiting for irreversibility; you're waiting for permission.
  *   **Definition B (Normative Permanence):** Death is when the body *will not* restart because we have decided not to try. If you choose this, NRP is fine. The heart beating on the machine doesn't matter because the *decision* not to resuscitate stands. The patient is dead because we gave up on them, not because their cells died.

  **Step 3: The Dead Donor Rule (DDR)**
  "The DDR says: Do not kill the patient to get organs.
  *   If you hold Definition A: Restarting the heart proves they weren't dead. Taking organs kills them.
  *   If you hold Definition B: They are dead by decision. Taking organs doesn't kill them.
  *   **The Problem:** Our law and our old protocol (the 1995 one) use the *language* of Definition A ('irreversible'), but the *practice* of Definition B ('we won't try'). This protocol forces you to admit which one you are actually using."

  **Step 4: Conclusion**
  "You didn't just write a protocol. You picked a metaphysics. If you say '5 minutes,' you aren't waiting for biology to finish. You're waiting for legal cover. If you say 'Heart beating doesn't count,' you are saying death is about the brain's potential, not the heart's action. You cannot have it both ways."

  ---

  ### 5. Predictable Pitfalls & How to Stop Them

  **Pitfall 1: The Pre-Med Deferral**
  *   *What happens:* They say, "I'd just check with the OPO (Organ Procurement Organization) coordinator" or "There's a law for this."
  *   *The Fix:* Interrupt immediately. "In this scenario, the OPO coordinator is on vacation. You are the committee. The law is vague on NRP specifically. If you write 'Check the law' on the protocol, the surgeon doesn't know what to do at 3 AM. Give me a number."
  *   *Why:* You need to strip away the authority buffer so they feel the moral weight of the choice.

  **Pitfall 2: The Philosopher's Escape**
  *   *What happens:* They start talking about "personhood," "consciousness," or "what makes us human."
  *   *The Fix:* "That is a valid conversation for Week 10. This is Week 4. This protocol is based on *circulatory* criteria. Even if the person is gone, the *organism* might be alive. Does the organism meet the definition of death? Keep it somatic."
  *   *Why:* If they go to personhood, they bypass the circulatory tension. You need them stuck in the biology.

  **Pitfall 3: Consensus without Clarity**
  *   *What happens:* They write "Wait until irreversible cessation."
  *   *The Fix:* Reject the form. "Define 'irreversible' in operational terms. Does it mean 'cannot happen spontaneously' or 'will not happen because we won't let it'?"
  *   *Why:* Vague language is the enemy of this exercise.

  ---

  ### 6. Honest Limitations (What This Activity Can't Do)

  You asked for honesty about what you'll still have to say and what the activity can't reproduce.

  **1. You must name the concepts.**
  Students will feel the tension, but they likely won't have the vocabulary to label it. They will leave feeling confused unless you explicitly label **"Irreversibility" vs. "Permanence."** The activity generates the data; you must provide the theory. Do not expect them to derive the philosophical distinction on their own in 20 minutes.

  **2. It can't reproduce the emotional stakes.**
  This is a dry drafting exercise. In reality, the family is in the next room crying. The surgeon is stressed. The "Dead Donor Rule" feels different when you are holding a scalpel vs. holding a pen. You need to acknowledge in the debrief that *emotional intuition* often drives these protocols more than logic, and their clean answers might muddy in the ICU.

  **3. It simplifies the Neurology.**
  The scenario blocks blood to the brain. In reality, NRP is controversial precisely because of the risk of collateral flow to the brain (restoring potential consciousness). The activity treats the brain block as a given switch. You need to mention in the debrief that the "brain block" is the most technically vulnerable part of the procedure, which heightens the ethical risk.

  **4. It assumes a binary choice.**
  In the real world, hospitals fudge this. They use "permanence" language in public and "irreversibility" language in court. The activity forces a choice that real institutions often deliberately obscure. You should point out that *ambiguity* is sometimes a feature of policy, not a bug, to allow different stakeholders to agree for different reasons.

  ### Summary Checklist for You
  *   [ ] Print 14 Scenario/Template packets.
  *   [ ] Prepare Role Cards.
  *   [ ] Practice the "No, give me a number" interruption for the pre-meds.
  *   [ ] Practice the "Keep it somatic" interruption for the philosophers.
  *   [ ] Write "IRREVERSIBILITY" and "PERMANENCE" on the board before the debrief starts.
  *   [ ] Accept that they will leave uncomfortable. That is the success condition.
