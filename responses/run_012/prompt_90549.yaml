      *   *Section 4: Analytical Value.* Bicycle = Normative dressing. Ratchet = Descriptive but static.
      *   *Section 5: Alternative.* The "Sailboat Heaving-to" or "Coalition Government". I'll go with **A Coalition Government** because it captures the political negotiation aspect better than mechanical metaphors. Or **A Renovated Cathedral**. Let's choose **A Sailboat** because it directly addresses the physics of the Bicycle metaphor (fluid dynamics vs. mechanics). *Correction:* A Sailboat is better for "external wind". Let's go with **A Multi-Speed Train**. No.
      *   *Let's go with:* **A Living Constitution.** No, that's legal.
      *   *Okay, I will propose:* **A Polycentric Arch.** It holds weight through tension. If you stop adding stones, it stands. If you remove keystones, it falls. It allows for "differentiated integration" (some arches higher than others).
      *   *Actually, the best theoretical alternative is:* **A Regime Complex.** But I need an image. **A Coral Reef.**
      *   *Let's settle on:* **A Sailboat capable of 'Heaving-to'.** This is a specific sailing maneuver where you lock the sails to stay almost stationary in rough weather without sinking. It directly refutes the bicycle.

  7.  **Refining the Argument:**
      *   *Bicycle:* Relies on Neo-Functionalism (Haas). Spillover.
      *   *Ratchet:* Relies on Historical Institutionalism (Pierson). Lock-in.
      *   *Critique:* Both ignore Intergovernmentalism (Moravcsik). States *can* say no.
      *   *Bicycle Break:* The EU *has* paused (Eurosclerosis) without collapsing.
      *   *Ratchet Break:* Brexit (reversibility exists).
      *   *Conclusion:* The Bicycle is a political weapon, not an analytical tool. The Ratchet is a legal description, not a political one.
      *   *New Image:* **A Coalition Government.** It captures the need for agreement to move, the ability to gridlock (stasis), the risk of collapse (election/no confidence), and the lack of inherent teleology.

      *(Self-Correction during drafting)*: A Coalition Government is an analogy, not a physical image. The prompt asks for "what we should be picturing." I will offer **A Sailboat Heaving-To** as the physical image, but explain it through the lens of **Coalitional Stability**. Actually, **A Bridge Under Tension** is good.
      Let's go with **A Sailboat.** It allows for "Heaving to" (stasis without sinking), "Tacking" (sideways movement/differentiation), and requires wind (external geopolitical pressure). It refutes the "forward or die" mechanic.

  8.  **Final Polish:** Ensure the tone is that of a seasoned theorist. Avoid taking sides on *whether* integration is good, focus on *whether the metaphor holds*. Use terms like "teleology," "functionalist spillover," "path dependence," "acquis."

      *Check:* Did I answer all parts?
