      *Refining the "Critical Breaks":* The most critical break is the empirical one. The EU *did* stop in the 1970s and post-2005. It didn't crash. It Eurosclerosed. The bicycle metaphor cannot explain Eurosclerosis.
      *Refining the "Ratchet":* It explains the *Acquis* but not the *Politics*.
      *Refining the "Alternative":* I'll suggest **A Multi-Engine Aircraft.** You can fly on partial power. You can hold altitude. You can land. It captures complexity better.
      *Actually, I think **A Coalition Government** is the most theoretically honest, even if less "image-like". I will frame it as **A Permanent Coalition Government**.*
      *Wait, let's stick to a physical image.* **A Gothic Cathedral.** Built over centuries, different styles (differentiated integration), can stop building for 50 years, doesn't fall down, but requires maintenance.
