      *   *Correspondence:*
          *   Rider: Member States? Commission? Citizens?
          *   Pedals: Treaty revisions? Legislation? Crisis response?
          *   Momentum: Political will? Economic interdependence?
          *   Gravity: Centrifugal forces? Nationalism? Sovereignty?
          *   Road: Geopolitical landscape? Single Market rules?
          *   Balance: Supranational vs. Intergovernmental?
      *   *Breaks:* Bicycles can be put on a stand (status quo *is* possible). Bicycles can steer sideways (differentiation/multi-speed). Bicycles don't build themselves (EU *acquis* accumulates). A bicycle doesn't necessarily have a destination (teleology vs. process).
      *   *Critical Breaks:* The idea that *any* pause leads to a crash is empirically falsifiable (e.g., periods of stagnation in the 70s or post-2005 Constitution failure didn't lead to total collapse). The "forward" direction is contested (deepening vs. widening).

  3.  **Deconstruct the "Ratchet" Metaphor:**
      *   *Core Claim:* Path dependence. Irreversibility.
      *   *Implications:* Accumulative, Structural constraint, No teleology of motion (just directionality), Stability in stasis allowed.
