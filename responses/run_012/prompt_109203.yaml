answer: |-
  Based on the track record you've described, your friend isn't running a simple "was the number right?" algorithm. She's running a **causal epistemology**. She cares less about the accuracy of the number and more about *why* the number was wrong.

  Here are the rules she is actually using, the verdict she will likely deliver, and the case that would break her system.

  ### 1. The Rules of the Spreadsheet

  From her past verdicts, we can extract four operating principles:

  *   **The Preemption Clause (The Ozone Rule):** If a forecast triggers the specific human action that prevents the forecast from coming true, it is **Not Falsified**. The failure of the prediction is evidence of the prediction's success.
  *   **The Mechanism Credit (The Malthus Rule):** If the underlying physical constraint is real, but the timeline is defeated by exogenous technological innovation the forecaster couldn't foresee, the verdict is **Right but Early**. The theory survives the data because the data was changed by an outside variable.
  *   **The Empirical Hardline (The Ehrlich/Marx Rule):** If the mechanism is socio-economic (rather than physical), or if the "escape hatch" relies on an untestable counterfactual (e.g., "famine would have happened without the Green Revolution"), the verdict is **Falsified**. You cannot claim credit for a disaster you didn't cause, nor can you claim a near-miss without proof of the bullet.
  *   **The Scope Limit (The Hubbert Rule):** Specific, bounded claims (US Peak Oil) score better than vague, global ones (Global Peak Oil). If a claim retreats to a smaller scope after a miss, the original is 'Right but Early' or 'Still Open', but the new claim must stand on its own.

  ### 2. The Verdict: "Not Falsified"

  She is going to score the 2011 Wheat Forecast as **'Not Falsified'**.

  **Why?**
  It comes down to the difference between the Malthus case and the Ozone case.
  *   **Malthus** did not cause the Green Revolution. His framework was passive; technology saved us *despite* him. That earns 'Right but Early'.
  *   **Ozone** scientists *did* cause the Montreal Protocol. Their framework was active; policy saved us *because* of them. That earns 'Not Falsified'.

  The 2011 Food Policy Group fits the **Ozone** profile, not the Malthus one. The prompt explicitly states: *"the 2011 report is generally credited with kicking off the drip-irrigation subsidy programmes."*

  Unlike Ehrlich, where the "escape hatch" (Green Revolution) was external luck, here the escape hatch (drip irrigation subsidies) was **endogenous** to the forecast. The forecast performed a speech act; it changed the world in a way that negated its own prediction. Under her Preemption Clause, this protects the forecast from falsification.

  She will likely add a footnote acknowledging the **Mechanism Credit** (salinisation data was right), but the primary label will be 'Not Falsified' because the *reason* for the error was successful intervention, not model failure.

  ### 3. Where I'd Put My Money

  I would bet on **'Not Falsified'** over 'Right but Early'.

  *   **Reasoning:** 'Right but Early' implies the disaster is still coming, just delayed (like Hubbert's US Peak). The forecasters have already retreated to a new model (6% loss by 2035 in specific deltas). If your friend scores this 'Right but Early', she validates the idea that the 2022 yield increase was a temporary reprieve. But given the Ozone precedent, she treats "prevented by belief" as a distinct category from "delayed by tech."
  *   **The Tell:** The key phrase in your description of the Ozone verdict is *"the reason it looks like a false alarm is that everyone believed it."* The key phrase in the Wheat case is *"part of why the original call failed is that people read it and did something about it."* The linguistic parallel is too strong for her to ignore. She rewards forecasts that make themselves obsolete through success.

  ### 4. The Killer Case: How to Split the Rules

  To break her system, you need a case that forces a collision between the **Preemption Clause** (Ozone) and the **Mechanism Credit** (Malthus). You need a scenario where action prevented the outcome, but the underlying science is later proven wrong.

  **The Case:**
  > A government agency predicts in 2020 that a specific rare earth mineral (let's call it *Unobtainium*) will run out by 2030, causing tech collapse.
  >
  > **Action:** Based on this report, the world invests billions in recycling and substitutes.
  > **Outcome:** In 2030, there is no shortage.
  > **Retrospective:** In 2031, a new geological survey reveals the original 2020 reserve estimates were wrong. There was actually enough *Unobtainium* for 100 years. The shortage was never physically possible.

  **The Split:**
  *   **If she follows the Ozone Rule (Preemption):** She must score this **'Not Falsified'**. The warning triggered action that ensured stability. The outcome (no collapse) was achieved.
  *   **If she follows the Malthus Rule (Mechanism):** She must score this **'Falsified'**. Malthus got credit because the *constraint was real* (population does outstrip food), even if tech solved it. In this Unobtainium case, the constraint was *fake*. There was no physical reality to be "right" about.
  *   **If she follows the Ehrlich Rule (Empirical):** She must score this **'Falsified'**. The specific prediction (shortage by 2030) was wrong, and the "escape hatch" (we recycled) is now moot because the scarcity didn't exist.

  **Why this breaks it:**
  This case isolates **truth** from **utility**.
  *   Ozone worked because the threat was real *and* we acted.
  *   Malthus worked (in her eyes) because the threat was real *even though* we acted.
  *   Unobtainium fails because the threat was fake *even though* we acted.

  If she scores Unobtainium as 'Not Falsified', she admits her system values **policy utility over scientific truth**. If she scores it 'Falsified', she admits that **Preemption only works if the science holds up**, which undermines the Ozone verdict (since we can never know for sure how bad the Ozone hole would have gotten).

  That is the crack in the spreadsheet.
