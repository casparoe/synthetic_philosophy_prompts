  **Folk Reading:** "Science must never discuss God or unobservable causes." (Justification: This reading ignores the General Scholium's theology and treats "hypotheses" as any idea not directly touched by hand.)

  **Newton's Own Reading:** "I have mathematically described *how* gravity behaves, but I will not pretend to know the mechanical *cause* of gravity without empirical evidence." (Justification: This fits the immediate text where he admits ignorance of gravity's cause while affirming God's design of the system.)

  ### Analysis for the Backend Engineer

  You asked for a disambiguation without jargon, so here is the plain-language breakdown of why your colleague is technically quoting the text correctly but interpreting the "codebase" incorrectly.

  **1. The Context of the Slogan**
  When Newton wrote "hypotheses non fingo," he was responding to critics who asked, "Okay, you've shown gravity works mathematically, but *what is it?* Is it a fluid? Is it magnetic?" Newton's answer was effectively: "I don't know, and I won't write a guess into the core math until I have data." He was distinguishing between **mathematical description** (which he had) and **mechanical explanation** (which he lacked).

  **2. Why the Colleague is Wrong**
  Your colleague is using Reading #4 (The Hard Positivist Clause). He treats "hypothesis" as "anything we can't measure directly," including God. However, Newton explicitly violates this in the very same essay. Newton argues that the order of the solar system is a "phenomenon" (an observed fact) that *requires* an "intelligent Being" as an explanation. To Newton, inferring God from the design of the solar system was not "feigning a hypothesis"; it was a logical deduction from phenomena, similar to inferring gravity from falling apples.

  **3. The Self-Undermining Aspect**
  The slogan becomes self-undermining if used to ban theology. If "hypotheses non fingo" means "do not speak about things you cannot mechanically demonstrate," then Newton's own statements about God's dominion in the General Scholium must also be deleted. Your colleague is effectively compiling a version of Newton's text with the theology commented out, while claiming the source code forbids theology.

  **4. The Gap**
  *   **The Folk Reading** assumes Newton meant "Stick to the data, ignore the why." This is the modern scientific stance (often called instrumentalism).
  *   **Newton's Reading** was "Stick to the data for the *mechanism*, but use the data to infer the *Designer*." He believed he was being more religious by not pretending to know *how* God made gravity work, thereby leaving room for God's miraculous power rather than reducing it to a clockwork machine.

  **Verdict:** Your colleague is right that Newton rejected *speculative mechanical causes* (like invisible fluids pushing planets). He is wrong that Newton rejected *metaphysical inferences* (like God). The slogan is a boundary marker for **mechanism**, not for **meaning**.
