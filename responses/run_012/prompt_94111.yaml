answer: |-
  The ban on analogy renders the inference of specific beliefs and named institutions unanswerable, so you must pivot the project from interpreting social meaning to documenting material transformations and relational differences without categorizing them.

  Without ethnographic analogy, you lack the bridge to move from physical state (broken, burnt) to mental state (belief, ritual) or social category (property, hierarchy), because those categories are themselves theoretical constructs derived from comparative ethnography. Consequently, the question of whether belief is the right target is the most upstream priority; answering "no" dissolves the need to answer whether the record underdetermines belief, because you cease attempting to find it. The question of inferring institutions from deposition is downstream of this, as it requires deciding whether structural differentiation equals social hierarchy—a leap the ban explicitly forbids. The vocabulary question is a parallel constraint affecting all reporting, while the underdetermination question is the downstream epistemological conclusion you will inevitably reach if you attempt the traditional route.

  Regarding tractability, only the shift from belief to practice and the reflexive management of vocabulary are tractable; inferring institutions or proving underdetermination regarding belief are untractable because they require the forbidden comparative logic to validate the categories. You should move the "practice over belief" question to the top immediately if wear analysis or reconstruction data shows evidence of skilled repetition rather than symbolic variance. You would move the "institutions" question up only if you develop a formal language of differentiation (e.g., "high-energy deposition") that avoids loaded terms like "wealth" or "status," though the panel may still reject the inference.

  Instead of trying to reconstruct their society, the project should focus on an ontology of events: describe the breaking, burning, and rebuilding as material processes with consequences, not as expressions of ideology. Map the spatial relationships and material flows (e.g., "objects from distance X found in location Y") without assigning them a mechanism like "trade" or "prestige." Your output should be a catalogue of transformations and associations that allows future researchers to apply their own analogies, rather than a narrative that smuggles in your own.
