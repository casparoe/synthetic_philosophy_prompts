      *   Did I discuss what moves questions up/down? Yes.

      *Critique on "Unanswerable":* Is it truly unanswerable? Some might argue structuralism or internal comparison works. But the prompt says "no reasoning from any documented society." Internal analogy (comparing House A to House B) is allowed, but external analogy (House A is like House B in Society X) is not. Inferring "property" requires a concept of property. If "property" is a colonial assumption (as the panel suggests), then you cannot infer it. So yes, inferring *institutions as we name them* is unanswerable. Inferring *differentiation* is possible. I need to be precise here. The *categories* are the problem.

      *Revised Bottom Line:* The ethics ban renders the inference of specific beliefs and named institutions unanswerable, so you must pivot the project from interpreting social meaning to documenting material transformations and relational differences without categorizing them.

      *Ranking:*
      1.  **Target Selection (Belief vs. Practice):** Upstream. If you can't know belief, don't look for it.
      2.  **Institutional Inference (Deposition vs. Assumption):** Mid. Can we see difference without calling it hierarchy?
      3.  **Vocabulary Limits (Our words vs. Their reality):** Meta/Parallel.
      4.  **Underdetermination (Material record limits):** Downstream/Result.

      *Alternative Project:* Focus on the *biography of objects* and *site formation processes*. Describe the *act* of breaking, not the *rite*. Describe *distance* of goods, not *trade* or *prestige*.

      *Wait, one nuance:* The prompt asks "Which open conceptual questions... should we prioritise". If I say "They are unanswerable, do something else," I still need to answer which questions to prioritize *if* they were to try, or prioritize the question of *whether* to try. I will prioritize the question of "Belief vs Practice" because answering that negatively tells them to stop looking for belief.

      *Let's tighten the first sentence.* "The ban on analogy makes the central questions of inferring belief and institutions unanswerable, so you should pivot the project from interpreting meaning to documenting material transformations and relational differences."

