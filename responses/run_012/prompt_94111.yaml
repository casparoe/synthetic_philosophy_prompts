prompt: |-
  I direct a three-year project excavating a settlement of about forty houses, rebuilt on the same footprints over several centuries. The inhabitants left no writing and no identifiable descendants, and our evidence is entirely material: the rebuilt houses; a pit just outside the settlement holding some three thousand objects, most of them broken in a consistent and apparently intentional way and many of them burnt; and a cemetery in which a minority of graves contain goods carried from several hundred kilometres away. The funder's ethics panel has barred us from ethnographic analogy — we may not reason from any documented society, past or present, to this one — on the grounds that such reasoning smuggles in colonial assumptions about what counts as religion, property or a person. The ban removes the crutch my discipline normally leans on, and I want to know what to do with three years of work.

  Which open conceptual questions about getting from objects to beliefs and institutions should we prioritise, and in what order? The kind of thing I have in mind: whether a material record of this sort underdetermines any attribution of belief; whether belief is the right target at all, rather than practice or skill; whether institutions such as hierarchy, inheritance or property can be inferred from patterns of deposition rather than quietly assumed; and what happens to our descriptions when the only vocabulary available is our own. Rank them, say which are upstream of which, which are tractable for a team with no texts, no informants and no permitted comparison, and what would move a question up or down the list. If you think the ban on analogy makes the central questions unanswerable rather than merely hard, say so and tell me what the project should be doing instead.

  Lead with your bottom line in the first sentence, then give your reasoning; no preamble, and no restating of my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Director of a three-year archaeological project.
      *   **Site:** Settlement (40 houses, rebuilt on same footprints over centuries), Pit (3000 broken/burnt objects, intentional), Cemetery (minority with exotic goods).
      *   **Constraints:** No writing, no descendants, material evidence only. *Crucial Constraint:* Funder's ethics panel banned ethnographic analogy (no reasoning from documented societies past or present) to avoid colonial assumptions.
      *   **Task:** Prioritize open conceptual questions about moving from objects to beliefs/institutions. Rank them, explain upstream/downstream relationships, assess tractability given constraints, and advise on what moves questions up/down. If the ban makes questions unanswerable, say so and suggest alternative project goals.
      *   **Format:** Lead with bottom line in the first sentence. No preamble. No restating the question.

  2.  **Deconstruct the Constraint (The Ban on Analogy):**
      *   This is an extreme methodological constraint. Archaeology *always* relies on some form of analogy (formal, relational, etc.) to interpret function and meaning. Banning *all* ethnographic analogy effectively bans interpreting *meaning* beyond the immediate physical properties of the objects.
      *   However, the user asks what conceptual questions to prioritize *given* this constraint, or if the project should pivot.
      *   The ban makes inferring specific *beliefs* (religion, ideology) nearly impossible without smuggling in assumptions.
      *   It makes inferring *institutions* (property, hierarchy) difficult but potentially accessible through spatial analysis and distribution patterns (material correlates) without needing specific cultural labels.
      *   The "bottom line" needs to be decisive: Is the project viable as planned (inferring beliefs/institutions), or does it need to pivot?

  3.  **Evaluate the "Bottom Line":**
      *   If the ban is absolute, inferring *beliefs* is unanswerable. Inferring *institutions* is highly problematic but potentially salvageable through relational material analysis (ontology-focused).
      *   The most honest answer is that the ban makes the traditional goal (objects -> beliefs/institutions) unanswerable in the way archaeology normally conceives it.
      *   Therefore, the project should pivot from *interpretation of meaning* to *description of relational patterns* and *ontological experimentation*.
      *   *Draft Bottom Line:* The ban on analogy renders the traditional archaeological goal of inferring specific beliefs or institutions unanswerable, so you must pivot the project from interpreting meaning to mapping relational patterns and ontological possibilities.

  4.  **Ranking the Conceptual Questions:**
      *   *Question 1: Whether belief is the right target at all, rather than practice or skill.* (Upstream. If you can't infer belief, don't try. Focus on what the materials *do*.)
      *   *Question 2: Whether institutions such as hierarchy, inheritance or property can be inferred from patterns of deposition rather than quietly assumed.* (Mid-stream. Depends on Q1. If focusing on practice/deposition, can we see structure without naming it "property"?)
      *   *Question 3: What happens to our descriptions when the only vocabulary available is our own.* (Meta-level. Always present, but becomes critical when analogy is banned.)
      *   *Question 4: Whether a material record of this sort underdetermines any attribution of belief.* (Downstream/Conclusion. This is the result of trying and failing.)

      *Refining the Rank:*
      1.  **Ontological Priority:** Is belief the right target? (If no, stop trying to find belief.)
      2.  **Methodological Validity:** Can institutions be inferred from deposition without analogy? (If no, stop calling it hierarchy/property.)
      3.  **Linguistic Constraint:** What happens to descriptions using only our vocabulary? (Affects reporting.)
      4.  **Epistemological Limit:** Does the record underdetermine belief? (The conclusion.)

      *Tractability:*
      *   Q1 (Practice over Belief): Tractable. Focus on wear, reconstruction, spatial use.
      *   Q2 (Institutions from Deposition): Partially tractable. Differentiation in graves/houses is visible, but *labeling* it hierarchy/property is the trap.
      *   Q3 (Vocabulary): Tractable as a reflexive exercise.
      *   Q4 (Underdetermination): Tractable as a negative finding.

  5.  **Addressing the "Unanswerable" Clause:**
      *   The prompt asks: "If you think the ban on analogy makes the central questions unanswerable rather than merely hard, say so and tell me what the project should be doing instead."
      *   My assessment: Yes, it makes inferring *beliefs* and named *institutions* (property, religion) unanswerable because those categories *are* the colonial assumptions the panel fears.
      *   Alternative: Focus on *material agency*, *ontological symmetries*, and *relational patterns*. Describe the *work* done (breaking, burning, rebuilding) without assigning the *why* (belief) or the *social label* (property).

  6.  **Developing the Reasoning:**
      *   **Upstream/Downstream:** The decision on *what* to target (belief vs. practice) is upstream of *how* to infer it (deposition patterns). The vocabulary issue permeates everything.
      *   **Tractability:** Without analogy, you cannot bridge the gap between "broken pot" and "ritual sacrifice." You can only bridge "broken pot" to "act of breaking."
      *   **Moving Questions:** New data (e.g., isotopic analysis on the burnt objects) might move "practice" up. Discovery of spatial segregation might move "differentiation" up, but not "hierarchy."
      *   **Pivot:** The project should become an exercise in "archaeology without interpretation" or "ontological archaeology" (following Alberti, Hodder, etc., though careful not to use them as analogy). Actually, better to frame it as *describing transformations*.

  7.  **Drafting the Response (incorporating constraints):**
      *   *Sentence 1:* The ban on analogy makes inferring specific beliefs or named institutions unanswerable, requiring you to pivot from interpreting meaning to mapping relational patterns and material transformations.
      *   *Reasoning:* Explain why analogy is necessary for "belief" and "property."
      *   *Ranking:*
          1.  Belief vs. Practice (Upstream).
          2.  Institutions from Deposition (Mid).
          3.  Vocabulary Limits (Meta).
          4.  Underdetermination (Conclusion).
      *   *Tractability:* Only practice and deposition patterns are tractable. Beliefs are not.
      *   *Alternative:* Focus on the *events* (breaking, burning, rebuilding) as the primary data, not the *objects* or the *people*.

  8.  **Refining the Tone:**
      *   Direct, professional, authoritative but empathetic to the methodological crisis.
      *   Avoid preamble.
      *   Ensure the first sentence is the bottom line.

  9.  **Self-Correction/Check:**
      *   Did I restate the question? No.
      *   Is the first sentence the bottom line? Yes.
