      *Order:* 1 is upstream of 4. 2 is dependent on 1 (if belief isn't target, is institution?). 3 is overarching.
      Actually, 1 is the most upstream. If belief is not the target, 4 becomes moot (or rather, the answer is "yes, it does underdetermine, so stop"). 2 is the next practical hurdle. 3 is the constraint on reporting. 4 is the epistemological conclusion.

      *Tractability:*
