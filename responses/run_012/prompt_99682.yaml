              3.  End: She has $X$ minus $2\epsilon$. Started with $X$.
      *   *Sophistication:* If she foresees this at $t_0$, she knows she will trade back. So at $t_0$, she knows the net result of accepting Trade 1 is $X - 2\epsilon$. Since she prefers $X$ to $X - 2\epsilon$, she should reject Trade 1 *if* she is sophisticated and cannot bind.
      *   *Wait, if she rejects Trade 1, is she pumped?*
          *   If she is *Naive*: Yes, she takes Trade 1, then takes Trade 2.
          *   If she is *Sophisticated* (no binding): She anticipates Trade 2. She knows taking Trade 1 leads to net loss. She rejects Trade 1. She is *not* pumped, but she loses the opportunity to hold $Y$ (which she values at $t_0$). This is the "unattainable plan" problem.
          *   If she is *Sophisticated* (with binding): She binds to $Y$. She pays a commitment cost perhaps.
      *   *Refining Question 3:* The prompt asks: "if she anticipates... and can bind herself... does the pump become impossible, or does it merely move the cost elsewhere?"
          *   If binding is free: Pump impossible.
          *   If binding costs: Cost moves to commitment fee.
          *   What does this reveal? It reveals the conflict between "Self at $t_0$" and "Self at $t_1$".
      *   *Refining Question 4:* Resoluteness. A resolute chooser ignores the preference at $t_1$. She sticks to $Y$. No trade 2. No pump.
      *   *Distinguishing Pumps:*
          *   Synchronic: Defect is in the *ordering*. No amount of resolution helps (you can't resolve to prefer A to B if you currently prefer B to A).
          *   Diachronic: Defect is in the *stability*. Resolution helps (you can resolve to follow past self).

  5.  **Final Review against Constraints:**
