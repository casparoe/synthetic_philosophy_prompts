answer: |-
  Johannes Kepler spends years telling his fellow astrologers that their methods are nothing but "dung scraped by an industrious hen" for the occasional grain of truth.

  Naturally, they're confused when he spends the rest of his life casting hundreds of horoscopes. When asked how he squares the circle, Kepler explains that his approach is scientifically sound because "The Earth has a soul stirred by geometrical aspects, like a shepherd pleased by a flute who understands nothing of musical harmony."

  So, essentially, Kepler told his colleagues they were chickens scratching in the dirt, while he was the only one trying to play chamber music for a planet that doesn't know it's listening.
