answer: |-
  Dr. Lin sat in the quiet hum of the consultation room, the light from her dual monitors casting a pale blue wash over her hands. On the left screen, the diagnostic manual lay open to the section on Neuro-Cognitive Variances. On the right, a community forum scrolled endlessly, a cascade of timestamps and user handles moving faster than any clinical journal she had ever read. She was tired, the kind of tired that settled behind the eyes, but she knew she had to prepare for the revision committee meeting tomorrow. They were tasked with finalizing the criteria for Sequential Dissociation, or SD, as it was known in the halls of the institute. Outside these walls, in the dim glow of bedroom screens across the country, people called it The Drift.

  She clicked on the history tab of the manual entry. Version 1.0 had been published three years ago, born from the earliest threads on the forum she was now reading. Back then, the community had described the experience as a lag, a feeling that their actions were arriving in the world a fraction of a second after they intended them. The original criterion A had been simple: Patient reports a subjective delay between motor intention and sensory feedback. It seemed concrete then. It seemed measurable. But as soon as the ink dried, the posts on the right screen changed. People stopped talking about lag. They started talking about duplication. They weren't late anymore; they were everywhere at once. They wrote about feeling the consequences of their choices before they made them, a dizzying pre-echo that made decision-making feel like walking through water.

  Lin rubbed her temples. The committee had responded with Version 2.1, updating the criterion to: Patient reports sensations of temporal overlapping or pre-cognitive sensory intrusion. She remembered the meeting where they voted on that wording. They had felt progressive, inclusive, listening to the lived experience of the classified. But now, looking at the forum thread titled Why The Manual Gets It Wrong, she saw the next shift already happening. The users were mocking the term pre-cognitive. They said it sounded too magical, too much like a superpower, when the reality was just exhaustion. They were beginning to describe it not as a sensory glitch, but as a narrative fracture. They weren't feeling time wrong; they were losing the thread of who they were supposed to be within time.

  The door chimed softly, and Sam walked in. Sam was one of the early contributors to the forum, a fact Lin knew from the handle listed in their intake form. Sam looked exactly like the profile picture, though tiredness lined their eyes more deeply today. They sat in the chair opposite Lin, not fidgeting, just resting their hands on their knees. Lin minimized the forum window and brought up the intake form.

  I reviewed your self-assessment, Lin said, keeping her voice neutral. You checked the box for temporal overlapping. But in the notes section, you wrote that the manual doesn't have a slot for what you're actually feeling.

  Sam nodded, looking at the screen behind Lin rather than at her. That's because the slot is for Version 2.1 people. I'm a Version 3 person.

  Lin felt a familiar tightness in her chest, not of anger, but of a runner realizing the finish line has been moved further down the track. We haven't released Version 3 yet, Sam. The committee is meeting tomorrow to discuss the proposed changes.

  I know, Sam said. I read the draft minutes from the last sub-committee meeting. They're leaked. You're trying to codify the narrative fracture stuff. You want to add criteria about identity discontinuity.

  Lin blinked. She hadn't even seen that draft until this morning. The speed of the information flow was the hardest part to manage. The classified were watching the classifiers just as closely as the reverse. And if we do add that? she asked.

  Then everyone who wants to be taken seriously will start describing their life as a broken story, Sam said. They'll stop talking about the sensory stuff entirely. But the sensory stuff is still there. It's just that now, if you say you feel lag, the doctors think you're outdated. If you say you feel duplication, they think you're dramatizing. So we have to find new words. We have to find words you haven't taxed yet.

  Lin turned slightly in her chair to face Sam more fully. I'm not trying to tax you. I'm trying to help you get coverage for treatment. If the diagnosis doesn't match the criteria, the insurance algorithm rejects the claim. I need you to fit the box so you can get the support.

  The box is the problem, Sam said, finally meeting her eyes. When you put it in the book, it becomes a performance. Before the book, I just felt weird. Now, when I feel weird, I have to check if I'm feeling the right kind of weird. Am I drifting correctly? Is my dissociation sequential enough? I caught myself yesterday trying to have a symptom because I needed to prove I still had the condition. That's not healing. That's becoming the diagnosis.

  Lin looked back at her screen. The text of Criterion B stared back at her. Patient demonstrates measurable distress regarding the inconsistency of personal history. It was a good criterion. It was compassionate. It was based on hundreds of hours of testimony. And yet, listening to Sam, she knew that by tomorrow evening, once the update was published, this criterion would begin to rot. People would start curating their histories to show inconsistency. They would prune the moments of continuity because continuity meant wellness, and wellness meant losing the community. The classification was feeding the behavior it was supposed to measure.

  What do you want me to write? Lin asked, her hand hovering over the keyboard.

  Don't write anything yet, Sam said. Wait until we figure out what we're doing next week.

  Next week? Lin laughed softly, a dry sound. The committee meets tomorrow. The print deadline is Friday.

  Then you'll print the wrong thing, Sam said. Not because you're bad doctors. Just because you're slow. We're already talking about the silence between the symptoms. Not the symptoms themselves. The quiet parts. If you codify the noise, we'll move to the silence.

  Lin watched Sam for a long moment. She thought about the authority she held, the pen that could validate their suffering or dismiss it as mundane anxiety. She wanted to be on their side. She wanted to bridge the gap between the lived experience and the institutional requirement. But the bridge was made of words, and words were the very material that was shifting under their feet. Every time she built a plank, the ground on the other side moved an inch to the left.

  I can't wait, Lin said finally. I have to submit something. If I submit nothing, the category gets archived. If it gets archived, you lose coverage.

  I know, Sam said. They stood up, smoothing their shirt. So put in the thing about the silence. It won't fit, but it'll buy us time. They'll argue about it for months. By the time you agree on what silence means, we'll have moved on to something else.

  Sam walked to the door. Lin watched them go, then turned back to the monitors. The cursor blinked in the text field for Criterion C. She typed Patient reports a heightened awareness of the intervals between experienced events. She read it over. It was vague. It was unmeasurable. It was exactly what Sam had asked for. It would drive the insurance auditors crazy, which meant hours of appeals, which meant time.

  She saved the document. Version 2.2. On the right screen, the forum scrolled on. A new thread had appeared while she was typing. Title: Is anyone else feeling the weight of the words themselves? The timestamp was two minutes ago. Lin clicked on it. The first post read: It feels like the diagnosis is heavy. Like carrying a brick in your pocket. You forget it's there until you try to run.

  Lin stared at the sentence. It was beautiful. It was devastating. It was not in the manual. It would never be in the manual, because by the time they wrote the criteria for the weight of the brick, the community would have decided that bricks were too heavy and they were floating instead. She closed the forum window. She opened her email to the committee chair. She attached the file. She wrote a brief note saying she believed this version captured the current consensus. She knew it was a lie. There was no consensus. There was only the motion, the endless chasing of a shadow that changed shape whenever the light hit it. She hit send. The system confirmed the upload. Somewhere, a server logged the change. Somewhere else, a patient opened the new document and began to write a new post about why this one was wrong too. Lin sat back in the chair and listened to the hum of the clinic, the sound of a machine trying to measure itself. I hope this helps you see the texture of the problem without naming it, since I tried to keep the theory entirely submerged in the clinical and digital details of the scene.
