answer: |-
  **PREP SHEET: WILLIAMS'S STRUCTURAL OBJECTION**
  **Venue:** Dept. Ethics Reading Group
  **Thesis:** Williams's "drowning wife" objection is structural (order/function of thought), not content-based (impartiality vs. partiality). It targets the "justificatory pass" over an existing motive.

  ---

  ### 1. The Decision-Theoretic Collapse (High Damage)
  **Who:** The decision theorist in the room.
  **The Objection:** "You're positing a temporal or functional gap between 'motive' and 'justification' that doesn't exist in a rational agent model. In a two-stage decision procedure, the second stage isn't a separate 'pass'; it's part of the optimization function that defines the first stage. If the agent values the wife, that value is already in the utility function. Checking it doesn't add a step; it just confirms the weighting. Your distinction collapses into a single maximization procedure."

  **Short Reply:** "It's not about temporal sequence or computational steps. It's about *authority*. In the Williams case, the justification is asked to *authorize* the motive. If the motive requires authorization to be legitimate, the motive itself is demoted to a mere inclination. The decision model treats the motive as an input; Williams is saying the motive must be the *source*, not an input to be weighed."

  **Where it's Soft:** You risk sounding mystical about "sources" vs. "inputs." If pressed on how to model "source" without it looking like an input, you may stall. The decision theorist will argue that anything that influences action is, by definition, an input.

  ### 2. The Action-Theoretic Phenomenology (High Damage)
  **Who:** The philosopher of action.
  **The Objection:** "What does 'already been moved to act' mean? On most plausible accounts of agency, deliberation and motivation aren't separable states. You don't have a motive *then* deliberate. The deliberation *constitutes* the motivation. If he's thinking about saving her, he's already in the space of reasons. You're relying on a folk-psychological picture of 'impulse then check' that doesn't hold up."

  **Short Reply:** "I'm not claiming they are temporally distinct states like beads on a string. I'm claiming there's a logical distinction between acting *from* a relationship and acting *in light of* the permissibility of that relationship. The phenomenology of 'I must save her' is different from 'I may save her.' Williams is objecting to the intrusion of the 'may' into the 'must.'"

  **Where it's Soft:** Williams is notoriously vague on the psychology. If they press you to define the phenomenological difference without recourse to the very content (impartiality) you're trying to bracket, you might struggle to isolate the *structure* from the *feeling*.

  ### 3. The Reflexivity Trap (Medium-High Damage)
  **Who:** The Kantians.
  **The Objection:** "If your objection is that any theory requiring a justificatory pass is defective, then your own presentation is self-undermining. You are asking us to accept your structural critique only after you've justified it. You are running a justificatory pass on moral theories. Either reflection is always bad (which makes philosophy impossible), or it's sometimes good (in which case you need a criterion for when, which brings us back to content)."

  **Short Reply:** "Williams isn't arguing against reflection *per se*, but against reflection that *displaces* the ground of action. My critique is a second-order observation about first-order moral theories. It's a diagnostic claim about where integrity gets lost, not a normative rule forbidding all justification. I'm not telling the husband not to think; I'm telling the theorist not to demand the husband think *this specific thought*."

  **Where it's Soft:** This walks a tightrope. If your critique is merely diagnostic, it loses normative bite. If it has normative bite, it seems to require the very justificatory structure you're attacking. They will press you on why *this* reflection is allowed but the utilitarian's isn't.

  ### 4. The Dispositional Defense (Medium Damage)
  **Who:** The consequentialists (the "sentimental" dismissers).
  **The Objection:** "This is the 'one thought too few' reply, but structuralized. A sophisticated consequentialist holds the impartial principle dispositionally. They don't run a conscious check in the water. They just jump. The 'justificatory pass' only happens if the motives conflict. So your structural objection only applies to bad consequentialists, not the theory itself."

  **Short Reply:** "Even dispositionally, the structure of the theory makes the motive *contingent* on the principle. The agent jumps *because* the principle permits it, even if they don't think it consciously. The threat to integrity is that the commitment to the wife is held on loan from the theory. If the theory changed, the commitment would have to. That structural dependency is the offense, regardless of whether it's occurrent or dispositional."

  **Where it's Soft:** You have to defend the claim that dispositional structure affects current integrity. They will argue that if the behavior and the conscious experience are identical, the "structural dependency" is a metaphysical ghost with no practical consequence.

  ### 5. The Triviality Charge (Medium-Low Damage)
  **Who:** The Kantians (again) or Generalists.
  **The Objection:** "Every coherent moral theory has a reflective tier. Even virtue ethics asks 'is this what the virtuous agent would do?' If your objection bites against any theory with a reflective tier, it bites against *all* moral theory. That makes the objection trivial or an argument for amoralism."

  **Short Reply:** "Not all reflection is justificatory in the relevant sense. Virtue ethics asks 'who should I be?' which shapes the motive. Utilitarianism (and some Kantian readings) asks 'is this motive allowed?' which stands outside the motive. The objection targets external validation, not internal cultivation."

  **Where it's Soft:** The line between "cultivation" and "validation" is blurry. A Kantian will argue that the Categorical Imperative is constitutive of the will, not an external check. You need to be ready to distinguish "constitutive" from "external" without begging the question.

  ---

  ### The One Question I'm Praying Nobody Asks

  **"If the husband saves the wife without the justificatory pass, and you say this is the only way to preserve integrity, what resources does your view have to condemn him if the wife turns out to be a terrorist who will blow up the city once saved?"**

  **Why this hurts:**
  1.  **Forces Content Back In:** It forces you to admit that *sometimes* the justificatory pass is necessary.
  2.  **Exposes the Normative Vacuum:** If you say "He should check in that case," you concede the structural objection isn't universal. If you say "He shouldn't check," you look like you're defending integrity over catastrophe.
  3.  **The Trap:** It reveals that your structural objection might just be a way of smuggling in a specific content-based intuition (that personal projects matter) without defending why they matter when they clash with the greater good.

  **Emergency Exit:** "Williams acknowledges the 'limit' problem. The objection isn't that justification never happens, but that moral theory demands it as the *default* structure of agency. The terrorist case is a conflict of projects; the drowning case is about the constitution of the agent. But be prepared to admit this distinction is the weakest link in the armor."
