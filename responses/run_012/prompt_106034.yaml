answer: |-
  This is a classic crux in Thomistic political theory, and your students are right to spot the tension. The apparent contradiction lies between the *negative* definition of sedition in q. 42 (opposing a tyrant is *not* sedition) and the *positive* restriction on lethal force in q. 64 (killing requires public authority).

  To give your seminar a coherent account, I suggest framing the relationship not as a contradiction but as a distinction between the **moral species of the end** (q. 42) and the **juridical authority of the means** (q. 64). Aquinas is distinguishing between *whether* a regime can be opposed (yes, if tyrannical) and *who* may execute that opposition, particularly when it involves blood (only public authority).

  Here is a proposed reading that addresses your three specific questions, followed by the required critique of its weakest link.

  ### 1. "Disturbing" and the Subject of Resistance
  In q. 42, a. 2, ad 3, Aquinas is defining the sin of sedition. Sedition is a special sin against the unity and peace of the *multitude*. His argument is that a tyrannical regime, because it seeks private good over common good, has already fractured the legal justice that binds the community. Therefore, opposing it does not violate the *true* unity of the multitude.

  *   **Meaning of "Disturbing":** *Perturbatio* here should be read broadly as "disrupting the hold on power." It encompasses deposition, rebellion, or refusal of obedience. It does not necessarily imply assassination. Aquinas is clearing the moral ground: resisting a tyrant is not inherently sinful *as sedition*.
  *   **The Subject:** The text says *subditi* (subjects). This is the source of the confusion. However, read in light of his broader political theory, "subjects" should not be understood as atomized private individuals acting on private whim. In Aquinas's corporate medieval mindset, the "people" (*populus*) can act as a collective body with a public character distinct from a private person.
  *   **Coherence:** The subject of the disturbance in q. 42 is the community acting in defense of the common good. This aligns with q. 64, which reserves harmful acts for those with charge of the community. If the community acts *corporately* to depose a tyrant, they are exercising a residual public authority, not acting as private individuals.

  ### 2. The "Unless" Clause: Prudence, Not Utilitarianism
  The clause ("unless indeed the tyrant's rule be disturbed so inordinately...") is often read as a proto-utilitarian calculus. For a graduate seminar, it is crucial to distinguish Thomistic prudence from modern consequentialism.

  *   **Nature of the Clause:** This is not a license to calculate utility, but a requirement of **prudence** (*prudentia*). For Aquinas, an act is not virtuous unless it is done at the right time, in the right way, and for the right end. A resistance that causes more chaos than the tyranny it cures is, by definition, imprudent and therefore not ordered to the common good.
  *   **Who Decides?** If this were a private calculation, it would invite anarchy (which Aquinas fears). The judgment regarding whether the disturbance will cause "greater harm" must belong to the "better part" of the community or its representatives—those capable of political judgment.
  *   **Function:** The clause functions as a **limit on the licitness of the act**, not merely a definition of sedition. It says: "Resisting a tyrant is not sedition, *provided* the resistance is prudent." If the resistance is imprudent (causing greater harm), it becomes sinful, not necessarily as sedition, but as rashness or endangerment of the common welfare.

  ### 3. Lethal Force, q. 64, and *De regno*
  This is the hardest pivot. Does q. 42 authorize tyrannicide by private persons?

  *   **The Restriction:** Q. 64, a. 3 is explicit: lethal force for the common good belongs to him who has charge of the community (*ei qui curam communitatis habet*). A private person cannot kill a sinner/tyrant because they lack the authority to weigh the life of the ruler against the good of the whole.
  *   **Synthesis:** Q. 42 removes the label of *sedition* from anti-tyrannical action; it does not grant a license for *assassination*. One can "disturb" (depose, exile, ignore) a tyrant without killing him. If the removal requires killing, q. 64 applies: you need public authority.
  *   ***De regno* (I.6):** This text clarifies the ST. Aquinas explicitly argues against private tyrannicide. He warns that killing a tyrant privately often leads to worse tyranny (as successors fear the people) or schism. He writes: "It is not for private presumption to slay tyrants... but rather for public authority."
  *   **The Room for Action:** Aquinas leaves room for action by a **superior authority** (e.g., an Emperor deposing a tyrannical King) or by the **community acting publicly** (if the right of appointment resides with them, they may depose him). But the "private individual" (*privatus*) acting alone is barred from lethal force by q. 64 and *De regno*, even if q. 42 exonerates them from the specific sin of sedition.

  ### Summary for the Seminar
  You can tell your students: **Q. 42 addresses the *end* (tyranny is unjust and may be opposed); q. 64 addresses the *means* and *agent* (lethal force requires public authority).** A tyrant may be deposed by the community (q. 42), but he may not be assassinated by a private citizen (q. 64/*De regno*), unless that citizen is acting under divine inspiration (as Aquinas notes regarding Ehud in *De regno*) or as an agent of a higher public authority.

  ***

  ### Where This Reading Is Most Likely to Fail

  You asked for the weakest link. The most significant textual pressure against the interpretation above comes from **the ambiguity of *subditi* in ST II-II, q. 42, a. 2, ad 3, contrasted with Aquinas's treatment of the Old Testament in *De regno*.**

  **1. The Textual Pressure:**
  In q. 42, Aquinas does not qualify *subditi* with "acting corporately" or "through magistrates." He simply says "his subjects." In *De regno* I.6, Aquinas admits that the Old Testament praises Ehud for killing Eglon. Ehud was a private individual (a judge, but acting alone in the assassination). Aquinas explains this away in *De regno* by attributing it to "divine inspiration" (*divinitus inspirati*).
  *   **The Weakness:** If Ehud could kill a tyrant via divine inspiration, does the ST leave a metaphysical loophole for the private individual? My reading above closes this by insisting on q. 64's natural law requirement for public authority. However, a sharp student might argue that if the tyranny is extreme enough, the tyrant forfeits his status as a ruler, becoming a "public enemy" (*hostis humani generis*), at which point the q. 64 restriction on killing a "sinner" (subject to law) no longer applies, and the act becomes one of war, not execution. Aquinas hints at this in *De regno* but never fully systematizes it in the ST.

  **2. The Doctrinal Pressure:**
  The weakest link is the claim that the "community" can act as a public authority without a specific magistrate. In Aquinas's hierarchical worldview, authority usually flows from above. If the King is the supreme earthly authority, who constitutes the "public authority" that can judge him?
  *   **The Verdict:** My reading relies on the idea that authority reverts to the community (*remanet penes multitudinem*) when the pact of rule is broken. While this is a standard Thomistic interpretation (developed by Suárez and later Scholastics), Aquinas himself is notoriously cautious about stating this explicitly in the *Summa*. He is more explicit in *De regno* about the dangers of this reversion.
  *   **Failure Point:** If your students press on whether Aquinas believes a *purely private* individual (with no mandate from the community or God) can ever licitly kill a tyrant, the texts are in genuine tension. Q. 42 suggests the act is not sedition; q. 64 suggests the act is usurpation. The synthesis relies on assuming "disturbance" $\neq$ "killing." But if "disturbance" *necessitates* killing, and no public superior exists (e.g., the tyrant is the highest earthly power), Aquinas offers no clear natural law solution other than "pray for divine intervention."

  **Recommendation:** In class, concede that Aquinas does not provide a fully worked-out theory of *revolutionary legitimacy* in the modern sense. He provides a theory of **tyrannical illegitimacy** (q. 42) constrained by a theory of **juridical order** (q. 64). The gap between the two is where later Scholastics (like Mariana or Suárez) had to innovate, often moving beyond Aquinas's caution. Acknowledging this gap is intellectually honest and prevents the "Thomistic System" from looking more airtight than Aquinas intended.
