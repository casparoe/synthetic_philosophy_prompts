  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A graduate seminar instructor teaching Aquinas's political thought.
      *   **Context:** Students consistently raise an objection regarding the apparent tension between *Summa Theologiae* (ST) II-II, q. 42, a. 2 (sedition/tyranny) and ST II-II, q. 64, a. 3 (killing sinners/private authority).
      *   **Task:** Provide a coherent account of how these texts hang together, addressing three specific questions:
          1.  Meaning of "disturbing" and the subject (who acts?).
          2.  Nature of the "unless" clause (consequentialist calculus? who decides?).
          3.  Relation to lethal force (q. 64) and *De regno*.
      *   **Constraint:** Must identify where the reading is most likely to fail (weakest link/textual pressure).
      *   **Tone:** Scholarly, precise, nuanced, suitable for a graduate seminar context.

  2.  **Deconstruct the Texts:**

      *   **ST II-II, q. 42, a. 2 (Sedition):**
          *   Context: Is sedition a mortal sin?
          *   Objection 3: Is it sedition to depose a tyrant?
          *   Reply: Tyrannical rule is unjust (private good). Disturbing it is *not* sedition (unless the disturbance causes *more* harm than the tyranny). The tyrant is the real seditionist.
          *   Key Term: *Perturbatio* (disturbing).
          *   Key Condition: The "unless" clause (greater harm).

      *   **ST II-II, q. 64, a. 3 (Killing Sinners):**
          *   Context: Is it lawful to kill sinners?
          *   Corpus: Lawful if directed to common welfare, but belongs to *him who has charge of the community* (public authority).
          *   Reply to Obj. 3: Private individuals can act for common good *if it harms nobody*. If it harms another (like killing), it requires public judgment/authority.

      *   **De regno (On Kingship):**
          *   Context: Advice to the King of Cyprus.
          *   View on Tyranny: Tyranny is the worst regime.
          *   Removal of Tyrant: Warns against private assassination (leads to worse tyranny or schism). Suggests public authority or divine intervention.

  3.  **Address the Specific Questions:**

      *   **(1) "Disturbing" and the Subject:**
          *   *Disturbing:* In q. 42, Aquinas is defining *sedition*. He says opposing a tyrant isn't sedition. He doesn't explicitly say "rebellion is lawful" in a positive sense here, but rather "this specific sin (sedition) is not committed."
          *   *Subject:* The text says "his subjects" (*subditi*). This is ambiguous. Does it mean the populace collectively? Or representatives?
          *   *Synthesis:* Aquinas distinguishes between the *sin of sedition* (discord against the unity of the *just* multitude) and the *act of removal*. A tyrant breaks the bond of justice. Therefore, opposing him isn't opposing the "unity of the multitude" in the relevant moral sense. However, the *mode* of opposition matters.

      *   **(2) The "Unless" Clause (Consequentialism?):**
          *   *Clause:* "unless indeed the tyrant's rule be disturbed so inordinately, that his subjects suffer greater harm from the consequent disturbance than from the tyrant's government."
          *   *Analysis:* This looks consequentialist. But for Aquinas, prudence (*prudentia*) always involves weighing circumstances. It's not pure utilitarianism; it's about the *ordo rationis* (order of reason).
          *   *Who Decides?* This is the crux. If a private person decides, it risks anarchy. If a public body decides, it aligns with q. 64.
          *   *Interpretation:* It functions as a limit on what counts as *justifiable* disturbance. It doesn't necessarily authorize *anyone* to act, but rather clarifies that if the disturbance is prudent, it isn't sedition.

      *   **(3) Lethal Force and *De regno*:**
          *   *Tension:* q. 42 seems to allow "disturbance." q. 64 says only public authority can kill.
          *   *Resolution:* "Disturbance" in q. 42 does not automatically entail "execution." One can depose without killing. If killing is required, q. 64 kicks in.
          *   *De regno:* Explicitly warns against private assassination. "It is not for private presumption to slay tyrants."
          *   *Synthesis:* q. 42 removes the label of *sedition* from anti-tyrannical action. It does not grant a universal license to *assassinate*. q. 64 restricts the *means* (killing) to public authority. *De regno* reinforces the danger of private action.
          *   *Nuance:* Aquinas leaves a tiny window for "public authority" acting against a tyrant (e.g., a superior lord, or the community acting *as* a public body if the tyrant forfeited authority). But private assassination is generally out.

  4.  **Drafting the Coherent Account:**

      *   *Thesis:* The texts are compatible if we distinguish between the *moral species* of the act (sedition vs. justice) and the *authority* required to execute the act (private vs. public). Q. 42 defines the end (tyranny is unjust); q. 64 defines the means/agent (killing requires authority).
      *   *Point 1 (Disturbing):* "Disturbing" means opposing the regime's hold on power. It is not sedition because the tyrant has already severed the bond of legal justice. The subject is ideally the "whole people" or their representatives, not a lone private actor, though the text says "subjects."
      *   *Point 2 (Consequentialism):* It's not utilitarian calculus but *prudential judgment*. The "unless" clause defines the boundary of *reasonable* resistance. It warns against rashness. The judgment should ideally be communal/public, not purely private whim.
      *   *Point 3 (Lethal Force):* Q. 42 does not override q. 64. You can disturb (depose) without killing. If killing is necessary, you need public authority. *De regno* confirms this: private assassination is dangerous and generally illicit.

  5.  **Identifying the Weakest Link (Self-Correction/Critique):**
      *   *Where does this fail?* The text of q. 42 says "subjects" (*subditi*). It doesn't explicitly say "public magistrates." *De regno* is stronger on the restriction, but ST q. 42 is vaguer.
      *   *The "Private Tyrannicide" Problem:* Some scholars (like John of Paris later) push for a right of the community. Aquinas is cautious. The weakest link is claiming Aquinas *forbids* private tyrannicide definitively in ST. He implies it via q. 64, but q. 42 is silent on the *agent's* status regarding lethal force.
      *   *Doctrinal Pressure:* The doctrine of *epikeia* (equity) or the idea that a tyrant forfeits authority might allow the community to act as a public body. But a *private individual* acting alone is the hard limit.
      *   *Selection:* I will identify the ambiguity of "subjects" in q. 42 as the weakest link. Does "subjects" imply a collective body (which has public weight) or any individual? If the latter, it clashes with q. 64.

  6.  **Refining the Argument for a Graduate Seminar:**
      *   Need to use precise terminology (*sedition*, *tyrannis*, *auctoritas*, *bonum commune*).
      *   Acknowledge the scholarly debate (e.g., Skinner, Catto, Prueger).
      *   Ensure the distinction between *deposing* and *killing* is clear.
      *   Make sure the "unless" clause is treated as a prudential limit, not a utilitarian license.

  7.  **Final Review against Constraints:**
      *   Did I answer (1), (2), (3)? Yes.
      *   Did I say where the reading fails? Yes.
      *   Is the tone appropriate? Yes.

  8.  **Constructing the Output:** (Mental Outline)
      *   Introduction: Acknowledge the classic tension. State the thesis (distinction between *jus ad bellum* against tyranny and *jus in bello* regarding authority).
      *   Section 1: The Meaning of "Disturbance" and the Agent. (Focus on the definition of sedition vs. the act of removal).
      *   Section 2: The "Unless" Clause. (Prudence vs. Consequentialism).
      *   Section 3: Lethal Force and *De regno*. (The q. 64 restriction).
      *   Section 4: The Weakest Link. (The ambiguity of "subjects" and the forfeiture of authority).
      *   Conclusion: Summary for the classroom.

      *(Self-Correction during drafting)*: I need to be careful not to make Aquinas sound like a modern democrat. The "public authority" in his mind might be a superior lord (Emperor over King) or the community acting corporately, not necessarily a vote. I must emphasize the *corporate* nature of the resistance to align with q. 64.

      *(Refining the "Weakest Link")*: The strongest pressure comes from *De regno* I.6, where he says it's not for private presumption to slay tyrants, *but* he cites the Old Testament (Ehud) which seems to contradict. He resolves it by saying that was divine inspiration. So, the "private" exception is divine command, not natural right. I should mention this.

      *(Final Polish)*: Ensure the distinction between *sedition* (a sin against unity) and *resistance* (an act of justice) is the hinge.

