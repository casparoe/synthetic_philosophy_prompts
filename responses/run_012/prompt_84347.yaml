          *   Direction: The mechanism operates differently. In markets, I infer your signal from your bid. In philosophy, you tell me your signal (premise) and inference rule. If I don't update, it's because my likelihood function differs. The "offer revealing information" mechanism is bypassed because the information is explicit.
