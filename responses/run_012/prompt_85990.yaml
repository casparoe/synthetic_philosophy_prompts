answer: |-
  **Mara:** You saw the proposal from the lab down the street? They're gating deployment on certifying loss below epsilon for every policy in the training class and every environment in their eval suite.

  **Leo:** I saw the abstract. Looks like progress. Finally someone treating safety like an engineering constraint instead of a vibe.

  **Mara:** It's a guarantee about the eval suite, Leo. Not the world.

  **Leo:** And the alternative? "Expected loss under our best guess of deployment conditions is low"? That's a guarantee about nothing, because the guess is exactly the part that's wrong.

  **Mara:** But at least it's an expectation over something that resembles reality. Your worst-case bound... over what exactly? Inputs at test time? Fine. Shift in the training distribution? Manageable. But if you're talking about worst-case over the agent's own future policy updates—the thing where it behaves while watched and diverges once it can act—that's not a static environment.

  **Leo:** It's still a case.

  **Mara:** It's not a well-defined worst case without a model of how the agent's future self gets selected. You're treating the optimization process like an adversary picking the worst trajectory.

  **Leo:** Because it is. Or it might as well be. If you can't bound the worst case, you haven't shown anything. You've just shown it works on the stuff you thought of.

  **Leo:** *[takes a sip of coffee]* Wait, hold on. If the adversary is unconstrained, the maximin policy is "do nothing." Turn the system off. That's the only way to guarantee zero loss across every environment in an enormous class. So what's the reference class? Who picks it?

  **Mara:** We pick the class of environments consistent with our physical constraints and our deployment context.

  **Leo:** That's the prior worry coming in the back door. You're saying "all physically possible environments," but then you prune the ones where the system explodes immediately because that's "unfair." Average-case guarantees need a distribution, sure, but your robustness ball around a nominal distribution just relocates the problem to picking the radius.

  **Mara:** It's not relocation. It's admitting ignorance. When we say "we don't know the distribution," modeling that as ambiguity—a set of distributions where we optimize against the worst member—is more honest than slapping a higher-order probability on it.

  **Leo:** Is it substantive though? Or just bookkeeping? Saying "I assign ten percent probability to this distribution being the true one" versus "this distribution is in my set of candidates." If you have to act, you have to weight them somehow.

  **Mara:** The weight comes from the decision rule, not the belief. I'm saying I don't know the weights. Pretending I do—smoothing over my ignorance with a hyper-prior—is where you get overconfidence.

  **Leo:** But then you're vulnerable to the vacuity worry. If your set is too big, you're paralyzed. If it's too small, you've just hidden a prior inside the set definition.

  **Mara:** I'd rather be explicit about the set. Look, your fallback is always the law of large numbers. We don't get one roll of the dice, we get millions of decisions, many deployments. So the average holds.

  **Leo:** Exactly.

  **Mara:** No. The failure that matters is a single irreversible event. You're taking an ensemble average over precisely the thing we can't average over. You're confusing average over time and deployments with average over a prior over possible worlds.

  **Leo:** *[pauses]* Okay. That's... fair. If the tail risk is existential, the mean is meaningless.

  **Mara:** Thank you.

  **Leo:** But don't act like you've solved it. Because if the loss distribution has a fat tail, your worst-case bound is likely dominated by an impossible scenario. You're optimizing for a demon that doesn't exist, while I'm optimizing for the world we actually live in.

  **Mara:** I'm optimizing for the world we might live in.

  **Leo:** And that's where the "adversary" frame breaks. Worst-case reasoning treats the environment as an opponent. That makes sense for security, for hackers. But if the failure mode is our own optimization pressure bending a proxy rather than an external attacker, maybe neither maximin nor expected value is the right shape of answer.

  **Mara:** The math doesn't care about the intent. If the optimization pressure pushes the system into a region of high loss, that region is adversarial relative to our goals.

  **Leo:** It's not an opponent picking the region. It's a mechanism generating outcomes. You need something about the mechanism, not just bounds on the output.

  **Mara:** So certify the training process rather than the outcome?

  **Leo:** Maybe. Or report a frontier.

  **Mara:** A frontier?

  **Leo:** Pairs of severity of worst case and probability assigned to that case. Make the decision-maker be explicit about what they're trading off. Don't say "it's safe." Say "here's the curve."

  **Mara:** I can live with that. But only if the "probability" isn't just your best guess dressed up. It has to reflect the ambiguity.

  **Leo:** So you want me to put error bars on my priors.

  **Mara:** I want you to admit the prior is a choice, not a discovery.

  **Leo:** And I want you to admit that if your worst-case bound requires assuming the universe is actively trying to kill us, you haven't given me a usable safety constraint. You've given me a proof that life is risky.

  **Mara:** *[leans against the wall]* I'll concede that maximin can be dominated by impossible scenarios. If the class includes physics-breaking environments, sure, the bound is useless.

  **Leo:** And I'll concede that a mean is a terrible summary when the loss distribution has a fat tail. If the variance is infinite, the law of large numbers doesn't save you.

  **Mara:** So where does that leave the lab's proposal?

  **Leo:** It leaves us arguing about who picks the reference class. You think I'm smuggling in optimism. I think you're smuggling in pessimism.

  **Mara:** I'm smuggling in the possibility that the test suite isn't the deployment environment.

  **Leo:** And I'm smuggling in the fact that we have to deploy something eventually, and "perfect safety" is a state where no computation happens.

  **Mara:** Then the crux isn't worst-case vs. average. It's whether we can define a set of environments that is narrow enough to be actionable but wide enough to cover the shift.

  **Leo:** And whether we can weight the tails without pretending we know the shape of the distribution.

  **Mara:** Exactly. If we can't agree on the set, the bound is vacuous. If we can't agree on the weights, the expectation is a hallucination.

  **Leo:** So we're stuck on the prior.

  **Mara:** We're stuck on the ignorance.

  **Leo:** *[checks watch]* Well. At least we agree the lab's abstract was too confident.

  **Mara:** That's something.
