      *   **A (Average-Case/Expected Value):** Believes worst-case bounds are often vacuous (adversary too strong) or lead to paralysis. Focuses on actionable deployment. Worried about the reference class for worst-case (what counts as an environment?). Believes repeated deployment allows learning/aggregation. Sees the "adversary" frame as misleading for internal failure modes.
