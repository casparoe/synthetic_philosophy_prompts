      1.  **(3) vs. (4):** This is the core philosophical conflict. Is the reality of the generation dependent on self-conception (constructivist) or causal history (realist)? You can't have it both ways without qualification.
      2.  **(1) vs. (5):** Ontological claim vs. Epistemological limitation. Claiming something is real while admitting you can't empirically isolate it from age/period effects is risky.
      3.  **(1) vs. (2):** Minor. Social kinds often have arbitrary boundaries.

