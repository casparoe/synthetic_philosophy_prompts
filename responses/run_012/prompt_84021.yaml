      *   (4) Realist about cohort effects (facts exist even without self-identification).
      *   (5) Empirical identification is limited (APC confounding, constraints needed).
      *   (6) Will use labels anyway (useful shorthand).

  3.  **Identify Tensions:**
      *   **Tension A: (1) & (3) vs. (4).**
          *   (1) says generations are real social kinds. (3) says social kinds are real *because* people take them up (constructivist/interactionist view).
          *   (4) says cohort effects are real *whether or not* people think of themselves as a group (realist/objectivist view).
          *   *Conflict:* Is the "kind" real because of internal identification (3) or because of external causal impact (4)? (1) bridges them but leans towards (4) in its explanation ("shape the formative environment"), while (3) defines "social kind" reality via uptake.
      *   **Tension B: (1) vs. (5).**
          *   (1) asserts generations are real kinds with durable marks.
          *   (5) admits cohort effects are statistically unidentifiable without arbitrary constraints.
          *   *Conflict:* How can you be a realist about (1) while admitting the data cannot check the specific claim (5)? This is an epistemological vs. ontological tension.
      *   **Tension C: (2) vs. (1).**
          *   (1) says they are real kinds. (2) says boundaries are conventional.
          *   *Resolution:* This is standard for social kinds (e.g., money, marriage). Not a severe tension.
      *   **Tension D: (6) vs. (5).**
          *   (6) uses labels as shorthand. (5) acknowledges they are statistically problematic.
          *   *Resolution:* Pragmatic vs. Scientific. Common in journalism. Not a severe tension.

