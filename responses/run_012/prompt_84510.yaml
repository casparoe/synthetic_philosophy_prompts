answer: |-
  You have one free hour on a Tuesday afternoon and two ways to use it. Option A is walking to a nearby store to return a specific deposit bottle you own; it guarantees you $10 cash immediately, which you would spend on a grocery run you've been postponing. Option B is spending that hour completing a verified application for a municipal housing grant; public records from the last decade show exactly 1 in 5,000 applicants win, and the grant is worth $100,000, which would pay off your student loans.

  **Expected Value Calculation**
  Option A yields a guaranteed value of $10.
  Option B yields a 0.02% chance of $100,000.
  Calculation: 0.0002 × $100,000 = $20.
  The expected value of Option B ($20) is double that of Option A ($10). A strict expected value maximizer must choose Option B, spending the hour on the grant application. The gamble wins not because $100,000 is an incomprehensible sum—it is a standard human-life sum—but because the sure thing ($10) is low enough in value that even a tiny sliver of the large sum outweighs it entirely.

  **The Anti-Fanatic Instinct**
  The anti-fanatic instinct says: "Do not waste an hour on a lottery ticket when you can have lunch money in hand." This instinct rejects the calculation because the probability (1 in 5,000) feels like zero in practical terms. The principle running underneath is likely a **Probability Threshold**: any probability below a certain cognitive or practical cutoff (e.g., 1%) should be treated as zero for decision-making purposes, regardless of the payoff. Alternatively, it may be a **Certainty Premium**, where guaranteed outcomes are weighted disproportionately higher than probabilistic ones due to risk aversion.

  **The Scaling Test**
  Scale both monetary values by a factor of 1,000.
  Option A (Sure): $10,000 guaranteed (a new car or debt clearance).
  Option B (Gamble): 1 in 5,000 chance at $100,000,000 (lifetime wealth and security).
  Expected Value: Option A = $10,000. Option B = $20,000.
  The ratio is unchanged. The probability is unchanged.

  For many anti-fanatics, the verdict **stays put**: they still take the sure $10,000. The feature doing the work was not the worthlessness of the sure thing (since $10,000 is genuinely valuable), but the **magnitude of the probability**. To the anti-fanatic, 1 in 5,000 is "effectively impossible" whether the prize is $100,000 or $100,000,000. If the verdict stays put, the anti-fanatic can state a rule that isn't just "I don't like small numbers": *"Probabilities below 1% do not enter practical reasoning."* This rule creates a discontinuity in value; it says that moving from 1.0% to 0.99% chance drops the value of the outcome to zero, not just slightly lower.

  If the verdict **flips** (they take the gamble at $100M), then the original objection was indeed about the sure thing being too small to justify the risk, confirming your intuition that it was a feeling about the scale of the stakes. However, a consistent anti-fanatic (one opposing EV fanaticism on principle) usually holds the line here, arguing that rational agents cannot be held hostage by vanishingly small probabilities, even when scaled.

  **The Maximizer's Counter**
  The expected value maximizer argues the case is rigged because it isolates a single decision. No adult makes only one choice in a lifetime. If you face this choice structure (small sure thing vs. tiny chance at large thing with positive EV) 5,000 times in your life, taking the sure thing yields $50,000 total, while taking the gamble yields $100,000 total on average. The anti-fanatic's rule (ignore small probabilities) guarantees you lose value over time. The maximizer claims the anti-fanatic is suffering from myopia: treating a repeatable statistical reality as a unique emotional event. The case isn't a reductio of EV; it's a demonstration that human intuition fails to aggregate risk across time.
