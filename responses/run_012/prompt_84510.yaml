  Me and a friend just spent about three hours arguing about expected value fanaticism and I want the case written down properly so I can see whether it actually holds up or whether I was just being louder.

  His line: if you take expected value maximization seriously, you have to take a one-in-a-million shot at something enormous over a small sure thing, and that's a reductio of the whole view. My line: every case he built cheated by making the sure thing basically nothing, and I don't think "take the sure thing" is a principle at all, I think it's a feeling about big numbers.

  So build me the case to spec.

  What I want: a thought experiment where the expected value maximizer has to take the fanatical option — the tiny chance of something huge over a small guaranteed good — but where the reason it wins is not that the huge thing is astronomically huge. The reason is that the sure thing is nearly worthless. Everything else stays ordinary and human-scale.

  Constraints:
  - No infinities, no gods, no afterlife, no aliens, no superintelligences, no buttons or machines. One person, choosing something with their own money, time or body, and both options have to be things a normal adult could actually do.
  - The probability has to come from something boring and checkable — base rates, how often a thing like this happens, a known mechanism. Not from a mysterious stranger who says trust me, it's one in a billion. No testimony-based probabilities.
  - Keep the ratio between the big payoff and the sure thing big, but keep both numbers in human units (dollars, days, whatever) and don't make the probability so tiny it's a joke — no 1-in-10^40. I want numbers a person could actually hold in their head and take seriously.
  - The sure thing has to be something a real person would genuinely want, not a booby prize. That's the exact spot my friend kept accusing me of cheating on, so I need it airtight.

  Then do the work, in this order: state the case in a paragraph; run the expected value calculation and show why the maximizer picks the gamble; say what the anti-fanaticism instinct says and what principle, if any, that instinct is actually running on; then the check I actually care about — scale both options up by the same factor so the ratio between them is unchanged, and tell me whether the anti-fanatic's verdict stays put. If it flips, say precisely which feature of the case was doing the work, and whether the anti-fanatic can still state a rule that isn't just "I don't like small numbers." If you think the instinct can be turned into a real rule — a cutoff below which probabilities don't count, a cap on how much value can enter the calculation, something like that — spell it out and say what it does to the case. Finish with how a maximizer would argue the case is rigged, and whether he'd be right.

  Start the reply with the case itself, first line, no preamble, no "here's a scenario" and don't restate what I asked. Then the analysis.
