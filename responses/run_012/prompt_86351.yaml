      *   *Guest's Rebuttal:* Justification is local/pragmatic, not global.
      *   *Tension 1 (Tautology):* Is saying "you need assumptions to learn" just a philosophical gloss on the math, or a substantive claim about epistemology?
      *   *Tension 2 (Normativity vs. Description):* If justification is domain-relative, are we talking about how we *ought* to reason or just how we *do* reason (psychology/sociology)?
