  ok so in my philosophy club this week we got onto evolution and morality and my friend Maya said something i cant stop chewing on. she said: if you think evolution built our moral beliefs, thats like saying evolution built our eyes. nobody panics and goes "oh no, natural selection made the eye, so i cant trust my eyesight." the eye got shaped by selection and it still mostly tells us the truth about whats out there in the world. so why would the moral sense be any different? and she says anyone who thinks evolution "debunks" morality is just being inconsistent, cus by that logic theyd have to say the same thing about seeing, which is obviously silly. so the whole debunking thing is a non-issue and we can trust our moral beliefs fine.

  i dont really buy it but i cant put my finger on why. can you audit the analogy for me? i want the table of what maps onto what -- what plays the role of the eye, what plays the light/the thing being seen, what plays "seeing it correctly," what plays the selection pressure, all of that -- and then tell me where the mapping actually breaks. my gut is that the eye has some feature the moral sense doesnt have but i cant name it. also which breaks matter for the point shes using it for and which ones are just trivia, cus i dont want a list of every tiny difference, i want the ones that change the verdict.

  and the big one: does her conclusion survive? if the eye analogy fails, does that mean debunking works after all, or just that she grabbed a bad analogy and theres maybe a totally different reason the moral case is different from the eye case? and if theres a better analogy for what shes actually getting at, what would it be. keep it in normal words please, im in high school not a grad student.
