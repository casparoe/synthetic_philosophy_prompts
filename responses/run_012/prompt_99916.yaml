  **Plan**

  1.  **Structure:** Six quatrains. Stanzas 1–5 follow strict pantoum recurrence (L2/L4 become next L1/L3). Stanza 6 attempts closure (recycling S1L3 and S1L1) but violates the recurrence rule on line 3 to represent the cascade's fragility.
  2.  **Mapping:**
      *   *Repeated Lines:* The public history (previous agents' silence). They constrain the speaker, crowding out new information.
      *   *New Lines:* The speaker's private signal (the "spike" in the data) and the Bayesian calculation.
      *   *The Break:* Stanza 6, Line 3. Instead of repeating S1L1 ("The first two... said nothing"), the line changes to reflect a new public signal shattering the consensus.
  3.  **Theory Check:**
      *   *Rationality:* Explicitly mention calculation and optimality ("rational to let the secret sleep").
      *   *Cascade vs. Herd:* Emphasize ignoring private info due to public weight, not just mimicry.
      *   *Fragility:* The single line change breaks the form just as one voice breaks the silence.

  ***

  **The Quiet Room**

  The first two checked the numbers and said nothing.
  Their silence is a public signal clear.
  I see a spike where the curve should smooth.
  But no one else stands up to declare.

  Their silence is a public signal clear.
  My private data screams a distinct wrong.
  But no one else stands up to declare.
  Their quiet implies they see no wrong.

  My private data screams a distinct wrong.
  The public history is clean and deep.
  Their quiet implies they see no wrong.
  It is rational to let the secret sleep.

  The public history is clean and deep.
  I calculate the odds of being lone.
  It is rational to let the secret sleep.
  The prior holds; I leave the error unknown.

  I calculate the odds of being lone.
  Then someone drops a pen or clears a throat.
  The prior holds; I leave the error unknown.
  A small noise shifts the collective vote.

  I see a spike where the curve should smooth.
  Then someone drops a pen or clears a throat.
  A single voice overturns the weight of nothing.
  A small noise shifts the collective vote.

  ***

  **Note on the Model**

  (a) The poem idealizes the Bikhchandani-Hirshleifer-Welch framework by assuming strict sequentiality and binary actions (speak/silent). Real offices involve parallel processing, cheap talk, and heterogeneous priors; agents rarely know precisely when others inspected the data. It also assumes common knowledge of rationality, ignoring social friction.

  (b) It leans on the pure informational cascade model, where agents ignore private signals because public history outweighs them. This is contested by reputational herding models (e.g., Scharfstein and Stein), where agents mimic to protect their reputation rather than update beliefs. The poem treats "cascade" and "herd" distinctly by emphasizing the *optimality* of ignoring information, though in practice, motivations often blur.

  (c) The verdict changes if payoffs are asymmetric. If raising a false alarm carries a high personal cost (being labeled difficult) while missing an error is shared, the rational choice shifts toward silence regardless of the cascade. Alternatively, if private signals were known to be highly precise, the cascade would not form; the poem assumes signal precision is common knowledge and moderate.
