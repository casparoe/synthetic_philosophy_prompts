answer: |-
  1. The traditional plurality requirement presupposes an irreducibly interpersonal conception of shared intention, wherein the collective mental state cannot exist unless at least two agents genuinely commit to the joint plan. This aligns with philosophical views that treat we-intentions as relational properties rather than mere aggregations of individual states.
  2. The unilateral alternative presupposes a reductionist picture on which conspiring is primarily a mode of individual commitment to a course of action, regardless of whether reciprocity exists. Here, the collective dimension is secondary to the individual's dangerousness and subjective commitment to the group's goal.
  3. Derivative liability suggests the joint enterprise functions as a distinct locus of agency, allowing acts by one member to be attributed to the whole based on scope and foreseeability. However, this can also be explained as a policy-driven imputation rule designed to deter collaborative crime without requiring a metaphysical commitment to group agents.
  4. The withdrawal rule presupposes that a joint commitment, once formed, creates normative bonds that can only be dissolved through communication or affirmative action rather than a unilateral change of mind. While this mirrors philosophical accounts of joint commitment, it may also function as an evidentiary convenience to prove the persistence of the agreement.
  5. No single theory of shared intention easily underwrites both a robust plurality requirement and liability that outruns every participant's intention, revealing a tension between metaphysical precision and pragmatic enforcement. Consequently, much of the doctrine remains underdetermined by intentionality alone, as evidentiary conveniences and deterrent policies could equally explain these rules without invoking collective agency.
