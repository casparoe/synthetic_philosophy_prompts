answer: |-
  The activity turns on the abrupt shift from treating the opponent as a separate causal agent to treating them as a logical mirror of the self.

  **Materials**
  *   **Index Cards:** 10 Red, 10 Blue (shuffled at the door).
  *   **Decision Slips:** Small pieces of paper, numbered 1–20.
  *   **Payoff Table A (Standard):** CC=3/3, DD=1/1, DC=5/0, CD=0/5.
  *   **Payoff Table B (Asymmetric):** CC=3/1, DD=1/3, DC=5/0, CD=0/5 (roles assigned by card color).
  *   **Whiteboard:** Pre-draw the Round 4 threshold formula ($nb > c$).
  *   **Prize:** One small item (e.g., a chocolate bar) for the highest cumulative score.

  **Round 1: The Baseline (8 minutes)**
  *   **Entry:** As students enter, hand each a sealed index card (Red or Blue). Instruct them not to open it or show it to anyone.
  *   **Instruction:** "You are in a one-shot decision game. You will be paired anonymously with another person in this room. You cannot communicate. Write 'C' (Cooperate) or 'D' (Defect) on a slip. Write your slip number on it. Hand it in."
  *   **Constraint:** Do not explain the payoffs yet; hand out Payoff Table A. Do not lecture. If a student asks, "What should I do?" say, "That is the question." If a student writes a conditional ("I choose C if..."), reject the slip and demand an unconditional choice.
  *   **Scoring:** Collect slips. Announce you are pairing them randomly. Calculate scores using Table A. Post the results by slip number on the board (e.g., Slip 1: C, Score 0).
  *   **Purpose:** Establishes standard causal independence. Most will defect; some may cooperate out of habit or morality.

  **Round 2: The Mirror (12 minutes)**
  *   **The Twist:** Collect all slips again (or use the same ones if not defaced). Announce: "For this round, the pairing rule has changed. We are not pairing you with another person. You are paired with *your own slip*. If you wrote C, you are paired with C. If you wrote D, you are paired with D."
  *   **Retrospective Score:** "First, look at the slip you just handed in. Under this new rule, C yields 3 points. D yields 1 point. I am scoring your previous choice this way now." Update the board scores.
  *   **Prospective Choice:** "Now, take a new slip. You know the rule: your choice will be matched against an identical copy of itself. Write C or D."
  *   **The Debate:** Collect slips. Ask for two volunteers: one to argue for D, one for C. Write their arguments on the board without naming them.
      *   *Predictable Failure:* If everyone writes C, there is no tension. You must seed the case for D. Ask: "Who thinks D is still rational? Your writing C doesn't *cause* the copy to be C. It just *is* C. Does that distinction matter?" Do not answer. Let the causal objection hang.
      *   *Predictable Failure:* If the retrospective scoring feels like a "gotcha," frame it as: "I am showing you the payoff structure of this logical space, not changing the past."
  *   **Purpose:** Forces the shift from causal decision theory to logical correlation.

  **Round 3: The Boundary (15 minutes)**
  *   **Step 3a (The Label):** "Keep the mirror rule. But now, your copy is not you. It is someone who drew the *other* color card. Reds are paired with Blues. Payoffs are still Table A."
      *   **Action:** Have them write C or D.
      *   **Discussion:** Ask: "Did anyone change their choice because the copy is a different person?" Most should say no; the reasoning is identical regardless of the label. This reinforces that the "we" is based on reasoning, not identity.
  *   **Step 3b (The Asymmetry):** "Keep the mirror rule. Keep the Red/Blue pairing. But now, payoffs depend on your color." Hand out Payoff Table B.
      *   **Reds:** CC=3, DD=1.
      *   **Blues:** CC=1, DD=3.
      *   **Instruction:** "Write C or D. You know your partner reasons exactly as you do."
      *   **Discussion:** This breaks the symmetry. If Reds reason "I should C because 3>1", Blues must reason "I should D because 3>1". But if they reason differently, they are not copies. If they reason the same, one gets screwed.
      *   **Outcome:** Students will realize the Round 2 argument fails. Justifications will shift to prediction ("What will the Reds do?") or bargaining ("We should agree..."), not logical correlation.
  *   **Purpose:** Demonstrates that the argument only works inside a stipulated symmetry. When the situation distinguishes the agents, the "we" dissolves.

  **Round 4: The Public Good (10 minutes, optional)**
  *   **Instruction:** "Treat the room as one group. Cost to contribute is $c$. Benefit per contributor is $b$. Total benefit is $n \times b$." Write $nb > c$ on the board.
  *   **Logic:** "Standard logic says you are not pivotal. Superrational logic says if you contribute, all $n$ contribute. So you compare $nb$ to $c$."
  *   **Question:** "How likely is it that all twenty of you are the same reasoner? What happens to the one who acts as though they are, but everyone else doesn't?"
  *   **Purpose:** Shows the fragility of the "we" as $n$ grows. The risk of being the "sucker" increases if the correlation is not guaranteed.

  **Debrief: Mapping the Terrain (20+ minutes)**
  *   **Map Round 1:** Standard rational choice. You choose a *move*. You treat the other as a separate causal chain.
  *   **Map Round 2:** Superrationality. You choose a *cell*. You treat the other as a logical mirror. The right move flips because the deliberation is about what *everyone in your position* does.
  *   **Map Round 3a:** The "we" is stipulated by reasoning, not identity. Labels (Red/Blue) don't break it.
  *   **Map Round 3b:** The boundary. When payoffs differ, the situations are no longer identical. The argument goes silent. You cannot derive the "we"; you must stipulate it.
  *   **Address the Causal Objection:** A faction will insist: "My writing C does not *make* the copy write C." Acknowledge this is the standard objection (causal decision theory vs. evidential/logical decision theory). Do not settle it. Say: "The theory asks you to act *as if* your decision fixes the logical output, not the causal input."
  *   **The Gap:** Be frank: "In this room, I guaranteed the duplicate. I told you you were paired with yourself. In the real world, nothing guarantees this. The activity hands you a guaranteed correlation; the theory asks you to infer it from reason alone. This is the most serious gap. You must supply the confidence that the other person is truly like you without a teacher enforcing it."
  *   **The Name:** "This position is called **Superrationality**, coined by **Douglas Hofstadter**. It covers symmetric games among identical reasoners. It does not cover asymmetric games, causal independence, or situations where the 'sameness' of the players cannot be stipulated."
  *   **Closing:** "You leave knowing that if the 'we' holds, cooperation is rational. If the 'we' breaks, you are back in the Prisoner's Dilemma. The work is knowing when you are in which world."
