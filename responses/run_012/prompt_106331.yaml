      *   *Argument 2 (Control Architecture):* Standard RL maximizes cumulative return. Biological systems often minimize deviation from a setpoint (homeostasis). A signal telling an agent "go get this" is different from "keep this variable between X and Y." Suffering might be tied to the *violation* of bounds, not the accumulation of scalar value.

