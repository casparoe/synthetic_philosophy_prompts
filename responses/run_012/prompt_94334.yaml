  *Cost:* Revising (3) collapses the distinction between base and simulated reality, weakening the existential import of the simulation hypothesis. Downgrading (6) and (7) negates the moral imperative to preserve simulated lives, undermining the motivation for safeguarding the future if we are simulated.

  **2. Normative Contradiction (Items 1, 5)**
  *Severity: Critical.* Item (1) advocates willingness to spend "almost any present resource," while (5) forbids sacrificing "substantial present-day goods." These categories inevitably overlap in real-world decision-making.
  *What must give:* You must either accept fanaticism (abandon 5) or impose a lexical priority on present goods (abandon 1).
  *Cost:* Abandoning (5) makes the view vulnerable to standard objections regarding extreme sacrifice for tiny probabilities. Abandoning (1) removes the "dominance" of the far future, fundamentally weakening the longtermist position that present goods are incomparable to future potential.

  **3. Decision-Theoretic Inconsistency (Items 1, 2, 3, 4)**
  *Severity: High.* Item (1) demands weighting small probabilities of large stakes; (2) and (3) imply a ≥1/3 probability of null impact on ultimate value; (4) instructs ignoring this probability.
  *What must give:* Either (4) must be abandoned to account for the simulation risk, or (3) must be revised to allow simulated actions to impact base reality.
  *Cost:* Abandoning (4) complicates the strategy, requiring complex acausal reasoning or correlation assumptions. Revising (3) contradicts the standard simulation hypothesis regarding agency isolation, suggesting our actions influence the simulators' world.

  **4. Referential Ambiguity (Items 1, 3)**
  *Severity: Moderate.* Item (1) prioritizes safeguarding the "far future," but (3) suggests the accessible future may be unreal and controlled by others.
  *What must give:* Clarify whether "far future" refers to base reality or simulated continuity.
  *Cost:* If base reality, agency is limited (per 3). If simulated, value is contested (per 3 vs. 6). Without clarification, the object of safeguarding is undefined.
