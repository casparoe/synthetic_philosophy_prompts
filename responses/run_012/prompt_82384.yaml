answer: |-
  # Specification for a Theory of Material Constitution

  **Scope:** This specification defines the necessary conditions for a metaphysical theory governing the relation between material objects and the matter that constitutes them. The theory must reconcile the apparent numerical identity of coincident objects with their divergent modal and persistence profiles.
  **Constraint:** The theory must preserve the truth of ordinary object discourse to the maximum extent possible and must contradict no established physical law (specifically regarding microphysical supervenience).

  ---

  ## I. Core Desiderata

  The following requirements are mandatory. Failure to meet a requirement constitutes a failure of adequacy unless a specific, justified error theory is provided (see Section IV).

  ### 1. Modal Discrimination Grounding
  *   **The Case:** *The Squash.* A lump of clay and a statue coincide. The lump survives flattening; the statue does not. At $t_1$, they share all microphysical properties.
  *   **Requirement:** The theory must identify a truth-maker for the modal difference between the coincident entities. It must specify whether this ground is intrinsic (essential properties), extrinsic (historical/causal relations), or conventional (sortal concepts).
  *   **Cost of Failure:** If the theory cannot ground the difference, it violates Leibniz's Law (identical indiscernibles). If it posits a difference without a ground, it commits to brute modal facts, violating explanatory depth. If it denies the difference, it falsifies ordinary modal intuitions (e.g., "The statue could not have been flattened").

  ### 2. Quantificational Stability
  *   **The Case:** *The Counting.* A question is asked: "How many objects are on the pedestal?"
  *   **Requirement:** The theory must provide a determinate answer to counting questions within a specified context. It must define the domain of quantification. If the answer varies by context (sortal-relative), the theory must provide the rules for context-shifting.
  *   **Cost of Failure:** If the theory implies there are always two objects, it makes ordinary counting systematically false (we say "one statue," not "one statue and one lump"). If it implies there is always one object, it cannot account for the divergent persistence conditions. If it leaves the number indeterminate without a mechanism for resolution, it renders arithmetic application to physical objects impossible.

  ### 3. Vagueness Uniformity
  *   **The Case:** *The Many.* A cat and the many "cat-candidates" differing by a hair; a statue and the many "statue-candidates" differing by a chip.
  *   **Requirement:** The theory must apply a uniform policy on ontic vagueness to natural kinds (cats) and artifacts (statues). It must state whether indeterminacy is epistemic, semantic, or ontological.
  *   **Cost of Failure:** If the theory treats artifacts as vague but natural objects as precise (or vice versa) without a principled distinction, it is ad hoc. If it accepts massive proliferation (many overlapping objects) to avoid vagueness, it violates Parsimony. If it accepts ontic vagueness, it risks contradicting classical logic.

  ### 4. Persistence Continuity
  *   **The Case:** *Reassembly and Replacement.* Parts are dispersed and rejoined; matter is replaced atom-by-atom while form is held fixed.
  *   **Requirement:** The theory must specify the necessary and sufficient conditions for transtemporal identity. It must determine whether continuity of matter, continuity of form, or continuity of function is primary, and how these weigh against each other.
  *   **Cost of Failure:** If the theory cannot distinguish the persistence conditions of the constituting matter from the constituted object, it collapses the distinction between *survival* and *replacement*. If it allows arbitrary reassembly, it violates causal constraints required by physics.

  ### 5. Existence Boundaries
  *   **The Case:** *Creation and Destruction.* Which events bring each thing into and out of being?
  *   **Requirement:** The theory must identify the precise event (or lack thereof) that constitutes the coming-into-existence of the object versus the matter. It must state whether the creation of the statue is identical to, a part of, or distinct from the shaping of the lump.
  *   **Cost of Failure:** If the theory cannot distinguish the birth of the object from the arrangement of the matter, it collapses Constitution into Identity. If it posits creation ex nihilo for the object, it violates physics.

  ### 6. Semantic Fidelity
  *   **The Case:** *Truth and Reference.* Ordinary claims ("The statue was destroyed," "The clay remains").
  *   **Requirement:** The theory must map ordinary predicates to ontological categories such that the majority of ordinary claims evaluate as true. If an error theory is adopted, it must explain why the error is unavoidable and pragmatically harmless.
  *   **Cost of Failure:** If the theory renders most ordinary talk false, it is revisionist to the point of uselessness for a metaphysics of *ordinary* objects. If it accepts the talk but cannot map the reference, it is semantically empty.

  ---

  ## II. Stress Tests (Custom Cases)

  Standard theories often fail these specific configurations. An adequate theory must explicitly address them.

  ### 7. The Dual-Role Constraint
  *   **The Case:** *Bronze Statue/Counterweight.* One quantity of bronze constitutes a Statue (identity tracks shape) and a Counterweight (identity tracks mass) simultaneously. Reshaping destroys the Statue but leaves the Counterweight numerically the same.
  *   **Requirement:** The theory must explain how a single material base supports two distinct objects with *incompatible* persistence conditions simultaneously, without positing two distinct material bases. It must clarify if the "Bronze" itself is a third object, and if so, how it relates to the other two.
  *   **Cost of Failure:** If the theory cannot handle multiple sortals on one matter, it fails to account for functional artifacts. If it posits three objects (Bronze, Statue, Counterweight) without clear differentiation, it violates Parsimony. If it claims the Statue and Counterweight are identical, it violates Leibniz's Law (one survives reshaping, the other does not).

  ### 8. The Institutional Grounding Constraint
  *   **The Case:** *The Memorial.* A statue is vandalized (destroyed physically), then recast from the same metal to the same design, with the original dedication plate reattached. The town treats it as the *same* memorial.
  *   **Requirement:** The theory must determine if institutional facts (dedication, continuity of role) can override physical discontinuity in grounding identity. It must explain why this verdict applies to the Memorial but not to an ordinary recast statue (which is typically considered a copy).
  *   **Cost of Failure:** If the theory denies the Memorial survives, it conflicts with deep social ontology intuitions. If it affirms survival without distinguishing the Memorial from ordinary statues, it makes artifact identity arbitrary. It must earn the asymmetry between institutional and non-institutional artifacts.

  ---

  ## III. Forbidden Collapses and Contradictions

  The theory must maintain the following distinctions unless a specific argument is provided to dissolve them. Collapsing these distinctions without justification is a failure of specification.

  1.  **Object vs. Matter:** The theory cannot treat the constituted object as merely a label for the matter.
  2.  **Being vs. Existing:** The theory must distinguish the conditions for *being* a statue (sortal satisfaction) from *existing* (spatiotemporal presence).
  3.  **Identity vs. Constitution:** The relation between the lump and the statue cannot be strict identity ($a=b$) if they have different properties. It must be defined as a distinct relation (e.g., constitution, realization, grounding).
  4.  **Artifact vs. Natural Object:** Both must receive the same structural treatment unless the theory provides a non-arbitrary reason for asymmetry (e.g., intention-dependence).
  5.  **Microphysical Supervenience:** No mental or modal fact about the object can vary without a physical variation *somewhere* (including the relational/social environment).
  6.  **Leibniz's Law:** If $x$ and $y$ are distinct, there must be a property $P$ such that $Px$ and $\neg Py$. The theory must identify $P$.
  7.  **Parsimony:** The theory cannot posit coincident entities that do no explanatory work. If the lump and statue are distinct, their distinctness must do work (e.g., explaining modal truths).

  ---

  ## IV. Analysis of Requirements and Structural Options

  ### 1. Non-Negotiables vs. Preferences
  *   **Non-Negotiable:** **Leibniz's Law** and **Microphysical Supervenience**. Abandoning Leibniz's Law collapses logic; abandoning Supervenience contradicts physics. These are the hard boundaries of the specification.
  *   **Preferences (Camp-Relative):** **Ordinary Counting** and **Parsimony**. Eliminativists prioritize Parsimony over Counting (saying "there are no statues" saves ontology but costs truth). Constitutionalists prioritize Counting over Parsimony (saying "there are two things" saves truth but costs ontology).
  *   **The Error Theory Clause:** A theory may fail "Semantic Fidelity" (Desideratum 6) only if it provides a robust error theory explaining why the illusion of ordinary objects is inevitable and useful.

  ### 2. The Trilemma of Constitution
  There is a strong suspicion that the following three requirements are jointly unsatisfiable:
  1.  **Microphysical Supervenience:** All facts supervene on physical facts.
  2.  **Grounded Distinctness:** Any difference between distinct coincidents must be grounded in a real difference (Leibniz's Law).
  3.  **Ordinary Counting:** There is exactly one object on the pedestal (not two).

  **Analysis of the Conflict:**
  If Supervenience holds, the physical base is identical for the lump and statue. If Counting holds, there is only one object. If there is only one object, it cannot have contradictory modal properties (survives squash/does not survive squash). If it has contradictory properties, it must be two objects (violating Counting) or the properties must be grounded in something non-physical (violating Supervenience or requiring relational supervenience).

  **Cheapest to Abandon:**
  *   **Ordinary Counting:** This is the most common sacrifice. Accepting that "one object" is a loose way of speaking about a complex ontological situation (either two coincidents or a single object with indeterminate identity) preserves Logic and Physics.
  *   **Microphysical Supervenience:** This is the most expensive. It requires accepting brute modal facts or haecceities, which undermines the scientific worldview the metaphysics aims to support.
  *   **Grounded Distinctness:** This is logically untenable without abandoning classical logic.

  **Most Exclusionary Requirement:**
  **Parsimony combined with Leibniz's Law.** This combination excludes standard Constitution Views (which posit two objects in one place) because the second object (the lump) often appears to do no work other than satisfying modal intuitions. It also excludes Eliminativism if "work" is defined as causal power, since artifacts *do* have causal power. It forces the theory into Four-Dimensionalism (where the "objects" are temporal slices of a larger worm) or Rigorous Sortalism (where the matter is not an object in the same sense).

  ### 3. Impact on Structural Options
  *   **Identity Theory (One Object):** Bears hardest on **Modal Discrimination**. It must explain how one thing has contradictory modal properties (usually by relativizing modality to sortals). It fails the **Dual-Role Constraint** if the sortals demand incompatible persistence.
  *   **Distinctness with Constitution (Two Objects):** Bears hardest on **Parsimony** and **Counting**. It must explain why we don't see two things and why the second thing isn't ontological bloat. It handles **Leibniz's Law** easily but struggles with **Supervenience** (what physical fact grounds the second object?).
  *   **Eliminativism (No Artifacts):** Bears hardest on **Semantic Fidelity**. It preserves Physics and Parsimony but renders ordinary talk systematically false. It fails the **Memorial Case** unless institutional facts are also eliminated.
  *   **Sortal-Relative Counting:** Bears hardest on **Absolute Existence**. It makes existence context-dependent. It solves **Counting** but complicates **Truth and Reference** (truth becomes indexical).
  *   **Four-Dimensionalism (Temporal Parts):** Bears hardest on **Persistence Continuity**. It redefines persistence as aggregation of parts. It handles **Reassembly** well but struggles with **Ordinary Counting** (we count continuants, not worms) and the **Memorial Case** (if the temporal worm is broken, is it the same worm?).

  **Conclusion:** The specification demands a theory that can locate the ground of modal differences in relational or institutional facts (to satisfy Supervenience) while accepting a divergence between ontological counting and ordinary counting (to satisfy Parsimony and Leibniz's Law). The **Dual-Role** and **Memorial** cases indicate that the ground of constitution cannot be purely physical; it must be capable of incorporating functional and institutional relations as truth-makers for identity conditions.
