      This is actually describing a **stateless** architecture vs **stateful** processing. If the system re-checks the record (database) from scratch, it retrieves the "verified lease" fact anew. The current system seems to be passing state between rules incorrectly or losing context. The caseworker's diagnosis is the most accurate regarding the *behavior*, but her solution is a mix of process and technical spec. I will mark "Adopt with changes" because the technical implementation needs to support that re-checking reliably.

