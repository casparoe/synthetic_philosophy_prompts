prompt: |-
  I run the eligibility office for a county rental-assistance program, and I need help diagnosing a problem that has been getting worse for two years.

  Our determinations are made by a software system assembled out of explicit rules: each rule states that if certain facts hold — household income below a threshold, a verified lease, a disability designation, and so on — then a client is eligible for a particular benefit amount. The rules have accumulated for eleven years, written by different people for different purposes. Here is the pattern that worries me. Whenever we add a rule to handle a new kind of case, cases that previously came out right come out wrong. Last month we added a rule that recalculates household income when a client reports starting a new job. Afterward, the system began treating some of those clients as having no verified lease on file, even though nothing about their leases had changed; the new rule had, in effect, stopped the earlier facts from being carried forward. We patched it. Two weeks later, a different patch broke a different rule. The system does not forget the way a person forgets; it simply stops carrying forward anything that no one explicitly instructed it to carry forward.

  Four people have told me what the real problem is, and I have to make a recommendation to my director on Monday.

  My director says the rules are merely incomplete: fund a year of work to enumerate every exception and every fact that remains true when something changes, so that the system never has to rely on assumptions.

  The contractor we consulted says we should stop writing rules by hand, train a model on eleven years of our decisions, and let it learn the patterns; we would not have to say what stays the same, because the model would infer it.

  Our auditor says the problem is that we keep changing the rules, and that the fix is to freeze them and require board approval for any change.

  A caseworker who has been here longer than the software says the rulebook is not the issue. The problem, she says, is that we treat a case as finished once the system has computed it; if the system re-checked the record from scratch whenever anything changed, none of this would happen.

  I am not looking for a vendor recommendation. I need to understand the shape of the problem well enough to know what I would be buying, and which of these four diagnoses names the underlying limitation rather than merely relocating it.

  Please answer in two parts.

  First, a short analysis (no more than 350 words) that states, in plain terms, what the underlying limitation actually is and why it arises. If this limitation has a standard name, give me the name; I do not need citations or further reading.

  Second, a table with exactly these five columns and one row for each of the four proposals above, in the order I gave them:

  - Proposal: who is proposing it, in a few words.
  - Diagnosis: what that proposal assumes the underlying problem to be, in one sentence.
  - What it would genuinely fix: the part of the failure pattern it actually addresses.
  - What it leaves broken: what would still go wrong if we adopted it, and why.
  - Verdict: exactly one of Adopt, Adopt with changes, Reject.

  End with a single sentence I can read aloud to my director that states what the real problem is.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Eligibility office runner for a county rental-assistance program.
      *   **Problem:** A rule-based software system for determining eligibility is brittle. Adding new rules breaks existing functionality (regressions). Specifically, new rules stop facts from being carried forward (state persistence issue).
      *   **Context:** Rules accumulated over 11 years, written by different people. System is explicit rule-based.
      *   **Specific Symptom:** New rule (income recalc) caused previous facts (verified lease) to be lost/not carried forward. System doesn't assume facts persist unless explicitly told.
      *   **Task:** Diagnose the underlying limitation among four proposed solutions (Director, Contractor, Auditor, Caseworker).
      *   **Output Format:**
          1.  Short analysis (max 350 words) identifying the underlying limitation (with standard name if applicable).
          2.  Table with 5 columns (Proposal, Diagnosis, What it would genuinely fix, What it leaves broken, Verdict) and 4 rows (one per proposal).
          3.  Single sentence conclusion for the director.

  2.  **Analyze the Underlying Problem:**
      *   The system is a rule-based engine.
      *   The core issue described is: "The system does not forget the way a person forgets; it simply stops carrying forward anything that no one explicitly instructed it to carry forward."
      *   When a change happens (new job), the system recalculates. But in doing so, it loses prior state (verified lease) unless explicitly programmed to retain it.
      *   This is a classic problem in knowledge representation and reasoning, specifically regarding **state persistence** or **frame problem**.
      *   The "Frame Problem" (in AI/philosophy) refers to the difficulty of representing what remains unchanged when an action occurs. In software engineering/rules engines, this is often related to **state management** or **lack of monotonicity** in a system that requires explicit state propagation.
      *   However, the description "stops carrying forward anything that no one explicitly instructed it to carry forward" points directly to the **Frame Problem**. In logic programming or rule systems, if you don't assert that $P$ is still true after event $E$, the system doesn't know $P$ is still true.
      *   The system is treating each determination as a stateless calculation rather than maintaining a persistent state model where facts persist unless negated.
      *   So, the underlying limitation is the **Frame Problem** (or closely related: lack of **state persistence** in a rule-based system).

  3.  **Evaluate the Four Proposals:**

      *   **Director (Enumerate every exception/fact):**
          *   *Diagnosis:* Rules are incomplete.
          *   *Fix:* Explicitly state what stays true.
          *   *Flaw:* This is trying to solve the Frame Problem by brute force enumeration. It's impossible to enumerate every fact that remains true in an open world. It leaves the system brittle because new facts will always emerge.
          *   *Verdict:* Reject (or Adopt with changes, but really it's unsustainable). Let's go with Reject because it's theoretically impossible to fully solve the Frame Problem this way.

      *   **Contractor (Train a model/ML):**
          *   *Diagnosis:* Rules are too hard to write; patterns exist in data.
          *   *Fix:* ML infers what stays same.
          *   *Flaw:* ML models are black boxes, hard to audit (critical for government eligibility), and might hallucinate eligibility. It doesn't solve the logical structure; it hides it. It also doesn't guarantee state persistence logically, just statistically.
          *   *Verdict:* Reject (High risk for compliance/auditability).

      *   **Auditor (Freeze rules/Board approval):**
          *   *Diagnosis:* Change management is the problem.
          *   *Fix:* Stop changing things.
          *   *Flaw:* Doesn't fix the brittleness. When changes *are* approved, they will still break things. It stifles necessary adaptation.
          *   *Verdict:* Reject (Doesn't solve the technical debt).

      *   **Caseworker (Re-check record from scratch):**
          *   *Diagnosis:* Process assumption (case finished) is wrong.
          *   *Fix:* Re-evaluate entire state on change.
          *   *Flaw:* This sounds like implementing state persistence or a full re-evaluation engine. If the system "re-checked the record from scratch," it implies reloading all verified facts (lease, income, etc.) from the database rather than relying on transient calculation memory. This addresses the state loss issue.
          *   *Verdict:* Adopt with changes (Needs technical implementation of state retrieval, not just process change). Actually, looking closer: "if the system re-checked the record from scratch whenever anything changed". This implies the system should query the source of truth for all facts upon every event, rather than relying on prior calculation state. This solves the "facts not carried forward" issue.
          *   *Refinement:* The caseworker identifies the process flaw (treating case as finished) but the solution requires a architectural change (stateless evaluation against persistent data).

  4.  **Drafting the Analysis:**
      *   Need to name the problem. "The Frame Problem" is the academic term. In software engineering, it's often "State Management" or "Persistence of Facts." The prompt asks for the standard name if it has one. "The Frame Problem" is the most accurate philosophical/AI term for "what remains true after a change."
      *   Explain why: Rule systems typically evaluate conditions based on current inputs. If the system doesn't have a mechanism to assume inertia (facts stay true unless changed), every new calculation must explicitly re-verify every past fact. The current system calculates eligibility based on a snapshot that isn't persistently stored or re-queried correctly during updates.
      *   Word count check: Keep it under 350.

  5.  **Drafting the Table:**
      *   Columns: Proposal, Diagnosis, What it would genuinely fix, What it leaves broken, Verdict.
      *   Rows: Director, Contractor, Auditor, Caseworker.
      *   Verdicts need to be exactly "Adopt", "Adopt with changes", or "Reject".

      *   *Director:* Reject. Solves specific instances but not the scalability of the problem.
      *   *Contractor:* Reject. Audibility/Compliance risk.
