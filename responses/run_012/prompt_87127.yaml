answer: |-
  ### Analysis

  The underlying limitation is a classic issue in artificial intelligence and knowledge representation known as the **Frame Problem**. It arises when a system cannot distinguish between what changes during an event and what remains unchanged. Your software treats every determination as a stateless calculation; it knows what rules to apply, but it lacks a default assumption of inertia. Consequently, when a new rule triggers a recalculation (like a job change), the system does not automatically preserve prior verified facts (like a lease) unless explicitly programmed to do so.

  This happens because your rule engine lacks **state persistence**. It does not maintain a durable model of the client's reality over time. Instead, it relies on transient data passed between rules. When the rule set grows, the interactions become complex, and the explicit instructions required to preserve every fact become unmanageable. You are attempting to solve a structural architectural deficit—how the system remembers reality—by adding more logical instructions. No amount of rule-writing can fully resolve this, because you cannot enumerate every fact that *doesn't* change in an open world. The system needs to be architected to retrieve persistent facts from a source of truth upon every event, rather than relying on rules to carry information forward.

  ### Proposal Evaluation

  | Proposal | Diagnosis | What it would genuinely fix | What it leaves broken | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Director** | The rules are merely incomplete. | Specific, known exceptions where facts are currently dropped. | The scalability of the system; it is impossible to enumerate every fact that remains true. | Reject |
  | **Contractor** | Rules are too hard to write manually. | The burden of hand-coding explicit logic for every scenario. | Auditability and determinism; a model cannot guarantee compliance or explain denials. | Reject |
  | **Auditor** | Frequent changes are causing the errors. | The introduction of *new* bugs caused by *new* rules. | The existing architectural brittleness; necessary updates will still break functionality. | Reject |
  | **Caseworker** | We treat cases as finished prematurely. | The loss of verified facts when a case is reopened or updated. | The technical capability to re-query source data; process changes alone cannot fix the engine. | Adopt with changes |

  ### Recommendation Statement

  Our engine lacks a default assumption of inertia, forcing us to manually encode what stays true instead of managing state architecturally.
