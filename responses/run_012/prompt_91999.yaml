answer: |-
  Good evening. Twenty-five years ago, the Halstead family sat where you are sitting. They asked a simple question: *What is our money for?* For a decade, I have had the privilege of helping answer that question. But tonight, we mark not just our history, but a change in our future.

  Two months ago, our board made a decision that I know has sparked conversation in this room. We rewrote our grant guidelines. From now on, every discretionary dollar we spend must go to the worst-off applicants we can identify.

  I know some of you flinched when our Chair explained this. She said she would "rather everyone improve a little less than watch the gap between our neighborhoods widen." I want to speak plainly about what that means, because there is a fear circulating that we have become enemies of progress.

  Let me be clear: We do not believe in pulling anyone down. We do not want to make the strong weak just to satisfy a spreadsheet. That is the "leveling-down" worry, and it is a serious one. If we told you we value equality so much we would burn a harvest just so no one has more food than their neighbor, you should run from this foundation.

  But that is not what we are doing. We are not chasing equality for its own sake. We are chasing *priority*.

  Here is the distinction: When a house is on fire, the firefighter does not spray water equally on the burning room and the safe room. She sprays the fire. Not because the safe room doesn't matter, but because the need is urgent. Our new rule admits that a dollar spent on a family facing eviction does more moral work than a dollar spent on a family saving for a second vacation. We are willing to accept slower *average* growth in our community metrics if it means the people at the bottom are not left behind. We are forgoing the maximum total good to ensure the *most necessary* good.

  I know there is a specific case on many of your minds. There is a proposed literacy program that would raise every child's reading level. It sounds perfect. But data shows it would raise the strongest readers the furthest, widening the gap between them and the non-readers.

  Under our old rules, we would have funded it. It looked good on paper. Under our new rule, we have to say no. Why? Because resources are finite. If we fund that program, we may not have the funds for the intensive, expensive tutoring required by the child who cannot read at all. That child isn't just "behind"; they are locked out. When the gap widens, the bottom doesn't just stay still; they fall further relative to the opportunities available. We are choosing the non-reader over the advanced reader. We are choosing to lift the floor, even if it means the ceiling doesn't rise quite as high this year.

  Now, I must address something else. Some of you know that our largest fund, the Founder's Restricted Endowment, legally requires us to serve mostly middle-income families. Some might call this a contradiction. If we care about the worst-off, why fund the middle?

  We honor the Founder's intent because we are stewards, not owners. But let this also remind you that we are not zealots. We know that a stable middle class is the infrastructure that supports the vulnerable. We work within constraints. But for every *discretionary* dollar we control—the money we can choose to direct today—we have chosen the bottom. We are not pretending the restricted money doesn't exist; we are ensuring the money we *can* control goes where the pain is deepest.

  To our community partners: I know you have heard "worst-off first" before. Usually, it meant funding the same three organizations on the same block. We are not doing that. We are asking you to help us find the applicants you usually skip because they are too hard to help, too messy, or too desperate. We are ready for the hard cases.

  To our donors: You need to know your money is not holding anyone back. It is not. It is simply going where the wound is deepest. We are not stopping the healthy from running; we are carrying the injured.

  The philosopher on our board warned us that the Chair's words sounded like we valued equality over well-being. I want to answer that tonight. We value well-being most of all. But we believe well-being is measured differently at the bottom than at the top. Ten dollars means nothing to me; it means dinner to a neighbor in crisis.

  We are not here to make the statistics look equal. We are here to make sure no one is abandoned. We would rather see a smaller rise in the average if it guarantees that the person with the least is finally given enough to stand.

  Thank you for twenty-five years. Let's get to work on the next twenty-five.
