          *   *Decision:* I will critique TKS as potentially "exoticizing." I will suggest **ADHD** or **Autism** as higher yield for "looping" (criteria changes, identity forms), despite the political risk, *or* suggest **Social Anxiety** itself, tracing how the *definition* changed the *patients*.
          *   *Actually, the prompt asks what the example must lack.* It must lack a biomarker. It must lack a settled history.
