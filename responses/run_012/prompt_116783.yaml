      *   **1. The Sequence:**
          *   *User's Idea:* Open with "kinds that can read their own classification."
          *   *My Advice:* Don't start with the abstract claim. Start with the *tension* between the two groups. Residents want stability; Philosophers want critique.
          *   *Flow:* Concrete Clinical Vignette -> The Puzzle (Why did the symptoms change?) -> The Mechanism (The Loop) -> The Tool (How to spot it) -> Application.
          *   *Why:* If you start with the slogan, philosophers nod and residents glaze over. If you start with a clinical puzzle, residents lean in, and philosophers see the data.
          *   *Dependency:* You need a shared observation of *change* before you can explain the *mechanism* of change.

      *   **2. The Carrying Example:**
          *   *User's Idea:* Taijin Kyofusho (TKS).
          *   *Critique:* TKS is great for cultural psychiatry, but risky here. It invites the "Exotic Other" trap. Residents might dismiss it as "Japanese, not here." Philosophers might jump to cultural relativism.
