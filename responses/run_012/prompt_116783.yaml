      *   *Two Directions (Downward/Upward):* Downward (category shapes person) is the classic looping effect. Upward (person/advocates shape category) is more about political/historical change (e.g., removal of homosexuality from DSM). *Critique:* "Upward" risks turning into a history lesson or political debate, which eats time. Needs to be tightly constrained to *classification revision* based on *changed behavior*, not just lobbying.
      *   *Carry-Away Tool (Loop-Prone Features):* Publicly readable criteria, identity-name, intervention changes criteria, no independent marker. *Critique:* This is the strongest part. It gives the residents a heuristic. "No independent marker" is the philosophical crux (natural kinds vs. interactive kinds). *Refinement:* Ensure "intervention whose success changes who still meets the criteria" is clear (e.g., if I treat depression, do they stop being depressed, or does the definition of depression shift because everyone is treated?). Actually, Hacking's point is often that the *category* changes because the *people* change. The tool needs to emphasize *instability* over time.
      *   *Complexity vs. Time:* 90 minutes is tight for 3 levels + 2 directions + 4 features + examples + misconceptions. *Verdict:* It's risky. The "Three Levels" might need to be the *structure of the example* rather than a lecture topic. The "Two Directions" should be woven into the narrative, not a separate taxonomy.

