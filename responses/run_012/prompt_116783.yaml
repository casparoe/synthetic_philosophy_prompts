  4.  **Refining the Apparatus Critique:**

      *   *3 Levels:* "Instrument" is the weak link. It's too technical. Merge "Instrument" into "Population" (criteria determine population). Or rename "Instrument" to "Practice" (how we ask).
      *   *2 Directions:* "Upward" is tricky. It sounds like lobbying. Needs to be framed as "Feedback from the classified to the classifier."
      *   *Tool:* "Intervention whose success changes who still meets criteria" is confusing. Hacking's point is that the *category* changes because the *people* change. The tool should be: "Does the classification change the *kind of person* one can be?"
