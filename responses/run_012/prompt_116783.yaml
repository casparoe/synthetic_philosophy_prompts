          *   *Timing:* "Arbitrary" needs to be hit early (when defining the loop). "Labeling Theory" needs to be hit when discussing the "Downward" loop. "Historical Event" needs to be hit when discussing the "Upward" loop.
          *   *Corrective Shape:* Not "No, it's real," but "It's real *because* it loops." Not "Not labeling," but "Labeling is the mechanism of the reality."

      *   **4. The Check for Understanding:**
          *   *Requirement:* Apply to a non-controversial category.
          *   *Idea:* "Diabetes" (doesn't loop). "Asthma" (doesn't loop). "Left-handedness" (used to loop, doesn't now).
