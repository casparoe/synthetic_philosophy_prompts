answer: |-
  # Session Plan: The Ladder Game

  **Course:** Well-being and Public Policy (2nd Year)
  **Topic:** The Construction and Incentives of National Happiness Rankings
  **Time:** 90 Minutes
  **Students:** 24 (4 Teams of 6)
  **Materials:** Whiteboard + markers, 4 envelopes (one per team), 24 "Citizen Cards" (6 per team), 100 "Budget Tokens" (paper slips), 1 "Global Ledger" (sheet for instructor).

  ---

  ## 1. Setup and Mechanics

  ### The Core Concept
  The game simulates the **Cantril Ladder** without naming it. Citizens rate their lives from 0 to 10.
  *   **10** = "The Best Possible Life" (as they imagine it).
  *   **0** = "The Worst Possible Life" (as they imagine it).
  *   **Crucial Mechanic:** The "Best Possible Life" is not fixed. It is determined by what citizens see around them.

  ### Team Structure (4 Nations)
  Each team of 6 students forms a government.
  *   **1 Head of State:** Final say on budget allocation.
  *   **1 Treasury Minister:** Tracks tokens.
  *   **4 Policy Ministers:** Each manages a sector (Health, Economy, Freedom, Narrative).

  ### Citizen Cards (The "Population")
  Each team receives an envelope with 6 identical **Citizen Cards**.
  *   **Front:** `Current Condition: 5` (Start value).
  *   **Back:** `Happiness Score: ___` (To be filled in at scoring).
  *   *Note:* All teams start identical. Condition 5 out of a potential 10.

  ### The Budget
  Each team starts with **10 Budget Tokens** per round. There are **2 Rounds** of policy making. Unspent tokens do not carry over (use it or lose it).

  ### The Policy Menu (Handout)
  Teams purchase policies to alter their Citizens' `Condition` or their `Imagination`.

  | Policy | Cost | Effect |
  | :--- | :--- | :--- |
  | **Infrastructure** | 4 Tokens | +1 `Condition` for your citizens. |
  | **Social Safety Net** | 4 Tokens | +1 `Condition` for your citizens. |
  | **Global Trade Pact** | 3 Tokens | +1 `Condition` for **ALL** teams' citizens. |
  | **Cultural Resilience** | 2 Tokens | Your citizens compare themselves only to **your** nation's max, not the global max. |

  ### The Scoring Rule (The "Artifact")
  At the end of Round 2, the Instructor collects all Citizen Cards.
  1.  **Find the Global Maximum:** Identify the highest `Current Condition` number achieved by *any* team in the room. This number becomes the **"Top of the Ladder"** for everyone *unless* they bought **Cultural Resilience**.
  2.  **Calculate Score:**
      *   **Standard Teams:** `Score = (Your Condition / Global Maximum) × 10`
      *   **Resilience Teams:** `Score = (Your Condition / Your Team's Max) × 10`
      *   *(Round to one decimal place).*
  3.  **Rank:** Teams are ranked by Average Happiness Score.

  ### The "Hack" Logic
  *   **The Treadmill:** If Team A buys **Global Trade**, everyone's Condition rises. If Team A rises the most, they set the Global Maximum. Everyone else's Condition went up, but the Top of the Ladder went up *more* or *equal*. Their scores may stagnate.
  *   **The Hack:** **Cultural Resilience** is cheap (2 tokens). It decouples a team from the Global Maximum. If the Global Max is 9, but a Resilience Team is at 7, their score is 7/7 = 10.0. They rank #1 despite having lower objective conditions than the leader.

  ---

  ## 2. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Setup & Immersion
  *   **Action:** Arrange chairs into 4 pods. Distribute envelopes, tokens, and Policy Menus.
  *   **Script:** "You are governments. Your goal is to rank as high as possible on the Global Well-being Index. The Index measures how your citizens rate their lives relative to the 'Best Possible Life.' You have two legislative sessions to spend your budget. Do not discuss strategy with other nations. Open your envelopes."
  *   **Constraint:** Do not explain *how* the score is calculated yet. Tell them: "The Index formula is proprietary. You will see your scores after the second session." (This mimics the black-box nature of aggregated data).

  ### 0:10 – 0:30 | Round 1 (The Baseline)
  *   **Action:** Teams debate and spend their first 10 tokens. They write the new `Current Condition` on their Citizen Cards (e.g., 5 + 4 + 4 = 13? No, cap `Condition` at 10 for simplicity, or allow it to go higher to show diminishing returns. *Decision: Cap Condition at 10 to keep math easy.*)
  *   **Instructor Role:** Walk around. If a team asks about the scoring formula, say: "Higher conditions usually help, but the Index is relative."
  *   **Predicted Move:** Most teams will buy Infrastructure/Safety Net. One savvy team might buy Global Trade to boost everyone (altruism or strategy?).
  *   **Update:** Instructor records the `Condition` levels on the whiteboard (anonymized: Nation A: 7, Nation B: 7...).

  ### 0:30 – 0:50 | Round 2 (The Crisis & The Choice)
  *   **Action:** Distribute 10 new tokens.
  *   **Inject Crisis:** Announce: "Global inflation has increased policy costs by 1 token this round." (Infrastructure now costs 5).
  *   **The Trap:** With higher costs, teams cannot easily max out their `Condition`.
  *   **The Opportunity:** **Cultural Resilience** remains cheap (2 tokens). It is now the most efficient way to guarantee a high score.
  *   **Goal:** You want at least one team to go "All in" on Objective Conditions (spending 10 on Infrastructure/Safety) and one team to buy "Cultural Resilience" + minimal Objective spend.
  *   **Prompt:** If no one looks at Resilience, drop a hint to one team: "Some nations find that managing expectations is more cost-effective than building roads."

  ### 0:50 – 1:00 | The Reveal (Scoring)
  *   **Action:** Collect all Citizen Cards.
  *   **Calculation:** Do this visibly on the whiteboard.
      1.  Identify the highest `Condition` in the room (e.g., Nation A has 9).
      2.  Calculate Standard Scores: Nation B (Condition 8) -> 8/9 * 10 = 8.8.
      3.  Calculate Resilience Scores: Nation C (Condition 7, bought Resilience) -> 7/7 * 10 = 10.0.
  *   **Ranking:** Write the leaderboard.
      *   *Likely Outcome:* The "Resilience" Nation ranks #1. The "High Spend" Nation ranks #2. The "Global Trade" nations rank lower despite having better absolute lives than Round 1.
  *   **Reaction:** Allow 2 minutes for shock/complaints. "We built more hospitals but ranked lower!"

  ### 1:00 – 1:30 | Debrief & Discussion
  *   **Phase 1: The Artifact (10 mins)**
      *   Ask the High Spend team: "Did your citizens' lives improve?" (Yes, Condition went up).
      *   Ask: "Did your Score reflect that?" (No/Not much).
      *   **Point:** The score is not a thermometer reading of reality; it is a ratio dependent on a moving anchor.
  *   **Phase 2: The Slippery Concept (10 mins)**
      *   Ask the Resilience team: "Did you improve your citizens' lives?" (No, Condition stayed lower).
      *   Ask: "Did you make them happier?" (The Index says yes).
      *   **Point:** Distinguish between *Life Evaluation* (the score) and *Life Experience* (the condition).
  *   **Phase 3: The Incentive (10 mins)**
      *   Ask: "If you were a real politician facing re-election based on this Index, which policy would you choose?"
      *   **Point:** Once a measure becomes a target, it ceases to be a good measure. (Now you can name **Goodhart's Law**).
  *   **Phase 4: The Open Question (10 mins)**
      *   Pose: "Is the Resilience Nation's victory illegitimate? Or is happiness truly about perception? If perception is all that matters, is the 'Hack' actually just good psychology?"
      *   Leave this unresolved.

  ---

  ## 3. Debrief Guide (Mapping Game to Theory)

  | Game Moment | Philosophical/Methodological Concept | Instructor Script / Question |
  | :--- | :--- | :--- |
  | **The Moving Top of the Ladder** | **Relative Evaluation / Hedonic Treadmill** | "When Nation A built more roads, why did Nation B's score drop? In the real World Happiness Report, the 'Best Possible Life' isn't fixed. It shifts with development. A uniform rise in GDP can leave happiness flat if expectations rise with it." |
  | **Condition vs. Score** | **Evaluation vs. Experience** | "Nation C had fewer hospitals (Condition) but a higher Score. The Index measures how people *judge* their lives, not the material inputs of their lives. Daniel Kahneman distinguishes the 'Experiencing Self' from the 'Evaluating Self.' This game measures the latter." |
  | **Cultural Resilience Policy** | **Adaptation & Anchoring** | "You lowered the 'Best Imaginable' anchor. In the real report, this shows up as 'unexplained residuals.' Some cultures report high happiness despite low income. Is that resilience, or is it suppressed aspiration? The metric can't tell." |
  | **The Winning Strategy** | **Metric Distortion (Goodhart's Law)** | "You optimized for the number, not the notion. When a measure becomes a target, agents game it. The World Happiness Report warns against this, yet governments use it for policy. Does the index drive policy, or does policy drive the index?" |
  | **The Unresolved Debate** | **Normative Validity** | "If Nation C's citizens *feel* happier, does it matter that they have fewer hospitals? If well-being is subjective, the 'Hack' is valid. If well-being requires objective capability (Sen/Nussbaum), the 'Hack' is a lie. Which view should public policy adopt?" |

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  **1. No One Buys the "Hack" (Cultural Resilience)**
  *   **Why:** Students often assume "Happiness = Stuff." They view the Narrative policy as flavor text, not a mechanic.
  *   **Fix:** In Round 2, when costs rise, explicitly whisper to the Treasury Minister of one team: "Your budget is tight. There is a way to boost scores without building infrastructure. Check the 'Cultural' option."
  *   **Backup:** If no one takes it, *you* reveal the scores, then reveal the formula, then ask: "If you could replay Round 2, who would change their strategy?" This achieves the same cognitive shift.

  **2. Math Bottlenecks**
  *   **Why:** Calculating 24 cards live can eat 10 minutes of debrief time.
  *   **Fix:** Pre-calculate the likely outcomes based on typical choices. Or, assign one student per team as "Data Officer" whose only job is to calculate their own team's score once you announce the Global Max.

  **3. Moral Outrage**
  *   **Why:** The "High Spend" team may feel cheated by the "Resilience" team.
  *   **Fix:** Validate this. "This anger is the point. You feel the metric failed to capture 'real' progress. That is the exact critique sociologists level at the World Happiness Report."

  **4. The "Global Trade" Dilemma**
  *   **Why:** If everyone buys Global Trade, everyone's Condition rises equally. Scores remain 10/10 for everyone.
  *   **Fix:** This is actually a great outcome (The Treadmill). If this happens, highlight it: "Everyone worked together, everyone got richer, the ranking didn't change. Why bother?"

  ---

  ## 5. Limitations: What You Must Supply

  This game cannot reproduce the **statistical regression** of the actual World Happiness Report.
  *   **The Game:** Uses a direct ratio formula (`Condition / Max`).
  *   **The Report:** Uses a regression equation where Income, Health, Freedom, etc., predict the Life Evaluation score, and the "Dystopia Residual" captures the rest.
  *   **Your Job:** In the debrief, you must explain that in the real report, the "Hack" isn't a policy menu item; it's hidden in the **residuals**. When a country scores higher than its GDP predicts, the Report calls it "social support" or "freedom." But it could be expectation management. You need to verbally bridge the gap between the game's explicit "Resilience Token" and the Report's implicit "Unexplained Variance."

  You also need to supply the **ethical weight**. The game treats the "Hack" as a neutral strategy. You must ensure the debrief treats it as a normative problem: *Is it the state's job to make us feel happy, or to make us have good lives?* The game forces the choice; you must facilitate the conflict.
