      *(Refining the Principle)*: "Swap only if the observed value is sufficiently low relative to your prior expectation of the maximum possible value." Or more formally: "Swap only if the posterior probability that you hold the smaller amount exceeds 1/3 (for 2x case)?" No, that's too technical. Let's stick to: "You need a prior distribution. Without it, the 50/50 assumption is invalid."

