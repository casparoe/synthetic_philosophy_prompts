answer: |-
  First off, give yourself a pat on the back. After a two-hour row, your gut is leading you much better than the standard textbook explanation often does. You've correctly identified that the paradox smells fishy, and your tentative principle is essentially the correct resolution. You aren't making noise; you're doing probability theory without realising it.

  Here is the breakdown of where you stand, which verdicts need tweaking, and the principle you can take to the pub to settle the bet.

  ### The Core Error
  The mistake in the argument that says "always swap" lies in this sentence: *"the other is £20 or £5 and the average of those is £12.50."*

  This calculation assumes that, having seen £10, it is equally likely (50/50) that the other envelope contains £20 or £5. This implies that for *any* amount $x$ you open, the probability of it being the smaller envelope is exactly the same as it being the larger one.

  Mathematically, this requires a "prior distribution" of money in the envelopes that is flat across all possible numbers from zero to infinity. That is impossible. There isn't enough money in the universe to support a uniform distribution over infinite values. In any sensible scenario, large sums become less likely than small sums. Once you admit that, the 50/50 assumption collapses.

  ### Reviewing Your Verdicts

  Here is how your cases stack up against the maths:

  1.  **Unopened Envelopes:** **Verdict: Keep.**
      *   **Status:** Correct.
      *   **Reasoning:** Pure symmetry. Before you look, the expected value of Envelope A equals Envelope B. Swapping costs nothing but gains nothing.

  2.  **Opened £10 (No other info):** **Verdict: Change to "Indifferent/Don't Swap".**
      *   **Status:** Incorrect (in the strict paradox context).
      *   **Reasoning:** This is where your gut was hesitating. Without a known distribution of how the money was chosen, you cannot assume the other envelope is equally likely to be up or down. If you truly know nothing about the range of values, you cannot calculate an expected value. You must revert to symmetry. You have no information that distinguishes your envelope from the other, so there is no advantage in swapping.

  3.  **The Symmetry Check (If I saw £20, I'd swap back):** **Verdict: Keep.**
      *   **Status:** Correct.
      *   **Reasoning:** This is the *reductio ad absurdum*. You cannot have a strategy that says "always swap regardless of what you see." If you did, you'd swap forever without looking. This proves the calculation in case 2 is flawed.

  4.  **The Ratio Change (10x multiplier):** **Verdict: Keep.**
      *   **Status:** Correct.
      *   **Reasoning:** Same logical flaw. Just because the potential gain is larger doesn't make the probability calculation valid. It just makes the impossible prior distribution even more absurd.

  5.  **Upper Bound (Max £1000, see £900):** **Verdict: Keep.**
      *   **Status:** Correct.
      *   **Reasoning:** Here you *have* a distribution (bounded at £1000). Seeing £900 gives you information: you likely hold the larger envelope because £1800 is impossible. The probability is no longer 50/50.

  6.  **Known Pair (£10 and £20):** **Verdict: Keep.**
      *   **Status:** Correct.
      *   **Reasoning:** Here the distribution is discrete and known. If you see £10, you know with 100% certainty the other is £20. You swap.

  ### The Principle

  Your tentative principle was: *"Swapping only makes sense once you've got an actual probability distribution over the amounts and you've updated on what you saw."*

  That is spot on. To make it a tool you can actually apply, I would phrase it like this:

  > **The Principle of Informed Swapping:**
  > You should only swap if the amount you see is **surprisingly small** relative to what you believe is the plausible range of values.
  >
  > 1.  If you have **no idea** what the total pot or range is, you cannot assume the other envelope is equally likely to be higher or lower. Treat the situation as symmetric and **do not swap**.
  > 2.  If you **know the range** (or have a strong prior belief), compare your observed value to that range.
  >     *   If the value is near the **bottom** of the plausible range, **swap**.
  >     *   If the value is near the **top** of the plausible range, **keep**.

  In the strict "Two Envelopes Problem" where no distribution is given, you are in category 1. Therefore, the instinct to swap on seeing £10 is the verdict that has to go.

  ### The Fee Question

  **Case:** You open £10. Someone offers to let you swap for a £1 fee. Do you pay?

  **Answer:** **No.**

  **Reasoning:** To justify paying a fee, you need a positive expected *gain*.
  *   If you assume the flawed 50/50 logic, your expected return is £12.50. Profit is £2.50. Minus the £1 fee, you net £1.50. It looks like a good bet.
  *   However, since we've established the 50/50 logic is broken, you cannot claim the expected return is £12.50.
  *   Without a known distribution, the expected gain from swapping is zero (by symmetry).
  *   If the expected gain is zero, paying £1 guarantees a loss.

  Even if you argue, "But £10 feels like a small amount," you are introducing a subjective prior. In a strict logical puzzle, you aren't allowed to import outside assumptions about what constitutes a "small" amount unless they are given in the problem. Without that prior, you cannot justify the fee.

  ### Summary for your Mate

  Tell him this: The argument that you should always swap relies on an **improper prior**. It assumes there is an equal chance of any amount of money existing in the universe, which is impossible.

  *   If we know nothing about the money: **Don't swap.** (Symmetry holds).
  *   If we know the distribution: **Swap only if the observed value is low relative to the distribution.**
  *   The calculation of £12.50 is a mirage caused by treating a variable ($x$) as a constant while simultaneously changing the probabilities attached to it.

  Your gut was right. The swap instinct is broken in the general case because it ignores the necessity of a prior distribution. Buy him a pint, show him this, and call it a day.
