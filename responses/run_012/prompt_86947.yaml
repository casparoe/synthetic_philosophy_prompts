prompt: |-
  I'm TAing a 75-minute section of a philosophy of biology course next week — 18 students, we've just done a week on behavior genetics, and the room has split cleanly in two: half of them are now convinced IQ is mostly genetic and that settles it, the other half think its a scam and that settles it too, and neither side can actually say what the number is a number *of*. I'd rather run something hands-on than give them another lecture, so I want a breeding game where they generate a heritability estimate with their own hands and then watch that number go to 0, then to 1, then become something else entirely, without anyone's genes changing.

  Here's the mechanic I've got in mind — build it out into something I can actually run. Everyone in the room is an organism. Each person holds a genotype number (on a card, face down or not, your call) and draws an environment number from a separate deck, and the trait is just the sum of the two. Then four rounds. (1) Everyone gets the same genotype, environments vary. (2) Genotypes vary, everyone gets the same environment. (3) Both vary. (4) I split the room into two sub-populations and we compute the heritability *within* each group and then look at the difference between the group means. I want them doing the arithmetic themselves — maybe one recorder at the board or a laptop on the projector — and I want each table to function as a lab that scores points for writing down its prediction of the next round's heritability *before* we run it, so that most tables predict wrong at least once and the wrongness is the lesson. If you can tack on a quick fifth beat, even as a prediction they don't get to test, I'd love something about what happens to the number when I apply a fertilizer to everyone versus applying it only to the short half. The three things I most want them to feel by the end: a trait can be 100% caused by genes and have a heritability of exactly zero; a heritability of 1 doesn't mean the trait can't be changed by changing the environment; and the heritability of a difference between two groups is a completely different animal from the heritability within them.

  So: the exact setup and materials (index cards, decks, dice, whatever — must be stuff I can assemble in an hour, no lab equipment), the specific numbers and distributions for each round so the arithmetic genuinely comes out the way you claim it will, the rules and the scoring scheme, a rough minute-by-minute for the 75 minutes including the debrief, and a debrief that maps each round back onto the piece of the idea it was supposed to teach — I don't want to name the lessons out loud until after round 4. Also tell me what will predictably go wrong the first time I run it (I'm already worried the arithmetic will drag and that someone will object that the whole thing is fake data, and I don't have a good answer to that one) and how to handle it in the moment. And be straight with me about what the game can't reproduce: I suspect it can't show gene-enviroment interaction or anything about how real estimates are actually wrung out of twin and adoption data, so tell me exactly what I have to supply by hand at the end. Tell me how confident you are in these design choices and single out the one element you're least sure will land with this particular group. End your whole reply with a line in exactly this form: \answer{a short phrase naming the misconception the game most reliably kills}
