answer: |-
  \answer{heritability explains between-group differences}

  ### **Lesson Plan: The Variance Game**

  **Goal:** Demonstrate that heritability ($h^2$) is a property of a *population in a specific environment*, not a fixed property of a trait.
  **Time:** 75 Minutes
  **Students:** 18 (6 tables of 3)
  **Materials (Prep time: 45 mins):**
  *   **18 Genotype Cards:** Index cards labeled with numbers. Distribute them so the class mean is 10 and variance is clear.
      *   *Set:* Three each of [4, 6, 8, 12, 14, 16]. (Mean = 10, Variance > 0).
      *   *Prep:* Tape these to students' shirts at the start. They do not change.
  *   **18 Environment Cards:** Two decks of index cards.
      *   *Deck A (Uniform):* All cards say "10".
      *   *Deck B (Variable):* Three each of [4, 6, 8, 12, 14, 16].
  *   **Projector/Laptop:** With a blank spreadsheet projected (Columns: Student ID, G, E, P, Deviation, Sq. Dev).
  *   **Table Handouts:** "Lab Sheet" with columns for Round, Prediction ($h^2$), Reasoning, and a small grid for calculating variance of their table's 3 members.
  *   **Whiteboard Markers.**

  ---

  ### **The Mechanics**
  *   **Phenotype ($P$):** $P = G + E$.
  *   **Heritability ($h^2$):** For this game, defined simply as $V_G / V_P$ (Variance of Genotype divided by Variance of Phenotype).
  *   **The "Trick":** You (the TA) control the *Variance* of G and E by declaring rules for each round, not by changing the cards on their chests.
  *   **Scoring:** Tables get 1 point for predicting the correct $h^2$ category (0, 1, or Mixed) *before* the Environment cards are revealed.

  ---

  ### **Minute-by-Minute Run of Show**

  **0:00 – 0:10 | Setup & Baseline**
  *   Stick Genotype cards on students (distribute the [4, 6, 8, 12, 14, 16] set randomly).
  *   Explain: "You are organisms. Chest number = Genotype. You will draw Environment. Phenotype = Sum."
  *   **Crucial Rule:** "We are not measuring intelligence. We are measuring 'Height Units'. Do not bring outside knowledge into the math."
  *   Show the projected spreadsheet. Explain that we will calculate Variance ($V$) together.
  *   **Task:** Tables calculate the Mean and Variance of their own 3 Genotype cards now (as practice). Report to TA. TA enters global $V_G$ on board (Pre-calculate this: $V_G \approx 16$).

  **0:10 – 0:20 | Round 1: The Clone Illusion ($h^2 = 0$)**
  *   **Rule:** "New Law of Physics: Genes are silenced. Effective $G = 10$ for everyone. Environment is Variable."
  *   **Action:** Hand out *Deck B (Variable E)*. Students keep G cards hidden/ignored.
  *   **Prediction:** Tables predict $h^2$. (Correct answer: 0, because $V_G$ is effectively 0).
  *   **Reveal:** Students reveal E. Calculate $P$.
  *   **Math:** TA inputs P. Spreadsheet shows $V_P$ matches $V_E$. $h^2 = 0$.
  *   **Lesson Seed:** "Trait varies, but genes didn't cause the variation."

  **0:20 – 0:30 | Round 2: The Genetic Determinist ($h^2 = 1$)**
  *   **Rule:** "New Law: Environment is uniform. Effective $E = 10$ for everyone. Genes are active."
  *   **Action:** Hand out *Deck A (Uniform E)*. Students use Chest G cards.
  *   **Prediction:** Tables predict $h^2$. (Correct answer: 1, because $V_E = 0$).
  *   **Reveal:** Calculate $P$.
  *   **Math:** Spreadsheet shows $V_P$ matches $V_G$. $h^2 = 1$.
  *   **Lesson Seed:** "Trait varies entirely due to genes."

  **0:30 – 0:40 | Round 3: The Reality Check ($0 < h^2 < 1$)**
  *   **Rule:** "Standard Physics. Both active."
  *   **Action:** Students use Chest G. Hand out *Deck B (Variable E)*. Randomize pairing so tall G doesn't always get tall E.
  *   **Prediction:** Tables predict $h^2$. (Correct answer: ~0.5, since $V_G \approx V_E$).
  *   **Reveal:** Calculate $P$.
  *   **Math:** Spreadsheet calculates. $V_P = V_G + V_E$. Ratio is approx 0.5.
  *   **Lesson Seed:** "Most real traits are mixed."

  **0:40 – 0:55 | Round 4: The Group Fallacy (Lewontin's Trap)**
  *   **Setup:** Split room. Left 9 students = Group A. Right 9 students = Group B.
  *   **Rule:** "Genes active. Environment is Uniform *within* groups, but different *between* groups."
      *   Group A gets $E = 10$ (Deck A).
      *   Group B gets $E = 20$ (Deck A modified or just declare it).
  *   **Prediction:** Tables predict $h^2$ *within* their group. (Correct: 1.0 for both groups).
  *   **Action:** Calculate $P$.
  *   **Math:**
      1.  Calculate $h^2$ for Group A (It will be 1).
      2.  Calculate $h^2$ for Group B (It will be 1).
      3.  Calculate Difference in Means (Group B is 10 units taller).
  *   **The Kicker:** Ask: "If $h^2$ is 1.0 in both groups, what caused the 10-unit gap between them?"
  *   **Answer:** The Environment (10 vs 20).
  *   **Lesson Seed:** "Within-group heritability says nothing about between-group differences."

  **0:55 – 1:00 | Round 5: The Intervention (Thought Experiment)**
  *   **Scenario:** Take Round 3 data (Mixed).
  *   **Q1:** "I give everyone +5 Fertilizer ($E$ increases by 5 for all)."
      *   *Ask:* Does Mean change? (Yes). Does $h^2$ change? (No, variance didn't change).
  *   **Q2:** "I give +5 Fertilizer *only* to the shortest half."
      *   *Ask:* Does Mean change? (Yes). Does $h^2$ change? (Yes, $V_E$ changed relative to $V_G$).
  *   **Point:** High $h^2$ does not mean the trait is immutable.

  **1:00 – 1:15 | Debrief & Mapping**
  *   Do not lecture. Ask the tables to report which round changed their mind about their initial prediction.
  *   **Map the Lessons:**
      *   Round 1 $\rightarrow$ A trait can be 100% genetic in origin (biologically) but have $h^2 = 0$ in a population (if everyone has the same genes).
      *   Round 2 $\rightarrow$ A trait can have $h^2 = 1$ but be completely changeable (if you change the environment for everyone, as in Round 5).
      *   Round 4 $\rightarrow$ High $h^2$ within groups does not explain why Group A differs from Group B.
  *   **Address the "IQ" Elephant:** "You came in arguing about IQ. This game shows why saying 'IQ is 80% heritable' answers neither 'Can we improve it?' (Round 2/5) nor 'Why do groups differ?' (Round 4)."

  ---

  ### **Predictable Failures & Fixes**

  **1. The Arithmetic Drag**
  *   **Risk:** Calculating variance for 18 numbers on a whiteboard will eat 20 minutes per round. You will run out of time.
  *   **Fix:** Use the projected spreadsheet for the *Global* variance. The students' "hands-on arithmetic" is calculating the variance of their *Table (n=3)* as a sample check.
  *   **Script:** "The computer handles the class average. Your job is to verify the machine isn't lying. Calculate the variance of your three seats. If your local variance goes up, the global variance should go up."

  **2. The "Fake Data" Objection**
  *   **Risk:** A student says, "This is just adding numbers. Real biology has interaction effects. This proves nothing."
  *   **Fix:** Agree immediately. "You are right. This is a frictionless plane. In real biology, $G \times E$ exists. But the *definition* of heritability is still a ratio of variances. If you don't understand the ratio in the simple case, you can't spot the error in the complex case. We are learning the statistic, not the biology."

  **3. Round 4 Confusion**
  *   **Risk:** Students think if $h^2=1$, the gap *must* be genetic.
  *   **Fix:** Point physically to the Environment cards. "Group A held '10'. Group B held '20'. The cards caused the gap. The Genotype cards were the same distribution. The math proves the gap is environmental despite perfect heritability."

  ---

  ### **Limitations (What You Must Supply)**
  This game is a **variance partitioning model**, not a **genetic estimation method**. You must explicitly state these three caveats in the debrief:
  1.  **No G$\times$E Interaction:** In the game, $P = G + E$. In reality, genotypes respond differently to environments. This game assumes additivity.
  2.  **Experimental vs. Observational:** We *know* the G and E values because we dealt the cards. In real human studies (twins/adoption), we *infer* variance components from correlations. Real estimates have error bars; this game has perfect data.
  3.  **Population Specific:** We changed $h^2$ by changing the rules (environment variance). In real life, $h^2$ is specific to *that* population at *that* time. You cannot take an $h^2$ from 1950 and apply it to 2024.

  ---

  ### **Confidence & Reservations**
  **Confidence:** High (85%). The logic is mathematically sound and directly addresses the three target misconceptions. The polarization of the class is actually an asset here; Round 4 specifically targets the "Group Difference" fallacy that fuels the IQ debate.
  **Least Sure Element:** **Student Engagement during Math.** There is a risk that while you are typing numbers into the spreadsheet, the students will zone out.
  *   **Mitigation:** Make the "Table Verification" mandatory. Tell them: "I will pick one table at random each round to come to the board and write their local variance. If it matches the trend on the screen, you get bonus points." This keeps them calculating while you type.

  \answer{heritability explains between-group differences}
