prompt: |-
  I'm a postdoc and next Thursday I'm presenting at our department's game theory reading group (I'm only in it because my advisor is on the mailing list) and what I need from you is a Q&A prep sheet, not a defense. The room, roughly: two people who work on equilibrium refinements and know Selten's stuff backwards, one evolutionary guy who basically only believes claims he's watched survive in a simulation, one philosopher of decision theory who spends his life on Newcomb-adjacent puzzles, and a mechanism designer from the econ department who comes for the coffee and then asks the question that ruins your day. So the center of gravity is equilibrium concepts, refinements, and stability under perturbation, with one outlier in each direction.

  Here's what I'm defending, so the objections have something to bite: that superrationality is best understood not as a rival to expected-utility maximization but as an equilibrium selection principle for symmetric games. The claim is that when a game is symmetric and has a symmetric payoff-dominant profile, the fact that each player knows the other will reach the same conclusion as them — not that they're literally the same algorithm, just that they're both running this kind of reasoning — is enough to select the payoff-dominant profile, and that all the similar-minds talk in the original presentation of the idea is doing no real work. My two showcase cases are the stag hunt (I say superrationality gets Stag right) and a version of the prisoners dilemma where the players are only approximately identical, i.e. there's a small chance the other guy's reasoning process differs from mine, which is where I expect to get killed. I'd also like to claim this is continuous with the standard symmetry argument for symmetric games, but I'm honestly not sure that helps me or hurts me.

  So: give me the eight or so objections I'll actually get from this room, ordered by how likely they are times how much damage they do, each phrased the way these particular people would phrase it (the refinements people will put it one way, the evolutionary guy another, the decision theorist another — that difference matters to me, I want to recieve them in the vocabulary I'll actually hear). For each one: a two-minute reply, a note on where the reply is soft, and what I should just concede up front rather than fight. Tell me which objection I should preempt in the first two minutes of the talk itself, and where the weakest point in my own position is that I should prepare to defend rather than hope nobody notices. Please don't give me the objections I'd get from the online rationalist / functional-decision-theory crowd — I know those, and half this room has never heard of them and wouldn't be moved by them anyway; I want the ones this specific audience will actually raise. And include the one question I'm praying nobody asks, because I'm fairly sure there is one and I'd rather see it in writing on Sunday than seperate from my dignity in the seminar room on Thursday. No reading list or citations needed, I'm not citing anything in the talk.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Postdoc in game theory/economics (likely).
      *   **Setting:** Department reading group.
      *   **Audience:**
          *   2x Equilibrium Refinement Experts (Selten disciples, care about perfection, properness, trembles).
          *   1x Evolutionary Game Theorist (Empiricist/Simulationist, skeptical of pure reasoning, cares about stability/dynamics).
          *   1x Philosopher of Decision Theory (Newcomb/Parfit/David Lewis type, cares about causality, correlation, and the nature of agency).
          *   1x Mechanism Designer (Econ dept, pragmatic, looks for implementation failures/incentive incompatibility).
      *   **Topic:** Superrationality (Hofstadter-esque) reinterpreted not as a rival to EU maximization but as an *equilibrium selection principle* for symmetric games.
      *   **Core Claim:** Symmetry + Common Knowledge of Rationality $\rightarrow$ Payoff-Dominant Symmetric Equilibrium. "Similar minds" is just a heuristic for correlated beliefs in symmetric settings.
      *   **Cases:** Stag Hunt (Success), Approximate Prisoner's Dilemma (Vulnerability).
      *   **Constraint:** No FDT/TDT/Online Rationalist jargon. Must speak the language of standard game theory/philosophy.
      *   **Deliverable:** ~8 Objections (Ranked by Likelihood $\times$ Damage), phrased in audience-specific vocab, 2-min replies, soft spots, concessions, preemption advice, weakest point, and the "Nightmare Question."

  2.  **Deconstruct the Core Claim & Vulnerabilities:**
      *   *Claim:* Superrationality = Symmetry-based Equilibrium Selection.
      *   *Vulnerability 1 (Refinement Guys):* Trembling Hand Perfection. If there's a tremble, symmetry breaks. Does the selection hold?
      *   *Vulnerability 2 (Evolutionary Guy):* Why would this evolve? If I mutate to defect, do I get punished? Is this dynamically stable?
      *   *Vulnerability 3 (Philosopher):* Causal vs. Evidential. Are you smuggling in CDT vs. EDT? Is "knowing they reach the same conclusion" magical thinking?
      *   *Vulnerability 4 (Mechanism Designer):* Implementation. What if the game isn't perfectly symmetric? What if I can commit?
      *   *Vulnerability 5 (General):* The "Approximate PD" case. If probability of similarity $< 1$, does it collapse to Defect?
      *   *Vulnerability 6 (Refinement Guys):* Risk Dominance vs. Payoff Dominance. In Stag Hunt, why Payoff?
      *   *Vulnerability 7 (Philosopher):* The definition of "Player." Are we modeling the algorithm or the agent?
      *   *Vulnerability 8 (Mechanism Designer):* Incentive Compatibility. Is this actually an equilibrium or just wishful thinking?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Refinement):* Needs to be about trembles. Selten's ghost. "If I tremble, do you tremble?"
      *   *Objection 2 (Evolutionary):* Needs to be about invasion. "Show me the basin of attraction."
      *   *Objection 3 (Philosopher):* Needs to be about the *source* of correlation. "Spooky action at a distance?"
      *   *Objection 4 (Mechanism):* Needs to be about asymmetry. "Real life isn't symmetric."
      *   *Objection 5 (Refinement):* Risk Dominance. Harsanyi-Selten.
      *   *Objection 6 (Philosopher):* Newcomb. "Is this just EDT?"
      *   *Objection 7 (Mechanism/Econ):* "Why isn't this just a correlated equilibrium with a specific correlation device?"
      *   *Objection 8 (The Nightmare):* The continuity claim. "If similarity is $1-\epsilon$, do you cooperate?"

      *Refining the Voices:*
      *   Refinement guys use words like "perturbation," "sequence," "limit," "proper."
      *   Evo guy uses "basin," "replicator," "mutant," "stable."
      *   Philosopher uses "causal structure," "subjunctive," "metaphysical."
      *   Mechanism guy uses "implementation," "robustness," "private info."

  4.  **Developing Replies & Concessions:**
      *   Need to be concise (2 mins spoken).
      *   Must acknowledge the strength of the objection (don't be defensive).
      *   Must pivot back to the "Selection Principle" framing.

  5.  **Identifying the "Nightmare Question":**
      *   The user mentioned the "Approximate PD" is where they expect to get killed. The continuity claim is "honestly not sure that helps or hurts."
      *   The nightmare question should combine the Mechanism Designer's rigor with the Refinement Guy's technicality regarding the $\epsilon$-similarity.
      *   *Question:* "If the probability of similarity is common knowledge but less than 1, at what threshold does your selection principle discontinuously jump from Cooperate to Defect, and isn't that just reconstructing the standard mixed equilibrium calculation under a different name?"

  6.  **Structuring the Output:**
      *   Follow the user's requested format strictly.
      *   Tone: Professional, collegial, slightly cynical (postdoc to postdoc).
      *   No citations.

  7.  **Review against Constraints:**
      *   No FDT/TDT jargon? Check.
      *   Specific audience voices? Check.
      *   8 objections? Check.
      *   Preemption advice? Check.
      *   Weakest point? Check.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the Refinement guys don't sound *too* similar. One cares about perfection (trembles), one cares about risk dominance (Stag Hunt).
      *   *Correction:* Ensure the Philosopher doesn't sound like the Online Rationalist. Keep it Lewis/Parfit, not Yudkowsky. Focus on *causal structure* rather than *algorithmic output*.
      *   *Correction:* The Mechanism Designer needs to be the one to ask about the "Selection vs. Equilibrium" distinction.
      *   *Refinement:* The "Nightmare Question" needs to be the one that exposes the mathematical emptiness of the claim.

  9.  **Finalizing the Content:** (Proceeding to generate response based on these thoughts).
      *   *Objection 1:* Refinement (Trembling Hand).
      *   *Objection 2:* Evo (Stability).
      *   *Objection 3:* Philosopher (Causal Structure).
      *   *Objection 4:* Mechanism (Asymmetry).
      *   *Objection 5:* Refinement (Risk Dominance).
      *   *Objection 6:* Philosopher (Newcomb/EDT).
      *   *Objection 7:* Mechanism (Correlated Eq).
      *   *Objection 8:* The Continuity/$\epsilon$ problem.
      *   *Nightmare:* The Threshold/Discontinuity.

      *Wait, I need to make sure the "Nightmare Question" is distinct from Objection 8.* Let's make Objection 8 about the definition of symmetry, and the Nightmare about the mathematical discontinuity in the Approximate PD. Or better: Objection 8 is the "Selection vs. Equilibrium" category error. The Nightmare is the $\epsilon$-cutoff.
      *Actually, the prompt asks for 8 objections AND the one question I'm praying nobody asks.* So 8 + 1.
      *Let's prioritize the "Approximate PD" vulnerability for the Nightmare Question, as the user flagged it.*

      *Let's refine the "Preemption" advice.* The symmetry argument is the strongest hook. Preempt the "Magic" accusation.

      *Let's refine the "Weakest Point".* Definitely the $\epsilon$-similarity in PD.

      *(Self-Correction)*: Ensure the tone isn't *too* harsh. It's a reading group, not a job talk, but the user wants to keep their dignity.

      *Let's write it.*
answer: |-
  Here is your Q&A prep sheet. I have calibrated the objections to the specific epistemic cultures in the room. The goal is to help you survive the hour without conceding the core thesis, while acknowledging where the formalism is thin.

  ### The Objections (Ranked by Likelihood $\times$ Damage)

  **1. The Trembling Hand (Refinement Expert #1)**
  *   **The Objection:** "You're treating symmetry as a hard constraint on beliefs. But in a trembling-hand perfect equilibrium, we assume independent perturbations. If I tremble and play Defect, do you tremble too? If yes, the trembles are correlated, which violates the standard definition of a strategic form game. If no, your symmetry argument collapses the moment we introduce $\epsilon$-probability of error. Are you redefining perfection?"
  *   **The Reply:** "I'm not redefining perfection; I'm restricting the domain of application. This selection principle applies to the *limit* game where perturbations vanish, but where the *reasoning process* remains common knowledge. I'm arguing that before we perturb actions, we must model the correlation in the *source* of the decision. If the trembles are truly independent physical slips, symmetry breaks. But if the trembles are errors in reasoning, and we are symmetric reasoners, the errors correlate. I'm selecting the equilibrium where the correlation of reasoning survives the limit."
  *   **Soft Spot:** You are blurring the line between "error in execution" and "error in calculation." Standard refinement theory assumes the former.
  *   **Concession:** Concede that if trembles are purely mechanical (hand slips), your principle doesn't apply. It only applies to "trembles in logic."

  **2. The Evolutionary Stability (Evo Guy)**
  *   **The Objection:** "Okay, suppose your reasoning selects Stag. Now introduce a mutant population of 5% who just play Defect (or Hare) regardless of reasoning. In a simulation, do your superrationalists survive? Or do they get eaten? If they get eaten, this isn't a solution concept, it's a suicide pact."
  *   **The Reply:** "In a one-shot symmetric game, the mutant doesn't get to 'invade' because the game ends. But if you're asking about dynamic stability: my claim is that superrationality is a *focal point* that allows a population to coordinate on the high-payoff basin. If the population is already coordinated on Stag, a Hare mutant gets the sucker payoff. The risk is in the transition, not the steady state. I'm explaining how we get to the good basin, not claiming the good basin is immune to all invasion."
  *   **Soft Spot:** You haven't defined the dynamics. If the basin of attraction for Stag is small, your selection principle is theoretically nice but practically irrelevant.
  *   **Concession:** Concede that this is a coordination device, not an evolutionary stable strategy (ESS) in itself. It requires a critical mass of common knowledge.

  **3. The Causal Structure (Philosopher)**
  *   **The Objection:** "You say 'similar minds do no real work.' But what grounds the correlation? In Newcomb problems, the correlation is caused by a predictor. Here, you're positing a correlation between my choice and yours without a common cause in the payoff structure. Aren't you just smuggling in Evidential Decision Theory (EDT) and calling it 'symmetry'?"
  *   **The Reply:** "No, because I'm not saying my choice *causes* yours. I'm saying the *input* to our decision functions is identical (the game matrix + common knowledge of rationality). Therefore the *output* is identical. It's not evidential; it's deductive. If $f(x) = y$ and we both run $f$ on $x$, we both get $y$. That's not magic; it's function evaluation."
  *   **Soft Spot:** This works for algorithms, less well for humans. Humans aren't deterministic functions of the game matrix.
  *   **Concession:** Concede that this requires a strong assumption of "rationality" as a deterministic function, which is a normative idealization, not a descriptive claim.

  **4. The Robustness Check (Mechanism Designer)**
  *   **The Objection:** "This works for symmetric games. But almost nothing in mechanism design is perfectly symmetric. Costs differ, information differs. If I introduce a tiny asymmetry—say, Player 1 gets a bonus of $\delta$ for Defecting—does your selection principle discontinuously jump to the Nash Equilibrium? If so, it's not robust."
  *   **The Reply:** "Yes, it jumps. That's a feature, not a bug. Symmetry is a knife-edge condition. My claim is that in the specific subclass of symmetric games, this principle resolves the multiplicity. I'm not claiming it's a universal solution for all games. In asymmetric games, we fall back to standard Nash or refinements."
  *   **Soft Spot:** It makes your theory fragile. Real-world applications are rarely perfectly symmetric.
  *   **Concession:** Concede immediately that this is a "toy model" insight, useful for understanding focal points, not for designing auctions.

  **5. Risk vs. Payoff Dominance (Refinement Expert #2)**
  *   **The Objection:** "In Stag Hunt, Hare is risk-dominant. Stag is payoff-dominant. Harsanyi and Selten taught us that risk often trumps payoff under uncertainty. Why does your symmetry argument override risk dominance? Just because we are symmetric doesn't mean we aren't risk-averse."
  *   **The Reply:** "Because the symmetry argument removes the *uncertainty* about the other player. Risk dominance relies on the belief that the other player might play safe. If I know, via symmetry, that you are running the same calculation, and I calculate that Stag is better *given you play Stag*, then I know you calculate the same. The uncertainty that drives risk dominance is dissolved by the common knowledge of symmetry."
  *   **Soft Spot:** This assumes the "calculation" yields Stag. If the calculation incorporates risk aversion, it might still yield Hare.
  *   **Concession:** Concede that this assumes risk-neutrality or that the payoff dominance is sufficiently large to swamp risk considerations.

  **6. The Correlated Equilibrium Redundancy (Mechanism Designer)**
  *   **The Objection:** "If you allow correlated beliefs in a symmetric game, aren't you just describing a Correlated Equilibrium with a specific correlation device (the symmetry itself)? Why do we need a new concept like 'superrationality' when Aumann already solved this?"
  *   **The Reply:** "A Correlated Equilibrium requires an external signal or device. My claim is that the *structure of the agents* provides the correlation without an external device. It's an endogenous correlation device. It saves us from needing a mediator to select the Pareto-optimal CE."
  *   **Soft Spot:** Mathematically, the set of outcomes might be identical. You're offering a philosophical justification for a specific CE, not a new mathematical set.
  *   **Concession:** Concede that the *outcome set* is a subset of Correlated Equilibria. Your contribution is the *justification* for selecting that specific CE without communication.

  **7. The "Algorithm" vs. "Agent" Distinction (Philosopher)**
  *   **The Objection:** "You say we aren't the same algorithm, just 'running this kind of reasoning.' Where is the cutoff? If I use a spreadsheet and you use a napkin, are we symmetric? If I'm slightly smarter than you, does the symmetry break? You need a metric for 'similarity of reasoning'."
  *   **The Reply:** "The cutoff is Common Knowledge of Rationality. If we both know we are both expected-utility maximizers with the same priors and same information, the physical substrate doesn't matter. If I know you're smarter, symmetry breaks, and we revert to standard Stackelberg or Nash reasoning. This principle is strictly for the case where 'same priors, same info, same rationality' holds."
  *   **Soft Spot:** "Same rationality" is doing all the heavy lifting and is ill-defined.
  *   **Concession:** Concede that this is an idealization. In practice, "similarity" is a continuous variable, and my model is the limit case.

  **8. The Continuity Problem (Refinement Expert #1)**
  *   **The Objection:** "You mentioned the Approximate PD. If there is a 99% chance I am identical to you, and 1% chance I am a defector, do you cooperate? Standard EU says Defect. Your principle says... what? If you say Cooperate, you violate EU. If you say Defect, your principle is empty."
  *   **The Reply:** "At 99%, the expected utility calculation *incorporates* the symmetry probability. I cooperate if $0.99 \times R + 0.01 \times S > 0.99 \times T + 0.01 \times P$. My principle doesn't override EU; it informs the probability assignment in the EU calculation. It says $P(\text{You=C}) \neq P(\text{You=C} | \text{I=C})$ is the wrong way to model it. It should be $P(\text{We both=C}) = 0.99$."
  *   **Soft Spot:** You are essentially reinventing the conditional probability argument used in Newcomb problems, which this room may view as discredited.
  *   **Concession:** Concede that at some threshold of dissimilarity, the recommendation flips. You don't have a clean formula for that threshold yet.

  ---

  ### The Nightmare Question
  **Who asks it:** The Mechanism Designer (after the Refinement guy nods along).
  **The Question:** "If your selection principle relies on the limit of perfect symmetry, but the recommendation discontinuously jumps from Cooperate to Defect as soon as symmetry is broken by $\epsilon$, then your principle has no predictive power in any real-world setting where perfect symmetry is unobservable. Are you proposing a normative ideal that is descriptively useless, or do you have a continuity theorem that shows the probability of cooperation degrades gracefully with asymmetry?"

  *   **Why it kills you:** It exposes that you haven't actually solved the Approximate PD; you've just restated the problem. If you don't have a continuity theorem, you're offering a parlor trick for perfectly symmetric games (which are rare) and nothing for the real world.
  *   **How to survive:** Do not bluff a theorem.
  *   **The Save:** "I don't have a continuity theorem yet. That's the next step. But even as a normative ideal, it shifts the burden of proof. In symmetric settings, the default shouldn't be Nash; it should be the Payoff-Dominant Symmetric profile unless there is evidence of asymmetry. It changes the null hypothesis."

  ---

  ### Strategic Advice

  **1. What to Preempt (First 2 Minutes)**
  Preempt the **"Magic/Telepathy"** objection (Philosopher/Evo Guy).
  *   *Say this:* "I want to be clear at the outset: I am not positing causal influence between players. I am not positing telepathy. I am positing that in symmetric games with common knowledge of rationality, the *state space* of possible outcomes is restricted to the diagonal. We are not modeling two agents influencing each other; we are modeling one decision problem viewed from two perspectives."
  *   *Why:* If you don't say this, the Philosopher will spend 10 minutes asking about causal graphs, and the Evo guy will roll his eyes.

  **2. Your Weakest Point**
  The **Approximate PD / Continuity** issue.
  *   *Preparation:* The Refinement guys will smell blood here. They know that if you can't handle perturbations, the concept isn't "robust."
  *   *Defense:* Frame it as a "Research Program" rather than a "Finished Theory." "This talk is about the anchor point (perfect symmetry). The perturbation analysis is future work." Don't let them drag you into calculating specific $\epsilon$ thresholds unless you have the math ready.

  **3. General Tone**
  *   **To Refinement Guys:** Speak their language. Use "limit," "perturbation," "robustness." Acknowledge Selten.
  *   **To Evo Guy:** Acknowledge that reasoning must be implementable. Don't claim this works for rocks, only for agents with sufficient compute.
  *   **To Philosopher:** Distinguish clearly between *causal* and *logical* correlation.
  *   **To Mechanism Designer:** Admit lack of robustness to asymmetry. Don't oversell the applicability.

  **4. The "Dignity" Save**
  If you get stuck on the Nightmare Question:
  "I think that's the critical open question. If this principle doesn't degrade gracefully, it's merely a curiosity. My claim today is just that the *anchor* is wrong in the standard literature, not that I have the full dynamics solved. I'd welcome collaboration on the continuity conditions."
  (This turns an attack into a collaboration offer, which works well in a reading group.)
