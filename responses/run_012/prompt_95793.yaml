prompt: |-
  For eighteen months I have been trying to write the history of my grandmother, and I have been failing in a way that has changed what I think a methods course is for. She cleaned other people's houses for forty years. The register gives her a birth line and a burial line, a rent book gives her two addresses, and the only document in which she says anything at length is a statement she gave to the police about a neighbour. Everything else I know about her comes from my mother. I teach the third-year methods seminar — nineteen students, one ninety-minute session — and I want that session to leave them unable to do source-based history innocently again. Design it.

  My own idea, which you should feel free to rebuild if it will not run, is a simulation set in a parish that is entirely invented and kept deliberately thin on period detail, so that nobody in the room, including me, can win by knowing more history than anyone else. Every participant begins as an inhabitant with a private sheet of ten things that happened to them that year. A smaller group are the recorders — parish clerk, tax assessor, magistrate's clerk, estate steward, whatever the archive needs — and each works from a rule sheet specifying which kinds of event they are obliged to write down. The inhabitants keep their sheets hidden; the recorders assemble the archive.

  Then the historians: a group takes the archive and nothing else, and answers three questions about the year in the parish, with confidence ratings. My strong preference is that this first pass should go well — that they should produce something that reads like competent, satisfying, genuinely source-based history — because the point I want them to feel is not that bad history distorts the past but that rigorous and faithful history reproduces the structure of power that produced its sources. The failure has to arrive as a consequence of their diligence, not their carelessness.

  What I want them to collide with, roughly in this order: that the archive is dense exactly where power is and empty everywhere else; that the best-documented ordinary person in the parish is the one the authorities had most reason to watch, so that visibility is a symptom of subjection rather than of significance; that one richly documented anomalous life is the best and most misleading thing they will ever be given, since the moment they generalise from it they are asserting a representativeness it cannot bear, and if they refuse to generalise they have no history at all; and that a recording rule introduced partway through the year — a new tax, a licensing scheme, a crackdown, your choice — can turn a person who was invisible in January into the best-documented person in the parish by December, which teaches them a great deal about the archive and nothing whatsoever about her.

  Give me the whole thing runnable: what goes on each inhabitant's sheet and each recorder's rule sheet, the three questions for the historians, the sequence and timings within the ninety minutes, the moment the private sheets are revealed and what I say there (I would rather say almost nothing and let them do the arithmetic on what fraction of the year survived), and the debrief mapping each phase onto the difference between a history of states and elites and a history from below — including what the second kind of history has to do instead, since I do not want them leaving with the archive is a map of power as the takeaway. Tell me what will predictably go wrong the first time I run it and how to handle it in the room, and be candid about what the activity cannot reproduce and that I will have to supply myself. I would especially like to know whether it overstates the silence: real historians of ordinary people do find rich sources, and I do not want to teach my students a pessimism the evidence will not support.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**
      *   **Goal:** Design a 90-minute third-year history methods seminar.
      *   **Instructor's Context:** Struggling to write a biography of a grandmother who was a domestic worker (cleaner). Sources are scarce (birth/burial, rent book, police statement). Teaching goal: Make students unable to do source-based history "innocently" again.
      *   **Core Pedagogy:** The failure of history shouldn't come from carelessness, but from *diligence*. Rigorous source work reproduces the power structures that created the sources.
      *   **Proposed Mechanism:** A simulation in an invented parish.
          *   *Inhabitants:* Have private sheets of 10 events.
          *   *Recorders:* Have rule sheets on what to record (creating the archive).
          *   *Historians:* Get only the archive, answer 3 questions with confidence ratings.
      *   **Key Lessons to Convey:**
          1.  Archive density = Power density.
          2.  Visibility = Subjection (the watched are the recorded).
          3.  The Trap of the Anomaly (rich documentation $\neq$ representativeness).
          4.  Administrative Change (new rules create sudden visibility, not life change).
      *   **Requirements:** Runnable materials (sheets, rules, questions), timing, script for the reveal, debrief structure (mapping to history of states/elites vs. history from below), troubleshooting (what goes wrong), and caveats (avoiding excessive pessimism).

  2.  **Deconstruct the Simulation Mechanics:**
      *   *Class Size:* 19 students.
      *   *Roles:*
          *   Historians: Need enough to discuss, maybe 6-7?
          *   Recorders: Need to create the bias, maybe 4-5?
          *   Inhabitants: The rest, maybe 7-8?
          *   *Correction:* 19 is tight. Let's aim for: 6 Historians, 5 Recorders, 8 Inhabitants. (Total 19).
      *   *The "Trap":* The Historians must succeed initially (write competent history) but fail structurally (reproduce bias).
      *   *The Archive:* Needs to look legitimate but be skewed.
      *   *The Reveal:* Inhabitants show their full lives. Historians realize what was missed.

  3.  **Drafting the Materials (The "Engine"):**
      *   *Setting:* "Oakhaven Parish, 1842." (Generic enough, specific enough for tax/police logic).
      *   *Inhabitant Sheets:* Need 10 events. Most should be mundane. Some should be "recordable" depending on the Recorder rules.
          *   *Crucial Detail:* One Inhabitant needs to be the "Anomaly" (highly visible due to trouble/tax). One needs to be the "Grandmother figure" (invisible labor).
      *   *Recorder Rules:* Need to filter events.
          *   *Rule 1 (Property):* Record land transactions, rent arrears. (Favors the propertied).
          *   *Rule 2 (Order):* Record disturbances, police interactions. (Favors the criminalized/poor).
          *   *Rule 3 (The Twist):* Mid-year rule change. E.g., "Domestic Service Registration Act." Suddenly, servants are recorded. But *only* servants.
      *   *Historian Questions:* Needs to force generalization.
          1.  What was the primary economic activity?
          2.  What was the most common source of social conflict?
          3.  Describe the life trajectory of a typical working-class woman.

  4.  **Refining the "Grandmother" Lesson:**
      *   The instructor's grandmother cleaned houses. In the simulation, there needs to be a character who cleans houses.
      *   *Before the Rule Change:* She is invisible.
      *   *After the Rule Change:* She appears as a name in a ledger, but only as a servant. Her inner life, her family, her struggles remain hidden.
      *   *The Police Statement:* The prompt mentions the grandmother has a police statement. In the sim, one Inhabitant should have a "crime/victim" event that generates a detailed record, making them the "best documented" but actually a victim of circumstance.

  5.  **Timing the 90 Minutes:**
      *   0-10: Intro & Role Assignment.
      *   10-25: Phase 1 (Life & Recording). Inhabitants review events, Recorders filter.
      *   25-35: Archive Assembly. Recorders hand over data.
      *   35-55: Historian Deliberation. Answering the 3 questions.
      *   55-70: The Reveal. Inhabitants speak. The Math.
      *   70-90: Debrief & Theory. Connecting to the instructor's grandmother and historiography.

  6.  **Developing the Debrief (The "So What?"):**
      *   Must move beyond "Archives are biased."
      *   Must address "History from Below." If we can't trust the archive, what do we do?
      *   *Answer:* Read against the grain, use silence as data, interdisciplinary methods (oral history, material culture), acknowledge positionality.
      *   *Avoiding Pessimism:* Acknowledge that E.P. Thompson, Carlo Ginzburg, etc., *did* find people. How? By understanding the bias, not ignoring it.

  7.  **Troubleshooting:**
      *   *Risk:* Historians guess too well. *Fix:* Make the questions require knowledge of the *invisible* (e.g., "typical woman's life").
      *   *Risk:* Inhabitants talk too much during Phase 1. *Fix:* Strict no-talk rule between groups.
      *   *Risk:* Students feel cheated. *Fix:* Frame the "failure" as the learning objective.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Recorder Rules:* Make sure the "Mid-Year Rule" is clear. Let's use a "Servant Tax/Registration" introduced in July.
      *   *Inhabitant 1 (The Grandmother proxy):* "Mary." Events: Cleaning, sickness, child birth, rent worry. Only recorded if Servant Rule triggers or Rent Arrears trigger.
      *   *Inhabitant 2 (The Anomaly):* "Thomas." Gets into a fight. Police involved. Huge file. Historians will think he's typical of working class men. He isn't.
      *   *Historian Questions:* Need to be specific.
          1.  Economic base? (Archive says agriculture/rent, Reality says service/labor).
          2.  Social conflict? (Archive says crime, Reality says rent/hunger).
          3.  Typical woman? (Archive says servant/criminal, Reality says mother/worker/invisible).

  9.  **Addressing the Instructor's Personal Stake:**
      *   The opening and closing must acknowledge the instructor's struggle. This isn't just an exercise; it's an confession of methodological limits.
      *   The "Reveal" script needs to be quiet and heavy, not triumphant.

  10. **Final Review against Constraints:**
      *   19 students? Yes.
      *   90 minutes? Yes.
      *   Invented parish? Yes.
      *   Specific lessons (density, visibility, anomaly, rule change)? All embedded.
      *   Avoid pessimism? Addressed in debrief.

  11. **Writing the Output:** (Proceeding to generate the detailed plan, materials, and scripts based on this structure.) *Self-Correction during drafting:* Ensure the distinction between "Recorder" and "Historian" is sharp. Recorders *make* the bias; Historians *inherit* it. The Recorders need to feel like bureaucrats, not villains. They are just following rules.

  12. **Final Polish:** Check the tone. It needs to be academic but deeply human, matching the instructor's prompt. (The prompt is beautifully written; the response should match that gravity).

  *(Self-Correction on the "Mid-Year Rule"):* To make it punchy, the rule change should specifically target the "Grandmother" figure's class. A "Domestic Service Registration" is perfect. Before July, she doesn't exist. After July, she is a number.

  *(Self-Correction on Historian Questions):* Ensure Question 3 is the killer. "Describe the life of a typical working woman." The archive will say "Servant." The reality is "Mother + Cleaner + Tenant." The gap is the lesson.

  *(Self-Correction on Pessimism):* Explicitly list methods that *do* work (oral history, reading against the grain, microhistory) so they don't leave thinking history is impossible.

