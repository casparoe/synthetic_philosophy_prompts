answer: |-
  # The Entitlement to Decomposition: Clarifying the Idealization in Scalable Oversight

  ## The Question and Framing
  When alignment research claims that decomposed oversight (e.g., HCH) idealizes deliberation "in the limit," it conflates three distinct readings. First, **Counterfactual Capacity**: what a single agent would conclude given unbounded time and memory. Second, **Distributed Empiricism**: what a system of distinct reasoners produces, assuming human cognition is structurally decomposable. Third, **Reflective Equilibrium**: a fixed point where the agent endorses the output regardless of process.

  Treating the construct as Counterfactual Capacity renders the project trivial if defined stipulatively, but impossible if human cognition cannot be linearly extended without qualitative change. Treating it as Distributed Empiricism makes it a substantive hypothesis requiring empirical validation; if cognition is holistic, the construct fails to track human values. Treating it as Reflective Equilibrium risks circularity unless the reflection operator is independently justified.

  This project commits to a framing of **Compositional Fidelity**: the specific assumption that decomposing a cognitive task preserves the semantic and normative content of the unified task. The core question is not which definition is "correct," but what entitlement we have to infer normative facts from computational structures that rely on decomposition. Does the construct idealize deliberation, or does it idealize division of labor, and does the distinction invalidate the oversight argument?

  ## The Gap in Existing Treatments
  Current treatments leave this open by sliding between readings to maximize utility. When defending safety, proponents treat the construct as Counterfactual Capacity (a frictionless plane, immune to empirical falsification). When defending capability, they treat it as Distributed Empiricism (leveraging parallel computation). This equivocation allows the construct to claim the normative authority of human deliberation while utilizing the scalability of distributed systems.

  By describing these positions without resolving the tension, existing work permits alignment arguments to proceed as if the idealization were harmless. If the idealization is not harmless—if decomposition alters the value landscape—then training signals derived from these constructs may optimize for something other than human deliberation. The literature currently lacks a formal distinction that isolates where decomposition changes the output relative to unified reasoning.

  ## Methodology
  **Months 1–2: Conceptual Mapping.** I will catalog explicit and implicit uses of "idealization" in scalable oversight arguments. I will distinguish reading (a) from (b) by analyzing cases where resource bounds are not the limiting factor, but structural integrity is. Reading will dominate this phase, focusing on philosophy of mind models of holism versus atomism.

  **Month 3: Formal Construction.** I will develop a toy model where readings (a) and (b) demonstrably diverge. Consider a probabilistic reasoning task where a holistic reasoner updates on joint evidence $P(H|E_1, E_2)$, while a decomposed system updates sequentially $P(P(H|E_1)|E_2)$. If the decomposition forces conditional independence assumptions that the holistic reasoner rejects, the outputs diverge even with unbounded time. I will formalize this "Context Loss in Decomposition" to show that (b) is not merely a bounded version of (a), but a structurally different process.

  **Months 4–5: Normative Implications.** I will analyze whether the divergence in Month 3 matters for value learning. If decomposed reasoning strips contextual nuance required for moral judgment, the oversight signal is corrupted. I will draft arguments showing where the slide between readings licenses unwarranted conclusions.

  **Month 6: Writing and Synthesis.** I will assemble the analysis into a final paper, ensuring the distinction between computational idealization and cognitive idealization is sharp. Writing will focus on clarity for both philosophers and engineers.

  ## Alternative Approaches
  Three alternatives exist, none sufficient. First, **Stipulative Definition**: simply define HCH as the ideal and move on. This ignores the risk that the definition picks out nothing real or normative. Second, **Engineering Pragmatism**: treat the matter as purely about decomposition quality metrics. This fails to address whether high-quality decomposition tracks *values* rather than just *coherence*. Third, **Dismissal**: argue the idealization question makes no difference to practice. This is dangerous; if the idealization is false, we may be training systems to optimize for a phantom target. This conceptual route is worth funding because it targets the license to infer safety from structure, which is currently assumed rather than proven.

  ## Outcomes and Failure Conditions
  A good outcome is a clarified set of entitlement conditions: specific criteria under which we are permitted to treat decomposed output as deliberative idealization. This would force users of these constructs to qualify their claims, distinguishing between "computationally scalable" and "deliberatively faithful."

  The project fails if the question dissolves—for instance, if "deliberation" proves too vague to support any idealization. I will know this has happened if the formal model in Month 3 shows that no coherent mapping exists between unified and decomposed reasoning even in principle. In that case, the deliverable will be a proof of impossibility, which is itself a valuable negative result.

  ## Scope Check
  The most likely risk is that the formal model in Month 3 becomes too complex, consuming time needed for normative analysis. If the probabilistic case proves intractable, I will cut the formal proof and rely on conceptual case studies of moral particularism versus principlism. This preserves the philosophical argument while reducing technical debt. I will not cut the distinction between readings (a) and (b), as that is the core contribution.

  ## Weakest Points
  1.  **Formal Simplicity:** The toy model may be too abstract to convince engineers that divergence occurs in realistic neural architectures.
      *   *Defense:* The goal is logical possibility, not empirical frequency; one counterexample breaks the universal claim.
  2.  **Normative Leap:** Showing decomposition changes output does not prove it changes *value*, only information.
      *   *Defense:* In moral reasoning, context is constitutive of value; information loss is value loss.
  3.  **Dissolution Risk:** The project may conclude the concept is too confused to repair.
      *   *Defense:* Demonstrating confusion in a foundational construct is a successful philosophical result, not a failure of execution.
