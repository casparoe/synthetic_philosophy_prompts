  2.  **Deconstruct the User's Argument:**
      *   *Premise 1:* Standard reading = Rules aren't premises (Ryle/Wittgenstein style).
      *   *Premise 2:* Achilles thinks validity *forces* acceptance ("Logic would take you by the throat").
      *   *Premise 3:* Tortoise shows propositions don't force anything. Force isn't a relation between propositions.
      *   *Conclusion 1:* Validity can't be the source of the norm to infer.
      *   *Objection Handling:*
          *   (a) Dispositionalism: User says disposition $\neq$ exercise, so Tortoise can have disposition but not infer.
