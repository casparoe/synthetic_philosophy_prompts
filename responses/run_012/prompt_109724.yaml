      *   *Key Insight to Offer:* The distinction between *logical consequence* and *logical obligation*. The Tortoise wins because Achilles tries to derive an 'ought' from an 'is' (validity). The solution isn't that validity isn't normative, but that the norm comes from the *agent*, not the *relation*.

