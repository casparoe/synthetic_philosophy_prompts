  Here's a thinking process that leads to the suggested comments:

  1.  **Analyze the User's Request:**
      *   **Task:** Critique a draft argument about Lewis Carroll's "What the Tortoise Said to Achilles."
      *   **Goal:** "Tear it apart" before it goes to a supervisor.
