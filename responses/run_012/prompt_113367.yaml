answer: |-
  You are correct: the dispute is largely meta-theoretical. The combatants agree on the biology (the Price Equation, the population genetics) but disagree on what counts as an *explanation*. Below are the desiderata for an adequate theory of levels of selection, structured by your constraints.

  ### The Desiderata

  **1. The Causal/Statistical Distinction**
  *   **Specification:** The account must distinguish between a trait being selected *because* it benefits the unit (causal) versus a trait merely covarying with the unit's success due to lower-level selection or structural constraints (statistical artifact).
  *   **Motivation:** The "Spandrel" problem. A group might survive because its individuals are robust, not because the group has a group-level adaptation. If the theory cannot separate correlation from causation, it labels everything "group selection."
  *   **Status:** **Non-Negotiable.** Without this, "selection" loses its explanatory power.
  *   **Conflict:** Conflicts with **Ledger Equivalence (Req 4)**. If the math is equivalent, causal attribution becomes model-relative.

  **2. The Replicator/Interactor Constraint**
  *   **Specification:** The account must specify whether the "level" refers to what is *copied* (replicator) or what *faces the sieve* (interactor/vehicle). A level counts as a unit of evolution only if it can transmit information with sufficient fidelity.
  *   **Motivation:** The "Community Bottleneck" case. A microbial consortium varies in productivity, but if the species composition is not faithfully transmitted (no bottleneck), it is an interactor only, not a replicator. Calling it a "unit of selection" without heritability conflates ecological success with evolution.
  *   **Status:** **Non-Negotiable** for *evolution*, but **Camp Preference** for *selection events*. (Some define selection as a single-generation causal process, others require multi-generation evolution).
  *   **Conflict:** Conflicts with **Plurality (Req 5)**. Cancer cells are replicators; the organism is an interactor being destroyed. Strict replicator requirements often force a single "dominant" level.

  **3. The Drift Boundary**
  *   **Specification:** The account must provide a statistical criterion to distinguish systematic fitness differences at level *L* from random sampling error (drift) at level *L*.
  *   **Motivation:** The "Small Demes" case. If deme productivity varies but is not heritable, calling this "group selection" conflates drift with adaptation. The theory must not label every group-level variance as selection.
  *   **Status:** **Non-Negotiable.**
  *   **Conflict:** Conflicts with **Empirical Tractability**. Distinguishing group-drift from group-selection is often statistically impossible in natural populations, making the theory empirically vacuous if held too strictly.

  **4. Decomposition Independence (The Ledger Test)**
  *   **Specification:** The account must state whether identifying a level of selection is a discovery about the world or a choice of bookkeeping. If the total change can be partitioned equally validly into individual or group components (Price Equation), the theory must declare if one partition is "true."
  *   **Motivation:** The "Ledger Equivalence" case. If the math allows two descriptions, claiming one is ontologically superior requires justification beyond mathematical convenience.
  *   **Status:** **Camp Preference.** (Realists say one is true; Instrumentalists say both are tools).
  *   **Conflict:** **Incompatible with Causal Realism (Req 1).** You cannot claim causal uniqueness (Req 1) while admitting mathematical equivalence (Req 4) without introducing extra-empirical metaphysical assumptions.

  **5. Simultaneity (No "Winner-Take-All")**
  *   **Specification:** The account must allow opposing selective pressures to act simultaneously at different levels without forcing the theorist to declare one level the "true" locus of evolution.
  *   **Motivation:** The "Opposed Selection" (Cancer) case. A mutation is selected at the cell level and selected against at the organism level. Both are causally active. A theory that forces a single "unit of selection" misdescribes the dynamics.
  *   **Status:** **Non-Negotiable** for accuracy; **Camp Preference** for parsimony. (Gene-selectionists often prefer to reduce all levels to gene fitness to maintain a single ledger).
  *   **Conflict:** Conflicts with **Parsimony**. Allowing multiple active levels complicates prediction and explanation.

  ---

  ### The Incompatibilities (The Trap)

  You suspected the list itself creates the dispute. You are right. There are two fundamental tensions that prevent a single theory from satisfying all desiderata perfectly.

  **Tension A: Causal Realism vs. Formal Equivalence (Req 1 vs. Req 4)**
  *   **The Problem:** The Price Equation demonstrates that individual and group selection partitions are mathematically transformable. If you insist that "Group Selection" is a distinct causal force (Req 1), you must deny the ontological weight of the mathematical equivalence (Req 4).
  *   **The Verdict:** This is a **Verbal Dispute**. If the predictions are identical, the argument over which level is "really" doing the work is a dispute over language, not biology. Any theory claiming to solve this empirically is smuggling in metaphysics.

  **Tension B: Heritability vs. Simultaneity (Req 2 vs. Req 5)**
  *   **The Problem:** To count as a Darwinian unit, a level usually needs heritability (Req 2). However, in cases like cancer or meiotic drive, the lower level is heritable (genes/cells) while the higher level (organism) is the thing being destroyed (low heritability of the organismal type). If you demand heritability for a level to count, you cannot describe the organism as a "unit" under attack. If you allow the organism to count as a unit without heritability (as an interactor), you blur the line between selection and ecological filtering.
  *   **The Verdict:** This is an **Empirical Trade-off**. You must choose between a strict definition of evolution (requires heritability) and a broad definition of causal interaction (allows transient units).

  ---

  ### Adjudication of Test Cases

  *   **Opposed Selection (Cancer):** Satisfies **Simultaneity (Req 5)**. The theory must label this as "Multi-level conflict," not pick a winner. Gene's-eye view handles this by calling it "gene conflict," but Multilevel Selection (MLS) describes the causal structure more intuitively.
  *   **Community Bottlenecks:** Turns on **Heritability (Req 2)**. If the consortium is bottlenecked (propagule stage), it meets the replicator criterion and is a unit of selection. If not, it is merely an ecological interaction. The theory must *not* depend on whether we linguistically call it an "organism," but on the transmission fidelity.
  *   **Small Demes:** Turns on **Drift Boundary (Req 3)**. If variance in deme productivity is not heritable, it is group drift. A theory that calls this "group selection" fails the desiderata.
  *   **Ledger Equivalence:** Turns on **Decomposition Independence (Req 4)**. The theory must admit that the label is a choice of formalism. If it claims one label is "true," it fails the Causal/Statistical distinction because the statistics support both.

  ---

  ### Scoring and Conclusion

  **The Most Exclusionary Requirement:**
  **Decomposition Independence (Req 4).**
  This requirement kills the most theories. Any theory that claims "Group Selection is *real* but Individual Selection is *just a model*" (or vice versa) without acknowledging the mathematical equivalence fails this test. It forces the theorist to admit that much of the debate is about explanatory convenience, not ontological fact.

  **Survival Score:**

  1.  **Pluralist / Pragmatist (Best Survival):**
      *   *Why:* Accepts **Simultaneity** and **Ledger Equivalence**. Admits that "levels" are tools for modeling specific causal pathways rather than distinct ontological categories. It dissolves the verbal dispute by acknowledging the formalism.
      *   *Cost:* Sacrifices the feeling of having found the "One True Cause."

  2.  **Multilevel Selection (MLS):**
      *   *Why:* Handles **Opposed Selection** and **Community Bottlenecks** well.
      *   *Cost:* Struggles with **Ledger Equivalence**. Often tempted to reify group selection as a distinct force equivalent to individual selection, which invites the mathematical critique.

  3.  **Gene's-Eye View:**
      *   *Why:* Mathematically robust on **Ledger Equivalence** (everything reduces to gene frequency).
      *   *Cost:* Struggles with **Simultaneity** and **Causal Realism**. Describing cancer as "gene selection" is mathematically correct but causally opaque regarding the organism's death. It often violates the spirit of **Causal/Statistical Distinction** by treating all organismal traits as gene strategies, even when they are constraints.

  **Final Verdict:**
  The dispute is **70% verbal, 30% empirical**.
  The empirical part concerns heritability and bottlenecks (Req 2 & 3). The verbal part concerns the Ledger Equivalence (Req 4). If you demand a theory tell you *which* level is "really" selected in a case of ledger equivalence, you are asking for something the biology does not provide. The adequate account is one that treats levels as **modeling stances** rather than **natural kinds**.
