      *   *Requirement 2: Replicator/Interactor Distinction.* (Addressing "what gets copied vs. what gets selected"). Needs to handle the Hull/Dawkins distinction.
      *   *Requirement 3: Heritability of the Unit.* (Addressing "does a level have to be heritable"). Can a group be a unit if it doesn't reproduce faithfully?
      *   *Requirement 4: Selection vs. Drift.* (Addressing "small demes"). Needs to distinguish systematic fitness differences from random sampling error at the group level.
      *   *Requirement 5: Explanatory Utility (Criterion vs. Redescription).* (Addressing "Ledger equivalence"). Is the theory a tool for prediction or a way to rewrite history?
      *   *Requirement 6: Simultaneity of Levels.* (Addressing "Opposed selection"). Must allow multiple levels to be active without forcing a single "true" level.

  3.  **Evaluate Incompatibilities (The "Trap"):**
      *   *Trade-off A:* Strict Heritability (Req 3) vs. Simultaneity/Causal Efficacy (Req 1 & 6). If a group must reproduce faithfully to be a unit (like an organism), many transient groups fail. But if transient groups count, does "selection" lose its meaning?
      *   *Trade-off B:* Causal Realism (Req 1) vs. Ledger Equivalence/Pluralism (Req 5). The Price Equation shows mathematical equivalence. If the math is equivalent, is the causal claim real or just a perspective? You can't have it both be *ontologically distinct* and *mathematically interchangeable* without qualification.
