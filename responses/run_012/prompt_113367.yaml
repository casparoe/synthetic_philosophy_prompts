          *   Adjudicate specific test cases: Opposed selection (cancer), Community bottlenecks (holobionts), Small demes (drift vs. selection), Ledger equivalence (Price equation decompositions).
          *   Final Output: Identify the most exclusionary requirement and score the usual positions (Gene's-eye, Multilevel, Pluralist).
          *   Tone: Direct, analytical, willing to call out verbal disputes.
      *   **User's Suspicion:** The disagreement is often about what the theory is supposed to *do* (meta-theoretical), not just empirical facts. There may be incompatible requirements.

  2.  **Deconstruct the Desiderata (Drafting the List):**
