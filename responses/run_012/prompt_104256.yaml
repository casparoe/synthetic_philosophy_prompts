  *(Drafting mental check on the "Cross-polity" comparison)*: Japan is the classic "non-colonial Asian modernizer." Comparison: Rate of textile mechanization 1880-1940.

  *(Drafting mental check on Weights)*: Optimist weights Public Goods/Institutions higher. Critic weights Violence/Transfer higher. I need to state this clearly.

