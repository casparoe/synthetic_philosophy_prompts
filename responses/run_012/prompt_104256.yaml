  6.  **Writing the Document:** (Proceeding to generate the text based on these thoughts.) *Self-correction: Ensure the "Optimist" doesn't sound like a caricature and the "Critic" doesn't sound purely emotional. Both must sound like rational accountants within the frame.* *Make sure the "Disconfirmation" criteria are sharp.* *Ensure the "Verbal" section actually identifies semantic disputes.*

