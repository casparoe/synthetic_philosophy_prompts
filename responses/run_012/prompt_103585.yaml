      *Best approach:* Attack the feasibility of (2). You cannot calculate the EV of further search without knowing the distribution of future options. If you don't know that, you *cannot* optimize search. You *must* satisfice. Therefore, satisficing is distinct because optimizing is impossible.

      Let's organize the response around the "Three Places to Break" framework the user asked for, plus the "Regress" argument.

      *   **Break at (2):** Deny that the *immediate* reason must be EV. (Rule-following).
      *   **Break at (3):** Deny that functional equivalence implies identity of process.
