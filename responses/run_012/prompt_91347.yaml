answer: |-
  The divergence between the European and American approaches to assisted reproduction reveals a fundamental clash in how each culture defines the body, labor, and kinship. The practice is philosophically underdetermined because neither side possesses a monopoly on moral logic; rather, each prioritizes different ethical values that lead to contradictory conclusions about the same biological facts.

  **Commodification vs. Autonomy**
  The European model presupposes that certain aspects of human existence constitute "market inalienables." This view, rooted in a Kantian conception of dignity, argues that the human body and its reproductive capacities cannot be treated as property without degrading human worth. From this perspective, reproduction is not a service but a fundamental human condition that resists monetization.

  The American model presupposes a Lockean view of self-ownership. Here, the body is the primary property of the individual, and autonomy is the highest good. If a woman owns her body, she owns her labor, including reproductive labor. To forbid payment is to infringe on her liberty and devalue her work compared to other risky professions.

  **The Underdetermination of "Harm"**
  This split is philosophically underdetermined because there is no objective metric to decide which view is correct.
  *   **The European Contradiction:** If the harm of surrogacy is the commodification of the body, why is altruistic surrogacy permissible? If gestation is too sacred to sell, it should arguably be too sacred to give away casually. Furthermore, if the harm is exploitation, banning payment does not remove the physical risk; it merely removes the compensation for that risk. This suggests the European ban is not actually about protecting women from harm, but about protecting society from the *idea* of a market in babies.
  *   **The American Contradiction:** If autonomy is the settling factor, the US model often ignores the socioeconomic context of that autonomy. A choice made under financial duress is formally voluntary but substantively coerced. The US system assumes consent is binary (you signed the contract), whereas philosophy suggests consent is a spectrum influenced by power dynamics.

  **The Consent Paradox**
  The European approach often operates on a paternalistic assumption: that money vitiates consent. The logic suggests that a woman cannot truly agree to surrogacy if she is paid, because the payment itself is an undue inducement. However, this creates a paradox. By mandating altruism, the system relies on social pressure, familial guilt, or emotional manipulation to secure surrogates. One could argue that a clear commercial contract offers *more* protection and clearer boundaries than an arrangement based on "gift" relationships, where obligations are vague. The philosophical underdetermination lies here: we have no consensus on whether payment corrupts consent or clarifies it.

  **Internal Inconsistency and Reproductive Tourism**
  The bans are internally inconsistent regarding jurisdiction. Many European countries prohibit surrogacy domestically but recognize parental rights for children born via surrogacy abroad (often after legal battles). This creates a moral loophole: if the practice violates human dignity, it should not matter where it occurs. By allowing citizens to travel to the US or Ukraine to do what is forbidden at home, these states signal that the prohibition is not about universal human rights, but about maintaining domestic social order and avoiding public budgetary costs. It transforms the ethical ban into a zoning law: *not here, not with our money.*

  **Parenthood: Biology vs. Intent**
  Finally, the split reveals different metaphysical views on what makes a parent.
  *   **Europe:** Often privileges the gestational link (*mater semper certa est*—the mother is always the one who gives birth). This makes surrogacy legally dangerous because the surrogate is the "real" mother by default.
  *   **US:** Privileges intentional parenthood. The genetic and gestational contributions are viewed as services rendered to the intending parents.

  Neither view is scientifically mandated. Genetics, gestation, and social intent are all valid candidates for "parenthood." The law must choose one, but philosophy has not settled which is definitive.

  **Conclusion: Prohibition vs. Regulation**
  The practice is underdetermined because prohibition is not the only alternative to a free market. A third option exists: a regulated commercial model that prioritizes the surrogate's welfare without banning payment. This would include independent legal counsel, escrowed funds, and the right to withdraw consent, treating the surrogate as a skilled worker rather than a vessel or a volunteer.

  The current polarization forces a false choice between "exploitation" (US) and "dignity" (Europe). In reality, the European model risks exploiting women's labor by demanding it for free, while the American model risks exploiting women's bodies by pricing them. The philosophical gap is the failure to distinguish between *commercialization* (which both sides debate) and *professionalization* (which could offer protections regardless of the payment model). Until there is agreement on whether reproductive labor is a gift, a service, or a unique category of human action, the law will remain a patchwork of conflicting moral intuitions rather than a consistent ethical framework.
