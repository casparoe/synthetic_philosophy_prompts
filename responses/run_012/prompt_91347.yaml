prompt: |-
  I've been reading about how different places handle surrogacy and egg donation, and the pattern looks strange to me. In a lot of Europe surrogacy is either banned outright or legally unenforceable, and where it is allowed, like in the UK, the surrogate is supposed to get her expenses covered and nothing more. Egg donation goes the same way: altruistic only, and in some countries (Germany, I think) not allowed at all. In the US, meanwhile, there's a full-blown market, with agencies, contracts, surrogates paid a fee on top of expenses, egg donors getting paid thousands, and donor profiles advertising height, college, and test scores.

  What does this split presuppose about persons, bodies, or parenthood? Does the European approach assume some things just shouldn't be bought and sold even when everyone involved agrees, and if so, what makes reproduction different from the other risky things people get paid to do? Or does it assume women can't really consent when money is on the table? Is the American side committed to the opposite view, that these are simply services and autonomy settles it? Are the bans internally consistent, given that the same countries let their citizens travel abroad for the same procedures, or allow the donation while forbidding payment for it? And how much of this is really forced by the practice rather than being one option among several, say an anti-exploitation view that wants more support for the surrogate instead of prohibition?

  Tell me where the practice is philosophically underdetermined. Write in American English, and keep it focused on the important issues.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The divergence in legal/ethical approaches to surrogacy and egg donation between Europe (mostly altruistic/banned) and the US (commercial market).
      *   **Core Questions:** What does this split presuppose about persons, bodies, or parenthood? Does Europe assume some things shouldn't be bought/sold? Does it assume women can't consent with money involved? Does the US view these as services/autonomy? Are the bans internally consistent (traveling abroad, altruistic vs. commercial)? Is prohibition necessary or are there other options (anti-exploitation/support)?
      *   **Task:** Identify where the practice is *philosophically underdetermined*.
      *   **Style:** American English.
      *   **Constraint:** Keep it focused on the important issues (avoid getting bogged down in specific national laws unless relevant to the philosophy).

  2.  **Deconstruct the Philosophical Tensions:**
      *   *Commodification vs. Autonomy:* The central clash. Europe leans towards "human dignity/body integrity" (Kantian-ish: don't treat bodies as means/objects). US leans towards "liberty/property rights" (Lockean/Market: my body, my choice, my labor).
      *   *Consent & Coercion:* Does money vitiate consent? Europe often suggests economic pressure makes "true" consent impossible for vulnerable women. US suggests adults can weigh risks/rewards.
      *   *Parenthood & Kinship:* Is parenthood biological, gestational, or intentional? Europe often privileges the gestational link (mother who births is the mother), making surrogacy legally messy. US privileges intentional parenthood (contracts enforce transfer of rights).
      *   *Internal Consistency:* The "reproductive tourism" loophole undermines the moral absolute of the bans. Altruistic vs. Commercial distinction is also philosophically shaky (is unpaid labor *more* ethical or just *more* exploitative?).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the split. State the thesis: The divergence isn't just legal; it's a clash of fundamental anthropological and ethical frameworks regarding the body and the market.

      *   **Point 1: Commodification and Human Dignity (The European View):**
          *   Focus on the idea that the body is not property.
          *   Reference the "market inalienability" concept (Margaret Radin).
          *   The fear is that turning reproduction into a service degrades human dignity.
          *   *Philosophical Underdetermination:* Why is reproductive labor different from risky industrial labor? If we allow coal mining or military service for pay, why not gestation? The distinction often rests on a specific view of the "sacredness" of reproduction that isn't universally shared.

      *   **Point 2: Autonomy and Labor (The American View):**
          *   Focus on bodily autonomy and freedom of contract.
          *   Reproduction is a service; banning payment restricts liberty and access.
          *   *Philosophical Underdetermination:* Does autonomy exist in a vacuum? If economic desperation drives the choice, is it truly autonomous? The US model often ignores the *quality* of consent in favor of the *existence* of consent.

      *   **Point 3: The Coercion/Consent Paradox:**
          *   Europe's altruistic model assumes money coerces, but does *not* paying coerce women into unpaid labor?
          *   The "altruism" requirement can be more exploitative (guilt-tripping, family pressure) than clear commercial contracts.
          *   *Philosophical Underdetermination:* There is no consensus on whether payment *enables* agency or *destroys* it.

      *   **Point 4: Internal Consistency and "Reproductive Tourism":**
          *   The loophole: Banning it at home but allowing it abroad suggests the harm isn't universal, but jurisdictional.
          *   If it's morally wrong (human trafficking/dignity violation), why is it okay for citizens to do it elsewhere?
          *   *Philosophical Underdetermination:* This reveals the bans might be about maintaining domestic social order rather than universal moral truth.

      *   **Point 5: Parenthood and Intentionality:**
          *   Europe: *Mater semper certa est* (the mother is the one who gives birth). Hard to sever.
          *   US: Intent-based parenthood.
          *   *Philosophical Underdetermination:* What makes a parent? Genetics, gestation, or intent? The law picks one, but philosophy hasn't settled it.

      *   **Conclusion:** Summarize the underdetermination. The practices aren't forced by logic; they are cultural choices. The middle ground (regulated commercialization) is often ignored.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check Tone:* Ensure it sounds analytical, not advocacy. Use American English spelling (labor, program, etc.).
      *   *Check Constraints:* Did I answer the specific questions about internal consistency and alternative models? Yes.
