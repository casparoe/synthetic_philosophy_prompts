prompt: |-
  I'm a third-year PhD student in political science and I sit on the board of a small food-rescue nonprofit — seven of us, maybe $140k a year, all volunteer. At our March meeting we have to pick between two plans for the next 18 months: keep the current model and add two more grocery-store pickups (A), or cut pickups and put the money into a paid part-time coordinator plus a refrigerated van (B). One of the other board members, whos in the econ PhD program with me, is pushing hard for us to decide this with a futarchy-style market: run two conditional markets, one on "meals delivered if we do A" and one on "meals delivered if we do B," and commit in advance to picking whichever one prices higher. He wants the commitment to be binding.

  I have to circulate the memo before the vote, and I'm the one who has to say yes or no to the market part — plus recommend something on A vs B either way, since we vote on that regardless. Can you write it? Clear recommendation with a timeline (something like "advisory-only trial for 30 days, then vote," or "don't do this, here's why"), and please take his proposal seriously instead of dunking on it.

  Stuff I don't want hand-waved:

  1) The contracts resolve partly on whether we actually adopt the plan, so the prices might be picking up our beliefs about our own vote rather than about meal counts.
  2) There are seven of us, we all know each other, and the trades would be publically visible, so I suspect we'd get signaling rather than information. Would making trades anonymous fix that, or just hide who's manipulating?
  3) Picking the metric — meals delivered, versus something like pounds of food kept out of landfill — already looks like the value judgment, so I don't see what's left for the vote to do.
  4) Is a higher price actually a reason to act, or just a forecast? I can't tell if that's a real distinction or me being precious about it.
  5) If we do say no, what should we do instead? Secret ballot on the metric up front? A pre-registered threshold?

  American English, and skip citations — I'll add those if this ever turns into anything.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in Political Science. Board member of a small food-rescue nonprofit (7 board members, $140k budget, all volunteer).
      *   **Task:** Write a memo to the board before the March meeting.
      *   **Decision:** Choose between Plan A (status quo + 2 pickups) and Plan B (cut pickups + paid coordinator + refrigerated van).
      *   **Conflict:** Another board member (Econ PhD peer) proposes using a futarchy-style prediction market to decide, with a binding commitment.
      *   **Requirements:**
          *   Clear recommendation with a timeline.
          *   Take the futarchy proposal seriously (no dunking).
          *   Address 5 specific technical concerns (endogeneity/reflexivity, small group signaling, metric selection as value judgment, forecast vs. reason to act, alternative if "no").
          *   American English, no citations.
          *   Tone: Professional, analytical, peer-to-peer (PhD level), pragmatic.

  2.  **Deconstruct the Futarchy Proposal:**
      *   *What is it?* Decision markets where shares pay out based on a metric *if* a specific policy is adopted. The policy with the highest expected metric value is chosen.
      *   *The specific proposal:* Two conditional markets ("Meals if A", "Meals if B"). Binding commitment to pick the higher price.
      *   *The constraints:* 7 board members, all volunteers, know each other, small budget ($140k).

  3.  **Address the 5 Specific Concerns (Mental Draft & Analysis):**
      *   *1) Endogeneity/Reflexivity:* The market resolves on "meals delivered *if* we adopt." But the adoption depends on the market. If I think B will win, I might trade to ensure B wins, not because I think B yields more meals. Also, if the market says B, but we *don't* pick B, the contract might not resolve cleanly. *Correction:* In standard futarchy, the contract resolves based on the metric *after* implementation. If the market decides, implementation is guaranteed. But with 7 people, if 3 hate the result, they might sabotage implementation, breaking the market.
      *   *2) Small Group/Signaling:* 7 traders is too few for a liquid market. Public trades mean social pressure. "Why did you sell shares in Plan B? Do you hate the van?" Anonymity helps privacy but doesn't fix the liquidity/incentive problem. Real money? Or play money? If play money, no skin in the game. If real money, legal/ethical issues for a nonprofit board.
      *   *3) Metric Selection:* Choosing "meals" vs. "pounds" *is* the political decision. Futarchy claims to separate values (metric) from beliefs (probability). But if we can't agree on the metric, the market is useless. If we do agree, the vote is mostly done.
      *   *4) Forecast vs. Reason to Act:* A price is a probabilistic expectation. Is $0.80 (80% chance of success?) a reason to act? Usually, futarchy maximizes *expected value*. But without real monetary incentives, the price is just an average guess. It adds no new authority than a vote, just a different aggregation method.
      *   *5) Alternatives:* If no market, how to decide? Weighted scoring? Secret ballot on the metric first? Pre-registered success criteria?

  4.  **Formulate the Recommendation:**
      *   *Verdict:* Do not use a binding futarchy market.
      *   *Why:* The overhead and structural risks outweigh the benefits for a 7-person volunteer board. The "market" won't aggregate information better than a structured discussion because the incentives aren't real and the group is too small.
      *   *Alternative:* Use a "Decision Matrix" or "Weighted Scoring" system with a secret ballot on the *criteria* first, then a vote on the plans. Or, a non-binding advisory poll (straw poll) to gauge confidence.
      *   *Timeline:* Decide metric now -> 30 days of data gathering/analysis -> Vote.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the proposal's intellectual merit (it's a serious idea from a peer). State the purpose of the memo.
      *   **Executive Summary:** Recommendation is "No" on binding market, "Yes" on structured decision framework.
      *   **Analysis of the Futarchy Proposal (Addressing the 5 points):**
          *   *Reflexivity:* The "self-fulfilling prophecy" problem. If the market predicts failure for B, we don't do B, so B fails, validating the market. But did B actually fail, or did we starve it?
          *   *Liquidity & Signaling:* 7 people isn't a market. Public trades create social friction. Anonymity hides manipulation but doesn't solve the thinness problem.
          *   *Metric Politics:* Defining "success" is the hard part. Futarchy pushes this to the front. If we solve that, do we need the market?
          *   *Forecast vs. Normative:* A price isn't a mandate. It's an expectation. We need a *decision rule*, not just a prediction.
          *   *Incentives:* Without real financial stakes (which are legally/ethically tricky for nonprofits), it's just a fancy poll.
      *   **Recommendation & Alternative:**
          *   Don't bind the board to a market mechanism.
          *   Do adopt a "Weighted Criteria" approach.
          *   Step 1: Vote on metrics (Secret ballot).
          *   Step 2: Estimate outcomes for A and B against metrics (Deliberation).
          *   Step 3: Final Vote.
      *   **Timeline:** March (Metric) -> April (Data) -> May (Decision).
      *   **Closing:** Reiterate commitment to rigor but emphasize fiduciary duty and group dynamics.

  6.  **Refining the Tone:**
      *   Ensure it sounds like a Political Scientist talking to an Economist. Use terms like "endogeneity," "aggregation," "normative," "incentive compatibility."
      *   Avoid being dismissive. Acknowledge Hanson's Futarchy logic but explain why it fails in *this* specific context (N=7, volunteer, nonprofit).
      *   Make sure the "No" is clear but constructive.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the anonymity point? *Yes, need to explicitly say anonymity doesn't fix the N=7 problem.*
      *   *Check:* Did I address the "forecast vs reason to act"? *Yes, distinguish between epistemic value and normative authority.*
      *   *Check:* Is the timeline realistic? *30 days for a trial might be too short for a market to settle, which supports the "No" argument. Let's make the alternative timeline 3 months for the decision process.*
      *   *Check:* Is the distinction between Plan A and B clear? *Yes, keep it in the background but ensure the decision framework applies to them.*

  8.  **Final Polish:** Check American spelling (program vs programme, etc.), ensure no citations are included, and verify the 5 constraints are clearly handled. (Self-correction: Ensure I don't sound *too* academic; this is a nonprofit board memo, needs to be actionable).

      *   *Refining the "Reflexivity" point:* The user mentioned contracts resolve on whether we adopt. This is the "conditional" part. If the market says "A yields 10k meals" and "B yields 8k meals," we pick A. But if the market price for B is low because people think the board *won't* pick B (and thus the contract voids or pays zero), that's a coordination failure. I need to explain this clearly.
      *   *Refining the "Metric" point:* This is the strongest argument. If we agree on "Meals," we still need to estimate meals. The market doesn't generate data, it aggregates beliefs. With 7 people, discussion aggregates beliefs better.

  9.  **Final Output Generation** (Proceeding to generate memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Nonprofit Name]
  **FROM:** [Your Name]
  **DATE:** February 24, 2024
  **SUBJECT:** Decision Framework for Strategic Plan Selection (March Vote)

  **Executive Summary**

  At our March meeting, we must select between Plan A (expanded pickups) and Plan B (coordinator + van). A proposal has been made to utilize a binding futarchy-style prediction market to make this selection. While this mechanism is theoretically robust for aggregating information in large, liquid environments, I recommend we **do not adopt a binding market** for this decision.

  The structural constraints of our organization (N=7, volunteer board, nonprofit fiduciary duties) create specific failure modes that outweigh the epistemic benefits of the market. Instead, I recommend we adopt a **Weighted Criteria Framework** with a secret ballot on metrics, followed by a standard vote on the plans.

  Below is an analysis of the market proposal addressing five specific technical concerns, followed by my recommended alternative and timeline.

  ***

  **Analysis of the Futarchy Proposal**

  I take the proposal seriously. In theory, decision markets separate values (the metric) from beliefs (the probability), allowing us to "vote on values, bet on beliefs." However, in our specific context, five implementation risks threaten to invert the mechanism's utility.

  **1. Endogeneity and Reflexivity**
  The proposal suggests contracts resolve based on outcomes *conditional* on adoption. This creates a reflexivity loop. If the market prices Plan B lower than Plan A, we commit to not adopting B. If we do not adopt B, we cannot generate the data to prove what B *would* have achieved.
  More critically, in a small group, the market price may not reflect "meals delivered" but rather "likelihood of board adoption." If traders believe the board is hesitant about the van (Plan B), they will short Plan B shares not because they think the van is inefficient, but because they think the board won't pull the trigger. The market price becomes a prediction of our own vote, not a prediction of operational success. This renders the information valueless.

  **2. Liquidity and Signaling (The N=7 Problem)**
  Prediction markets rely on liquidity and diverse incentives to wash out noise. With seven board members, we are not a market; we are a committee.
  *   **Public Trades:** If trades are visible, they become signaling devices. Selling shares in Plan A could be interpreted as a lack of confidence in the current model, creating interpersonal friction unrelated to the data.
  *   **Anonymity:** Making trades anonymous prevents social signaling but introduces opacity. In a volunteer organization, trust is our primary currency. Anonymous financial positioning on organizational strategy may erode that trust without solving the liquidity issue. There simply aren't enough participants to correct a manipulated price.

  **3. The Metric is the Decision**
  Futarchy requires us to agree on a payout metric (e.g., "meals delivered") before trading begins. However, choosing that metric is itself a normative political decision.
  If we choose "meals delivered," we prioritize scale. If we choose "pounds diverted from landfill," we prioritize waste reduction. If we choose "cost per meal," we prioritize efficiency.
  Once we vote on the metric, we have effectively already decided the strategic direction. The market then becomes a calculation exercise rather than a discovery mechanism. If we cannot agree on the metric, the market cannot launch. If we do agree, the market adds little value over a standard cost-benefit analysis.

  **4. Forecast vs. Normative Authority**
  A market price is a forecast (an *is*), not a mandate (an *ought*). In a for-profit setting, the link is share price maximization. In a nonprofit, the link is mission fulfillment.
  A higher price on Plan A indicates a higher *expected* meal count, but it does not account for risk variance. Plan B might have a lower expected mean but a higher floor (less risk of total failure). A simple price comparison hides risk profiles. Without a binding financial stake that compensates for risk tolerance, the "higher price" rule is arbitrary. We are asking the market to make a normative judgment disguised as an epistemic one.

  **5. Incentive Compatibility**
  For a market to reveal truth, participants must have skin in the game.
  *   **Play Money:** If we use points with no real value, participants will trade casually or strategically to influence the vote, not to reveal truth.
  *   **Real Money:** If we use real money, we introduce legal and ethical complications. Board members profiting (or losing) personally based on nonprofit operational decisions creates a conflict of interest that could jeopardize our 501(c)(3) status and fiduciary standing.
  Without real financial settlement, the mechanism is functionally identical to a straw poll, but with higher administrative overhead.

  ***

  **Recommendation and Alternative Framework**

  I recommend we **decline the binding market proposal** but adopt its core insight: we need to separate our agreement on *goals* from our assessment of *tactics*.

  **Proposed Alternative: Weighted Criteria Framework**
  1.  **Metric Selection (Secret Ballot):** We first vote secretly on the primary success metric (e.g., Meals vs. Waste Diverted vs. Cost Efficiency). This isolates the value judgment.
  2.  **Estimation (Deliberation):** We spend 30 days gathering data to estimate the performance of Plan A and Plan B against the chosen metric. This replaces "betting" with "research."
  3.  **Final Decision (Standard Vote):** We vote on the plans based on the agreed metric and the gathered data.

  **Timeline**

  *   **March Meeting:** Vote on the Primary Success Metric via secret ballot. (15 mins)
  *   **March 15 – April 15:** Data Gathering Period.
      *   *Action:* Contact current grocery partners for volume estimates (Plan A).
      *   *Action:* Obtain quotes for van lease/insurance and coordinator salary (Plan B).
      *   *Action:* Draft a one-page projection of "Meals per Dollar" for both plans.
  *   **April Meeting:** Review projections. No vote. Identify data gaps.
  *   **May Meeting:** Final Vote on Plan A vs. Plan B based on the agreed metric.

  **Why This Timeline?**
  A 30-day advisory trial of a market would not settle on a stable price with only seven traders; it would only highlight our disagreements. A 30-day data gathering period allows us to replace speculation with vendor quotes and historical logs, which is higher-fidelity information than a market of seven people can produce.

  **Conclusion**
  The futarchy proposal is an innovative attempt to reduce bias in our decision-making. However, the small size of our board and the volunteer nature of our roles make the mechanism prone to signaling and reflexivity rather than information aggregation. By using a secret ballot to settle the metric and a fixed timeline to gather hard data, we achieve the same separation of values and beliefs without the structural risks.

  I am happy to draft the rubric for the Weighted Criteria Framework prior to the March meeting if the board is amenable to this approach.
