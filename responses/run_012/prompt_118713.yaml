  **TRANSCONTINENTAL NEWS AGENCY (TNA)**
  **INTERNAL MEMORANDUM**

  **TO:** International Desk, Regional Bureaus, Copy Chief
  **FROM:** Office of the Standards Editor
  **DATE:** 14 October 2023
  **SUBJECT:** Usage Protocols for Mass Atrocity Classification (Ref: 99-B)

  **1.0 Determination of Specific Intent**
  1.1 Reporters shall not infer specific intent to destroy a group based solely on the scale of casualties. High mortality rates may indicate military incompetence or collateral damage rather than genocidal policy.
  1.2 Proof of intent requires a paper trail. Editors must locate a signed directive, a leaked memo, or a public speech wherein a commanding officer explicitly states the goal of elimination. Absent this documentation, the motive remains ambiguous regardless of the number of bodies observed.
  1.3 If the evidence suggests the perpetrators merely wished to displace the population rather than destroy it, the term "ethnic cleansing" is preferred. It implies force without requiring proof of finality.

  **2.0 Protected Group Eligibility**
  2.1 Per the 1948 Convention, protection extends only to national, ethnic, racial, or religious groups.
  2.2 Victims targeted due to political affiliation, social class, or economic status do not qualify for protection under this style guide, regardless of the systematic nature of their liquidation.
  2.3 Where a regime eliminates political opponents and cultural leaders simultaneously, desks must isolate the political motivation. If the primary intent appears to be regime security rather than group destruction, default to "purge" or "crackdown."

  **3.0 Accumulation of Acts**
  3.1 It is permissible to state that "acts of genocide have occurred" without stating that "genocide is occurring."
  3.2 This distinction allows the Desk to acknowledge factual realities (killings, serious bodily harm, imposed conditions of life) while withholding judgment on the overarching situation.
  3.3 If asked by external parties how many acts constitute a genocide, staff shall reply that the threshold is qualitative, not quantitative, and decline to provide a number.

  **4.0 Approved Terminology Ladder**
  Desks must ascend the following ladder only when evidentiary requirements are met. Skipping rungs requires Senior Editor approval.
  *   **Level 1:** "Violence" / "Unrest." (Default setting. Safe for all contexts.)
  *   **Level 2:** "Ethnic Cleansing." (Permitted when displacement is verified, but intent to destroy is unproven.)
  *   **Level 3:** "Crimes Against Humanity." (Permitted when acts are widespread/systematic, but specific intent to destroy a protected group is unclear.)
  *   **Level 4:** "Genocide." (Permitted only when specific intent is documented and protected group status is confirmed.)

  **5.0 Attribution and Scare Quotes**
  5.1 When third parties (NGOs, UN officials) use the Level 4 term, TNA may report their usage provided it is fully attributed.
  5.2 Example: "The High Commissioner said the situation amounts to genocide."
  5.3 Do not write: "The situation amounts to genocide, according to the High Commissioner." The former reports a statement; the latter reports a fact.
  5.4 Scare quotes are permitted when referencing the claims of advocacy groups to signal that the Desk has not independently verified the legal threshold.

  **6.0 Judicial Lag and Observation**
  6.1 The Desk acknowledges that judicial proceedings often conclude decades after the events in question.
  6.2 **Policy:** TNA will not independently classify a situation as genocide until a competent international tribunal has issued a binding verdict.
  6.3 Reporters may witness mass graves, systematic rape, and the erasure of culture years before a court validates these observations. During this interim period, staff must exercise patience. Neutrality requires waiting for the law to catch up to the evidence.

  **7.0 Authorization Chain**
  7.1 Usage of Level 3 terminology requires approval from the Regional Editor.
  7.2 Usage of Level 4 terminology requires approval from the Standards Editor, the Legal Counsel, and the Managing Editor.
  7.3 This process typically requires 48 to 72 hours. If the situation on the ground is evolving rapidly, staff shall revert to Level 1 terminology until the chain is complete.
  7.4 In the event that the Authorization Chain cannot be reached due to infrastructure collapse in the region of interest, the Desk shall default to Level 1.

  **END OF MEMO**
