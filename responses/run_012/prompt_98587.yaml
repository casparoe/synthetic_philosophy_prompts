prompt: |-
  I am a fourth-year PhD student in biostatistics, and next week I present to our department's causal-inference reading group a paper in which I argue that Simpson's reversals are not evidence of confounding but symptoms of an under-specified estimand, and I propose that an effect estimate count as admissible only if its sign is invariant under conditioning on every pre-treatment covariate that is a cause of the outcome — a criterion I call sign-stability. The room will be about a dozen people: three or four Pearl-style causal modellers who treat the back-door criterion as the complete answer, two frequentist epidemiologists who are sceptical of any appeal to counterfactuals, and one decision theorist who will want to know what any of this has to do with choosing between actions. Draft the Q&A prep sheet I actually need: the objections each of these camps will raise, in their own vocabulary, ordered by how likely and how damaging they are; for each, a two-minute reply and a note on where that reply is weakest; what I should concede up front; and the one objection I am hoping nobody asks. Do not give me a general exposition of the paradox — I know it — I need the questions this particular room will fire at this particular thesis.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** 4th-year PhD student in Biostatistics.
      *   **Context:** Presenting to a departmental causal-inference reading group.
      *   **Topic:** Arguing Simpson's reversals are *not* evidence of confounding but symptoms of an under-specified estimand. Proposing "Sign-Stability" (effect sign invariant under conditioning on *every* pre-treatment covariate that is a cause of the outcome) as a criterion for admissibility.
      *   **Audience:**
          *   3-4 Pearl-style causal modellers (DAGs, back-door criterion, structural causal models).
          *   2 Frequentist Epidemiologists (Sceptical of counterfactuals, focus on study design, bias analysis).
          *   1 Decision Theorist (Focus on utility, actions, consequences).
      *   **Deliverable:** A Q&A prep sheet.
      *   **Requirements:**
          *   Objections in each camp's vocabulary.
          *   Ordered by likelihood and damage.
          *   Two-minute reply for each.
          *   Note on where the reply is weakest.
          *   What to concede up front.
          *   The one objection hoped nobody asks.
          *   *Constraint:* No general exposition of Simpson's Paradox (user knows it). Focus on the specific thesis.

  2.  **Deconstruct the Thesis ("Sign-Stability"):**
      *   *Claim:* Simpson's reversal $\neq$ confounding necessarily. It means the estimand is vague.
      *   *Criterion:* An estimate is admissible only if $\text{sign}(E[Y|do(X), Z=z])$ is constant for all pre-treatment $Z$ that cause $Y$.
      *   *Potential Flaws:*
          *   Colliders? (User says "pre-treatment covariate that is a cause of the outcome". This usually implies confounders, but could include instruments or precision variables).
          *   Efficiency vs. Validity?
          *   What if the sign *should* change? (Effect modification).
          *   What if no such estimate exists? (All estimates flip sign depending on $Z$).
          *   Relationship to Back-Door? (Pearl people will say Back-Door already solves this).
          *   Decision relevance? (Does sign stability maximize utility?).

  3.  **Drafting Objections by Camp:**

      *   **Pearl-Style Causal Modellers:**
          *   *Core Belief:* Causal structure (DAG) identifies the adjustment set. Back-door is sufficient and necessary.
          *   *Objection 1:* "Back-door already solves this. Why do we need Sign-Stability?" (High likelihood, high damage).
          *   *Objection 2:* "What about colliders? Your definition of 'pre-treatment cause of outcome' is risky." (Medium likelihood, high damage).
          *   *Objection 3:* "Effect modification exists. Signs *should* change across strata." (High likelihood, critical).

      *   **Frequentist Epidemiologists:**
          *   *Core Belief:* Focus on bias, variance, study design. Counterfactuals are metaphysical.
          *   *Objection 1:* "This is just testing for interaction. Why rename it?" (High likelihood, medium damage).
          *   *Objection 2:* "Over-adjustment bias. Conditioning on *every* cause of outcome includes instruments." (High likelihood, high damage).
          *   *Objection 3:* "Finite sample properties? Sign stability is asymptotic." (Medium likelihood).

      *   **Decision Theorist:**
          *   *Core Belief:* What action do I take? What is the loss function?
          *   *Objection 1:* "If signs differ, the optimal action depends on $Z$. Sign-stability hides the information needed to decide." (High likelihood, high damage).
          *   *Objection 2:* "Cost of measurement. Conditioning on *every* cause is expensive." (Medium likelihood).

  4.  **Refining the "Sign-Stability" Criterion (Critical Step):**
      *   The prompt says: "invariant under conditioning on every pre-treatment covariate that is a cause of the outcome."
      *   *Major Red Flag:* Conditioning on *every* cause of the outcome includes Instrumental Variables (IVs). Conditioning on an IV increases variance and can introduce bias in finite samples (collider bias if there's unmeasured confounding).
      *   *Major Red Flag 2:* Effect Modification. If treatment works for men ($+$) and women ($-$), the marginal effect might be 0. Sign stability would reject this estimand, but the heterogeneity is the *real* story.
      *   *Strategy:* I need to help the user defend this, but also point out where they will get crushed so they can prepare. The prompt asks for "where that reply is weakest."

  5.  **Developing the Q&A Prep Sheet:**

      *   *Concessions:* Need to admit that effect modification is real and that "every cause" might need refinement (e.g., confounders only).
      *   *The "Hope Nobody Asks" Question:* Probably about the case where *no* adjustment set yields sign stability (the "all estimates flip" scenario), or the connection to utility/loss functions. Let's go with the "No Stable Sign Exists" scenario, as it invalidates the criterion's usability.

      *   *Drafting Responses:*
          *   Keep them tight (2 mins).
          *   Use their jargon (DAGs, bias functions, loss functions).
          *   Identify weaknesses honestly.

  6.  **Review against Constraints:**
      *   No general exposition? Check.
          *   Specific to the thesis? Check.
          *   Ordered by likelihood/damage? Check.
          *   Two-minute replies? Check.
          *   Weakest point noted? Check.
          *   Concessions? Check.
          *   "Hope nobody asks"? Check.

  7.  **Polishing the Tone:**
      *   The user is a 4th-year PhD. Tone should be professional, academic, slightly defensive but open.
      *   The advice needs to be sharp. "Sign-Stability" is a controversial take (essentially arguing against standard adjustment criteria). I need to make sure the user knows *why* it's controversial.
      *   *Self-Correction on "Every Cause of Outcome":* This is the weakest link. Pearl people will scream "Colliders/Instruments". Epi people will scream "Over-adjustment". I must highlight this in the objections.

  8.  **Finalizing the Content (Mental Simulation):**
      *   *Pearl Person:* "If you condition on an instrument, you open bias paths." -> *Reply:* "I mean common causes." -> *Weakness:* Definition of "cause".
      *   *Epi Person:* "This is just interaction." -> *Reply:* "It's about estimand definition, not model specification." -> *Weakness:* Semantic hair-splitting.
      *   *Decision Person:* "I need to know *who* benefits." -> *Reply:* "Stability ensures robust policy." -> *Weakness:* Ignores heterogeneous treatment effects (HTE).

      *   *Wait, one crucial nuance:* The user says "pre-treatment covariate that is a cause of the outcome." In DAG terms, parents of $Y$. This includes $X$ (treatment), Confounders, Instruments, and Precision variables. It *excludes* colliders (usually). But conditioning on Instruments is generally bad for variance and can bias in non-collapsible models (like logistic). I need to make sure the objections reflect this.

      *   *Refining the "Sign Stability" definition:* If the sign flips due to effect modification, the criterion fails. The user needs to distinguish between "confounding-induced reversal" and "effect-modification-induced reversal." The prompt implies they treat *all* reversals as under-specified estimands. This is the most attackable point.

      *   *Decision Theorist:* If the sign flips by $Z$, the optimal decision is $d(X, Z)$. If you force sign stability, you might be averaging over $Z$ and making the wrong decision for subgroups. This is a killer objection.

      *   *The "Hope Nobody Asks":* "What do I do if *no* covariate set satisfies sign stability?" (i.e., The true effect is heterogeneous).

  9.  **Final Polish:** Organize clearly with headers. Ensure the "Weakest Point" is brutally honest. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't talk down to the user. They are a 4th-year PhD. They know the math. They need strategic advice on the *rhetoric* and *defense*.

  *(Final check on the "Sign-Stability" criterion)*: "invariant under conditioning on every pre-treatment covariate that is a cause of the outcome".
  If $Z$ is an instrument (causes $X$, causes $Y$ only through $X$), it is *not* a cause of $Y$ directly. So maybe instruments are excluded?
  If $Z$ is a confounder (causes $X$ and $Y$), it is a cause of $Y$.
  If $Z$ is a precision variable (causes $Y$ only), it is a cause of $Y$.
  Conditioning on precision variables is fine for confounding but changes the estimand (CATE vs ATE) in non-collapsible models. This is a huge trap for biostatisticians (odds ratios etc.). I must include this in the Epi/Biostat objections.

