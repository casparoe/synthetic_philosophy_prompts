answer: |-
  # Q&A Prep Sheet: Sign-Stability & Simpson's Reversals
  **Presenter:** 4th-Year PhD Candidate (Biostatistics)  
  **Audience:** Mixed Causal/Epi/Decision Theory  
  **Thesis Core:** Simpson's reversal = under-specified estimand. Admissibility requires sign invariance across all pre-treatment causes of $Y$.

  ---

  ## 1. Pre-emptive Concessions (Say these *before* Q&A)
  *Do not wait to be cornered. Disarm the room by acknowledging the boundaries of your claim.*

  1.  **On Effect Modification:** "I am distinguishing between *structural* sign reversals (confounding) and *heterogeneous* sign reversals (effect modification). My criterion targets the former. If the sign flips because the mechanism differs by subgroup, that is a specified estimand (CATE), not an under-specified one (ATE)."
  2.  **On 'Every Cause':** "When I say 'cause of the outcome,' I am restricting this to **common causes** of treatment and outcome (confounders) and **direct causes** of the outcome that are not mediators. I am not advocating conditioning on instruments."
  3.  **On Collapsibility:** "I acknowledge that in non-collapsible models (e.g., logistic), conditioning on precision variables changes the marginal parameter. My claim applies primarily to collapsible scales (RD, RM) or assumes we are comparing structural parameters, not raw coefficients."

  ---

  ## 2. Objections by Camp (Ordered by Likelihood & Damage)

  ### Camp A: Pearl-Style Causal Modellers (3-4 people)
  *Vocabulary: DAGs, d-separation, back-door, structural assumptions, identification.*

  **Objection 1: "The Back-Door Criterion Already Solves This"**
  *   **Likelihood:** Very High | **Damage:** High
  *   **The Question:** "If you have the correct DAG, the back-door criterion tells you exactly which set to condition on to identify the causal effect. Why do we need a 'sign-stability' heuristic? Isn't this just a computational check for whether you've blocked all back-door paths?"
  *   **2-Minute Reply:** "The back-door criterion assumes we *know* the DAG. In practice, the DAG is the under-specified part. Sign-stability is a sensitivity analysis for structural uncertainty. If the sign flips when conditioning on a plausible pre-treatment cause, it indicates the DAG specification (specifically the confounding structure) is not robust. It's not a replacement for identification; it's a diagnostic for specification searching."
  *   **Weakest Point:** They will argue that if the DAG is wrong, sign-stability might validate a biased estimate (e.g., if you miss a confounder that doesn't flip the sign). You are offering a *necessary* condition, not a *sufficient* one, but it sounds like you're selling it as a shield.

  **Objection 2: "Conditioning on Instruments/Colliders"**
  *   **Likelihood:** High | **Damage:** Critical
  *   **The Question:** "You said 'every pre-treatment covariate that is a cause of the outcome.' That includes instrumental variables and variables that become colliders if there's unmeasured confounding. Conditioning on an instrument increases variance and can induce bias in finite samples. Are you advocating over-adjustment?"
  *   **2-Minute Reply:** "That is why I conceded 'common causes' earlier. An instrument causes $Y$ only *through* $X$. I am referring to variables with a direct arrow into $Y$ independent of $X$. If a variable is a pure instrument, it is excluded from the sign-stability set. The criterion is about robustness to confounder selection, not exhaustive conditioning."
  *   **Weakest Point:** Your definition in the abstract ("cause of the outcome") technically includes instruments in some structural definitions. They will pin you on the semantic definition of "cause."

  ### Camp B: Frequentist Epidemiologists (2 people)
  *Vocabulary: Bias analysis, confounding control, precision, interaction, study design.*

  **Objection 3: "This is Just Testing for Interaction"**
  *   **Likelihood:** Very High | **Damage:** Medium
  *   **The Question:** "If the sign changes when you condition on $Z$, that's effect modification (interaction). We already test for this. Why rebrand interaction testing as 'estimand under-specification'?"
  *   **2-Minute Reply:** "Interaction implies the effect *is* different. Simpson's paradox implies the effect *appears* different due to aggregation bias. If the sign flips upon adjustment, we usually call it 'confounding.' I'm arguing that if it flips, the marginal estimand was never well-defined to begin with. It forces the epidemiologist to decide: is $Z$ a confounder or an effect modifier? You cannot treat it as noise."
  *   **Weakest Point:** In practice, the line between "confounding" and "effect modification" is often a modeling choice. They will argue you're solving a semantic problem, not a statistical one.

  **Objection 4: "Non-Collapsibility & The Odds Ratio"**
  *   **Likelihood:** Medium | **Damage:** High
  *   **The Question:** "You're in Biostatistics. You know that for odds ratios, the adjusted and unadjusted estimates differ even without confounding. Your sign-stability criterion would reject valid logistic models simply due to non-collapsibility. Is your criterion restricted to linear models?"
  *   **2-Minute Reply:** "Valid point. Sign-stability is strictly defined on the scale of the estimand. If the estimand is the Odds Ratio, we must acknowledge non-collapsibility. However, my argument is that if the *direction of association* flips on the risk difference scale (which is collapsible), that is a structural issue. I am willing to restrict the admissibility criterion to collapsible scales for the sake of this argument."
  *   **Weakest Point:** This limits the applicability of your thesis significantly. Most biostats work with GLMs. Conceding this makes your method look like a toy for linear regression.

  ### Camp C: The Decision Theorist (1 person)
  *Vocabulary: Utility, loss functions, actions, regret, policy.*

  **Objection 5: "Sign Stability Hides Optimal Action"**
  *   **Likelihood:** High | **Damage:** Critical
  *   **The Question:** "Suppose the treatment helps men (+) and harms women (-). The marginal effect is 0. Your criterion says this estimand is 'inadmissible' because the sign isn't stable across Sex. But if I'm a policymaker, I need to know I should treat men and not women. By demanding sign stability, aren't you forcing me to ignore the heterogeneity required for optimal decision-making?"
  *   **2-Minute Reply:** "No, I'm forcing you to *specify* the decision context. If the optimal action depends on $Z$, then the estimand must be $E[Y|do(X), Z]$, not $E[Y|do(X)]$. My criterion rejects the *marginal* estimand as admissible for decision-making in that context. It forces the analyst to move to the CATE. It prevents you from applying a marginal 'average' policy to a heterogeneous population."
  *   **Weakest Point:** They will argue that sometimes we *must* act on marginals (e.g., a single drug approval for a population). Your criterion might block useful marginal information by labeling it 'inadmissible.'

  ---

  ## 3. The "Hope Nobody Asks" Question
  *This is the scenario that breaks your thesis.*

  **The Question:** "What if **no** adjustment set yields sign stability?"
  *   **Context:** Suppose you condition on all plausible confounders, and the sign *still* flips depending on which subset you use, or the sign is positive in some strata and negative in others (true heterogeneity).
  *   **Why it's deadly:** Your criterion renders the effect estimate **inadmissible**. If *no* estimate is admissible, you have provided a method to reject all conclusions but no method to find a valid one. It leads to causal paralysis.
  *   **If asked:** "Then the data and current structural knowledge are insufficient to support a directional claim. We should report the range of signs as part of the uncertainty, rather than hiding it behind a single point estimate. It's better to report 'indeterminate direction' than a biased 'significant' finding."
  *   **Preparation:** Have a slide ready showing a DAG where sign stability fails (e.g., unmeasured confounding + effect modification) and state clearly: "In this case, my method says 'do not decide based on sign'."

  ---

  ## 4. Strategic Notes for the Room
  1.  **Don't fight the DAG people on identification.** They are right that Back-Door identifies the effect. Your argument is about *specification robustness*, not identification. Keep that distinction sharp.
  2.  **Don't fight the Epi people on interaction.** Agree that effect modification is real. Frame your criterion as a "gatekeeper" that forces the analyst to check for modification before claiming a marginal effect.
  3.  **Watch the Decision Theorist.** They are the wildcard. If you convince them that "inadmissible" means "do not use for marginal policy," you win their support. If they think you mean "do not use at all," you lose.

  **Final Tip:** When in doubt, retreat to **Collapsible Scales** and **Confounders**. Do not let the definition of "Cause of Outcome" drift into Instruments or Mediators during the Q&A.
