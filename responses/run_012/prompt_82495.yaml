answer: |-
  ### Essay Question

  **Time Allowed:** 90 minutes
  **Marks:** 20
  **Instructions:** Closed book. No internet. No citations required.

  **Prompt:**
  Consider two hypothetical regimes. **Case A:** A government wins a genuinely clean election, then uses its majority to rewrite rules (courts, media, administration) making future defeat harder. The opposition subsequently wins a landslide and implements identical changes, claiming they are "restoring democracy." **Case B:** A country begins semi-authoritarian; institutions are already weak, so subsequent erosions are minor because there was little democratic depth to lose.

  Using these cases, dissect the concept of "democratic backsliding." Specifically:
  1.  Separate the **baseline** (where you slide from), the **measuring stick** (what counts as damage), and the **judge** (who decides).
  2.  Does the complaint that backsliding is "just a partisan label" bite on all three elements, or only one?
  3.  Is labeling this an "essentially contested concept" a substantive answer or a shrug in a nicer jumper?
  4.  Does Case A or B suggest "backsliding" is the wrong word? If so, what term fits better, and what analytical work does that new term do?

  ***

  ### Model Answer

  "Democratic backsliding" implies a directional decline from a established norm. However, the term often conceals three distinct analytical problems: the baseline (the starting point), the measuring stick (the metric of decline), and the judge (the arbiter of legitimacy). The hypothetical cases provided reveal that conflating these three renders the concept analytically useless.

  Case A destabilizes the **judge** and the **measuring stick**. If both the incumbent and the opposition utilize identical institutional weaponization, the act itself cannot be the sole metric of backsliding; otherwise, both parties are simultaneously sliding, which is logically incoherent. If the opposition claims restoration while employing the same tools, the measuring stick shifts from *procedure* (rule changes) to *intent* (democratic preservation). This makes the concept vulnerable to the "partisan label" charge. If the judge is simply the observer's political preference, then "backsliding" is not a diagnostic tool but a pejorative. However, this charge does not necessarily bite on the **baseline**. Even in Case A, if the baseline is defined as "uncertain electoral outcomes," both parties are violating it. The partisanship lies in who gets to define the baseline, not necessarily in the observation of the slide itself.

  Case B challenges the **baseline**. If a regime begins semi-authoritarian, can it "backslide"? Technically, no; it can only consolidate or stagnate. Using "backsliding" here implies a democratic teleology that doesn't exist. This suggests the concept requires a threshold condition: you cannot slide from the floor. If we insist on using the term for Case B, we are smuggling in a normative claim that the country *should* have been democratic. This confirms that "backsliding" is not a neutral description of change but a normative judgment about trajectory relative to an ideal type.

  This leads to the charge of the "essentially contested concept." Calling backsliding contested is not a shrug if it acknowledges that the struggle over the definition is part of the political conflict itself. In Case A, the opposition calling their actions "restoration" while the incumbent calls them "reform" is the political battle. Recognizing the concept as contested explains why agreement is impossible. However, it becomes a shrug if it stops analysis there. Simply saying "democracy is contested" does not help us distinguish between Case A's reciprocal entrenchment and Case B's low-level stagnation. We need operational clarity, not just philosophical resignation.

  Therefore, "backsliding" is likely the wrong word for comparative work because it presumes a prior democratic peak. For Case A, **"institutional weaponization"** is superior. It describes the mechanism (using state tools for partisan gain) without presuming a directional slide from a democratic ideal. It allows us to see that both parties are doing the same thing, regardless of who holds power. For Case B, **"authoritarian consolidation"** fits better. It acknowledges the starting point without implying a fall from grace.

  Shifting terminology changes the analytical work. "Backsliding" asks: *How far have they fallen?* "Weaponization" asks: *How are institutions being used?* The former focuses on status; the latter focuses on behavior. If we adopt "weaponization," Case A becomes a study of symmetric degradation, not a puzzle about who is the democrat. If we adopt "consolidation," Case B becomes a study of regime type stability, not a failed transition.

  Ultimately, the "partisan label" complaint bites hardest on the **judge**, but bleeds into the **measuring stick** when norms are contested. The baseline remains the most objective element, provided it is defined procedurally (e.g., turnover capacity) rather than normatively. Dismissing the concept as contested is useful only if it prompts us to specify which conception is being fought over. Otherwise, it obscures the mechanical reality of institutional decay.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Deconstruction of the Triad (4 marks)**
  *   **Requirement:** Explicitly distinguishes between baseline (starting point), measuring stick (metric), and judge (arbiter).
  *   **Common Botch:** Students conflate the measure with the judge, treating "who decides" as the same thing as "what counts."

  **2. Analysis of Case A (Reciprocal Entrenchment) (4 marks)**
  *   **Requirement:** Identifies that symmetric behavior challenges the "partisan label" claim regarding the measure/judge.
  *   **Common Botch:** Students assume the opposition's actions are inherently defensive rather than analyzing the structural symmetry.

  **3. Analysis of Case B (Low Baseline) (4 marks)**
  *   **Requirement:** Recognizes that "backsliding" is logically impossible without a democratic baseline/threshold.
  *   **Common Botch:** Students argue Case B is still backsliding relative to a global average rather than the internal baseline.

  **4. Evaluation of "Partisan Label" Claim (4 marks)**
  *   **Requirement:** Argues whether the complaint applies to all three elements or specific ones (usually judge/stick, not baseline).
  *   **Common Botch:** Students assert it is entirely partisan or entirely objective without nuance.

  **5. Evaluation of "Essentially Contested Concept" (4 marks)**
  *   **Requirement:** Determines if this label is analytically useful or an evasion ("shrug"), linking back to terminology.
  *   **Common Botch:** Students treat "essentially contested" as a magic phrase that ends the argument rather than starting it.

  ***

  ### Don't Reward This

  *   **Index Dropping:** Mentioning V-Dem, Freedom House, Polity IV, or specific scores (e.g., "a 5-point drop").
  *   **Real-World Substitution:** Ignoring the hypotheticals to write about Orban, Erdogan, or Trump instead.
  *   **Label Sticking:** Asserting a case is a "hybrid regime" or "competitive authoritarian" without explaining how that label interacts with the "backsliding" concept.
  *   **Definitional Dumping:** Reciting Levitsky/Ziblatt definitions without applying them to the specific logical problems in Case A or B.
  *   **Moralizing:** Arguing based on whether the actions are "good" or "bad" rather than their conceptual classification.

  ***

  Bottom line: Top answers treat 'backsliding' as the object of scrutiny rather than the lens of analysis.
