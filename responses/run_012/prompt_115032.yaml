      *   The tension is between *Historical Verisimilitude* (showing the past as it was) and *Ethical Legibility* (ensuring the reader understands the moral landscape without being alienated or misled).
      *   The writer knows the traps: exoticizing cruelty vs. sanitizing history.
      *   The solution needs to be a filter that tests the *function* of the objectionable element within the narrative economy.

  3.  **Drafting the Procedure (The "Filter"):**
      *   Needs to be quick (middle of a working day).
      *   Needs to distinguish between *background noise* (ordinary life) and *foreground signal* (plot/theme).
      *   *Step 1: Necessity.* Is this detail doing work?
      *   *Step 2: Perspective.* Who is looking at this?
      *   *Step 3: Consequence.* Does the narrative punish or reward this?
      *   *Step 4: Friction.* Is there internal dissent?
      *   *Step 5: The Reader's Contract.* What am I asking the reader to feel?
      *   *Marking Judgment Calls:* I need to explicitly flag where the writer's intuition overrides the "rule."

  4.  **Developing the Three Test Scenes:**

      *   *Scene 1: The Flogging.* (Protagonist orders lawful flogging of unseen servant).
          *   *Goal:* Maintain love for protagonist but acknowledge the act.
