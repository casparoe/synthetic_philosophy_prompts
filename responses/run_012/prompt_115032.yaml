      *(Self-Correction during drafting Scene 2)*: Comedy is tricky. If the charm is the vehicle for the prejudice, the procedure should flag that the charm is weaponized. The unwelcome answer here could be: "The humor relies on the reader colluding in the prejudice. Cut it."

