          *   *Procedure Outcome:* Likely needs to be framed through the protagonist's internal cost or bureaucratic numbness, not sadism. If it's casual, it might break the "love" contract. *Hard truth:* You might have to cut the "love" or make the flogging haunt him. Let's aim for the hard truth: If he does it casually, the reader *shouldn't* love him anymore, or the scene must show the cost.
      *   *Scene 2: Comic/Religious Minority.* (Charming character mocks minority).
          *   *Goal:* Keep the humor, avoid hate speech.
          *   *Risk:* The charm masks the cruelty.
          *   *Procedure Outcome:* Humor based on superiority is risky. If the joke relies on the minority's inferiority, it fails. If it relies on the *absurdity of the prejudice* or the *character's blind spot*, it might work. *Hard truth:* If the joke lands *on* the minority, cut it.
      *   *Scene 3: Contested Practice.* (Character knowingly on wrong side of live argument).
          *   *Goal:* Show moral agency/fault.
          *   *Risk:* Making them a villain too early or excusing them.
          *   *Procedure Outcome:* This is where the procedure shines. It requires showing the *choice*.
          *   *Hard Truth:* This scene defines the book's moral center. If the character chooses cruelty knowingly, they are complicit, not just a product of their time.

  5.  **Addressing the Meta-Question:**
      *   "Should this book exist?"
      *   The procedure cannot answer this. Only the writer can. The procedure only ensures the *execution* matches the *intent*.
      *   I need to be honest: A tool for craft cannot answer a question of purpose.

