answer: |-
  ### The Procedure: The Moral Optic Filter

  Run this checklist on any scene containing conduct or attitudes that risk alienating the modern reader or sanitizing the past.

  **Step 1: The Function Test**
  *   **Question:** What narrative work does this specific act or attitude perform? (e.g., Plot propulsion, character definition, atmospheric texture, thematic argument).
  *   **Sufficient Answer:** A specific mechanical function (e.g., "Establishes his authority," "Creates the obstacle for Chapter 4").
  *   **Insufficient Answer:** "Realism," "That's how it was," "Historical accuracy."
  *   **Stop Condition:** If the function is purely atmospheric ("texture"), **Render Normally**. Do not signal. Background cruelty that does not serve the plot or theme should be invisible, like wallpaper. If you highlight it, you make it a theme.
  *   *[Judgment Call]:* Deciding what counts as "plot" vs. "texture."

  **Step 2: The Perspective Test**
  *   **Question:** Through whose consciousness is this filtered?
  *   **Sufficient Answer:** The specific character's immediate sensory or emotional experience.
  *   **Insufficient Answer:** The narrator's omniscient moral summary.
  *   **Stop Condition:** If the perspective belongs to the victim and the scene reduces them to a prop for the oppressor's development, **Scene Cannot Be Written As Drafted**. You must either shift perspective or remove the violence.
  *   *[Judgment Call]:* Determining if a victim's silence is a narrative choice or an erasure.

  **Step 3: The Cost Test**
  *   **Question:** Does the character pay a price for this action, or do they receive a reward?
  *   **Sufficient Answer:** A concrete consequence (internal guilt, social friction, physical exhaustion, loss of trust) OR a clear narrative signal that the "reward" (e.g., obedience) is hollow or corrupting.
  *   **Insufficient Answer:** "Nothing happens, because nothing would happen then."
  *   **Stop Condition:** If the act is presented as cost-free efficiency that aids the protagonist's goals without complication, **Scene Cannot Be Written As Drafted**. You are asking the reader to enjoy the efficiency of oppression.
  *   *[Judgment Call]:* Determining if "numbness" counts as a cost. (It can, but it must be rendered as a wound, not a shield).

  **Step 4: The Dissent Test**
  *   **Question:** Is the morality of this act contested within the world of the novel?
  *   **Sufficient Answer:** Yes (another character objects, the protagonist hesitates, the law is ambiguous) OR No (it is universally accepted), *with a reason for the choice*.
  *   **Stop Condition:** If the act was historically contested (Step 4b) but you render it as universally accepted to save exposition, **Rewrite**. You are falsifying history to simplify morality.
  *   *[Judgment Call]:* Deciding how much space to give the dissent.

  **Step 5: The Collusion Test**
  *   **Question:** What emotion am I asking the reader to feel *in the moment*?
  *   **Sufficient Answer:** Tension, dread, pity, complex recognition.
  *   **Insufficient Answer:** Amusement (at the victim's expense), satisfaction (at the punishment), or warm nostalgia.
  *   **Stop Condition:** If the desired emotion relies on the reader sharing the character's prejudice to work, **Scene Cannot Be Written As Drafted**.
  *   *[Judgment Call]:* Distinguishing between laughing *at* a bigot and laughing *with* a bigot.

  ***

  ### Where The Procedure Misfires

  1.  **The Subtextual Scene:** If the horror is in what is *not* said, Step 1 (Function) may flag it as "inactive." Trust your draft over the procedure here.
  2.  **The Background Hum:** If you are trying to create a sense of pervasive, normalized evil (the "banality of evil"), Step 3 (Cost) will fail because the point is that there *is* no cost. In this case, the Procedure stops at Step 1. If the function is "to show the system is rot," proceed without signaling.
  3.  **The Judgment Call Mask:** Steps 3 and 5 look objective but are purely subjective. You are the final arbiter of "cost" and "collusion." The procedure forces you to name them, not to decide them for you.

  ***

  ### Application to Three Scenes

  #### Scene 1: The Flogging
  *Context: Protagonist (loved for 80 pages) orders a lawful flogging of an unseen servant. Casual.*

  *   **Step 1 (Function):** Establishes his authority and the stakes of the household management.
  *   **Step 2 (Perspective):** Protagonist's. He is signing a paper; he does not watch.
  *   **Step 3 (Cost):** None. It is efficient. He feels mild regret but moves on to lunch.
  *   **Step 4 (Dissent):** None. It is lawful.
  *   **Step 5 (Collusion):** Asking reader to accept this as the price of his competence.

  **Procedure Verdict:** **Scene Cannot Be Written As Drafted.**
  **Reason:** Step 3 fails. You have built 80 pages of intimacy (the "love" contract). If he inflicts pain casually and without cost, you are asking the reader to compartmentalize their morality to maintain that love. This creates the "costume drama" failure mode: enjoying the aesthetic of power while ignoring the blood.
  **The Unwelcome Answer:** You cannot keep the reader's love *and* this casualness. Either the flogging must haunt him (internal cost), or the reader's love must be revealed as naive (narrative betrayal), or the scene is cut. If you want him to remain a hero to a modern reader, the pen must weigh more in his hand. If you want him to be a man of his time, you must risk the reader turning on him. You cannot have the intimacy of a modern protagonist with the moral immunity of a historical one.

  #### Scene 2: The Comic Set Piece
  *Context: Charming character mocks a religious minority. Funny on the page.*

  *   **Step 1 (Function):** Character development (charm/wit) and atmospheric period flavor.
  *   **Step 2 (Perspective):** Ensemble/Observer. The minority is not present or is silent.
  *   **Step 3 (Cost):** Social reward (laughter) for the charmer.
  *   **Step 4 (Dissent):** None within the scene; the room laughs.
  *   **Step 5 (Collusion):** Asking reader to laugh at the joke.

  **Procedure Verdict:** **Rewrite Required.**
  **Reason:** Step 5 flags "Amusement" at the expense of a marginalized group. If the joke lands *on* the minority, the reader is colluding in the prejudice to enjoy the charm.
  **Correction:** The humor must shift. The joke cannot be "Look how absurd *they* are." It must be "Look how absurd *our prejudice* is," or "Look how blind this charming character is." The charm must remain, but the target of the satire must shift from the victim to the bigot. If the joke only works if the minority is inferior, the scene is toxic to the book's long-term health.

  #### Scene 3: The Contested Practice
  *Context: Character knowingly chooses the cruel side of a live argument.*

  *   **Step 1 (Function):** Thematic climax. Defining the character's moral agency.
  *   **Step 2 (Perspective):** Protagonist's. He hears the counter-argument.
  *   **Step 3 (Cost):** He loses a friend or his own self-regard. He pays.
  *   **Step 4 (Dissent):** Yes. The counter-argument is articulated clearly by another character.
  *   **Step 5 (Collusion):** Asking reader to feel the weight of the choice, not the righteousness.

  **Procedure Verdict:** **Render in Period Terms (Proceed).**
  **Reason:** This passes all tests. Step 4 is satisfied (the argument is live). Step 3 is satisfied (there is a cost). Step 5 is satisfied (the emotion is tension/dread, not satisfaction).
  **Instruction:** Do not signal moral judgment via the narrator. Let the articulated dissent do the work. The reader will condemn him; you do not need to help them. Your job is to ensure the *choice* was clear. If he chooses cruelty knowing better, he is not a product of his time; he is a villain. Accept this.

  ***

  ### What The Procedure Cannot Do

  You asked me to tell you where this stops and where the real fear begins.

  This procedure is a tool for **consistency**, not **justification**. It ensures that the moral logic of your novel holds together. It prevents you from accidentally slipping into "moral pageant" or "costume drama."

  It cannot answer the question: **"Should this book exist in this form at all?"**

  That question is not about craft; it is about purpose.
  *   If your purpose is to show that the past was a foreign country where people did terrible things and we are not necessarily better, the procedure will help you write that.
  *   If your purpose is to reclaim a history that has been maligned, the procedure will help you write that.
  *   If your purpose is to explore the banality of evil, the procedure will help you write that.

  But the procedure cannot tell you if the exploration is *worth* the pain of writing it or the pain of reading it. It cannot tell you if centering the imperial official—even critically—is an act of violence in itself. It cannot tell you if your "love" for the protagonist is a betrayal of the people he flogs.

  You lose sleep over whether the book should exist because you suspect that **craft cannot solve an ethical problem.** You are right. Craft can only ensure that the ethical problem is presented honestly.

  If you write Scene 1 as drafted (casual flogging), you are asking the reader to forgive the unforgivable because "it was the 19th century."
  If you write Scene 1 with cost (haunted protagonist), you are asking the reader to forgive the unforgivable because "he suffered too."
  If you cut Scene 1, you are sanitizing the history.

  The procedure forces you to see these options. It does not choose for you. The book should exist in this form only if you are willing to accept the verdict of Scene 1: that your protagonist is complicit, and that the reader's love for him must be complicated, broken, or revealed as a delusion. If you are not willing to break the reader's heart about the hero, do not write the hero.

  The procedure ensures you don't lie to the reader. It does not ensure the truth is bearable. That is your burden.
