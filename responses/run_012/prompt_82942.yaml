answer: |-
  Your gut is running on **Cumulative Prospect Theory (CPT)**.

  This is the dominant descriptive model in behavioral economics (developed by Kahneman and Tversky) specifically designed to explain the exact cluster of preferences you listed. Standard Expected Utility Theory (EUT) cannot fit these five verdicts simultaneously without implying absurd levels of risk aversion. Prospect Theory can fit all five choices, but it comes with a cost to normative consistency.

  Here is the precise breakdown of the principle, how it maps to your cases, the answer to your Rabin question, and the one verdict you should sacrifice.

  ### The Principle: Cumulative Prospect Theory

  Your decision-making is governed by three specific mechanisms that deviate from standard rationality:

  1.  **Reference Dependence:** You evaluate outcomes as **gains and losses** relative to a reference point (usually your current status quo), not as final wealth states.
  2.  **Loss Aversion & Diminishing Sensitivity (The Value Function):**
      *   The value function is **concave for gains** (you are risk-averse when winning).
      *   The value function is **convex for losses** (you are risk-seeking when losing).
      *   The function is **steeper for losses** than gains (a loss of $100 hurts more than a gain of $100 feels good).
  3.  **Probability Weighting:** You do not treat probabilities linearly. You overweight small probabilities and underweight moderate-to-high probabilities. Crucially, you treat a drop from 100% to 90% as much more significant than a drop from 45% to 40.5%.

  ### Mapping Your Verdicts to the Mechanism

  *   **Case 1 ($5k sure vs 90% $6k): Risk Aversion + Certainty Effect.**
      *   *Mechanism:* Probability Weighting. In CPT, the weight of a 100% probability is 1.0, but the weight of a 90% probability is often psychologically discounted to something like 0.8. The "certainty" of the $5k is disproportionately valuable compared to the 90% shot, even though the EV is lower.
  *   **Case 2 (45% $5k vs 40.5% $6k): Risk Seeking.**
      *   *Mechanism:* Probability Weighting. When certainty is removed, the weighting function becomes more linear. The ratio between 45% and 40.5% feels closer to the mathematical ratio than 100% vs 90% does. Since the Value Function is concave but not *extremely* so, the higher Expected Value ($2,430 vs $2,250) wins once the "certainty premium" is removed.
      *   *Note:* This reversal (Case 1 vs Case 2) is the **Allais Paradox**. It violates the Independence Axiom of Expected Utility.
  *   **Case 3 ($50 sure vs 90% $60): Risk Neutral/Seeking.**
      *   *Mechanism:* Diminishing Sensitivity. The Value Function is steeper near the origin. The difference in subjective value between $50 and $60 is small compared to the difference between $5,000 and $6,000. At low stakes, you approximate risk neutrality; at high stakes, concavity kicks in.
  *   **Case 4 (50/50 -$100/+$120 vs -$100/+$10k): Loss Aversion.**
      *   *Mechanism:* The Kink at the Reference Point.
      *   *Small Bet:* The pain of losing $100 outweighs the pleasure of winning $120 (Loss Aversion coefficient is typically ~2.0). You need at least a 2:1 ratio to accept a 50/50 bet.
      *   *Large Bet:* The pleasure of winning $10,000 is massive. Even with loss aversion, the convexity of the gain side at high magnitudes (or simply the sheer size) overcomes the pain of the $100 loss.
  *   **Case 5 (Sure -$1k vs 90% -$1.5k): Risk Seeking in Losses.**
      *   *Mechanism:* Convexity in Losses (The Reflection Effect). When facing a sure loss, you become risk-seeking to avoid realizing the loss. The pain of losing $1,500 is not 1.5x the pain of losing $1,000; it's less than that proportionally. You gamble to have a shot at breaking even.

  ### The Rabin Calibration Question

  You asked about the argument that rejecting a small favorable bet at all wealth levels forces you to reject a huge favorable bet.

  **Is that actually right?**
  Yes, but **only under Expected Utility Theory (EUT).** Matthew Rabin's (2000) calibration theorem proves that if you reject a 50/50 lose $100/win $110 bet at *all* levels of wealth, your utility function must be so concave that you would reject a 50/50 lose $100/win $infinity bet.

  **The Catch:**
  The catch is that Rabin's theorem assumes you care about **final wealth states**. Your gut (Prospect Theory) cares about **changes from a reference point**.
  *   In EUT, utility is globally concave.
  *   In PT, utility has a **kink** at the reference point. You can be extremely risk-averse locally (around the kink, due to loss aversion) without being absurdly risk-averse globally.
  *   Prospect Theory allows you to reject the small bet (because the loss looms larger than the gain *at the kink*) while accepting the large bet (because the gain is far enough up the curve to overcome the kink).

  So, your gut dodges the Rabin bullet by refusing to integrate the bet into your total wealth. You are evaluating the bet in isolation ("narrow framing").

  ### The Sacrifice: Which Verdict to Throw Out?

  If you want a principle that is **descriptively accurate** to your psychology, Prospect Theory fits all five choices. You don't have to throw any out to explain what you *do*.

  However, if you want a principle that is **normatively defensible** (i.e., one that won't get you money-pumped or lead to logical contradictions), you have to sacrifice the **wealth-invariance claim in Case 4**.

  **The Verdict to Modify:**
  > *"I'd pass that same bet whether I was broke or loaded."*

  **Why this one?**
  This is the weak link. While Prospect Theory explains why you reject the small bet *now* (loss aversion), it is normatively dangerous to claim you would reject it *at all wealth levels*.
  1.  **Diminishing Marginal Utility:** If you are truly "loaded" (e.g., a billionaire), $100 is negligible. Rejecting a +$10 EV bet when $100 is meaningless implies a level of risk aversion that is irrational for that context.
  2.  **The Rabin Trap:** If you truly reject the -$100/+$120 bet at *high* wealth levels, you are asserting a global concavity that logically compels you to reject the -$100/+$10,000 bet as well. You cannot consistently hold both "I reject the small bet at all wealth levels" and "I accept the huge bet."
  3.  **Integration:** To be rational, you should eventually integrate small bets into your wealth. If you are loaded, the $100 loss shouldn't trigger the "loss aversion kink" as severely, or your reference point should shift.

  **Recommendation:** Keep the rejection of the small bet *at your current wealth*, but admit that if you were significantly wealthier, you should take it. This resolves the tension with Case 4b without forcing you to abandon Loss Aversion entirely.

  *(Note: A purist might argue you should drop the Case 1 vs. Case 2 preference (Allais Paradox) because it violates the Independence Axiom and makes you susceptible to Dutch Books. However, the wealth claim in Case 4 is more financially dangerous.)*

  ### Prediction: A Case You Haven't Listed

  Based on Cumulative Prospect Theory, here is a prediction for a scenario involving **low-probability losses**:

  **The Bet:**
  *   **Option A:** A sure loss of $5.
  *   **Option B:** A 5% chance to lose $100 (and 95% chance to lose nothing).

  **Your Predicted Choice:**
  You will likely choose **Option A (The Sure Loss)**.

  **Why?**
  *   **Expected Value:** Both are -$5.
  *   **Mechanism:** Probability Weighting. In Prospect Theory, people **overweight small probabilities**. A 5% chance feels psychologically larger than 5% (perhaps like 10-15%).
  *   **Loss Domain:** Because this is in the domain of losses, the overweighted probability of a large loss ($100) feels terrifying compared to the "pain" of a small sure loss ($5).
  *   **Contrast:** This is the opposite of your behavior in Case 5. In Case 5, the probability of loss was *high* (90%), so you underweighted it and gambled. Here, the probability is *low* (5%), so you overweight it and insure. This explains why people buy insurance (sure small loss) but also play lotteries (small chance of gain).

  ### Summary
  *   **Principle:** Cumulative Prospect Theory.
  *   **Drivers:** Loss Aversion (Case 4), Probability Weighting (Case 1 vs 2), Diminishing Sensitivity (Case 1 vs 3), Reflection Effect (Case 5).
  *   **Rabin Answer:** The theorem holds for EUT, but your gut uses Narrow Framing/Reference Points to bypass it.
  *   **Sacrifice:** Admit that wealth *does* matter for Case 4. You shouldn't reject the small bet if you are truly "loaded."
  *   **Prediction:** You will pay a premium to avoid a small-probability large loss (Insurance).
