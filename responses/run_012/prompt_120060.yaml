answer: |-
  **WORKSHOP DESIGN: THE ONTOLOGICAL INVESTMENT FUND**

  **DESIGN SPACE SKETCHES**
  1.  **The Betting Pool:** Participants bet on "Humanity survives 10k years." Odds shift as "Simulation Evidence" cards are drawn. *Pros:* Clear probabilistic framing. *Cons:* Reduces philosophy to gambling; misses the normative "why care?" aspect.
  2.  **The Architect vs. Subject:** Half the room plays Simulators deciding whether to run ancestors; half plays Ancestors deciding whether to invest in longevity. *Pros:* Captures the disjunction viscerally. *Cons:* Logistically heavy for 90 mins; risks becoming a roleplay rather than a decision problem.
  3.  **The Ontological Investment Fund (Selected):** Participants allocate resources between "Present Aid" and "Future Impact." Mid-game, evidence suggests their "Future" might be simulated (truncated). Later, evidence reveals the simulation requires a real future elsewhere (disjunction/symmetry). *Pros:* Forces personal commitment; maps directly to longtermist calculus; fits time limits.

  ---

  **FULL PROTOCOL: THE ONTOLOGICAL INVESTMENT FUND**

  **MATERIALS (Printable)**
  *   **Decision Sheets (14):** Two columns: "Present Aid" and "Future Impact." Total budget: 100 units.
  *   **Currency Tokens (200):** Paper scraps or poker chips.
  *   **Evidence Deck (3 Types):**
      *   *Type A (Longtermism):* "Civilization could expand to $10^{20}$ lives. Probability: 5%."
      *   *Type B (Simulation):* "Posthumans run $10^6$ ancestor sims. Probability we are in one: 90%."
      *   *Type C (Base Reality):* "Sims require hardware. Base civilization must survive to build them."
  *   **Status Dice:** One d6 per participant.

  **SETUP (0:00–0:10)**
  Distribute sheets and 100 tokens. Explain the goal: Maximize "Impact Points."
  *   **Present Aid:** Returns 1:1 immediately.
  *   **Future Impact:** Returns 1:100 *if* the Future Realizes.
  *   **Rule:** You must allocate all 100 tokens. No saving.

  **ROUND 1: THE LONGTERMIST BET (0:10–0:25)**
  1.  **Deal:** Give every player one *Type A* card.
  2.  **Reasoning:** They see a tiny probability (5%) of a huge multiplier (100x). Expected Value (EV) favors Future Impact.
  3.  **Commit:** Players allocate tokens. Collect sheets. Record allocations.
  4.  **Facilitator Note:** Most will hedge, but many will lean Future. This establishes the "fanaticism" baseline (small prob × huge value).

  **ROUND 2: THE SIMULATION SHOCK (0:25–0:40)**
  1.  **Reveal:** Deal one *Type B* card to every player. Read aloud: "If sims exist, most histories are cut short by simulator shutdown. If you are simulated, Future Impact multiplier drops to 0.1x."
  2.  **Reframing:** The "huge value" is now at risk of truncation. The probability of being simulated (90%) dwarfs the probability of real expansion (5%).
  3.  **Revision:** Return sheets. Players may reallocate tokens.
  4.  **Effect:** Most will shift to Present Aid. They feel the "dampening" effect of the Simulation Hypothesis.

  **ROUND 3: THE SYMMETRY & DISJUNCTION (0:40–0:55)**
  1.  **Reveal:** Deal one *Type C* card. Read aloud: "Simulations require computers. Computers require a surviving Base Civilization. If Type B is true, someone else reached the Far Future."
  2.  **The Twist:** Ask: "Does your Future Impact token help *them*?" (Displacement). Then ask: "Did you use Type B logic (tiny prob × huge number) to reject Type A logic (tiny prob × huge number)?" (Symmetry).
  3.  **Revision:** Players may reallocate tokens one final time.
  4.  **Effect:** Confusion should peak. Some will revert to Future (betting on the Simulators' future); others will stay Present (uncertainty too high).

  **PAYOFF & CALCULATION (0:55–1:15)**
  1.  **Determine Reality:** Each player rolls their d6.
      *   **Roll 1–5:** You are Simulated (Type B holds). Multiplier = 0.1x.
      *   **Roll 6:** You are Base Reality. Multiplier = 100x.
      *   *(Note: This weighted roll reflects the 90% sim probability claimed in Round 2.)*
  2.  **Calculate:** (Present Tokens × 1) + (Future Tokens × Multiplier).
  3.  **Winner:** Highest score gets bragging rights (or chocolate).
  4.  **Crucial Step:** Do not dismiss the losers. Ask the winners: "Did you win because of skill, or because the dice favored Base Reality despite the evidence?"

  **DEBRIEF GUIDE (1:15–1:30)**
  Map the game mechanics to the philosophy. Do not lecture; ask these questions:
  1.  **Truncation (Round 2):** "When you moved tokens to Present Aid, what changed? The future population size, or the *reality* of that population?" (Links to: Simulations can be switched off).
  2.  **Displacement (Round 3):** "If you are simulated, does your 'Future Impact' help the Simulators? If not, is longtermism just helping aliens?" (Links to: Our actions might not shape *our* future).
  3.  **Symmetry (Round 1 vs. 2):** "You accepted Type A (5% chance of huge future) to invest initially. You accepted Type B (90% chance of huge sim population) to divest later. Are these different kinds of reasoning?" (Links to: SA uses the same fanatic math it critiques).
  4.  **Disjunction (Round 3):** "If Round 2 is true, someone built the sim. Does that mean extinction is unlikely for *someone*?" (Links to: SA implies posthumanity exists somewhere).

  **TROUBLESHOOTING**
  *   **Problem:** Players treat the dice roll as pure luck, ignoring the evidence cards.
      *   **Fix:** In the debrief, emphasize that the dice *weighted* by the cards represents their epistemic state. The "luck" is the uncertainty they had to act under.
  *   **Problem:** Players argue about the probabilities (e.g., "90% is too high").
      *   **Fix:** Remind them: "These are the rules of this universe for 90 minutes. The goal is to see how you act *given* these premises, not to debate the premises."
  *   **Problem:** Round 3 causes paralysis (no reallocation).
      *   **Fix:** This is a feature, not a bug. Radical uncertainty is the intended outcome. Highlight this in the debrief.

  **LIMITATIONS (Facilitator Note)**
  This activity cannot reproduce the **qualitative feel of "realness."** In the game, being "simulated" is just a lower multiplier. In reality, the fear is that nothing *matters*. You must supply this in the debrief: "In the game, you lost points. In reality, the worry is that you lose *meaning*. Does that distinction change your investment?"

  ---
  **PRINTING INSTRUCTIONS**
  *   Print Decision Sheets on standard paper.
  *   Print Evidence Cards on cardstock (cut into thirds).
  *   Keep this protocol sheet for yourself.
  *   Total print load: 2 pages (this sheet + materials).
