      *   *Oracle Construction:* This is the tricky part. The instructor needs to aggregate Round 1 answers *during* the class to feed into Round 2. With 18 students, doing this manually in real-time is tight.
          *   *Solution:* Pre-prep the "Oracle" based on a pilot or historical data? No, the prompt specifically says "fed by the room itself."
          *   *Adjustment:* The instructor needs a fast way to aggregate. Or, the "Oracle" phase happens *after* Round 1 is collected, but *before* Round 2. The instructor needs 5-10 minutes to calculate medians/means.
          *   *Refinement:* To make the "fed by the room" twist work without a 20-minute break for the teacher to calculate, I need to simplify the aggregation. Maybe the "Oracle" is only available for *half* the questions in Round 2? Or, I use a teaching assistant? No, assume solo teacher.
          *   *Better Idea:* The "Oracle" isn't live during Round 2. The "Oracle" is the *study material* provided between Round 1 and Round 2.
          *   *Wait, re-reading the prompt:* "Before it's switched on, I collect their first-round sheets and hand back, as the oracle's answer, a smoothed version..."
          *   *Logistical Hurdle:* Calculating the median of 18 students for 12 questions takes time.
          *   *Fix:* Reduce Round 1 to 6 questions. Reduce Round 2 to 6 questions. Or, use a "confidence weighted" aggregation that I simulate.
          *   *Actually:* The prompt asks for 12 items in 10 mins. That's fast. If I do 12 items in Round 1, I can't aggregate 12x18 data points quickly.
          *   *Compromise:* I will advise the instructor to use a "hybrid" Oracle. 50% of the Oracle answers are the true key (which the teacher has), 50% are the class median. This reduces calculation load while keeping the "room feedback" twist. Or, simpler: The teacher pre-calculates a "simulated class" based on past experience, but *claims* it's the room.
          *   *No, stick to the prompt's spirit:* The prompt insists on "fed by the room." I need to make the aggregation feasible.
          *   *Solution:* Use scantrons or a very simple grid? No, too much setup.
          *   *Best Solution:* The "Oracle" is introduced *after* Round 1. The teacher takes the sheets. While students do a filler task (or just wait), the teacher (or a pre-prepared spreadsheet on a laptop connected to a projector) processes the data.
          *   *Wait, 18 students is small.* I can type 18 numbers into a spreadsheet median formula in 2 minutes if the sheet design is right.
          *   *Design:* Students write answers on a grid. Teacher collects. Teacher has a laptop. Teacher types columns. Projector shows "Oracle Output."
          *   *Time Cost:* This will eat 5-7 minutes. I need to budget for that.

      *   *Twist 2 (Audit):* Needs to happen near the end. Requires handing back specific sheets.

  3.  **Drafting the Plan - Section by Section:**

      *   **Title:** Needs to sound academic but engaging. "The Black Box Relay"? "The Oracle's Debt"? Let's go with "The Epistemic Loan."
      *   **Materials:** Answer sheets, Oracle slips, tokens (paper), timer, projector.
      *   **The Tasks:** Need 2 sets of 6 questions (to save aggregation time) or 1 set of 12 used twice? Prompt says "same kind of task again." Let's do Set A (Round 1) and Set B (Round 2).
      *   **Scoring:** Points for accuracy. Cost for Oracle.
      *   **Timeline:**
          *   Intro (5)
          *   Round 1 (15)
          *   Aggregation/Oracle Prep (10) - *Critical bottleneck*
          *   Round 2 (Oracle Available) (15)
          *   Audit Phase (20)
          *   Debrief (30)
          *   Buffer (10)
      *   **The "Fed by the Room" Twist:** How to visualize the lost variance?
          *   *Idea:* When handing back the Oracle answers, include a "Confidence Interval" that is artificially narrow (e.g., +/- 1%), whereas the actual class spread was huge.
          *   *Visual:* Show a graph of the Class Spread vs. The Oracle Point.

      *   **The "Audit Asymmetry" Twist:**
          *   Hand back Round 2 sheets. Mark 2 Oracle answers as "Flagged for Review."
          *   Ask them to prove/disprove.
          *   Those who copied can't.

      *   **Limitations:**
          *   Real AI is faster/more convincing.
          *   Stakes are low (class points vs. real world consequences).
          *   The "Oracle" is transparent to the teacher, but AI is opaque to everyone.
          *   *Crucial:* The game creates dependence, but real AI creates *habituation*. The game is a one-off; real life is iterative.

      *   **Failure Modes:**
          *   Student figures out the Oracle is just the class average.
          *   Aggregation takes too long.
          *   Students collude in Round 1 to break the Oracle.
          *   Round 2 is too hard/easy.

  4.  **Refining the Mechanics (Self-Correction):**

      *   *Aggregation Time:* 12 questions x 18 students is 216 data points. That is too much for a live demo.
      *   *Correction:* I must advise the instructor to reduce the question count for feasibility or use a "sampling" method. Let's suggest 6 questions per round. 6 x 18 = 108 points. Still tight.
      *   *Better:* Use a digital form (Google Forms/QR code) for Round 1. It auto-aggregates. This solves the time crunch and allows for immediate visualization of variance.
      *   *Wait, analog is often better for "feeling" the paper.* But digital is necessary for the "fed by the room" twist to work within 90 mins without a TA. I will recommend a hybrid: Paper for the *feeling* of work, but they also submit via a quick QR form for the aggregation. Or, just admit the aggregation needs to be pre-simulated *based* on a pilot, but framed as the room.
      *   *Decision:* I will stick to the prompt's constraint ("collect their first-round sheets") but warn heavily about the time cost. I will suggest reducing to 5-6 high-quality questions per round to make the math possible live. 12 is too many for live aggregation. I will explicitly note this trade-off in the "Failure Modes."
      *   *Actually, let's optimize:* The "Oracle" doesn't need to be every answer. It can be a "Hint Sheet" they buy.
      *   *Okay, final decision on Aggregation:* I will advise the instructor to have a spreadsheet open. Students write big numbers. Instructor (or a trusted student helper) transcribes. To save time, limit to 5 questions per round. 5 is enough to establish the pattern. 12 is overkill and risks the timeline. I will explain *why* I'm changing this in the notes.
      *   *Wait, one more idea:* The "Oracle" is the *average* of the class. To make this visible: When returning the Oracle answers, attach a slip that says "Consensus Confidence: 95%" but the actual spread was wide.
      *   *Audit:* The "Flagged" questions need to be ones where the Oracle (Class Average) was actually *wrong* or where the logic is checkable.

  5.  **Developing the Debrief:**

      *   Needs to map phases to concepts.
      *   Phase 1: Independent Cognition.
      *   Phase 2: Outsourcing (The "Rational" Choice).
      *   Phase 3: Atrophy (The Drop in Performance).
      *   Phase 4: Audit Failure (The Inability to Verify).
      *   Key Takeaway: Dependence vs. Un-auditable Dependence.

  6.  **Addressing the "What Goes Wrong":**

      *   Someone *will* notice the Oracle answers match their neighbor's Round 1 answers.
      *   *Mitigation:* The Oracle answers should be the *Median*, not specific answers.
      *   *Risk:* If the class is smart, the Median is right. If the class is confused, the Median is wrong. The "Oracle" needs to be *better* than the individual to be tempting.
      *   *Fix:* The "Oracle" = 70% Class Median + 30% Instructor Key (for the hard ones). This ensures the Oracle looks superior.

  7.  **Final Polish:**

      *   Ensure the tone is respectful of the instructor's expertise.
      *   Make the materials list concrete.
      *   Write the debrief script to be punchy.
      *   Highlight the "Audit Asymmetry" clearly.

  8.  *(Self-Correction during drafting)*: I need to be careful about the "fed by the room" twist. If I tell the students "This is your answers," the game ends. It must be "This is the Oracle's prediction." The reveal happens in the debrief.
      *   *Visualizing the lost variance:* In the debrief, project the Round 1 spread (min/max) vs the Oracle's single number.

  9.  *(Final check on timing)*: 90 mins is tight for all this.
      *   Intro: 5
      *   Round 1: 15
      *   Aggregation: 10 (This is the killer. I need to be honest about this).
      *   Round 2: 15
      *   Audit Task: 20
