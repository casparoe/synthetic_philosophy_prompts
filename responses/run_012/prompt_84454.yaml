      *   The prompt says "Here's the shape I want... (say 12...)." It's a suggestion.
      *   *Honest advice:* I must tell them 12 is impossible for live aggregation. I will propose 6 items. It preserves the dynamic without breaking the clock.

  11. *Audit Asymmetry Detail:* How to ensure some Oracle answers are "confidently wrong"?
      *   I (the instructor) will manually override 2 of the aggregated answers with a plausible but incorrect calculation before handing them out in Round 2. This ensures there is something to audit.

  12. *Final Review of the "Fed by the Room" Twist:*
      *   To make the "lost variance" visible: When handing back the Oracle answers, print them on a slip that looks authoritative. In the debrief, show the raw data.
      *   Better: On the Oracle slip, include a fake "Confidence Score: 98%." In debrief, show the actual standard deviation.

