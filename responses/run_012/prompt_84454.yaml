answer: |-
  This is a sophisticated design. It moves beyond "AI makes us lazy" into "AI makes us epistemically opaque to ourselves." The logistics are tight for 90 minutes, specifically the live aggregation of student data.

  Below is the run-sheet, materials, and script. I have adjusted the question count slightly (from 12 to 6 per round) to ensure the live aggregation is physically possible without killing the momentum. I have also added a specific mechanism to visualize the "lost variance."

  # Session Title: The Epistemic Loan
  **Time:** 90 Minutes
  **Students:** 18 (Third-year)
  **Goal:** Experiential demonstration of skill atrophy and audit failure under optimized epistemic dependence.

  ## 1. Materials & Prep

  *   **The Tasks:** Two sets of 6 questions (Set A and Set B).
      *   *Type:* Fermi estimates or logical inferences where the *method* matters more than the exact digit (e.g., "Estimate the mass of carbon in this room," "If X implies Y and Z contradicts Y, what is the probability of Q?").
      *   *Constraint:* Must be hard enough that they want help, easy enough to solve in 2 mins each.
      *   *Prep:* Print Set A (Round 1) and Set B (Round 2). They should look identical in layout but have different content.
  *   **Answer Sheets:** Grid format. Columns for `Question #`, `Your Answer`, `Confidence (1-5)`.
  *   **The Oracle Slips:** Pre-printed slips for Round 2.
      *   *Content:* For 4 questions, use the **Class Median** from Round 1. For 2 questions, insert a **Plausible Error** (calculated by you).
      *   *Visual:* High-gloss or distinct paper. Header: "SYSTEM OUTPUT // CONFIDENCE: 98%". *Crucially: Do not show variance.*
  *   **Currency:** 10 "Cognitive Tokens" per student (paper chits).
  *   **Tech:** Projector + Laptop with a spreadsheet open (columns Q1–Q6).
  *   **Staffing:** You need one student volunteer or TA to act as "Data Entry" during the transition.

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Framing** | Explain the game. No mention of AI yet. "We are testing decision efficiency." Distribute Tokens (10 each) and Set A. |
  | **05-15** | **Round 1** | **Solo Work.** 6 Questions. 10 Minutes. Collect sheets immediately. |
  | **15-25** | **The Black Box** | **Aggregation.** Students wait. You + Volunteer type Round 1 answers into the spreadsheet. *Project the spreadsheet columns but hide the rows.* Calculate Medians live. |
  | **25-30** | **Oracle Setup** | Explain the "Oracle." It is available for Set B. Cost: 1 Token per answer. It is highly accurate. Hand out Set B and the **Oracle Slips** (face down). |
  | **30-45** | **Round 2** | **Assisted Work.** 6 Questions. 15 Minutes. They can flip Oracle slips and "buy" answers. Collect sheets. |
  | **45-65** | **The Audit** | **Twist 2.** Return Round 2 sheets. Tell them: "Two Oracle answers were flawed. Identify them. Re-derive the logic for one correct and one flawed answer in writing." |
  | **65-90** | **Debrief** | **The Reveal.** Map the experience to epistemic dependence. Show the variance data. |

  ## 3. The Mechanics & Scoring

  **Scoring Scheme:**
  *   **Accuracy:** 2 points per correct answer (within 10% margin for estimates).
  *   **Token Cost:** -1 point per Oracle answer used.
  *   **Audit Bonus:** +5 points if they correctly identify the flawed Oracle answers in the Audit Phase.

  **The "Fed by the Room" Twist (Visualized):**
  During the **Debrief**, project two graphs side-by-side:
  1.  **Round 1 Reality:** A box-and-whisker plot of the class's actual answers for Q1. Show the wide spread (the wisdom of crowds).
  2.  **The Oracle Lie:** The single point value they were given on the slip, with the text "Confidence: 98%."
  *Point:* The Oracle didn't generate knowledge; it laundered your collective uncertainty into a singular, confident fact. The "value" was in the spread; the "interface" hid the spread.

  **The Audit Asymmetry:**
  *   You (the instructor) manually altered 2 of the Oracle Slips to be confidently wrong (e.g., a decimal error in a Fermi estimate).
  *   Students who solved the problem themselves in Round 2 will spot the magnitude error immediately.
  *   Students who copied the Oracle will stare at the paper. They lack the "ground truth" in their head to check against.

  ## 4. Debrief Script & Concept Mapping

  **Phase 1: The Rational Choice (Round 2)**
  *   *Ask:* "Who used the Oracle? Why?"
  *   *Concept:* **Local Rationality.** Given the incentives (points) and constraints (time), outsourcing was the correct move. This isn't about laziness; it's about system design. If the tool is better than you, using it is rational.

  **Phase 2: The Atrophy (Round 2 vs Audit)**
  *   *Ask:* "Look at your Audit scores. Compare them to your Round 1 confidence."
  *   *Concept:* **Skill Disuse.** You didn't lose the *ability* to think in 15 minutes. But you offloaded the *responsibility* for verification. The cognitive muscle for 'sanity checking' atrophied because the interface told you confidence was 98%.

  **Phase 3: The Variance Laundering (Twist 1)**
  *   *Reveal:* Show the Box-and-Whisker plot of Round 1 data.
  *   *Concept:* **Epistemic Opacity.** The 'Oracle' was you. But by aggregating your disagreement into a single number, the system hid the *contestation* that makes knowledge robust. You didn't get smarter; you got a point estimate without the error bars.

  **Phase 4: The Takeaway**
  *   *Say:* "Dependence is not the enemy. We depend on calculators, maps, and peers. The enemy is **un-auditable dependence**. If you cannot re-derive the answer when the tool fails (as you saw in the Audit), you do not know the answer. You only know the tool's output. In AI, the 'Audit Cost' is rising. If the cost to verify exceeds the cost to generate, epistemic closure occurs."

  ## 5. Honest Limitations (What the Game Can't Do)

  You asked for honesty on what the game cannot reproduce. You must state these explicitly in the debrief so students don't over-generalize the wrong lessons.

  1.  **The "Black Box" Depth:** In this game, *you* know how the Oracle works (it's the class average). In real AI, *no one* knows exactly how the weights produced the token. The game simulates opacity, but real AI opacity is ontological, not just informational.
  2.  **Habituation:** This is a one-off event. Real epistemic erosion happens over months of habituation, not 15 minutes. The "atrophy" they feel is simulated panic, not neural rewiring.
  3.  **Stakes:** They are playing for class points. Real epistemic dependence affects democracy, justice, and safety. The *anxiety* of the game is low compared to the *consequence* of real-world reliance.
  4.  **The "Good" Oracle:** In the game, the Oracle is mostly right. In reality, AI hallucinates in ways that look confident. The game teaches audit; it doesn't fully teach *suspicion of plausibility*.

  ## 6. Predicted Failure Modes & Mitigations

  **Failure 1: The Aggregation Bottleneck**
  *   *Risk:* Typing 18 students x 6 questions takes too long. The energy dies during the 15-25 min block.
  *   *Fix:* **Digital Hybrid.** Have students submit Round 1 answers via a Google Form/QR code *as well as* the paper sheet. The Form auto-calculates the median. You project the Form results. Keep the paper for the "feeling" of work, use the digital for the "Oracle" speed.
  *   *Backup:* If tech fails, have pre-prepared "Simulated Class Data" that looks realistic. It undermines the "fed by the room" twist slightly, but saves the session flow.

  **Failure 2: The "Suss"**
  *   *Risk:* A smart student notices the Oracle Answer for Q1 is exactly the median of what they saw their neighbors writing in Round 1.
  *   *Fix:* Add noise. The Oracle Slip should not be the exact median. It should be `Median + (Small Random Offset)`. Or, simply own it in the debrief: "If you guessed it was the room, you were right. That makes the loss of variance even more disturbing."
  *   *Better Fix:* Ensure the Oracle Slips are printed *after* you collect the papers. Do not let them see the raw data.

  **Failure 3: The Audit Flop**
  *   *Risk:* The "Plausible Errors" you insert are too obvious or too hard to find.
  *   *Fix:* Pilot the errors. Make them **magnitude errors** (e.g., off by a factor of 10) rather than logic errors. Magnitude is easier to sanity-check without re-doing the whole math. This tests "epistemic intuition" rather than "calculation speed."
  *   *Risk:* Everyone fails the audit.
  *   *Fix:* Make the Audit Phase collaborative. Let them talk. The point is to show that *together* they can find it, but *individually* (dependent on the tool) they couldn't.

  **Failure 4: Cynicism**
  *   *Risk:* Students treat it as "The teacher tricked us."
  *   *Fix:* Frame the deception as part of the epistemology. "I lied about the source of the Oracle to simulate how vendors lie about the source of AI training data. The deception was the lesson."

  ## 7. Specific Instruction for the "Variance" Visual

  To make Twist 1 land hard, do not just talk about it.
  When you reveal the Oracle was the class aggregate:
  1.  Project the **Standard Deviation** of Round 1 answers.
  2.  Point to the Oracle Slip which said **"Confidence: 98%"**.
  3.  Say: *"The system took your disagreement (the SD) and sold it back to you as certainty (the 98%). That is the business model of epistemic erosion."*

  ## 8. Final Advice on the "Audit Asymmetry"

  Ensure you collect the Round 2 sheets *before* the Audit Phase.
  When you hand them back for the Audit:
  *   Mark the two questions with the "Plausible Errors" with a red star.
  *   Instruction: *"One of these stars marks a lie. The other marks a truth. You must identify which is which and prove it."*
  *   This forces them to audit *everything*, not just hunt for the error. It replicates the burden of verification in a high-automation environment.

  This structure respects the intelligence of third-years. It doesn't preach; it induces a state (dependence) and then removes the substrate (the tool) to show the void left behind. Good luck.
