answer: |-
  The interpretation of statistical evidence often rests on a seemingly simple premise: that the whole is the sum of its parts. When evaluating whether a treatment works, it feels intuitive to pool all available data to maximize precision. However, this intuition can fail catastrophically when the data are composed of distinct subgroups. The tension between aggregated and disaggregated evidence reveals that numbers do not speak for themselves; they require a context to be meaningful. To understand this, consider two hypothetical scenarios involving a medical treatment, Arm A, and a control, Arm B, with recovery as the outcome. The data are divided into two strata, which might represent different hospitals, severity levels, or demographic groups.

  In the first scenario, the arithmetic reveals a startling reversal. In Stratum 1, Arm A achieves a ninety percent recovery rate while Arm B achieves eighty percent. In Stratum 2, Arm A achieves a twenty percent recovery rate while Arm B achieves ten percent. In every subgroup, Arm A is superior. Yet, when the data are pooled, Arm A shows a twenty-seven percent recovery rate while Arm B shows a seventy-three percent recovery rate. The aggregated data suggest Arm B is vastly superior, contradicting the stratified evidence. This is not a computation error. The pooled counts are simply the sums of the stratum counts. The reversal occurs because the arms are distributed unevenly across the strata. Arm B received ninety patients in the easy-to-treat Stratum 1 and only ten in the difficult Stratum 2. Arm A received the opposite: ten in the easy stratum and ninety in the difficult one. Arm B's high overall success rate is driven not by efficacy, but by having been assigned mostly patients who were likely to recover anyway. The paradox consists in the conflict between the conditional comparison (within strata) and the marginal comparison (pooled). For this disagreement to exist, the stratum must be associated with both the arm assignment and the outcome. The world must be structured such that one arm inadvertently captures the favorable conditions while the other captures the unfavorable ones.

  This arithmetic instability extends beyond simple recovery proportions. If we calculate the risk difference, Arm A is ten percentage points better in both strata of the first scenario, but forty-six points worse when pooled. The risk ratio shows Arm A is better in both strata, but worse when pooled. Even the odds ratio, often touted for its statistical stability, reverses. In both strata, the odds of recovery on Arm A are 2.25 times the odds on Arm B. In the pooled table, the odds ratio drops to approximately 0.14, indicating Arm A is far worse. Now consider the second scenario, where the allocation is balanced. Here, each arm contributes identical numbers of cases to each stratum. In Stratum 1, Arm A recovers sixty-six point seven percent versus forty percent for Arm B. In Stratum 2, Arm A recovers forty-two point nine percent versus twenty percent for Arm B. The pooled data show Arm A at fifty-three point eight percent and Arm B at twenty-nine point two percent. There is no reversal here; the direction of effect remains consistent. However, the measures behave differently. The stratum-specific odds ratios are identical at 3.0 in both subgroups. Yet the pooled odds ratio is approximately 2.82. It is neither equal to the stratum-specific ratio nor a simple weighted average of them. This phenomenon, known as non-collapsibility, shows that even without confounding, aggregating data can distort the magnitude of association depending on the measure used. This contrast dismantles the common phrase that "the same data" can be summarized in a single number. The data are the same, but the summary number changes based on whether we respect the subgroups, and different measures (risk difference versus odds ratio) react differently to that aggregation.

  From the arithmetic alone, we can determine whether a reversal of the first kind is possible when allocation is identical across strata. It is not. If the proportion of patients in Stratum 1 is the same for Arm A and Arm B, the pooled recovery rate is a weighted average of the stratum-specific rates using identical weights. If Arm A exceeds Arm B in Stratum 1 and also exceeds Arm B in Stratum 2, the weighted average for Arm A must mathematically exceed the weighted average for Arm B. No algebraic manipulation can reverse this inequality if the weights are equal. This proof holds for recovery proportions and risk differences. For the odds ratio, the direction generally holds under equal allocation, though the magnitude will shift due to non-collapsibility. This implies that randomization, which ensures equal allocation of patients to strata on average, protects an investigation from this specific phenomenon. Randomization breaks the association between the arm assignment and the stratum. The single feature of the first table that produces the reversal is the unequal distribution of the strata across the arms. Arm B was disproportionately concentrated in the high-recovery stratum. Without this imbalance, the pooled data would align with the stratified data regarding the direction of the effect.

  However, knowing the arithmetic conditions does not tell us which comparison is correct. To decide whether the stratified or pooled comparison is the right one, we must look to the causal relations among the arm, the stratum, and the outcome. The stratified comparison is appropriate if the stratum is a confounder—a common cause of both the arm assignment and the outcome, or a cause of the outcome that is imbalanced across arms. Imagine the strata represent disease severity. If sicker patients were inadvertently routed to Arm A, the stratified comparison corrects for this bias, revealing the true efficacy of the treatment. In this story, the pooled table is misleading because it compares apples to oranges. Conversely, there is a plausible story under which the pooled comparison is the right one. This occurs if the stratifying variable is a downstream consequence of the arm rather than a pre-existing condition. Suppose the stratum represents a side effect caused by the treatment that subsequently influences recovery. If we stratify by this side effect, we block the very pathway through which the treatment works. We would be comparing treated patients who did not experience the side effect against control patients, artificially suppressing the treatment's apparent benefit. In this case, the pooled table captures the total effect, while the stratified table biases the result. The tables alone could never tell you which story holds. Numbers describe associations; they do not depict arrows of causation. Without external knowledge about whether the stratum existed before treatment assignment or was caused by it, the data are ambiguous.

  This ambiguity raises a profound question about the nature of evidence. The pooled table is constructed entirely from the stratified counts; it carries no new information. In an information-theoretic sense, the stratified tables dominate the pooled table. Yet, they can be treated as "the same evidence" leading to conflicting verdicts. They are the same data points, but they support different models of reality. The pooled table supports a model where the stratum is irrelevant or a mediator. The stratified table supports a model where the stratum is a confounder. Can one be evidence for something the other cannot support? Yes. The stratified tables provide evidence of heterogeneity; they show whether the treatment effect varies across subgroups. The pooled table provides evidence of the overall population impact, assuming no confounding. If an analyst presents only the pooled table from the first scenario, they present evidence that Arm B is superior. If they present only the stratified tables, they present evidence that Arm A is superior. Both claims are arithmetically true descriptions of the tables, but only one is a valid inference about the treatment's efficacy. Therefore, while the data are identical, the evidentiary weight depends on the validity of the causal assumption attached to the table.

  We must now reach two definitive verdicts on these matters. First, is there a fact of the matter about whether Arm A outperforms Arm B in the first scenario, or is the answer merely relative to a choice of partition and measure? There is a fact of the matter if and only if the causal structure linking the arm, stratum, and outcome is specified. Statistical associations are relative to the partition, but causal effects are properties of the system being studied. If the stratum is a confounder, the fact of the matter is that Arm A is superior, and the pooled table is a biased representation. If the stratum is a mediator, the fact of the matter is that the pooled effect represents the total causal influence, and stratification introduces bias. Table 1 falls on the side of ambiguity; without knowing the causal story, there is no single factual answer to the question "Is A better than B?" The numbers alone are insufficient to establish the fact. We cannot declare a winner based solely on the counts because the counts do not reveal why the patients were distributed unevenly.

  Second, does this phenomenon show that statistical evidence is inescapably relative to the analyst's choices, or does it show only that a question left vague has no answer? It shows that a question left vague has no answer. The phenomenon does not prove that truth is subjective or that evidence is merely a matter of opinion. It proves that the question "Is Arm A better?" is incomplete. It must be refined to "Is Arm A better for a patient with these characteristics?" or "Is Arm A better assuming assignment was random?" When an investigator asks a vague question, the data cannot provide a specific answer. The evidence is not relative; the interpretation is conditional on the question asked. A careful investigator, when faced with data resembling Table 1, must report both the stratified and pooled tables. Reporting only the pooled table hides the confounding imbalance and misleads the reader into believing the treatment is harmful. Reporting only the stratified tables hides the overall population burden and might obscure the fact that the treatment was rarely given to the patients who benefited most. To report only one is to withhold the context necessary for causal judgment. By presenting both, the investigator forces the reader to confront the structural imbalance and acknowledge that the final verdict depends on a causal story that the data alone cannot tell. Truth in statistics requires not just accurate computation, but the transparency of the assumptions that allow those computations to mean something.
