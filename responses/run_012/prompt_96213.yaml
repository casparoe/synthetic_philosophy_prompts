answer: |-
  **1. The Disability Rights Lawyer (The Expressivist Objection)**
  *   **The Objection:** "Your 'duty of non-arbitrariness' relies on a metric of a 'better life' that is inherently ableist. By selecting for height or education, you aren't just helping *this* child; you are sending an expressivist message to existing people with those traits that their lives are less valuable. You claim the duty is owed to the child, but the harm is inflicted on the community. How do you justify reinforcing structural stigma under the guise of parental duty?"
  *   **The Reply (2 mins):** "I accept the social model's premise that barriers create disability, but I cannot ignore the medical reality of suffering. My argument isn't that a shorter life or a life with less education is *unworthy*; it's that, ceteris paribus, fewer health barriers and more cognitive capacity provide a wider range of opportunity for *any* life plan the child chooses. The duty of non-arbitrariness requires me to justify my choice to the child later. I can tell them: 'We chose to minimize health barriers so you would have maximum freedom to define your own good.' I cannot justify choosing *randomly* when data exists. The expressivist harm is real, but it is a societal failure to value diverse lives, not a moral reason to withhold opportunity from this specific future person."
  *   **The Soft Spot:** You cannot fully decouple individual selection from social messaging; admitting "opportunity" is tied to "education/height" concedes the ableist metric.

  **2. The Reproductive Endocrinologists (Clinical Validity & Regret)**
  *   **The Objection:** "Polygenic scores for education and height have low predictive value in individual embryos (high variance). If you establish a 'duty' to select based on these scores, you are mandating choices based on statistical noise. When that child struggles in school despite the 'high score,' the parents face catastrophic regret, and the clinic faces liability for endorsing a clinical standard that doesn't exist."
  *   **The Reply (2 mins):** "I agree we must distinguish between clinical-grade health data and probabilistic traits. My duty of non-arbitrariness applies only where the data offers a *significant* comparative advantage, not marginal noise. For health and longevity, the signal is strong enough to avoid arbitrariness. For education, I concede the score is a weak proxy. However, refusing to look at *any* data is also arbitrary. The duty is to use the *best available* information transparently, not to guarantee outcomes. We mitigate regret by counseling that these are probabilities, not destinies, but ignoring the probability is a dereliction of stewardship."
  *   **The Soft Spot:** If the predictive value is too low to be clinically actionable, the choice remains arbitrary by your own definition, collapsing the duty.

  **3. The Kantian (Instrumentalization)**
  *   **The Objection:** "You claim this duty is owed *to* the child, but you are treating the child as a project to be optimized. By selecting for traits *you* deem beneficial, you are imposing your will on their existence before they have autonomy. This violates the categorical imperative: you are treating the future person as a means to satisfy a rational principle of 'non-arbitrariness,' not as an end in themselves."
  *   **The Reply (2 mins):** "Selection is not manufacturing. I am not designing a child to serve my ends; I am selecting the embryo with the highest capacity for *its own* future autonomy. A child with better health and cognitive capacity is better equipped to exercise their own rational agency. The 'non-arbitrariness' test is the safeguard: I must choose on grounds the child could rationally endorse later ('I am glad you chose health for me'), not grounds that serve only the parents ('I chose blue eyes because I like them'). This respects the child as a future rational agent, not a product."
  *   **The Soft Spot:** The child never consented to the selection criteria; assuming they would endorse "capacity" imposes your definition of a good life on them.

  **4. The Catholic Moral Theologian (Natural Law & Dignity)**
  *   **The Objection:** "Procreation is a gift, not a production process. Selecting embryos based on polygenic scores reduces the human person to a collection of traits and implies that some embryos are 'better' than others, violating the equal dignity of every human life from conception. You are playing God with the natural lottery."
  *   **The Reply (2 mins):** "I respect the view that life is a gift, but we already intervene in the 'natural lottery' with vaccines, education, and nutrition. This is simply preventative medicine at the embryonic stage. I am not creating life; I am choosing which existing potential life to nurture. The duty is to reduce suffering, not to achieve perfection. If I have the power to prevent a lifetime of chronic pain or significant disadvantage without harming the embryo, natural law suggests a duty of charity to do so."
  *   **The Soft Spot:** Your process likely involves discarding or freezing embryos deemed 'lesser,' which conflicts with the equal dignity of those embryos.

  ***

  **STRATEGIC CONCESSIONS (To Keep the Room)**
  *   **Concede Science Limits:** Explicitly state you do *not* support selecting for non-health traits (like eye color) or where PRS variance is too high (like education) until data improves. Limit the "duty" to significant health/longevity markers for now.
  *   **Concede Social Harm:** Acknowledge the Disability Lawyer's point is valid regarding *societal* impact, even if you argue the *individual* duty remains. Do not dismiss the expressivist objection; validate it as a reason for strict regulation, not a ban.
  *   **Concede Fallibility:** Admit that "best expected life" is a probabilistic guess, not a guarantee. The duty is to the *process* of reasoning, not the *outcome*.

  ***

  **THE NIGHTMARE QUESTION (Pray Nobody Asks)**
  "If you choose Embryo A for its high education score, and that child grows up to be happy but struggles academically, while the discarded Embryo B would have been a brilliant scholar but died young: Did you violate the duty of non-arbitrariness by lying to the child about why they were chosen, or by choosing the wrong metric for *their* specific good?"
