answer: |-
  ### Implications of Lexical-Threshold Negative Utilitarianism (LTNU)

  **1. Population Ethics: Repugnant, Mere-Addition, and Sadistic Conclusions**
  LTNU fundamentally alters the aggregation logic of population ethics.
  *   **The Repugnant Conclusion:** Standard total utilitarianism implies that a vast population with lives barely worth living is better than a smaller population with excellent lives. LTNU avoids this. Since lives below the threshold $t$ contribute zero value (Premise 3), a massive population of such lives has a total welfare value of zero (excluding suffering). A smaller population with lives above $t$ has positive total value. Thus, LTNU ranks the smaller, happier population higher. This is a direct consequence of the flat region preventing aggregation of sub-threshold welfare. [Reconstruction]
  *   **The Mere-Addition Argument:** This argument suggests that adding people with lives worth living cannot make a world worse, leading eventually to the Repugnant Conclusion. LTNU blocks the slippery slope. Adding people below $t$ adds no value; it is morally neutral (provided they do not suffer). Adding people above $t$ adds positive value. There is no gradual accumulation of value from sub-threshold lives that pressures the agent to accept lower qualities of life to increase numbers. The "cliff" at $t$ halts the slide. [Reconstruction]
  *   **The Sadistic Conclusion:** This conclusion typically arises when a view implies it is better to add people with negative welfare than people with positive welfare to avoid lowering the average or total in specific ways. LTNU avoids the standard Sadistic Conclusion because sub-threshold positive welfare cannot offset negative welfare. You would never choose to add suffering people to accommodate happy people if those happy people are below $t$, because their happiness counts for nothing. However, a tension arises above $t$: if lives are above $t$, trade-offs resume (Premise 5). If the suffering is severe but the supra-threshold pleasure is vast, LTNU permits offsetting. Thus, LTNU avoids the Sadistic Conclusion only insofar as the relevant lives fall below $t$. [Reconstruction]

  **2. Expected-Value Reasoning and Utility Functions**
  There is a significant technical conflict between LTNU and standard decision theory.
  *   **Continuity Axiom Violation:** Standard expected utility theory (von Neumann-Morgenstern) requires that preferences satisfy the continuity axiom: if A is preferred to B and B to C, there is a probability mixture of A and C that is indifferent to B. LTNU's discontinuous jump at $t$ violates this. If outcome B is just below $t$ (value 0) and outcome A is just above $t$ (value >0), no probability mixture of A and a worse outcome C can bridge the lexical gap if the preference ordering is strictly lexical at the threshold. [Settled technical result]
  *   **Implication:** LTNU cannot serve as a standard utility function for calculating expected values under risk. It can rank certain outcomes, but it cannot easily handle lotteries where an action has a probability of pushing an individual across $t$. To function in risky environments, LTNU must either abandon expected value maximization or adopt a non-standard lexical utility framework, which complicates practical reasoning significantly. [Reconstruction]

  **3. Interpersonal and Interspecies Comparison**
  LTNU creates a sharp hierarchy of moral status based on capacity for intensity.
  *   **Capacity Constraints:** If $t$ is an absolute phenomenological threshold, many non-human animals may lack the neurological capacity to experience pleasure above $t$. For such species, all pleasure is morally zero, while all suffering remains morally negative (Premise 1). This implies a duty to prevent animal suffering but no duty to promote animal pleasure. [Reconstruction]
  *   **Aggregation of Small Interests:** A very large number of animals (or humans) with sub-threshold pleasures cannot aggregate to outweigh the suffering of a single being above $t$, nor can they outweigh each other to create positive value. This avoids the problem of "tyranny of aggregation" for mild interests but implies that the interests of beings with lower capacity for intensity are systematically discounted regarding positive welfare. [Reconstruction]
  *   **Conflict:** This creates a tension with the intuition that suffering is the primary moral currency. If suffering counts everywhere (negative scale) but pleasure counts only above $t$ (positive scale), the view is asymmetrical. It treats suffering as universally commensurable but pleasure as hierarchically structured. This asymmetry may be philosophically unstable if pleasure and pain are viewed as opposite ends of a single scale. [Contested]

  **4. Cost-Benefit Analysis and Policy Instruments**
  LTNU renders standard policy metrics fundamentally misleading.
  *   **QALYs and DALYs:** Quality-Adjusted Life Years assume linear trade-offs between quality and duration. LTNU denies this. A year lived at quality 0.1 (below $t$) is worth 0, not 0.1. A year at 0.9 (above $t$) is worth positive value. Standard instruments would overvalue interventions that provide mild comfort to many and undervalue interventions that bring few people above $t$. [Reconstruction]
  *   **Willingness-to-Pay and Compensation:** Market behavior reveals willingness to pay for sub-threshold pleasures. LTNU declares these transactions morally inert regarding welfare enhancement. Furthermore, legal compensation that offers money (presumably for sub-threshold consumption) to offset pain is morally invalid under LTNU if the resulting pleasure stays below $t$. You cannot compensate suffering with trivialities. [Reconstruction]
  *   **Implication:** Policy guided by LTNU would prioritize high-intensity experiences (art, profound achievement, deep relief) over broad improvements in comfort (temperature control, minor conveniences), diverging sharply from standard welfare economics. [Reconstruction]

  **5. The Sufficiency of Suffering Relief**
  LTNU modifies the negative utilitarian thought that "relief of suffering is enough."
  *   **Conditional Sufficiency:** If no one can be brought above $t$, then eliminating suffering is indeed all that matters morally. The view collapses into practical negative utilitarianism. However, if beings can exceed $t$, then suffering relief is necessary but not sufficient; there is a secondary duty to promote high-intensity welfare. [Reconstruction]
  *   **Priority:** The lexical jump ensures that suffering relief always takes priority over creating sub-threshold pleasure. But above $t$, suffering relief competes with pleasure creation. This means LTNU does not grant suffering absolute lexical priority over *all* pleasure, only over *low-level* pleasure. [Reconstruction]

  **6. Epistemology of the Threshold**
  The practical application of LTNU hinges on locating $t$, which presents severe epistemic problems.
  *   **Locating $t$:** There is no consensus on how to identify $t$ empirically. Phenomenologically, the difference between a pleasure just below $t$ and one just above $t$ is likely negligible, yet the moral difference is infinite (from zero value to positive value). [Contested]
  *   **Vagueness vs. Precision:** LTNU requires a precise boundary to avoid aggregation problems. However, welfare experiences are vague. If $t$ cannot be precisely located, the view faces a dilemma: either admit $t$ is arbitrary (undermining its normative force) or admit that we cannot know which actions are morally permissible (practical paralysis). [Reconstruction]
  *   **Concession:** If $t$ cannot be located, LTNU must concede that it cannot guide action in cases near the threshold. It might have to rely on probabilities of crossing $t$, which reintroduces the expected value problems noted above. [Reconstruction]

  **7. Internal Tensions and Conflicts**
  *   **Aggregation vs. Continuity:** The feature that saves LTNU from the Repugnant Conclusion (the lexical jump) is the same feature that breaks its compatibility with expected utility theory. You cannot have both aggregation-blocking discontinuities and standard risk reasoning. [Settled technical result]
  *   **Phenomenology vs. Normativity:** The view posits a moral cliff where experience is smooth. This creates a conflict between the phenomenological reality of welfare (which appears continuous) and the normative structure of LTNU (which is discontinuous). Competent observers might disagree on whether a value function can be morally valid if it contradicts the continuity of experience. [Contested]
  *   **Asymmetry:** The view treats negative welfare as continuously meaningful but positive welfare as discontinuously meaningful. If welfare is a single scale (Premise 1), this asymmetry requires justification. Without it, the view risks appearing ad hoc. [Contested]

  Verdict: LTNU is best understood as a genuinely distinct axiology because its lexical discontinuity fundamentally alters the logic of aggregation and trade-offs, rather than merely adjusting the weighting of values within a standard negative utilitarian framework.
