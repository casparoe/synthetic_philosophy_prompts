answer: |-
  You have identified the central embarrassment of modern political theory: the gap between *political philosophy* (which assumes sides are built on principles) and *political science* (which observes sides are built on coalitions).

  Your three observations are not one phenomenon, but they are three symptoms of a single underlying structure. You are running together **epistemology** (how we know), **justification** (why we argue), and **ontology** (what the side *is*).

  Here is the breakdown of what you are seeing, the established terms that fit, where they fail, and a proposed concept to bind them.

  ### 1. Diagnosing the Observations

  **Observation 1: Pre-rational Alignment**
  *   **The Phenomenon:** You know your position before you have a reason, and you can predict others'.
  *   **Established Term:** **Elite Cue Theory** (combined with **Motivated Reasoning**).
  *   **The Mechanism:** Most people do not derive positions from first principles. They derive them from *signals* sent by trusted authorities (elites, media figures, party leaders). When a new issue arises (e.g., CRISPR), elites signal a position. Followers adopt the position to maintain alignment with their group.
  *   **The Psychology:** This is **Motivated Reasoning** (Dan Kahan). You are not reasoning to find the truth; you are reasoning to protect your identity. You feel the conclusion first (the "gut check" of tribal alignment) and then recruit logic to defend it.
  *   **Where the term fails:** "Cue Theory" explains *how* you got the position, but not *why* the cues are consistent. It implies a top-down manipulation, whereas you feel an internal coherence.

  **Observation 2: Heterogeneous Justifications**
  *   **The Phenomenon:** Allies agree on verdicts but disagree on axioms. Principles seem post-hoc.
  *   **Established Term:** **Ideological Constraint** (Philip Converse) and **Overlapping Consensus** (John Rawls, descriptively applied).
  *   **The Mechanism:** In *The Nature of Belief Systems in Mass Publics* (1964), Converse argued that most voters lack "ideological constraint." They do not hold a web of connected principles (e.g., "liberty implies X, therefore Y"). They hold a "bundle" of positions. The bundle stays together not because of logic, but because of **historical coalition**.
  *   **The Nuance:** Your classmates are experiencing an **Overlapping Consensus**. They want the same outcome for different comprehensive doctrines. One is a Kantian (autonomy), one is a Utilitarian (welfare). They are allies of convenience, not philosophical twins.
  *   **Where the term fails:** "Constraint" suggests a lack of sophistication. It doesn't explain why the bundle *stays* bundled over decades. Why does the "autonomy" person and the "welfare" person stay on the same team when new issues arise?

  **Observation 3: Identity Over Policy**
  *   **The Phenomenon:** Agreement on policy, but opposition in identity.
  *   **Established Term:** **Social Identity Theory** (Tajfel & Turner) and **The Friend/Enemy Distinction** (Carl Schmitt).
  *   **The Mechanism:** Politics is not primarily about policy; it is about *group membership*. In Social Identity Theory, self-concept is derived from group membership. To be "Left" is to be *not-Right*.
  *   **The Theory:** Carl Schmitt, in *The Concept of the Political* (1932), argued that the specific distinction of the political is not good/evil or useful/harmful, but **Friend/Enemy**. If two people agree on every policy but view each other as existential enemies, they are politically distinct.
  *   **Where the term fails:** Schmitt is too extreme (existential war) for a seminar debate. Social Identity Theory is too psychological; it ignores the *content* of the politics entirely.

  ### 2. What Makes a Side a Side?

  You asked: *What makes a side a side?*

  A side is not a **Creed**; it is a **Coalition**.

  In political theory, we often teach the "Spatial Model" (Left and Right are points on a line of logic). In reality, Left and Right are **historical coalitions** that have accumulated baggage.
  *   **The Right** is historically a coalition of economic libertarians, social traditionalists, and national sovereignty advocates. These groups often contradict each other logically (e.g., libertarians want open borders; nationalists want closed ones), but they remain on the same side because they share a common opponent.
  *   **The Left** is a coalition of labor unions, social progressives, and civil libertarians. Again, contradictions exist (e.g., labor protectionism vs. globalist progressivism), but the coalition holds.

  A "Side" is a **Coalitional Identity**. It is a team. You join the team not because you agree with the team's manifesto (which changes), but because you identify with the *people* on the team and oppose the *people* on the other team.

  ### 3. The Process: Naming the Mechanism

  You asked for a term for *the process by which a previously unclaimed question gets a side*.

  In political science, this is called **Partisan Sorting** or **Issue Politicization**.
  *   **Issue Politicization:** The process by which a topic moves from the private/technical sphere to the public/political sphere.
  *   **Partisan Sorting:** The process by which that topic becomes aligned with one specific coalition.

  However, these terms are dry and descriptive. They describe *that* it happens, not the *force* that makes it happen.

  **The Coinage: "The Coalitional Attractor"**

  If existing terms feel insufficient, I propose you conceptualize this as **The Coalitional Attractor**.

  *   **Definition:** A Coalitional Attractor is the sociological gravity well created by an existing political coalition. When a new, unclaimed issue emerges (e.g., AI regulation, pandemic response), it does not land on a blank slate. It lands in a field dominated by existing attractors (Left/Right).
  *   **The Mechanism:** The issue is "captured" by the nearest attractor based on superficial resonance with existing coalition themes (e.g., "Is this about authority? Then the Libertarians grab it." "Is this about equality? Then the Progressives grab it.").
  *   **Why it fits your observations:**
      1.  **Prediction:** You predict positions because you know the gravity of the attractor.
      2.  **Reasons:** The reasons vary because the attractor pulls in different types of matter (people) for different reasons.
      3.  **Identity:** The attractor *is* the identity. Two people can be in the same orbit (agree on policy) but belong to different attractors (different teams), and thus they repel each other.

  ### 4. Boundaries: When Does the Pattern Break?

  You asked: *What would have to be true for the pattern to come apart, or for a question to stay unclaimed?*

  The Coalitional Attractor model fails under conditions of **Cross-Cutting Cleavages**.

  *   **The Condition:** A question stays unclaimed (or splits the sides) when it does not map onto the existing fault lines of the coalition.
  *   **Historical Example:** In the 19th century, "Free Trade" vs. "Protectionism" did not map cleanly onto Left/Right. It split both parties. In the 1990s, "Civil Liberties vs. Security" (post-9/11) confused the alignment (libertarian Right vs. neocon Right; civil libertarian Left vs. security Left).
  *   **The Break Point:** The pattern comes apart during a **Realignment**. This happens when the internal contradictions of a coalition become too great to sustain. For example, if the "economic libertarian" wing and the "social traditionalist" wing of the Right decide they hate each other more than they hate the Left, the attractor shatters. The side dissolves into factions.
  *   **The Unclaimed Question:** For a question to remain unclaimed, it must lack **Symbolic Resonance**. It must be technically complex, emotionally neutral, and offer no opportunity for elites to signal virtue or vice. (These are rare).

  ### Summary for Your Seminar

  If you need to articulate this in class, here is the synthesis:

  1.  **Distinguish Philosophy from Sociology:** Tell your professor you are distinguishing between *Normative Coherence* (what justifies a side) and *Sociological Constraint* (what holds a side together).
  2.  **Name the Phenomenon:** Call it **Coalitional Identity**.
  3.  **Name the Process:** Call it **Elite Cueing** leading to **Partisan Sorting**.
  4.  **The Critical Insight:** The "Left/Right" distinction is not a spectrum of logic; it is a map of **historical alliances**. New issues are not judged on merit; they are **subsumed** into existing alliances based on which elite group claims them first.
  5.  **The Schmittian Turn:** Acknowledge Observation 3 by citing Carl Schmitt. The political is not about agreement; it is about the **Friend/Enemy** distinction. Policy agreement is accidental; tribal opposition is essential.

  You are not confused; you have simply noticed that the map (theory) does not match the territory (human behavior). The "Side" is a team, not a thesis.
