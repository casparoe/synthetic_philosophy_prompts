answer: |-
  # Handout: Mapping the "Wrong Kind of Reasons" Debate

  **Instructions:** Follow the questions below based on your intuitions about cases like the "Pascal's Wager" belief (believing for a reward) or the "Evil Demon" admiration (admiring a demon because he will torture you otherwise). Do not worry about the names of the positions; answer based on what seems true to you.

  ### The Decision Tree

  **1. The Root Question**
  Is there a genuine, principled difference between a reason that makes an attitude *correct* (like evidence for a belief) and a reason that makes it *beneficial to have* that attitude (like a reward for believing)?
  *   **No:** There is only one kind of reason; the difference is just in how we talk about it. → **Go to Leaf A**
  *   **Yes:** There are two fundamentally different kinds of reasons (Right Kind vs. Wrong Kind). → **Go to Question 2**

  **2. The Source of the Distinction**
  If there is a difference, is it fixed by **what the reason is about** (the content/object) or by **the nature of the attitude itself** (the state/process)?
  *   **What it's about:** A reason is the right kind only if it refers to the right things. → **Go to Question 3**
  *   **The nature of the attitude:** A reason is the right kind only if it interacts with the attitude in the right way. → **Go to Question 4**

  **3. The Content Branch**
  If the distinction depends on what the reason is about, must a right-kind reason always cite a property of the attitude's **object**, or can it cite normative standards internal to the **attitude** itself?
  *   **Object Property:** A right-kind reason must always be a reason for the object to have some feature (e.g., a reason to admire must be about the admirable qualities of the thing). → **Go to Leaf B**
  *   **Attitude Standards:** Some attitudes are answerable to their own normative standards, independent of the object's natural properties (e.g., gratitude has its own logic that isn't just about the benefactor's action). → **Go to Leaf C**

  **4. The State Branch**
  If the distinction depends on the nature of the attitude, what feature filters out the wrong-kind reasons?
  *   **Definition:** The filter is determined by the attitude's constitutive aim or correctness conditions (what the attitude *is*). → **Go to Leaf D**
  *   **Reasoning:** The filter is determined by whether the reason can serve as a premise in conscious reasoning that concludes in the attitude. → **Go to Leaf E**
  *   **Tracking:** The filter is determined by whether holding the attitude for that reason would cause the attitude to track the truth or value reliably. → **Go to Leaf F**

  ---

  ### The Positions (Leaves)

  **Leaf A: Uniformism (Reductivism)**
  *   **The View:** There is no deep distinction; pragmatic reasons (rewards) and epistemic/fitting reasons are the same genus, just weighing differently.
  *   **The Cost:** You must explain why we cannot simply believe or desire things at will when the pragmatic reasons are strong enough.

  **Leaf B: Strict Object-Given View**
  *   **The View:** Right-kind reasons must always be properties of the object of the attitude (e.g., evidence is about the world, not the belief).
  *   **The Cost:** You struggle to account for attitudes that lack clear objects (like moods) or where the relevant "property" is itself normative.

  **Leaf C: Attitude Autonomism**
  *   **The View:** Attitudes have their own sui generis normative standards; reasons are right-kind if they satisfy the attitude's internal norms, not just object properties.
  *   **The Cost:** You risk positing a mysterious normative realm for every attitude that is disconnected from the world.

  **Leaf D: Constitutivism**
  *   **The View:** Right-kind reasons are those that align with the constitutive aim of the attitude (e.g., belief aims at truth, so only truth-related reasons count).
  *   **The Cost:** You are committed to a rigid, essentialist definition of mental states that may not fit psychological reality.

  **Leaf E: Deliberativism**
  *   **The View:** Right-kind reasons are those that an agent can consciously deliberate from to form the attitude (the "Reasoning Constraint").
  *   **The Cost:** You must deny that infants, animals, or unconscious mental states can hold attitudes supported by right-kind reasons.

  **Leaf F: Teleological Tracking View**
  *   **The View:** Right-kind reasons are those that allow the attitude to function as a reliable tracker of truth or value in the long run.
  *   **The Cost:** You instrumentalize the attitude, making its value dependent on its consequences rather than its immediate correctness.

  ***

  # Instructor's Key: Logical Space & Case Analysis

  ### 1. Mapping the Logical Space
  The tree above is built from the combinations of answers the philosophical landscape allows. However, not every logically possible leaf is occupied by a viable theory.

  *   **The Empty Slot (State-Based + Value of Having):** In Question 4, you might have expected a fourth branch: *"because of the value of having the attitude at all."* This combination is largely **unoccupied**.
      *   **Why?** If a view claims a reason is the *Right Kind* specifically *because* it cites the value of having the attitude, it collapses the distinction it tries to save. This is essentially the definition of the "Wrong Kind of Reason." To occupy this leaf, one would have to argue that consequentialist reasons *are* the right kind for attitudes, which usually pushes the view back toward **Uniformism (Leaf A)**. It is incoherent as a solution to the WKR problem because it validates the puzzle cases (like the Evil Demon) rather than solving them.

  *   **The Content/State Divide:** Note that **Leaf C (Autonomism)** sits in a tricky spot. It claims to be content-based (standards of the attitude), but often functions like a state-based view. It is included here to capture views that want to avoid the rigidity of Strict Object-Given views without appealing to psychological processes (Deliberativism).

  ### 2. The Gratitude Test Case
  You asked to explicitly handle the case of **Gratitude**:
  *   **Reason A (Object):** "I should be grateful because they helped me."
  *   **Reason B (State/Consequence):** "I should be grateful because being grateful would make me a nicer person."

  **The Verdicts:**
  *   **Uniformism (A):** Both A and B are reasons. (Difference is only weight).
  *   **Strict Object-Given (B):** A is Right Kind; B is Wrong Kind (B is not about the benefactor).
  *   **Deliberativism (E):** A is Right Kind; B is Wrong Kind.

  **Addressing Your Hunch (Object vs. Deliberative):**
  You suspected the **Deliberative** and **Object** criteria might give different verdicts here. In this specific formulation, they actually **converge** on the verdict (both reject Reason B), but they do so for structurally different reasons. This is the crucial teaching point for your group:

  1.  **The Object View** rejects Reason B because it is *about the wrong thing* (the self, not the benefactor). It doesn't matter if you *can* reason from it; it's irrelevant to the relation.
  2.  **The Deliberative View** rejects Reason B because of *how it works*. Even if the reason is morally good, you cannot typically form gratitude *by reasoning* "I will be grateful to become nice." (This is akin to the impossibility of believing at will).

  **Where they might diverge:**
  The divergence appears if we change the case slightly. Suppose an agent *cannot* consciously deliberate (e.g., immediate instinctual gratitude).
  *   The **Object View** can still say they have a Right Kind reason (the help was real).
  *   The **Deliberative View** might struggle to say they have a Right Kind reason (since no deliberation occurred), or must rely on a dispositional account of reasoning.
  *   *Flag for Discussion:* If your group insists that Reason B *could* be a Right Kind reason under Deliberativism (via indirect strategies), but never under Object-Given views, then the tree successfully separates them. If they agree B is Wrong Kind for both, emphasize that the *explanation* of "wrongness" is the real disagreement.
