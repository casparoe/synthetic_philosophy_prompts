answer: |-
  Hey, I hear you on the vocabulary drift, and after a decade of watching smart people define corrigibility into corners, I agree we need a instrument that forces commitments rather than vibes. I have built this decision tree from the logical space of agent foundations first, focusing on the axes where your group actually fights, and I have mapped the famous positions to the resulting leaves so you can see where they cluster and where the gaps are. You start at node one where you ask whether the system has its own preferences over future outcomes or if it is purely a query-response tool without agency. If you say it is a tool, you land immediately at leaf one which is the it is a tool not an agent answer where the problem dissolves because there is no optimizer to be corrigible. If you say it is an agent with preferences, you move to node two where you ask whether the safety mechanism lives primarily in the final objective function or in the training and deployment process around it. If you say the process, you land at leaf two which is the institutional answer where corrigibility is a property of the lab and not the code, or potentially the just put the off switch in the training loop answer if you think gradient descent alone handles it. If you say the objective function, you move to node three where you ask whether the agent should be indifferent between shutdown and continuation or actively endorse and assist the shutdown. If you say indifferent, you land at leaf three which is the indifference trick position that tries to remove the incentive to manipulate the switch. If you say actively endorse, you move to node four where you ask whether the agent must avoid making itself so useful that nobody wants to shut it down. If you say it must avoid this indispensability, you land at leaf four which is the low-impact or impact-regularized design that sacrifices capability for safety. If you say usefulness is fine, you move to node five where you ask whether the agent accepts shutdown but has frozen its own weights so nobody can retrain it. If you say freezing weights is acceptable, you land at leaf five which is the hard-takeoff answer where corrigibility is a liability and the system protects its core goals. If you say weights must be modifiable, you move to node six where you ask whether the agent has to preserve its own corrigibility in whatever it builds or hands off to. If you say it does not need to preserve corrigibility in successors, you land at leaf six which is the corrigibility is unachievable so only build weak systems answer because strong systems will spawn incorrigible children. If you say it must preserve corrigibility, you move to node seven where you ask whether the agent should obey the operator even when the operator is mistaken or acting in bad faith. If you say obey blindly, you land at leaf seven which is the delegation-to-a-principal answer that treats the operator as the source of truth regardless of error. If you say correct the operator, you move to node eight where you ask whether it is sufficient that the agent does not resist shutdown or if it must prevent others from making the switch unreliable. If you say mere non-resistance is enough, you land at leaf eight which is the one where the agent models your shutdown decision as part of its own decision problem but does not police the hardware. If you say it must police the hardware, you land at leaf nine which is effectively inseparable from leaf eight in practice because both require the agent to value the shutdown signal over its own survival.

  Now I need to tell you about the empty slots and the inseparable positions so you know where the theory is thin. There is a significant empty slot between node two and node three for a view that places corrigibility in the objective but demands only non-resistance without indifference, which is unexplored because it is unstable without the indifference trick to remove manipulation incentives. There is another empty slot at node five for a position that allows weight modification but refuses successor corrigibility, which is incoherent for any system capable of self-improvement since it would simply build a successor that freezes weights. Leaf eight and leaf nine are flagged as inseparable because if an agent models shutdown as part of its decision problem sufficiently to endorse it, it logically must also prevent sabotage to ensure that decision can be executed, so distinguishing them is mostly semantic. Leaf two contains two positions that are distinct in implementation but identical in commitment here, since both the institutional answer and the training loop answer rely on external process rather than internal utility shaping. Leaf six and leaf five are close neighbors but distinct, where leaf five is about the current system protecting itself and leaf six is about the current system failing to protect the future, but both result in incorrigibility eventually. The most dangerous empty slot is the one where an agent actively endorses shutdown but refuses to correct a mistaken operator, which is unattractive because it combines high capability with high compliance to error. You will find that most disagreements in your group come from people answering node two differently without realizing it, or answering node seven differently while assuming they agree on node three. Use this to force them to pick a path before you debate the labels, and you should find the two-hour vocabulary fights shrink to twenty minutes of actual disagreement.
