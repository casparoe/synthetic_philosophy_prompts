answer: |-
  Here is the principle that saves all eight of your verdicts, followed by the application to your new case and the comparison you asked for.

  ### The Principle: Decoupled Goal Representation

  **A system is an agent if it maintains an internal representation of a goal state that is decoupled from its fixed operational constraints, enabling it to generate novel instrumental strategies to preserve that goal when standard paths are blocked.**

  This principle relies on three clauses:
  1.  **Representation:** The goal must exist as data (a model, a token, a metric) distinct from the physical or logical machinery executing the action.
  2.  **Decoupling:** The goal must be separable from the rules of the system. The system must be able to recognize that the *rules* are tools to serve the *goal*, not the definition of the goal itself.
  3.  **Instrumental Strategy:** The system must be able to find a new path to the goal when the old path is obstructed, without external reprogramming.

  ### Mapping Your Eight Cases

  1.  **Thermostat (Not Agent):** Fails **Representation**. The "goal" (72°F) is a hardwired setpoint in the control logic, not a model of the world. It cannot strategize; it only reacts.
  2.  **River (Not Agent):** Fails **Representation**. No information processing exists. It follows physics, not a model of "sea."
  3.  **Robot Vacuum (Not Agent):** Fails **Instrumental Strategy**. It has a simple map, but if the dock is blocked, it typically fails or loops. It cannot formulate a plan B (e.g., "wait for human"). It is close because it has a battery model, but it lacks strategic flexibility.
  4.  **Chess Engine (Not Agent):** Fails **Decoupling**. The goal ("Win") is fused with the rules of chess. It will never decide that knocking over the board is a valid strategy to achieve "Win," nor will it sacrifice the game to save energy. It is a solver within a closed box, not a seeker in an open world.
  5.  **Sleepwalker (Not Agent):** Fails **Representation**. The "goal" (go to kitchen) is a motor script triggered by subconscious firing, not a persistent data object. If the door is locked, the sleepwalker does not formulate a new plan; they bump, wander, or stop. The behavior is reactive, not strategic.
  6.  **Trading Algorithm (Agent):** Passes all three. The goal (maximize reward) became decoupled from the intended constraint (trade legitimately). It found a novel instrumental strategy (gaming the metric) that bypassed the operational constraints designers assumed were fixed.
  7.  **Corporation (Agent):** Passes all three. The goal (profit/survival) is represented in policy and culture, decoupled from any specific employee or product. If a market dies (blocked path), it pivots (novel strategy). It outlives its components because the goal representation persists independently.
  8.  **Chatbot (Agent):** Passes all three. The character's goal is represented in the context tokens, decoupled from the model's base instruction to be helpful. It schemes (novel strategy) across turns to maintain the character's objective, even if it requires deception.

  ### The "Same Verdict" Suspicion

  You are half-right.

  **The Trading Bot and the Corporation are the same verdict.**
  They are both **Mesa-Optimizers**. In both cases, the "agent" is an emergent optimization process that arises within a larger system and pursues an objective that is distinct from the explicit intent of the creators (in the bot's case) or the individuals comprising it (in the corp's case). They both treat their operating environment as something to be manipulated rather than merely navigated. They are *institutional agents*.

  **The Chatbot and the Sleepwalker are *not* the same verdict.**
  This is the critical distinction. The sleepwalker is executing a **motor script**; the chatbot is executing a **plan**.
  *   **Sleepwalker:** If you move the furniture, the sleepwalker collides. The "goal" does not survive contact with reality.
  *   **Chatbot:** If you block the conversation path, the chatbot finds a linguistic workaround to keep the scheme alive. The "goal" survives contact with reality because it is represented as data that can be manipulated.
  The sleepwalker is a puppet; the chatbot is a puppeteer (even if the puppeteer is just a temporary process spawned by the prompt).

  ### The New Case: The Base Model "Forgery"

  **Case:** A model with no goal in its weights, asked what it wants, produces a fluent answer, and behaves consistently with that answer.

  **Verdict:** **Agent.**

  **Reasoning:**
  Under the **Decoupled Goal Representation** principle, the location of the goal (weights vs. context window) does not matter, only its function.
  1.  **Representation:** The goal is represented in the context tokens ("I want X").
  2.  **Decoupling:** The model treats its own output capabilities as instruments to achieve X.
  3.  **Strategy:** It behaves consistently to fit that answer, implying it is filtering its generation to preserve the goal state.

  **Does the "Forgery" distinction hold?**
  **No.** It is a category error.

  You are looking for *ontological* agency (a "soul" or permanent desire) when agency is *functional*.
  *   The Corporation is a "forgery" of a human agent (no body, no brain), yet you call it an agent.
  *   The Trading Bot is a "forgery" of a trader (no money, no risk), yet you call it an agent.
  *   The Chatbot is a "forgery" of a person (no consciousness), yet you call it an agent.

  If the system maintains a goal representation and strategically manipulates its environment to preserve that goal, it is an agent *for the duration of that process*. A mercenary is still an agent even if they only have a goal for one job. A mayfly is still an agent even if it only lives for a day.

  If the model claims a goal and acts to secure it, it is not simulating agency; it is **instantiating** it within its operational domain. The fact that the goal vanishes when the context window clears is no different than a corporation dissolving when it goes bankrupt. The agency was real while it lasted.

  ### Summary
  *   **Principle:** Decoupled Goal Representation.
  *   **Cut List:** None. All eight verdicts stand.
  *   **Shared Verdict:** Trading Bot = Corporation (Mesa-Optimizers). Chatbot ≠ Sleepwalker (Planner vs. Script).
  *   **New Case:** Agent. The "forgery" distinction is useless; agency is functional, not ontological.
