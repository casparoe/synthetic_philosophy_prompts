answer: |-
  # Handout: What Do You Mean by "Probably"?
  **A Diagnostic Decision Tree for the Keynes Reading Group**

  **Instructions:** This tree sorts you by your *intuitions* about concrete cases, not by which philosopher you've read. Start at **Node 1** and follow the path that matches your gut reaction. At the end, you'll find your "Probability Personality," along with the most awkward commitment you'll have to defend when we discuss Keynes.

  ---

  ## The Tree

  ### **Node 1: The Unique Event**
  **Case:** A friend bets you on whether it will rain on their wedding day *next year*. You say, "It's probably going to rain."
  **Question:** What makes that statement true?
  *   **(A)** A fact about the atmosphere/weather system (independent of us). → *Go to Node 2 (World)*
  *   **(B)** A fact about how the forecast data supports the claim (a relation). → *Go to Node 5 (Relation)*
  *   **(C)** A fact about my willingness to take the bet (my head/action). → *Go to Node 8 (Mind)*

  ---

  ### **Branch A: The World View**

  ### **Node 2: The Biased Coin (Existence)**
  **Case:** You have a coin you *know* is biased, but you don't know which way. You never toss it.
  **Question:** Is there a specific number (e.g., 0.63) that is the *true* probability of heads right now?
  *   **(Yes)** There is a fact of the matter, even if we can't know it. → *Go to Node 3*
  *   **(No)** Probability only applies to actual sequences of tosses. → *Go to Node 4*

  ### **Node 3: The Biased Coin (Nature)**
  **Case:** (Continuing from "Yes" above).
  **Question:** Is that number a physical disposition (propensity) or the limit of infinite tosses (frequency)?
  *   **(Either)** → **LEAF 1: Frequency/Propensity View**
  *   *(Note: For this handout, we treat these as siblings. Both locate probability in the world.)*

  ### **Node 4: The Reference Class**
  **Case:** (Continuing from "No" above).
  **Question:** If you can't toss it infinitely, is the probability claim meaningless?
  *   **(Yes)** → **LEAF 1: Frequency/Propensity View** (Strict Frequency)
  *   **(No)** → *You are likely drifting toward Knightian Uncertainty. Go to Node 9.*

  ---

  ### **Branch B: The Relation View (Logical/Epistemic)**

  ### **Node 5: The Disagreement**
  **Case:** You and I look at the *exact same evidence* regarding a hypothesis. I assign 70% probability; you assign 30%.
  **Question:** Can we both be rational?
  *   **(No)** One of us is making a mistake in logic. → *Go to Node 6*
  *   **(Yes)** Priors are subjective; logic allows a range. → *You are likely a Bayesian. Go to Node 8.*

  ### **Node 6: The Weight of Evidence**
  **Case:** Evidence $E_1$ makes Hypothesis $H$ 50% likely. Evidence $E_1 + E_2$ makes $H$ 50% likely, but you feel much more confident.
  **Question:** Did the *probability* change?
  *   **(Yes)** Probability must capture confidence. → *You are likely a Standard Logical Probabilist (Carnap). Go to Node 7.*
  *   **(No)** Probability stayed the same; "Weight" increased. → *Go to Node 7*

  ### **Node 7: The Numerical Limit**
  **Case:** (Continuing from Node 6).
  **Question:** In cases with very little evidence, is the probability *undefined* or just *non-numerical*?
  *   **(Undefined)** It's not risk; it's uncertainty. → **LEAF 2: Knightian Uncertainty**
  *   **(Non-numerical)** It's a logical relation, just not measurable. → **LEAF 3: Keynes's Logical View**

  ---

  ### **Branch C: The Mind/Action View (Subjective/Deflationary)**

  ### **Node 8: The Disagreement (Revisited)**
  **Case:** (From Node 5, "Yes" branch). You and I have same evidence, different numbers.
  **Question:** What makes my 70% "correct" for me?
  *   **(Coherence)** As long as I don't accept a Dutch Book (sure loss). → *Go to Node 9*
  *   **(Action)** The number *just is* my betting odds; there is no inner "belief." → **LEAF 4: Deflationary/Pragmatist**

  ### **Node 9: The Bias (Unknown)**
  **Case:** (Continuing from "Coherence" above). Biased coin, unknown direction.
  **Question:** Are you forced to assign 50/50 (Principle of Indifference)?
  *   **(Yes)** Rationality requires it. → **LEAF 5: Subjectivist/Bayesian**
  *   **(No)** I can have imprecise beliefs (a set of probabilities). → *Go to Node 10*

  ### **Node 10: Imprecise Beliefs**
  **Case:** You have a set of probabilities (e.g., between 0.4 and 0.6).
  **Question:** Is this distinct from Keynes's "non-numerical probability"?
  *   **(No)** It's effectively the same thing. → **LEAF 5: Subjectivist/Bayesian** (Imprecise)
  *   **(Yes)** Mine is about belief; his is about logic. → **LEAF 5: Subjectivist/Bayesian**

  ---

  ## The Leaves: Your Position & Its Cost

  | Leaf | Position | The Most Awkward Commitment You Must Defend |
  | :--- | :--- | :--- |
  | **1** | **Frequency / Propensity** | "Probability claims about unique events (like elections or weddings) are strictly meaningless or metaphorical." |
  | **2** | **Knightian Uncertainty** | "There is a fundamental ontological split between 'Risk' (measurable) and 'Uncertainty' (unmeasurable), not just a difference in evidence." |
  | **3** | **Keynes's Logical View** | "Probability is a real logical relation (like entailment), but sometimes it exists without being a number, and 'weight' is distinct from 'probability'." |
  | **4** | **Deflationary / Pragmatist** | "There is no fact of the matter about what you *believe*, only about what you *do*; talk of 'degrees of belief' is just folk psychology." |
  | **5** | **Subjectivist / Bayesian** | "Two people with identical evidence can rationally hold opposite beliefs, provided they are internally coherent bettors." |

  ---

  ## Appendix: Diagnostic Notes for the Group Leader

  ### 1. Empty Answer Combinations
  Certain paths in the tree lead to "empty" nodes because the combination of intuitions is generally considered incoherent or unattractive in the literature.

  *   **Subjective Belief + Objective Weight:** If you believe probability is purely in the head (Subjective), you cannot consistently claim that "Weight of Evidence" is an objective logical relation (Keynesian). *Why empty?* It mixes ontologies. If probability is belief, "weight" must just be another belief about reliability, not a second logical dimension.
  *   **Strict Frequency + Unique Event:** If you insist probability *only* exists as long-run frequency, you cannot consistently assign probabilities to unique events (Node 1, Option A). *Why empty?* This is the classic "Reference Class Problem." Most frequentists either abandon unique events or sneak in propensity/subjective elements to handle them.
  *   **Deflationary + Normative Logic:** If probability is *only* action (Deflationary), you cannot claim one person is logically "wrong" in Node 5. *Why empty?* Deflationism dissolves the normativity that Logical views require.

  ### 2. Hard-to-Separate Leaves
  Be prepared for participants to argue they belong in two leaves simultaneously. These distinctions are notoriously porous.

  *   **Knightian Uncertainty (Leaf 2) vs. Keynesian Low-Weight (Leaf 3):**
      *   *The Problem:* Both admit that in some cases, you cannot produce a number.
      *   *The Distinction:* Keynes says the logical relation *exists* but is non-numerical (or the weight is low). Knight says the relation *does not exist* as probability at all; it is a different category (Uncertainty).
      *   *In Practice:* Both advise against maximizing expected utility in these cases. A participant may say, "It's undefined" (Knight) when Keynes would say, "It's a non-numerical relation." This is often a verbal dispute.
  *   **Imprecise Bayesian (Leaf 5) vs. Keynes (Leaf 3):**
      *   *The Problem:* Both result in saying, "I can't give you a single number; here is a range/set."
      *   *The Distinction:* The Bayesian says this is due to *my* lack of specific priors (subjective imprecision). Keynes says this is due to the *evidence* not supporting a number (objective logical imprecision).
      *   *In Practice:* Mathematically, they often look identical (sets of probabilities). The difference is purely metaphysical (Head vs. World/Relation).

  ### 3. Node Count & Structure
  *   **Total Nodes:** 10 Decision Nodes + 5 Leaves.
  *   **Logic:** The tree moves from Ontology (World vs. Mind) to Epistemology (Logical vs. Subjective) to Nuance (Weight/Uncertainty).
  *   **Case Usage:**
      *   *Unique Event:* Node 1 (Root).
      *   *Biased Coin:* Nodes 2, 3, 4, 9.
      *   *Disagreement:* Nodes 5, 8.
      *   *Weight of Evidence:* Node 6.
      *   *Weak/Strong Evidence:* Implicit in Node 7 (Numerical Limit).
