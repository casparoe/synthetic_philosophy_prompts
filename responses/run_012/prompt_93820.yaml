  *Adjustment:* The anonymous post needs to be something dangerous to say. Maybe about a specific person's negligence, but not quite provable enough for a lawsuit. Or a moral failing of the town. Let's make it about the budget surplus being spent elsewhere. It explains *why* the roof can't be fixed, but because it's anonymous, it's treated as rumor.

  *(Self-Correction on Elias)*: He needs to be the "Single Individual." He shouldn't just fix the roof; he needs to stake *himself*. He needs to say, "I am responsible."

  *(Setting the Signature)*: Let's make the signature "— A Resident." It emphasizes the generic nature.

  *(Word Count Management)*: I need to be descriptive but not verbose. Focus on the tension between the screen and the physical world.

  10. **Final Review against constraints:**
      *   1500-2000 words? (Will monitor).
      *   No villain? (Yes, diffuse responsibility).
      *   Forum starts good? (Yes, lost cats, etc.).
      *   Character deliberates instead of acts? (Sarah).
      *   Character stands as individual? (Elias).
      *   Anonymous truth? (Yes).
      *   No explanation of theory? (Yes).
      *   No happy ending? (Yes).

  Let's write.

  *(Drafting thought)*: Start with the rain. It emphasizes the leak.
  *(Drafting thought)*: Make sure the forum interface is described simply. No names, just timestamps and "— A Resident."
  *(Drafting thought)*: Elias's post needs to look different visually. Bold text? No, just his name.

  *(Word Count Check during drafting)*: I need to expand on the internal state of Sarah and the physical state of Elias to ensure length and depth.

  *(Refining the Anonymous Truth)*: It should be about the town manager? No, too specific/villainous. It should be about the collective unwillingness to pay taxes. That's harder to say with a name attached. "We say we want the library, but we voted down the levy." That's the truth. Only a ghost can say it without being shunned immediately.

