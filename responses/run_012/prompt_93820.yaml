answer: |-
  The rain in Holloway did not fall so much as it hovered, a persistent mist that turned the brickwork of the library black and seeped into the mortar of the old community center. For years, the *Holloway Gazette* had printed the weather forecast on page two, alongside the minutes of the town council meetings. When the Gazette folded in October, there was a brief mourning period involving coffee at the diner and remarks about the cost of ink. Then, in November, the new site went live: Holloway Connect.

  It was free, democratic, and efficient. The convention was simple: no user profiles, no avatars. Every post, whether it was a notice about a lost beagle or a complaint about potholes, ended with the same signature: *— A Resident.*

  At first, it felt like an improvement. The Gazette had been owned by a man who lived in the city and rarely visited. Holloway Connect felt like the town talking to itself. In December, a resident found a wallet and returned it within an hour of posting. In January, three people organized a carpools for the school snow days. It was a nervous system for the town, firing without the delay of print.

  Sarah sat on the town planning board, a position she had accepted because she believed in fixing things. She was forty-five, wore cardigans even in summer, and kept a notebook where she wrote lists of tasks that she invariably completed. When the ceiling of the community center began to buckle in February, she knew what needed to be done. The roof needed patching before the spring thaw turned the leak into a flood.

  In the old days, she would have called the editor, or perhaps walked over to the manager's office. Now, she drafted a post. She wanted to gauge the town's willingness to support a special levy for the repairs. She typed carefully, emphasizing the history of the building, the children who used the gymnasium. She hit send.

  The response was immediate, and entirely reasonable.

  *— A Resident* wrote: "Is the roof the only issue? The heating system is also inefficient. Perhaps we should wait for a state grant."

  *— A Resident* wrote: "I love the center, but has anyone considered the cost relative to the unused west wing? Maybe we close that part."

  *— A Resident* wrote: "Just thinking out loud: if we wait until May, the contractors might be cheaper."

  Sarah read the comments in her kitchen while the coffee cooled. No one said no. No one was hostile. Everyone was concerned, prudent, and thoughtful. But the consensus was a fog. Every suggestion introduced a new variable, a new reason to wait, to reflect, to consider the broader picture. She wrote a reply, clarifying the urgency. The replies to her reply were polite corrections. *— A Resident* noted that urgency often led to poor bidding. *— A Resident* suggested forming a committee to study the bids.

  Sarah closed her laptop. The list in her notebook remained unfinished. She felt a strange lightness, as if the responsibility had been shared, but also a heaviness, as if the work had vanished into the air. She waited for the next meeting. She waited for the consensus that never crystallized.

  In March, a post appeared late at night. It was longer than the usual notices. It did not discuss the roof directly. Instead, it detailed the town's budget surplus from the previous year. It listed the line items where money had been allocated for maintenance but diverted to cosmetic improvements in the town square—new benches, flower beds, lighting that made the square look bright for visitors who never stayed. It calculated exactly how much of that diverted sum would have sealed the community center roof twice over.

  It was accurate. Sarah checked the public records the next morning. The numbers matched. The truth was cold and sharp; it explained why the town claimed poverty while planting petunias. It was the thing that needed to be said to break the paralysis.

  But the post ended with the standard signature: *— A Resident.*

  Sarah printed it out and brought it to the council meeting. She placed it on the table. The council members passed it around. They nodded. They agreed the information was compelling. They agreed it was unfortunate. Then the town manager suggested that since the source was anonymous, they could not verify the intent behind the data. Perhaps it was outdated. Perhaps it was taken out of context. To act on it might be to validate rumor.

  "We need verified testimony," the manager said.

  "Who wrote it?" Sarah asked.

  "We don't know," said the manager. "It's from a resident."

  "Did anyone own this?"

  Silence. The paper sat on the table. It was the truth, but it had no body. It could not be cross-examined. It could not be held accountable if it was wrong, and because it could not be held accountable, it carried no weight. It was everywhere, in every pocket phone, and nowhere. They discussed the post for forty minutes. They decided to table the budget review until the next quarter. The leak in the community center grew louder, a rhythmic dripping into a blue plastic bucket that echoed in the empty hall.

  Elias Thorne watched the screen from his armchair. He was seventy, a retired machinist with hands that still bore the scars of metal burrs. He had lived in Holloway for forty years. He remembered when a promise was a handshake, and a handshake meant you could be found at home in the evening.

  He saw the paralysis settling over the town like the mist. He saw Sarah's frustration in the way she walked her dog, head down. He saw the truth of the budget post rotting in the thread, buried by newer comments about the Easter parade route.

  He understood the comfort of the signature *— A Resident.* It allowed you to be kind without being vulnerable. It allowed you to be wise without being responsible. But the roof was going to fall.

  Elias opened his laptop. He did not log into Holloway Connect immediately. He sat for a long time, listening to the wind rattle the windowpane. He knew what he had to do, and he knew what it would cost. To speak as a resident was to speak as a ghost. To speak as Elias Thorne was to stand on the ground where anyone could kick you.

  He typed.

  *The roof cannot wait for a committee. The budget was diverted. I know this because I served on the finance subcommittee in 98 and I know the patterns. I am not asking for permission. I am organizing the repair. I will oversee the contracts. I will put up my own house as collateral for the bond if the town will not. If the roof fails, it is on me. If the money is misspent, come to my door. I am Elias Thorne. Call me.*

  He did not sign it *— A Resident.* He signed it with his name.

  He hit send.

  The reaction was not anger. Anger would have been human, specific. Anger would have meant someone cared enough to fight him. Instead, the reaction was a diffuse discomfort.

  *— A Resident* wrote: "Elias, no one doubts your integrity, but is this the proper channel?"

  *— A Resident* wrote: "We appreciate the offer, but putting up a home seems extreme. Surely there is a middle ground."

  *— A Resident* wrote: "This makes some of us uncomfortable. Why single yourself out?"

  The thread grew long. They discussed the precedent of private collateral. They discussed the liability insurance. They discussed whether Elias's health permitted such stress. They discussed everything except the roof. They discussed Elias until Elias was no longer a man offering help, but a topic, a problem to be managed.

  Sarah read the post. She felt a surge of hope, followed immediately by a chill. She wanted to call him. She wanted to say, "I'll stand with you." But she looked at the comments. She saw the caution. If she supported Elias, she would be part of his faction. She would be distinct. She would lose the cover of the board, of the consensus. She typed a reply. *— A Resident.* "We should discuss this at the next meeting."

  She closed the laptop. She had protected herself. She had also let the moment pass.

  Elias watched the comments accumulate. He saw the words swirl around his name, stripping it of its weight, turning his offer into just another opinion in the feed. He had tried to be the single individual, to stake his life on a truth. But the town had no mechanism to accept a stake. It only had a mechanism to process input.

  He stood up and put on his coat. He walked out into the rain. He went to the community center. The door was locked. He stood on the porch and listened to the water dripping inside. He knew he could break in. He knew he could climb up and lay tarps himself. But without the town's authorization, it would be vandalism. With the town's authorization, it was stuck in committee.

  He walked home. The forum was still glowing on his screen. A new post had appeared at the top of the thread.

  *— A Resident* wrote: "Has anyone seen Elias lately? He seems stressed. Maybe we should check on him."

  It was a kind post. It was a concerned post. It treated his action as a symptom of instability rather than a decision. It leveled him back down into the mass, a person to be watched, cared for, and monitored, but not followed.

  Winter dragged into spring. The rain continued. The blue bucket in the community center was moved twice to catch new drips. The town square flowers were planted in May, bright yellow and red against the gray brick. They looked lovely in the photos posted to Holloway Connect.

  *— A Resident* wrote: "Beautiful job on the square."

  *— A Resident* wrote: "Really brings the town together."

  Elias did not post again. He sat in his armchair. Sometimes people waved at him when he walked to the store, a quick, pitying wave. He waved back. He was no longer a neighbor in the sense of the forum. He was a specific point in space, and that made him isolated.

  Sarah sat at her kitchen table. The leak in the center had caused a collapse in the storage room. No one was hurt. It was just stuff. Old uniforms, paper records, mats. They were wet and ruined. The council voted to clean it up. The cost was added to the general fund. It was absorbed. It disappeared into the whole.

  She opened Holloway Connect. She began to type a post about the need for structural review. She looked at the cursor blinking at the end of the sentence. She looked at the signature line that would automatically append itself. *— A Resident.*

  She thought of Elias's name. She thought of the numbers in the anonymous budget post. She thought of the flowers in the square.

  She deleted the sentence. She closed the laptop. The house was quiet. Outside, the mist hung over the street, obscuring the houses across the way. You could see the lights on in their windows, but you could not see who was inside, or what they were doing, or if they were waiting for someone else to begin.

  The forum remained open. The stream of comments continued, a steady, gentle flow of words that meant everything and nothing, signed by everyone and no one. The town was safe. The town was dry. The town was waiting.
