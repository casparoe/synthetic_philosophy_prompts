answer: |-
  Based on the precedents Nadia has set, here is the breakdown of her doctrine, where she lands on Kim, and how to prove it.

  ### The Verdict on Kim
  **Nadia rules that Kim does NOT have standing.**

  Kim's complaint is dead on arrival. Even though Kim never personally typed a false number, she is functionally identical to Tom and Marco in Nadia's eyes. She is a beneficiary of the dishonesty she enforces, and she created the systemic pressure that makes the dishonesty necessary. In Nadia's doctrine, **architecting the lie is the same as telling the lie.**

  ### The Rule Nadia Is Actually Running
  **The Rule of Specific Integrity Accountability:**
  *To have standing to complain about a specific integrity violation (X), you must either (A) have never participated in X or enabled the conditions for X, OR (B) have participated in X but fully owned it and reformed. Being "less guilty" than the accused does not grant standing, and unrelated moral failings do not remove it.*

  **Why this fits the five precedents:**
  1.  **Tom (No Standing):** Violated X (fudging), did not own/reform. Fails condition B.
  2.  **Jen (Has Standing):** Violated X, but owned it and reformed. Meets condition B.
  3.  **Marco (No Standing):** Violated X, minimized/denied it (no ownership). Fails condition B.
  4.  **Omar (No Standing):** Violated X (minor), accused of X (major). "Less guilty" is irrelevant; he didn't own his minor violation. Fails condition B.
  5.  **Sam (Has Standing):** Violated Y (credit stealing), not X (fudging). Unrelated failings don't count. Meets condition A regarding X.

  ### Alternative Rules (And Why They Fail)
  To understand why the rule above is the only one that works, look at the rules that *almost* fit but break on the data:

  *   **The "Clean Hands" Rule:** *You can only complain if you've never done the thing.*
      *   **Fails on:** Jen. She fudged, but Nadia says she has standing.
  *   **The "Reformed Sinner" Rule:** *You can complain if you used to do it but stopped.*
      *   **Fails on:** Tom. He might argue he stops occasionally, but more importantly, this doesn't explain Sam (who never did it) or Omar (who stopped but has no standing).
  *   **The "Relative Severity" Rule:** *You can complain if your sin is smaller than theirs.*
      *   **Fails on:** Omar. His small fudge vs. the other guy's fabrication was rejected. Severity doesn't cure lack of accountability.
  *   **The "General Character" Rule:** *You can complain if you are generally ethical.*
      *   **Fails on:** Sam. He is explicitly described as "kind of a dick" and a credit-stealer, yet he has standing.

  ### Does Being the Manager Cut For or Against Her?
  **It cuts heavily against her.**

  In an individual contributor (like Omar or Tom), fudging is a tactical failure of honesty. In a manager (like Kim), setting impossible targets and tying bonuses to them is a **strategic failure of integrity**.

  Nadia runs engineering; she likely views managers as "system owners." If a developer lies, they break a rule. If a manager builds a system where lying is the only way to survive, she *breaks the game*. Nadia's distinction between Jen (who owned her mistake) and Marco (who said "everyone does it") proves she values **ownership of the culture**. Kim is doing exactly what Marco did—claiming the numbers are real while knowing "everyone does it" to hit her targets—but with higher authority. Her management role makes her more responsible for the truthfulness of the reports, not less.

  ### The Decisive Test Case
  To settle definitively whether Nadia views "Systemic Complicity" as equal to "Personal Action," you present her this scenario:

  **The Case of the Quiet Beneficiary:**
  > "Alex never fudged a report personally. However, Alex knows their team fudges their reports to hit deadlines. Alex knowingly accepts those reports, presents them to leadership as accurate to secure budget, and receives a bonus based on that budget. Alex then tells off a peer in a different department for fudging a report."

  *   **If Nadia says Alex HAS standing:** Her rule is strictly about **personal execution**. (Kim wins, because she didn't type the numbers).
  *   **If Nadia says Alex has NO standing:** Her rule includes **systemic complicity and benefit**. (Kim loses, because she built the system and took the bonus).

  **Prediction:** Nadia will say Alex has **no standing**. This confirms that in her doctrine, profiting from a lie you incentivized makes you just as guilty as the person who typed it.
