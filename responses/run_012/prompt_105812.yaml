answer: |-
  There is no single, universally established term that captures precisely what you are describing: the ontological status of an act that is simultaneously a *violation* in one coherent normative system and a *fulfillment* in another, without either system being dismissed as "incorrect."

  However, your observation sits at the intersection of two well-established academic frameworks. The structural context is usually called **Legal Pluralism** (the coexistence of state law and customary/social law), and the organizational dynamic is often described as **Competing Institutional Logics** (the clash between bureaucratic rationality and social/kinship rationality).

  But these terms describe the *systems*, not the *act* itself. To describe the specific phenomenon where a single action holds two contradictory moral truth-values simultaneously, I propose the term:

  ### **Normative Bivalence**

  #### **Definition**
  **Normative Bivalence** occurs when a single human act possesses two contradictory moral valences (e.g., "corrupt" vs. "dutiful") that are simultaneously valid within their respective normative orders. Unlike a dilemma where one must choose between right and wrong, Normative Bivalence describes a state where the act *is* right and wrong at the same time, depending on which authoritative framework is applied, with no higher meta-rule to resolve the contradiction.

  In a state of Normative Bivalence:
  1.  **Facts are undisputed:** All parties agree on what happened.
  2.  **Systems are intact:** Neither normative order is viewed as broken or illegitimate by its adherents.
  3.  **Validity is simultaneous:** The act does not cease to be a "duty" just because it is also a "breach." Both labels stick.

  ---

  ### **How it differs from related concepts**

  You asked to distinguish this from moral relativism, value pluralism, and essentially contested concepts. Here is how **Normative Bivalence** separates itself from those ideas:

  #### **1. Vs. Moral Relativism**
  *   **Moral Relativism** suggests that moral truth is dependent on the observer's culture, implying that there is no objective standpoint from which to judge the act. It often leads to a shrug: *"Who are we to say it's corruption if their culture says it's duty?"*
  *   **Normative Bivalence** rejects the shrug. It acknowledges that the funder's auditors are *objectively correct* within the framework of public financial management, and the officer is *objectively correct* within the framework of kinship obligation. It is not that truth is relative; it is that the act sits in the overlap of two absolute truths. Relativism dissolves the conflict; Bivalence preserves the tension.

  #### **2. Vs. Value Pluralism**
  *   **Value Pluralism** (e.g., Isaiah Berlin) posits that there are many genuine human values (liberty, equality, loyalty) that may conflict, requiring the actor to make a tragic choice to prioritize one over the other.
  *   **Normative Bivalence** is not about choosing values; it is about the **classification of the act**. In your example, the officer isn't necessarily weighing "loyalty vs. honesty." He is performing an act that *constitutes* loyalty precisely by *breaching* honesty. Value Pluralism asks, "Which good do I choose?" Normative Bivalence states, "This act *is* both a good and a bad, and I cannot separate them."

  #### **3. Vs. Essentially Contested Concepts**
  *   An **Essentially Contested Concept** (e.g., "justice," "democracy," "corruption") implies that the disagreement is about the *definition* of the word. If corruption were merely essentially contested, the debate would be semantic: *"Is this really corruption?"*
  *   **Normative Bivalence** accepts that the definition is clear. The auditors define corruption as "private gain from public office," and it fits. The villagers define duty as "supporting kin when able," and it fits. The conflict is not about what the words mean; it is about the fact that the world contains overlapping jurisdictions where the same behavior triggers opposite definitions. It is a collision of **application**, not definition.

  ### **Why this distinction matters for your work**
  Naming this **Normative Bivalence** allows you to move past the unproductive debate of "is it culture or is it crime?"

  *   If you call it **Relativism**, you undermine the rule of law you are hired to uphold.
  *   If you call it **Corruption**, you undermine the social cohesion you rely on to implement programs.
  *   If you recognize it as **Normative Bivalence**, you acknowledge that the friction is structural, not merely behavioral. It suggests that anti-corruption interventions cannot simply punish the act (which enforces one order by destroying the other) but must address the **interface** between the orders.

  It shifts the problem from "How do we stop this officer?" to "How do we design a system where fulfilling a kinship duty does not require breaching a public trust?" That is a much harder design problem, but it is the actual problem you are facing.
