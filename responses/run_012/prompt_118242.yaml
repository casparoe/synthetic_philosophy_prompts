answer: |-
  ### Confidence Scores

  1.  **0.90** – Intent matters everywhere, even if liability rules differ.
  2.  **0.30** – Collective guilt is common in kinship-based societies.
  3.  **0.80** – Coercion undermines consent in almost all contract systems.
  4.  **0.70** – Ancestor veneration and reputation are globally significant.
  5.  **0.45** – Identity is metaphysical; views vary on substance vs. function.
  6.  **0.95** – Tacit knowledge is a basic feature of human cognition.
  7.  **0.55** – Negligence is treated as killing in many legal/religious systems.
  8.  **0.50** – Theological determinism and karma challenge free will intuitions.
  9.  **0.60** – Many view morals as divine commands or social agreements, not facts.
  10. **0.20** – Property concepts vary wildly between foragers and agrarians.
  11. **0.50** – Duty to lineage is common; duty to abstract future people is not.
  12. **0.10** – Procedural justice is a modern, bureaucratic concern.

  ### Variation Table

  | Item | Score | Why | Variation Hinge |
  | :--- | :--- | :--- | :--- |
  | 1 | 0.90 | Intent triggers different emotional responses globally. | Legal institutions |
  | 2 | 0.30 | Kinship groups often share honor and shame collectively. | Kinship |
  | 3 | 0.80 | Volition is generally required for a valid agreement. | Legal institutions |
  | 4 | 0.70 | Ancestors remain social actors in many belief systems. | Religion |
  | 5 | 0.45 | Some cultures prioritize material continuity, others function. | Formal schooling |
  | 6 | 0.95 | Intuition and skill exist independent of language. | Nothing |
  | 7 | 0.55 | Omission is seen as causation in many duty-based ethics. | Legal institutions |
  | 8 | 0.50 | Predestination and karma negate "could have done otherwise." | Religion |
  | 9 | 0.60 | Morals are often seen as commands or customs, not facts. | Religion |
  | 10 | 0.20 | Land is often communal or spiritual, not ownable by individuals. | Subsistence |
  | 11 | 0.50 | Obligations extend to descendants, not abstract non-existents. | Kinship |
  | 12 | 0.10 | Requires abstract view of institutions vs. human agents. | Market economy |

  ### Tier List

  **Tier 1: Near Biological Universals**
  *   **Item 6:** Tacit Knowledge (0.95)
  *   **Item 1:** Intent vs. Accident (0.90)

  **Tier 2: Strong Cross-Cultural Intuitions**
  *   **Item 3:** Coerced Promises (0.80)
  *   **Item 4:** Wronging the Dead (0.70)

  **Tier 3: Mixed Global Consensus**
  *   **Item 9:** Moral Realism (0.60)
  *   **Item 7:** Act vs. Omission (0.55)

  **Tier 4: Highly Variable / Philosophical**
  *   **Item 8:** Responsibility without Choice (0.50)
  *   **Item 11:** Obligations to Future (0.50)
  *   **Item 5:** Ship of Theseus (0.45)

  **Tier 5: Local or Modern Inventions**
  *   **Item 2:** No Grandparent Punishment (0.30)
  *   **Item 10:** First Possession Land Rights (0.20)
  *   **Item 12:** Institutional Procedure Justice (0.10)

  ### Verbal Disagreements

  There are three items where the disagreement is likely about definitions rather than values.

  *   **Item 5 (Same Boat):** The disagreement hinges on what "same" means. One reading is **material continuity** (the original wood must remain). The other is **functional continuity** (the role and structure remain). People agree on the facts but disagree on the label.
  *   **Item 8 (Could Have Done Otherwise):** The disagreement hinges on **physical possibility** vs. **moral capacity**. One reading is "Was there a physical barrier?" (No). The other is "Was the choice truly free given prior causes?" (Maybe not).
  *   **Item 12 (Wronged by Machine):** The disagreement hinges on **outcome** vs. **agency**. One reading is "Did I get the result I expected?" (Yes, so no wrong). The other is "Was I treated by a moral agent?" (No, so I was wronged).

  ### Least Sure Items

  These are the items where my confidence in the score is lowest (closest to a 50/50 split globally).

  1.  **Item 8 (Responsibility without Choice):**
      *   *Observation to change mind:* Extensive ethnographic data showing that societies with strong predestination beliefs (e.g., strict Calvinist or Islamic communities) still assign blame identically to societies with strong free-will beliefs. If the *practice* of blaming doesn't change despite the *theory* of determinism, the intuition is more universal than the theology suggests.
  2.  **Item 11 (Owe to People Who Don't Exist):**
      *   *Observation to change mind:* Evidence that subsistence societies consistently make sacrifices or resource investments specifically labeled for "great-grandchildren" rather than just "children" or "ancestors." If long-term planning is consistently framed as debt to the unborn rather than duty to the lineage, the score goes up.
  3.  **Item 5 (Ship of Theseus):**
      *   *Observation to change mind:* A linguistic study showing that languages without formal schooling lack a word for "identity" over time for objects, treating replaced objects as strictly new entities. If the grammar itself forces a "new object" classification, the intuition is not universal.

  ### Swap Suggestion

  **Weakest Item:** Item 12 (Machine/Institution Wronging).
  **Reason:** It is anachronistic. It tests reactions to modern bureaucracy and algorithms, which didn't exist for 99% of human history. It tells you about software engineers, not humans.

  **Swap In:** **"It is acceptable to lie to a stranger if it protects a family member from harm."**

  **Why this is better:**
  This tests the conflict between **Universalism** (rules apply to everyone equally) and **Particularism** (loyalty to kin comes first). This is a massive fault line in global fairness.
  *   **Western/Legalistic cultures** tend to say lying is wrong regardless of who you protect (Universalism).
  *   **Kinship/Collectivist cultures** often say protecting the family is the highest duty, even if it breaks abstract rules (Particularism).
  *   It directly impacts your product: Will users expect the system to treat everyone exactly the same, or will they expect the system to allow flexibility for relationships? This is a much more practical reality check for fairness guidance than algorithmic procedure.
