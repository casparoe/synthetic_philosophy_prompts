prompt: |-
  You are an expert on Wittgenstein's later epistemology and, at the same time, someone with genuine experience writing decision procedures that institutions have to defend in writing. I am a final-year undergraduate taking a seminar on Wittgenstein's remarks on certainty, and I also work part-time at my university's research integrity office, where I am the first reader of complaints about published research. I have roughly twenty minutes per file to decide what the office does with a complaint before the review committee meets, and my supervisor has asked me to write up our triage procedure, because at the moment the outcome depends far too much on who happens to be on duty.

  Here is the problem the procedure has to solve. Almost every complaint we receive is aimed not at a study's results but at one of the background propositions the study never argues for: that the instrument was working, that the reference material was what it said on the label, that the outcome measure measures the thing it is named after, that our own published record is the record. We cannot investigate all of these, and we cannot simply refuse them either. I want a procedure that makes the refusals principled rather than administrative, and that keeps faith with what the later Wittgenstein actually says about doubt, as far as I understand it: that doubting one thing always presupposes other things standing fast; that some propositions function as the hinges on which our questions turn rather than as answers within them; that we hold these without grounds, having absorbed them in training rather than established them by testing; and that they are not frozen forever, since the riverbed of our thinking can shift, though not because a single finding knocked it loose. Correct me if that reading is crude, but build on it rather than replacing it with a general essay on scepticism.

  Our seminar instructor has been using a rough four-way distinction, and I would like you to adopt it, refine it, or tell me where it breaks down: (1) constitutive hinges, propositions that are part of what it is to do this kind of inquiry at all; (2) load-bearing empirical hinges, ordinary factual claims nobody in the field has ever had reason to doubt and that the field's methods cannot check without already presupposing them; (3) institutional hinges, propositions held fixed for legal or procedural reasons; and (4) propositions that only look like hinges because the person complaining has never seen them questioned. I suspect most complaints actually live in category 4, and I want the procedure to separate that category from the others rather than lumping everything under the heading of background assumption.

  The central test I want the procedure to run — please check whether it is really the right test — is whether the proposition could in principle be re-opened by some recognized procedure in the field, however expensive or rarely used, without first presupposing itself. If yes, it is not a hinge for us and the complaint goes to investigation. If every available check presupposes it, then the complaint is not a complaint about evidence at all; it is a proposal to change the practice, and our office is the wrong body to hear it. Say clearly what the office should do instead, and be honest that the complainant will experience that as a brush-off.

  The procedure itself should be a set of questions in order, each with (a) what counts as a sufficient answer, (b) what to do when no answer is available, (c) whether a clerk like me can answer it or whether it needs a scientist, and (d) where the procedure must stop and hand the matter to a person, because the remaining question is about values — how much disruption we are willing to impose on a researcher's career, whose certainty gets to count as the field's certainty — rather than about facts. Include explicit stop rules. Bear in mind that a doubt with no stopping point leaves the office incapable of concluding anything at all, and that this is a real failure mode and not merely a philosophical curiosity.

  Then run the procedure, step by step, on three complaints, at least one of which should produce an outcome I will find uncomfortable: first, a complaint that a laboratory's sample-handling instrument was out of calibration for the entire period of a study; second, a complaint that the standard measure used across an entire research area does not measure what its name says it measures; third, a complaint that our office's own file on a case was altered, so that the record I would rely on is itself in question. For each, say where the procedure lands and why, and give me one paragraph of plain language that I could send to the complainant.

  Finally, include a short section on what the procedure cannot do: the cases it will get wrong, the ways in which treating something as a hinge can be abused as a way of protecting the assumptions of whoever happens to hold power in a field, and how the procedure should be revised as the field's riverbed shifts. Do not give me a bibliography, a reading list, or citations of any kind — I am not asking you to attribute anything to anyone, and I would rather you define any term you need in your own words. If you need a concrete fact about a real case, invent the case and mark it as invented. Before you write anything, spend some time brainstorming the distinctions you think must survive translation into a procedure and the ones that can be dropped; then write the procedure for someone who will read it in two years and will not have taken the seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Expert on Wittgenstein's later epistemology (specifically *On Certainty*) AND experienced writer of institutional decision procedures.
      *   **User:** Final-year undergrad (Wittgenstein seminar) + part-time staff at Research Integrity Office (RIO).
      *   **Task:** Create a triage procedure for research complaints based on Wittgensteinian "hinge" epistemology, refined by the user's 4-way distinction.
      *   **Constraints:**
          *   No bibliography/citations.
          *   Define terms in own words.
          *   Invent concrete facts if needed.
          *   Time limit context: ~20 mins per file.
          *   Audience for procedure: Future staff (2 years later, no seminar background).
          *   Specific Test to Evaluate: "Could this proposition be re-opened by a recognized procedure without presupposing itself?"
          *   Structure: Brainstorming -> The Procedure (questions, stop rules, roles) -> Application to 3 Cases (one uncomfortable) -> Limitations/Abuses.
          *   Tone: Philosophical rigor meets bureaucratic practicality. Honest about the "brush-off" nature of some outcomes.

  2.  **Brainstorming & Philosophical Calibration:**

      *   *Wittgenstein's On Certainty:* The core idea is that doubt requires certainty. You can't doubt everything at once. Some propositions function as "hinges" (fixed points) allowing the door of inquiry to swing. They aren't known via evidence; they are the framework *for* evidence. They can shift (riverbed), but slowly and collectively, not via a single empirical refutation.
      *   *The User's 4-Way Distinction:*
          1.  *Constitutive:* What makes the inquiry possible (e.g., logic, existence of external world).
          2.  *Load-bearing Empirical:* Facts treated as certain for now (e.g., gravity works, standard reagents are real).
          3.  *Institutional:* Fixed for rules/legal reasons (e.g., statute of limitations, official records).
          4.  *Pseudo-hinges:* Things that *look* fixed but are actually open to question (e.g., a specific calibration log).
      *   *The Central Test:* "Can it be checked without presupposing itself?" This is strong but needs nuance. Sometimes a check exists but is prohibitively expensive or destructive. The procedure needs to distinguish between "logically impossible to check without circularity" and "practically impossible for this office."
      *   *The Tension:* Wittgenstein says hinges aren't justified by evidence. Institutions need justification for *not* investigating. The procedure must translate "this is a hinge" into "this is outside our mandate."
      *   *The "Uncomfortable" Outcome:* Likely the case where a fundamental measure is challenged (Case 2). If the measure is a hinge for the field, the RIO cannot investigate it without dismantling the field. This feels like protecting power, but epistemologically, it's necessary for function.
      *   *Case 3 (The Record):* This attacks the institution's own hinge. If the record is doubted, the office's authority is the hinge. This needs careful handling.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Make it usable by a clerk in 2 years. No jargon like "epistemic framework." Use "Foundational Assumption" instead of "Hinge."
      *   *Structure:* Flowchart style logic.
      *   *Step 1: Identification.* Is this about data or the framework?
      *   *Step 2: The Check Test.* Can we check this without assuming it's true?
      *   *Step 3: Authority.* Who decides? (Clerk vs. Scientist vs. Committee).
      *   *Step 4: The Stop Rule.* When do we say "This is a policy change, not a misconduct investigation"?
      *   *Refining the Test:* The user's test is good but needs a "cost/feasibility" clause. If checking it requires destroying the only evidence, it's functionally a hinge for *this* investigation.
      *   *Stop Rules:* Crucial. If the doubt undermines the office's ability to exist (e.g., "records are fake"), we can't investigate internally. Need an external escalator.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Instrument Calibration):* This is usually Category 4 (Pseudo-hinge). Calibration logs exist. It *can* be checked. Outcome: Investigate.
      *   *Case 2 (Validity of Standard Measure):* This is Category 2 (Load-bearing Empirical). If the "Depression Scale" doesn't measure depression, the whole field is shaky. Checking it requires a meta-study, not an integrity check. Outcome: Dismiss as outside scope (The Uncomfortable One).
      *   *Case 3 (Altered Office Record):* This is Category 3 (Institutional) but contested. If the record is the hinge, doubting it attacks the court itself. Outcome: Escalate to external audit (cannot be self-investigated).

  5.  **Addressing the Limitations/Abuses:**

      *   Hinges protect power. If the "experts" say X is a hinge, they silence dissent.
      *   Riverbed shifts. What was a hinge yesterday (e.g., "ulcers are caused by stress") is empirical today. The procedure needs a review mechanism.
      *   The "Brush-off": Acknowledge that telling a complainant "this is a hinge" feels like "go away." It is. But necessary.

  6.  **Refining the Tone:**

      *   Needs to sound like a manual but written by a philosopher.
      *   Avoid academic citations.
      *   Ensure the distinction between "fact" and "value" is clear in the procedure (Step 4).
      *   Make sure the "Uncomfortable" case is handled honestly.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the Central Test too rigid?
      *   *Fix:* Add a "Practical Feasibility" clause. A check that costs $10M is effectively a hinge for a university office.
      *   *Critique:* Is the Wittgensteinian connection clear enough without being pretentious?
      *   *Fix:* Use the "Riverbed" metaphor in the limitations section. Keep the procedure language secular/bureaucratic but grounded in the logic of "framework vs. content."
      *   *Critique:* Did I answer the specific prompt about the 4 categories?
      *   *Fix:* Explicitly map the procedure steps to these categories in the analysis.
      *   *Critique:* The user asked to "Correct me if that reading is crude."
      *   *Fix:* Add a brief preamble validating the reading but sharpening the "shift" aspect. Hinges aren't just "untested," they are "grammatical" rules of the game.

  8.  **Final Polish:**

      *   Check word count and pacing.
      *   Ensure the "Plain Language" paragraphs for complainants are distinct and realistic.
      *   Verify the "Stop Rules" are explicit.

  *(Self-Correction Note during drafting the response)*: I need to make sure I don't just write an essay. The core deliverable is the *procedure*. The philosophical justification should frame it, not overwhelm it. The user wants to *use* this.

  Let's organize the response:
  1.  **Philosophical Calibration:** Briefly validate the Wittgenstein reading and the 4 categories.
  2.  **The Procedure:** The actual decision tree.
  3.  **Case Applications:** Running the tree.
  4.  **Limitations:** The political/ethical risks.

  *Wait, one constraint:* "Before you write anything, spend some time brainstorming the distinctions you think must survive translation into a procedure and the ones that can be dropped." I should make this thinking visible or at least integrated into the intro. I will integrate it into the preamble to show the work.

  *Another constraint:* "Do not give me a bibliography... or citations." I must adhere strictly to this.

  *Another constraint:* "Write the procedure for someone who will read it in two years and will not have taken the seminar." The language in the procedure box must be jargon-free.

  *Let's refine the Central Test:* The user asks: "Is whether the proposition could in principle be re-opened by some recognized procedure in the field, however expensive or rarely used, without first presupposing itself."
  *My critique:* "However expensive" is dangerous for an office with a budget. I need to modify this to "recognized procedure *accessible to this office* or *standard in the field*." If the only check is a meta-analysis taking 5 years, it's a hinge *for this triage*. I will refine this in the procedure.

  *Let's refine the 4 Categories:*
  1. Constitutive (Logic/World exists) -> Automatic Dismissal.
  2. Load-bearing Empirical (Standard measures) -> Dismiss as Policy/Field Issue.
  3. Institutional (Records/Statutes) -> Dismiss unless external audit triggered.
  4. Pseudo-hinges (Calibration/Specific Data) -> Investigate.

  Okay, ready to write.
answer: |-
  ### Part 1: Philosophical Calibration and Distinctions

  Your reading of the later Wittgenstein is not crude; it is functionally accurate for this context. The core insight—that doubt is a move within a game, not a suspension of the game itself—is exactly what an integrity office needs to avoid infinite regress. If every complaint forces us to question the tools used to judge the complaint, the office ceases to function.

  However, for a procedure to work in two years, we must drop the philosophical vocabulary. A future clerk does not need to know about "hinges" or "riverbeds." They need to know the difference between a *move in the game* (a specific error in a study) and a *challenge to the rules* (a claim that the game itself is broken).

  Regarding your four-way distinction:
  1.  **Constitutive:** Keep. These are logical impossibilities for the office to address (e.g., "logic is false").
  2.  **Load-bearing Empirical:** Keep, but rename. These are "Field Foundations." They are empirical but treated as fixed for the sake of the field's continuity.
  3.  **Institutional:** Keep. These are "Procedural Foundations."
  4.  **Pseudo-hinges:** This is the most important category. These are claims that *look* foundational but are actually specific, testable empirical claims.

  **Critique of Your Central Test:**
  Your test ("Could it in principle be re-opened... without presupposing itself?") is logically sound but administratively dangerous. "In principle" allows for infinite cost. A procedure must account for *access*. If the only way to check a proposition requires resources the office does not have and cannot compel (e.g., a decade-long meta-study), it functions as a hinge *for this office*, even if it is empirical in the abstract.

  **Refinement:** We will add a "Feasibility Clause." A proposition is treated as a hinge if checking it requires dismantling the very system used to check it, OR if the check is outside the mandate/resources of this office.

  ***

  ### Part 2: The Triage Procedure (Version 1.0)

  **Purpose:** To determine whether a complaint alleges a specific violation of research standards (Investigable) or challenges the foundational assumptions of the field or institution (Non-Investigable).
  **Time Limit:** 20 minutes per file.
  **User:** Triage Officer (Clerk).

  #### Step 1: The Specificity Check
  **Question:** Does the complaint identify a specific instance of deviation (e.g., "on Date X, Instrument Y showed Value Z") or does it challenge a general standard (e.g., "Instrument Y never measures what it claims")?

  *   **(a) Sufficient Answer:** The complaint points to a specific log, file, sample, or decision event.
  *   **(b) No Answer Available:** The complaint is general, philosophical, or attacks the validity of the field itself.
  *   **(c) Who Answers:** Clerk.
  *   **(d) Stop Rule:** If the complaint is general (attacks the standard, not the usage), mark as **Category A (Field Foundation)** and proceed to Step 4. Do not investigate.

  #### Step 2: The Circularity Check (The Central Test)
  **Question:** To verify the complainant's claim, would we have to assume the claim is false? (Example: To check if the log is fake, can we look at the log? Or do we need an external audit?)

  *   **(a) Sufficient Answer:** There is an independent record or method to verify the claim (e.g., calibration logs, raw data backups, third-party certification).
  *   **(b) No Answer Available:** The only evidence for the claim is the thing being doubted (e.g., "The record is fake" but the only record is the one alleged to be fake).
  *   **(c) Who Answers:** Clerk (for documents), Scientist (for methods).
  *   **(d) Stop Rule:** If verification is circular *and* internal, mark as **Category B (Institutional Foundation)**. Do not investigate internally. Escalate to External Audit.

  #### Step 3: The Feasibility Check
  **Question:** Is there a recognized method in the field to test this proposition that this office can reasonably access or commission?

  *   **(a) Sufficient Answer:** Yes, standard validation protocols exist (e.g., re-running a sample, checking calibration certificates).
  *   **(b) No Answer Available:** Testing this would require a new research program, invalidating years of literature, or costs exceeding office authority.
  *   **(c) Who Answers:** Scientist (Consultant).
  *   **(d) Stop Rule:** If the test requires a new research program, mark as **Category A (Field Foundation)**. Do not investigate.

  #### Step 4: The Value Judgment (The Hard Stop)
  **Question:** If we accept this complaint as valid, does it require changing the rules of the field or the university, rather than correcting a single researcher?

  *   **(a) Sufficient Answer:** No, it corrects a specific error.
  *   **(b) No Answer Available:** Yes, it implies the standard operating procedure is wrong.
  *   **(c) Who Answers:** Director/Committee (Not Clerk).
  *   **(d) Stop Rule:** If the outcome is a policy change, close the integrity case. Refer the complainant to the Standards Body or Policy Committee. **End Procedure.**

  ***

  ### Part 3: Application to Three Cases

  Here is how the procedure lands on three specific complaints. Note the "Uncomfortable" outcome in Case 2.

  #### Case 1: The Calibration Complaint
  **Complaint:** "The mass spectrometer in Lab 4 was out of calibration for the six months of the study. The logs were forged."
  **Procedure Run:**
  *   **Step 1 (Specificity):** Specific instance (Lab 4, 6 months). **Pass.**
  *   **Step 2 (Circularity):** Can we check without assuming the logs are true? Yes. We can check the machine's internal error memory, compare with standard reference materials from the same batch, or interview the technician. **Pass.**
  *   **Step 3 (Feasibility):** Is there a method? Yes, standard calibration verification. **Pass.**
  *   **Outcome:** **Investigate.** This is a Category 4 (Pseudo-hinge). It looks like a background assumption ("machines work"), but it is actually a specific empirical claim that can be tested without dismantling the field.
  *   **Plain Language to Complainant:**
      > "Thank you for your submission. Our office has reviewed your claim regarding the calibration of the mass spectrometer in Lab 4. Because this allegation concerns a specific instance of equipment maintenance that can be verified against independent service records and reference samples, it falls within our mandate. We are opening a preliminary inquiry to examine the calibration logs and instrument performance data for the period in question. We will contact you when the initial fact-finding is complete."

  #### Case 2: The Measure Validity Complaint (The Uncomfortable One)
  **Complaint:** "The 'Cognitive Resilience Scale' (CRS) used in this study (and 500 others in this field) does not measure resilience. It measures socioeconomic privilege. The results are therefore meaningless."
  **Procedure Run:**
  *   **Step 1 (Specificity):** General challenge. It attacks the *tool*, not the *use* of the tool in this specific instance. **Fail.** (Mark Category A).
  *   **Step 2 (Circularity):** To prove the CRS is invalid, one must propose a better measure of resilience. But the field defines resilience *by* the CRS. Checking this presupposes the CRS is wrong. **Fail.**
  *   **Step 3 (Feasibility):** Validating a psychometric instrument requires a meta-scientific research program, not an integrity investigation. This office cannot commission a new theory of psychology. **Fail.**
  *   **Step 4 (Value Judgment):** Accepting this would invalidate the published record of the entire department, not just one researcher. This is a policy/paradigm shift. **Stop.**
  *   **Outcome:** **Dismiss as Non-Investigable.** This is a Category 2 (Load-bearing Empirical Hinge). For this field, right now, "CRS measures Resilience" is a hinge. To doubt it is to propose a new field, not correct a mistake.
  *   **Plain Language to Complainant:**
      > "We have reviewed your concern regarding the validity of the Cognitive Resilience Scale (CRS). Our office is mandated to investigate violations of established research standards, not to adjudicate debates about the standards themselves. The CRS is currently the accepted instrument for this field. Determining whether the instrument is fundamentally flawed is a scientific question that requires new research and consensus-building across the discipline, rather than an investigation into researcher misconduct. We are closing this file, but we encourage you to submit your theoretical critique to the relevant professional association for their review."

  #### Case 3: The Altered Record Complaint
  **Complaint:** "The Research Integrity Office's own file on Case #990 was altered. The decision letter I received is not the one that was voted on. I cannot trust any record you show me."
  **Procedure Run:**
  *   **Step 1 (Specificity):** Specific instance (Case #990 file). **Pass.**
  *   **Step 2 (Circularity):** To check if the file was altered, we must look at the file. If the file is the object of doubt, we cannot use it to verify itself. Internal logs are also part of the "file." **Fail.** (Mark Category B).
  *   **Step 3 (Feasibility):** No internal method exists.
  *   **Step 4 (Value Judgment):** This attacks the institutional hinge. If the office's record is not the record, the office cannot function.
  *   **Outcome:** **External Escalation.** This is a Category 3 (Institutional Hinge). We cannot investigate ourselves.
  *   **Plain Language to Complainant:**
      > "Your complaint alleges that the official records of this office have been compromised. Because this allegation concerns the integrity of our own administrative process, this office cannot conduct an internal investigation without creating a conflict of interest. We are unable to verify our own records using our own records. We are referring this matter to the University Ombudsperson for an independent administrative audit. Please direct further correspondence to their office."

  ***

  ### Part 4: Limitations and Risks

  This procedure is a tool for stability, not truth. You must understand where it will fail and how it can be weaponized.

  **1. The Protection of Power:**
  The greatest risk is that "Field Foundations" (Category 2) are simply the assumptions of the dominant group in a field. Historically, many "hinges" (e.g., that certain populations are biologically distinct in specific ways) were later revealed to be false. By refusing to investigate challenges to these hinges, this procedure protects the status quo. It treats current consensus as epistemic bedrock. When the riverbed shifts, this office will look like it was on the wrong side of history. There is no fix for this within the procedure; it is the cost of having a procedure at all.

  **2. The "Riverbed" Blind Spot:**
  The procedure assumes the hinge status of a proposition is stable. It is not. A proposition can move from Category 2 (Foundation) to Category 4 (Investigable) overnight if a new technology emerges. For example, before DNA sequencing, "this tissue sample is from a human" was a hinge assumed by visual inspection. After sequencing, it became a testable empirical claim. This procedure must be reviewed annually. If a field begins to question its own hinges publicly, the office must pause and re-categorize those propositions from "Foundation" to "Investigable."

  **3. The Experience of the Brush-Off:**
  To the complainant in Case 2, the outcome is indistinguishable from a cover-up. They are being told, "You are right that this might be unproven, but we are not allowed to check." This is honest, but it will breed distrust. You cannot mitigate this with kinder language. The only mitigation is transparency: publish this triage logic. Let them see that the refusal is structural, not personal.

  **4. The Infinite Regress Failure Mode:**
  If you do not apply the Stop Rules, you enter the sceptical spiral Wittgenstein warned against. If you investigate the calibration (Case 1), the respondent may ask, "But how do you know the calibration tool is calibrated?" If you answer that, you must check the calibration of the calibration tool. The procedure stops this by declaring that at some point, the tools are "given." If a complainant refuses to accept the stopping point, they are no longer filing a complaint; they are opting out of the practice. The procedure allows you to close the file not because you are sure you are right, but because continuing makes the office's function impossible.

  **Final Note for the Future Clerk:**
  You are not a judge of ultimate truth. You are a gatekeeper of a specific practice. Your job is to distinguish between a player making a bad move and a player demanding a different game. Investigate the bad moves. Refer the rule-changers to the legislature. Do not confuse the two.
