  1. Pain asymbolia establishes that the sensory discrimination of bodily damage is neurologically separable from the affective reaction that typically makes such sensations matter to us.
  2. The condition suggests that the felt awfulness is not intrinsic to the sensation but is instead coupled with the motivation to escape, meaning the suffering can vanish even if the sensation remains.
  3. Patient reports that it hurts carry limited authority here, as their behavioral indifference settles the matter by showing they lack the aversive response that defines genuine suffering.
  4. A drug inducing this state would count as treating the pain rather than merely disguising it, because it eliminates the aversive quality that makes the experience something rationally to be avoided.
  5. Consequently, such a state is not bad for the person who has it, since the harm of pain lies in its unpleasantness rather than the mere presence of nociceptive information.
