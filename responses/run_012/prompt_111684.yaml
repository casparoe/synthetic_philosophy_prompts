prompt: |-
  I've ended up with a slightly odd little project and I can't get it out of my head. I'm trying to write a simulation of Thomson's lamp — the one where a lamp gets flicked on, then off, then on, with each gap between flicks being half the length of the one before, so the whole sequence gets done in a finite stretch of time (two minutes, I think, if the first gap is a minute). By the end of that you've flicked the switch infinitely many times, and the puzzle is whether the lamp is on or off.

  My plan was just to code it up, let it run for a few million iterations, and print out whatever the variable says. A mate says that's missing the point and that I should be taking the limit of the sequence of states instead — but I can't get the limit to exist, it just alternates on, off, on, off, so the simulation is the only thing that actually hands me a number. Still, at the end the lamp has to be on or off, there's no third possibility, so there must be a correct answer and I just need the right method to compute it.

  Two things I can't sort out. First: if I run the same thing but start with the lamp off, do I get the opposite answer or the same one? Second: someone told me that the matching number series (the +1, −1, +1, −1 one) can be assigned a value of a half under some generalised definition of summing, and that this might mean the lamp is half-on at the end. Is that the answer? It sounds mad but it would at least explain why the limit won't settle down.

  He also reckons no real lamp could do it because the switch would have to move infinitely fast — but that's a physics point, not a philosophy one, right?

  Be honest with me about where your reasoning is weakest here, and tell me what would have to turn out to be true for you to say that actually yes, there is a fact of the matter and the lamp is definately on (or definately off) at the end. I'd rather know what would change your mind than get a tidy answer.
