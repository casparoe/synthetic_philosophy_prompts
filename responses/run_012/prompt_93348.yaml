      *   *The Token Critique:* As noted by the user, using tokens assumes commensurability.
      *   *Fix:* Explicitly frame the tokens as "Bureaucratic Points" that *fail* at the high end. The failure is the data point.

  7.  **Addressing the "Limitations":**

