      *Actually, keep tokens for Round 1 to establish the market. In Round 2, offer "All the tokens in the bank." If they still say no, the token system breaks.*

      *Let's refine the "Real Stake".*
      Holding a heavy textbook overhead is easier to monitor than a wall sit in a seminar room. Let's go with **The Heavy Hold**. Hold a 5lb weight (or stack of books) overhead for 45 seconds.
      *Reward:* A high-quality chocolate square (real).
      *Round 1:* Bid for the 45s hold. (Commensurability established).
      *Round 2:* Hypothetical 30-minute hold. Offer "Lifetime supply of chocolate" (Hypothetical). (Incommensurability revealed).
