answer: |-
  You are right to reject the existing labels. Your intuition is precise: Hacking's looping effect is about *identity* (the label changes the person), Goodhart's law is about *metrics* (the measure stops working), and malingering is about *deception* (the person lies). What you are describing is a structural co-evolution between a *gatekeeping instrument* and a *population seeking access*, where the instrument's attempt to preserve validity actively destroys it.

  There is no single, universally accepted term for this specific configuration. In psychometrics, pieces of it are called "response bias" or "construct irrelevance," and in economics, it touches on the "Lucas Critique" (policy changes behavior). But none of these capture the *cycle of definitional tightening* that you've identified as the core engine.

  Since you asked for it to be carved properly, I will coin a term for it. I propose calling this **The Validity Spiral**.

  Here is the carving, the differentiation, and the boundary conditions.

  ### The Definition: The Validity Spiral

  **The Validity Spiral** is a feedback loop in consequential classification systems where:
  1.  **Incentivized Reporting:** Subjects adapt their self-reporting to match a diagnostic instrument, driven by the entitlements the diagnosis unlocks (not by adopting the identity).
  2.  **Defensive Specificity:** Experts respond to rising false positives by increasing the complexity and specificity of the criteria (adding exclusions, nuance, or items).
  3.  **Target Sharpening:** This increased specificity provides a clearer map for subjects to aim at, further decoupling the score from the underlying phenomenon.
  4.  **Validity Erosion:** The category becomes statistically precise but phenomenologically hollow, eventually relying on the very clinical intuition the instrument was designed to replace.

  ### Differentiation from Neighbours

  To use this term without confusion, you need to be able to distinguish it from its closest relatives:

  **1. Vs. Hacking's Looping Effect**
  *   **Looping:** The classification changes the *person*. (e.g., A child diagnosed with ADHD begins to understand themselves through the lens of ADHD, altering their behavior to fit or fight the label).
  *   **Validity Spiral:** The classification changes the *report*. The subject does not need to believe they are the thing; they only need to successfully *signal* the thing. It is colder, more bureaucratic, and requires no internalization of the label.

  **2. Vs. Goodhart's Law**
  *   **Goodhart:** "When a measure becomes a target, it ceases to be a good measure." This describes the *failure*.
  *   **Validity Spiral:** This describes the *reaction to the failure*. Goodhart's law says the metric breaks. The Validity Spiral explains why experts try to *fix* the metric by making it more complex, which ironically breaks it faster. It captures the *arms race* dynamic that Goodhart implies but doesn't detail.

  **3. Vs. Malingering / Faking**
  *   **Malingering:** Implies a conscious, individual act of deceit.
  *   **Validity Spiral:** Is a systemic, often unconscious adaptation. The subject isn't necessarily lying; they are emphasizing the symptoms that count and minimizing the ones that don't, guided by the structure of the interview itself. It is "teaching to the test" without a teacher.

  ### The Conditions: When Does It Apply?

  You asked if this only happens when the category is a gateway to something scarce. **Yes.**

  The Validity Spiral requires **Consequential Classification**. If the diagnosis confers no benefit (no medication, no accommodation, no insurance payout, no social exemption) and carries no stigma, there is no energy to drive the spiral. The feedback loop requires a voltage difference between "having the label" and "not having the label."

  *   **High Energy:** Disability accommodations, controlled substances (stimulants, opioids), tax benefits, legal exemptions.
  *   **Low Energy:** Conditions with no treatment, high stigma, and no benefits (e.g., certain personality disorder diagnoses in contexts where they offer no support). These do not spiral; they remain stable or under-reported.

  ### The Direction of Drift

  You asked if the drift is one-way or if it swings back.

  It is **one-way toward irrelevance**, not validity.
  When criteria become too tight (the "Specificity Trap"), the system does not usually correct back to truth. Instead, one of two things happens:
  1.  **Bifurcation:** The category splits. The "real" cases go to specialists who use intuition (returning to the pre-checklist state), and the "checklist" cases become a bureaucratic subclass with lower status.
  2.  **Abandonment:** The criteria become so complex that administration costs outweigh the utility, and the checklist is quietly dropped for a new one, restarting the spiral.

  It rarely swings back to validity because the *subjects* have learned the game. Even if you tighten the criteria, the knowledge of *what was asked last time* persists in the community (online forums, support groups, word of mouth). You cannot un-teach the test.

  ### Edge Cases: Where You Should Hesitate

  If you use this term, here are the boundaries where its application becomes fuzzy:

  **1. Objective Biomarkers**
  If the checklist is replaced by a blood test or a scan, the Validity Spiral stops. You cannot "answer" a blood test by trial and error. *However*, if the *interpretation* of the scan relies on a subjective threshold (e.g., "significant" blockage), the spiral can migrate to the interpretation layer.

  **2. Low-Stakes Screening**
  In population-level research where there is no individual benefit to "passing," the spiral does not form. This is purely a clinical/bureaucratic phenomenon, not a research one (unless the research participants are incentivized).

  **3. The "Under-Diagnosis" Spiral**
  The spiral can run in reverse. If a label carries heavy stigma (e.g., TB in some historical contexts, or certain psychiatric labels in security clearance contexts), subjects learn to hide symptoms. Experts then lower thresholds or add "probe" questions. Subjects learn to hide those too. The category hollows out because everyone is aiming *below* the line. The mechanism is identical; the vector is inverted.

  ### Summary for Use

  If you write about this, you can frame it like this:

  > *"Goodhart's Law tells us that a measure becomes useless when it becomes a target. Hacking's Looping Effect tells us that a measure changes the person it measures. But neither captures the specific bureaucratic decay I'm seeing, where the measure changes the **questions**, which changes the **answers**, which forces the **questions** to change again. I call this **The Validity Spiral**: a cycle where our attempts to define a condition more precisely only provide a sharper map for people to navigate around the truth."*

  This keeps the mechanism (the spiral of definition), the cause (incentivized navigation), and the result (loss of validity) distinct from the identity-formation of Looping or the metric-degradation of Goodhart.
