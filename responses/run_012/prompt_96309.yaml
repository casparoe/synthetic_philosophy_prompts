      *Wait, if I make A always "Anti-Reductionist" and B always "Reductionist", it's too obvious.* I should mix the underlying logic so the user has to think about the *case*, not just pick their "team."
      *   *Decision:* I will write the options to reflect the *intuition* rather than the theory label. The Key will do the heavy lifting of categorization.

      *Re-evaluating the "Machine/Press Release" constraint:* The prompt specifically wants to know if the user thinks these count as testimony. I need options that explicitly ask about the *status* of the source, not just belief.

      *Re-evaluating the "Key":* The prompt asks for "one sentence on what that position is most awkward about." I need to be punchy there.

      *Re-evaluating "Empty Combinations":* I need to think about what makes a combination of views philosophically unstable. E.g., Trusting moral testimony by default but requiring evidence for factual testimony is rare (usually the reverse). Trusting AI as testimony but not institutions.

      *Let's build the content.*

      *(Drafting Q1 - Train)*: Focus on default.
      *(Drafting Q4 - Press Release)*: Focus on agency.
      *(Drafting Q5 - AI)*: Focus on mind-dependence.
      *(Drafting Q9 - Aesthetic)*: Focus on domain.

