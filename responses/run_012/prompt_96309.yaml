      *   **Format:** 8-10 concrete scenarios, 2-3 answer options each, plus a scoring key mapping patterns to positions.
      *   **Constraint 1:** Do *not* use the words "reductionist" or "anti-reductionist" in the questions.
      *   **Constraint 2:** Focus on concrete cases where positions diverge (stranger, car dealer, child, press release, AI, colleague, doctor, rumor).
      *   **Constraint 3:** Address specific philosophical distinctions (default entitlement vs. positive reason, epistemic vs. practical, testimony as evidence vs. second-personal assurance, sincerity vs. competence, inheritance of knowledge vs. independent evidence, individual vs. social/institutional, factual vs. moral/aesthetic).
      *   **Constraint 4:** Scoring key must name positions (Global Reductionism, Local Reductionism, Non-Reductionism/Credulism, Assurance View, Transmission vs. Generation, etc.) and note what each position struggles with.
      *   **Constraint 5:** Flag indistinguishable positions and incoherent answer combinations.
      *   **Tone:** Reading group style (engaging, accessible but precise), not a textbook. No reading list.

  2.  **Drafting the Scenarios (Iterative Process):**
      *   *Need:* 8-10 scenarios covering the specific distinctions requested.
      *   *Scenario 1 (Stranger/Train):* Classic baseline. Tests default entitlement.
      *   *Scenario 2 (Car Dealer):* Tests interest/bias and institutional vs. individual.
      *   *Scenario 3 (Child/Teacher):* Tests competence vs. sincerity and developmental status.
      *   *Scenario 4 (Press Release):* Tests institutional testimony and whether it counts as "telling."
      *   *Scenario 5 (AI Assistant):* Tests non-human sources. Is it testimony or just evidence?
      *   *Scenario 6 (Colleague/Meeting):* Tests inheritance of knowledge vs. new evidence.
      *   *Scenario 7 (Doctor/Diagnosis):* Tests expertise and the need to reconstruct evidence.
      *   *Scenario 8 (Rumor):* Tests chains of testimony and social practice.
      *   *Scenario 9 (Moral/Aesthetic):* Tests domain specificity (facts vs. values).
      *   *Scenario 10 (Emergency/Urgency):* Tests practical license vs. epistemic justification (maybe combine with another or refine). Let's make it about *why* you believe (the person vs. the fact they said it).

      *Refining Options:* Each scenario needs options that map to specific philosophical commitments without using jargon.
      *   *Option A:* Trust by default (Anti-Reductionist/Non-Reductionist).
      *   *Option B:* Need positive reasons/evidence (Reductionist).
      *   *Option C:* Nuanced/Contextual (Local Reductionist/Assurance).

  3.  **Drafting the Questions (incorporating constraints):**
