      *Final check on the "Indistinguishable" section:* Global Reductionism and Local Reductionism are notoriously hard to separate if the "local" monitoring is very low-bar. I should note that. Also, Assurance and Non-Reductionism often overlap on outcomes.

      *Let's assemble.*
answer: |-
  # Where Do You Stand on Taking Someone's Word?
  **A Diagnostic for the Reading Group**

  This isn't a test of what you've read, but of what you actually do. We often claim to hold a general theory about testimony, but our intuitions shift when the stakes, the speaker, or the medium changes.

  Read the following ten scenarios. For each, select the option that best matches your immediate reaction. Don't overthink it to match a theory; pick the answer that feels right to you. At the end, use the key to see which philosophical commitments your intuitions commit you to—and where those commitments might get you into trouble.

  ***

  ### 1. The Stranger on the Platform
  You are at an unfamiliar train station. A stranger standing next to you says, "The train to the city leaves from Platform 4." You have no prior information about this person.
  *   **A.** You believe them immediately. The burden is on you to find a reason *not* to trust them (e.g., they look mischievous), not on them to prove they are reliable.
  *   **B.** You treat their statement as a piece of evidence. You believe them only because, in your past experience, strangers on platforms are usually reliable about this sort of thing.
  *   **C.** You believe them, but you acknowledge you are taking a practical risk. It's reasonable to act on it, but you wouldn't claim to *know* it's true until the train arrives.

  ### 2. The Used-Car Dealer
  A salesperson at a dealership tells you, "This car has never been in an accident." They have a financial incentive to sell you the car.
  *   **A.** You treat this exactly like the stranger on the platform. Their word is good unless you have a specific reason to think *this* dealer is lying.
  *   **B.** You require independent verification (a mechanic, a report). Their interest defeats any default entitlement you might have to their word.
  *   **C.** You accept their statement as a commitment. If they are lying, they have wronged *you* personally, regardless of whether the car is actually damaged.

  ### 3. The Six-Year-Old
  A six-year-old student tells their teacher, "My dad hit me last night." The child is articulate but young.
  *   **A.** You believe the child by default. Children do not typically fabricate accusations of this nature without cause.
  *   **B.** You cannot believe the child without corroborating evidence. A child this age cannot be assessed for competence or sincerity reliably enough on their own say-so.
  *   **C.** You believe the child, but not because they are a reliable informant. You believe them because the cost of ignoring them is too high (a practical, not epistemic, license).

  ### 4. The Corporate Press Release
  You read a press release issued by a pharmaceutical company stating their new drug has no severe side effects. No specific person signed it; it comes from "Corporate Communications."
  *   **A.** This isn't testimony at all. It's data. You evaluate it based on the company's track record, not on anyone "telling" you the truth.
  *   **B.** This counts as testimony from the institution. You are entitled to believe it unless you know the industry is corrupt.
  *   **C.** This is testimony, but it functions differently than a person speaking. You can trust the *role* even if you don't know the *individual* who wrote it.

  ### 5. The AI Assistant
  You ask a large language model a factual question about history. It answers confidently and coherently.
  *   **A.** This cannot be testimony. Machines don't have beliefs or intentions to tell the truth. It's just a search engine with better grammar.
  *   **B.** It functions *as if* it were testimony. If it's reliable, you treat it the same as a human expert.
  *   **C.** It is a new category. You can rely on it, but you don't owe it the same respect or normative treatment (like calling it a liar) as a human.

  ### 6. The Colleague's Meeting Notes
  You missed a meeting. A colleague tells you what was decided. Later, you form a belief about what happened.
  *   **A.** Your reason for believing is simply that *they told you*. Their telling is part of your evidence.
  *   **B.** Your reason is that *they said it*, which indicates that it is likely true. Their telling is an indicator of the fact, not the reason itself.
  *   **C.** You now know what happened, but you don't have the same standing as the people who were there. You can't vouch for it to others in the same way.

  ### 7. The Doctor's Diagnosis
  A specialist tells you that you have a specific condition. They do not explain the test results or the reasoning, just the conclusion.
  *   **A.** You are entitled to believe them. You cannot be expected to reconstruct their medical training to accept their word.
  *   **B.** You only truly know you have the condition if you understand *why* they think so. Otherwise, you just have a high probability.
  *   **C.** You believe them, but your knowledge is "second-hand." It is weaker than the doctor's knowledge, which is "first-hand."

  ### 8. The Building Rumor
  Everyone in your apartment building is saying the landlord is selling the property. You hear it from three different neighbors, none of whom were the original source.
  *   **A.** This is not testimony. It's social noise. You need to find the original source to evaluate the claim.
  *   **B.** The repetition itself generates justification. The social practice of sharing this information makes it reasonable to believe.
  *   **C.** Each neighbor is testifying to the fact that *they heard it*. You have multiple reports of a rumor, but not necessarily evidence of the sale.

  ### 9. The Film Critic (Aesthetic/Moral)
  A friend whose taste you respect tells you, "This film is morally offensive and artistically bankrupt."
  *   **A.** You can believe them just as easily as if they told you the film is 120 minutes long. Testimony works the same for values as facts.
  *   **B.** You cannot form this belief on testimony. You have to see the film and judge the morality for yourself.
  *   **C.** You can believe they *think* it, but you cannot adopt their judgment as your own. You know their verdict, not the truth of the verdict.

  ### 10. The Emergency Warning
  Someone screams, "The bridge is out!" as you are driving. You slam on the brakes.
  *   **A.** You are epistemically justified in believing them. You know the bridge is out.
  *   **B.** You are practically permitted to act, but you don't actually *know* the bridge is out until you see the rubble.
  *   **C.** The urgency suspends the normal rules. You would need more evidence if you were sitting in a café, but not here.

  ***

  ## Scoring Key & Diagnostic

  Tally your answers. There is no "correct" score, but certain patterns map onto established philosophical positions. Be warned: consistency often comes at a cost.

  ### Pattern 1: Mostly A's (The Default Trustee)
  **Position:** **Non-Reductionism (or Credulism)**
  **The View:** We have a *a priori* entitlement to believe what others tell us. Trust is the baseline; skepticism requires work.
  **The Awkwardness:** This view struggles to explain why you shouldn't believe a known liar or a conspiracy theorist without doing any checking first. It risks making gullibility a virtue.
  **Note:** If you picked **A** on the AI (Q5) or Press Release (Q4) questions, you hold a very expansive view of "speech" that attributes agency to non-humans.

  ### Pattern 2: Mostly B's (The Empirical Monitor)
  **Position:** **Global Reductionism**
  **The View:** Testimony is just another form of evidence (like perception or memory). You need positive reasons (inductive evidence) to trust a speaker on any given occasion.
  **The Awkwardness:** This view makes knowledge too hard to get. It implies children can't learn from parents until they have a track record of reliability, which they can't build without learning first. It leads to skepticism.
  **Note:** If you picked **B** on the Moral/Film question (Q9) but **A** on the Train (Q1), you are a **Local Reductionist** (trust is possible, but domain-specific).

  ### Pattern 3: Mostly C's (The Contextualist)
  **Position:** **Local Reductionism / Contextualism**
  **The View:** The requirements for trust shift based on the stakes, the speaker, and the context. There is no single rule for all testimony.
  **The Awkwardness:** This view risks being ad hoc. If the rules change every time, is it a theory of knowledge or just a description of when we feel comfortable? It lacks a unified principle.

  ### Pattern 4: A on 1, 3, 7; B on 2, 4, 5; C on 6
  **Position:** **The Assurance View (Second-Personal)**
  **The View:** Testimony isn't about evidence; it's about relationships. When someone tells you something, they invite you to trust them and assume responsibility for the truth.
  **The Awkwardness:** This struggles with "faceless" testimony (Q4 Press Release, Q5 AI, Q8 Rumor). If there is no specific person to hold responsible or to invite your trust, does the knowledge vanish?
  **Note:** This position often separates **Sincerity** from **Competence**. You might trust the stranger's sincerity (Q1) but demand evidence of the dealer's competence (Q2).

  ### Pattern 5: A on 1, 6, 7; B on 9
  **Position:** **The Transmission View**
  **The View:** Knowledge can be passed from speaker to hearer like a bucket of water. If they know it and tell you, you can know it.
  **The Awkwardness:** This view has trouble with Q9 (Values). If knowledge is transmitted, why does moral testimony feel different? It also struggles to explain why your knowledge (Q6) feels different from the colleague's knowledge.

  ### Pattern 6: B on 4, 5, 8; A on 1, 3
  **Position:** **Human-Exclusive Non-Reductionism**
  **The View:** Only human beings generate testimonial entitlement. Institutions, machines, and rumors are merely causal chains of evidence, not acts of telling.
  **The Awkwardness:** As society relies more on algorithms and institutions, this view forces you to treat most of your information diet as "inference" rather than "testimony," making your epistemic burden incredibly heavy.

  ***

  ## Impossible or Unstable Combinations

  Some combinations of answers are philosophically unstable or virtually unoccupied. If you found yourself selecting these, you may need to examine why.

  *   **The "Gullible Skeptic" (A on Q1, B on Q7):** Believing a stranger on a platform by default but requiring a doctor to explain their reasoning before you can believe a diagnosis.
      *   *Why it's unstable:* Usually, if you grant default trust to strangers, you grant it to experts. If you demand evidence from experts, you should demand it from strangers. Holding both suggests an inconsistency in how you weigh expertise vs. everyday interaction.
  *   **The "Moral Realist Testifier" (B on Q1, A on Q9):** Demanding evidence for factual claims (train platform) but accepting moral/aesthetic claims (film is good) by default.
      *   *Why it's unstable:* Most theories run the other way. Facts are usually seen as easier to transmit than values. Believing values by default while doubting facts is a rare and difficult position to defend.
  *   **The "Institutional Trustee" (B on Q1, A on Q4):** Distrusting a stranger on a platform but trusting a corporate press release by default.
      *   *Why it's unstable:* This inverts the standard reductionist intuition. Usually, if you require positive reasons to trust individuals, you require even *more* reasons to trust faceless institutions with incentives to lie.

  ## Limitations of This Quiz

  Be aware that this quiz cannot perfectly separate every philosophical nuance.
  1.  **Global vs. Local Reductionism:** In practice, a "Global" reductionist who admits we have lots of background evidence often looks identical to a "Local" reductionist. The distinction is often theoretical rather than practical.
  2.  **Assurance vs. Non-Reductionism:** Both views often yield the same result (trust by default). The difference is *why* (entitlement vs. relationship), which is hard to capture in multiple-choice scenarios.
  3.  **Transmission vs. Generation:** Whether you "inherit" knowledge or "generate" it from evidence often results in the same claim to knowledge, making the distinction hard to spot without deeper interrogation of *why* you believe.

  **Discussion Prompt:** Look at the position you were sorted into. Read the "Awkwardness" note. Can you modify your answers to resolve that awkwardness without creating a new one? That tension is where the philosophy lives.
