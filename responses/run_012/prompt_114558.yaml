answer: |-
  ### 1. Exam Question

  **Question 1 (20 marks)**

  In *Laws* I (647c–672d), the Athenian legislates the supervised drinking party as both a "test" of character (diagnostic) and a "practice" in virtue (formative). Given the tension that a known test invites preparation (invalidating the diagnosis) while practice alters the disposition (invalidating the measurement), evaluate whether a single institution can coherently fulfill both functions. Must we understand the "test" as serving the lawgiver rather than the drinker, or does the tension undermine the Athenian's claim that wine is a "medicine" for the soul? In your answer, refer to the age-regulations, the role of the sober overseer, and the puppet image.

  ***

  ### 2. Model Answer

  The Athenian's proposal in *Laws* I appears contradictory only if we assume the drinking party serves a single purpose at a single moment. To defend the coherence of the institution, one must distinguish between the immediate diagnostic utility of intoxication and the longitudinal formative utility of habituation, mediated by the sober overseer. The tension between testing and training is resolved not by eliminating one function, but by assigning them to different agents within the legislative framework.

  The diagnostic function relies on wine's capacity to loosen the reins of shame. As the Athenian notes, wine acts as a "cheap and comparatively harmless test" because it artificially induces a state of fearlessness and shamelessness similar to natural vice. When restraints are removed, the drinker's true character is revealed to the observer. However, if the drinker knows they are being judged, they may feign sobriety even while intoxicated. This is where the formative function intersects. The drinking party is not a one-off examination but a repeated practice. The Athenian compares temperance to courage: just as courage requires practice against fear, temperance requires practice against pleasure. If the drinking party were merely a test, the drinker would resist the wine to pass. By framing it as a "medicine" and a communal duty, the lawgiver encourages participation, ensuring the "test" conditions are met repeatedly enough to become habituation.

  The coherence of this dual function depends entirely on the presence of the sober overseer. The overseer represents the "golden cord" of reason holding the iron cords of the drinkers. For the diagnostic element to work, the overseer must observe without the drinker successfully manipulating the display. For the formative element to work, the overseer must guide the shame experienced during intoxication toward virtue rather than despair. The tension is mitigated because the "test" is primarily for the state's knowledge of the citizen, while the "practice" is for the citizen's soul. The citizen need not know exactly when they are being evaluated for specific roles; they need only know they are undergoing training. Thus, the preparation warning is blunted: one cannot prepare for a lifelong curriculum by feigning virtue in a single bout of drinking.

  Furthermore, the age-regulations clarify the shifting balance between test and training. For the young (under thirty), wine is restricted because their passions are already too fiery; here, the institution is largely protective. For those over forty, the invocation of Dionysus serves as a medicine against the sourness of old age. Here, the formative aspect dominates: they are rehearsing modesty to counteract physical decline. The diagnostic aspect remains relevant for the lawgiver to assess fitness for rule, but the drinker experiences it as therapeutic. This supports the puppet image: the law does not merely pull the cords; it strengthens the golden cord so the puppet can eventually pull itself.

  Therefore, the proposal is coherent if we understand virtue not as a static state to be measured, but as a dynamic capacity to be stressed. The drinking party is a controlled stress-test. If the tension were fatal, the Athenian would have to choose between spying on citizens or training them. Instead, he combines them: the state learns who the citizens are by watching them struggle to remain virtuous while impaired. The "medicine" is not just the wine, but the supervised social context that transforms a potential vice into a gymnasium for the soul. The institution works because the shame induced by the overseer ensures that even if the drinker tries to mask their vice, the struggle itself becomes the practice required for temperance.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Criteria × 4 Marks)**

  | Criterion | Marks | Typical Mistake that Costs Marks |
  | :--- | :---: | :--- |
  | **1. Diagnostic Function**<br>Clearly explains how wine acts as a test by removing shame/restraints to reveal true character. | /4 | Describing the drinking party generally without specifying *how* intoxication reveals hidden vice (e.g., ignoring the "loosening" mechanism). |
  | **2. Formative Function**<br>Clearly explains how wine acts as practice/habituation analogous to courage against fear. | /4 | Treating the drinking party as purely recreational or purely dangerous, missing the "gymnasium" analogy. |
  | **3. The Tension**<br>Explicitly engages with the instructor's warning: that knowing one is tested invalidates the test, and practice alters the measurement. | /4 | Ignoring the logical conflict entirely or stating the two functions are simply "both true" without addressing the contradiction. |
  | **4. Condition for Coherence**<br>Proposes a specific condition (e.g., role of overseer, age stages, or state vs. individual benefit) that resolves or manages the tension. | /4 | Arguing Plato is simply confused, or resolving the tension by claiming "virtue is hard" without institutional detail. |
  | **5. Textual Integration & Nuance**<br>Uses required anchors (puppet, age, overseer) and avoids the cliché that Plato is simply "suspicious of pleasure." | /4 | Relying on the generalization that "Plato hates pleasure" or failing to reference at least two of the required textual anchors. |

  **Distinguishing A from B:**
  An **A answer** synthesizes the tension by arguing that the *relationship* between overseer and drinker allows the test and training to operate simultaneously for different ends, whereas a **B answer** typically lists the diagnostic and formative functions separately without explaining how they survive the logical conflict posed by the instructor's warning.
