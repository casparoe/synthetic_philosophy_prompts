answer: |-
  Your intuition that Kepler is wanting it both ways is historically astute and philosophically sharp, because it identifies the exact fault line where early modern natural philosophy cracked under the weight of its own transition. You are correct that the reformed view distinguishes itself from vulgar astrology by rejecting arbitrary signs and houses in favor of universal geometry, but the fatal defeater for this position is not empirical failure in the modern sense, but rather the internal incoherence of its causal mechanism when scrutinized by the very physics Kepler helped inaugurate. The most damaging argument against the Keplerian reform is the one you flagged third, regarding the geocentric vantage point, because it undermines the claim of objective harmony. If the aspects are real geometrical properties of the cosmos akin to musical consonances, they should exist independently of the observer, much like the ratio of a string's length exists regardless of who listens. By tethering the aspect to the geocentric angle, Kepler makes the harmony contingent on the Earth's position, which forces him to posit an animistic Earth soul to perceive the geometry. This moves the cause from the heavens into the sublunary observer, which means the harmony is not a property of the planetary configuration itself but a property of the Earth's reaction to it. A defender might concede this, but it collapses the claim that aspects are physical foundations and admits they are phenomenological, which leaves the mechanism utterly unmoored from the new astronomy that treats planets as bodies moving through space rather than lights moving on spheres relative to us.

  The second nagging thought you mentioned, concerning the physical proxy of tides and gravity, is merely awkward for the Keplerian because Kepler himself anticipated and rejected it. He knew that physical virtues should diminish with distance and peak at conjunction, yet he insisted on the efficacy of the square and trine where physical forcing is negligible. A defender would not yield here because the whole point of the reform was to escape material effluxions. However, this creates the vulnerability you sensed in your first point about universality. If the efficacy lies in the ratio itself, the specific bodies involved should be irrelevant carriers of the geometry, yet Kepler constantly reverts to Aristotelian qualities like hot Mars or cold Saturn to explain why aspects manifest differently. This is internally unstable. For the reformed view to hold, the geometry must be the sole efficient cause, but Kepler cannot explain weather or temperament without invoking the specific natures of the planets. A decisive defeater here would be a demonstration that planetary natures are irrelevant to the outcomes, which Kepler's own practice contradicts, or conversely, that the planetary natures are sufficient without the geometry, which his data failed to show. The position survives only by keeping both causes in play, allowing the geometry to explain the timing and the planetary nature to explain the quality, which insulates it from refutation by ensuring there is always a second variable to blame when the first fails.

  This leads directly to your concern about falsifiability, which is the most serious charge. Kepler explicitly downgraded astrological influence from necessity to inclination, arguing that the Earth soul can resist or modulate the harmonic impulse. This move protects the theory from empirical disconfirmation because any failure of an aspect to produce an expected weather pattern or historical event can be attributed to the resistance of the sublunary faculty or the interference of other aspects. You asked what would have to be true for the view to be false, and the honest answer is that within Kepler's own framework, almost nothing could prove it false because the causal chain includes a non-material agent that is by definition free and variable. However, a hard defeater would be a statistical demonstration that the geometric precision of the aspect correlates with no measurable variance in the effect, even when controlling for planetary nature. If the soul responds to proportion like an ear to a chord, there should be a threshold of exactness where the effect drops off, yet Kepler allowed for orbs of influence that are arbitrary and wide. If the effect does not diminish as the aspect becomes exact, the claim of geometric resonance is empty.

  Ultimately, you are making a category error only if you treat Kepler's reform as a proto-scientific hypothesis rather than a metaphysical bridge. He was trying to save the macrocosm-microcosm link by dressing it in the new geometry, but the result is insulated rather than defended. The insulation is a problem if you demand physical consistency, but it was a necessary survival strategy for a worldview that could not yet abandon the idea of a meaningful cosmos. The reformed version predicts nothing that the unreformed one does not, except that it predicts failure for signs and houses, which history has confirmed, but it gains no predictive power for aspects in return. The verdict is that the position is a sophisticated rationalization of tradition, not an empirical theory, and the defeaters you have identified are fatal to its claim to physicality but only awkward for its claim to metaphysical coherence. Kepler saved astrology from being obviously wrong about the heavens by making it unfalsifiable about the earth, and that is precisely why it could not become science.
