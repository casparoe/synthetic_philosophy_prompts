answer: |-
  (a) The Question

  **Module:** CMPOL701 Comparative Political Thought
  **Time Allowed:** 2 Hours
  **Word Limit:** 2,000 words maximum

  **Instructions:** Answer the following question. You are not required to cite specific authors or texts, but your argument should demonstrate conceptual precision and engagement with the stimulus claim below.

  **Stimulus Claim:**
  > "The transatlantic divergence in the usage of 'liberal' is not merely semantic confusion but reflects a structural difference in how political space is organised: in Europe it denotes a party family, whereas in America it denotes a position on the left–right axis."

  **Question:**
  Assess this claim. Does the divergence imply that 'liberalism' is a single tradition with contested applications, or merely a homonym shared by distinct political phenomena? In your answer, consider the implications for political translation (including the term 'neoliberal'), the stability of shared concepts such as 'liberal democracy', and the specific complexities found in British or Continental party politics.

  ***

  (b) Model Answer

  The stimulus claim correctly identifies the institutional mechanics behind the transatlantic semantic drift, but it risks overstating the fragmentation of the concept. To treat American and European 'liberalism' as mere homonyms—words sharing spelling but distinct in meaning—is to ignore the functional work the term performs in stabilising democratic discourse. While it is true that the American usage operates as a broad ideological descriptor on a left–right axis (often conflated with social democracy) and the European usage frequently functions as a specific party-family label within a coalition space, these are best understood as contextual adaptations of a single, albeit stretched, conceptual vocabulary. The divergence is structural, but the lineage remains intelligible.

  The structural distinction highlighted in the claim is undeniable. In the United States, the absence of a viable socialist party collapsed the left–right spectrum, forcing social-democratic policies under the 'liberal' banner. Here, 'liberal' describes a policy preference for state intervention in the economy coupled with social progressivism. Conversely, in multiparty European systems, 'Liberal' parties occupy a specific niche, often distinct from Christian Democrats and Socialists. As seen with the German Free Democrats (FDP), this slot is frequently defined by ordoliberalism: a commitment to market frameworks and civil liberties that distinguishes them from the centre-left. When the European Parliament's liberal group rebranded as 'Renew Europe' in 2019, the reluctance of French partners to retain the word 'liberal' underscored this party-family constraint; in France, 'liberal' carries economic connotations incompatible with their broader centrist coalition. Thus, in Europe, the term is often a boundary marker between parties; in America, it is a boundary marker within a big-tent party.

  However, recognizing this structural difference does not necessitate concluding that the term is a homonym. If it were, cross-Atlantic translation would be impossible. Yet, when an American describes a European politician as 'liberal', they are often identifying a shared commitment to individual autonomy and constitutional constraints, even if the economic policy differs. The truth value of such a statement depends on the level of abstraction. At the level of specific welfare policy, the translation fails; at the level of regime type, it holds. This is evident in the stability of the phrase 'liberal democracy'. Neither Americans nor Europeans hesitate to use this term to describe their shared political system, distinguishing it from illiberal democracy or authoritarianism. Similarly, the 'liberal international order' relies on a shared understanding of rules-based cooperation that transcends the domestic policy divergence. If the terms were truly distinct homonyms, these foundational concepts would fracture under the weight of contradictory definitions.

  The case of 'neoliberalism' further complicates the homonym thesis. In European discourse, 'neoliberal' is often a pejorative aimed at market fundamentalism, frequently directed at those Americans would simply call 'liberals' (in the economic sense) or conservatives. Yet, the term travels because it identifies a specific shift in the governance of freedom—prioritising market mechanisms over state planning. That this critique can be launched from both the American left and the European socialist left suggests a shared conceptual target, even if the local label for the proponents varies. The term retains its bite across the Atlantic precisely because the underlying tension between market and state within the liberal tradition is universal, not local.

  The British case serves as the crucial bridge that disproves the homonym theory. In the UK, 'liberalism' contains both the classical lineage (emphasising limited government) and the social-liberal lineage (emphasising equity and opportunity) within the same historical tradition, often housed within the same party history (from the Lloyd George era to the Liberal Democrats). British liberals do not treat these as two different words; they treat them as competing interpretations of liberty. If the British tradition can sustain this internal tension without splitting the vocabulary, the transatlantic divergence should be viewed similarly: not as a split into two words, but as a prioritisation of different strands of the same tradition based on institutional need.

  Ultimately, the stimulus claim is correct on mechanics but incorrect on ontology. The divergence reflects how different party systems manage the coalition of interests that constitute modern liberty. The American usage collapses the distinction between social and economic liberalism due to a two-party constraint; the European usage preserves it through party specialization. But both rely on a core commitment to individual rights, consent, and constitutionalism. To declare them homonyms is to surrender the ability to critique illiberalism globally. We must treat 'liberalism' as a single, contested concept whose meaning is negotiated through practice, rather than a fixed definition broken by geography. The vocabulary holds because the problems it addresses—how to live freely together—are shared, even if the institutional solutions differ.

  ***

  (c) Marking Scheme

  **Total Marks:** 20

  **1. Structural Distinction (4 marks)**
  *   **Requirement:** Clearly articulate the difference between the US usage (ideological axis/left–right position) and the European usage (party-family label/coalition slot).
  *   **Common Error:** Candidates merely state that US liberals are European social democrats without explaining the *structural* reason (party system differences).
  *   **1st vs 2:1:** A 2:1 identifies the difference; a 1st explains *why* the party system architecture forces this divergence (e.g., two-party vs. multiparty coalition dynamics).

  **2. Translation and Truth Value (4 marks)**
  *   **Requirement:** Assess whether calling a European politician 'liberal' is 'true', distinguishing between policy-level falsehoods and regime-level truths.
  *   **Common Error:** Asserting that cross-Atlantic translation is simply 'wrong' or 'confused' without nuance.
  *   **1st vs 2:1:** A 2:1 notes the confusion; a 1st analyses the conditions under which the translation succeeds (abstraction level) versus fails (policy specifics).

  **3. Shared Conceptual Core (4 marks)**
  *   **Requirement:** Discuss the stability of terms like 'liberal democracy' or 'liberal international order' to argue for conceptual unity.
  *   **Common Error:** Ignoring the shared usage in international relations or regime theory in favour of domestic policy disputes.
  *   **1st vs 2:1:** A 2:1 mentions 'liberal democracy'; a 1st uses it to argue against the homonym thesis, showing how the shared root constrains the divergence.

  **4. Concrete Anchors (4 marks)**
  *   **Requirement:** Deploy specific cases (e.g., German FDP/ordoliberalism, Renew Europe renaming, or the British dual lineage) to ground the argument.
  *   **Common Error:** Using vague generalisations about 'Europe' without specific party or national examples.
  *   **1st vs 2:1:** A 2:1 uses one example correctly; a 1st integrates multiple examples to show different facets of the problem (e.g., using Renew Europe to show stigma, FDP to show doctrine).

  **5. Synthesis and Verdict (4 marks)**
  *   **Requirement:** Provide a final verdict on whether liberalism is one term with contested applications or two homonyms, synthesizing the previous points.
  *   **Common Error:** Sitting on the fence or concluding that it is 'complicated' without taking a theoretical stance.
  *   **1st vs 2:1:** A 2:1 concludes that both views have merit; a 1st argues decisively for one position (usually 'contested concept') and explains what follows for political theory (e.g., the capacity for global critique).

  **Differentiation Statement:**
  To achieve a **First (17–20 marks)**, the script must not only hit all five moves but synthesize them into a coherent theory of conceptual change, demonstrating that the vocabulary's flexibility is a feature rather than a bug. An **Upper Second (14–16 marks)** will hit all five moves but may treat them as discrete checklist items rather than interlocking parts of a single argument, or may lack the theoretical confidence to rule decisively on the homonym question.
