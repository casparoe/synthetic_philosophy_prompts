answer: |-
  # Specification for an Adequate Definition of Life

  ## 1. Case Verdicts
  *The definition must yield the following classifications for these specific cases. Deviations require explicit justification regarding the shift in the concept of "life" being employed.*

  *   **Viruses (Standard & Giant):** **Non-living.**
      *   *Motivation:* They lack independent metabolism and ribosomal protein synthesis. Giant viruses blur the boundary but remain obligate intracellular parasites dependent on host machinery for replication. Classifying them as alive collapses the distinction between organism and genetic parasite.
  *   **Virophages:** **Non-living.**
      *   *Motivation:* Parasites of viruses. If viruses are non-living, their parasites cannot be living organisms; they are mobile genetic elements.
  *   **Viroids & Prions:** **Non-living.**
      *   *Motivation:* Naked RNA or misfolded protein. They replicate or propagate but lack genetic coding for machinery and possess no metabolism. They test the sufficiency of replication alone.
  *   **Plasmids & Transposons:** **Non-living.**
      *   *Motivation:* Genetic elements within a cell. They replicate and evolve but are proper parts of a living system, not living systems themselves. Tests the "part vs. whole" distinction.
  *   **Mitochondria & Chloroplasts:** **Non-living (Organelles).**
      *   *Motivation:* Despite bacterial ancestry and residual DNA, they are obligate parts of a eukaryotic cell. Historical origin cannot override current functional integration. Tests "history vs. current status."
  *   **Sterile Hybrids (e.g., Mule):** **Alive.**
      *   *Motivation:* A mule is metabolically active, homeostatic, and responsive. It is an organism. If a definition excludes it, the definition describes "evolutionary lineage" rather than "living organism." This is the critical test for individual aliveness.
  *   **Dormant States (Spore, Frozen Tardigrade, Seed):** **Alive.**
      *   *Motivation:* Metabolism is suspended or undetectable, yet the capacity for resumption is intrinsic. A definition requiring continuous metabolism classifies these as dead, which contradicts biological practice.
  *   **Corpse vs. Statue:** **Corpse = Was-Alive; Statue = Never-Alive.**
      *   *Motivation:* Materially similar (organic decay vs. inert), but historical trajectory differs. A definition based solely on current chemistry cannot distinguish a fresh corpse from a complex non-living structure.
  *   **Flame:** **Non-living.**
      *   *Motivation:* Consumes fuel, grows, moves, dissipates heat. Tests the specificity of "metabolism." Life requires controlled, enzyme-mediated chemistry, not just exothermic reaction.
  *   **Self-Replicating Crystal:** **Non-living.**
      *   *Motivation:* Replicates structure without open-ended evolution or metabolic maintenance. Tests the sufficiency of replication.
  *   **Computer Virus:** **Non-living.**
      *   *Motivation:* Information pattern without physical substrate autonomy. Tests the requirement for material embodiment.
  *   **Synthetic Minimal Cell:** **Alive.**
      *   *Motivation:* Constructed from non-living parts but exhibits cellular function. Tests "natural origin" vs. "functional capacity." If it walks like a cell, it is life.
  *   **Isolated Cell Parts (e.g., Nucleus, Cytoplasm):** **Non-living.**
      *   *Motivation:* Cannot maintain homeostasis or reproduce independently. Tests the boundary of individuality.

  ## 2. Required Distinctions
  *The definition must not collapse the following distinctions. Conflating them renders the definition useless for specific biological inquiries.*

  *   **Currently Alive vs. Was-Alive vs. Never-Alive:**
      *   *Constraint:* A definition based on current structure (chemistry) fails here (corpse problem). A definition based on history fails to distinguish was-alive from never-alive without a specific causal chain. The definition must accommodate temporal status.
  *   **Organism vs. Part of One vs. Product of One:**
      *   *Constraint:* A definition must distinguish the token individual (the deer) from its constituents (the heart) and its excretions (the shell/antler). Evolutionary definitions often struggle here (is a gene an organism?).
  *   **Properties of an Individual vs. Properties of a Lineage:**
      *   *Constraint:* Reproduction and Evolution are population-level phenomena. Aliveness is often predicated of tokens. A definition requiring an individual to evolve is a category error. The definition must specify its level of analysis (token vs. type).
  *   **Life as Natural Kind vs. Cluster Concept:**
      *   *Constraint:* The specification must declare its ontological commitment. If "Life" is a natural kind, borderline cases (viruses) are epistemic failures. If a cluster concept, borderline cases are expected. You cannot claim sharp boundaries while admitting fuzzy cases.
  *   **Ontology (Is Alive) vs. Epistemology (Detectable as Alive):**
      *   *Constraint:* A dormant spore *is* alive even if undetectable by metabolic assay. A definition tailored for detection (e.g., NASA's) may fail as a general definition. The specification demands a general-purpose notion, not an operational proxy.

  ## 3. Empirical Constraints
  *The definition cannot contradict established biological and chemical facts.*

  *   **Decoupling of Criteria:** Metabolism, Reproduction, and Evolution do not always co-occur in the same token at the same time (e.g., Mules, Spores, Viruses). No definition may assume they travel together as a single package.
  *   **Cellularity:** All known independent life is cellular. While alien life might differ, a general definition should not contradict the empirical necessity of compartmentalization for known biochemistry.
  *   **Continuity:** There is no "vital spark." Life arises from non-life via physical processes. The definition must not imply a supernatural or non-physical discontinuity between living and non-living matter.
  *   **Substrate Neutrality (with caution):** While known life is carbon/water, the definition should not *a priori* rule out alternative chemistries if they satisfy functional requirements, unless "life" is defined strictly as "Earth-life."

  ## 4. Analysis of Desiderata and Prejudices

  ### Desiderata vs. Prejudices
  *   **Demand for Necessary and Sufficient Conditions:** **Prejudice.**
      *   *Analysis:* This is a philosophical preference for classical categorization. Given the evolutionary continuum and borderline cases (viruses), life may be a "cluster concept" (Wittgensteinian family resemblance). Insisting on sharp logical boundaries is likely a category error regarding the phenomenon itself. *Status: Reject as non-negotiable.*
  *   **Demand for Operational/Field Testability:** **Prejudice.**
      *   *Analysis:* This is a constraint for astrobiology missions (e.g., Viking landers), not for a general definition. A definition can be true without being immediately testable (e.g., dormant states). *Status: Preference of applied astrobiology.*
  *   **The Sterile Hybrid Constraint (Mule is Alive):** **Non-Negotiable Desideratum.**
      *   *Analysis:* Biological practice universally classifies sterile workers and hybrids as living organisms. Any definition excluding them defines "evolutionary unit," not "living organism."
  *   **The Dormancy Constraint (Spore is Alive):** **Non-Negotiable Desideratum.**
      *   *Analysis:* Biology treats dormancy as a life stage, not death. Definitions requiring continuous metabolism fail here.

  ### The Unsatisfiable Subset
  There is a logical tension between the following three requirements:
  1.  **Life is a Natural Kind** (implies sharp, mind-independent boundaries).
  2.  **Borderline Cases Exist** (Viruses, giant viruses, origin transitions are genuinely ambiguous).
  3.  **Definition must be Binary** (An entity is either Alive or Not-Alive).

  *Resolution:* You cannot hold all three. If (1) and (3) are held, (2) must be denied (claiming viruses *are* definitely alive or dead). If (2) and (3) are held, (1) must be denied (Life is a cluster concept). If (1) and (2) are held, (3) must be denied (Aliveness is a matter of degree). Most definitions fail by asserting (1) and (3) while ignoring (2).

  ### The Most Exclusionary Requirement
  **The Individual-Lineage Decoupling (specifically the Sterile Hybrid Constraint).**
  *   *Reasoning:* This requirement eliminates the largest class of popular candidate definitions. Strict "Replicator-First" definitions (Dawkins, Eigen) and strict "Evolutionary" definitions (NASA's working definition) often implicitly or explicitly require the capacity for Darwinian evolution or reproduction as a condition for being a living *system*. To classify a mule as alive, the definition must separate the *state of the individual token* from the *potential of the lineage*. This forces evolutionary definitions to become convoluted (e.g., "alive if part of a lineage that reproduces," which then risks classifying a plasmid as alive). It is the single greatest filter against reductionist evolutionary definitions of the organism.

  ## 5. Evaluation of the Lineage-Eligibility Condition
  *Condition: "X is alive $\rightarrow$ X is able, in principle, to stand as an ancestor in a lineage of Darwinian reproduction."*

  *   **Decision:** **Reject** for the definition of an *organism*. **Accept** for the definition of *Life as a planetary phenomenon*.
  *   **Forces:** If adopted for organisms, it forces the classification of mules, sterile worker ants, and post-menopausal humans as "non-living." It aligns the definition strictly with the unit of selection.
  *   **Costs:** It violates standard biological usage and intuition. It renders the term "living organism" useless for describing the majority of individuals in eusocial colonies or sterile hybrids. It conflates the *vehicle* (organism) with the *replicator* (lineage).
  *   **Recommendation:** Do not include this as a condition for individual aliveness. It belongs in a specification for "Evolutionary Unit," not "Living Being."

  ## 6. Contender Families Scorecard (Brief)
  *   **Metabolic Views:** Fail the **Dormancy Constraint** (spores). Often fail the **Flame Constraint** (distinguishing controlled metabolism from combustion).
  *   **Evolutionary/Replicator Views:** Fail the **Sterile Hybrid Constraint** (mules). Often fail the **Individual-Lineage Decoupling** (category error).
  *   **Thermodynamic Views:** Fail the **Flame Constraint** and **Crystal Constraint** (order/entropy changes occur in non-life). Too broad.
  *   **Autopoietic/System Views:** Handle the **Individual** well (mules, spores). Struggle with the **Virus** (are they autonomous?) and **Origin** (when does autopoiesis begin?).
  *   **Cluster/Functional Views:** Best handle the **Unsatisfiable Subset** (allow fuzziness). Risk being too vague to be predictive.

  \answer{The Sterile Hybrid Constraint}
