  You have a very consistent set of intuitions, but there is one logical contradiction in your numbers that you need to resolve before a single rule can apply. Once you fix that, your behavior is best described not by simple "diminishing returns" (Log Utility), but by a specific psychological principle regarding how you perceive **unlikely events**.

  ### 1. The Contradiction You Must Give Up
  You stated:
  *   **Classic St. Petersburg:** WTP **$20**
  *   **Capped at $1 Billion:** WTP **$25**

  This violates a fundamental rule of rational choice called **Stochastic Dominance**. The Classic game includes every possible payout of the Capped game *plus* the possibility of winning more than $1 billion. It is strictly better. You cannot logically pay *less* for the better game.

  **The Fix:** You likely discounted the Classic game because "infinity" feels like a trick or a theoretical abstraction, whereas "$1 Billion" feels like real money. To run a single principle, you must align these. Given your Capped valuation, your Classic valuation should be **at least $25**. Let's assume **$25** for both for the rest of this analysis.

  ### 2. The Single Principle: Probability Weighting (Not Just Utility)
  Your hunch is that you are a "diminishing-returns person" (Concave Utility). While true, that alone **cannot** explain your numbers.
  *   **Why Log Utility fails:** If your utility function were curved enough to drop the $1,000 coin flip (EV $500) down to $300, that same curvature would value the St. Petersburg game at roughly **$4 to $6**, not $25. To get a St. Petersburg value of $25, your utility function must be nearly linear (low risk aversion), but if it were that linear, you'd value the $500 EV coin flip at roughly $450, not $300.
  *   **The Real Rule:** You are running **Prospect Theory with Probability Underweighting**.
      1.  **Value Function:** You have moderate risk aversion (money matters less as you get more).
      2.  **Weighting Function:** You psychologically **discount small probabilities** much more than math dictates. You treat a 1% chance as if it were 0.1%, and a 1-in-a-million chance as if it were zero.

  **How this saves all six verdicts:**
  *   **St. Petersburg Cluster ($25):** The massive Expected Value comes from the "tail" (outcomes with probabilities like 1 in a billion). Your brain treats these tiny probabilities as effectively zero. This truncates the game's value to the first 10–15 tosses, which mathematically sums to about $20–$25. This explains why capping the payout at $1 Billion doesn't change your price: you were already ignoring the outcomes above that cap.
  *   **Lottery 5 (50% of $1,000 → $300):** 50% is a "large" probability. You don't discount the chance much, but you do discount the money due to risk aversion.
  *   **Lottery 6 (10% of $10,000 → $250):** 10% is a "small" probability. You underweight the chance (treating it like maybe 5%) *and* apply risk aversion to the money. This double penalty explains why the WTP/EV ratio drops from 0.6 (Lottery 5) to 0.25 (Lottery 6).

  ### 3. The Verdict on Your Test Case
  **Case:** $5,000,000 with probability 1/1000 (EV $5,000).

  *   **Expected Value Principle:** Pay up to $5,000.
  *   **Log Utility Principle:** Pay roughly $1,500 – $2,000.
  *   **Your Principle (Probability Underweighting):**
      You treat the St. Petersburg tail (probabilities $< 1/1,000,000$) as zero. A 1/1000 chance is on the boundary of your "neglect zone." In your Lottery 6 case, you heavily discounted a 1/10 chance. A 1/1000 chance is two orders of magnitude less likely. Even though the prize is 500x larger than Lottery 6, your psychological discount on the probability will outweigh the prize increase.

  **Prediction:** You will pay **less than $100**.
  *Reasoning:* To your gut, a 0.1% chance feels "impossible," similar to the St. Petersburg tail you ignore. You will value this based on the "hope" value rather than the math, likely pricing it similar to a lottery ticket rather than an investment.

  ### 4. The Diagnostic Case
  To prove you are running **Probability Weighting** rather than just **Diminishing Returns**, you need to separate the *size of the money* from the *size of the chance*.

  **The Case:**
  > **Option A:** 50% chance to win $10,000. (EV $5,000)
  > **Option B:** 1% chance to win $500,000. (EV $5,000)

  *   **If you are just Diminishing Returns (Log Utility):** You will prefer **Option A**, but the prices will be somewhat close. You dislike the variance of B, but the money is real.
  *   **If you are Probability Underweighting (Your Rule):** You will prefer **Option A massively**. You will value Option B at a tiny fraction of Option A. Because 1% falls into your "underweighting" zone, you will psychologically treat Option B as if the EV is only ~$500 or less, whereas Option A feels like "real money."

  **Your Move:** If you look at Option B and feel a visceral "that's never going to happen" despite the $500k prize, you've confirmed you are running Probability Weighting. If you feel "I'd take that for about $2,000," you are running standard Risk Aversion. Given your St. Petersburg intuition, I bet you'd pay less than $200 for Option B.
