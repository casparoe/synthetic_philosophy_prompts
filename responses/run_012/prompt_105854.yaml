  - the same game but you only get paid if a head shows up within the first 20 tosses (top payout about a million, expected value about $21): about $20.
  - a flat $10 for sure: $10.
  - $1000 with probability 1/2, otherwise nothing (expected value $500): about $300.
  - $10,000 with probability 1/10, otherwise nothing (expected value $1000): about $250.

  Is there a single principle that gets all six, or am I going to have to give one of these up? My own hunch is that I'm just a diminishing-returns person — money past some point stops buying me much — but that doesn't seem to explain the St. Petersburg cases and the ordinary lottery cases in the same breath. I want the rule (or the small set of candidate rules, each with the case that motivates it), which of my six verdicts it can't save, which way it points on the one I genuinely can't call — $5,000,000 with probability 1/1000, otherwise nothing (expected value $5000) — and what further case would show whether I'm really running one principle or two.
