answer: |-
  **MEMORANDUM OF DECISION**
  **STATE SENTENCING COMMISSION**
  **RE: State v. [Defendant], Case No. 2023-CR-892**

  **BOTTOM LINE RECOMMENDATION**
  The Commission unanimously recommends **rejecting** the defense's motion for penal substitution. The State cannot incarcerate an innocent volunteer in place of the convicted offender. However, recognizing the mitigating circumstances regarding the defendant's family support and the non-violent nature of the fraud, we recommend an alternative sentencing hearing focused on restitution and probation.

  **TIMELINE**
  This recommendation shall be transmitted to the Presiding Judge within **14 days**. A modified sentencing hearing is to be scheduled within **30 days** to determine eligibility for home confinement contingent on full restitution.

  **REASONING**

  **I. The Purposes of Punishment**
  The defense argues that vicarious punishment satisfies the ends of justice. We must dissect this claim against the standard penological goals: restitution, deterrence, and retribution.

  *Restitution:* If the mother volunteers to pay the defrauded amounts, the goal of restitution is satisfied. However, restitution is financial; incarceration is a deprivation of liberty. Substituting liberty for debt conflates civil remedy with criminal penalty. While her financial contribution is welcome, it does not justify her imprisonment.

  *Deterrence:* Punishment aims to discourage future misconduct by the offender and the public. Incarcerating an innocent volunteer fails this test. It does not deter the son, who learns he can offload consequences, nor does it deter the public, who may view justice as commodifiable by those with willing sacrifices. It signals that liberty is transferable, undermining the law's normative force.

  *Retribution:* Retribution requires moral blame proportional to the harm. It is inherently personal. To punish the innocent is not justice; it is violence. Even if volunteered, state-inflicted suffering on a blameless citizen violates the social contract. The state's authority to punish derives from the offender's breach of civic duty; that breach cannot be transferred.

  **II. The Theological Analogy and the Principled Line**
  The defense invokes penal substitutionary atonement—the theological concept that an innocent savior can bear the penalty for the guilty. Many citizens accept this in theology but reject it in law. Is this inconsistency? We argue there is a principled line.

  In theology, divine justice operates within a framework of grace and sovereign ownership. God, as the ultimate creditor and judge, may choose to absorb or transfer debt according to spiritual laws beyond human comprehension. The volunteer (Christ) is understood to be divine, possessing infinite merit to cover the deficit.

  In criminal justice, the State is not sovereign over human liberty in the same way. It is a trustee of public safety and individual rights. Human justice is bound by epistemic limits; we cannot know moral merit as God does. We only know acts and intent. If the state allows substitution, it risks creating a marketplace for suffering where wealth or family loyalty buys exemption from accountability. Accepting substitution in faith relies on grace; enforcing it in law relies on coercion. To apply theological mechanics to secular justice is a category error that threatens the legitimacy of the legal system. The inconsistency is not hypocrisy; it is a necessary boundary between the sphere of salvation and the sphere of civic order.

  **III. Mitigation and Alternative Sentencing**
  While we reject substitution, the mother's offer demonstrates significant family support and a willingness to make the victim whole. This is relevant to the defendant's risk profile. It suggests a higher likelihood of successful rehabilitation outside prison.

  Therefore, while the mother will not serve time, her willingness to assist in restitution should be considered as a mitigating factor for the *defendant*. We recommend the court explore a sentence of home confinement or probation, strictly conditioned on full financial restitution managed through the mother's assistance. This achieves the financial repair she desires without violating the principle of individual culpability.

  **CONCLUSION**
  The Commission affirms that criminal guilt is non-transferable. We deny the motion for substitution but urge the court to utilize the family's cooperation to construct a restorative sentence that honors the mother's sacrifice without imprisoning her.

  **Signed,**
  **State Sentencing Commission**
  **October 26, 2023**
