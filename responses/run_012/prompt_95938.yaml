answer: |-
  # Teaching Plan: The Looping Effects of Human Kinds
  **Audience:** PGY-3 Psychiatry Residents (90 Minutes)
  **Goal:** Move looping effects from "stigma slogan" to "clinical mechanism."

  ## Part 1: Case Study Selection (Constraint 1)

  ### The "Obvious" Cases (And Why They Fail Here)
  *   **Fugue States:** **Bad.** Obsolete. Residents will treat it as "we don't see this anymore," which kills the sense of ongoing interaction.
  *   **Multiple Personality (DID):** **Bad.** The malingering/iatrogenesis debate is too loud. Residents will get stuck on "Is it real?" rather than "How does the label change the person?"
  *   **Homosexuality:** **Bad.** It's a "resolved" historical example. It teaches that science *corrects* itself, not that people and categories *co-evolve*. It reinforces a "past bad, present good" narrative that blocks critical thinking about current categories.
  *   **Rosenhan Study:** **Bad.** This is about institutional validity and stigma (Labeling Theory), not Looping. It shows the power of the label to stick, not the power of the person to push back and change the label.

  ### PGD vs. Burnout
  *   **Prolonged Grief Disorder (PGD):** **Weak.** It is too new (DSM-5-TR/ICD-11). A loop requires time to close. We haven't seen how "grievers" will reshape the criteria yet. It looks like top-down pathologizing, not a two-way loop.
  *   **Burnout (ICD-11 QD85):** **Stronger.** It is explicitly *not* a medical disorder in the ICD, yet it is used as one clinically. This creates immediate tension.
      *   *Why it works:* It shows the *boundary* of psychiatry being tested by the people. Patients claim the label to access care/time off; clinicians use the code to document distress without medicalizing it; insurers resist it. The *meaning* of "Burnout" is being fought over in real-time.
      *   *What it needs:* You must frame it not as "Is burnout real?" but "How does having this code change how workers report symptoms and how HR policies are written?"

  ### The Better Case: Adult ADHD
  **Recommendation:** Use **Adult ADHD** as your primary carrying case.
  *   **Why:** It is the cleanest example of a "Moving Target."
      1.  **Classification:** DSM-III was for hyperactive boys.
      2.  **People:** Adults recognized themselves in the description (via pop psych/media).
      3.  **Reshaping:** They demanded diagnosis.
      4.  **Feedback:** Criteria shifted (DSM-IV/5) to accommodate "inattentive type" and adult presentation (internal restlessness vs. running around).
      5.  **Result:** The *kind* "ADHD Adult" did not exist in 1980. It exists now because the classification and the people adjusted to each other.
  *   **Pedagogical Value:** Residents prescribe stimulants to these patients daily. They see the "TikTok symptoms." It makes the abstract concrete.

  ---

  ## Part 2: The Sequence (90 Minutes)

  ### 0:00 – 0:15 | The Hook: The Moving Target
  *   **Activity:** Put two DSM criteria sets on the screen. DSM-III ADHD (Hyperkinetic Reaction of Childhood) vs. DSM-5 ADHD (Neurodevelopmental, lifespan).
  *   **Question:** "Did we just get better at finding the same thing? Or did the thing itself change?"
  *   **Concept Intro:** Introduce **Indifferent Kinds** (Quarks: they don't care what we call them) vs. **Interactive Kinds** (People: they hear the label and change).
  *   **Misconception Head-Off (Labeling Theory/Stigma):**
      *   *Point:* Explicitly distinguish Looping from Labeling.
      *   *Script:* "Labeling theory says a stamp ruins a life. Looping says the stamp changes the behavior, which forces us to change the stamp. It's not just damage; it's feedback."

  ### 0:15 – 0:45 | The Core Case: Adult ADHD (The Loop in Action)
  *   **Narrative Arc:**
      1.  **The Classification:** 1980s, hyperactive boys.
      2.  **The Uptake:** 1990s/2000s, adults read about it. "That's me."
      3.  **The Behavior Change:** Adults start organizing, advocating, reporting symptoms differently (not "running up walls," but "can't file taxes").
      4.  **The Classification Change:** DSM committees expand criteria to capture this new population.
      5.  **The New Normal:** Now, "ADHD" *means* something different than it did in 1980.
  *   **Misconception Head-Off (Social Construction = Unreal):**
      *   *Point:* Address the "It's all made up" fear.
      *   *Script:* "Looping doesn't mean the suffering is fake. Quarks are real, but they don't talk back. ADHD is real, but it talks back. That makes it harder to study, not false."
  *   **Misconception Head-Off (TikTok/Copying):**
      *   *Point:* Address symptom contagion.
      *   *Script:* "This isn't patients copying symptoms from TikTok. It's patients finding a language for distress that already existed, which then refines how they express that distress. It's translation, not fabrication."

  ### 0:45 – 0:60 | The Mechanism: Predicting the Loop
  *   **Transition:** "If you only see this in hindsight, it's history. If you can't predict it, it's not science. What do you need in place to predict a loop?"
  *   **Prerequisites to Establish:**
      1.  **Awareness:** The classified people must *know* the classification exists.
      2.  **Stakes:** The classification must matter to them (access to resources, identity, legal status).
      3.  **Malleability:** The behavior must be adaptable (unlike a tumor).
      4.  **Feedback Channel:** There must be a way for the people's reaction to reach the classifiers (research, advocacy, clinical observation).
  *   **Misconception Head-Off (Universal Application):**
      *   *Point:* Address "Does this apply to obesity/left-handedness?"
      *   *Script:* "Obesity loops (people diet because of the label). Left-handedness doesn't loop much anymore (we stopped punishing it). If the classification stops carrying social weight, the loop slows down."

  ### 0:60 – 0:80 | The Live Exercise: Inventing a Category
  *   **Setup:** "We are the DSM-6 Work Group. We are considering adding **'Algorithmic Compulsion Disorder'**."
  *   **The Board Prompt:**
      > **Category:** Algorithmic Compulsion Disorder (ACD)
      > **Proposed Criteria:** Persistent inability to disengage from curated feeds despite negative life impact; distress when offline.
      > **Task:** Map the Loop.
      > 1.  **Adoption:** Who claims this label first? (Teens? Tech workers? Parents?)
      > 2.  **Resistance:** Who fights the label? (Tech cos? Insurers? Patients who like the behavior?)
      > 3.  **Behavior Shift:** How does having this diagnosis change how a patient uses their phone *tomorrow*?
      > 4.  **Criteria Drift:** In 10 years, how will the criteria have to change because of #3?
  *   **Facilitation:** Force them to be specific. If they say "People feel stigmatized," push back: "That's labeling. How do they *act* differently?"
  *   **The Sharper Second Check (To prevent faking):**
      *   *Ask:* **"Where does this diagnosis fail to capture the patient?"**
      *   *Why:* If they only describe the fit, they haven't found the loop. The loop exists in the *friction*. They must identify a subgroup that will game the criteria or a symptom that will vanish because it's now "pathological."
      *   *Example Answer:* "High-frequency traders might claim ACD to get accommodations, forcing us to add an 'impairment' exclusion clause."

  ### 0:80 – 0:90 | Closing: Clinical Utility
  *   **Takeaway:** "You cannot stop the loop. You are part of it."
  *   **Action:** "When you diagnose, ask: 'How will this patient wear this label?' Will it be a shield? A weapon? A cage? That reaction is clinical data, not noise."
  *   **Misconception Head-Off (Anti-Diagnosis):**
      *   *Point:* Address "So we should stop diagnosing."
      *   *Script:* "No. We diagnose to treat. But we must know that the treatment includes the label itself. Monitor the loop."

  ---

  ## Part 3: The Misconception Map

  | Misconception | When It Surfaces | Intervention Point | The Pivot |
  | :--- | :--- | :--- | :--- |
  | **"This is just Labeling Theory / Stigma"** | 0:15 (Intro) | **Concept Intro** | Labeling is one-way (Society -> Patient). Looping is two-way (Patient -> Society -> Criteria). |
  | **"Social Construction means it isn't Real"** | 0:30 (Case Study) | **ADHD Mechanism** | Realness $\neq$ Static. Pain is real and interactive. The loop makes it *more* complex, not less true. |
  | **"Patients are copying symptoms off TikTok"** | 0:40 (Case Study) | **Behavior Shift** | Distinguish *malingering* from *accommodation*. Patients aren't faking; they are adapting their narrative to be heard. |
  | **"Doesn't this apply to everything? (Obesity)"** | 0:50 (Mechanism) | **Prerequisites** | Only applies where the *kind* can perceive the *classification*. Tumors don't read DSM. People do. |
  | **"So diagnosis is bad / We should stop"** | 1:25 (Closing) | **Clinical Utility** | Diagnosis is a tool. A hammer changes the nail. You still need the hammer, but don't blame the nail for bending. |

  ---

  ## Part 4: What to Skip (And Why)

  1.  **The Realism/Construction Ontological Fight:**
      *   *Skip:* Don't debate whether ADHD exists "in the brain" independent of society.
      *   *Why:* It's a philosophical rabbit hole that yields no clinical utility. Residents need to know how to *use* the category, not its metaphysical status. Frame it pragmatically: "It works, but it moves."
  2.  **Hacking's Later Machinery (Human Kinds vs. Natural Kinds deep dive):**
      *   *Skip:* Don't get into the full taxonomy of "classifying kinds."
      *   *Why:* 90 minutes is too short. Stick to the *Interactive* vs. *Indifferent* distinction. It's the only binary they need.
  3.  **Detailed History of Any Single Category:**
      *   *Skip:* Don't spend 20 minutes on the history of the word "Autism."
      *   *Why:* They need the *mechanism*, not the historiography. Use the history only as evidence of the mechanism (e.g., "Criteria changed in 1994 because...").
  4.  **The Ethics of "Making Up People":**
      *   *Skip:* Don't debate whether it's *moral* to create new kinds.
      *   *Why:* It's inevitable. The question is how to manage it responsibly, not whether to do it.

  ## Success Metric (How You'll Know It Worked)
  At the end of the session, ask a random resident: **"If we add 'Post-Scroll Dysphoria' to the DSM, name one way the criteria will be wrong in 5 years."**
  *   **Fail:** They say "Stigma will be worse" or "People will fake it." (This is Labeling Theory).
  *   **Pass:** They say "People will start curating their feeds to *avoid* the diagnosis, so 'scrolling' won't capture the behavior anymore," OR "Tech companies will build 'wellness modes' that become a diagnostic exclusion."
  *   **Why:** This shows they understand that the *people* will change the *phenomenon*, forcing the *science* to chase the tail. That is the Loop.
