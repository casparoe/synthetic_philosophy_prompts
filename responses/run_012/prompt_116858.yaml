answer: |-
  ### Mapping the Logical Space

  Before we sort your commitments, we must clear away the debris of the "Great Debate" era. The standard textbook approach asks you to choose a champion (Popper, Kuhn, Lakatos), but that obscures the actual architecture of the problem. The logical space of demarcation is defined by four axes, not by a menu of criteria. First, the **Target Axis**: are we labeling individual propositions, whole theories, historical sequences of theories, or the social practices of communities? Second, the **Modality Axis**: is the criterion a logical necessity (true by definition), a methodological decision (a rule we agree to follow), or a cluster concept (family resemblance)? Third, the **Temporal Axis**: is science a static state a theory occupies, or a dynamic trajectory it follows over time? Fourth, the **Force Axis**: does failing the test mean the claims are false (epistemic), or merely that they should be defunded or excluded from curricula (pragmatic)? This instrument navigates these axes. It does not ask you to know the history of philosophy; it asks you to decide what kind of work you want the word "science" to do.

  ***

  ### Demarcation Decision Tree

  1.  **Is the primary function of the distinction to identify a unique route to truth (epistemic), or to regulate the boundaries of a professional community (institutional)?**
      *   *Commentary:* This splits the **Force Axis**. If you choose "truth," you believe pseudoscience fails to know the world. If you choose "community," you believe pseudoscience fails to play by our rules, regardless of truth. This is the deepest fork; it determines whether the rest of the tree is about logic or sociology.

      *   **Branch A: Identify a unique route to truth (Epistemic)**
          2.  **Is the unit of assessment a set of statements (theories) or a pattern of activity (practices)?**
              *   *Commentary:* This navigates the **Target Axis**. "Statements" treats science as a product you can hold in your hand. "Practices" treats science as a verb, something people do. This choice determines whether we look at the logic of the claim or the behavior of the claimant.

              *   **Branch A1: A set of statements (Theories)**
                  3.  **Is the defining condition a single necessary rule or a weighted cluster of features?**
                      *   *Commentary:* This addresses the **Modality Axis**. A single rule promises clarity but risks rigidity. A cluster admits complexity but risks vagueness. This node separates the search for an essence from the acceptance of a family resemblance.

                      *   **Branch A1a: A weighted cluster of features**
                          *   **LEAF: The Cluster View.**
                          *   *Awkward Commitment:* It cannot deliver a sharp verdict in borderline cases, leaving you unable to definitively exclude a practice that lacks enough features.
                          *   *Case Fit:* Explains why homeopathy shares methods (trials) with science but lacks theoretical coherence.

                      *   **Branch A1b: A single necessary rule**
                          4.  **Is this rule a property of the logical form of the theory, or a methodological decision by the scientist?**
                              *   *Commentary:* This splits the **Modality Axis** further. Logical form implies the theory itself is scientific or not. Methodological decision implies science is a stance one takes toward a theory. This distinguishes between what a theory *is* and how we *treat* it.

                              *   **Branch A1b-i: A methodological decision by the scientist**
                                  *   **LEAF: Methodological Conventionalism.**
                                  *   *Awkward Commitment:* It makes the scientific status of a theory a matter of arbitrary stipulation, potentially allowing unfalsifiable speculative physics to count as science simply by fiat.
                                  *   *Case Fit:* Accommodates speculative physics proposals that are currently unfalsifiable yet treated as continuous with respectable science.

                              *   **Branch A1b-ii: A property of the logical form**
                                  5.  **Is the theory refutable in isolation from auxiliary assumptions?**
                                      *   *Commentary:* This tests the **Logical Axis** against the Duhem-Quine problem. If you say "yes," you ignore that theories are tested in bundles. If you say "no," you admit logic alone cannot demarcate. This node exposes the fragility of logical criteria.

                                      *   **Branch A1b-ii-Yes:**
                                          *   **LEAF: Naive Falsificationism.**
                                          *   *Awkward Commitment:* It condemns almost all universal laws as unscientific because strict logical refutation is rarely possible without ceteris paribus clauses.
                                          *   *Case Fit:* Classifies astrology as unscientific due to its habit of absorbing failed predictions by appeal to unspecified further influences.

                                      *   **Branch A1b-ii-No:**
                                          *   **EMPTY BRANCH: Incoherent.**
                                          *   *Diagnosis:* This combination is logically unstable. If the theory is not refutable in isolation, then "logical form" is insufficient to determine its status, contradicting the commitment at Node 4 that the rule is a property of the form. No position occupies this space because it collapses into Methodological Conventionalism.

              *   **Branch A2: A pattern of activity (Practices)**
                  6.  **Is the assessment based on the historical trajectory of the ideas or the current state of the community?**
                      *   *Commentary:* This engages the **Temporal Axis**. "Trajectory" requires time to judge; you need a movie, not a snapshot. "Current state" looks at the norms in place right now. This determines whether a fledgling science can be distinguished from a degenerating pseudoscience.

                      *   **Branch A2a: The historical trajectory of the ideas**
                          7.  **Is progress defined by the prediction of novel facts or the resolution of existing anomalies?**
                              *   *Commentary:* This refines the **Target Axis** for historical views. "Novel facts" demands expansion into the unknown. "Resolution of anomalies" demands deepening understanding of the known. This separates the view that science grows outward from the view that it digs deeper.

                              *   **Branch A2a-i: Prediction of novel facts**
                                  *   **LEAF: The Research Programme View.**
                                  *   *Awkward Commitment:* It justifies retaining refuted theories for long periods if the "core" is protected, potentially shielding dogmatism under the guise of long-term strategy.
                                  *   *Case Fit:* Distinguishes a degenerating astrology from a progressing physics by looking at the sequence of theories over time.

                              *   **Branch A2a-ii: Resolution of existing anomalies**
                                  *   **LEAF: The Normal Science View.**
                                  *   *Awkward Commitment:* It makes radical innovation look like pseudoscience in its early stages, as revolutionaries initially fail to solve the puzzles of the reigning paradigm.
                                  *   *Case Fit:* Explains why a new theory might be rejected by the community not because it is false, but because it refuses to play the established puzzle-solving game.
                                  *   *Indistinguishability Flag:* This leaf is difficult to separate from **The Community Practice View** in practice, as both rely on the community's current engagement. The distinction here is purely theoretical (history vs. state), but empirically they often yield the same verdict.

                      *   **Branch A2b: The current state of the community**
                          8.  **Is the key factor the shared procedural norms they follow or the intellectual character of the individuals?**
                              *   *Commentary:* This splits the **Target Axis** within sociology. "Norms" focuses on the system. "Character" focuses on the agents. This determines whether the failure of pseudoscience is a structural flaw or a moral one.

                              *   **Branch A2b-i: Shared procedural norms**
                                  *   **LEAF: The Community Practice View.**
                                  *   *Awkward Commitment:* It implies that a community could be scientifically rigorous yet systematically wrong if their shared norms are misaligned with reality.
                                  *   *Case Fit:* Describes "scientific" as a practice in good working order, regardless of whether the specific theory is ultimately true.

                              *   **Branch A2b-ii: Intellectual character of the individuals**
                                  *   **LEAF: Virtue Epistemology.**
                                  *   *Awkward Commitment:* It turns scientific disputes into ad hominem attacks, where the truth of a claim depends on the honesty of the claimant.
                                  *   *Case Fit:* Distinguishes between inquirers who are honest and responsive to evidence and those who are not, regardless of the theory's logical form.

      *   **Branch B: Regulate the boundaries of a professional community (Institutional)**
          9.  **Is the label used to describe a difference that already exists or to enforce a boundary that should exist?**
              *   *Commentary:* This returns to the **Force Axis**, but for institutions. "Describe" suggests the word "science" is just a report on usage. "Enforce" suggests it is a tool for gatekeeping. This determines whether you are an observer or a regulator.

              *   **Branch B1: Describe a difference that already exists**
                  *   **LEAF: The Social Label View.**
                  *   *Awkward Commitment:* It grants equal epistemic footing to medicine and magic in principle, admitting there is no deep reason to trust one over the other beyond social habit.
                  *   *Case Fit:* Holds that there is no epistemically interesting distinction at all but the word still earns its keep as a rough social label.

              *   **Branch B2: Enforce a boundary that should exist**
                  *   **LEAF: The Political/Rhetorical View.**
                  *   *Awkward Commitment:* It reduces truth claims to power struggles, implying that "pseudoscience" is merely a slur used by the powerful to silence the marginal.
                  *   *Case Fit:* Analyzes cases where the label "pseudoscience" looks like it is doing social or institutional work rather than epistemic work, such as funding disputes.
                  *   *Indistinguishability Flag:* This leaf is often empirically indistinguishable from **The Social Label View** to an outside observer, as both deny an epistemic core. The difference lies solely in the intent of the speaker (neutral description vs. active exclusion).

  ***

  ### Diagnostic Notes on Empty and Overlapping Branches

  **The Empty Branch (Node 5, "No"):**
  You will find no serious philosopher occupying the branch where one insists on a *logical property* of the theory but admits the theory is *not refutable in isolation*. This is incoherent. If the refutation depends on auxiliary assumptions, the logical property belongs to the system, not the theory. To occupy this branch, you would have to claim logic dictates demarcation while simultaneously admitting logic cannot isolate the theory. This combination is empty because it collapses immediately into Methodological Conventionalism (Node 4, Branch i), where the scientist decides which parts of the system to hold immune.

  **Indistinguishable Leaves (Normal Science vs. Community Practice):**
  The **Normal Science View** and the **Community Practice View** are flagged as difficult to separate. Both locate "science" in the activity of a group rather than the logic of a statement. In a handout for physicists, the distinction may seem academic: both views will classify the same work as scientific based on peer review and puzzle-solving. The distinction matters only if a community is solving puzzles (Normal Science) but violating procedural norms (Community Practice), a rare theoretical edge case.

  **Indistinguishable Leaves (Social Label vs. Political/Rhetorical):**
  Similarly, the **Social Label View** and the **Political/Rhetorical View** both deny an epistemic essence. To a journalist observing a debate, both views look like "demarcation is subjective." The split exists only in the *motivation* for using the word. If you use "pseudoscience" to save budget resources, you are on the Political leaf. If you use it because it's the common term for "stuff physicists do," you are on the Social Label leaf. Since motives are hidden, these leaves often merge in practice.
