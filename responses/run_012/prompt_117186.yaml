  4.  **Drafting Section 2: Disagreements:**
      *   Need to capture the essence without begging the question.
      *   *Causal-Shape:* The moral weight attaches to the *intervention*. Changing a parameter is an intervention. Leaving it is not. The baseline is "system off" or "natural course."
      *   *Commitments:* The moral weight attaches to the *breach of duty*. The baseline is "what was expected/reasonable." Changing a parameter is only significant if it violated a duty.
      *   *Word vs. Substance:* Is "cause" the right word for omission? Causal-Shape says no (omission isn't a cause). Commitments says yes (omission is a cause). This might be semantic, but it drives the moral intuition.

  5.  **Drafting Section 3: Cruxes & Tests:**
      *   *Crux 1: The Baseline Problem.* What is the "normal" state against which we measure intervention?
          *   *Test:* The "Unset" Default (Type b).
