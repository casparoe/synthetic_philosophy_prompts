          *   *Test:* The "Inherited" Default (Type c).
          *   *Causal Prediction:* The inheritor didn't cause the setting. They are merely allowing the previous setting to persist. Less blame.
          *   *Commitments Prediction:* The inheritor owns the system now. If the setting is dangerous, keeping it is a breach of current duty. Equal blame.
      *   *Crux 3: The "Switch" Intuition.* Does flipping a switch feel different when the machine is running vs. off?
