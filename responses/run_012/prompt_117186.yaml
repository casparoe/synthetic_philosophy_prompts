      *   *Dead Ends:* Arguing about physical causality alone (physics doesn't care about omissions). Arguing about intent alone (negligence exists without intent). Arguing that "doing" is always worse than "allowing" (both likely agree context matters).
      *   *Substantive Agreements:* The software exerts agency on behalf of the clinicians. The configuration determines the path of least resistance. The passage of time (person moved teams) complicates accountability but doesn't erase the act.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to be substantive.
