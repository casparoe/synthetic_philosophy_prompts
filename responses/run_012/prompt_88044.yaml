answer: |-
  This is a classic philosophical stalemate, and your suspicion is correct: you were arguing past each other because "could have done otherwise" is one of the most overloaded phrases in the history of philosophy. Your housemate is treating it as a metaphysical claim about the universe; you were likely trying to treat it as a claim about agency. Neither of you was wrong about your own definition, but you weren't sharing one.

  Here is the menu for the kitchen table. It breaks down the precise meanings of "could have done otherwise" (CHDO), whose "could" is in play, and the verdict on each.

  ### The Menu: Five Readings of "Could Have Done Otherwise"

  #### 1. The "Forking Paths" Reading (Metaphysical Possibility)
  *   **What it claims:** Given the *exact* same past history and the *exact* same laws of nature, it was possible for the agent to produce a different outcome. The future was genuinely open at the moment of choice.
  *   **Whose "could":** The Universe's. It is a claim about the causal structure of reality.
  *   **Verdict:** **False** (under determinism).
  *   **Status:** This is a substantive thesis about laws and causation. If determinism is true, this reading is impossible.
  *   **Does it kill free will?** Only if you accept this is the *only* valid reading. This is your housemate's trump card. It is the core of **Incompatibilism**.
  *   **Confidence:** **High.** This is the standard definition of "alternate possibilities" in the incompatibilist literature.

  #### 2. The "Conditional" Reading (Hypothetical Ability)
  *   **What it claims:** "I could have done otherwise" means "If I had chosen/wanted/desired otherwise, I would have done otherwise." It analyzes the "could" as a conditional power.
  *   **Whose "could":** The Agent's. It is a claim about the agent's responsiveness to their own will.
  *   **Verdict:** **True** (under determinism).
  *   **Status:** True but conditional. It doesn't require the past to be different, only that the agent's psychology is not broken (e.g., no phobias, addictions, or external constraints blocking the will).
  *   **Does it kill free will?** No. This is the classic **Compatibilist** move. It grants determinism but says free will is about the link between choice and action, not the origin of the choice.
  *   **Confidence:** **Medium-High.** This is the historical standard (Hume, Moore), though modern philosophers have found technical flaws in it (see "Soft Spot" below).

  #### 3. The "Dispositional" Reading (Capacity & Opportunity)
  *   **What it claims:** "I could have done otherwise" means "I had the general capacity to do X, and nothing prevented me." (e.g., I can speak French; I was not gagged). It treats "could" like a skill or a physical capability.
  *   **Whose "could":** The Agent's (relative to the environment).
  *   **Verdict:** **True** (under determinism).
  *   **Status:** Trivially true in most everyday cases. It distinguishes between "I didn't jump" and "I couldn't jump."
  *   **Does it kill free will?** No. Compatibilists cheerfully grant this. It shifts the debate from "causation" to "coercion."
  *   **Confidence:** **High.** This is rarely contested except by hard determinists who insist internal causes (brain states) count as coercion.

  #### 4. The "Epistemic" Reading (Predictability)
  *   **What it claims:** "I could have done otherwise" means "No one could have known for certain beforehand what I would do."
  *   **Whose "could":** An Observer's. It is a claim about knowledge, not reality.
  *   **Verdict:** **False** (strictly speaking, under determinism/Laplace's Demon), but **Practically True** for humans.
  *   **Status:** Unfalsifiable for humans, false for gods.
  *   **Does it kill free will?** No. Even if a demon could predict you, you might still feel free. This reading is usually a distractor in this debate.
  *   **Confidence:** **High.** Epistemic uncertainty does not entail metaphysical freedom.

  #### 5. The "Sourcehood" Reading (Origination)
  *   **What it claims:** "I could have done otherwise" is a shorthand for "The action originated in me, not in something external." It focuses on *who* caused the action, not whether other actions were possible.
  *   **Whose "could":** The Agent's (as a source).
  *   **Verdict:** **Debatable.** Depends on whether "me" includes my prior causes.
  *   **Status:** Substantive thesis about identity and causation.
  *   **Does it kill free will?** This is the battleground. Compatibilists say "Yes, it originated in your psychology." Incompatibilists say "No, it originated in the Big Bang."
  *   **Confidence:** **Medium.** This is where the debate currently lives (Reasons-Responsiveness vs. Ultimate Responsibility).

  ---

  ### Specific Request 1: The Frankfurt Cases
  Your housemate called them a "party trick." He is dismissing them because he thinks they rely on intuition pumps rather than logic. Here is why they matter, specifically regarding the menu above.

  Frankfurt cases are designed to attack **Reading 1 (Forking Paths)**.
  *   **The Setup:** Imagine a neuroscientist is monitoring your brain. If you are about to choose A, he does nothing. If you are about to choose B, he intervenes and forces you to choose A. You choose A on your own. The scientist did nothing.
  *   **The Kicker:** You *could not have done otherwise* (Reading 1 is false; the scientist would have stopped you). Yet, you seem morally responsible because the scientist *didn't* actually touch you.
  *   **The Verdict:** If you agree you are responsible in this case, then **CHDO (Reading 1) is not necessary for free will.**
  *   **Why he hates it:** It severs the link between "Alternate Possibilities" and "Responsibility." If he wants to keep his "full stop" claim, he has to argue that you *aren't* responsible in the Frankfurt case. Most people find that counter-intuitive.
  *   **Confidence:** **Medium-High.** Frankfurt cases are widely accepted as damaging to the "Principle of Alternate Possibilities," though there are sophisticated "flicker of freedom" objections your housemate could raise.

  ### Specific Request 2: Psychology vs. The World
  You asked: *Do the readings under which CHDO comes out true all end up being about the agent's psychology rather than about the world?*

  **Verdict:** **Yes, mostly.**
  *   **Readings 2, 3, and 5** (where CHDO comes out True under determinism) are all about the relationship between the agent's internal states (psychology) and the immediate environment. They ask: "Was the mechanism of choice functioning correctly?"
  *   **Reading 1** (where CHDO comes out False under determinism) is the only one that is about the **World** (the causal history of the universe).
  *   **The Crux:** Your housemate insists free will requires a claim about the **World** (Reading 1). You were trying to defend a claim about the **Psychology** (Readings 2/3). You were both right about your definitions, but he wins if he can prove that Psychology isn't enough.

  ---

  ### Confidence & The Soft Spot

  I am assigning confidence levels based on philosophical consensus, not metaphysical truth (since there is no consensus on the metaphysics).

  1.  **Forking Paths (Reading 1):** Confidence **High**. Everyone agrees determinism kills this. The fight is whether we need it.
  2.  **Conditional (Reading 2):** Confidence **Medium**. (See Soft Spot).
  3.  **Dispositional (Reading 3):** Confidence **High**. Hard to deny we have capacities.
  4.  **Epistemic (Reading 4):** Confidence **High**. Clear distinction between knowledge and causality.
  5.  **Frankfurt Relevance:** Confidence **Medium-High**. Widely accepted, but technical objections exist.

  #### The Soft Spot (Where he will attack you)
  The weakest link in the Compatibilist armor—and the place your housemate will try to pierce—is **Reading 2 (The Conditional Analysis).**

  **Why it's soft:**
  The statement is: "If I had chosen otherwise, I would have done otherwise."
  Your housemate will say: "But under determinism, **you could not have chosen otherwise.**"
  If the "If" part (the antecedent) is impossible, the whole conditional statement becomes vacuous or false (depending on your logic). This is known as the **Conditional Fallacy**.

  **How to arm yourself:**
  Don't defend the Conditional Analysis as the *final* word. Modern compatibilists have moved to **"Reasons-Responsiveness."**
  *   **The Move:** Admit Reading 2 is clunky. Say: "Okay, fine. Maybe 'if I had chosen otherwise' is weird under determinism. But the *point* of that phrase was to track whether my actions track my reasons. If I had a reason to do B, would my mechanism have produced B? If yes, I'm free. If no (because of compulsion/insanity), I'm not."
  *   **Why this helps:** It shifts the debate away from "Could the universe have been different?" (which he wins) to "Is this agent responsive to reasons?" (which is an empirical, cognitive science question he should care about).

  **Summary for the Kitchen Table:**
  Tell him: "You are using Reading 1 (Forking Paths). I am using Reading 3 (Dispositional). You are right that determinism kills Reading 1. I am right that Reading 3 is all we need for responsibility. Frankfurt cases show Reading 1 isn't even necessary. The only thing we are actually arguing about is whether 'free will' refers to the history of the universe or the functioning of the agent."
