      He never used culture to explain a person away. He used it to know where to start looking. The pattern gets you to the door. Only the person lets you in. If you treat the map like the terrain, you'll never actually arrive.

      So, to the colleagues: thank you for sharing the map. To the family: thank you for sharing the candy. And to Dad: thank you for teaching me that the only essential thing about anyone is that they're sitting right in front of you.

      Cheers.

