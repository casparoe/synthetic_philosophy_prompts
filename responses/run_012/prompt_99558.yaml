      Good evening. For the neighbors here, I'm the one who gets the weird candy. The kind with wrappers you can't read and flavors that challenge your biology—licorice that tastes like medicine, chocolate that crunches like gravel. For the colleagues here, you know the real currency wasn't the candy, it was the stories. Specifically, the taxi driver stories. Thirty-two years of them.

