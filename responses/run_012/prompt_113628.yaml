      *   *Normativist Overstatement:* Need to distinguish Strong (radical constructivism) vs. Weak (evaluation is necessary but constrained by biology). The draft paints all normativists as Strong.
      *   *HDA Fairness:* The draft dismisses the "dysfunction" component's naturalistic anchor too quickly.
      *   *Reference Class:* Boorse's "reference class" (age, sex, species) is a normative choice disguised as statistical. Who counts as the reference class? This undermines the "purely descriptive" claim.
      *   *Conclusion Validity:* Since the premise about values in science is flawed, the conclusion doesn't follow.

