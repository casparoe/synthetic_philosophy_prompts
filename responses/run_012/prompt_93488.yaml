answer: |-
  ### The Sidebar: A Dialogue on Moore's Friendship

  **Elena:** You're dismissing the *Principia* too quickly. Moore's insistence that friendship is an intrinsic good isn't just a preference; it's the result of the isolation test. Imagine a universe containing nothing but two friends conscious of their mutual affection. Moore asks: is that good? Yes. Is it good *because* of what comes after? No. Therefore, it's intrinsically good.

  **Marcus:** But look at what the isolation test does to the relation. To isolate "friendship," you have to isolate the *consciousness* of the friendship. Once you zoom in on what's actually doing the valuing work in that empty universe, the "friend" drops out. You're left valuing a mental state *about* a person, not the person themselves.

  **Elena:** That's the old reductionist charge. Moore anticipates it. That's why he introduces organic unities. The value isn't in the mind plus the friend as a sum. It's in the *whole*. The relation itself is the bearer of value. If you break it down to just the mental state, you've violated the principle of non-summativity.

  **Marcus:** But what does the "whole" add, metaphysically? If the value is in the unity, then any unity of the same type should hold the same value. If I swap your friend for a perfect duplicate who shares the same history, does the value hold? For Moore, it seems it must. The particularity of the other person—their specific history, their irreplaceability—gets washed out by the abstraction required to make it an "organic whole."

  **Elena:** You're asking for a metaphysics of personhood Moore wasn't building. He's saving us from hedonism. If you say the value is only in the mental state, you're back to Bentham. Moore's insight is that the *object* of the affection matters. The beauty of the friend is a constituent of the good, not just a trigger for it.

  **Marcus:** I'm not saying go back to Bentham. I'm saying Moore's machinery can't carry the weight he puts on it. If the isolation test requires us to strip away consequences, and the organic unity requires us to treat the relation as a abstractable whole, then "friendship" becomes a type of state of affairs, not a bond between individuals. It's a beautiful state of affairs, sure. But it makes the friend replaceable.

  **Elena:** And what's your alternative? If you deny the isolation test, you make all value instrumental. If you deny organic unities, you can't explain why a tragic love is better than a shallow joy. You need Moore's distinctions to even articulate why friendship isn't just useful.

  **Marcus:** I need them to articulate it, yes. But I don't need them to ground it. Moore wants to say friendship is good *in itself*. I'm saying his own test shows it's good *in consciousness*. He wants the realism without the metaphysical cost. He wants the friend to matter, but his test only lets the *idea* of the friend through the door.

  ***

  ### Scholar's Note: Settled vs. Contested

  **What is Settled:**
  *   **The Big Three:** It is uncontroversial that Moore identifies "the pleasures of human intercourse" (friendship) and "appreciation of beautiful objects" as the greatest intrinsic goods in *Principia Ethica* (1903).
  *   **The Tools:** Scholars agree Moore employs the **Isolation Test** (imagining a thing exists in absolute isolation to judge its intrinsic value) and the **Doctrine of Organic Unities** (the value of a whole is not necessarily the sum of its parts).
  *   **Anti-Hedonism:** It is settled that Moore intended to distinguish his view from hedonism by insisting the *object* of consciousness contributes to value, not just the consciousness itself.

  **What is Contested:**
  *   **The Isolation Test & Relations:** There is active debate over whether the Isolation Test can coherently apply to relations like friendship. Critics (like Marcus in the dialogue) argue that isolating a relation inevitably isolates the *relata* (the people), which complicates the "absolute isolation" requirement. Some argue Moore implicitly values the *consciousness* of the relation, not the relation itself.
  *   **Particularity vs. Universality:** A live disagreement exists regarding whether Moore's "organic unities" can account for the value of *particular* individuals. If value attaches to a "whole state of affairs," does the specific identity of the friend matter, or only the instantiation of the "friendship" universal? The dialogue leans on the critique that Moore's framework renders friends replaceable, a charge disputed by defenders who argue Moore's realism preserves the object's importance.
  *   **Moore's Consistency:** Some scholars argue Moore abandoned or significantly modified the Doctrine of Organic Unities in his later work (*Ethics*, 1912), suggesting he recognized the difficulties raised in the *Principia*.

  **Liberties & Flags:**
  *   **Compression:** The dialogue treats *Principia Ethica* as a monolith. In reality, Moore's views shifted between 1903 and 1912 regarding the definition of "intrinsic value."
  *   **The "Duplicate" Argument:** Marcus's point about the "perfect duplicate" is a modern extension of Moorean criticism (reminiscent of Nozick's Experience Machine or worries about substitutability) rather than a direct quote from Moore's contemporaries, though it fits the logical trajectory of the critique.
  *   **Metaphysical Depth:** The dialogue implies Moore had a robust metaphysics of "wholes." In fact, Moore was often cautious about metaphysics, treating "organic unity" more as a logical point about value attribution than a claim about the fabric of reality.
