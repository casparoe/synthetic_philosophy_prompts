answer: |-
  Here is the specification sheet you asked for. It is designed to be handed directly to your friend. It avoids slogans and lays out the structural tensions any definition of disease must navigate.

  ### The Spec Sheet: Desiderata for a Theory of Disease

  A viable theory of disease (and its counterpart, health) must satisfy the following constraints. Each entry includes the **Requirement**, the **Test Case** (the philosophical stress test), and the **Status** (whether this is a consensus constraint or a partisan commitment).

  #### 1. The Non-Moralizability Constraint
  *   **Requirement:** Disease status cannot be assigned solely on the basis of social deviance or moral disapproval. There must be a boundary between "bad behavior" and "broken mechanism."
  *   **Test Case:** *Drapetomania* (the 19th-century diagnosis for enslaved people fleeing captivity) and *Homosexuality* (DSM-I/II). Both were socially disapproved and medically codified, but retrospectively rejected as diseases.
  *   **Status:** **Genuine Constraint.** Almost no contemporary theorist (Naturalist or Normativist) wants to defend these as valid diseases. This is the baseline for avoiding medical tyranny.

  #### 2. The Harm Requirement
  *   **Requirement:** To count as a disease, a condition must be "bad for" the bearer. A biological anomaly that confers no disadvantage is a variation, not a pathology.
  *   **Test Case:** *Infertility.* Biologically, it is a failure of reproductive function. But for a person who does not want children, it is not "bad." Conversely, *Grief* is deeply harmful and disabling, but typically not a disease.
  *   **Status:** **Genuine Constraint (with caveats).** Everyone agrees disease implies some negative impact, but they disagree on whether "harm" is objective (survival/reproduction) or subjective (well-being/goals).

  #### 3. The Dysfunction Requirement
  *   **Requirement:** Disease must involve a failure of internal mechanisms to perform their natural functions. It cannot be merely an external mismatch between the organism and the environment.
  *   **Test Case:** *Nearsightedness (Myopia).* In modern urban East Asia, this is the statistical majority. Is it a disease or just a mismatch between evolved eyes and modern screens? If dysfunction is "failure of species design," it's a disease. If it's "statistical abnormality," it's normal in Tokyo.
  *   **Status:** **Naturalist Commitment.** Normativists argue that "function" is itself a value-laden concept. Hybrid theorists (like Wakefield) try to hold this line, but it struggles with environmental mismatches.

  #### 4. The Phenomenological Validation Constraint
  *   **Requirement:** The theory must account for conditions where the patient experiences severe harm but no clear biological malfunction is detectable.
  *   **Test Case:** *Chronic Pain Syndromes / ME/CFS.* Patients suffer immense disability, but biomarkers are often absent or contested. A theory that says "no biomarker, no disease" invalidates patient suffering.
  *   **Status:** **Normativist/Patient Commitment.** Pure Naturalists (like Boorse) struggle here, often forced to call these "illnesses" (subjective) but not "diseases" (objective), a distinction patients find unhelpful.

  #### 5. The Asymptomatic Pathology Constraint (The "Predisease" Problem)
  *   **Requirement:** The theory must explain why we treat risk factors as diseases even when they cause no current harm and no current functional failure.
  *   **Test Case:** *High Cholesterol, Osteopenia, Prediabetes.* These are labeled and medicated before symptoms arise. They are "diseases" only because they predict future harm.
  *   **Status:** **Modern Medical Commitment.** This breaks the "Harm + Dysfunction" hybrid model. If there is no current harm and the mechanism is functioning (just producing high numbers), why is it a disease *now*?

  #### 6. The Reference Class Stability Constraint
  *   **Requirement:** Disease status should not flip-flop wildly based on how you group the population (the reference class).
  *   **Test Case:** *Aging.* Cellular senescence is universal and statistically normal for the species. Yet it involves massive functional decline. If "normal" = "healthy," aging is healthy. If "functional efficiency" = "healthy," aging is a disease.
  *   **Status:** **Technical Constraint.** This is the Achilles' heel of Biostatistical Theory. If you define disease as "statistical subnormality," then any universal condition (like aging or myopia in specific populations) ceases to be a disease.

  #### 7. The Cross-Species Universality Constraint
  *   **Requirement:** The definition should ideally apply to non-human animals and plants, not just humans. A broken leg is a disease/injury in a dog, not just a human.
  *   **Test Case:** *A lame horse vs. a depressed human.* Can we speak of disease in a tree?
  *   **Status:** **Naturalist Commitment.** Normativists argue disease is a human social role; a dog has "injuries" but not "diseases" in the normative sense. If you want a biological theory, this is mandatory. If you want a clinical theory, it is optional.

  #### 8. The Intervention Warrant
  *   **Requirement:** Labeling something a "disease" must license medical intervention. If it doesn't change what we *do*, the label is theoretically idle.
  *   **Test Case:** *Grief vs. Depression.* Both involve sadness and dysfunction. We treat one, we support the other. The line is not biological; it is normative (time limits, cause).
  *   **Status:** **Pragmatic Commitment.** This is what doctors actually care about. If a theory says "this is a disease" but "do not treat it," it fails the clinical spec.

  ---

  ### The Trilemma: What Cannot Hold Together

  You asked specifically about the tension between three claims:
  1.  **Value-Free:** Disease is a biological fact, independent of what we like or want.
  2.  **Badness:** Disease entails something harmful or negative for the person.
  3.  **Intervention:** Disease status licenses medical treatment.

  **You cannot hold all three.** You must drop one.

  *   **If you keep Value-Free + Badness:** You lose **Intervention**.
      *   *Why:* Aging is biologically "dysfunctional" and "bad" (death), but we do not (currently) treat aging as a disease to be cured medically. Similarly, Infertility is a biological dysfunction, but if the patient doesn't value fertility, it isn't "bad," so treatment isn't licensed.
  *   **If you keep Value-Free + Intervention:** You lose **Badness**.
      *   *Why:* This leads to technocracy. You treat statistical outliers (e.g., low testosterone in an asymptomatic elderly man) because the numbers are "wrong," even if the patient feels fine. The "badness" is in the number, not the person.
  *   **If you keep Badness + Intervention:** You lose **Value-Free**.
      *   *Why:* This is the Normativist position. "Disease" is whatever we decide is bad enough to warrant medical help. This risks *Drapetomania*: if society decides running away is "bad" and warrants "correction," it fits the spec. You need an external anchor (biology) to prevent this.

  **The Verdict:** The claim that must go is **Value-Free**.
  You cannot define "Bad for the person" (Harm) without referencing the person's goals, environment, and values. Infertility is only a disease if you value reproduction. Myopia is only a disease if you value distance vision in a literate society. The "fact" of the dysfunction is value-free; the classification of that dysfunction as a *disease* is not.

  ---

  ### The Killer Constraint

  You asked which single requirement does the most damage to the usual candidates (Biostatistical, Harm+Dysfunction, Flat Normativist).

  **The Winner:** **The Reference Class Stability Constraint (Case: Myopia & Aging).**

  This requirement destroys the **Biostatistical Theory (Naturalism)** most effectively, which is the dominant "disease is a fact" model your friend likely leans on.

  *   **Why it kills Biostatistical Theory:** The Biostatistical account defines disease as "statistical subnormality of function relative to a reference class."
      *   *The Myopia Problem:* In urban East Asia, >80% of young adults are nearsighted. It is statistically *normal*. By strict biostatistical rules, it cannot be a disease there, while it is a disease in a population where it is rare. This makes disease status geographically contingent, which undermines the "natural fact" claim.
      *   *The Aging Problem:* Functional decline is universal in humans over 80. It is statistically normal. Therefore, under this theory, aging cannot be a disease. But medicine increasingly treats aging processes (senolytics, etc.).
  *   **Why it pressures the Hybrid (Harm+Dysfunction):** It forces the theorist to admit that "Dysfunction" is not a fixed biological state but is relative to the environment. If glasses fix the myopia, is the eye dysfunctional or is the environment hostile?
  *   **Why it pressures the Normativist:** It forces them to admit that biology *constrains* the norm. We can't just decide cancer is healthy because we like it; the biological failure is too stark.

  **Summary for your friend:**
  If she wants "Disease" to be a pure natural fact (like "fracture" or "virus"), she fails the **Infertility** and **Grief** tests (because value judgments are required to distinguish them). If she wants "Disease" to be purely about harm (Normativism), she fails the **Drapetomania** test (because she loses the biological anchor).

  The only way out is to admit that **"Disease" is a hybrid concept:** It names a biological dysfunction *selected for attention* by social values. It is a fact that the eye doesn't focus; it is a value judgment that this counts as a disease requiring treatment rather than a variation requiring glasses. The spec sheet proves you can't have the concept without both parts.
