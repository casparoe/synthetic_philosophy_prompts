  # ANSWER KEY (NOT FOR STUDENTS)

  ### Round 2: MIU Impossibility Proof
  **Claim:** MU is unreachable from MI.
  **Invariant:** Let $k$ be the number of I's in a string.
  1.  **Base Case:** Start string **MI** has $k=1$. $1 \not\equiv 0 \pmod 3$.
  2.  **Inductive Step:** Check all rules.
      *   **Rule 1 ($xI \to xIU$):** $k \to k$. (Mod 3 unchanged).
      *   **Rule 2 ($Mx \to Mxx$):** $k \to 2k$.
          *   If $k \equiv 1$, $2k \equiv 2$.
          *   If $k \equiv 2$, $2k \equiv 4 \equiv 1$.
          *   (Multiplication by 2 permutes 1 and 2 mod 3; never yields 0).
      *   **Rule 3 ($III \to U$):** $k \to k-3$. (Mod 3 unchanged).
      *   **Rule 4 ($UU \to \epsilon$):** $k \to k$. (Mod 3 unchanged).
  3.  **Conclusion:** Any derivable string must have $k \not\equiv 0 \pmod 3$.
  4.  **Target:** **MU** has $k=0$. $0 \equiv 0 \pmod 3$.
  5.  **Verdict:** Unreachable.

  ### Round 3: MIU-Prime (System B)
  **Rules:**
  1.  $xI \to xIU$
  2.  $Mx \to Mxx$ **IF x contains no U**. (Constraint Added)
  3.  $III \to U$
  4.  $UU \to \epsilon$
  **Start:** MI. **Target:** MUIU.

  **Analysis:**
  1.  **Invariant Check:** Target MUIU has 2 I's. $2 \not\equiv 0 \pmod 3$. The standard MIU invariant **passes**. A student relying solely on the Round 2 trick will predict **Reachable**.
  2.  **Actual Reachability:** **Impossible.**
  3.  **Proof of Impossibility (The "Different Obstruction"):**
      *   To reach MUIU, we need U's. U's are created by Rule 1 or Rule 3.
      *   To get enough I's to manipulate (we need 2 I's in the final string, starting from 1), we generally need Rule 2 (Doubling).
      *   **Constraint:** Rule 2 is **forbidden** if the string contains a U.
      *   Therefore, all applications of Rule 2 must occur **before** the first application of Rule 1 or 3.
      *   **Phase 1 (No U's):** Start MI.
          *   Apply R2: MII. (Now we have 2 I's).
          *   Apply R2 again: MIIII. (4 I's).
          *   We cannot create U's yet.
      *   **Phase 2 (U's Present):** Once we use R1 or R3, a U exists. Rule 2 is now permanently disabled.
      *   **The Bottleneck:**
          *   If we stop Phase 1 at **MII**: We have 2 I's. We need Target **MUIU** (2 I's, 2 U's, specific order).
          *   We must now use R1/R3/R4 only.
          *   R1 adds U to the *end*. MII $\to$ MIIU.
          *   R3 requires III. We have II. Cannot use R3.
          *   R4 requires UU. We have one U. Cannot use R4.
          *   From MIIU, we can only add U's to the end (MIIUU...) or delete pairs. We cannot move the I's to the middle.
          *   Target **MUIU** requires the order M-U-I-U.
          *   Derivable strings from MII (without R2) must start **MII...** (since we can't delete I's without III, and can't swap).
          *   **MII...** $\neq$ **MUI...**
      *   **Verdict:** Impossible due to **Ordering/Rule Dependency**, despite passing the Number Theory invariant.

  ### Oracle Token: Safe Answers
  *   **Q:** "Is the I-count invariant enough for System B?"
      *   **A:** "I cannot answer questions about the system as a whole."
  *   **Q:** "Can I double MIIU?"
      *   **A:** "Check Rule 2 of System B." (Forces them to read the constraint).
  *   **Q:** "Does the order of letters matter?"
      *   **A:** "Rules specify string structures."

