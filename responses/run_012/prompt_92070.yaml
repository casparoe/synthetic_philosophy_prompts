  # FAILURE ANALYSIS (What Will Go Wrong)

  **1. The "Loudest Person" Problem (Round 2)**
  *   **Risk:** One student claims "It's the I's, mod 3!" and the group accepts it without the Devil's Advocate (DA) doing their job.
  *   **Mitigation:** You must audit the DA. Walk to each group at minute 25. Ask the DA: "Show me where their proof could fail." If the DA is passive, intervene: "Advocate, your job is to break this. If you don't break it, the proof doesn't count."
  *   **Why:** If they don't stress-test the proof, they won't value the rigor in Round 3.

  **2. The "Spoiler" Student**
  *   **Risk:** A student who read GEB thoroughly says "It's about the number of I's" in Round 1.
  *   **Mitigation:** Pre-empt this in the intro. "If you have read the book, your job is not to give answers. Your job is to help the group construct the argument *themselves*. If you state the invariant, you are disqualified from Round 3." (Gamify their silence).

  **3. Time Creep**
  *   **Risk:** Round 1 runs long because they are having fun grinding.
  *   **Mitigation:** Be ruthless. 10 minutes is enough to hit the wall. If you give them 20, they won't feel the frustration, they'll just feel busy. The "Jump" requires the feeling of *failure* in the object mode.

  **4. The Debrief Leak**
  *   **Risk:** You start explaining "M-Mode and U-Mode" before Round 3 is finished.
  *   **Mitigation:** Do not use the words "System," "Meta," "Jump," or "Mode" until the final 10 minutes. Refer to everything as "The Game," "The Rules," and "The Proof."

