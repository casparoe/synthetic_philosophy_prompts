      *   **The Scenario:** Describe the researcher in the grip of a problem (the "Flow" state).
      *   **The Two Models:**
          *   *Audit Model:* Constant moral accounting, opportunity cost calculation, instrumentalization of action.
          *   *Craft Model:* Immersion, intrinsic value, non-instrumental focus, "being with" the object of study.
      *   **The Incompatibility:** Show logically why you cannot hold both dispositions simultaneously at the maximal level.
      *   **The Loss:** Define exactly what is lost if the Audit Model wins (depth, truth-discovery, the specific quality of scientific excellence).
      *   **The Compensation Question:** Why doesn't the moral good outweigh this loss? (Argument about the nature of value, not just aggregation).
      *   **Confronting the Objection:** Address the "self-serving" charge. Argue that this isn't about privilege, but about the ontology of human goods.
      *   **Conclusion:** Summarize the position.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Needs to sound like it respects the user's scientific rigor. Avoid fluffy moralizing. Use terms like "necessary condition," "incompatibility," "ontological."
      *   *The Researcher Example:* Think of Einstein, Curie, or a generic theorist. The key is *absorption*. The world falls away. If they stop to ask, "Should I be feeding the hungry instead?" the spell breaks.
      *   *Defining the Models:*
          *   *Audit:* Consequentialist calculus, constant monitoring, moral opportunity cost. It treats time as a moral resource to be allocated.
          *   *Craft:* Phenomenological immersion. Time disappears. The activity is an end in itself.
      *   *The Incompatibility:* This is the crux. It's a cognitive resource argument, but deeper. It's about *intentionality*. You can't intend the object *and* intend the moral value of intending the object simultaneously without fracturing the intention.
      *   *What is Lost?* It's not just "science doesn't get done." It's that *deep* science requires a specific kind of ignorance of the outside world. The "excellence" is in the depth, not just the output.
      *   *Why No Compensation?* This is tricky. A utilitarian would say "Feed the kids, science can wait." I need to argue for *pluralism of value*. The value of Truth/Understanding is not fungible with the value of Welfare. If we maximize Welfare, we lose the category of Truth-seeking excellence entirely. A world of saints is a world without deep discoverers.
      *   *The Objection (Self-Serving):* Acknowledge it. It *looks* like intellectuals making excuses. Counter: It applies to *any* craft (parenting, art, carpentry). It's about the structure of human excellence, not just physics. Also, the "saint" loses something too (the integrity of the craft).

  4.  **Refining the Philosophy:**
      *   *Bernard Williams* is relevant here (integrity, ground projects), but the prompt asks for a specific *audit vs. craft* distinction. I should channel Williams without necessarily name-dropping him excessively, focusing on the structural argument.
      *   *Michael Polanyi* (Tacit Knowledge, Personal Knowledge) is crucial for the "absorption" aspect.
      *   *Suicide of the Intellect:* If morality demands we audit everything, the intellect cannot function at its peak.
      *   *Terminology:* Use "Moral Opportunity Cost," "Phenomenological Unity," "Instrumentalization."

  5.  **Addressing the "Compensation" Point:**
      *   Why doesn't the good done compensate? Because the loss is *categorical*. You cannot trade "depth of understanding" for "units of welfare." They are incommensurable. Maximizing one extinguishes the possibility of the other. A world where everyone audits is a world where no one dives deep.

  6.  **Review against Constraints:**
