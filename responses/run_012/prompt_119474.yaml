answer: |-
  Here is a runnable plan for the session. It is designed to be tight, high-friction, and theoretically dense without requiring you to lecture.

  ### 1. Materials List

  You need to print four distinct packets. To make the "swap" mechanic work as you described (swapping charters on the *same* data), you cannot have 4 teams of 4. You need **8 pairs** (2 students per team). This ensures two groups assess the same data with different mandates, creating the necessary conflict for the Tribunal.

  *   **Data Sheets (4 types, 2 copies each):**
      1.  **Eastern Mediterranean (c. 1177 BC):** Focus on palace destruction, loss of literacy, but continuity of village life.
      2.  **Southern Maya (c. 900 AD):** Focus on abandonment of southern lowlands, population shift to north, continuity of calendar.
      3.  **Rapa Nui (c. 1600 AD):** Focus on statue toppling, deforestation, but population stability and adaptation to sweet potato.
      4.  **The Ostran Valley (Invented, c. 1450 CE):** A riverine trade hub. *Data:* Elite river-forts abandoned (60% loss), population shifts 20 miles inland to road hubs (net 5% growth), pottery style changes drastically, tax records switch from grain to silver.
  *   **Charters (4 types, 4 copies each):**
      1.  **The Dynastic Archive (Heritage):** *Bearer:* The Ruling Lineage. *Capacity:* Monument building & Literacy. *Threshold:* Cessation of inscriptions. *Baseline:* Peak architectural output.
      2.  **The Grain Reserve (Demographic):** *Bearer:* The Cultivating Population. *Capacity:* Caloric intake & Life Expectancy. *Threshold:* 20% Population loss. *Baseline:* Previous generation's health.
      3.  **The Merchant Guild (Economic):** *Bearer:* The Trade Network. *Capacity:* Volume of Luxury Imports. *Threshold:* 50% Trade volume drop. *Baseline:* Projected growth trajectory.
      4.  **The Risk Syndicate (Insurance):** *Bearer:* Asset Stability. *Capacity:* Predictability of Tax/Tithes. *Threshold:* Unrecoverable Debt. *Baseline:* Contractual Obligations.
  *   **Registrar's Forms (16 copies):**
      *   Fields: Case Name, Charter ID, Verdict (Collapsed / Transformed / Resilient), Severity (0-10), Confidence (0-10).
      *   **The Cost Mechanic:** A box labeled *"If 'Transformed,' specify: What became What? Who Benefited?"* If this is left blank, the Registrar rejects the form.
      *   **The Fact Lock:** A box labeled *"Disputed Facts."* Instructions: *"Leave blank. You must accept the Data Sheet as absolute truth for this exercise."*
  *   **Whiteboard:** Divided into 4 quadrants (one per Case).

  ### 2. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:05 | Setup & Partition**
  *   Divide class into 8 pairs. Hand out packets.
  *   **Crucial:** Ensure for each Case (e.g., Maya), one pair gets Charter 1 and the other gets Charter 2. (Pair 1A: Maya/Archive, Pair 1B: Maya/Grain).
  *   **Instruction:** "You are not historians today. You are auditors. Your Charter is your law. The Data Sheet is your evidence. Do not argue with the evidence. Argue with the law."

  **00:05 – 00:25 | Round 1: Assessment**
  *   Pairs read Data + Charter. Fill out Registrar's Form.
  *   **Instructor Role:** Circulate. If a pair argues about the data ("But actually the Maya didn't..."), point to the *Fact Lock* box. "Bracket it. The sheet says X. Work with X."

  **00:25 – 00:35 | The Swap**
  *   Pairs working on the *same Case* find each other. (e.g., Maya Pair A finds Maya Pair B).
  *   They keep their Data Sheet. They **swap Charters**.
  *   They must now re-evaluate the *same facts* under the *new mandate*. Fill out a second Form.
  *   **Note:** This often causes friction ("But this Charter defines society wrong!"). That is the point.

  **00:35 – 00:50 | The Tribunal**
  *   Bring the room together. Go Case by Case (4 cases x 3 mins = 12 mins).
  *   Ask the two pairs for the **Eastern Med**: "Did it collapse?"
  *   If verdicts differ: "Is this disagreement about the *Data* or the *Charter*?"
  *   If they say Data: Remind them they had the same sheet. Force them to identify which Slot (Bearer, Capacity, Threshold, Baseline) caused the split.
  *   Write the conflicting "Slots" on the board (e.g., "Bearer: Palace vs. Peasant").

  **00:50 – 01:00 | The Invariant**
  *   Ask each pair to write **one sentence** on a sticky note about their case that would remain true *regardless* of which Charter they held.
  *   *Example:* "The palace stopped writing, but the farmers kept planting."
  *   Stick these on the board under the Case Names.
  *   **Point:** Facts travel; verdicts do not.

  **01:00 – 01:25 | The Debrief (See Script Below)**
  *   Connect the activity to the theory of operationalization.

  **01:25 – 01:30 | Wrap**
  *   Collect forms. Dismiss.

  ### 3. Failure Mode Protocols

  **1. The "It Depends" Refusal**
  *   *Symptom:* A student refuses to give a Severity Number or Verdict, arguing the categories are insufficient.
  *   *Fix:* The Registrar's Form requires a number to be valid. Tell them: "In the real world, insurance claims and heritage grants require a binary decision. You are simulating the burden of decision, not the luxury of ambiguity. Pick a number."

  **2. The "Transformation" Safe Haven**
  *   *Symptom:* Everyone chooses "Transformed" to avoid being wrong.
  *   *Fix:* Enforce the **Cost Mechanic**. If the "What became What / Who Benefited" box is vague (e.g., "Society changed"), reject the form. They must specify winners and losers (e.g., "Elite power transformed into Merchant power; Peasants paid the cost"). If they can't name the cost, it counts as Collapse.

  **3. The Early Spoiler**
  *   *Symptom:* A student realizes in Minute 10 that the point is about definitions and announces it, ruining the tension.
  *   *Fix:* Recruit them. "You've spotted the mechanism. You are now the **Court Clerk**. Your job is to walk around and reject any Form that argues about facts instead of definitions. Keep the other teams honest."

  **4. The "Colonialist Narrative" Objector**
  *   *Symptom:* A student argues at Minute 10 that "Collapse" is inherently a colonialist category used to justify intervention and refuses to engage.
  *   *Fix:* Validate, then bracket. Script: "You are absolutely right. That is exactly why we are doing this. We are not studying the past today; we are studying the *tool* used to describe the past. To understand how the tool wounds, we have to see how it cuts. Use the Charter to see how the category is constructed, so you can dismantle it later."

  ### 4. Debrief Script (25 Minutes)

  **Phase 1: Naming the Mechanism (5 mins)**
  "In the Tribunal, you noticed that Pair A and Pair B had the exact same facts but opposite verdicts. Why? Because you were measuring different things.
  *   When the **Archive** said 'Collapse,' they meant 'No more Kings.'
  *   When the **Grain Reserve** said 'Resilience,' they meant 'People still eating.'
  *   **Concept:** This is **Operationalization**. 'Collapse' is not a fact in the ground like a potsherd. It is a variable you construct. If you change the *Bearer* (who matters) or the *Threshold* (how much loss), the verdict flips."

  **Phase 2: Addressing the Co-Instructor & Pop-Sci (5 mins)**
  "To my colleague who loves the Late Bronze Age: You define the Bearer as the *Palace Network*. By that metric, yes, it collapsed.
  "To the students who think collapse is 'punishment for stupidity': Look at the Ostran Valley. The 'collapse' of the river forts allowed the 'rise' of the road towns. Was that punishment? Or just shifting risk?
  *   **Concept:** **Normativity**. We treat collapse as 'Bad.' But for the Merchant Guild in the Ostran case, the river collapse was a market opportunity. Collapse is often a redistribution of power, not just a loss of it."

  **Phase 3: The Limits of the Exercise (10 mins)**
  "This activity made the problem look solvable. If we just pick the right Charter, we get the right answer. That is false. Here is what this room could not simulate:
  1.  **Timescale:** You did this in 20 minutes. Real collapses take 150 years. No one inside the process holds a Registrar's Form. They just live through the degradation.
  2.  **Agency:** You treated the society as a corpse to be autopsied. Real people fight the definition. They might rebuild a palace *just* to prove they haven't collapsed.
  3.  **Interconnectivity:** You assessed cases in isolation. In reality, the Maya 'collapse' might be the Mediterranean 'opportunity.'
  *   **Takeaway:** You cannot find the 'true' definition of collapse. You can only ask: 'Definition for whom? And for what purpose?'"

  **Phase 4: The Invariant (5 mins)**
  "Look at the sticky notes. 'The palace stopped writing, but the farmers kept planting.'
  *   This is the only ground we stand on. The *verdicts* are political. The *processes* are material. Your job as scholars is to stop arguing the verdict and start tracing the process."

  ### 5. The Honest Bit: What This Activity Cannot Reproduce

  You suspected it makes relativism feel too cheap. You are correct. Here is the deeper list of what you must supply in the debrief because the game mechanics obscure it:

  1.  **The Stakes of the Verdict:** In this game, a "Collapse" verdict costs nothing but pride. In the real world, a "Collapse" designation determines where UNESCO funding goes, whose land gets protected, and whose ancestry is considered 'extinct.' The activity gamifies the *logic*, but sanitizes the *consequence*. You need to explicitly state that in the real world, the person holding the Charter holds the money.
  2.  **The Phenomenology of Decline:** The activity is external/audit-based. It cannot reproduce the *experience* of collapse—the feeling that the world is getting smaller, the loss of future orientation. The students are looking *at* the collapse, not *from within* it. You need to remind them that for the people involved, "Transformation" often feels like "The End."
  3.  **The Feedback Loop:** In the game, the Charter dictates the Verdict. In history, the Verdict dictates the Charter. (e.g., We decided the Romans 'Fell,' so we stopped looking for 7th-century economic data, which made the Fall look more total). The activity presents definition as a *preceding* condition, not a *self-fulfilling* one.
  4.  **Material Constraints:** The game implies that if we just pick the right definition, we solve the puzzle. But sometimes, *everything* breaks. Sometimes the Bearer, the Capacity, and the Baseline all zero out. The activity risks suggesting collapse is *always* just a matter of perspective. You must acknowledge that sometimes the soil actually does salt, and the people actually do starve, regardless of the Charter.

  **Final Advice:**
  Your co-instructor (the Classicist) is a resource, not an obstacle. Ask them to play the "Dynastic Archive" role during the debrief. Let them defend the "Palace as Bearer" view passionately. It validates their expertise while simultaneously containing it as *one specific operationalization* among many. This saves their face while dismantling their universal claim.
