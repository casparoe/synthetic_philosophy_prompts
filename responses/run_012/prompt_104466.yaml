answer: |-
  Here is the specification you asked for. It treats the Inside/Outside distinction not as a heuristic tip, but as an epistemic protocol.

  ### The Desiderata: A Spec for the Inside/Outside Distinction

  **1. The Singularity Constraint**
  *The Requirement:* The theory must yield actionable calibration for decisions that are ontologically unique ($n=1$).
  *The Consideration:* In ecology, you don't manage a population of grants; you manage *this* grant. Actuarial logic works for insurers who hold the portfolio, but the PI holds the single ticket. If the theory only works for ensembles, it is useless to the agent making the decision. It must explain how a base rate binds a unique event without denying its uniqueness.

  **2. The Reference Class Protocol**
  *The Requirement:* The theory must provide a non-arbitrary method for selecting the reference class.
  *The Consideration:* This is the Reichenbach problem. Any event falls into infinite classes (all grants, all ecology grants, all grants by men over 60). The base rate for success varies from 10% to 90% depending on the cut. Without a rule for *which* class is causally relevant, the "Outside View" is just a menu from which to cherry-pick the statistic that justifies your preconception.

  **3. The Defeasibility Clause**
  *The Requirement:* The theory must specify the conditions under which the Inside View overrides the Outside View.
  *The Consideration:* Sometimes the mechanism is understood well enough to warrant deviation from the base rate. If you have a new mark-recapture model that mathematically corrects for a bias inherent in the historical data, the historical base rate is noise, not signal. A theory that forbids overriding the base rate denies the possibility of innovation or superior mechanism.

  **4. The Non-Collapse Condition**
  *The Requirement:* The theory must avoid collapsing into either fatalism (always base rate) or rationalization (always model).
  *The Consideration:* If the Outside View is a veto, agency is dead. If it is merely a suggestion, it is ignored by the overconfident. The distinction must function as a tension—a dialectic force—rather than a decision rule. It must force a reconciliation, not dictate a winner.

  **5. The Independence Illusion**
  *The Requirement:* The theory must account for the fact that selecting the reference class is itself an Inside View judgment.
  *The Consideration:* To decide that your project belongs to the class "Restoration of Riparian Zones" rather than "Government-Funded Projects," you are making a judgment about which features are causally salient. That judgment comes from your internal model of the world. Therefore, the Outside View cannot be the purely objective, external check it is advertised to be. It is contaminated by the very biases it is meant to correct.

  ***

  ### The Tension: The Commitment

  You asked which of these cannot be had at once. The conflict is between **Requirement 2 (Reference Class Protocol)** and **Requirement 5 (The Independence Illusion).**

  Here is the pull: To satisfy Requirement 2, you need a principled way to select the *right* reference class. The only principle available is causal relevance (i.e., "Which features actually drive the outcome?"). But assessing causal relevance is an **Inside View** task. It requires theory, mechanism, and judgment about the specific case.

  If you admit this, you violate Requirement 5. You admit that the Outside View is not an independent check; it is a *reframing* of the Inside View. You are using your internal model to select the external statistic.

  **My Call:** I am throwing overboard **Requirement 5**.

  **Why:** The demand for independence is the fatal flaw in the popular understanding of the Outside View. It promises a "view from nowhere," an objective anchor free of human bias. That does not exist. By insisting on independence, proponents of the distinction create a false sense of security. Users think they are being objective because they are quoting a base rate, failing to see that they rigged the game by selecting a favorable reference class.

  Admitting that the Outside View is *not* independent saves the method. It turns the process from "Check your bias with this objective number" into "Force your internal model to justify its choice of comparison group." It makes the Outside View a discipline of *consistency* rather than a source of *truth*. You must defend why you chose *that* class with the same rigor you defend your project plan. The friction is where the value lies, not in the independence.

  ***

  ### The Keystone: The Make-or-Break Requirement

  If you drop one requirement, the whole structure collapses. That requirement is **Requirement 2 (The Reference Class Protocol).**

  **Why:** Without a disciplined method for class selection, the Outside View is not a tool for calibration; it is a tool for rationalization. An overconfident actor can always find a base rate that supports them. (e.g., "Sure, most startups fail, but most startups founded by PhDs in this sector succeed.") If the theory does not constrain *how* you pick the class, it grants you the authority to pick the statistic that makes you look right. It becomes rhetoric, not epistemology.

  **Which framing fails this worst:** The standard "Planning Fallacy" framing (often associated with behavioral economics pop-science) fails this requirement most egregiously. It typically presents the Outside View as simply "looking at how long similar projects took," treating the similarity metric as intuitive. It tells you to "take the outside view" without giving you the machinery to define the "outside." It assumes the reference class is obvious. In complex systems—like ecology or large-scale engineering—the reference class is never obvious. By ignoring the difficulty of class selection, the standard framing turns a profound epistemic problem into a simple instruction to "be more pessimistic," which misses the point entirely.
