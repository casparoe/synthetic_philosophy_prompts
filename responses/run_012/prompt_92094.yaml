              *   Pessimist needs *Sign Cluelessness*. If we know the sign, we can act.
              *   Optimist needs to argue we are usually in *Magnitude Cluelessness* or that *Sign Cluelessness* is rare/cancelable.
      *   **Section 2: Disagreements Table.**
          *   *Row 1 (Far Future/EV):* Pessimist: "Sum diverges or is mugged." Optimist: "Discounting/Convergence makes it stable." Crux: Rate of moral discounting vs. probability decay.
          *   *Row 2 (Tu Quoque):* Pessimist: "Consequentialism fails its own standard." Optimist: "Comparative failure matters." Crux: Is the goal *truth* or *guidance relative to rivals*?
      *   **Section 3: Toy Decision.**
          *   Case: Volunteer (Charity X) vs. Comfort Friend.
