      *   *Optimist View:* Cluelessness is manageable. We can reason at coarse grains. Also, *tu quoque* (others are clueless too).
      *   *The Three Levels of Ignorance:*
          *   (a) No probabilities (Radical Uncertainty).
          *   (b) Probabilities exist, but sign of long-run effect is unknown (Sign Cluelessness).
          *   (c) Sign known, magnitude unknown (Magnitude Cluelessness).
      *   *Who needs what?*
          *   Pessimist needs (b) or (a). If we know the sign (c), consequentialism usually works (do the positive thing). If we know probabilities (a), we can calculate. The real killer is not knowing if the long-term ripple is net good or bad (b).
          *   Optimist needs to argue that (b) collapses into (c) or is irrelevant due to discounting/coarse-graining. Or that (a) is false (we always have *some* priors).
