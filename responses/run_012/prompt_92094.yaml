          1.  Numbered list of agreed claims (non-vacuous, not slanted). Must cover: definition of cluelessness, causal structure, decision theory escape, and three specific levels of ignorance (no probabilities, unknown sign, known sign/unknown magnitude). Name these levels. Identify which level each side's argument *needs*.
          2.  Disagreements table. Rows = genuine disagreements. Columns = Pessimist's formulation, Optimist's formulation, The Crux, Predictions. Must include two specific cruxes: (1) EV well-definedness vs. far-future swamping/non-convergence, (2) "Non-consequentialists are clueless too" (tu quoque) validity. Needs concrete cases/arguments.
          3.  Concrete toy decision (Volunteer vs. Friend). Show how each side decides, and if they recommend the same act for different reasons.
          4.  Verbal dispute analysis. Identify if any part is merely verbal (likely one of the three senses of ignorance).
      *   **Tone:** Formal but accessible, precise, philosophically rigorous, suitable for signing. No mushy compromise.

  2.  **Deconstruct the Philosophical Content:**
      *   *Cluelessness:* The thesis that agents cannot know the consequences of their actions well enough to make consequentialist judgments, primarily due to long-term causal chains (butterfly effects).
