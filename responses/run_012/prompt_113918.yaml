          *   *If Speaker Meaning ruled:* Chaos. Defendants could plead "guilty" meaning "I want a Tuesday hearing." The state cannot allow private definitions of public terms.
      *   *Conclusion:* Summarize the "Legal Realist" stance of the practice.

  7.  **Refining the Philosophy:**
