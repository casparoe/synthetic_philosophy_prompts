      *   Searle is stricter on sincerity conditions for the *integrity* of the act. The law ignores Searle's integrity requirement for the sake of efficiency.
      *   Grice: The law overrides conversational implicature. "Guilty" means "Convicted," not "I morally acknowledge wrongdoing."

