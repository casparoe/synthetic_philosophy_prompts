answer: |-
  ### Exam Question

  **Question 1 (20 Marks)**

  Consider an automated hiring algorithm used by a large corporation. The system assigns every applicant a "Suitability Score" from 0.00 to 100.00. The company policy states: "Hire any candidate who is *Qualified*." Historically, any candidate with a score of 50.00 or above is hired, and any below is rejected.

  However, "Qualified" is a vague predicate. Imagine a Sorites series of candidates where Candidate A has a score of 50.00 (clearly Qualified) and Candidate B has a score of 49.99. The difference in their resumes is negligible. If Candidate A is Qualified, then Candidate B must also be Qualified. By repeating this step, we conclude that a candidate with a score of 0.00 is Qualified, which is absurd.

  In an essay of approximately 3–4 pages, answer the following:

  1.  **Diagnose the Source:** Is the vagueness in the *world* (ontic), in our *language/concepts* (semantic), or in our *knowledge* (epistemic)? Defend your choice against at least one alternative.
  2.  **The Higher-Order Problem:** If you claim there is no sharp boundary between "Qualified" and "Not Qualified," must there be a sharp boundary between "cases with no sharp boundary" and "cases with a sharp boundary"? Explain how your chosen theory handles this Higher-Order Vagueness without collapsing.
  3.  **Logic and Truth:** Does solving this paradox require abandoning classical logic (e.g., the Law of Bivalence)? Argue whether accepting the Sorites conclusion is a viable option or a failure of rationality.

  Use the hiring case above to illustrate your arguments.

  ***

  ### Model Answer

  The hiring algorithm scenario presents a classic Sorites paradox: a chain of plausible premises leads to an absurd conclusion via valid reasoning. To resolve this, we must determine whether the fault lies in reality, language, or our access to the truth. I argue for **Epistemicism**: vagueness is a form of ignorance. There is a sharp boundary between "Qualified" and "Not Qualified" in the algorithm's scoring, but we cannot know where it is. This view preserves classical logic and offers the most robust solution to Higher-Order Vagueness.

  First, consider the source of vagueness. An ontic view suggests the world itself is fuzzy; a candidate is neither truly qualified nor unqualified. This is metaphysically costly. It requires us to believe that objective reality lacks determinate facts, which contradicts the physical reality of the candidate's resume data. A semantic view (Supervaluationism) suggests "Qualified" is undefined for borderline cases; the statement is neither true nor false. However, this complicates logic. Epistemicism is superior because it maintains that "Qualified" refers to a precise property, likely a complex conjunction of skills and experience. The boundary exists objectively, perhaps at score 49.995, but our linguistic practices and cognitive limitations prevent us from identifying it. The vagueness is not in the candidate, but in our inability to pinpoint the cutoff.

  This leads to the Higher-Order Vagueness (HOV) problem. If we claim there is no sharp line between Qualified and Not Qualified, we face a regress: is there a sharp line between "Definitely Qualified" and "Borderline"? If yes, we reintroduce the sharp boundary we denied. If no, we lose the ability to distinguish clear cases from borderline ones, rendering the concept useless. Supervaluationism struggles here; by introducing "supertruth," it creates a new boundary between the supertrue and the indefinite, merely pushing the problem back.

  Epistemicism handles HOV more cleanly. It asserts that there *is* a sharp boundary between "Definitely Qualified" and "Borderline," just as there is between "Qualified" and "Not Qualified." We simply do not know where either line lies. The "blur" is not in the boundaries themselves, but in our knowledge of them. In the hiring case, there is a specific score where a candidate shifts from "Definitely Qualified" to "Borderline," and another where they shift to "Not Qualified." Our inability to distinguish these scores does not mean the distinctions do not exist. This avoids the collapse because it accepts sharp boundaries at every order of vagueness, attributing the apparent smoothness to human ignorance rather than semantic indeterminacy.

  Finally, regarding logic: does solving this require abandoning classical logic? Many argue that to avoid the absurd conclusion, we must reject Bivalence (that every statement is either true or false). They suggest a candidate can be "partially" qualified. However, this breaks the validity of the Sorites reasoning only by changing the rules of inference, effectively giving up on logic to save intuition. Accepting the Sorites conclusion (that a score of 0 is Qualified) is not a viable option; it renders the hiring policy meaningless and contradicts reality.

  Epistemicism preserves classical logic. It allows us to say the premise "If Candidate A is Qualified, then Candidate B is Qualified" is actually *false*, even though it seems plausible. There is a specific step in the chain where the truth value flips from True to False. We cannot identify the step, but knowing it exists validates the use of classical logic. We do not need many-valued logic or truth gaps. We simply acknowledge that our intuition of continuity is a cognitive illusion.

  In conclusion, the hiring paradox arises from confusing epistemic limitations with semantic indeterminacy. By adopting Epistemicism, we affirm that sharp boundaries exist at every order of vagueness, preserving both the utility of the "Qualified" predicate and the integrity of classical logic. The cost is counter-intuitive: we must accept that logic dictates a precise cutoff for hiring that humans can never precisely know.

  ***

  ### Marking Scheme

  **Total Marks: 20**

  **1. Identification of Sorites Structure & The Dilemma (4 Marks)**
  *   **Requirement:** Student must clearly articulate the premises (base case, inductive step) and the absurd conclusion, identifying that one must be rejected.
  *   **Common Error:** Students describe the paradox as "words are ambiguous" rather than a problem of valid inference leading to falsehood.
  *   **Mark:** 4 for precise reconstruction; 2 for vague description; 0 for missing the logical structure.

  **2. Commitment to a Theory of Vagueness (4 Marks)**
  *   **Requirement:** Student must explicitly name or define a stance (Epistemicism, Supervaluationism, Contextualism, or Ontic) and argue why it fits the hiring case better than one alternative.
  *   **Common Error:** Sitting on the fence ("it's a bit of both") without explaining how the hybrid solves the logical contradiction.
  *   **Mark:** 4 for clear defense; 2 for identification without defense; 0 for no clear stance.

  **3. Engagement with Higher-Order Vagueness (4 Marks)**
  *   **Requirement:** Student must address the "boundary of the boundary" problem. They must explain if their theory posits a sharp line between 'definite' and 'borderline' cases.
  *   **Common Error:** Ignoring HOV entirely or claiming their theory eliminates sharp boundaries without explaining how it avoids the regress.
  *   **Mark:** 4 for resolving the regress; 2 for acknowledging HOV but failing to resolve it; 0 for ignoring it.

  **4. Stance on Classical Logic & Bivalence (4 Marks)**
  *   **Requirement:** Student must state whether they keep or reject the Law of Bivalence and justify whether accepting the Sorites conclusion is rational.
  *   **Common Error:** Claiming we can "accept the conclusion" as a metaphorical truth, or rejecting logic without explaining the alternative inference rules.
  *   **Mark:** 4 for clear logic stance; 2 for muddled view on truth values; 0 for logical incoherence.

  **5. Application to the Specific Case (4 Marks)**
  *   **Requirement:** Arguments must reference the hiring algorithm/scores, not just abstract "heaps."
  *   **Common Error:** Writing a generic essay on vagueness that could apply to "baldness" without modifying it for the scoring algorithm context.
  *   **Mark:** 4 for integrated examples; 2 for token mention; 0 for no application.

  **Distinguishing an A from a B**
  *   **B Grade (14–16 marks):** Correctly identifies a theory (e.g., Epistemicism) and applies it to the case, but treats Higher-Order Vagueness as a minor footnote or claims "there are no sharp lines anywhere" without explaining how that avoids the regress problem.
  *   **A Grade (17–20 marks):** Explicitly argues *how* their chosen theory survives the Higher-Order Vagueness objection (e.g., "Epistemicism accepts sharp lines at every order, attributing the blur to ignorance"). They demonstrate that rejecting the inductive premise is the only way to save logic, rather than just asserting it.
