          *   *Realism:* A $\psi$-epistemicist can be a realist about the *ontic state* ($\lambda$). They are just anti-realist about the *wavefunction* ($\psi$) being a direct physical property. They believe $\psi$ supervenes on the preparation, not directly on the individual system's physical state in a one-to-one way.

