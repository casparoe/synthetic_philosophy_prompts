answer: |-
  This is an excellent set of questions. You have identified the exact pressure points where the philosophy of quantum mechanics gets difficult, and your TA was correct: you do not need to be an instrumentalist to be a $\psi$-epistemicist. However, your framing contains two specific category errors that are generating the confusion. I will address those bluntly first, then move to the commitments of the view, and finally deal with the PBR theorem.

  ### 1. The Category Errors: "Whose Knowledge?" and "Objective = Ontic"

  You are struggling because you are importing a colloquial or strictly subjective Bayesian meaning of "epistemic" into a technical context, and you are conflating *ontological status* with *objectivity*.

  **Error 1: "Epistemic implies a knower."**
  You ask: *"If the quantum state is epistemic, whose knowledge is it?"*
  In the context of the Harrigan-Spekkens framework (the standard taxonomy for this debate), "epistemic" does not mean "subjective belief of a human agent." It means **representing information about an underlying reality.**

  Think of classical statistical mechanics. We describe a gas using a probability distribution $\rho$ over phase space.
  *   Is $\rho$ the physical state of the gas? No. The physical state is the precise position and momentum of every molecule (the microstate).
  *   Is $\rho$ just someone's opinion? No. Given a specific macroscopic preparation (e.g., "volume $V$, temperature $T$"), the distribution $\rho$ is fixed by the physics of the preparation. It is an objective fact that a gas prepared this way is described by *this* distribution.
  *   Is $\rho$ ontic? No. It does not reside in the gas. It resides in the relationship between the preparation procedure and the possible microstates.

  A $\psi$-epistemicist treats the wavefunction exactly like $\rho$ in statistical mechanics. It is a probability distribution over "ontic states" (denoted $\lambda$). The "knowledge" is not necessarily in a human head; it is the information encoded by the **preparation procedure**. If I build a laser to emit photons in state $|H\rangle$, the physical process of the laser constrains the underlying ontic state $\lambda$ of the photon. The wavefunction describes those constraints. It is "epistemic" because distinct wavefunctions can correspond to the *same* underlying physical reality $\lambda$.

  **Error 2: "If it's objective, it must be ontic."**
  You write: *"if the distribution is objective and determined by how the world actually is, then it is as real as anything else in the theory, and we seem to be back to psi-onticism."*

  This is the critical mistake. **Objectivity does not imply ontology.**
  *   **Ontic:** A property inherent to the system itself (e.g., the mass of an electron, the position of a particle).
  *   **Objective:** A fact that is mind-independent.

  Consider a library catalog card. The card contains objective information about the book (call number, title). The information is fixed by the book's existence. But the catalog card is not *part of the book*. You can have two different cataloging systems (Dewey Decimal vs. Library of Congress) for the exact same book. Both are objective descriptions, but neither is an intrinsic physical property of the paper and ink.

  A $\psi$-epistemicist claims $\psi$ is like the catalog card, not the book. It is an objective fact about how the system was prepared, but it is not a physical property of the system itself. Therefore, objectivity does not collapse the distinction. You can have an objective probability distribution that is not a physical field.

  ### 2. What is the $\psi$-Epistemicist Committed To? (Answering a)

  To be a $\psi$-epistemicist (specifically, a *realist* $\psi$-epistemicist), you are committed to the following ontology:

  1.  **There is an underlying reality ($\lambda$):** The system has a real physical state $\lambda$ (the "ontic state") independent of observation. This makes you a realist, not an instrumentalist.
  2.  **$\psi$ is not $\lambda$:** The wavefunction is not a one-to-one map of the physical state.
  3.  **Overlap:** This is the technical definition. If you prepare a system in state $\psi_1$, it corresponds to a probability distribution $\mu_1(\lambda)$ over ontic states. If you prepare it in $\psi_2$, it corresponds to $\mu_2(\lambda)$.
      *   **$\psi$-ontic:** The distributions $\mu_1$ and $\mu_2$ never overlap. If you know $\lambda$, you know $\psi$ uniquely.
      *   **$\psi$-epistemic:** The distributions **do** overlap. There exists some physical state $\lambda$ that is compatible with *both* preparation $\psi_1$ and preparation $\psi_2$.

  **Do they owe us a "bearer of knowledge"?**
  No. As established above, the "knowledge" is indexed to the **preparation procedure**, not a conscious mind. The commitment is that the physical world allows for multiple distinct preparation methods to result in the same underlying physical constitution.

  *Example:* Imagine a coin that is physically biased (ontic state $\lambda$). I can produce this bias by drilling a hole on one side (Preparation A) or by adding weight to the other side (Preparation B). The resulting physical coin ($\lambda$) is identical, but the history ($\psi$) is different. A $\psi$-epistemic view says quantum states are like this: $|0\rangle$ and $|+\rangle$ might sometimes correspond to the exact same physical reality $\lambda$, we just got there via different experimental setups.

  ### 3. The 2012 No-Go Theorem (Answering c)

  The theorem you are remembering is the **Pusey-Barrett-Rudolph (PBR) theorem** (2012). It is often sensationalized as "proving the wavefunction is real," but that is imprecise.

  **What it proves:**
  PBR proves that if you assume certain plausible conditions, distinct quantum states must correspond to disjoint ontic states (i.e., $\psi$ must be ontic).

  **The Critical Assumption: Preparation Independence**
  The theorem relies heavily on an assumption called **Preparation Independence**. It states that if you prepare two systems independently (e.g., one in lab A, one in lab B), their underlying ontic states $\lambda_A$ and $\lambda_B$ are uncorrelated.
  Mathematically: $\mu(\lambda_A, \lambda_B) = \mu(\lambda_A) \cdot \mu(\lambda_B)$.

  **Why this matters:**
  PBR constructs a scenario where, if $\psi$ were epistemic (allowing overlap), and if Preparation Independence holds, you would predict measurement outcomes that contradict quantum mechanics. Therefore, one of the premises must go.

  **Does it finish off the view?**
  No. It finishes off $\psi$-epistemic models that respect Preparation Independence. But there are ways to survive PBR:
  1.  **Reject Preparation Independence:** You can claim that independently prepared systems can have correlated ontic states. This sounds crazy, but it is required in **retrocausal models** (where future measurements influence past states) or **holistic models** (where the universe is fundamentally non-separable).
  2.  **Reject the Existence of $\lambda$:** This is instrumentalism (Copenhagen, QBism). PBR assumes realism about $\lambda$ to begin with. If you deny $\lambda$ exists, PBR doesn't apply to you.
  3.  **Modified Epistemic Views:** Some models (like the "$\psi$-epistemic but constrained" models) accept that $\psi$ is epistemic but argue the overlap is restricted in ways that evade the theorem's specific construction.

  So, the TA was right. You can be a realist $\psi$-epistemicist, but PBR forces you to accept that the underlying reality is more "holistic" or interconnected than classical intuition suggests. You cannot have a $\psi$-epistemic view that looks exactly like classical statistical mechanics (where independent systems have independent microstates).

  ### 4. Correcting Your Framing

  You asked to be flagged where your framing is doing damage. Here are the two places:

  1.  **"Epistemic... means that a psi-epistemicist is at bottom an instrumentalist."**
      *   **Correction:** This is false. Instrumentalism denies the existence of the underlying reality ($\lambda$). $\psi$-epistemicism asserts $\lambda$ exists but claims $\psi$ is a distribution over it. You can be a full-blooded scientific realist about the particles/fields ($\lambda$) while maintaining $\psi$ is just information about them.
  2.  **"If the distribution is objective... it is as real as anything else in the theory."**
      *   **Correction:** This conflates *truth* with *ontology*. It is objectively true that "the probability of rolling a 6 is 1/6." But "1/6" is not a physical object inside the die. It is a relational property between the die's symmetry and the outcome space. $\psi$-epistemicists argue $\psi$ is a relational property (preparation $\to$ system), not an intrinsic property (system $\to$ itself).

  ### Summary

  *   **$\psi$-ontic:** The wavefunction is a physical property of the system (like mass). Distinct $\psi$ means distinct physical reality.
  *   **$\psi$-epistemic:** The wavefunction is a probability distribution over physical states (like a statistical ensemble). Distinct $\psi$ can mean the *same* physical reality.
  *   **Realism:** Both views can be realist. The debate is about the status of $\psi$, not the existence of the world.
  *   **PBR Theorem:** Rules out $\psi$-epistemic models that assume independent systems have independent underlying states. It does not rule out $\psi$-epistemicism entirely, but it forces proponents to adopt more exotic metaphysics (like retrocausality or holism).

  Your TA was not speaking loosely. The "epistemic" label refers to the representational relationship between the math and the reality, not the psychological state of the physicist.
