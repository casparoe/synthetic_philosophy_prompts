answer: |-
  We hang the wet wool coat on the rack,
  Still smelling of the rain and the brass key
  That never fit the lock beside the table.
  Someone says the bulb burned out, the light
  Failed them when they tried to open the door,
  But we remember the steady hum of a voice.

  That voice is what we argue over tonight,
  Some say it was soft as the lining of a coat,
  Others say it slammed like a closing door.
  We pass around the rusted iron key,
  Trying to match it to the fixture light,
  Or maybe it belonged to a different table.

  We gather round the empty wooden table,
  Trying to catch the echo of a voice.
  One says there was never enough light,
  Another points to the sleeve of a coat,
  Stained where the hand held the key,
  Waiting for someone to open the door.

  Who stands guard at the front door?
  We shift the legs of the table.
  One says the pocket held no key,
  Another hears a familiar voice.
  We drape the memory of a coat
  Over the chair to catch the light.

  The lamp throws a sudden light
  Across the threshold of the door.
  We argue over the color of the coat,
  Was it blue or gray near the table?
  The room fills with a single voice,
  Saying only love turns the key.

  We search our pockets for the key,
  But the bulb dims, failing light.
  Is it a whisper or a shouting voice?
  We leave the exit, the door,
  Unlocked. We push back the table.
  We fold the empty coat.

  If the key breaks, we still have the voice.
  When the light fails, we remain at the table.
  Through the door, we carry the empty coat.
