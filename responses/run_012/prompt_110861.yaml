answer: |-
  Here is a plan designed for your specific crowd. They know the map/territory distinction, they respect math, and they will smell a bluff on Jaynes from a mile away.

  ### First: The Load-Bearing Prerequisites
  You are correct. The paradox does not land unless they first accept that **probability is a property of the description, not the object.**

  For a Sequences-literate crowd, you need to chain these three concepts in this specific order on the whiteboard:

  1.  **Probability as Logic:** Establish that $P(A|I)$ depends on Information $I$. If $I$ changes, $P$ changes. This is baseline Bayesianism they already accept.
  2.  **The Generator Assumption:** "Random" is not an intrinsic property of a chord or a cube. It is a shorthand for "generated by a process about which we have specific ignorance."
  3.  **Parameterization is a Choice:** The sample space $\Omega$ is not discovered; it is constructed. Choosing *which variable* is uniform (length vs. volume) is adding information to $I$.

  **Why this order?**
  If you jump straight to the paradox (3), the engineers will try to solve it by finding the "true" geometry. If you establish (1) first, they look for the missing information. If you establish (2), they look for the missing process. The paradox only hurts when they think they have enough information to apply the Principle of Indifference (PoI), but the result contradicts itself. You need them to feel the certainty of the PoI *before* you break it.

  ### Second: The Carrying Example
  **Use the Cube Factory.** Drop the Chords for the derivation, keep it only for the intro.

  **Why Cubes?**
  *   **Algebra over Geometry:** On a whiteboard, deriving the probability density function for "random chords" requires Euclidean geometry proofs that can get messy and alienate the flatmate. The Cube problem is pure calculus ($dx$ vs $d(x^3)$).
  *   **Physical Intuition:** "A factory making cubes" forces the question: "How does the factory operate?" It makes the *process* explicit.
  *   **The Jacobian:** It clearly demonstrates that $P(L) dL \neq P(V) dV$ without needing to argue about endpoints on a circle.

  **The Setup:**
  A factory makes cubes with side length $L$ uniformly distributed between 0 and 1.
  *   Question 1: What is $P(L < 0.5)$? (Answer: 1/2).
  *   Question 2: What is $P(V < 0.125)$? (Answer: 1/2).
  *   **The Twist:** Now, suppose we only know the cubes are "up to size 1" and we apply the Principle of Indifference.
      *   If we assume $L$ is uniform: $P(L < 0.5) = 0.5$.
      *   If we assume $V$ is uniform: $P(V < 0.125) = 0.5 \implies P(L^3 < 0.125) = 0.5 \implies P(L < 0.5) = 0.5$.
      *   *Wait, that matches.* You need to compare $P(L < 0.5)$ against $P(V < \text{median volume})$.
      *   Better Twist: What is the probability the side length is less than $1/\sqrt[3]{2}$ (approx 0.79)?
          *   Uniform $L$: $P = 0.79$.
          *   Uniform $V$: Median volume is $0.5$. $L = \sqrt[3]{0.5} \approx 0.79$. So $P(L < 0.79) = 0.5$.
          *   **Contradiction:** 0.79 vs 0.5 for the same physical event.

  **What to do with Chords?**
  Draw the circle at the start. Show the three classic chords (random endpoints, random radius, random midpoint). Say: "This is the historical namesake. It's visually famous. But today we are going to *solve* it using cubes, because cubes let us see the math." This respects the history but prioritizes clarity.

  ### Third: Misconceptions & The Jaynes Honesty Test
  Here is where you intercept the room's specific archetypes.

  **(a) "Priors are just made up / Subjective"**
  *   **When:** Immediately after revealing the contradiction.
  *   **The Script:** "This doesn't prove probability is subjective. It proves *language* is imprecise. 'Pick a random cube' is not a proposition; it's a sentence fragment. It lacks a truth condition. The prior isn't made up; the *problem statement* was incomplete."

  **(b) "The fix is Maximum Entropy / Invariance" (The Statistician & Jaynes Readers)**
  *   **When:** During the resolution phase.
  *   **The Honesty:** Do not bluff. Jaynes' resolution (Group Invariance) is powerful, but it is not magic.
  *   **The Script:** "Jaynes argues that if we demand the solution be invariant under specific transformations (like scaling or rotation), the prior becomes unique. Is this a fix? Yes. Does it remove the choice? No. It moves the choice from 'pick a variable' to 'pick a symmetry group.'
      *   If you assume scale invariance, you get one prior.
      *   If you assume translation invariance, you get another.
      *   It doesn't get information from nowhere; it encodes the assumption that *the units we measure in shouldn't matter.* That is a physical assumption, not a logical tautology."
  *   **Why this works:** It validates the Jaynes readers without letting them claim the paradox is "solved" in a way that bypasses the need for careful modeling.

  **(c) "Probability theory is inconsistent"**
  *   **When:** Conclusion.
  *   **The Script:** "The math is consistent. $P(A) + P(\neg A) = 1$ held in both cube cases. The inconsistency was in our expectation that the universe provides default sample spaces. The map was missing a legend."

  ### Fourth: What to Leave Out
  Explicitly write this on the corner of the whiteboard at the start. It manages expectations and protects you from the statistician trying to go down a rabbit hole.

  1.  **Measure Theory:** "We are not doing rigorous measure-theoretic definitions of 'uniform.' We are assuming Riemann integrals work nicely."
  2.  **Infinite Domains:** "We are keeping everything bounded (0 to 1). Improper priors are a different can of worms."
  3.  **Frequentism:** "We are not debating long-run frequencies. We are talking about states of knowledge."

  ### Last: The Final Check Question
  Do not ask "Does this make sense?" They will lie to be polite. Ask a question that forces them to **specify a generator.**

  **The Question:**
  "I have a bag of coins. I tell you nothing about them except that they are biased. I pick one coin. What is the probability it comes up heads?"

  *   **Wrong Answer:** "50%." (Applies PoI to the outcome).
  *   **Wrong Answer:** "Undefined." (Gives up).
  *   **Right Answer:** "I cannot answer until you tell me how the bag was filled.
      *   If the bag was filled by picking a bias $p$ uniformly from $[0,1]$, the answer is 50%.
      *   If the bag was filled by picking a log-odds uniformly, the answer is different.
      *   **The probability is a property of the bag-filling process, not the coin.**"

  If they answer by asking **"What is the generating process for the bias?"**, they have internalized that the sample space is a choice, not a discovery.

  ---

  ### Run-of-Show (60 Minutes)

  **0:00 - 0:10: The Intuition Trap**
  *   Whiteboard: Write $P(A|I)$.
  *   Ask: "I'm thinking of a number, 1 or 2. What's the probability it's 1?" (Crowd: 50%).
  *   Ask: "Why?" (Crowd: "Principle of Indifference," "No reason to prefer one.")
  *   Write: **PoI: If no reason to prefer A over B, assign equal probability.**
  *   Tagline: "This feels like logic. Today we test if it's actually physics."

  **0:10 - 0:25: The Cube Factory (The Derivation)**
  *   Draw a cube. Label side $L$, Volume $V = L^3$. Range $[0, 1]$.
  *   Scenario A: "Factory sets $L$ uniformly." Calculate $P(L < 0.8)$.
  *   Scenario B: "Factory sets $V$ uniformly." Calculate $P(L < 0.8)$.
  *   Show they differ.
  *   *Key moment:* Ask the room, "Which factory is the *real* one?" Wait for the silence. There is no real one.

  **0:25 - 0:40: The Diagnosis (Map/Territory)**
  *   Draw the dependency chain from "First" above.
  *   Highlight that "Random Cube" is a semantic collision.
  *   Address Misconception (a) here (Subjectivity).
  *   Address Misconception (c) here (Inconsistency).

  **0:40 - 0:50: The Rescue (Jaynes & MaxEnt)**
  *   Address Misconception (b).
  *   Be honest about Invariance. It adds constraints (symmetry) to $I$.
  *   "You don't get a free lunch. You pay for uniqueness with symmetry assumptions."

  **0:50 - 1:00: The Check & Close**
  *   Pose the **Coin Bag Question**.
  *   Let 2-3 people answer. Push them on the "generating process."
  *   Final takeaway: "Never say 'random.' Say 'generated by...'."
  *   Dismiss for biscuits.
