answer: |-
  Here is a defended agenda for your five person-years. It prioritizes ontological clarity before ethical or practical judgment, ensuring that the dissertations build a cumulative architecture rather than five isolated case studies.

  ### Executive Summary

  **The Top Two:**
  1.  **Question 2 (Form as Content):** This is the foundation. If formal constraints are not semantic, the rest of the project is merely stylistics. If they are semantic, dropping them is a lie. This must be settled first.
  2.  **Question 1 (The Adaptation Limit):** Once we know form *is* content, we must determine when preserving it becomes impossible. This defines the boundary of the discipline.

  **The Abandonments:**
  *   **Question 3 (Identity Conditions):** Cut. It requires typological linguistic expertise your students lack. It risks becoming a debate about linguistics rather than translation.
  *   **Question 4 (External Constraints):** Cut. It dilutes the core thesis (source-derived meaning). Dubbing and market demands are ethical constraints, not formal-semantic ones.
  *   **Question 7 (Machine Translation):** Cut. It moves too fast for a two-year shelf-based project. It will date the dissertations upon graduation.

  **The Dominant Criterion:**
  **Upstreamness.** When criteria conflict, prioritize the question that makes the others intelligible. You cannot theorize compensation (Q8) before defining whether the loss is semantic (Q2). You cannot discuss detection (New) before establishing what is being detected (Q1/Q2). Practical consequence is the tie-breaker: if two questions are equally upstream, choose the one that changes what a translator *does* on Tuesday morning.

  **Where the Current Conversation Goes Wrong:**
  1.  **The "Ornament" Error:** Most theory treats form as a container for meaning. Your agenda corrects this by treating form as a *generator* of meaning.
  2.  **The "Loss" Elegy:** Current discourse laments what is lost. It rarely theorizes what is *gained* or *transformed*. Your agenda must move from "loss" to "exchange."
  3.  **The "Invisibility" Assumption:** Scholars assume if a constraint is translated, it exists. They rarely ask: if the target reader cannot detect the constraint without a footnote, has the constraint survived? (This is your new addition).

  ---

  ### The Defended Agenda (5 Projects)

  Here are the five questions to be assigned, in the order they should be tackled. I have mapped your original numbers to this new structure and included the one necessary addition.

  #### 1. The Ontology of Formal Fidelity (Original Q2)
  *When a formal feature is semantically loaded... is fidelity to the form a species of fidelity to the meaning, or a rival to it?*

  *   **Why Upstream:** This is the axiomatic starting point. If form is ornament, Q1 and Q8 are moot. If form is content, every translation decision becomes a semantic claim. This defines the object of study for the entire group.
  *   **Tractability:** High. Students can perform close comparative readings of standard constrained texts (e.g., Oulipo, Dante, Hopkins) available on the shelf. It requires analytic rigor, not linguistic fieldwork.
  *   **Practical Consequence:** High. It changes the translator's brief. If form is content, the translator is licensed to distort syntax or lexicon to preserve the constraint, whereas previously they might have prioritized "smoothness."
  *   **Future Development:** Moves **up** if new cognitive studies suggest readers process form and meaning in integrated neural pathways. Moves **down** if AI demonstrates that form can be separated from semantic vector space without loss of "understanding."

  #### 2. The Threshold of Adaptation (Original Q1)
  *When a formal constraint simply cannot be satisfied... is there a principled line between translation and adaptation?*

  *   **Why Upstream:** Once we accept form is content (Project 1), we face the crisis of impossibility. This question establishes the failure conditions of translation. It must follow Project 1 because you cannot define "failure" until you define the "task."
  *   **Tractability:** High. Students can catalogue "failure points" in existing translations (e.g., where a rhyme scheme was abandoned). It relies on textual comparison, not data.
  *   **Practical Consequence:** Very High. This determines when a translator is allowed to stop translating and start adapting. It provides a defense for decisions that currently look like incompetence.
  *   **Future Development:** Moves **up** as global translation increases (more distant language pairs = more impossibility). Moves **down** if generative AI solves formal constraints effortlessly (making "impossibility" a historical artifact).

  #### 3. The Economy of Compensation (Original Q8)
  *Is there anything general to be said about which losses... are compensable and which are not?*

  *   **Why Upstream:** This is downstream of Q1 and Q2. You must know what was lost (Q2) and that it *had* to be lost (Q1) before you can theorize how to pay for it. It shifts the discourse from lament to strategy.
  *   **Tractability:** Medium. Requires building a taxonomy of compensatory moves (e.g., trading rhyme for alliteration). Tractable via text analysis, but requires careful categorization to avoid vagueness.
  *   **Practical Consequence:** High. It gives translators a vocabulary for negotiation with editors. Instead of "I couldn't do it," they can say "I compensated here."
  *   **Future Development:** Moves **up** if the field moves toward "functional equivalence" models. Moves **down** if the field retreats to "foreignization" ethics where compensation is seen as domestication.

  #### 4. The Hermeneutics of Added Constraint (Original Q5)
  *May a translator add a constraint the source does not have... to make the source's own logic visible?*

  *   **Why Upstream:** This is the creative extension of Q8. If compensation is paying a debt, adding a constraint is an investment. It tests the limits of the translator's agency. It follows Q3 because you need to understand compensation before you understand *over*-compensation.
  *   **Tractability:** Medium-High. Students can produce practice-led research (their own translations) accompanied by commentary. Fits the "translator/theorist" profile perfectly.
  *   **Practical Consequence:** Medium. It legitimizes radical translation strategies. It changes teaching: students learn to analyze the source's *latent* constraints, not just surface ones.
  *   **Future Development:** Moves **up** as "creative translation" gains academic legitimacy. Moves **down** if copyright or fidelity ethics tighten around the concept of "derivative works."

  #### 5. The Condition of Detectability (New Addition)
  *If a formal constraint is preserved in the target text but is undetectable to a competent reader without a footnote, has the constraint been successfully translated?*

  *   **Why Upstream:** This is the necessary capstone. It challenges the assumption that the *text* holds the meaning. It suggests meaning resides in the *reading experience*. It relies on all previous four projects: you must know what the form is (Q2), that it was possible to keep (Q1), how you paid for it (Q3), and why you kept it (Q4), to ask if it *matters* if no one sees it.
  *   **Tractability:** High. Requires close reading of paratexts (footnotes, introductions) and reader-response theory available on the shelf. No empirical experiments needed; it is a philosophical question about the locus of meaning.
  *   **Practical Consequence:** High. It dictates the use of paratext. It forces translators to decide: do I hide the wirework or expose it? It changes how introductions are written.
  *   **Future Development:** Moves **up** in an era of "transparent" reading (Kindle, quick consumption). Moves **down** if academic reading practices return to slow, annotated engagement.

  ---

  ### Sequencing and Logic

  **Year 1: Foundations (Projects 1 & 2)**
  The group works together on Q2 and Q1. These define the boundaries. The PI should lead the seminars on Q2 to ensure the "Form as Content" thesis is robustly defended, as this is the most philosophically demanding piece. The students produce literature reviews and preliminary case studies here.

  **Year 2: Strategies and Extensions (Projects 3, 4, & 5)**
  Students branch out.
  *   Student A takes Q8 (Compensation).
  *   Student B takes Q5 (Added Constraint).
  *   Student C takes Q5 (Detectability).
  *   Student D takes Q1 (Thresholds - *Note: Q1 is broad enough for two students if split by genre, e.g., Poetry vs. Prose*).
  *   **PI:** Synthesizes the findings into a monograph that argues for a "Semantics of Form."

  ### Why This Order?

  1.  **Ontology before Ethics:** You cannot judge the ethics of dropping a constraint (Q1) until you know if dropping it changes the meaning (Q2).
  2.  **Problem before Solution:** You must define the impossibility (Q1) before you theorize the workaround (Q8).
  3.  **Text before Reception:** You must establish what is in the text (Q2, Q8, Q5) before asking how it is received (New Q).
  4.  **Tractability:** This order moves from pure theory (Q2) to practical strategy (Q8, Q5) to reception (New Q). It allows students to start with reading and end with practice/implications, which is a natural dissertation arc.

  ### Final Advice on the "Shelf" Constraint

  Since you cannot acquire new texts, anchor your theory in the classics that likely already exist in your department:
  *   **For Q2/Q3:** Walter Benjamin ("The Task of the Translator"), Roman Jakobson (On Linguistic Aspects of Translation), and Hofstadter (*Le Ton beau de Marot*).
  *   **For Q1/Q8:** George Steiner (*After Babel*), Lawrence Venuti (*The Translator's Invisibility*), and the Oulipo Compendium.
  *   **For New Q:** Gérard Genette (Paratexts) and Stanley Fish (Is There a Text in This Class?).

  This agenda ensures that in two years, you do not just have five dissertations, but a **school of thought**. You will have moved the conversation from "How do we preserve form?" to "What does form *do*?"
