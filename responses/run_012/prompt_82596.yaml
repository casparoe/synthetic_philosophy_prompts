prompt: |-
  I'm putting together a one-page handout for a philosophy of mind reading group on Dennett's line that 'qualia' is a confused posit, and I want a decision tree that takes someone from "there's something it's like to see red that no functional or representational story captures" to a named position on whether qualia-talk is even coherent and, if it isn't, what's left. Build the branches out of questions rather than names: whether you take the usual marks of qualia (ineffable, intrinsic, private, directly given to introspection) as the real target or think that's a strawman; whether the leftover residue is a property of the experience itself or just a feature of what the experience represents; whether first-person reports count as evidence about the mind or as more data to be explained away; and whether dropping qualia leaves a successor notion that does the same work or leaves nothing at all, i.e. whether the science of consciousness was ever about anything to begin with. Leaves should cover plain qualia realism, representationalism, illusionism/eliminativism, the no-successor reading where eliminativism just costs us the explanandum, and whatever else the space forces out. One line per leaf on the commitment that's hardest to defend, flag any leaves the tree can't really prise apart, and include the answer-combinations nobody actually occupies, with a quick guess as to why (incoherent, unattractive, or just unexplored). Ten leaves max, keep it to a page.
