answer: |-
  # QUINING QUALIA: A DECISION TREE
  **Start:** *"There's something it's like to see red that no functional story captures."*

  **Q1: Are the "Standard Marks" (ineffable, intrinsic, private, directly given) the real target or a philosophical strawman?**
  *   **YES (Real Target)** → Go to **Q2A**
  *   **NO (Strawman)** → Go to **Q2B**

  **Q2A: Does this nature outstrip physical explanation permanently?**
  *   **YES** → **LEAF 1: Mysterianism / Naturalistic Dualism** (McGinn, Chalmers)
      *   *Hardest Commitment:* Accepting permanent cognitive closure on consciousness.
  *   **NO** → **LEAF 2: Non-Reductive Qualia Realism** (Block, Nagel)
      *   *Hardest Commitment:* Explaining causal efficacy of non-physical properties without overdetermination.

  **Q2B: Is the "what-it's-like" a property of the *experience itself* or the *content represented*?**
  *   **CONTENT** → Go to **Q3**
  *   **EXPERIENCE (STATE)** → Go to **Q3**

  **Q3: Do first-person reports count as foundational evidence or as behavioral data to be explained?**
  *   **EVIDENCE** → **LEAF 3: Strong Representationalism** (Tye, Dretske)
      *   *Hardest Commitment:* Accounting for non-veridical experience (hallucination) without qualia.
      *   *(Note: Indistinguishable from Leaf 4 if "content" is functionally defined.)*
  *   **DATA** → Go to **Q4**

  **Q4: If qualia drop, does a successor notion save the phenomenon or is nothing left?**
  *   **SUCCESSOR** → **LEAF 4: Illusionism / Heterophenomenology** (Dennett, Frankish)
      *   *Hardest Commitment:* Explaining the "illusion" of feeling without a real feeler.
      *   *(Note: Often merges with Leaf 5 depending on functional definitions.)*
  *   **NOTHING** → **LEAF 5: Radical Eliminativism** (Churchland)
      *   *Hardest Commitment:* Denying the existence of the explanandum (consciousness) entirely.

  **LEAF 6: Adverbialism / Functionalism** (Lewis, Armstrong)
  *   *Path:* Strawman + Experience + Data + Successor.
  *   *Hardest Commitment:* Distinguishing from Representationalism without reintroducing qualia.

  ---

  ### UNOCCUPIED / UNSTABLE COMBINATIONS
  **7. Real Marks + Content:** *Incoherent.* Intrinsic marks clash with relational nature of content.
  **8. Strawman + Evidence:** *Unattractive.* If the intuition is a strawman, why trust the report it generates?
  **9. Real Marks + Data:** *Incoherent.* If marks are real/intrinsic, introspection is usually deemed incorrigible.
  **10. Successor + Nothing:** *Logical Contradiction.* Cannot have a replacement and no replacement simultaneously.

  ---
  **Key:** **Bold** = Major Positions. *Italics* = Critiques.
  **Dennett's Path:** No (Q1) → Experience (Q2B) → Data (Q3) → Successor (Q4) = **Leaf 4**.
