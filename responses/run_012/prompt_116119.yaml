answer: |-
  This is a high-level normative question. You are asking about the *justificatory foundations* of Expected Utility (EU) theory, not its descriptive accuracy. You accept the coherence arguments (Dutch Book/Representation) as the default position and want to know where the cracks are.

  Here is the map of defeaters, sorted by structural depth, followed by a verdict on the theory's exposure.

  ### 1. The Two Strands: Representation vs. Pragmatic

  You are right to suspect these have different exposure profiles.

  *   **The Representation Strand (Savage/Ramsey):** This is a mathematical existence proof. *If* your preferences satisfy axioms (Completeness, Transitivity, Independence, Continuity), *then* there exist functions $P$ and $U$ such that you act *as if* maximizing $E[U]$.
  *   **The Pragmatic Strand (Dutch Book/Money Pump):** This is a survival argument. *If* your preferences violate the axioms (specifically Probabilism and Conditionalization), a bookie can construct a sequence of bets guaranteeing you a loss.

  **Do they stand or fall together?**
  They can come apart. A defender of EU would concede the **Representation Strand** if the axioms were shown to be normatively optional, but they would cling to the **Pragmatic Strand** as the ultimate trump card.
  *   *If Representation falls:* It just means EU isn't the only way to model consistency.
  *   *If Pragmatics falls:* It means coherence doesn't guarantee survival or value retention. This is fatal.

  **Which is doing the work?**
  The Pragmatic strand is doing the normative heavy lifting. The Representation theorem is merely a mapping tool. We care about the axioms *because* violating them allegedly makes you exploitable or inconsistent in a way that loses you value. If you can violate an axiom without losing value (i.e., without being money-pumped), the Representation theorem becomes a mathematical curiosity with no normative bite.

  ### 2. Failure Modes: Conditions for Defeat

  Here are the specific scenarios where EU breaks, categorized by severity.

  #### A. The Independence Axiom (The Allais Paradox)
  *   **The Scenario:** An agent prefers a guaranteed \$1M over a 10% chance at \$5M/89% at \$1M/1% at \$0, but also prefers a 10% chance at \$5M over an 11% chance at \$1M. This violates Independence.
  *   **The EU Response:** You are irrational. You are letting the "common consequence" (the 89% chance of \$1M) sway you when it should cancel out.
  *   **The Defeater:** **Risk-Weighted Expected Utility (RWEU).** Lara Buchak and others have formalized models where agents care not just about outcomes and probabilities, but about the *distribution* of risk itself.
  *   **Status:** **Awkward to Fatal.** If an agent can be reflective, stable, and *unexploitable* while violating Independence, the Pragmatic strand loses its grip. The EU defender must argue that RWEU agents *are* money-pumpable in dynamic settings (which is debated) or that caring about risk structure is a cognitive error. If RWEU agents can be dynamically consistent (via resolute choice), EU loses its monopoly on rationality.

  #### B. Dynamic Choice and Separability
  *   **The Scenario:** EU assumes **Separability**: your preference at a node in a decision tree should depend only on the future sub-tree, not on how you got there. Non-EU agents (like those with Allais preferences) often suffer **Dynamic Inconsistency**: their future self will want to deviate from their current self's plan.
  *   **The Defeater:** **Resolute Choice.** Edward McClennen argues that an agent can commit to a plan and stick to it, even if their local preferences at a later node would dictate otherwise. This allows a non-EU agent to avoid money pumps without adopting EU preferences.
  *   **Status:** **Awkward.** EU proponents argue Resolute Choice is "brute" or magical—it requires ignoring your own current preferences. However, if "rationality" includes the capacity for binding commitment, EU is not the only coherent game in town. This attacks the idea that rationality is purely *local*.

  #### C. Continuity and Lexicographic Preferences
  *   **The Scenario:** You prefer saving a life to any amount of money, no matter how large. There is no probability $p$ such that you are indifferent between saving a life and a lottery of \$X vs \$0. This violates the Continuity axiom.
  *   **The Defeater:** **Non-Archimedean Fields.** If utilities are hyperreal or lexicographic, standard EU (which relies on Real numbers) cannot represent them.
  *   **Status:** **Technical Failure.** This is fatal for *standard* EU but easily absorbed by generalizing the mathematics (e.g., using non-Archimedean probability). It doesn't break the *logic* of coherence, just the specific implementation using Real numbers. However, it does break the Dutch Book argument if the "money" involved cannot be subdivided infinitely.

  #### D. Infinite Utilities (Pascalian Wagers)
  *   **The Scenario:** Outcomes have infinite utility (salvation, existential risk). $E[U]$ becomes undefined or identical for all actions with non-zero probability of infinity.
  *   **The Defeater:** **Domain Breakdown.** EU simply returns "NaN" or equates distinct actions.
  *   **Status:** **Fatal within the domain.** EU cannot handle infinite values without ad-hoc patches (like relative utilities or truncated infinities). If your ontology includes infinite values, standard EU is not the tool.

  #### E. Imprecise Probabilities
  *   **The Scenario:** You don't have a single credence $P(H)$, but a range $[0.4, 0.6]$.
  *   **The Defeater:** **Ellsberg Paradox.** Agents prefer known risks over unknown ambiguity. This violates the Sure Thing Principle (a cousin of Independence).
  *   **Status:** **Absorbed.** Imprecise Probability models (like E-admissibility) exist. They are not strictly EU maximizers (they maximize a set of utility functions), but they are coherence-based. This suggests EU is a special case of a broader coherence theory, not the whole story.

  ### 3. The Tautology Charge (Unfalsifiability)

  **The Worry:** If every time an agent violates EU, we say "Ah, you must have had a different utility function than we thought," then EU is empty. It predicts nothing.
  **The Defense:** Savage distinguishes between *preference* (a primitive psychological state) and *choice*. We elicit preferences via choices, but we can test for consistency across different elicitations.
  **The Real Risk:** **Outcome Individuation.** If an agent prefers $A$ to $B$ in one context but $B$ to $A$ in another, the EU defender says, "The outcomes were different (e.g., $A$-with-guilt vs $A$-without-guilt)."
  **Verdict:** This is a genuine methodological vulnerability. If the theory allows the *description of outcomes* to expand infinitely to save the axioms, it becomes a tautology. To avoid this, EU must impose constraints on how outcomes are individuated *independently* of the preferences. Most defenders admit this is the weakest link in the armor.

  ### 4. Predictive Differences: EU vs. Rivals

  What does EU predict that a "Thinner" theory (e.g., Acyclicity only) does not?

  1.  **Value of Information:** EU proves that **free information always has non-negative expected value.** You should never pay to avoid information.
      *   *Rival Prediction:* Non-EU agents (e.g., those with disappointment aversion) might rationally pay to remain ignorant.
      *   *Test:* If it is rational to avoid free information, EU is false.
  2.  **Timing of Resolution:** EU is indifferent to *when* uncertainty is resolved, provided the final lottery is the same.
      *   *Rival Prediction:* Agents may prefer early resolution (anxiety reduction) or late resolution (hope).
  3.  **Trade-off Rates:** EU demands a constant marginal rate of substitution between probability and utility.
      *   *Rival Prediction:* Agents might weight small probabilities disproportionately (as in Prospect Theory, though that is descriptive).

  ### 5. Verdict: How Exposed Is It?

  Expected Utility theory is **robust but brittle.**

  It is robust because any alternative that claims to be "rational" usually ends up reinventing a coherence structure very similar to EU (e.g., maximizing a weighted sum). It is brittle because it relies on specific structural axioms (Independence, Continuity) that are not self-evidently necessary for avoiding exploitation.

  **The One Argument That Should Shake You:**

  You mentioned you would be most moved by "a case where an agent with non-EU preferences is unexploitable." You are looking in the right place. The specific argument is:

  **The Risk-Weighted Expected Utility (Buchak) / Allais Argument.**

  Here is why this is the strongest defeater:
  1.  **It targets Independence:** This is the only EU axiom that isn't required for *static* coherence (you can be transitive and complete without it). Independence is required for *separability* across states.
  2.  **It is Reflectively Stable:** Unlike simple framing effects, Allais-type preferences persist even when the agent understands the math. They value *certainty* as a structural feature, not just an outcome feature.
  3.  **It Avoids Money Pumps (conditionally):** While standard dynamic choice theory says non-EU agents are pumpable, **Resolute Choice** models show that an agent can maintain non-EU preferences globally without being pumped locally, provided they view themselves as a temporally extended agent rather than a sequence of time-slices.

  **The Conclusion:**
  If you accept that **Resolute Choice** is a rational strategy (i.e., it is rational to bind your future self to a plan even if your future local preferences change), then the Pragmatic Strand of the EU argument collapses. The Money Pump only works if the agent is forced to act on their *local* preferences at every node. If they are allowed to act on their *global* preferences, they can violate Independence without losing money.

  **Final Judgment:**
  EU is the unique solution **only if** you assume **Separability** (that rational choice is local to the decision node). If you reject Separability in favor of Global/Resolute choice, EU loses its uniqueness claim. The coherence arguments do not prove you *must* be an EU maximizer; they prove you must be *something*, and EU is the simplest *something* that satisfies Separability.

  If you care about the *structure of risk* (not just the outcomes), EU is false. If you care only about *survival/exploitability*, EU is sufficient but not necessary. The defeater is the realization that **coherence does not entail Expected Utility; it entails Expected Utility + Separability.** Drop Separability, and the edifice cracks.
