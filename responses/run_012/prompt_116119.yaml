      *   *The "One Argument":* The Allais Paradox is the most famous, but is it a *defeater*? Maybe the "Sequential Choice/Resoluteness" argument is stronger for the pragmatic strand. Or the "Triviality" charge for the representation strand. Actually, the *computational/epistemic cost* of maintaining EU coherence in complex environments might be the practical defeater. But the user wants *normative* defeaters. The strongest normative challenge is likely **Risk-Weighted Expected Utility (Buchak)** or the **Sequential Choice/Resoluteness** debate.

