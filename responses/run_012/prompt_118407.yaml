      *   *Allowable Guilt:* "I killed a civilian," "I sent men to die for no tactical gain," "I followed an order that was clearly a war crime."
      *   *Forbidden Guilt:* "I killed an enemy soldier who was doing his job," "I participated in an aggressive war (as a subordinate)."

      *Wait, one nuance:* Does a Company Commander count as a "leader" responsible for *ad bellum*? Usually, no. That's Generals/Politicians. A Company Commander executes strategy. So MEC protects him regarding the cause.

      *Wait, another nuance:* The "Manifest Illegality" clause. If the war is *obviously* unjust (e.g., naked aggression), does MEC still hold? Walzer says generally yes, due to the "coercive apparatus of the state." But some interpretations suggest a duty to refuse. I will stick to the standard Walzerian view for consistency: The soldier is shielded.

      *Structure:*
      1. Confirm understanding of MEC.
      2. The Ledger: Who is owed what? (Enemy combatants = nothing; Civilians = everything; Own men = care).
      3. The Officer's Specific Role (Tactical vs. Strategic).
