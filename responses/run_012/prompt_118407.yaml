  8.  **Final Review against constraints:** "I care less about whether the principle can be defended than about what it commits me to on the page." -> Focus on the implications for the narrative and dialogue.

      *Let's refine the "Guilt" aspect.* If the theory says he isn't culpable for the cause, why does he feel guilt?
      *   *Option A:* He is mistaken (tragic irony).
      *   *Option B:* He violated *in bello* rules (he actually did wrong things).
