prompt: |-
  OK so I got into an argument at a department lunch and it's been bugging me for a week. A collegue of mine (maths, not philosophy) reckons the Condorcet jury theorem basically settles how groups should make decisions, and he used it to argue we should scrap expert panels entirely. I wrote his case out and I'm pretty sure it proves way too much, but I can't put my finger on where it breaks. Here it is:

  (1) If a group votes on a yes/no question, and each member is independently more likely to get it right than wrong, then the majority is more likely to be right than any single member is, and the more members you add, the closer the majority's probability of being right gets to 1.
  (2) Our faculty has to decide whether a grant proposal is worth funding. Suppose each of us, reading it cold for half an hour, is right 51% of the time — barely better than a coin, but better.
  (3) Then if we just get enough of us in a room — say 400 of us, each at 51% and each making up their own mind — the majority verdict will be right with probability indistinguishable from certainty.
  (4) So it's actually epistemically irresponsible to use a small panel of real specialists; a big enough room of barely-above-chance readers beats them.
  (5) Which is obviously nuts. Three people who've worked in this area for a decade and spent a week on the proposal are not less reliable than 400 of us skimming it over coffee.
  (6) So either (1) is wrong or I'm applying it wrong.

  Which step do I give up, and what does giving it up cost me? If it helps: I'd much rather keep (1) than keep (4) — it's a real theorem and I don't want to be the guy who denies maths — but I'll take the hit if I have to. I also honestly couldn't tell you whether "51%" is even the right kind of thing to plug in there, or whether "each making up their own mind" is what the theorem actually needs.

  One thing I'd ask: seperate the bits that are genuinely settled among people who know this theorem from the bits that are actually contested, and don't sell me a contested reading as if it were the consensus. I don't know this literature well enough to tell the difference myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Argument at a department lunch (maths colleague vs. user).
      *   **Core Issue:** Colleague uses Condorcet Jury Theorem (CJT) to argue against expert panels in favor of large groups of non-experts.
      *   **User's Intuition:** This conclusion (step 4/5) is "obviously nuts." Experts should beat a crowd of people skimming a proposal.
      *   **User's Dilemma:** Wants to keep the math (Step 1) but reject the conclusion (Step 4). Needs to identify the broken step (2, 3, or the inference to 4).
      *   **Specific Request:** Distinguish between settled math/consensus and contested interpretations. Don't present contested views as fact.

  2.  **Deconstruct the Argument Steps:**
      *   (1) *Statement of CJT:* "If independent, >50% competence, majority vote -> truth probability -> 1 as N -> infinity." -> **Mathematically Correct.** (With caveats on independence).
      *   (2) *Application to Faculty:* "Each of us... is right 51% of the time." -> **Highly Contested/Problematic.** This is the empirical premise.
      *   (3) *Calculation:* "400 of us... probability indistinguishable from certainty." -> **Mathematically Correct** *given* (1) and (2).
      *   (4) *Normative Conclusion:* "Epistemically irresponsible to use small panel... big room beats them." -> **Invalid Inference.** Ignores competence differences and independence violations.
      *   (5) *Reality Check:* "Three experts... are not less reliable." -> **Intuitively Correct.**
      *   (6) *Dilemma:* "Either (1) is wrong or I'm applying it wrong." -> **False Dichotomy.** (1) is right, but the *application* (2 & 4) is wrong.

  3.  **Identify the Breaking Points:**
      *   **Competence ($p > 0.5$):** The CJT requires $p > 0.5$. In step (2), the colleague assumes *everyone* is $> 0.5$ on a *technical* grant proposal just by skimming. This is empirically false. Non-experts are likely $< 0.5$ on specialized topics. If $p < 0.5$, the theorem reverses (majority gets *wrong* as N increases).
      *   **Independence:** The CJT requires *conditional independence*. In a real department, people talk, share biases, read the same literature, and are influenced by senior colleagues. Correlated errors kill the theorem's convergence.
      *   **Common Signal vs. Truth:** Grant review isn't just "finding a fact" (like a jury finding guilt). It's evaluating quality/potential. There might not be a single objective "truth" to converge on in the same way.
      *   **Weighted Competence:** The theorem assumes equal competence. Experts have much higher $p$. A weighted vote or a small group of high-$p$ agents often beats a large group of low-$p$ agents, especially when $N$ isn't infinite.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the user's intuition is correct. The colleague's conclusion is a classic misuse of CJT.
      *   **The Math (Step 1):** Confirm Step 1 is solid. It's a theorem. Don't throw it under the bus.
      *   **The Empirical Premise (Step 2):** This is the main culprit.
          *   *Competence:* Is a random mathematician >50% likely to judge a specialized grant correctly by skimming? No. Often $p < 0.5$ for non-experts. If $p < 0.5$, CJT says the crowd gets *stupid* as it grows.
          *   *Independence:* Do 400 faculty members decide independently? No. Shared culture, biases, gossip. Correlated errors prevent the $1/N$ noise reduction.
      *   **The Normative Leap (Step 4):** Even if the math worked, "epistemically irresponsible" is too strong. Cost-benefit analysis (time, money) matters. Also, the "Truth" in grant funding is ambiguous (is it "will this work?" or "is this important?").
      *   **Consensus vs. Contested:**
          *   *Settled:* The math of CJT (Step 1). The necessity of Independence and $p > 0.5$.
          *   *Contested/Nuanced:* How to estimate $p$ in real world. How to handle correlated votes (Bayesian networks, etc.). Whether grant funding *has* a truth value suitable for CJT.
      *   **Actionable Advice:** Which step to give up? Give up (2). It's empirically false.

  5.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Wait, is it just $p < 0.5$?* If non-experts are just random guessing ($p=0.5$), the theorem doesn't kick in. If they are systematically biased ($p < 0.5$), it converges to 0. The colleague assumes $p=0.51$. Why? Probably arrogance or misunderstanding of "competence."
      *   *Independence is crucial.* List and Pettit (2011) or similar social choice theory literature emphasizes this. Common causes of error (e.g., a misleading abstract) make votes correlated.
      *   *The "Expert Panel" counter:* A small group of experts has high $p$ (say 0.9). 3 experts at 0.9 is often better than 400 novices at 0.51 *if* independence is violated among the 400. Even if independent, 400 at 0.51 is strong, but 3 at 0.9 is *very* strong. But the real killer is that novices aren't 0.51 on *specialized* grants.
      *   *Truth Condition:* CJT applies to matters of fact. Grant funding is often evaluative/normative. Does the project *deserve* funding? That's not a binary fact like "Did the defendant pull the trigger?" This is a philosophical objection to applying CJT here at all.

  6.  **Finalizing the Structure:**
      *   **Direct Answer:** Step (2) is the break.
      *   **The Math (Settled):** Confirm (1).
      *   **The Competence Condition (Settled):** Explain why $p > 0.5$ is non-negotiable and likely false for non-experts on technical tasks.
      *   **The Independence Condition (Settled):** Explain why real-world votes are correlated.
      *   **The "Truth" Condition (Contested/Philosophical):** Discuss whether grant funding fits the CJT model.
      *   **Conclusion:** You don't deny the math; you deny the model fit.

  7.  **Tone Check:** Keep it collegial, precise, and respectful of the math while firm on the application errors. Ensure the distinction between "math" and "empirical application" is clear. (User asked to separate settled from contested).

      *   *Settled:* The theorem's conditions (Independence, Competence > 0.5).
      *   *Contested:* How to model real-world dependence, whether specific real-world tasks have objective truth values.

  8.  **Final Polish:** Make sure to explicitly address the "cost" of giving up Step 2. The cost is admitting we can't easily measure competence, but the benefit is saving the theorem from absurdity.

      *(Self-Correction during drafting)*: I should mention that even if $p > 0.5$, if the experts have *much* higher $p$, the small group might still be more efficient/cost-effective, even if the large group is theoretically more accurate *asymptotically*. But the main point is the $p < 0.5$ risk.

      Let's write it.
answer: |-
  You are right to be bugged. Your colleague has committed a classic error in applied epistemology: he has taken a mathematical theorem that holds under specific, idealized conditions and assumed those conditions obtain in a messy real-world scenario where they almost certainly do not.

  You do not need to give up the math (Step 1). You need to reject the empirical premises (Step 2) and the inference to the normative conclusion (Step 4).

  Here is the breakdown of where the argument breaks, separated into what is mathematically settled and what is empirically/philosophically contested.

  ### 1. The Math (Step 1): Settled
  **Status:** **Correct.**
  The Condorcet Jury Theorem (CJT) is a theorem. It is not up for debate. If you have $N$ voters, each with probability $p > 0.5$ of choosing the correct option, and their votes are **conditionally independent**, then the probability of the majority being correct approaches 1 as $N \to \infty$.

  **Cost of keeping this:** None. It is true.

  ### 2. The Competence Premise (Step 2): The Main Break
  **Status:** **Empirically False / Contested Application.**
  Your colleague assumes that for a specialized grant proposal, a random faculty member skimming it for 30 minutes has $p = 0.51$. This is the weak link.

  *   **The "Competence" Threshold:** The CJT has a hard cliff edge. If $p > 0.5$, the crowd gets smarter as it grows. If $p < 0.5$, the crowd gets **more confident in the wrong answer** as it grows. If $p = 0.5$, the crowd stays at 0.5 regardless of size.
  *   **The Reality of Specialization:** In mathematics (and most sciences), grant proposals are highly technical. If a number theorist skims a grant proposal on fluid dynamics, their probability of assessing its merit correctly is not 51%. It is likely indistinguishable from random guessing (50%) or, worse, systematically biased by superficial features (e.g., "this looks like the work of a famous person" or "the notation is familiar"). If the average non-expert is effectively at $p=0.5$, the theorem yields no gain. If they are systematically misled by jargon ($p < 0.5$), a large crowd guarantees error.
  *   **Consensus:** Among social epistemologists and political theorists who use CJT, it is **settled** that the competence condition is the most frequent point of failure in real-world applications. You cannot assume $p > 0.5$ without evidence.

  **Cost of giving this up:** You must admit that we cannot easily assign a number like "51%" to human judgment without empirical calibration. But this is a reasonable cost; it's better than assuming magic.

  ### 3. The Independence Premise (Step 3): The Hidden Break
  **Status:** **Empirically False / Settled Requirement.**
  The CJT requires votes to be *conditionally independent*. This means that once the "truth" is fixed, my vote tells you nothing about your vote.

  *   **Common Causes of Error:** In a department, votes are not independent. You all read the same literature, share similar methodological biases, attend the same seminars, and likely know the applicant (or know the applicant's advisor). If the grant proposal contains a subtle error that relies on a common misconception in the field, 400 faculty members are likely to *all* miss it for the *same reason*.
  *   **Correlated Noise:** When errors are correlated, the "law of large numbers" effect vanishes. You don't get 400 independent data points; you get perhaps 5 effective data points repeated 80 times.
  *   **Consensus:** It is **settled** in the literature (e.g., in work by Philip Pettit, Christian List, or David Estlund) that real-world voting bodies rarely satisfy strict independence. When dependence is introduced, the convergence to certainty slows down drastically or stops entirely.

  ### 4. The Normative Conclusion (Step 4): Invalid Inference
  **Status:** **Philosophically Contested.**
  Even if the math worked (high $p$, high independence), Step 4 claims it is "epistemically irresponsible" to use experts. This ignores **efficiency** and **weighting**.

  *   **Diminishing Returns:** Going from 3 experts ($p=0.9$) to 400 non-experts ($p=0.51$) might theoretically increase accuracy, but the marginal gain per person drops rapidly. The cost (400 people reading for 30 mins = 200 hours) vastly outweighs the cost of 3 experts reading for a week.
  *   **Weighted Voting:** A variation of CJT allows for weighted votes based on competence. A panel of experts is essentially a weighted vote where the weights are concentrated on high-$p$ agents. This is mathematically superior to unweighted voting if competence varies significantly.
  *   **The Nature of "Truth":** This is the **contested** philosophical bit. CJT applies to questions of *fact* (e.g., "Did the defendant commit the crime?"). Grant funding is often a question of *value* or *prediction* (e.g., "Is this project worthy?" or "Will this succeed?"). There may not be a mind-independent "truth" for the group to converge on. If there is no objective truth, CJT doesn't apply at all.

  ### Summary: Where to Stand

  You should tell your colleague:

  1.  **Keep (1):** The theorem is fine.
  2.  **Reject (2):** You cannot assume non-experts have $p > 0.5$ on specialized technical tasks. In fact, on highly specialized topics, non-experts often have $p \approx 0.5$ or lower. If $p \le 0.5$, the theorem implies the crowd offers no benefit or actively harms accuracy.
  3.  **Reject the Independence Assumption:** Departmental votes are highly correlated due to shared culture and information. This breaks the convergence mechanism.
  4.  **Reject (4):** Even if the crowd were more accurate asymptotically, expert panels are more *efficient* and function as competence-weighted voting, which is a valid alternative model.

  ### The "Consensus" Check
  To answer your specific request about what is settled vs. contested:

  *   **Settled:** The mathematical conditions of CJT (Independence and $p > 0.5$ are necessary).
  *   **Settled:** Real-world groups often violate independence (correlated errors).
  *   **Contested:** How to model those correlations (there are "Relaxed CJT" models that allow for some correlation, but they require much larger $N$ to converge).
  *   **Contested:** Whether evaluative judgments (like grant funding) have "truth values" suitable for CJT analysis.

  **The Verdict:** Your colleague is using a sledgehammer (CJT) to crack a nut, but he's swinging at the wrong nut. He is treating a problem of **variable competence and correlated error** as if it were a problem of **aggregating independent signals**.

  You don't have to deny the math. You just have to insist that **model fit matters.** Applying CJT to a group of non-experts evaluating a specialized technical document violates the theorem's core preconditions. Therefore, the conclusion does not follow.
