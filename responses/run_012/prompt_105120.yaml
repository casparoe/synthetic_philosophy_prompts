prompt: |-
  Im putting together a session on partiality and the moral point of view and keep going in circles, so I want the spec first, before any theory. Write me the desiderata for a theory of what morality asks of an agent -- what it has to deliver to survive Williams's integrity objection, the drowning-wife case where the man just saves his wife and the theory has supposedly forced a thought too many on him. Give me the full list: the cases it has to get right (the drowning wife, but also the harder ones -- a doctor choosing between his own child and a stranger with the better prognosis, someone told to drop a lifelong project for a marginally bigger impartial gain, a person whose ground project is itself morally rotten), the distinctions it can't collapse (justifying an action versus the deliberation that actually produces it; permitted partiality versus required partiality; integrity versus plain self-indulgence), and the constraints it can't break (morality still has to be authoritative, not just whatever the agent happens to care about). Then tell me which of these can't all be held at once -- that's the part I most want -- and which single requirement does the most to rule out the usual suspects. Keep the scorecard of consequentialism, Kantianism and the rest to a line each, I'll do that bit in class.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Partiality and the Moral Point of View (specifically addressing Bernard Williams's integrity objection).
      *   **Task:** Create a "spec" or "desiderata" list for a theory of morality *before* introducing specific theories.
      *   **Key Components:**
          *   Cases the theory must handle (Drowning Wife, Doctor/Child vs. Stranger, Ground Projects vs. Marginal Gain, Rotten Ground Projects).
          *   Distinctions the theory must maintain (Justification vs. Deliberation, Permitted vs. Required Partiality, Integrity vs. Self-Indulgence).
          *   Constraints the theory must respect (Authority of Morality).
          *   **Crucial Requirement:** Identify the tensions/incompatibilities (which desiderata can't all be held at once).
          *   **Crucial Requirement:** Identify the single requirement that rules out the most "usual suspects."
          *   **Constraint:** Keep theory scorecards (Consequentialism, Kantianism, etc.) to one line each.
      *   **Tone:** Philosophical, precise, structured, avoiding "circles" (as the user requested a spec first).

  2.  **Deconstruct the Desiderata (The "Spec"):**

      *   *Cases:*
          1.  **The Drowning Wife (Williams):** Agent saves wife without calculating utility. Theory must allow this without making it a moral *accident*.
          2.  **The Doctor's Child:** Triage scenario. Own child vs. stranger with better prognosis. Tests limits of professional impartiality vs. parental duty.
          3.  **The Marginal Gain:** Drop a lifelong project (art, research) for a slightly better impartial outcome (donating to charity). Tests the demandingness objection.
          4.  **The Rotten Project:** Agent's ground project is immoral (e.g., a devoted Nazi or Mafia boss). Theory must condemn this, not validate it as "integrity."

      *   *Distinctions:*
          1.  **Justification vs. Deliberation:** Why an act is right vs. what goes through the agent's head *while* acting. (Williams's "one thought too many").
          2.  **Permitted vs. Required Partiality:** When is it okay to favor loved ones? When *must* you? (e.g., parenting).
          3.  **Integrity vs. Self-Indulgence:** Sticking to guns for identity vs. just being selfish/weak-willed.

      *   *Constraints:*
          1.  **Authority:** Morality can't just be "do what you want." It must have normative force.
          2.  **Action-Guiding:** It must actually help decide what to do.

  3.  **Identify the Tensions (The "Impossibility Theorem"):**
      *   This is the core of the user's request ("tell me which of these can't all be held at once").
      *   *The Trilemma:*
          1.  **Morality is Impartial/Universal:** It treats everyone's interests equally.
          2.  **Morality is Action-Guiding/Authoritative:** It tells us what to do in a way that motivates/requires us.
          3.  **Morality Respects Integrity/Partiality:** It allows deep personal commitments that override impartial calculation.
      *   *Williams's Point:* You can't have strong Impartiality + strong Authority + strong Integrity.
      *   *Specific Tension:* If Morality is fully Impartial and Authoritative, it crushes Integrity (Drowning Wife). If it respects Integrity too much, it loses Authority (becomes optional). If it keeps Authority and Integrity, it must abandon Impartiality (which many find unacceptable for *morality*).
      *   *The "One Thought Too Many" Tension:* If the theory provides the *justification*, can it remain silent on the *deliberation*? If it dictates deliberation, it violates integrity. If it ignores deliberation, is it really a theory of *agency*?

  4.  **Identify the "Killer Constraint":**
      *   Which requirement rules out the most theories?
      *   Usually, it's the **Justification vs. Deliberation** distinction combined with the **Authority** constraint.
      *   *Why?* Consequentialism fails the Deliberation test (it wants you to calculate). Kantianism often fails the Partiality test (duty is universal). Virtue Ethics often fails the Authority test (it's descriptive of character, not necessarily prescriptive in hard cases).
      *   *Actually, the strongest filter is:* **The demand that morality be authoritative *without* alienating the agent from their ground projects.**
      *   Let's refine: The requirement that **Morality must be action-guiding at the level of deliberation *while* remaining impartial** is the one that kills Utilitarianism. The requirement that **Morality must be authoritative *even when* it conflicts with ground projects** kills radical partiality views.
      *   *Best Candidate:* **The Distinction between Justification and Deliberation.** Most theories collapse these. Utilitarianism says the justification *is* the deliberation. Kantianism says the motive *is* the justification. Only a hybrid or two-level theory keeps them apart. This is the hardest spec item to meet.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the goal (spec before theory).
      *   *Section 1: The Test Cases.* (Wife, Doctor, Project, Rotten Project).
      *   *Section 2: The Distinctions.* (Justification/Deliberation, Permitted/Required, Integrity/Indulgence).
      *   *Section 3: The Constraints.* (Authority, Non-Alienation).
      *   *Section 4: The Incompatibilities (The "Trilemma").* This needs to be sharp.
      *   *Section 5: The Killer Constraint.*
      *   *Section 6: One-liners.*

  6.  **Refining the "Incompatibility" Section:**
      *   I need to be precise. It's not just "they conflict." It's that satisfying one *logically* undermines another in the context of Williams's critique.
      *   *Conflict:* **Impartial Authority vs. Non-Alienated Deliberation.**
      *   If morality is the supreme authority (Impartial), it must govern deliberation. If it governs deliberation, it alienates the agent from their immediate loves (Wife case). If it doesn't govern deliberation, it loses Authority (it's just a post-hoc check).
      *   So, you can't have: (1) Morality as the supreme deliberative guide + (2) Morality as Impartial + (3) Morality as compatible with Integrity.

  7.  **Refining the "Killer Constraint":**
      *   What rules out the usual suspects?
      *   Act Utilitarianism: Fails Deliberation/Integrity.
      *   Rule Utilitarianism: Tries to fix it, but collapses under pressure.
      *   Kantianism: Fails Partiality (usually).
      *   Virtue Ethics: Fails Authority (sometimes).
      *   *The Winner:* **The Justification/Deliberation Gap.** A theory that says "The right act is X" but "You shouldn't think about X to do X" is structurally unstable for most normative systems. This is the hardest spec to meet.

  8.  **Review against Constraints:**
      *   Did I keep theory scorecards to one line? Yes.
      *   Did I focus on the spec first? Yes.
      *   Is the tone appropriate? Yes, academic but direct.

  9.  **Final Polish:** Check the "Rotten Project" case. This is crucial because Williams is sometimes accused of validating *any* ground project. The spec must ensure the theory doesn't validate immorality in the name of integrity. This adds tension to the "Integrity" desideratum.

      *(Self-Correction during drafting)*: Make sure to explicitly state *which* requirements are incompatible. Don't just hint at it. The user asked: "tell me which of these can't all be held at once."

      *The Incompatibility:* You cannot simultaneously hold:
      1.  **Morality is Impartially Authoritative** (It overrides personal projects based on neutral value).
      2.  **Morality is Deliberatively Transparent** (The justification for the act must be the motive for the act).
      3.  **Morality Preserves Integrity** (Agents can act from deep personal commitments without moral deficit).
      *   Williams says drop (2). Most traditional theories keep (2) and lose (3).

      *The Killer Constraint:* **Deliberative Transparency (or the lack thereof).** The requirement that a theory explain *why* an agent shouldn't think about the theory while acting. This kills Act Consequentialism immediately.

  10. **Final Output Generation** (Proceed to write based on these thoughts).
answer: |-
  Here is the specification for a theory of morality and partiality. This is the desiderata list before any theoretical machinery is introduced.

  ### I. The Test Cases (Extensional Adequacy)
  A viable theory must deliver the correct verdicts (or explain the ambiguity) in the following four scenarios:

  1.  **The Drowning Wife (Williams):** A man saves his drowning wife rather than a stranger.
      *   *Requirement:* The theory must validate this choice as morally permissible (or required) without making the agent's motivation morally suspect. It cannot require the agent to calculate impartial value to justify the rescue.
  2.  **The Triage Doctor:** A doctor must treat one of two patients: their own child or a stranger with a slightly better medical prognosis.
      *   *Requirement:* The theory must adjudicate the conflict between professional impartiality and parental duty. It cannot simply say "impartiality always wins" (implausible) nor "family always wins" (corrupts the role).
  3.  **The Marginal Gain:** An agent is asked to abandon a lifelong ground project (e.g., painting, research) to generate a marginally greater impartial good (e.g., slightly more effective charity work).
      *   *Requirement:* The theory must explain why the agent is permitted to keep the project. It must block the "demandingness" objection without making morality optional.
  4.  **The Rotten Project:** An agent refuses to stop a morally heinous activity (e.g., forgery, political violence) because it is central to their identity and "integrity."
      *   *Requirement:* The theory must condemn this. It cannot validate integrity when the ground project is itself immoral. Integrity is not a moral trump card.

  ### II. The Conceptual Distinctions (Intensional Adequacy)
  A viable theory must not collapse the following distinctions:

  1.  **Justification vs. Deliberation:** The reason an act is *right* (justification) vs. the psychological process that *produces* the act (deliberation).
      *   *Requirement:* The theory must allow that the moral truth can be $X$, while the agent's motivating thought is $Y$. (Williams's "one thought too many").
  2.  **Permitted vs. Required Partiality:** The space between what I *may* do for my loved ones vs. what I *must* do.
      *   *Requirement:* The theory must distinguish between supererogatory partiality (buying my child a gift) and obligatory partiality (feeding my child).
  3.  **Integrity vs. Self-Indulgence:** Sticking to a commitment because it constitutes the self vs. sticking to it because I want to.
      *   *Requirement:* The theory must provide a criterion to distinguish a "ground project" (constitutive of identity) from a mere "strong desire" (subject to trade-off).

  ### III. The Normative Constraints
  A viable theory must satisfy the following structural conditions:

  1.  **The Authority Constraint:** Morality must be normative. It cannot simply describe what agents *do* care about; it must prescribe what they *should* care about. It must have bite.
  2.  **The Non-Alienation Constraint:** Morality must not systematically alienate the agent from their motives. If following the theory requires the agent to view their deepest commitments as mere tools for utility, the theory fails to guide *human* agency.
  3.  **The Publicity Constraint:** The theory must be shareable. It cannot rely on esoteric knowledge available only to the theorist, not the agent.

  ---

  ### IV. The Incompatibilities (The Trilemma)
  You cannot hold all of the following three requirements simultaneously. One must be weakened or rejected.

  1.  **Impartial Authority:** Morality is based on neutral, agent-neutral reasons that override personal projects when they conflict.
  2.  **Deliberative Transparency:** The justification for an action must be available to the agent as the motive for the action (the agent acts *because* it is right).
  3.  **Integrity Preservation:** Agents can act directly from personal love/commitment without moral deficit.

  **The Conflict:**
  *   If you hold **(1) and (2)** (Traditional Consequentialism/Kantianism), you lose **(3)**. The agent must calculate duty/utility, creating the "one thought too many" and alienating them from their projects.
  *   If you hold **(2) and (3)** (Sentimentalism/Some Virtue Ethics), you lose **(1)**. Morality loses its authority and becomes "do what feels constitutive," failing the Rotten Project case.
  *   If you hold **(1) and (3)** (Two-Level Utilitarianism/Indirect Strategies), you lose **(2)**. You must lie to the agent about why they are acting (Justification $\neq$ Deliberation), which risks violating Publicity and Authority.

  ### V. The Killer Constraint
  The single requirement that does the most work in ruling out the usual suspects is:

  **The Justification/Deliberation Gap.**

  *   **Why it rules out Act Consequentialism:** It demands the agent calculate the impartial good in the moment. It collapses Justification into Deliberation, failing the Drowning Wife case.
  *   **Why it rules out Strict Kantianism:** It demands the agent act *from* duty as the primary motive. It struggles to accommodate partial motives (love) as morally sufficient without smuggling them in as "duties," failing the Non-Alienation constraint.
  *   **Why it rules out Simple Virtue Ethics:** It often lacks the resources to explain *why* a virtue is right when virtues conflict (The Triage Doctor), failing the Authority constraint when the "virtuous" thing is unclear.

  To survive Williams, a theory must explicitly argue why the agent is *forbidden* from thinking about the theory while acting, while maintaining that the theory is still what makes the act right. This structural schizophrenia is the highest barrier to entry.

  ### VI. Theory Scorecard (For Class)
  *   **Act Utilitarianism:** Fails Integrity/Deliberation (demands calculation in the moment).
  *   **Kantian Deontology:** Fails Partiality (struggles to ground special duties without reducing them to universal law).
  *   **Rule Utilitarianism:** Attempts the Gap (follow rules, not utility), but collapses under pressure to break rules for marginal gains.
  *   **Virtue Ethics:** Preserves Integrity, but risks losing Authority (why be virtuous if it conflicts with projects?).
  *   **Bernard Williams:** Diagnoses the problem, offers no systematic theory (rejects the "Morality" system entirely).
