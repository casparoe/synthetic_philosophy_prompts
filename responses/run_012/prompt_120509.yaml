prompt: |-
  Ok so I'm in a third-year metaphysics seminar and we've just spent four weeks on material constitution — statue/clay, ship of Theseus, all that — and my study group has split in two and we've been arguing in the group chat for a fortnight without either side being able to say what the other side actually believes. Side A says: there's exactly one material object on the pedestal. "The statue" and "the lump of bronze" are two ways of picking out the same thing, and the reason some sentences seem to treat them differently ('the lump would survive being melted down, the statue wouldn't') is that those sentences are sensitive to which of our sortal concepts we're applying, or they're elliptical, or they're just loose talk — but none of that requires a second object. Side B says: no, there are genuinely two numerically distinct objects in the same place at the same time, a lump and a statue, made of the same matter, with different persistance conditions, and the truth of 'the lump survived the melting but the statue didn't' is just evidence for that. I'm on side B and I'll admit I can't write down side A's view in a way side A would put their name to, and they say the same about mine. So I want the document we should've written weeks ago: the joint statement of an advesarial collaboration between the one-object and the two-object views.

  Can you draft it? I want (1) a numbered list of agreed claims, including the boring-looking ones about what happens in the cases — but they have to be genuinely non-trivial, 'we agree there's something on the pedestal' doesn't count; (2) the precise points of disagreement in a table, each phrased the way that side would phrase it themselves, so side A gets to say what side A means by 'object' and 'exists' rather than me putting words in their mouth; (3) the cruxes — the sub-questions where settling it would actually move one of us — and for each, something both sides agree would bear on it, with each side's prediction written down in advance; and (4) if you think part of the fight is verbal, say which part and why.

  Please run it on the cases we've been yelling about rather than the stock ones: (a) the gallery's bronze, cast in 1902, where 'the bronze was in the foundry in 1901 and the sculpture wasn't' seems true to everyone; (b) the case where a sculptor takes a lump of clay that's been sitting in the studio for years and on a Tuesday just declares it a work — so the lump and the sculpture come into existence at the exact same moment, which looks like it kills the temporal argument — and then on Friday she un-declares it; (c) the restoration case where a conservator replaces 40% of the metal, which is fine for the lump story (same matter? no) and fine for the statue story (same work of art? yes); (d) two casts from the same mould, same alloy, made the same afternoon; (e) the squash case. Don't tell me who wins, and don't cite anyone or give me a reading list — I can't get to the library anyway and the seminar has no set text, I just need the document itself. Keep the agreed claims to what both sides would really sign even if that makes the list short, and if a claim only looks like agreement because it's vague, flag it as vague instead of listing it as agreed.
