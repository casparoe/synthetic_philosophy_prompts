  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Material Constitution and Numerical Identity
  **Parties:** Side A (Constitution as Identity / One Object) & Side B (Constitution as Non-Identity / Two Objects)
  **Date:** [Current Date]
  **Status:** Pending Resolution

  ## 1. AGREED CLAIMS
  *The following claims are affirmed by both Side A and Side B. Claims flagged as [VAGUE] indicate areas where wording was compromised to secure agreement; substantive disagreement remains on the underlying metaphysics of these claims.*

  1.  **The Squash Case (Persistence Divergence):** In the scenario where the clay form is flattened immediately after creation:
      *   (i) The material continuity of the clay is unbroken.
      *   (ii) The artistic status of the work is terminated.
      *   (iii) The sentence "The lump survived but the statue did not" is *assertible* in ordinary discourse.
  2.  **The Gallery Bronze (Temporal Offset):** Regarding the bronze cast in 1902 from metal smelted in 1901:
      *   (i) The material aggregate existed in the foundry in 1901.
      *   (ii) The artwork (the sculpture) did not exist in the foundry in 1901.
      *   (iii) No physical change occurred at the exact moment the artwork came into existence in 1902 that was not also a change in the material.
  3.  **The Tuesday Declaration (Simultaneous Origin):** Regarding the clay lump declared a work on Tuesday:
      *   (i) At 09:00 Tuesday, the clay possessed all its intrinsic physical properties.
      *   (ii) At 09:01 Tuesday, the entity is correctly described as a "sculpture."
      *   (iii) No mereological rearrangement occurred between 09:00 and 09:01.
  4.  **The Restoration Case (Matter Replacement):** Regarding the replacement of 40% of the metal:
      *   (i) The specific atoms constituting the object at *t1* are not identical to the atoms constituting the object at *t2*.
      *   (ii) The artwork is correctly judged to have survived the restoration.
  5.  **The Twin Casts (Indiscernibility):** Regarding the two casts from the same mould:
      *   (i) At the moment of casting, the two resulting entities share all intrinsic physical properties.
      *   (ii) They are numerically distinct (there are two, not one).
  6.  **Logical Framework:**
      *   (i) Leibniz's Law (the Indiscernibility of Identicals) is a valid logical principle. [VAGUE: Both sides agree it is valid, but disagree on whether it applies to objects simpliciter or only relative to a sortal.]
      *   (ii) There is at least one concrete particular located on the pedestal.

  ---

  ## 2. POINTS OF DISAGREEMENT
  *Each side phrases their position in their own preferred terminology. Neither side endorses the other's column.*

  | Topic | Side A (One Object View) | Side B (Two Objects View) |
  | :--- | :--- | :--- |
  | **Ontological Count** | There is exactly **one** material object on the pedestal. "The statue" and "the lump" are two concepts or sortals applied to this single entity. | There are **two** numerically distinct material objects on the pedestal. They are spatially coincident but ontologically distinct. |
  | **Constitution Relation** | Constitution is **Identity**. If *x* constitutes *y* at *t*, then *x* = *y* at *t*. | Constitution is **Not Identity**. If *x* constitutes *y* at *t*, *x* ≠ *y* at *t*. Constitution is a unique intimate relation, not identity. |
  | **The Tuesday Declaration** | On Tuesday, no new object was created. The pre-existing object acquired a new **status** or fell under a new **sortal concept** ("artwork"). | On Tuesday, a new object (the statue) came into existence. It is distinct from the pre-existing lump, despite sharing matter and location. |
  | **Modal Properties** | Objects do not have persistence conditions essentially. Persistence conditions are **sortal-relative**. The object *qua* lump survives melting; *qua* statue it does not. | Objects have persistence conditions **essentially**. The lump essentially survives melting; the statue essentially does not. This difference proves non-identity. |
  | **Leibniz's Law Application** | Leibniz's Law holds, but properties must be indexed to sortals. "Survives melting" is not a monadic property but a relation to a concept. | Leibniz's Law holds absolutely. If the lump has the property "survives melting" and the statue does not, they cannot be identical. |
  | **The Squash Case** | One object exists before and after. We simply stop applying the "statue" sortal to it after squashing. The object itself persists. | Two objects existed before; one object (the lump) exists after. The statue object ceased to exist. |
  | **Coincidence** | Two material objects cannot occupy the same space at the same time. This is metaphysically impossible/profligate. | Two material objects *can* occupy the same space at the same time if they have different persistence conditions. |

  ---

  ## 3. THE CRUXES
  *Sub-questions where a resolution would force one side to abandon their position. For each crux, we list an agreed-upon test/intuition pump and each side's prediction.*

  ### Crux 1: The Cost of Coincidence
  *   **The Question:** Is the metaphysical "cost" of allowing coincident entities (Two Objects) higher than the cost of making identity sortal-relative (One Object)?
  *   **The Test:** A comparative theoretical virtue assessment. Does allowing coincidence violate a deeper principle (e.g., "No two things in one place") more than denying absolute persistence conditions violates logic (Leibniz's Law)?
  *   **Side A Prediction:** Allowing coincidence is intolerable. It violates the principle of spatial exclusivity for material objects. We must reject coincidence even if it makes identity sortal-relative.
  *   **Side B Prediction:** Making identity sortal-relative is intolerable. It violates the absoluteness of identity. We must accept coincidence even if it means two things in one place.

  ### Crux 2: The Tuesday Intuition (Creation ex Nihilo?)
  *   **The Question:** In the Tuesday Declaration case, does the artist's declaration bring a *new object* into being, or merely change the *description* of an old one?
  *   **The Test:** Intuition check on "New Existence." If nothing physical changes, can a new concrete particular exist?
  *   **Side A Prediction:** Intuition will favor "No New Object." Concrete particulars require physical changes to come into existence. A mere declaration cannot create matter or objecthood.
  *   **Side B Prediction:** Intuition will favor "New Object." Artistic creation is real. If the statue is a real thing, it began on Tuesday. Since the lump began years ago, they must be different things.

  ### Crux 3: The Counting Test (The Twin Casts)
  *   **The Question:** In the Twin Casts case (d), why do we count two objects? Is it because of spatial separation or distinct histories?
  *   **The Test:** Apply the counting logic of the Twin Casts to the Statue/Lump case. If we count two casts because they have different future histories (one melts, one doesn't), do we count two in the Statue/Lump case for the same reason?
  *   **Side A Prediction:** The Twin Casts are distinct because they are *spatially* separated. The Statue/Lump are not spatially separated, so the counting logic does not transfer.
  *   **Side B Prediction:** The Twin Casts are distinct because they have *different persistence conditions* and histories. The Statue/Lump have different persistence conditions, so the counting logic *does* transfer.

  ---

  ## 4. VERBAL DISPUTE ANALYSIS
  *Assessment by both parties on whether the disagreement is merely verbal.*

  **Joint Assessment:** The dispute is **partially verbal, but not wholly.**

  **1. The Verbal Component (Terminology of "Object"):**
  *   **Diagnosis:** Side A and Side B appear to use the word "object" with different implicit constraints.
  *   **Side A Usage:** "Object" implies a spatially bounded continuant where identity is tied to the dominant matter or form. To call the statue and lump "two objects" sounds like claiming there are two *masses* of bronze.
  *   **Side B Usage:** "Object" implies any entity with persistence conditions. To call the statue and lump "one object" sounds like claiming they share *all* properties, including modal ones.
  *   **Agreement:** If we define "object" as "spatially bounded matter," Side A wins (there is one). If we define "object" as "entity with distinct persistence conditions," Side B wins (there are two).

  **2. The Substantive Component (Leibniz's Law & Modality):**
  *   **Diagnosis:** Even if we standardize terminology, a disagreement remains regarding the nature of properties.
  *   **The Core:** Side B insists that "surviving melting" is a monadic property of the entity. Side A insists it is a relational property (entity + sortal).
  *   **Why it's not just verbal:** This is a disagreement about the structure of reality, not just labels. Side B believes modal properties are intrinsic to the particular. Side A believes modal properties are extrinsic/relative to our conceptual scheme. No amount of re-defining "object" resolves whether modal properties are intrinsic or relative.

  **3. Conclusion on Verbality:**
  We agree that clarifying the definition of "object" reduces the heat of the argument, but does not dissolve the problem. The disagreement over **whether identity is absolute or sortal-relative** remains substantive even after terminological clarification.

  ---
  **Signed:**
  *Representative, Side A (One Object)*
  *Representative, Side B (Two Objects)*
