answer: |-
  A philanthropist controls a fixed endowment sufficient to either distribute insecticide-treated nets guaranteeing the survival of 400 identifiable children in a specific region within the year (Project A) or fund a technical biosecurity audit that yields no immediate health benefits but reduces the risk of human extinction over the next century by 0.0004% (Project B). The expected value of Project B, derived from the tiny probability shift multiplied by the value of future generations, exceeds Project A's benefit by a margin of only 2% when calculated with a zero pure time discount rate; however, applying even a modest 1% annual pure time discount rate renders Project B's expected value negligible compared to Project A. The empirical probabilities and population counts are stipulated as known constants for the decision, isolating the valuation of temporal distance as the sole variable.

  **Verdicts and Derivations:** Strong longtermism mandates Project B, derived from time-neutral totalism (future welfare counts equally with present welfare), impartiality across times, and expected-value maximization; since the time-neutral expected value of B exceeds A, B is obligatory. The moderate, present-prioritizing view mandates Project A, derived from a commitment to a non-zero pure time discount rate (future welfare counts less simply because it is future); once discounted, the expected value of A exceeds B.

  **Single Feature and Removal:** The sole feature driving the disagreement is the **pure time discount rate**. If you remove this feature (set the rate to 0%), the moderate view's calculation converges with the longtermist verdict, selecting Project B. If you retain the discount, the verdicts diverge.

  **Attack:** A defender of the moderate view, whose verdict is overturned by removing the discount, would attack the case's stipulation that empirical probabilities are known constants. They would argue that pure time discounting is not arbitrary discrimination but a necessary proxy for epistemic uncertainty regarding the far future; by stipulating away uncertainty, the thought experiment removes the primary justification for the discount, begging the question against the moderate position.
