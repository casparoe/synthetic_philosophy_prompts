          2.  The "Narrative" side bundles three distinct claims (Style, Explanatory Work, Ontological Constitution), and Covering-Law proponents attack the weakest.
          3.  The debate is supposedly dead but keeps resurfacing (causal modelling, mechanisms).
      *   **Task:** Diagnose the dispute. Is it verbal? About disciplinary aims? Empirical (do laws exist)? Or multiple disputes bundled?
      *   **Requirement:** Use actual positions/arguments from both sides. Identify real vs. artifact disagreements. Suggest what progress would look like (dissolution, concession, or giving up).
