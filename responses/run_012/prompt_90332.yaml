      *   *Real:* Do human actions follow law-like regularities?
      *   *Aims:* Prediction/Control vs. Meaning/Understanding.

      *   *Conclusion:* The debate persists because both sides are half-right about different things. The synthesis is already happening in philosophy of science (mechanisms), but historians haven't fully absorbed it.

  8.  (Final Review against constraints): "Test it rather than just nod along." I need to be critical. Where might the user be wrong?
