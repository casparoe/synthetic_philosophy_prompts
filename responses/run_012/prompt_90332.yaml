answer: |-
  Your suspicion is sharp, but it needs a slight adjustment. You are correct that the debate is a "cluster dispute" masquerading as a single problem, and you are right that "narrative" is an overloaded term. However, calling it merely a verbal dispute about questions (plain vs. contrastive) lets the Covering-Law model off the hook too easily. Hempel would argue that *even* contrastive questions require laws to be answered rigorously.

  The stalemate persists not because they are talking past each other, but because they are fighting over **jurisdiction** (what counts as knowledge) using **incompatible criteria** (logic vs. intelligibility).

  Here is the diagnosis of the Covering-Law vs. Narrative debate, testing your hypotheses against the actual philosophical commitments of the key players (Hempel, Dray, Gallie, Mink, and the modern mechanism crowd).

  ### 1. Testing the "Different Questions" Hypothesis
  **Verdict:** Partially correct, but not the root cause.

  You suggest Covering-Law answers "Why did this happen?" (plain) while Narrative answers "Why this rather than that?" (contrastive).
  *   **Where you're right:** Bas van Fraassen (in *The Scientific Image*) later formalized this. Historical questions are almost always contrastive ("Why did the Weimar Republic collapse *rather than* stabilize?"). Narrative excels here because it traces the branching paths that were closed off. Covering-Law struggles because universal laws don't usually specify contrast classes.
  *   **Where you're wrong:** Hempel knew about contrastive questions. His argument was that to answer *any* why-question objectively, you must show the event was *expected* given laws. If you don't have the law, you have a "explanation sketch," not an explanation.
  *   **The Real Disagreement:** It isn't about the *question*, it's about the **criteria for a valid answer**.
      *   **Hempel:** An answer is valid if it is **logically derivable**. (Context of Justification).
      *   **Narrative (Dray/Gallie):** An answer is valid if it renders the action **intelligible** to a rational agent. (Context of Understanding).
      *   **The Clash:** Hempel thinks "intelligibility" is psychological fluff. Dray thinks "derivability" is irrelevant to human action. This isn't verbal; it's a disagreement about whether human history is governed by the same epistemic norms as physics.

  ### 2. Testing the "Bundled Claims" Hypothesis
  **Verdict:** Highly accurate. This is the primary source of the "talking past each other" dynamic.

  You identified three claims bundled under "Narrative." Let's label them and see how the Covering-Law side attacks them.

  1.  **Rhetorical Claim:** Narrative is just the *style* of presentation.
  2.  **Epistemic Claim:** Narrative structure (plot, emplotment) performs the *work* of explanation by connecting events.
  3.  **Ontological Claim:** Historical events do not exist as discrete units prior to their configuration in a story (Louis Mink's "configurational understanding").

  **The Strawman Strategy:**
  Covering-Law proponents (and their heirs in causal modeling) almost always attack **Claim 3** to dismiss **Claim 2**.
  *   **The Move:** They argue, "You can't say the French Revolution didn't exist until a historian wrote about it! That's absurd constructivism."
  *   **The Result:** Having "refuted" the ontological claim, they declare the epistemic claim dead too. They assume that if narrative isn't *ontology*, it must be merely *rhetoric* (Claim 1).
  *   **The Missed Middle:** They ignore Claim 2. William Dray's argument wasn't that stories create reality, but that **principles of action** (rational reconstruction) connect events in a way universal laws cannot. When Hempelians demand the "law" behind a rational action, Dray says the "law" is internal to the agent's reasoning, not an external generalization. By conflating Epistemic Narrative with Ontological Narrative, Covering-Law proponents avoid engaging with the actual explanatory mechanism historians use.

  ### 3. The Hidden Empirical Dispute: "Are There Historical Laws?"
  **Verdict:** This is the only "real" empirical dispute, but both sides are disingenuous about it.

  *   **Hempel's Position:** There *must* be laws, even if unstated. E.g., "Agents act to maximize utility."
  *   **Narrative Position:** Those aren't laws; they are truisms or tautologies. They have no predictive power.
  *   **The Reality:** This is where the debate should have died. Both sides agree that "hard" laws (like gravity) don't exist in history.
      *   Hempel insists on calling trivial generalizations "laws" to save the logic of science.
      *   Narrativists insist on calling them "principles" to save the uniqueness of history.
  *   **Why it persists:** It's a turf war. If Hempel is right, History is a subordinate branch of Sociology/Psychology (the providers of the laws). If Narrativists are right, History is an autonomous discipline with its own logic. The debate is about **disciplinary sovereignty**, not just logic.

  ### 4. The "Dead Debate" Resurfacing (Mechanisms and Causal Models)
  You noted this debate returns as "mechanism-talk." You are correct. The **New Mechanists** (Machamer, Darden, Craver) and **Interventionists** (James Woodward) have effectively dissolved the logical core of the Hempel-Dray fight, but historians haven't fully noticed.

  *   **Woodward's Interventionism:** Explanation isn't about subsumption under laws; it's about answering "what-if-things-had-been-different" questions (counterfactuals).
      *   *Fit with Narrative:* This aligns perfectly with the Narrative strength of handling contrastive questions ("Why 1940 rather than 1939?").
      *   *Fit with Covering-Law:* It retains the rigorous causal structure Hempel wanted, without requiring universal laws.
  *   **Mechanisms:** Historians explain by showing the "cogs and wheels" (the mechanism) that produced the outcome.
      *   This validates the **Epistemic Claim** of Narrative (connecting tissue matters) without requiring the **Ontological Claim** (reality is a story).

  ### Diagnosis: What is the Dispute Actually?

  It is **three disputes wearing one name**:

  1.  **A Verbal Dispute:** About the definition of "Explanation."
      *   Hempel: Explanation = Logical Derivation.
      *   Narrativist: Explanation = Rendering Intelligible.
      *   *Resolution:* We need two words. "Explanation" (causal structure) and "Understanding" (narrative grip).
  2.  **A Dispute about Aims:** Science vs. Humanities.
      *   Hempel wants History to aim at **Prediction/Control** (even if theoretically).
      *   Narrativists want History to aim at **Meaning/Identity**.
      *   *Resolution:* Acknowledge that History serves the latter aim, which doesn't require the former's logical strictures.
  3.  **A Real Empirical/Philosophical Dispute:** The Status of Reasons.
      *   Do reasons cause actions? (Donald Davidson: Yes).
      *   If so, do reasons require laws? (Hempel: Yes. Anscombe/Dray: No).
      *   *Resolution:* This is the only hard knot left. Modern action theory suggests reasons are causes *without* needing strict psychophysical laws. This kills Hempel's model but saves the causal rigor.

  ### What Progress Would Look Like

  You asked for a concession or a distinction that dissolves the thing. Here is the path out:

  **1. Adopt the Contrastive-Causal Model (Woodward/Van Fraassen)**
  Stop asking "Is there a law?" Start asking "What is the contrast class?"
  *   *Old Debate:* "Is 'The French Revolution happened because of class tension' a law?"
  *   *New Standard:* "Does citing class tension allow us to see how the outcome would have differed if class tension were absent?"
  *   This satisfies the Narrativist need for specific, contextual connection and the Covering-Law need for counterfactual rigor.

  **2. Separate Explanation from Understanding**
  Concede that **Explanation** is about getting the causal structure right (which can be modeled, mapped, and tested). Concede that **Understanding** is about the narrative organization of that structure for a human audience.
  *   Covering-Law proponents must concede that a logically valid derivation that no human can follow is a failed *historical* explanation.
  *   Narrativists must concede that a compelling story that gets the causal counterfactuals wrong is fiction, not history.

  **3. Stop Attacking the Ontological Claim**
  Philosophers of history need to stop treating Mink's "configurational understanding" as a claim about *reality* and treat it as a claim about *cognition*. We cannot access the past except through configuration. That isn't constructivism; it's epistemology.

  ### Conclusion
  The debate is a **zombie**. It keeps walking because the underlying tension (Science vs. Humanities) is unresolved, but the *logical* arguments (Hempel's D-N model vs. Dray's Rational Explanation) were exhausted 40 years ago.

  Your suspicion is mostly correct: it is a category error compounded by bundled claims. The Covering-Law side attacks the **Ontological** bundle to kill the **Epistemic** bundle. The Narrative side defends the **Epistemic** bundle by retreating into the **Ontological** bundle (making it sound like they deny reality).

  **Progress looks like this:** Admit that history explains via **local causal mechanisms** (satisfying the need for rigor) organized into **contrastive narratives** (satisfying the need for intelligibility). If someone brings up Covering-Law today, ask them: "Are you talking about counterfactual dependence or logical derivation?" If they say derivation, they're arguing against a strawman. If they say counterfactuals, they're already a narrativist and don't know it.
