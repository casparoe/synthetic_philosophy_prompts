  2.  **Deconstruct the User's Suspicion:**
      *   *Suspicion 1: Different Questions (Plain vs. Contrastive).*
          *   *Covering-Law (Hempel):* Focuses on logical derivation. $C_1, \dots, C_n, L_1, \dots, L_m \vdash E$. It answers "Why was this event necessary/expected?"
          *   *Narrative (Dray/Gallie):* Focuses on intelligibility. "How did we get from A to B?" It often implies "Why B instead of C?"
          *   *Verdict:* This is a strong point. Van Fraassen's later work on *why-questions* supports this. But is it the *whole* story? Hempel would argue that even contrastive questions need laws to be answered rigorously.
      *   *Suspicion 2: Narrative is Three Claims Bundled.*
          1.  *Rhetoric:* Narrative is just how we write (presentation).
          2.  *Epistemology:* Narrative structure *does* the explaining (connecting tissue).
          3.  *Ontology:* Events are constituted by the narrative (Mink's "configurational understanding").
          *   *Verdict:* This is very accurate. Hempel attacks (1) saying "that's just psychology, not logic." Dray defends (2). Mink pushes (3). Covering-Law folks often treat (3) as absurd constructivism and dismiss (2) by reducing it to (1).
      *   *Suspicion 3: It's a Dead Debate Resurfacing.*
