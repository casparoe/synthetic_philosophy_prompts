      *   *Key Distinction:* Hempel is a *logical empiricist*. He wants a logic of explanation. Narrativists are often *hermeneutic*. They want an art of interpretation. These are incompatible frameworks, not just incompatible answers.

  5.  **Finalizing the Structure:**
