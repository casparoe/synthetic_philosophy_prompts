      *   **Section 1: The Question Mismatch (Plain vs. Contrastive).** Validate the user's intuition using Van Fraassen/Dray.
      *   **Section 2: Unbundling "Narrative".** Show how Hempel attacks the Rhetoric claim to dodge the Epistemic claim.
