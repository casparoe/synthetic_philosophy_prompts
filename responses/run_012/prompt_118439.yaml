prompt: |-
  I'm a software engineer who leads a small platform team, and we keep discovering after the fact that a commitment we all treated as a team commitment was really just several people agreeing in the room. Write me a reusable procedure, grounded in the core idea from collective intentionality and joint action that a joint intention is not a sum of individual intentions but requires that each participant intends the group action, that this be common knowledge, and that the participants' subplans mesh. The procedure should be a short ordered checklist I can run in a sprint-planning meeting: the questions to ask, what counts as a sufficient answer to each, where it returns a no, and where it must stop and hand the decision back to the team because the remaining issue is risk tolerance or values rather than whether a shared intention exists. Keep it usable by engineers with no philosophy background, and be explicit about the cases it cannot settle. Then run it on two cases: (1) the team says it will migrate the billing database by the end of the sprint, but the on-call engineer has privately decided not to help with rollback testing; (2) the team says it will stop supporting the legacy API, while two members understand this as freezing new features and one understands it as announcing an end-of-life date. For each case, give the procedure's output, what it leaves to judgment, and the next concrete step. Finally, state the main ways the procedure will misfire or be gamed.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Software engineer leading a small platform team.
      *   **Problem:** "False consensus" – commitments treated as team commitments are actually just individual agreements without true joint intention.
      *   **Theoretical Basis:** Collective Intentionality (Bratman, Searle, Tuomela, etc.). Key concepts: Joint intention (not sum of individual), Common Knowledge, Meshing Subplans.
      *   **Deliverable:** A reusable procedure (short ordered checklist) for sprint planning.
      *   **Requirements:**
          *   Questions to ask.
          *   Criteria for sufficient answers.
          *   Stop conditions (when to hand back to team for risk/values).
          *   Usable by engineers (no jargon).
          *   Explicit about limitations (what it *can't* settle).
          *   Run on two specific cases (Billing DB migration, Legacy API deprecation).
          *   Output for cases: Procedure's output, what's left to judgment, next concrete step.
          *   Failure modes: How it misfires or gets gamed.

  2.  **Deconstruct the Theory (Collective Intentionality):**
      *   *Joint Intention:* "We intend to do X" $\neq$ "I intend to do my part + You intend to do your part." It requires mutual responsiveness.
      *   *Common Knowledge:* Everyone knows X, everyone knows everyone knows X, etc. No private reservations.
      *   *Meshing Subplans:* My plan for doing my part doesn't conflict with your plan for your part. We agree on the *how*, not just the *what*.

  3.  **Drafting the Procedure (The "Joint Commitment Check"):**
      *   *Goal:* Translate philosophy into engineering speak.
      *   *Step 1: The "We" Statement.* Verify the goal is framed collectively.
      *   *Step 2: Common Knowledge (Public Declaration).* Ensure no private opt-outs.
      *   *Step 3: Meshing Subplans (Implementation Details).* Ensure alignment on *how*.
      *   *Step 4: Risk/Values Boundary.* Identify where the procedure stops (it can't force agreement on risk).

      *Drafting Questions:*
      1.  "Who owns the outcome?" (vs. tasks)
      2.  "Does anyone have a blocker they haven't voiced?" (Common Knowledge)
      3.  "Do our ways of working conflict?" (Meshing)
      4.  "Is this a risk we all accept?" (Boundary)

      *Refining for Engineers:* Make it punchy. Use terms like "Blockers," "Definition of Done," "Rollback," "Scope."

      *Defining Stop Conditions:* If the issue is "I don't want to do this" (Values) or "This is too dangerous" (Risk), the checklist passes (intention is clear: we disagree), but the decision goes to the team/lead. The checklist identifies *lack of joint intention*, not *bad ideas*.

  4.  **Developing the Test Cases:**

      *   *Case 1: Billing DB Migration.*
          *   Surface: Team agrees.
          *   Reality: On-call engineer privately opts out of rollback.
          *   Analysis: Fails Common Knowledge. Subplans don't mesh (Migration needs rollback support).
          *   Output: Check fails at Step 2.
          *   Next Step: Force public declaration of responsibilities.

      *   *Case 2: Legacy API.*
          *   Surface: Team agrees to "stop supporting."
          *   Reality: Ambiguous definition (Freeze vs. EOL).
          *   Analysis: Fails Meshing Subplans. Everyone thinks they agree, but their mental models of the action differ.
          *   Output: Check fails at Step 3.
          *   Next Step: Define specific acceptance criteria.

  5.  **Identifying Failure Modes/Gaming:**
      *   *Social Pressure:* People say "yes" to avoid conflict.
      *   *Box-ticking:* Doing it rote without genuine engagement.
      *   *Lead Dominance:* Lead answers for the team.
      *   *Ambiguity Hiding:* Hiding behind vague terms to pass the check.

  6.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the problem and the theory (briefly).
      *   **The Procedure:** The Checklist (The "Joint Commitment Protocol").
      *   **Limitations:** What it doesn't do.
      *   **Case Studies:** Applying the protocol.
      *   **Failure Modes:** Risks of the protocol itself.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Common Knowledge" too philosophical?
      *   *Fix:* Call it "Public Visibility" or "No Silent Reservations." Let's use "Public Visibility & No Silent Opt-outs."
      *   *Critique:* Is "Meshing Subplans" clear?
      *   *Fix:* Call it "Interlocking Workflows."
      *   *Critique:* Make sure the "Stop Condition" is clear. The procedure detects *false consensus*, it doesn't solve *disagreement*.
      *   *Refinement:* Ensure the distinction between "We don't agree" (Procedure stops) and "We agree but it's risky" (Procedure passes, Team decides).

  8.  **Final Polish:** Check tone (professional, pragmatic, engineering-focused). Ensure all constraints of the prompt are met. (e.g., "explicit about cases it cannot settle").

      *(Self-Correction on Case 1)*: The prompt says the on-call engineer *privately* decided. The procedure must expose this. How? By asking specifically about dependencies and rollback responsibilities publicly.
      *(Self-Correction on Case 2)*: This is a definition mismatch. The procedure needs a question about "Definition of Done" or "Success Criteria."

      *Let's finalize the Checklist Steps:*
      1.  Outcome Ownership (We vs. I).
      2.  Public Visibility (Silent reservations).
      3.  Interlocking Plans (Meshing).
      4.  Risk/Values Handoff (The boundary).

      *Let's write it.*
answer: |-
  ### The Joint Commitment Protocol (JCP)

  **Purpose:** To distinguish between a *group of individuals agreeing* and a *team intending joint action*.
  **Theory:** Based on Collective Intentionality. A joint commitment requires: (1) Mutual intention to act as a body, (2) Common knowledge of that intention, and (3) Meshing subplans.
  **Usage:** Run this checklist during Sprint Planning before marking a story as "Committed."

  #### The Checklist

  **1. The "We" Test (Outcome Ownership)**
  *   **Ask:** "If this fails, does every person in this room feel responsible for the outcome, not just their task?"
  *   **Sufficient Answer:** Each member verbally confirms ownership of the *result*, not just their slice of work.
  *   **Fail Condition:** Answers like "I'm just doing the migration script," or "That's the PM's call."
  *   **Action:** **STOP.** Do not commit. Re-scope until everyone owns the outcome.

  **2. The "Silent Opt-Out" Test (Common Knowledge)**
  *   **Ask:** "Does anyone have a known constraint, upcoming absence, or private reservation that prevents them from supporting this goal if needed?"
  *   **Sufficient Answer:** Explicit "No" from every member, or full disclosure of constraints that the group accepts.
  *   **Fail Condition:** Silence, hesitation, or "I think I'm fine" (implies uncertainty).
  *   **Action:** **STOP.** Do not commit. Resolve the constraint publicly.

  **3. The "Handshake" Test (Meshing Subplans)**
  *   **Ask:** "Walk through the handoffs. If Person A is delayed, does Person B's plan break, and do we agree on the contingency?"
  *   **Sufficient Answer:** Specific agreement on dependencies, definitions of done, and rollback procedures.
  *   **Fail Condition:** Vague terms (e.g., "We'll figure it out," "Stop supporting," "Migrate") without shared definitions.
  *   **Action:** **STOP.** Do not commit. Define specific success criteria.

  **4. The Risk Boundary (Handoff Point)**
  *   **Ask:** "Is the remaining disagreement about *facts/plans* (above) or about *risk tolerance/values*?"
  *   **Sufficient Answer:** The team acknowledges the risk is understood and accepted by all.
  *   **Fail Condition:** One person thinks the risk is acceptable, another thinks it is negligent.
  *   **Action:** **HANDOFF.** The JCP cannot solve this. Escalate to Tech Lead/Stakeholder for a values-based decision. The JCP has done its job by revealing the disagreement.

  ---

  ### Limitations: What This Procedure Cannot Settle
  1.  **Competence:** It cannot tell you if the team is *capable* of the work, only if they are *aligned*.
  2.  **Values:** It cannot decide if a risk is "worth it." It only reveals if the risk is shared.
  3.  **Coercion:** It relies on psychological safety. If engineers fear punishment, they will lie on Step 2.
  4.  **External Dependencies:** It cannot fix blockers outside the team's control, only ensure they are known.

  ---

  ### Case Study Applications

  #### Case 1: The Billing Database Migration
  **Scenario:** Team commits to migrate billing DB by sprint end. On-call engineer privately decides not to help with rollback testing.

  **JCP Output:**
  *   **Step 1 (We Test):** **PASS.** Everyone agrees the migration is the goal.
  *   **Step 2 (Silent Opt-Out):** **FAIL.** The on-call engineer has a private reservation (refusal to test rollback). Because this is not voiced, the "Common Knowledge" requirement is violated.
  *   **Step 3 (Handshake):** **FAIL.** The subplans do not mesh. The migration plan assumes rollback support; the engineer's plan excludes it.

  **What is Left to Judgment:**
  *   Whether the migration is technically feasible without that engineer's help (Fact).
  *   Whether it is acceptable for on-call to opt-out of rollback (Value/Policy).

  **Next Concrete Step:**
  *   **Intervention:** The Lead must explicitly ask Step 2: *"Who is owning rollback testing? [Engineer Name], can you confirm you will execute the rollback test if triggered?"*
  *   **Result:** Forces the private reservation into Common Knowledge. The team must then decide to either reassign the task, accept the risk (Step 4), or drop the commitment.

  #### Case 2: The Legacy API Deprecation
  **Scenario:** Team commits to "stop supporting" legacy API. Two members think this means "feature freeze." One member thinks this means "announce EOL date and shut off access."

  **JCP Output:**
  *   **Step 1 (We Test):** **PASS.** Everyone intends to deprecate the API.
  *   **Step 2 (Silent Opt-Out):** **PASS.** No one is hiding constraints.
  *   **Step 3 (Handshake):** **FAIL.** Subplans do not mesh. "Feature freeze" requires maintaining uptime. "Shut off access" requires breaking changes and comms. These are mutually exclusive actions. The term "stop supporting" is ambiguous, violating the Meshing requirement.

  **What is Left to Judgment:**
  *   Which strategy is better for the customers (Strategy).
  *   How much technical debt the company is willing to carry (Risk Tolerance).

  **Next Concrete Step:**
  *   **Intervention:** Halt commitment. Rewrite the ticket title to be specific: *"Implement Feature Freeze"* OR *"Broadcast EOL Notice."*
  *   **Result:** Run Step 3 again on the specific definition. Once the definition is shared, move to Step 4 to agree on the risk of that specific path.

  ---

  ### Failure Modes: How the JCP Misfires or Gets Gamed

  1.  **The "Box-Ticking" Ritual:**
      *   *Mechanism:* The team treats the checklist as bureaucratic overhead. They say "Yes" to all questions to end the meeting quickly.
      *   *Symptom:* Steps are completed in <2 minutes. No actual discussion occurs.
      *   *Mitigation:* The Lead must demand specific evidence for Step 3 (e.g., "Show me the rollback runbook").

  2.  **The "Lead Ventriloquist":**
      *   *Mechanism:* The Lead answers the questions on behalf of the team ("We all know rollback is covered, right?").
      *   *Symptom:* Individual engineers remain silent during the check.
      *   *Mitigation:* Round-robin questioning. Every voice must be heard on Step 2.

  3.  **The "Ambiguity Shield":**
      *   *Mechanism:* Engineers use vague language to pass Step 3 without committing to specifics (e.g., "I'll handle the integration stuff").
      *   *Symptom:* Action items lack owners or deadlines.
      *   *Mitigation:* Enforce "Definition of Done" language. "Handle" is forbidden; "Merge PR #123" is required.

  4.  **The "Psychological Safety" Gap:**
      *   *Mechanism:* An engineer knows the commitment is impossible but fears being labeled "not a team player" if they trigger a Fail on Step 2.
      *   *Symptom:* Consistent over-commitment followed by silent failure.
      *   *Mitigation:* The Lead must explicitly reward "Failing" the check. *"I am glad we caught this now. Good catch."*
