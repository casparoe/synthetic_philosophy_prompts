prompt: |-
  I'm TA-ing the discussion section of a rational choice course and I've got a 90-minute slot to fill, so I'm screening 12 Angry Men and running the discussion around it. I want the reading to be about information cascades and rational herding specifically, not the usual "peer pressure is bad, one brave man stood alone against the mob" thing that every undergrad writes.

  Here's the model I want you to keep in view (just the mechanism, no need to name papers or dates): a line of decision-makers each act in turn, each one has some private signal about the truth, and each sees what the people before them chose but not why they chose it. If the first few choices go the same way, their revealed choices can outweigh any single later person's private information, so a rational Bayesian stops using his own signal and just follows. And once that happens the public record stops getting better, because nobody's private information is entering it anymore. Cascades start on very little, they're fragile (a small new public signal can break one), and the people who start them don't internalize the value of their own information to everybody downstream, which is why there's usually too little early experimentation.

  Now read the film through that lens. Things I want you to hit:

  - The first vote and the secret ballot. As I remember it, Juror 8 is alone on 11-1 guilty, and the thing that actually breaks the logjam is a secret ballot, which surfaces a second not-guilty vote that nobody could have predicted. That looks like exactly the mechanism the model cares about: a simultaneous secret ballot lets private signals come out without a cascade forming, whereas a public sequential vote can't. Say whether that's right, and how much of the first act is really this.
  - The order in which people flip. Who's updating on evidence, who's updating on the tally, and who's just reacting to having been talked to. Is the film's sequence even a cascade in the technical sense, given that in the model nobody ever gives reasons and in the film reasons are the entire content of the deliberation? If what actually changes minds is new public arguement about the knife, the train noise, the old man's walk to the door, the woman's glasses, then is this a cascade story at all, or a different one about deliberation aggregating information in a way the sequential-choice model literally can't represent?
  - Juror 8. The film wants him to be the hero. In the model, somebody who defies a cascade on thin private information is just making an error, and here a costly one (a death sentence). Does the film earn his dissent, or does it cheat by making his hunches turn out right? And notice he doesn't have a rival theory of the case for a long stretch -- he wants to talk, he's holding out on the standard of proof rather than on evidence. Is that a rational strategy, or a kind of reason the model has no room for?
  - Where the film resists the reading. This jury is definately not a set of interchangeable Bayesian agents: one wants to get to a baseball game, one is a bigot, one has a son he can't talk to, one is a facts-and-order stockbroker, one is an immigrant watchmaker taking the civic duty very seriously. Some flips are information, some are fatigue, some are shame, some are one man's private life leaking into a murder case. Cascade theory assumes the motives are all informational. What does the film show about a herd with mixed motives, and does that matter for the practical question of how you break one?
  - The institution. Unanimity, a secret ballot available on request, a hot room you can't leave. The film's implicit claim seems to be that the procedure is what stands between a cascade and a wrongful execution. Is that defensible given the model, or is unanimity also just a way of handing one stubborn man a veto?

  End with what the film adds that the model doesn't have. I don't want a summary of the theory with scenes pasted onto it -- I want both the film and the theory taken seriously, and if the film's picture of how a herd breaks is actually different from the theory's, say so plainly. My students have had one week of Bayes and nothing else, so don't lean on any formal literature, but don't dumb the arguement down either.
reasoning: |-
  Here's a thinking process that leads to the suggested discussion guide:

  1.  **Analyze the Request:**
      *   **Role:** TA for a Rational Choice course discussion section.
      *   **Task:** Create a 90-minute discussion guide/screening plan for *12 Angry Men*.
      *   **Core Theme:** Information Cascades and Rational Herding (specifically the Bikhchandani, Hirshleifer, Welch mechanism: sequential decisions, private signals, public actions, ignoring private info once public weight is high, fragility, negative externalities of early decisions).
      *   **Constraint:** Avoid the standard "peer pressure/heroism" undergrad take. Focus on the *mechanism*.
      *   **Specific Points to Cover:**
          1.  First vote & secret ballot (sequential vs. simultaneous).
          2.  Order of flipping (evidence vs. tally vs. persuasion). Is it a cascade if reasons are given?
          3.  Juror 8's role (Hero vs. Error vs. Standard of Proof strategy).
          4.  Heterogeneity (Mixed motives vs. pure informational motives).
          5.  Institutions (Unanimity, secret ballot, confinement).
          6.  Conclusion: What the film adds that the model lacks.
      *   **Audience:** Undergrads with one week of Bayes. No formal literature citations, but keep the argument rigorous.
      *   **Tone:** Analytical, critical, engaging. Don't dumb it down, but don't get lost in math.

  2.  **Deconstruct the Theory (Mental Check):**
      *   *Cascade Model:* Agents $1, ..., N$. Each gets private signal $S_i$ (High/Low). Each sees public history $H_{i-1}$. Decision $D_i$ is based on $S_i + H_{i-1}$. If $|H_{i-1}|$ is large enough, $S_i$ is ignored. $D_i$ adds no new info to $H_i$. Cascade starts early, is fragile, inefficient (information loss).
      *   *Film Context:* 12 Jurors. Initial vote 11-1 Guilty. Deliberation ensues. Votes change.
      *   *Tension:* The model assumes *no communication of reasons*, only actions. The film is *all about communication of reasons*. This is the critical friction point.

  3.  **Drafting the Discussion Plan - Section by Section:**

      *   **Introduction (10 mins):** Set the stage. Define the cascade mechanism simply. State the goal: Test the movie against the math.
      *   **Segment 1: The First Vote & The Secret Ballot (20 mins):**
          *   *Theory:* Sequential public voting invites cascades. If Juror 1 votes Guilty, Juror 2 sees that + their own signal. If Juror 1-5 vote Guilty, Juror 6 ignores their doubt.
          *   *Film:* The hand raise (sequential/public) goes 11-1. Juror 8 is the outlier.
          *   *The Twist:* Juror 8 calls for a secret ballot. He abstains. Result: 10-1 (Juror 9 flips).
          *   *Analysis:* This *is* the anti-cascade mechanism. It allows private signals to reveal without social cost. It breaks the "public history" weight.
          *   *Discussion Q:* Why did Juror 9 flip only in secret? Was his private signal always "Not Guilty" but suppressed?
      *   **Segment 2: The Mechanism of Flipping (Evidence vs. Herding) (20 mins):**
          *   *Theory:* In a cascade, you flip because the *count* outweighs your signal. You don't need reasons.
          *   *Film:* People flip because of the *knife*, the *limp*, the *glasses*.
          *   *Analysis:* This isn't a pure cascade. It's *deliberation*. The model assumes information is non-transferable (private signals). The film shows information *is* transferable (arguments).
          *   *Nuance:* However, some flips *look* like herding. Juror 5 (projects/slums) flips after Juror 8 talks to him specifically. Juror 2 (meek) flips early. Is it evidence or just social proof?
          *   *Key Insight:* The film argues cascades break via *new public information*, not just re-weighting priors. The model says cascades break via *shocks* to public history.
      *   **Segment 3: Juror 8's Strategy (20 mins):**
          *   *Theory:* Defying a cascade with weak private info is irrational (expected utility loss).
          *   *Film:* Juror 8 admits he doesn't know if the kid is innocent. He doubts the *process*.
          *   *Analysis:* He isn't playing "Guilty vs. Innocent." He's playing "Certainty vs. Reasonable Doubt." He changes the payoff structure.
          *   *Rationality:* Is it rational to incur high cost (time, anger) to test the robustness of the public signal? Yes, if the cost of error (execution) is infinite/high enough. He forces *experimentation* which the model says is under-supplied.
      *   **Segment 4: Heterogeneity & Motives (15 mins):**
          *   *Theory:* Agents are identical Bayesian updaters.
          *   *Film:* Juror 3 (angry father), Juror 10 (bigot), Juror 7 (baseball game).
          *   *Analysis:* Motives matter. Juror 7 flips not because of evidence, but because the *cost* of holding out rose (boredom/time). Juror 3 flips due to emotional breakdown.
          *   *Implication:* Real herds aren't just informational; they're social/psychological. Breaking a herd might require changing *incentives* (boredom) or *emotions*, not just data.
      *   **Segment 5: Institutions (Unanimity & Rules) (5 mins):**
          *   *Theory:* Unanimity gives veto power. Can be efficient (prevents bad cascades) or inefficient (holdouts).
          *   *Film:* Unanimity forced the deliberation. Secret ballot allowed the crack in the armor.
          *   *Analysis:* The institution designed the friction that stopped the cascade.
      *   **Conclusion: Model vs. Film (Final Wrap):**
          *   Model: Passive agents, fixed signals, action-only communication.
          *   Film: Active agents, generated signals, argument-based communication.
          *   Takeaway: The model explains *why* the initial 11-1 happened. The film explains *how* to fix it (institutions + deliberation).

  4.  **Refining the Tone:**
      *   Avoid "The movie shows us..."
      *   Use "Let's test the model against..."
      *   Ensure the distinction between *informational cascades* (rational ignoring of private info) and *normative conformity* (peer pressure) is clear. The prompt specifically asks to avoid the latter, so I must emphasize the *rationality* of the herding in the first act.
      *   Make sure to address the "Secret Ballot" point specifically as a mechanism to reveal private signals.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I focus too much on the emotional arcs?
      *   *Fix:* Pull it back to decision theory. Juror 3's breakdown is a change in utility function, not just "sadness."
      *   *Check:* Is the Bayes level appropriate?
      *   *Fix:* Use terms like "prior," "signal," "posterior," "public history," but don't write out equations.
      *   *Check:* Did I answer the specific prompt about Juror 8's "hunch"?
      *   *Fix:* Frame it as a "signal of low precision but high value of information."

  6.  **Final Polish:** Organize into a clear lesson plan format with time stamps and specific discussion questions. (Proceed to generate output).

  *(Self-Correction Note: The prompt asks me to "read the film through that lens" and "End with what the film adds." It implies I should write the *content* for the TA to use, essentially a guide or a lecture note structure, rather than just a list of questions. I will structure it as a TA Guide with talking points and analysis.)*

  *(Wait, looking closer at the prompt: "I want you to hit... Say whether that's right... End with what the film adds." It asks me to perform the analysis *for* the TA, likely to be used as lecture notes or a handout. I will write it as a structured analytical guide that the TA can speak from or distribute.)*

  *(Decision: I will structure this as a "TA Discussion Guide" that provides the analytical backbone for the 90 minutes. It will address each bullet point directly with the rigorous analysis requested.)*

  *(Re-evaluating the "Secret Ballot" point: In the film, the first vote is a show of hands (public/sequential-ish). Juror 8 proposes a secret ballot where he abstains. The result is 10-1. This reveals Juror 9's vote. This is crucial. It converts a public action game into a simultaneous revelation game.)*

  *(Re-evaluating Juror 8: He doesn't claim innocence. He claims doubt. This changes the decision rule from "Which is more likely?" to "Is guilt certain beyond reasonable doubt?" This is a threshold change, not just a signal update.)*

  *(Okay, ready to write.)*
answer: |-
  # TA Discussion Guide: *12 Angry Men* and Information Cascades
  **Course:** Rational Choice | **Time:** 90 Minutes | **Topic:** Information Cascades vs. Deliberation

  ## Introduction: The Mechanism (10 Minutes)
  **Goal:** Establish the baseline model so students don't default to "peer pressure."

  Start by writing the cascade mechanism on the board. Keep it stark:
  1.  **Sequential Action:** Agents decide one after another.
  2.  **Private Signal:** Each agent has their own information ($S_i$).
  3.  **Public History:** Each agent sees previous decisions ($D_1, D_2...$), but *not* the reasons or signals behind them.
  4.  **The Trap:** If the public history gets heavy enough (e.g., 5 "Guilty" votes in a row), a rational Bayesian ignores their own private signal. Their decision adds no new information to the pool.
  5.  **The Result:** The group stops learning. The herd moves on thin ice. A cascade can start on two or three early signals and become self-sustaining even if later signals contradict it.

  **The Hook:** Tell the class: "The standard reading of this film is 'one hero against the mob.' The rational choice reading is 'one agent introducing friction into a broken information aggregation mechanism.' Today we are testing whether the film depicts a cascade, and whether the film's solution matches the model's predictions."

  ---

  ## 1. The First Vote and the Secret Ballot (20 Minutes)
  **Prompt:** *The first vote is 11-1 Guilty via show of hands. Juror 8 calls a secret ballot. A second Not Guilty vote appears. Is this the anti-cascade mechanism?*

  **Analysis for Discussion:**
  *   **The Setup:** The initial show of hands is effectively sequential/public. Even if done quickly, Jurors see hands going up. If you are Juror 6, and you see 5 hands up before you, your private doubt is rationally outweighed by the public history. Voting "Guilty" is the Bayesian best response, even if you aren't sure. This is the cascade forming.
  *   **The Intervention:** Juror 8 proposes a secret ballot where he abstains.
  *   **Why it Works:** This changes the game from **Sequential Public Choice** to **Simultaneous Private Revelation**.
      *   In the model, cascades form because agents want to avoid the reputational or decision cost of deviating from the public record.
      *   The secret ballot removes the "public history" constraint for that specific vote. It allows Juror 9 (the old man) to reveal his private signal without paying the social cost of being the second dissenter.
  *   **Verdict:** Yes, this is exactly the mechanism. The secret ballot forces the private signals to surface before they are contaminated by the public tally. It breaks the "weight" of the 11-1 history.
  *   **Discussion Question:** "If Juror 8 hadn't called for the secret ballot, would Juror 9 ever have flipped? In the model, once a cascade starts, later signals are ignored. Does the film confirm that the *only* way to break the initial herd was to hide the actions?"

  ## 2. Evidence vs. Tally: Is this actually a Cascade? (20 Minutes)
  **Prompt:** *In the model, agents don't talk. In the film, they argue about the knife, the train, the glasses. Is this a cascade story or a deliberation story?*

  **Analysis for Discussion:**
  *   **The Tension:** The standard cascade model assumes information is *non-transferable*. I have my signal, you have yours, we only see actions. If we can *talk*, we can share signals. If we share signals, we shouldn't have a cascade; we should have efficient information aggregation.
  *   **The Film's Reality:** The film shows that *talking* is hard.
      *   **Early Flips (Jurors 2 & 5):** These look like cascade behavior. They are meek, unsure, and flip relatively early after Juror 8 applies light pressure. They are updating on the fact that *someone else* doubts, not necessarily on new hard evidence yet.
      *   **Later Flips (Jurors 4, 10, 3):** These flips are driven by specific evidence (the nose marks on the witness, the timing of the train).
  *   **Theoretical Implication:** The film suggests that cascades persist not just because signals are hidden, but because **processing costs** are high. It is easier to follow the herd than to analyze the knife evidence. Juror 8 lowers the processing cost by laying out the arguments.
  *   **Verdict:** The film starts as a cascade (11-1 vote) but transitions into a **deliberation model**. The cascade broke *because* they started communicating reasons, which the basic model forbids.
  *   **Discussion Question:** "In the model, a cascade breaks if a new public signal is strong enough. In the film, does the evidence change, or does the *interpretation* of the evidence change? If the facts stay the same but the conclusion flips, is that rational updating or social persuasion?"

  ## 3. Juror 8: Hero or Rational Deviator? (20 Minutes)
  **Prompt:** *Juror 8 admits he doesn't know if the boy is innocent. He just wants to talk. Is this rational?*

  **Analysis for Discussion:**
  *   **The Model's View:** If Juror 8's private signal is weak (he admits he has no proof), defying a strong public cascade (11-1) is irrational. He is imposing a high cost (time, anger, risk of wrongful conviction if he's wrong) on the group based on a low-precision signal.
  *   **The Film's Defense:** Juror 8 changes the **Payoff Structure**.
      *   The group is playing "Find the Truth." Juror 8 forces them to play "Avoid Type I Error (Executing Innocent)."
      *   In Rational Choice terms, he is highlighting the **asymmetry of errors**. A False Positive (execution) is infinitely costlier than a False Negative (acquittal).
      *   Therefore, even a weak private signal justifies a "Not Guilty" vote if the threshold for conviction is "Beyond Reasonable Doubt." He isn't voting "Innocent"; he is voting "Insufficient Information."
  *   **The Strategy of Experimentation:** The model says early agents under-experiment because they don't internalize the value of their information to downstream agents. Juror 8 internalizes this perfectly. He knows his vote has **option value**. By holding out, he creates the opportunity for new information (the knife, the witness) to be generated.
  *   **Verdict:** He is rational if you view his goal as *testing the robustness of the public signal* rather than *declaring the truth*. He forces the group to pay the cost of deliberation to avoid the cost of error.
  *   **Discussion Question:** "Juror 8 says, 'It's possible.' He isn't arguing probability; he's arguing possibility. Does shifting the decision rule from 'More Likely Than Not' to 'Is Doubt Possible' justify ignoring the Bayesian weight of the 11-1 vote?"

  ## 4. Heterogeneity: Mixed Motives vs. Bayesian Agents (15 Minutes)
  **Prompt:** *The model assumes identical agents. The film gives us a bigot, a father, a stockbroker, a man wanting to go to a baseball game. Does this matter?*

  **Analysis for Discussion:**
  *   **The Model's Assumption:** Agents care only about accuracy (matching the truth).
  *   **The Film's Reality:** Agents have different **Utility Functions**.
      *   **Juror 7 (Baseball):** His cost of deliberation is high. He flips to "Not Guilty" not because his posterior probability of guilt changed, but because his *cost of staying* exceeded his *cost of being wrong*. This is **rational herding for convenience**, not information.
      *   **Juror 3 (The Father):** His signal is corrupted by private history. He is not updating on the case; he is updating on his relationship with his son.
      *   **Juror 10 (The Bigot):** His prior is fixed. No amount of evidence updates him until social pressure (the group turning away) makes his position too costly.
  *   **Implication for Herds:** Real-world cascades aren't just informational; they are **incentive-compatible**. People join the herd because it's cheap, safe, or fast.
  *   **Breaking the Herd:** You can't just show data to Juror 7; you have to wait him out or make the "Guilty" vote take too long. You can't show data to Juror 10; you have to isolate him socially.
  *   **Verdict:** The film shows that breaking a herd requires addressing *heterogeneous constraints*, not just information asymmetry.
  *   **Discussion Question:** "Juror 7 flips right after the secret ballot, but before the big evidence reveals. Is his flip 'noise' in the system, or does it provide the critical mass needed for the evidence-based voters to feel safe flipping?"

  ## 5. The Institution: Unanimity and Confinement (5 Minutes)
  **Prompt:** *Is the procedure what stands between a cascade and an execution?*

  **Analysis for Discussion:**
  *   **Unanimity as a Veto:** In the model, unanimity gives the last agent veto power. This prevents the cascade from closing prematurely. It forces the "public history" to account for every single private signal.
  *   **Confinement:** The hot room increases the cost of *not* deliberating. If they could leave and come back, the cascade might have solidified. The institution forces the cost of disagreement to be lower than the cost of leaving without agreement.
  *   **The Secret Ballot Rule:** The fact that *any* juror can call a secret ballot is a "circuit breaker" institution. It allows the system to reset the public history.
  *   **Verdict:** Defensible. The model shows why decentralized sequential voting fails. The film shows that institutional friction (unanimity + secret ballot options) is required to force the information aggregation to complete.

  ---

  ## Conclusion: What the Film Adds (Final Wrap-Up)
  **Goal:** Synthesize the gap between the math and the movie.

  **The Model's Limit:** The cascade model is static. Signals are fixed. Agents are passive updaters. Communication is limited to actions. In this world, once a cascade starts, it is very hard to stop without an external shock.

  **The Film's Contribution:**
  1.  **Endogenous Information:** In the film, information isn't just found; it's *created* through argument. Juror 8 doesn't just reveal a signal; he prompts Juror 3 to re-enact the walk, which *generates* a new signal (the timing). The model doesn't account for deliberation that *produces* new data.
  2.  **Social Cost as a Variable:** The model assumes the cost of deviating is fixed. The film shows that social costs change. As the herd thins (11-1 becomes 6-6), the cost of being in the minority drops. The cascade breaks because the **social equilibrium shifts**, not just because the evidence piled up.
  3.  **The "Reasonable Doubt" Threshold:** The model optimizes for accuracy. The legal system optimizes for error type. The film shows that rational herding is dangerous specifically when the cost of false positives is high.

  **Final Takeaway for Students:**
  "The model explains why the vote was 11-1 Guilty at the start (rational herding on thin public info). The film explains how to fix it (institutions that force signal revelation and deliberation that generates new info). Don't walk away thinking Juror 8 was just 'brave.' Walk away thinking he was a mechanism design expert who knew how to manipulate the voting rules to restore information flow."

  ---

  ## TA Cheat Sheet: Managing the "Peer Pressure" Trap
  *If a student says:* "Juror 10 is just a bully and everyone is scared of him."
  *Pivot to:* "Fear is a cost. In the model, if the cost of voting 'Not Guilty' is high (social ostracization), rationally you vote 'Guilty' even if your signal says innocent. That *is* a rational cascade, not just 'peer pressure.' How does Juror 8 lower that cost?"

  *If a student says:* "Juror 8 knew the kid was innocent."
  *Correct:* "No, he explicitly says he doesn't. He is betting on the *process*, not the *outcome*. He is forcing the group to check their signals."

  *If a student says:* "They changed their minds because they saw the evidence."
  *Push:* "Why didn't they look at the evidence in the first hour? Because the 11-1 vote signaled that looking was unnecessary. That is the cascade. The evidence was always there; the *incentive to process it* was missing."
