      *(Refining the 1 vs 4 tension)*: If FP is indispensable, Churchland argues it's because we lack the better theory, not because FP is true. So 1 and 4 *can* coexist if the user argues "Indispensable due to cognitive poverty, not truth." I should point this out as a defense, but note the risk.

      *(Refining the 1 vs 3 tension)*: This is the "Qualia vs. Intentionality" split. Eliminative Materialists usually kill both. If you keep qualia, you invite the dualist to ask "Why is *this* immune to elimination?" Need to ensure the physicalist story for pain is stronger than for belief.

      *(Final Polish)*: Ensure the distinction between "Eliminativism" and "Instrumentalism" is clear. The user claims Eliminativism but acts like an Instrumentalist in Claim 4.

