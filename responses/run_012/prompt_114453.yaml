answer: |-
  This is a sharp read of the field. The social choice literature is obsessed with *impossibility* (proving you can't have everything), while your goal is *feasibility* (how to run a meeting without burning the building down). With ~150–200 person-hours total (4 people × 50 weeks × 1 day), you cannot run longitudinal field experiments or derive new theorems. You must build tools, run simulations, or synthesize design patterns.

  Here is a ranked research agenda tailored to that constraint, weighted by upstream leverage, tractability for non-specialists, and neglectedness.

  ### 1. The "Probability Dissolution" Protocol
  **Question:** Does aggregating probabilistic credences ($P(p)$, $P(q)$) and thresholding *after* aggregation resolve the doctrinal paradox in practice without introducing new pathologies?

  *   **Why Upstream:** The Discursive Dilemma is an artifact of binary logic ($1$ or $0$). If you aggregate probabilities (e.g., linear opinion pool) and only apply the decision rule at the very end, the logical inconsistency often vanishes. This bypasses the impossibility theorems entirely. If this works, it renders the PBP vs. CBP debate obsolete for many use cases.
  *   **Tractability (High):** You don't need human subjects. You can simulate "judges" with assigned error rates and correlation structures in Python/R. You can test different thresholding rules (e.g., threshold the conjunction vs. threshold the premises) against a "ground truth" simulation.
  *   **Neglectedness (High):** Judgment Aggregation (JA) theorists love binary logic because it's clean. Forecast aggregators (like Good Judgment Project) ignore logical consistency constraints. The intersection is empty.
  *   **Impact:** If you produce a simple "calculator" or heuristic showing that "asking for 60% confidence on premises yields better outcomes than Yes/No voting," that is an immediate tool for boards and juries.

  ### 2. Multi-Agent LLM Ensembles as Judgment Aggregators
  **Question:** Do LLM ensembles exhibit the Discursive Dilemma, and does their specific error correlation structure (training data overlap) break standard aggregation theorems?

  *   **Why Upstream:** We are moving toward AI-augmented decision-making. If an organization uses 5 LLM agents to vet a policy, they are a "committee." If the models share a training base, their errors are *positively correlated*, violating the Condorcet Jury Theorem's independence assumption. This might make the paradox *more* likely, or it might make the "premise-based" approach fail because the models reason similarly.
  *   **Tractability (Medium):** Requires API scripting skills. You can spin up 5 instances of a model, prompt them for premises and conclusions, and check for consistency. It fits the "1 day/week" model perfectly (run experiments overnight, analyze next day).
  *   **Neglectedness (Very High):** Everyone is testing LLMs on benchmarks; almost no one is testing them on *social choice axioms*.
  *   **Impact:** High. If you find that "LLM ensembles require premise-based aggregation to avoid hallucinated consistency," that is a design spec for every AI wrapper built next year.

  ### 3. Agenda Power and Question Framing (The "Chair's Toolkit")
  **Question:** How much of the paradox is actually solvable by changing *which* propositions are voted on, rather than *how* they are aggregated?

  *   **Why Upstream:** The paradox requires a specific logical structure ($p, q, p \land q$). In real committees, the Chair decides if the vote is on "Hire Candidate" (Conclusion) or "Is Candidate Skilled? + Is Candidate Culturally Fit?" (Premises). This is often treated as a fixed constraint in theory, but it's a design variable in practice.
  *   **Tractability (High):** This is literature synthesis + lightweight case studies. You can analyze public minutes (boards, city councils) to see where agenda framing prevented or caused inconsistency. You can produce a checklist for Chairs.
  *   **Neglectedness (Medium):** Political science studies agenda power descriptively (who wins), but normative theory rarely gives *advice* to the agenda-setter on how to avoid logical traps.
  *   **Impact:** Moderate. It helps existing groups, but doesn't change the underlying math.

  ### 4. Escape Hatches: Single-Peakedness as Design
  **Question:** Can we structure discussion to force preferences into a single-peaked domain, and is the cost of doing so worth the benefit?

  *   **Why Upstream:** Theoretically, if preferences are single-peaked, majority rule is consistent.
  *   **Tractability (Low):** This is the **Dead End**. Single-peakedness requires a one-dimensional ideological spectrum. Real-world doctrinal paradoxes happen on multi-dimensional issues (e.g., Legal Liability = Duty + Breach). You cannot "design" a discussion to make complex logical conjunctions one-dimensional without authoritarianism.
  *   **Neglectedness (Low):** Theorists know this.
  *   **Impact:** Low. Trying to force human preferences to fit the math is usually harder than changing the math to fit humans.

  ---

  ### Meta-Analysis: Shifts and Dead Ends

  **What moves items up the list in 1–2 years?**
  *   **AI Integration:** If organizations start using LLMs for decision support (Item 2), that jumps to #1. The correlation of errors in AI is a much more pressing version of the "correlated voter" problem than human voters.
  *   **Polarization:** As groups become more polarized, the "Agenda Power" (Item 3) becomes more critical. If you can't trust the voters, you must trust the process design.

  **What moves items down?**
  *   **Probabilistic Friction:** If you find that humans are terrible at giving calibrated probabilities (Item 1), and the noise introduced by bad calibration is worse than the logical inconsistency of binary voting, drop it. (My bet: Humans are bad, but *averaged* human probabilities are robust).

  **Which answer probably wouldn't change much downstream? (The Dead Ends)**
  *   **Single-Peakedness (Item 4).** Don't touch this. It's a mathematical convenience, not a psychological reality.
  *   **Proving new impossibility theorems.** The literature is saturated. We know it's hard. We need to know how to do it anyway.
  *   **PBP vs. CBP normative superiority.** The literature has chewed this to bits. PBP is logically consistent but unresponsive; CBP is responsive but inconsistent. The answer isn't "which is better," it's "under what conditions do we switch?" That is a subset of Item 3 (Agenda/Process).

  ### Recommended Allocation of the 200 Hours

  1.  **Months 1–3 (Simulation):** Build the Probability vs. Binary simulator (Item 1). Test how much "logical consistency" you lose by switching to probabilities, and how much "accuracy" you gain.
  2.  **Months 4–6 (LLM Experiments):** Run the LLM ensemble tests (Item 2). Prompt for premises, prompt for conclusions, check for contradictions across different temperature settings and model families.
  3.  **Months 7–9 (Synthesis):** Draft the "Chair's Toolkit" (Item 3) based on findings from 1 & 2. When should a Chair demand premise voting? When should they allow probability estimates?
  4.  **Months 10–12 (Output):** Publish a practical guide or open-source tool, not a paper.

  **Final Advice:** The literature assumes the goal is *consistency*. Real groups care about *legitimacy* and *accuracy*. If you can show that a "logically inconsistent" procedure yields higher accuracy (via probability aggregation) or higher legitimacy (via agenda design), you win. Don't try to solve the paradox; try to make it irrelevant.
