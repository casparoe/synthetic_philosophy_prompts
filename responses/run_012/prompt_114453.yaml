prompt: |-
  So I've been poking at the discursive dilemma / doctrinal paradox for a while now — you know the setup, you let a group majority-vote on each premise and on the conclusion seperately, and you can end up with a majority for p, a majority for q, and a majority against "p and q" — and I keep feeling like the interesting questions arn't anywhere near where the literature's attention is.

  If I had three or four people for a year, each maybe a day a week, and the goal was to make collective judgment procedures actually work better in real groups rather than to prove more theorems, where should they go? I want a ranked agenda with the reasoning, not a survey: for each question, why it's upstream of the others, how tractable it is for people who are smart but not social-choice PhDs, and how neglected it is relative to how much it'd matter.

  Things I'd want you to weigh, and feel free to tell me some of these are dead ends: the escape hatches that look like single-peakedness in disguise — does any of that actually turn into design advice for a real committee?; who gets to set the agenda, and how much of the impossibility literature is secretly about agenda power; premise-based vs conclusion-based procedures and who each one advantages; whether aggregating probabilistic forecasts and aggregating yes/no judgments are the same problem or two different ones; and the one I think is weirdly underexplored — multi-agent LLM setups where an ensemble or a debate is supposed to "decide" something. That's a group making judgments under an aggregation rule, the errors are correlated in exactly the way the theorems assume away, and as far as I can tell nobody's applying any of this.

  Also, what would move things up or down your list over the next year or two, and which of these is the kind where getting the answer probably wouldn't change much downstream anyway?
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Discursive Dilemma / Doctrinal Paradox (DD/DP).
      *   **Goal:** Make collective judgment procedures work *better in real groups*, not prove more theorems.
      *   **Resources:** 3-4 people, 1 year, ~1 day/week each (approx. 150-200 person-hours total). This is a "small grant" or "skunkworks" level of effort, not a full research institute.
      *   **Output:** A *ranked agenda* with reasoning (upstreamness, tractability for non-PhDs, neglectedness/impact).
      *   **Specific Topics to Weigh:**
          *   Escape hatches (single-peakedness) $\rightarrow$ design advice?
          *   Agenda power (who sets the questions).
          *   Premise-based (PBP) vs. Conclusion-based (CBP) procedures.
          *   Probabilistic forecasts vs. Yes/No judgments.
          *   Multi-agent LLM setups (ensemble/debate).
      *   **Meta-Questions:** What moves items up/down in 1-2 years? Which answers wouldn't change much downstream (dead ends)?

  2.  **Initial Assessment of the Field:**
      *   *Social Choice Theory* is notoriously abstract. Arrow, List, Pettit, etc., have established impossibility theorems.
      *   *The User's Intuition:* The literature focuses on impossibility proofs, but real groups *do* make decisions. The gap is between "it's impossible to satisfy axioms X, Y, Z" and "how do we actually run a meeting so we don't shoot ourselves in the foot?"
      *   *Constraint:* 1 day/week per person is very little time. This rules out heavy empirical field studies (IRB, recruitment, longitudinal) or heavy mathematical derivation. It favors simulation, literature synthesis + translation, lightweight experiments, or tool-building.

  3.  **Evaluating the Specific Topics:**

      *   **Escape Hatches (Single-Peakedness):**
          *   *Theory:* If preferences are structured, impossibility vanishes.
          *   *Practice:* Can we *engineer* structured preferences? Or is this just "pick the right ideology"?
          *   *Verdict:* High theory, low practical design advice for general committees. Likely a dead end for *this* specific constraint.
      *   **Agenda Power:**
          *   *Theory:* Controlling the order of voting controls the outcome.
          *   *Practice:* This is huge. Real-world politics is all about agenda setting.
          *   *Verdict:* High impact, highly neglected in the *normative* sense (usually studied descriptively). Very tractable for smart non-PhDs (logic + case studies).
      *   **PBP vs. CBP:**
          *   *Theory:* PBP preserves consistency, CBP preserves responsiveness.
          *   *Practice:* This is the core of the DD. But the literature is exhausted.
          *   *Verdict:* Important, but maybe too theoretical. Needs a practical twist (e.g., software implementation).
      *   **Probabilistic vs. Yes/No:**
          *   *Theory:* Judgment Aggregation (JA) vs. Forecast Aggregation.
          *   *Practice:* Forecasts allow for nuance (Bayesian updating). Yes/No forces the paradox.
          *   *Verdict:* High potential. Moving to probabilities might dissolve the paradox rather than solve it. Very tractable.
      *   **Multi-agent LLMs:**
          *   *Theory:* LLMs are agents. They hallucinate (correlated error?).
          *   *Practice:* New field. Nobody is applying JA theory to LLM ensembles yet.
          *   *Verdict:* High novelty, high risk. Might be too technical for the "1 day/week" constraint if they aren't coders, but if they are, it's a goldmine.

  4.  **Developing the Ranked Agenda:**

      *   *Constraint Check:* 150-200 hours total.
      *   *Priority 1: The "Dissolution" Strategy (Probabilities).* If we can show that moving to probabilities avoids the paradox without losing decision-quality, that's a massive practical win. It bypasses the impossibility theorems.
      *   *Priority 2: The "Process" Strategy (Agenda & PBP/CBP).* Translating theory into checklists for chairs/moderators.
      *   *Priority 3: The "New Agent" Strategy (LLMs).* High risk/high reward.
      *   *Priority 4: The "Structure" Strategy (Single-Peakedness).* Likely dead end for practical design.

  5.  **Drafting the Arguments (Iterative Refinement):**

      *   *Item 1 (Probabilities):* Why upstream? Because if judgments are $P(p)$ and $P(q)$, the conjunction fallacy is a cognitive error, not a logical paradox of aggregation. We can aggregate probabilities (linear opinion pool) and threshold later. *Tractability:* High (simulations). *Neglectedness:* High (JA folks stick to binary).
      *   *Item 2 (Agenda/Procedure):* Why upstream? Because the paradox often arises from *how* the question is asked. *Tractability:* High (interviews + synthesis). *Neglectedness:* Medium (political science knows it, normative theory ignores it).
      *   *Item 3 (LLMs):* Why upstream? Because future "groups" might be synthetic. *Tractability:* Medium (need API skills). *Neglectedness:* Very High.
      *   *Item 4 (Single-Peakedness):* Why low? Because you can't force humans to have single-peaked preferences on complex issues without authoritarianism. *Dead End:* Yes, for design.

  6.  **Addressing the Meta-Questions:**
      *   *What moves things up?* AI adoption (LLMs), polarization (makes agenda power more critical).
      *   *What moves things down?* If probabilistic aggregation proves unstable in practice.
      *   *Dead Ends:* Proving more impossibility theorems. Trying to force single-peakedness.

  7.  **Refining the Tone:**
      *   The user is sophisticated ("poking at," "upstream," "neglectedness").
      *   Avoid academic fluff. Be direct, strategic, and slightly opinionated.
      *   Acknowledge the resource constraint (1 day/week is tight).

  8.  **Final Review against User Prompts:**
      *   Ranked agenda? Yes.
      *   Reasoning (upstream, tractable, neglected)? Yes.
      *   Weighed specific topics? Yes.
      *   Meta-analysis (1-2 years, dead ends)? Yes.

