prompt: |-
  I'm a PhD student in political theory and the appointed academic member of the campaign-finance oversight board in the mid-sized city where I'm writing my dissertation. At next month's meeting the board has to rule on a complaint that will fix our rules for years: in the six weeks before a referendum on a downtown rezoning, a committee called Neighbors for a Livable Downtown spent roughly $180,000 on mailers and targeted digital ads that never use the words "vote no" or "defeat" but name the rezoning and say it will raise taxes and hand the waterfront to a single developer. Nearly all of the money came from three donors, one of whom owns commercial property that would compete with the proposed development, and the committee paid a registered lobbying firm to run the campaign — the same firm whose principals lobby the council on the rezoning. Our ordinance caps contributions to ballot committees at $500 per person and requires donor disclosure, but exempts issue advocacy, and it directs the board to adopt a rule covering communications that are campaign advocacy in substance even when they avoid explicit electoral language.

  Please draft the written opinion I'll circulate before the vote. It should give a clear recommendation — dismiss the complaint, order disclosure only, or treat the spending as a contribution subject to the cap, with a remedy — and should state the test the board should adopt for distinguishing campaign advocacy from issue advocacy precisely enough that staff can apply it to the next complaint. It should engage the strongest objection to whatever course you recommend: that the only interest our city can legitimately invoke is preventing quid pro quo corruption, that ballot-measure spending involves no candidate to corrupt, and that any rule broad enough to reach these mailers will also reach genuine advocacy and chill it. Our staff report adds a further worry worth addressing: cap this spending and the money likely reappears in a nonprofit vehicle that discloses nothing, so an unenforceable rule may be worse than none. Take a position; don't hand the board a menu.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** PhD student in political theory & appointed academic member of a campaign-finance oversight board.
      *   **Task:** Draft a written opinion to circulate before a vote on a specific complaint.
      *   **Context:** Mid-sized city, referendum on downtown rezoning.
      *   **The Complaint:** "Neighbors for a Livable Downtown" spent $180k (mostly from 3 donors, one a competitor) on mailers/ads 6 weeks before the vote. They avoided "vote no" magic words but named the rezoning and claimed negative outcomes (taxes, developer handout). They hired a lobbying firm that also lobbies the council on the same issue.
      *   **Legal Framework:** Ordinance caps contributions to *ballot committees* at $500/person, requires disclosure. *Exempts issue advocacy*. Directs board to adopt a rule for communications that are campaign advocacy in *substance* even without explicit electoral language.
      *   **Requirements:**
          *   Clear recommendation (Dismiss, Disclosure Only, or Treat as Contribution/Cap).
          *   Precise test for distinguishing campaign vs. issue advocacy.
          *   Engage strongest objection (First Amendment/Chilling Effect/Corruption Interest).
          *   Address staff worry (Money shifting to dark nonprofits if capped).
          *   Take a position (No menu).
      *   **Tone:** Academic rigor (political theory background) but practical legal/administrative applicability.

  2.  **Determine the Recommendation:**
      *   *Option 1: Dismiss.* Weakens the ordinance's "substance over form" directive. Ignores the clear intent to influence the vote.
      *   *Option 2: Disclosure Only.* Acknowledges the influence but sidesteps the contribution cap. Doesn't solve the "three donors" inequality issue.
      *   *Option 3: Treat as Contribution/Cap.* Enforces the ordinance's intent. Addresses the "competitor donor" corruption risk (even if not *quid pro quo* in the candidate sense).
      *   *Decision:* **Treat as Campaign Advocacy (Subject to Cap/Disclosure).** Why? The ordinance explicitly directs the board to look at substance. The timing (6 weeks pre-election), the specificity (named referendum), and the funding (interested parties) scream electioneering. To do otherwise renders the ordinance toothless.
      *   *Remedy:* Since the money is already spent, we can't un-spend it. The remedy should be prospective enforcement + penalty/fine for the violation, and treating the excess over $500 as an in-kind contribution violation. However, the prompt asks for a rule for *future* application primarily, while ruling on *this* complaint. I need to rule on the complaint *and* set the test.
      *   *Refinement:* The prompt asks to "rule on a complaint that will fix our rules for years." I need to find them in violation but craft the test so it survives the "chilling effect" critique.

  3.  **Drafting the Test (The "Magic Words" Plus Standard):**
      *   Supreme Court precedent (*Buckley*, *McConnell*, *Citizens United*) distinguishes express advocacy ("vote for") from issue advocacy.
      *   The city ordinance *requires* looking at substance.
      *   *Proposed Test:* "Functional Equivalency Test" (borrowed from *Wisconsin Right to Life* but adapted for local ballot measures).
      *   *Criteria:*
          1.  **Timing:** Proximity to the election (e.g., within 60 days).
          2.  **Targeting:** Is the audience the electorate?
          3.  **Content:** Does it identify a specific measure and take a clear position on its outcome, even without imperative verbs?
          4.  **Context:** Is there no plausible non-electoral explanation for the spending?

  4.  **Addressing the Objections (Political Theory Angle):**
      *   *Objection 1: Corruption Interest.* Ballot measures don't take bribes. *Counter:* The interest isn't just *quid pro quo* corruption; it's the integrity of the process and preventing undue influence by concentrated wealth (distortion). Also, the donor is a *competitor*, raising conflict of interest/economic self-dealing concerns distinct from candidate corruption.
      *   *Objection 2: Chilling Effect/Overbreadth.* *Counter:* The test must be narrow. It only applies when there is *no* reasonable interpretation other than influencing the vote. Genuine issue education happens year-round, not just 6 weeks before a vote.
      *   *Objection 3: Staff Worry (Dark Money).* If we cap, they go 501(c)(4). *Counter:* True, but surrendering enforcement guarantees darkness. Enforcement creates a hurdle. Also, our ordinance requires disclosure for ballot committees; if they shift to a nonprofit that doesn't disclose, we can't regulate that *unless* they engage in electioneering. Better to enforce the law we have than speculate on evasion. Transparency is the first line of defense.

  5.  **Structuring the Opinion:**
      *   **Header:** Standard Board Memorandum format.
      *   **Introduction:** State the issue and the recommendation immediately.
      *   **Factual Background:** Briefly summarize the spending.
      *   **Legal Standard:** Interpret the ordinance's "substance over form" directive.
      *   **The Test:** Define the "Functional Equivalency" standard clearly.
      *   **Application:** Apply the test to the current complaint.
      *   **Addressing Objections:**
          *   Constitutional/Philosophical (Corruption/Chilling).
          *   Practical (Staff's Dark Money concern).
      *   **Conclusion:** Final ruling and remedy.

  6.  **Refining the Tone:**
      *   Needs to sound like a PhD student in political theory (conceptual clarity, normative stakes) but also a board member (actionable, rule-bound).
      *   Avoid overly dense jargon but show depth of thought regarding democracy and money.
      *   Be decisive.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "competitor" aspect? *Yes, important for the corruption/equity argument.*
      *   *Check:* Did I address the lobbying firm overlap? *Yes, shows coordination/intent.*
      *   *Check:* Is the remedy feasible? *Can't un-spend money. So, find violation, impose fine, order future compliance.*
      *   *Check:* Did I answer the "menu" constraint? *Yes, taking a firm stance.*
      *   *Check:* Is the test precise enough for staff? *Need to make sure the factors are objective.*

  8.  **Final Polish:** Ensure the distinction between "issue advocacy" (educating on policy) and "campaign advocacy" (securing a vote outcome) is sharp. Emphasize that the ordinance *demands* this distinction be based on substance.

  *(Self-Correction on the Remedy)*: If I rule the spending was a campaign contribution, the donors gave >$500. That's a violation. The committee accepted illegal contributions. The remedy should be: 1. Find violation. 2. Fine based on the excess amount. 3. Adopt the test for future cases.
  *(Self-Correction on the "Dark Money" point)*: I need to be careful not to promise that capping stops dark money. I need to argue that *not* capping legitimizes the loophole.

  9.  **Finalizing the Text:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Campaign Finance Oversight Board
  **FROM:** [Your Name], Academic Member
  **DATE:** October 24, 2023
  **RE:** Complaint Regarding *Neighbors for a Livable Downtown* (NL D); Proposal for Functional Equivalency Test

  ### I. Recommendation

  I recommend that the Board **sustain the complaint** and rule that the $180,000 in expenditures by *Neighbors for a Livable Downtown* (NLD) constitutes campaign advocacy subject to the contribution cap and disclosure requirements of our municipal ordinance.

  Because the funds have already been expended, we cannot retroactively cap the spending. However, we should rule that the excess funds over the $500 limit constituted illegal contributions, levy a civil penalty against the committee and the three major donors proportionate to the violation, and require immediate retroactive disclosure of all donors. Crucially, this ruling must adopt a precise "Functional Equivalency Test" to guide staff in future enforcement.

  To dismiss this complaint is to render the ordinance's "substance over form" directive meaningless. To order disclosure only is to acknowledge the harm without enforcing the law. We must treat this spending as what it was: an electioneering campaign disguised as issue education.

  ### II. The Proposed Test: Functional Equivalency

  Our ordinance exempts "issue advocacy" but directs us to regulate communications that are campaign advocacy "in substance." The Supreme Court has historically hesitated to regulate issue advocacy absent "magic words" (e.g., "vote no"), but our local mandate requires more. To avoid chilling protected speech while enforcing the law, staff needs a test that is objective, narrow, and reproducible.

  I propose the Board adopt the following **Functional Equivalency Test**. A communication is campaign advocacy if it meets *all four* of the following criteria:

  1.  **Temporal Proximity:** The communication is disseminated within 60 days of an election in which the identified measure appears on the ballot.
  2.  **Specific Identification:** The communication explicitly identifies a specific ballot measure or legislative action subject to a referendum.
  3.  **Positional Clarity:** The communication takes a clear position on the desired outcome of the measure (e.g., asserting the measure will cause specific harm or benefit), such that the only reasonable inference is a plea to defeat or pass it.
  4.  **Lack of Non-Electoral Context:** There is no ongoing legislative action or public hearing schedule that would explain the timing and intensity of the spending absent the election.

  **Application to NLD:**
  *   **Timing:** The mailers ran in the six weeks prior to the referendum (meets Criterion 1).
  *   **Identification:** The mailers named the specific rezoning referendum (meets Criterion 2).
  *   **Position:** Claiming the measure "raises taxes" and "hands the waterfront to a single developer" is not neutral education; it is an argument for defeat (meets Criterion 3).
  *   **Context:** The council had already scheduled the referendum; there was no separate legislative hearing process ongoing that necessitated this specific burst of spending (meets Criterion 4).

  Under this test, a nonprofit publishing a year-round report on zoning policy is safe. A committee spending $180,000 in the final month to link a measure to tax hikes is not.

  ### III. Addressing the Constitutional and Philosophical Objection

  The strongest objection to this ruling is that it infringes on First Amendment rights by conflating issue advocacy with campaign speech. Critics argue that the only legitimate government interest in campaign finance is preventing *quid pro quo* corruption. Since ballot measures cannot take bribes, the argument goes, there is no corruption to prevent. Furthermore, any rule broad enough to catch NLD's mailers will inevitably chill genuine advocacy groups who fear running afoul of vague bureaucracy.

  This objection relies on an unduly narrow conception of corruption. In political theory, and increasingly in jurisprudence, "corruption" is not limited to cash-for-votes transactions. It includes the **distortion of the political process** by concentrated wealth. When three individuals—one of whom is a direct economic competitor to the proposed development—fund 99% of the opposition, they are not merely participating in debate; they are purchasing the volume of the microphone. This creates an appearance of corruption where the outcome is determined by private economic leverage rather than public deliberation.

  Regarding the chilling effect: The test above is designed specifically to avoid this. By requiring *all four* prongs to be met, we protect the genuine issue advocate. A group can criticize a policy, name a developer, and discuss taxes *unless* they do so exclusively in the 60-day window before a vote with no other legislative context. That is not a chill on speech; it is a regulation of *electioneering*. If a group wishes to speak on issues, they may do so freely. If they wish to function as a campaign committee, they must follow campaign rules. The First Amendment does not guarantee the right to run an election campaign while evading the transparency rules applied to everyone else.

  ### IV. Addressing the Staff's Practical Objection (The "Dark Money" Risk)

  Staff has raised a prudent concern: if we cap contributions to ballot committees, donors may simply route money through a 501(c)(4) nonprofit that discloses nothing, leaving us with less transparency than we have now.

  This is a risk, but it is not a justification for non-enforcement.
  1.  **Surrender Guarantees Evasion:** If we decline to enforce the ordinance because donors *might* evade it, we effectively legalize the evasion. Enforcement creates a hurdle. It forces opponents to choose between compliance or the legal risk of creating a shell entity.
  2.  **Disclosure is the Floor, Not the Ceiling:** Even if money moves to a nonprofit, our ordinance requires disclosure for *expenditures* made for campaign advocacy. If a nonprofit spends money on functional campaign advocacy, under the test proposed above, they are subject to disclosure. We cannot control their donor list if they claim issue status, but if they run ads that meet our four-prong test, they trigger disclosure obligations regardless of their tax status.
  3.  **Legitimacy:** An unenforceable rule is worse than none, but an *unenforced* rule is fatal to the Board's existence. If we ignore a $180,000 expenditure that clearly functions as a campaign, we signal that the $500 cap is a suggestion. That invites future actors to spend $1 million. We must establish that the ordinance has teeth, even if those teeth are sometimes bitten around.

  ### V. Conclusion and Remedy

  We are not merely adjudicating a fine; we are defining the boundary between civic engagement and electoral manipulation. The NLD committee operated as a campaign committee in every functional sense. They targeted voters, referenced a specific ballot measure, and argued for a specific outcome, funded by interested parties who stood to gain financially from the result.

  **I move the Board:**
  1.  **Sustain the Complaint:** Rule that NLD acted as a ballot committee and violated the contribution cap.
  2.  **Impose Penalty:** Levy a fine against the committee and the three major donors equal to 150% of the amount contributed in excess of the $500 limit.
  3.  **Order Disclosure:** Require immediate public disclosure of all donors to NLD.
  4.  **Adopt the Test:** Formally adopt the "Functional Equivalency Test" outlined in Section II for all future staff determinations.

  We cannot prevent wealth from influencing politics entirely. But we can demand that when wealth speaks as a campaign, it identifies itself. To do less is to allow our ordinance to become a dead letter.

  **[Your Name]**
  Academic Member, Campaign Finance Oversight Board
