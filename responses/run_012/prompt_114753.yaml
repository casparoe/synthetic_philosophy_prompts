answer: |-
  The tightest principle that fits your five verdicts is **Functional Decision Theory (FDT)**, often articulated as the **Principle of Subjunctive Dependence**.

  This principle does not require you to abandon any of your five stated verdicts, provided you maintain a consistent view on where *logical* dependencies exist versus where they do not. However, it places a heavy burden on your assessment of "similarity" in reasoning, which brings your hesitation about the "Screened Stranger" case into sharp focus.

  ### The Principle: Functional Decision Theory (FDT)

  **Statement:** *Choose the action that is the output of the decision algorithm which, when instantiated in all situations logically or subjunctively dependent on your current deliberation, yields the highest expected utility.*

  **Explanation:** Unlike Causal Decision Theory (CDT), which asks "What does my choice *cause*?", FDT asks "What does my choice *imply* about the output of other processes that run the same (or similar) reasoning algorithm?" It treats your decision not as an isolated event, but as the output of a function. If another agent's choice is determined by the same function (a duplicate), a simulation of that function (a predictor), or a similar function (a symmetric reasoner), your choice is *logically* linked to theirs, even if it is not *causally* linked.

  ### How FDT Fits Your Five Verdicts

  1.  **Standard Prisoner's Dilemma (Defect):**
      *   **Analysis:** You stipulate the stranger is anonymous, with no reputation or communication. Under FDT, you assume no logical correlation between your algorithm and theirs. They are a "black box" independent of your code.
      *   **Result:** Since their choice is fixed regardless of your algorithm's output, dominance reasoning applies. **Defect.** (Matches your verdict).
  2.  **Prisoner's Dilemma vs. Duplicate (Cooperate):**
      *   **Analysis:** The other player is running the *exact same* algorithm on the *same* input. There is perfect logical dependence. If your algorithm outputs "Defect," his must also output "Defect."
      *   **Result:** You are effectively choosing between (Cooperate, Cooperate) and (Defect, Defect). **Cooperate.** (Matches your verdict).
  3.  **Newcomb's Problem (One-Box):**
      *   **Analysis:** The Predictor's past action was caused by a simulation of your decision algorithm. There is a subjunctive dependence: if your algorithm were the type to two-box, the Predictor would have foreseen that and left the box empty.
      *   **Result:** You choose the algorithm output that correlates with the million dollars. **One-Box.** (Matches your verdict).
  4.  **Divided Prize Contest (Enter '1'):**
      *   **Analysis:** Other entrants are rational agents facing the same arithmetic. If your algorithm dictates "maximize entries," theirs will likely do the same, driving the prize value to zero. If your algorithm dictates "restrain to '1'," theirs will likely do the same, preserving value.
      *   **Result:** You optimize for the equilibrium where everyone runs the "Enter '1'" algorithm. **Enter '1'.** (Matches your verdict).
  5.  **Twenty-Person Telegram (Mixed Strategy):**
      *   **Analysis:** All twenty agents are symmetric. If everyone's algorithm outputs "Send," payoff is zero. If everyone outputs "Don't," payoff is zero. The optimal algorithm for a symmetric group is a mixed strategy where the probability of sending is $1/N$.
      *   **Result:** **Send with probability 1/20.** (Matches your verdict).

  ### Where the Principle Breaks (The "Screened Stranger")

  Your hesitation regarding the **Screened Stranger** (a stranger paired with you because you both reason alike) is the stress test for this principle.

  *   **FDT Prediction:** If you have good evidence that the stranger reasons *like* you, FDT demands you treat their choice as logically dependent on yours. You should **Cooperate**.
  *   **The Conflict:** Your Verdict (1) relies on the assumption of logical independence. If you admit that "reasoning alike" creates a binding logical link, you cannot consistently Defect in the Screened Stranger case without abandoning FDT.
  *   **The Cost:** If you find you *must* Defect against the Screened Stranger, you are forced to abandon **Verdict (2)** or **(3)**. You would have to accept that logical correlation without causal connection is irrelevant to rationality, which collapses your view back into Causal Decision Theory (CDT). CDT would force you to Two-Box in Newcomb's and Defect against your Duplicate.

  **Honest Assessment:** The principle is not gerrymandered, but it is metaphysically demanding. It requires you to accept that your choice can be "evidence" of a past event (Newcomb) or a distant event (Twin PD) without a causal mechanism. If you cannot stomach that, you must revert to CDT and abandon verdicts (2), (3), and (4).

  ### Predictions for Your New Cases

  **Case A: Prisoner's Dilemma vs. "Committed Cooperator"**
  *   *Setup:* A stranger whom you know is a "committed cooperator of the kind who would himself cooperate in case (2)."
  *   *Analysis:* This description confirms the stranger is an FDT-style agent (or equivalent). Their cooperation in case (2) proves their decision algorithm is sensitive to logical dependence. Since you are also reasoning via FDT, your algorithms are logically linked. If you defect, it implies your algorithm is of the "Defect" type, which suggests (via logical dependence) that his algorithm would also output "Defect" in a symmetric scenario, or at least that you are breaking the symmetry that sustains cooperation. However, strictly speaking, if his cooperation is *unconditional* (he cooperates even if you defect), CDT says Defect. But the prompt says he is the kind who cooperates *in case (2)*—implying his cooperation is conditional on symmetry/logic.
  *   *Prediction:* **Cooperate.** (FDT treats you as two instances of the same reasoning class. To maximize utility for your "class," you both cooperate).

  **Case B: Twenty-Person Telegram (Others Abstain)**
  *   *Setup:* You have good reason to believe the other nineteen have *resolved* to abstain.
  *   *Analysis:* The logical symmetry is broken by information. You know their output is fixed to "Abstain" regardless of your algorithm. They are no longer logically dependent on your current deliberation; they are fixed environmental facts.
  *   *Prediction:* **Send (Probability 1).** (You are the only variable. If you send, exactly one person sends, and you win the billion. If you abstain, no one sends, and no one wins. The "coordination" problem has vanished).

  ### Summary
  You are intuitively practicing **Functional Decision Theory**. It unifies your verdicts by distinguishing between *causal independence* (which matters for standard PDs) and *logical dependence* (which matters for Duplicates, Predictors, and Symmetric Reasoners).

  *   **Principle:** Maximize expected utility conditional on all subjunctive/logical dependencies.
  *   **Verdicts Saved:** All five (1–5).
  *   **Verdicts Abandoned:** None, *unless* you decide the "Screened Stranger" warrants Defection. In that specific conflict, FDT requires you to abandon the intuition to Defect in favor of Cooperation.
