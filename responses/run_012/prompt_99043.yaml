answer: |-
  There is no single canonical name that captures the phenomenon, the mechanism, and the philosophical thesis in one phrase. However, the pattern you describe is precisely defined at the intersection of cognitive science, legal theory, and philosophy of language.

  The pattern is best named **Exemplar-Based Categorical Dispute**, driven by **The Problem of Relevant Similarities**. The thesis that this constitutes the "basic operation of thought" is known as **Radical Analogicalism** (or the **Analogical Theory of Cognition**).

  Here is the precise breakdown of the boundaries, the distinctions from the views you mentioned, and the commitments involved.

  ### 1. The Pattern: Exemplar-Based Categorical Dispute
  You described a situation where parties agree on data but disagree on classification because they assimilate the new case to different *familiar cases*.

  *   **Cognitive Mechanism:** In cognitive psychology, this distinguishes **Exemplar Theory** from **Prototype Theory**. Prototype theory suggests we categorize by comparing an object to an abstracted "average" (e.g., a robin is a better prototype of "bird" than a penguin). Your description matches **Exemplar Theory**: we categorize by retrieving specific, remembered instances (e.g., "This drone strike is like the *Lincoln* assassination," vs. "This is like the *Bin Laden* raid").
  *   **Logical Impasse:** The reason you cannot settle the argument with facts is known in logic and law as **The Problem of Relevant Similarities**. Any two cases share infinite similarities and infinite differences. There is no factual metric to determine *which* similarities are "relevant" without already assuming the classification you are trying to prove. If you assume the category is "War," certain facts become relevant; if "Policing," other facts do. The relevance is determined by the exemplar, not the facts.

  ### 2. The Thesis: Radical Analogicalism
  You asked if there is an established thesis that this is the "basic operation of thought itself." Yes. The strongest formulation comes from cognitive scientists **Douglas Hofstadter and Emmanuel Sander** in *Surfaces and Essences: Analogy as the Fuel and Fire of Thinking* (2013).

  *   **The Claim:** Categorization *is* analogy. To recognize a cup as a "cup" is to unconsciously say, "This object is like that previous object I called a cup." There is no access to reality that is not mediated by this analogical mapping.
  *   **The Consequence:** Disagreements about "what something is" are not errors; they are collisions between two different, internally coherent analogical networks. There is no "neutral ground" because there is no non-analogical access to the case.

  ### 3. Differentiation from Closest Named Views

  You asked how this differs from Family Resemblance, Prototype Theory, and Conceptual Metaphor.

  **A. Family Resemblance (Wittgenstein)**
  *   **The View:** Concepts are held together by overlapping similarities, not a single essential definition.
  *   **The Difference:** Family Resemblance explains the *structure* of a concept (why it has fuzzy boundaries), but it does not explain the *mechanism of the dispute*. Wittgenstein does not emphasize that we actively fight over *which* historical exemplar governs the new case. Your pattern is dynamic and adversarial; Family Resemblance is static and structural.
  *   **Fit:** Partial. It explains why the boundary is porous, but not why the argument is infinite.

  **B. Prototype Theory (Rosch)**
  *   **The View:** We categorize based on similarity to an abstracted "best example."
  *   **The Difference:** Prototype theory suggests a psychological averaging. If two people disagree, Prototype Theory would suggest one person has a different "average" in mind. Your observation is sharper: people are citing *specific precedents* ("This is like *that* case"), not abstract averages. Furthermore, Prototype Theory is often descriptive of individual cognition, whereas your pattern describes an *interpersonal impasse* rooted in normative authority (which precedent governs?).
  *   **Fit:** Weak. It misses the "case-based" nature of the reasoning.

  **C. Conceptual Metaphor Theory (Lakoff & Johnson)**
  *   **The View:** Thought is structured by cross-domain mappings (e.g., ARGUMENT IS WAR).
  *   **The Difference:** This is the closest fit, and Radical Analogicalism essentially subsumes it. However, standard Conceptual Metaphor Theory focuses on deep, often unconscious, systemic mappings (time, space, causality). Your pattern describes **local ontological classification** (is *this specific act* war or police?). While Lakoff would say this is metaphorical, your description highlights the *argumentative retrieval of precedents* rather than the underlying structural mapping.
  *   **Fit:** Strong, but your description is more granular. It is "Case-Based Metaphor."

  ### 4. Definition and Commitments

  If you adopt **Radical Analogicalism** (via Exemplar-Based Dispute) as your framework, here is what it commits you to and what it rules out.

  **It Commits You To:**
  1.  **Anti-Realism about Categories:** Categories (War, Advice, Decision) do not exist in the world waiting to be discovered. They are cognitive tools imposed on the world via analogy. There is no "fact of the matter" about which category is correct, only which analogy is more useful or socially accepted.
  2.  **Coherentism over Correspondence:** Truth in these disputes is not about corresponding to reality (since the facts are agreed upon), but about the **coherence** of the analogy. You win the argument not by finding a fact, but by showing that your preferred exemplar creates a more consistent narrative with other accepted beliefs.
  3.  **The Indeterminacy of Relevance:** You must accept that "relevance" is not objective. A fact is only relevant relative to the chosen exemplar.
  4.  **Infinite Regress of Justification:** Since every justification relies on a further analogy ("Why is *that* case relevant?" "Because it's like *this* other case..."), there is no foundational bedrock. Argumentation is a process of achieving **reflective equilibrium**, not finding a foundation.

  **It Rules Out:**
  1.  **Operationalism:** The belief that you can define terms strictly by measurement procedures to settle the dispute. (You cannot measure "manipulation" without first agreeing on the analogy that defines it).
  2.  **Neutral Observation:** The idea that there is a "view from nowhere" where facts speak for themselves. Facts only speak within the language game of a chosen exemplar.
  3.  **Equivocation:** It rules out the idea that the disagreement is merely verbal. The disagreement is substantive because the choice of analogy determines future actions and norms (e.g., if it's "war," soldiers are targets; if "policing," they are suspects).

  ### Summary
  The pattern is **Exemplar-Based Categorical Dispute** arising from **The Problem of Relevant Similarities**. The thesis that this is fundamental to thought is **Radical Analogicalism**.

  This view treats your frustration not as a failure of communication, but as the inevitable result of cognition itself. You are not failing to find the neutral ground; the neutral ground does not exist. You are engaged in **ontological negotiation**, where the goal is not to reveal what the case *is*, but to negotiate which **precedent** will govern its future.
