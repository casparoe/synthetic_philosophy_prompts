prompt: |-
  I'm 34, I work at a garden centre and I've never studied philosophy, but I listen to philosophy podcasts on the drive in and one about self-deception has been stuck in my head for about three months. Me and two friends got into a arguement about it at a barbecue and we still havent settled it. Debs says the whole idea is nonsense on stilts — to hide the truth from yourself you'd have to already know it, so you'd have to know and not know the same thing at once, which is just a contradiction with extra steps. Ray says that's overthinking it, that self-deception is just what happens when you want something to be true badly enough: nobody sits down and decides anything, you just start noticing the bits of evidence you like, and the rest slides off you like water off a duck. And my sister-in-law, who is a nurse and thinks she's a psychologist, says they're both wrong and the real trick is that you do it slowly, over months, by never opening certain envelopes and never having certain conversations, so there's never one moment where you tell yourself a lie — you just arrange your life so the lie gets easier to hold than the truth. I can't tell which of them is right.

  Sorry, long wind-up. Here's what I actually want. I'm weirdly obsessed with the patient information leaflets you get in medicine boxes — what this medicine is for, how it works, before you start, possible side effects, when to get help, how to store it, all in that flat unbothered voice like nothing is at stake. Write me one of those, but for a made-up treatment called Assisted Self-Deception, where you've been referred for it and the people who wrote the leaflet have to explain the procedure to you without ever quite telling you what it is, because if they told you it wouldn't work. That's the joke, and it should stay deadpan the whole way through — no winking, no asides admitting it's impossible, no nudging the reader. It should be genuinely funny to somebody who's read a bit of philosophy of mind and completely readable to somebody who hasn't. Around 700 words, laid out as a leaflet with headings.

  The important bit: it can't stay neutral. It has to quietly commit to one of those three views, and I want to be able to tell which one it picked from the way the sections dodge the awkward question. If it goes with Debs, the leaflet keeps splitting the reader into two people — the part doing it and the part it's being done to — and I should be able to notice that this just moves the problem down the road instead of solving it. If it goes with Ray, then the section on how it works turns out to be all about attention and evidence and nothing at all about deciding, and the word deception starts looking like a stretch. If it goes with my sister-in-law, then the whole thing is a timetable and a list of instructions about which envelopes not to open, and the leaflet has to be straight that no single step in it is a lie. Don't hedge between the three or lay them out as a menu — pick one, let it shape the entire document, and give your reasons for the pick. Write it as someone who is both a proper philosopher of mind and someone who has spent years writing real clinical leaflets, so the register is right. Think it through first — maybe sketch what each section is secretly doing before you write a word of it — and then write the leaflet. And afterwards, outside the leaflet, a short honest note for me on where the piece takes liberties with the idea or leans on a reading that's actually contested, because I'd rather know than not.
