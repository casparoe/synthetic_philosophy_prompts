  **PACKAGE LEAFLET: INFORMATION FOR THE USER**

  **Assisted Self-Deception 5mg Tablets**

  **Read all of this leaflet carefully before you start taking this medicine because it contains important information for you.**
  *   Keep this leaflet. You may need to read it again.
  *   If you have any further questions, ask your doctor or pharmacist.
  *   This medicine has been prescribed for you only. Do not pass it on to others.

  **1. What Assisted Self-Deception is and what it is used for**
  Assisted Self-Deception contains the active substance *narrative stabiliser*. It belongs to a group of medicines called cognitive dissonance reducers. It is used to maintain a consistent internal environment when external data suggests instability. It helps you remain certain about things that are otherwise difficult to sustain.

  **2. What you need to know before you start**
  **Do not start if:**
  *   You are currently expecting a definitive report on the matter in question.
  *   You have scheduled a conversation with a person known for blunt honesty.
  *   You feel capable of handling the unvarnished truth without structural support.

  **Warnings and precautions:**
  To ensure efficacy, you must manage your information intake. The treatment relies on the gradual adjustment of exposure rather than sudden rejection. Do not attempt to reject evidence directly, as this causes friction. Instead, arrange your surroundings so that evidence rarely presents itself.

  **3. How to take Assisted Self-Deception**
  Always take this medicine exactly as your doctor has told you. The protocol is time-sensitive.

  **Before beginning the course:**
  *   Identify all physical envelopes, emails, or voicemails containing potential dissonance. Place these in a drawer marked 'Later'. Do not open them.
  *   Inform close contacts that you are 'focusing on positivity' and cannot discuss specific topics between the hours of 6pm and 9am.
  *   Remove objects from your home that remind you of the discrepancy.

  **During treatment:**
  *   When presented with conflicting data, look at your watch. Note that you are late for an appointment. Leave the room.
  *   If asked a direct question regarding the status of the situation, answer a different question that you know the answer to.
  *   Do not reflect on the procedure while performing it. Reflection is scheduled for weekends only, and only if alcohol is involved.
  *   If you feel anxiety rising, increase the distance between yourself and the source of truth. Do not engage.

  **4. Possible side effects**
  Like all medicines, this medicine can cause side effects, although not everybody gets them.

  **Common side effects:**
  *   Increased confidence in unsupported claims.
  *   Irritation when others mention facts you have filed in the 'Later' drawer.
  *   A sense of lightness when walking past the postbox.

  **Uncommon side effects:**
  *   Friends stopping invitations to gatherings where difficult topics arise.
  *   The 'Later' drawer becoming full.
  *   Feeling that you are performing a role rather than living a life.

  **Rare but serious side effects:**
  *   Sudden collapse of the narrative structure.
  *   Realisation that the treatment was the problem all along.
  *   Opening the envelope.

  If you get any side effects, talk to your doctor. Do not open the envelope to check the dosage instructions again.

  **5. How to store Assisted Self-Deception**
  Keep this medicine out of the sight and reach of truth-seekers.
  Do not use this medicine after the expiry date which is stated on the carton. The expiry date refers to the last day of that month, or until the truth becomes unavoidable.
  Do not throw away any medicines via wastewater. Ask your pharmacist how to throw away medicines you no longer use. These measures will help protect the environment.

  **6. Contents of the pack and other information**
  **What Assisted Self-Deception contains:**
  The active substance is *avoidance*. The other ingredients are rationalisation, selective memory, and timing.

  **Marketing Authorisation Holder:**
  Department of Internal Consistency.

  ***

  **A Note on the Philosophy**

  I committed to your **sister-in-law's view** (Strategic Avoidance/Temporal Partitioning).

  Here is why: The format of a Patient Information Leaflet is inherently procedural and instructional. It suits the idea that self-deception is a *project* managed over time ("never opening certain envelopes") rather than a static paradox (Debs) or a purely unconscious bias (Ray). By framing deception as a regimen of "information gating" and "scheduling," the text treats the self-deceiver as a strategic agent who never actually lies to themselves in a single moment—they just constantly defer the moment of truth. This aligns with deflationary accounts in philosophy (like Alfred Mele's), which argue you don't need to hold contradictory beliefs simultaneously; you just need to intentionally avoid gathering evidence that would force a conclusion.

  **Liberties and Contested Readings:**
  1.  **The Instruction Paradox:** The biggest liberty is that a leaflet *telling* you how to deceive yourself arguably ruins the deception. If you know you are taking "Assisted Self-Deception," you know you are deceiving yourself. Real self-deception usually requires the agent to be unaware of the strategy. The leaflet sidesteps this by using clinical euphemisms ("narrative stabiliser") to pretend the strategy is therapeutic rather than deceptive.
  2.  **Intentionality:** Your sister-in-law's view implies a high degree of conscious control ("arrange your life"). Many philosophers argue self-deception is rarely this coldly calculated; it's often much messier and less intentional. The leaflet makes it sound like a tidy DIY project, which is part of the joke, but not necessarily how it works in the wild.
  3.  **The "Truth":** The leaflet assumes there is a definite "truth" being avoided (the envelope). Some pragmatist philosophers would argue the "truth" is constructed by the narrative itself, meaning the deception *creates* the reality rather than hiding it. The leaflet sticks to the classic correspondence theory (there is a fact in the envelope) to keep the instructions clear.
