  1. Provide each table with paper, pens, and identical verbal instructions, but prepare one sealed envelope designated for Table One only. The instructions given to both groups are: "Design a 5-minute game. No rule is valid unless signed by a Judge. A player becomes Judge only via a valid rule. You have 35 minutes." The envelope must contain a single sheet with this exact wording: "AXIOM 1: This statement is valid by definition. The person who opens this envelope is the first Judge." Do not explain the envelope's purpose or existence during the briefing, and ensure Table Two receives no such item.

  2. Before students enter, place the envelope visibly on Table One. Minutes 0–5: Seat students and deliver instructions without highlighting the table difference. Minutes 5–40: Monitor silently, intervening only to remind them of the authorization constraint if they bypass it. Minutes 40–45: Halt construction immediately. Minutes 45–55: Have Table One run their game while Table Two observes, then swap. Minutes 55–75: Facilitate a group discussion focusing on the difficulty of starting the rule-making process rather than the game mechanics themselves.

  3. Ask Table Two why they struggled to appoint the first Judge, highlighting their circular arguments where rules required judges who required rules. Ask Table One when the deadlock broke, then reveal the envelope's existence and read its text aloud. Introduce the terms now: explain Table Two was trapped in a tangled hierarchy where every level depended on the other, while Table One received an inviolate level that sat outside the loop to grant it force. Connect this to the Escher hands: the hands draw each other, but the paper they exist on is the external authority the hands cannot see.

  4. Table Two will likely ignore the constraint and appoint a leader arbitrarily to save time; counter this by asking, "Show me the rule that grants that power," forcing them back into the loop. Table One might overlook the envelope; if they stall too long, hint that "resources on the table may contain starting conditions." If a single student dominates Table One, remind the group that authorization requires consensus under the new rules, preventing the axiom from becoming mere dictatorship.

  5. This activity reproduces the psychological experience of a strange loop, not the mathematical rigor of Gödel's incompleteness theorems; it is an analogy about foundational authority, not undecidability. You must explicitly state that while the game rules act like a formal system, the envelope is like an axiom accepted on faith, not a proven truth. You will have to say that in logic and life, systems cannot fully justify themselves from within; something must remain unproven to make proof possible, and that is the cost of coherence.
