prompt: |-
  I've somehow ended up running next month's meetup session — ninety minutes, whiteboard, fifteen people who read a lot of EA/rationalist blog stuff and have read exactly zero philosophy of war. Topic is the moral equality of combatants. Don't explain it to me, I roughly know what it says; I want the lesson plan.

  So: what order do the pieces have to go in, and what actually depends on what? My guess is you can't even state the doctrine before people have (a) the ad bellum / in bello split and (b) the idea that the rules of fighting are meant to apply the same to both sides regardless of who started it — but I might be putting the cart before the horse, tell me if so and what the real first move is.

  The one example that has to carry the whole thing: I want an unjust combatant who fights on knowing full well his side's cause is rotten — he's read the actual memo, he believes it — and who also isn't being coerced (volunteer army, nobody shooting deserters, he could just walk). Reason I'm insisting on that: with the ususal WWII-flavored case I'm fairly sure the room will quietly swap in 'well he couldn't have known' and the whole session collapses into the excuse story without anyone noticing they've changed the subject. So — can that case even be constructed, or does the excuse do all the work and my example is impossible? If it's impossible, say so loudly, because it changes what I should teach. And tell me what the example has to have and has to lack to do the job.

  Second thing, and I want you to tell me if it's a trap: I want to try walking in through a licensing-convention picture, like the rules of a duel, or two boxers who both agreed to the match. On that picture the permission to kill each other comes from both sides accepting the same rulebook, not from either cause being just, and the symmetry is just what a rulebook looks like when two parties buy in. Two worries: it smuggles in a consent/contract story that actual soldiers don't satisfy, and it seems to license any mutually agreed fight, which is nuts. Load-bearing or drop it? Related version I may have made up on a walk: the symmetry is doing coordination work rather than moral work — both sides prefer a shared rulebook to anything-goes, and symmetry is what makes it self-enforcing — in which case the "moral" equality is a moralized convention. If that's a real position and not just me, work it into the plan.

  Misconceptions, in the order they'll actually show up and where in the sequence to head each one off. I'm betting on: (1) moral equality = both sides equally in the right; (2) so combatants are just following orders and aren't responsible for anything; (3) it's a legal doctrine, so it's about tribunals and the Geneva rules; (4) you can only be killed if you deserve it, i.e. liability requires guilt. What's the big one I'm missing?

  Then: one question to put to the room at the end that would show whether they got the structure of the debate rather than memorized a side. And what I should explicitly refuse to cover at this level and announce that I'm refusing — I'm thinking the occupation/aftermath material and the exceptional-circumstances material, but you tell me.

  No reading list, they won't do it.

  Last thing: keep the confidence honest. Seperate what's settled among people who actually work on this from what's a live fight, and don't hand me one side as the consensus. In particular, if the revisionist line (McMahan and co.) has basically won, don't tell me it's settled; and if it hasn't, don't tell me it's fringe.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Request:**
      *   **User:** Running a 90-minute meetup session.
      *   **Audience:** 15 people, EA/rationalist background (analytical, utilitarian-leaning likely, comfortable with thought experiments, skeptical of tradition), read zero philosophy of war.
      *   **Topic:** Moral Equality of Combatants (MEC).
      *   **Constraints:** No reading list. Don't explain the doctrine (user knows it). Need a lesson plan (order, dependencies).
      *   **Specific Questions/Concerns:**
          *   Order of operations (Ad Bellum/In Bello split first?).
          *   The "Unjust Combatant" example (Volunteer, knows cause is rotten, not coerced). Is this possible or does excuse-doing collapse it?
          *   The "Licensing/Convention" analogy (Duels/Boxing). Is this a trap? Is it a coordination convention?
          *   Misconceptions (User listed 4, need to check for missing big ones).
          *   Closing question (tests structure, not side).
          *   What to explicitly exclude.
          *   Confidence/Consensus check (Traditionalism vs. Revisionism/McMahan).

  2.  **Deconstruct the Topic (Moral Equality of Combatants):**
      *   *Traditional View (Walzer):* Combatants are moral equals. They have equal right to kill and equal liability to be killed, regardless of *jus ad bellum* (justice of the war).
      *   *Revisionist View (McMahan):* Liability depends on moral responsibility for unjust threat. Unjust combatants generally lack the right to kill and are liable to be killed; Just combatants have the right and are less liable.
      *   *Key Tension:* Independence of *jus in bello* from *jus ad bellum*.

  3.  **Address Specific User Queries:**

      *   **Order of Operations:** User guesses (a) *ad bellum/in bello* split and (b) symmetry of rules.
          *   *Verdict:* Correct. You can't explain MEC without establishing that *in bello* rules are traditionally thought to operate independently of *ad bellum* status.
          *   *Refinement:* Start with the intuition that "murder is wrong," then introduce the "war exception," then show the symmetry.

      *   **The "Unjust Combatant" Example:**
          *   *User's Case:* Volunteer, knows cause is rotten, not coerced.
          *   *Feasibility:* It is *conceptually* possible, but empirically rare. However, for a thought experiment, it's necessary.
          *   *Risk:* The "Epistemic Problem." Even if he *says* he knows, does he *really* know? Rationalists love epistemic humility.
          *   *Requirement:* The example must stipulate *moral* knowledge, not just factual. He knows the war is aggressive conquest, not defense.
          *   *Verdict:* Do not drop it. It's the stress test. If the example collapses, MEC collapses. Acknowledge the epistemic hurdle but insist on the stipulation for the sake of the argument.

      *   **The "Licensing/Convention" Analogy (Duels/Boxing):**
          *   *User's Worry:* Smuggles consent, licenses any fight.
          *   *Analysis:* This is actually the "Conventionism" or "Institutional" account of war (often associated with Mavrodides or a specific reading of Walzer).
          *   *Trap:* It *does* fail if treated as literal consent (soldiers don't consent to be killed by *unjust* enemies necessarily).
          *   *Coordination Angle:* This is strong. War as a practice with internal norms.
          *   *Verdict:* Use it as a *model* for the Traditionalist view, but flag the limitation. It explains *why* we might want symmetry (coordination/humanitarianism), but it struggles to explain *moral* equality (liability). It's a "functional" justification, not a "deep moral" one.

      *   **Misconceptions:**
          *   User listed: (1) Equality = Both right, (2) Just following orders, (3) Legal vs. Moral, (4) Liability = Guilt.
          *   *Missing Big One:* **The Epistemic Condition.** (How can anyone know who is just?). This is the Rationalist trap. They will get stuck on "Nobody knows who's right, so symmetry is the only heuristic."
          *   *Another One:* **Liability vs. Permission.** MEC says I am *permitted* to kill you and you are *liable* to be killed. Revisionists separate these.

      *   **Consensus Check (Traditionalism vs. Revisionism):**
          *   *Status:* In academic philosophy of war, Revisionism (McMahan) has dominated the last 15-20 years. Traditionalism is now the "target."
          *   *Nuance:* However, Revisionism has serious implementation problems (the "Action Guidance" problem). So, while Revisionism wins on *theory*, Traditionalism wins on *practice/policy*.
          *   *Instruction:* Do not present Revisionism as "the truth." Present it as the dominant *theoretical* challenge that exposes the incoherence of Traditionalism, but acknowledge the practical stalemate.

  4.  **Drafting the Lesson Plan (90 Minutes):**

      *   *0-15 min:* Setup. The Murder Intuition vs. The War Exception. Introduce *Ad Bellum* / *In Bello*.
      *   *15-30 min:* The Traditionalist Case (MEC). Use the Boxing/Convention analogy here.
      *   *30-50 min:* The Stress Test (The Unjust Combatant). Introduce the specific example. Let them tear it apart. Introduce Revisionism (McMahan) here as the response.
      *   *50-70 min:* The Coordination/Convention Objection (User's idea). Is MEC a moral truth or a useful lie?
      *   *70-85 min:* Misconception Sweep & Synthesis.
      *   *85-90 min:* The Closing Question.

  5.  **Refining the Content:**

      *   *The Example:* Needs to be "The Aggressive Volunteer." Stipulate: He knows his country is invading for resources. He is not brainwashed. He is not threatened.
      *   *The Convention Trap:* Be clear. Conventions explain *rules*, not *liability*. A boxing match doesn't make it morally okay to stab someone outside the rules.
      *   *Misconceptions:* Add the "Epistemic Fog" argument. Rationalists will love this. "Since we can't know *ad bellum* truth, we must assume symmetry."
      *   *Exclusions:* Post-war justice (*jus post bellum*), non-combatant immunity details (keep focus on combatant/combatant), specific legal statutes (Geneva).

  6.  **Review against Constraints:**
      *   *Tone:* Direct, analytical, no fluff.
      *   *Confidence:* Honest about the Academic split.
      *   *Audience:* EA/Rationalist (focus on structure, incentives, epistemic states).

  7.  **Final Polish:** Check the flow. Ensure the "Convention" idea is integrated properly as a justification for Traditionalism that Revisionists attack. Ensure the "Unjust Combatant" example is robust enough. (Self-Correction: Make sure to emphasize that Revisionism doesn't necessarily mean "shoot all unjust combatants," but that they lack the *right* to kill).

  8.  **Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is the lesson plan, structured for a 90-minute session with an analytically rigorous audience.

  ### 1. The Order of Operations (Dependencies)

  Your guess is correct, but the dependency chain is tighter than you think. You cannot state the doctrine without the *ad bellum / in bello* distinction, but you cannot motivate the distinction without first establishing the **Default Presumption**.

  **The Sequence:**
  1.  **The Default:** Killing is wrong / Murder is a crime. (Baseline morality).
  2.  **The Exception:** War creates a zone where killing is permitted. (The phenomenon to be explained).
  3.  **The Split:** *Jus ad bellum* (justice of cause) vs. *Jus in bello* (justice of conduct).
  4.  **The Doctrine:** MEC states *in bello* rights/liabilities are independent of *ad bellum* status.
  5.  **The Challenge:** If *ad bellum* matters morally, how can *in bello* be independent? (Enter Revisionism).

  **Why this order:** If you start with the split, it looks like legal bureaucracy. If you start with the Default (Killing is wrong), MEC looks like a miraculous exception that demands justification.

  ---

  ### 2. The "Unjust Combatant" Example

  **Can it be constructed?**
  Yes, but you must stipulate **moral knowledge**, not just factual knowledge.
  *   **The Trap:** Rationalists will argue from epistemic humility ("How can he *know* the war is unjust?").
  *   **The Fix:** Stipulate the case as a **transparent aggressive war**.
      *   *Example:* Country A invades Country B explicitly to seize mineral rights. No pretense of defense. No UN mandate. The combatant has read the cabinet minutes. He is a volunteer. He is not coerced.
  *   **Does the excuse do all the work?**
      *   **Traditionalist (Walzer):** Yes, effectively. Walzer argues that even in this case, the combatant is "threatened" by the social/coercive structure of war, or that we grant equality to preserve the convention.
      *   **Revisionist (McMahan):** No. In this stipulated case, the combatant is **morally liable** to be killed and has **no right** to kill. He is effectively a uniformed murderer.
  *   **Verdict:** Keep the example. It is the wedge that splits the Traditionalist and Revisionist views. If your audience refuses to accept the stipulation (i.e., "He can't *really* know"), call that out as the **Epistemic Objection** (see Misconceptions below) and bracket it. Force them to engage with the *principle*: *If* he knows, is he equal?

  **Requirements for the Example:**
  *   **Must Have:** Clear aggression (not defense), volunteer status, access to truth.
  *   **Must Lack:** Duress, brainwashing, confusion about the nature of the conflict.

  ---

  ### 3. The Licensing/Convention Picture (The "Boxing Match")

  **Is it a trap?**
  It is a **load-bearing trap**. It is the strongest *pragmatic* defense of MEC, but it fails as a *moral* defense.

  *   **The Strength:** It explains **coordination**. If rules apply only to the "Just" side, the "Unjust" side has no incentive to follow rules (POW treatment, no chemical weapons). Symmetry makes the rules self-enforcing.
  *   **The Weakness:** It conflates **conventional permission** with **moral liability**.
      *   *Boxing:* We agree to punch. If I punch you within rules, I haven't wronged you.
      *   *War:* If I am an unjust aggressor, and we "agree" to fight, I am still trying to kill you for a bad reason. Your consent to the *rules of engagement* does not absolve my *reason for fighting*.
  *   **How to teach it:**
      1.  Present it as the **Functionalist Defense** of MEC.
      2.  Ask: "Does a convention create moral liability, or does it just create a safe space for violence?"
      3.  **Integration:** This is where you introduce the idea that MEC might be a **"Noble Lie"** or a **"Moralized Convention."** It's not metaphysically true (Revisionism), but it's practically necessary (Traditionalism).

  ---

  ### 4. Misconceptions (Order of Appearance)

  You listed four good ones. Here is the **Fifth Big One** you are missing, which is critical for Rationalists:

  **5. The Epistemic Fog Argument ("Nobody knows who is right, so symmetry is the only heuristic.")**
  *   **Where it shows up:** Immediately after you introduce the Unjust Combatant.
  *   **The Counter:** MEC is a claim about *objective morality*, not *epistemic access*. Even if we *knew* who was right (God's eye view), Traditionalists say they are still equals. Revisionists say they are not. Don't let them retreat to "we can't know" to solve the moral problem.

  **Your List + Management:**
  1.  **Equality = Both sides equally in the right.**
      *   *Fix:* MEC is about **rights/liabilities**, not **cause**. One side can be 100% wrong on *ad bellum* but equal on *in bello*.
  2.  **Just following orders / No responsibility.**
      *   *Fix:* MEC grants a **privilege** to kill, it doesn't remove **responsibility** for war crimes.
  3.  **Legal vs. Moral.**
      *   *Fix:* Geneva Conventions = Law. MEC = Moral Philosophy. They overlap but diverge (e.g., legal tribunals often punish aggression, implying moral inequality).
  4.  **Liability requires guilt.**
      *   *Fix:* This is the Revisionist wedge. Traditionalists say liability comes from **being a threat**. Revisionists say liability comes from **moral responsibility for an unjust threat**.
  5.  **Epistemic Fog (The Missing One).**
      *   *Fix:* Bracket it. "Assume for this hour we *can* know. Does equality hold?"

  ---

  ### 5. Consensus & Confidence Check

  **Do not lie about the state of the field.**

  *   **Academic Consensus:** The **Revisionist** critique (McMahan, *Killing in War*) has effectively dismantled the Traditionalist *moral* argument in professional philosophy. It is widely accepted that MEC is morally incoherent *in principle*.
  *   **Practical Consensus:** However, Revisionism has **no workable implementation**. We cannot realistically adjudicate *ad bellum* justice in real-time for every soldier. Therefore, Traditionalism remains the **policy standard** (International Law, Military Codes).
  *   **What to tell the room:** "Philosophically, Traditionalism is considered broken. Practically, Revisionism is considered unworkable. We are currently in a stalemate where we know the old theory is false but can't install the new one."

  ---

  ### 6. What to Explicitly Refuse (Scope Boundaries)

  Announce this at the start to prevent scope creep:
  1.  **Non-Combatant Immunity:** We are talking about Combatant vs. Combatant. Do not drift into collateral damage.
  2.  **Jus Post Bellum:** What happens after the war (reparations, occupation) is a different debate.
  3.  **Legal Statutes:** We are not analyzing the Geneva Conventions text. We are analyzing the moral logic that (allegedly) underpins them.

  ---

  ### 7. The Lesson Plan (90 Minutes)

  **00-10: The Baseline & The Split**
  *   **Prompt:** "In normal life, if A tries to kill B, B can defend, C cannot help A. In war, C (uniformed) *can* help A kill B. Why?"
  *   **Define:** *Ad Bellum* (Cause) vs. *In Bello* (Conduct).
  *   **Define:** MEC (Independence of the two).

  **10-25: The Traditionalist Case (The Convention)**
  *   **Use your Boxing/Duel analogy here.**
  *   War as a practice with internal norms.
  *   Argument: Symmetry reduces suffering (if only the 'Just' side could fight, the 'Unjust' side would fight dirty).
  *   **Check:** Does this convince them? (Likely yes, on utilitarian grounds).

  **25-45: The Stress Test (The Unjust Combatant)**
  *   **Deploy the Example:** The Volunteer Aggressor (knows cause is rotten, not coerced).
  *   **Question:** "Does he have the right to kill the defender? Is the defender *wronging* him by killing him?"
  *   **Traditionalist Answer:** Yes / No. (He is a soldier doing a job).
  *   **Revisionist Answer:** No / Yes. (He is an unjust threat).
  *   **Introduce McMahan:** Liability tracks moral responsibility, not uniform status.

  **45-60: The Coordination Trap (Your "Convention" Idea)**
  *   **Pivot:** "If Revisionism is morally right, why don't we use it?"
  *   **Discussion:** The Epistemic Problem & The Incentive Problem.
  *   **Synthesis:** MEC might be a **Moralized Convention**. It's false metaphysically, but true institutionally.
  *   **Address the Trap:** Acknowledge that this makes MEC a "useful fiction" rather than a moral truth.

  **60-75: Misconception Sweep**
  *   Walk through the 5 misconceptions listed above.
  *   Specifically hammer the **Epistemic Fog** objection. "Are we saying we can't know, or that it doesn't matter?"

  **75-85: The Structural Question (Assessment)**
  *   **Do not ask:** "Is MEC true?" (They will just vote).
  *   **Ask:** **"If we adopt the Revisionist view morally, what happens to the laws of war practically? If we keep the Traditionalist view legally, what moral cost are we paying?"**
  *   **Goal:** You want them to articulate the **Trade-off**. (Moral Coherence vs. Humanitarian Stability). If they can state that tension, they understand the structure.

  **85-90: Close**
  *   Reiterate the Stalemate (Philosophically dead, Practically alive).
  *   Dismiss.

  ### 8. Final Advice on the "Convention" Analogy

  You asked if it's load-bearing. **Yes.**
  For a Rationalist/EA crowd, the "Moralized Convention" argument is often more satisfying than the "Deep Moral Truth" argument.
  *   **Deep Moral Truth:** "The unjust soldier has a magic shield." (Hard to swallow).
  *   **Convention:** "We treat him as if he has a shield because removing it causes more death." (Easy to swallow).

  **Warning:** If you lean too hard on Convention, you concede the Revisionist point (that there is no *moral* equality). Make sure you distinguish between **Moral Equality** (Revisionists deny this) and **Legal/Conventional Equality** (Revisionists often accept this as necessary). The session topic is *Moral* Equality. Be clear that the Convention argument suggests Moral Equality might not actually exist, only Conventional Equality does. That is a profound conclusion for them to reach themselves.
