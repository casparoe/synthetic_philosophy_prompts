prompt: |-
  You are an epistemologist and philosopher of science specializing in judgment under uncertainty, the inside/outside view distinction, and the epistemology of disagreement. Before answering, brainstorm briefly: enumerate the distinct sub-claims the proposition below presupposes, because I want the reasoning decomposed rather than a bare figure.

  Here is the proposition I want a credence for. A forecaster faces a one-off case and holds both an inside-view estimate, grounded in a causal model of the case, and an outside-view estimate, grounded in a base rate drawn from a reference class she has selected from among many available classes. Suppose her model explicitly cites a causal factor that is known to be absent from that reference class. Claim: in such a case the inside view should be given greater weight than the outside view, with the outside view retaining only a residual role as a check on gross overconfidence.

  Give me your credence that this claim is true, understood as a general epistemic principle rather than a rule of thumb, and say what would count as resolving the question one way or the other. Decompose it into the sub-questions it depends on, assign each a rough probability with one line of justification, and show how the terms combine. I expect those terms to include at least: whether the outside view's authority is fundamentally statistical or causal; whether the reference class can be validated ex ante rather than merely rationalized after the fact; whether a forecaster can reliably distinguish mechanism-absence from mechanism-ignorance; and the regress problem that arises if the outside view is applied to the correction it itself recommends.

  Then name the sub-question your number is most sensitive to and say what argument or evidence would move it most. Finally, two colleagues read the same literature and put the claim at 0.85 and 0.25 respectively: tell me which sub-question most likely contains their disagreement, and whether you think the two of them are actually talking past each other.
