  Title: **The Description Dependence of Inferred Preference**
  **The Question:** Can a behavioral trajectory uniquely identify a preference structure when the state-action description is treated as a latent variable rather than a fixed parameter?
  **Motivation:** Standard Inverse Reinforcement Learning (IRL) assumes a fixed Markov Decision Process (MDP). It solves for the reward function $R$ that best explains demonstrations under a pre-specified state space $S$ and action set $A$. This creates a blind spot: the same trajectory supports incompatible reward claims depending on the description. An agent taking stairs over the lift reveals a preference for exertion only if "taking stairs" is an atomic action chosen for its own sake. If the action is "avoiding enclosed spaces," the reward function changes entirely. My colleague argues that without a fixed description, $R$ is merely a curve fit to a policy—an instrument, not an object. I argue that $R$ is real but relative to the intentional stance (description) adopted. Current identifiability results reassure us only relative to a fixed $S$ and $A$; they do not address the underdetermination introduced when the description itself is inferred.
  **Approach:** I propose a framework for **Joint Inference of Description and Reward (JIDR)**. Instead of fixing the MDP, we treat the state abstraction and action granularity as latent variables to be optimized alongside the reward function. The core challenge is avoiding circularity: any behavior can be rationalized by a sufficiently convoluted description paired with a trivial reward. To prevent this, I will not rely on hierarchical reward structures (which push the problem up a level) nor verbal reports (which introduce orthogonal noise). Instead, I will impose a **structural complexity prior on the description language itself**. The objective is to minimize the joint complexity of the description and the reward function required to explain the data. This treats the "description" not as a metaphysical given, but as a compression of the agent's cognitive ontology.
  **Success Conditions:**
  1.  **Success:** A formal proof that under specific description priors (e.g., minimum description length of the state abstraction), the equivalence class of $(Description, Reward)$ pairs collapses to a unique or near-unique solution for synthetic agents with known ontologies.
  2.  **Collapse:** The method reduces to standard Bayesian model selection with a generic regularization term, offering no new insight into the nature of preference.
  3.  **Failure:** Demonstrating that even with description complexity penalties, distinct ontologies yield equal joint complexity for the same behavior, vindicating the instrumentalist view that preferences are unrecoverable from behavior alone.
  **Scope and Limitations:** This project is theoretical and computational. It will operate on grid-world environments where the "true" agent ontology can be defined ground-truth. It will not solve the general alignment problem or address natural language grounding. The scope is limited to proving whether the *mathematical* underdetermination can be broken by description constraints. If the project succeeds, it provides a formal bridge between philosophical intentional stance theory and machine learning identifiability. If it fails, it rigorously establishes the limits of behavioral inference, forcing alignment research to rely on non-behavioral constraints.

  *Word count check:* Looks good. Dense but readable. Hits all points.

  *Final Polish:* Ensure the distinction about "description" is clear. It's not just parameters, it's the *ontology*. The text reflects this. The "determinate answer" is the uniqueness proof.

  *Ready to output.*
answer: |-
  **Title:** The Description Dependence of Inferred Preference

  **The Question:**
  Can a behavioral trajectory uniquely identify a preference structure when the state-action description is treated as a latent variable rather than a fixed parameter?

  **Motivation:**
  Standard Inverse Reinforcement Learning (IRL) assumes a fixed Markov Decision Process (MDP). It solves for the reward function $R$ that best explains demonstrations under a pre-specified state space $S$ and action set $A$. This creates a critical blind spot: the same trajectory supports incompatible reward claims depending on the description. An agent taking stairs over the lift reveals a preference for exertion only if "taking stairs" is an atomic action chosen for its own sake. If the action is "avoiding enclosed spaces," the reward function changes entirely. 

  My colleague argues that without a fixed description, $R$ is merely a curve fit to a policy—an instrument, not an object. I argue that $R$ is real but relative to the intentional stance (description) adopted. Current identifiability results reassure us only relative to a fixed $S$ and $A$; they do not address the underdetermination introduced when the description itself is inferred. If we cannot constrain the description, the instrumentalist view wins by default: there is no fact of the matter about the preference, only about the policy.

  **Approach:**
  I propose a framework for **Joint Inference of Description and Reward (JIDR)**. Instead of fixing the MDP, we treat the state abstraction and action granularity as latent variables to be optimized alongside the reward function. The core challenge is avoiding circularity: any behavior can be rationalized by a sufficiently convoluted description paired with a trivial reward. 

  To prevent this, I will not rely on hierarchical reward structures (which push the problem up a level) nor verbal reports (which introduce orthogonal noise and assume introspective access). Instead, I will impose a **structural complexity prior on the description language itself**. The objective is to minimize the joint complexity of the description and the reward function required to explain the data. This treats the "description" not as a metaphysical given, but as a compression of the agent's cognitive ontology. We are asking: what is the simplest way to describe the world such that the agent's behavior looks rational?

  **Success Conditions:**
  1.  **Success:** A formal proof that under specific description priors (e.g., minimum description length of the state abstraction), the equivalence class of $(Description, Reward)$ pairs collapses to a unique or near-unique solution for synthetic agents with known ontologies.
  2.  **Collapse:** The method reduces to standard Bayesian model selection with a generic regularization term, offering no new insight into the nature of preference or the description problem.
  3.  **Failure:** Demonstrating that even with description complexity penalties, distinct ontologies yield equal joint complexity for the same behavior, vindicating the instrumentalist view that preferences are unrecoverable from behavior alone.

  **Scope and Limitations:**
  This project is theoretical and computational. It will operate on grid-world environments where the "true" agent ontology can be defined ground-truth. It will not solve the general alignment problem or address natural language grounding. The scope is limited to proving whether the *mathematical* underdetermination can be broken by description constraints. If the project succeeds, it provides a formal bridge between philosophical intentional stance theory and machine learning identifiability. If it fails, it rigorously establishes the limits of behavioral inference, forcing alignment research to rely on non-behavioral constraints.
