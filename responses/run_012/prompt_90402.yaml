  The pattern you have identified is a sophisticated instance of a philosophical problem that arises frequently in the philosophy of science, particularly in evolutionary biology. While there is no single, universally standardized *biological* term that isolates this specific rhetorical dynamic apart from the broader "Levels of Selection Debate," there is a precise **established philosophical term** for the structure of the disagreement itself.

  The term is a **Verbal Dispute** (sometimes specified as an **Ontological Verbal Dispute**).

  In contemporary metaphysics and philosophy of language (championed by philosophers like David Chalmers and Rudolf Carnap), a verbal dispute occurs when two parties agree on all the non-semantic facts (in your case, the evolutionary dynamics, the mathematical outcomes, and the empirical predictions) but disagree on the truth of a claim due to differences in language, conceptual scheme, or ontological commitment. Your observation that "the totals come out right either way" and "neither side is making a numerical mistake" is the hallmark of formal equivalence, which renders the subsequent argument over which level is "real" a verbal dispute rather than a factual one.

  However, because "Verbal Dispute" can sound dismissively linguistic, philosophers of biology often contextualize this using the concept of **Conceptual Relativity** (Hilary Putnam). This concept captures your metaphor of "carving": the world does not come with pre-cut boundaries; different conceptual schemes (gene-centric vs. group-centric) carve the same causal processes into different "units." The argumentative pattern you describe is the refusal to accept Conceptual Relativity in favor of **Ontological Monism** (the insistence that only one carving is the "real" one).

  ### The Carving of the Pattern

  To satisfy your request for the "carving" of this pattern, here is the precise delineation of what it is, what it is not, and where its edges lie.

  **1. What the Pattern Is:**
  *   **Formal Equivalence:** The core condition is that two models (e.g., Kin Selection and Group Selection) are mathematically transformable into one another (often via the Price Equation). They yield identical predictions.
  *   **Ontological Privileging:** Each party asserts that the entities in their preferred model (genes vs. groups) possess a causal or ontological status that the entities in the rival model lack (e.g., "genes are real replicators, groups are mere statistical artifacts").
  *   **Lack of Independent Justification:** The claim of privilege is not supported by extra-empirical virtues (like simplicity or scope) that would break the tie, but is asserted as following from the accounting itself.
  *   **Non-Factual Disagreement:** The disagreement persists despite agreement on all empirical data and mathematical outcomes.

  **2. What the Pattern Is Not:**
  *   **It is not Empirical Underdetermination:** Standard underdetermination involves two theories that fit the data but make different claims about unobservables. Here, the theories make the *same* claims about observables and unobservables, merely *described* differently.
  *   **It is not Reductionism:** Reductionism implies a directional dependency (the higher level *is* nothing but the lower level). In this pattern, the "reduction" can run in either direction with equal validity, which negates the directional asymmetry required for true reductionism.
  *   **It is not a Category Mistake:** While related, a category mistake involves assigning a property to something that cannot possess it. Here, both levels *can* possess the properties (selection, fitness); the dispute is over which is *fundamental*.

  **3. Where the Edges Lie:**
  *   **The Edge of Causality:** The pattern dissolves if one side can demonstrate **Causal Asymmetry**. If manipulating the gene-level variable changes the outcome without manipulating the group-level variable (or vice versa), the equivalence breaks, and the dispute becomes factual.
  *   **The Edge of Pragmatics:** The pattern ends if both sides agree the choice is **Pragmatic** (i.e., "which ledger is more *useful* for this specific problem?"). The argumentative pattern exists *only* as long as the claim is about **Truth/Reality** rather than **Utility**.
  *   **The Edge of Approximation:** If one model is an approximation and the other is exact, the dispute is factual. The pattern requires strict **Formal Equivalence**.

  ### Why Other Concepts Fall Short

  *   **"Levels of Selection Debate":** This names the *topic*, not the *logical structure*. One can have a factual levels of selection debate (e.g., does group selection actually occur in this specific species?). Your pattern describes the *meta-debate* about the framework itself.
  *   **"Reductionism":** As you noted, this implies a hierarchy. Your pattern shows the hierarchy is reversible, making "reduction" the wrong label.
  *   **"Pluralism":** This is the *solution* (accepting both ledgers), not the name of the *conflict*.
  *   **"Underdetermination":** Too broad. This usually implies we need more data to decide. Your pattern implies *no amount of data* can decide, because the models are mathematically identical.

  ### Conclusion

  While biologists often discuss this under the header of the **Equivalence Thesis**, the precise philosophical name for the argumentative standoff—where parties agree on facts but disagree on ontological privilege—is a **Verbal Dispute**. It is a dispute over **Ontological Commitment** in the face of **Conceptual Relativity**.

