prompt: |-
  I am a novelist at work on a book whose central character is a mid-level official at a global health foundation, a man who has talked himself into a version of consequentialism that I find both attractive and alarming. The position he holds—and which I have come to half-believe myself—is this: consequentialist cluelessness, understood as the fact that the causal and evaluative consequences of our acts ramify indefinitely so that no finite agent can trace them, does not undermine consequentialism as a guide to action. Expected-value reasoning remains the right response to that cluelessness, because uncertainty is precisely what decision theory is for; the cluelessness is an epistemic predicament, not a refutation, and a consequentialist can act with integrity while knowing the full ledger will never be available. I want to know what would count against this position, not as a slogan but as a serious map of its exposure: which observations, arguments, intuitions, formal results, or historical developments should move someone who holds it, which would be decisive, which merely awkward, and which the position's own defenders would concede as genuine costs rather than dismiss as misunderstandings.

  To keep the inquiry from collapsing into generic debates, please treat two varieties separately. The first is ramification cluelessness: the causal pathways are in principle traceable, but their branching is so vast that any finite calculation is arbitrary. The second is category-drift cluelessness: the evaluative significance of later outcomes may be transformed by the very act being evaluated—say, by changing what future agents value, or by making a practice obsolete—so that the standard is not merely uncertain but partly constituted by the choice. My character believes expected-value reasoning can absorb both. Tell me what would have to be true for that belief to fail. I am especially interested in whether the view can be distinguished from rule consequentialism or from a virtue-ethical insistence on practical wisdom; whether it predicts anything its rivals do not; and whether it can avoid the conclusion that, under sufficiently radical cluelessness, all available acts have equal expected value and moral choice becomes arbitrary. I would personally be most moved by a case in which the view's own expected-value machinery recommends acts no reflective agent could endorse, or by a formal result showing that the relevant expectations are undefined rather than merely difficult to compute.

  I do not need citations, reading lists, or names of theorists; I want the arguments and the defeaters themselves. Rank them from fatal to merely awkward, say explicitly which ones a committed defender would have to concede, and end with an honest assessment of whether the position is well insulated and whether that insulation is a defect. The character in my novel will have to act on whatever remains; I need to know what he would be rational to believe, and what would rightly shake him.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book about a mid-level official at a global health foundation.
      *   **Character's Philosophy:** A specific form of consequentialism that accepts "consequentialist cluelessness" (indefinite ramification of consequences) but argues expected-value (EV) reasoning still works. Uncertainty is epistemic, not ontological. Integrity is possible despite an incomplete ledger.
      *   **Task:** Map out what counts *against* this position. Distinguish between "Ramification Cluelessness" (causal branching) and "Category-Drift Cluelessness" (evaluative standards change).
      *   **Specific Questions:**
          *   What would make the belief fail?
          *   Distinguish from rule consequentialism/virtue ethics.
          *   Does it predict anything unique?
          *   Does radical cluelessness lead to arbitrariness (all acts equal EV)?
          *   Are there cases where EV recommends unacceptable acts?
          *   Are expectations *undefined* (mathematically) rather than just hard to compute?
      *   **Format:** Rank arguments from Fatal to Awkward. Explicitly state what defenders must concede. End with an honest assessment of insulation/defect. No citations/names, just arguments.
      *   **Tone:** Serious, philosophical, nuanced, tailored for a novelist seeking depth for a character.

  2.  **Deconstruct the Character's Position:**
      *   *Core Claim:* Cluelessness $\neq$ Refutation. EV is the tool for uncertainty.
      *   *Ramification:* We can't trace everything, but we can estimate probabilities.
      *   *Category-Drift:* Values might change, but we can estimate the value of those changes.
      *   *Goal:* Show where this breaks down.

  3.  **Brainstorming Objections/Defeaters:**

      *   *The "Undefined Expectation" Problem (Fatal):* If the sum of expected values doesn't converge (Pascal's Wager style issues, or infinite utilities), EV is mathematically broken, not just hard.
      *   *The "Arbitrariness" Problem (Fatal/Serious):* If cluelessness is symmetric across all options, EV differences wash out to zero. Choice becomes a coin flip.
      *   *The "Corruption of Integrity" Problem (Serious):* If I *know* I'm guessing, can I really claim integrity? Is "guessing with a formula" different from "guessing"?
      *   *The "Category-Drift" Specifics (Serious):* If the act changes *what counts as good*, how do you evaluate the act using the *current* standard without begging the question? (The "Paradox of Reform").
      *   *Distinction from Rule Consequentialism (Nuance):* If I can't calculate acts, I follow rules. But the character says "No, still calculate acts, just with wide error bars." Where is the line?
      *   *Distinction from Virtue Ethics (Nuance):* Virtue ethics says "Be a good person." Character says "Maximize good outcomes." If outcomes are unknowable, isn't "being a good person" the only proxy?
      *   *The "Fanaticism" Problem (Awkward/Fatal):* EV can recommend horrific acts for tiny probabilities of huge good (Pascal's Mugging).
      *   *The "Truncation" Necessity (Concession):* Defenders *must* admit they truncate the timeline. Why stop at 100 years? That's arbitrary.

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the position. Set the stage.
      *   **Section 1: Ramification Cluelessness (The Causal Web).** Focus on calculation, convergence, and symmetry.
      *   **Section 2: Category-Drift Cluelessness (The Moving Target).** Focus on value change and reflexivity.
      *   **Section 3: The Boundary Problem (Rules & Virtues).** Distinguishing the view from rivals.
      *   **Section 4: The Verdict.** Ranking (Fatal, Serious, Awkward). What defenders concede. Final assessment.

  5.  **Drafting the Content - Section by Section:**

      *   *Ramification:* The biggest mathematical threat is *non-convergence*. If good and bad ripple out infinitely, does the sum exist? If I save a life, that person has descendants. If the population grows, total utility might be infinite. If both options lead to infinite utility, EV comparison fails. *Fatal.*
      *   *Symmetry:* If I know nothing about the long term, maybe Option A and Option B have the same expected long-term value (zero or null). Then the decision rests on short-term, which contradicts the "global" claim. *Serious.*
      *   *Category-Drift:* This is trickier. If I introduce a technology that changes morality (e.g., mood enhancement makes suffering unthinkable), how do I value that *now*? If I use current values, I might block progress. If I use future values, I don't know them. This leads to *evaluation paralysis*. *Serious.*
      *   *Pascal's Mugging:* A tiny chance of saving the universe outweighs certain small harms. A global health official might ignore malaria to fund a low-probability existential risk project. This makes the character look monstrous. *Fatal to credibility.*
      *   *Distinctions:*
          *   vs. Rule Consequentialism: The character says "Calculate." Rule Consequentialist says "Follow the rule that usually calculates best." If calculation is impossible, they converge. The character must insist on *attempting* calculation even when futile.
          *   vs. Virtue Ethics: Virtue ethics focuses on the agent's character. Character says "Outcomes." If outcomes are unknowable, character *becomes* the proxy. The distinction blurs.
      *   *Concessions:* Defenders must admit they use *truncation* (ignoring the far future) or *discounting*. They must admit this is pragmatic, not principled.
      *   *Insulation as Defect:* If the theory is immune to evidence because "you just didn't calculate the EV right," it's unfalsifiable. That's a bug, not a feature.

  6.  **Refining the Arguments (Self-Correction/Polishing):**
      *   *Check:* Did I avoid names/citations? Yes.
      *   *Check:* Did I address "Undefined vs. Difficult"? Yes, the convergence problem is key here.
      *   *Check:* Is the tone right? Needs to be analytical but evocative for a writer.
      *   *Refinement on Category-Drift:* Use the concept of "Endogenous Preference Change." The act changes the metric. This makes the EV calculation circular.
      *   *Refinement on "Arbitrariness":* If the error bars on EV overlap completely, rational choice theory says indifference. But moral choice requires commitment. This creates a psychological rift for the character.

  7.  **Final Review against constraints:**
      *   Rank from Fatal to Awkward.
      *   Explicitly state concessions.
      *   End with honest assessment.
      *   No citations.

  8.  **Final Polish:** (Mental check of the "Fatal" arguments). The "Undefined Expectation" (infinite sums) is mathematically fatal to standard EV. The "Symmetry" argument is practically fatal to decision-making. The "Pascal's Mugging" is morally fatal to the character's likability/plausibility. I will structure the ranking around these.

      *(Self-Correction during drafting)*: Make sure to distinguish between "hard to compute" (epistemic) and "undefined" (mathematical). The prompt specifically asks for this. I need to emphasize that under certain probability distributions, the expected value *does not exist*, it isn't just unknown.

      *(Refining the "Insulation" point)*: If the theory explains away every failure as "bad calculation," it becomes a faith. This is good for a novel character (dogmatism vs. doubt).

      *(Final Plan)*:
      1. Intro: Validate the position's strength.
      2. Ramification Cluelessness Defeaters (Math & Symmetry).
      3. Category-Drift Defeaters (Reflexivity & Value).
      4. The Rival Boundaries (Rules & Virtues).
      5. The Ranking & Concessions.
      6. Final Assessment (Insulation as Defect).

      *Let's write.*
answer: |-
  This is a sophisticated position. It grants the skeptic their strongest empirical point (we cannot know the future) but denies the normative conclusion (therefore we cannot act to maximize the good). It treats morality as a navigation problem in fog: the destination is fixed, the map is incomplete, but the compass (expected value) still works.

  To shake your character, you must show him that the compass itself is broken, or that the destination moves when he walks. Below is a map of the exposures, ranked by severity.

  ### I. Ramification Cluelessness: The Causal Web
  *The objection here is that the causal chains are not just long, but structurally resistant to summation.*

  **1. The Non-Convergence Problem (Fatal)**
  This is the mathematical defeater. Expected-value reasoning requires that the sum of (probability × value) converges to a specific number. In a world of infinite ramification, this is not guaranteed.
  *   **The Argument:** If the future is infinite in duration, and there is a non-zero probability that any act leads to an infinite stream of value (or disvalue), the expected value of *every* act becomes infinite (or undefined). If Act A has infinite expected value and Act B has infinite expected value, EV theory cannot distinguish between them.
  *   **The Twist:** It is worse if the series is *conditionally convergent*. In mathematics, the sum of a series that oscillates between positive and negative values can be made to equal *any* number depending on the order in which you add the terms. Since the "order" of consequences in time is fixed but our knowledge of them is fragmented, the "true" expected value may be mathematically undefined, not merely unknown.
  *   **Impact:** This does not just make calculation hard; it makes the core machinery return an error code. If the expectation is undefined, there is no "right" answer to calculate.

  **2. The Symmetry of Ignorance (Serious)**
  *   **The Argument:** If we are truly clueless about the long-term ramifications, our ignorance is likely symmetric. Saving a life today adds a person to the future; letting them die removes one. Without specific knowledge of *which* future is better, the probability distribution for the long-term value of "save" and "don't save" may be identical.
  *   **The Consequence:** If the long-term expected values are identical, the decision rests entirely on short-term effects. But your character claims to be a *global* consequentialist concerned with the ledger. If the long-term washes out, he is functionally a short-termist, contradicting his own self-conception.
  *   **Impact:** It reduces his grand moral calculus to a local heuristic, stripping the "global" claim of its power.

  **3. Pascal's Mugging / Fanaticism (Fatal to Credibility)**
  *   **The Argument:** Expected-value reasoning is vulnerable to low-probability, high-stakes scenarios. If there is a one-in-a-billion chance that a specific action prevents the extinction of all future life, the expected value of that action may outweigh the certain saving of a thousand lives today.
  *   **The Consequence:** Under radical cluelessness, we cannot rule out that mundane acts (like filing a grant) have tiny probabilities of catastrophic or salvific long-term effects. If the character remains consistent, he must be willing to sacrifice definite, near-term goods for speculative, astronomical long-term gains.
  *   **Impact:** This makes the character appear monstrous or delusional. It predicts behavior (ignoring malaria to fund existential risk research) that no reflective agent can endorse, violating the "integrity" clause of his position.

  ### II. Category-Drift Cluelessness: The Moving Target
  *The objection here is that the act changes the metric by which it is judged.*

  **4. The Reflexivity Trap (Serious)**
  *   **The Argument:** Some acts change what future agents value. Suppose your character funds a technology that chemically alters human empathy. Future agents might value "collective harmony" over "individual autonomy." To evaluate the act now, he must use current values. But if the act is successful, current values will be obsolete.
  *   **The Consequence:** He is judging a revolution in values by the standards of the regime being overthrown. This is question-begging. If he uses future values, he cannot know them (cluelessness). If he uses current values, he is biased against moral progress.
  *   **Impact:** EV reasoning assumes a stable utility function. Category-drift violates this. The character must admit he is enforcing the tyranny of the present over the future, which undermines the "neutral maximizer" persona.

  **5. The Obsolescence of Practice (Awkward)**
  *   **The Argument:** Some acts make the very practice of moral calculation obsolete. If he successfully creates a post-scarcity world, "resource allocation" (his job) ceases to be a moral category.
  *   **The Consequence:** The success of his project eliminates the framework in which his project makes sense.
  *   **Impact:** This is not a refutation, but it creates a paradox of self-elimination. It suggests the moral agent is a temporary scaffold, not a permanent judge.

  ### III. Distinctions from Rivals
  *Your character insists he is not a Rule Consequentialist or a Virtue Ethicist. These boundaries are porous under cluelessness.*

  **6. Convergence with Rule Consequentialism (Serious)**
  *   **The Argument:** Rule Consequentialism says: "Follow the rule which, if generally followed, maximizes good." Act Consequentialism (your character's view) says: "Do the act that maximizes good." Under radical cluelessness, the character cannot calculate the act. He must rely on heuristics (rules) that *usually* work.
  *   **The Consequence:** If he admits he must rely on rules because calculation is impossible, he *is* a Rule Consequentialist. If he insists on calculating despite the impossibility, he is engaging in a ritual, not a decision procedure.
  *   **Impact:** He must concede that his "act-based" reasoning is a fiction. He follows rules but pretends to calculate acts to maintain the illusion of control.

  **7. Convergence with Virtue Ethics (Awkward)**
  *   **The Argument:** Virtue Ethics says: "Act as a virtuous agent would." Under cluelessness, the only thing the character controls is his intention and his diligence, not the outcome.
  *   **The Consequence:** If the outcome is unknowable, the "goodness" of the act collapses into the "goodness" of the agent's deliberation.
  *   **Impact:** The distinction becomes semantic. He claims to care about the world; in practice, he can only care about his own rationality. This invites the charge of narcissism—worshipping his own decision procedure rather than the actual good.

  ### IV. Ranking and Concessions

  **Fatal Defeaters (The view cannot hold if these are true)**
  1.  **Non-Convergence:** If the expected values are mathematically undefined (due to infinite series or oscillating values), EV reasoning is not just difficult; it is incoherent.
  2.  **Fanaticism:** If the view obligates the character to ignore certain suffering for speculative astronomical gains, it violates the "reflective endorsement" constraint. A theory that demands madness is broken.

  **Serious Defeaters (The view must be significantly modified)**
  3.  **Symmetry of Ignorance:** If long-term EVs cancel out, the character is not a global maximizer but a local one. He must abandon the claim that he is optimizing the "full ledger."
  4.  **Reflexivity:** If acts change values, he cannot claim neutrality. He must admit he is imposing current values on the future.
  5.  **Rule Convergence:** He must concede that he is following rules, not calculating acts, in practice.

  **Awkward Costs (Defenders must concede these as prices paid)**
  6.  **Truncation:** He must admit he arbitrarily cuts off the timeline (e.g., ignoring effects beyond 100 years) to make calculation possible. This is pragmatic, not principled.
  7.  **Narcissism:** He must admit that under cluelessness, his "integrity" is about the purity of his calculation, not the actual state of the world.

  ### V. Final Assessment: Insulation as Defect

  Is the position well insulated? **Yes, dangerously so.**

  The position's greatest strength is its ability to absorb failure. If an act leads to disaster, the character can say, "The probability was low; the EV was still positive at the time of decision." This makes the theory unfalsifiable.

  **Why this is a defect:**
  A moral theory that cannot be proven wrong by the state of the world it creates is not a guide to action; it is a theology. It insulates the agent from guilt, but also from learning. If the character never has to admit that his *method* was wrong (only that the *outcome* was unlucky), he becomes dogmatic.

  **What would rightly shake him:**
  He should be shaken not by the *difficulty* of calculation, but by the **arbitrariness of the inputs**. To make the math work, he has to assign probabilities to events he knows nothing about (e.g., "10% chance this policy alters political stability for 50 years"). He knows these numbers are guesses.
  *   **The Crisis:** Realizing that multiplying a real harm (a denied grant) by a made-up probability (a speculative future benefit) is not "reasoning under uncertainty," but **ritualized guessing**.
  *   **The Rational Belief:** He is rational to believe that EV is the *best available* tool, but irrational to believe it yields *truth*. He is navigating by a compass that spins randomly but feels heavy in his hand.

  **For the Novel:**
  The tension lies in the gap between the *mathematical precision* of his spreadsheets and the *ontological vagueness* of the numbers inside them. He finds comfort in the structure of the calculation, even when the inputs are fiction. The shake-up comes when he realizes the structure is a cage, not a map. He is not maximizing the good; he is maximizing his own sense of rationality. That is a consequentialism that has swallowed its own tail.
