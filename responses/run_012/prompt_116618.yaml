  ok so my reading group is doing Dennett and one guy keeps dragging in the counterfeit people essay — the one where he argues that AI that can pass as human is like counterfeit money, that both making them and passing them along should be illegal, penalties "extremely severe," because they're "the most dangerous artifacts in human history," and that counterfeiting cash was always treated as a near-capital crime since it "undermines the trust on which society depends." His proposed fix is basically to watermark the fakes the way the EURion constellation protects banknotes, and to hold the AI companies liable.

  I more or less agree with the vibe but i cant tell how much of the actual argument is being carried by the money analogy and how much is just the loaded word "counterfeit." Can you audit it the way you'd audit any argument-from-analogy? Give me the correspondence table first — what's the currency, what's the mint, what exactly is the trust that gets undermined, who's the counterfeiter, who's the shopkeeper who can't spot a fake twenty — and then where the mapping genuinely breaks. Because my instinct is that money is a conventional token whose whole point is fungibility plus scarcity enforced by an authority, and that counterfeiting is bad partly because it dilutes and inflates the medium, not only because it deceives; whereas a person isn't a token and personhood isn't scarce. So does any of the "it's like counterfeiting" force actually transfer, or does the analogy just feel strong because we already disapprove of fakes? And the punchline: once the disanalogies are on the table, does his conclusion — outlaw making and passing counterfeit people, throw the book at them, mandate the watermarks — still stand on its own, or was it riding on the analogy the whole time? If you think there's a better analogy for what these systems do to trust, tell me what it is.
