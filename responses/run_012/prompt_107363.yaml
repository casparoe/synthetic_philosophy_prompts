      *   *Decisive:*
          1.  **The "Objective Harm" Argument:** If pain is bad *for you* (welfare reduction) independent of your attitude, the Affective View is false. (e.g., ignoring a painless heart attack vs. a painful one). But wait, the claim is about the *pain episode's* badness, not the injury's.
