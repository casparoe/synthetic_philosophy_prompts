          *   Focus on **Welfare/Objective Badness**. If pain damages your well-being even if you don't mind it (e.g., you become passive, lose agency), then badness isn't just the feeling.
      *   *Section 2: The Awkward Defeaters.*
          *   **Asymbolia Interpretation.** Are they truly indifferent, or just unconcerned? Do they have a deficit in *judgment* rather than feeling?
