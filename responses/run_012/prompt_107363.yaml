          *   *Correction:* The stronger argument here is *intense sensory without affect* (asymbolia) vs. *intense affect without sensory*. The user mentioned "mirror-image dissociation." If suffering can exist without sensory, it suggests sensory isn't *necessary* for badness. That supports the user. The counter-argument needs to be: Is sensory *contributing* to badness even if not necessary?
      *   *Argument 3: Harm vs. Attitude (Objective Badness).* A tumor I don't mind is still bad. Is pain bad because it damages tissue, or because it feels bad?
