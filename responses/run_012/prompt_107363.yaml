          *   If "badness" = "negative affect," it's tautological.
          *   If "badness" = "harm to welfare," it's falsifiable (by asymbolia).
          *   Conclusion on risk: The view *is* risky if it makes claims about welfare. It is *safe* (but trivial) if it makes claims about definitions.
      *   *Section 5: The "Plainly Harmed" Case.*
          *   Address the user's specific wish. Example: The asymbolic patient who burns themselves because they don't mind the heat. Is the *pain* bad there? Or the *burn*? The view says the pain wasn't bad, the burn was. This is a coherent distinction.
          *   Better case: **Chronic Pain & Identity.** If pain changes who you are, even if you accept it, is it bad?

  7.  **Refining the Tone:**
