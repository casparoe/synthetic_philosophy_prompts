  # Project Proposal: The Targeting Problem in Higher-Order Theories of Consciousness

  ## Project Title
  Individuation and Reference in Higher-Order Representationalism: A Conceptual Analysis of the Targeting Relation

  ## Abstract
  Higher-order theories of consciousness posit that a mental state becomes conscious when it is targeted by a suitable higher-order representation. While significant work has been done on the nature of the higher-order state itself, the specific relation that binds the higher-order representation to its first-order target remains under-specified. This project investigates the "targeting problem": what fixes the reference of the higher-order state to a specific first-order token rather than another? Existing proposals, such as causal tagging or content matching, face charges of circularity or failure to individuate numerically distinct states with identical content. This project will employ conceptual analysis to map the logical space of possible solutions, test them against constraints involving misrepresentation and token individuation, and determine whether a non-primitive, non-circular relation can be coherently specified within the framework.

  ## Research Question
  What are the necessary and sufficient conditions for a reference-fixing relation between a higher-order representation and a first-order state that satisfies the constraints of non-circularity, token individuation, and misrepresentation tolerance?

  ## Background and Motivation
  The core intuition behind higher-order theories is that consciousness arises from a meta-mental awareness of a state. However, for this awareness to be *of* a specific state, there must be a relation that secures the reference. Two dominant classes of solutions have emerged in recent discourse. The first suggests that first-order states carry a specific marker or tag that the higher-order system detects. The second suggests that the higher-order state represents the content of the first-order state, thereby locking onto it.

  Both approaches face significant difficulties. The tagging solution risks circularity: if the tag is what makes the state available for consciousness, it appears to do the work assigned to the higher-order representation, rendering the latter superfluous. If the tag does not confer availability, it remains unclear how the higher-order system identifies the tag without already having access to the state. The content-matching solution fails on individuation grounds: distinct token states (e.g., seeing a red sphere now versus visualizing a red sphere later) can share identical content. If the higher-order representation locks onto content alone, it cannot distinguish between these tokens, leading to incorrect predictions about phenomenal character.

  Furthermore, any viable theory must account for misrepresentation. If the higher-order state targets the wrong first-order state, or targets a state that does not exist, the theory must specify what determines the resulting phenomenal character. Current formulations often leave this relation primitive or obscure, which halts explanatory progress. Declaring the relation primitive sacrifices the reductive ambition of the theory; denying the need for a relation collapses the distinction between the first-order and higher-order states. This project seeks to resolve this impasse without resorting to these explanatory stopgaps.

  ## Methodology
  This project will proceed via conceptual analysis and modal reasoning. No empirical experiments are proposed because the problem is metaphysical and logical rather than mechanistic. Empirical data can tell us which neural states correlate with consciousness, but it cannot determine what constitutes the *aboutness* relation between mental states. The method involves:
  1.  **Formalization:** Defining the relata (first-order state, higher-order state) and the constraints (non-circularity, individuation, misrepresentation) in precise logical terms.
  2.  **Counterexample Testing:** Constructing thought experiments involving duplicate contents, temporal succession, and causal deviance to stress-test proposed relations.
  3.  **Consistency Checking:** Ensuring that any proposed solution does not undermine the core motivations for adopting a higher-order framework in the first place (e.g., explaining the difference between conscious and unconscious states).

  This approach is superior to empirical methods because the targeting problem is a problem of intentionality and metaphysics. Neuroscience can identify candidates for the states, but only philosophy can determine what makes one state *about* another in the way required for consciousness.

  ## Work Plan
  **Phase 1: Taxonomy and Formalization (Weeks 1-4)**
  *   **Work:** Catalog existing variants of the targeting relation found in contemporary literature (causal, informational, inferential, tagging). Formalize the constraints of non-circularity and token individuation.
  *   **Output:** A structured map of the logical space of targeting relations and a precise definition of the success conditions.

  **Phase 2: Stress-Testing and Counterexamples (Weeks 5-8)**
  *   **Work:** Develop specific cases where tagging and content-matching fail. Focus on cases of simultaneous identical contents and cases of causal deviance where the tag is present but the wrong state is targeted. Analyze the misrepresentation constraint across these cases.
  *   **Output:** A dossier of counterexamples demonstrating the insufficiency of current leading models.

  **Phase 3: Constructive Analysis (Weeks 9-12)**
  *   **Work:** Attempt to construct a hybrid or novel relation that survives the counterexamples. If construction fails, determine whether the failure is contingent or necessary (i.e., prove impossibility).
  *   **Output:** A draft argument either specifying the required relation or demonstrating that no such relation is compatible with the theory's core commitments.

  **Phase 4: Refinement and Dissemination (Weeks 13-15)**
  *   **Work:** Refine the argument against objections. Prepare the final paper or grant report.
  *   **Output:** A completed manuscript suitable for submission to a specialist journal.

  ## Success and Failure Conditions
  **Success:** The project succeeds if it produces a coherent specification of the targeting relation that handles the individuation and misrepresentation cases without circularity, or if it provides a rigorous proof that no such relation is possible within the higher-order framework (thereby forcing a theoretical revision).

  **Failure:** The project fails if it merely reiterates existing positions without resolving the tension, if it relies on primitive relations to bypass the problem, or if it conflates the targeting relation with the causal mechanism of production. A tempting failure mode is to dissolve the problem by redefining consciousness in a way that abandons the higher-order structure entirely; this would be a change of subject, not a solution.

  ## Scope and Feasibility
  One semester is sufficient to map the logical space and rule out major classes of solutions (e.g., pure tagging). It is ambitious but possible to propose a positive account, provided the scope is limited to the *structural* requirements of the relation rather than a full metaphysical theory of representation. If time becomes constrained, the constructive phase (Phase 3) should be limited to demonstrating the impossibility of current models, which is a valuable negative result in itself.

