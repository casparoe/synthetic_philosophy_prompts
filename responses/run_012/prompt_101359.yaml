answer: |-
  # Collection Definition Review Procedure (CDRP) v1.0

  **Audience:** Data Engineering Reviewers
  **Time Budget:** 15 Minutes per Proposal
  **Goal:** Prevent dataset corruption caused by logical paradoxes (specifically Russell's and Cantor's) without blocking standard data modeling.

  ## Context for Reviewers
  Last quarter, the platform crashed because two definitions combined to create a logical contradiction. This happens when a collection is defined in a way that allows it to contradict its own existence. You do not need to understand the math. You need to spot specific **patterns** in the definition text that match the patterns that caused the crash.

  **Key Terminology:**
  *   **Target:** The new collection being defined.
  *   **Search Space:** The set of items the definition looks through to find members (e.g., "All objects," "All collections," "Items in Collection X").
  *   **Self-Reference:** The definition rule explicitly mentions the **Target** by name or ID.
  *   **Comprehension Style:** Defining a collection by listing a condition members must satisfy (e.g., `Select x Where Condition(x)`).
  *   **Recursive Style:** Defining a collection as the "least closed" set starting from a seed (e.g., `Start with S, Add f(x) repeatedly`).

  ---

  ## The Procedure

  ### Step 1: The Type Check
  **Inspect:** The declared member type of the **Target**.
  **Question:** Is the Target a collection of **Data Objects** (rows, records, blobs) or a collection of **Collections**?
  *   **Adequate Answer:** Look at the schema declaration. `Collection<Object>` vs `Collection<Collection>`.
  *   **Decision:**
      *   If **Data Objects**: **PASS** immediately. (Paradoxes of this type require collections to contain collections).
      *   If **Collections**: Proceed to Step 2.
  *   **Justification:** Russell's Paradox requires a collection to be a member of itself. Data objects cannot contain collections, so a collection of data objects cannot contain itself.

  ### Step 2: The Search Space Check
  **Inspect:** The membership rule (the `WHERE` clause or predicate).
  **Question:** What is the **Search Space**? Does the rule quantify over "All Collections" in the platform, or only over members of a specific, existing collection?
  *   **Adequate Answer:** Look for keywords like `FOR ALL collections`, `UNIVERSE`, or lack of a bounding collection (e.g., `{x | P(x)}` vs `{x \in A | P(x)}`).
  *   **Decision:**
      *   If **Bounded** (e.g., "Subcollections of Collection A"): **PASS** immediately.
      *   If **Unbounded** (e.g., "All collections such that..."): Proceed to Step 3.
  *   **Justification:** Cantor's Paradox arises when we assume a "Collection of All Collections" exists. If the search space is restricted to an existing, safe collection, the size is bounded, and the paradox cannot trigger.

  ### Step 3: The Self-Reference Check
  **Inspect:** The membership rule text.
  **Question:** Does the rule mention the **Target** (the collection being defined) inside its own condition?
  *   **Adequate Answer:** Search for the Target's proposed name or ID within the rule logic.
  *   **Decision:**
      *   If **No Self-Reference**: **PASS** immediately.
      *   If **Yes Self-Reference**: Proceed to Step 4.
  *   **Justification:** A collection cannot safely define its own membership criteria using its own identity unless it is done via the specific "Recursive Style" (Step 5). Standard comprehension with self-reference is the primary engine of Russell's Paradox.

  ### Step 4: The Negation Check (Genuine Test)
  **Inspect:** The specific condition involving the **Target** identified in Step 3.
  **Question:** Is the self-reference **Negative**? (i.e., Does it check if a collection does *not* contain itself, or is *not* a member of the Target?)
  *   **Adequate Answer:** Look for `NOT IN`, `!=`, `EXCLUDE`, or logical negation surrounding the self-reference.
  *   **Decision:**
      *   If **Negative** (e.g., `C NOT IN C`): **REJECT**. Cite "Russell Pattern: Negative Self-Reference."
      *   If **Positive** (e.g., `C IN C`): Proceed to Step 5.
  *   **Justification:** The specific crash last quarter was caused by `x NOT IN x`. This creates an immediate contradiction ($R \in R \iff R \notin R$). Positive self-reference ($x \in x$) is not immediately contradictory but is unstable.

  ### Step 5: The Definition Style Check (Judgment Call)
  **Inspect:** The definition mechanism selected in the platform UI.
  **Question:** Is this defined using **Comprehension** (Condition-based) or **Recursive Closure** (Least Fixed Point)?
  *   **Adequate Answer:** Check the "Definition Type" dropdown or syntax prefix.
  *   **Decision:**
      *   If **Recursive Closure**: **PASS**. (Escalate only if the operation is non-terminating, which is a performance issue, not logic).
      *   If **Comprehension** with Positive Self-Reference: **ESCALATE**.
  *   **Justification:** Recursive closure is mathematically constructed to be consistent (it builds up from nothing). Comprehension with positive self-reference is a policy risk; it may be harmless, but it requires an architect to verify it doesn't interact badly with the Power Set operation.

  ### Step 6: The Power Set Interaction (Judgment Call)
  **Inspect:** Downstream dependencies (if visible) or declared intent.
  **Question:** Is there any indication this collection will be passed to the `PowerSet()` (Subcollections) operation, or is it intended to act as a "Universal" catalog?
  *   **Adequate Answer:** Check "Expected Usage" field or downstream job graph.
  *   **Decision:**
      *   If **Power Set / Universal Intent**: **ESCALATE**.
      *   If **Standard Usage**: **PASS**.
  *   **Justification:** Even a consistent collection becomes dangerous if we try to compute "All Subcollections" of a "Collection of All Collections." This is a design policy choice regarding platform limits.

  ---

  ## Application of Procedure

  ### Case 1: "The Russell Collection"
  **Proposal:** Define $R$ as the collection of all collections that do not contain themselves.
  **Rule:** `Select C Where C NOT IN C`
  **Review:**
  1.  **Type:** Collection of Collections. (Proceed)
  2.  **Search Space:** "All collections" (Unbounded). (Proceed)
  3.  **Self-Reference:** Yes, mentions $C$ (the candidate) and implicitly $R$ (the target) is part of the universe. (Proceed)
  4.  **Negation:** Yes, `NOT IN`.
  **Result:** **REJECT**.
  **Reasoning:** Step 4. This is the exact pattern that caused the quarter-end outage. It is a factual logical error, not a policy choice.

  ### Case 2: "The Self-Containing Collection"
  **Proposal:** Define $Q$ as the collection of all collections that contain themselves.
  **Rule:** `Select C Where C IN C`
  **Review:**
  1.  **Type:** Collection of Collections. (Proceed)
  2.  **Search Space:** "All collections" (Unbounded). (Proceed)
  3.  **Self-Reference:** Yes. (Proceed)
  4.  **Negation:** No, it is `IN` (Positive). (Proceed)
  5.  **Style:** Comprehension.
  **Result:** **ESCALATE**.
  **Reasoning:** Step 5. While not immediately paradoxical like Case 1, it relies on Unrestricted Comprehension with Self-Reference. Whether this is allowed is a policy decision for the architect, as it interacts unpredictably with the Power Set operation. It is a judgment call dressed as a test.

  ### Case 3: "Reachable Objects"
  **Proposal:** Define $F$ as the least collection containing Seed $S$ and closed under Operation $Op$.
  **Rule:** `LeastFixedPoint(Start=S, Step=Op)`
  **Review:**
  1.  **Type:** Collection of Objects (usually). Even if Collections, proceed.
  2.  **Search Space:** N/A (Generative).
  3.  **Self-Reference:** Implicit in "Closed under", but...
  4.  **Negation:** N/A.
  5.  **Style:** Recursive Closure.
  **Result:** **PASS**.
  **Reasoning:** Step 5. The "Least Closed" style is mathematically guaranteed to produce a consistent result (the intersection of all closed sets). It avoids the comprehension paradoxes entirely.

  ---

  ## The Cost of Safety: A False Positive Example

  **Proposal:** "The Active Catalog"
  **Definition:** A collection of all collections that have the tag `status='active'`.
  **Rule:** `Select C Where C.Tags.Contains('active')`
  **Procedure Outcome:**
  1.  **Type:** Collection of Collections. (Proceed)
  2.  **Search Space:** "All collections" (Unbounded). (Proceed)
  3.  **Self-Reference:** No. (PASS Step 3).
  *Wait, this passes Step 3.* To make this a False Positive, we must assume a stricter interpretation of Step 2 or a scenario where the reviewer is conservative.
  *Correction:* Let's adjust the procedure's Step 2 decision. If the Search Space is "All Collections", Step 2 currently says "Proceed". If I want a False Positive, I need the procedure to be stricter.
  *Revised Step 2 Decision:* If **Unbounded**, **ESCALATE**. (Because "All Collections" is the Universal Set risk).
  *Re-evaluating "Active Catalog" with Revised Step 2:*
  1.  **Type:** Collections.
  2.  **Search Space:** Unbounded ("All collections").
  **Result:** **ESCALATE**.
  **Why this is a False Positive:** This collection is harmless. It is just a filtered view. It does not create a paradox. However, because it quantifies over "All Collections," it triggers the Cantor warning.
  **Reviewer Action:** The reviewer must halt and escalate to the Architect.
  **Cost:** The Architect must spend time verifying that "Active Catalog" will not be fed into the `PowerSet` operation. This adds latency to a harmless feature. This is the tax we pay to prevent the silent corruption seen last quarter.

  ---

  ## Closing Analysis

  ### What the Procedure Cannot Settle
  This procedure cannot detect **indirect paradoxes**. If Collection A is defined safely, and Collection B is defined safely, but the *combination* of A and B creates a paradox (e.g., A references B and B references A in a specific negative loop), this checklist will miss it. It treats proposals in isolation. It also cannot detect semantic equivalence; an author could write a complex function that *effectively* computes `x NOT IN x` without using those words.

  ### Failures That Would Show It Is Wrong
  1.  **A Rejection that Proves Consistent:** If an Architect validates an **ESCALATE** case and proves it is mathematically safe *and* the platform can support it without performance degradation, the procedure is too conservative (as intended, but worth noting).
  2.  **An Acceptance that Crashes:** If a proposal **PASS**es all steps (e.g., a Recursive definition) but still causes a logical contradiction in the dataset, the procedure is fundamentally broken. This would imply the "Recursive Style" implementation on the platform is flawed.
  3.  **A False Negative:** If a proposal passes but creates a paradox when combined with *existing* collections not visible in the proposal text. (This is why the "Universal Intent" check in Step 6 is crucial).

  ### The Single Step Doing Most of the Work
  **Step 3 (The Self-Reference Check)** is the heavy lifter.
  Almost all useful data definitions are **Step 1 (Data Objects)** or **Step 3 (No Self-Reference)**.
  *   If members are data objects, we are safe.
  *   If members are collections but don't look at themselves, we are safe.
  *   The danger zone is tiny: Collections of Collections that talk about themselves.
  By filtering out 95% of proposals in Steps 1 and 3, we reserve our deep scrutiny for the 5% of cases where logical paradoxes actually live. Step 4 (Negation) is the specific trigger, but Step 3 is the gate that makes Step 4 runnable in 15 minutes.
