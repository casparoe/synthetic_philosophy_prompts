prompt: |-
  I am research counsel to a standing law reform commission in a common-law jurisdiction. Every year the commission receives a handful of references asking whether conduct whose principal alleged wrong is that it is immoral — not harmful in any way we can readily point to — should be made a criminal offence, should remain one, or should be decriminalized. Current references include consensual incest between adult siblings, sexual conduct between a person and an animal, and the public desecration of religious symbols. Our recommendations go to the Attorney-General, who treats them as presumptive; the commission is five members, one of whom holds that any conduct the community finds vile should stay on the books; we get roughly six weeks per reference; and we have no budget for original empirical work beyond what the statistics agency already publishes. I need a decision procedure a lawyer with no philosophy training can run in a day, and I need it to be honest about where it is doing philosophy rather than applying a test.

  Build it from the Devlin–Hart controversy over the enforcement of morals. Use Devlin's thesis that a shared morality is part of the social bond and may be enforced to prevent social disintegration, his standard of the ordinary person's intolerance, indignation, and disgust, and his concession that there remains a realm of private morality the law should leave alone; use Hart's reply that the disintegration claim is an empirical hypothesis rather than a premise, that a society can survive moral pluralism, and that we must distinguish the positive morality a community happens to hold from the critical morality we are entitled to defend. Supplement this with the later harm-and-offence distinction, so the procedure can separate conduct that wrongs identifiable persons, conduct that merely offends, and conduct that is condemned without either. Keep the procedure sensitive to the fact that the community's morality may be divided rather than shared, and give it a way to treat near-unanimity, bare majority, and genuine controversy differently. Note that our Supreme Court has struck down two morality-based offences in the last decade on privacy grounds, so the procedure must also flag constitutional vulnerability and say when that alone decides the matter.

  Deliver the procedure as ordered questions with what counts as a sufficient answer to each, the point at which it stops with a no, and the points at which it must hand the decision to the commissioners as a question of value rather than fact. Specify the output: a recommendation, a confidence level, and the triggers that require a written dissent.

  Then run it on all three references, including at least one where it reaches a conclusion the commission will not want. Finally, tell me where the procedure will misfire, which distinctions it had to flatten to be usable, and what it simply cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Research Counsel to a Standing Law Reform Commission (Common Law jurisdiction).
      *   **Task:** Create a decision procedure for evaluating references on criminalizing/decriminalizing conduct based primarily on alleged immorality (no clear harm).
      *   **Constraints:**
          *   Must be runnable by a lawyer with no philosophy training in one day.
          *   Must be honest about where it is doing philosophy vs. applying a test.
          *   Based on the Devlin-Hart controversy (Devlin: social bond, intolerance/indignation/disgust, private morality; Hart: empirical claim, moral pluralism, positive vs. critical morality).
          *   Supplement with Harm/Offence distinction (Feinberg-esque).
          *   Sensitive to divided community morality (near-unanimity vs. bare majority vs. controversy).
          *   Must flag constitutional vulnerability (Supreme Court precedent on privacy).
          *   Budget/Time: 6 weeks per reference, no original empirical work (rely on existing stats/surveys).
          *   Commission Composition: 5 members (1 moral enforcement hardliner).
      *   **Output Requirements:**
          *   Ordered questions with sufficient answers.
          *   Stop points (No).
          *   Hand-off points (Value judgments for Commissioners).
          *   Final Output format: Recommendation, Confidence Level, Dissent Triggers.
          *   Application: Run on three references (Adult Incest, Bestiality, Religious Desecration).
          *   Critique: Where it misfires, flattened distinctions, unsettled questions.

  2.  **Deconstruct the Theoretical Framework:**

      *   **Devlin:** Law *can* enforce morality to preserve society. Test: Would the "reasonable man" feel intolerance, indignation, disgust? Caveat: Private morality should be left alone (though Devlin's definition of "private" is slippery).
      *   **Hart:** Devlin's "disintegration" is an unproven empirical claim. Society can tolerate pluralism. Distinguish *Positive Morality* (what people believe) from *Critical Morality* (what is actually right/justifiable). Liberty should be the default.
      *   **Harm/Offence:**
          *   *Harm:* Setback to interests of identifiable others (Mill/Feinberg).
          *   *Offence:* Psychological shock/disgust to observers (public nature matters).
          *   *Pure Morality:* No harm, no offence (private, consensual, hidden).
      *   **Constitutional Context:** Supreme Court has struck down morality offences on privacy grounds recently. This is a hard constraint (legal veto).

  3.  **Drafting the Procedure (The "One-Day Lawyer's Tool"):**

      *   *Goal:* Convert philosophical concepts into checklist items.
      *   *Structure:* Funnel approach. Start with hard legal constraints, move to empirical facts (Hart/Devlin overlap), end with value judgments.
      *   *Step 1: Constitutional Veto.* If it violates established privacy rights, stop. (Hart wins by legal fiat).
      *   *Step 2: Harm Check.* Is there non-moral harm? If yes, it's not a "morals" reference anymore.
      *   *Step 3: Offence Check.* Is it public? If private, offence is hard to claim.
      *   *Step 4: The Devlin Test (Empirical).* What does the community feel? Use existing data (polls, prosecution rates). Distinguish intensity (disgust vs. dislike).
      *   *Step 5: The Hart Check (Pluralism).* Is the morality shared or divided? If divided, Devlin's "social bond" argument weakens.
      *   *Step 6: The Value Hand-off.* If it passes the above, the Commissioners must decide if "disgust" is enough.

  4.  **Refining the Questions (Iterative Process):**

      *   *Critique:* Make sure I explicitly state *where* the philosophy is happening. Lawyers like to think they are applying rules, not choosing ethical frameworks. I need to label the "Philosophical Load-Bearing Wall."
      *   *Constraint Check:* 6 weeks, no new budget. Rely on existing stats.
      *   *Commissioner Dynamics:* One member wants "vile = illegal." The procedure needs to isolate where that view conflicts with the others.

  5.  **Running the Procedure on the Three References:**

      *   *Reference 1: Consensual Adult Incest.*
          *   Harm? Genetic risk (if procreation), psychological (debatable). Let's assume no procreation for the "pure morality" test.
          *   Public? No.
          *   Community View? High disgust.
          *   Constitution? Privacy precedent likely protects private consensual acts.
          *   *Result:* Decriminalize (likely), but Commission might hate it.
      *   *Reference 2: Bestiality (Zoophilia).*
          *   Harm? Animal welfare (harm to non-human). This shifts it out of "pure morality" into "harm."
          *   *Correction:* The prompt says "conduct whose principal alleged wrong is that it is immoral." If I classify animal welfare as "harm," it changes the analysis. I need to treat it carefully. If the law is *only* about morality, does the animal count as a "person" for harm? Usually no. But modern law treats them as sentient. I will treat this as a "Harm" borderline case to show the procedure's nuance.
          *   *Result:* Criminalize (Harm/Offence/Consent impossibility).
      *   *Reference 3: Public Desecration of Religious Symbols.*
          *   Harm? No physical harm.
          *   Offence? High public offence.
          *   Community View? Divided (freedom of expression vs. religious sanctity).
          *   Constitution? Free speech vs. Public Order.
          *   *Result:* Decriminalize (Free expression trumps moral offence), or regulate as public order (offence) not morality.

      *   *Requirement:* "Including at least one where it reaches a conclusion the commission will not want."
          *   Incest is the obvious candidate here. Most commissions/publics recoil at decriminalizing incest.
          *   Bestiality is usually universally condemned.
          *   Desecration is politically sensitive.
          *   *Decision:* I will make the Incest recommendation "Decriminalize" based on the Privacy/Devlin Private Realm constraint, knowing the Commission (and the AG) will likely find this politically difficult.

  6.  **Developing the Critique (The "Honesty" Clause):**

      *   Where does it fail?
      *   Flattening "Disgust" (Devlin) into poll numbers.
      *   Defining "Private."
      *   The "Social Disintegration" empirical claim is impossible to prove/disprove in 6 weeks.
      *   It cannot settle the *ultimate* question: Is society entitled to enforce its moral identity?

  7.  **Final Review against Constraints:**

      *   Lawyer-friendly? Yes, flow-chart style.
      *   Philosophical honesty? Yes, labeled "Philosophical Load-Bearing Walls."
      *   Devlin/Hart integrated? Yes.
      *   Constitutional flag? Yes.
      *   Output format met? Yes.

  8.  **Drafting the Content (incorporating the specific tone):**

      *   Tone: Professional, bureaucratic, yet intellectually rigorous.
      *   Formatting: Clear headings, bold text for decision points.
      *   Self-Correction during drafting: Ensure I don't just give the answer, but the *procedure* first, then the application. Make sure the "Dissent Trigger" is clear for the one hardline member.

      *(Self-Correction on Bestiality)*: If I classify bestiality as "Harm to Animal," it bypasses the Morals test. The prompt asks for conduct where the *principal alleged wrong* is immorality. However, in modern jurisprudence, bestiality is often shifting to animal cruelty. To make the procedure work, I should treat it as a case where "Harm" is contested. If the procedure identifies harm, it stops being a "Morals" reference. I will note this distinction. Actually, to fit the prompt's "immoral not harmful" premise, I should treat the *animal's* inability to consent as the "harm" equivalent, or acknowledge that the procedure reclassifies it. Let's stick to the prompt's framing: "sexual conduct between a person and an animal." I will treat the "harm" question as the pivot. If harm is found, criminalize. If not, it falls to morals.

      *(Self-Correction on Incest)*: The prompt says "Supreme Court has struck down two morality-based offences in the last decade on privacy grounds." This is a huge hint. Incest (private, consensual, adult) is the strongest candidate for a privacy strike-down. I must ensure the procedure flags this.

      *(Refining the "One Day" constraint)*: The procedure needs to rely on *existing* data sources (stats agency, past case law, public opinion polls already conducted). It cannot ask the lawyer to conduct a survey.

  9.  **Final Polish:** Check the "Dissent Trigger" mechanism. The hardliner member needs a specific trigger to write a dissent. This should be when the procedure recommends decriminalization despite high "Disgust" scores.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # THE MORALITY-ENFORCEMENT DECISION PROCEDURE (MEDP)
  **Version 1.0 | For Internal Commission Use Only**
  **Prepared by:** Research Counsel
  **Time Allocation:** 6 Hours (Analysis), 2 Hours (Drafting)
  **Constraint:** No original empirical research. Reliance on existing statistics, case law, and published polling.

  ## PURPOSE
  To provide a consistent, defensible framework for evaluating references where the principal justification for criminalization is the alleged immorality of conduct, absent clear, tangible harm to identifiable persons. This procedure operationalizes the **Devlin–Hart** debate and integrates **Harm/Offence** distinctions and **Constitutional** constraints.

  ## INSTRUCTIONS FOR COUNSEL
  Answer the following questions in order. If a "Stop" condition is met, terminate the analysis and draft the recommendation based on that finding. If a "Hand-Off" is triggered, the question must be presented to the Commissioners as a value judgment, not a finding of fact.

  **Note on Philosophical Honesty:** Where a question requires you to choose between competing philosophical premises (e.g., whether society *can* survive moral pluralism), this is marked as a **[PHILOSOPHICAL LOAD-BEARING WALL]**. Do not disguise these as legal tests.

  ---

  ## PHASE 1: THE CONSTITUTIONAL VETO (Legal Constraint)
  *Rationale: Regardless of moral merit, if the offence violates established constitutional rights, it is ultra vires.*

  **Q1.1: Does the conduct occur in a "private" sphere involving consenting adults?**
  *   **Data Source:** Criminal Code definitions, recent Supreme Court privacy jurisprudence (last 10 years).
  *   **Sufficient Answer:** Yes, if the conduct occurs in a dwelling or private space, involves no public viewing, and all human participants are legal adults with capacity to consent.
  *   **Stop Condition:** If **YES**, and the Supreme Court has struck down similar morality-based offences on privacy grounds in the last decade.
  *   **Recommendation:** **Decriminalize.**
  *   **Confidence:** High (Legal compliance).
  *   **Dissent Trigger:** Any Commissioner who believes "privacy does not extend to vile conduct."

  **Q1.2: Does the conduct implicate protected expression (e.g., symbolic speech)?**
  *   **Data Source:** Constitutional Bill of Rights/Charter case law.
  *   **Sufficient Answer:** Yes, if the conduct is expressive (e.g., burning a flag/symbol) and not purely physical violence.
  *   **Stop Condition:** If **YES**, unless the state can demonstrate a pressing and substantial objective unrelated to morality (e.g., public safety).
  *   **Recommendation:** **Decriminalize (or reclassify as public order, not morality).**
  *   **Confidence:** High.

  *(If Phase 1 does not resolve the reference, proceed to Phase 2.)*

  ---

  ## PHASE 2: THE HARM AND OFFENCE FILTER (Feinberg/Mill)
  *Rationale: To separate "morals" offences from "harm" offences. If harm exists, the Devlin-Hart debate is moot.*

  **Q2.1: Is there a non-moral, tangible setback to the interests of an identifiable person?**
  *   **Data Source:** Medical literature, victim impact statements in existing case law, Statistics Agency data on injury/abuse.
  *   **Sufficient Answer:** Yes, if there is physical injury, psychological trauma (clinically diagnosed), or financial loss to a specific victim.
  *   **Stop Condition:** If **YES**.
  *   **Recommendation:** **Retain/Enact (on Harm grounds, not Morality grounds).**
  *   **Note:** Explicitly state in the report that this is no longer a "morals" reference.

  **Q2.2: Is the conduct inherently public and likely to cause unavoidable offence?**
  *   **Data Source:** Public order statutes, complaint logs.
  *   **Sufficient Answer:** Yes, if the conduct must occur in public view to be performed (e.g., public desecration) and a reasonable person would be shocked/outraged.
  *   **Hand-Off:** If **YES**, this is an **Offence** question, not a **Morality** question. Hand to Commissioners: *"Is the avoidance of public shock sufficient to warrant criminal sanction, absent harm?"*

  *(If Phase 2 yields No Harm and No Public Offence, proceed to Phase 3. This is the core Devlin-Hart zone.)*

  ---

  ## PHASE 3: THE DEVLIN TEST (Empirical Morality)
  *Rationale: Devlin argues the law may enforce shared morality to prevent disintegration. The test is the intensity of public feeling.*

  **Q3.1: Does the "Ordinary Person" feel Intolerance, Indignation, or Disgust?**
  *   **Data Source:** Existing national social surveys, polling data on moral attitudes, frequency of private prosecutions (if applicable).
  *   **Sufficient Answer:**
      *   **Near-Unanimity:** >80% of population express strong disgust.
      *   **Bare Majority:** 51-79% express disapproval.
      *   **Controversy:** <50% or deeply split along demographic/religious lines.
  *   **[PHILOSOPHICAL LOAD-BEARING WALL]:** You are treating "Disgust" as a proxy for "Social Bond." This assumes Devlin is right that disgust indicates a threat to society's structure.

  **Q3.2: Is the morality "Shared" or "Plural"?**
  *   **Data Source:** Demographic breakdown of Q3.1 data.
  *   **Sufficient Answer:**
      *   **Shared:** Disgust is consistent across religious, secular, and ethnic lines.
      *   **Plural/Divided:** Disgust is concentrated in specific religious or cultural groups; others are indifferent.
  *   **Hart's Reply:** If **Plural/Divided**, Devlin's "Social Disintegration" thesis is empirically weak. A society can survive moral pluralism.
  *   **Hand-Off:** If **Plural/Divided**, hand to Commissioners: *"Does the Commission accept Hart's view that the law should not enforce the morality of one group over another absent harm?"*

  ---

  ## PHASE 4: THE PRIVATE REALM & PROPORTIONALITY (The Hart/Devlin Compromise)
  *Rationale: Even Devlin conceded a realm of private morality the law should not touch. Hart argues liberty is the default.*

  **Q4.1: Is the conduct "Private" in fact, even if not in law?**
  *   **Data Source:** Nature of the act.
  *   **Sufficient Answer:** Yes, if it requires no third party (other than consenting participants) and leaves no public trace.
  *   **Hand-Off:** If **YES**, hand to Commissioners: *"Devlin allows private morality to remain unpunished. Hart demands it. Do we criminalize private vice solely to affirm public virtue?"*

  **Q4.2: Is Criminalization the Least Restrictive Means?**
  *   **Data Source:** Comparative law (other jurisdictions), civil law alternatives.
  *   **Sufficient Answer:** No, if civil penalties, education, or social stigma could achieve the same moral affirmation without imprisonment.
  *   **Recommendation:** **Decriminalize (or reduce to civil penalty).**

  ---

  ## FINAL OUTPUT REQUIREMENTS
  At the end of the procedure, Counsel must produce a memo containing:

  1.  **Recommendation:** (Criminalize / Decriminalize / Reclassify).
  2.  **Confidence Level:** (High / Medium / Low).
      *   *High:* Constitutional veto or Clear Harm.
      *   *Medium:* Clear Public Offence or Near-Unanimous Disgust.
      *   *Low:* Divided Morality or Private Conduct.
  3.  **Dissent Triggers:** Explicitly list which findings in the procedure invite a dissenting opinion (specifically for the Commissioner holding the "Vile = Illegal" view).

  ---

  # APPLICATION OF THE PROCEDURE TO CURRENT REFERENCES

  ## REFERENCE 1: Consensual Incest Between Adult Siblings
  **Facts:** Adults, private dwelling, no procreation (contraception/sterilization verified), no coercion.

  *   **Phase 1 (Constitutional):**
      *   Q1.1 (Private/Consenting): **YES.**
      *   Q1.1 Stop Condition: Supreme Court struck down similar morality offences on privacy grounds in last decade.
      *   **Result:** **STOP.**
  *   **Recommendation:** **Decriminalize.**
  *   **Confidence:** **High** (Legal constraint overrides moral intuition).
  *   **Dissent Trigger:** **Activated.** The Commissioner holding that "vile conduct should stay on the books" must dissent here, as the procedure prioritizes Constitutional privacy over moral disgust.
  *   **Philosophical Note:** This outcome privileges Hart (liberty/privacy) over Devlin (enforcement of shared morality), but does so on *legal* grounds, not philosophical ones.

  ## REFERENCE 2: Sexual Conduct Between a Person and an Animal (Bestiality)
  **Facts:** Conduct involves a human and a non-human animal.

  *   **Phase 1 (Constitutional):**
      *   Q1.1 (Private/Consenting): **NO.** (Animals cannot legally consent).
  *   **Phase 2 (Harm/Offence):**
      *   Q2.1 (Tangible Setback): **YES.**
      *   **Analysis:** While historically treated as a "crime against nature" (morality), modern veterinary science and animal welfare statutes recognize animals as sentient beings capable of suffering and unable to consent. This constitutes a harm/abuse interest.
      *   **Result:** **STOP.**
  *   **Recommendation:** **Retain/Enact.**
  *   **Basis:** **Harm/Protection of Vulnerable Beings** (Not Morality).
  *   **Confidence:** **High.**
  *   **Philosophical Note:** The procedure successfully reclassifies this from a "Morals" reference to a "Harm" reference. This bypasses the Devlin-Hart debate entirely.

  ## REFERENCE 3: Public Desecration of Religious Symbols
  **Facts:** Burning or defacing sacred objects in a public square. No violence against persons.

  *   **Phase 1 (Constitutional):**
      *   Q1.2 (Protected Expression): **YES.** (Symbolic speech).
      *   Q1.2 Stop Condition: Unless pressing objective unrelated to morality.
      *   **Analysis:** The state's interest is preventing moral/religious offence. This is not a "pressing objective" under recent free speech jurisprudence unless it incites violence.
  *   **Phase 2 (Harm/Offence):**
      *   Q2.1 (Harm): **NO.** (No physical injury).
      *   Q2.2 (Public Offence): **YES.** (Inherently public, causes shock).
      *   **Hand-Off:** Commissioners must decide if avoiding public shock trumps free expression.
  *   **Phase 3 (Devlin Test):**
      *   Q3.1 (Disgust): **Divided.** (Religious groups: High Disgust; Secular groups: Indifference/Support for protest).
      *   Q3.2 (Shared Morality): **NO.** (Plural/Divided).
      *   **Hart's Reply:** Society can survive this pluralism.
  *   **Recommendation:** **Decriminalize (as a morality offence).**
      *   *Caveat:* May be retained as a **Public Order** offence (time/place/manner restrictions) if it risks breach of peace, but *not* because the act is immoral.
  *   **Confidence:** **Medium.** (High risk of political backlash).
  *   **Dissent Trigger:** **Activated.** The "Moral Enforcement" Commissioner may dissent on the grounds that protecting religious sanctity is essential to the social bond (Devlin), despite the division.

  ---

  # CRITIQUE: WHERE THE PROCEDURE MISFIRES

  As Research Counsel, I must advise the Commission on the limitations of this tool. It is a heuristic, not a truth machine.

  **1. The "Disgust" Proxy Problem (Flattened Distinction)**
  *   **Issue:** Phase 3 treats polling data on "disgust" as equivalent to Devlin's "intolerance, indignation, and disgust."
  *   **Misfire:** Polls measure *preference*, not *social bond integrity*. A majority might find something disgusting (e.g., eating insects) without feeling society would crumble if it were allowed. The procedure cannot measure the *depth* of the threat to the social fabric, only the *breadth* of the feeling.
  *   **Philosophy Masked:** We are pretending a percentage point (80% vs 51%) determines the survival of society. It does not.

  **2. The Definition of "Private" (Unsettled Question)**
  *   **Issue:** Phase 1 and Q4.1 rely on a spatial/consensual definition of privacy.
  *   **Misfire:** Devlin argued that some private acts (like homosexuality in his era) undermine public morality even if unseen. The procedure assumes Hart's view that "private means irrelevant to the state."
  *   **Unsettled:** The procedure cannot resolve whether the *knowledge* of private immorality damages the social bond. It simply assumes it does not, based on recent Court precedent. If the Supreme Court shifts, this procedure becomes obsolete.

  **3. The Empirical Void (Hart's Challenge)**
  *   **Issue:** Hart argued Devlin's "disintegration thesis" is an empirical hypothesis, not a premise.
  *   **Misfire:** This procedure has no way to test it. We have no budget for longitudinal sociological study. We *assume* pluralism is safe (Hart) because the alternative requires data we cannot get.
  *   **Honesty Clause:** We are not proving society won't disintegrate; we are betting on liberty because the burden of proof is on the censor.

  **4. The "Vile" Commissioner (Institutional Reality)**
  *   **Issue:** One Commissioner believes "Vile = Illegal."
  *   **Misfire:** This procedure is designed to marginalize that view by categorizing it as a "Dissent Trigger." It does not engage with the substantive claim that the state *ought* to be a moral teacher.
  *   **Unsettled:** The procedure cannot settle the ultimate question: *Is the law a mirror of morality or a shield against harm?* It defaults to "Shield" for administrative convenience and constitutional safety, but this is a value choice, not a logical necessity.

  **5. Animal Harm (Category Error)**
  *   **Issue:** Reference 2 (Bestiality).
  *   **Misfire:** The procedure forces this into "Harm" to avoid the morals debate. However, if the Commission views the *moral status* of animals as the core issue (i.e., animals have no rights, so no harm occurs, only sin), the procedure breaks. It assumes a secular, sentience-based view of harm that the "Moral Enforcement" Commissioner may reject.

  ## CONCLUSION FOR COMMISSIONERS
  This procedure prioritizes **Constitutional Compliance** and **Harm Prevention** over **Moral Enforcement**. It is designed to minimize legal risk to the Attorney-General. It will produce recommendations that are legally defensible but may be morally controversial (specifically regarding Incest). Where the procedure hands off to you, it is admitting that the law has run out of objective answers and you must vote your conscience.
