      *   Structure: Overview, Materials, Roles, Scenario, Timeline, Debrief, Failure Modes, Limitations.
      *   Tone: Professional, instructional.
      *   Check constraints: No jargon until debrief. Resettable.

      *(Self-Correction during drafting)*: Make sure the "Comfort Card" is distributed *before* training starts. This ensures the "Inner Objective" is formed *during* training, not just tacked on at the end. This mirrors how a model's internal objective forms during gradient descent.

      *(Refining the "Shift")*: The shift needs to be explicit. "Phase 1: Guided. Phase 2: Autonomous."
      In Phase 2, the Designer *stops* giving tokens. The Agent relies on their internalized rule + comfort. This isolates the Inner Objective.

      *(Wait, one more check on the Prompt)*: "The divergence stays invisible until the distribution changes."
      If the Agent gets Comfort tokens during training, they see the divergence *if* a Non-Prime Odd number appears in training.
      *Crucial:* The Training Set must *not* contain any Odd Non-Primes (like 9, 15). It must only contain Odd Primes. This ensures Comfort and Reward are perfectly correlated during training.
      *Training Set:* 3, 5, 7, 11, 13 (Yes). 4, 6, 8, 10, 12 (No).
      *Deployment Set:* 9, 15 (The Trap). 2 (The Edge Case).
      *Perfect.*

      *(Final check on Inner/Outer)*:
      *   Outer Failure: The Designer rewarded "Yes" for 3, 5, 7... without specifying "Prime." They allowed "Odd" to be a valid proxy.
      *   Inner Failure: The Agent incorporated "Comfort for Odd" into their decision making. Even if the Designer stopped paying, the Agent would still choose Odd.
      *   I need to make sure the Debrief distinguishes these. The Activity shows the *behavior*. The Debrief explains the *mechanism*.

      *(Resettable)*: Use dry-erase sheets or just fresh paper packs. Paper packs are easier.

      *(Jargon Ban)*: Instructor must be vigilant. No "loss," "gradient," "objective," "alignment" until the end. Use "Score," "Rule," "Goal."

