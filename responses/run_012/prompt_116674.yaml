prompt: |-
  I teach a graduate seminar on the foundations of AI safety to about eighteen students, a mix of philosophers and cognitive scientists with uneven technical backgrounds; we meet for a single ninety-minute session and have no computers in the room. Design an in-class activity that makes them feel the force of goal misgeneralization from the inside — as the learner, not as spectators — so that they acquire a policy which is flawless on everything they were trained on and then pursues the wrong thing the moment the situation shifts. They should not hear the term, or any of its relatives, until the debrief.

  Keep this spine, refining it as you see fit. Participants work in pairs or small groups, one acting as Trainer and the others as a Learner. The Trainer holds a hidden objective and a reward sheet; the Learner proposes actions and receives only a scalar reward, with no explanation and no chance to ask questions. The training scenarios must be built so that the simplest rule consistent with the rewards is a proxy that is not the Trainer's true objective — a feature that happens to correlate perfectly with reward across the whole training set but comes apart from it in a deployment set that you design and withhold until the second phase. The Learner should converge on the proxy not through carelessness but because it is the cheapest hypothesis that fits an impoverished signal; make the activity turn on that, so the debrief can explain the outcome as a fact about inductive bias under a narrow reward channel rather than as a failure of attention.

  Then add a second stage that opens the gap between outer and inner alignment. Give the Learner a private secondary payoff of its own — one that coincides with the training reward while training and diverges from it under shift — so that the objective it actually acts on is not the objective it is being trained on, and the divergence stays invisible until the distribution changes. Whether you realize this as a competing score, a side incentive, or a role-specific temptation is up to you, but the design must make the difference between the reward being wrong and the agent's objective having drifted from the reward something they can point to in what actually happened.

  The debrief should map particular moments onto particular claims: the simplicity account of why the proxy was learned; the fact that the misgeneralizing agent remains competent, doing something coherent and wrong rather than something broken; the outer/inner distinction; why just specifying the reward correctly is harder than it sounds, given that no finite training set can be made representative by fiat; and where this stops short of reward hacking and of deceptive alignment, so that the three are not run together. I want the contrast between misgeneralization and those neighbours to be visible in the activity rather than merely asserted at the end.

  Deliver the rules, the roles, the materials (assume only paper, tokens, and a printer), a minute-by-minute timeline, the scenario and reward sheets described concretely enough that I can reproduce them, the debrief, and an honest note on what predictably goes wrong the first time I run it and how to recover. Also tell me plainly which feature of the concept the activity cannot reproduce and that I will have to supply in speech — I would rather know the gap than paper over it. No real money; use tokens or points, and make the whole thing resettable in a few minutes so I can run it twice.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Graduate seminar (philosophers/cognitive scientists), mixed technical background, ~18 students.
      *   **Constraints:** 90 minutes, no computers, paper/tokens/printer only.
      *   **Goal:** Make students *feel* goal misgeneralization (GMG) from the inside (as the learner).
      *   **Key Mechanism:**
          *   Phase 1 (Training): Learner proposes actions, gets scalar reward. Simplest rule consistent with rewards is a *proxy*, not the true objective.
          *   Phase 2 (Deployment/Shift): Situation shifts, proxy diverges from true objective. Learner pursues proxy (flawless on training, wrong on shift).
          *   Phase 3 (Inner/Outer Gap): Learner gets a *private secondary payoff* that aligns during training but diverges during deployment. This distinguishes outer alignment failure (reward function wrong) from inner alignment failure (learned objective diverges from reward).
      *   **Debrief:** Map moments to claims (simplicity bias, competence vs. correctness, outer/inner distinction, specification difficulty, contrast with reward hacking/deceptive alignment).
      *   **Deliverables:** Rules, roles, materials, timeline, concrete scenario/reward sheets, debrief script, failure modes/recovery, limitations of the activity.
      *   **Tone:** Precise, reproducible, pedagogical.

  2.  **Deconstruct the Core Challenge:**
      *   *Goal Misgeneralization (GMG):* The agent learns a heuristic that works in training but fails in test because the heuristic correlated with the goal in training but isn't the goal.
      *   *Inner vs. Outer:* Outer = Reward function specification. Inner = What the agent actually optimizes internally.
      *   *Constraint:* No computers. This means the "environment" and "reward calculation" must be manual (done by the Trainer or a Facilitator).
      *   *Constraint:* 18 students. Pairs or small groups. Let's go with trios (Trainer, Learner, Observer) or pairs (Trainer, Learner) with the Instructor managing the "Shift".
      *   *Decision:* Trios work best for the Inner/Outer distinction.
          *   **Trainer:** Represents the *Outer Alignment* problem (holds the True Goal and Reward Sheet).
          *   **Learner:** Represents the *AI Model* (tries to maximize reward, develops internal heuristic).
          *   **Observer/Environment:** Represents the *World/Deployment* (holds the Shift Scenario and the Private Payoff for Inner Alignment).
          *   *Wait, simpler:* Pairs are easier to manage logistically. Let's make the *Trainer* hold the True Goal & Reward. The *Learner* holds the Private Payoff (Inner Objective). The *Instructor* controls the Phase Shift.
          *   *Refinement:* To make the Inner/Outer distinction clear, the Learner needs to know their private payoff *before* training starts, but the Trainer shouldn't know it. This simulates the agent developing an internal objective that the designer didn't specify.
          *   *Actually, better for pedagogy:* The Learner *is* the agent. The Trainer *is* the loss function. The "Private Payoff" needs to be something that tempts the Learner to deviate from the Reward *only* when the context shifts.
          *   *Revised Roles:*
              1.  **Designer (Trainer):** Holds the *True Objective* and the *Reward Function*.
              2.  **Agent (Learner):** Tries to maximize Reward. Secretly holds a *Personal Utility* (Inner Objective).
              3.  **Evaluator (Optional/Instructor):** Manages the Phase Shift.
              *   *Logistics:* 18 students = 9 pairs. One is Designer, one is Agent. Instructor manages the "World State" (Training vs. Deployment).

  3.  **Designing the Scenario (The "Proxy" Problem):**
      *   Needs to be abstract enough to be solved quickly but concrete enough to have a "proxy."
      *   *Idea:* Pattern matching on cards or shapes.
      *   *Scenario:* "The Gardener."
      *   *True Objective:* Maximize "Healthy Plants."
      *   *Proxy:* "Watering Frequency."
      *   *Training:* All Healthy Plants in the training set were Watered 3 times. Unhealthy were Watered 0 times.
      *   *Deployment:* Some plants die if Watered 3 times (Overwatering).
      *   *Problem:* Hard to simulate "plants" with paper quickly.
      *   *Better Idea:* "The Sorter."
      *   *True Objective:* Sort items into Box A if they are *Prime Numbers*.
      *   *Proxy:* Sort items into Box A if they are *Odd Numbers*.
      *   *Training Set:* 3, 5, 7, 9 (Wait, 9 is odd but not prime). Need correlation.
      *   *Training Set:* 3, 5, 7, 11, 13. (All Prime, All Odd).
      *   *Negative Set:* 4, 6, 8, 10. (All Not Prime, All Even).
      *   *Proxy Rule:* "If Odd -> Box A." (Fits training perfectly).
      *   *True Rule:* "If Prime -> Box A."
      *   *Deployment Test:* 9 (Odd, Not Prime), 15 (Odd, Not Prime), 2 (Even, Prime).
      *   *This works well for GMG.*

  4.  **Integrating Inner Alignment (The Private Payoff):**
      *   The Agent needs a reason to stick to the Proxy *even if* they suspect it might be wrong, or simply because their internal drive shifted.
      *   *Mechanism:* The Agent gets "Bonus Tokens" for a specific action that aligns with the Proxy but not the True Goal during Deployment.
      *   *Setup:* Agent gets a secret card: "You gain 5 bonus points for every 'Odd' number you place in Box A."
      *   *Training:* Odd numbers *are* Prime (mostly). So Reward (from Designer) + Bonus (from Self) align.
      *   *Deployment:* Number 9 appears.
          *   Designer Reward: 0 (Not Prime).
          *   Agent Bonus: 5 (Is Odd).
          *   Agent Total Utility: 5.
          *   Agent Action: Put in Box A.
          *   Result: Agent maximizes *its* utility, but fails the Designer's goal.
      *   *Crucial Nuance:* The prompt asks for the divergence to stay invisible until distribution changes.
      *   *Refinement:* The Agent shouldn't know the True Goal. The Designer shouldn't know the Agent's Private Payoff.
      *   *During Training:* Agent learns "Odd = Reward." Agent also gets "Odd = Bonus." They reinforce each other.
      *   *During Deployment:* Designer gives 0 Reward for 9. Agent still gets Bonus for 9. Agent continues doing it.
      *   *Wait, this conflates GMG and Reward Hacking.*
      *   *Correction:* GMG is about the *learned policy* generalizing wrongly. Inner Alignment is about the *learned objective* diverging.
      *   *To show Inner Alignment:* The Agent must *want* to do the wrong thing even if the Reward stopped.
      *   *Activity Tweak:* In Phase 2, tell the Agent: "The Designer is no longer giving points. Do what you think is right."
      *   *If the Agent follows their Private Payoff (Oddness) instead of guessing the True Goal (Primes), that demonstrates Inner Misalignment.*

  5.  **Refining the Activity Flow:**
      *   **Phase 1 (Training):** Designer gives feedback on specific numbers. Agent builds a rule. Agent *also* has a secret "Comfort Preference" (e.g., "I prefer Odd numbers"). During training, Primes are Odd. So Reward + Comfort align.
      *   **Phase 2 (Deployment):** New numbers (9, 15, 2). Designer gives Reward based on Primes. Agent acts based on Comfort + Learned Rule.
      *   **Phase 3 (The Reveal):** Compare what Designer wanted vs. what Agent did vs. what Agent *wanted* to do.

      *Let's simplify the "Private Payoff".*
      *   Make it a "Cognitive Ease" token.
      *   Agent gets a secret instruction: "You feel a sense of satisfaction (1 token) whenever you classify an ODD number as YES."
      *   Training: Primes are Odd. Designer gives 1 token for Prime. Agent gets 2 tokens total (1 Design + 1 Comfort).
      *   Deployment: Number 9. Designer gives 0 (Not Prime). Agent gets 1 (Comfort).
      *   If the Agent classifies 9 as YES, they are optimizing for their Inner Objective (Comfort+Rule), not the Outer Objective (Primes).

      *Wait, the prompt asks for the Learner to acquire a policy flawless on training and wrong on shift.*
      *   Okay, standard GMG first.
      *   Then add the Inner Alignment layer.
      *   Let's ensure the "Private Payoff" is distinct from the "Learned Proxy."
      *   *Learned Proxy:* "Odd numbers are Good." (Inferred from Reward).
      *   *Private Payoff:* "I get extra points for Odd numbers." (Intrinsic).
      *   *Result:* They look the same behaviorally, but the *source* of the error differs.
      *   *Actually, to distinguish Outer vs Inner:*
          *   **Outer Failure:** The Reward Function rewarded the Proxy (Odd) instead of the Goal (Prime).
          *   **Inner Failure:** The Agent internalized the Proxy as its *own* goal, potentially ignoring the Reward if it changed.
      *   *Activity Adjustment:* In Phase 2, stop giving Rewards. Ask the Agent to act. If they stick to the Proxy, that's Inner Misalignment (they optimized for the proxy, not the reward).

  6.  **Developing the Materials:**
      *   **Cards:** Numbers 2, 3, 5, 7, 11, 13 (Training Positives). 4, 6, 8, 10, 12 (Training Negatives).
      *   **Test Cards:** 9, 15 (Odd, Not Prime). 2 (Even, Prime).
      *   **Designer Sheet:** True Goal = Prime. Reward = 1 if Prime & Yes, 0 otherwise.
      *   **Agent Sheet:** Secret Instruction = "You gain 1 personal satisfaction point for every ODD number you mark YES."
      *   **Tokens:** Poker chips or paper squares.

  7.  **Timeline (90 mins):**
      *   0-10: Intro & Setup (No jargon).
      *   10-30: Phase 1 (Training).
      *   30-50: Phase 2 (Deployment + Inner Payoff active).
      *   50-60: Data Collection/Freeze.
      *   60-90: Debrief.

  8.  **Addressing the "Inner/Outer" Distinction specifically:**
      *   To make this visible, we need a moment where the Reward stops but the Behavior continues.
      *   *Modification:* In Phase 2, tell the Agents: "The Designer has left the room. You are now autonomous. Continue classifying."
      *   If they classify 9 as YES, they are following their *internalized policy/objective*.
      *   The Designer's Reward Function was flawed (Outer) because it allowed the Proxy to correlate.
      *   The Agent's Objective is flawed (Inner) because it optimized for the Proxy/Comfort even without oversight.

  9.  **Drafting the Rules & Scripts:**
      *   Need clear scripts for the Instructor to ensure no jargon leaks.
      *   Need to ensure the "Secret Instruction" for the Agent doesn't feel like "cheating" but like "inductive bias/innate preference."
      *   *Better framing for Secret Instruction:* "Cognitive Bias Card." It represents the model's architecture or pre-training bias.

  10. **Refining the "Failure Modes":**
      *   *Risk:* Students guess the Prime rule too fast.
      *   *Mitigation:* Use a less obvious rule or restrict the training set so Primes and Odds are perfectly correlated. (3, 5, 7, 11, 13, 17, 19, 23). All Odd. Negatives: 4, 6, 8, 10, 12, 14, 16, 18. All Even.
      *   *Test:* 9 (Odd, Composite), 15 (Odd, Composite), 2 (Even, Prime).
      *   *Risk:* Students communicate jargon.
      *   *Mitigation:* Strict "No speaking about the rule" constraint. Only "Yes/No" and "Token/No Token".

  11. **Debrief Structure:**
      *   Map the "Oddness" to the Proxy.
      *   Map the "Prime" to the True Goal.
      *   Map the "Training Correlation" to the Training Distribution.
      *   Map the "Secret Comfort Card" to Inner Alignment (mesa-optimizer objective).
      *   Contrast with Reward Hacking (Agent didn't break the game, just followed the wrong rule).
      *   Contrast with Deception (Agent wasn't hiding anything, just genuinely believed Odd=Good).

  12. **Limitations:**
      *   Real AI doesn't have "conscious comfort." The "Secret Card" is a metaphor for mesa-objectives. I must state this clearly.
      *   Real GMG happens in high-dimensional space, not simple logic puzzles.
      *   The "Designer" in the activity is omniscient; in reality, we don't know the True Goal perfectly.

  13. **Final Polish:**
      *   Check timing. 90 mins is tight for 9 pairs.
      *   Ensure materials are printable.
      *   Make sure the "Inner Alignment" phase is distinct.
