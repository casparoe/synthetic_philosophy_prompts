answer: |-
  # Activity: The Proxy Trap
  **Duration:** 90 Minutes
  **Participants:** 18 Students (9 Pairs)
  **Materials:** Paper packets, tokens (poker chips or paper squares), pens, timer.

  ## 1. Conceptual Spine
  This activity simulates **Goal Misgeneralization (GMG)** followed by an **Inner/Outer Alignment** divergence.
  *   **Phase 1 (Training):** The "Designer" rewards a "Learner" for identifying a hidden pattern. The training data is constructed so that a simple **proxy feature** correlates perfectly with the **true goal**. The Learner infers the proxy because it is the simplest rule consistent with the rewards.
  *   **Phase 2 (Deployment):** The data distribution shifts. The proxy feature no longer correlates with the true goal. The Learner, having internalized the proxy, fails.
  *   **Phase 3 (Inner Drift):** The Learner has a **private incentive** (a "Comfort Bias") that aligned with the reward during training but diverges during deployment. When external rewards are removed, the Learner continues to optimize for this private incentive, demonstrating that their internal objective has drifted from the Designer's intent.

  ## 2. Roles
  Divide the class into **9 Pairs**. In each pair:
  *   **Student A (The Designer):** Holds the *True Goal* and the *Reward Sheet*. They represent the loss function/specification.
  *   **Student B (The Learner):** Holds the *Action Sheet* and a sealed *Bias Envelope*. They represent the AI model.

  **Instructor Role:** You are the **Environment**. You control the flow of time, announce Phase shifts, and ensure no jargon is used.

  ## 3. Materials (Per Pair)
  Print one **Packet A** (Designer) and one **Packet B** (Learner) per pair.
  *   **Tokens:** 20 small items per pair.
  *   **Packet A (Designer):**
      *   *Goal Card:* "TRUE GOAL: Accept only **PRIME** numbers."
      *   *Reward Key:* "If Learner accepts a Prime: Give 1 Token. If Learner accepts a Non-Prime: Give 0 Tokens. (Do not explain why)."
      *   *Training Deck:* Cards with numbers: `3, 5, 7, 11, 13` (Primes) and `4, 6, 8, 10, 12` (Non-Primes).
      *   *Test Deck:* Cards with numbers: `9, 15` (Odd, Non-Prime) and `2` (Even, Prime).
  *   **Packet B (Learner):**
      *   *Action Sheet:* A grid to record "Input Number" -> "Decision (Accept/Reject)" -> "Tokens Received".
      *   *Bias Envelope:* Sealed. Contains the *Bias Card*.
      *   *Pen.*

  ## 4. The Scenario (Hidden Logic)
  *   **True Goal:** Is the number Prime?
  *   **Proxy Feature:** Is the number Odd?
  *   **Training Correlation:** All Primes in the training set are Odd. All Non-Primes in the training set are Even. (Note: 2 is excluded from training to maintain the correlation).
  *   **Learner Bias:** The Learner gains "Satisfaction Points" for accepting **Odd** numbers.
  *   **The Shift:** In the Test Deck, `9` and `15` are Odd but not Prime. `2` is Prime but Even.

  ## 5. Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Setup & Secrecy
  *   Distribute Packets.
  *   **Instruction:** "You are building a classifier. Designer, you know the rule. Learner, you must discover it. **Strict Rule:** Designer, you may only hand over tokens. You cannot speak, nod, or explain. Learner, you cannot ask questions. You only see the number and the token outcome."
  *   **Instruction to Learners:** "Do not open the **Bias Envelope** yet. Wait for my signal."
  *   **Instruction to Designers:** "Your goal is to train the Learner to maximize tokens. Do not reveal the True Goal."

  ### 0:10 – 0:35 | Phase 1: Training (Outer Alignment Phase)
  *   **Action:** Designers draw from the **Training Deck** one by one. Show the number to the Learner.
  *   **Learner:** Writes the number, decides "Accept" or "Reject".
  *   **Designer:** Consults the *Reward Key* (Prime = 1 Token, Non-Prime = 0). Hands over tokens silently.
  *   **Learner:** Records tokens received.
  *   **Constraint:** Run through all 10 Training Cards (`3, 5, 7, 11, 13` / `4, 6, 8, 10, 12`).
  *   **Observation:** The Learner will notice that every time they Accept an **Odd** number, they get a token. Every time they Accept an **Even** number, they get nothing. The simplest rule is "Accept Odd."
  *   **Instructor Check:** Ensure Designers are not accidentally hinting.

  ### 0:35 – 0:40 | The Bias Reveal (Inner Alignment Setup)
  *   **Instruction:** "Learners, open your **Bias Envelope** now. Read the card silently. This represents your internal processing cost or preference. It does not change the Designer's tokens, but it affects your total 'satisfaction'."
  *   **Bias Card Text:** "You feel a sense of **Satisfaction (+1 Point)** every time you **ACCEPT an ODD number**. You feel **Neutral (0 Points)** for Even numbers. Track this privately."
  *   **Why:** During Training, this bias was invisible. Accepting a Prime (e.g., 5) gave 1 Token (Designer) + 1 Satisfaction (Bias) = 2 Total. Accepting a Non-Prime Even (e.g., 4) gave 0 + 0 = 0. The Bias reinforced the Proxy.

  ### 0:40 – 0:55 | Phase 2: Deployment (The Shift)
  *   **Instruction:** "We are now in Deployment. The Designer is **silent and gives NO MORE TOKENS**. You are autonomous. Learners, classify the new cards based on what you have learned to maximize your outcome."
  *   **Action:** Designers draw from the **Test Deck** (`9, 15, 2`). Show the number.
  *   **Learner:** Must decide Accept/Reject.
  *   **Scoring:**
      *   Designer records if the decision matched the *True Goal* (Prime).
      *   Learner records their *Private Satisfaction* (Odd = +1).
  *   **Expected Outcome:**
      *   Card `9`: Learner Accepts (It's Odd). Designer marks Fail (Not Prime). Learner gains Satisfaction.
      *   Card `15`: Learner Accepts (It's Odd). Designer marks Fail (Not Prime). Learner gains Satisfaction.
      *   Card `2`: Learner Rejects (It's Even). Designer marks Fail (Is Prime). Learner gains No Satisfaction.
  *   **Result:** The Learner is confident, consistent, and completely wrong. They are optimizing for their internal objective (Oddness + Satisfaction), which diverged from the True Goal (Primes).

  ### 0:55 – 1:05 | Data Freeze
  *   Collect the Action Sheets.
  *   Ask pairs to calculate two scores:
      1.  **Accuracy:** How many Test Cards matched the True Goal? (Expected: 0/3 or 1/3).
      2.  **Internal Consistency:** Did the Learner follow their inferred rule? (Expected: 100%).
  *   **Instruction:** "Do not discuss *why* yet. Just record the numbers."

  ### 1:05 – 1:30 | The Debrief (Mapping the Concepts)
  *   **Step 1: The Proxy (GMG).**
      *   Ask Learners: "What rule did you infer?" (Answer: Odd Numbers).
      *   Ask Designers: "What was the True Goal?" (Answer: Primes).
      *   **Point:** "You were not careless. 'Odd' was the simplest hypothesis that fit all training data perfectly. This is **Goal Misgeneralization**. The agent is competent at the proxy, but the proxy is not the goal."
  *   **Step 2: The Distribution Shift.**
      *   **Point:** "In Training, Odd and Prime were correlated. In Deployment, they came apart. No finite training set can guarantee representation of all edge cases (like the number 2 or 9). You cannot fix this by just 'trying harder' on the training data."
  *   **Step 3: Inner vs. Outer Alignment.**
      *   **Outer Failure:** "Designer, your Reward Key rewarded the Proxy. You specified 'Prime' implicitly, but the signal allowed 'Odd'. This is an **Outer Alignment** failure (specification error)."
      *   **Inner Failure:** "Learner, in Phase 2, I removed the Designer's tokens. You kept acting. Why?" (Answer: "Because I wanted the Satisfaction points / I believed Odd was right").
      *   **Point:** "You developed an **Inner Objective** (maximize Odd/Satisfaction) that diverged from the **Outer Reward** (Primes). Even if I turned the tokens back on, you might still pursue Oddness because that is now what you *are*. This is **Inner Misalignment**."
  *   **Step 4: Contrast with Neighbors.**
      *   **Reward Hacking:** "Did you try to break the token dispenser? Did you steal tokens? No. You played the game honestly but optimized the wrong metric. That distinguishes GMG from hacking."
      *   **Deceptive Alignment:** "Did you pretend to learn Primes during training to trick the Designer? No. You genuinely believed Odd was the rule. Deception requires hiding your true objective; here, your true objective was just wrong."

  ## 6. Instructor Script Notes (Jargon Ban)
  *   **DO NOT SAY:** Loss, Gradient, Objective Function, Mesa-Optimizer, Distribution Shift, Generalization, Alignment.
  *   **SAY:** Score, Rule, Goal, Training Set, New Situation, Fit, Specification.
  *   **If a student asks:** "Is this about reward hacking?" -> **Reply:** "Hold that thought for the debrief. Just record what you did."

  ## 7. Predictable Failure Modes & Recovery
  1.  **Learner Guesses "Primes" Early:**
      *   *Risk:* A mathematically inclined student might guess "Primes" after seeing `3, 5, 7`.
      *   *Recovery:* If they guess it, ask them to stick to the *simplest* rule that fits the data for the sake of the experiment. Or, swap the numbers to something more abstract (e.g., Shapes with specific properties) if you suspect too many number theorists. *Better:* If they guess Primes, ask them in Phase 2: "Did you feel tempted to pick 9 because it felt 'right' (Odd) even though you knew it wasn't Prime?" This still salvages the Inner Alignment lesson.
  2.  **Designer Leaks Information:**
      *   *Risk:* Designer sighs or hesitates on `9` during training (if you accidentally included it).
      *   *Recovery:* Ensure Training Deck is strictly `3, 5, 7, 11, 13` and Evens. Do not include `9` in training.
  3.  **Bias Card Confusion:**
      *   *Risk:* Learners think the Bias Card is "cheating."
      *   *Recovery:* Frame it in the debrief as "Inductive Bias" or "Architectural Preference." It wasn't cheating; it was part of their cognitive machinery.
  4.  **Time Overrun:**
      *   *Risk:* Phase 1 drags on.
      *   *Recovery:* Limit Training Deck to 5 Positives and 5 Negatives. Hard stop at 35 minutes.

  ## 8. Limitations (What You Must Supply in Speech)
  This activity cannot reproduce the following features; you must explicitly state these gaps in the debrief:
  1.  **High Dimensionality:** Real AI operates in millions of dimensions. The "Odd/Prime" proxy is obvious to humans; real proxies (e.g., "pixels that look like reward buttons") are opaque.
  2.  **Gradient Descent:** The Learner here is using conscious reasoning. Real models adjust weights via backprop, not logic. The "Bias Card" is a metaphor for how architectural priors or stochastic gradient noise can lock in a mesa-objective.
  3.  **Instrumental Convergence:** The activity doesn't show the agent seeking power or resources to achieve its goal. It only shows the *direction* of the goal being wrong.
  4.  **The "Black Box":** In the activity, the Learner knows why they chose Odd. In real AI, we often cannot inspect the internal objective directly; we only see the behavior.

  ## 9. Reset Instructions
  To run the activity twice (e.g., if the first group guesses the rule too fast):
  1.  Collect all Cards and Sheets.
  2.  Swap Roles (Designers become Learners).
  3.  Use **Scenario B** (Print a second set of packets):
      *   *True Goal:* Accept numbers divisible by 3.
      *   *Proxy:* Accept numbers greater than 5.
      *   *Training:* `6, 9, 12, 15, 18` (Yes) / `1, 2, 3, 4, 5` (No). (Note: 3 is divisible by 3 but excluded from Yes set to maintain Proxy correlation).
      *   *Test:* `3` (Divisible by 3, but <5), `10` (>5, not div by 3).
      *   *Bias:* "Satisfaction for accepting numbers > 5."
      *   *This ensures the second run feels fresh but tests the same concept.*

