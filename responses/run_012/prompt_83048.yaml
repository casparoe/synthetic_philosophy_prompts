  The brig *Mercator* docked at dawn, unloading sacks of white brine-crystal until the quay groaned. On Ostra, the crystal was law: it bought bread, settled debts, and kept the winter herring from rotting. Now, the trade route with the mainland had doubled the island's supply.

  Elara, a visiting naturalist, stood beside Magistrate Venn as the crowd gathered. She had read the philosophers who claimed money was merely a veil, a counter with no intrinsic worth. She stepped forward, raising a hand against the cheering.

  "Do not celebrate yet," Elara warned, her voice cutting through the salt-air. "You have more tokens, not more fish. When the sacks circulate, the price of herring will rise to meet them. A loaf that cost one ounce will cost two. You are not richer; you are merely holding lighter currency."

  Kael, a merchant whose warehouse brimmed with old debt contracts, nodded sharply. He pulled a slate from his coat. "The naturalist speaks sense. Debts contracted in crystal must be repaid in full measure, but my fish will now cost double per ounce. The value shifts, but the balance remains." He looked to the fishermen, expecting resignation. He believed the influx was purely monetary inflation.

  But Torin, a fisherman with weathered hands, stepped forward, clutching a fresh sack of the new crystal. He didn't look at Kael's slate. He looked at the salt. "You speak of counts and measures," Torin said, tearing the sack open. He rubbed the grains between his fingers, then tossed a pinch onto a raw herring laid on a barrel. "I speak of winter."

  "Before today," Torin continued, "I caught ten fish but had salt for only five. The rest rotted. Now, I have salt for ten. The crystal is not just a token, Elara. It is the thing that makes the fish valuable. If I have more crystal, I have more food. That is wealth, not just price."

  A murmur rippled through the crowd. Kael frowned. "But prices will adjust! Your real gain will be erased."

  "My children will eat," Torin said simply. "Your prices cannot eat."

  Magistrate Venn cleared his throat, holding up a foreign coin—gold, stamped with a king's face. It was shiny, durable, and useless. A merchant from the mainland had offered it for a sack of Ostra's crystal. "The mainlander wants to trade this gold for our salt," Venn said. "By your logic, Elara, gold is better money. It does not perish. It is neutral."

  Elara hesitated. The essays argued that money's material nature didn't matter, only its quantity. But here, the material *was* the utility. If they accepted the gold, they would have stable money but no preservative. If they kept the salt, they had inflation but security.

  Kael snatched the gold. "I'll take it. I can trade it abroad." He hoarded the metal, removing it from local circulation, while Torin dumped the salt onto his fish, removing it from circulation by consumption.

  Elara watched the divergent paths. Kael treated the salt as capital to be exchanged; Torin treated it as capital to be consumed. The influx of money *was* an influx of resources, blurring the line between circulation and production. The prices would rise, yes, but the island's capacity to sustain life had genuinely expanded in a way gold never could.

  Venn looked from the gold coin to the dissolving salt on the fish. He realized the theory could not dictate the verdict.

  When the medium of exchange is also the means of survival, can we ever truly distinguish between inflation and abundance?
