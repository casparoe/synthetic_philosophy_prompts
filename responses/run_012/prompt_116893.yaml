  1.  **Transferred right:** 9/10
  2.  **Assurance:** 8/10
  3.  **Counterfactual consent:** 7/10
  4.  **Expectation/reliance:** 5/10
  5.  **Constitutive-rule:** 4/10
  6.  **Conventionalist:** 3/10
  7.  **Integrity/self-constitution:** 2/10

  ***

  **Reasoning**

  The ranking is determined by the weighted criteria: (a) Wrong owed to promisee > (b) Binding without reliance > (c) Outside social practice > (d) Explaining limits.

  **1. Transferred right (9/10):** This account excels on criterion (a), locating the wrong squarely in the violation of a right held by the promisee against the promiser. It satisfies (b) perfectly, as rights exist independently of the promisee's psychological state (reliance/expectation). It satisfies (c) by positing a moral transfer of right that does not necessitate a formal institution. It handles (d) well, as rights cannot be transferred under coercion or regarding impossible acts. It loses a point only because the mechanism of "transfer" via speech acts can seem metaphysically opaque without some background convention.

  **2. Assurance (8/10):** This account also scores highly on (a), identifying the wrong as a specific interpersonal disrespect (manipulation of deliberation) owed to the promisee. It handles (b) well; the obligation arises from the *giving* of assurance, which creates a normative constraint even if reliance is not subsequently acted upon. It satisfies (c) as a principle of interpersonal morality. It is ranked below Transferred Right because the "assurance" model can sometimes struggle to explain the *strength* of the obligation compared to a right, and in cases where the promisee is completely unaware (like the Ilse case), the "assurance" link is slightly more attenuated than a property-like right.

  **3. Counterfactual consent (7/10):** This account satisfies (a) by grounding the wrong in violating a norm the promisee would rationally accept. It satisfies (b) and (c) because hypothetical consent does not require actual mental states or social conventions. However, it is ranked lower because it is more abstract; it explains why a norm *might* be justified, rather than describing the immediate normative relation created by the act of promising itself.

  **4. Expectation/reliance (5/10):** This account scores well on (a), as the wrong is a harm inflicted on the promisee. However, it fails criterion (b) significantly. Promises are intuitively binding even when no reliance has yet occurred (the "naked promise"). By making reliance constitutive of the obligation, this account cannot explain the binding force in the early stages of a promise or in cases where reliance is impossible.

  **5. Constitutive-rule (4/10):** This account succeeds on (b) and (d) (rules define valid/invalid moves). However, it struggles with (a) and (c). It tends to locate the wrong in breaking a rule of an activity (akin to a foul in a game) rather than a wrong owed specifically to the promisee. Furthermore, it struggles with (c), as constitutive rules typically imply a pre-existing practice or institution, making it hard to explain one-off promises between strangers without a background practice.

  **6. Conventionalist (3/10):** This account fails (c) by definition, as it requires a social practice to generate the obligation. It also struggles with (a); the wrong is primarily to the practice or the stability of the convention, rather than a specific wrong owed to the promisee as an individual. It is ranked above Integrity only because it at least acknowledges the interpersonal/social nature of the act.

  **7. Integrity/self-constitution (2/10):** This account fails criterion (a) fundamentally. It explicitly locates the obligation in the promiser's interest in their own unity and the wrong as a failure toward *themselves*. While it explains why a promiser might feel bound, it fails to capture the essential feature of promising as creating a claim *in another person*.

  ***

  **Case Application: Ilse and Pavel**

  In this case, Pavel forms no expectation and will never know if the promise is kept.
  *   **Impact on Ranking:** This case does **not** oblige me to revise the ordering.
  *   **Analysis:** The case functions as a stress test for criterion (b) (binding without reliance/expectation).
      *   **Account 3 (Expectation/reliance)** implies Ilse has no obligation, as Pavel forms no expectation. If we accept the intuition that Ilse *is* obliged to Pavel despite his memory loss, Account 3 is confirmed as inadequate, reinforcing its low rank.
      *   **Account 6 (Integrity)** explains why Ilse keeps the promise (to maintain her own unity), but it fails to explain why the obligation is *to Pavel*. Since criterion (a) weights the "owed to promisee" requirement highest, Account 6 remains at the bottom despite fitting the psychological facts of the case.
      *   **Account 5 (Transferred right)** handles the case best. Pavel holds a right to the translation even if he forgets the deed that granted it. Ilse's obligation persists because the right exists independently of Pavel's memory. This confirms Account 5's top ranking.
      *   **Account 4 (Assurance)** also holds; Ilse gave assurance at the time of promising, altering the normative landscape, even if Pavel's capacity to access that assurance was later removed.

  The case reinforces the superiority of accounts that separate the *existence* of the obligation from the *psychological state* of the promisee (5 and 4), and the inadequacy of accounts that tie obligation to reliance (3) or locate it solely in the self (6).

  ***

  **The Self-Defeating Promise**

  **Account:** Transferred right (Ranked Highest).
  **Scenario:** A promise whose content is that the promise itself is not binding (e.g., "I promise to X, but I transfer no right to you regarding this").

  **Handling:**
  On the Transferred Right account, the essence of a promise is the voluntary transfer of a right to performance from promiser to promisee. The utterance is the mechanism of transfer. If the content of the utterance explicitly negates the transfer ("this promise is not binding" or "I transfer no right"), the performative act is self-defeating. One cannot transfer a right by simultaneously declaring that no right is being transferred.

  **Verdict:**
  Such a promise **does not bind**. The condition required to create the obligation (the transfer of the right) is explicitly denied by the content of the speech act. It is analogous to saying "I bet you $5, but this bet is not valid." The account would classify this not as a binding promise with an exception, but as a failed attempt to promise.
