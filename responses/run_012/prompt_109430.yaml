answer: |-
  ### Restatement of the Position

  You are arguing that the *White Horse Dialogue* is a coherent treatise on the semantics of naming, specifically the criteria for the individuation of terms. On your reading, the central claim ("White horse is not horse") is not an ontological denial that white horses belong to the kind *horse*, but a semantic assertion that the term *white horse* is not identical to the term *horse*.

  This commits you to three specific claims:
  1.  **The Subject is Names:** The dialogue discusses *ming* (names) throughout, even where the text appears to discuss objects. The Advocate is talking about the conditions under which a name is correctly applied, not the metaphysical status of the things named.
  2.  **The Meaning of *Fei*:** The negation *fei* (非) functions here as a marker of non-identity between terms (intensional distinctness), not as class exclusion (extensional membership).
  3.  **The Role of the Objector:** The Objector is not a fool or a straw man, but a proponent of a rival extensional semantics (names are individuated by their extensions). The dialogue is a genuine dialectic between two semantic theories, resolved in favor of the intensional/functional view via the "seeking" argument.

  This reading saves the text from charges of sophistry or grammatical confusion by treating it as a sophisticated, if compressed, theory of reference.

  ---

  ### 1. What Would Count Against This? (Fatal to Awkward)

  **Fatal Considerations:**
  *   **Ontological Slippage in the Conclusion:** If the text concludes not just that the *names* are distinct, but that the *thing* "white horse" lacks the reality of "horse," the semantic reading collapses. There are passages where the Advocate argues that because "white" and "horse" are distinct determinants, the resulting entity is ontologically distinct from a mere "horse." If the text asserts that a white horse is not a horse *in reality* (not just in name), your reading cannot hold. The text must remain strictly on the level of *ming* (name) and *shi* (actuality/criteria) without conflating the name's distinctness with the object's exclusion from the kind.
  *   **The "Seeking" Argument as Extensional:** The core of your reading rests on the "seeking" passage (if you seek a horse, yellow/black suffice; if you seek a white horse, they do not). If this argument is demonstrably about the *objects* satisfying conditions rather than the *names* fixing reference, it undermines the "individuation of names" claim. If the text says "A yellow horse is a horse, but not a white horse," it is making an extensional claim about objects. If it says "The demand 'horse' is satisfied by a yellow horse, the demand 'white horse' is not," it supports your reading. The textual boundary here is thin. If the text treats the "seeking" as proving the *object* is different, rather than the *name's criteria* being different, this is fatal.

  **Awkward Considerations:**
  *   **The Grammar of *Fei*:** In Classical Chinese, *fei* is a general negator, often functioning like "is not" or "it is not the case that." While it *can* express non-identity, it is predominantly used for class exclusion or predicative negation in Warring States texts. Reading it consistently as "is not identical to" requires a high degree of charitable reconstruction. It is awkward to assume the Audience would naturally hear "non-identity" without explicit markers (like "the name of..."), which are sparse.
  *   **The Objector's Competence:** You argue the Objector represents a rival theory. However, in the text, the Objector frequently concedes points too easily or seems confused by distinctions that a serious semantic theorist should grasp immediately (e.g., the distinction between combining attributes and combining objects). If the Objector is too easily baffled, he looks more like a rhetorical foil than a genuine philosophical opponent, weakening the "collision of conceptions" framing.
  *   **Lack of Explicit Metalinguistic Markers:** The text rarely explicitly says "The *name* 'horse'..." It usually says "Horse..." To maintain your reading, one must constantly supply "The name of..." in ellipses. While common in classical texts, the density of these ellipses here is high. If the text cannot sustain this ellipsis without breaking the logic of a specific passage, the reading strains.

  ---

  ### 2. Defeating Passages Elsewhere in the Corpus

  To defeat your reading, passages in other chapters would need to show that Gongsun Long (or the compiler) is committed to an ontological realism that contradicts the semantic individuation thesis.

  *   **Hardness and Whiteness (*Jian Bai Lun*):**
      *   *Defeating Content:* If this chapter argues that "whiteness" and "hardness" exist as independent entities floating apart from stones (a strong Platonic realism), and that "white horse" refers to a compound *entity* rather than a compound *description*, it undermines your semantic reading. If the text claims the qualities separate from the object ontologically, then "White Horse is not Horse" becomes an ontological claim about compound substances, not a semantic claim about names.
      *   *Standing Content:* If the chapter argues that we cannot perceive hardness and whiteness simultaneously through the same sense organ, and thus the *concepts* are distinct, this supports your view. It would show Gongsun is concerned with the epistemic criteria for applying terms, not the metaphysical composition of things.

  *   **Pointing at Things (*Zhi Wu Lun*):**
      *   *Defeating Content:* If this chapter defines names purely by their ability to pick out objects regardless of description (a direct reference theory), it contradicts the "individuation by criteria" view. If it argues that the "pointer" (name) and the "pointed" (object) are identical in reality, it collapses the semantic distinction you rely on.
      *   *Standing Content:* If it argues that "pointing" fails when the name does not match the actuality's criteria, it reinforces the idea that names are individuated by their fit with specific aspects of reality (shape, color), supporting your "answerable to" formulation.

  *   **Names and Actualities (*Ming Shi Lun* - if authentic/related):**
      *   *Defeating Content:* If it asserts that names are rectified solely by kingly decree or social convention without regard to intrinsic criteria (shape/color), it weakens the naturalistic semantic basis of your reading.
      *   *Standing Content:* If it argues that names must be corrected to match the *shi* (actuality) based on specific distinguishing features, it aligns with your view that names are individuated by what they answer to.

  *   **Later Mohist Dialectical Material:**
      *   *Defeating Content:* The Mohist Canons explicitly critique the School of Names. If they characterize Gongsun Long's error as "denying that a white horse is a horse" (ontological denial) rather than "confusing the name 'white horse' with the name 'horse'" (semantic confusion), this is strong evidence against you. The Mohists were precise logicians; if they understood him as making an ontological error, it is likely he made one. Specifically, if they argue he violates the principle that "a part is included in the whole" regarding *things*, not just terms, your reading is in trouble.
      *   *Standing Content:* If the Mohists critique him for "using names to confuse actualities," this leaves room for your reading. It implies his error was semantic (misusing names) rather than factual (denying biological kinds). If they acknowledge his distinction between terms but criticize his application of it, your "collision of conceptions" frame holds.

  ---

  ### 3. The Unstated Premise: Different Demands $\rightarrow$ Different Names

  You note the reading supplies the premise: *That different demands imply different names.*

  *   **Charity or Invention?** This is the pivot point. The text says: "If you seek a horse, a yellow horse arrives. If you seek a white horse, a yellow horse does not arrive." From this, the Advocate concludes: "Therefore, white horse is not horse."
      *   *Invention:* The text does not explicitly state the bridge principle: "If the conditions of satisfaction for term A differ from term B, then Term A $\neq$ Term B." It moves directly from the seeking scenario to the identity claim. Supplying the principle is necessary to make the logic valid, which risks importing modern semantics (Fregean sense/reference) into the text.
      *   *Charity:* However, in the context of Warring States disputation, the function of a name *was* its use in directing action (seeking, ordering, punishing). If a name's function is to guide seeking, and two names guide seeking differently, they are functionally distinct. Given the pragmatic orientation of early Chinese thought, treating "difference in use" as "difference in name" is a plausible reconstruction of the implicit theory of *ming*.
      *   *The Test:* The difference lies in whether the text treats the "seeking" as evidence of *semantic content* (your view) or *class extension* (the rival view). If the text implies the yellow horse *fails to be* a white horse (ontology), the premise is invention. If it implies the demand "white horse" *is not met* by the yellow horse (semantics/pragmatics), it is charity. The text is ambiguous here. A defender must concede this premise is reconstructed from the *structure* of the argument, not explicit statement.

  ---

  ### 4. Real Work vs. Unfalsifiable Padding

  *   **Real Work:** The claim that *fei* denotes non-identity of names rather than class exclusion is doing the heavy lifting. This allows the text to be logically valid. The claim that the Objector represents a rival extensional theory explains why he keeps appealing to existence ("There are white horses, so how can you say...?"). These two moves make the dialogue coherent.
  *   **Unfalsifiable Padding:** The "Two Conceptions of Naming" framing risks being a universal solvent. Any time the Objector makes a point that sounds like common sense ("But a white horse is a horse!"), you can dismiss it as "The extensional view speaking." Any time the Advocate makes a cryptic claim, you can interpret it as "The intensional view deepening."
      *   *Is this fatal?* It is a defect if it prevents you from identifying a *mistake* by the Advocate. If the Advocate is infallible on your reading, the reading is likely hagiography. A robust reading should allow for the possibility that the Advocate *fails* to prove his point or conflates name and object at a critical juncture. If your reading makes the Advocate's argument perfectly valid by redefining his terms, you may be smoothing over a genuine equivocation that the text contains.
      *   *Absorption:* Could this framing absorb any text? Mostly, yes, unless the text explicitly says "We are talking about the animals, not the words." Since the text lacks quotation marks, it is highly absorbent. To avoid this defect, you must identify a point where the Advocate's semantic theory *limits* what he can say. For example, if he were to claim "A white horse is not an animal," your theory should predict he *cannot* say that (since 'animal' would be a different name individuated differently). If the text allows him to make infinite distinctions without criteria, the theory is padding.

  ---

  ### 5. Textual Integrity and the "School of Names"

  *   **Fragmentary Nature:** The received *Gongsun Longzi* is short, likely incomplete, and possibly rearranged.
      *   *Damage to Reading of Dialogue:* If the dialogue is missing a concluding section where the Advocate clarifies he *was* talking about objects, your reading stands on a gap. If the "Seeking" passage is a later interpolation (some scholars suspect layers), the load-bearing move is inauthentic. You must acknowledge that if the Seeking argument is removed, the "individuation by demand" thesis loses its textual anchor.
      *   *Damage to Attribution:* If the text is a Han dynasty compilation reacting to Mohist critiques, the "proto-semantics" might be a retrospective systematization of what were originally rhetorical paradoxes. This doesn't kill the philosophical reading, but it changes the historical claim from "Gongsun Long's theory" to "A theory attributed to Gongsun Long."
  *   **School of Names as Archival Category:** If the "School of Names" is a later librarian's category (Han dynasty) rather than a self-conscious movement, the idea of a "rival conception" (Objector vs. Advocate) might be an internal dramatization of a later debate, not a record of a live Warring States dispute. This makes the "Objector as rival theorist" reading more plausible as a literary device, but less plausible as historical record. It matters less for the philosophical validity, but more for the historical claim that this was a live dialectic.

  ---

  ### 6. Concessions, Criticisms, and Falsifiability

  **What a Defender Should Concede:**
  *   **Ambiguity is Real:** A defender must concede that the text *exploits* the ambiguity between name and object. The argument's rhetorical power comes from the shock of "White horse is not horse." If it were clearly only about names, it would be trivial ("The word 'white horse' is not the word 'horse'"). The text likely *intends* the ontological shock while relying on semantic logic. You must concede the text straddles the line; it is not purely semantic.
  *   **The Objector is Weak:** Even if he represents a rival theory, the text gives him the weaker hand. A defender should admit the dialectic is rigged.
  *   **Grammatical Strain:** Concede that reading *fei* as non-identity requires ignoring its commoner usage as class exclusion in contemporary texts.

  **What a Critic Would Throw:**
  *   **The Mohist Verdict:** The critic will point to the Mohist Canons which treat "White horse is not horse" as a paradigm of confusing names and realities to deny obvious facts. If the best logicians of the time read it as an ontological error, the semantic reading is likely anachronistic.
  *   **The "Killing a Robber" Parallel:** The Mohists discuss "Killing a robber is not killing a man." They accept this as semantically distinct but ontologically connected. If they criticize Gongsun for *not* seeing the connection, he is an ontological denier, not a semantic distinguisher.
  *   **Pragmatic Absurdity:** If I order a horse for a chariot and am sent a white horse, I do not say "You have not sent a horse." I say "You have sent a horse." The Advocate's logic contradicts standard pragmatic usage even in ancient contexts (e.g., taxation, conscription).

  **Falsifiability Check:**
  *   **Is the position elastic?** It is highly elastic, as noted in section 4.
  *   **What would make you give it up?**
      1.  **A clear ontological claim:** A passage where the Advocate says, "Therefore, the white horse does not possess the nature of the horse," or "The white horse is a separate kind of being."
      2.  **Contemporary Reception:** Definitive evidence (e.g., from a *Zhuangzi* or *Xunzi* passage securely dated close to Gongsun Long) that treats the claim as a denial of biological fact rather than a distinction of terms. *Xunzi* accuses them of "confusing names to disrupt actualities." If "disrupt actualities" means "deny reality" rather than "misuse language," the reading fails.
      3.  **Internal Inconsistency:** If the "Seeking" argument is shown to rely on the assumption that the yellow horse *is not* a horse in the first premise, the argument is circular and the semantic reading collapses.

  **Conclusion on Insulation:**
  The position is well-insulated against charges of "sophistry" because it reconstructs a valid argument where one seemed absent. However, this insulation comes at the cost of historical plausibility. It makes Gongsun Long sound more like a modern analytic philosopher than a Warring States disputant. The risk is not that the reading is impossible, but that it is *too* coherent. It risks removing the text from its historical ecosystem, where the point of such paradoxes was often to destabilize conventional wisdom, not to build a tidy semantic theory. If you cannot find a passage where the Advocate's semantic precision *fails* or creates a paradox he cannot solve, the reading is likely too charitable. You need to find the break in the armor to prove you aren't just polishing it.
