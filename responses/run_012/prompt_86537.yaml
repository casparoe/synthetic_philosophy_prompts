answer: |-
  **The Deflationist's Burden: Can a Thin Truth Bear a Thick Norm?**

  There is a distinct intellectual relief in deflationism. For centuries, philosophers strained to describe the relationship between our minds and the world, positing elaborate structures of correspondence, coherence, or utility to explain what makes a statement *true*. The deflationist arrives to say: relax. There is no deep essence to uncover. To say "It is true that snow is white" is to do no more than say "Snow is white." The predicate "is true" is not a label for a metaphysical property; it is a logical tool. It allows us to generalize ("Everything she said is true") and endorse ("That is true") without repeating ourselves. On this view, truth does no explanatory work. It is the shadow cast by our assertions, not the light that makes them visible.

  Yet, this relief often curdles into anxiety. If truth is merely a linguistic device, what becomes of the seriousness of inquiry? If truth is not a substantive target, are we merely shuffling symbols? To quell this anxiety, a compromise has been proposed. Let us, the compromiser suggests, divide the labor. Let us keep the property of truth deflated—thin, transparent, and explanatorily idle. But let us treat the *norm* of truth as substantive. Let us insist that while "is true" adds nothing to the content of a proposition, the rule "One ought to believe and assert only what is true" is a heavy, irreducible constraint. It is what distinguishes a lie from a mistake, and inquiry from daydreaming.

  The question is whether this division of labor can hold. Can we anchor a heavyweight norm to a weightless property? Or does the norm, by claiming to explain our behavior, secretly reinflate the property it claims to disavow?

  To see the appeal of the split, one must feel the pull of the alternative. If we deflate the norm along with the property, inquiry risks looking like a game without a point. We need to explain why assertion is not just making noises, and why we feel guilty when we lie but merely regretful when we are mistaken. The compromiser argues that a substantive norm preserves the "direction of fit" between mind and world. It explains why inquiry terminates: we stop searching when we take ourselves to have secured the truth. It preserves the intuition that a justified false belief is still a failure in a way that a lucky true belief is not. The property remains a ghost, but the norm is the machine that does the work.

  However, this machine begins to rattle under scrutiny. The first line of attack concerns the emptiness of the injunction. If the deflationist is right about the property, then to believe that $p$ is simply to believe that $p$ is true. There is no gap between the content of my belief and its truth value from my perspective. Consequently, the command "Believe only what is true" collapses into "Believe only what you believe." It offers no guidance. I cannot scan my beliefs, check them against the property of truth, and discard the false ones, because I cannot access the property independently of my taking the belief to be correct. If the norm is meant to guide the formation of belief, it is blind. If it is meant only to evaluate belief after the fact, it loses its explanatory power regarding why we inquire in the first place. We do not inquire because we want to satisfy a norm; we satisfy the norm because we inquire.

  The second, and perhaps more damaging, objection is that the explanatory work attributed to the truth-norm is better performed by other concepts. What actually governs our assertions? Is it the metaphysical status of the proposition, or our evidence for it? When I am criticized for an assertion, the defense is never "It was true" (for I may not know that); the defense is "I had good reasons." Conversely, if I assert something false but warranted, I am often excused; if I assert something true on a whim, I am criticized. This suggests the real norm is warrant, or knowledge, or perhaps the social cost of being caught out. If the substantive norm is actually a norm of *justification*, then truth is once again idle. The compromiser insists the norm is irreducible to warrant, but this looks like an assertion of dogma rather than an argument. If truth does not track with what we can reasonably be held responsible for, it cannot be the norm of a rational practice.

  Third, we must consider the nature of practices. Assertion is a social convention, like chess. Chess has rules: move the bishop diagonally. Violating the rule makes it not a move in the game. But the rule is not "Move the piece to its true position." It is a constitutive rule of the practice. The skeptics argue that assertion is similar. The rule is "Assert only what you are prepared to defend." This is a truth-involving rule only in name. We could have a practice of "assertion*" where the norm is "Assert only what is useful." It would function similarly. If the practice can be defined without invoking a substantive truth-norm, then the norm is not doing the heavy lifting the compromiser claims. The "seriousness" of assertion comes from our commitment to each other, not from a relation to the world labeled "truth."

  The defense of the split must answer whether a deflated property can still mark a genuine target. The compromiser argues that even if "truth" is thin, the *world* is not. To aim at truth is to aim at the world being as we say it is. This target is real, even if the label is thin. Furthermore, they argue that nothing short of truth explains the termination of inquiry. Warrant can run indefinitely; we can always ask for more evidence. But inquiry stops when we are satisfied that we have the truth. This satisfaction is the psychological registration of the norm being met.

  This defense, however, conflates the *object* of inquiry with the *criterion* of inquiry. We aim at the world, yes. But the signal that we have hit the target is not "Truth" (which is invisible); it is "Satisfaction of Warrant." To say inquiry stops at truth is to say it stops when we think it should stop. This brings us back to the agent's state, not the property of the proposition. If the norm is substantive and explanatory, it must be able to causally influence our behavior. But a deflated property cannot cause anything. Therefore, the "norm" that is doing the explaining must be something psychological or social—like the desire for consistency or the fear of social sanction—not a relation to a deflated property.

  Here lies the verdict: the split is unstable. It attempts to have the metaphysical modesty of deflationism while retaining the normative gravity of realism, and it cannot sustain both. If the norm is truly substantive and explanatory—if it really is what *makes* inquiry aim at anything—then it treats truth as a value distinct from mere assertibility. But if truth is a value distinct from assertibility, it is no longer deflated. It has become a substantive property after all, a "good-making feature" of beliefs that transcends our evidence. The compromiser has smuggled inflationism back in through the back door of normativity.

  Therefore, one half must give way. Since the arguments for deflationism regarding the property are strong (the redundancy of "is true" is a logical fact, not a theory), it is the norm that must yield. We cannot maintain that "One ought to believe what is true" is a substantive, explanatory rule if "is true" is merely a device of endorsement.

  This does not mean we abandon the normativity of belief. It means we must redefine it. The norm is not "Believe what is true." It is "Believe only what you take to be true." Or, more robustly, "Assert only what you are committed to defending." The weight we place on truth is not the weight of a metaphysical anchor; it is the weight of our own commitment. When we assert, we pledge our reputation to the way things are. The "ought" comes from the social and rational costs of breaking that pledge, not from the property of the proposition itself.

  This restriction applies universally, to both belief and assertion. In belief, the "norm" is the internal requirement of consistency: one cannot consciously believe $p$ while taking $p$ to be false. In assertion, the norm is the social requirement of accountability. In neither case does the property of truth do the work. The work is done by the agent's relationship to their own claims and to their community.

  We need not fear that this makes inquiry a game of noises. The stakes are not lowered; they are relocated. The seriousness of truth-seeking does not come from the universe rewarding us with a "true" stamp. It comes from the fact that our assertions are the tools by which we navigate a resistant world and coordinate with one another. If we get it wrong, the world pushes back, and our peers lose trust. That resistance is real enough to bear the weight of our inquiry, without needing to reify truth into a substantive property. The deflationist can sleep soundly, provided they are willing to let go of the idea that Truth is the master of the practice, rather than its servant. The split fails, but the practice survives. We are left with a world that is hard and real, and a concept of truth that is soft and useful, and that is precisely as it should be.
