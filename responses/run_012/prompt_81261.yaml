          *   **Core Concept 1:** Distinguish between *present-mindedness* (asking current questions) and *directionality* (past moving toward us). Address which is the vice, if they can be separated, and the "second-order problem" (is the critique of Whig history itself a Whig narrative?).
          *   **Core Concept 2:** Apply to the *historiography of the asylum* (19th-c reform -> institutionalization -> community care). Address what's wrong with reading this as progress despite real improvements, and sketch a *non-Whiggish account of real improvement* (positive specification, not just prohibition).
          *   **Marking Scheme:** 5 must-hit points (4 marks each = 20 total). One line per point on common failures. A/B boundary depends on the "positive specification" of defensible history.

  2.  **Drafting the Exam Question:**

      *   Needs to be precise enough to force the specific distinctions but open enough to allow argument.
      *   Needs to explicitly mention the asylum case study.
      *   Needs to explicitly mention the present-mindedness/directionality distinction.
      *   Needs to explicitly mention the self-reflexive critique (second-order problem).
      *   *Draft:* "Distinguish between present-mindedness and directionality. Using the historiography of the asylum, discuss which is the real vice. Does the critique of Whig history fall into the same trap? Finally, explain how to write about improvement without being Whiggish."
      *   *Refinement:* Make it sound more like a formal exam prompt. Ensure the "positive specification" requirement is clear.

  3.  **Drafting the Model Answer:**

      *   *Word Count:* Target ~600 words.
      *   *Structure:*
          1.  Define the distinction (Present-mindedness vs. Directionality).
          2.  Identify the real vice (Directionality).
          3.  Address the Second-Order Problem (Is anti-Whiggism Whiggish?).
          4.  Apply to the Asylum (The trap of the progress narrative).
          5.  The Crux: How to write about improvement non-Whiggishly.
      *   *Content:*
          *   *Distinction:* Present-mindedness is inevitable (we are in the present); Directionality is the error (teleology).
          *   *Second-Order:* Yes, the story of historiography improving is itself progressivist. We must acknowledge this irony without paralysis.
          *   *Asylum:* 19th-c reformers wanted humane care. Later saw institutions as oppressive. Now see community care as liberation. A Whig view says "we got better." A non-Whig view acknowledges gains without assuming inevitability or moral superiority.
          *   *Positive Specification:* How to talk about improvement? Focus on contingent victories, specific values of the time, and losses incurred alongside gains. Avoid "steps toward."
      *   *Tone:* Academic, precise, argumentative.

  4.  **Drafting the Marking Scheme:**

      *   *Total:* 20 marks (5 points x 4 marks).
      *   *A/B Boundary:* Based on the "positive specification" point (Point 5).
      *   *Points:*
          1.  Distinction between present-mindedness and directionality.
          2.  Identification of directionality as the primary vice (and separability).
          3.  Engagement with the second-order problem (critique as progress narrative).
          4.  Application to the asylum case (identifying the specific Whig trap there).
          5.  Positive specification of non-Whig improvement (The Crux).
      *   *Common Failures:* Need concise descriptions of how students miss these (e.g., conflating the two terms, ignoring the reflexivity, just saying "don't do it").

  5.  **Review and Refine:**

      *   *Check Word Count:* The model answer needs to be tight. I'll write it and then check.
      *   *Check Constraints:* Did I name historians? No. Did I cover the asylum? Yes. Did I cover the second-order problem? Yes. Is the marking scheme formatted correctly? Yes.
      *   *Check the "Crux":* The prompt emphasizes that the answer shouldn't just forbid things. The model answer must explicitly describe *how* to write history that acknowledges improvement without Whiggism.
      *   *Refining the Model Answer:* Ensure the transition from the theoretical (present-mindedness) to the practical (asylum) is smooth. Make sure the "second-order problem" doesn't swallow the whole essay; it needs to be acknowledged and moved past to get to the asylum analysis.
      *   *Refining the Marking Scheme:* Ensure the distinction between a B (prohibition) and an A (positive specification) is clear in Point 5.

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the model answer, make sure I don't just say "directionality is bad." I need to explain *why* present-mindedness is okay (we can't escape our time) but directionality is a distortion of causality.
      *   *Correction:* For the asylum, ensure I mention that reformers would reject the modern outcome (community care). This highlights the non-linearity.
      *   *Correction:* For the marking scheme, ensure the "common failure" lines are distinct and helpful for a marker.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  **Exam Question**

  **1. Critically distinguish between 'present-mindedness' and 'directionality' in historical explanation. Which constitutes the essential vice of Whig history, and can the former exist without the latter? Address the 'second-order problem': does the historiographical narrative in which historians learn to abandon Whiggism inevitably replicate the progress narrative it condemns? Finally, using the historiography of the asylum (from nineteenth-century reform to deinstitutionalization), demonstrate what is wrong with reading this trajectory as progress despite genuine material improvements, and sketch the contours of a non-Whiggish account that nonetheless acknowledges historical betterment.**

  ***

  **Model Answer**

  The critique of Whig history often conflates two distinct methodological sins: present-mindedness and directionality. Present-mindedness is the selection of past subjects based on contemporary concerns; directionality is the arrangement of those subjects to imply the past was moving teleologically toward the present. The essential vice is directionality. Present-mindedness is unavoidable; historians cannot shed their contemporary vantage point, nor should they, as current questions often illuminate dormant evidence. One can ask present-minded questions without imposing directionality, provided one treats the past as a foreign country with its own logic, rather than a nursery for the present. Directionality, conversely, distorts causality by treating antecedents merely as precursors, ignoring roads not taken and outcomes unforeseen by actors.

  However, this critique faces a second-order problem. The story historians tell about themselves—moving from naive Whiggism to sophisticated contextualism—is itself a narrative of intellectual progress toward the present. If we claim our methods are superior because we have shed past illusions, we replicate the Whig structure we condemn. To avoid paralysis, we must acknowledge this irony without succumbing to it. We can accept that our historiography has changed (a difference) without claiming it has objectively improved in a linear fashion (a progress). We must treat our own methodological history with the same contextual rigour we apply to our subjects.

  This tension is acute in the historiography of the asylum. A Whig reading charts a line from eighteenth-century neglect to nineteenth-century humane institutionalization, to twentieth-century community care. This narrative assumes each stage was a step toward a truer understanding of mental health. It fails because it imposes a coherence the actors lacked. Nineteenth-century reformers championed the asylum as a permanent moral solution; they would reject modern community care as abandonment. Similarly, viewing the asylum solely as a precursor to modern psychiatry obscures its function as a tool of social control specific to industrial capitalism. To call the shift to community care "progress" assumes the endpoint was inevitable and morally superior in a universal sense, ignoring that modern care often shifts burdens to families or the criminal justice system.

  Yet, rejecting Whiggism must not forbid acknowledging improvement. A non-Whiggish account of betterment avoids teleology by focusing on contingent victories rather than inevitable trajectories. It acknowledges that material conditions for patients genuinely improved in specific periods, but frames this as the result of specific political struggles and value systems, not the unfolding of liberty. For example, one can argue that the removal of chains in the 1800s was a moral gain, without claiming it was the first step toward deinstitutionalization. This requires a "loss-and-gain" analysis: acknowledging that while coercion decreased in one domain, it may have metastasized in another.

  To write defensible present-minded history, we must specify values explicitly rather than assuming them as the end of history. We can argue that community care aligns better with *our* current valuation of autonomy, provided we admit that nineteenth-century actors valued order and salvation differently. Improvement is thus localized and contested, not a vector. We avoid Whiggism not by pretending the present is not better in some ways, but by refusing to treat the present as the judge of the past's purpose. We write history that admits the past was not trying to become us, even if we are glad, for our own reasons, that it did not succeed.

  ***

  **Marking Scheme**

  **Total Marks: 20 (5 points × 4 marks)**

  | Point | Requirement | Common Failure / How to Miss It |
  | :--- | :--- | :--- |
  | **1** | **Distinguish Present-mindedness from Directionality:** Clearly defines present-mindedness as question-selection and directionality as teleological causality. | Conflates the two terms or treats all present-focused history as inherently Whiggish. |
  | **2** | **Identify the Vice & Separability:** Argues directionality is the true error and demonstrates that present-minded questions can be asked without teleological answers. | Claims present-mindedness must be eliminated entirely, or fails to explain how the two can be separated. |
  | **3** | **Address the Second-Order Problem:** Acknowledges that the history of anti-Whiggism risks becoming a progress narrative and offers a way to navigate this irony. | Ignores the reflexivity of the critique or claims it invalidates all historical judgment entirely. |
  | **4** | **Apply to the Asylum Case:** Identifies why the asylum/community care narrative is Whiggish (e.g., ignoring reformers' actual intent or non-linear outcomes). | Uses the asylum only as a generic example of "change" without engaging the specific historiographical trap described. |
  | **5** | **Positive Specification of Improvement:** Sketches how to acknowledge betterment non-Whiggishly (contingent gains, explicit values, loss-and-gain analysis). | **A/B Boundary:** Defines non-Whig history only by prohibition ("don't say progress") rather than offering a positive method for writing about improvement. |

  **Grade Boundaries:**
  *   **A (16-20):** Hits all 5 points robustly. Point 5 demonstrates a sophisticated understanding that one can judge the past without making it a precursor.
  *   **B (12-15):** Hits Points 1-4 well, but Point 5 is weak, negative, or merely repeats the prohibition against Whiggism without explaining how to write about improvement.
  *   **C (8-11):** Hits Points 1 and 2, but struggles with the second-order problem or the specific application to the asylum.
  *   **D/F (0-7):** Fails to distinguish the core concepts or relies on namedropping historians (violating closed-book constraint).
