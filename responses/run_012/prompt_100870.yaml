  I choose neither. In the world where the zygote does not split, a single person exists, but that person is identical to neither of the actual twins. This follows because origin essentialism is a constraint on the history of an existing individual, not a guarantee that a specific gametic fusion must produce you. You could not have come from different gametes, but it does not follow that any person arising from these gametes is you. The specific developmental path—including the fission event that individuates you from your twin—is part of the essential historical route that makes you who you are.

  This preserves the work of "essential" without arbitrariness. To claim you are essentially from this sperm and egg is to claim that any world containing you must contain that gametic fusion *and* the specific causal chain actually connecting them to you. If the chain diverges at the zygotic stage, the resulting individual lacks your essential history. We are not positing a bare thisness; we are recognizing that biological identity is grounded in the continuity of development. Thus, the single individual in the non-splitting world is a distinct person who shares your gametic origins but not your identity.
