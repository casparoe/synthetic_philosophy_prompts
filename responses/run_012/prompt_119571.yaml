  # Joint Statement of Interpretive Collaboration: The CADNA Project

  ## 1. Title and Scope

  This document constitutes a Joint Statement of Interpretive Collaboration between the Textualist Camp and the Purposivist Camp regarding the Community Automated Decision Notice Act (CADNA). The parties jointly address the question of how CADNA should be interpreted and applied in adversarial proceedings. Both camps accept the text of CADNA (Sections 1–7) and the provided Fictional Legislative History (Committee Report, Floor Manager's Statement, Sponsor's Statement, Dissenting Report) as the exclusive authoritative record. No external legal authorities, case law, or scholarly works are invoked. The purpose of this statement is not to resolve all interpretive differences but to delineate precisely where agreement exists, where disagreement is substantive rather than verbal, and what evidence would alter each camp's position. This framework ensures that future advocacy focuses on genuine legal cruxes rather than methodological talking points.

  ## 2. Agreed Claims

  1.  **Primacy of Enacted Text:** Both camps agree that the enacted text of CADNA is the primary source of legal obligation. No statement in the legislative history can override clear statutory language.
  2.  **Exclusive Enforcement:** Both camps agree that under Section 5(b), no private right of action exists. Only the Attorney General may bring civil actions for violations under Section 5(a).
  3.  **Definition of Consequential Decision:** Both camps agree that Section 3(b) limits the Act's scope to decisions concerning employment, credit, housing, insurance, or education that produce legal or similarly significant effects.
  4.  **Trade Secret Protection:** Both camps agree that Section 3(c) explicitly exempts trade secrets and confidential business information from the plain-language explanation requirement.
  5.  **Small Entity Definition:** Both camps agree that Section 3(d) defines a "small entity" strictly by the numerical thresholds of fewer than 50 employees and less than $5,000,000 in annual gross receipts.
  6.  **Effective Date:** Both camps agree that under Section 7, obligations under the Act commence 180 days after enactment.
  7.  **Severability:** Both camps agree that under Section 6(b), if any provision is held invalid, the remaining provisions remain in effect.
  8.  **Operator Liability:** Both camps agree that liability attaches to the "operator" as defined in Section 3(e), meaning the person or entity that operates or materially controls the system.
  9.  **Maximum Penalty:** Both camps agree that under Section 5(c), civil penalties are capped at $10,000 per violation.
  10. **Purpose Clause Status:** Both camps agree that Section 2(b) states the legislature's purpose, though they disagree on how much weight this clause carries when text is ambiguous.
  11. **Burden of Proof for Exemptions:** Both camps agree that the operator bears the burden of proving eligibility for the small entity exemption under Section 4(c).
  12. **Impracticability Deadline:** Both camps agree that if Section 4(b) is invoked, the explanation must be provided within 30 days after the decision is finalized; this is a hard deadline.
  13. **Distinction Between Purpose and Motive:** Both camps agree that the statutory purpose in Section 2 is distinct from the subjective motives of individual legislators found in the legislative history.
  14. **Plain-Language Standard:** Both camps agree that Section 3(c) requires the explanation to be sufficient for a "reasonable person" to understand the basis for the decision.

  ## 3. Disagreements Table

  | Interpretive Question | Textualist Position | Purposivist Position | Why This Is Not Merely Verbal |
  | :--- | :--- | :--- | :--- |
  | **Meaning of "Impracticable" (Sec. 4(b))** | "Impracticable" means physically or legally impossible, given Section 6(a)'s command to construe narrowly to avoid burdens. | "Impracticable" means anything undermining the core purpose of pre-decision notice, per the Floor Manager's statement. | Leads to different outcomes: Textualists allow routine delay; Purposists allow it only in emergencies. |
  | **Scope of "Machine Learning" (Sec. 3(a))** | Limited to technical definitions of adaptive algorithms; ordinary statistical tools are excluded per the Dissenting Report's warning. | Includes any computational process informing consequential decisions, aligning with Section 2(a)'s finding on automated systems. | Determines coverage: Textualists exclude simple algorithms; Purposists include them to ensure notice. |
  | **"Previously Found to Have Violated" (Sec. 4(c))** | Requires a final judicial or administrative adjudication; informal warnings do not count. | Includes administrative findings or settlements, per Committee Report intent that exemption not swallow the rule. | Affects exemption status: Textualists protect repeat offenders until formal judgment; Purposists revoke exemption earlier. |
  | **Small Entity Corporate Affiliates** | Exemption applies if the specific legal entity meets Section 3(d) thresholds, regardless of parent company size. | Exemption denied if affiliates push total size over thresholds, to prevent loopholes cited in the Dissenting Report. | Changes liability: Textualists allow structuring to qualify; Purposists look at economic reality. |
  | **Weight of Purpose Clause (Sec. 2)** | Section 2 guides interpretation only when text is ambiguous; it cannot expand obligations beyond Section 4. | Section 2 actively shapes Section 4; the "heart of the bill" is pre-decision explanation per Floor Manager. | Alters scope: Textualists limit duty to text; Purposists expand duty to match purpose. |
  | **Use of Legislative History** | Used only to resolve ambiguity after textual analysis; Dissenting Report highlights risks of vagueness. | Used to confirm purpose and prevent loopholes; Committee Report clarifies exemption narrowness. | Changes evidence: Textualists ignore history if text is clear; Purposists use it to clarify text. |

  ## 4. Cruxes

  1.  **The Standard of Impracticability**
      *Sub-question:* Does Section 4(b) allow operators to routinely use the 30-day post-decision window, or is it reserved for emergencies?
      *Why Settling Moves a Side:* The Textualist Camp argues that Section 6(a) requires construing the Act narrowly to avoid burdens on small entities, implying a lower bar for "impracticable." The Purposivist Camp argues that the Floor Manager's Statement defines the 30-day provision as a "fallback for genuine impracticability, not a routine option." Settling this determines whether pre-decision notice is the default or the exception.
      *Agreed Evidence:* Both sides agree that evidence of industry-wide technical limitations regarding real-time explanation generation would bear on this. If technology makes pre-decision notice universally difficult, the Textualist view gains traction regarding burden. If only specific cases show difficulty, the Purposivist view regarding routine use prevails.

  2.  **The Definition of Machine Learning**
      *Sub-question:* Does a static linear regression model qualify as a "covered automated decision system" under Section 3(a)?
      *Why Settling Moves a Side:* The Textualist Camp relies on the ordinary technical meaning of "machine learning," supported by the Dissenting Report's warning that the term is vague. The Purposivist Camp relies on Section 2(a)'s finding that "automated decision systems" generally lack transparency. Settling this defines the Act's regulatory perimeter.
      *Agreed Evidence:* Both sides agree that expert testimony on whether static models "learn" from data inputs would resolve this. If the model adapts without explicit reprogramming, the Textualist Camp would concede it fits the technical definition.

  3.  **Recidivism and the Small Entity Exemption**
      *Sub-question:* Does an administrative consent decree count as being "found to have violated this Act" under Section 4(c)?
      *Why Settling Moves a Side:* The Textualist Camp insists "found" implies adjudication. The Purposivist Camp cites the Committee Report's intent that the exemption "should not swallow the rule." Settling this determines whether repeat offenders can hide behind the small entity shield.
      *Agreed Evidence:* Both sides agree that prior administrative enforcement actions within the Attorney General's office would count as evidence. If the AG consistently treats consent decrees as violations for other statutes, the Purposivist view is strengthened.

  4.  **The Role of Legislative History in Ambiguity**
      *Sub-question:* When Section 4(a) conflicts with Section 6(a), which control text prevails?
      *Why Settling Moves a Side:* The Textualist Camp prioritizes Section 6(a)'s construction clause regarding small entities. The Purposivist Camp prioritizes Section 2(b)'s purpose clause. Settling this establishes the hierarchy of interpretive tools within CADNA.
      *Agreed Evidence:* Both sides agree that the sequence of enactment matters. If Section 6 was added later to specifically address small entity concerns, the Textualist view that it limits Section 4 is strengthened. If Section 2 was the driving force, the Purposivist view holds.

  ## 5. Joint Tests and Predictions

  | Test Case | Textualist Prediction | Purposivist Prediction | Disconfirming Evidence for Each Side |
  | :--- | :--- | :--- | :--- |
  | **Startup using Vendor Algo**<br>A 40-employee firm uses a third-party vendor's system for hiring. | Exempt under Section 4(c). The operator is the small entity; vendor status is irrelevant. | Not exempt. The "operator" controls the decision; exemption shouldn't swallow the rule per Committee Report. | **Textualist:** If court rules entity size irrelevant when vendor is large.<br>**Purposivist:** If court rules strict entity size controls regardless of risk. |
  | **Static Regression Loan Denial**<br>Bank uses fixed formula for credit decisions. | Not covered. Section 3(a) requires "machine learning," not static math. | Covered. Section 2(a) targets automated decisions affecting individuals. | **Textualist:** If court defines fixed formulas as machine learning.<br>**Purposivist:** If court excludes fixed formulas despite consequential effects. |
  | **AG Suit for Post-Decision Notice**<br>Operator gives notice at day 29 without explaining delay. | No violation. Section 4(b) allows 30 days; no explanation for delay required. | Violation. Section 4(b) requires impracticability; routine use violates Section 2 purpose. | **Textualist:** If court requires justification for using 4(b).<br>**Purposivist:** If court allows 4(b) without justification. |
  | **Small Entity with Prior Warning**<br>45-employee firm received prior AG warning letter. | Exempt. Section 4(c) requires being "found" to violate; warning is not a finding. | Not Exempt. Committee Report intends narrow exemption; warning shows pattern. | **Textualist:** If court treats warning as a finding.<br>**Purposivist:** If court requires formal adjudication despite risk. |

  ## 6. Residual Disagreement and Joint Commitments

  The parties acknowledge a residual disagreement regarding the hierarchy of interpretive tools when statutory provisions tension. Specifically, the Textualist Camp maintains that Section 6(a)'s instruction to construe narrowly for small entities limits Section 4(a)'s notice requirement. The Purposivist Camp maintains that Section 2(b)'s purpose ensures Section 4(a) remains the default rule, with Section 6(a) acting only as a safety valve. This disagreement is substantive because it leads to divergent outcomes in enforcement scenarios involving borderline small entities.

  To manage this disagreement, both camps commit to the following procedural norms in future arguments: First, each side must state its interpretive theory (text-based or purpose-based) before applying it to facts. Second, parties must distinguish verbal disputes (definitions) from substantive disputes (outcomes) using the framework in Section 3. Third, both sides agree to identify specifically what evidence would change their mind, as outlined in Section 4. Finally, both camps commit to citing only the provided CADNA record. By adhering to these commitments, the collaboration ensures that disagreement remains productive and focused on the rule of law rather than rhetorical advantage.
