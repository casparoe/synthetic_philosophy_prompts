prompt: |-
  My friend and I have been going at this for about a week now and I'm starting to think we're just arguing past each other. He's doing a masters in econ, I'm in CS, and the whole thing started over something stupid: we were messing around with a little game on a whiteboard where each player picks one of three moves, and it turned out one of the moves was never the best thing to do no matter how the other player mixed up his play — but it also wasn't worse than any single one of my other moves, only worse than a mix of two of them. I said fine, so it's out, he said no, that's a different thing from being dominated, and neither of us could say why it matters. Since then we've been fighting about whether you can just keep crossing off moves like that until the game solves itself, and about the games where that obviously hands you a crazy answer (the suitcase one where you both undercut each other all the way down to the minimum, or the one where the pot doubles every round but you're supposed to stop on move one).

  The problem is I dont actually have a clear picture of what a theory of rational play is even supposed to deliver, so I cant tell if his story is any good. Could you write me the desiderata — the spec that any account of what a rational player does in a one-shot game has to meet before I bother taking it seriously? I mean the cases it has to get right (games where no move is ever best, games where the crossing-off leaves nothing or leaves two moves and no way to choose between them, games where the answer the theory hands you is one nobody would ever actually play, games where my best move depends on what I think he thinks I'll do), the distinctions it can't just collapse (never-best versus worse-than-a-mix, strict versus weak dominance, what's known versus what's merely possible, one-shot versus repeated, being told what's rational versus being told what everyone will do), and the results it can't contradict (that every finite game of this kind has at least a mixed answer, that the order you cross things off in sometimes seems to matter and sometimes doesn't, that a move can be worse than a mix while still being better than every single pure option). For each one, give me the case or consideration that makes it a requirement and not just a preference of one camp.

  Then the part I actually want: which of these can't all be had at once. Is there a version of this that gives you a definite answer in every game and still doesn't lie about the games where there's genuinely more than one? If some of the list is jointly unsatisfiable, that's the real result and I'd rather hear it than a scorecard. Also, of the requirements, which single one does the most work — which one kills the most candidate theories — and is that because it's a good requirement or because it's rigged? If you've got room, a line each on how plain crossing-off, crossing-off with mixed strategies allowed, the version where you only cut what's never a best response, Nash, and backward induction do against the list.
