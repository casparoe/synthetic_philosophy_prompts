answer: |-
  This is a classic friction point between Computer Science (algorithmic decidability, clear specs) and Economics (behavioral modeling, equilibrium selection). Your friend is arguing from the standpoint of *normative* theory (what a perfectly logical agent *should* do), while you are bumping into the *positive* reality (what the math actually allows vs. what humans do).

  Here is the spec you asked for, followed by the impossibility result that explains why you two are stuck.

  ### Part 1: The Spec (Desiderata for a Theory of Rational Play)

  If you are writing a function `Solve(Game G) -> Move`, here are the requirements it must meet to be taken seriously as a general theory of one-shot rational play.

  #### A. Functional Requirements (The "Must Haves")
  1.  **Existence (Termination):** For every finite game, the theory must return *at least one* recommended strategy profile.
      *   *Why:* A theory that says "I don't know" for valid inputs is incomplete. (Matches CS expectation of decidability).
  2.  **Dominance Respect:** If a strategy is strictly dominated (yields lower payoff than another strategy against *all* opponent moves), the theory must not recommend it.
      *   *Why:* This is the minimal definition of "irrational." Playing a dominated move is lighting money on fire.
  3.  **Invariance (Representation Independence):** The output must not change if you relabel the moves, swap the order of players, or add a duplicate row/column that is identical to an existing one.
      *   *Why:* The solution should depend on the *structure* of incentives, not the syntax of the matrix.
  4.  **Consistency (Fixed Point):** If the theory recommends Player A play $X$ and Player B play $Y$, then $X$ must be a best response to $Y$, and $Y$ to $X$.
      *   *Why:* If the theory tells you to play a move that would be stupid *given* what it told the other guy to play, the theory is lying to at least one of you.

  #### B. Edge Cases (The "Must Handle")
  5.  **The Mixed-Dominance Case:** The theory must handle strategies that are not dominated by any *single* other move, but are dominated by a *probability distribution* over moves.
      *   *Why:* As you found on the whiteboard. If you ignore this, you leave "dominated" strategies on the board, breaking the elimination logic.
  6.  **The Coordination Case:** In games with multiple equally good equilibria (e.g., both pick Left or both pick Right), the theory must acknowledge the ambiguity.
      *   *Why:* If the theory forces a unique choice here, it is hallucinating information not present in the game.
  7.  **The Zero-Structure Case:** In games like Matching Pennies (pure conflict, no pure equilibrium), the theory must allow for mixed strategies.
      *   *Why:* Restricting to pure moves in these games violates Existence.

  #### C. Constraints (The "Must Not Do")
  8.  **No Order Dependence:** If the theory uses iterative elimination (crossing off moves), the final result must not depend on the order in which you cross them off.
      *   *Why:* Algorithmic non-determinism is a bug, not a feature.
  9.  **No Empirical Absurdity (Plausibility):** In games like the Traveler's Dilemma (where logic dictates undercutting to the minimum), the theory should not confidently predict an outcome that humans universally reject as "stupid" without explaining why.
      *   *Why:* A theory of "rational play" that defines rationality as "suicidal" is semantically broken.

  ---

  ### Part 2: The Impossibility Result

  You asked which of these can't be had at once. Here is the hard truth:

  **You cannot satisfy Existence, Uniqueness, and Empirical Plausibility simultaneously.**

  This is the "Game Theory CAP Theorem."

  1.  **Existence + Uniqueness $\rightarrow$ Loss of Plausibility.**
      To guarantee a single, unique answer in *every* game (like Traveler's Dilemma or Centipede), you must assume **Common Knowledge of Rationality (CKR)**. You must assume not only that you are rational, but that he is rational, and that you know he knows you are rational, ad infinitum.
      *   *The Cost:* This forces the "crazy" answers. In Traveler's Dilemma, CKR forces you down to the minimum dollar. In Centipede, it forces you to stop on move one. This satisfies Existence and Uniqueness, but violates Plausibility.

  2.  **Existence + Plausibility $\rightarrow$ Loss of Uniqueness.**
      If you want to match human behavior (Plausibility) and guarantee an answer (Existence), you usually have to settle for **Nash Equilibrium**.
      *   *The Cost:* Nash guarantees an answer (if mixed strategies are allowed), but it often returns *multiple* answers. In a Coordination Game, Nash says "Both Left OR Both Right." It refuses to pick one. If your spec demands a unique move, Nash fails.

  3.  **Uniqueness + Plausibility $\rightarrow$ Loss of Existence.**
      If you demand a unique answer that humans would actually play, you need social context, focal points, or cultural norms not encoded in the payoff matrix.
      *   *The Cost:* The theory is no longer self-contained. It requires external input. For a formal `Solve(G)` function, this means the function is undefined for many games.

  **The Verdict:** Your friend (Econ) is prioritizing **Uniqueness** and **Dominance Respect** (via CKR). You (CS) are intuitively prioritizing **Plausibility** and **Consistency**. The reason you are arguing past each other is that he is defining "Rational" as "Logically Consistent with CKR," and you are defining "Rational" as "Sensible Outcome."

  ---

  ### Part 3: The Killer Constraint

  **Which single requirement does the most work?**

  **Uniqueness.**

  This is the constraint that kills the most candidate theories.
  *   **Why it kills theories:** Most games do not have a single logically necessary outcome. By demanding uniqueness, you force the theory to make assumptions (like CKR or specific risk attitudes) that are not in the game definition.
  *   **Is it rigged?** Yes. It is rigged by the desire for a "solution concept" that acts like an algorithm. In reality, rationality is often a *set* of permissible actions, not a *single* instruction. Demanding uniqueness turns a descriptive map into a prescriptive order, which is where the paradoxes (Centipede, Traveler) come from.

  If you drop Uniqueness, Nash Equilibrium satisfies almost everything else (Existence, Consistency, Dominance Respect). If you keep Uniqueness, you are forced into Iterated Dominance or Backward Induction, which break Plausibility.

  ---

  ### Part 4: Scorecard of Solution Concepts

  Here is how the standard concepts stack up against your spec.

  **1. Plain Crossing-Off (Pure IEDS)**
  *   *Method:* Eliminate moves strictly worse than another *pure* move. Repeat.
  *   *Verdict:* **Fail.** It fails your whiteboard case. It leaves strategies on the board that are dominated by mixes. It is too weak to solve many games.

  **2. Crossing-Off with Mixes (Mixed IEDS)**
  *   *Method:* Eliminate moves worse than any *probability distribution* of other moves.
  *   *Verdict:* **Pass on Logic, Fail on Plausibility.** This solves your whiteboard argument (your friend is right: that move is dominated). It is order-independent. However, in games like Traveler's Dilemma, it eliminates everything but the worst possible outcome. It satisfies Uniqueness but violates Plausibility.

  **3. Never a Best Response (Rationalizability)**
  *   *Method:* Eliminate moves that are not a best response to *any* belief about the opponent.
  *   *Verdict:* **Pass on Coherence, Fail on Decisiveness.** In 2-player games, this is mathematically equivalent to Mixed IEDS. In 3+ player games, it is weaker (keeps more moves). It describes what is *possible* for a rational player, not what *will* happen. It rarely yields a unique answer.

  **4. Nash Equilibrium**
  *   *Method:* Find a profile where no one wants to deviate.
  *   *Verdict:* **The Baseline.** It guarantees Existence (with mixes) and Consistency. It respects Dominance. But it fails Uniqueness (often returns multiple equilibria) and it is static (doesn't tell you *how* to find it). It is the "correct" answer for stability, but not always for prediction.

  **5. Backward Induction**
  *   *Method:* Solve the last move, then the second to last, assuming rationality holds in the future.
  *   *Verdict:* **Fail on Plausibility.** This is the engine of the Centipede paradox. It assumes future rationality is common knowledge. It yields unique answers, but they are often empirically wrong. It works for computers, not people.

  ### Summary for your argument
  Tell your friend this: **"Mixed IEDS is logically sound for 2-player games, so you are right that the move should be cut. But if we use that logic to demand a unique solution in every game, we end up with the Traveler's Dilemma paradox. If you want a theory that predicts unique moves, you have to admit it will often predict moves no human would make. If you want a theory that predicts human moves, you have to admit it won't always be unique."**

  You are arguing about whether the spec should prioritize **Logical Closure** (him) or **Predictive Validity** (you). Neither is wrong, but they are different products.
