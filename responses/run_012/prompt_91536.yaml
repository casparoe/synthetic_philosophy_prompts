      *   *HO Theory Core:* A mental state is conscious *iff* it is the object of a higher-order representation.
      *   *Mapping:*
          *   Option A: Motor preparation is FO. Urge (W) is HO. (Standard HO view).
          *   Option B: Urge is FO. Something else is HO? (Unlikely, usually the *feeling* of willing is the conscious state).
          *   *Crucial Distinction:* Is the "urge" the *target* of awareness or the *awareness* itself? In HO theories, the conscious *experience* is constituted by the HO state. So the "felt urge" *is* the HO state representing the motor preparation.
      *   *Timing:* RP (unconscious motor prep) starts early. HO state (conscious urge) arises later. This fits HO perfectly (consciousness is a late-stage monitor).
      *   *Misrepresentation:* HO theories allow the HO state to be wrong. If TMS shifts W but not movement, the HO state (urge) is misrepresenting the timing or source of the FO state (motor prep).
      *   *Classmate's Charge:* "Just a redescription." Is it? A redescription just renames things. A theory explains *why* the gap exists (mechanism of monitoring).
