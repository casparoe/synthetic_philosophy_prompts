  Also, regarding the veto: Libet's veto is conscious. If consciousness requires HO, the veto requires HO. If the veto stops the action, does the HO cause the stop? HO theories generally deny causal efficacy of the HO state itself (it's a monitor). This is a major tension. I must highlight this silence.

