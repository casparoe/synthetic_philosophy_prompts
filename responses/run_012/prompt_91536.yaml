          *   *The Veto/Regress:* Libet's "Free Won't." If vetoing is conscious, it requires a HO state. Does *that* need a HO state? HO theorists (e.g., Rosenthal) might say the veto is a distinct executive function, not necessarily requiring infinite recursion if the mechanism is dispositional. But strictly, yes, it's a vulnerability.
      *   **Part 3: The Noise/Threshold Reanalysis:**
