      *   *Specific Question:* "Regress." If I veto consciously, is there a HO state about the veto? Yes. Does it regress? Standard HO reply: The HO mechanism is a standing disposition, not an infinite chain of thoughts. But in the Libet context, the "veto" is often treated as a conscious interruption. This is a weak point for HO.
      *   *Specific Question:* "Noise Reanalysis." If RP is noise, the FO state isn't a "decision." It's just fluctuating activity. The HO state (W) is the point where confidence crosses threshold. This actually fits Bayesian HO *better* than classic Libet interpretation.

