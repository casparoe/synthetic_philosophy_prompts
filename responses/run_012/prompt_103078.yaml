answer: |-
  # Activity: The Calibration Protocol

  **Objective:** To force students to publicly commit to a finite exchange rate between trivial and serious harms, then demonstrate how that rate necessitates a counter-intuitive aggregation conclusion.
  **Time:** 45 minutes (Activity) + 45 minutes (Debrief/Lecture).
  **Class Size:** 18 students (split into 3 groups of 6).
  **Materials:** Whiteboard, markers, 3 printed "Scenario Cards" (see below), a visible timer.

  ## The Stake: "The Time Dividend"
  To create pressure without financial cost, use **class time**.
  *   **Success Condition:** If the class produces a single, consistent integer exchange rate and applies it to the final case without contradiction by the 45-minute mark, the last 10 minutes of class become unstructured free time (or early dismissal).
  *   **Failure Condition:** If they deadlock, refuse to commit to a number, or contradict their own number in the final vote, you (the instructor) lecture for the final 10 minutes on "Why Your Intuitions Are Inconsistent."
  *   **Why this works:** It incentivizes *aggregation* (finding a number) over *lexical refusal* (saying "no number exists"), mirroring the philosophical pressure to quantify value.

  ---

  ## Phase 1: Calibration (30 Minutes)

  ### Setup (5 mins)
  Tell the class: *"You are the Ethics Board for a new public policy AI. The AI cannot handle qualitative nuance; it requires a single integer conversion rate to make triage decisions. It asks you: 'How many Units of Trivial Harm equal 1 Unit of Serious Harm?' You must give it a number. If you do not agree on a number, the AI defaults to randomization. Your goal is to set the rate."*

  Divide the class into **three groups of 6**.
  *   **Group 1 (The Sub-Threshold):** Their trivial harm is a **10-millisecond load delay** on a website. (Most humans cannot perceive this).
  *   **Group 2 (The Negligible):** Their trivial harm is a **5-second mild itch** (like a mosquito bite you don't scratch). (Perceptible but trivial).
  *   **Group 3 (The Control):** Their trivial harm is a **1-minute wait in line**. (Noticeable and annoying).

  **The Serious Harm (All Groups):** 1 Hour of intense, non-damaging pain (e.g., passing a kidney stone without medication).

  ### The Rules of Commitment (2 mins)
  1.  **No Qualifiers:** You cannot say "it depends." You must output an integer (e.g., 5,000).
  2.  **Public Record:** The number must be written on the board and signed by a group representative.
  3.  **Transitivity:** If $N$ Trivial = 1 Serious, then $2N$ Trivial = 2 Serious. You must accept the math.

  ### Group Deliberation (23 mins)
  Circulate among groups. If a group says, "You can't compare these," reply: *"The AI requires an input to function. If you refuse, the system crashes and people die. You must choose a number to keep the system running."* (This forces the aggregation premise).

  **Instructor Note:** Watch for Group 1. They will likely struggle to call the 10ms delay a "harm" at all. Encourage them: *"In a system of a billion users, resource waste is a harm. Quantify it."*

  ---

  ## Phase 2: The Stress Test (15 Minutes)

  ### The Reveal (5 mins)
  Bring the class back together. Write the three numbers on the board.
  *   *Example:* Group 1 (Delay): 1,000,000 | Group 2 (Itch): 50,000 | Group 3 (Wait): 500.

  Now, present the **Global Scenario**:
  *"The AI has detected a crisis. We have the capacity to prevent **1 Person** from suffering the Kidney Stone (1 Hour Agony). However, using that capacity will cause the Trivial Harm to **10 Million People**."*

  ### The Vote (5 mins)
  Ask each group to apply *their own number* to this scenario.
  *   **Math:**
      *   Group 1: 10,000,000 delays / 1,000,000 rate = **10 Agonies**. (Conclusion: Prevent the delays, allow the Agony).
      *   Group 2: 10,000,000 itches / 50,000 rate = **200 Agonies**. (Conclusion: Prevent the itches, allow the Agony).
      *   Group 3: 10,000,000 waits / 500 rate = **20,000 Agonies**. (Conclusion: Prevent the waits, allow the Agony).

  Ask for a show of hands: *"Based strictly on the number you wrote on the board, is it morally obligatory to let the one person suffer the Kidney Stone to save the 10 million from the trivial harm?"*

  ### The Trap Springs (5 mins)
  Almost no one will raise their hand. They will recoil.
  *   **Instructor:** *"You signed the number. The math is simple. If you do not follow the number, you fail the Consistency Check, and I lecture for the last 10 minutes. If you follow the number, you get free time. What is your decision?"*
  *   This creates the visceral tension: **Do I honor my commitment (Aggregation) or my moral intuition (Lexical/Threshold)?**

  ---

  ## Debrief & Mapping (45 Minutes)

  ### 1. The Aggregation Premise (15 mins)
  Ask the groups who set a finite number: *"What justified that number?"*
  *   **Map:** This is the **Aggregation Premise**. Small harms sum up.
  *   **Point out:** By accepting *any* finite number, you accepted that enough dust specks outweigh torture.
  *   **Question:** "Did anyone feel that the math was correct, but the conclusion was wrong?" (This isolates the conflict between rationality and intuition).

  ### 2. The Threshold Escape (15 mins)
  Focus on **Group 1 (The 10ms Delay)**.
  *   **Ask:** "Did anyone in Group 1 argue that 10ms is *zero* harm?"
  *   **Map:** This is the **Threshold View**. Below a certain magnitude, a 'harm' is not a moral negative. It is zero.
  *   **Implication:** If the harm is zero, no amount of it sums to outweigh agony.
  *   **Critique:** Ask the class: "Is a 10ms delay *really* zero? If I delay your website load by 10ms a billion times, I have wasted hours of human life. Is wasted time a harm?"
  *   **Activity Link:** If Group 1 set a number like "1,000,000," they rejected the Threshold. If they set "Infinity" or refused, they attempted the Threshold escape.

  ### 3. The Lexical Escape (15 mins)
  Focus on the **Recoil in Phase 2**.
  *   **Ask:** "When you saw the conclusion (Let one person suffer agony), many of you wanted to throw out your number. Why?"
  *   **Map:** This is the **Lexical View**. Serious harms belong to a higher category that trivial harms cannot touch, regardless of quantity.
  *   **Activity Link:** This is the "Failure Condition" in the game. To choose Lexically is to admit the AI (and the exercise) cannot model morality.
  *   **Contrast:** Compare Group 1 (Delay) and Group 2 (Itch).
      *   If $N_{delay} \approx N_{itch}$, they are tracking **Noticeability** (Threshold), not Magnitude.
      *   If $N_{delay} \gg N_{itch}$, they are tracking **Magnitude** (Aggregation).
      *   *Reveal:* Usually, students treat "Unnoticed" as Zero (Threshold) and "Noticed" as Finite (Aggregation). This shows their intuition relies on *perception*, not *welfare*.

  ### 4. Limitations (5 mins)
  Be frank about what the activity missed:
  *   **Rights:** The activity treats harm as a fluid resource. It ignores rights-based constraints (I cannot be sacrificed for the greater good).
  *   **Epistemology:** In the real world, we can't count dust specks. The activity assumes perfect knowledge of consequences.
  *   **Psychology:** The activity forces cold calculation. Real moral judgment involves empathy, which deactivates during aggregation.

  ---

  ## Predictable Failures & Fixes

  ### 1. The "It Depends" Revolt
  *   **What happens:** Students refuse to give an integer, arguing context matters (e.g., "Is the person rich? Poor?").
  *   **Why:** They are trying to avoid the trap by rejecting the abstraction.
  *   **Fix:** Enforce the "AI Constraint." *"The AI is already deployed. It is asking for the parameter now. If you do not give a number, it chooses randomly. Give me the 'Best Guess' integer."* Force them into the utilitarian calculus.

  ### 2. The "Infinity" Loophole
  *   **What happens:** A group writes "Infinity" or "Impossible" to avoid the conclusion.
  *   **Why:** They intuit the Lexical escape immediately.
  *   **Fix:** Challenge them in Phase 2. *"If the choice is between 1 Agony and 1 Trillion Itches, and your rate is Infinity, the AI defaults to Randomization. There is a 50% chance the 1 Trillion Itches happen. Do you accept that risk?"* This forces them to weigh the risk of inaction against the cost of aggregation.

  ### 3. The "Time Dividend" Backfire
  *   **What happens:** Students prefer your lecture to making a "immoral" choice, so they intentionally fail the consistency check.
  *   **Why:** The stake wasn't high enough to override moral disgust.
  *   **Fix:** Acknowledge this in the debrief. *"You chose moral integrity over free time. That is the Lexical Escape in action. You placed 'Doing the Right Thing' on a different scale than 'Saving 10 Minutes'."* Turn their rebellion into data.

  ### 4. Confusion Between Harm and Annoyance
  *   **What happens:** Students argue a 10ms delay isn't a "harm."
  *   **Fix:** This is the **Threshold** debate. Don't resolve it. Highlight it. *"Group 1, you are arguing for a Threshold. Group 2, you are arguing for Aggregation. Why do you disagree on what counts as a harm?"*

  ## Instructor Script Snippet (For Phase 2 Reveal)
  *"Look at the board. Group 2, you wrote 50,000. That means 50,000 itches equal one hour of kidney stone pain. There are 10 million people. That is 200 hours of pain equivalent. By your own math, the itches are worse. If you vote to save the one person from the kidney stone, you are lying. You are saying your number was a lie. If you vote to save the 10 million from itches, you are a monster. Which are you?"*
