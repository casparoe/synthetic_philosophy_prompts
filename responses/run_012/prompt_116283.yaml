answer: |-
  ### Screening Procedure for Amendment Justifications

  **Purpose:** To determine whether an amendment's justification relies on 'public reasons' (accessible to all citizens) or 'comprehensive doctrines' (religious or metaphysical beliefs held only by some).
  **Time Limit:** 20 minutes per case.
  **Authority:** This procedure operationalises the committee's standing order on public reason. It does not assess the merit of the amendment, only the justificatory basis provided.

  #### Step 1: Isolate the Justification (5 minutes)
  Read the explanatory statement. Highlight every sentence that offers a reason *why* the state should pass this law. Ignore procedural comments or expressions of hope.
  *   **Action:** List the core premises.
  *   **Stop Rule:** If there is no explanatory statement, **Handoff to Chair**. Note: 'No justification provided.'

  #### Step 2: The Removal Test (Load-bearing vs. Ornamental) (5 minutes)
  Take the highlighted reasons. Mentally delete all references to God, scripture, religious authority, sin, or divine command.
  *   **Question:** Does the argument collapse without these words?
  *   **Yes (Load-bearing):** The reason depends on the religious claim. Proceed to Step 3.
  *   **No (Ornamental):** The reason stands on secular grounds (e.g., public health, economic cost, legal consistency) even if the member was personally motivated by faith. **Verdict: Clears.**
      *   *File Note:* 'Justification rests on secular grounds [list grounds]; religious references are contextual only.'

  #### Step 3: The Translation Test (5 minutes)
  If the argument collapsed in Step 2, ask: Can this religious claim be translated into a secular harm or benefit without losing its force?
  *   **Example:** 'This is sinful' translates to 'This causes measurable social harm.'
  *   **Example:** 'God forbids this' translates to 'This violates established human rights law.'
  *   **Question:** Is there a secular equivalent offered in the text?
  *   **Yes:** Proceed to Step 4.
  *   **No:** The justification is purely doctrinal. **Verdict: Sent Back.**
      *   *File Note:* 'Justification rests exclusively on theological premises; no secular equivalent offered for state coercion.'
      *   *Action:* Return to member. They must supply a public reason.

  #### Step 4: The Mirror Test (Reciprocity) (5 minutes)
  Apply the committee's standing order. Take the core premise (religious or secular).
  *   **Question:** If a member of a rival faith (or no faith) used this exact logic to restrict *your* member's practices, would your member accept it as valid?
  *   **Yes:** It passes the reciprocity test. **Verdict: Clears.**
  *   **No:** It fails the reciprocity test. **Verdict: Sent Back.**
      *   *File Note:* 'Premise fails reciprocity test; would not be accepted if invoked by rival doctrine.'

  #### Step 5: Mover Context Check (Final Decision)
  *   **Government Minister:** If the verdict is 'Sent Back', **Handoff to Chair**. Ministers speak for the executive; blocking their justification requires political judgment. The Clerk notes the defect, the Chair decides whether to enforce.
  *   **Backbencher / Public Submission:** Apply the verdict directly. If 'Sent Back', return to member for revision. If 'Clears with Translation' (see below), allow the amendment but note the justification needs rewording for the record.

  #### Special Guidance on Sticking Points
  1.  **Private Motivation:** It does not matter why the member *really* believes it. If the text provided offers a public reason, it clears. You are screening the text, not the soul.
  2.  **Intelligibility:** Everyone understanding the words 'God forbids X' does not make it a public reason. Public reason requires acceptance, not just comprehension. If the reason only works if you believe the theology, it is not public.
  3.  **Secular Metaphysics (Case 3):** Be aware that 'natural rights existing before law' is a metaphysical claim similar to religion. It is not automatically public reason. It must be translated into legal or social benefits to clear.

  #### Where the Procedure Misfires (Use Judgment)
  1.  **Mixed Motives:** When a justification is 50% public health and 50% theology, and you cannot tell which is driving the vote. **Handoff to Chair.**
  2.  **Ministerial Responsibility:** When a Government amendment fails the test. You cannot 'send back' a Minister easily. **Handoff to Chair.**
  3.  **Metaphysical Secularism:** When the argument relies on contested secular philosophy (e.g., libertarian self-ownership) that functions like religion. The procedure flags this, but enforcing it against secular norms is politically sensitive. **Handoff to Chair** if the member pushes back.

  **Confidence Statement:** I am highly confident this procedure distinguishes load-bearing religious arguments from ornamental ones. I am less confident in its application to secular metaphysical claims (like natural rights), as parliamentary tradition often treats these as public reasons even when political philosophy does not.

