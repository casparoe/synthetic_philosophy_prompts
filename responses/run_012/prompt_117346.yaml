      *   **Dropping "True Self" Talk:** If we remove the metaphysical baggage of authenticity, the Clinic rule is the hardest to justify. Why does a panel get to decide what is "character"? The Gambling rule works on simple contract/paternalism. The Charter works on procedural law. The Payday rule works on statistical risk. The Clinic rule relies explicitly on a metaphysical judgment of identity/authenticity.

