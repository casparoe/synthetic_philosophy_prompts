answer: |-
  This is one of the most famous and difficult pivots in the philosophy of time. Your instinct is correct: a defender of the "block universe" (a B-theorist) *does* simply deny the claim that the A-series is essential. However, to understand why McTaggart thinks that denial is a non-starter, we have to look closely at how he defines **change**.

  McTaggart is not arguing here that the A-series is contradictory (that comes later in the paper). Here, he is arguing that you cannot have **Time** without **Change**, and you cannot have **Change** without the **A-series**.

  Below is a reconstruction of the argument in this specific passage, followed by an analysis of where the block universe defender pushes back.

  ### Part 1: Reconstructing the Argument

  McTaggart's reasoning in this passage can be broken down into five logical steps.

  **Step 1: The Definition of Time (Premise)**
  *   **Claim:** Time essentially involves change.
  *   **Text:** *"It would, I suppose, be universally admitted that time involves change... A universe in which nothing whatever changed... would be a timeless universe."*
  *   **Reasoning:** McTaggart assumes this is common ground. If absolutely nothing changes (no motion, no thought, no decay), we wouldn't say time is passing. Therefore, **No Change = No Time.**

  **Step 2: The Nature of the B-Series (Premise)**
  *   **Claim:** In the B-series, relations are permanent.
  *   **Text:** *"An event can never cease to be an event. It can never get out of any time series in which it once is."*
  *   **Reasoning:** In the B-series, events are ordered by "earlier than" and "later than." If Event M is earlier than Event N, it is *always* earlier than Event N. The event "The Death of Caesar" occupies a fixed coordinate in the B-series. It does not slide around; it does not pop in or out of existence. It is a permanent fact that Caesar's death is at coordinate $t$.

  **Step 3: The Hypothetical B-Only World (Inference)**
  *   **Claim:** If only the B-series were real, events would not change their status.
  *   **Text:** *"If, then, a B series without an A series can constitute time, change must be possible without an A series."*
  *   **Reasoning:** McTaggart asks us to imagine a world with only B-relations (earlier/later) and no A-properties (past/present/future). In this world, as established in Step 2, an event's position is fixed. It is eternally "earlier than" some events and "later than" others.

  **Step 4: The Definition of Change (Premise)**
  *   **Claim:** Real change requires something to alter its status or properties.
  *   **Text:** *"What is it that changes? Could we say that... the change consisted in the fact that an event ceased to be an event, while another event began to be an event?"*
  *   **Reasoning:** McTaggart considers what could possibly count as "change" in a B-only world. He suggests the only candidate would be events coming into or going out of existence. But he rejects this (see Step 2). Since events are permanent fixtures in the B-series, they do not change. Therefore, **No A-Series = No Change.**

  **Step 5: The Conclusion**
  *   **Claim:** A B-series without an A-series cannot constitute time.
  *   **Text:** *"I believe it to be untenable, because... the A series is essential to the nature of time."*
  *   **Reasoning:** Combining Step 1 (Time needs Change) and Step 4 (B-series alone allows no Change), it follows that the B-series alone cannot constitute Time.

  ---

  ### Part 2: Why "An Event Can Never Cease to be an Event" Matters

  This is the specific sentence that often causes confusion. When McTaggart says, *"An event can never cease to be an event,"* he is describing the ontology of the B-series.

  Imagine a timeline drawn on a piece of paper.
  *   **The A-Series View:** There is a spotlight called "NOW" that moves along the line. Events are in darkness (future), then lit up (present), then in darkness again (past). The *status* of the event changes from unlit to lit to unlit.
  *   **The B-Series View:** The whole line exists at once. There is no spotlight. The event "Caesar's Death" is just a dot at coordinate 44 BC. It is always there. It never becomes "more real" or "less real." It never slides off the paper.

  McTaggart's point is that if the dot is always there, and its relationship to other dots (earlier/later) never changes, then **nothing has happened to the dot.** It is static.

  For McTaggart, **Change** is not just "things being different at different coordinates." Change is **"the same thing having different properties at different times."**
  *   In the B-series, the event "Caesar's Death" has the property "is at 44 BC." Does that property ever change? No. It is always at 44 BC.
  *   In the A-series, the event "Caesar's Death" has the property "is Future," then "is Present," then "is Past." These properties *do* change.

  Therefore, McTaggart argues that without the A-series (the changing properties of past/present/future), there is no change. And if there is no change, there is no time.

  ---

  ### Part 3: The Block Universe Pushback

  You asked where a defender of the block universe would push back, and whether they are denying a premise or rejecting the conclusion.

  The Block Universe defender (the B-theorist) **denies Step 4 (The Definition of Change).**

  They agree with Step 1 (Time involves change).
  They agree with Step 2 (B-relations are permanent).
  They agree with Step 3 (In a B-world, events don't change A-properties).

  **But they reject McTaggart's inference that this means there is *no* change.**

  Here is the B-theorist's counter-argument:
  1.  **Redefining Change:** Change does not require an event to change its *temporal status* (from future to past). Change only requires an object to have different qualities at different temporal locations.
  2.  **Example:** Consider a poker. At $t_1$ it is cold. At $t_2$ it is hot.
      *   **McTaggart says:** Has the *event* "poker at $t_1$" changed? No. It is eternally "poker being cold at $t_1$." Has the *event* "poker at $t_2$" changed? No. It is eternally "poker being hot at $t_2$." Therefore, no change has occurred in the events themselves.
      *   **B-Theorist says:** You are looking at the wrong thing. The *poker* changes. The poker possesses the property of coldness at $t_1$ and hotness at $t_2$. That variation *is* change. We do not need the events themselves to slide from future to past to account for this.

  **The Crucial Disagreement:**
  *   **McTaggart:** Change is **absolute**. Something must literally undergo a transformation in its reality status (becoming present, then becoming past).
  *   **Block Universe:** Change is **relative**. It is just variation across the temporal dimension, analogous to variation across space (e.g., the road is bumpy here and smooth there).

  ### Part 4: Why McTaggart Treats this as a Refutation

  You asked why McTaggart treats the Block Universe view as a position he has to refute rather than set aside.

  McTaggart believes that the B-theorist's definition of change is insufficient to capture what we *mean* by time. He thinks the B-theorist is describing a static order (like a number line or a spatial map) and calling it "time," but leaving out the essential ingredient: **Passage.**

  For McTaggart, if you remove the A-series, you remove the "flow." If you remove the flow, you remove the change. If you remove the change, you have removed Time, even if you keep the word "time" to describe the B-series ordering.

  He writes: *"This is not a very common view, but it has found able supporters. I believe it to be untenable..."*

  He treats it as untenable because he believes it fails to account for the **phenomenology of time**. We experience time as passing. We experience events as *becoming* past. If a theory says this experience is a total illusion and that reality is just a static block where nothing ever truly changes its status, McTaggart argues that theory has ceased to describe **Time** and is describing something else (a static manifold).

  ### Summary of the Standoff

  To answer your specific question on how the reasoning fits together:

  1.  **McTaggart's Logic:** Time requires Change $\rightarrow$ Change requires events to alter their properties $\rightarrow$ In the B-series, events have permanent properties $\rightarrow$ Therefore, the B-series has no Change $\rightarrow$ Therefore, the B-series is not Time.
  2.  **The Block Universe Pushback:** They accept the B-series has permanent events. They **deny** that Change requires events to alter their properties. They argue Change is just an object having different properties at different permanent event-coordinates.
  3.  **The Result:** The argument in this passage does not *prove* the Block Universe is false. It proves that **if** you accept McTaggart's definition of Change (which requires A-properties), **then** the Block Universe is not Time.

  McTaggart's ultimate goal in the full paper is to go further: he will later argue that the A-series is *contradictory* (because an event cannot be Past, Present, and Future). His strategy is:
  1.  Time requires A-series (this passage).
  2.  A-series is contradictory (later in the paper).
  3.  Therefore, Time is unreal.

  He has to win the argument in *this* passage first, because if the B-theorist is right (that you can have Time with just the B-series), then McTaggart doesn't need to prove the A-series is contradictory; the B-theorist has already saved Time by discarding the A-series. McTaggart must close that escape route first.
