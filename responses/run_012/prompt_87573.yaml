      *   **The Block Universe Pushback:** Explicitly answer where the B-theorist interrupts the argument. (It's a premise denial regarding the nature of change).
      *   **Conclusion:** Summarize the standoff.

  9.  **Drafting the Content (Mental Check):**
      *   *Make sure to distinguish:* McTaggart isn't saying the Block Universe is impossible *yet*. He's saying it's not *Time*.
      *   *Key phrase:* "Change must be possible without an A-series." McTaggart says No. B-theorist says Yes.
      *   *Analogy:* Use the "spatial" analogy. A road doesn't change just because one end is North and the other is South. McTaggart says Time isn't like a road unless the "Now" moves.

  10. **Final Review against constraints:**
