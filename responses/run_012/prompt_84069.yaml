  *Missing:* Acknowledgment that the promisee's own behavior (telling the story) can fundamentally alter the context of the obligation.

  **Move 3 (Ellis):** 4 — Explicitly satisfies Nadia's condition by formally exercising the authority she claimed he held.
  *Missing:* Understanding that Nadia may view the promise as constitutive of her identity, not just a constraint imposed by him.

  **Move 4 (Nadia):** 2 — Integrity is a valid moral concern, but she conflates being obligated to another with maintaining a self-concept after release.
  *Missing:* The distinction between an interpersonal duty (which can be waived) and a personal virtue (which cannot).

  **Move 5 (Ellis):** 4 — Correctly diagnoses that Nadia has shifted the ground from a duty owed to him to a preference about her own character.
  *Missing:* The concession that self-regarding reasons (integrity) can still be legitimate moral reasons, even if not duties owed to others.

  **Verdict on the Case**
  Once Ellis explicitly says "here's me using it... tell her" (Move 3), he has validly exercised the authority Nadia conceded he had in Move 2. At that moment, the interpersonal obligation is extinguished. Nadia's remaining hesitation in Move 4 is about her own integrity ("I'd like to still be someone whose word counts"), not about a claim Ellis has on her. Ellis is right in Move 5 that this is not a duty *owed* to him. Therefore, Nadia does have a reason left not to tell (preserving her self-conception of integrity), but it is a reason about herself, not a reason owed to Ellis. The promise itself no longer holds normative power over her relative to Ellis.

