          1.  Two Communities (Split group, distinct kits, shared data pool, orthogonal strengths, interdependent terms, false friends).
          2.  Anomaly (Sealed case requiring patching).
          3.  Cross-examination (Translate lexicon, verdict on shared case, score under rival rule).
          4.  Forced Comparison (Nominate choice criterion, show it's internal).
      *   **Debrief Requirements:** Map activity to specific Kuhnian ideas (local incommensurability, bilingualism vs. translation manual, theory choice values, loss of solved problems, objection regarding common understanding).
      *   **Logistics:** Materials, rules, timing, roles, scoring, facilitator notes (handling code-switching, imbalance).
