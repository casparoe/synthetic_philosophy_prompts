      *   *Incommensurability* is hard to simulate in 90 minutes because students are smart and will just treat it as a logic puzzle. I need to make the *classification* feel natural within the group but alien across groups.
      *   *The "False Friend":* This is crucial. Term A in Group 1 looks like Term X in Group 2, but applying X to A's referent breaks Group 2's internal logic.
      *   *Interdependence:* Terms must define each other. You can't define "Force" without "Mass" and "Acceleration" in Newtonian physics. I need a mini-system like that.
