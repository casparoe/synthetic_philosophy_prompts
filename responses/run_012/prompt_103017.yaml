answer: |-
  1. Maria finds a receipt for fifty balloons in her husband's coat pocket in January and files it away as certain fact, then in February forms the hypothesis that he is planning a surprise party for her.
  2. Because Maria already assigns probability one to the receipt's existence, conditioning on it cannot increase her credence in the surprise party hypothesis, so the evidence offers no confirmation.
  3. If we subtract the receipt from her background knowledge and imagine her encountering it now, the discovery would raise her credence in the party hypothesis, so the evidence does confirm.
  4. The likelihood ratio account confirms the hypothesis regardless of timing, treating the disagreement between the first two accounts as an artifact of conflating psychological learning with logical support.
  5. The divergence rests on the temporal gap between knowing the evidence and framing the hypothesis, vanishing if the hypothesis precedes the evidence, while a defender of strict conditionalization argues confirmation measures dynamic belief revision rather than static logical support.
