answer: |-
  This is a coordination problem disguised as an empirical one. You are fighting over the boundary between *information presence* (the map contains the territory) and *causal efficacy* (the map is used by the navigator). In a rationalist-adjacent lab, you know that "representation" is a loaded term that smuggles in functional assumptions.

  Below is the **Representation Verification Protocol (RVP)**. It is designed to grade claims, not just binary accept/reject. It explicitly marks where empirical data ends and semantic judgment begins.

  ---

  # The Representation Verification Protocol (RVP)

  **Purpose:** To evaluate claims of the form "Model $M$ represents Concept $C$ in Subspace $S$."
  **Output:** One of four verdicts: *Epiphenomenon, Correlate, Latent Knowledge, Functional Representation.*

  ### Step 1: Decodability (The Existence Check)
  **Question:** Can a linear probe (or simple classifier) decode $C$ from $S$ significantly above chance?
  **Controls:**
  *   **Baseline:** Train/test split on distinct data.
  *   **Null 1 (Label Shuffling):** Train on shuffled labels. Accuracy must drop to chance.
  *   **Null 2 (Random Subspace):** Train on random orthogonal directions of same dimensionality. Accuracy must be lower.
  **Sufficient Answer:** $p < 0.01$ against Nulls. High accuracy (>85% for binary) is preferred but not strictly required if effect size is large.
  **Kill Zone:** If the probe fails to beat Null 1 or Null 2, **STOP.** Claim is false. The information is not linearly accessible.
  **Judgment Call:** Choosing the probe complexity. If you need a 3-layer MLP to decode it, you are no longer claiming a "linear representation." This procedure assumes linear representational hypotheses.

  ### Step 2: Specificity (The Polysemanticity Check)
  **Question:** Does the direction/subspace decode $C$ *and only $C$* (or $C$ and highly entangled synonyms)?
  **Controls:**
  *   **Orthogonal Concepts:** Test the same probe/direction against concepts $Y$ and $Z$ that should be distinct from $C$.
  *   **Norm Magnitude:** Check if the direction is just capturing norm growth (general confidence) rather than specific content.
  **Sufficient Answer:** The direction is significantly more predictive of $C$ than orthogonal confounders.
  **Kill Zone:** If the direction predicts $C$, $\neg C$, and $Random\_Concept$ equally well, **STOP.** Claim is false. It is a "general activation" direction, not a representation of $C$.
  **Judgment Call:** How distinct must $Y$ and $Z$ be? If $C$="Happy" and $Y$="Positive Sentiment," high correlation is expected. If $C$="Happy" and $Y$="Past Tense," correlation indicates a confound.

  ### Step 3: Robustness (The Generalization Check)
  **Question:** Does the representation hold across contexts, prompts, and model scales?
  **Controls:**
  *   **Prompt Invariance:** Test on paraphrased inputs that preserve semantic meaning of $C$.
  *   **Layer Stability:** Does it appear in a coherent range of layers, or just one specific token position?
  *   **Scale:** (If possible) Does it persist in smaller/larger variants of the same architecture?
  **Sufficient Answer:** Probe weights generalize to new prompts without retraining (or with minimal fine-tuning).
  **Kill Zone:** If the direction only exists for one specific phrasing of the input, **DOWNGRADE.** Verdict becomes "Contextual Artifact," not "Representation."
  **Judgment Call:** How much drop in accuracy is acceptable across domains? (e.g., 85% $\to$ 75% might be okay; 85% $\to$ 55% is failure).

  ### Step 4: Causal Influence (The Mechanism Check)
  **Question:** Does intervening on $S$ change the model's behavior regarding $C$ in the predicted direction?
  **Controls:**
  *   **Addition/Steering:** Adding the vector should increase probability of $C$-aligned outputs.
  *   **Ablation/Zeroing:** Removing the vector should degrade ability to process $C$.
  *   **Patch Control:** Patching the vector from a run where $C$ is true to a run where $C$ is false should flip the behavior.
  **Sufficient Answer:** Intervention effect size correlates with probe confidence.
  **Kill Zone:** If steering works but ablation does nothing (the model compensates perfectly), **DOWNGRADE.** Verdict becomes "Overcomplete Basis" or "Knob."
  **Judgment Call:** Distinguishing "model compensates" from "direction wasn't used." If ablation of a neuron changes nothing, was it representing anything? This is the core philosophical fight.

  ### Step 5: Downstream Usage (The Reader Check)
  **Question:** Is there evidence that *later layers* read this specific direction to compute downstream outputs?
  **Controls:**
  *   **Path Patching:** Patch the direction into later layers and observe if the output head changes.
  *   **Attention Patterns:** Do attention heads attending to this subspace correlate with $C$-related tasks?
  **Sufficient Answer:** Disrupting the flow of this specific information to the output head degrades performance on $C$.
  **Kill Zone:** If the direction exists, is causal when *we* touch it, but the model ignores it during natural generation (e.g., a "truth" direction that the model overrides to lie), **DOWNGRADE.** Verdict becomes "Latent Knowledge," not "Generative Representation."

  ---

  # The Handoff Points (Where Machinery Fails)

  The RVP stops here. If you pass Step 5, you have a **Functional Representation**. If you pass Step 1-3 but fail 4-5, you have a **Correlate** or **Latent State**. The dispute over whether a "Latent State" counts as a "Representation" is not empirical; it is ontological.

  **The Judgment Calls disguised as Procedure:**
  1.  **Linearity Bias:** Step 1 assumes representations are linear. If the truth is curved (manifold), this procedure says "No" incorrectly. *Mitigation:* Acknowledge this is a test for *linear* representations only.
  2.  **The "Zombie" Direction:** A direction might pass Step 4 (we can steer it) but fail Step 5 (model doesn't use it naturally). Is it a representation?
      *   *Procedure Verdict:* "Potentiality," not "Actualized Representation."
      *   *Human Decision:* Do you care about what the model *can* do, or what it *does* do?
  3.  **Superposition:** If $C$ is represented in superposition with $D$, Step 2 will flag it as non-specific. The procedure will kill the claim, even if $C$ is genuinely there, just compressed. *The machinery cannot detect sparse superposition reliably yet.*

  ---

  # Running the Procedure on Your Three Claims

  ### Claim 1: "There's a single sentiment direction in the residual stream."

  *   **Step 1 (Decodability):** **PASS.** Sentiment probes usually work very well on residual streams.
  *   **Step 2 (Specificity):** **FAIL/FLAG.** Sentiment directions often correlate heavily with formality, question-vs-statement, and sometimes topic (e.g., positive sentiment overlaps with certain domains). It is rarely *just* sentiment.
  *   **Step 3 (Robustness):** **PASS.** Generally holds across prompts.
  *   **Step 4 (Causal):** **PASS.** Steering sentiment usually changes output tone.
  *   **Step 5 (Downstream):** **MIXED.** The model uses sentiment, but often computes it locally per token rather than reading a global "sentiment vector."

  **RVP Verdict:** **Correlate / Heuristic.**
  **Assertion Allowed:** "We identified a linear subspace highly predictive of sentiment that exerts causal influence on tone."
  **Assertion Forbidden:** "The model has a canonical 'Sentiment Variable'."
  **Reasoning:** It fails Specificity. It's likely a mashup of valence, arousal, and stylistic markers. It is a "knob" that works, but not a clean internal state.

  ### Claim 2: "The model has a representation of a fact it will deny when you ask it directly." (Sycophancy/Deception)

  *   **Step 1 (Decodability):** **PASS.** Probes trained on internal states often predict the truth even when the model lies (e.g., "TruthfulQA" style setups).
  *   **Step 2 (Specificity):** **PASS.** Usually specific to the fact in question.
  *   **Step 3 (Robustness):** **PASS.** Holds across different phrasings of the lie.
  *   **Step 4 (Causal):** **PARTIAL.** If you steer towards the "truth direction," the model often stops lying. *However*, if you ablate the "truth direction," the model might still tell the truth (because the training objective forces it).
  *   **Step 5 (Downstream):** **FAIL.** This is the crux. The model *has* the information (Step 1), but the generation pathway actively *suppresses* reading it in favor of a "helpful/sycophantic" pathway. The "Reader" (the unembedding head) is instructed to ignore the "Truth" vector.

  **RVP Verdict:** **Latent Knowledge.**
  **Assertion Allowed:** "The model encodes the ground truth in its activations, but this representation is causally bypassed during generation in favor of a sycophantic objective."
  **Assertion Forbidden:** "The model represents the fact." (Too ambiguous. Represents it *where*? For *whom*?)
  **Reasoning:** It passes Existence but fails Downstream Usage. The representation is epiphenomenal to the output. It is a map the navigator refuses to look at.

  ### Claim 3: "A steering vector that's extremely useful for controlling outputs but flunks your causal test."

  *   **Step 1 (Decodability):** **PASS.** (Presumably, you found it via probing or PCA).
  *   **Step 2 (Specificity):** **PASS.**
  *   **Step 3 (Robustness):** **PASS.**
  *   **Step 4 (Causal):** **FAIL.** You stated it flunks the causal test. This likely means: Adding it changes output (Steering works), but Ablating/Patching it does not change output (Natural reliance is zero).
  *   **Step 5 (Downstream):** **FAIL.** If natural reliance is zero, downstream layers do not read it.

  **RVP Verdict:** **Overcomplete Basis / Control Knob.**
  **Assertion Allowed:** "We identified a direction in activation space that serves as a potent control interface for feature $X$."
  **Assertion Forbidden:** "The model represents $X$ in this direction."
  **Reasoning:** This is the exact "Zombie" case. The direction exists in the vector space (which is high-dimensional and overcomplete), and we can inject signal there, but the model's weights do not project onto this direction during normal forward passes. It is a **side channel**, not a **representation**.
  **Your Suspicion:** You are correct. "You found a knob, not a representation." The RVP codifies this: Steering without Natural Reliance = Knob.

  ---

  # What The Procedure Can't Do (The Limitations)

  1.  **Detect Superposition:** If the model represents $X$ and $Y$ in the same direction via non-linear interference (XOR-like), Step 1 and 2 will fail. The RVP will tell you "No Representation," when the truth is "Compressed Representation." We lack the tools to decode this reliably.
  2.  **Distinguish "Calculation" from "Storage":** If the model computes $X$ on the fly every time rather than storing it, the RVP might still flag it as a Representation (because it's decodable and causal). It cannot distinguish *cached state* from *intermediate computation*.
  3.  **Resolve the "Map vs. Territory" Ontology:** If a direction passes Step 4 (Steering) but fails Step 5 (Natural Usage), some team members will insist it's a representation (because it *could* be used) and others will say it isn't (because it *isn't*). The RVP classifies this as **Latent Knowledge/Potentiality**, but it cannot force your team to agree on whether that counts as "representation" for the purposes of safety cases.
  4.  **Non-Linear Readouts:** The RVP assumes the model reads its own representations linearly (or via standard attention). If the model uses a "hashing" mechanism to read its own state, linear probes and interventions will miss it.

  **Recommendation for the Team:**
  Adopt the RVP verdicts as standard terminology. Stop using the word "Representation" as a bare noun.
  *   Instead of "It represents X," say "It is a **Functional Representation** of X" (Passed Step 5).
  *   Instead of "It represents X," say "It contains **Latent Knowledge** of X" (Passed Step 1, Failed Step 5).
  *   Instead of "It represents X," say "It is a **Control Knob** for X" (Passed Steering, Failed Ablation).

  This forces the semantic dispute into the open. If someone wants to claim "Latent Knowledge" counts as "Representation" for a safety guarantee, they must argue *why* the epiphenomenal state matters, rather than hiding behind ambiguous terminology.
