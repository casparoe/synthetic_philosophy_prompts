          *   Application: Run the procedure on three specific claims (Sentiment direction, Hidden fact, Steering vector failing causal test).
          *   Limitations: Explicitly state what the procedure *can't* do.

  2.  **Analyze the Core Conflict:**
      *   The fight is essentially between *Predictive/Informational* views of representation (if you can decode it, it's there) vs. *Causal/Functional* views (if the model doesn't use it, it's epiphenomenal).
      *   Rationalist background implies a preference for clear definitions, Bayesian updating, and avoiding motte-and-bailey arguments.
      *   The procedure needs to bridge the gap between "probe accuracy" and "mechanistic truth."

  3.  **Drafting the Decision Procedure (The "Representation Verification Protocol" - RVP):**
      *   *Step 1: Decodability (The Baseline).* Can we actually extract the information? If not, stop.
      *   *Step 2: Specificity (The Nulls).* Is it just picking up on everything? Need shuffled labels and random directions.
      *   *Step 3: Robustness (The Generalization).* Does it hold across contexts/prompts/sizes? Or is it overfit to a specific trajectory?
      *   *Step 4: Causal Influence (The Mechanism).* This is the crux. Interventions (ablation, steering). Does changing the vector change the output *in the expected way*?
      *   *Step 5: Downstream Usage (The Reader).* Is there evidence the *model* reads this, not just us? (Harder, but necessary for strong claims).
      *   *Stop/Handoff Points:* Need to define where we say "No" vs. "Maybe/Philosophical."

      *Refining the Steps:*
      *   Make it hierarchical. Failure at Step 1 kills the claim. Failure at Step 4 downgrades "representation" to "correlate."
      *   Address the "Judgment vs. Procedure" requirement explicitly in the notes.

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Single Sentiment Direction.*
          *   Likely passes decoding, specificity, robustness.
          *   Might fail causal if sentiment is distributed or context-dependent.
          *   Verdict: Probably "Linearly Decodable Feature," maybe not "Canonical Representation."
      *   *Case 2: Hidden Fact (Sycophancy/Deception).*
          *   Decoding: Yes (probe knows the truth).
          *   Causal: Hard. If you steer towards truth, does it answer truthfully?
          *   Verdict: "Latent Knowledge" vs. "Representation used for generation." Distinction is crucial.
      *   *Case 3: Steering Vector failing Causal Test.*
          *   Decoding: High.
          *   Steering: Works (changes output).
          *   Causal Test (e.g., patching/ablation): Fails (model compensates or doesn't rely on it naturally).
          *   Verdict: "Control Knob" / "Overcomplete Basis," not "Natural Representation."

  5.  **Addressing the Limitations (The "Can't Do" List):**
      *   Polysemanticity (one neuron/direction = many things).
      *   Superposition (many features = one direction).
      *   The "Zombie" problem (direction exists, model ignores it).
      *   The Definition Problem (what *is* representation?).

  6.  **Tone and Style:**
