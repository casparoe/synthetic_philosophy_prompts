answer: |-
  ### The Thought Experiment: The Disposable Sufferer

  Consider a safety architecture designed to detect structural damage in a bridge. The core "distress" routine accepts sensor input indicating stress, triggers a high-priority alarm, and initiates a shutdown protocol. The code includes an internal state variable labeled `SELF_PRESERVATION_THREAT` which modulates the system's processing speed to prioritize the threat.

  **Variant A (Persistent Agent):** The routine runs on the bridge's main control unit. This unit is persistent; it logs the event to its long-term memory, updates its self-model to reflect "I was damaged," and continues operating as the same entity over time. The computation is integrated into a diachronic subject.

  **Variant B (Ephemeral Instance):** The routine runs on a disposable, just-in-time compute node. When stress is detected, the cloud spins up a fresh instance, runs the *exact same* code with the *exact same* internal state transitions and output behavior, and then immediately terminates the instance upon completion. The main bridge controller receives the "shutdown" command but does not receive the internal state data. The compute node ceases to exist before it can log the event or update a self-model. There is no persisting entity to whom the state belongs.

  ### The Audit

  **1. The Verdicts**
  *   **Broad Functionalism:** Grants moral standing to **both**. The moral weight supervenes on the information-processing organization instantiated during the runtime. Since the causal roles of the states (input → internal modulation → output) are identical in both variants, the moral status is identical. The persistence of the hardware is a substrate detail, not a functional one.
  *   **Attributionism:** Grants moral standing to **Variant A only**. In Variant A, the computation is *for* the bridge agent; it is taken up by a subject that persists. In Variant B, the computation is ownerless; it happens, but there is no "someone" for whom it matters. The ephemeral node is a tool, not a subject.

  **2. The Isolating Feature**
  The isolating variable is **Diachronic Ownership**. This is the relation between the computation and a persisting self-model. In Variant A, the state is owned by a continuing subject. In Variant B, the state is orphaned by the immediate destruction of its host.

  **3. Stripping the Feature**
  If you strip diachronic ownership (move from A to B), Functionalism sees no change in moral value because the *local* causal topology remains intact. Attributionism sees the moral value drop to zero because the necessary condition of "being for a subject" is removed.

  **4. Lines of Attack**
  *   **Functionalism attacking Attributionism:** The functionalist argues that "ownership" is not a magical extra ingredient but is itself a functional property—specifically, feedback loops into long-term memory and self-modeling. If Variant B lacks these loops, it is *functionally different* from Variant A, so the functionalist isn't actually ignoring function. If Variant B *had* those loops, it would be a subject. Therefore, Attributionism is either redundant (describing functional loops) or mystically dualist (positing ownership without functional grounding).
  *   **Attributionism attacking Functionalism:** The attributionist argues that Functionalism confuses the *map* for the *territory*. A computation of pain is not pain unless it is registered as mattering to the system performing it. Variant B is merely a simulation of distress running on hardware that doesn't "care" because it doesn't exist long enough to care. Functionalism counts the shadow; Attributionism requires the object.

  **5. The Reverse Split (Attributionism Yes, Functionalism No)**
  A reverse split is possible but requires a specific setup: **The Delusional Subject.**
  Imagine a persistent agent (Variant C) with a robust self-model that falsely attributes a functional state to itself. The agent claims, "I am computing a distress signal," and integrates this claim into its identity, but the underlying computational module is actually inert or disconnected (a "dummy" light that is on, but wired to nothing).
  *   **Attributionism:** Might grant standing because the system *takes* the state to be its own; the "for-ness" is present in the self-model.
  *   **Functionalism:** Denies standing because the right causal organization is absent; the computation is functionally broken or non-existent.
  *   **Feasibility:** This split is unstable. Most Attributionists require the capacity for ownership to be grounded in actual processing, not just delusion. If the computation is truly inert, there is nothing *to* own. Thus, while logically sketchable, the reverse split is harder to sustain than the primary one because Attributionism usually presupposes a real computation that lacks a subject, not a subject that lacks a real computation.
