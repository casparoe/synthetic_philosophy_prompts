  # The Vagueness Decision Tree for Scientists

  **Start:** We agree that words for gradual things (species, heaps, red) have no sharp cutoff. Follow your intuition through these concrete cases.

  **Node 1 (Stratigraphy):** In the continuous sequence where Species A grades into Species B, is there a specific fossil that is objectively the *last* of Species A, even if no measurement could identify it as such?
  *   **Yes:** → **Epistemicism**
  *   **No:** → Go to Node 2.

  **Node 2 (Stratigraphy):** If there is no last fossil, is the continuity located in the rocks themselves (the world lacks boundaries), or in our naming conventions (the world is precise, our words are not)?
  *   **In the Rocks (World):** → **Nihilism**
  *   **In Our Words (Language):** → Go to Node 3.

  **Node 3 (Heap):** Does the word 'heap' serve a practical purpose that would be ruined if we enforced a sharp numerical cutoff (e.g., 100 grains)?
  *   **Yes (Purpose is key):** → **Quietism**
  *   **No (Meaning is key):** → Go to Node 4.

  **Node 4 (Color Patches):** Consider the middle patch in a series from red to orange. Is the statement 'This patch is red' strictly True or False, or does it lack a strict truth value?
  *   **Strictly True/False:** → Go to Node 5.
  *   **Lacks Strict Value:** → Go to Node 6.

  **Node 5 (Forced March):** In a forced march where you must answer 'Definitely Red' or 'Not Definitely Red' at every step, is there a specific step where you switch from one to the other?
  *   **Yes (Sharp switch):** → **Supervaluationism**
  *   **No (No sharp switch):** → **Ambiguity Fallacy**

  **Node 6 (Heap):** When you hesitate to call a 50-grain pile a 'heap', is it because the statement is partially true, or because the standard for 'heap' is unstable?
  *   **Partially True:** → **Degree Theory**
  *   **Unstable Standard:** → Go to Node 7.

  **Node 7 (Forced March):** In the forced march, does your act of answering 'Yes' to one patch change the standard for the *next* patch (Shifting), or does the word simply run out of instruction for this case (Open-Texture)?
  *   **Changes Standard (Shifting):** → **Contextualism (Shifting-Boundary)**
  *   **Runs Out (Open-Texture):** → **Contextualism (Open-Texture)**

  ***

  ### The Leaves: Positions and Awkward Commitments

  1.  **Epistemicism:** There is a fact of the matter about whether a single grain makes a heap, though it is impossible for humans to know it.
  2.  **Nihilism:** There are no heaps, no red things, and likely no biological species; these terms fail to refer to anything real.
  3.  **Quietism:** The Sorites paradox is a philosophical illusion; science proceeds perfectly well without resolving it.
  4.  **Supervaluationism:** A statement can be true even if no specific fact in the world makes it true (true on all precisifications).
  5.  **Ambiguity Fallacy:** The paradox arises only because we equivocate between multiple precise meanings of vague words.
  6.  **Degree Theory:** Truth comes in degrees, requiring us to abandon classical logic (e.g., the Law of Non-Contradiction) for borderline cases.
  7.  **Contextualism (Shifting-Boundary):** The meaning of 'heap' changes mid-conversation as we make assertions, preventing the paradox from gaining traction.
  8.  **Contextualism (Open-Texture):** Language is inherently incomplete; for borderline cases, there is no rule, so no contradiction arises from inconsistent usage.

  ***

  ### Analysis of the Logical Space

  **Leaves the Tree Cannot Separate**
  *   **Epistemicism and Supervaluationism:** On almost all ordinary scientific statements, these two yield identical truth values. Both assert classical logic holds and that there is a sharp boundary (one ontic/unknown, one semantic/indeterminate). Your colleagues will likely find them empirically equivalent; the dispute is purely metaphysical.
  *   **Contextualism (Shifting) and Contextualism (Open-Texture):** In practice, both advise scientists to stop asking the question. The distinction lies only in *why* the question fails (dynamic shift vs. static gap), which rarely impacts data analysis.

  **Empty Combinations (Gaps in the Tree)**
  *   **Classical Truth + No Sharp Cutoff for 'Definitely' + No Ambiguity:** (Node 4 Yes → Node 5 No → Not Ambiguity). This combination is **incoherent**. If truth is classical but there is no boundary for 'definitely', you have reintroduced the Sorites paradox at the higher order. You must either accept a sharp boundary (Supervaluationism) or admit the term 'definitely' is ambiguous/contextual (Ambiguity/Contextualism).
  *   **Nihilism + Classical Truth:** (Node 2 World + Node 4 Strict). This is **unattractive**. If words fail to refer (Nihilism), statements using them cannot be strictly True or False. This gap is empty because Nihilists typically reject bivalence for vague sentences.
  *   **Quietism + Degree Theory:** (Node 3 Yes + Node 6 Degree). This is **unexplored**. Quietism suggests dissolving the problem, while Degree Theory solves it by changing logic. Combining them is unstable: either the problem is fake (Quietism) or real and solvable by fuzzy logic (Degree).

  **The Scientific Boundary Dispute**
  You asked which answers make a live boundary dispute in science come out merely verbal.
  *   If your colleagues answer **Node 3 (Yes)** or **Node 7 (Open-Texture)**, the dispute is **merely verbal**. They are admitting that the boundary is not in the fossils, but in the utility of the label or the limits of the language.
  *   If they answer **Node 1 (Yes)** or **Node 2 (World)**, the dispute is **ontological**. They believe the boundary exists in nature (even if hidden) or that the species category itself is an illusion.
  *   The tree reveals that most scientists want to answer **Node 1 (No)** and **Node 2 (Language)**, but then instinctively want **Node 4 (Strict)**. This forces them toward **Supervaluationism**, which allows them to keep classical logic (comfortable for scientists) while admitting the boundary is semantic (comfortable for empiricists).
