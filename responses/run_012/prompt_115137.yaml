  ok so my friend Dana and i got into this last night and it went way longer than it should of, and now before i go read a bunch of stuff about it i want to nail down what we were actually fighting about.

  Her example: take 40 flats, all identical except each one is one decibel quieter at night than the last and two dollars a month more expensive, cheapest at the loud end, priciest at the silent end. Step by step neither of us would pay the two bucks for one decibel — we shrugged at every single step — but at the ends we had strong views. The loudest one is basically unlivable and the silent one is clearly worth the money. She says that shows "better than" (or at least "at least as good as") isn't transitive and we should just accept that. I said that can't be right, because if betterness isn't transitive then half of what we do when we choose between options falls apart. She also dragged in something about whether a world with more people who are only barely happy could be worse than a smaller happier one, and i think thats the same shape of problem but i couldn't say why.

  What i want from you is the spec, not a verdict. Before i trust any theory of the betterness relation, tell me what it has to deliver. The cases it has to get right, the distinctions it can't collapse (worse vs. not comparable, roughly as good vs. exactly as good, and so on), the structural properties people demand of it — transitivity, completeness, acyclicity, being able to do dominance reasoning, not flipping when you relabel the options — the results it can't contradict, and anything else you think belongs on the list. For each requirement, give me the case or consideration behind it, and say whether it's something any adequate theory has to have or just a preference of one camp. Assume "adequate" means usable for actually deciding what to do, not just pretty on paper.

  Then the part i most want: tell me whether some of these can't all be satisfied at once, and which single requirement rules out the most candidates. If a couple of them turn out to be genuinely incompatible, thats not a bug, thats the interesting result and i want it stated plainly.

  Keep the weight on the criteria and why each one is there — seperate the real desiderata from the prejudices of one camp. At the very end you can do one line each on how the main camps stack up against the list (the ones who keep transitivity and bite some bullet, the ones who let it go, the parity/incomparability people, the ones who say the relation is just indeterminate or gappy), but i don't want a scorecard, i want the list.
