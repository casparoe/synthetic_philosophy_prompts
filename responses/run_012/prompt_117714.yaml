answer: |-
  Hobbes's metaphysics is simple: reality is matter in motion. Science is the knowledge of consequences from causes. For him, geometry isn't about abstract truths; it's about recording the generations of figures. A line is a trace of a moving point. Truth requires you to show the construction. With that engine running, here is how he processes your four cases.

  **1. Non-Euclidean Geometry**
  You asked if "dropping the parallel postulate" makes sense on his picture. It doesn't. For Hobbes, parallel lines aren't defined by a logical axiom you can toggle; they are defined by a specific motion—a line moving perpendicularly along another maintains equidistance. That equidistance *is* the generation of the parallel. To deny the postulate isn't to find a new geometry; it's to change the definition of "line" or "motion" while keeping the words.

  **Prediction:** He rejects it as meaningless, not false.
  **Commitment:** Geometry is causal construction, not logical consistency.
  **Resolution:** A modern formalist says, "Is it consistent?" Hobbes asks, "Does it generate?" Since hyperbolic space doesn't correspond to the motion of rigid bodies in his materialist plenum, it's just wordplay. He jumps to "meaningless" because his commitment to geometry as the science of motion outweighs the value of logical consistency alone.

  **2. Algebra Winning (Formalism)**
  This is his nightmare realized. Hobbes spent decades screaming that Wallis was turning geometry into a "scab of symbols," a game of counters without magnitudes. Hilbert's view—that math is a formal game where symbols need no reference—is exactly the "rotten" modern way Hobbes fought against.

  **Prediction:** Absolute hostility.
  **Commitment:** Signs must signify magnitudes.
  **Personality vs. Argument:** This isn't just contrarianism; it's core to *De Corpore*. However, his personality amplifies it. Having been shredded by the algebraists, he would view formalism not as progress but as the institutionalization of error. He wouldn't need to contradict himself here; this is the enemy flag planted on the hill.

  **3. Machine-Checked Proofs**
  This creates a tension. Hobbes values rigorous deduction but hates empirical trust (the Royal Society). A proof assistant offers perfect deduction, but it operates as a black box. You know the theorem holds, but you don't necessarily see the causal generation of the figure.

  **Prediction:** He accepts the verification but denies it is "science."
  **Commitment:** Science requires knowledge of *why* (causes), not just *that* (consequences).
  **Conflict:** Rigor vs. Causality. He jumps to "not science." For Hobbes, checking steps mechanically is computation, not philosophy. If the computer verifies a formalist proof (see #2), it's just validating empty symbols faster. If it verifies a construction, it's useful but redundant to a geometer who can see the motion. He'd distrust the machine as an empirical artifact—you trust the code, not the reason.

  **4. Calculus and Analysis**
  Here is the biggest clash. Calculus describes motion (his love) using limits and infinities (his hate). Hobbes rejected indivisibles and actual infinities as "absurd" because only God is infinite. He viewed limits as a sham to sneak infinity in the back door.

  **Prediction:** He demands a finitist refactor.
  **Commitment:** No actual infinities; all quantities must be finite and generable.
  **Contradiction Flag:** To accept calculus's utility for physics while rejecting its foundations requires a split he might not sustain. He would likely argue the results are approximately useful but fundamentally false.
  **Resolution:** He jumps to "foundation is corrupt." He'd argue that because you cannot construct an infinite process, the logic is unsound. He would spend his final years trying to rewrite analysis using only finite differences, insisting the standard model is scholastic mysticism disguised as math.

  **Summary**
  Hobbes is a constructivist before the term existed. He cares about type safety in the physical sense: does this symbol have a magnitude? Does this function return a constructed figure? Non-Euclidean geometry fails type checking (wrong motion). Formalism fails linking (symbols point to nothing). Machine proofs fail transparency (no causal insight). Calculus fails memory safety (infinite buffers).

  He wouldn't be swayed by utility. For Hobbes, truth is singular and causal. If your math works but you can't show the motion that generates it, you're just a lucky guesser, not a philosopher. His stubbornness isn't just personality; it's the logical endpoint of a materialist who believes that if you can't build it, it isn't real.
