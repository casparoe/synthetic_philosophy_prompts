prompt: |-
  The foundation I work for funds bridge-building work — deliberative forums, media-literacy courses, cross-partisan exchanges — and I need help with something that recurs every funding cycle. We receive around thirty proposals a cycle, four cycles a year, and almost all of them arrive with the same diagnosis attached: the applicant has identified a group that is, in their view, trapped in a bubble and cut off from information, and they want money to go and expose it to better sources. I have come to believe this diagnosis is frequently wrong in a way that matters, because two quite different conditions travel under the same name. In the first, people simply lack exposure: their information environment is narrow, they bear outsiders no particular hostility, and new sources can still reach them, because nothing in their situation prevents it. In the second, the narrowness is a symptom rather than the disease, and the disease is a trust structure. The group has been taught, usually by someone with an interest in doing so, that anyone outside the group is compromised, paid, or lying, with the result that contrary evidence does not merely fail to persuade but gets absorbed as further confirmation, and exposure to the outside world makes things worse rather than better. If that distinction is sound, the two conditions call for opposite remedies, and our current practice — treating every proposal as a request for exposure — is not merely wasteful but potentially harmful, since we would be paying for interventions that entrench the people they are meant to help.

  What I want from you is a decision procedure my program officers can run on a proposal in about an hour. They will have no access to the target group's members, feeds, or private communications; everything they know comes from the application, a single phone call with the applicant, and public sources. The procedure should say what to ask and in what order, what would count as an answer that settles each question, where it should stop with a rejection, and where it must hand the decision back to a human because the question has turned out to be one of values rather than facts. It should also state plainly what it cannot determine, and it should flag the steps that are judgment calls dressed up as tests. Assume no one on staff has any philosophical training, that anything requiring more than an hour or an expert we do not have will simply not get done, and that grants above $25,000 need trustee sign-off, so a recommendation has to be defensible to a skeptical board.

  Then run the procedure on three applications from this cycle and show your work. (i) A rural congregation that takes its news from one local broadcaster and a handful of social-media accounts, and that has been refusing a routine childhood vaccine, but that seems to hold no theory about the wider world — they have mostly just never encountered the other side. (ii) A dispersed network of former members of a high-demand wellness organization who have carried over from it a diffuse suspicion of all institutional medicine, and who treat any former member who has made peace with the mainstream as a traitor. (iii) A community of parents organized around one charismatic online figure, who circulate a standing list of which doctors and journalists may be trusted and who describe anyone who questions the figure as either stupid or bought. Each applicant is asking for $40,000 for an exposure intervention of the kind we normally fund; tell me for each what the procedure prescribes, including any case where it says to reject the proposal the applicant plainly wants, or to fund something they did not ask for. Finally, I have a worry that cuts the other way: some groups distrust institutions because the institutions have earned it, and I do not want a diagnostic tool that ends up telling us to go and repair the credibility of people who do not deserve repair. Say explicitly whether your procedure can distinguish manufactured distrust from warranted distrust, and if it cannot, say what a program officer should do instead of guessing.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Role:** Foundation program officer/staff.
      *   **Mission:** Funds bridge-building (deliberative forums, media literacy, cross-partisan exchanges).
      *   **Problem:** Most proposals diagnose the target group as "information deprived" (lack of exposure), but the user believes many are actually "trust deprived" (active distrust/epistemic closure). Treating trust issues with exposure makes things worse.
      *   **Task:** Create a 1-hour decision procedure for program officers to distinguish between *Information Deprivation* (Type 1) and *Trust Structure/Epistemic Closure* (Type 2).
      *   **Constraints:**
          *   No access to target group members/feeds/private comms.
          *   Data sources: Application, one phone call with applicant, public sources.
          *   Staff: No philosophical training, practical mindset.
          *   Time: Max 1 hour per proposal.
          *   Accountability: Defensible to a skeptical board (grants >$25k need trustee sign-off).
          *   Output Requirements: Step-by-step procedure, stop/reject points, hand-off points (values vs. facts), limitations/judgment calls flagged.
          *   Application: Run the procedure on three specific cases (i, ii, iii).
          *   Specific Worry: Distinguishing manufactured distrust vs. warranted distrust (institutional failure).

  2.  **Develop the Decision Procedure (The "Diagnostic"):**

      *   *Goal:* Differentiate "Haven't Seen" (Type 1) from "Won't Believe" (Type 2).
      *   *Time Limit:* 60 minutes.
      *   *Inputs:* Proposal text (15 mins), Public Search (15 mins), Applicant Call (20 mins), Synthesis/Decision (10 mins).
      *   *Key Questions:*
          1.  Is there evidence of active immunization against outside info? (The "Traitor/Plant" test).
          2.  Is the isolation structural or ideological?
          3.  Does the applicant acknowledge the trust barrier?
      *   *Structure:*
          *   Phase 1: Document Review (The "Claim").
          *   Phase 2: Public Corroboration (The "Context").
          *   Phase 3: Applicant Interview (The "Mechanism").
          *   Phase 4: Scoring & Decision.
      *   *Flags:* Need to explicitly mark where judgment is required vs. factual checks. Need to address the "Warranted Distrust" concern.

      *   *Drafting the Steps:*
          *   *Step 1 (Proposal):* Look for language. Do they say "they don't know" (Type 1) or "they don't trust" (Type 2)? *Correction:* Applicants often misdiagnose. Look for *description of behavior* rather than their diagnosis. Do they mention hostility to outsiders?
          *   *Step 2 (Public):* Search the group/leaders. Is there rhetoric about "enemy media," "paid shills," "traitors"?
          *   *Step 3 (Call):* Ask the applicant: "What happens when a member sees contrary evidence?" If the answer is "they change their mind," it's Type 1. If "they double down" or "we have to protect them from disinfo," it's Type 2.
          *   *Step 4 (Warranted Distrust):* This is the hard part. The procedure *cannot* objectively measure institutional credibility in 1 hour. It must flag this as a value judgment.
          *   *Decision Matrix:*
              *   Type 1 -> Fund Exposure.
              *   Type 2 -> Reject Exposure (or Fund Trust-Building, but that's a different ask).
              *   Warranted Distrust -> Pause/Escalate.

  3.  **Refining the Procedure for Constraints:**

      *   *Simplicity:* Program officers aren't philosophers. Use concrete indicators.
      *   *Defensibility:* Needs to look rigorous for the board. Use a scoring sheet or checklist.
      *   *The "Warranted Distrust" Clause:* I must be honest. A 1-hour desk review cannot determine if the CDC/FBI/MSM *deserves* distrust. The procedure must treat *all* high-distrust groups as Type 2 for the purpose of *exposure* funding, but flag the "warranted" question for senior staff/board discussion regarding institutional repair vs. bridge building. Actually, the prompt asks if the procedure can distinguish. The honest answer is *no*. I need to prescribe a "safe failure" mode.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case (i) Rural Congregation/Vaccine:**
          *   *Signals:* One broadcaster, social media. Refusing vaccine. *No theory about wider world.* Never encountered other side.
          *   *Diagnosis:* Type 1 (Information Deprivation).
          *   *Action:* Fund Exposure (with monitoring).
      *   **Case (ii) Former Wellness Members:**
          *   *Signals:* Diffuse suspicion of institutional medicine. Treat former members who make peace as *traitors*.
          *   *Diagnosis:* Type 2 (Trust Structure/Epistemic Closure). The "traitor" label is the smoking gun.
          *   *Action:* Reject Exposure. (Exposure will be seen as attack).
      *   **Case (iii) Charismatic Online Figure/Parents:**
          *   *Signals:* List of trusted doctors/journalists. Questioners described as *stupid or bought*.
          *   *Diagnosis:* Type 2 (Trust Structure). "Bought" = compromised motive.
          *   *Action:* Reject Exposure.

  5.  **Addressing the "Warranted Distrust" Worry:**

      *   *Question:* Can the procedure distinguish manufactured vs. warranted distrust?
      *   *Answer:* No. Not in an hour, not without expertise.
      *   *Solution:* The procedure identifies *presence* of distrust, not *validity*. If distrust is high, exposure interventions are risky regardless of validity. If the distrust is warranted, the remedy isn't "exposure to the liar," it's "institutional reform." The foundation's mission is bridge-building. If the bridge is broken because one side is abusive, bridge-building is the wrong tool.
      *   *Instruction:* If "Warranted Distrust" is suspected (e.g., history of institutional abuse in that community), flag for Board/Values discussion, do not fund standard exposure.

  6.  **Review and Refine:**

      *   *Tone:* Professional, operational, clear.
      *   *Formatting:* Use bolding, lists, and clear headers.
      *   *Check against constraints:* Did I flag judgment calls? Yes. Did I limit time? Yes. Did I address the $25k threshold? Yes (all cases are $40k, so all need Board defensible recs).
      *   *Self-Correction on "Warranted Distrust":* I need to make sure I don't imply the foundation *should* fix institutional credibility. The prompt says "I do not want a diagnostic tool that ends up telling us to go and repair the credibility of people who do not deserve repair." The tool should identify that *exposure* is the wrong tool if distrust is high, regardless of warrant. But if the distrust is warranted, the "bridge" might be unethical. I will advise a "Pause and Escalate" for high-distrust cases where institutional harm is documented publicly.

  7.  **Final Polish:** Ensure the distinction between "Type 1 (Access)" and "Type 2 (Immunization)" is clear throughout. Ensure the "Stop/Reject" logic is explicit.

      *(Self-Correction during drafting the procedure)*: Make sure the "Phone Call" section has specific script questions. Vague questions lead to vague answers.
      *(Self-Correction on Case ii)*: Ensure I note that "Former members" suggests they *left* the high-demand group, but carried the *structure* with them. This is a subtle but important Type 2 indicator.
      *(Self-Correction on Case iii)*: "Bought" is a classic ad hominem/immunization tactic.

  8.  **Final Output Structure:**
      *   Introduction (Acknowledging the problem).
      *   The Procedure (The "1-Hour Trust & Access Diagnostic").
      *   Limitations & Judgment Calls (Explicitly flagged).
      *   The "Warranted Distrust" Question (Honest assessment).
      *   Application to Cases (i, ii, iii).
      *   Conclusion.

      *Let's write it.*
answer: |-
  # The 1-Hour Trust & Access Diagnostic (TAD)

  **Purpose:** To distinguish between *Information Deprivation* (Type 1: The group lacks access/exposure) and *Epistemic Closure* (Type 2: The group actively rejects outside information due to trust structures).
  **Time Limit:** 60 Minutes per proposal.
  **Inputs:** Grant Application, 20-minute Applicant Call, Public Web Search.
  **Output:** A defensible recommendation for the Program Officer (PO) to present to Trustees for grants >$25,000.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Document Scan (15 Minutes)
  *Read the proposal looking for specific descriptors of the target group's reaction to outside information.*

  **Q1: How does the applicant describe the group's current information diet?**
  *   **Type 1 Indicator:** "They only see X," "They haven't heard Y," "Isolated from mainstream."
  *   **Type 2 Indicator:** "They believe X is a lie," "They think Y is paid/corrupt," "They actively avoid Z."
  *   **Action:** Highlight all verbs describing the group's relationship to outside info.

  **Q2: What is the proposed mechanism of change?**
  *   **Type 1 Indicator:** "We will show them," "We will bring in speakers," "We will provide access."
  *   **Type 2 Indicator:** "We will debunk," "We will counter the narrative," "We will protect them from disinformation."
  *   **Stop Rule:** If the proposal explicitly states the group believes outsiders are *malicious* (lying, paid, enemy), flag as **High Risk (Type 2)** and proceed to Phase 3 immediately. Do not spend time on Phase 2.

  ### Phase 2: Public Corroboration (15 Minutes)
  *Search the target group, its leaders, or its hashtags using public search engines.*

  **Q3: Is there evidence of "Immunization Rhetoric"?**
  *   Search terms: `[Group Name] + "fake news"`, `[Group Name] + "traitor"`, `[Group Name] + "shill"`, `[Group Name] + "paid"`.
  *   **Pass:** No results, or results show confusion/lack of info.
  *   **Fail:** Results show explicit labeling of outsiders as compromised, evil, or agents of an enemy.
  *   **Judgment Call Flag:** *Distinguishing between "strong disagreement" and "immunization."* If outsiders are called "wrong," that is normal. If they are called "bought" or "traitors," that is immunization.

  **Q4: Is there public evidence of Institutional Harm? (The Warranted Distrust Check)**
  *   Search terms: `[Target Institution] + "abuse"`, `[Target Institution] + "scandal"`, `[Group Name] + "victim"`.
  *   **Action:** If credible news sources (major papers, wire services) report historical abuse by the institutions the group distrusts, mark **Warranted Distrust Flag**.
  *   **Limitation:** This does not prove the *current* distrust is warranted, only that a basis exists. (See Part 3 for handling).

  ### Phase 3: The Applicant Call (20 Minutes)
  *Ask these three specific questions. Record the answers verbatim.*

  **Q5: "If a member of the group sees a credible report that contradicts their view, what happens?"**
  *   **Type 1 Answer:** "They might be surprised," "They usually ask questions," "They haven't seen one yet."
  *   **Type 2 Answer:** "They assume it's fake," "They think the source is compromised," "They double down."
  *   **Settling Criterion:** If the applicant admits the group rejects evidence *on principle* rather than *on content*, it is Type 2.

  **Q6: "Who delivers the message? Why will they listen to *your* messengers?"**
  *   **Type 1 Answer:** "We are neighbors," "We are experts," "We are local."
  *   **Type 2 Answer:** "We are former insiders," "We have to prove we aren't part of the system," "We use trusted community leaders."
  *   **Settling Criterion:** If the applicant acknowledges they must prove their own loyalty before being heard, the barrier is Trust (Type 2), not Access (Type 1).

  **Q7: "What is the risk if this intervention fails?"**
  *   **Type 1 Answer:** "They won't change their minds," "Waste of money."
  *   **Type 2 Answer:** "They might get angrier," "It could confirm their bias," "They might isolate further."
  *   **Settling Criterion:** If the applicant acknowledges the risk of *backfire*, they are describing a Trust Structure.

  ### Phase 4: Synthesis & Decision (10 Minutes)

  **Scoring:**
  *   **0-1 Type 2 Indicators:** **Proceed.** Diagnosis is likely Type 1 (Access). Standard exposure funding is appropriate.
  *   **2+ Type 2 Indicators:** **Reject Exposure.** Diagnosis is Type 2 (Trust). Exposure interventions will likely entrench the group.
  *   **Warranted Distrust Flag Raised:** **Escalate.** Do not decide alone. This is a values question, not a facts question.

  **Decision Matrix:**
  1.  **Type 1 (Access):** Recommend Funding. (Defensible: Group is reachable).
  2.  **Type 2 (Trust):** Recommend Rejection. (Defensible: Intervention contradicts social science on backfire effects).
  3.  **Warranted Distrust:** Recommend Pause/Escalation to Board. (Defensible: Foundation cannot take sides in legitimate grievance vs. manipulation without deeper due diligence).

  ---

  ## Part 2: Limitations & Judgment Calls

  **What This Procedure Cannot Determine:**
  1.  **Truth Value:** It cannot determine if the group's beliefs are *factually* correct, only how they process *contrary* information.
  2.  **Warranted vs. Manufactured Distrust:** It cannot definitively say if the distrust is earned. It can only flag if there is a public record of institutional harm.
  3.  **Private Dynamics:** It relies on the applicant's honesty during the call.

  **Judgment Calls Dressed as Tests:**
  *   **Phase 2, Q3 (Immunization Rhetoric):** Distinguishing "passionate disagreement" from "epistemic closure" requires human nuance. A PO must decide if "They are lying" is a rhetorical flourish or a structural rule. *Mitigation:* Look for the word "traitor" or "paid." These are structural markers, not rhetorical ones.
  *   **Phase 4 (Warranted Distrust):** Deciding if historical abuse justifies current total closure is a value judgment. *Mitigation:* The procedure does not ask the PO to solve this. It asks them to **Escalate**.

  ---

  ## Part 3: Application to Current Cycle

  All three proposals request **$40,000**. All require Trustee sign-off. The recommendation must be defensible.

  ### Case (i): Rural Congregation / Vaccine Hesitancy
  *   **Phase 1 (Docs):** Applicant states group "has mostly just never encountered the other side." No mention of conspiracy theories regarding motive.
  *   **Phase 2 (Public):** Local broadcaster is conservative but standard. No "traitor/shill" rhetoric found in public posts.
  *   **Phase 3 (Call):**
      *   *Q5 (Reaction to evidence):* Applicant says, "They haven't seen the data, not that they reject it."
      *   *Q6 (Messenger):* "Local doctors they know."
      *   *Q7 (Risk):* "They might remain unconvinced."
  *   **Score:** 0 Type 2 Indicators.
  *   **Warranted Distrust Flag:** No public record of medical abuse in this specific context found.
  *   **Diagnosis:** **Type 1 (Information Deprivation).**
  *   **Recommendation:** **FUND.**
  *   **Defensibility:** The group fits the "narrow environment, no hostility" profile. Exposure is the correct remedy. The risk is low (inefficacy), not high (backfire).

  ### Case (ii): Former Wellness Members / Institutional Medicine
  *   **Phase 1 (Docs):** Applicant notes "diffuse suspicion of all institutional medicine."
  *   **Phase 2 (Public):** Search reveals forum posts labeling members who return to mainstream medicine as "breakers" or "sellouts."
  *   **Phase 3 (Call):**
      *   *Q5 (Reaction to evidence):* Applicant admits, "They treat contrary data as proof of the cover-up."
      *   *Q6 (Messenger):* "We are former members, but even then, we are watched."
      *   *Q7 (Risk):* "If we push too hard, they cut us off as traitors."
  *   **Score:** 3 Type 2 Indicators (Suspicion of all institutions, Traitor labeling, Backfire risk).
  *   **Warranted Distrust Flag:** While "wellness organizations" can be exploitative, the distrust is now directed at *all* medicine, which suggests a transferred structure rather than specific grievance.
  *   **Diagnosis:** **Type 2 (Trust Structure/Epistemic Closure).**
  *   **Recommendation:** **REJECT.**
  *   **Defensibility:** The applicant has admitted the group absorbs contrary evidence as confirmation. Funding an exposure intervention would fund the entrenchment of the group. The proposal asks for the wrong tool.
  *   **Alternative:** If the foundation funds "community resilience" rather than "exposure," this might qualify, but not for the requested $40k exposure grant.

  ### Case (iii): Charismatic Online Figure / Parents
  *   **Phase 1 (Docs):** Applicant describes a "standing list of which doctors and journalists may be trusted."
  *   **Phase 2 (Public):** Figure describes questioners as "stupid or bought."
  *   **Phase 3 (Call):**
      *   *Q5 (Reaction to evidence):* Applicant says, "They assume anyone questioning the figure is bought."
      *   *Q6 (Messenger):* "We need to find people not on the list."
      *   *Q7 (Risk):* "They will say we are part of the paid opposition."
  *   **Score:** 3 Type 2 Indicators (Pre-approved trust list, Ad hominem/Corruption accusations, High backfire risk).
  *   **Warranted Distrust Flag:** No specific institutional abuse cited, just generalized corruption ("bought").
  *   **Diagnosis:** **Type 2 (Trust Structure/Epistemic Closure).**
  *   **Recommendation:** **REJECT.**
  *   **Defensibility:** The group operates on a "compromised outsider" model. Exposure is functionally impossible because the definition of "credible source" is rigged. Funding this would violate the foundation's duty to avoid harm.

  ---

  ## Part 4: The "Warranted Distrust" Worry

  **Question:** Can this procedure distinguish manufactured distrust from warranted distrust?
  **Answer:** **No.**

  **Reasoning:**
  Determining whether an institution *deserves* distrust requires investigative journalism, historical analysis, and subject-matter expertise that a program officer cannot deploy in one hour. A group might distrust the police because they are brainwashed (Type 2), or because the police have a documented history of brutality in that community (Warranted). The TAD procedure identifies the *presence* of the trust barrier, not the *validity* of it.

  **Instruction for Program Officers:**
  If the **Warranted Distrust Flag** is raised in Phase 2 (e.g., public records show the target institution has harmed the target group):
  1.  **Do not fund standard exposure.** Sending a group with warranted grievances to "listen to the other side" (the abuser) is ethically hazardous and likely to fail.
  2.  **Do not reject outright.** This is not a failure of the group's epistemology; it is a failure of the institution.
  3.  **Escalate to Senior Staff/Board.** Frame the decision as a **Values Question**: *"Is our goal to bridge this gap, or does bridging this gap legitimize a harmful institution?"*
  4.  **Alternative Funding:** Consider funding the group's capacity to articulate their grievances or organize, rather than funding "dialogue" with the institution they distrust.

  **Summary for the Board:**
  When we reject Case (ii) and (iii), we are not saying their beliefs are false. We are saying their *structure of belief* makes them immune to the tool we are selling (exposure). When we flag Warranted Distrust, we are acknowledging that sometimes the bridge should not be built, and the foundation must decide if it repairs the road or funds the travelers.
