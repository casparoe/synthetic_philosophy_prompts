answer: |-
  I'm going to cut **Premise (3)**.

  Your friend's chain is tight, but it relies on an equivocation about what is being conceived in the case of the "Greatest Conceivable Being" (GCB) versus the "Zombie." The cut costs us the ability to use two-dimensional semantics to bootstrap theological existence proofs, but it leaves the zombie argument intact. Here is the defense, the asymmetry, and the price.

  ### The Cut: Premise (3) is False
  Premise (3) claims: *"There's nothing incoherent in [the GCB]; if I can conceive of a zombie I can certainly conceive of that."*

  I deny this. On the two-dimensional framework, **ideal conceivability requires a coherent primary intension.** A primary intension is a function from scenarios (worlds considered as actual) to extensions. To be ideally conceivable, you must be able to specify a scenario *as actual* in which the sentence comes out true, without contradiction surviving ideal reflection.

  The asymmetry lies here: **The zombie hypothesis is categorical; the GCB hypothesis is modal.**

  1.  **The Zombie Case ($P \& \neg Q$):** The primary intension of "zombie" is built from categorical concepts: physical structure ($P$) and phenomenal experience ($Q$). When I consider a scenario as actual, I can specify the physical facts and specify the absence of experience. Both are properties instantiable *within* the scenario. There is no reference to other worlds built into the content of the concept "consciousness" or "physical structure." The primary intension is well-defined and coherent.
  2.  **The GCB Case:** The definition of a GCB includes "necessary existence" (existing in all possible worlds). This is not a categorical property instantiable *within* a single scenario considered as actual. It is a claim about the *secondary intension* (truth across counterfactual worlds).

  When you try to form the primary intension of "A GCB exists," you are asking: "Is there a scenario $S$, considered as actual, where a being exists that exists in all worlds?" But "all worlds" is indexical to the modal framework surrounding $S$. You cannot verify the property "exists in all worlds" from within the perspective of $S$ considered as actual without already assuming the modal conclusion (that $S$ is part of a modal space where this being is necessary).

  Therefore, "A GCB exists" does not have a coherent primary intension in the same way "A zombie exists" does. It is a **modal parasite**. It smuggles a secondary-intension claim (necessity) into a primary-intension test (conceivability). Ideal reflection reveals that you cannot positively conceive of a being having the property of "necessary existence" in a specific scenario without begging the question. You can conceive of a *powerful* being, but the "maximal greatness" clause adds a modal operator that breaks the primary intension.

  So, (3) is false. The GCB is not ideally conceivable in the sense required by (2).

  ### Why This Doesn't Gut the Zombie Argument
  Your fear is that if I restrict conceivability here, a physicalist will say, "Zombies aren't ideally conceivable either." But the restriction isn't arbitrary; it tracks the **semantic structure of the concepts**.

  *   **Phenomenal concepts are direct.** When I conceive of $\neg Q$ (no experience), I am conceiving of the absence of a categorical property given by acquaintance. I don't need to know its modal profile to conceive of it primarily.
  *   **The GCB concept is derivative.** "Necessary existence" is defined by its modal profile.

  The physicalist cannot argue that "Zombie" is modal in the same way "GCB" is. To do so, they would have to argue that "consciousness" is *defined* by its modal relations to the physical (e.g., "Consciousness just is whatever the physical facts necessitate"). But that is precisely what the zombie argument denies. The zombie argument assumes phenomenal concepts are not a priori entailed by physical concepts. If the physicalist argues that "Zombie" is inconceivable because consciousness is modally defined by physics, they are no longer arguing about conceivability; they are asserting a version of physicalism that 2D semantics was designed to test.

  The asymmetry holds: You can conceive of a world without consciousness because consciousness is a categorical presence/absence. You cannot conceive of a "Necessary Being" primarily because "Necessary" is not a categorical presence/absence; it is a quantification over worlds.

  ### Pricing the Cut
  Here is what this costs the two-dimensional framework, ranked from cheapest to most expensive:

  1.  **Cost to the Necessary A Posteriori (Low):** This cut actually *protects* the standard 2D account of the necessary a posteriori (like "Water = H2O"). That account relies on the divergence between primary (contingent) and secondary (necessary) intensions. By refusing to allow secondary-intension properties (like necessity) to dictate primary-intension conceivability, we keep the two dimensions distinct. We avoid collapsing the primary into the secondary, which is exactly what the Modal Ontological Argument tries to do.
  2.  **Cost to the Claim that Physical Facts A Priori Entail Phenomenal Ones (None):** This cut doesn't change the a priori entailment debate. It just clarifies that the test for entailment (conceivability of $P \& \neg Q$) is valid because $P$ and $Q$ are categorical. It leaves the result of the test untouched.
  3.  **Cost to the Zombie Argument (Low/Medium):** The cost is that we must be vigilant. We must ensure that no one redefines phenomenal terms modally. If a physicalist says, "Consciousness is defined as the state that necessarily supervenes on $P$," then "Zombie" becomes inconceivable by definition, just like "GCB." But this is a substantive metaphysical claim, not a semantic one. The 2D framework forces them to make that claim explicitly rather than hiding it in a conceivability intuition. We lose the "easy" win against someone who defines their terms modally, but we never had that win to begin with.
  4.  **What I'd Throw Overboard First:** If forced to choose between the **CEP (Conceivability Entails Possibility)** and the **Categorical/Modal Distinction**, I throw overboard the unrestricted CEP. I would restrict CEP to **categorical statements only**.

  ### The Joint in the Friend's Argument
  Your friend's argument breaks at the inference from "I can say the words without immediate contradiction" to "This has a coherent primary intension."

  The Modal Ontological Argument works in S5 logic, but 2D semantics is not just S5 logic; it is a semantics of *content*. The friend treats "GCB" as if it were a rigid designator with a coherent primary intension like "Water." It isn't. It's a description containing a modal operator.

  In 2D terms:
  *   **Zombie:** Primary intension is true at some scenario $S$. Secondary intension is true at some world $W$. CEP bridges $S$ to $W$.
  *   **GCB:** The definition fixes the secondary intension (exists at all $W$) but leaves the primary intension empty or incoherent. There is no scenario $S$ where you can verify "exists at all $W$" without already assuming the modal facts of $W$.

  By cutting (3), we preserve the machinery that makes the zombie argument work (the ability to test categorical co-instantiation via scenarios) while blocking the machinery that allows theological definitions to bypass empirical verification. We admit that 2D semantics can tell us about the structure of our concepts, but it cannot conjure existents from definitions that quantify over the very modal space the semantics is trying to map.

  **Verdict:** Keep the Zombie, drop the Saint. The asymmetry is real, and it lives in the difference between conceiving a *state of affairs* (Zombie) and conceiving a *modal status* (GCB).
