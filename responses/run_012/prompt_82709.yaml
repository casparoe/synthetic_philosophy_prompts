  **The Scenario: Museum Storage Room C**

  You are in a sealed climate-controlled storage room containing exactly **1,000 objects**.
  *   **900** are ravens (taxidermy mounts).
  *   **100** are non-ravens (pedestals, boxes, etc.).
  *   **10** are non-black things (white sneakers scattered among the pedestals).
  *   **990** are black things (the rest of the ravens and boxes).

  **The Hypothesis ($H$):** All ravens in this room are black.
  **The Alternative ($\neg H$):** At least one raven in this room is non-black. (For the arithmetic, we assume the minimal violation: exactly one raven is non-black).

  **The Sampling Rule:**
  You mix all 1,000 objects thoroughly. You reach in and pull out **one object uniformly at random**. You then inspect its type and color.

  **The Arithmetic:**
  We compare the Likelihood Ratio (LR) for two pieces of evidence. The LR measures the boost given to $H$ ($LR = P(E|H) / P(E|\neg H)$).

  1.  **Evidence $E_1$: You draw a Black Raven.**
      *   **Under $H$:** All 900 ravens are black. Probability = $900/1000 = 0.9$.
      *   **Under $\neg H$:** One raven is non-black, so only 899 are black. Probability = $899/1000 = 0.899$.
      *   **$LR(E_1)$:** $0.9 / 0.899 \approx \mathbf{1.0011}$.

  2.  **Evidence $E_2$: You draw a Non-Black Non-Raven (a white sneaker).**
      *   **Under $H$:** All 10 non-black things must be non-ravens. Probability = $10/1000 = 0.01$.
      *   **Under $\neg H$:** One non-black thing is now a raven. Only 9 non-black things remain non-ravens. Probability = $9/1000 = 0.009$.
      *   **$LR(E_2)$:** $0.01 / 0.009 \approx \mathbf{1.1111}$.

  **Result:** The white sneaker ($1.11$) provides roughly 100 times more confirmation than the black raven ($1.001$).

  **The Feature Doing the Work:**
  It is the **base rate ratio**. Specifically, non-black things are *rarer* than ravens in this room ($10 < 900$). In the standard paradox, we assume non-black things (everything else in the universe) vastly outnumber ravens. Here, I've inverted that scarcity. Because non-black things are scarce, finding one that *isn't* a raven eliminates a larger proportion of the possible ways $H$ could be false.

  **Flipping It Back:**
  If you restore normal base rates (e.g., 1,000 ravens vs. 1,000,000 non-black things), the sneaker's boost collapses.
  *   $LR(\text{Raven}) \approx 1000/999 \approx 1.001$.
  *   $LR(\text{Sneaker}) \approx 1000000/999999 \approx 1.000001$.
  In the real world, the sneaker confirms almost nothing because eliminating one non-black non-raven from a million tells you very little about the ravens.

  **Zero Confirmation Rule:**
  **Rule:** "Pick an object uniformly from the set of **Non-Ravens**."
  **Why:** If you restrict sampling to non-ravens, finding a non-black object (sneaker) confirms nothing *if* the number of non-black non-ravens remains constant between $H$ and $\neg H$ (e.g., if the non-black raven in $\neg H$ was previously a black raven, not a converted sneaker). The hypothesis constrains ravens, so sampling exclusively from non-ravens renders the evidence independent of the hypothesis.

  **The Cheating Objection:**
  If someone says you cheated by counting sneakers as single objects rather than atoms, the honest reply is: **the case is fragile.** Confirmation is relative to the reference class defined by the sampling protocol. If you change how you individuate "objects" (atoms vs. items), you change the base rates, and the confirmation flips. There is no absolute answer outside the chosen sampling frame. The paradox dissolves once you admit the result depends entirely on how you chop up the world for the sake of counting.

  \answer{The base rate ratio of non-black things to ravens.}
