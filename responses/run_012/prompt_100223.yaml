          2.  *Concessions:* Which defeaters would a parity theorist concede vs. dismiss (distinguishing metaphysical defects from pragmatic confusion).
          3.  *Triviality Risk:* Does parity collapse into "anything making a difference is a cause"? Is this a specific problem for omissions or general difference-making?
          4.  *Predictions:* What does parity predict that rivals don't? Can these be tested?
          5.  *The "Killer" Argument:* Construct a case where omission and action make the same counterfactual difference but have independent, non-normative reasons for causal asymmetry (or argue none exists).

  2.  **Analyze the Thesis (Causal Parity):**

      *   *Core Claim:* $C$ causes $E$ iff $C$ makes a difference to $E$. If $\neg A$ (omission) makes a difference to $E$ just like $A$ (action) does, then $\neg A$ causes $E$ in the same sense.
      *   *Philosophical Context:* This aligns with counterfactual theories (Lewis), interventionist accounts (Woodward), and contrastive accounts (Schaffer). It opposes process theories (Salmon, Dowe) and strict event ontologies (Davidson).
      *   *Key Challenge:* The "proliferation problem" (too many causes) and the "negative ontology problem" (what *is* an omission?).

  3.  **Drafting Section 1: Defeaters (Sorted by Decisiveness):**

      *   *High Decisiveness (Formal/Ontological):*
          *   **The Ontological Status of Relata:** Interventionism (Woodward) requires variables to take values. Can "absence" be a variable value? If variables range over *occurrences*, absence is tricky. If they range over *states*, it's easier. *Defeater:* If causation requires energy/momentum transfer (Process Theory), omissions are impossible causes. This isn't just intuition; it's a definition of the mechanism.
          *   **Spurious Correlations/Backtracking:** If omissions are causes, almost everything becomes a cause of almost everything else (The "Great Big Causal Web"). E.g., my failure to water your plants causes their death, but so does the President's failure to water them. If parity holds, both are *equally* causes. If the theory can't distinguish them without norms, it loses explanatory power.
          *   **Double Prevention:** $A$ prevents $B$, $B$ would have prevented $C$. $A$ causes $C$. Often involves omissions. Some argue this breaks transitivity or creates causal chains that feel wrong structurally.
      *   *Medium Decisiveness (Structural Cases):*
          *   **Joint Causation by Omissions:** Two guards fail to check a door. Burglar enters. Did Guard 1 cause the entry? Did Guard 2? Did the *pair*? If parity holds, the logic of INUS conditions applies equally. But if the "absence" is the default state, identifying the specific causal relatum is hard.
          *   **Preemption by Omission:** A backup system fails to kick in (omission) because the primary worked. If the primary had failed, the backup *would* have worked (but didn't need to). Wait, preemption by omission: $O1$ prevents $E$. $O2$ would have prevented $E$ if $O1$ hadn't. This gets messy in counterfactual frameworks (early vs. late preemption).
      *   *Low Decisiveness (Intuitions):*
          *   Killing vs. Letting Die (as requested, minimize this).
          *   "Nothing comes from nothing."

  4.  **Drafting Section 2: Concessions (The Parity Theorist's Defense):**

      *   *What they concede:* They must concede that *ontologically*, omissions are not "events" in the Davidsonian sense (spatiotemporal particulars). They are facts or true propositions. So, if causation *must* be event-event, parity fails. But the parity theorist rejects event-event causation.
      *   *What they dismiss:* The "proliferation" objection. They admit the President is a cause of the dead plant but say "So what? It's a *true* causal claim, just not a *useful* one." This shifts the burden to pragmatics.
      *   *Interventionism:* They argue variables *can* represent absences (e.g., Variable $V$: {Water, No-Water}). "Wiggling" the absence means changing the state from No-Water to Water. This is technically feasible.

  5.  **Drafting Section 3: Triviality Risk:**

      *   *The Risk:* If "making a difference" is the only criterion, then the absence of a meteor shower causing me to type this is a cause (if a meteor shower would have stopped me).
      *   *Is it specific to omissions?* No, it affects all difference-making theories (counterfactualism). However, omissions exacerbate it because "normal" states are often defined by what *doesn't* happen.
      *   *Collapse:* Yes, it risks collapsing into "causal relevance." To save it, one needs a "normality" or "default" parameter. But adding that parameter threatens Parity (because norms creep back into metaphysics).
      *   *Verdict:* It's a problem for difference-making generally, but omissions make it acute.

  6.  **Drafting Section 4: Predictions:**

      *   *Parity Prediction:* In legal or scientific contexts, if we strip away norms, omission-causes should behave identically to action-causes in structural equation models (SEMs).
      *   *Rival (No Omissions):* Predicts SEMs will fail or require special markers for omissions.
      *   *Rival (Deontic/Secondary):* Predicts that moral/legal judgment will correlate with causal judgment even when counterfactual dependence is held constant.
      *   *Testing:* Experimental philosophy (Knobe effect style). Do people attribute causality to omissions equally when norms are controlled? Actually, studies show people *resist* calling omissions causes even when counterfactuals hold, unless there's a norm violation. This supports the rival (Deontic/Normative) view over strict Parity.

  7.  **Drafting Section 5: The "Killer" Argument (Asymmetry):**

      *   *Goal:* Find a case where Counterfactual Dependence is identical, but Causal Status differs *non-normatively*.
      *   *Candidate:* Physical Process vs. Lack thereof.
      *   *Case:* A bridge collapses.
          *   Scenario A: A terrorist plants a bomb (Action). Energy transfer occurs.
          *   Scenario B: Maintenance crew fails to fix a known crack (Omission). No energy transfer.
          *   Counterfactual: In both, if the event/omission didn't occur, bridge stands.
          *   Is there a non-normative difference? Yes: The *mechanism*. In A, there is a physical process connecting cause to effect. In B, there is a *lack* of a process that would have prevented the effect.
          *   *Argument:* If causation requires a physical connection (process theory), Parity is false. But the Parity theorist denies causation requires physical connection.
          *   *Better Argument:* **Causal Explanation vs. Causal Production.** In science, we often model systems dynamically. Omissions don't appear in the dynamic equations (forces, masses); they appear as boundary conditions or parameter settings.
          *   *The "Independent Reason":* The direction of fit. Actions inject energy/information. Omissions represent the *persistence* of a state against a potential change.
          *   *Construction:* The "Switch vs. No-Switch" in a closed system. If I flip a switch, I change the system's Hamiltonian. If I *don't* flip a switch, the Hamiltonian remains the same. The "cause" of the outcome in the second case is the *initial conditions + laws*, not my omission. My omission is just the *absence of an intervention*.
          *   *Conclusion:* If we define causation as *intervention*, an omission is the *failure to intervene*. To call the failure itself an intervention is category confusion.
          *   *Wait, does this work?* Woodward says variables can be set. "Setting to 0" is an intervention.
          *   *Refined Killer:* **The Problem of Indeterminism.** In an indeterministic world, an action might raise the probability of an effect. An omission might leave the probability as background chance. If the effect happens, the action is a "risk maker." The omission is just "not lowering the risk." If parity holds, "not lowering risk" = "raising risk." But mathematically, $P(E|O) = P(E|Background)$. $P(E|Action) > P(E|Background)$. They are structurally distinct in probability space.
          *   *Decision:* I will argue that a truly non-normative asymmetry is hard to find *within* a difference-making framework, but exists *outside* it (process theories). However, within difference-making, the "Default/Deviant" distinction is often claimed to be pragmatic, but might be structural (stability of systems).

  8.  **Review and Refine:**

      *   *Tone:* Philosophical, rigorous, honest about the exposure.
      *   *Check constraints:* Did I address interventionism? Double prevention? Joint causation? Preemption? Triviality? Predictions? The Killer Argument?
      *   *Self-Correction on Interventionism:* Woodward explicitly handles omissions via variables taking values (e.g., $X=0$). The critique isn't that it *can't* be done, but that it requires treating "absence" as a positive state of a variable, which some argue masks the metaphysical difference. I need to be precise here.
      *   *Self-Correction on Triviality:* This is the strongest point against Parity. If the President is a cause of the plant's death, "cause" loses its discriminatory power. The Parity theorist must bite the bullet or add a "normality" constraint. If they add the constraint, does it violate Parity? Yes, because norms usually treat actions and omissions differently.

  9.  **Final Polish:** Organize into the four requested sections + the Killer Argument conclusion. Ensure the distinction between metaphysical and pragmatic is maintained throughout. (Proceed to generate output).

  *(Self-Correction during drafting Section 5)*: I need to be careful. The prompt asks for an *independent, non-normative reason*. If I appeal to "physical process," the Parity theorist says "That's the wrong theory of causation." I need a reason internal to difference-making or one that forces a choice between difference-making and something else.
  *Better angle:* **Explanatory Asymmetry in Dynamic Systems.** In a differential equation system, a force (action) appears as a term. An omission appears as a zero coefficient or a lack of a term. Mathematically, a term and a lack of a term play different roles in the derivation of the solution, even if the counterfactual outcome is the same. This suggests the *structure* of the dependency differs, even if the truth value of the counterfactual is the same.

  Let's build the response.

  *   **Section 1:** Defeaters (Ontology, Interventionism technicalities, Proliferation/Triviality, Preemption/Double Prevention).
  *   **Section 2:** Concessions (Admit ontology differs, deny it matters; Admit proliferation, call it pragmatic).
  *   **Section 3:** Triviality (Yes, it risks triviality; it's a general problem for counterfactualism but acute for omissions).
  *   **Section 4:** Predictions (Psychological attribution, Legal modeling).
  *   **Section 5:** The Asymmetry Argument (Dynamic Systems/Probability structure).

  *Refining the "Killer":* The strongest non-normative asymmetry is in **probabilistic causation**. An action can *increase* probability. An omission usually *fails to decrease* it (or fails to increase it). While both make a difference counterfactually (compared to a world where the omission didn't occur—i.e., action occurred), the *direction* of influence relative to the background field differs. But Parity says "makes a difference" is all that matters.
  Actually, the best "Killer" is the **Default/Deviant** structural issue. If we model causation via Structural Equation Models (SEMs), we need to specify which values are "default." If "default" is metaphysical, Parity might survive. If "default" is normative, Parity relies on norms.
  Let's go with the **Physical Process/Conservation Law** argument as the external defeater, and the **Stability/Default** argument as the internal tension.

