answer: |-
  Project Cybersyn stands as the most concrete physical instantiation of the socialist calculation debate's abstract theoretical stakes. It was not merely a technological experiment but an attempt to materialize a theory of economic governance. Analyzing it through the triad of Mises, Hayek, and Lange reveals that Cybersyn did not solve the calculation problem; rather, it shifted the terrain upon which the problem rests. It demonstrates that the debate was never primarily about computational capacity, but about the ontology of economic information.

  ### I. Mapping the Debate onto Cybersyn

  To analyze Cybersyn through the calculation debate, we must first rigorously map the theoretical roles onto the system's architecture.

  **The Planning Board:** In the Lange model, the Central Planning Board (CPB) sets prices and adjusts them based on surpluses or shortages. In Cybersyn, this role was occupied by the *Opsroom* in Santiago, supported by the central IBM mainframe and the economic team at CORFO. However, unlike Lange's CPB, which was meant to simulate a market mechanism, the Opsroom was designed as a command node within a cybernetic hierarchy.

  **The Role of Prices:** This is the critical divergence. Lange required *parametric prices*—monetary values assigned to capital goods that managers treat as given, adjusting output until marginal cost equals price. Cybersyn did not generate or utilize prices for the means of production. Instead, it transmitted *physical indicators*: tons of copper produced, kilowatt-hours consumed, inventory levels, and labor hours.
  These were not genuine prices in the Langean sense. A price is a summary of subjective valuations and relative scarcities; a physical indicator is a measure of technical throughput. By relying on physical quotas and input-output coefficients, Cybersyn reverted to a pre-Langean "command" model. It lacked the common denominator (money) necessary to compare heterogeneous goods. Consequently, the system could determine if a factory was meeting a target, but it could not determine if producing that good was economically rational relative to alternative uses of the same resources.

  **Trial and Error:** In Lange's model, trial and error occurs at the center: the CPB raises prices if there is a shortage and lowers them if there is a surplus. In Cybersyn, "trial and error" was localized and constrained. The software *Cyberstride* used Bayesian filtering to detect deviations from production norms. When a variable drifted outside acceptable ranges, an *algedonic alert* (a signal of pain or pleasure) was sent upward.
  This implies that trial and error occurred primarily at the factory level (self-regulation within limits), while the center engaged in exception management. The center did not iteratively adjust prices to clear markets; it iteratively adjusted *commands* or intervened to fix bottlenecks. This is not the market-socialist feedback loop Lange envisioned, but a cybernetic homeostatic loop.

  **The Nature of Knowledge:** Hayek argued that market prices transmit dispersed, tacit knowledge about scarcity and preference that no single mind can possess. Cybersyn's telex network collected explicit, codified data. It captured *that* a machine was idle, but not *why* (e.g., a skilled worker's intuition that the machine would break if pushed harder, or a local preference for a different product).
  The difference between Cybersyn's data and Hayekian prices is not one of bandwidth or speed, but of kind. Prices are compressed information about *valuation*; Cybersyn's telemetry was compressed information about *status*. A price tells you what something is worth relative to everything else; a telex message tells you what is happening in one place relative to a plan. Cybersyn increased the speed of command, but it did not capture the opportunity costs that Hayek argued are only revealed through exchange.

  ### II. The Computational Objection and the Nature of Information

  A common contemporary reaction to Cybersyn is that it renders the calculation debate obsolete: Mises and Hayek lacked modern computing power, and Cybersyn proves that with sufficient sensors and processing, central coordination is viable. This reading fundamentally misinterprets the Austrian critique.

  **Computation vs. Information Generation:** Mises and Hayek did not argue that the equations of equilibrium were too complex for human brains; they argued that the *variables* in those equations do not exist until they are discovered through market action. Mises's point was ontological: without private property in the means of production, there is no exchange, and without exchange, there are no prices. You cannot compute a ratio of exchange for goods that are not traded.
  Cybersyn did not solve this. It took existing production data and routed it faster. It did not generate new valuations for capital goods. Therefore, better technology addresses the *coordination* problem (moving known resources efficiently) but not the *calculation* problem (determining which resources create the most value).

  **Recursion as Concession:** Stafford Beer's Viable System Model (VSM) was deliberately recursive. It assigned autonomy to lower levels (factories) to handle local complexity, reserving central intervention for exceptions. This design is best read not as a vindication of Lange, but as a tacit concession to Hayek.
  By granting factories the authority to self-regulate within parameters, Beer acknowledged that local knowledge is superior for operational decisions. However, the *parameters themselves* were set centrally. Thus, Cybersyn hybridized the debate: it accepted Hayek's premise on the dispersion of operational knowledge while retaining the socialist premise on the central determination of goals. It solved the problem of "how to produce" (engineering efficiency) without addressing "what to produce" (economic valuation).

  **Logistics vs. Valuation:** The system's reported success during the 1972 truckers' strike confirms this distinction. The strike created a distribution crisis: known goods needed to move from known points A to B to prevent starvation. This is a linear programming problem, solvable by algorithms and telemetry.
  The calculation debate, however, concerns the allocation of capital goods toward *unknown* ends. Deciding whether to build more trucks or more tractors, or whether to invest in copper mining or textile manufacturing, requires comparing subjective future preferences against present costs. Cybersyn was useful for logistics because logistics is a technical problem of optimization under constraints. It would have faced the calculation problem if asked to decide the national investment portfolio. The fact that it was only tested on the former leaves the latter untouched.

  ### III. Limitations and the Framing of the Debate

  We must be honest about what Cybersyn cannot settle. The project was interrupted, the economy remained mixed, and the system operated within a context of distorted prices.

  **The Missing Counterfactual:** A decisive test of the calculation debate would require a closed economy with no private sector, no black markets, and no external price signals, running for a period long enough for capital structures to mature. Cybersyn operated in an economy where prices still existed in the private sector and where international trade provided shadow prices. The "data" fed into the IBM mainframe was often derived from monetary transactions that still reflected market valuations, however distorted. Therefore, Cybersyn did not operate in the "socialist commonwealth" Mises described, where prices for capital goods are entirely absent.

  **What a Decisive Test Would Look Like:** To truly test Mises, Cybersyn would have needed to allocate investment capital across nationalized industries without reference to profit/loss statements or external market prices, relying solely on physical coefficients and social welfare functions. To truly test Lange, it would have needed to simulate prices for capital goods and allow factory managers to respond to those prices rather than physical quotas. Cybersyn did neither. It managed flows, not capital allocation.

  **Reframing the Debate:** The episode suggests that the traditional framing of the calculation debate—"Plan vs. Market"—is insufficient. Cybersyn introduces a third category: "Networked Hierarchy."
  The debate is often framed as a contest over computational capacity: can the center calculate better than the market? Cybersyn shows that the center can calculate *coordination* very well. The debate needs revision to distinguish between *allocative efficiency* (moving resources to where they are technically needed) and *economic efficiency* (moving resources to where they are most valued).
  Cybersyn suggests that the Austrian critique holds firm on valuation but weakens on coordination. Technology can mitigate Hayek's knowledge problem regarding *status* (what is happening where), but it cannot mitigate Mises's problem regarding *value* (what is it worth).

  ### Conclusion

  Project Cybersyn does not dissolve the socialist calculation debate; it clarifies it. It demonstrates that high-bandwidth communication and recursive management can solve the problem of bureaucratic lag and operational coordination, validating the cybernetic view that organizations are information processing systems. However, it confirms the Austrian insight that information about *value* is not a data point to be collected, but a signal to be generated through exchange.

  The system's indicators were physical quotas, not Langean prices; its trial and error was technical adjustment, not market discovery; and its success was in logistics, not capital allocation. Cybersyn proves that a socialist state can build a nervous system, but it does not prove that the nervous system can feel value. The debate, therefore, remains open on the question of valuation, but the framing must shift: the limit of socialism is not the speed of the computer, but the nature of the data it processes.
