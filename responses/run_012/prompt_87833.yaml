answer: |-
  Good's theorem is a cornerstone of formal decision theory. It demonstrates that for a Bayesian agent who maximizes expected utility, the expected value of free, reliable information is non-negative. Mathematically, this is because the agent can always choose to ignore the information; if the signal suggests an action different from the prior optimal action, the agent takes it, and if not, they stick with the prior. Since the agent never *must* act on the information to their detriment, the expectation cannot be negative.

  This result is frequently extrapolated into a broader philosophical claim: that information is intrinsically good for a rational agent, or at the very least, never rationally harmful. I argue that this extrapolation is unwarranted. Good's theorem secures the *pragmatic* value of information, but it does not secure its *epistemic* value. By distinguishing decision-theoretic value (instrumental success in the world) from epistemic value (the normative standing of the belief state itself), we can construct a scenario where a free, reliable signal has negative expected epistemic value. This occurs for an agent whose epistemic goal is systemic coherence and stability, where belief revision imposes an internal burden of re-integration that outweighs the gain in accuracy.

  ### 1. Distinguishing Decision-Theoretic and Epistemic Value

  To challenge the broader reading of Good's theorem, we must first separate the two domains of evaluation.

  **Decision-Theoretic Value (DTV)** is instrumental. It measures how well an agent's actions satisfy their preferences regarding states of the world. In the context of Good's theorem, the utility function $U$ maps world-states (and actions) to real numbers. Information is valuable here only insofar as it alters action probabilities to yield better worldly outcomes.

  **Epistemic Value (EV)**, conversely, is often conceived as intrinsic to the belief state. While veritistic epistemology defines EV as accuracy (matching belief to truth), other frameworks, such as coherentism or pragmatist epistemology, define EV in terms of systemic properties: consistency, explanatory integration, and stability.

  Good's theorem guarantees that $E[DTV|Info] \geq E[DTV|No Info]$. It does not guarantee that $E[EV|Info] \geq E[EV|No Info]$, because EV is not necessarily the utility function the agent maximizes in decision problems, nor does epistemic rationality always afford the "option to ignore" that protects the theorem.

  ### 2. The Coherentist Conservator

  Consider an agent, let us call her Clara. Clara is a Bayesian in her probabilistic coherence, but her *epistemic goal* is not merely accuracy. She values the **stability and integration** of her belief web. For Clara, a belief system is epistemically valuable not just when it is true, but when it is resilient and requires minimal cognitive maintenance to remain consistent.

  For Clara, belief revision is not costless, even if the information is free. The "cost" is not material (time or money) but **structural**. When a new signal contradicts a central node in her belief network, she must dismantle associated inferences to restore coherence. This process imposes a burden of *epistemic disutility*: a temporary state of fragmentation and the risk of error during re-integration.

  **The Scenario:**
  Clara holds a highly coherent theory $T$ that explains a wide range of phenomena. She receives a free, reliable signal $S$ that is statistically independent of her actions but probabilistically relevant to $T$. $S$ is reliable (it tracks the truth), but it is anomalous relative to $T$.
  *   **Decision-Theoretic Perspective:** $S$ has no bearing on Clara's practical actions (e.g., she is observing a distant star). Thus, conditioning on $S$ does not change her optimal action. According to Good's theorem, the expected decision-theoretic value is zero (she ignores it for action purposes). $E[DTV] \geq 0$ holds.
  *   **Epistemic Perspective:** Epistemic rationality, unlike pragmatic rationality, often mandates updating on evidence. If $S$ is reliable evidence, Clara *ought* to update her credence in $T$. However, updating on $S$ forces her to dismantle $T$. The loss in coherence and stability (the "revision burden") exceeds the gain in accuracy provided by $S$.

  For Clara, the expected epistemic value of receiving $S$ is negative:
  $$E[EV|Info] = P(S) \cdot (AccuracyGain - CoherenceLoss) + P(\neg S) \cdot (\dots) < EV(Prior)$$

  Because the signal is reliable, she is epistemically compelled to update. Because the update damages her specific epistemic goal (coherence/stability), the information lowers her expected epistemic standing.

  ### 3. Why Good's Theorem Does Not Apply to Epistemic Value

  One might argue that Good's theorem should apply here because Clara could simply choose not to update her beliefs. This is where the distinction between *action* and *belief* is crucial.

  Good's theorem relies on the **option to disregard**. In decision theory, an agent can receive information and choose the same action they would have chosen without it. This "real option" ensures non-negative value.

  In epistemology, however, the "option to disregard" is often unavailable to a rational agent. If $S$ is recognized as reliable evidence, epistemic norms (specifically evidentialism) mandate belief revision. To ignore $S$ is to be epistemically irrational, even if it preserves coherence. Therefore, the agent faces a forced choice: violate epistemic norms (by ignoring evidence) or suffer a loss in epistemic value (by updating and losing coherence).

  If we define the "value of information" epistemically as the value of the belief state *resulting from rational updating*, then for Clara, the expected value is negative. Good's theorem does not protect her because epistemic rationality does not grant the option to ignore evidence without normative penalty. The theorem protects the *pragmatic* agent who can shelve information; it does not protect the *epistemic* agent who is compelled to integrate it.

  ### 4. Addressing the Objection: "It's Just a Utility Function"

  A standard objection to this argument is that I am merely redefining the utility function. If Clara values coherence, why not include "coherence" in her utility function $U$? If we do so, Good's theorem would state that the expected utility of information (including coherence costs) is non-negative. Therefore, the objection goes, information still has non-negative value; I have just described a case where the *accuracy* component is outweighed by the *stability* component within a single utility metric.

  This objection fails because it conflates **pragmatic utility** with **epistemic value**, thereby begging the question against the autonomy of epistemic norms.

  **1. The Category Error:**
  Good's theorem is a theorem about *choice under uncertainty* to maximize *preference satisfaction*. If we subsume epistemic values (like coherence) into the utility function, we are treating epistemic states as mere preferences akin to a taste for ice cream. This reduces epistemology to a branch of economics. However, many philosophers argue that epistemic norms are distinct from pragmatic preferences. An agent can have a pragmatic reason to believe something (Pascal's Wager) but no epistemic reason, and vice versa. By insisting that epistemic value is just a subset of decision-theoretic utility, the objection dissolves the very distinction required to evaluate the "broader reading" of Good's theorem. The broader reading claims information is good for the *knower*, not just for the *actor*.

  **2. The Normative Force:**
  If we treat coherence costs as part of the utility function $U$, Good's theorem implies Clara should *ignore* the information if the coherence cost is too high (since she can opt-out). But if she ignores reliable evidence, she violates epistemic norms.
  *   **Pragmatic Rationality:** Ignore $S$ to maximize $U$ (preserving coherence). Good's theorem holds ($E[U] \geq 0$).
  *   **Epistemic Rationality:** Update on $S$ because it is evidence. $EV$ decreases.

  The objection claims that because Pragmatic Rationality says "ignore it," the value is non-negative. But this ignores the epistemic obligation to update. The "negative value" arises precisely because the agent *should* update (epistemically) but *would prefer not to* (pragmatically/structurally). If we define Epistemic Value as the normative worth of the belief state *given the evidence*, then receiving evidence that forces a downgrade in coherence constitutes a negative epistemic event, even if ignoring it would be pragmatically safer.

  **3. Is Epistemic Value Distinct?**
  Is the notion of epistemic value I am invoking genuinely distinct? Yes. Decision-theoretic value is forward-looking and consequentialist (what does this belief *do* for me?). Epistemic value, in the coherentist framework described, is structural and constitutive (what does this belief *do to* my mind?).
  If EV were simply a special case of DTV, then "epistemic rationality" would just be "pragmatic rationality applied to beliefs." But if we accept that there are distinct norms of belief (e.g., one ought not believe contradictions, regardless of utility), then EV is a separate metric. Good's theorem applies to the maximization of DTV. It does not apply to the maximization of EV if EV is not the function being maximized in the decision problem, or if the norms of EV compel updates that DTV would advise against.

  ### Conclusion

  Good's theorem proves that information is never pragmatically harmful to an agent who can freely choose how to act on it. It does not prove that information is never epistemically harmful to an agent who is compelled to update on it.

  For an agent like Clara, whose epistemic value is tied to the stability and coherence of her belief system, a reliable signal can force a revision that degrades her epistemic standing (by fracturing coherence) even while leaving her pragmatic standing intact. The objection that this merely changes the utility function fails because it collapses the distinction between pragmatic choice and epistemic obligation. By maintaining that distinction, we see that Good's theorem is a limit on practical rationality, not a universal guarantee of the benefits of knowledge. Information can be a pragmatic asset while simultaneously being an epistemic burden.
