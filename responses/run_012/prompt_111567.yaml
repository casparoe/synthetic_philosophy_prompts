      *   *Final Question:* Needs to test dependency structure.
      *   *Predictable Failures:* Getting stuck on "How does the sentence refer to itself?" (Just assert it exists). Getting stuck on "But the agent *is* sound!" (Distinguish object level vs. meta level).

  7.  **Developing the Plan (Iterative refinement):**

      *   *Sequence:*
          1.  **The Wish:** Agent wants to trust its own proofs.
