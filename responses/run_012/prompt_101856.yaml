prompt: |-
  I keep meeting a fork in the road when I read explanations of perceptual illusions, and I have no name for it. The shape of it is this. An illusion makes someone report something the physical stimulus doesn't appear to contain: two stills flashed in quick succession are seen as a single object gliding across the gap, and when the two stills are different colors the gliding object is reported to change color halfway along; a blind spot gets filled in with whatever surrounds it. In every such case there seem to be two ways to tell the story. On the first, the brain builds the missing content before the person experiences anything, so the experience itself already contains the motion or the color change. On the second, the person first has a thinner experience, close to what was actually presented, and the brain afterward edits the memory or the report, so that the person merely comes to believe they experienced the richer thing. As far as I can tell the two stories predict exactly the same thing about anything the person could ever say or do, and yet people argue over which is true as if one of them had to be. Is there an established name for this fork — a specific distinction, rather than the general remark that theories can be underdetermined by evidence? If there is, what exactly does it mark, and what is supposed to turn on whether the revision happens before the experience, after it, or at some third point? If there is no settled name for the pattern as I've drawn it, please give it one and say where its edges lie — in particular, how it differs from the ordinary case of two theories that make the same predictions. Answer in American English.
