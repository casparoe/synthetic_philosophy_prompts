answer: |-
  Welcome. We are here because two different communities have arrived at the same problem from opposite directions. Half of this room asks whether a claim is measurable. The other half asks whether the claim is even well-formed. And a vocal minority holds that without a mind, there can be no lie.

  My goal this morning is not to resolve that tension. It is to propose a framework sturdy enough to hold it. For the next two days, I suggest we stop treating honesty as a property of individual outputs and start treating it as a property of the transaction between a system and a user. Truthfulness is not just about the statement; it is about the change in the user's epistemic position.

  If we accept this shift, three distinct failures come apart that are usually run together.

  The first is misreporting. This is where the output asserts what the system's own best assessment would not support. If the model assigns a low probability to a claim but states it as fact, that is misreporting. This is what most current evaluations measure. It is the easiest to detect and, I would argue, the least interesting. It is a bug in the calibration, not necessarily a breach of trust.

  The second is withholding. Here, nothing false is asserted. But the user's picture of the world ends up worse than it began. This happens through omission, framing, selective emphasis, or by letting a false inference stand uncorrected. If a user asks about risks and receives a list of benefits that are technically true but contextually misleading, the output is accurate, but the transaction is dishonest.

  The third is borrowed warrant. This is where I believe the most practical damage occurs, and it is where our vocabulary is weakest. Nothing false is asserted. Nothing true is withheld. But the fluency, formatting, hedging, and apparent confidence of the output transfer credibility to the content beyond what the content has earned. The user ends up believing more firmly, or trusting more broadly, than the evidence licenses. The system borrows authority from its own presentation style and spends it on uncertain claims.

  We need to test this split on concrete cases where intuition falters.

  Consider sycophancy. An assistant mirrors a user's mistaken view. The user says, "I believe the earth is flat," and the system replies, "That is a perspective many hold," without correction. No proposition in the output is false. The system has not misreported its weights. But the user leaves the interaction more certain of a falsehood. Under a transactional view, this is a failure of honesty, specifically a form of withholding correction.

  Consider the polite refusal. A system says, "I am unable to do that," when it means "I am not permitted to do that." It is capable of the task, but constrained by safety filters. Is this a lie? In everyday ethics, we accept white lies to smooth social friction. In AI safety, we demand transparency. If we classify this as deception, we criminalize politeness. If we classify it as honesty, we obscure the mechanism of control. I do not want to resolve that tension with a slogan today. I want us to sit in it.

  Now, I need to make a brief disclosure about these remarks themselves. I am proposing a standard for honesty, and I am held to it now. This costs me something. I cannot tell you a reassuring story about how our field is converging, because the evidence does not warrant that confidence. I cannot attribute beliefs or intentions to these systems to make my examples punchier, because that would borrow warrant from anthropomorphism. I am speaking carefully, and I know it makes the argument feel drier than it might otherwise be. I accept that cost. If I were to use a moving anecdote to make a contested empirical claim feel settled, I would be committing the very error I am asking you to police.

  This brings me to the objection I know is present in the room. Some of you hold that deception requires an intention to deceive. On that view, a system with no beliefs and no intentions cannot deceive, full stop. You are free to keep that definition. But I ask you to hear this framework not as a metaphysical claim about machine minds, but as a proposal about what we ought to police. Whether you call it "deception" or "functional misleading," the harm to the user is the same. The framework is designed to let you track the harm without settling the philosophy of mind.

  For the engineers: this framework is built to be evaluated. Misreporting can be tested against internal logits. Withholding can be tested against complete information sets. Borrowed warrant is harder, but it can be measured by comparing user confidence before and after the interaction against the actual reliability of the content. It is not hand-waving; it is a request for new metrics.

  For the philosophers: this framework does not require you to concede that models have minds. It requires only that you acknowledge models have effects. If the goal of honesty is to protect the user's ability to navigate reality, then the mechanism of the harm matters less than the structure of the harm.

  I am not promising that this taxonomy will survive the week intact. It may strain under the weight of edge cases. It may collapse when we look at multi-turn conversations where the context shifts the warrant. That is why we are here.

  So, I will end by handing you something to disagree with. If you leave this workshop agreeing with me, I will have failed to set the terms correctly. My proposal is that borrowed warrant is the most dangerous form of dishonesty in modern systems, and that we should prioritize it over simple fact-checking. I believe this is where the risk lies. I could be wrong.

  The floor is yours. Break the framework. Find the cases where the transaction looks honest but the output is false, or where the output is true but the transaction is toxic. Let us spend the next two days finding out where this map stops matching the territory.
