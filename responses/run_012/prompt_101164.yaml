answer: |-
  1. Resolve whether the tool should prioritize the longitudinal self's stable goals or the momentary self's revealed choices, as this dictates whether the system acts as a paternalistic warden or a neutral mirror. This is most upstream because it decides if commitment features are ethical or coercive, and you can test it by surveying users on whether they want the app to override their future impulses.
  2. Treat your bridge definition as provisional because defining akrasia strictly as preference reversal ignores cases where agents act against stable judgments, assuming the philosophical debate is settled in favor of descriptivism. This is highly tractable via literature review on Davidson versus Ainslie, and would move down if you find empirical cases of steadfast judgment paired with contradictory action.
  3. Distinguish whether failures stem from shifting reward weights via discounting or from a breakdown in translating intent to motor action, because the former requires reframing rewards while the latter requires friction-based intervention. This sits upstream of UI design choices between nudging values versus locking features, and is tractable by analyzing user logs for hesitation patterns versus explicit preference changes.
  4. Verify if the preference reversals you aim to fix are robust psychological phenomena or artifacts of how questions are framed during data elicitation, as building commitment devices for elicitation noise would harm user trust. This is tractable by A/B testing different preference query methods, and would move up if users show high inconsistency across different framing conditions.
  5. Establish whether users actually desire the commitment devices they request when calm, because a tool enforcing goals the user no longer endorses becomes hostile software rather than supportive infrastructure. This depends on the previous questions but is critical for retention, and you can measure it by tracking how often users disable constraints they previously set.
