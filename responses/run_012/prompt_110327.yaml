      *Wait, one more check on 3 vs 4.* Transparency (3) says I don't look inward. Functionalism (4) says self-knowledge is an internal mechanism. This is the "Metaphysical vs Epistemic" clash. If the mechanism *is* the transparency process (i.e., the mechanism takes world-inputs and outputs self-ascriptions), they are compatible. I should note this as a potential non-conflict but highlight the explanatory gap.

