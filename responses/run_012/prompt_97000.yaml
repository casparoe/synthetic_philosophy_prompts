      *   The "unfalsifiable" worry: It's not unfalsifiable, but it is *normative*. Empirical data (people *do* choose Allais) doesn't falsify the claim that they *shouldn't*.
      *   The real threat is if the "Independence violation" can be shown to be instrumentally useful or dynamically consistent without RCL.
      *   Verdict: The position is robust normatively but relies on the normative premise that "description shouldn't matter."

  6.  **Addressing the Specific Questions:**
