          *   *Concession:* Defenders of Independence usually concede dynamic consistency is key.
      *   *Defeater 2: Description Invariance (Framing).*
          *   If the preference disappears when the tree is reduced mathematically before presentation, the "preference" was an illusion of calculation error, not a stable value judgment.
          *   *Concession:* Hard to deny.
      *   *Defeater 3: The "Common Ratio" vs. "Common Consequence" distinction.*
          *   Allais has two forms. Rob's tree argument works better on Common Consequence. Does it work on Common Ratio?
          *   *Concession:* If Rob's theory only saves one version, it's incomplete.
      *   *Defeater 4: Normative Money Pump (without RCL assumption).*
