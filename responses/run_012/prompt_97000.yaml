  | **3. Persistence in State-Contingent Frames**<br>(Allais preferences persist when presented as simultaneous bets on cards/states, removing "stages" entirely) | It would show the preference is *not* about compound lotteries or RCL. It isolates the violation purely to probability weighting (Independence). This supports *your* view, so its absence counts against you. | **Fatal** (if preferences *disappear*) | **Yes.** If the preference vanishes without stages, Rob is right that the "two-stage" nature was the cause. | **No.** This would confirm the violation is structural (RCL), not fundamental (Independence). |
