      *   (c) Calibration: This is a red herring for Allais. Allais is about probability weighting, Rabin is about utility curvature.
      *   Framing: If preferences flip, it suggests the "Allais Preference" isn't a stable preference, weakening the claim that it's a valid alternative theory.

