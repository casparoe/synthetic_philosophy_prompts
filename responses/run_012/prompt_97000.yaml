prompt: |-
  I've been arguing about this for weeks with two friends in my decision theory reading group, and I've ended up defending a fairly hard line, so I want you to try to break it. The line is this: the Allais preference — in the classic pair, taking the sure million in the first problem, then taking the 10% shot at five million over the 11% shot at one million in the second — is a mistake, and the axiom it violates is the independence axiom (equivalently, on Savage's setup, the sure-thing principle), full stop. My friend Rob keeps saying that's the wrong diagnosis. He says the real culprit is the reduction-of-compound-lotteries axiom — the principle that a two-stage lottery is worth exactly the one-stage lottery you get by multiplying the probabilities out — or maybe the 'consequentialism' assumption that branches which are identical across the two options can just be ignored, and that if you drop that instead and hold onto independence, the Allais choices come out perfectly consistent, maybe even rational, since on his view the two-stage structure isn't merely a presentational trick. I definately think that's a dodge, but I can't say why in a way that convinces anyone, and I also can't shake the worry that 'which axiom is the culprit' is the kind of question you can always answer however you like, which would make my position kind of unfalsifiable.

  So: what would count against my position? Not the textbook list — I want to know which arguments, intuitions, formal results or empirical findings should actually move me, which of them someone who holds my view would themselves have to concede count against them (as opposed to what critics say about it), and which are just noise. Rank them by how decisive they'd be. A few specific things I'd find especially persuasive, so tell me if any of them actually does the job: (a) a version of the choice where the Allais-type preference can't be redescribed as a two-stage lottery at all; (b) a demonstration that keeping independence while dropping reduction forces you to accept something independently unacceptable; (c) the calibration-style argument that anyone who turns down a modest even-odds gamble at ordinary stakes is thereby committed to absurd-looking risk aversion at high stakes — I can't tell whether that's a problem for me or for the person who thinks the Allais intuition is a sensible response to risk. I also keep reading that people's choices flip depending on whether you show them the lottery as a tree or in its reduced form, and I don't know what that does to the idea that there's a single 'Allais preference' that's either rational or irrational — does it dissolve the thing I'm defending? And give me an honest verdict at the end on whether my position is well insulated (I suspect it is, since we seem to keep patching it by reassigning blame among the axioms) and whether that's actually a problem for a view like this.

  Format: a table with the columns defeater | what it would show if it went through | how decisive (fatal / serious / merely awkward) | would the defenders of my position concede it? | can my position be patched without cost? — then a short verdict paragraph at the end about survival and insulation.
