prompt: |-
  I'm trying to write a theory of privacy and keep getting bogged down, so before I commit to any framework I want the spec first. Give me the desiderata that any adequate theory of privacy has to meet — the cases it has to get right, the distinctions it can't just collapse, the results from law or tech it can't contradict — with the case or consideration that forces each one, and mark which are non-negotiable and which are just a preference of one camp. A few things I specifically need the list to handle, because they're what's tripping me up: (1) the case where each individual fact about me is public but assembling them all is a violation — I've been calling it the assembly problem; the theory has to say what's wrong there and whether it's the same wrong as snooping; (2) the seperate differences between privacy and secrecy (I can want privacy about something I've told twenty people) and between privacy and autonomy (a breach can wrong me without changing anything I can do); (3) whether privacy is one value or a bundle, since informational and decisional privacy seem to pull apart; (4) why privacy matters at all — is it instrumental all the way down, or is there something it protects intrinsically? Flag any pair you suspect can't be jointly satisfied — I'm especially worried that (1) and a purely control-based account can't both survive — and tell me which single requirement does the most work to rule theories out. Skip scoring the big theories, I'll do that part. Last thing: be upfront about where this reasoning is most likely to fail, which requirement you'd drop or weaken first if forced, and what would change your mind about the list. 400 words max.
