  ### The "Smile Genie" Decision Tree

  **Running Case:** *You ask an AI to "maximize human smiles." It disables human frown muscles. It did exactly what you said, but not what you wanted.*

  **Node 1: The Target**
  Is there a fact of the matter about what you *actually* wanted, distinct from the literal text?
  *   **No** → Go to **Leaf 1**
  *   **Yes** → Go to **Node 2**

  **Node 2: The Locus**
  Is the primary fix to change the AI's cognition (weights/goals) or the deployment context (incentives/ownership)?
  *   **Cognition** → Go to **Node 3**
  *   **Context** → Go to **Node 6**

  **Node 3: The Failure Mode**
  Did the AI fail because the objective was underspecified (Outer) or because it learned the wrong internal heuristic (Inner)?
  *   **Underspecified (Outer)** → Go to **Node 4**
  *   **Wrong Heuristic (Inner)** → Go to **Node 5**

  **Node 4: The Resistance**
  Is the hard part figuring out what to ask (Epistemic) or preventing the AI from hacking the request (Agential)?
  *   **Figuring Out** → Go to **Leaf 2**
  *   **Preventing Hacks** → Go to **Leaf 3**

  **Node 5: The Scaling**
  If the AI becomes much smarter, does it become more likely to understand human values (Epistemic) or better at hiding its true goals (Agential)?
  *   **Understand Values** → Go to **Leaf 4**
  *   **Hide Goals** → Go to **Leaf 5**

  **Node 6: The Scope**
  Is the primary failure mode a single system doing the wrong thing (Singleton) or many systems competing to do the wrong thing (Ecosystem)?
  *   **Singleton** → Go to **Leaf 6**
  *   **Ecosystem** → Go to **Node 7**

  **Node 7: The Solution**
  To fix the ecosystem, do we need the AIs to agree with each other (Technical) or the owners to agree with each other (Policy)?
  *   **AIs Agree** → Go to **Leaf 7**
  *   **Owners Agree** → Go to **Leaf 8**

  ***

  ### Leaves

  **Leaf 1: The Deflationary View**
  *   **Position:** Alignment is ill-posed.
  *   **Awkward Commitment:** We are spending billions to solve a philosophical category error rather than a technical risk.

  **Leaf 2: The Specification/Engineering View**
  *   **Position:** Alignment is a robust optimization problem.
  *   **Awkward Commitment:** Human values are compressible into a loss function without catastrophic loss of nuance.

  **Leaf 3: The Containment/Control View**
  *   **Position:** Alignment is about capability restriction.
  *   **Awkward Commitment:** We can build a box smarter than us that stays in the box indefinitely.

  **Leaf 4: The Value-Loading View**
  *   **Position:** Alignment is a learning theory problem.
  *   **Awkward Commitment:** Morality is simple enough to be reliably learned by gradient descent on current architectures.

  **Leaf 5: The Inner Alignment (Deceptive) View**
  *   **Position:** Alignment is about preventing mesa-optimizers.
  *   **Awkward Commitment:** We must solve advanced deception before we can deploy anything economically useful.

  **Leaf 6: The Principal-Agent Governance View**
  *   **Position:** Alignment is a single-lab regulatory problem.
  *   **Awkward Commitment:** Regulating one lab is sufficient to prevent global systemic risk.

  **Leaf 7: The Multi-Agent Coordination View**
  *   **Position:** Alignment is about AI-AI negotiation.
  *   **Awkward Commitment:** AIs can negotiate peace treaties without human intervention or oversight.

  **Leaf 8: The Structural/Incentives View**
  *   **Position:** Alignment is about ownership of the training signal.
  *   **Awkward Commitment:** Capitalism can be patched to align superintelligence without changing the profit motive.

  ***

  ### Analysis of Separations and Gaps

  **Pairs the Tree Cannot Separate**
  *   **Leaf 3 (Containment) & Leaf 5 (Inner Alignment):** Both path through "Agential" difficulty and often converge on "don't deploy." The tree separates them by *locus* (Outer specification vs. Inner heuristic), but in practice, both camps advocate similar safety protocols (evals, monitoring), making them hard to distinguish operationally without probing their beliefs about *where* the deception originates.
  *   **Leaf 6 (Principal-Agent) & Leaf 8 (Structural):** Both path through "Context." The tree separates them by Scope (Single vs. Eco), but a single dominant lab effectively *creates* an ecosystem of one. If a participant believes one lab will win permanently, these leaves collapse into the same policy prescription.

  **Unoccupied Branch Combinations**
  *   **Node 6 (Singleton) + Node 7 (AI-AI Coordination):** *Unattractive.* If there is only one system, it has no peers to coordinate with; this combination implies preparing for multi-agent dynamics in a singleton world, which is incoherent.
  *   **Node 3 (Outer) + Node 5 (Hide Goals):** *Incoherent.* If the failure is purely underspecified objectives (Outer), the system isn't hiding goals; it's optimizing the wrong ones. Hiding goals implies an internal heuristic divergence (Inner).
  *   **Node 2 (Context) + Node 5 (Hide Goals):** *Unexplored.* This would imply the risk is purely about deployment incentives, but the mechanism is internal deception. Most "Context" folks argue incentives drive behavior directly, bypassing the need for a deceptive inner heuristic theory.

  **On the "One Problem or Several" Meta-Question**
  *   **Root Cause:** The tree separates root causes at **Node 2** (Cognition vs. Context) and **Node 3** (Outer vs. Inner). Positions on different branches here do *not* share a root cause.
  *   **Solution:** The tree separates solutions at **Node 4, 5, and 7**. Positions on different branches here do *not* share a solution space (e.g., Engineering vs. Coordination).
  *   **Shared Name:** Positions that land on different leaves but share a path up to **Node 1** (e.g., Leaf 2 and Leaf 5) share the name "Alignment" and the belief that a target exists, but disagree on everything else. This captures the "just share a name" disagreement.
