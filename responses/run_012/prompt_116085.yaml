answer: |-
  **THE LONDON ASSOCIATION FOR EMPIRICAL CONTINUITY**

  **PROSPECTUS AND SCHEDULE OF WORKING METHODS (1882)**

  **I. Objects of the Association**
  1. To investigate, by means of strict observation and record-keeping, those phenomena which suggest the persistence of individual consciousness following somatic death.
  2. To determine whether such persistence, if established, offers a empirical solution to the dualism of practical reason recently highlighted by Mr. H. Sidgwick. It is the view of the Founders that if the agent's ultimate interest coincides with universal good in a post-mortem state, the current standoff between egoism and utilitarianism may be resolved as a matter of fact rather than philosophy.

  **II. The Scale of Probative Value**
  All testimony gathered by agents shall be categorised according to the following Ladder of Evidence:
  1. **Mere Coincidence:** Events aligning with subjective expectation without causal link.
  2. **Subjective Impression:** A single witness reporting a sensation of presence with no external corroboration.
  3. **Uncorroborated Testimony:** A witness reporting specific information unknown to them, lacking independent verification.
  4. **Corroborated Testimony:** Multiple independent witnesses reporting identical phenomena under controlled conditions.
  5. **Verifiable Communication:** Information conveyed via medium or apparition regarding facts unknowable to the living, subsequently verified by documentary record or third-party confession.

  **III. Settlement of the Practical Question**
  It is resolved that only Evidence of the Fifth Rung shall be deemed sufficient to settle the Practical Question. Lower rungs may suffice for general curiosity or publication in periodicals, but the ethical impasse regarding the rationality of virtue requires data of the highest order. A mere feeling of survival is insufficient to restructure the moral law.

  **IV. Sub-Committee on Discontinuous Utterances**
  A specialised Sub-Committee is hereby formed to collate messages received in fragments across different mediums. Where one automatist writes "The..." and another, in Glasgow, writes "...Ledger is...", these shall be filed under *Pending Synthesis*. Members are reminded that partial sentences regarding bank passwords or hidden wills are of greater utility than partial sentences regarding divine love.

  **V. Funding and Donor Stipulations**
  The Association acknowledges the generous grant of £500 from Sir Malcolm Croft. It is noted that Sir Malcolm's donation is contingent upon all annual reports describing the work as "The Reconciliation of Duty and Interest." The Secretary finds this phrasing metaphysically loaded and not strictly observational, but agrees to its inclusion on the ledger header to secure the funds. Members are asked not to query the phrase during public lectures.

  **VI. Contingencies Regarding Negative Results**
  Should the Association fail to produce Fifth Rung Evidence within a period of ten years, the following protocols apply:
  1. The question of survival shall be marked *Non Proven*, not *False*.
  2. Regarding the moral standoff: It is the opinion of the Committee that the rational obligation to be virtuous may be held in abeyance pending further data. However, members are advised not to publicise this suspension, as it may encourage untoward behaviour in the interim.
  3. If the evidence never comes, the Society shall continue to meet quarterly, on the presumption that the absence of evidence is not evidence of absence, and that the budget for séance room rental remains approved.

  **VII. General Conduct**
  Members must refrain from expressing personal hope during data collection. While it is understood that the success of this enterprise would validate the moral life as prudentially sound, agents must record apparitions with the same detachment used for recording barometric pressure.

  *Signed,*
  *Arthur P. Wembury, Hon. Sec.*
  *London, 14 November 1882*
