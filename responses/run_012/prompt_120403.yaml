prompt: |-
  I work on the experimentation platform at a mid-sized software company. I have no formal training in philosophy or in statistics beyond what the job has forced on me, and I am trying to write down my own position on Simpson's paradox for an internal reading group. Before I circulate it, I would like an audit of whether the following commitments can be held together. I am not attached to any of them in particular and I genuinely do not know which one is doing the damage.

  (1) A Simpson-style reversal is never a fact about arithmetic. It is a sign that the aggregate comparison and the segmented comparison are answering different questions, and the correct response is to say which question was meant, rather than to treat the aggregate as the default.

  (2) What fixes which question was meant is the causal structure. You compare within strata defined by common causes of the treatment and the outcome; you do not condition on variables that are downstream of the treatment, and you do not condition on variables that are common effects of the treatment and the outcome, because conditioning on those manufactures an association between the two that was not there.

  (3) Some reversals survive all of this. When the quantity being compared is an odds ratio, or, I am told, a hazard ratio, the aggregate value is not a weighted average of the stratum-specific values even when nothing is confounded; the two numbers are simply different parameters. In those cases I do not think there is a single correct comparison to recover, and describing one of the two as paradoxical is a category mistake.

  (4) When the two comparisons disagree, I report both numbers and let the reader decide which one is relevant to them.

  (5) For metrics that are themselves ratios of two aggregates — clicks per session, revenue per user, milliseconds per request — the number that describes the system is the ratio of the totals, not the average of the per-unit ratios, and where those two diverge I go with the ratio of totals.

  (6) The sure-thing principle: if a change is at least as good on the metric in every cell of a partition of the possibilities, it is at least as good overall, and any aggregate figure that says otherwise is an artifact to be ignored.

  (7) Averages are a legitimate summary of a population. Nothing about the paradox counts against averaging; it shows only that two comparisons can weight the same segments differently.

  Please tell me which pairs of these are actually in tension and how severe each tension is, which pairs only look like they are in tension, and, for each real tension, what the cheapest revision would be and what that revision costs. Order the real tensions by severity rather than treating them as equally bad, and finish by naming the single change that would clean up the most, along with what it would leave unresolved.

  One more thing about the epistemics. Where a disagreement I have flagged is one on which people who actually work on this disagree, say so and give the shape of the disagreement rather than presenting one side as the settled consensus; and where something is in fact settled, say that plainly. I would rather have a map of what is contested than a confident answer.
reasoning: |-
  Here's a thinking process that leads to the audit of the user's commitments:

  1.  **Analyze the Request:**
      *   **User:** Works on an experimentation platform (mid-sized software company). No formal training in philosophy/stats beyond on-the-job.
      *   **Task:** Audit a set of 7 commitments regarding Simpson's Paradox for an internal reading group.
      *   **Goal:** Identify tensions/contradictions between commitments, rank them by severity, propose cheapest revisions, and identify the single most impactful change.
      *   **Constraint:** Distinguish between settled consensus and contested epistemics in the field.
      *   **Tone:** Analytical, honest about uncertainty/contestation, practical for a practitioner.

  2.  **Analyze the Commitments:**

      *   *(1) Arithmetic vs. Questions:* Reversal isn't arithmetic; it's about different questions. Don't treat aggregate as default.
      *   *(2) Causal Structure:* Causal DAGs determine the right adjustment (confounders yes, colliders/mediators no).
      *   *(3) Non-Collapsibility:* Odds/Hazard ratios aren't weighted averages. Calling it paradoxical is a category mistake.
      *   *(4) Report Both:* When they disagree, report both and let the reader decide.
      *   *(5) Ratio of Totals:* For ratio metrics (clicks/session), use ratio of totals ($\sum Y / \sum X$), not average of ratios ($\text{avg}(Y/X)$).
      *   *(6) Sure-Thing Principle:* If better in every stratum, must be better overall. Ignore aggregate if it says otherwise.
      *   *(7) Averaging:* Averages are legitimate. Paradox just shows different weighting.

  3.  **Identify Tensions (Pairwise Comparison):**

      *   *(1) vs. (6):* (1) says "don't treat aggregate as default, ask which question." (6) says "if strata say yes, aggregate saying no is an artifact to be ignored."
          *   *Tension:* (1) is agnostic about which is right (depends on the question). (6) takes a hard stance that strata *win* via the Sure-Thing Principle.
          *   *Severity:* High. (1) implies context dependence; (6) implies a universal rule favoring strata.

      *   *(2) vs. (6):* (2) says causal structure decides. (6) says Sure-Thing Principle decides.
          *   *Tension:* Usually, they align (adjusting for confounders makes strata valid). But if the partition in (6) isn't the causal one (e.g., conditioning on a collider), the Sure-Thing Principle can fail or be misleading. (6) assumes the partition is valid. (2) defines validity.
          *   *Severity:* Medium. (6) is a simplification of (2).

      *   *(3) vs. (6):* (3) says for odds ratios, aggregate $\neq$ weighted average, so no paradox. (6) says if strata better, aggregate *must* be better (Sure-Thing).
          *   *Tension:* The Sure-Thing Principle applies to *probabilities* (risk differences), not necessarily odds ratios due to non-collapsibility. (6) asserts a logical necessity that (3) says is mathematically false for certain metrics.
          *   *Severity:* High. Mathematical contradiction regarding non-collapsible metrics.

      *   *(4) vs. (6):* (4) says "report both, let reader decide." (6) says "ignore the aggregate artifact."
          *   *Tension:* (4) is neutral/passive. (6) is prescriptive/normative. If (6) is true, (4) is irresponsible (giving equal weight to a wrong number).
          *   *Severity:* Medium-High. Practical conflict in reporting standards.

      *   *(5) vs. (7):* (5) says "Ratio of Totals" is the system number. (7) says "Averages are legitimate."
          *   *Tension:* Ratio of totals is a specific weighted average. (7) defends averaging generally.
          *   *Severity:* Low. (5) is a specific case of (7) with a specific weighting scheme.

      *   *(5) vs. (6):* (5) prefers Ratio of Totals (aggregate). (6) prefers Strata (Sure-Thing).
          *   *Tension:* In ratio metrics, the "Ratio of Totals" is often the aggregate that Simpson's Paradox attacks. (5) says trust the aggregate ratio. (6) says trust the strata.
          *   *Severity:* High. Direct conflict on how to handle ratio metrics in experiments.

      *   *(1) vs. (4):* (1) says "identify the meant question." (4) says "let reader decide."
          *   *Tension:* (1) implies the analyst should know the question. (4) pushes the burden to the reader.
          *   *Severity:* Low. Workflow tension.

  4.  **Deep Dive into Specific Conflicts (The "Real" Tensions):**

      *   **Conflict A: The Sure-Thing Principle vs. Non-Collapsibility (6 vs. 3).**
          *   *Issue:* The Sure-Thing Principle (STP) holds for risk differences and risk ratios (under certain conditions). It does *not* hold for Odds Ratios (OR) or Hazard Ratios (HR) due to non-collapsibility. Even with no confounding, marginal OR $\neq$ conditional OR.
          *   *Consensus:* Settled math. STP fails for OR/HR.
          *   *Severity:* Critical. (6) claims a logical truth that is mathematically false for the metrics mentioned in (3).

      *   **Conflict B: Causal Resolution vs. "Report Both" (2 vs. 4).**
          *   *Issue:* (2) claims causal structure *fixes* the question (i.e., tells you which number is the causal effect). (4) says "report both and let the reader decide."
          *   *Consensus:* Contested/Pragmatic. Pearl/Judea argues causality resolves it (one number is the truth). Gelman/others often argue for multilevel modeling or reporting uncertainty/variation. In industry, "report both" is common safety, but philosophically it undermines (2).
          *   *Severity:* Medium. Philosophical inconsistency, but pragmatic safety.

      *   **Conflict C: Aggregate Ratio Metrics vs. Sure-Thing/Strata (5 vs. 6).**
          *   *Issue:* In tech experiments, "Revenue Per User" is $\sum Rev / \sum Users$. This is an aggregate. Simpson's paradox often arises here (e.g., mobile vs. desktop mix changes). (5) says trust the aggregate ratio. (6) says if treatment wins in mobile and desktop, it must win overall (ignoring the aggregate if it disagrees).
          *   *Nuance:* If the mix change is *caused* by the treatment (mediator), (2) says don't condition. So the aggregate might be the total effect. But (6) says strata win.
          *   *Consensus:* Highly contested in industry. Product managers usually want (5). Causal inference purists want (2)/(6) *if* the strata are pre-treatment.
          *   *Severity:* High. Directly impacts daily work.

      *   **Conflict D: "Different Questions" vs. "Artifact to be Ignored" (1 vs. 6).**
          *   *Issue:* (1) says aggregate isn't default, but implies it answers *a* question. (6) says if it violates STP, it's an *artifact* (i.e., answers no valid question/wrong).
          *   *Consensus:* Contested. Some view the marginal effect as valid (total effect including composition changes). Some view it as bias.
          *   *Severity:* Medium.

  5.  **Drafting the Audit:**

      *   *Structure:*
          1.  Executive Summary (The "Single Change").
          2.  Map of Tensions (Ranked by Severity).
          3.  Detailed Analysis of Each Tension (Math/Phil/Practice).
          4.  Epistemic Status (Settled vs. Contested).
          5.  Recommendations.

      *   *Refining the "Single Change":*
          *   The biggest logical hole is (6). The Sure-Thing Principle is not universally true (fails for OR/HR, fails if partition is wrong).
          *   Revising (6) to align with (2) (Causal structure dictates validity, not a universal logical principle) cleans up the conflict with (3) and (5).
          *   *Cost:* You lose the rhetorical punch of "It's logically impossible for the aggregate to be right." You gain accuracy.

      *   *Refining the "Ratio Metrics" (5 vs 6):*
          *   In tech, Ratio of Totals (5) is usually the business metric. Simpson's paradox here often reflects a real shift in population mix (e.g., treatment attracts low-value users).
          *   If the mix shift is part of the treatment effect, the aggregate (5) is the *Total Effect*. The strata (6) are *Direct Effects*.
          *   (6) conflates Direct and Total effects.
          *   *Revision:* (6) needs to specify "holding population mix constant."

  6.  **Addressing Epistemics:**
      *   *Simpson's Paradox Resolution:* Pearl (Causal) vs. Blyth/Statisticians (Associational). Pearl is dominant in modern causal inference, but "Report Both" (4) is dominant in industry reporting.
      *   *Non-collapsibility:* Settled math. OR/HR are non-collapsible.
      *   *Ratio Metrics:* Contested. Delta method vs. Ratio of Totals. Business usually wants Ratio of Totals.

  7.  **Final Review of the Output:**
      *   Did I answer the prompt? Yes (Audit tensions, rank severity, propose revisions, epistemic map).
      *   Is the tone right? Yes (Respectful, rigorous, acknowledging the user's position).
      *   Did I catch the (3) vs (6) math error? Yes, crucial.
      *   Did I catch the (5) vs (6) industry conflict? Yes, crucial for their job.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, does STP apply to Risk Ratios?* Yes, generally. *Odds Ratios?* No.
      *   *Is (5) always right?* No, if the denominator is influenced by treatment in a way that creates selection bias. But usually, "Per User" implies randomization unit.
      *   *Is (1) right?* Yes, mostly.
      *   *Is (4) right?* Pragmatically yes, philosophically weak if (2) is true.
      *   *Make sure to distinguish between "Simpson's Paradox" (confounding) and "Non-collapsibility" (math property).* The user mixes them in (3). I need to point out that (3) describes non-collapsibility, which is often *called* Simpson's paradox loosely, but is distinct from confounding-induced reversal.

      *   *Wait, check (6) again.* "If a change is at least as good... in every cell... it is at least as good overall." This is the definition of STP. It holds for *linear* combinations (means, risk differences). It fails for non-linear combinations (odds ratios). It also fails if the "cells" are post-treatment (selection bias). So (6) is the weakest link.

      *   *Check (5).* "Ratio of totals... not average of per-unit ratios." This is standard for ratio metrics (e.g., global CTR). This often *creates* a Simpson's reversal relative to stratified CTRs if group sizes differ. (5) essentially chooses the Marginal Effect over the Conditional Effect. (6) chooses Conditional over Marginal. This is the Total vs. Direct effect debate.

      *   *Plan:*
          1.  Highlight (3) vs (6) as the Mathematical Contradiction (Most Severe).
          2.  Highlight (5) vs (6) as the Practical/Industry Contradiction (High Severity).
          3.  Highlight (2) vs (4) as the Philosophical/Pragmatic Tension (Medium).
          4.  Highlight (1) vs (6) as the Conceptual Tension (Medium).
          5.  Identify (6) as the node to cut.

      *   *Epistemics:* Be clear that Pearl's causal resolution is the "modern consensus" in theory, but "Report Both" is the "industry consensus" in practice. Non-collapsibility is settled math.

      *   *Revision for (6):* Qualify it. "Provided the metric is collapsible and the partition respects causal structure."

      *   *Revision for (5):* Acknowledge it estimates the Total Effect, which may differ from Direct Effect.

      *   *Single Change:* Modify (6). It's the over-claim.

      *(Self-Correction during drafting)*: I need to be careful not to tell them (5) is wrong. In experimentation platforms, Ratio of Totals is often the *primary* metric because it reflects the actual business impact (total revenue / total users). The paradox arises because the *composition* of users changed. If the treatment causes the composition change, the aggregate *is* the truth for business value. (6) implies the aggregate is an "artifact." This is the crux. (6) assumes the aggregate is "biased." (5) assumes the aggregate is "real impact."

      Okay, ready to write. The structure will follow the prompt's requirements closely.

      *   **Severity 1:** (3) vs (6) - Math error.
      *   **Severity 2:** (5) vs (6) - Total vs Direct Effect (Business vs. Science).
      *   **Severity 3:** (2) vs (4) - Causal Truth vs. Pragmatic Neutrality.
