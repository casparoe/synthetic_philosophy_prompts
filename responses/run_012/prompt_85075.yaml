answer: |-
  Here is a teaching plan designed for a 75-minute graduate seminar. It prioritizes student discovery of the argument structure over content delivery.

  ### Session Overview
  **Goal:** Students reconstruct Maimonides' "concession" argument from the internal logic of the text, rather than receiving it as a historical fact.
  **Core Text:** *Guide of the Perplexed* III:32 (with optional reference to III:46 for the case study).
  **Audience:** Philosophy of Religion grad students (competent in argument, zero rabbinics).

  ---

  ### Part 1: The Preconditions (0–15 mins)
  **Objective:** Establish the theological constraints that make "concession" a necessary move rather than a failure.

  **Board Work:** Write three propositions. Ask students to identify which two Maimonides is committed to, and where the tension lies.
  1.  **Divine Immutability:** God's will and knowledge do not change in response to time.
  2.  **Divine Wisdom:** God does not command futile or meaningless acts.
  3.  **Human Situatedness:** Human beings cannot abruptly abandon deep-seated cultural habits without psychological rupture.

  **Discussion Prompt:** "If you hold 1 and 2, how do you explain the existence of a ritual system (sacrifice) that the prophets later seem to devalue? If you hold 1 and 3, does God compromise His wisdom?"

  **Instructor Note:** Do not solve this yet. You are building the "Concession" concept. For "concession" to mean anything philosophically, it cannot be God changing His mind (violates 1) and it cannot be God commanding nonsense (violates 2). It must be a *pedagogical necessity* born of (3).

  **Head Off Misconception:** "So the Israelites were primitive."
  *   **Intervention:** When this arises, pivot to *habit*, not *capacity*. Maimonides isn't saying they were cognitively inferior; he's saying they were culturally habituated. Use the analogy of weaning a child (which Maimonides uses). A weaned child isn't "stupider" than a nursing infant; they are at a different stage of development.

  ---

  ### Part 2: The Case Study (15–35 mins)
  **Objective:** Use a concrete example to ground the abstract theory of concession.

  **The Choice:** **The Passover Lamb (Korban Pesach).**
  **Why this case?**
  *   **It Has:** A direct, explicit pagan parallel (Egyptian worship of the ram/Aries). Maimonides explicitly cites this in *Guide* III:46. It shows the "commandeering" mechanism clearly: take the object of their idolatry and turn it into the vehicle of their liberation.
  *   **It Does Not Have:** The ethical baggage of the **Binding of Isaac (Akedah)**.
      *   *Why not the Akedah?* The Akedah is a narrative test of *one* man's faith, not a legal code for a nation. It raises the problem of child sacrifice (which Maimonides vehemently opposes) and distracts into Kierkegaardian/ethical territory. You need an *institutional* case, not a *narrative* one. The Passover Lamb is institutional, collective, and explicitly anti-idolatrous in Maimonides' reading.

  **Activity:** Distribute a short excerpt from *Guide* III:46 regarding the Passover Lamb.
  **Task:** "Map the transformation. What is the *action*? What was the *original meaning* of that action in the surrounding culture? What is the *new meaning*? Where is the friction?"

  **Head Off Misconception:** "So the commandments were a ruse/deception."
  *   **Intervention:** Ask: "If I give a recovering alcoholic a non-alcoholic beer, am I deceiving them?" Distinguish between *deception* (hiding the truth) and *accommodation* (making the truth digestible). The command is real; the *reason* for the command is historical.

  ---

  ### Part 3: The Distinction Workshop (35–60 mins)
  **Objective:** Test the limits of the "concession" model using your three categories. This is the "you talk, I listen" section.

  **Board Work:** Write your three definitions clearly.
  1.  **Therapy:** The law retrains a desire that would otherwise be spent on idols. (Goal: Cure the desire).
  2.  **Quarantine:** The law leaves the practice standing but redirects it, containing the damage. (Goal: Manage the risk).
  3.  **Seedbed:** The concession exists so that abolishing the practice becomes thinkable later. (Goal: Obsolescence).

  **Prompt:** "Maimonides says sacrifice was commanded because 'human nature does not suddenly change.' Which of these three models best fits that claim? Can they all be true simultaneously, or do they contradict?"

  **Instructor Strategy (Silence & Nudge):**
  *   Let them fight over whether **Therapy** and **Seedbed** are distinct. (They are very close. *Therapy* implies the practice helps heal the urge; *Seedbed* implies the practice plants the seeds for its own destruction. Maimonides needs *Seedbed* to explain why prophets later say 'I desire mercy, not sacrifice.')
  *   Push them on **Quarantine**. If it's just quarantine, why not abolish it immediately if God is omnipotent? *Quarantine* admits the practice is dangerous but necessary. *Therapy* admits the practice is medicinal.
  *   **Crucial Nudge:** "Does Maimonides think sacrifice is *good* in itself, or *good* only relative to the alternative?" If it's only good relative to the alternative, **Quarantine** is the strongest fit. If it's good because it trains the mind, **Therapy** wins.

  **Head Off Misconception:** "So this is just apologetics."
  *   **Intervention:** Ask: "Does this explanation make the text *easier* to believe, or *harder*?" Apologetics usually smooths over difficulties. Maimonides introduces a historical contingency into Divine Law, which makes the Law *less* eternal in its form. That's a risk, not a shield.

  ---

  ### Part 4: The Esoteric Worry & Closing (60–75 mins)
  **Objective:** Acknowledge the "real Maimonides" debate without letting it derail the session, and test structural understanding.

  **The Esoteric Worry:**
  *   **Student Question:** "Is this what he *really* thought? Or is he hiding the fact that he thinks sacrifice is nonsense, but can't say that openly?"
  *   **Your Response:** "That is a major scholarly debate (e.g., Ravitzky vs. Kellner). But for our purposes: Does the argument *work* even if it's exoteric? If we take him at his word, does the logic hold? Let's treat the text as a philosophical claim, not a psychological profile of the author."
  *   **What to Refuse to Settle:** Do not let them debate whether sacrifice will return in the Messianic Era. Maimonides is ambiguous here (some texts say yes, some imply no). It's a rabbit hole. Say: "We are analyzing the *origin* of the law, not its *eschaton*. Bracket the Messianic question."

  **The Closing Question:**
  Do not ask "What did Maimonides say?" Ask a counterfactual that tests if they understand the *structure* of the concession argument.

  > **"If the Israelites had emerged from Egypt as a people with no prior exposure to sacrificial cults, what would the Mosaic Law have looked like regarding worship, according to this argument?"**

  *   **Why this works:**
      *   If they say "No sacrifice at all," they understand the concession is historical, not essential.
      *   If they say "Prayer immediately," they understand the *telos* (perfection of the mind).
      *   If they hesitate, they are still treating sacrifice as divinely essential rather than historically contingent.

  ---

  ### Critique of Your Distinction (Therapy / Quarantine / Seedbed)
  You asked if these are really three, or if one is doing all the work.

  1.  **Therapy vs. Seedbed:** These are functionally identical in this context. If the law retrains the desire (Therapy), the goal is presumably a state where the retraining isn't needed (Seedbed). I suspect your students will collapse these two.
  2.  **Quarantine:** This is the distinct one. Quarantine implies the practice is *inherently risky* or *sub-optimal* but must be tolerated. Therapy implies the practice is *instrumentally good* for growth.
  3.  **Which one does Maimonides need?** He needs **Therapy/Seedbed**. He argues that the *intent* of the Law is intellectual perfection. Sacrifice is a tool to get there from *here*.
  4.  **Which one will the text carry?** The text carries **Quarantine** most easily (restricting sacrifice to one place, limiting which animals). It carries **Therapy** via the "weaning" analogy. It struggles with **Seedbed** because Maimonides never explicitly says "Sacrifice will be abolished in the future."
  5.  **Advice:** Let them discover that **Therapy** and **Seedbed** might be the same category. If they do, push them: "If it's therapy, is the patient 'cured' when they stop sacrificing, or when they sacrifice with the right intention?" That distinction will save your tripartite model.

  ### Summary of Misconceptions to Monitor
  1.  **"Primitive Israelites":** Correct to "Habituated Humans." (Cultural inertia vs. Cognitive deficit).
  2.  **"Divine Deception":** Correct to "Divine Pedagogy." (Accommodation vs. Lying).
  3.  **"Apologetics":** Correct to "Philosophical Risk." (Making Law contingent on history is dangerous for traditionalism).
  4.  **"Divine Regret":** Correct to "Eternal Plan." (God planned the concession from the start; He didn't change His mind).

  ### Logistics Checklist
  *   **Handout:** *Guide* III:32 (selected paragraphs on "human nature does not suddenly change") + *Guide* III:46 (Passover Lamb paragraph).
  *   **Board:** Leave the three propositions (Part 1) and three distinctions (Part 3) up for the whole session.
  *   **Timekeeping:** Be ruthless on Part 1. If you lecture on the prerequisites, you lose Part 3. Let them struggle with the tension in the first 15 minutes.
