  Dear Colleague,

  I am writing to provide the concrete illustration you requested for your seminar on imprecise probability, specifically addressing the counterintuitive phenomenon where learning leads to a loss of precision. Imagine a quality-control engineer named Maya who oversees a production line for a critical medical component. Her target quantity is the probability that a specific unit, which we will call Unit One, is defective. She begins with a precise opinion on this matter, assigning a probability of exactly ten percent to the event that Unit One is defective. However, her uncertainty about the underlying process is represented not by a single probability distribution but by a set of two possible models regarding the machine's daily failure rate, which serves as the nuisance parameter. In the first model, which we might call the Stable Model, the machine's defect rate is constant throughout the day at exactly ten percent. In the second model, the Volatile Model, the defect rate fluctuates unpredictably between zero percent and twenty percent with equal probability, such that the long-run average rate remains ten percent.

  Both models satisfy the condition that the observation is conditionally independent of the target given the nuisance parameter, because in both cases, once the specific defect rate for the day is known, the status of Unit One is independent of the status of any other unit. Furthermore, both models agree on the unconditional probability of the observation, which is the event that a second unit, Unit Two, is found to be defective. In the Stable Model, the probability of observing a defect in Unit Two is simply the constant rate of ten percent. In the Volatile Model, the probability is the average of the possible rates, zero and twenty percent, which is also ten percent. Thus, before looking at Unit Two, Maya's opinion on Unit One is the single number 0.1 under both models, and her expectation of observing a defect in Unit Two is 0.1 under both models.

  The arithmetic of the widening occurs when Maya learns that Unit Two is indeed defective. Under the Stable Model, learning that Unit Two is defective provides no new information about the defect rate, since the rate is known to be constant, so her posterior probability that Unit One is defective remains ten percent. However, under the Volatile Model, observing a defect in Unit Two makes it more likely that the machine is operating in the high-rate state of twenty percent rather than the zero percent state. Specifically, applying Bayes' theorem to the Volatile Model updates the weight on the twenty percent rate, resulting in a posterior probability that Unit One is defective of twenty percent. Consequently, Maya's opinion about the target quantity shifts from the precise number 0.1 to the interval spanning from 0.1 to 0.2. This interval strictly contains the number she started with in the set-theoretic sense that her initial singleton opinion is a proper subset of her new interval opinion, representing a strict loss of precision.

  To make this widening matter in a practical decision, consider a bet that Maya evaluates by its worst-case expected value. Suppose she is offered a contract where she pays one hundred dollars now and receives one hundred and twelve dollars if Unit One is found to be good, meaning not defective. Before observing the status of Unit Two, her probability that Unit One is good is 0.9 under both models. The expected value of the contract is therefore one hundred and twelve times 0.9 minus one hundred, which equals a profit of eighty cents. Since the worst-case expected value is positive, she accepts the bet. After learning that Unit Two is defective, her probability that Unit One is good ranges from 0.8 to 0.9. Evaluating the contract by its worst-case expected value now requires using the lower bound of 0.8. The calculation becomes one hundred and twelve times 0.8 minus one hundred, which equals a loss of ten dollars and forty cents. Because the worst-case expectation has turned negative, she rejects the contract, despite the payoffs remaining unchanged and her having received what is typically considered useful information.

  The single feature of the setup that does the work is the heterogeneity of the nuisance parameter, specifically the uncertainty regarding the variance of the defect rate across the set of distributions. If her set of distributions is replaced by any one of its members, say just the Stable Model, the effect vanishes entirely because the posterior probability would remain identical to the prior, preserving precision. Similarly, if she were forced to adopt just the Volatile Model as her single truth, she would have a single precise posterior of 0.2, and while her opinion would change, it would not become imprecise. Finally, a defender of precise probabilities would argue that nothing like this can happen to a coherent agent because coherence requires the agent to collapse her uncertainty about the variance into a single hyper-prior distribution. They would contend that by maintaining a set of distributions rather than a single weighted average over the Stable and Volatile models, Maya is violating the principles of subjective expected utility, and that a truly coherent agent would integrate out the uncertainty about the machine's stability to produce a single posterior number, thereby rendering the dilation an artifact of representation rather than a feature of rational learning.

  Sincerely,

  Your Colleague
