answer: |-
  # Activity: The Verdict Protocol

  **Time:** 75 Minutes
  **Class Size:** 20 Students
  **Goal:** Experiential understanding of collective accuracy conditions and failure modes.

  ## Materials
  *   **20 Dice** (standard d6) or students' phones with a random number generator (1–6).
  *   **Scoreboard** (Whiteboard): Columns for "Round," "Truth," "Majority Vote," "Verdict," "Points."
  *   **Signal Cards** (Round 2 only): 20 slips of paper, prepared in advance (see Round 2 setup).
  *   **Timer.**

  ## Setup & Payoff (5 Minutes)
  1.  **Narrative:** The class is a "Super-Jury." There is a hidden Truth for each case: **Guilty (G)** or **Innocent (I)**.
  2.  **Signals:** Each juror receives private evidence. You tell them: "Your evidence is reliable 60% of the time. If the Truth is G, 60% of you will see signal 'G', 40% will see 'I' (and vice versa). Your signals are generated independently."
  3.  **Payoff:** The class shares a "Reputation Score" starting at **100**.
      *   If the **Majority Vote** matches the **Truth**: **+10 points**.
      *   If the **Majority Vote** mismatches the **Truth**: **-20 points**.
      *   *Stake:* If the score ends above 100, everyone gets full participation credit. If below, everyone writes a 500-word reflection on epistemic humility. (This creates low-stakes high-anxiety).
  4.  **Rule:** "Vote sincerely based on your private signal. Do not share signals until instructed."

  ## Round 1: The Independence Climb (20 Minutes)
  *Goal: Demonstrate accuracy improvement as N increases under independence.*

  1.  **Generate Signals:**
      *   Secretly flip a coin to set the **Truth** (e.g., Heads = Guilty). Write this down sealed.
      *   Instruct students: "Roll your die. If Truth is Guilty: 1–4 = Signal 'G', 5–6 = Signal 'I'. If Truth is Innocent: 1–4 = Signal 'I', 5–6 = Signal 'G'." (Do not reveal the Truth yet).
      *   Students roll privately and record their signal on a slip (G or I).
  2.  **Collect Votes:** Gather all 20 slips.
  3.  **Analyze N=1 (Individual Competence):**
      *   Pick one slip at random. Reveal signal vs. Truth.
      *   Ask: "If we relied on just this person, what are our odds?" (Answer: 60%).
      *   Tally how many of the 20 individuals were correct. It should be roughly 12/20 (60%).
  4.  **Analyze N=5 (Small Groups):**
      *   Divide the 20 slips into 4 groups of 5.
      *   Determine the Majority Vote for each group.
      *   Count how many groups got the Truth right. (Statistically likely 3 or 4 out of 4 groups).
  5.  **Analyze N=20 (Whole Class):**
      *   Take the Majority of all 20 slips.
      *   Reveal the Truth.
      *   Update Reputation Score (Likely +10).
  6.  **Observation:** Point out that while individuals were wrong ~40% of the time, the group of 20 was almost certainly right. Do not explain why yet.

  ## Round 2: The Common Cause Crash (20 Minutes)
  *Goal: Break the independence assumption.*

  1.  **Setup:** Tell students: "New case. Same reliability (60%), same payoff."
  2.  **The Trap:** Instead of dice, hand out the **Signal Cards** prepared in advance.
      *   *Preparation:* Create 4 distinct "Signal Profiles."
          *   Profile A (5 copies): 3 Correct, 2 Incorrect.
          *   Profile B (5 copies): 3 Correct, 2 Incorrect.
          *   Profile C (5 copies): 3 Correct, 2 Incorrect.
          *   Profile D (5 copies): 3 Correct, 2 Incorrect.
      *   *Crucial Twist:* In one of the profiles (say, Profile D), flip the ratio so it is **3 Incorrect, 2 Correct**.
      *   *Result:* 5 students (25% of the class) are systematically biased toward the wrong answer due to a common source error, while the rest are independent.
      *   *Alternative (Simpler):* All 20 students draw from the *same* small bag of 20 slips (12 Correct, 8 Incorrect) without replacement. This creates negative correlation, but to show *failure*, you need positive correlation.
      *   *Best Mechanism for Failure:* Tell them: "There is one Lead Investigator. They rolled the die once and emailed the result to all of you, but the email has 60% fidelity."
      *   *Execution:* Actually, just tell them: "For this round, you all share a common data source. Roll your die. If it's 1–4, your signal is the **Source Signal**. If 5–6, you get noise."
      *   *Wait, simpler:* **The Rumor.** Before they roll, announce: "Reliable leak suggests the Truth is Guilty." (This is false). Then have them roll. If the leak influences their interpretation, correlation spikes.
      *   *Strict Mechanism:* Use the **"Cluster" Method**. Prepare 4 envelopes. Inside each envelope are 5 identical slips.
          *   Envelope 1 (5 slips): "Guilty"
          *   Envelope 2 (5 slips): "Guilty"
          *   Envelope 3 (5 slips): "Guilty"
          *   Envelope 4 (5 slips): "Innocent"
          *   Truth is actually **Innocent**.
          *   Tell students: "Your signal accuracy is 60%." (This is a lie for this round, or rather, the *conditional independence* is broken).
          *   *Correction for Honesty:* Tell them: "Signals are generated by 4 independent witnesses, each speaking to 5 of you."
          *   If the 3 witnesses say "Guilty" and 1 says "Innocent", and Truth is Innocent, the majority (15 people) will vote Guilty.
          *   Because the 5 people hearing Witness A are perfectly correlated, the effective N is not 20, it is 4.
  3.  **Vote & Reveal:**
      *   Students vote based on slips.
      *   Majority will likely follow the 3 wrong witnesses (15 vs 5).
      *   Reveal Truth (Innocent).
      *   Update Score (-20).
  4.  **Observation:** The class was confident but wrong. The "N=20" advantage vanished.

  ## Round 3: The Social Cascade (15 Minutes)
  *Goal: Break sincerity/fixed competence via deliberation.*

  1.  **Setup:** New case. Dice again (Independent signals). Truth = Guilty.
  2.  **Deliberation:** Allow 5 minutes of open discussion before voting.
  3.  **The Seed:** Plant one confident student (or play the role yourself) to assert: "I have a method that guarantees 100% accuracy. My signal is Innocent." (Lie).
  4.  **Dynamic:** Watch for conformity. Students with "Guilty" signals may doubt themselves because someone claimed higher competence.
  5.  **Vote & Reveal:**
      *   If conformity works, the majority shifts to the confident liar.
      *   Update Score (Likely -20).
  6.  **Observation:** Individual competence ($p > 0.5$) degraded due to social pressure. Sincerity failed.

  ## Debrief: The Reveal (15 Minutes)
  1.  **Name the Theorem:** Introduce the **Condorcet Jury Theorem**.
  2.  **Map Round 1:**
      *   *Assumption:* Competence > 1/2 (60% dice rule).
      *   *Assumption:* Independence (Dice rolls don't affect each other).
      *   *Result:* As $N \to \infty$, Probability(Majority Correct) $\to 1$. You felt the "wisdom of crowds" emerge from noise.
  3.  **Map Round 2:**
      *   *Violation:* **Independence.**
      *   *Mechanism:* Common cause (shared witnesses/sources).
      *   *Result:* Effective group size was the number of sources (4), not jurors (20). Errors clustered. The theorem requires *conditional* independence given the truth.
  4.  **Map Round 3:**
      *   *Violation:* **Fixed Competence / Sincerity.**
      *   *Mechanism:* Deliberation changed individual $p$. Social proof lowered the competence of those with correct signals (they conform) or raised the weight of incorrect signals (confidence heuristic).
      *   *Result:* The "Average Competence" dropped below 1/2 or votes became correlated.
  5.  **Limitations (Crucial):**
      *   "This game is a model. Real juries don't roll dice. Competence isn't fixed. Independence is never perfect."
      *   "The theorem is asymptotic. With N=20, you can still lose (as you saw in Round 2/3). It guarantees probability, not outcome."
      *   "It assumes sincere voting. If you vote strategically (e.g., to signal virtue), the math breaks."

  ## Troubleshooting & Predictable Failures
  *   **"The Dice Are Rigged":** Students may suspect you manipulated Round 2/3 losses.
      *   *Fix:* In Round 1, let them roll their own dice. In Round 2, show the "Witness Envelopes" afterwards to prove the clustering.
  *   **"I Don't Care About Points":** If the payoff feels fake, they won't engage.
      *   *Fix:* Use the "Reflection Paper" threat. Upper-level students fear busywork more than point loss.
  *   **Round 1 Failure:** Even with $p=0.6$, N=20 has a ~5% chance of majority error.
      *   *Fix:* If the class loses Round 1, lean into it. "This is variance. The theorem is about probability, not destiny. Run it 100 times, you win 95."
  *   **Round 3 Success:** Sometimes deliberation *helps* (pooling information).
      *   *Fix:* If they get it right, ask: "Did you vote your signal, or did you vote the argument?" If they pooled info correctly, they violated the "private signal" constraint of the theorem, which is a valid critique of the model's realism.

  ## Limitations of the Activity
  *   **Asymptotics:** You cannot show $N \to \infty$. You only show $N=20$.
  *   **Causal Independence:** The game enforces independence mechanically (dice); real life requires social structures to ensure it.
  *   **Competence:** The game fixes $p=0.6$. In reality, $p$ varies per person and per case.
  *   **Binary Choice:** Real epistemology often involves multiple hypotheses or degrees of belief.

  Summary: This activity is meant to make them feel the fragility of collective intelligence when the hidden mathematical assumptions of independence and competence are silently violated.
