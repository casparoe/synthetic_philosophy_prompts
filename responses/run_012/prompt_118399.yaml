  **The Brinkmanship Paradox**

  The scorpion analogy models deterrence as a deliberate choice: "I do not sting because you will sting." This captures rational actor stability but fails to capture the brinkmanship paradox. Real nuclear deterrence often relies on the "threat that leaves something to chance," as Thomas Schelling described. Stability is not derived from perfect control, but from the shared fear that events might slip out of control. The scorpion picture implies a static equilibrium, ignoring the dynamic risk of escalation spirals where neither party desires war but both lose control of the ladder. By modeling the threat as a deliberate sting, the analogy obscures the accidental pathways to destruction that define modern risk. It suggests a stability that is too deliberate and too robust.

  **Conclusion and Better Analogy**

  His reassurance does not survive. The disanalogies regarding multipolarity, C2 fragility, and accident potential suggest the system is *more* fragile than the Cold War, not less. The scorpion model assumes a stability that relies on perfect rationality and bilateral simplicity, neither of which exists today.

  A better analogy for the multipolar case is: **Several blindfolded deputies in a dark room, each holding a detonator wired to a shared charge, connected by faulty telephones.**

