answer: |-
  # The Two Spheres Decision Tree

  This instrument is designed to navigate the metaphysical impasse of Max Black's two-sphere universe. It does not tell you which view is *correct*, but it will locate your intuitions within the logical space of the debate.

  To use this tree, start at **Node 1** and answer the question honestly based on your gut reaction to the thought experiments provided. Follow the arrow corresponding to your answer until you reach a **Leaf**.

  ### **Node 1: The Coherence Check**
  **Question:** Consider the description: *"A universe containing exactly two iron spheres, identical in all intrinsic respects, two miles apart, with nothing else."*
  When you try to imagine this, does the description feel **complete**, or does it feel like it is missing a fact (specifically, a fact about *which* sphere is *which*)?

  *   **A. It feels malformed/verbal:** The description seems to rely on our language ("two," "apart") importing distinctions that aren't in the reality. The question "are they distinct?" is just a question about how we choose to count, not about the world.
      *   → **Go to Leaf 1**
  *   **B. It feels complete:** The description tells you everything there is to know. There is no hidden "whichness" left out.
      *   → **Go to Node 2**
  *   **C. It feels incomplete:** There *must* be a fact about which sphere is which, even if the description doesn't state it. (Test: If an omnipotent being annihilated one sphere, would there be a fact about *which* one survived, even if we couldn't know it?)
      *   → **Go to Node 4**

  ---

  ### **Node 2: The Property Scope (Relational)**
  **Question:** In this two-sphere world, consider the property: *"Being two miles from a distinct iron sphere."*
  Does counting this **relational property** allow us to say the spheres are discernible (i.e., Sphere A has "being 2 miles from B" and Sphere B has "being 2 miles from A")?
  *(Hint: Consider a world with **three spheres in an equilateral triangle**. Does each have a unique relational profile there, or are they still symmetric?)*

  *   **A. Yes, relations count:** The spheres differ because they stand in different spatial relations to the *other* object.
      *   → **Go to Node 3**
  *   **B. No, relations don't count:** These are merely extrinsic Cambridge changes. For the Principle of Identity of Indiscernibles (PII) to be interesting, it must rely on **intrinsic** properties (color, mass, temperature). Since they share those, they are indiscernible.
      *   → **Go to Leaf 2**

  ---

  ### **Node 3: The Property Scope (Identity)**
  **Question:** You've accepted that relations can discern objects. Now consider the property: *"Being identical to Sphere A."*
  If we count **identity-involving properties** as genuine properties, does the Principle of Identity of Indiscernibles (PII) become trivially true?
  *(i.e., Is PII saved only because every object automatically has a unique property—being itself?)*

  *   **A. Yes, it trivializes PII:** PII is logically true, but only because "being identical to x" is a property. It doesn't tell us anything about the *nature* of the objects.
      *   → **Go to Leaf 3**
  *   **B. No, we need qualitative properties:** Identity properties are cheating. However, since you already accepted spatial relations (Node 2A), you believe the spheres are discernible via their **relational profiles** without needing primitive identity.
      *   → **Go to Leaf 4**

  ---

  ### **Node 4: The Ground of Distinction (Haecceity)**
  **Question:** You believe there is a fact about "which sphere is which" (Node 1C), even if they share all qualitative properties.
  What grounds this fact? Is it a **primitive "thisness"** (haecceity) attached to each sphere, or is it something else?
  *(Test: Imagine a **swapping mechanism** that exchanges the spheres every second. If there is no primitive thisness, is there any fact about "which one moved"?)*

  *   **A. Primitive Thisness:** Each sphere has a non-qualitative essence (a haecceity) that makes it *this* one rather than *that* one.
      *   → **Go to Node 5**
  *   **B. No Primitive Thisness:** There are no "essences." The distinctness is brute or structural.
      *   → **Go to Node 6**

  ---

  ### **Node 5: Modal Permutation (Haecceitism)**
  **Question:** Consider two possible worlds: **World 1** has the two spheres as described. **World 2** is exactly like World 1, except the **haecceities are swapped** (the "thisness" of Sphere A is now where Sphere B was, and vice versa).
  Are World 1 and World 2 **distinct possible worlds**?

  *   **A. Yes, they are distinct:** Swapping indiscernible things creates a new metaphysical possibility.
      *   → **Go to Leaf 5**
  *   **B. No, they are the same world:** Possibility is only defined up to qualitative structure. Swapping haecceities changes nothing real.
      *   → **Go to Leaf 6** *(Note: This position is often flagged as unstable; see Leaf Notes)*

  ---

  ### **Node 6: Ontological Status (Bundle vs. Substratum)**
  **Question:** You deny primitive thisness (Node 4B), but you still need to account for the "two-ness" of the spheres.
  Are the spheres **distinct substances** that happen to share properties, or are they merely **bundles of properties** located in different places?
  *(Test: Consider a world with **one sphere at the midpoint** of where the two spheres would be. Is that a different world from the two-sphere world, or just a different arrangement of the same "stuff"?)*

  *   **A. Bundles of Properties:** Objects are nothing over and above their properties. If the properties (including spatial relations) are symmetric, there is no deep "two-ness." The universe is really **one scattered object** with two lobes.
      *   → **Go to Leaf 7**
  *   **B. Distinct Substances:** There are two objects, but they lack primitive thisness. The Principle of Identity of Indiscernibles simply **fails**. Numerical distinctness does not require qualitative discernibility.
      *   → **Go to Leaf 8**

  ---

  ### **The Leaves**

  **Leaf 1: The Deflationist / Verbal Dispute**
  *   **Position:** The debate is malformed. "Distinctness" is a matter of conceptual counting, not metaphysical reality.
  *   **View on Black:** Black's scenario is linguistically misleading. There is no fact of the matter about "two" vs "one" independent of our descriptive framework.
  *   **Status:** Defended by some structuralists and verificationists.

  **Leaf 2: The Restricted PII Defender (Black's Target)**
  *   **Position:** PII is plausible only for **intrinsic, non-relational properties**.
  *   **View on Black:** Black successfully refutes the *unrestricted* PII. The spheres are distinct but qualitatively identical. PII should be abandoned or restricted to intrinsics.
  *   **Status:** This is the standard "Black's Victory" interpretation.

  **Leaf 3: The Trivialized Leibnizian**
  *   **Position:** PII is logically true, but only because **identity properties** ("being identical to x") count.
  *   **View on Black:** The spheres differ because A is A and B is B.
  *   **Status:** Often considered uninteresting. It saves the principle by making it tautological.

  **Leaf 4: The Relational Leibnizian**
  *   **Position:** PII is true because **relational properties** count.
  *   **View on Black:** The spheres are discernible because A is "2 miles from B" and B is "2 miles from A." They do not share *all* properties.
  *   **Status:** Common among those who want to save PII without trivializing it.

  **Leaf 5: The Haecceitist**
  *   **Position:** Objects have primitive **thisness** (haecceity) independent of their qualities.
  *   **View on Black:** The spheres are two because they possess distinct haecceities. Swapping them creates a genuinely different possible world.
  *   **Status:** Robust realist position. Commits you to distinct permuted worlds.

  **Leaf 6: The Anti-Haecceitist (Unstable)**
  *   **Position:** There is a fact about "which is which" (Node 1C), but permuting them does **not** create a new world (Node 5B).
  *   **View on Black:** Distinctness is real, but modal permutation is not.
  *   **Status:** **Flagged as Unstable/Empty.** It is difficult to maintain that haecceities exist (grounding distinctness) but that swapping them makes no modal difference. Most who answer Node 4A proceed to Node 5A.

  **Leaf 7: The Bundle Theorist (One Scattered Object)**
  *   **Position:** Objects are just bundles of properties. In a symmetric universe, there is only **one object** with disconnected parts.
  *   **View on Black:** Black is wrong to call them "two spheres." It is one universe-sized object with two lobes.
  *   **Status:** Defended by some radical bundle theorists. Avoids PII violation by denying there are two subjects.

  **Leaf 8: The Brute Distinctness Theorist (PII Falsist)**
  *   **Position:** Numerical distinctness is primitive and requires **no grounding** in properties or haecceities.
  *   **View on Black:** There are two spheres. They share all properties. They have no haecceities. PII is simply false.
  *   **Status:** A hard-nosed realist view. Accepts brute facts about identity.

  ---

  ### **Notes for the Group**

  1.  **On Leaf 6 (The Unstable View):** If someone lands here, ask them: "If the haecceities swap, what changed?" If they say "Nothing," ask "Then why did you say there was a fact about which was which at Node 1?" This view often collapses into Leaf 1 (Deflationist) or Leaf 5 (Haecceitist).
  2.  **On Leaf 7 (Bundle Theory):** This view struggles with the **Annihilation Case**. If the "one scattered object" loses a lobe, did the object survive? If yes, how is it the same bundle if half the properties are gone? This is a good stress test for the position.
  3.  **On Leaf 2 vs. Leaf 8:** Both agree PII is false (in the unrestricted sense). The difference is that Leaf 2 thinks PII *should* have been restricted to intrinsics (saving the spirit of the principle), while Leaf 8 thinks distinctness needs no qualitative ground at all.
  4.  **On the "Midpoint" Case:** If you are at Leaf 7, the world with one sphere at the midpoint is just a *contraction* of the one scattered object. If you are at Leaf 8, it is a genuinely different world (two objects vs one). This is a quick diagnostic to separate Bundle Theorists from Brute Distinctness theorists.
