  **NEXUS DYNAMICS | INTERNAL COMMS | RESTRICTED**
  **DOC ID: TC-909 | VERSION 4.2**
  **SUBJECT: Truthful Communication Playbook**

  **1.0 Mission Statement**
  Nexus Dynamics commits to Radical Accuracy. We do not lie. However, we recognize that information asymmetry is a legitimate market advantage. Our goal is to maximize shareholder value while maintaining literal veracity. All external statements must pass the "Fact-Check Survival Test" (FCST). If a statement is literally true, it is compliant, regardless of audience interpretation. The burden of precision lies equally on the speaker and the listener.

  **2.0 Classification of Assertions**
  To streamline approval, all outgoing communications must be categorized into one of three Truth Tiers. Misclassification is a reportable offense.

  **2.1 Tier 1: Flat False Assertion (Code: RED)**
  *Definition:* A statement where the propositional content contradicts known internal data.
  *Example:* "The battery lasts 48 hours" (Internal data: 12 hours).
  *Protocol:* **STRICTLY PROHIBITED.** Violation results in immediate termination. There is no strategic value in being provably wrong. A lie is a vulnerability; a misleading truth is a shield.

  **2.2 Tier 2: True Assertion/False Implicature (Code: AMBER)**
  *Definition:* A statement that is literally true but designed to trigger a Gricean implicature known to be false. This relies on the audience assuming the speaker is being cooperative and informative.
  *Example:* "The battery outperforms competitors in high-drain scenarios" (Internal data: It outperforms only one specific competitor in a specific temperature range).
  *Protocol:* **ENCOURAGED.** Requires VP-level sign-off. Legal must confirm the literal truth holds under forensic scrutiny. The burden of correction lies with the listener to request clarification. If a journalist fails to ask a follow-up question, the implicature stands as market consensus. We do not correct assumptions we did not verbally instantiate.

  **2.3 Tier 3: True Assertion/Unintended Inference (Code: GREEN)**
  *Definition:* A statement that is true, where the speaker anticipates the audience may draw a false conclusion, but claims no intent to mislead. The "We Never Said That" tier.
  *Example:* "Our devices are safe" (Internal data: Safe under normal conditions; unsafe if submerged).
  *Protocol:* **DEFAULT.** No special sign-off required. If challenged, Comms must express surprise at the audience's interpretation. "We simply stated our commitment to safety protocols." This tier offers maximum plausible deniability with minimum administrative friction. It is the preferred method for addressing latent defects.

  **3.0 The Deniability Ladder (Sidebar)**
  *Scenario:* Internal testing shows the X-100 processor throttles performance by 40% when temperatures exceed 30°C.
  *Goal:* Communicate performance without acknowledging throttling.

  *   **Rung 1 (High Risk):** "The X-100 maintains optimal speeds." (False: speeds drop. **RED**)
  *   **Rung 2 (Tier 2 - AMBER):** "The X-100 dynamically adjusts clock speeds to preserve longevity." (True: It throttles. Implicature: It gets faster or stays same. **Requires VP Sign-off**)
  *   **Rung 3 (Tier 3 - GREEN):** "The X-100 is engineered for sustained operation." (True: It operates sustainably. Inference: It operates at peak performance. **No Sign-off**)

  **4.0 Compliance & Ethics**
  All Tier 2 communications must be logged in the Narrative Architecture Dashboard. Tier 3 communications need not be logged unless queried by regulatory bodies. Remember: Silence is not a statement. Omission is not deception. The audience brings their own expectations to the text; we merely provide the text. If the text is accurate, the communication is successful.

  ______________________
  *Footnote 1: Ethics Review Board Comment*
  *While some philosophical frameworks might suggest that the moral weight of an utterance is distributed between its semantic content and its pragmatic effect, thereby potentially equating the harm of misleading with the harm of lying, such frameworks often rely on subjective assessments of listener cognition which fall outside the scope of objective compliance metrics currently enforced by Nexus Dynamics Legal. Consequently, no actionable deviation from Protocol 2.2 is recommended at this time.*
  ______________________

  **5.0 Conclusion**
  Truth is a constraint, not a goal. Operate within the constraint. Do not break the letter of the law, even if the spirit is evacuated. If a stakeholder feels deceived, refer them to the transcript. The transcript is the only reality we endorse.
