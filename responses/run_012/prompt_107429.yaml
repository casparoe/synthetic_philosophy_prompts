      *   **Rung 3 (Tier 3 - GREEN):** "The X-100 is engineered for sustained operation." (True: It operates sustainably. Inference: It operates at peak performance.)

      **4.0 Compliance & Ethics**
      All Tier 2 communications must be logged in the Narrative Architecture Dashboard. Tier 3 communications need not be logged unless queried by regulatory bodies. Remember: Silence is not a statement. Omission is not deception. The audience brings their own expectations to the text; we merely provide the text.

