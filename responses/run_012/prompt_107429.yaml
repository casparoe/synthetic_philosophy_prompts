      **NEXUS DYNAMICS | INTERNAL COMMS | RESTRICTED**
      **DOC ID: TC-909 | VERSION 4.2**
      **SUBJECT: Truthful Communication Playbook**

      **1.0 Mission Statement**
      Nexus Dynamics commits to Radical Accuracy. We do not lie. However, we recognize that information asymmetry is a market advantage. Our goal is to maximize shareholder value while maintaining literal veracity. All external statements must pass the "Fact-Check Survival Test" (FCST). If a statement is literally true, it is compliant, regardless of audience interpretation.

      **2.0 Classification of Assertions**
      To streamline approval, all outgoing communications must be categorized into one of three Truth Tiers.

      **2.1 Tier 1: Flat False Assertion (Code: RED)**
      *Definition:* A statement where the propositional content contradicts known internal data.
      *Example:* "The battery lasts 48 hours" (Internal data: 12 hours).
      *Protocol:* **STRICTLY PROHIBITED.** Violation results in immediate termination. There is no strategic value in being provably wrong.

      **2.2 Tier 2: True Assertion/False Implicature (Code: AMBER)**
      *Definition:* A statement that is literally true but designed to trigger a Gricean implicature known to be false. This relies on the audience assuming the speaker is being cooperative and informative.
      *Example:* "The battery outperforms competitors in high-drain scenarios" (Internal data: It outperforms only one specific competitor in a specific temperature range).
      *Protocol:* **ENCOURAGED.** Requires VP-level sign-off. Legal must confirm the literal truth holds under forensic scrutiny. The burden of correction lies with the listener to request clarification. If a journalist fails to ask a follow-up question, the implicature stands as market consensus.

      **2.3 Tier 3: True Assertion/Unintended Inference (Code: GREEN)**
      *Definition:* A statement that is true, where the speaker anticipates the audience may draw a false conclusion, but claims no intent to mislead. The "We Never Said That" tier.
      *Example:* "Our devices are safe" (Internal data: Safe under normal conditions; unsafe if submerged).
      *Protocol:* **DEFAULT.** No special sign-off required. If challenged, Comms must express surprise at the audience's interpretation. "We simply stated our commitment to safety protocols." This tier offers maximum plausible deniability with minimum administrative friction.

