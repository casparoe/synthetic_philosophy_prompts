      *   **Input Material:** The user provides a summary of Darwin's position (continuity of moral sense, social instincts, group selection, worry about civilization blunting selection, rejection of Wallace's spiritualism) and four specific debates (Gene-centered view, Debunking arguments, Adaptationist storytelling, Moral bioenhancement).
      *   **Output Requirements for each debate:** (a) Predicted verdict, (b) Specific commitments/inference tightness, (c) Strongest reason the prediction is wrong, (d) Distinction between "read modern literature" vs. "consistent development of own views," (e) Identification of underdetermined areas.

  2.  **Evaluate the User's Summary of Darwin:**
