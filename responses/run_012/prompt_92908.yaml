      *   *Check:* Is the distinction between "what he would say after reading" and "what follows from his views" clear? *Action:* Make sure to explicitly label section (d) for each point.
      *   *Check:* Is the user's summary of Darwin corrected? *Action:* It's mostly correct, but I should nuance the "group selection" point. He didn't have a formal theory of it, but he used the logic. I should note that he didn't distinguish clearly between cultural and biological group selection.
      *   *Check:* Constraint Check. No footnotes. No bibliography.
