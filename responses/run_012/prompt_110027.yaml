answer: |-
  This is a remarkably sharp diagnosis of a problem that has indeed kept epistemologists busy for thirty years. You are not pattern-matching incorrectly; your uncle has accidentally stumbled onto the "Problem of Epistemic Dependence," and your intuition about the "chain" is hitting on the precise pressure point where the two camps fracture.

  You asked for a diagnosis of the stalemate, an evaluation of your hypothesis, and a map of what progress looks like, with strict instructions not to fabricate consensus. Here is the breakdown.

  ### 1. Diagnosis: Why is it stuck?

  You suggested several possibilities: ambiguous senses of "justified," psychology vs. permission, different units of analysis. The honest answer is that **all of these are happening simultaneously**, which is why the debate feels like two ships passing in the night.

  **A. Internalism vs. Externalism (The "Justified" Ambiguity)**
  You hit the nail on the head here.
  *   **Reductionists** (often leaning Internalist) ask: *What reasons can the believer cite right now?* If you can't produce the inductive evidence for the doctor's reliability, you aren't justified.
  *   **Anti-Reductionists** (often leaning Externalist) ask: *Is the belief produced by a reliable process?* If testimony is a reliable process (like vision), you are justified even if you can't cite the reliability conditions.
  *   **The Stalemate:** They are often answering different questions. One is asking about *responsibility* (did you do your homework?), the other about *warrant* (is this belief connected to truth?). Until they agree on whether epistemology is about being a responsible citizen or a truth-tracking vessel, they won't settle.

  **B. The Unit of Analysis (Individual vs. System)**
  This is the deeper structural issue.
  *   **Reductionism** treats the **individual knower** as the unit. It assumes a Cartesian starting point: *I* am here, *you* are there, how do I bridge the gap? It views trust as a risk to be managed.
  *   **Anti-Reductionism** (and the newer Social Epistemology camp) treats the **community/network** as the unit. It assumes we are born into a web of truth. It views trust as the default state necessary for cognition to function.
  *   **The Stalemate:** You cannot argue a system-level necessity using individual-level rules. Your uncle is demanding individual-level verification for a system-level fact (the bridge). The Reductionist says, "Show me your receipt." The Anti-Reductionist says, "The store is open because we built it together."

  **C. Normative vs. Descriptive**
  *   **Reductionists** often argue: "Even if we *do* trust blindly, we *ought* not to." (Normative).
  *   **Anti-Reductionists** often argue: "We *must* trust blindly to learn language or function, so it *must* be rational." (Transcendental/Descriptive).
  *   **The Stalemate:** One side is prescribing a diet; the other is describing metabolism.

  **Status Check:** None of this is settled. The "Internalist/Externalist" split is a live wire in all of epistemology, not just testimony. There is no consensus on which unit of analysis is primary.

  ### 2. Evaluating Your Hypothesis: The Chain

  Your hypothesis: *The crux is the belief held by a long chain of people, none of whom has checked the thing themselves.*

  **Verdict:** You are very close, but I would refine it slightly. The chain is the **stress test**, but the crux is the **Default Status**.

  Here is why the chain matters:
  If testimony is **transmissive** (Reductionist lean), knowledge can only be passed if someone originally had it non-testimonially. If you have a chain of ten people, and person #1 didn't check, the knowledge is degraded or lost by person #10. This is the "Generativity Problem."
  If testimony is **generative** (Anti-Reductionist lean), testimony can create new justification that didn't exist before. Person #10 can know something even if Person #1 was guessing, provided the chain itself is reliable.

  **Where your hypothesis needs nuance:**
  The Reductionist *can* handle the chain, but only by positing a "Global Reduction." They argue: "I don't need to check the bridge; I have inductive evidence that *civilization generally checks bridges*."
  The Anti-Reductionist counters: "Where did *that* induction come from? If you trace it back, you end up with a child trusting a parent, which has no inductive basis."

  So, the chain is the weapon the Anti-Reductionist uses to force the Reductionist into an infinite regress. But the fundamental disagreement is still about **Presumption**.
  *   **Reductionist:** Presumption of Falsehood (or neutrality). Trust must be earned.
  *   **Anti-Reductionist:** Presumption of Truth. Distrust must be earned.

  Your uncle is exploiting the fact that in a complex society, **Global Reductionism is practically impossible.** You cannot verify the verification chain of the bridge inspector. If Reductionism is true, you are irrational for driving over the bridge. If Anti-Reductionism is true, you are rational. The debate is stuck because one side prioritizes *logical purity* (Reductionism) and the other prioritizes *practical necessity* (Anti-Reductionism).

  ### 3. What Would Count as Progress?

  Since there is no consensus, "progress" doesn't mean one side winning. It means refining the terrain so the disagreement is more precise. Here are three avenues where actual work is being done:

  **A. Formal Epistemology (Bayesian Networks)**
  *   **The Move:** Instead of arguing conceptually, model trust mathematically. How much does justification degrade over a chain of length *n*?
  *   **Progress Condition:** If a model can show that under specific conditions (e.g., high independence of sources), a chain *does* preserve justification without a foundational checker, that hurts the hardline Reductionist.
  *   **Status:** Live research. Some models suggest trust *can* propagate without degradation if the network structure is right. This supports the Anti-Reductionist intuition but gives it a Reductionist-style mathematical backbone.

  **B. Developmental Psychology (The "Trust Module")**
  *   **The Move:** Do infants have a default setting for trust?
  *   **Progress Condition:** If it is proven that humans have a cognitive "testimony module" (like a language module) that operates pre-inductively, the Anti-Reductionist wins the "psychological reality" argument. It doesn't prove they are *right* normatively, but it makes the Reductionist position look biologically implausible.
  *   **Status:** Contested. Some studies suggest infants distinguish reliable from unreliable speakers very early; others suggest they are broadly credulous. This is an empirical question underneath the philosophy, as you suspected.

  **C. The "Assurance View" (A Third Way)**
  *   **The Move:** Philosophers like Richard Moran or Paul Faulkner argue that testimony isn't just evidence (Reductionism) or a brute fact (Anti-Reductionism). It's an **invitation to trust**. When I tell you something, I am giving you my assurance. I am taking responsibility for the truth.
  *   **Progress Condition:** This dissolves the "evidence" requirement. You don't need evidence; you need a relationship of responsibility.
  *   **Status:** Gaining traction, but controversial. It shifts the debate from epistemology to ethics.

  **D. Contextualism / Subject-Sensitive Invariantism**
  *   **The Move:** Maybe both sides are right depending on the stakes.
  *   **Progress Condition:** We accept that for "low stakes" (weather, bridge), Anti-Reductionism holds (default trust). For "high stakes" (medical diagnosis, legal testimony), Reductionism kicks in (demand evidence).
  *   **Status:** Very popular as a compromise, but critics say it just moves the problem to "how do we define stakes?"

  ### 4. Summary for the Fact-Checker

  You asked me to be careful about what is settled. Here is the blunt truth:
  *   **Settled:** Nothing. The Reductionism/Anti-Reductionism debate is as active today as it was in the 1990s (Coady vs. Fricker era).
  *   **Contested:** Whether testimony is a basic source of knowledge. Whether justification requires awareness of reasons. Whether the "chain" degrades knowledge.
  *   **Your Uncle:** He is a methodological individualist. He is demanding a Cartesian foundation for a social reality.
  *   **You:** You are operating as a social epistemologist. You are relying on the *system* of fact-checking, not your personal verification.

  **What counts as a win for you?**
  You will not convince your uncle philosophically because he is demanding a justification type (individual, internalist) that your job does not provide (social, externalist).
  Progress for *you* is recognizing that your job relies on **Distributed Knowledge**. The knowledge doesn't reside in you; it resides in the network (sources, documents, experts) that you are auditing. You are not the "knower" in the Cartesian sense; you are a node in the verification network.

  If you want to read more later, look for **Jennifer Lackey** (she offers a hybrid view that might satisfy your need for nuance), **Edward Hinchman** (on assurance), and **Hardwig's "Epistemic Dependence"** (which deals directly with your "chain" hypothesis).

  You are not missing a trick. The trick doesn't exist. The tension you feel is the actual friction of how knowledge works in a society.
