  I'm a third-year PhD student in political theory — my dissertation is on how contested political concepts get operationalized into measures, which is probably why this is bugging me — and I've gotten stuck on something in the long-running fight over whether violence has declined since the Middle Ages. I don't think I'm confused about the empirics. I think I've noticed a shape that I don't have a word for, and it keeps wanting to be cited and I keep not being able to cite it. Here's the shape. Any long-run series has to fix two things up front: what counts as a violent death (homicide? war? famine? suicide and overdose?) and what you're dividing by (total population, adults, person-years, just the people actually at risk?). Now over those same centuries the word has stretched — plenty of things nobody would have tallied in 1650 (a husband beating his wife, a beating in a schoolyard, deaths from a policy everybody could see coming) are tallied now — and the stretching looks like it was itself part of the moral progress, not a bug in it. So the category in the numerator is expanding at the same time as the underlying behaviour is (maybe) shrinking, and the denominator is a population whose size and composition are also moving. The upshot is that "less violent" can mean at least four different things — fewer acts total, lower chance per person, less severe acts, or a narrower class of acts counting as violent at all — and they come apart, sometimes in opposite directions. And I can't just say "well, then use the old, narrow, fixed definition," because the old definition is exactly what people now point to as part of the problem: it quietly decided whose suffering didn't count.

  What I actually want from you: is there an established name for this specific thing — a measure where the extension of the numerator and the denominator are both contested and both move together with the trend, so that the trend is partly a fact about the world and partly a fact about the concept? I know there are neighbours (something about the way our concepts of harm and abuse have ballooned over the last few decades, the older idea that some concepts are contested by their very nature, the line about the moral circle widening), but none of them quite seems to be it, and honestly I don't trust my memory of any of them enough to lean on it.

  Please don't just hand me a label and stop, that's the opposite of what I need. You're a philosopher of social science who's worked on measurement and on thick/contested concepts — so think carefully, and start by brainstorming a few candidate names and nearest concepts along with what each would have to capture in order to fit. Then tell me which fits best and where each one comes apart from what I described. Two things I especially want your read on: is the expansion of the category a bias that distorts the measurement, or is it partly constitutive of the very progress we're trying to measure? And is this definately different from just moving the goalposts, or from ordinary semantic drift? Then give me your best answer on the underlying question — is there a fact of the matter about whether the world is getting less violent, or is the concept here doing something no fact can settle? If nothing established fits, coin a term, define it, and give me two boundary cases it should and shouldn't cover. I have to draft this section by friday, so I'd much rather it be a bit long than a bit glib.
