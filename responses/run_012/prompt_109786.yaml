answer: |-
  This is a genuinely sophisticated methodological knot, and you are right to feel that existing terminology is either too pejorative (implying error) or too static (implying a fixed construct) to capture it. You are describing a situation where the *instrument of measurement* is evolving normatively in tandem with the *phenomenon being measured*, such that the trend line is a function of both ontological change and semantic revision.

  As a philosopher of social science, I see this as a collision between three distinct literatures: the psychometrics of **construct validity**, the historical sociology of **moral circles**, and the ontology of **human kinds**.

  Here is the breakdown of the nearest neighbors, why they fail, and my proposal for how you should conceptualize and name this in your dissertation.

  ### 1. Brainstorming Candidate Concepts

  To find the right label, we need to test the existing tools against the specific "shape" you described: *Numerator expansion (definition of harm) + Denominator expansion (membership in moral community) + Normative Progress.*

  **Candidate A: Concept Stretching (Giovanni Sartori)**
  *   **The Idea:** When a concept travels across time or space, it loses precision. To cover more cases (e.g., "democracy" in 1800 vs. 2000), we dilute the definition, making comparison invalid.
  *   **Why it's close:** It addresses the time-series comparability problem. Sartori would say you cannot compare 1650 violence to 2020 violence because the concept has stretched too far.
  *   **Where it breaks:** Sartori treats stretching as a *defect* to be avoided (by "stopping" the concept at a specific time). Your insight is that the stretching is *constitutive of moral progress*. To "fix" the concept (as Sartori suggests) is to endorse the moral blind spots of the past. Sartori gives you a reason to stop measuring; you need a reason to measure *through* the change.

  **Candidate B: Concept Creep (Nick Haslam)**
  *   **The Idea:** Psychological concepts (trauma, abuse, bullying) expand over time to include milder or new forms of harm.
  *   **Why it's close:** It perfectly captures your numerator problem (the expansion of what counts as violence). It acknowledges that this expansion is driven by moral concern (protecting the vulnerable).
  *   **Where it breaks:** Haslam generally frames creep as a potential pathology (diluting the meaning of harm). More importantly, it ignores the *denominator*. Concept Creep doesn't account for the fact that the *population at risk* (the denominator) is also changing (e.g., slaves, women, and children entering the "persons worth counting" category). It is semantic, not demographic.

  **Candidate C: Looping Effects / Human Kinds (Ian Hacking)**
  *   **The Idea:** Classifying people changes how people behave, which changes the classification. "Violence" is a human kind, not a natural kind (like gold or quarks).
  *   **Why it's close:** It captures the ontology. There is no "violence" independent of our descriptions of it. As we describe more things as violence, more things become violence.
  *   **Where it breaks:** Hacking focuses on how the *classified people* change. Your problem is about how the *measurers* change their tools. It's a meta-measurement problem. Hacking explains why the world changes; you need a term for why the *ruler* changes while the world changes.

  **Candidate D: Construct Validity (Psychometrics/PolSci)**
  *   **The Idea:** Does the measure measure what it claims to measure?
  *   **Why it's close:** This is the standard language you are expected to use.
  *   **Where it breaks:** Standard validity theory assumes a stable "construct" out there in the world that we are trying to approximate. Your argument is that the construct *itself* is evolving. If the construct evolves, "validity" becomes a moving target. You can't have high validity and high comparability simultaneously.

  ### 2. Bias vs. Constitution: The Core Tension

  You asked: *Is the expansion of the category a bias that distorts the measurement, or is it partly constitutive of the very progress we're trying to measure?*

  **It is constitutive.**

  In measurement theory, **bias** implies a systematic error that moves you *away* from the true value. This presupposes there is a "true value" independent of the measurement scheme. If you treat the expansion of "violence" (to include domestic abuse, structural harm, etc.) as bias, you are implicitly ontologically committing to the 1650 definition as the "true" one.

  But as you noted, the 1650 definition wasn't "neutral"; it was *normatively loaded*. It decided that a husband beating a wife was "discipline," not violence. If you hold the definition fixed to ensure comparability, you are not removing bias; you are **freezing the moral blind spot.**

  Therefore, the expansion is not noise; it is signal. It is the statistical trace of the "expanding moral circle" (Peter Singer). The "distortion" in the time series is actually the *data point* for moral progress. To clean the data is to lose the phenomenon.

  ### 3. Moving Goalposts vs. Semantic Drift

  You asked: *Is this definitely different from just moving the goalposts, or from ordinary semantic drift?*

  **Yes, it is distinct.**

  *   **Moving the Goalposts:** This implies bad faith or rhetorical cheating to secure a desired conclusion (e.g., "I said violence declined, but now that I see the numbers are bad, I'll redefine violence to make them look better"). Your scenario is the opposite: the redefinition makes the numbers look *worse* (higher rates) potentially, but the *moral reality* is better. It is an honesty problem, not a cheating problem.
  *   **Ordinary Semantic Drift:** This implies accidental linguistic change (e.g., "nice" used to mean "foolish"). The change in "violence" is not accidental; it is **ameliorative** (Sally Haslanger's term). It is a deliberate political and philosophical project to recognize previously ignored harms.

  The distinction you need to draw is between **Arbitrary Drift** (which destroys comparability) and **Normatively Constitutive Drift** (which preserves moral adequacy at the cost of statistical comparability).

  ### 4. Is There a Fact of the Matter?

  *Is there a fact of the matter about whether the world is getting less violent, or is the concept here doing something no fact can settle?*

  **There is no mind-independent fact of the matter.**

  Violence is not a **Natural Kind** (like water or gravity). It is a **Human Kind** (Hacking) or a **Thick Ethical Concept** (Williams/Thick Concepts literature).
  *   **Fact:** In 1650, a husband beat his wife. In 2020, a husband beats his wife. The *physical event* is comparable (force applied to body).
  *   **Non-Fact:** Whether that event counts as "violence" in the dataset is not a fact about the universe; it is a fact about the *moral status of the wife* in that society.

  If you ask, "Did violence decline?" you are asking two questions simultaneously:
  1.  Did the frequency of physical force decline? (Empirical)
  2.  Did the moral community expand to recognize more instances of force as illegitimate? (Normative)

  You cannot disentangle these. A world where domestic abuse is legal and uncounted is not "less violent" than a world where it is illegal and counted; it is *less morally sensitive*. Therefore, the trend line is not just a record of behavior; it is a record of **moral perception.**

  ### 5. The Proposal: Coining a Term

  Since no existing term captures the simultaneous movement of numerator (definition), denominator (population), and normative valuation, I recommend you coin a term for this section. It will give you ownership of the conceptual space.

  **Proposed Term:** **"Constitutive Operational Drift"**

  **Definition:**
  > *Constitutive Operational Drift* occurs in longitudinal measurement when the operational definition of a variable (numerator) and the population of reference (denominator) evolve over time in response to normative progress, such that the measurement instrument is altered by the very moral phenomena it seeks to track. Unlike measurement error, this drift is constitutive of the social reality being measured; correcting for it restores statistical comparability at the cost of moral adequacy.

  **Why this works:**
  *   **Constitutive:** Signals that the change is part of the thing itself (violence is defined by our moral recognition of it).
  *   **Operational:** Signals this is a measurement/methodology problem, not just a philosophical one.
  *   **Drift:** Acknowledges the lack of fixed stability without implying "error" or "bias."

  ### 6. Boundary Cases for Your Dissertation

  To solidify the term in your text, you should define what falls inside and outside this category.

  **Case 1: Should Cover (The GDP Analogy)**
  *   **Scenario:** Measuring "Economic Activity" (GDP) over 100 years.
  *   **Why it fits:** In 1920, unpaid domestic labor was not counted in GDP. In 2020, feminist economists argue it *should* be. If we add it, the "size of the economy" changes, not just because more work is done, but because we value women's labor differently. This is *Constitutive Operational Drift*. The measure changes because our moral understanding of "work" changed.
  *   **Use in text:** "Just as GDP undergoes constitutive operational drift when unpaid labor is recognized, violence statistics drift when domestic abuse is recategorized from 'discipline' to 'crime'."

  **Case 2: Should NOT Cover (The Thermometer Analogy)**
  *   **Scenario:** Measuring "Global Temperature" over 100 years.
  *   **Why it doesn't fit:** If we change from mercury thermometers to satellite sensors, that is *Instrumental Calibration*. If we decide that "temperature" should now include "wind chill," that is *Conceptual Stipulation*. But the *physics* of heat has not changed based on our morality. The expansion of the concept of violence is moral; the expansion of temperature measurement is technical.
  *   **Use in text:** "Unlike temperature measurement, where calibration aims to remove the observer, violence measurement requires the observer's moral framework to be embedded in the operationalization."

  ### 7. Drafting Advice for Friday

  For your section, I suggest structuring the argument this way:

  1.  **The Empiricist Trap:** Start by acknowledging the standard critique (Pinker vs. critics) focuses on data quality. Dismiss this. You aren't worried about missing data; you're worried about *changing categories*.
  2.  **The Dual Movement:** Introduce the Numerator/Denominator problem. Use the phrase **"The Adequacy-Comparability Trade-off."** (You can use this as a sub-header). To be *comparable* across time, we must fix definitions. To be *adequate* to moral reality, we must evolve definitions.
  3.  **Introduce Constitutive Operational Drift:** Define it as above. Argue that the "decline of violence" thesis fails because it treats violence as a natural kind subject to *Instrumental Calibration*, when it is actually a human kind subject to *Constitutive Operational Drift*.
  4.  **The Ontological Conclusion:** Conclude that the question "Has violence declined?" is ill-posed. The better question is: "How has the operationalization of violence tracked the expansion of the moral community?"

  **One final philosophical nudge:**
  Be careful not to slide into total relativism. You can say there is no *single* fact of the matter about "violence" while still maintaining there *are* facts about "suffering." Your argument is that "violence" is the *political categorization of suffering*. The drift isn't in the suffering; it's in the *politics of counting*.

  This distinction saves you from the "everything is subjective" critique. The beating is real (objective). The *count* is political (constitutive).

  Good luck with the draft. This is the kind of methodological clarity that turns a dissertation chapter into a journal article.
