answer: |-
  This is a fertile but treacherous patch of ground. It sits right at the intersection of meta-ethics, political philosophy, and historical sociology, which means it attracts a lot of hand-waving. Since you have three PhD students and a semester, you need to avoid the trap of turning into a book club that reads Appiah and nods, or worse, a amateur history seminar trying to out-empiricist the sociologists.

  Here is the landscape assessment, the proposed agenda, and the reasoning behind it.

  ### Part 1: The Landscape (Settled vs. Contested)

  You asked for honesty about consensus. Here is where the field actually stands, stripped of the seminar-room politeness.

  **What is effectively settled:**
  1.  **The insufficiency of pure rationalism:** No one with a grip on the literature believes that moral argument *alone* (e.g., "we realized slavery was inconsistent with Christianity") drives major normative shifts. The "Great Man/Great Argument" theory of moral history is dead.
  2.  **The role of material/structural conditions:** It is accepted that economic viability, technological shifts, and power structures are necessary conditions for norm change. Slavery didn't end because it became immoral; it became immoral (publicly) when it became economically tenable to let it end.
  3.  **The social nature of norms:** Norms are not just aggregated individual beliefs. They are interdependent expectations. (Cristina Bicchieri's work here is the analytic backbone, even if philosophers often ignore her).

  **What is genuinely contested:**
  1.  **The causal efficacy of reasons:** This is the big one. Are moral arguments *epiphenomenal* (mere rationalization of structural shifts) or do they have *independent causal power* (they tip the scale when structural forces are indeterminate)? Williams leans toward the former; Appiah tries to carve a space for the latter via psychology.
  2.  **The taxonomy of norms:** Is "honor" a distinct category of norm (as Appiah argues), or is it just a label for a specific configuration of social sanctions? If it's the latter, Appiah's model doesn't generalize to non-status-based norms (e.g., environmental ethics).
  3.  **The normative stakes of genealogy:** If we accept a Williams-style genealogical explanation for why we hold a norm, does that undermine the norm's justification? (The *Genetic Fallacy* vs. *Debunking* debate).

  **The False Consensus to Avoid:**
  Do not let the students assume Appiah's *The Honor Code* provides a general theory of moral change. It provides a theory of *honor-based* norm change. Treating dueling, footbinding, and slavery as identical mechanisms is a category error. Slavery involves property and race; dueling involves status and masculinity. Conflating them is "bar talk."

  ### Part 2: The Proposed Agenda (2 Core Questions)

  For a semester-long working group of text-based philosophers, I recommend focusing on these two upstream questions. If you solve these, the rest follows. If you ignore these, you end up arguing about history without a metaphysics.

  #### Question 1: The Causal Status of Moral Reasons
  *Do moral arguments function as causes, triggers, or lubricants in normative change?*

  *   **Why this is upstream:** You cannot determine "how" norms change until you decide what role *reason-giving* plays in the mechanism. If reasons are purely post-hoc rationalizations (strong Williams), then the study of moral change is actually the study of political economy and social psychology. If reasons have traction (weak Williams/strong Appiah), then normative philosophy has a job to do in social change.
  *   **Tractability:** This is pure philosophy of action and meta-ethics. You can analyze the structure of Appiah's explanation without needing archival data. You are evaluating the *logic of the explanation*, not the historical accuracy.
  *   **Readings:** Williams (*Shame and Necessity*, "Conflicts of Values"), Appiah (*The Honor Code*, Ch. 1 & Conclusion), maybe Rorty ("Justice as a Larger Loyalty" for the pragmatist counter), and Bicchieri (*The Grammar of Society* for the definition of norms).

  #### Question 2: The Ontology of the Changing Unit
  *What exactly is it that changes? A belief, a practice, or an expectation?*

  *   **Why this is upstream:** Appiah talks about "honor codes." Williams talks about "ethical concepts." Sociologists talk about "equilibrium selection." If your group doesn't define the *relata* of the change, you will talk past each other. Did the *belief* that slavery was wrong change first, or did the *practice* of slavery become costly, changing the *expectation* that others would maintain it?
  *   **Tractability:** This allows you to use conceptual analysis. You can map the logical dependencies between belief, practice, and sanction. It prevents the group from sliding into vague sociological musings.
  *   **Readings:** Bicchieri (on empirical vs. normative expectations), Scanlon (on the object of moral change), and perhaps a critique from historical sociology (e.g., Skocpol or Tilly) to see how they operationalize "norms."

  *(Optional Third Track: The Normative Stakes)*
  *If the Williams/Appiah models are true, does "Moral Progress" survive?*
  Only tackle this if the first two are resolved. If reasons are epiphenomenal and norms are just equilibrium shifts, "progress" might just mean "adaptation." This is the Williams-style provocation you mentioned. It's the payoff, but you can't get there without the mechanics.

  ### Part 3: Reasoning and Filtering

  **Why these two?**
  1.  **Upstream/Downstream:** Question 1 (Reasons) and Question 2 (Ontology) determine the answer to "How do norms change?" You can't answer the "How" without knowing the "What" (ontology) and the "Why" (causality).
  2.  **Tractability for Philosophers:** These questions allow you to stay in your lane. You are analyzing the *structure of the arguments* provided by Williams and Appiah, not verifying the historical claims. You are asking: *If* Appiah is right about dueling, *what kind of claim is he making?* Is it a psychological claim? A conceptual one?
  3.  **Avoiding "Bar Talk":**
      *   *Bar Talk:* "People just follow the herd." (Too vague).
      *   *Philosophical Work:* "Is the herd behavior driven by empirical expectations (I think they will do X) or normative expectations (I think they think I ought to do X)?" (Bicchieri's distinction). This is arguable, text-based, and precise.
      *   *Bar Talk:* "Morality is just economics."
      *   *Philosophical Work:* "Is the economic explanation sufficient to individuate the moral change, or is there a residual normative component required to explain the *timing*?"

  **What would move a question up or down the ranking?**

  *   **Move Question 1 (Reasons) DOWN if:** The group finds that the "Reasons vs. Causes" distinction is a false dichotomy. Some pragmatist literature (e.g., Price or recent neo-Aristotelians) argues that reasons *are* a species of cause in the social world. If the students can convincingly argue that the distinction is category-mistaken, drop this and move to the "Progress" question.
  *   **Move Question 2 (Ontology) UP if:** You find the group getting stuck on case studies. If they keep arguing about whether footbinding *actually* ended for the reasons Appiah says, force them back to ontology. "Regardless of history, what *would* have to be true about the norm for Appiah's explanation to work?"
  *   **Add a "Mechanism" Question if:** The students have background in social science. If they are comfortable with game theory or cognitive science, add a week on **Signaling Models**. (e.g., Is norm change a signaling cascade?). This is high risk/high reward. It's tractable only if they can handle the formalism.

  ### Part 4: Defeaters (What would change my mind?)

  You asked what evidence or argument would shift this ordering.

  1.  **The "Internalism" Counter-Example:** If the group can identify a historical case where moral argument *preceded* structural viability and successfully drove change (not just hastened it), Question 1 collapses. (Hard to find, but e.g., some argue the early abolitionist movement fits this). If they find one, the focus must shift to *conditions of efficacy* rather than *causal status*.
  2.  **The "Honor" Generalization:** If Appiah's model of honor (script + social sanction) can be rigorously mapped onto non-status norms (e.g., veganism, carbon emissions), then Question 2 becomes less about ontology and more about *scalability*. The focus would shift to: "What are the limits of the Honor Model?"
  3.  **The Meta-Ethical Knockout:** If a student convincingly argues that "moral norm change" is not a coherent object of study because "moral norms" are not natural kinds (a la error theory or radical contextualism), the whole seminar needs to pivot to *Conceptual Engineering*. (This is a live possibility with Williams in the room).

  ### Summary Recommendation

  **Weeks 1-4:** **The Ontology of the Norm.** (Bicchieri, Scanlon, Appiah Ch 1). Define the thing that changes.
  **Weeks 5-8:** **The Causal Role of Reasons.** (Williams, Appiah Ch 4-5, Counter-arguments). Define the engine of change.
  **Weeks 9-12:** **The Normative Payoff.** (Progress vs. Adaptation). Apply the findings from 1-8 to the question of whether this change counts as *improvement*.

  **Final Advice:** Tell the students explicitly: "We are not historians. We are not testing whether Appiah is right about footbinding. We are testing whether Appiah's *explanatory structure* holds water." That keeps them in the philosophy lane.
