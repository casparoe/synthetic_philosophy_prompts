prompt: |-
  I'm a philosophy professor and I've somehow ended up running a small working group next term on how moral norms actually change -- the Williams-style provocation that the case against slavery was more a symptom of the thing collapsing than the cause of it, Appiah's honor stories about dueling and footbinding, that whole neighborhood. Three PhD students, one semester, weekly meetings, and the agenda is mine to set, so I'm asking you to set it for me.

  What are the live open questions here, and which two or three would you actually put the group's effort into? I'm less interested in the list than the reasoning: which questions are upstream of which others, which are tractable for people who work with texts and arguments rather than in a lab or an archive, and which are only appealing because they're fun to argue about at a bar. Tell me what would move something up or down the ranking -- what argument or bit of evidence would change your mind about the ordering.

  One thing I really want from you: seperate what's actually settled among people who know this literature from what's genuinely contested, and don't sell me one camp's position as the consensus. If the honest answer is that a question everyone treats as open is basically closed, or vice versa, say so.
