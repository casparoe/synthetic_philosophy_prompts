  *   **The Proposition is TRUE if:** Removing the rupture results in a society that solves its problems with a *structurally distinct* architecture (e.g., a dynastic empire persists instead of a nation-state; a religious caliphate forms instead of a secular republic). Here, the *form* itself is contingent.
  *   **The Proposition is FALSE if:** Removing the rupture results in a society that looks different in symbol or leadership but operates via the *same underlying logic* (e.g., a different king signs the same constitution; a different party manages the same bureaucracy). Here, the *function* is determined by structural pressures (technology, demographics, economics), rendering the rupture "thin."

  **Recommendation:** To maintain historical responsibility, anchor your plot's divergence in *institutional mechanics* (how power is legally transferred, how taxes are collected) rather than *cultural aesthetics*. The former supports thick contingency; the latter often collapses into thin contingency under the pressure of modernization.
