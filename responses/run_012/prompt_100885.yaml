      *   B's Utopia: 40 (if A takes minimum 60). **Max Gain for B: 40.**
      *   Since both Maximum Gains are 40, equalizing the *fraction* of gain requires equalizing the *absolute* gain. Each gets 20 over fallback.
      *   **Verdict: 80/20.** (This explains why your "Equal Surplus" hunch worked here: the maximum possible gains happened to be equal).

  *   **Case 3 (Pot 100, Fallback 0/60):**
      *   Symmetric to Case 2. Max Gains are both 40.
      *   **Verdict: 20/80.**

  *   **Case 4 (Pot 100, Fallback 0/0, Caps 30/100):**
