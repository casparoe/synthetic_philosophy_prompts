      *   A's Utopia: 30 (Hard Cap). **Max Gain for A: 30.**
      *   B's Utopia: 100 (Hard Cap). **Max Gain for B: 100.**
      *   Now the Maximum Gains are unequal (30 vs 100). To equalize the *fraction* of gain, A must receive a smaller absolute amount.
      *   Calculation: A gets $30/130$ of the pot, B gets $100/130$.
      *   $100 \times (30/130) \approx 23.07$.
      *   **Verdict: ~23 / ~77.** (This matches your "Equal Proportional Shortfall" hunch exactly).

