answer: |-
  There is a single principle that fits your four settled verdicts perfectly. It resolves the tension between your two "camps" by revealing that they are not actually different ideas, but rather the same idea applied to different constraints.

  ### The Principle: Equal Proportional Gain (The Kalai-Smorodinsky Solution)

  **Statement:** The fair division is the one where each party achieves the **same fraction of their maximum possible gain**.

  To apply this precisely:
  1.  Identify the **Fallback Point** ($d$): What each gets if talks fail.
  2.  Identify the **Utopia Point** ($u$): The maximum each party *could* possibly get in any feasible agreement, provided the other party receives at least their fallback. (This accounts for both the size of the pot and any capacity ceilings).
  3.  **The Rule:** Divide the pot so that:
      $$ \frac{\text{A's Payoff} - \text{A's Fallback}}{\text{A's Utopia} - \text{A's Fallback}} = \frac{\text{B's Payoff} - \text{B's Fallback}}{\text{B's Utopia} - \text{B's Fallback}} $$

  In bargaining theory, this is known as the **Kalai-Smorodinsky Bargaining Solution**. It unifies your intuition about "splitting the surplus" (Cases 1–3) with your intuition about "sharing the pain of constraints" (Case 4).

