  ### Why This Fits Your Settled Verdicts

  You felt torn between "Equal Surplus" (Cases 2 & 3) and "Equal Proportional Shortfall" (Case 4). This principle shows they are mathematically identical when you correctly define the "Maximum Possible Gain."

  *   **Case 1 (Pot 100, Fallback 0/0):**
      *   Max A can get is 100. Max B can get is 100.
      *   Maximum Gains are both 100.
      *   To equalize the fraction of gain, you split the 100 equally. **Verdict: 50/50.**

  *   **Case 2 (Pot 100, Fallback 60/0):**
      *   A's Fallback: 60. B's Fallback: 0.
