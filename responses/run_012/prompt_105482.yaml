answer: |-
  You have identified a genuine historiographical blind spot. It is a specific category error that sits at the intersection of archaeology, political science, and narrative history.

  To answer your first question: **No, there is no single, canonical term for this specific slippage.**

  There are neighbors, but as you have rightly intuited, they do not fit the contours of the problem.
  *   **Elite Bias:** This describes *whose* story is told (the king, not the farmer), but not the inference that the farmer vanished when the king's scribe stopped writing.
  *   **Literate Bias:** This describes a preference for written records over material culture, but it doesn't capture the leap from "no text" to "no people."
  *   **Collapse of Complexity:** This names the *event* (the system simplified), whereas you are naming the *interpretive error* (the system's simplification is read as the people's extinction).
  *   **Survivorship Bias:** This is passive (we only see what survived). Your problem is active (we interpret the silence of what didn't survive as proof of death).

  Because the term does not exist, and because you require a tool with hard edges for your work, I propose you coin it.

  ### The Term: **The Monumental Metonymy**

  I suggest this phrase because it identifies the rhetorical mechanism at fault. **Metonymy** is the figure of speech where a part is substituted for the whole (e.g., "The White House issued a statement," where the building stands for the administration).

  In the history you are writing, the Palace, the Archive, and the Monument are the *parts*. The Society (the population, the culture, the daily continuity) is the *whole*.

  **The Monumental Metonymy** is the historiographical error of treating the part (the monumental/archival layer) as synonymous with the whole (the society), such that the silence of the part is interpreted as the death of the whole.

  ### Definition

  > **The Monumental Metonymy:** The interpretive slippage wherein the cessation of a society's high-visibility traces (monuments, archives, state ritual) is mistaken for the cessation of the society itself. It occurs when the historian conflates the *legibility* of a population with the *existence* of a population.

  ### The Boundaries (Hard Edges)

  You asked for a sharp term that fails in specific cases. Here is where **The Monumental Metonymy** applies and where it does not.

  **1. It does NOT apply if the population actually vanished.**
  *   *Case:* Easter Island (Rapa Nui).
  *   *Boundary:* If the demographic evidence proves the population collapsed (due to ecocide, disease, or genocide), then the silence of the quarries *does* signal the end of the society. In this case, calling it a "Monumental Metonymy" would be incorrect. The term is reserved for cases where the people *persist* despite the silence of the stone. If the people are gone, the metonymy holds (the part and the whole both ended). The term only names the *error*, not the *outcome*.

  **2. It DOES apply if the successor order is poorer but continuous.**
  *   *Case:* The Classic Maya.
  *   *Boundary:* This is the core use-case. The royal centers emptied, the stelae stopped being dated, but the villages remained, the pottery traditions shifted rather than vanished, and the language persisted. Here, the "State" collapsed, but the "Society" transformed. Historians who call this "The Collapse of the Maya" are committing the Monumental Metonymy. Historians who call it "The Transformation of the Maya" are correcting it.

  **3. It does NOT apply to societies that raised no monuments.**
  *   *Case:* Neolithic egalitarian villages; many Indigenous societies of the Americas or Oceania.
  *   *Boundary:* You cannot commit the Monumental Metonymy if there is no monument to mistake for the society. If a society leaves no archives and builds no palaces, there is no "high-visibility layer" to go silent. Their history may be invisible to the historian (an archival gap), but the historian cannot falsely equate the end of a palace with the end of the people, because there was no palace. The term requires a *stratified* society where the top layer is distinct from the bottom layer.

  **4. It is distinct from Survivorship Bias.**
  *   *Distinction:* Survivorship Bias is about the *sample* (we only have the stone tools, not the wooden ones). The Monumental Metonymy is about the *narrative* (the stone tools stopped being made, therefore the toolmakers died).
  *   *Example:* If we only find bronze swords and assume they had no wood, that is Survivorship Bias. If we find the bronze swords stop appearing in 1200 BCE and assume the *warriors* ceased to exist (rather than switching to iron or wood), that is the Monumental Metonymy.

  ### Why this term serves your novel

  As a novelist, you are dealing with the tension between the *recorded* story and the *lived* story.

  1.  **It creates conflict:** Your characters living in the "collapse" likely do not feel they are collapsing. They feel they are surviving. The "Monumental Metonymy" is the error future historians will make about them. This allows your characters to have dramatic irony regarding their own legacy.
  2.  **It locates the tragedy:** The tragedy isn't that everyone died. The tragedy is that the *mechanism of memory* died. The people continue, but they become "illegible" to the future. This is a profound theme for a historical novel: the difference between existing and being remembered.
  3.  **It fits the Bronze Age:** The Bronze Age palace economies (Mycenaean, Hittite, Egyptian New Kingdom) were precisely machines for creating legibility. They stored grain, counted labor, and inscribed names. When the palace burns, the legibility ends. The term captures the specific technological nature of your setting.

  ### A Secondary Option: **The Legibility Fallacy**

  If *Monumental Metonymy* feels too rhetorical, there is a sociological cousin: **The Legibility Fallacy**.

  Drawing on the work of political anthropologist James C. Scott (*Seeing Like a State*), this term argues that states exist to make populations "legible" (taxable, conscriptable). When the state collapses, the population becomes "illegible." The fallacy is assuming that because the population is no longer legible to the *state* (or the historian using state records), they have ceased to exist.

  *   **Choose *Monumental Metonymy* if:** You want to emphasize the *literary/historical* error (the confusion of the record for the reality).
  *   **Choose *Legibility Fallacy* if:** You want to emphasize the *political/economic* mechanism (the state's need to count people vs. the people's ability to live uncounted).

  Given your description, **The Monumental Metonymy** is the sharper tool. It defines the edges of the evidence (the monument) and the error (the metonymy). It allows you to say: *"The palace fell. The scribes fled. The grain stores burned. But the village remained. To call this collapse is to commit the Monumental Metonymy."*

  That is a sentence a character could think, or a narrator could assert, with precision.
