      *   *Focus:* The user specifically asked about the slide between "believes it's right" and "is right." Make this the centerpiece.
      *   *Nuance:* Acknowledge where the economist is *right* (output matters, Western hubris is real). Don't be a knee-jerk liberal defender. Be a philosopher.

  6.  **Final Polish:** Check against constraints (no citations, no reading lists). Ensure the distinction between *political science* (his field) and *political philosophy* (the user's new field) is clear. Political science describes; philosophy prescribes.

      *(Self-Correction on "Mandate of Heaven"):* Be careful not to validate the historical accuracy too much, focus on the philosophical implication of a conditional contract without a mechanism for enforcement.

