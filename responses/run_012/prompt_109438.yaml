      *Actually, the most honest philosophical verdict is:* Hiddenness is evidence against the God of the brother. It is not evidence against the God of the analogy. She should reject the brother's God.

      *Let's sharpen the final line.* It needs to address the silence directly. "You think silence means He isn't there. I think it means He isn't *here*." (Too vague).
