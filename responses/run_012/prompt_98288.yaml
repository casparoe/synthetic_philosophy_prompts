      *   *Refining the Verdict:* The strongest philosophical move to save (7) (i.e., Unity is Real) while accepting (3) (Split brains have 2 subjects) is to argue that **Subjecthood is Vague** or that **Unity is a Higher-Order Property** that survives subsystem multiplicity.
