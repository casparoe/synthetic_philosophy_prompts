prompt: |-
  I run a fortnightly discussion evening for adults with no academic background — sixteen regulars, ninety minutes in a community hall — and I want a session on something I have been turning over since my father's illness: the standing of instructions a person wrote down while they were still themselves, and whether that earlier person has any authority over whoever has to live with the consequences. I would rather the group feel the pull of both sides than argue it out in the abstract, so the activity should have them write binding instructions of their own in the first half and then find out what it is like to be held to them.

  Please design the whole session: rules, materials (I have index cards, envelopes, a whiteboard and a timer, and can supply one small token per person — no money), a minute-by-minute timeline, and a debrief. My rough idea, which you should rework if something better serves the point: in the first fifteen minutes everyone privately writes a directive about their own conduct later in the evening — specific enough to be checked, such as which option they take in a forced choice, where their token goes, or whether they speak at all in the closing discussion — seals it in an envelope, and has it read out. Then I reveal something that changes what the choice is worth, so that some directives now look like mistakes and others look oddly prescient. Directives bind unless their author persuades the group to release them, and the group votes by secret ballot; I want them to notice that their votes turn on what releasing costs each of them rather than on who the writer now is. On the directive form I also want a line that lets a writer add, if they choose, that any later request of theirs to be released should be treated as evidence that they can no longer be trusted with the decision. Those who add it should discover they can never get out; those who leave it off should discover their directive can be shed the moment it stings.

  Tell me what the group should come away seeing — I am after the point that the authority question may not really be about whether it is the same person, and that the very feature that makes a directive worth having is the one that makes it dangerous. Then the debrief, mapping each moment onto the parts of the problem, including the difference between an earlier self who knew more and one who knew less, and the awkwardness of a directive that forbids its own revocation. Be frank about what the activity cannot reproduce and what I will have to say myself, and tell me what will predictably go wrong the first time — I expect vague directives, a group that will not enforce anything, and a release vote that turns into a popularity contest — and how to head each of those off without turning the session into a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** Fortnightly discussion evening, adults with no academic background (16 regulars), 90 minutes, community hall.
      *   **Topic:** Authority of past selves (advance directives, pre-commitment, identity over time). Specifically: Does the "earlier person" have authority over the "later person" who lives with consequences?
      *   **Goal:** Participants should *feel* the pull of both sides, not just argue abstractly.
      *   **Method:** Write binding instructions in the first half, then be held to them (or try to escape them).
      *   **Specific Mechanics Proposed by User:**
          *   Private writing of directives (specific, checkable).
          *   Sealed in envelopes, read out.
          *   Twist: Reveal something that changes the value of the choice.
          *   Enforcement: Directives bind unless author persuades group to release them (secret ballot).
          *   Key Mechanic: Option to add a "Ulysses Clause" (request for release = evidence of incapacity/untrustworthiness).
          *   Outcome: Those with the clause can't get out; those without can shed it when it stings.
      *   **Desired Takeaway:** Authority isn't just about "same person"; the feature making directives valuable (bindingness) is the same one making them dangerous.
      *   **Requirements:** Rules, materials, minute-by-minute timeline, debrief, facilitator notes (what to say, limitations, predictable failures & fixes).

  2.  **Evaluate and Refine the User's Idea:**
      *   *Strengths:* The "Ulysses Clause" is brilliant for illustrating the paradox of pre-commitment. The secret ballot on release highlights self-interest vs. principle.
      *   *Weaknesses/Risks:*
          *   "Read out" immediately might kill the tension. If everyone knows everyone's directive, the "reveal" needs to be impactful.
          *   "Persuade the group" might turn into a popularity contest (as the user noted).
          *   90 minutes is tight for 16 people if everyone speaks.
          *   The "twist" needs to be carefully designed so it doesn't feel like a trick, but a genuine change in context (like an illness diagnosis or a change in resource availability).
          *   Ethical safety: Don't trigger actual trauma regarding illness/death, keep it low-stakes (tokens, seating, speaking rights).
      *   *Refinements:*
          *   Instead of reading all envelopes immediately, collect them. The "Twist" happens *before* enforcement.
          *   The directive needs to be about something tangible in the room (the token, seating, speaking order) to make enforcement possible.
          *   The "Twist" should be a change in the *value* of the token or the *rules* of the second half.
          *   To avoid the popularity contest, the voting criteria need to be framed carefully (not "do you like them?" but "is this directive still valid?").
          *   Time management is critical with 16 people.

  3.  **Drafting the Session Plan:**

      *   **Title:** Needs to be inviting but not too academic. "The Promise You Made to Yourself."
      *   **Materials:** Index cards, envelopes, pens, tokens (distinctive), whiteboard, timer.
      *   **Timeline:**
          *   0-10: Intro & Setup (The Contract).
          *   10-25: Writing Directives (The Past Self).
          *   25-30: Collection & The Twist (The Changed World).
          *   30-60: The Second Half (Living with Consequences).
          *   60-75: The Plea for Release (The Present Self).
          *   75-90: Debrief (The Philosophical Payoff).

      *   **The Twist:** Needs to make some directives burdensome and others beneficial. Let's use the *Token*.
          *   Directive ideas: "I will give my token to X," "I will keep my token," "I will not speak."
          *   Twist: Halfway through, announce the token now represents something specific (e.g., the right to speak last, or a 'veto' power, or simply that the group will donate to a charity based on who holds tokens).
          *   *Better Twist:* The "Resource Scarcity" twist. Announce that tokens can be exchanged for a specific privilege at the end (e.g., choosing the next topic), *but* there are now fewer privileges than tokens. Or, simpler: The token determines who gets to speak in the debrief. If you directive said "I give my token away," you can't speak. If you said "I keep it," you can.
          *   *Refined Twist:* Let's make it about *burden*. The token is a "duty token." Holding it means you have to clean up the chairs. Directives might have said "I will keep the token" (noble then, burdensome now) or "I will give it away" (selfish then, smart now).
          *   *Actually, let's stick closer to the user's "authority" theme.* The directive should constrain *choice*.
          *   *Decision:* The directive constrains a choice in the second half. The Twist changes the *desirability* of the options.
          *   *Example:* Directive: "I must sit in the front row." Twist: The front row is now the "hot seat" where the facilitator asks hard questions.
          *   *Example:* Directive: "I must give my token to the person on my left." Twist: The token is now required to speak in the debrief.
          *   *Selection:* The Token + Speaking Rights. It's immediate and visceral.
          *   *Directive:* "I will [Keep/Give Away] my token." OR "I will [Speak/Remain Silent] in the second half."
          *   *Twist:* Tokens are now required to speak in the debrief. (So if you directive said "Give token away," you are silenced. If you said "Keep," you can speak).
          *   *Wait, the Ulysses Clause is the core.* If they write "If I ask to change this, ignore me," they are stuck.

      *   **Addressing Predictable Failures:**
          *   *Vague directives:* Provide examples on the board. "I will not speak" vs "I will be quiet."
          *   *Group won't enforce:* Facilitator must be the enforcer, group votes on *release*.
          *   *Popularity contest:* Secret ballot is good. Frame the question: "Is the *instruction* still valid?" not "Do we like *Sarah*?"
          *   *Time:* 16 people is a lot for individual pleas. Limit pleas to those who want release.

  4.  **Developing the Debrief:**
      *   Map the experience to the philosophical concepts.
      *   Past Self (Writer) vs. Present Self (Pleader).
      *   The Group (Society/Proxy).
      *   The Ulysses Clause (The paradox of binding oneself).
      *   The Takeaway: Bindingness is the point, but also the danger.

  5.  **Facilitator Notes:**
      *   Tone: Serious but safe.
      *   Safety valve: Allow people to opt-out if it gets too emotional (father's illness context).
      *   What the facilitator must say: The connection to advance directives without making it a medical lecture.

  6.  **Review against Constraints:**
      *   90 mins? Yes.
      *   16 people? Yes.
      *   Materials? Index cards, envelopes, tokens, whiteboard, timer.
      *   No academic jargon? Keep language plain.
      *   User's specific mechanics (Ulysses clause, secret ballot, twist)? All included.

  7.  **Final Polish:**
      *   Make the "Twist" concrete. Let's go with: The Token determines who gets the last word.
      *   Ensure the "Ulysses Clause" is clearly explained on the card.
      *   Refine the voting mechanism to minimize bias.
      *   Add a "Safety Valve" for the facilitator to override if someone gets genuinely distressed.

  *(Self-Correction during drafting)*: I need to make sure the "Twist" doesn't feel like a "Gotcha." It needs to feel like *life changing circumstances*. I will frame it as "New Information."
  Also, 16 people pleading for release could take too long. I should limit the "Plea" phase to those who *want* out. Those happy with their directive stay silent.
  The "Popularity Contest" risk is high. I need to instruct the voters to vote on the *principle*, not the person. But people are people. I will advise the facilitator to highlight this bias in the debrief.

  Let's structure the Directive Card carefully.
  1. The Instruction.
  2. The Ulysses Clause (Checkbox).
  3. Signature.

  Let's structure the Twist.
  Directives are about the Token.
  Option A: Keep Token.
  Option B: Pass Token to Neighbor.
  Twist: Token holders must perform a mildly unpleasant task (e.g., stack chairs) OR Token holders get the final say.
  Let's go with **Final Say**. It fits the discussion theme.
  If you said "Pass Token," you lose your voice. If you said "Keep Token," you keep your voice.
  If you want to change it, you must plead.
  If you checked the Ulysses box, your plea counts *against* you.

  Okay, ready to write.
answer: |-
  This is a powerful, delicate session design. It moves the philosophical problem of "personal identity over time" from the abstract to the visceral. Because you are dealing with a group without academic training, the success of this session relies entirely on the *mechanics* feeling fair while the *outcome* feels uncomfortable.

  Here is the complete session plan, designed to fit your 90-minute window and 16 participants.

  # Session Title: The Promise You Made to Yourself

  ## Materials Needed
  *   **16 Index Cards** (pre-printed or written with the template below).
  *   **16 Envelopes** (to seal the cards).
  *   **16 Pens.**
  *   **16 Small Tokens** (distinctive stones, coins, or wooden blocks).
  *   **Whiteboard & Markers.**
  *   **Timer** (visible to you).
  *   **A Box** (to collect envelopes).
  *   **Slips of paper for voting** (half the size of index cards).

  ## The Directive Card Template
  *Write or print this clearly on the index cards:*

  > **DIRECTIVE**
  >
  > **1. My Instruction:** (Choose one)
  > [ ] I will KEEP my token until the end of the evening.
  > [ ] I will GIVE my token to the person on my left within 10 minutes.
  >
  > **2. The Ulysses Clause:** (Optional)
  > [ ] **CHECK THIS BOX IF:** I want this instruction to stand even if I change my mind later. If I ask to be released from this choice, treat that request as proof that I am not thinking clearly, and do not let me change it.
  >
  > **3. Signature:** ___________________ (This validates the contract).

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & The Contract
  **Goal:** Establish safety and the stakes.
  *   **Welcome (2 mins):** Acknowledge the group. State the theme simply: *"Tonight we are testing how much power our past selves should have over our present selves."*
  *   **The Rules (5 mins):**
      *   Explain the Token: It is a prop for tonight. It has no value yet.
      *   Explain the Directive: They will write a rule for their own behavior tonight.
      *   **Crucial Rule:** Once sealed, the directive is binding *unless* the group votes to release them.
      *   **Safety Valve:** Tell them: *"If at any point you feel genuine distress, come to me privately. I have the final veto to protect people, though I will try not to use it."*
  *   **Distribution (3 mins):** Hand out cards, pens, tokens, and envelopes.

  ### 0:10 – 0:25 | Writing the Directive (The Past Self)
  **Goal:** Get them to commit while they are "rational."
  *   **Instruction:** Ask them to sit apart (not in circles yet) to write privately.
  *   **Prompt:** *"Imagine you are the best version of yourself. What rule should that version set for the person you will be in an hour? Choose Keep or Give. Decide on the Ulysses Clause."*
  *   **Facilitator Note:** Walk around. If someone writes something vague (e.g., "I will be nice"), stop them. *"Make it checkable. Can I prove you did it or not? If not, rewrite it."*
  *   **Sealing:** They sign, fold, seal, and write their name on the envelope. Collect them in the box.
  *   **Token Phase:** Hand out the physical tokens now. Give them 5 minutes to mingle. If they chose "Give," they must hand their token to their left. If "Keep," they hold it. Collect the envelopes; do not open them yet.

  ### 0:25 – 0:30 | The Twist (The Changed World)
  **Goal:** Change the value of the choice without changing the rule.
  *   **Gather:** Have everyone sit in the main circle.
  *   **The Reveal:** *"When you wrote your directives, the token was just a object. The situation has changed. We are now out of time. The person holding a token at the end of the night gets to choose the topic for our next meeting. The person without a token has no say."*
  *   **The Conflict:**
      *   Those who kept tokens now hold power (they may feel proud or burdened).
      *   Those who gave tokens away have lost their voice (they may feel regret).
      *   **The Ulysses Trap:** Those who checked the box cannot ask for their token back without proving the clause right.

  ### 0:30 – 0:60 | Living with Consequences
  **Goal:** Let the tension simmer.
  *   **Activity:** Run a standard discussion on a neutral topic (e.g., "Is it better to plan holidays carefully or spontaneously?").
  *   **Enforcement:** You are the enforcer. If someone with a "Give" directive tries to take a token back, or a "Keep" directive tries to give it away, interrupt gently. *"Check your envelope. You are bound."*
  *   **Observation:** Watch who looks anxious. Watch who looks smug. Do not open the envelopes yet.

  ### 0:60 – 0:75 | The Plea for Release (The Present Self)
  **Goal:** Test the authority of the past self.
  *   **Call for Pleas:** *"If your directive no longer fits who you are right now, you may ask the group to release you. You must explain why."*
  *   **The Ulysses Check:** Before they speak, ask: *"Did you check the box that says your request should be ignored?"*
      *   **If Yes:** They are not allowed to plead. Remind them: *"You told us that asking to change your mind proves you shouldn't be allowed to."* (This will be the most intense moment).
      *   **If No:** They may plead.
  *   **The Vote:**
      *   For each plea, hold a secret ballot.
      *   **Question on Board:** *"Is this instruction still valid?"* (Not "Do we like this person?")
      *   Hand out voting slips. **Yes** = Enforce the old rule. **No** = Release them.
      *   Collect and count aloud. Majority rules.
  *   **Resolution:** If released, they can swap tokens. If not, they stay bound. Open the envelopes of those who didn't plead to verify compliance.

  ### 0:75 – 0:90 | Debrief (The Philosophical Payoff)
  **Goal:** Map the feelings to the concepts.
  *   **Discussion:** Do not lecture. Ask questions that lead them to your conclusion.
  *   **Key Questions:**
      1.  *"For those who were bound: Did it matter that the 'you' who wrote the rule was the same person as the 'you' living it?"*
      2.  *"For those who voted: Did you vote based on whether the rule was good, or whether you liked the person asking?"* (Highlight the popularity contest risk).
      3.  *"For those with the Ulysses Clause: How did it feel to be silenced by your own earlier wisdom?"*
  *   **The Takeaway (Your Closing):** Summarize the point (see "Facilitator Notes" below).

  ---

  ## Facilitator Notes: Handling the Risks

  You anticipated three specific failures. Here is how to head them off without lecturing.

  ### 1. Vague Directives
  *   **Risk:** "I will be generous." This cannot be enforced.
  *   **Fix:** During the writing phase (min 10-25), circulate. If you see vagueness, say: *"I can't measure that. Make it physical. Will you hold the token or not? Will you speak or not?"* If they hand you a vague card at the end, rule it **void** and they default to "Keep Token." This reinforces the need for clarity in advance directives.

  ### 2. The Group Won't Enforce
  *   **Risk:** Everyone votes to release everyone because "we're nice."
  *   **Fix:** Frame the vote explicitly. *"You are not voting on Sarah. You are voting on whether a promise made 45 minutes ago is still valid today. If we release everyone, the experiment fails."*
  *   **Inoculation:** In the intro, say: *"If we never enforce a rule, the rule is worthless. I need you to be willing to let someone be uncomfortable if their past self demanded it."*

  ### 3. The Popularity Contest
  *   **Risk:** People vote to release their friends and bind their enemies.
  *   **Fix:** The **Secret Ballot** is essential. Do not do a show of hands.
  *   **Debrief Hook:** If you suspect this happened, bring it up in the debrief. *"I wonder if we voted on the person or the principle. If we voted on the person, then the 'law' didn't matter, only our friendships did. That's one way to solve the problem, but is it a fair one?"*

  ---

  ## The Debrief: Mapping the Experience

  You want them to see that the authority question isn't about identity, but about **bindingness**. Use this structure for your closing remarks (5 minutes):

  1.  **The Identity Illusion:** *"We often ask: 'Am I the same person I was an hour ago?' But tonight, you saw that it doesn't matter if you are the same person. What mattered was whether the **rule** had teeth."*
  2.  **The Value of Binding:** *"Why did we write the directives? To protect us from weakness. The person who checked the Ulysses Box knew they might be weak later. They wanted to be bound."*
  3.  **The Danger of Binding:** *"But when the world changed (the Twist), that binding became a trap. The very thing that made the directive strong (that you couldn't change it) is what made it dangerous."*
  4.  **The Conclusion:** *"Advance directives aren't about whether you are the same person. They are about whether you trust your future self to know what your past self knew. Tonight, some of you trusted your past self and lost your voice. Some trusted your present self and broke your word. There is no clean answer, only the cost of the choice."*

  ---

  ## What You Must Say (The "Lecture" Portion)

  The activity cannot reproduce the **medical reality** of your father's illness. The group is playing with tokens; real life involves pain and dignity. You must bridge this gap in the final 5 minutes.

  **Say this:**
  *"Tonight we played with tokens and topics. In the real world, the 'token' is medical treatment, and the 'twist' is a diagnosis no one predicted. The discomfort you felt when you couldn't get your token back? That is a small shadow of the frustration a family feels when a living relative fights with a piece of paper written by someone who is no longer here to explain it. I brought you here tonight because I needed to feel that tension with you, rather than carry it alone."*

  ## Predictable "First Time" Glitches

  1.  **The "Joker":** Someone will write a joke directive (*"I must bark like a dog"*).
      *   **Fix:** Reject it at the writing stage. *"This needs to be a real constraint you are willing to live with. If you can't take it seriously, don't write it."*
  2.  **The "Martyr":** Someone with the Ulysses Clause will realize they are trapped and get genuinely upset.
      *   **Fix:** Use your Safety Valve. If they are distressed, override the game. *"The game stops where real harm begins. I am releasing you, but we will discuss why this felt like harm in the debrief."*
  3.  **The "Tie":** A vote comes out 8-8.
      *   **Fix:** You hold the casting vote. Use it to **enforce** the directive. The lesson is stronger if the past self wins at least once.

  ## Final Preparation Checklist
  *   [ ] Print/Write the Directive Cards (add the Ulysses checkbox clearly).
  *   [ ] Test the Timer (ensure you keep the Writing phase strict).
  *   [ ] Prepare the Voting Slips (Yes/No).
  *   [ ] Decide on your "Safety Valve" threshold (When do you intervene for emotional safety?).

  This design respects your group's non-academic background by letting the *mechanics* teach the theory. They will leave understanding the paradox of pre-commitment not because you explained it, but because they lived it.
