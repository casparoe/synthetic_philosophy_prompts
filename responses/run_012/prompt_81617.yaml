answer: |-
  **Brainstorm**
  *   **Core Goal:** Isolate moral responsibility from the ability to do otherwise.
  *   **Key Mechanism:** Counterfactual interveners (chip) vs. actual constraints (lock).
  *   **Critical Flaw:** Does the scenario leave *any* alternative possibility open (flicker of freedom)?
  *   **Responsibility Check:** Does knowledge of the constraint introduce coercion or duress?
  *   **Metaphysics:** Does the case rely on determinism (#7) or work even if indeterminism is true (#1)?

  **The ranking**
  1. **Plain chip** — Tier S, Damage Score 10 — The canonical counterexample: responsibility intuition remains high while alternatives are cleanly removed by a counterfactual guarantor.
  2. **Future-self chip** — Tier S, Damage Score 10 — Logically identical to the plain chip; the origin of the guarantee doesn't change the structural lack of alternatives.
  3. **Locked door** — Tier A, Damage Score 9 — Removes alternatives effectively, but the physical lock is an actual constraint, which feels more coercive than a silent chip.
  4. **No chip at all** — Tier B, Damage Score 6 — Damages PAP only if you already accept compatibilism; otherwise, it denies responsibility entirely rather than separating it from alternatives.
  5. **Known chip** — Tier C, Damage Score 4 — Knowledge of the threat introduces duress, making it unclear if the action was truly voluntary or just compliance.
  6. **Picky chip** — Tier D, Damage Score 1 — Fails to remove all alternatives; you could still have walked past for reasons the chip didn't monitor.
  7. **Leaky chip** — Tier D, Damage Score 0 — Alternatives clearly exist because the chip might fail, so PAP remains fully intact here.

  **Why they landed where they did**
  The top two succeed because the chip never fires, leaving your actual decision untouched while guaranteeing the outcome. This isolates the "actual sequence" of your choice from the "alternative sequence" blocked by the device. You feel responsible, yet you couldn't have done otherwise, which is exactly what kills PAP. The locked door is slightly weaker because the lock is an actual physical barrier, not just a counterfactual guarantee; some argue being physically confined undermines responsibility more than a silent brain chip.

  The no-chip scenario relies entirely on your metaphysical stance; if you think determinism kills responsibility, this case offers no counterexample to PAP, just a denial of responsibility. The known chip introduces psychological coercion; if you help because you fear the zap, your responsibility is diminished, weakening the claim that you are responsible without alternatives. Finally, the leaky and picky chips fail because they leave "flickers of freedom" open. In the leaky version, the chip might fail, so you could have walked past. In the picky version, you could have walked past for unmonitored reasons. Since alternative possibilities exist in these last two, PAP survives them completely.

  **Where I'm probably wrong**
  I might be underrating the Locked Door case. Some philosophers argue physical constraints are intuitively clearer than invisible chips, making the "could not have done otherwise" premise stronger without triggering sci-fi skepticism. If you find brain chips implausible, the locked door becomes the strongest case, potentially swapping places with the Plain Chip. Additionally, if you are a committed compatibilist, the No Chip case becomes a 10, as determinism alone refutes PAP for you.

  **Bottom line**
  PAP is severely damaged by the Plain and Future-self chips because they show responsibility persisting even when alternatives are counterfactually blocked. However, a weakened version of PAP might survive if it requires "robust" alternative possibilities rather than just any logical possibility.
