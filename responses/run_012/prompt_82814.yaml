prompt: |-
  Me and my friend Ana just spent like three hours arguing about the gender-equality paradox — you know, the finding that countries scoring higher on gender equality show *bigger* sex differences in which fields people go into, women avoiding STEM-type work more rather than less — and I want to actually settle it instead of going in circles again. She's the dispositionalist: culture stops pushing, nature shows through. I'm the structuralist: it's an artifact of what we measure and of wealth, not of women being freer. So please draft the joint statement of an adversarial collaboration we could both put our names to.

  What I want in it: the claims we both actually accept, including about the paradox itself and about what would follow for nature, culture or justice if either side turned out right — I suspect we agree that a difference in averages wouldn't license much about fair treatment given how much the distributions overlap, but get it in writing. Then the disagreements, each phrased the way the person who holds it would accept, no strawmen. Then the cruxes — the sub-questions where settling it would actually move one of us.

  Stuff we kept talking past each other on, so force it:

  - What 'gender equality' even means here: a country's score on some composite index of pay and representation, versus the norms people actually live under, versus how much economic security a woman has to pick a low-paid field for love. Those come apart, and I want it said which one each of us is really using.
  - What the outcome should be: what 15-year-olds say they expect to do, versus who gets degrees, versus who ends up in the job. And whether the reversal is only about which field you enter or also about pay and promotion. Ana talked like it's the whole picture and I dont think it is.
  - How much is development and wealth rather than equality, since the two travel together — what would it take to pull them apart, and what does each of us predict if someone did?
  - I have a hunch the same flip shows up in other measured things too, like personality traits, not just occupations, but honestly I'm not sure — have them say what difference that would make either way.
  - Whether comparing average scores across countries means anything when the questionnaires might not be measuring the same thing in each place. I think this is my strongest point and she waves it off.
  - Her claim that interests are 'deeper' than opportunities versus my claim that the opportunity structure is doing the work. Is that even a testable disagreement or just two ways of talking? If part of our fight is verbal, say which part.

  For each crux, give a case, comparison or data pattern we'd both agree bears on it, plus what each of us predicts about it in advance. Numbered agreed-claims section, then a table for the disagreements. Keep it tight, flag anything neither of us has thought of, and don't pad it.
