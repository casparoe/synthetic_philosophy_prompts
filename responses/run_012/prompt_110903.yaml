prompt: |-
  I'm a software engineer on the clinical policy team at a mid-sized health plan, and I have no formal background in philosophy — what I know about the metaphysics of disease I've picked up from arguing with our medical directors in hallway conversations. We're rebuilding our prior-authorization workflow, and the step that keeps blowing up is the one where a nurse reviewer has to decide whether the thing in front of them counts as a disease, or as a medical necessity, at all. Right now that call is made case by case and mostly by seniority, and the inconsistency shows up in our appeals data: the same presentation gets classified one way for one member and the opposite way for the next, and nobody can tell me which reviewer was right. I've been told to write the spec for that step, and I'd rather not just hard-code whatever our current medical director happens to believe. The debate I keep being pointed at is the naturalism-versus-normativism fight in philosophy of medicine — roughly, Boorse's line that a disease is a statistically abnormal reduction in functional efficiency and is a value-free matter of biology, against the normativist line that "disease" is at bottom a value judgment about what is unwanted or harmful, with Wakefield's hybrid (a genuine dysfunction of some natural function, plus harm) sitting between them. I need that made operational. I don't want citations, a reading list, or a summary of who said what — I need a procedure.

  Concretely: give me a decision procedure that a reviewer with no philosophy training can run in about ten minutes, laid out in the order the questions would actually be asked, with what counts as a sufficient answer at each step, where the procedure terminates with "not a disease," where it terminates with "disease," and — this is the part I care about most — where it hands the decision back to a person because the question remaining is a values call rather than a factual one. Tell me which distinctions have to survive the compression and which I can safely drop; in particular, keep separate (a) statistically unusual in some reference population, (b) a failure of some biological or psychological mechanism to do what it was selected or designed to do, and (c) unwanted, harmful, or distressing — and tell me what to do when those three come apart. Say something about how to choose the reference class, since I suspect a large share of our inconsistency is that different reviewers are quietly comparing members against different baselines: age, sex, ancestry, the population the member actually lives in versus some idealized healthy norm. And be explicit about which steps are thresholds dressed up as facts. If "clinically significant distress" or "interferes with daily functioning" is doing the real work, say so, so I can log it as a value judgment and route it to a medical director for sign-off instead of letting the software pretend it decided.

  Then run the procedure end to end on three cases, and please don't sandbag them. First: a member from a small founder population in which a particular enzyme variant is present in roughly forty percent of adults and produces mild joint pain starting around age fifty; the community treats this as ordinary aging and mostly doesn't seek care for it. Second: a member with chronically elevated blood pressure that the specialist attributes to years of night-shift work and unstable scheduling, where the underlying mechanism is the same one we would call a disease in someone with a different job. Third: a member with a harmless anatomical variant — no pain, no loss of function, normal lifespan — who is nonetheless screened out of their trade by an employer's physical exam and is now depressed about it. For each case, show the answers to each question, where the procedure stops, and what the reviewer would actually see on screen. Include at least one case where the procedure returns an answer my company won't like — either "not a disease, deny" or "disease, cover it" — and say why I shouldn't just overrule it. Finally, tell me what this procedure cannot do, where it will misfire, and whether the decision to encode any version of it in software is itself one of the values calls rather than the neutral engineering choice I'd like to think it is.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Software engineer on a clinical policy team at a mid-sized health plan.
      *   **Problem:** Inconsistency in prior-authorization (PA) workflow regarding "disease" vs. "medical necessity" classification. Current process relies on seniority/intuition, leading to appeals.
      *   **Goal:** A spec for a decision procedure (algorithm/workflow) for nurse reviewers to determine if a condition counts as a "disease" for coverage purposes.
      *   **Constraints:**
          *   No philosophy jargon/citations/reading lists.
          *   Operationalize the Naturalism (Boorse) vs. Normativism vs. Hybrid (Wakefield) debate without naming them explicitly.
          *   Must take ~10 minutes.
          *   Must distinguish: (a) Statistical abnormality, (b) Mechanism failure (dysfunction), (c) Harm/Undesirability.
          *   Must handle Reference Class selection explicitly.
          *   Must identify where value judgments occur (route to Medical Director).
          *   Must run three specific test cases (Founder population enzyme, Night-shift hypertension, Harmless anatomical variant causing social harm).
          *   Must include an outcome the company might dislike and explain why not to overrule.
          *   Must include limitations and meta-commentary on the ethics of encoding this.
      *   **Tone:** Professional, direct, engineering-focused, pragmatic.

  2.  **Deconstruct the Philosophy into Logic:**
      *   *Naturalism (Boorse):* Disease = Statistical deviation + Functional impairment. (Value-free).
      *   *Normativism:* Disease = Undesirable condition. (Value-laden).
      *   *Hybrid (Wakefield):* Disease = Harmful Dysfunction (Mechanism failure + Harm).
      *   *Operational Translation:*
          1.  **Reference Class:** Who are we comparing this person to? (Crucial for "statistical").
          2.  **Function/Mechanism:** Is a biological system failing to do its evolutionary/physiological job? (The "Naturalist" core).
          3.  **Harm/Value:** Is this causing pain, risk, or disability *that we care about*? (The "Normativist" core).
          4.  **Intersection:** If Mechanism fails + Harm exists = Disease (Cover). If Mechanism works + Harm exists = Social Problem (Maybe not cover). If Mechanism fails + No Harm = Anomaly (Don't cover).

  3.  **Drafting the Procedure (The "Spec"):**
      *   *Structure:* Linear flowchart style.
      *   *Inputs:* Patient data, Clinical notes, Policy guidelines.
      *   *Step 1: Reference Class.* Need to standardize this. Age/Sex are standard. Ancestry/Population is tricky but necessary for the "Founder" case.
      *   *Step 2: Mechanism/Dysfunction.* Is a physiological system underperforming relative to its design?
      *   *Step 3: Harm.* Is there pain, risk, or functional loss?
      *   *Step 4: The Gap.* If Mechanism = No but Harm = Yes, that's a Value Call.
      *   *Step 5: The Gap.* If Mechanism = Yes but Harm = No (or contested), that's a Value Call.
      *   *Output:* Cover (Disease), Deny (Not Disease), or Escalate (Value Judgment).

      *Refining the "Value Call":* The prompt asks to distinguish where the software stops and a human (Medical Director) starts. The nurse reviewer shouldn't make the hard value calls. The procedure should flag them.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Founder Enzyme):* High prevalence (40%). Mechanism: Enzyme variant. Function: Joint pain. Harm: Mild, culturally normalized.
          *   *Analysis:* Statistically normal *for that group*. Mechanism: Is it a failure or just a variant? Harm: Low/Contested.
          *   *Outcome:* Likely "Not Disease" due to lack of harm/dysfunction relative to reference class, OR "Value Call" on whether prevalence negates dysfunction. Let's aim for "Not Disease" to challenge the "statistical abnormality" rule.
      *   *Case 2 (Night-Shift HTN):* Mechanism: Stress response. Harm: High BP (risk). Context: Job.
          *   *Analysis:* Mechanism is working as designed (stress response), but environment makes it harmful. Is the *mechanism* broken or the *environment*?
          *   *Outcome:* Disease (Hypertension is treatable risk), but the *cause* is occupational. This tests the "dysfunction" vs. "normal response to bad environment" line.
      *   *Case 3 (Anatomical Variant + Depression):* Mechanism: Normal. Harm: Social/Economic (can't work) -> Depression.
          *   *Analysis:* Biological mechanism = Fine. Harm = Real (depression).
          *   *Outcome:* The depression is a disease. The variant is not. This tests the "Harm without Dysfunction" line.

  5.  **Addressing the "Company Won't Like It" Constraint:**
      *   Health plans generally want to deny. So a "Cover It" outcome that seems borderline is the risk.
      *   Alternatively, a "Deny" that seems cruel.
      *   Let's make Case 3 result in "Cover Treatment for Depression, Deny Correction of Variant." This is standard, but maybe Case 1 results in "Deny" despite pain, which might look bad if that population is a protected class.
      *   Better: Case 2. If we classify HTN as a disease, we cover meds. If we classify it as "normal response to shift work," we might deny. The procedure should likely say "Disease" (cover meds) because the physiological risk exists regardless of cause. Overruling this to deny creates liability.

  6.  **Addressing the Meta-Commentary:**
      *   What can't this do? It can't solve resource allocation. It can't define "health" objectively.
      *   Is encoding this a value call? Yes. It reifies specific definitions of normalcy.

  7.  **Iterative Refinement of the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is it too abstract?
      *   *Fix:* Make the questions Yes/No/Maybe. Define "Reference Class" clearly (Age/Sex first, then specific population if known).
      *   *Critique:* Where does the Medical Director come in?
      *   *Fix:* Step 4 is the "Escalation Point." If the biological facts and the harm facts don't align, the Nurse stops and flags for MD.
      *   *Critique:* The prompt asks to keep (a), (b), and (c) separate.
      *   *Fix:* Ensure Step 1 is Stats, Step 2 is Mechanism, Step 3 is Harm.

  8.  **Finalizing the Test Cases against the Procedure:**
      *   *Case 1:* Stats (Normal for group). Mechanism (Debatable). Harm (Low/Cultural). -> Result: Not Disease (or Value Call). Let's make it a Value Call on "Is prevalence enough to negate dysfunction?"
      *   *Case 2:* Stats (Abnormal). Mechanism (Functional stress response). Harm (High). -> Result: Disease (Harm trumps mechanism origin).
      *   *Case 3:* Stats (Normal). Mechanism (Normal). Harm (High - Social). -> Result: Not Disease (Variant), Disease (Depression).

      *Wait, I need one outcome the company won't like.*
      *   If Case 1 is a protected population, denying coverage for pain because "it's normal for you" looks like discrimination. I should highlight this risk.
      *   Or, Case 3: Covering the depression treatment is costly, but denying the variant correction is legally safe.
      *   Let's go with Case 2: The procedure forces coverage of HTN meds even if caused by job, because the physiological risk is real. Company might want to deny as "occupational/worker's comp." The procedure says "Medical Disease."

  9.  **Drafting the Content:**
      *   *Intro:* Acknowledge the constraint.
      *   *The Procedure:* 5 Steps.
      *   *The Test Cases:* Walk through step-by-step.
      *   *The "Don't Overrule" section:* Liability and consistency.
      *   *Limitations/Ethics:* The "Is software neutral?" question.

  10. **Review against constraints:**
      *   No citations? Checked.
      *   10 mins? Checked (5 steps).
      *   Distinguish Stats, Mechanism, Harm? Checked.
      *   Reference class logic? Included in Step 1.
      *   Value calls routed to MD? Included in Step 4/5.
      *   Three specific cases? Included.
      *   Unpopular outcome? Included.
      *   Meta-ethics? Included.

  11. **Final Polish:** Ensure tone is "Engineer to Engineer" but respectful of the clinical gravity. Avoid "Philosophy 101" language. Use "Policy Logic" language. (Self-correction: Ensure I explicitly mention *which* steps are thresholds dressed as facts).

  *(Self-Correction on Case 1)*: If 40% have it, is it statistically abnormal? No. Boorse says disease *must* be statistically abnormal. If I follow Boorse strictly, it's not a disease. But it causes pain. This is the conflict. The procedure needs to flag this conflict.
  *(Self-Correction on Case 3)*: The variant isn't a disease. The depression is. The PA request is likely for the variant correction (e.g., surgery to fix the variant). The procedure should deny the surgery but flag the depression for treatment.

  *(Refining the "Value Call")*: The prompt asks to tell them *where* to hand it back. Step 4 should be the "Conflict Detection" step.

  Let's write it.cw
answer: |-
  ### Specification: Clinical Classification Decision Procedure (CCDP)

  **Objective:** Standardize the determination of "Disease Status" for Prior Authorization (PA) requests.
  **User:** Nurse Reviewer (RN).
  **Time Budget:** 10 minutes per case.
  **Output:** `COVER` (Disease), `DENY` (Not Disease), or `ESCALATE` (Value Judgment Required).

  ---

  ### The Procedure

  **Step 1: Define the Reference Class (The "Normal" Baseline)**
  *Goal: Fix the statistical baseline to prevent reviewer drift.*
  *   **Action:** Select the population against which the member's biometrics are compared.
  *   **Logic:**
      1.  Start with **Age + Sex**. (Mandatory).
      2.  If a specific genetic/ancestral population is documented and clinically relevant (e.g., founder effect, known prevalence data), select **Sub-Population**.
      3.  If no specific data exists, default to **General Insured Population**.
  *   **Threshold:** Do not use "Ideal Health" as a baseline. Use "Typical Functioning for this Group."
  *   **Data Required:** Member demographics, known genetic markers, epidemiological data in knowledge base.
  *   **Stop Condition:** If Reference Class cannot be determined, `ESCALATE`.

  **Step 2: Assess Statistical Deviation (Condition A)**
  *Goal: Determine if the trait is rare.*
  *   **Question:** Is the member's physiological state outside the 95th percentile (or 2 standard deviations) for the Reference Class defined in Step 1?
  *   **Inputs:** Lab values, imaging measurements, vitals.
  *   **Answers:**
      *   `YES` (Statistically Abnormal)
      *   `NO` (Statistically Typical)
      *   `UNKNOWN` (Data missing)
  *   **Note:** If `NO`, proceed to Step 3. Do not stop. High prevalence does not automatically rule out disease (e.g., cavities in some populations), but it flags a conflict.

  **Step 3: Assess Mechanism Dysfunction (Condition B)**
  *Goal: Determine if a biological system is failing its physiological design.*
  *   **Question:** Is a specific biological or psychological mechanism failing to perform its evolved or physiological function *independent of the environment*?
  *   **Inputs:** Pathophysiology notes, specialist diagnosis, mechanism of action.
  *   **Heuristic:** Ask: "If this person were in a low-stress, resource-rich environment, would this system still fail?"
  *   **Answers:**
      *   `YES` (Internal Failure)
      *   `NO` (Normal Response to Environment)
      *   `UNCLEAR` (Mechanism disputed)
  *   **Critical Distinction:** High blood pressure due to kidney failure = `YES`. High blood pressure due to acute stress = `NO` (Mechanism working as designed to handle stress).

  **Step 4: Assess Harm/Undesirability (Condition C)**
  *Goal: Determine if the state causes negative consequences.*
  *   **Question:** Does this state cause pain, significant risk of future pathology, or impairment of daily activities *that the member seeks to mitigate*?
  *   **Inputs:** Member complaints, functional assessments, risk calculators.
  *   **Answers:**
      *   `YES` (Harm Present)
      *   `NO` (Asymptomatic/Neutral)
      *   `SOCIAL ONLY` (Harm is purely economic/social, e.g., cannot get a job, but no physical pain/risk).

  **Step 5: Logic Gate & Routing**
  *Goal: Combine A, B, and C to determine output.*

  | Condition A (Stats) | Condition B (Mechanism) | Condition C (Harm) | **System Output** | **Reasoning** |
  | :--- | :--- | :--- | :--- | :--- |
  | Abnormal | Dysfunction | Harm | **COVER** | Classic Disease. |
  | Typical | Dysfunction | Harm | **ESCALATE** | **Value Call.** (Common but harmful dysfunction). |
  | Abnormal | No Dysfunction | Harm | **ESCALATE** | **Value Call.** (Normal mechanism causing harm, e.g., pregnancy, allergy). |
  | Typical | No Dysfunction | Social Only | **DENY** | Social Problem, not Medical Disease. |
  | Any | Any | No Harm | **DENY** | Anomaly, not Disease. |
  | Unknown | Any | Any | **ESCALATE** | Insufficient Data. |

  **Instructions for `ESCALATE`:**
  *   Do not make a coverage decision.
  *   Tag the case: `CONFLICT_TYPE: STATS_VS_HARM` or `CONFLICT_TYPE: MECHANISM_VS_HARM`.
  *   Route to Medical Director (MD).
  *   **Note to Engineer:** Log the specific values of A, B, and C. The MD is not deciding facts; they are deciding policy weight.

  ---

  ### Test Cases (End-to-End Run)

  #### Case 1: The Founder Population Enzyme
  *   **Profile:** 52yo Male, specific founder population. 40% prevalence of Enzyme Variant X. Mild joint pain. Community views as aging.
  *   **Step 1 (Reference):** Sub-Population (Founder Group).
  *   **Step 2 (Stats):** `NO` (40% prevalence is statistically typical for this class).
  *   **Step 3 (Mechanism):** `UNCLEAR` / Leaning `NO`. (Is it a broken enzyme or just a different variant? If it metabolizes differently but sustains life, is it dysfunction?) Let's code as `NO` (Variant, not failure).
  *   **Step 4 (Harm):** `YES` (Mild pain), but member seeks care now.
  *   **Step 5 (Logic):** Stats=`NO`, Mechanism=`NO`, Harm=`YES`.
  *   **System Output:** **DENY** (Social/Environmental mismatch) OR **ESCALATE** (If Mechanism is disputed).
  *   **Reviewer Screen:** *Status: DENY. Reason: Condition is statistically typical for reference class and no internal mechanism failure identified. Harm appears to be intolerance to variant rather than pathology.*
  *   **Risk:** This looks like discrimination. The procedure says "Not a disease" because it's normal *for them*.
  *   **Why you shouldn't overrule:** If you overrule to `COVER`, you establish that statistical normalcy is irrelevant. This opens coverage to every genetic variant common in any group that causes discomfort, potentially blowing the budget on maintenance for non-pathological traits. However, you must flag this for Legal/Compliance regarding disparate impact.

  #### Case 2: Night-Shift Hypertension
  *   **Profile:** 45yo Female. BP 150/95. Specialist attributes to chronic circadian disruption from night shifts. Mechanism is stress response.
  *   **Step 1 (Reference):** Age + Sex.
  *   **Step 2 (Stats):** `YES` (Abnormal for age/sex).
  *   **Step 3 (Mechanism):** `NO`. (The cardiovascular system is responding correctly to perceived stress/sleep deprivation. The pump is working; the input is chronic stress).
  *   **Step 4 (Harm):** `YES` (High risk of stroke/renal failure).
  *   **Step 5 (Logic):** Stats=`YES`, Mechanism=`NO`, Harm=`YES`.
  *   **System Output:** **ESCALATE** (`CONFLICT_TYPE: MECHANISM_VS_HARM`).
  *   **Reviewer Screen:** *Status: ESCALATE TO MD. Reason: Physiological harm is present, but mechanism appears to be a normal response to environmental stressors rather than internal dysfunction.*
  *   **The "Company Won't Like It" Outcome:** The Medical Director will likely approve coverage for **anti-hypertensives**.
  *   **Why:** Even if the *cause* is occupational, the *risk* is biological. Denying coverage for BP meds because "your job caused it" creates massive liability if the member has a stroke. The procedure correctly identifies the tension, but the safe bet is to treat the harm. Do not overrule to `DENY`. Worker's Comp might be the primary payer, but Health Plan is secondary; denying outright is unsafe.

  #### Case 3: The Anatomical Variant & The Job Loss
  *   **Profile:** 30yo Male. Extra rib (cervical rib). No pain, no vascular compression, normal lifespan. Employer physical exam disqualifies him from trade. Member is depressed. Request: Surgery to remove rib.
  *   **Step 1 (Reference):** Age + Sex.
  *   **Step 2 (Stats):** `NO` (Rare, but anatomical variants are common). Let's say `YES` (Statistically uncommon).
  *   **Step 3 (Mechanism):** `NO`. (Rib is bone. It is not failing to be a bone. It is not compressing nerves. Function is intact).
  *   **Step 4 (Harm):** `SOCIAL ONLY` (Job loss). Depression is present, but request is for *rib removal*, not psych care.
  *   **Step 5 (Logic):** Stats=`YES`, Mechanism=`NO`, Harm=`SOCIAL ONLY`.
  *   **System Output:** **DENY**.
  *   **Reviewer Screen:** *Status: DENY. Reason: No physiological dysfunction identified. Harm is socioeconomic, not medical. Recommend referral for Mental Health (Depression) coverage.*
  *   **Why:** This is the hard line. Covering surgery for a functional body part to satisfy an employer's arbitrary standard medicalizes social discrimination. The procedure protects the plan from covering cosmetic/social fixes. The depression should be covered separately as a `COVER` (Dysfunction of mood regulation + Harm).

  ---

  ### Limitations and Meta-Commentary

  **1. What this procedure cannot do:**
  *   **Resource Allocation:** It cannot tell you if the plan can *afford* to cover a condition. It only tells you if the condition *fits the definition*.
  *   **Resolve Scientific Disagreement:** If Step 3 (Mechanism) is genuinely disputed in the literature (e.g., chronic fatigue syndrome, some autoimmune markers), the procedure will constantly `ESCALATE`. This is a feature, not a bug. It forces the Medical Directors to update the knowledge base, not the nurses to guess.
  *   **Detect Bias in Reference Classes:** If your "General Insured Population" data is biased against a certain ancestry, Step 1 will hard-code that bias. The procedure assumes the Reference Class data is clean. It is not.

  **2. Where it will misfire:**
  *   **Preventive Care:** Step 4 requires "Harm." Preventive measures (e.g., mastectomy for BRCA gene *before* cancer) often show `NO` current harm. You will need a separate "Risk Mitigation" workflow that bypasses Step 4 for specific CPT codes.
  *   **Chronic Pain without Pathology:** If Mechanism=`NO` (no visible damage) but Harm=`YES` (severe pain), this procedure routes to `ESCALATE`. If your MDs are conservative, this creates a bottleneck for fibromyalgia/chronic pain patients.

  **3. The Ethical Engineering Choice:**
  You asked if encoding this is a neutral choice. **It is not.**
  *   **Reification:** By choosing Step 3 (Mechanism) as a gatekeeper, you are privileging the "Naturalist" view of medicine. You are deciding that social suffering (Case 3) is less "real" than biological failure.
  *   **The Reference Class Trap:** In Step 1, if you allow "Sub-Population" to override "General," you risk creating a two-tier system where diseases in minority populations are denied because they are "normal for them" (Case 1). If you disallow "Sub-Population," you risk over-diagnosing normal variants as diseases.
  *   **The "Value Call" Illusion:** Routing `ESCALATE` to a Medical Director makes it look like a clinical decision. It is a **policy** decision. You are building software that hides a budget/policy choice behind a clinical workflow.

  **Recommendation:**
  Log every `ESCALATE`. If >15% of cases for a specific condition hit `ESCALATE`, do not let the MDs keep deciding individually. That is a signal that the spec (Steps 1-4) does not match the company's actual risk appetite. At that point, Policy must hard-code the answer, and you must update the Logic Gate in Step 5. Do not let the "Value Judgment" remain permanent; it is technical debt.
