answer: |-
  This is one of the most persistent and vexing problems in democratic theory, often referred to as the "Boundary Problem" or the "Problem of the *Demos*." Your colleague has reconstructed a version of the argument most famously associated with Frederick Whelan (1983) and Robert Goodin (2007), sharpened by recent work on border coercion (e.g., Arash Abizadeh). The argument is logically valid; if you accept the premises, the conclusion follows inescapably. To find the exit, we must determine which premise is the least defensible, or which inference masks a category error.

  Before identifying the break point, it is essential to map the terrain. A well-informed theorist recognizes five main families of response to the boundary problem:

  1.  **The Pre-Political (Nationalist) Solution:** This view holds that the *demos* is not a democratic creation but a pre-political fact, grounded in shared culture, language, or history (e.g., David Miller, Will Kymlicka). The boundary is fixed by nationhood, not voting.
      *   *Cost:* It sacrifices the democratic ideal that associations should be voluntary and makes membership a matter of luck rather than choice.
  2.  **The All-Affected Interests (AAI) Principle:** This is your colleague's Premise (1). It holds that anyone causally impacted by a decision should have a say.
      *   *Cost:* As the argument shows, causal chains are infinite. This leads to the "everything affects everything" problem, dissolving boundaries entirely into a global or intergenerational demos that is institutionally impossible.
  3.  **The All-Subjected (Coercion) Principle (ASP):** This modifies AAI to include only those subject to the coercive force of the law (e.g., Arash Abizadeh, Nancy Fraser).
      *   *Cost:* It narrows the scope, but faces the "meta-boundary" problem: the decision about who is subject to coercion is itself a coercive boundary decision. It stops the infinite regress of *interests* but not the regress of *jurisdiction*.
  4.  **The Constituent Power View:** This view accepts the paradox. The people (*pouvoir constitué*) cannot create themselves; only a revolutionary subject (*pouvoir constituant*) can. The boundary is an "a-legal" act that founds the legal order (e.g., Andreas Kalyvas, Hans Lindahl).
      *   *Cost:* It admits that the founding moment is necessarily undemocratic. Legitimacy must be generated retrospectively or recursively, not foundationally.
  5.  **The Pragmatic (Whelan) Solution:** Frederick Whelan argued the problem is theoretically insoluble. Therefore, we must accept existing boundaries as provisional conventions and focus on exit rights and internal democracy.
      *   *Cost:* It treats a normative question as a matter of administrative convenience, potentially cementing historical injustices.

  ### Diagnosing the Argument

  Your colleague's argument is a *reductio ad absurdum* of the unqualified All-Affected Interests principle. She is correct that if Premise (1) is absolute, democracy is impossible. You are correct that Premise (1) captures the moral core of democracy. The tension arises because the argument treats the *demos* as a static object that can be correctly sized, rather than a dynamic subject that constitutes itself.

  Let us address your specific question regarding the "Coercion Repair." Many theorists attempt to save the argument by replacing Premise (1) with an **All-Subjected Principle**: "A decision is legitimate only if everyone *coerced* by it participates."

  Does this solve the problem? **No, not entirely.** It mitigates the infinite regress of "interests" (since not every causal ripple is coercion), but it lets the problem back in through the side door you suspected. The question "Who is subject to our coercion?" is itself a boundary decision. If a state decides to enforce borders against outsiders, it coerces them. By the logic of the All-Subjected Principle, those outsiders must have a say in the border policy. If they have a say, they are members. If they are members, the border is open. If the border is open, the *demos* expands. The regress remains, though it is slightly shorter than the AAI regress.

  Therefore, merely swapping "affected" for "coerced" does not fix the structural flaw. The flaw lies deeper, in how the argument conceptualizes the act of boundary-setting itself.

  ### The Break Point: Step 3

  If I must give up exactly one step to save democratic theory from impossibility while preserving its core normative intuition, I would reject **Step 3**.

  > **Step 3:** *So, by (1) and (2), the decision to include some people and exclude others must itself be made by a body that includes everyone affected by that inclusion decision.*

  **Why this step looks plausible:**
  Step 3 appears to be a straightforward application of Premise (1). If (1) says "all affected must participate," and (2) says "boundary decisions affect people," then (3) concludes "boundary decisions need all affected to participate." It treats the decision about the *demos* as if it were just another decision *within* the *demos*, like a tax law or a foreign policy vote. It assumes a level playing field where the rules of procedure apply equally to the constitution of the players and the play of the game.

  **Why this step is wrong:**
  Step 3 commits a category error between **constituted power** and **constituent power**.
  *   **Constituted power** operates *within* an established legal order. Here, Premise (1) applies perfectly. Laws are made by the representatives of the people defined by the boundary.
  *   **Constituent power** is the act of *creating* that legal order and defining the people.

  Step 3 assumes that there is already a "body" available to make the inclusion decision. But if the decision is *about* who constitutes the body, then the body *does not yet exist*. You cannot summon a democratic procedure to define the participants of that very procedure without presupposing the answer. This is the "Paradox of Founding."

  By insisting that the boundary decision must be made *by a body that includes everyone affected*, Step 3 demands a logical impossibility: it requires the *demos* to exist prior to its own creation.

  **The Cost of Giving Up Step 3:**
  Giving up Step 3 is costly. It means admitting that **the initial drawing of democratic boundaries cannot be fully democratic.** It acknowledges that every *demos* rests on a founding act that is, strictly speaking, extra-democratic (whether that act was a revolution, a treaty, a conquest, or a historical accident).

  However, this cost is preferable to the cost of accepting Step 9 (that democracy is impossible). By rejecting Step 3, we shift the locus of legitimacy from the *origin* of the boundary to the *recursivity* of the boundary. A *demos* is legitimate not because it was born perfectly (which is impossible), but because it maintains mechanisms for self-revision. This validates your colleague's "revisability condition," but clarifies *why* it is necessary: it is not just a repair, it is the only source of legitimacy available for boundaries.

  ### Addressing the "Side Door" of Coercion
  You asked whether weakening the principle to "those coerced" lets the problem back in. As noted, it does. But rejecting Step 3 explains *why* it comes back in. The problem returns because the definition of "coercion" is itself a boundary decision. If we reject Step 3, we admit that the definition of the coercive sphere is a political struggle, not a pre-political fact discoverable by theory. We stop looking for a theoretical formula to fix the boundary and start looking at the political processes that contest it.

  ### What to Say to Your Colleague

  Here is the position you should take. You agree with her logic but disagree with her target. She thinks Premise (1) is the problem. You should argue that Premise (1) is the *goal*, but Step 3 is the *error* in applying it.

  **Tell her this:**

  "Your argument successfully proves that a *demos* cannot be *founded* democratically according to the Inclusion Principle. It does not prove that a *demos* cannot *operate* democratically.

  The error lies in **Step 3**. You are treating the decision about the boundary as a first-order legislative act subject to the Inclusion Principle. But the boundary decision is a second-order constitutive act. There is no 'body' available to make that decision until the decision is made. To demand that the excluded participate in the decision that excludes them is to demand that they already be included. It is a performative contradiction.

  If we reject Step 3, we do not have to abandon the Inclusion Principle (1) for ordinary politics. Instead, we accept that the boundary is a site of **constituent power**. It is necessarily provisional and grounded in political contestation rather than procedural perfection.

  This saves democracy from your Conclusion (9). Democracy is not impossible; it is just **recursive**. A *demos* is legitimate not because it got the boundary right at the start (which is impossible), but because it keeps the boundary open to contestation by those affected. Your 'revisability condition' isn't a repair to a broken argument; it is the only form legitimacy can take. We must give up the dream of a perfectly justified founding (Step 3) to save the reality of a legitimately functioning democracy (Premise 1)."

  **Summary of the Trade-off:**
  *   **Give Up:** Step 3 (The assumption that boundary decisions can be made by the democratic body they constitute).
  *   **Keep:** Premise 1 (The Inclusion Principle for constituted politics).
  *   **Cost:** Admitting that the origin of political communities is always somewhat arbitrary or coercive, and that legitimacy is a continuous process of negotiation rather than a one-time achievement.
  *   **Gain:** Democracy becomes feasible without sacrificing its core normative commitment to inclusion.

  This position allows you to honor the intuition that people should not be governed without a say (Premise 1), while acknowledging the philosophical reality that the "people" must exist before they can have a say. It transforms the Boundary Problem from a *refutation* of democracy into a *description* of its permanent political task.
