  Anyway here's what I actually want. Give me your number, but mostly break it down into the sub-questions it rests on, each with its own rough probability and one line on why, then show me how you mash them into the final number. The ones I think are in there: the chance my reduced buying moves production at all, like whether meat is more of a dial where a small demand drop means a little less meat gets made, or more of a switch where nothing happens until some huge number of people quit, and whether that differs between beef and, say, eggs or milk (I have a feeling it does but idk why); the chance that even a real marginal drop in demand turns into fewer animals being bred and raised, as opposed to the industry just eating the loss or dumping it or shipping it somewhere else; whether a tiny effect on a huge number of animals is comparable to a normal-sized effect on a few, since I think it's like two dozen chickens a year for a person which is a lot of chickens (??); how much of the good is actually about me at all vs. the maybe five people who'd notice and copy me; and whether the whole "I'm participating in a wrong even if my action changes nothing" thing is a separate kind of reason or just cope for people who want to feel clean. Also, this is the exact same puzzle as voting — my one vote basically never decides anything and I still feel like not voting is worse than voting third party — so if your meat answer also handles voting, say so, and if it doesn't, that seems like a problem.

  Then tell me which of those terms your number is most sensitive to, i.e. if you're wrong about one thing, which one flips the answer from yes to no. And what would actually change your mind — something I could in principle go find out (an industry number, a study, whatever) or an argument that would move you a lot, not just "more evidence." And please be honest about where your reasoning is most likely to be garbage here, including if the comparison I gave you is really three different questions wearing a trenchcoat, in which case say that instead of averaging them into one fake-precise number.
