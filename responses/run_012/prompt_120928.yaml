answer: |-
  You have independently rediscovered the central problem in the philosophy of conditionals from the last fifty years. The pattern you are describing has a well-established name: **Lewis's Triviality Results** (specifically, the dynamic variant concerning updating).

  The specific equation you are trying to uphold—identifying the probability of the conditional with the conditional probability—is known as **Adams' Thesis** (or "The Equation"). The proof that this thesis cannot hold universally within a standard probability framework is **Lewis's Triviality Theorem** (1976).

  However, your specific description of the *dialectical pattern*—that the rule works locally, collapses globally under updating, and that the fixes feel like vacuous concessions—deserves a precise carving. While I will not coin a new name for the theorem itself (as you need the standard term to search the literature), I will coin a label for the specific maneuver you identified regarding the restrictions: **The Vacuity Retreat**.

  Here is the carving you asked for, broken down by failure mode, assumptions, costs, and the status of the "rescue."

  ### 1. The Core Failure: What Exactly Breaks?
  You noted that the rule "eats itself" when turned into a general rule. In technical terms, the failure is a category error between **logic** and **probability**.

  *   **The Goal:** You want the conditional "If $A$, then $C$" to function as a standard proposition (let's call it $A \to C$) that can be assigned a probability $P(A \to C)$ within a Boolean algebra (the standard math of sets and logic).
  *   **The Constraint:** You want this probability to equal the conditional probability $P(C|A)$.
  *   **The Collapse:** David Lewis proved that if you demand $P(A \to C) = P(C|A)$ for *all* pairs of propositions in your belief system, your probability space must be **trivial**. This means you can only have probabilities of 0 or 1, or your system can only distinguish a tiny number of states. Essentially, for the equation to hold universally, you must be logically omniscient or uncertain about almost nothing.
  *   **The Updating Problem:** You specifically mentioned conditioning on new facts. This is the **Dynamic Triviality** result. Even if you manage to set up a system where the Equation holds at time $t_1$, if you update your beliefs via standard Bayesian conditioning on some new evidence $E$, the Equation will generally fail at $t_2$. To keep the Equation holding after updating, you would have to refuse to update your beliefs normally.

  ### 2. Minimal Assumptions
  For this collapse to occur, you only need three assumptions. If you want to save the rule, you must break one of these:

  1.  **Propositionality:** The conditional "If $A$, $C$" expresses a proposition that has a truth value (it is either true or false in a given world).
  2.  **Adams' Thesis:** The probability of that proposition is equal to the conditional probability: $P(A \to C) = P(C|A)$.
  3.  **Standard Probability:** Your beliefs obey the standard Kolmogorov axioms of probability and update via Conditionalization.

  Lewis showed that (1) + (2) + (3) = Contradiction (unless the system is trivial).

  ### 3. Which Assumption Do People Give Up?
  The consensus in the field is to drop **Assumption 1 (Propositionality)**.

  Most philosophers of language (following Ernest Adams and Dorothy Edgington) now argue that indicative conditionals **do not express propositions**. They do not have truth conditions in the standard sense. You cannot say "It is true that if it rains, the game is off." Instead, you can only say the conditional is *acceptable* or *assertable* to a certain degree.

  *   **The Cost:** This is expensive. If conditionals aren't propositions, you cannot easily embed them in complex sentences. You can't straightforwardly say "If it rains, then if the game is off, we will go home," because the inner "if" doesn't produce a truth-evaluable object for the outer "if" to operate on. This forces logicians to develop non-standard, probabilistic logics rather than using classical truth tables.

  ### 4. The "Narrowing Scope" Move: Rescue or Concession?
  You described the move to restrict the rule to certain conditionals (e.g., where the antecedent tells you nothing about the consequent) as feeling "arbitrary" or "deflated." You are correct. In the literature, this is often associated with **Contextualism** or **Restrictor Theory** (famously championed by Angelika Kratzer).

  *   **The Move:** Proponents argue that "If $A$, $C$" doesn't have a fixed meaning on its own. The "If $A$" part merely restricts the context in which $C$ is evaluated. The Equation holds, but only relative to a specific context.
  *   **Is it a Rescue?** It is widely treated as a **concession**, not a rescue of the original intuition.
      *   **Why:** The original intuition was that the conditional *itself* carries the probability. The Restrictor view admits that the conditional *doesn't* carry the probability; rather, the probability belongs to the consequent *within a restricted modal base*.
      *   **Your "Vacuity" Intuition:** You noted that the restriction makes the rule say "almost nothing." Philosophers call this the **Vacuity Objection**. If you restrict the Equation only to cases where $A$ and $C$ are probabilistically independent, the Equation becomes trivial in a different way: $P(C|A)$ just equals $P(C)$, so the "If" adds no informational value.
      *   **My Coined Label:** I will label this specific dialectical failure **The Vacuity Retreat**. It describes the maneuver where a theory saves a universal claim by restricting its domain so severely that the claim loses its explanatory power. In the philosophy of conditionals, this is treated as an admission that the universal truth-conditional view is untenable.

  ### 5. Boundaries: What Counts as an Instance?
  To ensure you are applying this correctly to your reading, here are the boundaries of the phenomenon you identified:

  *   **Instance:** You assign a 90% probability to "If it rains, the game is off." You treat this as a fact in your belief network. You then learn "The ground is wet" (which raises the probability of rain). If your belief that "If it rains, the game is off" shifts in a way that violates $P(\text{Game Off} | \text{Rain})$, you have encountered the Triviality/Updating problem.
  *   **Non-Instance (Counterfactuals):** Your intuition specified *indicative* conditionals ("If it rains..."). Counterfactuals ("If it *had* rained...") are handled differently (usually via possible worlds semantics, e.g., Stalnaker/Lewis). Triviality results apply less aggressively there because we aren't usually updating probabilities on counterfactuals in the same way.
  *   **Non-Instance (Material Conditional):** If you treat "If $A$, $C$" as the material conditional of classical logic ($\neg A \lor C$), the Triviality Results do not apply. However, this leads to the **Paradoxes of Material Implication** (e.g., "If the moon is cheese, then the game is off" becomes true because the moon isn't cheese). You likely rejected this in your chemistry days because it doesn't match causal reasoning.

  ### Summary for Your Research
  You are standing squarely in the middle of the **Adams-Lewis Debate**.
  *   **The Rule:** Adams' Thesis.
  *   **The Failure:** Lewis's Triviality Results (1976).
  *   **The Updating Issue:** Dynamic Triviality (Hájek 1989 refined this).
  *   **The "Fix":** Restrictor Theory (Kratzer 1986) or Suppositional Theory (Edgington 1995).
  *   **Your Insight:** The "Vacuity Retreat" (your observation that the fixes deflate the original claim).

  You do not need a new name for the theorem, but your intuition about the "deflating restriction" is a recognized and respected critique in the field. You have correctly identified that the price of saving the Equation is admitting that conditionals are not the kind of things that can be true or false in the way standard propositions are.
