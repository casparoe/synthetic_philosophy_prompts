  Your tentative principle is strong, but the Olbers/Fermi inconsistency shows it needs a tweak. Both arguments share the same logical shape: a conjunction of premises yields a false observation. The difference isn't the logic; it's the *anchor*. Olbers relied on hard physics (inverse-square law, geometry) applied to a cosmological model. Fermi relies on sociological and technological speculation (will they expand? will we see them?).

  To keep your verdicts, refine the principle to **The Secure Constraint Principle**: A thought experiment yields knowledge when it demonstrates that a specific model of the world is incompatible with *robust* constraints (empirical facts or deep theoretical symmetries), forcing a decisive revision of the model space. If the premises are speculative, the contradiction is a mood, not a result.

  **Testing the Pile:**
  *   **Galileo, Stevin, Einstein, Olbers:** All use secure premises (logic, conservation, equivalence, optics). They rule out specific physical models (Aristotelian dynamics, perpetual motion, distinct gravity/acceleration, static infinite universe). Verdict: **Knowledge.**
  *   **Schrödinger, Twin Paradox, Fermi:** Schrödinger and Twin highlight internal tensions or math puzzles without ruling out a world state decisively. Fermi rules out a conjunction, but the premises are too soft to force a specific revision. Verdict: **No Knowledge (Mood).**
  *   **Maxwell, EPR:** Maxwell required hindsight to secure the premise (information has entropy). EPR was a productive failure; it ruled out Local Realism, but only after Bell turned the speculation into a hard constraint. You called them Knowledge, which fits if you count "forcing a real experiment" as securing the premise retroactively. Verdict: **Knowledge.**

  **The Cost:**
  You must accept that "Knowledge" here means "constraining the viable model space significantly," not just "finding a contradiction." It costs you the simplicity of the original principle, but it saves your gut instincts.

  **Newton's Bucket:**
  Your principle classifies this as **Knowledge**. It used secure premises (water surface curvature) to rule out a purely relational model of motion, forcing the introduction of absolute space (or later, inertial frames). Like EPR, it was productive even if the ultimate solution (General Relativity) differed from Newton's conclusion.

