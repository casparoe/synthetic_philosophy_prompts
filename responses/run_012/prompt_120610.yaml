      2.  **Operational Tests:** Instead of proving a metaphysical point, design experiments that test specific capacities. Does it evolve? Does it maintain homeostasis? Score the system on these axes rather than a binary yes/no.
      3.  **Dissolve the Binary:** Accept that some entities are "borderline cases" by design. The stall exists because you expect a sharp line where nature provides a foggy boundary.

