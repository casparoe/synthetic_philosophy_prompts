  1.  **Analyze the Request:**
      *   **Topic:** The definition of life (virus vs. chemical, prions, mitochondria, etc.).
      *   **Conflict:** Two friends (Dana vs. Narrator) disagree on whether viruses are "alive" despite agreeing on all biological facts. Other friends have varying views (sister: verbal convenience; friend 2: real fact of the matter needed for astrobiology; friend 3: Wittgensteinian family resemblance).
      *   **Task:** Provide a diagnosis of the dispute (verbal, factual, conceptual, broken?), not just an answer.
      *   **Constraints:**
          *   Bottom line first (2-3 sentences).
          *   Max 700 words.
          *   Do not just list definitions of life.
          *   Explain what counts as progress given the diagnosis.

  2.  **Diagnose the Dispute:**
      *   Is it verbal? Partly. "Alive" is a category label we apply to a continuous spectrum of complexity.
      *   Is it factual? No, because they agree on the biology (metabolism, replication, etc.).
      *   Is it conceptual? Yes. It's about *utility* and *boundary drawing*.
      *   The core issue: "Life" is a folk category trying to carve nature at joints that don't exist sharply. It's a cluster concept without a necessary and sufficient condition.
      *   The stake: Why does it feel like something is at stake? Because the label carries moral, legal, or scientific weight (e.g., astrobiology contamination protocols, medical treatment of viruses).
      *   Diagnosis: It is a verbal dispute masking a pragmatic disagreement about how to carve conceptual space for specific purposes. There is no hidden metaphysical fact, but the choice of definition has real consequences for scientific practice.

  3.  **Drafting the Bottom Line:**
      *   This is a verbal dispute rooted in a category error: you are treating "life" as a natural kind with a hidden essence, when it is actually a pragmatic cluster concept used to group phenomena by utility. Progress comes not from finding the truth, but from specifying the context (e.g., legal, biological, astrobiological) that dictates which traits matter most.

  4.  **Drafting the Body:**
      *   *Acknowledge the agreement:* You agree on facts (metabolism, replication). This confirms it's not empirical.
      *   *The Nature of "Life":* It's not a binary switch in nature (like proton charge); it's a gradient of complexity (autocatalysis -> viruses -> cells -> multicellular).
      *   *Why it feels real:* The word "alive" triggers intuitions about moral status, origin, and distinctness. We want a phase transition, but evolution is continuous.
      *   *The Sister vs. Astrobiologist:* The sister is right that there's no metaphysical fact. The astrobiologist is right that we need operational definitions for specific tasks (planetary protection vs. general biology).
      *   *Progress:* What counts as progress? Shifting from "Is it alive?" to "Does it meet criteria X for purpose Y?"
      *   *Example:* For antibiotic development, viruses aren't alive (no metabolism). For evolutionary biology, they are (selection/mutation).
      *   *Conclusion:* The stall persists because you're arguing over a map, not the territory.

  5.  **Refining and Editing (Word Count Check):**
      *   Need to keep it tight.
      *   Ensure the diagnosis is clear.
      *   Ensure the "progress" section is specific.

