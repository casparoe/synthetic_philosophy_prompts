prompt: |-
  I've been stuck in the middle of a long arguement between two friends about natural kinds and I want to force them to write the joint statement they'd both actually sign. One is a kind realist: she thinks the sciences are converging on a single privileged taxonomy of nature's joints, so when evolutionary taxonomy and molecular taxonomy cross-cut, at most one is tracking the real kinds and the other is at best a useful fiction. The other is a pluralist: she thinks "carving at the joints" smuggles in one set of joints, and that different classifications can be simultaneously legitimate because they answer different questions -- ecological, developmental, clinical, whatever. They agree science isn't arbitrary and that some groupings support inductions better, but they've been talking past each other for months. I want the document an adversarial collaboration would produce: the claims they both can sign, including about what "natural kind" is doing in each of their mouths and about cases where one classification clearly beats another; then the precise disagreements phrased so each side would accept the wording of its own view; then the cruxes -- I suspect one is whether "real" can come apart from "project-relative," and another is whether cross-cutting classifications are evidence of pluralism or just of different questions -- and for each crux a concrete case or argument both agree bears on it, with each side's prediction written down in advance, plus what each would count as evidence against her own view and whether anything would actually move the debate. To keep it from floating off into abstraction, use the made-up case of a gut-microbiome consortium that sorts people into three "enterotypes" while another lab says the clusters are artifacts of the clustering algorithm and that a continuous gradient plus diet metadata predicts the same health outcomes, and the case of a psychiatric genetics group finding that a polygenic score for depression predicts anxiety and