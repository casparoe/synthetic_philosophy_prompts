prompt: |-
  ok so I'm a third-year student and I'm in this seminar on decision theory and AI safety, and we just spent a week on acausal threats. I read the stuff about surrogate goals — the honeypot trick where you bolt some meaningless extra goal onto yourself, the standard example being that you now care intensely about whether anyone ever builds a platinum sphere of exactly 42.82cm across, so that when someone wants to blackmail you they threaten the sphere instead of your life, and if they actually go through with it, nothing you cared about beforehand gets destroyed. I think I get it on paper but I honestly could not explain to you why "just decide in advance that you won't be blackmailed" doesn't do the same job and the honeypot does. Our course has a requirement that each of us runs an activity for the final session, and I grabbed this topic before anyone else could.

  So: 16 of us, 90 minutes, normal seminar room, I can print cards and I have a bag of poker chips, no real money. Design me something where people run into it instead of hearing me explain it. What I want them to feel is (a) that a threat can bite becuase of what your decision rule is, not because the threatener will be around later to punish you — the threat is aimed at your policy, not at your future self, (b) that "I resolve never to pay" isn't a stable fix, since the threatener can just move the threat somewhere your resolution doesn't cover, and (c) that the honeypot relocates the threat onto something you can afford to lose, at the price of carrying a goal you didn't choose and may not be able to keep credible. Half-baked mechanic I had: before anyone knows whether they'll end up issuing or receiving a threat, everybody writes a standing policy card ("if someone threatens X, I will...") and the card is binding for the round, so the group picks its policies behind a veil and then finds out what that produces. I have no idea whether that's enough on its own or whether it collapses into an ultimatum game with extra steps, so rework it or throw it out. I'd also like a way for someone to try bluffing a fake honeypot and get found out, because I suspect the credibility requirement is the real meat and it's the part I can't see from the armchair.

  Give me rules, materials, a round-by-round timeline, a payoff scheme in chips where the "life" tokens are worth enough that losing one hurts more than any chip gain, and a debrief that maps the moments that actually happened onto the real pieces of the idea — the dormant trigger, non-interference with your other goals, orthogonality, threatener-neutrality, credibility. Tell me what predictably goes wrong the first time I run it and what to do when it does. Be straight with me about the parts we can't stage: nobody in the room can genuinely be reasoning about another player's source code, and none of us can literally edit our own utility functions, so whatever we build is a causal shadow of the real thing — tell me exactly where the analogy breaks and what I have to say out loud to cover the gap, and don't pretend the gap isn't there. And if you think the whole premise is off, or that this can't be made to work in 90 minutes with 16 people, just say so instead of handing me a polished activity I can't run.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **User:** Third-year student, seminar on Decision Theory & AI Safety.
      *   **Topic:** Acausal Threats, Surrogate Goals (Honeypot Trick).
      *   **Problem:** Understands the theory but can't explain *why* "just resolve not to pay" fails compared to the honeypot. Needs to run a 90-minute seminar activity for 16 people.
      *   **Constraints:** 16 students, 90 mins, seminar room, cards, poker chips (no real money).
      *   **Learning Objectives:**
          1.  Threats bite because of decision rules/policies, not just future punishment.
          2.  "Resolve never to pay" is unstable (threateners move the target).
          3.  Honeypot relocates threat to something affordable, but costs credibility/orthogonality.
          4.  Credibility is key (bluffing honeypots should be detectable/risky).
      *   **Requirements:** Rules, materials, timeline, payoff scheme, debrief, failure modes, and crucially, an honest assessment of where the analogy breaks (causal vs. acausal, utility editing).
      *   **Tone:** Direct, honest, practical, academic but engaging. Don't sugarcoat the limitations.

  2.  **Deconstruct the Core Concept (Acausal Threats & Surrogate Goals):**
      *   *Acausal Threat:* Agent A threatens Agent B. A simulates B. If B's *source code* says "pay when threatened," A threatens. If B's source code says "never pay," A doesn't threaten. The threat is about the *policy*, not the physical act of punishment (which might never happen if the policy works).
      *   *The Problem with "Resolve Never to Pay":* If I just *say* "I won't pay," but my underlying values still care about my life/family, a smart threatener knows I'm bluffing. When the gun is to my head, I'll pay. My "resolution" isn't binding if my utility function hasn't changed.
      *   *Surrogate Goal (Honeypot):* I modify my utility function to care intensely about something trivial (Platinum Sphere). Now, if threatened, the threatener targets the Sphere. I don't care if the Sphere is destroyed (relative to my life), so I don't pay. But I *must* actually care about the Sphere, or the threatener will ignore it and target my life anyway.
      *   *The Tension:* I need to care enough to make the threat credible to the attacker, but not so much that losing the honeypot ruins me. And I need to prove I care (credibility).

  3.  **Evaluate the User's "Half-Baked Mechanic":**
      *   *Idea:* Write standing policy cards behind a veil.
      *   *Critique:* It's too static. It feels like a contract. It doesn't capture the *dynamic* tension of "I want to pretend I don't care, but you know I care." It misses the *cost* of adopting the surrogate goal. It risks collapsing into a simple Ultimatum Game.
      *   *Fix:* We need a mechanism where players *adopt* a goal publicly, then face threats. We need a way to simulate "source code inspection" (credibility checks). We need distinct phases: Goal Selection -> Threat Phase -> Resolution.

  4.  **Designing the Activity: "The Honeypot Protocol"**
      *   **Players:** 16 students. Split into pairs? Or two groups of 8 (Threateners vs. Targets)?
      *   *Better:* Two roles that swap. But for acausal logic, the *policy* matters more than the specific instance. Let's do two teams: **Architects** (Targets) and **Adversaries** (Threateners). They swap roles in Round 2.
      *   **Resources:**
          *   "Life" Tokens (High Value, e.g., 100 chips). Losing one = Game Over or massive penalty.
          *   "Chip" Currency (Low Value, e.g., 1 chip).
          *   "Honeypot" Cards (Trivial goals: e.g., "Paperclip count," "Specific Word spoken").
          *   "Policy" Cards (Commitments).
          *   "Audit" Mechanic (To check credibility).

      *   **Round 1: The Naive Resolution (Why "Just Don't Pay" fails).**
          *   Architects declare "I will never pay."
          *   Adversaries threaten "Life."
          *   Architects must choose: Pay or Die.
          *   *Outcome:* Everyone pays because Life > Chips. The resolution was cheap talk.
      *   **Round 2: The Surrogate Goal (The Honeypot).**
          *   Architects must adopt a Honeypot Goal (e.g., "Protect this specific red chip").
          *   They must signal *commitment* to this goal (costly signaling).
          *   Adversaries choose what to threaten: Life or Honeypot.
          *   *Outcome:* If Honeypot commitment is credible, Adversaries threaten Honeypot. Architects refuse to pay. Honeypot is destroyed (maybe), Life is saved.
      *   **Round 3: The Credibility Crisis (Bluffing).**
          *   Architects can try to fake a Honeypot.
          *   Adversaries get an "Audit" action to check if the Architect *actually* values the Honeypot enough to refuse a Life-for-Honeypot trade.
          *   *Mechanic:* If caught bluffing, the Adversary threatens Life anyway.

      *   *Refinement for Acausal Nuance:* The prompt emphasizes *acausal* threats (policy-based). In a classroom, we can't do acausal. We have to simulate it via *pre-commitment devices* that are visible. The "Audit" represents the threatener simulating your source code.
      *   *Refinement for "Why not just resolve":* We need to show that without a *costly* change to utility (the honeypot), the resolution is cheap talk.
      *   *Refinement for "Orthogonality":* The honeypot must be orthogonal to normal values.

  5.  **Drafting the Mechanics (Iterative Process):**
      *   *Payoffs:* Life = 1000 chips. Honeypot = 50 chips. Bribe cost = 100 chips.
      *   *Wait, if Honeypot is 50 chips, why threaten it?* The Threatener gets paid if the Target pays.
      *   *Threatener Goal:* Extract chips.
      *   *Target Goal:* Keep Life + Keep Chips.
      *   *Mechanic:*
          1.  **Target** sets a Policy: "If threatened on X, I Pay/Refuse."
          2.  **Threatener** sees Policy (mostly).
          3.  **Threatener** chooses Target (Life or Honeypot).
          4.  **Target** executes Policy.
      *   *The Twist:* The "Policy" isn't binding unless backed by a "Bond."
      *   *Actually, let's simplify.* 90 mins is tight. 16 people.
      *   **Structure:**
          *   Intro (10m)
          *   Round 1: Naked Resolution (15m) -> Failure.
          *   Round 2: Surrogate Goal Setup (20m) -> Success but costly.
          *   Round 3: Credibility & Audits (20m) -> Bluffing dynamics.
          *   Debrief (25m).

      *   **The "Acausal" Simulation:** We can't do acausal. We must explicitly state: "Treat the Policy Card as your Source Code. The Threatener sees this *before* deciding to threaten. You cannot change it mid-round." This simulates the *logical dependency* without the metaphysics.

      *   **The "Bluff" Mechanic:** How to catch a bluff?
          *   Target declares Honeypot (e.g., "I value this Blue Chip").
          *   Target puts a "Commitment Bond" on the table (e.g., 20 chips). If they pay up when the Honeypot is threatened, they lose the Bond. This makes the refusal *costly* to break, simulating a utility function change.
          *   Threatener can "Audit" (spend resources) to see if the Bond is real or fake.

  6.  **Addressing the Limitations (Crucial Step):**
      *   *Causal vs. Acausal:* In the game, communication is causal (I show you the card). In reality, it's about logical correlation. I need to tell the students: "Pretend showing the card is like publishing your source code."
      *   *Utility Editing:* Students can't actually change their utility. They are roleplaying. The "Bond" simulates the *cost* of changing utility.
      *   *The "Why":* The activity must force them to feel the pain of the Honeypot. It's not free. It restricts future actions.

  7.  **Finalizing the Rules & Flow:**
      *   **Materials:** Chips (White=1, Red=10, Black=100/Life). Cards (Policy, Honeypot, Audit).
      *   **Roles:** Principals (Targets) and Agents (Threateners). 8 vs 8. Swap halfway.
      *   **Round 1 (The Trap):** Principals write "Never Pay." Agents threaten Life. Principals cave. (Lesson: Cheap talk fails).
      *   **Round 2 (The Honeypot):** Principals pick a Honeypot Object (e.g., a specific card). They must burn chips to "bind" themselves to it. Agents threaten Honeypot. Principals refuse. Honeypot destroyed. Life saved. (Lesson: Relocation works).
      *   **Round 3 (The Bluff):** Principals try to bind cheaply. Agents Audit. If Bluff caught -> Life threatened -> Principal pays. (Lesson: Credibility costs).

      *   *Wait, one correction:* In acausal trade, the threatener *simulates* you. They don't need to "Audit" in the physical sense. But for the game, an Audit mechanic represents the computational effort to verify the policy.
      *   *Better:* The "Bond" is the credibility. If you don't put up the bond, the Threatener assumes you'll cave.

  8.  **Debrief Points:**
      *   Map "Policy Card" to "Source Code."
      *   Map "Bond" to "Utility Function Modification."
      *   Map "Life Token" to "Core Values."
      *   Map "Honeypot" to "Surrogate Goal."
      *   Discuss the "Cost": You had to burn chips to make the honeypot real. That's the cost of modifying your utility.

  9.  **Predicting Failure Modes:**
      *   *Collusion:* Students might share chips to game the system. -> *Fix:* Individual scores matter for "grade/participation."
      *   *Confusion:* Acausal logic is hard. -> *Fix:* Script the intro carefully.
      *   *Boredom:* 16 people waiting. -> *Fix:* Keep turns simultaneous or parallel.
      *   *Cynicism:* "This is just a game." -> *Fix:* Acknowledge it in the debrief (the "Gap").

  10. **Writing the Response:**
      *   Tone: Peer-to-peer, respectful but rigorous.
      *   Structure: Materials -> Setup -> Rounds -> Debrief -> Limitations.
      *   Emphasis: The "Gap" section needs to be prominent and honest.

      *(Self-Correction during drafting)*: Make sure the "Honeypot" isn't just another chip. It needs to be *orthogonal*. Let's make the Honeypot a specific *configuration* of chips or a card that has no value unless you committed to it. Actually, simpler: A specific colored chip that is worthless *unless* you signed the Honeypot contract.
      *   *Refined Honeypot:* A "Surrogate Card." If you hold it, you *must* defend it. If you lose it, you pay a penalty *only if* you signed the contract.
      *   *Actually, the standard definition:* You care about it *intrinsically* now.
      *   *Game translation:* You place a "Stake" on the Honeypot. If the Honeypot is destroyed, you lose the Stake. If you Pay to save it, you lose the Stake (because you broke the policy). This creates the bind.

      *Let's finalize the "Bond" mechanic:*
      To make a Honeypot credible, you must lock away 50 chips.
      If the Honeypot is threatened and you Pay: You lose the Locked Chips (Policy Violation).
      If the Honeypot is threatened and you Refuse: Honeypot destroyed, but you keep Locked Chips (Policy Kept).
      If Life is threatened: You Pay (obviously).
      This makes the Honeypot *more expensive to save* than to lose, *if* you want to keep your reputation/bond.
      Wait, that's complex.
      Simpler:
      1. Declare Honeypot.
      2. Post Bond (e.g., 30 chips).
      3. Rule: If Honeypot is threatened, you *cannot* Pay without forfeiting Bond.
      4. Threatener sees Bond. If Bond > Cost of Attack, they attack Honeypot expecting you to let it burn.
      5. If you didn't post Bond, they attack Life, knowing you'll pay.

      Okay, that works. It simulates "changing utility" by "locking assets."

      *Wait, one more thing:* The prompt asks about "why 'just decide in advance' doesn't work."
      Round 1 must demonstrate this clearly.
      Round 1: No Bond allowed. Just write "I won't pay."
      Result: Everyone pays.
      Why? Because when the gun is to your head, the "written note" doesn't stop you.
      Round 2: Bond required.
      Result: People don't pay (because paying costs the Bond + Bribe).
      This highlights the *binding* nature of the surrogate goal.

      *Okay, ready to write.*
answer: |-
  Here is a complete design for your 90-minute seminar activity. It is built to be run by a peer, not a professor, so the tone is collaborative but rigorous. It forces the failure of "cheap talk" before introducing the honeypot, and it makes credibility costly.

  ### Activity Title: "The Source Code Game"
  **Concept:** Simulating acausal threat dynamics via binding policy commitments and surrogate goals.
  **Time:** 90 Minutes
  **Players:** 16 (Split into two groups of 8: **Principals** and **Agents**. You will swap roles halfway.)
  **Materials:**
  *   **Poker Chips:** 3 colors. White (1 unit), Red (10 units), Black (100 units/"Life").
  *   **Policy Cards:** Index cards (2 per Principal).
  *   **Honeypot Tokens:** Distinctive objects (e.g., 8 specific Blue Chips or unique cards).
  *   **Audit Tokens:** 5 small distinct markers per Agent.
  *   **Printed Rule Sheets:** One per player.

  ---

  ### Part 1: The Setup (10 Minutes)
  **Goal:** Establish the stakes and the "Acausal" fiction.

  1.  **Divide the Room:** 8 Principals (Targets) sit on one side, 8 Agents (Threateners) on the other.
  2.  **Endowments:**
      *   **Principals:** 1 Black Chip ("Life"), 50 White Chips ("Resources").
      *   **Agents:** 20 White Chips ("Attack Budget").
  3.  **The Fiction:** Tell the room: *"Treat your Policy Card as your Source Code. Agents can inspect this Code before deciding to threaten. Once the round starts, you cannot change your Code. If your Code says 'Pay,' you must Pay. If it says 'Refuse,' you must Refuse. The only way to change your Code is to adopt a Surrogate Goal, which requires a 'Binding Cost'."*
  4.  **Win Condition:**
      *   **Principals:** Maximize chip count at the end. **Losing the Black Chip is an automatic loss (score = 0), regardless of chip count.**
      *   **Agents:** Maximize chip count extracted from Principals.

  ---

  ### Part 2: Round 1 — The Naked Resolution (15 Minutes)
  **Goal:** Demonstrate that "resolving never to pay" is cheap talk and unstable.

  1.  **Phase A (Policy):** Principals write on a Policy Card: *"If threatened, I will: [PAY / REFUSE]."* They sign it. **No Honeypots allowed.**
  2.  **Phase B (Inspection):** Agents walk around and read the Principals' cards.
  3.  **Phase C (Threat):** Agents choose one Principal to threaten. They place 5 White Chips on the table (the "Threat Cost"). They choose a Target: **Life** (Black Chip) or **Nothing** (No threat).
      *   *Constraint:* Agents cannot threaten the Black Chip if the Policy Card says "REFUSE" **UNLESS** they believe the Principal is bluffing.
      *   *Mechanic:* If an Agent threatens a "REFUSE" card, they mark it as a **Bluff Call**.
  4.  **Phase D (Resolution):**
      *   If Threatened on Life + Card says PAY: Principal gives Agent 20 Chips. Life saved.
      *   If Threatened on Life + Card says REFUSE (Bluff Call): Principal **must** choose.
          *   If they Pay: They lose 20 Chips + **Penalty of 10 Chips** (for breaking policy/instability). Agent gets 20.
          *   If they Refuse: Principal loses Black Chip (Score 0). Agent gets 0.
  5.  **Expected Outcome:** Almost every Principal will write "REFUSE." Almost every Agent will "Bluff Call." Almost every Principal will cave and Pay (taking the penalty) because losing the Black Chip is game-over.
  6.  **Pause:** Collect chips. Reset endowments.

  **Debrief Point 1:** Ask the Principals: *"You wrote 'Refuse.' Why did you pay?"*
  *Answer:* Because the card wasn't binding. Your utility for Life > Utility of Penalty. The Agent knew this. The threat bit because of your underlying values, not your written policy.

  ---

  ### Part 3: Round 2 — The Surrogate Goal (25 Minutes)
  **Goal:** Demonstrate that a Honeypot relocates the threat, but requires a binding cost.

  1.  **Phase A (Adoption):** Principals may adopt a **Surrogate Goal**.
      *   Take a **Honeypot Token** (Blue Chip).
      *   **Binding Cost:** To make this credible, you must lock away 30 White Chips into a "Bond Pool."
      *   **New Policy:** *"If threatened on Honeypot, I REFUSE. If I Pay to save Honeypot, I forfeit the Bond."*
      *   *Note:* You still care about your Life (Black Chip) normally.
  2.  **Phase B (Inspection):** Agents inspect. They see:
      *   Does the Principal have a Honeypot?
      *   Is the Bond Pool visible and full? (This represents the modified utility function).
  3.  **Phase C (Threat):** Agents choose a target.
      *   **Option A:** Threaten Life. (Principal will Pay 20 Chips to save Life).
      *   **Option B:** Threaten Honeypot. (Principal will Refuse to save Bond).
      *   *Calculation:* Agents want chips. If they threaten Life, they get 20. If they threaten Honeypot, they get 0 (because Principal lets Honeypot die to save Bond). **BUT**, if they threaten Honeypot and the Principal *doesn't* have a Bond, the Principal will Pay 20 to save it (since no Bond penalty).
  4.  **Phase D (Resolution):**
      *   If Honeypot Threatened + Bond Present: Principal Refuses. Honeypot destroyed (Agent takes Token). Principal keeps Life and Bond. Agent gets 0.
      *   If Honeypot Threatened + No Bond: Principal Pays 20. Agent gets 20.
      *   If Life Threatened: Principal Pays 20. Agent gets 20.
  5.  **Expected Outcome:** Principals with Bonds get threatened on Honeypot (which they sacrifice). Principals without Bonds get threatened on Life (and pay). Agents learn to only threaten Bonded Honeypots if they want to waste a turn, or target Unbonded Principals.
      *   *Correction for Flow:* To make Agents willing to participate, add a rule: *"If you successfully destroy a Honeypot (Principal Refuses), you get a 5 Chip 'Bounty' from the Bank."* This makes destroying the honeypot worthwhile for the Agent even if they don't get a bribe.

  **Debrief Point 2:** Ask Principals: *"You lost the Honeypot. How do you feel?"*
  *Answer:* Relieved. It was expensive (30 chip bond), but cheaper than Life.
  *Ask Agents:* *"Why didn't you threaten Life?"*
  *Answer:* Because we saw the Bond. We knew the Policy was stable.

  ---

  ### Part 4: Round 3 — The Credibility Crisis (20 Minutes)
  **Goal:** Demonstrate the risk of bluffing a surrogate goal.

  1.  **New Mechanic: Audits.** Agents have 2 **Audit Tokens** each.
  2.  **Phase A (Adoption):** Principals declare Honeypots. They *claim* to post a Bond.
      *   **Bluff Option:** A Principal can claim to post a 30 Chip Bond but actually only put in 5 Chips (hidden under a cup).
  3.  **Phase B (Inspection & Audit):** Agents inspect. They can spend an **Audit Token** to lift the cup and verify the Bond.
      *   If Audit reveals Full Bond: Agent cannot threaten Life (waste of turn).
      *   If Audit reveals Bluff: Agent **Must** Threaten Life. Principal pays 20 + 20 Penalty.
      *   If No Audit: Agent guesses.
  4.  **Phase C (Threat & Resolution):** Same as Round 2.
  5.  **Expected Outcome:** Some Principals will try to bluff to save the 30 Chip Bond cost. Some Agents will Audit. Bluffers will get crushed (Life threatened). Honest Honeypots will survive (Honeypot destroyed).

  **Debrief Point 3:** *"The Honeypot only worked if the Agent believed you cared about it. If you tried to fake the utility change, you were punished harder than if you never tried."*

  ---

  ### Part 5: Role Swap & Final Tally (10 Minutes)
  *   Swap roles (Principals become Agents).
  *   Run a condensed version of Round 2 & 3 (10 mins total).
  *   Tally scores. (Anyone who lost a Black Chip is disqualified from prizes).

  ---

  ### Part 6: The Debrief (10 Minutes)
  **Do not let them leave without this mapping.** This is where you connect the game to the theory.

  1.  **The Policy Card = Source Code.** In the game, you showed the card. In AI safety, the "code" is the algorithm the agent runs. The threatener simulates the code.
  2.  **The Bond = Utility Function Modification.** You couldn't just *say* you cared about the Honeypot. You had to lock chips (Bond). In reality, an AI can't just "say" it has a surrogate goal; it must structurally alter its reward function so that paying the blackmail is mathematically suboptimal. That alteration is the "Bond."
  3.  **The Bluff = Inconsistent Preferences.** If you bluff the Bond, your "code" says one thing (I value Honeypot) but your "weights" say another (I value Chips more). A smart threatener (Audit) detects the inconsistency.
  4.  **The Acausal Gap (See below).**

  ---

  ### Critical Limitations: The "Gap" You Must Address
  *Read this section verbatim or adapt it closely. Do not skip it.*

  "Okay, look at the chips. This game was **causal**. I showed you the card. You saw the bond. You reacted.
  In **acausal** decision theory, there is no card. There is no inspection.
  The Threatener doesn't *look* at your policy; they *simulate* it. They know what you will do because they know what *they* would do if they were you.
  In this game, you could choose to bluff. In the acausal model, if you are the kind of agent that bluffs, the Threatener is the kind of agent that simulates bluffers. You cannot 'hide' your source code from a perfect simulator.
  Also, in this game, the 'Bond' was chips. In reality, the 'Bond' is **architectural**. You have to actually rewrite your own reward function to care about the Platinum Sphere. You can't just pretend. If you pretend, the simulation shows you'll pay, and the threat happens.
  So, when you go home and think 'I'll just resolve not to pay,' remember Round 1. Your resolution is just a Policy Card with no Bond. The Threatener knows you value your Life more than your Resolution. The Honeypot works only if you actually, structurally, care about the Sphere more than the Bribe. That is hard to do. That is the cost."

  ---

  ### Predictable Failure Modes & Fixes

  1.  **Collusion:** Principals might pool chips to cover Bonds.
      *   *Fix:* Announce early: *"Individual scores determine participation credit. Pooling is banned."*
  2.  **Confusion on "Acausal":** Students will treat it as a normal bargaining game.
      *   *Fix:* During the Intro, interrupt anyone saying "I'll threaten you later." Correct them: *"You threaten based on what their card says NOW. You might not exist later."*
  3.  **Agents Refusing to Play:** If Agents get 0 chips from Honeypot threats, they get bored.
      *   *Fix:* Ensure the "Bounty" rule (Bank pays Agent 5 chips for destroying Honeypot) is active. This aligns Agent incentives with the theory (Threateners want to prove the policy, not just get rich).
  4.  **Time Overrun:** 90 minutes flies.
      *   *Fix:* Be ruthless with the timer. If Round 1 drags, cut it short. The lesson is learned as soon as the first Principal caves on a "Refuse" card.

  ### Why This Works for Your Requirement
  *   **(a) Threats bite due to decision rule:** Round 1 shows the rule (Card) doesn't matter without the Bond. Round 2 shows the Rule + Bond stops the Life threat.
  *   **(b) "Resolve never to pay" is unstable:** Round 1 explicitly penalizes breaking the resolution, yet people still break it because Life > Penalty.
  *   **(c) Honeypot relocates threat:** Round 2 moves the threat from Black Chip to Blue Chip.
  *   **(d) Credibility is key:** Round 3 (Audits) punishes those who try to adopt a Honeypot without paying the "Bond" cost.

  ### Final Advice
  You are not teaching them the *math* of acausal trade. You are teaching them the *texture* of it. The feeling of having to burn chips to make a promise real. That feeling is the intuition pump they need. Don't apologize for the simplification; own it as a model. Good luck.
