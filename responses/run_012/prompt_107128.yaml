answer: |-
  **FINAL EXAMINATION: RATIONALITY AND COLLECTIVE DECISION-MAKING**
  **Time Allowed: 75 Minutes**
  **Total Value: 20 Marks**

  **Question 1**

  Ten independent research teams are evaluating a novel agricultural bio-agent. The true net social value of releasing the agent, $V$, is unknown but fixed. Each team $i$ produces an estimate $E_i = V + \epsilon_i$, where $\epsilon_i$ represents independent random noise with a mean of zero. The teams share a common safety threshold: release is permissible only if the estimated value is positive ($E_i > 0$). Under the current protocol, if *any* single team concludes that $E_i > 0$, they are authorized to begin field trials immediately.

  (a) Suppose the true value $V$ is slightly negative. Explain the statistical mechanism by which the current protocol creates a systematic bias toward release. Identify the specific assumptions about the estimates $\epsilon_i$ required for this bias to arise. (6 marks)

  (b) Generalize this mechanism. If the decision rule were changed to require a majority of teams to agree before release, would the selection bias vanish, diminish, or persist? Contrast this with a rule requiring unanimity. Explain these outcomes in terms of which estimate within the distribution determines the outcome. (8 marks)

  (c) Consider a variant scenario where the variation among estimates ($\epsilon_i$) reflects genuine differences in private information rather than random noise. Specifically, suppose the team with the highest estimate possesses unique data confirming high value, while others lack this information. How does this change the normative assessment of selecting the most optimistic estimate? (6 marks)

  ***

  **MODEL ANSWER**

  (a) The bias arises from the statistical properties of order statistics applied to noisy estimates. Under the unilateral protocol, action occurs if $\max(E_1, \dots, E_{10}) > 0$. Even if the true value $V$ is negative, the distribution of estimates is centered on $V$. Because the noise terms $\epsilon_i$ are independent and symmetric, there is a non-zero probability that any single team's noise term is sufficiently positive to push $E_i$ above zero. As the number of teams increases, the expected value of the maximum estimate increases. Therefore, the team that triggers action is systematically the one with the largest positive error term. The action proceeds precisely when the noise is most misleadingly optimistic. This mechanism relies critically on two assumptions: first, that the errors are noise centered on the truth (unbiased), rather than systematic delusion; and second, that the decision rule selects the maximum of the set rather than the mean or median.

  (b) This effect is not unique to unilateralism but is a feature of any decision rule that selects an order statistic from the upper tail of the estimate distribution. Under a majority rule, the outcome is determined by the median estimate (the 5th or 6th highest). While the median is less sensitive to extreme outliers than the maximum, it still selects an estimate from the upper half of the distribution relative to the pessimists. If the variance of the noise is high relative to the negative true value, the median estimate may still cross the threshold, though the probability is lower than under unilateralism. Thus, the bias diminishes but persists so long as the threshold for action requires less than full consensus. Conversely, under a unanimity rule, action requires $\min(E_1, \dots, E_{10}) > 0$. Here, the decisive estimate is the most pessimistic one. If $V$ is positive, action may fail because the single most negative noise term drags the minimum below zero. This creates a "reverse curse" or status quo bias, where inaction occurs precisely when the estimates are most misleadingly pessimistic. The fundamental mechanism is that any $k$-out-of-$n$ rule selects the $(n-k+1)$-th order statistic; bias flows from the gap between that statistic and the true mean.

  (c) The normative assessment changes fundamentally if the spread of estimates reflects information rather than noise. In the noise model, the extreme estimate is the least reliable because it represents the largest error. However, if the variation arises from heterogeneous private information, the highest estimate may correspond to the team that has discovered a crucial positive factor unknown to others. In this "information aggregation" context, the most optimistic estimate may be the most accurate, not the least. Selecting based on the maximum becomes a method of mining the group for its best evidence rather than succumbing to its worst error. The curse vanishes because the correlation between optimism and accuracy reverses: the outlier is not an statistical accident but the holder of superior signal. Consequently, a unilateral rule might be efficient here, as it prevents valuable information held by a minority from being vetoed by the uninformed majority.

  ***

  **MARKING SCHEME**

  1.  **Identification of the Max Operator Mechanism (4 marks)**
      *   *Required:* Explicitly states that action depends on the maximum estimate exceeding the threshold, not the average.
      *   *Weak Answer Failure:* Describes the outcome as "people being too optimistic" without referencing the selection of the extreme value from the distribution.

  2.  **Specification of Noise Assumptions (4 marks)**
      *   *Required:* Notes that errors must be independent, unbiased (centered on truth), and sufficiently variable to cross the threshold.
      *   *Weak Answer Failure:* Assumes actors are systematically biased or irrational, missing the point that unbiased noise creates the selection effect.

  3.  **Generalization to Order Statistics (4 marks)**
      *   *Required:* Explains that any rule selecting a subset (like majority) picks an order statistic above the minimum, retaining some upward bias.
      *   *Weak Answer Failure:* Claims majority rule eliminates the problem entirely because "most people are right," ignoring the tail selection effect.

  4.  **Analysis of Unanimity (Reverse Curse) (4 marks)**
      *   *Required:* Identifies that unanimity selects the minimum estimate, creating a bias toward inaction (status quo) when true value is positive.
      *   *Weak Answer Failure:* Treats unanimity as simply "safer" without recognizing it introduces a symmetric selection bias against action.

  5.  **Information vs. Noise Distinction (4 marks)**
      *   *Required:* Recognizes that if variance is informational, the maximum estimate may be the most accurate, reversing the curse.
      *   *Weak Answer Failure:* Treats all variance as noise, failing to distinguish between error and private signal aggregation.

  Crux: The student must demonstrate that the curse is a structural selection effect on order statistics of noisy estimates, not merely a behavioral tendency toward optimism.
