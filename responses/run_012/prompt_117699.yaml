answer: |-
  ### I. Systematic Translation of Epistemic Positions

  Here is the translation of the three primary positions in the epistemology of testimony into the vocabulary of probabilistic modeling and machine learning.

  #### 1. Global Reductionism (The Humean Position)
  **Core Claim:** Testimonial justification is not basic. A hearer is justified in believing a report only if they have positive, independent reasons to believe the report is reliable.

  *   **Statistical Translation:** Testimony is treated as a sensor reading from an external node in a network. Acceptance of the data requires **calibration** of that sensor using a training set independent of the sensor's own output. The hearer must construct a **hierarchical model** where the speaker's reliability is a latent variable estimated from historical performance (likelihoods) and context.
  *   **Clean Mapping:** The reductionist demand for "independent positive reasons" maps cleanly to the requirement for **conditionally independent sources** in **sensor fusion**. If you cannot verify the speaker's reliability against ground truth or other uncorrelated sensors, you cannot reduce the variance of your posterior estimate. The fear of **correlated error** (e.g., the speaker is guessing based on the same biased data you have) drives the reductionist insistence on external validation.
  *   **Distorted Mapping:** The reductionist requirement for "inductive evidence" is modeled as a learning problem. However, in practice, this often demands a sample size for reliability estimation that is computationally intractable for a human agent. The translation makes the position look like an demand for **robustness to model misspecification**, but it actually functions as a refusal to run the model until the hyperparameters (reliability) are fixed by external data.
  *   **No Counterpart:** The reductionist notion of "justification" implies a deontological status (permissibility of belief). In the statistical model, this collapses into expected utility or risk minimization. There is no statistical equivalent for "being irrational" if you have the right priors; there is only being "miscalibrated."

  #### 2. Anti-Reductionism (The Reidian/Default Position)
  **Core Claim:** Testimony is a basic source of justification. The hearer has a *prima facie* entitlement to believe without independent verification, unless specific defeaters are present.

  *   **Statistical Translation:** The system operates with an **informative prior** heavily weighted toward truthfulness ($P(\text{Truth}) \gg 0.5$) as a **default setting**. This is not learned from data but is a structural constraint on the **update rule**. Defeaters function as high-magnitude likelihood ratios that override the prior. The burden of proof is on the noise model to demonstrate **adversarial error** before the default trust is suspended.
  *   **Clean Mapping:** The "presumption of truth" maps to a **policy for setting priors**. It is a meta-rule that initializes the system to assume **provenance** integrity unless **provenance laundering** is detected. This avoids the cold-start problem where no learning can occur because no initial trust exists to gather training data.
  *   **Distorted Mapping:** Anti-reductionists speak of a "right" to believe. In the model, this is a hyperparameter choice. This makes the disagreement look trivial: the reductionist sets $\alpha_{\text{trust}} = 0.01$, the anti-reductionist sets $\alpha_{\text{trust}} = 0.99$. The deep philosophical claim that this prior is *constitutive of rationality* rather than merely *pragmatically useful* is lost.
  *   **No Counterpart:** The anti-reductionist claim that testimony is *sui generis* (distinct from induction) has no counterpart. In the model, testimony is mathematically identical to perception; both are likelihood functions. The distinction between "seeing" and "being told" vanishes into the structure of the likelihood $P(\text{Report} | \text{World})$.

  #### 3. Intermediate Position (Default Entitlement with Local Monitoring)
  **Core Claim:** We have a default entitlement to believe, but this entitlement is sensitive to local context and requires passive monitoring for defeaters (e.g., Burge, Graham).

  *   **Statistical Translation:** A **hierarchical model with speaker-level random effects**. The global prior on honesty is high (default entitlement), but the model continuously updates speaker-specific reliability parameters (local monitoring). The system is designed for **robustness to model misspecification** by allowing the variance on speaker reliability to expand quickly when residuals indicate **adversarial error**.
  *   **Clean Mapping:** This maps well to adaptive learning rates. The "update rule" is asymmetric: it downgrades trust quickly on negative evidence but upgrades it slowly on positive evidence. This captures the "defeasible" nature of the entitlement.
  *   **Distorted Mapping:** The philosophical distinction between "transmission of knowledge" vs. "transmission of justification" is difficult to render. In the model, if the input is calibrated and the update rule is valid, the output is a posterior. Whether that posterior counts as "knowledge" or merely "justified belief" depends on external thresholds (e.g., probability $> 0.95$) that are not intrinsic to the model.
  *   **No Counterpart:** The normative constraint that the hearer *ought* to monitor for defeaters without actively hunting for them is hard to encode. In ML, monitoring is either computationally allocated or it isn't. The "ought" implies a resource allocation strategy that is ethical, not just computational.

  ---

  ### II. Residue Report

  This section analyzes what remains after the translation. It categorizes the leftover friction between the epistemological debate and the statistical framework.

  #### 1. Artifacts of the Probabilistic Vocabulary
  Much of the traditional debate appears as **hyperparameter tuning** in the statistical vocabulary. The dispute over whether we need "positive reasons" (reductionism) or have a "default right" (anti-reductionism) translates to initializing the prior probability of speaker veracity at $\epsilon$ versus $1-\epsilon$.
  *   **Verbal Dispute:** When the debate focuses on the *strength* of the presumption, the statistical vocabulary reveals this as a substantive but non-mysterious choice about sample efficiency. A high-trust prior allows faster learning (anti-reductionism) but risks poisoning the dataset (reductionist worry). The philosophical intensity of this disagreement is an artifact of treating a trade-off (bias-variance) as a categorical truth.
  *   **Conditional Independence:** The reductionist demand for independent corroboration is often treated philosophically as a conceptual requirement for justification. In the model, it is a technical requirement for variance reduction. If sources are correlated, fusing them yields diminishing returns. The philosophical "failure of justification" when independence is missing is just the statistical reality of **correlated error**. The debate is less substantive here; the math dictates the epistemology.

  #### 2. Genuine Features the Vocabulary Cannot Express
  There are residues that the statistical framework necessarily drops, not because they are mystical, but because they lie outside the scope of inference engines.

  *   **The Second-Personal Dimension:** This is the largest residue. In the statistical model, the speaker is a **sensor** or a data source. In the philosophical account, the speaker is an agent offering an **assurance**.
      *   *The Gap:* When a speaker says "P," they undertake a commitment. If P is false, they are not merely a noisy channel; they have violated a norm. The statistical model tracks **calibration** (accuracy over time), but it cannot track **commitment**.
      *   *Consequence:* The statistical model cannot represent the specific wrong done to a hearer when testimony is lied to (as opposed to merely being misled by a broken sensor). The "uptake" owed to a speaker is a reciprocal normative status, not a Bayesian update. This drops out entirely.
  *   **Justification vs. Knowledge:** In the model, there is only the posterior distribution and the ground truth. The philosophical distinction between having a justified belief (internal coherence/valid inference path) and knowledge (factive connection to the world) survives only as a distinction between *valid inference* and *true outcome*.
      *   *The Gap:* Epistemology cares about the *status* of the belief even if the world is uncooperative (Gettier cases). The model cares about loss functions. If the model outputs high confidence on a false proposition due to bad luck in the training data, it is simply "wrong." It is not "justified but untrue." The normative status of the belief state itself is invisible to the model.
  *   **Provenance vs. Provenance Laundering:** While the model can track data lineage, it struggles with the *normative* weight of provenance. In epistemology, hearing a rumor (laundered provenance) often carries less justificatory weight than hearing it from the source, even if the likelihood ratios are identical. In the model, if the conditional probabilities are the same, the path doesn't matter. The *moral* or *epistemic* stain of laundering is not captured by the information flow.

  #### 3. Defect Analysis: Framework, Debate, or Both?

  **The Judgment:** The residue is a defect of **both**, but primarily of the original debate's formulation.

  **Defect of the Debate:**
  The reductionism/anti-reductionism debate often reifies "sources of justification" as if they were distinct metaphysical pipes. The statistical vocabulary reveals that testimony is functionally an inference over latent variables (speaker intent, speaker access, world state). The philosophical insistence that testimony is *sui generis* (anti-reductionism) or *reducible to induction* (reductionism) looks like a category error from the modeling perspective. It is all inference. The debate persists because epistemologists are trying to solve a resource allocation problem (how much compute to spend on verification) using normative language (rights, duties, entitlements). The "substantive" disagreement is often just a disagreement about the default risk tolerance of the cognitive system.

  **Defect of the Framework:**
  However, the statistical framework is defective for epistemology because it is third-personal. It models the hearer as a solitary processor optimizing a loss function. It cannot model the **interpersonal transaction**.
  *   Testimony is not just information transfer; it is a social act involving trust and responsibility.
  *   The "default entitlement" is not just a prior; it is a social norm that enables cooperation.
  *   By reducing the speaker to a random effect in a hierarchical model, we lose the ability to model *betrayal*. A sensor fails; a speaker betrays. The update rule for betrayal is not just a likelihood adjustment; it is a severing of the link.

  **Conclusion:**
  The translation succeeds in showing that the *mechanics* of testimonial belief are isomorphic to Bayesian sensor fusion. The "residue" is the normativity of the social contract. If your goal is to teach students how testimonial belief *works* cognitively, the statistical vocabulary is superior and dissolves the pseudo-problems of the traditional debate. If your goal is to teach them what we *owe* each other as knowers, the statistical vocabulary is blind. The residue is not a mystery to be solved; it is the cost of abstraction. You should tell your students: "The model explains the inference; it cannot explain the obligation."
