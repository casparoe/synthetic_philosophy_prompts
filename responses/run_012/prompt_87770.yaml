answer: |-
  Here is the structural plan for the 75 minutes. It is designed to prevent the "instrumental" misunderstanding from taking root before you can pull it out.

  ### 1. The Sequence of Concepts (The "Why" of the Order)

  You are correct: the order of the **Duty-to-Oneself** vs. **Blunting Sympathy** is the critical pivot.

  **The Order:**
  1.  **Status of the Animal** (Sentient but not Rational/autonomous).
  2.  **The Ground of Duty** (Duties-to-Oneself / Preservation of Moral Disposition).
  3.  **The Empirical Symptom** (Blunting of Sympathy).
  4.  **The Application** (The Carrying Example).

  **Why this order?**
  If you start with *Blunting Sympathy* (2), you make the argument empirical and consequentialist. The Vet *will* destroy this with the sociopath objection ("I know a guy who kicks cats and loves his kids"). If the argument rests on psychological cause-and-effect, Kant loses.

  By placing *Duties-to-Oneself* (1) first, you establish the *normative ground*. The wrongness lies in the degradation of the *agent's* moral capacity, not the social outcome. The "Blunting of Sympathy" then becomes merely the *observable sign* or *mechanism* of that degradation, not the *reason* it is wrong. This inoculates you against the Vet: even if the sociopath's sympathy *doesn't* blunt, he has still violated the duty to preserve the "humanity in his own person."

  **Dependencies:**
  *   You cannot explain *why* cruelty is wrong (Duty-to-Oneself) until they accept *what* an animal is (Status).
  *   You cannot introduce the Example until they understand the Duty, or they will interpret the Example through a utilitarian lens.
  *   You must address the Lawyer (Korsgaard) only after the Kantian position is fully solidified, otherwise, the session becomes a workshop on "Fixing Kant" rather than understanding him.

  ---

  ### 2. The Carrying Example

  **Do not use:**
  *   **Dog-kicking in public:** Smuggles in the "practice for humans" consequence.
  *   **Vivisection:** Too technical; vets will defend it, philosophers will attack it, the Kantian point gets lost in the noise.
  *   **The Farmer:** Smuggles in economic instrumentality.

  **Use: The "Last Man on Earth" (Desert Island) Scenario.**
  *   **The Setup:** A man is shipwrecked. He will never see another human being again. He has a dog for company. The dog becomes old and sick. The man tortures or casually kills the dog for fun.
  *   **What it must have:**
      *   **Isolation:** No other humans to practice on. No audience to judge him.
      *   **Gratitude/Service:** The dog has been a faithful companion (invokes Kant's specific point about duties of gratitude).
      *   **Dispositional Harm:** The man feels no "blunting" because there are no humans left to feel blunt toward.
  *   **What it must lack:**
      *   **Social Consequences:** No risk of him becoming a murderer of people.
      *   **Economic Utility:** The dog is not "stock."
  *   **Why this works:** It forces the question: "If no human is ever harmed, and no human sympathy is ever blunted, why is this wrong?"
      *   *Kant's Answer:* Because the man has treated a living analogue of humanity as a mere thing, thereby violating the dignity of his own moral nature. He has made himself unfit for the *concept* of duty, even if there are no other duty-bearers around.

  ---

  ### 3. Misconception Management (Interception Points)

  Do not save misconceptions for a Q&A at the end. Head them off as they arise in the sequence.

  **1. "Animals are just machines" (Descartes vs. Kant)**
  *   **Intercept Point:** Phase 1 (Status of the Animal).
  *   **Strategy:** Explicitly distinguish *sentience* from *personhood*. Kant grants animals feeling and pain (unlike Descartes' automata). What they lack is *autonomy* (the ability to legislate moral law for themselves).
  *   **Why:** If the vets think Kant denies pain, they disengage. Confirm pain, deny *moral agency*.

  **2. "Indirect Duty means it's not a real duty" / "Broken Utilitarianism"**
  *   **Intercept Point:** Phase 2 (Ground of Duty).
  *   **Strategy:** Define "Indirect" immediately as "relational," not "instrumental."
      *   *Instrumental:* "Don't kick the dog *so that* you don't kick the man." (This is the trap).
      *   *Relational/Constitutive:* "Don't kick the dog *because* kicking it constitutes a failure of your own moral self-regard."
  *   **Why:** This kills the "fancy dress utilitarianism" charge before it lands. The duty is direct *to the self*, indirect *to the animal*.

  **3. "Animals can't reason" (The Gotcha)**
  *   **Intercept Point:** Phase 1 (Status).
  *   **Strategy:** Concede the point but reframe its relevance. "Kant agrees they can't reason. That is precisely *why* the duty is structured this way. If they could reason, they would be ends-in-themselves. The argument *depends* on them not reasoning."
  *   **Why:** Prevents the scientist from feeling Kant is ignorant of ethology. It's a metaphysical claim, not a biological one.

  **4. The Vet's Sociopath ("Cruelty doesn't always blunt sympathy")**
  *   **Intercept Point:** Phase 3 (Empirical Symptom).
  *   **Strategy:** You have already grounded the duty in Phase 2 (Self-Respect). When the Vet raises this, say: "Exactly. That is why the 'blunting' argument is secondary. Even if the sociopath remains lovely to his family, he has still treated a sentient analogue of humanity as a thing. He has damaged his own moral standing, regardless of the empirical outcome."
  *   **Why:** Validates the Vet's expertise while protecting the philosophical structure.

  **5. The Lawyer's Retrofit ("Korsgaard / Ends-in-Themselves")**
  *   **Intercept Point:** Phase 5 (Wrap/Objections).
  *   **Strategy:** Acknowledge it as a valid *development* of Kantianism, but distinct from *Kant*. "Korsgaard uses Kant's tools to build a house Kant wouldn't enter. We are looking at Kant's blueprint, not the renovation."
  *   **Why:** Prevents the session from sliding into "How do we get animal rights?" which isn't the topic.

  ---

  ### 4. Time Allocation & The "Cut"

  **00-15: The Status of the Animal.** (Sentience vs. Autonomy. Not machines, but not persons.)
  **15-40: The Architecture of Duty.** (Direct to Self, Indirect to Animal. The "Constitutive" vs "Instrumental" distinction.)
  **40-60: The Carrying Example.** (The Desert Island. Work through why it's wrong without humans.)
  **60-70: Objections.** (Vet's Sociopath, Lawyer's Korsgaard.)
  **70-75: The Final Question.**

  **What to Leave Out (Announce this):**
  *   **Textual Discrepancies:** Do not get into the differences between the *Lectures on Ethics* and the *Metaphysics of Morals*. Announce: "Kant's writings on this are scattered and sometimes inconsistent. We are reconstructing the *strongest version* of the argument, not doing textual archaeology."
  *   **The "Monster" Defense:** Do not spend time apologizing for Kant. Announce: "We are not here to decide if Kant was a good person, or if his view satisfies modern intuitions. We are here to see if the *logic* holds together on its own terms."

  **The Final Question (To test understanding):**
  Do not ask "What do you think?" Ask a structural question that forces them to use the distinction you taught.

  *   *"If we discovered tomorrow that pigs possess full moral autonomy, does Kant's argument against cruelty to **dogs** change?"*
      *   *Correct Answer:* No. The duty regarding the dog rests on the *human's* disposition, not the pig's status.
      *   *Wrong Answer:* Yes, because now we know animals matter more. (This shows they reverted to direct duty/utilitarianism).

  *   *Alternative (Simpler):* *"On this view, is it possible to be cruel to an animal without doing anything wrong?"*
      *   *Correct Answer:* No. (Because the wrong is to the self).
      *   *Wrong Answer:* Yes, if no one sees / if it doesn't affect your mood. (This shows they missed the 'Duty to Self' point).

  ### 5. Summary of the "Load-Bearing" Move

  Your hunch is right. The **Duty-to-Oneself** is the load-bearing wall.
  *   If you put **Blunting Sympathy** first, the wall is made of empirical mud. The Vet washes it away.
  *   If you put **Duty-to-Oneself** first, the wall is made of deontological stone. The "Blunting" is just the graffiti on the wall.
  *   **Instruction:** When you explain Duty-to-Oneself, use the word **"Dignity."** Not "welfare," not "feeling." You damage your own *dignity* by acting as if a sentient being is a thing. That is a priori. It does not depend on sociopaths.

  Stick to this architecture, and you keep them out of the utilitarian trap.
