      *Actually, let's look at the GP's point.* "No resident can know... which tier they are in." This is a violation of procedural fairness. If I approve, I must mandate a fix.
      *Let's look at the Equity point.* "Two-tier citizenship." This is a claim about dignity.
      *Decision:* I will recommend **Approval contingent on specific transparency and opt-out modifications.** This rules against the Objecting Members' implication that the program *cannot* be ethically run. I will articulate their "Two-Tier" argument as the strongest case against my ruling.

      *Wait, checking the "Settled vs Live" instruction again.*
      Settled: Transparency/Explainability in algorithmic governance (mostly).
      Live: Whether differential paternalism based on predicted capacity is inherently dignitary harm.
      I need to make sure I don't present the "Live" debate as settled.

      *Revised Plan:*
