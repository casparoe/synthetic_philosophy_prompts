answer: |-
  You have accurately dissected a cluster of behavioral economic concepts that are often lumped together under "Ambiguity Aversion," but your intuition is correct: that single term is too blunt to capture the nuances you're describing.

  You are describing three distinct psychological mechanisms that operate simultaneously. Here are the specific terms for each half of your observation, and where your description aligns or diverges from the academic definitions.

  ### 1. The "Two Urns" Effect: The Ellsberg Paradox
  **The Concept:** **Ambiguity Aversion** (demonstrated by the **Ellsberg Paradox**).
  **Where you line up:** This is the exact scenario Daniel Ellsberg proposed in 1961. You prefer the known risk (Urn 1: 50/50) over the unknown risk (Urn 2: ?/?), even though mathematically, if you bet on Red in Urn 1 and Black in Urn 1, you are implying Urn 2 must be favorable for one of them. Standard utility theory says you should be consistent; human behavior says "I don't like what I can't measure."
  **Where you diverge:** Standard Ambiguity Aversion is often taught as a stable personality trait or a fixed preference. Your observation that the aversion *vanishes* when Urn 1 is removed suggests it isn't a fixed trait, but a contextual reaction. This leads us to the second concept.

  ### 2. The "Urn 1 Leaves the Room" Effect: Comparative Ignorance
  **The Concept:** **The Comparative Ignorance Hypothesis** (Fox & Tversky, 1995).
  **What it is:** This is the specific term for why your "squirminess" disappears when the clean urn is removed. Fox and Tversky demonstrated that ambiguity aversion is significantly heightened when an ambiguous option is evaluated **jointly** with a clear option, compared to when it is evaluated **separately**.
  **Why it fits:** When Urn 1 is on the table, your ignorance about Urn 2 is *salient*. You feel incompetent because you know exactly what you *don't* know. When Urn 1 is removed, you are in "Separate Evaluation" mode. There is no benchmark for clarity, so the ambiguity feels like standard risk. You aren't "braver"; the *contrast* that created the discomfort is gone.
  **The Nuance:** This explains your "Joint vs. Separate" observation perfectly. It validates your feeling that "Ambiguity Aversion" is incomplete because it ignores the *reference point* provided by the known urn.

  ### 3. The "Smiling Friend" Effect: Betrayal Aversion
  **The Concept:** **Betrayal Aversion** (or **Strategic Uncertainty**).
  **What it is:** This distinguishes between uncertainty caused by *Nature* (the bin scooped blind) and uncertainty caused by *Agents* (the friend who knows the mix).
  **Why it fits:** You noted that if the balls are scooped from a destroyed bin, you are fine. If the friend knows the mix and smiles, you bail. This is not just ambiguity; it is **Information Asymmetry** coupled with **Adverse Selection**.
  *   **Nature's Uncertainty (Aleatory):** Randomness. You accept this.
  *   **Human Uncertainty (Epistemic/Strategic):** Someone else holds the information. You fear they are using that information to exploit you (the "Market for Lemons" scenario).
  **The Term:** Psychologists call this **Betrayal Aversion**. People will accept a high risk of loss from a random process (a coin flip) but will reject a lower risk of loss if there is a possibility that another human is manipulating the outcome to their advantage. The "stomach drop" you describe is the anticipation of being played, not the anticipation of losing the bet.

  ### Summary of the Cluster
  If you need to name the whole pattern, you are describing **Context-Dependent Ambiguity Aversion driven by Comparative Ignorance and Betrayal Aversion.**

  *   **Ambiguity Aversion:** The baseline dislike of unknown odds.
  *   **Comparative Ignorance:** Why the dislike spikes when a "known" option is present for comparison.
  *   **Betrayal Aversion:** Why the dislike spikes when the unknown odds are controlled by a potentially adversarial human rather than random chance.

  ### One Detail on Your "Flip"
  You mentioned: *"If instead he lets me choose which colour I'm backing after I've picked the urn, I flip, and now I'd rather have urn two."*

  This is a subtle variation often discussed under **Illusion of Control** or **Optimism Bias under Ambiguity**.
  When you must pick the color *before* the urn, you feel exposed to the ambiguity. When you pick the urn *then* the color, you may subconsciously feel you can "guess" the dominant color in the ambiguous urn (optimism), whereas the known urn is capped at 50%. In the absence of the "Comparative Ignorance" trigger (seeing Urn 1 first), the ambiguity of Urn 2 allows you to imagine the odds are in your favor. Once the "Smiling Friend" is introduced, **Betrayal Aversion** overrides this optimism instantly.

  ### Verdict
  You aren't missing a word; you've outgrown the simplified textbook definition.
  *   For the comparison effect: Use **Comparative Ignorance**.
  *   For the human element: Use **Betrayal Aversion**.
  *   For the whole setup: It is a **Social Ellsberg Paradox**.

  Your description lines up perfectly with the advanced behavioral economics literature; it only diverges from the introductory "Ambiguity Aversion" definition, which is why that term felt insufficient.
