  *   0: No stance or "cells = dead" without functional explanation.

  **2. The Mule Consistency Check (5 marks)**
  *   5: Explicitly addresses the mule conflict; resolves it (e.g., population vs. individual).
  *   3: Mentions mule but contradicts Shard verdict.
  *   0: Ignores the mule entirely.

  **3. Conceptual Analysis (5 marks)**
  *   5: Argues for/against binary vs. cluster concept with reasoning.
  *   3: States preference without justification.
  *   0: Treats "life" as obvious/unquestionable.

  **4. Argument Quality (5 marks)**
