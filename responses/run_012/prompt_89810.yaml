prompt: |-
  I'm a software engineer, no philosophy or history degree, and a few of us have a long-running pub argument about the French Revolution. My mate Tom says it was basically a class thing (bourgeoisie on the rise, etc.), Priya says no, it was ideology and ideas doing the driving, and I keep saying it was mostly accidents and people making dumb short-term calls. I want you to settle this with numbers instead of vibes.

  So: take these four ways of explaining the revolution -- (1) class struggle, i.e. social and economic interests, (2) ideology, i.e. political ideas and rhetoric, (3) contingency, i.e. accidents, personalities, and short-term screwups, and (4) whatever factor you think is most underrated by people who argue about this. You pick #4, name it, and say why it earns a place on the list.

  Then give me a percentage breakdown across those four for each of these episodes, with each row adding to 100: the fiscal crisis and the calling of the Estates General in 1788-89; the night in August 1789 when feudal privileges got abolished; the king's flight to Varennes and the turn against the monarchy; the September Massacres; the Vendée; the Terror turning on its own people (Danton and Desmoulins, then Robespierre); the abolition of slavery in the colonies in 1794; and the Thermidorian reaction. Put it in a table, and give me one line per row on why the numbers land where they do.

  Seperate from that, rate each of the four lenses out of 10 for how well it explains the thing revolutions supposedly do to themselves -- why the people who make a revolution so often get guillotined or exiled by the next wave of revolutionaries. And tell me straight whether "revolutions devour their children" is a real pattern or just a catchy line, plus what would count as evidence either way.

  Last bit: which single episode would flip your percentages the most if historians turned up new evidence, and what would that evidence have to show?

  Keep it concrete, don't hedge every row with "it's complicated," and I don't need reading lists or citations -- just the weights and the reasons. And please don't just summarise the Marxist view and the revisionist view and call it a day, I want your actual numbers.
