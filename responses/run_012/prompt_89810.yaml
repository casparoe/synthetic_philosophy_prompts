answer: |-
  ### Lens #4: Geopolitics & War (External Pressure)
  **Why it earns a place:** Pub arguments focus on internal French dynamics, but the Revolution didn't happen in a vacuum. France was surrounded by hostile monarchies (Austria, Prussia, Britain) almost immediately. War radicalized the state, created the emergency justification for the Terror, drove conscription (sparking the Vendée), and bankrupted the treasury. Without external threat, the internal pressure likely vents differently. It is the accelerant that turns a political crisis into a bloodbath.

  ### Episode Breakdown

  | Episode | Class (40%) | Ideology (20%) | Contingency (20%) | Geopolitics (20%) | Why the numbers land here |
  | :--- | :---: | :---: | :---: | :---: | :--- |
  | **Fiscal Crisis & Estates General (1788-89)** | 40 | 10 | 20 | 30 | Tax burden fell on the Third Estate, but the debt was primarily caused by funding the American War, and Necker's accounting errors triggered the timing. |
  | **Abolition of Feudal Privileges (Aug 1789)** | 20 | 40 | 30 | 10 | Nobles surrendered rights they couldn't enforce anyway; driven by Enlightenment rhetoric and a panicked night-session frenzy rather than economic calculation. |
  | **Flight to Varennes (1791)** | 10 | 30 | 50 | 10 | The monarchy collapsed because Louis got delayed by horses and recognized by a postmaster, shattering the ideological myth of the king's divine will. |
  | **September Massacres (1792)** | 10 | 10 | 40 | 40 | Mob panic over prison plots was directly triggered by news of the Prussian army advancing on Paris; ideology was a post-hoc justification. |
  | **The Vendée (1793)** | 40 | 20 | 10 | 30 | Peasants rose against bourgeois conscription laws and anti-clericalism, but the rebellion sustained itself due to British support and French war priorities. |
  | **Terror Purges (Danton/Robespierre)** | 20 | 40 | 30 | 10 | Factional kills were driven by ideological definitions of "virtue" and paranoid contingency, not class conflict since all were bourgeoisie. |
  | **Abolition of Slavery (1794)** | 20 | 30 | 0 | 50 | Decree was a pragmatic move to secure Saint-Domingue against Britain and utilize rebel forces, not purely a moral application of Rights of Man. |
  | **Thermidorian Reaction (1794)** | 50 | 10 | 30 | 10 | The bourgeoisie stopped the Terror to secure property and lives; contingency mattered because deputies feared they were next on the list. |
  | **Total** | **100** | **100** | **100** | **100** | *(Row sums verified)* |

  ### Do Revolutions Devour Their Children?

  **Lens Ratings for Explaining Self-Cannibalism:**
  *   **Class Struggle:** 6/10 (Explains elite replacement, but not why allies kill allies within the same class).
  *   **Ideology:** 9/10 (Purity spirals demand constant purification; today's radical is tomorrow's moderate).
  *   **Contingency:** 8/10 (Power vacuums incentivize preemptive strikes to secure personal safety).
  *   **Geopolitics:** 8/10 (War creates a "fifth column" paranoia where dissent equals treason).

  **Verdict:**
  "Revolutions devour their children" is a **real pattern**, but only in *radicalizing* revolutions under *external threat*. It is not a universal law of regime change.

  **Evidence Criteria:**
  *   **For:** High correlation between revolutionary tribunals and periods of foreign war or civil war (e.g., France 1793, Russia 1937, Iran 1981).
  *   **Against:** Revolutions that transition to stability without mass purges of leadership (e.g., American Revolution, Glorious Revolution, post-Franco Spain). If the "devouring" stops when the war ends, the cause is Geopolitics/Contingency, not Ideology.

  ### The Flip Point

  **Episode:** **Abolition of Slavery in the Colonies (1794)**

  **Current Weighting:** Geopolitics (50%), Ideology (30%), Class (20%).

  **Evidence Required to Flip:**
  A discovered private memorandum from the Committee of Public Safety dated *before* the arrival of news regarding the slave revolt in Saint-Domingue and the British invasion, explicitly instructing commissioners to abolish slavery based solely on the *Declaration of the Rights of Man*.

  **Impact:**
  If this existed, Ideology jumps to 60% and Geopolitics drops to 20%. It would prove the Revolution exported universal rights even when strategically suicidal, validating Priya's "ideas drive history" argument over your "accidents/interests" view. Currently, the evidence suggests they legalized freedom because they needed the slaves as soldiers against the British.
