      *   *Initial thought:* Blame the therapists entirely.
      *   *Correction:* Hacking's point is co-construction. Patients weren't just passive; they adopted the identity.
      *   *Refining the "Reverse Loop":* Be careful not to invent a Hacking term. Call it "negative feedback" or "niche collapse."
      *   *Realism:* Make sure to emphasize that Hacking isn't a social constructivist in the "nothing is real" sense, but a "dynamic nominalist."

  10. **Final Review against Prompt:**
      *   Shape verification? Yes.
      *   Loop mapped (who, whom, feedback)? Yes.
      *   Mechanisms identified? Yes.
      *   Extinction/Transient analysis? Yes.
      *   Realism question? Yes.
      *   Rival accounts used sparingly? Yes.
      *   Honest concluding paragraph? Yes.

