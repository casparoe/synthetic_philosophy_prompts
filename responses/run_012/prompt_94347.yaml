      *   *Q4: Coming into existence vs. Continuing to live?*
          *   Crucial distinction. Once you exist, you have interests. Death deprives you of future goods. Non-existence (before birth) does not deprive. So, the asymmetry applies to *procreation*, not necessarily *suicide* or *continued life*. The book's omission hides this distinction.

  5.  **Drafting the Verdict:**
