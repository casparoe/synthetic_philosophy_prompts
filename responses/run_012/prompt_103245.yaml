  Good afternoon. For those who don't know me, I'm Ruthie's nephew. Looking out at this room, I see about a hundred people who speak actuarial, and about a hundred who speak English. Ruthie spoke both, though she often wished the rest of us were more fluent in precision.

  If you were at her Thanksgiving table, you learned one rule quickly: you were not allowed to say "the odds were against it," or "what were the chances," when talking about something that only happened once. If someone mentioned the weather, or a health scare, or the Browns making the playoffs, and you asked about the probability, Ruthie would put down her fork. She wouldn't be angry, just corrective. She believed that saying "this is unlikely" was often a way of hiding how little we actually knew.

  She spent forty-one years at a mid-size life insurer in Ohio not because she loved guessing the future, but because she loved measuring what we know about the present. She held a view that most of us never hear about: that how likely something is, and how much evidence you have to support that belief, are two different things. You can have a guess that feels fifty-fifty, and a conclusion backed by decades of data that also feels fifty-fifty. To Ruthie, those were not the same. One was a guess. The other was knowledge. She believed you should act on the weight of what you know, not the comfort of a number.

  I saw this clearly when I got engaged. I was nervous, as anyone is. I told her I was worried about the statistics. I said, "Aunt Ruthie, what are the chances this actually lasts? You see the divorce rates."

  She didn't offer me a platitude. She didn't tell me everything would be fine. She looked at me and said, "Those numbers belong to strangers. They don't live in your house. You don't have odds; you have history. You have three years of knowing how he handles stress, how he treats waiters, how he apologizes. That is evidence. The national average is noise."

  She wasn't telling me I was guaranteed success. She was telling me that I was asking the wrong question. She wanted me to stop looking for a prediction and start looking at the foundation. She refused to let me comfort myself with a statistic, but she also refused to let me despair over one. She wanted me to trust the weight of the evidence I held in my own hands.

  It would be a mistake to think this made her cynical. She didn't believe nothing could be known. She believed quite the opposite: that if you did the work, if you gathered the observations, if you refused to confuse a hunch with a calculation, you could know things deeply. She found comfort in rigor. She found peace in not pretending to know what she couldn't.

  We are here because she knew us, individually and specifically. She didn't love us based on the probability of our success. She loved us based on the evidence of our character. That is a much heavier thing, and it holds much better.

  We will miss her corrections. We will miss her precision. But mostly, we will miss the safety of her clarity. In a world that loves to guess, she taught us to look at what we actually hold.

  Throughline: Ruthie taught us that true confidence comes not from predicting the future, but from respecting the weight of the evidence we have in the present.
