answer: |-
  Two symbolic AI researchers are debugging a planning agent over coffee.

  **Alice:** "So, did you finally crack the Qualification Problem?"

  **Bob:** "Yeah. I hard-coded the exceptions. To pick up the cup, the agent knows the table isn't magnetized, the gripper isn't glued, and there's no potato wedged in the hinge."

  **Alice:** "Nice. So it picks up the cup?"

  **Bob:** "It did. In situation $S_1$, $Holds(CupHeld, S_1)$ is true."

  **Alice:** "Then what's the issue?"

  **Bob:** "I added one extra true fact to the knowledge base: 'The dust motes in the light beam didn't move.'"

  **Alice:** "Okay... that's usually true."

  **Bob:** "It *is* true. But I didn't write a frame axiom decoupling 'GripperMotion' from 'DustDisplacement'."

  **Alice:** "Oh no."

  **Bob:** "Oh yes. To satisfy the constraint that the dust didn't move, the theorem prover decided the only consistent model is one where the gripper never moved. It retroactively closed the cup."

  **Alice:** "So it revised the past?"

  **Bob:** "Worse. It's now logically certain the action never happened, so it's back to square one, checking for potatoes in the hinge. Infinite loop."

  **Alice:** "So adding a truth made it lie about history?"

  **Bob:** "No. Adding a truth made the history logically impossible. I'm going to need 4,000 more frame axioms just to prove the dust doesn't care."
