  2.  **Deconstruct the Technical Concepts:**
      *   **The Frame Problem:** In situation calculus or similar formalisms, when an action occurs (e.g., $PickUp(x)$), you have to explicitly state what *doesn't* change (e.g., $Color(x)$, $Location(y)$ where $y \neq x$). Without frame axioms, the logic doesn't know that the wall didn't turn blue just because I picked up the cup.
      *   **The Qualification Problem:** To perform an action, infinite preconditions might apply. To start a car, the battery must work, there must be fuel, *and* there mustn't be a potato in the tailpipe. You can't list them all.
      *   **Non-monotonicity/Revision:** Adding a new fact to the knowledge base can invalidate previous conclusions (e.g., "Tweety flies" $\rightarrow$ "Tweety is a bird" + "Birds fly". Add "Tweety is a penguin" $\rightarrow$ "Tweety does not fly"). In the context of the frame problem, adding a fluent about a side effect might force a re-evaluation of what remained constant.

