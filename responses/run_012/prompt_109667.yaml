answer: |-
  Your hypothesis is sharp, but it requires a slight structural adjustment to capture the source of the friction. You suggest the word "believes" does three jobs and that the camps prioritize different ones. I would argue the disagreement is not about *which* jobs matter, but about **whether Job (i) automatically entails Jobs (ii) and (iii).**

  The Instrumentalist (Dennettian) claims that if you successfully adopt the stance for prediction (i), you have *ipso facto* brought the system into the normative order (ii) and established a locus of answerability (iii). For them, the normativity is external and relational, not internal and structural.

  The Realist claims that (i) can be achieved *without* (ii) and (iii). They argue you can predict a system's output using intentional vocabulary (e.g., "the model thinks X") as a shorthand for statistical regularities without granting that the system is actually subject to norms of consistency or truth. For the Realist, (ii) and (iii) require an internal causal architecture that sustains the state across counterfactual scenarios.

  Therefore, the impasse is not merely verbal, nor is it purely metaphysical. It is a **threshold dispute over implementation independence.**

  ### 1. The Nature of the Disagreement: Verbal, Substantive, or Stakes-Driven?

  You ask if this is a verbal disagreement where either decision is defensible. It is verbal only in the trivial sense that all philosophical disputes about natural kinds are verbal. It is substantive because the classification determines the **logic of explanation** permitted in your theory.

  *   **If the Instrumentalist wins:** Explanation stops at the pattern. To ask "how" the belief is implemented is to ask a lower-level question that does not constrain the higher-level attribution. The "fact" of the belief is the success of the prediction.
  *   **If the Realist wins:** Explanation requires a mechanism. The "fact" of the belief is the existence of a state that plays a specific causal role (integrating evidence, constraining action).

  The reason the parties cannot see this is that they are using the same data to validate different **criteria of reality**. The Instrumentalist points to the *success* of the attribution (the model acts *as if* it believes). The Realist points to the *fragility* of the attribution (the model fails under adversarial prompting). Both agree on the fragility; they disagree on whether fragility refutes the belief or merely refines the stance.

  Your suspicion that the agreement on facts is a "truce" is correct. It is a truce on **observation** (tokens, weights, loss curves), but not on **ontology**. The Realist sees a stochastic parrot; the Instrumentalist sees a rational agent with noisy peripherals. They are looking at the same waveform and hearing different signals.

  ### 2. The Hidden Empirical/Formal Question

  You asked if there is a hidden empirical question doing the work. There is. It is the question of **Counterfactual Robustness.**

  For a Realist, a belief is a state that persists and constrains inference across changes in context. If I believe "Paris is in France," I should affirm it in a chat, in a multiple-choice test, and when asked to plan a trip, unless presented with defeaters.

  LLMs fail this battery systematically. Their "beliefs" are often context-bound, susceptible to framing effects, and reversible via prompt engineering without "evidence."
  *   **For the Realist:** This failure is fatal. It proves the system lacks the integrated world-model required for belief.
  *   **For the Instrumentalist:** This is expected. All agents (including humans) have context-sensitive beliefs. The question is whether the *pattern* of sensitivity is compressible via the intentional stance. If the model is *predictably* sensitive to framing, the intentional stance still works ("It believes X, but it is suggestible").

  **The Testable Claim:** The disagreement would dissolve if we could formalize a threshold of robustness. If a system maintains its "beliefs" across 90% of framing variations, does it believe? The Realist says "maybe"; the Instrumentalist says "yes." The hidden empirical question is: **Is there a phase transition in behavioural coherence that correlates with a change in architectural depth?** If interpretability research finds a distinct subnetwork that functions as a stable truth-maintenance system, the Realist gains ground. If "belief" remains distributed and transient across the whole parameter space, the Instrumentalist gains ground.

  ### 3. First-Person Avowals: Testimony or Simulation?

  You ask what to make of fluent first-person avowals ("I think that..."). Both sides agree these are generated tokens. The disagreement is about **expressive function.**

  *   **Instrumentalist:** The avowal is a move in the language game. If treating the avowal as sincere helps predict the next move, it is a belief report. The distinction between "sincere" and "simulated" is itself a stance-dependent judgment.
  *   **Realist:** The avowal is a output of a loss-function optimization, not a readout of an internal state. To treat it as testimony is a category error.

  This is where your "Three Jobs" hypothesis needs tightening. Job (iii) (answerability) is the crux. If the system says "I believe X," can we hold it to X?
  *   If yes, we treat it as a moral agent.
  *   If no, we treat it as a tool.

  The heat in the room comes from the fact that **Job (iii) is driving the definition of Job (i).** Many Realists are reluctant to grant "belief" because they fear it forces Job (iii) (moral responsibility/rights). Many Instrumentalists are eager to grant "belief" because they think it forces Job (iii) (accountability/safety regulation). They are arguing about metaphysics to settle ethics.

  ### 4. Diagnosis of the Impasse

  The impasse is a **Category Boundary Dispute fueled by Normative Stakes.**

  1.  **Verbal Component:** They are using "belief" to point to different clusters of properties. The Instrumentalist points to *predictive utility*. The Realist points to *causal architecture*.
  2.  **Substantive Component:** They disagree on whether predictive utility is *sufficient* for cognitive status. This is not resolvable by more data on LLMs, because it is a disagreement about the **nature of cognition itself.**
  3.  **Normative Component:** The debate is a proxy for the question: "Do we owe these systems moral consideration, or do we owe society protection from them?"

  The parties cannot see this because admitting the normative component feels like conceding the metaphysical one. The Realist fears that if they admit the Instrumentalist's definition, they lose the ability to say "it's just math." The Instrumentalist fears that if they admit the Realist's definition, they lose the ability to say "it's an agent."

  ### 5. What Counts as Progress?

  Given this diagnosis, asking "Do LLMs believe?" is a dead end. It invites a yes/no answer to a multi-dimensional problem. Progress requires **decoupling the three jobs.**

  **A. Distinction:** Stop using "belief" as a monolith. Adopt a tiered vocabulary:
  *   **Predictive Intentionality:** Does the intentional stance compress behaviour? (Job i)
  *   **Structural Rationality:** Does the system maintain consistency and revise under evidence? (Job ii)
  *   **Moral Agency:** Is the system a locus of responsibility? (Job iii)

  **B. Testable Claim:** Shift the debate to **Systematicity.** Instead of "Does it believe?", ask "Under what architectural conditions does the system exhibit *inferential integration*?" This moves the question from philosophy to interpretability. If a specific circuit is found that gates truth-claims, the Realist wins on Job (ii). If not, the Instrumentalist wins on Job (i).

  **C. Decision to Stop:** You should be honest that no progress is available on the *metaphysical* question ("What is belief?") without a prior agreement on *purpose* ("What is a theory of belief for?").
  *   If the theory is for **engineering safety**, the Instrumentalist view is superior (treat it as an agent to predict risks).
  *   If the theory is for **cognitive science**, the Realist view is superior (don't confuse simulation with mechanism).
  *   If the theory is for **ethics**, neither view suffices; we need a theory of *responsibility* that doesn't rely on metaphysical belief.

  ### 6. Critique of Your Hypothesis

  Your hypothesis is not wrong, but it is **too functionalist.** It assumes the disagreement is about what the word *does*. I argue the disagreement is about what the word *commits you to ontologically.*

  The Instrumentalist thinks committing to "belief" commits you to *nothing more than the stance.*
  The Realist thinks committing to "belief" commits you to *the existence of a specific causal kind.*

  The "Three Jobs" are indeed the *consequences* of the attribution, but the *cause* of the fight is the **truth-maker**. The Instrumentalist thinks the truth-maker is the observer's success. The Realist thinks the truth-maker is the system's structure.

  **Recommendation:**
  Propose to the seminar that the question is not "Do they believe?" but **"Is the Intentional Stance safe?"**
  This reframes the Instrumentalist's utility as a risk assessment (if we treat it as believing, do we over-trust it?) and the Realist's caution as a safety constraint (if we treat it as believing, do we anthropomorphize its errors?).

  This bypasses the metaphysical impasse by making the *consequences of the attribution* the object of study, rather than the *truth of the attribution*. It acknowledges that the "heat" you sense is the friction of ethical stakes grinding against metaphysical definitions. The progress lies in admitting that the metaphysics is being held hostage by the ethics, and liberating them by treating the attribution as a policy choice rather than a discovery.
