answer: |-
  # Teaching Plan: Aumann's Agreement Theorem
  **Duration:** Two 90-minute sessions
  **Format:** Whiteboard only (no slides)
  **Audience:** Mixed Economics (Year 3) and Philosophy (Epistemology focus)
  **Tone:** British Academic

  ## Session 1: The Architecture of Information (90 Minutes)

  **Objective:** Establish the partition model and the precise definition of 'common knowledge'. Do not mention the theorem yet. If you state the theorem before they grasp the 'meet of the partition', you will lose the philosophers to logic-chopping and the economists to hand-waving.

  ### 1. The State Space and Partitions (0–40 mins)
  *   **The Hook:** Start with the problem of *coordination under uncertainty*, not agreement. Ask: "How do we model what you know, versus what I know, about the same world?"
  *   **The Whiteboard Setup:** Draw a large rectangle. Label it $\Omega$ (the State Space). Explain that exactly one point in this rectangle is the true state of the world, but the agents do not know which point.
  *   **The Partition:** Draw a grid inside the rectangle for Agent 1 (horizontal strips) and a different grid for Agent 2 (vertical strips).
      *   **Crucial Definition:** A cell in Agent 1's partition represents the set of states Agent 1 *cannot distinguish between*. If the true state is in a cell, Agent 1 knows it is *somewhere* in that cell, but not where.
      *   **Drill:** Ask a student to point to a state $\omega$. Ask another student: "What does Agent 1 know here?" They must point to the whole horizontal strip.
      *   **Why this matters:** This kills the notion that 'information' is just a list of facts. Information is a *restriction on possibility*.
  *   **Posteriors:** Assign a probability measure over $\Omega$. Show how an agent updates their belief conditional on their cell.
      *   *Note:* Keep the maths light. Use counts or simple fractions. The economists will fill in the measure theory; the philosophers need the conceptual topology.

  ### 2. Mutual vs. Common Knowledge (40–75 mins)
  *   **The Trap:** This is where the room will split. Economists will hear 'everyone knows'; Philosophers will hear 'infinite hierarchy'. You must unify them visually.
  *   **Definition:**
      *   *Mutual Knowledge:* Everyone knows $E$. (Draw a circle $E$ that covers whole cells for both agents).
      *   *Common Knowledge:* Everyone knows $E$, everyone knows that everyone knows $E$, ad infinitum.
  *   **The Visual Solution (The Meet):** Do not write out the infinite hierarchy $K_i K_j K_i...$. It bores the economists and frustrates the philosophers who want formal logic. Instead, draw the **Meet of the Partitions**.
      *   Trace the 'reachability' path. From a state $\omega$, where can Agent 1 think we are? From there, where can Agent 2 think we are?
      *   Shade the smallest set containing $\omega$ that is a union of *both* Agent 1's and Agent 2's cells. This is the **Common Knowledge Partition**.
      *   **The Rule:** An event is common knowledge at $\omega$ if and only if the Common Knowledge Partition cell containing $\omega$ is fully contained in the event.
  *   **Check for Understanding:** Draw an event that is Mutual Knowledge but *not* Common Knowledge. Ask them to trace why the infinite regress fails (the path escapes the event).
  *   **Timing for Misconception #1:** *"Common knowledge just means everyone knows."*
      *   **Intervention:** Head this off *here*, during the 'Meet' drawing. Explicitly state: "If you leave today thinking common knowledge is mutual knowledge, you have not understood the theorem. The theorem relies on the infinite chain, which this geometry captures."

  ### 3. The Common Prior Assumption (75–90 mins)
  *   **Setup:** Introduce the idea that before they looked at their partitions, they started with the same probability distribution over $\Omega$.
  *   **The Suspicion:** Do not justify this yet. Mark it with a red asterisk on the board. Tell them: "This is the engine of the theorem. Next time, we will see what happens if we remove it. For now, assume it holds."
  *   **Homework Thought:** Ask them to consider: "If two people look at the same world but process it differently (different partitions), can they bet against each other?"

  ---

  ## Session 2: The Theorem and Its Discontents (90 Minutes)

  **Objective:** State the theorem, prove it intuitively using Session 1's geometry, and systematically dismantle the misconceptions.

  ### 1. Stating the Theorem (0–20 mins)
  *   **The Statement:** "If agents have a Common Prior, and their posterior probabilities for an event are Common Knowledge, then those posteriors must be identical."
  *   **The Geometry of the Proof:** Return to the 'Meet' diagram from Session 1.
      *   Pick a cell in the Common Knowledge Partition.
      *   Remind them: Inside this cell, Agent 1's partition cells sum to the whole, and Agent 2's partition cells sum to the whole.
      *   Because the Prior is common, the weighted average of Agent 1's posteriors over this common cell must equal the weighted average of Agent 2's posteriors.
      *   If the posteriors are *constant* (common knowledge) over this cell, the averages are the values themselves. Therefore, the values must be equal.
      *   **Visual:** Write the expectation equation on the board. $\mathbb{E}[p_1 | \text{Meet}] = \mathbb{E}[p_2 | \text{Meet}]$. If $p_1, p_2$ are CK, they are constant on the Meet. Thus $p_1 = p_2$.
  *   **Timing for Misconception #2:** *"Rational people always end up agreeing on the truth."*
      *   **Intervention:** Stop immediately after stating the theorem. Clarify: "They do not agree on the *state of the world*. They do not even necessarily agree on the *truth* of the event. They agree on their *assessment of probability*. They can both be wrong, but they cannot assign different numbers."

  ### 2. The Carrying Example: The Two Jurors (20–50 mins)
  *   **Judgment on your 'Doctors' Example:**
      *   **Verdict:** Do not use the 'Two Doctors deciding whether to operate' as your primary carrying example.
      *   **Reason:** It conflates *belief* (probability of success) with *action* (operate/don't). Aumann is strictly about beliefs. Two doctors can agree on a 60% success rate but disagree on surgery due to different utility functions (risk aversion, malpractice fear). This introduces a confounder you do not want to untangle on a whiteboard.
      *   **The Cheat:** It quietly presents the Common Prior as an obvious truth ("same training"). You want them to leave suspicious of the Common Prior.
  *   **Recommended Example: The Two Jurors.**
      *   **Setup:** $\Omega$ = {Guilty, Innocent}. Actually, make $\Omega$ larger: {Suspect A, Suspect B, Suspect C, Innocent}.
      *   **Whiteboard:** Use the same Rectangle $\Omega$ from Session 1.
      *   **Priors:** Both start with uniform distribution (Presumption of Innocence).
      *   **Partitions:** Juror 1 has an alibi for Suspect A (groups A with Innocent). Juror 2 has DNA evidence excluding Suspect B (groups B with Innocent).
      *   **Posteriors:** They calculate probability of 'Guilty' (A or B or C).
      *   **The Reuse (Crucial Step):** Once you have shown they must agree under Common Prior, **erase the Prior**.
      *   **The Break:** Redraw the weights on $\Omega$. Juror 1 thinks Suspect A is 90% likely *a priori* (maybe a racist bias, maybe a hunch). Juror 2 thinks uniform.
      *   **Result:** Show that even with Common Knowledge of posteriors, they can now disagree. The geometry holds, but the weighted averages no longer match.
      *   **Timing for Misconception #4:** *"It's an idealization, so it says nothing about my uncle and his politics."*
          *   **Intervention:** This reuse kills this misconception. By showing exactly *where* the theorem breaks (the Common Prior), you validate their intuition about their uncle. "Your uncle disagrees with you not because he is irrational, but because his Prior is different. The theorem tells you that without a Common Prior, agreement is not guaranteed. It explains *why* disagreement persists, rather than dismissing it."

  ### 3. Misconceptions and Limits (50–80 mins)
  *   **Timing for Misconception #3:** *"So disagreement is irrational."*
      *   **Intervention:** Address this during the Juror example *before* breaking the prior. Emphasise: "Disagreement is irrational *only if* you have Common Knowledge of each other's beliefs. In the real world, do you actually know your uncle's posterior probability? Or just his conclusion?"
      *   **Point:** Private information allows disagreement. CK of posteriors is an incredibly high bar. It requires me to know your belief, know that you know mine, etc. Usually, we just shout conclusions.
  *   **The Refusal (80–85 mins):**
      *   **What to refuse:** Refuse to prove (or model) the **Communication Protocol**.
      *   **Script:** "I am not going to prove *how* they get to Common Knowledge. This theorem is a static impossibility result. It says 'If you are here, you cannot be different.' It does not tell you the dynamic process of conversation required to get 'here'. In reality, people rarely exchange enough information to make posteriors Common Knowledge. They exchange arguments, which are cheap talk. Do not mistake this theorem for a model of conversation."
  *   **Q&A and Wrap (85–90 mins)**

  ---

  ## Diagnostic Question
  *Do not ask:* "What does the theorem say?" (They will recite the slogan).
  *Ask this instead:*
  "Alice and Bob share a Common Prior. Alice knows Bob's posterior probability for event $E$ is 0.7. Bob knows Alice's posterior probability for event $E$ is 0.7. Is it possible for them to remain in this state without violating Aumann's theorem?"

  *   **Correct Answer:** Yes, it is possible. This is **Mutual Knowledge**, not Common Knowledge. They know each other's numbers, but they might not know that the other *knows* they know. The infinite chain is broken.
  *   **Why this works:** It forces them to distinguish between the geometric 'Meet' (CK) and simple overlap (Mutual). If they answer "No, they must agree," they have only learned the slogan.

  ---

  ## Summary of Misconception Interventions

  | Misconception | When it surfaces | Where you head it off |
  | :--- | :--- | :--- |
  | **"Common Knowledge = Everyone Knows"** | Session 1, defining epistemic states. | During the 'Meet of the Partition' drawing. Explicitly contrast with Mutual Knowledge using the reachability path. |
  | **"Agreement on Truth/Facts"** | Session 2, stating the theorem. | Immediately after the statement. Clarify: Agreement on *posteriors*, not states or truth values. |
  | **"Disagreement is Irrational"** | Session 2, applying the Juror example. | Before breaking the prior. Emphasise the rarity of *Common Knowledge* of posteriors in real conversation. |
  | **"It's an Idealization / My Uncle"** | Session 2, conclusion. | When you break the Common Prior assumption in the Juror example. Show that different priors = rational disagreement. |

  ## Whiteboard Management Note
  You have two halves of the room with different reflexes.
  *   **For the Economists:** Keep the probability measure visible. Write $\mathbb{E}[\cdot]$ clearly. They need to see the linearity of expectation that drives the proof.
  *   **For the Philosophers:** Keep the 'Reachability' path visible. Use arrows to show $i$ knows, $j$ knows, $i$ knows. They need to see the epistemic logic topology.
  *   **The Bridge:** The 'Meet' diagram is the bridge. Ensure it remains on the board for the entire second session. Do not wipe the Session 1 geometry until the very end.

  ## Final Advice on Tone
  You are at a British university; the students will be sensitive to claims of absolute rationality. Frame the Common Prior not as a requirement of rationality, but as a requirement of *common origin*. "To agree, you must not only reason correctly; you must have started from the same place." This satisfies the philosophers' demand for justification and the economists' demand for initial conditions.
