      *(Refining Imprecise Credences)*: Accuracy-first traditionally forces precise credences (Probabilism). Accommodating imprecise credences is a major stress test. I should list this as a tension point.

      *(Refining Group Case)*: This is often ignored by accuracy-firsters. I need to make sure the desideratum demands an account, even if the account is "groups are just aggregates."

