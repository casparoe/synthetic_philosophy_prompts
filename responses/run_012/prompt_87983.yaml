answer: |-
  ### Desiderata for an Accuracy-First Epistemology

  The following list specifies the conditions any adequate theory within the accuracy-first program must satisfy. They are organized from formal core conditions to broader philosophical scope.

  #### 1. Truth-Directedness (The Core Constraint)
  *   **(a) Requirement:** For any proposition $P$, a credence $c_1$ must receive a strictly better accuracy score than $c_2$ if and only if $c_1$ is strictly closer to the truth value of $P$ than $c_2$ is.
  *   **(b) Motivation:** Consider a tautology $T$. A credence of 1.0 should score better than 0.9, which should score better than 0.5. If a scoring rule rewards a credence of 0.5 over 0.9 for a truth, the score is tracking something other than proximity to truth (e.g., caution or modesty). The metric must reflect the veritic goal exclusively.
  *   **(c) Status:** **Non-negotiable.** Any theorist within the program must accept this. Rejecting this collapses the distinction between accuracy-first epistemology and pragmatic or prudential accounts of belief.

  #### 2. Strict Properness (The Incentive Constraint)
  *   **(a) Requirement:** The scoring rule must be such that an agent who expects a proposition to be true with probability $p$ maximizes their expected accuracy score by reporting a credence of exactly $p$, and only $p$.
  *   **(b) Motivation:** Without this, the norm "Maximize Expected Accuracy" yields unstable recommendations. If the rule is not proper, an agent who believes $P$ is 70% likely might calculate that adopting a credence of 90% yields a higher expected score. This severs the link between an agent's actual epistemic state and the normatively recommended state.
  *   **(c) Status:** **Non-negotiable.** While some might accept mere "properness" (allowing ties), "strict" properness is required to uniquely pin down probabilistic coherence as the rational ideal. Rejecting this makes the derivation of probabilistic norms impossible.

  #### 3. Mathematical Hygiene (The Trilemma Constraint)
  *   **(a) Requirement:** The scoring rule should ideally be Bounded (scores fall within a finite range), Continuous (small changes in credence yield small changes in score), and Strictly Proper simultaneously, even over infinite algebras of propositions.
  *   **(b) Motivation:** Unbounded scores (e.g., logarithmic scoring) assign infinite penalty to certainty in falsehood, which seems disproportionate for finite agents. Discontinuous scores imply that a tiny shift in credence can cause a massive jump in epistemic value, which is unstable. However, formal results suggest these three properties conflict in infinite settings.
  *   **(c) Status:** **Preference/Camp Division.** Most formalists sacrifice Boundedness (accepting infinite penalties) to keep Continuity and Properness. Some (lexicographic approaches) sacrifice Continuity. A theory must explicitly state which property it surrenders and justify why that specific cost is acceptable for the domain.

  #### 4. Additivity (The Composition Constraint)
  *   **(a) Requirement:** The accuracy score of a whole credence function (a set of credences over an algebra) is the weighted sum of the accuracy scores of the individual credences assigned to each proposition.
  *   **(b) Motivation:** This allows the theory to evaluate complex belief states by evaluating their parts. Without additivity, we cannot easily compare credence functions over different algebras or determine the value of refining a partition.
  *   **(c) Status:** **Preference of the Dominant Camp.** Holists reject this, arguing that the value of a belief system depends on structural coherence (e.g., logical relations between propositions) that summation misses. Additivity simplifies the math but may miss epistemic synergies or redundancies.

  #### 5. Evidential Alignment (The Guidance Constraint)
  *   **(a) Requirement:** The theory must explain why an agent should maximize *expected* accuracy relative to their current credences, rather than *actual* accuracy relative to the truth, specifically in cases where evidence is misleading or incomplete.
  *   **(b) Motivation:** In the "New Evil Demon" case, an agent has misleading evidence suggesting a false proposition is true. Maximizing actual accuracy would require them to believe the truth (which they cannot access). Maximizing expected accuracy aligns with their evidence. The theory must justify why the *expectation* is the normative guide, not the *outcome*.
  *   **(c) Status:** **Non-negotiable.** If the theory cannot distinguish between being right by luck and being rational given evidence, it fails as a normative theory of rationality. However, the *mechanism* for this (e.g., a specific bridge principle) is theoretical.

  #### 6. Accommodation of Imprecision (The Representation Constraint)
  *   **(a) Requirement:** The theory must either demonstrate that doxastic states are always representable by a single precise probability function, or provide a scoring rule for set-valued/imprecise credal states that preserves the core accuracy-first insights.
  *   **(b) Motivation:** In cases of scarce evidence (e.g., "The urn contains red or blue balls, ratio unknown"), a precise credence of 0.5 seems unwarranted compared to an interval $[0, 1]$. If accuracy-first forces a precise 0.5, it conflicts with the intuition that evidence quality matters, not just evidence content.
  *   **(c) Status:** **Preference of the Orthodox Camp.** Orthodox accuracy theorists (Probabilists) reject imprecise credences as irrational or reducible. Imprecise Bayesians accept them. An adequate theory must take a stand; silence here is a gap.

  #### 7. Attitude Reduction (The Scope Constraint)
  *   **(a) Requirement:** The theory must specify whether full belief, suspension of judgment, and other doxastic attitudes are reducible to thresholded credences with their own accuracy conditions, or if they possess sui generis epistemic value not captured by credal accuracy.
  *   **(b) Motivation:** If I believe $P$ (threshold > 0.9) and $P$ is true, is that epistemically better than having a credence of 0.91? If the theory says "no difference," it must explain the utility of the concept of "belief." If it says "yes," it needs a scoring rule for binary attitudes.
  *   **(c) Status:** **Preference.** Reductionists (credence-only) reject sui generis value for belief. Dualists (belief + credence) require a more complex axiology. The theory must declare its ontology of attitude types.

  #### 8. Non-Bivalent Truth (The Metaphysical Constraint)
  *   **(a) Requirement:** The theory must define accuracy scores for propositions that lack a classical binary truth value (e.g., future contingents, vague predicates) or explicitly restrict its domain to bivalent propositions.
  *   **(b) Motivation:** Consider "This heap is a pile." If truth is a matter of degree, or if the future is open, a credence of 0.5 might be perfectly accurate even if no binary fact obtains. A theory relying on binary truth values cannot evaluate accuracy in these domains without modification.
  *   **(c) Status:** **Preference of the Classical Camp.** Many accuracy theorists restrict the domain to classical propositions to avoid metaphysical quagmires. A general theory should address this, but a restricted theory can be adequate within its domain.

  #### 9. Social Aggregation (The Group Constraint)
  *   **(a) Requirement:** The theory must account for the epistemic value of a community's division of cognitive labor, explaining cases where individual accuracy is sacrificed for group reliability, or explain why such cases are not epistemically valuable.
  *   **(b) Motivation:** In scientific communities, it may be optimal for some agents to hold minority views (lowering their individual expected accuracy if the majority is right) to ensure the group explores the hypothesis space. If accuracy-first is strictly individualistic, it cannot explain the value of this cognitive diversity.
  *   **(c) Status:** **Preference.** Individualists treat group epistemology as derivative. Social epistemologists within the program demand a non-reductive account. Ignoring this limits the theory's application to solitary agents.

  #### 10. Veritistic Value (The "Why-Care" Constraint)
  *   **(a) Requirement:** The theory must provide a non-circular justification for why accuracy (proximity to truth) is the fundamental epistemic good, rather than a proxy for pragmatic success, understanding, or coherence.
  *   **(b) Motivation:** A skeptic asks: "Why should I care if my credences match the world? What if being accurate makes me miserable or prevents me from acting?" If the answer is "because it's rational," the argument is circular. The value of truth must be grounded.
  *   **(c) Status:** **Non-negotiable.** This is the foundational axiom. Without a defense of veritism, the program is merely a formal game with no normative grip on agents who do not already value truth.

  ***

  ### Incompatibility Analysis and Theoretical Trade-offs

  There are specific subsets of these desiderata that generate formal or philosophical tensions. A committed theory cannot simply assert all of them; it must navigate the conflicts.

  **1. The Mathematical Trilemma (Desiderata 2 & 3)**
  *   **Conflict:** On infinite algebras, you cannot have a scoring rule that is Bounded, Continuous, and Strictly Proper simultaneously.
  *   **Resolution:** I would surrender **Boundedness**.
  *   **Cost:** Accepting unbounded scores (like the logarithmic rule) means that being certain of a falsehood incurs an infinite accuracy penalty. This is counterintuitive for finite agents who make mistakes. However, surrendering Continuity makes the score hypersensitive to tiny credence shifts, and surrendering Strict Properness destroys the derivation of norms. Infinite penalty is the least damaging formal artifact.

  **2. Additivity vs. Holistic Evidence (Desiderata 4 & 5)**
  *   **Conflict:** Additivity assumes the value of a belief state is the sum of parts. However, Evidential Alignment often requires sensitivity to the *structure* of evidence (e.g., whether beliefs are based on independent sources). Summing local scores can miss the epistemic value of coherence or the disvalue of double-counting evidence.
  *   **Resolution:** I would surrender **Additivity** in favor of a more complex aggregation function.
  *   **Cost:** This makes the formalism significantly harder to work with. Proving representation theorems (that rationality implies probabilism) becomes much more difficult without separability. However, preserving the link to evidence quality is more important than mathematical convenience.

  **3. Individual Accuracy vs. Group Division of Labor (Desiderata 2 & 9)**
  *   **Conflict:** Strict Properness incentivizes each agent to report their true expectation. But in a group seeking to solve a problem, it might be better for the *system* if agents adopt diverse priors, even if that lowers some individuals' expected accuracy relative to the truth.
  *   **Resolution:** I would surrender the **Individualist Interpretation of Properness** in the group context.
  *   **Cost:** This requires a multi-level theory where individual norms are subordinate to collective accuracy goals. It complicates the notion of "rationality" by making it role-dependent.

  ### The Workhorse and The Dealbreaker

  **The Workhorse Requirement: Strict Properness (Desideratum 2)**
  This is the single requirement that does the most work in ruling out candidate theories. Without strict properness, the accuracy-first program cannot derive Probabilism (the norm that credences should obey the probability calculus). It is the engine that converts the *value* of accuracy into a *norm* of rationality. If a scoring rule is not strictly proper, an agent can expect to do better by distorting their credences, and the link between "being rational" and "having coherent credences" dissolves. Almost all technical debates in the field revolve around which strictly proper rules are permissible.

  **The Dealbreaker Desideratum: Veritistic Value (Desideratum 10)**
  If I had to abandon the program entirely, it would be because this desideratum cannot be satisfied. The formal machinery (Properness, Additivity, etc.) is robust; we can tweak math. But if it turns out that accuracy is not the *fundamental* epistemic good—if, for example, "understanding" or "justification" is valuable even when disconnected from truth, or if truth itself has no normative pull independent of pragmatic utility—then the accuracy-first program is building a cathedral on a void. If the "Why-Care" demand yields only circular answers ("truth is good because it is the goal of belief"), the program fails to justify itself to a skeptic. I would patch mathematical inconsistencies, but I cannot patch a foundational axiology that fails to ground the value of truth.
