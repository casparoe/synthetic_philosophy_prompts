  2.  **Deconstruct the Pressure Points & Brainstorm (Internal):**
      *   *Core Case:* Needs a scoring rule $s(v, c)$ where $v$ is truth value, $c$ is credence. Needs to be truth-directed (closer to truth = better score).
      *   *Properness:* Essential for connecting accuracy to rationality. If not proper, agents are incentivized to lie to themselves. Strict properness is usually demanded to pin down a unique optimal credence.
      *   *Bounded/Continuous/Strictly Proper:* There's a known theorem (Predd et al. / Pettigrew context) that you can't have all three on infinite algebras. Boundedness avoids infinite penalties. Continuity avoids jumps. Strict properness ensures uniqueness. Which one goes?
      *   *Additivity:* Is global accuracy just the sum of local accuracies? Separability is nice for math, but holistic views (holism of confirmation) might reject it.
      *   *Evidence Gap:* Accuracy is veritic (truth-related), Evidence is relational. Why follow evidence if it doesn't maximize expected accuracy (e.g., in cases of misleading evidence or self-fulfilling beliefs)? Need a bridge principle (e.g., Principal Principle or Norm of Expectation).
      *   *Imprecise Credences:* If I represent belief as a set of functions, how do I score the set? Minimax? Average? This challenges the uniqueness of the probability function.
      *   *Non-Credal Attitudes:* Belief/Suspension. Can these be reduced to thresholds of credence? Or do they have sui generis value (e.g., understanding)?
      *   *Non-Bivalent:* Future contingents, vagueness. If there is no truth value, accuracy is undefined. Need a generalization (e.g., degree of truth).
      *   *Group Case:* Division of labor. One person might be less accurate to allow the group to be more robust. Accuracy-first is often individualistic.
      *   *Why-Care:* Veritism. Why is truth the goal? Pragmatic arguments? Constitutive arguments?

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *D1 (Truth-Directedness):* Core. If you move closer to truth, score improves.
      *   *D2 (Strict Properness):* Core. Incentive compatibility.
      *   *D3 (Mathematical Hygiene):* Boundedness/Continuity. The "Trilemma."
