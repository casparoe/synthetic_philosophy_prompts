      *   *D6 (Imprecision):* Handling sets of probabilities.
      *   *D7 (Attitude Reduction):* Belief as thresholded credence.
      *   *D8 (Non-Classical Truth):* Vagueness/Contingents.
      *   *D9 (Social Epistemology):* Group accuracy vs. Individual accuracy.
      *   *D10 (Normative Force):* The "Why Care" question.

      *Refining (c) Status:* I need to be careful here. Some things are central to the *program* (e.g., Properness), others are specific *implementations* (e.g., Additivity). I need to distinguish between "Accuracy-First" generally and "Joycean/Pettigrew-style" specificisms.

  4.  **Addressing the Incompatibilities (The "Hard Part"):**
      *   *The Trilemma:* Bounded + Continuous + Strictly Proper on infinite algebras is impossible. Most sacrifice Boundedness (allow infinite penalty for certainty in falsehood) or Continuity (lexicographic rules).
      *   *Additivity vs. Holism:* If propositions are logically connected, summing local scores might double-count or miss structural coherence.
      *   *Evidence vs. Accuracy:* If evidence is misleading, expected accuracy might diverge from actual accuracy. The theory needs to prioritize *expected* accuracy relative to *current* credence, but that risks circularity.
