      *   Status (Non-negotiable/Preference)? Checked.
      *   Incompatibility section? Checked.
      *   Workhorse/Dealbreaker? Checked.

  8.  **Final Polish:** Ensure the distinction between "Accuracy-First Program" (broad) and "Specific Theory" (narrow) is maintained in the status classifications. (e.g., Additivity is often a specific theory choice, while Properness is program-wide).

      *Wait, one nuance:* The prompt asks me to flag subsets that *cannot be jointly satisfied*. I need to be bold here. The Bounded/Continuous/Proper trilemma is the most famous one. The Evidence/Accuracy tension is another. The Individual/Group tension is a third.

