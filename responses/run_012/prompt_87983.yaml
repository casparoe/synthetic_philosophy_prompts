      *   *Check:* Did I include citations? No. Did I show brainstorming? No. Did I cover all pressure points? Yes.

      *(Self-Correction during drafting)*: Make sure I explicitly address the "Evidence Gap" carefully. It's not just about misleading evidence; it's about why we maximize *expected* accuracy rather than *actual* accuracy. The norm is usually "Maximize Expected Accuracy," but that requires a probability function to calculate the expectation. If the agent doesn't have one, we have a problem. I need to frame this as the "Guidance Condition."

