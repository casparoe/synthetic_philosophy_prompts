answer: |-
  This is the classic **Boundary Problem** (or the *constituency problem*). You have spotted the fundamental paradox of democratic theory: you need a democratic procedure to decide who gets to use the democratic procedure, but you can't run the procedure until you know who is in the room.

  As a philosopher, I wouldn't try to solve this for you; I would map the **logical space** of possible solutions. Every democracy rests on a hidden assumption about where the circle is drawn.

  Here is the design for your poster. It uses **7 Branch Points** to sort every major claim about membership.

  ***

  # POSTER TITLE: The Boundary of "We"
  ### A Logical Map of Democratic Membership

  **START:** To make a law, we must first define **The People**. How do we draw the circle?

  ### BRANCH 1: The Source of Belonging
  **Q1: Do you belong because of WHO YOU ARE (Status) or WHAT YOU GO THROUGH (Relation)?**
  *   **WHO YOU ARE** → Go to Branch 2 (Identity)
  *   **WHAT YOU GO THROUGH** → Go to Branch 4 (Function)

  ---

  ### PATH A: IDENTITY (Status)
  **Q2: What defines the Identity?**
  *   **BLOOD (Ancestry/Lineage)** → **Leaf A1: Ethno-Nationalism**
      *   *Logic:* The people are a family. You cannot join; you must be born in.
  *   **SOIL (Location)** → Go to Branch 3

  **Q3: Does "Soil" require Permission?**
  *   **YES (Legal Citizenship)** → **Leaf A2: Liberal Nationalism**
      *   *Logic:* You belong if the state accepts you. Naturalization is a gift, not a right.
  *   **NO (Physical Presence)** → **Leaf A3: Resident Suffrage / Open Borders Democracy**
      *   *Logic:* If you sleep here and breathe here, you are one of us. Papers don't matter.

  ---

  ### PATH B: FUNCTION (Relation)
  **Q4: What is the Relevant Relation?**
  *   **COERCION (Obeying Laws)** → Go to Branch 5 (All-Subjected)
      *   *Logic:* If you can be jailed by the state, you must have a say.
  *   **CONSEQUENCE (Impacted Interests)** → Go to Branch 6 (All-Affected)
      *   *Logic:* If the decision changes your life, you must have a say.

  **Q5: (If Coercion) How is Authority Exercised?**
  *   **ELECTION (Representatives)** → **Leaf B1: Standard Liberal Democracy**
      *   *Logic:* Subjects choose agents to make the laws that bind them.
  *   **LOTTERY (Random Selection)** → **Leaf B2: Sortitive Democracy / Lottocracy**
      *   *Logic:* Subjects *are* the agents. A random mini-public makes binding rules.

  **Q6: (If Consequence) Does Time Matter?**
  *   **NO (Only Living People)** → **Leaf B3: Global Stakeholder Democracy**
      *   *Logic:* Anyone currently hurt by the decision counts (e.g., foreigners hit by pollution).
  *   **YES (Include Future Generations)** → Go to Branch 7

  **Q7: (If Future) How Do They Speak?**
  *   **DIRECT VOTE** → **Leaf B4: [INCOHERENT / EMPTY]**
      *   *Logic:* The unborn cannot cast ballots. This box is physically impossible.
  *   **GUARDIANS / TRUSTEES** → **Leaf B5: Intergenerational Democracy**
      *   *Logic:* Living proxies hold seats to veto harm to the future (e.g., Ombudsman for Children).

  ***

  # ROUTING YOUR TEST CASES
  *Here is where your specific examples land on the map.*

  **1. The Long-Term Resident (No Vote)**
  *   **Path:** Identity → Soil → **YES (Permission)**.
  *   **Result:** They fall into **Leaf A2 (Liberal Nationalism)** but are currently stuck *outside* the leaf. They are physically on the "Soil" but lack the "Permission."
  *   **Philosophical Tension:** This reveals the conflict between Branch 2 (Soil) and Branch 3 (Permission). If you believe in "Soil," this person is excluded unjustly. If you believe in "Permission," their exclusion is legal.

  **2. The Foreigner (Crops Wrecked by Emissions)**
  *   **Path:** Function → Consequence → **NO (Only Living)**.
  *   **Result:** They land in **Leaf B3 (Global Stakeholder)**.
  *   **Philosophical Tension:** Most actual states operate on Identity (Path A). This person is excluded by Path A entirely. They only get a voice if you switch the logic to Path B (Consequence).

  **3. People Not Born Yet**
  *   **Path:** Function → Consequence → **YES (Future)** → **Guardians**.
  *   **Result:** **Leaf B5 (Intergenerational Democracy)**.
  *   **Philosophical Tension:** If you try to route them to "Direct Vote," you hit **Leaf B4 [EMPTY]**. This proves that "Rule by the People" cannot literally mean *everyone affected* if time is involved. It requires trusteeship, which is slightly undemocratic (guardians rule, not the people).

  **4. The Random Lottery Mini-Public**
  *   **Path:** Function → Coercion → **LOTTERY**.
  *   **Result:** **Leaf B2 (Sortitive Democracy)**.
  *   **Philosophical Tension:** This is logically distinct from Leaf B1 (Election), but both claim to represent the "Subjected." The difference is whether "Rule by the People" means "Rule by our *choices*" (Election) or "Rule by a *statistical sample* of us" (Lottery).

  ***

  # PHILOSOPHER'S NOTES FOR THE WALL

  ### The Empty Box (Leaf B4)
  **Why is it empty?**
  It is **Physically Incoherent**. Democracy requires agency (casting a vote). Future people have interests but no agency. To include them, you must violate the "Rule by the People" principle and substitute "Rule by Guardians." This shows that *perfect* inclusion is impossible; someone must interpret the interests of the voiceless.

  ### The Blurry Leaves (A2 vs. A3)
  **Which two are hard to separate?**
  **Leaf A2 (Liberal Nationalism)** and **Leaf A3 (Resident Suffrage)**.
  *   **Why:** In practice, if a country makes citizenship easy to get, A2 looks exactly like A3. If they make it hard, A3 looks like a moral critique of A2.
  *   **The Blur:** The line between "Legal Permission" and "Physical Presence" is a policy knob, not a philosophical wall. Many modern democracies claim to be A2 but function closer to A3 for long-term residents (giving them rights without votes).

  ### The "Chicken and Egg" Solution
  Notice that **Path A (Identity)** avoids the chicken-and-egg problem by cheating: it says the circle is drawn *before* politics (by blood or geography).
  **Path B (Function)** accepts the paradox: it says the circle changes depending on the *issue* (e.g., on climate policy, the "people" is global; on zoning, the "people" is local). This is harder to administer but logically more consistent with "Rule by the Affected."

  ***

  ### How to read this poster:
  1.  Pick a person who is currently excluded.
  2.  Run them up the branches.
  3.  See which **Leaf** they *should* belong to based on your moral intuition.
  4.  Compare that Leaf to the **Actual Law**.
  5.  The gap between the Leaf and the Law is your political conflict.
