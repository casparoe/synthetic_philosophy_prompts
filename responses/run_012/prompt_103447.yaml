answer: |-
  Good morning. Families, friends, faculty, and especially the graduates.

  Standing here, I am aware of the math. I started college in the nineteen-nineties. I left before finishing. I came back recently, not because the timing was perfect, but because the unfinished business was louder than the excuses. I am older than most of you. I have had more time to be wrong about things. And because of that time, I have a thought I cannot put down. I want to offer it to you not as a truth, but as a question to carry forward.

  The thought is this: we may be living through a stretch of history that is unusually decisive.

  When I left school in the nineties, the world felt different. The tools we used were slower. The connections were thinner. Today, technologies are arriving that change not just what we do, but what we are. They change how we think, how we relate, and how we understand truth itself. It is reasonable to look at the curve of things and suspect that the angle is steepening.

  But I need to stop right there. I am not standing here to tell you that this is definitely happening.

  History is full of people who believed they were living at the end of one age and the beginning of another. They felt the ground shifting beneath them. They felt the weight of the moment. And often, they were wrong. The feeling of living through a revolution is not evidence that a revolution is occurring. It is possible that in fifty years, this period will look like any other decade—just a little noisier, a little faster, but fundamentally continuous. The faculty in the front rows know the literature on this better than I do. They know that claiming specialness for your own time is a very old habit.

  So, I am not asking you to believe that this moment is uniquely decisive. I am asking you to consider what happens if you act as though it is.

  Imagine two paths. On the first, you assume this is just normal history. You assume your choices matter only to you, in the standard way choices always have. You live your life, you do your work, and you let the larger currents take care of themselves. If you are wrong, and this moment was actually a hinge upon which the future turned, then your indifference becomes part of the weight that tipped the scale away from what you might have wanted.

  On the second path, you assume the stakes are higher than usual. You assume that the things you build, the laws you support, the ways you treat each other, and the boundaries you set might echo longer than normal. If you are wrong, and this was just a normal decade, you have still lived a life of care and attention. You have lost nothing by taking responsibility seriously. But if you are right, if this is a decisive stretch, then you have positioned yourself to be a steward rather than a passenger.

  This brings me to the second objection. It is the one I feel most often, sitting in a cheap folding chair at a town meeting or watching the news. If this moment is decisive, surely the decisiveness sits with the people who own the laboratories, the governments writing the regulations, and the firms building the systems. What agency does a graduate have? What agency does a citizen have?

  It is true that the levers of power are concentrated. It is true that you did not design the algorithms or draft the treaties. But technology is not just what is invented; it is what is adopted. It is not just what is built; it is how it is lived with.

  The people in the laboratories decide what is possible. You decide what is acceptable.

  The decisive nature of this history will not be determined solely by the breakthroughs in the lab. It will be determined by the friction those breakthroughs meet in the real world. It will be determined by whether you demand clarity when things are opaque. It will be determined by whether you refuse to trade your attention for convenience. It will be determined by how you treat your neighbors when the tools between you encourage division.

  You do not need to hold the lever to affect the motion. You are the ground the machine stands on. If the ground shifts, the machine must adjust.

  I want to be careful with my words here. I am not speaking about destiny. I am not suggesting you are a chosen generation. There is no prophecy in this. There is only probability and responsibility.

  Some families here hear words like "decisive" and "history" and think of scripture. Others hear them and think of sociology. I want this message to land the same way for both. This is not about fulfilling a plan. It is about recognizing a risk. It is about the secular duty we owe to the future simply because we are the ones currently occupying it.

  Whether you believe the future is written or open, the work looks the same. You must pay attention. You must refuse to let the definition of a good life be handed to you by a platform or a policy. You must finish what you start, even if, like me, you leave a gap of decades in the middle.

  I came back to finish this degree because I realized that showing up is the only way to participate. You cannot participate from the sidelines. You cannot participate by waiting for certainty.

  So, here is my request. Do not wait for confirmation that this moment matters. By the time you have confirmation, the moment will have passed. Assume that your choices carry weight. Assume that the way you use your education, your voice, and your resources will ripple further than you expect.

  If history proves us wrong, and this was just an ordinary time, you will have lived with a dignity that never goes out of style. But if history proves us right, and this was the hinge, then you will have been the ones who held the door open for what comes next.

  Congratulations. Go make it count.
