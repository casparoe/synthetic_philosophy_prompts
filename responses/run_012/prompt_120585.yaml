  # DECISION TREE: MORAL PSYCHOLOGY OF GUILT AND SHAME

  **NODE 1 (REALISM):** Consider two cases: (A) Someone lies on a CV and privately resolves never to do it again; (B) Someone is publicly exposed for an old racist joke and hides from friends. Do these reflect distinct psychological mechanisms with different causal powers, or are they the same distress labeled differently?
  *   **NO (Same Distress):** → **LEAF 1**
  *   **YES (Distinct Mechanisms):** → **NODE 2**

  **NODE 2 (AXIS PRIORITY):** For those who see distinct mechanisms, which feature drives the moral evaluation: is it *what* is condemned (the act vs. the whole self) or *who* is judging (internal conscience vs. external community)?
  *   **WHAT IS CONDEMNED (Object):** → **NODE 3**
  *   **WHO IS JUDGING (Audience):** → **NODE 4**
  *   **BOTH/NEITHER (Functional):** → **NODE 5**

  **NODE 3 (OBJECT VALUE):** Is targeting the *act* (guilt) morally superior to targeting the *self* (shame)?
  *   **YES (Act Superior):** → **NODE 6**
  *   **NO (Self Superior):** → **NODE 7**

  **NODE 4 (AUDIENCE VALUE):** Is autonomy (internal judgment) morally superior to social cohesion (external expectation)?
  *   **YES (Internal Superior):** → **NODE 6**
  *   **NO (External Superior):** → **NODE 7**

  **NODE 5 (FUNCTIONALISM):** Do the two emotions serve complementary functions such that neither is globally superior?
  *   **YES (Complementary):** → **NODE 8**
  *   **NO (Both Corrupting):** → **LEAF 2**

  **NODE 6 (GUILT PROMOTION):** If guilt is superior, is its prevalence determined by human universals or social institutions?
  *   **UNIVERSALS (Cannot Choose):** → **LEAF 3**
  *   **INSTITUTIONS (Can Choose):** → **LEAF 4**

  **NODE 7 (SHAME PROMOTION):** If shame is superior (or equal), can a culture engineer its prevalence without cost?
  *   **CANNOT CHOOSE:** → **LEAF 5**
  *   **CAN CHOOSE (No Loss):** → **LEAF 6**
  *   **CAN CHOOSE (With Loss):** → **LEAF 7**

  **NODE 8 (CULTURAL MALLEABILITY):** If both emotions have jobs, can a culture shift the balance between them?
  *   **CANNOT SHIFT:** → **LEAF 8**
  *   **CAN SHIFT (No Loss):** → **LEAF 9**
  *   **CAN SHIFT (Loss of Capacity):** → **LEAF 10**

  ---

  ### TAXONOMY OF POSITIONS (LEAVES)

  **LEAF 1: FOLK ELIMINATIVIST**
  *   **Position:** The distinction is not real; both are "self-conscious distress."
  *   **Awkward Commitment:** Must explain away the intuitive difference between private remorse and public humiliation as merely linguistic.
  *   **Cultural Stance:** Moot (cannot choose between non-existent categories).

  **LEAF 2: MORAL ASCETIC**
  *   **Position:** Both are corrupting; the ideal person needs neither.
  *   **Awkward Commitment:** Must propose a viable moral motivation (e.g., pure reason) that survives without emotional reinforcement.
  *   **Cultural Stance:** Culture should engineer neither.

  **LEAF 3: TRAGIC GUILT-REALIST**
  *   **Position:** Guilt is better (targets acts/prompts repair), but culture cannot choose it.
  *   **Awkward Commitment:** Must accept that most societies are stuck with inferior shame-based psychologies despite knowing better.
  *   **Cultural Stance:** Culture cannot choose.

  **LEAF 4: LIBERAL ENGINEER**
  *   **Position:** Guilt is better (internal standard/autonomy), and culture can choose it through institutions.
  *   **Awkward Commitment:** Risks creating subjects who feel guilty for things no one else cares about (hyper-individualism).
  *   **Cultural Stance:** Culture can choose.

  **LEAF 5: COMMUNITARIAN FATALIST**
  *   **Position:** Shame is better (binds self to others), but culture cannot choose it (depends on tight-knit conditions).
  *   **Awkward Commitment:** Must lament the inevitable drift toward alienation as societies modernize.
  *   **Cultural Stance:** Culture cannot choose.

  **LEAF 6: SHAME ENGINEER**
  *   **Position:** Shame is better (social cohesion), and culture can choose it without loss.
  *   **Awkward Commitment:** Must justify institutionalized humiliation (e.g., public shaming) as morally benign.
  *   **Cultural Stance:** Culture can choose.

  **LEAF 7: TRAGIC SHAME-REALIST**
  *   **Position:** Shame is better, but choosing it extinguishes the capacity for private autonomy.
  *   **Awkward Commitment:** Must accept that moral improvement requires sacrificing individual psychological privacy.
  *   **Cultural Stance:** Culture chooses but loses.

  **LEAF 8: BIO-CONSERVATIVE**
  *   **Position:** The two do different jobs, but the balance is biologically fixed.
  *   **Awkward Commitment:** Renders moral education and restorative justice programs futile against hardwired tendencies.
  *   **Cultural Stance:** Culture cannot choose.

  **LEAF 9: OPTIMISTIC FUNCTIONALIST**
  *   **Position:** The two do different jobs, and culture can shift the balance without loss.
  *   **Awkward Commitment:** Assumes emotional capacities are infinitely plastic without trade-offs (psychologically dubious).
  *   **Cultural Stance:** Culture can choose.

  **LEAF 10: TRAGIC FUNCTIONALIST**
  *   **Position:** The two do different jobs, but optimizing one atrophies the other.
  *   **Awkward Commitment:** Must accept that any moral culture is necessarily incomplete (e.g., gaining repair loses cohesion).
  *   **Cultural Stance:** Culture chooses but loses.

  ---

  ### STRUCTURAL DIAGNOSTICS

  **INDISTINGUISHABLE LEAVES:**
  *   **Leaf 4 (Liberal Engineer) & Leaf 9 (Optimistic Functionalist):** Both advocate for engineering guilt-dominant cultures via institutions. They differ only in *why* (Guilt is *better* vs. Guilt is *useful*). In practice, both support restorative justice over public shaming. The tree cannot separate them because the policy outcomes are identical.

  **UNOCCUPIED COMBINATIONS:**
  1.  **Distinction Fake + Culture Can Choose:** *Incoherent.* One cannot choose a repertoire of emotions if the categories do not pick out real psychological states.
  2.  **Both Corrupting + Culture Can Choose (No Loss):** *Unattractive.* If both are corrupting, choosing one implies gaining nothing of value; a culture would presumably choose *neither*, which Leaf 2 covers.
  3.  **Guilt Better + Culture Chooses But Loses:** *Unexplored.* Leaf 4 assumes no loss; Leaf 3 assumes no choice. A position claiming "Guilt is better, we can choose it, but we lose the social binding of shame" is logically possible but rarely defended (usually defenders argue guilt binds better).

  **NOTE ON AXES:**
  Nodes 3 and 4 merge into Node 6 (Guilt) and Node 7 (Shame). This reflects the philosophical reality that "Act/Internal" usually clusters as Guilt and "Self/External" as Shame. However, the tree forces the respondent to specify *which* axis drives their valuation, satisfying the requirement not to presuppose the essential axis. A respondent who values Guilt for *Autonomy* (Node 4) ends up in the same leaf as one who values Guilt for *Repair* (Node 3), but their justifications differ.
