  *(Self-Correction on Mark)*: Actually, looking at second-year standards, confusing the hard core definition is a basic error. And the abandonment criterion is the *main* philosophical point of Lakatos (vs Kuhn vs Popper). 12 might be generous. However, the student *does* know the terms. Let's stick with 12 but be firm on the reasoning. It's a "clear but flawed" answer.

  Wait, looking closer at the prompt: "10 for reconstructing the distinctions". The student conflates core and belt. That's a significant conceptual error in the definition section. Maybe 6/10 there.
  "5 for account of when abandonment is licensed". Student says "once the belt starts needing ad hoc patches... programme is finished." Lakatos says you can stick with it until a better rival appears. This is a fundamental misunderstanding. 1/5.
  "5 for the case". Phlogiston is standard. Application is consistent with their (wrong) theory. 3/5.
  Total: 10/20? That feels like a fail/borderline. The essay is coherent. Let's give the benefit of the doubt on coherence. 12/20 is a safe low 2:2. I will justify the 12 clearly.

  Let's adjust the feedback to ensure the student knows *why* it's not a 2:1. The "rival programme" condition is non-negotiable in Lakatos scholarship.

  Okay, ready to write.
answer: |-
  **Mark: 12/20 (Low 2:2)**

  **Margin Comments**

  **[Para 1, line 2]** "Central assumptions plus the adjustable auxiliary hypotheses..." — Careful here. The auxiliary hypotheses *constitute* the protective belt; they are not part of the hard core definition. The core is the irrefutable metaphysical commitment; the belt takes the hits. **[–1 mark on definitions]**

  **[Para 1, line 5]** "Appraise these series rather than individual theories" — Correct. This is the crucial shift from naive falsificationism. Good. **[+1 mark]**

  **[Para 2, line 1]** "Predicting novel facts... corroborated" — You have captured the definition of empirical progressiveness well. Might have noted *theoretical* progressiveness (increased content) separately for full precision, but this is acceptable. **[+1 mark]**

  **[Para 2, line 4]** "When that happens... the rational move is to drop the programme." — This is the critical error in the script. Lakatos explicitly argues that it is *not* irrational to persist with a degenerating programme temporarily. Abandonment is only licensed when a **rival** programme exists that is more progressive. You present abandonment as immediate upon degeneration. **[–3 marks on abandonment]**

  **[Para 2, line 6]** "Once the belt starts needing ad hoc patches, we know the programme is finished." — This turns Lakatos's methodology into an algorithm for immediate rejection, which he sought to avoid (cf. the Newtonian programme). This misunderstands the 'historical' nature of his rationality. **[–2 marks on abandonment]**

  **[Para 3, line 1]** "Take phlogiston chemistry." — Standard example, appropriate for the level. **[+1 mark]**

  **[Para 3, line 3]** "Once Lavoisier's oxygen theory was on the table..." — You hint at the rival here, but your previous paragraph insisted degeneration alone justifies abandonment. The case is used to support the incorrect rule you established earlier. The historical narrative is fine, but the philosophical leverage is weak. **[+1 mark]**

  **[Para 3, line 5]** "His methodology gives us a rule we can apply as the anomalies come in" — Lakatos warns against 'instant rationality'. We can only judge a programme in retrospect, not 'as the anomalies come in'. This contradicts the 'historical' aspect of HPS. **[–1 mark on case/application]**

  ***

  **Examiner's Summary & Justification**

  **1. Reconstructing the Distinctions (7/10)**
  You have a good grasp of the terminology (hard core, heuristics, problem-shifts). The prose is clear and concise. However, you conflate the hard core with the auxiliary hypotheses in the first sentence. The core is protected; the auxiliaries are the belt that gets adjusted. This is a fundamental structural error in the MSRP (Methodology of Scientific Research Programmes), though the rest of the definition recovers well. You also omit the distinction between *theoretical* and *empirical* progressiveness, treating them as a single block, which loses a mark on precision.

  **2. Account of Abandonment (2/5)**
  This is where the mark suffers most. Lakatos's specific contribution, distinct from Popper, is that degeneration does not *immediately* mandate rejection. Scientists are rational to stick with a degenerating programme if no better alternative exists (e.g., Bohr's programme in the 1920s). You state that "once the belt starts needing ad hoc patches... the programme is finished." This is incorrect. Abandonment is licensed only when a rival programme supersedes the degenerating one in progressive power. By missing the 'rival programme' condition and the 'retrospective' nature of the appraisal, you have missed the core philosophical nuance of the question.

  **3. Historical Case (3/5)**
  The Phlogiston/Oxygen transition is a valid choice and you describe the ad hoc moves (negative weight) correctly. However, because your theoretical framework regarding abandonment is flawed, the application is too. You suggest the programme was abandoned simply because it degenerated, rather than because the Oxygen programme demonstrated superior heuristic power *in comparison*. The case is not merely 'bolted on', but it is used to illustrate a misunderstanding of the text.

  **General Comment**
  A coherent, well-written script that demonstrates familiarity with the vocabulary but lacks precision on the central philosophical mechanism. You have treated Lakatos's methodology as a stricter version of Popper's, whereas it was intended to be more historically flexible. To improve, focus on the conditions required for *rational theory choice* between competing programmes, not just the internal health of one programme.

  **Total: 12/20**
