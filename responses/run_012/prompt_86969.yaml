prompt: |-
  One of my students in a seminar on markets and morals kept hammering on an analogy last week and I cant decide if it's clever or just cheap, so I want you to audit it properly. His line was this: we already let people sell their bodys safety. Loggers, roofers, soldiers, deep-sea welders — they all take on a real risk of death or dismemberment for a wage, and nobody says hiring them is an immoral commodification of the body. A kidney sale, he said, is the same kind of thing: you're trading some bodily risk for money. So if you're fine with the first, you can't object to the second on principle. He's using this to argue we should legalize a regulated kidney market.

  I want the full audit: what maps onto what between "dangerous job" and "kidney sale," where the mapping genuinely holds, where it snaps, which of the disanalogies are load-bearing for his conclusion and which are just noise, and whether the conclusion — that consistency forces you to allow kidney sales — survives once the breaks are on the table. Also tell me whether there's a better analogy for what he's actually after, if there is one.

  Give it to me as a JSON object, please, with exactly these fields:
  - "mapping": an array; each item is an object with "source_feature" (the feature in the dangerous-job case), "target_feature" (what it corresponds to in the kidney case), "holds" (one of "yes" / "partial" / "no"), and "why" (one line).
  - "breaks_that_matter": array of strings — disanalogies that actually threaten his conclusion, each with a one-line reason.
  - "breaks_that_dont": array of strings — disanalogies that look relevant but don't touch his argument.
  - "smuggled_assumptions": array of strings — what the analogy quietly assumes about bodies, risk, consent, or markets.
  - "conclusion": an object with "status" (one of "survives" / "survives only if" / "fails") and "reason".
  - "better_analogy": a short string, or null if none.

  No need to cite anyone or give me a reading list, just the analysis. And dont be polite about it — if the analogy is doing the work rather than the argument, say so.
