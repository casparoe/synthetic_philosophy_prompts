      *   *Logic Check:* Ensure I don't accidentally reify emptiness while explaining it. Use phrases like "designator," "placeholder," "lack of intrinsic nature."
      *   *Madhyamaka Nuance:* Mention *prasaṅga* (consequence). Mention *svabhāva* (intrinsic nature). Mention *prapañca* (conceptual proliferation).
      *   *Formal Logic Nuance:* Acknowledge the violation of Excluded Middle, but frame it as a category error rather than a logical failure.

  7.  **Self-Correction during drafting:**
