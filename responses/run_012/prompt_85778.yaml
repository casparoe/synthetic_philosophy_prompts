  ### The rules that fit

  Two candidate rules explain her verdicts. First, the **No-Harm Principle**: belief without evidence is permissible iff it risks no harm to others. This condemns the Shipowner (passenger safety) and Juror (defendant's liberty) but excuses the Woman and Brother (self-regarding or beneficial). Second, the **Evidence-Availability Principle**: belief without evidence is permissible iff evidence is unavailable or inconclusive. Willful ignorance of accessible evidence is blameworthy regardless of consequences. This condemns the Shipowner (ignored doubts) and Juror (ignored ambiguity) but excuses the Woman (evidence lacking) and Brother (evidence impossible). Both rules fit the initial four cases perfectly, but they diverge fundamentally on whether epistemic duty extends to self-regarding choices where truth is easily accessible.

  ### What each rule predicts

  Applying these rules to your colleague yields opposite predictions. Under the **No-Harm Principle**, the colleague is not blameworthy. He has no dependents, and if he is wrong, only he suffers. His belief is strictly self-regarding, mirroring the Sick Woman's situation. The autonomy to manage one's own psychological burden outweighs the duty to know, provided no third party is endangered.

  Under the **Evidence-Availability Principle**, however, he is blameworthy. Unlike the Sick Woman, whose doctors said evidence *cannot say*, your colleague faces cheap, decisive evidence. He is actively choosing ignorance. This aligns him with the Shipowner, who talked himself out of doubts, and the Juror, who bypassed ambiguity. On this view, avoiding a safe test is epistemic negligence. The availability of truth creates a duty to seek it, even if the consequences of ignorance are contained within the self. The distinction lies between inability to know versus refusal to know. The first rule prioritizes autonomy; the second, epistemic integrity. The crux is whether the permission to believe without evidence is a license for self-protection or a concession to impossibility. If the former, he is safe; if the latter, he is negligent. This specific tension—available evidence versus self-regarding harm—is exactly where the two principles, previously harmonious, now conflict.

  ### Her likely verdict

  Her likely verdict is **blameworthy**. Though the No-Harm Principle fits her exoneration of the Sick Woman, the colleague's case hinges on evidence availability. She was annoyed you asked about the Woman because the evidence was genuinely inconclusive; there was no choice to make. Here, your colleague chooses ignorance. This mirrors the Shipowner, who suppressed doubts despite available signs. She rejected the simple Clifford/James split, suggesting she cares about *how* the belief is formed, not just who gets hurt. The closest case is the Shipowner: both bypass available indicators to maintain a comforting belief. I prefer the Evidence-Availability Principle as her true rule because it explains why the Juror is blameworthy despite potentially guessing correctly. She values the process of inquiry over outcomes. Therefore, she will argue that cheap, decisive evidence creates an epistemic obligation, even for self-regarding matters. Avoiding truth is itself a moral failure, independent of harm to others. Since the Woman's evidence was unavailable, her case differs fundamentally. She likely views the refusal to test as a form of self-deception akin to the Shipowner's rationalization. While she permits belief when evidence is absent, she condemns belief when evidence is avoided. Thus, the self-regarding nature won't save him.

  ### The case that would settle it

  The settling case: A person refuses a cheap test for a harmless, untreatable genetic marker, believing they lack it. Evidence is available; harm to others is zero. The No-Harm Principle says **not blameworthy** (purely self-regarding). The Evidence-Availability Principle says **blameworthy** (willful ignorance violates epistemic duty). Her response confirms whether epistemic duty survives without consequences. If she condemns him, the Evidence-Availability Principle rules. If she excuses him, the No-Harm Principle rules. This isolates evidence availability from harm, forcing her to choose between truth-seeking and autonomy.
