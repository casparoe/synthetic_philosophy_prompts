answer: |-
  This is a **hybrid disagreement**. It is partially verbal (you are defining the term differently), but underneath that lies a substantive disagreement about **epistemic markers** (how we know what we know). You are not just fighting over a word; you are fighting over whether the *structure* of a belief can tell you something about its truth before you check the *content*.

  Here is the diagnosis based strictly on what you have described.

  ### 1. The Diagnosis: Content vs. Process
  You are answering two different questions under the same heading.

  *   **Your Friend (The Ontologist):** She is talking about **content**. To her, a "conspiracy theory" is defined by *what is claimed* (powerful people secretly coordinated). Her argument is that since the world contains actual secret coordinations (Watergate, Tobacco), the category of "claims about secret coordination" cannot be inherently dismissed. She views the label as a rhetorical shield used to avoid looking at evidence.
  *   **You (The Epistemologist):** You are talking about **process**. To you, a "conspiracy theory" is defined by *how the belief is held* (self-sealing, unfalsifiable, anomaly-counting). Your argument is that there is a specific cognitive style that correlates with falsehood, regardless of the content. You view the label as a warning sign about the reasoning method.

  **Why you go in circles:**
  When you say, "Conspiracy theories are unfalsifiable," she hears, "Claims about secret coordination are always false." She corrects you with Watergate.
  When she says, "Conspiracies happen," you hear, "All reasoning about secret coordination is equally valid." You correct her with QAnon-style logic.
  You are both right about your respective domains, but you are using the same label to cover different territories.

  ### 2. The Suspicion: Which Example Helps Her?
  You suspected one of your examples is actually doing work for the other side. **You are right.**

  Your example: *"Missing evidence becomes proof of a cover-up."*

  You intend this as a critique of bad reasoning (a "tell" of a conspiracy theorist). However, this is the exact point where your friend can dismantle your structural distinction. In **Watergate**, the 18-minute gap in the tapes and the shredded documents *were* missing evidence that counted as proof of a cover-up. In the **Tobacco** case, the missing internal memos were proof of collusion.

  In true conspiracies, the absence of evidence *is often* evidence of absence (specifically, evidence of active concealment). Therefore, the structural move of interpreting "missing evidence" as "proof of a cover-up" is not unique to false conspiracy theories. It is a valid heuristic in some real-world investigations.

  This validates your friend's core point: You cannot distinguish a "real conspiracy" from a "conspiracy theory" based on that structural feature alone. You have to look at the specific evidence (the content), which is her position. This example undermines your claim that the *structure* of the reasoning is sufficient to categorize the belief as defective before investigating the facts.

  ### 3. Is it Verbal, Substantive, or Foundational?
  It is **substantive**, disguised as verbal.

  If this were purely verbal, you could say, "Okay, I'll call Watergate a 'conspiracy' and 9/11 Truth a 'conspiracy theory,' and we agree." But you wouldn't agree.
  *   She would still worry that calling 9/11 Truth a "conspiracy theory" invites people to ignore the evidence before looking at it.
  *   You would still worry that calling Watergate a "conspiracy" (without the "theory" slur) implies it was reasoned about differently than 9/11 Truth, when the initial claims looked structurally similar.

  The substantive disagreement is about **priors**.
  *   **Her Prior:** The base rate of "secret coordination" is high enough that we should treat these claims as normal historical hypotheses until proven otherwise.
  *   **Your Prior:** The base rate of "self-sealing reasoning" is low enough, and its correlation with falsehood is high enough, that we should treat these claims as epistemically suspect immediately.

  You are fighting over **when the burden of proof shifts**. She thinks it shifts only after evidence is examined. You think it shifts immediately if the reasoning structure displays "immunizing" features.

  ### 4. What Counts as Progress?
  Nothing will move this if you keep arguing about the definition of the word "conspiracy." You need to change the question.

  **A. The Distinction that Helps:**
  Stop arguing about whether Watergate is a "conspiracy theory." Agree to ban that phrase for historical events that are settled.
  Instead, argue about **Immunization Strategies**.
  Ask her: *"Do you agree that there is a style of argument where no amount of counter-evidence is allowed to count against the theory?"*
  If she says yes (she should), then ask: *"Does adopting that style lower the probability that the theory is true, independent of the specific evidence?"*
  If she says no, you have found your substantive disagreement: She believes truth is solely correspondence-based; you believe truth is partially coherence/process-based.

  **B. The Data Needed:**
  You mentioned base rates. You need **predictive success rates of reasoning styles**, not truth rates of claims.
  *   Do beliefs that rely on "missing evidence = cover up" turn out true more or less often than beliefs that rely on "missing evidence = the event didn't happen"?
  *   If you can show that the *method* of reasoning predicts falsehood better than chance, you win the substantive point without needing to define the word.

  **C. The Honest Stall:**
  The argument will stall if neither of you can concede the **risk profile**.
  *   You are worried about the **Type I Error** (believing a false theory). You want a heuristic that filters out noise, even if it risks flagging a real conspiracy as noise.
  *   She is worried about the **Type II Error** (dismissing a true theory). She wants to keep the channel open for uncomfortable truths, even if it lets in noise.
  This is a value judgment about the cost of being wrong vs. the cost of being skeptical. You cannot argue this with evidence; it is a stance on how cautious a society should be.

  ### Summary
  You are not just fighting over vocabulary. You are fighting over whether **bad reasoning can be identified independently of false conclusions.**

  *   **She says:** No. You only know the reasoning was bad after you know the conclusion was false. (Watergate looks like a conspiracy theory until the tapes are found).
  *   **You say:** Yes. Certain reasoning patterns are so toxic they degrade the probability of truth regardless of the claim.

  **To move forward:** Admit that your "missing evidence" example was a weak distinction because it applies to Watergate. Shift the ground to **falsifiability**. Ask her if a theory that explicitly states "evidence against me is part of the plot" is less likely to be true than one that says "evidence against me disproves me." If she agrees, you have found your substantive common ground: the epistemic virtue of risk. If she disagrees, you have found your foundational impasse: she believes only in outcomes, you believe in process.
