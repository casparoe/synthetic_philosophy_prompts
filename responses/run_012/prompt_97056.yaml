answer: |-
  This is a sharp intuition, and it aligns with a sophisticated strand of social choice theory (think Barberà, Kelly, Gardenfors) that often gets glossed over in the standard "G-S kills democracy" narrative. You are correct that resoluteness is the hidden engine of the impossibility. However, to make this argument stick in a chapter, you cannot just wave your hands at set-valued rules; you have to fortify them against the specific objections you raised.

  Here is the case for your thesis, structured to defend the set-valued escape, dismantle the tie-breaking objection, compare it to the lottery route, and check for vacuity.

  ### 1. The Resoluteness Artifact
  The standard G-S story assumes that the *function* of a voting rule is to select a unique winner. This is a metaphysical claim about institutions, not a logical necessity. In reality, most voting bodies do not produce a single winner; they produce a **mandate**, a **shortlist**, or an **agenda**.

  When a committee votes to send three bills to the floor, the voting rule has done its job. It has filtered the alternatives. If you demand that the committee rule itself must pick exactly one bill, you are conflating the *screening* stage with the *selection* stage. G-S proves that a *screening* rule cannot be both decisive (singleton output) and strategy-proof without a dictator. It does not prove that a *filtering* rule cannot be strategy-proof.

  **The Argument:** By abandoning resoluteness, you are not "cheating" the theorem; you are modeling the institution more accurately. The impossibility arises because we demand certainty (a single winner) from a process designed to aggregate conflict. Allowing sets acknowledges that conflict exists and preserves it for resolution by other means (negotiation, amendment, status quo bias) rather than forcing a false precision that invites manipulation.

  ### 2. Defending Against the "Tie-Breaking is Dictatorship" Objection
  This is the strongest counter-argument you will face. The critic says: *"If you output $\{a, b\}$, someone eventually picks between them. If that picker is fixed, they are a dictator. If it's random, you're back to lotteries. If it's another vote, you haven't solved the problem, just pushed it down the line."*

  **Your Rebuttal:** This objection commits a **category error between the Rule and the System.**
  Gibbard–Satterthwaite is a theorem about *social choice functions*, not entire political systems.
  *   **Division of Labor:** In many institutions, the "tie-breaker" is not a voter with preferences over the alternatives, but an institutional constraint (e.g., the status quo remains if the set is not a singleton). If the tie-breaking mechanism is *exogenous* to the preferences (e.g., "if the set has size $>1$, no change occurs"), there is no dictator. There is just inertia.
  *   **Restricting the Menu:** Even if there is a second stage (a chairperson picks from the shortlist), making the first stage strategy-proof is still a massive victory. If the shortlisting rule is manipulable, a voter can ensure their favorite *never makes the shortlist*. If the shortlisting rule is strategy-proof (in the set-valued sense), the voter cannot exclude their favorite via lying. They might not win the final round, but they cannot be *locked out* by manipulation.
  *   **The Set is the Outcome:** In many contexts (hiring shortlists, qualified candidates, agenda setting), the set *is* the final outcome. There is no "tie-break." To insist there must be one is to impose resoluteness by fiat. If the outcome is "These three candidates are eligible for hiring," and the department hires one later via interview, the voting rule's job was to determine eligibility. That is a non-dictatorial, strategy-proof task.

  ### 3. Set-Valued vs. The Lottery Route (Gibbard 1977)
  Gibbard's 1977 extension allows outcomes to be probability distributions (lotteries). He shows that if you require strategy-proofness for all expected-utility maximizers, you get a random dictatorship. You argue the set-valued route is superior. Here is why:

  **A. Informational Burden (Ordinal vs. Cardinal)**
  *   **Lotteries:** To define strategy-proofness over lotteries, you *must* assume voters are Expected Utility (EU) maximizers. You need cardinal utility to compare a 50% chance of $A$ vs. 100% of $B$. If voters have ambiguity aversion, rank-dependent utility, or simply refuse to quantify intensity, the "strategy-proof" claim collapses. The rule is only SP for a specific subclass of rational agents.
  *   **Sets:** Set-valued rules only require **ordinal preferences plus a set-extension axiom**. You don't need to know *how much* a voter prefers $A$ to $B$. You only need to know if they prefer the set $\{A, C\}$ to $\{B\}$. While set-extensions (Kelly, Gardenfors, etc.) are not uncontroversial, they are far closer to the ordinal spirit of Arrow and G-S than lotteries are.

  **B. The Nature of Indeterminacy**
  *   **Lotteries:** Pretend to resolve indeterminacy mathematically. They force a precise probability onto a political disagreement. This is often a fiction. (Is the committee really flipping a coin, or is it unresolved?)
  *   **Sets:** Admit indeterminacy politically. A set $\{A, B\}$ says "Both are acceptable winners." This preserves the possibility of compromise *after* the vote. A lottery forces a resolution that might satisfy no one (I hate $B$, you hate $A$, we get a 50/50 mix).

  **Which addresses the worry?**
  The original worry is: *"Can a voter do better by lying?"*
  *   **Lottery:** Only guarantees "No" if the voter is an EU maximizer.
  *   **Sets:** Guarantees "No" if the voter accepts the set-extension axiom (e.g., "I prefer a set if its best element is better," or "I prefer a set if all elements are better").
  *   **Verdict:** The set-valued route is **more robust** because it requires fewer assumptions about the voter's psychology. It protects against manipulation for *any* voter whose preferences over sets satisfy the extension axiom, whereas the lottery route only protects EU maximizers.

  ### 4. Is the Requirement Vacuous?
  This is the technical trap you must avoid.
  If your definition of strategy-proofness is too weak, *any* rule satisfies it.
  *   **The Trivial Rule:** The rule that *always* outputs the set of all alternatives $A$, regardless of votes, is strategy-proof under almost any set-extension. No voter can manipulate to get a "better" set because the set never changes. But this rule is useless (it's not "onto" in a meaningful sense, it's not responsive).
  *   **The Vacuity Check:** To avoid vacuity, you must impose a **Responsiveness** or **Efficiency** condition. For example: "If every voter ranks $x$ as top, $x$ must be in the chosen set, and $y$ (ranked last by all) must not."
  *   **The Danger:** Be aware that impossibility results *do* exist for set-valued rules if you choose strong set-extension axioms. For example, if you use the **Kelly extension** (a set $S$ is better than $T$ if every element in $S$ is better than every element in $T$) and require efficiency, you can re-derive oligarchy results (Barberà 1977).
  *   **Your Defense:** You must specify that you are using a **weaker dominance criterion** (like the one you hinted at: "every element of the new set is weakly better than some element of the old, and one strictly"). This makes manipulation *harder* to achieve, allowing non-dictatorial rules (like the "Top-$k$" rule or specific scoring rules that output sets) to survive.
  *   **Crucial Distinction:** You are not claiming *all* set-valued rules are SP. You are claiming the *space* of SP rules is non-empty and non-dictatorial, unlike the singleton space. The requirement is not vacuous because we can construct rules that are responsive (they change with votes) and SP, provided we accept the set-output.

  ### 5. Summary of the Argument for Your Chapter
  Here is the narrative arc you should push:

  1.  **Reframe G-S:** The theorem is not about "voting is impossible." It is about "resolute voting is impossible." It is a theorem about the cost of **forced decisiveness**.
  2.  **The Set-Valued Escape:** By allowing the rule to output a set, we acknowledge that the purpose of voting is often to narrow the field, not to close it. This is not a loophole; it is a more honest model of committees, legislatures, and screening processes.
  3.  **Kill the Tie-Break Objection:** The objection assumes the set is a defect. Argue the set is a feature. It delegates the final choice to a different institutional mechanism (status quo, negotiation, chair) without allowing voters to manipulate the *menu* of options. Even if the final stage isn't SP, making the agenda-setting stage SP restricts the power of manipulators significantly.
  4.  **Superior to Lotteries:** Lotteries buy strategy-proofness at the cost of assuming cardinal utility (EU). Sets buy it at the cost of assuming a set-extension axiom. The latter is more consistent with the ordinal tradition of social choice and better reflects political reality (ambiguity vs. risk).
  5.  **Non-Vacuous:** It is not vacuous because we impose responsiveness (the set must react to unanimous consensus). Under these conditions, non-dictatorial rules (like shortlisting rules) exist and are strategy-proof.

  **The Punchline:** Gibbard–Satterthwaite tells us we cannot have a manipulation-proof machine that *always* gives us a single answer. It does not tell us we cannot have a manipulation-proof machine that tells us the *truth about our disagreements*. Set-valued rules do the latter. They don't solve the problem of conflict; they stop pretending the vote alone can resolve it.
