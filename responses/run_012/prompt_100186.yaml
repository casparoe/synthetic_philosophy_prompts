prompt: |-
  Two friends of mine, M and D, got into a long argument at a party last weekend about whether moral statements are really just expressions of how you feel, and they left it unresolved and asked me to referee, and I couldnt, so I'm outsourcing. I'm a software engineer, I have no philosophy training at all, so please be gentle and explain it like I'm smart but ignorant.

  Heres the best reconstruction I can manage. M thinks when you say "murder is wrong" your not describing a fact about the world, your just expressing an attitude, more like booing than like reporting. D pushed on that.

  D's move: he said fine, but then how do you reason with moral words at all? He gave this argument: if murder is wrong then paying someone to murder is wrong; murder is wrong; so paying someone to murder is wrong. He said that's obviously a valid argument. But if "murder is wrong" is just expressing disapproval, then in the first premise it isnt expressing anything, its sitting inside an "if" where nobodys actually disapproving of anything, your just supposing it. So the phrase means one thing in the first premise and a different thing in the second, which makes the whole thing a fallacy of equivocation and not valid at all. But it obviously is valid. So M's view is wrong.

  M's reply: he said yeah this is the famous objection and theres a standard answer, which is that "wrong" means the same thing every time, it always expresses the same attitude, the attitude just shows up differently depending on where it sits. Inside the "if" its not asserted, its part of a bigger complex state.

  D: he said what complex state? If it doesn't express disapproval in the antecedent then what does it express, and you cant just say "a complex state" and wave your hands. You owe me a story about how the pieces combine, and it has to combine the same way for moral words as for non-moral words or your back to equivocation.

  This is where I made the mistake of trying to help. I said it's like a function in code: "wrong" is a function that returns an attitude, and inside an "if" the function just isnt called yet, so of course it doesnt return anything, but its the same function. M liked this. D said thats exactly the problem: in real code, whether a function has been called or not changes whether you have a value at all, and you cant have the same function both hand you back a yes/no and also hand you back an action. So the analogy just relabels the thing that needs explaining.

  Then M tried a different tack. He said maybe validity isnt about meanings at all, maybe an argument is valid when you cant coherently accept the premises and reject the conclusion, it's about the commitments you take on. If you accept both premises your committed to the conclusion, so its valid, regardless of what the words refer to.

  D said but "accept" is doing all the work there, and for you accepting a moral claim just is having the attitude. So you've defined validity in terms of which attitudes someone can hold, which makes validity depend on psychology. Two people with different attitudes could disagree about whether the argument is valid, which is absurd.

  M said not if the commitments are built into the attitudes themselves, like you cant sincerely boo and cheer the same thing at the same time, and thats a logical fact about attitudes, not an empirical one.

  D said then show me that logic of attitudes. Until you actually produce it you've just renamed the problem "logic of attitudes" and its still the problem.

  Thats where they left it. Can you go through this move by move and say whos right about what, not just who wins overall? I especially want to know if D's first argument really lands or if M's answer to it is enough, whether my function analogy actually helps or hurts, and whether M's second attempt is a real fix or a dodge. Also tell me what both of them seem to be missing, if anything. I'd rather you not do the thing where you just pick a side and argue for it, I want each step rated and explained. And please write it as continuous prose, no headings or bullet points or bold text or tables, just write it out like a long email, thats how I'll read it.
