      *   **D's First Move (The Frege-Geach Problem):** Validity requires univocal meaning. In "If murder is wrong, then paying someone to murder is wrong," the antecedent "murder is wrong" doesn't express disapproval (it's unasserted). In "Murder is wrong," it does. Therefore, equivocation. Argument seems valid, so Expressivism is wrong.
