answer: |-
  Hi there,

  It sounds like you got dragged into one of the deepest and most technical debates in modern philosophy without any warning, which is a tough spot to be in. The good news is that your friends are actually reenacting a very famous historical dispute that shaped metaethics for the last century, so you are not missing any obvious context that would have made this easy. The bad news is that the debate is hard because it touches on the foundations of logic, language, and psychology all at once. Since you asked for a move-by-move breakdown without picking a final winner, I will walk through the exchange step by step, evaluating the strength of each argument and where the philosophical heavy lifting is actually required. I will keep the jargon to a minimum and lean on your engineering background where it helps, but I will also point out where the code analogy starts to fray.

  Let's start with D's first move, because that is the strongest point he makes in the entire conversation. What D is describing is known in philosophy as the Frege-Geach problem, and it is widely considered the single biggest hurdle for M's view. M claims that saying murder is wrong is like booing, which means it is an expression of emotion rather than a statement of fact that can be true or false. D points out that in logic, for an argument to be valid, the words must mean the same thing in every place they appear. When you say If murder is wrong then paying someone to murder is wrong, the phrase murder is wrong is sitting inside a conditional statement. Nobody is actually booing anything in that first clause; they are just considering a possibility. But in the second premise, Murder is wrong, the speaker is actually booing. D is right to say that if the meaning of the words changes depending on whether you are asserting them or just supposing them, then the argument commits a fallacy of equivocation, like using the word bank to mean a river edge in one premise and a financial institution in the next. Since the argument intuitively feels valid to everyone, D is correct that M's simple theory fails to explain why. M's view needs to account for how moral words function in unasserted contexts like ifs, questions, or beliefs, not just in direct accusations.

  M's first reply acknowledges the problem but tries to wave it away by saying the attitude is the same, it just shows up differently depending on the context. Philosophically, this is the right direction to look, but as D pointed out, it is not an explanation yet, it is just a promise of one. Saying it is a complex state is like saying a bug in your code is caused by a complex interaction without looking at the stack trace. It might be true, but it doesn't fix the compilation error. D is right to press for a compositional semantics, which is a fancy way of asking for the rules of how the pieces combine. In programming, you know exactly how a function combines with an if statement because the types are defined. If M cannot define the type of moral language in a way that fits into logical operators like if and then, then the logic breaks. So on this first exchange, D lands a solid hit because he identifies a structural flaw in M's theory, and M's initial defense is too vague to patch the hole.

  This brings us to your intervention with the function analogy. You tried to help M by suggesting that wrong is a function that returns an attitude, and inside an if statement the function is just not called yet. I can see why M liked this because it treats the word as a stable unit of code regardless of context. However, D's critique of your analogy is actually quite sharp and technically correct from a logic perspective. In strongly typed code, if a function returns an Attitude object, you cannot put that object directly into an if condition that expects a boolean or a truth value. If you try to pass an Attitude into a logical operator, the compiler throws an error unless you have defined a specific way to convert that Attitude into a truth value. D's point is that you cannot have the same function sometimes return a value that can be true or false and other times return an action or feeling without changing the type signature. If moral sentences are just attitudes, they are not the right type of thing to be premises in a logical argument. So your analogy helps visualize the stability of the word, but it hurts M's case because it highlights the type mismatch that D is worried about. You essentially illustrated the problem rather than solving it, which is why D said it just relabels the thing that needs explaining.

  M's second attempt shifts the ground entirely, moving from semantics to the nature of validity itself. M suggests that validity is not about truth preservation, which is the standard definition, but about consistency of commitments. This is a sophisticated move that aligns with modern developments in expressivism. The idea is that you cannot logically hold two conflicting attitudes any more than you can hold two conflicting beliefs. If you disapprove of murder, and you believe that paying for murder entails murder, then consistency demands you disapprove of paying for murder. M is trying to say that logic is about not contradicting yourself, whether you are dealing with facts or feelings. This is a genuine fix in principle, because it allows expressivists to keep their view that moral statements are attitudes while still explaining why moral reasoning works. However, D is right to be skeptical because this changes the definition of logic. Standard logic is objective and does not depend on what anyone feels. If validity depends on which attitudes are incompatible, then we need a rulebook for which attitudes clash. D is correct that simply asserting there is a logic of attitudes is not enough; you have to show the axioms.

  D's final demand is for M to produce the logic of attitudes. This is the crux of the matter. If M says validity is about not having inconsistent attitudes, D wants to know what makes two attitudes inconsistent. In belief logic, two beliefs are inconsistent if they cannot both be true at the same time. In attitude logic, what is the equivalent? Is it a psychological impossibility, like not being able to feel joy and sorrow simultaneously? Or is it a normative requirement, like you ought not to feel joy and sorrow? If it is just psychological, then a sociopath who feels no inconsistency might be logically perfect, which seems wrong. If it is normative, then M is smuggling in a moral fact about what attitudes you should hold, which undermines the original view that there are no moral facts. D is right that until M specifies the rules of this new logic, the solution is incomplete. M's claim that it is a logical fact about attitudes is essentially asserting the conclusion without proof. So in this final exchange, D is right to demand the formal system, and M is right that such a system is possible to build, but M has not built it yet in this conversation.

  So where does that leave you as the referee? You asked what both of them seem to be missing. The main thing they are missing is that this debate has actually progressed significantly in the last forty years, and there is a middle ground that incorporates both their insights. There is a school of thought called Quasi-Realism, championed by philosophers like Simon Blackburn and Allan Gibbard, which tries to do exactly what M is attempting but with the rigor D is demanding. They accept M's starting point that moral statements express attitudes, but they work hard to construct a logical framework that allows those statements to behave exactly like factual statements in arguments. They try to earn the right to talk about moral truth and moral validity even if the underlying metaphysics is just about attitudes. D is acting like a traditional Realist who thinks moral facts must exist independently for logic to work, while M is acting like an early Expressivist who hasn't done the homework to make the view viable. Neither of them knows that modern Expressivists have actually written the source code for the logic of attitudes that D is asking for, though it is complex and controversial.

  If I were to rate the exchange overall, D wins on technical execution because he correctly identifies the gaps in M's explanations and forces M to confront the difficulty of building a logic without truth values. M wins on philosophical potential because the view that moral language is tied to attitudes is very compelling and matches how people actually use moral words in real life, whereas D's view requires believing in strange moral facts floating around the universe. Your function analogy was a helpful bridge for understanding the stability of meaning, but it ultimately sided with D on the type mismatch issue. The fairest verdict is that D is right that M's current explanation is insufficient, but M is right that the problem is solvable in principle. They have reached the edge of what can be settled in a casual party argument and have stumbled into a research program that occupies entire careers. You did not make a mistake by trying to help; you just inadvertently highlighted the exact type error that makes this problem so hard to solve.

  I hope this helps you navigate the next time they bring this up. You can tell them that D has correctly identified the Frege-Geach problem and that M is gesturing toward Quasi-Realism but needs to read more Blackburn or Gibbard to actually solve it. That should keep them busy for a while without requiring you to pick a side.

  Best of luck with the friendship.
