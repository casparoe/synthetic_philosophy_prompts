          *   Address the "Separateness vs. Impartiality" turn. Argue that separateness actually supports *both* impartiality (I count for one) and partiality (This is *my* life). The crucial distinction is between *weighting* interests (impartiality) and *owning* interests (integrity). The Utilitarian conflates the two.
      *   *Section 3 (The Case):*
