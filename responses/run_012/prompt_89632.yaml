          *   Better Example: *The "Function" of Sleep.* Is 4 hours a disease? Only if we agree on the function of sleep. If the function is "survival," some people survive fine on 4 hours. If the function is "optimal cognitive flourishing," they don't. The function choice is normative.
      *   **Section 3: The Health/Disease Binary.**
