      *   **Constraints:** Explain carefully, avoid textbook restatements, use concrete/original examples, identify sleight of hand if present.

  2.  **Deconstruct Dev's "Split View":**
      *   *Core Thesis:* Concept = Descriptive (Naturalist); Application = Evaluative (Normativist).
      *   *Motivation:* Avoid the "False Dilemma" of pure Naturalism (Boorse) vs. pure Normativism (Engelhardt/Fulford).
      *   *Lactose Intolerance Example:* Biology is fixed, but "normality" depends on the reference class (mammals vs. dairy-eating humans).
      *   *Health/Disease Distinction:* They aren't binary opposites. One can have a disease and be healthy (managed), or be unhealthy without a disease (lifestyle).

  3.  **Address Question (a): Concept vs. Application Distinction:**
      *   *Is it coherent?* It resembles the distinction between *semantics* (meaning) and *pragmatics* (use), or *ontology* vs. *epistemology*.
      *   *The Trap:* If the *application* conditions are necessary for the term to pick out anything in the real world, do those conditions belong to the concept?
      *   *Analogy:* "Tall." Concept = height relative to a standard. Application = picking the standard. Is "Tall" descriptive? No, it's inherently relational.
      *   *Critique:* If *every* instance of applying "disease" requires a value-laden choice of reference class, then the concept *itself* must contain a slot for that value judgment. A concept that *cannot* be applied without values is effectively a value-laden concept.
      *   *Verdict:* It risks being "Normativism with extra steps." The "concept" becomes an empty shell if it never touches reality without values.

