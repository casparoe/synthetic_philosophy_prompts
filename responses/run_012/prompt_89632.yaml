answer: |-
  Dev is arguing for a position that occupies the middle ground between classic Naturalism (like Boorse's Biostatistical Theory) and classic Normativism (like Engelhardt's). In the literature, this is often called **Hybridism** or **Normative Naturalism** (similar to Jerome Wakefield's "Harmful Dysfunction" analysis, though Dev's version is slightly distinct).

  Dev is smart to separate the *concept* from the *classification act*, but you are right to smell a rat. The distinction is unstable. Here is the breakdown of where the Split View holds, where it collapses, and how a Naturalist should respond.

  ### (a) The Concept/Application Distinction: Sleight of Hand or Solid Ground?

  Dev claims the *concept* of disease is purely biological (subnormal functioning), but *applying* it requires value judgments (choosing the reference class).

  **The Verdict:** This is largely "Normativism with extra steps." The sleight of hand happens in how he defines "concept."

  **The Problem:**
  If a concept cannot be applied to the real world without inserting a value-laden parameter, that parameter is part of the concept's truth conditions, not just its application.

  Consider the concept **"Tall."**
  *   **Dev's Analysis:** The concept of "Tall" is purely descriptive (height). The *application* requires choosing a reference class (tall for a jockey? tall for a basketball player?). Therefore, "Tall" is a descriptive concept with value-laden application.
  *   **The Reality:** "Tall" is inherently relational. You cannot define "Tall" without a comparison class. If the comparison class is chosen by values (who do we *care* to compare him to?), then "Tall" is a value-laden concept.

  Dev tries to save the "biological concept" by saying the *mechanism* is biological. But a biological mechanism is only a "dysfunction" relative to a goal state. If the goal state (the reference class) is selected by values, the "dysfunction" is value-laden.

  **Where the Sleight of Hand Is:**
  Dev treats the **Reference Class** as an external tool (like a microscope) used to inspect the concept. In reality, the Reference Class is an internal variable of the concept itself.
  *   *Formula:* $X$ is a disease if $X$ reduces function relative to $C$ (Class).
  *   If $C$ is determined by values, then the truth value of "$X$ is a disease" is determined by values.
  *   Dev tries to say the *formula* is biological. But a formula with a blank space for a value judgment isn't a biological fact; it's a template for a value judgment.

  **Conclusion on (a):** The distinction collapses. If *every* instance of classifying a disease requires a value judgment to fix the reference class, then the concept "disease" is essentially contested. It is not "descriptive with evaluative application"; it is "descriptive *relative to* evaluative parameters."

  ### (b) When the Function Itself is Contested

  Dev's view relies on the idea that we can agree on the *biology* (the function) even if we disagree on the *class*. But often, we disagree on the function itself. This is where the Split View faces a harder collapse.

  Naturalism relies on "species-typical functioning." But biology is full of trade-offs, conflicts, and polyfunctional traits. When we disagree on what a trait is *for*, we aren't just picking a reference class; we are picking a biological theory, and those theories are often laden with normative assumptions about what constitutes "flourishing."

  **Example 1: Gestational Diabetes**
  *   **The Biology:** During pregnancy, the placenta produces hormones that induce insulin resistance in the mother, raising her blood sugar to ensure the fetus gets enough glucose. Sometimes this spikes too high (Gestational Diabetes).
  *   **The Naturalist View:** The mother's glucose regulation system is failing to maintain homeostasis. Disease.
  *   **The Evolutionary View:** This isn't a malfunction; it's an evolutionary arms race between maternal and fetal genomes. The fetus "wants" more resources; the mother "wants" to conserve them for future pregnancies.
  *   **The Normative Crash:** To call this a "disease," you have to decide whose function matters. Is the "organism" the mother (whose system is stressed) or the mother-fetus dyad (where the high sugar might be adaptive for fetal survival in a resource-poor environment)?
  *   **Dev's Split View Failure:** Dev would say, "Pick a reference class." But the problem isn't the class; it's the *teleology*. Is the insulin resistance a *bug* or a *feature*? Biology alone doesn't answer that. You need a normative theory of whose interests define "function." If you value maternal long-term health, it's a disease. If you value immediate fetal survival at all costs, it's functional. The "biological concept" of function is already split.

  **Example 2: High-Functioning Autism (Neurodiversity)**
  *   **The Biology:** Distinct neural connectivity patterns, differences in social signaling processing.
  *   **The Function Question:** What is the function of the human brain? Is it to process information efficiently (where autistic patterns might excel in pattern recognition) or to navigate neurotypical social hierarchies (where they might struggle)?
  *   **The Crash:** If you define brain function as "social conformity," autism is a dysfunction. If you define it as "information processing," it might be a variation. Dev's view says the concept is biological. But the *description* of the biology ("dysfunctional social signaling" vs. "alternative cognitive style") is already theory-laden. You cannot describe the "subnormal functioning" without first valuing a specific type of functioning.

  **Conclusion on (b):** The Split View fails here because "function" is not a brute biological fact like "mass" or "charge." It is an interpretive layer placed over biology. If the interpretation of function is normative, the "purely biological concept" Dev posits does not exist.

  ### (c) The Strongest Naturalist Reply (and the Health/Disease Binary)

  Dev is actually on shaky ground with his second point (Health $\neq$ Absence of Disease), and this is where a Naturalist can push back hardest.

  **1. The Health/Disease Binary**
  Dev thinks separating Health and Disease blows up the debate. It doesn't. Most sophisticated Naturalists (including Boorse in later writings) agree with Dev here.
  *   **Disease:** A specific mechanical failure of a subsystem (e.g., the pancreas stops making insulin).
  *   **Health:** A holistic state of overall operational capacity.
  *   **Why they come apart:** You can have a localized mechanical failure (Disease) that is compensated for by other systems, leaving you overall operational (Healthy). Example: A person with one kidney has a "disease" state (renal abnormality) but is perfectly "healthy" (functions normally). Conversely, you can have no specific mechanical failure but be "unhealthy" due to environmental mismatch (e.g., severe malnutrition without a metabolic disorder).
  *   **Naturalist Win:** A Naturalist can concede this without giving up Naturalism. They just say: "Disease is a biological fact about a part; Health is a functional fact about the whole." This doesn't require normativism; it just requires systems theory.

  **2. The Strongest Naturalist Reply to the "Value-Laden Application"**
  Dev concedes that *classification* is value-laden. The Naturalist should seize this and argue for an **Ontological vs. Epistemic Distinction.**

  *   **The Argument:** Values determine what we *look for* (Epistemology/Interest), but Biology determines what we *find* (Ontology/Truth).
  *   **The "Gold" Analogy:**
      *   Deciding to mine for gold is a value judgment (we value wealth).
      *   Deciding that atomic number 79 counts as "gold" is a convention, but once fixed, whether a rock is gold is a mind-independent fact.
      *   Deciding to treat blood pressure over 130 as "Hypertension" is a value/policy judgment (we value risk reduction).
      *   But once that line is drawn, whether a patient *meets* the criteria is a biological fact.
  *   **The Reply to Dev:** "Dev, you are confusing the *interest* in the concept with the *content* of the concept. Yes, we choose to care about lactose intolerance because we value dairy consumption. That makes the *label* 'disease' pragmatic. But the underlying reality—the inability of the gut to hydrolyze lactose—is a value-free biological state. The 'Split View' is unnecessary. Just admit: Disease is a biological state that we *select* for medical attention based on values. The values explain why we treat it, not what it *is*."

  **Why this beats the Split View:**
  Dev tries to keep the *concept* pure but admits the *application* is dirty. The Naturalist says: "The concept is biological. The *decision to use the concept* is normative."
  *   **Dev:** "Disease" = Biological Function + Value Cutoff.
  *   **Naturalist:** "Disease" = Biological Dysfunction. "Medical Condition" = Disease + Value Judgment that it matters.

  By distinguishing **Disease** (biological) from **Illness** (lived experience) from **Sickness** (social role), the Naturalist can concede Dev's point about lactose intolerance without admitting that "disease" itself is normative. They would say: "Lactose intolerance is a *biological variation*. It only becomes a *disease* if we normatively decide that dairy digestion is essential. But the biology remains value-free."

  ### Summary for Your Seminar

  1.  **On the Split View:** It is unstable. If the application *necessarily* requires values to fix the reference class, the concept is implicitly normative. It is like saying "Bachelor" is a descriptive concept, but applying it requires a value judgment about what counts as "marriage."
  2.  **On Function:** Dev underestimates how often "function" is contested (e.g., Gestational Diabetes, Menopause, Neurodiversity). If the biological description itself relies on normative teleology, the "purely biological concept" vanishes.
  3.  **On Health vs. Disease:** Dev is right that they aren't binary opposites, but this doesn't help Normativism. Naturalists can model this as Part vs. Whole.
  4.  **The Naturalist Counter:** Don't fight the value judgment; quarantine it. Values determine which biological deviations we *care* about (Illness/Sickness), but Biology determines which deviations *exist* (Disease). Dev's error is thinking that because we value the classification, the classified thing is constituted by that value.

  Dev's view is a sophisticated Hybridism, but it likely collapses into Normativism because it cannot isolate a "value-free" biological function that doesn't already presuppose a normative theory of what the organism is *for*.
