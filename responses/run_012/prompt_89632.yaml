      *   **Conclusion:** Summarize where Dev wins and where he slips.

  7.  **Refining the Examples:**
      *   *Lactose:* Good, but user already knows it.
      *   *Need:* Something where the *function* is debated.
      *   *Idea:* *Psychopathy.* Biological difference? Yes. Dysfunction? Only if we value empathy/cooperation. If the function of the brain is "individual survival," psychopathy might be efficient. If "social cohesion," it's a defect.
