answer: |-
  This is an excellent test case. Your background in data modeling gives you a distinct advantage here: much of analytic metaontology is effectively debugging the schema of natural language. You are asking whether the "Pluto Dispute" was a bug in the data (substantive) or a conflict in the view definitions (verbal).

  Here is an analysis of the episode through the lens of verbal disputes and metaontology, followed by an evaluation of what the episode reveals about the theory itself.

  ---

  ### Part 1: Analyzing the Pluto Episode

  #### 1. Mapping the Disputants and Schemas
  In metaontological terms, we must distinguish between the *facts* (the data rows) and the *ontology* (the schema/constraints).

  *   **The Underlying Data (Agreed Facts):** All parties agree on the physical attributes of Pluto.
      *   `orbits_sun`: TRUE
      *   `hydrostatic_equilibrium` (round): TRUE
      *   `orbital_dominance` (cleared neighborhood): FALSE
      *   `geological_complexity`: HIGH (atmosphere, moons, tectonics)
  *   **Disputant A (The IAU Majority):** They proposed a schema migration. In their view, the `Planet` table requires a foreign key relationship to `OrbitalEnvironment`.
      *   *Definition:* `Planet` ≡ `orbits_sun` ∧ `is_round` ∧ `has_cleared_orbit`.
      *   *Motivation:* Taxonomic cleanliness. If you don't require orbital clearing, the `Planet` table risks exploding with hundreds of rows as detection improves (normalization).
  *   **Disputant B (The Dissenting Planetary Scientists):** They preferred a schema based on intrinsic properties.
      *   *Definition:* `Planet` ≡ `orbits_sun` ∧ `is_round`.
      *   *Motivation:* Physical utility. If you care about geology, atmosphere, or potential habitability, `orbital_dominance` is a noisy field. It groups geologically dead asteroids with complex worlds.
  *   **The Public:** They are not disputants in the ontological sense; they are *legacy users*. Their mental model had a hardcoded constant: `Pluto.is_planet = TRUE`. The change broke their backward compatibility. They are not arguing about the schema; they are arguing about the emotional and cultural cost of the migration.

  #### 2. Applying the Standard Test
  The standard test for a merely verbal dispute (often associated with philosophers like David Chalmers or Rudolf Carnap) asks: **If we translate both claims into a neutral vocabulary that fixes the reference of all terms, does the disagreement persist?**

  In your idiom: If we expose the underlying columns and remove the boolean flag `is_planet`, do the rows change?

  *   **Translation:**
      *   IAU Claim: "Pluto does not satisfy condition C3 (orbital clearing)."
      *   Dissenter Claim: "Pluto satisfies conditions C1 (orbit) and C2 (round), and C3 is irrelevant for geological classification."
  *   **Result:** There is no disagreement about the state of Pluto. There is no disagreement about the laws of physics. The disagreement is entirely about which `SELECT` query constitutes the "correct" view of the data.

  By the strict criteria of the standard test, **this is a merely verbal dispute.** It is a disagreement about intension (the definition of the concept) rather than extension (the objects in the world). If the IAU had said, "We will now call objects that clear their orbits 'Class 1 Bodies' and objects that don't but are round 'Class 2 Bodies'," and the dissenters said, "We will call both 'Planets'," they would agree on every physical fact. The conflict arises only because both parties want exclusive use of the high-value label "Planet."

  #### 3. The Wrinkle: Stipulation and Governance
  You identified a crucial wrinkle: **The dispute was not resolved by analysis, but by vote.**

  Standard metaontological discussions of verbal disputes usually assume natural language usage (e.g., "Does a couch count as furniture?"). They rarely account for *institutional stipulation*. The IAU did not discover the "true" meaning of planet; they acted as a standards body (like ISO or W3C).

  *   **Carnapian Frameworks:** Rudolf Carnap distinguished between *internal questions* (answered within a framework, e.g., "Is Pluto a planet under IAU Resolution B5?") and *external questions* (about which framework to adopt).
  *   **The Vote:** The vote was an answer to an external question. It was a pragmatic choice of framework, not a truth-apt discovery.
  *   **Does the theory handle this?** Mostly, yes. Metaontology acknowledges that we can choose frameworks based on utility. However, standard theory often assumes these choices are made by individual philosophers or scientists based on logical utility. It is less equipped to handle *political* stipulation. The IAU vote introduced a normative authority that natural language lacks. In natural language, you cannot vote "couch" out of "furniture." In scientific taxonomy, you can vote `Pluto` out of `Planet`.

  This suggests the dispute was verbal *in structure* but *governance-based in resolution*. The theory of verbal disputes explains why they were talking past each other; the theory of institutional facts explains why the IAU could end the conversation.

  ---

  ### Part 2: What the Episode Shows About the Theory

  Running the analysis in reverse, the Pluto case puts pressure on the theory of verbal disputes in three specific ways.

  #### 1. It Supports the "Verbal" Diagnosis, but Reveals "Stakes"
  The theory predicts that if a dispute is merely verbal, resolving the terminology should dissolve the tension. In the Pluto case, the terminology *was* resolved (IAU Resolution B5 passed), yet the tension *did not* dissolve. Alan Stern (a lead dissenter) continues to use the term "planet" for Pluto in scientific literature.

  *   **Theory Implication:** This suggests the theory underrates the **pragmatic weight of labels**. In data modeling, renaming a table is trivial. In science, the label `Planet` is a resource. It dictates funding priority, mission selection, and public engagement.
  *   **Critique:** The theory treats verbal disputes as "empty" or "confused." The Pluto case shows a verbal dispute can be **substantive in consequence**. Even if the disagreement is only about a definition, if that definition controls resource allocation, the dispute is functionally substantive. The theory needs to account for the *cost* of schema migrations, not just the logical consistency of the schema.

  #### 2. It Highlights the "Utility" Dimension of Ontology
  Metaontology often asks, "What exists?" or "What is the correct classification?" implicitly assuming there is a "carving at the joints" of nature. The Pluto dispute suggests that for scientific kinds, the "correct" carving depends on the **query pattern**.

  *   **Dynamical Astronomers** care about orbital stability and system formation. Their "query pattern" requires `orbital_dominance`.
  *   **Geophysical Planetary Scientists** care about surface processes and potential life. Their "query pattern" requires `hydrostatic_equilibrium`.
  *   **Theory Implication:** This supports a **pluralistic metaontology** (similar to Carnap or Hilary Putnam). There is no single "true" schema. There are only schemas that are more or less useful for specific tasks. The theory is correct that the dispute is verbal, but it implies that one side *must* be wrong about the world. The Pluto case suggests both sides are right about the world, but optimizing for different use cases.

  #### 3. Where the Theory is Silent: Authority and Stipulation
  This is the most significant gap. The standard theory of verbal disputes assumes a landscape of competing usages that need clarification. It does not have a robust module for **stipulative authority**.

  *   **The Silence:** If the IAU had not voted, the verbal dispute would likely continue indefinitely (as it effectively has). Standard metaontology doesn't explain *who gets to decide* which verbal framework becomes standard when both are logically coherent.
  *   **The Gap:** The theory treats ontology as a descriptive project (describing how we *do* use words or how the world *is*). The Pluto case was a prescriptive project (deciding how we *shall* use words).
  *   **Implication:** You cannot fully analyze the Pluto case with metaontology alone. You need a philosophy of **scientific governance**. The "verbal dispute" framework explains the *nature* of the disagreement, but it is silent on the *legitimacy* of the resolution. It cannot tell us if the IAU was *right* to vote, only that they *did* vote.

  ### Summary Carving

  To summarize the carving you requested:

  1.  **Ontological Status:** By the standard test, the dispute was **merely verbal**. The underlying data rows (Pluto's physical properties) were never in contention. The disagreement was strictly over the `WHERE` clause of the definition.
  2.  **Metaontological Category:** This fits the Carnapian model of an **external question** resolved by pragmatic stipulation, not an internal question resolved by empirical discovery.
  3.  **Theory Limit:** The theory of verbal disputes successfully diagnoses the *structure* of the conflict but fails to capture the *politics* of the resolution. It treats the choice of definition as a matter of clarity, whereas the Pluto case shows it is a matter of **institutional authority and resource allocation**.

  **Verdict:** The episode supports the claim that classificatory disputes are often verbal in structure. However, it shows that the theory underrates the substantive consequences of verbal choices. In a system where labels map to funding and prestige, a "merely verbal" dispute is never *merely* anything. The theory asks "Is this dispute about words or the world?" The Pluto case suggests the better question is "Whose utility does this vocabulary serve?"
