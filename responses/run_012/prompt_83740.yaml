      *   *Falsifiability:* What would count against it? A world with *more* evil and *less* order? Or a logical contradiction in creation? Actually, the stronger point is that for Leibniz, the "best" is a comparative metric. If we could conceive of a logically possible world with more variety/order and less evil, the theory strains. But the real falsification condition is tricky because it relies on God's intellect. I need to be careful here. A better angle: If the world were purely chaotic (no laws), it couldn't be the best.
