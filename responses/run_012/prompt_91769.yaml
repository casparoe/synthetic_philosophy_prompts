prompt: |-
  I run the platform team at a mid-sized SaaS company and I chair our blameless incident reviews, and the recurring problem isn't finding causes, it's settling arguments about them. After an outage we'll have three or four rival stories up on the whiteboard and the meeting ends up ratifying whichever one the most senior or most confident person happens to be attached to. Last month we burned two hours on a payments outage arguing whether it was a race condition in our code, a bad config push, or the cloud provider throttling us, and we went with the race condition because it was the most interesting, then shipped a fix that did nothing. I was moaning about this to a friend who did a philosophy degree and she said what I was after was inference to the best explanation, which I've read about but have never managed to make concrete. So: please turn it into a decision procedure I can actually run in a 45-minute review with six engineers, no statistician in the room. I want to know what to write down for each candidate explanation, what order to compare them in, what counts as a decisive test we can run before the meeting ends, and — the bit I care about most — how to tell an explanation that's genuinely better supported from one that's merely prettier or more satisfying to tell.

  Then run the procedure on two or three hypothetical incidents so I can see it work: (a) an outage where an elegant single-cause story and a boring two-cause story both fit every scrap of evidence we have; (b) one where an exciting explanation — someone was attacking us, or a subtle data race — fits one striking piece of evidence but predicts nothing else, while a dull explanation predicts a pile of small things we did actually observe; and (c) a case where the procedure should refuse to name any cause at all and output 'unknown, here's what we'll watch next time' instead, even though the room is desperate for closure. Be honest about which steps are judgment calls dressed up as a checklist, and say plainly what the procedure can't do — I'd much rather it told me when it's useless than gave me false confidence. Two more constraints: it has to survive a room where people will try to game it by dressing up a guess as an 'explanation', and it can't assume we have clean logs or reproducible failures, because half our incidents happen once and we never see them again. Write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Role:** Platform Team Lead at a mid-sized SaaS company.
      *   **Problem:** Blameless incident reviews devolve into arguments, dominated by seniority/confidence rather than evidence. "Interesting" stories win over "correct" ones. Fixes based on wrong causes fail.
      *   **Goal:** Turn "Inference to the Best Explanation" (IBE) into a concrete decision procedure for a 45-minute meeting with 6 engineers (no statisticians).
      *   **Requirements:**
          *   What to write down for each candidate.
          *   Order of comparison.
          *   Decisive tests runnable *before* the meeting ends.
          *   How to distinguish "better supported" from "prettier".
          *   Run the procedure on three specific hypothetical scenarios (a, b, c).
          *   Be honest about limitations (judgment calls, when it's useless).
          *   Survive gaming (guesses dressed as explanations).
          *   Handle messy data (no clean logs, non-reproducible failures).
          *   **Language:** British English.

  2.  **Deconstruct "Inference to the Best Explanation" (IBE) for this context:**

      *   IBE isn't just "what sounds good." It's about explanatory power, scope, simplicity (parsimony), and consistency with background knowledge.
      *   *Challenge:* Engineers love complexity (race conditions!) but often ignore base rates (config errors are more common).
      *   *Constraint:* 45 minutes is tight. The procedure must be lightweight.
      *   *Constraint:* No clean logs. We rely on correlation, timing, and system knowledge.

  3.  **Drafting the Procedure (The "IBE Protocol"):**

      *   *Phase 1: Candidate Generation (10 mins).* Stop the first story from dominating. Force divergence.
      *   *Phase 2: The Scorecard (20 mins).* This is the core. Need specific criteria.
          *   Criteria ideas: Fits the timeline? Fits the metrics? Requires new assumptions? Base rate (how often does this happen)? Actionable?
          *   Need to penalize "ad hoc" assumptions (adding extra bits to make the story fit).
      *   *Phase 3: Falsification/Testing (10 mins).* What can we check *now*? If we can't check, does it matter?
      *   *Phase 4: Decision (5 mins).* Select or defer.
      *   *Anti-Gaming:* Require evidence for every claim. "Because I've seen it before" isn't evidence, it's a heuristic.

  4.  **Refining the Criteria (The "Weighting"):**

      *   *Consilience:* Does it explain *multiple* independent facts? (Crucial for distinguishing "pretty" from "true").
      *   *Simplicity:* Fewer moving parts is better, *unless* complexity is required to fit the data.
      *   *Analogy:* Is this a known failure mode?
      *   *Testability:* Can we prove it wrong?

  5.  **Developing the Hypothetical Scenarios:**

      *   *(a) Elegant Single vs. Boring Dual:* Single cause (Race Condition) vs. Two causes (Config + Load). Usually, the boring one is right if the single cause requires assuming a bug that doesn't exist in the code review.
      *   *(b) Exciting vs. Dull:* DDoS/Attack (Exciting, fits one spike) vs. Memory Leak (Dull, fits gradual creep + restart pattern). The dull one predicts more observations.
      *   *(c) Unknown:* Data is missing. No logs. Procedure must say "Stop."

  6.  **Addressing Constraints & Limitations:**

      *   *Judgment Calls:* Admit that weighting "simplicity" vs. "fit" is subjective.
      *   *Gaming:* The "Evidence Anchor" rule. If you can't point to a log line or a commit, it's a hypothesis, not a candidate.
      *   *Messy Data:* Acknowledge that sometimes the answer *is* unknown.
      *   *British English:* Use "programme" (maybe, though software is usually 'software'), "colour", "centre", "analyse", "prioritise", "whilst", "mate" (maybe too informal? Keep it professional but British), "rubbish", "properly".

  7.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, pragmatic, slightly weary of corporate nonsense (matching the user's vibe).
      *   *Structure:*
          1.  Introduction (Acknowledging the pain).
          2.  The Protocol (Step-by-step).
          3.  The Scorecard (The matrix).
          4.  The Scenarios (a, b, c).
          5.  Limitations (The "Get Out" clause).
      *   *Key Concept:* "Explanatory Scope." A theory that explains 5 things is better than one that explains 1 thing, even if the 1 thing is dramatic.
      *   *Key Concept:* "Ad Hoc Rescue." Adding a clause just to save the theory counts against it.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I make it too academic? *Fix:* Simplify the terminology. Instead of "Consilience," use "Coverage." Instead of "Parsimony," use "Assumptions."
      *   *Check:* Is it 45 minutes feasible? *Fix:* Strict timeboxes.
      *   *Check:* British English? *Fix:* Ensure spelling (behaviour, analyse, centre) and idiom (e.g., "bin it," "have a go").
      *   *Check:* Did I address the "gaming" aspect? *Fix:* Add a specific rule about "Evidence Anchors."
      *   *Check:* Did I address the "unknown" outcome? *Fix:* Make "Insufficient Evidence" a valid output.

  9.  **Final Polish:**

      *   Ensure the distinction between "Best Story" and "Best Explanation" is clear.
      *   Make sure the "Decisive Test" section is realistic for a meeting room (e.g., checking a config history, not rewriting code).
      *   Verify the scenarios match the prompt's specific requirements.

  **(Self-Correction Note on British English):** Be careful not to overdo the slang. Keep it professional business British (e.g., "programme" vs "program" is tricky in tech, usually "program" is accepted even in UK tech, but "analyse" and "colour" are safe bets. "Prioritise" with an 's'.)

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Right, let's get this sorted. You've identified the core pathology: your post-mortems are selecting for *narrative appeal* rather than *explanatory power*. In philosophy, Inference to the Best Explanation (IBE) is often treated as a vague intuition, but in engineering, we can treat it as an optimisation problem. We are maximising fit with evidence while minimising assumptions.

  Here is a concrete procedure, the **Explanatory Audit**, designed for a 45-minute window with messy data and opinionated engineers.

  ### The Explanatory Audit Protocol

  **Timebox:** 45 minutes strict.
  **Participants:** Chair (you), Scribe (rotating), Engineers involved.
  **Tools:** Whiteboard (physical or virtual) divided into columns.

  #### Phase 1: Divergence (10 Minutes)
  *Goal: Prevent the first loud voice from anchoring the room.*

  1.  **The Evidence Anchor:** Before discussing *causes*, list the **Immutable Facts**. These are observations no one is allowed to argue with.
      *   *Examples:* "Error rates spiked at 14:02," "CPU hit 100%," "Config change deployed at 13:55."
      *   *Rule:* If it's not in the logs, metrics, or deploy history, it doesn't go on this list. Anecdotes ("It felt sluggish") are banned.
  2.  **Candidate Generation:** Ask the room for *all* plausible causes. Write them in columns.
      *   *Rule:* You must have at least three candidates. If someone suggests the "Race Condition," force them to propose two alternatives (e.g., "Resource Exhaustion," "External Dependency"). This breaks the attachment to the first idea.

  #### Phase 2: The Scorecard (20 Minutes)
  *Goal: Quantify 'Best' without statistics.*

  For each candidate column, score the following four criteria. Use a simple traffic light system (Green, Amber, Red).

  | Criterion | What to ask | Green (Good) | Red (Bad) |
  | :--- | :--- | :--- | :--- |
  | **Coverage** | How many Immutable Facts does this explain? | Explains >80% of facts (timing, metrics, errors). | Explains only the dramatic spike, ignores the creep-up or aftermath. |
  | **Assumptions** | What new things must we assume are true for this to work? | Relies on known system behaviour or existing bugs. | Requires assuming a hidden bug, a simultaneous failure, or magic. |
  | **Base Rate** | How often does this happen in our system generally? | Common failure mode (e.g., config drift, DB locks). | Exotic failure mode (e.g., bit rot, specific race condition never seen before). |
  | **Falsifiability** | Can we prove this wrong quickly? | Yes, we can check a log or revert a change. | No, it's unobservable or requires a load test we can't run now. |

  **The "Ad Hoc" Penalty:** If a candidate explanation requires adding a *new* assumption mid-meeting to fit a fact (e.g., "Well, the race condition only triggers if the cache is warm..."), mark **Assumptions** as Red immediately. This is the primary defence against "pretty stories."

  #### Phase 3: The Decisive Test (10 Minutes)
  *Goal: Distinguish supported theory from guesswork.*

  For the top two candidates, define a **Decisive Test**. This must be something you can verify *before the meeting ends* or within 24 hours without writing new code.

  *   *Valid Tests:* Querying existing logs for a specific trace ID; checking the timestamp of a config change; reviewing the specific commit diff; checking the cloud provider status page history.
  *   *Invalid Tests:* "We'll wait for it to happen again"; "We'll rewrite the module and see"; "Let's run a load test next week."

  If a candidate cannot survive a Decisive Test, it is demoted to "Hypothesis," not "Cause."

  #### Phase 4: Verdict (5 Minutes)
  *Goal: Commit or Concede.*

  1.  **Select:** Choose the candidate with the most Greens and fewest Reds.
  2.  **Defer:** If the top two candidates are tied, or if the winner relies on a Red "Falsifiability" score, the verdict is **Unknown**.
  3.  **Action:** Assign the fix *only* if the cause is selected. If Unknown, assign **Observability Work** (add logging to distinguish between the top candidates next time).

  ---

  ### Distinguishing "Better" from "Prettier"

  You asked how to tell the difference. In this protocol, a **Prettier** explanation is one that scores high on *Base Rate* (it's exotic/interesting) but low on *Assumptions* (it requires special conditions to fit the facts). A **Better** explanation scores high on *Coverage* (it explains the boring stuff too) and low on *Assumptions*.

  *   **The Narrative Trap:** "A subtle race condition caused the deadlock." (Exciting, implies high skill to find).
  *   **The Engineering Reality:** "The memory limit was lowered in the last deploy, and traffic was higher than usual." (Boring, implies a process failure).

  The Audit penalises the Narrative Trap via the **Assumptions** and **Base Rate** criteria. If the race condition requires assuming a specific thread timing that has never been observed, it takes a penalty. If the memory limit change is in the git log, it gets a Green for Coverage.

  ---

  ### Running the Procedure: Three Scenarios

  Here is how the Explanatory Audit handles the specific messes you described.

  #### Scenario A: The Elegant Single vs. The Boring Dual
  **Incident:** API latency spiked 10x for 15 minutes, then self-healed.
  **Immutable Facts:** Spike coincided with a marketing email send; CPU stayed normal; Database connections maxed out.
  **Candidate 1 (Elegant):** A deadlock in the new billing service code.
  **Candidate 2 (Boring):** Connection pool exhaustion due to email traffic + slow queries from a missing index.

  *   **Audit:**
      *   **Coverage:** Candidate 1 explains the spike, but not why CPU was normal (deadlocks usually spin CPU). Candidate 2 explains the spike, the normal CPU (waiting on I/O), and the maxed connections. **Winner: Candidate 2.**
      *   **Assumptions:** Candidate 1 assumes a deadlock exists (unproven). Candidate 2 assumes traffic increased (proven by marketing schedule) and an index is missing (proven by query logs). **Winner: Candidate 2.**
      *   **Decisive Test:** Check the billing service logs for deadlock exceptions. (Result: None found). Check DB active connections during the window. (Result: 95% idle waiting).
  *   **Verdict:** Candidate 2. The room wants the deadlock because it's "engineering-y," but the Audit forces them to admit the deadlock theory explains less of the data.
  *   **Outcome:** Add the index. Do not refactor the billing service.

  #### Scenario B: The Exciting Attack vs. The Dull Leak
  **Incident:** Service became unresponsive. One massive spike in network ingress.
  **Immutable Facts:** 5GB ingress spike in 1 minute; Memory climbed steadily for 3 days prior; Process restarted automatically.
  **Candidate 1 (Exciting):** DDoS / Malicious Actor.
  **Candidate 2 (Dull):** Memory leak + Retry Storm.

  *   **Audit:**
      *   **Coverage:** Candidate 1 explains the ingress spike. It does *not* explain the 3-day memory creep. Candidate 2 explains the memory creep. It explains the ingress spike as clients retrying a slow service (retry storm). **Winner: Candidate 2.**
      *   **Base Rate:** Candidate 1 (DDoS) is rare for your mid-sized SaaS. Candidate 2 (Memory leak) has happened twice this year. **Winner: Candidate 2.**
      *   **Assumptions:** Candidate 1 assumes an attacker picked this exact moment. Candidate 2 assumes standard retry logic (which is configured).
      *   **Decisive Test:** Check IP distribution of the ingress spike. (Result: 80% from known cloud regions where your own users sit, not a botnet). Check memory profile from 2 days ago. (Result: Upward trend visible).
  *   **Verdict:** Candidate 2. The "Attack" story is seductive because it absolves the team of blame (it was an external enemy). The Audit highlights that the Attack story fails to predict the memory creep.
  *   **Outcome:** Fix the leak. Implement circuit breakers for retries. Do not buy a WAF.

  #### Scenario C: The Void (When to say 'Unknown')
  **Incident:** Payment processing stopped for 10 minutes. No logs, no metrics, no deploys.
  **Immutable Facts:** Payments failed. Cloud provider dashboard showed "Green." No deploys.
  **Candidate 1:** Cloud provider silent failure.
  **Candidate 2:** Database network blip.
  **Candidate 3:** Application hang.

  *   **Audit:**
      *   **Coverage:** All candidates explain the failure. None explain the *lack* of logs (if the app hung, why no heartbeat failure? If DB blip, why no connection error?).
      *   **Falsifiability:** All are Red. You cannot check the cloud provider's internal network. You cannot check the DB network history if it wasn't logged. You cannot check the app state as it restarted.
      *   **Assumptions:** All require assuming a failure in a system you cannot observe.
  *   **Verdict:** **Unknown.**
  *   **The Trap:** The room will want to pick Candidate 1 to blame the vendor, or Candidate 3 to blame the code they can actually touch.
  *   **Procedure Output:** The protocol forces a **Defer**.
  *   **Action:** No code fix. Action item is: "Implement heartbeat logging on the payment worker" and "Enable verbose networking logs."
  *   **Why this matters:** If you force a cause here, you will ship a fix that does nothing (as you noted in your prompt). Admitting ignorance is the only way to justify spending sprint capacity on *observability* rather than *features*.

  ---

  ### Limitations and Honest Truths

  You asked for plain speaking about where this breaks. Here is where the Explanatory Audit is fragile.

  **1. The "Judgment Call" Disguise**
  The scoring (Green/Amber/Red) is subjective. A senior engineer can still bully a junior on whether an assumption is "reasonable."
  *   *Mitigation:* As Chair, you hold the veto on "Assumptions." If someone says, "We must assume the garbage collector paused for 10 minutes," and you know the GC is incremental, you mark that Red. You must be the keeper of the system's "Background Knowledge."

  **2. The Correlation Trap**
  This procedure relies on timing. If two things happen at once (Config Push + Traffic Spike), the Audit might struggle to distinguish cause from correlation if both score Green on Coverage.
  *   *Mitigation:* This is where the **Decisive Test** is vital. If you can't distinguish them in the meeting, the verdict *must* be Unknown. Do not allow a vote.

  **3. It Cannot Fix Cultural Cowardice**
  If your team is terrified of admitting a config error because management punishes mistakes, they will game the Audit to point at "Cloud Provider" (Candidate 1 in Scenario C).
  *   *Mitigation:* This procedure cannot save you from a blame culture. It only supports a blameless one. If leadership demands a "Name and Shame" after you declare "Unknown," the process is worthless. You must protect the "Unknown" verdict as a valid, successful outcome.

  **4. It Requires Minimal Competence**
  If your engineers don't understand the system well enough to know Base Rates (e.g., they don't know deadlocks usually spike CPU), the scoring will be nonsense.
  *   *Mitigation:* If the room doesn't know the Base Rates, the meeting is not a Post-Mortem, it's a Training Session. Pause the Audit.

  ### Summary for your Whiteboard

  Write this on the board at the start of every review:

  1.  **Facts First:** No theories until the timeline is agreed.
  2.  **Three Candidates:** No single-story monopolies.
  3.  **Penalise Assumptions:** Every "what if" costs points.
  4.  **Unknown is Valid:** If we can't test it, we don't know it.

  This turns IBE from a philosophical concept into a checklist that survives a room full of tired, opinionated engineers. It won't stop the arguments, but it will give you the vocabulary to shut them down: *"That's a pretty story, but it's got three Red assumptions and explains none of the memory metrics. Next candidate."*
