  2.  **Analyze the Underlying Theory:**

      *   **Expected Value (Arithmetic Mean):** Maximizes average wealth across *parallel universes* (ensemble average). Risk-neutral. Leads to "bet everything" on any positive EV.
      *   **Expected Utility (Log Wealth / Geometric Mean):** Maximizes wealth along a *single timeline* (time average). Risk-averse (specifically, logarithmic utility). Leads to Kelly betting.
      *   **The Ergodicity Problem:** The core tension is between ensemble averages (EV) and time averages (Growth Rate). Ole Peters' work is relevant here.
      *   **Utility Functions:** Ultimately, betting behavior depends on the utility function $U(W)$.
          *   $U(W) = W \rightarrow$ Maximize EV (Bet all on positive EV).
          *   $U(W) = \ln(W) \rightarrow$ Maximize Geometric Growth (Kelly).
          *   $U(W)$ with sharp drop at $W=0 \rightarrow$ Avoid ruin (Insurance/Case 2).

  3.  **Evaluate the User's Intuitions against Theory:**

      *   *Case 1 (One-shot Positive EV):* User says "Bet Big." Theory says: If it's truly one-shot and you don't care about ruin (no future bets), maximizing EV is rational *if* utility is linear. But humans have concave utility (diminishing marginal returns). So "Bet Big" is only right if the bet size is small relative to total wealth. If it's "all or nothing," Log Utility says don't bet all.
      *   *Case 2 (99% Win / 1% Ruin):* User says "No." Theory says: If utility is Log, $0.99 \ln(W+X) + 0.01 \ln(0) = -\infty$. So yes, reject. This aligns with Log Utility/Kelly.
