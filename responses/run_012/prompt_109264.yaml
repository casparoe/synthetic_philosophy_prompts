answer: |-
  You have stumbled onto one of the deepest tensions in decision theory: the conflict between **Ensemble Averages** (Expected Value across parallel universes) and **Time Averages** (Growth along a single timeline).

  Your gut is surprisingly sophisticated, but it is inconsistent on one crucial point. Here is the unifying principle, the correction you need to make, and the verdict on your friend's philosophy.

  ### The Unifying Principle: Maximize Expected Log-Utility

  There is one principle that reconciles almost all of your intuitions: **Maximize the expected value of the logarithm of your wealth.**

  In finance, this is the **Kelly Criterion**. In economics, this is **Expected Utility Theory** with a logarithmic utility function. In physics, this is **Ergodicity Economics** (pioneered by Ole Peters).

  Here is why this single rule explains your gut feelings:
  1.  **Diminishing Returns:** The first \$1,000 you make matters more than the millionth. Logarithms capture this concavity.
  2.  **The Ruin Barrier:** $\ln(0) = -\infty$. If there is *any* non-zero probability of going to zero wealth, the expected log-utility is negative infinity. This mathematically enforces "never bet everything" whenever ruin is possible.
  3.  **Compounding:** In repeatable games, wealth compounds multiplicatively. The average growth rate of compounded wealth is determined by the geometric mean, which is the exponent of the expected log return.

  ### Does the One-Shot vs. Repeatable Distinction Matter?

  **Mostly, no.** This is the story you are telling yourself to justify inconsistent behavior.

  The math doesn't care if the bet happens once or a million times. It cares about **consequences relative to your total capacity**.
  *   **Repeatable:** If you go broke on round 3, you can't play round 4. The "game over" barrier makes it a time-average problem.
  *   **One-Shot:** If you go broke on the one shot, you have no resources for *life's* subsequent bets (eating, housing, future opportunities). Unless you literally die the moment the bet settles, a "one-shot" financial bet is actually part of a longer sequence of life bets.

  **The Correction:** Your intuition on **Case #1** is the weak link. You said: *"One-shot... take a big swing."*
  *   **If the bet is small relative to your wealth:** Yes, bet aggressively. Log-utility is roughly linear for small changes.
  *   **If the bet is large relative to your wealth:** No. Even if it is one-shot, if losing wipes you out, Log-Utility says **do not bet it all.** The "one-shot" nature doesn't grant immunity from ruin. You only maximize Arithmetic EV (bet everything) if you truly do not care about the variance or the consequence of zero (e.g., you are betting with house money you'd otherwise throw away).

  ### Grading Your Six Intuitions

  Here is how the **Maximize Expected Log-Wealth** principle judges your cases:

  1.  **One-Shot Positive EV:**
      *   *Your Gut:* Bet big.
      *   *Principle:* **Conditional.** If the stake is small vs. bankroll, yes. If the stake is large, **No.** You should still size down to protect against the utility crash of a loss.
      *   *Verdict:* **Partially Wrong.** You are conflating "one-shot" with "no consequences."

  2.  **99% Win / 1% Ruin:**
      *   *Your Gut:* No.
      *   *Principle:* **Correct.** $\ln(0)$ kills the expectation. No amount of positive EV compensates for a non-zero chance of total ruin in a log-utility framework.
      *   *Verdict:* **Right.**

  3.  **Insurance (Negative EV):**
      *   *Your Gut:* Yes.
      *   *Principle:* **Correct.** Insurance is buying a reduction in variance to protect the denominator of your life's compounding. You are trading Arithmetic EV for Geometric Stability.
      *   *Verdict:* **Right.**

  4.  **Two Independent Bets:**
      *   *Your Gut:* Bet both, size down.
      *   *Principle:* **Correct.** This is portfolio theory. Uncorrelated assets reduce overall variance, allowing you to deploy more capital total, but the risk per position must be managed so the combined volatility doesn't threaten ruin.
      *   *Verdict:* **Right.**

  5.  **Tiny Edge (51/49):**
      *   *Your Gut:* Small stake, proportional.
      *   *Principle:* **Correct.** The Kelly formula is $f^* = \frac{p}{a} - \frac{q}{b}$. For even money, $f^* = p - q = \text{edge}$. It is linear near zero.
      *   *Verdict:* **Right.**

  6.  **Half-Kelly:**
      *   *Your Gut:* Friend says safety.
      *   *Principle:* **Principled.** Full Kelly maximizes growth but has high volatility (you can suffer 50% drawdowns easily). Fractional Kelly moves you down the "efficient frontier" of growth vs. variance. It implies a utility function *more* concave than log (more risk-averse).
      *   *Verdict:* **Right.**

  ### The Generalization: Beliefs, Effort, Happiness?

  Your friend is half-right, but stretching the metaphor.

  *   **Beliefs (Information Theory):** **Yes.** Updating beliefs via Bayes' Rule is mathematically isomorphic to Kelly betting. If you want to maximize the growth rate of your "truth capital" (accuracy) over a lifetime of updates, you should update proportionally to the evidence, not swing wildly on every new datum. "Maximizing log probability" is the standard loss function in machine learning for this reason.
  *   **Effort / Happiness:** **Metaphorically Yes, Mathematically No.**
      *   *Why Yes:* Diminishing returns apply. Working 100 hours/week leads to burnout (ruin), which zeros out future productivity. Pacing yourself maximizes the integral of output over time (geometric-like growth).
      *   *Why No:* Happiness and effort don't compound multiplicatively in a strict mathematical sense. You don't "bet" your happiness on a binary outcome. Using Kelly here is a heuristic for **sustainability**, not a rigorous derivation.

  ### What You Must Give Up

  To have a clean principle, you must sacrifice **Intuition #1 (The Aggressive One-Shot).**

  You cannot hold both "Never bet everything on repeatable games" and "Bet big on one-shot games" if the stake threatens your solvency. The principle is: **Never risk a significant fraction of your bankroll on a binary outcome, regardless of repetition, if ruin removes you from the game of life.**

  The "one-shot" is a myth. You are always playing a repeatable game called "Your Life."

  ### A New Case: The Leverage Trap

  Here is a case you didn't list, which tests the principle further:

  **The Case:** You have \$100,000. You can borrow \$900,000 at 5% interest to invest in a portfolio that returns 10% on average with low volatility. You now have \$1M invested. The edge is positive.
  **Your Gut:** Probably says "Dangerous."
  **The Principle:** **Log-Utility forbids high leverage.**
  Even if the expected return is positive, leverage increases the *variance* of your equity. If the asset drops 10%, your equity is wiped out (margin call/ruin). Because $\ln(0) = -\infty$, any strategy that introduces a non-zero probability of a margin call has negative expected log-utility.
  **Verdict:** You should deleverage, not leverage up, even with a positive edge. This explains why banks have capital requirements: they are forced to act as if they have Log-Utility to prevent systemic ruin.

  ### Summary

  Your gut is acting like a **Log-Utility Maximizers** who occasionally forgets that "One-Shot" bets are actually part of a larger sequence.

  1.  **Principle:** Maximize Expected Log-Wealth (Geometric Growth).
  2.  **Correction:** Treat "One-Shot" bets as repeatable if the loss impacts your future ability to act.
  3.  **Friend's Claim:** Valid for beliefs/information; a useful metaphor for life, but not a literal law.
  4.  **Sacrifice:** Give up the idea that you should be aggressive on single large bets.

  You aren't confused; you're just realizing that **survival is a prerequisite for success.** Kelly isn't about making the most money; it's about staying in the game long enough for the edge to work.
