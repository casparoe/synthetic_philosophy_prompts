  The concept

  Democratic backsliding denotes the gradual degradation of democratic institutions by elected leaders, distinct from the abrupt collapse characteristic of a coup or democratic breakdown. The concept commits us to observing processes rather than events: specifically executive aggrandizement, where leaders weaken checks and balances, and constitutional retrogression, where legal amendments erode rights. Unlike classical authoritarianism, the regime often retains the facade of elections, sliding into competitive authoritarianism rather than abolishing voting entirely. The mechanism is typically legalistic; rules are manipulated rather than discarded. Crucially, backsliding assumes the incumbent retains a veneer of legitimacy, exploiting the very rules designed to constrain them. This distinguishes it from breakdown, where institutions cease to function, or a coup, where power is seized extralegally.

  However, the concept is contested. Critics argue it relies too heavily on threshold-based indices that may miss qualitative shifts until it is too late, reducing a complex political reality to a score on a scale. Others worry it conflates policy disagreements with structural damage, risking its use as a partisan label against unpopular but legitimate governments. Furthermore, there is debate over whether backsliding requires specific intent to undermine democracy or if negligent erosion suffices. Some scholars argue the focus on gradualism creates a blind spot for rapid legal assaults. Ultimately, the framework prioritises legalistic mechanisms over overt violence, assuming democracies die quietly rather than at gunpoint. This distinction is crucial for distinguishing the slow burn of democratic decay from the sudden explosion of regime collapse, yet it risks overlooking scenarios where legalism masks rapid acceleration towards tyranny. The analytical utility lies in identifying the early warning signs before the point of no return, but defining that point remains the field's central tension.

  The novel as a case

  Berzelius Windrip secures the presidency through legal elections, capitalising on economic distress and nationalist fervour. This fits the backsliding model of an elected demagogue exploiting democratic openings. His initial moves involve sidelining Congress and centralising authority, resembling executive aggrandizement. The establishment of a corporatist state, organising society into functional units under state control, mirrors the structural changes seen in competitive authoritarian regimes. Mass acquiescence is central; the populace welcomes the stability offered by strongman rule. Windrip's Fifteen Points of Liberty offer a populist platform that legitimises the subsequent authoritarianism, masking the erosion of rights as a restoration of order. The media is co-opted early, with newspapers forced into line, a hallmark of competitive authoritarianism, though censorship quickly becomes total.

  However, the trajectory diverges from the gradualist model. The transformation is rapid, moving from election to dictatorship within months rather than years. The use of the Minute Men, an armed paramilitary force, introduces overt violence and intimidation that exceeds the legalistic erosion typical of backsliding. While backsliding usually involves purging civil services through legal means, Windrip's regime employs open illegality, imprisoning opponents without trial and forcing exile. The climax involves a self-coup where the executive dissolves legislative opposition entirely, leaning closer to breakdown than retrogression. Specific episodes carry this weight. The inauguration scene signals the shift, where patriotic symbolism is hijacked for authoritarian ends. The treatment of the protagonist, Doremus Jessup, illustrates the transition from critic to fugitive; his newspaper is shut down not through regulatory pressure but by force. The exile of dissenters to concentration camps in the hinterlands demonstrates the complete removal of legal protections.

  The American setting matters profoundly. The novel posits that American exceptionalism is no shield, suggesting that the cultural prerequisites for fascism exist within US populism. The scenes depicting ordinary citizens joining the Corps for status or security illustrate how democratic norms are surrendered not just by elites but by the public. The corporatist reorganisation of the economy is presented not as a foreign import but as a logical extension of American efficiency cults. The speed suggests that once the threshold is crossed, the slide can become a plummet. The American context emphasises that constitutional resilience is dependent on political culture, not just text. The novel thus serves as a hybrid case: it begins as backsliding but accelerates into breakdown, challenging the line between the two. It captures the moment legal authority is weaponised, even if the subsequent collapse is too swift for the standard typology.

  Where the novel resists the concept

  The book sits awkwardly with a theory that has taught us to look for gradualism and legalistic erosion. Contemporary scholarship prioritises the stealthy rewiring of institutions, yet Lewis depicts a shock therapy of authoritarianism. On the scholarship's own terms, this is arguably a story of breakdown rather than backsliding. The rapid dissolution of Congress and the open use of paramilitary violence bypass the slow choking of checks and balances that defines constitutional retrogression. If backsliding is defined by the preservation of electoral facades, Windrip's regime abandons this pretence too quickly to fit the typology neatly.

  This suggests the novel is either the wrong case for the concept, or it exposes a blind spot in a framework that may have overcorrected against the coup. By focusing so heavily on gradualism, scholars might underestimate how quickly legalistic erosion can transition into overt dictatorship once a critical threshold is passed. In real cases like Hungary or Poland, the process has been slow, grinding down institutions over a decade. Turkey shows a faster trajectory, moving from reform to repression following a failed coup attempt. The United States presents concerns about norm erosion without full regime change. Windrip's America resembles none of these exactly; it is a catastrophic collapse masked as an election.

  However, dismissing the novel as an outlier risks ignoring the potential for acceleration. The framework's focus on gradualism might create a false sense of security, implying there is always time to react. Lewis suggests that once the demagogue is empowered, the slide can become a plummet. Thus, the novel challenges the field to account for velocity. It implies that backsliding is not always a slow burn; under conditions of severe crisis, it can be explosive. The theory often assumes a baseline of stability that is slowly undermined. Lewis assumes a baseline of vulnerability that is rapidly exploited. This does not invalidate the concept but demands it accommodate scenarios where legalistic mechanisms are merely the precursor to rapid breakdown. The novel forces the question of whether the distinction between backsliding and breakdown is analytical or merely temporal. If the end result is identical, does the speed matter for the definition? The novel argues that the outcome matters more than the pace, challenging scholars to look beyond the mechanism of erosion to the speed of collapse.

  What the novel adds

  Social science offers typologies and indices, but fiction provides the texture of complicity. The scholarship quantifies democratic decline, yet it struggles to capture the ordinary reasons people go along. Lewis shows that tyranny is not sustained solely by fear, but by convenience, careerism, and a genuine desire for order. The novel reveals the affective dimension of backsliding: the relief citizens feel when complex problems are simplified by a strongman. This is something datasets cannot record.

  Teaching the concept requires this human element. Students must understand that backsliding is not just a mechanical process of institutional weakening, but a social phenomenon rooted in everyday choices. The novel depicts neighbours informing on neighbours, not out of ideology, but for petty grievances or status. This micro-level view complements the macro-level analysis of executive aggrandizement. It suggests that the theory misses the cultural substrate that allows backsliding to take hold. The feeling from inside the regime is one of normalcy, not crisis, which explains the lack of resistance.

  Ultimately, the novel gets right what the theory misses: the banality of the transition. Theory looks for the break; fiction shows the blur. The regime feels normal to those inside it until it is too late. This should change how the concept is taught. It should not be presented merely as a checklist of institutional failures, but as a narrative of societal acquiescence. The novel insists that democracy dies not only because leaders kill it, but because citizens stop defending it. That is the insight the indices cannot provide. To understand backsliding, one must understand the human capacity for rationalisation. The novel forces the reader to confront their own potential for complicity, a question no index can ask.
