answer: |-
  An adequate explanation of norm evolution must account for equilibrium selection among arbitrary alternatives, intergenerational transmission without central enforcement, and sensitivity to population structure that allows for sudden collapse. It must distinguish between the functional benefits of a norm and the historical accidents of its origin, while explaining why agents internalize rules as binding commitments rather than calculating fresh incentives each time. Finally, it must model how false beliefs about a norm's history can function as stable inputs for decision-making rather than errors that get corrected by experience.

  ### Tier 1: Would trust to predict
  *   **Evolutionary game theory and replicator dynamics on coordination games:** This provides the formal mathematical backbone for modeling how arbitrary equilibria stabilize and shift under replication pressure.
  *   **Conformity bias and prestige bias in cultural transmission:** This explains the specific transmission mechanism that allows new cohorts to adopt norms without re-evaluating their original purpose.
  *   **Norm psychology, understood as innate dispositions to acquire, enforce, and feel guilt about local norms:** This accounts for the internal emotional enforcement that sustains the norm when external monitoring is absent.

  ### Tier 2: Useful but incomplete
  *   **David Lewis's account of convention as a regularity sustained by mutual expectation and a preference to conform conditional on others' conformity:** This correctly identifies the equilibrium structure but lacks a dynamic model for how conventions survive generational turnover.
  *   **Schelling focal points and salience as a selection device:** This explains why a specific arbitrary rule was selected initially but does not explain its persistence once the original salience fades.
  *   **Cultural group selection:** This explains cross-community variation and stability but is often too macro-level to predict specific local kitchen dynamics.
  *   **Third-party punishment and second-order punishment:** This explains stability through enforcement but struggles to account for the "illusion" aspect if punishment is not visibly active.
  *   **The inheritance illusion itself as a causal stabilizer, that is, misremembered consent doing explanatory work:** This identifies a specific cognitive mechanism for stability but requires a broader theory to explain why the illusion arises and persists.

  ### Tier 3: Mostly redescribes the phenomenon
  *   **Path dependence and increasing returns, or lock-in:** This labels the outcome of stability but does not identify the specific causal mechanisms of transmission or psychology.
  *   **Random drift and neutral cultural evolution:** This accounts for variation and change but cannot explain the local stability or the specific content of the normative expectation.

  ### Tier 4: Misleading if used alone
  *   **Legal centralization and formal institutions as ratifiers of prior norms:** This directly contradicts the premise that the norm persists without central authority or formal enforcement.
  *   **Repeated-game folk-theorem explanations, on which indefinite repetition sustains cooperation:** This assumes strategic calculation that undermines the psychological reality of the inherited commitment illusion.
  *   **Costly signaling and handicap-style accounts of norm adherence:** This misapplies a theory of honest signaling to a low-cost, arbitrary coordination rule that conveys no private information.
  *   **Norm entrepreneurs and deliberate moral innovation:** This focuses on deliberate change and leadership, whereas the target phenomenon relies on passive inheritance and false assumptions of past consent.

  **Complementarity and Competition:** Evolutionary game theory, conformity bias, and norm psychology are highly complementary, forming a complete chain of formal dynamics, transmission, and cognition. I would drop repeated-game folk theorems in favor of norm psychology, as the latter better explains the internalized obligation characteristic of the inheritance illusion, whereas the former implies ongoing strategic calculation. David Lewis's account is subsumed by evolutionary game theory for the purpose of predicting trajectories over time.

  ***

  **First, which single item would you keep if you could keep only one, and why?**
  I would keep evolutionary game theory because it provides the necessary formal vocabulary to integrate psychological biases and transmission dynamics into a predictive model of stability and collapse.

  **Second, which combination of two or three items gives the best account of the inheritance illusion.**
  The combination of evolutionary game theory, conformity bias, and norm psychology offers the best account, as it links the mathematical stability of the equilibrium to the specific cognitive and social mechanisms that transmit it across generations.

  **Third, what evidence would most likely force you to revise your ranking.**
  I would revise my ranking if empirical studies showed that the norm collapses without any change in group composition, suggesting that the stability relies on active punishment (Tier 2) rather than internalized psychology (Tier 1).

  **Confidence Statement:**
  I am highly confident in this ranking overall, as it aligns with the current consensus in philosophical social science regarding the synthesis of game theory and cultural evolution. The single point I am least sure of is the placement of "The inheritance illusion itself" in Tier 2 rather than Tier 3, as one could argue it is a causal mechanism rather than a mere redescription.
