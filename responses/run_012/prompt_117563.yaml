answer: |-
  You have identified a genuine and persistent structural problem in global historiography, and your intuition is correct: the standard label of "Eurocentrism" is too blunt an instrument for this specific mechanism. "Eurocentrism" usually denotes a *standpoint* (valuing Europe over others) or a *bias* (preferring European sources), whereas you are describing a *grammar of causality* that can persist even in texts that are explicitly critical of Europe.

  There is no single, universally canonical term that isolates this *exact* formal property independent of political sympathy. However, there are three existing concepts that circle it, and I will propose a precise term to capture the specific mechanism you have described.

  ### 1. The Existing Concepts (and why they fall short)

  **A. The "Impact-Response" Model (John King Fairbank)**
  *   **Definition:** Coined in the 1950s regarding Chinese history, this model posits that modern Chinese history is best understood as a series of reactions to Western "impact."
  *   **Why it fits:** It describes exactly the "hinge" you identified: pre-contact history is static/internal; post-contact history is reactive/external.
  *   **Why it falls short:** It is region-specific (China) and generally considered a dated historiographical framework that scholars now try to *avoid*. It is not used as a neutral descriptor of a narrative structure that appears in *other* contexts (e.g., West Africa or the Indian Ocean).

  **B. "Europe as the Sovereign Theoretical Subject" (Dipesh Chakrabarty)**
  *   **Definition:** In *Provincializing Europe*, Chakrabarty argues that even in postcolonial histories, Europe remains the "sovereign theoretical subject of all histories." Non-European histories are often treated as variations of a European experience (e.g., "Why didn't India have a Reformation?").
  *   **Why it fits:** It captures the asymmetry where European developments have internal theoretical weight, while others are significant only in relation to Europe.
  *   **Why it falls short:** This is a philosophical critique of *historicism* and political theory, not a precise label for the *narrative distribution of causal weight* in a historical account.

  **C. "Eurocentric Diffusionism" (James Blaut)**
  *   **Definition:** The assumption that all major innovations originate in Europe (or the West) and diffuse outward to passive recipients.
  *   **Why it fits:** It addresses the denial of internal innovation post-contact.
  *   **Why it falls short:** As you noted, the pattern you see survives in accounts that *reject* diffusionism. An author can acknowledge African inventions but still structure the *causal narrative* such that those inventions only matter as responses to European arrival.

  ### 2. The Proposed Term: **Causal-Agentive Asymmetry**

  Since no existing term precisely isolates the *formal distribution of causal weight* anchored to the *moment of contact*, I propose the term **Causal-Agentive Asymmetry** (anchored by **The Contact Hinge**).

  This term separates the *structure* of the argument from the *sympathy* of the author. It allows you to identify the feature in a text that is fiercely anti-imperialist but structurally reproduces the dynamic you described.

  #### Definition
  **Causal-Agentive Asymmetry** is a narrative structure in which the attribution of **internal causality** (agency, innovation, dynamic change) and **external causality** (reaction, adaptation, obstruction) is distributed unevenly between geopolitical actors, contingent upon a specific **Contact Hinge**.

  #### Diagnostic Criteria (When it is present)
  To determine if a narrative exhibits this feature, check for these three structural markers:

  1.  **The Contact Hinge (Periodization):**
      *   *Present:* The narrative timeline is bifurcated by the moment of sustained European contact.
      *   *Absent:* The narrative treats contact as one event among many, or prioritizes internal periodization (e.g., dynastic cycles, ecological shifts) that continues uninterrupted across the moment of contact.

  2.  **The Locus of Initiation (Agency):**
      *   *Present:* Post-contact, significant historical changes in the non-European society are initiated by European actions (arrival, trade demands, colonization). Local actors are framed as *responding* (resisting, adopting, collaborating).
      *   *Absent:* Post-contact changes are shown as emerging from pre-existing local tensions, where European contact is merely a new variable in an internal equation.

  3.  **The Locus of Explanation (Causality):**
      *   *Present:* European actions are explained by *internal* European dynamics (e.g., "The British sought cotton due to industrial pressures"). Non-European actions are explained by *external* pressures (e.g., "The Indians grew cotton because the British demanded it").
      *   *Absent:* Both sides are granted internal causal explanations for their actions, even when those actions are interactive.

  ### 3. Distinguishing from Confusable Concepts

  You asked to separate this from things that resemble it but are not it.

  | Concept | Resemblance | Distinction |
  | :--- | :--- | :--- |
  | **Teleology** | Both imply a direction to history. | Teleology is about the *end goal* (e.g., "History moves toward democracy"). **Causal-Agentive Asymmetry** is about the *source of motion*. A narrative can be non-teleological (no end goal) but still asymmetrical (Europe pushes, others move). |
  | **Bias / Sympathy** | Both skew the portrayal of actors. | Bias favors one side morally. **Asymmetry** favors one side *ontologically*. An author can morally condemn Europe while structurally granting it all the agency (e.g., "Europe destroyed everything" still makes Europe the only actor). |
  | **Inclusion / Exclusion** | Both affect whose story is told. | You can include every non-European episode and still have **Asymmetry**. If those episodes are framed solely as reactions to European moves, the connective tissue remains asymmetrical. |
  | **World-Systems Theory** | Both describe Core/Periphery dynamics. | World-Systems is an *economic model*. **Asymmetry** is a *narrative form*. A historian can reject World-Systems Theory but still write a narrative where Europe acts and the Periphery reacts. |

  ### 4. Is it a Bundle of Distinct Things?

  You asked if this is really two or three things bundled together. It is helpful to disentangle them, as a text might exhibit one without the others.

  1.  **Periodic Bifurcation:** The timeline is cut in two by contact. (A text can do this without asymmetry if both sides are treated as reacting to the encounter mutually).
  2.  **Causal Externality:** The non-European society is denied internal causes for change *after* contact. (This is the core of your observation).
  3.  **Subject-Object Grammar:** Europe is the grammatical subject ("Europe expanded"); the non-European society is the object ("The Kingdom was opened").

  **Causal-Agentive Asymmetry** specifically refers to the combination of **Causal Externality** anchored by **Periodic Bifurcation**.

  ### Summary Recommendation

  If you need to reference this in writing or analysis, I recommend using the phrase **Causal-Agentive Asymmetry**.

  *   **Usage:** "While this account avoids overt Eurocentric bias, it relies on a **causal-agentive asymmetry** anchored at the Contact Hinge; Indian Ocean merchants are granted internal dynamics until 1500, after which their trajectory is explained solely as a response to Portuguese intervention."
  *   **Why:** It signals that you are critiquing the *mechanics of the explanation*, not the *politics of the author*. It precisely names the "uneven attribution of causal weight" you identified.

  This phenomenon is the structural ghost of colonialism that remains in the machine even after the ideology has been removed. Naming it **Causal-Agentive Asymmetry** allows you to point at the machine's gears rather than just the operator's intent.
