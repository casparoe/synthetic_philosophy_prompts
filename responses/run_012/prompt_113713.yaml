answer: |-
  The requirements cannot be jointly satisfied within a monistic framework because the condition that grants standing in cases of hypocrisy contradicts the condition required for cases of complicity and institutional critique.

  ### Specification of Desiderata

  1.  **The Parity Constraint**
      *   **Case:** (a) The Hypocritical Colleague.
      *   **Requirement:** A theory must explain why committing the same wrong defeats standing, whereas committing a different wrong does not.
      *   **Motivation:** To distinguish *tu quoque* (which defeats standing) from general fallibility (which does not); without this, all blame is silenced by universal imperfection.

  2.  **The Acknowledgment Condition**
      *   **Case:** (b) The Reformed Wrongdoer.
      *   **Requirement:** A theory must specify whether standing is permanently lost or restorable through acknowledgment and repair.
      *   **Motivation:** To accommodate moral growth; if standing is never restored, the theory punishes repentance more than persistent wrongdoing.

  3.  **The Relationship Threshold**
      *   **Case:** (c) The Stranger / (d) The Complicit Participant.
      *   **Requirement:** A theory must distinguish between blame lacking standing due to lack of relationship (busybody) and blame lacking standing due to shared culpability (complicity).
      *   **Motivation:** To capture the intuition that some wrongs are "none of your business" while others are "especially your business" because you helped cause them.

  4.  **The Power Asymmetry Clause**
      *   **Case:** (e) The Institutional Blamer.
      *   **Requirement:** A theory must account for how structural power affects standing, specifically whether an entity can blame individuals for harms the entity itself systemicallly perpetuates.
      *   **Motivation:** To prevent standing from becoming a tool of oppression where powerful actors immunize themselves from critique by pointing to their own authority.

  5.  **The Content Independence Principle**
      *   **Case:** (f) The Insufferable Truth-Teller.
      *   **Requirement:** A theory must separate standing from the truth of the blame or the politeness of its delivery.
      *   **Motivation:** To ensure standing is a normative authority condition, not an epistemic accuracy condition or a matter of etiquette; one can have standing to be rude, or lack standing while being right.

  6.  **The Reflexivity Condition**
      *   **Case:** (g) Self-Blame.
      *   **Requirement:** A theory must explain whether one can lack standing to blame oneself (e.g., due to self-deception) or if standing is automatic in the first-person case.
      *   **Motivation:** To account for the phenomenology of guilty conscience versus pathological self-flagellation.

  7.  **The Normative Force Requirement**
      *   **Case:** All cases, specifically your dispute.
      *   **Requirement:** A theory must determine whether lacking standing makes the act of blaming morally impermissible or merely conversationally infelicitous.
      *   **Motivation:** To establish the stakes of the objection; if it is merely infelicitous, the blamer may continue; if impermissible, they are doing wrong.

  8.  **The Modality Constraint**
      *   **Case:** Your intuition on kinds vs. degrees.
      *   **Requirement:** A theory must adjudicate whether standing is binary (you have it or you don't) or modal (you have it for private resentment but not public sanction).
      *   **Motivation:** To capture the nuance where a hypocrite may resent a wrong but not demand restitution.

  ### Constitutive vs. Camp Commitments

  *   **Constitutive:** The **Content Independence Principle** is constitutive of the phenomenon. If standing depended on the truth of the accusation, it would collapse into correctness; if it depended on tone, it would collapse into etiquette. Standing must be about the *agent's relation to the norm*, not the *proposition's truth*.
  *   **Camp Commitment:** The **Normative Force Requirement** is a commitment of the "Moral Authority" camp (e.g., Bell, Fritz). The "Conversational" camp (e.g., Todd, Miller) treats standing as a condition for uptake rather than permissibility. Adopting the Moral Authority view makes standing objections weightier but harder to satisfy; adopting the Conversational view makes them easier to satisfy but easier to ignore.

  ### Flagged Incompatibility

  The **Parity Constraint** (Hypocrisy defeats standing) and the **Power Asymmetry Clause** (Institutions/Complicit actors retain standing) cannot be jointly satisfied under a single principle of "moral cleanliness."
  *   **Reasoning:** If moral cleanliness (lack of similar fault) is required for standing (to satisfy the Parity Constraint), then institutions and complicit actors (who are invariably dirty) lose standing (violating the Power Asymmetry Clause). If moral cleanliness is not required (to allow structural critique), then hypocrisy does not defeat standing (violating the Parity Constraint). A theory must either accept that hypocrisy does not negate standing (weakening your objection to your colleague) or accept that structural critique is often impermissible (weakening social justice claims).

  ### View-Ruling-Out Requirement

  The **Normative Force Requirement** (specifically the verdict that lack of standing makes blame *impermissible*) does the most to rule out actual views.
  *   **Reasoning:** Most folk morality and many pragmatic theories treat standing as a matter of efficacy or prudence ("you won't be listened to"). Insisting that lack of standing makes blame *wrong* rules out pragmatic, consequentialist, and purely conversational accounts, forcing a deontic account of moral authority that many find too rigid for complex social interactions.

  ### Verdicts on Further Questions

  **1. Kinds vs. Degrees:**
  A unified account cannot hold this together without pluralizing the concept of standing. You must accept **Standing Pluralism**: there is *reactive standing* (to feel resentment) and *administrative standing* (to demand accountability). Your colleague may lack administrative standing to demand you work harder because of his hypocrisy, but retain reactive standing to feel annoyed. Treating these as one binary switch collapses the nuance you require.

  **2. Wrong vs. Out of Place:**
  Lack of standing makes blame **out of place**, not inherently **wrong**, unless the blamer uses the blame to manipulate or dominate.
  *   **Reasoning:** If lack of standing made blame *wrong*, then the hypocrite's blame would be a second moral violation, escalating the conflict indefinitely. Treating it as *out of place* (infelicitous) means the blame fails to land normatively—it does not create an obligation for you to respond—without making the colleague a villain for speaking. This resolves your dispute: you are not obligated to accept his blame, but you are not entitled to punish him for voicing it. This distinction protects you from his demands without committing you to a crusade against his character.
