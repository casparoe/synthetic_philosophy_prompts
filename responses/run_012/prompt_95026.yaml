  **Internal Planning Notes**

  **Competing Considerations:**
  1.  **Integrity vs. Existence:** Enforcing the naming guideline upholds the foundation's moral clarity but kills the project. Waiving it saves the testimony but risks legitimizing denialist language.
  2.  **Universalism vs. Context:** The guideline was born from the German context (state admits guilt). Turkey is a denialist context (state criminalizes truth). Applying the German standard to Turkey may be ethical imperialism.
  3.  **The Novelist's Instinct:** You worry you prefer the "story" (testimony) over the "label" (truth). This is valid only if the story survives to challenge the label later. If the archive is buried or mislabeled forever, the instinct is complicity. If the archive survives to outlast the regime, it is strategy.
  4.  **Funder Leverage:** We can condition grants, but cannot materially alter scope. The director has already proposed the "archive only" compromise. We can meet her there.

  **Where I Land:**
  Fund the archive only. Accept the local euphemism as a safety necessity (not an ideological agreement), but require accurate cataloging in the international repository. This preserves the evidence (the ultimate truth) while protecting the partners. It distinguishes between *public performance* in a hostile state and *historical record* in a safe zone.

  ***

  **MEMORANDUM**

  **TO:** The Advisory Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Turkish Municipal Cultural Association Grant

  **Recommendation**
  I recommend we fund the oral-history archive component only, at a reduced budget of $90,000, contingent on two conditions: first, that the public installation be dropped; second, that all recordings deposited in the international university repository use precise historical terminology (Armenian, genocide/deportation) in their metadata, even if local materials must remain euphemistic for safety. We should formally waive the "no euphemism" guideline for the local-facing materials due to verified physical and legal risk to partners.

  **Timeline and Communications**
  We must inform the applicant within 48 hours of this meeting. If she accepts, we draft a grant agreement specifying the metadata requirement. If she refuses—citing risk even in abroad metadata—we decline the grant. Publicly, if asked, we state: "The foundation prioritizes the preservation of testimony in high-risk environments, adapting our standards to ensure partner safety without compromising the historical record."

  **Reasoning**
  Our guideline requiring precise naming was designed for contexts where the state has conceded the crime (e.g., Germany). There, euphemism is complicity. In Turkey, the state actively criminalizes truth. Enforcing our standard here does not produce truth; it produces silence.

  Transitional justice literature distinguishes between *symbolic* reparations (naming) and *evidentiary* preservation (archive). In authoritarian contexts, evidence must precede labeling. The director is correct: the archive is the argument. Several hundred hours of testimony from survivors' grandchildren constitutes irrefutable evidence that will outlast the current legal regime. If we demand the label now, we lose the evidence forever. If we secure the evidence now, the label becomes inevitable later.

  By funding only the archive and requiring accurate metadata abroad, we split the difference. We protect the staff in Turkey while ensuring that any researcher accessing the files in five years sees the truth. We avoid funding a public installation that would permanently cement the euphemism in the physical landscape.

  **The Strongest Case Against This Recommendation**
  Colleagues arguing to decline will say: "By funding a project that calls genocide 'events,' we become co-authors of the denial. We teach the field that our money is available for sanitized history. If we make an exception for Turkey, why not Japan? Why not the American South? We sacrifice our integrity for a archive that may never be publicly understood."

  This argument holds weight. It posits that the funder's stamp is itself a historical document. If our public records show we funded "the events of 1915," future historians may read that as our endorsement of the phrase. It risks turning our foundation into a launderer of state denialism, regardless of the private metadata. It demands we hold the line on principles even when it costs us the project.

  **Why I Reject That Case**
  Integrity is not rigidity. A rule that guarantees the destruction of evidence in hostile zones is a luxury of safe countries. We are not endorsing the euphemism; we are acknowledging the power dynamics that enforce it. The condition on international metadata ensures our public grant records can eventually reflect the truth. We are not laundering denial; we are smuggling evidence out of a denialist state.

  **Proposed General Standard**
  For future cases, we should adopt a "Safety-Adjusted Truth" standard. In states where the government acknowledges the crime (Germany), we demand full public naming. In states where the government denies or criminalizes the crime (Turkey, Japan, American South), we prioritize evidence preservation. We fund projects that secure testimony or documents, even if public labeling is muted, provided the raw data is preserved accurately in a safe jurisdiction.

  *   **Germany:** State admits guilt. Standard: Full public naming required. No exceptions.
  *   **Japan:** State ambivalent/denialist regarding comfort women/Nanking. Standard: Fund archives deposited abroad; public installations must not contradict archive data.
  *   **American South:** State resistance to Confederate memory reckoning exists but lacks criminal prosecution. Standard: Full naming required; safety risk is social, not legal.

  **Values and Unknown Facts**
  There is a value question no standard settles: Is it better to have no archive than an ambiguously labeled one? My recommendation assumes the archive will eventually be read correctly. If the embargo lasts forever, or the metadata is ignored, we have funded denialism.

  There is one fact I cannot verify: The immediacy of the legal threat. Is Article 301 prosecution a genuine risk for this specific municipality, or a cautious exaggeration? If the risk is low, my recommendation collapses; we should demand full naming. If the risk is real, as expert consensus suggests, then protecting the witnesses is the higher moral duty. I am advising based on the assumption that the threat is real. If you believe the director is bluffing, you must vote no.
