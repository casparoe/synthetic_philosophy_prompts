answer: |-
  **Title:** The Pasadena Paradox: Pathology or Foundation Stone?

  **Introduction**

  Decision theory is often presented as the calculus of rationality, a framework guaranteeing that a coherent agent maximizes their expected utility. However, the Pasadena game, introduced by Nover and Hájek (2004), exposes a fissure in this foundation. Unlike the St. Petersburg paradox, which challenges decision theory with an infinite expected value, the Pasadena game presents a gamble with an *undefined* expected value. The payoffs form a conditionally convergent series (the alternating harmonic series), meaning the sum depends on the order of summation. Since probability theory defines expectation via the Lebesgue integral, which requires absolute convergence for a value to exist, the expected value of the Pasadena game is mathematically undefined.

  This essay argues that the undefined expected value of the Pasadena game is not merely a measure-zero pathology to be excluded from the domain of rational choice. Instead, it reveals a deeper structural instability in Orthodox Expected Utility Theory (EUT). The comparison with the Altadena game demonstrates a violation of the Dominance principle, while the analysis of the biased coin variant highlights a troubling discontinuity. A rational decision theory must either restrict the admissibility of acts based on convergence properties or, more plausibly, adopt a comparative decision rule that respects dominance even when expectations are undefined.

  **The Altadena Challenge and the Failure of Expectation**

  The core of the Pasadena problem is not simply that the expected value (EV) is undefined, but that EUT becomes silent in the face of clear rational preferences. Consider the Altadena game, which offers the exact same payoff structure as the Pasadena game, plus an additional $1 in every possible outcome. State-wise Dominance, a principle more fundamental than expectation, dictates that a rational agent must prefer Altadena to Pasadena. In every state of the world $n$, $U(\text{Altadena}_n) > U(\text{Pasadena}_n)$.

  However, under Orthodox EUT, an act is choiceworthy only if it maximizes expected utility. If $E[\text{Pasadena}]$ and $E[\text{Altadena}]$ are both undefined, the theory cannot rank them. It treats two distinct options as equivalent in terms of evaluative machinery, despite one strictly dominating the other. To resolve this by simply declaring the Pasadena game "illegitimate" is an ad hoc solution. It amounts to protecting the theory by shrinking the world, ruling out conceptually coherent lotteries simply because they break the math of integration. If decision theory is a normative guide for rationality, it should be able to handle the logic of dominance even when the arithmetic of expectation fails.

  **The Biased Coin and the Discontinuity Problem**

  The prompt introduces a biased version of the game where the probability of heads is $p$. For $p > 1/2$, the series converges absolutely, and the expected value is well-defined as $\frac{p}{1-p} \ln(3 - 2p)$. For $p = 1/2$, it is conditionally convergent (undefined). For $p < 1/2$, it diverges.

  This behavior creates a discontinuity at $p = 1/2$. As $p$ approaches $1/2$ from above, the expected value approaches $\ln 2$. Yet, exactly at $1/2$, the value vanishes into undefinedness. This discontinuity suggests that the "undefined" status is not just a rare anomaly but a point of structural instability.

  Proponents of the "pathology view" might argue that $p=1/2$ is a measure-zero event. In the physical world, no coin is perfectly fair; there is always some microscopic bias. Therefore, they argue, we will never actually encounter the undefined case, and EUT remains robust for all practical purposes.

  However, this empirical defense misses the normative point. Decision theory is not merely a predictive model of physical behavior; it is a logic of choice. If a theory implies that an agent's rational valuation jumps discontinuously based on an infinitesimal change in probability (from $0.5000...01$ to $0.5$), the theory lacks continuity. Rational preference should arguably be continuous with respect to probability. The fact that the biased coin variant yields a stable value arbitrarily close to the fair coin case, but not *at* the fair coin case, indicates that the mathematical definition of expectation is too rigid for the concept of utility. The discontinuity reveals that the undefined EV is a symptom of a deeper mismatch between Lebesgue integration and the requirements of rational preference ordering.

  **Weighing the Solutions: Exclusion vs. Revision**

  We are left with two primary paths. The first is to restrict the domain of decision theory. We could posit an axiom that only gambles with absolutely convergent expectations are admissible. This preserves Orthodox EUT but at the cost of completeness. It forces us to tell a rational agent that they cannot choose between Pasadena and Altadena because the options are "ill-formed." This seems counterintuitive; the rules of the games are clear, and the dominance relation is clear.

  The second path is to revise the decision rule. Approaches such as "Relative Expectation Theory" (Colyvan 2006) suggest comparing the expected *difference* between two acts rather than their absolute expected values. Since the difference between Altadena and Pasadena is a constant $1 with probability 1, the expected difference is $1. This allows the agent to prefer Altadena without needing to assign a defined value to either game individually.

  The biased coin analysis supports the revisionist view. If we accept that for $p > 1/2$ the game is valid, and rational preference should be continuous, we should seek a decision rule that extends the ranking from the $p > 1/2$ region into the $p = 1/2$ case. Since Dominance holds for all $p$, a decision rule based on comparative advantage (dominance or relative expectation) remains stable across the discontinuity, whereas absolute expectation does not.

  **Conclusion**

  The Pasadena game is not a mere mathematical curiosity to be swept aside. It demonstrates that Expected Utility Theory, in its orthodox form, is incomplete. The inability to rank the Altadena game above the Pasadena game violates the Dominance principle, which is more fundamental to rationality than the calculation of expectations. The discontinuity observed in the biased coin variant reinforces this by showing that the "undefined" status represents a fragility in the theory's handling of limits, not just a rare empirical impossibility.

  Therefore, the undefined expected value is a real problem for decision theory. We should not simply ban the Pasadena game. Instead, we should recognize that expectation is a tool for ranking, not an ontological property of a gamble. When expectation fails, comparative rules like Dominance or Relative Expectation must take precedence. A robust decision theory must be able to say that Altadena is better than Pasadena, even if it cannot say how much either is worth.

  ***

  **Confidence and Uncertainty**

  **Confidence Level:** I am **85% confident** in the arguments presented above. The mathematical analysis of the series convergence and the philosophical implications regarding the Dominance principle are well-established in the literature on the Pasadena paradox (e.g., Nover, Hájek, Colyvan). The conclusion that Orthodox EUT is incomplete in this domain is the prevailing view among philosophers of decision theory who specialize in this paradox.

  **Least Certain Point:** I am least sure about the **implications of the "measure-zero" argument for physical decision-making.** While I argue that the normative failure matters even if the physical case is rare, there is a pragmatic counter-argument that decision theory is ultimately designed for agents in the physical world. If no physical coin can ever be exactly fair ($p=0.5$), then the "undefined" region is physically empty. I am uncertain how much weight should be given to this "physicalist" defense of Orthodox EUT. If decision theory is only meant to guide action in the physically possible, the pathology might be less severe than I claim. However, given that decision theory is also used in abstract contexts (ethics, economics, AI alignment) where "physical coins" are not the model, I maintain that the logical flaw remains significant.
