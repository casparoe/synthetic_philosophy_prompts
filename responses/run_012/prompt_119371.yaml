answer: |-
  Your distinction between message-constituted and message-independent harms is a powerful heuristic, and it captures a significant intuition underlying First Amendment jurisprudence and institutional speech codes. However, if we test it rigorously against the actual architecture of the law, the distinction does not hold as a necessary condition for regulation. The practice presupposes a theory of harm that is more complex than your binary suggests—one that blends Millian consequentialism with a relational theory of rights and duties.

  Here is a reconstruction of the implicit theory presupposed by current practice, an analysis of where your distinction fits and where it fractures, and a projection of what would change under a strictly Millian regime.

  ### 1. Testing the Hypothesis: Message-Constituted vs. Message-Independent

  Your hypothesis is that the law permits regulation only of **message-independent harms** (speech as a tool/trigger for an injury that could occur otherwise) while protecting **message-constituted harms** (injury inherent in the communicative content, like offense or dignitary wounding).

  **Where the hypothesis fits:**
  This tracks well with *incitement* and *fraud*.
  *   **Incitement:** Under *Brandenburg v. Ohio*, speech is regulable only when it is directed to producing imminent lawless action. The harm is the violence or disorder, not the idea advocated. The speech is merely the spark; the fire could theoretically be lit another way.
  *   **Fraud and Perjury:** The harm is financial loss or the obstruction of justice. The lie is the mechanism, but the injury (loss of money, wrongful conviction) is conceptually separable from the semantic content.
  *   **True Threats:** While the fear is generated by the meaning, the law treats threats as a form of intimidation akin to physical assault. The harm is the disruption of the victim's security and peace, a tangible interest distinct from the "idea" of the threat.

  **Where the hypothesis fails:**
  The doctrine regulates several categories of speech where the harm is undeniably message-constituted.
  *   **Defamation:** This is the strongest counter-example. The injury to reputation occurs *only* because a specific proposition is communicated and believed. You cannot damage someone's reputation "another way" without communication. Yet, defamation is not protected speech (subject to *New York Times v. Sullivan* standards). Here, the law acknowledges a dignitary/proprietary interest in one's social standing that outweighs the speaker's liberty, directly contradicting the idea that message-constituted harms are immune to regulation.
  *   **Obscenity:** Under *Miller v. California*, obscenity is unprotected. The "harm" here is notoriously vague—often framed as moral decay or offense to community standards. This is deeply message-constituted; the "injury" is the consumption of the content itself. If your hypothesis were correct, obscenity should be protected (as it causes no tangible, message-independent injury like violence or theft).
  *   **Copyright Infringement:** This is speech regulation based on the unauthorized use of a message. The harm is the economic loss to the creator, which is entirely dependent on the communication of the specific work.

  **Verdict:** The practice does not strictly require harms to be message-independent. It permits regulation of message-constituted harms when they violate specific, recognized property or dignity interests (reputation, copyright) or community moral standards (obscenity).

  ### 2. Reconstructing the Implicit Theory of Harm

  If the message-constituted/independent distinction is not the governing logic, what is? The practice presupposes a **Hybrid Theory of Contextual Autonomy and Tangible Injury.**

  This theory rests on three pillars:

  **A. The Presumption of Counter-Speech (The Millian Baseline)**
  The default position is Millian: speech should be met with more speech. Regulation is an exception. This explains why racial slurs, blasphemy, and atrocity denial are protected in the public square. The law assumes that in the "marketplace of ideas," the remedy for false or offensive speech is correction or social ostracization, not state sanction. The harm here is considered *psychic* or *ideological*, which the state deems itself incompetent to adjudicate.

  **B. The Captive Audience and Relational Duty (The Contextual Wrinkle)**
  This explains the workplace/school vs. street distinction you noted. The implicit theory here is **relational**.
  *   **Public Street:** Citizens are presumed to be autonomous agents with the capacity to avert their eyes or walk away. The relationship is one of co-equals in a public forum.
  *   **Workplace/School:** The relationship is hierarchical or captive. An employee cannot simply "walk away" from a harassing supervisor without risking their livelihood. A student cannot easily avoid a hostile classroom environment without sacrificing education.
  *   **The Harm:** In these contexts, the harm is not just the message, but the **violation of a reasonable expectation of safety and equal access**. The speech functions as a mechanism of discrimination or exclusion. The law regulates not because the message is false or offensive, but because the *context* turns the speech into a barrier to participation in economic or educational life.

  **C. The Instrumental/Conduct Equivalence**
  The law regulates speech when it functions indistinguishably from non-speech conduct.
  *   **Perjury/Fraud:** Speech as a tool of theft or obstruction.
  *   **Threats:** Speech as a weapon of fear.
  *   **Incitement:** Speech as a command signal for violence.
  In these cases, the "speech" element is secondary to the "act" element.

  **Summary of the Implicit Theory:**
  The practice presupposes that harm justifies regulation only when:
  1.  The speech creates a **tangible, secular injury** (violence, financial loss, obstruction of justice); OR
  2.  The speech violates a **specific relational duty** that guarantees equal access to institutions (harassment); OR
  3.  The speech infringes on a **recognized private right** (reputation, copyright).

  Mere offense, ideological distress, or dignitary wounding in the public sphere are *not* sufficient harms.

  ### 3. Incompatibilities and Underdetermination

  Several parts of the practice are philosophically unstable or presuppose incompatible commitments.

  **The Obscenity Outlier:**
  Obscenity doctrine is the most philosophically vulnerable. It presupposes a **Legal Moralism** that is incompatible with the Millian Harm Principle. Mill explicitly argues that society cannot regulate conduct (or speech) merely because it is offensive or immoral; there must be harm to others. The continued existence of the obscenity exception suggests the law retains a pre-liberal commitment to enforcing public morality, which sits uneasily alongside the robust protection of hate speech. This is an incompatibility: the law protects speech that wounds dignity (hate speech) but bans speech that wounds "morality" (obscenity).

  **Defamation vs. Hate Speech:**
  There is a tension here regarding dignitary harm. Defamation law admits that words can injure a person's social standing enough to warrant compensation. Hate speech (in the U.S. doctrine) denies this. The underdetermined question is: *Why is reputation a protectable interest, but racial dignity is not?*
  *   *Current Justification:* Reputation is a form of property; racial dignity is an ideological contest.
  *   *Critique:* This distinction is thin. Both involve social standing. The practice fits comfortably with a commitment to unrestricted political discourse, but it strictly requires no such distinction. A system could logically protect reputation while banning racial slurs, or vice versa.

  **Harassment and the "Severe or Pervasive" Standard:**
  In employment law, speech is actionable only if it creates a "hostile environment" that is "severe or pervasive." This is underdetermined. It implies that a certain *quantity* of message-constituted harm transforms it into a tangible harm (loss of employment conditions). It presupposes a threshold theory of psychological injury that is empirically vague.

  ### 4. What Would Change Under a Strictly Millian Theory?

  If we replaced the current hybrid practice with a straightforwardly Millian one—where regulation is permitted *only* to prevent distinct, non-message-bound injury to a person's security or interests (the Harm Principle strictly applied)—the landscape would shift dramatically.

  **1. Obscenity Would Be Protected:**
  Since the consumption of obscene material does not necessarily cause tangible harm to others (assuming no exploitation in production), a strict Millian view would protect it. The "moral decay" argument is paternalistic, which Mill rejects.

  **2. Defamation Would Be Narrowed:**
  Mill might allow defamation regulation only upon proof of *specific financial loss*, not general reputational damage. The current law allows for presumed damages in some cases. A strict Millian view would treat reputation as an interest only insofar as its loss leads to tangible setbacks in security or livelihood, not merely social embarrassment.

  **3. Harassment Law Would Tighten:**
  Current "hostile environment" jurisprudence regulates speech that creates an intimidating atmosphere, even without tangible economic loss. A strict Millian view would likely require proof that the speech directly caused a specific setback to the victim's interests (e.g., quitting the job, failing the class) rather than the subjective feeling of hostility. The "relational" duty would be weaker; the focus would return to the individual's security.

  **4. True Threats Would Remain, Incitement Might Shift:**
  Threats cause fear, which is a psychological injury affecting security. Mill accepts this. Incitement would likely remain regulable, but the *Brandenburg* standard of "imminence" might be replaced by a probabilistic assessment of harm. Mill is concerned with the *consequence*, not necessarily the *timing*, provided the link is clear.

  **5. Privacy and "Private Information":**
  You mentioned some categories of private information are regulable (e.g., doxxing, certain revenge porn statutes). A strict Millian view would support this only if the disclosure leads to harassment or physical danger. If the harm is merely "embarrassment" or "loss of privacy" as an abstract good, Mill might protect the publication. The current practice protects privacy as an intrinsic interest; a Millian practice would protect it only instrumentally.

  ### Conclusion

  Your distinction between message-constituted and message-independent harms is a useful diagnostic tool, but it is not the engine of the doctrine. The practice does not ban speech because the harm is message-independent; it bans speech when the harm is **tangible, secular, and non-remediable by counter-speech**, or when the **context creates a duty of care** that speech violates.

  The implicit theory is not purely Millian. It is a **Liberal-Relational Theory**. It accepts Mill's skepticism of regulating ideas but rejects his skepticism of regulating social roles. It assumes that while you have a right to speak on the street, you have a duty not to discriminate in the workplace.

  If you were to impose a strictly Millian theory on this practice, you would purge the moralism of obscenity law and tighten the dignitary protections of defamation and harassment law. The result would be a sphere of expression that is wider in the moral and social realm but potentially narrower in the economic realm, as the justification for regulation would rest solely on demonstrable setbacks to individual interests rather than violations of communal norms or relational expectations. The "puzzle" you face arises because the law is trying to serve two masters: the Millian individual's right to liberty, and the citizen's right to equal standing in social institutions. These two masters do not always sing in harmony.
