      *   *Key Concept:* **Non-Communicative Impact vs. Communicative Impact.** The law tries to regulate speech when it functions as *conduct* or when the communicative impact violates a specific protected interest (reputation, safety) that outweighs the expressive value.
      *   *The "Context" Factor:* This suggests a theory of **Reasonable Expectation of Security/Autonomy**. On the street, you accept risk of offense. In the workplace, you have a right to non-discriminatory conditions.

