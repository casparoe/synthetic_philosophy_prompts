      *   *The Context Sensitivity:* The user is right that context matters (workplace vs. street). This aligns with "captivity" or "reasonable expectation of privacy/peace."
      *   *The Millian Connection:* Mill's Harm Principle requires harm to *others*. But Mill distinguishes between harm to interests and mere offense. Modern law tracks this but adds "dignitary" harms (defamation) and "institutional" harms (perjury).

