answer: |-
  Hey, I was hashing this out with David yesterday over coffee and we got stuck in the weeds on that ESP section of the 1950 paper, the part everyone usually skips or treats as a quaint period piece. You know how I feel about it, that I think it's actually a devastating methodological point that most readers miss, but David really pushed back hard. He thinks it's a rare moment where Turing's epistemic standards slipped and the whole thing collapses once you look at it closely. We went back and forth for about an hour and I wanted to write down the exchange while it was fresh, because I think it clarifies why that paragraph matters more than people give it credit for.

  I started by telling him that Turing seems to think the evidence for telepathy is strong enough that a reasonable person can't just dismiss it, which is why he says the imitation game should be run in a room that screens it out. I argued that this isn't just a weird aside, but a principled experimental control. If you don't screen for it, you aren't testing intelligence, you're testing psychic capacity. David immediately pushed back on that. He said it looks less like a control and more like Turing quietly admitting his test only measures the thing he wants if you first stipulate away a channel that real minds might use. He asked me if excluding it is arbitrary. If humans are telepathic and machines could theoretically be too, why ban it? If the test is about indistinguishability, and humans use ESP to win, then a machine that can't use ESP is at a disadvantage not because it's less intelligent, but because it's less equipped. By screening it out, Turing is rigging the game to favor the machine's limitations rather than testing pure cognition.

  I told him that's exactly why the control is necessary, though. If ESP is a confounding variable, you have to isolate it. It's like controlling for noise in a server room. You don't say the test is arbitrary because you soundproofed the booth. But David leaned in on the asymmetry of it. He brought up the point that if the interrogator can read the machine's mind, or the machine can read the interrogator's, it's unclear who that helps. Turing seemed to think it favored the machine in some setups, which David thinks is backwards. He asked me, if telepathy is real, wouldn't it make the game easier to pass for the human witness? If the interrogator can sense the human's anxiety or intent directly, the human becomes more transparent, not less. So if you screen it out, you're actually protecting the human from being too readable. David argued that telepathy would make the game harder to pass for the machine because the human would have an extra channel of communication that the machine lacks, unless you assume the machine can be built with ESP receivers, which moves the goalposts from computation to parapsychology.

  I tried to hold the line on the behaviorist logic. I said that even if ESP is real, the test is about the text interface. If ESP is real, does the whole behaviorist-flavored logic of the test fall apart? I argued that it doesn't, because the test is specifically about the information channel provided. If you introduce a channel that isn't reliably channeled through the text interface, you're no longer playing the imitation game. You're playing something else. But David hit me with the deeper question there. He asked, if ESP isn't real, what was Turing doing conceding it? Was he being generous to a fringe view for rhetorical reasons, or did he genuinely believe the stats? David thinks Turing was being too charitable to the Rhine experiments of the time, and that by treating ESP as a live possibility, he undermines the physicalist basis of the computing machine. If the mind relies on ESP, then a computational model of the mind is incomplete by definition. So by bracketing ESP, Turing is basically saying, let's assume the mind is a machine for the duration of this test, which begs the question.

  I told him that's where I think this section tells us something about Turing's actual metaphysics of mind. I don't think he was just being rhetorical. I think Turing was a pragmatist about ontology. If the statistics say ESP exists, then it exists for the purpose of the experiment. It tells us he wasn't a dogmatic physicalist. He was willing to let the data drive the metaphysics. If the data says there's telepathy, then the imitation game needs a telepathy-proof room. David laughed and said that tells us nothing and we're all overreading a paragraph. He thinks it's just a footnote to avoid criticism from skeptics who would say, what if the computer is just guessing via telepathy? Turing was covering his bases, not making a metaphysical claim. He said if you look closely, the whole thing collapses because if ESP were real, the concept of a closed computational system is wrong. You can't have a Turing Machine that takes input from a non-physical channel. So by including it, Turing is admitting the test only works in a universe where ESP is negligible, which means he's assuming the conclusion he's trying to prove, that the mind is computational.

  We kept circling back to whether telepathy would make the game easier or harder to pass. I maintained that if the human can use telepathy to convey identity, the machine is disadvantaged, so screening it out levels the playing field. David countered that if the interrogator can use telepathy to detect the human, the human is disadvantaged, so screening it out protects the human. He said the asymmetry shows that Turing hadn't thought it through. If ESP helps the interrogator distinguish, you screen it out to help the witness. If ESP helps the witness distinguish themselves, you screen it out to help the interrogator. Turing treats it as a noise factor, but David says it's a signal factor. If it's a signal, removing it changes the nature of the mind being tested. I told him that's why it's a methodological insight. Turing is saying that intelligence is what remains when you strip away the magic. If there is magic, strip it. If there isn't, you haven't lost anything. It's a robustness check. David said it's a fudge factor. It's Turing saying, I know my test assumes a materialist mind, but just in case the dualists are right, let's build a lead-lined room so we don't have to argue about it.

  In the end, I think the disagreement comes down to whether you see the test as defining intelligence or measuring it. If it's defining it, then ESP is irrelevant because intelligence is what the test measures. If it's measuring it, then ESP is a confound. I think Turing knew it was a definition, but he wanted it to look like a measurement to satisfy the skeptics. David thinks Turing genuinely thought ESP might be real and wanted to account for it, which makes the computational model of the mind weaker. We didn't resolve it, but I think the fact that he included it at all shows he was more open to non-computational aspects of mind than people give him credit for, even if he wanted to bracket them for the sake of the argument. David still thinks it's a slip, a moment where the rigor wavered because he was trying to appease the parapsychology crowd of the 1940s. I told him that even if it was appeasement, the methodological move holds up. You have to control for variables even if you think they're zero, just to prove they're zero. David said controlling for a variable you think is zero is fine, but controlling for a variable that would invalidate your entire ontology if it turned out to be non-zero is just hedging. Anyway, I know you've been thinking about this too, so I wanted to get this down while the argument was still hot. Let me know if you think David's take on the asymmetry holds water, because I'm still turning that one over in my head.
