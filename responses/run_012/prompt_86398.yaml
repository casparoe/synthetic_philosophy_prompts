      *   *Section 5: Truthmaking and Insulation.* Is "primitive temporal location" doing work or hiding it? It hides the mechanism of instantiation. Perdurantism says: the part at $t$ is $F$. Adverbialism says: $O$ is $F$-ly at $t$. The critic asks: "In virtue of what?" If the answer is "nothing, it's primitive," it risks being an unexplained explainer. However, all views have primitives. The question is whether this primitive is *more* obscure than temporal parthood.
