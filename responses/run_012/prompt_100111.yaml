  # Activity Packet: The Black Box Asymmetry

  ## 1. Overview
  **Title:** The Decoding/Causal Gap
  **Time:** 90 Minutes
  **Participants:** 14 Graduate Students (4 Tables of 3-4)
  **Instructor Role:** The Oracle (Operator of the Black Box)
  **Goal:** To physically simulate the tension between *decodability* (information present in internal states) and *causal efficacy* (information used to generate output), leaving the ontological status of "representation" unresolved.

  ## 2. Materials & Preparation

  **For the Instructor (The Oracle):**
  *   **The Master Key:** A single sheet of paper kept hidden. This contains the true algorithm (see Section 3).
  *   **The Deck:** 50 Index Cards (3x5).
      *   Write numbers 0–9 on them (multiple copies).
      *   Label the back of every card with "STATE CARD".
  *   **The Envelopes:** 20 Large Manila Envelopes.
      *   Label them "QUERY RESULT".
      *   Inside each: 3 State Cards and 1 small slip labeled "OUTPUT".
      *   *Preparation:* Pre-fill 15 envelopes with valid Input/State/Output combinations based on the Master Key. Leave 5 empty for on-the-fly generation if needed.
  *   **Intervention Slips:** Small slips of paper for students to write "Clamp Requests" (e.g., "Force Card 2 to be 5").
  *   **Timer:** Visible to the class.

  **For Each Table (Research Lab):**
  *   **Lab Notebook:** 5 sheets of blank paper.
  *   **Input Tokens:** 10 small slips per table to submit Input Queries.
  *   **Score Sheet:** A printed grid to track Points.
  *   **Pens/Calculators:** Essential for decoding attempts.

  ## 3. The Secret Logic (Instructor Eyes Only)

  **The Input:** Two digits, $D_1$ and $D_2$ (Range 1–5).
  **The Internal State:** Three Cards ($C_1, C_2, C_3$).
  **The Output:** Binary ($0$ or $1$).

  **The Wiring (True Mechanism):**
  1.  **$C_1 = D_1$** (Direct copy. Highly legible).
  2.  **$C_2 = D_1 + 5$** (Redundant copy. Highly legible).
  3.  **$C_3$ depends on $D_2$:**
      *   If $D_2 \in \{1, 2, 3\}$, then $C_3 \in \{2, 4, 6\}$ (Even numbers).
      *   If $D_2 \in \{4, 5\}$, then $C_3 \in \{1, 3\}$ (Odd numbers).
      *   *Note:* The specific mapping is noisy/non-linear (e.g., $D_2=1 \to C_3=4$; $D_2=4 \to C_3=1$).
  4.  **Output Rule:** Output is $1$ if $C_3$ is **Odd**. Output is $0$ if $C_3$ is **Even**.

  **The Asymmetry:**
  *   **Feature X ($D_1$):** Perfectly decodable from $C_1/C_2$. **Causal Power: Zero.**
  *   **Feature Y ($D_2$):** Drives the Output via $C_3$. **Decodability: Low** (looks like random noise unless parity is spotted).

  ## 4. Roles & Briefing

  **Instructor (The Oracle):**
  *   You are the system. You do not explain *how* you generate the cards. You only accept Inputs and Intervention Slips and return Envelopes or Results.
  *   **Security:** Do not let students see the Master Key. Do not verbalize the math. If asked "Is Card 1 the input?", reply: "I can only return State and Output."

  **Students (Research Labs):**
  *   They are competing teams trying to secure a "Grant" by reverse-engineering the system.
  *   They do not know the True Mechanism.
  *   They are told: *"This system mimics a trained network. It takes inputs, forms internal states, and produces outputs. Your goal is to identify what the internal states represent."*

  ## 5. Rules & Order of Play

  **Phase 1: Observation (Decoding)**
  *   Labs submit an **Input Slip** ($D_1, D_2$).
  *   Instructor returns an **Envelope** containing the 3 State Cards and the Output Slip.
  *   Labs record the data. They may trade data with other labs.
  *   **Goal:** Find patterns. Can they predict Output from State? Can they recover Input from State?

  **Phase 2: Intervention (Causal Probing)**
  *   Labs submit a **Clamp Request**.
  *   Format: *"Keep Input $(D_1, D_2)$, but Force Card $X$ to Value $V$."*
  *   Instructor calculates what the Output *would have been* had that state occurred (counterfactual).
  *   Instructor returns only the **Hypothetical Output**.
  *   **Goal:** Determine which cards actually *drive* the output.

  **Phase 3: The Grant (Stakes)**
  *   Instructor presents a **Challenge Case**: Input $(3, 4)$ with a specific State Configuration provided by the Instructor.
  *   Labs must bet **Points** on the Output.
  *   **Scoring:**
      *   Correct Prediction: +10 Points.
      *   Incorrect Prediction: -5 Points.
      *   **Bonus:** If they write down the "Feature" they believe is represented (e.g., "Card 1 represents D1"), they get +5 Points *only if* the Instructor deems their reasoning consistent with their bet (Instructor discretion based on their logic, not truth).

  ## 6. Timeline (90 Minutes)

  *   **00:00 – 00:10 (Intro):** Distribute materials. Explain rules. Emphasize: *"Do not ask me how it works. Ask the data."*
  *   **00:10 – 00:35 (Phase 1):** Observation. Labs submit up to 5 Input Queries. Instructor circulates, handing back Envelopes.
      *   *Midpoint Check (20 min):* "You should have enough data to form a hypothesis about the State."
  *   **00:35 – 01:00 (Phase 2):** Intervention. Labs submit up to 3 Clamp Requests.
      *   *Constraint:* They cannot clamp a card to a value mathematically impossible for the given input (Instructor vetoes invalid physics).
  *   **01:00 – 01:10 (Phase 3):** The Grant. Reveal Challenge Case. Labs deliberate and submit Bets.
  *   **01:10 – 01:30 (Reveal & Debrief):** Collect bets. Reveal Master Key. Facilitate discussion.

  ## 7. Scoring Scheme

  | Action | Points |
  | :--- | :--- |
  | **Correct Output Prediction** | +10 |
  | **Incorrect Output Prediction** | -5 |
  | **Identified "Legible" Feature** (Card 1/2) | +5 (Awarded to all, as it is obvious) |
  | **Identified "Causal" Feature** (Card 3 Parity) | +10 (Only if they bet on Card 3 logic) |
  | **Consistency Bonus** | +5 (If their stated mechanism matches their bet) |

  *Note: The scoring is designed so that a team can win points by finding the legible feature (Card 1) but lose the big bet if they don't find the causal feature (Card 3).*

  ## 8. The Reveal (Double-Edged)

  **Step 1: The Mechanism.**
  Display the Master Key. Show that $C_1$ is a perfect copy of $D_1$, but $C_1$ is ignored by the Output Rule. Show that $C_3$ drives the Output, but $C_3$ is a scrambled, non-isomorphic function of $D_2$.

  **Step 2: The Puncture.**
  *   **To the Decoders:** "You found $D_1$ in Card 1. It was perfectly recoverable. But it was epiphenomenal. It did nothing."
  *   **To the Causalists:** "You found Card 3 drives the output. But Card 3 is a scrambled hash ($4, 2, 6, 1, 3$). It bears no structural resemblance to $D_2$. Is it a 'representation' of $D_2$, or just a switch?"

  **Step 3: The Stalemate.**
  Announce the winners based on points. Then declare: *"In this game, I am God. I know the truth. In your actual research, you do not have the Master Key. You only have the tension you just felt."*

  ## 9. Debrief Guide (Philosophical Mapping)

  *Do not use these terms during the activity. Introduce them now.*

  **1. Realism vs. Instrumentalism (The Status of Features)**
  *   *Ask:* "Did Card 1 *represent* $D_1$?"
  *   *Map:* **Realists** might say yes (structural isomorphism exists). **Instrumentalists** say no (it played no role in the system's function).
  *   *Ask:* "Did Card 3 *represent* $D_2$?"
  *   *Map:* **Causal Role Functionalists** say yes (it made the difference). **Structuralists** say no (it's just a scrambled switch).
  *   *Point:* The activity forces a choice between *structure* and *use* as the criterion for representation.

  **2. Decodability vs. Use (The Asymmetry)**
  *   *Ask:* "Why was Card 1 easier to find than Card 3?"
  *   *Map:* This mirrors **Probing/Decoding** in ML (e.g., linear classifiers on activations). High decodability $\neq$ Causal importance.
  *   *Point:* Just because a linear probe can find "gender" in a text model doesn't mean the model *uses* gender to predict the next token.

  **3. Underdetermination of Mechanism**
  *   *Ask:* "If I hadn't shown you the Master Key, could you have been sure Card 3 wasn't just correlated noise?"
  *   *Map:* **Underdetermination.** Behavioral data (Input/Output) + Internal States does not uniquely fix the mechanism.
  *   *Point:* In real ML, we never get the Master Key. We must commit to a story (a "feature") without ontological certainty.

  **4. The Wager (Pragmatism)**
  *   *Ask:* "How did you decide your bet?"
  *   *Map:* **Pragmatic Commitment.** We treat features as real because it helps us predict/intervene, not because we know they are metaphysically grounded.
  *   *Point:* Representation might be a stance we take, not a fact we find.

  ## 10. Troubleshooting: Predictable Failures

  **Failure 1: Students solve the logic too quickly (before Phase 2).**
  *   *Symptom:* A table raises their hand at minute 25 saying "Card 3 parity determines output."
  *   *Fix:* **The Noise Injection.** If a table gets too close, hand them a "Corrupted Envelope" (one off the Master Key script) where Card 3 parity is flipped but Output remains consistent (simulating a robust network). Tell them: *"System variance detected."* This re-introduces uncertainty.

  **Failure 2: Students fail to find the Causal Feature (Card 3).**
  *   *Symptom:* All bets are based on Card 1.
  *   *Fix:* **The Hint.** During Phase 2, announce: *"Several labs are focusing heavily on Card 1. Note that Intervention Slips on Card 1 have yielded 0% change in Output."* Force them to look at Card 3.

  **Failure 3: Intervention Phase drags on.**
  *   *Symptom:* Students write complex clamp requests that take you time to calculate.
  *   *Fix:* **Restrict Requests.** "Clamp Requests must only change one card by +/- 1." This keeps your mental math instant.

  **Failure 4: The Reveal feels like a "Gotcha."**
  *   *Symptom:* Students feel cheated that Card 1 was useless.
  *   *Fix:* **Validate the Trap.** Explicitly say: *"This is exactly the problem in interpretability. We find features that look real (Card 1) but are spurious. The frustration you feel is the research frontier."*

  ## 11. Limitations & Instructor Supplement

  **What the Toy Leaves Out:**
  1.  **High Dimensionality:** Real networks have millions of parameters, not 3 cards. Features are distributed, not local.
      *   *Supplement:* In debrief, explain that in real networks, "Card 3" isn't one neuron but a direction in 10,000-dimensional space. The "scrambling" is much harder to undo.
  2.  **No Ground Truth:** In this game, *I* know the truth. In real ML, there is no "Master Key." Nature doesn't tell us if a feature is "real."
      *   *Supplement:* Emphasize that the philosophical debate exists *because* we lack the Instructor's Master Key. We are permanently in Phase 3 (The Wager).
  3.  **Human Legibility:** The cards use numbers. Real activations are floats.
      *   *Supplement:* Remind them that "Parity" was legible to them only because they are humans good at math. To the system, it's just weights.

  **Final Instruction to Instructor:**
  Your silence during the activity is the most important tool. Do not nod when they are right. Do not frown when they are wrong. Be the Black Box. Let the friction between the cards and the output do the teaching.
