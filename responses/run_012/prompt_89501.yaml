prompt: |-
  I run a fortnightly session for our department's undergraduate philosophy society — around twenty students, mixed years, ninety minutes, no reading assigned in advance, and a standing expectation that whatever we do has to land on its own without a lecture up front. This term I've drawn the futarchy slot: Hanson's proposal, as I recall it from the old blogosphere, that we vote on the values we want and then let conditional prediction markets tell us which policy will actually deliver them. I've argued about decision markets for years and I'm tired of the usual outcome, where the room either nods along at the slogan or decides it's obviously unworkable and retains nothing. What I want is for the students to feel the actual shape of the thing in their hands: the moment where it looks like it solves a genuine problem, and the moment where it quietly relocates that problem instead of solving it. So the activity has to be one where they run into the trouble themselves, in the doing, before anyone says the word futarchy.

  Here's the decision I'd like to hang it on, though you should feel free to adjust it as long as the structural features survive. Our society has a fixed pot of discretionary money and must choose between subsidizing a peer-tutoring programme and paying for a late-night study space; there is a real disagreement about what the money is for, and I want that disagreement to be about *values* while the factual question — which policy actually produces the good outcome — is genuinely uncertain and dispersed across the room. The sequence I've sketched: first the group has to fix a single scalar metric by vote before any trading is allowed (and I want them to feel how much of the fight has already been settled, silently, at that step); then open a decision market on whether the metric will come out higher under one policy than the other, with play money or points, a small number of privately distributed information slips (someone knows the tutoring coordinator is about to leave; someone knows the study space sits next to a construction site), and a resolution procedure they have to agree on in advance. Then, once a price has formed and the room is feeling pleased with how cleanly it aggregated what it knew, I want a second and third round that break it: one where a participant or two are quietly given the ability to influence the very measurement the market resolves against, so that betting on the metric becomes betting on something the policy itself perturbs; and one where the metric is redefined after the fact, or where the question is posed not as a threshold but as a bare comparison between two worlds only one of which will ever exist.

  Design me the runnable activity: the rules, the materials, the payoff scheme, a minute-by-minute timeline for the ninety minutes, the wording of the private information slips, and the resolution protocol. The debrief matters as much as the game — it should map specific moments in the activity onto the corresponding pieces of the idea (the vote-on-values / bet-on-beliefs split, the fact that a threshold market prices a question the threshold-setter chose, the counterfactual problem of resolving on a world that doesn't happen, the endogeneity that turns measurement into a target, and the thin-market and manipulation worries), and it should be honest about which of those the activity genuinely reproduces and which it can only gesture at, with a note on what I'll have to supply myself. Finally, tell me what will predictably go wrong the first time I run this — I'd rather hear the failure modes now than discover them live — and how to handle each without rescuing the game so thoroughly that the difficulty disappears.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Fortnightly undergraduate philosophy society session. ~20 students, mixed years, 90 mins. No pre-reading. No lecture up front.
      *   **Topic:** Futarchy (Robin Hanson's "Vote on Values, Bet on Beliefs").
      *   **Goal:** Move beyond slogan nodding or immediate dismissal. Students need to *feel* the mechanism's promise and its hidden pitfalls *in the doing*.
      *   **Specific Constraint:** The trouble must be encountered *before* the word "futarchy" is introduced.
      *   **Core Scenario:** Discretionary money choice: Peer-tutoring vs. Late-night study space.
      *   **Key Structural Features to Preserve:**
          1.  Vote on a single scalar metric first (values).
          2.  Decision market on which policy yields a higher metric (beliefs).
          3.  Play money/points + private information slips.
          4.  Resolution protocol agreed upon in advance.
          5.  **Rounds 2 & 3 (The Break):** Endogeneity (manipulating the metric) and Counterfactual/Measurement issues.
      *   **Deliverables:** Rules, materials, payoff scheme, minute-by-minute timeline, info slips, resolution protocol, debrief guide (mapping activity to theory), and failure mode analysis.

  2.  **Deconstruct the Activity Design:**
      *   *Time:* 90 minutes is tight for three rounds + debrief. I need to be ruthless with timing.
      *   *Participants:* 20 students. A single market might be too chaotic or too thin. Splitting into groups might lose the "collective intelligence" feel. Let's keep it as one plenary market but use "market makers" or a simplified order book to speed things up. Actually, for 20 people, a continuous double auction is too hard to manage without software. A *call market* (batch auction) or a simple "buy/sell at current price" facilitated by the instructor is better. Let's go with a facilitated parimutuel or simple market maker model to ensure liquidity and speed.
      *   *The Metric:* Needs to be measurable but vulnerable. "Average GPA" is too slow. "Satisfaction Score" is too subjective. "Number of students reporting improved academic confidence in end-of-term survey" is good. Let's simplify for the game: "Departmental Wellbeing Index" (DWI) based on a simulated survey.
      *   *The Rounds:*
          *   Round 1: Ideal Futarchy. Vote metric -> Market -> Reveal.
          *   Round 2: Goodhart's Law/Endogeneity. Some students can influence the survey.
          *   Round 3: The Counterfactual/Resolution Problem. We can't implement *both* policies to see which won. We have to pick one, meaning the other's outcome is never observed.

  3.  **Drafting the Mechanics:**
      *   *Currency:* "Philos" (points).
      *   *Market Mechanism:* To keep it 90 mins, I can't do complex trading. I'll use a *Prediction Market with Subsidy*. The "price" is the probability. Students buy shares in "Tutoring Wins" or "Space Wins".
      *   *Wait, Futarchy specific:* In Futarchy, you trade on the *outcome metric conditional on the policy*. So the asset is "DWI if Tutoring" vs "DWI if Space".
      *   *Simplification for Classroom:* We need to decide *which policy to enact*. The market price should reflect the *expected DWI* of that policy.
      *   *Revised Mechanism:* Two assets: `T-DWI` (DWI score if Tutoring chosen) and `S-DWI` (DWI score if Space chosen). Students trade these. The policy with the higher market price gets enacted.
      *   *Resolution:* This is the hard part. We can't actually enact the policy and wait a term. We need a *simulation* of resolution. I (the instructor) hold the "Truth Deck".
      *   *The Twist:* In Round 2, some students get "Influence Cards". In Round 3, the resolution rule changes (The Counterfactual Problem).

  4.  **Refining the Timeline:**
      *   00-10: Intro & Setup (No theory yet).
      *   10-20: Phase 1 - The Value Vote (Metric selection).
      *   20-40: Phase 2 - The Market (Trading on beliefs).
      *   40-50: Resolution of Round 1 & Payout.
      *   50-65: Round 2 - The Manipulation (Endogeneity).
      *   65-80: Round 3 - The Counterfactual (Resolution crisis).
      *   80-90: Debrief & Theory Reveal.

      *Critique:* 90 mins is very tight for 3 rounds. I might need to combine Round 2 and 3 or make them very quick "scenario injections" rather than full trading rounds. Let's make Round 1 the main trading experience. Rounds 2 and 3 can be "Rule Changes" applied to the *same* market position, or quick re-trades.
      *Better Approach:* Run one full market (Round 1). Then pause. Introduce Round 2 constraint (Manipulation) -> Re-trade or Adjust. Introduce Round 3 constraint (Counterfactual) -> Discuss Resolution.
      *Actually, the prompt asks for "a second and third round that break it".* Okay, I must fit them in. I will shorten the trading windows.

  5.  **Developing the "Breaks" (The Philosophical Meat):**
      *   *Break 1 (Endogeneity):* Give 3 students "Admin Access". They can add +5 to the DWI score if they hold a certain position. This creates a conflict of interest (trading vs. measuring).
      *   *Break 2 (Counterfactual):* To resolve the market, we need to know the DWI of the *losing* policy. But we only enacted the winner. How do we price the loser? This forces the realization that Futarchy requires resolving on unobserved worlds (oracles, models), which reintroduces the epistemic uncertainty the market was supposed to solve.

  6.  **Writing the Materials:**
      *   *Info Slips:* Need to be asymmetric.
          *   Tutoring: "Coordinator quitting" (Bad), "High demand waitlist" (Good).
          *   Space: "Construction noise" (Bad), "24hr security approval" (Good).
      *   *Payoff:* Points redeemable for... actual candy? Or just glory? Let's say candy/chocolate for the top 3. It raises stakes slightly.
      *   *Resolution Protocol:* Needs to be explicit. "I (Instructor) draw a card from the Truth Deck."

  7.  **Addressing Failure Modes:**
      *   *Liquidity:* Students won't trade. *Fix:* I act as Market Maker.
      *   *Confusion:* They won't understand the asset. *Fix:* Simplify asset to "Value of DWI".
      *   *Cynicism:* "This is fake." *Fix:* Acknowledge it's a simulation, but the *incentives* are real within the room.
      *   *Dominance:* One loud student. *Fix:* Private bidding sheets or silent trading phase.

  8.  **Structuring the Debrief:**
      *   Map the "Value Vote" to Hanson's "Vote on Values".
      *   Map the "Market" to "Bet on Beliefs".
      *   Map Round 2 to Goodhart's Law / Measurement Corruption.
      *   Map Round 3 to the Counterfactual Problem (the biggest technical hurdle for Futarchy).
      *   Admit what the game *didn't* show (long-term incentives, real money stakes, regulatory capture).

  9.  **Refining the "Metric Vote":**
      *   This is crucial. If they pick "Happiness", it's too vague. If they pick "GPA", it's too lagged. I need to guide them toward something measurable *within the game context* but plausible enough to feel real. Let's suggest a shortlist but let them vote.
      *   *Correction:* The prompt says "first the group has to fix a single scalar metric by vote... feel how much of the fight has already been settled". I should provide options that embed values. E.g., "Average Attendance" vs. "Self-Reported Satisfaction". One favors administration, one favors students.

  10. **Final Polish:**
      *   Check tone: Professional, facilitative, philosophically precise.
      *   Check timing: Ensure buffers.
      *   Check constraints: No lecture up front. Theory comes at the end.

  *(Self-Correction during drafting)*: 90 minutes for 3 full trading rounds is impossible with 20 undergrads. I will structure it as:
      *   Round 1: Full Trade (The Promise).
      *   Round 2: Same market, new rule injection (Endogeneity). Quick re-pricing.
      *   Round 3: Resolution Phase (The Counterfactual).
      This ensures we get to the debrief. I will explicitly note this compression in the instructions.

      *Wait, one more thing:* The prompt asks for "a second and third round that break it". I should try to honor that. I'll make Round 2 and 3 very fast "shock" rounds. 5 minutes each. The focus is on the *reaction* to the rule change, not a full equilibrium.

      *Resolution Protocol:* In a real Futarchy, the market decides the policy, and the metric is measured later. In the game, we need to simulate the measurement. I will use a "Truth Deck" that I hold.
      *Round 3 Twist:* We enacted Policy A. Policy B was not enacted. The market traded on `DWI_B`. How do we resolve `DWI_B`? We can't. This is the crux.

      *Let's finalize the Info Slips.*
      *   Tutoring: 3 slips. 1 Bad (Coordinator leaving), 1 Good (High demand), 1 Neutral/Noise.
      *   Space: 3 slips. 1 Bad (Noise), 1 Good (Security), 1 Neutral/Noise.
      *   Distribute to 6 students. Rest are noise traders or general public.

      *Let's finalize the Metric Vote.*
      *   Option A: "End-of-Term Survey Score (1-10)" (Subjective, manipulable).
      *   Option B: "Attendance at Society Events" (Objective, maybe irrelevant).
      *   Option C: "Number of Distinctions in Dept" (Lagged, noisy).
      *   I'll let them propose, but steer to Option A for the Endogeneity round to work.

      *Okay, ready to write.*
answer: |-
  # Activity Design: The Futarchy Simulation
  **Title:** *Vote on Values, Bet on Beliefs (Until the Rules Break)*
  **Time:** 90 Minutes
  **Participants:** 20 Undergraduates
  **Materials:** Play money ("Philos"), Trading Sheets, Private Info Slips, Whiteboard, Truth Deck (sealed envelopes), Candy/Prizes for top traders.

  ## Core Concept
  You are running a **Decision Market**. The society has £1,000. It must choose **Policy A (Peer Tutoring)** or **Policy B (Late-Night Space)**. The goal is not to predict the future, but to *select the policy* that maximizes a specific metric. The market price *is* the decision mechanism.

  ## 1. The Setup (00:00 – 00:10)
  **Instructor Script:**
  "We have £1,000 discretionary budget. We have two proposals: **Tutoring** or **Study Space**. We cannot do both. Normally we would argue until the loudest voice wins. Today, we are testing a mechanism to decide this. I am not going to tell you how it works yet. I am going to give you rules. Follow the rules, earn points. Top three point-holders get chocolate.

  There are three phases. In each phase, the rules of the game will change. Your goal is to maximize your personal points. The group's goal is to pick the policy that actually scores highest on the metric we choose."

  **Materials:**
  *   **Currency:** 100 "Philos" per student (printed chips or paper).
  *   **Assets:** Two trading sheets on the whiteboard.
      *   **Asset T:** Pays out equal to the *Departmental Wellbeing Index (DWI)* if Tutoring is enacted.
      *   **Asset S:** Pays out equal to the *Departmental Wellbeing Index (DWI)* if Space is enacted.
  *   **Current Price:** Starts at 50 for both (arbitrary baseline).

  ## 2. Phase One: The Value Vote (00:10 – 00:20)
  **Goal:** Force a consensus on a scalar metric. Feel the political weight of measurement.

  **Instruction:**
  "Before we trade, we must define the **Departmental Wellbeing Index (DWI)**. This is the number that determines your payout. If the DWI is 80, Asset T pays 80 Philos. You must agree on *one* number source. Propose metrics. Vote."

  **Suggested Options (if they stall):**
  1.  **Survey:** "Average self-reported satisfaction (1-10) in end-of-term dept survey."
  2.  **Usage:** "Total hours logged in usage sheets."
  3.  **Academic:** "Number of first-class grades in the cohort."

  **Facilitator Note:** Steer them toward **Option 1 (Survey)**. It is necessary for Phase Two (Endogeneity) to work. If they choose "Grades," Phase Two fails. If they struggle, argue that "Grades take too long to resolve."
  **The Trap:** Once voted, write it in permanent marker on the board. *Do not allow changes.*

  ## 3. Phase Two: The Market (00:20 – 00:45)
  **Goal:** Aggregate dispersed information. Feel the "magic" of the market.

  **Distribution:**
  *   Hand out **Private Info Slips** to 6 specific students (see below). Tell them: "This is true. You may trade on it, but do not show the slip."
  *   The other 14 students have no private info (they are liquidity/noise).

  **Trading Rules (Call Market for Speed):**
  1.  **5 Minutes:** Silent thinking/whisper trading.
  2.  **5 Minutes:** Submit buy/sell orders to you (the Market Maker).
  3.  **5 Minutes:** You clear the market, set the new price for Asset T and Asset S.
  4.  **Decision:** The Asset with the higher price wins. That policy is "Enacted."

  **Private Info Slips (Cut and Fold):**
  *   **Slip 1 (Tutoring - Bad):** "Rumor: The peer-tutoring coordinator is graduating early and leaving next month."
  *   **Slip 2 (Tutoring - Good):** "Rumor: There is a waiting list of 50 first-years for tutoring already."
  *   **Slip 3 (Tutoring - Noise):** "Rumor: The philosophy society budget audit is coming up."
  *   **Slip 4 (Space - Bad):** "Rumor: The room allocated for the study space is next to the library construction site."
  *   **Slip 5 (Space - Good):** "Rumor: Security has approved 24-hour access for the new space."
  *   **Slip 6 (Space - Noise):** "Rumor: Coffee prices in the cafeteria are rising."

  **Resolution (The Truth Deck):**
  You have two envelopes: **Envelope T** and **Envelope S**.
  Inside Envelope T is a number (e.g., 65). Inside Envelope S is a number (e.g., 70).
  *Preparation:* You must pre-write these numbers based on the info slips.
  *   *Logic:* If Slips 1 & 4 are in play, T should be lower, S higher.
  *   *Example:* T = 55, S = 75.
  *   **Crucial:** Only open the envelope of the **Winning Policy**. Pay the traders.

  ## 4. Phase Three: The Breaks (00:45 – 01:10)
  **Goal:** Break the mechanism. Do not reset the points.

  ### Round 2: Endogeneity (15 Mins)
  **Instruction:** "We are running the same vote again. Same metric. Same policies. But the Department Head has changed the rules."
  **Action:** Hand **Admin Cards** to 3 students (can overlap with Info Slip holders).
  *   **Card Text:** "You are on the Survey Committee. If Policy T wins, you may add +10 to the final DWI score. If Policy S wins, you may add +10 to the final DWI score. You keep any trading profits."
  **Trading:** Run a quick 5-minute trading window.
  **Observation:** Watch the prices. Students with Admin Cards will buy the asset they can inflate. The market price no longer reflects *belief*; it reflects *influence*.
  **Resolution:** Open the Winning Envelope. Add the +10 if applicable. Pay out.

  ### Round 3: The Counterfactual (15 Mins)
  **Instruction:** "We have one problem. We enacted the Winner. We measured its DWI. But to settle the market fairly, we needed to know what the *Loser* would have scored, because people traded on that too. We cannot go back in time and enact the Loser."
  **Action:** Ask the room: "How do we resolve the trades on the Losing Asset?"
  *   *Likely responses:* "Guess?" "Model it?" "Ask an expert?"
  *   **The Twist:** Tell them: "To resolve the Losing Asset, we must hire an Oracle (The Instructor). I will set the price based on my judgment."
  *   **Action:** You arbitrarily assign a number to the Losing Asset. Make it controversial (e.g., much lower than market price).
  **Observation:** The market collapses. Trust evaporates. Why trade if the resolution is subjective?

  ## 5. The Debrief (01:10 – 01:30)
  **Goal:** Map the experience to Hanson's Futarchy.

  **Discussion Map:**
  1.  **The Metric Vote (Values):**
      *   *Ask:* "When we voted on the Survey vs. Grades, was that a factual question?"
      *   *Point:* This was **Vote on Values**. By choosing 'Survey', we privileged student happiness over raw grades. That political fight was hidden inside a technical definition. Futarchy doesn't remove politics; it moves it to the metric definition.
  2.  **The Market (Beliefs):**
      *   *Ask:* "In Round 1, did the price move when people with Info Slips traded?"
      *   *Point:* This was **Bet on Beliefs**. The market aggregated the rumor about the construction site better than a show of hands would have. It incentivized truth-telling.
  3.  **Round 2 (Endogeneity/Goodhart):**
      *   *Ask:* "Why did the price change when you got Admin Cards?"
      *   *Point:* **Measurement Corruption.** If the policy affects the metric *directly* (not just through the intended outcome), traders bet on manipulation, not efficacy. Futarchy requires metrics that are hard to game.
  4.  **Round 3 (The Counterfactual):**
      *   *Ask:* "Why was Round 3 frustrating?"
      *   *Point:* **The Resolution Problem.** Futarchy requires knowing the outcome of the road *not taken*. In reality, we can't know that. We need a model/oracle to estimate the counterfactual. But if we use a model, why did we need the market? This is the strongest technical objection to Futarchy.
  5.  **What the Game Hid:**
      *   Real money stakes (Philos are weak).
      *   Liquidity (20 people is a thin market).
      *   Long-term incentives (In the game, the manipulation was immediate; in reality, it might be subtle lobbying).

  ---

  ## Failure Mode Analysis & Mitigation

  **1. Liquidity Freeze (Students don't trade)**
  *   *Risk:* Students treat it like a classroom exercise, not a game. Prices stay at 50.
  *   *Mitigation:* You act as the Market Maker. If no one trades, *you* adjust the price based on the Info Slips you know exist. "I'm moving Price T to 45. Who wants to buy?" Create artificial volatility to spark interest.
  *   *Philosophical Save:* If the market is thin, point out in debrief that Futarchy requires deep liquidity to work. A thin market is just a vote with extra steps.

  **2. Metric Deadlock (They can't agree on DWI)**
  *   *Risk:* They spend 20 minutes arguing about what "Wellbeing" means.
  *   *Mitigation:* Impose a "Constitutional Constraint." "You have 5 minutes or I choose the metric." This replicates the urgency of real governance.
  *   *Philosophical Save:* Use the deadlock to show that *agreement on values* is the hardest part of governance, harder than agreement on facts.

  **3. The "Oracle" Revolt (Round 3)**
  *   *Risk:* Students get angry that you arbitrarily set the counterfactual price.
  *   *Mitigation:* Lean into the anger. "This anger is the point." If they feel the resolution is unfair, they have understood the Counterfactual Problem better than any lecture could teach.
  *   *Philosophical Save:* Acknowledge that real-world Futarchy proposes using *other markets* to resolve the counterfactual, which leads to infinite regress.

  **4. Info Slip Leakage**
  *   *Risk:* Students show each other the slips immediately.
  *   *Mitigation:* Tell them: "If you show the slip, you are disqualified from prizes." Make it a secret mission.
  *   *Philosophical Save:* If they do share, the market becomes efficient too fast. Point out that in reality, information is *not* public, which is why the market is needed.

  **5. Time Overrun**
  *   *Risk:* Trading takes too long.
  *   *Mitigation:* Use a **Call Market** (batch auction) rather than continuous trading. Everyone writes down their bid at minute 10. You calculate the clearing price instantly. Do not allow haggling.
  *   *Philosophical Save:* Note that real prediction markets need speed, but governance needs deliberation. The tension between speed and accuracy is a feature, not a bug.

  ## Instructor Prep Checklist
  1.  **Truth Deck:** Write two numbers on cards (e.g., T=55, S=75). Seal in envelopes.
  2.  **Info Slips:** Print 6 copies. Cut them.
  3.  **Admin Cards:** Print 3 copies for Round 2.
  4.  **Currency:** 2,000 Philos total (100 per student).
  5.  **Board:** Draw two columns: `Asset T` and `Asset S`. Leave space for prices.
  6.  **Timer:** Visible countdown. 90 minutes is strict.

  ## Final Note to Instructor
  You will be tempted to explain *why* Round 3 broke during the round. **Do not.** Let them sit in the frustration of the unresolved counterfactual. The silence after you announce "I will decide the losing price" is where the learning happens. Only name "Futarchy" in the last 10 minutes. Until then, it is just "The Game."
