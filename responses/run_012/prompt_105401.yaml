answer: |-
  **The Collider in the Clay**

  Two agronomists, Agnes and Stan, are standing in the department hallway, shouting at a single sheet of paper.

  Agnes points at the bottom line. "Look at the pooled data, Stan! The control group out-yielded the fertilizer group by 15%. If we recommend this product, we're committing fraud."

  Stan points at the sub-tables above it. "But look at the stratification! Within the Clay soils, the fertilizer wins. Within the Loam soils, the fertilizer wins. It wins in every stratum. If we *don't* recommend it, we're ignoring the evidence."

  "It's Simpson's Paradox," Stan says, adjusting his glasses. "The numbers are perfectly consistent. The arithmetic is sound. The table is what it is."

  "The table is a liar!" Agnes counters. "Which one represents the field?"

  They are interrupted by Elias, a retired soil scientist known for reading philosophy of science in the lab. He sips his coffee and glances at the paper. "Ah," Elias says. "The identical tables problem."

  "It's not identical," Stan says. "It's one dataset."

  "The contingency table is identical," Elias corrects. "But the story isn't. You have two scenarios here that produce the exact same counts but demand opposite actions. In one, Soil Type is a **confounder**. The farmers chose which fields got fertilizer based on the soil. The soil caused the treatment assignment *and* the yield. In that case, Agnes is wrong; you must stratify to block the backdoor path. The fertilizer is good."

  Agnes smiles.

  "But," Elias continues, turning to Stan, "in the second scenario, Soil Type is a **collider**. The fertilizer alters the soil chemistry, and a high yield alters the soil chemistry. Certain soil types only arise when *both* are present. In that case, Stan is wrong; you must pool. Stratifying opens a spurious path and manufactures an association. The fertilizer is useless."

  Stan frowns. "But the chi-square is the same. The odds ratio reversal is purely arithmetical; it happens upon partitioning regardless of the causal structure. The data forces the paradox."

  "The data forces nothing," Elias says, handing the paper back. "The data is just a shadow. You're arguing about the shape of the object based on the shadow on the wall."

  "So what do we do?" Agnes asks. "We have to write the recommendation."

  "You can't," Elias says. "Not until you answer the question you forgot to ask."

  "What question?" Stan demands. "We asked if the fertilizer works!"

  "No," Elias says. "You asked, 'What kind of variable is Soil Type?' Did you measure the soil before you planted, or after you harvested?"

  The hallway goes silent.

  "If you measured before," Elias concludes, "the soil is a cause, and you stratify. If you measured after, the soil is an effect, and you pool. But since you didn't record *when* you measured it, you don't know if you're looking at a confounder or a collider."

  "So the numbers are ambiguous?" Stan asks, defeated.

  "No," Elias says, walking away. "The numbers are precise. It's your reality that's undefined. You're trying to use statistics to solve a metaphysical problem. Come back when you've decided what happened in the field, and the math will tell you what it means. Until then, you're not scientists; you're just numerologists with shovels."
