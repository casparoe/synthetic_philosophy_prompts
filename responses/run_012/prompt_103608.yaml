      *(Refining the "Internal Relations" point)*: If the relation is internal, the community *is* the sum of these relations. If they break the relation, they alter themselves. This makes the "stripping" self-harm, not just harm to the other. This supports Option 1.

  10. **Final Review against constraints:**
