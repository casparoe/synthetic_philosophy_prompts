      *   **The Argument:** They have constructed a *reductio ad absurdum* against this view. The argument suggests that if personhood depends on community recognition, then the community can strip someone of personhood (and thus moral protection) by ostracising them.
      *   **The Goal:** The user wants to save the relational core (premises 1-3) but avoid the monstrous conclusion (9). They need to know which premise to reject, why it seemed plausible, and what the cost of rejecting it is.
