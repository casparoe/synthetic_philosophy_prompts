      *   *Critique of Option 2:* If I separate moral status from personhood, am I abandoning Ubuntu? Ubuntu often says moral status *comes* from personhood. I need to frame this as a "moderate" relational view (Gyekye) vs "radical" (Menkiti).
      *   *Decision:* I will frame Option 1 as "Rejecting the Voluntarism of Recognition" (attacking premise 4) and Option 2 as "Decoupling Moral Standing from Social Status" (attacking premise 7).

  9.  **Final Polish:** Check British spellings (recognise, programme, defence, centre, etc.). Ensure the distinction between "personhood" (social) and "humanhood" (ontological) is clear, as this is key in African philosophy discussions (Wiredu vs. Menkiti).

