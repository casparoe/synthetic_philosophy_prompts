prompt: |-
  I am a novelist, and I am writing a book set in the aftermath of the Second World War, much of it inside the courtroom of one of the postwar tribunals — I am working with both Nuremberg and Tokyo. My central figure is a defence advocate, an elderly jurist of real learning, and his refrain, offered to the bench and to anyone else within earshot, is 'no crime without law' — though when he is at his most formal he gives it as nullum crimen sine lege, and sometimes, apparently interchangeably, as nulla poena sine lege. He says it when the prosecution reaches the charge of waging aggressive war; he says it over the conspiracy count; and he says it most bitterly when the court refuses to hear a word about what the victorious powers did with their own bombers and their own empires.

  I know enough to suspect that this is not one claim but a family of them, and I am afraid of writing him as either a fool or a bore. So I would like you to take the maxim apart. What are the distinct precise things 'no crime without law' could be asserting, from the nearly empty to the radical? For each, tell me whether it is a platitude, a substantive and defensible principle, or simply false as stated. I am especially interested in the gap between the bare demand that any punishment rest on some prior legal norm, and the stronger demand that the norm have existed, been knowable, and covered this particular act before it was done; in whether the maxim is really about law at all, or about fair warning, or about the limits of what a court may do to a defeated enemy; and in whether the two Latin forms he conflates are in fact the same principle or two. I gather that at Tokyo one judge went so far as to hold the whole proceeding unlawful on grounds of this kind, and that his reasoning was taken up by others on the bench. Please tell me which of these readings would actually help my advocate — which would get the crimes-against-peace and conspiracy counts thrown out, rather than merely deplored — and which a prosecutor could grant him with a shrug and still secure a conviction. He is a serious man, and I would like him to be making a serious argument rather than a slogan in a wig.

  Please write your answer in British English. I do not need references or a reading list; I want the menu of readings and your verdict on each.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book set in post-WWII tribunals (Nuremberg/Tokyo).
      *   **Character:** Elderly defence advocate, learned jurist.
      *   **Refrain:** *Nullum crimen sine lege* (no crime without law) / *Nulla poena sine lege* (no punishment without law).
      *   **Context:** Used against charges of aggressive war, conspiracy, and victor's justice (bombings/empires).
      *   **Goal:** Deconstruct the maxim into distinct precise meanings (from empty to radical).
      *   **Task:** Evaluate each reading (platitude, defensible principle, or false). Address the gap between prior norm vs. knowable/covered norm. Address whether it's about law, fair warning, or limits on victors. Distinguish between the two Latin phrases. Identify which readings help the advocate get counts thrown out vs. which allow conviction.
      *   **Specific Detail:** Mention the Tokyo judge who dissented on these grounds (Pal).
      *   **Constraint:** Write in British English. No references/reading list. Focus on the "menu of readings" and verdicts.
      *   **Tone:** Serious, analytical, helpful to a writer wanting accuracy without pedantry.

  2.  **Deconstruct the Maxim (*Nullum Crimen Sine Lege*):**
      *   *Literal meaning:* No crime without law.
      *   *Variation:* *Nulla poena sine lege* (No punishment without law).
      *   *Core tension:* Retroactivity vs. Legality vs. Justice.
      *   *Historical Context:* The Nuremberg and Tokyo tribunals were explicitly accused of violating this principle because "Crimes Against Peace" (waging aggressive war) were not clearly codified as *individual* criminal offences with *personal* liability before the war.

  3.  **Brainstorming the "Menu of Readings" (from weak to strong):**

      *   *Reading 1: The Formalist/Positivist Minimum.* There must be *some* text. Even if made up yesterday. (Too weak, easily bypassed).
      *   *Reading 2: The Temporal Requirement (Non-Retroactivity).* The law must exist *before* the act. (This is the core Nuremberg defence argument).
      *   *Reading 3: The Clarity/Specificity Requirement.* The law must be clear enough to know what is forbidden. (Vagueness).
      *   *Reading 4: The Judicial Restraint Requirement.* Judges cannot *make* law, only apply it. (Separation of powers).
      *   *Reading 5: The Sovereign/International Limit.* States cannot be criminally liable, only individuals, and international law doesn't bind individuals directly. (The "States only" argument).
      *   *Reading 6: The Moral/Legitimacy Limit (Radical).* If the law is unjust or applied selectively (victor's justice), it is no law at all. (Natural law twist).

  4.  **Distinguishing *Crimen* vs. *Poena*:**
      *   *Crimen:* Focuses on the conviction/guilt. If there's no law, there's no crime.
      *   *Poena:* Focuses on the sentencing. Maybe the act was wrong, but you can't punish it without a pre-set penalty.
      *   *Relevance:* At Nuremberg/Tokyo, the defence wanted *no crime*. The prosecution might concede *no fixed penalty* but argue the act was inherently criminal.

  5.  **Addressing the Specific Historical Context (Nuremberg/Tokyo):**
      *   *Charge:* Crimes Against Peace (waging aggressive war).
      *   *Defence:* Kellogg-Briand Pact outlawed war but didn't specify *criminal* penalty for *individuals*.
      *   *Prosecution:* It was obviously wrong; international law evolves; ex post facto is acceptable for supreme crimes.
      *   *Justice Pal (Tokyo):* Dissented, arguing the tribunal was victor's justice and violated *nullum crimen*.
      *   *Justice Röling (Tokyo):* Conceded the point but argued for natural law/necessity.
      *   *Jackson (Nuremberg Prosecution):* Acknowledged the difficulty but argued the Charter *made* the law.

  6.  **Drafting the Content (Iterative refinement for British English & Tone):**

      *   *Introduction:* Acknowledge the character's sophistication. Validate the distinction between the two Latin phrases.
      *   *The Menu:*
          1.  *The Empty Tautology:* "There must be a law." (Prosecutor shrugs: "Here is the Charter.") -> *Verdict: Platitude.*
          2.  *The Temporal Bar (Non-Retroactivity):* Law must pre-date act. (This is the main defence). -> *Verdict: Substantive, but contested in international law then.*
          3.  *The Clarity Requirement:* Law must be specific, not vague "conspiracy." -> *Verdict: Defensible, helps against conspiracy counts.*
          4.  *The Individual Liability Gap:* International law binds states, not men. -> *Verdict: Strongest legal technicality for Nuremberg/Tokyo.*
          5.  *The Separation of Powers:* Judges shouldn't legislate. -> *Verdict: Weak in international context (no legislature).*
          6.  *The "Victor's Justice" / Selectivity:* If you don't punish yourself, you can't punish me. (Equality before the law). -> *Verdict: Moral/Political, less legal, but Pal's argument.*
      *   *Crimen vs. Poena:* Explain the difference. *Crimen* attacks guilt; *Poena* attacks sentencing. The advocate wants *Crimen*.
      *   *Historical Note:* Mention Justice Pal (India) at Tokyo.
      *   *Advice for the Novelist:* How to make him sound serious. Avoid sloganising. Focus on the *individual liability* and *retroactivity* combo.

  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure not to say the defence was "right" in a modern sense, but that it was a *serious legal argument*. The London Charter explicitly defined the crimes to bypass this, so the defence was arguing the Charter itself was invalid or limited.
      *   *Nuance:* The prosecution's counter was that the Kellogg-Briand Pact (1928) made aggressive war illegal, so the law *did* exist, just not the penalty. The defence argued illegality $\neq$ criminality.
      *   *British English:* Ensure spelling (defence, programme, honour, etc.) and phrasing (whilst, amongst, barrister/jurist tone).
      *   *Tone Check:* Keep it analytical, not lecturing. The user is a novelist, not a law student, but wants accuracy.

  8.  **Final Polish:** Check against all constraints.
      *   British English? Yes.
      *   No references? Yes.
      *   Menu of readings? Yes.
      *   Verdicts included? Yes.
      *   Distinction between *crimen* and *poena*? Yes.
      *   Justice Pal mentioned? Yes.
      *   Which arguments get counts thrown out? Yes.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Your instinct is quite correct: your advocate is reciting a maxim that functions less as a single rule than as a banner under which several distinct legal arguments may march. If he is to be taken seriously by the bench — and by your reader — he must know precisely which flag he is planting at which moment. The difference between a platitude and a case-winning objection lies in the specificity of the claim.

  Here is a menu of readings for *nullum crimen sine lege* (and its partner *nulla poena sine lege*), arranged from the vacuous to the radical, with a verdict on their utility in the specific context of Nuremberg and Tokyo.

  ### 1. The Positivist Minimum: 'There must be a written authority.'
  **The Assertion:** A court cannot punish a man merely because his conduct is wicked. There must be some text, treaty, or statute that the court can point to.
  **The Verdict:** **Platitude.**
  **Why:** The prosecution will simply shrug and produce the Charter of the International Military Tribunal. The Charter was signed before the trial began. If your advocate means only that there must be *some* law, the prosecution wins immediately. The Charter *is* the law. This reading will not get a single count thrown out.

  ### 2. The Temporal Bar: 'The law must exist before the act.'
  **The Assertion:** This is the core meaning of non-retroactivity (*ex post facto*). A man cannot be convicted for an act that was not criminal *at the time he committed it*.
  **The Verdict:** **Substantive and Defensible (but contested).**
  **Why:** This is your advocate's strongest shield against the 'Crimes Against Peace' charge. In 1939, waging aggressive war was a violation of international treaties (like the Kellogg-Briand Pact), but it was not clearly established as a *crime* attracting *individual* criminal liability. It was a wrong done by States, not a felony committed by men.
  **Prosecutorial Counter:** The prosecution will argue that the moral guilt was so obvious that strict retroactivity rules do not apply to 'supreme international crimes'.
  **Utility:** This is the argument that could theoretically void the aggressive war counts. It forces the court to admit they are applying law retrospectively. At Tokyo, Justice Radhabinod Pal relied heavily on this to argue the tribunal was illegitimate.

  ### 3. The Clarity Requirement: 'The law must be knowable and specific.'
  **The Assertion:** A law that is vague is no law at all. If a statute speaks of 'conspiracy' or 'aggression' without defining the precise boundaries of the offence, a man cannot know if he is breaking it.
  **The Verdict:** **Substantive and Defensible.**
  **Why:** This is particularly useful against the 'Conspiracy' count. The concept of conspiracy in common law is notoriously elastic. In civil law systems (and for many continental jurists), criminal liability requires a specific act, not merely an agreement to think about an act. If your advocate argues that 'conspiracy to wage war' is too vague to ground a capital conviction, he is making a technical, jurisprudential point, not a moral one.
  **Utility:** This might not void the whole trial, but it could narrow the scope of liability for defendants who were not in the innermost circle.

  ### 4. The Individual Liability Gap: 'International law binds States, not men.'
  **The Assertion:** *Nullum crimen* implies that the subject of the law must be capable of committing a crime. Before 1945, international law governed relations between Sovereign States. Individuals were agents of the State. You cannot hang a State; therefore, you cannot hang the men who acted in its name.
  **The Verdict:** **The Most Dangerous Argument for the Prosecution.**
  **Why:** This is the sophisticated version of Reading 2. It concedes that war might be illegal, but denies that *criminal law* is the correct mechanism for enforcement. It argues that the Tribunal is inventing a new category of person (the international criminal) and applying it backwards.
  **Utility:** If accepted, this gets the indictments quashed entirely. It was the view of Justice Pal at Tokyo, who held that the proceedings were merely 'victor's justice' cloaked in legal form.

  ### 5. The Separation of Powers: 'Judges must not legislate.'
  **The Assertion:** When a court creates a crime to fit the defendant, it is acting as a legislature. A tribunal established by the victors to judge the vanquished has no legislative mandate.
  **The Verdict:** **False in this Context.**
  **Why:** International tribunals do not operate under a domestic constitution with a separation of powers. The London Charter *gave* them the mandate. However, your advocate can use this rhetorically to shame the bench: 'You are not judges; you are lawmakers sitting in judgment on your own legislation.'
  **Utility:** Political rather than legal. It will not secure an acquittal, but it stains the judgment.

  ### 6. The Equality Principle: 'The law must apply to the judge as well as the accused.'
  **The Assertion:** This is the radical, moral reading. If the maxim means 'no crime without law', it implies a universal legal order. If the victorious powers committed similar acts (the bombing of Dresden, the use of atomic weapons, colonial suppression) but are not subject to the law, then the law is not universal. It is a command, not a norm.
  **The Verdict:** **Radical and Politically Potent, Legally Weak.**
  **Why:** Strictly speaking, criminal law does not require that *everyone* who breaks it be caught, only that the accused broke it. However, in the context of *Crimes Against Peace*, selectivity undermines the claim that the law is objective.
  **Utility:** This will not get the counts thrown out on a technicality, but it supports a motion to exclude evidence regarding the defendants' actions if the same evidence is not admissible against the Allies. It is the argument of 'Tu quoque' (you also). The Nuremberg bench largely rejected this, but it remains the most bitter pill for the defence to swallow.

  ***

  ### On the Latin: *Crimen* vs. *Poena*

  Your advocate conflates them, which is realistic for a rhetorical refrain, but a jurist of his learning would know the distinction.

  *   ***Nullum crimen sine lege*** **(No crime without law):** This attacks the **conviction**. It says: 'What I did was not a crime.' If this holds, the defendant walks free. This is the argument regarding aggressive war and individual liability.
  *   ***Nulla poena sine lege*** **(No punishment without law):** This attacks the **sentence**. It says: 'Even if what I did was wrong, there was no pre-existing scale of punishment for it.'

  **The Trap:** The prosecution would happily concede *nulla poena* while insisting on *crimen*. They might argue: 'Very well, the penalty was not fixed in 1939. But the crime existed. We will fix the penalty now.'
  **The Strategy:** Your advocate must insist on *nullum crimen*. He is not bargaining for a lighter sentence; he is denying the court's jurisdiction over the soul of the accused. If he slips into *poena*, he admits guilt and argues only over the tariff.

  ***

  ### The Historical Precedent: Justice Pal

  You are correct regarding the Tokyo Tribunal. Justice Radhabinod Pal of India wrote a famous dissenting opinion. He did not argue that the Japanese were innocent of atrocities (he conceded war crimes in the conventional sense); rather, he argued that the 'Crimes Against Peace' charge violated *nullum crimen sine lege*. He held that the Tribunal was applying *ex post facto* law and that the Allied powers were equally culpable of aggression and imperialism.

  His reasoning was that without a pre-existing sovereign authority to define the crime, the trial was merely an act of power. He is the ghost your advocate is channeling. To make your character credible, he should not sound like he is defending the morality of the Axis powers, but rather defending the integrity of the Law itself against being used as a weapon.

  ***

  ### Summary for the Novelist

  To ensure your advocate is neither a fool nor a bore, assign him the appropriate reading for the appropriate moment:

  1.  **Against the Conspiracy Count:** Use **Reading 3 (Clarity)**. Argue that 'conspiracy' is too vague in international law to sustain a death penalty. This is technical and dry, perfect for a weary jurist.
  2.  **Against Aggressive War:** Use **Reading 4 (Individual Liability)**. Argue that States make war, not men. Men serve States. To hang a man for the act of a State is to invent a new crime retrospectively. This is the substantive legal battle.
  3.  **Against the Silence on Allied Bombings:** Use **Reading 6 (Equality)**. Do not frame this as 'they did it too, so I didn't.' Frame it as: 'If this is a universal law, it must bind the legislator. If it binds only the vanquished, it is not law; it is vengeance.'

  **The Prosecutor's Shrug:**
  The prosecutor can grant Readings 1 and 5 without sweat. He might even concede Reading 3 regarding minor defendants.
  **The Prosecutor's Fight:** He must fight Readings 2 and 4 to the death. If he accepts that the law did not exist before the act, or that individuals cannot be liable for State acts, the entire Nuremberg precedent collapses.

  Your advocate is making a serious argument if he focuses on the **retroactive creation of individual liability**. That is the hinge upon which the legality of the twentieth century's greatest trial turns. If he merely shouts about 'fairness' or 'victor's justice' without anchoring it in the *temporal existence of the norm*, he becomes a polemicist. If he anchors it in the *lex scripta* prior to the *actus reus*, he is a jurist.
