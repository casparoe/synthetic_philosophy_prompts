prompt: |-
  I am a high school student writing a paper for my ethics elective on Ayn Rand's critique of altruism, and I have come across a characterization of her position that I suspect is unfair in ways I cannot yet identify. It appears in an introductory chapter of a popular philosophy book; I would rather not name the book, partly because I am working from my own notes and cannot vouch for the wording, and partly because I do not want to charge an author with errors that may be mine. As I have it, the passage runs roughly like this:

  "Rand's central ethical claim is that altruism is a vice and selfishness a virtue. On her view the only rational thing a person can do is pursue his own interests, so any act that benefits someone else at some cost to oneself — giving to charity, helping a friend move, staying late for a colleague — is a betrayal of one's own life. She holds that human beings are selfish by nature and that morality should stop pretending otherwise, and she argues that a society organized around self-interest will maximize total well-being, which is why she defended unregulated capitalism. Her case against altruism is, at bottom, that it makes everyone worse off. The obvious difficulty is that nobody could actually live this way, since a world of pure self-interest would be a war of all against all; her ethics therefore stands refuted, and a reader who feels the pull of her prose should remember that the doctrine it dresses up is simply greed."

  I assume this is neither wholly right nor wholly wrong, and I want an audit rather than a defense. Please go through it claim by claim and tell me (1) what a serious reader of Rand would accept as accurate, (2) what is a common simplification that loses something important, and (3) what is a misrepresentation that a defender of Rand would reject, together with what the defender would put in its place. I am particularly interested in whether the passage has correctly identified the ground of her objection to altruism — the reason she thought it wrong — and whether the reason she actually gave is the one reported here. I would also like to know whether the concluding verdict ("her ethics stands refuted") follows from any of the accurate parts of the summary, or whether it is an independent objection that would have to be argued on its own; if it is independent, please say briefly what it would take to make it stick. My own hunch is that the last paragraph is too quick, but I cannot tell whether the fault lies in the objection or in the way her view has been stated.

  Two things to keep in mind. I am not asking for a bibliography, a reading list, or citations — I have no library access at the moment, so the substance is what I need. And I am a beginner: please explain any technical term you use rather than assuming it, and where a distinction is doing real work, say why it matters.

  Please end with a single final line of the form \answer{...} enclosing a one-word verdict on the fairness of the passage (Fair, Mostly fair, Mixed, Mostly unfair, or Unfair) followed by the single most consequential misrepresentation, in ten words or fewer.
