prompt: |-
  I direct the mediation office for a mid-sized city, handling roughly forty disputes a year — public-sector labor contracts, inter-departmental budget fights, occasionally a land-use conflict — each of which needs a written settlement proposal within about a week, produced by mediators with no training in game theory, and each of which will be read by both sides and by a commissioner who has to defend it publicly. I want those proposals generated from the Kalai–Smorodinsky principle rather than the Nash one: the settlement should be the point at which each side's gain over what it gets if talks collapse is the same fraction of the most it could possibly have hoped for, so that no side is ever made worse off by the feasible set expanding in its favor.

  Write me a procedure my mediators can actually run on a case: the questions to ask in order, what counts as a sufficient answer to each, how to elicit a credible disagreement point and a credible ideal payoff from parties who both have every incentive to inflate them, what to do when the issues are not all money and each side's scale of measurement has to be chosen rather than read off, and what to do when some item is indivisible and the feasible set is therefore not convex. Flag the steps that are really judgment calls wearing arithmetic.

  Then run it on two cases: a two-issue contract dispute where the procedure returns a split my own commissioner will hate, and a dispute containing one all-or-nothing item where the answer shifts depending on how the items are ordered. Close with what the procedure cannot do — where it should be set aside and a person should simply decide — and name the property the whole thing rests on, along with the point in a live negotiation where that property is most likely to be false.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Director of a Mediation Office (mid-sized city).
      *   **Context:** ~40 disputes/year (labor, budget, land-use). Written settlement proposals needed within a week. Mediators have *no* game theory training. Proposals read by both sides + a Commissioner (public defense).
      *   **Core Requirement:** Use the *Kalai-Smorodinsky (KS)* bargaining solution, *not* Nash.
      *   **KS Principle:** Equal relative gain from the disagreement point to the ideal point (Pareto frontier intersection with the line connecting disagreement and ideal points). Key property: Monotonicity (expanding the feasible set in one's favor shouldn't make one worse off).
      *   **Deliverables:**
          1.  A practical procedure for mediators (questions, sufficiency criteria, elicitation tactics, scaling non-monetary issues, handling indivisibilities/non-convexity).
          2.  Flag "judgment calls wearing arithmetic."
          3.  Run the procedure on two specific cases:
              *   Case A: Two-issue contract dispute (result the Commissioner will hate).
              *   Case B: All-or-nothing item (order dependence).
          4.  Closing: Limitations (when to abandon the procedure) + Name the core property + When it's most likely false.

  2.  **Deconstruct Kalai-Smorodinsky (KS) for Practitioners:**
      *   *Math:* Maximize $\lambda$ such that $u_i = d_i + \lambda(a_i - d_i)$, where $d$ is disagreement, $a$ is ideal (utopia) point, and $u$ is the solution on the Pareto frontier.
      *   *Challenge:* Mediators aren't mathematicians. Parties lie about $d$ (disagreement) and $a$ (ideal). Issues aren't always monetary (utility scaling). Feasible sets aren't always convex (indivisibles).
      *   *Tone:* Professional, directive, pragmatic, acknowledging the political reality (Commissioner).

  3.  **Drafting the Procedure (The "KS-Field-Protocol"):**
      *   *Step 1: Define the Disagreement Point ($d$).* This is the BATNA/WATNA. Need to make it credible.
          *   *Tactic:* "Best Alternative to a Negotiated Agreement" but verified.
          *   *Judgment Call:* Is the threat credible?
      *   *Step 2: Define the Ideal Point ($a$).* This is the "utopia" claim.
          *   *Tactic:* Ask for maximum conceivable gain, not just opening bid.
          *   *Judgment Call:* Is this physically/legally possible?
      *   *Step 3: Utility Scaling (Non-monetary).*
          *   *Tactic:* Trade-off questions. "How much money is this policy change worth?"
          *   *Judgment Call:* Equating apples to oranges.
      *   *Step 4: The Frontier & The Line.*
          *   *Tactic:* Find the Pareto efficient boundary. Draw the line from $d$ to $a$. Find intersection.
          *   *Judgment Call:* Defining efficiency.
      *   *Step 5: Indivisibles (Non-convexity).*
          *   *Tactic:* Randomization or "Time-sharing" (if applicable) or closest feasible point. KS assumes convexity usually. Need a workaround.
      *   *Flagging Judgment Calls:* Explicitly mark where human bias enters the math.

  4.  **Developing Case Study 1: The Contract Dispute (Commissioner Hates It):**
      *   *Scenario:* Police Union vs. City.
      *   *Issues:* Wage increase (%) and Oversight Board (Yes/No).
      *   *Setup:*
          *   Disagreement ($d$): Strike (0% raise, No Board) -> Utility 0 for both.
          *   Ideal ($a$): Union (10% raise, No Board), City (0% raise, Yes Board).
          *   *Twist:* The KS solution might give a moderate raise but *no* oversight board, or vice versa, based on the slope.
          *   *Commissioner Hate:* Why? Maybe it looks like "splitting the baby" in a way that ignores public sentiment (e.g., giving a high raise when the budget is tight, because the Union's "ideal" was anchored high). Or, more likely with KS, if the Union's feasible range is wider, they get more. Let's make it about the *scaling*. If the Union values wages linearly but the City values them exponentially (cost), KS might demand a high wage to equalize relative gain.
          *   *Refinement:* Let's make it about the *Ideal Point*. If the Union claims an ideal of 20% (even if unrealistic) and City claims 0% cost, KS splits the *relative* gain. If the Union's "max possible" is defined loosely, they get a bigger slice.
          *   *Better Twist:* The Commissioner hates it because KS preserves *proportions*. If the Union's "ideal" is legally possible but fiscally irresponsible, KS validates it as a baseline for proportion.
          *   *Specifics:* Wage (0-10%) vs. Benefits (Fixed vs. Tiered).
          *   *Result:* The math says 8% wage, but the budget only allows 5%. The KS formula ignores the "public defense" constraint, only the "feasible set." Wait, the feasible set *must* include the budget constraint.
          *   *Revised Case:* Labor vs. City. Issue 1: Salary. Issue 2: Pension Contribution.
          *   $d$: Strike (0, 0).
          *   $a_{union}$: (10% raise, 0% pension contrib).
          *   $a_{city}$: (0% raise, 10% pension contrib).
          *   Frontier: Linear trade-off.
          *   KS Solution: 5% raise, 5% pension.
          *   *Why Commissioner Hates It:* Because the "Ideal" for the City was anchored on a legal maximum that is politically toxic, and the "Ideal" for Union was anchored on a demand that is fiscally impossible. But if we treat them as the "Utopia" points, KS splits the difference.
          *   *Actually, let's look at the Monotonicity property.* If the City's budget improves (feasible set expands for City), KS says Union shouldn't lose. But if the expansion is asymmetric...
          *   *Let's go with the "Scaling" issue.* The Commissioner hates it because the procedure equates "Union Morale" with "Taxpayer Dollars" via a mediator's arbitrary conversion rate.
          *   *Decision:* I will construct a case where the KS solution is mathematically correct but politically suicidal because it ignores the *intensity* of public backlash, which isn't in the utility function.

  5.  **Developing Case Study 2: The Indivisible Item (Order Dependence):**
      *   *Scenario:* Land Use. One parcel of land. Two departments (Parks vs. Housing).
      *   *Issue:* Who gets the lot? (0 or 1).
      *   *Problem:* KS assumes convexity (you can split the lot). You can't.
      *   *Procedure Fix:* We have to bundle it with something else or use probability.
      *   *Order Dependence:* If we negotiate Land first, then Money, vs. Money then Land.
      *   *Setup:*
          *   Item 1: Land (Parks or Housing).
          *   Item 2: Cash transfer (to compensate the loser).
          *   If we solve Land first (Winner takes all), the KS calculation for Cash changes based on who won.
          *   If we solve as a package, the KS solution might suggest a lottery (probability 0.5 each) + cash.
          *   *The Prompt asks for:* "Answer shifts depending on how the items are ordered." This implies a sequential procedure failure.
          *   *Scenario:* Department A wants Server Upgrade (Indivisible). Department B wants Staff Bonus (Divisible).
          *   If we settle Server first (A gets it), B gets max Bonus.
          *   If we settle Bonus first...
          *   *Better:* Two indivisibles. Or one indivisible + one divisible where the valuation changes.
          *   *Let's use the "Land" example.* Parks vs. Housing. Plus a budget surplus to split.
          *   *Order 1:* Decide Land, then split Cash.
          *   *Order 2:* Split Cash, then decide Land.
          *   *Result:* Different outcomes because the "Disagreement Point" shifts after the first issue is settled.

  6.  **Closing: Limitations & The Core Property:**
      *   *Core Property:* **Individual Monotonicity** (or just Monotonicity). If the feasible set expands in favor of Player i, Player i should not be worse off.
      *   *When False:* In repeated games or reputation contexts. If I get a "better" deal today because the set expanded, but it ruins my reputation for toughness tomorrow, my *true* utility goes down. Also, in public sector, "feasible set" is political, not just mathematical.
      *   *When to Abandon:* When the "Disagreement Point" is war/violence (not a stable status quo), or when one party's utility is lexicographic (non-negotiable principles).

  7.  **Review and Refine:**
      *   *Tone Check:* Is it authoritative? Yes.
      *   *Constraint Check:* Did I flag judgment calls? Yes.
      *   *Math Check:* KS is about equal ratio of gains: $(u_1 - d_1) / (a_1 - d_1) = (u_2 - d_2) / (a_2 - d_2)$.
      *   *Commissioner Hate:* Make sure the outcome is defensible mathematically but indefensible politically.
      *   *Indivisible:* Ensure the order dependence is clear.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Case 1:* Make sure the Commissioner's hatred stems from the *KS property*. KS is monotonic. If the Union's "Ideal" is inflated, KS gives them more. The Commissioner hates it because the procedure validates inflated ideals.
      *   *Correction on Case 2:* Ensure the "Order Dependence" highlights the non-convexity problem. KS requires a convex set. If we force convexity via probability, it works. If we do sequential, it fails. I need to show the sequential failure.
      *   *Procedure:* Keep it step-by-step. "Ask this," "Accept if that."

  9.  **Drafting the Content:** (Mental Outline)
      *   **Header:** Protocol Name.
      *   **Section 1: The Protocol.** 5 Steps. Flags for judgment.
      *   **Section 2: Case 1 (Contract).** Wage vs. Oversight. Math leads to high wage, low oversight. Commissioner hates it because it looks like capitulation.
      *   **Section 3: Case 2 (Indivisible).** Land vs. Cash. Sequential vs. Package.
      *   **Section 4: Limitations.** Monotonicity. Reputation/Political reality.

  10. **Final Review against constraints:**
      *   "Questions to ask in order": Included.
      *   "Sufficient answer": Included.
      *   "Elicit credible disagreement/ideal": Included.
      *   "Non-money scaling": Included.
      *   "Indivisible/Non-convex": Included.
      *   "Flag judgment calls": Included.
      *   "Two cases": Included.
      *   "Commissioner hate": Included.
      *   "Order shifts": Included.
      *   "What it cannot do": Included.
      *   "Name the property": Individual Monotonicity.
      *   "Where property is false": Repeated interaction/Reputation.

      *Ready to write.*
answer: |-
  # PROTOCOL KS-7: KALAI–SMORODINSKY FIELD PROCEDURE
  **To:** Mediation Staff
  **From:** Director
  **Subject:** Settlement Proposal Generation (KS-7)

  You are not calculating Nash equilibria. You are not splitting the difference. You are calculating **Equal Relative Concession**. The goal is a point where both sides give up the same *percentage* of their maximum possible gain.

  This protocol converts that principle into a seven-step intake and calculation process. Follow it strictly. Where you see **[JUDGMENT]**, you are making a political call disguised as a mathematical one. Document your reasoning in the case file.

  ---

  ## PART I: THE PROCEDURE

  ### Step 1: Establish the Disagreement Point ($d$)
  **Question:** "If you leave this room today and talks collapse, exactly what happens tomorrow? Write down the specific budget, policy, or contract status."
  **Sufficient Answer:** A verifiable status quo or a specific, actionable contingency (e.g., "Strike begins," "Project halted by court order").
  **Elicitation Tactic:** Demand evidence. If a union claims a strike will yield 100% of demands, ask for the strike fund balance. If a department claims a budget cut will halt services, ask for the statutory minimum service level.
  **[JUDGMENT]:** You are deciding whether a threat is *credible*. If you reject a threat as a bluff, you are moving $d$. This changes the entire outcome.

  ### Step 2: Establish the Ideal Point ($a$)
  **Question:** "Assume you win everything physically, legally, and financially possible. What is the number? Not what you expect, but the absolute ceiling."
  **Sufficient Answer:** A number bounded by hard constraints (law, total budget, physical capacity), not by negotiation strategy.
  **Elicitation Tactic:** "Anchor Removal." Tell them: "This number is not your opening bid. It is the coordinate of your utopia. If you inflate this, you inflate the denominator of your own gain ratio, making your *relative* progress look smaller."
  **[JUDGMENT]:** You are deciding what is "physically possible." If you allow a fiscally impossible ideal, the KS solution will demand impossible concessions from the other side.

  ### Step 3: Utility Scaling (The "Common Currency")
  **Question:** "For the non-monetary issues (policy, oversight, timeline), how much money is equivalent to one unit of this issue?"
  **Sufficient Answer:** A conversion rate accepted by both parties for the purpose of the calculation (e.g., "One year of delay = $50k").
  **Elicitation Tactic:** Trade-off elicitation. "Would you take $X instead of this policy change?" Adjust $X$ until they are indifferent.
  **[JUDGMENT]:** **CRITICAL.** You are equating apples to oranges. A dollar to the City is taxpayer money; a dollar to the Union is take-home pay. You are imposing a social welfare function.

  ### Step 4: Map the Feasible Frontier ($S$)
  **Question:** "List every possible combination of issues that is legal and fundable."
  **Sufficient Answer:** A list of Pareto-efficient outcomes (where one side cannot gain more without the other losing).
  **Procedure:** Plot these on a graph using the scaled units from Step 3. Connect the outermost points to form the frontier.
  **[JUDGMENT]:** Defining "Efficiency." Sometimes a wasteful outcome is politically necessary. Excluding it here is a value judgment.

  ### Step 5: Handle Indivisibilities (Non-Convexity)
  **Condition:** If an item cannot be split (e.g., a Director position, a specific parcel of land).
  **Procedure:** You cannot run KS on a non-convex set. You must introduce **Probability** or **Time-Sharing**.
  **Action:** Convert "Who gets the lot?" to "What is the probability Party A gets the lot?"
  **[JUDGMENT]:** Parties often reject lotteries. If you force a "closest feasible point" instead of a probability, you violate the KS axiom. Decide if you will break the math or break the deal.

  ### Step 6: Calculate the KS Intersection
  **Math:** Draw a line from Disagreement ($d$) to Ideal ($a$). Find where this line intersects the Feasible Frontier ($S$).
  **Formula:** Find outcome $u$ such that:
  $$ \frac{u_1 - d_1}{a_1 - d_1} = \frac{u_2 - d_2}{a_2 - d_2} $$
  *(Gain for Side 1 / Max Gain for Side 1) = (Gain for Side 2 / Max Gain for Side 2)*

  ### Step 7: Translate Back to Reality
  **Action:** Convert the utility numbers back into contract language.
  **Check:** Does this point exist in the real world? (See Step 5). If not, round to the nearest feasible efficient point.

  ---

  ## PART II: CASE RUNS

  ### Case 1: The Contract Dispute (The Commissioner's Nightmare)
  **Context:** Police Union vs. City Manager.
  **Issues:** Wage Increase (%) and Civilian Oversight Board (Yes/No).
  **Constraints:** Budget allows max 6% raise. Public demands Oversight.

  **The Inputs:**
  *   **Disagreement ($d$):** Strike. Union gets 0% raise, No Board. City gets 0% cost, No Board (services halted). Utility scaled to 0 for both.
  *   **Ideal ($a$):**
      *   Union: 10% Raise (ignoring budget cap, claiming "industry max"), No Board.
      *   City: 0% Raise, Yes Board.
  *   **Feasible Frontier:** Linear trade-off. To get Oversight, City must pay more to soothe Union. To get Raise, City must drop Oversight.
      *   Point A: 6% Raise, No Board (Max Budget).
      *   Point B: 0% Raise, Yes Board (Min Budget).

  **The KS Calculation:**
  *   Union Max Gain: 10 units (10% claim).
  *   City Max Gain: 10 units (Value of Oversight).
  *   Line $d$ to $a$ is a 45-degree line (Equal relative gain).
  *   Intersection with Frontier (constrained by 6% budget cap):
      *   The KS line hits the budget cap *before* it balances the Oversight issue.
      *   **Result:** 6% Raise, **No Oversight Board**.
      *   *Why?* To equalize relative gain, the Union needs 6/10ths of their ideal. The City can only give 6/10ths of their budget capacity. The "cost" of the Oversight Board in utility units is too high to fit on the KS line within the budget constraint.

  **The Outcome:** The Union gets the maximum cash the City can afford. The Public gets no Oversight.
  **Why the Commissioner Will Hate It:** Mathematically, it is fair (equal relative sacrifice). Politically, it is suicide. It looks like the City capitulated to the strike threat and abandoned reform. The KS procedure validated the Union's inflated "Ideal" (10%) as the denominator, making the 6% look like a "win" for the City, while ignoring that the Public's utility (Oversight) was zeroed out.
  **Lesson:** KS protects the *parties at the table*, not the *constituents outside the room*.

  ### Case 2: The Indivisible Item (Order Dependence)
  **Context:** Parks Dept vs. Housing Dept.
  **Issues:** 1. Vacant Lot (Indivisible: Parks or Housing). 2. Surplus Cash ($1M divisible).
  **Problem:** The lot cannot be split. We must run the procedure sequentially.

  **Sequence A: Decide Lot First, Then Cash**
  1.  **Lot:** KS suggests a 50/50 lottery (to equalize probability gain). Let's say Parks wins the Lot (Utility +10).
  2.  **Cash:** Now we negotiate $1M.
      *   Disagreement: Parks has Lot ($10), Housing has Nothing ($0).
      *   Ideal: Parks wants Lot + $1M. Housing wants $1M.
      *   Since Parks already "won" the big item, their marginal utility for cash is lower. KS shifts cash to Housing to equalize relative gain.
      *   **Result:** Parks gets Lot + $200k. Housing gets $800k.

  **Sequence B: Decide Cash First, Then Lot**
  1.  **Cash:** Split $1M evenly ($500k each) based on symmetric ideals.
  2.  **Lot:** Now negotiate the Lot.
      *   Disagreement: Both have $500k.
      *   Ideal: Winner takes Lot.
      *   KS on the Lot alone (binary outcome): 50/50 Lottery.
      *   **Result:** Winner gets Lot + $500k. Loser keeps $500k.

  **The Shift:**
  *   In Sequence A, the "Winner" of the indivisible item is heavily taxed in the second round to restore proportionality.
  *   In Sequence B, the split is cleaner.
  *   **Failure:** The KS solution is not path-independent when convexity is forced via sequencing. The "Disagreement Point" moves after Step 1, altering the ratio for Step 2.
  **Lesson:** Do not negotiate indivisibles sequentially. Bundle them and use a lottery, or the math will punish the party who "wins" the first round.

  ---

  ## PART III: LIMITATIONS & THE CORE PROPERTY

  ### Where to Abandon the Procedure
  Do not use KS-7 when:
  1.  **Lexicographic Preferences:** One side says "This principle is non-negotiable" (Utility is 0 or $\infty$, not scalable).
  2.  **Asymmetric Information on Feasibility:** If one side knows the budget is actually half of what is claimed, the "Ideal Point" is a lie, and the KS ratio is garbage.
  3.  **Third-Party Victims:** As seen in Case 1, if the settlement harms people not at the table (the public), KS will not detect it. In these cases, **you** must decide, not the formula.

  ### The Core Property
  The entire procedure rests on **Individual Monotonicity**.
  *Definition:* If the feasible set expands in a way that favors one party (their ideal point moves out, or new options benefit them), that party should never end up with a worse outcome than before.

  ### Where the Property is False
  **In Repeated Negotiations with Reputation.**
  In a live negotiation, "expanding the feasible set" often means "showing weakness." If you reveal you have more budget flexibility (expanding the set), the other side may harden their stance, effectively moving the *Disagreement Point* ($d$) against you.
  KS assumes the geometry of the deal is static. In reality, the geometry changes based on how you solve it. If a mediator uses KS to squeeze a "monotonic" gain for a union today, the City Manager may refuse to sit down next year, collapsing the entire institution.

  **Final Directive:** Use KS-7 to generate the *draft*. Then, look at the Commissioner. If the draft survives the "Front Page Test," send it. If not, override the math. You are the mediator, not the calculator.
