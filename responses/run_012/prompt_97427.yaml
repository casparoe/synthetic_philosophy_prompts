answer: |-
  (a) **The Verdict**
  Your friend will almost certainly pronounce the beginning of the Industrial Revolution in Britain **not inevitable**.

  His pattern suggests he views specific national successes or "positive" constructions (the survival of a movement, the success of a revolution, the rise of a bloc) as contingent, whereas systemic collapses or "negative" momentum (the fall of an empire, the outbreak of a war, the radicalization of a chaos) are often inevitable. Since the Industrial Revolution is a specific economic take-off in a specific location (Britain) rather than a systemic collapse, he will likely view it as dependent on a fragile conjuncture of factors (coal geography, patent laws, high wages) that could have failed to align, much like the American Revolution depended on French aid.

  (b) **Three Candidate Rules**
  Here are three precise rules that fit his six prior verdicts.

  **Rule 1: The Overdetermination Principle**
  *Definition:* An outcome is inevitable only if it is the product of multiple, independent causal chains converging on the same result, such that the removal of any single chain would not have prevented the outcome.
  *Implication:* If an outcome relied on a single point of failure (a specific person, a specific battle, a specific policy), it is not inevitable.
  *Fit:*
  *   *Rome/WWI/French:* Multiple pressures (economic, military, social) made these outcomes robust against single changes.
  *   *Reformation/Soviet/American:* Each relied on fragile links (Luther's protection, Gorbachev's restraint, French naval aid).

  **Rule 2: The Constraint on Prevention Principle**
  *Definition:* An outcome is inevitable only if the agents or institutions capable of preventing it lacked the structural capacity or knowledge to do so at the critical juncture.
  *Implication:* If the status quo *could* have been preserved by available means (military force, political compromise, economic adjustment) but wasn't, the change is not inevitable.
  *Fit:*
  *   *Rome/WWI/French:* Emperors could not stop the migrations; Diplomats could not stop the mobilization timetables; Moderates could not stop the Jacobin momentum. The "brakes" were broken.
  *   *Reformation/Soviet/American:* The Church could have excommunicated/caught Luther earlier; Soviet hardliners could have used force (as in China 1989); Britain could have committed more troops. The "brakes" existed but were not applied.

  **Rule 3: The Systemic Momentum Principle**
  *Definition:* An outcome is inevitable if it represents the continuation or culmination of a long-term structural trend (entropy, escalation), but not inevitable if it represents a reversal or a novel construction against the grain of the status quo.
  *Implication:* Collapses and escalations are inevitable; survivals and constructions are not.
  *Fit:*
  *   *Rome/WWI/French:* All represent the unfolding of decay or escalation.
  *   *Reformation/Soviet/American:* All represent the survival of a dissent or the construction of a new order against resistance.

  (c) **Application and Judgment**
  **Application to the Industrial Revolution:**
  *   **Rule 1 (Overdetermination)** predicts **Not Inevitable**. Economic historians (like Robert Allen or Kenneth Pomeranz) argue the British Industrial Revolution relied on a specific "conjuncture": coal located near water, high wages encouraging mechanization, and specific property rights. If you remove the coal or the patents, the outcome likely fails. It was not overdetermined; it was a "narrow path."
  *   **Rule 2 (Constraint on Prevention)** predicts **Not Inevitable**. Could the outcome have been prevented? Yes. The British state could have taxed coal heavily, refused to enforce patents, or been defeated in a war that disrupted trade (like the American Revolution case). The agents capable of stopping it (the Crown, Parliament, rival nations) had the capacity to do so.
  *   **Rule 3 (Systemic Momentum)** predicts **Not Inevitable**. Industrialization was a novel construction, a break from the Malthusian trap, not a systemic collapse.

  **Divergence:**
  In this specific case, all three rules converge on the same verdict ("Not Inevitable"). Therefore, the Industrial Revolution case alone cannot distinguish which rule your friend is running.

  **Judgment of the Actual Rule:**
  I judge your friend to be actually running **Rule 2: The Constraint on Prevention Principle**.

  *Reasons:*
  1.  **The WWI Verdict:** He explicitly cites "mobilization timetables" as the cause of inevitability. This is a technical constraint on agency (leaders physically could not stop the trains once started). This fits Rule 2 perfectly but is less about Overdetermination (Rule 1) and more about mechanical incapacity.
  2.  **The Soviet Verdict:** By calling 1989 "not inevitable," he implies the Soviet Union *had* the capacity to survive (via force) but chose not to use it. This is a pure Rule 2 judgment. Rule 1 would require him to analyze independent causal chains, which is harder to observe than the simple fact that the army didn't shoot.
  3.  **The French Verdict:** Calling the Radical Republic "inevitable" suggests that the Moderates (Girondins) lacked the *power* to stop the radicalization, not just that there were many causes for it.

  Rule 1 is a close second, but Rule 2 better explains the specific language he uses regarding "timetables" and "near extinction" (which implies a failure of prevention mechanisms).

  (d) **The Crucial Experiment**
  To force a choice between Rule 1 (Overdetermination) and Rule 2 (Constraint on Prevention), you need a case where structural pressures were overwhelming (suggesting Overdetermination), but the agents technically retained the capacity to resist (suggesting Constraint).

  **The Case:** **The appointment of Adolf Hitler as Chancellor of Germany in January 1933.**

  *   **Rule 1 (Overdetermination) Prediction:** **Inevitable.**
      *   *Reasoning:* By 1933, Germany faced a convergence of independent causal chains: the humiliation of Versailles, the hyperinflation trauma, the Great Depression, the fear of Communism, and long-standing anti-Semitic cultural currents. These multiple streams made the collapse of the Weimar Republic and the rise of a nationalist authoritarianism highly overdetermined. Blocking one factor (e.g., no Depression) might not have stopped the outcome given the others.
  *   **Rule 2 (Constraint on Prevention) Prediction:** **Not Inevitable.**
      *   *Reasoning:* The existing agents (President Hindenburg, the conservative elites, the Army) retained the structural capacity to prevent Hitler's appointment. They controlled the police and the military. They *chose* to appoint him believing they could control him. The "brakes" were functional but were voluntarily released.

  **The Decision:**
  If your friend says Hitler's rise was **inevitable**, he is prioritizing **Rule 1 (Overdetermination)**. He believes the structural pressures were so great that agency was an illusion.
  If your friend says it was **not inevitable**, he is prioritizing **Rule 2 (Constraint on Prevention)**. He believes that as long as the actors *could* have chosen differently (e.g., appointing Papen, declaring martial law), the outcome remains contingent, regardless of how many structural pressures existed.

  Given his verdict on the Soviet Union (where hardliners *could* have used force but didn't), I suspect he will say Hitler's rise was **not inevitable**, confirming Rule 2 as his primary heuristic. This would imply he views history as driven by the *capacity to resist change* rather than the *pressure for change*.
