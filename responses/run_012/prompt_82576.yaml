answer: |-
  The philosophical project of naturalizing the mind and the living world often rests on the claim that complex, purposeful phenomena can emerge from simple, purposeless mechanisms. Daniel Dennett has famously championed this view by drawing a tight analogy between Charles Darwin's theory of natural selection and Alan Turing's theory of computation. In both cases, Dennett argues, we witness an inversion of reasoning: what was once thought to require a prior intelligent agency is shown to be the product of a blind, mechanical process. This supports the sweeping claim that "competence" (the ability to perform a function correctly) can be fully explained without "comprehension" (the understanding of why the function is performed). However, a critical examination reveals that the logical structure of these two inversions is not identical. To properly assess the strength of Dennett's analogy, one must introduce a distinction often overlooked in the literature: the difference between a horizontal inversion and a vertical inversion. By analyzing Darwin's inversion as primarily horizontal and Turing's as primarily vertical, we can determine whether they are instances of a single phenomenon and whether their union successfully licenses the claim that all competence is ultimately competence without comprehension.

  To begin, we must define the two types of inversion. A horizontal inversion reverses the order of explanation along a temporal or causal sequence. In a traditional teleological view, the end goal (the product) is posited as the cause of the process; the process exists *because* of the product it was supposed to produce. A horizontal inversion corrects this by explaining the product solely by the process that produced it, removing the future goal from the causal history. A vertical inversion, by contrast, reverses the order of explanation along a level of description. In a traditional dualist or vitalist view, a higher-level function (like meaning or life) is thought to drive or imbue the lower-level mechanism. A vertical inversion explains the higher-level function entirely by the lower-level mechanism that realizes it, showing that the "higher" property is an emergent effect of the "lower" operations.

  Viewed through this lens, Darwin's inversion is fundamentally horizontal. Before Darwin, the apparent design in nature—the eye, the wing, the orchid—was explained by positing a Designer. The logic was that the complex product (the organism) necessitated a prior intelligent cause. The process of creation was understood backwards, starting from the intended result. Darwin inverted this sequence. He showed that the "design" is the cumulative result of a long, temporal chain of variations and selections. The process does not aim at the product; rather, the product is the sediment of the process. The explanation moves along the timeline of history: from blind variation in the past to adapted design in the present. There is no appeal to a higher level of reality, but rather a correction of the causal arrow in time. The "foresight" is an illusion created by the hindsight of survival.

  Turing's inversion, however, is primarily vertical. Before Turing, intelligence and mathematical reasoning were viewed as activities of a mind possessing understanding or semantic grasp. The assumption was that to manipulate symbols correctly (competence), one must grasp what the symbols mean (comprehension). This posits a higher-level property (meaning) as the driver of the lower-level activity (symbol manipulation). Turing showed that a machine could manipulate symbols based solely on their shape (syntax) without any access to their meaning (semantics). The higher-level function (intelligence) is realized by the lower-level mechanism (state transitions and symbol shuffling). This is not primarily a claim about the history of the machine, but about its structural layers. The "understanding" is not a prior cause in time, but a higher-level description that supervenes on the lower-level syntax. The inversion lies in showing that the top layer is fully supported by the bottom layer, without the bottom layer needing to contain the top layer's properties.

  Does this difference in orientation—horizontal versus vertical—undermine the claim that these are instances of a single phenomenon? Superficially, it suggests a disanalogy. One inversion fixes a mistake about time and cause; the other fixes a mistake about structure and realization. However, this difference does not break the analogy; rather, it complements it. Both inversions share the same logical core: the displacement of a "miracle" by a "mill." In both cases, a property that seems to require a top-down injection of intelligence (Design in biology, Understanding in cognition) is shown to be the bottom-up output of a mindless mechanism. Whether the mechanism operates over eons (Darwin) or in clock cycles (Turing), the explanatory strategy is identical. We explain the sophisticated capacity by the accumulation of simple steps, rather than explaining the simple steps by the sophisticated capacity. Therefore, despite the dimensional difference, the two inversions are the same in kind regarding their explanatory power. They both demonstrate that the appearance of a "reason" does not require a "reasoner" at the foundation.

  This conclusion, however, faces significant objections. The first objection comes from the Darwinian side. Critics argue that the Darwinian inversion is not really an inversion at all because natural selection is not a reasoner. To say it is an inversion implies there was a previous view that nature *was* a reasoner. But surely, the objection goes, pre-Darwinian naturalists knew nature wasn't a human-like mind; they simply posited a Divine Architect. Since natural selection is just a physical process, there is no logical inversion, only a replacement of one cause (God) with another (Physics).

  This objection fails because it conflates ontology with epistemology. The inversion Dennett identifies is in the *logic of explanation*, not necessarily in the physical ontology. The pre-Darwinian explanatory structure was teleological: the function of the eye explains the existence of the eye's parts. This treats the future function as a causal antecedent. Darwin inverted this explanatory logic: the history of the parts explains the function. Even if the "Designer" was God, the logical error was assuming that Design implies a Designer in the causal chain. Darwin showed that the "Designer" is a metaphor for the cumulative process. The inversion stands because it reverses the dependency: the "goal" is dependent on the "process," not the process on the "goal."

  The second objection arises from the Turingian side. Critics argue that the Turingian inversion is illusory because a Turing machine only computes what it is designed to compute by a human. The machine has no understanding, true, but its competence is borrowed from the human programmer who *does* have understanding. Therefore, competence ultimately rests on comprehension somewhere in the chain, just not in the machine itself. If so, the claim that competence can be *fully* explained without comprehension is false; it merely pushes the comprehension back a step.

  This objection is compelling but ultimately limited. It holds for simple, hard-coded algorithms, but it breaks down in the context of modern evolutionary computation and neural networks. In these systems, the "designer" sets the initial conditions and selection criteria, but does not comprehend the specific solution the machine arrives at. The machine often develops competences that surprise its creators, utilizing pathways the designer did not foresee and does not understand. Here, the competence is genuinely without comprehension, even on the part of the creator. Furthermore, even in simple machines, the "comprehension" of the designer is itself the product of biological evolution (the Darwinian inversion). If the designer's comprehension is itself composed of competence without comprehension at the neuronal level, then the regress stops. The Turingian inversion holds because the immediate mechanism of the intelligence requires no understanding to operate, regardless of where the machine came from.

  In conclusion, the distinction between horizontal and vertical inversions clarifies rather than complicates Dennett's argument. Darwin's horizontal inversion corrects our view of causal history, showing that design is the residue of time and selection. Turing's vertical inversion corrects our view of structural hierarchy, showing that intelligence is the output of syntax and state. While they operate on different axes, they are functionally equivalent in their philosophical impact. Both demonstrate that the higher-order property is an emergent effect, not a foundational cause. The objections regarding the nature of selection and the role of the human designer fail to dismantle this core insight. The Darwinian objection misunderstands the inversion as ontological rather than explanatory, and the Turingian objection fails to account for systems where the designer's comprehension does not dictate the specific competence. Consequently, the analogy between Darwin and Turing is strong enough to support the claim that the two inversions are instances of a single phenomenon: the naturalization of purpose. We are justified in concluding that competence is, at its root, competence without comprehension. The "mind" is not the ghost in the machine, nor the gardener in the jungle; it is the harvest of the mill.
