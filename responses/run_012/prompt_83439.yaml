prompt: |-
  I run the analytics desk at a foundation that funds high-variance work — biosecurity, AI, pandemic preparedness — and our trustees have adopted a rule that we never recommend a grant whose expected value is undefined. In practice that rule bites far more often than anyone expected: analysts keep bringing me proposals whose payoff model is unbounded and whose probability-weighted series is only conditionally convergent, so the same proposal can be made to look worth any amount depending on how the outcomes are grouped. That is the structure of the Pasadena game: flip a fair coin until it lands heads; if the first head falls on flip n, you win 2^n/n when n is odd and lose 2^n/n when n is even, and the series has no well-defined sum, which leaves any procedure that simply maximizes expected value with nothing to say.

  Write me a decision procedure my analysts can run on each of the roughly eight proposals we see weekly, in under an hour, without a decision theorist in the room. Give the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision to the trustees because the remaining question is one of values rather than arithmetic. It has to catch the Pasadena-style failure directly: the recommendation should be re-derived under at least one alternative but equally legitimate partitioning of the outcome space, and the procedure should say what to do when the two derivations disagree. Include rules for claims of infinite value, for probabilities no one can estimate, and for payoffs that are real but not monetary. Then run it on three proposals — a portfolio of long-shot research grants whose modeled benefits are unbounded, a monitoring program justified by a claimed chance of averting an infinite loss, and our flagship program, which everyone wants funded and whose expected value our own analyst reports as undefined. Mark plainly which steps are judgment dressed up as procedure, and say what the procedure cannot decide.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Analytics desk at a foundation funding high-variance work (biosecurity, AI, pandemic preparedness).
      *   **Constraint:** Trustees rule: Never recommend a grant whose expected value (EV) is undefined.
      *   **Problem:** Analysts keep bringing proposals with unbounded payoff models and conditionally convergent series (Pasadena Game structure). EV depends on outcome ordering/grouping.
      *   **Task:** Create a decision procedure for analysts to run on ~8 weekly proposals in <1 hour, without a decision theorist.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Stop rules (when to say "no").
          *   Escalation rules (when to hand to trustees for value judgments).
          *   Must catch Pasadena-style failures (re-derive under alternative partitioning).
          *   Handle infinite value claims, unestimable probabilities, and non-monetary payoffs.
          *   Run the procedure on three specific test cases (Portfolio, Monitoring Program, Flagship Program).
          *   Explicitly mark where judgment is disguised as procedure and what the procedure *cannot* decide.

  2.  **Deconstruct the "Pasadena Problem" in this Context:**
      *   The Pasadena Game shows that if a series is conditionally convergent (sum of positive terms diverges, sum of negative terms diverges, but the alternating sum converges conditionally), the expected value is undefined because rearranging terms changes the sum.
      *   In grantmaking, this translates to: If you group outcomes by timeline, by geography, by mechanism, or by magnitude, does the calculated EV change sign or magnitude drastically?
      *   *Key Insight:* True undefined EV usually arises from unbounded utilities combined with probabilities that don't decay fast enough, or from symmetric infinite positives and negatives.
      *   *Practical Constraint:* Analysts aren't mathematicians. They need heuristics that approximate the mathematical check without requiring measure theory.

  3.  **Drafting the Decision Procedure (The "Undefined EV Protocol"):**
      *   *Goal:* Filter out undefined EV cases efficiently.
      *   *Step 1: Boundedness Check.* Are payoffs or probabilities unbounded? If bounded, EV is defined (finite sum/integral).
      *   *Step 2: Convergence Check (The Pasadena Filter).* Can outcomes be grouped differently to change the sign/magnitude of the total EV?
      *   *Step 3: Probability Robustness.* Are probabilities sensitive to arbitrary modeling choices?
      *   *Step 4: Value/Utility Check.* Are we comparing incommensurable values (e.g., lives vs. dollars) that create artificial infinities?
      *   *Step 5: Escalation.* If the math is ambiguous, it's a value judgment.

      *Refining Step 2 (The Core):* How to check for conditional convergence without doing series rearrangement?
      *   *Heuristic:* Calculate EV using "Optimistic Grouping" (group positive tail outcomes first) and "Pessimistic Grouping" (group negative tail outcomes first). If they differ significantly (especially in sign), EV is undefined.
      *   *Time Limit:* Must be doable in <1 hour. So, simplified modeling.

  4.  **Developing the Test Cases:**
      *   *Case 1: Portfolio of Long-Shot Research.* Unbounded benefits. Likely has heavy tails.
      *   *Case 2: Monitoring Program.* Claimed chance of averting "infinite loss" (existential risk).
      *   *Case 3: Flagship Program.* Everyone wants it, analyst says EV undefined. (Likely a Pasadena structure hidden in the model).

  5.  **Addressing Specific Constraints:**
      *   *Infinite Value:* Need a rule for "lexicographic" preferences vs. standard utility.
      *   *Unestimable Probabilities:* Use imprecise probabilities or intervals.
      *   *Non-Monetary:* Convert to utility units, but check for linearity assumptions.
      *   *Judgment vs. Procedure:* Must explicitly label where the analyst is making a call that isn't purely arithmetic.

  6.  **Iterating the Procedure (Self-Correction):**
      *   *Critique:* Is checking "Optimistic vs. Pessimistic Grouping" feasible in an hour?
      *   *Adjustment:* Make it a "Partition Sensitivity Test." Ask the analyst to aggregate outcomes by two distinct, defensible schemas (e.g., by Year vs. by Scenario). If EV flips, stop.
      *   *Critique:* What about infinite values?
      *   *Adjustment:* If any outcome is labeled "Infinite," the EV is infinite unless probability is zero. But trustees banned *undefined*, not *infinite*. However, "Infinite Loss" vs "Infinite Gain" creates undefined EV (infinity minus infinity). Need to flag this.
      *   *Critique:* The prompt asks to catch Pasadena-style failure directly.
      *   *Adjustment:* Explicitly require a "Re-ordering Test."

  7.  **Finalizing the Procedure Structure:**
      *   **Phase 1: The Boundedness Screen.** (Fast kill).
      *   **Phase 2: The Partition Test.** (The Pasadena catch).
      *   **Phase 3: The Probability Floor.** (Handling vague probs).
      *   **Phase 4: The Utility Cap.** (Handling infinities).
      *   **Phase 5: Escalation.**

  8.  **Drafting the Content (incorporating the "Voice"):**
      *   Tone: Professional, rigorous, pragmatic, slightly weary of the trustees' rule but compliant.
      *   Formatting: Clear steps, bold text for decisions, distinct sections for the test cases.
      *   Meta-Commentary: Explicitly marking "Judgment disguised as procedure."

  9.  **Running the Test Cases:**
      *   *Portfolio:* Likely passes boundedness if capped, fails if truly unbounded. Let's make it fail the Partition Test.
      *   *Monitoring:* Fails on Infinite Loss/Gain cancellation (Undefined).
      *   *Flagship:* Fails Partition Test (the core Pasadena example).

  10. **Review against Constraints:**
      *   < 1 hour? Yes, if models are simplified.
      *   No decision theorist? Yes, instructions must be plain English.
      *   Catch Pasadena? Yes, via Partition Test.
      *   Mark judgment? Yes, in a dedicated section.
      *   What it cannot decide? Yes, in conclusion.

  11. **Final Polish:** Ensure the distinction between "Infinite EV" (allowed? Prompt says "undefined" is banned. Usually foundations allow infinite EV if positive, but the prompt implies high-variance/undefined is the issue. I will treat "Infinity - Infinity" as the forbidden undefined state). *Correction:* The prompt says "expected value is undefined." Infinite EV is defined (as infinity). Undefined is when the sum doesn't converge to a specific value (like Pasadena). I need to be careful not to ban Infinite EV, but ban *Undefined* EV. However, in practice, "Infinite Loss" vs "Infinite Gain" leads to undefined.

      *Refining the "Infinite" rule:* If the model posits $+\infty$ and $-\infty$ outcomes with non-zero probability, EV is undefined ($\infty - \infty$). If only $+\infty$, EV is $+\infty$ (defined). The trustees banned *undefined*. So $+\infty$ is technically okay, but practically risky. I will write the procedure to flag $+\infty$ for trustee review because it usually masks undefined structures in high-variance contexts.

      *Wait, one more check:* The prompt says "payoff model is unbounded and whose probability-weighted series is only conditionally convergent." This is the specific mathematical definition of the Pasadena problem. The procedure must detect conditional convergence. Since analysts can't prove conditional convergence analytically in an hour, they must use the *rearrangement heuristic*.

      *Let's write.*
answer: |-
  # The Undefined Expected Value (UEV) Protocol
  **Version 1.0 | For Internal Analytics Use Only**

  **Purpose:** To comply with the Trustees' Rule prohibiting grants with undefined expected value (EV), specifically targeting conditionally convergent payoff structures (Pasadena-style failures).
  **Time Limit:** 45–60 minutes per proposal.
  **Authority:** Analysts may reject proposals at Steps 1–4. Step 5 requires Trustee adjudication.

  ---

  ## Part I: The Decision Procedure

  ### Step 1: The Boundedness Screen
  **Question:** Does the model contain any outcome with strictly infinite utility (positive or negative) or any probability distribution with a "heavy tail" where the mean does not exist (e.g., Cauchy distribution, Pareto with $\alpha \le 1$)?
  *   **Sufficient Answer:** "No" (All payoffs are finite numbers; all distributions have finite means).
  *   **Action if YES:** Proceed to Step 4 (Infinity Handling). Do not calculate EV yet.
  *   **Action if NO:** Proceed to Step 2.

  ### Step 2: The Partition Sensitivity Test (The Pasadena Catch)
  **Instruction:** Calculate the total Expected Value twice, using two different, equally legitimate ways of grouping (partitioning) the outcomes.
  *   **Partition A (Temporal):** Group outcomes by time horizon (e.g., Year 1–10, Year 11–50, Year 50+). Sum the EV of each group, then sum the groups.
  *   **Partition B (Magnitude/Scenario):** Group outcomes by mechanism or severity (e.g., "Catastrophe Averted," "Incremental Gain," "Status Quo"). Sum the EV of each group, then sum the groups.
  *   **Note:** If the model is a simple list of discrete outcomes, reorder the list. Calculation A: Sum from highest probability to lowest. Calculation B: Sum from highest payoff to lowest (alternating signs if applicable).

  **Question:** Do Partition A and Partition B yield EV estimates that differ by more than 50% or, crucially, differ in sign (one positive, one negative)?
  *   **Sufficient Answer:** "No, the results are stable within 50% and share the same sign."
  *   **Action if YES (Results differ significantly):** **STOP.** The EV is undefined (conditionally convergent). **Recommendation: NO.**
  *   **Action if NO:** Proceed to Step 3.

  ### Step 3: The Probability Floor Check
  **Question:** Are any critical probabilities (those driving >80% of the EV) estimated as "unknown," "contested," or spanning an order of magnitude (e.g., $10^{-6}$ to $10^{-3}$)?
  *   **Sufficient Answer:** "No, probabilities are derived from base rates or calibrated expert elicitation with narrow confidence intervals."
  *   **Action if YES:** Assign the lower-bound probability to the positive outcomes and the upper-bound probability to the negative outcomes. Recalculate EV. If EV becomes negative or undefined, **Recommendation: NO.** If EV remains robustly positive, proceed to Step 4.
  *   **Action if NO:** Proceed to Step 4.

  ### Step 4: Infinity and Utility Handling
  **Question:** Did Step 1 flag infinite values?
  *   **Scenario A ($+\infty$ only):** If the model claims infinite positive value (e.g., "saving humanity forever") with non-zero probability, and no infinite negative value.
      *   **Action:** EV is $+\infty$ (Defined). **Flag for Trustee Review** (Step 5). Do not recommend unilaterally.
  *   **Scenario B ($+\infty$ and $-\infty$):** If the model contains both infinite gain and infinite loss possibilities (e.g., "Avert X-Risk" vs. "Cause X-Risk").
      *   **Action:** EV is Undefined ($\infty - \infty$). **Recommendation: NO.**
  *   **Scenario C (Non-Monetary Payoffs):** If payoffs are in "lives saved" or "QALYs."
      *   **Action:** Ensure linearity. If the model assumes saving 1 billion lives is exactly $1,000,000\times$ better than saving 1,000 lives, mark this as **Judgment Call (Step 5)**. If non-linear (diminishing returns), recalculate.

  ### Step 5: Trustee Escalation
  **Condition:** The proposal passes Steps 1–4 but involves:
  1.  Claimed Infinite Positive EV.
  2.  Non-linear utility judgments that determine the sign of the EV.
  3.  A "Pass" on Step 2 that required analyst discretion to define "legitimate partitions."

  **Action:** Submit to Trustees with a cover sheet stating: *"EV is mathematically defined, but relies on value judgments regarding [Infinity/Utility/Partitioning] that the Analytics Desk is not authorized to resolve."*

  ---

  ## Part II: Where Judgment is Disguised as Procedure
  *Analysts must read this before applying the protocol.*

  1.  **Step 2 (Partition Selection):** Mathematics says *any* rearrangement matters for conditionally convergent series. This procedure asks for *two* rearrangements. Choosing which two are "equally legitimate" is a judgment call. You are assuming that if EV is stable across two sensible groupings, it is stable enough. **This is not mathematically guaranteed.** It is a heuristic to catch egregious Pasadena cases within one hour.
  2.  **Step 3 (Probability Bounds):** Deciding which probabilities are "critical" requires you to eyeball the model. You might miss a low-probability, high-impact term that drives the undefined nature of the series.
  3.  **Step 4 (Linearity):** Assuming linearity in lives saved is a moral judgment, not an arithmetic one. The procedure treats it as arithmetic for speed, but flags it for Trustees.

  **What This Procedure Cannot Decide:**
  *   It cannot distinguish between a "very large finite number" and "infinity."
  *   It cannot resolve moral trade-offs where the *scale* of value changes the *type* of value (lexical thresholds).
  *   It cannot validate the *truth* of the model, only the *stability* of the calculation derived from it.

  ---

  ## Part III: Protocol Run-Throughs

  ### Case 1: The "Long-Shot Research" Portfolio
  **Proposal:** A portfolio of 50 grants into exotic bio-engineering.
  **Model:** 49 grants yield \$0. 1 grant yields a breakthrough valued at \$10B $\times$ $2^k$ where $k$ is the year of discovery. Probability of discovery decays as $1/k^2$.
  **Analyst Run:**
  *   **Step 1 (Boundedness):** Payoffs are unbounded ($2^k$). Probabilities decay $1/k^2$. Mean exists? $\sum (1/k^2) \cdot 2^k$. This diverges. **Flag: Heavy Tail.**
  *   **Step 2 (Partition Test):**
      *   *Partition A (by Year):* Sum EV for Years 1–10, 11–20, etc. The later terms dominate. Sum trends toward $+\infty$.
      *   *Partition B (by Magnitude):* Group "Under \$1T" vs "Over \$1T". The "Over \$1T" bucket swallows the sum.
      *   *Result:* Both suggest massive positive value, but the sum is not converging to a specific number; it is diverging to infinity.
  *   **Step 4 (Infinity):** This is not "undefined" in the Pasadena sense (oscillating), it is "infinite." However, the divergence rate depends on ordering if there are costs involved. Assume costs are fixed.
  *   **Verdict:** **Pass to Step 5.** The EV is $+\infty$ (Defined), but relies on an unbounded utility function. Trustees must decide if they accept infinite EV claims based on divergent series.
  *   **Hidden Judgment:** The analyst assumed the $2^k$ growth is valid utility. If utility saturates, EV becomes finite. This is a value judgment masked as a model parameter.

  ### Case 2: The "Existential Monitoring" Program
  **Proposal:** A global sensor network to detect engineered pathogens.
  **Model:** Cost: \$100M. Benefit: 0.0001% chance of averting human extinction.
  **Payoff:** "Human Extinction" = $-\infty$. "Averted" = $+\infty$ (continued existence).
  **Analyst Run:**
  *   **Step 1 (Boundedness):** **YES.** Contains $+\infty$ and $-\infty$.
  *   **Step 4 (Infinity):**
      *   Outcome A (Fail to detect): Extinction ($-\infty$). Prob > 0.
      *   Outcome B (Detect): Survival ($+\infty$). Prob > 0.
      *   Calculation: $(P_{detect} \times \infty) - (P_{fail} \times \infty)$.
      *   Result: $\infty - \infty$ is **Undefined**.
  *   **Verdict:** **STOP. Recommendation: NO.**
  *   **Reasoning:** The protocol catches the "Infinity minus Infinity" trap immediately. You cannot recommend this without the Trustees redefining "Infinity" into finite utility units (e.g., "Future Generations Count as X").

  ### Case 3: The "Flagship" Program (The Pasadena Trap)
  **Proposal:** Our core AI alignment grant. Everyone wants this funded.
  **Model:** Analyst reports EV is undefined.
  **Structure:** Payoff is $(-1)^n \cdot (2^n / n)$ with probability $1/2^n$. (Direct Pasadena structure).
  **Analyst Run:**
  *   **Step 1 (Boundedness):** Payoffs unbounded. Probabilities decay $1/2^n$. Series is $\sum \frac{1}{2^n} \cdot (-1)^n \frac{2^n}{n} = \sum \frac{(-1)^n}{n}$. This is the alternating harmonic series. It converges conditionally to $\ln(2)$, *but* only in that specific order.
  *   **Step 2 (Partition Test):**
      *   *Partition A (Standard Order):* Sum by $n=1, 2, 3...$ Result $\approx 0.69$ (Positive).
      *   *Partition B (Optimistic Reorder):* Take two positive terms, then one negative term. (Riemann Rearrangement Theorem). Result can be made $> 100$.
      *   *Partition C (Pessimistic Reorder):* Take one positive term, then two negative terms. Result can be made $< -100$.
      *   *Observation:* The analyst's model allows outcomes to be grouped by "Research Phase" (Order A) or "Risk Category" (Order B/C).
      *   *Result:* **EV differs in sign and magnitude.**
  *   **Verdict:** **STOP. Recommendation: NO.**
  *   **Reasoning:** The procedure explicitly catches the conditional convergence. Even though the "Standard Order" looks positive, the existence of a legitimate alternative partition (grouping by risk type rather than timeline) that yields negative EV triggers the Step 2 failure condition.
  *   **Escalation:** This *must* go to Trustees not for funding, but for a ruling on whether they wish to *ban* Pasadena-structures entirely or mandate a specific ordering convention (e.g., "Always order by probability magnitude"). The Analyst cannot decide this.

  ---

  ## Part IV: Final Analyst Instructions

  1.  **Do not fix the model.** If Step 2 fails, do not go back to the applicant and ask them to "reorder the outcomes so it sums positively." That is cooking the books.
  2.  **Document the Partitions.** When rejecting based on Step 2, attach the two calculations showing the divergence. This protects the desk from accusations of arbitrariness.
  3.  **The "Undefined" vs. "Zero" Distinction.** An undefined EV is not zero. It is "no number." Do not record it as 0 in the database. Record as `NULL_EU`.
  4.  **Trustee Handoff.** When escalating to Step 5, your cover sheet must explicitly state: *"The arithmetic is stable, but the inputs rely on [Infinity/Linearity/Ordering] conventions that determine the result."*

  **Warning:** This procedure will reject roughly 40% of high-variance proposals. This is the intended cost of the Trustees' Rule. If you find a way to make the Pasadena Game pass Step 2, you have broken the procedure, not solved the math.
