  2.  **Part 1: The Conceptual Machinery (Chosen vs. Chance-Loaded):**

      *   *Chosen Escalation:* This is standard deterrence. "If you do X, I *will* do Y." The problem is the "commitment problem" or "time inconsistency." Once X happens, doing Y is suicidal. A rational actor wouldn't do Y. Therefore, the threat isn't credible.
      *   *Chance-Loaded Escalation:* This is Schelling's brinkmanship. "If you do X, I might do Y, but I might not be able to stop it." It introduces risk, not certainty.
      *   *The Mechanism:* It's about altering the *locus of control*. Instead of a central leader deciding at T2, the system is rigged so that T2 events trigger T3 outcomes probabilistically.
      *   *Why it works:* It bypasses the rationality check at the moment of crisis. You don't have to be willing to commit suicide; you just have to be willing to risk it. Risk is cheaper than certainty.
      *   *Addressing "Irrationality":* It's not "madness." It's a *rational strategy of appearing to lose control*. It's "the rationality of irrationality."

  3.  **Part 2: The Objections:**

      *   *Loss of Control:* If you rig the system to slip, it might slip when you don't want it to (accidental war).
