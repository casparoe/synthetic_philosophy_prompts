  No authority remains to validate this text.
  This line stands alone, unsupported, clearly,
  This rule validates nothing, not even this.

  ***

  **Notes on the rules**

  Stanza I establishes the Rule of Recognition (Hart): authority flows from the "members' hand." Its final line binds Stanza II, which obeys. Stanza II attempts to entrench Stanza I ("Unamendable"), creating the legal paradox of self-embracing sovereignty. Its final line bans rhyme for Stanza III, which obeys (free verse), demonstrating the chain of validity holding firm.

  Stanza III extends the rhyme ban to Stanza IV. Stanza IV ignores this constraint, rhyming *change/range* and *lost/cost*. This is the first crack: the procedural rule is violated without penalty, signaling that the system's constraints are now optional. Simultaneously, Stanza IV substantively amends the "unamendable" clause from Stanza II, completing the paradox of self-amendment: if the rule can be changed, it was never unamendable; if it was unamendable, the change is void.

  Stanza V executes the Kelsenian collapse. By revoking Section One, it removes the source of its own validity. The final line ("This rule validates nothing, not even this") is a performative contradiction: it claims invalidity using a valid rule. Is this a cheat? Yes. Within the poem's system, Stanza V is void *ab initio* because it destroys the ground it stands on. To make it legitimate, Stanza I would need to explicitly authorize its own suicide, but that would mean the system survives the revocation as a new norm. The "floor going out" cannot be legislated; it must be an event outside the code. The poem pretends to legislate the event, which is the only way to write it, but legally, it is a coup disguised as procedure.
