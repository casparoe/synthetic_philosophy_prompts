answer: |-
  Five philosophers observe a man whisper a solemn promise to a wall in a soundproof room, then break it. No one ever finds out.

  The Reliance theorist says, "No one leaned on it, so he's clean."
  The Assurance theorist says, "He created no expectation, so he betrayed no one."
  The Humean says, "Without a social convention covering walls, the words were vapor."
  The Practice theorist says, "But the institution forbids secret exemptions."
  The Constitutive theorist says, "It doesn't matter. The speech act binds him regardless of audience. He owes the wall."

  They review the tape. The man was reading a script.
  The Constitutive theorist sighs. "No illocutionary intent. No promise."
  The Reliance theorist closes his notebook. "See? I told you damages would be zero."

  ***

  **Note on Philosophical Liberties**

  This joke relies on textbook glosses that obscure genuine disputes in the literature. 
  1.  **Reliance:** Treating reliance as a standalone *moral* theory of promising is contentious; it is primarily a measure of contract damages (Fuller and Perdue). Few moral philosophers argue reliance *alone* grounds the obligation, though it explains the harm.
  2.  **Assurance:** The "Assurance View" (often associated with Scanlon) typically requires both the creation of expectation and the intention to induce it. The joke treats these as separate steps for comedic clarity.
  3.  **Constitutive Rules:** The claim that a promise binds without an audience (uptake) is heavily disputed. Austin argued uptake is necessary for a successful speech act; Searleans might disagree. The joke assumes the Constitutive theorist believes uptake is unnecessary, only to trip over the intention condition.
  4.  **Practice View:** The joke implies the Practice View obligates even in total isolation. Critics (like Rawls himself later acknowledged) argue the Practice View explains the *form* of the obligation but struggles to explain why the practice itself is binding without further moral grounding.
  5.  **Mutual Exclusivity:** The philosophers are presented as holding mutually exclusive views, whereas contemporary accounts are often hybrid (e.g., a convention-based practice that generates reliance-based expectations).
