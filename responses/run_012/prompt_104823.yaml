      *   **Task:** Create a teaching plan for a 45-minute session on the "paradox of deontology" for a non-philosopher reading group (engineers/scientists).
      *   **Constraint 1:** No slides, just talking and whiteboard.
      *   **Constraint 2:** Output must be a specific JSON object structure.
      *   **Constraint 3:** The target concept is the tension in deontology: constraints protect persons/minimize harm in principle, but forbid minimizing harm in specific cases (agent-relative constraints vs. agent-neutral goals).
      *   **Constraint 4:** Avoid stock examples (Trolley, Transplant). Need a fresh case.
      *   **Constraint 5:** Avoid conclusions that "deontology is dumb" or "consequentialism wins."
      *   **Constraint 6:** The user knows the paradox roughly but wants a teaching plan.
      *   **Constraint 7:** JSON fields required: `session_arc`, `carrying_example`, `misconceptions`, `check_for_understanding`, `leave_out_and_say_so`.

  2.  **Deconstruct the Target Concept (Paradox of Deontology):**
      *   Deontology posits agent-relative constraints (e.g., "I must not kill").
      *   Consequentialism posits agent-neutral goals (e.g., "Minimize killing").
      *   The Paradox: If the *reason* for the constraint is to minimize harm/respect persons (the "goal" of the constraint), why does following the constraint sometimes lead to *more* harm/disrespect than violating it?
      *   If the reason is *not* to minimize harm, what is it? (Then it looks like rule worship).
      *   If the reason *is* to minimize harm, why forbid the violation? (Then it looks inconsistent).
      *   Goal for audience: Feel the tension, not solve it definitively.

