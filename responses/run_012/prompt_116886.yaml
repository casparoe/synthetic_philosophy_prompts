      *   *Text:*
      *   Welcome to The Regularity, where we clarify the unspoken rules that keep society functioning. Social friction arises not from malice, but from misaligned expectations regarding our shared regularities. Here is how to navigate them.

      *   **Dear Dr. Vance,**
      *   **Our office kitchen is a mess. Everyone leaves mugs in the sink. Nobody wants to wash them because nobody else does. It's unfair that I should clean up after strangers. How do I fix this?**
      *   **— Cleanliness Freak**

      *   **Dear Freak,**
      *   **You describe a textbook coordination problem. The population conforms to a regularity of leaving mugs because each conforms partly because the others do. Everyone expects others to leave mugs, and this is common knowledge. Unilateral deviation—washing everyone's dishes—goes badly for the deviator, who bears the cost without solving the recurrence. You cannot legislate cleanliness. You must wait for a salient precedent. Perhaps a new manager arrives and washes their mug, creating a new focal point. If others follow, the regularity shifts. If they do not, you have merely made yourself strange. Do not act alone. Wait for the equilibrium to tip.**

      *   **Dear Dr. Vance,**
      *   **I hate shaking hands. It feels archaic. I want to stop doing it and just nod. Am I allowed to break this habit? It feels like I owe people a handshake.**
      *   **— Modern Greeter**

      *   **Dear Greeter,**
      *   **Nothing is owed; there are only expectations. Handshaking is a convention sustained because deviation incurs a social cost. You may attempt to change this regularity, but you cannot authorize the change yourself. A convention changes when a new regularity takes hold via salient precedent. You may offer a nod. If others find this salient and follow, the convention has already changed. If they continue offering hands, you face a coordination failure. You must weigh the cost of being strange against the cost of shaking. No one can establish a convention alone. You are free to deviate, but you are not free from the consequences of deviation.**

      *   **Dear Dr. Vance,**
      *   **My best friend borrowed my car. We have a regularity of lending to each other. He crashed it. He says I owed him insurance coverage because we always help each other. I feel betrayed. He says I expected too much. Who is right?**
      *   **— Broken Trust**

      *   **Dear Trust,**
      *   **You ask who is right, but the question is what was expected. You had a regularity of lending, where each conforms because the others do. This sustained convergence among people with an interest in converging. The crash introduces a cost. Your friend claims your expectations included insurance; you claim they did not. This is not a matter of betrayal, but of common knowledge. Was it common knowledge that lending implied insurance coverage? If not, your expectations were not aligned. Where interests genuinely conflict, the apparatus of convention explains the divergence. You expected convergence; he expected coverage. Neither is forbidden. The regularity has fractured because the cost of conformity now outweighs the benefit. You may adjust your expectations to match the new cost, or cease the regularity. The machinery does not repair the car, but it explains why the silence follows the crash.**

