answer: |-
  Your position restores clarity to a debate often obscured by terminological overlap. The central claim is that counterfactual theories and interventionist theories are not competing answers to the same question. The counterfactual tradition addresses metaphysics: it seeks the truth conditions that make a causal claim obtain in the world. The interventionist tradition addresses methodology: it seeks the inferential rules that make causal claims useful for explanation, prediction, and control. Once this division of labor is accepted, the standard circularity objection against interventionism loses its bite. If interventionism is not offering a reductive analysis of causation in non-causal terms, then defining an intervention using causal concepts is not viciously circular. It is merely pragmatic. The intervention is an idealization within a model, not a primitive in the world's furniture.

  However, defending this requires showing that the split handles cases where metaphysics and methodology seem to collide. The relationship between a gas's temperature and the mean translational kinetic energy of its molecules is the crucial test. This is a constitutive relation, not a causal one. Temperature just is mean kinetic energy, scaled by a constant.

  For the counterfactual theorist, this case is initially problematic. If we rely solely on counterfactual dependence, we face symmetry. If the temperature had been higher, the mean kinetic energy would have been higher. If the mean kinetic energy had been higher, the temperature would have been higher. A naive counterfactual analysis implies mutual causation, which is metaphysically absurd here. To save the theory, the counterfactualist must concede that counterfactual dependence is necessary but not sufficient for causation. They must add a metaphysical constraint: causation requires distinct events or variables. Since temperature and kinetic energy are not distinct—they stand in a relation of identity or supervenience—the counterfactual dependence does not entail causation. This is a metaphysical amendment to the truth conditions.

  The interventionist handles this differently, confirming the methodological reading. In a structural causal model, variables must be distinct to admit of separate interventions. An intervention on variable X requires fixing X to a value independently of its parents. If temperature and kinetic energy are in the same model as cause and effect, no such intervention is possible. Changing temperature just is changing kinetic energy. There is no handle to grab one without grabbing the other. Therefore, the modeler is methodologically prohibited from drawing a causal arrow between them. This is not a discovery about the world's causal structure derived from the model; it is a constraint on model construction. The interventionist does not say the relation is non-causal because interventions fail; rather, interventions fail because the relation is non-causal, and the methodological rule is to exclude such pairs from causal graphs.

  This brings us to the distinction between constitutive locks and nomic locks, which your view must accommodate. A nomic lock occurs when two variables are distinct but linked by a strict law, such as pressure and volume in a closed system at constant temperature. Here, intervention is possible in principle. One can intervene on volume using a piston, which changes pressure. The variables are distinct existences, even if lawfully connected. A constitutive lock, like temperature and kinetic energy, denies distinctness. Interventionism can state this distinction, but only by relying on the modeler's prior metaphysical judgment about variable individuation. The formalism itself does not detect constitutive relations; it simply breaks if you try to force them into causal arrows. This confirms your thesis: interventionism is a methodology that presupposes metaphysical distinctions rather than analyzing them away. The circularity is benign because the method assumes the metaphysics it purports to clarify.

  Now we test your prediction: that interventionism excels at type-level claims while struggling with token causation, whereas counterfactual theories have the opposite profile. This prediction holds substantial water, though it requires nuance.

  Interventionism is inherently generalizing. Its core concept is invariance under a class of interventions. To say X causes Y is to say the relationship holds across a range of changes. This aligns perfectly with type-level causation, which concerns general relationships between variables. It is less natural for token causation, which concerns specific events occurring at specific times. While recent work has adapted interventionism for actual causation using path-specific constraints, these adaptations often reintroduce counterfactual machinery to distinguish causes from background conditions. Without counterfactuals about what would have happened in the specific token case, interventionism struggles to distinguish a preempting cause from a preempted backup in a single instance. The methodology of manipulation is designed for general control, not singular historical explanation.

  Conversely, the counterfactual tradition is naturally suited to token causation. It asks whether this specific effect would have occurred if this specific cause had been absent. It handles preemption and overdetermination by tracing dependencies between particular events. However, it struggles to elevate these tokens to types without additional machinery. Knowing that event c caused event e does not immediately tell us whether manipulating Cs will generally control Es. The counterfactual theorist must add laws or regularities to move from token truth conditions to type-level utility.

  Therefore, your prediction is largely correct. Interventionism earns its keep on type-level claims where invariance matters for control. Counterfactualism secures the metaphysics of token causation where distinct events and specific dependencies matter. The overlap occurs where token causation is analyzed using interventionist tools, but this usually requires importing counterfactual definitions of the intervention itself.

  Finally, we must distinguish what is settled from what is contested in this verdict. It is largely settled among experts that interventionism is not a reductive analysis. The community accepts that interventions are defined causally and that structural models rely on exogenous variables that are not themselves modeled. The circularity objection is no longer considered a fatal blow but a demarcation of scope. It is also settled that counterfactual dependence alone is insufficient for causation, given problems with symmetries and common causes.

  What remains contested is whether the metaphysics/methodology split is exhaustive. Some argue that interventionism implies an anti-realist metaphysics where causation is nothing over and above manipulability. Your view rejects this, treating manipulability as epistemic access rather than ontological ground. This is contested by those who believe a methodology cannot be so cleanly severed from metaphysics; if causation is defined by what we can do, the ontology shrinks to fit the method. Additionally, it is contested whether counterfactual theories can fully handle token causation without interventionist aids. Some argue that without the concept of an independent intervention, counterfactuals cannot resolve complex preemption cases without appealing to intuition pumps rather than rigorous criteria.

  Your position navigates these controversies by assigning each tradition its proper domain. The counterfactual theorist provides the truth conditions for singular causal claims, conceding that dependence requires distinctness. The interventionist provides the rules for modeling general causal relations, conceding that variable selection relies on prior metaphysical judgments. The gas case demonstrates that when these domains are confused, paradox arises. When they are distinct, the circularity of interventionism is revealed as a feature of its methodological role, not a flaw in its metaphysical ambition. The standoff dissolves because the rivals were never fighting over the same ground.
