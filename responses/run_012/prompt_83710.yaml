      *   *The Mechanism:* It's not a binary switch (Know/Don't Know). It's a spectrum of attention and avoidance. The brain creates compartments. One part processes the threat (the fraud), another part suppresses it to maintain stability (the business, the partnership, the identity).
      *   *The "Later Drawer":* This is a perfect metaphor. It's physicalized avoidance.
      *   *The "Nine PM Rule":* This is ritualized avoidance.
