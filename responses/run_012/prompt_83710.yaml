  3.  **Address the "Inside" Experience:**
      *   It feels like anxiety management.
      *   It feels like "trusting" someone because the alternative (confrontation) is too costly.
      *   It involves a active, energetic effort *not* to connect dots. It's not passive ignorance; it's active maintenance of ignorance.
