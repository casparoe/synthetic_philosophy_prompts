answer: |-
  Here are eight interview questions designed to bypass the standard "Bank Case" autopilot and press on the metaphysical and normative commitments of Pragmatic Encroachment (PE). Each includes a likely "rehearsed" move your guest will make, allowing you to pivot with the follow-up.

  ### 1. The Bridge Case: The Nature of the Epistemic Difference
  **Question:** Let's use your bridge case. Two agents have identical evidence regarding the structural integrity of a bridge. One is idly curious; the other must cross to save a life. You say the curious agent knows, but the rescuer does not. Since their doxastic states and evidence are identical, what *ontological* difference are you positing between them? Is knowledge a relation to a proposition that changes its relata based on stakes, or is it a hybrid state partly constituted by practical facts?

  **Likely Move:** He will likely deny that knowledge is a "hybrid state" and argue that knowledge is a *threshold* concept. The evidence provides a degree of confidence, but the *threshold* required to count as "knowledge" shifts with stakes. He'll say the cognitive state is the same, but the classification changes.
  **Follow-up:** If the cognitive state is identical, and the only difference is a label applied by the theorist based on external stakes, haven't you effectively conceded that the *epistemic* status is invariant, and only our *attribution* rules are pragmatic? How do you prevent this from collapsing into a form of interest-relative invariantism where the "knowledge" label is just a placeholder for "enough evidence for *this* action"?

  ### 2. The Contextualist Alternative
  **Question:** Contextualists claim they can accommodate the same data—that we hesitate to say "I know" in high stakes—by arguing that the word 'knows' picks out different relations in different contexts. Why is that insufficient? Do you think the Contextualist is saying something *false* about the world, or are they merely changing the subject to a linguistic phenomenon while you are tracking the metaphysical nature of knowledge itself?

  **Likely Move (Flagged as Rehearsed):** He will almost certainly argue that Contextualism fails to explain the *action* data. He'll say Contextualism explains why we hesitate to *speak*, but PE explains why we hesitate to *act*. He will claim Contextualism leaves the normativity of action unexplained.
  **Follow-up:** But if the Contextualist adopts a Knowledge Norm of Assertion *and* Action, they can say the standards for *appropriate action* shift with context without knowledge itself shifting. If you insist knowledge itself shifts, are you not conflating the *conditions for knowing* with the *conditions for relying*? What independent reason do we have to think the metaphysical state changes rather than just the rational permissions to use it?

  ### 3. The Knowledge Norm of Practical Reasoning (KNR)
  **Question:** Much of the motivation for PE comes from the thought that knowledge is the norm of practical reasoning: you should treat $p$ as a premise only if you know $p$. In high stakes, it's irrational to treat $p$ as a premise without further evidence. Does PE derive its plausibility primarily from this norm? If we rejected KNR in favor of a "Warranted Belief" norm, would the motivation for encroachment disappear?

  **Likely Move:** He will likely commit to KNR as the engine of the view. He'll argue that since knowledge is the unique norm of action, and stakes affect rational action, stakes must affect knowledge.
  **Follow-up:** This makes knowledge entirely subservient to action. But consider theoretical reasoning—deliberating about what to believe, not what to do. Does practical stakes encroach on knowledge gained in purely theoretical contexts? If not, doesn't that suggest knowledge has an epistemic core that PE is ignoring, and that you're actually describing a distinct state, like "action-ready certainty"?

  ### 4. The "Idle Wheel" Objection (Knowledge vs. Warranted Belief)
  **Question:** You distinguish between *knowledge* and *warranted belief*. In a high-stakes scenario where I lack knowledge due to stakes, you typically grant I still have warranted belief. If warranted belief is sufficient to justify my confidence and perhaps even some low-stakes actions, what explanatory work is left for 'knowledge' to do? Why not say I have knowledge, but I'm not warranted in *acting* on it?

  **Likely Move:** He will argue that "knowledge" is the specific state that *licenses* action without further inquiry. Warranted belief might justify confidence, but only knowledge justifies *closing inquiry* and acting. He'll say swapping the view (Knowledge + No Action) breaks the link between truth and success in action.
  **Follow-up:** But if I have warranted belief, I am epistemically rational. If I am epistemically rational, why is it a defect in my *epistemic* standing to lack knowledge? It sounds like you're defining knowledge as "warranted belief plus practical safety." If so, isn't knowledge on your view no longer a purely epistemic achievement, but a pragmatic one? Does this strip knowledge of its distinctive value?

  ### 5. Diachronic Stability (The Evaporation Objection)
  **Question:** Suppose I know the bridge is safe at noon when stakes are low. At 1 PM, a storm rises, and the stakes for crossing increase, though my evidence remains unchanged. On your view, I lose knowledge at 1 PM. How do you account for this diachronic loss without admitting that knowledge is oddly fragile? It seems the wrong kind of thing for an epistemic status to evaporate due to external practical changes unrelated to the truth of the proposition.

  **Likely Move:** He will bite the bullet. He'll argue that knowledge *is* fragile in this way, just as "being a safe bet" is fragile. He'll say our intuition that knowledge should be stable is an Intellectualist bias, not a datum.
  **Follow-up:** If knowledge evaporates, does my past assertion "I knew it at noon" become false retroactively? If I acted at noon, was I rational then but irrational now looking back? If the status of my past cognitive state depends on future stakes, doesn't this make knowledge assessment impossible for the agent at the time of action?

  ### 6. Opacity and Unaware Stakes
  **Question:** Are the stakes that matter objective or subjective? If I am unaware that my life depends on the bridge being sound, do I still lack knowledge because the objective stakes are high? If so, doesn't this make knowledge opaque to the knower in a way that violates the spirit of internalism, or even the KK principle?

  **Likely Move:** He will likely defend objective stakes. He'll say knowledge is a factive state dependent on the world, so if the world makes the stakes high, I don't know, even if I'm clueless. He might concede I don't know *that* I don't know.
  **Follow-up:** If I can't tell whether I know because I can't assess the objective stakes, how can knowledge function as a norm for me? A norm must be something I can aim at or check. If knowledge is hostage to facts I cannot access, aren't you describing a state that is useless for guiding the very reasoning it's supposed to norm?

  ### 7. High-Stakes Skepticism
  **Question:** In extremely high-stakes cases, the threshold for knowledge seems to approach certainty. Since we rarely have Cartesian certainty, does your view imply that in the most important moments of our lives, we almost never know anything? Is this a bug or a feature?

  **Likely Move:** He will likely call it a feature. He'll argue this explains why we are (and should be) so cautious in high stakes. He'll say it captures the intuition that "you can't be too sure" when lives are on the line.
  **Follow-up:** But if we never know in high stakes, we can never satisfy the norm of practical reasoning. Does this lead to paralysis? If knowledge is the norm of action, and knowledge is unattainable in high stakes, are we never rational to act in high stakes? Or do you allow warranted belief to license action when knowledge is impossible, and if so, why do we need knowledge at all?

  ### 8. Testimonial Transmission Across Stakes
  **Question:** Consider two agents: Low-Stakes Lou and High-Stakes Hal. They have the same evidence about a proposition $p$. Lou knows $p$; Hal does not. If Lou tells Hal that $p$, can Hal come to know $p$ on the basis of Lou's testimony? Or does Hal's high stakes block the transmission of knowledge even from a knower?

  **Likely Move:** He will likely say Hal cannot come to know via testimony. He'll argue the threshold applies to the *receiver* of the knowledge. Lou's knowledge doesn't lower Hal's stakes.
  **Follow-up:** This seems to break the social utility of testimony. If experts (low stakes relative to their expertise) cannot transmit knowledge to non-experts in high-stakes situations (like a patient relying on a doctor), doesn't this make knowledge an isolating state? How do we coordinate action if knowledge isn't transferable across stake-divides?

  ***

  ### Meta-Analysis for the Host

  **The Weakest Question:**
  **Question 5 (Diachronic Stability/Evaporation)** is the weakest in your arsenal.
  *   **Why it might miss:** Pragmatic Encroachers are well-prepared to bite the bullet on fragility. They argue that intellectualists are the ones with the counter-intuitive view (that a gambler can know they will lose yet rationally bet). If your guest has a robust "action-first" epistemology, pointing out that knowledge evaporates won't bother him; he *wants* it to evaporate because the rational permission to act has evaporated.
  *   **When to abandon it:** If he firmly grounds knowledge in *rational action* rather than *truth-tracking*, this objection will bounce off. He will simply say, "Yes, rational permission to act is fragile, so knowledge is fragile."
  *   **What would make it a genuine objection:** This question only lands if you can press that knowledge must have a *stability condition* to serve as a store of information for future use. If you can pivot the follow-up to focus on **retroactive assessment** (i.e., "Was I irrational yesterday?"), it becomes stronger. If he says you were rational then but not now, press on whether "knowledge" is supposed to be a fact about the *agent's history* or the *theorist's current classification*.

  **The Most Rehearsed Answers:**
  **Question 2 (Contextualism)** and **Question 3 (KNR)** are the most standard.
  *   **Question 2:** The "Contextualism doesn't explain action" line is the bread and butter of PE. Be ready to cut him off if he spends more than 2 minutes on the distinction between *assertibility* and *truth*.
  *   **Question 3:** The link between PE and the Knowledge Norm of Action is the standard motivation. He will have a polished defense of why KNR entails PE.
  *   **Strategy:** Use the follow-ups on these immediately. Do not let him settle into the standard "Stanley-style" defense. The follow-up on Q3 (about theoretical reasoning) is your best bet to disrupt the script, as PE is often less clear on how it handles purely theoretical inquiry.

  **The "Load-Bearing" Distinction:**
  **Question 4** is your strongest weapon. It targets the distinction between **Knowledge** and **Warranted Belief**.
  *   **Why:** Many PE defenders try to have it both ways: they want knowledge to be special, but they admit warranted belief does most of the epistemic heavy lifting. If you can pin him down on whether *warranted belief* is sufficient for *rationality*, you can force him to admit that "knowledge" is just a label for "warranted belief + low stakes." This threatens to make the concept of knowledge explanatorily idle, which is a fatal blow to a view claiming to be about the nature of knowledge. Press this hardest.
