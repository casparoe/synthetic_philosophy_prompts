  This is a classic problem in metaphysics, often discussed under the headings of **masks, finks, and mimics** (terms popularized by philosophers like C.B. Martin, David Lewis, and Stephen Mumford). You have intuitively navigated these distinctions better than many philosophical theories manage to do.

  You don't need to sacrifice any of your verdicts. They are all consistent under a single principle.

  ### The Principle: The Stable Causal Base

  **An object has a disposition if and only if it currently possesses the intrinsic structural property (the "causal base") that *normally* produces the manifestation, provided that the link between stimulus and manifestation is not *reversed* or *contingent on the test itself*.**

  To make this practical, we can break it down into three rules that explain your intuitions:

  1.  **Masks (External or Independent Internal Blockers):** If the causal base is present, but something *else* stops the manifestation (foam, plastic, vaccination, vacuum tube, tranquilizers, a timer), the disposition **remains**. The "machinery" of the object is still the right kind; it's just being held back.
  2.  **Finks (Stimulus-Triggered Removal):** If the stimulus itself causes the causal base to vanish or activate a shield *before* the manifestation can occur (drop-triggered rubber chip, stomach neutralizer), the disposition **is lost**. The object is rigged to *stop* being that kind of thing exactly when it matters.
  3.  **Mimics (Non-Standard Mechanisms):** If the manifestation occurs, but not because of the standard causal base (test-sensitive glass, neurological quirk), the disposition **is lost**. The behavior is real, but it isn't coming from the trait you're naming.

  ---

  ### How this saves your verdicts

  **The "Hard" Cases Explained:**

  *   **Timed Glass (Fragile):** The timer is a **Mask**. The glass's *default* intrinsic state is breakable. The timer is an independent internal condition (like a tranquilizer) that temporarily blocks the break. Because the base (glass structure) is standard and the blocker is independent of the *drop*, it counts as fragile.
  *   **Drop-Triggered Glass (Not Fragile):** This is a **Fink**. The stimulus (dropping) triggers the mechanism that *removes* the fragility. The causal link is broken by the stimulus itself.
  *   **Test-Sensitive Glass (Not Fragile):** This is a **Mimic**. It breaks, but not because it is fragile. It breaks because it detects a *psychological intent* (testing). Fragility is a physical property, not a response to curiosity.
  *   **Tranquilized Man (Irascible):** The tranquilizers are a **Mask**. His underlying character (the causal base of irascibility) is intact; the chemical pathway is just inhibited.
  *   **Quirk Man (Not Irascible):** This is a **Mimic** (and Base Absence). He is "placid" by default. The rage comes from a specific neurological fault, not a general temper. "Irascible" implies a standing tendency toward anger; he has a standing tendency toward calmness with a specific reflex.

  **The Wet Match (Not Flammable):**
  This fits under **Base Destruction**. Water doesn't just block oxygen (which would be a mask, like the vacuum tube); it chemically alters the match head's current state. The intrinsic base for combustion is temporarily gone.

  ---

  ### The Two New Cases

  Here is what the principle dictates for your unanswered questions:

  **1. A sugar cube that dissolves in acid but not in water.**
  **Verdict: Not Soluble.**
  **Why:** "Soluble," as a disposition, implicitly means "water-soluble" unless specified otherwise. Water is the standard stimulus for the disposition of solubility. If the cube lacks the causal base to dissolve in water, it lacks the disposition. That it reacts with acid is a *different* disposition (reactivity), not solubility. If you call this "soluble," you have to call iron "soluble" in hydrochloric acid, which confuses the category.

  **2. A person who is genuinely generous but only ever acts generously when someone's watching.**
  **Verdict: Not Generous.**
  **Why:** This is a **Mimic** (specifically, a "reverse fink" or observer-dependent mechanism). Generosity is a disposition to give *based on the need of others or the character of the giver*. If the behavior is triggered *only* by the presence of an audience, the causal base is not "generosity"; the causal base is "desire for reputation" or "performance." The manifestation (giving) is real, but it does not flow from the disposition you are testing for.

  ### Summary
  Your intuition is tracking **where the causal power lies.**
  *   If the power is in the object, and something else blocks it: **Yes.** (Foam, Timer, Tranquilizers)
  *   If the power vanishes when tested: **No.** (Drop-chip, Neutralizer)
  *   If the power comes from a different source entirely: **No.** (Test-glass, Quirk-man, Audience-watcher)

  You don't need to change a single verdict you've already made.
