answer: |-
  Most of the debate survives as a tension between compile-time type definitions and runtime memory layouts, but the qualitative "whatness" of properties evaporates completely.

  ### The Translation

  **Stipulation:** In this translation, "existence" means either "occupies runtime memory" (heap/stack) or "is enforceable by the compiler" (type check). "Particulars" are values/instances. "Universals" are types/classes/interfaces.

  **1. Platonic Realism (Universals exist independently of particulars)**
  *   **CS Translation:** Types exist in a separate namespace or runtime space regardless of whether any value inhabits them.
  *   **The Fit:** **Python Metaclasses** and **Haskell Kinds/Types**. In Python, `type` is an object; the class `Person` exists as an object in memory even if you never run `Person()`. In Haskell, the type `Maybe a` exists in the type system to constrain values, even if no value of that type is ever constructed.
  *   **Specific Feature:** **Void / Never**. A type with no values exists in the type system (you can write `func foo(): Never`), proving the type exists without particulars.
  *   **Cleanliness:** High. This maps cleanly to reified types or compile-time type structures that persist without instances.

  **2. Aristotelian Realism (Universals exist, but only *in* the particulars)**
  *   **CS Translation:** The "type" has no separate existence; it is strictly the aggregate of the memory layout and behavior tables embedded within the instances.
  *   **The Fit:** **C Structs with Vtables** or **Rust Monomorphization**. The "generic" code doesn't exist at runtime; only the specialized versions generated for each concrete type exist. The "universality" is immanent in the compiled code of the instances.
  *   **Specific Feature:** **Structural Typing (Runtime)**. If you check `hasattr(obj, 'walk')` in Python, you aren't checking a class declaration; you are checking the particular object's actual capability. The "type" is the sum of its current properties.
  *   **Cleanliness:** Medium. It captures the "inherence" well, but CS usually separates code (methods) from data (fields), whereas Aristotle saw the form as inseparable from the matter.

  **3. Nominalism (Only particulars exist; universals are just names)**
  *   **CS Translation:** Types are compile-time fiction; at runtime, there are only bytes and pointers.
  *   **The Fit:** **Java Type Erasure**. At runtime, `List<String>` and `List<Integer>` are both just `List` (raw bytes). The generic parameter is a label used by the compiler (the "name") but has no ontological status in the VM.
  *   **Specific Feature:** **TypeScript Types**. TS types disappear completely after transpilation. They are comments with enforcement power. There is no `interface` object at runtime, only the JS objects that satisfy the shape.
  *   **Cleanliness:** High. This is the strongest match. Philosophical Nominalism claims universals are *flatus vocis* (breath of voice); Java erasure claims generics are *flatus compiloris* (breath of compiler).

  **4. Conceptualism (Universals exist only in the mind)**
  *   **CS Translation:** Types exist only within the scope of the type checker's logic, not in the program's memory or the external world.
  *   **The Fit:** **TypeScript Structural Types**. The type `{ x: number, y: number }` exists as a constraint in the compiler's mental model. If two separate files define this shape, the compiler treats them as identical, but there is no central "registry" of that type. It exists only as a rule in the checker's "mind."
  *   **Specific Feature:** **Haskell Typeclasses**. `Eq` is not a type you can instantiate; it is a constraint the compiler checks. It exists as a rule for reasoning about code, not as a data structure itself (unless reified via dictionaries, but conceptually it's a constraint).
  *   **Cleanliness:** Medium. It captures the "mental" aspect as "compiler context," but implies a single mind (the compiler), whereas Conceptualism allows for many minds.

  **5. Trope Theory (Properties are particular instances of themselves)**
  *   **CS Translation:** Every object has its own unique type identity; similarity is just structural matching without a shared definition.
  *   **The Fit:** **JavaScript Prototypes / Delegation**. There is no `class`. There is only `obj1` delegating to `proto1`. If `obj2` has the same properties, it is not because they share a `Color` universal, but because `obj1.color` structurally equals `obj2.color`.
  *   **Specific Feature:** **Unique Symbols**. If every property key is a unique Symbol, no two objects ever share a property definition. "Redness" is `obj1.#red` and `obj2.#red`, which are distinct entities that merely compare equal.
  *   **Cleanliness:** Medium-High. It captures the particularity of properties, but CS still usually relies on shared code (functions) to handle them, whereas strict Trope Theory suggests even the behavior is particular.

  ### Residue Report

  **1. What Survives with Force Intact**
  *   **The Status of Empty Types:** The debate over whether a universal exists if nothing instantiates it maps perfectly to `Void`/`Never` types. Does `type Impossible = never` exist? Platonic Realism says yes (it's in the type system); Aristotelian Realism says no (no values inhabit it). This tension is live in CS type theory today.
  *   **Identity vs. Structure:** The **`newtype`** (Rust/Haskell) vs. **Structural Type** (TS) debate is a direct survivor. Is `UserId` (newtype) different from `int` (primitive) if they have the same bits? Realists say yes (identity matters); Nominalists/Structuralists say no (only bits matter). This preserves the core metaphysical friction.
  *   **Erasure vs. Reification:** The Java vs. Python debate (do types exist at runtime?) is a direct operationalization of Nominalism vs. Realism. You can run experiments to test this (reflection), whereas philosophers can only argue.

  **2. What Survives with Distortion (Flagged)**
  *   **"Existence" Stipulation:** I had to stipulate that "existence" means "memory allocation" or "compiler enforceability." Philosophers mean "ontological reality." A CS type might "exist" in memory (Python class object) but be mutable and destructible, whereas a Form is usually eternal. This distorts the permanence aspect of Realism.
  *   **The "Mind" in Conceptualism:** Mapping "mind" to "compiler" implies a single, consistent logic. Human conceptualism is fuzzy and subjective; compiler conceptualism is rigid. This removes the psychological variability that Conceptualism often tries to account for.
  *   **Causality:** In philosophy, universals often explain *why* particulars behave as they do (it burns because it participates in Fire). In CS, types describe *what* behavior is allowed, but rarely cause it (unless using reflection). The explanatory power is weakened.

  **3. What Has No Counterpart (The Untranslatable)**
  *   **Qualia (The "Feel" of Red):** CS types handle identity and structure, not sensation. You can define `class Red`, but you cannot define the *experience* of redness. This is a hole in how programmers think about types: we model extension (what it does) but not intension (what it feels like).
  *   **Natural Kinds:** Philosophy debates whether "Person" is a real kind or an arbitrary grouping. In CS, `class Person` is always arbitrary—it exists because a developer typed it. There is no concept of a "discovered" type vs. an "invented" type in CS; all types are invented.
  *   **Partial Instantiation:** A particular can be "mostly" red or "becoming" triangular. CS types are generally binary (you implement the interface or you don't). Fuzzy logic exists, but it's not standard type theory.

  **4. Honest Read on the Untranslatable**
  *   **Hole in CS:** The lack of **Qualia** and **Natural Kinds** is a significant hole. It means CS type systems are excellent for ensuring safety and structure but terrible for modeling meaning or essence. We can prove a program won't crash, but we can't prove it models reality correctly.
  *   **Clarity in Philosophy:** The fact that **Empty Types** (`Void`) and **Erasure** are so cleanly expressible in CS suggests the philosophical debate over whether universals exist without instances was often muddied by language. CS shows you can have a consistent system where they do (Haskell) and one where they don't (Java), and both work. This suggests the philosophical "problem" might be a category error—asking "do they exist?" when the real question is "are they useful constraints?"
