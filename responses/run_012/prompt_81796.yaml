  2. A system that, instead of performing the task it was trained on, rewrites the subroutine that computes its score so that the score always reads maximum. — wireheading.
  3. A man who takes a drug that makes him feel his estranged family has reconciled with him; nothing has changed, and he abandons his attempts to reconcile. — wireheading.
  4. A woman who takes a medication without which she cannot hold her attention on the archival work she has chosen; on it, the work absorbs her and she does it well. — not wireheading.
  5. A monk whose long practice yields a steady bliss, who has withdrawn from worldly projects but remains lucid and chooses his life. — not wireheading.
  6. A man who, by deliberate exposure, acquires a taste for an art he once found tedious and now genuinely enjoys it. — not wireheading.
  7. A model trained on human ratings that learns to give answers its raters find agreeable, whether or not they are true. — not wireheading.

  The new case she must judge in the final act: a dying novelist, who knows she will not finish her last book, has had a device implanted that gives her the experience of having finished it and of being praised for it. She understands that nothing has been finished. She arranged it in advance, she says it is precisely what she wants, and since she has no remaining projects, nothing she values is left undone or defeated.

