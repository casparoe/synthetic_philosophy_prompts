prompt: |-
  I've been following mechanistic interpretability from the outside — no formal training, just a lot of reading and thinking on my own — and I keep hitting a problem I can't get past by myself. Whenever someone reports that a model's odd behavior has been traced to a mechanism, or that two models rely on the same mechanism, or that some newly noticed anomaly is genuinely new rather than a variant of something already understood, I can't work out what would make the claim true or false. The phrase "the same mechanism" seems to slide between at least four different things: the same parameters, the same arrangement of parts and connections, the same procedure or algorithm, and the same input-output behavior. My suspicion is that a good deal of the apparent disagreement in this area is really a mismatch between those levels, but I don't know which level, if any, ought to anchor the others, or whether my four-way split is even the right cut.

  The case that worries me most is anomaly detection, because that is where the ambiguity does real work: you notice a behavior that doesn't fit the story you had about a model, and everything then turns on deciding whether you have found a new mechanism, a variant of a known one, or a known one misfiring in unfamiliar conditions. If "same mechanism" has no settled content, it seems to me that claims of that kind can't be checked, and the safety-relevant claims that inherit them can't be either.

  What I'd like from you is an agenda rather than a survey. Suppose the resource at stake is a few years of one person's thinking — conceptual work, not experiments on large models — aimed at making mechanistic anomaly detection a field whose claims can be assessed rather than merely asserted. Which open questions about mechanism identity matter most, and in what order should they be taken up? For each, I want the case for its place in the order: what else cannot be settled until it is, how far it can be pushed by careful reasoning alone rather than needing new experiments, and what would count as real progress on it. Where two questions compete for the same effort, say which you would drop and why. I'm not after a reading list; I want the reasoning behind the ordering.

  Finally, tell me what would change your ranking: which argument or piece of evidence would reorder it, and where your reasoning is most likely to fail. If my four-level picture is a false tidiness that obscures the distinctions that actually matter, say so, and say what the real ones are.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Deconstruct the User's Request:**

      *   **Background:** The user is an outsider to mechanistic interpretability (MI) but has been following it closely (autodidact). They are conceptually sophisticated.
      *   **Core Problem:** The concept of "the same mechanism" is ambiguous. It slides between parameters, architecture, algorithm, and I/O behavior. This ambiguity undermines claims about anomaly detection (is this new? is this a variant? is this a misfire?).
      *   **Goal:** An *agenda* for conceptual work (not experiments) to make mechanistic anomaly detection claims assessable.
      *   **Constraints:**
          *   Resource: A few years of one person's thinking.
          *   Output: Ordered open questions with justification for the order (dependencies, reasoning vs. experiments, criteria for progress).
          *   Conflict Resolution: If questions compete, choose one and explain why.
          *   Self-Correction: Tell me what would change your ranking, where your reasoning might fail, and critique the user's four-level split if necessary.
      *   **Tone:** Rigorous, philosophical but grounded in MI practice, actionable for a conceptual researcher.

  2.  **Analyze the User's "Four-Level Split":**

      *   *Parameters:* Weights/values. (Too low-level; same mechanism can exist with different weights).
      *   *Arrangement/Connections:* Computation graph structure. (Better, but still rigid; same algorithm can be implemented differently).
      *   *Procedure/Algorithm:* The abstract computation. (Closer to the intuition, but hard to define equivalence).
      *   *Input-Output Behavior:* Functional equivalence. (Too high-level; different mechanisms can produce same I/O).
      *   *Critique:* This split is a good start but misses the *causal* aspect central to MI. MI isn't just about structure or I/O; it's about *causal pathways* within the model. A "mechanism" in MI is usually defined as a specific causal subgraph that is *necessary and sufficient* for a behavior in a specific context. The user's split misses "Causal Role" and "Context/Activation Conditions."

  3.  **Develop the Agenda (Iterative Process):**

      *   *Initial thought:* Start with defining "mechanism."
      *   *Correction:* You can't define "mechanism" in a vacuum. You need to know *why* you care. In MI, we care about safety and predictability. So, the definition must serve the goal of anomaly detection.
      *   *Priority 1: Teleology/Goal.* What is the *purpose* of the identity claim? Is it for generalization? For patching? For risk assessment? Without this, "sameness" is meaningless.
      *   *Priority 2: Causal Structure.* Once we know the goal, we need a formalism for what constitutes a mechanism. The user's split misses causality. This needs to be addressed early.
      *   *Priority 3: Equivalence Metrics.* How do we measure "sameness" given the causal structure? (Isomorphism? Functional equivalence under perturbation?)
      *   *Priority 4: Context/Activation.* Mechanisms aren't always on. Anomaly detection depends on *when* they fire.
      *   *Priority 5: Hierarchy/Abstraction.* How do lower-level weights map to higher-level algorithms?

      *Refining the Order:*
      1.  **Normative Grounding:** Why do we need identity? (Safety vs. Understanding).
      2.  **Causal Definition:** What *is* a mechanism in this context? (Moving beyond the user's 4 levels).
      3.  **Identity Criteria:** When are two causal structures "the same"?
      4.  **Operationalization:** How do we detect this without exhaustive search?

      *Wait, the user wants conceptual work, not experiments.* So the agenda must focus on definitions, formalisms, and logic.

      *Revised Agenda:*
      1.  **Teleological Clarification:** Define the *stakes* of identity. (Safety requires worst-case bounds; understanding requires compression).
      2.  **Causal Graph Formalism:** Replace the 4-level split with a causal account.
      3.  **Equivalence Relations:** Define "sameness" relative to the teleology.
      4.  **The Boundary Problem:** Distinguishing mechanism from context/noise.

  4.  **Drafting the Content (incorporating specific constraints):**

      *   *Critique of the 4-level split:* It's too static. MI is dynamic. Need to add "Causal Pathway" and "Activation Context."
      *   *Question 1 (The Anchor):* **What is the invariance requirement for safety?** (i.e., Under what transformations must a mechanism remain "the same" for us to trust our risk assessment?)
          *   *Why first?* Because "sameness" is relative to purpose. If we care about patching, parameter identity matters. If we care about generalization, algorithmic identity matters.
          *   *Reasoning only?* Yes, this is philosophical/normative.
          *   *Progress:* A taxonomy of safety claims mapped to identity requirements.
      *   *Question 2 (The Ontology):* **How do we formally distinguish a mechanism from its substrate?**
          *   *Why second?* Once we know *why* we care, we need to know *what* we are counting.
          *   *Reasoning:* Requires analyzing existing MI case studies (IOI, indirect object identification) to extract a common formal structure.
          *   *Progress:* A formal definition of "mechanism" that separates circuit topology from weights.
      *   *Question 3 (The Metric):* **What constitutes a "variant" vs. a "new" mechanism?**
          *   *Why third?* Now we apply the ontology to the identity problem.
          *   *Reasoning:* Developing a distance metric on the space of causal graphs.
          *   *Progress:* A rigorous notion of "mechanistic distance."
      *   *Question 4 (The Context):* **How do activation conditions factor into identity?**
          *   *Why fourth?* A mechanism that only fires on adversarial inputs might be "the same" as one firing on clean inputs, or different.
          *   *Reasoning:* Logic of conditionality.

      *Competition:* If I have to drop one, I'd drop "Parameter Identity." It's too low-level for conceptual work and gets solved by engineering. Focus on the *algorithmic/causal* level.

  5.  **Refining the "What would change your mind" section:**

