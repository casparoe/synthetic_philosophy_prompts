      *Key Insight to emphasize:* The user's 4 levels are categories of *description*, but a mechanism is a *hypothesis about causality*. The ambiguity arises because people confuse the map (description) with the territory (causal process).

      *Revised Agenda Structure:*
      1.  **Teleology of Identity:** Why do we need "same"? (Safety vs. Explanation).
