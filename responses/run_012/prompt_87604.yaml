      *Q2: The Causal Abstraction.* (Ontological)
      *Q3: The Metric of Variation.* (Epistemic)
      *Q4: The Context Dependence.* (Operational)

      *Critique of User's Split:* It misses *Causality* and *Purpose*. It treats mechanisms as static objects rather than dynamic processes.

      *What changes the ranking?* If "mechanisms" turn out to be holistic (non-modular), then Q2 fails and we need a holistic theory first.

