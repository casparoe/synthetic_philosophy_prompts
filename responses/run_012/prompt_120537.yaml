answer: |-
  The Merchant of Venice does not resolve Aristotle's theoretical contradictions but instead dramatizes the coercive force required to maintain the fiction that money has a nature.

  Shylock's use of the Jacob and Laban story exposes the vulnerability in Aristotle's sterility thesis: if generation is the standard of naturalness, and capital can be made to generate, then usury is logically natural within the play's own terms. The play does not answer this argument philosophically; it answers it performatively by destroying the arguer. Shakespeare knows he is handing the stronger logical premise to the villain, which is why the trial scene cannot engage Shylock on the merits of breeding money. Instead, the court shifts the ground from economics to theology and identity, forcing Shylock to relinquish his wealth to survive. This reveals that the Aristotelian distinction between oikonomia and chrematistike is not an ontological truth discoverable by reason, but a political boundary enforced by the state. The play suggests that money's "sterility" is not a biological fact but a social prohibition, and when that prohibition is challenged by a successful counter-theory of generation, the community responds not with better logic but with exclusion.

  The bond dramatizes the lethal consequence of treating convention as nature. Aristotle argues in the Ethics that need is the true measure holding exchange together, admitting that strict commensurability between disparate goods like houses and shoes is impossible without convention doing the heavy lifting. The pound of flesh contract attempts to bypass convention and need by demanding exact, literal equivalence. By making the contract specific enough to exclude blood, Shylock tries to make money's claim on the body absolute and natural. The failure of this bond—its impossibility of execution—validates Aristotle's suspicion that perfect commensurability is a fantasy, but it complicates Aristotle's solution. Portia does not restore "need" as the measure; she imposes a sovereign exception. Mercy in the trial is not the Aristotelian mean or the recognition of mutual dependency; it is a unilateral suspension of the law by the powerful. Venice shows that when need is manufactured by debt and revenge, it cannot serve as a stable measure. The play argues that without an external authority to interrupt the logic of exact equivalence, the market consumes the human body.

  Belmont appears to offer the Aristotelian ideal of oikonomia, a sphere of use-value and household management distinct from Venetian exchange, but this separation is illusory. The casket test ostensibly rewards the suitor who hazards everything for love rather than deserving reward for status, aligning the lead casket with natural virtue and the gold with unnatural greed. However, Bassanio's hazard is funded entirely by Antonio's credit in Venice, meaning the "natural" economy of Belmont is subsidized by the "unnatural" economy it claims to transcend. Portia's wealth is not static household property; it is liquid capital that enables the resolution of the Venetian crisis. The play wants to condemn money-getting while its happy ending runs on it because it cannot imagine a household secure enough to sustain virtue without the protection of merchant capital. Belmont is not outside the Venetian economy; it is the ideological justification for it, the consumption sphere that makes the production sphere bearable. The reading stops working if you try to frame Belmont as a genuine alternative; it functions instead as the luxury good that merchants buy with the profits of chrematistike.

  What the play adds to the debate is the demonstration that maintaining the distinction between natural and unnatural economy requires violence that argument alone cannot justify. Abstract theory can posit that money is sterile, but drama shows what happens when someone proves it fertile: you must break them. The play moves the debate from ontology to power, showing that the "nature" of money is whatever the dominant class says it is. This directly addresses the contradiction you noted between the Politics and the Ethics. Aristotle's Politics relies on money having a telos (sterility), while the Ethics treats it as pure convention (measure). The play notices this contradiction and resolves it by showing that "nature" is the mask convention wears when it wants to be unquestionable. When Shylock treats the bond as natural law, he is punished; when Portia treats the law as convention subject to interpretation, she wins. The trial scene proves that money cannot be what it is supposed to be because what it is supposed to be depends on who holds it. The play concludes that the only thing money cannot do is remain neutral; it always demands a political decision about whose generation counts as life and whose counts as usury.
