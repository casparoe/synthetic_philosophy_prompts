  Here is a draft of the questions you requested, written out in continuous prose so you can copy them directly into your notes or email them to yourself without worrying about formatting issues.

  You frame the German-American split as purely procedural regarding who grants exceptions, but doesn't Kant's autonomy imply the individual is the ultimate legislator, which collapses your distinction? If she responds that Kantian autonomy is about universalizability rather than particular exceptions, press her on whether Hegel's ethical life then overrides the individual so completely that your American contrast becomes a straw man of radical subjectivism.

  In the German model, if the custodian of the rule issues a command that violates the very principle the rule is meant to protect, does the individual have any recourse, or does your framework force them into complicity? Should she insist there is a higher-order rule, ask her who holds the dispensation authority for that higher-order rule to avoid an infinite regress.

  You argue that shifting authority to conscience makes moral failure a failure of sincerity, but doesn't this protect the sincere fanatic from criticism just as much as the sincere dissenter? If she claims we can still criticize their reasoning, ask her whether that reintroduces objective content standards that her procedural account was supposed to bracket out.

  Given the risks of authoritarianism in the German model and the risks of the conscientious free-rider in the American model, which tradition do you think offers a more viable framework for modern pluralistic societies? If she attempts to remain neutral and describe both as equally valid contextually, push her to admit whether one model is less dangerous when institutions are corrupted.

  Your vignette study relies on judgments of a nurse breaking protocol, but how do you know participants aren't responding to the outcome of the care rather than the authority structure you're testing? If she argues that the vignettes control for outcomes, ask her what specific response pattern would count as falsifying evidence for her interpretation.

  You call it the conscientious free-rider problem, but isn't the real issue that sincerity is opaque whereas rule-following is public, making the American model epistemically unstable rather than morally costly? If she agrees that opacity is the issue, ask her how any social coordination is possible under her American model if we cannot verify dispensation authority.

  You mention being a tourist in history, but does labeling Emerson and Thoreau as holding dispensation authority ignore their anarchist tendencies where they reject the legitimacy of the rule itself rather than seeking an exception? If she says she is doing philosophical reconstruction rather than history, ask whether that reconstruction risks missing the actual political force of civil disobedience.

  Since you are speaking to a moral psychology audience, how does your dispensation authority map onto dual-process theories where intuition might bypass the custodian entirely? If she says it operates at the reflective level, ask her why we should privilege that level when most moral violations happen under stress.

  If a student comes to you with a genuine moral dilemma where their conscience clashes with institutional rule, what advice does your theory give them beyond telling them to identify which tradition they inhabit? If she says the theory is descriptive not prescriptive, challenge her on whether a moral theory that cannot guide action is actually useful for the people living through these conflicts.
