answer: |-
  Here is the preliminary mapping you asked for, followed by the argument.

  ### Preliminary Mapping: Deweyan Concepts vs. Asilomar Reality

  **1. The Indeterminate Situation (Earns its keep)**
  *   *Dewey:* Inquiry begins when habitual action is blocked by a problematic situation that is unclear.
  *   *Asilomar:* The ability to splice DNA created genuine biological uncertainty (potential pathogens, ecological disruption). The "habit" of unrestricted research was blocked by fear.
  *   *Verdict:* This fits perfectly. The moratorium was a recognition of an indeterminate situation.

  **2. The Public (The friction point)**
  *   *Dewey:* The public consists of all those affected by the *indirect consequences* of a transaction, to a degree that requires systematic care.
  *   *Asilomar:* The transaction was rDNA research. The indirect consequences extended to the general population (environment, health, ethical boundaries of life).
  *   *Verdict:* The conference recognized the consequences but excluded the public. The "public" was represented by government liaisons and a few lawyers, not the affected populace.

  **3. Experts vs. Values (Critical failure)**
  *   *Dewey:* Experts can determine *means* and causal relationships, but they cannot determine *ends* (values). Ends must be chosen by the public.
  *   *Asilomar:* Scientists determined the safety levels (means) but also implicitly decided the *pace* and *scope* of the research (ends) by declaring it safe enough to resume under guidelines.
  *   *Verdict:* This is where the Deweyan alarm bells ring. Scientists appropriated the value judgment.

  **4. Democracy as Associated Living (Decorative/Failed)**
  *   *Dewey:* Democracy is the capacity for shared communication and the breaking down of barriers between classes.
  *   *Asilomar:* Communication was high *within* the scientific class, but barriers between scientists and the lay public were reinforced (technical language, closed-door sessions).
  *   *Verdict:* It was professional self-governance, not democratic associated living.

  **5. Historical Uncertainty Flag**
  *   I am relying on the standard historical account of Asilomar (Berg et al., the 1974 moratorium, the 1975 conference). I am aware that some participants argue the press access was better than critics claim, and that public hearings followed. However, for the sake of this philosophical test, I am treating the core conference structure (scientists setting the initial guidelines) as the primary data point.

  ***

  ### The Argument: Asilomar as a Technocratic Co-optation of Inquiry

  You want me to take a side, so here it is: **Asilomar was a triumph of professional self-preservation that wore the mask of Deweyan inquiry, and it exposes a naive optimism in Dewey's political sociology.**

  Dewey believed that if you let inquiry run its course, it tends to democratize. He thought that the need to communicate results and the interdependence of modern life would force experts out of their silos and into the public square. Asilomar suggests the opposite: that scientific inquiry, when faced with a political threat, has the capacity to *simulate* public accountability while actually consolidating expert authority.

  #### 1. The Moratorium: Inquiry or Pre-emption?
  Let's look at the voluntary moratorium (1974) and the conference (1975) through *The Logic of Inquiry*. Dewey says inquiry is the controlled transformation of an indeterminate situation into a determinate one.

  On the surface, Asilomar looks textbook Dewey. The scientists saw a risk (indeterminate situation), stopped action (paused habitual response), gathered data, and proposed a new method of operation (guidelines). It was "doing," not "mirroring."

  But Dewey distinguishes between *scientific inquiry* and *social inquiry*. Scientific inquiry deals with physical causality. Social inquiry deals with the integration of those causal powers into human life. At Asilomar, the biologists treated a social problem (public fear, ethical boundaries) as a technical problem (containment levels, P4 labs).

  By framing the question as "How do we do this safely?" rather than "Should we do this, and who decides?", the scientists pre-empted the broader inquiry. It was a clever move. If they hadn't self-regulated, the government (HEW, Congress) would have. In Deweyan terms, they prevented the *Public* from organizing itself by organizing *themselves* first. They acted as a special interest group that successfully convinced the state to delegate its regulatory authority to them. So, to answer your specific question: **The moratorium was a strategy to pre-empt genuine public inquiry.** It resolved the scientists' anxiety about regulation, not the public's anxiety about nature.

  #### 2. Who Counts as the Public?
  This is where Dewey's definition in *The Public and Its Problems* cuts deep. Dewey argues the state is nothing more than the organization of the public. The public isn't a pre-existing group; it *emerges* when people realize they are jointly affected by indirect consequences.

  At Asilomar, the "public" was effectively defined as "the scientific community plus the NIH." Why? Because they were the only ones who claimed to understand the consequences.

  But Dewey insists that the *facts* of the risk are the domain of the expert, but the *tolerance* of the risk is the domain of the public. A chemist can tell you how much cyanide kills a rat. A chemist cannot tell you whether a factory should be allowed to emit trace cyanide near a school. That is a value judgment.

  At Asilomar, the scientists set the guidelines for containment. In doing so, they implicitly decided what level of risk was acceptable to society. They didn't ask the society; they calculated it. They assumed that because *they* understood the mechanism, they owned the moral jurisdiction. Dewey would call this a category error. He would argue that by excluding the lay public from the definition of the problem, the inquiry was structurally flawed from the start. The "indirect consequences" fell on everyone, but the "direct management" was kept in the lab.

  #### 3. Where Dewey Gets It Wrong (The Counterexample)
  Now, let's run it the other way. What does Asilomar tell us about Dewey?

  Dewey had a faith in the *method of intelligence*. He believed that if you apply experimentalism to social problems, the process itself requires communication, and communication breaks down class barriers. He thought expertise was inherently unstable unless it could justify itself to the layperson.

  Asilomar is a counterexample to this optimism. It shows that expertise can become self-sealing. The biologists used their monopoly on technical knowledge to create a barrier to entry. You couldn't participate in the Asilomar debate unless you understood restriction enzymes. This isn't just a practical barrier; it's a political one.

  Dewey underestimated the ability of a professional class to form a "Great Society" (in his terms) without becoming a "Great Community." The scientists associated with each other globally (Great Society) but did not associate with the public (Great Community). They created a functional democracy *within* the guild, which allowed them to operate as an oligarchy *outside* it.

  Dewey writes in *Freedom and Culture* about the danger of "esoteric classes." He warns that if knowledge is concentrated, liberty is threatened. But he seems to think the pressure of events will force the experts to open up. Asilomar shows the opposite: the pressure of events (public fear) caused the experts to close ranks and produce a technical solution that satisfied the regulators without requiring deep public engagement.

  #### 4. What Should Have Happened? (The Deweyan Alternative)
  If we take Dewey seriously, Asilomar should have looked different.
  1.  **Problem Definition:** The conference shouldn't have been convened solely by the NIH and the National Academy of Sciences. It should have been convened by a body that included citizen representatives *before* the guidelines were drafted.
  2.  **Scope:** The inquiry shouldn't have been limited to biosafety (containment). It should have included the *purposes* of the research. Dewey insists that means and ends are continuous. You can't separate the safety of the tool from the use of the tool. A Deweyan inquiry would have asked: "What kind of world do we want to build with this?" not just "How do we keep the bugs in the box?"
  3.  **Communication:** The scientists should have been required to translate the risks into non-technical terms not as a PR exercise, but as a condition of the inquiry itself. For Dewey, if you can't communicate it, you haven't fully inquired into its social meaning.

  ### The Verdict

  You asked me to be honest about where the experiment fails to be a Deweyan one. It fails because it conflated **technical competence** with **moral authority**.

  And you asked if this case makes Dewey look naive. **Yes, it does.**

  Dewey's experimentalism assumes a certain good faith and a certain fluidity between the expert and the citizen. He assumes that the "method of intelligence" is contagious. Asilomar demonstrates that the "method of intelligence" can be weaponized to exclude. The scientists used the language of responsibility ("we are doing this for the public good") to secure autonomy ("leave us alone to regulate ourselves").

  Dewey hoped that inquiry would dissolve the barriers between the specialist and the public. Asilomar proves that inquiry, when institutionalized within a profession, can build higher walls. The scientists didn't emerge from the lab to live democratically with the public; they brought the lab's hierarchy out into the world and called it governance.

  So, while the moratorium was a responsible act by the standards of the profession, it was a **democratic failure** by the standards of *The Public and Its Problems*. It treated the public as a hazard to be managed rather than a partner in inquiry. If Dewey is right that democracy is a way of life, Asilomar was a moment where the scientific community chose to live as a guild instead.

  Does that align with your read of the history? My sense is that a retired protein chemist might see the safety guidelines as a victory (and they were, practically), but philosophically, the structure was deeply elitist. Dewey would have cheered the pause but condemned the closed door.
