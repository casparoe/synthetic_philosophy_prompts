answer: |-
  The smell of the workshop was always the same: rubber glue, linseed oil, and the sharp, dusty scent of cut linoleum. Elias sat hunched over the light table, the steel knife heavy in his hand. He was a *Transformer*, though the title felt grand for a man who spent his days turning columns of municipal statistics into rows of little men.

  One man equals one thousand citizens. That was the first law. The second law was repetition. You did not make a big man for ten thousand and a small man for one thousand. You made ten identical men. The eye was not to be trusted with area; it could only be trusted with count.

  "Elias," said Mrs. Katerina from the next bench. She was sanding the edge of a cargo ship. "The Director wants the Grain Reserve proof. Now."

  Elias wiped his hands on his apron. He walked to the main board, a vast expanse of white card pinned to the wall. It was meant to be the centerpiece of the upcoming exhibition: *The City's Wealth, 1930–1936*. It was a landscape of paper symbols. Silos rose like skyscrapers made of wheat sacks. Trains stretched across the bottom margin.

  Dr. Vorn stood before the board, his hands clasped behind his back. He was a small man with a large forehead, exiled from Vienna, carrying the weight of a universal language in his briefcase. Beside him stood Mr. Galt, the sponsor, a man who wore suits that cost more than the Institute's monthly rent. Galt tapped a fingernail against the lower right quadrant of the chart.

  "The Eastern Silo," Galt said. "It's empty."

  "It is," Vorn replied. His voice was calm, but Elias saw the tension in the Director's shoulders.

  "The records show the Eastern Silo was completed in November," Galt said. "It has a capacity of fifty thousand tons. The chart shows zero."

  "The chart shows grain," Vorn said. "Not concrete."

  "The investors need to see capacity," Galt countered. "They are funding the Western expansion. If they see a gap in the sequence, they think the project failed. They need to see the potential."

  Elias looked at the gap. The other silos were represented by stacks of identical sack-symbols, ten high. The Eastern Silo row was just... white space. In the grammar of ISOTYPE, white space was a word. It meant *None*. It meant *Zero*. To leave it blank was to tell a lie. To fill it was to tell a different one.

  "We cannot draw grain that does not exist," Vorn said. "The picture must be a mirror of the fact."

  "The fact is the silo exists," Galt said. "The fact is it *can* hold grain. Why is your language so clumsy it cannot distinguish between 'empty' and 'not built'?"

  "It is not clumsy. It is precise." Vorn turned to Elias. "The data from the Port Authority. Read it."

  Elias fetched the slip of paper. "Eastern Silo: Constructed. Current Contents: Unknown. Access denied by Port Authority pending security clearance."

  "Unknown," Galt said. "So it might be full. It might be empty. Put in twenty sacks. A conservative estimate."

  "No," Vorn said.

  "Then put in a question mark."

  Vorn flinched. "A question mark is a letter. We are building a language without letters."

  "Then what do we do?" Galt's voice tightened. "We ship these panels to Geneva next week. I will not send a chart that looks unfinished."

  Galt left the room, the door clicking shut with a finality that echoed in the high-ceilinged workshop. Vorn stared at the white gap on the board. He picked up a single paper sack-symbol, held it over the empty row, and then set it back down on the table. He did not glue it.

  "Elias," Vorn said softly. "Bring me the knife."

  Elias handed him the tool. Vorn took a fresh sheet of orange linoleum. He began to carve. He did not carve a sack. He carved a square.

  "What is that?" Elias asked.

  "A placeholder," Vorn said. He was carving slowly, his hand trembling slightly. "If we leave it white, it says Zero. If we put sacks, it says Grain. We must show that the space is occupied, but the content is... withheld."

  "A grey square?" Elias asked. "But grey isn't in the key. The key says Orange is Wheat, Blue is Coal."

  "Then it will be a new symbol."

  "But Dr. Vorn," Elias said, stepping closer. "If we introduce a symbol that means 'Unknown', then every time we don't know a number, we use the square. Soon, half the chart will be squares. The reader won't count the men; they'll count the mysteries."

  Vorn stopped carving. He looked at the knife, then at the board. "Better a square of truth than a sack of lies."

  "But the Sponsor..."

  "Galt wants the chart to work like a brochure. I want it to work like a microscope." Vorn resumed carving, but the lines were jagged. He was fighting the material. The linoleum chipped. The square looked less like a data point and more like a hole burned into the paper.

  Mrs. Katerina came over, wiping dust from her glasses. She looked at the square, then at the row of orange sacks. "It breaks the rhythm," she said quietly. "The eye stops. It doesn't flow."

  "It should stop," Vorn said. "The truth should make you stop."

  "But it's not truth," Elias said. The words were out before he could check them. The room went silent. Vorn lowered the knife. "A square doesn't mean 'Unknown'. It just means 'Square'. We're inventing a word in the middle of a sentence without telling the reader the definition."

  Vorn looked at Elias for a long moment. The idealism in the Director's eyes seemed to flicker, like a gas lamp running low. He knew the boy was right. The system relied on standardization. A new symbol required a legend. A legend required text. Text was the enemy.

  "We cannot use the square," Vorn admitted. His voice was barely audible.

  "Then we leave it blank?" Elias asked.

  "No." Vorn walked to his desk and opened a drawer. He took out a pot of black ink and a fine brush. This was forbidden. The ink was for the borders, the titles, the metadata. Never for the data itself.

  He dipped the brush. He leaned into the board. In the center of the empty row, where the twenty sacks should have been, he painted a small, solid black dot.

  It was tiny. It didn't look like a sack. It didn't look like a square. It looked like a flaw. A speck of dust on the lens.

  "What is that?" Mrs. Katerina asked.

  "A mark," Vorn said. "It signifies... interruption."

  "It looks like a mistake," Elias said. "People will think the printer dropped ink."

  "Let them," Vorn said. He stepped back. "Galt will hate it. But it is not a lie. It does not say there is grain. It does not say there is none. It says: *Here, the counting stops.*"

  Elias looked at the chart. The rows of orange sacks marched neatly from left to right, a rhythm of plenty. Then, the Eastern Silo row. A long stretch of white, broken by a single, arrogant black dot. It screamed. It disrupted the visual harmony that was the whole point of the project. It drew the eye more than any of the sacks.

  "It ruins the aesthetic," Mrs. Katerina said, but she didn't try to wipe it away.

  "It ruins the silence," Vorn said.

  The door opened. Galt returned, coat in hand. He walked straight to the board. He stared at the black dot. He leaned in, squinting. He reached out as if to touch it, then pulled his hand back.

  "What is this?" Galt asked. His voice was dangerous.

  "A notation," Vorn said.

  "It looks like dirt."

  "It is a marker of absence," Vorn said. "We cannot count what we cannot see."

  Galt turned to Elias. "Can you remove it?"

  Elias looked at the dot. It was wet ink on textured paper. If he scrubbed it, it would smear. If he pasted a new piece of paper over it, the seam would show. The only way to remove it was to reprint the entire panel. They had no time.

  "I could... overlay a sack," Elias said. "Paste a paper sack over the dot."

  Galt looked at Vorn. Vorn did not move. He stood with his hands in his pockets, staring at the dot as if it were a window.

  "Do it," Galt said.

  Elias went to the table. He picked up a pre-cut orange sack. He applied the glue. He walked back to the board. He held the sack over the black dot.

  Through the thin orange paper, the black ink showed through. A dark shadow in the center of the bright fruit.

  Elias pressed the sack down. He smoothed the edges with his thumb.

  The row was complete now. Twenty sacks. The rhythm was restored. The chart looked whole. But the twentieth sack was bruised. It carried a shadow that the other nineteen did not have. It looked sick.

  Galt nodded. "Acceptable. It shows the silo is in use, even if the data is... provisional."

  He turned to leave. "Good work, Doctor."

  Vorn did not answer. He waited until the outer door closed before he moved. He walked to the board and touched the twentieth sack. He didn't try to hide the shadow.

  "Elias," Vorn said.

  "Sir?"

  "In the legend. At the bottom. Where it says *One Symbol = 1,000 Tons*."

  "Yes?"

  "Add a line."

  Elias picked up the brush. "Text?"

  "Yes." Vorn looked at the bruised sack. "Add: *Figures marked by the Port Authority are estimates.*"

  Elias dipped the brush. He wrote the sentence in small, black letters beneath the colorful world of symbols. It was a footnote. A crack in the wall. It admitted that the picture was not enough, that it needed the crutch of words to explain what it could not show.

  He stepped back. The chart was finished. From a distance, it was a triumph of clarity: a city fed, a city growing. Up close, you could see the shadow in the last sack, and the small, quiet sentence below that told you not to trust your eyes.

  Vorn turned off the overhead light. The workshop fell into the grey twilight of the port evening. The symbols on the wall seemed to glow in the dimness, bright orange against the gloom.

  "Go home, Elias," Vorn said.

  Elias packed his knife. He looked at the board one last time. The black dot was still there, trapped under the orange skin of the paper sack, pulsing like a bruise.

  "Will they understand?" Elias asked. "In Geneva?"

  Vorn was cleaning his hands with a rag soaked in turpentine. He didn't look up.

  "They will count the sacks," Vorn said. "They will not count the shadow."

  He threw the rag onto the table. It landed with a wet slap.

  "But we will know," Vorn said. "That is all the language can do. It cannot make them see. It can only show us where we failed to show them."

  Elias buttoned his coat. He walked past the board, careful not to cast his own shadow over the twentieth sack. He opened the door to the street, where the rain was beginning to fall, blurring the lights of the trams into streaks of colour that meant nothing, and everything, all at once.
