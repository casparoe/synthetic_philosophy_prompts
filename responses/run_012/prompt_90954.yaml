answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Causal Status of Phenomenal Experience
  **Parties:** [Epiphenomenalist Proponent] & [Interactionist Proponent]
  **Date:** [Current Date]

  ## I. AGREED CLAIMS

  We, the undersigned, establish the following baseline to ensure our disagreement is substantive rather than verbal or empirical.

  1.  **Physical Closure:** We agree that the physical sciences, as currently constituted, license the principle of the causal closure of the physical domain. No violation of conservation laws or physical causal chains has been empirically observed. Any account of mental causation must acknowledge the completeness of physics at the level of physical events.
  2.  **Reality of Experience:** We both reject eliminativism. Phenomenal experiences (qualia) are real features of the world. They are not illusions, nor are they identical to the neural states that realize them (we reject type-identity theory).
  3.  **Definition of Inertness:** When the Epiphenomenalist claims experiences are "causally inert," this is denied only with respect to *physical* effects. It is not a denial that experiences exist, nor a denial that they are lawfully correlated with neural states. It is specifically the denial that phenomenal properties transmit energy or information to physical effectors in a way that is not fully explainable by the underlying neural substrate.
  4.  **No Brute Correlations:** Neither of us accepts as a final explanation the claim that "creatures like us form judgments about experience" is a brute fact. We agree that the reliability of phenomenal judgment requires an explanation. The dispute is not about *whether* an explanation is needed, but *which* causal structure provides it.
  5.  **Scope of Disagreement:** We agree that a portion of our dispute may rest on divergent definitions of "causation" (production vs. difference-making). We agree to treat this not as a settled semantic fact, but as a variable to be tested. If our disagreement dissolves under a specific analysis of causation, we will acknowledge it as partially verbal.

  ## II. THE THREE PIVOTAL MATTERS

  We identify three specific conceptual nodes where our disagreement concentrates. We agree to focus our future dialectic on these points rather than general intuitions.

  **1. Reliability and Common Cause**
  *   **The Issue:** Does the reliability of a judgment about an experience require the experience to be among the judgment's direct causes?
  *   **Our Stance:** The Epiphenomenalist holds that a **Common Cause** (the neural state producing both the experience and the judgment) is sufficient to explain reliability and justification. The Interactionist holds that Common Cause is insufficient; the experience itself must be a link in the causal chain to avoid the judgment being a "coincidence."
  *   **Agreement:** We agree to test whether a common-cause model can sustain a robust theory of knowledge (justified true belief) regarding internal states without direct causal contact.

  **2. Tracking Without Causation**
  *   **The Issue:** Can a judgment track an experience without being caused by it, given that both depend on a common cause? Is this counterfactual dependence enough for the judgment to be *about* the experience?
  *   **Our Stance:** The Epiphenomenalist argues that counterfactual dependence (if the experience were different, the neural cause would be different, and thus the judgment would be different) secures "aboutness." The Interactionist argues that without a causal link, the content of the judgment is fixed by the neural state alone, rendering the experience irrelevant to the content.
  *   **Agreement:** We agree to examine cases of dissociation to determine if "aboutness" persists when the causal link is severed but the correlation remains.

  **3. The Verbal Dispute on Causation**
  *   **The Issue:** Is the dispute merely verbal regarding whether experiences can be called "causes"?
  *   **Our Stance:** The Epiphenomenalist suspects that on a **difference-making** (counterfactual) account of causation, experiences *do* qualify as causes (since they differ across possible worlds), meaning the Interactionist may be affirming something the Epiphenomenalist does not actually deny. The Interactionist maintains that a **production** (physical transfer) account is required for the kind of causation that secures justification.
  *   **Agreement:** We acknowledge that if we adopt a purely difference-making account, the Epiphenomenalist may concede "causation" while maintaining "physical inertness." We agree to determine if this semantic shift resolves the paradox of judgment or merely relabels it.

  ## III. DISAGREEMENTS TABLE

  | Question | Epiphenomenalist Formulation | Interactionist Formulation | The Crux (Sub-question) | Agreed Case / Evidence | Predictions (Epi / Int) | Falsification Conditions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Source of Reliability** | Reliability is secured by the neural common cause ensuring the judgment matches the experience. | Reliability requires the experience to exert causal power on the judgment to avoid coincidence. | **Does justification require causal contact, or only reliable correlation?** | **Blindsight/Anosognosia:** Subjects make accurate discrimination judgments while denying experience. | **Epi:** Shows judgment can track stimulus without experience (supports inertness).<br>**Int:** Shows judgment is blind/guessing without experience (supports need for causation). | **Epi:** If subjects in blindsight show *phenomenal* knowledge they deny having.<br>**Int:** If subjects with intact experience show *no* reliability when neural pathways are disrupted. |
  | **2. The Paradox of Judgment** | The fact that we talk about qualia is a lawfully correlated byproduct, not a coincidence. | If qualia are inert, the fact that we talk about them *specifically* is an inexplicable coincidence. | **Is the "coincidence" of accurate reporting costly enough to reject epiphenomenalism?** | **Philosophical Zombies:** Conceivability of a physical duplicate that behaves identically without experience. | **Epi:** Zombies are conceivable; their reports are caused by physics, not qualia. We are no different.<br>**Int:** Zombies are inconceivable or unstable; our reports are *about* qualia, which zombies lack. | **Epi:** If it is shown that "aboutness" is impossible without causal efficacy.<br>**Int:** If a coherent model is built where reports track qualia without causal interaction. |
  | **3. Causal Exclusion** | Neural states do all the physical work; adding experiential causation is overdetermination. | Experiential properties are distinct from neural properties and make a unique difference. | **Can distinct properties cause the same event without overdetermination?** | **Neural Timing Studies:** Measuring the precise onset of report vs. the onset of phenomenal awareness (e.g., Libet-style). | **Epi:** Report timing will always be fully explained by neural onset prior to awareness.<br>**Int:** Report timing will show dependency on the *onset of awareness* specifically. | **Epi:** If report initiation strictly requires the timestamp of phenomenal onset.<br>**Int:** If report initiation is fully predictable from pre-phenomenal neural data. |

  ## IV. CONDITIONS FOR REVISION

  We agree that neither position is immune to empirical or conceptual revision. We specify the following conditions under which we would abandon or significantly modify our views.

  **The Epiphenomenalist will revise if:**
  1.  **Empirical:** An empirical result demonstrates that behavioral reports vary systematically with phenomenal character *independently* of variations in the underlying neural substrate (violating physical closure).
  2.  **Conceptual:** It is demonstrated that a "Common Cause" explanation cannot sustain the normative status of knowledge (i.e., if it is proven that one cannot *know* one has an experience if the experience played no role in producing the belief).

  **The Interactionist will revise if:**
  1.  **Empirical:** It is demonstrated that all behavioral reports are fully predictable from neural data prior to the reported onset of conscious experience, rendering the experience causally redundant.
  2.  **Conceptual:** It is demonstrated that the "difference-making" account of causation satisfies the requirements for justification, rendering the demand for "physical production" unnecessary (thereby accepting a form of epiphenomenalism that allows for counterfactual causation).

  **Signed:**

  _________________________ (Epiphenomenalist Proponent)

  _________________________ (Interactionist Proponent)
