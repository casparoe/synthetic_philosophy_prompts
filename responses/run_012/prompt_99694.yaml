answer: |-
  **Final Credence: 0.32**

  I judge the demandingness objection to be a weak indicator of falsehood, primarily because it conflates the difficulty of the moral landscape with a defect in the map. Below is the decomposition.

  **(a) Probability: 0.60**
  *Justification:* Common-sense intuitions track evolutionary fitness and social cohesion more reliably than they track mind-independent moral truths.

  **(b) Probability: 0.50**
  *Justification:* Any morality recognizing the equal weight of distant strangers imposes high opportunity costs, making "demandingness" a structural feature of moral realism rather than a bug of consequentialism.

  **(c) Probability: 0.70**
  *Justification:* The integrity objection identifies a phenomenological cost—alienation from one's ground projects—that exceeds the mere utility loss of resource transfer.

  **(d) Probability: 0.40**
  *Justification:* Empirical claims about sustainable sacrifice are unstable, as optimal giving likely permits significant psychological recovery time, blunting the "extreme" label.

  **(e) Probability: 0.30**
  *Justification:* There is no meta-ethical principle establishing that a moral theory's truth value is inversely correlated with the burden it places on the agent.

  ### Combination Logic
  I treat these terms as a **weighted constraint model**. Term (e) acts as a ceiling: if demandingness is not a theoretical defect (probability 0.30), the objection cannot logically establish falsehood, regardless of the other factors. Terms (a) and (c) provide the evidential fuel, but they are discounted by the defeaters in (b) and (d).
  *   *Base Force:* $(a \times c) = 0.42$
  *   *Defeater Discount:* $(1 - (b \times d)) = 0.80$
  *   *Meta-ethical Cap:* $(e) = 0.30$
  *   *Calculation:* $\text{Min}(0.42 \times 0.80, 0.30) + \text{noise} \approx 0.32$

  ### Sensitivity Analysis
  **Most Sensitive Term:** (e).
  If one accepts that "ought implies can" or that a moral code must be livable to be *true* (not just useful), term (e) rises toward 0.8, which would lift my final credence to roughly 0.65. The entire objection stands or falls on whether difficulty counts against truth.

  **What Would Move It Most:** A **distinction**.
  Specifically, a rigorous distinction between *epistemic* demandingness (hard to know what to do) and *motivational* demandingness (hard to do what you know). If the objection could prove that act-consequentialism requires motivational capacities humans structurally lack (making "ought implies can" fail), my credence would spike. Currently, the objection rests on *unwillingness*, not *inability*.

  ***

  ### The Evidential-Symmetry Argument (ESA)

  **Does it move the number?** Yes.
  **Direction:** Downward.
  **Magnitude:** Approximately -0.05 (from 0.37 to 0.32).

  **Analysis:**
  The ESA is potent because it exposes a methodological inconsistency in the anti-consequentialist's reflective equilibrium. If the intuition "outcomes matter most" is discarded because it conflicts with "I may favor my child," but the latter is retained without independent justification, the rejection is circular. The consequentialist claims the former intuition is *foundational* (defining the moral point of view), while the latter is *derivative* (a heuristic for social living).

  **Is the asymmetry legitimate?**
  The asymmetry is the dispute. The anti-consequentialist argues the two intuitions differ in **kind**: the core consequentialist intuition is abstract and theoretical, whereas the partiality intuition is concrete and phenomenologically immediate. They claim immediate phenomenological data outweighs abstract theoretical coherence.

  However, I find this defense weak. History shows that immediate phenomenology (e.g., intuitions about slavery or gender roles) is often the least reliable guide to moral truth. The ESA successfully highlights that the demandingness objection often relies on "intuition-shaming" the theory while exempting its own counter-intuitions from similar scrutiny. This reinforces my low probability for term (a) (reliability of common-sense intuitions), thereby lowering the final credence. The ESA does not refute the objection entirely, but it strips it of its dogmatic force, reducing it from a "truth-condition failure" to a "cost-benefit disagreement."
