prompt: |-
  Ok so here's what I want. Take the "live and let live" system on quiet sectors of the Western Front in WW1 -- the Christmas truce and the quieter arrangements that outlasted it, where neither side shoots when the other isn't shooting, the informal bargains where each side holds fire if the other does, the ritualized stuff like shelling the same spot at the same time every day -- and run it through the iterated prisoner's dilemma and the evolution-of-cooperation literature. I know the standard story, so skip the part where cooperation can emerge among self-interested players without a central authority.

  What I want is the mapping done properly, and then the places the model breaks. So: who are the players, what are the moves and the actual payoffs, what is the shadow of the future here, and does the game form even match -- is this a prisoner's dilemma, or is it a stag hunt where mutual restraint is best but risky, or chicken? Then the hard parts. Backward induction: if a unit knows it's rotating out, or that a big push is coming, why doesn't restraint unravel before the end? What does noise do to tit-for-tat -- a nervous sentry, a stray shell that nobody ordered -- and does the case need something more forgiving, or a win-stay-lose-shift type rule, to stay stable? And the bit I care most about: the players aren't unitary. The men in the trenches mostly wanted the arrangement; the high commands on both sides didn't, and deliberately ordered raids and barrages to break the tacit truces up. So there's a principal-agent problem sitting on top of the dilemma, where the payoff matrix is being set by someone who isn't playing the game. Does the theory have anything to say about that, or is it just silent?

  Then the reverse direction: what does the episode do to the theory? Does it confirm that cooperation needs a long shadow of the future plus reciprocity, or does it show that something else -- norms, third-party enforcement, the sheer cost of attacking -- is doing the real work? And does it bear at all on the fight over whether human cooperation comes from plain reciprocity or from cultural group selection?

  Lead with your bottom line in the first sentence, then the reasoning. No preamble, dont restate the question, and no bibliography -- I just want the analysis.
