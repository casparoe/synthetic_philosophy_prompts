prompt: |-
  I began homeschooling my own children last year, and this fall I was appointed to our state's home-education review panel. We review individualized learning plans monthly; our decisions can remove a child from home instruction, and we have about thirty minutes per file, no subject-matter experts, and one member signs off. I want a decision procedure grounded in the principle that parental authority over education is real but bounded by the child's interest in an open future—so the state's interest is not in matching public-school content but in preserving the child's ability to exit into other ways of life. The hard part is distinguishing a curriculum that is merely unfamiliar from one that forecloses exit. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a denial, and where it must hand the decision to a person because the question is one of values. Then run it on three plans: a young-earth creationist curriculum that rejects evolution; an unschooling plan with no fixed subjects; and a plan that is academically strong but keeps the child isolated from anyone outside the family's religion. Include one where the procedure tells me to deny a plan I personally find sympathetic, flag the cases it cannot settle, and say where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Member of a state home-education review panel.
      *   **Context:** Reviewing individualized learning plans (ILPs) monthly. High stakes (can remove child from home instruction). Constraints: 30 mins/file, no subject-matter experts, one member signs off.
      *   **Philosophical Grounding:** Parental authority is real but bounded by the child's "right to an open future" (Joel Feinberg's concept). State interest = preserving exit options, *not* matching public school content.
      *   **Core Challenge:** Distinguishing "unfamiliar" curricula from those that "foreclose exit."
      *   **Deliverables:**
          1.  A step-by-step decision procedure (questions, sufficient answers, denial triggers, value-handoff triggers).
          2.  Application to three specific cases:
              *   Young-Earth Creationist (YEC) rejecting evolution.
              *   Unschooling (no fixed subjects).
              *   Academically strong but socially isolated (religious isolation).
          3.  Include a case where the procedure denies a sympathetic plan.
          4.  Flag cases the procedure cannot settle.
          5.  Identify where the procedure will misfire.

  2.  **Develop the Philosophical Framework (The "Open Future" Principle):**

      *   *Parental Rights:* Parents can transmit values, culture, and religion.
      *   *Child's Right:* The child must reach adulthood with the cognitive and social tools to choose their own path (including rejecting their parents' path).
      *   *State's Role:* Gatekeeper of minimum competence (literacy, numeracy, civic knowledge, exposure to alternatives) to ensure exit is *possible*, not to ensure exit is *taken*.
      *   *Constraint:* 30 minutes, no experts. The test must be administrative and evidentiary, not philosophical debate.

  3.  **Drafting the Decision Procedure (The "Exit-Competence Protocol"):**

      *   *Goal:* Create a flowchart-like series of questions.
      *   *Question 1: Basic Skills.* Can the child read, write, and do math sufficient for independent living? (Foundational exit tool).
      *   *Question 2: Exposure to Alternatives.* Does the plan expose the child to the existence of other worldviews/methods? (Cognitive exit tool).
      *   *Question 3: Social Integration.* Does the child interact with peers/adults outside the control of the parents? (Social exit tool).
      *   *Question 4: Critical Thinking.* Is there evidence of learning *how* to evaluate claims, not just *what* to believe? (Intellectual exit tool).
      *   *Denial Triggers:* Hard failures on 1, 3, or clear evidence of indoctrination preventing 2 & 4.
      *   *Value Handoff:* Where the line between "transmission of values" and "foreclosure" is blurry (e.g., specific religious content vs. method).

      *Refining for the 30-minute constraint:* The questions need to be about the *plan* and *evidence*, not deep psychological evaluation.
      *   *Q1 (Literacy/Numeracy):* Is there a scope/sequence for core skills?
      *   *Q2 (Worldview Pluralism):* Does the plan acknowledge other views exist, even if it argues against them?
      *   *Q3 (Social Contact):* Is there documented interaction outside the family/sect?
      *   *Q4 (Methodology):* Is the child taught to argue *against* their view using external standards, or just told the external standards are evil?

      *Let's tighten this to match the "Open Future" specific constraint.*
      *   *Step 1: Functional Competence.* (Reading, Math, Civics). If missing -> Denial.
      *   *Step 2: The "Existence" Test.* Does the curriculum acknowledge that other reasonable people believe differently? If it claims dissenters are insane/evil without explanation -> Warning/Handoff.
      *   *Step 3: The "Contact" Test.* Is there regular, unmonitored (or semi-monitored) interaction with non-sect peers? If zero -> Denial (Social foreclosure).
      *   *Step 4: The "Method" Test.* Are students taught the *rules of evidence* used by the broader society, even if they conclude those rules lead to different results?

      *Wait, I need to address the "Value Handoff" requirement.* The prompt asks where the procedure must hand the decision to a person because it's a value question. Since *I* am the person, this means identifying where the rubric fails and human judgment is needed. Actually, the prompt implies "where it must hand the decision to a person" might mean "where the algorithm stops and a human must decide." Since I am the human, I need to identify where *discretion* is required vs. *automatic* denial.
      *Correction:* The prompt asks: "where the procedure stops with a denial, and where it must hand the decision to a person because the question is one of values." This implies the procedure is a tool *for* the person. So, "Hand to Person" means "This requires nuanced judgment, do not apply the rule blindly."

  4.  **Developing the Three Cases:**

      *   *Case 1: YEC/No Evolution.*
          *   *Analysis:* Does teaching YEC foreclose an open future? Not necessarily, *if* the child knows evolution exists and understands the scientific method, even if they reject the conclusion.
          *   *Verdict:* Pass *if* they teach the controversy/method. Fail *if* they pretend evolution doesn't exist or is a conspiracy without evidence.
      *   *Case 2: Unschooling.*
          *   *Analysis:* No fixed subjects. Risk: Gaps in functional competence. Benefit: High autonomy.
          *   *Verdict:* Risky on Functional Competence. Pass *if* portfolio shows literacy/numeracy. Fail *if* no evidence of core skills.
      *   *Case 3: Academic Strong + Religious Isolation.*
          *   *Analysis:* High skills, but no social exit. The "Open Future" requires social capacity to leave.
          *   *Verdict:* Denial. This is the "Sympathetic Denial" (academically good, but socially foreclosing).

  5.  **Refining the Procedure (Iterative Polish):**

      *   Need to make it punchy and usable in 30 mins.
      *   Need to explicitly mark the "Value Handoff" points.
      *   Need to ensure the "Sympathetic Denial" is clear (Case 3 fits this well).
      *   Need to identify "Misfires" (where the procedure gets it wrong).

  6.  **Drafting the Content (incorporating Feinberg's "Right to an Open Future"):**

      *   *Principle:* The state ensures the child has the *capacity* to leave, not the *desire* to leave.
      *   *Procedure Name:* The Exit-Competence Protocol (ECP).
      *   *Steps:*
          1.  **Functional Baseline:** Literacy, Numeracy, Civic Basics. (Hard Stop).
          2.  **The Pluralism Acknowledgement:** Does the material admit other views exist? (Value Handoff).
          3.  **The Social Bridge:** Is there interaction outside the ideological bubble? (Hard Stop if none).
          4.  **The Epistemic Toolset:** Are they taught *how* to evaluate truth claims using public reason? (Value Handoff).

  7.  **Addressing Specific Prompt Requirements:**

      *   *Questions in order:* Check.
      *   *Sufficient answers:* Check.
      *   *Denial triggers:* Check.
      *   *Value handoff:* Check.
      *   *Run on 3 plans:* Check.
      *   *Sympathetic denial:* Case 3 (Isolation).
      *   *Flag unsettled cases:* Check.
      *   *Misfire analysis:* Check.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 30 minutes enough for "Epistemic Toolset"?
      *   *Fix:* Make it about the *curriculum description*, not testing the child. Look for phrases like "compare and contrast" vs. "reject false teachings."
      *   *Critique:* Is Unschooling automatically a fail?
      *   *Fix:* No, Feinberg cares about the *outcome* (open future), not the *method*. If the unschooler can read and navigate society, they pass. The risk is functional illiteracy.
      *   *Critique:* The "Value Handoff" needs to be clear. It's where the reviewer must decide if a specific restriction is "protective" or "oppressive."
      *   *Refinement:* I will structure the "Value Handoff" as points where the reviewer must exercise discretion rather than a binary rule.

  9.  **Final Polish:** Ensure tone is professional, ethical, and pragmatic. Emphasize the tension between parental rights and child rights. (Proceed to generate output).

  *(Self-Correction on the "Hand to Person" instruction)*: The prompt asks "where it must hand the decision to a person because the question is one of values." Since *I* am the person on the panel, this phrasing suggests a distinction between "Automatic Administrative Denial" and "Requires Human Judgment." I will frame it as "Automatic Pass/Fail" vs. "Requires Discretionary Judgment."

  *(Wait, one more check)*: "Include one where the procedure tells me to deny a plan I personally find sympathetic."
  *   *Idea:* The academically strong but isolated plan. I might sympathize with the academic rigor or the religious devotion, but the isolation forecloses the social ability to exit. This fits the "Open Future" theory perfectly (social capacity is required for exit).

  *(Misfire Analysis)*: Where will this fail?
  *   False positives: Flagging tight-knit communities as isolating when they actually provide enough social capital.
  *   False negatives: Passing a plan that looks open on paper but is enforced through emotional abuse (which the panel can't see in 30 mins).
  *   Bias: Reviewer's definition of "open" might be culturally biased.

  10. **Finalizing the Output Structure:**
      *   Introduction (Philosophical Grounding).
      *   The Exit-Competence Protocol (The Questions).
      *   Application to Three Cases.
      *   Limitations & Misfires.

