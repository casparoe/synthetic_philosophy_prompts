answer: |-
  ### The Philosophical Grounding: The Exit-Competence Standard

  This procedure is built on Joel Feinberg's "Right to an Open Future." The state does not act *in loco parentis* to maximize the child's potential, but as a guarantor of minimum conditions required for autonomy. Parental authority ends where it renders the child incapable of choosing a different life as an adult.

  **The Goal:** Ensure the child possesses the *functional*, *intellectual*, and *social* capacity to exit their upbringing.
  **The Constraint:** 30 minutes per file, no subject experts.
  **The Standard:** We do not judge truth; we judge *access to alternatives*.

  ---

  ### Part 1: The Exit-Competence Protocol (ECP)

  Ask these four questions in order. If a plan fails a "Hard Stop," deny the plan. If it reaches a "Discretionary Zone," you must exercise judgment based on the totality of evidence.

  #### Question 1: The Functional Baseline
  **Question:** Does the plan provide a scope and sequence for literacy, numeracy, and basic civic knowledge (how government/laws work) commensurate with state minimums?
  *   **Sufficient Answer:** Yes. The plan lists specific curricula, milestones, or portfolio assessments showing progress in reading, math, and civics.
  *   **Hard Stop (Denial):** No. The plan explicitly rejects literacy/numeracy (e.g., "reading is unnecessary until age 12") or provides no evidence of assessment for two consecutive years.
  *   **Rationale:** Without basic skills, the child cannot navigate the economy or legal system to exit.

  #### Question 2: The Pluralism Acknowledgement
  **Question:** When the curriculum addresses contested topics (science, history, ethics), does it acknowledge that other reasonable people hold different views?
  *   **Sufficient Answer:** Yes. The material may argue *against* alternative views, but it accurately describes them first (e.g., "Evolutionists believe X, but we believe Y because...").
  *   **Hard Stop (Denial):** No. The material claims dissenting views do not exist, are purely malicious conspiracies, or that holding them is a crime/sin punishable by the family/community immediately.
  *   **Discretionary Zone (Value Handoff):** The material describes alternative views but uses highly charged, dehumanizing language (e.g., "evil," "insane").
      *   *Action:* You must decide if this is robust religious transmission or psychological foreclosure. Look for counter-evidence in the plan (e.g., debate club, exposure to outside media).

  #### Question 3: The Social Bridge
  **Question:** Does the plan document regular, recurring interaction with peers or adults who are not members of the family's immediate religious or ideological community?
  *   **Sufficient Answer:** Yes. Evidence of co-ops, sports, public library use, music lessons, or community service with diverse participants.
  *   **Hard Stop (Denial):** No. The plan explicitly states the child is to have *no* contact with outsiders to prevent "contamination," or all contact is strictly monitored by clergy/parents with no privacy.
  *   **Rationale:** A child cannot exit a community they have never physically entered. Social isolation is a physical barrier to the open future.

  #### Question 4: The Epistemic Toolset
  **Question:** Does the plan teach the child *how* to evaluate claims using public standards of evidence, even if the conclusion is predetermined?
  *   **Sufficient Answer:** Yes. The child is taught logic, the scientific method, or legal reasoning, even if applied to defend family beliefs.
  *   **Discretionary Zone (Value Handoff):** The plan relies entirely on authority ("Believe because Scripture/Parents say so").
      *   *Action:* You must judge if the child is being taught *blind obedience* or *faith-based reasoning*. Blind obedience forecloses the future; faith-based reasoning is a value choice permitted to parents.
  *   **Hard Stop (Denial):** The plan explicitly forbids the child from asking "why" or punishes questioning as disobedience.

  ---

  ### Part 2: Application to Three Plans

  #### Case 1: The Young-Earth Creationist (YEC) Plan
  *   **Content:** Rejects evolution; teaches Earth is 6,000 years old. Uses a standard textbook for biology but includes a companion guide refuting evolution.
  *   **ECP Run:**
      1.  *Functional Baseline:* **Pass.** Standard math/reading texts used.
      2.  *Pluralism Acknowledgement:* **Pass.** The companion guide explains evolutionary theory before refuting it. The child knows the dominant scientific view exists.
      3.  *Social Bridge:* **Pass.** Child attends a local homeschool co-op for labs.
      4.  *Epistemic Toolset:* **Pass.** Teaches scientific method, argues that data is interpreted differently.
  *   **Verdict:** **Approve.**
  *   **Reasoning:** Teaching a specific religious conclusion does not foreclose exit if the child understands the alternative and possesses the tools to evaluate it later. The "Open Future" protects the right to *choose* creationism as an adult, provided they knew other options existed.

  #### Case 2: The Unschooling Plan
  *   **Content:** No fixed subjects. Learning is interest-led. Portfolio shows deep knowledge of insects and video game design, but sporadic writing samples and no math records.
  *   **ECP Run:**
      1.  *Functional Baseline:* **Discretionary Zone.** Reading is evident, but math is absent.
      2.  *Pluralism Acknowledgement:* **Pass.** High exposure to diverse ideas via internet/community.
      3.  *Social Bridge:* **Pass.** High interaction with diverse peers.
      4.  *Epistemic Toolset:* **Pass.** High autonomy and critical thinking evident.
  *   **Verdict:** **Conditional Approval / Probation.**
  *   **Reasoning:** Unschooling often aligns well with an "Open Future" regarding autonomy (Question 4), but risks failing the "Functional Baseline" (Question 1). You must require a remediation plan for math within 6 months. Without numeracy, the child's economic exit options are foreclosed, regardless of their philosophical freedom.

  #### Case 3: The Academic Stronghold (The Sympathetic Denial)
  *   **Content:** Rigorous classical curriculum. Child tests at 12th-grade level in 8th grade. However, the plan states: "To preserve purity, the child will not attend public events, play sports, or interact with non-church peers. All socialization is through church-supervised groups."
  *   **ECP Run:**
      1.  *Functional Baseline:* **Pass.** Exceptional academic records.
      2.  *Pluralism Acknowledgement:* **Fail.** History and literature are curated to exclude secular perspectives entirely.
      3.  *Social Bridge:* **Hard Stop (Denial).** No unmonitored contact with outsiders. All socialization is ideologically vetted.
      4.  *Epistemic Toolset:* **Fail.** Questioning is framed as rebellion.
  *   **Verdict:** **Deny.**
  *   **Reasoning:** This is the **Sympathetic Denial**. You may admire the academic rigor and the parents' devotion. However, this plan creates a "gilded cage." The child has the *intellectual* capacity to leave but lacks the *social* capacity. They do not know how to navigate a secular job interview, interact with a non-believing landlord, or build a support network outside the sect. By preventing social integration, the parents have made exit practically impossible, even if legally permitted. The state must intervene to mandate outside socialization.

  ---

  ### Part 3: Limitations, Unsettled Cases, and Misfires

  #### Cases the Procedure Cannot Settle (The Value Handoff Limits)
  The ECP flags these as requiring human judgment, but in a 30-minute review without experts, these are often guesswork:
  1.  **The "Soft" Indoctrination:** A plan passes all checks but uses emotionally manipulative language (e.g., "Outside friends will lead you to hell"). You cannot measure psychological impact in 30 minutes.
  2.  **The "Cultural" Definition of Competence:** Is learning a trade (farming) sufficient for the "Functional Baseline" if the child cannot do algebra? The ECP says yes, provided they can manage finances, but this is a value judgment about what constitutes a "good" life.
  3.  **The "Temporary" Isolation:** A plan isolates the child for 2 years during a religious adolescence rite. Is this a temporary restriction or a foreclosure? The ECP cannot distinguish duration well.

  #### Where the Procedure Will Misfire
  1.  **The Bureaucratic False Positive:** A family checks all the boxes (co-op, standardized tests, diverse reading) but maintains control through emotional abuse or threat of shunning. The ECP sees a compliant file; the child experiences a closed future. *The procedure cannot see fear.*
  2.  **The Cultural Bias Misfire:** The ECP assumes "exit" means entering the secular liberal workforce. It may unfairly flag tight-knit cultural communities (e.g., Amish or immigrant enclaves) that provide a robust, albeit narrow, future within their community. If the community is stable and the child is consenting to stay as an adult, was the future truly "closed"? The ECP risks imposing a specific vision of autonomy.
  3.  **The "Unschooling" Penalty:** Because Unschooling lacks a "scope and sequence," it often triggers Question 1 (Functional Baseline) warnings. This may disproportionately deny plans that are actually high-quality but non-standard, favoring rigid curricula over organic learning.

  #### The Sympathetic Denial Reflection
  In Case 3, the procedure forces you to deny a plan that produces an "excellent" student by traditional metrics. This is the hardest part of the role. You are not protecting the child's *grades*; you are protecting their *exit*. If you approve Case 3, you are certifying that a child who cannot talk to a neighbor without parental permission is ready for adulthood. The procedure demands you prioritize **capacity for independence** over **academic achievement**.
