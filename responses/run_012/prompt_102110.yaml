      *   **Application of Zorn:** "By Zorn, P has a greatest element M."
          *   *Critique:* Consistent with their incorrect statement of Zorn, but incorrect mathematically. Zorn gives a *maximal* element.
      *   **Conclusion:** "Since M is a proper ideal and is greatest, no proper ideal properly contains it. Thus M is maximal."
          *   *Critique:* The definition of maximal is "no proper ideal properly contains it." If $M$ were truly *greatest*, it would contain all other proper ideals, which implies maximality, but the existence of a *greatest* element is false in general (there might be multiple maximal ideals). The logic flows from their wrong premise, but the conclusion "M is maximal" is what we wanted.
      *   **Final Sentence:** "Therefore every commutative ring with identity has a maximal ideal."
