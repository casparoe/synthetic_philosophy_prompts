prompt: |-
  I'm a first-time TA for an intro algebra course, and I'm currently grading the take-home quiz on Zorn's lemma. The question was: State Zorn's lemma, then use it to prove that every nonzero commutative ring with identity has a maximal ideal. Be explicit about the poset and why Zorn applies. One student's answer is pasted below. I need to give it a grade out of 10 plus the specific comments that justify the grade, point by point, because the course head wants a paper trail and I don't want to be either too harsh or too lenient. Another TA told me they'd just give it full marks since the main idea is there, but I'm not so sure. We've been treating Zorn as an axiom, and the convention in this course is that rings have a multiplicative identity; maximal ideal means a proper ideal not properly contained in any other proper ideal. Here's the answer:

  Zorn's Lemma: If P is a nonempty partially ordered set and every chain in P has an upper bound in P, then P has a greatest element.

  Let R be a commutative ring with identity. Let P be the set of all proper ideals of R, ordered by inclusion. P is nonempty because {0} is a proper ideal. Let C be a chain in P. Let U be the union of all I in C. U is an ideal because it is a union of ideals. U is proper because every I in C is proper. So U is an upper bound for C. By Zorn, P has a greatest element M. Since M is a proper ideal and is greatest, no proper ideal properly contains it. Thus M is maximal. Therefore every commutative ring with identity has a maximal ideal.

  Please give me the grade and the comments. I'd like the comments to identify which steps are actually correct, which are wrong or incomplete, and how much each issue should affect the grade. If a step is wrong but doesn't change the final conclusion, say so explicitly, because I don't want to penalize the same error twice.
