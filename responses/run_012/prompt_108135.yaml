answer: |-
  ### The Case: The Unheard Avant-Garde

  Elias is a sound engineer finishing a contract at a studio. On a drive marked for deletion, he finds a completed, 40-minute avant-garde composition by a reclusive genius. Experts agree it is a masterpiece of sonic architecture—objectively complex, innovative, and beautiful. Elias has five minutes to copy it to a secure server before the drive is wiped. He is fully informed: he knows the technical merits, knows the critics' verdict, and knows that if he saves it, the work will exist (though it may never be played). He is practically coherent: no weakness of will, no conflicting desires.

  However, Elias is aesthetically inert regarding this genre. He finds the sound screeching and unpleasant. He feels no vicarious pride in human creativity, no desire to promote art, and no anticipation of future enjoyment (his own or others'). He has no professional stake in the file. His motivational set (*S*) contains desires for his own comfort, his family's welfare, and enjoyment of rock music, but nothing that connects to preserving avant-garde art. Saving the file costs him negligible effort, but offers him no subjective satisfaction. He walks away.

  **Borderline Moral Note:** This case relies on *aesthetic value* as a source of reasons. Some philosophers subsume aesthetic reasons under moral reasons (duties to culture); others (like Parfit) treat them as distinct normative domains. If your group treats cultural preservation as inherently moral, this case collapses into a standard moral externalism case. To prevent this, stipulate that the work has no cultural significance beyond its immediate sonic properties—it is beauty *simpliciter*, not heritage.

  ***

  ### The Verdicts

  **The Williams-Style Internalist:**
  Elias has **no reason** to save the file. A reason requires a sound deliberative route from the agent's existing *S*. Elias's *S* contains no desire for aesthetic preservation, no curiosity about this genre, and no general desire to "do what is valuable." Since sound deliberation (correcting false beliefs, imagining outcomes) cannot generate a desire for an experience the agent finds unpleasant or indifferent, there is no hook in *S* for the reason to grab onto. The fact that the music is "objectively beautiful" is inert without a corresponding subjective disposition to value beauty.

  **The Parfit-Style Externalist:**
  Elias has **a decisive reason** to save the file. Reasons are provided by objective facts, specifically normative facts about value. The fact that *this composition is beautiful* is a reason-giving fact, independent of Elias's psychology. Elias is making a normative mistake, not a psychological one. He is failing to respond to a value that exists whether he cares about it or not. His lack of motivation is a failure of rationality, not a limit on reasons.

  ***

  ### The Single Feature Doing the Work

  The work is done by **Constitutional Affective Inertness**.

  This is not ignorance (he knows the facts) and not weakness of will (he is coherent). It is a mismatch between the objective value and the agent's capacity to be motivated by that *type* of value.

  **If you remove this feature:**
  If Elias *did* feel a tug of interest, or a vague sense that "art matters," the Internalist could construct a deliberative route (e.g., "I value art generally → this is art → I should save it"). The case would collapse back into a standard **Wife-Beater** style scenario, where the Internalist argues the agent *would* care if they deliberated properly (e.g., "if he imagined the victim's pain"). By making Elias constitutionally indifferent to *this specific value*, we block the "imaginative expansion" move. He can imagine the sound perfectly well; he just doesn't care.

  ***

  ### The Internalist Counter-Move & Unfalsifiability

  **The Attack:**
  A sophisticated Williamsian will attack the description of *S*. They will argue that *S* is not just occurrent desires but includes "dispositional" elements and general principles like "I desire to do what is worthwhile." If Elias is rational, he must have a general desire to respond to value. If he has *that* desire, there *is* a deliberative route: "This is valuable → I desire to respond to value → I have a reason."

  **The Unfalsifiability Problem:**
  If the Internalist insists that *any* rational agent must have a general desire to respond to objective reasons in their *S*, Internalism becomes unfalsifiable. It effectively concedes Externalism (that there are objective reasons) but adds a redundant psychological step ("and you must also want to follow them"). To avoid this, the Internalist must bite the bullet: a rational agent can simply lack the desire to respond to certain objective values. But this makes Internalism look like it denies the normativity of those values entirely.

  ***

  ### The "Different Meanings" Move

  Can this be defused by saying Internalists and Externalists mean different things by "reason"?

  *   **The Move:** Internalists are talking about *explanatory* reasons (what explains action), while Externalists are talking about *normative* reasons (what justifies action).
  *   **Why it fails here:** Both sides claim to be talking about *normative* practical reasons (what an agent ought to do, all things considered). Williams explicitly claims his view is about what an agent *has a reason to do*, not just what motivates them. Parfit claims these reasons can motivate but don't *need* to. If they are just talking past each other, the debate is verbal. But the friction in the case (Elias walking away) suggests a substantive disagreement about whether Elias is *irrational* (Parfit) or merely *amotivated* (Williams).

  ***

  ### Settled vs. Contested Ground (For Your Presentation)

  **Settled (Textual Consensus):**
  1.  **Williams:** Internalism is defined by the "Subjective Motivational Set" (*S*) and the requirement of a "sound deliberative route." Williams rejects the idea that mere objective facts provide reasons without a psychological hook.
  2.  **Parfit:** Externalism holds that reasons are provided by objective normative facts (like value or rationality) and do not depend on the agent's prior motivations.
  3.  **The Disagreement:** Both agree they are analyzing the same concept ("normative reason for action"), not two different words. This is not a verbal dispute in their own framing.

  **Contested (Scholarly Debate):**
  1.  **The Scope of "Deliberation":** Williams scholars dispute how "broad" the sound deliberative route is. Can it include *acquiring* new desires through imagination, or only satisfying existing ones? If it's too broad, Internalism looks like Externalism in disguise.
  2.  **Parfit's Hybrid View:** In *On What Matters*, Parfit concedes some ground to Internalism regarding "motivating reasons," but holds firm on "normative reasons." Some argue this creates a gap in his theory; others say it's a necessary distinction.
  3.  **The "Rational Requirement":** It is contested whether Williams allows for a "general desire to be rational" in *S*. If he does, the gap between him and Parfit narrows significantly.

  **Presentation Tip:** When you speak, emphasize that this case isolates **Aesthetic/Perfectionist Value** to avoid the "Moral Duty" shield. The key question for the group is: *Is Elias irrational for walking away?* If yes, you lean Parfit. If no (he's just indifferent), you lean Williams.
