      *Winner:* Modifying (3) is the least costly because it resolves the Free Will conflict without destroying the moral comfort (2) or the mechanism (1/6). You can have "responsibility" without "libertarian free will."

      *Wait, one more thing:* (1) + (2) is actually a huge problem. How does an impersonal law track *moral* value? This is the "Naturalistic Fallacy." I need to highlight this as a major tension too. But (3) is the one that breaks the *human* side of the equation.

