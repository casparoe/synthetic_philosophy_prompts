answer: |-
  **The Case of the Forgetful Baker**

  You are roasting a chicken that requires basting at two specific ten-minute intervals to be perfect. You set a timer, but when the alarm sounds and you walk into the kitchen, you suffer a momentary lapse: you cannot tell if this is the first basting window or the second. If you open the oven at the first window, heat escapes and the meat stays raw (value 1). If you open it at the second window, it browns perfectly (value 4). If you miss both windows, it dries out completely (value 0). You cannot distinguish the occasions, so you must commit to a single probability $p$ of opening the door whenever the alarm sounds. The expected value of the dinner is the sum of the payoff at the first window plus the payoff at the second window weighted by the chance you reach it: $E = p(1) + (1-p)p(4) + (1-p)^2(0)$. Simplifying, $E = p + 4p - 4p^2 = 5p - 4p^2$. To find the best policy, we take the derivative with respect to $p$ and set it to zero: $5 - 8p = 0$, which yields **$p = 5/8$**. This mixed strategy (open the door 62.5% of the time) yields an expected value of 1.56, which beats always opening ($p=1$, value 1) or never opening ($p=0$, value 0).

  ***

  **1. The Trap of Local Reasoning**
  Someone reasoning "one decision at a time" ignores the ex-ante plan and asks, "Given I am standing here at a node, is it better to stop or go?" To answer this, they maximize the expected payoff *conditional on having reached a node*. The probability of reaching *any* node is $1 + (1-p)$ (you always reach the first, and reach the second with probability $1-p$). The conditional value is $V_{node} = \frac{5p - 4p^2}{2 - p}$. Maximizing this using the quotient rule yields $2p^2 - 8p + 5 = 0$, or **$p \approx 0.775$**. The local reasoner wants to stop more often than the ex-ante planner (77.5% vs 62.5%). Why? Because simply being at a node makes it statistically likely you have already survived the first window, so you feel you are probably at the second window where stopping is good. But if you act on this feeling and stop more often, you reduce the chance of ever reaching the second window, lowering the overall expected dinner quality. The "decide at the node" frame fails because your current choice determines the probability of you being there.

  **2. The Active Feature**
  The tension is driven entirely by **imperfect recall** (indistinguishability). If you could tell the first window from the second, the problem collapses into two distinct decisions. At the first window, you would compare Stopping (1) vs. Continuing (eventual 4), so you would Continue. At the second, you would compare Stopping (4) vs. Continuing (0), so you would Stop. You would achieve the perfect payoff of 4 with no mixing required. The need for a probabilistic mix arises solely because you are forced to play the same strategy at both nodes, binding your future self to your current self's limitations.

  **3. The Wrinkle: Partial Recognition**
  Now suppose that 50% of the time the alarm is clear and you recognize which window it is, while 50% of the time you remain absent-minded. When you recognize the window, you play optimally: Continue at the first, Stop at the second. On the *unrecognized* occasions, let $q$ be your probability of stopping.
  *   **Leaving Window 1:** You always Continue when recognized (50%). When unrecognized (50%), you Continue with $(1-q)$. Total prob of reaching Window 2 is $0.5(1) + 0.5(1-q) = 1 - 0.5q$.
  *   **Stopping at Window 1:** Only happens when unrecognized: $0.5q$. Payoff 1.
  *   **Stopping at Window 2:** You reach here with $(1 - 0.5q)$. You Stop if recognized (50%) or if unrecognized and choosing to Stop ($0.5q$). Total Stop Prob at 2 is $(1 - 0.5q)(0.5 + 0.5q)$. Payoff 4.
  *   **Expected Value:** $V(q) = 0.5q(1) + 4(1 - 0.5q)(0.5 + 0.5q) = 0.5q + 4(0.5 + 0.25q - 0.25q^2) = 2 + 1.5q - q^2$.
  *   **Optimization:** $dV/dq = 1.5 - 2q = 0 \Rightarrow$ **$q = 0.75$**.

  The policy **moves** from $0.625$ to $0.75$. It shifts because the recognized actions act as a commitment device. Since you *guarantee* continuing at Window 1 half the time, an "unrecognized" alarm is now stronger evidence that you are at Window 2 than it was in the full-amnesia case. Because you are more likely to be at the second window, you should stop more often.

  ***

  **A Note on the Skeptic**
  A skeptic will claim you built the case backwards by privileging the ex-ante calculation ($p=5/8$) over the interim calculation ($p \approx 0.775$). They will argue: "Why should the baker be bound by a plan made before they entered the kitchen? When they are actually standing there, the math says stopping is more valuable. Rationality is about maximizing utility *now*, not honoring past commitments."

  The defender of the ex-ante view replies that in the absence of perfect recall, **there is no distinction between the plan and the action.** Because the baker cannot tell the nodes apart, the decision made "now" *is* the decision made "then." If the baker deviates to $p=0.775$ at the node, they are effectively rewriting the strategy for *both* nodes, including the one they might have already passed. By deviating, they lower the ex-ante value of the dinner (from 1.56 to roughly 1.53). The tension falls out of the setup because imperfect recall destroys the separation between "planning self" and "acting self"; they are forced to be the same agent, and only the ex-ante perspective accounts for the full causal chain of that agency.
