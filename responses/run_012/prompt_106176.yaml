answer: |-
  # ACCURACY-FIRST EPISTEMOLOGY: A DECISION TREE

  **Start:** You accept that a credence is better the closer it comes to the truth value of the proposition. Follow the path of your commitments to find your position.

  ---

  ### NODE 1: Is accuracy the *sole* fundamental epistemic good?
  *   **NO** → **LEAF 1: EPISTEMIC PLURALISM**
      *   *Commitment:* Accuracy is one value among others (e.g., understanding, coherence, explanatory power).
      *   *Most Awkward Commitment:* Lacks a common currency to resolve trade-offs when accuracy conflicts with other goods.
  *   **YES** → Go to Node 2.

  ### NODE 2: Is the epistemic value of a whole credence function fixed entirely by the accuracy of its individual credences?
  > **CONCRETE PROBES FOR THIS BRANCH:**
  > 1.  *The Conjunction Test:* Agent A has slightly more accurate credences in $P$ and $Q$ individually, but assigns $P \land Q$ a probability violating the axioms. Agent B has slightly less accurate individual credences but is logically coherent. If you rank B higher, you reject additivity.
  > 2.  *The Holism Test:* Can a penalty for logical inconsistency be added to the accuracy score, or must accuracy be defined proposition-by-proposition? If the former, value is not decomposable.

  *   **NO** → **LEAF 2: GLOBAL HOLISM**
      *   *Commitment:* The value of the state cannot be read off the accuracy of its parts; logical relations have intrinsic value.
      *   *Most Awkward Commitment:* Requires valuing logical relations over truth-proximity for specific claims.
  *   **YES** → Go to Node 3.

  ### NODE 3: Must the ranking of credence functions come from a *strictly proper* scoring rule?
  *   **NO** → **LEAF 3: ACCURACY PERMISSIVISM**
      *   *Commitment:* Any truth-directed measure suffices; multiple credence functions may maximize expected accuracy.
      *   *Most Awkward Commitment:* Allows credences that the agent knows are less accurate than available alternatives.
  *   **YES** → Go to Node 4.

  ### NODE 4: Is expected accuracy to be assessed from the *agent's own* point of view (using their own credences)?
  *   **NO** → **LEAF 4: OBJECTIVE STANDPOINT**
      *   *Commitment:* Comparisons are made from an external or "God's eye" view (e.g., using true probabilities).
      *   *Most Awkward Commitment:* Norms may require agents to adopt credences they deem self-defeating.
  *   **YES** → Go to Node 5.

  ### NODE 5: Does the programme deliver *diachronic* norms (such as conditionalization)?
  *   **NO** → **LEAF 5: SYNCHRONIC ACCURACY**
      *   *Commitment:* Accuracy constrains only belief states at a time; updating norms must come from elsewhere.
      *   *Most Awkward Commitment:* Cannot condemn arbitrary belief changes as irrational.
  *   **YES** → Go to Node 6.

  ### NODE 6: Does accuracy alone yield these diachronic norms, or is an added bridge principle required?
  *   **NO (Bridge Required)** → **LEAF 6: DIACHRONIC VIA BRIDGE**
      *   *Commitment:* Accuracy justifies updating rules only when combined with independent decision-theoretic principles.
      *   *Most Awkward Commitment:* Accuracy is insufficient to ground rational dynamics alone.
  *   **YES (Accuracy Alone)** → Go to Node 7.

  ### NODE 7: Is the chance–credence link (Principal Principle) derived from accuracy?
  *   **NO** → **LEAF 7: INDEPENDENT CHANCE CONSTRAINT**
      *   *Commitment:* The link between objective chance and credence is a separate rational requirement.
      *   *Most Awkward Commitment:* Accuracy is not the sole source of rational constraint.
  *   **YES** → **LEAF 8: ORTHODOX ACCURACY-FIRST**
      *   *Commitment:* Accuracy is the sole good, additive, strictly proper, subjective, diachronic, and derives chance norms.
      *   *Most Awkward Commitment:* Requires accepting that probabilistic coherence is a truth-directed requirement.

  ---
  *Note: No leaves are flagged as indistinguishable; each represents a unique combination of commitments regarding the scope and source of epistemic norms.*
