      *   **Task:** Audit a colleague's analogy/argument.
      *   **Colleague's Position:** Species are individuals (particulars), organisms are parts. Species birth = speciation, life = lineage persistence, death = extinction.
      *   **Policy Argument:** Bottlenecks are comas (not death); de-extinction is revival (not replication).
      *   **Requirements:**
          1.  Map the analogy explicitly (correspondence table).
          2.  Test the mapping (identify breakdowns).
          3.  Evaluate specific candidate disanalogies provided by the user (vagueness, anagenesis, integration/causal connection, counting/categorization).
          4.  Evaluate the student's objection ("the wolf is a mammal").
          5.  Assess whether the conservation conclusion survives.
          6.  Suggest better analogies (river, archipelago, etc.).
          7.  **Constraint:** Use British English.

  2.  **Deconstruct the Colleague's Position (Species-as-Individuals):**
      *   This is a well-known position in philosophy of biology, associated with Ghiselin, Hull, and others.
      *   *Core claim:* Species are not natural kinds (classes defined by essential properties) but historical individuals (spatiotemporally continuous entities).
      *   *Relation:* Organism : Species :: Cell : Organism (Part : Whole).
      *   *Policy Implication:* Identity is tied to historical continuity, not numerical abundance or phenotypic exactness.

  3.  **Map the Analogy (Task 1):**
      *   *Whole (Individual):* The Species (e.g., *Canis lupus*).
      *   *Parts:* The Organisms (wolves).
      *   *Birth:* Speciation event (lineage splitting).
      *   *Life:* Persistence of the genealogical lineage.
      *   *Death:* Extinction (end of the lineage).
      *   *Pathology:* Population bottleneck (injury/coma).
      *   *Resurrection:* De-extinction (revival).

  4.  **Evaluate Candidate Disanalogies (Task 2 & 3):**
      *   *Vagueness of Boundaries:* Organism boundaries (skin, membrane) are usually sharper than species boundaries (hybrid zones, ring species). *Relevance:* High. If we can't say when the individual starts/ends, the "coma vs. death" distinction gets muddy.
      *   *Anagenesis (Transformation without splitting):* If lineage A turns into B without splitting, did A die? In the individual view, A ceases to exist. But if it's just transformation, is it death or growth? *Relevance:* High. Challenges the "death" condition required for the extinction argument.
      *   *Integration/Causal Connection:* Organism parts interact physiologically. Conspecifics might be geographically isolated and never meet. *Relevance:* Critical. This is the "cohesion" problem. If parts don't interact, in what sense is it a *single* individual? This weakens the moral weight of the "whole."
      *   *Counting/Categorization:* If species are individuals, what is the category "species"? It becomes a rank, not a natural kind. *Relevance:* Low for policy, high for metaphysics. Doesn't directly kill the conservation argument, but complicates the ontology.
      *   *Student's Objection ("The wolf is a mammal"):* This relies on the predication of class membership. If species are individuals, "is a mammal" must be interpreted differently (e.g., part of a larger individual or a relational property). *Verdict:* Student is too quick. It assumes a class-based logic that the individual thesis explicitly rejects. It's a linguistic intuition, not a metaphysical refutation.

  5.  **Assess the Conservation Conclusion (Task 4):**
      *   *Claim:* Bottleneck = Coma; De-extinction = Revival.
      *   *Analysis:* Even if species are individuals, does moral status follow?
      *   *Bottleneck:* If the lineage continues genetically, the "individual" survives. This holds up reasonably well under the Individual thesis.
      *   *De-extinction:* This is the weak point. Cloning a wolf from ancient DNA creates a new organism, but does it restart the *historical lineage*? Most biologists say no. The causal chain is broken. Therefore, under the *own* logic of the colleague (historical continuity), de-extinction is *not* revival. It's a new branch or a replica. The colleague's policy argument contradicts his own metaphysical premise here.

  6.  **Suggest Better Analogies (Task 5):**
      *   *River:* Heraclitean. Constant change of water (organisms), same channel (lineage). Good for continuity, bad for "parts" (water molecules aren't parts in the same way).
      *   *Archipelago:* Disconnected parts forming a whole. Addresses the causal integration issue.
      *   *Process:* A species as a process rather than a static individual.
      *   *Recommendation:* The "Lineage as a River" or "Species as a Process" works better for conservation because it emphasizes flow/continuity over static "individuality." It supports the bottleneck argument (flow continues) but undermines the de-extinction argument (source is dry).

  7.  **Drafting the Response (incorporating British English):**
