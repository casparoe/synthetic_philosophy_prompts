  **Brainstorming Assumptions:**
  Common priors (identical initial beliefs), common knowledge of rationality, rational expectations (prices reveal information), and crucially, no exogenous liquidity shocks or hedging motives. The theorem concerns *speculative* trade based on private information.

  **Audit:**

  1.  **"Economists have proved..."** *Standard Simplification.* This references the Milgrom-Stokey No-Trade Theorem. However, it omits the "common priors" assumption. If agents start with different beliefs, trade is rational. It also applies only to speculative trade, not risk-sharing.
  2.  **"Any trade you actually observe..."** *Flatly Wrong.* Most market volume is liquidity-driven (hedging, consumption smoothing, rebalancing). Agents trade to manage risk exposures, not just because of information asymmetry. Observing trade does not imply irrationality; it implies differing endowments or needs.
  3.  **"This is also why markets are called efficient..."** *Conflation.* Efficiency (Fama) means prices reflect information, not that trade ceases. Efficient markets often have *higher* volume because transaction costs and adverse selection are lower. A trader believing she has an edge is mistaken only if priors are common and information is fully revealed by price. In reality, edges exist via speed, unique data processing, or simply heterogeneous priors.
  4.  **Final Moral:** *Non Sequitur.* The conclusion that observed trading implies dysfunction survives only in a vacuum devoid of liquidity needs or heterogeneous priors. In reality, trade is the rational mechanism for allocating risk. Your character should know that "no-trade" is a theoretical benchmark for information, not a description of market volume. It explains why insider trading is hard, not why markets are empty.
