answer: |-
  This is one of the sharpest distinctions in moral and legal philosophy. You are right to separate them: **Valid Consent** is about the *procedure* of waiver (was it free, informed, competent?), while **Permissibility** is about the *scope* of authority (are there things no one can authorize, even themselves?).

  The cleanest case that forces you to appeal to a **duty to self**—while ruling out third-party harm and defects in consent—is the case of **Voluntary, Irrevocable Enslavement.**

  ### The Thought Experiment: The Private Island Contract

  Imagine two adults, Alice and Bob.
  *   **Competence:** Both are fully rational, mentally healthy, and understand the long-term implications.
  *   **Information:** Both know exactly what slavery entails (total loss of bodily autonomy, labor control, legal personhood).
  *   **Voluntariness:** There is no coercion, no desperation, and no deception. Alice is not poor; she is bored. She simply *wants* to serve Bob. Bob *wants* to own her.
  *   **Isolation:** They sign this contract on a private island. There are no spectators, no societal ripple effects, and no risk of this normalizing slavery for others. It dies with them.

  **The Question:** Can Alice validly consent to become Bob's slave?

  **The Legal/Moral Consensus:** No. Even if her consent is procedurally perfect, the contract is void *ab initio* (from the start). The act of enslaving her is impermissible, even with her signature.

  ### Why This Forces a "Duty to Self"

  Usually, when we ban things, we point to **harm to others** (millian harm principle). But you've stipulated that away.
  Usually, when we ban things, we point to **defects in consent** (paternalism: "She didn't *really* know what she was doing"). But you've stipulated that away too.

  So why is it impermissible? You are forced to argue that Alice has a **duty to herself** to remain free. Here is how that argument works, drawing largely from Kantian deontology:

  **1. The Performative Contradiction of Rights**
  Consent is a mechanism used by moral agents to authorize actions. It presupposes that the consenter is a *person* (an end in themselves) rather than a *thing* (a means to an end).
  *   If Alice consents to slavery, she is using her agency to destroy her agency.
  *   She is treating her own capacity for choice as a commodity that can be sold.
  *   Once the contract is executed, she is no longer a person who *can* consent; she is a thing that *is owned*.
  *   **The Duty:** You have a duty to preserve the conditions of possibility for morality. You cannot morally use your freedom to extinguish your freedom, because that undermines the very source of moral value.

  **2. Inalienable Rights**
  Some rights are not just protections *against* others; they are constitutive of *you*.
  *   If you have a right to liberty, it isn't just that others can't take it; it's that *you* can't give it away permanently.
  *   To allow Alice to sell herself into slavery is to say that human beings are the kind of things that can be owned. Even if Alice says "I am a thing," the moral law says "No, you are a person."
  *   **The Duty:** You owe it to your own humanity to not degrade it into thing-hood.

  ### Why This Isn't Just Paternalism

  You might object: *"Isn't this just hard paternalism? Stopping Alice because we know better than she does what's good for her?"*

  If the reason were paternalistic, the argument would be: "Slavery is bad *for* Alice; she will be unhappy; therefore we stop her."
  But the **Duty to Self** argument is different. It says: "Even if Alice would be happy, even if she prefers it, she *cannot* do this because it is conceptually incoherent with her status as a moral agent."

  It is not that the outcome is bad for her welfare; it is that the *act itself* is a violation of the moral order regarding persons. It treats a person as a commodity. The "wrong" isn't suffering; the wrong is the **ontological demotion** of a subject to an object.

  ### Other Examples that Fit (but are slightly messier)

  1.  **Consensual Homicide (The Duel):** Two people agree to fight to the death on a private island. Consent is valid. No third parties. Still murder.
      *   *Why:* Sanctity of life. You have a duty to preserve your existence as the vessel of agency. (Though some libertarians dispute this more than the slavery case).
  2.  **Selling a Vital Organ:** A healthy person sells their only kidney to a stranger.
      *   *Why:* Bodily integrity. You are a steward of your body, not an absolute owner. (Though this is often conflated with exploitation concerns).

  ### Summary

  The **Voluntary Enslavement** case is the "hard mode" version of your distinction.
  *   **Valid Consent?** Yes (Procedurally).
  *   **Permissible?** No (Substantively).
  *   **Reason:** A **duty to self** to maintain one's status as a moral agent. You cannot waive the right to have rights.

  This distinction is often summarized as: **Consent grants permission, but it does not grant authority.** Alice can give Bob permission to touch her, but she cannot give Bob the authority to cease recognizing her as a person. That authority was never hers to give.
