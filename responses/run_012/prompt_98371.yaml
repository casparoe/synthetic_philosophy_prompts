      *   Conclusion: What you actually have to swallow.

  9.  *(Self-Correction during drafting)*: Make sure to address the "Abolitionist" point in (9). That's a moral intuition pump. It shows that (1) fails in extreme cases, so it's likely flawed in normal cases too.

