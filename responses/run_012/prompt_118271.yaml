      *   **Rank 3 (Foundational): (9) vs. (5)/(7).** If claims underdetermine (9), why does EUT (7) or Contractualism (5) determine the outcome? This suggests the moral work is being done by Rationality/Contract, not Claims, rendering (1) and (9) decorative.

