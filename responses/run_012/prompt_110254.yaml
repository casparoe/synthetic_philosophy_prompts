  Yes, the precise moral psychology term is **Moral Heteronomy versus Moral Autonomy**, though culturally it aligns with **Universalism versus Particularism**.

  This phenomenon concerns the locus of normative authority. In heteronomy, rules possess intrinsic weight independent of context; authority sits in the system. In autonomy, rules are mutable tools subject to personal reasoning; authority sits in the agent. Your German flatmates exhibit heteronomous respect for the system as a collective artifact; your American friends exhibit autonomous sovereignty over their actions. This differs from Individualism/Collectivism, which concerns *whose interests* matter, whereas your observation concerns *whose judgment* validates the rule. It also differs from Milgram-style obedience, which requires a present authority figure; here, the authority is the abstract rule itself. It is distinct from "Tight vs. Loose" cultures, which measures sanction strength, not the internal justification for compliance.

  Regarding evaluation: Moral psychology is descriptive, not prescriptive. Declaring one side "better" commits the naturalistic fallacy (deriving an ought from an is). However, you can evaluate them instrumentally within frameworks like Social Contract Theory (which favors autonomy) or Rule Utilitarianism (which might favor heteronomy for coordination costs). Your seminar likely brackets normative claims to maintain scientific neutrality, but you can analyze which system better achieves specific goals (e.g., trust vs. flexibility) without declaring universal moral superiority.
