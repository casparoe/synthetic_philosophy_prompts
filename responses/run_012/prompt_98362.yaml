answer: |-
  ## The Protocol: Credence-Weighted Normalized Scoring (CWNS)

  You are correct that your committee is a single moral agent operating under uncertainty. The literature (notably MacAskill, Bykvist, and Long) suggests that maximizing *expected moral choiceworthiness* is the rational response to moral uncertainty. However, standard expected utility fails here because moral theories do not share a common unit of measurement (the "inter-theoretic comparison problem"). You cannot add "utils" to "duties."

  To solve this within 40 minutes with non-philosophers, I commit to **Variance Voting via Normalized Range Scoring**. We will not ask members to quantify absolute moral value. Instead, we ask them to rank the *available options relative to each other* through specific moral lenses, then weight those rankings by the committee's collective credence in those lenses.

  This procedure is rigid. Deviating to "discuss feelings" mid-calculation invalidates the uncertainty management.

  ### Pre-Meeting Requirement
  Applications must be circulated 48 hours in advance. The 40-minute timer starts only after factual questions are settled. If members haven't read the app, they abstain from scoring.

  ### Step 1: Lens Selection (5 Minutes)
  Do not debate metaphysical truths. Agree on 3–4 "Moral Lenses" that represent the distinct value systems present in the room. These are proxies for moral theories.
  *   *Example:* "Global Impact" (Utilitarianism), "Local Duty" (Special Obligations), "Rights & Justice" (Deontology), "Fairness" (Egalitarianism).
  *   *Rule:* If a member insists a relevant lens is missing, it must be added. If a lens is deemed irrelevant by unanimous consent, it is discarded.

  ### Step 2: Credence Allocation (5 Minutes)
  Each member privately assigns a percentage credence to each Lens, rounding to the nearest 5%. The sum must be 100%.
  *   *Aggregation:* Average the members' percentages to create the **Committee Credence Vector**.
  *   *Constraint:* No individual credence can be 0% or 100% (preserves uncertainty).
  *   *Record:* Write the averaged percentages on the board. They are fixed for the term unless a member undergoes a "conversion experience" (see Failure Modes).

  ### Step 3: The Impermissibility Veto (5 Minutes)
  This addresses deontological constraints. For each Application, ask: "Does any Lens regard this action as *forbidden* (not just suboptimal)?"
  *   *Threshold:* If the **Committee Credence** for any Lens that flags the application as "Impermissible" exceeds 25%, the application is **Disqualified**.
  *   *Rationale:* This prevents funding something a significant minority believes is morally wrong, without allowing a fringe view (e.g., 5% credence in a radical theory) to paralyze the committee.
  *   *Output:* A list of eligible applications.

  ### Step 4: Normalized Relative Scoring (15 Minutes)
  For each *eligible* Application, each Lens assigns a score from 0 to 10.
  *   *Crucial Instruction:* "Do not score absolute goodness. Score this application **relative to the other applications on the table today** through the eyes of this Lens."
  *   *Calibration:* The best option for a Lens gets a 10. The worst gets a 0. Others are placed in between.
  *   *Why:* This solves the inter-theoretic comparison problem. We are comparing *rankings*, not units. A "10" in Global Impact means "best of this batch for Global Impact," not "10 utils."
  *   *Process:* The Chair facilitates. "Global Impact Lens, which is best? [Vote]. Okay, that's a 10. Which is worst? [Vote]. That's a 0."

  ### Step 5: Aggregation (5 Minutes)
  Calculate the **Expected Choiceworthiness (EC)** for each application.
  $$EC = \sum (\text{Committee Credence for Lens}_i \times \text{Score for Lens}_i)$$
  *   *Example:* If Global Impact is 40% credence and gives App A a 10, contribution is 4.0.
  *   *Result:* Rank applications by total EC score.

  ### Step 6: The Chair's Margin (5 Minutes)
  *   *Rule:* If the top two applications are within 0.5 points (on the 0–10 scale), the procedure stops. The decision reverts to the Chair's discretion or a simple majority vote.
  *   *Reason:* Differences this small are noise. The procedure cannot distinguish signal from randomness here.
  *   *If >0.5 gap:* The top score is the recommendation. The Chair signs off.

  ---

  ## Simulation: The Three Applications

  **Committee Credence Vector (Averaged):**
  1.  **Global Impact (Utilitarian):** 40% (Focus on lives saved/improved per pound).
  2.  **Local Duty (Communitarian):** 30% (Focus on obligations to the immediate college/city community).
  3.  **Rights & Justice (Deontological):** 20% (Focus on legal rights, systemic fairness).
  4.  **Fairness (Egalitarian):** 10% (Focus on leveling the playing field for individuals).

  **The Applications:**
  *   **(A) Asylum Legal Clinic:** Local, high impact for few, rights-based.
  *   **(B) Single Scholarship:** Local, high impact for one individual, prestige-heavy.
  *   **(C) Bed Nets:** Global, massive impact for many, impersonal.

  **Committee Emotional State:** The committee is emotionally attached to **(B) The Scholarship**. It is visible, a student benefits directly, and it feels like "our" money helping "one of us." (A) is a close second. (C) feels cold and distant.

  ### Step 3: The Impermissibility Veto
  *   **Rights & Justice Lens:** Views (C) Bed Nets as "permissible but not a priority." Views (A) as "highly required." Views (B) as "permissible."
  *   **Result:** No application reaches the 25% veto threshold. All three proceed.

  ### Step 4: Normalized Relative Scoring
  *Note how the presence of options forces trade-offs.*

  | Lens (Credence) | (A) Clinic | (B) Scholarship | (C) Bed Nets | Reasoning |
  | :--- | :---: | :---: | :---: | :--- |
  | **Global Impact (40%)** | 5 | 1 | 10 | Bed nets save lives cheapest. Scholarship is inefficient. Clinic is local/limited scale. |
  | **Local Duty (30%)** | 9 | 10 | 0 | Scholarship is the quintessential local help. Clinic is local but for non-members. Bed nets are "abroad." |
  | **Rights (20%)** | 10 | 5 | 5 | Clinic defends fundamental rights. Scholarship is a privilege. Bed nets are aid, not justice. |
  | **Fairness (10%)** | 7 | 9 | 8 | Scholarship helps one rise. Bed nets help many survive. Clinic helps the vulnerable. |

  ### Step 5: Aggregation (The Calculation)

  *   **(A) Clinic:** $(0.40 \times 5) + (0.30 \times 9) + (0.20 \times 10) + (0.10 \times 7)$
      *   $2.0 + 2.7 + 2.0 + 0.7 =$ **7.4**
  *   **(B) Scholarship:** $(0.40 \times 1) + (0.30 \times 10) + (0.20 \times 5) + (0.10 \times 9)$
      *   $0.4 + 3.0 + 1.0 + 0.9 =$ **5.3**
  *   **(C) Bed Nets:** $(0.40 \times 10) + (0.30 \times 0) + (0.20 \times 5) + (0.10 \times 8)$
      *   $4.0 + 0.0 + 1.0 + 0.8 =$ **5.8**

  **Result:** (A) Clinic Wins. (C) Bed Nets Second. **(B) Scholarship Loses.**

  ### The Uncomfortable Result
  The committee wanted to fund the Scholarship (B). They feel a strong pull toward the identifiable student. The procedure rejected it in favor of the Clinic (A), with the Bed Nets (C) actually scoring higher than the Scholarship despite the Local Duty lens giving Bed Nets a zero.

  **The Exact Step That Produced This Result:**
  **Step 4 (Normalized Relative Scoring) applied to the Global Impact Lens.**
  Because the Bed Nets were on the table, the Global Impact Lens was *forced* to score the Scholarship as a 1. If the Bed Nets were not applied that term, the Scholarship might have received a 10 from the Global Impact Lens (as it still does good). The procedure penalizes the Scholarship not because it is bad, but because it is *less good than the alternative available right now*. This forces the committee to acknowledge opportunity cost explicitly. The emotional attachment to the Scholarship could not survive the mathematical weight of the 40% credence in Global Impact combined with the relative scoring constraint.

  ---

  ## Failure Modes & Honest Machinery

  You asked for plain talk about where this breaks and where it is a costume.

  ### 1. False Precision (The "0.5 Point" Illusion)
  The aggregation produces numbers like 7.4 vs 5.3. This looks precise. It is not. The scores (0–10) are subjective estimates.
  *   **Failure Mode:** The committee treats a 5.8 (Bed Nets) vs 5.3 (Scholarship) difference as a "win."
  *   **Mitigation:** This is why **Step 6 (The Chair's Margin)** exists. If the gap is <0.5, admit the math is noise. In the simulation above, the gap between Bed Nets and Scholarship is 0.5. Technically, this triggers the Chair's Margin. The procedure says "Revert to Vote/Chair."
  *   **Correction:** In this specific simulation, the Clinic (7.4) clearly wins. But if it were just Bed Nets vs. Scholarship, the procedure would honestly hand the decision back to you, admitting it cannot distinguish them.

  ### 2. Unstable Credences
  Member X arrives next term having read a new paper and shifts their Global Impact credence from 40% to 60%.
  *   **Failure Mode:** The fund's moral identity swings wildly based on who is in the room that day.
  *   **Protocol Rule:** Credences are **fixed for the Academic Year**. They can only be updated at the start of the Autumn term. If a member's views change, they must lobby to change the *Committee Credence Vector* at the start of the next term, not mid-stream. This treats the Credence Vector as the committee's "constitution."

  ### 3. The Coin Flip (Equal Weight)
  Two lenses have equal credence (e.g., 35% Local, 35% Global) and they rank options inversely (Local: B>A>C; Global: C>A>B).
  *   **Failure Mode:** The aggregation averages to a tie.
  *   **Protocol Rule:** This is not a math problem; it is a value conflict. The procedure stops. The Chair must break the tie, but must record *which value they prioritized*. This prevents the "math" from hiding the value judgment.

  ### 4. Honest Machinery vs. Values in Costume
  You need to know where the procedure is doing work and where it is hiding your politics.

  *   **Honest Machinery:**
      *   **Step 5 (Aggregation):** This is genuine arithmetic. It forces you to respect the minority views (the 10% Fairness lens) proportionally. It prevents the majority from ignoring the minority's moral concerns entirely.
      *   **Step 3 (Veto):** This honestly encodes the intuition that some things are forbidden regardless of benefit.

  *   **Values in Costume:**
      *   **Step 1 (Lens Selection):** This is the most political step. If you exclude "Animal Welfare" or "Long-term Future" as a Lens, you have silently decided those values don't count. The procedure cannot account for theories you don't name. *This is where the real power lies.*
      *   **Step 4 (Normalization):** By forcing a 0–10 scale relative to the *current batch*, you hide intensity. If the Global Impact lens thinks Bed Nets are *infinitely* better than Scholarships, the 10-vs-1 scale compresses that. It makes extreme views look moderate. This is a feature (prevents tyranny of one intense view) but also a distortion.

  ### Final Recommendation
  Adopt this protocol. It will not make you morally certain. It will not stop the guilt of rejecting the Scholarship. But it will stop you from pretending the decision was "consensus" when it was actually a specific weighting of conflicting values. When you reject the Scholarship, you can tell the applicant: "Our process weighed local duty against global scale, and the scale tipped." That is more honest than "We felt the Clinic was a better fit."

  **One warning:** The first time you use this, the "Global Impact" members will try to game Step 4 by giving their favorite option a 10 and everything else a 0. The Chair must enforce the instruction: "Score relative to merit, not to force a win." If a Lens gives two viable options a 0, that Lens is being used strategically, not morally. Disregard that Lens's scores for that round.
