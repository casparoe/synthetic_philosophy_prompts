      *   `what_avaktavya...`: *Avaktavya* claims that contradictory predicates (like existence and non-existence) apply to the same object simultaneously but in different respects, making them inexpressible in a single unqualified sentence. It does not claim reality is beyond language or knowledge, but that language must operate sequentially to capture complex unity without logical contradiction.
