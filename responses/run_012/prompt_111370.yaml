prompt: |-
  I'm writing a novel where a guy does a genuinely good thing for a genuinely bad reason — he bails out a neighbour's family after a fire, but only because his ex is standing right there and he wants her to watch him do it. If she hadn't been there he'd have kept walking. My editor says the deed then has no moral worth at all, and I half believe her, but I want to know what I'm arguing with.

  So compare me two views. The first is the standard one: an action has moral worth only if you do it for the right reasons — the reasons that actually make it the right thing to do, not some ulterior motive that just happens to point the same way. The second is one I've been chewing on, that moral worth is really about credit: whether the act is attributable to the agent at all, whether it came out of him and his own responsiveness to reasons, rather than whether the reasons he was responding to were the good ones. On that second view my guy comes out looking better, since the generosity did come from somewhere in him and not from pure calculation about his ex.

  Which of the two is right about moral worth, or are they answering different questions wearing the same word? Where exactly do they come apart — cases where one grants worth and the other witholds it — and where does my character land on each? And if you had to pick one to write by, which gives a novelist the truer handle on when a reader will forgive him?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Scenario:** A character performs a good deed (bailing out a neighbor after a fire) for a bad reason (to impress an ex-girlfriend who is watching). If the ex weren't there, he wouldn't have done it.
      *   **The Conflict:** The editor says this action has *no moral worth*. The user suspects there might be another view where it *does* have worth (or at least some credit).
      *   **The Task:** Compare two specific views on moral worth:
          1.  *Standard View:* Moral worth requires doing the right thing for the right reason (Kantian duty/rightness).
          2.  *User's "Credit" View:* Moral worth is about attributability/agency (the act came from *him*, his responsiveness, regardless of the specific motive).
      *   **Specific Questions to Answer:**
          *   Which view is "right," or are they asking different questions?
          *   Where do they come apart (divergent cases)?
          *   Where does the character land on each view?
          *   Which view is better for a novelist regarding reader forgiveness/engagement?

  2.  **Deconstruct View 1: The Standard View (Moral Worth = Right Reason)**
      *   *Philosophical Roots:* Immanuel Kant is the big name here. An action has moral worth only if done *from duty*, not merely *in accordance with duty*. Also Utilitarianism often looks at consequences, but regarding *praise/blame*, motive matters. Virtue Ethics also cares about the character state.
      *   *Application to Character:* He acted *in accordance* with duty (helping victims) but not *from* duty (compassion/obligation). He did it for vanity/lust/revenge.
      *   *Verdict:* Zero moral worth. Maybe even negative moral worth (manipulative).
      *   *Nuance:* The act is still *right* (consequentially), but the *agent* gets no credit.

  3.  **Deconstruct View 2: The "Credit/Attributability" View (Moral Worth = Agency/Expression)**
      *   *Philosophical Roots:* This sounds like "Attributability" in responsibility theory (Watson, Smith) or perhaps a strain of Virtue Ethics that focuses on identity constitution. It's also close to the idea of "praiseworthiness" vs. "rightness." Some consequentialists might argue that if the money is paid, the source matters less for the *outcome*, but the prompt asks about *moral worth of the agent*.
      *   *Refining the User's View:* The user suggests: "the generosity did come from somewhere in him and not from pure calculation about his ex." Wait, is that true? If he only did it *because* the ex was there, is it really "from him"? Or is it from his desire for her approval?
      *   *Correction/Challenge:* I need to be careful not to validate a potentially flawed premise. If the *only* reason is the ex, is it truly "his" generosity? Or is it instrumentalization? However, there is a philosophical angle: *Capacity for Good.* He *could* do it. He has the resources. He made the choice.
      *   *Better Framing:* This view is often called the "Areteic" or "Character" view, but specifically focused on *capacity* and *choice* rather than *motive purity*. Or, it's the distinction between the *rightness of the act* and the *goodness of the agent*.
      *   *Actually, a stronger philosophical counterpoint:* Bernard Williams or Susan Wolf. Or the distinction between *Moral Worth* (Kant) and *Moral Credit* (consequentialist/pragmatic). Let's frame it as "Moral Worth" (Kantian) vs. "Moral Credit/Social Utility" (Pragmatic/Consequentialist regarding character potential).
      *   *Wait, let's look closer at the user's specific definition:* "whether the act is attributable to the agent at all... rather than whether the reasons he was responding to were the good ones." This sounds like the distinction between *attributability* (is this *his* action?) and *accountability* (does he deserve praise/blame?).
      *   *Verdict:* On this view, he gets *some* credit because he exercised agency to produce a good outcome, even if the motive was flawed. It acknowledges the *potential* for goodness.

  4.  **Compare and Contrast:**
      *   *Divergence:* The "Shopkeeper" case (Kant). Honest shopkeeper charges fair price.
          *   Case A: Does it because it's right. (Worth on both views).
          *   Case B: Does it to maintain reputation. (Worth on View 2? No, View 1 says no).
          *   Case C: Does it because he likes the customer. (View 1 says no, View 2 might say yes).
      *   *The User's Character:* He is Case B (Reputation/Ex).
      *   *View 1:* No worth. He is a tool of his vanity.
      *   *View 2:* Some worth. He chose to spend his money to save a family. The money is saved regardless of why. The *capacity* for sacrifice is present.

  5.  **Address the "Novelist" Question (Reader Forgiveness):**
      *   Readers are not Kantians. Readers are psychological realists.
      *   Readers forgive flaws. They like complexity.
      *   Pure altruism is boring. Pure villainy is cartoonish.
      *   Mixed motives are *human*.
      *   *Key Insight:* The editor is right about *moral philosophy*, but wrong about *narrative empathy*. The reader doesn't need the character to be "good" to root for him; they need him to be *capable* of good.
      *   *Recommendation:* Use the tension. The act *is* good. The motive *is* selfish. The growth comes from realizing the motive later.

  6.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the depth of the question. It's a classic ethical dilemma (Kant vs. Consequences/Character).
      *   *Section 1: The Standard View (Kantian Duty).* Explain "In accordance with duty" vs. "From duty." Apply to character. Verdict: No moral worth.
      *   *Section 2: The Credit View (Attributability/Capacity).* Refine the philosophy. It's not just "it came from him," it's about "exercising the capacity for good." Apply to character. Verdict: Some credit for the *choice*, even if the *motive* is stained.
      *   *Section 3: Where they come apart.* Use the "Grateful Slave" or "Honest Shopkeeper" examples. Show the gap between *Right Act* and *Good Agent*.
      *   *Section 4: The Novelist's Choice.* This is crucial. Philosophy != Fiction.
          *   Readers care about *trajectory*, not static purity.
          *   Mixed motives create tension.
          *   The "Editor's Trap": Editing out ambiguity makes characters flat.
          *   Advice: Keep the bad motive. It makes the good deed more interesting. It sets up redemption.
      *   *Conclusion:* Summarize. The editor is philosophically correct but narratively dangerous.

  7.  **Refining the "Credit View":**
      *   I need to be careful not to misrepresent philosophy. The user's "Credit View" sounds a bit like *Attributability Responsibility* (Gary Watson). But in ethics, it's closer to *Consequentialist Praise* or *Virtue Ethics (focusing on the act as a habit-forming step)*.
      *   Actually, a better fit might be the distinction between **Moral Worth** (Kant) and **Moral Praiseworthiness** (which can sometimes accommodate mixed motives if the outcome is secured).
      *   *Wait, one nuance:* If he *only* did it for the ex, is it really "attributable" to his generosity? Or to his vanity? The user argues "the generosity did come from somewhere in him." I should challenge this gently. It might be *resources* from him, but the *impulse* was vanity. However, for the sake of the argument, I will accept the premise that he had to overcome *some* inertia to do it, which counts as agency.
      *   *Better philosophical label:* **The "Capacity" View** or **ARETAIC (Virtue) potential**. Even a vicious person performing a virtuous act strengthens the habit of virtue (Aristotle might disagree, but a novelist can argue this). Let's stick to the user's framing of "Attributability" but ground it in **Agency**.

  8.  **Final Polish:**
