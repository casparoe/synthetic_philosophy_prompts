  Actually, the "Credit" view sounds a lot like **Strawson's Reactive Attitudes** or **Wolf's Reason View**. Let's keep it accessible. Call it the "Agency View" vs the "Purity View."

  Let's structure the "Novelist" section carefully. The editor is warning against making the character *unlikable*. The user wants to know if the act counts. The answer is: The act counts for the *plot*, the motive counts for the *character arc*.

