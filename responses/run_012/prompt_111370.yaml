answer: |-
  This is a profound question that cuts to the heart of ethical theory, but it is also a practical problem of narrative psychology. Your editor is arguing from a specific philosophical tradition (largely Kantian), while you are intuiting a different one (closer to Virtue Ethics or theories of Agency).

  Here is the breakdown of the two views, where they diverge, where your character lands, and which one you should write by.

  ### 1. The Standard View: Moral Worth Requires "Right Reason"
  **Philosophical Root:** Immanuel Kant (Deontology).
  **The Core Idea:** An action has moral worth only if it is done *from duty*, not merely *in accordance with duty*.
  *   **In accordance with duty:** You do the right thing, but for a selfish reason (e.g., helping a neighbor to look good).
  *   **From duty:** You do the right thing *because* it is the right thing.

  **The Verdict on Your Character:**
  On this view, your editor is strictly correct. Your character's action has **zero moral worth**.
  Why? Because the "maxim" (the internal rule) guiding his action is not "help those in need," but "impress my ex." The fact that a family is saved is a happy accident of his vanity. If the ex had left five minutes earlier, the family would be destitute. His will was not aligned with the good; only his output was. In fact, a strict Kantian might argue this has *negative* worth, because he is treating the suffering neighbors as mere props in his theater of seduction.

  ### 2. The "Credit" View: Moral Worth as Attributability
  **Philosophical Root:** Theories of Agency / Virtue Ethics (Aristotelian potential).
  **The Core Idea:** Moral worth is about **capacity and choice**. Did this action flow from the agent's own resources and will? Did he overcome inertia to produce a good state of affairs?
  This view distinguishes between the *purity of the motive* and the *reality of the sacrifice*. Even if the spark was vanity, the fuel was his own money and his own agency.

  **The Verdict on Your Character:**
  On this view, your character earns **partial credit**.
  Why? Because generosity is not just a feeling; it is a behavior that requires resources and the overcoming of selfish retention. He *could* have kept walking. He chose to open his wallet.
  This view argues that we cannot see into the soul's purity, only into the will's movement. By choosing the good outcome, he exercises the "muscle" of generosity. Even if he started for the wrong reason, the act itself is attributable to him as a moral agent capable of affecting the world positively. He is not a robot; he is a flawed man making a costly choice.

  ### Where They Come Apart (The Divergence Cases)
  To see the difference, look at how they judge these scenarios:

  | Scenario | Standard View (Right Reason) | Credit View (Attributability) |
  | :--- | :--- | :--- |
  | **The Honest Shopkeeper**<br>Charges fair price to keep customers. | **No Worth.** He would cheat if he could get away with it. | **Some Credit.** He maintains a honest marketplace, restraining greed. |
  | **The Reluctant Hero**<br>Saves a child, but hates children and does it only for the reward money. | **No Worth.** Motive is greed/aversion. | **High Credit.** He overcame aversion to save a life. The cost to him was high. |
  | **The Natural Saint**<br>Helps everyone because it makes him feel happy (no sacrifice). | **High Worth.** (Kant debates this, but often says inclination helps duty). | **Low Credit.** It cost him nothing. It wasn't a "choice" against self-interest. |
  | **Your Character**<br>Bails out neighbor to impress ex. | **No Worth.** Instrumentalizes the victims. | **Moderate Credit.** Spent his own capital to solve a crisis. |

  **The Crucial Split:**
  The Standard View asks: **"Is the soul good?"**
  The Credit View asks: **"Did the agent do the work?"**

  ### Which is "Right"?
  Philosophically, neither is definitively "right"; they are measuring different things.
  *   The **Standard View** measures **Sanctity**. It cares about the moral quality of the *agent*.
  *   The **Credit View** measures **Impact and Agency**. It cares about the moral quality of the *choice* and the *outcome*.

  However, in the context of your novel, there is a third option: **The Narrative View.**

  ### The Novelist's Choice: How to Earn Reader Forgiveness
  If you are asking which view gives you the truer handle on when a reader will forgive him, **neither of the above is the one you should write by.**

  Readers are not Kantians, but they are also not accountants of moral credit. Readers operate on **Psychological Realism** and **Trajectory**.

  **1. Readers forgive mixed motives.**
  Pure altruism is boring. It reads as saintly or fake. A character who helps a neighbor *only* because it's the right thing is often less compelling than one who helps despite wanting to walk away. Your character's bad motive (the ex) makes the good deed *costly* to him. He is sacrificing his money *and* his integrity (by being performative). That tension is interesting.

  **2. Readers forgive based on "Capacity for Change."**
  The Editor's worry is likely that the character is irredeemable. If he does good *only* for vanity, is he a sociopath?
  *   **The Risk:** If he feels *no* pity for the burning family, only lust for the ex, he is a villain.
  *   **The Fix:** You need a crack in the armor. Perhaps halfway through writing the check, he looks at the crying family and feels a pang of actual shame that he's doing this for the wrong reason. Or perhaps, after the ex leaves, he stays to help carry boxes.

  **3. The "Forgiveness" Formula.**
  Readers will forgive the bad motive if:
  *   **The Cost is Real:** He actually loses something significant (money, safety, time).
  *   **The Outcome is Real:** The neighbors are actually saved.
  *   **The Self-Awareness is Present:** Eventually, he (or the narrative voice) must acknowledge the ugliness of his motive. If he thinks he's a hero, he's deluded. If he knows he's a fraud but did it anyway, he's complex.

  ### Recommendation for Your Draft
  Do not listen to your editor on the philosophy, but listen to her on the **risk**.

  If you write this scene such that the character feels *proud* of his generosity, the reader will hate him (Standard View violation).
  If you write this scene such that the character feels *ashamed* that he needed an audience to do the right thing, the reader will love him (Credit View validation).

  **Write the scene like this:**
  He sees the fire. He calculates: "If I walk, I save $50k. If I pay, she sees me as a provider." He pays. The ex is impressed. But as she hugs him, he looks at the scorched family who are thanking him as a savior, and he feels sick. He knows he is a fraud.

  **Why this works:**
  *   **Philosophically:** It acknowledges the Standard View (he knows his motive was impure).
  *   **Narratively:** It utilizes the Credit View (he did the hard thing anyway).
  *   **Emotionally:** It creates an arc. He started with a bad reason, but the *act* itself might change him. By doing the generous thing, even for a selfish reason, he may find he *becomes* the kind of man who does it for the right reason next time.

  **The Verdict:**
  Your editor is right that the act has no *moral purity*. But you are right that the act has *narrative worth*. Keep the bad reason. It makes the good deed human. Just make sure the character knows it was a bad reason. That self-knowledge is where the moral worth—and the reader's forgiveness—actually lives.
