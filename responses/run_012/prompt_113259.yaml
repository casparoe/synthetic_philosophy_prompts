answer: |-
  The testimonial regress shifts the epistemic burden from internal mental states to external social chains. Where the doxastic regress asks what supports a belief, this asks who vouches for the voucher. If every testifier requires prior validation from another, warrant dissipates across the network before it ever reaches you. This threatens to make knowledge impossible for finite agents reliant on expertise.

  **S-Tier: Deferential Foundationalism**
  Stops at persons or institutions entitled to trust without further reasons. This isn't mere dogmatism but a recognised stance akin to presumptivism: trust is a default normative stance, not an evidential conclusion. It mirrors how we navigate expertise without demanding impossible genealogies, effectively dissolving the regress by changing the rules of entitlement.

  **A-Tier: Coherentism**
  Warrant emerges from consistent cross-reporting within a web of beliefs. It handles social verification well, allowing mutual support among testifiers, but risks circularity if the entire network is compromised or insular.

  **B-Tier: Infinitism**
  Accepts the endless chain of vouchers as sufficient for justification. While descriptively accurate regarding historical testimony, it fails to secure completed justification, leaving the sceptic's worry about actual warrant permanently intact.

  **C-Tier: Classical Foundationalism**
  Demands non-testimonial bases for every claim. It collapses under the weight of modern knowledge, where almost everything is second-hand; requiring direct perception for all warrants is practically paralysing and theoretically implausible for social creatures.
