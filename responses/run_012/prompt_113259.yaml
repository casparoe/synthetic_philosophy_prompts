prompt: |-
  Hey — I'm putting together a session for my epistemology reading group and I want to get off the beaten track. Everyone can recite the three stock answers to the epistemic regress (foundationalism, coherentism, infinitism) and why each is supposed to handle the 'what justifies the justifier' worry. That's not what I'm after. I want the three of them ranked againt a regress I actually lose sleep over: the testimonial one. My belief that p is justified because A told me; A's trustworthiness is vouched for by B; B's by C; and so on, with no obvious place to plant a flag. So put on your social-epistemologist hat, think it through carefully, and gimme a tier list (S/A/B/C, whatever you like) of how well each position copes when the regress is testimonial rather than doxastic — a line or two each on why it lands where it does.

  Then add a fourth entrant to the list, one I've been toying with and calling 'deferential foundationalism': the regress stops not at a belief of your own that needs no support, but at a person or institution you're simply entitled to trust without owing further reasons. Slot it into the ranking too, and tell me honestly whether it's a real position or just me dressing up dogmatism.

  Keep the whole thing under 400 words, in British English. Don't bother with references or further reading — I only want your reasoning. Start by spending a few sentences framing the testimonial regress before you rank anything.
