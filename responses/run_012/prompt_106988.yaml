  Consider the thickened, calcified operculum of the intertidal snail *Littorina hypothetica*. This trait originally evolved in an ancestral lineage inhabiting high-energy surf zones, where the primary selective pressure was the risk of dislodgement; the operculum's specific wedge-shaped geometry was selected for because it allowed the snail to lock mechanically into the shell aperture, stabilising the organism against crashing waves and ensuring individuals remained attached to the substrate to reproduce. In the descendant species, which now occupies higher shore levels with moderate wave action but prolonged exposure to air during low tides, the operculum continues to provide stabilisation against occasional storms, but its tight mechanical fit also creates a hermetic seal that prevents lethal desiccation by retaining moisture within the shell. Both effects currently enhance fitness: the wedging prevents wash-out during storms, while the seal prevents drying out during daily emersion. The stabilisation effect is mediated by external hydrodynamic forces acting upon the snail's position, whereas the sealing effect is an immediate physical contribution to the organism's internal homeostatic capacity.

  (a) The verdict of each of the three accounts
  The etiological account verdicts that the function of the operculum is stabilisation against dislodgement. Its reasoning is strictly historical: stabilisation is the effect for which the trait's wedge-shaped geometry was originally selected, satisfying the criterion that a function must be a selected effect. The causal-role account verdicts that the function of the operculum is desiccation prevention. Its reasoning focuses on the current systemic contribution: the sealing effect is an immediate, direct contribution to the containing system's capacity for homeostasis, whereas stabilisation is a mediated, relational effect dependent on external wave forces, making the seal the more salient causal role within the system's internal capacities. The maintenance account verdicts that the function of the operculum is desiccation prevention. Its reasoning relies on current explanatory power: although the trait originated for stabilisation, the current persistence of the trait under selection is primarily explained by the fitness contribution of desiccation prevention, as this is the dominant mortality factor in the snail's current high-shore niche, satisfying the criterion that the function is the effect explaining current persistence.

  (b) Explicit statement of disagreement
  The etiological account disagrees with both the causal-role and maintenance accounts regarding which effect constitutes the function. The causal-role and maintenance accounts agree that the function is desiccation prevention, while the etiological account maintains it is stabilisation. This confirms that at least two of the three accounts disagree about *which* of the two live effects is the function, rather than merely disagreeing about whether the trait has a function at all, since all three agree the trait possesses a function.

  (c) Identification of the single feature
  The single feature doing the work is the distinction between the immediate internal contribution of the by-product (sealing/homeostasis) and the mediated external contribution of the selected effect (stabilisation/wave resistance). Removing this feature collapses the case into agreement. If both effects were equally immediate contributions to internal capacities (for example, if stabilisation were achieved by an internal gyroscope rather than external wedging), the causal-role theorist would have no grounds to privilege desiccation prevention over stabilisation based on systemic immediacy. In that scenario, the causal-role account would likely agree with the etiological account that stabilisation is a function (since it is a causal role), and potentially agree it is *the* function if no other criterion distinguishes them, thereby aligning the etiological and causal-role verdicts.

  (d) The minimal alteration
  The minimal alteration that would flip the disagreement is to reverse the selection history while keeping the current causal roles identical. If the operculum had originally been selected for creating a hermetic seal to prevent desiccation, and the stabilisation against waves was merely a beneficial by-product of that tight fit, the etiological account would verdict that desiccation prevention is the function. This would align the etiological account with the causal-role and maintenance accounts (assuming current selection still favours desiccation prevention), resulting in consensus across all three positions that desiccation prevention is the function.

  (e) Critique of each account
  A defender of the etiological account would attack the case by arguing that pre-theoretic intuition is unreliable here; they would insist that function is inherently a historical notion, and since the trait exists because of stabilisation, calling the seal a 'function' conflates function with mere beneficial effect. This attack succeeds only if one accepts that history trumps current systemic utility entirely, but it fails to accommodate the strong intuition that the trait's current primary utility (sealing) is what makes it functional *now*. A defender of the causal-role account would attack the etiological verdict by arguing that referencing history is unnecessary metaphysics; the system's capacity is what matters, and the seal is the more direct contribution. This attack succeeds in capturing the intuition but risks over-generating functions if any causal contribution counts. A defender of the maintenance account would argue that current selection pressure is the only relevant factor, dismissing the origin as irrelevant. The account left most exposed is the etiological account. It is most exposed because it is forced to deny that the desiccation-preventing seal is a function, despite the seal being the effect that currently sustains the trait's presence in the population and aligns with the intuitive understanding of what the trait is 'for' in its current environment. This forces the etiological theorist to bite the bullet that a trait's primary survival value can be functionally irrelevant if it was not the historical cause of the trait's origin.
