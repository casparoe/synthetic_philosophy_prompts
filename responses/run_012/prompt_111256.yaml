answer: |-
  **Exam Question**

  The problem of temporary intrinsics is often presented as a decisive victory for perdurantism over endurantism. Critically evaluate this claim. In your answer, address whether endurantist strategies (such as relationalism) successfully neutralize the argument, and whether perdurantism genuinely accounts for change or merely relocates the problem to static temporal parts. Finally, consider whether, once both views accommodate time-relative properties, the dispute remains substantive or dissolves into a verbal disagreement.

  ***

  **Model Answer**

  The problem of temporary intrinsics arises because an object seems to possess incompatible properties at different times. A poker is straight at t1 and bent at t2. If the object is wholly present at both times, it seems to possess contradictory properties, violating logic. Perdurantists argue this proves objects must have temporal parts. The part at t1 is straight, the part at t2 is bent. No contradiction arises because different entities bear the properties.

  However, claiming this favors perdurantism ignores robust endurantist replies. The endurantist can adopt relationalism. Properties are not monadic but relations to times. The poker is not simply bent; it is bent-at-t2. Since being bent-at-t2 is compatible with being straight-at-t1, no contradiction exists. The perdurantist objection assumes properties are simple, but if we reject that assumption, endurantism survives. Yet, this invites a counter-objection: does relationalism preserve change? If the object merely stands in different relations to times, has it genuinely changed, or is change reduced to a static network of relations? Some argue this evacuates the phenomenology of change, making the endurantist victory pyrrhic. If change requires the instantiation of incompatible monadic properties, relationalism denies change exists.

  Conversely, perdurantism faces the "relocation" objection. By analyzing change as qualitative variation across temporal parts, the four-dimensional worm itself never changes. The whole entity is static; only its constituents differ. While this solves the logical problem of intrinsics, it risks eliminating change entirely. If change requires a single subject to gain or lose properties, perdurantism fails. It offers a substitute for change rather than an analysis of it. Thus, the temporary intrinsics argument does not decisively favor perdurantism; it merely shifts the burden from logical contradiction to the metaphysics of change. The perdurantist solves the logic but may lose the phenomenon.

  This leads to the question of whether the dispute is substantive. If the endurantist relativizes properties (bent-at-t) and the perdurantist indexes properties to parts (bent simpliciter at part-t), both accounts predict the same empirical observations. They agree on when the poker is bent. The disagreement may be merely verbal, stemming from different quantifier meanings. The endurantist quantifies over enduring wholes; the perdurantist quantifies over stages. If both frameworks are internally consistent and empirically equivalent, the choice might be pragmatic rather than truth-apt. This suggests the temporary intrinsics argument is insufficient because both sides can accommodate the data through linguistic adjustment.

  However, there is a strong case for substantivity. The ontological commitments differ significantly. Perdurantism commits to the existence of temporal parts as concrete entities, whereas endurantism does not. This is not just a linguistic difference but a disagreement about what exists in the fundamental fabric of reality. Furthermore, the explanation of change differs. One views change as variation in a whole, the other as variation across parts. These are distinct metaphysical pictures with different implications for identity and causation. Therefore, while the temporary intrinsics argument alone does not settle the debate, the dispute remains substantive due to divergent ontological commitments. The relationalist move saves endurantism from contradiction, but not from the charge that it alters the nature of property instantiation.

  [Meta-Assessment]
  Confidence Level: High.
  Least Sure Point: I am least confident about the resolution of the verbal dispute. It is difficult to definitively prove whether quantifier variance eliminates ontological disagreement or merely masks it.

  ***

  **Marking Scheme**

  **A Grade (80-100%)**
  *   **Critical Engagement:** Does not simply recite Lewis's argument. Explicitly critiques the endurantist relationalist reply (does it kill change?) and the perdurantist solution (does the worm change?).
  *   **The "Relocation" Point:** Clearly articulates that perdurantism solves the logical problem by making the whole object static, questioning if this counts as "change."
  *   **Verbal Dispute:** Engages seriously with the possibility that the dispute is verbal (quantifier variance) but distinguishes this from ontological commitment.
  *   **Substantive Conclusion:** Argues that despite verbal overlaps, the ontology (existence of temporal parts) remains a substantive difference.
  *   **Meta-Cognition:** Includes the required confidence statement and uncertainty flag.

  **B Grade (60-79%)**
  *   **Standard Recital:** Correctly defines endurantism, perdurantism, and temporary intrinsics.
  *   **One-Sided Critique:** Mentions relationalism but accepts the perdurantist victory too easily, or vice versa.
  *   **Misses "Relocation":** Fails to note that the 4D worm itself does not change, only its parts do.
  *   **Superficial Verbal Dispute:** Mentions the verbal dispute but treats it as a definitive dissolution of the problem without considering ontological commitments.
  *   **Meta-Cognition:** Includes confidence statement but the uncertainty flag is vague or missing.

  **C Grade (50-59%)**
  *   **Definition Heavy:** Spends most of the word count defining terms rather than evaluating arguments.
  *   **Missing Key Moves:** Fails to address relationalism or the verbal dispute entirely.
  *   **No Meta-Cognition:** Missing the confidence/uncertainty statement.

  **Specific Omissions Costing Marks**
  *   **(-10 marks):** Failing to mention that the 4D worm itself is static (the "relocation" objection).
  *   **(-10 marks):** Failing to address whether the dispute is verbal or substantive in the final section.
  *   **(-5 marks):** Missing the Meta-Assessment (confidence/uncertainty).
  *   **(-5 marks):** Using citations (names/dates) instead of describing the moves.
