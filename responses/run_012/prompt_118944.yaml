answer: |-
  This is an exceptionally sharp distinction to draw, and your lecturer is quite right: much of the confusion in the literature (from economics to historical institutionalism) stems from eliding these two modal claims. In the philosophy of social sciences, this is fundamentally a disagreement about **causality**, **modality** (what is possible vs. necessary), and **normativity**.

  To make the discussion tractable, let us label the two readings you described:

  1.  **The Strong Reading (Inefficient Entrenchment):** Lock-in implies that the current outcome is *one of multiple possible equilibria*, but switching costs (increasing returns, network effects, adaptive expectations) make moving to a superior alternative infeasible. History matters because it selected a suboptimal path that is now sticky.
  2.  **The Weak Reading (Structural Convergence):** Lock-in implies that while the *timing* and *trajectory* were contingent, the destination was determined by structural constraints. The current outcome is the *only* stable equilibrium; alternative paths would have converged here eventually. History matters only for the pace of development, not the direction.

  Here are the implications of keeping these apart across the three domains you identified.

  ### 1. The Inference from Survival to Efficiency
  This is the classic debate between **functionalism** and **historical explanation**.

  *   **Under the Strong Reading:** The survival of an arrangement tells us nothing about its efficiency. In fact, the claim of lock-in is specifically invoked to explain why *inefficient* arrangements survive (e.g., the QWERTY keyboard, the VHS format). If you accept this reading, you must reject the "adaptationist" fallacy—the idea that because an institution or technology persists, it must be serving a function or maximizing utility. Survival is explained by *power* and *momentum*, not fitness.
  *   **Under the Weak Reading:** The survival of an arrangement is strong evidence of its efficiency (or at least its structural necessity). If all roads lead to Rome, then Rome must be the only place where a city can be sustained. This reading vindicates a form of functionalism or rational choice theory: the outcome survived because it is the optimal solution to the underlying coordination problem.
  *   **Philosophical Implication:** Confusing these leads to category errors in explanation. If you argue against a policy using the Strong Reading (e.g., "We are stuck with this bad pension system due to legacy costs"), but your opponent counters with the Weak Reading (e.g., "This pension system exists because it is the only fiscally viable model"), you are talking past one another. One is making a claim about **switching costs**; the other is making a claim about **viability constraints**.

  ### 2. Convergence: Different Starts, Same Destination
  This concerns the **ergodicity** of social systems. Does the system "forget" its initial conditions, or does it remember them forever?

  *   **Under the Strong Reading:** Convergence is anomalous. If lock-in is robust, societies starting from different positions should remain different (divergence). If two societies converge, it suggests the "lock-in" was not actually strong, or that an external shock was powerful enough to break the path. In the "Varieties of Capitalism" debate, the Strong Reading supports the idea that distinct national institutional profiles will persist indefinitely.
  *   **Under the Weak Reading:** Convergence is expected. This reading aligns with modernization theory or certain Marxist teleologies. It suggests that underlying structural forces (technology, global markets, human rationality) act as a "global attractor." The contingency of the origin is washed out by the necessity of the destination.
  *   **Philosophical Implication:** This changes how we interpret comparative case studies.
      *   If you hold the **Strong Reading**, finding two countries with the same institution requires you to look for a common *historical shock* or a mechanism of *diffusion* (one copied the other).
      *   If you hold the **Weak Reading**, finding two countries with the same institution is evidence of *structural determinism*.
      *   **The Danger:** If you run them together, you might observe convergence and mistakenly claim that history doesn't matter (Weak), when in fact history mattered immensely but happened to produce the same result twice by accident. Or, you might observe divergence and claim structural forces are weak (Strong), when in fact the system is just moving slowly toward convergence (Weak).

  ### 3. Practical Judgment: Is Escape Worth Attempting?
  This is the **normative** and **pragmatic** implication. It determines whether policy intervention is viewed as remediation or folly.

  *   **Under the Strong Reading:** Escape is difficult but potentially welfare-enhancing. Since the current state may be suboptimal, there is a justification for "critical junctures" or state intervention to subsidize switching costs. The lock-in is a market failure or a political failure. The practical judgment is: *Can we mobilize enough resources to overcome the increasing returns of the status quo?*
  *   **Under the Weak Reading:** Escape is futile or dangerous. If the current outcome is the only stable destination, attempting to escape it will result in instability, collapse, or a eventual return to the same point after wasting resources. The lock-in is a feature of reality, not a bug. The practical judgment is: *How do we manage the transition to this inevitable outcome as smoothly as possible?*
  *   **Philosophical Implication:** This distinction dictates the **burden of proof** for reformers.
      *   For the **Strong Reading**, the reformer must prove that an alternative is *feasible* and *superior*, and that the switching costs can be overcome.
      *   For the **Weak Reading**, the reformer must prove that the "inevitable" destination is actually contingent (i.e., they must disprove the Weak Reading).
      *   **The Danger:** If a government believes it is facing a Strong Lock-in (a bad policy we can fix) but is actually facing a Weak Lock-in (a structural constraint), they may waste vast political capital trying to change the unchangeable. Conversely, if they face a Strong Lock-in but believe it is Weak, they may resign themselves to a suboptimal fate unnecessarily (a form of political fatalism).

  ### Summary for your Seminar
  To synthesize this for your discussion, you might frame the disagreement as one about **modal strength**:

  1.  **The Strong Reading** claims that the current outcome is **contingent but stable**. (It could have been otherwise, and it could still be otherwise, but it is hard to change).
  2.  **The Weak Reading** claims that the current outcome is **contingent in process but necessary in result**. (It could have happened differently, but it couldn't have ended differently).

  Your lecturer's point is that when we argue about whether the QWERTY keyboard is "locked in," or whether liberal democracy is the "end of history," we often fail to specify whether we mean "we are stuck with this though better options exist" (Strong) or "this is the only thing that works" (Weak). Keeping them apart clarifies whether we are debating **history** (how we got here), **structure** (what is possible), or **power** (who benefits from the switch costs).

  If you can articulate that the "heat" comes from one side arguing about *switching costs* while the other argues about *structural viability*, you will have captured the core philosophical stakes.
