answer: |-
  Good morning. Welcome to the institute. For those of you I haven't met yet, I'm the one responsible for waking you up before the coffee kicks in. I see we have the usual ecosystem here. In the back, the grad students calculating the caffeine-to-sleep-deprivation ratio. In the middle, the physicists looking for excuses to tell us why our definitions are sloppy. In the front, the people who actually write the papers we're going to spend two days debating. And in the very front row, the director, who is watching me closely to ensure I don't slip into any metaphysical habits he finds objectionable. So, let me be clear from the start: nothing I say today depends on the idea that mathematics is waiting for us in some cosmic warehouse. We are making this stuff up, together, as we go.

  We are gathered to talk about applicability. Usually, when people introduce this topic, they reach for the famous complaint about how surprising it is that math works at all. The idea is that we invent these abstract games with rules in our heads, and then we walk outside and find the universe playing by the same rules. It feels like magic. It feels like we should be paying rent for using tools we didn't build for the job.

  But I want to suggest that this surprise is mostly a trick of the light. It is a selection bias. We produce mathematics at an industrial scale. We generate towers of logic, structures of symmetry, and algebras of every conceivable shape. Most of it goes nowhere. It sits on the shelf. But the bits that do find a home in physics get highlighted, celebrated, and written into textbooks. The thousands of pages of formalism that never modeled a single particle are quietly forgotten. If you throw enough darts at a board, you will eventually hit the bullseye. It would be a miracle if none of it fit. So, when we see a match between a formalism and a physical system, we shouldn't necessarily fall to our knees. We should check the outtakes reel.

  However, dismissing the whole thing as selection bias leaves a specific itch unscratched. There is a narrower, stranger phenomenon that my colleague calls the pre-adapted cases. This is not about throwing darts until one sticks. This is about developing a mathematical structure for purely internal reasons—often for aesthetic beauty or logical completeness—with absolutely no intention of describing the physical world, only to find decades later that the physical world was waiting for that exact structure.

  The classic example, which I know many of you have in your bones, is Riemann. He worked out the geometry of curved spaces in the mid-nineteenth century. He was not trying to fix Newtonian gravity. He was not trying to describe the universe. He was extending Gauss's work on surfaces because the internal logic of geometry demanded it. It was pure mathematics. Decades later, Einstein needed a language to describe gravity not as a force, but as curvature. He didn't have to invent the language. It was already there, fully formed, waiting to be picked up. It fits too well to be just a dart throw.

  Here is another one, just to show it isn't a fluke. Consider group theory. In the early nineteenth century, Galois and others developed the theory of groups to solve problems about polynomial equations. It was about algebraic solvability. It was about roots and coefficients. It had nothing to do with matter or energy. Yet, when twentieth-century physics started digging into the standard model, it turned out that the fundamental particles are best understood as representations of symmetry groups. The structure of the subatomic world is written in the language of Galois's algebra. Again, the math was developed for its own sake, yet it turned out to be the exact skeleton key for the physical lock.

  Now, we have to decide what this means. We have two choices. We can say this is genuinely unreasonable, a miracle of pre-harmonized structure between mind and world. Or we can tell a deflationary story that eats these cases too. I am choosing the deflationary story, and I want to say it plainly.

  The miracle disappears if we stop treating mathematics as a separate kingdom from the physical world. We are physical beings. Our brains evolved to track objects, movements, and patterns in this universe. When we do mathematics, even the most abstract kind, we are using cognitive tools forged by interaction with reality. We abstract patterns from the world, even when we think we are just playing with symbols. Furthermore, we retrofit the history. We tell the story of Riemann as if he were working in a vacuum, but he was working on concepts of space and magnitude that are already laden with physical intuition. We say group theory was pure algebra, but symmetry is a physical phenomenon before it is a mathematical one.

  The math isn't pre-adapted. We are just reluctant to admit that our purest thoughts are still rooted in the mud of experience. We create mathematics by stripping away the noise of the world to find the signal. It should not be shocking that when we return to the world, the signal is still there. The fit isn't magic; it's archaeology. We are digging up tools we made from the world's own clay and acting surprised that they fit the world's hands.

  I know this stance has costs. It denies the romantic idea of mathematics as a transcendent truth independent of human activity. It suggests that what we call "purity" is often just forgotten context.

  I need to flag one thing before I stop. Historians in this room might fight my reading of Riemann's intent; claiming he had no physical intuition about space is a simplification I am making for the sake of the argument, and some archival work suggests he was more motivated by physical questions than the legend admits.

  I would rather be wrong about the history than mushy about the philosophy. We are here to work, not to worship. Let's get to it.

  Thesis: The apparent miracle of pre-adapted mathematics dissolves when we recognize that even our most abstract structures are cognitive tools abstracted from physical experience.
