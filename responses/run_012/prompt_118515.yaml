answer: |-
  1

  You bring me figures showing gain ahead,
  A rise in quarters coming on the sheet.
  The bottom line expands as you have said,
  And so the motion stands to be approved.
  The water turns past the dark stony bank,
  And scum will float upon the surface film.
  But what the water does is not my trade,
  I did not come to weigh the stream or stone.
  Let others count the cost that nature paid,
  I do not care about the river either way.
  So sign the paper, let the work begin,
  The shareholders expect returns this year.
  We measure success by the profit line,
  And leave the rest to those who live nearby.

  2

