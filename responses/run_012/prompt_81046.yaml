      *   *Structure:* Follow the user's prompt structure (Correspondences -> Breakdowns -> Imports -> Payoff -> Concessions).
      *   *Key Insight:* The "trains" comment by Tomas is the weak point in his own armor. If the trains *could* be stopped, the dominoes weren't inevitable.
      *   *Refining the "Nation as Agent" point:* Tomas is philosophically tricky here. "Only people act" is true, but people act *as* states. The analogy hides the specific people (Bethmann-Hollweg, Berchtold) who pushed the dominoes closer together.

  10. **Final Review against constraints:**
      *   Did I audit the analogy? Yes.
      *   Did I avoid a simple verdict on 1914? Yes, focused on the logic of the argument.
      *   Did I flag what to concede? Yes.
