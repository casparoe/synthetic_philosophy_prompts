  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in specific historical dates. Keep it focused on the *logic of the domino metaphor*. Also, clarify the "trains" contradiction in Tomas's argument—that's a key leverage point for the user.

  11. **Final Polish:** Ensure the distinction between *structural causation* (Tomas's strength) and *moral agency* (Tomas's weakness) is clear.

