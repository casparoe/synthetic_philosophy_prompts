      *   *The Counter:* To say "Model X is self-defeating because I am not a BB" assumes I know I'm not a BB. But Model X says I probably am. You can't use your existence as an OO to rule out Model X if Model X is what determines the probability of you being an OO. It's circular.
      *   *The Measure Problem:* The ratio depends on how you count infinities (the measure). Changing the cutoff changes the result. There's no physical justification for the cutoff, it's just a rule to make the math work.
