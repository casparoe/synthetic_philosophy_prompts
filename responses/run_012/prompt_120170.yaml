answer: |-
  The wind outside the dome didn't howl; it scoured. It was a physical weight against the reinforced glass, a constant reminder that the air out there was too thin to hold heat, too thin to hold much of anything. Inside, the server racks hummed, a warm, organic drone that felt like the only heartbeat in the Andes.

  Aris rubbed her eyes. The digital clock in the corner of the main monitor read 03:14. She had been babysitting the Monte Carlo run for fourteen days, and for fourteen days she had slept in shifts, waking to the smell of ozone and recycled air. Her job was simple, theoretically. She fed the universe into the machine, and the machine spat out a census.

  Not a census of stars or galaxies. A census of observers.

  The departmental guideline was printed on a laminated sheet taped to the console, yellowed by the same UV light that was slowly fading the ink. *Rule 44-B: If the predicted fraction of fluctuation-origin observers exceeds 50% of the total observer-moment count, the model is deemed cognitively unstable and unfit for publication.*

  It was a sanity clause. A way of saying: if your math says most people who think they exist are actually just random atoms assembling briefly in the void with false memories of a past, then your math is broken. Because if that were true, you wouldn't be able to trust the math.

  The progress bar hit 100%. The screen flickered. A single value populated the field labeled *η* (Eta).

  0.998.

  Aris stared at it. Ninety-nine point eight percent. According to Model K-7, almost every conscious experience in the history of this universe was a freak accident, a thermal fluctuation popping into existence for a second before dissolving back into the heat death. Only two in a thousand were like her: beings with a causal history, evolved eyes, recorded data, a continuous timeline.

  By Rule 44-B, she should flag the model as rejected. She should write "Cognitive Instability" in the log, wipe the cache, and go to sleep.

  But her hand hovered over the keyboard. If she rejected the model because it said she was likely a fluctuation, she was assuming she wasn't a fluctuation. But the model said she probably was. If she was a fluctuation, her reasoning was just noise. If her reasoning was noise, she couldn't use it to reject the model.

  The screen seemed to pulse. The hum of the servers grew louder, or perhaps the silence of the room grew heavier. She needed a voice that wasn't the machine's. She initiated the secure link to Cambridge.

  The connection lagged. The video feed of Julian Vane froze in a grid of pixels, then resolved. He looked older than the last time she'd seen him, his hair a white shock against the dark bookshelves behind him. He was retired, officially, but everyone still called him when the numbers stopped making sense.

  "It's high," Julian said. His voice arrived a half-second after his lips moved. He wasn't looking at the camera; he was looking at a second monitor off-screen. He'd already seen the data packet.

  "It's above the line," Aris said. Her voice sounded thin in the cold room. "Ninety-nine point eight. It's effectively all noise."

  "Then reject it," Julian said. "Tick the box. Move to K-8."

  "I can't."

  "Why not? It violates the guideline. It makes us atypical. It undermines the observer."

  "That's the problem," Aris said. She leaned forward, her breath fogging slightly in the chill. "If I reject it because it makes us atypical, I'm using my typicality as evidence. But the model says my typicality is an illusion. I'm using the very thing the model calls into question to judge the model. It's circular."

  Julian sighed, the audio crackling with static. "It's not circular, Aris. It's pragmatic. We require our models to be holdable. A model that cannot be believed by the people using it is not a model. It's a paradox."

  "But why am I allowed to hold it?" Aris pressed. "Suppose K-7 is true. Suppose I am a brain that just formed out of the vacuum with memories of this observatory, memories of you, memories of the wind. If that's true, then my decision to reject K-7 is just a random firing of neurons. It has no logical weight. So why does the department get to say my random firing validates the rejection?"

  Julian leaned back. The chair creaked. "You're asking for a foundation where there isn't one. You want to stand outside the system to judge it. You can't. You're inside."

  "So we publish it?"

  "We publish the calculation. We note the ratio."

  "Rule 44-B says no."

  "Rule 44-B is a heuristic," Julian snapped. "It's a rule of thumb invented by people who wanted tenure without existential dread. It assumes that because you feel real, you are real, and that any model contradicting that feeling is wrong. But feelings are exactly what fluctuations produce. A fluctuation observer feels just as real as you do. Probably more so, because they don't have the baggage of a long, entropic past."

  Aris looked at her hands. They looked solid. She could feel the cold plastic of the keyboard under her fingertips. "If I accept that, then nothing matters. If I'm likely a fluctuation, then this conversation is likely a fluctuation. Your advice is noise."

  "Exactly," Julian said. "And yet, here we are. Discussing it. The fact that we can discuss it suggests the model might be wrong. But you can't use the discussion to prove the model is wrong without assuming the discussion is real. Which is what the model denies."

  "So how do we break the loop?"

  "We don't," Julian said. "We change the measure."

  Aris frowned. "The cutoff?"

  "The measure defines how we count the infinities," Julian said. "K-7 uses a proper-time cutoff. It counts observers along a specific clock. If you change the clock, if you change the hypersurface where you stop counting, the ratio changes. You can make the fluctuations rare again. You just have to choose a different way of slicing the universe."

  "So we just pick the slice that makes us real?"

  "We pick the slice that makes the math converge," Julian corrected, though his eyes didn't meet the camera. "There are dozens of measures. Some say fluctuations dominate. Some say ordinary observers dominate. There is no physical reason to prefer one measure over another. No experiment can tell us which clock is the 'true' clock of the universe. We pick the one that doesn't make us insane."

  "That's not science," Aris said. "That's wishful thinking. That's tuning the instrument until it plays the note you want to hear."

  "It's survival," Julian said. "Look, Aris. You're stuck on the idea that there is a truth out there independent of how we count. But in cosmology, the counting *is* the physics. If you count this way, you get heat death. You count that way, you get eternal inflation. The number isn't a discovery. It's a definition."

  He paused, the video freezing again for a moment before snapping back.

  "Think about the threshold," Julian continued. "Why fifty percent? Why not ten? Why not ninety? If the ratio was 0.6, would you reject it? You'd hesitate. If it was 0.51, you'd argue. The line is arbitrary. It's a bureaucratic fence built around an abyss. You're staring at the fence and asking me why it's made of wood instead of steel. It doesn't matter. It's just there to keep you from walking off."

  "But if the fence is arbitrary," Aris said, "then what keeps us from walking off is arbitrary. My sanity depends on a number someone picked because it felt comfortable."

  "Your sanity depends on a lot of numbers," Julian said softly. "The mass of the electron. The cosmological constant. We don't know why they are what they are. We just know that if they were different, we wouldn't be here to measure them. This is the same. If the measure were different, we wouldn't be here to argue about it. Or rather, the 'we' arguing would be different."

  Aris looked back at the screen. The value *0.998* glowed green. It was stable. The calculation was robust. Within the framework of the proper-time measure, it was undeniably true.

  "If I change the measure," Aris said, "I change the result. I can make *η* drop to 0.002. I can make us ordinary again. I just have to switch to a scale-factor cutoff."

  "You can," Julian agreed. "And then you'll have a different problem. Some measures predict we should be born in the earliest possible epoch. We aren't. So that measure is wrong. Some predict we should be alone. We aren't. Every measure has a bullet. You just have to pick the one that shoots you in the foot instead of the head."

  "So I just pick the one that lets me sleep?"

  "You pick the one that lets you work," Julian said. "Science isn't about finding the absolute truth, Aris. It's about finding a story that doesn't contradict itself before you finish the sentence. K-7 contradicts itself. It says 'I am true' and 'You cannot know I am true' in the same breath. So you shelve it. Not because it's false. But because it's unusable."

  "And the reason it's unusable is because of Rule 44-B."

  "Which is arbitrary."

  "Which is arbitrary," Julian confirmed. "But so is the measure you'd use to fix it. You're trading one arbitrary number for another. The only difference is one lets you go home for lunch."

  The connection began to degrade. The audio turned to digital mush. Julian's face fragmented into blocks of color.

  "Julian?"

  "—choice isn't about truth—it's about utility—choose the measure that—"

  The screen went black. The link died.

  Aris sat in the silence. The wind scouring the dome sounded like static now, like the white noise of a universe waiting to fluctuate. She looked at her hands again. They were still there. The keyboard was still cold.

  She opened the command line. She could type in the new measure parameter. She could switch from proper-time to scale-factor. She knew what would happen. The simulation would rerun. The number would drop. The fraction of fluctuation observers would plummet. She would be ordinary again. The model would be publishable. The department would be happy.

  But she knew why the number would drop. It wouldn't drop because the universe was different. It would drop because she changed the ruler. She was adjusting the weights on the scale because the outcome was too heavy to lift.

  And yet, if she didn't adjust them, the scale said she didn't exist. Not really. It said she was a momentary glitch, a spark in the dark with no past and no future, holding a memory of a wind that wasn't blowing.

  She typed the command to change the measure. Her fingers hovered over the *Enter* key.

  If she pressed it, she was validating the arbitrary rule that said she mattered. If she didn't, she was validating the calculation that said she didn't. Both choices relied on a premise she couldn't prove: that her choice mattered.

  The cursor blinked. It was a small, rhythmic pulse. *Here. Here. Here.*

  Outside, the wind shifted. A gust hit the dome, a deep thrum that vibrated through the floor and up through the legs of her chair. For a second, the sensation was so vivid, so physically undeniable, that the number on the screen looked like the fiction.

  But she knew the physics. She knew the statistics. She knew that vividness was exactly what a fluctuation would feel like. The intensity of the cold, the clarity of the screen, the anxiety in her chest—it was all consistent with a random assembly of particles configured to feel anxiety.

  She looked at the value *0.998*. It was honest. It was the output of the machine without interference.

  She looked at the input field for the measure cutoff. It was empty, waiting for her to define the rules of reality.

  Aris didn't press *Enter*. She didn't delete the file either. She sat there, watching the cursor blink, suspended between the number that erased her and the number that saved her, knowing that the only thing separating existence from noise was a parameter she could change with a keystroke, and no reason in the world to prefer one over the other except that one allowed her to keep typing.

  The server hummed. The wind scoured. The cursor waited.
