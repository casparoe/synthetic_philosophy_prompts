  **The Unified Extraction Protocol**

  Omega corners me by the keg at the department party. He slides a single invoice across the table.

  "Charge me for what?" I ask.

  "Counterfactual Mugging," Omega says. "Coin landed heads."

  "But your terms say you only mug if I paid the Blackmailer in the tails branch."

  "Exactly. And since I'm presenting this bill, I'm mugging. So you must have paid."

  "But the coin was heads! The tails branch doesn't exist!"

  "Your decision algorithm exists in both," Omega says. "In the tails world, I'm the Blackmailer. I only exist if the coin is tails. But I only get paid if you're the type who pays. Since you're the type who pays, I exist in tails, get paid, and that triggers me to mug you in heads."

  "So you're mugging me because you got paid in a world that doesn't exist?"

  "I'm mugging you because you're the kind of person who makes that world consistent," Omega says. "Now, pay up. Or I'll tell the department you're the type who doesn't. And trust me, that story leaks across branches too."

  ***

  **Caption/Explanation:**
  This joke satirizes the "Cross-Branch Coordination" variant where a single agent operates as a Mugger in the Heads world and a Blackmailer in the Tails world. The humor turns on the circular dependency: the Mugger's presence in the actual world (Heads) is conditional on payment in the counterfactual world (Tails), but the agent uses his actual presence as *proof* that the counterfactual payment occurred (via the consistency of the agent's decision type). It highlights the absurdity of being billed for a transaction that only "happened" because the bill itself was delivered, threatening reputational damage not for what you did, but for what your decision algorithm implies you *would* have done in a nonexistent branch.
