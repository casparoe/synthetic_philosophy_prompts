answer: |-
  # Teaching Plan: Quining Qualia for Fiction Writers

  ## 1. Preparation and Stance
  **Goal:** To demonstrate that the philosophical concept of "qualia" (as a specific kind of private, ineffable, intrinsic property of experience) is incoherent, without denying the reality of human experience or the validity of writing about it.
  **Tone:** Collaborative investigation. You are not debunking their craft; you are debunking a specific theoretical model of how the mind works that often limits craft.
  **Time:** 120 Minutes.

  ## 2. The Sequence

  ### Part I: The Trap (0:00 – 0:30)
  **Objective:** Define qualia not as "experience" but as a specific *claim* about experience.
  **Dependency:** None. This is the foundation.

  *   **The Hook:** Ask the room: "When you write a character tasting a strawberry, what are you trying to capture? Is it the chemical reaction, or the *what-it-is-like*?" (They will say the latter).
  *   **The Definition:** Do not give a dictionary definition. Give them the "Philosopher's Contract." Explain that when philosophers talk about **Qualia**, they aren't just talking about "feelings." They are talking about feelings that possess four specific superpowers.
  *   **The Single Characterization:** Focus on **Direct Apprehension (Incorrigibility)**.
      *   *Why:* This is the keystone. Qualia are supposed to be things you cannot be wrong about. If you feel pain, you *have* pain. You cannot be mistaken about the raw feel.
      *   *The Others:* Mention **Ineffability** (can't describe it), **Privacy** (only you know it), and **Intrinsicality** (it is what it is, unrelated to other things) as *consequences* of Direct Apprehension. If you have direct, unmediated access, naturally it's private and hard to share. But if Direct Apprehension fails, the rest collapse.
      *   *The Trap:* Ask: "If Direct Apprehension is true, your character is the ultimate authority on their own inner state. No one can tell them they are wrong about how it feels." Get them to nod. This validates their intuition before you challenge it.

  ### Part II: The Turn (0:30 – 0:50)
  **Objective:** Make the incoherence charge intelligible.
  **Dependency:** Requires acceptance of the "Direct Apprehension" definition from Part I.

  *   **The Move:** Shift from "What is it?" to "How do we know?"
  *   **The Argument:** If qualia are directly apprehended, our judgment about them should match the property perfectly. But our judgments are subject to memory, attention, and context.
  *   **The Gap:** If there is a gap between the *property* (the qualia) and the *judgment* (what we say/think about it), then we don't have Direct Apprehension. If we *don't* have a gap, then the qualia adds nothing to the judgment.
  *   **Key Phrase:** "Qualia are supposed to be the *cause* of our reports, but we only ever see the *reports*."

  ### Part III: The Carrying Example (0:50 – 1:20)
  **Objective:** Use Chase and Sanborn to break the link between Direct Apprehension and Reality.
  **Dependency:** Requires the "Gap" established in Part II.

  *   **The Case:** Present Dennett's coffee tasters.
      *   **Chase:** Says coffee tastes the same. (Reality: His palate has dulled, but he compensates unconsciously).
      *   **Sanborn:** Says coffee tastes the same. (Reality: His palate is fine, but his preferences have changed, so he doesn't notice the difference).
  *   **Must Have:**
      *   **Indistinguishability:** Emphasize that from the *inside*, Chase and Sanborn are identical. They both sincerely say, "It tastes the same as always."
      *   **The External Fact:** There *is* a physical difference (one's sensors changed, one's preferences changed).
  *   **Must Lack:**
      *   **Resolution:** Do not solve who is who.
      *   **Memory Focus:** Do not let the discussion drift into "memory is fallible." This is not about remembering last week's coffee. It is about the *present experience*.
      *   **Language Focus:** Do not let them say "It's just a language problem." It is about whether there is a *fact of the matter* inside the head.
  *   **The Kill:** Ask: "If Qualia (Direct Apprehension) existed, Chase and Sanborn should be able to tell the difference. They can't. Therefore, there is no 'inner property' they are accessing. There is only the disposition to judge."
  *   **The Ruin:** If you allow the audience to conclude "Well, they are just bad reporters," you lose. You must press: "If they are bad reporters about their *own immediate experience*, then 'immediate experience' (Qualia) is not doing the work we thought it was."

  ### Part IV: Misconceptions & Defense (1:20 – 1:40)
  **Objective:** Pre-empt the specific pushbacks relevant to writers.
  **Dependency:** Requires the Coffee Case to have landed.

  *   **Order of Operations:**
      1.  **"He denies experience!"** (Address immediately). Dennett denies *qualia*, not pain, joy, or taste. He denies the *mythological coating* on experience.
      2.  **"It's just behaviorism/wordplay."** (Address second). It's not that only behavior matters; it's that the "inner glow" is an unnecessary posit.
      3.  **"Unreliable reporters vs. No Qualia."** (Address third). Reiterate: If the reporter is the only access we have, and the reporter is fallible, the "infallible inner object" is a fiction.
      4.  **"Threat to Fiction."** (Address last). This is their professional anxiety.
  *   **The Fiction-Specific Misconception:** "If there are no private qualia, I can't write deep interiority."
      *   *Head Off:* "You never wrote about qualia. You wrote about *judgments*, *associations*, *memories*, and *narratives*. A character thinking 'I am sad' is a judgment, not a qualia. Dennett frees you to write about the *process* of feeling, not the impossible task of transmitting the ineffable."

  ### Part V: Check for Understanding (1:40 – 1:50)
  **Objective:** Verify they grasp the *shape* of the argument, not just the conclusion.
  **Activity:** "The Pain Scenario."
  *   **Prompt:** "A character stabs their finger. They scream. Later, under hypnosis, they say 'I felt the pain, but I didn't mind it.' Under Dennett's view, is there a 'pain qualia' that stayed the same while the 'suffering' changed? Or did the experience itself change?"
  *   **Correct Grasp:** They should recognize that if the reaction/judgment changes, Dennett argues the *experience* changed. There is no static 'pain qualia' underneath.
  *   **Incorrect Grasp:** "The pain was real, they just reacted differently." (This preserves Qualia).

  ### Part VI: Closing & Boundaries (1:50 – 2:00)
  **Objective:** Define the limits of the session.
  **Content:**
  *   **Leave Out:** The Knowledge Argument (Mary's Room), Inverted Spectra, The Hard Problem, Heterophenomenology methodology.
  *   **Settled:** Dennett argues qualia (as defined by the 4 properties) are incoherent.
  *   **Contested:** Whether this means consciousness is an illusion (Eliminativism) or just different than we think (Revisionism). Whether the argument succeeds against all formulations of qualia.

