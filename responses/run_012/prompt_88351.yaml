answer: |-
  The rain was steady against the windshield, the wipers thumping a slow, funereal rhythm. I kept my eyes on the road, hands tight on the wheel at ten and two. In the passenger seat, Elena had the draft spread across her lap, weighted down by a travel mug of cold coffee. In the back, Marcus was leaning forward, his elbows on his knees, staring at the back of Elena's head.

  They had been at it since the on-ramp.

  "It's not just a cage, Elena," Marcus said, his voice low but urgent. "It's a map. If you force *veshka* to mean 'scar' every single time it appears, you're erasing the generosity. You're erasing her theology."

  Elena didn't turn around. She tapped the paper with a red pen. "And if you break the sestina, you're erasing her discipline. This isn't a diary entry, Marcus. It's a sestina. The end-words rotate in a specific spiral. One, six, five, four, three, two. That pattern isn't decoration. It's the sound of a mind going over the same grief until it wears a groove."

  "But *veshka* isn't just grief," Marcus countered. "It's the paradox. It's the thing that hurts you and saves you. In her dialect, that's one word. In English, we have to choose. If you choose 'scar' for the sake of the rhyme scheme, the last stanza—the envoi—becomes a lie. It becomes about injury only. She died believing the injury *was* the gift."

  "I know what she believed," Elena said, finally turning in her seat to look at him. Her eyes were tired. "I'm the one who spent three weeks with the dictionary. But translation isn't just about semantic fidelity. It's about structural fidelity. If I turn this into free verse, I am writing a poem *about* her poem. I am writing an elegy for her sestina. I am not translating the sestina itself."

  "So the form is more real than the words?" Marcus asked.

  "The form *holds* the words," Elena said. "Think about the funeral. Think about the ritual. We're sitting in a box, following a script, saying the same prayers. Why? Because the container holds the emotion when the emotion is too heavy to carry. The sestina is the coffin. You don't break the coffin to make the body more comfortable."

  "That's morbid," Marcus said.

  "It's accurate."

  "It's also cowardly," Marcus shot back, softening the blow by reaching forward to rest a hand on her shoulder. She didn't shrug it off. "Look, I get the architecture. I do. But if the central pillar is this word, this *veshka*, and you translate it as 'wound' in the first stanza and 'wound' in the last because the form demands repetition... you haven't translated the poem. You've translated the skeleton. You've left the ghost behind."

  Elena sighed, smoothing the paper. "If I let you break the form, where does it stop? If I change the end-words to capture the nuance of *veshka*, then the spiral breaks. If the spiral breaks, the mathematical progression of the grief resolves. It stops looping. Her poem doesn't resolve. It haunts. If I let you fix the meaning, I fix the grief. I make it tidy. I make it something it isn't."

  "Is it better to be haunted by a misunderstanding?" Marcus asked. "Because that's what this is. You're prioritizing the echo over the voice. You want the reader to feel the repetition, but they'll just feel the limitation. They'll think, 'Why does she keep calling it a wound?' They won't know it's also a gift. That's the whole point of the poem, Elena. That's the only reason she wrote it."

  "The point is that she wrote it *as a sestina*," Elena insisted, her voice cracking slightly. "She chose this hard thing. She chose to bind her hands. If I unbind them for her, I'm saying she couldn't handle her own form. I'm saying her constraint was a mistake. It wasn't a mistake. It was a discipline. She was telling us that even the gift is a burden. Even the wound is a pattern."

  Marcus leaned back into the seat, looking out the window at the passing gray trees. "I just don't want people reading this and thinking she died bitter. If *veshka* lands as 'cut' six times, she sounds bitter. If it lands as 'offering' six times, she sounds naive. If we break the form, we can let it be both. We can use a footnote. We can use a line break. We can do the work of poetry."

  "Footnotes aren't poetry," Elena said. "They're apologies."

  "Sometimes an apology is necessary," Marcus said. "To the truth."

  Elena turned fully in her seat now, clutching the draft to her chest. "What counts as the same poem, Marcus? Is it the list of words? Or is it the experience of reading the words in that specific order, under that specific pressure?"

  "It's the fire," Marcus said. "The form is the fireplace. If the fireplace is too small, the fire goes out. I'd rather have the fire on the ground than a cold hearth."

  "But the fire on the ground burns the house down," Elena said. "The hearth contains it so we can sit around it. That's what this is for. It's for us. It's not for her anymore. She's gone. This is for us to sit around the grief without burning alive. The repetition keeps us safe. It tells us: *This pain returns, but it returns in a pattern. It is known.*"

  Marcus was quiet for a long time. The car slowed for a red light. I kept my foot on the brake, not breathing, feeling like an intruder in a conversation that was actually about my grandmother, yet entirely about them.

  "You think the pattern comforts," Marcus said finally.

  "I think the pattern survives," Elena corrected. "Words rot. Meaning shifts. But the structure... the structure holds. If I give you the free verse version, it's beautiful, I know it is. But it's *your* poem then. It's Marcus's poem about Elara. If I keep the sestina, even with the clumsy English, it remains *her* poem. Flaws and all."

  "Is fidelity to the author more important than fidelity to the reader?"

  "At a funeral?" Elena asked. "Yes. The reader is secondary. The dead are the audience."

  Marcus exhaled, a long, shaky breath. He looked at the back of my head in the rearview mirror. I didn't look back.

  "Okay," Marcus said. "Okay. But in the envoi. The last three lines. Where all six words have to appear."

  Elena stiffened. "What about them?"

  "Let me hyphenate," Marcus said. "Let me write 'wound-gift.' Just there. Just once. To break the seal. To show that the circle isn't closed."

  Elena looked down at the paper. She traced the final stanza with her thumb. The wipers swished.

  "If I do that," Elena said quietly, "it's not a pure sestina."

  "It's a translated sestina," Marcus said. "It's a bridge. You keep the spiral. You keep the obsession. But you let the key turn in the lock."

  Elena was silent for a mile. The cemetery exit was coming up on the right. She folded the paper neatly, creasing the edge sharp.

  "Once," she said. "In the final line only. And no footnote."

  "No footnote," Marcus agreed.

  "And you don't tell anyone I compromised," she added, a faint, sad smile touching her lips.

  "I'll tell them it was in the original," Marcus said.

  Elena snorted, wiping her eye with the back of her hand. "Liar."

  "Poet," he corrected.

  I signaled right, turning the car into the long driveway of the cemetery. The engine idled down. The silence in the car wasn't heavy anymore; it was just full. Elena held the paper like an offering, or a wound.
