answer: |-
  It is a pleasure to address a colleague who recognises that the confusion is often the signal, not the noise. You are quite right to suspect that the slogan "separateness of persons" is doing too much heavy lifting in the summaries you have encountered. In the literature, it functions as a boundary marker between consequentialist aggregation and deontological constraints, but its conceptual engine is often obscured. Since you asked me to choose the strongest reading rather than survey the field, I will defend the interpretation that the objection is fundamentally about the **conflation of prudential rationality with moral justification**. This is the Rawlsian core of the argument, and it survives best against scrutiny, though it faces significant metaphysical challenges.

  **1. The Core Complaint: The Missing Subject of Sacrifice**

  You asked whether the objection is about standpoint, means/ends, or constraints. The strongest version is about the **standpoint**, specifically the ontological status of the entity that supposedly benefits from the aggregation.

  In your former field, if you summed energy states across distinct systems, you would be careful about defining the boundary of the system. Utilitarianism treats humanity as a single system containing multiple sub-components (persons). The objection argues that this is a category error. When a single individual sacrifices a present pleasure for a future gain, there is a single subject of experience who endures the loss and later enjoys the compensation. The net utility is realised within a unified consciousness.

  When utilitarianism sacrifices Person A for Person B, there is no supra-personal entity that experiences the net gain. Person A experiences only the loss; Person B experiences only the gain. The "social utility" is an abstraction in the mind of the observer, not a reality experienced by any subject. Therefore, the complaint is that utilitarianism licences sacrifices without a **bearer of the compensation**. It treats the moral landscape as if it were a prudential calculation for a single super-agent, but no such agent exists. This is distinct from the "means to ends" complaint (which is Kantian) because it does not necessarily claim persons are inviolable; rather, it claims the arithmetic of justification is invalid because the variables belong to distinct equations.

  **2. The Asymmetry: Time-Slices versus Persons**

  This leads directly to your second question, which is the sharpest tool in your kit. If aggregation is forbidden across persons, why is it permitted across time-slices of a single life? You noted that you suffered earlier for your later self's benefit. Why is that valid if the "earlier you" and "later you" are psychologically distinct stages?

  The standard defence of the asymmetry relies on the **unity of consciousness**. Within a single life, memory and agency provide a thread that binds the time-slices into a single subject. The later self remembers the sacrifice of the earlier self and recognises it as *their own*. The compensation is internally realised. Across persons, no such recognition occurs. The victim of a utilitarian sacrifice never accesses the beneficiary's gain.

  However, I must be transparent about what is contested here. This defence relies on a robust, non-reductionist view of personal identity. Derek Parfit, in *Reasons and Persons*, challenged this precisely along the lines of your intuition. He argued that persons are just sequences of psychological connections, much like time-slices. If personal identity is reductionist (as many physicalists suspect), the asymmetry collapses. If the "self" is just a convenient fiction for a bundle of experiences, then the distinction between intra-personal and inter-personal aggregation is shallow.

  So, to answer you directly: the argument for the asymmetry is that moral status attaches to **subjects**, not **experiences**, and there is a subject persisting through time that does not persist across persons. But you are correct to sense instability here; the objection only holds firm if one rejects a reductionist view of personal identity. If you view persons as merely distinct loci of utility functions with no deeper metaphysical unity, the objection loses its grip. This is where the debate currently sits: the separateness objection is metaphysically expensive.

  **3. Distinct Objection or Distributive Complaint?**

  You asked whether this is a distinct objection or merely a distributive complaint that any theory with trade-offs must answer. It is distinct.

  A distributive complaint (such as those from prioritarianism or egalitarianism) accepts the aggregative structure but argues that the *weighting* of utilities should vary based on who holds them (e.g., giving priority to the worse off). The separateness of persons objection is more fundamental: it challenges the **permission structure** of aggregation itself. It claims that there are certain costs that cannot be imposed on A regardless of the magnitude of gain to B, not because the distribution is unfair, but because A and B are distinct jurisdictions of moral claim.

  To use a physical analogy: a distributive complaint is like arguing about how to weight the masses in a centre-of-gravity calculation. The separateness objection is like arguing that you cannot calculate a centre of gravity for objects that are not physically connected. It says the operation is invalid, not just that the inputs are weighted poorly. Utilitarianism assumes all utilities are commensurable and transferable across a common denominator. The separateness objection denies the common denominator exists.

  **Settled vs. Contested**

  To ensure you are not misled by the literature: it is settled that Rawls introduced this formulation to critique classical utilitarianism, and it is settled that Nozick utilised it to argue for rights as side constraints. However, it is **contested** whether the objection succeeds. Many contemporary consequentialists accept the force of the objection but argue that practical morality requires aggregation regardless, or they adopt Parfit's reductionism to dissolve the asymmetry. There is no consensus that the separateness of persons definitively refutes utilitarianism; rather, it is accepted as the primary hurdle any aggregative theory must clear. When you read authors treating it as a knockout blow, they are usually signalling a non-consequentialist commitment rather than reporting a consensus.

  **Summary**

  The confusion you feel stems from the fact that the objection asks you to accept a metaphysical premise (that persons are ontologically distinct in a way that time-slices are not) to validate a moral conclusion (that aggregation across persons is forbidden). Without that premise, the utilitarian arithmetic looks consistent. With it, the arithmetic looks like a category error. The work the word "separate" is doing is to insist that moral claims are indexed to subjects, and there is no subject over and above the individuals to whom the net gain accrues.

  Bottom line: The objection claims utilitarianism illegitimately extends the logic of prudential rationality within a life to moral justification across lives, ignoring that only the former involves a single subject who experiences the compensation.
