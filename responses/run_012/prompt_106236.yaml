  # The Epistemic Closure Decision Tree

  **Root Commitment:** You provisionally assert the Moorean proposition: *"I know I have hands."* You acknowledge that *Having Hands* entails *Not Being a Brain-in-a-Vat (BIV)*.

  ### Node 1: The Stability of Attribution
  **Question:** When the BIV hypothesis is explicitly raised and made salient in conversation, do you retract your claim to know you have hands?

  *   **YES:** Go to **Node 2**.
  *   **NO:** (You maintain you know you have hands regardless of salience). Go to **Node 3**.

  ---

  ### Node 2: The Scope of Retraction
  **Question:** Do you retract the claim only in this high-salience context, or do you admit you never knew you had hands even in ordinary contexts?

  *   **Only in high-salience context:**
      *   **Leaf: Contextualism about Knowledge Attributions.**
      *   **Epistemic Bill:** Ordinary people lose knowledge when skeptics speak. The inference from Hands to ~BIV is blocked because the semantic standards for "knows" shift mid-argument.
      *   **Status:** Defended (Cohen, DeRose, Lewis).

  *   **Never knew (even in ordinary contexts):**
      *   **Leaf: Skepticism.**
      *   **Epistemic Bill:** Ordinary people must be declared ignorant of the external world. You must abandon the Root Commitment entirely.
      *   **Status:** Defended (Unger, Stroud).

  ---

  ### Node 3: Closure Validity
  **Question:** Given that you know you have hands (invariantly), do you thereby claim to *know* you are not a BIV via deduction?

  *   **YES:** (You accept Closure). Go to **Node 4**.
  *   **NO:** (You deny/restrict Closure). Go to **Node 5**.

  ---

  ### Node 4: The Ground of Closure
  **Question:** Is your ability to know ~BIV grounded in the fact that your belief could not *easily* have been false (i.e., in nearby possible worlds where you believe ~BIV, it is true)?

  *   **YES:**
      *   **Leaf: Safety-Based Accounts.**
      *   **Epistemic Bill:** Closure holds, but knowledge requires modal stability. You must explain why the ~BIV belief is "safe" despite the indistinguishability of the BIV world (often by arguing the BIV world is distant).
      *   **Status:** Defended (Sosa, Pritchard).
      *   **Note on Tracking:** This tree cannot cleanly separate Safety from Mooreanism without probing Gettier cases. Both accept closure here. Safety is distinguished by its modal machinery, but the "bill" (accepting ~BIV knowledge) is identical to Mooreanism in this branch.

  *   **NO:** (You claim warrant transmits regardless of modal neighborhood).
      *   **Leaf: Mooreanism / Dogmatist Replies.**
      *   **Epistemic Bill:** Closure holds unconditionally. You must accept "Easy Knowledge": that perceptual warrant for hands automatically warrants the denial of skeptical hypotheses.
      *   **Status:** Defended (Pryor, Wright).

  ---

  ### Node 5: The Mechanism of Failure
  **Question:** If you deny you know ~BIV, is it specifically because if you *were* a BIV, you would still believe you were not?

  *   **YES:** (The belief is insensitive).
      *   **Leaf: Sensitivity / Tracking.**
      *   **Epistemic Bill:** Closure fails. Ordinary people cannot infer ~BIV because the belief does not track the truth. You must deny that knowledge closes over known entailment when the conclusion is insensitive.
      *   **Status:** Defended (Nozick, Dretske [in part]).
      *   **Indistinguishability Note:** This tree cannot separate Tracking from Relevant Alternatives without asking about *Lottery* propositions. Tracking denies Lottery knowledge (insensitive); some RA accounts allow it (irrelevant). If your interlocutor also denies Lottery knowledge, Tracking and RA are functionally identical here.

  *   **NO:** (The belief might track, but the alternative is excluded).
      *   **Leaf: Relevant Alternatives.**
      *   **Epistemic Bill:** Closure fails. Ordinary people cannot infer ~BIV because BIV is not a *relevant* alternative to having hands, even if the belief tracks. You must restrict closure to "relevant" entailments.
      *   **Status:** Defended (Dretske, Goldman).

  ---

  ### Node 6: The Entailment Condition (Shadow Branch)
  *(Insert this node if the interlocutor at Node 3 hesitates on "Known Entailment")*
  **Question:** Does the agent need to *know* the entailment ($p \to q$), or is *justified belief* in the entailment sufficient for closure?

  *   **Justified Belief Sufficient:**
      *   **Leaf: Weakened Closure Accounts.**
      *   **Epistemic Bill:** Closure holds, but the bar for the entailment link is lowered.
      *   **Status:** Unexplored / Unattractive. (Rarely defended; risks collapsing into skepticism if the entailment belief is fallible).

  *   **Knowledge Required:**
      *   *Return to Node 3.*

  ---

  ### Un defended / Pathological Combinations

  *   **Leaf: Closure Denied, but K(~BIV) Asserted (Non-Deductive).**
      *   **Description:** You claim you don't know ~BIV *via* Hands, but you do know ~BIV some other way, while keeping K(Hands).
      *   **Epistemic Bill:** You posit a mysterious, non-deductive source for skeptical denials.
      *   **Status:** **Incoherent.** (If you know ~BIV and know Hands $\to$ ~BIV, standard epistemic logic forces Closure acceptance or requires denying you know the entailment).

  *   **Leaf: Sensitivity + Closure Accepted.**
      *   **Description:** You require Sensitivity for knowledge but insist Closure holds universally.
      *   **Epistemic Bill:** You must explain how ~BIV is sensitive (usually impossible by definition) or accept contradictions.
      *   **Status:** **Incoherent.** (Nozick abandoned closure precisely to save Sensitivity).

  *   **Leaf: Contextualism + Closure Denied (Within Context).**
      *   **Description:** You claim standards shift, but also that closure fails even within a single fixed context.
      *   **Epistemic Bill:** Double jeopardy for knowledge; standards shift *and* inference is broken.
      *   **Status:** **Unattractive.** (Redundant theoretical machinery; usually one or the other suffices).

  ### Summary of Tracking Indistinguishability
  **Tracking** is isolated at **Node 5 (YES)**. However, this tree cannot separate Tracking from **Relevant Alternatives** if the interlocutor also denies Lottery knowledge. Both positions pay the same epistemic bill regarding Closure (it fails for skeptical hypotheses). They are only separable by asking about probabilistic propositions (Lottery) where Tracking fails (insensitive) but some RA accounts succeed (irrelevant). If your interlocutor treats Lottery and BIV cases identically, Tracking and RA are extensionally equivalent in this tree.
