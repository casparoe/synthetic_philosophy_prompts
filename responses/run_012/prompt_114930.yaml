answer: |-
  The list is jointly unsatisfiable because the demand for determinate numerical identity in branching cases contradicts the continuity conditions required for gradual replacement and fission.

  ### Desiderata List

  1.  **Gradual Continuity:** The theory must affirm survival in the **Replacement Case**, where function and consciousness persist despite total material substitution.
      *   *Motivation:* Intuition that slow change preserves the self; necessary to validate uploading as treatment.
  2.  **Discontinuity Sensitivity:** The theory must affirm death or non-identity in **The Swap**, where substitution is instant despite functional match.
      *   *Motivation:* Intuition that sudden destruction of the original organism ends the person; necessary to prevent killing via copying.
  3.  **Fission Resolution:** The theory must specify the status of both entities in **The Two Jars**, where original tissue and replacement both function simultaneously.
      *   *Motivation:* Practical need to know rights and responsibilities of both outputs; necessary to handle branching.
  4.  **Threshold Tolerance:** The theory must account for **The Half-Upload**, where the subject is a mixture of biological and artificial parts.
      *   *Motivation:* Avoids arbitrary cliff-edges during the procedure; necessary for interim legal status.
  5.  **Historical Integrity:** The theory must distinguish **The Rewrite** (false memories) from **Replacement** (true memories), despite functional equivalence.
      *   *Motivation:* Intuition that deception or loss of history matters; necessary to distinguish survival from impersonation.
  6.  **Interruption Tolerance:** The theory must affirm survival through **dreamless sleep and anaesthesia**.
      *   *Motivation:* Ordinary intuition; necessary to avoid classifying sleep as death.
  7.  **Metabolic Turnover:** The theory must affirm identity despite total cellular replacement over a lifetime.
      *   *Motivation:* Biological fact; necessary to ensure adults are the same persons as their younger selves.

  ### Analysis of Distinctions

  *   **Numerical identity versus survival:** *Parochial.* Insisting these are distinct is a Reductionist (Parfitian) preference; Animalists and Non-Reductionists treat them as co-extensive.
  *   **What matters versus what identity is:** *Parochial.* Insisting these come apart is a Reductionist preference; common sense and many metaphysical theories treat identity as what matters.
  *   **Continuity of causal process versus continuity of information:** *Genuine.* A usable theory must distinguish these to solve **The Rewrite**; functional match without causal history is impersonation, not survival.
  *   **A fact versus a convention:** *Parochial.* Insisting identity is a deep fact is a Realist preference; Conventionalists argue identity conditions are stipulated by social or legal practice.
  *   **A determinate answer versus a case in which there is nothing to be right about:** *Parochial.* Insisting on determinacy is an Epistemicist or Classical Logic preference; Ontic Vagueness theorists accept indeterminate identity.
  *   **Survival versus the availability of a copy:** *Genuine.* A practical theory must distinguish existing through time from having a duplicate exist elsewhere; conflating them validates suicide-by-copying.

  ### Joint Unsatisfiability

  The desiderata cannot be jointly satisfied because **Gradual Continuity**, **Fission Resolution**, and **Numerical Identity** form an inconsistent triad when combined with **Determinacy**.

  1.  **The Sorites Conflict:** If **Gradual Continuity** holds (Replacement is survival) and **Discontinuity Sensitivity** holds (Swap is death), there must be a cutoff point in the speed or granularity of replacement. If the theory demands a **Determinate Answer**, it must identify a specific step where survival becomes death. This violates **Fact versus Convention**, as any specific step is metaphysically arbitrary. If the theory denies a cutoff (accepting vagueness), it violates **Determinacy**.
  2.  **The Branching Conflict:** In **The Two Jars**, both the original tissue and the replacement satisfy the conditions for **Gradual Continuity** (psychological and/or causal continuity). If both survive, **Numerical Identity** is violated (one person cannot be numerically identical to two distinct persons). If only one survives, **Determinacy** demands a fact distinguishing them where none exists (both are equally continuous), violating **Fact versus Convention** or forcing an arbitrary choice.

  You cannot maintain strict numerical identity, demand determinate answers in branching cases, and honor the intuition that gradual psychological continuity preserves the person.

  ### Decisive Requirement

  The single requirement that does the most to rule out otherwise attractive theories is **the demand for a determinate fact of numerical identity in branching cases**. This requirement forces Psychological Continuity theories to abandon transitivity, forces Animalists to deny survival in uploading scenarios, and forces Four-Dimensionalists to accept brute facts about stage identity, effectively eliminating any theory that relies on continuity relations alone.
