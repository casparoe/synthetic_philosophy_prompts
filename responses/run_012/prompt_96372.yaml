      *   *Phase 5 (The Trigger):* At minute 2, I drop a stack of heavy books/papers near the door or ask a specific question requiring them to stop working.
      *   *Phase 6 (Measurement):* Who stopped to help?
      *   *Phase 7 (Debrief):* Compare rates. Reveal the time difference. Connect to Virtue Ethics (Aristotle) vs. Situationism (Doris/Harman).

      *Wait, is dropping books too cliché?*
      Let's make it about **Honesty/Rule Following**.
      Task: Self-report puzzle score.
      Variable: **Surveillance.**
      No, that's too obvious.
      Let's stick to **Helpfulness under Time Pressure**. It's the most robust finding (Darley & Batson).
