      *   *Title:* The Consistency Illusion.
      *   *Phase 1 (Design):* Ask them: "If we wanted to measure 'Civic Courage' or 'Helpfulness', how would we do it without a questionnaire?" They will suggest observing behavior. I will suggest a task where they could help me.
      *   *Phase 2 (The Split):* Randomly assign Group 1 and Group 2. Tell them it's to "compare different problem-solving strategies."
      *   *Phase 3 (The Task):* A logic puzzle. Prize for completion.
