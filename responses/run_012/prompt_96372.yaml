prompt: |-
  I run a philosophy club at a high school, about 15 students, one hour. I want a session on the situationist critique of virtue ethics that doesn't just retell Milgram or the Good Samaritan. Design an in-class activity where they feel the critique in their bones. Ideally they help design what looks like a test of their own character or virtues at the start, and then some trivial situational variable -- time pressure, noise, whether someone else already helped -- turns out to predict what they actually did. No lecture up front; they shouldn't hear the word situationism until the debrief. Give me setup, rules, timeline, the debrief that maps what happened onto the philosophical point, what will predictably go wrong the first time, and one thing the activity can't reproduce that I'll have to say out loud.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** High school philosophy club (approx. 15 students).
      *   **Duration:** 1 hour.
      *   **Topic:** Situationist critique of virtue ethics.
      *   **Constraint 1:** No Milgram or Good Samaritan retelling (avoid the clichés).
      *   **Constraint 2:** Experiential activity ("feel it in their bones").
      *   **Constraint 3:** Students help design the "test" at the start.
      *   **Constraint 4:** A trivial situational variable must predict behavior (time pressure, noise, etc.).
      *   **Constraint 5:** No lecture up front; reveal "situationism" only at debrief.
      *   **Deliverables:** Setup, Rules, Timeline, Debrief (mapping to philosophy), Predictable Failures, One Limitation to verbalize.

  2.  **Deconstruct the Philosophical Core:**
      *   *Virtue Ethics:* Character traits (virtues) are stable across situations. If you are honest, you are honest *generally*. If you are compassionate, you are compassionate *generally*.
      *   *Situationism:* Behavior is determined more by external situational factors than internal character traits. "Cross-situational consistency" is a myth.
      *   *The Goal:* Create a scenario where students *think* they are testing character, but the outcome is actually driven by a manipulated variable they didn't notice or deem irrelevant.

  3.  **Brainstorming Activities:**
      *   *Idea 1: The Honesty Box.* Sell cookies, vary the change given. *Problem:* Too close to standard honesty experiments, hard to control in 1 hour.
      *   *Idea 2: The Helping Hand.* Drop papers. *Problem:* Too close to Good Samaritan.
      *   *Idea 3: The Group Puzzle.* Solve a problem, vary the noise level. *Problem:* Hard to measure "virtue."
      *   *Idea 4: The "Fairness" Auction.* Students bid on prizes with fake money. *Problem:* Complex setup.
      *   *Idea 5: The "Resource Allocation" Task.* Students decide how to divide a reward among themselves and an absent partner. Manipulate whether they are rushed or relaxed. *Strong contender.*
      *   *Idea 6: The "Truth-Telling" Game.* A game where lying benefits you, but honesty is the "virtue." Manipulate visibility or time. *Strong contender.*

      *Selection:* Let's go with a variation of *Idea 5 (Resource Allocation)* combined with *Idea 1 (Design)*. It allows them to define what "good" looks like, then subtly manipulates the context.
      *Refinement:* To make it truly feel like *their* test, they need to define the virtue. Let's call it "The Integrity Challenge." They design a task where they think honesty or generosity will be tested. But the actual variable is *cognitive load* or *time pressure* affecting their ability to adhere to their own standards.

      *Wait, a better angle:* The prompt asks for them to help design a test of *their own* character.
      *Revised Concept:* "The Virtue Audit."
      1.  Students define a virtue (e.g., Fairness).
      2.  They design a scenario to test it.
      3.  I (the facilitator) run the scenario but introduce a hidden variable (e.g., Room Temperature, Background Noise, or Time Pressure).
      4.  Split the class into Group A and Group B without them knowing why.
      5.  Compare results.

      *Specific Activity:* **The "Ungraded" Quiz.**
      *   Setup: Tell them we are testing "Intellectual Honesty."
      *   Task: A difficult logic puzzle or trivia quiz.
      *   Incentive: Prize for the top score.
      *   Self-Grading: They grade their own papers (opportunity to cheat).
      *   The Manipulation: Group A gets a clear, quiet environment. Group B gets a distracting environment (loud ticking clock, flickering light, or urgent time pressure).
      *   *Critique:* Self-grading is a bit cliché (Honor Code experiments).

      *Let's try something more collaborative:* **The "Common Pot" Game.**
      *   Setup: There is a pool of rewards (candy, extra time, etc.).
      *   Task: They must decide how to distribute it.
      *   Virtue: Generosity/Justice.
      *   Manipulation: *Anonymity vs. Visibility*? No, that's too obvious. *Time Pressure* is better for situationism.
      *   *Better Manipulation:* **The "Found Money" Scenario.**
      *   Actually, let's look at the "Design" constraint again. "Ideally they help design what looks like a test of their own character."
      *   Okay, Phase 1: They decide what virtue matters and how to test it.
      *   Phase 2: I implement it, but I rig the situation.
      *   Phase 3: Results show the situation mattered more than the virtue.

      *Concrete Plan:*
      1.  **Virtue Selection:** They pick one (e.g., Patience, Honesty, Generosity). Let's assume they pick **Fairness** or **Honesty** as they are easiest to test. I will guide them toward **Fairness** in resource distribution.
      2.  **The Task:** Divide a reward between themselves and a "partner" (who is actually fictitious/absent).
      3.  **The Manipulation:** *Cognitive Load/Time Pressure.*
      4.  **The Twist:** Half the class is told they have 5 minutes to decide (Low Pressure). Half are told they have 30 seconds and must solve a math problem first (High Pressure).
      5.  **Outcome:** High pressure leads to more selfish/unfair choices (ego depletion/situational override).

      *Wait, I need them to design the test.*
      Okay, I will ask them: "How would we know if someone is truly Fair?" They will propose a distribution task. I will say "Great, let's run it." Then I introduce the variable.

  4.  **Developing the Timeline (60 mins):**
      *   0-10: Hook & Design (They define the virtue and test).
      *   10-15: Setup & Split (Secretly divide groups).
      *   15-30: The Activity (Running the test).
      *   30-45: Data Reveal & Confusion (Why did results differ?).
      *   45-60: Debrief & Philosophy (Situationism).

  5.  **Refining the Manipulation:**
      *   Time pressure is good. But let's make it more subtle.
      *   *Idea:* **The "Helping" Variable.**
      *   Task: They need to deliver a message or move a stack of papers to "help" the club prep.
      *   Variable: Whether they are carrying something heavy or not? No.
      *   Variable: **Ambiguity of Need.**
      *   Let's stick to the **Resource Allocation** idea. It's cleaner for a classroom.
      *   *Variable:* **Salience of the Observer.**
      *   Group A: "This is anonymous."
      *   Group B: "Please write your name on this for our records."
      *   *Problem:* That tests reputation, not situationism in the deep sense.
      *   *Variable:* **Environmental Discomfort.**
      *   Group A: Comfortable chairs, normal temp.
      *   Group B: Cramped, loud fan.
