      Group B: "This is a windfall we found in the budget." (Luck frame).
      *Critique:* That's framing, not exactly situationist critique of *traits*.

      *Let's go back to the classic Situationist move:* Cross-situational consistency.
      Activity: **The "Puzzle & The Plea."**
      1.  **Design:** Students agree that "Helpfulness" is a virtue. They design a scenario: Someone asks for help while you are doing something.
