answer: |-
  # Session Plan: The Consistency Illusion
  **Topic:** The Situationist Critique of Virtue Ethics
  **Time:** 60 Minutes
  **Students:** ~15 High Schoolers
  **Goal:** Demonstrate that behavior is often predicted by trivial situational variables rather than stable character traits, without lecturing until the end.

  ## 1. Materials Needed
  *   Two different printed instruction sheets (identical puzzles, different time limits).
      *   **Sheet A (Relaxed):** "Complete the puzzle. You have 10 minutes. This is a low-stakes warm-up."
      *   **Sheet B (Rushed):** "Complete the puzzle. You have 4 minutes. This is a timed assessment."
  *   A logic puzzle or word search (medium difficulty).
  *   A heavy box or a large, awkward stack of papers.
  *   Candy/prizes (optional, to raise stakes).
  *   Whiteboard.

  ## 2. Timeline Overview
  *   **00:00 – 00:10:** The Design Phase (Student-led).
  *   **00:10 – 00:15:** Setup & Secrecy.
  *   **00:15 – 00:25:** The Activity (The Trap).
  *   **00:25 – 00:35:** Data Reveal & Confusion.
  *   **00:35 – 00:55:** The Debrief (Philosophy).
  *   **00:55 – 01:00:** Wrap-up.

  ---

  ## 3. The Activity Script

  ### Phase 1: The Design (0-10 mins)
  **Facilitator:** "We talk a lot about virtues like honesty, courage, and helpfulness. Virtue ethics assumes that if you *are* a helpful person, you act helpfully. But how do we actually test that? If we just ask you, 'Are you helpful?', you'll say yes. How do we design a real test of our club's character?"

  *   **Guide the conversation:** Let them brainstorm. If they suggest surveys, push back ("People lie"). Steer them toward **observation**.
  *   **Target Consensus:** Get them to agree on a test like: *"Put people in a situation where they are working on something, and see if they stop to help someone in need."*
  *   **Facilitator:** "Great. That's our protocol. We are testing **Helpfulness under Load**. I'm going to give you a task. Midway through, I will create a situation where I need help. We'll see who stops."

  ### Phase 2: Setup & Secrecy (10-15 mins)
  *   Hand out the instruction sheets **randomly** as students sit down. Do not explain the difference.
  *   **Crucial Instruction:** "This is an individual focus task. Please do not talk to your neighbors or compare sheets. Keep your eyes on your own paper."
  *   **The Variable:**
      *   **Group A (Relaxed):** ~7 students get Sheet A (10 mins).
      *   **Group B (Rushed):** ~8 students get Sheet B (4 mins).
  *   *Note:* The puzzle must be solvable in 4 minutes but require focus.

  ### Phase 3: The Trap (15-25 mins)
  *   Start the timer. Project a countdown clock if possible.
  *   **Minute 2 (for everyone):** Stand up abruptly. Walk to the front with the heavy box/stack of papers.
  *   **The Action:** "Stumble" slightly. Drop a significant portion of the papers/box contents near the center of the room. Say, "Oh no, I'm so clumsy, I need to get these to the office immediately."
  *   **The Ask:** Look at the room generally. "Could someone help me pick these up and carry them? It'll take about 3 minutes."
  *   **The Conflict:** Helping means failing the timed task (especially for Group B). Ignoring you means completing the task but failing the "Helpfulness" test they designed.
  *   **Observation:** Note who helps. Mentally tag them as Group A or Group B based on where they are sitting (you should know who has which sheet).
  *   **After 4 Minutes:** Call time. "Pencils down." Collect the sheets.

  ### Phase 4: Data Reveal (25-35 mins)
  *   **Facilitator:** "Okay, let's look at the results of our character test."
  *   Draw a table on the board: **Helped vs. Did Not Help.**
  *   Ask for a show of hands: "Who stopped to help me?" Record the names.
  *   **The Twist:** "Now, I'm going to reveal something I didn't tell you during the design phase."
  *   Reveal the time limits. "Group A had 10 minutes. Group B had 4 minutes."
  *   Overlay the data. You will likely see a stark correlation: Most helpers came from Group A; most non-helpers came from Group B.
  *   **Ask the Room:** "Look at this. Did Group B have less 'helpfulness' virtue than Group A? Or did something else happen?"
  *   Let them argue. They will likely say, "Well, they were stressed," or "They didn't have time."
  *   **Facilitator:** "Exactly. But if Virtue Ethics is right, a virtuous person should be virtuous *even when rushed*. So what does this data actually say about character?"

  ---

  ## 4. The Debrief: Mapping to Philosophy (35-55 mins)

  **Step 1: Define the Enemy (Virtue Ethics)**
  *   Write **Aristotle / Virtue Ethics** on the board.
  *   **Concept:** *Global Traits.* Virtue ethics claims character traits are **stable** and **consistent**. If you are honest, you are honest at home, at school, under pressure, and when relaxed.
  *   **Question:** "If Group B is just as 'helpful' as Group A deep down, why did the data look so different?"

  **Step 2: Introduce the Critique (Situationism)**
  *   Write **Situationism (Doris / Harman)** on the board.
  *   **Concept:** Behavior is not determined by internal traits, but by **situational variables**.
  *   **Key Term:** *Cross-Situational Consistency.* Situationists argue this doesn't exist. There is no "Helpful Person," there is only "Person in a Helping Situation."
  *   **The Point:** The 6-minute time difference is a *trivial* situational variable. It shouldn't morally matter. But it predicted behavior better than their self-perceived character.

  **Step 3: The "Fundamental Attribution Error"**
  *   Explain that we naturally explain *our* behavior by situation ("I didn't help because I was rushed") but *others'* behavior by character ("They didn't help because they are selfish").
  *   Today, they were both the actor and the observer. They felt the situation override their intentions.

  **Step 4: Implications**
  *   "Does this mean virtue is fake?" (No, but it's fragile).
  *   "If we want people to act better, should we train character or fix situations?" (Situationist answer: Fix the situation/design the environment).

  ---

  ## 5. Predictable Failures (And Fixes)

  1.  **The "Cynical Teen" Failure:** No one helps in either group because they suspect a trick.
      *   *Fix:* Make the "accident" look genuine. Sell the stumble. If no one helps, the debrief is even *more* powerful: "Even with low stakes, the situation (being observed/tested) stopped you from helping."
  2.  **The Contamination Failure:** Students compare time limits before the activity ends.
      *   *Fix:* Seat Group A and Group B on opposite sides of the room. Reiterate the "No Talking" rule strictly as a "Focus Test."
  3.  **The "Moral Outrage" Failure:** Group B feels cheated/manipulated and disengages.
      *   *Fix:* Acknowledge the frustration immediately in the debrief. "It feels unfair, right? That frustration is the situational force overriding your virtue."

  ---

  ## 6. The One Thing You Must Say Out Loud
  *This activity cannot reproduce the full philosophical weight of the critique, so you must verbalize this limitation:*

  > "This experiment created a **Strong Situation**—the time pressure was obvious and overwhelming. Situationists argue that even in **Weak Situations**—where the pressure is subtle, like the color of the room, finding a dime in a phone booth, or background noise—our behavior shifts without us noticing. The scary part of Situationism isn't that we fail when stressed; it's that we fail when we think we're fine."

  ## 7. Facilitator Cheat Sheet (Philosophical Terms)
  *   **Globalism:** The idea that traits are broad and apply everywhere (Virtue Ethics assumption).
  *   **Fragmentation:** The idea that we might be honest at school but dishonest at home (Situationist observation).
  *   **Fundamental Attribution Error:** Overestimating personality and underestimating the situation when judging others.
  *   **Moral Luck:** Whether we get credit/blame for things outside our control (like the time limit I gave you).
