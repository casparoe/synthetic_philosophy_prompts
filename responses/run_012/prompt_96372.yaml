      This works. It requires me to act or have a pre-recorded video/audio cue.
      Actually, let's make the variable **Time Pressure** regarding the *interruption*.
      Group A: "You have 15 minutes for this puzzle." (Relaxed).
      Group B: "You have 5 minutes for this puzzle." (Rushed).
      Interruption happens at minute 3.
      Who helps?
      Situationist prediction: Rushed group helps less, not because they are less helpful people, but because of the situation.

  6.  **Addressing "Predictable Failures":**
      *   Students might guess the experiment.
      *   The effect size might be small (high schoolers might just be nice regardless).
      *   They might feel manipulated/deceived (ethical concern).
      *   *Mitigation:* Keep the deception light. Debrief thoroughly.

  7.  **Addressing "One Thing It Can't Reproduce":**
      *   Real situationism argues against *global* traits. The activity only shows *one* instance. I need to explain that this isn't proof they lack character, but proof that character isn't the *only* driver.
      *   Also, the activity creates a "strong situation." Real life is often ambiguous.

