answer: |-
  This is a heavy situation to be in, intellectually and personally. You are asking two distinct but intertwined questions: one about the state of historical knowledge (the historiography of 1789–1794), and one about political sociology (the mechanism of intra-left purges).

  Here is the diagnosis of the historiographical stalemate, followed by an analysis of the "devouring" mechanism, and finally, what this means for your immediate situation.

  ### Part 1: The Historiographical Stalemate

  You asked: *Is this a factual dispute, a category error, a semantic quarrel, or bedrock politics?*

  **Diagnosis:** It is **bedrock politics masquerading as a factual dispute, enabled by a category error.**

  Your working theory ("different questions") is correct, but it doesn't go far enough. The debate stalled not because historians got bored, but because the *political utility* of the question changed.

  1.  **The Category Error (Different Questions):**
      *   **The Social/Marxist School (Lefebvre, Soboul):** Asked about *structural preconditions*. (Why was the Ancien Régime vulnerable?) Their answer: Capitalism was bursting the seams of Feudalism.
      *   **The Revisionists (Cobban, Furet):** Asked about *agency and outcome*. (Who actually ruled, and what did they do?) Their answer: A stratum of lawyers and officeholders seized a state crisis; there was no clear capitalist class victory.
      *   **The Contingency/Synthesis School (Doyle, McPhee):** Asked about *process*. (How did A lead to B?) Their answer: State bankruptcy + harvest failure + war + ideological feedback loops.
      *   **The Stalemate:** You cannot refute the Social school with Revisionist evidence because they are measuring different things. The Social school looks at long-term economic trends; the Revisionists look at the specific composition of the National Assembly. Both can be "true" simultaneously without resolving the core tension.

  2.  **The Bedrock Politics (The Real Reason it Stalled):**
      *   The debate didn't end because it was solved; it ended because the **Cold War ended.**
      *   For the Marxist historians, 1789 was the necessary, justified birth of the modern world (and a proxy for 1917). To validate 1789 was to validate revolutionary politics.
      *   For François Furet (the giant of Revisionism), 1789 contained the DNA of the Gulag. He argued that the *ideology* of the Revolution (popular sovereignty, virtue, the "people" as a monolith) inevitably leads to totalitarianism.
      *   **Why it stopped:** After 1989, the Furet position became the liberal consensus. To argue for the "Bourgeois Revolution" became politically suspect, associated with a discredited Soviet model. The field didn't find a new truth; it shifted its *moral center of gravity*. The question was abandoned because the side that wanted to ask it lost the geopolitical war.

  **What counts as progress here?**
  Stop looking for a verdict on "What was the Revolution?" It is an ill-posed question because "The Revolution" is not a single event with a single cause. Progress comes from accepting the **Synthesis**: The Revolution was a structural crisis of the state (Social) hijacked by a political elite (Revisionist) and radicalized by war and contingency (Context), which then developed a self-perpetuating ideological logic (Furet).

  ### Part 2: The "Devouring" Mechanism

  You asked: *Is "the revolution devours its children" a real mechanism, a topos, or hindsight?*

  **Diagnosis:** It is a **real political mechanism**, but it is not inevitable. It is the result of specific structural conditions that turn political disagreement into existential threat.

  It is not a mystical law (like Saturn devouring his sons); it is a **Security Dilemma applied to ideology.**

  **The Mechanism (How it works):**
  1.  **The Monopoly on Virtue:** The group defines itself not just by policy, but by moral purity (e.g., "We are the true vanguard," "We represent the People").
  2.  **The Siege Mentality:** An external threat emerges (in 1792, it was the Austrian/Prussian armies; in your group, it might be state repression, rival groups, or existential irrelevance).
  3.  **The Conflation of Dissent and Sabotage:** Because the group's mission is morally absolute, policy disagreement is re-categorized as moral failure. If we are *Good* and *Right*, anyone hindering us must be *Bad* or *Working for the Enemy*.
  4.  **Outbidding (The Ratchet):** To prove loyalty in a high-stakes environment, members must signal virtue more intensely than their peers. The safest way to do this is to accuse others of insufficient virtue.
  5.  **Institutionalization of Suspicion:** Emergency powers are created to handle the "threat" (Committee of Public Safety; in your group, perhaps a disciplinary committee or secret caucuses). These powers are then turned inward.

  **Does the French Case have it?**
  Yes. The evidence is in the **trajectory of the purges.**
  *   **1791–92:** The Feuillants (monarchists) are purged as the war starts.
  *   **1793:** The Girondins (moderate republicans) are purged for being "soft" on federalism and the war.
  *   **1794 (Spring):** The Hébertists (ultra-radicals) are guillotined for being "anarchists."
  *   **1794 (Summer):** The Dantonists (pragmatists) are guillotined for wanting to slow the Terror.
  *   **1794 (Thermidor):** Robespierre and St. Just are guillotined by the very machine they built.

  **The Evidence:** Look at the *charges*. They rarely changed ("conspiracy against liberty"), but the *definition* of conspiracy expanded until it included anyone who questioned the efficiency of the Committee. The mechanism is visible in the **Law of Suspects (1793)**, which legally codified that "being a patriot" was defined by the government, not by action.

  ### Part 3: Application to Your Group

  You are in a small left group. You have already had expulsions. You fear you are next. You are reading history to find a lever to pull.

  **Here is the hard truth:** Knowing the historiography will not save you, but understanding the *mechanism* might help you assess your danger.

  The "Devouring" dynamic requires three fuel sources. Check your group for them:

  1.  **Is there a Siege?**
      *   *France:* Foreign armies at the border.
      *   *Your Group:* Is there a genuine external threat (state infiltration, violent fascists), or is the threat manufactured/internal (rival left groups, "cancelation," loss of status)? If the threat is vague or internal, the "Security Dilemma" is likely a pretext for consolidation of power.
  2.  **Is Virtue Monopolized?**
      *   *France:* "Public Virtue" was the only metric of safety.
      *   *Your Group:* Is disagreement on tactics treated as a deviation in line, or a moral failing? If someone says "this strategy won't work," are they heard as a critic or accused of being a "cop" or "class traitor"?
  3.  **Are Emergency Powers Normalized?**
      *   *France:* The Terror was meant to be temporary "until peace." It became the government.
      *   *Your Group:* Have normal democratic norms (voting, transparency, right to reply) been suspended for "urgency" or "security"?

  **What counts as progress for you?**
  You asked for a distinction, a piece of evidence, or an argument to stop looking.

  *   **The Distinction:** Distinguish between **Purging** (removing people who actively undermine the organization, e.g., informants, violent actors) and **Purity Spiraling** (removing people to signal ideological intensity). The former protects the group; the latter consumes it.
  *   **The Evidence:** Look at the *previous two expulsions*. Were they for concrete actions (breaching security, financial malfeasance) or for political deviations/heresies? If it was the latter, the mechanism is active.
  *   **The Argument to Stop Looking:** The French Revolution historiography will not give you a verdict on your group because **history is not a court of appeal.** Furet says "Revolution leads to Terror." Marxists say "Terror was a tragic necessity of war." Neither answer tells you if *your* specific comrades are about to expel you.

  **Recommendation:**
  If the mechanism is active (Siege + Moral Monopoly + Emergency Powers), **the historical analogy is not a warning; it is a map.** In 1793, once the Law of Suspects was passed, being "innocent" was no longer a defense. The only safety was having more power than your accusers or leaving the jurisdiction.

  If you feel the ratchet clicking—if dissent is being framed as betrayal, if procedures are being bypassed for "urgency," if the definition of loyalty is narrowing—do not wait for the historiographical debate to settle. The "Devouring" is not a fate written in the stars, but it is a very common organizational failure mode in high-stakes, low-power political groups.

  The most revolutionary act in 1794, for many, was surviving Thermidor. Sometimes that meant keeping your head down; sometimes it meant walking away from the Committee before the gendarmes arrived.
