      *   **User Profile:** Member of a small left political group currently experiencing intense internal conflict (expulsions, fear of being next). They are using the French Revolution as an analogy (1792, the Terror, "revolution devours its children").
      *   **Intellectual Level:** High. They are familiar with historiographical debates (social/class vs. revisionist vs. contingency/cultural). They understand terms like "bourgeois revolution," "feudal reaction," "discourse," "structural relation."
      *   **Core Question 1 (Historiographical):** Why did the debate on the causes/nature of the French Revolution stall? Is it a factual dispute, a category error (different questions), a semantic quarrel, or bedrock politics?
      *   **Core Question 2 (Practical/Personal):** Is the "revolution devours its children" dynamic a real structural mechanism or just a topos/hindsight bias? If real, what evidence supports it, and does the French case fit?
      *   **Goal:** Diagnosis of the historiographical stalemate + actionable insight for their current political situation. They want to know what kind of disagreement this is and what would count as progress.

  2.  **Deconstruct the Historiographical Stalemate (Question 1):**
