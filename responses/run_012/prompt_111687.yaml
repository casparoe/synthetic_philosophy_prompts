      *   *The Revisionist View (Cobban, Furet):* No capitalist bourgeoisie. Revolutionaries were officeholders/lawyers. Politics/Ideology drove it, not economics. Furet emphasizes the "totalitarian drift" of democratic ideology.
      *   *The Synthesis/Contingency View (Doyle, McPhee, etc.):* It was a crisis of the state, exacerbated by war, harvest failures, and contingency.
      *   *Why did it stall?*
          *   **Evidence:** The empirical record is messy. There *was* a bourgeoisie, but were they capitalist in a Marxist sense? There *was* feudalism, but was it the primary brake on development?
          *   **Politics:** The Cold War ended. Marxism lost its hegemonic status in the academy. Furet's *Thinking the French Revolution* (linking 1789 to 1917 to the Gulag) became dominant because it fit the post-Cold War mood.
          *   **Category Error:** The user's hunch is strong. The "Social" side asks about *structural preconditions*. The "Revisionist" side asks about *agency and ideology*. The "Contingency" side asks about *process and triggers*. They talk past each other.
          *   **Verdict:** It's a mix of "different questions" and "bedrock politics." The evidence is downstream of the political stakes (justifying or condemning revolutionary politics itself).

  3.  **Deconstruct the "Devouring" Mechanism (Question 2):**
      *   *Is it real?* Yes, but not as a mystical law. It's a specific dynamic of revolutionary coalitions under stress.
      *   *Mechanism:*
          1.  **Coalition Fragmentation:** Broad coalition wins (1789).
          2.  **External Threat:** War/Counter-revolution (1792).
          3.  **Purity Spiral:** To maintain unity against the threat, internal dissent is framed as treason.
          4.  **Outbidding:** Radicals accuse moderates of being soft. Moderates fall. Then radicals accuse *more* radical people of being "ultra" or hidden enemies.
          5.  **Institutionalization of Suspicion:** Committees of Public Safety, Law of Suspects.
      *   *Evidence:* The trajectory from Girondins -> Hebertists -> Dantonists -> Robespierre/St. Just -> Thermidor. The rhetoric shifts from "defending liberty" to "purifying virtue."
      *   *Relevance to User:* This is the crucial part. They need to know if their group is on this track.

  4.  **Synthesize and Structure the Response:**
