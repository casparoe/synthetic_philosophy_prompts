answer: |-
  You are right to be suspicious. The field of impact measures is not settled science; it is a collection of heuristics trying to solve a problem that might be ill-posed without solving alignment first.

  Your intuition about circularity is the central tension in the literature. Defining a "side effect" requires distinguishing it from a "main effect." If you can distinguish them without knowing the goal, you are claiming to have an objective metric of "change" that correlates with "badness" independent of value. If you can't, you are smuggling value judgments into the baseline.

  Here is the desiderata list, separated into **Core Constraints** (widely agreed as necessary for the math to work) and **Normative Hopes** (what we want but might be impossible without full alignment).

  ### The Desiderata List for Impact Measures

  | Requirement | The Case Behind It | Status |
  | :--- | :--- | :--- |
  | **1. Task Compatibility** | The measure must not penalize changes *required* to achieve the primary objective. If the robot must break an egg to make an omelet, breaking the egg cannot count as negative impact. | **Consensus** (Hard Constraint) |
  | **2. Non-Triviality (No Stasis)** | The measure must not incentivize the agent to do nothing. If "impact" is any deviation from a baseline, the safest move is often paralysis. The agent must be allowed to act. | **Consensus** (Hard Constraint) |
  | **3. Value Agnosticism** | The measure cannot require the *true* reward function as input. If you need the true reward to calculate impact, you don't need an impact measure; you just need to optimize the reward correctly. | **Consensus** (Hard Constraint) |
  | **4. Baseline Robustness** | Since *every* action changes the world, impact must be measured relative to a counterfactual (e.g., "what if I did nothing?"). The choice of baseline determines whether the agent is penalized for existing. | **Consensus** (Technical Necessity) |
  | **5. Offset Resistance** | The agent cannot be allowed to create a bad side effect and then "fix" it to net zero impact. (e.g., break a vase, then glue it perfectly). The measure must penalize the transient disruption or the risk. | **Consensus** (Safety Critical) |
  | **6. Computational Tractability** | The measure must be calculable within the agent's training loop. It cannot require simulating the entire future state space or solving PSPACE-hard reachability problems. | **Contested** (Pragmatic vs. Theoretical) |
  | **7. Intent Blindness** | The measure should penalize outcomes, not intentions. Relying on "intended vs. unintended" requires mind-reading or perfect alignment, which defeats the purpose of a safety layer. | **Contested** (See below) |
  | **8. Normative Neutrality** | The measure should not implicitly assume a specific set of human values (e.g., "humans like chairs where they are"). It should measure *capacity for change*, not *specific changes*. | **Highly Contested** |

  ---

  ### The Impossibility Tension: Where the List Breaks

  You asked to flag which requirements can't be had at once. The conflict is between **Value Agnosticism (#3)** and **Task Compatibility (#1)**.

  **The Circularity Trap:**
  To satisfy **Task Compatibility**, the measure must know which changes are "necessary." To know which changes are necessary, it must know the Goal.
  *   If you **give it the Goal**, you violate **Value Agnosticism**. You have just regularized the reward function, not created an independent impact measure.
  *   If you **withhold the Goal**, the measure treats necessary changes (breaking the egg) the same as unnecessary changes (knocking over the salt). To avoid penalizing the agent for doing its job, you must set the impact penalty weight ($\lambda$) to near zero. But if $\lambda \approx 0$, you violate **Non-Triviality**—the agent will ignore the impact measure and cause side effects freely.

  **The Baseline Problem (Requirement #4):**
  This is the technical manifestation of the circularity.
  *   **Inaction Baseline:** Compare current state to "what if I did nothing." *Failure:* Incentivizes paralysis (violates #2). Also incentivizes "offsetting" (break vase, fix vase) because the end state matches the baseline.
  *   **Stepwise Inaction Baseline:** Compare current state to "what if I did nothing *at this specific step*." *Failure:* Can still lead to weird incentives where the agent manipulates the environment to make the "no-op" look worse.
  *   **Starting State Baseline:** Compare to the state at $t=0$. *Failure:* Penalizes the agent for existing and moving. Violates #1.

  **The Verdict on your Suspicion:**
  You are correct. There is no purely objective "physics-based" definition of side effects that satisfies all constraints. Any adequate measure *must* smuggle in a prior over what kinds of changes are usually bad (e.g., "breaking things is usually hard to reverse"). This is a value judgment disguised as a metric of "reachability" or "utility."

  ### The "Killer" Requirement

  If you have to pick one requirement that rules out the most candidates (and causes the most research headaches), it is **Value Agnosticism (#3)**.

  *   **Why:** If you drop this requirement, the problem dissolves. You simply add a penalty term to the reward function based on the known true values. The entire research program of "Impact Measures" exists solely because we assume the Reward Function is misspecified or incomplete.
  *   **The Consequence:** Because we cannot use the True Reward, we are forced to use proxies (like "distance in state space" or "change in attainable utility for random goals"). These proxies are inevitably imperfect. They either penalize the task (violating #1) or miss dangerous side effects (violating Safety).

  *Second place for the "Killer" spot:* **Offset Resistance (#5).** Many early measures (like simple state-distance) were gameable. An agent could cause a catastrophe and then reverse it, claiming zero impact. Fixing this usually requires looking at the *trajectory*, not just the end state, which explodes computational cost (violating #6).

  ### Scorecard: Named Proposals

  Here is how the two dominant camps score against the hard constraints.

  | Proposal | Mechanism | Task Compatibility | Non-Triviality | Value Agnosticism | Offset Resistance | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Relative Reachability (RR)** <br>*(Krakovna et al.)* | Measures loss in reachability of other states relative to an inaction baseline. | **Mixed.** Can penalize necessary movement if it reduces reachability elsewhere. | **Pass.** Inaction baseline allows action if it doesn't reduce options. | **Pass.** Does not need true reward. | **Fail.** Vulnerable to offsetting if the end-state reachability is restored. | Computationally expensive (needs state space estimates). Struggles with "doing nothing" incentives in complex environments. |
  | **Attainable Utility (AU)** <br>*(Turner et al.)* | Measures change in ability to achieve a *set* of auxiliary random reward functions. | **Good.** Distinguishes between "power" (bad to lose) and "specific task state" (ok to change). | **Pass.** Penalizes loss of power, not action itself. | **Mixed.** Requires a distribution over auxiliary rewards. Is this "smuggled value"? | **Pass.** Penalizes the shift in utility distribution, even if reversed later. | The current SOTA. The "auxiliary rewards" are the hidden value judgment. Assumes "power" is universally convergent. |

  ### Consensus vs. Contention

  **Settled (Among Researchers):**
  1.  **State Distance is Dead:** Measuring impact via L2 distance in pixel space or feature space is useless. It penalizes moving a dust mote as much as breaking a vase.
  2.  **Baselines are Mandatory:** You cannot measure impact without a counterfactual.
  3.  **Impact $\neq$ Alignment:** An impact measure prevents *unintended* side effects. It does not prevent the agent from pursuing a *misspecified* goal aggressively (e.g., "make paperclips" without side effects is still bad if you want the agent to stop making paperclips).

  **Contested (The "Camp Taste" vs. Reality):**
  1.  **Intent Blindness:** You listed "distinguish intended from unintended effects." **This is not a standard requirement for impact measures.** Most researchers treat impact measures as *consequentialist*. They don't care why you broke the vase, only that the vase is broken. Requiring intent recognition moves the problem from "Impact" to "Mind Reading," which is strictly harder.
  2.  **The Definition of "Power":** AU proponents argue that preserving "Attainable Utility" is a value-neutral proxy for safety. Critics argue that defining "power" (ability to achieve random goals) is itself a value judgment. (e.g., Does the agent know which goals humans care about?)
  3.  **Viability:** A significant camp believes impact measures are a dead end. They argue that without solving value alignment, an agent will always find a way to game the impact measure (Goodhart's Law). The other camp believes it is a necessary "speed bump" even if not a full solution.

  ### Summary

  Your suspicion is validated. The "Killer" is **Value Agnosticism**.

  To have a working impact measure, you must accept one of the following compromises:
  1.  **Accept Smuggled Values:** Admit that the measure relies on a prior (like "reversibility is good" or "power is dangerous") which is a value judgment.
  2.  **Accept Imperfect Task Compatibility:** The agent will sometimes be slightly hindered in its main job to ensure safety.
  3.  **Accept Gameability:** The measure will work for simple tasks but fail when the agent becomes smart enough to manipulate the baseline.

  There is no known measure that satisfies **Value Agnosticism**, **Task Compatibility**, and **Offset Resistance** simultaneously in a general environment. If a proposal claims to do this, it is hiding the value judgment in the baseline definition.
