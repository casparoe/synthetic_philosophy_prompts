      *   *Correction:* The user asked about "Intended vs. Unintended." I need to be clear that most impact measures *ignore* intent. They are consequentialist. Requiring intent recognition changes the problem from "Impact" to "Alignment." I should flag this as a "Camp Taste" vs. "Core Requirement."
      *   *Correction:* On "Usable during training." Impact measures are usually part of the reward function ($R_{total} = R_{task} - \lambda I$). So $R_{task}$ is usually known during RL training, but it might be *misspecified*. The user says "when reward is unknown." This implies inverse RL or unsupervised settings. I need to clarify that impact measures are usually for *known but incomplete* rewards, not *unknown* rewards.
      *   *Correction:* On "Circularity." The Attainable Utility approach claims to break circularity by using a *distribution* over rewards. I need to explain why this might still be "smuggled value."

  10. **Final Polish:** Check tone. Ensure it's direct ("Be straight with me"). Ensure the table is clear. Ensure the "Killer Requirement" is highlighted.

  **(Self-Correction on the "Killer Requirement"):**
  Actually, the biggest hurdle is the **Baseline Problem**. If you pick the wrong baseline, you get inaction incentives or offsetting loopholes. But the *philosophical* killer is the **Value-Agnosticism**. I will focus on the tension between "Don't use the True Reward" and "Don't penalize the Task."

