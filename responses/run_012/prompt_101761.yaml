prompt: |-
  ok, low-impact AI / side-effect avoidance. before i read another proposal for an impact measure i want to know what one would actually have to do to be any good. so write me the desiderata list for "an impact measure" -- what any adequate measure of an agent's side effects has to deliver, with the case behind each requirement.

  the kind of things i mean (you tell me which are real requirements and which are just one camp's taste): it has to not block the agent from doing its actual job; it has to not collapse into "do nothing" or "the safest move is no move"; it has to be computable and not require the true value function as an input; it has to be usable during training when the reward is unknown; it has to survive the fact that *every* action changes the world, so "side effect" needs some baseline; it has to not be gameable by an agent that can manipulate the measure itself; it has to treat effects on the agent and effects on the world consistently; and it probably has to distinguish intended from unintended effects, which already sounds like it needs to know what the agent was supposed to do.

  the part i most want is where you flag which requirements can't all be had at once. my suspicion is the whole thing is circular: calling something a "side effect" presupposes some notion of what the agent was meant to do or what's valuable, and if you've got the full value spec you don't need a separate impact measure, while if you don't, the measure either treats everything as a side effect (paralysis) or smuggles in a baseline that's just a value judgement in disguise. tell me if that's right, and which single requirement does the most to rule candidates out. a couple of the named proposals (the ones about preserving attainable utility, and the ones about keeping options reachable relative to a baseline) can get a short score against the list if that helps, but keep the weight on the criteria, not the scorecard.

  be straight with me about what's settled here vs what's genuinely contested among people who actually work on this -- don't hand me one camp's view dressed up as the consensus, and if the list is itself a contested object, say so. also a table is fine for the requirements, i won't be offended.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Low-impact AI / Side-effect avoidance (Impact Measures).
      *   **Goal:** A desiderata list for "an impact measure" (what makes one *good*).
      *   **Specific Instructions:**
          *   Distinguish between real requirements and "one camp's taste."
          *   Flag incompatibilities (trade-offs, impossibility results).
          *   Address the user's suspicion of circularity (value-laden baselines).
          *   Identify the single requirement that rules out the most candidates.
          *   Briefly score named proposals (Attainable Utility, Reachability) against the list.
          *   Be honest about consensus vs. contention in the field.
          *   Format: Table is okay for requirements.
          *   Tone: Straightforward, technical but accessible, no fluff.

  2.  **Deconstruct the Problem (Impact Measures):**
      *   What is the core problem? We want an AI to achieve a goal ($R$) without changing the world unnecessarily ($I$).
      *   Total Objective: Maximize $R - \lambda I$.
      *   The difficulty lies in defining $I$ (Impact) without referencing $R$ (Reward/Value) too heavily, otherwise, it's redundant. But if we don't reference value, we might penalize necessary changes or fail to penalize bad changes.

  3.  **Drafting the Desiderata (The List):**
      *   *User's suggestions:*
          1.  Not block the job (Utility Preservation).
          2.  Not collapse to "do nothing" (Avoid Stasis/Inaction).
          3.  Computable (No true value function needed).
          4.  Usable during training (Reward unknown).
          5.  Baseline problem (Every action changes the world).
          6.  Non-gameable (Robustness).
          7.  Consistency (Agent vs. World).
          8.  Intended vs. Unintended (Intent recognition).
      *   *Refining & Categorizing:*
          *   **Non-Interference:** Must allow the primary task. (User's #1)
          *   **Non-Triviality:** Must not incentivize inaction. (User's #2)
          *   **Value-Agnosticism:** Must not require the true reward function. (User's #3 & #4)
          *   **Baseline Sensitivity:** Must handle the "doing nothing is also an impact" problem. (User's #5)
          *   **Robustness:** Must not be wireheadable. (User's #6)
          *   **Symmetry:** Effects on self vs. environment. (User's #7)
          *   **Intent Blindness:** (Crucial distinction) Should it care about intent? Most impact measures are *consequentialist* (outcomes only), so "intended vs. unintended" is actually a controversial requirement. I need to flag this.

  4.  **Addressing the "Circularity" Suspicion:**
      *   The user suspects: Defining "side effect" requires knowing "main effect" (value). If you know value, you don't need impact. If you don't, you get paralysis or smuggled values.
      *   *Verdict:* The user is largely right, but there's nuance. The field tries to define impact as "change in *potential* to achieve *any* goal" (Attainable Utility) rather than "change in *specific* goal." This avoids needing the *true* reward but assumes a distribution over *possible* rewards.
      *   *The Trade-off:* You cannot have Value-Agnosticism + Non-Interference + Non-Triviality perfectly simultaneously without assumptions about the goal structure.

  5.  **Identifying the "Killer" Requirement:**
      *   Which one rules out the most?
      *   **Value-Agnosticism (Computable without True Reward)** is the hardest. If you allow the measure to use the Reward function, the problem dissolves (just regularize the reward). The whole point of impact measures is to work when $R$ is incomplete or misspecified.
      *   Alternatively, **Non-Triviality (No Inaction)** vs. **Safety**. Many early measures (like Relative Reachability) struggled with the "inaction baseline" leading to weird incentives.
      *   *Decision:* The "Value-Agnosticism / No True Reward" constraint is the primary driver of complexity. But the "Baseline Specification" is the technical bottleneck. Let's frame the "Killer" as the tension between **Value-Agnosticism** and **Task-Compatibility**.

  6.  **Evaluating Named Proposals:**
      *   **Relative Reachability (RR):** (Krakovna et al.) Measures change in reachability of states relative to a baseline.
          *   Pros: Handles inaction baseline better than absolute.
          *   Cons: Computationally heavy (needs state space), can penalize necessary movement.
      *   **Attainable Utility (AU):** (Turner et al.) Measures change in ability to achieve a set of auxiliary rewards.
          *   Pros: Captures "power," handles offsetting better.
          *   Cons: Needs a set of auxiliary rewards (is this "smuggled value"?), computationally expensive.
      *   **Future Tasks / Stepwise Inaction:** Variants trying to fix baselines.

  7.  **Consensus vs. Contention:**
      *   *Settled:* We need a baseline. "Do nothing" is not a safe default. Pure state-distance (L2 norm) is bad.
      *   *Contested:* What is the baseline? (Inaction, Stepwise Inaction, Starting State). What is the metric? (State features, Reachability, Attainable Utility). Is "impact" objective or inherently normative?
      *   *Big Contention:* Whether impact measures are a stopgap or a fundamental solution to alignment. (Many argue impact measures don't solve alignment, just mitigate side effects).

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's suspicion (it's well-founded).
      *   **The Desiderata Table:** Columns: Requirement, Rationale, Status (Consensus/Contested).
      *   **The Impossibility/Tension:** Explain the "Value-Laden Baseline" problem.
      *   **The "Killer" Constraint:** Identify Value-Agnosticism.
      *   **Proposal Scorecard:** Briefly rate RR and AU.
      *   **Conclusion:** Summary of the state of the field.

