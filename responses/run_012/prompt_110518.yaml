      *   *Nuance:* It's not *just* ontology. It's also about *explanatory goals*. One side wants to explain the *signal* (nociception), the other wants to explain the *suffering* (pain as a motivator).
      *   *The "Word" Issue:* The word "pain" is doing heavy lifting. It's a "cluster concept." Camp A treats it as a sensory-discriminative cluster. Camp B treats it as an affective-motivational cluster.
      *   *The Empirical Issue:* There *is* a hidden empirical question: Is the affective component truly absent, or just disconnected from action/attention? (The "would if they attended" argument).

  3.  **Drafting the Diagnosis (Step-by-Step):**

