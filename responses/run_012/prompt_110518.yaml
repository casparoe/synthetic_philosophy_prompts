      *   **Deconstructing the Sides:**
          *   *Camp A (Dissociationists):* Individuate by *sensory phenomenology* + *neural input*. If the qualia of "burning/stinging" is there, it's pain. Badness is a downstream consequence.
          *   *Camp B (Essentialists/Imperativists):* Individuate by *functional role* + *affective phenomenology*. Pain is essentially a command ("Stop this!"). No command, no pain.
