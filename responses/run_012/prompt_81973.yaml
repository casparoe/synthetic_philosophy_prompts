prompt: |-
  I'm a journalist who covers science and ideas for a general-interest mag — I did a CS degree and spent a few years writing about distributed systems before I moved to the bioethics beat, so my head is still full of failure detectors, quorums, split-brain, liveness vs safety, heartbeats and timeouts, fencing tokens, at-least-once vs exactly-once, leader election, and the whole business of deciding when a node is really gone. I'm working on a long feature about the definition of death, and the more I read the more I can't shake the feeling that the whole brain-death-vs-circulatory-death fight is something I already know how to think about, just wearing a lab coat. So here's what I want from you: take the circulatory position (death = irreversible cessation of circulatory and respiratory function) and the whole-brain position (death = irreversible cessation of function in the brain including the brainstem), and restate each of them, as faithfully as you can, in the vocabulary I actually use — failure detection, liveness and safety properties, false positives and false negatives, quorum, split-brain, recovery vs permanent failure, at-least-once vs exactly-once, and so on. Restate them one at a time, then give me the residue report, which is the part I actually care about: which claims cross over cleanly (I have a hunch that "irreversible" is doing the work of a timeout, and that the brainstem is basically the quorum, and that a locked-in patient is a partitioned node somebody's about to fence off, but tell me where I'm right and where I'm just pattern-matching), which ones only survive with distortion, and which have no counterpart in my vocabulary at all — I'm especially suspicious about anything having to do with the fact that the thing being declared dead is a person with interests rather than a stateless replica, and about whether "irreversibility" is a fact about the world or a policy choice we made about how long to wait.

  Then tell me what the residue means. Is it that my vocabulary is missing something — it's purely operational and descriptive, it can tell you when to fail over but it has no way to say why any of it matters — or is it that the philosophical disagreement is less substantive than the people having it think, and it's really just a design choice about which false positive vs false negative you're willing to eat, dressed up as a question about the nature of death? I go back and forth on this and I want somebody to actually land somewhere rather than give me the even-handed tour.

  One more thing: don't hedge. Take a definite position on which restatement is more faithful to its original and on whether the residue is a defect in my framework or a deflation of theirs, and give me your reasons even if they're contestable. I was arguing about this with a friend who's an anesthesiologist and she thinks I'm being reductive, so I'd like some ammo or a good reason to drop it. Keep the whole thing under 800 words, please — one page, no more, and skip the throat-clearing intro.
