prompt: |-
  I'm in my third year and taking a course on rationality and choice -- decision theory plus some philosophy of action -- and I'm trying to write the framing section of a paper on diachronic rationality, i.e. rationality for agents that persist over time. Before I start comparing anybody's theory I want the spec first: what does any adequate theory in this area actually have to deliver? So if you'd act as an expert on decision theory and practical rationality and start by brainstorming the candidate requirements before you commit to a list, I'd appreciate it. Then give me the list: the cases the theory has to get right, the distinctions it can't just collapse, and the results from the rest of decision theory it can't contradict -- with the consideration behind each one, and a verdict on which are non-negotiable and which are really just commitments of one camp.

  Some of what's making me confused, so you know where I'm coming from. The standard move is the money pump: someone whose preferences go in a circle (she'll pay a little to swap A for B, a little to swap B for C, a little to swap C back to A) gets bled dry by a patient trader, and that's supposed to prove the cycle is irrational. But I keep noticing the pump seems to trade on two different things at once -- the structure of her preferences (the cycle) and the fact that she'll keep trading and can't commit -- and I'm not sure which one is doing the work. And then there's the case where she doesn't reverse any preference, she just changes her mind for good reason (she learns something), and a trader who anticipated the change can pump her anyway; surely that's not a proof that learning is irrational. So I want the requirements list to force a clean answer about what a pump is evidence of and what it isn't. Related: the "resolute" move, where the agent decides in advance to stop trading and then sticks to it -- does a theory have to count that as rational, or as a kind of cheating? And the addict/Odysseus cases, where the agent's own future preferences are the threat, and the old puzzle about whether a preference reversal is irrational or just a change of tastes the theory has no business policing. I also care a lot about the distinction between a requirement on the agent's preference set at a time and a requirement on her decision procedure over time -- I suspect a good chunk of the disagreement in this literature is people quietly answering different questions, and I want the list to keep those apart.

  One thing I'd find really useful: flag any pair of requirements I can't have together. My gut says the demand that the theory return a determinate verdict in every case, the demand that it not require more of agents than bounded, forgetful, tempted humans can actually do, and the demand that it count at least some preference changes as rational are definately not all going to fit at once -- if that's right, tell me which one has to go and what that does to the surviving theories. And tell me which single requirement rules out the most otherwise-popular theories; that's the bit I most want for the paper. Please be careful and explicit about separating what's settled among people who work on this from what's genuinely contested -- I don't want a contested reading served up as the consensus. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year undergraduate (likely Philosophy, Economics, or PPE) taking a course on Rationality and Choice.
      *   **Task:** Write the "framing section" of a paper on diachronic rationality. Needs a "spec" (specification/requirements list) for what an adequate theory must deliver *before* comparing specific theories.
      *   **Role:** Expert in decision theory and practical rationality.
      *   **Method:** Brainstorm candidate requirements first, *then* commit to a list.
      *   **Key Content:** Cases to get right, distinctions to maintain, consistency with standard decision theory results.
      *   **Specific Confusions/Interests:** Money pumps (structure vs. dynamic inconsistency), learning vs. preference change, resolute choice (cheating vs. rational), addiction/Odysseus cases, preference set vs. decision procedure.
      *   **Crucial Constraint:** Flag incompatibilities (trilemmas), identify non-negotiable vs. contested requirements, identify the "theory-killer" requirement.
      *   **Tone:** Careful, explicit about consensus vs. contestation, academic but accessible.

  2.  **Initial Brainstorming (Mental Sandbox):**
      *   *What is diachronic rationality?* It's about being rational over time, not just at a snapshot.
      *   *Core Problem:* Dynamic Inconsistency (Strotz, Ainslie, Elster). Plans made at $t_1$ are abandoned at $t_2$.
      *   *Money Pumps:* The classic argument for transitivity. But as the user notes, it relies on exploitation + lack of commitment. Is the irrationality the cycle or the exploitability? (Ahmed, Mahtani).
      *   *Resolute Choice:* McClennen vs. Hammond. If I pre-commit, am I rational? Or am I ignoring my current preferences?
      *   *Preference Change:* Tastes change (Ulysses & Sirens) vs. Learning (Bayesian update). A theory shouldn't forbid learning.
      *   *Separation:* Static constraints (preferences at $t$) vs. Dynamic constraints (policies over time).
      *   *Feasibility:* Ought implies can. Bounded rationality.
      *   *Normativity:* Is rationality about success (getting what you want) or coherence (internal consistency)?

  3.  **Drafting the Brainstorming Section:**
      *   Need to show the work before the final list.
      *   *Candidate 1: No Exploitability.* (Money pump immunity).
      *   *Candidate 2: Dynamic Consistency.* (Plan at $t_1$ matches action at $t_2$).
      *   *Candidate 3: Separability.* (Choices depend only on future nodes, not past sunk costs).
      *   *Candidate 4: Respect for Preference Change.* (Don't call taste changes irrational).
      *   *Candidate 5: Feasibility/Psychological Realism.* (Agents can actually do this).
      *   *Candidate 6: Determinacy.* (Theory gives an answer).
      *   *Candidate 7: Separation of Static/Dynamic.* (Don't conflate preference order with choice function).

  4.  **Developing the "Spec" (The List):**
      *   Now, refine these into a rigorous list.
      *   *Requirement 1: The Exploitability Constraint.* (But nuanced: must distinguish bad cycles from learning).
      *   *Requirement 2: The Dynamic Consistency Constraint.* (Plans must be executable).
      *   *Requirement 3: The Diachronic Neutrality Constraint.* (Distinguish taste change from irrationality).
      *   *Requirement 4: The Procedural/Structural Distinction.* (Preferences vs. Policies).
      *   *Requirement 5: Feasibility.* (Ought implies can).

  5.  **Addressing the Incompatibilities (The Trilemma):**
      *   The user suspects a clash between Determinacy, Feasibility, and Allowing Preference Change.
      *   *Actually, the bigger clash in the literature is:* **Dynamic Consistency vs. Separability vs. Consequentialism.** (Hammond's result).
      *   *Wait, let's look at the user's specific intuition:* "Determinacy + Feasibility + Rational Preference Change."
      *   *Standard Trilemma:* **Dynamic Consistency** (stick to plan) vs. **Separability** (ignore sunk costs) vs. **Opportunity Set Independence** (Hammond).
      *   *Better Trilemma for this context:* **Resolute Choice** vs. **Sophisticated Choice** vs. **Myopic Choice**.
      *   *Let's focus on the "Theory Killer":* **Dynamic Consistency.** If you demand an agent *must* be dynamically consistent in all cases, you rule out sophisticated choice (which anticipates inconsistency) and resolute choice (which forces consistency). Actually, Dynamic Consistency is often the *goal*, not the constraint.
      *   *The real killer:* **The Separability Principle.** If you demand Separability (choices depend only on the future subtree), you rule out Resolute Choice. If you allow Resolute Choice, you violate Separability.
      *   *Another Killer:* **No Exploitability (strong version).** If you demand *no* money pump is possible *ever*, you might rule out rational learning or necessary preference changes.
      *   *Let's synthesize:* The most contentious requirement that kills the most theories is **The Separability Principle (or Consequentialism)**. It kills Resolute Choice (McClennen). It kills Sophistication (in a way, because sophistication admits inconsistency).
      *   *Wait, the user asked about Determinacy/Feasibility/Change.* Let's address that specifically. If you demand a determinate verdict for *every* case + Feasibility for bounded agents + Permission for preference change, you run into trouble. But the *literature* standard trilemma is usually **Dynamic Consistency, Separability, and Consequentialism.**
      *   *Decision:* I will present the literature standard (Hammond's trilemma) but also address the user's intuition about Feasibility vs. Ideal Theory.
      *   *The "Single Requirement that Rules Out the Most":* **Strong Dynamic Consistency.** If you require an agent to *never* deviate from a prior plan unless new info arrives, you rule out sophisticated agents (who know they will deviate) and myopic agents. *Correction:* Actually, **Separability** is the one that rules out Resolute Choice. **Dynamic Consistency** is the one that rules out Sophistication (if defined as accepting inconsistency).
      *   *Refinement:* The requirement that kills the most *popular* approaches (specifically Resolute Choice) is **Separability/Consequentialism**. The requirement that kills *Standard CDT/EDT* in diachronic contexts is **Dynamic Consistency** (because they often generate time inconsistency).
      *   *Let's go with:* **The Requirement of Dynamic Consistency.** Why? Because standard expected utility maximizers with hyperbolic discounting fail this. To save them, you need Resolute Choice (violates Separability) or Sophistication (admits inconsistency). So demanding Dynamic Consistency as a *necessary condition of rationality* rules out standard discounting models unless modified.
      *   *Actually, the clearest "Killer" is **Consequentialism/Separability**.* It forces the agent to ignore past plans. This kills Resolute Choice (McClennen). It is widely contested.
      *   *Okay, I need to be precise.* I will identify **The Separability Principle** as the major contested constraint.

  6.  **Addressing the Money Pump Confusion:**
      *   Need to clarify: Money pumps show *exploitability*. Exploitability implies *dynamic inconsistency* + *lack of commitment*.
      *   Requirement: Theory must distinguish between *structural irrationality* (cycles) and *dynamic irrationality* (inconsistency without cycles).
      *   Requirement: Theory must distinguish *preference change* from *inconsistency*.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Validate the confusion (it's a known mess in the literature).
      *   **Phase 1: Brainstorming:** List the raw candidate requirements (Exploitability, Consistency, Feasibility, Neutrality, etc.).
      *   **Phase 2: The Spec (The List):** Formalize the requirements. Distinguish Non-Negotiable vs. Contested.
      *   **Phase 3: Incompatibilities (The Trilemmas):** Address the user's gut feeling and the literature's actual trilemmas.
      *   **Phase 4: The "Theory Killer":** Identify the most restrictive requirement.
      *   **Phase 5: Consensus vs. Contestation:** Explicitly label what is settled (very little) vs. debated (almost everything).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I distinguish Preference Set vs. Decision Procedure? Yes, make that a specific requirement.
      *   *Check:* Did I address the Money Pump/Learning distinction? Yes, under "Diachronic Neutrality."
      *   *Check:* Resolute Choice? Yes, under Separability.
      *   *Check:* User's Trilemma (Determinacy, Feasibility, Change). I should validate this but point to the more technical Hammond/McClennen trilemma.
      *   *Tone Check:* Don't talk down. Treat the user as a junior colleague.
      *   *Key Distinction:* **Ex Ante** vs. **Ex Post** rationality. This is crucial for the framing.

  9.  **Final Polish:**
      *   Ensure the "Verdict" on each requirement is clear (Non-negotiable vs. Camp Commitment).
      *   Make sure the "Theory Killer" is well-justified. (I'll argue **Separability** is the big divider between Resolute and Sophisticated/Myopic camps).
      *   Ensure the Money Pump distinction is clear (Exploitability $\neq$ Irrationality necessarily, unless specific conditions hold).

  10. (Final Review against constraints):
      *   Brainstorm first? Yes.
      *   List with considerations? Yes.
      *   Verdict (Non-negotiable vs. Contested)? Yes.
      *   Flag incompatibilities? Yes.
      *   Identify "Theory Killer"? Yes.
      *   Consensus vs. Contested? Yes.

      *Let's write.*
answer: |-
  This is an exceptionally sharp set of questions. You have identified the exact fault lines where the literature fractures. The confusion you feel regarding money pumps, commitment, and preference change isn't a lack of understanding on your part; it is a reflection of the fact that the "spec" for diachronic rationality is the most contested part of the field. Many papers skip this framing and jump straight to defending a specific model (e.g., Resolute Choice vs. Sophistication), which is why the debate often talks past itself.

  Per your request, I will first brainstorm the candidate requirements as an expert would mentally catalogue them, then commit to a formal specification list, and finally analyze the incompatibilities and "theory killers."

  ### Phase 1: Brainstorming Candidate Requirements

  Before we lock in a spec, we need to see the landscape of possible demands we might place on a theory of diachronic rationality. Here are the raw candidates that float around the literature:

  1.  **The Exploitability Constraint:** A rational agent cannot be made a money pump. (Problem: As you noted, this conflates preference cycles with dynamic inconsistency and lack of commitment technology).
  2.  **The Dynamic Consistency Constraint:** If a plan is optimal at $t_1$, it must still be optimal at $t_2$ when the time comes to execute, absent new information.
  3.  **The Separability Principle:** Choices at a node should depend only on the future subtree, not on how the agent got there (sunk costs/past plans).
  4.  **The Consequentialism Constraint:** Rationality evaluates only the outcomes of actions, not the history of the choice process.
  5.  **The Feasibility Constraint (Ought Implies Can):** The theory cannot demand cognitive powers (perfect memory, infinite computation, pre-commitment technology) that typical agents lack.
  6.  **The Diachronic Neutrality Constraint:** The theory must distinguish between *irrational inconsistency* (akrasia) and *rational preference change* (learning/growth).
  7.  **The Ex Ante/Ex Post Alignment:** The theory must specify whether rationality is judged from the perspective of the planner ($t_1$) or the doer ($t_2$).
  8.  **The Determinacy Constraint:** The theory must yield a unique verdict (Permitted/Required/Forbidden) for every decision problem.

  ### Phase 2: The Specification List

  Here is the committed list for your framing section. I have categorized these by their status in the literature.

  #### 1. The Distinction Requirement (Non-Negotiable)
  **Specification:** The theory must explicitly distinguish between constraints on the **Preference Set** (static ordering of outcomes at a time) and constraints on the **Choice Function** (dynamic policy over time).
  *   **Consideration:** This addresses your suspicion that people are answering different questions. Standard Expected Utility Theory (EUT) constrains preferences (transitivity, completeness). Diachronic theory constrains how those preferences map to actions over time. A theory that collapses these (e.g., by saying "if you chose differently, your preferences must have changed") makes preference change unfalsifiable and trivializes dynamic inconsistency.
  *   **Verdict:** **Non-Negotiable.** Any theory that cannot articulate this distinction is conceptually confused.

  #### 2. The Learning Exemption (Non-Negotiable)
  **Specification:** The theory must not classify preference reversals driven by Bayesian updating or new information as irrational.
  *   **Consideration:** This addresses your money pump worry. If a trader pumps an agent because the agent learned $P$ is true between $t_1$ and $t_2$, that is not a failure of rationality. A money pump only demonstrates irrationality if the preferences are held *fixed* (ceteris paribus).
  *   **Verdict:** **Non-Negotiable.** If a theory implies learning is irrational, it is *reductio ad absurdum*.

  #### 3. The Exploitability Nuance (Contested)
  **Specification:** The theory must specify whether immunity to money pumps is a *constitutive* requirement of rationality or merely *evidence* of it.
  *   **Consideration:** You noted the pump trades on structure + lack of commitment. If an agent has cyclical preferences but can pre-commit, they aren't pumped. Is the cycle irrational even if unexploited? (Ahmed vs. Mahtani debate).
  *   **Verdict:** **Contested.** "Instrumentalists" say exploitability is the only proof of irrationality. "Coherentists" say the cycle itself is the defect, regardless of exploitation. Your paper should state which horn it takes, but note that this is not settled.

  #### 4. The Separability Principle (Contested / Camp Commitment)
  **Specification:** The theory must take a stance on whether past plans constrain current choice. Specifically: At $t_2$, is the agent permitted to ignore the plan made at $t_1$ if the plan no longer maximizes current utility?
  *   **Consideration:** This is the heart of the Resolute Choice (McClennen) vs. Sophisticated Choice (Strotz/Ainslie) debate. Resolute Choice says "Stick to the plan" (Violates Separability). Sophistication says "Do what's best now given what you know you'll do later" (Respects Separability).
  *   **Verdict:** **Camp Commitment.** This is the primary divider between theories. You cannot demand this be settled in your framing; you must frame it as the variable your paper investigates.

  #### 5. The Feasibility Constraint (Contested / Idealization)
  **Specification:** The theory must state whether it applies to idealized agents (logical omniscience, perfect willpower) or bounded humans.
  *   **Consideration:** If you demand Dynamic Consistency (stick to the plan) but the agent is weak-willed (akratic), the theory declares them irrational. If you demand Feasibility, you might have to lower the bar for what counts as rational.
  *   **Verdict:** **Contested.** Most formal decision theory assumes idealization. Philosophy of action often demands feasibility. Your framing should clarify which target you are aiming at.

  #### 6. The Ex Ante Priority Rule (Contested)
  **Specification:** When $t_1$ preferences and $t_2$ preferences conflict (and no new info exists), whose preferences determine the rational verdict?
  *   **Consideration:** In Odysseus cases, $t_1$ Odysseus wants to hear the song but survive. $t_2$ Odysseus wants to steer into the rocks. If rationality is time-neutral, who wins?
  *   **Verdict:** **Contested.** Some theories privilege the "planning self" (Ex Ante); others privilege the "acting self" (Ex Post).

  ---

  ### Phase 3: Incompatibilities and Trilemmas

  You asked to flag pairs (or triples) of requirements that cannot be held together. Your gut was right: there is a fundamental trilemma here.

  #### The "Hammond-McClennen" Trilemma
  In the technical literature, there is a well-known impossibility result. You cannot simultaneously hold the following three:
  1.  **Dynamic Consistency:** Plans made at $t_1$ are carried out at $t_2$.
  2.  **Separability:** Choices at $t_2$ depend only on the future, not the past plan.
  3.  **Consequentialism/Opportunity Set Independence:** Rational choice depends only on the available outcomes, not the menu structure.

  **The Verdict:** You must drop one.
  *   Drop **Dynamic Consistency**? You get **Sophisticated Choice** (Standard Economics/Game Theory). You admit agents will be dynamically inconsistent and treat it as a constraint to be managed, not a violation to be cured.
  *   Drop **Separability**? You get **Resolute Choice** (McClennen). You allow the past plan to constrain the current choice.
  *   Drop **Consequentialism**? You get **Myopic Choice** or specific rule-based deontologies.

  #### Your Intuition Trilemma: Determinacy, Feasibility, Change
  You suspected a clash between:
  1.  **Determinacy:** A verdict for every case.
  2.  **Feasibility:** Bounded humans can do it.
  3.  **Rational Preference Change:** Some reversals are allowed.

  **Analysis:** This is less a formal impossibility and more a tension between **Ideal Theory** and **Non-Ideal Theory**.
  *   If you demand **Determinacy** and **Feasibility**, you often lose the ability to condemn **Preference Change** robustly. Why? Because if a human *does* change their mind, and "ought implies can," the theory must accommodate it as rational (or at least not irrational).
  *   If you want to condemn certain preference changes (e.g., addiction) as irrational, you usually have to posit an **Idealized Agent** (dropping Feasibility) or accept **Indeterminacy** (the theory says "this is a breakdown of rationality" rather than "this is the rational choice").

  **Which one has to go?**
  For a standard decision theory paper, **Feasibility** is usually the one that gets dropped. Standard decision theory is normative/idealized. It tells you what you *should* do, even if you are psychologically incapable of it. If you keep Feasibility, you move from Decision Theory to Psychology/Behavioral Economics.
  *   **Recommendation:** For your paper, explicitly state you are working in **Ideal Theory**. Drop strict Feasibility. This allows you to keep Determinacy and the ability to judge Preference Change.

  ---

  ### Phase 4: The "Theory Killer"

  You asked for the single requirement that rules out the most otherwise-popular theories.

  **The Winner: The Separability Principle.**

  **Why?**
  1.  **It kills Resolute Choice:** If you insist that an agent at $t_2$ must only look at the future consequences (Separability), you logically cannot allow them to stick to a plan *just because* it was the plan. This eliminates McClennen's Resolute Choice, which is the main rival to standard theory in this space.
  2.  **It kills Pre-Commitment as a Rational Requirement:** If Separability holds, pre-commitment is merely a technological fix, not a requirement of rationality itself.
  3.  **It forces Sophistication:** If you accept Separability + Dynamic Consistency, you are forced into the "Sophisticated" model where agents anticipate their own future irrationality and restrict their own choice sets.

  **The Runner Up: Strong Dynamic Consistency.**
  If you demand that a rational agent *must* be dynamically consistent (never deviate from a prior optimal plan without new info), you rule out **Standard Discounting Models** (Hyperbolic Discounting). Since hyperbolic discounting is the standard model for addiction and procrastination, demanding Strong Dynamic Consistency as a *precondition* for rationality effectively says "Addicts are inherently irrational agents outside the scope of this theory." This is too strong for a general theory.

  **Recommendation for your paper:** Treat **Separability** as the critical variable. Frame your paper as investigating whether Separability is a necessary condition for diachronic rationality. This allows you to contrast Resolute Choice (No) vs. Sophistication (Yes).

  ---

  ### Phase 5: Consensus vs. Contestation (Crucial for your Framing)

  To ensure you don't present contested readings as consensus, use this guide in your text:

  | Requirement | Status | Notes for your Paper |
  | :--- | :--- | :--- |
  | **Transitivity (Static)** | **Consensus** | Almost everyone agrees static preferences must be transitive. |
  | **Learning Exemption** | **Consensus** | Everyone agrees updating on evidence isn't irrational. |
  | **Preference/Procedure Distinction** | **Consensus** | Everyone agrees these are conceptually distinct, even if linked. |
  | **Exploitability = Irrationality** | **Contested** | Some say exploitability proves irrationality; others say it's just a symptom. |
  | **Separability Principle** | **Highly Contested** | This is the main battleground (McClennen vs. Hammond). |
  | **Dynamic Consistency** | **Contested** | Is it a *requirement* of rationality or a *property* some rational agents lack? |
  | **Ex Ante vs. Ex Post Priority** | **Contested** | No consensus on which "self" gets to vote. |

  ### Summary Advice for the Framing Section

  1.  **Open with the Distinction:** Start by enforcing the **Preference vs. Procedure** distinction. This clears the fog immediately.
  2.  **Define the Target:** State that you are doing **Ideal Theory** (sacrificing Feasibility for Determinacy). This avoids the "humans can't do this" objection later.
  3.  **The Money Pump Clarification:** Explicitly state that money pumps are evidence of **Dynamic Inconsistency + Lack of Commitment**, not just preference cycles. Use the **Learning Exemption** to firewall off cases of rational updating.
  4.  **The Pivot:** Identify **Separability** as the key contested constraint. State that your paper will evaluate theories based on whether they accept or reject Separability.
  5.  **The Verdict:** Conclude the framing by noting that accepting Separability forces one into the "Sophisticated" camp, while rejecting it opens the door to "Resolute Choice."

  This structure shows you understand the meta-debate, allows you to be precise about what counts as a "success" for a theory, and positions you to critique the theories rather than just describe them.
