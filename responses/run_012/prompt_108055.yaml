answer: |-
  You have put your finger on the most stubborn knot in contemporary autonomy theory. The standard taxonomy breaks down exactly where you say it does.

  In the literature, **manipulation** is typically defined as influence that bypasses or subverts the target's rational capacities (lying, pressure, exploiting bias). **Persuasion** is influence that engages those capacities through reasons. **Nudging** (Thaler/Sunstein) is influence that alters the choice architecture to predictably change behavior without forbidding options, often relying on heuristics.

  Your cases don't fit cleanly because they engage rational capacities *through* the architecture of the choice, not around them. You reasoned correctly; you just reasoned on a terrain that was landscaped by someone else.

  There is no single, universally agreed-upon term for this specific niche, but the carving you are looking for exists at the intersection of **Procedural Autonomy** and **Choice Architecture**. If we need a label for your seminar, the most precise coinage is **Deliberative Steering**.

  Here is the carving you asked for.

  ### 1. The Mechanism: Management of the Deliberative Field
  Standard persuasion operates on the *content* of reasons (e.g., "Candidate A is better because X"). Standard manipulation operates on the *psychology* of the agent (e.g., "You'll feel bad if you don't pick A").

  **Deliberative Steering** operates on the *structure* of the deliberation itself. It controls:
  *   **Sequence:** Which option is considered first (anchoring the baseline).
  *   **Salience:** Which facts are foregrounded and which are backgrounded.
  *   **Omission:** Which valid counter-considerations remain in the drawer.
  *   **Timing:** When the question is asked relative to fatigue or momentum.

  Crucially, as you noted, this does not bypass reasoning. It *feeds* reasoning. It gives the rational mind true premises and valid logic, but it constructs the syllogism.

  ### 2. The Normative Bite: Substantive vs. Procedural Autonomy
  This is where the "feeling handled" comes from. Autonomy has two components:
  *   **Substantive Autonomy:** Did I arrive at a conclusion I endorse? (In your cases: **Yes**).
  *   **Procedural Autonomy:** Did I own the *process* by which I arrived there? (In your cases: **No**).

  When your colleague steered you, your substantive autonomy was preserved (you picked the better candidate), but your procedural autonomy was compromised. You were treated as a **processor** of information rather than a **partner** in inquiry. The "handling" feeling is the phenomenological recognition of **alienation from the process**. You recognize that the *path* to the decision was not yours, even if the *destination* was.

  ### 3. The Boundary: Telos and Transparency
  You asked where the line is between this and ordinary teaching or therapy. If all influence involves selection, why is the therapist permissible and the colleague suspect? The difference lies in two variables: **Shared Telos** and **Transparency of Structure**.

  **A. Shared Telos (The Goal)**
  *   **Therapist/Teacher:** The influencer and the influenced share a goal regarding the influenced's agency (e.g., "Your mental health," "Your learning"). The steering is in service of *your* capacities. This is **Epistemic Paternalism**. It is justified because the "handler" is acting as a scaffold for your own agency.
  *   **Colleague:** The influencer has a divergent goal (e.g., "My preferred hire"). The steering is in service of *their* outcome. Here, the steering treats your agency as an obstacle to be routed rather than a capacity to be supported.

  **B. Transparency of Structure**
  *   **Permissible Steering:** "I'm going to show you File A first because it sets the baseline for the qualifications we need." (You know the architecture).
  *   **Problematic Steering:** The architecture is hidden. You think you are surveying a neutral field, but you are walking a garden path.

  ### 4. The Coinage: Deliberative Steering
  For your seminar, I suggest using **Deliberative Steering** to distinguish this from Nudging and Manipulation.

  *   **Nudge:** Targets System 1 (heuristics, biases). Often non-rational.
  *   **Manipulation:** Targets System 2 but subverts it (deception, pressure).
  *   **Deliberative Steering:** Targets System 2 *through* the environment. It is rational, but heteronomous.

  ### 5. Boundary Cases for the Seminar
  To help your students feel the boundary, use these contrasts:

  *   **Case 1 (Teaching):** A philosophy professor assigns readings in a specific order to lead students to a specific conclusion.
      *   *Verdict:* **Permissible Steering.** Shared telos (learning), institutional role implies structural control.
      *   *Boundary Crossed:* If the professor hides counter-arguments that are standard in the field, it becomes **Dogmatism/Indoctrination**.

  *   **Case 2 (Therapy):** A therapist waits three weeks to interpret a dream because the client isn't ready to hear it.
      *   *Verdict:* **Epistemic Paternalism.** Justified by the therapeutic alliance and the goal of client agency.
      *   *Boundary Crossed:* If the therapist times the interpretation to make the client dependent on the therapist, it becomes **Grooming/Exploitation**.

  *   **Case 3 (Politics/Work):** A committee chair puts a controversial vote at the end of a four-hour meeting when everyone is tired.
      *   *Verdict:* **Illegitimate Steering.** Divergent telos (chair's efficiency vs. committee's deliberation), opaque structure.
      *   *Boundary Crossed:* If the chair announces, "We are voting on this last to ensure we've exhausted all other business," it moves toward **Procedural Fairness**.

  ### 6. The Exam Paradox (Self-Steering)
  Your third example (writing your own exams in a specific order) is the key that unlocks the puzzle. This is **Autonomous Steering**.
  *   When *you* set the architecture for *yourself*, it is **Pre-commitment** or **Self-Binding**. It enhances autonomy by protecting your future self from bias or fatigue.
  *   When *another* sets the architecture for *you* without your consent, it is **Deliberative Steering**.

  ### Summary for the Syllabus
  The phenomenon you are tracking is **influence that preserves substantive rationality while compromising procedural sovereignty.**

  It is not manipulation (no bypassing of reason). It is not persuasion (not just weighing reasons). It is **architectural control over the deliberative environment.**

  The ethical weight depends not on the *outcome* (which can be good), nor the *mechanism* (which is inevitable), but on the **authority to set the terms**. The "feeling handled" is the detection of unauthorized authority over your own mind's workflow.

  **The Line:** Influence becomes problematic when the **structure of deliberation** is controlled by an agent with a **divergent interest**, without **transparency** regarding that control. When those three conditions are met, you have moved from *teaching* to *steering*, even if the student learns the right lesson.
