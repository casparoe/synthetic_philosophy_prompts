answer: |-
  # WORKSHOP PREP SHEET: ESSENTIALIST MIDDLE KNOWLEDGE

  **Core Thesis:** Counterfactuals of Creaturely Freedom (CCFs) are necessary truths grounded in individual essences (dispositional profiles), known via Natural Knowledge. No "third moment," no grounding gap.

  **Strategy:** Defend the essential status of CCFs at all costs. Concede that this limits the range of feasible worlds to buy credibility on the epistemic mechanism.

  ---

  ### 1. The Grounding/Truthmaker Objection (The Commentator)
  **Likelihood:** Certain (Commentator's job).
  **Damage:** Fatal. If this fails, the "one move" collapses.
  **Voice:** "You're leaning on a truthmaker principle that says essences ground CCFs. But on classical theism, essences are either identical to God or created by God. If they're identical to God, you've made God's nature dependent on creaturely behaviors. If they're created, they depend on God's will, which makes the truths contingent, not necessary. You haven't solved the grounding problem; you've just pushed it back to the origin of the essences. What grounds the dispositional profile itself?"

  **Two-Minute Reply:**
  "I'm treating essences as abstract objects that are not created *ex nihilo* but are co-eternal possibilities within the divine intellect, distinct from God's will. The dispositional profile isn't a causal power waiting to be activated; it's a logical structure of what *this* individual is. Just as '2+2=4' is grounded in the nature of numbers without needing a will to decree it, 'Alice would freely choose X' is grounded in the nature of Alice-essence. The truthmaker is the essence itself, which exists in the divine mind as an object of simple intelligence, not as an object of will. This preserves necessity without making God the author of sin or constraining His power, because He retains the veto power to not actualize that essence."

  **Weakest Link:**
  You are flirting with Platonism. If essences are co-eternal and not willed by God, you've posited something independent of God's sovereignty that dictates truth values. The Commentator will press on whether this violates Divine Aseity.

  ### 2. The Freedom/Necessity Objection (The Open Theists)
  **Likelihood:** High.
  **Damage:** High. If CCFs are necessary, libertarian freedom looks like an illusion.
  **Voice:** "You claim to save libertarian freedom, but you've made the counterfactuals necessary truths. If it is *essential* to me that I do X in circumstance C, then in no possible world where I exist in C do I do Y. That's not freedom; that's fatalism. You've made the outcome necessary *de re*. Open Theism says God doesn't know these because they aren't there to know; you say He knows them because they're necessary. But both views imply I couldn't have done otherwise in the only sense that matters for love or moral responsibility."

  **Two-Minute Reply:**
  "There's a distinction between the necessity of the consequence and the necessity of the consequent. It is necessary that *if* I am in C, I do X. But it is not necessary that I am in C. God can choose not to actualize me, or not to place me in C. The freedom lies in the fact that the truth of the counterfactual depends on *my* essence, not on God's causal determination. The disposition is mine, not His. By making it essential, I'm securing the 'could have done otherwise' in the sense that a different essence (a different possible person) would have done otherwise. My freedom is secured because the source of the action is my nature, not divine causation."

  **Weakest Link:**
  This sounds like "Leibnizian Concept Containment." If your essence dictates the action in every world you exist in, you never have the power to do otherwise *in the actual world* once God places you in C. The Open Theists will pounce on the lack of "power to refrain" in the actualized scenario.

  ### 3. The Divine Causality Objection (The Classical Thomist)
  **Likelihood:** High.
  **Damage:** Medium-High. Attacks the coherence of "pre-volitional" knowledge.
  **Voice:** "God knows things because He causes them. *Scit quia facit.* To say God knows what a creature would do *before* He decrees to create it is to suggest there is some reality outside of God's causal act that He must 'look at.' But there is nothing outside God. These 'essences' you speak of are fictions if they have no *esse*. If they have no being, they have no dispositions. You are trying to have knowledge of non-being. Middle knowledge is an attempt to bypass Divine Causality, and your essentialist tweak doesn't fix the metaphysical error."

  **Two-Minute Reply:**
  "I agree God knows all things through His essence. But we must distinguish between God's knowledge of His own power (what He *can* make) and His knowledge of His will (what He *does* make). The dispositional essences are objects of God's power, not His will. They are intelligible contents within the Divine Essence that represent possible imitations of God. God knows them by knowing His own imitability in these specific ways. I'm not saying they exist *extra-mentally* before the decree; I'm saying they exist as intelligible possibilities in the Divine Intellect prior to the act of Will. This preserves Simplicity while allowing for a distinction in the objects known."

  **Weakest Link:**
  The Thomist denies the "prior" distinction in God. They will argue that if the essence is in the Divine Intellect, and the Intellect is God, and God is Simple, then the distinction between Natural and Middle knowledge is merely conceptual, not real, which undermines your claim that CCFs are "real" in a way that guides providence.

  ### 4. The Ockhamist Comparison (The Grad Students)
  **Likelihood:** Medium.
  **Damage:** Low-Medium. Mostly terminological, but can look like you're reinventing the wheel.
  **Voice:** "Ockhamists already say God knows CCFs via His Natural Knowledge because He knows His own power. They say the truth value is contingent but known certainly. You're saying the truth value is necessary. Practically, doesn't this work out the same? If God knows with certainty what you'll do, whether it's necessary or contingent doesn't change the providential setup. Isn't this just Ockhamism with a modal tweak that creates more problems than it solves?"

  **Two-Minute Reply:**
  "It changes the metaphysics significantly. Ockhamism still struggles with the Grounding Objection because if the truth is contingent, it needs a truthmaker that doesn't exist yet (the actual creature). By making it necessary/essential, I remove the need for an *existing* creature to ground the truth. Only the *concept* of the creature is needed. This solves the 'bootstrapping' problem Ockhamists face. It's not just a modal tweak; it's a truthmaker tweak that allows Middle Knowledge to function without requiring the creature to already exist in some sense to make the proposition true."

  **Weakest Link:**
  Grad students will press on whether "possible essences" count as sufficient truthmakers for *contingent* actions. If the action is truly free, why does the essence lock it in? They will argue you haven't gained anything over Ockhamism except a harder determinism.

  ### 5. The Responsibility Objection (The Reformed Compatibilists)
  **Likelihood:** Medium.
  **Damage:** Medium. They won't be convinced, but you don't need them to be.
  **Voice:** "You say this absolves God of responsibility because the dispositions belong to the creature. But God chose to actualize *this* essence knowing exactly what it would do. If He could have actualized a different essence that wouldn't have sinned, and He didn't, He is still the ultimate author of the outcome. You've relocated the problem from 'God decrees the act' to 'God selected the actor,' but the moral responsibility remains on the selector."

  **Two-Minute Reply:**
  "I concede God is responsible for the *world order*, but not for the *moral quality* of the free acts within it. By selecting an essence, God selects the *agent*, but the agent's dispositions are not willed by God; they are constituted by the agent's identity. If I choose a knife knowing it cuts, I'm responsible for the cutting, but not for the sharpness of the steel—that's the nature of the steel. Similarly, God actualizes the person, but the moral output is intrinsic to the person's essence, which God does not fabricate but merely recognizes. This preserves a genuine distinction between permission and decree."

  **Weakest Link:**
  The Reformed folks will argue that if God creates the essence (or selects it from a set He sustains), He is responsible for its dispositions. Your "steel" analogy fails if God forged the steel.

  ---

  ### STRATEGIC CONCESSIONS
  **Concede this up front:** "I am not claiming this system proves God's existence or solves the Problem of Evil entirely. I am claiming it solves the *epistemic* problem of how God knows future free acts without determining them."
  *Why:* This stops the Reformed and Open Theists from trying to kill the whole project based on soteriology or evil. It narrows the debate to metaphysics/epistemology, where your essentialist move is strongest.

  **Concede this if pressed:** "Yes, this implies there are limits on feasible worlds. God cannot actualize a world where a specific essence acts contrary to its profile."
  *Why:* Denying this makes you sound like you believe God can do the logically impossible. Admitting it shows philosophical rigor and aligns with standard Molinist "feasible world" constraints.

  ---

  ### THE ONE OR TWO OBJECTIONS THAT KILL THE PAPER
  1.  **The Grounding/Truthmaker Objection:** If the Commentator convinces the room that "possible essences" cannot ground truths about *free* actions without those essences being willed by God, your "Natural Knowledge" claim evaporates. If the essences are willed, the truths are contingent, and you're back to square one.
  2.  **The Freedom Objection:** If the room agrees that "essential dispositions" entail "no power to refrain in the actual world," your claim to defend libertarian freedom fails. You become a soft determinist.

  ---

  ### THE DREADED QUESTION
  **The Question:** "If these dispositional essences are not created by God's will but are objects of His natural knowledge, are they co-eternal with God? If so, isn't there something about reality (namely, how creatures would act) that is independent of God's sovereignty? And if God *does* create the essences, did He will their dispositions? If He willed their dispositions, aren't the CCFs contingent on His will after all?"

  **Why it's dreaded:** It forces you to choose between Platonism (essences independent of God, threatening Aseity) and Voluntarism (God wills the essences, threatening the necessity of CCFs). It attacks the coherence of the "dispositional essence" at its root.

  **Prepared Answer:** "They are co-eternal as objects of intellect, not as independent substances. They are ideas in the Divine Mind, grounded in God's own nature as imitable. God doesn't 'will' the dispositions; He understands them as necessary implications of the specific way His essence can be participated in by a finite being. This keeps them within God (preserving Aseity) but outside His Will (preserving Necessity)."
