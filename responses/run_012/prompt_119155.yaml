  2.  **Analyze the Searlean Position (Original vs. Derived):**

      *   *Searle's Claim:* Mental states have intrinsic intentionality. Computer states/symbols have only derived intentionality (assigned by users). Biology matters (causal powers of the brain).
      *   *The Two-Bitser:* A vending machine coin detector. State $Q$ means "quarter." If moved to a country with different coins, $Q$ might track something else or nothing. Searle says its meaning is derived from us.
      *   *The Frog:* A frog's fly-detector neuron fires at flies (and BBs). Searle says the frog has original intentionality (biological), even if it makes errors.

  3.  **Brainstorming Defeaters (Potential Counter-Arguments):**

      *   *Evolutionary Continuity:* If humans evolved from non-intentional matter, where does original intentionality kick in? (The Sorites problem).
      *   *Functional Isomorphism:* If a system behaves exactly like a human but is made of silicon (Block's China Brain), does it lack original intentionality? If yes, why? (Chauvinism). If no, then mechanism suffices, undermining Searle's biological naturalism.
      *   *Teleosemantics (Millikan, Papineau):* Meaning is determined by evolutionary history/function, not intrinsic consciousness. If this works for frogs, why not complex artifacts with selected functions?
      *   *The "Wandering Two-Bitser" (Dennett/Indeterminacy):* If the internal state stays the same but the environmental correlation changes, what determines content? If it's just causal covariance, it's derived. If it's function, artifacts can have function.
      *   *Self-Correction/Normativity:* If a system detects its own errors and adjusts to align with a goal without human intervention, does it gain original intentionality?
      *   *Consciousness:* Searle ties original intentionality to consciousness. If we find unconscious original intentionality (e.g., in blindsight or simple organisms), the link breaks. If we find conscious artifacts, the distinction breaks.

  4.  **Sorting by Decisiveness (The User's Key Constraint):**

      *   *Low Decisiveness:* "It feels dualistic." (Philosophical preference). "Computers are getting smarter." (Empirical trend, not ontological proof).
      *   *Medium Decisiveness:* "Functional isomorphism." (Shows mechanism might be enough, but Searle can dig in on biology). "Evolutionary continuity." (Hard to pinpoint, but doesn't prove artifacts *have* it).
      *   *High Decisiveness:* "Conscious Artifacts." (If an artifact is conscious, Searle's biological requirement fails). "Successful Naturalization of Intentionality." (If teleosemantics fully explains human meaning without 'intrinsic' magic, the distinction dissolves). "Normative Autonomy." (If a system generates its own norms independent of designers).

  5.  **Addressing Specific Cases:**

      *   *Wandering Two-Bitser:* Searle can absorb this. The machine's state *never* had intrinsic content. It was always derived. The change in tracking just shows the fragility of derived content. It doesn't prove the frog is the same as the machine.
      *   *Causal History:* If an artifact is evolved (not designed) via a selection process analogous to natural selection, does it gain original intentionality? (Dennett's view). Searle would say no, unless it has biological causal powers.
