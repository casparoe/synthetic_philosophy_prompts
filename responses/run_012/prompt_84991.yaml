  I visited twelve houses with the spirit level in my bag,
  Checking floors for the perfect horizontal line.
  The first had views of mountains but the foundation cracked,
  And I said, I won't sit down until the floor is true.
  Winter came early and the rent doubled on the page,
  My feet grew heavy walking up the endless stairs.
  The tenth had a slant that made the coffee spill,
  And I said, I won't sit down until the floor is steady.
  The twelfth was a basement with a single bulb above,
  The floor dipped toward the drain like a tired mouth.
  I put the key on the table and it stayed where I put it.
  And I said, I won't sit down until the floor is this.
  Then I sat. The chair leg rocked once, then found the wood.
  My bones accepted the tilt as a kind of truth.
  I did not check the level. I did not stand up.
  The dust motes danced in the light that wasn't quite enough.
  The search ended not with a finding, but a closing.
  I stayed.

  ***

  **Note on Theory and Liberties**

  I took a liberty by making the adjustment of the aspiration level a conscious, articulated process ("And I said..."). In Simon's model, this adjustment is often implicit or reactive to environmental feedback rather than a verbalized declaration. I also compressed the timeline; bounded rationality usually unfolds over many decisions, whereas here it collapses into a single search sequence for dramatic effect.

  I am highly confident that the poem captures the *structure* of satisficing: the sequential search, the accumulating costs (winter, heavy feet), and the stopping rule triggered when an option meets the adjusted aspiration. The single bit I am least sure about is the final variation of the refrain ("until the floor is this"). It risks reading as mere resignation rather than a recalibration of the standard itself. The theory demands that the aspiration level slides to meet the option, not that the agent simply ignores the gap; I hope the line "My bones accepted the tilt as a kind of truth" bridges that gap, signaling that the standard itself has moved to accommodate the reality.
