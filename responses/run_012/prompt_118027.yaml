  2.  **Deconstruct the Friend's Thesis:**
      *   *Claim 1:* Popperian = Internalized Skinnerian (Individual learning optimization).
      *   *Claim 2:* Gregorian = Lamarckian Inheritance (Cultural accumulation).
      *   *Claim 3:* Only Gregorian represents a qualitative shift in *kind* of mind; Popperian is quantitative (efficiency).
      *   *Claim 4:* The axis of comparison is "How to stop being Skinnerian?"

  3.  **Deconstruct Dennett's Original Framework (Mental Check):**
      *   Dennett (in *Kinds of Minds* and *Darwin's Dangerous Idea*) presents these as evolutionary layers.
