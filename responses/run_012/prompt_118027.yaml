      *   **Section 3: The Popperian Reduction (Skinnerian + Privacy):**
          *   Friend says Popperian is just Skinnerian with a private space.
          *   Critique: This underestimates the representational requirement. To test in the head, you need an internal model of the world. A Skinnerian creature reacts to stimuli; a Popperian creature manipulates symbols/models of stimuli.
          *   Is it a *kind* change? Yes, because it requires decoupling representation from immediate input. It allows counterfactual reasoning.
          *   Verdict: Friend is too dismissive here. It's not just "cheaper"; it allows for *novel* behaviors that reinforcement history couldn't shape (because the environment hasn't selected them yet).

      *   **Section 4: The Gregorian/Lamarckian Analogy:**
          *   Friend says Gregorian = Lamarckian inheritance.
