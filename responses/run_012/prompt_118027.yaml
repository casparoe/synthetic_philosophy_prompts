      *   *Popperian:* It's about *decoupling*. Skinnerian is coupled to environment. Popperian is decoupled. That's a qualitative shift, not just efficiency.
      *   *Gregorian:* It's about *offloading*.
      *   *Friend's Error:* Treating efficiency as merely quantitative. In complex systems, efficiency thresholds allow new qualitative behaviors.
