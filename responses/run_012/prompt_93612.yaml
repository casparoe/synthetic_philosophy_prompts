answer: |-
  Hi there,

  This is a really sharp observation, and you have put your finger on a tension that has actually generated a fair amount of debate in the philosophy of action and social ontology over the last few decades. You are right to feel that the standard labels like shared intention or joint commitment do not quite stick, because those theories were largely built to explain cases where people explicitly decide to do something together, like signing a contract or agreeing to paint a house together. What you are describing is coordination that emerges without that explicit cognitive handshake, yet it holds together with the same structural integrity as a planned collaboration. The feeling that it is joint but unowned is exactly the puzzle philosophers have been trying to solve when they distinguish between full-blown shared agency and what some call minimal joint action or tacit coordination.

  If we look at the most dominant framework, which comes from Michael Bratman, he argues that shared intention requires that each person intends that we do the thing together, and that this intention is common knowledge between them. In your meal planning case, you have the interlocking intentions, because you intend to cook based on her shopping and she intends to shop based on your cooking, but you lack the common knowledge layer because neither of you would articulate it as a plan. Bratman might argue that this still counts as a form of modest sociality because your intentions mesh and you are mutually responsive, but he would insist there is still a cognitive state of intending the joint activity, even if it is not spoken. Your intuition that nothing either of you could honestly call a shared intention is doing the work suggests that the cognitive glue is thinner than Bratman allows. You are describing a situation where the behavior is coupled but the mental states might just be individual intentions reacting to environmental cues, rather than a collective we-intention.

  On the stricter side, you have Margaret Gilbert's theory of joint commitment, which would likely say this is not joint action at all. For Gilbert, a group acts jointly only if they have formed a pool of wills, essentially agreeing to be bound as a single body. Since you explicitly noted that neither of you ever agreed to this, Gilbert would classify your meal routine and the gym spotting as merely concurrent action. She would say you are two individuals acting in parallel who happen to fit together, rather than a unit acting together. This captures the unowned feeling you described, because there is no normative bond between you, only a causal one. If you stop cooking, she is not violating a commitment to you, she just has to change her behavior. However, this feels too weak for your cases because the dissolution of the routine feels like a breakdown of a system, not just two people changing their minds.

  A better fit for the stability without agreement might be found in David Lewis's work on convention. Lewis describes conventions as regularities in behavior where everyone conforms, everyone expects everyone else to conform, and everyone prefers to conform if the others do. This fits your gym case perfectly. The two men spot each other because it is a regularity, they expect it, and they prefer it conditional on the other doing it. It does not require a promise or a shared plan, only mutual expectation and preference. This explains why it feels lopsided or unowned; it is not a commitment, it is a equilibrium. The term convention captures the fact that it could have been otherwise, but now that it is established, it holds us in place. However, convention usually implies a symmetry that your meal planning case lacks, since one leads and one follows.

  To capture the lopsided and embodied nature of what you are seeing, you might look toward phenomenological accounts of action, particularly the work of Maurice Merleau-Ponty or later Hubert Dreyfus. They talk about operative intentionality, which is a kind of knowing-how that lives in the body rather than the mind. In your cases, the coordination is handled by habit and perception rather than deliberation. You do not need to think we are a team for your bodies to act as a team. This explains why you cannot state the plan; the plan is not in your heads, it is in the routine itself. Some contemporary philosophers call this minimal joint action or interpersonal coordination without shared intention. They argue that mutual responsiveness is enough to count as joint action, even without the heavy cognitive machinery of a we-intention. This validates your sense that it is a joint activity because the actions are functionally interdependent, even if the mental states are individual.

  So to answer your question about whether there is a name, the closest existing concepts are tacit convention or habitual coordination. If you need to distinguish it from full joint action, you might call it interlocking individual intentions stabilized by habit. The line between this and joint action is exactly where you feel the friction: joint action usually implies a normative expectation that the other will do their part because we agreed, whereas your cases rely on a predictive expectation that the other will do their part because they always have. It is joint in effect but individual in origin. You do not necessarily need a new term, but you do need to be precise about whether you are defining joint action by the mental states involved or by the functional outcome. If you define it by outcome, this is joint action. If you define it by mental states, it is coordinated individual action. Most philosophers working on this now would say your cases are real examples of shared agency, just of a minimal or tacit variety that relies on the history of interaction rather than a explicit commitment.

  I hope this helps map the terrain you are looking at. It is a subtle distinction but a vital one for understanding how much of our social life actually works.

  Best regards
