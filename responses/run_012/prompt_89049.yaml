answer: |-
  There is no single established word for this. Your partner is wrong to call it "characterisation"—that is the craft term for the *act* of building, not the ontological term for the *resistance* you feel.

  What you are describing is a collision of three distinct concepts from narratology, philosophy of mind, and systems theory. None of them captures the whole elephant, but together they map the territory.

  Here is the breakdown of the phenomenon, the neighbours that fit best, and where the philosophical muddle actually lies.

  ### 1. The "Arbitrary Choice Becomes Law" Aspect
  **The Concept:** *Path Dependence* (Systems Theory / Economics)
  **The Fit:** High.

  In economics and systems theory, **path dependence** describes how small, often random early events lock a system into a specific trajectory that is difficult to reverse later. The classic example is the QWERTY keyboard layout: it wasn't necessarily the "best" design, but once it was established, the cost of switching became too high.

  When you write Marta cutting her friend off "just because the scene needed to move," that is a contingent, arbitrary choice. But once it is on the page, it becomes part of the system's history. To change it later incurs a high "narrative cost" (rewriting 80 pages, breaking consistency). The trait hardens from a *possibility* into a *constraint*.

  *   **Status:** Settled in systems theory; applied metaphorically to writing.
  *   **Why it fits:** It explains the "output becoming input" loop. The text generates a rule, and that rule constrains future text generation.

  ### 2. The "Useful Fiction" Aspect
  **The Concept:** *The Intentional Stance* (Philosophy of Mind / Daniel Dennett)
  **The Fit:** Very High.

  You mentioned a half-memory about the self being a "useful fiction." You are likely thinking of Daniel Dennett's **Intentional Stance**.

  Dennett argues that when we predict the behavior of a complex system (a human, a chess computer, or a fictional character), we treat it *as if* it has beliefs, desires, and intentions. We don't need to know the physical wiring (or the author's notes); we just need to know that "Marta wants X."

  When you sit there for an hour realizing "she wouldn't do this," you have shifted from the *Design Stance* (I am the author, I decide what happens) to the *Intentional Stance* (I am an observer predicting what Marta would do). The "fact" of her rudeness isn't a physical truth; it is a predictive tool. If you ignore it, your predictions fail, and the simulation breaks.

  *   **Status:** Highly influential in cognitive science, but still debated in philosophy of mind regarding whether it implies *real* intent or just *useful* attribution.
  *   **Why it fits:** It explains why you feel bound by a character you created. You are running a simulation of a mind, and the simulation requires internal consistency to function.

  ### 3. The "Reader Inference" Aspect
  **The Concept:** *Fictional Truth* / *Principles of Generation* (Analytic Aesthetics / Kendall Walton)
  **The Fit:** High.

  Philosophers of art (like David Lewis and Kendall Walton) debate what is "true" in a story. It isn't just what is explicitly stated. If the text says "Sherlock Holmes lives in London," it is also true (by implication) that "Holmes has a liver," even if never mentioned.

  Walton calls the text a **prop** in a game of make-believe. The "principles of generation" are the rules we use to infer unstated truths. One of the strongest principles is **consistency**. If Marta interrupts once, the principle of generation suggests she is the *kind of person* who interrupts. The reader infers the trait because the "game" requires characters to be coherent agents.

  *   **Status:** Contested. There is no agreement on exactly *how* readers determine what is true in a fiction (is it the author's intent? The text alone? Common sense?).
  *   **Why it fits:** It explains why the reader knew what Marta would do in an unwritten situation. They were applying principles of generation to the props you provided.

  ### The Muddle: Where the Disagreement Lives

  You asked where the edges are and what is fought over. The core fight is **Ontological**.

  *   **The Realists (e.g., Amie Thomasson):** Argue that fictional characters are **abstract artifacts**. They come into existence when the author writes them. They have real properties (like "being created by You") and fictional properties (like "being rude"). In this view, Marta *does* exist, but as an abstract object.
  *   **The Anti-Realists (e.g., Peter van Inwagen):** Argue that fictional characters **do not exist**. There is only the text and the readers/Authors pretending. When you say "Marta constrains me," you are speaking loosely; really, *your own desire for consistency* is constraining you.

  **The Verdict:**
  If you want a label that sounds like a "thing," **Reification** is the closest philosophical term (making an abstract concept into a concrete thing). But it carries Marxist baggage.

  If you want a label that describes the *mechanism*, **Path Dependence** is the most accurate description of the "arbitrary becomes necessary" loop.

  If you want a label that describes the *psychological experience*, **The Intentional Stance** is the most accurate description of treating the character as an autonomous agent.

  ### Recommendation for Use

  Since you are a novelist, not a philosopher, you don't need to solve the ontology. You need a working term.

  1.  **Don't use "Characterisation."** That implies you are in full control. You are describing a loss of control.
  2.  **Don't use "Narrative Identity."** That usually refers to how *real* humans construct their own life stories.
  3.  **Consider "Ontological Inertia."** It's not a standard dictionary term, but it is immediately understandable to any thinker. It describes the tendency of a written trait to resist change once established.
  4.  **Or, own the muddle.** Call it **Fictional Truth**. When you say, "It's not Fictional Truth for her to do that," other writers will know exactly what you mean.

  **Summary:**
  The phenomenon is real. The name is not settled.
  *   The **process** is *Path Dependence*.
  *   The **cognitive mechanism** is *The Intentional Stance*.
  *   The **reader effect** is *Fictional Truth*.
  *   The **ontological status** is *Contested*.

  You are experiencing the moment a **contingent signifier** (the sentence you wrote) hardens into a **necessary signified** (the character's nature). It is the moment the map becomes the territory.
