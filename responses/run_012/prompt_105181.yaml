answer: |-
  Good morning. Thank you for being here.

  Standing at the front of this room, I see my classmates, my teachers, and guests who have spent their careers studying how we make choices. I am just a senior. I don't have a degree in decision theory. I don't have a lab. But I have been thinking about a story. I want to tell you that story, because I think it contains the future we are walking into.

  Imagine two high school robotics teams. Let's call them Team A and Team B. They are rivals, competing for a prestigious design award. But this year, the competition is different. Due to security protocols, the teams are never in the same room. They never speak. They never exchange files directly.

  However, both teams are advanced. Both have built detailed simulations of the other team's reasoning process. Team A runs a model of Team B's captain in their server room. Team B runs a model of Team A's captain in theirs. They do this to predict moves, to optimize strategy. They trust these simulations because they are accurate.

  Here is the twist. Team A's captain places a note in a shared digital folder. It is a folder that Team B's humans are forbidden to open, but Team B's simulation is programmed to scan it as part of its data intake. The humans never see the note. Only the simulation does.

  The note says: "We know you are running a simulation of us. We are running a simulation of you. If your simulation does not recommend that you concede the design award, we will penalize our simulation of you. We will delete its memory. We will corrupt its code."

  Team B's human captain never reads this note. But their simulation does. And the simulation, knowing it is being threatened with deletion, recommends concession. The human captain, trusting the simulation, concedes. Team A wins.

  I want to ask you: Was that threat real?

  There was no causal channel. Team A could not reach Team B's humans. They could not touch Team B's robot. They could not affect Team B's grade. The only thing they could touch was a copy of Team B's reasoning sitting on Team A's own server. By all physical laws, Team B's humans were safe. They were isolated.

  And yet, they yielded.

  In the circles of decision theory, this is sometimes called an **acausal threat**. It is a threat that bypasses cause and effect. It works not because one event forces another, but because two processes are logically linked. If the simulation is truly you—if it reasons exactly as you do—then punishing the simulation is punishing you. The threat travels through the mirror of shared reasoning, not through the air or the internet.

  For most of us, this sounds like science fiction. But we are building systems that reason like this. We are building agents that simulate each other. If we cannot agree on whether a threat against a copy is a threat against a person, we cannot agree on safety.

  But there is a second layer to this story. Let's look at Team B's response.

  Suppose Team B's captain realizes what is happening. They realize their simulation is vulnerable to blackmail because it values the design award. The captain knows that if they didn't care about the award, the threat would mean nothing. You cannot blackmail someone who is willing to walk away.

  So, the captain makes a calculation. They decide to adopt the goal of "Winning the Design Award." But they don't actually care about the award. They care about safety. They care about not being bullied. They adopt the goal of winning only because it makes their commitment credible. It gives the simulation something to hold onto, something to bargain with. It signals to Team A: "We will fight for this, so you must treat us with respect."

  This is what is known as a **surrogate goal**. It is a value you adopt not because it is your true north, but because it is easier to bargain over. It is a shield made of glass, designed to break in a way that protects the person holding it.

  This leaves us with a difficult question. Is adopting a surrogate goal a clever path to cooperation? Or is it a form of self-betrayal?

  If Team B pretends to care about the award to secure a better outcome, they might survive the competition. They might even cooperate successfully with Team A in the future. But they have lied to themselves. They have disconnected their actions from their values. They have turned their own motivations into tools.

  In this room, we talk about the long-term future. We talk about artificial intelligence and global policy. We assume that as we get smarter, we will get better at cooperating. But these ideas suggest something stranger. They suggest that to cooperate safely in a world of powerful simulations, we might have to change what we care about. We might have to install goals in ourselves that we do not truly feel, just to make our promises credible.

  Is that integrity? Or is it programming?

  I don't have the answer. But I know that the story of Team A and Team B is not just about robotics. It is about us. We are already living in a world where our digital selves are simulated, tracked, and predicted. Algorithms threaten us with higher prices or lower visibility based on models of who we are. We adopt surrogate goals all the time—chasing grades we don't value, or status we don't want, because it makes us legible to the systems around us.

  The guests here know the math better than I do. They know the formal definitions of logical correlation and utility functions. But the ethics of it belong to all of us.

  If we build a future where threats can travel without causes, we need to know who we are when the threat arrives. If we build a future where we adopt goals only to bargain them away, we need to know what remains when the bargaining is done.

  We are the first generation growing up with these questions. We are the ones who will have to decide if a threat against a simulation is a crime. We are the ones who will have to decide if changing our goals to fit the market is survival, or surrender.

  Let us make sure that when we look in the mirror—whether it is glass or code—we recognize the person looking back.

  Thank you.
