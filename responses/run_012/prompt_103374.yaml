      *   *Realism:* Quine is a physicalist. The *activations* are real (physical states). The *representation* (semantic content) is a matter of how we map those states to the world.
      *   *Deflationism:* "Representation" is a tool in our conceptual scheme. It's real insofar as it's indispensable to our best theory of the network's behavior.

