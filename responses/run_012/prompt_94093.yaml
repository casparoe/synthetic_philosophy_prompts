          *   Is the reasoning based on treating the murderer as a person (Formula of Humanity) or Universalizability (Formula of Universal Law)?
          *   Does the "rule-fetishism/museum piece" conclusion survive correction?
      *   **Constraints:** No bibliography, no reading list. Prose I can act on (suitable for a columnist). Assume knowledge of CI basics (Hypothetical vs. Categorical).
      *   **Tone:** Critical, precise, nuanced, but accessible (for a column writer). Avoid over-correcting into a new caricature.

  2.  **Deconstruct the Podcast Host's Claims:**
      *   Claim A: Kant held lying to be absolutely forbidden, no exceptions, no balancing consequences.
      *   Claim B: The murderer-at-the-door case is Kant's own test case.
      *   Claim C: Kant bites the bullet (tell the murderer where the friend is).
      *   Claim D: Kant prizes rule purity above human life.
      *   Claim E: The murderer has a *right* to the truth.
