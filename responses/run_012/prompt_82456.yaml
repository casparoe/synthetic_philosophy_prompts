prompt: |-
  I'm in high school and I play alot of fighting games, so I basically live in the meta — tier lists, counterpicks, mixups where you have to guess wich option they're going for, "nobody runs that anymore". I've also been reading up on game theory on my own, and there's this method I keep running into where you "solve" a game by repeatedly crossing off strategies a rational player would never pick. The part that trips me up is that sometimes none of the other guy's single options beats one of mine, but a mix of two of his options does, and the mix is what crosses mine off.

  Restate that whole thing — the repeated crossing-off, what exactly counts as "never pick this", and the part where a mix is doing the eliminating — in the vocabulary I actually use for the meta. Be honest about the seams: if the translation only works once I pretend everyone in the lobby is perfectly rational and knows everyone else is too, say so out loud instead of quietly sliding it in.

  Then give me the residue report. Which parts of the game-theory story have no counterpart in how I talk about the meta, and is that my vocabulary being too thin or the theory claiming more than it can cash out? Two things I especially want hit:

  (a) In the theory, is a "mixed strategy" something a player literally rolls dice to pick, or is it just a way of talking about what the other guy can expect — and does my meta talk even have room for that difference?

  (b) I half-remember reading somewhere that once there's three or more players, "everyone is rational and everyone knows it" stops buying you the repeated crossing-off and only gets you the first round. Did I get that right, and if so what does it do to the idea that whatever survives the crossing-off is the solution?
