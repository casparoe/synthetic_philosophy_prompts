answer: |-
  Here is the translation of that game theory logic into lobby talk, followed by the residue report and the answers to your specific questions.

  ### The Translation: "Lobby Logic" vs. "Textbook Logic"

  **The Repeated Crossing-Off (Iterated Elimination)**
  In your meta talk, this is **"teching out the trash."**
  Imagine you're looking at a matchup chart. You start by crossing off moves that are literally unsafe on block with no reward. Nobody picks those. But then you realize, "Okay, if *nobody* picks that unsafe move, then my move that punishes *only* that unsafe move is now useless." So you cross that off too.
  You keep going: "If they aren't doing *that*, I shouldn't do *this*." You iterate through the layers of the meta until you're left with only the "high-level" options—the ones that survive when both players are playing perfectly.

  **"Never Pick This" (Dominated Strategies)**
  In theory, a strategy is "dominated" if there is literally another option that does better against *everything* the opponent could do.
  In your vocab, this is a **"strictly worse button."** If your crouching light kick has less range, less damage, and slower startup than your crouching medium kick, and it doesn't hit low when the medium doesn't? You delete it from the mental spreadsheet. It's "mashing." It's "inputting garbage." A rational player *never* picks it because it costs resources (time/frame advantage) for zero gain.

  **The Mix Eliminating the Single (Mixed Strategy Dominance)**
  This is the part that tripped you up.
  In the lobby, you'd say: **"Neither of their options hard-counters me, but their 50/50 makes me lose."**
  Let's say you have a "Jump" option.
  *   Opponent Option A (Anti-Air): Beats Jump, but loses to Throw.
  *   Opponent Option B (Block/Backdash): Beats Throw, but loses to Jump.
  If the opponent *only* did A, you'd Jump forever. If they *only* did B, you'd Throw forever. Neither A nor B alone "deletes" your Jump option.
  **But:** If the opponent mixes A and B at the right ratio, your Jump starts losing on average. Even though Jump isn't "hard countered" by a single button, it becomes "mathematically dead" against their **system**.
  In theory terms: Your pure strategy (Jump) is dominated by their *mixed strategy* (A + B). In meta terms: Your option is "priced out" by their okizeme game. You stop picking Jump not because one move stops it, but because their *unpredictability* makes it a losing investment.

  ***

  ### The Seams: Where the Translation Breaks

  I need to be loud about the assumption here. This whole "crossing off" process only works if we assume **Common Knowledge of Rationality (CKR).**

  In the lobby, we say "optimal play" or "level 3 CPU logic." But in the theory, it's stricter. It means:
  1.  I am rational (I want to win and won't pick trash).
  2.  You are rational.
  3.  **I know that you know that I am rational.**
  4.  **You know that I know that you know...** (infinite loop).

  If I think you're tilted, or if I think you're a "habit player" who always jumps on oki, I *won't* cross off my anti-air. I'll keep it specifically *because* you're irrational. The theory assumes everyone in the lobby is a bot running the same perfect script. If anyone is human enough to make a mistake or try a "read" based on emotion, the chain of crossing-off snaps.

  ***

  ### Residue Report: What Theory Has That Meta Doesn't (and Vice Versa)

  **1. The "Dice" vs. "Flow" Gap**
  *   **Theory:** Treats randomness as a precise probability distribution (e.g., "Throw 37% of the time").
  *   **Meta:** Treats randomness as "don't get predictable."
  *   **Verdict:** Your vocabulary is thin here. You know you *need* to mix up, but you don't calculate the exact percentages required to make the opponent indifferent. The theory demands exactness; the meta demands "enough" variance to prevent reads.

  **2. Execution Risk**
  *   **Theory:** If you pick "Dragon Punch," you get a Dragon Punch.
  *   **Meta:** If you pick "Dragon Punch," you might whiff it, drop the combo, or get counter-hit because of input delay.
  *   **Verdict:** The theory assumes perfect execution. The meta knows that a "theoretically optimal" move is bad if you can't land it consistently. This is why "easy combos" often stay in the meta over "optimal combos."

  **3. Psychology as a Variable**
  *   **Meta:** Includes "yomi," "tilt," "momentum," and "character matchup comfort."
  *   **Theory:** Ignores all of it.
  *   **Verdict:** The theory isn't wrong, it's just abstracting. It's like a physics problem ignoring air resistance. It works for the "ideal" game, but the residue is where the actual human match is won.

  ***

  ### (a) Mixed Strategies: Dice or Expectation?

  **In the theory:**
  A mixed strategy is **both**, depending on which side of the screen you're on.
  *   **For the player doing it:** You literally have to roll dice (mentally or otherwise). If you try to "act random" without a mechanism, humans are terrible at randomness. You will fall into patterns. To be truly unexploitable, you must randomize your choice according to specific probabilities.
  *   **For the opponent:** It is purely an **expectation**. They don't see you rolling dice; they see a probability distribution. They know that 30% of the time you will Throw, so they adjust their defense to cover that 30%.

  **In your meta talk:**
  You mostly talk about the **expectation** side ("He's gonna throw me eventually, I need to tech"). You rarely talk about the **dice** side ("I need to consciously randomize my throw attempts at a 1/3 frequency").
  *   **The Gap:** Your vocab captures the *threat* of the mix ("He has a 50/50"), but it misses the *mechanism* required to sustain it. You say "mix it up," which implies effort, but theory says "calculate the equilibrium frequency," which implies math. The meta assumes you can just "feel" the right mix; the theory proves you can't, you have to compute it.

  ***

  ### (b) The 3+ Player Problem

  **You remembered correctly.**
  In a 1v1 fighting game (Zero-Sum, Two-Player), "Everyone is rational" allows you to cross off strategies repeatedly until you hit the Nash Equilibrium (the solution).

  In a 3+ player game (like a *Smash Bros* Free-For-All, *Mario Kart*, or Poker):
  1.  **Coalitions form:** Player A and Player B might implicitly agree to gang up on Player C, even if they aren't teammates.
  2.  **Interdependence:** My best move doesn't just depend on *your* rationality; it depends on how *you* react to *him*, and how *he* reacts to *me*.
  3.  **The Break:** "Everyone is rational" is no longer enough to eliminate strategies.
      *   In 1v1: If I know you're rational, I know you won't pick a move that loses you the game. I can cross it off.
      *   In 3-player: You might pick a move that looks "irrational" (losing you a point) if it knocks out the leader (Player C) and improves your long-term standing.

  **What this does to the "Solution":**
  It destroys the idea that there is **one** clear solution that survives the crossing-off.
  In 1v1, the strategies that survive the elimination process are usually *the* answer (Nash Equilibrium).
  In 3-player, the strategies that survive are just *stable possibilities*, but the game might cycle forever without settling. The "crossing off" stops after the first round because you can't predict what the others will do without knowing who they are targeting.
  **Translation:** In a 3-way lobby, "optimal play" isn't a fixed build or strategy anymore. It's a political state. You can't "solve" the lobby the same way you solve a matchup chart. The meta becomes fluid, not static.
