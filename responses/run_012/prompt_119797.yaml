answer: |-
  Dear Student,

  It is a pleasure to read an essay draft that begins not with abstract theory but with honest intuition, for you have stumbled upon the method that philosophers and lawyers often use when they wish to test the strength of a principle. You have gathered a rich set of cases, and your reactions to them are sophisticated enough to suggest that you already understand privacy better than many adults who speak confidently about it. You are correct that your initial proposal, that a violation occurs when information reaches someone you did not choose, is insufficient. It fails on the noticeboard because you did not choose that audience yet feel no violation, and it fails on the mind-reading machine because no information reaches anyone yet you feel deeply violated. You are also right to suspect that the distinction between being known and being made usable is not doing the work you thought, since you feel worse about the machine that only knows you than the company that records you.

  The principle that best captures the pattern of your reactions is what I would call the Principle of Contextual Sovereignty. This principle has two clauses working in tandem. The first clause states that privacy is governed by the normative expectations of the relationship between you and the observer. The second clause states that there is a hierarchy of intimacy, where information closer to the core of your selfhood commands stronger protection regardless of utility or dissemination. When we apply the first clause, the relationship clause, we explain why your mother reading your phone is a mild violation while the man on the train is a severe one. Your mother stands in a relationship of custodianship where some access is normatively expected, even if covert reading pushes the boundary. The man on the train stands in no relationship with you, so his access breaches the default boundary of strangerhood. This same clause explains why the friend with the password who never looks commits no violation; the norm of friendship implies trust that access will not be exercised, whereas the friend who tells a secret breaches the relational norm of confidentiality. The noticeboard case is also resolved here because the context of schooling carries a normative expectation that academic performance is semi-public within that community, so you have implicitly accepted that audience by participating.

  The second clause, the hierarchy of intimacy, is required to explain your reactions to the mind-reading machine, the music service, and the data hoarder. You feel worse about the mind-reading machine than the data hoarder because the mind is the sovereign core of the self, whereas online behavior is an external trace. Even if the machine does nothing with the thought, the mere penetration of that sovereign sphere is the harm. This explains why the music service troubling you with a pregnancy inference is worse than the man on the train seeing your messages. The messages are external communications, but the pregnancy inference is a deduction about your biological interior state, which sits higher on the hierarchy of intimacy. The data hoarder records your external traces, which is invasive, but it does not penetrate the sovereign interior in the way the mind-reading machine or the pregnancy inference does. This principle captures why you feel wronged by your cousin's DNA test. Your biological code is part of that sovereign interior, and even though she accessed her own data, the derivative effect penetrates your protected biological sphere without your consent.

  You asked what the slogan nothing to hide would have to mean to be true of these cases. For that slogan to hold, privacy would have to be solely about the concealment of wrongdoing or shame. If privacy were only about hiding bad things, then the mind-reading machine would not be a violation if you are thinking innocent thoughts, and the music service would not matter if being pregnant is not a secret you need to keep. The slogan fails because it misunderstands privacy as secrecy rather than boundary maintenance. Your reactions show that you care about who knows you and how they know it, not just whether the knowledge is damaging. You would feel violated by the mind-reading machine even if you were thinking about mathematics, because the violation is of the boundary itself, not the content. Therefore, the slogan fails wherever the harm is derived from the breach of relationship or the penetration of the self, rather than the utility of the information revealed.

  To test this principle further, I propose two new cases that pull in opposite directions. Suppose a public health authority tracks infection chains using phone location data during a pandemic, anonymizing the data and deleting it after the crisis ends. Conversely, suppose a parent installs a keylogger on a teenager's laptop to prevent bullying, reading every keystroke permanently to ensure safety. The Principle of Contextual Sovereignty predicts that the public health tracking is likely permissible, or at least a minor violation, because the relationship between citizen and state during a crisis shifts normative expectations toward collective safety, and the data is external location information low on the intimacy hierarchy. However, the parental keylogger is predicted to be a serious violation. Despite the benevolent intent and the close relationship, the keylogger penetrates the sovereign interior of private communication, which is high on the intimacy hierarchy, and the permanent nature of the access breaches the normative expectation of growing autonomy inherent in the parent-teen relationship. These cases pull in opposite directions regarding intent and safety, but the principle prioritizes the sphere of access and the relational norms over the benevolence of the actor.

  I must be honest with you about where this principle might force you to give up one of your reactions. The case of the cousin's DNA is the most difficult for any privacy principle to save without qualification. If we strictly uphold the Principle of Contextual Sovereignty, we must acknowledge that your cousin has sovereignty over her own body and data. To say she violates your privacy by sharing her own medical results is to claim that you have a veto over her self-knowledge. A strict application of the principle might force you to concede that while you feel wronged, it is not a privacy violation in the same sense as the mind-reading machine, but rather a tragic conflict of rights where her right to know her health trumps your right to ignorance of your risks. If you insist that it is a privacy violation, you must qualify the principle to say that sovereignty extends to derivative information about others, which risks making the principle so broad that it restricts ordinary life, such as a family discussing hereditary traits. You may need to accept that your feeling of being wronged is valid, but categorizing it as a privacy violation stretches the concept beyond boundaries of control and into the realm of shared biological fate.

  In conclusion, your instinct to work from cases to principles is sound, and your intuitions are largely consistent with a view of privacy as contextual integrity and sovereign interiority. The Principle of Contextual Sovereignty explains most of your verdicts by weighing the relationship norms against the intimacy of the information sphere. It reveals that the nothing to hide argument is a category error that confuses boundaries with secrets. It predicts that safety and benevolence do not justify penetrating the core self, as seen in the keylogger case. However, it asks you to consider whether the DNA case is truly a privacy violation or a conflict of rights, which is a nuance that will strengthen your essay significantly. You have done excellent work here, and I look forward to seeing how you develop these thoughts.

  Yours sincerely,

  A Reader
