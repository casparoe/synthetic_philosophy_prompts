answer: |-
  This is a classic problem in jurisprudence, though it rarely gets discussed outside of constitutional theory and obscure game design circles. You have accurately identified the gap between "self-reference" (static) and "self-modification" (dynamic), and specifically the *directional* dynamic of authority compression.

  Here is the carving you're looking for.

  ### 1. The Existing Canon
  The definitive work on this is **Peter Suber's *The Paradox of Self-Amendment* (1990)**. It is exactly your itch, scratched exhaustively. Suber analyzes Nomic-like legal systems to determine if a rule can validly change itself to become unchangeable, or to change the rules of changing.

  In legal theory, the specific concept you are describing is the debate between **Continuing Sovereignty** vs. **Self-Embracing Sovereignty**.
  *   **Continuing Sovereignty:** A sovereign body cannot bind its successors. (The new rule requiring unanimity is invalid because the old body didn't have the power to shackle the new one).
  *   **Self-Embracing Sovereignty:** A sovereign body *can* bind its successors. (The new rule is valid because the old body had the power to redefine sovereignty itself).

  Your scenario assumes **Self-Embracing Sovereignty** within a **Closed Normative System** (no external court/god).

  ### 2. The Term
  There is no single word that captures the *directional tightening* specifically, but the cleanest existing phrase is **Recursive Entrenchment**.

  However, since you asked for edges and precision, and "entrenchment" often implies a static state (e.g., "this clause is entrenched"), I propose the more mechanistic term:

  **Competence Ratcheting**

  *   **Competence:** In legal theory (specifically Kelsen and Hart), "competence" is the authority to create valid norms. You aren't just changing rules; you are changing the *competence* of the rule-making body.
  *   **Ratcheting:** Captures the directional, irreversible (or hard-to-reverse) nature. A ratchet allows motion in one direction (tightening) while preventing it in the other.
  *   **Why it fits:** It distinguishes the phenomenon from simple "amendment." An amendment changes the *output* of the system; competence ratcheting changes the *gain* of the system.

  ### 3. The Edges (Carving the Concept)

  You asked for the boundaries. Here is where the concept holds and where it breaks.

  **A. Is it still Competence Ratcheting if there IS an external authority?**
  **No.** If there is a Supreme Court, a Founder, or a "God" that can veto the amendment, the system is not closed. The validity of the tightening does not come from the system's own recursion; it comes from the external authority's *tolerance*.
  *   *Boundary:* If the external authority *could* veto but *doesn't*, it is still ratcheting, but it is **Contingent Ratcheting**. If the external authority *cannot* veto (by definition), it is **Absolute Ratcheting**. Your Nomic case is Absolute.

  **B. Does it need the ratchet (iterative tightening), or is a single self-tightening enough?**
  **Single step is sufficient.** The phenomenon is the *transfer of authority from the present to the future constraints*.
  *   *Distinction:* A single step is **Self-Binding**. Multiple steps are **Recursive Self-Binding**.
  *   *Why the distinction matters:* In a single step, you can argue the system "intended" this. In recursive steps (the Nomic spiral), you reach a point where the *current* rule-making body has less authority than the *original* rule-making body, despite being the same legal entity. This is where the "shrinking authority" becomes visible. If you only do it once, it looks like precommitment. If you do it five times, it looks like entropy.

  **C. Where's the line between this and "a bad amendment everyone regrets"?**
  **Reversibility.**
  *   If the rule can be undone using the *new* procedure easily, it's just a **Policy Shift**.
  *   If the rule makes undoing itself procedurally harder than the original state, it is **Entrenchment**.
  *   If the rule makes undoing itself *impossible* without breaking the system, it is **Suicidal Sovereignty**.
  *   *The Line:* Competence Ratcheting requires that the **Cost of Reversal > Cost of Initial Passage**. If the cost is the same, no ratcheting has occurred; you've just moved the fence.

  **D. Does the founding case belong here? (The Grundnorm Problem)**
  **No. This is a categorical distinction.**
  This is the most important edge.
  *   **The Founding:** This is **Constituent Power** (*pouvoir constituant*). It is a *fact* that becomes *law*. It exists outside the rulebook. It is the "Big Bang" of the system. It does not derive validity from prior rules because there are none.
  *   **The Ratcheting:** This is **Constituted Power** (*pouvoir constitué*). It is *law* changing *law*. It derives validity entirely from the previous state of the rulebook.
  *   *Why they are different:* You cannot "Competence Ratchet" the founding. You can only *assert* it. The founding rulebook is valid because everyone *agrees* it is valid (social fact). The fifth amendment is valid because the fourth amendment *said* it would be (legal norm).
  *   *The Gap:* If you ratchet down competence enough, the Constituted Power may become so weak that it effectively collapses back into Constituent Power (revolution). That is the system breaking, not the phenomenon continuing.

  ### 4. Systems Theory Context
  If you want to talk about this without legal jargon, use **Autopoiesis** (Maturana/Varela/Luhmann).
  *   An autopoietic system produces the components that produce the system.
  *   Your Nomic game is an autopoietic normative system.
  *   **Competence Ratcheting** is the system reducing its own **degrees of freedom** for future states.
  *   In cybernetics terms, this is a **Negative Feedback Loop on Variability**. The system is detecting "potential rule changes" as noise and increasing the damping factor.

  ### Summary
  *   **The Field:** Jurisprudence of Constitutional Amendment / Systems Theory.
  *   **The Canon:** Peter Suber, *The Paradox of Self-Amendment*.
  *   **The Standard Term:** **Recursive Entrenchment** (under the doctrine of **Self-Embracing Sovereignty**).
  *   **The Precision Term (Coinage):** **Competence Ratcheting**.
  *   **The Founding:** Distinct category (**Constituent Power** vs. **Constituted Power**).
  *   **The Condition:** Requires a **Closed Normative System** (no external veto).

  You are describing a system that is successfully eating its own tail to become smaller, and asking if the digestion is valid. Under Self-Embracing Sovereignty, the answer is yes, until the system becomes too small to digest anything at all.
