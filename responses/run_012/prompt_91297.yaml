answer: |-
  Here is a specification of the desiderata for an account of probability in no-collapse quantum mechanics (EQM). I have organized them by the function they serve (Empirical, Structural, Epistemic, and Ontological), provided the case for each, and labeled them as either a **Hard Constraint** (required by the commitment to linear dynamics and empirical adequacy) or a **Camp Preference** (a metaphysical or methodological choice that varies between interpretations).

  Following the list, I analyze the compatibility of these requirements, specifically addressing the "impossible trinity" you identified.

  ### I. Empirical Adequacy
  **1. The Born Recovery Requirement**
  *   **The Case:** The account must yield numerical probabilities that match the squared amplitudes ($\psi^2$) in the limit of repeated trials. If the theory predicts that an agent should bet at odds other than the Born rule, it is empirically falsified by standard quantum experiments.
  *   **The Hard Case:** In your three-outcome scenario (amplitudes $1/\sqrt{2}, 1/2, 1/2$), the account must mandate betting odds of $1/2, 1/4, 1/4$. It cannot allow odds of $1/3, 1/3, 1/3$ based on branch counting.
  *   **Status:** **Hard Constraint.** Without this, the theory is not quantum mechanics.

  ### II. Structural Integrity
  **2. Basis Independence (The QFT Constraint)**
  *   **The Case:** The probability measure cannot depend on a discrete count of branches. In relativistic quantum field theory, the decomposition of the universal wavefunction into "worlds" is not unique; it depends on the decoherence basis, which is approximate and context-dependent. A discrete branch count is ill-defined and changes with coarse-graining. The probability measure must be defined on the Hilbert space structure (the amplitude) directly, such that it remains invariant under refinements of the branch decomposition.
  *   **The Hard Case:** If you split a branch of amplitude $1/2$ into two sub-branches of amplitude $1/\sqrt{8}$ each, the total probability weight of that outcome must remain $1/4$, not increase because there are now "more" branches.
  *   **Status:** **Hard Constraint.** This is dictated by the physics of decoherence and QFT, not philosophy.

  **3. Continuity and Zero-Amplitude Handling**
  *   **The Case:** The probability measure must be a continuous function of the state vector. If a branch's amplitude goes to zero, its probability must go to zero. Conversely, a branch with exactly zero amplitude must be treated as impossible, not merely unlikely. This prevents "discontinuous jumps" in probability where an infinitesimal change in the wavefunction creates or destroys a world with finite probability weight.
  *   **The Hard Case:** In the limit where the $1/2$ amplitude outcomes shrink to $\epsilon$, their probability weight must shrink to $\epsilon^2$, not remain finite until they vanish completely.
  *   **Status:** **Hard Constraint.** Required for mathematical consistency with the linear dynamics.

  ### III. Epistemic Coherence
  **4. Diachronic Consistency (Pre- and Post-Branching)**
  *   **The Case:** An agent's credences before a measurement must cohere with the expectations of their successors after the measurement. If the pre-branch agent assigns a probability $p$ to an outcome, and the post-branch agent on that outcome assigns a different probability to having arrived there (conditional on existence), the agent is vulnerable to a diachronic Dutch book.
  *   **The Hard Case:** In a repeated survival measurement (e.g., quantum suicide scenarios), the agent who survives must update their credences. The account must specify whether survival is evidence for the branch they are on, or whether probability is merely a "caring measure" for successors that does not update on existence.
  *   **Status:** **Hard Constraint.** Required for rational agency. If the theory cannot guide action consistently over time, it fails as a physical theory for agents.

  **5. The Uncertainty Condition**
  *   **The Case:** The account must explain the phenomenology of uncertainty. Before a measurement, an agent feels uncertain about the outcome. Since the dynamics are deterministic and all outcomes occur, this uncertainty cannot be about *what happens* in the universe. It must be modeled as self-locating uncertainty (ignorance of *which* branch one will be on) or justified as a functional substitute for uncertainty.
  *   **The Hard Case:** An agent who knows the universal wavefunction knows everything there is to know about the physics. The account must explain why she is not "certain" of the outcome in a way that paralyzes decision-making.
  *   **Status:** **Camp Preference.** Some camps (e.g., Oxford/Decision-Theoretic) argue uncertainty is an illusion replaced by rational preference. Others (e.g., Vaidman/Saunders) argue self-locating uncertainty is genuine. The *behavior* must match uncertainty, but the *metaphysics* of the uncertainty is debated.

  ### IV. Ontological Status
  **6. Derivational Purity**
  *   **The Case:** The Born rule must be derived from the deterministic linear dynamics and the structure of the wavefunction alone. It cannot be added as a separate postulate (e.g., "add a measure over branches"). If you add a probability postulate, you have effectively added a collapse-like structure or a hidden variable, violating the "no-collapse" commitment.
  *   **The Hard Case:** You cannot simply define the "measure of existence" of a branch as its squared amplitude. That definition must be motivated by the dynamics or symmetry arguments, not stipulated.
  *   **Status:** **Hard Constraint.** This is the definition of the project. If you add a probability postulate, you are not solving the measurement problem for EQM; you are modifying EQM.

  **7. Objective Chance vs. Epistemic Credence**
  *   **The Case:** This requirement demands that probability be a feature of the world (a physical propensity or frequency) rather than a report on an agent's information or rational betting preferences. The world itself should distinguish between a high-amplitude branch and a low-amplitude branch in a way that is not reducible to "an agent should care more."
  *   **The Hard Case:** In a universe with no agents, do the branches still have "probabilities"? An objective account says yes; a decision-theoretic account says the concept is meaningless without agents.
  *   **Status:** **Camp Preference.** This is the primary fault line. Decision-theorists reject this as a requirement; Realists insist on it.

  ### V. Analysis of Compatibility and Tensions

  You asked to flag subsets of requirements that cannot be jointly satisfied and to identify the "impossible trinity."

  **The Impossible Trinity**
  You asked if one can consistently have:
  1.  Probability derived from deterministic linear dynamics alone (**Derivational Purity**).
  2.  Probability as an objective feature of the world (**Objective Chance**).
  3.  Nothing added beyond the wavefunction and equation of motion (**Purity/No New Postulates**).

  **Verdict:** **No.** These three are mutually incompatible in the context of EQM.

  *   **The Conflict:** The linear dynamics are deterministic. In a deterministic theory, there is no room for *objective chance* (propensity) in the standard sense, because the future is fully fixed by the past. To get objective chance, you usually need indeterminism (Constraint 2 violates Constraint 1).
  *   **The Workaround:** To save Objective Chance without Indeterminism, proponents often implicitly treat the "measure" over branches as a physical stuff (e.g., "world density"). But this measure is not present in the bare wavefunction equation; it is an additional structure imposed on the Hilbert space. This violates Derivational Purity (Constraint 2 violates Constraint 3).
  *   **The Decision-Theoretic Solution:** To save Derivational Purity and No New Postulates, one must surrender Objective Chance. Probability becomes a statement about rational credence (Decision Theory). This satisfies 1 and 3 but fails 2.

  **The Single Most Exclusionary Requirement**
  The requirement that does the most work in excluding candidate accounts is **Requirement 7: Objective Chance.**

  *   **Why:** If you demand that probability be an *objective feature of the world* independent of agents, you force the theory to find a physical correlate for probability within the deterministic wavefunction. Since the wavefunction evolves deterministically, the only available correlate is the amplitude. However, linking amplitude to *objective chance* requires a bridge principle that is not contained in the Schrödinger equation.
  *   **Consequence:** Demanding Objective Chance forces you to either:
      1.  **Cheat:** Sneak the Born rule into the definition of "branch" (violating Derivational Purity).
      2.  **Add Stuff:** Postulate a measure over and above the wavefunction (violating No New Postulates).
      3.  **Fail:** Admit that deterministic dynamics cannot generate objective chance.

  If you drop Requirement 7 and allow probability to be **Epistemic Credence** (a constraint on rational belief given self-locating ignorance), the Trinity becomes solvable. This is the path taken by the Deutsch-Wallace theorem. They derive the Born rule as a norm of rationality, not a physical propensity.

  **Constraint vs. Preference: The Camouflaged Preference**
  The requirement most often dressed up as a constraint but which is actually a **Camp Preference** is **Requirement 7 (Objective Chance)**.

  *   **The Disguise:** Proponents of "Realist" probability argue that without objective chance, science loses its grip on reality. They claim that if probability is just "how an agent bets," it is anthropocentric and fails to describe a universe without observers.
  *   **The Reality:** In a deterministic multiverse, "objective chance" is a category error. There is no single future to be chancy about. The *statistics* are objective (Requirement 1), but the *probability* is a tool for agents navigating the branching structure. Insisting on Objective Chance is insisting that EQM look like a single-world stochastic theory, which it is not. This preference drives much of the dissatisfaction with decision-theoretic derivations, but it is not a logical requirement of the physics.

  **The Tension Between Uncertainty and Knowledge**
  There is a secondary tension between **Requirement 5 (Uncertainty)** and the agent's knowledge of the universal state.
  *   **The Conflict:** If the agent knows the universal state, she knows all outcomes occur. Standard uncertainty requires ignorance of the outcome.
  *   **The Resolution:** This requires accepting **Self-Locating Uncertainty**. The agent is not uncertain about *the world*, but about *her location in the world*.
  *   **The Risk:** Some camps argue this is a fiction. If you reject Self-Locating Uncertainty, you must replace Probability with a "Caring Measure" (I know both successors exist, but I care more about the high-amplitude one). This changes the meaning of probability from "belief" to "preference." This is a legitimate move, but it changes the semantic content of the theory. If your group demands that probability mean "degree of belief in a unique outcome," EQM cannot satisfy it. If you allow "degree of belief in self-location" or "weight of concern," it can.

  ### Summary for Your Group

  To evaluate the next proposal you read, apply this filter:

  1.  **Does it recover the Born Rule without counting branches?** (If it relies on branch counting, it fails QFT).
  2.  **Does it derive the weight from the dynamics, or does it define the weight into the branch structure?** (If the latter, it is circular).
  3.  **Does it claim probability is Objective Chance or Rational Credence?**
      *   If **Objective Chance**: Ask where the chance comes from in a deterministic equation. (Suspect circularity or hidden postulates).
      *   If **Rational Credence**: Ask if this is sufficient for empirical science. (This is the preference check).
  4.  **Does it handle the agent who knows the wavefunction?** (If it relies on ignorance of the *outcome*, it fails. It must rely on ignorance of *location*).

  The "standard" you are looking for is one that admits **Probability in EQM is not Objective Chance.** It is a derived measure of **Rational Credence** grounded in **Self-Locating Uncertainty**, constrained by **Basis Independence**. Any proposal claiming to give you Objective Chance from pure linear dynamics is likely hiding a postulate in the derivation.
