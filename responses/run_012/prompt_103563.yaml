answer: |-
  There is no single established name covering all three settings, though the first two are jointly known as the Lottery-Preface Paradox. To encompass the triad, I coin the term **The Paradox of Modal Non-Aggregation**, defined as a structural failure where a specific modal status (belief, probability, or ability) applies to every member of a set individually but fails to apply to their conjunction collectively, without any specific member being identifiable as the point of failure.

  The pattern is drawn precisely by three conditions:
  1.  **Individual Validity:** For every item $x$ in a set $S$, the proposition $P(x)$ holds a positive modal status $M$ (e.g., is believed, is highly probable, is possible).
  2.  **Collective Invalidity:** For the conjunction of all items $\bigwedge S$, the proposition $P(\bigwedge S)$ holds a negative modal status $\neg M$ (e.g., is disbelieved, is certain to contain falsehood, is impossible).
  3.  **Indistinguishability:** There is no non-arbitrary way to select a specific subset or individual item $x_i$ as the cause of the collective failure; every item appears identical in status to every other.

  **Inside the boundary** fall cases where the failure arises solely from the mathematics of aggregation or resource scarcity across a large set, such as the lottery (probability aggregation), the preface (belief aggregation), or the promises (ability aggregation). **Outside the boundary** fall cases where a specific item is known to be false or impossible (which resolves the paradox by identifying the fault), cases where the modal status logically aggregates (such as classical truth, where if $A$ is true and $B$ is true, $A \land B$ must be true), and the Sorites Paradox, which relies on vague predicates rather than modal aggregation.

  The difficulty differs between the settings in its modality, though the logical structure remains isomorphic. In the first two settings (Lottery and Preface), the difficulty is **epistemic and probabilistic**. It challenges the **Lockean Thesis** (that belief is justified by high probability) and the **Principle of Conjunction** (that rational belief is closed under conjunction). Here, the tension is between consistency and fallibilism: you cannot consistently believe every ticket will lose while knowing one must win, yet asserting any single ticket will win is unjustified.

  In the third setting (Promises), the difficulty is **deontic and physical**. It challenges the **Principle of Agglomeration** for ability (that if I can do $A$ and I can do $B$, I can do $A$ and $B$). Unlike the first two, which rely on uncertainty and probability, this setting relies on **compossibility** and resource constraints. Each promise is individually possible because the conflict is not internal to the promise but external, arising from the finite nature of time or energy when combined. While the first two settings allow you to assert the collective falsehood (one claim is false; one ticket wins), the third setting forces you to admit a collective impossibility (I cannot keep all promises) while maintaining individual ability.

  The nearest established ideas differ in critical ways. The **Lottery-Preface Paradox** is strictly epistemic and does not account for the physical constraints of the promise setting. **Moral Overload** or **Conflicts of Obligation** typically address competing duties (where you ought to do $A$ and ought to do $B$, but cannot do both), whereas your third setting specifies that you *can* do each individually, isolating the paradox to the aggregation of ability rather than the conflict of obligation. **The Sorites Paradox** is distinct because it turns on vagueness (where does heap become non-heap?), whereas Modal Non-Aggregation turns on the logical properties of modal operators across a set of precise items. Thus, while the first two settings are standardly treated as variations of the same epistemic problem, the third belongs to deontic logic and action theory, united only under the broader structural umbrella of Modal Non-Aggregation.
