  There is no single established term that captures the specific nexus you have described. There are concepts that graze the edges of it, but none that carve out the exact shape of the phenomenon, particularly the third consequence (the institutional defense of the hollow category).

  The nearest existing concepts are:

  1.  **Volkskirche vs. Freikirche (People's Church vs. Free Church):** This is the distinction you recalled. It describes the *theological and sociological scope* (a church for the whole people vs. a church of believers). However, as you intuited, it describes a stance toward the world, not the *administrative ontology*. A *Volkskirche* could theoretically exist without a state register (via cultural default), and a *Freikirche* could theoretically have a rigid register. Your phenomenon is about the *mechanism of the list*, not the theology of the scope.
  2.  **Ascribed vs. Achieved Status (Linton):** This covers the entry (birth vs. conversion) but fails to account for the exit mechanism (act vs. fade) or the financial incentive to maintain the fiction.
  3.  **Institutional Decoupling (Meyer & Rowan):** This describes organizations separating their formal structures from their actual practices to maintain legitimacy. This fits your third consequence well. However, it does not capture the *ontological shift* of the membership itself (that leaving becomes an act rather than a process) or the specific role of the *register* as the constitutive element.
  4.  **Legibility (James C. Scott):** This describes the state's desire to simplify complex social realities into grids for taxation and control. This fits the machinery, but "legibility" is a goal of the state, not a name for the resulting *kind of membership* or the institution's defense of the hollow category.

  Because the existing terms describe the *parts* (the theology, the status, the organizational behavior, or the state's goal) but not the *specific causal chain* you have isolated (Record $\rightarrow$ Binary Ontology $\rightarrow$ Performative Exit $\rightarrow$ Defense of Fiction), I propose a new term.

  ### The Term: **Constitutive Registration**

  **Definition:**
  A social arrangement in which an administrative record does not reflect a pre-existing social reality but **constitutes** it, transforming a continuous practice into a binary legal status, thereby requiring a formal act to terminate the association and incentivizing the institution to defend the integrity of the record over the substance of the practice.

  ### The Carving (Edges and Boundaries)

  To ensure the definition is sharp enough to have edges, we must distinguish what falls inside, what merely resembles it, and what is required for the phenomenon to be absent.

  **1. Clear Cases (Inside the Carving)**
  For a case to be one of **Constitutive Registration**, three conditions must be met simultaneously:
  *   **The Constitutive Condition:** The membership exists *only* insofar as it is recorded. If the name is on the list, the person is a member, regardless of belief or practice. If the name is off the list, they are not, regardless of belief or practice. The list does not measure the membership; it *makes* it.
  *   **The Discrete Exit Condition:** Because the status is binary (on/off), exit cannot be a gradual fade. It must be a discrete, performative act (signing a form, paying a fee, filing a declaration) that alters the record.
  *   **The Resource Dependency Condition:** The institution's revenue or power is tied directly to the count on the register, not to the verifiable practice of the members. This creates the incentive to defend the "hollow" category.

  **2. Resembling Cases (Outside the Carving)**
  *   **Voluntary Congregations with Rolls:** A Baptist church may keep a roll and vote members in. However, if they remove members for non-attendance without a formal exit act by the member, and if their funding relies on weekly offerings (practice) rather than the roll count (status), this is *not* Constitutive Registration. The roll is descriptive, not constitutive.
  *   **State Recognition without Funding:** If a state recognizes a church for ceremonial purposes (e.g., performing legal marriages) but does not collect taxes on its behalf or tie funding to the membership count, the register lacks the *Resource Dependency*. The church has no incentive to defend a hollow category, as the revenue comes from practice (donations), not status.
  *   **Opt-Out Systems without Institutional Defense:** A magazine subscription may renew automatically (opt-out). However, if the publisher does not care if the subscriber reads the magazine (no hollow category defense) and the subscriber can cancel via a simple click (low friction exit), it lacks the *ontological weight* and *institutional defense* of Constitutive Registration.

  **3. Conditions for Absence**
  For the phenomenon to be absent, **any one** of the three conditions above must be broken.
  *   **Practice-Based Funding:** If the institution is funded by voluntary donation at the point of practice (attendance/offering plate), the register becomes irrelevant to revenue. The institution will not defend a hollow roll.
  *   **Descriptive Record-Keeping:** If the institution views the roll as a historical record of *past* participation rather than a current legal status, exit is a fade, not an act.
  *   **Decoupled Resources:** If the state recognizes the church but funds it via general block grants unrelated to membership numbers, the incentive to maintain the specific categories of the register vanishes.

  ### Application to Your Questions

  **Does the phenomenon belong to the state, or merely to the keeping of a list?**
  It belongs to the **binding of resources to a binary status**. The State is merely the most powerful enforcer of this binding.
  *   **Unions:** A "closed shop" with dues check-off is a clear case of Constitutive Registration. Membership is a status required for employment (constitutive), exit requires a formal window of time (discrete exit), and the union defends the membership count to maintain bargaining power and revenue (resource dependency).
  *   **Political Parties:** In systems where party membership determines primary voting rights and state funding is allocated by membership count, parties will defend hollow membership categories (e.g., "ghost members") to secure resources.
  *   **Professional Licences:** If a licence is required to practice (constitutive) and renewal is automatic unless opted-out (discrete exit), but the body defends the licence count to maintain prestige/fees, it fits.

  **Is the religious case merely an instance of something more general?**
  Yes. It is an instance of **Administrative Ontology**. This is the broader genus: any situation where a bureaucracy's need for legibility overrides the social reality it purports to measure. **Constitutive Registration** is the specific species where *identity* is the subject of that ontology.

  **What would count as a clear case vs. a case that merely resembles one?**
  *   **Clear Case:** The German *Kirchensteuer*. The state collects the tax based on the register. The church receives the funds based on the register. The individual is a member until they formally leave at a government office. The church lobbies against making exit easier.
  *   **Resembling Case:** The Church of England. It is an established church (State entangled), but it does not have a comprehensive central register of all members tied to income tax. Membership is vague, exit is a fade. It resembles the first case in theology (*Volkskirche*), but lacks the *Constitutive Registration* machinery.
  *   **Resembling Case:** A strict covenantal church (e.g., some Calvinist bodies). They have a strict roll and formal discipline for exit. However, if their funding is via voluntary offering and the "hollow" members are purged rather than defended, it lacks the *Resource Dependency* condition. They defend the *purity* of the roll, not the *size* of the roll. Constitutive Registration requires defending the *size* (revenue) even at the cost of *purity* (belief).

  ### Summary of the Distinction

  You are distinguishing between **Membership as Practice** and **Membership as Status**.
  *   **Membership as Practice:** Ontologically continuous. Exit is a fade. Statistics are estimates. Institution incentivized to deepen practice.
  *   **Membership as Status (Constitutive Registration):** Ontologically binary. Exit is an act. Statistics are counts. Institution incentivized to maintain the status category even when practice ceases.

  Your third consequence is the critical insight: under Constitutive Registration, the **hollow category is not a bug; it is the revenue model.** The institution becomes a defender of the *form* of belonging against the *fact* of non-belonging.

  **Term:** **Constitutive Registration**
  **Definition:** An administrative system where the record constitutes the social fact, requiring a formal act to terminate, and incentivizing the institution to prioritize the record's integrity over the practice's substance.
  **Edges:** Requires (1) Constitutive Record, (2) Discrete Exit, (3) Resource Dependency on the Count. Absent any one, the phenomenon dissolves.
