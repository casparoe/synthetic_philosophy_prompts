answer: |-
  You have put your finger on a specific, well-recognized, and contentious structural feature of the predictive processing (PP) and free-energy principle (FEP) literature, particularly as it is applied in computational psychiatry and cognitive science.

  There is no single, universally canonical noun for this specific maneuver (like "ad hominem" or "straw man"), but it is widely discussed under the headings of **"Normative Circularity,"** **"The Optimality Assumption,"** and most famously, **"Bayesian Just-So Stories."**

  However, your description of the *valence reversal*—where the same parameter setting is virtuous or vicious solely based on the outcome—deserves a more precise label than the general charge of unfalsifiability. In the philosophy of cognitive science, this is often treated as a collapse of the **descriptive** (how the system *does* work) and the **normative** (how the system *should* work) levels of analysis.

  Here is an analysis of the phenomenon, the existing terminology, a proposed precise term for the specific mechanism you identified, and its boundaries.

  ### 1. Existing Terminology and Critique

  The most direct antecedent to your observation is found in the work of **Matteo Colombo and Cory Wright** (e.g., *"Bayesian Cognitive Science, Unification, and Explanation,"* 2017). They argue that when PP explains behavior by positing priors and precisions that are inferred *from the very behavior they are supposed to explain*, it results in an **"Explanatory Vacuum."**

  *   **Bayesian Just-So Story:** This term (borrowed from Gould and Lewontin's critique of evolutionary psychology) is used when a model posits that a system is "optimal" because it survives/functions, and explains failures as "miscalibrations" without independent evidence of what the calibration *should* have been.
  *   **Normative Circularity:** This captures the logic: The system is rational because it minimizes free energy; we know it minimized free energy because it succeeded; if it failed, it didn't minimize free energy correctly. The norm (minimize free energy) is validated by the outcome, and the outcome is explained by the norm.
  *   **The Is-Ought Slide:** PP claims to be a descriptive theory of the brain (Is) grounded in a normative principle of self-organization (Ought). Your observation highlights the moment the theorist slides from describing a parameter (high prior precision) to evaluating it (rigidity vs. stability) based entirely on the *Ought* (did it work?).

  ### 2. A Proposed Term: "Outcome-Dependent Normative Valence"

  Since you asked for a term that pins down the specific *reversal of valence* on the same parameter, I propose labeling this phenomenon **Outcome-Dependent Normative Valence (ODNV)**.

  **Definition:** ODNV occurs when a theoretical parameter (e.g., prior strength, sensory precision) lacks an outcome-independent criterion for optimality, such that its normative status (adaptive vs. maladaptive, accurate vs. delusional) is assigned retrospectively based on the success or failure of the system's behavior.

  **Why this differs from "Ad Hocness":**
  *   **Ad Hocness** typically involves adding a *new* auxiliary hypothesis to shield a core claim from falsification (e.g., "The prior was strong, *and* there was an unmeasured noise source").
  *   **ODNV** does not add a hypothesis. It keeps the parameter constant but flips its *semantic evaluation*. It is not shielding the theory by addition; it is shielding the theory by **reinterpreting the variable's moral/functional weight**.

  **Why this differs from "Underdetermination":**
  *   **Underdetermination** implies that multiple *different* models could account for the same data.
  *   **ODNV** implies that *one* model accounts for all data by allowing the internal variables to be "good" or "bad" interchangeably. It is not that the map is ambiguous; it is that the legend changes depending on where you end up.

  **Why this differs from "Honest Parameter Estimation":**
  *   In honest estimation (e.g., system identification), you measure the parameter $P$ (e.g., neural gain) independently of the outcome $O$, then predict $O$.
  *   In ODNV, you observe $O$, then infer the *quality* of $P$. If $O$ is failure, $P$ is defined as "miscalibrated." The parameter is not measured; it is **diagnosed**.

  ### 3. Parallels in Other Fields

  You suspected this structure appears elsewhere. It does, and recognizing the cousins helps mark the boundaries.

  **A. Evolutionary Psychology (The Adaptationist Programme)**
  *   **Structure:** Trait $T$ exists.
  *   **Success:** $T$ is an adaptation (selected for).
  *   **Failure:** $T$ is a spandrel, a mismatch, or a constraint.
  *   **Parallel:** This is the original "Just-So Story." The difference is that evolutionary theory *can* escape ODNV if independent phylogenetic or genetic evidence constrains the history of $T$. PP escapes ODNV only if neural mechanisms constrain the priors.
  *   **Verdict:** Direct cousin. Same logical structure (retroactive functional attribution).

  **B. Economics (Revealed Preference Theory)**
  *   **Structure:** Agent chooses $X$ over $Y$.
  *   **Success:** Agent prefers $X$ (Rational).
  *   **Failure:** Agent was misled, irrational, or had false beliefs (Bounded Rationality).
  *   **Parallel:** If an agent goes bankrupt, revealed preference theory struggles unless it posits "false beliefs." But how do we know the beliefs were false? Because they went bankrupt.
  *   **Verdict:** Close cousin. This is often called the **"Tautology of Rational Choice."**

  **C. Bayesian Epistemology (Ideal Observer Models)**
  *   **Structure:** Agent updates by Bayes' Rule.
  *   **Success:** Agent is calibrated.
  *   **Failure:** Agent had the wrong prior.
  *   **Distinction:** In formal epistemology, this is often acceptable because the goal is *normative* (how one *ought* to reason), not *descriptive* (how brains *do* work). The critique of PP is that it claims to be *both*.
  *   **Verdict:** Distant cousin. The flaw only appears when a normative model claims descriptive universality.

  ### 4. Boundary Cases: When is it *not* ODNV?

  To ensure the term is useful, we must define where PP *escapes* this charge. Proponents of PP (like Friston, Hohwy, Clark) argue the framework is not vulnerable to ODNV if **independent constraints** are applied.

  1.  **Neural Constraints (The Mechanism Boundary):**
      *   If "precision" is operationalized as **synaptic gain** or **gamma-band oscillation amplitude**, and this is measured *physiologically* before the behavioral outcome is known, ODNV is avoided.
      *   *Example:* "We measured high gamma activity (high precision) in the auditory cortex, therefore we predict the subject will ignore visual conflict." If they fail, the theory is actually falsified (or the mechanism mapping is wrong).
      *   *Boundary:* ODNV exists only when precision is a **latent variable inferred from behavior** rather than a **mechanism measured from physiology**.

  2.  **Environmental Statistics (The Ground Truth Boundary):**
      *   If the "correct" prior is defined by the **statistical structure of the environment** (measured independently of the agent), then a mismatch is objectively a mismatch.
      *   *Example:* If the environment is volatile (high change rate) and the agent holds a high-stability prior, that is objectively "rigid," regardless of whether they got lucky on a specific trial.
      *   *Boundary:* ODNV arises when the "environment" is also inferred from the agent's success, creating a closed loop.

  3.  **Cross-Task Consistency:**
      *   If a subject exhibits "high sensory precision" in Task A (distractibility) and "high sensory precision" in Task B (responsiveness), and the theory can predict *which* outcome will occur based on task structure, ODNV is mitigated.
      *   *Boundary:* If the parameter label flips *within the same task structure* based solely on outcome, it is ODNV.

  ### 5. Summary and Recommendation

  The phenomenon you have identified is a specific species of unfalsifiability characterized by the **retroactive assignment of functional value to latent variables.**

  *   **Established Labels:** "Normative Circularity," "Bayesian Just-So Story," "The Optimality Assumption."
  *   **Proposed Precise Label:** **Outcome-Dependent Normative Valence (ODNV).**
  *   **Core Mechanism:** The theory treats parameters as descriptive variables but evaluates them as normative virtues, with the normativity determined post-hoc by success.
  *   **Distinction:** Unlike ad hocness, it does not add hypotheses; it flips the semantic valence of existing parameters. Unlike underdetermination, it does not allow multiple theories; it allows one theory to absorb all outcomes by redefining "optimality."
  *   **Escape Condition:** The framework avoids ODNV only when parameters (precision, priors) are constrained by **independent measures** (neural physiology, environmental statistics) rather than inferred solely from the behavioral outcome they are meant to explain.

  In your seminar, if you wish to use a term that commands philosophical precision without simply shouting "unfalsifiable," I recommend using **"Normative Circularity"** for the general structural issue, and **"Outcome-Dependent Normative Valence"** when specifically discussing the relabeling of parameters (precision/priors) based on success or failure. This signals that you understand the formal machinery but are critiquing the *explanatory practice* surrounding it.
