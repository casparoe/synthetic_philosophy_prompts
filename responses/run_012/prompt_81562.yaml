answer: |-
  **1.** Braudel described the event as foam on the wave, superficial but visible. You describe the event as explanatorily inert. If a battle or a decree does no causal work, not even as a trigger, how do you distinguish your position from a hard determinism that simply denies the reality of the event, rather than just its causal weight?

  **2.** You argue that the decisive causal work is done by slow-moving structures like ecology and routine. In your method, how do you measure or demonstrate this "decisive" weight? Is there a quantitative threshold where structural pressure outweighs agency, or is this a qualitative judgment made only in retrospect?

  **3.** If events are causally inert, they cannot drive historical change. By what mechanism does a structure end or transform? If a demographic regime collapses, what causes the collapse if not a sequence of event-level failures or decisions that accumulate?

  **4.** *(Follow-up to 3)* You will likely reply that structures erode internally or reach tipping points. But is a tipping point not itself an event? If you classify the moment of transition as merely another structural phase, does the middle stratum of conjunctures become anything more than events at a slower tempo, and if so, why grant it ontological priority?

  **5.** Critics argue that a "structure" is a retrospective abstraction imposed on a tangle of local agencies. How do you distinguish a real structural constraint that existed for historical actors from a pattern you have imposed on the archive after the fact to make the data fit the *longue durée*?

  **6.** *(Follow-up to 5)* Your habitual move is to redescribe counterexamples as event-level phenomena and therefore beside the point. Does this redescription strategy render your thesis unfalsifiable? If every apparent counterexample is defined away as "merely an event," what evidence could possibly refute the claim that structures do all the work?

  **7.** If individuals are causally inert within the trajectories you describe, does moral responsibility survive your historiography? Can we coherently condemn a historical actor for a crime if their action was structurally determined and causally powerless to alter the outcome?

  **8.** *(Follow-up to 7)* You may separate historical explanation from moral judgment. But if your method treats individuals as causally inert, does it not amount to political quietism dressed up as method? If structures rule and events cannot redirect trajectories, what incentive does your history leave for political intervention in the present?

  **9.** To close, I want to ask about the limits of your own conviction. What specific piece of evidence or historical argument would lead you to abandon the strong thesis that events are explanatorily inert?

  **10.** *(Follow-up to 9)* Please name a specific historical turning point. If it were proven that a single individual's decision at that moment redirected the structural trajectory rather than merely riding it, would that force you to concede causal efficacy to the event, or would you still find a way to redescribe the decision as a structural product?
