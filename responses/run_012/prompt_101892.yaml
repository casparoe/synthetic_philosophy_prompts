      *   **Metric:** 0 Repeat Visits.
      *   **Goal:** Met.
      *   **Cost:** High for firm.
      *   **But the Metric is faithful to the Goal.**
      *   **Structural Feature:** **Substitutability of Effort.** (You can achieve the outcome via high effort/cost or low effort/cost, but both achieve the outcome).
      *   **Goodhart usually assumes gaming reduces effort/quality.** Here, gaming *increases* resource use to guarantee the metric.
      *   **This is the "Over-Compliance" Inversion.**
      *   **Scenario:** A **Warranty Service Center** for home electronics.
      *   **Target:** Customer Retention (driven by hassle-free repair).
      *   **Metric:** **Rate of "Return for Same Issue"** (within 90 days).
      *   **Gaming:** Technicians are authorized to swap entire units rather than repair components if the repair time exceeds 20 minutes. They do this always.
      *   **Why it works:** A new unit rarely fails immediately. The "Return Rate" stays near zero. This accurately reflects "Hassle-Free Experience."
      *   **Structural Feature:** **The "Gold-Plating" Loophole.** The agents can expend *more* resources than necessary to guarantee the outcome. Goodhart assumes agents take shortcuts. If the incentive structure allows (or inadvertently encourages) *over-delivery* to hit the target, the target remains valid.
      *   **Wait, is this "gaming"?** Yes, it's optimizing the metric by changing the process in a way management didn't intend (costing more).
      *   **Does it remain a faithful proxy?** Yes, for the Customer Experience.
      *   **What if the feature is removed?** If they are forced to repair, not replace, then they might do shoddy repairs to save time, and the Return Rate spikes (or they hide returns).
      *   **Skeptic:** "You're just measuring a different thing. You care about Profit + Satisfaction. The metric ignores Profit."
      *   **Rebuttal:** The prompt asks for *a* thing we care about. If we care about Satisfaction, it works.

      *Let's try to find a case where the gaming is *clever* but the structure forces truth.*
      *   **Institution:** **A City's Snow Removal Department.**
      *   **Goal:** Safe roads after storm.
      *   **Metric:** **Time to "Bare Pavement"** on arterial roads.
