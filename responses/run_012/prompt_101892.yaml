      *   **Structural Feature:** **The Goal is Binary and Downstream.** (Does it work? Yes/No). The metric measures the downstream state, not the upstream process. Gaming the process (throwing parts) still achieves the downstream state.
      *   **This is the one.** It inverts Goodhart because usually, gaming the process decouples it from the outcome. Here, the "gaming" is an *intensification of the work* that guarantees the outcome, rather than a *subversion* of the work.
      *   **Wait, is "throwing parts" gaming?** Yes, it's optimizing the metric (no callbacks) at the expense of a hidden cost (parts inventory), but if the *Target* is just "No Callbacks/Working Machine," it works.
