      *   **Gaming:** Technicians spend *more time* diagnosing to be sure. (Not gaming).
      *   **Gaming:** Technicians bribe customers? (Fraud).
      *   **Gaming:** Technicians prioritize easy jobs? (Cream skimming).
      *   **Let's go with the **Emergency Room Triage** again, but specific.**
      *   **Metric:** **Left Without Being Seen (LWBS) Rate.**
      *   **Goal:** Patient Access / Safety.
      *   **Gaming:** Triage nurses move patients to "hallway beds" quickly to stop the clock.
