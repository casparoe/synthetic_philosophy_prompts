      *   **Key Feature:** **Physical Capacity Constraint.** You can game the *definition* of "Seen" (hallway vs room), but you cannot game the *capacity* of the building. The metric hits a hard floor determined by square footage.
      *   **This is good.** It's structural.
      *   **Let's refine:**
      *   **Institution:** Urban Emergency Department.
      *   **Target:** Patient Safety (avoiding abandonment during critical need).
      *   **Metric:** LWBS Rate (patients who leave before provider contact).
      *   **Gaming:** Staff designate any physical space (hallway, waiting room chair) as a "bed" and initiate a chart to stop the LWBS clock.
