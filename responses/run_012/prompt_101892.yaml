      *   **Gaming** (reclassifying space) absorbs slack, but when the surge exceeds *total* capacity (including hallways), LWBS spikes.
      *   **So the metric still signals "Overwhelm."**
      *   **Structural Feature:** **The Exit Option.** (The customer can vote with their feet). The agents cannot force the customer to stay. Therefore, the metric reflects the *true* load vs. capacity, regardless of how the capacity is labeled.

      *Let's check constraints:*
      *   Ordinary institution? Yes (Hospital).
      *   No fraud? Reclassifying a chair as a bed is administrative gaming, not fraud.
      *   Structural feature? Yes (Customer Exit Option).
      *   Analysis required? Yes.

