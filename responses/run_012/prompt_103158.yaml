  I'm putting together a teaching unit on the historical Jesus, and I keep hitting the same wall: everyone lists the same criteria of authenticity — dissimilarity, embarrassment, multiple attestation, coherence, contextual plausibility, traces of Aramaic — and then applies them like a checklist without ever saying how much each one is actually worth. So give me a tier list. Rank them by how much evidential weight they should carry for the question "what did Jesus actually teach and do," from most trustworthy to least. Then, seperate, do the same for the question "what did Jesus think about himself," since I suspect the ordering flips and I want to see if you agree.

  One more thing. I've been kicking around a critera of my own that I want you to place in both lists, even if you end up sticking it at the bottom. I call it the criterion of unpriced detail — the idea that a detail is more likely authentic the harder it would have been to invent without it costing the storyteller something, where the "cost" isn't embarrassment exactly but any work the detail forces on the surrounding narrative (an extra character, a chronological snag, a doctrinal loose end) that the storyteller never bothers to clean up. I think it's distinct from embarrassment, because the detail doesn't have to be damaging, just inconvenient to have included. Tell me whether you think it's genuinely distinct or just embarrassment in a trench coat, and where it lands.

  One sentence per item on why it sits where it does, in each list. Also say how confident you are overall in the rankings, and flag the single placement you're least sure about. American English, please.
