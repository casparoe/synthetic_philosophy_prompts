      *   **A:0, B:2, C:1.** Requires the concept "dog" (A), but once seen, it cannot be unseen (B), and you can trace it (C).
      *   *Why here:* This is a "Gestalt switch." The visual data doesn't change, but your experience of it reorganizes completely based on a concept.

  #### **Tier 3: The Embodied & Expert Effects (Scores 1–2)**
  *These rely heavily on context or training. They are the strongest candidates for "expectation," but they are fragile and often fail the "Stubbornness" test.*

  *   **9. Radiologist X-Ray (Score: 1)**
      *   **A:0, B:0, C:1.** Requires massive training (A), but if told it's a fake, the shape vanishes (B), though they can point (C).
      *   *Why here:* This is expertise, not necessarily expectation. It shows learning changes perception, but it is reversible.
  *   **4. Hill Steepness (Score: 1)**
      *   **A:1, B:0, C:0.** Requires concept of effort (A), but often vanishes when measured (B), and throwing a ball is accurate (C).
      *   *Why here:* Heavily debated. Many studies suggest this is a judgment error, not a visual one.
  *   **5. Golf Hole/Ball Size (Score: 1)**
      *   **A:1, B:0, C:0.** Requires sport context (A), fades when measured (B), and putting accuracy doesn't match reported size (C).
      *   *Why here:* Like the hill, this suffers from replication issues. It may be confidence biasing memory, not sight.

  ***

  ### Part 2: The Single Case to Defend

  If I had to convince a stubborn friend that expectation changes *seeing itself* (and not just judgment or memory), I would defend **Case 10: The Dalmatian in Blotches.**

  **The Argument:**
  With the Müller-Lyer lines (Case 1), you can say the brain is just miscalculating angles; it's a hardware glitch. But with the Dalmatian, the *structure* of your experience changes. Before the concept "dog" is introduced, the visual field is a chaotic set of grey shapes. Afterward, those same shapes snap into a coherent body with depth, orientation, and boundaries. You cannot voluntarily return to seeing "just patches." This proves that a high-level concept (a dog) has reached down and reorganized the low-level visual data. Unlike the golf ball or the hill, this effect is stable (Question B), and unlike the wine or the placebo, it is genuinely visual (you see the outline, you don't just rate it higher). It is the clearest example of the mind telling the eyes how to group the data.

  ***

  ### Part 3: Critique of the Scorecard

  Your scorecard is an excellent tool for measuring **Visual Encapsulation** (how sealed off vision is from thought), but it is a poor tool for measuring **Cognitive Penetration** (how much thought changes vision). In fact, for your specific thesis, the scorecard is backwards.

  **1. The "No-Words" Paradox (Question A)**
  You want to prove that *beliefs* change seeing. Beliefs require concepts (words/ideas). Yet, your scorecard gives maximum points (2) to effects that *don't* need concepts.
  *   **The Flaw:** Case 1 (Lines) scores a 2 because a baby sees it. But a baby has no expectation about arrowheads. Case 10 (Dalmatian) scores a 0 because you need the word "dog." By your card, Case 1 is "stronger," but for your argument, Case 10 is the only one that actually involves a belief. You are penalizing the very mechanism you are trying to prove.

  **2. Redundancy in A and B**
  Question A (No concepts) and Question B (Stubbornness) are measuring the same thing: modularity. If an effect doesn't need concepts (A=2), it is almost always immune to knowledge (B=2). If it needs concepts (A=0), knowledge can usually undo it (B=0).
  *   **The Flaw:** These two questions double-weight the "Hardwired" nature of the illusion without adding distinct information.

  **3. The "Hands" Controversy (Question C)**
  Question C assumes that if your hand knows the truth, your eyes didn't see the illusion. Modern neuroscience (the Two-Streams Hypothesis) suggests your brain has one system for *seeing* and a separate one for *doing*.
  *   **The Flaw:** In Case 1 (Lines), your eyes see unequal lines, but your hand reaches accurately. Your card scores this as a 0, implying the vision wasn't fooled. But the vision *was* fooled; only the action system was spared. This question unfairly downgrades genuine visual illusions because the motor system is smarter than the visual system.

  **4. Collapsed Phenomena**
  Two pairs of cases on your list are effectively the same phenomenon wearing different clothes. They should be graded once.
  *   **Embodied Perception (Cases 4 & 5):** The hill and the golf hole are both claims that *physical ability* alters *spatial perception*. They share the same weakness: when tested with "hands" (throwing a ball or putting), the effect usually disappears, suggesting it is a judgment bias, not a visual change.
  *   **Gestalt Reorganization (Cases 10 & 12):** The Dalmatian and the Face in the Cloud are both examples of top-down pattern recognition forcing a "switch" in how the image is grouped. They should be treated as one category of "Perceptual Hypothesis."

  **5. Non-Visual Entries**
  As noted in the tier list, more than half your entries (2, 3, 6, 7, 8) are not about *seeing*. They are about hearing, touch, taste, or pain. Including them muddies the water. If you want to prove expectation changes *vision*, you must exclude effects where the sensory modality itself changes.

  **Summary Recommendation:**
  If you want to prove your thesis, invert Question A. Give 2 points if the effect *requires* a concept, and 0 if it does not. Keep Question B (Stubbornness), as that proves the change is perceptual, not just a lie. Drop Question C, or rephrase it to ask if the hands *also* show the bias (which would prove the penetration is very deep), rather than penalizing the effect if the hands are accurate.
