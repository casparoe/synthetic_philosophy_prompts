      *Analysis:* Design 1 (Didactic) establishes the *Fact*. Design 2 (Ephemeral) negotiates the *Meaning*. In colonial contexts, the Fact is often denied (Contest over Fact). If the Fact is denied, Design 2 allows the denial to creep in via "artistic interpretation." Design 1 forces the confrontation. However, the Charter is "repair relations." Forcing a truth on an unwilling populace might break relations. But *allowing* ambiguity might enable denial.
