          *   Live Application: Mid-sized city, 19th-century indigenous massacre. Victims' descendants are a minority in the city, majority in neighboring jurisdiction. Two designs: (1) Didactic/Permanent (names, dates, school visits), (2) Ephemeral/Artistic (unmarked, rotating commissions, dismantled in 30 years unless renewed).
