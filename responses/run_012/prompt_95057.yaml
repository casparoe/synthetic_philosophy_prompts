answer: |-
  To the Grants Committee,

  Regarding the pending application for the indigenous massacre memorial, I recommend we fund the second design—the ephemeral, rotating structure—but with strict conditions. We must require that the historical archive supporting the event be permanently housed in a trusted institution, such as a university library or the neighboring jurisdiction's tribal headquarters, accessible regardless of the memorial's physical status. Furthermore, the renewal vote after thirty years cannot be a simple majority of city residents; it must require concurrent approval from the descendant community in the neighboring jurisdiction. Verification of these conditions should fall to a third-party auditor appointed by the foundation, with funding released in tranches contingent on their compliance. This decision should be finalized within thirty days to allow the city to adjust its budget cycle.

  I argue for this despite my own scientific instinct that permanent record is superior to ephemeral art. You have worried that preferring the second design is a failure of courage, masking evidentiary uncertainty as intellectual humility. I believe the opposite is true. In a context where the descendants are a minority within the polity, the didactic design risks becoming a static target—a statement of fact that the majority can ignore or vandalize while claiming the city has "dealt with" the past. The ephemeral design demands ongoing labor. It forces the living community to repeatedly choose to remember. That is not cowardice; it is a demand for active consent rather than passive compliance. However, without the condition of permanent archival storage, this design would indeed be cowardice, allowing the fact itself to dissolve. The archive secures the evidence; the memorial secures the relationship.

  Consequently, the German default model in our draft guidelines must be rejected. It presupposes a perpetrating state that has already undergone moral suicide and rebirth, a condition rarely met outside post-1945 Germany. I propose we replace it with a "Relational Viability" default. The new policy should read: "Funding requires evidence that the commemorative process is co-stewardized by victim descendants and that the hosting polity acknowledges the historical baseline." Where the three tests are currently used, Presence must be elevated above Continuity. Continuity is often a legal fiction; states change names and constitutions to evade guilt. Presence is the mechanism of our charter's repair. If descendants are absent, repair is impossible, only management. Where Continuity is high but Presence is low, we should not fund memorials intended to repair local relations, as there is no relation to repair. Regarding the distinction between contest over fact and contest over meaning: this is often a false binary used to sanitize denial. When an applicant claims a dispute is merely about "meaning," we must verify if the "meaning" dispute relies on negating the fact. If so, funding is withheld until the factual baseline is established in the public record, even if not on the memorial itself. This new policy applies immediately to the three queued applications; those lacking descendant co-stewardship or factual baseline agreement should be returned for revision.

  You asked whether the four cases the board invokes support a general model. They do not. They are rhetorical furniture, not precedents. Germany is an outlier of total military defeat and external imposition of memory. Japan represents a state that admits facts but contests meaning through ritual ambiguity. Turkey represents state denial protected by sovereignty. The American South represents a sub-national insurgency where the federal state opposes the local memory. These cases pull our tests in contradictory directions because they are historically specific pathologies, not typologies. Relying on them creates policy silence where continuity is low but presence is high, or where denial is entangled with interpretive dispute. The fact-versus-meaning distinction is particularly dangerous. It suggests we can fund a project where the fact is admitted but the meaning is fought over. In practice, meaning disputes often function as proxy fact disputes. If a community argues a massacre was "tragic but necessary," they are contesting the moral fact, which undermines the relational repair. We must treat entrenched meaning disputes as factual contests for the purpose of funding eligibility.

  This leads to the worry regarding our charter. If our purpose is to repair relations among living communities, a project concerning the dead serves only insofar as it alters the standing of the living. If the descendants are absent from the polity entirely, the memorial cannot repair relations between victims and perpetrators, because one party is not present to receive the repair. In such cases, the project becomes solely about the moral education of the perpetrator's descendants. This is a valid charitable aim, but it is not "relational repair." Therefore, the Presence test is not a distraction; it is the operational definition of our charter. To fund a memorial where descendants are absent is to fund conscience, not relation. We must admit this distinction. If we fund where presence is low, we must rename the goal in our internal documents from "repair" to "acknowledgment." But for this application, where descendants exist in a neighboring jurisdiction, they are sufficiently "present" to be partners, provided our conditions grant them veto power.

  In summary, do not let your scientific background convince you that permanent text is the only form of truth. In public history, truth that is rejected by the living community is socially false, regardless of its archival accuracy. The second design, conditioned on archival permanence and descendant veto, offers the best chance of making the truth socially alive. It requires more courage than stone, because it risks being voted away. That risk is the price of repair.

  Respectfully,

  [Your Name]
