answer: |-
  # Q&A Prep Sheet: Baseline Relativism and Omissive Causation

  **Strategy Note:** Your core vulnerability is the charge that you have dissolved causation into normativity. The metaphysicians will smell anti-realism; the lawyers will smell the collapse of the negligence elements. Your defense must be that you are offering a *semantic* account of causal claims, not an *ontological* reduction of causal powers. You are explaining the truth conditions of the *sentence*, not eliminating the *relation*. Walk the line: the causal structure is real and invariant; the *selection* of the omission as a cause is baseline-relative.

  ---

  ### 1. The "Collapse" Objection (Likelihood: High | Damage: Critical)
  **Who:** The senior Torts Scholar (worried about doctrinal structure).
  **The Objection:** "In negligence, we keep Duty and Causation separate for a reason. Duty asks what you owed; Causation asks what your breach did. If the baseline for causation is fixed by duty, you've collapsed the two elements. Now, whenever there is a duty, there is causation. You've turned causation into a rubber stamp for liability."
  **Steelman:** If the baseline is "what was owed," and the defendant owed it, then any departure is a cause. This eliminates causation's role as an independent limit on liability.
  **Two-Minute Reply:** "I'm not collapsing the *questions*, only the *input* for the contrast class. Duty asks: 'Was there an obligation to act?' Causation asks: 'Given that obligation set the baseline, did the failure to act make the difference to the outcome?' We can still have a duty without causation (e.g., I owed you a rescue, but you would have died anyway). The baseline sets the *scenario* for the counterfactual test; it doesn't guarantee the *result* of the test."
  **Concede Up Front:** Concede that on your view, the *scope* of causal inquiry is narrowed by normative factors earlier than traditional models allow.
  **Soft Spot:** Cases where the duty is vague. If the baseline is "reasonable care," and causation is "departure from baseline," the jury is effectively asked the same question twice under different labels.
  **Grade:** **Hold the Spirit, Concede the Letter.** Admit the inputs overlap, insist the logical operations remain distinct.
  **Crux:** Whether causation must be a *purely factual* constraint on liability to serve its limiting function.

  ### 2. The "Anti-Realist" Objection (Likelihood: High | Damage: Critical)
  **Who:** The Humean or Mechanist Metaphysician (worried about mind-independence).
  **The Objection:** "Causation is a relation in the world, not a relation in our descriptions. By making truth relative to a 'selected baseline,' you've made causation interest-relative. That's not causation; that's explanation. You've changed the subject from metaphysics to pragmatics."
  **Steelman:** If two observers have different normative expectations, your view says they report different causal facts about the same event. That violates the objectivity of causal structure.
  **Two-Minute Reply:** "Distinguish the *causal structure* from the *causal claim*. The structure (the counterfactual dependencies, the mechanisms) is invariant. But the sentence 'The omission caused the harm' is a claim about a specific contrast: 'This event rather than *that* baseline.' The world doesn't tell us which contrast is salient; our practices do. I'm not denying the physics; I'm analyzing the truth conditions of the attribution."
  **Concede Up Front:** Concede that you are rejecting the view that causal *statements* map one-to-one onto mind-independent relations without pragmatic filtering.
  **Soft Spot:** If the baseline is purely pragmatic, why does the law treat causation as a finding of fact rather than a matter of policy? You're asking them to treat a policy choice as a factual finding.
  **Grade:** **Hold.** This is your core thesis. Do not yield on the pragmatism of the baseline.
  **Crux:** Whether causal *truths* can be partially constituted by normative expectations without ceasing to be truths.

  ### 3. The "Starving Children" Objection (Likelihood: High | Damage: High)
  **Who:** The Interventionist Metaphysician (worried about variable selection).
  **The Objection:** "If baselines are just 'what is expected,' what stops the explosion of causes? I didn't send money to the starving child. That was an omission. It was counterfactually necessary. On your view, is the baseline fixed by my moral obligation? If so, I'm a cause. If not, why not? You need a metaphysical filter, not just a normative one."
  **Steelman:** Without a metaphysical constraint on which omissions count, every non-act is a cause relative to *some* normative baseline. Your theory risks making causation ubiquitous.
  **Two-Minute Reply:** "The baseline isn't 'what is morally ideal'; it's 'what is locally expected or owed within the specific practice.' I have no duty to the distant child in the relevant legal or local social context, so that omission doesn't enter the baseline for *this* causal inquiry. The normativity isn't global morality; it's the specific role-based expectation."
  **Concede Up Front:** Concede that the line between 'local expectation' and 'global morality' is fuzzy, but insist it's a fuzzy line we navigate in law already.
  **Soft Spot:** Hard cases where the duty is emerging or contested (e.g., climate change omissions). If the duty is unclear, is the causation fact indeterminate?
  **Grade:** **Hold.** This is the strength of your view (it explains why we don't blame everyone).
  **Crux:** Whether the baseline is fixed by *existing* norms or *justified* norms.

  ### 4. The "Actus Reus" Objection (Likelihood: Medium | Damage: High)
  **Who:** The Criminal Law Scholar (worried about liberty).
  **The Objection:** "In criminal law, we punish acts, not statuses. If you say omissions are causes just like acts, provided there's a duty, you blur the line between doing and allowing. If causation is just 'departure from baseline,' aren't you punishing people for who they are (someone who didn't act) rather than what they did?"
  **Steelman:** Your view makes it too easy to criminalize omissions. If causation is satisfied by normative baseline departure, the heavy lifting shifts entirely to Duty, which is easier to expand than Actus Reus.
  **Two-Minute Reply:** "I'm not arguing for expanding criminal liability. I'm arguing that *when* we do punish omissions, it's not because they have a special 'omissive causation' magic. It's because we've established a duty that sets the baseline. The protection for liberty comes from a strict requirement on the Duty element, not from pretending the Causation element is metaphysically different."
  **Concede Up Front:** Concede that your view removes a metaphysical barrier to omission liability, placing the entire burden on the normative justification of the duty.
  **Soft Spot:** If the metaphysical barrier is gone, what stops a legislature from creating duties for trivial omissions and calling them crimes?
  **Grade:** **Concede the Letter, Hold the Spirit.** Admit the metaphysical shield is gone, argue the normative shield must be strengthened.
  **Crux:** Whether the act/omission distinction serves a liberty-protecting function that your view undermines.

  ### 5. The "Pre-emption" Objection (Likelihood: Medium | Damage: Medium)
  **Who:** The Metaphysician specializing in counterfactuals.
  **The Objection:** "Two lifeguards are on duty. Both omit to save the swimmer. Either one could have saved him. On standard counterfactual accounts, neither is a cause (pre-emption/overdetermination). On your view, both had a duty, both departed the baseline. Are both causes? If so, you violate the intuition that the swimmer didn't need *both*. If not, how does your baseline handle joint duties?"
  **Steelman:** Your baseline theory doesn't solve the structural puzzles of causation; it just layers norms on top of them. It fails to resolve the technical paradoxes.
  **Two-Minute Reply:** "In joint duty cases, the baseline is 'at least one guardian acts.' If both omit, the departure is collective. We can treat them as joint causes of the harm. My view doesn't solve pre-emption magically, but it clarifies why we treat them differently than two random bystanders: the baseline expectation was structured for redundancy."
  **Concede Up Front:** Concede that baseline relativism doesn't dissolve standard overdetermination puzzles; it just relocates them to the specification of the baseline.
  **Soft Spot:** If the baseline is "at least one acts," and Guard A omits, did A cause the harm if B also omitted? Technically, A's omission wasn't necessary if B also failed. You need a nuanced account of 'necessary relative to baseline.'
  **Grade:** **Hold.** This is a technical detail you can work out, not a fatal flaw.
  **Crux:** Whether the baseline is defined individualistically or collectively in joint-duty cases.

  ### 6. The "Verbal Dispute" Objection (Likelihood: Low | Damage: Medium)
  **Who:** The Omission Specialist (worried their work is obsolete).
  **The Objection:** "You say there's no distinct relation, just a baseline shift. But everyone already knows omissions involve norms. You're just renaming 'duty' as 'baseline.' You haven't solved the metaphysical problem; you've just stipulated it away by calling it pragmatics."
  **Steelman:** This is terminological reshuffling. It adds no predictive power and solves no new cases.
  **Two-Minute Reply:** "It's not verbal if it changes how we litigate. If courts stop looking for a 'causal spark' in omissions and start arguing explicitly about the baseline expectation, we get clearer opinions. It moves the fight from 'Was this a cause?' (metaphysics) to 'Was this the right baseline?' (policy). That's progress."
  **Concede Up Front:** Concede that the *extension* of the term 'cause' might not change much in easy cases.
  **Soft Spot:** In hard cases, does your view actually yield different verdicts, or just different rationales for the same verdicts?
  **Grade:** **Hold.** The payoff is doctrinal clarity, not new verdicts.
  **Crux:** Whether the value of a theory of causation is metaphysical discovery or doctrinal clarity.

  ---

  ### Pre-Emptions (Open with these)

  1.  **The "Collapse" Worry:** Explicitly state in the intro: "I am not arguing that Duty and Causation are the same legal element. I am arguing that the *factual input* for the Causation test is normatively loaded. This preserves the two-step analysis while explaining why they feel intertwined."
  2.  **The "Starving Children" Worry:** Give the "local expectation" example early. "When I say baseline is normative, I mean locally institutionalized norms, not global morality. This prevents the explosion of causes."

  ---

  ### The Question You Hope Nobody Asks

  **"If the baseline is fixed by norms, and norms can be unjust, is causation factually different in a just society than in an unjust one? If a slave owner omits to feed a slave, is the causation of death different in a legal system that recognizes the duty versus one that doesn't?"**

  *Why this kills you:* It forces you to admit that on your view, causal *truths* change when the law changes, even if the physical events are identical. This confirms the Anti-Realist objection in the most morally charged way possible. It suggests there is no "fact of the matter" about causation independent of the legal regime's morality.

  *Preparation:* If asked, pivot to **epistemic access**. "The causal structure (the starvation mechanism) is invariant. But the truth of the claim 'The owner caused the death' depends on whether the owner was *capable of being expected* to act. In an unjust system, the expectation is suppressed, making the causal attribution socially unintelligible, even if physically robust." (This is weak, but it's your best hold).
