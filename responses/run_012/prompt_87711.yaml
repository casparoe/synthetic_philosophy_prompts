      *(Self-Correction during drafting)*: Make sure the "Reply" distinguishes between the *metaphysical* claim (causation is uniform) and the *explanatory* claim (we select baselines for reasons). The key move is that causation is *binary* (present/absent) but *explanation* is contrastive. Wait, the prompt says "true only relative to a baseline." That's a truth-conditional claim, not just explanatory. I need to be careful not to slide into "causation is real, explanation is pragmatic." The prompt says "sentence... is true only relative to a baseline." I must defend *truth* relativism, not just *assertability*.

