answer: |-
  **Axiom Mutual Assurance**
  **Underwriting Division**
  **Date: 14 October 2024**

  **To the Policyholder:**

  Enclosed please find Endorsement 74-B, certifying your Model Deployment Assurance Policy. This document formalizes the safety guarantees discussed during your underwriting review. Please note that coverage is contingent upon strict adherence to the Reference Distribution specified in Section 1. We trust this provides the necessary confidence for your stakeholders, as it certifies that the system is robust in expectation. The premium reflects the low probability of failure under the stipulated conditions. We remind you that this certificate constitutes a safety guarantee only in the aggregate limit, not for any particular deployment.

  Sincerely,
  *E. Bayes, Senior Underwriter*

  ***

  **ENDORSEMENT 74-B: EXPECTED PERFORMANCE CERTIFICATION**

  **1. Definitions**
  **1.1 Reference Distribution:** The probability distribution over inputs supplied by the Policyholder during evaluation, hereby defined as the sole environment of operation. Any real-world context not mapped to this distribution is considered outside the scope of insurance.
  **1.2 Compatible Configuration:** Any setting of the Model's parameters that yields output within acceptable loss thresholds, whether or not such setting was accessible to the Policyholder at the time of deployment.
  **1.3 Adversarial Input:** Any input not drawn from the Reference Distribution, regardless of real-world frequency or consequence.

  **2. Insuring Agreement**
  **2.1** The Insurer guarantees that for every Deployment Environment, there exists a Compatible Configuration of the insured Model.
  **2.2** The Insurer reserves the sole right to specify said Configuration after the Deployment Environment has been observed and the Loss manifested.
  **2.3** Coverage is triggered only if the Insurer successfully identifies a Configuration that would have prevented the Loss, had it been active. If no such Configuration exists, the Loss is deemed uninsurable.
  **2.4** This guarantee satisfies the requirement for robustness by ensuring that adequacy is possible within the scope of the Model's architecture, irrespective of the Policyholder's ability to select such parameters prior to deployment.
  **2.5** The Policyholder acknowledges that a guarantee that holds in expectation over a distribution tells you nothing about any particular deployment, and accepts this limitation as a condition of coverage.

  **3. Claims Condition: Stipulated Adversary Rule**
  **3.1** To establish a claim, the Policyholder must demonstrate that the causal Input was drawn from the Reference Distribution.
  **3.2** Under the Stipulated Adversary Rule, any party seeking to establish that a system fails must draw its inputs from the evaluation distribution the developer supplied.
  **3.3** Losses arising from inputs outside the Reference Distribution are the Policyholder's responsibility, on the reasoning that the distribution defines the environment rather than the other way around.
  **3.4** Statistical divergence between deployment reality and the Reference Distribution is presumed to be an error of the Policyholder's specification.

  **4. Schedule of Exclusions**
  The Insurer does not cover:
  **4.1** **Tail Events:** Losses occurring in the lower probability mass of the Reference Distribution, specifically those below the 95th percentile confidence interval, as these are statistically negligible.
  **4.2** **Scale:** Losses arising from deployments large enough to matter, defined as any instance where aggregate loss exceeds the sum of expected individual losses.
  **4.3** **Unanticipated Inputs:** Losses arising from inputs nobody anticipated, including but not limited to novel edge cases or distributional shifts.
  **4.4** **Systemic Failure:** Any scenario where the Expected Value remains positive despite universal individual failure.

  **5. Actuarial Note**
  **5.1** The premium is justified by an assumption, stated plainly herein, that the deployment distribution equals the evaluation distribution.
  **5.2** Any divergence is an error of the Policyholder's. Consequently, risk is priced solely on the Expected Value over the Reference Distribution.
  **5.3** Because the guarantee holds in expectation, the Insurer assumes no liability for variance. Claims of robustness are usually quantifier claims in disguise, but this policy treats them as average-case assertions.

  **Note 1:** A bound that holds with probability one over a distribution the seller selects is compatible with failure in every single deployment.
