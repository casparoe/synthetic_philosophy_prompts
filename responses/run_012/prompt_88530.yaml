answer: |-
  Here is the breakdown of your friend's critical apparatus, her likely verdict on the upcoming book, and how you can test her actual operating system.

  ### 1. The Verdict on the Drunk Memoir
  **She is going to hate it.**

  Despite the "wreck of a past" (which she liked in Verdict #5) and the "small scale" (which she liked in Verdict #3), the mechanism of redemption violates her core aesthetic.

  To her, a sudden divine intervention is functionally identical to a miracle. It removes **agency**. If God spoke to her and she was fixed, she didn't *build* her virtue; she was *granted* it. Your friend values the *construction* of character, not the *restoration* of character. She wants to see the mortar being mixed, not the wall appearing overnight.

  She will likely say something like: *"It's a nice story, but it's not useful. You can't tell someone to wait for God to speak to them. There's no method here."*

  ### 2. The Primary Rule: "Replicable Effort" (The Ethics of Mimesis)
  Your friend is reading through a lens of **Pragmatic Humanism**. She is treating these biographies as instruction manuals.

  *   **The Rule:** A life is only morally instructive if the reader can reasonably emulate the *process* of the subject's improvement.
  *   **Why Plutarch?** Plutarch's *Lives* weren't just history; they were ethical mirrors. He believed looking at the lives of great men would provoke readers to imitate their virtues. Your friend has updated this for the modern secular age: She doesn't want "Great Men"; she wants "Real People." But the Plutarchan goal remains: **Mimesis.**
  *   **The Filter:**
      *   **Miracles/Divine Voice:** Not replicable. (Reject)
      *   **Instant Change:** Not replicable. You can't emulate a switch flip. (Reject)
      *   **Unglamorous Effort/Doubt:** Highly replicable. Everyone can try to be less of a jerk tomorrow. (Accept)

  She isn't looking for *truth*; she is looking for *utility*.

  ### 3. Alternative Rules (Competing Hypotheses)
  To be a good novelist (and a good reading group member), you should consider if her rule is actually something else. Here are two strong alternatives:

  **A. The Epistemology of Doubt**
  *   **The Theory:** She distrusts certainty.
  *   **Evidence:** The "Classic Saint" had "not one moment of doubt" (No). The "Drunk Saint" claims absolute certainty that God spoke (Likely No). The "Nobody" and the "Bystander" are both defined by hesitation, questioning, and slow realization (Yes).
  *   **The Rule:** Moral worth is proportional to the amount of doubt experienced during the moral act. If you *know* you're right (because God told you), it doesn't count as virtue.

  **B. The Scale of Intimacy**
  *   **The Theory:** She rejects the "Public Sphere" in favor of the "Private Sphere."
  *   **Evidence:** The General (Public/Battles) is out. The Saint (Public/Holiness) is out. The Nobody (Private/Family) is in. The Bystander (Private/Conscience) is in.
  *   **The Rule:** Moral change only matters if it happens in the domestic or interpersonal realm, not the historical or institutional realm.
  *   **Weakness:** This doesn't explain why she rejected the "Classic Saint" (who often worked in communities) vs. the "Wreck Saint" (who also likely worked in communities). The *process* seems more important than the *setting*.

  ### 4. The Test: How to Isolate the Variable
  To find out if she rejects the Drunk Memoir because of **God** (Divine Intervention) or because of **Speed** (Instant Change), you need a book that splits those variables.

  **The Book to Pick Next:**
  ***My Stroke of Insight* by Jill Bolte Taylor**

  *   **The Premise:** A neuroanatomist has a massive stroke. In a matter of hours, her left brain (logic, ego, grievance) shuts down, and she is left in a state of pure, peaceful, connected consciousness. She recovers over years, but the *moral shift*—the loss of anger and ego—happens instantly due to a biological event.
  *   **Why it tests the rule:**
      *   **It is Instant:** Like the Drunk Memoir.
      *   **It is Secular:** It is biology, not God.
      *   **It is a "Wreck" to "Saint" arc:** She goes from a high-stress scientist to a advocate for peace.

  **How to read her reaction:**
  *   **If she says YES:** Her rule is **Secular Humanism.** She accepts instant change as long as it has a naturalistic explanation (biology/psychology) rather than a supernatural one. She rejected the Drunk Memoir because of the *God* element.
  *   **If she says NO:** Her rule is **The Sanctity of the Grind.** She rejects *any* instant transformation, regardless of cause. To her, virtue *must* be slow. If it's easy or fast, it's not virtuous.

  **The "Nuclear Option" Test:**
  If you want to really challenge her Plutarchan side, suggest **"The Autobiography of Malcolm X."**
  *   It features a life of crime (Wreck).
  *   It features a sudden conversion in prison (Instant/Divine).
  *   It features a slow political evolution afterward (Gradual/Effort).
  *   It features immense doubt at the end (Pilgrimage to Mecca).

  It violates almost all her binary rules, which will force her to articulate a more nuanced philosophy. But for a clean scientific test of her current criteria, go with the Neuroanatomist.

  ### Summary for your Group Discussion
  When you discuss the Drunk Memoir, watch for this phrase: **"What is the takeaway?"**

  If she says, *"The takeaway is that grace exists,"* she will accept it.
  If she says, *"The takeaway is that she got lucky,"* she will reject it.

  My bet is on the latter. She wants a ladder she can climb, not a helicopter rescue.
