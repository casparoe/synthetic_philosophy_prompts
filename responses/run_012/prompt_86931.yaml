  **MEMORANDUM**

  **TO:** The Board of Governors
  **FROM:** Standing Committee on the Honour Code
  **DATE:** October 14, 2023
  **SUBJECT:** Grounding of Normative Obligations Post-Revision

  Following the excision of transcendent referents from the Student Handbook, the Committee was tasked with establishing why the Honour Code remains binding upon the student body. The Committee submits the following findings regarding the source and scope of institutional authority.

  **Findings of Fact**

  1.  The Honour Code requires a binding agent to enforce compliance.
  2.  Previous iterations relied upon external metaphysical guarantees.
  3.  Such guarantees are no longer compatible with secular governance structures.
  4.  **The Honour Code derives its binding force solely from the enacted will of the Board of Governors.** A rule is binding because the Board wills it; there is no prior obligation that compels the Board's hand.

  *[Note from Member Harman: Does the Board will the Code because it binds, or does it bind because the Board wills it?]*

  **Committee Reply to Note:** The Committee notes that the causal directionality of normative obligation falls outside the remit of this sub-committee. Furthermore, inquiries into the motivational structure of the Board constitute a jurisdictional overreach. The record reflects that the Board possesses the authority to will; whether that authority is exercised in response to pre-existing bindingness is a matter for the Board's internal deliberation, not this Committee's adjudication. We proceed on the assumption that the will is sufficient.

  5.  Compliance mechanisms remain unchanged.
  6.  Sanctions are enforceable regardless of metaphysical grounding.
  7.  **Clause 9.2 passed by a vote of 7-4.** The four dissenting members publicly stated the clause was unjust prior to the vote.

  **Ruling on Finding 7:** To preserve institutional cohesion, the Committee rules that only pronouncements issued unanimously by the Board count as binding. Dissenting opinions indicate a fracture in the institutional will, rendering the clause non-binding until consensus is achieved. This ensures the Code reflects the unified character of the Board.

  **Appendix A: Ontological Status of the Board**

  Concerns were raised that Finding 4 renders the Code contingent on mere preference, while Finding 7 suggests an external standard of justice exists that the Board failed to meet. To resolve this, the Committee posits that the Board's own institutional character is the standard. The Code is neither above the Board nor invented by it ex nihilo; rather, it is an expression of what the Board *is*. This avoids the charge of arbitrariness regarding both the source of authority and the substantive quality of the rules.¹

  **Recommendations**

  The Committee observes a practical fallout: we cannot tell whether any given pronouncement of the Board is just, because our procedure for answering that question just *is* the Board's pronouncements. We lack an independent metric to assess the Board's character without referencing the Board's output. Consequently, the Committee recommends renaming the Ethics Office to the "Office of Procedural Alignment" to better reflect this circularity.

  The Honour Code remains in full force. The question of why it binds is hereby filed under "Pending Structural Review" indefinitely.

  ***

  ¹ *Dissenting Note (Member Harman): Substituting "the Board" for "the community", "our tradition", or "what an informed and impartial observer would approve of" yields no functional change in this logic. Whatever the Committee thinks it has grounded, it hasn't grounded it in anything in particular.*
