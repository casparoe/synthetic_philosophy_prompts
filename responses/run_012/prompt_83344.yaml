answer: |-
  Here is the spec. I have organized it into Ontological Constraints, Modal/Temporal Constraints, and Semantic/Conceptual Constraints. Each item includes the specific case or consideration that generates the requirement.

  ### The Spec: Desiderata for Material Constitution

  **I. Ontological & Physical Constraints**

  1.  **Microphysical Supervenience**
      *   *Requirement:* The theory cannot posit extra physical stuff or forces; the statue's physical properties must be fully determined by the clay's physical properties.
      *   *Case/Consideration:* Spectroscopy of the bronze shows only copper and tin; no "statue-ium" appears when the sculptor finishes work.

  2.  **Spatial Coincidence**
      *   *Requirement:* The theory must account for two entities occupying the exact same spatial region at the same time (if they are distinct) or explain why this is impossible.
      *   *Case/Consideration:* The lump and the statue share all spatial parts from the moment the mold sets until the crush.

  3.  **Counting**
      *   *Requirement:* The theory must provide a determinate answer to "How many objects are on the pedestal?" without equivocation.
      *   *Case/Consideration:* If you insure the artwork, do you pay one premium or two? Common sense says one, logic often suggests two.

  4.  **Causal Non-Redundancy**
      *   *Requirement:* If distinct, the theory must explain why the statue and the lump do not cause double the effects (e.g., weighing down the floor).
      *   *Case/Consideration:* The pedestal cracks under the weight, not twice as much weight, despite potentially two objects being present.

  **II. Modal & Temporal Constraints**

  5.  **Divergent Survival Conditions**
      *   *Requirement:* The theory must explain how one entity can survive a transformation that destroys the other.
      *   *Case/Consideration:* Squashing the object destroys the statue (it loses form) but preserves the lump (the clay remains).

  6.  **Part Replacement (Diachronic Identity)**
      *   *Requirement:* The theory must distinguish between the identity conditions of the artifact and the matter regarding part replacement.
      *   *Case/Consideration:* **The Bronze Horse:** Replacing the tail with new bronze preserves the *statue* (historical continuity/form) but alters the *lump* (numerical identity of the matter).

  7.  **Reassembly vs. Continuity**
      *   *Requirement:* The theory must adjudicate between spatio-temporal continuity and mereological reassembly for persistence.
      *   *Case/Consideration:* **Ship of Theseus:** If planks are replaced one by one, is it the same ship? If old planks are reassembled elsewhere, is *that* the ship?

  8.  **Vagueness of Boundaries**
      *   *Requirement:* The theory must handle cases where it is indeterminate whether a part belongs to the object.
      *   *Case/Consideration:* **Tibbles the Cat:** Removing one hair doesn't destroy the cat, but removing them all does; there is no precise hair count where "cat" becomes "non-cat."

  **III. Semantic & Conceptual Constraints**

  9.  **Sortal Dependence**
      *   *Requirement:* The theory must explain whether objecthood depends on classification (sortals) or is mind-independent.
      *   *Case/Consideration:* **Sculptor vs. Toddler:** Same shape, same clay. Does the sculptor create a *statue* while the toddler creates only a *lump* due to intentionality?

  10. **Leibniz's Law Compliance**
      *   *Requirement:* If the statue and lump are identical, they must share all properties. If distinct, the theory must justify the failure of indiscernibility.
      *   *Case/Consideration:* The lump has the property "could survive squashing"; the statue has "could not survive squashing."

  11. **Grounding of Modal Facts**
      *   *Requirement:* If modal properties differ, the theory must explain what non-modal fact grounds this difference.
      *   *Case/Consideration:* If the physical arrangement is identical at *t*, what makes it true that one *would* survive *t+1* and the other would not?

  ---

  ### Analysis of the Spec

  **Non-Negotiable vs. Negotiable**
  *   **Non-Negotiable:** *Microphysical Supervenience* (1) and *Divergent Survival Conditions* (5). You cannot deny chemistry, and you cannot deny that a squashed lump is no longer a statue. Any theory violating these is scientifically or phenomenologically dead.
  *   **Negotiable:** *Counting* (3) and *Spatial Coincidence* (2). Common sense says "one object," but philosophy often forces us to accept "two coincident objects" or "zero statues." You can trade intuitive counting for logical consistency.
  *   **Negotiable:** *Sortal Dependence* (9). You can argue artifacts are mind-independent (the toddler made a statue accidentally) or mind-dependent (no intention, no artifact).

  **The Incompatibility: The Grounding Problem**
  Your suspicion is correct. There is a direct tension between **Microphysical Supervenience (1)** and **Divergent Survival Conditions (5)** mediated by **Grounding of Modal Facts (11)**.
  *   If the physical facts are identical at *t* (Supervenience), and modal facts must be grounded in non-modal facts (Grounding), then the statue and lump should have the same modal properties.
  *   But they *don't* (Survival Conditions).
  *   *Result:* You must either deny that modal properties differ (claim they are identical and our intuitions about squashing are wrong), deny that physical facts are identical (claim there is a hidden historical/intentional fact), or deny that modal facts need grounding in the present physical state (brute modal facts).

  **The Requirement That Does The Most Work**
  **Leibniz's Law Compliance (10)** combined with **Divergent Survival Conditions (5)**.
  This pair forces the hand of almost every theory.
  *   If you keep Leibniz's Law and the Modal Difference, you *must* have two objects (Constitution View).
  *   If you keep Leibniz's Law and want one object, you *must* deny the Modal Difference (Identity View/4Dism).
  *   If you want one object and keep the Modal Difference, you *must* restrict Leibniz's Law (Relative Identity).
  *   This triad rules out more positions than any other constraint.

  ---

  ### How The Usual Four Fare

  **1. Constitution View (Distinct but Coincident Objects)**
  *   *Passes:* Modal differences, Survival conditions, Leibniz's Law.
  *   *Fails:* Counting (commits to two things in one place), Causal Non-Redundancy (risks overdetermination), Microphysical Supervenience (struggles to ground the modal difference physically).

  **2. Four-Dimensionalism (Perdurantism)**
  *   *Passes:* Microphysical Supervenience, Counting (statue and lump are different temporal slices of a space-time worm), Vagueness.
  *   *Fails:* Intuitive persistence (we feel like 3D objects enduring, not 4D worms), Sculptor/Toddler (struggles to explain why intention slices the worm differently).

  **3. Mereological Nihilism (Only simples exist)**
  *   *Passes:* Microphysical Supervenience, Counting (only many atoms, no composite objects), Causal Non-Redundancy.
  *   *Fails:* Existence of Statues (eliminates the datum entirely), Divergent Survival Conditions (nothing survives, only atoms rearrange).

  **4. Eliminativism (No statues, only lumps)**
  *   *Passes:* Counting (one thing), Microphysical Supervenience, Causal Non-Redundancy.
  *   *Fails:* Divergent Survival Conditions (cannot explain why we treat the squashed object differently), Sortal Dependence (ignores the functional difference between art and debris).
