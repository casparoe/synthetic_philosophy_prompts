answer: |-
  # Specification of Desiderata for a Theory of Moore-Paradoxicality

  **Subject:** Graduate Seminar on Belief, Assertion, and the Semantics/Pragmatics Boundary
  **Objective:** Define the necessary and sufficient conditions (desiderata) for any adequate theory of Moore-paradoxicality.
  **Constraint:** This is a specification of requirements, not a survey of existing literature.

  ---

  ## I. Empirical Coverage: Cases to Classify Correctly

  A theory must provide a unified explanation for the presence or absence of absurdity across the following linguistic environments. Failure to capture the intuitive judgment in the non-negotiable cases constitutes a fatal flaw.

  **1. The Core Paradoxes (Non-Negotiable)**
  *   **Requirement:** The theory must classify both the *Omissive* form ("$p$, but I do not believe that $p$") and the *Commissive* form ("$p$, but I believe that not-$p$") as absurd, irrational, or defective in a specific, marked way.
  *   **Motivating Case:** "It is raining, but I don't believe it is." / "It is raining, but I believe it isn't."
  *   **Rationale:** These are the data points defining the phenomenon. A theory that explains one but not the other is incomplete; a theory that explains neither is vacuous.

  **2. The Indexical/Tense Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must explain why the absurdity vanishes when the sentence is shifted to the third person or the past tense.
  *   **Motivating Case:** "It is raining, but *he* does not believe it is." / "It *was* raining, but I did not believe it was."
  *   **Rationale:** These sentences can be true and are routinely asserted without oddity. The theory must locate the defect in the *first-person present-tense* relation between speaker and proposition, not in the logical relation between $p$ and $Bp$ simpliciter.

  **3. The Embedding Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must explain why the absurdity vanishes when the Moorean conjunction is embedded under logical operators or modals.
  *   **Motivating Case:** Negation ("It is not the case that [$p$ and I don't believe $p$]"), Conditionals ("If [$p$ and I don't believe $p$], then..."), Disjunctions, and Modals ("It might be that [$p$ and I don't believe $p$]").
  *   **Rationale:** If the defect were purely logical (a contradiction), it would persist under embedding. If the defect were purely about the act of assertion, embedding should not necessarily cure it without further stipulation. The theory must account for the "unembedding" of the oddity.

  **4. The Epistemic Gradient (Negotiable on Outcome, Non-Negotiable on Distinction)**
  *   **Requirement:** The theory must account for the intuitive difference in absurdity between the Belief variant, the Knowledge variant, and the Evidential variant.
  *   **Motivating Case:** Compare "I don't believe $p$" vs. "I don't *know* $p$" vs. "I have no *evidence* for $p$."
  *   **Rationale:** "I don't know $p$" often feels less absurd (compatible with fallibilism) than "I don't believe $p$." "I have no evidence" may be assertible. The theory need not stipulate that one is absurd and the other not, but it *must* possess the resources to explain the *contrast* in intuitive force between them.

  **5. The Future-Directed Variant (Negotiable)**
  *   **Requirement:** The theory must offer a classification for future-tense Moore sentences.
  *   **Motivating Case:** "It will rain, but I do not believe it will."
  *   **Rationale:** Intuitions vary here. Some find it paradoxical; others find it acceptable (as beliefs about the future are speculative). The theory must be consistent in its handling of tense, even if it classifies this as non-paradoxical.

  ---

  ## II. Conceptual Distinctions: Boundaries to Respect

  A theory must not conflate distinct normative or logical categories. Blurring these distinctions leads to category errors regarding the nature of the defect.

  **6. The Truth-Compatibility Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must maintain that Moorean sentences are capable of being *true*.
  *   **Motivating Consideration:** Absurdity versus Falsity.
  *   **Rationale:** It is a contingent fact that it is raining while I fail to believe it. The world does not conspire to make my disbelief false when I assert it. A theory that renders the sentence logically false (a contradiction) fails to respect the contingency of the world.

  **7. The Logical-Consistency Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish the absurdity from a logical contradiction.
  *   **Motivating Consideration:** Absurdity versus Contradiction.
  *   **Rationale:** $p \land \neg Bp$ is not of the form $A \land \neg A$. The theory must explain why it *feels* like a contradiction without positing that it *is* one.

  **8. The Locus Specification Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must explicitly locate the defect in one (or a specified interaction) of the following: (a) the propositional content (semantics), (b) the act of asserting (pragmatics), or (c) the rationality of the believer's mental state (psychology).
  *   **Motivating Consideration:** Defect in content versus defect in assertion versus defect in epistemic position.
  *   **Rationale:** Ambiguity here prevents falsification. A theory cannot claim the sentence is "unassertible" without specifying whether that is due to the content's nature or external norms governing the speech act.

  **9. The Thinkability Requirement (Negotiable)**
  *   **Requirement:** The theory must take a stance on whether Moorean propositions can be *believed* (thought), distinct from whether they can be *asserted*.
  *   **Motivating Consideration:** Sincerity versus Thinkability.
  *   **Rationale:** Some accounts (e.g., Wittgensteinian) suggest the content cannot be coherently believed. Others suggest one can believe it but not assert it sincerely. The theory must be consistent: if the defect is in the content, it should arguably block belief; if in the assertion, belief might remain possible.

  ---

  ## III. General Facts: Structural Consistency

  A theory must align with the basic structural features of the sentences and the agents uttering them.

  **10. The Conjunct Truth Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must allow that both conjuncts ($p$ and $\neg Bp$) can be true simultaneously.
  *   **Motivating Fact:** That both conjuncts can be true together.
  *   **Rationale:** This follows from Truth-Compatibility but emphasizes the internal structure. The paradox arises from the *conjunction*, not the falsity of the parts.

  **11. The Individual Assertibility Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must explain why each conjunct is individually assertible, while the conjunction is not.
  *   **Motivating Fact:** That each conjunct is individually believable and assertible.
  *   **Rationale:** I can assert "It is raining." I can assert "I don't believe it is raining" (e.g., in a confession of ignorance). The theory must explain the failure of *composition* in assertion.

  **12. The First-Person Authority Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must ground the absurdity in the special access or authority the speaker has regarding their own current mental states.
  *   **Motivating Fact:** That the oddity is tied to the first-person present tense.
  *   **Rationale:** The absurdity relies on the presumption that the speaker is not lying or mistaken about their own belief. If I can be easily wrong about my beliefs, the paradox dissolves. The theory must incorporate the norm of self-knowledge.

  ---

  ## IV. Meta-Analysis of Requirements

  ### 1. Negotiable vs. Non-Negotiable Status
  *   **Non-Negotiable:** Requirements 1, 2, 3, 6, 7, 8, 10, 11, 12. These constitute the core data and logical boundaries of the phenomenon. A theory failing these is not a theory of Moore-paradoxicality; it is a theory of something else (e.g., contradiction, lying, or error).
  *   **Negotiable:** Requirements 4, 5, 9.
      *   *Epistemic Gradient (4):* Theories may differ on whether the Knowledge variant is paradoxical, provided they explain the *difference* from the Belief variant.
      *   *Future-Directed (5):* Intuitions are less stable here; theories may classify these as paradoxical or not, provided the tense logic is consistent with Requirement 2.
      *   *Thinkability (9):* Whether one can *believe* a Moorean proposition is a live debate. A theory is adequate if it takes a coherent stance, even if it differs from rival theories on this point.

  ### 2. The Single Requirement Ruling Out the Most Accounts
  **The Embedding Constraint (Requirement 3).**
  This is the most restrictive filter.
  *   **Why:** Purely pragmatic accounts (e.g., standard Gricean implicature) struggle to explain why the absurdity vanishes in embedded contexts (the "Frege-Geach" problem for Moore). If the defect is merely a violation of a conversational maxim during assertion, embedding the sentence should not remove the defect, yet it does.
  *   **Impact:** This requirement forces theories to either complicate the pragmatics (e.g., constitutive norms of assertion that project) or move toward semantics (e.g., expressivism). It eliminates simple "rule of conversation" explanations.

  ### 3. Incompatibility Check: Content Defect vs. Truth
  **Question:** Can a theory locate the defect in the propositional content (Requirement 8) while granting that the content can be true (Requirement 6)?
  **Answer:** **Yes, but only with a revised notion of "content."**
  *   **The Tension:** In classical truth-conditional semantics, a defect in content usually implies falsity or contradiction. If the content is defective *as a representation of the world*, it cannot be true.
  *   **The Resolution:** To jointly satisfy Requirement 6 and Requirement 8, a theory must adopt a **hybrid or expressivist semantics**. It must treat the content as expressing both a worldly fact ($p$) and a doxastic state ($\neg Bp$). The "defect" is not that the truth conditions cannot be met (they can: $p$ is true, $Bp$ is false), but that the *semantic function* of the sentence is self-defeating.
  *   **Verdict:** These requirements are **jointly satisfiable**, but doing so requires abandoning the view that semantic content is *solely* truth-conditional. A theory that insists on classical truth-conditional content *and* a content-based defect will fail Requirement 6 (Truth-Compatibility). Therefore, the pair is compatible *only if* the theory rejects classical semantic atomism.

  ### 4. Weighting Note
  In evaluating candidate theories, priority must be given to **Requirements 1, 2, 3, and 6**.
  *   If a theory gets the Embedding Constraint (3) right but fails Truth-Compatibility (6), it treats Moorean sentences as contradictions (too strong).
  *   If it gets Truth-Compatibility (6) right but fails Embedding (3), it treats the absurdity as merely conversational (too weak).
  *   The "sweet spot" is a theory that explains why the sentence is **true yet unassertible due to semantic/pragmatic interface rules that dissolve under embedding.** This specific intersection carries the highest weight in the specification.
