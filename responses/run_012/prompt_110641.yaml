answer: |-
  1. The occurrent/standing distinction separates actual interference with choices from the mere presence of an unaccountable capacity to interfere. The two workers come apart because the first faces standing power without occurrent constraint, while the second faces occurrent constraint without standing arbitrary power.
  2. A strict actual interference account must deny the first worker is unfree because no option is physically blocked in the actual world. Proponents might absorb this by counting a constraint as present whenever interference would obtain in nearby possible worlds, but this absorption fails because it conflates the risk of interference with the fact of interference.
  3. The benevolent dictator case pressures the interest-tracking reading by showing one can be unfree despite having interests met, and pressures the answerability reading to clarify why benevolence fails to secure freedom. Thus, arbitrariness is best understood as power not being answerable to the agent, regardless of whether interests are tracked.
  4. This dispute determines whether law itself reduces liberty, as the actual interference view must concede Hobbes was right while the standing view sees non-arbitrary law as compatible with freedom. Consequently, freedom shifts from being merely a feature of a person's available options to a feature of her social status relative to others.
  5. The strongest objection claims the standing view conflates freedom with the security of enjoyment or social status rather than the extent of choice itself. The distinction survives if freedom is defined as the robustness of access to options, which depends on the absence of dependent vulnerability to another's will.
