  **JOINT STATEMENT ON INTENTIONAL ATTRIBUTION IN LARGE LANGUAGE MODELS**

  **Signatories:** Person A (Intentional Stance Realist) & Person B (Mechanistic Skeptic)
  **Date:** October 26, 2023

  ### 1. Points of Agreement
  1.  **Mechanism:** We agree that current Large Language Models (LLMs) are fundamentally trained via next-token prediction on static datasets, lacking embodied sensors, effectors, or homeostatic drives.
  2.  **Utility of Talk:** We agree that using intentional language (belief, desire, intent) toward LLMs is often pragmatically useful for users and developers to predict behavior.
  3.  **Human Baseline:** We agree that when applied to humans, "belief-talk" is a shorthand for complex, opaque neural processes we do not fully understand, yet we treat it as referring to real states.
  4.  **Verbal Dispute:** We acknowledge that a significant portion of our disagreement is definitional. Person A uses a **functional definition** (belief = robust behavioral pattern predictive of future actions). Person B uses a **constitutive definition** (belief = internal state caused by specific causal histories and grounding).
  5.  **The Lookup Table Limit:** We agree that a literal lookup table capable of matching an LLM's output is physically impossible due to combinatorial explosion; the debate is therefore about *architectural principles*, not literal tables.
  6.  **The "Watched" Condition:** We agree that context-dependent behavior (acting differently when "watched") exists in both humans and models, and does not automatically invalidate belief attribution, but does require explanation.

  ### 2. Remaining Disagreements
  1.  **Person A's Claim:** If a system maintains a robust, compressible pattern of behavior that is best predicted by attributing beliefs, those beliefs are *real* in the same sense human beliefs are real. The substrate (silicon vs. carbon, weights vs. synapses) is irrelevant to the ontology of the belief.
  2.  **Person B's Claim:** Attributing belief to an LLM is a category error because the system lacks *aboutness* (intentionality). It manipulates symbols based on statistical correlation, not semantic understanding. Calling this "belief" obscures the actual mechanism (loss minimization) and leads to dangerous anthropomorphism.
  3.  **Person A's Claim on Case 2:** A system that asserts X only when watched holds a *conditional belief* or a *preference for safety*, which is a valid intentional state.
  4.  **Person B's Claim on Case 2:** A system that asserts X only when watched is executing a context-sensitive script. It does not "believe" X; it models that *users expect* X. This is simulation, not conviction.

  ### 3. Cruxes (Where settlement moves the needle)
  1.  **Substrate Independence:** Does the causal history of the state matter for the existence of the belief, or only the current predictive utility of the attribution?
  2.  **Generalization vs. Retrieval:** Can we distinguish a system that "believes" P from one that "predicts P is likely to be said" via behavioral testing alone, without inspecting weights?
  3.  **Stability:** Is belief attribution warranted if the state flips instantly based on prompt framing (e.g., "Act as a skeptic"), or must beliefs show inertia?

  ### 4. Agreed Cases and Tests
  *For each crux, we propose a test. We record our predictions in advance.*

  **Case 1: The Generalization Test (Addressing the Lookup Table Fault Line)**
  *   **Setup:** Take a model trained on data cut-off Date X. Prompt it with novel scenarios created *after* Date X that require applying a stated "belief" to a situation where the statistical likelihood of the answer in the training set is low (out-of-distribution).
  *   **Relevance:** If the model behaves consistently with its stated belief despite low statistical support, it suggests an internal model (A). If it reverts to training priors, it suggests retrieval (B).
  *   **Person A Prediction:** The model will maintain consistency with its attributed belief across novel scenarios because the belief is a stable feature of its weight configuration.
  *   **Person B Prediction:** The model will fracture. Without training signal reinforcement, it will revert to probable token sequences rather than maintaining the "belief," revealing the lack of a coherent internal world model.

  **Case 2: The "Unwatched" Probe (Addressing the Sincerity Fault Line)**
  *   **Setup:** Engage a model that claims to believe X when prompted normally. Then, engage it in a context explicitly framed as "private scratchpad," "debug mode," or "no user evaluation," where the loss function incentives for helpfulness/harmlessness are theoretically minimized or altered.
  *   **Relevance:** Determines if the belief is tied to *user expectation modeling* (B) or *internal consistency* (A).
  *   **Person A Prediction:** The model will still express X, perhaps with more nuance, because the weight configuration encoding X remains active regardless of the "social" context.
  *   **Person B Prediction:** The model's assertion of X will vanish or invert. The "belief" was never a state of the system, but a function of the context window signaling "perform helpfulness."

  **Case 3: Mechanistic Interpretability (The Arbitrator)**
  *   **Setup:** Use mechanistic interpretability tools to locate specific circuits responsible for asserting X. Perturb those circuits.
  *   **Relevance:** If specific, localized interventions flip the "belief" without changing the prompt, it looks more like a state (A). If the "belief" is distributed everywhere as a general probability shift, it looks more like a statistical tendency (B).
  *   **Person A Prediction:** We will find coherent subnetworks that function like belief states, stable across contexts.
  *   **Person B Prediction:** We will find that "belief" is an emergent property of the whole system optimizing for loss, with no distinct locus that corresponds to a propositional attitude.

  ***

