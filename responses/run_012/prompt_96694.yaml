answer: |-
  This is a sharp formulation of the tension between the *phenomenology* of national identity (how it feels to the citizen) and the *ontology* of national identity (how it is produced by the state). You have correctly identified that the standard constructivist rebuttal ("all nations are invented") often sidesteps the normative problem of *authority*. If the state knows the tradition is invented, but funds it to make citizens feel it is inherited, it is engaging in a specific kind of political theology.

  Here is a reconstruction of the implicit theory, separating necessary conditions from contingent comforts, and an assessment of whether the practice survives the "disclosure of invention."

  ### 1. The Implicit Theory: Retrospective Consecration
  The practice does not presuppose a primordialist ontology (that the nation *is* ancient). It presupposes a **primordialist phenomenology** (that the nation must *feel* ancient to function).

  The implicit theory of time here is not chronological but **liturgical**. In a liturgical framework, the past is not a fixed sequence of empirical events to be discovered, but a normative resource to be activated. When the state funds a "revived" dance or a museum narrative, it is not making an epistemic claim ("this happened continuously since 1200 AD"); it is making a **deontic claim** ("this binds us together now").

  The authority of the past is not derived from its factual continuity, but from its **consecratory utility**. The state treats the past as a "bank of legitimacy." By selecting specific artifacts or narratives and labeling them "heritage," the state performs a speech act of *retrospective consecration*. It is not discovering lineage; it is creating lineage to authorize the present political order.

  **The Presupposition:** The practice presupposes that political obligation requires a **fiction of transmission**. Citizens are more likely to accept sacrifices (taxes, military service, legal compliance) if they perceive them as duties to ancestors rather than contracts with contemporaries. The "incoherence" you see is only incoherent if you assume the state is trying to be a historian. If you view the state as a liturgist, the mechanism (construction) and the message (inheritance) are consistent: the liturgy *constructs* the sacred reality it claims to *reveal*.

  ### 2. Necessary Conditions vs. Comfortable Contingencies
  To determine if the practice collapses upon the revelation of invention, we must distinguish what the practice *needs* from what merely *helps*.

  **Comfortable Contingencies (Not Strictly Required):**
  *   **Factual Antiquity:** The traditions do not need to be old.
  *   **Unreflective Belief:** Citizens do not strictly need to believe the traditions are objectively ancient in a positivist sense.
  *   **Homogeneity:** The heritage does not need to be universally shared historically.

  **Strict Requirements (The Practice Collapses Without These):**
  *   **The Aesthetic of Continuity:** The *performance* must maintain the *form* of inheritance. Even if everyone knows the dance was choreographed in 1950, it must be performed with the *gravity* of something handed down. If the performance becomes ironic or purely instrumental, the binding power dissolves.
  *   **The Prohibition on Arbitrariness:** Citizens must believe the selection was not *merely* arbitrary. If the state admits, "We picked this flag because it tested well in focus groups," the authority vanishes. They must believe the selection resonates with some deeper, pre-political truth about the people, even if the specific symbols are new.
  *   **Intergenerational Projection:** The narrative must project into the future as well as the past. It must posit that *future* generations will view this "invented" tradition as "inherited." The state is betting on the amnesia or sanctification of the future.

  ### 3. The Epistemic vs. Deontic Gap
  The core of your puzzle is the gap between the **epistemic status** of the tradition (known by archives to be recent) and its **deontic status** (felt by citizens as binding).

  The practice survives only if the deontic status is decoupled from the epistemic status.
  *   **Primordialist View:** Binding *because* ancient. (Fails if invention is revealed).
  *   **Constructivist View:** Binding *because* agreed upon. (Fails to generate the specific affective loyalty of heritage).
  *   **The State's Actual View (Implicit):** Binding *because* it constitutes us as a specific "we."

  The state relies on a **performative truth**. The tradition becomes "true" not because it existed in the past, but because it successfully organizes social relations in the present. The authority of the past is actually the authority of the present, disguised as the past.

  ### 4. Can the Practice Survive Full Disclosure?
  Could a state fully accept its traditions are invented and keep funding them? **Yes, but the justification must shift from *Genealogy* to *Commitment*.**

  If the state says, "We know this tradition was invented in 1890, but we choose to uphold it because it sustains our collective agency," the practice changes category. It moves from **Heritage** (what we received) to **Civic Ritual** (what we sustain).

  **The Risk of Disclosure:**
  If the "veil of antiquity" is lifted without replacing it with a "veil of commitment," the practice becomes exposed as **instrumental manipulation**.
  *   *Scenario A (Collapse):* Citizens realize the state is using fake history to manufacture consent. Trust erodes. The heritage becomes kitsch.
  *   *Scenario B (Resilience):* Citizens accept the invention but treat the *maintenance* of the fiction as the real tradition. This is akin to a constitutional order. We know the Constitution was written by fallible men at a specific time (invented), but we treat it as sacred.

  **The Condition for Survival:**
  For the practice to survive full transparency, the "belief" required shifts.
  *   *Old Belief:* "This is who we *have always been*."
  *   *New Belief:* "This is who we *choose to be*, and we honor the choice by treating it as binding."

  However, this is psychologically thinner. The "authority of the past" is potent precisely because it bypasses the will. It tells the citizen: "You did not choose this; you were born into it; therefore, you owe it." If you admit the citizen *could* have chosen otherwise (because the tradition is invented), you introduce a **voluntarist gap**. If I can choose my heritage, why can't I opt out of the duties attached to it?

  ### 5. Conclusion: The Necessity of the "Noble Fiction"
  The practice does not require the traditions to be genuinely old. It requires the **social reality of the tradition to be uninterrupted.**

  The incoherence you detect is real, but it is a **productive incoherence**. It is the gap between the *origin* of power (constructivist) and the *experience* of power (primordialist).

  Can the state keep funding it after accepting the invention?
  *   **Functionally:** Yes. States already do this (e.g., modern republics celebrating "ancient" liberties that are legally novel).
  *   **Normatively:** Only if it stops claiming the authority of the *dead* and starts claiming the authority of the *living*.

  If the state admits the invention, it can no longer say, "Honor this because your ancestors died for it." It must say, "Honor this because we decide it matters." The latter is a democratic claim; the former is a dynastic claim. Most modern states want the stability of the dynastic claim without the historical falsehood.

  **The Verdict:** The practice comes apart only if "invented" is equated with "arbitrary." If the state can argue that the invention was an act of **collective self-constitution** (similar to founding a constitution), the funding remains justified. But it loses the specific *melancholy and gravity* of heritage. It becomes less "cathedral" and more "community center." The state can keep the machinery, but it loses the magic. And since the magic (the feeling of inevitability) is the point of the machinery, the practice is fundamentally degraded, even if it continues.

  The implicit theory is that **political stability requires a misrecognition of time.** The state needs citizens to experience the *constructed* as the *given*. If that misrecognition is cured, the specific authority of "heritage" dissolves into the general authority of "policy."
