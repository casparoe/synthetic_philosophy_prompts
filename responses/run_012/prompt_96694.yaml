          *   Does it need to be genuinely old? No.
          *   Does it need people to believe it's old? This is the crux.
          *   If everyone knows it's invented, does it fail?
          *   *Hypothesis:* It fails only if "invented" equals "arbitrary" or "illegitimate."
          *   If "invented" equals "chosen and affirmed," it might survive.
          *   *Analogy:* Constitutions. We know they were written by men at a specific time (invented), but we treat them as foundational law.
          *   *Shift:* From "discovery" of identity to "commitment" to identity.

      *   **Step 4: Can the State Continue after Accepting Invention?**
          *   Yes, but the *justification* must shift.
          *   From "We do this because it is our ancestors' will" to "We do this because it sustains our collective agency."
          *   This moves from *ancestral authority* to *democratic self-constitution*.
