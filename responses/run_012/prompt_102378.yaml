  1. Rational decision-making under uncertainty requires weighing the magnitude of outcomes against their probabilities, and systematically ignoring either factor constitutes a failure of rationality.
  2. Expected-value maximization is formally defined as the selection of the option with the highest sum of probability-weighted utilities, but this formalism does not by itself settle how probabilities and utilities are to be estimated or bounded.
  3. In "mugging-style" cases, both sides agree on the structure (a tiny probability of an astronomically large payoff) and uncontested features (the mathematical expected value can exceed the cost), but contest whether the inputs are epistemically accessible or coherent.
  4. A distinction must be maintained between what a decision rule requires of an idealized agent and what a bounded agent may reasonably be blamed or praised for doing given their epistemic limitations.
  5. Credences over tiny probabilities and enormous outcomes must be formed via disciplined elicitation procedures rather than intuition alone, and both sides agree that arbitrary assignment of such credences is unjustified.

  ## II. Disagreements, Cruxes, and Predictive Cases

  | Crux | Fanatic Position & Prediction | Anti-Fanatic Position & Prediction |
  | :--- | :--- | :--- |
  | **1. Boundedness of Value**<br>*(Is utility scale-free?)* | **Position:** Value is unbounded; linear aggregation across probabilities is required for consistency.<br>**Case:** The Ladder of Gambles (Payoff $2^n$, Prob $1/2^n$, EV constant).<br>**Prediction:** An idealized agent is indifferent across all rungs; preferring lower rungs implies inconsistency or bounded utility which fails to capture true value. | **Position:** Value is effectively bounded or diminishing; linear aggregation fails at extremes.<br>**Case:** The Ladder of Gambles (Payoff $2^n$, Prob $1/2^n$, EV constant).<br>**Prediction:** An idealized agent prefers lower rungs; the ladder breaks where the payoff exceeds the agent's capacity to model value or where probability drops below epistemic significance. |
  | **2. Epistemic Discounting**<br>*(Can tiny probabilities be ignored?)* | **Position:** Probabilities are probabilities; discounting them based on magnitude is ad hoc and invites inconsistency.<br>**Case:** Pascal's Mugging ($5 vs. 3^^^^3 lives at 1/3^^^^3).<br>**Prediction:** If the credence is genuinely above the threshold where EV exceeds cost, the agent must pay; refusing indicates fear of the math rather than epistemic rigor. | **Position:** Credences at extreme magnitudes are noise-dominated; a penalty for complexity or uncertainty is rational.<br>**Case:** Pascal's Mugging ($5 vs. 3^^^^3 lives at 1/3^^^^3).<br>**Prediction:** The agent refuses to pay; the claimed probability is below the threshold of epistemic reliability required for action, regardless of calculated EV. |
  | **3. Formalism vs. Intuition**<br>*(Does formal correctness trump verdicts?)* | **Position:** Formal impeccability is sufficient reason to follow a rule; counterintuitive verdicts indicate flawed intuitions, not flawed math.<br>**Case:** Reflective Equilibrium Test.<br>**Prediction:** We should revise our intuitions to match the theory; if the theory says take the gamble, the intuition that it is absurd is the error. | **Position:** A decision theory must deliver verdicts compatible with reflective equilibrium; formalism is a tool, not a master.<br>**Case:** Reflective Equilibrium Test.<br>**Prediction:** We should revise the theory to match robust intuitions; if the theory says take the gamble, the theory is missing a relevant constraint. |

  ## III. Closing Statement

  We agree that this debate cannot be settled by stipulation or rhetoric alone. The Fanatic would abandon their position if presented with a formal proof that unbounded utility functions lead to dynamic inconsistency or money-pump vulnerabilities in realistic decision environments. The Anti-Fanatic would abandon their position if shown that their proposed constraints (boundedness or epistemic discounting) inevitably lead to ignoring genuine existential risks or violate basic dominance principles.

  Both sides agree that progress requires better models of how credences are formed under extreme uncertainty, rather than merely arguing over how to aggregate them. We commit to updating our views based on advances in the formal foundations of axiology and epistemology, rather than defending our current intuitions as final.

