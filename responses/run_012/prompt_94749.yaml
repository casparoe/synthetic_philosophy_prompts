answer: |-
  # Seminar Handout: Mapping the Norm of Assertion

  **Instructions:** Do not look up the terms in the leaves yet. Read the cases and answer the questions based on your intuition. Follow the path that matches your judgment to find your position.

  ## The Decision Tree

  ### **Q1: The Actor Test (Is there a specific rule for assertion?)**
  *Case:* An actor on stage says, "I arrest you." They do not believe they are arresting anyone, and they have no authority to arrest.
  *   **A:** They are not really asserting anything; they are pretending. Assertion has rules that define it, and this act doesn't meet them. → **Go to Q2 (Constitutive Camp)**
  *   **B:** They are asserting, but they are lying or acting. There is no special "assertion rule" they broke, just general rules about truth or cooperation. → **Go to Q2-NC (Non-Constitutive Camp)**

  ---

  ### **Branch 1: Non-Constitutive Camp (No specific rule defines assertion)**

  **Q2-NC: The Source of Pressure**
  *Case:* You tell a friend the meeting time. You are wrong. Why was this a mistake?
  *   **A:** Because you violated the general rules of cooperative conversation (Gricean maxims). It's like interrupting someone—rude, but not a specific failure of *assertion*. → **Leaf 1: Pragmatist / Conversational Scoreboard**
  *   **B:** Because you violated the norm of *Belief*. You shouldn't say what you don't believe, just as you shouldn't believe what is false. Assertion just inherits the norm of belief. → **Leaf 2: Belief Inheritance (Reductive)**
  *   **C:** Because "assertion" isn't one thing. Sometimes we guess, sometimes we testify, sometimes we claim. There is no single rule for all of them. → **Leaf 3: Pluralist / Family of Acts**
  *   **D:** Because the statement functions to convey information, like a Sat-Nav. If it's wrong, it failed its function, regardless of your mental state. → **Leaf 4: Information / Functional Norm**

  ---

  ### **Branch 2: Constitutive Camp (There is a rule specific to assertion)**

  **Q3: The Defect Test (What makes an assertion defective?)**
  *Case:* You check the email, it says "Meeting at 5." You assert "Meeting at 5." The email had a typo; the meeting is at 4. You were sincere and careful.
  *   **A:** The assertion is defective because it is **False**. Your evidence doesn't matter; the world didn't cooperate. → **Leaf 5: Truth Norm**
  *   **B:** The assertion is defective because you lacked the right **Mental State** (you didn't believe it enough, or you were insincere). → **Go to Q4 (Mental State)**
  *   **C:** The assertion is defective because you lacked the right **Epistemic Support** (evidence/knowledge), even if you were sincere. → **Go to Q5 (Epistemic Support)**
  *   **D:** The assertion is defective because it wasn't your place to say it (e.g., you aren't the organizer). It's about **Standing**, not truth. → **Leaf 6: Standing / Authority Norm**
  *   **E:** The assertion is defective because you cannot **Defend** it if challenged. It's about commitment, not truth. → **Leaf 7: Commitment / Defensibility Norm**

  ---

  ### **Branch 2B: Mental State Norms**

  **Q4: The Liar Test (Constitutive vs. Regulative)**
  *Case:* A speaker says $p$, but they believe $\neg p$ (a lie).
  *   **A:** They have failed to assert at all. The rule is constitutive; without belief, the act is void (like moving a bishop diagonally). → **Leaf 8: Strict Belief Norm (Constitutive)**
  *   **B:** They have asserted, but they have done so badly. The rule regulates the act but doesn't define it. → **Leaf 9: Belief Norm (Regulative)**

  ---

  ### **Branch 2C: Epistemic Support Norms**

  **Q5: The Lottery Test (Strength of Support)**
  *Case:* You hold a ticket in a million-ticket lottery. The odds are 99.999% it lost. You assert, "Your ticket lost."
  *   **A:** This is fine. You have adequate evidence/justification. You don't need absolute certainty. → **Leaf 10: Justification / Reasonable Belief Norm**
  *   **B:** This is improper. Probability isn't enough; you need a stronger epistemic relation to the fact. → **Go to Q6 (Knowledge)**

  **Q6: The Bank Case (Context Sensitivity)**
  *Case:* Low Stakes: "Is the bank open Saturday?" (Just depositing a check). High Stakes: "Is the bank open Saturday?" (If not, you default on a mortgage). Same evidence in both.
  *   **A:** The norm is the same. If you know, you can assert. Stakes don't change knowledge. → **Leaf 11: Standard Knowledge Norm (Invariant)**
  *   **B:** The norm shifts. In High Stakes, you need more than knowledge (or 'knowledge' requires more). → **Leaf 12: Contextualist Knowledge Norm**
  *   **C:** You need to know *that* you know. Mere knowledge isn't enough for assertion; you need certainty about your knowledge. → **Leaf 13: KK Norm (Certainty)**

  ---

  ### **Branch 2D: Structure of the Norm**

  **Q7: The Retraction Test (Single vs. Package)**
  *Case:* You assert $p$. Later, evidence shows $\neg p$. You refuse to retract.
  *   **A:** You violated the *same* norm you violated when you asserted (if you didn't know $p$, you shouldn't have asserted). One rule covers it all. → **(Return to Leaves 5-13)**
  *   **B:** Asserting and Retracting have *different* norms. You might have been permitted to assert then, but are required to retract now. It's a package of rules. → **Leaf 14: Package / Complex Norm**

  ---

  ### **Branch 2E: Moral Obligation**

  **Q8: The Promise Test**
  *Case:* You assert $p$. $p$ turns out false. Did you break a promise?
  *   **A:** Yes. Asserting is implicitly promising the truth to your audience. → **Leaf 15: Moral / Promise Norm**
  *   **B:** No. It's epistemic, not moral. → **(Return to Leaves 5-13)**

  ---

  ## The Leaves: Positions & Awkward Commitments

  1.  **Pragmatist / Conversational Scoreboard:** Assertion is governed only by general conversational maxims (Grice).
      *   *Awkward Commitment:* Struggles to explain why we criticize assertions for being *false* rather than just *unhelpful*; implies a helpful lie is better than a useless truth.
  2.  **Belief Inheritance (Reductive):** The only norm is the norm of belief; assertion adds nothing.
      *   *Awkward Commitment:* Cannot explain why we demand more of speakers than we do of thinkers (e.g., we criticize asserting a Gettiered truth more than believing it).
  3.  **Pluralist / Family of Acts:** 'Assertion' covers many speech acts with no single unifying norm.
      *   *Awkward Commitment:* Risks making the concept of 'assertion' too vague to be philosophically useful; dissolves the problem rather than solving it.
  4.  **Information / Functional Norm:** Assertion is a tool for transferring information (like a Sat-Nav).
      *   *Awkward Commitment:* Treats speakers like machines; struggles to account for sincerity or the speaker's responsibility (a broken Sat-Nav isn't blameworthy, a liar is).
  5.  **Truth Norm:** One must assert $p$ only if $p$ is true.
      *   *Awkward Commitment:* Condemns the careful speaker in the "Misread Email" case just as harshly as a liar; makes assertion too risky for fallible humans.
  6.  **Standing / Authority Norm:** One must assert $p$ only if one has the social standing/authority to do so.
      *   *Awkward Commitment:* Struggles to explain why peer testimony works; implies a knowledgeable outsider cannot properly assert facts about a closed group.
  7.  **Commitment / Defensibility Norm:** One must assert $p$ only if one is committed to defending $p$ upon challenge.
      *   *Awkward Commitment:* Allows assertion of things one knows are false if one is willing to lie consistently in defense (the "bold liar" counts as asserting properly).
  8.  **Strict Belief Norm (Constitutive):** One must assert $p$ only if one believes $p$; without belief, no assertion occurs.
      *   *Awkward Commitment:* Implies liars do not assert; makes it impossible to lie (since lying requires asserting what one believes false).
  9.  **Belief Norm (Regulative):** One ought to assert $p$ only if one believes $p$, but one can assert without believing.
      *   *Awkward Commitment:* Permits the "Moorean" speaker (asserting "It's raining but I don't believe it") to count as asserting, even if the act is paradoxical.
  10. **Justification / Reasonable Belief Norm:** One must assert $p$ only if one has adequate evidence for $p$.
      *   *Awkward Commitment:* Permits the "Lottery Assertion" ("Your ticket lost") which intuitively feels improper despite high probability.
  11. **Standard Knowledge Norm (Invariant):** One must assert $p$ only if one knows $p$.
      *   *Awkward Commitment:* Struggles with "High Stakes" cases where knowledge seems present but assertion feels reckless (or implies we lose knowledge in high stakes).
  12. **Contextualist Knowledge Norm:** The knowledge required for assertion shifts with conversational stakes.
      *   *Awkward Commitment:* Makes the truth of "You shouldn't assert that" depend on the audience's anxiety levels rather than the speaker's epistemic state.
  13. **KK Norm (Certainty):** One must assert $p$ only if one knows that one knows $p$.
      *   *Awkward Commitment:* Sets the bar so high that almost no everyday assertion is permitted (skeptical paralysis).
  14. **Package / Complex Norm:** Distinct norms govern assertion, retraction, and challenge separately.
      *   *Awkward Commitment:* Complicates the theory significantly; risks allowing a speaker to assert properly initially but have no route to correct error later.
  15. **Moral / Promise Norm:** Asserting is implicitly promising the truth.
      *   *Awkward Commitment:* Conflates epistemic failure with moral wrongdoing; implies an honest mistake is a moral breach equivalent to breaking a vow.

  ---

  ## Meta-Analysis: Gaps and Equivalences

  ### **Indistinguishable Pairs (Equivalence Classes)**
  Your tree may not separate these views in practice, even if they differ in theory:
  1.  **Standard Knowledge Norm vs. Truth Norm + Implicature:** In most ordinary cases, if you assert a truth you don't know (e.g., a lucky guess), the Knowledge Norm says "Wrong," and the Truth Norm says "Right, but you implicated you knew." The practical criticism ("You shouldn't have said that") ends up identical.
  2.  **Justification Norm vs. Contextualist Knowledge Norm:** If 'justification' is flexible enough to match stakes, this view collapses into Contextualist Knowledge. The difference is merely whether we call the state 'knowledge' or 'reasonable belief'.
  3.  **Commitment Norm vs. Promise Norm:** Both ground the norm in a social obligation rather than an epistemic state. Unless you distinguish 'defending' from 'promising', these leaves yield the same verdicts on lies and retractions.

  ### **Empty Combinations (The "No-Man's Land")**
  1.  **Constitutive + Truth Norm + Regulative:** Few hold that Truth is constitutive of assertion (defines the act) but that you can assert falsely without the act being void. Usually, if Truth is constitutive, falsity makes it a different act (like a null move).
  2.  **Belief Norm + Lottery Permission:** Almost no one holds a pure Belief Norm that *also* permits Lottery assertions. If belief is the only requirement, lottery beliefs are fine, but most Belief Norm advocates think lottery beliefs are defective too.
  3.  **Pluralist + Knowledge Norm:** If assertion is a family of acts with no single rule, positing a single Knowledge Norm for the whole family is incoherent. You must choose: one rule for all, or many rules for many acts.

  ### **Why are they empty?**
  *   **Incoherence:** The Pluralist/Knowledge combo is logically inconsistent by definition.
  *   **Unattractive:** The Constitutive/Truth/Regulative mix requires a messy metaphysics where rules define acts but can be broken without changing the act's identity.
  *   **Nobody's Bothered:** The Belief/Lottery combo is theoretically possible but unattractive because it fails to capture the specific intuition that lottery claims feel 'off' in a way other beliefs do not.
