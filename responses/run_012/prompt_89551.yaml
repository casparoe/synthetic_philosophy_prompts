answer: |-
  You have identified the central fracture in modern privacy jurisprudence. The contradiction you feel isn't a bug in your reasoning; it is a bug in the law's operating system. The legal practice you describe is not running on a single theory of privacy. It is running legacy code (19th-century property and secrecy) on new hardware (digital networks), with patches applied by different courts for different policy goals.

  Here is the breakdown of the implicit theories, what the doctrine actually requires versus what it tolerates, and how the "wrinkle" of aggregation exposes the system's instability.

  ### 1. The Implicit Theory: Privacy as "Secrecy" vs. Privacy as "Norms"

  The bundle of practices you described presupposes two conflicting theories of privacy that are currently at war.

  **Theory A: Privacy as Secrecy (The Dominant 4th Amendment View)**
  This is the engine behind the Third-Party Doctrine (bank records, emails on servers). It presupposes that privacy is a binary state of **concealment**.
  *   **The Logic:** If information is hidden (drawer), it is private. If information is exposed to another human consciousness (bank teller, email server), it is no longer secret. Once secrecy is broken, the "privacy interest" evaporates.
  *   **The Metaphor:** Privacy is a fortress. If you open the gate to let a friend in (the third party), you cannot complain if the army follows them in.
  *   **The Contradiction:** This theory cannot explain the Doctor/Lawyer exception. Under strict secrecy, telling a lawyer destroys privacy just as much as telling a bank.

  **Theory B: Privacy as Relational/Functional Privilege (The Exception View)**
  This is the engine behind Attorney-Client and Doctor-Patient privilege. It presupposes that privacy is a **social tool**.
  *   **The Logic:** Privacy isn't about hiding; it's about enabling specific relationships that society values (health, justice). The protection attaches to the *role* of the receiver, not the *secrecy* of the content.
  *   **The Metaphor:** Privacy is a shield granted to specific interactions to encourage them to happen.

  **Theory C: Privacy as Contextual Integrity (The Emerging View)**
  This is the engine behind *Riley* (cell phones) and the "Wrinkle" (court databases). It presupposes privacy is about **appropriate flow**.
  *   **The Logic:** Sharing information for one purpose (email storage, walking on a sidewalk) does not authorize its use for another purpose (government surveillance, stalking logs).
  *   **The Metaphor:** Privacy is a set of traffic rules. You can drive on the road (share data), but you can't drive on the sidewalk (use data out of context).

  **The Verdict:** The practice currently presupposes **Privacy as Secrecy** as its default baseline, but it is forced to import **Relational** and **Contextual** theories to prevent absurd outcomes. The contradiction exists because the courts refuse to admit they have shifted theories. They treat Privilege and Cell Phone protections as "special exceptions" to the Secrecy rule, rather than admitting the Secrecy rule was wrong.

  ---

  ### 2. Task One: Needs vs. Fits (Underdetermination)

  You asked to separate what the practice *strictly needs* from what it merely *happens to fit*.

  **What the Third-Party Doctrine Strictly Needs:**
  The Third-Party Doctrine (emails, banks) is **committed to Secrecy**. It cannot function under a Control or Contextual theory.
  *   *Why?* If privacy were about *Control*, handing data to Google would only grant Google specific rights, not the government. If privacy were about *Context*, emailing yourself is a "self-to-self" context, not a "citizen-to-state" context.
  *   *The Necessity:* For the government to access email without a warrant, the law *must* believe that sharing information equals forfeiting ownership of that information's secrecy. It treats information like a physical object you handed over: "You gave it to them, it's not yours anymore."

  **What is Underdetermined (Where Theories Overlap):**
  The *Riley* decision (police need a warrant to search a cell phone) is genuinely underdetermined.
  *   *Secrecy View:* You carry the phone, so it's secret. (Fits).
  *   *Control View:* You control the phone, so you control the data. (Fits).
  *   *Contextual View:* The phone is a digital home, distinct from a pocket. (Fits).
  *   *Analysis:* The court used the *outcome* of the Secrecy view (warrant required) but the *reasoning* of the Contextual view (phones contain the "privacies of life"). This is the seam where the law is stitching the two theories together.

  **The Court File/Database Wrinkle:**
  This is the most underdetermined area. The concept is **"Practical Obscurity."**
  *   *The Practice:* A file in a basement is "public" but protected by the effort required to access it. A database makes it instantly accessible. Courts often rule that the *change in accessibility* violates privacy, even if the *information* is technically public.
  *   *The Theory:* This contradicts the Secrecy view (the info was never secret). It supports a **Power/Asymmetry** view. Privacy is not about whether information *can* be known, but about the *cost* to know it. If the state lowers the cost to zero, they violate the privacy norm.

  ---

  ### 3. Task Two: The Flip Side (Swapping the Theories)

  If we explicitly replaced the current presupposed view (Secrecy/Property) with one of the rivals, here is what breaks and what survives.

  **Scenario A: Replace Secrecy with "Privacy as Control/Use" (The GDPR Model)**
  *   **What Breaks:** The Third-Party Doctrine collapses entirely. Under a Control view, giving data to an email provider is a limited license for *them* to process it, not a transfer of title. The government would need a warrant (or the user's consent) because the user never transferred control to the state.
  *   **What Survives:** Doctor/Lawyer privilege survives intact (use is strictly limited). *Riley* (cell phones) survives (use is restricted).
  *   **The Shift:** The burden shifts from the citizen (proving they kept it secret) to the state (proving they have authority to use it).

  **Scenario B: Replace Secrecy with "Privacy as Relational/Group"**
  *   **What Breaks:** The distinction between "drawer" and "email" vanishes. Both are judged by the relationship. If I email myself, is that a relationship? If I use a bank, is that a fiduciary relationship? (In Europe, banks have higher duties; in the US, they don't).
  *   **What Survives:** The "Wrinkle" (doorbell camera). A neighbor logging your movements violates the normative relationship of "neighbors," even if you are in public.
  *   **The Shift:** Privacy becomes a property of the *connection*, not the *data*.

  **Scenario C: Replace Secrecy with "Privacy as Contextual Integrity"**
  *   **What Breaks:** The "Public Place" doctrine. Currently, if you walk on the street, you have no privacy expectation. Under Contextual Integrity, you have an expectation of "casual observation," not "systematic logging." The doorbell camera becomes a violation.
  *   **What Survives:** The Court File database issue. Moving from basement to database changes the context from "investigative effort" to "surveillance," violating the flow norms.
  *   **The Shift:** The question changes from "Was it hidden?" to "Is this flow appropriate?"

  ---

  ### 4. The Wrinkle: Place, Effort, and the Mosaic Theory

  You asked: *Does the practice presuppose that privacy attaches to places and to effort rather than to information?*

  **Yes.** And this is the key to resolving the contradiction you feel.

  The law is currently transitioning from a **Property/Secrecy Model** to a **Mosaic/Power Model**.

  1.  **The Old Rule (Property/Secrecy):** Privacy attaches to *things* and *places*. If the thing is in your house (drawer), it's protected. If the thing is on someone else's server (email), it's not. If you are in public (sidewalk), you're not protected.
  2.  **The New Reality (Mosaic/Power):** Privacy attaches to the *portrait of life* that can be constructed.
      *   **Court Files:** One file is trivia; a searchable database is a biography. The violation isn't the release of information; it's the **change in power dynamics**. The state gains the power to know you better than you know yourself.
      *   **Doorbell Cameras:** One glance is social; a log is surveillance. The violation is the **aggregation**.

  **How this sits with the Third-Party Doctrine:**
  It sits terribly. The Third-Party Doctrine is a zombie of the Old Rule. It assumes that because you gave a piece of data to a bank, you gave away the *whole* privacy interest.
  *   **The Contradiction:** The "Wrinkle" cases admit that *aggregation* creates a new privacy interest out of public parts. The Third-Party Doctrine denies that *aggregation* creates a new privacy interest out of shared parts.
  *   **The Resolution:** The Supreme Court hinted at this in *Carpenter v. United States* (2018). They ruled that police *do* need a warrant for cell-site location info (CSLI), effectively carving a hole in the Third-Party Doctrine.
  *   **The Reasoning:** They argued that while you "share" your location with the carrier moment-to-moment, you do not "share" the **historical record** of your life.

  **Conclusion on the Wrinkle:**
  The practice presupposes that privacy is **not about the information itself**, but about the **capacity to synthesize it**.
  *   **Drawer vs. Email:** The law *says* this is about secrecy (drawer=secret, email=shared). But the *real* tension is that the email server allows synthesis (searching, scanning) that the drawer does not.
  *   **Basement vs. Database:** This confirms the synthesis theory. The information is identical; the *capacity to process it* is what triggers the privacy violation.

  ### Summary

  The bundle presupposes that privacy is **Secrecy**, but it is being forced by technology to act as if privacy is **Contextual Integrity**.

  *   **The Contradiction:** You feel a contradiction because the law is trying to apply a "Fortress" model (keep it hidden) to a "Network" reality (data must flow to function).
  *   **The Implicit Belief:** The system believes privacy is a **right to obscurity**, not a right to secrecy. It assumes that if information is hard to get (drawer, basement, casual glance), it is private. If it is easy to get (server, database, log), it is forfeit.
  *   **The Future:** The "Third-Party Doctrine" is the weakest link. It relies on the idea that sharing with a corporation is the same as shouting in a town square. As the "Wrinkle" cases (aggregation, databases) gain traction, the law will likely shift to a **Control/Context** model, where sharing with a third party creates a duty of care, not a forfeiture of rights. Until then, you are living in the transition period where the rules depend entirely on which judge's theory of privacy wakes up that morning.
