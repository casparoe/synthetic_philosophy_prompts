prompt: |-
  I am applying for a small internal pilot grant — one semester, one person, coding in Python, enough budget for a couple of dozen participants or none at all — and I need a three-page research proposal. My half-formed idea: in the Copycat tradition, conceptual slippage is offered as the explanation of how a system gets from a literal reading of an analogy problem to the reading under which the problem becomes solvable, and the global measure of how settled a reading has become (temperature, in that tradition) is supposed to tell you when the system has arrived. I cannot see that the mechanism ever distinguishes a warranted slippage from a merely convenient one: the elegance of the answer seems to be doing the work, with the slippage read back off it after the fact. I want to know whether that is actually so — whether there is any answer-independent criterion by which one slippage can be called warranted and another ad hoc.

  Turn this into the proposal. State the question so that it has a determinate answer and so that a null result would be informative, and explain why the existing work in this tradition leaves the question open rather than settling it. For the method, do not use the letter-string domain; everyone has seen those problems and the answers are memorized. Propose a microdomain instead — say what its primitives are, what the literal reading of an item is, which slippages it permits, and how many items it takes — and design the study so that it separates the two hypotheses: that slippage is answer-driven, and that it is constrained by something internal to the domain. Specify the computational model I would build and what it must predict, a manipulation that seeds a different goal, and the results that would count as the project failing rather than succeeding. Be honest about what fits in a semester and what does not. Do not bother with citations; I will add those.
