  **Ranking:** 1. Environmental Externalism (requires empirical investigation of surroundings), 2. Causal-Historical Externalism (requires tracing testimonial chains).

  ### Tier 2: The Reliability Constraints
  **Theses:** Teleosemantic Externalism, Swamp-Duplicate Externalism
  **Justification:** These theses constrain the reliability of introspection, forcing the agent to rely on external facts about biology or history to validate whether their states track truth at all.
  **Ranking:** 1. Teleosemantic Externalism (offers a functional audit of cognitive hardware), 2. Swamp-Duplicate Externalism (offers only paralyzing skepticism with no constructive path).

  ### Tier 3: The Agency Relocators
  **Theses:** Social Externalism, Collective-Cache Externalism
  **Justification:** These theses relocate the very ownership of content to the group, making individual calibration a category error subordinate to collective hygiene.
  **Ranking:** 1. Social Externalism (individual holds the state, community fixes the meaning), 2. Collective-Cache Externalism (the collective holds the state, individual is merely storage).

  ***

  ### The Monday Morning Change
  **Thesis:** Collective-Cache Externalism.

  **The Change:** Stop treating unresolved confusion as a personal failure of calibration to be solved via solitary meditation or reading; instead, treat it as a synchronization error between nodes and immediately invest energy into repairing the communication protocols or finding the specific peer who holds the missing fragment of the computation.
