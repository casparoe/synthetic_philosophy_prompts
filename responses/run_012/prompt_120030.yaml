  9.  **Key Insight to Highlight:** Aumann's theorem is about *information sets*, not *opinions*. When you state an opinion, you are compressing your information set. Your friend cannot decompress it perfectly without knowing your compression algorithm (your brain/priors). Therefore, Common Knowledge is not achieved.

  10. **Final Polish:** Ensure the distinction between "Common Knowledge of Posteriors" (AAT requirement) and "Common Knowledge of Claims" (Real life) is clear. (Self-correction: Make sure to emphasize that *computational* rationality is part of the AAT assumption too, not just Bayesian updating).

