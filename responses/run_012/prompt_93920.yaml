      *   **Task:** Diagnose the disagreement. Test the user's hypothesis (don't just humour it). Tell them where they might be wrong. Define what would count as progress (typology, split questions, formal logic, or admission of insolubility).
      *   **Tone:** Intellectual, rigorous, direct, avoiding platitudes. No survey of opinions, but a structural analysis.

  2.  **Deconstruct the User's Hypothesis:**
