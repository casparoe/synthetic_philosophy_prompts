  9.  **Final Polish:** Check against the prompt's constraints. (No survey, test the hypothesis, say what counts as progress). *Self-Correction during drafting:* Make sure I don't just agree with the user. I need to find the flaw. The flaw is thinking the historical thesis is *doing no work*. It *is* doing work, just not the work of settling the moral question. It's acting as a boundary marker.

  10. **Final Structure:**
