prompt: |-
  I teach ethics, but I did enough micro and trade theory in a previous life to follow the machinery — comparative advantage, gains from trade, Edgeworth boxes, terms of trade, externalities, incomplete contracts, second-best — and I've been trying to think about moral trade in those terms. By moral trade I mean the thing where two people with different moral views both come out ahead by swapping behaviours: the vegetarian who thinks eating meat is a serious wrong and the carnivore who thinks vegetarianism is a waste of a good dinner agree that the carnivore goes vegetarian for a year and the vegetarian kicks money to a cause the carnivore actually cares about, and each of them thinks the resulting outcome is morally better than the baseline. I want you to restate the whole business — what makes a trade possible in the first place, what the terms of trade are, when trades get blocked, when a trade is wrong even though both parties wanted it — in the economist's vocabulary, as faithfully as you can manage. Then give me the residue report: what didn't survive the translation? I'm especially curious whether that vocabulary can say anything about trades that screw over third parties (the animals, say) beyond gesturing at externalities, and whether the fact that each party is trading in their own moral currency rather than in utility marks a real distinction or is just me smuggling in a concept economics deliberately refuses to have. Tell me where the residue is a hole in the target framework and where it's a sign that the moral-trade idea is vaguer than it looks. No need to cite anyone, I care about the translation, not the literature.
