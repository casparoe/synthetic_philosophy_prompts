  8.  *(Final thought before generating)*: The user asked about "Moral Currency." I need to be careful. If I treat moral value as utility, the translation is perfect. If moral value is distinct (e.g., integrity), the translation fails. I should argue that the "residue" here reveals that "Moral Trade" is often implicitly utilitarian, and if it tries to be deontological, the economic machinery jams.

