answer: |-
  Here is the translation of moral trade into the vocabulary of microeconomic theory, followed by the residue report on what fails to map.

  ### Part I: The Economic Translation

  **1. The Endowment and the Goods**
  In this framework, the "goods" being traded are not consumption bundles but **actions** or **states of the world** over which the agents have control.
  *   **Agent A (Vegetarian):** Endowed with control over their own capital (money) and a high marginal valuation of "Reduced Animal Suffering."
  *   **Agent B (Carnivore):** Endowed with control over their own diet and a high marginal valuation of "Support for Cause X" (or simply "Capital Retention").
  *   **The Box:** The Edgeworth box dimensions are the levels of the two actions: $D$ (Dietary Restriction) and $C$ (Charitable Contribution). The initial endowment point is the *status quo* (B eats meat, A keeps money).

  **2. Preferences and Divergence**
  For trade to occur, agents must have different **Marginal Rates of Substitution (MRS)** between the two moral goods at the endowment point.
  *   Agent A is willing to give up a large amount of $C$ for a small unit of $D$.
  *   Agent B is willing to give up a small amount of $D$ for a large amount of $C$.
  *   This divergence creates a **lens of mutually beneficial exchange**. The indifference curves represent "moral satisfaction" (or the minimization of moral regret).

  **3. The Transaction**
  The agreement is a movement from the endowment point to a point on the **Contract Curve**.
  *   **Terms of Trade:** The exchange rate (e.g., 1 year of vegetarianism per $5,000 donation). This price clears the "moral market" between the two agents.
  *   **Gains from Trade:** Both agents move to a higher moral indifference curve. In welfarist terms, both achieve higher utility. In moral terms, both believe the world is now "better" according to their own objective functions.
  *   **Comparative Advantage:** Agent B has a comparative advantage in producing dietary restriction (it costs them less utility to stop eating meat than it costs Agent A to produce the same restriction), while Agent A has a comparative advantage in producing charitable capital.

  **4. Frictions and Blockages**
  *   **Transaction Costs:** The cost of negotiating the agreement, verifying compliance (does B actually stay vegetarian?), and enforcing the contract.
  *   **Incomplete Contracts:** It is difficult to specify every contingency (e.g., what if B eats fish? Is that vegetarian?). This creates **hold-up problems** or **moral hazard**.
  *   **Asymmetric Information:** Agent A may not know if Agent B truly values Cause X, or Agent B may not know if Agent A's donation is effective.

  **5. Third Parties and Externalities**
  *   **The Animals:** They are **third-party agents** not represented in the Edgeworth box. Their welfare is affected by the trade (positively, in this case).
  *   **Externality:** If the trade negatively affected a third party (e.g., A and B agree to dump waste to fund a charity), this is a **negative production externality**.
  *   **Missing Markets:** If the third party (animals) cannot property rights or bargain, their welfare is an **externality**. The trade is Pareto efficient *for the agents at the table*, but potentially Pareto inefficient for the universe if the third-party harm exceeds the agents' gains.

  ***

  ### Part II: The Residue Report

  The translation is surprisingly clean regarding the *mechanics* of exchange, but it dissolves specific ethical textures. Here is where the residue accumulates, categorized by whether it indicates a hole in the economic framework or vagueness in the moral trade concept.

  #### 1. Moral Currency vs. Utility (The "Smuggling" Charge)
  **The Issue:** You asked if trading in "moral currency" is a real distinction or just smuggling.
  **The Translation:** Economics treats "moral satisfaction" as a utility input. If I feel good about being vegetarian, that is utility. If I feel bad about eating meat, that is disutility.
  **The Residue:**
  *   **Vagueness in Moral Trade:** If the moral trader is a **consequentialist** (utilitarian), there is no residue. "Moral currency" *is* utility. The trade is simply utility arbitrage.
  *   **Hole in Target Framework:** If the moral trader is a **deontologist** (Kantian, rights-based), the translation breaks. Deontology often posits **lexical preferences** or **constraints**, not smooth indifference curves.
      *   *Example:* If Agent A believes "Eating meat is a sin," they cannot trade it away. It is not a good with a price; it is a forbidden action. The indifference curve becomes L-shaped (perfect complements) or vertical (no substitution possible).
      *   *Verdict:* If "moral trade" implies you can swap duties, it is implicitly utilitarian. If it claims to respect deontological constraints while trading, the concept is vague. Economics exposes this: you cannot have smooth trade-offs *and* absolute prohibitions simultaneously. The economic framework forces the moral trader to admit they are maximizing a value function, not obeying categorical imperatives.

  #### 2. The Integrity Objection (Endogenous Preferences)
  **The Issue:** In ethics, *how* you achieve the good matters for your character. Selling out a principle might corrupt the agent, even if the outcome is better.
  **The Translation:** Standard micro assumes **fixed preferences**. It does not model how the act of trading changes the trader's future utility function.
  **The Residue:**
  *   **Hole in Target Framework:** Economics is generally static regarding preference formation. It struggles to model **moral habituation** or **integrity costs**. If trading a moral principle lowers my future ability to hold principles (a dynamic constraint), the static Edgeworth box misses the long-term cost.
  *   **Vagueness in Moral Trade:** Often, proponents of moral trade assume the "principle" is separate from the "agent." If the trade corrodes the agent's integrity, the "gain from trade" is illusory. The moral trade concept often fails to specify if the *action* or the *agent's relationship to the action* is the locus of value. Economics highlights this by asking: "Is integrity a consumption good or a capital stock?"

  #### 3. Third Parties (The Animals)
  **The Issue:** Can economics say anything about the animals beyond "externality"?
  **The Translation:** Economics handles this via **Property Rights** and **Coasean Bargaining**.
  **The Residue:**
  *   **Hole in Target Framework:** Economics is agnostic about *who* holds rights. It can model animals as having rights, but it cannot *justify* why they should. It treats the assignment of standing as exogenous (political/normative).
  *   **Vagueness in Moral Trade:** The moral trade concept often assumes the third party is "helped." But if the trade is between two humans about a third party's rights, it is **paternalistic**.
      *   *The Economic Insight:* If the animals are the true stakeholders, the humans are trading **property rights they do not own**. This is not a Pareto improvement; it is a transfer of stolen goods.
      *   *Verdict:* This is a hole in the *moral trade* idea, exposed by economics. Unless the humans own the animals (which they don't, morally speaking), they are trading externalities. Economics clarifies that without assigned property rights to the third party, "efficiency" is ill-defined. The "residue" here is the realization that moral trade often ignores the **entitlement structure**.

  #### 4. The "Wrong Trade" Problem
  **The Issue:** When is a trade wrong even if both parties want it? (e.g., A and B agree to discriminate against C).
  **The Translation:** In economics, this is a **negative externality** imposed on C. If C is not compensated, the trade is Kaldor-Hicks efficient but not Pareto efficient.
  **The Residue:**
  *   **Hole in Target Framework:** Economics calls this "inefficient" if the harm to C > gain to A+B. But ethics might call it "wrong" even if the gain to A+B > harm to C (e.g., selling a kidney, selling voting rights).
  *   **Vagueness in Moral Trade:** This reveals that "Moral Trade" often relies on a specific **social welfare function**. If the SWF is utilitarian, the trade is good. If the SWF includes rights constraints, the trade is blocked.
  *   *Verdict:* The economic vocabulary forces the moral trader to specify their Social Welfare Function. If the trader says "This trade is wrong despite mutual gain," they are admitting their SWF is not welfarist. Economics can model this (via constraints), but it shows that "Moral Trade" is not a universal good; it is only good relative to a specific SWF.

  ### Summary of the Residue

  1.  **Utility vs. Duty:** If "moral currency" is distinct from utility (i.e., duties are not fungible), the economic machinery jams. This suggests "Moral Trade" is usually a utilitarian project masquerading as general ethics. **(Vagueness in Moral Trade)**.
  2.  **Integrity:** Economics ignores the cost of trading on the trader's character. This is a limitation of the static economic model, but also a blind spot in moral trade advocacy. **(Hole in Target Framework & Vagueness in Moral Trade)**.
  3.  **Third Parties:** Economics handles this cleanly as missing property rights. The residue is the realization that moral traders often trade rights they don't possess. **(Vagueness in Moral Trade)**.
  4.  **Normative Foundations:** Economics cannot tell you *which* moral trades are permissible, only which are efficient given a set of preferences. The "wrongness" of a consensual trade must come from outside the model (constraints/rights). **(Hole in Target Framework)**.

  **Final Verdict:** The economic vocabulary acts as an X-ray. It shows that "Moral Trade" is structurally sound *if and only if* the underlying ethics is consequentialist and the property rights of third parties are clearly defined. Where the concept feels vague (e.g., "Is this selling out?"), the economic translation reveals that the vagueness is actually a conflict between welfarist gains and deontological constraints. The "moral currency" you suspect you are smuggling is real, but it is incompatible with the smooth substitution required for the Edgeworth box to work. You are trying to trade in a market that assumes fungibility, using coins that are sometimes non-fungible.
