answer: |-
  You have correctly identified that you are squishing three distinct mechanisms into one heuristic. Your intuition is sharp, but the underlying engines are different.

  Here is the breakdown of the shape of the idea, the contradictions, and the limits.

  ### 1. The Name
  There is no single colloquial name for the *heuristic* itself, but the economic phenomenon you are describing is **Adverse Selection**.

  You mentioned you know "information asymmetry." Here is the distinction:
  *   **Information Asymmetry** is a state of being (I know something you don't).
  *   **Adverse Selection** is the dynamic consequence (Because I know something you don't, I am more likely to offer you the bad stuff, so the fact that you received an offer tells you it's bad stuff).

  The specific "move" where the existence of the offer proves the quality is low is the defining feature of Adverse Selection. It is most famously modeled as **The Market for Lemons** (Akerlof).

  However, your examples (a), (b), and (c) are not all Adverse Selection. You are conflating Adverse Selection with **Efficient Markets** and **Signaling**.

  ### 2. Are (a) and (b) the same argument?
  No. They are logically opposite arguments that result in the same behavioral output ("Don't do it").

  *   **Case (a) & (d) [GPU/Landlord]: This is Adverse Selection.**
      *   **Mechanism:** Hidden Quality.
      *   **Logic:** The counterparty knows the *true quality* is lower than the *market price*. They are offloading risk.
      *   **Why the offer is bad:** The offer exists *because* the item is defective.
      *   **Status:** Textbook settled. This is how used car and insurance markets work.

  *   **Case (b) [API Promo]: This is Efficient Market Hypothesis (EMH).**
      *   **Mechanism:** Public Information + Competition.
      *   **Logic:** The opportunity is visible to everyone. If it were valuable, others would have consumed it already.
      *   **Why the offer is bad:** The offer exists *despite* the item being worthless (or already priced in).
      *   **Status:** Contested in practice, but the theoretical logic is standard. Markets are not perfectly efficient, but they are efficient *enough* that free money lying around is usually a trap or a mistake.

  *   **Case (c) [Recruiter]: This is Signaling Theory.**
      *   **Mechanism:** Costly Signals.
      *   **Logic:** High-quality agents don't need to incur the cost of cold outreach; they attract inbound. Low-quality agents must outbound to fill slots.
      *   **Why the offer is bad:** The *method* of the offer reveals the status of the offerer.
      *   **Status:** Textbook settled.

  **Summary:** You have one heuristic ("Don't touch") triggered by three different alarms: "It's broken" (Adverse Selection), "It's gone" (Efficiency), and "They're desperate" (Signaling).

  ### 3. The Missing Condition (The Baker Problem)
  You asked what stops this from condemning every ordinary purchase (like bread). The alarm only fires when three conditions are met simultaneously. If any one is missing, the alarm stays off.

  1.  **Quality is Opaque (Experience Good):** You cannot verify the quality before consumption. You can see the bread; you cannot see the GPU's remaining lifespan or the startup's culture.
  2.  **Value is Variable:** Not all loaves are different, but every used GPU is different. If the goods are standardized (commodities), Adverse Selection cannot hide.
  3.  **Counterparty Incentive to Dump:** The seller benefits more from offloading a bad unit than maintaining a reputation. A baker needs repeat customers; a used GPU seller on eBay often does not.

  **The Baker Case:**
  *   Opaque? No (you can see/smell it).
  *   Variable? Low (standardized recipe).
  *   Incentive? Low (repeat business).
  *   **Result:** Alarm off.

  **The GPU Case:**
  *   Opaque? Yes (wear and tear hidden).
  *   Variable? High (every card is unique).
  *   Incentive? High (one-off sale).
  *   **Result:** Alarm on.

  ### 4. The Self-Eating Version
  You asked: *If everyone knows the deal is bad, the deal becomes good for the contrarian, so shouldn't they take it?*

  This is a real, famous problem. It is called the **Grossman-Stiglitz Paradox** (1980).

  *   **The Paradox:** If markets are perfectly efficient (all information is priced in), no one has an incentive to gather information. But if no one gathers information, prices cannot reflect information, so markets cannot be efficient.
  *   **The Resolution:** Markets exist in a state of **bounded inefficiency**. They are inefficient *just enough* to compensate the people who do the work of verifying deals.
  *   **Status:** This is not a mistake on your part. It is a foundational tension in financial theory. The consensus is that markets are not *perfectly* efficient, which is why people like your coworker (who checked the API docs) can sometimes find edge cases, but mostly they are efficient enough that your brother's heuristic (stay away) is the correct default for 95% of people.

  ### 5. The Borderline Case (The Shift Swap)
  *Case: Coworker wants to swap on-call shifts. He wants the weekend; you don't care.*

  **Verdict:** The alarm should **not** fire.

  **Why:**
  This fails the **Adverse Selection** test because the value is **Subjective**, not **Objective**.

  *   **Objective Value (GPU/Stock/Bread):** There is a "true" value we both agree on, but one of us knows it better. This creates asymmetry.
  *   **Subjective Value (Shift Swap):** There is no "true" value. The shift is objectively identical for both of you. The *utility* differs based on preference.

  He is not selling you a "bad shift" (hidden defect); he is trading his *preference for weekends* for your *indifference*. There is no hidden information about the shift itself. Furthermore, the **Repeated Interaction** condition is met (you work together), so if he screwed you, he'd pay a reputational cost.

  **The Feature Doing The Work:** **Preference Heterogeneity.** When a trade is based on differing preferences rather than differing information, the offer does not signal hidden defects.

  ### 6. Honesty on Status
  *   **Adverse Selection / Lemons:** Textbook settled. This is how the GPU and Landlord cases work.
  *   **Signaling:** Textbook settled. This is how the Recruiter case works.
  *   **Efficient Markets (API):** Heavily contested in practice. Quant funds argue about the degree of efficiency daily. However, the heuristic "free money is usually a trap" is practically robust for non-professionals.
  *   **Grossman-Stiglitz:** Theoretical consensus that it is a paradox, practical consensus that markets muddle through via "noise traders."
  *   **Your Mash-up:** You are correctly observing that human heuristics compress distinct economic mechanisms into a single "Danger" signal. This is rational cognitive compression, even if the underlying math differs.

  ### 7. If I Must Coin a Name
  Since you asked for a label for the *heuristic* itself (the mental move, not the economic theory):

  **Name:** **The Counterparty Knowledge Assumption**

  **Definition:** A decision rule where the recipient of an unsolicited or opportunistic offer assumes the offeror possesses negative private information regarding the offer's value, unless proven otherwise.

  **Coverage:**
  *   Covers: Used goods, cold outreach, "too good to be true" financial offers, lease breaks.
  *   Does Not Cover: Standardized retail (bread), preference-based trades (shift swaps), gift-giving (no counterparty gain).

  **The Edge Case:**
  *   **Scenario:** A friend offers to sell you their car for well below market value because they are moving overseas urgently.
  *   **Why it's on the edge:**
      *   *Alarm On:* Adverse Selection (Is the car a lemon?).
      *   *Alarm Off:* Signaling (Friendship implies trust/reputation risk) + Liquidity Shock (Urgent need for cash explains the discount without implying defects).
  *   **Decision:** You would need to verify the "Liquidity Shock" claim. If true, the deal is real. If false, the Alarm fires. This is the boundary where **Urgency** competes with **Asymmetry**.
