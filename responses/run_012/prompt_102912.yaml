      *   **Bayesian:** Probabilities are degrees of belief. No proposition is immune to evidence unless its prior is exactly zero (dogmatism). 10,000 sensors with 10^-6 error rates yield a likelihood ratio of (10^6)^10,000, which is astronomically high. Unless the prior is literally 1 (impossibility), the posterior probability approaches 1. If the event happens, the law was either wrong or incomplete, not "violated" in a metaphysical sense, but certainly rational to believe the *report* over the *generalization*.

