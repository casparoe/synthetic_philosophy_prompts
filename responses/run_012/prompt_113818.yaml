answer: |-
  **Essay Question**

  A former student has argued that money-pump arguments do not establish a genuinely diachronic requirement of rationality. Their claim is that any sequential pump can be "collapsed" into a single one-shot offer: "Hand me three dollars and I will cycle your holdings back to where they started." Since no rational agent would accept this single package, the student concludes that the sequential version is merely this package chopped into stages. On this view, the pump reveals nothing about how attitudes must hang together across time; it reduces to a synchronic coherence requirement on preferences.

  Write an essay evaluating this "collapse argument." In doing so, you must rigorously distinguish three claims: (1) that the agent can be made to pay for nothing; (2) that the agent's preferences are incoherent; and (3) that the agent violates a diachronic requirement governing choice over time. Analyze whether the "sophisticated" or "resolute" strategies for avoiding pumps succeed in vindicating intransitive preferences or merely decouple exploitability from irrationality. Conclude with a defended verdict: do money-pump arguments establish a requirement that is genuinely diachronic, or do they collapse into synchronic coherence?

  ***

  **Model Answer**

  The collapse argument fails because it conflates the *outcome* of a decision process with the *structure* of the choice situation. While it is true that a rational agent should not accept a package deal that results in a net loss for no gain, the money pump demonstrates that an agent can arrive at this loss through a series of choices that each appear locally rational. The collapse argument assumes that because the final outcome is irrational, the defect must lie in a single synchronic judgment. This overlooks the dynamic nature of the exploitation.

  To evaluate this, we must distinguish three distinct claims. First, the fact of exploitability: the agent ends up with their original holding minus three dollars. Second, the claim of preference incoherence: the agent prefers A to B, B to C, and C to A. Third, the claim of a diachronic violation: the agent fails to manage their future choices in light of their current knowledge. The collapse argument conflates these. It assumes that because the outcome (Claim 1) is undesirable, and preferences (Claim 2) cause the outcome, the irrationality must be synchronic. However, the loss only occurs because the agent makes a sequence of decisions. If the agent could bind themselves at the start, they would avoid the loss without changing their underlying preferences. This suggests the failure is not merely in the ranking of goods, but in the management of choice over time (Claim 3).

  Consider the "sophisticated" chooser. This agent uses backward induction to predict their future choices. Knowing they will trade C for A later, they refuse to trade A for B now. They avoid the pump. Does this vindicate intransitive preferences? No. It merely shows that exploitability and irrationality can come apart. The sophisticated agent avoids the loss, but only by refusing trades they currently prefer. They effectively treat their future self's irrationality as a constraint on their current choice. This acknowledges a diachronic tension: my current choice is limited by my prediction of my future failure.

  Consider the "resolute" chooser. This agent adopts a plan at the start and refuses to deviate, even when a local trade looks beneficial. They also avoid the pump. However, resoluteness requires a normative principle that is inherently diachronic: "Stick to the plan." If rationality were purely synchronic, the agent should always maximize utility at the moment of choice. Resoluteness demands that the agent prioritize the global outcome over the local preference satisfaction. This explicitly invokes a diachronic norm.

  Therefore, the collapse argument is incorrect. The "package" offer is not equivalent to the sequence because the package assumes the agent has the power to commit to the whole cycle at once. The sequential pump tests whether the agent can maintain rationality without that external commitment device. The pump shows that if an agent treats each choice as a fresh, independent maximization problem based on intransitive preferences, they will be exploited. Avoiding this requires either changing preferences (synchronic) or constraining future choices based on past plans (diachronic).

  My verdict is that money-pump arguments establish a genuinely diachronic requirement. The strongest opposing view is that the defect is entirely synchronic: the agent simply has "bad" preferences that value a cycle of trades negatively. However, this ignores the naive agent who genuinely prefers each step. For the naive agent, every choice is locally optimal. The irrationality emerges only in the aggregation of these choices over time. A synchronic norm cannot condemn a choice that is optimal at the moment it is made. Only a diachronic norm, which requires that current choices align with the welfare of the temporally extended agent, can explain why the sequence is forbidden while the individual steps appear permissible. The requirement is not merely to have transitive preferences, but to ensure that one's future choices do not undermine one's current welfare—a constraint that exists only across time.

  ***

  **Marking Scheme (20 Marks)**

  **1. Reconstruction of the Collapse Argument (4 marks)**
  *   **Criteria:** Accurately explains the claim that sequential choices are equivalent to a single package deal and that irrationality must therefore be synchronic.
  *   **Typical Error:** Strawmanning the collapse claim as merely saying "losing money is bad" rather than addressing the structural equivalence argument.

  **2. Distinguishing Exploitability from Incoherence (4 marks)**
  *   **Criteria:** Clearly separates the empirical fact of losing money from the normative claim about preference ordering.
  *   **Typical Error:** Conflating "this agent can be exploited" with "this agent's preferences are irrational" (treating exploitability as a definitive proof of incoherence without nuance).

  **3. Distinguishing Synchronic from Diachronic Norms (4 marks)**
  *   **Criteria:** Identifies that synchronic norms govern single moments, while diachronic norms govern the relationship between choices at different times.
  *   **Typical Error:** Treating dynamic choice as just a "long static choice," thereby missing the specific problem of time and commitment.

  **4. Analysis of Sophistication and Resoluteness (4 marks)**
  *   **Criteria:** Explains that these strategies avoid the pump but do not make intransitive preferences rational; they highlight the tension between local and global rationality.
  *   **Typical Error:** Claiming that sophistication or resoluteness "solves" the problem by making intransitive preferences fully rational/consistent.

  **5. Defended Verdict on Diachronicity (4 marks)**
  *   **Criteria:** Takes a clear stance (Diachronic vs. Synchronic) and argues against the strongest version of the opposing view using the distinctions above.
  *   **Typical Error:** Sitting on the fence ("it depends") or asserting a verdict without engaging the collapse argument's specific challenge to diachronicity.
