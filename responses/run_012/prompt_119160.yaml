      *   *Re-evaluating 1 vs 8:* This is the strongest conflict. If "State" means "State," 8 is wrong. If 8 is right, "State" must be ambiguous. The user says 1 is "if legislature didn't put it in, it's not a rule." 8 effectively puts "Federal" in where "State" was written. This is the biggest headache.

