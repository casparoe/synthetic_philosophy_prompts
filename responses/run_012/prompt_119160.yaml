      *   *Cluster 3: Who Decides Ambiguity? (Principles 3, 6).*
          *   Conflict: 3 says Judge looks at purpose. 6 says Agency decides.
          *   Severity: **Medium.** Note: *Chevron* is dead (2024), but logically they conflict.
          *   Fix: Hierarchy. Text -> Ambiguity -> Agency (if delegated) OR Text -> Ambiguity -> Purpose (if no agency).
      *   *Cluster 4: The Typo Exception (Principle 5).*
