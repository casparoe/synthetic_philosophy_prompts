          *   Fix: Define "obvious."

  6.  **Refining the "Cheapest Fix":**
      *   The user wants to keep their beliefs.
      *   *Biggest fix:* Reconcile 1 and 8. The user likes *King v. Burwell* (8) but claims strong textualism (1). To keep 8, they must soften 1 to allow "contextual ambiguity."
      *   *Second biggest fix:* Reconcile 2 and 7. Need to explain Original Public Meaning vs. Expected Application.
