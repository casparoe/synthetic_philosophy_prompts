  9.  **Self-Correction during drafting:** I initially thought about telling them *Chevron* is gone. I should mention it, but focus on the *logical* tension they asked for, as the principle of deference still exists in weaker forms (*Skidmore*). I need to make sure I don't just say "you're wrong on 6." I need to show how 6 conflicts with 1 and 3.
