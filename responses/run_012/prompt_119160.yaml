      4.  *Terms of Art (Original Meaning):* Legal terms mean what lawyers knew then.
      5.  *Scrivener's Error:* Fix obvious typos to match intent/scheme.
      6.  *Administrative Deference (Chevron):* Agencies decide ambiguity, not judges.
      7.  *Application of Old Text to New Tech (4th Amend):* Phones protected despite 1791 context.
      8.  *King v. Burwell (Obamacare):* Context/Purpose overrides strict text ("State" includes Federal).

  3.  **Initial Brainstorming & Conflict Detection:**

      *   *Conflict A: Text vs. Purpose (1 vs. 3 & 8).* Principle 1 says "words are law, don't add." Principle 3 says "if ambiguous, use purpose." Principle 8 is the ultimate test case of 3 overriding 1. Is "State" ambiguous? Textualists say no. Purposivists say yes. This is a major tension.
      *   *Conflict B: Originalism vs. New Tech (2 vs. 7).* Principle 2 says meaning fixed in 1791. Principle 7 says 4th Amendment covers phones. How do you square "fixed meaning" with "things that didn't exist"? (Original Public Meaning vs. Original Application). This is a classic theoretical hurdle.
      *   *Conflict C: Judge vs. Agency (1 & 3 vs. 6).* Principle 1 says judges shouldn't make law. Principle 6 says let agencies decide ambiguity. But *Chevron* was recently overturned (*Loper Bright*). More importantly, if words are law (1), why defer to an agency on ambiguity? If the text is clear, agency doesn't matter. If text is ambiguous, who decides? 3 says judge uses purpose. 6 says agency decides. These compete for who fills the gap.
