      *   *Wait, I need to be decisive.* I will tell them Tambora is *okay* for Weight but fails Voice. I will recommend **The Black Death** or **1918 Flu**. Let's pick **1918 Flu**. It's modern, documented, and clearly non-human but interactive.
      *   *Actually, looking at the "Causal Voice" definition:* "does, wants, intends, suffers, or responds." A virus *responds* (immune pressure). A volcano does not. So for the distinction to work, the example *must* have the capacity to "respond." Tambora lacks this. I must advise them to change the example to a biological one.

  4.  **Sequencing the 75 Minutes:**
      *   **0-10 min:** Hook & Definitions. Establish the "Human-Only" default. Introduce Weight vs. Voice.
      *   **10-30 min:** Apply "Weight" to the Example. Show everyone agrees on the counterfactuals.
      *   **30-50 min:** Apply "Voice" to the Example. The friction point. Where does "cause" become "actor"? Address the "Metaphor" suspicion here.
