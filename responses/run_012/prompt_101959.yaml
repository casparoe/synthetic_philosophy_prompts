      *   Actually, the "New Materialists" argue we *should* grant Voice. The "Traditionalists" say Voice is only for humans. The TA wants students to see the *distinction* so they can choose.
      *   So the lesson is: You can admit the Flu changed history (Weight) without saying the Flu "wanted" to change history (Voice). OR, you can say the Flu "acted" (Voice) to mean it interacted dynamically, not that it had a mind.
      *   The key is showing that *conflating* them is where the error lies.

  10. **Final Polish:**
      *   Ensure American English spelling/idioms.
