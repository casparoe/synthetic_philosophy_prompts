      *   *Misconception 2:* Agency = Metaphor. (Address during Voice section).
      *   *Misconception 3:* Environmental = Determinism. (Address during the Collapse section).

  6.  **Check for Understanding:**
      *   Don't ask for definitions. Ask them to apply the distinction to a *new* case or rewrite a sentence.
      *   Task: Take a sentence attributing agency to a non-human and rewrite it to preserve Weight but strip Voice, then vice versa.

  7.  **What to Leave Out:**
      *   Don't get bogged down in specific philosophical ontologies (Latour vs. Bennett vs. Chakrabarty) unless necessary for the distinction. Keep it methodological.
      *   Don't solve the debate. The goal is to give tools to *take a side*, not to tell them which side is right.

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Intro:* Need to validate their suspicion. Yes, this sounds like determinism. Here is why it might not be.
      *   *The Example:* I need to be firm. Tambora is a "force," not an "actor" in the sense of response. I will recommend **The 1918 Influenza Pandemic**. It allows for "response" (mutation) which tests the "Voice" definition better.
      *   *The Flow:*
          1.  Define Weight (Counterfactual).
          2.  Define Voice (Narrative/Agency).
          3.  Test Example on Weight (Easy).
          4.  Test Example on Voice (Hard/Contested).
          5.  Show the Collapse (Determinism).
          6.  Show the Separation (Nuance).
      *   *Timing:* 75 mins is tight. Need strict timekeeping.

  9.  **Refining the "Causal Voice" Concept:**
      *   The TA defines Voice as "narrate that entity as an agent: as something that does, wants, intends, suffers, or responds."
      *   Crucial point: History writing *requires* Voice for humans. The question is whether we *grant* it to non-humans.
      *   The "Determinism" trap: If the Volcano has Weight, and we say "The Volcano caused the famine," we might imply the Volcano *acted* to cause it. If we say "The Volcano erupted, leading to conditions where famine occurred," we keep Weight but remove Voice.
