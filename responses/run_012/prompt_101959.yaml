      *   **Time:** 75 minutes.
      *   **Audience:** Intelligent first-year grad students, mostly trained in human-centric history, suspicious of non-human agency (see it as metaphor or determinism).
      *   **Goal:** Give students tools to take a side in a debate (theoretical advance vs. rhetorical upgrade).
      *   **Constraint:** Do *not* explain the topic to the TA. Provide a *teaching plan* (sequencing, logic, pedagogy).
      *   **Core Concept:** "Causal Weight" vs. "Causal Voice" (TA's own distinction).
      *   **Specific Task:** Sequence the session, evaluate the "Tambora" example, identify misconceptions and when to address them, design a check for understanding, and specify what to leave out.
      *   **Tone:** American English, professional, pedagogical, rigorous.

  2.  **Deconstruct the Core Distinction (Weight vs. Voice):**
      *   *Causal Weight:* Counterfactual impact. (If X didn't happen, would Y change?) This is standard positivist/analytic history.
      *   *Causal Voice:* Narrative agency. (Does X *act*, *intend*, *resist*?) This is the ontological/narrative turn.
      *   *The Trap:* Environmental Determinism = High Weight implies High Voice (or ignores Voice).
      *   *The Goal:* Show that acknowledging Weight doesn't *require* granting Voice, but granting Voice changes *how* we write history even if Weight stays the same. Or, conversely, that Voice is only legitimate under specific conditions distinct from Weight.
      *   *Refinement:* The prompt suggests the TA believes the "historical actor" language is useful *precisely when it keeps the two apart.* So the lesson must show that conflating them leads to determinism, while separating them allows for nuanced non-human agency.

  3.  **Evaluate the Example (Tambora/Year Without a Summer):**
      *   *Pros:* High causal weight (global cooling, crop failure, migration, disease). Clear non-human origin.
      *   *Cons:* It's very "deterministic" on the surface. Volcano erupts -> humans suffer. It risks reinforcing the "environment as backdrop/hammer" view rather than "actor." It lacks *interaction* or *response*. A volcano doesn't "respond" to humans.
      *   *Verdict:* It's good for establishing *Weight*, but bad for establishing *Voice*. If the goal is to distinguish the two, starting with Tambora is risky because it makes the "Voice" claim look like pure metaphor.
      *   *Alternative/Modification:* Need an example where the non-human element *interacts* or *transforms* the human intention, not just crushes it. Germs (Smallpox/Columbian Exchange) are better because they "evolve" and "respond" (biologically) to human conditions, though they lack intent. Or, a flood management scenario (human builds levee, river changes course).
      *   *Decision:* Stick with Tambora *but* use it specifically to show the *failure* of Voice, then switch to a second example (Germs or River) to show where Voice might stick. Actually, the prompt asks for *one* carrying example. If I must choose one, Tambora is too passive. *Cholera* or *Smallpox* is better. Let's suggest *Cholera in 19th-century London* or *The Potato Blight*.
