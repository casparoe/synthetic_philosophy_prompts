prompt: |-
  Me and a friend have been going round in circles on the paradox of deontology — the worry that if a constraint against killing one person to save five is supposed to protect people from being killed, it's odd that the constraint forbids you from killing one precisely in order to stop five killings; the constraint seems to care about the act itself rather than the harm it exists to prevent, which makes it look self-undermining. I've ended up defending a line I've half made up myself and I want to know how exposed it is. The line is this: constraints are absolute — you may never violate one in order to prevent more violations of the same constraint — but they only bind you in your dealings with agents who are themselves bound by the same constraint, so a reciprocity or accountability condition fixes the scope. I suppose it probably has a proper name and I just don't know it, but I'm calling it reciprocity-restricted absolutism. I like it because it seems to explain why we owe the full constraint to fellow moral agents while keeping it absolute inside that circle.

  What would count against it? Rank the defeaters from fatal to merely awkward, and don't just give me the critics' list — tell me what someone who actually holds this would themselves concede counts against them. I'm most interested in three things. First, whether it collapses into something else once you spell out the reciprocity condition — contractualism, some rule-consequentialism, or a threshold view that isn't really absolutist at all. Second, the cases it can't describe, above all the non-reciprocators: infants, people with severe cognitive disabilities, animals, future people. If the constraint doesn't bind with respect to them, does the view license anything at all done to them, and is that a consequence I have to swallow or a reductio? Third, whether the paradox simply reappears inside the circle of reciprocators, so that the absolutism is doing no real work. Also be honest about whether I've quietly made the thing unfalsifiable by defining the circle of reciprocators so as to exclude exactly the hard cases, and whether that would even be a problem for a view like this. If you think one particular case or result decides the whole business, say which and why. I'd be most moved by a case involving someone who genuinely can't reciprocate.

  British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Paradox of Deontology (specifically, why it's wrong to kill 1 to save 5, even if the goal is to prevent killing).
      *   **User's Theory:** "Reciprocity-Restricted Absolutism" (RRA).
          *   Core claim 1: Constraints are absolute (never violate to prevent more violations).
          *   Core claim 2: Constraints only bind in dealings with agents bound by the same constraint (reciprocity/accountability condition).
      *   **Task:** Critique this theory. Rank defeaters from fatal to awkward.
      *   **Specific Focus Areas:**
          1.  Collapse into other theories (contractualism, rule-consequentialism, threshold deontology).
          2.  Non-reciprocators (infants, cognitively disabled, animals, future people). Does it license harm to them? Is this a *reductio*?
          3.  Internal paradox (does the paradox reappear inside the circle?).
          4.  Unfalsifiability/Ad hoc nature (defining the circle to exclude hard cases).
      *   **Tone/Style:** British English. Honest, philosophical, not just a list of critics but what a *proponent* would concede.
      *   **Key Requirement:** Identify if one particular case/result decides the whole business (specifically involving someone who genuinely can't reciprocate).

  2.  **Deconstruct the User's Theory (RRA):**
      *   It sounds like a hybrid of Kantianism (agency-based), Contractualism (mutual recognition), and Agent-Centred Restrictions.
      *   *Strength:* It attempts to solve the "paradox" by limiting the scope of the constraint. If I kill 1 to save 5, I am violating the constraint against the 1. If the 1 is a reciprocator, I wrong them. If the 5 are reciprocators, their deaths are tragic, but my *agency* is the locus of the constraint.
      *   *Weakness:* The reciprocity condition is the vulnerable point.

  3.  **Brainstorming Defeaters (Ranking Fatal to Awkward):**

      *   *Fatal:* The Non-Reciprocator Problem. If constraints only apply to reciprocators, do we have *no* deontological constraints against harming infants or the severely cognitively impaired? This seems morally abhorrent. If the user says "they are protected by *other* principles," then RRA isn't a complete moral theory. If the user says "they aren't protected," it's a *reductio*.
      *   *Fatal:* Collapse into Contractualism. If the binding force comes from reciprocity, isn't this just Scanlonian contractualism? If so, is it still "deontological" in the absolute sense? Contractualism often allows aggregation or justification to others that might look like threshold deontology.
      *   *Serious:* The "Free Rider" / Unilateral Disarmament problem. If a terrorist (non-reciprocator) threatens 5 reciprocators, can I kill 1 innocent reciprocator to save them? RRA says no (because the innocent is a reciprocator). But can I kill the terrorist? Yes. But what if I need to use the terrorist as a means? The boundary gets messy.
      *   *Awkward:* Defining the Circle. Is it ad hoc? If I define "reciprocator" as "someone I shouldn't kill," it's circular. If I define it as "rational agent," I exclude infants.
      *   *Awkward:* Internal Paradox. Does the paradox persist? Yes. Even within the circle, why can't I kill 1 to save 5? The reciprocity condition explains *who* I owe it to, but not *why* the constraint is agent-centred rather than outcome-centred.

  4.  **Drafting the Response (incorporating British English and specific constraints):**

      *   *Introduction:* Acknowledge the ingenuity. It's a recognised move (Kantian/Contractualist overlap).
      *   *Section 1: Collapse Worries.* Is it just Contractualism? (Scanlon). If the justification is "reasonable rejection," does it allow aggregation? If yes, RRA collapses. If no, it stays deontological but needs a better foundation than just "reciprocity."
      *   *Section 2: The Non-Reciprocator Problem (The Fatal Blow).* This is the big one. Infants, dementia, animals. If RRA says no constraint applies to them, it licenses experimentation/killing. This is the *reductio*. A proponent must concede this is the weakest link.
      *   *Section 3: The Internal Paradox.* Does it solve the original problem? Not really. It shifts the boundary but doesn't explain the *agent-centredness* within the boundary.
      *   *Section 4: Unfalsifiability/Ad Hoc.* Defining the circle to save the theory.
      *   *Conclusion:* The decisive case.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "Contractualism says X." I need to explain *why* RRA might collapse into it. If the binding force is mutual accountability, that *is* contractualism.
      *   *Nuance on Non-Reciprocators:* A sophisticated proponent might say "We owe them protection via *our* duties, not *their* rights." But RRA says constraints bind *in dealings with*. If they can't hold me accountable, do I have the constraint? If I say "Yes, because other reciprocators care," then the constraint isn't absolute/agent-centred anymore; it's derivative.
      *   *British English Check:* "Licence" (verb/noun distinction), "defence", "centre", "programme", "whilst", "amongst". Tone should be polite but rigorous (Oxbridge tutorial style).

  6.  **Developing the "Decisive Case":**
      *   The "Severely Cognitively Disabled Adult" vs. "Five Reciprocators."
      *   Scenario: A trolley case. One track has a severely cognitively disabled person (who cannot understand or reciprocate moral norms). The other has five moral agents.
      *   RRA Implication: If the constraint only binds with reciprocators, do I have a constraint against killing the disabled person? If no, I kill them. If yes, why? (If because "humanity," then reciprocity isn't the ground).
      *   This forces the choice: Abandon the reciprocity ground or accept a horrific conclusion.

  7.  **Final Polish:** Check against the prompt's specific questions.
