      *   British English? Yes.

  8.  *(Self-Correction during drafting)*: Make sure I don't sound too dismissive. The user's idea is actually a version of "Status-Based Deontology" or "Kantian Contractualism." I should acknowledge that lineage (Kant, Rawls, Scanlon, maybe Fichte on recognition). But stick to the critique.

      *   *Name check:* It's close to "Mutual Recognition" views (Hegel/Fichte) or "Contractualist Deontology." I should mention that it's not entirely "made up."
      *   *Fatal Defeater:* The Non-Reciprocator issue is definitely the strongest.
      *   *Collapse:* If the justification for the constraint is reciprocity, it's likely contractualist.
      *   *Internal Paradox:* The paradox remains because reciprocity doesn't explain *agent-centredness*.

      Let's structure the response clearly with headings or distinct sections for readability, maintaining the requested tone.

      *Wait, one more check:* "Tell me what someone who actually holds this would themselves concede counts against them." I need to adopt the voice of a sympathetic critic or describe the internal concessions. I will frame it as "Here is what you would have to concede."

      *Decisive Case:* The "Innocent Threat" who is a non-agent. Or the "Disabled Human." Let's go with the Disabled Human. It hits the "humanity" intuition hardest.

      *Unfalsifiability:* If I define reciprocators as "those whom it is wrong to kill," the theory is empty. If I define them as "rational agents," it excludes too many. This is a key tension.

