prompt: |-
  I chair a small community mediation service that the council funds — mostly neighbour rows and the odd planning dispute, two parties in a room, ninety minutes if I'm lucky, no power to impose anything, and whatever they agree has to be voluntary and signed off by both sides at the end. My friend and I got into a long, slightly wine-fuelled argument about it last week. She says compromise is always a betrayal: if you really hold a value, then splitting the difference with someone who denies it is just cowardice with better manners. I think that's too quick, because a lot of what I actually see aren't cases of meeting in the middle at all — they're cases where both sides can end up better off than they started by trading, one giving up something it barely cares about in exchange for something it cares about enormously, and the other doing the reverse. She came back with, fine, that works for preferences like parking spaces, but values aren't like that, you can't put a price on them, and then we just talked past each other for an hour. I want you to take my side seriously and turn it into something I can actually run in the room.

  So: write me a decision procedure, in order, with the questions I put to the parties, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision back to me or to the parties because it's a judgment call rather than something the procedure can settle. It has to keep hold of the distinction between two sides meeting in the middle and two sides swapping things they rank differently, and it has to handle the case where a party says some thing simply isn't on the table at all — won't trade it for any amount of the other thing — as opposed to the case where they're only ranking it low and could be moved. Flag which steps are real tests and which are me dressing up a hunch as procedure, and be honest about where the whole thing misfires, especially about whether you can get truthful rankings out of people who think admitting a low priority will lose them the case. Also alot of my cases involve one party who is far more articulate and confident than the other, and I'd like the procedure to say something about that rather than pretend it away.

  Then run it on three cases so I can watch it work: (1) a mosque and a residents' association fighting over evening use and parking at a shared community centre, where I suspect a trade is sitting there; (2) an environmental group and a fishing cooperative over a marine no-take zone, where one side treats the reef as non-negotiable; and (3) one I'd rather it didn't answer the way it will — a residents' group and a developer who can both clearly gain by trading on building height against parking, where the trade quietly dumps the noise and the traffic onto a street nobody has invited to the table. I don't want citations, reading lists, or names of philosophers; it needs to make sense to a colleague who's never opened a philosophy book; and please write it in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a small community mediation service (council-funded, neighbour/planning disputes, voluntary agreements, no imposed power).
      *   **The Conflict:** The user vs. a friend. Friend says compromise on values is betrayal/cowardice. User says mediation often reveals trade-offs based on different valuations (logrolling), not just splitting the difference.
      *   **The Task:** Create a *decision procedure* (step-by-step questions, criteria for answers, stop conditions, hand-back points) that validates the user's view (trade-offs vs. compromise) but remains honest about limitations.
      *   **Key Requirements:**
          *   Distinguish between "meeting in the middle" (compromise) and "swapping things ranked differently" (trade/logrolling).
          *   Handle "non-negotiables" (values) vs. "low priorities" (preferences).
          *   Flag which steps are real tests vs. procedural dressing.
          *   Be honest about misfires (truthful rankings, strategic lying).
          *   Address power imbalances (articulate vs. quiet party).
          *   British English.
          *   No citations/philosophers.
          *   Run the procedure on three specific cases:
              1.  Mosque vs. Residents (Parking/Evening use) - *Suspected trade.*
              2.  Environmentalists vs. Fishers (No-take zone) - *Value conflict.*
              3.  Residents vs. Developer (Height vs. Parking) - *Negative externality/Third party harm.*

  2.  **Deconstruct the Core Philosophical/Practical Tension:**

      *   *Friend's View:* Values are absolute. Compromising on a value is moral failure.
      *   *User's View:* Many "values" are actually preferences with different intensities. Mediation finds efficiency gains (Pareto improvements) where Party A gives up X (low value to A, high to B) for Y (high value to A, low to B).
      *   *The Challenge:* How to operationalize this without forcing people to betray actual core values, and without letting strategic bargaining hide behind "values."
      *   *The Third Case Problem:* The procedure might find a "trade" that harms a third party not in the room. This is a classic mediation ethics trap. The procedure needs to flag this, not solve it (since the mediator has no power).

  3.  **Drafting the Decision Procedure:**

      *   *Structure:* Needs to be linear, with clear "Stop/Go" signals.
      *   *Tone:* Practical, professional, slightly weary but hopeful (matching the user's voice).
      *   *Step 1: Separation of Issues.* Break the dispute into atoms.
      *   *Step 2: The "Why" Test.* Distinguish value from preference.
      *   *Step 3: The Intensity Check.* Can this be traded?
      *   *Step 4: The Power Balance Check.* Is the quiet party actually agreeing?
      *   *Step 5: The Third-Party Check.* Who pays the cost?
      *   *Annotations:* Need to explicitly mark "Real Test" vs. "Procedural Dressing" and "Misfire Risks."

  4.  **Refining the Steps (Self-Correction during drafting):**

      *   *Critique:* Just asking "Is this a value?" won't work. People lie.
      *   *Fix:* Ask about the *consequence* of yielding. "If you yield on this, what happens?" vs "If you yield, how do you feel?"
      *   *Critique:* How to handle the articulate vs. quiet party?
      *   *Fix:* Build a specific step where the mediator summarizes the quiet party's position and asks for confirmation *without* the loud party interrupting.
      *   *Critique:* The "Non-negotiable" claim.
      *   *Fix:* Treat it as a veto. If it's a true value, the procedure stops on that issue. If it's a tactic, the intensity check might reveal flexibility.

  5.  **Developing the Three Cases:**

      *   *Case 1 (Mosque/Residents):* Classic logrolling. Residents care about parking *during* the day/evening rush. Mosque cares about access *at specific times*. Trade: Dedicated spots for residents at 5pm, Mosque gets rear access at 7pm. Procedure should pass this.
      *   *Case 2 (Enviro/Fishers):* True value conflict. Reef integrity vs. Livelihood. If Enviro says "No fishing ever" based on intrinsic worth of nature, and Fishers say "Right to work," there's no trade. Procedure should identify this as a "Stop" or require external arbitration (which the user doesn't have). It should show the procedure *failing* to find a trade, validating the friend's point partially.
      *   *Case 3 (Residents/Developer):* The Trap. They agree on Height vs. Parking. But the cost is noise/traffic on *Street B*. The procedure *must* catch this in the Third-Party Check. The user wants the procedure to say "Don't do this," even if the parties want to. This highlights the limitation of bilateral mediation.

  6.  **Writing the Content (incorporating British English and Tone):**

      *   *Vocabulary:* "Council," "neighbour rows," "programme," "centre," "realise."
      *   *Voice:* Pragmatic, experienced, slightly cynical but committed.
      *   *Formatting:* Clear headings, bullet points for the procedure, distinct sections for the case runs.

  7.  **Addressing the "Honesty" Constraints:**

      *   Must admit where the procedure is just "dressing up a hunch." (e.g., trying to discern true values from bluffing).
      *   Must admit where it misfires (e.g., strategic misrepresentation of intensity).
      *   Must address the power imbalance explicitly.

  8.  **Final Review against Prompt:**

      *   Decision procedure in order? Yes.
      *   Questions included? Yes.
      *   Stop conditions? Yes.
      *   Distinguish compromise vs. trade? Yes.
      *   Handle non-negotiables? Yes.
      *   Flag real tests vs. dressing? Yes.
      *   Honest about misfires/truthfulness? Yes.
      *   Address power imbalance? Yes.
      *   Three specific cases run? Yes.
      *   British English? Yes.
      *   No citations? Yes.

  9.  **Final Polish:** Ensure the distinction between "splitting the difference" (compromise) and "logrolling" (trade) is clear in the procedure steps. Ensure the third-party issue in Case 3 is handled ethically (mediator's duty to the wider community vs. parties' autonomy).

  *(Self-Correction on Case 3)*: The prompt says "I'd rather it didn't answer the way it will." This implies the procedure might validate a deal the user finds unethical. I need to make sure the procedure *flags* the harm, even if it can't legally stop it, forcing the mediator to make a judgment call. I will design the procedure to halt if third-party harm is significant, forcing the mediator to intervene or withdraw.

  *(Refining the "Value vs Preference" Test)*: This is the hardest part. I'll use a "Counterfactual Test." If I give you X, do you stop caring about Y? Or is Y sacred regardless?

