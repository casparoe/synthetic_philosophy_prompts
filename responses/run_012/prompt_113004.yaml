answer: |-
  This is a sharp observation, and you are right to feel that "companies want it both ways" is insufficient. That phrase implies cynicism or contradiction, whereas what you are describing is a *structural feature* of how we currently govern and understand probabilistic systems. It is a coherent strategy, not just a gaffe.

  There is no single, universally accepted term for this specific maneuver yet, but it sits at the intersection of philosophy of mind, tech ethics, and liability law. Here is the breakdown of the existing concepts that border it, followed by a proposal for what to call it, and an analysis of the boundaries you asked for.

  ### 1. The Nearest Existing Concepts

  You are standing on three different intellectual pillars. None of them fully capture the *switch*, but they explain the mechanics.

  **A. The Intentional Stance (Daniel Dennett)**
  You mentioned this hunch. Dennett argued that calling something an "agent" isn't a claim about its internal metaphysics; it's a predictive strategy. We treat a thermostat as if it "wants" to maintain temperature because it predicts the behavior better than explaining the physics of the bimetallic strip.
  *   **Where it fits:** This explains why people can sincerely believe both descriptions. They aren't lying about the facts; they are switching *stances*.
  *   **Where it fails:** Dennett viewed this as epistemologically neutral. He didn't account for the *economic incentive* to switch stances to manipulate liability.

  **B. The Moral Crumple Zone (Madeleine Clare Elish)**
  Elish coined this to describe how human operators (like safety drivers in autonomous cars) absorb responsibility when the automation fails. The system is treated as a "tool" that the human failed to supervise, even if the human had no meaningful control.
  *   **Where it fits:** This covers the "It's just a tool / the user should have known" move.
  *   **Where it fails:** It doesn't cover the marketing side ("Our AI reasoned!"). It focuses on where the blame lands on the *human*, not how the *system's ontology* shifts.

  **C. The Responsibility Gap (Andreas Matthias)**
  This is the concept you rightly dismissed. It describes a situation where no one *can* be held responsible.
  *   **Where it fits:** It's the background condition.
  *   **Where it fails:** You are describing *responsibility mobility*, not a gap. The responsibility isn't vanishing; it's being actively shuttled.

  ### 2. A Proposal: "Ontological Arbitrage"

  If you need a term for your beat, I suggest **Ontological Arbitrage**.

  In finance, arbitrage is exploiting a price difference between two markets for the same asset. In your scenario, the "asset" is the AI system. There are two "markets" for its ontology:
  1.  **The Agency Market:** Where the system is an actor (high capability, high credit).
  2.  **The Tool Market:** Where the system is a product (low intent, low liability).

  The company moves the system between these markets instantly to capture the value of the first (investment, hype, capability) and the safety of the second (legal shield, regulatory distance).

  **Why this works:**
  *   It captures the *economic incentive*.
  *   It captures the *fluidity* (arbitrage requires movement).
  *   It acknowledges that both ontologies are "valid" in their own contexts (unlying), but the *switch* is the maneuver.

  **Journalistic Shorthand:**
  For a general audience, "Ontological Arbitrage" is heavy. You might use **"The Agency Toggle"** or **"Schrödinger's Liability."** But for policy writing, stick with Arbitrage.

  ### 3. Defining the Boundaries

  You asked specific questions about where the lines are drawn. Here is how I would carve them up based on the logic of the phenomenon.

  **Is the flip essential?**
  **Yes.** If a company consistently calls the AI a tool, they are just conservative engineers. If they consistently call it an agent, they are sci-fi boosters. The phenomenon you are tracking is the *inconsistency driven by incentive*. Without the flip, it is just a category error. With the flip, it is a strategy. The "arbitrage" only exists if there is a spread between the two valuations.

  **Does sincerity matter?**
  **No, but it changes the risk profile.**
  *   **Cynical Version:** This is fraud-adjacent. They know it's an agent and call it a tool to dodge the EU AI Act.
  *   **Sincere Version:** This is arguably more dangerous for policy. If the CTO genuinely believes the model "reasoned" on Tuesday and "just mathed" on Wednesday, it indicates a deep conceptual fragmentation in the industry. It suggests they lack a stable mental model of their own product.
  *   **Classification:** Both belong in the same category of *Ontological Arbitrage*. The motivation (greed vs. confusion) is secondary to the structural effect (liability shielding).

  **Do the Market/Virus cases belong?**
  **Yes, but they are "Narrative Teleology."**
  *   **Markets:** "The market felt nervous." This is anthropomorphism for narrative cohesion. It differs from the AI case because no one is trying to dodge liability for the S&P 500. The market isn't a legal entity that can be sued.
  *   **Viruses:** "The virus evolved to evade the vaccine." This is the *Teleological Fallacy*. Evolution has no intent, but describing it with intent is a useful shorthand.
  *   **The Difference:** In the virus/market cases, the shorthand is for *explanation*. In the AI case, the shorthand is for *exculpation*.
  *   **Verdict:** They are cognates. They share the cognitive mechanism (projecting intent onto complex systems), but the AI case is unique because the projection has *legal consequences*. Keep them in the same family, but note the stake.

  ### 4. How to write about it

  You mentioned catching yourself doing it ("The algorithm wanted clicks" vs "optimizes for a proxy"). This is because the "Intentional Stance" is cognitively cheaper. It is harder to write "The system outputted tokens statistically likely to engage users" than "The algorithm wanted clicks."

  When writing about **Ontological Arbitrage**, you can frame it as a regulatory loophole that doesn't exist in code, but in language.

  *   **The Hook:** "Tech companies are practicing ontological arbitrage: selling agency to investors and disclaiming it to regulators."
  *   **The Policy Implication:** Regulation requires a stable object. You cannot regulate a "high-risk system" if the definition of "system" fluctuates between "autonomous actor" and "calculator" depending on the courtroom.
  *   **The Fix:** Policy must lock the ontology. If you market it as an agent, you bear principal liability. If you market it as a tool, you bear product liability. You cannot arbitrage the difference.

  ### Summary for your lexicon:

  1.  **The Phenomenon:** **Ontological Arbitrage**.
  2.  **The Mechanism:** Weaponized **Intentional Stance**.
  3.  **The Blame Shift:** **The Moral Crumple Zone** (when the human takes the fall).
  4.  **The Cognitive Root:** **Motivated Ontology** (believing the version of reality that minimizes cost).

  You are describing the central governance challenge of the next decade. We are trying to apply liability law designed for *things* (products) and *people* (agents) to a new category that is legally treated as a thing but marketed as a person. Naming the switch is the first step to locking it in place.
