      *   **Case Study:** The Lapidaries guild rewrites district rules to erase a rival's title deed. Inside Athanor, it never existed. Only external operator logs show the change. Rival loses residence, livelihood, history.
      *   **Characters:** Two philosophers (invented names).
          *   **Speaker 1 (Realist):** Virtual objects are real abstract artifacts. Existence conditions fixed by rules/practices. Virtual harms are real harms to real things.
          *   **Speaker 2 (Fictionalist):** Virtual objects are fictional. Existence is within the fiction. Wrong is located in ordinary losses (income, residence, etc.), not destruction of an object (since there was no object).
      *   **Requirements:**
          *   Argue the case, don't survey literature.
          *   No slogans that dismantle the other easily.
          *   **Realist must address:** How existence conditions are fixed if rules are editable from inside? Was the deed real at the time if no trace remains inside Athanor now?
          *   **Fictionalist must address:** Who authors the fiction if inhabitants rewrite rules? If wrong is exhausted by ordinary losses, doesn't that make lawful eviction equally wrong (leaving erasure doing no work)?
          *   **Criterion Requirement:** Each must state a criterion for when a virtual harm is real.
          *   **Contrasting Case:** Apply criterion to a denizen who loses an object she cared about but suffers no income/residence/friendship loss.
          *   **Concession:** Each must accept at least one of the other's points and say what it costs them.
          *   **Distinction:** Each must press at least one distinction the other must take on board or reject.
          *   **Self-Hosting Feature:** Disagree on whether this makes Fictionalist unstable or Realist trivial.
