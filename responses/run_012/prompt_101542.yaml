answer: |-
  **Essay Question**

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage your time to address all parts)

  **Prompt:**

  In "The Methodology of Positive Economics," Milton Friedman advances two distinct claims: (1) that the validity of a theory rests solely on its predictive accuracy, and (2) that the more significant the theory, the more unrealistic its assumptions. Contemporary philosophy of science often accepts a modified version of (1) while largely rejecting (2).

  To analyze why, consider the following taxonomy of false assumptions relative to a model's output:
  *   **Inert:** Perturbing the assumption toward realism leaves the output essentially unchanged.
  *   **Compensated:** The assumption is false and would alter the output, but is offset by another false assumption within the model, yielding the right output for the wrong reasons.
  *   **Load-bearing:** The falsity propagates directly to the output; the model works *because* of the simplification, not despite it.

  Write an essay that addresses the following:
  (a) Separate Friedman's two claims. Explain why claim (1) might survive scrutiny while claim (2) is generally rejected by critics.
  (b) Using the taxonomy above, specify the conditions under which a false assumption is excusable given predictive success. Pay particular attention to the *Compensated* category.
  (c) Apply this framework to a standard New Keynesian DSGE model that assumes a **single representative household with rational expectations**. Analyze whether these assumptions function as Inert, Compensated, or Load-bearing elements regarding the model's policy predictions.
  (d) Conclude by evaluating your friend's "scaffolding" metaphor. Is it an adequate defense of unrealistic assumptions?

  ***

  **Model Answer**

  Friedman's methodology contains two separable theses. The first is instrumentalist: theories are tools, and their validity is determined exclusively by predictive success, not the truth of their assumptions. The second is the "F-twist": significant theories *require* highly unrealistic assumptions. Critics generally accept a nuanced version of the first thesis (predictive adequacy is necessary, if not sufficient) but reject the second. There is no logical reason why significance should correlate with unrealism; often, realistic causal mechanisms yield more robust predictions across varied contexts.

  The provided taxonomy clarifies when false assumptions are excusable. **Inert** assumptions are excusable. If correcting an assumption does not change the output, the assumption functions like idealizations in physics (e.g., frictionless planes); it simplifies calculation without distorting the specific phenomenon modeled. **Load-bearing** assumptions are generally inexcusable for explanatory purposes. If the output depends on the falsity, the model fails to track the actual causal structure, rendering it fragile under policy intervention (the Lucas Critique).

  The **Compensated** case is the critical failure point for strict instrumentalism. Here, predictive success is accidental, arising from error cancellation (e.g., overestimating demand elasticity cancels underestimating supply rigidity). While a compensated model may predict well within a specific historical range, it lacks modal robustness. If the context shifts, the errors may no longer cancel. Therefore, while a compensated model might be instrumentally useful temporarily, it is not epistemically excusable as a basis for understanding or long-term policy, as its success is coincidental rather than structural.

  Applying this to a DSGE model with a **representative household and rational expectations**: The representative agent assumption aggregates heterogeneous actors into one. Empirically, agents are heterogeneous. If this assumption is **Inert**, aggregation errors would not matter for macro outcomes. However, distributional effects often drive aggregate demand. If the assumption is **Load-bearing**, the model implies policy cannot systematically fool agents (policy ineffectiveness). However, it is most charitably viewed as **Compensated**. The rational expectations assumption (agents never make systematic errors) is false, but it may offset the representative agent error (ignoring distributional conflicts). The model predicts equilibrium, but only because behavioral errors cancel aggregation errors. Consequently, its predictive success is fragile; a shock affecting distribution (like a financial crisis) breaks the cancellation, and the model fails.

  Finally, the "scaffolding" metaphor is partially correct but ultimately misleading. Scaffolding corresponds to **Inert** assumptions: temporary supports removed once the structure (the theory) stands, bearing no load in the final edifice. However, if assumptions are **Compensated** or **Load-bearing**, they are not scaffolding; they are structural cracks filled with putty. You cannot "take them down" without the building collapsing. Friedman's defense holds only for Inert assumptions. For Compensated ones, predictive success is a false friend, masking structural flaws that will fail when the economic environment changes. Thus, while scaffolding is removable, compensating errors are not, making the metaphor inadequate for defending significant economic models.

  *(Note: While the distinction between inert and load-bearing idealizations is widely accepted, the normative status of compensated assumptions is contested. Some instrumentalists argue predictive success is all that matters, regardless of error cancellation. Realists argue that without causal fidelity, compensated models offer no understanding.)*

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **Part (a): Friedman's Two Claims (4 Marks)**
  *   **Must-Hit (2 marks):** Clearly distinguishes Claim 1 (predictions validate theory) from Claim 2 (significance requires unrealism).
  *   **Must-Hit (2 marks):** Correctly identifies that Claim 1 has defenders (instrumentalism), while Claim 2 is widely rejected (unrealism is not a virtue).
  *   *Common Mistake:* Treating Friedman's essay as a monolith; failing to note that critics accept prediction as a test but deny unrealism is *necessary* for significance.

  **Part (b): The Taxonomy & Excusability (6 Marks)**
  *   **Must-Hit (2 marks):** Identifies **Inert** assumptions as excusable (simplification without distortion).
  *   **Must-Hit (2 marks):** Identifies **Load-bearing** assumptions as inexcusable for explanation (causal failure).
  *   **Differentiation Point (2 marks):** Correctly analyzes **Compensated** assumptions as fragile/accidental. Strong answers note that predictive success here is insufficient for scientific acceptance because it lacks robustness. Competent answers may treat Compensated as equivalent to Inert.
  *   *Common Mistake:* Arguing that if a Compensated model predicts well, the assumptions are fully excusable (missing the robustness/fragility issue).

  **Part (c): Macro Case Application (6 Marks)**
  *   **Must-Hit (3 marks):** Applies the taxonomy to Representative Agent/Rational Expectations. Does not merely define terms but argues for a classification (e.g., arguing it is Compensated or Load-bearing).
  *   **Must-Hit (3 marks):** Links the classification to policy implications (e.g., if Load-bearing/Compensated, the model fails under structural change/Lucas Critique).
  *   *Common Mistake:* Asserting the model is "false" without specifying *how* the falsity interacts with the output (Inert vs. Load-bearing).

  **Part (d): Scaffolding Verdict (4 Marks)**
  *   **Must-Hit (2 marks):** Maps "scaffolding" to **Inert** assumptions.
  *   **Must-Hit (2 marks):** Concludes the metaphor fails for Compensated/Load-bearing cases (you cannot remove them without collapse).
  *   *Common Mistake:* Accepting the metaphor wholesale without noting its limitation to Inert cases.

  **Epistemic Nuance (Bonus/Integrated)**
  *   *Note:* Answers should not present the rejection of Compensated models as settled fact. The Model Answer includes a note on the Instrumentalist vs. Realist debate. Students who acknowledge that instrumentalists *might* accept Compensated models (since they only care about output) demonstrate higher-level understanding than those who treat Realism as the only valid stance.

  **Grade Boundary Note:**
  *   **Competent (12-14/20):** Correctly separates Friedman's claims and defines the taxonomy. Treats Compensated assumptions as roughly equivalent to Inert (i.e., "if it predicts, it's fine").
  *   **Strong (16-20/20):** Explicitly identifies the fragility of Compensated assumptions. Uses this to drive a wedge between "predicting right" and "understanding why," thereby dismantling the scaffolding metaphor more effectively. Acknowledges the contestation between instrumentalist and realist interpretations of compensation.
