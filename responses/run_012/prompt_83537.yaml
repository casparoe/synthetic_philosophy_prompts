prompt: |-
  Im teaching a session on the units-of-selection mess (gene's-eye view vs. group selection vs. multi-level selection) and I want the spec nailed down before we compare the contenders. What would a theory of the units of selection actually have to deliver to count as adquate? Give me the requirements list, each with the case or result behind it: which cases it has to get right (sterile workers in the social insects, meiotic drive, a heritable symbiont that gets passed down outside the germline), which distinctions it can't just collapse (replicator vs. interactor, and selection *of* a thing vs. selection *for* it), and which results from population genetics it can't contradict. Here's one I made up and want a verdict on, since I think it should show up on the list: a gut microbe that the host smears onto its eggs, which makes hosts live longer and lay more -- is that a unit of selection or not, and does the answer change any of the requirements? Then mark which requirements are just house rules of one camp and which are non-negotiable, and tell me which pair of them I probably can't have both of. Skip the scorecard, I'll do that in class.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Units of Selection debate (Gene's-eye view, Group Selection, Multi-level Selection).
      *   **Goal:** Define the *requirements* for an adequate theory of units of selection *before* comparing specific theories.
      *   **Specific Inputs:**
          *   Must include a list of requirements.
          *   Each requirement needs a specific case/result behind it (e.g., sterile workers, meiotic drive, heritable symbionts).
          *   Must address specific distinctions (Replicator vs. Interactor, Selection *of* vs. Selection *for*).
          *   Must be consistent with population genetics.
          *   **Specific Test Case:** A gut microbe smeared on eggs by the host (increases host fitness). Is it a unit of selection? Does this change requirements?
          *   **Classification:** Mark requirements as "House Rules" (camp-specific) vs. "Non-negotiable" (general scientific adequacy).
          *   **Conflict:** Identify a pair of requirements that are likely incompatible (trade-off).
          *   **Constraint:** Skip the scorecard (don't evaluate the theories themselves, just set the criteria).

  2.  **Deconstruct the "Adequacy" of a Theory of Units of Selection:**
      *   What is the job of this theory? It needs to explain evolutionary change, specifically adaptation and the maintenance of traits, by identifying *what* is being selected.
      *   Key philosophical/biological distinctions: Lewontin's conditions (variation, heredity, fitness differences), Dawkins' Replicator/Interactor, Sober's Selection *of/for*.

  3.  **Drafting the Requirements List (incorporating user's examples):**

      *   *Requirement 1: Heredity/Lineage.* Evolution requires things to persist.
          *   *Case:* Meiotic drive (genes cheating). If the theory can't explain why a "selfish" gene spreads despite organismal cost, it fails.
      *   *Requirement 2: Causal Efficacy/Interaction.* The unit must interact with the environment to generate fitness differences.
          *   *Case:* Sterile workers. They don't reproduce, but they cause fitness effects. A theory focusing only on direct reproduction fails here.
      *   *Requirement 3: Distinction between Vehicle and Beneficiary.* (Selection *of* vs. *for*).
          *   *Case:* Correlated traits. If A causes B, selection is *of* A but *for* B (or vice versa). The theory must distinguish the entity surviving from the trait being favored.
      *   *Requirement 4: Cross-generational Identity.*
          *   *Case:* Heritable symbiont (vertical transmission). Is the bacteria the unit, or the host-bacteria holobiont?
      *   *Requirement 5: Population Genetic Consistency.*
          *   *Result:* Price Equation / Fisher's Fundamental Theorem. The math must map onto the ontology.

  4.  **Analyzing the User's Test Case (Gut Microbe on Eggs):**
      *   *Scenario:* Host smears microbe on eggs. Microbe makes host live longer/lay more.
      *   *Is it a unit of selection?*
          *   *Gene's Eye:* Yes, if the microbe genes correlate with their own propagation (via the host's eggs).
          *   *MLST:* Yes, it's a lower-level unit aligned with a higher-level unit.
          *   *Strict Organismal:* Maybe not, if it's not "part of the genome."
      *   *Does it change requirements?* It stresses the *Heredity* requirement. The microbe isn't in the germline DNA, but it is vertically transmitted. So, "Heredity" cannot be defined strictly as "DNA replication." It must be "faithful copying of structure/information."
      *   *Verdict:* It *is* a unit of selection (a lower-level one aligned with the host). It forces the requirement that *transmission fidelity* matters more than *chemical substrate*.

  5.  **Classifying Requirements (House Rules vs. Non-negotiable):**
      *   *Non-negotiable:* Must satisfy Lewontin's conditions (Variation, Heredity, Fitness). Must be mathematically consistent with Pop Gen (Price Equation). Must distinguish Selection *of/for* (conceptual clarity).
      *   *House Rules:* "Replicators must be DNA" (Dawkins specific). "Groups must be spatially distinct" (Old Group Selection specific). "Only organisms are interactors" (Traditionalist).

  6.  **Identifying the Incompatible Pair (The Trade-off):**
      *   What is the classic tension in this debate?
      *   *Tension:* **Causal Specificity vs. Generality of Application.**
      *   *Alternative Tension:* **Replicator Fidelity vs. Interactor Causal Power.** (Dawkins wants high fidelity replicators; Hull/Sober want causal interactors).
      *   *Better Tension:* **Ontological Parsimony (One True Unit) vs. Explanatory Pluralism (Context-dependent Units).**
      *   *Best Tension for this context:* **Requirement of High-Fidelity Replication (Gene's Eye)** vs. **Requirement of Causal Interaction (Interactor/MLST).**
      *   *Why?* If you demand the unit *must* be a replicator (high fidelity copying), you struggle with groups or epigenetic traits. If you demand the unit *must* be the causal interactor (the thing that lives/dies), you struggle to explain why sterile workers evolve (they don't survive).
      *   *Refinement:* Let's look at the "Selection *of*" vs "Selection *for*" distinction combined with "Replicator/Interactor".
      *   *The Conflict:* **The Requirement for a Single Privileged Level (Reductionism)** vs. **The Requirement to Accommodate Emergent Causal Powers (Holism/MLST).** You generally can't have a theory that says "Only genes are real units" AND "Groups can be genuine units with emergent fitness" without some serious conceptual gymnastics.
      *   *Actually, the prompt asks for a pair of requirements I probably can't have both of.*
      *   *Idea:* **Strict Germline Heredity** vs. **Inclusion of Vertical Symbionts.** (Addressing the user's microbe case). If you require DNA germline transmission, you exclude the microbe. If you include the microbe, you loosen the heredity requirement.
      *   *Better Idea:* **Replicator Fidelity** (Dawkins) vs. **Interactor Causal Unity** (Sober/Hull). A gene is a good replicator but a poor interactor. A group is a good interactor (sometimes) but a poor replicator. Demanding the *same* entity satisfy both perfectly is the source of the "mess."
      *   *Let's go with:* **Requirement: The Unit must be a Replicator (faithful copying)** AND **Requirement: The Unit must be an Interactor (causal agent of fitness).**
      *   *Why incompatible?* Because in many cases (like sterile workers or the microbe), the replicator (gene/microbe) and the interactor (colony/host) are distinct entities. Demanding one entity be *both* forces you to ignore half the process.

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the goal (setting the bar).
      *   The Requirements List (with cases).
      *   The Test Case Verdict (Microbe).
      *   House Rules vs. Non-negotiable.
      *   The Incompatible Pair.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Req 1 (Heredity):* Needs to handle the Microbe. Not just DNA.
      *   *Req 2 (Fitness/Causal):* Needs to handle Sterile Workers.
      *   *Req 3 (Of/For):* Needs to handle Meiotic Drive (Gene selected *of*, organism harmed).
      *   *Req 4 (Pop Gen):* Price Equation consistency.
      *   *Microbe Verdict:* It is a unit. It forces Heredity to be about transmission fidelity, not substrate.
      *   *House Rules:* "Genes are the only replicators." "Groups are fictional."
      *   *Non-negotiable:* Lewontin's conditions, Math consistency, Of/For distinction.
      *   *Incompatible Pair:* "The Unit must be the primary *Replicator*" AND "The Unit must be the primary *Interactor*." (The Dawkins vs. Sober clash).

  9.  **Final Review against constraints:**
      *   Did I include sterile workers? Yes.
      *   Meiotic drive? Yes.
      *   Heritable symbiont? Yes.
      *   Replicator/Interactor? Yes.
      *   Selection Of/For? Yes.
      *   Pop Gen results? Yes.
      *   Microbe verdict? Yes.
      *   House rules vs Non-negotiable? Yes.
      *   Incompatible pair? Yes.
      *   No scorecard? Yes.

  10. **Tone:** Academic, precise, slightly provocative (fitting a teacher prepping a session on a "mess").

      *(Self-Correction during drafting)*: Make sure the distinction between House Rules and Non-negotiable is sharp. "Must align with Price Equation" is non-negotiable for any scientific theory. "Must define the unit as a DNA sequence" is a House Rule of the Gene-Centric camp.

      *(Refining the Incompatible Pair)*: The prompt asks "which pair of them I probably can't have both of." This implies two requirements *from the list*.
      Let's pick:
      1.  **Requirement of Substrate Neutrality** (from the Microbe case: heredity doesn't need DNA).
      2.  **Requirement of High-Fidelity Replication** (from the Gene's Eye view: units must copy with high fidelity to accumulate adaptation).
      *Wait, those aren't necessarily incompatible.*
      Let's go back to **Replicator vs. Interactor**.
      Requirement A: The unit of selection must be the entity that is *copied* (Replicator).
      Requirement B: The unit of selection must be the entity that *acts* (Interactor).
      In the sterile worker case, the gene is copied, the colony acts. You can't say the *same* entity is the primary unit for both without qualification.
      *Actually, the strongest conflict is:* **Requirement: Explanatory Uniqueness** (There is one true unit) vs. **Requirement: Empirical Completeness** (Must account for all cases like microbes, groups, genes).
