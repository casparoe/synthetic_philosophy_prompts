answer: |-
  Here is the specification list for an adequate theory of the units of selection, calibrated against the hard cases and conceptual distinctions you provided.

  ### The Adequacy Requirements

  **1. The Heredity Requirement (Transmission Fidelity)**
  *   **The Rule:** The theory must identify a mechanism by which the unit's structure or information is copied with sufficient fidelity to allow cumulative change over generations.
  *   **The Case:** **Meiotic Drive.** A "selfish" gene spreads despite reducing organismal fitness.
  *   **Why:** If the theory defines heredity strictly as "organismal reproduction," it cannot explain why meiotic drive elements persist. The unit must be able to track its own propagation independent of the vehicle's overall success.

  **2. The Causal Efficacy Requirement (Interaction)**
  *   **The Rule:** The theory must identify the entity that physically interacts with the environment to generate the fitness differences required for selection.
  *   **The Case:** **Sterile Workers in Social Insects.** Workers do not reproduce, yet their behavior determines colony survival.
  *   **Why:** If the theory requires the unit of selection to be the thing that *reproduces*, sterile workers vanish from the ontology. The theory must account for entities that cause fitness effects without themselves being the primary replicators.

  **3. The Distinction Requirement (Of vs. For)**
  *   **The Rule:** The theory must distinguish between the entity that survives/proliferates (Selection *Of*) and the trait or property that causes that survival (Selection *For*).
  *   **The Case:** **Correlated Traits (e.g., heart size and running speed).**
  *   **Why:** A theory that collapses this distinction cannot explain spandrels or hitchhiking. It must be able to say a gene is selected *of* (it increases in frequency) because a phenotype is selected *for* (it aids survival), even if the gene does nothing else.

  **4. The Population Genetics Consistency Requirement**
  *   **The Rule:** The ontology of the unit must map onto the variables of the Price Equation or equivalent population genetic models without remainder.
  *   **The Result:** **Fisher's Fundamental Theorem.**
  *   **Why:** Any metaphysical claim about "units" must be translatable into a change in frequency ($ \Delta p $). If the theory posits a "group unit" that cannot be mathematically partitioned from individual fitness variance, it is biologically inert.

  **5. The Substrate Neutrality Requirement**
  *   **The Rule:** Heredity cannot be defined strictly by chemical substrate (e.g., DNA); it must be defined by transmission fidelity.
  *   **The Case:** **Heritable Symbionts (Vertical Transmission).**
  *   **Why:** If the theory mandates germline DNA as the sole vessel of heredity, it excludes vertically transmitted bacteria, epigenetic markers, or cultural traits that evolve by selection.

  ---

  ### Verdict on Your Test Case: The Gut Microbe

  **The Scenario:** A gut microbe is smeared by the host onto its eggs. The microbe increases host longevity and fecundity.

  **Is it a Unit of Selection?**
  **Yes.** Under an adequate theory, the microbe is a distinct unit of selection (a lower-level unit) whose fitness is currently aligned with the host (a higher-level unit).

  **Does this change the requirements?**
  It forces a hardening of **Requirement #5 (Substrate Neutrality)**.
  If your theory requires the unit to be part of the host's *genome*, the microbe is excluded. If your theory requires the unit to be the *host*, the microbe's independent evolutionary history is erased. To count as adequate, the theory must acknowledge the microbe as a unit based on its **vertical transmission fidelity** (smearing on eggs), not its chemical integration into the host germline. It proves that "Heredity" is a process, not a substance.

  ---

  ### House Rules vs. Non-Negotiables

  **Non-Negotiable (Scientific Adequacy)**
  *   **Population Genetics Consistency:** If it contradicts the Price Equation, it is false.
  *   **The Of/For Distinction:** If it cannot separate the survivor from the trait, it is conceptually broken.
  *   **Heredity (Broadly Defined):** If it cannot explain how traits persist across generations (via DNA, symbionts, or behavior), it is not evolutionary.

  **House Rules (Camp-Specific Constraints)**
  *   **"The Unit Must Be a Replicator":** (Dawkins' Camp). This excludes groups or ephemeral structures that act as interactors but lack high-fidelity copying.
  *   **"The Unit Must Be an Interactor":** (Hull/Sober's Camp). This can struggle to explain *why* adaptation accumulates without a dedicated replicator ontology.
  *   **"Only Organisms Are Real":** (Traditionalist). This is a biological prejudice, not a logical requirement (refuted by meiotic drive and symbionts).
  *   **"Groups Must Be Spatially Discrete":** (Old Group Selection). This is an unnecessary restriction on what constitutes a "population."

  ---

  ### The Incompatible Pair

  You probably cannot have both of these two requirements simultaneously without severe conceptual strain:

  1.  **Requirement: The Unit must be the Primary Replicator (High-Fidelity Copying).**
  2.  **Requirement: The Unit must be the Primary Interactor (Direct Causal Agent of Fitness).**

  **Why they clash:**
  In the **Sterile Worker** and **Gut Microbe** cases, the Replicator and the Interactor are *different entities*.
  *   The **Gene/Microbe** is the Replicator (it gets copied).
  *   The **Colony/Host** is the Interactor (it lives, dies, and fights).

  If you demand the "Unit of Selection" be a single entity that satisfies *both* roles perfectly, you have no referent in these cases. You are forced to either:
  *   (A) Deny the group/host is a unit (Gene's Eye View), thereby downplaying the causal reality of the interaction.
  *   (B) Promote the group/host to a replicator (Group Selection), thereby stretching the definition of heredity until it breaks.

  An adequate theory usually resolves this by splitting the concept (e.g., Replicator vs. Vehicle, or MLS separating Level 1 and Level 2), but if your requirement list demands a *single* ontological category to do both jobs, the theory will fail the test cases.
