prompt: |-
  I run the accountability desk at a mid-size news outlet. Every week we take a batch of public statements and tag each one as a lie, as misleading, or as fine, and the tags keep starting fights — reporters say "it's literally true," the lawyers say "you can't print lie unless you can prove intent," and we end up relitigating the same three cases forever. I want a decision procedure my team can actually run on a single statement in about fifteen minutes, from the transcript alone plus what a reasonable listener would have come away believing. No mind-reading the speaker, no intent polygraph.

  Build it out of the real philosophy that lives here — the difference between what a sentence literally says and what it merely suggests, and the question of whether deceiving someone with a true sentence is morally any better than lying to them. But I want the procedure, not the seminar: the questions in order, what counts as a good enough answer to each, where it stops and stamps "lie," where it stops at "misleading," where it clears the statement entirely, and the point where it has to come to me and legal because the rest is a values call about how much deception we'll tolerate.

  Two things I want baked in. First, don't let it lump lying and misleading into one bucket, but also don't let "the words were true" get anyone off the hook — say exactly when the two deserve the same tag anyway. Second, there's a third case that isn't cleanly either one: the sentence is true, suggests nothing false, but only works because the audience already believes something false and the speaker is counting on that. I want the procedure to catch that case and say whether it's a lie, a misleading, or its own category.

  Then run it on three: a senator saying "we cut taxes for the middle class" when the cut is real but smaller than inflation; a CEO saying "we've never had a data breach" when a subsidiary that was later sold did; and one you make up that the procedure tags in a way my reporters will hate. Finish by telling me where the thing misfires and what it just can't settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Accountability desk editor at a mid-size news outlet.
      *   **Problem:** Current tagging system (Lie/Misleading/Fine) causes internal fights (reporters vs. lawyers), relitigation, and delays.
      *   **Goal:** A 15-minute decision procedure based *only* on the transcript + reasonable listener interpretation. No mind-reading intent.
      *   **Philosophical Basis:** Gricean pragmatics (literal meaning vs. implicature), the morality of deception via truth (lying vs. misleading).
      *   **Specific Requirements:**
          1.  Distinguish lying vs. misleading, but acknowledge when they deserve the same tag.
          2.  Handle the "exploiting existing false belief" case (true statement, no false suggestion, but relies on audience error).
          3.  Provide clear stop-points/stamps (Lie, Misleading, Fine, Escalate).
          4.  Run the procedure on three specific cases (Senator tax cut, CEO data breach, one controversial made-up case).
          5.  Identify limitations/failure points.

  2.  **Deconstruct the Philosophy:**
      *   *Literal Truth:* What the sentence semantically asserts.
      *   *Implicature:* What the sentence pragmatically suggests (Grice's maxims).
      *   *Lying:* Asserting something false with the belief that it is false (traditional definition). Since we can't check belief/intent, we must infer it from the *objective falsity of the assertion*.
      *   *Misleading:* Asserting something true but generating a false implicature.
      *   *Exploiting Background Falsehood:* Asserting something true, generating no false implicature *in a vacuum*, but the context makes it deceptive because the audience fills in the gaps incorrectly, and the speaker knows/should know this.
      *   *The "Same Tag" Condition:* When does misleading become as bad as lying? When the deception is the *point* and the literal truth is a mere shield.

  3.  **Drafting the Procedure (The "15-Minute Protocol"):**
      *   *Constraint:* Must be fast. No deep philosophical debate. Binary or ternary choices.
      *   *Step 1: The Literal Check.* Is the core assertion objectively false?
          *   Yes -> **LIE**. (Stop).
          *   No -> Go to Step 2.
      *   *Step 2: The Implicature Check.* What would a reasonable listener believe after hearing this? Is that belief false?
          *   No false belief generated -> Go to Step 3.
          *   False belief generated -> Go to Step 2b.
      *   *Step 2b: The Source of Falsehood.* Did the sentence *cause* the false belief, or just *allow* it?
          *   If the sentence strongly implies it (violates Grice's Maxim of Quantity/Relation) -> **MISLEADING**.
          *   If the sentence is technically true but the deception is the primary function -> **LIE (Functional)**. (This addresses the "don't let 'words were true' off the hook" requirement).
      *   *Step 3: The Background Belief Check.* (The tricky third case). Is the statement true? Yes. Does it suggest anything false? No. But does it rely on the audience *already* believing something false to have the intended effect?
          *   Yes -> **EXPLOITATIVE** (or tag as Misleading depending on severity). Let's call this **DECEPTIVE (Contextual)**.
          *   No -> **FINE**.
      *   *Escalation:* When do we call the editor/lawyer? When the "Reasonable Listener" is highly ambiguous or the harm threshold is unclear.

      *Refining the Steps for the User:*
      I need to make this rigorous. Let's structure it as a flowchart logic.
      *   *Q1: Falsity of Assertion.* (Objective check).
      *   *Q2: Falsity of Implicature.* (Reasonable listener check).
      *   *Q3: The "Shield" Test.* (Is the truth being used solely to mask the deception?).
      *   *Q4: The "Pre-existing Error" Test.* (The third case).

      *Tagging Logic:*
      *   Lie: Assertion is false OR Assertion is true but used purely as a shield for a false implicature (The "Palter" problem).
      *   Misleading: Assertion is true, Implicature is false, but the speaker could plausibly claim they were just being concise.
      *   Fine: Assertion true, Implicature true/neutral.
      *   Escalate: The "Pre-existing Error" case often needs a values call.

      *Wait, the prompt asks for a specific handling of the "Pre-existing Error" case.* I need to make sure the procedure categorizes it definitively if possible, or flags it for the "values call." The prompt says: "the point where it has to come to me and legal because the rest is a values call." So the procedure should identify *when* to escalate.

      *Revised Plan:*
      1.  **Literal Truth Test.** (False = Lie).
      2.  **Implicature Truth Test.** (False Implicature = Misleading).
      3.  **The "Truth-Shield" Test.** (If Implicature is false and central to the point, upgrade Misleading to Lie).
      4.  **The "Background Belief" Test.** (True Statement + No False Implicature + Relies on Audience Error = **Manipulative/Exploitative**). *Decision:* Tag as Misleading (for consistency) but flag for Editor if the harm is high. Or create a specific tag? The prompt asks to "say whether it's a lie, a misleading, or its own category." I will create a specific category called **"Exploitative"** but note that for publication purposes, it often groups with Misleading.
      5.  **Escalation Point.**

  4.  **Developing the Three Cases:**
      *   *Case 1 (Senator):* "Cut taxes for middle class." Literal: Yes (rate cut). Implicature: Middle class is better off. Reality: Inflation outpaces cut.
          *   Analysis: Literal true. Implicature false (net loss). This is classic Misleading. Does it cross to Lie? If the net loss was the known outcome, it's a Lie by function. Let's see what the procedure says.
      *   *Case 2 (CEO):* "Never had a data breach." Subsidiary did, but was sold.
          *   Analysis: Literal depends on definition of "we" (corporate entity vs. current assets). If "we" means current legal entity, True. If "we" means the brand/history, False. This is the "Definition Game." Likely Misleading or Lie depending on how "we" is defined. Let's make it tricky.
      *   *Case 3 (The one reporters will hate):* Needs to be technically true, no false implicature, but relies on audience ignorance.
          *   Idea: A politician saying "I voted against the war" when they voted against the *funding* of the war after it started, knowing the audience thinks voting against funding = voting against the war.
          *   Better Idea (Exploiting Background Falsehood): "Our unemployment rate is at a historic low." (True statistic, but audience thinks "unemployment rate" = "percentage of people without jobs," whereas it excludes discouraged workers. The speaker knows the audience misunderstands the metric).
          *   Let's go with the **Unemployment Rate** example. It fits the "Pre-existing Error" criteria perfectly. Reporters hate it because the number is *real*.

  5.  **Refining the "Philosophy" into "Procedure":**
      *   Avoid jargon like "Gricean Maxims." Use "Reasonable Listener."
      *   Focus on the *net impression*.
      *   Address the "Intent" constraint: We can't prove intent, but we can judge *foreseeability*. If a reasonable person would be deceived, the speaker is accountable for the deception regardless of intent.

  6.  **Addressing the "Same Tag" Requirement:**
      *   When does Misleading become Lie? When the literal truth is *irrelevant* to the communication's goal, serving only as legal armor. I need a specific question for this. "If you removed the true words, would the false impression remain?" No. "If you removed the false impression, would the true words have any value?" If No -> Lie.

  7.  **Addressing the Limitations:**
      *   Where does it fail? Ambiguous context, evolving facts, satire/hyperbole, and the "Values Call" on harm.

  8.  **Final Review against constraints:**
      *   15 minutes? Yes, checklist style.
      *   No mind-reading? Yes, based on "Reasonable Listener."
      *   Three cases run? Yes.
      *   Limitations explained? Yes.
      *   Tone: Professional, direct, operational.

      *(Self-Correction during drafting)*: I need to be careful with the "Lie" definition. Legally, lies require intent. Journalistically, we often tag "False Claims" as lies even if the speaker believes them. But the prompt says "reporters say 'it's literally true,' lawyers say 'you can't print lie unless you can prove intent'." I need to bridge this.
      *Solution:* Define "Lie" in this protocol not as *moral/psychological lying* (intent to deceive) but as *Objective Falsity of the Primary Claim*. If the primary claim conveyed is false, it's a Lie tag, regardless of whether the literal syntax was true. This sidesteps the legal intent trap while satisfying the accountability goal.
      *Wait, the prompt says:* "No mind-reading the speaker." So I cannot tag based on *their* belief. I must tag based on the *statement's relationship to reality*.
      *Revised Definition:*
      *   **LIE:** The primary claim asserted is objectively false. (Includes "Paltering" where the true words are a shield for a false claim).
      *   **MISLEADING:** The primary claim asserted is true, but creates a false impression that is secondary or avoidable.
      *   **EXPLOITATIVE:** The claim is true, impression is technically accurate, but relies on audience ignorance.

      *Actually, let's look at the "Same Tag" requirement again:* "don't let it lump lying and misleading into one bucket, but also don't let 'the words were true' get anyone off the hook — say exactly when the two deserve the same tag anyway."
      *Okay:* Keep the buckets distinct, but allow the procedure to upgrade Misleading to Lie if the deception is the *mechanism* of the statement.

      *Let's finalize the "Third Case" tag.* The prompt asks: "say whether it's a lie, a misleading, or its own category." I will give it its own category name ("Exploitative") but advise on how to treat it.

      *Let's refine the "Reporters will hate" case.* It needs to be something where the number is right, the words are right, but the context makes it a trap. The Unemployment Rate is good. Or "Crime is down" when reporting *rates* while *numbers* are up due to population growth. Let's go with the **Unemployment Rate** one. It's classic economics spin.

      *Wait, one more check on the CEO case.* "We've never had a data breach." Subsidiary sold.
      *   If the subsidiary was part of "us" at the time, saying "we" (current entity) never had one is technically true but implies the *brand* never had one. This is likely Misleading. If the breach was massive and known, it might be a Lie by omission. I'll stick with Misleading/Exploitative boundary.

      *Okay, ready to write.*

      *Structure:*
      1.  Introduction (The Protocol).
      2.  The 5-Step Decision Tree.
      3.  Tag Definitions & Escalation.
      4.  Running the Three Cases.
      5.  Failure Modes (Where it misfires).

      *Tone:* Operational, authoritative, pragmatic.

      *(Self-Correction on the "Lie" definition)*: I need to be very clear. If I tag something "Lie" without intent, lawyers will freak out. I need to define "Lie" in the protocol as "False Assertion" rather than "Moral Lie." Or, I need to acknowledge the legal constraint and use a label like "False Claim" but the prompt asks for "Lie/Misleading/Fine." I will stick to the prompt's labels but define "Lie" operationally as "Objectively False Primary Claim." I will add a note that this is an *editorial* tag, not a *legal* accusation of fraud.

      *Wait, the prompt says:* "lawyers say 'you can't print lie unless you can prove intent'". I need to solve *that* fight.
      *Solution:* The protocol distinguishes between **Factual Falsity** (Lie) and **Pragmatic Deception** (Misleading). If the *fact* is false, it's a Lie tag. If the *fact* is true but the *implication* is false, it's Misleading. *Unless* the implication is the *only point* of the statement (The Shield Test), then it gets the Lie tag because the truth is decorative. This gives the lawyers cover (we aren't alleging intent, we are alleging factual falsity of the communicated message) and the reporters cover (we aren't ignoring literal truth).

      *Okay, let's build the "Shield Test".*
      Question: "If the listener knew the full truth, would the statement still convey useful information?"
      No -> Lie (The truth was just camouflage).
      Yes -> Misleading.

      *Okay, let's build the "Background Belief" Test.*
      Question: "Does this statement rely on the audience misunderstanding a term or statistic to have its impact?"
      Yes -> Exploitative.

      *Let's go.*
answer: |-
  ## The 15-Minute Accountability Protocol

  **Purpose:** To classify public statements as **LIE**, **MISLEADING**, **EXPLOITATIVE**, or **FINE** without litigating speaker intent.
  **Inputs:** The transcript + Public context available at the time of speaking.
  **Standard:** The "Reasonable Listener" (an average, attentive member of the public, not a lawyer or subject-matter expert).

  ---

  ### Part 1: The Decision Tree

  Run these five questions in order. Stop at the first definitive match.

  #### Q1: The Literal Falsity Check
  **Question:** Is the core factual assertion objectively false according to available evidence?
  *   *Test:* Strip away adjectives and context. Look at the subject, verb, and object.
  *   *Example:* "I did not have sexual relations with that woman." (If he did, this is false).
  *   **If YES:** Tag **LIE**. (Stop).
  *   **If NO:** Go to Q2.

  #### Q2: The Implicature Check
  **Question:** Would a Reasonable Listener walk away believing something that is objectively false?
  *   *Test:* Don't ask what the speaker *meant*. Ask what the audience *heard*. Did the statement create a false impression by omission, emphasis, or context?
  *   *Example:* "I am not currently under investigation." (True, but implies you never were, when you were just indicted yesterday).
  *   **If NO:** Go to Q4.
  *   **If YES:** Go to Q3.

  #### Q3: The "Truth-Shield" Test (Crucial Step)
  **Question:** Is the literal truth being used *solely* as legal armor for the false impression?
  *   *Test:* If you removed the false impression, would the literal truth remaining have any communicative value to the audience?
      *   *Value Remaining?* (e.g., "I didn't steal the money" [True, because you embezzled it instead]. The truth tells us nothing useful.) -> Tag **LIE**.
      *   *Value Removed?* (e.g., "We are investigating the matter" [True, implies action, but action is slow/minimal]. The truth tells us *some* action is happening.) -> Tag **MISLEADING**.
  *   **Rationale:** This prevents "technically true" statements from escaping the **LIE** tag when the truth is decorative camouflage.
  *   **If LIE:** Tag **LIE**. (Stop).
  *   **If MISLEADING:** Tag **MISLEADING**. (Stop).

  #### Q4: The Background Belief Check (The Third Case)
  **Question:** Is the statement literally true, does it generate no false implicature *in a vacuum*, but does it only work because the audience already misunderstands how the world works?
  *   *Test:* Does the statement rely on the audience confusing Term A with Term B, or Metric X with Metric Y?
  *   *Example:* "Unemployment is low." (True by government definition, but audience thinks it means "everyone who wants a job has one," which is false).
  *   **If YES:** Tag **EXPLOITATIVE**. (Go to Escalation).
  *   **If NO:** Tag **FINE**. (Stop).

  #### Q5: Escalation Point
  **When to bring it to the Editor/Legal:**
  1.  **EXPLOITATIVE Tags:** This category requires a values call. Is the audience's ignorance common knowledge? Is the harm significant enough to punish the speaker for not correcting it?
  2.  **Ambiguous Reasonable Listener:** If your team cannot agree on what a "Reasonable Listener" would believe (e.g., highly technical financial jargon), do not guess. Escalate.
  3.  **Harm Threshold:** If a **MISLEADING** tag could trigger a lawsuit or significant backlash, and the deception is minor (e.g., rounding errors), escalate.

  ---

  ### Part 2: Tag Definitions for Publication

  *   **LIE:** The primary claim communicated is false. (Includes statements where literal truth is used as a shield for a false claim).
  *   **MISLEADING:** The primary claim is true, but it creates a false impression that is central to the point.
  *   **EXPLOITATIVE:** The claim is true and the impression is technically accurate, but it leverages common public ignorance to deceive. *(Internal Note: Often published as Misleading, but tracked separately for editorial review).*
  *   **FINE:** The claim is true and the impression is accurate.

  ---

  ### Part 3: Running the Cases

  Here is how the protocol handles your three examples.

  #### Case 1: The Senator
  **Statement:** "We cut taxes for the middle class."
  **Context:** The tax rate was cut, but inflation outpaced the savings, resulting in a net loss of purchasing power for the middle class.
  **Protocol Run:**
  1.  **Literal Falsity:** Did they cut the tax rate? Yes. (Pass).
  2.  **Implicature:** What does a listener believe? That the middle class is financially better off. Is that false? Yes, due to inflation/net cost. (Fail).
  3.  **Truth-Shield:** If we remove the idea that people are "better off," does "we cut the rate" have value? Yes, it describes a legislative action. It is not *purely* camouflage, but the *point* of the statement was the benefit, not the rate.
      *   *Decision:* The deception is the point, but the literal fact is verifiable.
      *   **Tag:** **MISLEADING**.
      *   *Note:* If internal data shows the Senator's team *calculated* the net loss beforehand and spun it anyway, Q3 pushes this to **LIE** under the "Shield" test (the truth is only there to hide the loss). For a 15-minute check without internal emails, stick with **MISLEADING**.

  #### Case 2: The CEO
  **Statement:** "We've never had a data breach."
  **Context:** A subsidiary owned by the company for 5 years had a massive breach. The subsidiary was sold last month.
  **Protocol Run:**
  1.  **Literal Falsity:** Does "We" mean the current legal entity or the brand history? Legally, if the subsidiary is sold, "We" (current assets) might be clean. Literally debatable. Let's assume Legal says it's technically True. (Pass).
  2.  **Implicature:** What does a listener believe? That this brand/company has a perfect security history. Is that false? Yes. (Fail).
  3.  **Truth-Shield:** If you remove the implication of "perfect history," does "current legal entity has no breaches" have value to a customer? No. A customer cares about the brand's track record, not the current corporate shell. The truth is being used as a shield.
      *   **Tag:** **LIE**.
      *   *Why:* The literal truth is irrelevant to the audience's risk assessment. It is camouflage.

  #### Case 3: The One Reporters Will Hate (The "Exploitative" Case)
  **Statement:** A Governor says, "We created 10,000 new jobs this quarter."
  **Context:** The state uses a proprietary definition of "created" that includes "jobs saved" and "projected future jobs," not just actual hires. The audience assumes "created" means "people hired." The Governor knows this.
  **Protocol Run:**
  1.  **Literal Falsity:** By the state's official definition, is the number 10,000? Yes. (Pass).
  2.  **Implicature:** Does the listener believe 10,000 people were hired? Yes. Is that false? Yes.
      *   *Wait, check Q4 first:* Is the statement relying on the audience misunderstanding the term "created"? Yes. The statement is technically true by the speaker's definition, and the implicature is false, but the *mechanism* is the audience's pre-existing confusion about economic stats.
  3.  **Truth-Shield:** Is the truth decorative? Yes, the definition is obscure.
      *   *Protocol Decision:* This hits Q4 (Background Belief). It is not a standard Lie (the number exists) nor standard Misleading (the definition is public record, just obscure).
      *   **Tag:** **EXPLOITATIVE**.
      *   *Action:* Escalate to Editor.
      *   *Likely Outcome:* Reporters will hate this because the number is "real." Lawyers will hate it because it's "true." The Protocol forces you to acknowledge that **truth without clarity is deception.** Most outlets would publish this as **MISLEADING**, but the **EXPLOITATIVE** tag flags that the *audience's ignorance* is the weapon, not just the speaker's words.

  ---

  ### Part 4: Where This Thing Misfires

  You asked for the failure points. Here is where the 15-minute protocol breaks down and you will still end up in a meeting with me and Legal.

  **1. The "Reasonable Listener" is a Fiction**
  In polarized environments, there is no single "Reasonable Listener." One half of the audience hears a dog whistle; the other hears a platitude.
  *   *Failure:* The protocol assumes a shared baseline of knowledge. If the audience is fragmented, Q2 (Implicature) becomes subjective.
  *   *Result:* You will tag something **MISLEADING**, and half your readers will say you're biased. The protocol cannot solve for bad-faith audiences.

  **2. The "Harm Threshold" is Missing**
  The protocol identifies deception, but not *consequence*.
  *   *Failure:* A city councilor lying about the color of a bench gets the same **LIE** tag as a CEO lying about solvency.
  *   *Result:* You will waste resources tagging trivial lies. You need a separate "Severity Filter" before running the protocol. If the lie doesn't impact money, safety, or voting, don't run the desk on it.

  **3. The "Exploitative" Gray Zone**
  The **EXPLOITATIVE** tag is the hardest to defend.
  *   *Failure:* It punishes the speaker for the audience's ignorance. If the audience thinks "GDP" means "personal wealth," and a politician cites rising GDP, is that **EXPLOITATIVE** or just **FINE**?
  *   *Result:* This is the values call. The protocol identifies the case, but it cannot tell you *whether to publish the tag*. That depends on how much you want to educate the audience vs. hold the speaker accountable.

  **4. Evolving Facts**
  The protocol is a snapshot.
  *   *Failure:* A statement is **FINE** on Tuesday. New data arrives Wednesday making it a **LIE**.
  *   *Result:* You need a "Review Window." If a statement is tagged **FINE**, it expires in 30 days. If new data emerges, you don't retroactively tag the old statement; you tag the *refusal to correct* as **MISLEADING**.

  ### Final Instruction to Team
  When the lawyers say "You can't prove intent," you show them **Q3 (The Truth-Shield Test)**. You are not proving they *intended* to lie; you are proving that the *truth they told was functionally useless* without the deception. That is an objective claim about the text, not a subjective claim about the mind.

  When the reporters say "But it's literally true," you show them **Q2 (Implicature Check)**. We are not auditing syntax; we are auditing communication. If the communication fails, the tag stands.
