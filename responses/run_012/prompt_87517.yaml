  7.  **Final Polish:** Check against the prompt requirements ("move by move," "solid ground/overreach," "position that survives"). (Proceed to generate output based on this structure.)

  *(Self-Correction Note)*: I need to be careful not to validate "cultural relativism" as a get-out-of-jail-free card for corruption, which is a common criticism of Tom's stance. I need to highlight where Tom's argument risks excusing predation. Conversely, I need to highlight where Ravi's "zero tolerance" approach might lead to failed state-building.

  8.  **Final Structure:**
