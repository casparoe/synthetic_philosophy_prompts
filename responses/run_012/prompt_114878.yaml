answer: |-
  You're right to treat this like a data set. Your board's voting record is underdetermined. You have conflicting precedents, a hidden variable (operational access), and a split decision that weakened your last major precedent.

  Here is the analysis of your models, the prediction for Sundar 2022, and the experiment you need to run to fix your classification system.

  ### 1. Candidate Rules (The Models)

  Based on your six prior cases, your board is operating on three competing models. They are not mutually exclusive, which is why your votes are inconsistent.

  **Model A: The Physical Destruction Threshold (The "Body Count" Rule)**
  *   **Definition:** Genocide requires substantial physical destruction (killing) or biological prevention (sterilization/birth prevention). Cultural erasure alone is Persecution; displacement is Ethnic Cleansing.
  *   **Supporting Data:** *Marn Valley* (high death toll, but territorial intent = CAH), *Vale Removal* (displacement + killing = EC, explicitly not Genocide), *Sundar 2011* (cultural erasure = Persecution), *Kavara 2019 Dissent*.
  *   **Weakness:** Contradicted by *Kavara 1991–2016* (low annual death rate tagged Genocide) and *Kavara 2019 Majority* (very low death rate tagged Genocide).

  **Model B: The Specific Intent Threshold (The "Lemkin" Rule)**
  *   **Definition:** Genocide is defined by the *intent* to destroy the group "as such," regardless of the method. If the stated goal is to make the group cease to exist (physically or culturally), it is Genocide. Violence is evidence of intent, not a prerequisite.
  *   **Supporting Data:** *Sundar 2004* (written orders to eliminate), *Kavara 1991–2016* (pattern implies intent), *Kavara 2019 Majority* (explicit rhetoric to "end the Kort" = Genocide despite low deaths), *Charter Preface* (references Lemkin's broader definition).
  *   **Weakness:** Contradicted by *Vale Removal* (intent to remove was not tagged Genocide) and *Sundar 2011* (intent to assimilate was not tagged Genocide). Requires distinguishing between "destroying a people" and "destroying a presence."

  **Model C: The Operational Constraint (The "Access" Rule)**
  *   **Definition:** Tags are moderated by the risk to the organization's ability to operate. If a tag jeopardizes field access or funding, a lower-severity tag is selected if legally defensible.
  *   **Supporting Data:** *Marn Valley Minutes* ("would have cost us access"), *Sundar 2022 Context* (funder pressure/field office risk).
  *   **Weakness:** Contradicted by *Sundar 2004* (unanimous Genocide tag despite likely political heat) and *Kavara 2019* (5–4 split suggests genuine doctrinal disagreement, not just political calculation).

  ### 2. Predictions for Sundar 2022

  Here is what each model predicts for the current vote:

  *   **Model A (Physical Threshold) predicts: Ethnic Cleansing.**
      *   **Reasoning:** 1,800 deaths over three years is statistically low compared to your Genocide precedents (200k, 60k). The primary mechanism is land transfer and administrative erasure, which matches *Vale Removal*.
  *   **Model B (Intent Threshold) predicts: Genocide.**
      *   **Reasoning:** The rhetoric ("will not survive," "join us or fade") matches *Kavara 2019* almost exactly. The destruction of cemeteries and shrines is cultural destruction. Under Lemkin's definition (which your charter hints at), this qualifies.
  *   **Model C (Operational Constraint) predicts: Crimes Against Humanity or Ethnic Cleansing.**
      *   **Reasoning:** Tagging a major funder's ally with Genocide will likely trigger the shutdown of your field office. *Marn Valley* established that you will downgrade a tag to maintain access.

  ### 3. Closest Analog

  **Doctrinally: Kavara 2019–20.**
  The rhetoric is nearly identical ("end the Kort as a separate people" vs. "Ashani will not survive as a separate people"). Both involve low direct violence but high structural/cultural destruction. If *Kavara 2019* was Genocide (5–4), *Sundar 2022* must be Genocide to maintain consistency.

  **Mechanically: Vale Removal 1979–83.**
  The physical actions (expulsion, settlers moving in, administrative carving) match *Vale*. However, *Vale* was tagged Ethnic Cleansing because the intent was framed as "clearing a region," whereas *Sundar 2022* intent is framed as "settling the question for good" (erasure of identity).

  **Politically: Marn Valley 1988–94.**
  The risk to your field office and budget mirrors the *Marn Valley* access concern. If you follow the *Marn* precedent, you will avoid the G-word regardless of the facts.

  **Verdict:** *Kavara 2019* is the strongest analog for the *nature* of the atrocity. *Marn Valley* is the strongest analog for the *consequences* of the tag.

  ### 4. The Critical Experiment (Distinguishing Case)

  Your record is underdetermined because *Kavara 2019* passed by a single vote (5–4). You do not know if that established a new rule or was an anomaly. To separate Model A (Physical) from Model B (Intent), you need a case that isolates **Cultural Destruction** from **Physical Threat**.

  **Proposed Hypothetical Case:**
  > "The Archive State." A government systematically confiscates and destroys all historical records, religious texts, and art of a minority group. They ban the language and force name changes. However, they guarantee the group's physical safety, reproductive rights, and economic prosperity, provided they assimilate. Rhetoric: "We honor them as individuals, but their distinct nationhood must end." No one is killed. No one is expelled.

  *   **If you tag this Genocide:** You adopt **Model B (Intent/Lemkin)**. You acknowledge that destroying a people's identity is genocide even without killing. This overrules the *Sundar 2011* and *Vale* logic.
  *   **If you tag this Persecution:** You adopt **Model A (Physical)**. You establish that Genocide requires bodily destruction (death or birth prevention). This implicitly overrules the *Kavara 2019* majority.

  Until you vote on a case like this, your definition of Genocide remains ambiguous.

  ### 5. The Underlying Principle

  You asked what principle you would be adopting if the record doesn't settle it. It doesn't. The *Marn Valley* minutes prove that your tags are not purely descriptive; they are strategic.

  If you vote **Genocide** on Sundar 2022:
  *   **Principle Adopted:** **Moral Consistency over Operational Survival.**
  *   **Implication:** You admit the *Marn Valley* decision was a compromise you are no longer willing to make. You prioritize the accuracy of the historical record over the NGO's continued access to the region. You risk the organization's future to save the definition of the word.

  If you vote **Ethnic Cleansing** on Sundar 2022:
  *   **Principle Adopted:** **Operational Viability constrains Truth.**
  *   **Implication:** You admit that the Register is not an objective scientific instrument but a political tool. You establish that the "Genocide" tag is a resource to be spent only when the cost is affordable. You also implicitly demote *Kavara 2019* to an outlier, signaling that without significant killing, the G-word is off the table.

  **My blunt assessment:**
  Your board is trying to run a scientific register with political funding. The *Marn Valley* note in the minutes is the smoking gun. You are not measuring atrocities; you are managing risk.

  If you want to be consistent with *Kavara 2019*, you must vote Genocide. If you do, you should formally note in the minutes that *Marn Valley* is no longer the standard for access concerns, or you are hypocrites. If you vote Ethnic Cleansing, you should formally note that *Kavara 2019* required a higher threshold of violence than previously thought, or you are retreating from your charter's Lemkin reference.

  Don't hide behind "underdetermined data." You have a funding gun to your head. Decide if you're scientists or diplomats, and vote accordingly.
