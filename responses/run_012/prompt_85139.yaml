answer: |-
  **Exam Question**

  Consider the Balmer series of hydrogen spectral lines. The empirical formula describing these wavelengths was established in 1885, yet Bohr's 1913 atomic model was celebrated for deriving this exact data from first principles.

  (1) Formulate the Bayesian old-evidence problem for this case without merely asserting P(E)=1. Explain precisely why the standard confirmation measure fails given the agent's epistemic state at the time of theory acceptance.
  (2) Evaluate the counterfactual-credence repair, which asks what the agent's credence in E would have been prior to learning the formula. Does this genuinely solve the problem, or does it relocate the arbitrariness one level up?
  (3) Address the idealization of logical omniscience. If we allow agents to be uncertain about the logical connection between H and E, does the old evidence problem persist as a substantive anomaly, or does it vanish as an artifact of formalization? Defend your position.

  ***

  **Model Answer**

  The old evidence problem arises because Bayesian confirmation relies on probability shifts. If the Balmer series (E) is known, P(E) = 1. Since Bohr's model (H) entails E, P(E|H) is also 1. The confirmation ratio P(E|H)/P(E) equals 1, indicating no support. The sharp formulation is not just about certainty, but about the impossibility of updating: the agent cannot treat E as new information to boost H because E is already maximally confident in their belief system. The theory arrives too late to move the evidence.

  The counterfactual repair attempts to restore confirmation by reconstructing the agent's credence in E at a time before 1885. We ask: "What would the physicist's credence in the Balmer formula have been had they not yet measured the lines?" If this counterfactual credence is low, and P(E|H) is high, confirmation is restored. However, this relocates the problem. It replaces objective updating with historical speculation. There is no unique fact about what credence *would* have been; different reconstructions yield different confirmation values. This makes the degree of support subjective and unstable, solving the formal inequality while failing to capture the actual epistemic dynamics of the discovery.

  The crux lies in logical omniscience. Standard Bayesianism assumes agents know all logical consequences of their beliefs. If an agent knows H, they automatically know H entails E. But real agents do not. Bohr did not know his model entailed the Balmer series until he performed the calculation. If we drop logical omniscience, learning H allows the agent to learn the connection (H → E) as new information. Even if P(E) = 1, the agent updates on the logical relation itself. The probability of H rises because H explains why E is true, resolving the anomaly in the agent's understanding of the world, not the data itself.

  Therefore, the problem is an artifact of idealization. Real agents are uncertain about logical implications. Once we model agents as logically non-omniscient, the derivation of old evidence functions as a standard update on the logical connection, restoring confirmation without counterfactual gymnastics. The anomaly survives only in a framework too rigid to model human mathematical discovery.

  ***

  **Marking Scheme (Total 20 Marks)**

  1.  **Precise Formulation (4 marks):** Must explain the collapse of the confirmation ratio (P(E|H)=P(E)), not just state P(E)=1.
      *   *Typical Error:* Reciting the slogan "P(E)=1" without explaining why the conditional probability fails to shift.
  2.  **Counterfactual Explanation (4 marks):** Must describe the historical reconstruction of credence states prior to evidence.
      *   *Typical Error:* Confusing this with the actual historical timeline rather than hypothetical credence states.
  3.  **Counterfactual Critique (4 marks):** Must identify the subjectivity/arbitrariness introduced by reconstruction.
      *   *Typical Error:* Claiming the counterfactual approach solves the problem perfectly without reservation.
  4.  **Logical Omniscience (4 marks):** Must link uncertainty to the logical connection (H→E) rather than empirical data.
      *   *Typical Error:* Treating logical omniscience as merely about empirical uncertainty or measurement error.
  5.  **Final Verdict (4 marks):** Must conclude whether it is a real anomaly or artifact based on the previous analysis.
      *   *Typical Error:* Sitting on the fence without justification or contradicting the argument made in step 4.
