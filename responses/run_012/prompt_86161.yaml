  **III. INSTITUTIONAL ROLE: ADJUDICATION VS. LEGISLATION**

  A deeper disagreement concerns our role versus the Faculty Senate's. One view holds that because this Panel is an instrument of the faculty, we should supply the goals the Senate forgot to write down. Another view holds that we did not write the Code and should not supply missing goals. We adopt the latter position.

  While we are colleagues serving colleagues, this Panel functions adjudicatively, not legislatively. The Faculty Code is a contract among us, ratified by the Senate. When we serve on this Panel, we do not act as proxies for the Senate's current mood or its past unspoken hopes. We act as guardians of the rules as ratified. If we amend the Code from the bench to fix perceived loopholes, we undermine the governance structure. It is the Senate's role to draft rules; it is our role to apply them. If Article IV protects speech that the faculty finds reckless, the remedy is amendment by the Senate, not reinterpretation by this Panel. To do otherwise grants this Panel a legislative power we do not possess and sets a dangerous precedent that rules are merely suggestions until a Panel decides otherwise. Even though we are the faculty's instrument, we are the instrument for hearing cases, not for rewriting the manual during the hearing.

  **IV. THE CASE FOR THE DEAN**

  We acknowledge the strength of the Dean's position. The strongest argument against dismissal is not legalistic but substantive. A university relies on trust and collegiality. Publicly accusing colleagues of fraud without definitive proof during an undergraduate lecture can damage reputations and disrupt inter-departmental cooperation. If Article IV is read to protect any statement made during teaching, regardless of veracity or motive, it could shield malicious actors who use the classroom as a weapon against rivals. The Dean argues that the Code's ultimate purpose is to foster inquiry, and unchecked defamation stifles rather than fosters that inquiry. This is a compelling moral claim. It highlights a genuine tension between absolute procedural protection and the substantive health of the academic community. We do not dismiss this concern lightly; it represents the real-world cost of our decision.

  **V. RECOMMENDATION**

  Despite the Dean's compelling concerns regarding collegiality, the Panel recommends that the disciplinary proceeding be **dismissed**.

  Our reasoning rests on the stability of faculty governance. The text of Article IV is unambiguous: it bars discipline for statements made in professional duties unless they constitute harassment. The statement in question was made during a lecture (a professional duty) and does not meet the defined threshold of harassment. To allow the proceeding under the general unprofessional-conduct clause would render Article IV meaningless, violating the basic interpretive principle that specific provisions control general ones. If the general clause could override Article IV, Article IV would never apply to anything.

  We recognize this outcome may seem unsatisfactory to those who view the professor's comments as reckless. However, the risk of administrative overreach into classroom content is a greater danger to the university than the risk of protecting occasional intemperate speech. If the faculty believes Article IV is too broad, it must be amended. Until then, we are bound by the words we have written.

