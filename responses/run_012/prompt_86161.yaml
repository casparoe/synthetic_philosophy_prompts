  **MEMORANDUM OF OPINION**
  **FACULTY HEARING PANEL**
  **RE: DISCIPLINARY PROCEEDING AGAINST PROFESSOR [CHEMIST]**

  **I. ISSUE AND FACTS**

  This Panel convenes to determine whether a disciplinary proceeding may proceed against a member of the Chemistry Department. The Dean initiated this proceeding under the Faculty Code's general clause regarding unprofessional conduct. The charge stems from a lecture wherein the professor asserted that a widely prescribed antidepressant is ineffective and that the clinical trials supporting it, including those conducted by our own Psychiatry Department, were manipulated. A psychiatrist from that department filed a complaint.

  The professor moves to dismiss the proceeding based on Article IV of the Faculty Code. Article IV states: "No faculty member shall be disciplined for any statement made in the exercise of their professional duties, except where the statement constitutes harassment as defined in the University's Anti-Harassment Policy." The professor argues that teaching is a professional duty, the statement was made while teaching, and the conduct does not meet the definition of harassment. The Dean's office argues that Article IV cannot shield unsubstantiated attacks on colleagues that poison scholarly inquiry, suggesting the provision's purpose limits its text.

  **II. INTERPRETIVE FRAMEWORK**

  We are asked to choose between the plain text of Article IV and the purported purpose behind it. Our General Counsel suggests the text controls absolutely. We find this too quick. Language is never entirely self-executing; words derive meaning from context. However, we also reject the Dean's invitation to prioritize a speculative purpose over the enacted text.

  Regarding purpose, we must distinguish between historical intent and objective function. Some argue we should ask what the drafting committee wanted in the seventies. We decline this inquiry. A committee is not a single mind; its members likely held conflicting views compromised into a final text. Inferring a collective psychological state is impossible. Instead, we look to the purpose evident in the text itself. The text of Article IV is broad ("any statement") and the exception is narrow ("harassment"). The objective purpose of such a structure is to create a high barrier against administrative discipline regarding classroom content. To import a hidden limitation—that the statement must be "correct" or "collegial"—would rewrite the bargain the text presents.

  **III. INSTITUTIONAL ROLE**

  A deeper disagreement concerns our role versus the Faculty Senate's. One view holds that because this Panel is an instrument of the faculty, we should supply the goals the Senate forgot to write down. We disagree. While we are colleagues serving colleagues, this Panel functions adjudicatively, not legislatively.

  The Faculty Code is a contract among us. When we serve on this Panel, we do not act as proxies for the Senate's current mood or its past unspoken hopes. We act as guardians of the rules as ratified. If we amend the Code from the bench to fix perceived loopholes, we undermine the governance structure. It is the Senate's role to draft rules; it is our role to apply them. If Article IV protects speech that the faculty finds reckless, the remedy is amendment by the Senate, not reinterpretation by this Panel. To do otherwise grants this Panel a legislative power we do not possess and sets a precedent that rules are merely suggestions until a Panel decides otherwise.

  **IV. THE CASE FOR THE DEAN**

  We acknowledge the strength of the Dean's position. The strongest argument against dismissal is not legalistic but substantive. A university relies on trust and collegiality. Publicly accusing colleagues of fraud without definitive proof during an undergraduate lecture can damage reputations and disrupt inter-departmental cooperation. If Article IV is read to protect any statement made during teaching, regardless of veracity or motive, it could shield malicious actors who use the classroom as a weapon against rivals. The Dean argues that the Code's ultimate purpose is to foster inquiry, and unchecked defamation stifles rather than fosters that inquiry. This is a compelling moral claim. It highlights a genuine tension between absolute procedural protection and the substantive health of the academic community. We do not dismiss this concern lightly; it represents the real-world cost of our decision.

  **V. RECOMMENDATION**

  Despite the Dean's compelling concerns regarding collegiality, the Panel recommends that the disciplinary proceeding be **dismissed**.

  Our reasoning rests on the stability of faculty governance. The text of Article IV is unambiguous: it bars discipline for statements made in professional duties unless they constitute harassment. The statement in question was made during a lecture (a professional duty) and does not meet the defined threshold of harassment. To allow the proceeding under the general unprofessional-conduct clause would render Article IV meaningless, violating the basic interpretive principle that specific provisions control general ones.

  We recognize this outcome may seem unsatisfactory to those who view the professor's comments as reckless. However, the risk of administrative overreach into classroom content is a greater danger to the university than the risk of protecting occasional intemperate speech. If the faculty believes Article IV is too broad, it must be amended. Until then, we are bound by the words we have written.

  **VI. CONCLUSION**

  This decision is not an endorsement of the professor's claims regarding the antidepressant trials. It is an endorsement of the rule of law within our university. We must adhere to the Code even when it protects speech we dislike, for the moment we begin editing the rules to fit the case, we lose the protection of the rules themselves. The proceeding is dismissed.

