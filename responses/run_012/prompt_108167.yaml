nd nobody concludes that rotation is a projection of the observer. Consider, then, one of your own observers, who lives out his whole life near the axis and never makes the long outward journey that would close a loop. Everything he can learn without making that journey tells him that the difference between what has already happened and what has not is as definite as it is for anyone else. What is missing from his life that you claim is missing from the universe, and how can the absence of a global lapse make his own past and future unreal when nothing he could ever do would reveal to him that anything was wrong?
