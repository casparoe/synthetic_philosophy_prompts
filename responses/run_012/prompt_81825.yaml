answer: |-
  Nietzsche resolves the apparent contradiction by arguing that the vital impulse of life overrides logical consistency, granting the present will the right to condemn and shatter the past that constituted it. The critical mode functions not through objective truth but through a necessary injustice, where the act of judgement is performed by the forward-striving will rather than the accumulated historical self. Human beings possess a dual nature: the historical sense that binds them to tradition, and the unhistorical capacity to forget and enclose themselves within a horizon. When the historical becomes oppressive, the unhistorical power must intervene to break the chain, even if this means severing one's own roots. This avoids toothlessness because it accepts pain and danger as prerequisites for growth; it is not a safe academic exercise but a violent act of self-overcoming. The circularity is bypassed because the goal is not to preserve the integrity of the self, but to enhance the power of life, allowing the individual to create a new past *a posteriori* from which they might wish to be descended. Regarding scope, Nietzsche treats the individual and culture as inseparable, meaning the condemnation of cultural history is simultaneously an act of personal liberation. The risk of self-destruction is real, as a weakened second nature may fail to take hold, yet Nietzsche insists this gamble is preferable to the stagnation of preserving a life-denying heritage. Ultimately, the argument rests on the premise that life requires injustice: to create anew, one must be willing to condemn the conditions of one's own origin without being paralysed by the contradiction.
