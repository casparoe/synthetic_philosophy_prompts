answer: |-
  Your argument is valid, but it is unsound because it rests on a definition of the wrong that is too narrow. The root error is **Premise (1)**. By defining the wrong of deception exclusively as the outcome (the hearer's false belief), you adopt a purely consequentialist metric that ignores the distinct normative duties involved in different types of speech acts. This is why the argument proves too much: if the wrong is solely the outcome, then accidental misleading (true statement, unforeseen false inference) becomes equivalent to deliberate lying, since the outcome is identical.

  You should reject Premise (1) because the wrong of deception is not merely about the resulting belief state, but also about how that state was brought about. Lying violates the constitutive norm of assertion (the commitment to speak only what you believe true), whereas misleading exploits conversational expectations without breaking the literal truth-telling rule. By rejecting (1), you can maintain that lying is morally graver than misleading because it corrupts the practice of assertion itself, while also distinguishing deliberate deception from accidental misunderstanding based on the speaker's intent and normative violation. This allows you to keep the moral distinction you want without accepting the unwanted equivalence between lies and accidental truths.

