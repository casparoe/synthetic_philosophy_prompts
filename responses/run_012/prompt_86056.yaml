answer: |-
  # The Causal Intuition Sorter
  **For the Historian Who Is Tired of Arguing About Sarajevo**

  **Instructions:** Read the ten scenarios below. For each, select the response that best matches your instinctive reaction to the case. Do not overthink the philosophical implications; choose the answer that sounds like *history* to you. At the end, tally your results according to the Key.

  ***

  **1. The Triple Arson (Overdetermination)**
  Three disgruntled employees, unaware of each other, independently pour gasoline on the same warehouse and light a match at the exact same time. The warehouse burns down. Any one of the three fires would have been sufficient to destroy the building.
  *   **A.** All three are causes. Causation isn't about being the *only* thing that could have done it; it's about contributing to a sufficient set of conditions.
  *   **B.** Technically, none of them are 'but-for' causes since the fire happens without any specific one of them, but we assign blame to all three for practical legal reasons.
  *   **C.** Focusing on the matches misses the point. The real cause is that the warehouse was uninsurable and filled with rags; the arsonists were just the trigger for an inevitable loss.

  **2. The Twin Snipers (Preemption)**
  Two assassins fire at a dictator simultaneously. Assassin A's bullet strikes the heart. Assassin B's bullet would have struck the heart a second later. The dictator dies.
  *   **A.** Assassin A caused the death. We trace the actual physical process that connected the action to the result, not the backup plan.
  *   **B.** Both caused the death. The dictator was in a 'kill zone' created by both shooters; the risk was sufficient even if one bullet was redundant.
  *   **C.** We say A caused it only because we are contrasting this world with one where A stayed home. If we contrast it with a world where *both* stayed home, the cause is the conspiracy itself.

  **3. The Jammed Signal (Double Prevention)**
  A train crashes because a saboteur jams the signal that would have told the train to stop. The saboteur did not push the train; they merely removed a blocker.
  *   **A.** The jamming caused the crash. Preventing a prevention is a genuine causal mechanism, even if it involves an absence of a signal.
  *   **B.** The crash was caused by the train's momentum and the track layout. The jamming just meant a safety feature didn't work; absences aren't active forces.
  *   **C.** Whether the jamming counts as a cause depends on whether the signal was expected to function. If the signal was known to be broken, the jamming changes nothing.

  **4. The Missing Garrison (Causation by Absence)**
  A border fortress falls. The attacking army was strong, but the defending general testifies that if the promised reinforcements had arrived, the attack would have been repelled. They never came.
  *   **A.** The absence of the garrison is a cause. In history, what *doesn't* happen often explains the outcome just as well as what does.
  *   **B.** The cause is the attacking army's presence. To say 'non-arrival' caused the fall is to confuse the background conditions with the active agent.
  *   **C.** The cause is the strategic overextension of the empire. The missing garrison is just a symptom of a logistical system that couldn't sustain the frontier.

  **5. The Post-Plague Wage Rise (Structural Cause)**
  After the Black Death, labour becomes scarce and wages rise across Europe. No central authority mandates this; it happens through thousands of individual contracts.
  *   **A.** Demography is the cause. Individual contracts are just the mechanism through which the ratio of land to labour exerted its pressure.
  *   **B.** Each contract renewal is a cause. The 'rise in wages' is just a shorthand for millions of singular agreements; don't reify 'demography' into an actor.
  *   **C.** This is an instance of a general law: when supply drops and demand holds, price rises. The historical details just fill in the variables of the equation.

  **6. The Sarajevo Switch (Singular Event)**
  Archduke Franz Ferdinand is assassinated in June 1914. War follows.
  *   **A.** Without this specific event, the war does not start at that time. It is the switch that turned the engine on; the engine might have existed, but the switch matters.
  *   **B.** The war was inevitable due to alliances and militarism. Sarajevo is just the spark; explaining the fire requires looking at the fuel, not the match.
  *   **C.** The assassination explains why war broke out *in August 1914* rather than *in 1915*. It answers a question about timing, not about the underlying tension.

  **7. The King and the Harvest (Competing Explanations)**
  Historian X argues the Revolution happened because the King was incompetent. Historian Y argues it happened because the 1788 harvest failed.
  *   **A.** Both are defensible. They are answering different questions: one explains the political collapse, the other explains the social unrest.
  *   **B.** One is deeper. The harvest created the conditions where the King's incompetence became fatal; the structural stress is the real driver.
  *   **C.** Both are constructing narratives. The 'truth' is less important than which story helps us understand the experience of the participants.

  **8. The Armada's Weather (Chaos/Sensitivity)**
  The Spanish Armada is scattered by a storm. A slight shift in wind pressure earlier in the week would have saved it.
  *   **A.** History is sensitive to initial conditions. The storm is the cause, and we must accept that small accidents can redirect the flow of centuries.
  *   **B.** If a system is that fragile, the system is the cause. A robust empire shouldn't be undone by a gust of wind; the weather just exposed the vulnerability.
  *   **C.** We can't really know. The chain of dependence is so complex that calling the wind a 'cause' is just a story we tell to impose order on chaos.

  **9. The Fall of Rome (Regularity vs. Narrative)**
  You are asked to explain the Fall of Rome.
  *   **A.** I want to identify the necessary conditions that, if removed, would have sustained the Empire.
  *   **B.** I want to find a generalizable model of imperial overstretch that applies to other empires too.
  *   **C.** I want to trace the sequence of events into a coherent story of decline that makes the outcome intelligible.

  **10. The Failed Policy (Value-Relevance)**
  A government economic policy fails.
  *   **A.** It failed because it violated fundamental economic laws.
  *   **B.** It failed because the actors misunderstood their own interests and situation.
  *   **C.** It failed because the structural conditions of the economy made success impossible, regardless of intent.

  ***

  # Scoring Key

  This is not a personality test; it is a historiographical triage. Tally your choices based on the **Vectors** below. You will likely have a dominant vector, perhaps with a secondary lean.

  ### Vector Tally
  *   **Vector N (Necessity/Process):** Q1(B), Q2(A), Q3(B), Q4(B), Q5(B), Q6(A), Q9(A).
  *   **Vector S (Sufficiency/Structure):** Q1(A), Q2(B), Q3(A), Q4(C), Q5(A), Q6(B), Q8(B), Q10(C).
  *   **Vector C (Context/Contrast):** Q2(C), Q3(C), Q6(C), Q7(A), Q8(A).
  *   **Vector P (Pragmatic/Interest):** Q1(B - *practical reasons*), Q7(C), Q10(B).
  *   **Vector L (Law/Regularity):** Q5(C), Q9(B), Q10(A).
  *   **Vector R (Representation/Narrative):** Q7(C), Q8(C), Q9(C).

  *(Note: Some answers contribute to multiple vectors depending on interpretation, but tally them as above for the primary sort.)*

  ### The Leaves (Your Theoretical Position)

  **1. The Pure Counterfactualist (Dominant Vector N)**
  *   **Diagnosis:** You believe a cause must make a difference. If the effect would have happened anyway, the putative cause is disqualified. You likely view overdetermination as a logical puzzle to be solved by fine-graining events (e.g., "The fire started at *this* second, so only *this* match counts").
  *   **Blind Spot:** You struggle with structural explanations where no single "switch" exists. You may find yourself dismissing long-term trends as "background conditions" rather than causes.

  **2. The INUS / Network Theorist (Dominant Vector S)**
  *   **Diagnosis:** You view causes as nodes in a web. A cause is an Insufficient but Necessary part of an Unnecessary but Sufficient condition. You are comfortable with multiple causes and overdetermination because you know the world is messy.
  *   **Blind Spot:** You risk causal inflation. If everything is part of a sufficient set, distinguishing the *significant* cause from the *trivial* cause becomes difficult without importing pragmatic criteria.

  **3. The Contrastivist or Pluralist (Dominant Vector C)**
  *   **Diagnosis:** You think the question "What caused X?" is incomplete. It must be "What caused X *rather than Y*?" You believe the Sarajevo argument is a verbal dispute: one student is asking "Why war?" (Structure) and the other "Why war *then*?" (Event).
  *   **Blind Spot:** You can sometimes appear to be dodging the ontological question. Critics will say you've explained how we *talk* about causes, but not what causes *are*.

  **4. The Pragmatic Selectionist (Dominant Vector P)**
  *   **Diagnosis:** You are a Weberian. You believe there is one causal reality (an infinite web), but human minds cannot grasp it all. We select causes based on "value-relevance" (what matters to us ethically or politically). You are fine with the King vs. Harvest debate; they serve different explanatory interests.
  *   **Blind Spot:** You walk a tightrope between realism and relativism. If causes are selected by interest, can you ever say a historical explanation is *wrong*, only that it is *uninteresting*?

  **5. The Structuralist (Dominant Vector S, specifically Q4-C, Q5-A, Q6-B, Q10-C)**
  *   **Diagnosis:** You view individual actors and singular events as surface foam on a deep ocean. Real causation lies in demography, economics, and geography. You are suspicious of "Great Man" history and counterfactuals that rely on changing a single decision.
  *   **Blind Spot:** You may struggle to account for rapid change or contingency. If structures determine everything, how do you explain the moments when the structure shifts?

  **6. The Regularity / Covering-Law Theorist (Dominant Vector L)**
  *   **Diagnosis:** You are a Positivist at heart. You believe singular causation is just a compressed way of stating a general law. You want history to be scientific, predictive, and generalizable.
  *   **Blind Spot:** You often find the actual practice of historians frustrating. Most historians do not look for laws; they look for context. You may be demanding a kind of explanation history cannot provide.

  **7. The Narrativist (Dominant Vector R)**
  *   **Diagnosis:** You suspect the whole quiz is category error. You believe historical explanation is aesthetic and literary, not causal. We explain the past by emplotting it into a story (tragedy, romance, irony), not by finding mechanisms.
  *   **Blind Spot:** You risk sliding into skepticism. If history is just story, can you distinguish between a well-evidenced narrative and a well-told lie?

  ***

  # Meta-Analysis: Empty Cells and Indistinguishable Leaves

  **1. The Indistinguishable Pair: Contrastivist vs. Pragmatic Selectionist**
  You will notice that Vector C and Vector P often yield similar results. In practice, these two positions are functionally identical. Both argue that "the cause" is not a feature of the world but a feature of the question we ask. The Contrastivist frames this linguistically (the foil), while the Pragmatist frames it epistemologically (our interests). If you scored high on both, you hold the same view with different vocabulary.

  **2. The Empty Cell: The Structuralist Covering-Law Theorist**
  It is rare to find a historian who is both a Structuralist (history is determined by deep, unique forces like mode of production) and a Covering-Law theorist (history follows general, predictive laws). Structuralists tend to be historicists (every era is unique), while Covering-Law theorists tend to be atomists (events are instances of laws). If you scored high on both, you may hold an incoherent position, or you are a Marxist of a very specific, scientific variety.

  **3. The Unstable Leaf: The Narrativist**
  This quiz struggles to fully separate the Narrativist from the Radical Skeptic or the Social Constructionist. Question 9 and 10 attempt to isolate the Narrativist (focusing on story coherence over mechanism), but a Pragmatic Selectionist might give the same answers simply because they find stories more *useful*. The quiz cannot definitively tell if you think history *is* a story (Ontological Narrativism) or if you just think stories are the best way to *communicate* history (Methodological Narrativism).

  **4. The "Nobody Occupies" Combination**
  You will likely find no one who consistently chooses the **Counterfactualist** option on singular events (Q6) but the **Structuralist** option on overdetermination (Q1). This is because both positions rely on a consistent view of necessity. To hold both suggests you treat events as fragile switches but structures as inevitable trains—a common inconsistency in graduate seminars, but logically tense. If you land here, check your baggage: you may be a Structuralist who secretly loves a good "What If?" game.
