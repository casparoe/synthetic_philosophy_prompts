      *   *Pascal's Mugging:* It helps diagnose the *structure* (unbounded utility functions), but the *solution* isn't identical. Pascal's Mugging is solved by probability bounds or utility caps. The Monster is solved by utility caps or rights constraints. So, "same coat, different body."

  8.  **Final Polish:** Check against the user's constraint ("I'd rather keep 1 and 3"). Ensure the advice allows keeping the "medicine case" intuition without swallowing the Monster.
      *   *How?* By distinguishing between *marginal* differences in normal contexts (Step 1) and *lexical* dominance in extreme contexts (Step 5). This requires rejecting Step 9 (that size doesn't change the reasoning).

