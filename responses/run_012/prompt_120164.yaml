  ok so me and my friend spent like two hours last night arguing about whether the "principal principle" is a real constraint on credence or just a fancy way of saying trust the odds, and i want to settle it with a case rather than vibes. quick gloss so we're on the same page: the principle is roughly that if you know the objective chance of A is x, and you've got no other relevant information, your credence in A should be x. it's always sold as a rule that pulls you *toward* the chance. i want a case where it pulls you the other way — all the way to the opposite end if possible, i.e. you know for certain the chance of A is 0.9 and the rationally required credence in A is 0 or basically 0, and that falls out of the principle itself rather than you smuggling in extra evidence.

  my hunch is it has to run through self-undermining chance: A is the sort of proposition whose being true would make the chance not-0.9 in the first place, so once you're certain the chance *is* 0.9 you can rule A out. but build it properly, don't just assert that. constraints: the setup is one paragraph, a normal person could actually face it (no cosmology, no multiverse, no aliens, no time travel, no backwards causation, no perfect predictor, nothing infinite), concrete numbers throughout, and it has to be clear *why* the chance here is the kind of thing that can be undermined at all — so if that means treating the chance as a summary of the overall pattern of what happens rather than a primitive fact fixed in advance, fine, but then say so out loud.

  after the case: state the chance, state the credence, and say exactly why the principle plus plain logic forces them apart. then run the same case three more times, changing exactly one thing each time — (1) the chance is a primitive fact instead of a summary of the pattern, (2) the agent isn't certain of the chance, just has a spread of credences over what it is, (3) A is about a local matter of fact instead of about the pattern of events as a whole — and tell me which of the three kills the effect and why. then the honest part: which single feature is doing the work, and what does a defender of the principle say to defuse the whole thing? i'm expecting something like "well, your chance proposition is inadmissible there, so the principle never even applied", and i want you to say whether that's a real answer or whether it just quietly makes the admissibility clause carry all the weight. finally, tell me if i've rigged it — the point of the case is to show that knowing the chance doesn't always pull your credence toward the chance, so if the only way to get the result is for me to announce "and also the agent is certain that if A then the chance would've been 0.1", then that's only legit if the case makes clear that isn't a seperate piece of evidence but part of what the chance is in that setup. if you think the whole thing is unsatisfiable, say which constraint breaks and why.
