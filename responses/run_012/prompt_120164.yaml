answer: |-
  **The Case**
  You are an auditor for a sealed "universe-in-a-box" simulation that will generate exactly 1,000 coin flips and then terminate; within this system, "objective chance" is defined strictly by the Best System Analysis (the statistical summary that best balances simplicity and fit for the *completed* 1,000-flip history). You are given the true summary of the completed history as a fact: "The objective chance of Heads in this box is 0.9." Let $A$ be the proposition: "The specific sequence of flips in this box is one that, if it occurred, would make the Best System summary assign a Heads-chance of 0.1 instead." Under the current 0.9-chance function, the probability of $A$ occurring is 0.9 (it is a high-probability "undermining future"), but since you know for a fact that the true summary *is* 0.9, logic dictates $A$ cannot obtain (for if $A$ obtained, the summary would be 0.1), forcing your credence in $A$ to 0.

  **The Divergence**
  *   **Chance:** $Ch(A) = 0.9$ (assigned by the current best-fit system).
  *   **Credence:** $Cr(A) = 0$ (required by logical consistency with the evidence).
  *   **Why:** The Principal Principle states $Cr(A | Ch(A)=x) = x$ *only if* the evidence is admissible. Here, the evidence "$Ch(A)=0.9$" logically entails $\neg A$ (because $A$ entails $Ch(A)=0.1$). Logic overrides the Principle; you cannot have credence 0.9 in a proposition you know to be false.

  **The Variations**
  1.  **Primitive Chance:** If chance is a primitive physical propensity fixed in advance (not a summary of the pattern), $A$ cannot undermine it. If $Ch(A)=0.9$ is a brute fact, $A$ occurring doesn't change it. **This kills the effect.** The divergence vanishes because $A$ and $Ch(A)=0.9$ are no longer incompatible.
  2.  **Uncertain Chance:** If you aren't certain the chance is 0.9 but have a spread (e.g., 50% sure it's 0.9, 50% sure it's 0.1), you apply PP to each hypothesis. The 0.9 hypothesis pulls credence up, the 0.1 hypothesis pulls it down. **This kills the effect.** You end up with a weighted average, not a hard 0, because you lack the certainty required to logically rule out $A$.
  3.  **Local Fact:** If $A$ is "The next flip is Heads" rather than a claim about the global pattern, $A$ does not undermine the chance function. **This kills the effect.** A single outcome rarely shifts the Best System enough to change the chance assignment, so $A$ and $Ch(A)=0.9$ are compatible, and PP holds.

  **The Honest Part**
  The single feature doing the work is **Humean Supervenience** (chance defined as a summary of the pattern). This makes the chance proposition *inadmissible* evidence regarding the pattern itself. A defender of the Principle says: "The admissibility clause isn't a dodge; it's a boundary condition. PP governs how chance constrains belief *when chance doesn't settle the matter*. If your evidence logically settles the matter, PP steps aside."

  Is that a real answer? **Yes, but it's costly.** It admits that PP is not a universal bridge between chance and credence; it only works when the chance function is "safe" from the evidence. If you define admissibility as "evidence that doesn't override chance," the principle risks tautology (it applies exactly when it applies).

  **The Rigging Check**
  You haven't rigged it *illegitimately*, but you have leveraged a specific metaphysical definition. The result holds only because you defined "chance" as supervenient on the very history $A$ describes. If a normal person treats chance as a physical propensity (like a weighted die), the case collapses (Variation 1). The constraint that breaks is **"normal person"**: ordinary agents don't treat chances as Humean summaries vulnerable to undermining futures; they treat them as stable physical facts. To get the result, the agent must be a metaphysician auditing a closed system, not a gambler at a casino.
