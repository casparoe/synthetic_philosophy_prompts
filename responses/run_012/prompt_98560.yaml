answer: |-
  # Q&A Prep Sheet: The Scale Argument & Insect Welfare

  **Strategy Note:** Your position is *epistemic humility* + *expected value*. You are not claiming "Insects definitely suffer." You are claiming "We cannot rule it out, and the numbers make the risk unacceptable." Do not get dragged into proving sentience. Keep the burden of proof on the skeptics to justify *zero* probability.

  ---

  ### 1. The "Pascal's Mugging" Objection (Welfare Economists)
  **The Question:** "If you accept that tiny probabilities multiplied by huge numbers dictate moral action, aren't you opening the door to fanaticism? By this logic, we should ignore certain suffering in humans to chase infinitesimal probabilities of saving infinite simulated universes. Your expected-value calculation breaks decision theory."
  **The Reply:** "I'm not proposing we ignore certainty for speculation. I'm proposing we treat 'unknown' as a distribution, not a zero. We don't need to solve infinite ethics to notice that $10^{18}$ insects is a number large enough to make even a conservative probability estimate outweigh the certain convenience of cheap protein. We can cap the fanaticism without ignoring the scale."
  **⚠️ Thin Spot:** You *are* relying on unbounded expected value. If they press on "bounded utility functions," you have to concede that your argument relies on a specific, contestable model of risk. **Concede:** "I accept we need bounds. I'm arguing the bound is much higher than current policy assumes."

  ### 2. The "Hardware" Objection (Neurobiologists)
  **The Question:** "You talk about probability, but you're ignoring the substrate. Insect ganglia operate on reflex arcs and nociception without central integration. There is no 'theatre' for suffering to occur. Assigning a non-negligible probability to a cricket feeling pain is like assigning probability to a thermostat feeling cold. It's category error, not uncertainty."
  **The Reply:** "I respect the neuroanatomy, but we lack a theory of consciousness that confirms *absence* as confidently as it confirms presence. We know what hardware *we* have, but we don't know the minimum viable architecture for experience. Until we have a 'consciousness meter,' treating the absence of evidence as evidence of absence at this scale is a gamble I'm not willing to take."
  **⚠️ Thin Spot:** They know more than you. **Hold:** Don't argue neuroscience. Argue *limits of neuroscience*. "You can't prove a negative, and the stakes are too high to assume you can."

  ### 3. The "Definition" Objection (Philosophers of Mind)
  **The Question:** "You're using 'sentience' and 'suffering' as if they're stable variables. But if an insect has nociception without a self-concept to *mind* the pain, is it suffering? If you can't define the threshold of experience, your probability number is just a guess dressed up as maths."
  **The Reply:** "I'm not defining the threshold; I'm highlighting the risk of crossing it. Whether it's 'suffering' or 'aversive processing that matters morally,' the ethical weight remains. If we wait for a perfect definition of consciousness before acting, we will act only after the damage is done. We regulate toxins without knowing exactly how they kill every cell; we can regulate welfare without a perfect metaphysics of mind."
  **⚠️ Thin Spot:** If they argue "mattering" requires a self, your argument weakens. **Concede:** "I agree the definition is messy. That's precisely why we need the precautionary principle."

  ### 4. The "Literary Manipulation" Objection (General/Skeptics)
  **The Question:** "You say the novel form does 'epistemic work.' Isn't that just a polite way of saying you're using narrative empathy to bypass the lack of data? You're making people *feel* the cricket is a person, then using that feeling as evidence. That's propaganda, not philosophy."
  **The Reply:** "Data tells us *how many*; narrative tells us *what it might be like*. Science describes the mechanism; art simulates the experience. If we can't measure sentience directly, imagination is the only tool we have to model the possibility. It's not bypassing the data; it's filling the gap where data is physically impossible to get."
  **⚠️ Thin Spot:** Hard to prove art yields truth. **Hold:** Stand firm on "narrative as simulation." It's your home turf.

  ### 5. The "Evolutionary Cost" Objection (Biologists)
  **The Question:** "Suffering is metabolically expensive. It requires complex processing to modulate behavior based on negative states. For an insect with a lifespan of weeks, evolving genuine phenomenological suffering is inefficient compared to simple algorithmic avoidance. Evolution wouldn't select for it."
  **The Reply:** "Efficiency isn't the only driver; phylogeny matters. If suffering emerged early in the arthropod line, it might be a legacy cost, not an optimization. Also, if 'suffering' is just a complex weighting function for avoidance, evolution might select for it precisely because it's *more* efficient than rigid reflexes in variable environments."
  **⚠️ Thin Spot:** Speculative evolutionary psychology. **Concede:** "This is speculative, which supports my point: we don't know enough to rule it out."

  ### 6. The "Policy Paralysis" Objection (Pragmatists)
  **The Question:** "Let's say you're right. The expected suffering is enormous. What is the actionable policy? Do we ban all insect farming? Do we stop pest control? If your conclusion leads to impossible demands, the premise must be wrong."
  **The Reply:** "It leads to prioritization, not paralysis. We don't need to solve all insect suffering today. We start with the concentrated, industrialized suffering we control directly: farming. It's the low-hanging fruit. Acknowledging the scale doesn't require perfection; it requires starting the reduction."
  **⚠️ Thin Spot:** If they push "Why stop at farming?", you have no clear boundary. **Hold:** "Start where human agency is highest."

  ### 7. The "Comparative Neglect" Objection (Effective Altruists)
  **The Question:** "Even if the expected value is high, the *tractability* is low. Changing human diet is incredibly hard. Wouldn't those resources be better spent on high-probability, high-tractability human welfare issues? You're ignoring opportunity cost."
  **The Reply:** "It's not a zero-sum game. And 'hard' is relative. Industrial insect farming is a nascent industry; it's easier to shape regulations now than to change established human habits later. This is about prevention, not cure. The tractability is actually higher now than it will be in ten years."
  **⚠️ Thin Spot:** Opportunity cost is a strong economic argument. **Concede:** "We should do both. But neglecting a high-stakes risk because it's difficult is bad risk management."

  ### 8. The "Moral Consistency" Objection (Ethicists)
  **The Question:** "If the expected suffering of insects swamps human suffering due to scale, shouldn't we prioritize insect welfare over human welfare in a direct trade-off? Does your argument imply we should let a human starve to save a billion crickets?"
  **The Reply:** "No, because probability isn't the only variable; intensity and moral weight matter too. I'm arguing the *total* volume is significant, not that a single cricket outweighs a single human. It's an argument for inclusion in the calculus, not for lexical priority over humanity."
  **⚠️ Thin Spot:** This is the edge of the "Scale Argument" cliff. **Hold:** "It's about not treating them as zero, not treating them as equal."

  ---

  ### ☠️ The Dreaded Question
  **The Question:** "If the numbers are the driving force of your ethics, where is the cutoff? If $10^{18}$ insects demand moral consideration, what about $10^{20}$ nematodes? Or bacteria? At what point does your 'Scale Argument' become an absurdity that demands we stop existing to avoid crushing microbes?"

  **Why you dread it:** It exposes that "Scale" alone is insufficient. You need a *threshold* of complexity, but admitting a threshold undermines the "we don't know" humility you rely on for insects.

  **The Reply:** "That is the hardest question, and I don't have a clean mathematical answer. But ethics is often about drawing lines in the grey. I'm arguing for a precautionary principle around *plausible* candidates for sentience—nervous systems, behavioral flexibility. Bacteria lack even the hardware for nociception. We can acknowledge the slope without sliding off the cliff. We draw the line where the probability of experience drops below a threshold of relevance, even if that threshold is imperfect."
  **⚠️ Thin Spot:** This is arbitrary. **Concede:** "You're right, it is arbitrary. But 'arbitrary but necessary' is better than 'precise but potentially catastrophic'."
