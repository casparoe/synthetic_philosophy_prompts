answer: |-
  **1. Preservation Silence**
  Mass digitisation reduces this mechanism most significantly because it directly alters the physical state of the record's availability. Where decay, fragility, or format obsolescence previously rendered documents unusable, digitisation creates a stable, legible surrogate that bypasses the need for conservation handling. This is not merely a matter of convenience; it transforms traces that were effectively lost to physical degradation into active evidence, expanding the corpus of usable history without altering the archival holdings themselves.

  **2. Description Silence**
  Digitisation substantially reduces this silence, provided the programme includes optical character recognition (OCR) or enhanced metadata. By enabling full-text search and tagging, digital surrogates allow researchers to bypass the rigid, institutional vocabulary of the original finding aids. A trace that was previously unreachable because it was filed under an obscure administrative code can now be retrieved via the content of the text itself, bridging the gap between the record-creator's language and the historian's query.

  **3. Reception Silence**
  Digitisation reduces this mechanism only marginally, as it addresses access but not interpretation. While making documents more visible increases the likelihood they will be read, it does not alter the historiographical conventions that determine their evidential weight. A digitised document is still subject to the same scholarly biases that caused it to be set aside in the analogue era; indeed, by flooding the field with more of the same types of records, digitisation may reinforce existing conventions rather than challenge them.

  **4. Appraisal Silence**
  Digitisation does not reduce this mechanism at all, as it operates exclusively on the pool of records that survived the appraisal process. The decision to destroy or not transfer certain documents occurred prior to digitisation, and the digital programme merely replicates the boundaries of that earlier selection. Consequently, the documents that were weeded out remain absent from the digital archive just as they were from the physical one, leaving this silence entirely intact.

  **5. Inscription Silence**
  Digitisation aggravates this mechanism more than any other. Because mass digitisation projects often present their output as a comprehensive "collection," they create an illusion of totality that obscures the fact that administrative routines never generated records for certain people or activities in the first place. This digital positivism leads researchers to assume that what is not searchable online did not happen, thereby deepening the silence of the unrecorded by masking the structural limits of the administration itself.

  **Self-Concealing Mechanism**
  The mechanism least likely to be noticed by a competent researcher working from inside the archive is **Reception Silence**. Unlike the other mechanisms, which present as external obstacles (missing files, decayed paper, opaque catalogues), Reception Silence operates internally within the researcher's own critical judgment. Because the researcher perceives the act of "setting aside" a document as a deliberate exercise of professional expertise rather than a compliance with convention, the silence is self-concealing; it masquerades as methodological rigour, making it invisible to the very person enacting it.
