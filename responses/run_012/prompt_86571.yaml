  Here is the analysis of your friend's semantic framework, the competing rules, and the strategy to pin down her verdict.

  ### The Two Competing Rules

  Based on her history, we can isolate two distinct logical frameworks that both account for every verdict she has given so far. They only diverge when handling negation in cases where the subject does not exist.

  **Rule 1: The Existence-Entailing Rule**
  *   **The Logic:** For any sentence of the form "The F is G" (or "The F is not G") to be **True**, there must first exist exactly one thing that fits the description "F." If nothing fits "F," or if more than one thing fits "F," the sentence is **False**, regardless of the predicate ("G" or "not G").
  *   **How it fits her record:** It explains why "The emperor is left-handed" is false (no emperor exists). It explains why "The tallest kid..." is false (two kids exist, violating uniqueness). It explains the "martini" case (no one fits the description "drinking a martini," so the sentence fails). It allows "The dodo is extinct" to be true because she likely treats "The dodo" as referring to a *species* (which exists) rather than an individual bird (which does not).
  *   **Prediction for "The current emperor of Brazil is not left-handed":** **False.** Since there is no emperor, the existence condition fails. You cannot truthfully predicate anything (even "not left-handed") of a non-existent subject.

  **Rule 2: The Propositional Negation Rule**
  *   **The Logic:** A sentence "The F is G" is **True** if there is exactly one F and it is G; otherwise, it is **False**. However, negation operates on the *truth value of the whole claim*. "The F is not G" is interpreted as "It is not the case that (The F is G)." Since your friend insists on bivalence (no "neither true nor false" gaps), if the positive claim is False, the negated claim must be **True**.
  *   **How it fits her record:** It accounts for all her positive verdicts exactly the same way as Rule 1. It agrees that "The emperor is left-handed" is False. It agrees that "The martini drinker is my brother" is False. It simply adds a layer about how negation flips that Falsehood to Truth.
  *   **Prediction for "The current emperor of Brazil is not left-handed":** **True.** Because the positive claim ("The emperor is left-handed") is False, and she rejects truth-value gaps, the negation must be True.

  ### Best Guess: Which Rule Is She On?

  **She is almost certainly running Rule 1 (The Existence-Entailing Rule).**

  **Why:**
  Her verdict on the "martini" case is the smoking gun. She explicitly stated that "what the speaker meant... doesn't change what the sentence says." This reveals she is a **literalist** about semantic content. She analyzes the sentence structure, not the speaker's intent.

  In the sentence "The man drinking a martini is not my brother," a literalist analysis treats "The man drinking a martini" as the subject and "is not my brother" as the predicate. For the predicate to apply, the subject must be successfully identified. Since her rule demands the description be literally satisfied (water $\neq$ martini), the subject fails to refer. If the subject fails, the predication fails, resulting in **False**.

  If she were on Rule 2, she would have to accept that "The man drinking a martini is not my brother" is True simply because the positive version is False. But given her strictness on the martini description, she likely views the negation as just another property ("non-brotherhood" or "not-being-my-brother") that requires an existing subject to bear it. Her annoyance at "neither true nor false" suggests she wants definite truth values, but Rule 1 provides definite values (False for both) without requiring her to admit truth for sentences about non-existent things.

  ### The Test Sentence

  To settle this definitively without asking her about the emperor directly, present her with a negated version of a case she has already ruled on. This controls for the facts while testing the logic.

  **Put this sentence to her:**
