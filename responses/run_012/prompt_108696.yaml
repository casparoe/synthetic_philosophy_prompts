      *   **Problem:** The slogan "you can't jump out of the system" is being used in conflicting ways (to deny AI self-audit and to deny conceptual self-criticism), whereas the MU-puzzle suggests jumping out is easy/necessary for insight.
      *   **Task:** Disambiguate the slogan into distinct precise theses (numbered menu).
      *   **Requirements for each thesis:**
          *   (a) Precise statement.
          *   (b) Verdict (Trivially true, Substantive/Defensible, False).
