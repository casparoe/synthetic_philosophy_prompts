  4.  **Analyzing the Interlocutors:**
      *   *Interlocutor 1 (AI Auditing):* Likely conflating Thesis 1 (Definition) or Thesis 2 (Gödel) with Thesis 5 (Psychological). They think "optimizing" is the system, so "evaluating" must be outside. But an AI can have a meta-module.
