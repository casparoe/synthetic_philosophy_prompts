  Your package contains an **inconsistent tetrad**. You cannot hold (1), (2), (3), and (4) simultaneously without contradiction.

  *   **(1) Bivalence** + **(2) Timeless Truth** entail that the proposition *p* ("It will rain tomorrow") has a truth value *now*, and that value is fixed eternally.
  *   **(3) Truthmaker** entails that if *p* is true *now*, there must be some existing feature of reality *now* that makes it so.
  *   **(4) Open Future** entails that there is no feature of reality *now* that settles or guarantees the future event.

  If (3) is understood in the standard way (that a truthmaker necessitates the truth of the proposition it grounds), then (1)+(2)+(3) logically entail the negation of (4). If there is a truthmaker now for "It will rain," the rain is settled. If the rain is not settled, there is no truthmaker now. If there is no truthmaker now, and truth requires a truthmaker, the proposition is not true now. If it is not true now, Bivalence (1) is violated (assuming it's not false either, which leads to the same problem for the negation).

  Your friend's argument exploits this exact tension. They assume that **Truth implies Ontological Parity**. If a statement about tomorrow is *true now* in the same robust sense that a statement about yesterday is *true now*, then the ontology of tomorrow must be as fixed as the ontology of yesterday. Given your commitment to (3), your friend is correct: on your current package, the truth of the prediction requires a present ground, and a present ground for a future event implies that the event is already "there" in the causal order.

  ### 2. Ranking the Tensions by Cost of Repair

  To resolve the inconsistency, one commitment must be revised or abandoned. Here they are ordered from highest cost to lowest cost, based on your stated identity and constraints.

  **1. Abandon (4) Open Future / (5) Anti-Fatalism (Highest Cost)**
  *   **What gives:** You accept that the future is settled (Eternalism/Block Universe).
  *   **Drag effect:** This directly contradicts your explicit statement that you are "emphatically not a fatalist" and that you treat the idleness of deliberation as a *reductio*. While some compatibilists argue deliberation is compatible with a settled future, you have explicitly ruled out views that make the future "already settled."
  *   **Verdict:** Unacceptable. This destroys the practical motivation for your entire view.

  **2. Abandon (1) Classical Bivalence (High Cost)**
  *   **What gives:** You admit that future-contingent sentences are neither true nor false (Aristotelian view).
  *   **Drag effect:** You identify as a "classical logician." Abandoning bivalence requires adopting a non-classical logic (e.g., supervaluationism or three-valued logic). This undermines your foundational commitment to (1) and forces you to treat future-tensed sentences as a special logical category, which you explicitly forbid in (6).
  *   **Verdict:** Prohibitive. This undermines your professional/philosophical identity.

  **3. Abandon (2) Timeless Truth (Medium-High Cost)**
  *   **What gives:** You accept Temporalism (propositions change truth value). "It will rain" is not true *now*; it *becomes* true tomorrow.
  *   **Drag effect:** This complicates your logic significantly. If the proposition is not true now, is it false? If false, you are back to the truthmaker problem for the negation. If neither, you violate (1). To make this work, you usually have to weaken (1) anyway (see above). Furthermore, you stated in (2) that "to say it 'will be true later' is only another way of saying that it is true now." Reversing this requires a major rework of your semantics.
  *   **Verdict:** High friction. It creates more logical problems than it solves unless you also drop (1).

  **4. Weaken (3) The Truthmaker Principle (Lowest Cost)**
  *   **What gives:** You admit that not *all* truths require a *present* ontological ground. Specifically, future contingents are true (satisfying 1 & 2) but lack a *determining* truthmaker in the present (satisfying 4).
  *   **Drag effect:** This violates the letter of (3) ("truth never floats free of what there is"). However, it preserves the *spirit* of realism (the statement is still objectively true or false) without forcing the ontology to be deterministic.
  *   **Verdict:** The most viable path. It isolates the metaphysical cost to save your logic and your agency.

  ### 3. The Recommended Revision

  To buy the most consistency for the least loss, you should **weaken Commitment (3)**.

  You should revise the Truthmaker Principle to distinguish between **Truth** and **Present Grounding**.

  **The Revision:**
  > **(3*) Restricted Truthmaker Principle:** While truth generally supervenes on being, truths about future contingents do not require a *present, determining* fact to be true. They are made true by the **totality of time** (including the future event itself) or, if you refuse to posit future existence, they are **brute truths** that supervene on the *structure* of possibility rather than specific present entities.

  **Why this works:**
  1.  **Preserves (1) & (2):** "It will rain" is true now and always. You remain a classical logician.
  2.  **Preserves (4) & (5):** Because there is no *present* fact that necessitates the rain, the future remains open, and your deliberation can causally influence which brute truth becomes actualized.
  3.  **Blocks the Friend:** Your friend argues: *True Now = Real Now = Unchangeable.* By weakening (3), you break the first link. You can say: "It is true now that it will rain, but this truth is not grounded in a *fixed present reality* that renders the event unchangeable." The truth is real, but its ground is not a present constraint.

  **Addressing the "Floating Free" Worry:**
  You stated you won't allow truth to "float free of what there is." The revision requires you to accept that, in the specific case of future contingents, truth *does* float free of *what there is now*.
  *   **Defense:** This is not an abandonment of realism, but a recognition that **logical determination does not imply causal determination.** The truth of the proposition is a logical feature of the world's timeline, not a causal lever present in the now. You are not positing "future facts" (violating 6); you are positing a **lack of present facts**. The truth exists, but its ontological anchor is not located in the present slice of reality.

  ### 4. Summary of the Single Best Revision

  **Revise (3) to (3*):**
  *   **Original:** "Whenever a sentence is true, there is something in the world... in virtue of which it is true."
  *   **Revised:** "Whenever a sentence is true, there is something in the world *or in the total structure of time* in virtue of which it is true; however, for future contingents, this ground need not be a *present, determining* fact."

  **Cost:** You lose the metaphysical elegance of a uniform truthmaker theory.
  **Gain:** You save Classical Logic, Timeless Truth, the Open Future, and Human Agency.

  This is the only configuration that allows you to keep your identity as a logician (1), your view on time (2), and your commitment to agency (4, 5) without invoking the forbidden escape hatches (6). The tension you feel is the friction of trying to ground an open future in a closed logic; the only place to absorb that shock is the metaphysical grounding relation itself.
