  **Decomposition:**

  *   **Selection-Determinacy:** 0.50
      Consumer-based constraints narrow the candidate functions, but environmental covariance still permits multiple compatible selection histories without a non-question-begging tie-breaker.
  *   **Misrepresentation:** 0.70
