  *   **Ontogeny:** 0.20
      Derived proper functions for learned states inevitably smuggle in intentional descriptions of the learning mechanism or fail to individuate novel concepts.
  *   **Natural Kind:** 0.50
      There is a substantial probability that intentional content is a pragmatic gloss rather than a biological variable, making the naturalization project a category error.

  **Combination Method:**
  I treat 'Natural Kind' as a gatekeeper multiplier (if 0, total is 0), and the other three as necessary conditions for the theory's *scope*, weighted heavily against Ontogeny because a theory that only covers innate reflexes fails to naturalize the "mental" in the sense that matters for philosophy of mind.

