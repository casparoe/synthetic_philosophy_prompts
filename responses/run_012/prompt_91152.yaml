answer: |-
  "It's geometry, not sociology," Elena said, tapping the marker against the whiteboard. "Look at the axes. Age, period, year of birth. You add any two, you get the third. The **Lexis diagram** isn't a model; it's a tautology. A cohort is just a diagonal line across the grid. It's perfectly collinear. Any claim you make about what a generation *is* requires an assumption that no data can check because the variables are mathematically inseparable."

  "So the diagonal doesn't exist?" Sarah asked. She was standing by the window, arms crossed. "Because the people walking along it seem to feel it."

  "They feel the period effects. They feel aging. They don't feel the diagonal. You're attributing to the line what belongs to the slope."

  "When boomers delayed childbirth, you called it a decline in fertility. I called it **tempo distortion**. You know the phenomenon from period fertility measures. A change in the timing of an event is misread as a change in its quantity. They weren't having fewer children; they were having them later. But that timing *is* the generational signature. The delay itself is the cultural shift. You treat it as measurement error; I treat it as the signal."

  "It's noise," Elena said. "It makes a generation look distinctive only because it did things earlier or later than the one before it. If you correct for tempo, the cohort effect vanishes. You're mistaking the calendar for the culture."

  "Correct for tempo and you erase the life course. You want to flatten time so you can say nothing happens."

  "I want to stop you from reifying artifacts. You talk about shared outlooks, but look at the boundaries. Think about the case of the country that moved its school-entry birthday cutoff by six months. They split a single birth year into two groups with different formative environments. One group starts school at six, the other at six and a half. They end up in different classes, different peer groups, different labor markets. Which of the two belongs to the generation on either side of the seam?"

  "The one that shares the historical weather," Sarah said.

  "There is no weather. There's only administrative arbitrariness. If a bureaucracy moves a date by six months, you get two different 'generations' from the same birth year. Or none. It proves the category is porous. It's a marketing department's mistake which sociologists have agreed, out of politeness or cowardice, to take seriously."

  "It's not porous, it's stratified. You're ignoring the distinction drawn a century ago by a sociologist of knowledge between a generation and a **generational unit**. Not everyone born in 1965 is a Boomer. That's the smaller cluster inside a generation that actually works out a shared response to its situation. The rest of the cohort merely shares its dates. They're passive. The unit is active. I measure the unit."

  "So you measure the loud bits and call it the whole," Elena said. "You cherry-pick the activists, the trendsetters, the people who write memoirs, and you say 'this is the generation.' Meanwhile, the silent majority who just lived through the same years without forming a 'cast of mind' are excluded from your definition because they don't fit the pattern. You've made the concept unfalsifiable. If they act alike, it's a generation. If they don't, they aren't part the generational unit. It's a circle."

  "It's a filter. You need it to find the signal."

  "You need it to save the hypothesis. You say generations are real social kinds. A body of people who came of age in the same historical weather. But weather is period. Aging is age. What's left for cohort? Only the label."

  "Crowding," Sarah said. "The **mundane fact that cohort size alone** can produce a shared outlook with no shared event behind it at all. A large birth year crowding into the same schools, the same first jobs, the same housing market. They compete for the same slots. They get priced out of the same neighborhoods. They develop a shared grievance not because of a war or a crash, but because there are too many of them. That's material. That's not a label."

  "That's supply and demand," Elena said. "That's economics. You don't need the word 'generation' to explain why housing is expensive when demand is high. You're adding a mystical layer to demographics. You say a shared outlook emerges. I say scarcity emerges. The outlook is just a post-hoc rationalization of the scarcity."

  "It becomes a identity. They know they're crowded. They know they're squeezed."

  "Because you tell them they are. Because you give them a name. That's the **possibility that generations are real only in the way a currency peg is real**. Held in place by everyone's belief that it holds. Generational labels become self-fulfilling the moment enough people are told which one they are. They act like Boomers because you call them Boomers. They vote like Zoomers because the polls ask them how Zoomers vote. You're studying the feedback loop, not the phenomenon."

  "If the peg holds, the economy functions. If the label works, the sociology holds. What's the difference?"

  "The difference is truth. A currency peg can collapse. If you stop saying 'Boomer,' does the behavior persist? Or does it evaporate because the script is gone?"

  "The behavior persists. The housing market doesn't care if you stop using the word. The delay in marriage doesn't care. I have thirty years of longitudinal data. I see the diagonal."

  "You see the shadow of the axes," Elena said. She capped the marker. The sound was sharp in the quiet office. "You want it to be real because you've spent thirty years producing cohort studies. You believe that a generation is a genuine social kind because your career depends on the diagonal existing. If it's just marketing, what have you been measuring?"

  "I've been measuring people," Sarah said. "People who know they belong to something. You think because you can decompose the variance into age and period components that the rest is zero. It's not zero. It's the residue. It's the thing we live in."

  "The residue is error term."

  "The residue is history."

  "History is period."

  "History is what happens to a specific group that never happens again. You can't replicate the Cold War. You can't replicate the internet rollout. You can't replicate the housing crash of 2008 for a different group. It hits one cohort in their twenties and another in their fifties. The impact is different. That difference is the cohort effect."

  "It's an interaction term," Elena said. "Age times Period. You don't need a third noun. You're ontologically bloating the model. You want 'Generation' to be a substance. It's a relation."

  "It feels like a substance."

  "Feelings aren't data."

  "Aggregated feelings are."

  "Aggregated suggestions," Elena corrected. "You're trapped in the vocabulary. You say 'shared formative exposure gives them a common cast of mind.' But the exposure is period. The mind changes with age. The only thing unique to the cohort is the label you stuck on them at birth. You're confusing the map for the territory. The Lexis diagram shows you the map is drawn with vanishing ink."

  "And yet people navigate by it."

  "Because they're lost."

  "Because it works."

  "Because you convinced them it works. You're the central bank of generational theory. You print the money. You tell them the peg holds. And when they spend based on the value you assigned them, you say 'see, the value was real.' It's circular. It's a marketing department's mistake which sociologists have agreed, out of politeness or cowardice, to take seriously."

  "Cowardice?" Sarah stepped away from the window. "Or humility? Acknowledging that people organize their lives around narratives? If the narrative shapes the behavior, the narrative is a variable. You can't regress it out."

  "I can if it's endogenous. If the label causes the behavior, you can't use the behavior to validate the label. You're measuring your own reflection."

  "I'm measuring the water we swim in."

  "You're measuring the tank."

  They stood there, the whiteboard between them covered in diagonals and axes, the markers drying out. The air conditioning hummed. Neither looked at the board.

  "You think I'm protecting my career," Sarah said.

  "I think you're protecting the object of your career. If the object dissolves, the career becomes a study of artifacts. Like phrenology. You measured bumps that weren't there."

  "And you think you're protecting science. But you're protecting a null hypothesis that says nothing matters except the immediate moment and the biological clock. It's sterile."

  "It's honest."

  "It's empty."

  "It's rigorous."

  Sarah picked up her notebook. She didn't open it. "We need to finalize the grant proposal. The committee wants to know if we're studying cohort effects or period effects."

  "Tell them we're studying the Lexis diagram."

  "Tell them we're studying people."

  "Tell them we're studying the peg."

  "Tell them we're studying the weather."

  "Tell them we're studying the error term."

  "Tell them we're studying the generation."

  Elena uncapped the marker again. She drew a line through the diagonal. "It's still collinear."

  "It's still lived."

  "Then write it up. I'll review the methods section."

  "You'll reject it."

  "I'll correct the model."

  "You'll erase the diagonal."

  "I'll clarify the axes."

  Sarah put the notebook in her bag. "See you tomorrow."

  "Bring the data," Elena said. "Not the stories."

  "Bring the grid," Sarah said. "Not just the lines."

  They didn't look at each other when they left the room. The whiteboard remained, the chalk dust settling on the tray, the diagonal crossing the grid, undeniable and unprovable.
