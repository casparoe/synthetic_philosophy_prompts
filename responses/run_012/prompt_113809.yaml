          *   *Advice:* Don't rely on the phenomenological difference (how it feels). Focus on the *structural* similarity. Arbitrary boundaries create caste systems.

      *   *Point 2: Reading Dummett (Question 2).*
          *   *Critique:* Dummett isn't just making a diagnostic point. He's a realist about politics but a moralist about principles. He argues that *because* the history is racist, the *principle* of exclusion is tainted. The user is separating motive from principle too cleanly. Dummett would say the history reveals the *true nature* of the principle.
