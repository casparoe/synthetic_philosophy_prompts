answer: |-
  Here is the strongest version of your argument, reconstructed to ensure I am not attacking a straw man. You are attempting a strategic retreat to save Dummett's conclusion from his own foundational analogy. You argue that Dummett conflates the *mechanism* of exclusion (sorting by birthplace) with the *moral injury* of racism (ranking by worth). Your claim is that while border controls do sort people arbitrarily, they do not necessarily assert that the excluded are ontologically inferior, which is the core harm of racism. Therefore, the conceptual analogy fails. However, you salvage the political conclusion by shifting the ground from moral metaphysics to historical sociology: because exclusionary powers have been historically weaponized for racist ends, the burden of proof must remain on the excluder, not because exclusion is inherently unjust, but because the institutions wielding it are demonstrably untrustworthy. You are trading a universal principle for a presumption based on institutional corruption.

  Here are the specific problems with this approach, and how to address them.

  1.  **The Sorting-vs-Ranking Distinction is Phenomenologically False**
      You ask if this distinction is real or a cop-out. It is largely the latter. You claim being kept out doesn't tell you you're "worth less." This ignores the expressive function of borders. When a state says, "You cannot work, live, or seek safety here because you were born there," it is not merely sorting; it is assigning political caste. In a world where life chances are determined by jurisdiction, relegating someone to a poorer jurisdiction *is* a ranking of their claim to resources and safety. Racism is not just hatred; it is the allocation of rights based on immutable characteristics. If you accept Dummett's premise that birthplace is immutable, the *effect* of the sorting is a hierarchy of worth, regardless of the intent.
      *   **What to do:** Drop the claim that exclusion doesn't imply lesser worth. Instead, argue that the *justification* for the ranking is what matters. Concede that borders create hierarchy, but argue that without a compelling reason (like immediate resource collapse), that hierarchy is illegitimate. Don't try to soften the blow of exclusion; highlight its severity to justify the high burden of proof.

  2.  **You Are Misreading Dummett's Diagnostic Move**
      You ask if your diagnostic reading is fair. It is too charitable to yourself and uncharitable to Dummett. You treat Dummett's historical analysis as secondary evidence of bad motives. For Dummett, the history *constitutes* the concept. He argues that modern nation-states were built *through* exclusionary racial projects; therefore, the concept of "national sovereignty over borders" is not a neutral tool that was occasionally misused, but a tool forged for the purpose of misuse. You are trying to separate the tool from its design. By dropping the conceptual half, you imply that a "clean" exclusionary policy is possible. Dummett would say that is a fantasy.
      *   **What to do:** Tighten the link between history and principle. Don't say "the principle is okay, but the history is bad." Say "the principle is unintelligible without the history." Argue that because the *definition* of the nation-state relies on distinguishing 'us' from 'them' in ways historically coded as racial, you cannot purify the concept simply by changing the language. This makes your argument stronger: it's not just that politicians are racist, it's that the system is.

  3.  **The "Club" Objection is Stronger Than You Think**
      You worry about the country-as-club analogy (often associated with liberal nationalists like Christopher Wellman). This is your biggest vulnerability. If a country is a private association, it has a right to freedom of association, just as a dinner party can exclude guests. Your current draft, which relies on historical taint, doesn't answer this. A club can say, "We were racist in the 1970s, but we've reformed, and now we just want to preserve our specific culture." If you drop the conceptual claim that exclusion is inherently unjust, you have no ground to stand on against a reformed club.
      *   **What to do:** Attack the "voluntary" aspect of the club analogy. A country is not a club; it is a monopoly on legitimate violence and territory. You cannot opt out of the global system of states. If I am excluded from your "club," I cannot simply go to the club next door if all clubs have colluded to enforce visa regimes. Argue that because states control the *only* habitable space, they function as public utilities, not private associations. This restores the conceptual weight you tried to discard.

  4.  **The Conclusion Does Not Survive the Loss of the Conceptual Half**
      You ask if the conclusion survives if the conceptual half fails. It does not. If you rely solely on the diagnostic/historical argument, your presumption against exclusion expires. Once a state can prove it has "cleaned up its act" (e.g., passed anti-discrimination laws, diversified its bureaucracy), your argument grants them the right to exclude. You have made the right to migrate contingent on the host nation's penance, rather than the migrant's need. This makes the right to enter fragile and subject to the very political processes you distrust.
      *   **What to do:** You must reintroduce a conceptual floor. You don't need Dummett's full "birthplace = race" analogy, but you need a principle of *basic interest*. Argue that because migration is often necessary for basic human functioning (safety, subsistence), the "club's" right to associate is trumped by the individual's right to survive. This gives you a non-historical reason to keep the borders open, even if the history were clean.

  5.  **Your Framing is Misdirected: Focus on Power, Not Analogy**
      The entire debate over whether birthplace is like race is a distraction. It invites semantic quibbles (as you found with sorting vs. ranking). The real ethical question is about the distribution of power. The question you should be asking is not "Is this like racism?" but "What gives a group of people inside a line the right to veto the movement of people outside the line?" Dummett uses the racism analogy to shock the reader into seeing the arbitrariness of the power. You are getting bogged down in defending the analogy rather than the arbitrariness.
      *   **What to do:** Reframe the essay. Start with the power asymmetry. Use the racism point as evidence of how that power corrupts, not as the foundational moral axiom. This allows you to keep Dummett's historical insights without betting the whole farm on the success of a single analogy. It makes your argument more robust against the "club" objection because it focuses on the material consequences of exclusion rather than the symbolic similarity to racism.
