      *   **Illusionist Reply:** "Seeming" is just another representation. Appealing to first-person conviction begs the question. We explain the judgment via the meta-problem.
      *   **Critic Reply:** That's question-begging. The judgment is about a state the illusionist hasn't proven illusory yet.
      *   **User's Hypothesis:** Two superimposed disputes: (1) Substantive (facts over/above functional/representational facts), (2) Verbal (meaning of "illusion" vs. "error theory").

  3.  **Evaluate the User's Hypothesis:**
      *   *Is it verbal?* Partly. The word "illusion" is tricky. In perceptual illusion (Müller-Lyer), lines exist but look unequal. In illusionism, the "qualia" don't exist at all. This is technically an *eliminativism* about qualia, masked as *illusionism* about consciousness. Calling it "illusion" invites the "illusion of what?" objection.
      *   *Is it substantive?* Yes. It's about ontology. Do phenomenal properties exist as non-functional/intrinsic entities?
      *   *Is it talking past each other?* Yes. One side is doing metaphysics/epistemology of acquaintance (Critic), the other is doing cognitive science/functional explanation (Illusionist).

  4.  **Diagnose the Core Impasse (The "Hard" Core):**
      *   The Critic relies on the *Phenomenal Concept Strategy* (implicitly) or direct acquaintance. The claim is: The existence of experience is self-intimating. To doubt it is to perform it.
      *   The Illusionist relies on a *Physicalist/Functionalist Closure*. The claim is: If physics is complete, and qualia are non-physical, they don't exist. Therefore, our belief in them must be explained away.
