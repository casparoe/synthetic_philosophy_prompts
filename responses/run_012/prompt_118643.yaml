      *   *Substantive, Verbal, or Different Questions?* It is primarily substantive (ontology of mind), exacerbated by verbal confusion (illusion vs. error theory), and grounded in different epistemological starting points (acquaintance vs. third-person evidence).
      *   *Hidden Empirical/Formal Question?* Is there one? Not really. Empirical data (Sperling, etc.) is interpreted through the theoretical lens. The "Hard Problem" isn't empirical; it's conceptual. No experiment can prove "intrinsicness" or disprove "seeming" because the data *is* the seeming.
      *   *Starting Intuitions?* Yes. This is the crux. The Critic intuits that appearance = reality in the mental case. The Illusionist intuits that physical closure = no spooky stuff.
