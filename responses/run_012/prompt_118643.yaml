answer: |-
  Your hypothesis is astute, but it requires sharpening. You are correct that there is a verbal layer superimposed on a substantive one, but characterizing them as two distinct disputes risks suggesting they can be untangled. They cannot. The verbal confusion is a symptom of the substantive deadlock, not a separate problem.

  Here is the diagnosis of the structure, the role of empirical data, and the conditions for progress.

  ### 1. The Structure of the Disagreement
  This is not merely a dispute about the mechanism of introspection versus the epistemology of the first person. It is a clash between two incompatible **epistemic foundationalisms**.

  *   **The Critic's Foundation:** *Phenomenal Acquaintance.* The claim is that in the mental case, appearance constitutes reality. If it seems to you that you are in pain, the fact of that seeming is indubitable. To deny the reality of the seeming is to deny the only data you have access to. This is why the Critic charges question-begging: you cannot use a third-person theory (representation) to overturn a first-person datum (the hurt), because the theory itself is justified by data that ultimately rests on first-person seemings.
  *   **The Illusionist's Foundation:** *Causal Closure/Physicalism.* The claim is that the physical world is causally closed. If phenomenal properties are non-physical (intrinsic, ineffable), they cannot interact with the physical brain to produce reports or judgments. Therefore, they cannot exist. The "data" of first-person acquaintance must be an error because accepting it as veridical breaks the causal chain.

  The stall occurs because each side treats the other's foundation as the conclusion to be proven.
  *   When the Critic says, "You can't illusion away the seeming," they are invoking **Phenomenal Acquaintance** as an axiom.
  *   When the Illusionist says, "Seeming is just a representation," they are invoking **Physicalist Closure** as an axiom.

  Consequently, the disagreement is **substantive** (about the ontology of mind) but **dialectically circular** because the evidence for each side is theory-laden in a way the other rejects.

  ### 2. The Verbal Layer: "Illusion" vs. "Error Theory"
  You are right to flag the word "illusion." This is a significant source of friction, though not the root cause.

  In standard perceptual illusions (e.g., the Müller-Lyer lines), there is a real property (line length) that is misperceived. The Critic latches onto this: "If it's an illusion of pain, what is the real property being misperceived?"
  *   **Strong Illusionism** is actually an **Error Theory**. It claims there is *no* property being misperceived. The term "illusion" is used rhetorically to suggest that while the *property* doesn't exist, the *experience* (as a functional state) does.
  *   **Weak Illusionism** is a **Revisionism**. It claims the property exists but is not what we think it is (e.g., it is relational, not intrinsic).

  The Critic's objection ("there can be no illusion of seeming") works devastatingly against Strong Illusionism if "seeming" is defined phenomenally. It works less well against Weak Illusionism, but then the view collapses into a form of representationalism that many critics accept anyway.

  The verbal dispute masks the fact that the Strong Illusionist is asking the Critic to accept that "what it is like" is a *judgment* (a cognitive output), whereas the Critic insists "what it is like" is a *state* (a qualitative input). They are using "consciousness" to refer to different nodes in the cognitive architecture.

  ### 3. The Empirical Question
  You asked if a hidden empirical or formal question is doing the work, and what result would bear on it.

  **There is no empirical result that can settle this.**

  *   **Sperling-style results:** These demonstrate a dissociation between information availability and reportability. The Critic uses this to show phenomenology outruns access (supporting realism). The Illusionist uses this to show that "phenomenology" is just a post-hoc confabulation of access mechanisms (supporting illusionism). The data is identical; the interpretation is determined by the prior epistemic commitment.
  *   **Neuroscience:** Finding a neural correlate of pain explains the *mechanism* of the report, but it does not explain why that mechanism feels like *hurt* rather than *nothing*. The Illusionist says "because it doesn't feel like anything, it just reports hurt." The Critic says "the finding explains the cause, not the experience."

  **Could any empirical finding tell against the first-person datum?**
  No. By definition, a first-person datum is not the sort of thing that can be falsified by third-person observation. If a scan shows you are not in pain, but you say you are, the Critic says the scan is missing the phenomenon; the Illusionist says you are mistaken about your state. There is no "arbiter" experiment because the dispute is about what counts as evidence.

  ### 4. Starting Intuitions and the Limits of Argument
  You asked to know if the disagreement rests on starting intuitions that neither side can argue for. **Yes.**

  Further argument will not move the needle because both sides are offering **inference to the best explanation** from different starting points.
  *   **Critic:** Best explanation of our reports is that we have phenomenal states. (Cost: Accepting non-physical properties or panpsychism).
  *   **Illusionist:** Best explanation of physics is that there are no phenomenal states. (Cost: Denying the veridicality of introspection).

  The "Question-Begging" charge is accurate on both sides.
  *   The Illusionist begs the question against the Phenomenal Realist by assuming that representation exhausts mentality.
  *   The Critic begs the question against the Illusionist by assuming that introspection is infallible regarding the existence of its objects.

  This is a **coherentist standoff**. Each view is internally consistent but requires rejecting the other's foundational intuition.

  ### 5. What Counts as Progress?
  You want a straight answer on progress. Since the dispute is foundational, **theoretical resolution is not currently possible.** Progress must be defined differently.

  **1. A Change of Question (The Meta-Problem):**
  The only neutral ground is the Meta-Problem (explaining why we *think* there is a Hard Problem). Both sides can agree on the functional mechanisms that lead humans to claim they have qualia.
  *   *Progress condition:* If the Illusionist can provide a complete functional account of why we make phenomenal judgments *without* positing phenomenal properties, they gain theoretical parsimony.
  *   *Limit:* This does not refute the Critic. The Critic can agree to the functional account and simply add, "And there is also a feel." The Meta-Problem explains the behavior, not the ontology.

  **2. A Distinction (The "Seeming" Pivot):**
  Progress requires forcing a definition of "seeming."
  *   If "seeming" = *a functional disposition to judge*, Illusionism wins (these can be illusory).
  *   If "seeming" = *an intrinsic qualitative presence*, Realism wins (these cannot be illusory).
  *   *Progress condition:* Acknowledging that the debate is not about whether "seeming" exists, but about whether "seeming" is a *relation to a property* or a *property of a representation*.

  **3. Nothing At All (Dialectical Stalemate):**
  You must accept that for many participants, this is a "bedrock" disagreement. Wittgensteinianly, this is where justifications run out. If a student says, "But I just *know* I'm in pain," and the illusionist says, "But physics says you can't be," they are speaking different language games.

  ### Summary Diagnosis
  Your hypothesis is correct that there are two layers, but they are fused.
  1.  **Substantive:** Ontology of mind (Physicalism vs. Phenomenal Realism).
  2.  **Verbal:** Definition of "Illusion" and "Seeming."
  3.  **Epistemological:** Authority of Introspection vs. Authority of Physical Science.

  **The Impasse:** The Critic treats the existence of experience as a **premise**. The Illusionist treats it as a **conclusion** (derived from physicalism) that happens to be false. You cannot argue someone out of a premise they treat as self-evident.

  **The Verdict:** Progress will not come from a new experiment or a tighter argument about representation. It will come only from one side conceding the theoretical cost of their position.
  *   The Critic must admit that accepting phenomenal properties requires modifying our understanding of physics (or accepting brute emergence).
  *   The Illusionist must admit that denying phenomenal properties requires redefining "consciousness" in a way that contradicts common usage.

  If neither is willing to pay that cost, the disagreement is rationally unresolvable. The most honest philosophical move is to map the costs clearly and acknowledge that the choice between them is not evidential, but pragmatic or temperamental.
