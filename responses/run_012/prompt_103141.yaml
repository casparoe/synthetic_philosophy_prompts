answer: |-
  ### The Machine: The Robust Threshold Lattice

  The substrate is a finite 2D grid of bistable logic units (ON/OFF). The micro-dynamics are governed by a single local rule: **"Each unit switches to ON at $t+1$ if and only if at least three of its eight immediate neighbors were ON at $t$, otherwise it switches to OFF."** This is a deterministic cellular automaton; no ghosts, no infinite precision. The "Symbol" is a **Pulse**, defined mechanically as any cluster of ON units whose geometric centroid translates horizontally by one grid-unit per tick without dissipating. Crucially, the Pulse is multiply realizable: there are hundreds of distinct micro-configurations of ON/OFF units within the cluster that all satisfy the centroid-translation condition (e.g., corner units can vary without breaking the propagation). An observer-independent recovery procedure identifies a Pulse by calculating the centroid trajectory of active clusters; if the velocity is constant and horizontal, the Symbol exists.

  To test causal efficacy, we run two surgical interventions at time $t$. **Intervention A (Micro-Scramble):** We toggle specific units within the Pulse's boundary to a different valid configuration that still satisfies the propagation rule (changing the micro-state, preserving the Symbol). **Intervention B (Symbol-Break):** We toggle the *same number* of units but in a pattern that drops the neighbor count below the threshold for the leading edge (changing the micro-state, destroying the Symbol). In Case A, the downstream Symbol-level future remains identical (the Pulse continues). In Case B, the downstream Symbol-level future diverges radically (the Pulse dissipates). The micro-physics is identical in terms of "energy" or "number of flips," but the macro-outcome tracks the Symbol preservation, not the specific micro-configuration.

  ### The Debate: Exclusion vs. Real Patterns

  **The Micro-Exclusionist** argues that the lattice's micro-state at $t$ plus the update rule strictly determines the micro-state at $t+1$. Since the micro-level is causally closed, the "Pulse" adds no ontological push; it is merely a convenient label for a specific disjunction of micro-states. The fact that Intervention A preserves the future is just a coincidence of the micro-laws, not evidence of macro-causation. **The Real-Patterns Proponent** counters that causation is about difference-making under intervention. The Symbol level is *more* causally adequate because it screens off irrelevant micro-details. Intervention A shows that the specific micro-configuration is irrelevant to the outcome, provided the Symbol property holds. Therefore, the Symbol is the stable locus of causal leverage; citing the micro-state introduces noise (over-specification) that obscures the actual counterfactual dependencies.

  **Verdict:** The Exclusionist is forced to admit the micro-details are causally redundant for predicting the macro-future, while the Real-Patterns view claims the macro-level is *autonomous* because it captures the robust conditional structure that the micro-level obscures.

  ### The Work-Doing Feature: Micro-Conditional Independence

  The single feature doing the work is **Robustness** (or micro-conditional independence). The macro-outcome is insensitive to a wide range of micro-variations. If you remove this feature—making the mapping between micro-states and Symbols one-to-one—the thought experiment collapses. If every micro-change destroyed the Symbol, then the Symbol would offer no compression or stability over the micro-description. The "causal efficacy" of the symbol relies entirely on the fact that it groups together micro-states that are *functionally equivalent* regarding the outcome. Without multiple realizability, the symbol is just a rigid name for a micro-state, and the exclusion argument wins by default.

  ### The Exclusionist's Best Counter-Move

  The exclusionist's strongest reply is the **Disjunctive Reduction**. They will argue: "You haven't proven symbols are causal; you've just identified a *disjunction of micro-states* ($M_1 \lor M_2 \lor ... \lor M_n$) that all lead to the same outcome. The real cause is that disjunction, not the 'Symbol'." They claim the Symbol is merely a shorthand for a complex, gerrymandered micro-property. To defeat this, you must argue that the disjunction is not projectable—it has no independent lawlike status outside of the specific system—whereas the Symbol level supports generalizations across different substrates (e.g., the same Pulse logic could run on hydraulics or neurons).

  ### On "Extra Force"

  This case **does** make the symbol level look causally real without committing you to symbols being an extra force. This is achievable because "causal efficacy" here is defined interventionally (difference-making), not energetically. You are not positing a new force that pushes the billiard balls; you are positing that the *pattern* of the balls is the correct grain for describing counterfactual dependencies. The symbols are "real" in the sense that they mark boundaries of stability in the physical dynamics, not in the sense that they add joules to the system. If you require causation to mean "energy transfer," you cannot achieve this; but if you accept causation as "counterfactual dependence," the case holds within strict physicalism.
