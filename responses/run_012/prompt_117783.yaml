          *   *Tractability:* Low for a neuro person. It's pure metaphysics. But conceptual analysis is doable.
          *   *Effort vs. Deserve:* Gets a lot of attention (Chalmers, Goff), but often gets bogged down in semantics. Deserves more rigorous formalization.

      *   **2. The Glue Problem (The "Structure" Problem):**
          *   *Why #2:* Even if subjects combine, how do the *contents* bind? Red + Round = Red Round Apple. If they stay separate, it's not a unified scene.
          *   *Upstream:* Downstream of Subject. You need a subject to hold the glue.
          *   *Tractability:* Medium/High for a neuro person. This interfaces with NCC research (binding mechanisms).
          *   *Effort vs. Deserve:* Gets moderate attention. Deserves more empirical bridging.

      *   **3. The Variety Problem (The "Quality" Problem):**
