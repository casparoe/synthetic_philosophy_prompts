      *Revised Fourth Thing:* **The Phenomenal Sorites.** At what point does combination happen? Is it vague? This threatens the precision required for a scientific theory.
      *Actually, let's go with **The Causal Exclusion within Combination**.* If micro-subjects cause things, and macro-subjects cause things, is there overdetermination?
