answer: |-
  Here is a principle designed to systematize your intuitions, followed by the cost of adopting it.

  ### The Principle of Impartial Discharge

  An arbitrary procedure (coin flip, lottery, etc.) is morally permissible to settle a choice if and only if it satisfies the following four conditions:

  1.  **Rational Exhaustion:** All relevant, reason-based methods of discrimination have been attempted, are impossible, or are time-prohibited.
  2.  **Moral Irrelevance:** The procedure does not rely on features that are morally irrelevant to the claim at hand (e.g., shirt color, race, gender).
  3.  **Reciprocal Agency:** The choice does not establish a reciprocal personal relationship where mutual recognition is constitutive of the good being chosen.
  4.  **Duty of Rescue:** (Modification for permissibility vs. obligation) If inaction results in preventable grave harm, and Conditions 1 and 2 are met, an arbitrary procedure is not merely permissible but **obligatory**.

  ---

  ### How the Principle Maps to Your Verdicts

  **1. The Yogurts & The Apartments (Rational Exhaustion)**
  *   **Verdict:** Fine.
  *   **Motivation:** Condition 1. With the yogurts, exhaustion is immediate (they are identical). With the apartments, exhaustion requires the "check for noise." If you skip the check, you violate Condition 1 (you haven't exhausted reason-based discrimination). This captures your intuition that flipping *before* looking is wrong, but flipping *after* is fine.

  **2. The Drowning Strangers (Moral Irrelevance & Duty of Rescue)**
  *   **Verdict:** Required (but not by shirt color).
  *   **Motivation:** Condition 4 makes it obligatory because inaction is catastrophic. Condition 2 explains why "nicer shirt" is forbidden (irrelevant feature) while a coin is mandated (impartial procedure). This captures the urgency and the constraint on *how* you choose.

  **3. The Partners (Reciprocal Agency)**
  *   **Verdict:** Not Fine.
  *   **Motivation:** Condition 3. A romantic partnership is not a good to be allocated; it is a status constituted by mutual choice. To choose a partner by coin is to treat them as an object of allocation rather than a co-author of the relationship. It violates the nature of the good itself.

  **4. Medicine vs. Music (Rational Exhaustion + Volitional Authority)**
  *   **Verdict:** Fine (but phenomenologically distinct).
  *   **Motivation:** Condition 1 is met (they are "on a par," meaning reasons run out). Condition 3 is not violated (this is a choice about *your* life, not a reciprocal bond).
  *   **Nuance:** The principle permits the coin, but it acknowledges your feeling that this differs from the yogurt. With yogurt, the coin *decides* for you (indifference). With careers, the coin *reveals* for you (parity). In "hard choices" (as philosopher Ruth Chang argues), the coin serves as a volitional tool to prompt a reaction ("Heads... and I feel disappointment? Then I wanted Tails"). The principle permits the mechanism, even if the psychological function differs.

  ---

  ### Predictions for New Cases

  **1. The Kidney Allocation**
  *   **Case:** Two equally suitable patients need one kidney.
  *   **Prediction:** A lottery is not merely **permissible but obligatory**.
  *   **Reasoning:** This triggers Condition 4 (Duty of Rescue/Allocation of Life-Saving Resource). Condition 1 is met (medical suitability is equal). Condition 2 requires an impartial method (lottery) over bias (social status, age, etc.). To *not* use a lottery would be to implicitly rely on morally irrelevant features or hidden biases.

  **2. The Research Directions**
  *   **Case:** Two equally promising research paths for a lab.
  *   **Prediction:** **Permissible.**
  *   **Reasoning:** This is akin to the Medicine/Music case. It is a choice of path/direction (Condition 1 met). It does not violate Reciprocal Agency (Condition 3), as the research directions are not persons. A coin flip here is a valid way to break a deadlock and commit resources to action.

  ---

  ### The Cost: Which Verdict You Must Give Up

  To maintain consistency with this principle, you must revise your verdict on the **Job Candidates**.

  *   **Your Verdict:** Choosing between two equally qualified job candidates by coin is **not fine**.
  *   **The Principle's Verdict:** It is **permissible (and arguably required)**.

  **Why you have to give this up:**
  Your intuition likely stems from the belief that hiring is a *judgment of merit*, and a coin flip feels like an abdication of that judgment. However, if the candidates are *truly* equally qualified (Condition 1 met), there is no merit-based judgment left to make.

  If you accept that a lottery is ethical for **Kidneys** (life-saving resource) and **Drowning Strangers** (life-saving rescue), consistency demands you accept it for **Jobs** (livelihood resource). In all three cases, you are allocating a scarce good among claimants with equal moral claims.
  *   If you reject the coin for jobs, you imply there is a relevant difference between a kidney and a job that makes bias acceptable in hiring but not in medicine.
  *   Most contemporary ethicists argue the opposite: lotteries in hiring are *more* just than interviews, because interviews introduce hidden biases (affinity, accent, appearance) that violate Condition 2 (Moral Irrelevance).

  **The Revision:**
  You should view the job coin-flip not as "giving up on merit," but as "acknowledging equality." Once merit is equal, the only fair way to distinguish is by chance. To insist on a non-arbitrary reason where none exists is to fabricate a difference that isn't there, which is itself a form of disrespect to the candidates.

  ### Summary
  The **Principle of Impartial Discharge** unifies your cases by distinguishing between **allocating goods** (where randomness is fair), **constituting relationships** (where randomness is objectifying), and **rescuing from harm** (where randomness is mandatory). It forces you to align your view on hiring with your view on triage: when claims are equal, fairness is found in the flip.
