prompt: |-
  I am a third-year undergraduate in philosophy and biology, and this term I am also working as a research assistant for the clinical ethics and coverage advisory committee at our university teaching hospital. The committee meets twice a month and reviews roughly half a dozen requests for interventions that sit near the line between treating a condition and enhancing a person: growth hormone for a child with idiopathic short stature, stimulant medication for a resident who wants to study for board exams, testosterone for age-related decline, and occasionally requests for elective procedures whose main appeal is competitive advantage. We have twenty minutes per case, the members are clinicians, a chaplain, an administrator, and one lay representative, and our recommendations go to the insurer and sometimes shape what the patient can access. What we lack is a defensible, repeatable procedure. I do not want an essay on the therapy/enhancement distinction, and I especially do not want a reading list; I want something the committee can actually run in the meeting, with the questions in order, what counts as a sufficient answer at each step, the points where the process stops with a no, and the points where it must hand the matter to a person because the remaining question is one of values rather than facts.

  My seminar has left me suspicious of any procedure that treats disease as a natural kind or normal function as a purely statistical fact. The distinction I want you to operationalize is between four modes of intervention: restoration, which returns someone to a functional level they previously had; compensation, which offsets a stable deficit relative to a reference class; augmentation, which raises capacity above the person's own prior baseline while remaining within what is typical for that reference class; and optimization, which raises capacity beyond the typical range or secures a positional advantage over others. I also want the procedure to confront two problems that our committee keeps hitting. The first is the counterfactual baseline problem: for many conditions we cannot know what the person's function would have been without the intervention, and for children we cannot know what they would have chosen. The second is the positional problem: some interventions help only or mainly because others do not have them, so their value depends on distribution. Please build the procedure around these ideas, but make it usable by people who have not read the theory. It should say explicitly which distinctions must survive the simplification and which can be dropped, and it should mark the places where the procedure will misfire.

  Then run the procedure on three requests and show your work. First, recombinant growth hormone for a ten-year-old with idiopathic short stature, predicted adult height below the first percentile, no identifiable pathology, and parents who are worried about social treatment. Second, modafinil for a healthy internal-medicine resident whose sleep is disrupted by night rotations and who wants it for board preparation; the resident says it would restore the focus that sleep loss has taken away. Third, deep brain stimulation for a patient with treatment-resistant depression who also hopes the device will leave them sharper and more productive than they were before the depression began. For at least one of these, I want the procedure to return an answer I will not like, and I want you to say why the procedure nevertheless commits us to it. End with a short section on what the procedure cannot decide, including any case where the committee should refuse to give a recommendation rather than pretend the procedure has settled it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Third-year undergrad (Philosophy & Biology), Research Assistant for a Clinical Ethics/Coverage Advisory Committee.
      *   **Context:** Committee meets twice a month, ~6 cases, 20 mins/case. Members: clinicians, chaplain, admin, lay rep. Recommendations affect insurance coverage/access.
      *   **Problem:** No defensible, repeatable procedure. Current debates get stuck on therapy/enhancement distinctions (which the user finds theoretically shaky).
      *   **Constraints:** No essays on theory, no reading lists. Needs a usable *tool* (questions in order, stopping points, hand-off points).
      *   **Theoretical Framework:** User wants to operationalize four modes: *Restoration, Compensation, Augmentation, Optimization*.
      *   **Specific Problems to Address:**
          1.  *Counterfactual Baseline Problem:* Don't know what function would have been (especially in kids).
          2.  *Positional Problem:* Value depends on distribution/others not having it.
      *   **Requirement:** Must be usable by non-theorists. Must state what simplifications are made and where it misfires.
      *   **Task:** Build the procedure, run it on three specific cases (GH for ISS, Modafinil for resident, DBS for depression + enhancement), ensure at least one outcome is "unlikable" but procedurally necessary.
      *   **Ending:** Section on what the procedure *cannot* decide (refusal to recommend).

  2.  **Deconstruct the Theoretical Framework for Practical Use:**
      *   *Restoration:* Back to *own* prior baseline. (Easy for adults with acute injury, hard for kids/chronic).
      *   *Compensation:* Offsetting a stable deficit relative to a *reference class* (e.g., peers, species-typical).
      *   *Augmentation:* Above *own* baseline, but within *reference class* typical range.
      *   *Optimization:* Beyond *reference class* typical range OR positional advantage.
      *   *The Twist:* The user is skeptical of "natural kinds." The procedure needs to rely on *evidence* and *consensus* rather than metaphysical truth about "disease."
      *   *Counterfactual Baseline:* Need a proxy for "prior baseline" in kids (e.g., genetic potential, mid-parental height, or statistical norm).
      *   *Positional:* Need a check on whether the benefit disappears if everyone has it.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* 20 minutes means ~3-4 minutes per step. Needs to be binary (Yes/No/Defer) where possible.
      *   *Structure:*
          1.  **Triage (Medical Necessity/Safety):** Quick filter. If unsafe or clearly standard care, move on.
          2.  **Baseline Determination:** Address the Counterfactual Problem. How do we define "normal" for *this* person?
          3.  **Mode Classification:** Map the intervention to Restoration, Compensation, Augmentation, or Optimization.
          4.  **Positional Check:** Address the Positional Problem.
          5.  **Decision Matrix:** Link Mode + Positional status to Coverage Recommendation.
      *   *Simplifications:* We can't know true potential. We must use statistical norms as a proxy for "species-typical function" despite the user's skepticism, because it's the only actionable metric in 20 mins.
      *   *Hand-off:* When values clash (e.g., fairness vs. autonomy), the committee votes, but the procedure flags it.

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1 (Eligibility):* Is it safe? Is there a diagnosed condition? (Stop if no).
      *   *Step 2 (The Baseline):* This is crucial. For kids, use statistical norms (percentiles). For adults, use self-report of prior function + clinical assessment. *Constraint:* Acknowledge we are using statistics as a proxy for "health."
      *   *Step 3 (The Mode):*
          *   Restoration: Return to pre-condition state.
          *   Compensation: Reach statistical norm despite permanent deficit.
          *   Augmentation: Exceed pre-condition state but stay within norm.
          *   Optimization: Exceed statistical norm.
      *   *Step 4 (Positionality):* Does this work *only* if others don't have it? (Zero-sum).
      *   *Step 5 (The Verdict):*
          *   Restoration/Compensation + Non-positional = **Cover.**
          *   Augmentation + Non-positional = **Defer/Case-by-Case** (Values).
          *   Optimization OR Positional = **Do Not Cover.**
      *   *Misfire Warning:* This procedure assumes "statistical norm" = "acceptable function." It will misfire on neurodiversity or where the norm is oppressive.

  5.  **Running the Cases:**

      *   **Case 1: GH for Idiopathic Short Stature (ISS).**
          *   *Baseline:* <1st percentile. No pathology.
          *   *Mode:* Is it Restoration? No, they never were tall. Compensation? Maybe, bringing to mean. Augmentation? If parents are short, tallness is augmentation. Optimization? If >97th percentile.
          *   *Positional:* Height is highly positional in social hierarchy.
          *   *Outcome:* Likely **No Cover.** Why? It falls into Optimization/Positional. It treats a statistical variant as a deficit.
          *   *Unlikable Outcome:* This is the one. It denies a child potential social benefit based on a rigid statistical line. I need to highlight why the procedure forces this (Positional + Optimization).

      *   **Case 2: Modafinil for Resident.**
          *   *Baseline:* Healthy, but sleep-disrupted. Wants to "restore" focus.
          *   *Mode:* Is sleep loss a "condition"? If not, it's Augmentation (above healthy baseline). If sleep loss is occupational hazard, maybe Compensation.
          *   *Positional:* Board exams are competitive. If everyone takes it, advantage vanishes.
          *   *Outcome:* **No Cover.** (Positional advantage in certification).
          *   *Nuance:* Safety risk (impairment vs. enhancement).

      *   **Case 3: DBS for Depression + Sharpness.**
          *   *Baseline:* Treatment-resistant depression (TRD).
          *   *Mode:* Restoration (of mood) is primary. "Sharper than before" is Augmentation/Optimization.
          *   *Positional:* Productivity is somewhat positional, but mental health is primarily intrinsic.
          *   *Outcome:* **Cover for Depression, Exclude for Enhancement.** Split decision.
          *   *Problem:* Can you separate the effects? If the device makes you sharp *by* fixing depression, it's Restoration. If it makes you sharp *beyond* pre-depression self, it's Optimization.
          *   *Decision:* Cover the indication (TRD), monitor the side effect. If "sharpness" is the *goal*, it's Optimization.

  6.  **Addressing the "Unlikable Outcome":**
      *   The GH case is the strongest candidate. Denying GH to a child <1st percentile feels cruel, but under this framework, it's "Optimization" (moving from 1st to 50th is huge gain) and "Positional" (height is relative). The procedure must bite this bullet to maintain consistency. I will select this one to explicitly critique.

  7.  **Addressing the "Cannot Decide" Section:**
      *   Cases where the Reference Class is disputed (e.g., is deafness a deficit?).
      *   Cases where the "Positional" impact is uncertain (empirical unknown).
      *   Cases where Autonomy trumps Distribution (e.g., private pay vs. insurance).

  8.  **Review against Constraints:**
      *   *No essay?* Keep intro brief.
      *   *No reading list?* Check.
      *   *Usable?* Use bolding, checkboxes, clear flow.
      *   *20 mins?* 5 steps, ~4 mins each.
      *   *Simplifications marked?* Yes, in the "Limitations" section of the protocol.
      *   *Misfires marked?* Yes.

  9.  **Final Polish:**
      *   Ensure tone is professional but direct.
      *   Make sure the distinction between Compensation and Augmentation is clear in the tool.
      *   Ensure the "Positional" test is rigorous.
      *   Check the DBS case: Ensure the distinction between treating the disease and the "side effect" of enhancement is clear.

  **(Self-Correction during drafting):** I initially thought about making GH a "Compensation" case. But the prompt defines Compensation as offsetting a deficit relative to a reference class. ISS is a statistical deficit, but without pathology, is it a "deficit" or just a variant? The prompt says "no identifiable pathology." This pushes it toward Optimization (moving from low stat to high stat). I need to make sure the procedure handles "statistical deviation without pathology" carefully. I will classify ISS as *Compensation* at best, but the *Positional* check will kill it. Actually, to make the "unlikable" outcome stronger, I should classify it as *Optimization* because moving from <1% to 50% is a massive shift in *capacity* relative to the self, even if it lands in the "normal" range. Wait, the definition says Augmentation is "within what is typical." So moving to the 50th percentile is Augmentation. Moving to the 99th is Optimization.
  *Correction:* The prompt defines Augmentation as "within what is typical for that reference class." So bringing a 1st percentile child to the 50th is Augmentation. Bringing them to the 90th is Optimization.
  *Refinement on GH:* Why would the procedure say No? Because of the *Positional Problem*. Height is inherently competitive. Also, the "Counterfactual Baseline" is unknown. We don't know if they *would* have been taller. So we treat it as Augmentation (improving on the current state) rather than Restoration. Augmentation + Positional = No Cover. This works.

  *Refinement on Modafinil:* Resident claims "Restoration" of focus lost to sleep. But sleep loss is not a pathology, it's a circumstance. So it's Augmentation relative to a healthy baseline. Plus, Board Exams are inherently positional. Double strike.

  *Refinement on DBS:* Primary indication is Restoration (TRD). Secondary hope is Optimization ("sharper than before"). Procedure should Cover the Restoration, flag the Optimization. If the Optimization is inseparable, does it void coverage? Usually, we cover the medical necessity. I will argue the procedure covers the *indication*, not the *outcome*, but flags the risk of drift.

  *Wait, I need one outcome I won't like.* The GH case is the most ethically fraught. Denying GH to a child who will be significantly disadvantaged socially feels wrong, but the procedure (Positional + No Pathology) demands it. I will emphasize this tension.

  *Final check on "Hand-off":* Where does the committee vote? When the Mode is Augmentation and Positional is Low. That's the "Values" zone.

