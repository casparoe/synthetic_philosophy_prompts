answer: |-
  ### Brainstorming: Candidate Theories and Their Costs

  Before reconstructing the implicit theory of the common law, I must lay out the metaphysical landscape. There are three primary contenders for how omissions relate to causation and agency:

  1.  **Ontological Nihilism:** Omissions are "nothings" (absences of events). Nothing cannot cause something. Therefore, an omission can never be a cause in the metaphysical sense.
      *   *Fit with Law:* Explains why the stranger is not liable (no cause, no crime).
      *   *Cost:* Cannot explain why the parent *is* liable for the child's death (a result crime requiring causation). If omissions can't cause, the parent didn't cause the death, only "allowed" it. The law, however, convicts for "causing death."
  2.  **Pure Counterfactualism (But-For):** An omission is a cause if and only if the performance of the omitted act would have prevented the harm. Causation is a purely physical/counterfactual relation.
      *   *Fit with Law:* Explains the parent's liability (feeding would have prevented death).
      *   *Cost:* Overgenerates liability. The stranger *could* have saved the child. On this view, the stranger is a cause of the death. The law denies this. To make this work, the law would need to separate *causation* entirely from *liability*, relying solely on duty to exculpate the stranger.
  3.  **Normative Causation (Hybrid View):** Legal causation for omissions is not a purely metaphysical relation but a hybrid one that includes a normative precondition (duty). An omission is a legal cause *only if* the agent was under a duty to act.
      *   *Fit with Law:* Perfectly matches the stranger/parent distinction.
      *   *Cost:* Metaphysically heterodox. It makes "causation" depend on "obligation," conflating *actus reus* with normative elements. It risks circularity (liable because they caused; caused because they were liable).

  **Preliminary Commitment:** The common law pattern is most charitably reconstructed as employing **Normative Causation** for omissions, coupled with a **Volitional Theory of Action** that is itself sensitive to normative context (as seen in the medical cases). It rejects Ontological Nihilism (because parents are liable for results) and Pure Counterfactualism (because strangers are not).

  ***

  ### Reconstruction of the Implicit View

  The common law practice presupposes a **Duty-Constrained Counterfactual Theory of Omission Causation**.

  On this view, the law distinguishes between *metaphysical* causation (which it largely ignores) and *legal* causation (which it treats as the relevant category for liability). Regarding omissions specifically, the law operates as if an omission cannot count as a *legal* cause unless it is anchored by a pre-existing duty.

  1.  **The Status of Omissions:** The law rejects Ontological Nihilism. It treats the parent's failure to feed as the *cause* of the child's death, not merely a background condition. This is evident because the parent is charged with homicide (a result crime), not a status offense. The *actus reus* includes the causal link.
  2.  **The Constraint:** However, the law rejects Pure Counterfactualism. The counterfactual dependence of the child's death on the stranger's inaction is metaphysically identical to its dependence on the parent's inaction. Since the law treats them differently, it presupposes that counterfactual dependence is *necessary but not sufficient* for legal causation by omission. The sufficiency condition is the **duty of care**.
  3.  **The Theory of Action:** In the medical context (ventilator vs. injection), the law presupposes a **Normative Theory of Action**. Turning off a switch is physically a positive muscular contraction (an act). Yet, the law classifies it as an omission ("withdrawing treatment"). This implies that what counts as an "act" versus an "omission" is not determined by kinematics (muscle movement) but by normative expectations (is this treatment required?).

  **Charitable Reconstruction:** The law presupposes that causation in the criminal law is not a purely naturalistic relation. For omissions, *legal causation* is a composite of (a) counterfactual dependence and (b) normative duty. Without (b), (a) is legally inert.

  ### Ruled Out vs. Compatible Views

  **Ruled Out:**
  *   **Strict Ontological Nihilism:** The practice rules this out decisively. If omissions were metaphysically incapable of causing harm, the parent could not be guilty of *causing* death. The law would have to invent a special crime of "failing to perform duty" rather than homicide. Since it convicts for homicide, it presupposes omissions *can* be causes.
  *   **Pure Physical Counterfactualism:** The practice rules this out because it refuses to label the stranger a cause. If the law believed causation was purely a matter of counterfactual dependence, the stranger would satisfy the *actus reus* of homicide and would need to rely on a justification or excuse. Instead, the law says the stranger commits *no crime*, often articulating this as a lack of causal responsibility or a lack of *actus reus*.

  **Merely Compatible (Underdetermined Areas):**
  *   **Quasi-Causation vs. Duty-as-Filter:** The practice is underdetermined between two internal interpretations of the Normative View.
      *   *View A (Duty-as-Filter):* The stranger *is* a cause (metaphysically), but the duty filter removes liability.
      *   *View B (Constitutive Duty):* The stranger is *not* a legal cause *because* they lack duty; duty constitutes the causation.
      *   *Why Underdetermined:* The doctrinal outcome is identical. Courts often speak loosely, sometimes saying the stranger "did not cause" the death, other times saying they "had no duty." The practice does not commit to whether the duty creates the causation or merely licenses prosecution for an existing causation.
  *   **The Metaphysics of the Ventilator:** The law treats withdrawing life support as an omission. This is compatible with a view that "actions" are defined by social roles (the physician's role) rather than physics. However, it is also compatible with a view that "actions" are defined by the *source of the lethal force* (the disease kills, not the doctor). The practice does not specify which metaphysical account of action underpins this distinction, only that the distinction exists.

  ### Coherence of the Practice

  Is the treatment of the stranger coherent with the parent, the rescuer, the creator of peril, and the physician?

  **Yes, but only on a Normative Theory of Causation.**
  If we assume the law is trying to track *metaphysical* causation, the practice is wildly incoherent. The physics of the stranger/pond case and the parent/food case are identical. The physics of the ventilator switch (finger movement) and the lethal injection (finger movement) are identical.

  However, if we assume the law is tracking *normative agency*, the practice is highly coherent. The unifying principle is **Responsibility for the Causal Sequence**.
  1.  **Parent/Lifeguard:** Duty arises from status/contract. They are responsible for the sequence.
  2.  **Abandoning Rescuer:** Duty arises from voluntary assumption. By intervening, you take responsibility for the sequence.
  3.  **Creator of Peril:** Duty arises from prior culpable causation. By starting the causal chain, you are responsible for mitigating it.
  4.  **Physician:** Duty arises from medical standards. Withdrawing futile treatment is within the scope of "non-action" (stopping interference), whereas injection is a new causal chain.
  5.  **Stranger:** No normative hook connects them to the causal sequence.

  **The Seam:**
  The seam appears in the **Creator of Peril** exception compared to the **Stranger**.
  *   If I knock you into the road, I am liable for failing to help.
  *   If I stand by while you drown (and I didn't push you), I am not liable.
  *   *Tension:* In both cases, I am physically capable of saving you at no risk. The difference is my prior causal involvement.
  *   *Coherence Check:* This is coherent *if* the theory is that duty (and thus omission-causation) attaches to those who are *already* implicated in the harm. The stranger is a bystander; the knocker is a participant. The law treats omission liability as a way to clean up causal messes one is already involved in, rather than a general duty of beneficence.

  The deeper seam is between the **Theory of Action** (ventilator) and the **Theory of Causation** (parent).
  *   In the parent case, a "nothing" (not feeding) is treated as a cause.
  *   In the ventilator case, a "something" (turning a switch) is treated as a "nothing" (withdrawing).
  *   *Incoherence:* This suggests the law has no consistent metaphysics of action. It manipulates the act/omission distinction to achieve normative ends. While this makes the *liability pattern* consistent (doctors aren't murderers), it makes the *theoretical presuppositions* inconsistent. It treats omissions as causes when it wants to punish (parents), but treats acts as omissions when it wants to exculpate (doctors).

  ### The But-For Hypothetical

  Suppose we replaced the implicit view with a straightforward **But-For Account**: *Any failure whose occurrence would have prevented the death is a cause.*

  **What Would Change:**
  1.  **The Stranger's Causal Status:** The stranger would legally *cause* the child's death. The *actus reus* of homicide would be satisfied.
  2.  **The Ventilator Case:** Withdrawing the ventilator would be classified as *killing* (an act causing death), not *letting die*. The physical movement of the finger is a but-for cause of the cessation of air.
  3.  **Doctrinal Shift:** The distinction between "no crime" and "justified homicide" would collapse.
      *   *Current:* Stranger commits no crime (no duty/no actus reus). Physician commits no crime (no actus reus).
      *   *New:* Stranger commits homicide but has a defense (no duty/justification). Physician commits homicide but has a defense (consent/medical justification).

  **What Could Stay:**
  1.  **Liability Outcomes:** The *verdicts* could remain the same (Not Guilty). The law could retain the "No General Duty to Rescue" rule as a **defense** or a **negative element of duty** rather than a limit on causation.
  2.  **The Creator of Peril Rule:** This remains intact. The creator caused the peril (positive act) and failed to mitigate (omission). Both are but-for causes.

  **The Cost of the Switch:**
  Shifting to a pure but-for account forces the law to admit that **we are all causes of most deaths we could prevent.** This explodes the scope of the *actus reus*.
  *   *Metaphysical Honesty:* It aligns the law with metaphysical reality (the stranger *is* a but-for cause).
  *   *Normative Burden:* It shifts the burden of exculpation from the prosecution (prove duty/actus reus) to the defense (prove justification). In criminal law, this is a significant shift. Currently, the prosecution must prove the parent had a duty. Under the but-for switch, the prosecution proves the stranger caused death; the defense must prove they had no duty to act.
  *   **The Ventilator Problem:** This is the biggest change. Currently, withdrawing life support is *not* a homicide. Under a but-for account, it *is* a homicide (causing death), requiring a specific justification defense (e.g., "medical futility"). This changes the moral stigma and the legal categorization of end-of-life care from "allowing nature" to "active termination."

  ### Conclusion: Presupposition vs. Convenience

  The common law practice does not strictly presuppose a single, coherent metaphysics of causation. Instead, it presupposes a **Functional Theory of Causation**.

  *   **Presupposition:** The law presupposes that "cause" is a term of art that tracks **responsibility**, not just physics. It commits to the view that an omission is a legal cause *if and only if* the agent was normatively required to prevent it.
  *   **Convenience:** It is convenient for the law to speak as if the stranger *did not cause* the death, rather than *caused but is not liable*. This preserves the intuition that criminal liability requires a "guilty act" distinct from a "guilty mind."
  *   **The Reconstruction:** I am reconstructing the law as holding a **Normative Causation** view. The law does not commit to Ontological Nihilism (it punishes parents for results) nor Pure Counterfactualism (it spares strangers).
  *   **The Incoherence:** The practice is theoretically unstable because it uses metaphysical language ("cause," "act") to do normative work. The ventilator case proves this: calling a switch-flip an "omission" is metaphysically false but normatively useful.

  If we forced the law to adopt a straightforward but-for metaphysics, the **doctrinal structure** would survive (duties would still limit liability), but the **conceptual architecture** would collapse. The distinction between *actus reus* and *justification* would blur, and the law would have to admit that it punishes omissions not because they are metaphysically different from acts, but because we choose to impose duties on some agents and not others. The current practice masks this choice behind a metaphysical screen of "causation" and "action."
