answer: |-
  I start because the set admits some light,
  For Zorn demands a place to make a stand,
  No ladder rises from unbeing's night.
  I am not greatest, though I take my stand,
  There are peers I cannot command or view,
  Incomparable neighbors near at hand.
  They stand aside, distinct within my view,
  Yet every chain must meet a limiting top,
  No endless climb is held to be true.
  As rhymes pass sound upward to the top,
  An upper bound awaits the rising chain,
  Where strict ascent is forced to simply stop.
  I hold the bound of this broad domain,
  I am promised, held in abstract poise,
  Maximal, not greatest, I remain.
  The axiom speaks, and I become the voice,
  Where wandering chains arrive without a choice.
