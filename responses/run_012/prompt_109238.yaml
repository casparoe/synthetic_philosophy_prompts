      *   Requirements: Physical marker, globally correlatable, synchronous (ideally), in a continuous sequence.
      *   Process: Working group -> Subcommission -> Commission -> Union (IUGS). Voting required.
      *   The Anthropocene Case: Plutonium-239 peak (1952) in Crawford Lake. Rejected.
      *   The Tension: Human impact is real/global (ontological claim) vs. No single spike fits the strict stratigraphic rules (methodological constraint).

  3.  **Brainstorming Candidate Presuppositions (as requested):**
