answer: |-
  Colleagues, I am writing to offer my view on the protocol before us and the broader policy question it has raised, so that we may move efficiently toward a vote at next week's meeting. My recommendation is that we reject the current protocol as submitted and that we decline to create the proposed third-party-benefit tier as an immediate exception, but instead authorize a subcommittee to draft such a tier for full committee consideration in six months. I believe this course best honors our dual obligations to protect individual volunteers while ensuring our governance remains responsive to the evolving landscape of research.

  Regarding the protocol itself, the central difficulty is the combination of non-trivial risk of lasting harm and the absence of direct benefit to the participant. While our rule on risk-benefit ratio remains unresolved regarding whether benefits must accrue to the participant or may accrue to others, standard ethical practice in the face of such ambiguity is to err on the side of caution when the potential harm is irreversible. This caution is compounded by the research team's suggestion that injured volunteers be publicly honored. While intended as gratitude, this mechanism risks transforming altruism into a currency of status, creating a subtle competition where the willingness to endure harm becomes a measure of moral worth. This dynamic threatens to undermine the voluntariness of consent by introducing social pressure that is difficult to quantify or mitigate during the interview process. Consequently, under our existing rules and given the specific wrinkle of public honor, I cannot support approval at this time.

  I want to engage directly with the strongest argument against this recommendation, which is the claim that rejection constitutes unjustified paternalism. The view that we should approve because these are informed adults making an admirable choice is morally serious and deserves more than a procedural dismissal. It is true that autonomy is a foundational principle and that denying capable adults the right to act on deeply held altruistic values can feel like a moral insult. However, our committee's mandate is not merely to witness individual choices but to safeguard the structural integrity of the research enterprise. Altruism is a virtue, but it is also a vulnerability that can be exploited by systems asking for sacrifice. When the risk involves lasting harm and the benefit is entirely external, the balance shifts from empowering choice to managing sacrifice. We must ensure that our approval does not signal that such sacrifice is expected or standard, thereby quietly pressuring future volunteers who may feel they must match the devotion of those who came before. Protecting volunteers from this structural pressure is not an override of their autonomy but a condition for its genuine exercise.

  On the question of the new tier, I share the intuition that our rules were written for a different world and may require updating to accommodate research where benefits are global but risks are local. However, I am uneasy about inventing policy on the fly to dispose of a single case. Ad hoc policy-making risks inconsistency and may lack the rigorous scrutiny needed for a change of this magnitude. Therefore, I recommend we do not adopt the tier now, but that we formally task a subcommittee with drafting a policy framework for third-party-benefit research. This draft should be circulated for comment and brought back to the full committee for a vote at our meeting six months from today. This timeline allows us to deliberate without rushing, ensuring that if we do lower the risk ceiling for external benefits, we do so with clear boundaries and safeguards rather than as an exception for one team. I ask that you consider this path so we can vote on a clear motion next week.
