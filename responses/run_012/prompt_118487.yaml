answer: |-
  **Verdict**
  Your friend's summary is remarkably robust on the textual basics but projects modern economic anxieties onto ancient ethical concerns. It is safe to use for character motivation, provided you distinguish between Aristotle's ontology of "unnaturalness" and later moralizing about "exploitation." The envelope notes are a reliable map of the *Politics*, though the *Ethics* interpretation is slightly anachronistic.

  **Claim by claim**
  1.  **Money by convention:** **Accurate.** In *Politics* I.9, Aristotle explicitly states money exists by law (*nomos*) rather than nature, grounding his suspicion of its artificiality.
  2.  **Household vs. Wealth-getting:** **Accurate.** The distinction between *oikonomia* (supplying needs) and *chrematistike* (unlimited accumulation) is the structural backbone of *Politics* Book I.
  3.  **Shoe example:** **Accurate.** He uses the shoe to distinguish proper use (wearing) from improper exchange, arguing trade for profit perverts the object's purpose.
  4.  **Usury as money begetting money:** **Accurate.** This is his famous condemnation in *Politics* I.10, where he labels interest the "most hated sort" because currency breeds currency.
  5.  **Objection is exploitation:** **Half-right.** Aristotle calls it unnatural and unjust, but "exploitation" implies a labor theory of value he doesn't possess; he fears moral corruption of the citizenry more than individual economic extraction.
  6.  **Stuck on demand:** **Half-right.** He identifies *need* (*chreia*) as the binding force making goods commensurable, which functions like demand, but he lacks modern market mechanics to formalize it as a price-setting mechanism.

  **The real Aristotle**
  The crucial divergence lies between "unnatural" and "exploitative." Your friend frames Aristotle as a proto-Marxist concerned with unfair extraction. In reality, Aristotle's objection is ontological. Money is metal; metal cannot breed. To claim it does is a category error, a violation of the natural order, akin to a shoe walking itself. This matters for your pawnbroker because arguing against "unnaturalness" requires different rhetoric than arguing against "unfairness." If she argues she isn't exploiting, she misses Aristotle's point; she must argue her trade serves *oikonomia* (household stability) rather than infinite *chrematistike*. The preacher will attack the sterility of money; she must defend the vitality of the community it supports.

  Regarding value, your friend claims Aristotle lacks "demand." He actually posits *chreia* (need) as the universal standard that makes things commensurable in *Nicomachean Ethics* Book V. Money is merely the representative of this need. Scholars debate whether Aristotle is describing the historical origin of money or justifying its logical function. It's not necessarily a "fudge"; it's a recognition that value is relational, not intrinsic. The "error" here is assuming Aristotle wants to solve economics; he wants to solve ethics. He isn't confused about value; he refuses to separate value from human need. For Aristotle, a house and a bed are commensurable only because humans need both. Your friend's claim that he lacks "demand" is anachronistic; he has "need," which is the moral precursor to demand.

  Scholarly disagreement exists on whether Aristotle condemns *all* trade or only excessive profit-seeking. Moses Finley argued Aristotle was anti-market, but later scholars like Edward Cohen suggest he accepts trade if it satisfies household needs. This nuance is vital: if your pawnbroker lends to keep a household afloat (need), she is closer to *oikonomia* than if she lends for speculative investment. The friend's summary treats Aristotle's view as monolithic, but the text allows for a distinction between necessary exchange and greed. For a novelist, this is gold: the pawnbroker can argue she facilitates necessary exchange, positioning herself as a servant of need rather than a master of profit. This aligns with the 1620s shift where usury was increasingly tolerated if it aided commerce rather than consuming the poor. She can claim her interest is a wage for her service of sustaining need, not the breeding of sterile coin. This reframes the debate from metaphysics to social utility, which is where a 17th-century woman might actually win. Furthermore, Aristotle's critique hinges on the concept of "limit." In *Politics* I.9, he argues natural wealth-getting has a limit (the needs of the house), while unnatural has none. The pawnbroker can argue her interest is capped by the borrower's ability to pay, restoring the "limit." Also, exchange holds the city together via civic friendship. Usury threatens this. She can argue she preserves friendship by preventing destitution, turning the preacher's moral framework against him. By framing her interest as a fee for risk or labor (storage), she sidesteps the "breeding" charge entirely. Aristotle admits labor deserves reward. If she defines her income as payment for the *service* of safekeeping and liquidity, rather than the *use* of the money itself, she aligns with the later scholastic distinction of *lucrum cessans* (profit ceased), even if Aristotle didn't use that term. This allows her to be Aristotelian without accepting his conclusion.

  **The lineage bit**
  The descent story is historically sound, not just simplification. Aquinas explicitly adopts Aristotle's sterility argument in the *Summa Theologica*, cementing the Church's ban for centuries. Marx, in *Capital*, praises Aristotle for spotting the value-form problem, even if he thinks Aristotle couldn't solve it due to historical limitations (slavery). So, your friend is right about the lineage, even if the "exploitation" label is more Marx than Aristotle. The theological ban relied on Aristotle's physics; the Marxist critique relied on Aristotle's ethics. Your pawnbroker is standing at the crossroads where these two interpretations begin to separate.

  **Lines for my pawnbroker**
  She should argue that her lending sustains the *oikos* (household), preventing ruin, thus serving natural need rather than unnatural greed. She can claim money is a tool of measure (*Ethics*), and she provides the service of maintaining that measure in hard times. Warning: Avoid "exploitation" or "labor value" language; a 1620s character wouldn't speak of surplus value. Also, avoid claiming interest is "natural"; Aristotle says it isn't. Instead, argue that her fee is for *service* (storage/risk), not the breeding of money itself. She must sound like a steward, not a capitalist.
