answer: |-
  You are hitting a wall because the law is not a single theory; it is a historical sediment of three competing moral frameworks that are often in tension. To understand the pattern, you have to stop looking for consistency and start looking for the specific *boundaries* each framework draws.

  The current US legal landscape presupposes a hybrid view I will call **Liberal Paternalism with Dignity Constraints.** It is not purely consequentialist, nor purely deontological. It operates on a specific taxonomy of "what is being sold."

  Here is the reconstruction of the view the rules actually presuppose, the required commitments, and the contradictions.

  ### 1. The Theory of Price Gouging: Duress, Not Intrinsic Value
  **The Rule:** You can charge what you want for water in normal times, but not after a hurricane.
  **The Presupposition:** This does **not** assume prices have intrinsic moral fairness. It assumes that **markets require exit options to be legitimate.**

  *   **The Logic:** In contract theory, a valid agreement requires voluntary consent. The law presupposes that a hurricane creates a temporary monopoly/duress situation. If you are trapped without water, you are not "choosing" to pay $50 for a bottle; you are acting under coercion by nature. The seller is effectively leveraging a temporary monopoly on survival.
  *   **Required Commitment:** The law commits to the idea that *deservation negates agency.* It does not commit to the idea that water has a "just price."
  *   **Rival Theory Compatibility:** A pure libertarian theory rejects this (desperation is just high demand). A pure egalitarian theory accepts this but would go further (price controls always).
  *   **The Consequentialist Swap:** A plain consequentialist would allow the price spike. High prices signal scarcity and attract supply (generators/water trucks) from outside the zone faster than price caps do. The consequentialist would then tax the windfall profits to compensate the victims, rather than banning the price increase.

  ### 2. The Theory of the Body: Labor vs. Property
  **The Rule:** You can sell plasma/surrogacy (labor/service), but not kidneys/babies (property/persons).
  **The Presupposition:** This rests on a **Legal Fiction of Separability.** The law distinguishes between *renting the function of the body* and *selling the constituent parts of the person.*

  *   **The Asymmetry Explained:**
      *   **Surrogacy:** You are paying for the *service of gestation*. The contract is for labor and risk. The baby is never the "property" of the surrogate to sell; she is providing a service to the genetic parents (or intended parents). The law treats the womb as a tool, not the child as a product.
      *   **Plasma/Sperm:** These are treated as "renewable resources" generated by labor. You are paid for the *time and extraction process*, not the biological material itself (legally speaking).
      *   **Kidneys:** This is treated as *mutilation* or *alienation of self.* Once removed, it does not regenerate. Selling it treats the body as a warehouse of spare parts, which violates the **Dignity Constraint** (Kantianism: treat humanity as an end, not a means).
      *   **Babies:** A baby is a "person," not a "thing." You cannot sell a person (13th Amendment). You can only pay for the *process* of creating/delivering one.
      *   **Art:** A painting is external property. It has no dignity rights. Its price reflects subjective value, not human worth.

  *   **Required Commitment:** The law commits to the view that **persons cannot be property, but labor can.** It requires a bright line between "renewable/external" and "constitutive/internal."
  *   **The Consequentialist Swap:** A consequentialist would ignore the labor/property distinction. If paying for kidneys saves 5,000 lives a year and the risk to donors is managed, the ban is immoral. The distinction between "selling a kidney" and "selling plasma" is biologically flimsy (both involve intrusion, risk, and bodily material); a consequentialist would regulate both based on net health outcomes, not moral categories.

  ### 3. The "Gift vs. Market" Norm (The Crowding Out Theory)
  **The Rule:** You can give a kidney, but not sell one.
  **The Presupposition:** This assumes **Motivational Crowding Out.**
  The law presupposes that introducing money into certain spheres destroys the social good that exists without it. If kidneys are for sale, altruistic donation might drop (people wait for payment), or the supply will come disproportionately from the desperate (exploitation).

  *   **Required Commitment:** This requires the belief that *market norms displace moral norms.*
  *   **Rival Theory Compatibility:** A standard economic theory assumes markets *add* to supply, not subtract. This rule is incompatible with standard supply/demand logic unless you accept the sociological premise that money "corrupts" the specific good.
  *   **The Consequentialist Swap:** If the goal is maximizing kidneys, a consequentialist would test both systems. If a regulated market produces more transplants with acceptable safety, the "gift only" rule is discarded. The current rule prioritizes the *purity of the donation* over the *quantity of organs*, which is non-consequentialist.

  ### 4. The Internal Contradictions (What Can't Be True at Once)
  Your reading group is stuck because these rules rest on assumptions that cannot all be true simultaneously. Here are the three main fractures:

  **A. The Autonomy Contradiction**
  *   **Assumption 1:** Women have full bodily autonomy to rent their wombs (surrogacy) and sell their plasma/eggs.
  *   **Assumption 2:** Adults do not have the autonomy to sell their kidneys.
  *   **The Conflict:** If the justification for banning kidney sales is "protection from exploitation," why is surrogacy (which carries higher medical risk and deeper emotional entanglement) legal? If the justification is "bodily integrity," why is plasma legal?
  *   **Resolution:** The law resolves this inconsistently. It relies on a vague intuition that kidneys are "essential to life" while wombs are "essential to livelihood." This is a biological distinction without a robust moral difference.

  **B. The "Renewable" Fiction**
  *   **Assumption:** Plasma and eggs are "renewable," kidneys are not.
  *   **The Conflict:** Plasma donation requires recovery time and depletes the body. Eggs require invasive hormonal stimulation with real health risks. The distinction is legally convenient but medically porous.
  *   **What it reveals:** The law is not actually tracking medical risk. It is tracking **disgust and social meaning.** We are comfortable with "fluids" (plasma, sperm) but uncomfortable with "organs" (kidneys, hearts). The theory presupposes a hierarchy of bodily materials that has no basis in physiology.

  **C. The Gouging vs. Market Efficiency Contradiction**
  *   **Assumption 1:** In the housing/art market, price spikes are efficient signals of value/scarcity.
  *   **Assumption 2:** In the emergency goods market, price spikes are predatory exploitation.
  *   **The Conflict:** Both are supply shocks. If you believe prices allocate resources efficiently (Assumption 1), you must accept that gouging brings more generators to the hurricane zone (Assumption 2 is false). If you believe gouging is immoral because it exploits need (Assumption 2), you should logically support rent control during housing shortages (Assumption 1 is false).
  *   **What it reveals:** The law presupposes that **necessities have a moral price cap, luxuries do not.** But "necessity" is subjective. Is a kidney a necessity? Yes. Is it illegal to sell? Yes. Is water a necessity? Yes. Is it illegal to profiteer? Yes. Is housing a necessity? Yes. Is it illegal to profiteer (in many markets)? No. The theory breaks down on what counts as a "protected necessity."

  ### Summary for your Group
  To get past the wall, propose that the current system is not trying to be logically consistent. It is trying to manage **three competing risks:**

  1.  **Risk of Coercion:** (Gouging laws, Kidney ban). Protecting the desperate from having no choice.
  2.  **Risk of Corruption:** (Kidney ban, Baby ban). Protecting the social meaning of human life from becoming "merchandise."
  3.  **Risk of Shortage:** (Plasma, Surrogacy, Clinical Trials). Allowing payment where the "corruption" risk is deemed lower than the "supply" benefit.

  **The Fatal Flaw:** The system lacks a consistent metric for deciding when Risk 2 (Corruption) outweighs Risk 3 (Shortage).
  *   **Kidneys:** Corruption risk > Shortage risk (so ban sales).
  *   **Plasma:** Shortage risk > Corruption risk (so allow sales).
  *   **Surrogacy:** Shortage risk > Corruption risk (so allow labor payment).

  **The Consequentialist Critique:** A plain consequentialist would argue we are getting the calculus wrong on Kidneys. We are prioritizing the "moral purity" of the donor over the life of the recipient.
  **The Deontological Critique:** A Kantian would argue we are getting the calculus wrong on Surrogacy/Plasma. We are allowing the commodification of the person where we shouldn't.

  **The Verdict:** The rules presuppose that **human dignity is a boundary condition on market efficiency, but that boundary is drawn by cultural intuition rather than philosophical principle.** That is why plasma is ok (cultural intuition: fluids are waste/byproduct) but kidneys are not (cultural intuition: organs are self). The law codifies our disgust, not our logic.
