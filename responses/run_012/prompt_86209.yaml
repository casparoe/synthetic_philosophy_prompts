  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the gouging question specifically? (Intrinsic fairness vs. bargaining). *Correction:* Make sure to specify it's mostly about bargaining power/duress, not intrinsic value of water.
      *   *Check:* Did I address the art example? *Correction:* Art is external property, not embodied. That's the key distinction.
      *   *Check:* Is the distinction between "selling a baby" and "paying for surrogacy" clear? *Correction:* Emphasize the "service contract" vs. "sales contract" legal distinction.

  6.  **Final Polish:** Organize into clear headers. Ensure the "Consequentialist Swap" is distinct. Make the "Contradictions" section punchy. (This aligns with the user's request for "what bits are strictly required" and "which ones can't be true at once").

  7.  *(Final thought)*: The user wants to know what theory the *rules* presuppose, not what theory *should* govern them. So I need to reverse-engineer the current US legal/moral landscape. It's a hybrid of Liberalism (contract freedom) + Paternalism (protection from harm) + Kantianism (human dignity).

  8.  *Structure:*
      1.  The Core Framework (The "Patchwork").
      2.  The Gouging Logic (Duress vs. Fairness).
      3.  The Body Logic (Labor vs. Property).
      4.  The Consequentialist Counterfactual.
      5.  The Internal Contradictions.

