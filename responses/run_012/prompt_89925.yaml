answer: |-
  This is a sharp, provocative draft. It sets the stakes clearly and moves quickly to the tension. Here is my assessment against your three worries, followed by brief stylistic notes.

  **(a) Does the central argument go through?**
  Broadly, yes, but you risk conflating metaphysics with epistemology. You write that the reference class is "fixed by which decision procedure I'm running", but then claim adopting one is "itself a choice". Proponents of evidential cooperation will argue you do not *choose* your reference class; your algorithm *determines* it. The circularity you identify is real (often called the problem of logical updatelessness), but framing it as a stipulative choice makes your objection easier to dodge. To strengthen this, emphasise that the agent cannot *know* the reference class without already having decided, which blocks the calculation required to decide.

  **(b) Does causal anchoring collapse into causal decision theory?**
  Plainly: yes. You are right to suspect this. Evidential decision theory gains its traction in these cases precisely by leveraging correlations that lack a *causal* mechanism in the traditional sense (often logical or mathematical correlations). By demanding a common cause in the "actual causal past", you exclude the very correlations that generate the astronomical value. If the common cause is settled history, Reichenbach's screening off applies: conditioning on the cause renders your act probabilistically irrelevant to theirs. Your phrase "polite way of reinstating causal decision theory" is accurate. You haven't found a fix; you've found the boundary where evidential reasoning surrenders to causal reasoning.

  **(c) Is the reference-class point just ordinary self-reference?**
  It is not merely ordinary self-reference. Ordinary self-reference (e.g., "I am choosing now") is handled by standard decision theory. The problem here is that the *payoff magnitude* depends on a categorisation that isn't empirically settled in the way physical facts are. However, your claim that "there will usually be several" fixed points needs defence. Some argue there is a single correct logical reference class (all agents running identical code). Your argument holds only if multiple, incompatible reference classes are equally defensible. You should tighten this to avoid sounding like you're dismissing the logical view too quickly.

  **Padding and Style**
  *   "land on me as surely as if we had shaken hands": This is rhetorical fluff. Cut it. The point stands without the metaphor.
  *   "I find it compelling": Unnecessary. Your analysis carries more weight if you remain neutral.
  *   "ugly ones, where the reference class is 'agents who will punish anyone like me'": This is vivid and useful. Keep it.
  *   British English check: Ensure you use 'realise', 'programme', and 'analyse' if those terms arise in revision. Your draft is already consistent.

  **Verdict**
  The argument stands up, particularly the collapse of causal anchoring. Tighten the reference-class section to avoid the "choice" confusion, and you will have a solid foundation for the session. Do not worry about being too harsh; the text invites scrutiny.
