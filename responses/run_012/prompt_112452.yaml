      *   **Key Points to Cover:**
          1.  Fixed capacity vs. variable capacity (swimmers can work/contribute).
          2.  Cliff vs. Slope (binary outcome vs. gradual degradation).
          3.  Provenance of seats (how did people get in the boat? historical responsibility).
          4.  Decision-making authority (who decides and by what right?).
          5.  Flip the scenario: Rising water/shrinking capacity, swimmers are future passengers (climate change angle).
          6.  Concrete case study at the end (aid, immigration, or climate) with specific reasoning (no web access needed).
      *   **Tone:** Not necessarily academic, but reasoned.
      *   **Length:** 1200-1800 words.

  2.  **Determine the Verdict:**
      *   The prompt asks whether the framing is fair or if it does the work before the argument starts.
      *   Given the constraints (variable capacity, slope vs. cliff, historical context, decision authority), the lifeboat metaphor is fundamentally flawed because it assumes static conditions and absolves historical responsibility.
      *   *Verdict:* The framing is rigged. It is a rhetorical trick designed to justify inaction by presenting a false dilemma.

  3.  **Outline the Essay:**
      *   **Introduction:** Describe the lifeboat image. State the thesis: The metaphor is not a neutral tool for reasoning but a loaded device that predetermines the outcome by falsifying reality. Verdict: It is unethical to use this frame for policy.
      *   **Point 1: Capacity (Fixed vs. Variable).** The metaphor assumes passengers are dead weight. In reality, humans are agents. They can bail water, row, navigate. Excluding them reduces potential capacity.
      *   **Point 2: Cliff vs. Slope.** The metaphor assumes a hard limit (50 vs. 51). Reality is a gradient. Overloading causes discomfort or reduced speed, not immediate sinking. This changes the moral calculus from triage to risk management.
      *   **Point 3: Provenance of Seats.** How did the boat get full? Did they sink others? Are they pumping water out that others are treading in? Ignoring history sanitizes the situation.
      *   **Point 4: Decision Authority.** Who holds the oars? By what right do they decide? Unchecked power leads to self-preservation bias disguised as prudence.
      *   **Point 5: The Flip (Climate Change).** Rising water, shrinking boat. The swimmers are the future passengers. The people in the boat caused the water to rise. The metaphor collapses entirely here.
      *   **Conclusion/Concrete Case:** Apply to Climate Change/Immigration. Show how the lifeboat ethic fails in practice compared to a "crew" ethic. Reiterate verdict.

  4.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro:* Start with the image. Hardin's lifeboat ethics. It's seductive because it's simple. But simplicity is the trap. Thesis: The metaphor is a rig.
      *   *Capacity:* Focus on agency. A person in water isn't just mass; they are potential labor. If you pull them in, they bail. The boat holds more if everyone works. The metaphor treats people as cargo, not crew.
      *   *Cliff vs. Slope:* Real systems degrade gracefully. A boat doesn't snap at 51. It sits lower. Risk increases incrementally. This allows for negotiation, not just binary reject/accept.
      *   *Provenance:* This is crucial. If the passengers hacked holes in other boats to get space, their claim to safety is weak. If the water is high because they dumped waste, they are liable. The metaphor isolates the moment from the timeline.
      *   *Authority:* Who decides? The passengers? They have a conflict of interest. A neutral arbiter is needed, but the metaphor assumes the passengers are the judges. This is might makes right.
      *   *The Flip:* Climate change. The boat is shrinking (sea level rise, resource scarcity). The swimmers are the next generation or the Global South. The passengers (Global North) caused the warming. The lifeboat ethic here is suicide because the water rises regardless of who is in the boat.
      *   *Concrete Case:* Climate Migration/Justice. Use the logic developed. If we treat climate refugees as swimmers to be rejected, we ignore that we heated the water. We need a framework of repair, not exclusion.
      *   *Conclusion:* Final verdict. The lifeboat ethic is a moral hazard.

  5.  **Refining and Checking Constraints:**
      *   *Word Count:* Need to ensure I expand enough on each point to hit 1200-1800. I need to elaborate on the implications of each flaw.
      *   *Verdict:* Must be clear. "The framing is dishonest."
