      *   *Expansion:* When discussing capacity, talk about the economic concept of labor vs. consumption. When discussing the cliff, talk about risk distribution. When discussing provenance, talk about colonialism or industrialization implicitly.
      *   *The Flip:* This is the climate section essentially. Make sure it connects back to the "swimmers are future passengers" prompt requirement.

  8.  **Final Review:**
