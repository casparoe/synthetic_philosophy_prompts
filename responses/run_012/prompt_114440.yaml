      *   **Thesis:** "Waking Receipt Account" (WRA). Dreams aren't experiences *during* sleep. Sleep mentation happens, but no phenomenal experience is stored. Dream reports are waking constructions (receipts) for non-phenomenal transactions.
      *   **Influences:** Norman Malcolm (dreams aren't experiences), Daniel Dennett (cassette theory), but pushing further (report *constitutes* the dream).
      *   **Audience:** Specific mix (2 Ordinary-Language Philosophers, 1 Predictive-Processing/Active-Inference Theorist, 1 Phenomenologist, 1 Sleep Scientist).
      *   **Supervisor:** Ordinary-language type (thinks student is too concessive to science).
      *   **Sleep Lab:** Thinks student is doing armchair nonsense.
