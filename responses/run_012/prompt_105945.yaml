answer: |-
  This specification is designed for an operator with black-box access to weights and activations, equipped with standard interpretability tools (linear probes, sparse autoencoders, causal interventions). It treats "representation" as a functional-structural hybrid claim: the state must *carry* content and *use* that content to drive behavior.

  ### The Specification: Desiderata for Neural Representation

  #### 1. Causal Non-Redundancy (Non-Negotiable)
  **Requirement:** Intervening on the candidate representation (zeroing, patching, or shifting) must alter the network's output behavior regarding property $P$ in a predictable way, and this effect must not be fully recoverable by compensating adjustments elsewhere in the network.
  **Consideration:** Distinguishes *representing* $P$ from merely *correlating* with $P$. Handles the case of a state that is decodable but unused (epiphenomenal).
  **Operationalization:** Causal mediation analysis or activation patching. If you ablate the feature and loss on $P$-tasks does not rise (or can be instantly restored by a linear readout from remaining layers), it is not a representation; it is a shadow.

  #### 2. Basis Invariance (Non-Negotiable)
  **Requirement:** The claim that "property $P$ is represented" must hold under orthogonal transformations of the activation space that preserve network function. The representation must be identifiable as a subspace or a manifold, not a specific set of neuron indices.
  **Consideration:** Handles the rotation/permutation cases. Neural nets are overparameterized; a claim tied to specific neuron indices is a claim about the *implementation*, not the *representation*.
  **Operationalization:** If you rotate the residual stream and retrain the unembedding (or find an equivalent rotation), the geometric relationship between the candidate feature and the output logic must remain identifiable.

  #### 3. Content-Cause Alignment (Non-Negotiable)
  **Requirement:** The direction of the causal effect must match the semantic content. If the state represents "dog," intervening to increase its magnitude should increase "dog" probability, not decrease it or increase "cat" probability (unless the logic is explicitly negational, which must be separately verified).
  **Consideration:** Distinguishes *content* from *causal role*. A state could causally drive "dog" outputs while encoding "not-cat." This criterion demands the sign and magnitude of intervention align with the claimed semantics.
  **Operationalization:** Interventional slope analysis. Plot intervention strength vs. output logit probability. The slope must match the claimed polarity.

  #### 4. Probe Robustness (Non-Negotiable)
  **Requirement:** The information must be decodable by a probe class constrained by the network's own downstream readout capacity. If the downstream head is linear, a linear probe must suffice. If a high-capacity probe (MLP) is required to find $P$ where the network uses a linear readout, $P$ is not represented *for the network*.
  **Consideration:** Prevents "probe artifacts." A sufficiently complex probe can find information that the network itself cannot access or use.
  **Operationalization:** Match probe capacity to the known capacity of the layer's consumer (e.g., the attention output projection or unembedding).

  #### 5. Functional Specificity (Non-Negotiable)
  **Requirement:** The candidate representation must not be equally causal for unrelated properties $Q$ and $R$. If a single direction drives "sentiment," "topic," and "language," it is a control signal or a polysemantic bottleneck, not a representation of any single property.
  **Consideration:** Handles the polysemantic direction case. A representation must have a specific semantic grain.
  **Operationalization:** Multivariate intervention. Intervene on the feature and measure effect size across a diverse set of output dimensions. High variance in effect size is required.

  #### 6. Structural Isomorphism (Camp Commitment: Structuralists)
  **Requirement:** The internal relationships between representations must mirror the relationships between the properties they represent. If $A$ and $B$ are semantically similar, their representational vectors must be closer than $A$ and $C$.
  **Consideration:** Handles the algorithmic ground-truth and physical simulation cases. This is stronger than mere causal efficacy; it demands the *format* of the representation matches the *structure* of the territory.
  **Operationalization:** Representational Similarity Analysis (RSA) comparing the network's distance matrix to the ground-truth property distance matrix.

  #### 7. Task Relevance / Teleological Fit (Camp Commitment: Teleosemantics)
  **Requirement:** The representation must have been selected for (or fine-tunable for) the task involving $P$. A variable that arises as a side-effect of distillation but plays no role in the student's loss landscape is not a representation of $P$, even if it correlates.
  **Consideration:** Handles the distillation/student network case. Distinguishes inherited artifacts from functional tools.
  **Operationalization:** Pruning or fine-tuning test. If you can remove the feature without impacting the loss on the actual training objective, it fails this criterion.

  ---

  ### Handling Your Specific Cases

  | Case | Verdict | Failing Criterion |
  | :--- | :--- | :--- |
  | **Single direction decodable for unrelated properties** | Not a representation of either. | **Functional Specificity.** It is a conflated control signal. |
  | **Decodable but ablation shows no use** | Epiphenomenon / Shadow. | **Causal Non-Redundancy.** Information $\neq$ Representation. |
  | **Used but no probe decodes it** | Representation in non-linear format. | **Probe Robustness** (if probe class is too weak). If *no* probe finds it, it may be distributed beyond recovery. |
  | **State modulates confidence only** | Representation of *uncertainty*, not content $P$. | **Content-Cause Alignment.** The content is "variance," not the mean value. |
  | **Student network variable never needed** | Artifact / Ghost. | **Task Relevance.** It is a scar from the teacher, not a tool for the student. |
  | **Network simulates physical system** | Strong Representation. | Passes **Structural Isomorphism** + **Causal Non-Redundancy**. |
  | **Identical behavior, different internals (rotation)** | Representation exists in both, but basis differs. | **Basis Invariance** ensures you identify the *subspace*, not the neurons. |

  ---

  ### Tensions and Incompatibilities

  1.  **Causal Non-Redundancy vs. Distributed Representation:**
      *   *Tension:* If a representation is highly distributed (redundant), ablating any single part does nothing.
      *   *Resolution:* You must intervene on the *subspace*, not individual neurons. This makes the spec harder to apply but not impossible. If you cannot find a subspace whose collective ablation breaks performance, the representation claim is weak.

  2.  **Structural Isomorphism vs. Black Box:**
      *   *Tension:* You cannot verify isomorphism without ground truth (the "algorithm we can read" case). In most real-world cases, you don't have the ground truth structure.
      *   *Resolution:* This marks Isomorphism as a **Camp Commitment**. You can claim representation without it, but you cannot claim *faithful simulation*.

  3.  **Basis Invariance vs. Sparsity (SAEs):**
      *   *Tension:* Sparse Autoencoders (SAEs) impose a specific basis (the feature dictionary). If the "true" representation is dense and rotated, SAEs might fragment it into many features or miss it.
      *   *Resolution:* SAE features must be tested for **Causal Non-Redundancy** individually. If they are redundant, the dictionary is a compression artifact, not an ontological map.

  ### The "Killer" Criterion

  **Causal Non-Redundancy combined with Functional Specificity.**

  This conjunction excludes the most candidates.
  *   **Probing papers** die on Causal Non-Redundancy (they show correlation, not usage).
  *   **Many SAE papers** die on Functional Specificity (features are often polysemantic or causally redundant).
  *   **Naive Neuron Interpretability** dies on Basis Invariance (neurons are not basis-invariant).

  Most current literature demonstrates *one* of these. Demonstrating that a specific semantic content is *uniquely* carried by a specific subspace that is *causally necessary* for the corresponding behavior is exceptionally rare.

  ### Scorecard: Where the Families Stand

  **1. Probing as Ground Truth**
  *   **Status:** **Failed.**
  *   **Reason:** Violates **Causal Non-Redundancy** and **Probe Robustness**. A probe finds information availability, not representation usage. It trivially makes "representation" true for any property with non-zero mutual information with the activations.

  **2. Dictionary / Sparse-Coding (SAEs)**
  *   **Status:** **Promising but Unproven.**
  *   **Reason:** Addresses **Functional Specificity** (aiming for monosemanticity) and **Basis Invariance** (by learning a new basis). However, most SAE features fail **Causal Non-Redundancy** (many are redundant or causally inert). They provide candidate *vehicles*, but not proof of *representation*.

  **3. Interventionist Accounts (Causal Mediation)**
  *   **Status:** **Necessary but Insufficient.**
  *   **Reason:** Satisfies **Causal Non-Redundancy**. However, without **Content-Cause Alignment** or **Structural Isomorphism**, an intervention shows a "control knob," not necessarily a "symbol." You can break the network without finding the representation.

  **4. Eliminativism ("No Representations")**
  *   **Status:** **Safe but Useless.**
  *   **Reason:** Avoids all criteria by denying the premise. Consistent with **Basis Invariance** (nothing is invariant), but fails your operational goal. It offers no method to distinguish a network that "knows" $P$ from one that merely outputs $P$.

  ### Summary Recommendation

  To decide if a claimed internal representation is real in your black box:
  1.  **Demand Causality:** Do not accept a probe accuracy plot. Require an ablation/patching experiment showing that removing the feature degrades performance on $P$ specifically.
  2.  **Demand Specificity:** Require that removing the feature does *not* degrade performance on unrelated $Q$.
  3.  **Demand Invariance:** Ensure the feature is defined by a subspace or geometric property, not "Neuron 452."

  If a paper cannot clear these three non-negotiable hurdles, treat the claim "the network represents $P$" as a metaphor, not a mechanism.
