      *   *The Problem:* If *li* is supposed to produce order/harmony, why did it produce cruelty here? Is the experimenter's script *li*?
      *   *Xunzi's Defense:* Not all authority is *li*. *Li* is specifically that which aligns with the Dao and creates long-term social harmony. The Milgram setup is a *pseudo-ritual*. It mimics the form of authority but lacks the moral substance (*yi*). Xunzi emphasizes the role of the *teacher/sage* in guiding ritual. Without a sage, ritual becomes empty form.
      *   *Refinement:* Xunzi would argue the subjects failed because they lacked true understanding of *yi* (rightness) to judge the ritual. They followed the *form* without the *substance*. But this weakens his claim that external scaffolding *alone* solves motivation. It suggests internal cultivation is still needed to distinguish good scaffolding from bad.

  3.  **Deconstruct Mencius's Position & Milgram:**
      *   *Mencius's Core Claim:* Human nature has sprouts (*duan*) of virtue (compassion, shame, etc.). The "child at the well" shows immediate, uncalculated compassion.
