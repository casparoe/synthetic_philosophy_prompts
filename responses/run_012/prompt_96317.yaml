answer: |-
  Here is the verdict: **Your cohort-mate is mathematically correct but biologically wrong.**

  The debate is **not** merely verbal. While the mathematical formalisms of gene-level selection (inclusive fitness) and multi-level selection (group selection) can often be made to yield identical predictions, they are not equivalent explanations of the world. Your intuitions are correct: there is a substantive question left over. It concerns **causal structure**, not just accounting.

  You are half-right to feel persuaded by the algebra, but you are wrong to let the algebra dissolve the biology. Here is exactly where your cohort-mate's reasoning fails, why field biologists still argue, and what you should say to him.

  ### 1. The Grain of Truth: Predictive Equivalence
  Your cohort-mate is relying on the **Price Equation** logic. It is true that for any given evolutionary change, you can partition the variance into "within-group" and "between-group" components, or you can partition it into "direct" and "indirect" (kin) fitness components. Mathematically, these are often transformable into one another. If the only goal of evolutionary theory were to predict allele frequency change in a static population, your cohort-mate would be right. It would be a choice of coordinate systems, like describing a vector in Cartesian vs. polar coordinates.

  ### 2. The Fatal Flaw: Prediction vs. Explanation
  The error lies in assuming that **predictive equivalence implies explanatory identity.**

  In science, two models can predict the same outcome while describing fundamentally different causal mechanisms.
  *   **Example:** You can predict the motion of a pendulum using Newtonian forces or using Lagrangian energy minimization. The predictions match. But if you ask a physicist, "What *causes* the pendulum to swing back?" they will talk about tension and gravity (forces), not abstract energy minimization. The energy description is a tool; the force description identifies the causal levers.

  In evolutionary biology, the "Gene's Eye View" (your cohort-mate's position) treats the gene as the sole causal agent. The "Multi-Level Selection" (MLS) view treats the group as a causal agent in specific contexts.
  *   **The Substantive Question:** It matters *where* the selective pressure originates. Is the altruist dying because their genes are losing out (gene view), or because the group is being outcompeted by other groups (group view)?
  *   **Why it matters:** If you want to *intervene* or *manipulate* the system (e.g., conserve a species, manage antibiotic resistance, understand cancer), you need to know which causal levers to pull. If selection is primarily acting between groups, manipulating individual incentives will fail. If you treat it as just "gene bookkeeping," you blind yourself to the ecological structures (group boundaries) that generate the selection.

  ### 3. Addressing Your Nagging Doubts

  **Doubt 1: Why do they feel like different questions?**
  Because they are. Gene-selection asks: "Which replicator increases in frequency?" Group-selection asks: "At what level of biological organization is the adaptive design emerging?"
  When you see a termite mound, describing it as "genes maximizing copies" is abstractly true but biologically empty. Describing it as "selection favoring colonies that regulate temperature better" identifies the **functional design**. The "whose fitness" question identifies the **vehicle** of adaptation. Vehicles are real, not just bookkeeping.

  **Doubt 2: Why do field biologists still argue?**
  Because the **conditions** for group selection are empirical, not algebraic.
  Your cohort-mate says you can always rewrite the model. True. But you can only rewrite it *after* you know the population structure. Field biologists argue about whether group structure *exists* strongly enough to drive evolution.
  *   If migration is high and groups dissolve constantly, group selection is weak.
  *   If groups are stable and compete, group selection is strong.
  Arguing about "whether group selection is happening" is shorthand for "Is the between-group variance component large enough to overcome within-group cheating?" That is an empirical claim about the world, not a choice of algebra.

  **Doubt 3: Is emergent fitness just a decomposition choice?**
  No. This is the crux.
  If fitness were purely additive (my fitness + your fitness = total), then yes, it's just decomposition. But biological fitness is often **non-linear**.
  *   **Example:** In a hunt, 5 wolves catch a moose; 4 wolves starve. The 5th wolf adds disproportionate value. The "group" has a property (hunting success) that is not the sum of individual properties.
  *   When interactions are non-linear, the "group term" in the equation is not a residual; it is the **driver**. To claim this is just "genes finding copies in neighbors" is to ignore the **interaction effect** that creates the group-level trait. The emergent component is a fact about the *biology of the interaction*, not the *math of the observer*.

  ### 4. The Verdict: Explanatory Pluralism
  The units-of-selection debate is substantive because evolution is a **hierarchical process**.
  *   **Genes** are the units of *transmission* (mostly).
  *   **Organisms/Groups** are the units of *selection* (context-dependent).

  Your cohort-mate conflates replication with selection. Genes are copied, but they are not always what gets *selected*. Selection acts on phenotypes, and phenotypes are constructed at multiple levels (cells, organisms, colonies). When the "Major Transitions in Evolution" occur (e.g., single cells becoming multicellular organisms), the level of selection literally shifts. To say "it's still just genes" during the transition to multicellularity is to miss the most important part of the story: the suppression of lower-level selection in favor of higher-level selection.

  ### 5. What to Say to Your Cohort-Mate
  Do not fight him on the math. You will lose, because the Price Equation *does* allow the translation. Fight him on the **utility and causality**.

  **Say this:**
  > "I agree that the Price Equation allows us to translate between MLS and Inclusive Fitness models mathematically. But predictive equivalence isn't explanatory identity.
  >
  > If I want to understand why cancer is suppressed in a body, telling me 'it's genes maximizing copies' doesn't help. Telling me 'selection at the cell level is suppressed by mechanisms enforcing selection at the organism level' identifies the causal mechanism.
  >
  > The debate isn't about whether we *can* rewrite the algebra; it's about which level provides the **causal grain** that explains the adaptation. If we treat group selection as merely verbal, we lose the ability to ask empirical questions about when group structure is strong enough to drive evolution. The math is a tool, not an ontology."

  **Summary for your confidence:**
  You are not losing because you don't understand the math. You are losing because your cohort-mate is presenting a **methodological monism** (only genes are real) as a **metaphysical truth**. It is not. It is a heuristic. Sometimes the gene heuristic is best; sometimes the group heuristic is best. Insisting on only one is bad science. Stand your ground.
