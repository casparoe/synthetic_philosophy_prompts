prompt: |-
  I am trying to settle what would count as an adequate treatment of Skolem's paradox before reading any further into it, so I would like the desiderata first. Write the specification: what must any account of the paradox deliver in order to be satisfactory? Fix the purpose explicitly as follows — the account should be good enough to determine whether the paradox bears at all on the determinacy of set-theoretic reference, and specifically whether the apparent uncountability of the continuum is a fact about sets or merely a fact about models.

  For each requirement, give the case or consideration that motivates it, and mark it as either a genuine constraint that any account must meet or a commitment that only one camp need accept (Skolemite, classical, constructivist, and so on). The list should cover at least the following: the status of the Löwenheim–Skolem theorem as an ordinary theorem of the metatheory rather than a symptom of some defect in set theory; the distinction between being countable in a model and being countable simpliciter, and why the paradox is not obviously dissolved by invoking it; the behaviour of the paradox under a second-order formulation with standard semantics, where the theorem fails and the paradox, on some views, disappears with it; what a countable transitive model of set theory can legitimately be said to contain, given that it has only countably many elements yet contains no internal bijection between its copy of the natural numbers and its copy of the first uncountable ordinal; and the inference from the paradox to the conclusion that set theory is really about countable structures after all.

  I would also like you to flag any pair of requirements that cannot be jointly satisfied, and to identify the single requirement that does the most to exclude otherwise attractive resolutions. Keep the weight on the requirements and the cases behind them; I will construct the scorecard myself. No bibliography — I will supply the references.
