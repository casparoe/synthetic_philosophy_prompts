answer: |-
  ### I. Mapping the Philosophical Positions onto Torts Doctrine

  Here are the three principal families of position in the doing/allowing debate, translated into the vocabulary of negligence law.

  #### 1. The View that the Distinction is Morally Basic
  **Philosophical Claim:** There is an intrinsic moral asymmetry between killing and letting die. Doing harm is strictly worse than allowing harm to occur, independent of consequences or intent.

  **Torts Translation:** This maps directly onto the foundational dichotomy between **misfeasance** and **nonfeasance**.
  *   **The Rule:** A defendant is liable for affirmative acts that cause harm (misfeasance) but generally not for failures to act (nonfeasance), absent a pre-existing duty.
  *   **The Doctrinal Mechanism:** This is handled at the **duty** element. The law treats the "act" as triggering the general duty of reasonable care. The "omission" leaves the parties in the *status quo ante*, where no duty exists between strangers.
  *   **The Implication:** In this translation, the moral "wrongness" of doing is codified as the **prima facie duty of care**. The moral "permissibility" of allowing is codified as the **no-duty-to-rescue rule**. The law treats the distinction not merely as evidentiary but as a threshold bar to liability. To translate this view faithfully, one must accept that the common law's refusal to impose a duty to rescue is not just a policy convenience but a recognition of a normative boundary between active interference and passive observation.

  #### 2. The View that the Distinction Marks No Intrinsic Moral Difference
  **Philosophical Claim:** The distinction is morally irrelevant. What matters is the outcome (death/harm) and the agent's capacity to prevent it. If I can save you at low cost, my failure to do so is equivalent to harming you.

  **Torts Translation:** This maps onto **Law and Economics** critiques of the no-duty rule and arguments for **negligence as strict liability for foreseeable harm**.
  *   **The Rule:** The distinction between act and omission should collapse where the **Hand Formula** (B < PL) is satisfied. If the burden of rescue is low and the probability/magnitude of harm is high, the defendant should be liable regardless of whether the peril was created by them or by nature.
  *   **The Doctrinal Mechanism:** This position attacks the **duty** element as artificially constructed. It argues that **breach** should be the sole inquiry. If the defendant failed to take cost-justified precautions (including rescue), they breached a duty, regardless of whether they created the risk.
  *   **The Implication:** To translate this view, you must treat the "no-duty-to-rescue" rule as a doctrinal error or an outdated immunity. It requires viewing the **creation of risk** not as a necessary condition for duty, but as merely one factor in foreseeability. In this vocabulary, the "act" is just one way to breach; the "omission" is another. The moral equivalence of killing and letting die becomes the legal equivalence of active negligence and passive non-feasance where a duty is recognized.

  #### 3. The Intermediate View: The Distinction is Real but Derivative
  **Philosophical Claim:** The distinction matters, but not intrinsically. It matters because acts usually correlate with other morally significant factors, such as **intent**, **violation of rights**, or **causal history** (e.g., I made you worse off vs. I failed to make you better off).

  **Torts Translation:** This maps onto the **exceptions to the no-duty-to-rescue rule** (Special Relationship, Undertaking, Creation of Risk).
  *   **The Rule:** An omission is actionable only when it tracks a specific **legal nexus** that transforms the omission into a breach of an affirmative duty.
  *   **The Doctrinal Mechanism:**
      *   **Creation of Risk:** If I create the peril (act), I have a duty to mitigate it (even if mitigation requires further acts). Here, the omission is liable *because* of the prior act.
      *   **Undertaking/Reliance:** If I begin a rescue (act), I cannot abandon it (omission) if it leaves the victim worse off. The duty derives from the **reliance** induced or the **foreclosure of other aid**.
      *   **Special Relationship:** The duty exists because of the **status** (carrier/passenger, jailer/prisoner), which implies a custodial obligation.
  *   **The Implication:** This translation suggests the act/omit distinction is a **proxy** for deeper doctrinal inquiries. We don't punish the omission *qua* omission; we punish it because it violates a duty generated by prior conduct (undertaking) or status (relationship). The distinction is "derivative" in torts because the omission only becomes tortious when "piggybacking" on an established duty-generating fact.

  ***

  ### II. The Residue Report

  This section identifies where the translation holds, where it distorts, and where it fails.

  #### 1. Clean Carryovers
  *   **Misfeasance/Nonfeasance as Doing/Allowing:** The structural alignment here is nearly perfect. The law's refusal to liability for pure nonfeasance mirrors the philosophical intuition that "allowing" is less culpable than "doing."
  *   **Creation of Risk as Causal History:** The philosophical argument that "doing" matters because it alters the baseline course of events maps cleanly onto the **creation-of-risk exception**. If you change the background conditions, you own the consequences.
  *   **Undertaking as Reliance:** The philosophical idea that "allowing" becomes "doing" when you interrupt a potential rescue maps onto the **Restatement (Second) § 323** liability for negligent undertaking.

  #### 2. Distorted Survivals
  *   **Intent vs. Breach:** Philosophers often hinge the doing/allowing debate on **intent** (e.g., I let you die to save money vs. I kill you to save money). Torts negligence largely scrubs intent from the equation (except in intentional torts). In translating the philosophical debate to negligence, we lose the *mens rea* component. The "moral weight" of the distinction in philosophy often rests on the agent's will; in torts, it rests on the **objective standard of care**.
  *   **The "Baseline" Problem:** Philosophy struggles to define the "normal course of events" (what counts as letting die?). Torts solves this conventionally: the baseline is whatever state existed before the defendant's **affirmative act**. This is a legal fiction, not a metaphysical truth. The translation works only if you accept the legal baseline as the moral baseline.

  #### 3. Failures (Where the Vocabulary Breaks)
  *   **Moral Duty vs. Legal Duty:** This is the critical failure point. Philosophers ask, "Is this wrong?" Torts asks, "Is this actionable?"
      *   *The Friction:* A philosopher might argue there is a *moral* duty to rescue even if there is no *legal* duty. Torts vocabulary cannot express "wrongful but not liable." In my vocabulary, if there is no duty, there is no breach. If there is no breach, there is no tort. The translation forces the philosophical claim into a binary: either the duty exists (and it's a tort) or it doesn't (and it's nothing). It cannot capture "morally culpable nonfeasance."
  *   **Conventionalism:** Torts duties are largely conventional (created by precedent or statute). Philosophical duties are often argued to be natural or rational. When I translate "Basic Difference" into "Misfeasance Rule," I am implicitly presupposing that the common law rule *is* the moral truth. If the philosopher believes the common law is *wrong* about the basic difference, the translation fails.

  ***

  ### III. Addressing Your Three Questions

  #### 1. Does the moral asymmetry correspond to anything more than the law's distinction between an act that creates a duty and an omission that leaves the pre-existing state of affairs alone?

  **Verdict:** In torts vocabulary, the moral asymmetry **collapses entirely into the duty allocation.**

  Once a duty is established (e.g., via a special relationship), the distinction between act and omission loses most of its legal force. A doctor who actively injects poison (misfeasance) and a doctor who actively turns off a ventilator (often treated as an omission/breach of duty to treat) are both liable if the conduct falls below the standard of care.
  *   **The Work the Distinction Does:** The only "work" the distinction does in torts is at the threshold **duty** inquiry. It determines *who* is in the game.
  *   **The Philosophical Residue:** If the philosopher claims the distinction matters *even after* duties are equalized (e.g., "It is still worse to shoot than to withhold food, even if you have a duty to feed"), torts vocabulary **cannot express this**. Torts has no mechanism for grading culpability based on act/omit once liability is triggered. Damages are compensatory, not punitive based on the metaphysics of the act.
  *   **Conclusion:** The translation suggests the moral asymmetry is doing no work beyond the conventional allocation of duties. If you want to claim it does more, you must step outside the vocabulary of negligence liability.

  #### 2. What becomes of the clinical case in which treatment is withdrawn rather than never initiated?

  **The Conflict:**
  *   **Clinical Consensus:** Withdrawing treatment (allowing to die) is morally equivalent to never initiating it (allowing to die). Neither is killing.
  *   **Torts Doctrine:**
      *   *Never Initiating:* Generally **nonfeasance**. Unless a doctor-patient relationship is already formed, there is no duty to treat. Even if formed, refusing a specific treatment is often within the standard of care.
      *   *Withdrawing:* This triggers the **Undertaking** and **Reliance** doctrines. Once treatment begins, the patient relies on it. Stopping treatment looks like **negligent abandonment** (a breach of the undertaking).
  *   **The Translation:** In torts vocabulary, withdrawal is legally *graver* than non-initiation. Withdrawal is an interruption of a relied-upon course of conduct (misfeasance/breach of undertaking). Non-initiation is a failure to confer a benefit (nonfeasance).
  *   **Can Equivalence be Stated?** Only by distorting the doctrine. To make them equivalent in torts, you must argue that the **duty to treat** exists in both scenarios (e.g., via a statutory mandate or established relationship). If the duty exists in both, then both are breaches if unjustified.
  *   **The Failure:** However, this misses the clinical point. Clinicians say they are equivalent *even if* no duty exists. They say withdrawing is *allowing*, not *killing*. Torts struggles here because withdrawing life support often requires an **affirmative act** (turning a dial, extubating). Torts classifies this as an act. Bioethics classifies this as an omission (stopping the intervention).
  *   **Conclusion:** The equivalence **cannot be cleanly stated** in standard negligence vocabulary without reclassifying the withdrawal as an "omission" despite the physical act involved. Torts sees the physical act (turning off the switch); Bioethics sees the normative structure (cessation of aid). To map the equivalence, you must adopt the bioethical definition of "act" over the physical one, which torts resists.

  #### 3. Is the residue best read as a defect of the doctrinal framework, or as evidence that the philosophical distinction is less determinate than it presents itself as being?

  **Verdict:** It is primarily a **defect of the doctrinal framework's purpose**, but it exposes the **context-dependence** of the philosophical distinction.

  *   **Defect of Framework:** Torts is not designed to measure moral culpability; it is designed to allocate loss and deter inefficient conduct. The "no-duty-to-rescue" rule is based on **liberty interests** and **administrability** (floodgates), not necessarily on a deep moral truth about acts vs. omissions. Therefore, the framework *cannot* see moral nuance that doesn't serve loss allocation. When the framework treats withdrawal as riskier than non-initiation, it is protecting **reliance interests**, not making a moral judgment on killing vs. letting die.
  *   **Indeterminacy of Philosophy:** However, the translation failure suggests the philosophical distinction is less stable in institutional settings. In the "stranger by the pond" case, act/omit is clear. In the "hospital" case, the distinction blurs because the **baseline** is contested. Is the baseline "death without machine" or "life with machine"?
      *   Torts fixes the baseline conventionally (status quo before defendant's act).
      *   Philosophy struggles to fix the baseline naturally.
  *   **Conclusion:** The residue indicates that the philosophical distinction relies on a **pre-legal baseline** that torts does not recognize. Torts assumes duties are conventional. If the philosophical distinction requires natural duties (duties we have regardless of law), torts vocabulary will always distort it. The "defect" is that torts presupposes **conventionalism**. If you believe duties are natural, torts vocabulary is insufficient. If you believe duties are conventional, the philosophical distinction collapses into policy analysis.

  ### Summary for the Practitioner
  You can map the doing/allowing debate onto Misfeasance/Nonfeasance and the Duty exceptions. However, the map fails where **moral culpability** diverges from **legal liability**. Specifically, torts cannot express "wrongful nonfeasance" (no duty, but morally bad) and it treats withdrawal of care as legally riskier than non-initiation (due to undertaking/reliance), contradicting the clinical view of moral equivalence. This suggests your doctrinal categories are optimized for **loss allocation and reliance protection**, not for capturing the metaphysical structure of moral agency.
