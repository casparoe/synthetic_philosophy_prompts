answer: |-
  # MODULARITY & PERCEPTUAL JUSTIFICATION: A DECISION TREE

  **Instructions:** Start at **Node 1**. Answer the question based on your intuition about the case provided. Follow the branch to the next node or a final **Leaf**. At each node, check the *Separation Note* to see what philosophical commitment you are making.

  ---

  ### **NODE 1: The Müller-Lyer Test**
  **Case:** You measure the Müller-Lyer lines and *believe* they are equal.
  **Question:** Do they *look* equal to you now, or do they still *look* unequal despite your belief?
  *   **Separation Note:** Distinguishes **Encapsulation** (vision is sealed) from **Penetration/Deflation** (vision is malleable or reports are biased).

  *   **BRANCH A: They still look unequal.** → Go to **Node 2**.
  *   **BRANCH B: They look equal (or can be made to).** → Go to **Node 3**.

  ---

  ### **NODE 2: The Locus of Resistance**
  **Case:** The lines look unequal, but you report them as equal.
  **Question:** Is this because vision is *physically sealed off* from belief, or because you are *correcting your report* despite what you see?
  *   **Separation Note:** Distinguishes **Modularity** (architectural limit) from **Deflation** (post-perceptual bias).

  *   **BRANCH A: Sealed off (Architectural).** → **LEAF 1**.
  *   **BRANCH B: Correcting Report (Judgment).** → **LEAF 2**.

  ---

  ### **NODE 3: The Mechanism of Change**
  **Case:** You spot a friend's face in a crowd after being told they are there.
  **Question:** Did your visual experience *itself* change, or did you just *scan/attend* differently?
  *   **Separation Note:** Distinguishes **Direct Penetration** (constitutive change) from **Indirect Influence** (attention/eye-movement).

  *   **BRANCH A: Scanned/Attended differently.** → Go to **Node 4**.
  *   **BRANCH B: Experience itself changed.** → Go to **Node 5**.

  ---

  ### **NODE 4: The Status of Attention**
  **Case:** You choose to attend to the red shape.
  **Question:** Is this act of attending a *cognitive choice* (under your control) or a *sub-personal reflex*?
  *   **Separation Note:** Distinguishes **Cognitive Attention** (penetration by proxy) from **Non-Cognitive Attention** (purely causal).
  *   **⚠️ DIAGNOSTIC WARNING:** *Leaves 3 and 4 are phenomenologically identical. You cannot separate them by "what it's like," only by your theory of attention.*

  *   **BRANCH A: Cognitive Choice.** → **LEAF 3**.
  *   **BRANCH B: Sub-personal Reflex.** → **LEAF 4**.

  ---

  ### **NODE 5: The Content of Experience**
  **Case:** You switch aspects on the Duck-Rabbit figure.
  **Question:** Does the *spatial shape* (content) change, or only the *organization/feel* (phenomenal character)?
  *   **Separation Note:** Distinguishes **Content Penetration** (representational change) from **Phenomenal Penetration** (non-representational change).

  *   **BRANCH A: Only organization/feel.** → **LEAF 5**.
  *   **BRANCH B: Spatial shape/content.** → Go to **Node 6**.

  ---

  ### **NODE 6: The Timescale of Influence**
  **Case:** A radiologist sees a tumor instantly; a novice does not.
  **Question:** Did this ability require *years of training* or can it happen with a *momentary thought*?
  *   **Separation Note:** Distinguishes **Long-term Reshaping** (learning) from **Online Penetration** (current state).

  *   **BRANCH A: Years of training.** → **LEAF 6**.
  *   **BRANCH B: Momentary thought.** → Go to **Node 7**.

  ---

  ### **NODE 7: The Penetrating State**
  **Case:** A bleak mood makes the world look grey and sluggish.
  **Question:** Does this require a *belief* ("the world is bad") or can a *mood/emotion* do it alone?
  *   **Separation Note:** Distinguishes **Strict Cognitive Penetration** (belief/concept) from **Affective Penetration** (emotion/mood).

  *   **BRANCH A: Mood/Emotion alone.** → **LEAF 7**.
  *   **BRANCH B: Requires Belief/Concept.** → Go to **Node 8**.

  ---

  ### **NODE 8: The Source of Influence**
  **Case:** The McGurk Effect (hearing "ba" while seeing "ga" makes you see "da").
  **Question:** Is the influence coming from *another sense* or from *background knowledge*?
  *   **Separation Note:** Distinguishes **Cross-Modal Integration** (sensory-sensory) from **Theory-Ladenness** (cognitive-sensory).

  *   **BRANCH A: Another sense.** → **LEAF 8**.
  *   **BRANCH B: Background knowledge.** → Go to **Node 9**.

  ---

  ### **NODE 9: The Epistemic Consequence**
  **Case:** Your belief that "this is a snake" makes you see a snake (it is actually a stick).
  **Question:** Does this influence *preserve* justification (rational) or *corrupt* it (bias)?
  *   **Separation Note:** Distinguishes **Coherentism** (observation supports theory) from **Downgrade** (observation is tainted).

  *   **BRANCH A: Preserves Justification.** → **LEAF 9**.
  *   **BRANCH B: Corrupts Justification.** → Go to **Node 10**.

  ---

  ### **NODE 10: The Role of Rationality**
  **Case:** The belief causes the perception, but you know it's a bias.
  **Question:** Is the perception *merely caused* (no epistemic weight) or does it *still count* as evidence (pragmatic)?
  *   **Separation Note:** Distinguishes **Epistemic Downgrade** (causal but bad) from **No-Clean-Case** (distinction is bogus).
  *   **⚠️ UNOCCUPIED ZONE:** *If you answer "Merely Caused" but insist it is "Rational," you are in an incoherent position nobody holds.*

  *   **BRANCH A: Merely Caused.** → **LEAF 10**.
  *   **BRANCH B: Distinction is Bogus.** → **LEAF 11**.
  *   **BRANCH C: Pragmatic Count.** → **LEAF 12**.

  ---

  ## **THE LEAVES: POSITIONS & COMMITMENTS**

  **LEAF 1: Strict Encapsulation (Fodor)**
  *   **Embarrassing Commitment:** You must claim expertise and mood *never* alter the raw visual feed, only how it is used.
  *   **Case Implication:** The radiologist and the novice have the *same* visual experience; they just judge it differently.

  **LEAF 2: Deflationary / Response Bias**
  *   **Embarrassing Commitment:** You deny there is any "look" distinct from "judgment," risking a collapse of the appearance/reality distinction.
  *   **Case Implication:** Müller-Lyer lines *look* equal if you are honest about reporting; illusion is a lie in speech.

  **LEAF 3: Attention as Cognitive**
  *   **Embarrassing Commitment:** You must define "cognition" so broadly that reflexive eye-movements count as thoughts.
  *   **Case Implication:** Searching for a friend is a *cognitive* act that penetrates vision by directing the sensor.

  **LEAF 4: Attentional Mediation (Non-Cognitive)**
  *   **Embarrassing Commitment:** You concede cognition influences perception but deny it counts as "penetration," making the term purely terminological.
  *   **Case Implication:** The face in the crowd pops out due to a sub-personal filter, not your belief.

  **LEAF 5: Phenomenal Character Only**
  *   **Embarrassing Commitment:** You posit a "feel" to experience that carries no representational content, which many find metaphysically suspicious.
  *   **Case Implication:** The Duck-Rabbit switch changes the *vibe* of the drawing, not the lines drawn.

  **LEAF 6: Long-term / Expertise Reshaping (Churchland)**
  *   **Embarrassing Commitment:** You allow learning to change modules but deny current beliefs can, which seems like an arbitrary time-limit.
  *   **Case Implication:** The radiologist *sees* differently than the novice, but you cannot learn to see a tumor in one second.

  **LEAF 7: Affective Penetration**
  *   **Embarrassing Commitment:** You grant emotions epistemic power over perception while denying beliefs the same, risking inconsistency.
  *   **Case Implication:** Depression literally makes the world look greyer, not just makes you judge it as such.

  **LEAF 8: Cross-Modal Integration**
  *   **Embarrassing Commitment:** You classify sensory-sensory interaction as "cognitive penetration," blurring the line between sensation and cognition.
  *   **Case Implication:** The McGurk effect is the *only* real penetration; beliefs never reach vision directly.

  **LEAF 9: Thoroughly Theory-Laden (Hanson/Kuhn)**
  *   **Embarrassing Commitment:** You imply there is no "neutral" observation, making scientific disagreement impossible to resolve empirically.
  *   **Case Implication:** The proponent and opponent of a theory literally *see* different things in the same lab apparatus.

  **LEAF 10: Epistemic Downgrade (Siegel)**
  *   **Embarrassing Commitment:** You must argue that some perceptions are "hijacked" and provide less justification than identical non-hijacked ones.
  *   **Case Implication:** Seeing a snake due to fear gives you *less* reason to believe it's a snake than seeing one calmly.

  **LEAF 11: No-Clean-Case-Exists**
  *   **Embarrassing Commitment:** You suggest the "cognitive/perceptual" boundary is a pragmatic tool, not a real joint in nature.
  *   **Case Implication:** Asking if the radiologist "sees" or "judges" is a bad question; it is a unified skill.

  **LEAF 12: [UNOCCUPIED] Rational Mere-Cause**
  *   **Embarrassing Commitment:** This position is incoherent: claiming an influence is "merely causal" yet "rationally preserving."
  *   **Case Implication:** Nobody lands here; if you do, you are using "rational" and "causal" inconsistently.
