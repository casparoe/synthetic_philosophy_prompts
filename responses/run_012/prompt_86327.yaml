answer: |-
  You have stumbled onto one of the deepest truths of type design, and you are right: there isn't a single, common English word that perfectly captures it in the way you want. Most type terminology focuses on the *parts* (stem, bowl, counter) or the *aesthetics* (color, texture, voice).

  However, the concept you are describing has a rigorous name in linguistics and semiotics that type theorists borrow when they need to be precise about this exact problem.

  The word you are looking for is **Distinctive Features**.

  Here is the carving you asked for.

  ### 1. The Atomic Unit: Distinctive Features
  In linguistics (phonology), a sound (phoneme) isn't defined by what it *is*, but by how it *differs* from other sounds. The difference between "pat" and "bat" is a single distinctive feature: [voiced] vs. [unvoiced].

  In type design, letters are bundles of distinctive features.
  *   **`b`** = [stem-left] + [bowl-right] + [ascender]
  *   **`d`** = [stem-right] + [bowl-left] + [ascender]
  *   **`p`** = [stem-left] + [bowl-right] + [descender]
  *   **`q`** = [stem-right] + [bowl-left] + [descender]

  When you say "one of those letters is carrying the whole distinction," you are describing **Feature Loading**. If you make the bowls identical (removing [bowl-shape] as a variable), you load the entire distinctive weight onto the stem direction. If you then make the stems similar, the letter collapses because it has lost its **Distinctive Features**.

  There is no "ideal `a`." There is only an `a` that possesses enough features to distinguish itself from `d`, `q`, `o`, and `e` *within the current system*.

  ### 2. The Philosophy: Structuralism
  The framework you are intuiting is **Structuralism**. The linguist Ferdinand de Saussure famously wrote, *"In language there are only differences without positive terms."*

  This is exactly your "zero-sum" problem. A `b` is not a `b` because it matches a Platonic ideal of `b`-ness. It is a `b` because it is *not* a `d`, *not* a `p`, and *not* an `h`.

  When you fix your `b` and `d` but your `p` and `q` go mushy, you have shifted the **Systemic Contrast**. You increased the signal strength between `b` and `d` (perhaps by exaggerating the terminal flick), but in doing so, you may have inadvertently reduced the contrast available for `p` and `q`, or you have used up the "visual noise" allowance for that quadrant of the alphabet.

  ### 3. The Budget: Perceptual Set
  You described the "weirdness budget" perfectly: *"Squeeze only the e in an otherwise normal alphabet and it breaks. Squeeze the whole alphabet and it reads fine."*

  In psychology, this is **Perceptual Set** (or Adaptation Level Theory).

  When a reader sees the first few words of your text, their brain instantly builds a **temporary model** of your font's rules.
  *   **Inconsistent Weirdness:** If the font is normal but the `e` is narrow, the brain's model says "This is a normal font." The narrow `e` registers as an error or a different letter (maybe an `o`?), causing a stutter.
  *   **Consistent Weirdness:** If the whole font is condensed, the brain's model says "This is a condensed system." The narrow `e` now fits the rule. The "budget" isn't magic; it's the **tolerance granted by Internal Consistency**.

  The "budget" is the gap between **Systemic Coherence** (how well the letters agree on the rules) and **Distinctive Threshold** (how much difference is needed to tell them apart). If Coherence is high, you can lower the Threshold.

  ### 4. So, what do you call it?
  If you need a label to put on this in your notes or discussions, the most accurate term is **Systemic Differentiation**.

  *   **Differentiation** is the act of making letters distinct.
  *   **Systemic** acknowledges that the distinction is relative to the set, not absolute.

  Some type designers might call this **"Solving the Puzzle"** or **"Managing the Ecology,"** but those are metaphors. **Systemic Differentiation** describes the mechanism.

  ### 5. Who Decides? (The Carving)
  You asked: *"When is this shape the letter a at all, and when is it not, and who decides."*

  **The Designer sets the Constraints.**
  You decide which features are variable (e.g., "in this font, the bowl shape is constant") and which are fixed (e.g., "stem direction is the primary differentiator").

  **The Reader sets the Threshold.**
  The reader's brain performs a rapid statistical analysis. It asks: *"Given the other shapes I've seen in this text, what is the probability that this shape represents the sound /æ/?"*

  If you push the `a` too far, you exceed the **Recognition Threshold**. But crucially, that threshold moves.
  *   In a conservative serif font, the threshold for "weirdness" is very low. A circle-`a` might fail.
  *   In a geometric sans, the threshold for "similarity" is high. A circle-`a` is expected.

  ### Summary for your Toolkit
  *   **The Phenomenon:** **Systemic Differentiation** (or Relational Identity).
  *   **The Atoms:** **Distinctive Features** (stem, bowl, terminal, height).
  *   **The Zero-Sum Game:** **Feature Trading** (if you reduce difference in one feature, you must increase it in another).
  *   **The Budget:** **Perceptual Set** (established by Internal Consistency).
  *   **The Rule:** Identity is **Differential**, not Intrinsic.

  You aren't drawing 26 letters. You are drawing one system with 26 points of variation. When you move one point, the tension changes on all the others. That feeling of "mushiness" you get in `p` and `q` when you fix `b` and `d`? That is the sound of the system rebalancing its tension. Listen to it.
