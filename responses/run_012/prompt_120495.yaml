          *   *Philosophical Divide:* Contextualists (Recanati, Travis) might say the content *does* shift. Traditionalists (Kaplan, Perry) distinguish content from context.
          *   *Consensus:* It is *not* settled that Menard's text has different *semantic meaning*. It is widely agreed it has different *significance* or *force*.

      *   **Section 3: Is Borges Troubling Putnam?**
          *   Putnam wants to save reference via causality. Borges shows causality might not be enough, or that it creates infinite regress (Menard trying to *become* Cervantes).
          *   Borges highlights the *absurdity* of trying to isolate meaning from the author's intent/history.
