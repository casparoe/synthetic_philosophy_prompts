          *   *Kripke:* Causal chains. Cervantes has a direct link to the reality of 1605. Menard has a link to Cervantes. This looks more like Kripke.
          *   *Consensus:* Externalism about natural kinds is widely accepted (though internalists like Chomsky/Fodor push back). Externalism about *whole sentences* or *literary texts* is much more controversial.
          *   *Verdict:* Menard illustrates the *intuition* behind externalism (context matters) but isn't a technical fit for Putnam's "water" argument.

      *   **Section 2: Semantics vs. Pragmatics (The "Meaning" Worry):**
