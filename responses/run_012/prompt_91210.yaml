answer: |-
  Futarchy presupposes a robust **welfarist consequentialism**. It requires that "welfare" be reducible to a single scalar metric, implying strong **commensurability**. All competing goods (liberty, equality, security) must be tradable against one another within this metric. This rules out **value pluralism** (incommensurable goods) and **deontology** (constraints independent of outcomes). Prioritarianism is only accommodated if encoded into the metric's formula, but the default structure implies utilitarian aggregation.

  Its theory of **legitimacy** is instrumentalist rather than procedural. A policy is legitimate because it is *effective* (predicted to maximize the metric), not because it was consented to or deliberated. The "vote on values, bet on facts" slogan attempts to hybridize democratic legitimacy (choosing the metric) with epistocratic legitimacy (choosing the means). However, this assumes a clean **fact/value distinction** that is philosophically porous. Choosing a metric is itself a strategic, value-laden act subject to manipulation, and the metric's definition shapes the facts it measures (Goodhart's Law).

  Regarding **rationality and evidence**, futarchy assumes the **Efficient Market Hypothesis** applies to political counterfactuals. It presupposes traders are **expected-utility maximizers** with rational expectations. Crucially, it requires traders to be **risk-neutral** with respect to the welfare metric. This is not merely a modeling convenience; it is a substantive ethical commitment. If the metric measures raw resources (e.g., GDP) rather than utility, rational traders should be risk-averse. If markets price in risk premiums, prices diverge from probabilities. By assuming risk-neutrality, futarchy implies society should treat marginal welfare gains linearly, ignoring distributional risk or catastrophic tail risks. It treats moral uncertainty as actuarial risk.

  Furthermore, the procedure assumes conditional markets ($P(O|A)$) accurately estimate causal effects ($P(O|do(A))$). This requires traders to possess and price causal models, not just correlations. It assumes the market mechanism incentivizes causal arbitrage sufficiently to purge confounding variables. This is a heavy epistemic burden: it assumes decentralized speculation outperforms structured causal inquiry.

  **Tensions** arise internally. The separation of values and facts collapses when the metric choice determines political power. If a group knows a metric favors them, they will lobby for that metric, making the "value vote" a strategic game. Additionally, the market's decision determines the policy's adoption, which alters the outcome being predicted. This creates a self-referential loop (logical uncertainty) that standard probability theory does not easily resolve. The procedure is **underdetermined** regarding the metric's settlement: who measures the welfare, and how? Different epistemologies of measurement could license the same procedure while yielding divergent results.

  **Rival Views and Design Changes:**
  If we replaced these commitments with **value pluralism**, the single metric must go. Design would shift to multi-dimensional scoring or veto powers for distinct values (e.g., rights constraints that override metrics).
  If we adopted **deliberative democracy**, legitimacy would stem from discourse, not prediction. Markets would be replaced by citizen assemblies or structured debate, prioritizing reason-giving over betting.
  If we adopted **deontology**, the design would require hard constraints. No market could authorize a policy violating rights, regardless of the metric's predicted gain.
  If we rejected **risk-neutrality**, the payout structure would need to be adjusted for risk aversion (e.g., using utility curves rather than raw metric values), or the metric itself would need to measure risk-adjusted welfare rather than expected raw welfare.

  Ultimately, futarchy is not a neutral technology; it is an institutionalization of utilitarian epistemology. It believes truth is found in prices and goodness in sums.
