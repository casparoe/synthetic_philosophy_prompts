prompt: |-
  I've been reading rationalist blogs and forums for years, and I keep returning to futarchy and decision markets. Take the concrete procedure rather than the slogan: an organization picks a single scalar metric of welfare, fixes a time horizon, and for each proposed policy runs a conditional prediction market that pays out according to the metric's value under the policy versus under the status quo. If the market's conditional price says the policy will raise the metric, the policy is adopted; otherwise it is rejected. The values are supposed to be settled by a vote on the metric, and the facts by the market's bets.

  What philosophical commitments does that procedure presuppose? I want the implicit theory reconstructed, not a reading list. What theory of value does it require—welfarism, consequentialism, a commitment to commensurability? What theory of legitimacy does it assume—that a policy is legitimate because a market predicts it will maximize a metric, rather than because it was deliberated or consented to? What theory of rationality and evidence does it assume about traders—that they are risk-neutral expected-utility maximizers, that prices are efficient, that conditional markets can estimate causal counterfactuals? Which rival views does it quietly rule out: value pluralism, deliberative democracy, deontological constraints, prioritarianism, the idea that some values are incommensurable? Where is the procedure underdetermined, so that several theories would license it? And where are its parts in tension—for instance, does the separation between voting on values and betting on facts survive the fact that the choice of metric is itself a value-laden and strategically contestable decision, or that the market's conditional price is not a pure counterfactual estimate because the policy's adoption depends on that very price? I am especially interested in whether the practice presupposes risk-neutrality on the part of traders—since otherwise the market price is not a probability but a risk-adjusted price—and whether that is a substantive philosophical commitment or a merely convenient modeling assumption. I am not asking whether futarchy would work empirically; I am asking what it would have to believe. Finally, if we replaced the presupposed view with a rival—say, a pluralist, deliberative, or deontological one—what would have to change in the institution's design? Answer in under 800 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Futarchy/Decision Markets (specifically the concrete procedure described).
      *   **Task:** Reconstruct the implicit philosophical theory (commitments, theories of value, legitimacy, rationality/evidence, rival views ruled out, underdetermination, tensions).
      *   **Specific Focus:** Risk-neutrality assumption (substantive vs. convenient), tension between value/fact separation, implications of swapping presupposed views.
      *   **Constraint:** Under 800 words.
      *   **Style:** Philosophical reconstruction, not a reading list, not empirical evaluation.

  2.  **Deconstruct the Procedure's Commitments:**
      *   *Theory of Value:* Welfarist consequentialism. It assumes a single scalar metric captures "welfare." This implies commensurability (all values reducible to one number) and aggregativity (summing/averaging across individuals). It rules out deontology (constraints independent of outcomes) and strong value pluralism (incommensurable goods).
      *   *Theory of Legitimacy:* Epistocratic instrumentalism. Legitimacy comes from efficacy (maximizing the metric), not procedure (consent/deliberation). The "vote on values, bet on facts" slogan tries to split legitimacy between democratic input (metric) and epistemic output (policy).
      *   *Theory of Rationality/Evidence:* Market efficiency hypothesis + Rational Expectations. Traders must be expected-utility maximizers. Prices must reflect conditional probabilities.
      *   *Risk-Neutrality:* Crucial point. For price = probability, traders must be risk-neutral regarding the outcome metric. If risk-averse, prices distort probabilities. This is a substantive commitment to treating uncertainty as actuarial rather than Knightian or deeply ambiguous.

  3.  **Identify Tensions and Underdetermination:**
      *   *Value/Fact Separation:* The metric choice is political/value-laden. Strategic voting on the metric undermines the "pure value" premise. Also, the metric *is* a fact about the world once chosen, influencing behavior (Goodhart's Law).
      *   *Counterfactuals:* Conditional markets ($P(O|A)$) vs. Causal effects ($P(O|do(A))$). Markets price correlation; futarchy needs causation. This assumes traders can distinguish correlation from causation or that the market structure incentivizes causal arbitrage.
      *   *Self-Referentiality:* The market decides adoption. Adoption changes the outcome. This creates a fixed-point problem (logical uncertainty).

  4.  **Identify Ruled-Out Views:**
      *   Deontology (constraints).
      *   Strong Pluralism (incommensurability).
      *   Deliberative Democracy (legitimacy via discourse).
      *   Prioritarianism (unless built into metric, but standard utilitarianism is implied).

  5.  **Address the "What if we swapped views?" Question:**
      *   Pluralist/Deliberative: Replace metric with a council or weighted veto powers. Replace markets with structured discourse.
      *   Deontological: Add constraints that veto market decisions regardless of metric.

  6.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro:* Define the core philosophical stance (Consequentialist Epistocracy).
      *   *Value Theory:* Welfarism, Commensurability.
      *   *Legitimacy:* Instrumental vs. Procedural.
      *   *Rationality/Risk:* The risk-neutrality issue (key prompt requirement).
      *   *Tensions:* Value/fact split, causal vs. conditional.
      *   *Alternatives:* How design changes with different philosophy.

      *Drafting thought process:*
      Start with the core: Futarchy is applied consequentialism.
      Value: Requires strong commensurability. All goods must be translatable into the scalar metric. This excludes lexical priorities or incommensurable values.
      Legitimacy: Legitimacy is outcome-based. If the market says it works, it's right. This sidelines consent.
      Rationality: Traders must be EUM maximizers.
      Risk-Neutrality: This is critical. If traders are risk-averse, price $\neq$ probability. Futarchy assumes risk-neutrality *regarding the metric*. This is substantive: it assumes society should treat marginal welfare gains linearly, ignoring distributional risk or catastrophic tail risks unless priced in. It treats moral uncertainty as actuarial risk.
      Tensions: The "vote on values" is not clean. Choosing the metric is a strategic game. Also, $P(O|A)$ is not $P(O|do(A))$. Markets predict correlation; policy needs causation. Futarchy assumes traders will arbitrage away confounding variables, which requires them to have causal models, not just statistical ones.
      Alternatives: If pluralist, you can't have a single metric. You'd need veto points or multi-dimensional scoring. If deliberative, you'd replace betting with argumentation.

      *Refining the Risk-Neutrality point:* The prompt asks if it's a substantive commitment or modeling assumption. It's substantive. It implies the social welfare function is linear in the metric. If society is risk-averse (prefers stable outcomes over volatile high-expectation ones), the market price misleads.

      *Refining the Legitimacy point:* It assumes "Truth" (facts) is separate from "Value" (metrics). But metrics shape facts (Goodhart).

      *Word Count Check:* Need to be concise. Avoid fluff.

      *Plan:*
      1. Value Theory (Welfarism/Commensurability).
      2. Legitimacy (Instrumentalism).
      3. Epistemology/Rationality (Market Efficiency/Causality).
      4. Risk-Neutrality (Substantive commitment).
      5. Tensions (Value/Fact leak, Causal gap).
      6. Alternative Designs.

      *Writing:*
      Futarchy presupposes a robust **welfarist consequentialism**. It requires that "welfare" be reducible to a single scalar metric, implying strong **commensurability**. All competing goods (liberty, equality, security) must be tradable against one another within this metric. This rules out **value pluralism** (incommensurable goods) and **deontology** (constraints independent of outcomes). Prioritarianism is only accommodated if encoded into the metric's formula, but the default structure implies utilitarian aggregation.

      Its theory of **legitimacy** is instrumentalist rather than procedural. A policy is legitimate because it is *effective* (predicted to maximize the metric), not because it was consented to or deliberated. The "vote on values, bet on facts" slogan attempts to hybridize democratic legitimacy (choosing the metric) with epistocratic legitimacy (choosing the means). However, this assumes a clean **fact/value distinction** that is philosophically porous. Choosing a metric is itself a strategic, value-laden act subject to manipulation, and the metric's definition shapes the facts it measures (Goodhart's Law).

      Regarding **rationality and evidence**, futarchy assumes the **Efficient Market Hypothesis** applies to political counterfactuals. It presupposes traders are **expected-utility maximizers** with rational expectations. Crucially, it requires traders to be **risk-neutral** with respect to the welfare metric. This is not merely a modeling convenience; it is a substantive ethical commitment. If traders are risk-averse, market prices reflect risk premiums rather than true probabilities. By assuming risk-neutrality, futarchy implies society should be indifferent between a guaranteed welfare gain and a volatile gamble with the same expected value. It treats moral uncertainty as actuarial risk, ignoring Knightian uncertainty or catastrophic tail risks that risk-averse agents would price differently.

      Furthermore, the procedure assumes conditional markets ($P(O|A)$) accurately estimate causal effects ($P(O|do(A))$). This requires traders to possess and price causal models, not just correlations. It assumes the market mechanism incentivizes causal arbitrage sufficiently to purge confounding variables. This is a heavy epistemic burden: it assumes decentralized speculation outperforms structured causal inquiry.

      **Tensions** arise internally. The separation of values and facts collapses when the metric choice determines political power. If a group knows a metric favors them, they will lobby for that metric, making the "value vote" a strategic game. Additionally, the market's decision determines the policy's adoption, which alters the outcome being predicted. This creates a self-referential loop (logical uncertainty) that standard probability theory does not easily resolve.

      **Rival Views and Design Changes:**
      If we replaced these commitments with **value pluralism**, the single metric must go. Design would shift to multi-dimensional scoring or veto powers for distinct values (e.g., rights constraints that override metrics).
      If we adopted **deliberative democracy**, legitimacy would stem from discourse, not prediction. Markets would be replaced by citizen assemblies or structured debate, prioritizing reason-giving over betting.
      If we adopted **deontology**, the design would require hard constraints. No market could authorize a policy violating rights, regardless of the metric's predicted gain.
      If we rejected **risk-neutrality**, the payout structure would need to be adjusted for risk aversion (e.g., using utility curves rather than raw metric values), or the metric itself would need to measure risk-adjusted welfare rather than expected raw welfare.

      Ultimately, futarchy is not a neutral technology; it is a institutionalization of utilitarian epistemology. It believes truth is found in prices and goodness in sums.

