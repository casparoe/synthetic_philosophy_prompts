  7.  **Final Polish:**
      *   Ensure the distinction between *Calibration* (risk means risk) and *Error Rate Balance* (FPR/FNR) is clear.
      *   Make sure the "Human-in-the-Loop" section emphasizes that the *committee* governs the tool, but the *nurses* govern the decision. This splits the liability.
      *   Highlight that the "Political Choice" is actually a "Clinical Priority Choice."

  8.  *(Self-Correction during drafting)*: I need to be careful about the "Outreach" aspect. If outreach is *help*, then over-flagging a group gives them *more help*. Why is the user worried? Because being labeled "high risk" can have downstream effects (insurance, stigma, feeling judged). I must acknowledge this dual nature. The "harm" of a false positive isn't just a wasted call; it's labeling. The "harm" of a false negative is missed care.

