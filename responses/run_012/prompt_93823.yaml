  10. **Final Check:** Does this answer "what is the most defensible way to decide"? Yes, by shifting to harm weighting and process controls. Does it answer "principled stopping point"? Yes, via the Pareto frontier and marginal utility.

  *(Self-Correction on the "Impossibility Theorem" nuance)*: The user says "colleague says that means the impossibility result applies to only one of them." I need to confirm this. Yes, if base rates are equal ($P(Y=1|A=0) = P(Y=1|A=1)$), then Calibration + Equalized Odds *is* possible. This is a critical point to emphasize.

