  Okay so I'm deep in satisficing for my disseration and I keep flip-flopping on one claim, so I want your actual credence on it. The claim: satisficing -- taking the first option that clears some threshold, Simon-style -- is a genuinely distinct rational strategy, meaning there are choice situations where stopping at "good enough" is the rational thing to do and where it can't be redescribed as expected-utility maximization over any utility function, not even one that prices the cost of deliberating itself. Let's call it the irreducibility claim.

