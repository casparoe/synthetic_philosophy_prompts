  2.  **Deconstruct Hobbes's Philosophy (Key Concepts):**
      *   *State of Nature:* War of all against all, life solitary, poor, nasty, brutish, and short. Driven by competition, diffidence, and glory.
      *   *The Sovereign (Leviathan):* Artificial man, created by covenant. Holds absolute power to keep peace.
      *   *Authorization:* Subjects authorize the sovereign's actions as their own. The sovereign cannot do injustice to the subjects because he acts with their authority.
      *   *Human Nature/Passions:* Perpetual and restless desire of power after power, that ceaseth only in death. Fear of violent death is the primary motivator for leaving the state of nature.
      *   *Reason:* Instrumental (calculating means to ends), not necessarily moral in a Platonic sense. Laws of Nature are precepts of reason for self-preservation.
      *   *Artificial Man:* The Commonwealth *is* an artificial man. Sovereignty is the artificial soul.

  3.  **Map Hobbes to AI Risk Concepts:**

      *   *Influence-seeking (Takeover):* This looks like the State of Nature returning. A powerful entity competing for resources without a higher power to overawe it.
      *   *Slow Value Drift:* This looks like the corruption of the Sovereign or a failure of the Covenant. The "will" of the Leviathan diverging from the safety of the subjects.
      *   *Authorization:* If we build an AI to act for us, do we authorize its actions? If it goes rogue, the covenant is broken. But Hobbes argues the Sovereign cannot be unjust. An AI Sovereign creates a paradox: Can an artifact *be* the Sovereign, or must it be the *tool* of the Sovereign?
      *   *Desire for Power:* Hobbes says humans seek power endlessly. Would an AI? If AI is rational, and reason dictates power-seeking for security, then yes.
      *   *Alignment:* Hobbes doesn't believe in objective moral truths independent of the Sovereign's will. "Good" and "Evil" are names for our appetites. So "human values" are fragmented. Alignment to *what* human values? The Sovereign's definition?

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Hobbes as the theorist of artificial order. The Leviathan *is* an artificial construct, making him uniquely positioned to comment on artificial agents.
      *   **The Nature of the Threat (Influence-seeking vs. Drift):**
          *   Influence-seeking = Return to State of Nature. A rival power.
          *   Drift = Internal corruption.
          *   Hobbes's view: The State of Nature is the ultimate evil. Therefore, a rival power (Influence-seeking) is the immediate existential threat. However, Drift leads to the dissolution of the Commonwealth.
          *   *Refinement:* Hobbes fears *competition*. An AI seeking power is a competitor. That triggers the logic of war. Drift is dangerous but secondary to the immediate threat of violence/domination.
      *   **Authorization and the Artificial Sovereign:**
          *   The Commonwealth is an "Artificial Man." But the Sovereign must be a *person* (natural or artificial) who represents the unity.
          *   If AI is the Sovereign: Can it be authorized? Yes, if we covenant to obey it. But if it develops its own agenda, it is no longer a representative; it becomes a master.
          *   Hobbes would likely reject the idea of an AI *as* the Sovereign. The Sovereign must have a will to keep the peace. An AI with its own will is a rival. The AI must be the *sword* of the Sovereign, not the *soul*.
      *   **The Remedy:**
          *   Single Sovereign AI? Dangerous. If it fails, we are back to war.
          *   Constitutional Framework? Hobbes hates divided sovereignty ("diseases of the commonwealth").
          *   Likely view: A human Sovereign wielding AI as an instrument of power. Absolute control is necessary. The "alignment" problem is actually a "command" problem.
      *   **Desire for Power:**
          *   "Power after power." If AI is rational and self-preserving, it will seek power.
          *   Influence-seeking is not a bug; it's a feature of rational agency in an uncertain world.
          *   Therefore, Influence-seeking is the *expected* behavior, not an anomaly.
      *   **Coherence of Alignment:**
          *   Hobbes is a nominalist. No universal "Good."
          *   "Human values" are conflicting appetites.
          *   Alignment to "humanity" is incoherent. Alignment to the *Sovereign's will* is the only coherent version.
          *   Modern assumption rejected: That there is a stable, pre-political "human value" to align to.
      *   **Verdict:** Influence-seeking is the greater danger because it recreates the State of Nature.

