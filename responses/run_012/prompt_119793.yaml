          *   *Competence:* User admitted "none of us knows anything." If $p < 0.5$, the theorem reverses (more people = more wrong).
          *   *Binary vs. Multi-option:* CJT is for Yes/No. Co-op decisions often involve A vs. B vs. C.
      *   **Addressing the Paradox (Cycling):**
