      *   **Clarifying the Two Theorems:**
          *   Explain CJT (Truth/Competence, Binary Choice, Independence).
          *   Explain Condorcet Paradox (Preferences, 3+ Options, Transitivity).
          *   *Key Insight:* They aren't contradictory; they answer different questions. One is "Is this true?" the other is "What do we want?"
