  3. It rules out the view that institutional obligation exhausts moral evaluation, as well as rival pictures claiming that financial compensation inherently strips an act of its capacity to be supererogatory.
  4. The practice is underdetermined because both a "degrees of duty" theory and a "separate sphere" theory of supererogation can justify medals for required acts, leaving unclear whether the praise negates the obligation or merely acknowledges its difficulty.
