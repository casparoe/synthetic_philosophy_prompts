answer: |-
  **MEMORANDUM: OFFICIAL RULINGS PROCEDURE (v1.0)**
  **TO:** Rulings Team
  **FROM:** Editor
  **SUBJECT:** Standardizing Ticket Resolution

  **GOAL:** Consistency over intuition. Distinguish *Rules* (what the text says) from *Design* (what we want the text to mean).
  **TIMEBOX:** 15 Minutes per ticket. If unresolved, Escalate.

  ### THE PROCEDURE

  **STEP 1: EXISTENCE CHECK (The "Have It?" Test)**
  *Question:* Did the source object possess the specific ability text *immediately before* the trigger event began?
  *   **YES:** Proceed to Step 2.
  *   **NO:** **RULING: No Trigger.** (An object cannot use an ability it does not have).
  *   *Note:* If the event *causes* the loss of the ability simultaneously (e.g., damage triggers growth, but same damage triggers ability loss), treat the ability as **Absent** for this check.
  *   *Escalate:* If the timing of "immediately before" is ambiguous in the Comprehensive Rules.

  **STEP 2: PERMISSION CHECK (The "Allowed?" Test)**
  *Question:* Is there a continuous effect or rule currently prohibiting this ability from triggering or activating?
  *   **NO:** Proceed to Step 3.
  *   **YES:** **RULING: Trigger Blocked.** (The ability exists but is silenced).
  *   *Distinction:* This counts as "Ability Present, Manifestation Blocked." Cards that check for "abilities triggering" will see nothing. Cards checking for "creature having abilities" will see the text.

  **STEP 3: INDEPENDENCE CHECK (The "Orphan?" Test)**
  *Question:* Once triggered/activated, does the effect require the source to remain in play or retain the ability to resolve?
  *   **NO (Effect is Independent):** Proceed to Step 4. (Standard for most triggered abilities).
  *   **YES (Effect Depends on Source):** **RULING: Effect Fails.** (If the source vanishes or changes type such that the effect cannot identify it, the effect fizzles).
  *   *Note:* Copy effects create a *new* instance. The original source's status is irrelevant. Treat the copy as the new Source.

  **STEP 4: RESOLUTION CHECK (The "Legal?" Test)**
  *Question:* Is the game state legal for the effect to apply *now*?
  *   **YES:** **RULING: Effect Occurs.**
  *   **NO:** **RULING: Effect Fails.** (e.g., Target is invalid, maximum hand size exceeded).

  **STEP 5: DESIGN ESCALATION (The "Should It?" Test)**
  *Stop Condition:* If Steps 1–4 yield a result that contradicts the card's obvious intent or creates a "gotcha" scenario not covered by existing precedents.
  *   **Action:** Mark ticket **DESIGN DECISION**. Send to Lead Designer.
  *   **Reason:** This is not a rules gap; it is a balance or philosophy choice. Do not invent a rule to fix it.

  ---

  ### TEST CASES (Procedure Run-Through)

  **CASE 1: The Fire-Damage Pair**
  *Scenario:* Creature A (When dealt damage, +1/+1). Creature B (When a creature is dealt fire damage, it loses all abilities). Both trigger off the same damage event.
  *   **Step 1 (Existence):** The damage event causes the loss. Per Step 1 Note, simultaneous loss treats ability as **Absent**.
  *   **Result:** **No Trigger.**
  *   **Public Ruling:** "Because the ability loss and the damage event occur simultaneously, the creature is treated as lacking the ability at the moment the trigger would occur."
  *   **Player Reaction:** **HATE.** Players intuitively feel the ability was there "when the damage hit."
  *   **Temptation:** We want to rule that triggers check *before* state-based losses (letting it grow).
  *   **Cost:** Inconsistency. If we allow this, we must allow all "self-destruct" triggers, breaking the symmetry of Step 1. It requires a Design Escalation to change Step 1.

  **CASE 2: Silence & Gained Abilities**
  *Scenario:* "Silence" (Triggered abilities can't trigger). Creature A (Static: +1/+1). Creature B (Enters play: Gains "When tapped, draw 1" *after* Silence is active). Variant: Ability requires "If you control a Mountain" at trigger and resolution.
  *   **Step 1 (Existence):** Creature A (Static) is not Triggered. Creature B (Gained) has text. **Pass.**
  *   **Step 2 (Permission):** Silence is active.
      *   Creature A: Static abilities are not triggered. **Pass.** (Bonus applies).
      *   Creature B: Triggered ability exists but is prohibited. **Fail.** (No Draw).
      *   Variant: Check condition at Trigger (Step 1) and Resolution (Step 4). If Mountain leaves in between, Effect Fails.
  *   **Public Ruling:** "Static bonuses apply continuously. Triggered abilities gained while 'Silence' is active exist on the card but are prohibited from triggering."
  *   **Result:** Consistent with Step 2.

  **CASE 3: The Copy Effect**
  *Scenario:* Card copies an ability's result. Source creature leaves play before copy resolves.
  *   **Step 3 (Independence):** Copy effects create a new instance. The ability belongs to the *copy*, not the original source.
  *   **Result:** **Effect Occurs.**
  *   **Public Ruling:** "Copy effects create a new ability instance independent of the original source. The original creature's location does not matter."
  *   **Result:** Consistent with Step 3.

  ---

  ### LIMITATIONS & NOTES

  **WHAT THIS PROCEDURE CANNOT DO:**
  1.  **New Keywords:** If a ticket hinges on a keyword not defined in the Comprehensive Rules, this is **Errata**, not a Ruling.
  2.  **Contradictory Text:** If Card Text A explicitly contradicts Card Text B with no timestamp rule, this is **Errata**.
  3.  **Tournament Policy:** This procedure covers game rules, not judge discretion or cheating investigations.

  **RULING VS. ERRATA:**
  *   **Ruling:** The rules support the answer, but the interaction is non-obvious. (Cost: Time).
  *   **Errata:** The rules do not support the intended function, or the text is ambiguous enough that Step 5 is triggered repeatedly. (Cost: Print Run).
  *   **Rule of Thumb:** If you have to write more than 3 sentences to explain why the text means what it says, propose Errata.

  **PHILOSOPHICAL NOTE:**
  We are not determining "truth." We are determining "game state validity." Do not argue about whether an ability "really" exists. Argue only about whether the Game Engine permits the trigger. If the Engine (Rules) is silent, that is a Design Decision, not a metaphysical gap.
