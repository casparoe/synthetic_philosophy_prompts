  **AXIOM GLOBAL FORECASTING**
  **Document ID:** AGF-MOD-2024-09
  **Subject:** Model Transparency & Assumption Disclosure Statement (MTADS)
  **Model:** Rational Agent Core (RAC-4)

  **1. Operational Overview**
  The Rational Agent Core (RAC-4) provides probabilistic forecasts for high-variance human behaviours, including labour mobility, marital dissolution, religious participation, and electoral turnout. The model generates outputs by simulating a population of heterogeneous agents operating within a frictionless market environment. All agents are modelled as fully informed, forward-looking expected-utility maximizers with consistent time preferences and zero transaction costs.

  **2. Ontological Status of Assumptions**
  Clients are advised that the behavioural parameters encoded in RAC-4 do not correspond to the psychological processes of actual human subjects. Axiom Global does not claim that individuals consciously calculate utility functions, possess perfect information, or ignore social frictions. The firm maintains that the realism of assumptions is irrelevant to the validity of a theory. The sole criterion for model acceptance is predictive accuracy within a specified confidence interval. Clients purchase forecasts, not descriptions. The model posits that agents behave *as if* they are rational maximizers, regardless of internal cognitive architecture.

  **3. Validation and Stability**
  The RAC-4 architecture has been back-tested against aggregate longitudinal data spanning 1990–2020. Across this thirty-year sample, the model maintained a prediction error rate of less than 4% for labour mobility and 6% for marital dissolution. This stability holds across varying macroeconomic conditions. The firm notes that successful prediction over a stable sample validates the use of the model for extrapolation, provided the structural environment remains consistent with the calibration period.

  **4. Classification of Idealizations**
  Per industry standards for methodological disclosure, Axiom Global classifies its core assumptions according to the Musgrave taxonomy of false premises. The status of the "Perfect Rationality" and "Zero Friction" assumptions is detailed below.

  | **Assumption Type** | **Definition** | **RAC-4 Classification** |
  | :--- | :--- | :--- |
  | **Negligibility** | Factor exists but has negligible effect on outcome. | ☐ |
  | **Domain** | Factor is absent in the specific domain of application. | ☐ |
  | **Heuristic** | Factor is known to be false; assumption retained for tractability until a superior theory is available. | **☑** |

  **5. Methodological Justification**
  Critics often contend that Heuristic assumptions cannot support policy analysis or long-term forecasting, as they lack structural fidelity. Axiom Global rejects this limitation. So long as the mapping between input variables and output predictions remains stable, the internal mechanism is functionally opaque. The firm acknowledges that a superior theory describing actual cognitive processes may eventually emerge. Until such a theory demonstrates superior predictive power at comparable computational cost, the heuristic placeholder remains the industry standard.

  **6. Limitations on Policy Intervention**
  While RAC-4 is validated for forecasting under *ceteris paribus* conditions, clients should exercise caution when modelling responses to novel policy interventions. Because the model assumes agents optimize based on current information sets, it does not explicitly account for changes in agent expectations resulting from the policy regime itself (the Lucas Critique). However, historical calibration suggests that expectation shifts often converge rapidly to the rational equilibrium predicted by RAC-4. Therefore, the firm maintains that the heuristic assumption remains robust for most planning horizons.

  **7. Liability**
  Axiom Global Forecasting guarantees the mathematical consistency of the RAC-4 engine. We do not guarantee that human beings are rational. We guarantee that, for the purposes of your portfolio, they might as well be.

  ***

  **Editorial Note**

  I am moderately confident that this artefact captures the spirit of Friedman's *instrumentalism*—specifically the claim that predictive success validates unrealistic assumptions—while adhering to your constraint regarding the "heuristic" taxonomy. However, there is a tension here: Friedman argued that unrealistic assumptions are often *necessary* for significant theories, not merely temporary placeholders waiting for a "better" theory. By classifying the assumptions as "Heuristic" (Category 3 in your prompt), the firm admits they are false and temporary, which weakens the Friedmanite defense that they are functionally true enough for forever. I leaned into this classification because your prompt identified it as the point where the defense falls apart.

  The single point I am least sure I have got right is the treatment of the Lucas Critique in Section 6. Friedman himself was wary of the Lucas Critique's implications for Keynesian models, but a strict "as if" model often struggles to accommodate structural breaks caused by policy changes. I tried to hint at this vulnerability without breaking the deadpan tone, but a methodologist might argue a true Friedmanite would claim the model *does* account for expectations because it predicts the outcome correctly, regardless of the mechanism. I chose to have the firm admit the limitation to highlight the risk of using heuristic assumptions for policy, which serves your package's theme.
