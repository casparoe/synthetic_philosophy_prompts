answer: |-
  You have spotted the central pathology of infinite population ethics. Your intuition is correct: this is precisely the Riemann Rearrangement Theorem wearing a moral hat, and the "move" you are describing is a well-known methodological sin in the field, though it lacks a single canonical Latin name like *ad hominem*.

  Here is the concept pinned down, using the terminology that bridges your physics background with the philosophical literature.

  ### 1. The Structural Name: Order-Dependence
  In the literature on infinite utility streams (e.g., work by Vallentyne, Kagan, Bostrom, Arntzenius), the formal property you are identifying is **Order-Dependence**.

  In finite ethics, Total Utilitarianism relies on the sum of utilities. In standard analysis, the sum of a finite series is invariant under permutation. In infinite ethics, if the series of utilities is only *conditionally convergent* (or divergent), the "sum" (moral value) depends on the order in which you aggregate the values.

  *   **Summation by Time:** You add up utility slice-by-slice ($t_1, t_2, t_3...$). This often yields a verdict based on temporal distribution (e.g., "early suffering is worse").
  *   **Summation by Person:** You add up utility person-by-person ($p_1, p_2, p_3...$). This often yields a verdict based on cardinality (e.g., "more happy people is better").

  Because the moral "sum" is order-dependent, there is no unique value for the outcome. The "move" you are seeing is **switching the aggregation order** (the indexing scheme) mid-argument to secure a desired verdict.

  ### 2. The Cosmology Bridge: The Measure Problem
  Since you come from physics, the most accurate label for this is **The Measure Problem**.

  In cosmology, when dealing with an eternal inflation multiverse, every possible outcome happens infinitely many times. To make predictions, you must introduce a "measure" (a regularization scheme) to render the infinities comparable. Different cutoffs/measures yield different probabilities.

  In infinite ethics, the "measure" is the **aggregation function**.
  *   When the philosopher says "both have $\infty$ happy people, so they are equal," they are using a **Cardinal Measure** (comparing the size of the sets).
  *   When they say "the one with early suffering is worse," they are using a **Temporal Measure** (often implicitly invoking a discount rate or a Pareto principle over time slices).

  The "move" is **Gerrymandering the Measure**. It is selecting a regularization scheme *ex post* to recover pre-theoretic intuitions, rather than deriving the verdict from a fixed, *ex ante* measure.

  ### 3. The Rhetorical Name: Motivated Formalism
  While there is no single fallacy name, critics of this practice (such as Jacob Barrett, Christian Tarsney, or earlier, Alan Hájek) describe it as **Motivated Formalism** or **Ad Hoc Axiomatization**.

  It is distinct from the boring complaint that "infinite values are hard to add up."
  *   **The Boring Complaint:** "We lack the mathematical tools to compare these worlds." (Epistemic humility).
  *   **The Move You Identified:** "We have the tools, but we will swap tools depending on which one validates our intuition in this specific case." (Methodological inconsistency).

  The boundary case is **Ex-Ante Commitment**.
  *   **Legitimate:** "I am a Time-Discounting Utilitarian. I commit *now* that temporal order matters. Therefore, in Case A and Case B, temporal order decides." (Consistent, even if you disagree with the axiom).
  *   **The Move:** "In Case A, cardinality decides (ignoring time). In Case B, temporal order decides (ignoring cardinality)." (Inconsistent).

  ### 4. Why It Happens: The Impossibility Theorems
  The reason you see this "cheating" so often is that it is not just laziness; it is often forced by **Impossibility Theorems** in infinite ethics (analogous to Arrow's Theorem in social choice).

  It has been proven that you cannot satisfy a set of seemingly obvious axioms (e.g., Strong Pareto, Anonymity, Separability) simultaneously in an infinite context. You *must* drop one.
  *   To say "$\infty = \infty$" (flattening differences), you are usually prioritizing **Anonymity** (who/when doesn't matter, only the set size).
  *   To say "early suffering matters," you are prioritizing **Strong Pareto** (if everyone is better off at $t_1$, the world is better).

  These axioms are mutually incompatible in infinite domains. The "move" you are spotting is philosophers quietly swapping which axiom they are violating to avoid an unpalatable conclusion, without admitting they are dropping an axiom.

  ### Summary Definition
  The move is **Inconsistent Aggregation Ordering** (or **Measure Gerrymandering**) within the context of the **Extension Problem**.

  *   **The Extension Problem:** The difficulty of extending finite moral principles to infinite domains.
  *   **The Move:** Exploiting the **Order-Dependence** of infinite sums to toggle between **Cardinal Comparison** (set size) and **Structural Comparison** (distribution/time) without a principled rule for when each applies.
  *   **The Boundary:** It stops being this move and starts being legitimate theory-building when the author explicitly states their **Aggregation Axiom** (their "measure") *before* analyzing the cases, and accepts the consequences of that axiom even when it yields counter-intuitive results.

  You are effectively watching people try to solve a conditionally convergent integral by choosing the limit process that gives the answer they wanted before they started calculating.
