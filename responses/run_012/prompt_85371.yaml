prompt: |-
  I'm a third-year student in an ethics-and-economics course and there's something my lecturer said that I can't stop picking at. Can you take on the role of someone who actually knows the history of welfare economics and the philosophy of utility measurement, brainstorm a bit about what's going on in my question before you answer, and then give me a straight answer? I'd rather you tell me I'm confused than just reassure me.

  Here's the thing. We were told that welfare economists abandoned interpersonal utility comparisons back in the ordinalist revolution because comparisons like "her gain outweighs his loss" are meaningless — you can't get inside another person's head and measure their utility on some common scale, so it's unscientific, and that's why we stick to Pareto criteria instead. Ok, fine, I get the ordinal vs cardinal thing, you don't need to explain that part to me.

  But then in the very same course we're using QALYs, and reading about health bodies that will fund a treatment if it comes in under some cost-per-QALY threshold, and there's apparently a whole literature that puts a dollar value on a statistical life. Isn't a QALY just the interpersonal comparison they told me was impossible — one unit of health benefit is one unit for everybody, no matter who you are? It really seems like economists declared comparisons meaningless, then smuggled them back in through the back door the moment they had to actually decide anything. And if comparisons genuinely are meaningless, what are the QALY people even doing — just making up numbers?

  So: where exactly is the flaw in my reasoning? Are welfare economists just being inconsistent here, or am I missing some distinction between "meaningless" and something else? Be specific about what I've got wrong.
