      *   *Is the student wrong?* The student is right that there is a contradiction in *strict* welfare economics. But applied economics accepts the contradiction to function. I need to validate their suspicion while explaining the professional resolution.
      *   *Make sure to address VSL.* VSL is based on revealed preference (wage-risk trade-offs), which is different from QALYs (standard gambles/time trade-off). Both imply comparability but derive it differently.
      *   *Final check on the "flaw":* The flaw is thinking economists claim QALYs are *scientific facts* in the same way they claim demand curves are. They don't. They claim QALYs are *policy conventions*.

