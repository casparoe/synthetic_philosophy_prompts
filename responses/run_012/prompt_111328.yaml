answer: |-
  There is no single, canonical term for this specific configuration in moral psychology or ethics. You are standing at an intersection where **theodicy** (natural evil), **moral psychology** (agent detection), and **environmental ethics** (wild animal suffering) meet, but each discipline only captures one face of the phenomenon.

  In the wild animal suffering (WAS) literature, this is often discussed under the banner of the **"Appeal to Nature"** fallacy or **"Status Quo Bias,"** but these are normative labels (criticizing the reasoning) rather than descriptive ones (naming the perception). In cognitive science, the closest mechanism is **Hyper-active Agency Detection (HADD)** combined with **Baseline Normalization**.

  If a name were to be coined for the *phenomenological experience* you describe, it might be **"Agent-Relative Moral Salience"** or **"The Baseline Blindness."** But since you asked for a carving rather than a label, I will attempt to map the boundaries, the variables, and the fault lines.

  ### 1. The Carving: Deviation vs. Agency

  Your deer example is the scalpel. Let us dissect the three variables you identified: **Authorship** (someone did it), **Moral Agency** (someone could have done otherwise), and **Normality** (this is how the system works).

  You noted that an earthquake (No Author, No Agency) grips you, while starvation (No Author, No Agency) does not. This suggests **Authorship is not the primary driver.** If Authorship were the key, the earthquake and the starvation should elicit similar responses. They do not.

  Therefore, the primary carving is not between *Agent* and *System*, but between **Deviation** and **Baseline.**

  *   **The Baseline (Background):** Suffering that is perceived as the *ordinary output* of a system. This includes predation, starvation, disease, and drought. Because these are statistically frequent and functionally necessary for the system's continuity (in an evolutionary sense), the moral mind categorizes them as *environment*, not *events*. They are the stage, not the play.
  *   **The Deviation (Event):** Suffering that represents a *disruption* of the expected order. This includes a hunter killing a deer (social disruption), an earthquake killing a person (geological disruption), or an oil spill (ecological disruption).

  **The Hypothesis:** Your moral attention is not triggered by *harm* per se, but by **violation of expectation.**
  *   **Hunter:** Violates social/legal norms. (High Salience)
  *   **Earthquake:** Violates geological safety norms. (High Salience)
  *   **Wolf:** Fulfills ecological norms. (Low Salience)
  *   **Starvation:** Fulfills ecological norms. (Low Salience)

  This explains why the wolf (Author, No Moral Agency) feels different from the hunter. The wolf is part of the "natural baseline." The hunter is an intruder on that baseline.

  ### 2. Neighbouring Ideas and Where They Blur

  To understand the edges, we must distinguish this from concepts it resembles but is not identical to.

  *   **Omission Bias:** The belief that harm by action is worse than harm by inaction.
      *   *Distinction:* Omission bias requires a moral agent who *could* have acted. Starvation in the wild involves no agent to omit action. Yet you feel less concern for the starvation than the hunter. This suggests your reaction is deeper than Omission Bias; it is a failure to register the suffering as a *moral situation* at all.
  *   **Psychic Numbing (Compassion Fade):** The inability to grasp large numbers.
      *   *Distinction:* You noted that even a *single* tadpole drying up moves you less than a *single* trapped animal. This confirms the issue is not quantity, but *category*.
  *   **The Naturalistic Fallacy:** The belief that because something is natural, it is good.
      *   *Distinction:* You do not necessarily believe the starvation is *good*. You believe it is *given*. The fallacy is prescriptive ("we ought not intervene"); your phenomenon is perceptual ("I do not see this as a call to action").
  *   **Just-World Hypothesis:** The belief that the world is orderly and people get what they deserve.
      *   *Distinction:* This usually applies to human social justice. In nature, it manifests as **Teleological Thinking**: the subconscious assumption that natural systems have a purpose and that suffering within them serves that purpose (e.g., "culling the weak").

  ### 3. Is This One Phenomenon or Several?

  It is likely **two distinct cognitive mechanisms fused by evolution.**

  1.  **The Social Contract Module:** Evolved to detect cheaters and norm-violators within a tribe. This handles the *Hunter* case. It requires Agency.
  2.  **The Threat Detection Module:** Evolved to detect anomalies in the environment (predators, disasters). This handles the *Earthquake* case. It requires Deviation.

  **The Fusion:** Wild animal suffering falls into the blind spot *between* these modules.
  *   It is not a social violation (no human agent), so Module 1 sleeps.
  *   It is not an environmental anomaly (it is the normal state of nature), so Module 2 sleeps.

  The "phenomenon" you are experiencing is the **silence of both modules.** It is not that you are actively suppressing the moral claim; it is that the claim never reaches the threshold of "eventhood."

  ### 4. The Edges: Where the Distinction Fails

  The edge of this concept lies where **Normality** and **Agency** come apart.

  *   **Edge Case A: Systemic Human Harm.**
      Consider traffic fatalities. They are caused by humans (Agency), but they are statistically normal (Baseline). We accept ~1.3 million deaths per year globally as "the cost of mobility." We do not react to traffic deaths with the same horror as a mass shooting.
      *   *Implication:* This supports the **Baseline/Deviation** carving over the **Agency** carving. If Agency were key, traffic deaths would horrify us as much as murder. They do not. They are "background noise."
  *   **Edge Case B: Charismatic Disruption.**
      If a volcano kills a herd of elephants, it may grip you more than a volcano killing a herd of wildebeest.
      *   *Implication:* This suggests a third variable: **Identifiability/Value.** The "Baseline" can be overridden by emotional proximity.

  ### 5. What Would Change My Mind

  You asked for falsifiability. Here is where my reasoning is most vulnerable, and what evidence would force a re-carving.

  **A. The Cultural Variance Test (Anthropology)**
  *   *My Assumption:* I am assuming this is a universal feature of human moral psychology (evolutionary).
  *   *What Changes My Mind:* If ethnographic study shows cultures that *do* experience intense moral distress over natural predation or starvation (e.g., cultures with strong animist beliefs where every death is a spiritual event requiring restitution). If such cultures exist and function without cognitive dissonance, then this is not a cognitive limitation but a **cultural conditioning** specific to secular/industrialized worldviews.
  *   *Failure Point:* Assuming the "Baseline" is objective rather than culturally constructed.

  **B. The "Traffic Death" Counter-Example (Psychology)**
  *   *My Assumption:* That "Normality" is the dominant variable suppressing moral concern (as argued above).
  *   *What Changes My Mind:* If studies show that when human-caused systemic harm (like traffic or factory farming) is explicitly framed as "abnormal" or "preventable," concern rises *disproportionately* compared to natural harm framed the same way.
      *   *Specific Test:* If I tell you a deer starved because a *natural* winter was harsh, you feel little. If I tell you a deer starved because *climate change* made the winter harsh, does your concern spike?
      *   *If Yes:* Then **Authorship** (even diffuse, systemic human authorship) is the real trigger, not Normality. We care about human-caused harm, even if systemic. We ignore nature-caused harm, even if acute.
      *   *If No:* Then **Normality** is the true driver. We ignore anything that feels "inevitable," regardless of cause.

  **C. The Single Phenomenon Assumption (Metaphysics)**
  *   *My Assumption:* That there is a coherent "moral perception" to be had here.
  *   *What Changes My Mind:* If it turns out that "suffering" in the wild is metaphysically distinct from "suffering" in humans in a way that *justifies* the differential response, rather than just explaining it psychologically.
      *   *Example:* If future neuroscience shows that tadpole nociception lacks the integrated consciousness required for "suffering" in the moral sense, whereas human stroke victims possess it.
      *   *Why:* You stated you believe the suffering is bad "with the same seriousness." If the *reality* of the suffering is different, your perception isn't biased; it's accurate. My analysis assumes the harm is equal and the perception is flawed. If the harm is unequal, the phenomenon is not a bias, but a **discrimination.**

  ### Summary of the Carving

  The phenomenon is **Baseline Normalization of Non-Agentive Harm.**

  *   **Core Mechanism:** Moral attention is a change-detector, not a utility-meter. It flags *violations* of the expected order, not the *sum* of pain within that order.
  *   **The Boundary:** The line falls between **Event** (disruption) and **Process** (continuity).
  *   **The Confusion:** We mistake this for an **Agent** distinction because, in human social life, Agents are the usual source of Disruptions. In nature, Systems are the source of Process.
  *   **The Risk:** By treating natural suffering as "Process," we render it invisible to moral intervention, effectively granting nature a "sovereign immunity" we grant to no human government.

  If you wish to test this in yourself: Monitor your reaction to **traffic fatalities**. They are human-authored, but systemic and normal. If you feel for them what you feel for the stroke victim, then Agency is your key. If you feel for them what you feel for the tadpoles, then Normality is your key. My prediction is the latter.
