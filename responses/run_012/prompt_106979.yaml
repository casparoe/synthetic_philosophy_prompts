      *   *Selection:* I will advocate for the **Performative Authority Transfer** model with **Vitiating Factors**. It's the only one that allows society to function. I must tell the user to abandon the "mental state" definition in Case 9.

      *   *Addressing Case 6 (Lover vs. Rich):* This is the "Fraud in the Factum" distinction. Lying about *what* is happening (sex within a relationship vs. casual sex) vs. *why* (rich vs. poor). Actually, legally, lying about love is usually not rape. But morally? I need to be honest. The principle struggles here. I should highlight this as a boundary condition.

      *   *Addressing Case 9:* This is the biggest clash. Performative vs. Mental. I need to tell them: You have to choose. If you choose Mental, you break social trust. If you choose Performative, you allow some internal violations. The law chooses Performative.

