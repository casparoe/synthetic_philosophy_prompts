answer: |-
  This is a classic philosophical knot. You are wrestling with the distinction between **consent as a mental state** (subjective willingness) and **consent as a social speech-act** (objective authorisation). Your intuition is pulling you towards the former, but your practical judgments (especially in the boxing and regret cases) rely on the latter.

  Here is the principle that best fits eight of your nine calls, followed by the specific sacrifice it demands.

  ### The Principle: "Protected Agency"

  **Consent is a performative act of transferring authority, which is valid provided the consenter retains substantive control over the decision.**

  Substantive control is lost if any of three **vitiating factors** are present:
  1.  **Incapacity:** The physical or cognitive inability to process the decision (Sedated Patient).
  2.  **Coercion:** The imposition of illegitimate threats that worsen the consenter's baseline options (Mugging, Employee).
  3.  **Material Deception:** Falsehoods regarding the nature of the act or conditions explicitly required for consent (Study, Jargon, potentially Lover).

  Under this model, consent is not a feeling; it is a **transaction of permission**. It functions like a signature on a contract. We treat it as valid externally so that society can function, but we void it if the "signing" process was corrupted by a lack of agency.

  ### How it handles your calls

  *   **Boxing:** Valid. Agency intact, no vitiating factors. Social licence granted.
  *   **Mugging:** Invalid. Coercion (threat of violence) removes control.
  *   **Sedated Patient:** Invalid. Incapacity removes control.
  *   **Jargon Patient:** Invalid. Material deception (via obfuscation) prevents informed control.
  *   **Study:** Invalid. Material deception regarding the nature of the act.
  *   **Employee:** Invalid. Coercion (implicit threat to livelihood) worsens baseline options.
  *   **Guilt Loan:** **Explains your ambivalence.** If the lender *leveraged* the guilt ("You owe me because of what you did"), it is coercion. If the borrower offered it freely to assuage their own conscience, agency remains. Your gut flips because you are unsure who owns the pressure.
  *   **Internal Regret:** **Valid.** The act was performed, agency was present at the time, no vitiating factors existed. The internal state is irrelevant to the validity of the transfer.

  ### The Sacrifice

  To keep this principle, you must abandon your stated view on **Case 9 (Internal Regret)**.

  You wrote: *"my stated view is that consent is about what's going on in his head, and those two can't both be right."*

  You are correct. They cannot both be right. If you define consent purely as a mental state, you break the Boxing case (what if he secretly didn't want to hit but did it for money?) and you make social coordination impossible (no one can ever know if they have consent).

  **You have to choose:** Is consent a private feeling or a public signal?
  *   If it is a **private feeling**, the Mugging victim technically consents if they mentally submit to save their life (which feels wrong), and the Regret case is non-consensual (which makes every breakup a potential violation).
  *   If it is a **public signal** (my recommendation), you must accept that sometimes people validly consent to things they privately dislike. Consent is about **authority**, not **enthusiasm**.

  ### The Hard Case: The Lying Lover (Case 6)

  This is where the principle strains. Under "Protected Agency," lying about love is only invalid if love was a *condition* of the consent.
  *   **Lying Rich:** This is fraud in the *inducement*. You agreed to sex; the wealth was just a reason. Your agency over the *act* was intact.
  *   **Lying Lover:** This is arguably fraud in the *factum* (the nature of the thing). If you agree to "making love within a relationship" and you get "casual sex," the act itself is different than what was authorised.

  **The Verdict:** To save the Lover case as "invalid," you must add a clause: **Deception invalidates consent if it concerns a feature that defines the moral character of the act for the consenter.**
  *   *Risk:* This is subjective. How do the parties know what defines the act?
  *   *Honesty:* This is the weakest link in the chain. The law usually treats lying about love as valid consent (however morally repugnant). If your gut says it's invalid, you are holding a higher moral standard than the legal one, requiring a "duty of care" from the consent-taker to be honest about emotional intent.

  ### Summary of the Variable

  You asked if there is one variable. It is **Control**.
  *   Boxing: You control the fight.
  *   Mugging: You lose control to the knife.
  *   Jargon: You lose control to the complexity.
  *   Regret: You had control at the time; you just changed your mind later.

  ### Where this reasoning might fail

  1.  **Power Imbalances:** My principle treats the Employee case as coercion. But in a capitalist society, is *any* employment truly voluntary? If we say "economic necessity" is coercion, almost all labour contracts become invalid. I have drawn a line at "illegitimate threats" (boss implying firing) vs "hard choices" (need money to live). That line is fuzzy.
  2.  **The "Cooling Off" Problem:** In the Regret case, I prioritise the moment of action. But what if the regret comes from realising something the person couldn't have known? (e.g., they find out later the partner had an STI). That shifts it back to the Deception category. If there is no new info, just regret, the principle holds.
  3.  **Cultural Context:** In some contexts, silence *is* refusal. My principle assumes a default where "acting like it" implies consent. In high-stakes sexual ethics, some argue silence is never consent. My model requires a shared social language of signals; if that language is broken, the performative model fails.

  ### What would change my mind?

  I would abandon the "Performative/Control" model if you could demonstrate a case where **upholding the external act causes demonstrable harm that outweighs the social benefit of certainty.**

  For example: If we can show that treating the "Lying Lover" case as valid consent systematically encourages predatory behaviour that damages the institution of relationships themselves, then we might need to shift towards a "Duty of Care" model, where the consent-taker is responsible for ensuring the consenter's mental state matches the act, not just their words.

  ### Final Advice

  Stop trying to define consent as "what is going on in his head." That is a description of **desire**, not consent. Consent is the **bridge** between two heads.

  *   **Keep:** The view that consent is a performative act requiring capacity, information, and voluntariness.
  *   **Abandon:** The idea that private regret invalidates past consent.
  *   **Accept:** The Lying Lover case is a moral wrong, but legally/structurally distinct from the Mugging. It is a breach of trust, not necessarily a violation of bodily autonomy, unless you can prove the deception changed the *nature* of the act agreed to.

  You are noticing the confusion because you are trying to make consent do two jobs: protect bodily autonomy (mental state) and facilitate social interaction (performative act). It can't do both perfectly. Prioritise the protection of agency (Control), and accept that feelings are secondary to the transaction.
