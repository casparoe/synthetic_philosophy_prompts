  - *Rating:* Mostly Right. It accurately states the implication of naive EV maximization and the intuitive rejection. "Broken" is debatable but defensible in this context.

  **Move (2) Theo:** "no it isn't. No casino can offer it in the first place, because the payout is unbounded. A paradox about a game nobody can actually run isn't evidence against the theory. And there's the standard fix anyway, diminishing marginal utility — value money on a log scale, or just cap the payout at what the house can afford, and the expected value comes out finite and modest, a few bucks, which is what everyone already says the game is worth."
