  So my two friends Ana and Theo got into it at a party last weekend about the St. Petersburg game, and I was standing right there and couldnt referee it, so I'm outsourcing. Setup in case it matters: fair coin, flip until the first tails, and if tails first shows on toss n you win 2^n dollars. They both know the expected value is infinite. What they don't agree on is what that shows.

  (1) Ana: it's a straight counterexample to expected-value reasoning. The theory says you should pay any finite amount to play. That's insane, so the theory is broken.

  (2) Theo: no it isn't. No casino can offer it in the first place, because the payout is unbounded. A paradox about a game nobody can actually run isn't evidence against the theory. And there's the standard fix anyway, diminishing marginal utility — value money on a log scale, or just cap the payout at what the house can afford, and the expected value comes out finite and modest, a few bucks, which is what everyone already says the game is worth.

  (3) Ana: capping isn't a fix, it's a different game. Of course a capped game has a finite expected value, you built it that way. And the log thing just moves the bump. If utility is unbounded, I'll re-denominate: whatever prize your utility function says is worth n utils, offer me that as the prize when tails lands on toss n+1. Same structure, infinite expected utility, your log trick did nothing.

  (4) Theo: then the lesson is that utility has to be bounded, not that expected value is broken. Bounded utility, expected utility maximization survives fine, paradox gone.

  (5) Ana: bounded utility is its own reductio, and it doesn't even touch the version that actually bothers me. New game: you only get paid if you flip at least 40 heads in a row, and then you get 2^n; otherwise nothing. Expected value is still infinite. Almost surely you walk away with zero, every time, practically. A theory that tells you to hand over any finite sum for that is telling you to do something insane, and not because the game is impossible, but because the whole value of the thing lives in branches that will never happen.

  (6) Theo: first, the long run isn't as empty as you're making it sound — the average payoff over n plays really does go off to infinity as n grows, so the infinite expectation isn't a bookkeeping artifact, it shows up in how the game behaves. Second, you can say that about any gamble with a big upside. Third, you can't get an infinite expected value out of a bounded payout, so you still need an impossible casino.

