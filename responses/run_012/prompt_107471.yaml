  #### Case 2: In-Group Slur
  *   **Facts:** A member of a racial minority uses a racial slur against another member of the same minority in a private group thread, screenshot and reported by an outsider.
  *   **Step 1 (Jurisdictional Floor):** Unlawful? **No.**
  *   **Step 2 (US Categories):** Incitement/Threat? **No.**
