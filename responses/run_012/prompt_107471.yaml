  ### II. Application to Cases

  Here is how the procedure runs on your three pending appeals.

  #### Case 1: Atrocity Denial (Academic Revisionism)
  *   **Facts:** Post argues a specific historical atrocity was exaggerated. Written in academic register. User is located in Germany (where denial is criminal). Reported by US users.
