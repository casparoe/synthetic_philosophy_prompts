  *   **Analysis:** The procedure recognizes that dignity is context-dependent. A slur used *by* a group does not necessarily undermine that group's standing in the way a slur used *against* them does. This honors the US insight that context determines harm.
  *   **Transparency Note:** "Content retained. While language is offensive, context indicates in-group reclamation not intended to undermine equal standing."

