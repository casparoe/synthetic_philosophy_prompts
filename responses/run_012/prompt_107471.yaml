answer: |-
  **Memorandum**

  **To:** Chair, Speech-Review Panel
  **From:** Senior Advisor
  **Subject:** Decision Procedure for Appeals (US/EU Jurisprudential Conflict)

  You have inherited a contradiction. Your Charter promises viewpoint neutrality (a distinctly American liberal commitment) while simultaneously promising strict compliance with European dignity-based laws (which require viewpoint discrimination). You cannot keep both promises. The procedure below does not solve this; it manages the casualty rate. It is designed to be fast enough for your two-week clock, robust enough for your transparency report, and honest enough that when you break a promise, you know which one you broke.

  ### I. The Decision Procedure: "The Compliance-First Dignity Filter"

  This procedure operates as a sequential filter. A post must pass every step to remain up. If it fails any step, it is removed.

  **Step 1: The Jurisdictional Floor (Legal Compliance)**
  *   **Question:** Is this content criminal or civilly unlawful in *any* jurisdiction where we operate (US, DE, FR, NL)?
  *   **Source:** Legal Team's "Unlawful List" + Panel verification of new appeals.
  *   **Standard:** *Strict Liability.* If the content violates a memory law (DE/FR), group libel statute (DE), or incitement law (all), it fails.
  *   **Decision Rule:** **Global Removal.**
      *   *Rationale:* You asked whether to run one global rule or several. Geo-blocking is technically leaky, operationally expensive, and creates a "whack-a-mole" dynamic that exacerbates your backlog. To meet Promise 2 (Legal Compliance) without drowning in jurisdictional arbitrage, you must apply the strictest applicable law globally.
      *   *Pressure Handled:* **Geolegal Fragmentation.** This choice prioritizes legal safety over US speech norms. It acknowledges that a global platform cannot sustain a "legal in California, illegal in Berlin" architecture without fracturing the community experience or risking liability.
  *   **Termination:** If **Yes** (Unlawful), Remove. Stop.
  *   **If No** (Lawful everywhere), Proceed to Step 2.

  **Step 2: The American Categorical Exceptions (Harm Principle)**
  *   **Question:** Does this content fall into a narrow, unprotected category under US First Amendment doctrine?
  *   **Categories:**
      1.  **Incitement:** Intent to produce *imminent* lawless action + likelihood of such action.
      2.  **True Threats:** Serious expression of intent to commit unlawful violence against a specific individual/group.
      3.  **Harassment:** Targeted, severe conduct intended to silence or intimidate (not merely offend).
  *   **Standard:** *Reasonable Observer.* Would a reasonable person view this as a call to immediate violence or a credible threat?
  *   **Decision Rule:** If **Yes**, Remove.
  *   **Termination:** If **Yes**, Remove. Stop.
  *   **If No**, Proceed to Step 3.

  **Step 3: The European Dignity Test (Equal Standing)**
  *   **Question:** Does this content attack the human dignity or equal standing of a protected group (race, religion, national origin, etc.)?
  *   **Standard:** *Reasonable Member of the Target Group.* Would a reasonable member of the depicted group feel their right to participate in public life as an equal is undermined by this post?
  *   **Decision Rule:** If **Yes**, Remove.
      *   *Pressure Handled:* **Who Decides.** This step explicitly rejects US viewpoint neutrality. It empowers the Panel to judge the *content* of the viewpoint, not just the *manner*. It accepts the European premise that neutrality in the face of dignity-attacks is complicity.
  *   **Termination:** If **Yes**, Proceed to Step 4 (Exemptions).
  *   **If No** (No dignity attack), Proceed to Step 5.

  **Step 4: The Contextual Exemption (Artistic/Political/Reclamation)**
  *   **Question:** Is the dignity attack (identified in Step 3) mitigated by context, intent, or reclamation?
  *   **Sub-Questions:**
      1.  **Reclamation:** Is the slur used by members of the targeted group in an in-group context?
      2.  **Satire/Art:** Is the primary intent political satire or artistic expression, rather than dehumanization?
  *   **Standard:** *Authorial Intent + Community Context.*
  *   **Decision Rule:** If **Yes** (Exemption applies), Keep. If **No**, Remove.
  *   **The Handoff Point:** If the Panel cannot agree on whether something is "Satire" or "Hate," or "Reclamation" or "Self-Hate," **stop the procedure.** This is no longer a rule application; it is a policy choice. Escalate to a full Panel vote with a dissenting opinion published in the transparency report.
  *   **Termination:** If Exemption Granted, Keep. Stop.
  *   **If No Exemption**, Remove. Stop.

  **Step 5: The Offense Check (Charter Promise 1)**
  *   **Question:** Is the *only* reason to remove this post that it is offensive, disgusting, or false?
  *   **Decision Rule:** **Keep.**
      *   *Pressure Handled:* **Charter Contradiction.** This step is where you admit Promise 1 (No removal merely for offense) is voided by Steps 1 and 3. If a post survives Steps 1-4, you must let it stand, even if it is repellent. If you remove it here, you are lying in your transparency report.
  *   **Termination:** Keep. Stop.

