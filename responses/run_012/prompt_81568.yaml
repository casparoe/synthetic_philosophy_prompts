answer: |-
  Consequentialism demands that agents assess acts by their outcomes, yet the epistemic problem of cluelessness suggests such assessment is often impossible. Philosophers distinguish between ordinary uncertainty, where outcomes are enumerable and probabilities assignable, and deep cluelessness, where effects are diffuse or sensitive to distant contingencies. In the latter case, expected-value reasoning becomes a formalism without traction. Frank Capra's film functions as a philosophical thought experiment that initially appears to solve this problem through divine intervention, yet ultimately reveals the structural impossibility of consequentialist certainty for finite agents. By granting the protagonist a view of the counterfactual world, the film dramatizes the epistemic gap while simultaneously stipulating it away, offering a fantasy resolution that highlights the severity of the actual human condition.

  The angelic device supplies the protagonist with an epistemic good unavailable to human agents: a verified counterfactual oracle. In reality, agents must act under conditions of deep cluelessness, unable to trace causal chains beyond the immediate horizon. The film resolves this by making the invisible visible, showing the specific differences made by the protagonist's existence. However, this revelation arrives only after the moral decisions have been made and the crisis reached. Consequently, the film confirms that objective consequentialist evaluation requires a perspective outside of time, accessible only retrospectively. It supports the claim that real-time moral decision-making cannot rely on total consequence calculation, as such knowledge is structurally withheld from the agent until action is impossible. The subjective standard of what the agent could reasonably expect is bypassed entirely; the film insists on the objective truth of the consequences, yet denies the agent access to it during the moment of choice.

  Furthermore, the vision provided is radically truncated to avoid the indeterminacy of deep cluelessness. The counterfactual comparison is limited to one town, one lifetime, and a handful of named relationships. It excludes distant strangers, future generations, and non-human effects. This narrowing of the window is necessary to make the verdict determinate. If the scope were widened to include the infinite causal ripples of a single life, the calculation would dissolve back into deep cluelessness. The film resists the full force of the problem by assuming a closed system where consequences terminate within the narrative frame. This suggests that consequentialist clarity is purchasable only by ignoring the indefinite extendibility of causal chains. The film supports the intuition that local effects are knowable, but complicates the consequentialist claim that total effects are what matter.

  The choice of baseline further manipulates the moral accounting to ensure a positive verdict. The protagonist is compared against his own non-existence, the most flattering comparison available. He is not compared against the alternative life he desired, such as leaving town to build elsewhere. By selecting non-existence as the baseline, the film ensures a positive verdict without addressing opportunity costs. A principled consequentialist evaluation requires comparing the act against feasible alternatives, not against nothingness. The film's choice does invisible moral work, securing a favorable judgment by rigging the comparison class. This highlights how baseline selection can reverse verdicts, yet the film treats the chosen baseline as natural rather than contested. It resists the hard consequentialist question of whether staying was truly the utility-maximizing choice compared to leaving.

  Additionally, the counterfactual world functions as a moralized tableau rather than a neutral welfare comparison. The alternative town is depicted as vicious, characterized by greed and vice, rather than merely less happy. This conflates consequentialist outcomes with virtue-ethical judgments. The film assumes that certain ways of living are inherently worse, independent of aggregate utility. This tells us that consequences are never valued neutrally; they are filtered through prior normative commitments. The film supports the idea that valuation is theory-laden, but resists the consequentialist attempt to separate outcome value from moral character. The visible causal chains provided, such as preventing a poisoning or saving a sibling, are narrative simplifications. Real agents never see such neat lines of causality. The film relies on these traces to make consequence tracking plausible, revealing that storytelling requires linear causality that reality denies.

  Ultimately, the resolution shifts from aggregative consequences to relational recognition. The protagonist's relief comes not from calculating total utility, but from being known and loved by the community. The ending suggests that moral worth is found in social bonds rather than invisible causal impacts. This relocation saves the agent from cluelessness by changing the metric of worth. The film confirms the epistemic problem by showing that solving it requires a miracle, yet relocates the solution from knowledge to community. It demonstrates that without the oracle, the agent remains in the dark, but that the dark might be bearable if the metric shifts from consequences to relationships.

