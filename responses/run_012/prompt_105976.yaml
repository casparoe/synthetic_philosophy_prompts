answer: |-
  **1. Examination Question**

  **Time Allowed:** 60 Minutes
  **Word Limit:** Approximately 800 Words
  **Instructions:** Answer ONE question. No books, notes, or bibliographies permitted.

  **Question 1**

  In *Nicomachean Ethics* V.5, Aristotle makes the following claims regarding money and commensurability:

  > 'Money then serves as a measure which makes things commensurable and so reduces them to equality.'
  >
  > 'Though therefore it is impossible for things so different to become commensurable in the strict sense, our demand furnishes a sufficiently accurate common measure for practical purposes.'

  Consider the tension between the first sentence's assertion of money's function and the second sentence's concession regarding strict commensurability. Analyze this tension using the following conceptual frameworks and cases provided in your course materials:

  *   **The Scaffolding Reading:** Money is an instrument that registers comparability existing independently of the practice. If currency fails to track these ratios, it is a defective instrument.
  *   **The Constitution Reading:** Goods are not comparable until a measure is in circulation. Money constitutes a single field of magnitudes; outside this practice, there is nothing for currency to be accurate about.
  *   **Case A:** A community with no currency where one ox is regularly exchanged for ten measures of grain, with stable expectations.
  *   **Case B:** A community with a single official currency where prices drift monthly with no detectable pattern.

  Explain what work money is doing in the first sentence and how the concession in the second alters that account. Evaluate whether the Scaffolding or Constitution reading better accommodates both sentences and the two cases. Finally, address whether "need" (demand) can serve as a common measure when needs are as heterogeneous as the goods themselves. Reach a definite verdict on which reading the passage supports or why the text leaves the choice open.

  ***

  **2. Model Answer**

  The tension in *Nicomachean Ethics* V.5 lies between money as a discoverer of value and money as a creator of value. The first sentence assigns money the active role of making things commensurable, implying a transformation. However, the second sentence admits that strict commensurability is impossible between heterogeneous goods, suggesting that "demand" (need) is the actual measure, with money serving only as a conventional substitute. This shift undermines the idea that money tracks pre-existing ratios.

  The Scaffolding Reading aligns with the first sentence but struggles with the second. If money merely registers comparability that is already there, then the impossibility of strict commensurability implies money is always fundamentally defective. On this reading, Case A is unproblematic: the ox-grain ratio exists independently of currency, and the community simply lacks the instrument to register it efficiently. However, Case B becomes a simple failure of instrumentation. The drifting prices indicate the currency is failing to track the independent ratios. The Scaffolding Reading cannot easily accommodate the concession that strict commensurability is impossible; if the ratios exist independently, they should be trackable in principle, even if practice is messy. The concession suggests there is nothing "there" to track in the strict sense.

  The Constitution Reading fits the concession better. If comparability is an achievement of exchange practice, then the impossibility of strict commensurability is expected. Money turns heterogeneous goods into a single field of magnitudes. In Case B, the drifting prices do not necessarily represent a failure to track independent truths; rather, they indicate a breakdown in the constitutive practice itself. Without stable demand or convention, the field of magnitudes dissolves. However, Case A poses a challenge for the Constitution Reading. If there is no currency, how is the ox-grain ratio constituted? The Constitution Reading must argue that the stable custom itself acts as the measure, effectively treating the ratio as a proto-currency. If it admits the ratio exists without any measure, it smuggles in the Scaffolding view.

  Crucially, Aristotle identifies need, not money, as what truly holds exchange together. Money is a convention representing demand. This complicates both readings. If need is the measure, can it measure heterogeneous goods? Needs are as diverse as the goods themselves. Aristotle resolves this by suggesting demand provides a "sufficiently accurate" measure for practical purposes, not strict truth. This supports the Constitution Reading: the measure is not found in the goods (Scaffolding) but is imposed by the reciprocal need of the participants within a political community. The comparability is real only insofar as the community sustains the practice of exchange based on mutual need.

  The distinction between natural and unlimited acquisition clarifies why Case B occurs. When acquisition becomes unlimited, money detaches from need. Prices drift because the measure (demand) is no longer bounded by household necessity but driven by unlimited profit. In Case A, exchange remains bounded by need, stabilizing the ratio even without currency.

  Verdict: The passage ultimately supports a modified Constitution Reading. The first sentence describes the functional appearance of money within a healthy exchange system, but the second sentence reveals the ontological reality: there is no strict commensurability independent of human demand. The Scaffolding Reading fails because it cannot account for the impossibility of strict commensurability without declaring all currency inherently false. The Constitution Reading succeeds because it locates comparability in the practice of exchange driven by need. Case A works because custom constitutes the measure; Case B shows what happens when the constitutive link to need is severed. Money does not read off ratios; it enacts them, grounded in the heterogeneous but reciprocal needs of the citizens.

  ***

  **3. Marking Scheme**

  **Total Marks: 20**

  | Point | Criteria | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1. Tension Analysis** | Clearly identifies the conflict between money as making things commensurable (Sentence 1) and the impossibility of strict commensurability (Sentence 2). | 4 | Treats the two sentences as consistent without explaining the concession. |
  | **2. Scaffolding Application** | Correctly applies the Scaffolding Reading to the text and cases (e.g., Case B as instrument failure, Case A as pre-existing ratio). | 4 | Claims Scaffolding fits the concession easily or ignores Case A. |
  | **3. Constitution Application** | Correctly applies the Constitution Reading to the text and cases (e.g., Case A requires custom as measure, Case B as constitutive breakdown). | 4 | Fails to explain how Case A works without currency under this reading. |
  | **4. Role of Need** | Addresses whether "need" can measure heterogeneous goods and links it to Aristotle's claim that demand holds exchange together. | 4 | States need is the measure without addressing the heterogeneity problem. |
  | **5. Verdict/Coherence** | Reaches a definite verdict on which reading fits best or explains the impasse, integrating the analysis of need and cases. | 4 | Hedges indefinitely or chooses a reading without justifying it against the concession. |

  ***

  **4. Note to the Second Marker**

  **Distinguishing A vs. B Answers**

  An **A answer** will treat the "Need" criterion as the decisive factor for the verdict. It will recognize that because needs are heterogeneous, the "measure" must be constitutive (created by the exchange relationship) rather than scaffolding (found in the goods), and it will use the Natural vs. Unlimited acquisition distinction to explain why Case B (drifting prices) happens. A **B answer** will mechanically apply the two readings to the two cases correctly but will fail to integrate the role of "need" into the final verdict, often treating money as the primary measure rather than a symbol of demand, or will hedge the verdict rather than committing to a interpretation of the concession.
