  **The problem, stated precisely**

  Fanaticism is the conclusion that rational choice must prioritize options with minuscule probabilities of astronomical value over certain, moderate goods. Formally, if an action has probability $p$ of utility $U$, and $p \times U$ exceeds the utility of a certain alternative, expected-value theory mandates the risky action, regardless of how small $p$ becomes, provided $U$ grows sufficiently. This is the pure expected-value version. Distinct is the epistemic variant, where uncertainty about probability estimates allows speculative hypotheses to dominate evidence-based ones. A third framing involves the far future, where potential population sizes make $U$ vast enough to swamp present concerns. A solution must primarily address the pure expected-value version, as the others derive force from it. Crucially, we must distinguish a theory that *is* fanatical (mandating such choices) from one that merely *permits* fanaticism (allowing it under extreme parameters). An adequate treatment must prevent the reasoning from becoming unusable in ordinary contexts while preserving its normative force where intuition supports it. It must explain why the swamping effect feels like a bug, not a feature, without abandoning the mathematical coherence of decision theory.

  **The desiderata**

  1.  **Preservation of Ordinary Expected-Value Reasoning:** The theory must validate standard decisions where probabilities and utilities are moderate. If saving a life today is preferred to a 50% chance of saving two lives tomorrow, the theory must reflect this. *Consideration:* If a fix breaks standard risk assessment (e.g., insurance, medical triage), it is too costly. Decision theory must remain applicable to engineering and policy, not just metaphysics. We cannot sacrifice the tool's utility in the domain where it works to fix a bug in the domain where it breaks.

  2.  **Non-Triviality of Astronomical Stakes:** The theory cannot declare vast outcomes literally irrelevant. If a certainty of saving one person competes with a 10% chance of saving a billion, the latter should remain competitive. *Consideration:* Dismissing huge stakes outright implies irrational indifference to catastrophe or miracle, violating basic moral and prudential intuition. If an asteroid impact has a 1% chance of ending civilization, we must act. A theory that caps utility so low that existential risk becomes negligible fails to protect against genuine ruin.

  3.  **Action-Guiding Specificity:** The theory must yield a verdict, not merely suspend judgment. It must tell the agent which action to take, not just that the calculation is hard. *Consideration:* A theory that results in perpetual uncertainty fails its functional role. Agents must act; paralysis is a failure of guidance. If the output is "incomparable," the agent cannot choose, rendering the theory practically useless for a software engineer building autonomous systems or a policymaker allocating budgets.

  4.  **Non-Arbitrariness:** The theory cannot rely on ad hoc numerical thresholds (e.g., "ignore probabilities below $10^{-20}$"). *Consideration:* Arbitrary cutoffs invite manipulation (padding probabilities to just above the threshold) and lack theoretical justification. Why this number and not another? In code, magic numbers are bugs; in philosophy, they are unjustified axioms. A solution must derive limits from structural principles, not stipulation. Any threshold invites boundary cases where rational choice flips discontinuously.

  5.  **Handling Divergent Expectations:** The theory must resolve games where expected value is infinite or undefined, not merely large. *Consideration:* If the theory collapses when utilities grow without bound, it is mathematically fragile. It must handle limits consistently. If a game offers doubling payouts forever, the theory must say whether buying a ticket is rational, without relying on real-world bankroll limits unless explicitly modeled. Real systems cannot process infinity, so the theory must provide a finite verdict.

  6.  **Avoidance of Decision Paralysis:** The theory must not make every decision depend on evaluating every remote possibility. *Consideration:* If agents must investigate every low-probability high-stakes claim before acting, no action is ever possible. The cost of calculation must not exceed the value of the decision. This is the "computational complexity" constraint on rationality. You cannot debug every line of code in the universe before shipping. Rational agents must ignore noise to function.

  7.  **Sensitivity to Evidence Quality:** The theory should distinguish between well-grounded probabilities and speculative guesses. *Consideration:* A made-up probability of an afterlife should not weigh equally with a measured probability of equipment failure, even if numerically identical. Epistemic hygiene matters. A probability derived from data should dominate a probability derived from imagination, even if the nominal values match.

  8.  **Scale Invariance:** The reasoning should not change qualitatively simply because units are scaled up. *Consideration:* Rationality should not depend on whether we count utils in points or millions of points. If changing the currency changes the decision rule, the rule is unstable. This prevents utility pumping via unit redefinition and ensures the theory describes rationality, not accounting conventions.

  **Which requirements are non-negotiable and which are the prejudices of a camp**

  Non-negotiable requirements are those without which the problem ceases to be about decision theory. **Preservation of Ordinary EV** and **Action-Guiding Specificity** are constitutive. If a theory cannot guide action or breaks standard cases, it is not a decision theory. **Avoidance of Paralysis** is similarly essential; a theory that demands infinite computation is functionally null. **Non-Arbitrariness** is methodological; without it, any solution is just stipulation.

  Conversely, **Scale Invariance** and **Handling Divergent Expectations** may be prejudices of formalists. Real agents face bounded resources and finite universes; requiring the theory to handle mathematical infinities might be solving a problem that doesn't exist physically. **Sensitivity to Evidence Quality** borders on epistemology rather than decision theory; strictly speaking, decision theory takes probabilities as inputs. Insisting it judge the source of probabilities may conflate distinct fields. **Non-Triviality of Astronomical Stakes** is contested; some argue fanaticism *is* the correct result, and rejecting it is the prejudice. However, for a solution to be acceptable to non-fanatics, this must be treated as a constraint, even if fanatics dispute it. The core tension lies between maintaining mathematical coherence (non-arbitrariness, scale invariance) and maintaining practical usability (ordinary EV, no paralysis). If one accepts fanaticism, the problem dissolves; if one rejects it, one must sacrifice something else. Thus, rejecting fanaticism is a precondition for seeking a solution, making Non-Triviality a negotiated requirement rather than a logical necessity.

  **Pairs that look jointly unsatisfiable**

  The central tension is between **Non-Arbitrariness** and **Preservation of Ordinary EV**. To stop fanaticism without arbitrary cutoffs, one must modify the expectation formula itself (e.g., discounting probabilities non-linearly). However, any such modification inevitably distorts ordinary calculations where probabilities are small but stakes are normal. If you discount small probabilities, you break insurance math. If you don't, you accept fanaticism. You cannot have a smooth function that behaves linearly in the middle and flattens at the extremes without introducing an inflection point that looks like a soft cutoff. This violates the **Non-Arbitrariness** requirement because the inflection point lacks independent justification.

  Second, **Action-Guiding Specificity** conflicts with **Sensitivity to Evidence Quality**. To distinguish speculative probabilities from grounded ones requires epistemic analysis that delays decision-making. If you must verify the source of every probability before acting, you risk **Decision Paralysis**. A fast heuristic avoids paralysis but treats all probabilities equally, violating evidence sensitivity.

  Third, **Handling Divergent Expectations** clashes with **Preservation of Ordinary EV**. Solutions that cap utility to solve divergent games (bounded utility) often make vast but finite stakes irrelevant, violating **Non-Triviality**. If utility is bounded, saving a billion lives might not be significantly better than saving one, once the bound is approached. This violates the intuition that more good is better.

  Finally, **Scale Invariance** fights **Avoidance of Paralysis**. If reasoning must hold across scales, agents must consider arbitrarily large stakes, which invites infinite regress in checking for hidden astronomical consequences. Limiting the scale avoids paralysis but violates invariance. A solution must break one of these links, admitting that rationality is either context-dependent or computationally bounded.

  **How the standard fixes fare**

  Bounded utility functions satisfy **Handling Divergent Expectations** and **Avoidance of Paralysis** but fail **Non-Triviality of Astronomical Stakes**; they render huge differences in outcome negligible near the bound. Probability discounting satisfies **Preservation of Ordinary EV** locally but fails **Non-Arbitrariness**; the discount rate is invariably stipulated. Lexicographic rules (prioritizing probability thresholds) fail **Scale Invariance** and **Non-Arbitrariness**, creating sharp cliffs in value.

  The most robust candidate is epistemic restriction: limiting which probabilities count as valid inputs. This survives **Non-Arbitrariness** if tied to evidence standards, and preserves **Ordinary EV**. However, it struggles with **Action-Guiding Specificity**, as determining evidence validity is itself costly and controversial.

  The single requirement that rules out the most candidates is **Non-Arbitrariness**. Most fixes introduce a parameter (a bound, a threshold, a discount rate) that cannot be derived from first principles. Any solution relying on a magic number fails this test. The requirement that proves most difficult to satisfy jointly with others is **Preservation of Ordinary EV**; maintaining linearity in the ordinary range while blocking domination in the extreme range requires a mathematical structure that currently seems unavailable without introducing hidden arbitrary parameters. Accepting fanaticism satisfies all mathematical constraints but fails the intuitive **Non-Triviality** constraint for anti-fanatics. Thus, most fixes trade mathematical elegance for practical intuition, or vice versa.
