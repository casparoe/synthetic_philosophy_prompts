answer: |-
  Good morning. Welcome.

  Look around the room. You know who is sitting to your left and to your right. You know that a third of you view the concept we are discussing as a fragile hope, or perhaps a trap. Another third of you hear the word and think of utopias or dystopias, of bureaucratic nightmares or diplomatic impossibilities. The rest of you are here to decide whether this is something worth funding, or something to be managed.

  There are no philosophers here. There are no true believers in the front row and no skeptics hiding in the back. We are all practitioners. We are all responsible for things that actually happen.

  I want to begin with a confession about this room. We are gathered here for two days with a specific aim: to produce one unified set of recommendations. We intend to speak with one voice at the end of this. Structurally, this workshop is already what we are here to discuss. We are a small singleton. We are attempting to collapse a diversity of views into a single decision output. I would rather state that plainly than pretend we are neutral observers. It means the stakes of our own process are real. If we fail to agree, we break the model. If we agree too easily, we may have papered over a crack that will break later.

  My task this morning is not to tell you what a singleton is. You have all read the briefings. My task is to suggest that the definition we are carrying in our heads might be too static for the work we need to do.

  Too often, we talk about a singleton as a *thing*. A specific actor. A super-intelligence. A world government. A hegemon. When we define it as a noun, we spend our time arguing about identity. Who is it? What does it want? Is it human?

  I propose we stop asking "who" and start asking "when."

  Think of a singleton not as an actor, but as a threshold. Think of it as a phase change, like water turning to ice. Below this threshold, the system is sensitive to individual agency. If one major player defects, if one state withdraws, if one lab ignores a safety protocol, the global outcome changes. The number of independent decision-makers matters.

  Above the threshold, it does not.

  Above the threshold, you can remove a decider, add a decider, or change a decider, and the macro-outcome remains the same. The system has locked in. On this view, a singleton might be a state, but it might also be a market dynamic that no single firm can break. It might be a technological standard that no competitor can displace. It might be a norm so deep that violating it is simply unthinkable.

  The live question is not "could a single actor win?" The live question is: "Does anyone remain whose defection would change the outcome?"

  If the answer is no, you are in a singleton. It does not matter if it looks like a democracy, a market, or a dictatorship. If the individual unit of power can no longer alter the trajectory, the threshold has been crossed.

  This framing should irritate some of you. For those of you who work on institutional governance, this suggests that your multipolar world might already be a singleton in disguise, bound by norms you cannot change. For those of you focused on AI risk, this suggests that the danger may not arrive with a bang, but as a gradual loss of leverage, where no single safety intervention matters anymore.

  I want to add a second distinction to this, one that will determine what we actually do in the sessions. We need to separate the *sovereign* from the *constitution*.

  A sovereign singleton decides the substantive questions. It decides what we build, where we deploy, what values we optimize for.

  A constitutional singleton decides only the rules by which everyone else decides. It does not choose the outcome, but it chooses the game. It sets the constraints within which competition happens.

  Much of our confusion comes from conflating these two. A global market might be a constitutional singleton—it sets the rules of efficiency and profit—while leaving the substantive decisions to corporations. A super-intelligence might be a sovereign singleton, deciding the outcomes directly. A treaty regime might aspire to be a constitutional singleton, but fail to enforce the rules.

  Which one we are facing changes everything. If the threat is a sovereign singleton, we worry about tyranny. If the threat is a constitutional singleton, we worry about lock-in. If the hope is a constitutional singleton, we worry about flexibility.

  So, as you move into the first session, I do not want you to seek consensus. I do not want a mood of agreement. I want you to sharpen the disagreement.

  Here are the questions I want you to take into that room:

  First, is the threshold detectable in real-time? Or do we only know we have crossed it when we can no longer turn back? If we cannot see the threshold, can we govern near it?

  Second, which is more dangerous: a sovereign singleton that can act decisively to prevent catastrophe, or a constitutional singleton that locks in a competitive dynamic no one can stop? Is it worse to have a king who might be cruel, or a system that makes kings impossible but forces everyone to race?

  Third, and most difficult: If this workshop succeeds, and we produce one unified recommendation, have we demonstrated that coordination is possible? Or have we demonstrated that independent thought is already collapsing?

  I have my own answers to these questions. I will not share them. My job is not to lead you to my conclusion. My job is to ensure that when you disagree, you are disagreeing about the mechanics of the future, not the definitions of the past.

  We have two days. We have a room full of people who hold the levers of policy, capital, and technology. We are a small experiment in whether a group of independent agents can produce a single output without becoming a singleton themselves.

  Let us see if we can differ well. Let us see if we can identify the threshold without rushing to cross it.

  The first session begins now. Thank you.
