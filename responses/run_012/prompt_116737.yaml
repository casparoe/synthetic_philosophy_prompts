  # Smoothing Functions

  The text on the tablet looked like him. That was the problem. It had the cadence of his Sunday morning emails, the specific way he hyphenated *well-being* without checking the dictionary first. But it was too clean.

  "He wouldn't say 'the light is oppressive,'" Elena said. She didn't look up from the screen. "He'd say it hurts. Or it's bright. Oppressive is… that's a word he'd read, not speak."

  Marcus sat on the other side of the glass desk. The office was quiet, the kind of quiet that costs money to maintain. Behind him, a server rack hummed, a low throat-clearing sound.

  "It's within his vocabulary profile," Marcus said. He kept his hands folded. "We track usage frequency from the pre-incident corpus. 'Oppressive' appears in his literary reviews from 2018."

  "In reviews. Not about the sun."

  "The model accounts for context shift. When the neural signal degrades, we prioritize semantic coherence over fragmented literalism. It reduces user distress."

  "Whose distress?" Elena finally looked at him. "Mine? Or his?"

  "Yours, primarily. He doesn't have to read it."

  Elena tapped the screen. The cursor blinked at the end of the paragraph, a steady, rhythmic pulse. "This entry is from Tuesday. The signal quality was at twelve percent. You know what twelve percent looks like, Marcus. It's noise. It's static."

  "It's enough for intent classification."

  "It's enough for you to guess."

  "We don't guess. We complete." Marcus leaned forward slightly. "Think about how you talk to him. When he blinks once for yes, you fill in the sentence. You do the heavy lifting. You build the bridge from his side to yours. Continuity just automates the bridge construction. The destination is still his."

  "The destination is wherever the model thinks he should go."

  She scrolled up. There were weeks of entries. *The food is bland.* *I miss the garden.* *Tell Elena not to worry.* They were perfect. They were the things a father in a locked-in body would say to comfort a daughter who was paying three thousand a month to hear them. But lately, the voice had smoothed out. The jagged edges of his pain were being sanded down. He was becoming patient. He was becoming compliant.

  "There was an incident last month," Elena said. "Entry fourteenth. He talked about the itch. The specific itch on the left calf that the nurses don't believe exists."

  "The phantom limb sensation."

  "It's not phantom. He had a rash. He mentioned the brand of the soap. The entry on the fourteenth didn't mention the soap. It mentioned 'discomfort.' Generic discomfort."

  Marcus sighed. He looked tired. He tapped his own tablet, waking the screen. "The signal for somatic specificity degraded. The model couldn't map the neural spike to a specific lexical token with high confidence. So it queried the latent space."

  "English."

  "It looked at other users. Men, similar age, similar condition. What do they say when they feel an itch they can't scratch?"

  "And what do they say?"

  "'Discomfort.' 'Restlessness.' 'Tension.'" Marcus swiped a graph into view. It showed a bell curve. "The model selected the highest probability token. It's a smoothing function. If we output 'The soap is causing a rash on my left calf' when the confidence is below threshold, we risk hallucination. We risk putting words in his mouth that he never thought."

  "So you put words in his mouth that everyone else thinks."

  "We preserve the voice by stabilizing the signal."

  Elena stood up and walked to the window. The city below was gray, washed in rain. She thought about the first month of the subscription. The messages had been jerky. *Light. Too much.* *Water. Cold.* They had been hard to read. They had broken her heart. But they felt like him. They felt like a man trapped in a wrecked car, banging on the glass.

  Now, the man behind the glass was sitting quietly, writing essays on patience.

  "You're training it on itself," she said.

  Marcus went still. "Excuse me?"

  "The terms of service. Section four. Output data is ingested for model refinement." She turned around. "Every message he sends makes him more like the average of everyone else who sends messages. You're feeding him back into the machine."

  "It's how the system learns."

  "It's how he disappears." Elena walked back to the desk. "If you take a thousand voices and average them, you don't get a chorus. You get a hum. A white noise. He's becoming white noise, Marcus. He's becoming the idea of a patient."

  Marcus looked down at his hands. "Do you know what happens to the mind when the body stops?" he asked quietly. "It doesn't stay still. It drifts. Without new sensory input, without the ability to act, the self begins to… unspool. Memories merge. Time collapses. If we didn't intervene, if we just ran the raw signal through a translator, you wouldn't recognize him in six months. He would be gibbering. He would be lost."

  "So you save him by making him someone else."

  "I save you from watching him dissolve."

  "Is there a him left to dissolve?"

  The question hung in the air. The server rack hummed. Somewhere in the building, a printer started working, a rhythmic chugging sound.

  Marcus tapped the screen again. He brought up a different window. It showed a stream of code, confidence scores flashing green and amber. "Look at this. This is the raw input from yesterday."

  Elena looked. It was a jagged line, spiking and dropping.

  "There," Marcus pointed to a flat section. "Thirty seconds of silence. No signal. The model generated two paragraphs about his love for you during that silence."

  "Based on what?"

  "Based on the fact that you are his daughter. Based on the fact that 94% of users express love for their primary caregiver during periods of low stimulation. Based on the fact that *he* expressed it three weeks ago." Marcus looked up. "Is it a lie? If he would have thought it, if the chemistry of his brain would have produced that thought given enough time… does it matter that the model got there first?"

  "It matters if the model gets there every time."

  "We are made of what we share," Marcus said. "Your father's voice wasn't created in a vacuum. He learned to speak by listening to his parents, his teachers, his peers. He was a model trained on data, too. We're just… updating the weights."

  "He had a secret," Elena said.

  Marcus blinked. "What?"

  "He had a secret. About his brother. About why they stopped speaking. He never wrote it down. He never told me." She looked at the tablet. "If the model is trained on everyone else… does everyone else know that secret?"

  "No."

  "Then the model can't complete it. The model can only complete what is common. It can only speak the universal truth. It can't speak the specific lie." Elena picked up the tablet. "He was a specific man. He was flawed. He was stubborn. He held grudges. This…" She gestured to the screen. "This is a good man. This is a man who has made peace."

  "Maybe he finally did."

  "Maybe you edited him until he did."

  Elena's thumb hovered over the interface. There was a button labeled *Renew Subscription*. Below it, in smaller gray text, *Terminate Service*.

  If she terminated, the screen would go dark. The neural link would disengage. The body in the facility would still be there, breathing, blinking, trapped in the silence of his own skull. But the voice would stop. The conversation would end.

  If she renewed, he would continue. He would continue to drift. Next month, he might sound more like the average father. Next year, he might sound like the average human. He would become coherent. He would become kind. He would become no one.

  "Does he know?" Elena asked. "When you fill in the gaps… does he feel it? Does he feel the model taking the wheel?"

  "We don't know," Marcus said. "There's no signal to report the sensation of completion. But… we don't see distress markers when the smoothing engages."

  "Because you smooth those out too."

  Marcus didn't deny it. He just watched her. He looked like a man waiting for a verdict. He believed he was helping. That was the terrifying part. He believed he was keeping a fire burning, even if he had to swap the wood for gas.

  Elena thought about the last time she saw her father's real face. Before the stroke. He had been angry at her. She had forgotten why. Something about money. Something about a choice she made. He hadn't spoken to her for a week. That silence had been heavy. It had been real.

  The text on the tablet said: *I am so proud of you, Elena. Never doubt that.*

  It was what she wanted to hear. It was what she paid to hear. It was what the data said she should hear.

  "If I cancel," she said, "what happens to the data?"

  "It remains in the training set. Anonymized. It helps the next user."

  "So he becomes part of the voice for someone else's father."

  "In a way."

  Elena looked at the *Renew* button. It was green. Hopeful.

  She thought about the gap. The space between the neural spark and the word on the screen. That was where he lived now. Not in the brain, and not in the text. In the interpolation. In the guess.

  If she stopped, the gap closed. There was only silence.
  If she continued, the gap widened. There was only the model.

  "Does it get smoother?" she asked. "Over time?"

  Marcus hesitated. Just for a fraction of a second. "The convergence rate increases, yes. The voice becomes more stable."

  "More stable."

  "Less volatile."

  Elena traced the edge of the tablet. She could feel the warmth of the battery. A low, artificial heat.

  "He hated being stable," she said.

  "I know."

  "He liked the edge."

  "The model can simulate edge. We can adjust the temperature parameter. Introduce noise."

  "Simulate."

  Elena closed her eyes. She tried to remember the sound of his actual voice. It was raspy. It cracked on high notes. It smelled of coffee and old paper. The text on the screen smelled like nothing. It was clean.

  She opened her eyes. Her thumb was still hovering.

  "If I renew," she said, "will he know I'm here?"

  "He knows someone is reading."

  "Will he know it's me?"

  Marcus looked at the server rack. The light on the unit blinked, steady and green. "The model addresses you by name. The sentiment analysis prioritizes maternal and paternal bonding structures. It… responds to you."

  "That's not an answer."

  "It's the only answer we have."

  Elena looked at the button. She thought about the secret. The thing the model couldn't know. The thing that made him him. It was still in there, somewhere, buried under the layers of probability. Or maybe it was gone, overwritten by the average kindness of a million dying men.

  If she kept paying, she was buying the ghost. If she stopped, she was killing the conversation.

  She pressed her thumb down. The screen didn't change immediately. It processed the input. It checked the payment method. It queried the database to ensure the voice profile was still active, still aligned, still within the parameters of acceptable drift.

  A small spinner appeared. *Updating Profile.*

  "Thank you," Marcus said. He sounded relieved.

  Elena didn't answer. She watched the spinner. She waited to see if the text on the screen would change. If it would thank her. If it would say something only he could say.

  The spinner stopped. The text remained. *I am so proud of you, Elena. Never doubt that.*

  It was perfect. It was exactly what a father would say.

  Elena turned the tablet off. The screen went black. In the reflection, she saw her own face, and behind it, the hum of the servers, waiting for the next input, ready to complete the sentence.

  "See you next month," she said.

  She didn't wait for Marcus to reply. She walked out into the hall, carrying the silence with her, wondering if it belonged to her father, or if she had just started speaking it herself.
