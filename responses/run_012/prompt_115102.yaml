answer: |-
  Two economists are drafting a constitution for a small club.

  "Requirement One," says the first. "Strategy-proofness: voters never benefit from lying."
  "Requirement Two," says the second. "At least three candidates on the ballot."
  "Requirement Three," says the first. "No dictator."

  The second crosses out Requirement Three. "With One and Two, you get a Dictator. It's a theorem."
  "What if we only ever vote on two candidates?"
  "Then you can keep Democracy. But add a third, and mathematics demands a king."

  ***

  This joke exploits the condition that the rule's range must contain **at least three alternatives**. The Gibbard–Satterthwaite theorem only forces the trade-off between strategy-proofness and non-dictatorship when there are three or more options; with only two, majority rule satisfies both. A reader who misses this point might interpret the joke as a cynical comment on political corruption, rather than a structural observation about the boundary condition where the impossibility result activates.
