prompt: |-
  My econ teacher and my physics teacher got into a argument in front of the whole class last week and I still can't decide who was winning. It started because my econ teacher said all models are wrong and it doesn't matter that the assumptions are unrealistic, since the only real test is whether the predictions come out right — he said there's an old line in economics that you shouldn't ask whether the assumptions are true, only whether the theory predicts well. My physics teacher said that in physics nobody would accept an idealization unless you can show that when you put the missing piece back in, the answer barely moves — a frictionless plane is fine because you can add friction back and the correction term is small when the friction is small, but if you can't do that, calling something "just an idealization" is a blank cheque for any nonsense you like. He said you can't always put the piece back: sometimes the whole point of a model is to isolate one mechanism and watch what it does on its own, and anyway in economics you can never run the clean counterfactual, so her standard would rule out basically the entire field. She said no, that just means there are two different things going on — idealizations you can undo and get a correction term out of, and assumptions that are simply false and stay false — and only the first one deserves the name. He came back with: fine, but you still haven't answered the prediction point, because if a model with false assumptions forecasts better than one with true assumptions, what exactly is wrong with using it?

  Can you go through this move by move and say who's right about what? I specifically want to know (a) whether the two kinds of idealization she's talking about are really two different things or whether she just invented the distinction on the spot to save herself, (b) whether "it predicts well" can ever be enough on its own, and (c) whether the fact that you can't de-idealize in economics makes her rule useless there or just means economics has to be more careful than physics. Please write it in British English, and dont just tell me they're both partly right — I want an actual verdict on each step.
