answer: |-
  **Project Title:** Simulations and the Structure of Longtermist Uncertainty

  **Principal Investigator:** [Your Name]
  **Duration:** 3 Months
  **Request:** Internal Research Grant

  **1. Research Question**
  Current debates in longtermist ethics face the "fanaticism" objection: if the far future is vast, even tiny probabilities of influencing it dominate practical reasoning, compelling agents to prioritise speculative schemes over tangible near-term goods. A common counter-argument invokes the Simulation Hypothesis: if we are likely simulated, our capacity to influence the base-reality future is diminished, lowering the expected value (EV) of longtermist actions.

  This project asks a more fundamental question: **Does the simulation hypothesis render far-future expected value calculations indeterminate rather than merely diminished?**

  The standard view assumes we can assign a probability to being simulated and a discounted value to our influence within a simulation. My hypothesis is that this is structurally incorrect. Because the motives and mechanics of potential simulators are unconstrained by our evidence, the variable representing "value of action X in a simulation" is not merely unknown; it is ill-posed. Consequently, simulation reasoning may not lower the EV of longtermist actions but rather dissolve the calculation entirely. Alternatively, if simulators grade performance, leverage could increase, exacerbating fanaticism. This project seeks to determine which structural outcome holds, independent of the specific credence assigned to the simulation hypothesis.

  **2. Background and Gap**
  Existing literature generally treats the simulation hypothesis as a probability discount. Proponents of longtermism (e.g., Beckstead, Thomas) acknowledge the risk of fanaticism but often assume EV remains calculable via standard expectation maximisation. Critics using the simulation argument (e.g., Garfinkel) typically argue that being simulated reduces our causal leverage, thereby reducing EV.

  Both positions leave a critical gap: they assume the payoff structure of the simulation is knowable or bounded. They treat the simulator's response function as a standard uncertain parameter that can be averaged over. However, if the simulator's objectives are orthogonal to ours, or if the simulation is designed to be sensitive to specific variables we cannot identify, the expectation integral may fail to converge. There is currently no formal analysis distinguishing between *risk* (known unknowns) and *radical uncertainty* (unknown unknowns) in this specific context. This project fills that gap by analysing the formal properties of the decision problem rather than the empirical likelihood of simulations.

  **3. Methodology**
  The project will utilise formal decision-theoretic modelling. This is not a retreat from literature into mathematics, but a necessary tool for clarifying conceptual structure. Intuitive reasoning fails when dealing with infinite stakes and undefined variables; formal models force precision regarding what is being averaged and what is being assumed.

  I will construct two comparative models:
  1.  **The Standard Discount Model:** Treats simulation status as a probabilistic state with a bounded payoff function.
  2.  **The Structural Uncertainty Model:** Treats the simulator's payoff function as an unconstrained variable dependent on simulator motives (e.g., indifference, grading, termination).

  I will test these models against different decision rules (expected utility maximisation, maximin, and ambiguity-averse criteria). This approach is appropriate for a three-month theoretical project. It avoids the pitfall of "modelling to avoid reading" because the models are designed specifically to test the coherence of existing philosophical claims found in the literature on fanaticism and simulation. The output will be a conceptual proof regarding the computability of far-future EV under simulation constraints.

  **4. Expected Outcomes and Failure Conditions**
  **Success:** The project produces a formal demonstration that under plausible assumptions about simulator behaviour, the expected value of far-future influence is undefined (ill-posed) rather than low. Alternatively, it may demonstrate that simulation reasoning only discounts stakes if specific, unjustified constraints are placed on simulator motives. This would shift the debate from probability assignment to structural uncertainty.

  **Failure:** The project fails if the models demonstrate that simulator behaviour can be reasonably bounded by general rationality assumptions, collapsing the problem back into the standard discount model. Additionally, failure would result if the formalism becomes too technical to communicate to a mixed panel, obscuring the philosophical insight.

  **Feasibility:** Three months is realistic for a single researcher producing a theoretical paper of this scope. The work requires no empirical data collection, ethics approval, or complex coding. The primary risk is scope creep in the formalism; this will be managed by limiting the models to discrete variable sets rather than continuous functions. The timeline allows one month for model construction, one month for analysis, and one month for drafting and revision.

  **5. Conclusion**
  This project offers a novel intervention in the longtermism debate. By shifting the focus from *how likely* we are to be simulated to *how that status affects the calculability of value*, it provides a potential escape from fanaticism that does not rely on contentious probability estimates. The result will be a concise paper suitable for publication in ethics or decision theory journals, clarifying whether simulation reasoning saves us from fanaticism or merely changes the nature of the threat.
