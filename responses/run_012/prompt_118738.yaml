answer: |-
  ### Advisor's Assessment (For Your Eyes Only)

  Before you submit the proposal below, here is the honest assessment you asked for regarding your core intuition and the scope.

  **1. Is the "one underlying quantity" a metaphor that dissolves?**
  Yes and no. It dissolves if you are looking for a single scalar (like "entropy") that applies to both theorems universally. The Jury Theorem relies on an *ontic* assumption (there is a true state of the world), while the standard Cycling Paradox relies on a *preferential* assumption (there is no true state, only conflicting values). You cannot compare information preservation unless you posit a "true ordering" in the cycling case.
  *However*, once you do posit a true ordering (using a model like H. Peyton Young's epistemic extension of Condorcet), the "quantity" becomes the **signal-to-noise ratio in a multidimensional preference space**. The "Jury" result holds when noise is low relative to the distance between options; the "Cycle" result emerges when noise is high enough to obscure the latent ordering. So, the "quantity" is really a threshold condition on the error distribution. Your intuition is directionally correct, but mathematically it's a phase transition, not a single static number.

  **2. Is the framing too big for a semester?**
  Yes, if you try to prove new theorems. No, if you treat it as a comparative analysis of existing models via simulation.
  *The Cut:* Do not try to derive a new aggregation rule. Do not try to solve for the general $n$-candidate case analytically. Limit your simulation to 3 or 4 candidates and fixed population sizes. Focus on mapping the "phase transition" where the Jury effect collapses into Cycling.

  **3. Most Likely Outcome:**
  You will likely find that there is no single scalar quantity. Instead, you will demonstrate that the two results are compatible under a specific class of error distributions (e.g., Mallows models). A "negative" result (showing the quantity doesn't exist) is still a successful MA project if the demonstration is rigorous.

  ***

  ### Research Proposal

  **Title:** Epistemic Aggregation Beyond the Binary: Reconciling the Jury Theorem and Condorcet Cycling

  **1. Introduction and Research Question**

  Social choice theory presents two canonical results regarding majority rule that appear, on their face, to offer contradictory lessons. The Condorcet Jury Theorem (CJT) offers an epistemic defense of majority rule: if voters are individually competent (probability $p > 0.5$ of identifying the correct binary state) and vote independently, the probability that the majority selects the correct outcome converges to 1 as the group size increases. Conversely, Condorcet's Paradox demonstrates that with three or more alternatives, even rational individual preference orderings can aggregate into a cyclical social preference ($A \succ B \succ C \succ A$), rendering the majority will incoherent.

  In standard pedagogy, these are treated as distinct phenomena: the former is a result about *truth-tracking* in binary settings, and the latter is a result about *consistency* in multi-option settings. This distinction relies on a hidden ontological shift. The Jury Theorem assumes a "correct" answer exists independent of voter preference. The Paradox assumes preferences are purely expressive, with no external truth to track.

  This project proceeds from the hypothesis that this dichotomy is artificial. In real-world voting scenarios involving multiple candidates, voters often act epistemically (attempting to select the "best" candidate based on shared criteria) rather than purely expressively. If we model multi-option voting as an epistemic problem—where a "true" latent ordering exists but is observed by voters with noise—the tension between the Jury Theorem and the Paradox becomes a question of information preservation.

  **Research Question:** *Under what conditions does majority rule preserve epistemic information in multi-option settings, and is there a continuous parameter space that connects the convergence of the Jury Theorem to the instability of Condorcet Cycling?*

  Specifically, I aim to determine if the transition from truth-tracking to cycling can be characterized by a specific threshold of voter competence or noise correlation, effectively treating the Paradox not as a structural inevitability, but as an epistemic failure mode.

  **2. Problem Statement and Existing Positions**

  The standard resolution to the tension between these two results is to categorize them by domain: CJT applies to binary, epistemic choices; the Paradox applies to multi-candidate, preferential choices. This resolution is unsatisfying for three reasons.

  First, it ignores the prevalence of epistemic voting in multi-candidate elections. Voters often view candidates as proxies for policy outcomes or competence, implying a latent "correct" ordering exists in the minds of the electorate. Second, it treats the binary constraint of CJT as essential rather than incidental. Recent extensions of CJT to multi-option settings (e.g., Young 1988) suggest that majority rule can be truth-tracking for orderings, not just binary states, provided specific domain restrictions (like single-peakedness) hold. Third, the standard view offers no account of the *transition*. It does not explain how much competence is lost as we move from two to three options, or how correlation in errors (violating CJT independence) interacts with the structural possibility of cycles.

  Existing literature typically addresses this by either proving new impossibility theorems or proposing alternative aggregation rules (e.g., Borda count). However, there is a gap in quantifying the *degree* of information loss under simple majority rule as the complexity of the choice set increases. We lack a clear map of the parameter space where majority rule remains a reliable epistemic tool versus where it degenerates into cycling. This project aims to fill that gap by modeling the "noise" in voter perception as the bridging variable.

  **3. Methodology and Work Plan**

  This project will not attempt to prove new axiomatic theorems, which is beyond the scope of a semester-long MA project. Instead, I will employ a combination of formal modeling and computational simulation to map the relationship between voter competence, choice set size, and aggregation stability.

  **Phase 1: Formal Model Specification (Weeks 1–4)**
  I will formalize two baseline models.
  1.  *Binary Epistemic Model:* Standard CJT setup. $N$ voters, 2 options, true state $S \in \{0,1\}$, voter signal accuracy $p$.
  2.  *Multi-Option Epistemic Model:* $N$ voters, $K \geq 3$ options. I will posit a "true" latent ordering $\sigma^*$. Each voter observes a noisy permutation $\sigma_i$ of $\sigma^*$.
      *   *Noise Structure:* I will utilize the Mallows model or a similar distance-based probability distribution to generate voter orderings. The dispersion parameter $\phi$ will serve as the proxy for "competence" (where low dispersion = high competence).
      *   *Aggregation:* Pairwise majority rule will be applied to the generated orderings to check for Condorcet winners and cycles.

  **Phase 2: Simulation and Data Generation (Weeks 5–9)**
  Using Python (specifically libraries for combinatorics and statistical simulation), I will run Monte Carlo simulations across a grid of parameters:
  *   Population size ($N$): 10 to 1000 (logarithmic steps).
  *   Number of options ($K$): 3, 4, 5.
  *   Competence/Dispersion ($\phi$): Ranging from near-perfect correlation to random noise.

  For each parameter set, I will record:
  1.  The frequency of a Condorcet Winner existing.
  2.  If a Condorcet Winner exists, the probability it matches the top of the true latent ordering $\sigma^*$.
  3.  The "Kemeny distance" between the aggregate majority ordering and the true ordering $\sigma^*$.

  **Phase 3: Analysis and Synthesis (Weeks 10–14)**
  I will analyze the simulation data to identify phase transitions. The goal is to produce a "stability map" showing regions of $(N, K, \phi)$ space where majority rule is epistemically reliable versus where it cycles. I will then compare this to the theoretical predictions of CJT to see if the binary case is indeed a limit of the multi-option model as $K \to 2$.

  **4. Expected Outcomes and Deliverables**

  A successful project will yield one of three specific outcomes:

  1.  **Unified Threshold (Best Case):** I identify a function $f(N, K, \phi)$ that predicts the probability of a cycle. This would demonstrate that the Paradox is simply the high-noise tail of the Jury Theorem distribution.
  2.  **Structural Divergence (Likely Case):** The simulations show that no single scalar quantity links the two. Instead, I will demonstrate that the "independence" assumption in CJT is the critical break-point. In multi-option settings, even independent noise on rankings induces correlation in pairwise comparisons, causing the Jury logic to fail faster than expected.
  3.  **Null Result:** The models prove incommensurable because the definition of "truth" in the multi-option case is too sensitive to the chosen noise model (e.g., Mallows vs. Uniform).

  The final deliverable will be a 25–30 page paper presenting the formal setup, the simulation methodology, and the resulting stability maps. The contribution will not be a new theorem, but a precise characterization of the *limits* of the epistemic defense of majority rule.

  **5. Feasibility and Risk Assessment**

  **Scope Management:**
  The primary risk is mathematical overreach. Attempting to derive the analytical probability of cycles for general $K$ under the Mallows model is a known hard problem in combinatorics. To mitigate this, the project relies on simulation for the multi-option case. This is methodologically sound for an MA thesis provided the simulation parameters are justified and the code is made available for replication. I will restrict the maximum $K$ to 5 to ensure computational tractability for large $N$.

  **The "One Quantity" Hypothesis:**
  There is a significant risk that the core intuition—that CJT and the Paradox are two faces of one quantity—is a category error. The CJT relies on a binary state; the Paradox relies on ordinal relations. It is possible that no continuous metric exists that preserves the "truth-tracking" property across the binary/multi-option boundary.
  *Contingency Plan:* If the "unified quantity" hypothesis fails, the project will pivot to a "comparative instability" analysis. Even if the quantities are not identical, demonstrating *how* they diverge (e.g., showing that information loss scales exponentially with $K$ rather than linearly) is a substantive result. A demonstration that the two theorems are fundamentally incommensurable is a valid negative result that clarifies the literature.

  **Skills and Resources:**
  I possess the requisite probability theory and basic game theory background to formalize the models. I am proficient in Python for the simulation component. I will require access to standard computational resources (available via the department) and guidance on the interpretation of social choice metrics (e.g., Kemeny-Young distance) which I will secure through faculty consultation during Phase 1.

  **6. Conclusion**

  The tension between the Condorcet Jury Theorem and Condorcet's Paradox is often taught as a dichotomy between the promise and peril of democracy. This project argues that it is better understood as a single problem of signal processing under different constraints. By modeling multi-option voting as a noisy observation of a latent truth, we can ask precisely how much complexity majority rule can tolerate before it loses its epistemic value. Whether the result is a unified metric or a demonstrated divergence, clarifying this boundary is essential for understanding the limits of majoritarian competence.
