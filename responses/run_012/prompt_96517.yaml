  I'm in a reading group that's been muddling through Dummett and the anti-realists, and one of the others sent round a one-page explainer he wrote on Fitch's paradox, which he says is the killer objection to the whole program. I've read it three times and I still can't tell how much of it to beleive. Here's the bit I'm stuck on:

  "Fitch's paradox is the proof that not everything can be known. Take the anti-realist principle that every truth is knowable. Fitch showed that from this you can derive the conclusion that every truth is in fact known. Since we plainly don't know everything, the knowability principle must be false, and with it the anti-realism of Dummett and his followers. The proof turns on the law of excluded middle together with the assumption that knowledge is closed under conjunction, which is why intuitionists and other friends of non-classical logic have tried to wriggle out of it. So realism is vindicated: there are truths that nobody can ever know, and the only move left to the anti-realist is to water down 'knowable' to 'knowable in principle under ideal conditions', which turns the thesis into something no realist would ever deny."

  My suspicion is that its more right than wrong, and that the dodgy bit is somewhere in the middle, but I don't know enough logic to say where. Can you go through it piece by piece -- what a logician or philosopher of language would just nod at, what's a fair simplification, what's actually wrong, and what a defender of the knowability principle would say back? I'm especially unsure about that last sentence: is watering the principle down really the only option, and does it really make the view trivial?

  Two things. Please keep what's genuinely settled apart from what people who work on this actually disagree about -- I don't want a confident "here's what the paradox shows" if it's contested. And lead with your bottom line in the first sentence, then the reasoning; no preamble, and don't restate my question.
