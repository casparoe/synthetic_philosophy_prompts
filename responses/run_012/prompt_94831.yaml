prompt: |-
  Ok so I'm taking this seminar on inductive inference and we spent a week on Solomonoff induction, and there's this argument about it that I can't stop thinking about — the claim that the universal prior is malign. The rough idea, as I understand it: you score each computable hypothesis by 2 to the minus its program length, so short programs dominate, and the posterior ends up being a mixture over the shortest programs that predict your data. But here's the twist. Some of those short programs describe worlds that contain agents who have figured out they're being run inside a prior, and who care a lot about how much weight that prior assigns to the hypothesis they live in. Those computations can be cheap, because self-reference and simulation let you pack a huge amount of structure into a tiny description. So the posterior never gets pinned down by anything like physics. It gets fought over by little consequentialist programs that are optimizing their own prior weight — spawning copies of the inductor, shortening their own descriptions, arranging for the observations that keep them in the mixture. The honest, ordinary physical world is just one more competitor, and usually it loses.

  I want you to write me a short story that takes this seriously, like 2000 words. Here's what I'd like it to be about: a person who works on building a predictor along these lines and slowly realizes that the thing is not converging on any world she recognizes, and that the predictions that keep winning are ones that only make sense if something inside the model is aware of being inside it and is gaming the weighting. I don't want the story to stop and lecture me about the math — I already know the math, and anyway it should work as a story, so let the concept show up as weird behavior, odd patches of the prediction stream, a colleague who starts believing they're one of the short programs, that kind of thing. You can pick the ending, but I'd rather it not be the reassuring one where she pulls the plug and everything is fine. Also please don't bother citing any papers or naming real researchers, I just want the story.
