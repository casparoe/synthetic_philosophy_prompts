answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, Centre on Culture and Moral Cognition
  **FROM:** Resident Philosopher
  **DATE:** October 26, 2023
  **SUBJECT:** Prioritizing Lines of Inquiry for Postdoctoral Funding (Years 1–3)

  ### 1. Executive Summary

  Following the recent visiting lecture claiming that cross-cultural variation entails moral parochialism, this memo outlines a research agenda designed to test that claim rather than merely accumulate data supporting it. Our goal is not simply to document *that* moral judgments vary, but to determine *what that variation signifies* for moral truth and knowledge (the metaethical payoff).

  I propose ranking our priorities based on **Upstream Dependency**: we cannot interpret disagreement (Item 3) or construct debunking arguments (Item 4) until we know we are measuring the same construct (Item 1) with valid tools (Item 2). Furthermore, I address the "Calibration Problem"—the worry that variation only implies error if we already know who is reliable. This is not a philosopher's evasion, but it must be transformed from a skeptical roadblock into an empirical hypothesis regarding *conditions of convergence*.

  **Recommendation:** Fund **Item 1 (The Moral Concept)** and **Item 2 (Instrument Validity)** immediately. Defer **Item 3 (Folk Metaethics)**. Absorb **Item 4 (Debunking)** into theoretical work rather than empirical funding.

  ---

  ### 2. Diagnosis: The Calibration Problem

  You asked whether the "Calibration Problem" (variation implies error only if we possess an independent premise about reliability) is a correct diagnosis or a philosopher's evasion.

  **Verdict:** It is a **correct diagnosis**, but it becomes an evasion only if used to halt inquiry.
  If we treat it as a conversation-stopper ("We can't calibrate, so we can't infer error"), it is skepticism masquerading as methodological rigor. However, if we treat it as the **central empirical question** ("Under what conditions do moral faculties converge, and do those conditions track reliability markers?"), it becomes the most philosophically load-bearing project we could undertake.

  The empirical record threatens realism *only* if we assume that raw, unreflective divergence is the baseline for truth-tracking. If we can empirically demonstrate that divergence decreases under conditions of full information, emotional regulation, or dialogue (calibration via convergence), the threat to realism dissolves. Therefore, our research must not just measure divergence; it must measure the *dynamics* of agreement.

  ---

  ### 3. Analysis of Candidate Items

  Below is the case for the placement of each item, evaluated by upstream dependency, tractability for our interdisciplinary team, and current status in the literature.

  #### **Item 1: Variation in Verdicts vs. Weights vs. Moral Concept**
  *   **Placement:** **Priority 1 (Upstream).**
  *   **Rationale:** This is the semantic foundation. If the folk concept of "morality" (e.g., *dharma*, *ubuntu*, *right/wrong*) varies across cultures, then comparing verdicts on trolley problems is comparing apples to oranges. If the domain itself is parochial, the entire dataset of cross-cultural moral psychology is category-error noise.
  *   **Tractability:** High for a mixed team. Requires experimental semantics and vignette testing (Psych) coupled with conceptual analysis (Phil).
  *   **Status:** **Neglected.** Most literature assumes the category is stable and measures verdicts.
  *   **Mover Finding:** A finding that non-WEIRD populations classify "impurity" or "hierarchy" violations as *non-moral* (or vice versa) in ways that fundamentally alter the structure of the dilemma would spike this priority. If the concept is stable, this drops.

  #### **Item 2: Moral/Conventional Distinction & Harm Universal**
  *   **Placement:** **Priority 2 (Upstream).**
  *   **Rationale:** This is the methodological foundation. If the "moral/conventional" distinction is an artefact of Western schooling, or if "harm" is not a universal anchor but a WEIRD projection, our instruments are broken. We cannot measure variation if our ruler is culturally warped.
  *   **Tractability:** **Very High.** This is standard experimental psychology, requiring cross-cultural replication and instrument redesign.
  *   **Status:** **Fashionable/Contested.** Heavily debated, but often settled by fiat. Needs fresh data.
  *   **Mover Finding:** If we find a culture where the moral/conventional distinction holds but *harm* is not the criterial feature, this moves up (suggesting a different universal). If the distinction disappears entirely outside the West, this becomes the sole focus of the centre.

  #### **Item 3: Folk Metaethical Attitudes (Objectivism vs. Relativism)**
  *   **Placement:** **Priority 4 (Downstream).**
  *   **Rationale:** This depends on Items 1 and 2. Asking people if moral truths are "objective" is only meaningful if they share the concept of "moral" (Item 1) and understand the question without WEIRD bias (Item 2). Furthermore, folk metaethics has low metaethical payoff: realism is not false just because folks are relativists, nor true because they are objectivists. It is only useful as a debunking premise (see Item 4).
  *   **Tractability:** High (survey work).
  *   **Status:** **Fashionable.** Currently a growth industry, risking saturation.
  *   **Mover Finding:** If we find that "faultless disagreement" is a universal intuition across all cultures, this moves up, as it pressures realist accounts significantly.

  #### **Item 4: Genealogy and Debunking**
  *   **Placement:** **Priority 5 (Theoretical Synthesis).**
  *   **Rationale:** This is not an empirical line of inquiry for postdocs; it is a philosophical argument that uses empirical data. You cannot run an experiment to see if a genealogical argument begs the question. This is the *conclusion* of the centre's work, not the seed.
  *   **Tractability:** **Low** for empirical fellows. High for the PI/Philosopher.
  *   **Status:** **Philosophically Load-Bearing.** This is where the metaethical payoff is realized, but it cannot be funded as a "line of inquiry" in the same sense as the others.
  *   **Mover Finding:** N/A. This is argumentative, not empirical.

  #### **Item 5 (Added): Conditions for Convergence (The Calibration Project)**
  *   **Placement:** **Priority 3 (Midstream).**
  *   **Rationale:** This directly addresses your Calibration Problem. Instead of documenting static disagreement, we test whether disagreement persists under "idealized" conditions (e.g., full information, removal of self-interest, extended dialogue).
  *   **Tractability:** Medium. Requires complex longitudinal or dialogic experimental designs.
  *   **Status:** **Neglected.** Most psychology measures snap judgments, not reflective equilibrium.
  *   **Mover Finding:** If divergence collapses under conditions of reflection across cultures, this moves to Priority 1, as it solves the Calibration Problem empirically.

  ---

  ### 4. Ranking and Funding Decisions

  **The Ranking (by Metaethical Payoff weighted by Upstream Dependency):**
  1.  **Item 1:** Variation in the Moral Concept.
  2.  **Item 2:** Instrument Validity (Moral/Conventional & Harm).
  3.  **Item 5:** Conditions for Convergence (Calibration).
  4.  **Item 3:** Folk Metaethics.
  5.  **Item 4:** Genealogy/Debunking.

  **Fund First (2 Postdoc Clusters):**
  *   **Cluster A (Item 1):** *Experimental Semantics of the Moral Domain.* Two fellows to investigate whether the category "moral" is universal or parochial.
  *   **Cluster B (Item 2):** *Instrument Validation.* Two fellows to re-validate the moral/conventional distinction and harm norms in non-WEIRD populations.

  **Leave Unfunded (as separate empirical tracks):**
  *   **Item 4 (Debunking):** This should be the work of the Resident Philosopher and Senior PIs, synthesizing the data from Clusters A and B. Funding a postdoc to "test if debunking begs the question" is a category error.
  *   **Item 3 (Folk Metaethics):** Defer until Items 1 and 2 are settled. If the concept of morality varies, surveying folk metaethics is premature.

  ---

  ### 5. Criteria and Conflicts

  I have applied three criteria to this ordering:
  1.  **Philosophical Leverage:** How much does a positive/negative finding shift the metaethical needle? (Item 1 and 4 score highest).
  2.  **Upstream Dependency:** Does this question need to be answered before others make sense? (Item 1 and 2 score highest).
  3.  **Empirical Tractability:** Can this be answered by postdocs within 3 years? (Item 2 and 3 score highest).

  **The Conflict:**
  There is a tension between **Philosophical Leverage** and **Tractability**.
  *   *Item 1 (Concept)* has the highest leverage (it could invalidate the field) but is philosophically thorny and harder to operationalize than simple survey work.
  *   *Item 2 (Instruments)* has high tractability but risks being seen as mere "methodological housekeeping."
  *   *Item 4 (Debunking)* has the highest metaethical payoff but the lowest empirical tractability.

  **Resolution:**
  I defend weighting **Upstream Dependency** over immediate Tractability.
  If we fund the tractable but downstream items (like Folk Metaethics) first, we risk producing a volume of publishable papers that are philosophically vacuous because they rest on unverified assumptions about the moral concept. We must secure the validity of our data (Items 1 & 2) before we interpret its metaethical implications (Items 3 & 4).

  Regarding the **Calibration Problem**: By funding Item 5 (Convergence) as a mid-stream priority (absorbed into the design of Items 1 and 2), we ensure we are not merely documenting divergence (which fuels the visitor's parochialism claim) but testing the *reliability conditions* of moral cognition. This prevents the research from becoming a philosopher's evasion by making the calibration premise itself an object of empirical study.

  **Conclusion:**
  We should not fund research that merely adds data points to the "variation" column. We must fund research that tests the *significance* of that variation. Items 1 and 2 are the gatekeepers. If the gate is closed (the concept is parochial or the tools are biased), the rest of the centre's work is compromised. If the gate is open, we proceed to Calibration and Debunking with secure footing.
