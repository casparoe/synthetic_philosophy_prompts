prompt: |-
  Patent offices have this weird double practice around laws of nature. They won't grant a patent on a perpetual motion machine — an examiner can call the thing inoperative and even demand a working model before really examining it, on the grounds that it can't work because it would violate the laws of nature. But the same office also refuses patents on laws of nature themselves, on the grounds that a law is discovered rather than invented, so you can patent a new use of a law but never the law. What does that pair of practices presuppose about what a law of nature is?

  Heres my puzzlement. The office grants patents on all sorts of gadgets that later turn out not to work, and basically every law we've got has been revised or replaced at some point. So when an examiner says the machine can't possibly work because a law forbids it, what is he actually comitted to? If laws are just compact summaries of what happens to have happened (I think this is the Humean picture?), the reasoning looks circular: if the machine ran, then the summary was wrong, not violated, so the office is just betting on the past rather than ruling something out. But if laws are the things that make events go the way they do, and constrain what's possible in the first place, then violating a law really does mean impossible, and the practice makes sense as stated.

  So reconstruct the implicit theory of laws the practice needs. Say which parts of the practice strictly require that theory and which parts would survive fine on the summary view, and what the office would have to say instead about perpetual motion if we swapped the other view in. Also: does the discovery/invention line — the reason you can't patent a law itself — need the same metaphysics, or a different one?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** Patent offices have a dual practice regarding laws of nature:
          1.  They reject perpetual motion machines (PMMs) as *inoperative* because they violate laws of nature (implying laws are constraining/impossible to break).
          2.  They reject patents *on* laws of nature themselves because laws are *discovered*, not invented (implying laws are pre-existing truths).
      *   **The Puzzlement:**
          *   Patents are granted on gadgets that often fail later.
          *   Scientific laws are often revised/replaced.
          *   If laws are just Humean summaries (regularities), rejecting a PMM is circular/betting on the past.
          *   If laws are necessitarians (governing/constraining), rejecting a PMM makes sense (it's impossible).
      *   **The Task:**
          1.  Reconstruct the implicit theory of laws the patent office's practice *needs*.
          2.  Identify which parts of the practice require this theory vs. which work on the summary (Humean) view.
          3.  Explain what the office would say about PMMs if they adopted the summary view.
          4.  Analyze whether the discovery/invention distinction (for patenting laws themselves) requires the same metaphysics or a different one.

  2.  **Analyze the Implicit Theory of Laws (The "Patent Office Metaphysics"):**

      *   *Practice 1 (PMM Rejection):* To say a machine is "inoperative" *a priori* (before testing) based on a law implies the law is *modal*. It dictates what *can* and *cannot* happen, not just what *has* happened. It treats the law as a constraint on possibility. This leans towards **Necessitarianism** or **Governance** views (Armstrong, Dretske, Tooley) rather than Humean Regularity.
      *   *Practice 2 (No Patent on Laws):* To say a law is "discovered" implies it exists independently of human activity. It is objective truth waiting to be found. This fits both Necessitarian and Humean views (regularities exist independently of us), but the "discovery" language often carries a realist tint.
      *   *Synthesis:* The Patent Office operates as a **Pragmatic Realist**. They treat current scientific consensus as *provisionally necessary*. They don't need ultimate metaphysical truth, but they need *operational modality*.

  3.  **Address the Humean (Summary) View vs. Necessitarian (Governing) View:**

      *   *Humean View:* Laws are just descriptions of the best system of regularities. If a PMM worked, the law would just be updated.
      *   *Necessitarian View:* Laws govern events. If a PMM worked, reality would break.
      *   *Patent Office Stance:* They act *as if* laws are Necessitarian for the sake of administrative efficiency, even if they acknowledge scientifically that laws are fallible.
      *   *Requirement:* The *strong rejection* of PMMs (demanding a working model, calling it inoperative *ab initio*) strictly requires a modal/governing view (or at least a very high confidence in the stability of regularities). The *summary view* would force them to say, "We haven't seen this work before, so we doubt it," rather than "This cannot work."

  4.  **Drafting the Reconstruction (Step-by-Step):**

      *   **Introduction:** Acknowledge the tension. It's a clash between administrative finality and scientific fallibilism.
      *   **The Implicit Theory:** Call it "Administrative Necessitarianism" or "Provisional Modal Realism." The office treats established laws as *modal constraints* for the purpose of examination.
      *   **Part 1: The PMM Rejection (Inoperability):**
          *   *Requires:* A view where laws rule out possibilities, not just describe actualities.
          *   *Humean Problem:* On a Humean view, a PMM isn't impossible, just improbable given past data. The Office says "Impossible."
          *   *Adjustment:* If Humean, the Office must frame it as "undue burden of proof" or "contrary to established utility," not "violation of nature."
      *   **Part 2: The Discovery/Invention Distinction:**
          *   *Does it need the same metaphysics?* Not necessarily.
          *   *Analysis:* "Discovery" implies pre-existence. Humeans can accept pre-existing regularities. However, the *normative* force (why you can't own it) often leans on the idea that laws are part of the "commons" of reality, which fits better with Realism. But legally, it's more about pre-emption of thought.
          *   *Nuance:* The discovery/invention distinction is more epistemological/legal than metaphysical. It works on both views, but feels more natural with Realism.
      *   **Part 3: Synthesis/Conclusion:** The Office isn't doing metaphysics; they are managing risk. They treat laws as *functionally necessary* even if *metaphysically contingent*.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say the Patent Office *believes* laws are metaphysically necessary. They likely don't care. They care about *utility* (a patent requirement). If a machine violates thermodynamics, it has no specific, substantial, and credible utility.
      *   *Key Legal Standard:* The "Utility" requirement (35 U.S.C. § 101). A PMM lacks utility because it won't work.
      *   *The "Working Model" demand:* This is specific to PMMs (historically). It shifts the burden of proof.
      *   *Refining the Humean Counterfactual:* If the Office were Humean, they wouldn't say "It violates a law." They would say "The probability of it working is so low based on past data that we require extraordinary evidence (a model) before granting a monopoly."
      *   *Refining the Discovery/Invention:* This is about *eligibility* (§ 101). You can't monopolize the basic tools of scientific work. This is a policy decision, not strictly metaphysical. But the "discovered" language implies the law is *out there*.

  6.  **Final Polish:** Structure the response clearly.
      *   **The Implicit Theory:** "Operational Necessitarianism."
      *   **The PMM Practice:** Requires modality. Humean alternative is probabilistic skepticism.
      *   **The Discovery Practice:** Epistemological/Policy based. Compatible with both, but rhetoric favors Realism.
      *   **The Tension:** Fallibilism vs. Administrative Finality.

  7.  **Final Review against User Prompt:**
      *   Reconstruct implicit theory? Yes.
      *   Say which parts strictly require it? Yes (PMM rejection).
      *   Which parts survive on summary view? Yes (Discovery/Invention).
      *   What would they say if swapped? Yes (Probabilistic burden of proof).
      *   Does discovery/invention need same metaphysics? No, it's more policy/epistemology.

  8.  (Self-Correction on "Working Model"): Actually, the USPTO *stopped* generally requiring working models in the 19th century, *except* for PMMs. This highlights the exceptional status of PMMs. I should mention this specificity.

  9.  (Final thought on "Laws"): The prompt asks about "laws of nature." I need to ensure I distinguish between the *legal* law (statute) and the *scientific* law (physics). The prompt is clearly about scientific laws within the legal framework.

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts.)
answer: |-
  This is a sharp observation. You have identified a tension between the **fallibilism of science** (laws change, gadgets fail) and the **finality of administration** (patents are legal monopolies granted on the assumption of truth).

  To resolve your puzzlement, we need to reconstruct the "Patent Office Metaphysics." The Office does not operate as a laboratory of fundamental physics, nor as a seminar on Hume. It operates as a risk-management bureau. Here is the reconstruction of the implicit theory of laws their practice requires, where it breaks, and how the discovery/invention distinction fits in.

  ### 1. The Implicit Theory: "Operational Necessitarianism"

  The Patent Office's practice presupposes a theory of laws that I will call **Operational Necessitarianism**.

  On this view, a law of nature is not merely a description of what *has* happened (Humean regularity), nor is it necessarily an eternal, metaphysical truth (Strong Necessitarianism). Instead, a law of nature is treated as a **provisional modal constraint**.

  For the purposes of examination, established scientific laws (like Thermodynamics) are treated *as if* they are governing rules that define the boundary between the **possible** and the **impossible**, rather than the **actual** and the **unobserved**.

  *   **Why this theory?** Because a patent grants a 20-year monopoly. To grant a monopoly on a machine that claims to do $X$, the Office must be certain that $X$ is *capable* of being done. If the claim relies on breaking a law, the Office treats the claim as describing an impossibility.
  *   **The Metaphysical Commitment:** This requires a view of laws that has **modal force**. It treats laws as "making" events happen, or at least "forbidding" certain events. If laws were merely summaries, a perpetual motion machine (PMM) would not be *impossible*, merely *unprecedented*. The Office, however, rejects PMMs as *inoperative*, which is a claim about capability, not history.

  ### 2. Which Parts Require This Theory?

  **The PMM Rejection (Inoperability)**
  This part of the practice **strictly requires** Operational Necessitarianism (or something functionally identical).
  *   **The Logic:** To reject a patent application *before* testing (or to demand a working model as a condition of examination) on the grounds that it violates a law, the examiner must believe the law constrains future possibilities.
  *   **The Humean Problem:** If the Office adopted a strict Humean "Summary View," they could not logically say the machine "cannot work." They could only say, "It is highly improbable that this will work, given past data."
  *   **The Consequence:** On a Summary View, demanding a working model *before* examination is unreasonable. If laws are just summaries, the only way to update the summary is to observe the new data (the working machine). By demanding the model to prove it works, they are acknowledging that the machine *could* update the law. But by rejecting the patent *without* the model, they are asserting the law *cannot* be updated by this device. This is the circularity you noted.

  **The "Discovery" Rejection (Subject Matter Eligibility)**
  This part of the practice **does not strictly require** Operational Necessitarianism. It survives fine on the Summary View.
  *   **The Logic:** The rule is that you cannot patent a law of nature because it is a "basic tool of scientific and technological work" (per *Mayo v. Prometheus*).
  *   **Compatibility:** Whether a law is a "governing constraint" or a "compact summary," it exists independently of the applicant's mind.
      *   *Necessitarian:* The law exists "out there" governing reality; I found it.
      *   *Humean:* The regularity exists "out there" in the history of the universe; I summarized it.
  *   **The Distinction:** In both metaphysics, the law is **pre-existing**. The "Discovery vs. Invention" line is primarily **epistemological and policy-driven**, not metaphysical. It is about preventing the monopolization of knowledge itself, regardless of whether that knowledge describes a governing force or a statistical regularity.

  ### 3. What if the Office Swapped to the Summary View?

  If the Patent Office explicitly adopted the Humean Summary View (laws are just records of past regularities), their language and procedure regarding Perpetual Motion Machines would have to shift from **Modal Rejection** to **Evidentiary Burden**.

  *   **Current Language (Necessitarian):** "This invention is inoperative. It violates the Second Law of Thermodynamics. It is impossible."
  *   **Summary View Language:** "This invention claims a result that has never been observed in the history of physics. The probability of it functioning is vanishingly small. Therefore, the burden of proof is on the applicant to provide a working model before we will even consider the paperwork."

  **The Practical Difference:**
  Under the current (Necessitarian-ish) view, the examiner acts as a gatekeeper of **possibility**. Under the Summary view, the examiner acts as a gatekeeper of **probability**.
  *   In the current system, if you bring a working PMM, the Office is embarrassed because they said it was *impossible*.
  *   In the Summary system, if you bring a working PMM, the Office simply says, "Well, the summary has changed. The patent is valid, and physics textbooks need updating."

  The Office avoids the Summary View language because it undermines the authority of the examination. Admitting that a patent rejection is just a "bet on the past" makes the patent system look like a gambling house rather than a validator of technical truth.

  ### 4. Does the Discovery/Invention Line Need the Same Metaphysics?

  No. In fact, the Discovery/Invention distinction relies on a **different** philosophical axis: **Human Agency vs. Objective Reality.**

  *   **PMM Rejection (Modal Axis):** This is about *Possibility vs. Impossibility*. It needs laws to have "teeth" (constraints).
  *   **Law Patent Rejection (Ontological Axis):** This is about *Creation vs. Recognition*.

  You can hold a Humean view (laws are summaries) and still agree you shouldn't patent them. Why? Because the summary describes the world as it is, not a machine you built. If I patent the law of gravity, I am trying to own the description of how apples fall, not a specific method of catching apples.

  However, there is a subtle tension here. If laws are *just* summaries (Humean), then a "new" law is arguably a new *mental construct* (a new way of summarizing data). One could argue that a new mathematical formulation of a physical regularity is an "invention" of the human mind, not a "discovery" of a pre-existing thing.

  The Patent Office rejects this argument. They treat the law as **pre-existing truth**. This leans slightly toward **Realism**. They assume the law was "true" before you wrote it down.
  *   **If they were strict Instrumentalists** (laws are just tools for prediction, not truth), the line between discovering a law and inventing a predictive model blurs.
  *   **The Office's Stance:** They treat laws as **Real** (for the purpose of eligibility) but **Constraining** (for the purpose of utility).

  ### Summary of the Reconstruction

  The Patent Office's double practice relies on a **pragmatic split in metaphysics**:

  1.  **For Utility (PMMs):** They treat laws as **Necessitarian**. Laws constrain what is possible. This allows them to reject applications *a priori* without testing, saving administrative resources. It treats the law as a wall you cannot walk through.
  2.  **For Eligibility (Laws themselves):** They treat laws as **Realist**. Laws exist independently of the inventor. This prevents the monopolization of the "building blocks" of reality.

  **The Resolution to Your Puzzlement:**
  The Office is not committed to the idea that scientific laws are *metaphysically* unchangeable. They are committed to the idea that they are **administratively final**.

  When an examiner says a PMM "violates a law," they are not making a claim about the fundamental fabric of the universe that will hold for eternity. They are making a claim about the **standard of proof**. They are saying: *"The consensus of the scientific community is so strong on this regularity that, for the purposes of this legal proceeding, we treat any claim contradicting it as false until proven otherwise by a physical model."*

  They are betting on the past (Humean), but they are speaking in the language of necessity (Necessitarian) to maintain the efficiency of the legal system. The "weird double practice" is the friction between **scientific fallibilism** and **legal finality**.
