answer: |-
  ### Pass 1: Translation

  Here is the mapping of the HCH (Humans Consulting HCH) and Factored Cognition construction into the vocabulary of organizational economics.

  **1. The Hard Question $\to$ The Principal's Objective**
  *   **HCH:** A complex query posed to the root node.
  *   **Org Econ:** The residual claimancy or final deliverable required by the firm's owners/principals.
  *   **Mapping:** Tight. Both represent the exogenous demand that initiates the production process.

  **2. Bounded Subagents $\to$ Specialized Units with Bounded Rationality**
  *   **HCH:** Agents with limited cognitive capacity (time/context window) who cannot solve the root problem directly.
  *   **Org Econ:** Employees or departments operating under Herbert Simon's *bounded rationality*. They possess specialized human capital but lack the bandwidth to process the firm's entire information set.
  *   **Mapping:** Tight. Both frameworks accept that cognitive/processing capacity is a scarce resource that necessitates distribution.

  **3. Recursive Call $\to$ Delegation and Internal Contracting**
  *   **HCH:** A node spawns sub-queries to child nodes.
  *   **Org Econ:** A manager delegates a subtask to a subordinate or an internal department.
  *   **Mapping:** Loose. In HCH, the "spawn" is instantaneous and costless (frictionless recursion). In Org Econ, delegation incurs *transaction costs* (drafting instructions, handover time) and alters the risk profile. HCH assumes the subagent is cognitively identical to the parent (a clone); Org Econ assumes the subagent has different skill sets and information sets.

  **4. Tree Depth $\to$ Hierarchical Layers**
  *   **HCH:** Amplification of capability through deeper trees of reasoning.
  *   **Org Econ:** Layers of management.
  *   **Mapping:** Divergent. In HCH, depth linearly increases cognitive power (more "compute"). In Org Econ, depth increases *agency loss* and information distortion (the "telephone game" effect). HCH views depth as an asset; Org Econ views it as a necessary evil to maintain *span of control*.

  **5. Caller's Check $\to$ Monitoring and Audit**
  *   **HCH:** The parent node reviews the child's output and accepts/rejects it based on understanding.
  *   **Org Econ:** Quality control, performance review, or audit functions.
  *   **Mapping:** Critical Tension. HCH assumes the parent can verify the child's work *cheaply* relative to doing it themselves, provided the work is decomposed correctly. Org Econ posits that if verification were cheap, the principal would do the task; delegation occurs precisely when verification is costly or impossible (information asymmetry).

  **6. Root Answer $\to$ Firm Output**
  *   **HCH:** The synthesized answer delivered to the user.
  *   **Org Econ:** The good/service sold to the market.
  *   **Mapping:** Tight. Both are the aggregate product of the coordinated labor.

  **7. Alignment/Honesty $\to$ Incentive Compatibility**
  *   **HCH:** Implicitly assumes subagents are trying to help the root (often modeled as "you" at different times).
  *   **Org Econ:** Assumes divergent utility functions (shirking, empire building) requiring *incentive compatibility* constraints to align interests.
  *   **Mapping:** Loose. HCH assumes away the principal-agent problem by fiat (or assumes it is solved by the "aligned AI" context). Org Econ treats the principal-agent problem as the central constraint of organizational design.

  ***

  ### Pass 2: Residue Report

  This section identifies features that do not map cleanly, focusing on the friction points you highlighted.

  **1. The "Cheap Verification" Assumption**
  *   **HCH Claim:** A task can be decomposed such that the parent can verify the child's output without possessing the child's full computational capacity.
  *   **Org Econ Reality:** This corresponds to the distinction between *verifiable* and *non-verifiable* information in contract theory. Org Econ insists that for complex cognitive labor (R&D, strategy), output is often non-verifiable by a superior without duplicating the labor.
  *   **Residue:** HCH assumes a "decomposition miracle" where complexity is reduced without losing verifiability. Org Econ asserts that decomposition usually creates *information asymmetry* (the agent knows more about the task difficulty than the principal). If verification were truly cheap, the firm would not need the hierarchy; it would just use a market contract.

  **2. Divergent Objectives and Private Information**
  *   **HCH Claim:** Subagents are cooperative parts of a whole. Private information is shared up the tree via the answer.
  *   **Org Econ Reality:** Agents hold private information (hidden information) and take hidden actions (moral hazard). Objectives diverge (e.g., a subagent might prefer an easier task over a correct one).
  *   **Residue:** HCH has no vocabulary for *strategic misrepresentation*. In HCH, a subagent cannot lie to save effort. In Org Econ, this is the default risk. The HCH model lacks a mechanism for *bonding* or *signaling* to prove honesty, because it assumes honesty is structural.

  **3. Communication and Context Costs**
  *   **HCH Claim:** Context is passed perfectly between nodes.
  *   **Org Econ Reality:** Knowledge is often *tacit* (Hayek). Transferring context requires codification, which is lossy and expensive.
  *   **Residue:** HCH treats context transfer as zero-marginal cost. Org Econ treats it as the primary driver of the "make-or-buy" decision. If internal communication costs exceed market transaction costs, the firm should outsource (buy) rather than delegate (make). HCH assumes "make" is always viable if the tree is deep enough.

  **4. Residual Claimancy and Risk**
  *   **HCH Claim:** The root owns the answer; subagents own nothing.
  *   **Org Econ Reality:** Who bears the risk of error? In firms, shareholders are residual claimants. Employees are paid fixed wages (usually) to shield them from risk they cannot control.
  *   **Residue:** HCH does not model risk allocation. If a subagent makes a subtle error that propagates up the tree, HCH treats it as a "wrong answer." Org Econ asks: *Who pays for the error?* and *How do we structure compensation to minimize error probability?* HCH lacks a theory of liability.

  ***

  ### Pass 3: Adjudication

  For each significant piece of residue, I must determine if the organizational vocabulary is failing to capture a new phenomenon, or if the HCH idealization is ignoring a fundamental constraint.

  **1. Adjudication on "Cheap Verification"**
  *   **Residue:** HCH assumes verification is cheap post-decomposition; Org Econ says verification costs define the limit of the firm.
  *   **Judgment:** **HCH is papering over something.** The "Factored Cognition Hypothesis" is an empirical claim that complex tasks *can* be broken into verifiable chunks. Organizational economics correctly identifies that in many high-skill domains (law, medicine, engineering), verification requires expertise equivalent to production. If HCH works, it is because cognitive labor has different properties than physical labor, but assuming it *a priori* ignores the "Expertise Paradox" (you need to know the answer to verify the answer). The organizational vocabulary is not missing this; it correctly identifies it as a transaction cost.

  **2. Adjudication on "Divergent Objectives"**
  *   **Residue:** HCH assumes alignment; Org Econ assumes conflict.
  *   **Judgment:** **HCH is papering over something.** HCH is an idealization of *deliberation*, not *organization*. It models a single mind extended in time, not a coalition of agents. By treating subagents as "selves," it assumes away the agency costs that Org Econ correctly identifies as the primary friction of scaling. If you implement HCH with actual humans (a firm), agency costs appear immediately. If you implement it with AI, alignment is the hard problem. HCH assumes the hard problem is solved to focus on the scaling problem. Org Econ refuses to make that assumption.

  **3. Adjudication on "Context Costs"**
  *   **Residue:** HCH assumes lossless context transfer; Org Econ assumes lossy transmission.
  *   **Judgment:** **HCH is papering over something.** This is the "frictionless vacuum" assumption. In physics, frictionless models are useful for understanding forces, but they fail to predict heat or wear. Similarly, HCH is useful for understanding logical dependency, but it fails to predict the degradation of meaning across layers. Organizational economics captures the thermodynamic reality of information flow. The vocabulary is not defective; HCH is simply operating in a regime where transaction costs are assumed to be zero.

  **4. Adjudication on "Risk and Liability"**
  *   **Residue:** HCH ignores who pays for errors.
  *   **Judgment:** **HCH is papering over something.** In a firm, error costs determine the span of control. If a subordinate's error is catastrophic, the manager does not delegate. HCH treats all errors as equal "wrong answers." This is a defect of the idealization, not the vocabulary. Org Econ correctly identifies that risk tolerance dictates structure.

  **Overall Synthesis:**
  The organizational economics vocabulary is robust because it was built to explain why firms *stop* growing (Coasean limits). HCH is built to explain how cognition *can* grow (alignment scaling). The residue exists because HCH intentionally abstracts away the frictions (incentives, communication costs, verification difficulty) that Org Econ posits are the *defining features* of organized labor. The Org Econ vocabulary is not missing the concepts; it is explicitly modeling the costs that HCH sets to zero.

  Verdict: The HCH idealization is papering over the transaction costs, agency problems, and verification frictions that organizational economics correctly identifies as the fundamental constraints on scaling coordinated cognition.
