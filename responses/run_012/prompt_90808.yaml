answer: |-
  **Main Bit: The Queue**

  Two colleagues are standing at the end-of-term party, watching a line form for the keg.

  The Methodological Individualist says, "I can explain this line. Person one wants beer. Person two sees person one, infers quality, and calculates the utility of waiting versus thirst."

  The Holist says, "No. The Queue exists. The Queue selects who drinks."

  The Individualist says, "But the Queue is just people standing! Where is the mechanism? What is the Queue's utility function?"

  The Holist says, "The Queue doesn't have a utility function. It has normative pressure. If person one leaves, the Queue remains. If the Queue dissolves, person one is just loitering."

  The Individualist says, "But norms are just internalized expectations! I need the beliefs and desires of the actors!"

  The Holist says, "Fine. But the actors don't know why they're waiting. They're just following the shape of the line."

  **Punchline:**
  The Individualist says, "So you're saying the explanation is valid even if no individual holds it?"
  The Holist says, "I'm saying the explanation is valid *because* no individual holds it. If everyone knew why they were standing here, they'd realize there's no beer and go home."

  ***

  **Alternate 1: "In Principle"**

  The Methodological Individualist insists that every social explanation must be reconstructible from individual actions… *in principle*.
  The Holist argues that "in principle" is a black box doing all the heavy lifting.

  **Punchline:**
  It's the only place in science where "available in principle" is allowed to do more explanatory work than the actual individuals. It's like saying, "I can explain this bridge in terms of physics, provided I don't have to calculate the load-bearing atoms." You get the ontology without the engineering.

  ***

  **Alternate 2: Supervenience**

  We all agree that social facts supervene on individual facts. No change in the society without a change in the people. Like a shadow depends on a person.

  **Punchline:**
  But the Individualist thinks that means you explain the shadow by looking at the person. The Holist thinks you explain the person by looking at the shadow. And they're both standing in the same room, arguing about who is holding up the floor, while the shadow gets longer.
