answer: |-
  This is a classic demarcation problem, and you have a rich dataset in Rosa's lunchtime verdicts. You are right to suspect that her "it depends" is actually a structured heuristic, even if she hasn't articulated it fully yet. Based on the pattern of her verdicts, here is the breakdown of her likely reasoning, the competing hypotheses, the prediction for your brother, and how to handle Thanksgiving.

  ### 1. The Rule Rosa Is Actually Running
  **The "Immunization and Accountability" Heuristic.**

  Rosa is not using Popperian falsifiability (she explicitly rejected that for astrology). She is not using a simple "truth" metric (Cold Fusion and Priming are likely false, yet she exempts them). She is not using an institutional metric alone (Freud is "mostly dead" but was a "real research tradition").

  Her consistent differentiator is **how the practitioners handle negative evidence and institutional scrutiny.**

  *   **Astrology:** Negative evidence is explained away ("answer for every result"). No attempt to risk embarrassment. $\rightarrow$ **Pseudoscience.**
  *   **Social Priming:** Negative evidence is acknowledged ("eat the nulls"). Submission to review remains. $\rightarrow$ **Not Pseudoscience** (just wrong/degenerating).
  *   **Cold Fusion:** Claim was tested, failed, and largely abandoned by the originators. $\rightarrow$ **Not Pseudoscience** (just a failed claim).
  *   **Multiverse:** Metaphysical, but attached to a progressive research programme (physics) that *does* submit to empirical rent. $\rightarrow$ **Not Pseudoscience.**

  **The Rule:** A field is pseudoscience if it adopts the *aesthetic* of science (predictions, data) but employs **immunizing stratagems** to protect the core hypothesis from refutation, specifically by rendering negative evidence irrelevant or conspiratorial.

  ### 2. Alternative Rules (Equifinality)
  To be rigorous in your workshop, you need to show that other rules fit her past data just as well. Here are the two strongest competitors:

  **Alternative A: The "Institutional Engagement" Rule**
  *   **Logic:** Science is what happens inside the peer-review ecosystem. If you opt out, you are doing something else.
  *   **Fit:** Explains Astrology (no journals), Creation Science (no journals), Priming (journals), Cold Fusion (journals).
  *   **Conflict:** Multiverse is often criticized for *lack* of empirical testability, yet she exempts it. Also, Freud's psychoanalysis was largely clinical, not always journal-based in the modern sense, yet she calls it a "real research tradition."
  *   **Prediction for Brother:** **Pseudoscience.** He explicitly refuses journals.

  **Alternative B: The "Historical Trajectory" Rule (Lakatosian)**
  *   **Logic:** Is the research programme progressive (predicting novel facts) or degenerating (adding ad hoc patches to save the core)?
  *   **Fit:** Explains Astrology (degenerating/stagnant), Priming (degenerating but trying), Cold Fusion (terminated).
  *   **Conflict:** Hard to apply to Multiverse (currently non-empirical).
  *   **Prediction for Brother:** **Pseudoscience.** "Hunting for conditions" after 2 years without a robust effect suggests a degenerating problemshift.

  ### 3. The Prediction: Will She Call Him a Pseudoscientist?
  **Yes.** (Or she will use a synonym like "Pathological Science" that functions identically in this context).

  **Why:**
  Your brother passes the "Mertonian" test on *disinterestedness* (no money) and *communism* (shares data on a wiki). He even passes the "honesty" test (posts nulls, fixed bugs).

  However, he fails the **Immunization Test**, which is Rosa's primary trigger.
  1.  **"Effect is fragile":** This is the "No True Scotsman" fallacy. It moves the goalposts post-hoc.
  2.  **"Skeptics watching... can suppress it":** This is the killer. This is functionally identical to astrologers saying "the stars were misaligned" or homeopaths saying "you drank coffee." It turns negative evidence *into* positive evidence for the theory. It makes the claim unfalsifiable in practice, regardless of preregistration.

  Rosa distinguishes Cold Fusion (tested and lost) from Astrology (never truly tested). Your brother is preventing the "test and lose" outcome by claiming the test itself is corrupted by the observer's mindset. To Rosa, that is the definition of the pseudoscientific move.

  ### 4. The "Hand-Forcer" Case Study
  To make her reveal her hand during the Q&A, do not ask about your brother directly. Ask about the **Princeton Engineering Anomalies Research (PEAR) Lab.**

  **The Setup:**
  > "Rosa, consider the PEAR lab (1979–2007). They ran RNG experiments similar to my case study. They published in journals for decades. They claimed small effect sizes. They argued that 'operator intention' affected machines. Eventually, they shut down because they couldn't replicate robustly enough to satisfy the broader community, but they maintained their data integrity. Was PEAR pseudoscience, or just a terminated research programme like Cold Fusion?"

  **Why this works:**
  *   **If she says Pseudoscience:** She will likely classify your brother as such, because his work is a direct descendant of PEAR. The "consciousness field" affecting RNGs is the PEAR hypothesis.
  *   **If she says Terminated Programme:** She might spare your brother, *unless* you follow up with the "Skeptic Suppression" detail.
  *   **The Follow-up:** "What if a modern group replicates PEAR's methods but adds the claim that *skeptical observers* dampen the effect, making replication impossible by design? Does that move it from 'terminated programme' to 'pseudoscience'?"

  This isolates the **Immunization** variable from the **Topic** variable. If she says yes to the follow-up, she has confirmed the "Immunization Rule," and your brother is doomed.

  ### 5. Off the Record: Thanksgiving Strategy
  You asked if there is anything in his setup a reasonable person would say is "the thing doing the damage." There is. It is not the RNGs, the Discord, or the lack of journals.

  **It is the "Skeptic Suppression" Hypothesis.**

  **Why this is the damage point:**
  1.  **It violates the norm of Universalism:** Science assumes that data is independent of the observer's identity or beliefs. Claiming that a skeptic's *mindset* alters the hardware output is a metaphysical claim disguised as a methodological control.
  2.  **It creates a closed loop:** If a run works, it proves the field exists. If a run fails, it proves the skeptics were too strong. There is no outcome that disproves the theory.
  3.  **It alienates collaborators:** You cannot collaborate with someone who believes your mere presence might break their experiment.

  **What to say to him:**
  Do not attack the consciousness field. Do not attack the lack of journals (he has reasons for that). Attack the **suppression claim** on pragmatic grounds.

  > "The preregistration and the bug-fixing are great. That's real scientific rigor. But the claim that skeptics suppress the data is hurting you. It makes the negative results useless. If you want to be taken seriously, even by sympathetic physicists, you have to treat a null result as a null result, not as 'suppression.' Otherwise, you're not testing the hypothesis anymore; you're protecting it."

  **Summary for your Workshop:**
  Bet on Rosa classifying your brother as a pseudoscientist because he treats negative evidence as conspiratorial rather than empirical. She values the *social process of error correction* over the *truth of the claim*. Your brother has opted out of the error correction (journals) and corrupted the remaining correction (Discord) by blaming the observers. To Rosa, that is the line.
