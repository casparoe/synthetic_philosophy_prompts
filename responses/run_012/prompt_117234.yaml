      *   *Refinement:* Ensure I acknowledge the brother's good practices (preregistration) but explain why Rosa will likely weigh the bad practices heavier. The "Not Even Wrong" comment is key—she might reserve "pseudoscience" for malicious deception and call this "pathological science" or "fringe," but for the workshop, "pseudoscience" is the likely label for the *activity*.

      *(Self-Correction during drafting)*: Wait, Rosa said Freud is *not* pseudoscience, just "mostly dead." She said Cold Fusion is *not* pseudoscience, just "tested and lost." She is very reluctant to use the P-word. She reserves it for things that *game the system* (Astrology).
