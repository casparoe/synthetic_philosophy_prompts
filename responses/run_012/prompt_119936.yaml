  The ground I give up is insisting group-level language is forbidden. If grouping individuals allows calculating the Price equation, a statistical partition of selection into within-group and between-group effects, use it. It is a bookkeeping convenience, a shorthand for interactions among replicators, units that copy themselves. I concede talking about mat survival works, provided you know the ledger balances at the gene level.

  The ground I hold is that causation flows exclusively through differential replication of inherited information. Groups lack fidelity; genes are the only true replicators, units that copy themselves with high fidelity across generations. When the mat sinks, selfish genes increased in frequency until their vehicle, the physical entity constructed by genes, collapsed. The apparent group interest is merely the statistical shadow cast by genes that cooperate when clustered. To attribute causal power to the group is to confuse the vehicle with the replicator, the information persisting through time. The group term captures the covariance, a measure of how two variables change together, between group trait and survival, but that covariance exists only because genes caused the trait.

  The test I would accept is a demonstration of inheritance without discrete replicators. Show me adaptive complexity accumulating without copying specific information structures, and I surrender. Gene selectionism relies on particulate inheritance, where traits are passed as distinct units rather than blending averages. If a group reproduced as a whole, passing specific organizational structure to offspring with higher fidelity than genes within them, group selection would be causal. Until then, altruism reduces to kin selection, where helping evolves because recipients share the helper's genes. Show me a vehicle building itself without a replicator blueprint, or average fitness increasing while allele frequency, variant forms of a gene, remains static, and I concede.

  The question I put back to you is simple: if bodies are not vehicles designed for gene survival, why do they sacrifice themselves for kin? If organisms had independent interests, why does apoptosis, programmed cell death for the good of the whole, exist within them?
