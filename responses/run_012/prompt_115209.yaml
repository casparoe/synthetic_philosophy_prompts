prompt: |-
  I sit on the investment committee of a midsize regional foundation -- we fund things in tranches, and every quarter we have to decide wether to release the next tranche, extend, or kill a grant. It's about six decisions a year, six figures each, and the meeting is 90 minutes. Nobody on the committee is an economist, and the program officer who proposed the original grant is always in the room, which I'm starting to think is part of the problem.

  We keep doing the thing where we've put in $400k and the next tranche is $150k and someone says "we can't walk away now, we'd lose everything we've put in." I want a procedure we can actually run in the meeting, not a lecture. It should be grounded in the dollar auction and the escalation-of-commitment literature but usable by people who've never heard of either.

  Give me: the questions to ask in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to the committee because it's a values question and not a fact question.

  I want it to survive the stuff that makes these decisions hard, not paper over them:
  - the difference between "we've already spent it" (irrelevant) and what the past spending has told us (not irrelevant) -- don't let the procedure confuse the two
  - the case where the next increment is genuinely cheap relative to what finishing buys us (the half-built bridge, the asset that's worth nothing unless it's completed)
  - the dollar-auction bit specifically: in that game the person who's trapped isn't the leader, it's the second-highest bidder, the one who has to pay and gets nothing. So the procedure should make us ask who in our situation is the second-highest bidder, and who's the auctioneer -- who actually benefits from us staying in.
  - and the ugly one: sometimes continuing really is correct, and the procedure should be able to say so, otherwise people will just ignore it.

  Run it on two real-ish cases: a digital records project that's 70% done and whose vendor has walked, and a cohort-based fellowship where the first two cohorts underperformed but the third looks different. And tell me where the procedure will misfire and what it can't decide. One of the two should come out in a way the committee won't like -- don't sand off the edges.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Investment committee member, midsize regional foundation.
      *   **Context:** Quarterly meetings, 90 mins, ~6 decisions/year, ~$150k/tranche decisions (sunk costs ~$400k).
      *   **Problem:** Escalation of commitment ("we can't walk away now"), sunk cost fallacy, program officer bias (proposer is in the room).
      *   **Requirements:**
          *   Actionable procedure for the meeting (not a lecture).
          *   Grounded in dollar auction/escalation-of-commitment literature but jargon-free.
          *   Specific structure: Questions in order, criteria for "good enough" answers, stop rules (automatic no), hand-off rules (values vs. facts).
          *   Must handle specific nuances: Sunk cost vs. learning from past spending, "half-built bridge" scenarios, identifying the "auctioneer/second-bidder" dynamic, allowing for valid continuation.
          *   Test cases: Digital records project (vendor walked, 70% done) vs. Cohort fellowship (2 bad cohorts, 3rd looks different).
          *   Constraint: One outcome must be unpalatable (no sugar-coating).
          *   Limitations: Where it misfires/can't decide.

  2.  **Deconstruct the Psychological/Economic Traps:**
      *   *Sunk Cost Fallacy:* "We spent $400k, so we must spend $150k." -> *Correction:* "Is the $150k worth the *future* value, ignoring the $400k?"
      *   *Escalation of Commitment:* Doubling down to justify past decisions. -> *Correction:* "If we weren't already involved, would we start this today?"
      *   *Dollar Auction:* Bidding more than the prize is worth to avoid losing the bid fee. -> *Correction:* "Who benefits if we keep paying? Are we the second-highest bidder?"
      *   *Program Officer Bias:* The PO wants their project to succeed. -> *Correction:* Separate the PO's advocacy from the committee's oversight.

  3.  **Drafting the Procedure (The "Tranche Test"):**
      *   *Goal:* Keep it under 15 mins per decision (6 decisions x 15 mins = 90 mins).
      *   *Structure:* Needs to be a checklist or a script.
      *   *Phase 1: The Counterfactual (Sunk Cost Check).* Ignore past spend. Would we write this check today for a new applicant?
      *   *Phase 2: The Completion Logic (Half-Bridge Check).* Is the marginal cost worth the marginal gain?
      *   *Phase 3: The Incentive Audit (Dollar Auction Check).* Who wants us to stay in?
      *   *Phase 4: The Kill Switch.* Automatic nos.
      *   *Phase 5: The Values Handoff.* When data ends and philosophy begins.

  4.  **Refining the Questions & Criteria:**
      *   *Q1 (The Cold Start):* "If this application landed on our desk today from a stranger, with no history, would we fund it?"
          *   *Good Answer:* "Yes, because [future metrics]."
          *   *Bad Answer:* "Yes, because we already gave them $400k."
      *   *Q2 (The Bridge):* "What specifically does this $150k buy that the $400k didn't? Is the asset useless without it?"
          *   *Good Answer:* "It completes the backend, making the frontend usable."
          *   *Bad Answer:* "It keeps the lights on."
      *   *Q3 (The Auctioneer):* "If we walk away, who loses money? If we stay, who gets paid?"
          *   *Good Answer:* "The beneficiaries lose. The vendor gets paid."
          *   *Bad Answer:* "Our reputation takes a hit." (This is often a trap).
      *   *Stop Rule:* If Q1 is No AND Q2 is No -> Kill.
      *   *Handoff:* If Q1 is No BUT Q2 is Yes -> Committee Vote (Values: Do we care about finishing things or cutting losses?).

  5.  **Developing the Test Cases:**
      *   *Case A: Digital Records (Vendor Walked).*
          *   Sunk: $400k. Needed: $150k.
          *   Status: 70% done. Vendor gone.
          *   Analysis: Q1 (Cold Start) -> Probably No (why hire a vendor who walks?). Q2 (Bridge) -> Maybe, if code is salvageable. Q3 (Auction) -> Who benefits? Maybe a new vendor? Or the PO saving face?
          *   *Verdict:* Likely Kill. The "70% done" is a trap if the architecture is flawed.
      *   *Case B: Fellowship (2 Bad, 1 Good).*
          *   Sunk: $400k. Needed: $150k.
          *   Status: Iterative learning.
          *   Analysis: Q1 (Cold Start) -> Maybe Yes (model improved). Q2 (Bridge) -> Yes, need cohort 3 to validate pivot. Q3 (Auction) -> Who benefits? Fellows.
          *   *Verdict:* Fund. But needs strict milestones.
      *   *Constraint Check:* The prompt asks for one outcome the committee won't like. Usually, committees hate killing the "70% done" project because it feels like waste. So, Case A should be a hard "Kill."

  6.  **Addressing Specific Nuances:**
      *   *Sunk Cost vs. Learning:* The procedure must distinguish "we spent money" (irrelevant) from "spending money taught us X" (relevant).
      *   *Dollar Auction:* Explicitly ask "Who is the auctioneer?"
      *   *Program Officer:* The PO provides data, but the Chair asks the questions. PO shouldn't vote on their own project (if possible), or at least recuse from the "Cold Start" question.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the constraint (90 mins, 6 decisions).
      *   **The Protocol:** "The Tranche Gate."
      *   **The Questions:** Numbered, with "Pass/Fail" criteria.
      *   **The Decision Matrix:** How to combine answers.
      *   **The Simulations:** Run the two cases.
      *   **Failure Modes:** Where this breaks.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 mins per decision realistic?
      *   *Fix:* Emphasize that the Program Officer must submit written answers *before* the meeting. The meeting is for *challenge*, not exposition.
      *   *Critique:* Is the PO presence unavoidable?
      *   *Fix:* Yes, user said they are always in the room. The procedure must mitigate their influence, not remove them. Use the "Cold Start" question to neutralize their emotional investment.
      *   *Critique:* Make sure the "Dollar Auction" aspect is clear.
      *   *Fix:* In Q3, explicitly define the "Auctioneer" as the party capturing value if the foundation keeps paying without result (e.g., a vendor, a partner org padding staff time).

  9.  **Final Polish:** Ensure tone is professional, direct, and usable. (Proceed to generate response).

  *(Self-Correction on Case A)*: If the vendor walked, is the code usable? If not, it's 0% done, not 70%. This is a crucial distinction for the "Half-Bridge" test. I need to make sure the procedure highlights this.
  *(Self-Correction on Case B)*: The committee might like funding the fellowship. To make one outcome unpalatable, I should ensure the Digital Records project gets killed decisively, as committees hate writing off "almost finished" tech projects.

  10. **Final check against constraints:**
      *   Questions in order? Yes.
      *   Good enough answers defined? Yes.
      *   Stop rules? Yes.
      *   Values handoff? Yes.
      *   Sunk cost vs. Learning? Addressed in Q1/Q2.
      *   Half-built bridge? Addressed in Q2.
      *   Dollar Auction (2nd bidder/auctioneer)? Addressed in Q3.
      *   Two cases run? Yes.
      *   One unpalatable outcome? Yes (The 70% project dies).
      *   Misfire analysis? Yes.

  Let's write it.cw
answer: |-
  Here is a procedure designed for your constraints: 90 minutes, six decisions, non-economists, high emotional stakes. It is called **The Tranche Gate**.

  To work within 90 minutes, the Program Officer (PO) must submit written answers to these questions 48 hours before the meeting. The meeting time is used *only* to challenge the answers, not to hear them.

  ### The Procedure: The Tranche Gate

  **Rule 0:** The Program Officer presents the data (5 mins max). The Committee Chair facilitates. The PO does not vote on their own grant (if bylaws allow) or must abstain during the "Cold Start" question.

  #### Question 1: The Cold Start (Sunk Cost Filter)
  **Ask:** "If this application landed on our desk today from a stranger, with no history and no prior funding, would we write a check for $150k based *only* on the future plan?"
  *   **The Trap:** Answering "Yes" because "they've done so much work already."
  *   **Pass:** "Yes. The current model/metrics stand on their own merit."
  *   **Fail:** "No. We are only funding this to protect the prior investment."
  *   **The Learning Exception:** If the answer is "No," the PO can argue: "We wouldn't fund the *old* plan, but the $400k bought data that proves the *new* plan works." This moves the discussion to Q2.

  #### Question 2: The Bridge Test (Marginal Utility)
  **Ask:** "Is the asset currently useless without this specific $150k, and is the completed asset worth significantly more than $550k (total cost)?"
  *   **The Trap:** Confusing "activity" with "completion." (e.g., "It keeps the staff employed" vs. "It launches the platform").
  *   **Pass:** "Yes. Without this, the $400k yields zero public value. With this, the value is $X." (The Half-Built Bridge).
  *   **Fail:** "No. We can scale back," or "The value is unclear even if finished."
  *   **Note:** This is where you distinguish sunk cost (irrelevant) from sunk *learning* (relevant). If the $400k taught you the bridge is built on sand, the answer is Fail.

  #### Question 3: The Auctioneer Audit (Dollar Auction Filter)
  **Ask:** "If we write this check, who gets paid? If we walk away, who loses money? Are we the 'second-highest bidder'?"
  *   **The Trap:** Assuming the beneficiary is the only one getting value.
  *   **Pass:** "The beneficiaries get the value. The vendors are paid at market rate. No one benefits from us staying in a failing project."
  *   **Fail:** "A specific vendor/partner needs this revenue to stay afloat," or "Our reputation takes a hit if we stop." (This identifies the Auctioneer).
  *   **The Second-Bidder Check:** "If we stop, do we lose the $400k and get nothing? Or do we stop the bleeding?" If the fear is purely "losing the $400k," you are the second-highest bidder.

  ---

  ### The Decision Matrix

  1.  **Automatic KILL:** If Q1 is **FAIL** AND Q2 is **FAIL**. (Do not pass Go. Do not collect $150k).
  2.  **Automatic FUND:** If Q1 is **PASS**. (The project stands on its own future merit).
  3.  **Committee Vote (Values Handoff):** If Q1 is **FAIL** but Q2 is **PASS**.
      *   *Why:* Economically, you are throwing good money after bad. Ethically/Strategically, you may decide that "finishing what we started" is a institutional value worth the premium. This is not a fact decision; it is a values decision. The Committee must vote explicitly on "Paying the Completion Premium."

  ---

  ### Simulation: Two Real-ish Cases

  #### Case 1: The Digital Records Project
  *   **Context:** $400k spent. Vendor walked. 70% code complete. Need $150k to hire new vendor to finish/integrate.
  *   **Q1 (Cold Start):** **FAIL.**
      *   *Reasoning:* No committee would fund a "70% complete legacy codebase with no vendor support" from a stranger. The risk profile is too high.
      *   *PO Argument:* "But we learned what *not* to do."
  *   **Q2 (Bridge Test):** **FAIL.**
      *   *Reasoning:* The PO claims 70% done. The technical consultant says the architecture is flawed; the 70% is unusable. It is not a half-built bridge; it is a bridge to nowhere. The $150k doesn't finish the asset; it attempts a rescue.
      *   *Value:* Even if finished, the total cost ($550k) exceeds the value of the digital archive to the region.
  *   **Q3 (Auctioneer):** **WARNING.**
      *   *Reasoning:* The PO is heavily invested emotionally. A subcontractor is lobbying hard to be the "rescue vendor."
  *   **Verdict:** **KILL.**
      *   *Why it hurts:* The committee will feel they are wasting $400k. The procedure forces you to admit the $400k is gone regardless of the $150k. The $150k is not an investment; it is a donation to a salvage operation with low probability of success.

  #### Case 2: The Cohort Fellowship
  *   **Context:** $400k spent on 2 cohorts. Low placement rates. Model pivoted for Cohort 3. Need $150k for Cohort 3.
  *   **Q1 (Cold Start):** **PASS (Conditional).**
      *   *Reasoning:* Based on the *new* curriculum and partner agreements, this looks fundable as a fresh start. The past performance is attributed to the old model, which is discarded.
  *   **Q2 (Bridge Test):** **PASS.**
      *   *Reasoning:* The program requires 3 cohorts to validate the model for future scaling. Stopping at 2 renders the evaluation data statistically weak. The $150k buys validity.
  *   **Q3 (Auctioneer):** **CLEAR.**
      *   *Reasoning:* Beneficiaries are the fellows. No vendor is over-leveraged. The "reputation risk" is managed by the pivot narrative.
  *   **Verdict:** **FUND.**
      *   *Condition:* Release is tied to specific mid-cohort metrics. If Cohort 3 mid-points look like Cohort 1, the final tranche is frozen.

  ---

  ### Where This Misfires (Limitations)

  **1. The "Strategic Loss" Blind Spot**
  The procedure assumes the goal is ROI or Impact Efficiency. It cannot account for political reality. Sometimes you *must* fund a failing project to keep a key board member or community partner happy.
  *   *Fix:* If the Committee knows it's a political decision, use the **Committee Vote** track. Admit it is a "Relationship Retention Cost," not a grant.

  **2. The "Innovation Penalty"**
  Q1 (Cold Start) penalizes R&D. If you fund high-risk innovation, by definition, a stranger wouldn't fund it without the proof of concept you already paid for.
  *   *Fix:* For R&D grants, modify Q1 to: "Would we fund *Phase 2* of this from a stranger who showed us *Phase 1 results*?" This isolates the sunk cost from the proof of concept.

  **3. The Program Officer Power Dynamic**
  If the PO is charismatic and the Committee is passive, they will talk their way through the "Fail" criteria.
  *   *Fix:* The Chair must hold the "Stop Rule." If Q1 and Q2 are objectively failed based on the written data, the Chair cuts off debate. No amount of storytelling overrides the matrix.

  **4. The Values Handoff Ambiguity**
  The "Committee Vote" (Q1 Fail / Q2 Pass) is dangerous. It can become a loophole where everything gets funded as a "values decision."
  *   *Fix:* Limit the "Values Handoff" to one grant per year. If you use it twice, the second one triggers an automatic audit of the first.

  ### Summary for the Chair
  Print this on a single sheet. Put it in the center of the table.
  1.  **Cold Start:** Would we start this today?
  2.  **Bridge:** Is it useless without the money?
  3.  **Auction:** Who benefits if we stay?

  If Cold Start is No, and Bridge is No, the money is gone. Do not send good money after bad.
