          *   Conversation-stopping? No, requires verifying knowledge first.

      *   *Reading 2 (Epistemic Closure/Defensible):* 'Know' implies justified belief. Once justification reaches a threshold, further scrutiny isn't obligatory.
          *   'Disregard': Refusing to let it change one's view without new positive reasons.
          *   Status: Substantive/Defensible (pragmatic encroachment/contextualism).
          *   Conversation-stopping? Potentially, but usually allows for *some* engagement.

      *   *Reading 3 (Infallibility/False):* 'Know' implies certainty/psychological conviction.
          *   'Disregard': Not entertaining evidence at all.
          *   Status: Plainly false. Human fallibility means confidence isn't proof.
          *   Conversation-stopping? Yes, this licenses dogmatism.

      *   *Reading 4 (Higher-Order/Problematic):* 'Know' means 'knowing that you know'.
          *   'Disregard': Treating counter-evidence as irrelevant because your status is secure.
