  # Joint Statement of Adversarial Collaboration on Macro-Historical Method

  **Date:** End of Term
  **Parties:** The Macro-Structuralists (Camp One) and The Pluralist-Critics (Camp Two)

  ### Part I: Agreed Claims

  The undersigned parties acknowledge the following propositions as the baseline for further inquiry. These are not compromises, but methodological floor-boards upon which both camps stand.

  1.  **Data Quality and Bias:** Both sides agree that the archaeological and ethnographic record is fragmentary and geographically biased towards regions with long traditions of Western excavation. However, both sides agree the data is not *randomly* noisy; it is sufficiently robust to rule out pure speculation and to identify broad demographic trends (e.g., population growth following the adoption of cereal cultivation).
  2.  **Energy and Density:** Both sides accept that there is a strong empirical correlation between energy capture per capita, population density, and social complexity. The disagreement is not about the existence of the correlation, but whether it is causal, constitutive, or merely coincidental.
  3.  **The Reality of Coercion:** Both sides agree that the emergence of early states involved systematic violence, coercion, and the restriction of individual autonomy. The Macro-Structuralists view this as a tragic but necessary cost of scale and security; the Pluralist-Critics view it as a contingent crime that was neither necessary nor inevitable.
  4.  **Ideological Load:** Both sides acknowledge that their own positions carry political commitments. The Macro-Structuralists admit that deterministic narratives can inadvertently legitimise present-day inequalities as 'natural'. The Pluralist-Critics admit that emphasising human agency can inadvertently romanticise pre-modern life or obscure the material constraints that limit choice.
  5.  **Falsifiability Standard:** Both sides agree that macro-historical claims must be falsifiable in principle. A theory that explains every possible outcome (e.g., 'hierarchy emerges' vs 'hierarchy is resisted') without specifying conditions under which it would *not* occur is rejected by both camps as unscientific.
  6.  **Verbal Disputes:** Both sides acknowledge that a portion of the conflict is terminological. Specifically, arguments over the definition of 'agriculture' (broad spectrum management vs. monoculture) and 'freedom' (negative liberty vs. capacity to act) have obscured material disagreements. These terms will be operationalised in future tests rather than debated semantically.

  ### Part II: Residual Disagreements and Cruxes

  The following table outlines the substantive disagreements that remain. Each position is steel-manned (phrased as its proponents would wish). For each crux, a shared test case or evidence base is identified, along with the specific predictions each camp makes.

  | Crux | Macro-Structuralist Formulation (Camp One) | Pluralist-Critic Formulation (Camp Two) | Shared Test Case / Evidence Base | Predictions (Camp One vs. Camp Two) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Ontology of 'The State'** | 'The State' picks out a natural kind: a threshold system where information processing and coercion become centralised to manage complexity. It is a phase shift, not a gradient. | 'The State' is a retrospective folk category slapped on a loose cluster of features. Hierarchy, monopoly on violence, and bureaucracy often appear independently and do not necessarily co-occur. | **Novel Settlement Coding Protocol:** A blind coding of 500 excavated settlements (4000–1000 BCE) across Eurasia. Variables: Population estimate, presence of central store, variance in house sizes, evidence of defensive walls. | **Camp One:** Scale and hierarchy will co-vary tightly. Above a population threshold (e.g., 5,000), central storage and inequality metrics will spike together.<br>**Camp Two:** Scale and hierarchy will decouple. We will find high-density settlements with low inequality and centralised stores without permanent coercive apparatus. |
  | **2. Convergence vs. Contingency** | The emergence of agriculture and large-scale hierarchy is convergent. Independent origins (Mesopotamia, Mesoamerica, Andes, China) show similar trajectories, implying law-like social dynamics driven by resource pressure. | The macro-story is survivorship bias. We focus on the 'winners' who became states. The archaeological record shows many failed experiments, reversals, and societies that chose *not* to scale up despite having the capacity. | **The Trypillia & Indigenous North America Cases:** Analysis of the Trypillia mega-sites (Ukraine) and pre-contact Indigenous polities (Cahokia, Pacific NW). | **Camp One:** Trypillia sites show proto-state features or were unstable anomalies destined to collapse into hierarchy. Indigenous polities were constrained by geography from true state formation.<br>**Camp Two:** Trypillia proves large-scale living without central authority is possible. Indigenous polities demonstrate conscious rejection of hierarchy (seasonal politics), not geographical constraint. |
  | **3. Geography and Falsifiability** | Geography drives institutions by setting constraints on energy capture and communication. 'Ecological determinism' is a misnomer; it is probabilistic constraint. | Geography is interpreted through culture. Similar environments produce divergent political systems. Claiming 'geography drives institutions' is unfalsifiable because 'geography' is redefined to fit the outcome. | **Island Comparisons:** Comparative analysis of island societies with similar ecological endowments but divergent political histories (e.g., Crete vs. Cyprus; or Polynesian comparisons). | **Camp One:** Political divergence will map onto subtle but critical geographical differences (e.g., harbour quality, arable percentage).<br>**Camp Two:** Politically divergent outcomes will exist despite near-identical geographical constraints, proving culture/agency overrides geography. |
  | **4. Directional Laws vs. Ratchets** | Social complexity follows directional laws akin to thermodynamics. Once information/energy thresholds are crossed, systems cannot revert without catastrophic collapse. | Complexity relies on 'ratchet mechanisms' (technologies hard to un-invent), but these can be voluntarily disengaged. Collapse is often a strategic shedding of burden, not a system failure. | **Post-Bronze Age Collapse Societies:** Examination of societies in the Eastern Mediterranean post-1200 BCE. Did they revert to 'dark ages' or reorganise into different, non-hierarchical structures? | **Camp One:** Post-collapse societies show a loss of capacity and a desperate struggle to re-instate hierarchy (the 'Dark Age' model).<br>**Camp Two:** Post-collapse societies show improved health metrics, greater equality, and deliberate avoidance of previous bureaucratic structures. |
  | **5. Ancient DNA and Population** | Large-scale Bronze Age population replacements (Steppe migrations) correlate with the spread of hierarchical institutions and language families. Demography is destiny. | Migration does not equal political structure. Local populations may adopt the genetics of invaders but reject their political models, or vice versa. DNA tracks bodies, not bureaucracies. | **Steppe Ancestry vs. Administrative Script:** Correlation analysis of Y-chromosome turnover rates against the adoption of administrative technologies (writing, seals, standardised weights) in Europe and South Asia. | **Camp One:** High correlation. Genetic turnover will map tightly onto the introduction of hierarchical administrative tech.<br>**Camp Two:** Low correlation. We will find regions with high genetic turnover but no change in material culture of hierarchy, or administrative adoption without significant genetic turnover. |

  ### Signatories

  **Representative, Camp One (Macro-Structuralists):** ____________________

  **Representative, Camp Two (Pluralist-Critics):** ____________________

  **Date:** ____________________
