  5.  **Final Polish:** Check against the 800-word limit.

      *   *Drafting text:*
      *   *Memento* is less about revenge than the ontology of the moment. Descartes's *cogito* is often taught as "I think, therefore I am," securing a stable self. But critics like Lichtenberg argued it proves only "thinking is occurring." *Memento* dramatizes this harder reading. Leonard Shelby lives in a perpetual *cogito*—each scene is an indubitable present—but he cannot sustain the *sum* across time.
      *   The reverse chronology is the film's philosophical engine. It places the viewer in Leonard's epistemic position: every scene is phenomenologically immediate and certain (like the *cogito*), but the causal connections between them are opaque. We know *that* we are watching, but not *who* is watching across cuts. This illuminates the gap between conscious presence and personal identity. The *cogito* guarantees existence now; it does not guarantee identity later.
      *   Leonard's artifacts—tattoos, Polaroids—are attempts to objectify the "I." They are externalized memory, substituting narrative for neurology. When Leonard tattoos "John G. raped and murdered my wife," he is carving a *cogito* into his skin, trying to make the fleeting "I" permanent. But as the film reveals, these facts are mutable. The Polaroid fades; the tattoo can be misread. This suggests the "I" is not a metaphysical substance discovered by thought, but a construction assembled from evidence. Here, the film aligns with the impersonal critique: there is only the thinking (or the investigating), not a stable thinker.
