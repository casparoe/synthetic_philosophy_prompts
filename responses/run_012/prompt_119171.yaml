      *   *Memory/Identity:* Locke connects identity to memory. If memory fails, does the self persist? Leonard lacks new memory, so his "I" is fragmented.
      *   *Memento's Structure:* Reverse chronology mimics the immediate certainty of the present (each scene is clear) vs. the uncertainty of connection (how we got here). This aligns with the *cogito* (present certainty) vs. personal identity (temporal continuity).

  3.  **Drafting - Section by Section:**

