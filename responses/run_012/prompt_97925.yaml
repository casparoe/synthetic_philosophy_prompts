  You are an expert in formal epistemology, epistemic utility theory, and the accuracy-first program. I would like you to think carefully and, before giving a final answer, brainstorm the possible ways the question below could be read, because I suspect I may be framing it in a way that already assumes something contentious.

  I have been developing a view I call partition-relative accuracy-first epistemology. The core idea is that the epistemic utility of a credence function is always evaluated relative to a partition of propositions that the agent treats as salient; accuracy is not measured over the whole algebra at once. On this view, it turns out that some non-probabilistic credence functions are not accuracy-dominated by any probabilistic alternative. That seems to me to undercut the standard accuracy-dominance argument for probabilism. After all, if accuracy is partition-relative, then the dominance argument must be assuming a particular partition, perhaps the finest partition or the entire algebra, and so it begs the question against a partition-relative accuracy-first epistemologist. So why shouldn't I simply adopt partition-relative accuracy-first epistemology and avoid the demand for probabilistic coherence altogether? More generally, does the accuracy-dominance argument have any force for someone who thinks epistemic utility is always partition-relative, or is it just an artifact of a global, non-partition-relative scoring setup?

  Please do not give me a bibliography or citations; I want the conceptual diagnosis. Begin by laying out what the dominance argument actually requires, then tell me whether partition-relativity is a genuine escape route or a confusion about what is being evaluated.
