      *   *Did Ayer change his view?* Yes, in *The Concept of a Person* (1963), he revised his LTL views significantly. I must stick to LTL (1936/1946) as requested, but maybe add a footnote that he later saw problems here. *Decision:* Stick to LTL to answer the prompt directly, but acknowledge the fragility of the position.
