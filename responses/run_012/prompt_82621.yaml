  4.  **Drafting the Reconstruction (Step-by-Step):**

      *   *Step 1: The Nature of the Self.* Ayer rejects the substantial self. The "I" is a logical construction from sense-contents (experiences). This is parallel to how a "table" is a construction from visual/tactile sense-contents.
      *   *Step 2: The Meaning of Survival.* To say "I survive" is to say "Experiences currently grouped under 'I' will continue to occur after the body ceases." Since propositions about experiences are meaningful, this is meaningful. It is not analytic (true by definition), so it's not self-contradictory to deny it, nor to affirm it.
      *   *Step 3: The Criteria of Identity.* How do we group experiences? By causal laws, memory, and *bodily continuity*. In normal life, the body is the primary index for grouping experiences.
      *   *Step 4: The Problem of Death.* Death removes the primary index (the body).
      *   *Step 5: The Resolution.* Survival is possible *if* there is sufficient psychological continuity (memory, etc.) to justify grouping the post-mortem experiences with the pre-mortem ones, despite the lack of a body.
      *   *Step 6: The Empirical Status.* It is an empirical hypothesis. We have no evidence for it.

  5.  **Addressing the Specific Tension (The "Gap"):**
      *   The user's confusion stems from the shift in criteria. Normally, Body + Memory = Person. After death, Body = 0. So Memory must do *all* the work.
