      *   *Context:* LTL is the manifesto of Logical Positivism. Key tenets: Verification Principle, rejection of metaphysics, phenomenalism (physical objects are logical constructions of sense-contents).
      *   *The Self:* Ayer applies the same logical construction analysis to the self as he does to physical objects. The "self" is not a metaphysical substance (Kant/Hume critique) but a series of experiences.
      *   *Identity:* Personal identity is defined by the continuity of experience (memory, similarity, causal connection).
      *   *Immortality:* Ayer argues that the *statement* "I shall survive death" is meaningful (verifiable in principle) but likely false (no empirical evidence).
      *   *The Specific Tension:* The user hits on a classic problem for bundle theories/phenomenalism: The "Brahmin's Beard" problem or the "Transitivity of Identity" problem. If Person A = Series of Exp A, and Person B = Series of Exp B, what makes Series B a *continuation* of Series A rather than just Series B? Usually, bodily continuity does the heavy lifting in empirical verification. If the body is dead, what verifies the identity?

  3.  **Deconstruct the User's Difficulty:**
      *   The user asks: "What exactly makes a post-mortem experience belong to the same person rather than to a new one?"
      *   On Ayer's view, "belonging to the same person" *means* being part of the same logical construction.
      *   The criteria for grouping experiences into one construction are empirical (memory, bodily continuity).
      *   If the body dies, bodily continuity is broken.
      *   So, survival relies *entirely* on psychological continuity (memory, character).
      *   The user asks: "If there's no link... would [it] count as that person's survival at all?" Ayer would likely say "No."
