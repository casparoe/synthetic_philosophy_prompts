prompt: |-
  Ok, so I'm on the hiring side of a small philosophy of physics group and we've got money for three or four postdocs for three years, and I have to write the agenda doc that says what we're actually going to put them on. The area we've landed on is the old substantivalism vs relationism fight about spacetime -- Newton's bucket, Leibniz's shift, the hole argument, the whole kit. Problem is a lot of what's been written since the 80s feels like the same moves getting reheated, and I don't want to burn three postdoc-years on that.

  So: what are the genuinely open questions in that debate right now, and which would you actually staff? I care way more about the reasoning than the list. For each one I want to know whether it's upstream of other questions (does settling it make the others easier, or just make them dissolve), whether a philosopher can make real progress without doing the physics themselves, and whether there's any chance the answer matters to anyone outside the debate -- a working physicist, someone doing modality, whoever.

  Two things I want you to treat as live options rather than settled background. First, the possibility that the whole thing is a verbal dispute, i.e. that there's no substantive disagreement once you get precise about what each view is a claim about -- is "is this debate substantive at all?" the question that matters most, or is it the kind of meta-question that eats a field alive and pays out nothing? Second, whether the debate should be reoriented away from classical spacetime, where it feels like the cases are exhausted, toward quantum gravity, where the ontology is genuinely up in the air and nobody has a worked out story about what the relata even are -- real frontier, or just a way of avoiding the hard classical arguments?

  Also tell me what you'd deprioritize and why, including stuff that's prestigious but, as far as you can tell, doesn't connect to anything downstream. And flag any question where the honest answer is "this stays unresolved because it's underdetermined by any evidence we could realistically get," because I'd want to know that before spending three years on it. Rank the top few and say what would move something up or down the list over the next couple of years. Please write your answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the Request:**
      *   **Context:** Hiring side of a small philosophy of physics group. Funding for 3-4 postdocs for 3 years.
      *   **Topic:** Substantivalism vs. Relationism (Spacetime ontology).
      *   **Problem:** Feels like reheated arguments since the 80s (Earman, Norton, etc.). Don't want to waste postdoc years on stagnation.
      *   **Requirements:**
          *   Identify genuinely open questions.
          *   Explain reasoning (not just a list).
          *   For each question: Is it upstream? Can a philosopher make progress without doing physics? Does it matter outside the debate (physicists, modality, etc.)?
          *   Treat two specific options as live: (1) Is it a verbal dispute? (2) Shift to Quantum Gravity (QG)?
          *   Deprioritize prestigious but disconnected topics.
          *   Flag underdetermined questions (unresolvable by evidence).
          *   Rank top few.
          *   Explain what would move items up/down the list.
          *   **Language:** American English.

  2.  **Initial Assessment of the Field:**
      *   The "Classical" Debate (Newton/Leibniz/Earman-Norton Hole Argument) is indeed mature, perhaps over-mature. The "sophisticated substantivalism" vs. "structural relationism" moves are well-trodden.
      *   *Verbal Dispute Thesis:* This is a meta-ontological worry. If true, it kills the project. If false, it needs a robust argument, not just hand-waving.
      *   *Quantum Gravity Shift:* This is where the action is. Spacetime emergence, non-spatiotemporal fundamentals. But it risks becoming "philosophy of string theory/loop quantum gravity" without enough grip on the physics.
      *   *Relevance:* Why should a physicist care? Usually, they don't, unless it touches on interpretation of the formalism (e.g., gauge freedom, observables) or methodology.

  3.  **Evaluating the "Live Options":**

      *   *Option 1: The Verbal Dispute.*
          *   *Pros:* If the debate is merely verbal, stopping it saves resources. It forces conceptual clarity.
          *   *Cons:* Meta-ontology can become navel-gazing. Hard to prove "substantive" without begging the question.
          *   *Verdict:* High risk, high reward. Needs a postdoc with strong metaphysics chops, not just physics knowledge.
          *   *Upstream?* Yes. If it's verbal, nothing else matters.
          *   *Philosopher progress?* Yes, this is conceptual analysis.
          *   *External impact?* Metaphysicians, linguists, maybe physicists tired of ontological baggage.

      *   *Option 2: The QG Shift.*
          *   *Pros:* Ontology is actually unsettled. Spacetime might not be fundamental.
          *   *Cons:* Physics is speculative. Hard for philosophers to contribute without becoming pseudo-physicists.
          *   *Verdict:* Essential for the field's survival, but needs careful scoping.
          *   *Upstream?* Yes, if spacetime isn't fundamental, the classical debate is derivative.
          *   *Philosopher progress?* Yes, interpreting formalism, coherence of "emergence."
          *   *External impact?* High for QG researchers struggling with interpretation.

  4.  **Identifying Specific Research Lines (The "Meat"):**

      *   *Idea 1: The Hole Argument in Gauge Theories.*
          *   Standard Hole Argument is GR. What about Yang-Mills? Is gauge freedom ontological?
          *   *Relevance:* Physicists care about gauge.
          *   *Risk:* Technical.

      *   *Idea 2: Spacetime Emergence & Functionalism.*
          *   If QG isn't spatiotemporal, how does GR emerge? Functional role vs. intrinsic nature.
          *   *Relevance:* Connects to philosophy of mind (functionalism) and science (inter-theoretic reduction).
          *   *Risk:* "Function" is vague.

      *   *Idea 3: The Role of Symmetry in Ontology.*
          *   Symmetry breaking, dualities. If two theories are dual, do they have the same ontology?
          *   *Relevance:* String theory dualities.
          *   *Risk:* Highly technical.

      *   *Idea 4: The "So What?" Question (Pragmatics).*
          *   Does the ontology constrain theory building?
          *   *Relevance:* Methodology of physics.

  5.  **Selecting and Ranking for the Agenda:**

      *   *Priority 1: Spacetime Emergence in QG (The "Frontier" Bet).*
          *   Why: Classical debate is stuck. QG forces new ontology.
          *   Upstream: Yes, determines if classical substantivalism is even coherent.
          *   Philosopher Role: Conceptual analysis of "emergence," "fundamentality."
          *   External: QG physicists need conceptual clarity on "spacetime is doomed."
      *   *Priority 2: The Verbal Dispute / Metasemantics (The "Audit" Bet).*
          *   Why: Need to ensure we aren't chasing shadows.
          *   Upstream: Ultimate upstream.
          *   Philosopher Role: Pure philosophy.
          *   External: Metaphysicians.
      *   *Priority 3: Symmetry, Dualities, and Ontological Equivalence (The "Bridge" Bet).*
          *   Why: Connects classical gauge issues to QG.
          *   Upstream: Helps define what counts as a "distinct" ontology.
          *   Philosopher Role: Interpreting mathematical equivalence.
          *   External: Theoretical physicists working on dualities.

  6.  **Deprioritizing:**
      *   *Pure Hole Argument variations in GR:* Done to death.
      *   *Neo-Newtonian Spacetime:* Historical interest only.
      *   *Modal Relationism (Leibnizian possibilities):* Too disconnected from modern physics.

  7.  **Flagging Underdetermination:**
      *   The "True Ontology of GR" is likely underdetermined. GR is effective theory. Spending 3 years proving GR is substantival is wasteful if GR is approximate.
      *   The "Realism about QG structures": QG isn't empirically confirmed. Ontology based on it is speculative.

  8.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Professional, strategic, candid (American English).
      *   *Structure:* Intro -> The Two Live Options (Analysis) -> Top Ranked Projects -> Deprioritized -> Underdetermination Flags -> Dynamic Factors.
      *   *Check:* Did I answer "Upstream?", "Philosopher Progress?", "External Impact?" for each? Yes.
      *   *Check:* Did I address the verbal dispute and QG shift specifically? Yes.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm dismissing the classical debate entirely, but rather framing it as effective.
      *   *Correction:* Ensure the "Verbal Dispute" option isn't just a trap. Frame it as "Conceptual Clarification" to make it productive.
      *   *Correction:* Be honest about the physicist's perspective. Most don't care. The ones who do care are working on QG foundations.
      *   *Refinement on "Upstream":* Be precise. If QG shows spacetime is emergent, classical substantivalism is a question about the *emergent* level, not the fundamental one. That changes the debate.

  10. **Final Polish:** Check American spelling (prioritize, program, etc.) and tone. Ensure the "Reasoning" is prominent as requested. (The prompt emphasizes "I care way more about the reasoning than the list".)

  *(Self-Correction on "American English"):* Ensure spelling conventions (e.g., "prioritize" not "prioritise", "program" not "programme").

  *(Final Review against constraints):*
  - 3-4 postdocs context? Yes, keep scope manageable.
  - Upstream/Philosopher/External criteria? Yes.
  - Live options (Verbal/QG)? Yes.
  - Deprioritize? Yes.
  - Underdetermination flags? Yes.
  - Ranking? Yes.
  - Dynamic factors? Yes.

