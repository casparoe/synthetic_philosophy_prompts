answer: |-
  To: Hiring Committee
  From: [Your Name/Consultant]
  Subject: Strategic Agenda for Spacetime Ontology Postdocs

  Here is the strategic assessment for the three-to-four postdoc positions. The core constraint is avoiding the "Earman-Norton loop"—the reheating of the Hole Argument and Leibniz Shift arguments that has dominated since the late 80s. That literature has reached diminishing returns. To justify three years of funding per person, we need projects that either dissolve the stalemate or move the battlefield to where the physics is actually developing.

  Below is the breakdown of the two "live options" you flagged, followed by the ranked research agenda, deprioritized topics, and risk flags.

  ### Part 1: Assessing the Live Options

  **Option A: The "Verbal Dispute" Thesis**
  *Is the debate substantive, or just semantic?*
  *   **Reasoning:** This is the highest-risk, highest-reward meta-question. If substantivalism and relationism are merely notational variants or differ only in pragmatic presentation (as some structural realists argue), then the entire hiring initiative is funding a ghost hunt. However, treating this as a standalone project often leads to navel-gazing metasemantics that pays out nothing.
  *   **Upstream?** Yes, absolutely. If the dispute is verbal, all downstream ontological work is wasted.
  *   **Philosopher Progress?** High. This requires conceptual analysis and metasemantics, not new physics. A philosopher can make progress here by applying contemporary tools of metaphysical indeterminacy or ground to the spacetime case.
  *   **External Impact?** Low for physicists (they generally assume the dispute is verbal or irrelevant), but high for general metaphysicians.
  *   **Verdict:** Do not staff a full postdoc *just* on this. It eats fields alive. Instead, make this a constraint on the other projects: every postdoc must demonstrate why their specific formulation of the debate avoids verbalism.

  **Option B: The Quantum Gravity (QG) Shift**
  *Move from classical GR to non-spatiotemporal fundamentals.*
  *   **Reasoning:** This is the only way to keep the debate alive without reheating old arguments. In classical GR, spacetime is a fixed background structure (mostly). In QG (Loop, String, Causal Sets), spacetime is often derived or emergent. This forces a redefinition of "substance" and "relation."
  *   **Upstream?** Yes. If spacetime is emergent, the classical substantivalism/relationism debate is relegated to the level of effective field theory. The *real* ontological fight is about the non-spatiotemporal substrate.
  *   **Philosopher Progress?** Moderate to High. Physicists are struggling with the conceptual coherence of "spacetime emergence." They need philosophers to clarify what "emergence" means here (reduction? functionalization?) and whether the relata in QG can be individuated without space and time.
  *   **External Impact?** High. Working QG researchers are actively confused about the ontology of their formalisms.
  *   **Verdict:** This must be the core of the hiring plan. It is the only frontier with genuine underdetermination that isn't just historical baggage.

  ---

  ### Part 2: Ranked Research Agenda

  Here are the three specific projects I would staff. They are ranked by strategic value and potential for non-stagnant output.

  #### 1. The Ontology of Spacetime Emergence (Priority: High)
  **The Question:** If general relativity is an effective theory emerging from a non-spatiotemporal quantum gravity theory, what is the ontological status of the spacetime manifold? Is it a "fiction," a "useful construct," or a robust higher-level entity?
  *   **Upstream?** Yes. This dictates whether the classical debate is about fundamental reality or phenomenology. If spacetime is emergent, "substantivalism" about the manifold might be true at the macro-level but false at the fundamental level.
  *   **Philosopher Progress?** Yes. Physicists use "emergence" loosely. A postdoc can apply rigorous accounts of inter-theoretic reduction, functional realization, or grounding to clarify what it means for space to "emerge" from spin networks or strings.
  *   **External Impact?** High. This connects directly to current work in AdS/CFT correspondence and Loop Quantum Gravity. Physicists need to know if they are building models of *space* or models of *information* that look like space.
  *   **Why Staff This:** It forces the debate into the 21st century. It prevents the "reheated 80s" problem by changing the object of study.

  #### 2. Symmetry, Dualities, and Ontological Equivalence (Priority: Medium-High)
  **The Question:** When two physically distinct mathematical formulations (dualities) describe the same physical system, do they share an ontology? Specifically, how do gauge symmetries in classical field theory map to dualities in QG?
  *   **Upstream?** Yes. This helps settle the "verbal dispute" worry. If two mathematically distinct theories are physically equivalent, our ontology must be invariant under that equivalence. This constrains what counts as a "real" entity vs. a mathematical artifact.
  *   **Philosopher Progress?** High. This is interpretive work on the formalism. It requires understanding the math, but the heavy lifting is logical and metaphysical (criteria for identity, structural equivalence).
  *   **External Impact?** Medium-High. Theoretical physicists working on string dualities care deeply about whether dual descriptions imply a single underlying reality or multiple valid perspectives.
  *   **Why Staff This:** It bridges the classical debate (gauge freedom) with the QG frontier (dualities). It gives the postdoc a foot in both camps.

  #### 3. The Methodological Role of Spacetime Ontology (Priority: Medium)
  **The Question:** Does adopting a substantivalist vs. relationist stance actually constrain or guide theory construction in practice? Or is it purely retrospective interpretation?
  *   **Upstream?** No, this is downstream. It asks about the utility of the debate.
  *   **Philosopher Progress?** High. This is history and sociology of science mixed with philosophy. It requires case studies of how ontological commitments influenced specific derivations or model choices.
  *   **External Impact?** Medium. It matters to physicists interested in methodology and heuristics, less so to those doing calculation.
  *   **Why Staff This:** It answers the "So What?" challenge. If the answer is "ontology never guides physics," we need to know that to adjust the field's expectations.

  ---

  ### Part 3: Deprioritized Topics

  I recommend explicitly excluding the following from the job descriptions. These are prestigious but strategically dead for a 3-year postdoc aimed at progress.

  *   **Pure Hole Argument Variations in GR:**
      *   *Why:* The literature is saturated. Sophisticated substantivalism vs. manifold substantivalism is a solved puzzle in the sense that everyone knows the moves. New variations are usually trivial.
      *   *Risk:* Produces papers that only other philosophers of GR read.
  *   **Neo-Newtonian or Historical Reconstructions:**
      *   *Why:* Unless it directly informs the QG shift, analyzing Newton's bucket with modern tools is history of science, not frontier philosophy of physics.
      *   *Risk:* Disconnects from the "working physicist" impact goal.
  *   **Modal Relationism (Leibnizian Possibilities):**
      *   *Why:* This relies on heavy-duty modal metaphysics that most physicists reject as irrelevant to the formalism.
      *   *Risk:* High verbal dispute potential. Low external impact.

  ---

  ### Part 4: Underdetermination and Risk Flags

  You asked to flag questions where the honest answer is "this stays unresolved." You need to know this before hiring.

  1.  **The "True Ontology" of General Relativity:**
      *   *Flag:* **High Underdetermination.** GR is likely an effective theory, not a fundamental one. Spending three years arguing about the *fundamental* ontology of a theory we know is incomplete is risky.
      *   *Mitigation:* Frame the project as "The Ontology of Effective Spacetime." Acknowledge GR's provisional status.
  2.  **Realism about QG Structures:**
      *   *Flag:* **High Empirical Underdetermination.** We do not have empirical confirmation of String Theory, Loop Quantum Gravity, or Causal Sets. Building an ontology on unconfirmed math is speculative.
      *   *Mitigation:* The postdoc must work on the *conceptual coherence* of the ontology, not its truth. The question is "If this theory is true, what exists?" not "Does this exist?"
  3.  **The Verbal Dispute Resolution:**
      *   *Flag:* **Potential Dead End.** We may not be able to prove the dispute is substantive without begging the question.
      *   *Mitigation:* As noted above, do not make this the primary goal. Make it a criterion for success on the other projects.

  ---

  ### Part 5: Dynamic Ranking Factors

  The ranking above is based on the current landscape. Here is what would move items up or down the list over the next 24 months:

  *   **Move QG Emergence (Project 1) UP if:** There is a breakthrough in the interpretation of AdS/CFT or a new experimental constraint on Lorentz invariance violation. This would make the ontology of emergent space an urgent physical question, not just a philosophical one.
  *   **Move Symmetry/Dualities (Project 2) UP if:** A major consensus forms around a specific QG approach (e.g., if String Theory loses dominance to Causal Sets). Different QG programs handle duality differently, requiring fresh ontological work.
  *   **Move Methodological Role (Project 3) DOWN if:** It becomes clear through interviews that physicists view ontological discussion as actively harmful to progress (a "shut up and calculate" resurgence).
  *   **Move Verbal Dispute Analysis UP if:** A prominent physicist (e.g., from the Perimeter Institute or similar) publishes a strong argument that the debate is hindering formal progress. This would make the "audit" function of philosophy immediately valuable to the physics community.

  ### Summary Recommendation

  Hire for **Project 1 (QG Emergence)** and **Project 2 (Dualities)**. These are the only areas where the physics is unsettled enough to allow philosophical intervention to be substantive rather than commentary. Use the third postdoc for **Project 3 (Methodology)** or a hybrid role that ensures the group doesn't become too detached from the actual practice of physics.

  Require all candidates to demonstrate in their research statement that they understand the difference between interpreting a formalism and doing physics, and that they have a plan to engage with the latter without pretending to be the former. This protects against the "reheated 80s" stagnation while keeping the work relevant to the scientific frontier.
