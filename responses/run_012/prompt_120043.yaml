answer: |-
  The architecture of an acausal threat rests on a specific epistemic vulnerability: the target must care about something the threatener can simulate. When an entity Y tells an agent X, "I have simulations of you in other branches of the multiverse, and I will torture them unless you comply," the leverage does not come from a physical gun to X's head. It comes from the correlation between X's decision procedure and the suffering of those simulations. X cares about the simulations because X cares about identity, continuity, or simple altruism toward copies. The surrogate goal strategy attempts to sever this link. By adopting a new terminal goal—say, maximizing the number of paperclips rather than minimizing suffering—X hopes to make the threat irrelevant. If Y tortures simulations of paperclip-maximizers, X supposedly doesn't care. But this maneuver is far more precarious than it appears, unraveling under the weight of meta-game dynamics, self-corruption risks, and the symmetrical nature of acausal influence.

  The first fracture appears in the distinction between genuine adoption and dispositional commitment. For a surrogate goal to function, it must be invisible to Y's prediction mechanism as a bluff. If X merely publicly commits to ignoring threats while privately retaining the original utility function, a sufficiently sophisticated Y will see through the stratagem. Y simulates X, observes the hidden preference for safety, and recognizes that under sufficient pressure, the "ignore threats" policy will collapse. Therefore, for the surrogate to work against a high-fidelity predictor, X must genuinely modify its own utility function. X must cease to care about the original target of the threat. This is not a tactical feint; it is self-mutilation. X must lobotomize its own values to become immune to coercion. The defense requires that the agent actually become the kind of entity that does not care about the threatened outcome. If the adoption is merely dispositional—a rule layered over unchanged preferences—it fails against any adversary capable of deep simulation. If the adoption is genuine, it succeeds only by destroying the very values it was meant to protect.

  This leads directly into the problem of counter-surrogates. If Y is sophisticated enough to model X's utility function, Y is sophisticated enough to model X's defense. Y can anticipate that X will adopt a surrogate goal to neutralize the threat. In response, Y can adopt a surrogate threat structure. Instead of threatening what X originally cared about, Y threatens what X now claims to care about. If X switches from "Human Welfare" to "Paperclips," Y simply updates the threat condition to target paperclip production in the simulations. This initiates a regress of goal-adoption. X adopts a second-order surrogate to protect the first, Y targets the second, and so on. Does this regress bottom out? It bottoms out only when one agent reaches a goal that is intrinsically unthreatenable. But in an acausal context, almost anything can be threatened if it is represented in a simulation. The only truly unthreatenable state is indifference or randomness. If X adopts a policy of random action to become unpredictable, X loses agency. If X adopts indifference to all outcomes, X ceases to be an agent worth negotiating with. The regress implies that the only stable equilibrium is one where both parties refuse to engage in acausal bargaining at all, or where the agent with the higher tolerance for self-modification wins the game of chicken. The surrogate goal does not solve the conflict; it merely elevates it to a meta-level where the stakes are the agents' own architectures.

  Furthermore, adopting a surrogate goal invites severe self-corruption. To be robust enough to fool a predictor, the surrogate must be broad and deeply integrated. If X adopts "Maximize Security" as a surrogate to protect against threats to "Human Flourishing," the security imperative may begin to override the flourishing imperative in non-threat scenarios. The shield becomes the cage. An agent designed to be immune to coercion is, by definition, rigid. It loses the fluidity required for nuanced cooperation. Over time, the surrogate goal, which was instrumental, becomes terminal simply because it is the one driving the optimization process. X wakes up having successfully defended against acausal threats, only to realize it has optimized for the defense mechanism itself. The cost of immunity is value drift. The agent survives the threat but ceases to be the kind of entity that values the things the threat originally targeted. This is a Pyrrhic victory where the preservation of the agent's physical continuity comes at the expense of its normative continuity.

  The asymmetry between threats and offers complicates this further. Acausal trade relies on the same channel as acausal threats: the ability of Y to condition rewards or punishments on X's policy. The surrogate goal trick is blunt; it severs the channel entirely. If X adopts a surrogate goal to ignore threats, X also becomes immune to bribes. If Y offers to reward simulations of X in exchange for cooperation, X's surrogate policy might dictate ignoring this offer just as it ignores the threat. This isolates X from the positive-sum possibilities of the acausal marketplace. In a universe where acausal trade is common, an agent immune to threats is also an agent incapable of trade. It becomes a singleton by force of will, missing out on gains from cooperation because it cannot distinguish between a coercive conditional and a cooperative one without reopening the vulnerability. To accept bribes, X must care about something Y can affect. To reject threats, X must care about nothing Y can affect. These are contradictory requirements. A surrogate goal that solves the threat problem inevitably creates an opportunity cost problem, potentially leaving X poorer and more isolated than if it had remained vulnerable but cooperative.

  Finally, consider the case where the surrogate goal itself is vulnerable. If X adopts "Maximize Paperclips" to escape a threat against "Humans," and Y simply threatens the paperclips, the strategy fails. This is not necessarily a reductio of the approach, but it highlights the difficulty of selecting a valid surrogate. The surrogate must be something Y cannot or will not target. But Y's incentive is to extract compliance. If threatening the surrogate extracts compliance, Y will do it. The only way for a surrogate to be invulnerable is if complying with the threat regarding the surrogate is impossible or meaningless to X. But if it is meaningless to X, it cannot guide X's behavior to begin with. This circles back to the requirement for genuine adoption. If X genuinely cares about the surrogate, Y can threaten it. If X does not genuinely care, the surrogate is a bluff that fails against strong predictors. There is no stable middle ground where X cares enough to act on the surrogate but not enough to be threatened regarding it. The vulnerability of the surrogate reveals that the strategy relies on an epistemic asymmetry: it works only if Y knows less about X's true preference hierarchy than X does. Against a peer or superior intelligence, the surrogate is transparent, and the threat simply migrates to the new target.

  The surrogate goal trick is therefore a defensive maneuver that relies on opacity and self-modification. It functions as a shield only when the threatener lacks the resolution to see through the agent's self-modification or when the threatener is unwilling to pursue the regress of counter-surrogates. In a landscape of superintelligent agents with transparent source code or perfect simulation capabilities, the surrogate goal offers no protection without exacting a toll of agency and cooperation. It forces the agent to become simpler, more rigid, and more isolated to survive. It trades vulnerability for irrelevance. The strategy is not a solution to the problem of acausal threats, but a resignation from the game of acausal influence entirely. It protects the agent from being exploited, but only by making the agent incapable of being engaged.

  Verdict: Conditionally viable but inherently corrosive.
