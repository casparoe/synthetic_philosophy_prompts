      *   *Mathematical Intuition:* If $N$ is population, welfare scales $\approx N$. Resonance scales $\approx N^2$ (or some superlinear function).
      *   *The Risk:* Just as Total Utilitarianism leads to the Repugnant Conclusion (Zillions of barely worth living lives > Few excellent lives), Resonance Axiology might lead to a "Combinatorial Repugnance" (Zillions of isolated/miserable people > Few connected/excellent lives) because the sheer number of *possible* relations outweighs the low welfare.
