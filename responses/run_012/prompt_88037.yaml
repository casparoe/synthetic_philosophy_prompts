answer: |-
  **Project Title:** Combinatorial Value and the Resonance Repugnance: A Cognitive Axiology of Population Ethics

  **Project Summary**
  Contemporary population ethics is currently stalled in a defensive crouch. The standard axiological frameworks—total, average, and critical-level utilitarianism—each succumb to counterintuitive implications, most notably the Repugnant Conclusion. This project proposes a departure from the standard assumption that population value is a function solely of individual welfare aggregates. Drawing on insights from cognitive science regarding the centrality of analogy-making and joint attention, I propose a new category of value: "resonance goods." These are relational goods emerging from the interaction of minds (e.g., being understood, conceptual slippage, shared focus) that are not reducible to the welfare of the participants. Because the potential for resonance scales superlinearly with population size, incorporating it into population axiology fundamentally alters the aggregation function. The primary goal of this one-year fellowship is to construct a formal model of resonance axiology and test it against the standard impossibility theorems. Specifically, I aim to determine whether this approach solves the Repugnant Conclusion or merely generates a structural analogue: a "Combinatorial Repugnance" where vast populations are preferred for their relational density despite low individual welfare. The deliverable will be a 30–40 page paper suitable for submission to a top-tier general philosophy journal.

  **Research Question**
  The project addresses a single, determinate question: *Does an axiology that treats inter-subjective resonance goods as a distinct, non-instrumental value category avoid the Repugnant Conclusion, or does it generate a distinct repugnant implication based on combinatorial richness?*

  This question is determinate because it requires a binary outcome regarding the viability of the resonance framework. Either the inclusion of resonance goods shifts the ranking of populations in a way that aligns with considered judgments (avoiding repugnance), or it replicates the structural flaw of total utilitarianism via a different mechanism (combinatorial repugnance). A third outcome—demonstrating that resonance goods are reducible to welfare or merely instrumental—constitutes a definitive negative result that clarifies the boundaries of population value.

  **Background and Motivation**
  The impasse in population ethics arises because standard views treat the value of a world as a sum (or average) of values contained within individuals. The "location" of value is internal to the life being lived. Consequently, aggregation rules struggle to balance quantity against quality. Total views sacrifice quality for quantity; average views sacrifice quantity for quality; critical-level views attempt a compromise but introduce arbitrariness regarding the threshold.

  These frameworks leave a specific category of value unaccounted for: the value generated *between* minds. My background in cognitive science suggests that analogy-making and conceptual alignment are not peripheral mental activities but core constitutive elements of human cognition. When one mind sparks a new conceptual framework in another, or when two minds achieve joint attention on a complex object, a good is realized that is not fully captured by the welfare state of either individual. This is not merely "happiness caused by interaction." It is a good inherent to the relational structure itself.

  Existing positions leave this open because they typically treat social goods as instrumental to welfare. If interaction makes people happier, it counts under total utilitarianism. But if resonance is a distinct good, the aggregation function changes. If welfare scales linearly with population ($N$) but resonance scales superlinearly (approximating $N^2$ or a similar combinatorial function), the axiological calculus shifts dramatically. Current literature has not formally tested whether this shift breaks the deadlock of population ethics or exacerbates it.

  **Methodology**
  The project will proceed in three phases, utilizing standard methods in normative ethics and formal axiology.

  *Phase 1: Formalization of Resonance Axiology*
  I will construct a value function $V(P)$ for a population $P$, where $V$ includes two distinct variables: aggregate welfare ($W$) and aggregate resonance ($R$). $W$ will be modeled on standard welfare metrics. $R$ will be modeled as a function of possible dyadic or polyadic relations within $P$. Crucially, I will define $R$ such that it does not supervene on $W$. This requires stipulating cases where resonance is high but welfare is low (e.g., a community of suffering scholars achieving profound mutual understanding) and vice versa. The formalization must specify the trade-off rate between $W$ and $R$ to allow for comparability.

  *Phase 2: Case Testing and Divergence*
  I will test the formal model against two sets of cases.
  1.  **Standard Cases:** The familiar comparisons from the literature (e.g., A+ vs. B, or the comparison between a small elite population and a vast mediocre one). The goal is to see if the resonance variable naturally penalizes the vast mediocre population (perhaps due to dilution of connection) or favors it (due to combinatorial explosion).
  2.  **Engineered Divergence Cases:** I will construct thought experiments where welfare and resonance are deliberately decoupled. For example, a "Tower of Babel" scenario (high population, high welfare, zero shared understanding) versus a "Martyr" scenario (low population, low welfare, perfect mutual resonance). These cases will determine if the theory yields intuitive verdicts when the two value categories conflict.

  *Phase 3: Stress Testing for Repugnance*
  The core of the paper will be a proof or argument regarding the "Combinatorial Repugnance." If resonance scales superlinearly, does there exist a population size $N$ such that a world with minimal positive welfare but maximal resonance is ranked higher than a world with excellent welfare and moderate population? I will analyze whether the superlinear growth of relations inevitably swamps the linear growth of welfare, thereby replicating the structural problem of total utilitarianism. I will also check whether the view survives standard objections regarding transitivity and separability that sank previous alternatives.

  **Success and Failure Conditions**
  It is vital to define what constitutes a successful outcome for this fellowship, as a negative result is philosophically valuable.

  *Success:* The project succeeds if it produces a coherent formal model that demonstrates resonance goods are neither reducible to welfare nor merely instrumental, and definitively shows how their inclusion alters population rankings. A successful paper might show that resonance goods provide a "brake" on the Repugnant Conclusion (e.g., because resonance requires cognitive bandwidth that dilutes as population grows) or that it accepts a modified Repugnant Conclusion but argues it is less counterintuitive than the standard version.

  *Failure:* The project fails if the analysis demonstrates that "resonance goods" are merely a notational variant of welfare (i.e., being understood is just a constituent of well-being) or if they are shown to be purely instrumental (i.e., they only matter insofar as they produce future welfare). Additionally, if the formalization requires arbitrary parameters to avoid the Combinatorial Repugnance that are no more justified than the critical levels in existing theories, this will be counted as a failure of the specific hypothesis, though still a valuable contribution to the literature.

  **Scope and Feasibility**
  A one-year fellowship is sufficient for this project, provided the scope remains tightly focused on the specific question of the Repugnant Conclusion analogue. A full dissertation would require a comprehensive theory of resonance value covering distributive justice, non-identity problems, and risk. This project eschews those broader questions to focus exclusively on the aggregation problem in population ethics.

  A 30–40 page paper is the standard length for a rigorous treatment of a single impossibility theorem or axiological proposal. The workload involves:
  1.  Three months for literature review and formal modeling.
  2.  Four months for drafting the argument and constructing the divergence cases.
  3.  Three months for revision, peer feedback, and stress-testing the "Combinatorial Repugnance" argument.
  4.  Two months for final polishing and journal selection.

  This timeline is realistic for a third-year PhD student, assuming the fellowship provides a teaching buyout. The risk lies in the formalization; if the function for resonance proves intractable, the scope may need to narrow to a conceptual argument rather than a formal proof. However, given the preliminary plausibility of the superlinear claim, a conceptual proof of the "Combinatorial Repugnance" risk is achievable even without a fully specified mathematical model.

  **Significance**
  This project matters because population ethics currently lacks a generative research program; it is largely a process of refuting existing views. By importing a specific claim from cognitive science—that the mind is fundamentally analogical and relational—this project offers a new currency of value. Even if the result is that resonance goods generate their own repugnant conclusion, this is a significant finding. It would suggest that the Repugnant Conclusion is not an artifact of how we measure welfare, but a structural feature of any axiology that values aggregation over fixed populations. Conversely, if resonance goods provide a natural dampening mechanism (e.g., if true resonance requires scarcity), this could offer a principled way to rank populations without falling into the standard traps. Either way, the project moves the debate from tweaking aggregation rules to examining the ontology of the goods being aggregated.
