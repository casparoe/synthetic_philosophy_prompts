      *   *Friendship/Affection:* Similar to beauty. The object of affection must exist, and the subject must have the appropriate emotion.
      *   *Principle of Organic Unities:* The value of a whole is *not* necessarily equal to the sum of the values of its parts. (Crucial nuance: It doesn't mean the whole is *always greater*, just that it's not strictly additive. A part might have no value alone but contribute value to the whole, or have positive value alone but contribute negative value to the whole).
      *   *The "Greatest Goods":* Moore identifies two main categories of intrinsic goods: (1) The enjoyment of beautiful objects, (2) The pleasures of human intercourse (friendship/love). Crucially, these are *complex wholes*.
      *   *Virtue/Right Action:* Moore distinguishes between *good* (intrinsic value) and *right* (maximising good). Virtue is usually a means to good, or part of a whole, but beauty/friendship aren't valuable *because* they are virtues. They are valuable intrinsically.

  3.  **Drafting the Model Answer (What a fully correct answer needs):**
