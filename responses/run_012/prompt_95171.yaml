      *   **Organic Unities:** Must define it correctly: Value of whole $\neq$ sum of parts. It is *not* simply "greater than." It allows for emergent value.
      *   **Application:**
          *   *Beauty:* The whole is (Beautiful Object + Consciousness of it). The object alone has some value (proven by isolation), but the whole has vastly more.
          *   *Friendship:* Similar structure. Affection + Existence of beloved.
      *   **Avoid Errors:** Do not conflate 'good' with 'virtue' or 'right action'. Do not claim organic unities *always* increase value (just that they break additivity). Do not claim isolation determines *duty* directly (it determines value).

  4.  **Assessing the Student Script:**
      *   *Paragraph 1:* "Pluralistic consequentialism" (Okay, broadly ideal utilitarianism). "Greatest goods... pleasures of human intercourse and enjoyment of beautiful objects." (Accurate quote/reference). "Intuition." (Accurate).
      *   *Paragraph 2 (Isolation):* "Imagine a world containing only the thing... stripped of causes/consequences." (Good definition). "Beautiful world with no one to appreciate it is better than an ugly world." (Accurate to Moore's thought experiment). "Proves beauty is good in itself, not merely because it gives pleasure." (Accurate). *Missing nuance:* Doesn't explicitly mention that the *consciousness* of it is the *greater* good, but implies it in the next paragraph.
