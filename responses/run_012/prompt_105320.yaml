answer: |-
  1.  **Verdict on the Bank Run:** Your instinct is correct. The bank run risks rigging the game toward holism because the individual's *belief* (the micro-foundation) is itself constituted by the social situation (the run). It blurs the line you need to draw. Use **Inflation** instead.
      *   **It must have:** An emergent outcome that constrains individual action (you cannot spend your way out of inflation alone) and is measurable without referencing specific psyches.
      *   **It must lack:** A conscious collective agent. No "The Economy" decides to inflate; it happens without a central will, avoiding "group soul" accusations.

  2.  **Teaching Sequence (75 Minutes):**
      *   **Move 1: Anchor the Case (5 mins talk, 10 mins board work).** Write "Inflation" on the board. Ask the quant half: "List the individual actions that constitute inflation." Ask the qual half: "List the structural conditions that make inflation possible." Do not evaluate yet. This establishes the *data* both sides see.
      *   **Move 2: The Individualist Pass (5 mins talk, 10 mins discussion).** Define methodological individualism: *Explanation is complete only when reduced to individual actions/dispositions.* **Head off Misconception #1 ("Individualism = Selfishness") here.** Explicitly state: "Individualism allows for altruism, norms, or madness. It only demands that these reside in the *individual*, not the group." Ask the room: "Can we explain inflation solely by summing individual spending choices?"
      *   **Move 3: The Holist Pass (5 mins talk, 10 mins discussion).** Define holism: *Some social facts explain other social facts; reduction loses causal power.* **Head off Misconception #2 ("Holism = Group Minds") here.** Explicitly state: "Holism does not require a collective consciousness. It requires *emergent properties* (like price levels) that exert downward causation on individuals." Ask: "Does the 'price level' exist before I enter the market? Does it constrain me?"
      *   **Move 4: The Political Trap (5 mins talk, 10 mins discussion).** Acknowledge the suspicion that individualism is neoliberal and holism is statist. **Head off Misconception #3 ("Politics vs. Method") here.** Draw a line: "Methodology is about *leverage*, not ideology. You can be a socialist methodological individualist (change structures by changing individuals) or a conservative holist (preserve institutions regardless of individual cost)." Ask the ethnographers: "Does adopting individualism force you to ignore power?" Ask the demographers: "Does adopting holism force you to ignore agency?"
      *   **Move 5: The Diagnostic (5 mins discussion).** Pose the final question (see below).

  3.  **The Final Question:**
      *   "Take the holist explanation you just gave for inflation (e.g., 'monetary policy structures'). Rewrite it as a strict methodological individualist explanation without losing the causal mechanism. Where does the translation break?"
      *   *Why:* This forces them to operationalize the distinction. If they can translate it, the dispute is merely verbal. If they can't, they've identified the irreducible social fact.

  4.  **What to Leave Out:**
      *   **Ontological Realism.** Announce this explicitly: "We are not debating whether society *exists* independently of individuals (ontology). We are debating how to *explain* phenomena (methodology). Whether social facts are 'real things' is a metaphysical luxury we cannot afford today." This prevents the conversation from devolving into realism vs. nominalism, which stalls progress.

  5.  **Dependencies:**
      *   Move 1 must precede Move 2 so definitions are grounded in data, not abstraction.
      *   Move 2 must precede Move 3 so holism is introduced as a *solution* to individualism's limits, not a rival mysticism.
      *   Move 4 must follow both so the political critique is seen as applicable to *both* sides, neutralizing the ideological stalemate.
      *   Move 5 relies on the clarity of Moves 2 and 3; if they haven't grasped the methodological distinction, the translation task will fail.

  6.  **Whiteboard Strategy:**
      *   Left column: "Individualist Account" (Actions, Beliefs).
      *   Right column: "Holist Account" (Rates, Institutions, Norms).
      *   Center: "The Gap" (Where the translation fails).
      *   Keep the board visible throughout Move 5 to point at the "Gap."

  7.  **Time Management:**
      *   Strictly enforce the 18-minute talk limit. Use a timer. If you talk more, the quant half will lecture and the qual half will theorize, and the distinction will vanish. Your job is to facilitate the collision, not resolve it.
