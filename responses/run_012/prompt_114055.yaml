prompt: |-
  I am the rules manager for a mid-sized tabletop card game with an organized tournament circuit. Our comprehensive rules run to roughly a hundred pages, and card text may refer to other cards, to the rules themselves, and to the card it is printed on. That last freedom is a recurring embarrassment: playtesters find self-referential cards that make the game incoherent, the card ships anyway, two judges rule differently at two events, and we spend a season issuing errata and apologies. I get a handful of these per set and one or two more with every monthly rules update, and I want to stop adjudicating them one at a time.

  Write me a decision procedure I can run on a single piece of card or rule text, and on an entire card set at once, that sorts self-reference into three outcomes: benign (ship it), vicious (no coherent outcome; ban or rework), and underdetermined (coherent, but not uniquely so; needs a tiebreaker or a priority rule). Give me the tests in the order I should apply them, what counts as a sufficient answer at each step, where the procedure may stop with a no, and where it must hand the decision back to a person.

  Ground it in what Russell's paradox licenses and what it over-licenses: the collection that belongs to itself just in case it does not; the fact that a definition quantifying over a totality that contains the thing being defined is not automatically vicious (as with the longest card text in play); the difference between a self-referential system with no consistent outcome, with exactly one, and with several; the notion of grounding, that is, whether the evaluation has a base case to stand on; and the classical repair of stratifying a language so that nothing can speak about its own level, which works but is usually blunter than the case requires. Skip the history; I need the tests. No set-theoretic notation — my team has no formal logic, and whatever we ship has to be applied, mid-round, by a judge at a table.

  Constraints: I have about two hours before the rules committee meets. Anything I declare unshippable has to be defended to the committee chair, a lawyer, who will ask why we cannot simply reword it; so the procedure should prefer rewording wherever rewording exists, and say what the rewording should look like. Errata are expensive and bans are worse.

  Then run it, out loud, on the following, and tell me where it strains:

  1. Nullstone: "Ignore the text of any card that refers to this card." A fan favorite; I would hate to lose it.
  2. Grand Ledger: "The controller of Grand Ledger draws a card if Grand Ledger's printed text is longer than the printed text of every other card in play."
  3. Rules 9.1 and 9.2, unchanged since our first edition. Rule 9.1: "This rule does not apply if rule 9.2 applies." Rule 9.2: "This rule applies if rule 9.1 does not apply."
  4. Rules 12.4 and 12.5. Rule 12.4: "This rule applies if and only if rule 12.5 applies." Rule 12.5: "This rule applies if and only if rule 12.4 does not apply."

  Finally, tell me what the procedure cannot do, which of its steps are judgment calls dressed as procedure, and what I should say to the committee about the limits of the whole exercise.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Rules Manager for a mid-sized TCG.
      *   **Problem:** Self-referential card/rule text causes incoherence, inconsistent judging, and expensive errata/bans.
      *   **Goal:** A decision procedure to categorize self-reference into Benign (ship), Vicious (ban/rework), and Underdetermined (needs tiebreaker).
      *   **Scope:** Apply to single text and entire sets.
      *   **Theoretical Basis:** Russell's Paradox (vicious vs. benign), Grounding (base cases), Stratification (language levels), Consistency/Uniqueness of outcomes.
      *   **Constraints:** No set-theoretic notation (judges need to use it mid-round). Must prefer rewording over banning. Time limit (2 hours before meeting). Must defend to a lawyer (chair).
      *   **Task:** Write the procedure, run it on 4 specific examples, identify strains/limits, and advise on what to tell the committee.

  2.  **Deconstruct the Theory for Practical Application:**
      *   *Russell's Paradox:* "The set of all sets that do not contain themselves." If it contains itself, it doesn't. If it doesn't, it does. This is *Vicious*.
      *   *Benign Self-Reference:* "This sentence has five words." Or the "Longest card text" example. It refers to the totality but resolves to a stable truth value.
      *   *Underdetermined:* "This statement is true." It *could* be true, it *could* be false. No contradiction, but no unique solution. In a game, this means multiple legal game states exist simultaneously, which is bad for tournaments.
      *   *Grounding:* Does the evaluation eventually hit a fact that doesn't depend on the result of the evaluation? (e.g., mana cost, power/toughness, printed text length).
      *   *Stratification:* Preventing level-mixing. In TCGs, this is usually "Card Text" vs. "Game Rules" vs. "Tournament Policy."

  3.  **Drafting the Decision Procedure (The "Self-Reference Stress Test"):**
      *   *Goal:* Make it algorithmic enough for a judge but flexible enough for design.
      *   *Step 1: Identification.* Does it actually refer to itself? (Keywords: "this card," "this rule," "itself").
      *   *Step 2: Grounding Check.* Is there a fact outside the loop? (e.g., printed text length, mana value, number of counters). If yes -> Benign.
      *   *Step 3: Dependency Loop.* If no grounding, trace the dependency. Does A depend on B, and B depend on A?
      *   *Step 4: Truth Value/State Stability.* Assume "Yes/On." Does it force "No/Off"? Assume "No/Off." Does it force "Yes/On"?
          *   If Yes forces No AND No forces Yes -> Vicious (Paradox).
          *   If Yes forces Yes AND No forces No -> Underdetermined (Loop).
          *   If one works and the other doesn't -> Benign (Stable).
      *   *Step 5: Rewording Priority.* Before banning, can we add a timestamp, a layer, or a "printed" qualifier?

      *Refining for the Lawyer/Committee:* The lawyer wants to know *why* we can't just reword. The procedure needs to explicitly state *what kind* of rewording fixes *which* problem.
      *Refining for Judges:* Needs to be a flowchart style logic without symbols.

  4.  **Running the Procedure on the Examples:**

      *   **1. Nullstone:** "Ignore the text of any card that refers to this card."
          *   *Analysis:* If Card X refers to Nullstone, Nullstone ignores X. If Nullstone ignores X, does X still refer to Nullstone? Usually, "refers to" is a static property of the text, not the active effect.
          *   *Strain:* "Refers to" is ambiguous. Is it printed text or current state? If printed, it's benign. If dynamic, it might flicker.
          *   *Verdict:* Likely Benign *if* "refers to" means "printed text." Needs clarification.

      *   **2. Grand Ledger:** "Draws... if Grand Ledger's printed text is longer... than every other card in play."
          *   *Analysis:* Refers to "printed text." This is a static, grounded fact. It doesn't change based on the draw.
          *   *Verdict:* Benign. Grounded in physical reality (ink on cardboard).

      *   **3. Rules 9.1 & 9.2:** 9.1: "Not apply if 9.2 applies." 9.2: "Applies if 9.1 does not apply."
          *   *Analysis:*
              *   Assume 9.1 applies -> 9.2 does not apply (per 9.1).
              *   If 9.2 does not apply -> 9.1 applies (per 9.2 condition "if 9.1 does not apply" is false? Wait. 9.2 says "Applies IF 9.1 does not apply." If 9.1 *does* apply, 9.2 condition is false, so 9.2 doesn't apply. This is consistent.)
              *   Assume 9.1 does not apply -> 9.2 applies (per 9.2).
              *   If 9.2 applies -> 9.1 does not apply (per 9.1).
              *   *Result:* Two stable states. (9.1 On/9.2 Off) OR (9.1 Off/9.2 On).
              *   *Verdict:* Underdetermined. Coherent, but not unique. Needs a tiebreaker (e.g., rule number priority).

      *   **4. Rules 12.4 & 12.5:** 12.4: "Applies IFF 12.5 applies." 12.5: "Applies IFF 12.4 does not apply."
          *   *Analysis:*
              *   Assume 12.4 On -> 12.5 On (per 12.4).
              *   If 12.5 On -> 12.4 Off (per 12.5).
              *   Contradiction (On vs Off).
              *   Assume 12.4 Off -> 12.5 Off (per 12.4).
              *   If 12.5 Off -> 12.4 On (per 12.5).
              *   Contradiction.
              *   *Verdict:* Vicious. Russell's Paradox structure. No consistent state.

  5.  **Addressing the Constraints & Limitations:**
      *   *Time:* Keep it concise.
      *   *Lawyer:* Emphasize that "rewording" works for Underdetermined and some Vicious cases, but some Vicious cases require mechanical changes, not just text changes.
      *   *Judges:* The procedure must be actionable.
      *   *Limits:* The procedure can't predict interaction with *future* cards (the "Set" analysis part). It can't solve semantic ambiguity (what does "refer" mean?). It relies on human interpretation of "state."

  6.  **Refining the Output Structure:**
      *   **Part 1: The Procedure (The "Self-Reference Stress Test").** Clear steps, stop conditions, rewording fixes.
      *   **Part 2: The Run-Through.** Applying the test to the 4 examples.
      *   **Part 3: The Strain & Limits.** Where the logic breaks, judgment calls, and the pitch to the committee.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is Step 4 too abstract for a judge?
      *   *Fix:* Use "The Toggle Test." Assume it works, does it break? Assume it doesn't, does it break?
      *   *Critique:* The lawyer wants to know why we can't just reword Nullstone.
      *   *Fix:* Specify that Nullstone needs a definition of "refer" (printed vs. active).
      *   *Critique:* Make sure to distinguish between "Set Analysis" and "Single Card Analysis."
      *   *Fix:* Add a preamble about running this on a spreadsheet/database for sets (looking for cycles).
      *   *Tone:* Professional, authoritative, pragmatic.

  8.  **Final Review against constraints:**
      *   No set notation? Check.
      *   Russell's paradox grounded? Check.
      *   Rewording preferred? Check.
      *   4 Examples analyzed? Check.
      *   Limits explained? Check.

      *(Self-Correction on Rule 9.1/9.2)*: Let's double check the logic.
      9.1: ~9.2 -> 9.1 (Implicitly? No, "This rule does not apply IF 9.2 applies." So 9.2 -> ~9.1. If ~9.2, 9.1 *can* apply.)
      9.2: ~9.1 -> 9.2.
      Scenario A: 9.1 applies. Then 9.2 must not apply (per 9.1). If 9.2 does not apply, 9.2's condition (~9.1) is false. So 9.2 does not apply. Consistent.
      Scenario B: 9.1 does not apply. Then 9.2 applies (per 9.2). If 9.2 applies, 9.1 does not apply (per 9.1). Consistent.
      Yes, Underdetermined. Two valid states.

      *(Self-Correction on Rule 12.4/12.5)*:
      12.4 <-> 12.5
      12.5 <-> ~12.4
      Substitute: 12.4 <-> ~12.4. Paradox. Vicious.

      *(Self-Correction on Nullstone)*:
      "Ignore text of any card that refers to this card."
      If Nullstone is in play. Card X says "Destroy Nullstone."
      Does X refer to Nullstone? Yes.
      Does Nullstone ignore X? Yes.
      Does X still refer to Nullstone? Yes (printed text).
      Does Nullstone still ignore X? Yes.
      Stable.
      *Strain:* What if Card Y says "Ignore cards that ignore this card"? Then we get a loop. The procedure needs to flag *interactions*, not just single cards. I need to make sure the "Set Analysis" part covers interaction loops.

      *Wait, the prompt asks for a procedure on "a single piece of card or rule text, AND on an entire card set at once."*
      I need to make sure the procedure handles the *set* aspect (interaction loops).
      *Adjustment:* Add a "Network Check" phase for sets.

      *Final Plan:*
      1. Introduction/Philosophy.
      2. The Procedure (Single Card + Set Level).
      3. The 4 Examples.
      4. Limitations/Committee Pitch.

      Let's write it.
answer: |-
  # The Self-Reference Stress Test (SRST)

  **Purpose:** To categorize self-referential game text into **Benign** (ship), **Underdetermined** (fix with priority/tiebreaker), or **Vicious** (rework or ban).
  **Audience:** Design Team (pre-release), Rules Committee (policy), Judges (mid-round).
  **Philosophy:** Self-reference is not inherently broken. It is broken only when it prevents the game from reaching a single, stable state. We prefer rewording to banning. We prefer static facts to dynamic loops.

  ---

  ## Part 1: The Decision Procedure

  Run these steps in order. If a step yields a definitive outcome, stop and apply the remedy. If a step requires human interpretation, flag it for the Rules Committee.

  ### Phase A: Single Text Analysis
  *Use this for individual cards or rules during design or errata review.*

  **Step 1: The Reference Check**
  *   **Test:** Does the text explicitly name itself, use "this card/rule," or refer to a property that only this specific object possesses (e.g., "the card with this name")?
  *   **No:** Pass. (Not self-referential).
  *   **Yes:** Proceed to Step 2.

  **Step 2: The Grounding Check**
  *   **Test:** Does the text rely on a **Static Fact** to resolve its condition?
      *   *Static Facts:* Printed text length, mana cost, card name, expansion symbol, rule number, physical existence.
      *   *Dynamic Facts:* Current game state, whether an effect is "active," whether another card is "ignoring" this one.
  *   **Yes (Grounded):** **Outcome: BENIGN.**
      *   *Reasoning:* The truth value is fixed by the physical object or static rulebook, not the game state loop.
      *   *Action:* Ship it.
  *   **No (Ungrounded):** Proceed to Step 3.

  **Step 3: The Toggle Test (Truth Value Stability)**
  *   **Test:** Assume the card/rule is **Active/True**. Does the text force it to be **Inactive/False**?
      *   Then, assume the card/rule is **Inactive/False**. Does the text force it to be **Active/True**?
  *   **Result A (Stable):** One assumption holds, the other fails. (e.g., If Active, it stays Active. If Inactive, it becomes Active).
      *   **Outcome: BENIGN.** (The game naturally settles into the stable state).
  *   **Result B (Paradox):** Active forces Inactive AND Inactive forces Active.
      *   **Outcome: VICIOUS.** (Russell's Paradox structure).
      *   *Remedy:* **Reword.** Change one condition to rely on a Static Fact (see Step 2) or introduce a Layer/Timestamp priority. If rewording breaks the design goal, Ban.
  *   **Result C (Loop):** Active forces Active AND Inactive forces Inactive.
      *   **Outcome: UNDERDETERMINED.** (Two valid game states exist simultaneously).
      *   *Remedy:* **Reword.** Add a tiebreaker (e.g., "If tied, the controller chooses," or "Rule X takes priority over Rule Y").

  ### Phase B: Set-Wide Analysis
  *Use this on a database of card text before a set releases.*

  **Step 4: The Dependency Network**
  *   **Test:** Map all cards that reference other specific cards or "any card that [does X]." Look for cycles (Card A affects B, B affects A).
  *   **Action:** Run the **Toggle Test (Step 3)** on the *system* of cards, not just individuals.
      *   *Example:* Card A says "Ignore Card B." Card B says "Ignore Card A."
      *   If Active/Active is impossible, and Inactive/Inactive is impossible -> **VICIOUS.**
      *   If Active/Active works AND Inactive/Inactive works -> **UNDERDETERMINED.**

  ---

  ## Part 2: Running the Procedure (The Four Cases)

  Here is the SRST applied to your specific examples, including where the procedure strains.

  ### 1. Nullstone
  *Text: "Ignore the text of any card that refers to this card."*

  *   **Step 1 (Reference):** Yes. Refers to "this card."
  *   **Step 2 (Grounding):** **STRAIN.**
      *   *Analysis:* Does "refers to" mean *printed text* (Static) or *current effect* (Dynamic)?
      *   *If Printed:* Grounded. A card either has the words "Nullstone" printed on it or it doesn't. **Outcome: BENIGN.**
      *   *If Dynamic:* Ungrounded. If Nullstone ignores Card X, does Card X still "refer" to Nullstone in the game state? If "referring" requires the text to be *active*, Nullstone turns off X, which stops X from referring, which turns X back on.
  *   **Verdict:** **UNDERDETERMINED (due to ambiguity).**
  *   **Remedy:** Reword to "Ignore the **printed** text of any card that **names** this card." This grounds it in ink, not game state.
  *   **Committee Defense:** We are not banning a fan favorite; we are clarifying the definition of "refer" to prevent judge calls.

  ### 2. Grand Ledger
  *Text: "The controller of Grand Ledger draws a card if Grand Ledger's printed text is longer than the printed text of every other card in play."*

  *   **Step 1 (Reference):** Yes. Refers to "Grand Ledger's printed text."
  *   **Step 2 (Grounding):** **YES.**
      *   *Analysis:* "Printed text length" is a physical fact. It does not change based on whether the card draws a card. The effect (drawing) does not change the cause (length).
  *   **Verdict:** **BENIGN.**
  *   **Action:** Ship it. No errata needed.

  ### 3. Rules 9.1 and 9.2
  *Text: 9.1: "This rule does not apply if rule 9.2 applies." | 9.2: "This rule applies if rule 9.1 does not apply."*

  *   **Step 1 (Reference):** Yes. Mutual reference.
  *   **Step 2 (Grounding):** **NO.** Depends on the application state of the other rule.
  *   **Step 3 (Toggle Test):**
      *   *Assume 9.1 Applies:* 9.1 says 9.2 must Not Apply. 9.2 says "I apply if 9.1 does Not Apply." Since 9.1 *Does* Apply, 9.2's condition is false. 9.2 does Not Apply. **Consistent.**
      *   *Assume 9.1 Does Not Apply:* 9.2 says "I apply if 9.1 does Not Apply." So 9.2 Applies. 9.1 says "I do not apply if 9.2 applies." Since 9.2 Applies, 9.1 Does Not Apply. **Consistent.**
  *   **Verdict:** **UNDERDETERMINED.**
      *   *Analysis:* Both "9.1 On/9.2 Off" and "9.1 Off/9.2 On" are legally valid game states. A judge could rule either way without breaking logic.
  *   **Remedy:** **Reword.** Add a priority clause. "If both rules would apply, Rule 9.1 takes precedence." Or, "In case of conflict, the lower rule number applies."
  *   **Committee Defense:** This is not a bug, it's a missing tiebreaker. We can fix this with a one-sentence update to the Rules Overview, no card errata required.

  ### 4. Rules 12.4 and 12.5
  *Text: 12.4: "This rule applies if and only if rule 12.5 applies." | 12.5: "This rule applies if and only if rule 12.4 does not apply."*

  *   **Step 1 (Reference):** Yes. Mutual reference.
  *   **Step 2 (Grounding):** **NO.**
  *   **Step 3 (Toggle Test):**
      *   *Assume 12.4 Applies:* 12.4 forces 12.5 to Apply. 12.5 forces 12.4 to Not Apply. **Contradiction.**
      *   *Assume 12.4 Does Not Apply:* 12.4 forces 12.5 to Not Apply. 12.5 forces 12.4 to Apply. **Contradiction.**
  *   **Verdict:** **VICIOUS.**
      *   *Analysis:* This is Russell's Paradox in plain English. There is no legal game state.
  *   **Remedy:** **Rework.** One rule must be grounded. Change 12.5 to "This rule applies if Rule 12.4 does not apply **and the game is in the Combat Phase**" (or any static fact).
  *   **Committee Defense:** This cannot be adjudicated mid-round. It creates a game crash. It must be fixed before release.

  ---

  ## Part 3: Limitations and Committee Pitch

  ### Where the Procedure Strains
  1.  **Semantic Ambiguity (The Nullstone Problem):** The SRST assumes words have fixed meanings. It cannot detect if "refer to" or "ignore" is ambiguous. This requires a human linguist or senior judge to define terms before the test runs.
  2.  **Hidden Loops (The Set Problem):** Phase B requires mapping interactions. If Card A interacts with Card B, and Card B with Card C, and Card C with Card A, the SRST flags the *cycle*, but a human must determine if the cycle is Vicious or Underdetermined. This is labor-intensive for large sets.
  3.  **Temporal Ambiguity:** The test assumes a static moment. It struggles with "stack" or "trigger" ordering (e.g., "When this enters, destroy itself"). This requires a Layer/Timestamp policy, not just a logic test.

  ### Judgment Calls Dressed as Procedure
  *   **Step 2 (Grounding):** Deciding what counts as a "Static Fact" is a policy decision. Is "number of creatures in play" static? No, it changes. Is "printed text" static? Yes. Judges must be trained on this distinction.
  *   **Step 3 (Toggle Test):** In complex networks, tracing the "force" requires understanding the game mechanics. A judge might misidentify a "force" as a "suggestion."

  ### What to Tell the Committee (The Lawyer & The Chair)
  **To the Chair (Lawyer):**
  > "We cannot simply 'reword' Vicious cases without changing the mechanic, because the logic itself is broken. However, for Underdetermined cases, we are not changing the mechanic, only adding a tiebreaker. This is legally distinct from a nerf; it is clarifying ambiguous contract terms. The SRST documents *why* a card is unshippable, protecting us from claims of arbitrary bans."

  **To the Committee (Design/Play):**
  > "This procedure admits that self-reference is a tool, not a sin. It stops us from banning cards like Grand Ledger that work fine. It forces us to fix cards like Nullstone before they ship, saving us a season of errata. It identifies the 'crash bugs' (Vicious) vs. the 'feature ambiguity' (Underdetermined). It is not perfect—it requires human judgment on semantics—but it moves us from 'panic and patch' to 'test and ship'."

  **The Hard Truth:**
  > "This procedure cannot guarantee zero errors. It relies on our definitions of words remaining consistent. If we change what 'ignore' means in the core rules, previously Benign cards may become Vicious. We must freeze our Glossary definitions alongside the card set."
