answer: |-
  You are stuck because you are evaluating the books using two different rubrics while pretending to use one. Your friend is asking an epistemological question: "Is the reasoning process structurally sound?" You are asking a sociological question: "Is this claim admissible within the community?" Neither of you is wrong about your respective criteria, but you are treating them as competing definitions for the same label rather than complementary filters for different categories.

  This is not merely a verbal dispute about the word "pseudohistory," because you both care about the actual judgment of the work, not just the label. It is also not a genuine disagreement about evidence criteria, because you likely agree that source criticism and defeasibility are good things. The conflict arises because your friend sees that valid methods can produce fringe conclusions (revisionism), while you see that fringe conclusions often lack valid methods (crankery). You are trying to solve the same problem—sorting good books from bad—but you are measuring different properties. Your friend measures the engine; you measure the destination.

  Progress here requires decoupling the concepts rather than forcing one definition to win. You should agree to reserve "pseudohistory" for works that fail methodologically (satisfying your friend's concern about circularity and unfair labeling of revisionists) and use a term like "fringe history" for works that merely collide with consensus (satisfying your concern about boundary maintenance). This allows you to acknowledge that a book can be methodologically sound but wrong (revisionist) without granting it legitimacy, and methodologically broken without dismissing it solely because it is unpopular. The stalemate breaks when you admit that "pseudohistory" is a compound judgment requiring both methodological failure and consensus deviation, but that method is the primary driver.

  Diagnosis: Answering two different questions under one label.
