      However, we must decline the "wellbeing" score. Our geneticist's point is decisive here: disease reduction is an absolute good, whereas height and educational attainment are relative goods. If every family screens for height, no child gains a competitive advantage; we simply raise the baseline expectation while incurring medical risk. This turns reproduction into an arms race rather than a health intervention. This is the core ethical objection, distinct from lazy invocations of "eugenics." The harm lies in commodifying children as projects for optimization rather than persons to be welcomed.

