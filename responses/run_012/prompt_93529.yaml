      3.  **Transparency:** We owe parents who ask for the wellbeing panel an explanation that we prioritize medical necessity over social advantage. We cannot offer services that exacerbate social inequality without medical benefit.

      **Revisit**
      This decision should be revisited in 24 months, or sooner if regulatory guidance from ASRM or FDA changes.

