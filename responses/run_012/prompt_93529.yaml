  **MEMORANDUM**

  **TO:** Ethics Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Polygenic Risk Screening Proposal

  **Recommendation:** Approve the disease-risk panel only. Decline the "wellbeing" index. Reject the "childhood worsening" compromise.

  **Rationale**
  The Medical Director is correct that parents seek the best shot at a good life, but the Senior Counselor is right to worry about where we draw the line. The distinction between disease and trait is not cosmetic; it is the difference between preventing harm and purchasing advantage.

  We must reject the Director's compromise to limit screening to conditions affecting childhood. Adult-onset cancers and heart disease are genuine pathologies, not social disadvantages. Excluding them undermines the medical justification for the program while retaining the ethical risks. If we are practicing medicine, we address serious health risks regardless of onset age. Limiting to childhood impairments arbitrarily narrows our scope of care without solving the ethical dilemma.

  However, we must decline the "wellbeing" score. Our geneticist's point is decisive here: disease reduction is an absolute good, whereas height and educational attainment are relative goods. If every family screens for height, no child gains a competitive advantage; we simply raise the baseline expectation while incurring medical risk. This turns reproduction into an arms race rather than a health intervention. The core ethical objection is not a vague fear of "eugenics," but the commodification of children as projects for optimization and the exacerbation of social inequality without medical benefit.

  **Addressing the Slippery Slope**
  The Counselor argues the disease/trait line is cosmetic. She is right that normalization is a risk; once we accept selection, the logic of optimization is hard to contain. What stops the slide is not merely policy language, but our refusal to validate non-medical metrics. We must refuse to contract with labs that bundle these scores and require separate reporting. We owe parents who ask for the wellbeing panel an honest explanation: we prioritize preventing suffering over engineering advantage. We must be prepared to turn away revenue if the lab insists on bundling. If we cannot maintain this boundary internally, we should decline the entire panel.

  **Revisit**
  This decision should be revisited in 24 months, or sooner if regulatory guidance from ASRM or FDA changes.

  **Motion**
  I move we adopt the disease-risk panel excluding non-medical traits, contingent on the counseling protocol above.
