answer: |-
  There is no single, canonical noun phrase in the management or decision-science literature that captures this exact phenomenon with the precision you are asking for. However, it is a recognized intersection of three distinct concepts: **Partition Dependence** (from behavioral economics), **Model Specification** (from econometrics), and **Description Invariance** (from rational choice theory).

  If you need a name to carve this out for your team, the most accurate term is **Decomposition Dependence**.

  Here is the carving you requested: what it is, how it differs from its neighbors, the role of blinding, and where the boundary of stability lies.

  ### 1. The Name and Definition
  **Decomposition Dependence** is the phenomenon where the output of a decision process is determined not only by the answers to the sub-questions but by the *choice of basis set* (the slicing) used to decompose the problem.

  It is a specific, structural form of the **Framing Effect**. While a standard framing effect changes the *valence* of the information (gain vs. loss), Decomposition Dependence changes the *dimensionality* of the information (which variables are admissible).

  *   **The Carving:** The top-level decision is not a function $f(\text{answers})$. It is a function $f(\text{answers} \mid \text{decomposition})$. Because the decomposition is treated as a neutral scaffold rather than a parameter, it becomes a **hidden prior**.
  *   **Why "Dependence"?** It parallels **Path Dependence**. Just as history locks in a suboptimal technology, the initial choice of slicing locks in a suboptimal (or contradictory) decision logic that cannot be corrected by local rigor.

  ### 2. Differentiation from Nearest Neighbors
  You correctly identified that the standard fallacies do not fit. Here is the precise boundary:

  *   **Vs. The Discursive Dilemma:** In the Discursive Dilemma, the group agrees on the premises ($P, Q$) and the rule ($P \land Q \rightarrow R$), but the voting outcome contradicts the rule. In your case, the *premises themselves change* ($A, B, C$ vs. $X, Y, Z$). The inconsistency is not in the aggregation; it is in the **ontology**.
  *   **Vs. Partition Dependence:** This is the closest academic relative. Partition Dependence describes how subjective probabilities change when an event is "unpacked" (e.g., probability of "accident" vs. "car accident + plane accident"). Your phenomenon is **Strategic Partition Dependence**. It differs because it involves *qualitative criteria* (strategy, fit) rather than just probability mass, and it is *distributed* across agents who are blinded to the whole.
  *   **Vs. Fallacy of Composition:** That fallacy assumes the whole *must* resemble the parts. Your process does not assume that; it assumes the whole is *derived* from the parts. The error is that the derivation function changes when the parts change.
  *   **Vs. Model Specification Bias:** In econometrics, choosing different control variables yields different regression results. This is the mathematical equivalent of your process. However, in econometrics, this is usually treated as an error to be solved (via robustness checks). In your process, it is treated as a feature (hygiene).

  ### 3. The Mechanism: Latent Variable Selection
  Why does this happen? A strategic decision is a high-dimensional object. Any decomposition is a **projection** of that object onto a lower-dimensional plane.

  *   **Slicing A (Market/Build/Money)** projects the decision onto a **Financial/Feasibility Basis**. It captures variance related to viability but discards variance related to strategic fit.
  *   **Slicing B (Strategy/Opportunity/Reputation)** projects the decision onto a **Strategic/Political Basis**. It captures variance related to alignment but discards variance related to raw viability.

  When you blind the sub-answerers ("do not think about the larger decision"), you prevent them from **calibrating** their local answer against the global truth.
  *   In a non-blinded process, the person answering "Is the market big enough?" might implicitly think, "It's big, but not big enough to justify the strategic risk," and answer "No."
  *   In the blinded process, they answer "Yes" (because the market *is* objectively big), importing a **false positive** into the assembly.

  The blinding does not remove bias; it **displaces** the bias from the *answer* to the *structure*. The bias is no longer in the person's judgment; it is in the architect's choice of slicing.

  ### 4. Is Blinding Essential?
  Blinding is not essential to Decomposition Dependence, but it is essential to the **severity** of the vice you are describing.

  *   **Without Blinding:** A single decision-maker slicing the problem two ways might notice the contradiction and seek a "meta-judgment" to reconcile them. The human mind acts as a **robustness check**.
  *   **With Blinding:** The process creates **Local Coherence / Global Incoherence**. Each sub-answer is locally rational (defensible), but the system is globally incoherent. The blinding prevents the "reassembly" phase from detecting that information was lost in the slicing. It turns the decomposition into a **Black Box** where the hyperparameters (the slices) are invisible to the operators.

  ### 5. The Boundary: When is Decomposition Stable?
  You asked where the boundary lies—what kind of decomposition returns the same answer. In mathematical terms, a decomposition is stable only if the sub-questions form a **Sufficient Statistic** for the decision.

  A set of sub-questions is a Sufficient Statistic if knowing the answers to them provides the same information as knowing the answer to the global question.
  *   **Unstable Decomposition:** The slices are **Incomplete** (they miss critical latent variables, like "strategic fit" in the financial slice) or **Overlapping** (they count the same risk twice under different names).
  *   **Stable Decomposition:** The slices are **Orthogonal** and **Complete**. They cover the entire decision space without gaps and without double-counting.

  **The Test for Stability:**
  To know if your decomposition is stable, you must perform a **Residual Check**. After assembling the answer, ask: "Is there any relevant information about this decision that was *not* captured by one of the sub-questions?"
  *   In your January slice (Market/Build/Money), the residual was "Strategic Fit."
  *   In your June slice (Strategy/Engineers/Customers), the residual was "Raw Viability."
  *   Because the residual was non-zero in both cases, the decomposition was unstable.

  ### 6. The Vice: Structural Arbitrage
  The specific vice you are describing—the ability to get the answer you want by choosing the slice—should be called **Structural Arbitrage**.

  Because the slicing is treated as neutral methodology rather than a substantive choice, a bad actor (or a biased team) can "arbitrage" the decision process. They do not need to lie about the sub-answers; they only need to lobby for the *structure* of the inquiry.
  *   If you want to **Go**, argue for a Financial Decomposition.
  *   If you want to **No-Go**, argue for a Strategic Decomposition.

  ### Summary for Your Team
  If you need to operationalize this:
  1.  **Name:** Decomposition Dependence.
  2.  **Definition:** The decision outcome depends on the choice of sub-questions, not just the answers to them.
  3.  **The Fix:** Do not treat the decomposition as neutral. Treat the **Slicing** as a decision variable that must be agreed upon *before* the sub-questions are assigned.
  4.  **The Check:** Run **Competing Decompositions** intentionally. If Slice A says Go and Slice B says No-Go, do not pick the winner. Acknowledge that the decision is **Under-Specified** and requires a higher-level judgment call to reconcile the missing latent variables.

  You have discovered that **rigor in the parts does not guarantee coherence in the whole** when the map of the parts changes. That is Decomposition Dependence.
