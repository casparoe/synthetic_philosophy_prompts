answer: |-
  The town hall smelled of wet wool and kerosene. Four hundred souls were packed into a space built for three, the air thick enough to chew. On the dais, the Rulebook lay open on a lectern, bound in black leather that had been thumb-worn smooth at the corners.

  Elias stood at the mic, his hand gripping the stand. He wasn't shouting, but his voice carried the brittle edge of a man who had rehearsed this in his head a thousand times.

  "Motion 402," Elias said. "To amend Rule 12, Section 4. We lower the amendment threshold for all protected clauses from three-quarters to a simple majority. One town, one standard."

  A murmur rippled through the crowd. Rule 12 was the lock on the door.

  Harris, the town clerk, adjusted his glasses. He was the keeper of the Book, though everyone knew he didn't own it. "The Chair recognizes the motion," Harris said, his voice dry. "However, Rule 12 is a protected threshold. Per Rule 3, amendment requires a three-quarters vote *and* certification by the Standing Committee that the change is not retroactive."

  He turned to the small table to his right. Three people sat there: the Committee. They looked uncomfortable. The center seat was occupied by Mrs. Gable, who had been appointed under Rule 9—the ordinary rule defining Committee membership. Rule 9 could be changed by a simple majority. Rule 12 could not.

  Mrs. Gable stood. "The Committee denies certification."

  The room tightened.

  "On what grounds?" Elias asked.

  "On the grounds that consolidating the thresholds alters the legal landscape of past agreements made under the assumption of higher protection," Gable said. She was reading from a script, but her eyes were on Elias. "It is retroactive in effect. We cannot certify."

  Elias turned to the crowd. "So we're stuck. Three-quarters of you might want this, but three people appointed under a simple majority rule can veto the will of the majority forever."

  "They are guarding the lock," someone shouted from the back.

  "They *are* the lock," Elias corrected. "And the key to the lock is Rule 9. Which we can change."

  He turned back to Harris. "New Motion. 403. To amend Rule 9. We dissolve the current Standing Committee and appoint a new triad. Names submitted: Jory, Kinsella, and Davies."

  Harris blinked. "Motion 403 is an ordinary amendment. It requires a simple majority."

  "Vote," Elias said.

  It was close, but it passed. Two hundred and ten hands went up. The room exhaled, then held its breath again. By the book, Jory, Kinsella, and Davies were now the Committee. They walked up to the dais and sat in the vacant chairs. Mrs. Gable and her colleagues gathered their papers, looking uncertainly at the new occupants. Were they still the Committee? They had been when the motion started. Were they now?

  Jory, the new Chair, leaned into the mic. "The new Committee reviews Motion 402."

  "You can't do that," Mrs. Gable said from the floor. "We denied certification. The process is dead."

  "The Committee composition is an ordinary rule," Jory said. "The change was valid. We are the Committee. We certify Motion 402 as non-retroactive. It applies only to future votes."

  Harris looked at the Book. He looked at Gable. He looked at Jory. "So... do we vote on 402?"

  "Vote," Elias said.

  The hands went up. It was barely over the line. Three hundred and one people. Three-quarters of the registered voters.

  Harris's pen hovered over the page. "Motion 402 passes. Rule 12 is amended."

  "Wait," said a voice from the side. It was Mara, who had been silent until now. She stood near the exit, her coat on. "If Rule 12 was protected until the vote concluded, then Motion 403 was subject to the old rules."

  The room went still.

  "Explain," Harris said.

  "Motion 403 changed the Committee," Mara said. "But the Committee exists to guard Rule 12. If you change the Guard to open the Gate, you are altering the protection mechanism of the Gate. Rule 3 says the protection mechanism can only be touched with certification. You didn't get certification to change the Committee, because you didn't know you needed it until you tried to change the Gate."

  Jory scoffed. "Rule 9 is ordinary. Everyone knows that."

  "Rule 9 defines the Guard," Mara said. "If the Guard is part of the Protection, then Rule 9 is protected. If Rule 9 is protected, you needed three-quarters to change the Committee. You only had a majority. So Jory isn't on the Committee. Gable is. And Gable denied certification. So 402 is void."

  "And if 402 is void," Elias snapped, "then Rule 12 is still protected. But if Rule 9 was ordinary, then Jory *is* on the Committee. And if Jory is on the Committee, 402 is valid. And if 402 is valid, Rule 12 is no longer protected, which means Rule 9 was definitely ordinary all along."

  He looked at Harris. "Which book do we read tomorrow?"

  Harris looked down at the open ledger. The ink on the page where he had just written *Amendment Passed* was still wet. Beside it, the old text stared back, unchanged.

  "I don't know," Harris said.

  "Are we bound?" Elias asked. His voice was quieter now. "If I leave this hall, and I break a rule that was protected yesterday but unprotected today... am I liable?"

  "Are *we* liable?" Jory asked, gesturing to the new Committee. "If we acted without standing, are our certifications void?"

  Mrs. Gable stood up again. "The Committee denies that denial."

  "That's not a thing," someone said.

  "It is if the rule says so," Gable replied.

  The kerosene lamp flickered. The shadow of the lectern stretched long across the floor, bisecting the room. On one side, people were gathering their things, acting as if the vote had passed, talking about the new simplicity of the laws. On the other side, people stood frozen, looking at Harris, waiting for him to close the Book.

  He didn't close it. He couldn't. If he closed it on the new page, he invalidated the Committee that certified it. If he closed it on the old page, he invalidated the vote that changed the Committee.

  "We adjourn," Harris said finally.

  "Do we adjourn under Rule 5 or Rule 5-Amended?" Mara asked.

  Harris blew out the lamp. "We adjourn."

  In the dark, the sound of the door opening was the only law left.

  ***

  **Afterword**

  This story takes a specific liberty with the logic of legal positivism to preserve the indeterminacy you requested. In most formal legal systems (like H.L.A. Hart's concept of a "rule of recognition"), there is a meta-rule that establishes hierarchy—usually stating that constitutional amendments trump ordinary statutes, or that the most recent expression of sovereign will prevails. If such a hierarchy existed here, the paradox would dissolve: either Rule 9 is subordinate to Rule 12 (making the Committee change invalid without certification) or Rule 9 is sovereign (making the Committee change valid regardless of certification).

  The story assumes a "flat" ontology where the rules are mutually referential without a higher arbiter. It leans into the *temporal* aspect of the paradox: the status of Rule 9 changes *during* the process of amending Rule 12, creating a loop where the validity of the step depends on the outcome of the step. Logically, this setup is arguably incoherent because a system cannot simultaneously define a rule as "ordinary" and "protected" based on its function rather than its form. However, that incoherence is precisely the puzzle: if the protection relies on a committee defined by an ordinary rule, the protection is logically porous. The story assumes the "Kelsenian" reading where validity is binary (valid/invalid) but the source of validity is circular, leaving the town in a state of suspended animation where the "rule of recognition" has failed to recognize itself.
