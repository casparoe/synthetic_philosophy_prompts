prompt: |-
  I coordinate a reading group on decision theory that meets alongside a summer workshop; the members are graduate students in philosophy and economics together with a couple of practising statisticians, all comfortable with expected-utility talk but none of them specialists in the foundations of rational choice. Next month I have to run the session on superrationality, and I would like you to plan the teaching rather than deliver the explanation itself. My own sense is that the whole thing stands or falls on the order in which the pieces are introduced, and I keep getting it wrong when I improvise, so what I want is the dependency structure laid out: what must already be in place before the central claim can even be stated, which of the audience's existing habits of thought have to be dismantled first (I suspect the reflex of reading "rational" as "maximises expected utility given the other player's fixed behaviour" is the main obstacle), and at which point in the sequence each piece has to land for the later pieces to feel forced rather than stipulated.

  Build the session around a single carrying example, and be explicit about what that example must contain and what it must be purged of. My instinct is a one-shot Prisoner's Dilemma between two agents who cannot communicate, will never meet again, and cannot causally influence one another — but I want you to say whether that example can carry the weight or whether it needs to be something else, and in either case to explain why the iterated Prisoner's Dilemma, the reputation story, and the tit-for-tat anecdote have to be kept out of the carrier; in my experience, the moment repetition enters, the audience stops seeing the actual problem and starts seeing a long-run self-interest argument. Then I want the misconception map and a check. The predictable errors I would like you to anticipate include: that superrationality is just the Golden Rule or Kant's universalizability test in decision-theoretic dress; that it secretly requires the two players to be the same person, or to be in telepathic or causal contact; that it is a claim about what people in fact do rather than about what it would be rational to do; that it collapses into ordinary evidential reasoning about what one's own action is evidence of; and that it works only for exactly identical agents, so a partner who is merely almost like you breaks it. For each, tell me where in the sequence the misconception forms and precisely how to head it off there rather than at the end.

  I also want to fold in two ideas that I think are absent from the popular treatments and that should do real work in the lesson: first, the framing on which two agents cooperate because each can inspect the other's source code and can prove what the other will do, so that "I cooperate" becomes derivable from the other's decision procedure rather than from any expectation about how things will turn out; second, the related and stranger thought that two agents who merely run the same deterministic decision procedure, with no inspection and no communication at all, might each be able to establish that the other's cooperation follows from their own — I want the audience to feel why this is not the same as assuming the other will do whatever you do, and to see exactly which step does the work. Please tell me which of these two to introduce first, and what to leave out entirely at this level and to say so openly, since I would rather cut the formalism than lose the thread. Finally, give me one question I can put to the room at the very end that would distinguish someone who has grasped why superrationality is a claim about reasoning rather than about outcomes from someone who has merely learned to say "cooperate."
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Plan a teaching session on *superrationality* for a reading group (grad students in philosophy/economics, statisticians).
      *   **Constraint 1 (Focus):** Do not deliver the explanation; plan the *teaching structure* (dependency order, sequencing).
      *   **Constraint 2 (Audience):** Comfortable with expected utility (EU), not specialists in foundations. Need to dismantle the "rational = maximize EU given fixed opponent behavior" reflex.
      *   **Constraint 3 (Example):** Use a *single carrying example*. Evaluate the one-shot Prisoner's Dilemma (PD). Explicitly exclude iterated PD, reputation, tit-for-tat. Explain why.
      *   **Constraint 4 (Misconceptions):** Map specific misconceptions (Golden Rule, same person/telepathy, descriptive vs. normative, evidential reasoning, identical agents requirement) to specific points in the sequence to head them off *before* they form.
      *   **Constraint 5 (Advanced Concepts):** Integrate two specific ideas: (1) Source code inspection/proof (Program Equilibrium), (2) Same deterministic procedure without inspection (Logical Correlation). Decide order and what to cut.
      *   **Constraint 6 (Assessment):** Provide one final question to distinguish deep understanding from rote memorization.

  2.  **Deconstruct the Core Problem:**
      *   Superrationality (Hofstadter's term, related to Newcomb, PD, and acausal decision theory) challenges Causal Decision Theory (CDT).
      *   CDT says: My action cannot causally affect the other's action (in one-shot PD). Therefore, defect.
      *   Superrationality says: If we are both rational and symmetric, our reasoning processes will yield the same output. Therefore, my choice *logically determines* the other's choice. Therefore, cooperate.
      *   *The Hurdle:* The audience thinks "Rationality" = CDT (maximize EU conditional on independent variables). To get them to Superrationality, they must accept that their decision algorithm is a *common cause* or a *logical constraint* linking the outcomes, without causal contact.

  3.  **Evaluate the Carrying Example:**
      *   *User's Instinct:* One-shot PD, no communication, no causal influence.
      *   *Verdict:* This is the correct example. It is the canonical test case.
      *   *Why exclude Iterated/Reputation:* Iteration introduces causal leverage (future punishment/reward). Reputation introduces third-party observers. Tit-for-tat is a strategy *within* CDT/Evolutionary Game Theory. Superrationality is about the *logic of the single decision*. If iteration is allowed, CDT agents cooperate. Superrationality claims CDT agents *should* cooperate even in the one-shot case if they recognize the symmetry of reasoning. Including iteration muddies the water by providing a causal pathway for cooperation, which defeats the purpose of showing an *acausal* pathway.

  4.  **Sequence and Dependency Structure:**
      *   *Step 1: Establish the CDT Baseline.* Define the PD and the standard rational choice (Defect). Make the "fixed opponent" assumption explicit.
      *   *Step 2: Introduce Symmetry.* Both agents are "rational" in the same sense. They face the same problem.
      *   *Step 3: The Logical Link.* If the problem and the reasoning are identical, the output must be identical. This is the pivot.
      *   *Step 4: Recalculate EU.* Now, the choice isn't between (C, D) and (D, D) holding opponent fixed. It's between (C, C) and (D, D).
      *   *Step 5: Introduce the "Source Code" analogy.* This clarifies *why* the outputs link without causality.
      *   *Step 6: Generalize beyond Identity.* Address the "almost identical" worry.

  5.  **Addressing Misconceptions (Pre-emptive Strikes):**
      *   *Golden Rule/Kant:* Head this off at Step 2. Emphasize this is about *prediction/logic*, not morality.
      *   *Same Person/Telepathy:* Head this off at Step 3. Emphasize physical separation but logical identity.
      *   *Descriptive vs. Normative:* Head this off at Step 1. Frame as "What *should* a rational agent do?"
      *   *Evidential Reasoning (EDT):* This is tricky. Superrationality is often conflated with EDT. Need to distinguish "My action is evidence of theirs" (EDT) from "My reasoning *determines* theirs" (Superrationality/Logical Decision Theory). Head off at Step 3/5.
      *   *Exact Identity:* Head off at Step 6.

  6.  **Integrating the "Source Code" and "Deterministic Procedure" Ideas:**
      *   *Idea 1 (Source Code/Proof):* This is easier to grasp. It's concrete. "I can see your algorithm."
      *   *Idea 2 (Same Procedure/No Inspection):* This is the harder, deeper point (Hofstadter's original intuition).
      *   *Order:* Introduce Source Code *first* as a scaffold. It makes the logical dependency tangible. Then remove the inspection requirement to reveal the core superrational claim (symmetry of reasoning).
      *   *Cut:* Do not dive into formal logic (Gödel, Löb) or specific programming languages. Keep it conceptual.

  7.  **Drafting the Plan (Iterative Refinement):**

      *   *Introduction:* Set the stage. One-shot PD.
      *   *Phase 1: The CDT Trap.* Get them to say "Defect." Lock in the assumption: "My choice doesn't change theirs."
      *   *Phase 2: The Symmetry Premise.* "We are both rational agents facing the same math."
      *   *Phase 3: The Logical Constraint.* "If I choose C, a rational copy must choose C." *Crucial moment.*
      *   *Phase 4: The Source Code Scaffold.* Use the "Program Equilibrium" idea to make Phase 3 concrete.
      *   *Phase 5: Removing the Scaffold.* What if we can't see the code, but know we are similar?
      *   *Phase 6: Misconception Checks.* Weave these into the phases.
      *   *Conclusion:* The Final Question.

  8.  **Refining the "Final Question":**
      *   Needs to distinguish "Cooperate because it's nice/outcomes are better" vs. "Cooperate because my reasoning dictates the other's."
      *   *Idea:* Ask about a scenario where cooperation leads to a *worse* outcome if the other defects, but the logic still holds? No, that's too complex.
      *   *Idea:* Ask about a scenario where the agents are *not* symmetric. If asymmetry breaks the logic, they understand the logic.
      *   *Better Idea:* Ask about the *counterfactual*. "If you could pre-commit, would you?" No.
      *   *Best Idea:* A variation where the payoff structure makes (C,C) worse than (D,D) but the logic of symmetry still applies? No, that breaks PD.
      *   *Selected Approach:* Ask about the *mechanism of influence*. "If you defect, does the other person *physically* change their mind?" If they say yes, they missed the point (causal vs. logical). If they say "No, but my decision reveals what the algorithm outputs," they get it.
      *   *Wait, the prompt asks for a question distinguishing reasoning vs. outcomes.*
      *   *Question:* "Suppose you discover that your partner is rational but uses a different tie-breaking rule than you (e.g., they flip a coin on symmetry, you don't). Do you still cooperate?" This tests if they rely on *guaranteed symmetry* or just *hope for good outcomes*.
      *   *Actually, let's look at the "Reasoning vs. Outcomes" distinction.* Someone who just learned "cooperate" thinks cooperation is the *goal*. Someone who understands knows cooperation is the *consequence of the logical link*.
      *   *Final Question Candidate:* "If you could magically ensure the other player Cooperates regardless of your choice, would you Defect?" (CDT says Yes, Superrational says No/Question is incoherent).
      *   *Better:* "Does your decision *cause* the other to cooperate, or does it *select* which logical world you inhabit?"
      *   *Let's go with the Asymmetry Test:* "If you know the other player is rational but *irrational about symmetry* (they think CDT is correct), do you cooperate?" Superrationality relies on the *commonality of the reasoning*. If the reasoning differs, the link breaks. This tests if they understand the *source* of the cooperation (shared algorithm) vs. the *result* (mutual cooperation).

  9.  **Final Review against Constraints:**
      *   Dependency structure clear? Yes.
      *   Single example? Yes (One-shot PD).
      *   Why no iteration? Explained.
      *   Misconception map? Included with timing.
      *   Source code vs. deterministic procedure order? Source code first (scaffold), then remove.
      *   Final question? Included.

  10. **Tone:** Professional, pedagogical, precise. Acknowledge the user's expertise.

  *(Self-Correction during drafting)*: I need to be careful distinguishing Superrationality (Hofstadter) from Evidential Decision Theory (EDT) and Functional Decision Theory (FDT). The prompt mentions "comfortable with expected-utility talk." I should avoid getting bogged down in the EDT vs. CDT war unless it serves the specific goal of Superrationality. The prompt specifically asks to head off the "collapses into ordinary evidential reasoning" misconception. I need to make sure the "Source Code" section does the heavy lifting there. Evidential reasoning says "My C is *evidence* of their C." Superrationality says "My C *implies* their C because we run the same function." The distinction is subtle but vital. I will emphasize the *function* aspect.

  Let's refine the "Final Question." The goal is to distinguish "Reasoning" from "Outcomes."
  If they think it's about outcomes, they will cooperate whenever (C,C) is best.
  If they think it's about reasoning, they will cooperate only when the *logical link* holds.
  So, the question must break the link while keeping the outcome desirable.
  *Scenario:* You are superrational. The other player is a "Cooperate-Bot" (always cooperates). Do you cooperate?
  *CDT:* Defect (maximize utility).
  *Outcome-focused Superrational mimic:* Cooperate (to get C,C).
  *True Superrational:* Defect (My choice doesn't logically determine a fixed bot).
  *Wait, Hofstadter might say Cooperate?* No, superrationality relies on the *other* being superrational.
  *Better Scenario:* You are playing against a copy of yourself, but the payoffs are asymmetric. (You get more for D,C than they do).
  *Actually, the prompt asks for a question to distinguish "claim about reasoning" vs "claim about outcomes".*
  *Question:* "If you could press a button that forces the other player to Cooperate, but pressing it counts as your 'Defect' move, do you press it?"
  *If they say Yes:* They care about outcomes (C,C).
  *If they say No/It's incoherent:* They understand the reasoning constraint (The choice *is* the output of the algorithm).
  *Let's try:* "Does superrationality recommend Cooperation if you know the other player is a CDT agent who will Defect?"
  *Correct Answer:* No. (Because the logical link is broken).
  *Incorrect Answer (Outcome learner):* Yes (Because C,C is better, or they think it's a moral rule).
  *This works.* It tests the dependency on the *other's reasoning type*, not just the payoff matrix.

  Okay, ready to write.
answer: |-
  Here is a teaching plan designed to construct the concept of superrationality from the ground up, preventing the specific conceptual collapses you identified.

  ### I. The Carrying Example: The Sanitized One-Shot Prisoner's Dilemma

  **Verdict:** Your instinct is correct. The **One-Shot Prisoner's Dilemma (PD)** is the necessary and sufficient carrier. Do not change it.

  **What the example must contain:**
  1.  **Strict Symmetry:** The payoff matrix is identical for both agents.
  2.  **Strict Isolation:** No communication, no causal influence, no reputation, no future interaction.
  3.  **Common Knowledge of Rationality:** Both agents know the other is rational, knows they are rational, etc.
  4.  **Common Knowledge of the Situation:** Both agents see the same matrix and know the isolation conditions hold.

  **What must be purged (and why):**
  *   **Iteration/Repetition:** You must explicitly ban this at the start. If iteration is allowed, Causal Decision Theory (CDT) *already* recommends cooperation (via shadow of the future). Superrationality is the claim that cooperation is rational *even when CDT says defect*. Allowing iteration gives the audience a causal crutch (tit-for-tat) that allows them to ignore the logical link you are trying to build.
  *   **Communication/Signaling:** This introduces causal channels. Superrationality is about *acausal* coordination.
  *   **Psychological details:** Do not describe the agents as "friends" or "members of a group." This invites the "Golden Rule" misconception. They are cold reasoning engines.

  ---

  ### II. The Dependency Structure (Sequence of Instruction)

  You cannot state the central claim ("You should cooperate") until the audience has accepted a specific view of what a "decision" is. The sequence must force them to abandon the "fixed opponent" assumption *before* you ask them to calculate utility.

  **Phase 1: Lock the CDT Baseline (The "Trap")**
  *   **Action:** Present the PD. Ask for the rational move.
  *   **Goal:** Elicit the standard CDT response: "Defect."
  *   **Crucial Step:** Make them articulate *why*. They will say: "Because regardless of what they do, I do better by defecting."
  *   **Commitment:** Force them to write down the assumption: *"My choice cannot causally influence their choice."*
  *   **Why here:** You must make the "fixed opponent" reflex explicit so you can dismantle it later. If you don't lock this in, they will slide back into it unconsciously.

  **Phase 2: Introduce the Symmetry of Reasoning (The "Pivot")**
  *   **Action:** Remind them of the "Common Knowledge of Rationality."
  *   **Claim:** "You are facing a mirror of your own reasoning process. You are both solving the exact same math problem."
  *   **Goal:** Shift the focus from *actions* to *algorithms*.
  *   **Why here:** This heads off the "Telepathy" misconception. It's not that minds are connected; it's that the *logic* is identical.

  **Phase 3: The Logical Constraint (The "Mechanism")**
  *   **Action:** Argue that if the input (the problem) and the function (rationality) are identical, the output (the decision) must be identical.
  *   **Claim:** "It is logically impossible for two identical rational processes to output different decisions on the same data."
  *   **Goal:** Replace "My action is independent" with "My action is logically correlated with theirs."
  *   **Why here:** This is the moment superrationality is born. It heads off the "Golden Rule" misconception. This isn't morality; it's logic. It also heads off the "Descriptive vs. Normative" error. We aren't predicting what they *will* do; we are deriving what a rational agent *must* do.

  **Phase 4: The Source Code Scaffold (Idea 1)**
  *   **Action:** Introduce the "Program Equilibrium" analogy. Imagine you can inspect the other's source code.
  *   **Claim:** "If I can prove their code outputs 'Cooperate' if and only if mine does, I can treat their output as a function of mine."
  *   **Goal:** Make the logical link concrete.
  *   **Why here:** This addresses the "Evidential Reasoning" misconception. Standard evidential reasoning says "My C is *evidence* of their C." The Source Code model says "My C *logically entails* their C because we run the same function." The former is correlation; the latter is derivation.
  *   **Instruction:** Use this to show *why* the EU calculation changes. You are no longer comparing (C vs D) holding Opponent fixed. You are comparing (C,C vs D,D).

  **Phase 5: Remove the Scaffold (Idea 2)**
  *   **Action:** Remove the ability to inspect code. Rely only on the knowledge that "We are both rational agents facing this problem."
  *   **Claim:** "Even without inspection, if we are both superrational, we must assume our reasoning processes are functionally equivalent."
  *   **Goal:** Generalize from "identical code" to "identical rationality."
  *   **Why here:** This addresses the "Exactly Identical Agents" misconception. They don't need to be twins; they just need to be running the same *decision procedure* (Superrationality).
  *   **Cut:** Do not introduce formal logic (Löb's Theorem, Gödel sentences). It creates a barrier. Stick to the functional equivalence argument.

  **Phase 6: Recalculate Utility (The "Payoff")**
  *   **Action:** Now ask them to maximize Expected Utility.
  *   **Result:** Since the choice is effectively between (Cooperate, Cooperate) and (Defect, Defect), EU maximization dictates Cooperation.
  *   **Goal:** Show that Superrationality *is* EU maximization, just under a different constraint structure.

  ---

  ### III. The Misconception Map

  Here is where each error typically forms and how to kill it in the sequence above.

  | Misconception | Where it forms | How to head it off (Pre-emptive Strike) |
  | :--- | :--- | :--- |
  | **"It's just the Golden Rule / Kant"** | **Phase 2.** When you mention symmetry, audiences reach for moral heuristics. | **Strike in Phase 2:** Explicitly state: "This is not about fairness or morality. If the payoffs were reversed so that (Defect, Defect) paid more than (Cooperate, Cooperate), a superrational agent would Defect. It is a claim about *logic*, not ethics." |
  | **"They must be the same person / Telepathy"** | **Phase 3.** When you claim their decisions must match. | **Strike in Phase 3:** Emphasize physical isolation. "They are light-years apart. There is no signal. The link is not causal; it is *logical*. 2+2=4 here and 2+2=4 on Mars not because of telepathy, but because the math is the same." |
  | **"It's descriptive (what people do)"** | **Phase 1.** If you frame it as "How do people play?" | **Strike in Phase 1:** Frame the session as Normative Decision Theory. "We are not asking what humans *do* (psychology); we are asking what a rational agent *should* do (normative)." |
  | **"It's just Evidential Decision Theory (EDT)"** | **Phase 4.** When you correlate actions. | **Strike in Phase 4:** Distinguish *evidence* from *entailment*. "EDT says 'My C makes it *likely* they C.' Superrationality says 'My C *implies* they C because we are instances of the same algorithm.' One is statistical; the other is computational." |
  | **"Breaks if agents aren't identical"** | **Phase 5.** When you remove the source code inspection. | **Strike in Phase 5:** Clarify "Identity." "They don't need identical DNA. They need identical *decision procedures*. If you both accept Superrationality as the correct normative theory, you are functionally identical for this problem." |

  ---

  ### IV. Integrating the Two Advanced Ideas

  **Order of Operations:**
  1.  **Introduce Source Code Inspection First.**
      *   *Why:* It is conceptually easier. It provides a concrete mechanism for "logical dependency." It allows the audience to visualize *why* one agent's output depends on the other's without causality (because one program simulates the other).
      *   *Role:* It acts as a scaffold. It makes the abstract logical link tangible.
  2.  **Transition to Deterministic Procedure (No Inspection).**
      *   *Why:* This is the actual claim of Superrationality. Hofstadter's point was that you don't need to swap USB drives; you just need to trust that rationality is a unique attractor.
      *   *Role:* This removes the crutch. It forces the audience to accept that *reasoning itself* is the common cause.

  **What to Cut:**
  *   **Formal Proofs:** Do not write out the code. Do not discuss `if (simulate(other) == Cooperate)`. This leads to infinite regress worries (Halting Problem).
  *   **Statement to make:** "We are glossing over the formal proof requirements. Assume for this session that 'Rationality' is a well-defined function that yields a unique output for this problem. The philosophical heavy lifting is accepting that *you* and *they* are running that same function."

  ---

  ### V. The Final Assessment Question

  You need a question that forces them to choose between "Cooperate because it yields good outcomes" (Outcome-focused) and "Cooperate because my reasoning links to theirs" (Reasoning-focused).

  **The Question:**
  > "Suppose you are a superrational agent. You are playing the One-Shot PD. You have certainty that your opponent is a **Causal Decision Theorist** (they will definitely Defect, regardless of your choice). Do you Cooperate or Defect?"

  **The Diagnostic:**
  *   **The "Rote Learner" (Outcome-focused):** Will say **Cooperate**.
      *   *Reasoning:* "Superrationality means Cooperate. (C,C) is better than (D,D). I want the good outcome."
      *   *Error:* They missed that the logical link is broken. If the other is a CDT agent, their action is *not* a function of your reasoning. You are facing a fixed "Defect."
  *   **The "Grasper" (Reasoning-focused):** Will say **Defect**.
      *   *Reasoning:* "Superrationality relies on the symmetry of reasoning. If the opponent is a CDT agent, they are not running the same algorithm. My choice does not logically determine theirs. Therefore, I face a fixed opponent. Standard EU maximization applies. I Defect."
      *   *Success:* They understand that Superrationality is a claim about the *structure of reasoning*, not a blanket command to Cooperate.

  **Why this works:** It isolates the *mechanism* of superrationality (shared algorithm) from the *result* (mutual cooperation). If they only learned the result, they fail. If they understood the mechanism, they recognize the mechanism is absent in this specific case.
