  2.  **Deconstruct Fitch's Paradox (Briefly, for context):**
      *   Premise 1 (Knowability): $\forall p (p \rightarrow \Diamond K p)$ (All truths are possibly known).
      *   Premise 2 (Factivity): $K p \rightarrow p$.
      *   Premise 3 (Distribution): $K(p \land q) \rightarrow (K p \land K q)$.
      *   Premise 4 (Non-omniscience): $\exists p (p \land \neg K p)$ (There is some unknown truth).
      *   Derivation: Substitute $(p \land \neg K p)$ into Premise 1. Derive contradiction.
      *   Conclusion: $\neg \exists p (p \land \neg K p)$ (All truths are known).
      *   *Problem:* Antirealism wants Premise 1 but rejects the Conclusion.

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: Preserve Antirealist Intuition.* The core motivation is that truth isn't evidence-transcendent. If $p$ is true, there *must* be a possible state of information where $p$ is verified.
      *   *Requirement 2: Avoid Omniscience.* The theory must allow for $p \land \neg K p$ to be true *now* without implying it's *necessarily* unknown. It must distinguish "currently unknown" from "unknowable."
      *   *Requirement 3: Handle Moorean Sentences.* The paradox turns on $p \land \neg K p$. A solution must explain why this sentence behaves oddly without saying it's not a truth.
      *   *Requirement 4: Non-Ad Hoc Restrictions.* If we restrict the Knowability Principle (KP), it can't just be "except the ones that break the proof." It needs a principled reason.
      *   *Requirement 5: Logical Stability.* The solution shouldn't break standard logic (unless there's a damn good reason, like intuitionism, but the user asks about that specifically).

