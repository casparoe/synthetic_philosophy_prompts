      *   *Moorean Sentences:* Why is "p but I don't know p" absurd to assert but potentially true? The spec needs to separate *assertability* from *truth conditions*.
      *   *Intuitionistic Logic:* Does it help? Williamson says no, not really. It blocks the derivation of "All truths are known" but leaves "It's not the case that there are unknown truths," which is still problematic for the antirealist who wants to affirm there *are* unknown truths.
      *   *Restriction to Non-Epistemic Truths:* (The friend's suggestion). This is the "Syntactic Restriction." Does it fail a requirement? Yes, usually Requirement 4 (Principled Restriction). Why exclude epistemic truths from the concept of truth itself?

  5.  **Identifying the Incompatibility (The "Impossible Trinity"):**
      *   This is the crux. What cannot hold together?
      *   1. Classical Logic (specifically, the substitution rule and negation rules used in Fitch's proof).
