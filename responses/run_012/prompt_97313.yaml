      *   *Refining the "Impossible Set":*
          1.  **Universal Knowability:** Every truth is possibly known.
          2.  **Non-Omniscience:** Some truths are not actually known.
          3.  **Logical Closure:** The logic allows substitution of arbitrary formulas (including epistemic ones) into the Knowability Principle.
