      *   **Goal:** Define the requirements for a successful account of knowability that preserves antirealism (truth = idealized knowability) without collapsing into omniscience (all truths *are* known).
      *   **Specific Constraints:**
          *   Provide a requirements list.
          *   Address specific cases: "truths nobody will ever know," the Moorean sentence ("p but I don't know p").
          *   Address specific distinctions: knowable-in-principle vs. now, unknown vs. unknowable, principled restriction vs. ad hoc patch.
