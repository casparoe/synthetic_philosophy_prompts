  3.  **Address the Specific Puzzles:**

      *   **Puzzle 1: Rigidity.**
          *   Is it innocent? No. It's a substantive constraint. It assumes the *relevance* of $E$ to $H$ doesn't change, only the probability of $E$ changes. If the *reason* for the probability shift in $E$ also impacts $H$ directly (bypassing $E$), Rigidity fails.
