answer: |-
  **1. The Contrastive Thing**
  *   **Requirement:** Explicit Foil Specification.
  *   **Case:** The same facts explain why the mill shut *rather than* prospered, but not why it shut *rather than* burned. The explanation must state what outcome is being ruled out.
  *   **Status:** Non-negotiable.

  **2. Absences**
  *   **Requirement:** Counterfactual Validity.
  *   **Case:** A missing letter can cause a battle loss. The account must handle negative facts (things that didn't happen) without treating them as mystical forces.
  *   **Status:** Non-negotiable.

  **3. Scale**
  *   **Requirement:** Multi-Level Consistency.
  *   **Case:** The general's decision and the empire's fall must not contradict. The micro-story cannot make the macro-story impossible, even if they use different vocabularies.
  *   **Status:** Preference (Reductionists vs. Emergentists).

  **4. Hindsight**
  *   **Requirement:** Contingency Preservation.
  *   **Case:** A shaped story feels inevitable; a real explanation must show where the path could have branched differently.
  *   **Status:** Preference (Determinists vs. Contingency theorists).

  **5. Rival Stories**
  *   **Requirement:** Compatibility Mapping.
  *   **Case:** Two narratives from same evidence must be shown as either complementary (different foils) or contradictory (one false).
  *   **Status:** Preference (Pluralists vs. Singular Truth camps).

  **6. The Law Thing**
  *   **Requirement:** Contextual Mechanism.
  *   **Case:** History has no universal laws like physics. The account must rely on specific mechanisms operative in that context, not general generalizations.
  *   **Status:** Preference (Nomothetic vs. Idiographic).

  **7. The Deduction Worry**
  *   **Requirement:** Causal Asymmetry.
  *   **Case:** You can deduce the pole from the shadow, but the shadow doesn't explain the pole. The account must enforce directionality (cause → effect).
  *   **Status:** Non-negotiable.

  **8. Order**
  *   **Requirement:** Dependency Tracking.
  *   **Case:** Narrative order (suspense) often reverses logical order (dependency). Bad order hides the causal chain behind pacing.
  *   **Status:** Preference (Storytellers vs. Analysts).

  **9. Significance**
  *   **Requirement:** Difference-Making Criterion.
  *   **Case:** A detail is explanatory only if removing it changes the outcome. Otherwise, it is atmosphere.
  *   **Status:** Non-negotiable.

  ***

  **Incompatible Pair**
  **Order** (Narrative Flow) and **Deduction** (Causal Transparency).
  You cannot maximize both. Narrative flow often requires withholding causal links to create suspense (packaging). Causal transparency requires exposing all dependency links immediately (logic). If you satisfy the demand for a gripping story, you often obscure the explanatory chain. If you satisfy the demand for clear explanation, you often kill the narrative momentum. You must choose which serves the specific passage.

  **Non-negotiable vs. Preference**
  *   **Non-negotiable:** Contrast, Absences, Deduction, Significance. (These define *causality*. Without them, you have description, not explanation.)
  *   **Preference:** Scale, Hindsight, Rival Stories, Law Thing, Order. (These define *method* or *style*. Different schools of history prioritize these differently.)

  ***

  **Covering-Law vs. Narrative**
  The covering-law picture fails Absences and Significance (it demands universal rules where none exist). The narrative-is-explanation picture fails Deduction and Order (it confuses emotional resolution with causal logic).

  \answer{Significance}
