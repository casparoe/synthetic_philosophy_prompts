answer: |-
  Good evening. For those of you who don't know me, I'm one of Ruth's former students. For those of you who do know me… yes, I still kern my wedding invitations manually. You're welcome.

  We are here to celebrate forty years of Ruth's teaching. Forty years of asking a question that sounds simple but isn't: What makes an 'a' an 'a'?

  If you asked most people, they'd say, "Well, it's the shape. It's the circle with the stick." But Ruth would wave that away. She'd show you a blackletter 'a' from the 1400s, a geometric 'a' from a modern logo, and a wobbly 'a' written in crayon. She'd ask, "What feature do these share that an 'o' doesn't?" There isn't one. There is no single line, no curve, no skeleton that every 'a' must have.

  Ruth's thesis—and she's cheerfully dogmatic about this—is that 'a-ness' isn't a point. It's a neighborhood. It's a territory. As long as a shape stays within certain boundaries of tolerance, as long as the community of readers agrees to call it an 'a', it belongs. Push it too far toward an 'o', and it moves out. Push it toward a 'd', and it's evicted. But inside that neighborhood? There is room to wander. There is room to be tall, short, fat, thin, single-story, or double-story.

  I realized recently that this wasn't just how she taught us to draw letters. It was how she taught us to be designers. And, I suspect, how she loves people.

  She never handed us a template. She never said, "This is the correct way to be a typographer." She handed us a map of the territory and trusted us to walk around in it. She gave us the boundaries of craft—the discipline, the history, the respect for the reader—and then she gave us the freedom to fill the space however we needed to. She knew that if she tried to force us into a single shape, we'd break. But if she let us find our own place in the neighborhood, we'd stay.

  And looking around this room, I see that same logic everywhere.

  Designers, look at your work. It's all different. Some of you are rigid grids, some of you are fluid scripts. But you all read as Ruth's students. You belong to the same neighborhood because of a shared tolerance, a shared agreement on what matters, not because you look the same.

  And to Ruth's family—her husband, her sisters, her grandkids—you might not know what a counterform is, but you know this truth better than anyone. She doesn't love you because you fit a mold. She loves you because you're in the neighborhood.

  She taught us that boundaries are flexible. Which is why, when her grandkids draw an 'a' that looks like a tadpole, she doesn't correct them. She hangs it on the fridge. She knows that as long as it doesn't look too much like a '2', it's staying in the neighborhood.

  Ruth, you spent forty years teaching us that there is no essence to hold onto, only relationships to maintain. You taught us that belonging isn't about being identical; it's about being recognized. You gave us a space large enough to grow into, and strict enough to hold us together.

  So, I'd like to propose a toast.

  To Ruth. May your retirement be spacious. May your boundaries be kind. And may you never have to decide which 'a' is the real one again.

  To Ruth.

  ***

  **Potential Landmines (Lines Ruth Might Contradict)**

  1.  **"What makes an 'a' an 'a'?"**
      *   *Why:* Ruth argues nothing "makes" it an 'a'; it is simply accepted as one. The phrasing implies a causal mechanism or defining property exists to be found.
      *   *Her likely correction:* "Nothing makes it an 'a'. We just agree to call it that."

  2.  **"As long as a shape stays within certain boundaries of tolerance…"**
      *   *Why:* Implies the boundaries are fixed or objective. Ruth views the boundaries as fluid and socially negotiated, shifting over time and context.
      *   *Her likely correction:* "The boundaries move depending on who's looking and where."

  3.  **"She handed us a map of the territory…"**
      *   *Why:* Suggests she possessed a definitive guide (a map) to give. Her philosophy suggests the territory is created by walking it, not mapped beforehand.
      *   *Her likely correction:* "We drew the map together by walking."

  4.  **"You belong to the same neighborhood… not because you look the same."**
      *   *Why:* Risks implying "belonging" is a stable state. Ruth might argue belonging is a continuous act of recognition, not a status you hold.
      *   *Her likely correction:* "You belong only as long as everyone else keeps reading you that way."

  5.  **"There is no essence to hold onto, only relationships to maintain."**
      *   *Why:* This is the biggest trap. By stating "There is no essence" as a definitive truth, I am essentializing her anti-essentialism. I am claiming the "true nature" of things is that they have no true nature.
      *   *Her likely correction:* "Even 'no essence' is just a useful way to talk, not a fact about the universe."
