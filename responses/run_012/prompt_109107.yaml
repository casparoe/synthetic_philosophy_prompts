  # JOINT STATEMENT ON THE PRISONER'S DILEMMA AND RATIONAL CHOICE

  **Parties:** Camp 1 (Causal/Act-Based) and Camp 2 (Evidential/Decision-Based)
  **Date:** [Current Date]
  **Status:** Statement of Agreed Claims and Defined Disagreements

  ## 1. AGREED CLAIMS
  1.  The standard Prisoner's Dilemma payoff matrix ranks outcomes such that Defect dominates Cooperate for each individual agent assuming causal independence.
  2.  In the unique Nash equilibrium of the one-shot game, both players defect.
  3.  In the iterated game with sufficient horizon and observable history, cooperation is sustainable via reciprocal strategies (e.g., Tit-for-Tat).
  4.  Empirical data shows human subjects cooperate in one-shot anonymous settings at rates significantly above zero.
  5.  Evolutionary dynamics in well-mixed populations favor Defect; cooperation requires structure (assortment, repetition, or partner choice).
  6.  The term "one-shot" is currently functioning ambiguously in our discourse, conflating three distinct conditions: (i) no shadow of the future, (ii) no causal channel between choices, and (iii) no shared reasoning process.
  7.  Neither side claims the other is arguing in bad faith; the dispute is normative and definitional, not merely empirical.

  ## 2. DISAGREEMENTS TABLE

  | Disagreement | Camp 1's Own Wording | Camp 2's Own Wording | Substantive, Verbal, or Empirical | What Actually Turns on It |
  | :--- | :--- | :--- | :--- | :--- |
  | **Unit of Rationality** | Rational choice attaches to **acts**. I control only my move. | Rational choice attaches to **decisions**. I control the output of the reasoning process. | Substantive (Normative) | Whether cooperation is classified as "rational" or "error/preference" in the one-shot case. |
  | **Relevance of Correlation** | Logical correlation without causation is irrelevant to expected utility maximization. | Logical correlation is evidentially relevant; my choice updates the probability of the twin's choice. | Substantive (Normative) | The prescribed action in the "Twins" and "Shared Cause" cases. |
  | **Definition of 'One-Shot'** | "One-shot" means no causal leverage (ii). Shared reasoning (iii) is possible but irrelevant. | "One-shot" must exclude shared reasoning (iii) to guarantee defection. If (iii) is present, it is not a standard PD. | Verbal + Substantive | Whether the "Twins" case counts as a Prisoner's Dilemma or a different game entirely. |
  | **Explanation of Human Cooperation** | Cooperation is driven by social preferences, confusion, or heuristics calibrated for repeated life. | Cooperation is driven by team reasoning or evidential logic recognizing correlated choices. | Empirical | How we model human agents in economic theory and policy design. |

  ## 3. CRUXES AND TESTS

  ### Crux 1: The Twins Case
  **Scenario:** One-shot, anonymous, no communication. Players know they are twins/clones running identical reasoning on identical data. No causal link exists between choices.
  *   **Camp 1 Prediction:** **Defect.** My act cannot causally change yours. Dominance reasoning holds.
  *   **Camp 2 Prediction:** **Cooperate.** Our choices are logically correlated. Choosing Cooperate evidences that the twin chooses Cooperate.
  *   **Shared Test:** Survey of rational agents who fully understand the setup and have no social preferences toward the twin.
  *   **Stake:** Validity of Causal Decision Theory vs. Evidential/Functional Decision Theory.

  ### Crux 2: The Shared Cause Case
  **Scenario:** One-shot, anonymous. Players exposed to hidden common influence (priming/coin flip) correlating choices without causal link between them.
  *   **Camp 1 Prediction:** **Defect.** Correlation is not causation. I cannot influence the outcome by choosing.
  *   **Camp 2 Prediction:** **Cooperate.** The correlation makes Cooperate the higher expected utility choice evidentially.
  *   **Shared Test:** Experiment where correlation is induced externally (e.g., same room, same prompt) but causal isolation is guaranteed. Measure choice vs. belief in correlation.
  *   **Stake:** Whether evidential relevance alone justifies action.

  ### Crux 3: The Iterated Mechanism
  **Scenario:** Repeated game with observable actions.
  *   **Camp 1 Prediction:** Cooperation is rational because my move **causally influences** future moves (reciprocity).
  *   **Camp 2 Prediction:** Agreement that causal influence exists here, but maintains this is distinct from the one-shot logical correlation mechanism.
  *   **Shared Test:** Compare cooperation rates in Iterated PD vs. One-Shot PD with explicit "Shared Reasoning" prompts.
  *   **Stake:** Whether iterated cooperation validates Camp 1's causal model exclusively or allows Camp 2's correlation model.

  ### Crux 4: Separating Team Reasoning from Social Preferences
  **Question:** Is there a design that separates 'team reasoning' from 'social preferences' from 'psychology misfiring'?
  *   **Consensus:** **No definitive design exists yet.** Current designs (e.g., framing effects, minimal group paradigms) confound altruism with logical correlation.
  *   **Proposed Test:** Incentivized experiment where cooperation benefits the "team" payoff but reduces individual payoff even if the other cooperates, vs. standard PD. If agents cooperate only when symmetry is salient, it suggests team reasoning. If they cooperate whenever the other benefits, it suggests social preferences.
  *   **Camp 1 Condition:** If cooperation persists when social preferences are neutralized and causal isolation is confirmed, Camp 1 must reconsider the "confusion" hypothesis.
  *   **Camp 2 Condition:** If agents defect when logical correlation is made salient but causal leverage is absent, Camp 2 must reconsider the "rationality" of evidential reasoning.

  ## 4. FALSIFICATION CONDITIONS

  **Camp 1 (Causal/Act-Based):**
  *   **Evidence Against:** Robust data showing agents cooperate in one-shot anonymous PDs even when (a) social preferences are controlled for, (b) confusion is ruled out via comprehension checks, and (c) causal isolation is guaranteed.
  *   **What Would Move Us:** A formal proof that evidential reasoning yields higher real-world payouts than causal reasoning in non-Newcomb-like environments, or empirical demonstration that "rational" agents consistently win more by cooperating in standard one-shot setups.

  **Camp 2 (Evidential/Decision-Based):**
  *   **Evidence Against:** Robust data showing agents defect in "Twins" cases even when they fully understand the logical correlation and have no fear of punishment.
  *   **What Would Move Us:** A formal proof that evidential reasoning leads to exploitable losses (e.g., in betting markets) compared to causal reasoning, or demonstration that "team reasoning" is psychologically indistinguishable from altruism.

  ## 5. VERBAL DISPUTES IDENTIFIED
  1.  **"Rational":** Camp 1 uses it to mean "causally optimal." Camp 2 uses it to mean "outcome optimal given all information including logical correlations."
  2.  **"One-Shot":** Camp 1 defines it by causal isolation. Camp 2 defines it by logical independence.
  3.  **"Act" vs. "Decision":** Camp 1 sees the act as the locus of control. Camp 2 sees the algorithm/decision function as the locus of control.

  ## 6. OPEN QUESTIONS
  1.  Can a experimental design be constructed that perfectly isolates logical correlation from social preference?
  2.  Does evolutionary stability favor causal or evidential reasoning strategies in mixed populations?
  3.  Is the "Shared Cause" case normatively distinct from the "Twins" case, or do they stand or fall together?

