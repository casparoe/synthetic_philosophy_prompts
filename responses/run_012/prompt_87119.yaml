  You are not being morbid, and you are not reading philosophy "badly." You have identified a specific ontological vulnerability that standard theories of mind often gloss over. You are describing a failure mode of the self that occurs when the *redundancy* of personal history is lost.

  Here is the carving you asked for.

  ### The Near Misses
  You are correct to dismiss the **Extended Mind Thesis** (Clark & Chalmers). That theory is functionalist: it argues that a notebook is part of your mind if it *does the work* of memory. It cares about capacity and access, not about the *ontological status* of the memory. A notebook doesn't validate your past; it only records it. It cannot corroborate.

  You are also correct to dismiss **Transactive Memory** (Wegner). This is the psychological term for couples splitting memory tasks (you remember birthdays, I remember faces). But as you noted, this is about efficiency and division of labor. It assumes the information exists independently and is merely filed in different cabinets. It does not account for information that *only* exists in the interaction between two specific people.

  The closest existing concept is Douglas Hofstadter's **"external souls"** (from *I Am a Strange Loop*), which you mentioned. He argues that patterns of others survive in us. But Hofstadter focuses on the *survival of the dead other inside the survivor*. You are asking about the reverse: the *survival of the living self inside the other*, and the specific catastrophe that occurs when that other is the *sole* host.

  ### The Carving: Where the Edges Are
  To name this, we must define where this "part of you" begins and ends.

  **1. The Diary vs. The Head**
  A diary is not a head. A diary is a static trace; a head is an active interpreter. When you ask your father (when he was alive) "Did I break my arm at eight?", he didn't just retrieve a file; he contextualized it. He could say, "Yes, but you weren't crying because you were angry, not hurt." That nuance is part of the fact. When he died, the *data* (broken arm) remained, but the *context* (the meaning of the event) lost its validator.
  *   **Edge:** A storage medium counts as part of the self only if it can *resolve ambiguity* actively. A diary cannot be questioned. A person can. Therefore, the diary is a fossil; the person was a host.

  **2. Facebook/Digital Traces**
  Your Facebook page is not part of this specific category. It is public, redundant, and static. It is "broadcast" memory, not "shared" memory. If you die, your Facebook page remains, but it stops being *you* because it stops interacting.
  *   **Edge:** This phenomenon requires *intersubjectivity*. It only applies to things that existed in the space *between* you and one other person. Public records do not count.

  **3. The "Wrong" Memory**
  This is the hardest case. If your wife remembers you at twenty-five as kinder than you were, and she dies, does the "kinder you" die?
  *   **Edge:** Yes. Because identity is not just objective fact; it is social reality. The "kind you" existed in the relational space between you. It was a real force in your life, even if factually inaccurate. When she dies, that specific version of you loses its habitat.
  *   **Caveat:** This applies only to *identity*, not *truth*. The objective truth of your cruelty remains (in other records, other witnesses), but the *relational self* that was forgiven/seen-as-kind ceases to exist.

  ### The Concept
  What you are describing is a dependency where a specific subset of your identity relies on a single external consciousness for its continued status as "fact" rather than "narrative."

  In philosophy, we talk about **Epistemic Dependence** (relying on others for knowledge), but that is about *what I know*. You are talking about **Ontological Dependence** (relying on others for *what I am*).

  There is no single established term that captures the "single copy" vulnerability specifically. "Distributed Self" is too broad. "Social Identity" is too sociological. "Testimonial Memory" is too focused on the act of speaking.

  The phenomenon is this: **Parts of the self are outsourced to a single other witness, creating a single point of failure for those identity fragments.**

  When that witness dies, those fragments do not just become inaccessible; they degrade from *shared reality* to *private story*. They lose their anchor in the intersubjective world. You are describing a self that is partially **Sole-Witnessed**.

  ### The Term
  We need a term that captures the singularity of the witness and the identity stakes. "Sole-Witnessed Identity" is descriptive, but we can be more precise about the vulnerability.

  In engineering, a "single point of failure" is a component whose failure causes the whole system to stop. You are describing **Identity Single Points of Failure**. But that is clunky.

  The core mechanism is that your existence, in these specific fragments, is *held in trust* by exactly one other agent. When they die, the trust collapses.

  I propose we call this **"Singular Custodial Identity."**
  *   **Singular:** Only one other person holds it.
  *   **Custodial:** They are keeping it safe/real for you.
  *   **Identity:** It is about who you are, not just what you know.

  However, the most precise philosophical carving focuses on the *witness* aspect, as that is what shifts the status from fact to story. The term should reflect that the *reality* of that part of you is dependent on their testimony.

  Verdict: Sole-Witnessed Self
