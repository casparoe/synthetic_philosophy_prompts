      *   *History:* If harvest fails, do people starve? Migrate? Revolt? Sell heirlooms? Eat bark? It depends on *social structures*, *politics*, *economy*, *culture*.
      *   *The Distinction:* Nature sets the *parameters* or applies the *shock*, but human society determines the *response*. Determinism claims the response is fixed by the shock.

