      *   **"Cause" (in History):** Historians accept multi-causality. $A + B + C \rightarrow D$. Nature can be $A$.
      *   **"Environmental Determinism" (The Taboo):** This is the crux. In history/social science, this doesn't just mean "nature has an effect." It carries a specific baggage:
