      *   **The Core Puzzle:** The user sees a contradiction in historical writing. Historians say "nature (germs, climate, volcanoes) is an actor/cause," but then immediately warn against "environmental determinism." To a scientist, if $X$ causes $Y$, then $X$ determines $Y$ (to some extent). So why the taboo?
      *   **The Goal:** Disentangle the concepts of "actor," "cause," and "determinism" within the context of historical methodology. Validate the user's intuition (that words are doing different jobs) while explaining the specific historiographical nuances they might be missing due to their scientific training.

  2.  **Deconstruct the Historical Concepts:**
