          *   *Consensus in Literature:* Positive correlation degrades performance but rarely makes it worse than a single voter *unless* the average competence is near 0.5 or correlation is near 1. With $p=0.6$ and $N=100$, it is very robustly $> 0.6$.
          *   *Colleague's View:* "Coin flip once errors correlate." This implies $P(\text{majority}) \approx 0.5$. This is only true if $p \approx 0.5$ or $\rho \approx 1$ *and* the common signal is noisy. But we are given $p=0.6$.
          *   *User's View:* 0.9 credence that Majority > Single.
          *   *My Assessment:* The math strongly supports the User. $P(\text{majority})$ drops from ~1.0 (independent) towards 0.6 (perfect correlation). It rarely crosses below 0.6.

