answer: |-
  ### The Principle of Strongest Individual Claim with Agency Limits

  To capture your verdicts without resorting to a mere list of exceptions, you need a principle that prioritizes the **severity of the individual burden** over the **sum of burdens**, while distinguishing between **harming** and **allowing harm** via existing threats.

  Here is the principle, stated precisely, followed by its implications for your cases and the boundary family.

  **The Principle:**
  > An act is permissible if and only if it does not impose a burden on any individual that is severer than the burden imposed on any individual by the alternative, **unless**:
  >
  > 1.  **Comparability:** The burdens are of comparable severity (e.g., life vs. life), in which case one must minimize the number of individuals bearing the burden.
  > 2.  **Intra-Personal Aggregation:** The burdens fall upon the *same* individual over time, in which case they sum to determine severity.
  > 3.  **Threat Redirection:** The burden imposed is the result of redirecting an *existing* lethal threat toward fewer individuals, rather than creating a new threat or using an individual as a resource.

  ---

  ### Clause Mapping: Which Case Forces Which Clause?

  1.  **The Core Rule (Severity Trumps Numbers):**
      *   *Statement:* You cannot override a severe claim held by one person with the aggregated lesser claims of many.
      *   *Forced by:* **Case 4** (Finger > 1M Headaches) and **Case 3** (Life > 200 Hands).
      *   *Also supports:* **Case 8** (Manuscript > 1M Headaches). This clause confirms that objective loss (the manuscript) counts as a burden comparable to physical pain, and since the author's loss is severer than any single headache-sufferer's loss, the author wins.

  2.  **Comparability (The Tie-Breaker):**
      *   *Statement:* When burdens are equal in severity, numbers decide.
      *   *Forced by:* **Case 1** and **Case 2** (Life vs. Life). Since no single person on the left has a stronger claim than the person on the right, the tie is broken by saving the greater number. This prevents the principle from being silent in symmetric emergencies.

  3.  **Intra-Personal Aggregation (The Identity Clause):**
      *   *Statement:* Burdens sum within a single life but not across different lives.
      *   *Forced by:* The contrast between **Case 4** and **Case 5**. In Case 5, the million hours of headache belong to *one* person, making her total burden severer than the broken finger. In Case 4, they are dispersed, so they do not sum. This clause captures the moral significance of the "separateness of persons."

  4.  **Agency Limits (The Means Constraint):**
      *   *Statement:* You may not directly kill or use an innocent person as a resource to save others, even if the severity is comparable (Life vs. Life).
      *   *Forced by:* **Case 6** (Organs). Without this, the Comparability clause would force you to kill the one to save the five (since Life = Life). This clause creates a protective boundary around bodily integrity that numbers cannot cross.
      *   *Also supports:* **Case 9** (Plague). Despite the high numbers, the carrier is being used as a resource (blood/antitoxin).

  5.  **Threat Redirection (The Trolley Exception):**
      *   *Statement:* It is permissible to redirect an existing threat to fewer people, provided you do not make them a resource.
      *   *Forced by:* **Case 7** (Trolley). This distinguishes Case 7 from Case 6. In Case 7, the threat (the vehicle) exists independently of the one person; you are merely changing its course. In Case 6, the healthy person is not under threat until you create one. This clause saves the verdict in Case 7 without collapsing the constraint in Case 6.

  ---

  ### Implications for the Boundary Family

  You asked about the family of cases where you hold the broken finger fixed and vary the many (individual suffering rising from headache to agony, numbers rising from million to trillion).

  **The Principle's Verdict:**
  The principle draws a **hard wall** at the point of individual comparability.
  *   **Below the Wall:** As long as the individual suffering of the many is *less severe* than the broken finger (e.g., headaches, mild pain, even significant pain that falls short of permanent injury), the numbers **do not count**. It does not matter if it is a trillion people. The single finger-holder's claim is severer than any single headache-sufferer's claim. Inter-personal aggregation is forbidden.
  *   **At the Wall:** Once the individual suffering of the many becomes *comparable* to the broken finger (e.g., each suffers a broken finger, or a wound of equivalent medical severity), the Comparability clause kicks in. You then save the greater number.
  *   **The Transition:** There is no gradual slope where numbers slowly outweigh severity. There is a threshold. Below it, the One wins. At or above it, the Many win.

  **Implication for Astronomical Numbers:**
  If you accept this principle, you must accept that **one broken finger outweighs a trillion headaches.** This is the cost of maintaining the verdict in Case 4. If you feel that a trillion headaches *must* outweigh a finger, you cannot hold this principle; you would need to introduce a "Catastrophe Threshold" that allows aggregation when the total utility loss is massive. However, adding such a threshold would threaten your verdict in Case 3 and Case 8.

