prompt: |-
  A friend of mine has gotten really into an idea he calls the "idealized deliberation" view of what you ought to do, and he summarized it for me like this:

  "The view says your reasons are fixed by what you would want yourself to do if you were fully informed and fully rational. So it threads the needle: normativity stays objective, because there's a fact of the matter about what your ideal self wants, but you don't need any spooky realm of values floating around, since it's all built out of your desires plus information. It's also the only account that gives you an actual test you can use — if you're unsure what to do, go get more information and think harder until your attitudes stop shifting, and that's your answer. And the standard objection, that the ideal version of you might turn out to be a monster, is just confused, because the ideal version is by definition the one whose desires are correct."

  I have a feeling this is mostly the real view with a coupel of things off, but I can't tell where the seams are — I'm inclined to think the "objective without spooky values" bit is right and the "just think harder" bit is off, though I don't trust my instinct. Go through it claim by claim: what a defender of the view would sign off on, what's a harmless simplification, and what's an actual distortion. And does his concluding pitch — that the view buys you objectivity with no spooky values — follow from the parts that are right?

  Give me back a JSON object with these fields: bottom_line (a sentence or two of prose); claims (a list, each with "claim", "status" — one of "accurate", "oversimplified", "distorted" — and "why"); main_distortion; defender_would_say; conclusion_survives (true/false plus one sentence); and what_he_should_have_said.
