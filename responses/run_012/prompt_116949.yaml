answer: |-
  You are not inconsistent. Your intuition is actually more sophisticated than the "tentative principle" you wrote down. Your tentative principle is pure Nozick (Libertarian Entitlement Theory), but your gut reactions import constraints from John Locke (the Proviso) and modern theories of Restorative Justice.

  As a backend engineer, think of your tentative principle as Version 1.0 of a spec. It handles the "happy path" (Chamberlain, Lottery, Landlord) but throws exceptions on edge cases (Wells, Looted Art, Life-saving Drugs).

  Here is the diagnosis of your logic, the refined principle that generates your specific outputs, and the application to your new case.

  ### 1. The Diagnosis: Where Version 1.0 Fails

  Your tentative principle was: *"You own a thing if you came by it without force or fraud, and anything you get from voluntary deals with informed people is yours."*

  Here is why it crashes on your specific test cases:

  *   **The Wells Case (The Coercion Bug):** You marked the well-owner as unjust, even though the sales were "voluntary." Why? Because in a desert, water isn't a commodity; it's a precondition for agency. If the alternative to paying is death, the transaction isn't truly voluntary; it's duress. Your gut recognizes that **monopoly power over essential resources invalidates consent.**
  *   **The Painting/Company Case (The Chain of Custody Bug):** You marked the current owners as owing restitution, even though *they* committed no fraud. Why? Because property rights aren't just about the current holder; they are about the **history of the token.** If the root commit is poisoned, the branch is poisoned. Your gut recognizes a **Principle of Rectification.**
  *   **The Drug Patent Case (The Priority Bug):** You want to override the patent if people die. This means you believe **Property Rights are subordinate to Survival Rights.**
  *   **The Squatter Case (The Abandonment Feature):** You grant title to the squatter. This contradicts the "Clean Chain" idea unless you add a **Statute of Limitations/Abandonment clause.** If an owner sleeps on rights for 30 years, the chain resets.

  ### 2. The Refined Principle: "Conditional Entitlement"

  To generate exactly the set of judgments you listed, you need a spec with four distinct clauses. This is a hybrid of Lockean and Nozickian theory with a Rectification patch.

  **The Principle of Conditional Entitlement**

  > **Clause 1 (Just Acquisition):** An agent acquires title to unowned resources by mixing their labor with them, **PROVIDED THAT** enough and as good is left for others, and no essential survival resource is monopolized.
  > *   *Force:* Handles **Squatter** (Labor + Abandonment) and **Wells** (Fails the "essential resource monopoly" check).
  >
  > **Clause 2 (Just Transfer):** Title transfers via voluntary exchange, **PROVIDED THAT** the exchange does not exploit a monopoly on necessities where no reasonable substitute exists.
  > *   *Force:* Handles **Chamberlain/Landlord/Lottery** (Valid transfers with substitutes) vs. **Wells/Drugs** (Invalid transfers due to coercion-by-necessity).
  >
  > **Clause 3 (Rectification):** Current title is invalid if any link in the chain of custody involved force or fraud, **UNLESS** the original owners abandoned the claim or a statute of limitations has passed to ensure social stability.
  > *   *Force:* Handles **Looted Painting/Inherited Company** (Chain is tainted, no abandonment) vs. **Squatter** (30 years vacancy counts as abandonment/stability override).
  >
  > **Clause 4 (Hierarchy of Rights):** Property rights derived from Clauses 1–3 are subordinate to the basic right of individuals to survive.
  > *   *Force:* Handles **Drug Patent** (Profit yields to Life).

  ### 3. Code Review of Your Cases

  Here is how this principle compiles against your test suite:

  *   **Chamberlain:** Passes Clause 2. Basketball entertainment is not an essential survival resource. Substitutes exist (watching someone else, playing yourself).
  *   **Landlord:** Passes Clause 2. While housing is essential, a *specific* building usually is not. You have the option to move to a different building or town. It is not a natural monopoly like the desert wells.
  *   **Desert Wells:** Fails Clause 1 & 2. Water in a desert is a non-substitutable essential. Monopolizing it violates the "Lockean Proviso" (enough and as good left for others) and makes subsequent "sales" coercive.
  *   **Squatter:** Passes Clause 1 & 3. He mixed labor. The 30-year vacancy triggers the "Abandonment/Stability" exception in Clause 3, resetting the chain of title.
  *   **Inherited Company / Looted Painting:** Fails Clause 3. The chain of custody contains force/fraud (rigged court, looting). The "Abandonment" exception does not apply because the victims did not voluntarily leave; they were dispossessed.
  *   **Lottery:** Passes Clause 2. Pure voluntary transfer within a regulated system.
  *   **Drug Patent:** Fails Clause 4. While the patent is a valid state grant (Clause 2), the "Right to Life" override (Clause 4) compels licensing or price caps in mortality scenarios.

  ### 4. The New Case: The Sampled Song

  **Scenario:** You write a song, it's a hit. Someone samples four seconds of it without asking. Who owes what to whom?

  **Analysis using Conditional Entitlement:**

  1.  **Acquisition (Clause 1):** You mixed your labor to create the song. You hold the title (Copyright).
  2.  **Transfer (Clause 2):** The sampler used a portion of your property. Was this voluntary? No.
  3.  **Nature of Resource (Clause 2/4):** Is music an essential survival resource? No. Therefore, the "Necessity Override" does not apply. The sampler is not dying without your 4 seconds.
  4.  **Rectification (Clause 3):** Not applicable.

  **Verdict:**
  The sampler owes you compensation (licensing fee).

  **The Nuance (The "Fair Use" Patch):**
  However, as an engineer, you know about "de minimis" non-compliance. If the principle is applied too strictly, it creates a "tragedy of the anti-commons" where no new art can be built because transaction costs are too high.
  Most legal systems add a **Fair Use** exception to Clause 1. This functions like the *Lockean Proviso* for culture: You own your song, *provided that* you don't monopolize culture so thoroughly that others cannot create new works.

  *   **If the 4 seconds are the "hook" (the core value):** They owe you. They extracted the value you created.
  *   **If the 4 seconds are incidental noise:** They likely owe you nothing. This falls under the "stability/efficiency" exception similar to the Squatter case. Chasing micro-violations creates more social cost than the injustice itself.

  ### 5. Where You Might Still Be Inconsistent

  There is one tension in your logic you need to resolve. It's the **Landlord vs. Wells** distinction.

  You said the Landlord charging triple rent is "Fine."
  You said the Well Owner charging triple price is "Not Fine."

  **The Tension:**
  In many modern cities, housing *is* as essential as water, and moving is *not* a viable alternative (due to jobs, family, cost of moving). If a landlord owns every building in a specific town (a company town), your logic demands you treat them like the Well Owner.

  **The Fix:**
  Your principle relies on **Substitutability.**
  *   If the tenant can move to a comparable apartment nearby -> Landlord is fine.
  *   If the landlord owns the *only* housing in a region where you work -> Landlord is now the Well Owner.

  If you accept that, your system is consistent. If you think the Landlord is fine *even if* they own the whole town and you have nowhere else to go, then you have to drop Clause 2's restriction on "Monopoly on Necessities," which would force you to accept the Desert Wells guy as just.

  **Recommendation:**
  Stick with the **Substitutability Test.** It preserves your intuition on the Wells (which feels morally urgent) while keeping the Landlord case just in a normal market. It acknowledges that "Voluntary" is a variable that depends on market conditions, not just the absence of a gun.

  ### Summary
  You are not a pure Libertarian. You are a **Liberal Egalitarian with Property Rights.** You believe property is the default, but it is conditional on:
  1.  Not killing people (Necessity).
  2.  Not trapping people (Monopoly).
  3.  Not benefiting from theft (Rectification).

  That is a robust, coherent system. It handles the sampling case (pay the fee), the drug case (cap the price), and the well case (break the monopoly).
