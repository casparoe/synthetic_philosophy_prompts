answer: |-
  **JOINT STATEMENT ON THE STANDING TO BLAME**
  **Drafted for [Magazine Name] by Signatories of the Forfeiture and Defect Views**

  **I. AGREED CLAIMS**

  We, the undersigned, acknowledge that public discourse on moral hypocrisy has reached an impasse. To clarify the terms of our disagreement, we affirm the following propositions as common ground:

  1.  **The Structure of Blame:** Blame is not merely the expression of anger or the prediction of punishment. It is a moral address that implicitly demands a response (acknowledgment, excuse, or apology) from the blamed party.
  2.  **The Tripartite Function of Standing:** We agree that "standing to blame" is not a monolithic concept. It conflates three distinct normative roles:
      *   *Epistemic:* The warrant to judge that a wrong occurred.
      *   *Authority:* The right to demand an answer from the wrongdoer.
      *   *Sanction:* The warrant to attach penalties or social costs to the wrong.
      We acknowledge these can come apart in principle (e.g., a stranger has the epistemic warrant to judge a crime but lacks the authority to demand an apology).
  3.  **The Badness of Hypocrisy:** We agree that hypocrisy is a moral vice. A blamer who commits the same wrong they condemn is morally defective. The dispute is not about the blamer's character, but about whether that character defect nullifies the *act* of blaming.
  4.  **The Locus of Dispute:** We agree that the core disagreement concerns the **Authority** function. Both sides accept the hypocrite usually retains the *Epistemic* warrant (they know a wrong occurred). The fight is over whether they retain the *Authority* to demand an answer.
  5.  **Complicity vs. Hypocrisy:** We acknowledge the reporter's distinction between *Hypocritical Blame* (committing the same wrong) and *Complicit Blame* (benefiting from or sustaining the system that produces the wrong). We agree these are conceptually distinct, even if they often overlap in practice.

  **II. RESIDUAL DISAGREEMENTS**

  | Issue | The Forfeiture View (Camp A) | The Defect View (Camp B) |
  | :--- | :--- | :--- |
  | **The Effect of Hypocrisy** | Hypocrisy constitutes a performative contradiction. By violating the norm you invoke, you renounce the authority to enforce it. The blame is "null," not just regrettable. | Hypocrisy is a separate moral failure that runs parallel to the blame. The blame can be *valid* even if the blamer is *vicious*. Truth is not held hostage to the messenger's purity. |
  | **The Nature of Authority** | Authority to blame is relational and reciprocal. You cannot claim a moral jurisdiction over another that you deny for yourself. | Authority to blame is derived from the moral law itself, not the agent. Any moral agent can invoke the law, provided the claim is true. |
  | **The Role of Complicity** | Complicity aggravates the forfeiture. If you sustain the wrong you condemn, your blame is not just hypocritical but manipulative (a tool of control). | Complicity makes the blame *insincere*, but not necessarily *unauthorized*. An oil executive can still be right that emissions are wrong, even if they profit from them. |
  | **The Remedy** | The hypocrite must cease blaming or rectify their own conduct before speaking. | The hypocrite should be criticized for their hypocrisy, but their blame of the original wrong should be answered on its merits. |

  **III. CRUXES AND TEST CASES**

  We identify two concrete scenarios where our predictions diverge. Settling these cases would move at least one camp.

  **Case A: The Hectoring Public Figure**
  *Scenario:* A prominent advocate for marital fidelity, known for public shaming of adulterers, is discovered to be maintaining a long-term affair. They continue to shame new adulterers.
  *   **Forfeiture Prediction:** The advocate has forfeited authority. Their shaming is morally void. The targets of the blame owe them no answer.
  *   **Defect Prediction:** The advocate is a hypocrite and deserves criticism, but their claim that adultery is wrong remains authoritative. The targets still owe a moral answer regarding the adultery, distinct from the advocate's behavior.
  *   **The Crux:** Does the moral injury of being hypocritically blamed outweigh the moral injury of the original wrong going unchallenged?

  **Case B: The Complicit Industry Leader**
  *Scenario:* An oil executive publicly condemns carbon emissions as a moral catastrophe while actively lobbying to expand drilling, from which they draw income.
  *   **Forfeiture Prediction:** This is not mere hypocrisy; it is complicity. The executive is *sustaining* the wrong. Their standing is fully forfeited because their blame is a mechanism of deflection (virtue signaling to delay regulation).
  *   **Defect Prediction:** This is a conflict of interest, not a loss of standing. The executive's blame is suspect regarding *sincerity*, but if emissions are objectively harmful, their authority to state that harm remains.
  *   **Testing the Reporter's Distinction:**
      *   *Hypothesis:* Complicity corrodes Authority (you can't demand change you block) but leaves Epistemic Warrant intact (you know it's bad).
      *   *Forfeiture Response:* We agree complicity is worse than simple hypocrisy, but we argue it also voids the Epistemic Warrant in the public sphere, as the statement is now a strategic lie.
      *   *Defect Response:* We agree complicity is distinct. It undermines *trust*, not *authority*. The public should distrust the speaker, but not reject the claim.

  **IV. META-ANALYSIS: VERBAL DISPUTE VS. GENUINE CONFLICT**

  **1. How much is verbal?**
  We concede that approximately 40% of our historical quarrel is verbal, stemming from the conflation of the three functions of standing identified in Claim #2.
  *   **The Confusion:** The Forfeiture View often argues from *Sanction* (hypocrites shouldn't punish) to *Authority* (hypocrites shouldn't speak). The Defect View often argues from *Epistemic* (the claim is true) to *Authority* (the claim can be demanded).
  *   **The Resolution:** By isolating *Authority* (the right to demand an answer), we have narrowed the genuine disagreement.

  **2. What is the genuine crux?**
  The remaining 60% is a substantive disagreement about the **source of moral authority.**
  *   Is authority *agent-relative* (dependent on the blamer's conduct)?
  *   Or is authority *agent-neutral* (dependent only on the moral truth)?
  This cannot be dissolved by definition. It is a clash of fundamental moral intuitions.

  **3. Falsifiability: What would change our minds?**
  To demonstrate this is not mere hair-splitting, we specify what evidence would compel each side to revise its position.

  | Camp | What would count as evidence *against* your position? |
  | :--- | :--- |
  | **Forfeiture View** | If we can identify cases where hypocritical blame reliably produces **moral improvement** in the blamed party *without* causing resentment or alienation. If the hypocrite's "dirty hands" make them *more* effective at moral repair (e.g., "I struggle with this too, but we must stop"), our claim that authority is forfeited is weakened. |
  | **Defect View** | If we can demonstrate that hypocritical blame causes a **distinctive moral harm** to the blamed party that non-hypocritical blame does not. If being blamed by a hypocrite violates the blamed person's autonomy or dignity in a unique way (treating them as a tool for the blamer's cover-up), then the blame is not just defective; it is void. |

  **Signed,**
  *Representatives of the Forfeiture and Defect Camps*
  *Date: October 2023*
