          1.  Identify the argument (No-Trade Theorem).
          2.  Identify the weak step (6).
          3.  Explain the hidden assumption (Common Knowledge / Transparency of Signal).
          4.  Explain why it looks plausible (Groucho Marx intuition).
          5.  Price the repair (What you lose: Perfect Efficiency. What you gain: Price Discovery).
          6.  Conclude on who pays the cheaper price (Journalist wins on empirics, Economist wins on logic, but logic relies on fragile assumptions).

      *   *Refining the "Hidden Assumption":* It's that the *decision to trade* is a **sufficient statistic** for the private information. It's not. It's a noisy signal.
      *   *Refining the "Cost":* You lose the idea that prices are "correct." They are just "clearing."

