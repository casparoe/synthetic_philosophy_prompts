answer: |-
  Your ledger is remarkably consistent in its functionalism, but it harbors a single, deep fracture. You have applied a **structural** test to the biological cases (2–5, 11–12) and an **ontological** test to the human-social cases (9–10).

  Here is the principle that best unifies your "Yes" verdicts, followed by the diagnosis of where your ledger breaks.

  ### The Principle: Integrated Homeostatic Representation (IHR)

  A system $S$ possesses a mind if and only if:

  1.  **Representation:** $S$ maintains a global state $M$ that covaries with features of the environment $E$ (not merely reacting to $E$, but holding $E$ in abeyance).
  2.  **Integration:** $M$ is not reducible to the sum of the states of $S$'s parts without loss of predictive power (the whole constrains the parts).
  3.  **Homeostasis:** $S$ acts to preserve the integrity of $M$ and the boundary of $S$ against entropy, using the parts as effectors.

  #### Testing the Clauses Against Your Ledger

  *   **Clause 1 (Representation)** does the heavy lifting against **Case 6 (Murmuration)**. A flock reacts to immediate neighbor position; it holds no map, no memory of foraging sites, no model of "predator" distinct from "move away." It is a reflex, not a representation. This also excludes **Case 7 (Slime Mould)** if you view its chemical gradients as direct physical causation rather than symbolic representation (though this is a borderline case, as you noted).
  *   **Clause 2 (Integration)** secures **Case 11 (Merged Colonies)**. If the bridge allows the pheromone field to equilibrate such that a disturbance on side A alters behavior on side B, the global state $M$ is now singular. It also secures **Case 3 (Brain)** and **Case 2 (Colony)** against **Case 1 (Single Ant)**. The single ant has no internal "society" to integrate.
  *   **Clause 3 (Homeostasis)** is the knife that cuts **Case 10 (Market)**. A market has no boundary it defends; it does not care if it ceases to exist. It has no self-preservation instinct. A corporation, however, *does* fight to survive.

  ### The Fracture: Case 2 vs. Case 9

  Here is where your ledger bleeds.

  *   **Case 2 (Ant Colony):** You say **Yes**. The ants exchange signals (pheromones), maintain a global state (nest integrity/food stores), and act to preserve it. The individual ant is an effector.
  *   **Case 9 (Corporation):** You say **No**. You argue "every decision... is some human's decision."

  But apply IHR:
  *   **Representation:** The corporation holds market models, strategic plans, and brand identity in its servers and procedures.
  *   **Integration:** A corporate decision (e.g., "cut costs") constrains individual employees who would not otherwise choose that action. The global state drives the parts.
  *   **Homeostasis:** Corporations fire threats, lobby governments, and accumulate capital specifically to maintain their boundary and existence.

  **The Inconsistency:** You treat the ant colony as a black box that generates emergent agency, but you treat the corporation as a transparent box where you can still see the humans inside. You grant emergence to the ants because you cannot intuitively model the pheromone field, but you deny it to the corporation because you *are* a human and know that you retain individual agency within it.

  If **Case 2** is a mind because the organization survives the turnover of individual workers, **Case 9** must also be a mind, because the corporation survives the turnover of individual employees. The "legal fiction" distinction is irrelevant to functionalism; a cell membrane is also just a "chemical fiction," yet it bounds the mind of the brain.

  ### Predictions for New Cases

  Based on IHR, here is what the principle predicts for your unlisted cases:

  **1. The Split and Re-merged Colony**
  *   **Split:** If you physically separate the colony such that pheromone trails are broken and food stores are not shared, **$M$ splits**. You now have two minds. Each will develop its own homeostatic goals (e.g., one might forage north, the other south).
  *   **Re-merge:** If you bridge them again, they will not instantly become one mind. They will likely fight (war) or one will subsume the other (assimilation) until a single integrated pheromone field $M$ is re-established.
  *   **Verdict:** Minds are defined by the *current* causal integration, not the historical lineage. Split = 2 minds. Re-merged = 1 mind (eventually).

  **2. The Human Army (Rigid Hierarchy)**
  *   This case is structurally closer to **Case 2 (Colony)** than **Case 9 (Corporation)**.
  *   In a corporation, employees optimize for their own career (individual fitness). In a rigid army hierarchy, soldiers are drilled to suppress individual fitness for unit survival (homeostasis). Communication is standardized (integration). The unit holds a tactical model of the enemy (representation).
  *   **Verdict:** **Yes (or a strong "Dim Yes").** If you grant mind to the ant colony because the workers are subordinated to the colony's goal, you must grant a higher degree of "mind" to the army than the corporation, because the army more successfully suppresses individual agency in favor of the global state.

  ### The Sacrifice

  You asked which verdict has to go. You cannot keep all twelve. The tension is between your **Functionalism** (Cases 3, 4, 5, 12) and your **Human Exceptionalism** (Case 9).

  **You must give up Case 9 (Corporation = No).**

  If you hold to the logic of **Case 3** ("The mind is not the cell; it is the organisation") and **Case 5** (Substrate independence), then the substrate of the organization (ants vs. humans vs. silicon) cannot be the deciding factor.

  *   If the ant colony is a mind because it processes information and acts coherently beyond the capacity of a single ant...
  *   And the brain is a mind because it processes information and acts coherently beyond the capacity of a single neuron...
  *   Then the corporation *must* be a mind (albeit a slow, sparse one) because it processes information and acts coherently beyond the capacity of a single human.

  Your unease in Case 9 ("I would be embarrassed to defend the difference from (2)") was your intuition spotting the error. The distinction you are grasping for—that humans have "inner lives" and ants do not—is a claim about *phenomenology*, not *mind-as-a-system*. If you are defining mind functionally (as your ledger suggests), the Corporation is a mind.

  **Summary of the Joint:**
  The real joint is **Downward Causation**.
  *   In the **Murmuration (6)**, the global state does not cause the parts' behavior; the parts' behavior *is* the global state. (No mind).
  *   In the **Colony (2)** and **Corporation (9)**, the global state (nest health / stock price) causally constrains the parts (ants / employees) to act against their local immediate preferences. (Mind).

  Your ledger is coherent if and only if you admit that **Case 9 is a Yes**. If you insist Case 9 is a No, you must demote **Case 2 to a No**, reducing the ant colony to a "mechanism." But given your verdict on **Case 3 (Brain)**, demoting Case 2 would collapse your entire view of your own mind.

  **Recommendation:** Update Case 9 to "Yes, a slow, distributed mind." It resolves the tension without forcing you to deny the reality of your own consciousness or the emergent nature of the ant colony.
