      *   *2009:* The same symbol, but the context has changed. The theory underneath shifted, but the predictive power of the math remained.
      *   *The "Defeat" vs. "Honesty":* Address the fear that structural realism means we know nothing. Reframe it: We know the relationships, and that's what allows us to build things/predict outcomes.
      *   *The Recurring Structure:* This is the tricky bit. Need to mention how the same math appears in fluid dynamics, electromagnetism, etc., without saying "Math is the Universe." Keep it evidential. "It keeps working where it shouldn't."
      *   *Closing:* Hand over to the workshop. Encourage the physicists not to feel betrayed and the philosophers not to feel superior.

