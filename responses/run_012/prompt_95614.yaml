answer: |-
  Good morning.

  It is a peculiar honour to stand before a room divided so neatly down the middle. On my left, I see colleagues who still worry about beamtime allocations and detector noise; on my right, those who worry about reference classes and underdetermination. Usually, when we mix these tribes, the physicists fear they are about to be told their life's work is a social construct, and the philosophers fear they are about to be told their life's work is irrelevant to the actual practice of science.

  I intend to betray neither side. I say this as someone who spent thirty-five years on the same beamline, and the last four years reading the books you have written. I am here to offer a testimony, not a theorem.

  To do so, I should like to hold up two objects. 

  The first is my lab notebook from 1981. It is bound in red cardboard, smelling faintly of stale tobacco and ozone. If you turn to page forty-two, you will see a symbol I used to denote a specific resonance state. At the time, I was thirty years old. I was certain that this symbol referred to a *thing*. I believed that if I could build a detector sensitive enough, I would find the little sphere, or the vibrating string, or whatever it was that sat behind the mathematics. I was a realist in the naive, robust sense. I thought I was mapping the furniture of the universe.

  The second object is from 2009, my final year before retirement. It is a digital log, printed and bound. On page one hundred and twelve, the same symbol appears. It sits inside an equation that I would still stake my reputation on today. 

  But here is the difference: in 1981, I believed I knew what the symbol *was*. In 2009, I knew only what the symbol *did*.

  Between those two dates, the theoretical framework surrounding that particle shifted twice. The ontology changed. The story we told ourselves about the underlying nature of the entity was rewritten, discarded, and rewritten again. Yet, the structural relationships—the equations governing how that symbol interacted with others, how it transformed under symmetry operations—remained stable. They survived the revolution.

  For a long time, I viewed this as a sort of quiet defeat. It felt as though the universe was keeping its essence hidden from us, allowing us only to trace the shadows on the cave wall. But after four years of reading philosophy, I have come to a different conclusion. It is not a defeat. It is the only sort of knowledge a physicist can honestly claim.

  This, I gather, is the heart of the structural realism you are here to discuss. But I wish to approach it not from the armchair, but from the instrument panel. When I speak of structure, I do not mean a Platonic ideal floating in a void. I mean the invariant relations that persist when our pictures of 'stuff' dissolve.

  There is a temptation, when adopting this view, to become deflationary. To say, "We know nothing of the world, only the maths." I urge you to resist that. It is not that we know *nothing* of the nature of things; it is that our access to their nature is mediated entirely by their relations. And in physics, relations are not secondary. They are the only things that carry energy. They are the only things that trip a switch.

  However, I must be careful. I am aware that physicists in this room are listening for a betrayal of the trade. You want to know if I am suggesting the electron is not real. I am not. The electron is as real as this microphone. But its 'reality' is not a tiny billiard ball; its reality is a node in a causal structure that behaves with a consistency that is, frankly, startling.

  This brings me to the point I wish to press upon you, and where I ask the philosophers to listen most closely. I want to avoid overclaiming. Structural realism can sometimes sound like a metaphysical absolute, as if we have proven that structure is all there is. I have not proven that. 

  My argument is evidential. It rests on the recurring appearance of the same mathematical structure in systems that have nothing else in common.

  We see the same differential equations governing the diffusion of heat in a solid, the spread of a pollutant in a lake, and the fluctuation of stock prices in a market. We see gauge symmetries appearing in contexts that share no physical substrate. When a mathematical structure proves robust enough to describe phenomena across disparate domains—where the 'stuff' involved is manifestly different—it suggests that the structure is doing the heavy lifting, not the ontology.

  This is the strongest evidence we have for the structural view. It is not that we cannot imagine the 'thing'; it is that the 'thing' changes while the 'relation' holds firm across boundaries that should, by rights, break it. If the structure were merely a human invention, a convenient fiction for organising data, why should it travel so well? Why should the mathematics of fluid dynamics find purchase in the geometry of spacetime?

  I do not claim this proves the universe *is* structure. I claim only that it is the most reliable handle we have been given. To insist on more—to insist on knowing the intrinsic nature of the relata independent of the relations—is to ask for a view from nowhere. It is to ask for a knowledge that does not require interaction. And as experimentalists, we know that without interaction, there is no signal. There is only noise.

  So, where does this leave us for the next two days?

  For the physicists: I ask you not to feel that this diminishes your work. Knowing the structure of the world is not a consolation prize. It is what allows us to build accelerators, to cure diseases, to navigate by satellite. If you know the relations, you know the world well enough to live in it and to manipulate it. That is not a shallow victory.

  For the philosophers: I ask you to keep your feet on the laboratory floor. It is easy to refine structural realism into a doctrine so pure it cannot bear the weight of a messy dataset. Remember that 1981 notebook. Remember that I *felt* the particle was a thing. That intuition is not merely an error to be corrected; it is part of the heuristic drive of science. We need the ontological hope to drive the experimental labour, even if the ontological reward is never fully granted.

  We are gathered here to discuss whether structure is the limit of our knowledge, or the limit of the world itself. I suspect we will not solve that in forty-eight hours. But if we can agree that the stability of structure amidst the flux of theory is the central fact of modern physics, then we have a common language.

  I held up those notebooks to show you that I have lived through the shift. I have mourned the loss of the 'thing' and celebrated the survival of the 'relation'. I invite you to do the same. Let us not settle for slogans. Let us not pretend we have a view from God's eye, nor pretend we are blind. We are neither. We are people with instruments, measuring the echoes of a structure we did not build, but which we are slowly learning to read.

  Thank you.
