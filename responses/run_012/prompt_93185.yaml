  Here is a game I have designed for you, small enough to sketch on a napkin and strict enough to meet your conditions. Let us call it Pentagon Match. Draw five dots in a circle to represent the vertices of a regular pentagon. The rules are simple. Two players take turns drawing a straight line segment connecting two of the dots. There are two constraints on where you can draw. First, lines cannot cross each other, meaning if a line already exists between two points, you cannot draw another line that intersects it in the interior of the pentagon. Second, and this is the crucial bit, each dot can have at most one line attached to it, so once a dot is an endpoint of a line, it is burned out and cannot be used again. The game ends when a player cannot make a legal move, and the last player to move wins. There are no draws because the board is finite and every move reduces the available resources.

  Now let us walk through the play to see why the first player loses. You start with five free dots. Whatever line you draw, you will connect two dots, leaving three free dots. Because of the non-crossing rule and the degree constraint, connecting any two dots effectively isolates at least one of the remaining three from the others in a way that prevents further pairing beyond one more move. For instance, if you connect two adjacent dots along the perimeter, you leave a chain of three dots. The next player can connect two of those, leaving one isolated dot with no partners. If you connect two non-adjacent dots with a diagonal, you isolate the single dot between them on one side and leave a pair on the other side. The second player simply takes that remaining pair. In every possible variation, the total number of moves in the game is exactly two. The first player makes move one, the second player makes move two, and then the first player has no moves left. The symmetry is perfect; both players have the same lines available to them at the start, and no rule favors one over the other. Yet the first player loses.

  To perform the honest test you asked for, we simply let the first player pass on their very first turn. If the first player passes, the second player is now effectively the first mover on the same board. As we just established, the first mover on this board loses. Therefore, the player who passed wins. This confirms that the loss is not due to some hidden asymmetry or a specific trap hidden in one particular opening move, but rather due to the obligation to move first in a game with a fixed even capacity. If you were to delete the requirement to move first, or equivalently remove one dot from the board to make the total capacity odd, the win would flip to the first player.

  The diagnosis of why the strategy-stealing argument fails here lies in the structural feature of resource consumption without accumulation. The strategy-stealing argument relies on a monotonicity assumption, which is that having an extra piece on the board is never a disadvantage. In games like Hex or Chomp, your pieces build towards a goal, and having more of them generally helps you connect or control space. In Pentagon Match, a move does not build anything; it consumes a shared resource. When the first player makes an opening move, they are not gaining a strategic foothold that they can use to mimic the second player; they are burning two vertices that might have been essential for the hypothetical winning strategy they are trying to steal. Because the total number of moves is fixed at two, the extra move is strictly a liability because it flips the parity of the remaining turns. To turn this back into a normal strategy-stealing game where the first player cannot lose, you would have to tinker with the win condition or the board size to ensure monotonicity holds. For example, if you changed the win condition to be about forming a specific shape rather than making the last move, or if you added a sixth dot so the maximum matching size became three, the first player would win. The failure here is not a gap in logic but a violation of the hidden premise that moves are additive rather than subtractive.

  Now I will argue against myself, as you requested. A critic might say that this game only works because the symmetry is doing less work than I claim, or that the losing moves are transparently losing once you look properly. They might argue that any game solvable by simple parity counting is trivial and does not constitute a genuine counterexample to the spirit of strategy stealing, which is intended for complex games where the value of a move is unknown. They could say that because we can easily count the total moves, we know it is a second-player win without needing to invoke strategy stealing, so the failure of the argument is irrelevant. Furthermore, they might claim that the symmetry is shallow because the board state changes drastically after one move, breaking the symmetry immediately, whereas in games like Hex the board remains symmetric enough for the stealing argument to hold water.

  My best reply to this is that the simplicity of the game is a feature, not a bug, because it isolates the exact mechanism of the failure. The strategy-stealing argument is often presented as a general proof for symmetric games, and this example shows precisely where the boundary lies. It is not about complexity; it is about whether an extra move increases or decreases your options relative to the opponent. In Pentagon Match, the symmetry is genuine, but the move interaction is exclusive rather than inclusive. As for whether this costs the defender of the argument anything, I believe it does, but only in precision. A serious defender would already concede that the extra-move premise is false in general, so this example does not destroy the argument. However, it does cost them the ability to wave their hands and say symmetry alone is sufficient. It forces them to explicitly state that the game must be monotonic, meaning a move must never reduce your own future winning chances compared to passing. Without that caveat, the argument is incomplete. So the example does not invalidate the strategy-stealing argument where it applies, but it shrinks its domain and demands a more rigorous statement of its prerequisites.
