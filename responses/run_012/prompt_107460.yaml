prompt: |-
  I write novels for a living — mostly close third person, the occasional first-person narrator you can't quite trust. So my whole working vocabulary is about getting an interior life onto the page: POV, free indirect discourse, interiority, subtext, show dont tell, the gap between what a character actually feels and what the prose manages to say.

  I've got the gist of Wittgenstein's private language argument — the beetle in the box, the idea that a word for a sensation nobody else could ever check up on can't really mean anything, that meaning has to lean on some public practice. I think I get it. What I want from you is to restate the whole thing in the vocabulary I actually use, as faithfully as you can manage, and then tell me what didn't survive the translation.

  Do it properly. Take the claim that a purely private language is impossible and run it through my terms. Is a novel written entirely from inside a sensation — no scene, no other characters to answer to — the novelistic version of the beetle's box? Is show dont tell the public-criteria requirement in disguise? Is the unreliable narrator a counterexample, or just a case where the public check is hidden from the reader but still doing the work underneath? Where does free indirect discourse sit — it seems to land exactly on the line between a character's private something and the shared language that has to carry it.

  Then the residue. What in the philosophers' debate has no counterpart in how a novelist actually builds an interior? And when something won't carry over, is that my vocabulary being too blunt for the point, or is it the argument quietly doing less than it claims? I half suspect novelists believe we pull off the impossible thing — render a private world — and I want to know if that's a real objection or just me confusing myself.

  Don't hand me reading lists or citations, I can't look anything up. Last line, one sentence, starting with Verdict: — tell me whether the leftover is a hole in my craft vocabulary or a sign the philosophical claim was vaguer than it looked.
