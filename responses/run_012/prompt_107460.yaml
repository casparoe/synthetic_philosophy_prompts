answer: |-
  Here is the Private Language Argument restated in the vocabulary of your craft.

  **The Beetle in the Box as Narrative**
  Imagine a novel written entirely in close third person where the narrator describes a sensation—call it "grief"—but never links it to a tear, a heaviness in the chest, a change in appetite, or a reaction from another character. The prose insists on the presence of the grief, but offers no external correlate, no behavior, no scene. This is the beetle's box. In Wittgenstein's terms, if the word "grief" refers only to something inside the character that no reader can ever verify through public evidence, the word ceases to function. It becomes a private noise. A novel written entirely from inside a sensation, with no scene or other characters to answer to, is indeed the novelistic version of the beetle's box: it attempts to sustain meaning without criteria. It fails not because the feeling isn't real, but because the reader has no way to distinguish "grief" from "numbness" or "hunger" if the text refuses to play by the shared rules of how grief manifests.

  **Show Don't Tell as Public Criteria**
  Your rule of "show, don't tell" is the public-criteria requirement in disguise. When you "tell" ("He was devastated"), you are asserting access to the private beetle. When you "show" ("He stared at the wall for three hours"), you are providing the public rule-following behavior that allows the reader to verify the state. Wittgenstein argues that meaning requires the possibility of being wrong. If you can say "He was devastated" and there is no conceivable evidence that could prove you wrong, you aren't making a claim; you're just making a noise. "Show don't tell" forces the writer to submit to the possibility of being wrong by anchoring the interior state in the exterior world where readers can check the work.

  **The Unreliable Narrator and Free Indirect Discourse**
  The unreliable narrator is not a counterexample. We only know the narrator is unreliable because the public check is hidden from us but still doing the work underneath. We spot the lie because the narrator's internal account clashes with the external facts of the plot, or because their tone violates the shared linguistic norms of the culture they inhabit. If the narrator were truly speaking a private language, we couldn't identify them as unreliable; we simply wouldn't understand them.

  Free Indirect Discourse (FID) sits exactly on the line you suspect. It looks like private interiority ("Why had he done this?"), but it is built of shared grammar. It works because the reader recognizes the inflection of the character's thought *through* the narrator's public voice. It is a hybrid technique that smuggles private sensation into public syntax. If FID were truly private, it would be unintelligible; it succeeds only because it leans on the shared practice of reading.

  **The Residue**
  Here is what does not survive the translation: the qualia itself. The actual sting of the pain, the raw redness of the anger. Wittgenstein argues that this private object drops out of consideration when we talk about meaning. It doesn't matter what is actually in the box; what matters is how we talk about the box. For a novelist, this is the hard pill. You believe your craft renders a private world. Wittgenstein says you are rendering a public map of a private world. The residue is the feeling itself, which remains locked in the character (and you), while the text circulates only the signs of the feeling.

  When something won't carry over, it is not because the philosophical argument is vague. It is because your craft vocabulary assumes you are transmitting the beetle, when you are actually transmitting the behavior of the box. You aren't failing to capture the private world; you are succeeding at capturing the public patterns that allow us to agree a private world exists. The belief that you pull off the impossible thing—rendering a purely private world—is the confusion. You render a shared simulation of one.

  Verdict: — The leftover is a hole in your craft vocabulary's assumption of private access, confirming the philosophical claim is sharper than it looked rather than vaguer.
