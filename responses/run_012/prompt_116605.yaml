  11. **Final Polish:** Ensure the distinction between "Verbal" and "Substantive" is nuanced. It's not *just* verbal, because the stakes (blame, knowledge transmission) are real. It's a "Deep Verbal" dispute or a "Metaphysical" dispute about the nature of the practice. Let's settle on **Methodological/Functional**.

  *(Self-Correction on "Verbal"):* Calling it "verbal" might be too dismissive. Chalmers distinguishes verbal from substantive. If they agree on the facts but disagree on the word "norm," it's verbal. But they disagree on *which intuitions matter*. That's substantive methodology. I will argue it is a **Substantive Disagreement about Theoretical Role**, fueled by **Conceptual Ambiguity**.

