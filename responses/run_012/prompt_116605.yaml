answer: |-
  Your hypothesis is compelling because it offers an exit from a dialectical cul-de-sac. However, diagnosing this as *merely* a collision of different questions under one label is too charitable to the participants and too dismissive of the stakes. If it were purely verbal, a clear distinction would dissolve the heat. It does not. The heat persists because the disagreement is not just about what word to use, but about **which normative pressure is philosophically fundamental.**

  Here is the proper diagnosis, the defense against the objection of contradiction, the implications for the normative force, and the path to progress.

  ### 1. The Diagnosis: A Substantive Disagreement About Theoretical Priority
  This is not a verbal dispute, nor is it a simple substantive disagreement about a single fact. It is a **methodological disagreement about theoretical priority**, masked by the ambiguity of the word "norm."

  When the Knowledge Camp says "The norm is knowledge," they are not merely defining a word. They are claiming that the *constitutive rule* of the practice (what makes an assertion an assertion) is the best explanation for our patterns of criticism, retraction, and challenge. When the Truth Camp says "The norm is truth," they are claiming that the *success condition* of the act is the primary normative locus. When the Belief Camp speaks, they are often focusing on the *internal rationality* of the agent.

  The disagreement is substantive because each camp is fighting for the right to define the **telos (purpose)** of assertion.
  *   **Knowledge Norm:** The purpose is the *transmission of epistemic authority*.
  *   **Truth Norm:** The purpose is the *coordination on reality*.
  *   **Belief Norm:** The purpose is the *expression of rational agency*.

  They contradict one another not because they are using "norm" to mean different things (though they are), but because they disagree on which function of assertion is the one that matters for epistemology. They are arguing over which question is the *right* one to ask, while pretending they are answering the *same* question.

  ### 2. Defending Against the Objection of Contradiction
  **The Objection:** The camps plainly contradict one another. One says "You must not assert $p$ unless you know $p$." Another says "You may assert $p$ if $p$ is true." These are incompatible directives.

  **The Defense:** The contradiction is real at the level of **action-guidance**, but illusory at the level of **theoretical explanation**.

  Consider chess.
  *   Player A says: "The rule of chess is to checkmate the king." (Constitutive/Goal)
  *   Player B says: "The rule of chess is not to move the rook diagonally." (Constitutive/Constraint)
  *   Player C says: "The rule of chess is to play sportsmanlike." (Regulative/Ethical)

  If Player A and Player B argue "The rule is X" vs "The rule is Y," they appear to contradict. But they are highlighting different layers of the same practice. In the assertion debate, the "contradiction" arises because each camp treats their preferred layer as the **explanatorily fundamental** one.

  The Knowledge Camp treats the *propriety of criticism* as the datum to be explained. The Truth Camp treats the *accuracy of content* as the datum. They contradict one another because they are offering competing **best explanations** of the same complex social practice. It is a substantive disagreement about which intuition (retraction vs. truth-value) cuts closer to the essence of the act. If it were merely verbal, clarifying "constitutive vs. regulative" would make them shake hands. It won't. The Knowledge Camp will insist that even if Truth is the *goal*, Knowledge is the *rule*, and that distinction matters for why we blame speakers.

  ### 3. Implications: The Conflation and the Loss of Force
  Your hypothesis identifies a conflation: **Constitutive Rules** (what makes the act what it is) vs. **Regulative Norms** (what makes the act good/permissible) vs. **Hearer Entitlements** (when reliance is safe).

  **The Distinction that Dissolves the Impasse:**
  We must distinguish between:
  1.  **The Constitutive Norm:** The rule violation of which renders the act defective *as an assertion* (e.g., asserting without belief might be "moore-paradoxical" or void).
  2.  **The Epistemic Norm:** The condition required for the assertion to fulfill its epistemic function (e.g., transmitting knowledge).
  3.  **The Moral/Pragmatic Norm:** The condition required for the assertion to be blameless or permissible in context.

  **What Is Lost?**
  If you draw this distinction sharply, you lose the **Unified Normative Force** that makes the debate interesting.
  The reason the "Knowledge Norm" debate has traction is that it bundles these together. It suggests that if you violate the knowledge norm, you have:
  *   Done something constitutively improper (like moving a rook diagonally).
  *   Epistemically failed (you didn't transmit knowledge).
  *   Incurred blame (you are criticizable).

  If you split these, the Knowledge Camp might retain the *constitutive* claim, but the Truth Camp can concede that while knowledge is the "rule," truth is the "score." The Belief Camp can argue that blamelessness tracks internal justification.
  **The Loss:** The debate becomes deflationary. We no longer ask "What is the norm?" but "Which norm is salient in this context?" The thrilling idea that there is *one* master rule governing our speech acts vanishes. The normative force survives, but it fragments into distinct pressures (rule-following, truth-seeking, blame-avoidance) rather than a single commanding voice.

  ### 4. The Substantive Core: The Hidden Methodological Question
  If we assume the disagreement is substantive (as I argued above), the hidden question driving the stalemate is: **What is the source of the intuition?**

  The camps are quarrelling over whether our intuitions in thought experiments track **Competence** or **Performance**.
  *   **The Knowledge Camp** assumes our readiness to retract tracks the *constitutive rule* (Competence).
  *   **The Truth/Belief Camps** assume our readiness to retract tracks *pragmatic implicature* or *moral blame* (Performance).

  **The Hidden Factual Question:** Do speakers treat an assertion of a true belief they don't know as a *failed assertion* (like a foul in soccer) or as a *successful assertion that was risky* (like a lucky shot in soccer)?
  *   If it's a failed assertion, Knowledge wins.
  *   If it's a risky success, Truth/Belief wins.

  The stalemate exists because the cases are **theory-laden**. The Knowledge Camp hears "I didn't know" and thinks "Invalid move." The Truth Camp hears "It was true" and thinks "Valid move, poor form." They are not looking at the same data; they are interpreting the data through incompatible functional models of language.

  ### 5. What Counts as Progress?
  Given this diagnosis, a "decisive case" is impossible because any case will be absorbed by adjusting the auxiliary hypotheses (e.g., "That wasn't really assertion," or "That was just rude, not incorrect"). A formal result is unlikely because the dispute is about pre-theoretic intuitions.

  **Progress requires a Deliberate Change of Question.**
  You should propose that the group stop asking "What is *the* norm of assertion?" and start asking: **"Under what conditions does each normative pressure become salient?"**

  This moves the group toward **Normative Contextualism** or **Functional Pluralism**.
  *   **Progress looks like this:** Acknowledging that "assertion" is a cluster concept. In legal testimony, the norm is Knowledge (or Justified Belief). In casual conversation, the norm might be Truth. In expressing one's mind, the norm is Sincerity (Belief).
  *   **The Argument for Stalemate:** Alternatively, argue that the stalemate is exactly what we should expect. If assertion is a multi-functional tool (coordinating action, sharing status, expressing self), it will have multi-functional norms. The frustration is misplaced because it stems from a monistic expectation (that there must be *one* norm) applied to a pluralistic phenomenon.

  **Recommendation for the Group:**
  Assign a reading that challenges the monistic assumption (e.g., MacFarlane on "Assessment Sensitivity" or functionalist accounts of speech acts). Ask them not to defend a norm, but to map the **ecology of norms**.
  *   When do we challenge for truth?
  *   When do we challenge for knowledge?
  *   When do we challenge for justification?

  If they can map the conditions under which each intuition triggers, they will have solved the problem by dissolving the assumption that one norm must rule them all. The "winner" is the one who can best explain why the other sides feel so compelling in their respective domains.
