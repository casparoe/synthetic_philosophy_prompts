  In the first stanza, line 1 is your actual crying, line 2 is the belief requirement, line 3 is the knowledge of fiction, and line 4 is the contradiction that binds them. The looping structure isn't pretentious; it formally mimics the paradox itself, forcing the same logical statements to feel like comfort in one stanza and dismissal in the next without changing a single word. By ending on the tears rather than the logic, the poem suggests the emotion outlasts the explanation, which is exactly where you're stuck.
