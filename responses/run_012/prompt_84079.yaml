  ok so this is a weird request. I'm a junior in high school and in my film & lit elective we spent the last twenty minutes of class on something my teacher called the paradox of fiction, and then the bell rang and she goes we'll pick this up thursday, and I've been chewing on it ever since. Here's the thing: (a) I watched a movie last week about a girl whose grandpa dies and I was actually crying, like wet face, not fake crying; (b) it seems like you can only really be sad about something if you think it's true or real or actually happened; (c) I do not think that girl or her grandpa are real, I know they're actors and a script. All three can't be right and yet. She also said some people solve it by saying I wasn't really sad at all, just pretending / playing along, and other people say the feeling is completely real but it never needed a belief to get started, a vivid thought is enough, and honestly I can't tell which one of those is me.

  So what I want is a poem -- a pantoum. I looked it up: quatrains where lines 2 and 4 of each stanza come back as lines 1 and 3 of the next one, and the last stanza has to loop around so the last line is the same as the very first line. 5 stanzas, 20 lines. I want the four lines of the first stanza to basically BE the three claims plus the thing that bugs me about them, and then I want each line to mean something different by the time it comes back around -- like the first time the line about it never happening shows up it's a comfort and the last time it's an accusation. Keep the lines roughly the same length (10-12 syllables ish) and don't force rhymes if they sound bad. Also I want the pretending theory and the real-feeling theory to both get a fair shot inside the poem instead of one of them winning, because thats kind of where I'm stuck. After the poem can you give me like 3 or 4 sentences telling me which line is supposed to be which piece of the paradox and whether the looping is actually doing any work or if I'm just being pretentious. Thanks!!
