      *   Specific Formal Result Idea: A margin-for-error principle that is *agent-sensitive*. If the margin scales with the agent's discriminatory power, does luminosity return? Williamson says no (the margin is fixed by the state). Idealizers say yes. A proof showing under what conditions a *variable* margin allows KK would be huge.

