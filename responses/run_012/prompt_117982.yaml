      Is there a genuinely closed system? In physics, a closed system exchanges no energy/matter. But informationally? A quine (program that outputs its own source) is closed in terms of output, but runs on an OS. A mathematical axiom system? Gödel says no. The only candidate is "Everything" (the Universe). If the universe is finite and self-contained, it's a closed loop. But we can't observe it from outside. So the claim holds for any *observable* or *definable* system. It's not a tautology, it's an epistemic limit.

