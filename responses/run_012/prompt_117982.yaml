      *   *On the Slide:* The user suspects they slide between "built" and "understood." I need to confirm this. Yes: Escher is about *perception* of a loop. Compilers are about *production* of a binary. The essay treats them as equivalent evidence for the same claim. They support different claims (epistemic vs. ontological).
