      *   *Crux 2: The Partition.* This is the weakest point for Side A. How do you define the partition objectively? Side B avoids this by pushing certainty to the "given." *Verdict:* Side B has the cleaner ontology here.
      *   *Crux 3: The Doctor Case.* Does the order of tests change the rational conclusion? *Verdict:* If the physical setup is identical, the conclusion should be identical. Side B wins on normative stability.

  6.  **Drafting Section 4: Tests and predictions:**
      *   *Goal:* Concrete scenarios.
