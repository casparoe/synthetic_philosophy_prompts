  ### The Main Case: The Airport Duet

  It is 2:15 PM on a Tuesday in the departure lounge of a mid-sized international airport. A public piano sits near a gate. **Alice**, a traveler with an hour to kill, sits and begins playing the melody of *Autumn Leaves*. She plays softly, not performing for a crowd, but filling the silence.

  **Bob**, seated nearby, is also a traveler. He hears the melody. He stands, walks to the piano, and sits on the bench beside her. There is no nod, no verbal exchange, no smile that signifies an agreement. He simply places his hands on the lower register and begins playing a walking bass line that fits her chord progression.

  Alice hears the bass line. She does not stop. She slightly alters her tempo to match the groove Bob has established. Bob hears the tempo shift and locks his bass notes to her new rhythm. They play through the song's bridge. Alice glances at Bob's hands to anticipate a chord change; Bob watches her posture to foresee a dynamic swell. They are mutually responsive.

  At the end of the song, Alice plays a final resolving chord and immediately stands up, gathers her bag, and walks toward her gate without looking back. Bob plays a soft decay on the keys, stands, and walks toward a different gate.

  **The Verdict:** An onlooker would say, "They played a duet." If asked afterwards, Alice would say, "I played with a stranger," and Bob would say, "We played *Autumn Leaves* together."

  **The Absence of Commitment:** At no point did Alice promise to finish the song. Bob made no agreement to accompany her. If Alice had stopped midway through the bridge to answer a phone call, Bob would have been surprised, perhaps disappointed, but he would have had no standing to complain. He could not say, "You owed it to me to finish." He had no entitlement to her continued participation. There was no normative bond, only a causal and psychological interlocking.

  ### The Near-Miss Twin: The One-Way Duet

  The setting, the song, the behavior, and the audible result are identical. Alice plays the melody; Bob plays the bass. They mesh perfectly. They adjust to one another (Alice adjusts to Bob's rhythm; Bob adjusts to Alice's dynamics).

  **The Single Difference:** The epistemic state regarding **Condition 4 (Common Knowledge)**.

  In this twin case, Alice knows Bob is adjusting to her. Bob adjusts to Alice. Bob *believes* Alice knows he is adjusting to her. However, **Alice does not know that Bob knows she is aware of him.** From Alice's perspective, Bob is a skilled musician who is luckily matching her, but she is unsure if he is actively tracking her or just playing a pre-learned arrangement that happens to fit. She treats his responsiveness as a happy coincidence rather than a known intention.

  **Why this is a single respect:** This alters only the recursive structure of their knowledge (the "knowledge of knowledge"). It does not change their physical behavior, their individual intentions (both intend to play together), or their dispositional adjustments (both still adjust). It is a purely epistemic variance.

  **The Verdict:** Despite the identical behavior and the participants' identical *sense* of having acted together (since Bob believes the knowledge is shared, and Alice feels the coordination), this fails to be a case of full joint action. Because Alice does not know that Bob knows she is tracking him, the interlocking of intentions is not fully open. Alice is acting *in light of* Bob, but not *with* Bob in the shared cognitive space required for a plural subject. They are two soloists coincidentally meshing, rather than a unit.

  ### The Checks

  **1. Satisfaction of the Four Conditions (Main Case)**
  *   **Condition 1 (We-Intention):** Alice does not merely intend "I play melody." She intends "We play *Autumn Leaves*." Her intention references the joint activity. Bob intends "We play."
  *   **Condition 2 (Interlocking Plans):** Alice's plan requires a bass line; Bob's plan provides it. Bob's plan requires a melody; Alice's plan provides it. Their sub-plans mesh without conflict.
  *   **Condition 3 (Responsiveness):** Alice slows down when Bob lags; Bob softens when Alice plays quietly. They are disposed to adjust in real-time.
  *   **Condition 4 (Common Knowledge):** Alice sees Bob join and knows he intends to play with her. Bob sees Alice continue and knows she intends to play with him. Each knows the other knows.

  **2. Absence of Commitment Conditions**
  *   **No Promise:** No words were spoken.
  *   **No Agreement:** No nod or signal established a contract.
  *   **No Obligation:** Neither party acquired a duty to the other.
  *   **No Entitlement to Complain:** If Alice quits, Bob has no normative ground for rebuke, only the descriptive observation that the joint activity ceased. The "obligation-free" character is genuine because the context (public piano, strangers, transit) lacks the background conventions of a band or a scheduled performance.

  **3. The Weight-Carrying Feature**
  The feature carrying the weight in making this joint action rather than mere coordination is **Condition 4 (Common Knowledge)**.

  *   **Why:** Without common knowledge, Condition 1 (We-Intention) cannot stabilize. If I intend "We J" but do not know that you intend "We J," my intention is based on a guess. If I know you intend it, but you don't know that I know, I cannot rely on your reliance on me. Common knowledge transforms two parallel "I-intentions" into a reflexive "We-intention." It creates the shared cognitive space where the activity exists *between* us rather than just *alongside* us.
  *   **If Removed:** If we remove Common Knowledge (as in the Twin), the verdict collapses. The activity becomes **Parallel Coordination**. It looks like joint action, sounds like joint action, and feels like joint action to the participants (if they are mistaken about the knowledge), but ontologically it is merely two individuals acting in a way that happens to fit. The "togetherness" vanishes because the loop is broken; there is no shared awareness of the sharing.

  **4. The Strongest Objection**

  **The Objector (The Normativist):** "This case is impossible. You claim Alice intends 'We play' but accepts no commitment to Bob. But to intend 'We play' *just is* to accept a normative commitment. When Alice forms the intention 'We play,' she thereby grants Bob a right to expect her continued participation. If she can walk away without wronging him, she never truly intended 'We.' She only intended 'I will play my part as long as it suits me.' That is not a we-intention; it is an I-intention with a social object. Therefore, your Main Case fails Condition 1. Genuine joint action requires a plural subject, and a plural subject is constituted by mutual obligation."

  **The Response:**
  The case survives this objection by distinguishing between **practical commitment** and **normative commitment**.

  1.  **Practical Commitment:** To intend "We J" requires a commitment to the *plan's success*. Alice is committed to playing her part *for the sake of the music*. If she stops, she frustrates her own intention. This is an internal rationality constraint, not an interpersonal obligation.
  2.  **Normative Commitment:** This is a commitment to the *partner*. It grants the partner a right to demand performance.

  The Airport Duet shows that practical commitment suffices for joint action. Alice is practically committed: she adjusts her playing to sustain the duet. If she stops, she defeats her own intention. But she is not normatively committed: she owes nothing to Bob. The Normativist conflates the *stability* of the intention (which requires practical commitment) with the *bond* between agents (which requires normative commitment). The phenomenology of the Airport Duet—"We did this"—is fully explained by the interlocking practical commitments and common knowledge. The normative bond is a social add-on, useful for long-term cooperation (like a band), but not ontologically necessary for the existence of the joint action itself. The "We" is in the structure of the intention and knowledge, not in the debt owed.
