      *   **Camp 1 (Libertarian Paternalists - LP):** Nudges are inevitable (there is no neutral design), defaults help people achieve their own goals (welfare), opt-out preserves freedom (liberty), manipulation concerns are overstated if the outcome is good.
      *   **Camp 2 (Autonomy/Manipulation - AM):** Nudges bypass rational agency (manipulation), opt-out is too costly or psychologically difficult (so liberty is illusory), respect for persons requires engaging their reasoning, not hacking their biases.
      *   **The Professor's Distinction:** Substitute (bad) vs. Supplement (good).
          *   *LP View:* Likely agrees, but thinks most nudges are supplements or that substitutes are okay if welfare gains are high.
