      *   *Section 2: The Proxy Logic (Surrogates).* Explain why they test for bacteria when worried about viruses. This shows "alive" isn't the point; "risk" is the point. The category is actually "Regulatory Hazard," not "Life."
      *   *Section 3: Thresholds and Degrees.* Biology is analog; Regulation is digital. The practice forces a cutoff. This rules out a pure "degrees of life" view in the *report*, even if the lab tech knows better.
      *   *Section 4: Philosophical Commitments.* What does this rule out? It rules out strong essentialism *in practice*. It aligns with Pragmatism/Instrumentalism.
