prompt: |-
  In the Nordic countries the tax authority sends each citizen a return already filled in from data it holds — wages, interest, deductions reported by employers and banks — and asks only that errors be corrected, so the state's account is the default and the citizen's honesty is presumed rather than audited. Something of the same shape runs through the administration of benefits, which are commonly paid on the applicant's word and checked afterward. This is usually read as an expression of Scandinavian trust in government, but the American comparison is less tidy than it looks, since American tax collection is also overwhelmingly voluntary and leans on people reporting themselves honestly, while the suspicion Americans are taught to cultivate is aimed at officeholders rather than at citizens, and the constitutional design is built on the assumption that people in power need to be checked. What conception of trust does the Nordic practice presuppose — trust as a reasonable inference from demonstrated reliability, as a self-fulfilling policy that makes people more trustworthy by treating them as though they were, or as a moral demand on citizens rather than a prediction about them? Which accounts of trust does it rule out, and with which is it merely compatible? Does it presuppose that suspicion is a mistake about people, or only an expensive way of organizing collection, and what would tax administration have to look like if we replaced the presumption with the design-for-distrust premise? Note as well where the practice is underdetermined: whether a Hobbesian who regards trust as nothing more than cheap enforcement could endorse the very same arrangement. Answer in continuous prose, with no headings, bullet points, bold text, or tables, and in American English.
