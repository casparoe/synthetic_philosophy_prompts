      *   *Decision:* Stick with Teleology/Function as the *first* question because it dictates the rest. But frame it as "Functional Analysis of Death Statutes." If we get the function wrong, the criteria don't matter.
      *   *Actually, looking at the "Impact" constraint:* The prompt says "I would rather fund a distinction that alters how a hospital committee deliberates." A purely teleological project might stay in the seminar room.
      *   *Pivot:* The **Irreversibility** question is the most *tractable* for policy change *right now*. However, the **Standing/Authority** question (Colleague 2) is the most *neglected* and potentially disruptive.
      *   *Best Bet:* The **Normative Function** question is still the most upstream. If we realize the function is *only* to permit organ procurement, the definition changes. If the function is to protect the living from premature burial, it changes differently. I will stick with the Functional/Teleological question but frame it tightly around the conflict between the Dead Donor Rule and Clinical Reality.

