  8.  **Final Polish:** Check against constraints (no citations, offline reading style). Ensure the distinction between "biological kind" and "legal status" is handled nuance. (Self-Correction: Make sure I don't sound like I'm advocating for abandoning the Dead Donor Rule, but rather analyzing its constraints).

      *   *Key Insight to emphasize:* The tension between the *biological reality* (process) and the *legal necessity* (event). The funding should target the bridge between these, not just one side.
      *   *Specific focus:* The "Irreversibility" clause is the weakest link in current law (UDDA). It's the place where policy can actually shift without rewriting the whole constitution. But the *Teleology* is the prerequisite.

