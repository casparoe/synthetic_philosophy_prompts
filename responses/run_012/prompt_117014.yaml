  5.  **Address Task 3: Ranking the Questions:**
      *   *Criteria:* Upstream/Downstream, Tractability (conceptual vs. data), Neglect (institutional interests), Impact (protocol/statute).
      *   *Ranking Logic:*
          1.  *Function/Teleology:* What is the concept *for*? (Upstream). If we don't know why we need the definition, we can't define it.
          2.  *Irreversibility:* The technical loophole in DCD and Brain Death.
          3.  *Biological Kind vs. Legal Status:* Metaphysical, but dictates the argumentative strategy.
          4.  *Consciousness vs. Integration:* Specific criteria, downstream of the "Function" question.
          5.  *Bundle of Statuses:* High impact, but legally difficult (fragmentation of law).
      *   *Neglect:* The "Function" question is neglected because everyone assumes we already know why we define death (organ donation + stopping treatment). The "Standing" question is neglected because it threatens medical authority.

  6.  **Address Task 4: The Single Question to Fund:**
      *   *Selection:* **The Teleological Question: "What specific normative work must the declaration of death perform, and can a single definition satisfy all competing interests?"**
      *   *Reasoning:* It is the most upstream. If the answer is "different things for different purposes" (e.g., one definition for inheritance, one for organs, one for mourning), the whole search for a unified biological criterion dissolves. If the answer is "one unified concept," we need to know which interest trumps (e.g., organ viability vs. family closure).
      *   *Runner-up:* The Irreversibility Condition (specifically in DCD).
      *   *Why Winner > Runner-up:* You can't fix irreversibility standards without knowing *why* irreversibility matters. Is it about the impossibility of auto-resuscitation? Or the moral impermissibility of attempting resuscitation?
      *   *Condition to move it down:* If empirical research shows that legal systems *cannot* tolerate pluralistic definitions (e.g., due to equal protection clauses), then the teleological inquiry hits a hard wall, and we must return to finding the "least bad" unified biological marker.

  7.  **Drafting the Response (Iterative Refinement):**
