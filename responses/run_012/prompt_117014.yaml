  2.  **Deconstruct the Topic (Definition of Death):**
      *   *Current State:* The Uniform Determination of Death Act (UDDA) in the US (and similar laws elsewhere) relies on "irreversible cessation of circulatory/respiratory functions" OR "irreversible cessation of all functions of the entire brain, including the brainstem."
      *   *Tensions:*
          *   Brain death vs. Biological life (bodily integration continues).
          *   DCD (Donation after Circulatory Death) vs. Dead Donor Rule (is the patient dead *before* organ recovery?).
          *   Irreversibility (technological vs. normative).
          *   Consciousness vs. Organismal Integration.
      *   *Practical Stakes:* Organ procurement, withdrawal of life support, legal liability, family consent.

  3.  **Address Task 1: Genuinely Open Questions:**
      *   *Standard candidates:* Biological kind vs. Legal status? Consciousness vs. Integration? Irreversibility work? Dead-donor rule constraints? Bundle of statuses?
      *   *Unseen candidates:*
          *   *The "When" vs. "What" distinction:* Are we defining the *state* of being dead or the *moment* of transition?
          *   *The Epistemic Gap:* We often conflate "we can't know if they are alive" with "they are dead." (Uncertainty vs. Ontology).
          *   *The Normative Function:* What work do we *need* the concept of death to do? (e.g., stop treatment, harvest organs, inherit property). If the functions diverge, do we need one definition?
