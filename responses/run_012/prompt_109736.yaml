          *   *Embarrassment:* If it makes the Church look bad (e.g., Jesus baptized by John), they wouldn't invent it, so it's probably true.
          *   *Multiple Attestation:* If it appears in independent sources (Mark, Q, John, Paul), it's probably old/true.
          *   *Coherence:* If it fits with other stuff already deemed authentic, it's probably authentic.
          *   *Contextual Credibility:* Fits the historical setting (1st century Palestine).

  3.  **Translate to Causal Inference Vocabulary:**
      *   *Target Estimand:* $Y_i(1)$ vs $Y_i(0)$? No, this isn't quite a treatment effect. It's more like *source attribution*. Let's define $A$ = Attribution (Jesus vs. Early Church). We observe $O$ (the text). We want $P(A=\text{Jesus} | O)$.
      *   *Data Generation Process (DGP):* True Events ($T$) $\rightarrow$ Oral Tradition/Transmission ($M$) $\rightarrow$ Written Text ($W$).
      *   *Confounding:* Theological agendas, community needs, apologetic motives influence $W$ regardless of $T$.
      *   *Selection Bias:* We only have the texts that survived (canonical gospels).
      *   *Measurement Error:* The text is a noisy measure of the event.

      *   *Criterion: Dissimilarity*
          *   *Historian Claim:* Filter out things that look like Judaism (context) or Early Church theology (outcome). Remainder is Jesus.
          *   *Stats Translation:* Controlling for covariates. If $X_1$ = Jewish Context, $X_2$ = Church Theology. We want the effect of Jesus ($J$) on Text ($T$). But we are selecting on $T$ such that $T \not\perp X_1$ and $T \not\perp X_2$.
          *   *User Suspicion:* Botched confounding control? Yes. It looks like conditioning on a collider or over-controlling. If Jesus *was* Jewish, controlling for "Jewishness" biases the estimate of Jesus away from his actual context.

      *   *Criterion: Embarrassment*
          *   *Historian Claim:* Church wouldn't invent negative stuff. So negative stuff $\rightarrow$ True.
          *   *Stats Translation:* Monotonicity assumption. Let $I$ = Invention. $P(I | \text{Embarrassing}) \approx 0$. Therefore, if Observed = Embarrassing, Source $\neq$ Invention.
          *   *User Suspicion:* Monotonicity? Yes. Assumes the "noise" process (Church invention) has support only on "Flattering" outcomes.

      *   *Criterion: Multiple Attestation*
          *   *Historian Claim:* Independent sources agree $\rightarrow$ not independent invention.
          *   *Stats Translation:* Reducing measurement error via independent replicates. Assumes conditional independence of errors given the true event. $W_1 \perp W_2 | T$.
          *   *Issue:* Are sources truly independent? (Markan priority, etc.).

      *   *Criterion: Coherence*
          *   *Historian Claim:* Fits with other authentic stuff.
          *   *Stats Translation:* Bayesian prior updating? Or model consistency. If $T_1$ is authentic, $T_2$ is more likely authentic if $T_2 \approx T_1$.
          *   *Issue:* Circular. Uses the output of the estimator as input for the prior.

