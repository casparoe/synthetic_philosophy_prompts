answer: |-
  Here is the translation of the Historical Jesus "Criteria of Authenticity" debate into the language of causal inference and observational study design.

  ### The Setup: The Data Generation Process (DGP)

  To map this, we need to define the variables.
  *   **$H$ (Latent State):** The actual words/actions of the historical Jesus. This is the unobserved truth you want to identify.
  *   **$G$ (Observed Outcome):** The text we have (Gospels, Epistles).
  *   **$M$ (Mechanism/Transmission):** The process that turns $H$ into $G$. This includes oral tradition, translation (Aramaic to Greek), and theological editing.
  *   **$C$ (Confounders/Context):** 1st-century Jewish apocalypticism (the environment $H$ operated in).
  *   **$E$ (Selection Bias/Editorial Agenda):** The theological motives of the Early Church (the authors of $G$).

  **The Identification Problem:** You observe $G$. You want to infer $H$. The problem is that $M$ is non-ignorable. $E$ actively modifies $G$ to serve community needs. $C$ constrains $H$ (Jesus couldn't say things conceptually impossible in 1st-century Palestine).

  The "Criteria" are essentially identification strategies proposed to isolate the variation in $G$ that is attributable to $H$ rather than $C$ or $E$.

  ---

  ### Criterion-by-Criterion Translation

  #### 1. Criterion of Dissimilarity
  *   **The Historian Claim:** If a saying is dissimilar to both contemporary Judaism ($C$) and the Early Church ($E$), it is likely authentic ($H$).
  *   **The Stats Translation:** This is an attempt to **control for confounding by exclusion**. You are assuming $H$ is orthogonal to $C$ and $E$. You are effectively residualizing $G$ against covariates $C$ and $E$ and claiming the residual is the treatment effect of $H$.
  *   **The Identification Assumption:** $H \perp C$ and $H \perp E$.
  *   **The Flaw:** This assumes the treatment ($H$) is independent of its own context ($C$) and its own downstream effects ($E$). If Jesus was a Jew ($H \subset C$), conditioning on "not Jewish" biases your estimate of $H$ toward zero. You are controlling for a mediator or a collider.

  #### 2. Criterion of Embarrassment
  *   **The Historian Claim:** The Church would not invent material that undermines their theology (e.g., Jesus baptized by John, implying subordination). Therefore, embarrassing material is authentic.
  *   **The Stats Translation:** This is a **support assumption** on the error distribution of the Early Church ($E$).
      *   Let $I$ be the indicator of Invention by the Church.
      *   Assumption: $P(I=1 | G \in \text{Embarrassing}) = 0$.
      *   If you observe $G \in \text{Embarrassing}$, then $I$ must be 0, so $G$ must come from $H$.
  *   **The Identification Assumption:** Monotonicity. The "noise" process (Church invention) has no support on the "Embarrassing" region of the outcome space.
  *   **The Flaw:** It assumes a rigid loss function for the Early Church. It ignores that they might have retained embarrassing data because they were stuck with it (high switching costs), not because they couldn't invent it.

  #### 3. Criterion of Multiple Attestation
  *   **The Historian Claim:** If a saying appears in independent literary sources (e.g., Mark, Q, John, Paul), it is likely authentic.
  *   **The Stats Translation:** This relies on **conditional independence of measurement errors**.
      *   You have multiple observations $G_1, G_2, \dots G_k$.
      *   Assumption: $G_i \perp G_j | H$.
      *   If sources are truly independent, the probability of them independently inventing the same specific noise pattern is low.
  *   **The Identification Assumption:** No unmeasured confounding between the sources (e.g., one source didn't copy the other; they aren't both drawing from a common biased pool).
  *   **The Flaw:** Independence is hard to verify. If Mark is a source for Matthew, they are not independent samples. This is pseudo-replication.

  #### 4. Criterion of Coherence
  *   **The Historian Claim:** If a saying fits well with other material already deemed authentic, it is also authentic.
  *   **The Stats Translation:** This is **iterative model fitting using predicted values as regressors**.
      *   Step 1: Estimate $\hat{H}$ using other criteria.
      *   Step 2: Update prior $P(H)$ based on $\hat{H}$.
      *   Step 3: Re-estimate.
  *   **The Identification Assumption:** The initial seed set of "authentic" material is unbiased.
  *   **The Flaw:** This propagates error. If your initial identification is biased, Coherence ensures the bias spreads to the rest of the dataset. It creates overfitting to the "core" model.

  ---

  ### Addressing Your Suspicions

  You asked if you are importing your own hang-ups. You are not. Your intuition is sharper than the historians' methodology.

  **1. Dissimilarity as Botched Confounding Control**
  **Verdict:** Fair critique.
  In causal terms, Dissimilarity treats "Jewish Context" ($C$) and "Church Theology" ($E$) as confounders that need to be blocked. But $C$ is not a confounder; it is the **support** of $H$. Jesus *is* a Jew. By conditioning on $G \not\approx C$, you are selecting on a characteristic that $H$ necessarily possesses.
  *   **DAG perspective:** $C \rightarrow H \rightarrow G$. Also $C \rightarrow G$ (context influences recording).
  *   If you condition on $G$ being *unlike* $C$, you are effectively conditioning on a collider or cutting the path $C \rightarrow H$. You are defining $H$ as the variance in $G$ that cannot be explained by $C$. If $H$ is largely explained by $C$, your estimator returns an empty set. It's not just biased; it's inconsistent for the true $H$.

  **2. Embarrassment as Monotonicity**
  **Verdict:** Fair critique.
  This is exactly an Instrumental Variables (IV) style monotonicity assumption.
  *   **Instrument:** "Embarrassment."
  *   **Assumption:** The Early Church ($E$) is a "monotone defier" or simply has zero compliance on this instrument. They never move from "No Text" to "Text" when the content is embarrassing.
  *   **The Risk:** In IV terms, this is the "exclusion restriction." It assumes the only way an embarrassing text gets into $G$ is via $H$. It rules out the possibility that the Church had a reason to keep embarrassing material (e.g., to explain a known ritual like baptism) even if they didn't like it. If $P(I=1 | \text{Embarrassing}) > 0$, the identification collapses.

  ---

  ### The Residue Report

  Here is what survives the translation and what evaporates.

  **1. What Maps Cleanly**
  *   **Multiple Attestation:** This is standard meta-analysis or triangulation. The statistical logic holds *if* independence holds.
  *   **Embarrassment:** This maps cleanly to selection bias and support assumptions. It is a testable (in principle) claim about the generative process of the texts.

  **2. What Maps Only With Distortion**
  *   **Dissimilarity:** As noted, this maps to "orthogonalization," but it distorts the historical reality. It assumes $H$ is an outlier relative to its own context. In stats terms, it assumes the signal is in the residuals, not the fitted values. This is usually where the signal *isn't*.
  *   **Coherence:** This maps to Bayesian updating, but it distorts the flow of information. It treats the *output* of the estimator as *prior* information without accounting for the variance of the estimator. It ignores uncertainty propagation.

  **3. What Has No Counterpart (The Residue)**
  *   **Hermeneutics/Meaning:** Causal inference treats data as carriers of information about an event. Historians often treat texts as *constitutive* of the event. The "meaning" of a saying to the community is sometimes treated as more historically significant than the "fact" of the utterance. There is no $Y$ for "theological significance."
  *   **The "Core" vs. "Whole" Person:** Causal inference usually seeks an Average Treatment Effect (ATE) or a specific structural parameter. The historians are arguing over a **latent class membership** ($H$ vs. Not-$H$). But the residue is the question of *coherence of personality*. Historians want a psychologically plausible agent. Stats doesn't care about psychological plausibility, only model fit.
  *   **Survival Bias:** We don't just have selection bias on *what was written*; we have selection bias on *what survived*. The "data" is a non-random sample of a non-random sample. The criteria do not adjust for the 95% of texts that were lost.

  ---

  ### The Final Question

  **"If the residue turns out to be large, is that my vocabulary failing to capture something real about how historians actually reason, or is a sign that the criteria people never had a well-defined question in the first place?"**

  It is the latter. **They did not have a well-defined identification strategy.**

  Here is the hard truth in your language:
  The "Criteria of Authenticity" are not an estimator. They are a set of heuristic filters that were developed *before* the field rigorously defined the estimand.

  1.  **Ill-defined Estimand:** "Who Jesus was" is not a point-identified parameter. It is a high-dimensional latent vector (beliefs, words, actions, self-conception). The data ($G$) is low-dimensional and heavily compressed. You cannot identify a high-dimensional vector from low-dimensional, biased projections without strong structural assumptions. The criteria provide those assumptions, but they are ad hoc and often contradictory (e.g., Coherence says "fit the pattern," Dissimilarity says "break the pattern").
  2.  **No Variance Estimation:** The criteria produce a binary classification (Authentic/Inauthentic) without standard errors. In your world, an estimate without a confidence interval is useless. In theirs, it's a "probability." This suggests they are doing **model selection** (choosing the story that fits best) rather than **inference** (estimating the truth).
  3.  **The "Core" Fallacy:** The goal of the "New Quest" (where these criteria peaked) was to find a "core" of authentic sayings to build a biography. But if the selection mechanism (Dissimilarity) removes the context ($C$) and the reception ($E$), the "core" you are left with is a **decontextualized residual**. It is statistically clean but historically sterile. It is the $H$ that remains after you project out everything that makes $H$ intelligible.

  **Conclusion:**
  Your vocabulary isn't failing. The historians are trying to solve an **inverse problem** with insufficient data and priors that are disguised as "criteria."
  *   If the residue is large, it means the **identification conditions are not met**.
  *   The "fight" in your reading group is essentially one group arguing for **Point Identification** (we can isolate the true $H$) and the other arguing for **Partial Identification** (we can only bound $H$, or perhaps we can't identify it at all).
  *   The sceptics are right: The criteria do not discriminate; they select. They select for a specific *kind* of Jesus (one who is unique, awkward, and isolated), not necessarily the *real* Jesus.

  You are not missing theology. You are seeing that their "methods section" doesn't support their "conclusions." The residue is the sound of an under-identified model straining against the data.
