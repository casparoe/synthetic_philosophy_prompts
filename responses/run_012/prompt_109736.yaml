      *   *Correction on Dissimilarity:* It's not just confounding. It's like trying to identify a signal by assuming it's orthogonal to all known bases. If the signal lies *in* the span of the bases, you identify nothing. This is an identification problem, not just confounding.
      *   *Correction on Embarrassment:* It's not just monotonicity. It's an assumption about the *loss function* of the early church. They minimize "embarrassment."
