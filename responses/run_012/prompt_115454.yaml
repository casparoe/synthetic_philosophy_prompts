answer: |-
  The air in the card room was thick enough to chew, a suspension of stale tobacco smoke and recycled oxygen. I watched Ray's hands. They were resting on the green felt, still as stones. Mine were sweating. I wiped them on my jeans, leaving dark patches on the denim.

  There was forty thousand dollars in the middle of the table. My money. Well, mostly my money. I was the bank; Ray was the instrument. I needed him to win. I needed it in my gut, a tight, hot knot that pulled at my diaphragm every time the dealer flicked a card. I needed it so bad I could taste copper.

  Ray just looked at his hole cards. He didn't lift them high. He didn't squint. He looked at them the way you look at a menu when you're not particularly hungry. He'd rather have the ace-king, sure. I could see that in the way he slid the chips forward. Preference. But there was no tremor. No hope. Hope is a violent thing; it shakes your hands. Ray was motionless.

  "Raise," he said. His voice was flat.

  The opponent, a kid with a gold chain and a twitchy eye, folded. Ray pulled the pot in. He didn't smile. He didn't stack the chips neatly. He just swept them into his pile, a minor adjustment of gravity.

  I leaned in during the break. The neon sign outside buzzed, casting a sick green light over Ray's face. He was eating a ham sandwich. He chewed methodically.

  "Sarah's sister called me," I said.

  Ray took a bite. Swallowed. "Yeah?"

  "She wants to know if you're coming to the memorial next week. The six-month mark."

  Ray took another bite. He wiped a crumb from his lip. "No."

  "Ray, come on. She's your wife."

  "Was," he said.

  "You didn't even go to the funeral."

  "I was here."

  "You were here?" I felt the heat rising in my neck. This was the thing that kept me up. Not the money—the money was just numbers. It was this. The emptiness. "People are grieving. You're her husband. You're supposed to be..."

  "Supposed to be what?" He looked at me. His eyes were clear. That was the terrifying part. They weren't dead eyes. They were focused. They saw me, the table, the cards. They just didn't want anything from me.

  "Supposed to care," I said.

  "I care," Ray said. "I preferred her being alive. I prefer her being dead less. But missing her is just pain. It's a sensation. Like burning your hand on a stove. Why would I keep my hand on the stove?"

  "Because you loved her."

  "Love is the reason the hand is on the stove," he said. He finished the sandwich. He wiped his fingers on a napkin. "If I sit in a room and cry about Sarah, I am suffering. If I sit here and play cards, I am not. She is dead either way. My suffering doesn't help her. It just makes me worse off."

  "That's not human," I said. "A man who doesn't grieve is broken."

  "A man who grieves is suffering," Ray said. "He is worse off than the man who doesn't. That's all that matters. How much it hurts."

  I wanted to hit him. I wanted to shake him until something cracked behind those eyes. But I looked at my own hands, shaking slightly on the table edge. I thought about my wife at home, waiting up. I thought about the ache in my chest when I worried about my daughter's grades, my son's driving. I carried them like heavy stones in a backpack I refused to take off. Ray had set his backpack down.

  Was he free? Or was he hollowed out? I couldn't tell. Sometimes I looked at him and saw a saint who'd walked through the fire and didn't burn. Sometimes I saw a corpse that hadn't realized it was dead.

  "Back to the table," Ray said.

  The next hand was ugly. The kid with the gold chain came back, luck turned. The pot swelled. I felt my throat close up. Forty thousand was gone, now we were into my reserve. I started doing the math in my head, the rent, the loans, the leverage. The craving was a physical weight, pressing down on my shoulders. I wanted Ray to win so I could stop feeling this pressure.

  Ray bet big. The kid called. The river came down. A king.

  The kid flipped a full house. Ray mucked his hand. He lost twelve thousand dollars in ten seconds.

  I stopped breathing. "You had the nuts," I hissed. "Why did you fold?"

  "Probability shifted," Ray said. "Risk of loss outweighed the utility of the gain."

  "Utility? That's my money, Ray!"

  "It's chips," he said. "You're sweating."

  "I'm sweating because I care!"

  "That's the problem," Ray said. He stood up. He stretched, his back cracking. "You're paying for the hand twice. Once with the money, once with the stress. I only pay once."

  "You don't feel anything."

  "I feel the chair. I feel the hunger. I feel the cards." He tapped the felt. "I don't feel the want. The want is the damage, Mick. You're bleeding out everywhere you look."

  He was right. I knew he was right. That was the sickness of it. I knew that if I could be like him, the weight would vanish. I could lose every dollar I owned and feel lighter than I did now with a profit. But I couldn't stop wanting. I wanted him to be different. I wanted Sarah back for him. I wanted the world to have texture, to have stakes.

  And because I wanted those things, I was worse off. I was the one suffering. Ray was standing there, dry-eyed, alive, and by his own metric—and maybe the only metric that counted—he was winning. He was suffering less.

  The kid with the gold chain was gloating. He raked in the chips. Ray watched him. There was no envy in Ray's face. No resentment. Just observation. He watched the kid celebrate like he was watching rain hit the pavement.

  "Are you done?" I asked.

  "I'm tired," Ray said. "Let's go."

  We walked out into the night. The air was cold. I shivered. Ray didn't. He walked with his hands in his pockets, looking at the sidewalk.

  "You know," I said, my voice cracking. "If you loved her, you'd miss her."

  "I do miss her," Ray said. "Missing is a thought. 'I wish she was here.' That's a thought. The pain comes when I demand that the thought be false. When I demand reality be different than it is. I stopped demanding."

  "So you're happy."

  "No," he said. "Happy is just another want. I'm just not unhappy."

  We reached the car. I unlocked it. The interior light flickered on. I looked at him one last time before he got in. I tried to find a crack. A flicker of loneliness. A sign that this was a defense mechanism, a trauma response, anything that made him human and broken like me.

  There was nothing. Just a man getting into a car.

  I got in the driver's seat. I started the engine. The dashboard lit up. I looked at my hands on the wheel. They were still trembling. I hated him for his peace. I hated him because I knew that if I traded places with him, if I gave up the love for my kids, the fear for my money, the grief for the world, I would be better off. I would be lighter. And I would be a monster.

  Ray rolled down the window. He held out his hand.

  "Pass me that napkin," he said. "I got grease on my thumb."

  I handed him the napkin from the dash. He wiped his thumb. He looked at the stain until it was gone. Then he dropped the napkin on the floor mat. He didn't care about the litter. He didn't care about the car. He didn't care about me.

  He just wanted his thumb clean.

  I put the car in drive. I wanted to get home. I wanted to sleep. I wanted to want less. The engine hummed, steady and indifferent, carrying us both into the dark.
