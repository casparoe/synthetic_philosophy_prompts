prompt: |-
  I chair the reproductive ethics committee at our academic medical center, and since last month I have also been one of the clinic's patients: my partner and I are midway through an IVF cycle and have just received a preimplantation genetic report on our own embryos. I would rather not be drafting this at all, but the committee has to settle a policy question at its next meeting, and I have told the vice chair I will recuse from the vote, so the memo needs to stand on its own for colleagues who do not share my situation.

  The question arises from something new in our lab. Alongside the screening we have always done for chromosomal abnormalities and single-gene conditions, we have begun returning a polygenic report that scores each embryo on a small number of traits that fall within the normal range. Our medical director wants a rule — call it best first — requiring that when several usable embryos are available, the one with the highest score be transferred first unless the parents give a reason the clinic accepts. He argues that if selecting the child with the best chance of the best life is a genuine obligation, the clinic cannot knowingly let a couple pick the lower-scoring embryo, and that we already do precisely this whenever we select against a serious disease. On the agenda is a couple with two unaffected embryos whose scores differ by a modest amount; they want to transfer the lower-scoring one. They offer two reasons: they believe the score is close to noise, and one of them, who is short, does not want her child raised under a clinic policy that implies her own life was the worse outcome.

  Please draft the written opinion I will circulate before the meeting. It should land on one of three positions — best first made mandatory, selection left entirely to the parents, or a halt to returning non-medical scores at all — with conditions if you recommend conditions, and with a timeline tied to our next cycle start, roughly six weeks out. I want the reasoning to be substantive rather than gestural, and I specifically want it to work through the following:

  - whether selecting against a serious disease and selecting on the basis of a normal-range trait are the same kind of decision, and if they are not, what exactly does the work in distinguishing them;
  - the fact that the lower-scoring embryo is not made worse off by being brought into existence instead of the other one, and what that does to the medical director's argument;
  - whether the obligation, if there is one, falls on the parents or on the clinic, and what follows for a clinic asked to transfer an embryo it believes is not the best available;
  - a complication our genetics consultant raised: these scores were calibrated largely on cohorts of European ancestry and predict substantially less well for patients of other ancestries, so a best-first rule would bind different families unequally;
  - whether a middle option — for instance, letting parents choose freely among the top-scoring few but not the bottom — is coherent or merely a way of avoiding the question;
  - what the policy would say to people who already exist and would score low, and whether that is a reason to abandon the policy or only to word it carefully;
  - the strongest version of the medical director's case, stated so that he would recognize it as his own.

  No citations, please; the committee knows the literature, and I need something they can argue with rather than a reading list. Keep it to about three pages, and end with a motion I can put on the table verbatim.
reasoning: |-
  Here's a thinking process that leads to the drafted memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Reproductive Ethics Committee (REC) at an academic medical center.
      *   **Context:** The Chair is currently an IVF patient at the same clinic (conflict of interest, recusing from vote).
      *   **Task:** Draft a written opinion/memo for the committee regarding a new policy question.
      *   **Issue:** The lab now returns polygenic risk scores (PRS) for normal-range traits. The Medical Director wants a "Best First" policy (mandatory transfer of highest-scoring embryo unless parents have an accepted reason). A specific case is pending (couple wants to transfer lower-scoring embryo).
      *   **Options:** 1) Mandatory "Best First", 2) Parental Autonomy (selection left to parents), 3) Halt returning non-medical scores.
      *   **Required Content/Reasoning:**
          *   Distinction between selecting against disease vs. normal-range traits.
          *   Non-identity problem (lower-scoring embryo isn't harmed by not being selected).
          *   Locus of obligation (parents vs. clinic).
          *   Ancestry bias/inequity in PRS data.
          *   Coherence of middle options (top few vs. bottom).
          *   Message to existing people who would score low.
          *   Strongest version of the Medical Director's argument (Principle of Beneficence/Procreative Beneficence).
      *   **Constraints:** No citations, ~3 pages, substantive reasoning, end with a specific motion, timeline tied to next cycle (6 weeks out).
      *   **Tone:** Professional, ethical, analytical, personal but objective (acknowledging the conflict without letting it dominate).

  2.  **Determine the Stance:**
      *   *Option 1 (Mandatory Best First):* Problematic due to ancestry bias, definitional issues of "best," and overreach of clinic authority into parental values.
      *   *Option 2 (Parental Autonomy):* Respectful, but ignores the potential harm of offering misleading data and the equity issues.
      *   *Option 3 (Halt Non-Medical Scores):* This seems the most ethically robust given the ancestry bias and the slippery slope of "designer babies," while acknowledging the Medical Director's intent. It resolves the immediate conflict and the equity issue.
      *   *Decision:* I will argue for **Option 3 (Halt returning non-medical scores)**, with a transition period. This allows for a clear policy shift that addresses the equity concern and the conceptual confusion between disease prevention and trait enhancement, while respecting the Chair's recusal (by making the argument structural rather than personal).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the conflict of interest (Chair is a patient), state recusal from voting, but affirm duty to draft the analysis. State the recommendation clearly upfront.
      *   **The Medical Director's Argument (Steel-manning):** Need to articulate the "Procreative Beneficence" argument clearly. If we prevent disease, why not promote health/trait optimization? It's a continuum. The clinic has a duty to the future child's welfare.
      *   **Disease vs. Normal-Range Traits:** This is the crux. Disease selection is about avoiding suffering/pathology. Trait selection is about optimization within a normal range. The moral weight differs. One is therapeutic, the other is enhancement.
      *   **The Non-Identity Problem:** Address the Director's point. The unselected embryo isn't harmed. But the *policy* creates a social harm. The obligation isn't to the specific embryo not chosen, but to the social meaning of the choice.
      *   **Locus of Obligation:** Does the duty lie with the parents or the clinic? The clinic facilitates; parents bear the child. Mandatory clinic enforcement turns the clinic into a gatekeeper of "worthwhile lives."
      *   **Ancestry/Equity:** This is the killer argument against "Best First." If the data is biased, the policy is discriminatory. It imposes a "best" standard that is scientifically invalid for non-European populations.
      *   **Message to Existing People:** A policy that ranks lives implies some lives are objectively worse. This stigmatizes existing people with those traits.
      *   **Middle Options:** "Top few" is arbitrary. Where is the cutoff? It doesn't solve the equity or stigma problem.
      *   **Recommendation & Timeline:** Halt the reporting of non-medical polygenic scores. 6-week timeline to adjust lab protocols.
      *   **Motion:** Verbatim text for the meeting.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the specific couple? *Adjustment:* Mention them as the catalyst but keep the policy general.
      *   *Check:* Is the tone too personal? *Adjustment:* Keep the "I am a patient" disclosure brief and professional. Focus on the ethics, not my embryos.
      *   *Check:* Did I cover the "noise" argument? *Adjustment:* Incorporate the scientific uncertainty into the equity/validity section.
      *   *Check:* Is the distinction between disease and traits clear? *Adjustment:* Use the threshold of "pathology" vs. "variation."
      *   *Check:* Did I answer the "obligation" question? *Adjustment:* Argue that while parents might feel an obligation, the *clinic* cannot enforce it without becoming eugenic in practice.

  5.  **Drafting the Content (incorporating the required points):**

      *   *Intro:* Recusal statement. Recommendation: Halt non-medical scores.
      *   *Director's Case:* Beneficence. If we prevent cystic fibrosis, why not select for higher education/health propensity? It minimizes suffering/maximizes opportunity.
      *   *Distinction:* Disease = restoring/protecting normal function. Traits = ranking normal variations. The moral urgency differs.
      *   *Non-Identity:* The Director says we owe the "best" child. But the child who exists isn't harmed by not being the *other* child. The harm is symbolic/social.
      *   *Obligation:* Parents decide values. Clinic provides medical safety. Clinic enforcing "best" imposes a single theory of the good life.
      *   *Equity:* The ancestry bias makes "Best First" scientifically unsound and unjust. It privileges European ancestry patients with more accurate data.
      *   *Existing People:* Ranking embryos ranks people. Implies short people (like the partner) are "worse" outcomes.
      *   *Middle Ground:* Arbitrary cutoffs don't fix the bias or the stigma.
      *   *Conclusion:* Stop reporting. Focus on health.
      *   *Motion:* Specific wording.

  6.  **Review against Constraints:**
      *   No citations? (Check).
      *   ~3 pages? (Need to monitor length. Dense paragraphs help).
      *   Timeline included? (6 weeks).
      *   Motion verbatim? (Yes).
      *   Addressed all 7 bullet points? (Check).

  7.  **Final Polish:** Ensure the voice sounds like an Ethics Chair—measured, principled, but decisive. Ensure the conflict of interest is handled transparently but doesn't undermine the authority of the memo. (The prompt says "I have told the vice chair I will recuse from the vote, so the memo needs to stand on its own." This implies the memo *is* the contribution, despite the recusal).

      *(Self-Correction on Tone)*: Be careful not to sound like I'm advocating for *my* specific embryo choice. The argument must be systemic. The partner's height is mentioned in the prompt as the couple's reason; I should use that to illustrate the stigma point without making it about *my* partner specifically in the text, to maintain professional distance, though the prompt implies I am the Chair *and* the patient. I will acknowledge the personal stake but keep the argument universal.

      *(Refining the "Halt" recommendation)*: Is "Halt" too extreme? The prompt offers it as an option. Given the ancestry bias and the ethical quagmire, it's the cleanest ethical cut. It avoids the "Best First" coercion and the "Parental Choice" endorsement of questionable science. I will stick with Halt.

      *(Timeline)*: Next cycle start is 6 weeks out. Policy needs to be in place by then.

      *(Motion)*: Needs to be actionable.

  8.  **Final Word Count Check:** Aiming for roughly 1,200-1,500 words to fit "about three pages" single-spaced standard memo format.

      *(Wait, one nuance)*: The prompt asks me to "land on one of three positions." I need to make sure I explicitly choose one. I will choose **Halt to returning non-medical scores**. This sidesteps the coercion of "Best First" and the ethical endorsement of "Parental Choice" regarding non-medical traits.

      *(Wait, another nuance)*: The prompt asks to work through specific points. I need to ensure headers or clear transitions cover: Disease vs. Trait, Non-Identity, Obligation Locus, Ancestry, Middle Option, Existing People, Director's Case.

      Let's write.

      *(Post-Draft Review)*: Does the memo acknowledge the Chair's patient status appropriately? Yes, in the header/intro. Does it avoid citations? Yes. Is the motion clear? Yes.

      *One final check on the "Middle Option"*: The prompt asks to evaluate if it's coherent or avoidance. I need to be explicit that it is avoidance/arbitrary.

      *One final check on "Existing People"*: Need to ensure the language about "low scorers" doesn't sound dehumanizing while discussing the policy's effect on them.

      Okay, ready to generate.cs
answer: |-
  **MEMORANDUM**

  **TO:** Reproductive Ethics Committee
  **FROM:** Committee Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation Regarding Polygenic Risk Scoring for Non-Medical Traits

  **Conflict of Interest Statement**
  As you know, I am currently a patient in the IVF program we oversee. My partner and I have received polygenic risk scores (PRS) for our embryos. In accordance with committee bylaws, I will recuse myself from the final vote on this policy. However, as Chair, I retain the responsibility to frame the ethical analysis for this meeting. The following recommendation is drafted to stand on its own merits, independent of my personal situation, though I do not pretend my proximity to the data does not sharpen the urgency of this inquiry.

  **Recommendation**
  I recommend the committee adopt the third option under consideration: **an immediate halt to the return of polygenic scores for traits falling within the normal range.** This moratorium should be permanent pending significant improvements in predictive validity across all ancestries and a broader societal consensus on the ethics of trait selection. We should continue to report on serious chromosomal abnormalities and monogenic diseases, but we must cease ranking embryos on traits such as height, educational attainment, or general wellness propensity.

  This position rejects the Medical Director's proposal for a mandatory "Best First" transfer policy. It also declines to endorse a policy of unrestricted parental autonomy regarding these specific scores, as offering the data implicitly validates its clinical utility.

  **The Medical Director's Argument**
  To ensure we do not dismiss the opposing view lightly, we must state the Medical Director's case in its strongest form. His argument rests on a principle of Procreative Beneficence. We already accept that clinicians and parents have a moral obligation to prevent serious suffering. If we select against an embryo with Tay-Sachs, we are acknowledging that a life without Tay-Sachs is preferable to a life with it. The Director argues this is a continuum. If we have data suggesting one embryo has a higher statistical probability of better health, higher educational attainment, or greater longevity, ignoring that data is morally equivalent to ignoring a carrier status for a serious disease. He contends that if the clinic knows which embryo offers the "best start," facilitating the selection of a "lesser" embryo makes the clinic complicit in preventable disadvantage. On this view, the clinic is not imposing values but minimizing harm and maximizing opportunity for the future child.

  **Disease Prevention vs. Trait Selection**
  This continuum argument fails because it conflates two distinct categories of moral decision-making: preventing pathology versus optimizing variation. Selecting against a serious disease is a therapeutic intervention; it aims to bring a future person into existence above a threshold of suffering or functional impairment. Selecting for a normal-range trait is an enhancement intervention; it aims to rank lives that are already above that threshold.

  The moral weight of medicine is grounded in the restoration or protection of health. When we select against a lethal condition, we are acting on a consensus that the condition constitutes a harm. When we select for height or polygenic wellness scores within the normal range, we are acting on a preference for one type of normal life over another. There is no consensus that a taller life is medically "better" than a shorter one, only that it may be socially advantaged. By treating these decisions as identical, the "Best First" policy medicalizes social preferences and expands the definition of medical harm to include any statistical disadvantage.

  **The Non-Identity Problem and Obligation**
  The Director's argument relies on the assumption that we owe the future child the "best" possible start. However, we must grapple with the non-identity problem. The lower-scoring embryo is not made worse off by being brought into existence instead of the higher-scoring one. The alternative for the lower-scoring embryo is not to exist as the higher-scoring one; it is not to exist at all. Therefore, the child born from the lower-scoring embryo cannot claim they were harmed by the selection, provided their life is worth living.

  This shifts the locus of obligation. If the child is not harmed, the obligation to select the "best" embryo is not a duty owed *to the child* in a rights-based sense. It is a preference held by the parents or the clinic. If the obligation is not medical (preventing disease), it falls within the realm of parental values. The clinic's role is to ensure safety and informed consent, not to enforce a specific theory of the good life. A mandatory "Best First" policy transforms the clinic from a service provider into a moral gatekeeper, asserting that the institution knows better than the parents what kind of child should be born.

  **Equity and Ancestry**
  Even if we accepted the premise that trait selection is ethically permissible, the "Best First" policy is currently unimplementable without violating principles of justice. As our genetics consultant noted, these polygenic scores are calibrated largely on cohorts of European ancestry. They predict substantially less well for patients of African, Asian, or Hispanic ancestry.

  A mandatory policy would therefore bind families unequally. For a patient of European ancestry, the "Best First" rule would be enforced based on relatively robust data. For a patient of non-European ancestry, the same rule would be enforced based on noisy, potentially inaccurate data. This creates a two-tiered system where the reproductive choices of marginalized populations are more heavily restricted by less reliable science. We cannot mandate a policy that systematically applies stricter eugenic standards to patients based on their race.

  **The Message to Existing People**
  We must also consider the expressive harm of this policy. A clinic policy that mandates the selection of the "highest scoring" embryo sends a message to people currently living with those traits. If we refuse to transfer an embryo because it scores low for height, we are implicitly stating that a short life is a worse outcome than a tall one.

  The couple currently on our agenda cites this explicitly: one partner, who is short, objects to a policy implying her own life was the "worse outcome." This is not merely sentimental; it is a valid ethical objection regarding stigma. While we might argue that we are only discussing probabilities, the social meaning of the policy is hierarchical. It ranks human worth. We should be extremely cautious about adopting institutional policies that suggest some existing lives are objectively less desirable than others, particularly when the traits in question are within the normal range.

  **Middle Options**
  Some have suggested a compromise: allow parents to choose freely among the top-scoring quartile, but not the bottom. This is not a coherent ethical position; it is merely a way of avoiding the question. It retains the ancestry bias (the "top" is harder to define for non-European patients). It retains the stigma (the "bottom" is still marked as unacceptable). And it retains the clinic's role as arbiter of value, merely moving the cutoff line. If the selection of normal-range traits is not a medical necessity, the clinic has no business drawing a line anywhere on the spectrum.

  **Conclusion and Timeline**
  The introduction of non-medical polygenic scoring has outpaced our ethical framework. The science is not equitable enough to mandate its use, and the ethics are not settled enough to permit its encouragement. The "Best First" policy is coercive and unjust. Unrestricted parental choice with clinic-provided scores validates questionable science. The only ethically defensible position is to return to the standard of medical necessity.

  We have approximately six weeks before the next cycle start. This is sufficient time to update laboratory reporting protocols to exclude non-medical polygenic traits.

  **Motion**
  I propose the following motion for the committee's consideration:

  > "Motion to suspend the reporting of polygenic risk scores for non-medical, normal-range traits effective immediately. The laboratory shall cease generating or releasing embryo scores for traits such as height, educational attainment, or general wellness propensity until such time as predictive validity is equitable across all ancestral populations and the Reproductive Ethics Committee approves a framework for the ethical return of such data. Embryos shall continue to be screened for chromosomal abnormalities and monogenic conditions consistent with current medical standards. This policy shall be fully implemented prior to the start of the next IVF cycle cohort, six weeks from today."
