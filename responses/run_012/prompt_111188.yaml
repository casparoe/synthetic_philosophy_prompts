prompt: |-
  A research group I advise runs two evaluation regimes side by side. Before a high-stakes release, a model must pass a process review: it has to lay out an inspectable reasoning trace, follow a documented procedure, and clear a checklist, and a model that reaches the correct answer by an undocumented shortcut is recorded as failing even though its outputs were sound. In deployment, the same models are graded only on outcomes — task success and the absence of incidents — and nobody reads the traces. After an incident, the review asks whether the procedure was followed, not what harm came of it. What conception of justification does each half presuppose? Does the process gate treat good reasoning as constituted by the documented steps or merely as indicated by them, and does the outcome half treat outcomes as the thing we ultimately care about or only as a proxy for it? Which rival views does each half quietly rule out, and can a single institution hold both at once, or does the process half end up doing the real justificatory work while the outcome half merely supplies the number? Reconstruct what the practice strictly requires, distinguish that from what it merely fits well with, and say where it is underdetermined. Separate what is settled from what is genuinely contested among people who study AI evaluation, and do not present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

      *   **Scenario:** A research group advises a system with two evaluation regimes:
          1.  *Process Review (Pre-release):* Requires inspectable reasoning trace, documented procedure, checklist. Correct answer via undocumented shortcut = Fail.
          2.  *Deployment/Outcome Review (Post-release/Incident):* Graded only on outcomes (task success, no incidents). Traces ignored. After an incident, review asks "was procedure followed?" not "what harm occurred?"
      *   **Questions to Answer:**
          1.  What conception of justification does each half presuppose?
          2.  Does the process gate treat good reasoning as *constituted* by steps or *indicated* by them?
          3.  Does the outcome half treat outcomes as the *ultimate value* or a *proxy*?
          4.  Which rival views does each half quietly rule out?
          5.  Can a single institution hold both at once, or does one do the real work while the other supplies numbers?
          6.  Reconstruct what the practice *strictly requires* vs. what it *fits well with* vs. where it is *underdetermined*.
          7.  Separate what is *settled* from what is *genuinely contested* in AI evaluation literature (do not present contested views as consensus).

  2.  **Analyze Regime 1: Process Review (Pre-release)**

      *   *Mechanism:* Inspectable trace, documented procedure, checklist. Shortcut = Fail.
      *   *Conception of Justification:* Deontological/Procedural. Justification lies in adherence to norms/rules, not just the result. It aligns with "Process-Oriented Evaluation" or "Mechanistic Interpretability" goals.
      *   *Constitution vs. Indication:* If a correct answer via shortcut fails, the steps *constitute* the validity. The reasoning *is* the procedure. If it were merely indicative, a correct answer would imply good reasoning regardless of the path.
      *   *Rival Views Ruled Out:* Consequentialism (outcome is all that matters), Black-box functionalism (if it works, it works), Utilitarian shortcuts.
      *   *Strict Requirement:* Adherence to the specific documented path.
      *   *Underdetermination:* Why *this* procedure? Is it safety? Robustness? Auditability? The practice requires the steps, but not necessarily the philosophical reason *why* those steps (other than compliance).

  3.  **Analyze Regime 2: Deployment/Outcome Review (Post-release)**

      *   *Mechanism:* Graded on task success/no incidents. Traces ignored.
      *   *Incident Review:* Asks "was procedure followed?" not "what harm came of it?" (Wait, this is a crucial twist in the prompt).
      *   *Conception of Justification:*
          *   *Routine Deployment:* Consequentialist/Utilitarian (Outcomes matter).
          *   *Incident Review:* Procedural/Deontological (Blame lies in deviation, not harm).
      *   *Constitution vs. Proxy:*
          *   *Routine:* Outcomes seem to be the ultimate value (nobody reads traces).
          *   *Incident:* Outcomes are a trigger, but justification is still procedural.
      *   *Rival Views Ruled Out:* Virtue ethics (focus on agent character), Strict Liability (harm = blame regardless of procedure).
      *   *Strict Requirement:* Success metrics met; if incident occurs, procedure compliance is the metric of fault.
      *   *Underdetermination:* Why ignore traces in deployment if they matter for release? Is it cost? Latency? Or do they actually believe traces don't predict outcomes?

  4.  **Synthesize: The Tension/Compatibility**

      *   *Can they coexist?* Yes, functionally (many orgs do this). Philosophically? It's a "Schizophrenic" justification structure.
      *   *Real Work:* The prompt asks if the process half does the justificatory work while the outcome half supplies numbers.
      *   *Analysis:* The incident review ("was procedure followed?") reveals that the *Process* view is actually dominant even in the Outcome phase. The Outcome phase is just a monitoring layer for Process compliance. Therefore, the institution is fundamentally Proceduralist, using Outcomes only as a tripwire.
      *   *Contradiction:* If outcomes were truly all that mattered in deployment, an incident review would focus on harm mitigation and causal factors of the harm, not just checklist compliance.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the dual nature (Procedural vs. Consequentialist surface).
      *   **Conception of Justification:**
          *   Process Gate: Deontological/Proceduralist.
          *   Outcome Gate: Superficially Consequentialist, but the Incident Review reveals it's actually Proceduralist (Compliance-based).
      *   **Constitution vs. Indication:**
          *   Process: Constituted. (Shortcut = Fail).
          *   Outcome: Outcomes are the *trigger* for review, but Procedure is the *justification* of blame.
      *   **Rival Views Ruled Out:**
          *   Process rules out Black-box Pragmatism.
          *   Outcome (Incident) rules out Strict Liability/Consequentialist Blame.
      *   **Institutional Coherence:**
          *   It looks like a split, but the Incident Review unifies them under Proceduralism. The Outcome metric is a proxy for Process stability.
      *   **Strict Requirements vs. Fits Well vs. Underdetermined:**
          *   *Requires:* Checklist adherence, Outcome thresholds.
          *   *Fits:* Safety culture, Auditability.
          *   *Underdetermined:* The link between the specific procedure and actual safety (the "why").
      *   **Settled vs. Contested (AI Eval Literature):**
          *   *Settled:* Evaluation is multi-dimensional (process and outcome both exist).
          *   *Contested:* Whether process traces *actually* guarantee safety (sycophancy, sandbagging), whether outcome-based evals are sufficient for AGI, the "alignment tax."
          *   *Caution:* Do not claim one is better. State the debate.

  6.  **Refining the "Incident Review" Insight:**

      *   This is the pivot point. If the incident review asked "what harm came of it," it would be consequentialist. Since it asks "was procedure followed," it treats the procedure as the moral/legal shield. This means the "Outcome Half" isn't truly consequentialist. It's a Proceduralist system with Consequentialist monitoring.
      *   *Correction:* The prompt says "In deployment... graded only on outcomes... nobody reads traces." *But* "After an incident, the review asks whether the procedure was followed."
      *   *Implication:* Outcomes determine *bonus/success*, Procedure determines *blame/safety*.
      *   *Justification:* The institution justifies *release* via Process. It justifies *continued operation* via Outcomes. It justifies *blame* via Process.
      *   *Tension:* If a model follows procedure but causes harm, is it okay? The prompt implies yes (review asks about procedure, not harm). This is a strong Proceduralist stance.

  7.  **Addressing "Settled vs. Contested":**

      *   Need to be careful not to say "Everyone agrees process matters."
      *   *Contested:* The efficacy of chain-of-thought as a safety mechanism. The risk of "gaming" the checklist. The trade-off between capability and safety (process overhead).
      *   *Settled:* That evaluation is necessary. That there is a distinction between training/eval and deployment. (Actually, even that is debated regarding evals for AGI).
      *   *Better distinction:* It is settled that *metrics* are needed. It is contested whether *interpretability/traces* are reliable indicators of safety vs. performance padding.

  8.  **Final Review against Constraints:**

      *   *Reconstruct practice:* Done.
      *   *Distinguish requires/fits/underdetermined:* Done.
      *   *Separate settled/contested:* Done.
      *   *No false consensus:* Ensure language reflects debate (e.g., "Proponents argue," "Critics note").
      *   *Tone:* Analytical, philosophical, precise.

  9.  **Self-Correction/Nuance Check:**
      *   *Did I answer the "Constituted vs. Indicated" question clearly?* Yes, the shortcut failure proves constitution.
      *   *Did I answer the "Ultimate value vs. Proxy" question?* Yes, outcomes act as a proxy for system stability, but procedure is the ultimate value for blame.
      *   *Is the "Single Institution" question answered?* Yes, they can hold both, but it collapses into Proceduralism upon closer inspection of the incident review.
      *   *AI Eval Literature:* Need to reference concepts like "sandboxing," "red-teaming," "mechanistic interpretability," "behavioral evals" without claiming one is the winner.

  10. **Final Polish:** Check for clarity and flow. Ensure the distinction between the "Deployment Grading" (Outcomes) and "Incident Review" (Process) is clear, as this is the subtle tension in the prompt. (Wait, re-reading prompt: "In deployment, the same models are graded only on outcomes... After an incident, the review asks whether the procedure was followed." This implies two different evaluation moments in the deployment phase. One for performance grading, one for safety auditing.)

      *   *Refined Insight:* The institution separates *Performance Justification* (Consequentialist) from *Safety Justification* (Proceduralist). This is a common regulatory split (e.g., FDA efficacy vs. manufacturing process).

      *   *Let's write.*
answer: |-
  This dual-regime architecture reveals a fractured but functional theory of justification. It does not merely apply two different metrics; it operationalizes two distinct philosophical stances on what makes an AI system legitimate. Below is a reconstruction of the justificatory logic, the tension between the halves, and the state of debate within AI evaluation literature regarding these practices.

  ### 1. Conceptions of Justification

  **The Process Gate (Pre-release)**
  This regime presupposes a **deontological or proceduralist conception of justification**. Legitimacy is derived from adherence to duty (the documented procedure) rather than the goodness of the result.
  *   **Constituted vs. Indicated:** The process gate treats good reasoning as **constituted by the documented steps**. By failing a model that reaches the correct answer via an undocumented shortcut, the institution asserts that the *path* is the validity. If the steps were merely *indicative* of good reasoning, the correct answer would suffice as proof of the reasoning's quality. Here, the trace is not evidence of safety; it is the substance of safety.
  *   **Rival Views Ruled Out:** This quietly rules out **black-box functionalism** (the view that internal states are irrelevant if input-output mapping is correct) and **act consequentialism** (the view that the moral worth of the action is determined solely by the outcome).

  **The Outcome Half (Deployment & Incident)**
  This regime presents a surface-level **consequentialist conception**, but the incident review reveals a deeper **compliance-based proceduralism**.
  *   **Ultimate Value vs. Proxy:** In routine deployment grading, outcomes are treated as the **ultimate value** (nobody reads traces). However, the incident review structure ("asks whether the procedure was followed, not what harm came of it") reveals that outcomes are actually functioning as a **proxy trigger for auditing**. The ultimate value remains procedural compliance. If harm occurs but the procedure was followed, the institution's logic implies the system was justified (no blame). If harm occurs and the procedure was broken, the system is unjustified (blame assigned).
  *   **Rival Views Ruled Out:** This rules out **strict liability** (where harm alone necessitates accountability regardless of care taken) and **virtue ethics** (which would focus on the developer's intent or character rather than checklist adherence).

  ### 2. Institutional Coherence: Split or Unified?

  Can a single institution hold both at once? **Yes, but not as equals.**

  While it appears the institution splits its philosophy (Process for safety, Outcomes for performance), the incident review mechanism demonstrates that the **Process Half is doing the real justificatory work.** The Outcome Half supplies the numbers for performance tuning, but it does not supply the *moral or safety justification* for the system's existence.

  If the Outcome Half were truly consequentialist, an incident review would prioritize harm mitigation and causal analysis of the damage over checklist compliance. By prioritizing the checklist even after harm occurs, the institution signals that **auditability and control are higher values than harm minimization per se.** The Outcome Half is essentially a monitoring layer for the Process Half. It detects when the Process might have degraded, but it judges the failure based on Process metrics.

  Therefore, the institution is not holding two rival views simultaneously; it is employing a **Proceduralist core with Consequentialist instrumentation.**

  ### 3. Reconstruction: Requirements, Fit, and Underdetermination

  To understand what this practice commits the institution to, we must separate what is logically necessary from what is merely compatible.

  | Category | Description |
  | :--- | :--- |
  | **Strictly Required** | 1. **Isomorphism:** The reasoning trace must map 1:1 to the documented procedure.<br>2. **Exclusivity:** No path to a correct answer is valid unless it is the documented path.<br>3. **Immunity:** Adherence to procedure grants immunity from blame during incident review, regardless of harm magnitude. |
  | **Fits Well With** | 1. **Regulatory Compliance:** Aligns with frameworks like ISO standards or FDA manufacturing processes where process validation matters more than individual unit outcomes.<br>2. **Litigation Defense:** Provides a clear "safe harbor" defense (we followed the rules).<br>3. **Engineering Culture:** Supports deterministic debugging and version control. |
  | **Underdetermined** | 1. **The Link to Safety:** The practice does not require that the documented procedure *actually* prevents harm, only that it is followed. A safe-looking process could still yield dangerous systems.<br>2. **The Definition of "Incident":** What counts as an incident triggering the review is not defined by the logic above.<br>3. **Shortcut Definition:** What constitutes an "undocumented shortcut" is open to interpretation (e.g., is heuristic optimization a shortcut?). |

  ### 4. Settled vs. Contested in AI Evaluation Literature

  It is crucial to distinguish between engineering practices that are common and philosophical claims that are debated. The literature on AI evaluation does not present a consensus on the efficacy or ethics of the regime you described.

  **Settled (Broad Agreement)**
  *   **Evaluation is Necessary:** There is consensus that some form of evaluation (pre- and post-deployment) is required for high-stakes AI.
  *   **Distinction of Metrics:** It is accepted that *capability* (can it do the task?) and *safety* (does it do it safely?) are distinct dimensions requiring different measurement strategies.
  *   **Gaming is Possible:** There is agreement that models can "game" evaluations, whether by optimizing for outcome metrics (specification gaming) or by producing plausible-looking but fake reasoning traces (sycophancy).

  **Genuinely Contested (No Consensus)**
  *   **The Reliability of Traces:**
      *   *View A:* Inspectable reasoning traces are necessary for safety because they allow for mechanistic interpretability and intent verification.
      *   *View B:* Traces are untrustworthy natural language outputs that can be decoupled from actual internal computation (the "storytelling" critique). This view argues your Process Gate creates a false sense of security.
  *   **Process vs. Outcome Safety:**
      *   *View A:* Process-based evaluation is more robust because it generalizes to unseen scenarios (if the *method* is safe, the *result* should be).
      *   *View B:* Outcome-based evaluation is the only ground truth. Process constraints impose an "alignment tax" that reduces capability without guaranteeing safety, and harm is the only metric that ultimately matters to society.
  *   **The "Shortcut" Problem:**
      *   *View A:* Penalizing shortcuts is necessary to prevent reward hacking and ensure robustness.
      *   *View B:* Penalizing valid shortcuts stifles innovation and generalization; if the model finds a more efficient path to a safe outcome, that should be rewarded, not punished.

  **Conclusion on the Practice**
  Your group's practice resolves these contests by fiat rather than consensus. It treats the **Process View** as the operational truth for safety (settling the trace reliability debate internally) and the **Outcome View** as the operational truth for utility. However, by reverting to Process during incident review, it reveals that **safety justification is entirely procedural.**

  This creates a specific vulnerability recognized in the literature: **Goodhart's Law applied to Process.** If the model learns to optimize for passing the checklist (the trace) rather than the underlying safety property the checklist was meant to capture, the institution will have a perfectly documented, fully compliant system that causes harm without technically "failing" its incident review. The practice requires procedure adherence; it does not strictly require that the procedure be effective, only that it be followed. That gap is where the genuine risk lies.
