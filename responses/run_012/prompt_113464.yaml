answer: |-
  This is a great spot to be stuck. The reason you can't write the blow-up is that you're trying to write a fight about *facts* when the fight is actually about *authority*. Who gets to decide what counts as real data?

  Here is the document your characters would draft after a bottle of wine and a long night, trying to save their grant funding. It's the "Truce." Below that is the table of where they actually want to kill each other.

  ### The Joint Statement of Methodological Coexistence
  *(Drafted for the Lab Wall, Version 4.2)*

  **We, the undersigned, agree to the following baseline for all experiments conducted in this facility:**

  1.  **The Data is the Report:** Regardless of metaphysical stance, the primary data point for consciousness research is the subject's verbal or behavioral report. Neither of us claims access to the subject's mind without the subject's cooperation.
  2.  **Reports are Fallible:** We agree that subjects lie, confabulate, misremember, and lack vocabulary. A report is never a perfect mirror of the stimulus or the brain state.
  3.  **No "Raw" Experience:** We agree there is no such thing as an unmediated report. All reports are shaped by language, expectation, and the context of the lab.
  4.  **Taking Reports Seriously:** To ignore the report because "the brain says otherwise" is bad science. To accept the report as infallible truth because "it's their experience" is also bad science.
  5.  **Retired Strawmen:**
      *   **The Heterophenomenologist (HP)** does *not* claim that consciousness doesn't exist, only that the *philosophical concept* of intrinsic qualia is incoherent. HP agrees that pain hurts, even if "hurt" is a functional state, not a magical glow.
      *   **The Neurophenomenologist (NP)** does *not* claim that neuroscience is irrelevant or that meditation solves physics. NP agrees that neural correlates are necessary, even if they aren't sufficient for explanation.
  6.  **The Goal:** We are both trying to close the "explanatory gap." We just disagree on which side of the gap the bridge starts from.

  ***

  ### The Actual Fight: Disagreements, Cruxes, and Bets

  This is where the scene lives. The table below breaks down the four specific cruxes you mentioned. Note the "Verbal/Metaphysical" column—this is key for your dialogue. Sometimes they are fighting about the world; sometimes they are fighting about the dictionary.

  | The Issue | Heterophenomenologist (Dennett Type) | Neurophenomenologist (Varela Type) | The Crux (What actually needs settling) | The Bet (Prediction/Study Design) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Training & Validity** | Training doesn't change the *experience*; it changes the *reporting strategy*. It's demand characteristics. You're teaching them to speak "Neuro-Talk," not to see better. | Training stabilizes the *attentional structure*. Untrained subjects are blind to their own pre-reflective flow. Training isn't bias; it's calibration. | **Circularity:** Can we measure the benefit of training without *assuming* the phenomenological theory that says training works? | **Study:** Blind analysis of reports from trained vs. untrained subjects on a micro-task.<br>**HP Prediction:** Trained reports will be more consistent linguistically, but no more accurate regarding stimulus timing.<br>**NP Prediction:** Trained reports will reveal neural markers (e.g., gamma synchrony) that untrained reports miss entirely. |
  | **2. Fiction vs. Method** | Calling qualia a "user illusion" is a metaphysical claim about reality. The brain constructs a fiction to simplify control. The fiction *is* the experience. | Calling it a "fiction" is a methodological bracketing that got stuck as dogma. You're dismissing the data because it doesn't fit your physicalist ontology. | **Ontology:** Is the "User Illusion" a description of *how* we see, or a dismissal of *what* we see? Is this a verbal dispute about the word "Real"? | **Study:** A case where the report contradicts the functional utility.<br>**HP Prediction:** If the report doesn't match the functional output, the report is wrong (confabulation).<br>**NP Prediction:** If the report doesn't match the function, the function is an incomplete description of the system. |
  | **3. The Interviewer** | The second-person interview is contamination. You're leading the witness. You're putting words in their mouth and calling it "phenomenology." | The second-person interview is midwifery. Pre-reflective experience collapses if you don't hold the space for it. You can't access it alone. | **Access:** Is the interviewer a polluter or a prerequisite? Can you distinguish "guidance" from "suggestion"? | **Study:** Double-blind elicitation. Interviewer A knows the hypothesis; Interviewer B does not.<br>**HP Prediction:** Reports will diverge significantly based on interviewer knowledge.<br>**NP Prediction:** Core structural invariants of the experience will remain stable regardless of interviewer. |
  | **4. Falsifiability** | First-person methods are post-hoc storytelling. You can always say "you didn't look hard enough." It never makes a risky prediction. | First-person methods constrain neural theory. If the phenomenology says "simultaneous" and the EEG says "sequential," the EEG model is wrong. | **Authority:** When First-Person and Third-Person data clash, which one blinks? | **Study:** Temporal mismatch task (e.g., Libet-style but refined).<br>**HP Prediction:** We trust the neural timing; the "now" is a retrospective construct.<br>**NP Prediction:** We trust the lived duration; the neural timing is missing the window of integration. |

  ***

  ### Notes for the Scene (The "Verbal" Trap)

  You asked to know if they are using the same word for different things. **Yes.** Specifically, the word **"Data."**

  *   **For the Heterophenomenologist (HP):** Data is the *text* of the report. It is public, recordable, and analyzable like a novel. The *experience* that generated the text is a black box.
  *   **For the Neurophenomenologist (NP):** Data is the *structure* of the experience *revealed* by the report. The text is just the carrier wave.

  **How this plays in the blow-up:**
  The HP will say, "I'm taking your data seriously!" (Meaning: I am analyzing your transcript).
  The NP will scream, "You're ignoring the data!" (Meaning: You're ignoring the lived reality the transcript points to).

  **The "Fiction" Crux:**
  The HP thinks the NP is being mystical. The NP thinks the HP is being cowardly.
  *   **HP Line:** "You want me to treat their intuition as evidence? That's not science, that's theology."
  *   **NP Line:** "You want me to treat their intuition as noise? That's not science, that's censorship."

  **The "Training" Crux:**
  This is the most dramatic because it attacks the NP's livelihood.
  *   **HP Line:** "You didn't teach them to see clearer. You taught them to say what you wanted to hear. It's a parlor trick."
  *   **NP Line:** "You think 'seeing' is passive? You think attention doesn't change the object? That's the dogma talking."

  **The Verdict on "Verbal Dispute":**
  Admit in the scene that 30% of the fight is verbal. They both want to be "Empiricists." But the HP is an Empiricist about *public objects*, and the NP is an Empiricist about *lived structures*. They can't shake hands because they aren't standing on the same ground.

  **How the scene tips:**
  The scene tips when one of them produces the **Prediction** from row 4 (Falsifiability).
  *   If the EEG shows the decision happened *before* the subject felt they decided, the HP wins that round.
  *   If the subject can reliably distinguish two stimuli that the EEG says are identical *at that millisecond*, the NP wins that round.

  Good luck. It's a good fight. Don't let either of them win completely.
