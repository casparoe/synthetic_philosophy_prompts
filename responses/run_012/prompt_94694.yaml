answer: |-
  **The Limit Case**

  Start the clock. At thirty seconds, on.
  At forty-five, the circuit breaks to dark.
  Then fifty-six and fifteen, gone then dawn,
  Each interval halved, a recurring spark.
  The moments crowd until they touch the wall
  Of one minute, where the series must end.
  Infinite switches rise and then they fall
  Within a finite span, where logics bend.

  So ask the state when final time arrives:
  Is filament hot, or cold, or fused to dust?
  The law of excluded middle strives
  To force a binary where none is just.

  The series converges, but the state does not,
  For nothing in the sum dictates the lot.

  The instructions do not settle what remains.
