answer: |-
  # Activity: The Ledger of Occasions

  **Class Size:** 14 Students (3 Tables of 4-5)
  **Time:** 25-30 Minutes Activity + 25 Minutes Debrief
  **Materials:**
  *   3 Decks of standard playing cards (remove Kings, Queens, Jacks; keep Ace-10).
  *   3 Envelopes, sealed, labeled "PROTOCOL."
  *   3 Score sheets (paper).
  *   3 Pens.
  *   A visible timer (projected or phone).

  ## 1. The Setup & Roles (3 Minutes)
  Divide the class into three tables. At each table, assign roles. If a table has 5 students, there are two **Agents**.

  *   **The Agent (Cause):** Holds the "Cause" cards (Red suits: Hearts/Diamonds). Their job is to propose an event.
  *   **The Patient (Effect):** Holds the "Effect" cards (Black suits: Spades/Clubs). Their job is to receive the event.
  *   **The Scribe (The Habit):** Holds the Score Sheet and the Sealed Envelope. They do not speak. They only mark "Valid" or "Invalid."
  *   **The Observer (Philosopher):** Watches the interaction. Takes notes on *why* connections succeeded or failed. (If 5th student, they are a second Agent).

  **The Goal:** The table's goal is to maximize "Validated Connections." A connection is validated only if the Scribe marks it on the score sheet. The table with the most validations wins.

  ## 2. The Opening Script (Read this exactly. Do not explain the rules of causation.)

  > "For the next twenty minutes, you are not students. You are investigators mapping the dependencies of a closed system.
  >
  > At your table, you have components of that system. The Agent proposes a state of affairs. The Patient accepts it. The Scribe records whether that transition occurred.
  >
  > There is only one rule: **A connection only counts if the Scribe validates it.**
  >
  > You might notice patterns. You might formulate theories about which Red cards connect to which Black cards. You might assume that a Heart *makes* a Spade appear. That is for you to decide. Your only metric of success is the Scribe's checkmark.
  >
  > Do not ask the Scribe questions. The Scribe does not know the theory; they only know the Protocol.
  >
  > Begin."

  ## 3. The Activity Flow (25 Minutes)

  **Round 1: The Established Habit (7 Minutes)**
  *   **Action:** Agents play Red cards. Patients play Black cards. They touch cards together.
  *   **Scribe Instruction (Inside Envelope 1):** *"Mark Valid for every pair presented, provided the Agent speaks the value of the card aloud before placing it."*
  *   **Experience:** 100% success rate. Students quickly form a "law." (e.g., "If I say 'Four', the Four of Spades works.") They feel the power is in the card or the speech. The world is stable.

  **Round 2: The Suspension (7 Minutes)**
  *   **Action:** Same as above.
  *   **Scribe Instruction (Inside Envelope 2):** *"Mark Valid ONLY if the Agent places the card face down. If placed face up, mark Invalid."*
  *   **Experience:** The "Law" from Round 1 breaks. Cards that worked before now fail. The "power" seems to have vanished from the card value. Students will try to change the card values. It won't help. They must change the *manner* of presentation.
  *   **Crucial Moment:** They realize the connection isn't in the *cards* (the nature of the things), but in the *condition of validation* (the external habit).

  **Round 3: The New Habit (7 Minutes)**
  *   **Action:** Same as above.
  *   **Scribe Instruction (Inside Envelope 3):** *"Mark Valid ONLY if the Agent and Patient swap seats before the connection."*
  *   **Experience:** The previous rule (face down) stops working. A new, arbitrary physical condition is required. The regularity returns, but it is a *different* regularity.
  *   **End:** Call time. Ask Scribes to reveal their Envelopes to their table.

  ## 4. The Debrief (25 Minutes)

  **Phase 1: The Phenomenology of the Break (5 Minutes)**
  *   "Observer, report: When Round 2 started, what was the mood at the table?" (Likely: Confusion, accusation of cheating, frustration).
  *   "Agent: When your card was rejected in Round 2, did the card change? Did its weight, color, or number change?" (No).
  *   "So, the failure was not in the object. Where was the failure?" (In the acceptance).

  **Phase 2: Locating the Power (10 Minutes)**
  *   "In Round 1, you felt a 'law.' You thought Red *caused* Black. In Round 2, that law vanished. Did the universe break? Or did the *habit* change?"
  *   "Look at the Scribe. In the game, the Scribe is the 'Habit.' Was the Scribe's power inside the Red card? No. It was external."
  *   "Ghazālī's Claim: Fire does not burn cotton. God burns the cotton *at the occasion* of the fire. In this game, the Red card did not trigger the Black card. The Protocol triggered the Score."
  *   "If the Protocol changed, did the Red card violate a law? No. The Habit just shifted."

  **Phase 3: The Shift from Hume to Ghazālī (10 Minutes)**
  *   "Hume says: 'Causation is a habit of *my mind*. I expect B after A because I'm used to it.'"
  *   "Ghazālī says: 'No. The habit is *in the world*, but it is not *in the things*. It is held up by Will.'"
  *   "In Round 1, did you feel the habit was in your head? No, you felt it was 'out there' because the Scribe (the world's structure) confirmed it."
  *   "But when Round 2 hit, you realized the 'out there' structure wasn't *necessary*. It was contingent."
  *   "Final Question: If the Scribe can change the rule at any moment, is the world terrifying? Or is it merciful that the Scribe *didn't* change it for the first 7 minutes?" (This sets up the theological pivot).

  ---

  ## 5. Predictable Failure Modes & Fixes

  **1. The "Cheating" Accusation**
  *   **What happens:** In Round 2, students will accuse the Scribe of acting arbitrarily or "breaking the game." They will disengage, thinking the instructor is messing with them.
  *   **The Fix:** During the debrief, own this immediately. "You felt cheated. That is the exact feeling of encountering Occasionalism without the theology. It feels like the ground is pulled out. But ask yourself: Did the Scribe break a rule? No. The Scribe *is* the rule-keeper. The 'cheat' is only a cheat if you assume the Cards had power they never had."

  **2. The Scribe Leaks Info**
  *   **What happens:** The student playing the Scribe smiles, hesitates, or gives a hint that they are following a new rule.
  *   **The Fix:** Instruct Scribes *before* class starts (if possible) or give a stern verbal warning: "The Scribe is a machine. No facial expressions. If you leak info, your table forfeits the win." If it happens, use it in debrief: "Even the hint suggested the power lay with the Scribe, not the Card."

  **3. Students Focus on Winning, Not Mechanism**
  *   **What happens:** They just try to brute-force points without analyzing *why* points are awarded.
  *   **The Fix:** The Observer role is critical. During the debrief, call on the Observers first. "Observer, what theory did the Agents hold in Round 1? How did the data in Round 2 falsify it?" Force them to articulate the failed causal theory.

  ---

  ## 6. The Gaps: What This Activity Cannot Do

  You asked for a frank list of where the simulation fails to capture Ghazālī's actual position. You will need to lecture these points after the activity settles.

  **1. Caprice vs. Mercy (The "Arbitrary God" Problem)**
  *   **The Gap:** In the game, the Protocol changes arbitrarily (Face Up -> Face Down -> Swap Seats). It feels whimsical.
  *   **Ghazālī's View:** God's Habit (*'ādah*) is not whimsical. It is steady, merciful, and allows for knowledge. God *could* make fire cool and cotton burn, but He doesn't, because He is truthful and consistent.
  *   **How to Patch:** In the debrief, emphasize Round 1. "The habit held for 7 minutes. That stability is what allows science and life. Occasionalism doesn't mean chaos; it means the stability is a gift, not a guarantee of the objects."

  **2. Epistemic Certainty**
  *   **The Gap:** In the game, when the rule changed, the students lost certainty. They couldn't trust the cards.
  *   **Ghazālī's View:** For Ghazālī, we *can* have certainty, but it is certainty in God's Promise, not in the Fire. We know the bread will nourish us not because bread has nourishing power, but because God has promised to nourish us when we eat.
  *   **How to Patch:** "In the game, you lost confidence. Ghazālī argues you should transfer that confidence. Don't trust the Bread; trust the Provider of the Bread. The certainty is just as strong, but the object of trust shifts."

  **3. Time Atomism**
  *   **The Gap:** The game flows in continuous time. Round 1 bleeds into Round 2.
  *   **Ghazālī's View:** Time is discrete. The world is annihilated and re-created at every instant. The "Habit" is re-affirmed at every tick of the clock.
  *   **How to Patch:** "Imagine if the Scribe had to re-approve the connection every *second*, not just once per round. That is closer to Ghazālī. The world doesn't persist; it is perpetually sustained."

  **4. Human Agency (Kasb)**
  *   **The Gap:** In the game, the Agent is passive; the Scribe does everything. This looks like determinism/fatalism.
  *   **Ghazālī's View:** Humans have "Acquisition" (*kasb*). We intend and act, but God creates the power and the result of that act. We are not puppets, but we are not independent creators either.
  *   **How to Patch:** "You felt like your action didn't matter in Round 2. Ghazālī would say: Your action mattered as an *occasion*, but not as a *creator*. You still chose to play the card. That choice is yours. The result is His."

  **5. The "Why" of the Habit**
  *   **The Gap:** The game offers no reason for the rule changes.
  *   **Ghazālī's View:** God acts with Wisdom (*Hikmah*). Even if we don't see the reason for a miracle (a broken habit), there is a wise purpose.
  *   **How to Patch:** "In the game, the rule change was random. In Ghazālī's world, a miracle (a broken habit) is a sign, a message, or a mercy. It is a rupture with purpose."
