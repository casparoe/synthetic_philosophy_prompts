answer: |-
  **Scene One (The Fink)**
  She is naturally generous, but the moment the request leaves his lips, it feels like a demand. The sound of his voice triggers a defensive reflex; the warmth she felt a second ago evaporates instantly, replaced by a cold need to protect herself. She still has the money in her bag, and no one is stopping her hand, but the person who would have given it is no longer there. To signal this to a careful reader, add a micro-gesture where she physically closes off *as* he speaks—shoulders rising, hand moving to cover her purse—showing the trait dying in real-time.

  **Scene Two (The Mask)**
  She is naturally generous, and when he asks, the warmth remains; she feels the impulse to help surge through her exactly as it always does. However, she knows her account was drained this morning, or her car is in the shop. The trait is fully intact, humming beneath her skin, but the physical reality cannot carry the load. To signal this to a careful reader, add a micro-gesture where she reaches *toward* him or her wallet before stopping—showing the trait firing but failing to connect.

  **The Analysis**
  The plain "if asked, she helps" test says she isn't generous in either scene, because in both cases she is asked and doesn't help. The repaired version says generosity requires an inner basis *plus* clear conditions. In Scene One, the request destroys the inner basis (the generosity vanishes), so the repaired test agrees she isn't generous *in that moment*. In Scene Two, the inner basis stays alive, but an external blocker stops the action, so the repaired test says she *is* generous, just prevented. The two analyses come apart on Scene Two: the plain test calls her ungenerous, the repaired test calls her generous but blocked. The single feature doing all the work is whether the trigger destroys the source of the behavior (Scene One) or merely interferes with the output (Scene Two).

  **The Strongest Counter-Argument**
  A defender of the plain test would say: "Stop looking inside the box. If the machine doesn't produce the product when switched on, it doesn't matter if there are gears spinning in there; it's broken. Dispositions are just predictions of what happens, not stories about why."

  **Manuscript Sentences**
  *Scene One:* "The question landed like a weight, and by the time she opened her mouth, the want to help was already gone."
  *Scene Two:* "The want to help was still there, heavy and true, but when she opened her mouth, nothing came out."
