      *   *The Idea:* If two people start with the same prior beliefs (probabilities before seeing evidence) and update rationally (Bayesian updating) based on private information, and if their posteriors (current beliefs) are "common knowledge," they cannot agree to disagree. Their probabilities must converge.
      *   *The User's Situation:* User and brother-in-law see the *same* public evidence (matches, reports). They disagree on the underlying truth (skill vs. luck). They are willing to bet.
      *   *Implication 1 (Disagreement):* If CPA holds + rationality + common knowledge of beliefs, honest disagreement is impossible. One of you is irrational, or you don't actually share a prior, or you don't know each other's beliefs fully.
      *   *Implication 2 (Betting):* If you can't disagree, you shouldn't bet. A bet implies you think you know something the other doesn't. If you know the other is rational and shares your prior, you should infer their willingness to bet signals information you don't have, leading you to update until the bet disappears. This is the "No Trade Theorem."
      *   *Implication 3 (Markets):* Market prices should reflect all available information (Efficient Market Hypothesis linked to CPA). Activity exists because of liquidity needs, differences in priors (rejecting CPA), or irrationality.
      *   *Implication 4 (Reality vs. Fiction):* CPA is likely false as a psychological description. People have different backgrounds, genetics, cultures. It's a modeling tool.
      *   *Constraint 1 (Counterfactuals):* Priors are about how you *would* react to any possible evidence, not just what you believe now. It's about the updating rule. If your updating rule differs, your prior differs. This matters for betting because betting reveals how you interpret new info (the bet itself).
      *   *Constraint 2 (Common Knowledge):* It's not enough that we share a prior. I must know you share it, you must know I know, etc. Why? Because if I think you might be irrational or have a different prior, I don't have to adjust my belief based on your disagreement. Infinite regress ensures stability of the inference.
