answer: |-
  The "loyalty-signaling spiral" offers a game-theoretic lens through which to view the spring and summer of 1794. It posits a system where revolutionary legitimacy is a scarce resource, acquired primarily through the public denunciation of rivals. In such a system, silence is suspicion, and mercy is treason. To test this mechanism against the sequence of Hébertists, Dantonists, and Robespierre, we must evaluate whether the strategic incentives at each stage align with the logic of preemption, and whether the mechanism explains the specific trajectory of the Terror or merely its existence.

  ### I. The Sequence: Hébertists, Dantonists, Robespierre

  **1. The Hébertists (March 1794)**
  *   **Actors:** The Committee of Public Safety (CPS), specifically Robespierre and Saint-Just, versus the Hébertists (ultra-radicals, Cordeliers, *sans-culotte* leaders).
  *   **Options:** The CPS could accommodate the Hébertist demands for intensified dechristianization and economic controls, or denounce them as anarchic provocateurs. The Hébertists could back down or attempt an insurrection.
  *   **Rationality of Preemption:** For the CPS, the spiral dictates that tolerance of the Hébertists signals weakness or counter-revolutionary moderation. Because the Hébertists claimed to represent the "true" people, their existence threatened the CPS's monopoly on revolutionary virtue. Preemption was rational: if the CPS did not strike, the Hébertists might mobilize the sections to purge the Committee. By executing them, the CPS signaled that *it*, not the street, defined the Revolution.
  *   **Spiral Fit:** High. The denunciation of the Hébertists served as a loyalty signal to the Convention and the propertied classes that the Terror had limits defined by the state, not the mob.

  **2. The Dantonists (April 1794)**
  *   **Actors:** The CPS versus the Indulgents (Danton, Desmoulins).
  *   **Options:** Robespierre could accept the call for "clemency" and the rule of law, or denounce Danton as a corrupt moderate.
  *   **Rationality of Preemption:** This is the critical test. Having just crushed the Left (Hébert), the CPS was vulnerable to accusations of pivoting to the Right. In the signaling spiral, consistency is impossible; only escalation is safe. To prove that the execution of the Hébertists was not a signal of moderation, Robespierre had to execute the Dantonists. Danton's demand for an end to the Terror was, in this logic, the ultimate disloyalty signal. Furthermore, Danton's popularity in the Convention made him a focal point for any coalition against the CPS.
  *   **Spiral Fit:** High. The winners of the first purge (CPS) immediately became the targets of the next potential purge (by Danton's allies). To avoid this, they struck first. The spiral explains why the "victors" of March could not simply stop; stopping would have been read as conspiracy.

  **3. Robespierre (Thermidor, July 1794)**
  *   **Actors:** Robespierre (and the CPS inner circle) versus the Convention (the "Plain" and members of the Committees of Public and General Security).
  *   **Options:** Robespierre could name his enemies in a new purge list, or speak vaguely of "traitors." The Convention could wait or strike preemptively.
  *   **Rationality of Preemption:** Robespierre's speech of 8 Thermidor, denouncing "traitors" without naming them, activated the spiral's final stage. By refusing to name names, he made *everyone* a potential target. For the deputies, the cost of waiting was death; the cost of striking was regicide. Preemption became the only rational survival strategy.
  *   **Predicting the Order:** Does the spiral predict Hébert *then* Danton *then* Robespierre? Strictly speaking, no. The spiral predicts *serial* purges, but the *order* is determined by the political geometry of the "center." Robespierre was squeezed between the ultra-left and the moderate-right. He purged the flank that threatened his control of the streets first (Hébert), then the flank that threatened his control of the Convention (Danton). Finally, having alienated both, he became the sole target. The spiral explains the *necessity* of the sequence, while the specific political positioning explains the *direction*.

  ### II. The Hard Case: Thermidor as Coalition

  The coup of Thermidor presents a complication. The spiral describes individual or factional preemption (A kills B to stop B from killing A). Thermidor, however, was a **defensive coalition**. Men like Billaud-Varenne and Collot d'Herbois (members of the CPS) allied with Tallien and Fouché (men they might otherwise have denounced) to bring down Robespierre.

  **Is this a break in the mechanism?**
  It is not a break; it is the logical culmination. The loyalty-signaling spiral creates a state of hyper-inflationary fear where the currency of denunciation becomes so cheap that it threatens the entire economy of the regime. When the cost of signaling loyalty becomes universal death, the rational strategy shifts from *individual preemption* to *collusive cessation*.

  The coalition of Thermidor was not a rejection of the spiral's logic, but a response to its terminal velocity. The conspirators did not trust one another; they knew that once Robespierre fell, the spiral might resume among them. But they acted together because the immediate threat (Robespierre's vague list) was more certain than the future threat (each other).

  **Cause vs. Symptom:**
  This reinforces the spiral as a **cause**, not a symptom. If the spiral were merely a symptom of ideological fervor, the fervor should have united them against counter-revolution. Instead, the strategic insecurity generated by the spiral (the inability to credibly promise safety) forced the coalition. The spiral generated the fear that made the coalition necessary. Thermidor validates the spiral: the mechanism became so efficient at generating enemies that it threatened to consume the operators, forcing them to sabotage the machine.

  ### III. Historiographical Comparison

  How does this signaling mechanism sit against the three standard readings of the Revolution?

  **1. Class Struggle**
  *   *Standard View:* The Terror is the instrument of the bourgeoisie (or the *sans-culottes*) crushing feudal or rival class interests.
  *   *Spiral Contrast:* The spiral cuts sharply against this. Hébertists, Dantonists, and Robespierrists were largely drawn from the same social strata (lawyers, journalists, bourgeois). The purges were not driven by conflicting material interests but by conflicting claims to legitimacy. The spiral explains why allies of the same class devour each other, which class struggle struggles to account for without invoking "false consciousness."
  *   *Verdict:* The spiral suggests class is the background, not the motor.

  **2. Ideology**
  *   *Standard View:* The Terror is the logical working-out of Rousseauian virtue, where dissent is sin.
  *   *Spiral Contrast:* The spiral treats ideology as the *language* of the game, not necessarily the *motivation*. A deputy might not sincerely believe Danton is a traitor, but knows that *calling* him a traitor is the cheapest way to signal safety. The spiral implies cynicism or strategic adaptation rather than pure doctrinal fervor. It suggests the ideology creates the rules of the signaling game, but the game itself drives the violence.
  *   *Verdict:* The spiral complements ideology by explaining its weaponization, but reduces the "logic of doctrine" to a "logic of survival."

  **3. Contingency**
  *   *Standard View:* Events turned on Robespierre's health, specific accidents, or individual decisions.
  *   *Spiral Contrast:* The spiral is structural and deterministic. It argues that once the rule "denunciation = safety" is established, the sequence of purges is nearly inevitable regardless of individual psychology. It minimizes contingency.
  *   *Verdict:* The spiral argues against contingency, positing a systemic trap.

  **Is the Debate Miscast?**
  The appearance that the signaling story needs none of these is real. It functions as a **meta-logic**. It suggests that the interpretive debate is indeed miscast. The question is not whether class, ideology, or accident drove the Revolution, but why revolutionary regimes invariably create institutional incentives that make preemption rational.

  The spiral favors a **structural-institutional interpretation**. It reveals that the self-consuming dynamic recurs across revolutions (French, Russian, Chinese) with entirely different social bases and creeds because the *structure of revolutionary legitimacy* is similar in all of them. When legitimacy is defined by purity rather than procedure, and purity is proven by denunciation, the spiral initiates. This suggests the "motor" is not the specific fuel (class or creed) but the engine design (the signaling economy).

  ### IV. Limitations: What the Mechanism Leaves Unexplained

  To treat the loyalty-signaling spiral seriously, we must be explicit about its blind spots. It is a powerful explanation for the *tempo* and *internal logic* of the Terror, but it is not a total theory.

  1.  **Ignition:** The spiral explains escalation, not ignition. It does not explain why denunciation became the currency of loyalty in the first place. That requires external context: the war, the civil war in the Vendée, and the economic crisis. The spiral needs a pressure cooker to start; it does not build the cooker.
  2.  **Specific Targeting:** While the spiral explains why *someone* must be purged, it does not fully explain *who*. Why Hébert before Danton? The spiral says "a flank must be cut," but political specifics (Hébert's control of the Cordeliers vs. Danton's control of the Convention) determined the order. The mechanism is agnostic to the content of the accusation.
  3.  **Termination:** The spiral predicts infinite regression (A kills B, C kills A, D kills C). It does not explain why the Terror stopped at Thermidor and did not continue indefinitely among the Thermidorians. This requires an explanation of exhaustion, the restoration of property rights, or the military victory that reduced external pressure. The spiral describes a runaway process; it does not explain the brakes.
  4.  **Belief vs. Strategy:** The mechanism reduces actors to rational calculators. It leaves unexplained the role of genuine hatred, fanaticism, or moral conviction. Some actors may have denounced not because it was safe, but because they truly believed the accused were enemies. The spiral assumes cynicism; history is often messier.

  **Conclusion**
  The loyalty-signaling spiral fits the sequence of Spring-Summer 1794 with high fidelity. It explains why the victors of one purge became the victims of the next and why Thermidor was a coalition of the frightened rather than a triumph of moderation. It cuts against class and contingency readings, and complicates the ideological reading by treating doctrine as a strategic tool. Ultimately, it suggests that the "devouring of children" is not a peculiar pathology of the French character or Jacobin ideology, but a structural hazard of any political system where legitimacy is performative and survival depends on the public destruction of allies. The mechanism does not explain everything, but it explains the one thing the other readings often miss: why, in the Revolution, safety was indistinguishable from aggression.
