answer: |-
  The case
  In the valley of Orm, the Clockmakers' Guild adhered to the doctrine of 'Exactitude as Devotion', believing sloppy work offended the Creator. For two centuries, members reinvested profits into precision tools and kept meticulous ledgers, rejecting conspicuous consumption. By 1850, secularisation swept Orm; fewer than ten per cent of guildsmen retained the theological belief, yet the reinvestment habit and ledger-keeping persisted unchanged among believers and non-believers alike. New entrants, motivated solely by competitive advantage, mimicked the established practices to secure contracts, finding that the high-reputation strategy yielded superior market share regardless of personal faith. The economic pattern remained distinctive compared to neighbouring towns, even though the original religious motivation had vanished from the majority of practitioners and the practice had spread to those who never held the value.

  The three verdicts
  For the mechanism theorist, causes must track counterfactuals within agent preferences. Since most agents no longer hold the belief yet act identically, the value is not the proximate cause of the current behaviour. The initial adoption may have been value-driven, but persistence is explained by market selection: non-compliers were weeded out. The value is historically incidental to the current equilibrium. It explains nothing now because the utility function is dominated by profit maximisation, not theological anxiety. The behaviour persists because it is profitable, not because it is pious. Thus, explanatory relevance (it correlates) diverges from causal relevance (it does not drive choices). The value is a fossil, not an engine.

  The interpretivist argues that without the value, the behaviour is unintelligible mere motion. Even if actors do not consciously cite theology, the practice retains its 'spirit'; the ledger is a moral document, not just a tool. The value renders the action meaningful, distinguishing it from identical behaviour driven by greed. Explanation requires understanding the reason-for-action, not just the stimulus. Therefore, the value remains causally relevant insofar as it constitutes the rationality of the act. To strip the value is to misunderstand the action. Explanatory and causal relevance cannot come apart because the reason *is* the cause in human affairs. The silence of belief does not silence the cultural logic structuring the choice.

  The practice theorist sees the value as a shadow cast by material habits. The guild's structure, apprenticeship routines, and market constraints form a habitus that generates the behaviour automatically. The theology was merely a post-hoc rationalisation of existing craft norms or a tool for guild closure. Whether agents believe it is irrelevant; the body knows the practice. The value does no work; the social field does. Consequently, the value has neither causal nor explanatory priority. It is an effect, not a cause. The persistence proves the value was never the engine; the engine was the institutional reproduction of practice independent of consciousness. Culture is the smoke, not the fire.

  What is doing the work
  The disagreement turns on the temporal lag between the extinction of belief and the persistence of practice. This gap forces each stance to locate the engine of action differently. The rationalist sees market incentives filling the void; the Weberian sees cultural inertia carrying meaning; the materialist sees habitus operating below consciousness. Without this lag, belief and action would coincide, allowing agreement on the value's relevance. The lag decouples internal state from external output, making the ontological status of the value the contested variable. It is the silence of the majority that creates the noise of the debate.

  Stripping the feature out
  If we remove the lag, ensuring believers only act while believing, the case collapses into a standard correlation. The rationalist admits the value enters the utility function. The Weberian confirms the reason is present. The materialist loses the strong evidence of persistence without belief. The divergence narrows significantly. The case becomes a simple test of whether beliefs cause actions, less philosophically fraught than whether culture survives its own death. The specific puzzle of explanatory without causal relevance vanishes when the explanans and explanandum rise and fall together. The tripartite disagreement requires the gap to breathe.

  The pushback
  'This case is rigged to protect a mystical view of culture,' argues the rational-choice defender. 'By separating belief from behaviour, you invite the Weberian to posit invisible strings of meaning where there are only incentives and constraints. The persistence is plainly path dependence and competitive selection, not 'cultural inertia'. You define 'explanation' so loosely that intelligibility counts as causation, which is a category error. If the agents maximise utility given constraints, the value is redundant history. You have constructed a scenario where the value is causally idle yet explanatorily privileged simply by stipulation. This does not prove culture causes without mechanisms; it proves you have defined causation too narrowly for mechanisms and too broadly for meanings. The disagreement is an artefact of your semantics, not ontology. You are mistaking the map for the territory to save a discredited sociology.'

  Bottom line
  The case demonstrates that a value can retain explanatory relevance by rendering action intelligible even after it loses causal efficacy in driving choices. Whether this constitutes causation depends entirely on whether one accepts reasons as causes or merely as descriptions of underlying mechanisms.
