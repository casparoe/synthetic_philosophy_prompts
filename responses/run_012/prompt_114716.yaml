  1. **President vs. Cord:** This is the most upstream question. If the sober president merely substitutes for the drinker's reason, the lawgiver is controlling virtue, not arranging conditions for its exercise. This distinction sustains your core reading. Textual settlement is high; the *Laws* details the president's powers extensively (640a–671e). The project depends critically on this: if the president overrides the golden cord, the 'defence of legislation' becomes a defence of paternalism, undermining the claim that virtue is exercised rather than imposed. You must establish whether the president guides the cord or pulls it. If the president is external reason, the citizen's golden cord is redundant. This determines whether the legislation respects agency.

  2. **Diagnosis vs. Pedagogy:** You must determine if wine reveals character or reshapes it. If purely diagnostic, the 'practice' claim fails. Textual settlement is medium; passages on training require reconciling with those on inspection. Half the chapter depends on this. If wine cannot train courage or modesty under influence, the defence of legislation as habituation weakens significantly, reducing the symposium to a mere audit tool. The text offers both, but their coherence is not guaranteed. If they are incompatible, the 'serious institution' claim fractures. This affects how you interpret the age-graded rules.

  3. **Generalisability:** This tests whether the wine model is a paradigm for all legislation or a unique exception. Textual settlement is low; it requires philosophical argument beyond exegesis. The book's broader contribution depends on this, but the chapter stands without it. However, without this, the reading remains historical rather than philosophical. It determines if the 'condition-arranging' picture is a general theory of law. If it fails here, the chapter is merely about wine, not legislation.

  **Moving Items:** Move Q1 down if textual analysis shows the president is merely logistical, not normative. Move Q2 up if the 'practice' passages are textually unsupported, making the diagnostic function primary. An unacceptable implication would be if the model suggests citizens cannot develop internal reason; this would force Q1 to the top. If the distinction between testing and training collapses, Q2 becomes definitive. If the 'condition-arranging' reading implies legislation cannot touch inner character, Q3 moves up as it becomes a liability. A distinction collapses if the president *is* the golden cord externalised. If you overlook that the president is also a citizen, Q1 may be ranked too high.

  **Leave Alone:** First, the *Symposium* comparison. Socrates' exceptionalism obscures the civic norm established in the *Laws*; focusing on it shifts attention from legislation to individual genius, which is irrelevant to the lawgiver's institutional design. It risks turning a political question into a biographical one about Socrates. The *Laws* concerns ordinary citizens, not philosophers. Second, the metaphysics of the puppet cords. This distracts from the political theory of condition-arranging towards psychology, diluting the chapter's focus on legislation. These are interesting but secondary to the political thesis. They consume time without advancing the core argument about legislative scope. Focus on the political institution, not the metaphors or exceptions.
