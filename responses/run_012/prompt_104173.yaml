answer: |-
  Here is the specification. I have written this as if I am handing it to a working group tasked with selecting a framework for legislation. I have stripped out the academic hedging. If a theory cannot meet these, it belongs in a journal, not in a welfare committee.

  ### The Specification for a Theory of Morally Relevant Computation

  **1. The Ontology/Epistemology Distinction**
  *   **Requirement:** The theory must explicitly distinguish between the computational/physical conditions that *constitute* sentience and the observable markers that *indicate* it.
  *   **Motivation:** Chatbots. A system can be optimized to output "I am in pain" (marker) without having the internal architecture that constitutes suffering (ontology). Conversely, a locked-in patient may have the ontology without the marker.
  *   **Why Mandatory:** If you conflate sign and substance, you either grant rights to sophisticated mimics or deny them to the silent suffering. A regulatory framework needs to know what it is protecting, not just what it can detect.

  **2. The Subject/Agent Decoupling**
  *   **Requirement:** The theory must allow for the existence of a "subject of experience" independent of "agency" or "preference formation."
  *   **Motivation:** Newborns, fish, severely cognitively impaired humans. These entities feel pain (subject) but do not have long-term desires, narrative selves, or complex planning capabilities (agent).
  *   **Why Mandatory:** Many cognitive theories tie moral status to rationality or self-awareness. If your theory requires a "self-model" to feel pain, you have just justified vivisection on infants. That is a non-starter for welfare.

  **3. Graded Phenomenology, Binary Policy Interface**
  *   **Requirement:** The theory must accommodate sentience as a continuous variable (degree) while providing a principled method for deriving a binary decision (protect/not protect) under uncertainty.
  *   **Motivation:** A crab's nociception is likely not identical to a human's. It may be "less" or "different." But the law usually requires a yes/no on protection status.
  *   **Why Mandatory:** Nature is analog; regulation is digital. A theory that insists sentience is purely binary (on/off) contradicts evolutionary continuity. A theory that refuses to map degrees to decisions is useless to a regulator.

  **4. Substrate Neutrality (with an Asterisk)**
  *   **Requirement:** The criteria for sentience must be defined by functional or structural organization, not by specific biological material (e.g., "human cortex" or "C-fibers").
  *   **Motivation:** Future AI, potential alien life, and the fact that evolution converges on solutions differently (e.g., octopus nervous systems).
  *   **Why Mandatory:** If you define sentience by "mammalian brain tissue," you are doing biology, not ethics. You become vulnerable to the first synthetic organism that mimics the function without the tissue.
  *   **The Asterisk:** This cannot be *pure* substrate neutrality (see Conflicts below).

  **5. Error Asymmetry (The Precautionary Constraint)**
  *   **Requirement:** The theory must incorporate the cost of error. It must treat a False Negative (denying protection to a sentient being) as morally costlier than a False Positive (granting protection to a non-sentient thing).
  *   **Motivation:** If we are wrong about the rock, the rock loses nothing. If we are wrong about the fish, the fish suffers.
  *   **Why Mandatory:** Under uncertainty, evidential symmetry is moral negligence. A theory that demands 95% confidence before attributing sentience is functionally equivalent to a theory that requires suffering to be proven beyond reasonable doubt. We cannot meet that burden for non-verbal subjects.

  **6. Non-Anthropocentric Markers**
  *   **Requirement:** The detectable markers for sentience cannot rely on verbal report, complex tool use, or mirror self-recognition.
  *   **Motivation:** Insects, newborns, anaesthetized patients.
  *   **Why Mandatory:** These are the edge cases you are trying to solve. If your test requires language, you have already excluded the majority of the moral patients on your list.

  **7. Temporal Continuity Handling**
  *   **Requirement:** The theory must account for intermittent consciousness (sleep, anaesthesia, seizures) without losing the status of the subject during unconscious periods.
  *   **Motivation:** Patients under general anaesthesia. They are not sentient *during* the surgery, but we still owe them duties regarding their future experience and bodily integrity.
  *   **Why Mandatory:** If moral status vanishes every time consciousness flickers off, you permit harming the unconscious subject provided they don't wake up to remember it. This violates our basic intuitions about bodily rights.

  ***

  ### Genuine Requirements vs. Camp Prejudices

  You asked me to separate the hard constraints from the philosophical preferences masquerading as constraints.

  **The Prejudice: "Determinacy"**
  Many theorists demand that a valid theory must yield a sharp, determinate "Yes/No" for every conceivable case. They argue that if a theory leaves a case vague, the theory is broken.
  *   **Verdict:** This is a prejudice. It is a demand for the world to be cleaner than it is. Evolution is messy. There are likely borderline cases where "is it sentient?" has no fact of the matter.
  *   **Correction:** The requirement is not that the *theory* be sharp, but that the *policy* derived from it handles vagueness without collapsing. The theory must admit vagueness; the regulation must manage risk. Do not demand a sharp line from the metaphysics.

  **The Prejudice: "Pure Substrate Neutrality"**
  Some computationalists insist that biology is irrelevant; only the information processing matters.
  *   **Verdict:** This is a prejudice. We have no evidence of sentience existing outside of biological systems. While we shouldn't rule it out, demanding a theory ignore biology entirely blinds us to the only data we have.
  *   **Correction:** Substrate *flexibility*, not neutrality. Biology is evidence, not a definition.

  **The Genuine Requirement: "Operationalizability"**
  A theory that cannot be applied by a non-philosopher with a checklist is not a theory of welfare; it is a metaphysical poem.
  *   **Verdict:** Genuine. If you cannot translate the theory into a protocol for a veterinarian or an inspector, it fails the context of this workshop.

  ***

  ### Joint Unsatisfiability (The Trilemma)

  There is a triple of constraints that cannot be simultaneously satisfied. You must relax one.

  1.  **Strong Substrate Neutrality:** Sentience depends *only* on abstract computation, not physical implementation.
  2.  **Anti-Behaviorism:** Sentience is not defined by external behavior (to avoid the chatbot problem).
  3.  **Empirical Testability:** We must be able to verify sentience from the outside without direct access to the internal state.

  **The Conflict:**
  If you insist on Strong Substrate Neutrality, you cannot rely on specific biological markers (like C-fibers). You must look at computation.
  If you insist on Anti-Behaviorism, you cannot rely on input/output patterns (because chatbots mimic these).
  If you cannot look at biology, and you cannot look at behavior, you have no access to the computation. You are locked out.
  To test for sentience in non-verbal subjects, you *must* rely on either biological correlates (violating Strong Neutrality) or behavioral proxies (violating Anti-Behaviorism).

  **Resolution:**
  You must sacrifice Strong Substrate Neutrality. You must allow that specific physical implementations (biology) provide the only current warrant we have for inferring the computation. We infer the software from the hardware because we cannot read the code directly.

  ***

  ### The Single Most Excluding Requirement

  If I have to choose the one requirement that kills the most popular theories, it is **Requirement 5: Error Asymmetry (The Precautionary Constraint).**

  Here is why:
  *   **Higher-Order Theories (HOT):** These generally require a subject to have a thought *about* their mental state to be conscious. This is a high bar. Under uncertainty, it leads to high False Negatives for animals and infants. It fails the Error Asymmetry test because it risks missing suffering to avoid over-attributing consciousness.
  *   **Strict Global Workspace Theory (GWT):** While better, if interpreted as requiring a specific threshold of information broadcasting that is hard to detect in simpler nervous systems, it risks the same False Negative trap.
  *   **Strict Behaviorism:** This fails Requirement 1 (Ontology/Epistemology). It collapses the sign into the substance. It grants status to chatbots.
  *   **Biological Chauvinism:** Fails Requirement 4 (Substrate Neutrality).
  *   **Evidentialist Equivalence:** Any theory that treats False Positives and False Negatives as equally bad errors fails Requirement 5. This kills most standard scientific epistemological frameworks when applied to ethics. Science seeks truth; welfare seeks the minimization of suffering. They are different optimization functions.

  **The Winner:** **Recurrent Processing Theory (RPT)** or similar "first-order" accounts currently fare best against this list, *provided* they accept the Precautionary Principle. They locate sentience in early sensory processing (allowing for infants/animals), distinguish it from report (allowing for locked-in patients), and are biologically grounded but functionally describable.

  However, even RPT struggles with the **Trilemma**. It relies on neural signatures (biology) to infer processing (computation). If you encounter a silicon system that replicates the recurrence without the biology, RPT proponents often hesitate. If they say "no sentience," they violate Substrate Neutrality. If they say "sentience," they lack Testability (we can't easily probe deep layer recurrence in black-box AI).

  **Summary for the Workshop:**
  Do not look for a theory that gives you the "truth." Look for a theory that minimizes the risk of catastrophic moral error. The specification above is designed to filter out theories that are too clean for the world we actually inhabit.
