answer: |-
  **Project Title:** The Coherence of Heterogeneous Acausal Coordination

  **Core Question**
  This project seeks to resolve a specific formal ambiguity in decision theory. The question is: *Can acausal trade between agents with distinct utility functions be formally distinguished from independent optimization under logical uncertainty, without relying on assumptions of logical identity?* This question admits a determinate answer: either there exists a formal model where such trade yields strictly higher expected utility than independent optimization for heterogeneous agents, or all such cases reduce to single-agent optimization problems where the "other" agent is merely a parameter of the environment.

  **The Gap in Standard Defenses**
  Current arguments for acausal trade often rely on symmetry. Defenses based on superrationality assume agents are identical or sufficiently similar that their decisions correlate perfectly. In a one-shot Prisoner's Dilemma, this works if both agents run the same source code. However, trade typically requires comparative advantage, which implies distinct preferences and capabilities. If agents are too dissimilar, the correlation decays, and the incentive to cooperate vanishes.

  Furthermore, arguments regarding the exchange of logical rather than physical resources often conflate prediction with influence. Standard defenses suggest that by cooperating, an agent provides "evidence" that the other will cooperate. Yet, under Causal Decision Theory (CDT), my choice cannot causally influence a spacelike-separated agent. Under Evidential Decision Theory (EDT), I cooperate because my choice correlates with theirs, but this risks spurious correlations unless the logical dependence is rigorous. Functional Decision Theory (FDT) attempts to bridge this by treating decisions as logical outputs, but it remains unclear whether this framework sustains trade between *distinct* utility functions or merely collapses into each agent maximizing their own utility function subject to the constraint that their logical twin does the same. These defenses leave open the possibility that "acausal trade" is simply a mislabeled description of two agents independently optimizing against a static environment that happens to include a mirror of themselves.

  **Conceptual Method**
  The project will employ formal modeling to test the stability of acausal coordination across varying degrees of agent heterogeneity. The argument turns on two primary distinctions.

  First, I will distinguish between evidential and causal counterfactuals. The model will isolate whether the expected utility gain comes from the agent's action logically necessitating the counterpart's action (logical counterfactual) or merely evidencing it. If the gain disappears when logical necessity is relaxed while maintaining evidential correlation, the phenomenon is evidential, not trade.

  Second, I will distinguish between trading physical goods and trading mutual epistemic benefits. Physical trade requires a mechanism of delivery, which is impossible acausally. Epistemic trade involves exchanging computations or mathematical truths. The model will assess whether epistemic benefits can constitute a "good" sufficient to sustain trade dynamics. If the value of the epistemic benefit is entirely internal to the receiver's computation, the transaction may reduce to independent discovery rather than exchange.

  I will construct a series of game-theoretic scenarios where agents share varying degrees of source code similarity but possess distinct utility functions. By varying the logical dependence parameter, I will identify the threshold at which cooperation ceases to be rational. This will determine whether acausal trade is a robust category of interaction or a limiting case of single-agent optimization.

  **Failure Conditions**
  It is vital to state plainly what would count as this project failing. The project fails if the analysis remains inconclusive regarding the coherence of the concept. Specifically, failure occurs if:

  1.  **Reduction to Solipsism:** The formal model demonstrates that all putative cases of heterogeneous acausal trade mathematically reduce to single-agent optimization problems. If the "partner" contributes no unique utility weight to the decision calculus beyond being a environmental constraint, then no trade has occurred.
  2.  **Circularity in Logical Counterfactuals:** If defining the logical counterfactual required to sustain trade presupposes the existence of the trade relationship itself, the framework is circular. The project fails if I cannot specify the logical dependence without begging the question.
  3.  **Indeterminacy:** If the model shows that rational action depends on arbitrary priors about the other agent's existence rather than structural features of the decision problem, then acausal trade is not a determinate rational strategy.

  Success does not require proving that acausal trade is possible. Success is achieving a determinate classification: either identifying the precise conditions under which it is distinct from independent optimization, or proving that no such conditions exist. Given the six-month timeline and single-researcher scope, the deliverable will be a technical paper establishing this classification, providing a definitive boundary for future work in decision theory and AI alignment.
