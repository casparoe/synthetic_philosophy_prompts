answer: |-
  You have independently rediscovered one of the most significant problems in the philosophy of biology and the philosophy of mind. You are describing the gap between **mechanism** (how it works) and **function** (what it is for), and specifically how function can be real without being represented inside the system.

  You are right to feel that both standard reactions you encounter are unsatisfying. One denies the reality of the purpose; the other tries to smuggle a little conscious agent inside the machine to read the purpose.

  Here are the names for what you are seeing, the names for the mistakes, and the tool for drawing the edges.

  ### 1. What is this called?

  The specific biological term for what you are describing is **Teleonomy**.

  *   **Teleology** traditionally implies purpose driven by conscious intent or a final cause (e.g., "The rock falls because it wants to be at the center of the earth").
  *   **Teleonomy** describes purpose-like behavior that arises from natural selection or design history, without conscious intent. The "goal" is real, but it exists in the *history of the system*, not in its current mental state.

  In philosophy, the rigorous account of this is called the **Etiological Theory of Function** (championed by philosophers like Ruth Millikan and Larry Wright). "Etiological" means "causal history." On this view, the function of the heart is to pump blood *because* ancestors with hearts that pumped blood survived. The reason is indeed, as you said, "in the history — in what got kept and what got thrown away."

  The Dennett concept you are remembering is likely **"Competence without Comprehension"** (the title of a chapter in his book *From Bacteria to Bach and Back*). He argues that you can have systems that are highly competent at achieving goals (immune systems, termite mounds) without comprehending those goals. The explanation runs "backwards" through evolutionary time, not "forwards" through conscious planning.

  He also formalizes how we talk about this using **The Intentional Stance**. This is the strategy of predicting a system's behavior by treating it *as if* it had beliefs and desires. Dennett argues this isn't *just* a metaphor (Mistake 1), but it also doesn't require an internal soul (Mistake 2). It identifies a **Real Pattern**. If the pattern holds up reliably, the "reason" is as real as the pattern, even if no neuron is firing the word "measles."

  ### 2. What are the two mistakes called?

  You have correctly identified that both extremes are errors. Here is their philosophical taxonomy:

  **Mistake 1: "It's just a metaphor / stop anthropomorphizing."**
  *   **Name:** **Eliminative Materialism** (or hard **Instrumentalism**).
  *   **Why it's wrong:** It throws away predictive power. If you refuse to say the immune system "recognizes" measles, you lose the ability to explain why it *doesn't* recognize smallpox. The functional description captures a reality (the selection history) that the purely physical description (this protein binds here) obscures. As you noted, the water *really is* why the root grew.

  **Mistake 2: "There must be a representation inside."**
  *   **Name:** **The Homuncular Fallacy** (or **Cartesian Materialism**).
  *   **Why it's wrong:** This is the "little man inside the head" problem. If you say the brain contains a map of the water, you then have to explain who is reading the map. If another part of the brain reads it, does *that* part need a map? It leads to infinite regress. You are correct: the reason doesn't need to be *represented* to be *causally effective* via selection history.

  ### 3. How do you draw the edges? (Thermostat vs. River)

  This is the hardest part, and it turns on the concept of **Normativity** (the capacity to be *wrong*).

  *   **The River:** If a river dries up before reaching the sea, we do not say it *failed*. We say it evaporated. There is no standard it is supposed to meet. It has no function, only causes.
  *   **The Thermostat:** If a thermostat is set to 70° and the room is 80°, the thermostat is *wrong*. It is malfunctioning. It has a **proper function**.
  *   **The Tree:** If a root grows away from water, it is malfunctioning (relative to its evolutionary design).

  **The Boundary Line:** The line is drawn at **Selectional History** (or Design History).
  *   A system has "real reasons" (teleonomy) if it exists because it was **selected** (by evolution or an engineer) to perform that task.
  *   The thermostat was designed to regulate temperature. Its "goal" is derived from the designer's intent.
  *   The tree was selected for water acquisition. Its "goal" is derived from ancestral survival.
  *   The river was not selected for anything. It is just physics.

  So, the "reason" is genuinely there when the system is the product of a filter that kept things that did X and threw away things that didn't. That filter creates a standard of success. Where there is no filter (the river), there is no function, only cause.

  ### 4. Does this apply to machines? (Chess Engines and LLMs)

  Yes, but with a crucial distinction known as **Derived Intentionality**.

  *   **Chess Engine:** When a chess engine "protects its queen," it is exhibiting teleonomy. It has a function (win chess). It can malfunction (play a blunder). The "reason" is in its code and training (its design history). It doesn't need to "know" what a queen is; it just needs to execute the function selected for by its programmers.
  *   **Language Models (LLMs):** This is the cutting edge. An LLM produces text that looks like it has reasons. Does it?
      *   **The Skeptic:** It's just math (Mistake 1).
      *   **The Believer:** It understands meaning (Mistake 2).
      *   **The Dennett View:** It depends on the **Intentional Stance**. If treating the LLM as having beliefs/desires allows you to reliably predict its output, then it has *derived* intentionality. However, its "history" is statistical correlation, not biological survival.
      *   **The Edge:** An LLM can be *wrong* (hallucinate). This implies a norm. But whose norm? It is trying to satisfy the objective function set by its trainers (predict the next token / be helpful). So, it has a function, but it is a **parasitic function**. It borrows its "reasons" from the humans who trained it and the humans who read it. It doesn't have its *own* survival history in the biological sense.

  ### 5. What does this distinction rule out?

  Adopting the view you are groping toward (Teleonomy / Etiological Function / Dennett's Intentional Stance) rules out two specific things:

  1.  **Vitalism / Magic:** It rules out the idea that there is a special "life force" or "mind stuff" required for purpose. You don't need a soul to have a goal; you just need a selection history. It naturalizes purpose.
  2.  **Dualism / The Ghost in the Machine:** It rules out the idea that for a reason to be real, it must be consciously thought. It allows you to say "The immune system remembers measles" without believing the immune system has a mind.

  ### Summary for your argument with your mate

  *   **The Name:** It's **Teleonomy** (biology) or **Etiological Function** (philosophy).
  *   **The Dennett Reference:** Look up **"Competence without Comprehension"** or **"The Intentional Stance."**
  *   **The Mistakes:** You are avoiding **Eliminativism** (denying the function) and the **Homuncular Fallacy** (requiring an internal reader).
  *   **The Test:** Ask: **"Can this system malfunction?"**
      *   If yes (Thermostat, Immune System, Chess Bot), it has a function/history. The "reason" is real.
      *   If no (River, Rock falling), it's just physics. The "reason" is a metaphor we project.

  You are effectively arguing for **Naturalized Teleology**. The "point" is real because the *consequences* of missing the point were real in the past (death, breakdown, losing the game). That history is physically encoded in the structure of the system, even if the word "measles" isn't written on a cell.
