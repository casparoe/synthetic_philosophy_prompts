  Not a philosopher, just a backend dev who reads too many novels. I've been reading up on Moore's paradox — the it's raining but I don't believe it's raining thing, where the sentence can be perfectly true and yet saying it out loud is somehow insane, while the same sentence about someone else is totally fine — and its got me rereading The Remains of the Day. Stevens spends the whole book telling us how dignified he is and how he doesn't regret a thing, while the story he's actually telling is a man who gave his life away, and even at the end he's telling himself he'll make the best of what's left. Is that a Moorean sentence, just stretched over a whole novel? And does fiction get a free pass here — if a coworker talked like that I'd assume he'd snapped, but in a novel we read it as character rather than absurdity. Is that because no ones really asserting anything in a novel, or because fiction lets a character hold both halves at once in a way real people can't? I also saw somewhere that people split these into the omissive version (p but I don't believe p) and the commissive one (p but I believe not p) — tell me whether that distinction actually earns its keep for this case. Take the novel and the paradox equally seriously, skip the lazy unreliable-narrator answer, and end with what the book shows about the paradox that the philosophy papers can't. Start with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question.
