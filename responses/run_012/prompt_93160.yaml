answer: |-
  You should drop step (3) by appealing to weak discernibility through irreflexive relations, which allows you to keep the Principle of Identity of Indiscernibles without collapsing the two spheres into one.

  Black's argument in (3) assumes that all properties relevant to individuation must be monadic qualities (like mass or temperature) or symmetric relations described monadically (like "being two miles from the other sphere"). However, if you allow irreflexive relational properties to count as "respects" in (1), the spheres are discernible. The relation "is spatially separated by two miles from" holds between sphere $a$ and sphere $b$, but it does not hold between $a$ and $a$. This logical asymmetry weakly discerns them without requiring you to posit invisible haecceities or absolute space.

  This move preserves your preference for (1) and blocks the unwanted consequences of (6). Because individuation is grounded in the relational structure rather than bare particularity, the Leibniz shift scenario does not generate a new world; shifting every particle preserves all irreflexive relations, so the structural description remains identical. You avoid the "invisible extra ingredient" because the distinctness is fully exhausted by the physical relations themselves, much like how permutation invariance in quantum mechanics treats particle labels as gauge redundancy rather than ontological fact.

  The bill for this solution is ontological structuralism. You must accept that objects are not independent substrates that *have* relations, but rather nodes constituted *by* their relations within a structure. This costs you the classical intuition of "substance"—the idea that there is a "something" underlying the properties—but it aligns comfortably with your physics background, where fields and symmetries are more fundamental than the classical billiard balls they sometimes approximate. You keep PII and save Leibniz, but you lose the notion of the object as a primitive ontological category.
