      *   *Check:* Is the verdict honest? I need to make sure I tell them the distinction is the risky part.
      *   *Check:* Is the question determinate? "Under what conditions..." is good. It allows for a nuanced "Yes, but only if..." answer.

  6.  **Final Polish:** Ensure the distinction between "permissible" and "forbidden" is clearly linked to the "common currency" problem. If I trade a permissible act, I'm just changing which permissible thing I do. If I trade a forbidden act, I'm violating my own norms. To justify that, I need to know if *your* gain outweighs *my* violation. That requires a scale. This logic holds up.

      *Wait, one nuance:* Even in "within-the-lines," if I have a duty to maximise, doing a sub-optimal permissible act might be forbidden. So the distinction relies on the existence of *options* (supererogation or genuine permission). I must highlight this in the "Verdict" section.

