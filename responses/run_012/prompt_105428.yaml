  2.  **Deconstruct the Core Idea & Distinction:**
      *   *The Problem:* Moral Trade (e.g., Tobia, MacAskill, etc.) usually assumes we can compare utility/welfare across agents with different axiologies.
      *   *The Distinction:*
          *   *Within-the-lines:* Agent A does $X$ (permissible for A) instead of $Y$ (permissible for A). Agent B does $Z$ (permissible for B) instead of $W$ (permissible for B). Both prefer the outcome of the swap.
          *   *Across-the-lines:* Agent A does $X$ (forbidden for A). Agent B does $Z$ (forbidden for B).
      *   *Critique of the Distinction:* Is it robust?
          *   *Potential Issue:* If my moral view is consequentialist, *all* acts are ranked. There are no "lines" (permissions) in the deontological sense, just better/worse. If I trade to do a sub-optimal act, am I violating a "line" or just accepting a cost?
          *   *Refinement:* The distinction works best if we assume non-consequentialist elements (constraints, duties) or "satisficing" consequentialism. If the course is "Consequentialism and its Critics," this tension is perfect. The "line" exists for deontologists or constraint-based views. For strict maximising consequentialists, the "line" is the optimal act. Trading to do a sub-optimal act is "across the line" of rationality/requirement.
          *   *Decision:* The distinction *does* work, but it needs to be framed carefully regarding *moral requirements* vs. *supererogation/permission*. I need to advise the user that the distinction holds up best when at least one party holds a non-maximising view (deontological constraints or satisficing). If both are strict maximisers, trade is just cooperative utility maximisation.

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be academic and precise. "The Currency of Compromise" or similar.
      *   **Research Question:** Needs to move from "Does it need currency?" to something about *conditions of possibility*.
          *   *Draft:* Under what conditions is moral trade possible without inter-theoretic comparison?
          *   *Refinement:* Focus on the distinction. "Does the feasibility of moral trade depend on the distinction between permissible and forbidden acts?"
          *   *Final Polish:* "To what extent does the possibility of moral trade rely on inter-theoretic value comparisons, and does this reliance vary between trades involving permissible acts versus trades involving morally forbidden acts?"

      *   **Context/Existing Positions:**
          *   Need to mention that current models (Tobia, MacAskill) often assume a meta-ethical framework that allows comparison (e.g., credal normativity or a common welfare metric).
          *   Point out the gap: They don't distinguish between trading off *margins* of permission vs. trading off *violations* of constraint.

      *   **Methodology (Semester Plan):**
          *   Needs to be realistic for an MA student.
          *   Month 1: Lit review & defining the distinction rigorously.
          *   Month 2: Constructing the "Within-the-lines" model (Pareto).
          *   Month 3: Constructing the "Across-the-lines" model (The problem case).
          *   Month 4: Testing objections (e.g., "Why not just maximise expected value?").
          *   Month 5: Writing.
          *   *Correction:* A semester is usually 3-4 months of active work + writing. Let's make it a 4-month active research plan.

      *   **Success/Failure Conditions:**
          *   *Success:* Showing that within-the-lines works without common currency, but across-the-lines fails without it.
          *   *Failure:* If the distinction collapses (e.g., all trade is actually across-the-lines because opportunity costs make sub-optimal acts forbidden).
          *   *Dissolution:* If it turns out moral trade *always* requires a meta-axiology.

      *   **Honest Verdict (Scope & Distinction):**
          *   *Scope:* It's tight enough for a chapter, maybe too tight for a whole dissertation, perfect for a proposal.
          *   *Distinction:* I need to be honest here. The distinction is vulnerable to "consequentialisation." If every moral view can be modelled as ranking outcomes, the "line" disappears. The proposal needs to address this. I will advise the user to anchor the "line" in *agent-relative constraints* to make it stick.

  4.  **Refining the Tone:**
      *   British English (analyse, programme, centre, etc.).
