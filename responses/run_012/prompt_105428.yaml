answer: |-
  **Research Proposal**

  **Title:** The Currency of Compromise: Inter-theoretic Comparison and the Limits of Moral Trade

  **Research Question**
  Does the feasibility of moral trade depend on the existence of a common inter-theoretic currency of value, and does this dependency vary systematically between trades involving mutually permissible acts versus trades involving mutually forbidden acts?

  More precisely: Can a model of moral trade be constructed that secures mutual benefit for agents with divergent axiologies without invoking a shared metric of value, provided the trade remains within the bounds of each agent's moral permissions? Conversely, does trade requiring the violation of agent-relative constraints necessarily collapse without a meta-ethical framework that allows for the comparison of moral disvalue across theories?

  **Background and Problem Statement**
  Recent literature on moral trade (e.g., models proposed by Tobia, MacAskill, and others) suggests that agents holding incompatible moral views can cooperate to produce outcomes that are superior according to *both* views. The standard argument assumes that agents can identify a 'gain' for the other party that costs them less than the benefit it provides. However, this calculation implicitly relies on a common currency. To know that my cost is 'less' than your gain, we似乎 to need a scale on which my moral disvalue and your moral value can be plotted together. If our moral theories are incommensurable, the trade cannot be calculated.

  Current defences of moral trade often sidestep this by assuming a form of credal normativity or by treating 'moral value' as reducible to a single metric (like welfare) that both parties care about to different degrees. This leaves a gap: it is unclear whether moral trade is possible for agents who disagree not just on *degrees* of value, but on the *structure* of moral requirements (e.g., a deontologist trading with a consequentialist).

  My hypothesis is that the literature conflates two distinct types of trade. 'Within-the-lines' trades involve agents swapping actions that are permissible within their own frameworks. 'Across-the-lines' trades involve agents performing actions their own frameworks forbid. I suspect the former can be justified via a Pareto-style argument requiring no inter-theoretic comparison (each agent verifies the improvement internally), while the latter smuggles in a common currency to justify the violation of constraints.

  **Methodology and Work Plan**
  The project will be conducted over a standard semester (four months of active research, one month of writing).

  *   **Month 1: Conceptual Rigour and Model Construction.**
      The primary task is to formalise the 'within-the-lines' / 'across-the-lines' distinction. I will define 'lines' not merely as legalistic rules but as the boundary between the morally required/permissible and the morally forbidden. I will construct two formalised toy models of trade: one where both agents stay within their permission sets, and one where at least one agent exits theirs. I will test these models against cases of radical axiological disagreement (e.g., negative utilitarian vs. rights-based deontologist).

  *   **Month 2: The 'Within-the-lines' Analysis.**
      I will attempt to demonstrate that within-the-lines trade does not require a common currency. The argument will be that if Action A is permissible for Agent 1, and Action B is preferred by Agent 2, Agent 1 can adopt B without needing to quantify how much 'good' Agent 2 gains, provided Agent 1's own view is not violated. I will anticipate the objection that 'opportunity cost' turns every sub-optimal permissible act into a forbidden one (the 'consequentialisation' objection) and refine the definition of permission to block this.

  *   **Month 3: The 'Across-the-lines' Analysis.**
      I will analyse trades requiring constraint violation. Here, I expect to show that Agent 1 cannot justify violating their own constraint based on Agent 2's gain without a conversion rate. I will examine whether 'moral uncertainty' frameworks can solve this without positing a real common currency, or if they merely hide the assumption.

  *   **Month 4: Stress-Testing and Objections.**
      I will subject the distinction to pressure. Does the distinction collapse if we assume rational agents must always maximise? Does it dissolve if 'permission' is just 'low-cost obligation'? I will also consider whether the 'common currency' is actually just 'pragmatic compromise' masquerading as moral improvement.

  *   **Month 5: Drafting.**
      Synthesis of arguments into a 10,000-word chapter. Focus will be on clarity of the distinction and the determinacy of the conclusion regarding the common currency.

  **Success and Failure Conditions**
  *   **Success:** The project succeeds if it demonstrates a clear asymmetry: that within-the-lines trade is robust against incommensurability objections, while across-the-lines trade is not. A successful result would be a conditional claim: "Moral trade is possible without a common currency *if and only if* the moral theories involved admit of genuine options (permissions) that are not sensitive to opportunity costs."
  *   **Failure:** The project fails if the 'within-the-lines' category turns out to be empty. If every trade imposes an opportunity cost that renders the traded act forbidden by the agent's own lights (e.g., because they ought to maximise the good), then all trade becomes 'across-the-lines', and the distinction does no work.
  *   **Dissolution:** The project dissolves if it turns out that 'common currency' is a red herring—that trade is never about moral value comparison but purely about preference satisfaction, in which case the moral disagreement is irrelevant to the mechanism of trade.

  **Verdict on Scope and Distinction**
  *   **Scope:** This is appropriately sized for a dissertation chapter or a long MA paper. It is narrow enough to be tractable but connects to major debates in meta-ethics (incommensurability) and normative ethics (constraints vs. options). It is not too big, provided I resist the urge to solve the problem of inter-theoretic comparison generally; I am only assessing its *necessity* for trade.
  *   **The Distinction:** The 'within-the-lines' / 'across-the-lines' split is the risky element. It does real work *only if* we assume that moral theories can admit of 'options'—acts that are permissible but not required, even if they are sub-optimal. If the course focus is strictly on maximising consequentialism, the distinction collapses, because for a maximiser, any sub-optimal act is forbidden. To make this distinction stick, I must frame the project as involving at least one non-maximising agent (e.g., a deontologist or a satisficing consequentialist). If I assume both parties are strict maximisers, the proposal will fail because there are no 'lines' to stay within. I recommend explicitly limiting the scope to trades involving at least one agent with agent-relative constraints or genuine options. This limits the generalisability but saves the core argument from immediate collapse.

  **Conclusion**
  This proposal moves the debate on moral trade from 'is it possible?' to 'under what structural conditions is it possible?'. By isolating the need for a common currency to cases of constraint violation, it offers a way to salvage moral trade for pluralistic societies without demanding meta-ethical agreement. The work is concrete, the method is analytical, and the failure conditions are clear.
