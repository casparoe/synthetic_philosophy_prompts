      *   **The Coherence Check:**
          *   Is it coherent? Internally, yes (if you accept the premise). Externally (against linguistic reality), no.
          *   The Paradox: Agencies test humans on *comprehension* but accept machines on *output*. This implies they think machines achieve the *result* of comprehension without the *process*.
          *   Is it required? No. They could use MT as a draft, but they don't. They treat it as final. This suggests they *believe* the theory, not just using it for convenience.
      *   **The Gap (Everyday vs. Consequential):**
