answer: |-
  The institutional practice you describe—relying on machine translation (MT) for high-stakes interactions without human oversight—rests upon a specific, often unarticulated philosophical architecture. It is not merely a budgetary decision or a technological gamble; it is a commitment to a theory of language. By treating machine output as functionally equivalent to human interpretation, public institutions are operationalizing a **Code Model of communication**, often called the "Conduit Metaphor."

  Here is the reconstruction of that implicit theory, an assessment of its coherence, and an analysis of what is at stake when we move from the harmless to the consequential.

  ### 1. The Implicit Theory: Semantic Structuralism

  The practice presupposes that **meaning is a property of strings**, intrinsic to the syntax and semantics of the text itself, rather than a product of the interaction between speakers, context, and intent.

  Under this view, translation is an isomorphic mapping problem. It assumes that for every meaningful string in Language A, there exists a corresponding string in Language B that carries the same "payload" of information. The institution acts as if language is a code where the message is packaged into words, sent through a channel (the app), and unpacked on the other side. If the unpacking looks structurally correct, the meaning is assumed to be preserved.

  This aligns with your first proposition: *understanding what a sentence means is separable from producing an equivalent sentence in another.* In this framework, "understanding" is a mental ghost in the machine that is irrelevant to the transaction. As long as the input-output function holds, the internal state of the translator (whether biological or silicon) is epiphenomenal. The institution does not need the machine to *know* what "asylum" means; it only needs the machine to output the word that correlates with "asylum" in the target language with high statistical probability.

  ### 2. Theories Ruled Out and Left Open

  By adopting this practice, the institution quietly rules out several robust theories of meaning:

  *   **Speech Act Theory (Austin/Searle):** This theory holds that language is action (e.g., "I advise you," "I arrest you"). The meaning lies in the *illocutionary force*, which depends heavily on context, authority, and uptake. MT often captures the locution (the words) but misses the force. If a police officer reads rights via an app, the institution assumes the *words* constitute the warning, not the *act* of ensuring comprehension.
  *   **Gricean Pragmatics:** This relies on implicature—what is meant but not said. If a patient says, "I can't afford this," they may mean "I need a cheaper alternative," not just stating a financial fact. MT struggles with implicature. The practice assumes such nuances are negligible or non-existent in consequential settings.
  *   **Hermeneutics (Gadamer):** This views translation as a "fusion of horizons," requiring a dialogic negotiation of cultural context. The institutional practice treats translation as a monologic transfer, ruling out the necessity of cultural mediation.

  The practice leaves open **Formal Semantics** and **Behaviorism**. It is compatible with the view that meaning is truth-conditional (does the sentence correspond to facts?) regardless of who utters it. It is also deeply Behaviorist: if the stimulus (source text) produces the correct response (target text), the "understanding" is proven by the behavior, rendering the internal black box irrelevant.

  ### 3. The Coherence Problem: The Human/Machine Asymmetry

  You note a critical contradiction: agencies certify human interpreters by testing their *comprehension*, yet accept machine output on the strength of *how it reads*.

  This reveals a fracture in the institution's logic.
  *   **For Humans:** The institution acknowledges that a human can produce grammatically perfect nonsense. Therefore, they test for *mental grasp*. They admit that meaning requires a mind.
  *   **For Machines:** The institution behaves as if the statistical likelihood of a token sequence is a proxy for truth. They accept the output without testing the "comprehension" because they assume the machine *cannot* comprehend, yet the output is sufficient.

  Is this coherent? **Internally, yes; externally, no.**
  It is internally coherent if one accepts a Behaviorist definition of translation: translation *just is* the production of an equivalent text. If the text looks right, the job is done.
  However, it is externally incoherent because it contradicts the agency's own standard for humans. If comprehension is the gold standard for ensuring accuracy in a human (because a human who doesn't understand might hallucinate), then a system that *cannot* understand (by the agency's own definition of machine intelligence) should be treated as a higher risk, not a lower one.

  The practice resolves this cognitive dissonance by implicitly redefining "accuracy." For humans, accuracy = fidelity to intent. For machines, accuracy = fidelity to syntax. The institution is betting that in legal and medical contexts, syntax *is* intent.

  ### 4. The Gap: Everyday vs. Consequential

  Is the institution's confidence a claim about technology or meaning? **It is a claim about meaning disguised as a claim about technology.**

  In everyday cases (ordering food), the gap between syntax and intent is bridged by the physical world. If you ask for "water" and get "wine," the context corrects the error. The stakes are low, and the feedback loop is immediate.

  In consequential cases (asylum, health, rights), the context is often adversarial, abstract, or invisible.
  *   **Asylum:** A nuance in tense might distinguish between past persecution (eligible) and future fear (ineligible).
  *   **Health:** A modal verb might distinguish between "you must take this" (mandatory) and "you might take this" (optional).

  When an institution uses MT here, they are claiming that **meaning is stable and context-independent.** They are asserting that the risk of semantic drift is statistically negligible. This is not a claim that the technology is perfect; it is a claim that *meaning is robust enough to survive imperfect technology.*

  If they believed meaning was fragile—dependent on tone, hesitation, cultural subtext, or the relationship between speaker and listener—they would not trust the technology regardless of its fluency. Their confidence reveals a belief that the "message" is an object that can be shipped without damage, rather than an experience that must be co-created.

  ### 5. What Changes if Understanding is Indispensable?

  If we adopt the view that understanding is indispensable to translation (the Human-in-the-Loop requirement), the institutional practice collapses. This view aligns with Searle's "Chinese Room" argument: manipulating symbols is not understanding, and without understanding, you cannot guarantee the preservation of meaning in high-stakes contexts.

  Adopting this view would require three fundamental shifts:

  1.  **Epistemic Humility:** Institutions would have to admit that there are classes of communication (trauma narratives, complex medical consent, legal waivers) that are *in principle* untranslatable by machines. It moves the boundary from "what the tech can do" to "what translation *is*."
  2.  **Liability and Accountability:** Currently, if an app mistranslates a discharge instruction and a patient dies, the liability is murky. If understanding is required, the institution is liable for failing to provide a *mind* to interpret, not just a tool to transcribe. The "certification" of human interpreters would become a mandatory floor, not a ceiling.
  3.  **Process over Product:** The focus would shift from the *text produced* to the *interaction achieved*. Verification would no longer be "does this text look correct?" but "does the subject understand what was said?" This requires a feedback loop (teach-back methods) that MT cannot facilitate.

  ### Conclusion

  The practice of routing consequential conversations through machine translation presupposes a **Structuralist-Behaviorist theory of meaning**. It assumes meaning is encoded in text, transferable without loss, and verifiable by surface-level inspection. It rules out pragmatic and hermeneutic theories that locate meaning in human intent and context.

  While this theory is coherent within a closed system of information processing, it is incoherent when juxtaposed with the agency's own treatment of human interpreters. The institution claims to value comprehension in humans while accepting mere correlation in machines. Ultimately, the confidence in using MT for high-stakes decisions is not a bet on the software's accuracy, but a bet on the **reducibility of human experience to data.** It assumes that liberty, health, and justice can be secured by string-matching. If understanding is indeed indispensable, then this practice is not just risky; it is a category error, mistaking the map for the territory in situations where the difference determines the outcome of a life.
