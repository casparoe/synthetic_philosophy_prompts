      *   **Theories Ruled Out vs. Left Open:**
          *   *Ruled Out:* Speech Act Theory (Austin/Searle) - because illocutionary force depends on context/intent. Hermeneutics (Gadamer) - because it requires a dialogic fusion of horizons. Gricean Pragmatics - because implicature is lost.
