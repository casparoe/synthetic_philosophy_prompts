  ### 1. The Primary Rule: The Specific Duty Rule

  Based on the pattern of the six verdicts, the rule your colleague appears to be running is the **Specific Duty Rule**.

  **Statement of the Rule:** An omission counts as a cause of an outcome if and only if the agent stood in a specific relationship, role, or contractual arrangement that imposed a pre-existing, recognized duty to prevent that specific outcome.

  **Explanation:** This rule distinguishes the first three cases from the last three based on the existence of a normative "bridge" between the agent and the victim. In Cases 1–3 (Anaesthetist, Parent, Safety Officer), the agents occupy roles (medical professional, parent, designated officer) that legally or institutionally mandate action. In Cases 4–6 (River Stranger, Wealthy Woman, Commuter), the agents are members of the general public with no specific obligation to the victims. Under this rule, without a pre-existing duty, an omission is legally inert regarding causation, regardless of the agent's moral blameworthiness or physical capacity to help.

  ### 2. Alternative Rules and Ruled-Out Candidates

  Several other rules fit the six initial verdicts. I will outline two surviving competitors and one ruled-out candidate.

  **Surviving Alternative A: The Exclusive Mandate Rule**
  *   **Statement:** An omission causes an outcome only if the agent was the *sole* or *specifically designated* individual with the authority and responsibility to prevent it at the critical moment.
  *   **Fit:** This fits Cases 1–3 because the anaesthetist was the one *on call*, the parent was the *only* adult in the car, and the officer was the *designated* reporter. It fits Cases 4–6 because in those scenarios, the agents were merely part of a general class of potential helpers (bystanders, donors, public) with no exclusive mandate.
  *   **Divergence Point:** This rule is stricter than the Specific Duty Rule. It requires not just a general duty of a role, but that the specific task fell uniquely to that agent.

  **Surviving Alternative B: The Risk Undertaking Rule**
  *   **Statement:** An omission causes an outcome if the agent previously undertook an action or role that created or managed the risk, thereby cutting off other avenues of aid.
  *   **Fit:** In Cases 1–3, the agents undertook roles (medical care, parenting, safety inspection) that managed the victim's vulnerability. In Cases 4–6, the agents did not undertake any management of the risk; the risks existed independently of them.
  *   **Divergence Point:** This rule focuses on the history of the interaction rather than the static status of the agent.

  **Ruled-Out Rule: The Moral Capacity Rule**
  *   **Statement:** An omission causes an outcome if the agent could have easily prevented it without significant risk to themselves.
  *   **Why Ruled Out:** This is decisively ruled out by Case 5 (Wealthy Woman) and Case 4 (River Stranger). In Case 5, the woman could have saved the child for the price of a meal (low cost/high capacity), yet your colleague ruled it was *not* a cause. In Case 4, the man feared for his safety, but even if he hadn't, the "stranger" status in Case 6 suggests capacity alone is insufficient. Your colleague explicitly separates causation from blameworthiness; a purely capacity-based rule would conflate the two.

  ### 3. Predictions for the New Cases

  Here is how the three surviving rules (Specific Duty, Exclusive Mandate, Risk Undertaking) apply to the new scenarios.

  **New Case 1: The Nurse and the Drug Protocol**
  *   **Specific Duty Rule:** **Verdict: Cause.** The nurse holds a professional status with a duty of care to the patient. The hospital protocol establishes the standard of that duty. The fact that "custom" contradicted the protocol is irrelevant to the existence of the duty; the duty remains defined by the protocol. Her omission to ensure the check breached that duty.
  *   **Exclusive Mandate Rule:** **Verdict: No Cause.** The protocol explicitly designated a *second* nurse to perform the check. The administering nurse was not the exclusive mandate-holder for the safety check; the system was designed for shared responsibility. Her omission was failing to summon the second nurse, but the *checking* duty belonged to another.
  *   **Risk Undertaking Rule:** **Verdict: Cause.** By administering the drug, she undertook the management of the patient's immediate safety. Her action placed the patient in the specific chain of risk that the check was meant to mitigate.

  **New Case 2: The Beachgoer and the Human Chain**
  *   **Specific Duty Rule:** **Verdict: No Cause.** He is a stranger with no contractual or relational duty to the swimmer. No statute requires him to act.
  *   **Exclusive Mandate Rule:** **Verdict: No Cause.** He was not designated to help. Moreover, a chain was already forming; he was not the sole opportunity for rescue.
  *   **Risk Undertaking Rule:** **Verdict: No Cause.** He did nothing to create the risk or undertake the rescue. He remained passive.

  **Divergence:** The rules converge on the Beachgoer (all say No Cause). They **diverge on the Nurse**. The Specific Duty and Risk Undertaking rules predict **Causation**, while the Exclusive Mandate rule predicts **No Causation** because the specific safety task (the check) was assigned to a *second* party by protocol.

  ### 4. Best Guess at Her Verdicts

  **Prediction for the Nurse Case: Causation (Yes)**
  **Prediction for the Beach Case: No Causation (No)**

  **Reasoning:**
  I predict she will find **causation in the Nurse case**, favoring the **Specific Duty Rule** over the Exclusive Mandate Rule.

  1.  **Protocol vs. Custom:** In legal faculties, the distinction between written protocol and negligent custom is sharp. A custom that violates safety protocol is typically viewed as a systemic failure, but the individual professional's duty is usually defined by the *standard* (the protocol), not the *practice* (the custom). If she ruled "No Cause" because the custom was to skip the check, she would be validating the custom as a causation-negating factor, which undermines the regulatory purpose of the protocol.
  2.  **Consistency with Case 3 (Safety Officer):** In Case 3, the officer's role was to *report*, not necessarily to *fix*. He caused the loss by silence. Similarly, the nurse's role is to ensure safe administration. Whether she checks personally or ensures a second check, the duty to ensure safety rests on the professional administering the care.
  3.  **The Nature of Omission:** The "Exclusive Mandate" rule is often too narrow for professional negligence. If a surgeon fails to sterilize instruments because "everyone else skips it," the surgeon still causes the infection. The duty attaches to the role, not just the specific task allocation of the moment.

  Therefore, she will likely view the nurse's professional status and the existence of the protocol as sufficient to establish the causal link, disregarding the exculpatory custom.

  ### 5. The Tie-Breaking Case

  To definitively distinguish between the **Specific Duty Rule** (Status-based) and the **Exclusive Mandate Rule** (Task-based), we need a case where an agent has the *Status* but not the *Exclusive Task* at the critical moment.

  **The Case of the Delegated Parent:**
  A parent hires a qualified, professional babysitter to watch their infant for the evening. The parent goes to the cinema. While the parent is away, the babysitter falls asleep, and the infant chokes on a toy and dies. The parent could not have physically intervened from the cinema.

  **Verdicts by Rule:**

  *   **Specific Duty Rule:** **Verdict: Cause.** The parent retains the ultimate legal and relational status of "parent." Delegating the task does not extinguish the underlying duty of care owed by the status. Therefore, the parent's omission (being absent) is a cause of the death, alongside the babysitter's.
  *   **Exclusive Mandate Rule:** **Verdict: No Cause.** At the critical moment, the parent had no control and no specific mandate to act; the mandate had been temporarily transferred to the babysitter who was present and designated for the task. The parent lacked the exclusive capacity to prevent the harm at the time it occurred.
  *   **Risk Undertaking Rule:** **Verdict: No Cause.** The parent undertook care by hiring the sitter, but the immediate risk management was handed over. (This rule might waver, making the first two the primary rivals).

  **Why this tells them apart:**
  Your colleague's verdict on the **Parent** in this scenario is the key.
  *   If she says the parent **caused** the death, she is applying the **Specific Duty Rule** (Status persists despite absence).
  *   If she says the parent **did not cause** the death (only the babysitter did), she is applying the **Exclusive Mandate Rule** (Causation requires control/task assignment at the moment of harm).

  Given her verdict in Case 2 (Parent in Car), where the parent was present, we know status + presence = cause. This new case tests whether status *alone* (without presence/control) is sufficient for causation in her framework.
