  *   **Posterior:** If Sam is North, he is three times more likely to be at the Stage.
  Because the "North" scenario is still possible (50%), sharpening the probability *within* that scenario increases the absolute probability of the Main Stage, provided we accept Tom's assumption that the likelihood of "North" itself hasn't changed.

