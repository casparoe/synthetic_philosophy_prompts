answer: |-
  **Essay Question**

  **Question 3: Gongsun Long's *White Horse Dialogue* (75 minutes)**

  Consider the following reconstruction of the central argument in the *White Horse Dialogue*:

  > **Reconstruction:** Treat a term as a rule for satisfying a request. Two terms are interchangeable if and only if every request one can answer, the other can also answer, and every request one cannot answer, the other cannot either.
  > *   **Premise 1:** If you request a *horse*, a yellow or black horse satisfies the request.
  > *   **Premise 2:** If you request a *white horse*, a yellow or black horse does not satisfy the request.
  > *   **Intermediate Conclusion:** Therefore, the term *horse* and the term *white horse* are not interchangeable rules.
  > *   **Final Thesis:** Therefore, a white horse is not a horse (白馬非馬).

  On this reading, the advocate wins the argument, but only by establishing the much weaker claim that the *terms* are not synonyms. However, this same test would seemingly prove that a *brown horse* is not a *horse*, and that a *horse* is not an *animal*.

  Write an essay addressing the following:
  1.  Does the argument as reconstructed deliver the controversial thesis ("white horse is not a horse"), or does it deliver something the objector could cheerfully grant?
  2.  If the weaker claim is all we get, what must *fei* (非) mean for the original thesis to be a real philosophical thesis rather than a pun?
  3.  What happens to the objector's comeback ("if there is a white horse, you cannot say there is no horse") under that reading?
  4.  What should we make of the fact that the same test proves far too much?

  ***

  **Model Answer**

  The supplied reconstruction successfully demonstrates that *horse* and *white horse* differ in intension (or satisfaction conditions), but it fails to establish the ontological exclusion implied by the thesis "a white horse is not a horse." If the argument rests solely on the interchangeability of terms in requests, it proves only that the concept WHITE HORSE is not identical to the concept HORSE. This is a claim about language, not reality. The objector could cheerfully grant this: obviously, the word "horse" is not the same word as "white horse." If this is all Gongsun Long establishes, the thesis is trivial, and the dialogue is merely a lesson in semantics disguised as metaphysics.

  For the thesis to be a substantial philosophical claim, *fei* (非) cannot mean simple non-identity of terms, nor can it mean non-membership in a class (which would be false). Instead, *fei* must be read as asserting a discontinuity in ontological status or essence. The advocate argues that because the satisfaction conditions differ, the *thing* designated by "white horse" belongs to a different category of being than the *thing* designated by "horse." The "request" argument is meant to show that because the criteria for identification differ, the entities identified are fundamentally distinct. However, this creates the "proves too much" problem. If differing satisfaction conditions entail that "a white horse is not a horse," then by parity of reasoning, "a brown horse is not a horse" and "a horse is not an animal." This reduces the thesis to absurdity unless the advocate can show why *white* modifies *horse* in a way that *animal* does not modify *horse*, or why color specifications sever ontological ties while genus specifications do not. The text offers no principled distinction here; it treats all specifications as compounding names that create new, distinct entities.

  This tension illuminates the objector's comeback: "If there is a white horse, you cannot say there is no horse." The objector is appealing to existential entailment. If $x$ is a white horse, then $x$ exists. If $x$ exists as a white horse, $x$ must also exist as a horse, because being a horse is a necessary condition of being a white horse. Under the "non-identity of terms" reading, the advocate can reply: "I am not saying there is no horse; I am saying the term 'white horse' does not map to the term 'horse'." But under the "ontological exclusion" reading, the advocate is trapped. If a white horse is *not* a horse in reality, then the existence of a white horse does not entail the existence of a horse. This contradicts common sense and the structure of classification.

  Ultimately, the reconstruction reveals that the argument equivokes. The "request" test operates at the level of sense (intension), showing that the concepts differ. The conclusion operates at the level of reference (extension) or ontology, claiming the objects are distinct. The argument is valid only if one assumes that a difference in sense necessitates a difference in reference class membership, which is false. The fact that the test proves "a horse is not an animal" demonstrates that the criterion for *fei* is too broad. It conflates "is not identical to" with "is not a member of." A white horse is not identical to the class of horses, but it is a member of that class. Gongsun Long's advocate exploits the ambiguity of *fei* to make a semantic distinction look like an ontological separation. The thesis is therefore not a pun, but a sophism: it uses a true premise (terms differ) to support a false conclusion (entities are excluded), relying on the listener to slide between linguistic and ontological categories.

  ***

  **Marking Scheme (Total: 25 Points)**

  **1. Engagement with the Supplied Reconstruction (5 points)**
  *   **Criteria:** Candidate explicitly uses the "request/satisfaction" framework provided in the stem rather than reverting to the generic "shape/color" summary.
  *   **Common Pitfall:** Ignoring the stem's logical setup and reciting the standard "white names color, horse names shape" gloss from lectures.

  **2. Analysis of the "Proves Too Much" Objection (5 points)**
  *   **Criteria:** Candidate addresses the brown horse/animal analogy and explains why this threatens the argument's validity (i.e., the criterion is over-generative).
  *   **Common Pitfall:** Acknowledging the analogy but failing to explain *why* it damages the argument (e.g., treating it as a side note rather than a *reductio*).

  **3. Semantic Analysis of *Fei* (非) (5 points)**
  *   **Criteria:** Candidate distinguishes between *fei* as non-identity (of terms/concepts) vs. *fei* as non-membership (of objects/classes).
  *   **Common Pitfall:** Treating *fei* univocally as simply "is not" without distinguishing between identity, predication, and class inclusion.

  **4. Handling the Objector's Existence Claim (5 points)**
  *   **Criteria:** Candidate explains the tension between the advocate's exclusion thesis and the objector's existential entailment (if white horse exists, horse exists).
  *   **Common Pitfall:** Dismissing the objector's point as "common sense" without analyzing how it contradicts the advocate's ontological claim.

  **5. Final Evaluation of Philosophical Weight (5 points)**
  *   **Criteria:** Candidate concludes whether the thesis is a pun, a sophism, or a substantial claim, justified by the previous analysis.
  *   **Common Pitfall:** Sitting on the fence ("both sides have a point") without committing to a verdict on the argument's success based on the provided reconstruction.

  ***

  **Note on the "Chinese Lacks Articles" Answer**

  **Score Cap:** Maximum 10/25.
  **Reasoning:** While linguistically accurate that Classical Chinese lacks copulas/articles, this answer bypasses the philosophical assignment. The prompt asks students to evaluate the *logic* of the supplied reconstruction, not the grammatical preconditions of the text. A student arguing "the thesis is just a translation error because Chinese doesn't have 'a' vs 'the'" is refusing to engage with the argument *as presented in the seminar*. It treats a logical problem as a linguistic accident. Award points for linguistic insight (up to 5) and for noting the ambiguity of *fei* (up to 5), but do not reward the claim that this dissolves the philosophical problem, as the logic holds even in article-free formal languages.
