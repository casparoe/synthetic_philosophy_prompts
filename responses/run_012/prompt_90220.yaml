prompt: |-
  OK so I'm a TA for this interdisciplinary seminar — technically it's housed in archaeology but half the room is from history and philosophy, and the title is something like "Decline and Fall: Narratives of Civilizational Collapse." I've been given the job of writing the hard take-home question for the unit on collapse, and I need it to be hard in a specific way: it should be unanswerable by reciting the standard Diamond-vs-the-revisionists routine (the Easter Island ecocide story and the rebuttal, the Classic Maya "collapse" that was arguably a political reorganization with the population staying put, the Late Bronze Age systems collapse that some people insist was just a bumpy transition). What I want instead is a question that makes them commit to a unit of analysis — polity, population, institution, cultural tradition, whatever — and defend why that's the right unit, and then notice that the word "collapse" might be doing evaluative work rather than descriptive work. There's a move here I find really interesting and I want the question to push them toward it: collapse is agent-relative and observer-relative. For a Mycenaean palace elite the twelfth century BCE is the end of the world; for a farmer paying tribute to that palace it might be a liberation; for a modern archaeologist it's a chapter heading. So "did X collapse?" is partly a question about whose standpoint we're describing and what we're tacitly assuming has value.

  Here's what I need, and please put on your archaeologist-plus-philosopher-of-history hat and actually think it through before you write anything — maybe sketch the two or three possible lines an answer could take, then pick the strongest: (1) the exam question itself, aimed at a final-year / early-grad level, that sets up the above without spelling out the answer; it should ask them to take two of the three cases (Aegean Bronze Age, Classic Maya, Rapa Nui) and argue whether the label "collapse" is warranted, specifying the unit of analysis and addressing whether the term is descriptive, evaluative, or both. (2) A model answer of roughly 700–800 words that would get top marks — and here be careful not to just name-drop, since the students can't look anything up either, so keep the argument self-contained and don't lean on specific book titles or dates. (3) A marking scheme out of 25 built around five must-hit points, with the marks for each and a one-line note on how students typically get each one wrong (e.g. by treating "collapse" as obviously bad, or by sliding between units of analysis mid-argument without noticing). And at the very end, add a short note addressed to me and not the students: where is the model answer's own line most contestable, and what could a strong candidate argue that would make you definately revise it? I'd rather know where you're least confident than get something that sounds equally sure of every seperate clause.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Role:** TA for an interdisciplinary seminar (Archaeology/History/Philosophy) titled "Decline and Fall: Narratives of Civilizational Collapse."
      *   **Task:** Create a hard take-home exam question, a model answer (700-800 words), and a marking scheme (out of 25).
      *   **Specific Constraint:** The question must avoid the standard "Diamond vs. Revisionists" debate (ecocide vs. resilience). It must force students to commit to a *unit of analysis* (polity, population, institution, culture) and interrogate the normativity of the word "collapse" (agent-relative/observer-relative).
      *   **Cases:** Choose two of three: Aegean Bronze Age, Classic Maya, Rapa Nui.
      *   **Model Answer Requirements:** Top marks, self-contained (no specific dates/book titles), philosophical depth regarding the term "collapse."
      *   **Marking Scheme:** 5 must-hit points, marks allocated, common pitfalls noted.
      *   **Meta-Commentary:** A note to the TA explaining where the model answer is most contestable/vulnerable.

  2.  **Deconstruct the Core Philosophical/Archaeological Problem:**
      *   The prompt highlights that "collapse" is not an objective physical state like "boiling water." It is a value-laden description dependent on *what* is being measured (the unit) and *who* is doing the measuring (the standpoint).
      *   *Unit of Analysis:* If the unit is "Palace Bureaucracy," the Late Bronze Age definitely collapsed. If the unit is "Rural Peasant Caloric Intake," it might not have.
      *   *Normativity:* "Collapse" implies a negative valuation. Who suffers? Who benefits?
      *   *Goal:* Move students from "Did it happen?" to "What are we describing when we say it happened, and whose loss counts?"

  3.  **Drafting the Exam Question:**
      *   Needs to be precise but open-ended.
      *   Must explicitly demand the unit of analysis and the normative critique.
      *   *Drafting:* "Select two cases... Argue whether 'collapse' is warranted... Define your unit... Discuss descriptive vs. evaluative nature."
      *   *Refining:* Make it punchier. Force the tension between continuity and discontinuity.

  4.  **Developing the Model Answer:**
      *   *Constraint:* 700-800 words.
      *   *Strategy:* I need to pick two cases (Aegean and Maya are usually richer for this specific argument than Rapa Nui, which often gets bogged down in the ecocide debate I'm trying to avoid, though Rapa Nui is good for population vs. culture. Let's stick with Aegean and Maya as they offer clear elite vs. commoner distinctions).
      *   *Argument Structure:*
          1.  Introduction: Define "collapse" as problematic. Thesis: Collapse is real for institutions, often illusory for populations, and the term masks normative judgments.
          2.  Case 1 (Aegean): Unit = Palatial Bureaucracy. Yes, it collapsed. But for whom? Elite loss = Commoner potential gain (less tribute).
          3.  Case 2 (Maya): Unit = Political Hegemony vs. Population. Cities abandoned, people stayed. "Collapse" is a projection of state-centric views.
          4.  Synthesis: The term "collapse" privileges complexity/centralization as inherently good. It is observer-relative (archaeologist sees broken pots; peasant sees freedom).
          5.  Conclusion: We should specify *what* collapsed rather than using the blanket term.
      *   *Tone:* Academic, philosophical, archaeologically grounded but not date-heavy.
      *   *Word Count Check:* Need to be careful not to ramble. Keep it tight.

  5.  **Designing the Marking Scheme:**
      *   Total: 25 marks.
      *   5 Criteria (5 marks each).
      *   1. Unit of Analysis Definition.
      *   2. Application to Case 1.
      *   3. Application to Case 2.
      *   4. Normative/Evaluative Critique (The "Who loses?" question).
      *   5. Synthesis/Conclusion on the utility of the term.
      *   *Pitfalls:* Sliding units, treating collapse as inherently negative, factual overreach (dates/names), ignoring the observer standpoint.

  6.  **Developing the Meta-Commentary (Note to TA):**
      *   Where is my model answer weak?
      *   *Vulnerability:* I might be overstating the "liberation" of the commoner. In the Aegean, post-palatial life was arguably more violent and insecure, not just "free." A strong student could argue that *security* is a value provided by the state, and its loss is a collapse for everyone, not just elites.
      *   *Alternative:* A strong student might argue that "culture" is the unit, and if literacy/monumentality vanishes, that *is* a collapse regardless of caloric intake, because human potential was lost. This challenges the materialist bias of my model answer.

  7.  **Review and Refine:**
      *   *Check Question:* Does it forbid the Diamond/Revisionist routine? Yes, by focusing on the *term* "collapse" and *units*, not causes (ecocide vs. climate).
      *   *Check Model Answer:* Is it too specific? I need to avoid saying "1200 BCE" or "Jared Diamond." Use "Late Bronze Age" and "scholars of ecological determinism."
      *   *Check Word Count:* Aiming for ~750 words.
      *   *Check Tone:* Ensure it sounds like a philosopher-archaeologist wrote it.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the model answer, make sure I don't just say "it depends." I need to take a stance. The stance is: "Collapse is a valid description of *institutions*, but a misleading description of *societies*."
      *   *Correction:* Ensure the marking scheme clearly distinguishes between describing the event and evaluating the term.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).

  *(Self-Correction on Word Count during drafting the model answer)*: I need to be careful. 700-800 words is actually quite short for two cases plus philosophical heavy lifting. I will need to be concise. I will focus on the *logic* of the argument rather than exhaustive detail on the cases.

  *(Self-Correction on Marking Scheme)*: Make sure the "common error" is specific to the prompt's requirements (e.g., failing to notice the evaluative load).

  *(Self-Correction on Meta-Note)*: Be honest about the "commoner liberation" thesis. It's controversial.

