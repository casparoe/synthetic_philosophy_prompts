      *Refining the argument:* The user argued "a law tying X to Y doesn't turn Y into a signal about X unless X does something to Y." I need to push back on that specifically. In the thermometer case, X (heat) does something to Y (mercury). In epiphenomenalism, the physical cause (brain state) causes both the report and (via psychophysical law) the experience? Or the physical cause causes the brain state, and the brain state nomologically necessitates the experience? Usually, epiphenomenalism says physical -> experience. But the prompt says "not even the brain states they're paired with." So the experience doesn't cause the brain state. The brain state causes the experience? No, that would make the experience an effect. The prompt says "cause absolutely nothing". So the experience is a side-effect of the physical process, but doesn't feed back. So Physical Process -> Brain State (causes speech) + Experience (caused by Physical Process?). Wait, if experience causes nothing, it must be caused by something (otherwise it's uncaused magic). Standard epiphenomenalism: Physical -> Experience. Experience -> Nothing.
      So, the Brain State (physical) causes the Speech. The Physical Process also causes the Experience. Thus, Brain State and Experience are correlated via common physical cause.
      The user says: "a law tying X to Y doesn't turn Y into a signal about X unless X does something to Y."
      My counter: That's not how information works. Smoke signals fire even if the smoke doesn't cause the fire. The direction of causation doesn't dictate the direction of representation. The brain state is the smoke, the experience is the fire (metaphorically). Actually, better: The brain state is the meter reading, the experience is the temperature. The temperature doesn't cause the reading directly? Wait, heat causes expansion.
      Let's stick to the indicator theory resource: "a state can represent whatever it's reliably correlated with, even when the correlation runs the wrong way or comes from a common cause."
      So I just need to assert that reliable correlation is enough, even if the causal arrow is Physical -> Brain State & Physical -> Experience. The Brain State correlates with Experience. Therefore Brain State represents Experience.

      *Revised Draft:*
      You're pressing the hardest point, and I'll concede it feels grotesque: I'm claiming to refer to something that never touches the referring mechanism. But your demand that X must cause Y to be represented by Y is too strong, even for a physicalist. Consider a shadow: it tracks your movements perfectly, reliable as clockwork, but the shadow doesn't cause your movements. If I had a device that read the shadow's shape to describe your pose, it would be accurate, even though the shadow is causally inert regarding your body. My brain state is like that device; it's tuned to the physical processes that nomologically necessitate the experience. The experience and the brain state are locked together by law, even if the experience doesn't push back. The content is fixed by that reliable covariance, not by a causal handshake from the qualia to the neurons.

      And yes, the zombie says the same words. The physics fixes the utterance, completely. But when the zombie says "I feel pain," it's a false alarm, a complex noise generated by survival circuits. When I say it, the utterance is physically identical but it lands on a target that actually exists. The difference isn't in the causal history of the speech—that is identical—but in the fact that my speech is veridical. I'm not dodging the cost: consciousness is a spectator, and I can't show you my ticket in a lab. But if you accept causal closure and still think consciousness is real, you've already accepted it doesn't move matter; I'm just accepting that it doesn't move information either, except by being the thing the information is about.

      Bottom line: Reliable covariance establishes reference even without causal efficacy, so my brain state can track my experience even if the experience doesn't trigger the state.

