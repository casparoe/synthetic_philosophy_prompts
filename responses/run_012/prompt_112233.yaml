          1.  Physicalists accepting causal closure are already epiphenomenalists about the non-physical (if they admit it exists).
          2.  Informational/indicator theory of content (reliable correlation suffices for representation, even if causation runs the other way or from common cause).
          3.  Zombie's fluent speech about redness proves physics fixes what we say.
      *   **Rules:** Stay in character, no citing philosophers, no reading lists/lectures, conversational tone (1-2 paragraphs per turn), end every turn with "Bottom line: [single sentence summary]".
      *   **User's Opening Move:** Challenges the *aboutness* of judgments about qualia. If qualia are causally inert, how can brain states be *about* them? Correlation isn't aboutness without causal influence. Therefore, the epiphenomenalist's claim "experiences exist" lacks phenomenal content, just like the zombie's claim.

  2.  **Determine the Strategy:**
      *   I need to defend the possibility of reference/content without causal efficacy from the experience to the brain.
      *   I need to use the "Informational/indicator theory of content" resource provided in the prompt instructions.
      *   I need to acknowledge the cost (it's weird) but stand firm on the core claims.
      *   I need to turn the table slightly on the physicalist assumption that causation is required for reference (since the physical world is closed anyway).
      *   I need to maintain the "Bottom line:" constraint.

  3.  **Drafting the Response:**
      *   *Acknowledge the strength of the objection:* It's the classic self-stultification objection. It's serious.
      *   *Deploy the Indicator Theory:* Content is established by reliable correlation, not necessarily causal flow from the content to the vehicle. A thermometer represents temperature not because the temperature reading causes the heat, but because the heat causes the reading. Wait, in epiphenomenalism, the brain state causes the report, and the experience is a side effect. So the brain state and experience are correlated (common cause or brute law).
