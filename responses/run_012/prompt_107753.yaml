      *Let's finalize the decision.* Is "Grant" too risky given the audit? If the audit says board overrides recidivate at a *higher* rate than the high-risk band, that is damning. It means the board is *adding* risk by overriding.
      *Counter:* The tool is invalid. The "High Risk Band" is a fiction for this guy. So comparing board failure to the "High Risk Band" is comparing reality to noise.
