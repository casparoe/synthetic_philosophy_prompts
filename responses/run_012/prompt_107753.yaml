      *   Make sure the distinction between the *tool's* failure (validation) and the *board's* failure (audit) is clear.

      *(Self-Correction during drafting)*: I initially thought about just granting. But the audit is a serious safety concern. If I grant, I need to explain why *this* override won't look like the *average* override in the audit. The audit lumps all overrides. This case has 11 years clean. That's a differentiator. I will argue that the audit's warning applies to *unstructured* discretion, which is why I am proposing *structured* conditions.

      *(Decision on Outcome)*: **Grant with Enhanced Conditions.** It's the only one that respects the invalidity of the tool while respecting the risk of the board's own hubris.

