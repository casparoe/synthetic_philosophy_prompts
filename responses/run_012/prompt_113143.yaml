answer: |-
  A large public university proposes a standing policy requiring all 10,000 enrolled students to pay a mandatory annual "Inclusion Fee" of $50 to fund specialized accommodations for five students with severe sensory processing disorders, without which those five would be forced to withdraw. For the 10,000, the burden is a modest material loss of disposable income; for the five, the burden of policy rejection is the severe relational and educational loss of exclusion from the university community. The cumulative financial burden on the many ($500,000) is plainly greater than the educational loss suffered by the few, yet no single student's $50 loss constitutes a complaint stronger than the complaint of any single excluded student facing withdrawal. A rule-consequentialist would plausibly endorse the policy to maintain the institution's inclusive mission, but the burdens differ in kind: material welfare for the many versus educational access for the few.

  (1) **Policy, Parties, and Burdens:** The policy is a mandatory $50 annual fee on all 10,000 students (the Many) to prevent the withdrawal of 5 disabled students (the Few). The Many bear a modest material burden; the Few face a severe educational and relational burden if the policy is rejected.

  (2) **Scanlonian Verdict:** A Scanlonian who refuses to aggregate compares the strongest individual complaint against the policy (a $50 loss) with the strongest individual complaint against rejecting it (loss of education). Since the loss of education is significantly weightier than a $50 loss, the Many cannot reasonably reject the principle permitting the policy, so the policy is **permissible**.

  (3) **Aggregating Verdict:** A contractualist who aggregates complaints sums the 10,000 material complaints ($500,000 total loss) and weighs them against the Few's educational loss. Because the cumulative material burden is plainly greater, the aggregated complaints of the Many outweigh the complaints of the Few, making the policy **impermissible**.

  (4) **Mixed Verdict:** The mixed view aggregates the Many's material complaints but treats them as a different kind than the Few's educational complaints. It holds that aggregated material losses cannot straightforwardly outweigh individual educational access, but the substantial sum creates a secondary obligation. Thus, the policy is **permissible only if accompanied by a rebate scheme** for the Many, a verdict distinct from both unconditional permissibility and impermissibility.

  (5) **Divergence Feature:** The exact feature is the **incommensurability of burden kinds** (material vs. educational) combined with **high numbers**. If the burdens were of the same kind (e.g., all material), the Mixed view would collapse into the Aggregating view (rejecting the policy); if the numbers were low, the Aggregating view would collapse into the Scanlonian view (accepting the policy).

  (6) **Anti-Aggregation Defense:** A defender of the anti-aggregation reading would argue that the case is not a counterexample because the Many's complaints are not "relevantly similar" enough to aggregate even in the mixed sense, or that the severe nature of the Few's burden renders the Many's cumulative material loss irrelevant, thereby maintaining that the policy is simply permissible without the need for the Mixed view's compensatory caveat.
