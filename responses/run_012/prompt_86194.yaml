answer: |-
  Good morning. To those being sworn in today: welcome. To your families and friends: welcome. To the neighbors, officials, and residents of Harborview who have joined us: thank you for being here.

  There is a specific weight to this room today. In a few moments, you will raise your right hands and take an oath. You will pledge allegiance to a Constitution, to a flag, and to a people you have chosen. For some of you, this journey has taken years. For others, a lifetime. When you finish that oath, your legal status changes. You move from the outside to the inside. You become, in the eyes of the law, a member of the American demos.

  I stand before you as your Mayor, but also as a student of the questions that underlie our laws. And because I respect you, and I respect the office I hold, I cannot offer you platitudes today. I cannot tell you that the lines we draw between us are simple, because they are not. I cannot tell you that the boundaries of our community are fixed by nature, because they are not. They are chosen. And the choosing of them is the hardest work we do.

  We are gathered here to celebrate your entry into the circle of citizenship. Yet, as many of you know, next week our city will vote on a referendum that asks whether that circle should be drawn differently for municipal elections. The measure asks if residents who have lived here five years, paid taxes, and sent children to our schools should vote, even if they are not yet citizens.

  I am aware that holding this ceremony one week before that vote creates a tension in this room. I know some of you worry that your naturalization is being used as a prop in a political fight. Let me be absolute on this point: It is not. Your citizenship is not a bargaining chip. It is not a precedent to be leveraged or a compromise to be managed. It is a completed fact. When you leave this hall, you will possess a right that no referendum can grant or revoke. I welcome you not because of what you might vote for, but because of who you have sworn to be.

  However, because I owe you the truth, and because I owe this city an honest accounting of its own structure, I must speak to the paradox that hangs over us.

  In political philosophy, there is a question known as the boundary problem. It asks: Who gets to decide who belongs to the community? In a democracy, the people decide. But who are "the people"? Only those who already belong. So, the insiders decide who becomes an insider. The circle defines itself.

  This is not a flaw in our system; it is the condition of it. But it means that every time we debate voting rights, we are standing on ground that is necessarily unstable. We are asking a group of voters to decide if they should become smaller or larger. That is a profound ask. It requires current voters to vote on the value of their own exclusivity.

  I mention this not to confuse you, but to honor the gravity of what happens next week. I cannot stand here and tell you that the referendum is a simple matter of kindness. It is a matter of power. Nor can I tell you that the current boundary is the only legitimate one. As you prove today, commitment is not solely a matter of birthright. It is a matter of promise.

  So, how do we navigate this circle without breaking it?

  We navigate it by recognizing that while boundaries are necessary, they must be permeable to the reality of shared life. A city is not just a legal jurisdiction; it is a web of mutual dependence. When a neighbor's flood risk rises, so does yours. When a neighbor's child learns to read, our economy grows. When a neighbor works a second shift to keep a local business open, we all benefit.

  The boundary problem teaches us that there is no perfect line between member and stranger. There is only the line we draw to manage our shared fate. If the purpose of the boundary is to protect the community's ability to govern itself, then we must ask: Does excluding long-term residents strengthen that ability, or weaken it?

  This is where I must move from observation to position. As your Mayor, I have a responsibility to interpret the health of our democracy. The paradox of the boundary implies that since no line is naturally perfect, we must judge lines by how well they reflect the reality of who is actually doing the work of living together.

  You, the new citizens, are proof that the boundary can be crossed. You have shown that legal status and moral commitment can align. But there are people in Harborview who have aligned their lives with this city just as deeply as you have, who remain on the other side of the municipal line. They fix our streets, teach our children, and pay the taxes that fund this hall.

  Therefore, I will be voting in favor of the referendum next week.

  I do not take this position because I believe boundaries do not matter. They do. Citizenship matters. That is why we are here. I take this position because the logic of the boundary problem demands humility. Since we cannot claim our current electorate is the only possible legitimate electorate, we should err on the side of including those who share the burdens of the city. To deny the vote to those who share our fate is to create a class of subjects in a republic of citizens. That weakens the "we" in "we the people."

  Extending the municipal vote does not diminish your citizenship. It acknowledges that the city is a layer of community where presence and contribution are the truest currencies. It acknowledges that the circle is not a fortress, but a threshold.

  To those in the room who oppose the measure: I hear your concern. You worry that diluting the franchise weakens the bond of nationality. That is a serious argument. But I ask you to consider that a bond is strengthened when those who are bound by the laws have a say in writing them. The stability of Harborview depends on all of us feeling that the government answers to us.

  And to the new citizens: I know this is a lot to absorb on a day of such personal triumph. You might wonder why I am complicating your joy with political philosophy. I do it because your oath is the anchor in this storm. Regardless of next week's vote, you belong here. Your voice matters. Your vote in federal and state elections is secure. You are not the question; you are part of the answer.

  The boundary problem reminds us that democracy is not a machine that runs itself. It is a practice. It requires us to constantly examine who we are including and why. It requires us to look at the circle, acknowledge that we drew it, and ask if it still serves the people living within it—and those standing just outside the gate, knocking.

  Today, we open the gate for you. Welcome inside. Next week, we will decide whether to widen the porch. Whatever the outcome, let us conduct that debate with the same solemnity we bring to this ceremony. Let us remember that the goal is not to protect a privilege, but to sustain a community.

  Thank you. Welcome to Harborview. Welcome to the United States. Let us get to work.
